prompt: |-
  I host a small podcast that's basically an offshoot of my blog — audience is mostly people who read the rationalist blogs plus a handful of political philosophy grad students, so I can assume they know what brute and option luck are but not much past that. Next month's guest is an economist-turned-philosopher shopping around a book manuscript. His thesis is that luck egalitarianism has been aimed at the wrong target all along: instead of compensating people for the effects of brute luck, we should try to equalize how much brute luck each person is exposed to over the course of a life. He calls it the variance view. I honestly can't tell if it's a real position or a motte-and-bailey, but I want the interview to make him do actual work.

  You're a philosopher who knows the distributive justice literature cold, and also a good interviewer — the kind who hears the stock answer coming and already has the next question loaded. Start with a few lines brainstorming where the variance view is genuinely vulnerable, then draft eight to ten questions. I want at least one pressing the leveling-down objection as it applies to the distribution of exposure to luck rather than to outcomes, at least one on the harshness/abandonment objection (what does the view say about someone who gambles away their savings, or about the "unfortunate" whose situation can only be improved in ways that look paternalistic), and at least one on whether the variance view collapses into prioritarianism or into Dworkin's hypothetical insurance market in disguise. For each question, give me a one-line note on the answer he's most likely to reach for and a follow-up that survives that answer. No softballs, and please no "what drew you to this topic."

  One more thing, I don't want to get embarassed on air: seperate clearly what's a live dispute among people who actually work on distributive justice from what's your own extrapolation, and don't present a contested claim as if it's the consensus. If the view I described doesn't map cleanly onto anything in the literature, say so and tell me which existing position it's closest to.
reasoning: |-
  Here's a thinking process that leads to the suggested interview guide:

  1.  **Analyze the Request:**
      *   **Host/Context:** Small podcast, offshoot of a blog. Audience: Rationalist blog readers + political philosophy grad students. They know brute/option luck but aren't experts.
      *   **Guest:** Economist-turned-philosopher, shopping a book manuscript.
      *   **Guest's Thesis:** "Variance View" of Luck Egalitarianism (LE). Instead of compensating for *effects* of brute luck, equalize *exposure* to brute luck over a life.
      *   **Host's Concern:** Is this real or motte-and-bailey? Wants the guest to do actual work.
      *   **My Role:** Philosopher/expert in distributive justice + skilled interviewer.
      *   **Deliverables:**
          1.  Brainstorming vulnerabilities of the "Variance View."
          2.  8-10 hard-hitting questions.
          3.  For each question: Likely answer + Follow-up.
          4.  Specific required topics: Leveling-down objection (applied to exposure), Harshness/Abandonment objection (gamblers/paternalism), Collapse into Prioritarianism/Dworkin.
          5.  Constraint: Distinguish live disputes from extrapolation/consensus. Don't embarrass the host.
          6.  Constraint: No softballs (e.g., "what drew you to this").

  2.  **Evaluate the "Variance View" (Philosophical Due Diligence):**
      *   *Is this a standard view?* No. Standard Luck Egalitarianism (Cohen, Arneson, Knight) focuses on *compensating* for brute luck disadvantages to ensure outcomes (or opportunities) aren't determined by luck.
      *   *What is the guest proposing?* Equalizing the *variance* or *exposure* to brute luck. This sounds like "ex-ante" luck egalitarianism or perhaps a variant of "equalizing opportunity for welfare" but shifted to the *risk profile* itself.
      *   *Closest existing positions:*
          *   **Ex-ante Luck Egalitarianism:** (e.g., Otsuka, Voorhoeve). Focuses on prospects before the luck strikes.
          *   **Equalizing Opportunity:** (Arneson). But usually opportunity *for welfare*, not opportunity *to be lucky*.
          *   **Risk-Sensitive Egalitarianism:** Some literature on distributing risk itself (e.g., distributive justice and risk).
          *   **Motte-and-Bailey Risk:** The motte might be "we should mitigate systemic risks" (plausible). The bailey might be "we should ignore compensation for actualized bad luck if the exposure was equal" (controversial/harsh).
      *   *Vulnerabilities:*
          1.  **Measurement:** How do you measure "exposure to brute luck" independently of outcomes?
          2.  **The "Bad Luck" Problem:** If I expose you to high risk but you get lucky, and I expose me to low risk but I get unlucky, have we achieved justice? The guest says yes (exposure equalized), but intuition says the unlucky person is worse off through no fault of their own.
          3.  **Leveling Down:** To equalize exposure, do we make the safe person less safe rather than making the risky person safer?
          4.  **Agency:** Does this view ignore option luck too much? If I choose high variance, is that okay?
          5.  **Collapse:** If you equalize exposure to bad outcomes, isn't that just maximizing the floor (Prioritarianism) or buying insurance (Dworkin)?

  3.  **Drafting the Brainstorming Section:**
      *   Need to be honest about the literature status. It's not a standard label.
      *   Identify the core tension: Ex-ante vs. Ex-post.
      *   Highlight the "expensive tastes" vs. "expensive risks" parallel.
      *   Note the distinction between *distributing risk* and *compensating for risk realization*.

  4.  **Drafting the Questions (Iterative Process):**
      *   *Goal:* 8-10 questions. Hard-hitting. Specific follow-ups.
      *   *Requirement 1:* Leveling-down (exposure version).
      *   *Requirement 2:* Harshness/Abandonment (gamblers/paternalism).
      *   *Requirement 3:* Collapse (Prioritarianism/Dworkin).
      *   *Audience Check:* Keep jargon accessible but precise (they know brute/option luck).

      *   *Drafting Q1 (Conceptual Clarity):* Define "exposure." Is it probability or magnitude?
      *   *Drafting Q2 (Leveling Down):* If one group is safe and one is risky, do we endanger the safe?
      *   *Drafting Q3 (Realized Luck):* Two people have equal exposure. One gets hit by lightning, one doesn't. Do you compensate? (Crucial for LE).
      *   *Drafting Q4 (Harshness/Abandonment):* The gambler. If exposure was equal, do we let them starve?
      *   *Drafting Q5 (Paternalism):* Reducing exposure might mean restricting liberty.
      *   *Drafting Q6 (Measurement/Epistemics):* How do we know exposure levels?
      *   *Drafting Q7 (Collapse - Dworkin):* Is this just hypothetical insurance against risk?
      *   *Drafting Q8 (Collapse - Prioritarianism):* Is this just giving priority to the risky?
      *   *Drafting Q9 (Temporal/ Life-course):* "Over the course of a life." How do we track this?
      *   *Drafting Q10 (The "So What?"):* Policy implications.

      *   *Refining Follow-ups:* Need to anticipate the "Well, actually..." answer.
      *   *Refining Tone:* Respectful but rigorous.

  5.  **Review against Constraints:**
      *   *Live Dispute vs. Extrapolation:* I need to explicitly state that "Variance View" isn't standard terminology. I need to flag where the literature is settled vs. open.
      *   *No Softballs:* Remove any "tell us about your journey" fluff.
      *   *Audience:* Rationalists/Grad Students. They will spot a logical gap immediately.

  6.  **Final Polish:**
      *   Check the "Leveling Down" question. Standard leveling down is about equality of welfare. Here it's equality of *risk*. The objection is: Is it better to have equal high risk than unequal low/high risk?
      *   Check the "Collapse" question. Dworkin's insurance is about compensating for brute luck (handicaps). If the guest says "no compensation, just equalize risk," that's distinct. But if they say "equalize risk *via* insurance," it collapses.
      *   Ensure the distinction between *ex-ante* and *ex-post* is clear, as that's the philosophical heart of this.

  7.  **Constructing the Output:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't validate the "Variance View" as a known school of thought. I must clarify it's the guest's novel contribution.
      *   *Correction:* Ensure the follow-ups don't rely on knowledge the audience doesn't have. Keep it grounded in the guest's definitions.
      *   *Correction:* The "Harshness" objection is usually against LE generally. I need to make sure it applies specifically to the *Variance* twist. (e.g., If exposure was equal, LE usually says "tough luck." Does Variance LE say the same?)

  8.  **Final Review of the "Philosopher Persona":**
      *   Sound like someone who reads *Ethics*, *Philosophy & Public Affairs*, and *JPE*.
      *   Be precise about "Motte-and-Bailey."
      *   Ensure the host doesn't look bad. The questions should make the host look prepared.

  *(Self-Correction on the "Variance View" definition)*: The prompt says "equalize how much brute luck each person is exposed to." This is technically "equalizing risk profiles." Standard LE cares about the *realization* of brute luck. This is a shift from *ex-post* compensation to *ex-ante* structural equality. This is the key tension to exploit.

