answer: |-
  Dear Colleague,

  I have spent some time reflecting on the dilemma you describe, and I believe I can offer you the verdict you seek, though I must warn you that it will not comfort those of your students who seek a purely syntactic resolution to the problem. You ask whether fitting every example can be the whole of correctness in your concept learning tasks, and the short answer is that it cannot. To claim otherwise is to confuse the extension of a concept with its intension, or to mistake the history of a rule's application for the rule itself. The disagreement you are experiencing is not merely a technical glitch in your models but a recurrence of a foundational problem in the philosophy of logic and language, specifically concerning the underdetermination of theory by data and the normativity of rule-following. Your models are operating on a principle of extensional adequacy, ensuring that their output matches the labeled inputs provided, but concept learning is inherently about intensional adequacy, which concerns the principle or reason that generates those outputs and governs future cases not yet seen.

  To make this concrete, let us construct a specific illustration of the phenomenon you are observing. Suppose you present your subjects with a set of drawings intended to teach the concept of a red object. Your positive examples are all red triangles, and your negative examples are all blue squares. A model, or indeed a logically rigorous student, might propose the rule classify an object as positive if and only if it is a triangle. This rule fits all your labeled data perfectly; every red triangle is classified correctly as positive, and every blue square is classified correctly as negative. However, when presented with a red square in the testing phase, your human subjects will classify it as positive because they have inferred the rule concerns color, whereas the model will classify it as negative because it inferred the rule concerns shape. Both rules are logically consistent with the finite sample you provided, yet only one aligns with the intended concept. The model's rule is not wrong because it contradicts the data you gave it, but because it fails to project the concept into the space of unexamined cases in the way the concept was intended to be understood. This demonstrates that consistency with past instances is necessary for correctness, but it is not sufficient.

  The crux of the matter lies in what Nelson Goodman called the problem of projectibility. Any finite set of data can be fitted by an infinite number of conflicting rules, some of which are natural and others of which are gerrymandered or accidental. When your students object that a rule fitting all the data cannot be wrong, they are adhering to a strict empiricist view where meaning is exhausted by reference to the observed instances. But human concept learning is not merely about summarizing the past; it is about establishing a norm for the future. When you teach a concept, you are not just listing examples; you are inviting the learner into a practice of classification that relies on shared assumptions about which features of the world are relevant and which are incidental. In the example I provided, the correlation between redness and triangularity in your sample was accidental, but the model treated it as essential. The correctness of the intended rule depends on its ability to capture the natural kind or the causal structure you had in mind, not merely the geometric coincidence of the sample set.

  This brings us to your concession that you sometimes set aside drawings that fit your own rule because they feel wrong to you. You seem to worry that this admission weakens your position, but philosophically, it strengthens it. It reveals that the rule you are teaching is not fully explicit in the verbal description or the selected examples; it is embedded in a broader context of judgment that Wittgenstein described as a form of life. When a drawing fits the verbal rule but feels wrong, it is because it violates the tacit inductive biases that humans share regarding what counts as a coherent category. For instance, if your rule is convex shapes but you exclude a convex shape that is grotesquely distorted, you are signaling that the concept relies on a notion of naturalness or typicality that transcends the strict logical definition. Your models lack this background context; they have access only to the extensional data, not the intensional constraints that guide human generalization. Therefore, their objection that they fit the data is true but irrelevant, because the data provided was an incomplete signal of the underlying concept.

  The disagreement you are facing, then, is fundamentally about the nature of meaning and the logic of induction. Your students and models are arguing from a position of logical positivism, where validity is determined solely by verification against available evidence. You are arguing from a position that acknowledges the role of abductive reasoning and natural kinds, where validity is determined by the explanatory power and projectibility of the hypothesis. To defend this in your paper, you must argue that concept learning tasks are not exercises in curve fitting but exercises in recovering the generator of the data. A rule that fits the data but fails to capture the generator is merely memorizing the sample, which is the antithesis of learning. You must assert that correctness in concept learning includes a constraint on simplicity or naturalness that is not present in the data itself but is brought to the task by the learner. Without this constraint, learning is logically impossible, as any future case could be classified arbitrarily without contradicting the past.

  In conclusion, you are justified in marking those models wrong. They have achieved extensional equivalence on the training sample but failed intensional alignment on the concept. You should explain in your paper that the logic of generalization requires a bias toward certain types of predicates over others, a bias that your human subjects share but your models lack. The fact that multiple rules fit the data is not a bug in your experimental design but a feature of the logical landscape you are investigating. By acknowledging that the intended rule is right because it aligns with the projectible predicates of our shared conceptual scheme, rather than because it alone fits the data, you turn a methodological vulnerability into a philosophical contribution. You are not merely testing how well machines match human output; you are testing whether they can participate in the normative practice of meaning itself. I trust this provides you with the framework you need to defend your verdict.

  Yours sincerely,

  A Friend in Philosophy
