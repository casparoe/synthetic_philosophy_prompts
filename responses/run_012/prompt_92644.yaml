  ### The Accounting

  **Predictions**
  In **Version A**, the *Moral Valence* explanation predicts an asymmetry: participants will say Arthur brought about the unpleasant smell intentionally, but not the pleasant one. The *Statistical Normality* explanation predicts symmetry: since both smells are equally standard consequences, participants should judge both as intentional (or neither). The *Skill/Control* explanation predicts symmetry, as the action is identical for both effects.

  In **Version B**, the *Moral Valence* explanation predicts symmetry: since both sounds are mildly irritating (bad), participants should judge both as intentional (or neither). The *Statistical Normality* explanation predicts an asymmetry: participants will say Arthur brought about the common hum intentionally, but not the rare click. The *Skill/Control* explanation again predicts symmetry.

  **The Survivor**
  If the literature you are sceptical of is indeed confounded, the **Statistical Normality** explanation is the one that survives both versions. It accounts for the asymmetry in Version B (where valence is held constant) and suggests the asymmetry in the original studies (and potentially Version A, if not perfectly controlled) arises because bad side effects are often implicitly treated as statistically less normal or more deviant than good ones. If Version A yields symmetry while Version B yields asymmetry, Normality is the only variable tracking the change in judgments.

  **The Feature Doing the Work**
  The single feature is **expectation of occurrence**. When an outcome is viewed as a standard, background consequence of an action, it is absorbed into the description of the action itself ("he painted the shed"). When it is viewed as a deviation from the standard course of events, it is singled out for intentional attribution.

  **Neutralising the Feature**
  If you remove or neutralise this feature—by making both side effects equally expected, as in Version A—the asymmetry should vanish. Participants would either attribute intentionality to both side effects or neither. If the asymmetry stays put despite perfect statistical matching, then Moral Valence has an irreducible role, but that would suggest Version A has failed to control for normality properly.

