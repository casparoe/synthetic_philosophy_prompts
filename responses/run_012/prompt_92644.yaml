  A proponent of the Moral Valence explanation would attack this design by arguing you have smuggled **normative expectations** into the statistical labels. They would claim that even if you state both smells are "standard consequences," participants intuitively feel that harming neighbours (burnt rubber) is *less* normal in a well-ordered world than helping them (baking bread). They would argue you cannot truly separate statistical normality from moral valence because our judgment of what is "normal" is itself laden with moral expectation. They would say Version A still contains a hidden normality confound driven by the valence itself.

