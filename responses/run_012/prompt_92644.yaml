  **Version A**
  Arthur is repainting his garden shed. He uses a specific primer he bought online. He knows this primer gives off a smell that some neighbours find pleasant, like baking bread, and also a smell that others find unpleasant, like burnt rubber. Both smells are listed clearly on the tin as standard consequences of this particular formula, occurring every single time the paint is used. Arthur doesn't care about the smells either way; he just wants the wood protected. He applies the primer. Both smells drift over the fence.

  **Version B**
  Arthur is repainting his garden shed. He uses a specific primer he bought online. He knows this primer gives off a faint hum from the drying process and also an occasional clicking sound as it sets. Both sounds are mildly irritating to neighbours, like a dripping tap. The hum is very common with this brand, happening every time. The clicking is rare, happening only in unusual weather conditions, though Arthur knows it might happen today. Arthur doesn't care about the sounds either way; he just wants the wood protected. He applies the primer. Both sounds occur.

