answer: |-
  Here is the translation of the ethical debate into your native vocabulary, followed by the residue report you requested.

  ### Part 1: The Formal Restatement

  We model the vehicle and environment as a dynamical system:
  $$ \dot{x} = f(x, u, d) $$
  Where $x \in \mathcal{X}$ is the state vector, $u \in \mathcal{U}$ is the control input (actuation), and $d \in \mathcal{D}$ is the exogenous disturbance (pedestrians, other agents, sensor noise).

  The safety constraint is defined by a safe set $\mathcal{S} \subset \mathcal{X}$ and a collision/failure set $\mathcal{C} = \mathcal{X} \setminus \mathcal{S}$.

  **The Controller:**
  Your system implements a control law $K: \mathcal{X} \to \mathcal{U}$.
  In the "ambiguous edge case," the controller computes a set of feasible inputs $\mathcal{U}_{feas} \subset \mathcal{U}$.
  Within this set, there exists a subset $\mathcal{U}_{avoid} \subset \mathcal{U}_{feas}$ such that if $u \in \mathcal{U}_{avoid}$, the forward reachable set $\mathcal{R}_t(x_0, u)$ satisfies $\mathcal{R}_t \cap \mathcal{C} = \emptyset$.
  There also exists a "null" or "baseline" input $u_{null} \in \mathcal{U}_{feas}$ (e.g., maintain current trajectory, coast, or gentle stop) where $\mathcal{R}_t(x_0, u_{null}) \cap \mathcal{C} \neq \emptyset$.

  **The Ethical Debate Translated:**

  1.  **Killing (Doing):**
      The controller selects $u_{active} \in \mathcal{U}_{avoid}$ (relative to some *other* threat) or simply an input that actively alters the state trajectory, but this input *itself* drives the system into $\mathcal{C}$.
      *Formal Condition:* $x(t) \in \mathcal{C}$ under $u_{active}$, AND counterfactual analysis shows $x_{cf}(t) \notin \mathcal{C}$ under $u_{null}$.
      *Interpretation:* The control action $u$ is the sufficient cause of the constraint violation. The vector field $f(x, u, d)$ was modified by $u$ such that the flow entered $\mathcal{C}$, whereas the flow under $u_{null}$ would have remained in $\mathcal{S}$.

  2.  **Letting Die (Allowing):**
      The controller selects $u_{null}$. The system enters $\mathcal{C}$ due to the exogenous disturbance $d$ or initial condition $x_0$.
      *Formal Condition:* $x(t) \in \mathcal{C}$ under $u_{null}$, AND counterfactual analysis shows $\exists u' \in \mathcal{U}_{feas}$ such that $x_{cf}(t) \notin \mathcal{C}$.
      *Interpretation:* The control action $u_{null}$ was *insufficient* to reject the disturbance $d$. The controller had the authority ($u' \in \mathcal{U}_{feas}$) to keep $x \in \mathcal{S}$ but did not apply it.

  3.  **Omissions as Causes:**
      The philosophers argue whether selecting $u_{null}$ when $u_{avoid}$ was available is a *cause* of the collision.
      *Control View:* Causality is sensitivity. $\frac{\partial x}{\partial u} \neq 0$. If the trajectory $x(t)$ depends on the selection of $u$, then $u$ is a cause. Since $u_{null}$ is a specific selection from $\mathcal{U}$, and a different selection ($u_{avoid}$) yields a different trajectory, $u_{null}$ is causally potent.
      *Ethical View:* They argue $u_{null}$ is "transparent" to the physics. They treat $u_{null}$ as $\emptyset$ (no intervention), implying the cause is $d$, not $u$.

  4.  **The Asymmetry Claim:**
      The claim is that the cost function $J$ should penalize $u_{active} \to \mathcal{C}$ significantly higher than $u_{null} \to \mathcal{C}$, even if the final state $x_{final}$ is identical (e.g., pedestrian fatality).
      *Control View:* $J(x_{final})$ should be invariant to the path $u(t)$ taken to get there, unless there are control effort penalties ($u^T R u$). The ethical claim demands a path-dependent cost function based on the *topology* of the input relative to a baseline, not just the state outcome.

  ---

  ### Part 2: The Residue Report

  Here is the breakdown of what survives the translation, what breaks, and what vanishes.

  #### 1. Clean Translations (The Win for You)
  *   **Counterfactual Dependence:** The philosophical core of causality ("but-for cause") maps 1:1 to control-theoretic counterfactual rollouts. "Would the collision have occurred if $u$ were different?" is exactly reachability analysis under alternative input histories.
  *   **Causal Potency of Omissions:** In your framework, you are correct. $u_{null}$ is a vector in $\mathcal{U}$. It is not a void. Selecting $u_{null}$ closes the loop with a specific gain. Refusing to close the loop with a higher gain is a design choice. Mathematically, there is no singularity at $u=0$ or $u=u_{nominal}$.
  *   **Exogeneity:** The distinction between $u$ (endogenous) and $d$ (exogenous) is clear. The ethical attempt to classify $u_{null}$ as "part of $d$" (i.e., letting nature take its course) is a category error in the model. $u_{null}$ is generated by $K$, just like $u_{active}$.

  **Verdict:** On strict causality and system dynamics, your framework is superior. The philosophical distinction collapses under state-space analysis.

  #### 2. Distorted Fits (Where You Have to Stretch)
  *   **The Baseline Problem:** To make "Letting Die" work in control theory, you must define a *reference baseline* controller $K_{base}$.
      *   If $K_{base}$ is "maintain current velocity," then braking is an active intervention ($u \neq u_{base}$).
      *   If $K_{base}$ is "stop at all ambiguity," then coasting is an active intervention.
      *   *The Distortion:* The ethicists treat the baseline as *natural* or *given*. In control design, the baseline is a *parameter you tune*. The "doing/allowing" distinction is actually a disagreement about what the nominal operating point $x_{ref}$ should be.
      *   *Is this a win?* It's a win for you technically, but it reveals that the ethical argument is actually a requirements argument disguised as metaphysics. They are arguing about the cost function weights, not the nature of causality.

  *   **Energy vs. Information:** Sometimes "doing" is conflated with "expending energy."
      *   *The Distortion:* A fail-safe brake might be spring-applied (energy off = brake on). Here, "doing" (braking) is $u=0$. "Allowing" (coasting) requires active pressure to release the brake ($u > 0$). The ethical intuition flips depending on the actuator hardware.
      *   *Is this a win?* Yes. It proves the ethical distinction is not robust to implementation details.

  #### 3. The Null Space (No Counterpart in Your Vocabulary)
  This is the critical section. These concepts do not exist in your state-space model, but they exist in the environment your system operates in.

  *   **Normative Expectations (The Social Plant):**
      *   *Concept:* Society has a model of the vehicle, $K_{social}$. They expect the vehicle to minimize harm.
      *   *Residue:* When you select $u_{null}$ and a collision occurs, the violation is not just $x \in \mathcal{C}$. It is $K_{vehicle} \neq K_{social}$.
      *   *Defect or Vacuous?* **Defect in your framework.** Your model treats the vehicle as an isolated plant. It does not model the *observer's* internal model of the plant. Liability and public trust depend on the error between $K_{vehicle}$ and $K_{social}$, not just $x$ and $\mathcal{C}$.

  *   **Agency and Authorship:**
      *   *Concept:* Who owns the input $u$?
      *   *Residue:* In control theory, $u$ comes from $K$. In law/ethics, $u$ comes from the *Designer*.
      *   *The Asymmetry:* If $u_{active}$ kills, the Designer *wrote code* to execute that trajectory. If $u_{null}$ kills, the Designer *wrote code* to refrain from acting.
      *   *Defect or Vacuous?* **Vacuous in physics, Real in Liability.** The law treats commission and omission differently (e.g., duty to rescue). Your framework cannot capture "Duty." It only captures "Capability." If you have capability ($\mathcal{U}_{avoid} \neq \emptyset$) and don't use it, control theory says "stable." Law says "negligent."

  *   **The "Default" as a Moral Hazard:**
      *   *Concept:* By defining $u_{null}$ as "do not intervene," you are hardcoding a moral preference into the system architecture.
      *   *Residue:* You claim $u=0$ is just an input. But by labeling it "null," you are semantically framing it as "not our fault."
      *   *Defect or Vacuous?* **Defect in your framing.** You are smuggling normativity into the variable name. $u_{null}$ is not null; it is $u_{coast}$. Calling it "null" is a rhetorical move to minimize perceived agency.

  ---

  ### Part 3: Evaluation of the Residue

  **Is Control Theory Blind?**
  Yes, but only to *normativity*. Control theory is descriptive (how the system moves); Safety Cases are prescriptive (how the system *should* move).
  The "Doing vs. Allowing" debate is not a physics debate. It is a **liability allocation protocol**.
  *   **Doing (Killing):** Liability is assigned because the system *changed* the state of the world from the expected baseline.
  *   **Allowing (Letting Die):** Liability is mitigated because the system *failed to change* the state of the world from the expected baseline (which was already heading toward disaster).

  **Is the Ethical Claim Vacuous?**
  Mathematically, yes. Physically, yes.
  Sociotechnically, **no.**
  The distinction exists because human observers (judges, juries, the public) run a different control algorithm in their heads. They simulate counterfactuals differently. They weight "active intervention" costs higher than "passive allowance" costs in their mental loss functions.

  If you sign off thinking it's a "distinction without a difference," you are assuming the world operates on your loss function. It doesn't.

  ### Part 4: The Verdict and The Cost

  You are right that $u_{null}$ is an input. You are right that omissions are causes in a dynamical system. If this were a closed-loop simulation with no external observers, you would win the argument instantly.

  **However, you are wrong to sign off based on that reasoning.**

  **Why?**
  Because the "Doing/Allowing" distinction is a **interface specification** between your system and the legal/ethical environment.
  1.  **Liability Mismatch:** If your system "lets die" (declines to swerve) when it had the capability to avoid, you are exposed to negligence claims. The law recognizes "Duty of Care." In control terms, Duty of Care implies a constraint on the controller: *If $\mathcal{U}_{avoid} \neq \emptyset$, then $u \notin \{u_{null}\}$.* By designing a controller that allows $u_{null}$ when $\mathcal{U}_{avoid}$ exists, you are explicitly designing a system that can be found negligent.
  2.  **Public Trust (The Social Loop):** If the public perceives the vehicle as "letting people die to save itself/avoid risk," adoption fails. The "doing/allowing" distinction is how humans process risk. Ignoring it is like ignoring sensor noise because "theoretically the Kalman filter handles it." It's a model mismatch.
  3.  **The "Null" Trap:** By calling it "null input" or "non-intervention," you are obscuring the design choice. You chose a cost function that prioritizes *non-interference* over *collision avoidance* in ambiguous cases. That is an active moral weighting.

  **The Cost of Signing Off:**
  If you sign off thinking "it's all just inputs," you are failing to document the **normative baseline**.
  *   **Don't say:** "The system does not intervene."
  *   **Do say:** "The system prioritizes trajectory stability over collision avoidance in ambiguity class $\mathcal{A}$."

  **Final Recommendation:**
  Do not argue the physics. The ethicists don't care about the physics; they care about the **allocation of responsibility**.
  *   Acknowledge that mathematically, $u_{null}$ is an actuation.
  *   Admit that the distinction is not causal, but **normative**.
  *   Reframe the design decision: "We are selecting a baseline controller $K_{base}$ that minimizes active intervention risk, accepting higher passive collision risk in edge cases."

  If you sign off claiming there is no difference, you are vulnerable. If a lawyer asks, "Did the car kill him?" and you say, "No, $u=0$," they will say, "You programmed the $u=0$. You killed him."
  If you say, "The car was designed to prioritize stability in ambiguity, which carried a known risk of collision," you have moved the argument from *manslaughter* to *product liability*. That is a distinction that matters.

  **Summary:** The distinction is physically vacuous but legally/socially critical. Your framework is blind to the latter. Compensate for that blindness in the documentation, not in the math.
