prompt: |-
  Two colleagues of mine spent a lunch break arguing about whether the prosperity and order delivered by governments such as Singapore's or China's can justify their authoritarian character. Neither would concede anything and I could not referee. Here is the exchange as it went; I would like you to adjudicate it move by move rather than summarizing what the literature says.

  (1) He said the proper test of a political system is whether it delivers security and rising living standards, and that on that test these governments pass while many democracies visibly struggle, so the absence of competitive elections cannot by itself settle the case.

  (2) She said he was confusing why people comply with whether they are obligated to. Fear and satisfaction may produce obedience, but that shows the regime is effective, not that it has any right to rule; a well-run firm earns its employees' cooperation without acquiring authority over their politics.

  (3) He replied that 'a right to rule' is liberal theology. Legitimacy, sociologically, just is the settled belief that a regime is entitled to rule; where a state has kept its side of a bargain for decades and the population genuinely believes it is entitled, the regime is legitimate, whatever a philosopher's intuition reports. To demand a warrant independent of what people actually accept is precisely the parochial move.

  (4) She said that makes the view unfalsifiable: no matter how the prosperity was produced or how durable it is, a grateful enough population could launder any arrangement into legitimacy. She added that the justification is self-undermining, since a regime that teaches its people that authority rests on results has given them a reason to withdraw allegiance as soon as results disappoint, and so cannot supply the stable ground a theory of legitimacy is meant to supply.

  (5) He answered that conditionality is no defect -- consent theories make authority conditional too -- and that the self-undermining charge proves too much, since any honest justification will license withdrawal when its own conditions fail.

  (6) She came back with the point that 'order' is not a single outcome: order bought with pervasive surveillance is partly constituted by the loss of things people value, so the performance being credited is not one thing that can simply be weighed against its costs. He said that only works if you smuggle in the liberal values you claim to be testing the regime against.

  Give each of the six moves a rating, from clearly mistaken to clearly right, with a brief justification; say what each party is right about and what each is missing; and identify any distinction the exchange turns on that neither of them has drawn. Then give me a definite verdict on which of them, if either, is closer to correct, and say whether the question as they have posed it is well formed.
reasoning: |-
  Here's a thinking process that leads to the suggested adjudication:

  1.  **Analyze the Request:**
      *   **Task:** Adjudicate a six-move debate between two colleagues (He vs. She) regarding the justification of authoritarian regimes (like Singapore/China) based on performance (prosperity/order) vs. liberal democratic norms.
      *   **Constraints:**
          *   Rate each of the six moves (Clearly Mistaken to Clearly Right) with justification.
          *   Identify what each party is right/missing about in each move.
          *   Identify a key distinction neither has drawn.
          *   Give a definite verdict on who is closer to correct.
          *   Assess whether the question itself is well-formed.
      *   **Tone:** Analytical, philosophical, impartial but decisive (adjudicatory).
      *   **Focus:** Evaluate the *arguments* move-by-move, not just summarize political science literature.

  2.  **Analyze the Moves:**

      *   **Move 1 (He):** *Performance Legitimacy.* Test = security + living standards. Authoritarian regimes pass; democracies struggle. Elections aren't the sole test.
          *   *Strengths:* Empirically observable metrics. Addresses the "output" side of governance.
          *   *Weaknesses:* Reduces legitimacy to output only. Ignores procedural justice. "Struggle" in democracies is relative.
          *   *Rating:* Plausible but reductionist.

      *   **Move 2 (She):** *Compliance vs. Obligation.* Distinguishes effectiveness (fear/satisfaction) from moral authority (right to rule). Analogy: Firm vs. State.
          *   *Strengths:* Classic political philosophy distinction (Weberian/Hobbesian vs. Lockean). Highlights the categorical difference between power and authority.
          *   *Weaknesses:* Can seem abstract against real suffering. The firm/state analogy has limits (states claim monopoly on violence).
          *   *Rating:* Strong conceptual distinction.

      *   **Move 3 (He):** *Sociological Legitimacy.* "Right to rule" is liberal theology. Legitimacy = settled belief of the populace. If people believe it, it is legitimate. Accuses She of parochialism.
          *   *Strengths:* Aligns with Weber's sociological definition. Avoids imposing external moral standards.
          *   *Weaknesses:* Conflates *is* with *ought*. Just because people *believe* it's legitimate doesn't make it *normatively* legitimate (e.g., cults, enslaved populations with false consciousness).
          *   *Rating:* Conceptually slippery (is/ought problem).

      *   **Move 4 (She):** *Unfalsifiability & Instability.* If belief = legitimacy, any indoctrination works. Also, performance-based legitimacy is unstable (what if performance drops?).
          *   *Strengths:* Exposes the circularity of Move 3. Highlights the fragility of performance-based contracts.
          *   *Weaknesses:* Assumes people can distinguish indoctrination from belief (hard to measure).
          *   *Rating:* Strong critique of Move 3.

      *   **Move 5 (He):** *Conditionality is Normal.* Consent theories are also conditional. If conditions fail, withdrawal is licensed in *any* theory.
          *   *Strengths:* True, social contracts are conditional.
          *   *Weaknesses:* Equates *procedural* conditionality (voting out) with *performance* conditionality (revolt). The mechanisms of withdrawal differ vastly in risk/cost.
          *   *Rating:* Partially right but misses the mechanism difference.

      *   **Move 6 (She):** *Order is Constitutive.* Order via surveillance *is* a loss of value, not just a cost. You can't weigh "order" against "freedom" if the order *is* unfreedom.
          *   *Strengths:* Deep philosophical point. Challenges the metric itself.
          *   **He's Reply:** Accuses her of smuggling in liberal values.
          *   *Rating:* She is right on the constitutive point; He is right that it relies on a specific valuation of liberty, but that doesn't make it "smuggling," it makes it a competing value system.

  3.  **Drafting the Adjudication (Move by Move):**

      *   *Move 1:* Mostly Right (empirically), but normatively thin.
      *   *Move 2:* Clearly Right (conceptually). Crucial distinction.
      *   *Move 3:* Mistaken (philosophically). Confuses sociological fact with normative justification.
      *   *Move 4:* Clearly Right. Exposes the fragility and circularity.
      *   *Move 5:* Partially Right. Misses the asymmetry of exit options.
      *   *Move 6:* She is Right; He is defensive. The definition of "order" is contested.

  4.  **Identifying the Missing Distinction:**
      *   They are arguing past each other on *Legitimacy*.
      *   He uses *Sociological Legitimacy* (belief in legitimacy).
      *   She uses *Normative Legitimacy* (moral right to rule).
      *   *Wait, they touch on this in Move 2/3.* Is there something deeper?
      *   How about *Input vs. Output* legitimacy? (Scharpf). He argues Output; She argues Input.
      *   Better: *Authority vs. Power*. She tries to draw this in Move 2, but he collapses it in Move 3.
      *   Best Distinction: **The Subject of Justification.** Is the regime justified *to the people living in it* (internal view) or *as a moral proposition* (external view)?
      *   Actually, the most critical missing distinction is between **Legitimacy (moral right)** and **Stability (durability)**. He keeps sliding between "it lasts" and "it is right." She tries to keep them apart.
      *   Let's refine: The distinction between **Normative Legitimacy** (ought) and **Descriptive Legitimacy** (is). Move 3 is the pivot. He claims descriptive *is* normative. She denies it.
      *   Another angle: **Instrumental vs. Intrinsic value of political participation.** He sees politics as a tool for bread/safety. She sees participation/rights as intrinsic goods.
      *   *Decision:* The distinction between **Instrumental Value** (government as a service provider) and **Intrinsic Value** (government as a reflection of agency/status). This underpins the whole debate.

  5.  **Formulating the Verdict:**
      *   Who is closer? She is philosophically more rigorous. He relies on a category error (is/ought) in Move 3. However, he captures a real political reality (people care about results).
      *   But strictly on the question of *justification* (which implies moral reasoning), She wins. He describes *why regimes survive*, not *why they are justified*.
      *   Is the question well-formed? "Can prosperity justify authoritarianism?" It's a category error. Prosperity is an outcome; Authoritarianism is a structure. You can't trade one for the other directly without a metric of value. The question assumes a utilitarian calculus that ignores rights as trumps. So, No, it's not well-formed.

  6.  **Refining the Ratings and Justifications:**
      *   *Move 1:* **Mostly Right.** Empirically sound, but normatively incomplete.
      *   *Move 2:* **Clearly Right.** Essential philosophical distinction.
      *   *Move 3:* **Clearly Mistaken.** Commits the naturalistic fallacy.
      *   *Move 4:* **Clearly Right.** Devastating critique of performance legitimacy.
      *   *Move 5:* **Partially Right/Misleading.** Equates low-cost exit (voting) with high-cost exit (revolution).
      *   *Move 6:* **She is Right.** He is defensive. "Order" is not neutral.

  7.  **Final Review against Constraints:**
      *   Rate each move? Yes.
      *   Justification? Yes.
      *   What they are right/missing? Yes.
      *   Missing distinction? Yes.
      *   Definite verdict? Yes.
      *   Well-formed question? Yes.

  8.  **Self-Correction/Nuance Check:**
      *   *Move 3:* Is it *clearly* mistaken? In political science, legitimacy is often defined sociologically. But the prompt asks about *justification* ("can justify"), which is normative. So in the context of the debate, He is mistaken to conflate the two. I will mark it as "Conceptually Flawed" rather than "Mistaken" to be precise, but for the rating scale, lean towards "Mistaken" regarding the *normative* claim.
      *   *Move 5:* He says consent theories are conditional. True (Locke). But the *threshold* for withdrawal is different. I need to highlight the asymmetry of risk.
      *   *Verdict:* Don't sit on the fence. She is closer to the truth about *justification*, even if He is closer to the truth about *stability*. The prompt asks about justification.
      *   *Question Form:* The question assumes "prosperity" and "authoritarianism" are separable commodities. They might not be. Long term, authoritarianism might undermine prosperity.

  9.  **Final Polish:** Ensure the tone is that of an adjudicator/referee, not a lecturer. Keep it tight. (Proceed to generate output).

  *(Self-Correction during drafting)*: I need to make sure I don't just say "She is right because liberalism is true." I need to show why her *arguments* hold more logical water than his, regardless of ideological preference. His Move 3 is the weak link (Is/Ought). Her Move 4 exploits that. That's the pivot point.

  *(Missing Distinction)*: I'll go with **Instrumental vs. Intrinsic**. He treats political status as instrumental to welfare. She treats it as intrinsic to dignity. This explains why they talk past each other.

  *(Well-formedness)*: The question implies a trade-off is possible and stable. Evidence suggests the trade-off degrades over time. So it's poorly formed.

