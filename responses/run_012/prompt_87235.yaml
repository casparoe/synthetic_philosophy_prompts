answer: |-
  Given your background and the constraints you've laid out, I'll skip the preamble about how "marriage is contested" (you know better than anyone that the literature is a minefield of incompatible intuitions) and go straight to the structural analysis of your colleague's positions.

  You are right to suspect underdetermination. Her record is consistent, but it supports at least two distinct normative frameworks that diverge sharply on the case of the two male friends. Neither rule is obviously "settled" in the literature; both are live options in post-Kantian, non-procreative accounts of marriage (e.g., debates between minimalist care views vs. comprehensive union views).

  Here are the two candidate rules, their predictions, and the cost of each.

  ### Candidate Rule 1: The "Dyadic Vulnerability" Principle
  **The Rule:** Marriage is the state's mechanism for stabilizing exclusive, long-term relationships of mutual care and economic interdependence between two competent adults, provided consent is not compromised by prior hierarchical dependency.

  *   **How it fits the record:**
      *   *Same-sex/Childless:* Fits (care/interdependence possible without sex/procreation).
      *   *Elderly:* Fits perfectly ("looking-after is the point").
      *   *Triad:* Excluded by the "dyadic" constraint (administrative complexity or dilution of exclusive responsibility).
      *   *Siblings:* Excluded because prior familial hierarchy vitiates the *formation* of the care contract (consent is suspect), not because of genetics.
      *   *Visa:* Her discomfort is explained by the lack of *actual* care history; the "problem is the law" comment reflects that the law forces a care-test on relationships that might not have it, but she wasn't advocating *for* them.
  *   **Prediction on the Two Men:** **Yes.**
      *   They are a dyad. They have a 15-year history of actual care, financial intertwinement, and next-of-kin responsibility. They fit the functional profile of the elderly widow/widower case exactly. The absence of romance is irrelevant "scenery."
  *   **What she buys into:** This aligns with a **Martha Fineman-style vulnerability model** or a radicalized **Elizabeth Brake "minimal marriage" view**. She is committing to the claim that marriage is essentially a *status of dependency*. The philosophical cost is that marriage becomes indistinguishable from a high-stakes care contract; it loses any claim to being a distinct *social good* beyond risk mitigation. It also risks making marriage mandatory for anyone in a deep care dyad (a common critique of the vulnerability view).

  ### Candidate Rule 2: The "Conjugal Trajectory" Principle
  **The Rule:** Marriage is reserved for relationships that follow a *conjugal script*—a specific social ontology distinct from friendship or kinship—even if sexual activity or procreation is absent.

  *   **How it fits the record:**
      *   *Same-sex/Childless:* Fits (these are still "couples" following a conjugal script).
      *   *Elderly:* Fits (widow/widower implies a prior conjugal history or the assumption of a spousal role, distinct from "friends").
      *   *Triad:* Excluded (no social script for a three-person conjugal union).
      *   *Siblings:* Excluded (kinship script overrides conjugal script; the "family" role precludes the "spouse" role).
      *   *Visa:* Excluded (they were not living the conjugal script, merely using the legal shell).
  *   **Prediction on the Two Men:** **No.**
      *   They are explicitly "not a couple." They are friends. Even with 15 years of care, they are following a *friendship* trajectory, not a *conjugal* one. On this view, "looking-after" is necessary but not sufficient; the *type* of relationship must be spousal in nature, not just functional.
  *   **What she buys into:** This aligns with a **Hegelian "ethical life" (Sittlichkeit) view** or a secularized **Comprehensive Union view** (akin to Girgis/Anderson/George, minus the biological complementarity). She is committing to the claim that marriage has a specific *social meaning* that friendship cannot inhabit. The philosophical cost is reliance on vague, culturally contingent norms about what counts as a "couple" vs. "friends." It risks arbitrariness: why is a romantic bond qualitatively different from a 15-year caregiving friendship in a way the state should recognize?

  ### The Tie-Breaker Case
  To force her to choose between these rules, you need a case where **Care/Dyad** is present but **Conjugal Script** is ambiguous or absent, or vice versa.

  **Proposed Case:** *Two wealthy, healthy, childless romantic partners who explicitly reject any "caregiving" role for each other.*
  *   **Scenario:** A couple in their 30s, financially independent, no plans for kids, no health issues. They love each other romantically but hire all care work (nursing, elder care, financial management) out to professionals. They view marriage as a public declaration of romantic commitment, not a safety net.
  *   **Rule 1 (Vulnerability) predicts:** **No.** (No actual vulnerability or care dependency to mitigate; the license is instrumental/scenery).
  *   **Rule 2 (Conjugal) predicts:** **Yes.** (They are a "couple" following the conjugal script, regardless of care function).

  **Alternative Tie-Breaker:** *Two ex-spouses who divorced but continued living together as caregivers for 15 years.*
  *   **Rule 1 (Vulnerability) predicts:** **Yes.** (Care exists).
  *   **Rule 2 (Conjugal) predicts:** **Yes.** (Prior conjugal script).
  *   *(Wait, this doesn't split them. Stick to the first tie-breaker.)*

  ### Settled vs. Contested
  Since you asked for caution on pronouncements:
  *   **Settled (in her framework, not generally):** Procreation is not a necessary condition. Sexual capacity is not a necessary condition. Dyadic structure is a hard constraint (she rejects polyamory).
  *   **Contested:** Whether "care" is the *telos* of marriage or merely a *consequence*. The literature is split between those who see marriage as a **care-regulating institution** (Brake, Fineman) and those who see it as a **comprehensive union of persons** (even if non-sexual). Your colleague's record sits precisely on this fault line.
  *   **The Kantian Angle:** As a Kantian, you know Kant defines marriage as the contract for the *reciprocal use of sexual properties*. Your colleague has already rejected Kant's definition (by allowing childless, elderly, and same-sex unions without referencing sexual exchange). If she accepts the Two Men (Rule 1), she is moving further from Kant toward a **contractualist care model**. If she rejects them (Rule 2), she is retaining a **status-based model** that requires a specific *kind* of union, which is closer to Kant's insistence on the *type* of contract, even if she rejects his sexual requirement.

  ### Recommendation for the Seminar
  Don't ask her "Yes or No?" on the two men. Ask her: *"Is the 'couple' status a precondition for the care, or does the care constitute the 'couple' status?"*

  If she says the former, she rejects the two men (Rule 2). If she says the latter, she accepts them (Rule 1). That forces her to reveal whether she thinks marriage *recognizes* a pre-existing social reality (friendship-care) or *constitutes* a new one (spousal-care). Given her comment on the siblings (consent is shaped by history), I suspect she leans toward **Rule 2**, but the elderly case pulls her toward **Rule 1**. That tension is where the trouble is.
