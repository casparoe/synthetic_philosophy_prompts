answer: |-
  Brothers and Sisters, Friends of the Oppressed:

  I stand before you this evening with a tremor in my hand, not from fear, but from the weight of a conviction that has altered the course of my soul. You know me. You know the teachers who formed my mind. For years, I have stood with those who declare the Constitution a covenant with death and an agreement with hell. I have taught, as I was taught, that no honest man can swear to uphold a charter that bargains with slaveholders. But I come to tell you tonight that I can no longer hold this view. I have examined the instrument itself, not by the shadows of the framers' intentions, but by the light of its own words.

  Look to the Preamble. It does not say "We the White People," nor "We the Freemen of certain states." It says "We the People of the United States." It declares its object to "secure the Blessings of Liberty to ourselves and our Posterity." If slavery is liberty, then the Constitution stands. But if slavery is bondage, then the Constitution, by its own mouth, condemns it.

  You point to the clauses that seem to bow to the slave power. I grant you, the men who wrote them were flawed; many held slaves. But the document they wrote transcends their sins. Consider the clause regarding the migration or importation of persons. It did not protect the trade forever; it set a term. It allowed Congress to strike at the traffic after 1808. It was a restriction, not a guarantee.

  Consider the clause of representation. It counts those held to service as three-fifths. The Garrisonian says this recognizes them as property. I say it is a penalty upon the slave states. If slaves were recognized as full persons, the South's power would grow. If they were recognized as property, they would count for nothing. The compromise reduced their political weight compared to the free states. It whispers that the slave is a man, yet denies him the vote—a contradiction that belongs to the state, not the national charter.

  And what of the clause regarding persons held to service? It never speaks the word "slave." It never says "property." It speaks of "persons." It relies on state law to define the service, but the national government is charged to deliver persons, not chattels. If the state law violates the natural right of liberty secured by the Preamble, then the national law cannot uphold it without violating its own foundation.

  I hear the murmur in the pews. I know the charges you bring against this change of heart. You say this reading comforts the slaveholder. I say nay. Nothing terrifies the master more than a Constitution that denies him the right to own men. To say the Constitution is pro-slavery is to let him keep it as his shield. To say it is anti-slavery is to tear that shield from his arm and strike him with the very law he claims protects him.

  You say this counsels patience to the brother dragged back in chains under the Fugitive Slave Act. You say voting is too slow for such a crisis. But what is the alternative? To abandon the government is to abandon the fugitive to the mercy of those who hunt him. If the Constitution is against slavery, then the Fugitive Slave Act is unconstitutional. We do not wait for liberty; we demand it through the law of the land. We do not ask the slaveholder to leave the Union; we demand the Union cleanse itself of the slaveholder.

  So, what is left for you, my old mentors, who despise the ballot? I ask you to take it up. Not to compromise, but to conquer. If the Constitution is truly a charter of liberty, then every vote cast for freedom is a shot fired in a legal war. Do not wash your hands of the government. Seize it. Fill the halls of Congress with men who will read the Preamble as it is written. Let us stop asking for permission to be free and start claiming the rights the document already promises. The path is harder than non-resistance, for it requires us to enter the mire of politics. But it is the only path that leads to the courthouse door where the captive waits.

  I have spoken. I remain your brother in the struggle.
