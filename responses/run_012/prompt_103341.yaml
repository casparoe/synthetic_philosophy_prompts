  ### Map of the Logical Space

  Before presenting the tree, note that the disagreement over "corruption" rests on four independent dimensions. The tree below traverses these dimensions using concrete cases rather than abstract labels.

  1.  **Source of Normativity:** Does the standard come from local written law, local social norms, or an external moral truth?
  2.  **Constitution of the Wrong:** Is the act wrong because it breaks a rule, betrays a specific trust, causes harm, or reveals bad character?
  3.  **Unit of Analysis:** Is the moral agent the individual actor or the systemic equilibrium they inhabit?
  4.  **Pragmatics of the Label:** Is the word "corruption" a descriptive moral fact or a political tool that should be withheld if it causes harm?

  The following decision tree forces choices on these dimensions. There are 10 internal nodes and 8 leaves. Two combinations in the logical space are left unoccupied (marked in the notes below) because they represent unstable positions (e.g., claiming an act is legally valid but morally corrupt without a higher standard to appeal to).

  ***

  ### Decision Tree: The Anatomy of Corruption

  *   **Node 1:** A company operates in a foreign country. It obeys all local laws but violates its home country's anti-bribery statute to secure a contract. Is this act corrupt?
      *   **No:** (The local law is the final authority.) → Go to **Node 2**.
      *   **Yes:** (An external standard applies.) → Go to **Node 5**.

  *   **Node 2:** A customs officer charges a customary fee to process a shipment that would otherwise sit for weeks. The fee is not illegal locally, but it is not officially recorded. Is this act corrupt?
      *   **No:** (Local practice validates the act.) → Go to **Node 3**.
      *   **Yes:** (Written rules validate the act, even if local practice differs.) → **Leaf: Legalist**.

  *   **Node 3:** A ceremonial or religious gift functions as a mandatory entry fee to a local market. If calling this "corruption" would shut down trade and harm the local population, should we use the word?
      *   **No:** (Consequences determine the label.) → **Leaf: Functionalist**.
      *   **Yes:** (Truth determines the label, regardless of consequence.) → **Leaf: Conventionalist**.

  *   **Node 5:** A manager hires a qualified cousin over a marginally better-qualified stranger. This violates company policy but is common in the region. Is this act corrupt?
      *   **No:** (Social obligations can override meritocratic duty.) → Go to **Node 6**.
      *   **Yes:** (The role defines the duty.) → Go to **Node 7**.

  *   **Node 6:** A legislator directs public funds to his own district. This is legal and expected by voters, but reduces national efficiency. Is this corrupt?
      *   **No:** (Political representation is not a breach of trust.) → **Leaf: Virtue**.
      *   **Yes:** (Public office is a public trust, regardless of local expectation.) → **Leaf: Universalist**.

  *   **Node 7:** In a system where tips are required for survival, a civil servant accepts an expected tip to process a permit. Is the *individual* corrupt?
      *   **Yes:** (Individuals bear responsibility for their choices.) → Go to **Node 8**.
      *   **No:** (The system is the unit of analysis, not the individual.) → **Leaf: Collective-Action**.

  *   **Node 8:** A patient's family gives a surgeon a gift after a successful operation. The surgeon did not expect it. Is this corrupt?
      *   **Yes:** (The structural conflict of interest defines the act.) → Go to **Node 9**.
      *   **No:** (Motive and intent define the act.) → Go to **Node 10**.

  *   **Node 9:** A firm pays a local official's nephew's tuition to be shortlisted for a contract. The official claims he would have awarded the contract anyway. Is the act corrupt?
      *   **Yes:** (The definition of corruption is independent of blame.) → **Leaf: Two-Level**.
      *   **No:** (If there is no betrayal of intent, there is no corruption.) → **Leaf: Principal-Agent**.

  *   **Node 10:** Does the surgeon's acceptance of the gift reveal a flaw in their character, even if no harm was done?
      *   **Yes:** (Corruption is a vice.) → **Leaf: Virtue**.
      *   **No:** (Corruption requires a specific breach, not just bad character.) → **Leaf: Principal-Agent**.

  ***

  ### Leaf Definitions and Awkward Commitments

  1.  **Legalist:** Corruption is defined strictly by the written rules of the institution involved.
      *   *Awkward Commitment:* Must condemn acts that locals view as harmless cooperation if they technically violate a statute.
  2.  **Conventionalist:** The society's prevailing norms are the last word on whether an exchange is corrupt.
      *   *Awkward Commitment:* Must accept that a society can define theft or exclusion as legitimate if the norm persists long enough.
  3.  **Functionalist:** Some such payments are efficiency-enhancing and condemning them is ethnocentric.
      *   *Awkward Commitment:* Must tolerate clear abuses of power if they stabilize the local economy or prevent worse outcomes.
  4.  **Universalist:** There is a single moral standard that can indict a society's own norms.
      *   *Awkward Commitment:* Must impose external standards on communities that may view them as imperialistic or destructive.
  5.  **Principal-Agent:** Corruption is centered on the betrayal of an entrusted role.
      *   *Awkward Commitment:* Must blame individuals for acts that were effectively coerced by a broken system.
  6.  **Collective-Action:** The individual moral frame is the wrong unit of analysis; corruption is a stable collective equilibrium.
      *   *Awkward Commitment:* Cannot morally condemn any single participant in a corrupt system, potentially paralyzing reform.
  7.  **Virtue:** Corruption is a defect of character rather than merely a rule violation.
      *   *Awkward Commitment:* Must judge the internal state of an agent rather than the observable harm or rule-breaking.
  8.  **Two-Level:** Separates the definitional question (is it corrupt?) from the question of blame (is he culpable?).
      *   *Awkward Commitment:* Must label desperate survival strategies as "corrupt" even while refusing to punish the actors.

  ***

  ### Notes on Logical Space

  **Unoccupied Combinations:**
  *   **Local Legalist + Collective-Action:** A position claiming "Local law is the only standard" but "Individuals aren't responsible for breaking it" is unstable. If the law is the only standard, breaking it defines the wrong; if the system excuses the breach, the law is not the true standard.
  *   **Universalist + Functionalist:** One cannot consistently hold that "There is a single moral truth" and "We should ignore that truth if it hurts trade." These nodes are mutually exclusive in Node 3.

  **Indistinguishable Leaves:**
  *   **Legalist vs. Conventionalist:** In a society where laws perfectly track social norms (e.g., a homogeneous society with high trust), these positions yield identical judgments on all cases. They only diverge when law and custom conflict (Node 2).
  *   **Principal-Agent vs. Collective-Action:** Once the "principal" (the state or institution) is itself the source of the corruption, these views converge. If the master commands the betrayal, the agent cannot betray the master, collapsing the distinction between individual breach and systemic equilibrium.
