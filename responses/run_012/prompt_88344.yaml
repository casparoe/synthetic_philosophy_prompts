  Scene: I'm in a small reading group on consciousness, five or six of us, and last week the topic was higher-order theories of consciousness. Roughly: a mental state counts as a conscious state just in case some other state in the system represents it. So what makes a pain a conscious pain isn't the pain's own intensity or its first-order role -- it's that the pain is the target of a suitable higher-order representation, some state whose job is to register the state you're in. Devi is broadly sympathetic to the family of views; Marcus thinks the whole family is busted. They went at it for about forty minutes after everyone else had gone home and I couldn't tell who had the better of it. Here's the exchange as close as I can reconstruct it.

  1. Marcus: the view has to say either that the higher-order representation is itself conscious or that it isn't. If it is, we've got a circle -- to explain what makes a state conscious we appeal to a state that's already conscious, so nothing gets explained. If it isn't, then we've explained consciousness by positing a second *unconscious* representation, and unconscious representations of a system's own internal states are cheap and everywhere. A system that keeps track of its own goings-on has not thereby become a subject of experience. So pick your poison: circularity or absurdity.

  2. Devi: that's a false dilemma. The higher-order state doesn't need to be conscious, and the view isn't absurd because the higher-order state has to be the right kind of representation. It has to be non-inferential -- it registers the state directly rather than inferring "I'm in state X" from behaviour -- and it has to be poised for use: the system's downstream machinery has to actually consume it, so that the state becomes available to the system for reporting, deliberation, memory. That's the difference between a state being merely monitored and a state being *for* the subject. And anyway plenty of things get their nature from a relation to something that isn't of the same kind -- a signature isn't legally binding because it's a binding signature.

  3. Marcus: fine, so now we've swapped a mystery for a checklist. If all it takes is a non-inferential, downstream-consumed representation of a first-order state, we should be able to build a conscious system out of parts. So let's try. Take any system with a first-order state and bolt on a monitor chip that non-inferentially registers that state, and wire the chip's output into the system's memory and action selection. Now take a second version: identical first-order state, identical monitor content, but the monitor's output is routed to a different consumer -- a logging subsystem that nobody ever reads. Which one is conscious? If you say the first, then whether something is conscious depends on where a wire goes, which is a fact about the furniture, not about the state. If you say both, then the logging system is conscious, and I can build a subject out of a thermostat and a printer. If you say the question is ill-formed without more detail, then the theory isn't telling us what consciousness is, it's telling us what it would be nice for it to be.

  4. Devi: that's a real question but it isn't a reductio. Yes, it's a fact about wiring -- but that's what any functionalist has to say about anything, so you're not objecting to this view, you're objecting to functionalism by pointing out that it has implications. Everybody thinks a system with no memory, no capacity to attend, nothing that can use its states, is not a subject. If the logging output is genuinely consumed -- if it changes what the system does, what it stores, what it can report -- then fine, I'll say that's a subject, whatever it's made of. Thermostats and printers don't have integrated consumers like that. And if you build a logging system that really does integrate and use the representation, you've built something plausibly conscious, which is the answer, not an embarrassment.

  5. Marcus: "integrated" and "really does use" are doing an enormous amount of work here. Every time I press, the higher-order bit recedes. First: a state is conscious iff it's represented. Then: iff it's represented non-inferentially. Then: iff it's represented non-inferentially and consumed by the right consumers. The thing that was supposed to do the explanatory work -- the higher-orderness -- keeps getting demoted in favour of plain first-order facts about integration, memory, report. And the theory now can't be assessed independently of those facts, so it isn't explaining consciousness, it's redescribing the first-order profile. All that's left that's distinctively higher-order is some machinery, and machinery doesn't explain why anything feels like anything.

  6. Devi: this is what every explanation looks like. "Life" dissolves into a list of mechanisms once you press on it, and nobody concludes that biology doesn't exist. What the higher-order relation buys you is an answer to a question first-order accounts can't touch: why is a state *for* the system rather than merely *in* it? That's the datum -- that some of a system's states are present to it, that there's something it's like -- and the higher-order relation is the only candidate that marks the difference between a state being in the system and a state being for the system. If you've got a better story about that, tell me. If your objection is just that the story has moving parts, you're not objecting to this story, you're objecting to explanation.

