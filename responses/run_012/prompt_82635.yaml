  *   If $P(T_{func})$ shifts from 0.50 to 0.30 (a more conservative weighting against reductionism), $P(P1)$ drops to **0.29**.
  *   If $P(T_{func})$ shifts from 0.50 to 0.70 (a strong functionalist prior), $P(P1)$ rises to **0.65**.
  *   Changes in $P(Pres \mid T_{func})$ have a secondary effect; even if preservation is certain (1.0), the ceiling is capped by the prior probability of the theory itself.

