prompt: |-
  I have been trying to convince a seminar that the epistemic foundations of game theory have been asking for common knowledge of the wrong thing. On the standard telling, the solution concepts — Nash equilibrium, backward induction, and the rest — are underwritten by common knowledge of rationality: each player is rational, each knows the others are rational, each knows that each knows, and so on up the hierarchy. I want to argue that the load-bearing assumption is really common knowledge of each other's decision procedures. What has to be common knowledge, I claim, is not an abstract property such as rationality but the programs the players are running, so that each can condition his choice on the algorithm the other will use rather than merely on the other's action. Once you make that swap, I think the classic embarrassments lose their sting: cooperation in a one-shot prisoner's dilemma becomes rationally sustainable when the two procedures are common knowledge; the backward-induction puzzle in the finitely repeated prisoner's dilemma is re-diagnosed as a fact about the complexity of the relevant procedures rather than a failure of rationality; and the familiar gap between common knowledge of rationality and Nash equilibrium stops looking like a defect, because rationality was never the thing doing the work.

  Please take this position seriously and tell me what would count against it — not a survey of the literature, but the actual defeaters, ranked from the ones that should be decisive to the ones that would be merely awkward. I am especially worried about whether the move is too powerful to be a theory of anything. If any pair of programs can in principle be common knowledge, and if program-level common knowledge can sustain outcomes that are not Nash, then it begins to look as though I can "explain" cooperation, defection, or any other pattern by simply choosing the programs — which would make the view unfalsifiable rather than illuminating. I want to know whether that charge is fatal or merely a limitation that any equilibrium notion shares, and whether there is some independent constraint (a complexity bound, a restriction to admissible procedures, a stability requirement) that could rescue it without being ad hoc.

  Then tell me which of the defeaters the view's own defenders would concede. For instance, would they admit that shifting from an epistemic idealization to a computational one is no improvement at all, since common knowledge of programs may be at least as demanding as common knowledge of rationality — that I have relocated the problem rather than solved it? Would they grant that the program-level story does not actually dissolve backward induction, because common knowledge of the *right* programs still yields the backward-induction outcome, so the dissolution depends on a choice of programs that I have not justified? And which objections would they dismiss as missing the point? Finally, I would like an honest verdict on whether the position earns its keep over the boring alternative — that we should characterize solution concepts directly and treat all rationality talk as a dispensable scaffold — or whether it quietly collapses into that alternative. The defeater I personally find most threatening is the charge of vacuity, so weigh that one with particular care.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Position:**
      *   **Core Claim:** The epistemic foundations of game theory should shift from "Common Knowledge of Rationality" (CKR) to "Common Knowledge of Decision Procedures/Programs" (CKP).
      *   **Motivation:** CKR leads to "embarrassments" (non-cooperation in PD, backward induction paradoxes, gap between CKR and Nash). CKP allegedly solves these by allowing players to condition choices on algorithms, not just actions.
      *   **Specific Concerns:**
          *   Is the view too powerful (unfalsifiable/vacuous)? If *any* program pair explains *any* outcome, does it explain nothing?
          *   Are there independent constraints (complexity, admissibility, stability) to save it from ad hoc-ness?
          *   How do defenders of this view respond to specific defeaters?
          *   Does it collapse into instrumentalism (just characterizing solution concepts directly)?
      *   **Task:** Identify defeaters (ranked by severity), analyze defender concessions/dismissals, and give a verdict on whether it earns its keep over the "boring alternative."

  2.  **Initial Assessment & Literature Mapping (Mental Sandbox):**
      *   This position sounds very much like the "Program Equilibrium" literature (Tennenholtz, Kalai, etc.) or "Logical/Algorithmic Game Theory" (Halpern, Pass, etc.). It also resonates with "Superrationality" (Hofstadter) and "Fair Bot" dynamics in Prisoner's Dilemma tournaments (Alex Altair, LessWrong community).
      *   *The Big Worry:* The user is right to worry about vacuity. If I can posit *any* program, I can justify *any* outcome. Standard game theory restricts strategies to functions from history to action. "Programs" usually imply functions from *code* to action (quining, simulating).
      *   *The "Too Powerful" Charge:* This is the critical one. If the theory allows $P_1$ = "Cooperate if $P_2$ cooperates" and $P_2$ = "Cooperate if $P_1$ cooperates," we get cooperation. But if $P_1$ = "Defect always," we get defection. What selects the programs?
      *   *CKR vs. CKP:* CKR is an idealization about *preferences* and *beliefs*. CKP is an idealization about *mechanisms*. CKP is arguably *harder* to satisfy epistemically (I need to know your source code, not just that you maximize utility).

  3.  **Drafting the Defeaters (Ranking):**
      *   *Rank 1 (Fatal):* Vacuity/Underdetermination. If the theory doesn't constrain *which* programs are available or selected, it predicts everything and nothing. It becomes a post-hoc rationalization tool.
      *   *Rank 2 (Severe):* Epistemic Regress/Impossibility. Common Knowledge of Programs requires infinite recursion of simulation or verification. If programs can simulate each other, we hit halting problem issues or infinite loops. CKP might be logically impossible in general cases.
      *   *Rank 3 (Significant):* The "Right Programs" Problem. To get Backward Induction (BI) or Nash, you need specific programs. To get Cooperation, you need different ones. Why are *those* the common knowledge ones? This just pushes the selection problem back a step.
      *   *Rank 4 (Awkward):* Computational Cost. Even if possible, is it plausible? Real agents don't exchange source code.

  4.  **Analyzing Defender Responses:**
      *   *Concessions:* Defenders (like Tennenholtz) would admit CKP is demanding. They might concede that without complexity bounds, it's too strong. They would likely admit that *some* equilibrium selection mechanism is still needed (why *these* bots?).
      *   *Dismissals:* They would dismiss the idea that CKR is "easier." CKR is also impossible for bounded agents. They would argue CKP is more *honest* about the computational nature of interaction. They would reject the "boring alternative" because understanding *why* an equilibrium holds (mechanism vs. fixed point) matters for design and AI safety.

  5.  **Addressing the "Boring Alternative" (Instrumentalism):**
      *   Is CKP just a fancy way of saying "Nash Equilibrium"?
      *   No, because Program Equilibrium can sustain outcomes *outside* the Nash set of the stage game (e.g., Cooperation in one-shot PD).
      *   However, if it requires an external selection principle to pick the programs, does it add value? Yes, if the selection principle is natural (e.g., "evolution selects efficient code" or "AI agents open-source themselves").
      *   Verdict: It earns its keep *only if* there is a independent theory of program selection (evolution, design, market). Otherwise, it collapses into "anything goes."

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction:* I need to make sure I distinguish between "strategies" (standard game theory) and "programs" (code that can read other code). The user specifically says "condition his choice on the algorithm." This implies *program equilibrium* (Tennenholtz 2004).
      *   *The Halting Problem:* If I need to know your program to decide, and your program simulates me, we might not halt. This is a technical defeater that is quite strong.
      *   *The "Vacuity" Charge:* This is the user's main worry. I need to focus heavily here. The constraint must come from *outside* the epistemic condition. E.g., Computational Complexity classes (P-time), or evolutionary stability.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the sophistication of the position (aligns with Program Equilibrium/Logical Decision Theory).
      *   **Part 1: The Defeaters (Ranked).**
          1.  The Selection Problem (Vacuity).
          2.  The Halting/Consistency Problem (Logical Impossibility).
          3.  The Epistemic Regress (CKP is harder than CKR).
          4.  The Normative Gap (Is "sustainable" the same as "rational"?).
      *   **Part 2: Defender Concessions vs. Dismissals.**
          *   What they grant (CKP is hard, needs constraints).
          *   What they reject (CKR isn't better, instrumentalism misses the mechanism).
      *   **Part 3: The Verdict.**
          *   Does it earn its keep? Yes, *if* coupled with a theory of program selection (evolution/design). No, if treated as pure epistemology.
          *   Comparison to "Boring Alternative."

  8.  **Drafting the Content (Iterative refinement):**
      *   *Vacuity:* If I can posit "CooperateBot" vs "DefectBot," I explain everything. The constraint must be on the *space* of allowable programs. Is that ad hoc? Maybe not if based on computational limits.
      *   *Backward Induction:* In repeated PD, if programs are finite state machines, cooperation can emerge (Neyman 1985). But if programs are Turing machines, things get weird. The user claims CKP re-diagnoses BI. Defenders would say: BI assumes specific strategies. If agents can commit to code, BI breaks.
      *   *The "Boring Alternative":* The alternative is "Solution concepts are just definitions." The CKP view says "Solution concepts emerge from computational interaction." That's a substantive claim, not just definitional.

  9.  **Final Polish:** Ensure tone is serious, philosophical, and direct. Avoid generic survey language. Focus on the *logic* of the defeaters. (Self-Correction: Make sure to explicitly address the "Common Knowledge" aspect. It's not just that programs exist, but that they are *common knowledge*. This adds the infinite hierarchy layer which exacerbates the Halting/Regress issue.)

  10. **Final Review against constraints:**
      *   Rank defeaters? Yes.
      *   Decisive vs. Awkward? Yes.
      *   Address vacuity heavily? Yes.
      *   Defender concessions/dismissals? Yes.
      *   Verdict on "Boring Alternative"? Yes.

  (Proceed to generate output based on this structure.)
answer: |-
  This is a sophisticated position that aligns closely with the literature on **Program Equilibrium** (Tennenholtz, 2004), **Logical Decision Theory**, and **Algorithmic Game Theory**. You are effectively arguing that the primitive of interaction is not *action* conditioned on *belief*, but *output* conditioned on *source code*.

  You are right to worry about vacuity. If the explanatory power comes from the flexibility of the "programs" rather than the constraints of the "knowledge," you have not solved the foundation problem; you have merely moved the underdetermination from strategies to code.

  Here is the analysis of the defeaters, the likely responses from defenders of the view, and the final verdict.

  ---

  ### Part 1: The Defeaters (Ranked by Severity)

  #### 1. The Selection Problem (Decisive)
  This is the vacuity charge you identified. In standard game theory, the set of available strategies is fixed by the game form. In your view, the "programs" are the strategies. If the theory does not constrain *which* programs are available or *which* pair becomes common knowledge, it can rationalize any outcome.
  *   **Why it is decisive:** A theory that can explain Cooperation in a one-shot Prisoner's Dilemma (PD) via `FairBot` (cooperate if opponent cooperates) and Defection via `DefectBot` (defect always) explains nothing unless it predicts *which* bot will be present. If the epistemic condition is just "they know what they are running," you have not explained why they are running *those* specific programs. You have replaced the equilibrium selection problem with a **program selection problem**. Without an independent theory of program selection (e.g., evolutionary stability, computational cost, design constraints), the view is unfalsifiable.

  #### 2. The Halting and Consistency Problem (Decisive)
  Common Knowledge of Programs (CKP) implies that Player A knows Player B's code, and Player B knows Player A's code, and crucially, they can compute the outcome of the interaction *before* playing. If the programs are allowed to simulate each other (to check for cooperation), you run into the Halting Problem or logical paradoxes (e.g., "I do the opposite of what you do").
  *   **Why it is decisive:** If the "decision procedures" are sufficiently expressive (e.g., Turing complete), CKP is logically impossible in many cases because the mutual simulation does not halt. If you restrict the programs to avoid this (e.g., bounded time), you must justify that restriction. If the restriction is strong enough to ensure halting, it often collapses back into standard Nash outcomes (defection in PD), undermining your claim that CKP sustains cooperation.

  #### 3. The Epistemic Regress (Severe)
  You argue CKP is less demanding or more realistic than Common Knowledge of Rationality (CKR). This is likely false. CKR requires knowing preferences and belief-updating rules. CKP requires knowing the *exact source code* of the opponent.
  *   **Why it is severe:** In biological or social contexts, CKR is already an impossible idealization. CKP is *more* impossible. I cannot know your neural algorithm; I can barely guess your preferences. By shifting the burden to "knowledge of procedures," you have made the epistemic requirement strictly harder. Unless you are talking about literal software agents exchanging code, CKP is less plausible than CKR.

  #### 4. The Normative Gap (Awkward)
  Even if CKP sustains cooperation in the PD, does it make it *rational*? Standard rationality is defined over outcomes (payoffs). If my program cooperates because it is hard-coded to match you, am I being rational, or am I merely the vessel of a program that was rational *ex-ante*?
  *   **Why it is awkward:** This risks collapsing the distinction between the agent and the mechanism. If the "rationality" resides in the choice of program (pre-commitment) but the execution is deterministic, the "decision" at the time of play is illusory. This doesn't defeat the theory, but it forces a redefinition of agency that many find unpalatable.

  ---

  ### Part 2: What Defenders Would Concede vs. Dismiss

  #### What Defenders Would Concede
  1.  **CKP is not a free lunch:** Defenders (like Tennenholtz or proponents of Logical Decision Theory) would concede that CKP alone does not solve the selection problem. They would admit you need a **meta-constraint** on the space of allowable programs. This is usually handled by imposing **complexity bounds** (e.g., players can only run polynomial-time algorithms) or **evolutionary stability** (only certain bots survive replication). They would agree that without these bounds, the view is indeed vacuous.
  2.  **CKP is epistemically demanding:** They would grant that CKP is a stronger epistemic assumption than CKR in human contexts. They would argue, however, that for *AI* or *institutional* interactions (where code is auditable), CKP is actually *weaker* (more realistic) than CKR, because we can verify code but never verify internal beliefs.
  3.  **Backward Induction is not "dissolved" but "circumvented":** They would concede that if the common knowledge programs are standard recursive maximizers, you still get Backward Induction. The "dissolution" only works if the common knowledge programs are *commitment devices* (e.g., "Tit-for-Tat with error correction"). They would admit this relies on the availability of such programs, which returns to the Selection Problem.

  #### What Defenders Would Dismiss
  1.  **"It's just re-labeled Game Theory":** They would reject the idea that this collapses into standard equilibrium analysis. Standard Nash equilibrium assumes strategies are opaque functions from history to action. Program Equilibrium assumes strategies are transparent code. This difference allows for **conditional cooperation** that is impossible in Nash (e.g., "Cooperate if and only if the opponent's code implies cooperation"). This is a structural change, not just a relabeling.
  2.  **"The Halting Problem makes it useless":** They would dismiss this as a technicality solvable by **bounded rationality**. If agents are bounded (finite state machines or bounded time), mutual simulation is possible. They would argue that *real* rationality is bounded, so a theory that respects bounds is superior to one that assumes unbounded CKR.
  3.  **"It's too idealized for humans":** They would argue this misses the point. The goal is not to model human psychology but to define the **normative logic of strategic interaction** for general agents (including AI). If the theory works for silicon, it earns its keep even if it fails for carbon.

  ---

  ### Part 3: The Verdict

  #### Does it earn its keep over the "Boring Alternative"?
  The "boring alternative" is instrumentalism: *Solution concepts are just definitions we find useful; don't ask for epistemic foundations.*

  **Your position earns its keep ONLY IF:**
  You can provide an independent, non-ad-hoc constraint on the **space of admissible programs**.

  *   **If you cannot:** The view collapses into vacuity. You can "explain" any outcome by positing the right pair of programs. This is worse than the boring alternative because it pretends to offer an explanation (epistemic foundations) while actually offering a post-hoc rationalization.
  *   **If you can:** (e.g., "Agents are evolved to minimize computational complexity" or "Agents are AI systems that must open-source to trade"), then the view is **superior** to the boring alternative. It explains *why* certain equilibria are focal. For example, if computational cost is the constraint, it might explain why simple strategies (Tit-for-Tat) are common knowledge and complex defections are not.

  #### The Fatal Flaw in Your Specific Formulation
  You wrote: *"What has to be common knowledge... is the programs the players are running."*

  The fatal flaw is that **Common Knowledge of Programs does not imply Common Knowledge of Outputs.**
  Even if I know your code, if your code involves a random number generator or a simulation of me (which simulates you...), I may not know what action the code produces. To get the results you want (cooperation, avoiding backward induction), you need **Common Knowledge of Fixed Points**. You need us to know not just the code, but the *result* of the code interacting.

  This requires a **logical omniscience** assumption that is strictly stronger than CKR. CKR assumes I know you maximize utility. CKP + Output-Knowledge assumes I can solve the halting problem for your code relative to mine.

  #### Final Judgment
  The charge of vacuity is **fatal** unless you anchor the "programs" in a physical or evolutionary reality that restricts their variety.

  *   **If you treat "programs" as abstract mathematical functions:** The view collapses into "anything goes." It is unfalsifiable.
  *   **If you treat "programs" as physical/computational constraints:** The view becomes a theory of **Computational Equilibrium**. This is a valuable, distinct contribution. It tells us that equilibrium selection is a function of computational complexity, not just preference ordering.

  **Recommendation:**
  Do not sell this as "Common Knowledge of Procedures." Sell it as **"Equilibrium under Computational Constraints."**
  Acknowledge that CKP is *harder* than CKR, but argue that **CKR is the wrong hardness.** CKR assumes we know beliefs (impossible) but ignores code (visible). In modern contexts (AI, contracts, institutions), code is visible and beliefs are hidden. Therefore, CKP is the *relevant* idealization for the future of game theory, even if it is epistemically demanding.

  If you make that pivot, you escape the charge of vacuity by grounding the "programs" in the physical reality of computation, and you escape the "boring alternative" by making testable predictions about which equilibria emerge under specific complexity bounds. If you stay with pure epistemology, the vacuity charge will crush the position.
