answer: |-
  **Essay Question**

  A citizens' panel of 999 members decides whether a reservoir is contaminated. Every member watches the same televised demonstration by a single expert. The demonstration is correct with probability 0.7. Each member follows the demonstration with probability 0.9; the remaining tenth form their own judgment, independent of the demonstration, correct with probability 0.55. Calculate the panel's majority reliability and compare this with a straightforward application of the Condorcet Jury Theorem to each member's individual reliability. Identify which theorem assumption this case violates, explaining why this is distinct from voter ignorance. Explain why enlarging the panel would not improve reliability and what this shows about appeals to the theorem in defence of majority rule. Finally, discuss what changes when the question is evaluative rather than factual, and whether the theorem applies at all.

  ***

  **Model Answer**

  The Condorcet Jury Theorem (CJT) posits that if voters are competent ($p > 0.5$) and independent, majority reliability approaches 1 as group size increases. This case reveals how violating independence undermines that conclusion, even when competence holds.

  First, we calculate individual competence ($p$). A voter is correct if they follow the expert (who is correct) or act independently (and are correct). $p = (0.9 \times 0.7) + (0.1 \times 0.55) = 0.63 + 0.055 = 0.685$. Since $p > 0.5$, the competence condition is met. A straightforward application of CJT assumes independence; thus, it predicts that with $n=999$, the majority verdict reliability should be effectively 1.0.

  However, the actual reliability is determined by the common signal. 90% of voters mirror the expert. If the expert is correct (probability 0.7), at least 90% vote correctly, securing a majority. If the expert is incorrect (probability 0.3), at least 90% vote incorrectly, securing a false majority. The independent 10% cannot sway the result. Therefore, the panel's reliability is approximately 0.7, not 1.0.

  The violated assumption is independence, not competence. Voters are correlated through the common expert signal. This is distinct from voter ignorance because ignorance concerns the magnitude of $p$ (competence), whereas this problem concerns the covariance of errors. The voters are individually competent ($0.685 > 0.5$), but their errors are systematic rather than random.

  Consequently, enlarging the panel does not improve reliability. CJT relies on the law of large numbers to cancel out random errors. Here, errors are not random; they are shared. As $n \to \infty$, the majority simply locks onto the expert's verdict with greater precision, preserving the expert's 0.7 error rate. The limit of reliability is 0.7, not 1.

  This demonstrates that appeals to CJT in defence of majority rule are fragile. The theorem guarantees epistemic superiority only under strict independence. In real-world democracies, where voters share information sources (media, experts), errors correlate. Thus, majority rule cannot be defended solely on the mathematical inevitability of correctness; institutional designs fostering independent judgment are requisite.

  Finally, if the question is evaluative (e.g., whether to decommission), the theorem arguably cannot bear on the question at all. CJT requires a mind-independent truth condition against which verdicts are measured. Evaluative questions concern preferences or norms, not facts. Without an objective "correct" answer, $p$ is undefined. While one might posit a "common good," applying CJT here requires controversial meta-ethical assumptions about moral truth. Thus, the theorem's epistemic defence of majority rule collapses entirely for normative questions, restricting its utility to factual determinations where independence can be secured.

  ***

  **Marking Scheme**

  **Total: 25 Marks**

  **1. Calculation of Competence and Group Reliability (5 marks)**
  *   **Award:** 3 marks for correct individual $p$ (0.685); 2 marks for correct group reliability (~0.7).
  *   **Characteristic Error:** Calculating $p$ correctly but assuming group reliability follows CJT (1.0) rather than the common signal logic.

  **2. Comparison with CJT Prediction (5 marks)**
  *   **Award:** 5 marks for explicitly stating CJT predicts convergence to 1.0 given $p > 0.5$ and large $n$, highlighting the discrepancy.
  *   **Characteristic Error:** Claiming CJT predicts 0.7 because the expert is 0.7 reliable (confusing the theorem's conditions with the case data).

  **3. Identification of Violated Assumption (5 marks)**
  *   **Award:** 5 marks for identifying Independence (not Competence) as the violated assumption.
  *   **Characteristic Error:** Arguing the Competence assumption is violated because 0.7 is "not high enough," missing that $p > 0.5$ is the only threshold.

  **4. Distinction from Ignorance and Limit Behavior (5 marks)**
  *   **Award:** 3 marks for distinguishing correlation from ignorance; 2 marks for explaining why larger $n$ fails to dilute common error.
  *   **Characteristic Error:** Arguing that increasing $n$ would eventually swamp the expert's influence through the independent voters.

  **5. Implications and Evaluative Shift (5 marks)**
  *   **Award:** 3 marks for noting CJT defence of majority rule requires independence mechanisms; 2 marks for stating CJT fails on evaluative questions due to lack of truth conditions.
  *   **Characteristic Error:** Asserting CJT applies to evaluative questions provided voters agree on values (ignoring the truth-condition requirement).
