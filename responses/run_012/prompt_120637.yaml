          *   Faction B: Sense/Tone/Image is essential; preserving form at the cost of these is betrayal; free verse/prose can be more faithful.
      *   **Task:** Diagnose the impasse. Not more examples. Identify the *kind* of disagreement (substantive, verbal, different questions, mixed). Test the user's hypothesis (mixed case: metaphysical, evaluative, verbal). Determine what would count as progress.
