      *   **Faction A (Formalists):** Believe the poem *is* its form. Meaning is inseparable from form. Translation must recreate the formal constraints to be a translation of the *poem* (not just the text).
      *   **Faction B (Semanticists/Effectualists):** Believe the poem's core is its message, tone, or effect. Form is a vehicle. If the vehicle breaks the cargo (sense/tone), change the vehicle. Translation is about communicating the *experience* or *content*.
      *   **User's Hypothesis:** Mixed case (metaphysical [form vs. content], evaluative [purpose of translation], verbal [definition of "fidelity"]).

  3.  **Evaluate the Hypothesis:**
      *   *Metaphysical:* Is form part of meaning? In poetics, this is heavily debated. Formalists say yes (New Criticism, Russian Formalism). Semanticists often treat them as separable for practical purposes (even if theoretically acknowledging unity).
      *   *Evaluative:* What is translation *for*? Reading aid? Standalone poem in target language? Historical artifact? Performance?
      *   *Verbal:* What counts as a "translation"? Is a prose crib a translation? Is a radical adaptation a translation?
      *   *Diagnosis:* The user's hypothesis is strong. It captures the multidimensional nature of the stalemate. It's not just one thing.

  4.  **Identify Settled vs. Contested (in Translation Theory):**
      *   *Settled:* Perfect equivalence is impossible. Some loss is inevitable. Context matters. There is no single "correct" translation.
      *   *Contested:* The hierarchy of losses (what is *most* important to preserve). The definition of "faithfulness." Whether form *is* content. The ontological status of the translated poem (is it a copy, a new original, a performance?).

  5.  **Determine Progress:**
      *   Since this is a normative/aesthetic debate, empirical resolution is unlikely.
      *   Progress comes from clarifying *goals* (skopos theory).
      *   Progress comes from accepting pluralism (multiple valid translations for different purposes).
      *   Progress comes from shifting from "which is true?" to "what does this version enable?"

  6.  **Drafting the Diagnosis:**
