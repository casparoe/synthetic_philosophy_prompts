answer: |-
  **Exam Question**

  **Final Essay: The Doing/Allowing Distinction**

  **Instructions:** Answer the following question in no more than 1,000 words. You have 90 minutes.

  **Prompt:**
  In this course, we have defined the doing/allowing distinction in two ways:
  1.  **Causal Reading:** An agent *allows* an outcome when their conduct is not among its causes; they *do* it when their conduct is among the causes.
  2.  **Normative Reading:** An agent *allows* an outcome when they omit to prevent it in breach of a duty to prevent it; otherwise, they are not counted as allowing it (implying doing or non-responsibility).

  Construct two original cases (not from standard literature) demonstrating where these readings diverge:
  *   **Case A:** The Causal Reading counts the agent as *allowing* the harm, but the Normative Reading does not.
  *   **Case B:** The Normative Reading counts the agent as *allowing* the harm, but the Causal Reading does not (i.e., counts it as *doing*).
  *   **Constraint:** At least one case must involve a machine's default behaviour or a division of labour across multiple agents.

  After presenting the cases, argue whether the doing/allowing distinction, on either reading, can bear the moral weight typically assigned to it in the killing/letting-die debate. Defend your verdict against the strongest objection (e.g., that the causal reading covertly imports norms, or that the normative reading reduces the distinction to the question of duty).

  ***

  **Model Answer**

  The divergence between causal and normative readings reveals that the doing/allowing distinction is not a stable foundation for moral judgment. By constructing cases where the readings conflict, we see that the classification depends on descriptive framing rather than moral reality.

  **Case A: The Uninvolved Bystander at the Automated Gate**
  Consider a secured facility where an automated gate prevents floodwaters from entering a valley. The system is fully autonomous; no human input is required to keep it closed. A passerby notices a malfunction that will open the gate in one hour. They have no special relationship to the facility, no contract, and no legal duty to intervene. They walk away. The gate opens, and the valley floods.
  *   **Causal Reading:** The passerby’s conduct (walking away) was not a cause of the flooding; the malfunction was. Thus, they *allowed* the harm.
  *   **Normative Reading:** The passerby omitted to prevent the harm, but not in breach of a duty. Therefore, they did not *allow* it in the normative sense (they are not responsible).
  Here, the causal reading identifies allowing where the normative reading finds no culpable allowing.

  **Case B: The Drone Operator’s Withdrawal**
  A military drone requires continuous signal encryption to remain airborne over a conflict zone; otherwise, it defaults to landing. An operator is under a strict duty to maintain coverage. To end the shift, the operator actively presses the "Return to Base" button. The drone lands, and civilians in the zone are subsequently harmed by ground forces who would have been deterred.
  *   **Causal Reading:** The operator performed a physical action (pressing the button) which caused the drone to leave. Their conduct is among the causes of the harm. Thus, they *did* the harm (did not allow it).
  *   **Normative Reading:** The conduct is framed as withdrawing aid or failing to continue protection. Since there was a duty to prevent the harm by staying, and they omitted to continue, this is treated as *allowing* the harm (letting die).
  Here, the normative reading identifies allowing where the causal reading identifies doing.

  **Moral Weight and Objection**
  Given these divergences, the distinction cannot bear the moral weight often placed upon it. If "allowing" is sometimes a cause (Case B) and sometimes non-culpable (Case A), the label itself carries no intrinsic moral significance. The moral weight lies not in the metaphysics of causation or the semantics of omission, but in the underlying duties and consequences.

  The strongest objection is that the **Causal Reading covertly imports norms**. One might argue that in Case B, we only call the button-press an "action" because we assume the operator had no right to stop. If they had a right to stop, the conduct might be causally described as "ceasing to save," rendering it an omission. Thus, the causal reading collapses into the normative reading.

  **Defense**
  This objection fails because physical causation is independent of moral permission. In Case B, the muscle contraction and signal interruption are physical causes regardless of the operator's duty. Whether the act is justified does not change the causal chain. The causal reading remains distinct but morally inert. Alternatively, one might object that the **Normative Reading reduces the distinction to the separate question of duty**. This is correct, but it is not a flaw; it is a dissolution. The objection admits that the doing/allowing distinction adds nothing to the moral analysis beyond the existence of a duty. If the distinction merely mirrors the duty question, it is redundant. Therefore, neither reading supports a robust moral distinction between killing and letting die. The focus should shift directly to the scope of positive duties and the justification of actions, rather than relying on a unstable categorical boundary.

  ***

  **Marking Scheme (Total: 20 Marks)**

  | Point | Criteria | Marks | Common Error |
  | :--- | :--- | :--- | :--- |
  | **1** | **Case A Construction:** Correctly depicts an omission without duty (Causal Allow / Normative Not Allow). | 4 | Candidates often assign a duty to the bystander, collapsing the divergence. |
  | **2** | **Case B Construction:** Correctly depicts an action framed as omission with duty (Normative Allow / Causal Do) + meets Machine/Labour constraint. | 4 | Candidates often use standard literature cases (e.g., Thomson's Violinist) or fail to make the conduct a causal action. |
  | **3** | **Verdict on Moral Weight:** Clearly states whether the distinction can bear moral weight (usually "no") based on the divergence. | 4 | Candidates often hedge or claim the distinction matters without explaining why divergence undermines it. |
  | **4** | **Objection Identification:** Accurately states the strongest objection (Collapse of Causal into Normative OR Reduction of Normative to Duty). | 4 | Candidates often attack a strawman objection (e.g., "intentions matter") rather than the structural collapse. |
  | **5** | **Defense/Rebuttal:** Defends the verdict against the objection logically (e.g., distinguishing physical cause from justification). | 4 | Candidates often concede the objection entirely without defending their initial verdict. |
