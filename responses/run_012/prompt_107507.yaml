      *   *Sentence 7:* "And since we can now train systems on human feedback, we have largely solved specification; what remains is mostly the political question of whose values get encoded."
          *   *Verdict:* Reject. RLHF does not solve specification (Goodhart's Law, reward hacking). It shifts the bottleneck, doesn't remove it.
      *   *Sentence 8:* "The upshot is that a powerful AI will be dangerous unless its utility function is correct, and that a correct utility function is one that matches what people say they want."
