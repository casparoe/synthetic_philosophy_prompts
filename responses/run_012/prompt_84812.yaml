      *   *Nuance:* Is it strictly true that you can rearrange terms in a probability space? The sample space is countable. The expectation is a sum over the sample space. If the sum is conditionally convergent, the value depends on the enumeration of the sample space. Since the sample space elements (outcomes) are distinct, does re-indexing them change the gamble?
      *   *Deep Dive:* In standard measure theory, the Lebesgue integral is defined only if the absolute integral is finite (for signed measures/functions). If not, the integral is undefined. The "natural order" is just one specific enumeration. Decision theory requires the value to be independent of description. If re-describing the same physical outcomes (grouping them differently) changes the value, the value is ill-defined.
