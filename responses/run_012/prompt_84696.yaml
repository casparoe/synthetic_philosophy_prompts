answer: |-
  **1. The Game Theorists (Highest Damage)**
  **Objection:** "You claim expected-utility models treat future action as probabilistic choice. But removing a branch is trivial in extensive form. Isn't this just Schelling's commitment device? Where is the formal innovation beyond renaming constraints? Trembling-hand refinements already handle imperfect control."
  **Reply:** "Standard refinements preserve the *possibility* of choice or error; they assume a chooser exists at every node. I'm arguing brinkmanship works by eliminating the node entirely, not weighting it. Models assuming a chooser exists at every node mispredict opponent updating. They see risk; the opponent sees inevitability. The innovation isn't the math, it's the ontology of the strategy space."
  **Soft Spot:** Formally, a removed node is just a constraint. You must prove opponents cognitively distinguish 'low probability' from 'no option,' or the model adds no predictive power. If you can't formalize the distinction, it's just semantics.

  **2. Security Studies (Medium Damage)**
  **Objection:** "Empirically, no leader ever truly destroys choice. Protocols degrade, but 'the button' remains. Isn't this theoretical fiction?"
  **Reply:** "Physical demolition isn't required; functional demolition is. Delegated authority or automated retaliation systems create 'choicelessness' even if a human sits there. The *belief* in lost agency drives the deterrent. Cold War history is full of leaders claiming their hands were tied to force concessions."
  **Soft Spot:** Hard to distinguish functional demolition from high-stress choice in historical records. If a leader *could* have stopped it but didn't, your mechanism fails. You need a case where retreat was physically impossible, not just politically costly.

  **3. Moral Philosopher (Lowest Damage)**
  **Objection:** "If you destroy your ability to choose, do you evade moral responsibility for the catastrophe?"
  **Reply:** "Responsibility shifts to the initial act of demolition. It clarifies blame rather than evading it. You are responsible for making yourself dangerous."
  **Soft Spot:** Just-war theory requires discrimination and proportionality *at the moment of impact*. If you cannot choose to stop, you cannot satisfy these criteria in the moment, potentially making the act inherently unjust regardless of prior intent.

  **Concede vs. Die**
  **Concede:** Formal game theory *can* represent removed branches. Don't fight the math. Admit that EU models can technically encode "no choice."
  **Die On:** The behavioral distinction. Opponents react differently to "he might fire" vs. "he cannot stop firing." This psychological gap is where the work happens. If you concede this is just standard commitment theory, your thesis vanishes.

  **The Dreaded Question**
  "If you genuinely demolish your ability to retreat, you remove off-ramps for both sides. Why doesn't this maximize the likelihood of catastrophe rather than deter it?"
  **Prep:** Acknowledge the instability. Argue that deterrence relies on the opponent believing the off-ramp is gone *for you*, forcing them to take the only remaining safe path (backing down). It works only if the demolition is credible but the trigger remains conditional on *their* move. If you lose conditionality, you're just suicidal.
