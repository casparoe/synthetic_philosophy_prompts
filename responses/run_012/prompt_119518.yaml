answer: |-
  Bottom line: Your coworker is rhetorically effective but philosophically shallow, conflating rigid rule-worship with structured moral constraints that specifically forbid using people as means.

  Brainstorm:
  *   Deontology ignores consequences entirely.
  *   Rules act as lexical priorities over utility calculations.
  *   Agent-relative constraints forbid *my* doing harm, not preventing it.
  *   Intending harm differs morally from merely foreseeing it.
  *   The paradox: minimizing violations might require violating.
  *   Calculating outcomes is epistemically unreliable.
  *   Moral integrity matters more than optimal states of affairs.
  *   It's an ad hominem about intellectual laziness.

  The menu:
  **The Caricature:** Deontology ignores consequences entirely. **Verdict: False.** Deontologists weigh outcomes but deny they justify rights violations. This reading suggests deontologists are blind to the breach impact, which is untrue; they just weigh privacy rights heavier than utility. This doesn't support his conclusion unless you assume rights are worthless.

  **The Lexical Priority:** Rules trump utility calculations. **Verdict: Substantive.** Rights are side-constraints, not goals to be maximized. This claims certain actions are forbidden regardless of the "math." This directly rejects his conclusion that we should sacrifice the one.

  **The Agent-Relative Constraint:** I must not violate rights, even to prevent others from doing so. **Verdict: Substantive.** This flags the difference between agent-relative constraints and agent-neutral reasons. It argues *I* am responsible for *my* actions, not the total outcome. This forbids sacrificing the one because *I* would be the violator.

  **The Paradox of Deontology:** If violations are bad, we should minimize total violations. **Verdict: Radical.** This argues that if rights violations are bad states of affairs, we ought to minimize them globally, even if it requires one violation. If accepted, this supports his conclusion, but it collapses deontology into consequentialism.

  **The Epistemic Hedge:** We can't trust the math. **Verdict: Plausible.** Claims uncertainty justifies rules because we can't predict breach outcomes reliably. This doesn't necessarily support sacrifice if the breach isn't certain, but it frames deontology as risk management rather than moral dogma.

  Which readings actually support his use:
  Only the "Paradox" reading supports sacrificing the one, but accepting it destroys deontology by turning rights into mere numbers. The "Caricature" supports him only if you accept his false premise that rights are negligible. The core deontological readings (Lexical Priority, Agent-Relative) explicitly forbid his conclusion because they distinguish between intending harm (violating privacy) versus merely foreseeing it (the breach happening), and because they treat constraints as personal duties rather than global optimization problems.

  What I should say back:
  "Deontology isn't avoiding math; it's refusing to treat rights as negotiable currency. If we sacrifice one user's rights as a means to save others, we validate the very breach logic we're fighting. We need security that doesn't require becoming the attacker."
