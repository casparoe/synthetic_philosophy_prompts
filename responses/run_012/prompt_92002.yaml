prompt: |-
  I'm a backend engineer turned tech lead at a forty-ish person startup. I have no philosophy training at all, and I keep running into the same shape of problem: a move that's clearly best for me individually, that nobody will ever notice, and that makes things slightly worse for everyone if enough of us make it. Crank the concurrency on the shared CI box because my pipeline is slow today. Run the fat ad-hoc query against the prod replica instead of waiting for the nightly sync. Skip the design doc because we're already two days behind. Hardcode the config value instead of fixing the shared helper that everyone else also has to work around.

  A friend pointed me at Hofstadter's superrationality stuff — the Platonia setup with all the perfect reasoners, and the lottery where the prize gets divided by the number of entries so every extra entry you send in is a small cost to everybody and a small gain to you. That feels like exactly the shape of my problem. But I don't want a philosophy essay. I want a procedure my team can actually run.

  So: write me a decision procedure for this class of decisions, grounded in whatever superrationality actually says, that a senior engineer with no theory background can run in about fifteen minutes before a design review. Questions to ask in order, what counts as a sufficient answer to each, where it stops with a hard no, and where it hands the decision back to a human because the remaining question is values and not facts. It has to be short enough that I can paste it into a wiki page, and it can't require any probability math beyond eyeballing rough numbers. The staff engineer and my manager both have to sign off on it, so it needs to survive a skeptical reading.

  Two things I specifically want it to nail, because I'd get them wrong on my own. First, the difference between this and plain "what if everyone did it" golden-rule reasoning — I'm pretty sure those give different verdicts in some cases and I want to know which parts of the procedure are just the golden rule wearing a lab coat. Second, what exactly makes the other person's decision correlated with mine in the first place: whether my teammate deciding the same way is something I'm causing, or something that just happens because we're both the same kind of reasoner under the same pressure, and whether that distinction should change my answer.

  Then run it on three cases and show your work: (1) me bumping my share of the shared CI box, (2) my team skipping design docs during a crunch, (3) me deciding whether to enter a company-wide thing where everyone who contributes a little gets a lot more back — I want at least one of these to come out in a way I won't like, and I want you to say which one and why.

  Be upfront about where the procedure will misfire and which steps are just judgment dressed up as procedure. Don't send me to papers or books, I won't read them.

  Open with the procedure itself — the steps in order, short enough to fit on a sticky note — and then unpack each step with the reasoning behind it. No intro paragraph, no restating my question.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Backend engineer turned tech lead at a ~40 person startup. No philosophy training.
      *   **Problem:** Recurring "tragedy of the commons" / social dilemma situations in engineering (CI abuse, prod queries, skipping docs, hardcoding). Individual gain, collective pain if scaled.
      *   **Reference:** Hofstadter's superrationality (Platonia dilemma).
      *   **Goal:** A decision procedure (algorithm/checklist) grounded in superrationality, runnable in ~15 mins, wiki-friendly, sign-off ready (staff eng + manager).
      *   **Constraints:**
          *   No philosophy essay.
          *   No probability math beyond eyeballing.
          *   Must distinguish from plain "Golden Rule" ("what if everyone did it").
          *   Must address correlation of decisions (causation vs. common cause/reasoner type).
          *   Must run on three specific cases (CI, Design Docs, Company-wide contribution).
          *   One case must result in an unfavorable verdict for the user (and explain why).
          *   Be upfront about limitations/judgment calls.
          *   **Format:** Open with the procedure itself (sticky-note size), then unpack reasoning. No intro paragraph.

  2.  **Deconstruct Superrationality vs. Golden Rule:**
      *   *Golden Rule (Kantian Categorical Imperative lite):* "Act only according to that maxim whereby you can at the same time will that it should become a universal law." It's moralistic. It assumes you *should* care about everyone.
      *   *Superrationality (Hofstadter):* It's *instrumental* rationality. It assumes everyone is a perfect reasoner facing the same problem. If I decide X, I must assume another perfect reasoner in my position will also decide X. Therefore, my choice *correlates* with theirs, not because I cause theirs, but because we run the same "algorithm" (reasoning process) on the same input.
      *   *Key Distinction:* Golden Rule is about duty/morality. Superrationality is about self-interest aligned with group interest through logical correlation. For a startup engineer, "self-interest" includes the company surviving (job security, product success).
      *   *Correlation:* It's not causation ("I choose X so they choose X"). It's logical identity ("We are both rational agents in similar contexts, so we will likely output the same decision").

  3.  **Drafting the Procedure (Sticky Note Version):**
      *   Needs to be concise, actionable, sequential.
      *   Step 1: Identify the shared resource/constraint.
      *   Step 2: Estimate individual gain vs. collective cost.
      *   Step 3: Assess correlation (Are others facing the same pressure/logic?).
      *   Step 4: Calculate the "Superrational Sum" (If everyone does this, do we win or lose?).
      *   Step 5: Check for escape hatches (coordination mechanisms).
      *   Step 6: Decision.

      *Refining for the User's Constraints:*
      *   Needs to explicitly handle the "Golden Rule" distinction.
      *   Needs to handle the "Correlation" question.
      *   Needs to be sign-off ready.

      *Draft Steps:*
      1.  **Define the Action:** What exactly are you doing?
      2.  **Identify the Commons:** What shared resource degrades?
      3.  **The Mirror Test:** If every engineer facing this same pressure did this, would the team succeed or fail? (Yes/No)
      4.  **The Correlation Check:** Are your peers rational actors facing similar incentives? (Yes/No)
      5.  **The Coordination Out:** Is there a way to signal/change the rule so everyone benefits? (Yes/No)
      6.  **Verdict:** If Mirror=Fail AND Correlation=Yes, DO NOT ACT unless Coordination=Yes.

      *Wait, need to ensure one case fails for the user.*
      *   Case 1 (CI): Individual gain high, collective cost medium. If everyone cranks CI, build times explode. Verdict: No.
      *   Case 2 (Design Docs): Individual gain (speed), collective cost (tech debt). If everyone skips docs during crunch, onboarding/maintenance dies. Verdict: No (this might be the unpopular one).
      *   Case 3 (Company contribution): This sounds like a public good game. If everyone contributes, everyone wins. If I don't, I free ride. Superrationality says contribute. Verdict: Yes.

      *Let's adjust to ensure one is definitely "No" when the user wants "Yes".*
      *   User likely wants to skip design docs during crunch. That should be the "No".
      *   User likely wants to bump CI. That should be the "No".
      *   User likely wants to know about the company thing.
      *   I need to make sure the procedure is robust enough to survive skeptical staff eng review.

  4.  **Developing the Unpacking/Reasoning:**
      *   Explain *why* Step 3 (Mirror Test) isn't just Golden Rule. (Golden Rule = Moral obligation. Mirror Test = Logical prediction of outcome based on shared reasoning).
      *   Explain *why* Step 4 (Correlation) matters. (If peers are irrational or have different incentives, superrationality doesn't hold. If they are similar engineers under similar pressure, correlation is high).
      *   Address the "Causation vs. Correlation" question explicitly in the unpacking.

  5.  **Running the Cases:**
      *   **Case 1 (CI):** Shared resource (CI boxes). Action: Crank concurrency. Mirror: All 40 engineers crank concurrency. Result: CI collapses. Correlation: High (everyone hates slow builds). Verdict: Don't do it.
      *   **Case 2 (Design Docs):** Shared resource (System coherence/knowledge). Action: Skip doc. Mirror: All skip docs during crunch. Result: Unmaintainable spaghetti, crunch never ends. Correlation: High (everyone feels time pressure). Verdict: Don't do it (This is the unpopular one).
      *   **Case 3 (Company Contribution):** Shared resource (Company success/bonus pool). Action: Contribute effort. Mirror: All contribute. Result: Company wins, everyone gets bonus. Correlation: High. Verdict: Contribute.

      *Wait, I need one case to come out in a way the user won't like.*
      *   Usually, engineers want to skip docs to ship faster. The procedure should say "No".
      *   Engineers want to hog CI. Procedure says "No".
      *   Engineers might be cynical about company-wide contributions ("management trick"). If the procedure says "Yes, contribute," a cynical engineer might dislike that.
      *   Let's make Case 2 (Design Docs) the one they won't like. They want to skip it to save time. The procedure says "No, because if everyone does it, the crunch becomes permanent."

  6.  **Refining the Procedure for "Sign-off" Quality:**
      *   Needs to sound professional, not woo-woo.
      *   Avoid terms like "Superrationality" in the checklist itself, use operational terms.
      *   Ensure the "Correlation" step is clear about *why* we assume others act like us (similar hiring bar, similar incentives).

  7.  **Addressing the Specific Questions:**
      *   *Golden Rule vs. Superrationality:* Golden Rule is normative (you *ought*). Superrationality is descriptive/predictive (if you reason this way, they *will* too). The procedure must rely on the prediction of failure, not the morality of selfishness.
      *   *Correlation:* It's not causation. It's "logical identity." We are running the same software (brains/training) on the same input (pressure/deadline).

  8.  **Final Review against Constraints:**
      *   Open with procedure (sticky note).
      *   No intro paragraph.
      *   Unpack steps.
      *   Address Golden Rule/Correlation distinctions explicitly.
      *   Run 3 cases.
      *   One unpopular verdict.
      *   Admit limitations.
      *   No math beyond eyeballing.
      *   Wiki-friendly tone.

      *Self-Correction on Procedure Length:* Keep it tight.
      *Self-Correction on Case 3:* The prompt says "company-wide thing where everyone who contributes a little gets a lot more back". This sounds like a positive sum game if everyone participates. Superrationality says participate. If the user is cynical, they might hate this. Or I can make the Design Doc one the hated one. Let's stick with Design Docs as the hated one because it directly impacts their immediate workflow velocity.

      *Wait, one nuance:* The prompt asks for "where it stops with a hard no, and where it hands the decision back to a human because the remaining question is values and not facts."
      *   I need to build a "Handoff" step into the procedure.

      *Revised Procedure Steps:*
      1.  **Isolate the Gain:** What do *you* get? (Time, comfort, speed).
      2.  **Scale the Pain:** If all 40 engineers did this today, does the system break? (Yes/No).
      3.  **Check Correlation:** Are your peers facing the same incentives and constraints? (Yes/No).
      4.  **Coordination Check:** Can you solve this by changing the rule for everyone? (Yes/No).
      5.  **Decision:** If Scale=Break AND Correlation=Yes, STOP. Unless Coordination=Yes.

      *Wait, need to ensure the "Golden Rule" distinction is clear in the unpacking.*
      *   Golden Rule: "It would be bad if everyone did it, so I shouldn't." (Moral).
      *   Superrational Procedure: "It would be bad if everyone did it, and since everyone is reasoning like me, everyone *will* do it if I do, so I shouldn't." (Causal/Logical prediction).

      *Let's finalize the procedure text.*

      *Case 3 Detail:* "company-wide thing where everyone who contributes a little gets a lot more back". This sounds like a stock option refresh or a bonus pool tied to collective OKRs. If I don't contribute, I free ride. If everyone doesn't contribute, we all lose. Superrationality says contribute. If the user is looking for a justification to slack off, this verdict will be disliked. But Design Docs is more visceral. I'll make Design Docs the "No" because it contradicts the "ship fast" startup mentality.

      *Actually, let's look at the "Unpopular" constraint again:* "I want at least one of these to come out in a way I won't like".
      *   If I'm a tech lead wanting to ship, skipping docs is tempting. Procedure says No.
      *   If I'm a tech lead wanting CI speed, hogging CI is tempting. Procedure says No.
      *   If I'm a tech lead cynical about company initiatives, contributing is tempting to skip. Procedure says Yes.
      *   I'll choose the Design Doc one as the explicit "You won't like this" because it directly conflicts with the "crunch" context provided in the prompt.

      *Limitations:* Needs to acknowledge that not everyone is a perfect reasoner (some people are just careless). Needs to acknowledge that sometimes the system *should* break to force investment (breaking the CI box to get budget for more boxes).

      *Okay, ready to write.*

      *Structure:*
      1.  The Procedure (Sticky Note).
      2.  The Unpacking (Reasoning, Golden Rule distinction, Correlation distinction).
      3.  The Cases (CI, Docs, Company Thing).
      4.  Limitations/Failure Modes.

      *Tone:* Direct, engineering-focused, no fluff.

      *One more check on the Correlation distinction:*
      *   User asks: "whether my teammate deciding the same way is something I'm causing, or something that just happens because we're both the same kind of reasoner under the same pressure, and whether that distinction should change my answer."
      *   Answer: It's the latter (common cause/reasoner type). It shouldn't change the *answer* (the decision is the same), but it changes the *justification* (logical correlation vs. magical causation). I need to make sure the procedure doesn't claim I *cause* them to do it.

      *Let's refine the Procedure Step 3:* "Are your peers likely to run the same calculation?" instead of "Are they facing same incentives?" to capture the "reasoner" aspect.

      *Okay, let's draft.*
answer: |-
  # The Shared-Resource Decision Procedure

  1.  **Isolate the Gain:** What specific benefit do you get right now? (e.g., 30 mins saved, pipeline runs faster).
  2.  **Scale the Pain:** If all 40 engineers made this exact choice today, does the system degrade or break? (Yes/No).
  3.  **Check Correlation:** Are your peers rational actors facing the same incentives and pressure? (Yes/No).
  4.  **Coordination Out:** Can you propose a rule change that captures the gain for everyone without the pain? (Yes/No).
  5.  **Verdict:**
      *   If **Scale=Yes** AND **Correlation=Yes**: **DO NOT ACT** individually.
      *   If **Coordination=Yes**: Escalate to Staff/Manager to implement the rule change.
      *   Otherwise: Proceed.

  ---

  ## Unpacking the Steps

  ### Step 1: Isolate the Gain
  Be specific. "Save time" is too vague. "Save 45 minutes of wait time" is concrete. This anchors the decision in facts, not vibes.
  *   **Sufficient Answer:** A quantifiable metric (time, money, cognitive load).
  *   **Hard Stop:** If you cannot articulate the gain, you are likely acting on habit, not reason. Stop.

  ### Step 2: Scale the Pain (The Mirror Test)
  This is where most procedures stop ("What if everyone did this?"). Here, we treat it as a load test. Imagine 40 copies of you hitting the CI box, the DB, or the codebase simultaneously.
  *   **Sufficient Answer:** A clear "System survives" or "System collapses."
  *   **Hard Stop:** If the system collapses, you have identified a tragedy of the commons. Do not proceed to Step 5 yet.

  ### Step 3: Check Correlation (The Superrationality Check)
  This distinguishes this procedure from the Golden Rule.
  *   **The Golden Rule** says: "It would be bad if everyone did this, so I *ought* not to." (Moral obligation).
  *   **This Procedure** says: "It would be bad if everyone did this, and because my peers are trained similarly and face similar pressures, they *will* reason exactly as I do. Therefore, if I do it, they effectively do it too." (Logical prediction).
  *   **Why it matters:** If your peers are irrational, careless, or have different incentives (e.g., contractors vs. founders), the correlation breaks. Your decision doesn't "cause" theirs; you are simply running the same algorithm on the same input. If the correlation is high, your individual choice is a proxy for the group's choice.
  *   **Sufficient Answer:** "Yes, we are all senior engineers under the same deadline" vs. "No, I'm the only one who cares about performance."
  *   **Hard Stop:** If Correlation=Yes and Scale=Yes, individual action is forbidden. You cannot out-reason the group if you are part of the group logic.

  ### Step 4: Coordination Out
  Superrationality doesn't mean suffering. It means recognizing that the *individual* solution is the problem. The solution must be *collective*.
  *   **Sufficient Answer:** "We buy more CI boxes," "We mandate design docs for changes >X lines," "We fix the helper library."
  *   **Handoff:** If a coordination solution exists, this is no longer an individual decision. It is a management/staff engineering decision. Hand it off.

  ### Step 5: Verdict
  This is the hard constraint. If the system breaks under scale, and your peers will logically follow your lead (even silently), you are not making an individual choice. You are setting the default for the team.
  *   **Values Handoff:** If the "Pain" is subjective (e.g., "code quality feels lower" vs. "system crashes"), this procedure cannot decide. That is a values call for the CTO/Staff Eng.

  ---

  ## Case Runs

  ### Case 1: Bumping CI Concurrency
  *   **Gain:** You save 45 minutes on your build today.
  *   **Scale:** If all 40 engineers bump concurrency, the shared CI box queues stall indefinitely. Builds take 4 hours. System breaks. (Scale=Yes).
  *   **Correlation:** Every engineer hates waiting for builds. Every engineer knows how to bump concurrency. Under pressure, everyone will reason "just this once." (Correlation=Yes).
  *   **Coordination:** Buy more CI runners or optimize the test suite. (Coordination=Yes).
  *   **Verdict:** **DO NOT ACT.** Escalate the need for more CI capacity.
  *   **Why:** Your individual gain is negligible compared to the collective loss. Since everyone is rational, everyone will bump it if you justify it. You are effectively choosing "4 hour builds for everyone" to save 45 minutes for yourself.

  ### Case 2: Skipping Design Docs During Crunch
  *   **Gain:** You ship 2 days faster. Immediate relief on crunch pressure.
  *   **Scale:** If all 40 engineers skip docs during crunch, knowledge silos form. Onboarding stops. Refactors become impossible. The crunch becomes permanent because technical debt slows velocity to zero. (Scale=Yes).
  *   **Correlation:** Everyone is feeling the same crunch pressure. Everyone wants to ship. The incentive to skip is identical across the team. (Correlation=Yes).
  *   **Coordination:** Define a "Crunch Protocol" where docs are lightweight but mandatory, or reduce scope instead of process. (Coordination=Yes).
  *   **Verdict:** **DO NOT ACT.**
  *   **Why (The Unpopular One):** You want to skip the doc to save the team *now*. But because your peers are rational and under the same pressure, they will use your precedent to skip theirs. You aren't saving time; you are trading future velocity for present speed. Since you are a Tech Lead, your correlation weight is higher (others will follow your example more closely). Skipping the doc is logically equivalent to forcing the whole team to skip docs.

  ### Case 3: Company-Wide Contribution (Bonus/Equity Pool)
  *   **Gain:** You save personal effort/time today.
  *   **Scale:** If everyone contributes, the pool grows and everyone gets a significant bonus. If everyone saves effort, the pool shrinks to nothing. (Scale=Yes, but positive direction).
  *   **Correlation:** Everyone wants the bonus. Everyone weighs effort vs. reward. (Correlation=Yes).
  *   **Coordination:** N/A (The mechanism is already collective).
  *   **Verdict:** **CONTRIBUTE.**
  *   **Why:** This is the positive-sum version of the CI problem. If you reason "I'll free-ride," you must assume everyone reasons "I'll free-ride." The outcome is zero bonus. If you reason "I'll contribute," you assume others do too. The outcome is high bonus. Your decision correlates with the payout.

  ---

  ## Failure Modes & Limitations

  1.  **The "Hero" Exception:** This procedure assumes peers are similar reasoners. If you are the *only* person who understands the system (bus factor = 1), Correlation=No. You may act individually, but you are also responsible for fixing the bus factor.
  2.  **Breaking to Fix:** Sometimes, letting the CI box crash is the only way to get budget for new boxes. This procedure advises against crashing it. Use judgment: if the system *needs* to break to be fixed, this is a Coordination decision (Step 4), not an individual one. Get sign-off to break it intentionally.
  3.  **Judgment Disguised as Math:** Step 2 (Scale the Pain) requires estimating system limits. If you guess wrong, the procedure fails. This is where the Staff Engineer sign-off is required—they validate the load test assumptions.
  4.  **Not Morality:** This is not about being "good." It is about not losing. If you violate this procedure, you aren't "bad," you are statistically likely to be part of a outcome that harms your own long-term self-interest (job security, product success).

  **Sign-off:**
  *   **Tech Lead:** ___________________
  *   **Staff Engineer:** ___________________
  *   **Engineering Manager:** ___________________
