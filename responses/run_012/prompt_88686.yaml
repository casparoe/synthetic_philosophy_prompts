answer: |-
  **Final Examination: Decision Theory Seminar**
  **Question 4**

  Consider the St. Petersburg game: a fair coin is tossed until it lands heads. If the first heads appears on toss $n$, the player is paid £$2^n$. The expected monetary value (EMV) is infinite.

  (a) A student suggests capping the game at $N$ tosses; if no heads appear by toss $N$, the payoff is £0. Derive the EMV of this capped game. Explain why this modification fails to resolve the paradox for a rational agent who accepts the possibility of sufficiently large $N$. [6 marks]

  (b) Consider a generalized game where the coin lands heads with probability $p$ and the payoff on toss $n$ is $a^n$ (where $a > 1$). Determine the exact condition on $a$ and $p$ under which the EMV diverges. Show that the original St. Petersburg game lies precisely on the boundary of this condition. [6 marks]

  (c) Given your results above, evaluate whether the paradox constitutes a problem for expected value maximisation itself or merely for unbounded utility functions. Discuss the theoretical cost of adopting a bounded utility function to resolve the issue. [8 marks]

  ***

  **Model Answer**

  (a) In the capped game, the probability of the first heads occurring on toss $n$ (where $1 \le n \le N$) is $2^{-n}$. The payoff is £$2^n$. The probability of no heads occurring in $N$ tosses is $2^{-N}$, with a payoff of £0. The expected monetary value is the sum of the products of probabilities and payoffs:
  $$ \text{EMV} = \sum_{n=1}^{N} \left( \frac{1}{2^n} \times 2^n \right) + \left( \frac{1}{2^N} \times 0 \right) = \sum_{n=1}^{N} 1 = N $$
  The EMV is exactly $N$. This fails to resolve the paradox because $N$ is arbitrary. For any finite entry fee £$F$, a casino could set $N > F$, making the game favourable by EMV standards. Yet, no rational agent would pay £1 million to play a game capped at $N=10^6$, given the vanishingly small probability of realizing the high payouts. Capping merely relocates the problem from infinity to absurdly large finite values.

  (b) In the generalized game, the probability of the first heads on toss $n$ is $p(1-p)^{n-1}$. The payoff is $a^n$. The expected value is given by the series:
  $$ E = \sum_{n=1}^{\infty} p(1-p)^{n-1} a^n = pa \sum_{n=1}^{\infty} [a(1-p)]^{n-1} $$
  This is a geometric series with ratio $r = a(1-p)$. The series diverges if $r \ge 1$. Thus, the condition for divergence is $a(1-p) \ge 1$.
  In the original St. Petersburg game, $p = 1/2$ and $a = 2$. Substituting these values:
  $$ 2(1 - 0.5) = 2(0.5) = 1 $$
  The original game sits exactly on the boundary between convergence and divergence. It is not robustly infinite; a slight decrease in $a$ or increase in $p$ would render the expectation finite.

  (c) The paradox demonstrates that expected monetary value maximisation is descriptively and normatively inadequate for risks with heavy tails. Bernoulli's solution—maximising expected utility with a logarithmic function $u(x) = \ln(x)$—resolves the specific case where $a=2$. However, Menger showed that for any unbounded utility function, one can construct a generalized St. Petersburg game (by increasing $a$) that generates infinite expected utility. Therefore, to resolve the paradox generally, one must adopt a bounded utility function.

  The theoretical cost of bounded utility is significant. It implies that there is a maximum possible value any outcome can have. Consequently, an agent with bounded utility would be indifferent between a 50% chance of saving the world and a 50% chance of saving the world plus £1, provided the 'saving the world' outcome is already at the utility bound. This violates the intuition that rational preferences should remain sensitive to stake magnitude regardless of size. Thus, the paradox forces a choice between accepting infinite valuations in theory or accepting indifference to extreme stakes in practice.

  ***

  **Marking Scheme**

  **Total Marks: 20**

  1.  **Derivation of Capped EMV (4 marks)**
      *   Correctly identifies probabilities and payoffs to show the sum equals $N$.
      *   *Common Error:* Students assume the probability of 'no heads' contributes non-zero value or miscalculate the geometric sum.

  2.  **Interpretation of Capping (4 marks)**
      *   Argues that because $N$ can exceed any finite entry fee, the paradox persists for large $N$.
      *   *Common Error:* Claiming the paradox is solved because the value is now technically finite.

  3.  **Generalized Divergence Condition (4 marks)**
      *   Correctly derives the ratio $a(1-p)$ and states the divergence condition $a(1-p) \ge 1$.
      *   *Common Error:* Using $p$ instead of $(1-p)$ for the tails probability in the ratio test.

  4.  **Boundary Identification (4 marks)**
      *   Explicitly substitutes original values ($a=2, p=0.5$) to show the product equals 1.
      *   *Common Error:* Stating the original game is "inside" the divergent region rather than on the threshold.

  5.  **Utility Implications (4 marks)**
      *   Notes that unbounded utility allows generalized paradoxes (Menger) and bounded utility implies indifference to extreme stakes.
      *   *Common Error:* Asserting log utility is a complete solution without addressing boundedness or Menger's critique.
