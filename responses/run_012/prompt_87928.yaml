answer: |-
  You are the sole custodian of a secure evidence deposit for two clients, Alpha and Beta. Alpha entrusted you with exculpatory data yesterday under a voluntary, explicit contract of absolute anonymity, knowing exposure means permanent exile; Beta is currently facing wrongful conviction, and you hold an unchosen, institutional duty as an officer of the court to submit any exculpatory evidence in your possession. The data Alpha provided is the only proof that saves Beta. Submitting it fulfills your duty to Beta but breaches your contract with Alpha, destroying the trust mechanism required for future disclosures; withholding it honors Alpha but condemns Beta to prison. You cannot redact the data, cannot persuade Alpha to waive anonymity, and could not foresee Beta's prosecution when accepting Alpha's deposit. Swapping Alpha and Beta yields the identical conflict structure: one party relies on your voluntary pledge, the other on your unchosen role-duty. The moral wrong of betraying a sacred trust is not equivalent to the wrong of permitting injustice, yet both demands are absolute and mutually exclusive.

  1. **Theories:** On **W.D. Ross's Pluralism**, this is a genuine dilemma. Both Fidelity (to Alpha) and Justice (to Beta) are *prima facie* duties that remain binding even when they conflict; whichever you choose, you violate a real obligation, leaving "moral residue" (guilt and a duty of reparation) that requires acknowledgment. On **Act Utilitarianism**, it is not a dilemma. The theory demands a single calculable metric (net well-being); since prison and exile have comparable disutility, the agent simply calculates which breach causes less overall harm (or which action preserves the utility of the legal system better) and performs that act. The Utilitarian escapes the dilemma because they deny the existence of binding duties independent of consequences; for them, the "wrong" option simply ceases to be obligatory once the calculus is done.

  2. **The Feature:** The single feature doing the work is the **absence of a lexical priority rule between the sources**. The case relies on the voluntary promise and the unchosen role-duty being structurally equal in weight despite being different in kind. If you delete this feature—by assuming a rule that "Justice always overrides Fidelity"—the case collapses into an **ordinary hierarchical conflict**. It becomes a simple matter of identifying the higher duty and following it, eliminating the remainder guilt and the sense of genuine tragedy.

  3. **Defense:** A defender of the non-dilemma theory (specifically a Hierarchical Deontologist) would argue that the **promise was void *ab initio***. They would claim that one cannot morally promise to withhold justice, meaning the obligation to Alpha never existed in the first place. By arguing that the voluntary duty was illusory because it claimed authority over a domain (court evidence) where the agent has no right to dispose of the truth, they dissolve the conflict into a single obligation: submit the evidence. There is no dilemma because there was never a second binding claim to violate.
