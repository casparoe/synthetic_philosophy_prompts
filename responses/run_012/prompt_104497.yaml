answer: |-
  # Teaching Plan: Arrow's Impossibility Theorem (90 Minutes)
  **Audience:** Graduate Public Policy Students (Mathematically literate, new to Social Choice)
  **Goal:** Derive the theorem as a logical conflict between intuitive commitments, not a technical trick.

  ---

  ## I. The Carrying Example: The Hospital Formulary Committee (0–15 mins)

  **The Setup:**
  Introduce a **Hospital Formulary Committee**. Their task is to rank new drug treatments for inclusion in the hospital's insurance coverage.
  *   **Alternatives ($X$):** Three drugs, $\{A, B, C\}$. (Must be $\ge 3$).
  *   **The "Rankers" ($N$):** Not voters, but **Evaluation Criteria**. Let there be three: *Cost-Effectiveness*, *Patient Safety*, *Clinical Efficacy*.
  *   **The Input:** Each criterion produces a complete, transitive ranking of the drugs. (e.g., Cost says $A \succ B \succ C$; Safety says $B \succ C \succ A$).
  *   **The Output:** The Committee must produce a single collective ranking to guide policy.

  **Why This Example Works (Explicitly tell students this):**
  1.  **Avoids "Voter" Baggage:** It prevents the discussion from collapsing into gerrymandering or electoral college debates. It frames the problem as *incommensurability of values* (policy trade-offs) rather than *political power*.
  2.  **Enforces Ordinality:** It is easy to argue that there is no common scale between "dollars saved" and "lives saved." You cannot add them. You can only rank them. This justifies the ban on cardinal utility without feeling artificial.
  3.  **Highlights the "Dictator":** If the theorem holds, it means the Committee's final ranking *always* matches exactly one criterion (e.g., Cost), regardless of what Safety or Efficacy say. This makes the "Dictator" condition feel like a structural failure of the decision process, not a political tyranny.

  **Required Properties of the Example:**
  *   **Must Have:** Complete orderings (no ties), fixed finite set of alternatives, genuine disagreement among criteria (no criterion always agrees with another), no natural common scale (cannot convert Safety to Dollars).
  *   **Must Lack:** Cardinal scores (0–10 ratings), intensity of preference (how much better is A than B?), a "correct" answer known in advance.

  **Head Off Misconception #1 & #2:**
  *   *Misconception:* "This proves all aggregation is impossible" or "No system is fair."
  *   *Intervention:* State clearly: "We are not proving aggregation is impossible. We are proving that **ordinal** aggregation satisfying **these four specific conditions** is impossible. If we allow scores (cardinal), or if we allow one criterion to rule, it becomes possible."

  ---

  ## II. Primitives and The Aggregation Rule (15–35 mins)

  **Formalizing the Intuition:**
  1.  **Primitives:**
      *   $X$: Set of alternatives ($|X| \ge 3$).
      *   $\mathcal{R}$: Set of all possible rational (complete, transitive) orderings over $X$.
      *   **Profile:** A list of orderings, one for each criterion $(R_1, R_2, ..., R_n)$.
      *   **Social Welfare Function (SWF):** A rule $F$ that maps any Profile to a single Social Ordering $R_{soc}$.
  2.  **The Constraint (Ordinality):**
      *   Emphasize that $F$ sees *only* the ranks ($A \succ B$), not the strength ($A$ is much better than $B$).
      *   *Analogy:* The Committee receives rank-ordered lists on paper. They are not allowed to ask the criteria "how much" better one drug is.

  **Head Off Misconception #5 (Utilities/Scores):**
  *   *Misconception:* "Why not just score them 1–10 and average?"
  *   *Intervention:* "That is a **Cardinal** rule (Utilitarianism). Arrow asks: Can we do this with **Ordinal** information alone? If you introduce scores, you introduce interpersonal (or inter-criteria) comparability, which bypasses the theorem. We are testing the limits of pure ranking."

  ---

  ## III. The Four Conditions (35–60 mins)

  *Present these not as arbitrary rules, but as commitments a rational policy analyst would insist upon.*

  1.  **Unrestricted Domain (U):**
      *   *Definition:* $F$ must work for *any* logically possible combination of criterion rankings.
      *   *Rationale:* In policy, we cannot assume criteria will always agree or follow a specific pattern. We need a rule that handles worst-case disagreement.
  2.  **Weak Pareto (P):**
      *   *Definition:* If every criterion ranks $A \succ B$, the Committee must rank $A \succ B$.
      *   *Rationale:* If Cost, Safety, and Efficacy all agree Drug A is better than Drug B, it is irrational for the Committee to rank B above A.
      *   *Status:* Almost impossible to reject.
  3.  **Non-Dictatorship (ND):**
      *   *Definition:* There is no single criterion $k$ such that for all profiles, if $k$ ranks $A \succ B$, then $R_{soc}$ ranks $A \succ B$ (regardless of others).
      *   *Rationale:* A committee that simply adopts the "Cost" ranking every time is not a committee; it is a bypass.
      *   *Head Off Misconception #3 (Dictator = Tyrant):* "This is not a person with a gun. This is a **functional** property. If 'Cost' is the dictator, it means the Committee's structure mathematically reduces to 'Whatever Cost says.' It is a failure of aggregation, not necessarily a political oppression."
  4.  **Independence of Irrelevant Alternatives (IIA):**
      *   *Definition:* The social ranking of $A$ vs $B$ depends *only* on the criteria's rankings of $A$ vs $B$. Changes in how criteria rank $C$ cannot flip the social choice between $A$ and $B$.
      *   *Rationale:* This is the heavy lifter. Why do we want it?
          *   *Stability:* The choice between two healthcare options shouldn't change because a third, irrelevant option enters or leaves the menu.
          *   *Informational Efficiency:* We shouldn't need to know how criteria feel about $C$ to decide between $A$ and $B$.
      *   *Head Off Misconception #6 (IIA is trivial/false):*
          *   *Intervention:* Show a **Borda Count** violation.
          *   *Scenario:* 2 Criteria.
              *   Profile 1: Cost ($A \succ B \succ C$), Safety ($B \succ C \succ A$). Borda: A=3, B=3, C=0. (Tie).
              *   Profile 2: Cost ($A \succ B \succ C$), Safety ($C \succ B \succ A$). (Safety changed view on C vs A/B, but kept $B \succ A$).
              *   Wait, Borda violates IIA because the *points* assigned to A and B depend on where C is placed in the individual rankings.
          *   *Point:* "IIA forbids you from using the position of C to determine the intensity of preference between A and B. It forces the rule to look at A and B in isolation."

  **Dependency Check:**
  *   **U** provides the landscape of possible conflicts.
  *   **P** establishes a baseline of rationality.
  *   **IIA** restricts the *information* the rule can use (local pairwise info only).
  *   **ND** demands the rule actually aggregates (doesn't just copy one input).

  ---

  ## IV. The Shape of the Proof Idea (60–80 mins)

  *Do not write the full "Decisive Set" lemma proof. It is too dense for 20 minutes. Use the "Contagion" intuition.*

  **The Logic Flow:**
  1.  **Start with Pareto:** By (P), if everyone agrees, the group agrees. This means the group is "decisive" for some pairs under some conditions.
  2.  **Apply IIA:** Because of (IIA), if the group is decisive for pair $(A, B)$ in one profile, it must be decisive for $(A, B)$ in *all* profiles where individual rankings on $(A, B)$ are the same. The context ($C$) doesn't matter.
  3.  **Use Unrestricted Domain:** Because (U) allows us to construct *any* profile, we can manipulate the rankings of $C$ to test the group's decisiveness on other pairs, like $(B, C)$ or $(A, C)$.
  4.  **The Contagion (The "Real Work"):**
      *   Imagine a profile where the Committee ranks $A \succ B$.
      *   By IIA, this decision rests *only* on how criteria ranked $A$ vs $B$.
      *   Now, imagine we shift $C$ around in the individual rankings. Because of (U), we can create a scenario where the *same* individual who was pivotal for $A \succ B$ becomes pivotal for $B \succ C$.
      *   Since IIA isolates pairs, the power that individual held over $(A, B)$ "contagiously" spreads to $(B, C)$ and then $(A, C)$.
  5.  **The Result:** One criterion ends up decisive over *all* pairs.
  6.  **The Contradiction:** This creates a **Dictator**.
  7.  **Conclusion:** You cannot have (U), (P), and (IIA) without creating a Dictator. Therefore, if you insist on (ND), you must drop one of the others.

  **Head Off Misconception #4 (Strategic Behavior):**
  *   *Misconception:* "This is about people lying about their preferences."
  *   *Intervention:* "Stop. This is not Game Theory. This is not Gibbard-Satterthwaite. We are assuming the criteria report their true rankings. The impossibility arises even if everyone is honest. It is about the **mathematics of aggregation**, not the **psychology of manipulation**."

  **Highlight the "Real Work":**
  *   Explicitly state: "**IIA is the engine.** If you drop IIA, Borda Count works. If you drop ND, Dictatorship works. If you drop U, we assume restricted domains (like single-peakedness) and it works. But IIA is the condition that strips away the ability to trade off intensity across alternatives, forcing the logic into a corner."

  ---

  ## V. Conclusion, Assessment, and Omissions (80–90 mins)

  **Synthesis:**
  The theorem is not a statement that democracy is dead. It is a statement about **Joint Consistency**. You can have any three of the four conditions, but not all four. Policy design is the art of choosing which condition to relax.
  *   Relax IIA? $\to$ Use Scoring/Borda (admits cardinal info implicitly).
  *   Relax U? $\to$ Assume structured preferences (e.g., Left-Right spectrum).
  *   Relax ND? $\to$ Appoint a Decider (efficient but unrepresentative).

  **The Final Assessment Question:**
  Pose this verbally and ask for a show of hands or brief discussion:
  > "Suppose the Hospital Committee decides to use a Borda Count (assigning points based on rank) to aggregate the criteria. Arrow's Theorem says this violates one of the four conditions. **Which condition does Borda Count violate, and why does violating that condition allow them to escape the impossibility result?**"

  *   *Correct Answer:* It violates **IIA**. Borda Count allows the ranking of an "irrelevant" alternative $C$ to change the point totals (and thus the relative ranking) of $A$ and $B$. By allowing the position of $C$ to matter, Borda admits more information than strict pairwise ordinal comparison, bypassing the "contagion" logic of the proof.
  *   *What this reveals:* It tests if they understand the theorem as a constraint on specific axioms (IIA) rather than a general ban on "fairness."

  **Explicit Omissions (Say this openly):**
  1.  **Gibbard-Satterthwaite Theorem:** "We are ignoring strategic manipulation today. That is a different impossibility regarding truth-telling."
  2.  **Infinite Alternatives:** "We assume a finite set of drugs. With infinite continua, different rules apply."
  3.  **Social Choice Functions:** "We are mapping to an ordering (SWF), not just a single winner. Mapping to a single winner (Social Choice Function) changes the technicalities but not the core intuition."
  4.  **Intensity/Interpersonal Comparability:** "We are strictly forbidding the comparison of 'how much' one criterion prefers A over B. If you allow that (Utilitarianism), Arrow vanishes."

  **Closing Thought:**
  "Your job as policy analysts is not to solve Arrow's Theorem. It is to recognize which axiom you are violating in your own models, and to justify why that violation is acceptable in the real world."
