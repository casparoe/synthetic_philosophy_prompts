          *   Weak Pareto (P): If all criteria agree A > B, Committee says A > B. (Hard to reject).
          *   Non-Dictatorship (ND): No single criterion *always* dictates. (Seems weak, but implies structural independence).
          *   IIA: Ranking of A vs B depends *only* on criteria's ranking of A vs B. (The heavy lifter).
          *   *Head off Misconception:* "IIA is trivial." (Show how Borda Count violates it). "Dictator is a tyrant." (It's a structural property).

