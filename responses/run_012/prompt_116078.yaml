answer: |-
  **Exam Question**

  Dana, a wine taster, undergoes training. Before, she calls a Chardonnay 'pleasant'. After, she reports 'wet-cardboard' in that wine (true positive) and also in a known neutral control sample on 33% of trials (false positive). Does this case support the hypothesis that Dana's experience is cognitively penetrated by her training? Distinguish experience from judgment, consider alternative explanations for the data, specify what evidence would discriminate between them, and discuss how definitions of penetration affect your conclusion.

  **Model Answer**

  The training supports a change in *report*, not necessarily experience. The penetration hypothesis claims training alters phenomenal content (the wine *looks* different), not just doxastic judgment (she *believes* it's corked).

  Three rivals explain the data without penetration. First, response bias: Dana lowers her criterion for reporting 'cardboard' to avoid missing targets, increasing hits and false alarms without sensory change. Second, perceptual learning: she discriminates subtle cues better, but misapplies the label to neutral wine due to uncertainty, not altered phenomenology. Third, attention: training directs focus to specific chemical profiles, making them salient without top-down alteration of early processing.

  Reports alone cannot discriminate these. Even increased sensitivity (d') suggests learning, not penetration. To prove penetration, one must manipulate the cognitive state (e.g., belief about the wine) independently of sensory exposure. If identical stimuli appear different solely due to believed category, penetration is supported. If only reports change, it is bias.

  Finally, the dispute hinges on definition. If penetration requires direct, semantic influence on early processing, this case fails. If it includes post-perceptual weighting or attention, it might succeed. A strict definition excludes this case; a loose one includes it. Students must commit to one.

  **Marking Scheme**

  **1. Experience vs. Judgment (4 marks)**
  Student must clarify that penetration concerns phenomenal content, not just classification or reporting behavior.
  *Common Failure:* Conflating reporting 'cardboard' with experiencing 'cardboard' phenomenally.

  **2. Response Bias (4 marks)**
  Student must explain false positives via a lowered reporting criterion rather than altered sensory input.
  *Common Failure:* Treating false positives as definitive proof of hallucination or penetration.

  **3. Learning/Attention (4 marks)**
  Student must cite improved discrimination or salience as non-penetrative alternatives explaining true positives.
  *Common Failure:* Assuming improved sensitivity or accuracy equals cognitive penetration.

  **4. Discriminating Evidence (4 marks)**
  Student must argue reports are insufficient and require independent manipulation of belief/concept holding stimulus constant.
  *Common Failure:* Claiming accuracy changes or sensitivity shifts alone settle the debate.

  **5. Definition Commitment (4 marks)**
  Student must state how 'penetration' is defined (e.g., direct vs. indirect) and apply it to Dana's case consistently.
  *Common Failure:* Leaving the definition implicit, ambiguous, or shifting midway through.
