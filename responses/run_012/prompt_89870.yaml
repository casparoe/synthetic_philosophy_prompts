  I've been going through Carroll's tortoise-and-Achilles bit with a couple of people from a reading group — you know the one, the tortoise accepts P, accepts "if P then Q," but won't accept Q until you add the conditional as a further premise, and then won't apply that premise without yet another one, forever. A friend of mine (call her R) thinks the whole thing is a category error: she says the tortoise is treating a rule of inference as if it were just another premise, and that "Q follows from P and P→Q" was never a third fact you had to believe — it's the license to move from the first two to the third, so demanding a premise that justifies it is like demanding a proof that proofs work. On her view the regress only gets going if you grant the tortoise that rules are premises; refuse that and it never starts. I'm not so sure — it feels like she's just relabelled the problem, because now the tortoise can ask what justifies adopting the rule, and if the answer is "nothing, it's constitutive" that sounds like the regress went underground rather than away.

  I want your actual credence that R's diagnosis — that the regress is dissolved by the premise/rule distinction and doesn't just reappear one level up, at the level of rules — is correct, and I want the decomposition, not a vibe. Break it into the sub-questions it really turns on: whether the tortoise's demand is even coherent, or whether there's a genuine question being asked at all; whether "accepting a conditional" and "being disposed to infer by it" can come apart the way the tortoise seems to think they can; whether there's a principled difference between justifying a premise and justifying a rule, or whether that's just a verbal dodge; and whether "being justified" is even the right thing to demand of a basic inferential practice, versus something weaker like describing the conditions under which we'd stop trusting it. Give each a rough probability with one line of why, show me how they combine into your number, and tell me which sub-question the number is most sensitive to and what would move it most.

  I definately see the pull of R's view, but I keep suspecting it survives only by changing the subject from justification to description. So also say how confident you actually are in the overall verdict, and single out the one claim in your answer you're least sure of.
