answer: |-
  ### Exam Question

  **Question 1**
  Pascal's Mugging is not merely a puzzle about a strange threat; it is a schema demonstrating that for any decision rule based on unbounded expected utility, there exists a scenario where tiny probabilities dominate large stakes. Critically evaluate this claim. In your answer, you must:
  1.  Explain why dismissing the standard case as 'absurd' fails to solve the structural problem.
  2.  Discuss the tension between rejecting the mugger and accepting long-termist existential risk arguments, which rely on similar probability-stake structures.
  3.  Propose a specific formal or epistemic fix (e.g., bounded utility, probability floor, simplicity priors).
  4.  Construct a 'rescaled' counter-case designed to break your chosen fix and defend why your fix survives it.

  *(Note: You will not be rewarded for recounting the standard narrative of the mugger. Focus on the decision-theoretic structure and the consistency of your proposed solution.)*

  ***

  ### Model Answer

  The core of Pascal's Mugging is not the plausibility of the threat, but the vulnerability of Expected Utility (EU) maximization to outcomes where $Probability \times Utility$ dominates reasonable intuition. It is settled among decision theorists that if an agent maximizes unbounded EU and assigns any non-zero probability to a claim, a sufficiently large stake will compel action. Dismissing the mugger as "absurd" is insufficient because absurdity is subjective; the schema allows the mugger to rescale the stakes until the expected value outweighs the cost of rejection. If an agent rejects a $10^{100}$ utility promise as impossible, the mugger simply promises $10^{101}$. The problem is structural: without a hard constraint, the math always favors paying.

  This structural vulnerability creates a significant tension with existential risk (x-risk) reasoning. Many effective altruist arguments for mitigating x-risk rely precisely on the logic the mugger exploits: a tiny probability of preventing human extinction (an enormous utility stake) outweighs certain, moderate costs. If one adopts a rule to reject the mugger—such as ignoring probabilities below a certain threshold—one risks blinding oneself to genuine existential threats. Conversely, if one accepts the EU calculation for x-risk, consistency demands one accept the mugger's demand unless a relevant difference can be identified. One cannot consistently endorse the logic of long-termism while dismissing the mugger solely on the grounds of low probability and high stakes.

  To resolve this, I propose **bounded utility**. This fix asserts that utility functions cannot increase infinitely; there is a cap on value. Once the cap is reached, additional goods (e.g., more lives saved) add no further utility. This prevents the mugger from inflating the stake enough to dominate the decision, as the utility term cannot exceed the bound.

  However, this fix invites a rescaled counter-case. The mugger need not promise infinite utility, but merely utility *at the cap*. Suppose the cap is equivalent to saving $N$ lives. The mugger offers a probability $\epsilon$ of saving $N$ lives versus a certainty of saving $N/2$ lives. If $\epsilon$ is sufficiently small, intuition says take the certainty. But if the agent's probability assessment is slightly optimistic, or if the mugger offers a lottery of multiple shots at the cap, the EU calculation can still override intuition. More damningly, bounded utility violates the continuity axiom of von Neumann-Morgenstern preferences: it implies there is no probability $p$ such that an agent is indifferent between a sure outcome and a lottery involving the cap, which seems to restrict rational preference orderings arbitrarily.

  In defense, one must argue that avoiding paralysis in the face of infinite expectations is more valuable than preserving continuity axioms. The "mistake" of unbounded utility is allowing mathematical abstraction to override cognitive limits. While it is contested whether bounding utility is a rational requirement or an admission of irrationality, it is settled that unbounded utility leads to exploitation in this schema. Regarding the x-risk tension, bounded utility does not necessarily negate x-risk concerns; extinction might represent the total loss of all *accessible* utility (hitting the negative bound), which remains the worst possible outcome even within a bounded system. Thus, one can prioritize x-risk without accepting infinite leverage from tiny probabilities.

  Ultimately, the mugging shows that naive EU maximization is incomplete. Whether one bounds utility, restricts admissible probabilities, or bites the bullet and pays the mugger, one must accept a cost: either to mathematical elegance, to potential x-risk sensitivity, or to wallet security. There is no cost-free solution, only a choice of which constraint to prioritize.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Structural Understanding (4 Marks)**
  *   **Requirement:** Identifies the problem as a failure of unbounded Expected Utility where $P \times U$ dominates, rather than a credibility issue about the mugger's story. Acknowledges that "absurdity" is not a formal barrier because stakes can be rescaled.
  *   **Common Mistake:** Spending half the answer recounting the story of the mugger or arguing that the mugger is lying/untrustworthy.

  **2. The Aggregation Variant (4 Marks)**
  *   **Requirement:** Explicitly addresses the "Many People/Small Harm" variant (or explains why rescaling stakes handles this). Explains that aggregating small harms over vast numbers bypasses "absurdity" objections regarding single-person magical powers.
  *   **Common Mistake:** Ignoring the aggregation variant entirely or treating it as identical to the single-person magical threat without noting the shift from "magical power" to "aggregate consequence."

  **3. The Existential Risk Tension (4 Marks)**
  *   **Requirement:** Articulates the inconsistency risk: rejecting the mugger on $P \times U$ grounds threatens the logic used to justify mitigating low-probability existential catastrophes.
  *   **Common Mistake:** Asserting that x-risk is "real" so the logic is valid, without explaining why that same logic validates the mugger, or vice versa.

  **4. Fix and Tailored Counter-Case (4 Marks)**
  *   **Requirement:** Proposes a specific technical fix (e.g., bounded utility, probability floor) AND constructs a specific scenario designed to stress-test that specific fix (not just a generic mugger).
  *   **Common Mistake:** Proposing a fix (e.g., "ignore low probabilities") but failing to describe how a mugger would rescale to defeat it (e.g., "raise the stakes further").

  **5. Settled vs. Contested Distinction (4 Marks)**
  *   **Requirement:** Clearly distinguishes between what is agreed (naive EV says pay; rescaling is possible) and what is debated (whether bounded utility is rational; whether x-risk analogies hold).
  *   **Common Mistake:** Presenting a contested solution (like bounded utility) as the definitively "correct" answer accepted by all theorists.
