answer: |-
  # Lesson Plan: The Impossibility Lab
  **Course:** Upper-Level Seminar in Social Choice / Political Philosophy
  **Topic:** The Gibbard–Satterthwaite Theorem
  **Time:** 90 Minutes
  **Class Size:** 18 Students (3 tables of 5, 1 table of 3)

  ## I. Learning Objectives
  By the end of this session, students will:
  1.  **Experience** strategic manipulation as a structural incentive rather than a moral failing.
  2.  **Observe** that changing the voting rule (Plurality $\to$ Borda $\to$ Runoff) shifts *who* can manipulate, but does not eliminate the possibility.
  3.  **Confront** the Dictatorship solution as the only strategy-proof alternative and reject it on normative grounds.
  4.  **Connect** their gameplay to the formal conditions of the Gibbard–Satterthwaite theorem (Universality, Non-Dictatorship, Strategy-Proofness).

  ## II. Materials & Setup
  *   **Room:** 4 tables clustered separately.
  *   **Preference Cards (72 total):** 4 distinct decks (one per table). Each card lists 4 outcomes with point values (e.g., 1st choice = 10 pts, 4th choice = 0 pts). *See Appendix A for profiles.*
  *   **Constitution Sheets:** Blank paper for each table to write their voting rule.
  *   **Ballots:** Small slips of paper.
  *   **Mission Slips:** 6–8 slips total, kept by instructor.
  *   **Scoreboard:** Whiteboard to track table points.
  *   **Prize:** "The Syllabus Key" – The winning table (highest aggregate points) gets to choose the topic/format of the final 30 minutes of the last class.

  ## III. Timeline & Procedure

  ### 0:00 – 0:10 | Introduction & Constitution Drafting
  1.  **Grouping:** Seat students (3 tables of 5, 1 table of 3).
  2.  **The Stakes:** Explain the "Syllabus Key." Points are awarded based on how high their *true* preference ranks in the final outcome of each round.
  3.  **The Constitution:** Before distributing preference cards, ask each table to agree on a **Voting Rule**.
      *   *Constraint:* It must use only the rankings they will submit. No money transfers, no threats.
      *   *Prediction:* Most will choose Plurality. Some may suggest Borda or Runoff.
      *   *Action:* They write the rule on the Constitution Sheet. Collect these.

  ### 0:10 – 0:25 | Round 1: The Sincere Baseline
  1.  **Distribution:** Hand out **Preference Cards** (face down).
      *   *Instruction:* "This card is your utility function. 10 points if your #1 wins, 0 if your #4 wins. Do not show this card to anyone. It defines your 'true' preference for this game."
  2.  **Voting:** Students submit ballots according to their Constitution.
  3.  **Tally:** Instructor (or table scribe) announces the winner and the point distribution.
  4.  **Check:** Ask tables: "Did anyone feel frustrated by this outcome?" (Look for the table where the median voter got their last choice).

  ### 0:25 – 0:45 | Round 2: The Poison Pill (Induced Manipulation)
  1.  **The Twist:** Collect ballots. Do not return cards.
  2.  **Secret Missions:** Walk around and hand **Mission Slips** to 1 or 2 students per table (select based on Round 1 counts to ensure pivotality).
      *   *Slip Text:* "SECRET MISSION: If Outcome [X] wins this round, you receive +20 Bonus Points. You may vote however you wish. Do not reveal this slip."
      *   *Instructor Note:* Choose Outcome [X] such that the student *cannot* achieve it by voting sincerely, but *can* achieve it by lying (e.g., burying a strong rival).
  3.  **Voting:** Students submit new ballots.
  4.  **Tally & Reveal:** Announce winners. Ask Mission holders to reveal their slips and their ballots.
      *   *Key Question:* "Did you vote your card, or the mission?"
      *   *Expected Outcome:* At least one table's winner changes due to the lie.
  5.  **Reaction:** Ask the victims: "Is this fair?" Ask the manipulator: "Was this rational?"

  ### 0:45 – 1:05 | Round 3: The Patch (Rule Switching)
  1.  **Diagnosis:** Tell tables: "Your Constitution is broken. People are gaming it. You have 5 minutes to write a **New Rule** that prevents this."
  2.  **Constraint:** You cannot ban specific votes. You must accept any ranking.
  3.  **Voting:** Distribute *new* Preference Cards (shuffled decks). Repeat the Secret Mission step with different students.
  4.  **Tally:** Run the new rule (e.g., Borda or Instant Runoff).
  5.  **The Trap:** Because the profiles are designed to be manipulable under *any* non-dictatorial rule, the manipulation will succeed again (perhaps via "burying" in Borda or "compromising" in Runoff).
  6.  **Frustration:** By now, students should feel the futility. They patched the hole, but the water is still coming in.

  ### 1:05 – 1:15 | The Dictator Option
  1.  **The Offer:** "There is one rule that is mathematically immune to the problem you just faced. If you adopt it, no one can ever benefit from lying. Ever."
  2.  **The Rule:** **Dictatorship.** One student (chosen by lot) submits their ranking. That ranking becomes the group outcome. Everyone else's ballot is shredded unopened.
  3.  **The Vote:** Ask tables to vote on whether to adopt this for the final round.
  4.  **The Rejection:** They will almost certainly reject it. It violates their norm of "Fairness/Anonymity."
  5.  **Conclusion:** "You prefer a system that *can* be broken over one that *cannot*. You value fairness more than strategy-proofness."

  ### 1:15 – 1:30 | Debrief & Theorem Mapping
  1.  **Reconstruct Pivotality:** Draw a specific Round 2 example on the board. Show how holding other votes fixed, the manipulator's lie changed the winner.
      *   *Theorem Link:* This is the definition of manipulability.
  2.  **Universality:** "You changed the rule from Plurality to Borda/Runoff. Did the manipulation stop? No."
      *   *Theorem Link:* This is the 'Any Voting Rule' claim.
  3.  **The Exit:** "The only rule that stopped it was the Dictator."
      *   *Theorem Link:* This is the 'Non-Dictatorial' condition.
  4.  **Vulnerability vs. Exploitation:** "Did everyone manipulate? No. Why?"
      *   *Theorem Link:* The theorem proves the *incentive exists*, not that agents have the *information* to act on it.
  5.  **Domain Restrictions:** "When does this *not* happen?"
      *   *Theorem Link:* Single-peaked preferences (Median Voter Theorem). If our cards had been structured along one dimension (Left/Right), we might have been safe.

  ## IV. Appendix A: Preference Profiles (Critical for Success)
  *To ensure the lesson works, do not let students generate random preferences. Distribute these pre-set cards.*

  **Table 1 & 2 (Plurality Failure Profile)**
  *   **Voter 1:** A(10) > B(5) > C(2) > D(0)
  *   **Voter 2:** A(10) > B(5) > C(2) > D(0)
  *   **Voter 3:** B(10) > C(5) > D(2) > A(0)
  *   **Voter 4:** C(10) > B(5) > D(2) > A(0)
  *   **Voter 5:** D(10) > C(5) > B(2) > A(0)
  *   *Dynamics:* Sincere Plurality $\to$ A wins (2 votes). B, C, D split.
  *   *Manipulation:* If Voter 3 (prefers B) votes C, C wins (2 votes). If Voter 3 prefers C over A, they lie. (Adjust points on cards to ensure Voter 3 prefers C over A).
  *   *Correction for GS:* Ensure Voter 3 prefers C > A.
      *   *Revised V3:* C(10) > B(5) > D(2) > A(0).
      *   *Revised V4:* B(10) > C(5) > D(2) > A(0).
      *   *Sincere:* A(2), B(1), C(1), D(1). A Wins.
      *   *Lie:* V3 votes B. B(2), A(2). Tie-break favors B. V3 prefers B over A. Manipulation works.

  **Table 3 (Borda Failure Profile)**
  *   Design a profile where burying a rival helps.
  *   *Voters:* 4. *Outcomes:* A, B, C.
  *   *V1:* A > B > C
  *   *V2:* A > B > C
  *   *V3:* B > C > A
  *   *V4:* C > B > A
  *   *Borda Count:* A: (2+2+0+0)=4. B: (1+1+2+1)=5. C: (0+0+1+2)=3. B Wins.
  *   *Manipulation:* V1 & V2 prefer A over B. If they vote A > C > B (burying B), A gets 6, B gets 2. A Wins.
  *   *Mission:* Tell V1 "Make A win."

  **Table 4 (Runoff/IRV Failure Profile)**
  *   *Voters:* 5.
  *   *V1, V2:* A > B > C
  *   *V3:* B > C > A
  *   *V4, V5:* C > B > A
  *   *Round 1:* A(2), B(1), C(2). B eliminated.
  *   *Round 2:* A vs C. C wins (3 votes: V3, V4, V5).
  *   *Manipulation:* V3 prefers B over C. If V3 votes A > B > C (compromising), A(3), C(2). B eliminated still? No.
  *   *Better IRV Manipulation:* V3 votes C > B > A? No.
  *   *Standard Example:* V3 votes A > B > C. A(3), C(2). A wins. V3 prefers B, but B can't win. V3 prefers A over C. So V3 lies to stop C.

  *(Note: Instructor should verify these counts before class. The key is that the Mission Slip targets a voter who is pivotal.)*

  ## V. Troubleshooting Predictable Failures

  **1. The "Inert Manipulator" (The lie doesn't change the outcome)**
  *   *Risk:* You hand a Mission Slip to a student, they lie, but the margin was too wide, and the outcome stays the same. The lesson flops.
  *   *Fix:* **Do not pre-assign Mission Slips.** Run Round 1. Collect ballots. Tally them silently. Identify the voter who is *exactly one vote away* from changing the outcome. Hand *that specific student* the Mission Slip for Round 2.
  *   *Script:* "For Round 2, I am introducing new incentives." (Hand slips). "Proceed." This guarantees the manipulation is *capable* of succeeding. If it still fails due to multiple manipulators canceling out, intervene: "In this simulation, the tie-breaker favored the manipulator."

  **2. The "Fake Preferences" Objection**
  *   *Risk:* A student says, "These cards aren't my real preferences, so I'm not really lying."
  *   *Fix:* Address this in the Debrief.
  *   *Script:* "This is the most important philosophical point. In social choice, 'preference' is defined by your payoff. If the game says you get points for Outcome A, then Outcome A *is* your preference for the purpose of the system. If you vote B to get more points, you are misreporting your utility function. The theorem isn't about your soul; it's about the alignment of incentives and reports."

  **3. The "We Chose Bad Rules" Conclusion**
  *   *Risk:* Students think they just picked stupid rules (Plurality is bad, Borda is bad).
  *   *Fix:* Emphasize **Universality** in the debrief.
  *   *Script:* "You tried Plurality. It broke. You tried Borda/Runoff. It broke. Gibbard and Satterthwaite proved that *any* rule you could have written on that Constitution sheet—ranked pairs, approval, Coombs—would have broken in some scenario. You didn't choose badly; you chose impossibility."

  **4. Time Overrun**
  *   *Risk:* Rule negotiation takes too long.
  *   *Fix:* Hard stop at 15 minutes for Round 1. If they haven't agreed, assign Plurality by default. "Democracy requires efficiency."

  ## VI. Debrief Script Highlights (for the Board)

  1.  **Pivotality:** Draw the Round 2 ballot profile. Circle the manipulator. Show: "If this vote changes from X to Y, Winner changes from A to B."
      *   *Takeaway:* Manipulation requires Pivotality.
  2.  **The Trade-off:** Draw a triangle. Vertices: **Fairness (Anonymity/Neutrality)**, **Strategy-Proofness**, **Universality**.
      *   *Takeaway:* You can pick two. You cannot have all three. You rejected Dictatorship (Strategy-Proofness) to keep Fairness.
  3.  **Domain Restriction:** Draw a single-peaked graph.
      *   *Takeaway:* "If our preferences were single-peaked (like a Left-Right spectrum), Plurality would have been safe. The theorem assumes *no restriction* on preferences. Real politics often has structure. That's why democracy doesn't collapse daily."
  4.  **Vulnerability:** "The theorem says a weapon exists. It doesn't say everyone knows how to use it. A system can be manipulable but stable if voters are ignorant or honest."

  ## VII. Instructor's Cheat Sheet (The "Secret" Logic)
  *   **Why Tables of 4-5?** In a class of 18, one vote is 5.5%. In a table of 4, one vote is 25%. Pivotality is visible.
  *   **Why 4 Outcomes?** GS requires $\ge 3$. 4 allows for more complex "burying" strategies in Borda.
  *   **Why the Dictator Rejection?** This is the emotional core. They must *feel* that Dictatorship is worse than Manipulation. This validates the "Non-Dictatorial" condition of the theorem not as a mathematical triviality, but as a normative necessity.
  *   **Randomization Extension (If Time Permits):** "What if we randomize? Gibbard (1978) showed the only strategy-proof lotteries are **lotteries over dictators**. So even chance doesn't save us; it just hides the dictator behind a veil."
