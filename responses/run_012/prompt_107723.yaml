prompt: |-
  I run a very small podcast about democratic institutions — mostly electoral reform stuff — and next week's guest is a political theorist who's been arguing for a proposal she calls 'affected-interest sortition', and I want to do better than the usual "so you want to replace elections with a lottery?" softball. Her view, as I understand it, is roughly this: keep a lower chamber that's elected but under a hard one-term limit (no reelection ever, for that seat), and add an upper chamber selected by lot — except the lottery isn't uniform, it oversamples people who in the last two years have been on the receiving end of a specific administrative decision (a benefit denial, a zoning variance, a deportation proceeding, that kind of thing), on the theory that those people have a standing and a kind of knowledge that uniform sampling washes out. The upper chamber gets a suspensive veto over the lower chamber's bills, and when the two deadlock the bill goes to a joint 'convergence' session where each chamber has to produce a written justification the other can respond to. She thinks this fixes both the career-politician problem and the competence problem that pure lottocracy is supposed to have. I'm not fully convinced but I also don't want to just ask her to restate the thing for forty minutes, and I was talking about this with a friend who works in electoral administration and she said the oversampling bit is where it gets interesting and also where it gets shaky.

  So: put on your hat as someone who knows the sortition/lottocracy literature and the empirical work on term limits and legislative professionalization, and draft me eight to ten interview questions. I want at least one question that presses on the oversampling idea — specifically whether 'affected interests' is stable enough to work as a sampling frame, and what happens when the affected group is also the group with the strongest incentive to decide its own case — with a follow-up keyed to the answer she's most likely to give (I expect she'll pivot to something about 'epistemic standing' rather than interest, so have the follow-up ready for that move). One question on the term-limit half: whether a one-term legislature doesn't just relocate careerism into staff, lobbyists, and the permanent bureaucracy, and whether her own upper chamber is where the real careerism would end up living. One on the deadlock/convergence mechanism — what stops it from being a pure delay device, and what happens when the two chambers have systematically different preferences because the sortition chamber is drawn from a different population. And one closing question about what evidence or outcome would make her abandon the proposal; I want her to name something falsifiable rather than 'if it didn't work in practice'. Keep the questions in her vocabulary — she's a theorist, not a quant person — but don't let me off with questions any intro civics student could have written.

  One more thing, and it matters: don't tell me to go read X or Y or to ask her about specific authors, and don't give me citations — I want questions that stand on their own without me having to look anything up beforehand. Also don't ask her to define terms she'll just define anyway; go straight at the joints. Maybe start by brainstorming the three or four weakest points in her argument so I can see why you're asking what you're asking, then give me the questions each with its follow-up. Think it through before you write — I'd rather have eight sharp ones than ten filler ones.
