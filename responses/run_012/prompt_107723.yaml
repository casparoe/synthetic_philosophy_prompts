answer: |-
  ### Weak Points Brainstorm

  Before diving into the questions, here are the four structural joints where this proposal is most likely to shear under pressure. These inform the angle of the questions below.

  1.  **The Sampling Frame Instability:** "Affected interests" defined by administrative decisions is a moving target. Zoning variances affect property owners; deportation affects non-citizens; benefit denials affect the poor. This isn't a random sample of the populace, nor is it a stable coalition. It risks creating a chamber of competing grievance-holders rather than a deliberative body.
  2.  **The Institutional Memory Vacuum:** Hard term limits in the lower chamber create amnesia. If legislators can't return, they have no incentive to invest in long-term institutional knowledge. That knowledge doesn't vanish; it migrates to unelected actors (staff, lobbyists, bureaucrats) or to the upper chamber, effectively shifting the center of gravity to the least accountable body.
  3.  **Systematic Preference Divergence:** The lower chamber represents electoral majorities; the upper chamber represents administrative "victims." These groups may have structurally opposed interests (e.g., expanding social benefits vs. fiscal restraint, or policing vs. civil liberties). The "convergence" mechanism assumes disagreement is due to misunderstanding, not genuine conflict.
  4.  **The Perverse Incentive of the Administrative State:** If the upper chamber's legitimacy relies on a steady stream of administrative decisions to sample from, does this create an implicit pressure to maintain or expand the bureaucratic footprint? A leaner state might mean a thinner sampling pool.

  ***

  ### Interview Questions

  **1. The Stability of the Sampling Frame (Oversampling)**
  **Main Question:** Your upper chamber relies on oversampling citizens who have recently interacted with the administrative state. But administrative touchpoints are structurally uneven—zoning affects property owners, deportation affects non-citizens, benefits affect the poor. How do you prevent this chamber from becoming a collection of fragmented grievance-holders rather than a body capable of forming a general will?
  **Follow-up:** *If she pivots to "epistemic standing" (arguing they have unique knowledge rather than just interests):* Even if we grant them unique epistemic standing regarding that specific decision, does that standing degrade the moment they are asked to legislate on macro-issues like defense or trade? How do you prevent that specific knowledge from hardening into a specific bias against *any* state action?

  **2. The Relocation of Careerism (Term Limits)**
  **Main Question:** You impose hard term limits on the lower chamber to stop career politicians. But institutional memory has to live somewhere. If the elected members are rotating out constantly, doesn't real power just relocate to the permanent staff, the lobbyists, and the bureaucracy who know how to navigate the machinery?
  **Follow-up:** And if the memory migrates, doesn't your upper chamber—which presumably serves longer or builds prestige—become the de facto senior chamber simply by virtue of being the only place where experience accumulates?

  **3. The Deadlock and Convergence Mechanism**
  **Main Question:** When the two chambers deadlock, you propose a convergence session based on written justifications. This assumes the disagreement is rooted in miscommunication or lack of reasoning. But what if the disagreement is a genuine conflict of interest between an electoral majority and a sortition minority? What mechanism forces a resolution other than infinite delay?
  **Follow-up:** If the upper chamber uses its suspensive veto systematically to block the lower chamber's agenda, does the system effectively privilege the status quo over the electoral mandate, and is that a feature or a bug?

  **4. Falsifiability and Abandonment**
  **Main Question:** Theorists often retreat to "it depends on implementation" when things go wrong. I want to know what would make you abandon the model entirely. Can you name a specific, observable outcome—like a legislative throughput metric, a specific inequality index, or a corruption measure—that, if it moved in the wrong direction after five years, would prove this proposal failed?
  **Follow-up:** *If she gives a vague answer like "if the people lost faith":* How would you distinguish between the people losing faith in the *system* versus the people losing faith in a specific *policy*? I need a metric that separates the machinery from the output.

  **5. Micro-Experience vs. Macro-Competence**
  **Main Question:** You argue this fixes the competence problem of pure lottocracy. But knowing what it feels like to be denied a housing benefit is micro-knowledge. Drafting a tax code or a healthcare system requires macro-knowledge. How does the upper chamber bridge that gap without relying on the very experts and bureaucrats you're trying to check?
  **Follow-up:** If they must rely on experts to translate that experience into law, doesn't the power shift to the people controlling the briefing materials, effectively recreating the elite mediation you're trying to avoid?

  **6. The Definition of "Administrative Decision"**
  **Main Question:** Your sampling frame depends on a clear boundary around "administrative decisions." But the line between policy, administration, and enforcement is porous. Who decides which decisions count as qualifying events for the lottery, and doesn't that gatekeeping power effectively control the composition of the upper chamber?
  **Follow-up:** If the lower chamber tries to narrow that definition to reduce the upper chamber's legitimacy, do you have a constitutional lock against that, or is it just another battleground?

  **7. Legitimacy and Authorization**
  **Main Question:** The lower chamber has traditional democratic authorization via elections. The upper chamber has "experiential" authorization via sortition. When they clash, which narrative wins with the public? Do you worry that the elected chamber will always claim to speak for "the people" while painting the sortition chamber as an unaccountable obstacle?
  **Follow-up:** If the public perceives the upper chamber as illegitimate because they weren't elected, does the convergence mechanism collapse because the lower chamber refuses to treat their justifications as equal?

  **8. Upper Chamber Careerism**
  **Main Question:** You've solved careerism in the lower house, but you haven't specified term limits for the upper house. If members of the sortition chamber serve multiple terms or build a reputation as "professional citizens," doesn't that chamber become the new home for the careerist class, just without the electoral accountability?
  **Follow-up:** If you do impose term limits there too, how do you solve the institutional memory problem without handing that memory to the bureaucracy?

  **9. Incentives of the Administrative State**
  **Main Question:** Your model requires a steady stream of administrative decisions to populate the upper chamber's sampling pool. Does this create a perverse incentive to maintain a large, active bureaucracy? A leaner state might mean fewer "affected interests" to sample from.
  **Follow-up:** Does this mean your system is structurally biased against deregulation or shrinking the administrative footprint, even if that's what the electorate wants?

  **10. Scaling to National Security and Foreign Policy**
  **Main Question:** This model seems tailored for domestic policy where administrative impact is direct. How does the "affected interest" logic apply to foreign policy or national defense, where the "affected" are often abstract or future generations?
  **Follow-up:** If the upper chamber has no special standing on those issues, does it become a rubber stamp for the lower house on the most critical matters, rendering the bicameralism half-functional?
