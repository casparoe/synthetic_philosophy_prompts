answer: |-
  ### 1. The Essay Question

  **Question 4: The Collision of Grounds**

  Standard debates often treat the "Bodily Autonomy" argument (e.g., the Violinist) and the "Deprivation of Future" argument (e.g., Future Like Ours) as direct contradictories. However, they may instead be addressing different moral questions: one regarding what we owe others, the other regarding why death is a harm.

  Consider two cases not typically discussed in the standard literature:
  1.  **The Discarded Embryo:** An IVF embryo is frozen and later discarded by a clinic. No woman's body is involved in the cessation of life.
  2.  **The IUD Case:** A woman uses a contraceptive device that functions primarily by preventing implantation of a fertilized egg.

  Write an essay (approx. 650 words) that addresses the following:
  *   Does the Deprivation Account condemn the Discarded Embryo case in a way the Bodily Autonomy argument cannot? What does this reveal about the scope of each argument?
  *   In the IUD case, does the Deprivation Account classify this as killing? If so, does the Bodily Autonomy argument override it, or does the prevention of attachment change the obligation?
  *   If the "future" lost in an early abortion is identical to that lost in a late abortion, does the Deprivation Account imply they are equally wrong? If this is counter-intuitive, which argument provides the resources to distinguish them?

  Conclude by stating whether the fundamental disagreement between these frameworks is about the **moral status** of the fetus, or the **weight** of bodily liberty against potential life. Defend your position.

  ***

  ### 2. Model Answer

  The standard stalemate in abortion ethics arises because students treat the Bodily Autonomy argument and the Deprivation of Future argument as fighting over the same terrain. They are not. The Deprivation Account explains why death is a misfortune; the Bodily Autonomy argument explains when we are obligated to prevent it. By testing these frameworks against the Discarded Embryo and IUD cases, it becomes clear that the central conflict is not about fetal status, but about the weight of bodily liberty against the duty to sustain potential life.

  The Discarded Embryo case reveals the limited scope of the Bodily Autonomy argument. Thomson's framework is specifically designed to address the unique intrusion of pregnancy. In the IVF case, no one is being asked to serve as life support. Therefore, the Bodily Autonomy argument is silent; it has no mechanism to condemn or permit the discard because no bodily rights are infringed. However, the Deprivation Account speaks loudly here. If the wrongness of killing lies in robbing an entity of a "future like ours," then discarding the embryo is morally equivalent to killing a child, regardless of where it is located. This shows that the Deprivation Account is a general theory of the wrongness of death, whereas Bodily Autonomy is a specific theory of bodily obligation. The two do not contradict here; they simply cover different ground.

  The IUD case is where the theories collide. If the Deprivation Account is correct, preventing implantation is morally identical to abortion, as the same future is lost. A strict Deprivation theorist must condemn the IUD as seriously as a late-term abortion. The Bodily Autonomy argument, however, struggles here. If the egg has not implanted, is the woman's body being used? One could argue that preventing attachment is not evicting a tenant, but locking the door. Yet, if the Deprivation Account grants the embryo full moral standing based on its future, the distinction between preventing attachment and evicting a fetus seems morally negligible regarding the *loss* suffered by the embryo.

  This tension highlights the "Early vs. Late" problem. The Deprivation Account implies that early and late abortions are equally wrong because the future lost is roughly identical in both scenarios. For many, this is a bug, not a feature. Intuitively, late abortion feels weightier. The Bodily Autonomy argument offers the resources to explain this intuition. As pregnancy progresses, the physical burden, risk, and intrusion on the woman's liberty increase. The "right to disconnect" becomes more urgent as the cost of connection rises. The Deprivation Account cannot account for this gradient; a lost future is a lost future. Therefore, if we believe late abortions are morally distinct from early ones, we must rely on the Bodily Autonomy framework to explain the difference, not the Deprivation framework.

  Ultimately, granting the fetus a "right to life" via the Deprivation Account does not settle the abortion question. It only establishes that death is a harm. It does not establish that the fetus has a right to *use* the woman's body to avoid that harm. The IVF case shows we might acknowledge the harm of death without invoking bodily rights. The IUD and timing cases show that bodily rights are the only variable that changes the moral calculus.

  Therefore, the fundamental disagreement is not about status. Both sides can agree the fetus has a valuable future. The disagreement is about weight. The Deprivation theorist weights the loss of future potential so heavily that it overrides bodily liberty in almost all cases. The Bodily Autonomy theorist weights bodily integrity so heavily that it permits ending the support system, even if the loss of future is tragic. We should accept that the fetus counts, but that counting does not compel sacrifice. The Deprivation Account identifies the tragedy; the Bodily Autonomy argument defines the limit of our obligation to prevent it.

  ***

  ### 3. Marking Scheme (Total: 25 Marks)

  **1. Distinguishing the Scope of Arguments (4 Marks)**
  *   **Full Credit:** Identifies that Deprivation explains *why death is bad* generally, while Bodily Autonomy explains *obligations to sustain* specifically.
  *   **Common Wrong Turn:** Treating the two arguments as direct logical negations (e.g., "One says life begins at conception, the other says it begins at birth").

  **2. Application to Discarded Embryo (4 Marks)**
  *   **Full Credit:** Notes Deprivation condemns this (loss of future), while Bodily Autonomy is silent/irrelevant (no bodily use).
  *   **Common Wrong Turn:** Claiming Thomson's argument forbids discarding the embryo because it is "killing," missing the bodily-use constraint.

  **3. Application to IUD/Implantation (4 Marks)**
  *   **Full Credit:** Recognizes the tension: Deprivation sees this as loss of future; Bodily Autonomy struggles to define "use" prior to implantation.
  *   **Common Wrong Turn:** Dismissing the IUD case as "contraception" without analyzing the moral status of the fertilized egg under the Deprivation framework.

  **4. The Early vs. Late Timing Problem (4 Marks)**
  *   **Full Credit:** Argues that Deprivation makes early/late abortion morally equal (same future lost), while Bodily Autonomy explains the difference (increasing bodily burden).
  *   **Common Wrong Turn:** Asserting that the fetus has "more future" in a late abortion, missing the prompt's premise that the future potential is roughly the same.

  **5. Conclusion on Status vs. Weight (4 Marks)**
  *   **Full Credit:** Explicitly concludes the debate is about the *weight* of bodily liberty vs. potential life, not the *status* of the fetus.
  *   **Common Wrong Turn:** Concluding that the debate is solely about "personhood" or "when life begins."

  **6. Structure, Clarity, and Stand (5 Marks)**
  *   **Full Credit:** Essay takes a clear, defensible stand; flows logically; stays within word limit constraints.
  *   **Common Wrong Turn:** Fence-sitting (e.g., "Both sides have good points") without synthesizing them into a coherent position.
