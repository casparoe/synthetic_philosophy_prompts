answer: |-
  Your intuition is sound, but your framing is conflating three distinct mechanisms: **economic sacrifice**, **social performance**, and **physiological leakage**. You are trying to force them all under the umbrella of "commitment," but they operate on different rules.

  Your proposed principle is a version of the **Handicap Principle** from evolutionary biology: a signal is honest only if it is too costly to fake. This explains five of your seven cases perfectly. However, it breaks down on the weeping man (because tears are not a chosen cost) and the garden (because cost does not equal moral weight).

  Here is the precise diagnosis of where your framework holds, where it fails, and the principles required to fix it.

  ### 1. The Confusion
  You are conflating **what a signal costs** with **what it proves**.
  *   **Cost** is objective (dollars, calories, time).
  *   **Value** is subjective (livelihood, safety, integrity).
  *   **Proof** is relational (does this bind the actor to another?).

  The billionaire's check and the poor woman's tools have the same *cost* in dollars, but vastly different *value* in livelihood. Your hypothesis catches this ("costs the faker more"). But the weeping man introduces a category error. Tears are not a "display of commitment." They are a **leakage of internal state**. They do not prove commitment; they prove conflict. You read them as "true" not because they are costly, but because they are difficult to voluntarily counterfeit.

  The garden is a different error. It signals **persistence**, not **commitment**. Commitment is transitive; you must commit *to* something or someone. A garden is an object. Unless the garden is for someone else, or prevents her from doing something else she values, it is merely an expenditure of resources, not a sacrifice of alternatives.

  ### 2. The Principles
  To account for all your verdicts, you cannot use a single principle. You need a two-part framework that distinguishes between **Chosen Actions** and **Unchosen Reactions**.

  **Principle A: The Net-Negative Signal (For Chosen Actions)**
  *   **Clause 1 (Relative Cost):** The action must impose a cost that is prohibitive to a disloyal actor but bearable to a loyal one.
      *   *Compelled by:* The Poor Woman (tools) vs. The Billionaire (check).
  *   **Clause 2 (No Social Arbitrage):** The action must not generate social capital or future reward that offsets the cost. If the audience rewards the sacrifice, it becomes an investment, not a signal.
      *   *Compelled by:* The Public Fast (theater) vs. The Flood Rescue (strong declaration). The faster gains status; the rescuer risks death with no guarantee of thanks.
  *   **Clause 3 (Irreversibility):** The actor cannot reclaim the cost through a "side door."
      *   *Compelled by:* The Inheritance Renunciation (hollow).

  **Principle B: The Physiological Leak (For Unchosen Reactions)**
  *   **Clause 1 (Involuntariness):** The signal must bypass conscious control, making it physiologically expensive or impossible for a faker to replicate convincingly.
      *   *Compelled by:* The Weeping Man. Tears are convincing not because they cost him, but because he cannot easily turn them on. They signal that his internal state contradicts his spoken words.
      *   *Note:* This does not prove he is "loyal." It proves he is "conflicted." You are reading it as "true" because it reveals his interiority, not his morality.

  **The Outlier: The Garden**
  The garden compels a third clarification: **Commitment requires a Counterparty.**
  *   A display reads as commitment only when it binds the actor to an entity outside themselves (a person, a cause, a moral code).
  *   *Compelled by:* The Garden. It is ambiguous because it lacks a counterparty. It proves she has leisure and patience, but not that she is bound to anything beyond her own aesthetic. If she built the garden to heal a sick child, it would suddenly become a "Poor Woman/Tools" case (Principle A).

  ### 3. Testing Your Hypothesis
  Does your original hypothesis survive?
  *   **The Weeping Man:** No. Your hypothesis relies on "cost to the faker." A sociopath can fake tears with low cost if they are skilled. The reader believes the tears because of **biological rarity**, not economic cost. You must surrender the idea that "cost" is the only metric.
  *   **The Garden:** No. Your hypothesis relies on "ruinously expensive to fake." The garden is expensive, yet rings hollow. This proves that **expense without vulnerability is just consumption.**

  ### 4. The Prediction
  **Case:** A character keeps a promise at real personal cost when no one is watching, and lets the fact surface only years later.

  **Verdict:** The reader will read this as the **strongest possible declaration**, surpassing even the flood rescue.

  **Why:**
  1.  **Relative Cost:** It incurs real personal cost (Principle A, Clause 1).
  2.  **No Social Arbitrage:** There is no audience. The character gains no status, no thanks, and no immediate reward. This eliminates the "theater" suspicion of the Public Fast (Principle A, Clause 2).
  3.  **Irreversibility:** The years have passed; the cost is sunk (Principle A, Clause 3).
  4.  **The "Side Door" Test:** Because the fact surfaces only later, the reader knows the character did not keep the promise *in order* to reveal it. This negates the "Inheritance Renunciation" fraud.

  **The Risk:**
  The only risk to this case is the **Garden Problem**. If the promise was to *themselves* (e.g., "I promised I would learn the violin"), it reads as discipline, not moral commitment. If the promise was to *another* (e.g., "I promised I would support her child"), it reads as supreme loyalty.

  ### Summary for Craft
  You are not looking for "cost." You are looking for **vulnerability that cannot be monetized.**

  *   **Money/Time** are weak signals because they are fungible (Billionaire, Garden).
  *   **Pain** is a weak signal if it buys status (Fast).
  *   **Biology** is a strong signal if it is involuntary (Tears).
  *   **Secrecy** is the strongest amplifier because it removes the possibility of social profit (The Unwatched Promise).

  If you want a gesture to land, ensure the character burns a bridge they cannot rebuild, for a reason no one else sees, at a price only they would pay.
