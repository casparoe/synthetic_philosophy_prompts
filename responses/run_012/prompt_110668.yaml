answer: |-
  You have not reinvented the wheel, but you have independently rediscovered one of the most famous thought experiments in cognitive science and philosophy of mind. The feeling you have—that there is a specific word for this, connected to feedback loops, self-reference, and a popular-science writer—is spot on.

  Here is the breakdown of the name, the conceptual carve, the opposite, and how it maps onto the free will debate.

  ### 1. The Name: *Sphexishness*

  The term you are looking for is **Sphexishness**.

  It was coined by **Douglas Hofstadter** in *Gödel, Escher, Bach* (1979), though the phenomenon was popularized in philosophy by **Daniel Dennett** (who is likely in your reading list, given the free will context).

  The name comes from the genus *Sphex* (the hunting wasp you mentioned). The specific experiment was conducted by Jean-Henri Fabre in the 19th century and later cited by Dennett in *Elbow Room* and *Freedom Evolves*. As you described: the wasp drags a paralyzed cricket to the burrow entrance, enters to inspect, comes out, and drags the cricket in. If you move the cricket *while the wasp is inside*, the wasp comes out, sees the cricket is not at the threshold, drags it back to the threshold, and goes inside to check again. You can do this dozens of times. The wasp never thinks, "Hey, I just checked this burrow two minutes ago; the cricket just shifted."

  **Sphexishness** is the property of a system that appears goal-directed and flexible but is actually running a rigid script that resets upon specific interruptions, lacking a representation of the *context* or the *history* of the action.

  ### 2. The Carve: Mechanism vs. Surface

  You asked whether the term describes the surface pattern (looping) or the internal claim (fixed script).

  **It is primarily a claim about the internal mechanism, inferred from the surface pattern.**

  If a system loops because it is "stuck" (like a record skip), that is a malfunction. *Sphexishness* is distinct because the system is functioning *exactly as designed*. The "carve" separates **teleological flexibility** (acting for a goal) from **representational depth**.

  *   **The Sphexish Agent:** Has a goal (prey in burrow) but no model of the world that includes "I have already checked the burrow." It lacks *state*. It is a feed-forward script.
  *   **The Non-Sphexish Agent:** Has a goal and a model that tracks progress. It knows "Burrow checked = True."

  **Regarding your guard example:**
  The NPC guard walking into a wall is slightly different mechanistically but functionally identical. That is often called getting stuck in a **local minima** in pathfinding algorithms. However, in philosophy of mind, we group it under Sphexishness because the *outcome* is the same: the system lacks the representational capacity to recognize that its current action is not achieving its goal.

  **Regarding the feedback loop:**
  You asked if it stretches to cases where the loop is held by feedback. Yes. In cybernetics, this is the difference between a **Closed Loop** (thermostat) and a **Stateful Closed Loop**. A thermostat is Sphexish regarding temperature; it doesn't know *why* the room is cold, it just heats. If you cool the sensor with ice, it loops forever. That is Sphexishness. The "carve" is about whether the system represents the *interruption* as part of the narrative of the goal.

  ### 3. The Opposite: Statefulness and Context-Sensitivity

  Is there a name for the capacity to get interrupted and pick up where you left off?

  In computer science, this is **State Preservation** or **Reentrancy**.
  In cognitive science and psychology, this is **Executive Function** (specifically *task switching* and *working memory*).
  In philosophy of action, this is often discussed under **Intentional Persistence** or **Plan Representation**.

  If Sphexishness is "running a script," the opposite is "executing a plan." A script is a linear sequence (A -> B -> C). A plan is a tree or graph with conditionals and state tracking (If Interrupted at B, return to B, not A).

  Dennett argues that human freedom is essentially the accumulation of layers of "anti-Sphexishness." We have habits that are Sphexish (like your flour measuring), but we have higher-level monitoring systems that can override them *if we notice*.

  ### 4. The Free Will Move: *Phenomenological Indistinguishability*

  You asked about the specific move in the free will debate: *"You can only find out whether a system is like this by poking it, and it passes most pokes, so we can't tell from the inside whether we're like this."*

  This is a recognized skeptical argument, often associated with **Illusionism** or the **Manipulation Argument**.

  *   **The Argument:** If a deterministic system is complex enough, its internal experience of "choosing" will feel identical to a libertarian free agent. We cannot distinguish, from the first-person perspective, between a genuine choice and a complex Sphexish routine.
  *   **The Name:** There isn't one single capitalized name, but it is often called the **Problem of Internal Indistinguishability** or the **Sphexish Skeptical Hypothesis**.
  *   **Is it a fallacy?** Compatibilists (like Dennett) argue it is a **category error**. They claim that asking "Are we *really* Sphexish deep down?" is like asking "Are we *really* just atoms?" Yes, but that doesn't negate the higher-level reality of choice.
  *   **Incompatibilists** use this to argue that if we *could* be Sphexish without knowing it, then our feeling of free will is epistemically worthless.

  The specific anxiety you have—that we might be wasps who just tell better anecdotes—is the core of the **Hard Incompatibilist** worry. It suggests that moral responsibility requires us to be *non-Sphexish* in a way that might be impossible for physical systems.

  ### 5. Scope: Domain-Specific vs. Global

  You asked if the label is a verdict on the whole agent.

  **It is strictly domain-specific.**

  Hofstadter and Dennett are very clear on this: **We are all Sphexish sometimes.**
  *   You are Sphexish when measuring flour (habit loop).
  *   You are Sphexish when you repeat the same argument in a relationship despite it never working (emotional script).
  *   You are *not* Sphexish when you realize you are repeating the argument, stop, and apologize.

  The "free will" game, in this framework, is not about escaping Sphexishness entirely (which is impossible; we need habits to function), but about building **higher-level monitors** that detect Sphexish loops and interrupt them.

  ### Summary for your Reading Group

  If you want to introduce this to your group, here is the vocabulary list:

  1.  **The Phenomenon:** **Sphexishness** (Hofstadter/Dennett).
  2.  **The Biological Basis:** **Fixed Action Pattern** (Ethology).
  3.  **The Mechanism:** Lack of **State Representation** / **Open-Loop Control** masquerading as Closed-Loop.
  4.  **The Opposite:** **Context-Sensitivity** / **Executive Control**.
  5.  **The Free Will Argument:** **The Skeptical Hypothesis of Internal Indistinguishability**.

  **Recommended Reading:**
  *   **Douglas Hofstadter:** *Gödel, Escher, Bach*, Chapter on "Artificial Intelligence: Prospects" (where he coins Sphexishness).
  *   **Daniel Dennett:** *Elbow Room*, Chapter 3 ("Do We Have Free Will or Are We Just Sphexish?"). This is exactly your reading group's topic.
  *   **Daniel Dennett:** *Freedom Evolves*, where he argues that freedom is the evolution of anti-Sphexish mechanisms.

  You aren't reinventing the wheel; you've just identified the exact hinge on which modern Compatibilism turns. Dennett's entire defense of free will rests on the idea that we are *less* Sphexish than wasps, not that we are *non*-Sphexish.
