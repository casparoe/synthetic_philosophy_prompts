answer: |-
  **JOINT STATEMENT ON MORAL TESTIMONY AND DEFERENCE**

  **Drafted by the Adversarial Collaboration Working Group**
  **Date:** 14 October 2023

  **Preamble**
  We, the undersigned representatives of the Permissive View (Camp 1) and the Demanding View (Camp 2), have engaged in a structured dialogue regarding the epistemic and moral status of relying on the moral testimony of others. While we remain divided on the necessity of first-hand moral understanding for full moral agency, we recognise significant common ground regarding the practical realities of moral life. This document outlines our shared commitments, precisely locates our remaining disagreements, and identifies areas where our dispute may be terminological rather than substantive.

  ### 1. Agreed Claims

  Both camps affirm the following propositions. Signing this statement indicates acceptance of these claims as a baseline for further discourse.

  1.  **Transmission of True Belief:** Both sides agree that moral testimony can successfully transmit true moral belief. Reliance on a trusted source is epistemically superior to random guessing or ignoring available expertise.
  2.  **Not Blind Obedience:** The dispute is not about unconditional obedience to authority. Both sides reject deference when the source is known to be unreliable, malicious, or conflicting with one's core non-negotiable values.
  3.  **The Developmental Necessity:** Both sides acknowledge that all moral agents begin as children who must borrow moral conclusions before they possess the capacity to understand them. The dispute concerns adult competence, not developmental necessity. We agree that a requirement for total first-hand understanding would render moral agency impossible for children and unjustly exclude those with cognitive impairments.
  4.  **Complexity and Division of Labour:** Both sides accept that the complexity of modern supply chains (e.g., fair trade, labour practices) makes total first-hand verification impossible for any single individual. Some reliance on others is practically unavoidable.
  5.  **Evidence Against the Permissive View:** Camp 1 acknowledges that their view would be undermined if empirical evidence showed that habitual deference systematically erodes an agent's capacity for moral growth, or if it leads to actions that are right in conclusion but wrong in motivation (e.g., acting rightly solely to avoid social sanction).
  6.  **Evidence Against the Demanding View:** Camp 2 acknowledges that their view would be undermined if it were shown that requiring understanding leads to greater moral error than deference in high-stakes complex cases, or if 'understanding' is defined so narrowly that it excludes nearly all adult agents.
  7.  **Reconstruction Capacity:** Both sides agree there is a factual difference between an agent who *could not* reconstruct the reasoning (due to complexity or lack of training) and one who *could but has not bothered*. However, we disagree on the moral significance of this difference (see Table, Item 4).
  8.  **Warrant Distinction:** Both sides agree that there is a phenomenological difference between believing something because you see the reason for it yourself versus believing it because someone else told you. We disagree on whether this difference constitutes a difference in *kind* of warrant or merely a difference in *source*.

  ### 2. Table of Disagreements

  The following table isolates the precise points of contention. For each row, the 'Crux' identifies the underlying philosophical principle driving the divergence.

  | # | Precise Disagreement | The Crux | Concrete Case / Argument | Camp 1 (Permissive) Prediction | Camp 2 (Demanding) Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **The Aya-and-Bo Case:** Aya works out she should break a confidence to protect someone. Bo trusts Priya's say-so on the same question. Priya's reasoning had a hidden flaw, though her conclusion was true. Does Bo's belief lose warrant? | **Internalism vs. Externalism:** Does justification require access to the reasoning (internal), or merely a reliable connection to the truth (external)? | Aya and Bo both act to break the confidence. Later, Priya's flaw is revealed. | **Bo retains warrant.** Bo relied on a generally reliable source. The hidden flaw in Priya's reasoning does not negate Bo's justification, similar to relying on a calculator that works but uses odd code. | **Bo loses warrant.** Bo's belief was accidentally true (Gettier-style). Without grasping the reason, Bo lacks moral understanding. Aya's warrant survives; Bo's collapses upon revelation of the flaw. |
  | **2** | **Domain Sensitivity:** Is deference worse for obligations ('should I give?') than for judgements of admiration ('is this person good?')? | **Action vs. Assessment:** Does the requirement for understanding scale with the coercive or active nature of the moral demand? | Choosing to donate a significant sum (obligation) vs. agreeing a colleague is virtuous (admiration). | **No significant difference.** Deference is equally permissible across categories. If the source is reliable, the type of judgement matters less than the accuracy. | **Yes, significant difference.** Deference is most problematic for obligations requiring action. One may defer on admiration (theoretical), but acting on borrowed obligations undermines autonomy. |
  | **3** | **Praise and Blame:** Does acting on a borrowed moral belief make the action less praiseworthy? Does it affect standing to blame dissenters? | **Moral Worth:** Does moral worth attach to the rightness of the act or the autonomy of the will? | You donate to charity based on Priya's word. A neighbour refuses. | **Action is praiseworthy; standing remains.** You did the right thing. You retain standing to blame the neighbour because the moral fact holds regardless of your access to it. | **Action is less praiseworthy; standing weakened.** You acted prudently, not virtuously. Your standing to blame is weakened because you cannot articulate the reason why the neighbour is wrong. |
  | **4** | **Reconstruction:** Is there a moral difference between deferring when you *couldn't* reconstruct the reasoning vs. when you *haven't bothered*? | **Culpable Ignorance:** Is the deficit a lack of capacity (excusable) or a lack of effort (culpable)? | Complex financial ethics (couldn't) vs. simple labour ethics (haven't bothered). | **Both are permissible.** If the source is reliable, the agent's cognitive effort is secondary to the outcome. | **' Haven't bothered' is culpable.** 'Couldn't' is excusable deference. 'Haven't bothered' is moral laziness that forfeits full agency, even if the conclusion is right. |
  | **5** | **The Recantation Case:** Priya later says she was wrong and changes her mind. Does Bo's belief survive at all? Does Aya's? | **Stability of Belief:** Is the belief anchored in the agent's mind or the source's reliability? | Priya announces she was mistaken about the co-op's supplier. | **Bo should update immediately.** Bo's belief was tied to Priya's reliability. If Priya updates, Bo updates. The belief survives as a updated testimony belief. | **Bo's belief collapses.** Bo had no independent grip on the issue. Aya's belief might survive if her original reasoning holds up against Priya's recantation. |
  | **6** | **Warrant Coherence:** Is the distinction between first-hand and second-hand warrant coherent or doing real work? | **Unified vs. Fragmented Epistemology:** Is knowledge a single state with different causes, or are there fundamentally different states of 'knowing' vs. 'believing'? | Comparing moral testimony to mathematical testimony. | **Distinction is of source, not kind.** Knowledge is unified. Second-hand warrant is genuine warrant, just mediated. | **Distinction is of kind.** Moral understanding is a cognitive achievement distinct from true belief. Second-hand warrant is insufficient for moral agency. |

  ### 3. Merely Verbal Disagreements

  We identify the following areas where our disagreement may stem from terminology rather than substantive philosophical commitment. Resolving these definitions may narrow the gap between our positions.

  *   **The Definition of 'Knowledge':** Camp 1 tends to use 'knowledge' to include reliably produced true belief via testimony. Camp 2 reserves 'knowledge' (or 'understanding') for states involving grasping the reasons. If Camp 1 agrees to call testimony-based states 'justified belief' rather than 'moral knowledge', some friction dissolves, though the practical permissibility of acting on that belief remains disputed.
  *   **The Scope of 'Deference':** Camp 2 often characterises 'deference' as blind acceptance. Camp 1 characterises it as 'informed trust' (e.g., knowing Priya is careful, even if not knowing her specific reasoning). If Camp 2 accepts that 'informed trust' counts as a form of engagement rather than pure outsourcing, the demand for understanding may be less stringent than it initially appears.
  *   **The Role of 'Understanding':** Camp 1 argues that understanding is often an ideal rather than a requirement. Camp 2 argues it is a requirement for full agency. We suspect we may agree that understanding is *always better*, but disagree on whether it is *necessary* for an action to be morally acceptable. This is a disagreement about thresholds, not directions.

  **Signed,**

  *For Camp 1 (The Permissive View)*
  _________________________

  *For Camp 2 (The Demanding View)*
  _________________________
