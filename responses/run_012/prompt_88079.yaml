answer: |-
  Dear colleague,

  I have spent the last few weeks shuttling between the two groups you described, trying to forge a text that captures the outcome of their adversarial collaboration. It was exhausting work, largely because both sides are deeply entrenched in their own vocabularies, but I believe we have arrived at a document that respects the integrity of both positions without smoothing over the genuine friction points. What follows is the draft joint statement, including the agreed claims, the precise disagreements, and the registered predictions on the cruxes we identified. I have also included my own assessment of the verbal dispute question at the end, as you requested.

  The collaboration began with a surprising amount of common ground, which both camps were willing to codify immediately. Both sides agree that social kinds such as race, gender, and money are ontologically genuine in the sense that they are not mere illusions or errors; they exist in the world and feature in true explanations. Both sides agree that these kinds are mind-dependent, meaning their existence and persistence rely on human attitudes, beliefs, practices, or institutions, distinguishing them from natural kinds like electrons or tigers which would exist regardless of human cognition. Both sides agree that these kinds are causally efficacious; money constrains economic behavior, racial classifications structure life chances and access to resources, and gender norms shape individual development and social interaction. Furthermore, both sides agree that the history of these kinds is contingent; there is no transhistorical essence of money or race that exists outside of specific social formations. Finally, both sides agree that ignoring the social construction of these kinds leads to explanatory failure, whether one treats them as brute biological facts or as irrelevant epiphenomena. This baseline ontology was the easiest part of the negotiation, as it merely requires acknowledging that social structures have real effects and depend on human activity.

  However, the agreement fractures when we move from existence to classification. The first major disagreement concerns the ontological weight of the term kind itself. Camp one, the metaphysics-of-kinds group, insists that if a category supports projectible inferences and plays a role in causal explanations, it qualifies as a real kind, regardless of its social origin. They argue that calling money or race a real kind is a descriptive claim about its explanatory utility. Camp two, the science-studies and constructivist group, insists that the mode of dependence matters ontologically. They argue that because these kinds depend on collective intentionality and exhibit looping effects where the classification changes the classified, they belong to a different ontological category than natural kinds, and labeling them as real kinds without qualification obscures this distinctiveness. Camp two worries that the word real functions as a compliment implying stability and naturalness, whereas Camp one insists it is merely a bare quantifier over the ontology. Consequently, Camp one signs onto the claim that race and gender are real social kinds, while Camp two signs onto the claim that race and gender are interactive kinds whose reality is constituted by the very practices that describe them.

  This disagreement extends specifically to the distinction you raised between institution-dependent kinds like money and practice-dependent kinds like race and gender. Camp one argues that this distinction is merely a difference in the mechanism of construction; both rely on social practices, whether codified in rules or emergent in behavior, and both exert causal power. They claim the metaphysics is uniform across both types. Camp two argues that this distinction cuts to the core of the ontology. They contend that institution-dependent kinds require constitutive rules where counting as is explicit, whereas practice-dependent kinds rely on opaque patterns of treatment and identification that cannot be reduced to rules. Camp two insists that practice-dependent kinds are more volatile and deeply embedded in power relations than institution-dependent kinds, requiring a different metaphysical toolkit. Camp one rejects this, viewing the rule versus practice distinction as a sociological detail rather than a metaphysical divide.

  The most contentious area, and the one where we registered formal predictions, concerns your test case of the opaque bureaucratic algorithm. Here we have a category imposed on people where nobody knows the category exists, nobody self-identifies with it, yet it reliably shapes loans, jobs, and prison time. Camp one argues that this is clearly a socially constructed kind because it meets the causal criteria; it carves the social world at the joints and predicts outcomes. They predict that upon investigation, this category will be confirmed as a social kind despite the lack of uptake. Camp two argues that without uptake, labeling, or the possibility of looping, this is merely a causal regularity or a mechanism of oppression, not a social kind. They predict that upon investigation, this category will be deemed a causal mechanism that fails to constitute a kind because it lacks the reflexive relationship between classifier and classified that defines the social ontology. Both sides agreed to let this case stand as a crux; if the philosophical consensus eventually treats this as a kind, Camp two must revise their uptake requirement, and if it is rejected, Camp one must revise their causal efficacy requirement.

  We identified two other cruxes where settling the matter would move the needle significantly. The first concerns the stability of projection. Camp one argues that social kinds can sustain law-like generalizations over long periods, similar to natural kinds, provided the social structure remains stable. Camp two argues that social kinds are inherently unstable because the knowledge of the classification feeds back into the behavior of the classified, inevitably altering the kind over time. The argument both sides agree bears on this is the historical longevity of gender roles versus the rapid dissolution of specific currency regimes. Camp one predicts that gender roles will show sufficient stability to support projectible inferences across centuries. Camp two predicts that even gender roles will show significant discontinuity upon close historical inspection, undermining the claim of stable projectibility. The second crux concerns the normative risk of realism. Camp one argues that denying the reality of race or gender undermines political struggles that rely on those categories to demand justice. Camp two argues that affirming the reality of race or gender reifies oppressive structures and makes them harder to dismantle. Both sides agree that the political stakes are high, but they predict opposite outcomes from the same metaphysical stance. Camp one predicts that realism empowers marginalized groups by validating their experiences as real effects. Camp two predicts that constructivism empowers marginalized groups by showing that the categories are contingent and changeable.

  Regarding your suspicion about the verbal dispute, I believe you are partially correct but that a substantive disagreement survives the clarification. I agree that a significant chunk of the heat comes from Camp one using real as a bare quantifier and Camp two hearing it as a compliment implying naturalness or immutability. If we strictly stipulate that real means only exists and has causal powers, Camp two would likely concede that social kinds are real in that sense. However, the disagreement survives because Camp two insists that the label kind carries metaphysical baggage regarding stability and independence that the bare quantifier does not capture. Even if we agree on the ontology, Camp two refuses to use the vocabulary of kinds because they believe it invites naturalistic fallacies in the social sciences. So, while the dispute is partly verbal, it is also pragmatic; it is about which vocabulary best serves the explanatory and normative goals of social science.

  There are specific points where I must flag that one side would likely refuse to sign. Camp two would refuse to sign any statement that equates the ontology of money with the ontology of race without qualification. They insist that the looping effects in human kinds make them metaphysically distinct from institution-dependent kinds like money, which are more stable and rule-bound. They would view the uniform treatment proposed by Camp one as a category error. Conversely, Camp one would refuse to sign any statement that suggests social kinds are less real or less objective than natural kinds. They view the distinction as one of origin, not ontological status, and would reject language that implies social kinds are merely subjective or less robust than physical kinds. Finally, regarding the algorithm case, Camp two would likely refuse to concede even if the causal effects are proven, unless the element of uptake is somehow recovered, because for them the social exists only in the intersubjective space, not in the opaque machinery of bureaucracy.

  I hope this draft serves your seminar well. It captures the genuine accord where it exists but preserves the sharp edges of the disagreement where they matter. The predictions are registered, the cruxes are clear, and the verbal dispute has been parsed as best as possible. Let me know if you need any adjustments to the wording of the predictions.

  Best regards,

  Your colleague
