answer: |-
  **Session Structure & Sequence**

  **1. The Setup (10 mins): The Clean Case**
  Do not start with the deaf-parents case. It's a bad carrier for the *foundation* because it conflates disability with cultural identity, inviting immediate debate about what constitutes a "good life" before they accept the logic of selection. Instead, use a clear medical binary: IVF parents have two embryos. Embryo A carries a gene for a painful, short-life disease. Embryo B is healthy. Which do you implant? Everyone picks B. Ask why. They'll say "to prevent suffering."

  **2. The Metaphysical Block (15 mins): Non-Identity First**
  You must land the Non-Identity Problem *before* stating the principle. If you don't, engineers will treat this as a harm-prevention case ("we're saving Child A from pain"). Correct them: If you choose B, Child A never exists. You haven't saved A; you've replaced them. There is no existing person being harmed by being born disabled, because without that selection, *they* wouldn't be. This clears the deck: selecting isn't about fixing a person, it's about choosing which person exists. This makes the "no existing person is wronged" claim intelligible.

  **3. The Principle (15 mins): Procreative Beneficence**
  Now introduce the core idea: If you're choosing who to create, you have a moral reason to choose the one with the best expected life. Because no one is harmed by not being created (per step 2), the only metric left is the welfare of the future child. This shifts the frame from "preventing harm" to "selecting for benefit."

  **4. Misconceptions & Preemptive Strikes (20 mins)**
  Address objections in the order they will arise, intercepting them before they solidify.

  *   **The Nazi Reflex (State Coercion):** Immediately after stating the principle, draw a hard line. This is *liberal* eugenics. It is individual, private, and voluntary. No state force, no sterilization, no mandated breeding. If they conflate the two, stop and reiterate: "This is about your choice in a clinic, not a government mandate."
  *   **The IQ Slide (Maximization):** They will ask, "So I must breed for genius?" Head this off by defining "best life" as "significant advantage," not "maximum stats." Selecting for immunity is reasonable; selecting for perfect pitch is optional. The principle requires significant benefit, not perfection.
  *   **The "Does No Work" Move (Reason vs. Duty):** Finally, address the weight. They'll argue, "If it's only a reason, not a duty, I can ignore it." Clarify: It's a moral reason, like donating to charity. Ignoring it doesn't make you a criminal, but it makes you less morally good than you could be. It binds conscience, not law.

  **5. The Stress Test (10 mins)**
  Now bring in the deaf-parents case. Ask: "If deaf parents believe their child will have a *better* life within deaf culture, does the principle require them to select for deafness?" This tests if they understand the principle is about the *parents' expectation of welfare*, not an objective medical standard.

  **Closing Question**
  To test if they grasped the structure (specifically Non-Identity + Beneficence) rather than just nodding, ask this:
  *"If a couple can have a healthy child now, or wait three years to have a significantly healthier child due to career stability, does the principle require them to wait?"*
  If they say yes, they understand the "best life" metric applies to timing (different child created later). If they say no, ask why the embryo selection was different. This forces them to reconcile the Non-Identity logic across time.

  **What to Refuse**
  Openly refuse to cover **policy and access**. Do not discuss insurance coverage, genetic inequality, or regulation. This session is about individual moral reasoning, not societal implementation. If someone asks, "What if only the rich can do this?", shut it down: "That's a justice problem for a different night. Tonight is about the choice itself."

  **Why This Order**
  Non-Identity must precede the Principle because without it, the "harm" objection destroys the argument. The medical case must precede the cultural case because you need intuitive agreement before introducing complexity. The State Coercion objection must be killed early because it's an emotional blocker that prevents logical engagement.
