prompt: |-
  I host a monthly discussion night for a dozen or so people — mostly engineers and tech-adjacent types, read alot of blogs, no formal philosophy — and next month it's my turn, and I want to do procreative beneficence / liberal eugenics. What I need from you is the teaching plan, not the lecture itself. Here's the idea I want them to walk out with: when you're already in the position of choosing which child to bring into existence — which embryo to implant, which donor, whether to try now or later — there's a real moral reason to choose the one you expect to have the best life, and that this is a different animal from the state-coerced eugenics they'll instantly picture, since nobody's being forced and no existing person is being wronged. Plan the session for me. The order the pieces have to go in and why — in particular, does the non-identity stuff have to land before the principle even makes sense, or can I hand-wave it, and if so how far? The one case to build the whole thing on and what it needs going for it; I was going to use the deaf-parents-want-a-deaf-child setup, so tell me if that's a bad carrier and whats better. The misconceptions they'll form, in the order they'll form them, and exactly where in the sequence I head each one off — I'm expecting the Nazi reflex, the "so you have to breed for IQ" slide, and the "if it's only a reason and not a duty then it does no work" move, but there'll be others. Then a single closing question that shows me whether they actually got the structure or just nodded along, and what I should openly refuse to cover at this level. No readings, no names to look up. 800 words max, American English.
