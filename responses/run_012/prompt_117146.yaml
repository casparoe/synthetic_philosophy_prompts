answer: |-
  - **Ground rules**

  I am translating metaethical positions into your three categories: **Handleable** (causal leverage), **Fit-dependent** (model utility), and **Formalism-swappable** (convenience). I will map Moral Realism mostly to Handleable and Fit-dependent, and Anti-Realism to Formalism-swappable. 

  Two strain points appear immediately. First, **Causality**: In your lab, entities push back. In ethics, "values" do not physically move atoms; agents do. Second, **Measurement**: Your data comes from instruments calibrated against standards. Moral "data" comes from intuitions or social coordination, which lack external calibration. I will flag where I stretch "measurement" to mean "judgment" or "consequence." The translation assumes you treat "real" as "causally efficacious" or "indispensable for prediction," which is exactly how you treated electrons.

  - **The translation**

  **Naturalistic Moral Realism** claims moral properties are **Handleable**. This position argues that "wrongness" is identical to a natural property, like "causing suffering." You can isolate suffering, manipulate it, and the apparatus (the human nervous system) visibly breaks. If you claim "torture is wrong," you are making a claim about neurochemistry and psychology. The moral fact is just the physical fact. *Stretch:* This reduces morality to sociology or biology. Many realists refuse this reduction, claiming moral facts are distinct from physical facts.

  **Non-Naturalistic Moral Realism** claims moral properties are **Fit-dependent**. These entities (Goodness, Obligation) are never touched directly. You never isolate "Justice" in a beaker. However, a model including objective moral truths predicts the data (our shared intuitions, the stability of societies, the phenomenology of deliberation) better than a model without them. If the fit is bad (e.g., cultural disagreement), you don't know whether to blame the moral entity or the functional form of our reasoning. *Stretch:* "Prediction" here means explaining why we feel bound by rules, not predicting photon counts.

  **Moral Relativism / Constructivism** claims moral properties are **Fit-dependent within boundary conditions**. There is no universal model. Instead, there are local models (cultures, agents) where certain rules provide the best fit for coordination. "Wrong" means "violates the local model." Swapping cultures swaps the truth value. *Stretch:* This treats truth as indexical, like saying "here" is true only at this location.

  **Expressivism / Emotivism** claims moral claims are **Formalism-swappable**. When you say "Murder is wrong," you aren't describing an entity. You are expressing an attitude ("Boo murder") or prescribing a command. You could swap this for a different formalism (e.g., "I prefer non-murder") and lose nothing measurable in the physical world. The language earns its keep by convenience—social coordination—not by contact with an instrument. *Stretch:* This denies moral claims have truth values at all, treating them like coordinate system choices.

  **Error Theory** claims moral claims *attempt* to be **Handleable** but fail. They posit entities like "intrinsic obligation" that do not exist. It is like believing in phlogiston. The claims are uniformly false because the referents are missing. *Stretch:* This agrees with the Realist about what moral language *tries* to do, but agrees with the Expressivist about what it *actually* does.

  **Quietism** claims the debate itself is **Formalism-swappable**. Whether you call values real or projected makes no difference to the measurements (actions) anyone will ever make. It is a verbal dispute about labeling the model, not about the data. *Stretch:* This suggests the metaethical debate is itself a waste of lab time.

  - **Clean carries**

  The epistemic structure transfers perfectly. Your frustration with non-naturalistic realism is identical to the frustration physicists feel toward Bohmian mechanics: it fits the data, but posits invisible machinery that never interacts with the detector. The distinction between ontology (what exists) and utility (what works) is preserved. 

  The debate over whether moral facts are "mind-independent" maps cleanly to whether an electron exists before you measure it. The Naturalistic Realist says yes (it's physical); the Expressivist says no (it's a reading on the gauge we built). The anxiety about underdetermination—that multiple models fit the same data—is identical. Whether you choose "objective value" or "social contract" to explain why we don't kill, the behavioral data remains the same. Your intuition that the argument is about "what to call a projection" is validated by the Expressivist translation.

  - **Bent**

  The concept of **Measurement** is distorted. In your lab, measurement is causal interaction. In ethics, "measurement" is intuition or consensus. Intuition is not a calibrated instrument; it is the thing being explained. If your spectrometer gives weird readings, you check the laser. If your moral intuition gives weird readings (e.g., "slavery is okay"), you don't check the intuition; you check the culture. This distortion hides the **normative force** of ethics. 

  In spectroscopy, if the model fails, you update the model. In ethics, if the agent fails the model, you blame the agent. The "Fit-dependent" category implies passive observation. Moral realism demands active compliance. The translation hides the fact that moral facts claim *authority*, not just explanatory power. A wavefunction doesn't tell you what to do; a moral law does. By treating moral claims as model components, we strip them of their command structure. The "Fit" becomes pragmatic (social stability) rather than truthful (correspondence to reality).

  - **Didn't survive**

  1.  **Normativity (The Ought):** Your vocabulary describes what *is* (Handleable) or what *works* (Fit/Swappable). It cannot capture what *must be*. Moral realism claims that knowing a fact gives you a reason to act. No physical fact does this. You can know cyanide is Handleable and still drink it. Moral realists claim you *shouldn't*. That "should" has no counterpart in your lab.
  2.  **Supervenience without Causality:** Moral properties supervene on physical ones (no moral difference without physical difference), but realists deny they are identical. In your lab, if A supervenes on B without causality, it's usually epiphenomenal. Moral realists claim these properties are robust but causally inert. Your vocabulary treats causally inert entities as Formalism-swappable at best.
  3.  **Internal Motivation:** Moral judgments are supposed to motivate. If you truly judge "X is wrong," you have a reason not to do X. In your lab, believing "X is toxic" does not motivate avoidance unless you add a desire to live. Moral realism claims the belief itself carries the motivation. Your vocabulary separates belief (model) from desire (budget priority).

  - **Verdict on the residue**

  Your vocabulary is deficient, not the debate. You are asking for an interference experiment for a category that claims to transcend interference. 

  1.  **Normativity:** This is the missing piece. Science is descriptive; ethics is prescriptive. Your toolkit measures resistance and absorption. It cannot measure "reasons." The realist isn't claiming moral facts push atoms; they are claiming they bind wills. Your vocabulary lacks a "will-meter."
  2.  **Supervenience:** This isn't a failure of the debate, but a failure of your ontology to handle non-causal dependence. You treat non-causal entities as instrumental. Realists claim they are constitutive.
  3.  **Motivation:** This confirms the debate is not thin. If moral claims were just Formalism-swappable, psychopaths would be unintelligible (they have the model, lack the motivation). The fact that they are intelligible suggests a split your vocabulary doesn't track.

  The metaethics debate is not thinner than the science debate; it is harder. You are trying to measure the calibration of the scientist, not the instrument.
