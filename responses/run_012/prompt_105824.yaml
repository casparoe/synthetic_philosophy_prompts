answer: |-
  Here is a principle that captures your intuitions, explains the distinctions between your cases, and addresses the "Western standards" objection.

  ### The Principle: Public Impartiality

  **Statement:**
  An act is corruption if an agent exercising **public or institutional authority** allows a **private consideration** (money, kinship, favor, or gift) to determine their decision, rather than the **mandated public criteria** (law, merit, or need) of their role.

  This principle relies on three necessary conditions. If any one is missing, it is not corruption.

  1.  **The Role Condition:** The actor must be holding a public office or an institutional role that demands impartiality (e.g., clerk, nurse, chief, congressman, procurement officer).
  2.  **The Criterion Condition:** The decision must be based on a private consideration (cash, family, reciprocity) instead of the role's mandated criteria (legal qualification, medical need, merit, public interest).
  3.  **The Commodification Condition:** The public power is treated as a private asset to be exchanged or leveraged.

  ---

  ### How This Principle Matches Your Verdicts

  Here is how the principle justifies your gut feelings on your specific cases, and which part of the principle does the heavy lifting for each.

  **1. The Clerk (Permit)**
  *   **Verdict:** Corruption.
  *   **Why:** The clerk holds a **Public Role**. The mandated **Criterion** is legal qualification for the permit. The decision is determined by **Cash** (Private Consideration).
  *   **Why your "Open/Hidden" principle failed:** This case proves that secrecy is irrelevant. Even if everyone knows, it violates Public Impartiality.

  **2. The Doctor (Private Care)**
  *   **Verdict:** Fine.
  *   **Why:** Fails the **Role Condition**. A private doctor is not a public fiduciary. They are selling a private service. There is no mandate for impartiality to the general public, only to paying clients.

  **3. The Hamper (Gift to Officer)**
  *   **Verdict:** Corruption (Mild).
  *   **Why:** Meets **Role** and **Commodification**. Even without an explicit deal, the gift introduces a **Private Consideration** that compromises the **Criterion** of impartial procurement. It creates a debt of gratitude that competes with public duty.

  **4. The Village Chief (Scholarship)**
  *   **Verdict:** Corruption.
  *   **Why:** Meets **Role** (Chief administers public/communal resources). Fails **Criterion** (Kinship used instead of merit/need).
  *   **Addressing your Cousin:** Your cousin argues this is "clientelism" (family duty). This principle accepts that family duty exists *privately*, but rules that when you hold a **Public Role**, family duty cannot override public criteria. This is why you reject your cousin's defense: the Chief was acting as an official, not a father.

  **5. The Professor (Recommendation)**
  *   **Verdict:** Fine.
  *   **Why:** Meets **Role**, but meets **Criterion**. The professor's mandate is to judge *merit*. If the student is genuinely the best, the decision is based on the public criterion (academic excellence), not the private relationship.

  **6. The Congressman (Donation)**
  *   **Verdict:** Corruption.
  *   **Why:** Meets **Role**. The **Criterion** for voting should be public interest/constituent will. The **Private Consideration** (donation/loyalty to donor) influences the act.
  *   **Nuance:** This explains why disclosure doesn't fix it. The corruption is in the *dependence* on the donor, not the secrecy of it.

  **7. The Nurse (Queue Jumping)**
  *   **Verdict:** Corruption.
  *   **Why:** This is the hardest case. The money went to a public fund, so there was no "private financial gain." However, it violates the **Criterion Condition**. Triage must be based on *medical need*, not *ability to pay*. The Nurse sold her *discretion*, which is a public asset, even if the proceeds were public.

  **8. The Wedding (In-Laws)**
  *   **Verdict:** Fine.
  *   **Why:** Fails the **Role Condition**. Marriage is a private social contract. The "connections" are a byproduct of a social alliance, not the price of a specific official act.
  *   **Distinction from Clerk:** In the Clerk case, the money buys a specific administrative outcome. In the Wedding case, the money (dowry/gift) seals a relationship; the business support is a future social expectation, not a pre-negotiated price for a specific exercise of state power.

  **9. The NGO (Hypocrisy)**
  *   **Verdict:** Hypocritical, distinct from corruption.
  *   **Why:** If the NGO is private, hiring a nephew is nepotism, not public corruption (Fails **Role Condition**). However, it undermines their moral authority to judge others.

  ---

  ### Predictions and Necessary Overturns

  **1. The Hypothetical: Government Speeding Fee**
  *   *Case:* The government publishes an official fee to speed up a passport, and the money goes to a public fund.
  *   *Prediction:* **Corruption (or Systemic Unjustice).**
  *   *Reasoning:* This violates the **Criterion Condition**. Access to public rights (like a passport) should be based on citizenship and processing order, not wealth. By monetizing the queue, the state treats public power as a commodity. Even if it is legal and open, it violates Public Impartiality because it allows private wealth to override equal standing before the state.
  *   *Debate Tip:* This is a strong point for you. Legality does not equal ethics. A law can institutionalize corruption.

  **2. Necessary Overturn: The "Mild" Hamper**
  *   *Your Verdict:* Corruption, but milder.
  *   *Principle's Verdict:* **Equally Corrupt in Kind.**
  *   *Reasoning:* The principle suggests that the *type* of wrong is the same as the Clerk case (compromised impartiality), even if the *scale* is smaller. A gift creates the same conflict of interest as a bribe; it just costs less. You might need to adjust your view that it is "milder" corruption—it is arguably just as dangerous to trust, just less expensive.

  **3. Necessary Overturn: The "Good Policy" Congressman**
  *   *Your Verdict:* Corruption, even if the vote is good.
  *   *Principle's Verdict:* **Agrees.**
  *   *Reasoning:* This is a crucial validation. Corruption is about the *process* and the *dependence*, not the *outcome*. If a congressman votes correctly only because a donor paid them, they are still corrupt because they are not acting as an independent fiduciary of the public.

  ---

  ### Is This Just "Western Standards"?

  You asked if you are just assuming Western rules are the default. The answer is **no**, but with a caveat.

  Your cousin is arguing for a **Particularist Ethic**. In this view, morality depends on *who* you are related to. You owe more to your family than to a stranger. This is not "non-Western"; it was the standard in Europe 500 years ago too. It is the ethic of the **Family/Tribe**.

  You are arguing for a **Universalist Ethic**. In this view, morality depends on *what role* you hold. If you are a clerk, you owe the same duty to every citizen. This is the ethic of the **State/Institution**.

  **Why your gut rejects the Cousin's view:**
  You are living in a context where a modern State exists alongside traditional kinship structures.
  *   If the Village Chief is acting as a **Father**, giving the scholarship to his daughter is love.
  *   If the Village Chief is acting as a **Chief**, giving the scholarship to his daughter is theft from the community.

  Your intuition correctly identifies that the Chief was wearing his "Public Hat," not his "Family Hat." This isn't about Western vs. Local; it is about **Public vs. Private**.

  **The Debate Strategy:**
  When your cousin says "This is how families work," you reply: *"Families work on loyalty. States work on fairness. When a family member takes a public job, they agree to switch from loyalty to fairness. If they can't switch, they shouldn't take the job."*

  This principle allows you to respect the Wedding (Private/Family sphere) while condemning the Clerk (Public/State sphere) without accusing your culture of being "wrong," but rather identifying when the *wrong sphere* is being applied to the *wrong role*.
