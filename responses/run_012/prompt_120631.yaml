answer: |-
  Good evening. For the past six years, I have served as this organization's treasurer. Usually, when I stand up at this podium, my job is to offer you comfort. I show you pie charts and balance sheets. I tell you that we are solvent, that we are efficient, and that for every dollar you give, we can point to a specific result. I tell you that we know what we are doing.

  But I am also a software engineer. I write code that runs experiments for a living. I spend my days distinguishing signal from noise, and I have come to realize that tonight, I cannot offer you that usual comfort. I cannot stand here and tell you that we know, with statistical certainty, that this organization makes the world better in the long run.

  Our annual report tells you that ninety percent of the children in our program improve their reading scores. That is true. We measured it. We compared them to a group we assembled, over one school year, on one test. But life is not a controlled experiment. After that year, the effects fan out. A child gains a little confidence. A teacher becomes a little more patient. A family moves across town. A job is taken, or lost.

  I think about the cohort from 2013. One girl is now a nursing student. I would like to believe we helped put her there. Another child from that same group is in prison. I worry we failed him. The truth is, I cannot tell you whether either outcome has anything to do with us. The chain of causality is too long, too tangled, and too noisy. If you asked me whether, on balance, we have made the world better or worse since we started, I would have to say: I do not know. I am not confident that question even has an answer anyone could give.

  There is a distinction I need to make, and I make it carefully. It is one thing to say I do not know the far-off effects. It is another to say there may be no single fact of the matter about the total, because the effects are scattered across so many people and times that summing them up is a fiction. We are not building a bridge where the load bearing is calculable. We are tending to lives.

  I also know that I am just as ignorant about what would have happened had we never existed. Maybe the state would have stepped in. Maybe things would have been worse. My ignorance about the counterfactual is not an argument for shutting the place down, nor is it a debating trick to let me off the hook. It is simply the truth of the terrain we are working on.

  So, if I cannot promise you a measurable win, and I cannot promise you a known future, why are we here? And why am I asking you for money?

  I am asking you because while I am uncertain about the *outcome*, I am certain about the *practice*.

  There is a value in the work itself that exists independently of the final score. When a mentor shows up every Tuesday at 4:00 PM, that reliability is a fact. When a donor writes a check, that commitment is a fact. When we gather in this room, we are enacting a promise to each other that these children matter. That practice—the act of showing up, of caring, of refusing to look away—is something we can know. It is the only thing we can know.

  We are not here to buy a guarantee. You cannot buy a guarantee that a child will succeed. We are here to fund a commitment. We are funding the infrastructure of care that allows us to keep making that promise, year after year, regardless of the noise in the data.

  To the staff and volunteers in the room: Your work is not invalidated by the complexity of the world. Your work is the only solid ground we have. To the donors: You are not purchasing a product. You are sustaining a practice. To my parents, who wrote the first check: You didn't have data then either. You had a conviction that something needed to be done.

  I cannot tell you that we will fix everything. I cannot tell you that we know exactly how the story ends. But I can tell you that the practice of trying is real. The practice of gathering resources to support these kids is real. And without you, that practice stops.

  So, when the envelopes come around, I am not asking you to bet on a specific outcome. I am asking you to underwrite our certainty about the need, even while we remain humble about the result. I am asking you to help us keep showing up.

  Please give what you can to keep this practice alive. Let us continue to be the people who decide, collectively, that these children are worth the effort, even if we cannot measure the echo.

  Thank you.
