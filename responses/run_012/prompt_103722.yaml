      *   *Reading 2: The Epistemic Efficiency Claim.* Markets are *better* at finding truth than voting. Voting is *better* at aggregating preferences than markets.
      *   *Reading 3: The Moral/Normative Claim.* It is *right* for people to choose values (autonomy) but *wrong* for them to choose facts (epistemic humility).
      *   *Reading 4: The Incentive Compatibility Claim.* "Bet" means skin-in-the-game. This solves the manipulation objection by making manipulation costly.
      *   *Reading 5: The Separation Thesis.* Values and beliefs *can* be cleanly separated. (This is a metaphysical/psychological claim).
      *   *Reading 6: The Advisory/Weak Reading.* Markets are just information inputs; the vote still decides. (Contradicts standard futarchy, but possible interpretation).
