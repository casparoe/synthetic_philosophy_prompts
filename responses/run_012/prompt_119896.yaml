      *   "Which single requirement rules out the most candidates." -> Yes.
      *   "Whether some pair cannot be met together." -> Yes.
      *   "Brief note on how usual families of answer fare." -> Yes.

  7.  **Final Polish:**
      *   Ensure the tone is analytical and not prescriptive of a single solution.
      *   Make sure the "Incentive" and "Split Class" variations are explicitly integrated into the requirements, not just tacked on.
      *   *Self-Correction on Variation 1:* The prompt says "after which the backward step no longer seems to get started at Friday." I need to make sure the requirement captures *why* a solution must account for this intuition shift. The shift is due to the disjunctive nature of the promise (Surprise $\lor$ A+). If Friday is reached, it's not a surprise, but the condition is satisfied by the A+. So Friday is not eliminated. A solution must explain why the logic changes when the consequence of "not surprise" changes from "Falsehood" to "Alternative Reward."
      *   *Self-Correction on Variation 2:* The prompt asks "which half is surprised and whether the answer just tracks who believed her." The requirement must force the solution to define the truth conditions of "surprise."

  8.  **Finalizing the List of Requirements:**
      1.  Phenomenological Adequacy (The exam happens).
      2.  Diagnostic Specificity (Where the logic breaks).
      3.  Announcement Stability (Status of the teacher's utterance).
      4.  Incentive Sensitivity (Variation 1).
      5.  Epistemic Relativity (Variation 2).

      *Wait, let's merge 3 into 2 or make it distinct?* Distinct is better. The status of the announcement is crucial (Self-referential?).
      *Let's ensure the "Non-negotiable" vs "Loyalty" distinction is sharp.*
      Non-negotiable: The exam happens. The reasoning is invalid (somewhere).
      Loyalty: Whether knowledge entails truth, whether knowledge is closed under deduction.

      *Conflict:* "The Announcement is Knowable" vs "Classical Logic Holds."
