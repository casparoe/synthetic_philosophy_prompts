answer: |-
  **The Remaining Two**

  *The reading group has dispersed. The rain is beating against the window of the seminar room. Eleanor (Defender) and Julia (Sceptic) remain at the table, coffee cold.*

  **Eleanor:** We are talking past one another on the matter of blame. That is where the split lies. My position is not that morality is lax, but that it is human. When we say an act is supererogatory, we are marking a boundary in our reactive attitudes. If I omit the act, you may be disappointed, perhaps you may even think I am less virtuous than I could be. But you cannot resent me. You cannot hold it against me. If your theory closes the gap, Julia, you must either say I am blameworthy for not being a saint, or you must say the saintliness isn't actually moral in nature. Both seem to me to be bullets one should not bite.

  **Julia:** I am not biting bullets; I am untangling a knot. You are conflating the *status* of the act with the *assessment* of the agent. My claim is that 'supererogatory' is a placeholder for 'objectively required but subjectively excused'. When you say I cannot resent you, you are talking about blame. I am talking about duty. An act can be wrong without the agent being blameworthy. If I fail to save a life because I am terrified, I have still failed to do what morality demands, even if we agree I shouldn't be castigated for it. Your category collapses the distinction between what is right and what we can reasonably expect.

  **Eleanor:** But that distinction is precisely what matters for guidance. If morality demands everything that is best, it demands too much. Let's take the first complication the group stalled on. The division of labour. Suppose a disaster is imminent. A hundred of us stand by a levee. Only one person needs to throw the switch to divert the flood, but doing so ruins that person's livelihood. If no one is assigned the task, is it required of me?

  **Julia:** If the disaster is grave enough, yes. The necessity of the outcome generates the duty.

  **Eleanor:** For all hundred of us?

  **Julia:** Potentially. If nobody does it, everyone has failed.

  **Eleanor:** That is absurd. If I throw the switch, I sacrifice my livelihood. If you throw it, you sacrifice yours. If morality requires it of me, and also requires it of you, then morality requires a level of sacrifice that no one could reasonably sustain as a general rule. If I step forward, I am heroic. If I step back, I am not a villain, I am simply one of ninety-nine others hoping someone else steps up. To call my stepping back a 'failure of duty' implies I owe the world my livelihood.

  **Julia:** You are smuggling in a cost-benefit analysis and calling it a definition of duty. Let's refine the case. Suppose we know, objectively, that only one person needs to act. Do you agree that the *group* has a duty to prevent the disaster?

  **Eleanor:** Yes.

  **Julia:** And the group is just us, individually. If the group duty is real, it must distribute. If you say it is 'optional' for you, and 'optional' for me, then it is optional for the group. But we agreed the group *must* act. Therefore, it cannot be optional for every member. It must be required for at least one. But since we don't know which one, it is required for all, conditionally.

  **Eleanor:** Conditionally on what? On nobody else doing it?

  **Julia:** Conditionally on the need existing.

  **Eleanor:** But if I know you are likely to do it—say, you are braver, or you have less to lose—my duty recedes. This is the heart of supererogation. It tracks the space where the need is real, but the assignment is not. If I act, I solve the problem. If I don't, I haven't violated a rule, because the rule wasn't addressed to me specifically. It was addressed to 'someone'. By acting, I take on a burden that was not mine to bear. That is the definition of the category.

  **Julia:** I concede that the *certainty* of the duty shifts based on what others do. If I know you are throwing the switch, my duty lapses. But in the unorganised case, where I don't know, I cannot assume you will do it. If I assume you will, and you don't, the disaster happens. So, in the moment of decision, I must act as if the duty falls on me. To call it 'supererogatory' suggests I am morally free to let the disaster happen provided enough others feel the same. That makes morality a lottery of negligence.

  **Eleanor:** It isn't negligence if the cost is high. But let's move to the case that truly broke the group. The kidney register.

  **Julia:** The woman on the list of two hundred.

  **Eleanor:** Precisely. Two hundred potential donors. One kidney needed to save a life. None have been approached yet. Our subject is one of the two hundred. She hesitates. Her reasons are decent—fear of surgery, time off work, anxiety—but not compelling. She knows she *could* do it. If she does, she is a saviour. If she doesn't, the life is lost (assuming the others also hesitate or are incompatible). Is her omission blameworthy?

  **Julia:** If the life is lost, yes.

  **Eleanor:** Then what of the other hundred and ninety-nine? Are they all blameworthy?

  **Julia:** They are all under the same obligation.

  **Eleanor:** So we have two hundred moral failures for one missing kidney? That suggests the duty is not to save the life, but to engage in a mass sacrifice.

  **Julia:** No. The duty is to save the life. The fact that only one kidney is needed means that, objectively, only one person needs to succeed. But subjectively, each of the two hundred faces the same moral demand: 'Will you be the one?' If they all say 'no', they have all failed the demand, even if only one 'yes' was needed.

  **Eleanor:** This is where your view becomes unliveable. It turns morality into a trap. If I am one of the two hundred, and I adopt your view, I must think: 'I am required to give this kidney.' But I also know that if everyone thinks that, we have two hundred kidneys flying around for one recipient. That can't be right. The duty must be distributed such that it falls on *one*, but is *optional* for the rest until the one is identified.

  **Julia:** But who identifies the one? The hospital? That makes morality dependent on administrative selection. If the hospital calls me, does the duty arise then?

  **Eleanor:** In a sense, yes. The call specifies the duty. Before the call, I am in the pool of potential helpers. To jump into the pool voluntarily is to go beyond what is asked. That is supererogation. It is to say, 'I know I am not the designated agent, but I will act anyway.'

  **Julia:** I think you are hiding behind the word 'designated'. Morality doesn't wait for the hospital letter. If I walk past a drowning child, I don't wait for a lifeguard to assign me the rescue. The need creates the duty. In the kidney case, the need is known to the register. The woman knows she is on it. She knows her compatibility is high. Her hesitation is a weighing of her interests against a life. If she decides her interests win, she has decided that her comfort is worth more than a life. That is a moral failure.

  **Eleanor:** But if it is a failure, why do we not blame her? You keep coming back to this. You say she fails, but implies we shouldn't castigate her.

  **Julia:** Because the cost is significant. We excuse her because the demand is heavy.

  **Eleanor:** And there it is. You say 'excused'. I say 'not required'. We are describing the same phenomenology with different metaphysics. But my version preserves the value of the act. If I donate, I am not just 'doing my duty'. I am doing something extraordinary. If you say it is required, then the donor is merely compliant. She has avoided wrongdoing. That strips the act of its glory.

  **Julia:** It doesn't strip it of glory; it strips it of mystery. We admire people who do their duty in the face of fear more than those who do easy duties. But I see the problem for my view in the numbers. If I say all two hundred are required to act, I imply a contradiction: we require two hundred kidneys when one suffices.

  **Eleanor:** Exactly.

  **Julia:** However, I can modify the claim. It is not that all two hundred are required to *donate*. It is that all two hundred are required to *be willing to donate if called*. The specific act of surgery is only required if the selection falls. But since the selection hasn't happened, the woman is hesitating on a hypothetical.

  **Eleanor:** But she isn't hesitating on the hypothetical. She is hesitating on the reality. She knows she could volunteer now. She could call the hospital. If she calls them, she makes herself the selected one.

  **Julia:** Then the question is: is she required to make herself the selected one?

  **Eleanor:** Yes. That is the supererogatory act. To make oneself the agent of salvation when one was not compelled to be.

  **Julia:** If she can save a life at a cost to herself, and she doesn't, she has allowed a death to happen that she could have prevented. In what world is that not a failure of requirement?

  **Eleanor:** In a world where my life is mine to live, provided I do not harm others. Not saving is not harming.

  **Julia:** That distinction is fragile. If I stand between a starving child and a sandwich I don't need, and I eat the sandwich, have I harmed her?

  **Eleanor:** You have withheld aid.

  **Julia:** And if the aid was necessary and the cost trivial?

  **Eleanor:** Then it becomes required. That is the threshold. Supererogation lives above the threshold of significant cost. In the kidney case, the cost is significant. Surgery is not a sandwich.

  **Julia:** So it is a sliding scale?

  **Eleanor:** It is a threshold of reasonable demand.

  **Julia:** Then we are arguing about where the threshold lies, not whether the category exists. You say the kidney is above the threshold of duty. I say it is below it, but above the threshold of blame.

  **Eleanor:** But if it is below the threshold of duty, why is the hesitation a failure? You said earlier she fails the demand.

  **Julia:** Because the demand of morality is to do the best we can, within reason. 'Reason' allows for self-protection. But 'best' demands the life be saved. There is a tension there. Your theory resolves the tension by saying the demand stops at self-protection. My theory says the demand continues, but we recognise the right to self-protection as an excuse.

  **Eleanor:** And that is why your theory is dangerous. It keeps the guilt alive. It tells the woman, 'You did the permissible thing, but you are still a moral failure.' My theory tells her, 'You did the permissible thing, and the other option was a gift you were not obliged to give.'

  **Julia:** And that is why your theory is complacent. It tells her, 'You owe nothing,' when a life is at stake. It lets her off the hook too easily. If she feels guilt, she is recognising a truth your theory denies: that she could have done more.

  **Eleanor:** She could have done more. That is why it is admirable. But 'could have' does not imply 'should have'.

  **Julia:** In the face of death, 'could have' implies 'should have', unless the cost is catastrophic. Is surgery catastrophic?

  **Eleanor:** For some, yes. For all, it is significant. And since we cannot rank the two hundred by their resilience, we cannot say it is required for her specifically without it being required for all. And if it is required for all, we are back to the two hundred kidneys problem.

  **Julia:** I concede the 'two hundred kidneys' point is a vulnerability. I cannot maintain that all two hundred are strictly required to *act* simultaneously. I must retreat to: all two hundred are required to *make themselves available*, and if called, to act unless the cost is truly catastrophic. If she volunteers, she bypasses the call.

  **Eleanor:** And if she doesn't volunteer?

  **Julia:** Then she has remained within the bounds of duty, but she has not tested them.

  **Eleanor:** So she is not blameworthy?

  **Julia:** No. Not blameworthy.

  **Eleanor:** Then what work is 'required' doing? If I am not blameworthy for omitting it, and I am not wrong to omit it, in what sense is it required?

  **Julia:** It is required in the sense that it is the *best* course of action. Morality recommends the best, even if it only mandates the good.

  **Eleanor:** Then we have merely renamed 'supererogatory' to 'morally recommended but not mandated'.

  **Julia:** Perhaps. But I want to keep the pressure on the agent. 'Recommended' sounds like a menu. 'Required but excused' sounds like a burden we share.

  **Eleanor:** And I want to protect the agent from a burden that crushes the will to be good. If every act of generosity is a duty, then generosity dies. It becomes compliance.

  **Julia:** Or it becomes the baseline of a decent life.

  *They sit in silence for a moment. The rain has stopped.*

  **Eleanor:** We aren't going to resolve the kidney case tonight.

  **Julia:** No. But I think I see where you will not move. You think the category of supererogation protects the *value* of the good deed.

  **Eleanor:** And you will not move because you think the category protects the *agent* from the truth of the need.

  **Julia:** Precisely.

  **Eleanor:** Then we shall have to read further. But I think I have forced you to admit that if it's not blameworthy to omit, the 'requirement' is doing very little work.

  **Julia:** And I think I have forced you to admit that if the need is great enough, the 'option' feels like a fiction.

  **Eleanor:** Fair enough.

  ***

  **Concluding Note**

  **Assessment of Positions**
  Once the exchange has run its course, the Sceptic (Julia) appears to hold the slightly stronger position, primarily because her framework of 'required but excused' offers a more robust account of the agent's internal experience of guilt or regret. In the kidney case, Eleanor struggles to explain why the woman feels a moral pull if the act is truly optional. Julia's admission that the 'two hundred kidneys' problem forces a modification of her view (shifting from a duty to *act* to a duty to *be available*) saves her from absurdity, but it concedes significant ground to the Defender.

  **The Turning Point**
  The argument that would lead me to come down on the Defender's side is the 'moral ecology' argument Eleanor hints at: if we classify all high-cost benevolence as duty, we risk making morality so demanding that agents become resentful or disengage entirely. If the 'required but excused' model generates excessive guilt for normal human limitations, it is pragmatically inferior, even if metaphysically precise. If the cost of the kidney donation is truly life-altering (e.g., long-term health risks), Eleanor's threshold model handles this better than Julia's excuse model, which risks implying the agent is still technically in the wrong.

  **Potential Unfairness**
  The dialogue may be unfair to the Sceptic by leaning on a specific reading of 'blame'. Julia separates wrongness from blameworthiness, but the dialogue pressures her to collapse them to make her point about 'failure'. A more sophisticated Sceptic might argue that 'wrongness' is purely objective and has no connection to blame or guilt whatsoever, which would insulate her from Eleanor's charge that her theory is 'unliveable'. Additionally, the dialogue treats 'supererogation' as a binary category, whereas some theories allow for degrees of obligation; this nuance was sacrificed for the sake of the clash. Finally, the Defender is perhaps too readily allowed to equate 'not blameworthy' with 'not required', whereas the Sceptic's core point is precisely that these can come apart.
