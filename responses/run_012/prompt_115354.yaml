  3.  **Drafting the Table of Correspondences:**
      *   *Legal:* Standard of Proof (BRD vs. PoE), Fact-finder (Jury/Judge), Fact Proved (Defendant did X), Stakes (Liberty vs. Money), Authority (Legislature/Procedure Rules), Finality (Res Judicata/Double Jeopardy).
      *   *Epistemic:* Epistemic Standard (Certainty vs. Probability), Knower/Attributor (Subject/Speaker), Proposition Known (P is true), Practical Stakes (Cost of being wrong), Authority (Context/Conversation), Finality (Truth conditions).

  4.  **Analyzing the Breaks (The Core Audit):**
      *   *Break 1: Ontology of the Fact.* In law, the *verdict* changes, but the *event* (did he pull the trigger?) is generally assumed to be fixed (realism). The friend argues the *knowledge fact* changes.
      *   *Break 2: Action vs. Belief.* Legal verdicts license *state action* (punishment/compensation). Knowledge attributions license *belief/assertion*.
      *   *Break 3: Authority.* Legal standards are codified. Epistemic standards are fluid/conversational.
      *   *Substantive vs. Decorative:* The fact that legal standards are written down is decorative. The fact that legal verdicts are *performative* (they make it legally true) while knowledge claims are *descriptive* (they aim to match reality) is substantive.

  5.  **Addressing the Three Questions:**
      *   *Q1 (Context vs. Stakes):* The legal analogy actually supports *Pragmatic Encroachment* (stakes affect justification) more than pure Contextualism (meaning of 'know' shifts). In law, the *rule* changes based on the *type of case* (criminal vs. civil), which is determined by stakes. However, the friend wants to say there's *no fact of the matter*. The law assumes there *is* a fact (the crime happened or didn't), but we require different certainty to act. This hurts the friend's "no fact of the matter" claim.
      *   *Q2 (Pragmatism vs. Epistemology):* Strong point. Legal standards govern *licensing action*, not *mental states*. A jury acquitting doesn't mean the defendant is innocent, just that the state can't punish. This supports the view that knowledge norms might be about action, not metaphysical truth. This undermines the friend's metaphysical conclusion ("no fact of the matter").
      *   *Q3 (Does the conclusion survive?):* The user's intuition is likely correct. The law distinguishes between *truth* and *proof*. Two verdicts, one event. This implies the fact is stable, but our *warrant to act* varies. The friend wants to say the *knowledge itself* varies or doesn't exist. The legal analogy suggests the *warrant* varies, not the underlying reality. Therefore, the analogy cuts against the "no fact of the matter" conclusion.

