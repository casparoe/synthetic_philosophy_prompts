      *   *Wait, let's refine:* Does it survive in a *weakened form*? The friend might retreat to "No fact of the matter *accessible to us*." But the prompt says "no fact of the matter about whether my characters knew." If knowledge is factive, and the fact of the killing is stable, knowledge stability is tied to that.
