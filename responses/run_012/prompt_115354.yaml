answer: |-
  ### Table of Correspondences

  | Legal Domain | Epistemic Domain (Friend's View) |
  | :--- | :--- |
  | **Standard of Proof** | Epistemic Standard (e.g., certainty vs. probability) |
  | **Fact-Finder** | Knower / Knowledge Attributor |
  | **Fact Proved** | Proposition Known (*p*) |
  | **Stakes** | Practical Cost of Being Wrong |
  | **Authority** | Context / Conversational Context |
  | **Verdict's Finality** | Truth Conditions / "Fact of the Matter" |

  ### Where the Mapping Breaks

  The analogy holds structurally but fails ontologically. There are two substantive breaks that matter for your friend's argument, and one decorative break.

  1.  **Verdict vs. Reality (Substantive):** In law, a verdict is a *performative* declaration licensing state action; it is not identical to the historical event. An acquittal does not mean the defendant *did not do it*; it means the state cannot *punish* them. In your friend's epistemology, the "verdict" (knowledge attribution) is treated as constitutive of the *fact* of knowledge itself. The law preserves a gap between *proof* and *truth*; your friend collapses them.
  2.  **Action vs. Belief (Substantive):** Legal standards govern when an *institution may act* (imprison, fine). Epistemic standards allegedly govern when a subject *counts as knowing*. The legal analogy supports a norm on *action* (pragmatism), not necessarily a norm on *mental states* (epistemology).
  3.  **Codification (Decorative):** Legal standards are written statutes; epistemic standards are fluid conversational norms. This difference does not undermine the analogy, as both function as thresholds.

  ### Audit of Your Three Questions

  **1. Does the analogy support context-shift or stakes-internalism?**
  The legal analogy supports **stakes-internalism** (Pragmatic Encroachment), not pure Contextualism. In law, the standard changes because the *consequences* (liberty vs. assets) change, not because the word "guilty" changes its meaning. Your friend argues the *verb* shifts (Contextualism); the law suggests the *threshold for warrant* shifts based on stakes. This is a crucial distinction: the law implies the underlying reality is stable, but the cost of error dictates the required certainty.

  **2. Is this evidence for pragmatism rather than epistemology?**
  **Yes.** The standard of proof determines when the state is *licensed to act*, not what the defendant *actually did*. If you map this to knowledge, it suggests "knowing" is a license to *act or assert*, not a description of a metaphysical bond between mind and world. This supports a pragmatist thesis (knowledge is for doing) but undermines your friend's metaphysical conclusion (that there is no fact of the matter). It suggests the *norm* varies, not the *truth*.

  **3. Does your friend's conclusion survive?**
  **No.** Your untutored impression is philosophically robust. The legal system is predicated on **Realism**: there was one killing, regardless of the two verdicts. The variability of the verdict proves the variability of *human warrant*, not the variability of *fact*. Your friend uses the variability of the standard to argue for the non-existence of the fact ("no fact of the matter"). The law demonstrates the opposite: standards vary *precisely because* the fact is fixed and the stakes of getting it wrong differ. The analogy cuts against his anti-realism.

  ### The Fallback Linguistic Analogy

  The comparison to "flat," "tall," and "empty" carries **less** weight than the legal analogy and introduces new risks.

  *   **Gradability:** "Know" is not naturally gradable (we rarely say "very known" or "knowinger"), whereas "flat" is. This makes the linguistic intuition forced.
  *   **The Skeptical Trap:** As you noted, this analogy was historically used by Peter Unger to argue for **Error Theory**: since nothing is perfectly flat or empty, nothing is truly known. This leads to skepticism (knowledge applies to nothing), not your friend's desired relativism (knowledge applies relative to context).
  *   **Better Analogy:** A **Medical Diagnosis**. A doctor may diagnose a condition differently depending on whether the treatment is aspirin (low stakes) or chemotherapy (high stakes). The patient's physiology (the fact) remains fixed; the threshold for *certifying* the diagnosis shifts. This preserves the reality of the condition while validating the variability of the standard, supporting your view over your friend's.

  ### Confidence and Uncertainty

  I am **85% confident** in this analysis. The structural disanalogy between legal verdicts (performative/normative) and knowledge claims (descriptive/factive) is a standard objection in epistemology to legal analogies.

  The point on which I am **least sure** is the precise classification of your friend's view. Philosophers often blur "Contextualism" (meaning shifts) and "Pragmatic Encroachment" (stakes affect justification). If he retreats to Encroachment, the legal analogy supports his mechanism (stakes matter) but still refutes his conclusion (no fact of the matter).

  \answer{DOES-NOT-SURVIVE; Legal verdicts vary, but the law presupposes a fixed reality, contradicting the anti-realist conclusion.}
