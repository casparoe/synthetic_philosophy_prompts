answer: |-
  The structure you have identified is a well-recognized problem in meta-philosophy and the philosophy of language. The most precise established term for this specific shape of disagreement is a **Metalinguistic Disagreement** (often discussed under the framework of **Metalinguistic Negotiation**).

  In contemporary analytic philosophy, this concept has been rigorously developed by philosophers such as David Plunkett and Alexis Burgess. However, the rhetorical dimension you highlight (the claim that the other's usage is *harmful*) was classically identified by C.L. Stevenson as a **Persuasive Definition**.

  Here is the carving you requested: the identification of the concept, the comparison with nearby candidates, the name of the maneuver, and the necessary and sufficient conditions for the dispute type.

  ### 1. The Established Concept: Metalinguistic Disagreement

  A **Metalinguistic Disagreement** occurs when two parties agree on all the non-linguistic facts (the "world") but disagree on how to use a specific term to describe those facts, *because* the choice of term carries normative, practical, or conceptual consequences that they care about.

  In your example:
  *   **The Facts:** Both Mencius and Xunzi agree on the psychological and behavioral data (people need training, environments matter, etc.).
  *   **The Disagreement:** They disagree on whether the label "Nature" (*xing*) should be applied to the incipient moral sprouts (Mencius) or reserved strictly for the raw, untrained biological baseline (Xunzi).
  *   **Why it is not "Merely Verbal":** In a standard verbal dispute, once the parties realize they are using words differently, the disagreement dissolves ("Oh, you mean *bank* as in river, I meant *bank* as in finance; we agree on the facts."). In a metalinguistic disagreement, clarifying the definitions *reveals* the disagreement rather than dissolving it. The fight becomes: "Yes, I know you define 'nature' that way, but we *ought not* to define it that way because it leads to moral complacency."

  **Why this fits best:**
  It captures the specific "shape" you described: a standoff over classification where the stakes are not truth-conditional (who is right about the world?) but normative (which conceptual scheme serves our purposes best?).

  ### 2. Nearby Candidates and Why They Fall Short

  To ensure the carving is precise, we must distinguish this from three nearby concepts.

  **A. Merely Verbal Dispute**
  *   **Definition:** A misunderstanding where parties talk past each other.
  *   **Why it falls short:** In a merely verbal dispute, the parties are *willing* to dissolve the conflict upon disambiguation. They treat the word as a neutral vessel. In the Mencius/Xunzi case (and the virus case), the parties treat the word as a tool with agency. They resist disambiguation (e.g., "Let's call Mencius's view 'Nature-A' and Xunzi's 'Nature-B'") because accepting that move concedes that the term "Nature" is up for grabs, whereas each side believes their usage captures the *correct* normative reality.
  *   **The Test:** If you offer a neutral synonym and they stop fighting, it's verbal. If they say, "No, the word 'Nature' itself must be won," it's metalinguistic.

  **B. Empirical/Factual Disagreement**
  *   **Definition:** A dispute about the state of the world.
  *   **Why it falls short:** You noted that further empirical inquiry cannot settle this. No microscope will tell us if a virus is "alive" because "alive" is a category we impose, not a force we detect. Similarly, no scan of a newborn's brain will settle whether their tendencies count as "Nature" in the morally relevant sense.
  *   **The Test:** If new data could resolve it, it's empirical. If the data is already shared, it's not.

  **C. Deep Disagreement (Fogelin)**
  *   **Definition:** A disagreement where parties lack common argumentative ground (e.g., differing on logic, evidence standards, or worldviews).
  *   **Why it falls short:** While Mencius and Xunzi do have different worldviews, a "Deep Disagreement" usually implies a breakdown in the ability to argue at all. In a metalinguistic dispute, the parties can argue rationally; they just argue about *concepts* rather than *facts*. They share the ground of "what is useful/harmful," they just disagree on the application.
  *   **The Test:** If rational argument is impossible, it's deep. If they are arguing about the *utility* of a definition, it's metalinguistic.

  ### 3. The Maneuver: Persuasive Definition

  You asked for the name of the move where one party tries to settle the dispute by redefining the term rather than producing evidence.

  The classical term is **Persuasive Definition** (C.L. Stevenson, 1938).
  *   **Definition:** A definition that alters the descriptive meaning of a term while preserving (or harnessing) its emotive or normative weight to influence behavior.
  *   **In Context:** Xunzi is engaging in a persuasive definition when he insists "Nature" must mean "unlearned." He does this to strip the term of positive moral value, thereby forcing the conclusion that teachers are necessary. He is not trying to describe the world more accurately; he is trying to steer conduct.

  A more contemporary term for the constructive version of this maneuver is **Conceptual Engineering** (or specifically, **Ameliorative Inquiry**, per Sally Haslanger).
  *   **Definition:** The practice of assessing and improving our concepts to serve specific social or political ends.
  *   **Nuance:** "Conceptual Engineering" often sounds collaborative. When used as a weapon in a dispute to override an opponent's usage, it reverts to **Persuasive Definition** or **Stipulative Redefinition**.

  ### 4. The Carving: Necessary and Sufficient Conditions

  If you need to identify this structure in the wild, here are the boundaries. For a disagreement to be a **Metalinguistic Disagreement with Normative Stakes** (to give it its full descriptive weight), the following must be true:

  **Necessary Conditions (What must be present):**
  1.  **Factual Consensus:** Both parties agree on the non-linguistic properties of the object in question (e.g., the virus replicates but lacks metabolism; the child has compassion but needs training).
  2.  **Classification Conflict:** The disagreement is exclusively about whether a specific label/concept ($C$) applies to the object ($O$).
  3.  **Normative/Pragmatic Stakes:** The application of the label $C$ entails specific normative consequences, permissions, obligations, or attitudes (e.g., if viruses are "alive," we owe them moral consideration; if human nature is "good," we can trust spontaneity).
  4.  **Resistance to Disambiguation:** At least one party rejects the proposal to treat the term as ambiguous or to adopt neutral terminology. They insist that *this* word must carry *this* meaning.

  **Sufficient Conditions (What rules it in):**
  *   If 1–4 are met, the dispute is Metalinguistic. The truth of the matter is not "Is $O$ really $C$?" but "Is it better for our purposes to classify $O$ as $C$?"

  **Exclusion Criteria (What rules it out):**
  *   **Hidden Empirical Claim:** If one party believes the definition tracks a hidden natural kind (e.g., " 'Alive' tracks a specific metaphysical essence"), they may *think* it is factual. However, if no empirical test can verify the essence, it remains metalinguistic.
  *   **Pure Stipulation:** If a party says, "For the sake of this paper, I define X as Y," and has no stake in the term outside that context, it is a **Stipulative Definition**, not a Metalinguistic Disagreement. There must be a stake in the *general* usage of the term.
  *   **Emotive Only:** If the parties agree on the definition but disagree on the *value* of the thing (e.g., "We agree on what 'war' is, but war is good/bad"), that is a **Normative Disagreement**, not a Metalinguistic one. The fight must be over the *boundary of the concept*, not the value of the referent.

  ### Summary

  The structure is a **Metalinguistic Disagreement**.
  The rhetorical maneuver is a **Persuasive Definition**.
  The broader philosophical project of resolving such disputes is **Conceptual Ethics**.

  It differs from a **Merely Verbal Dispute** because the parties are not confused; they are fighting over which linguistic framework to adopt. It differs from a **Factual Dispute** because no amount of data will resolve which framework is "correct," only which is more useful or harmful.

  This explains why Mencius and Xunzi cannot simply "agree to disagree" on the definition: for them, the definition *is* the philosophy. To concede the word "Nature" is to concede the moral landscape.
