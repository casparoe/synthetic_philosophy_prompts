prompt: |-
  Next month I'm presenting a paper at our work-in-progress seminar and I'd rather prepare for the Q&A than just hope it goes well. My thesis is that personhood is a standing you hold rather than a property you have: relations of recognition are constitutive of the status itself, not merely causally necessary for the capacities, so a creature with all the right psychological capacities but no community holding it in the relevant way isnt a person in the full sense. I'm drawing on ubuntu — you become a person through other people — but I'm arguing it's a general claim about personhood and not a regional curiosity. I also split a floor from a ceiling: the floor is equal basic standing, binary, nobody is below it; the ceiling is thick personhood, earned through participation, comes in degrees, and can be lost. Two bits of the paper I expect to cause trouble. One, I lean on an island case — a human raised entirely alone, or the last survivor after a plague — and claim what's missing there isn't capacities, its uptake. Two, I argue from ordinary usage that "person" sometimes functions as an honorific in a way "human" never does.

  The audience is mostly analytic. Two Parfitians who think personal identity is psychological continuity and doesn't much matter. One Kantian working on dignity and respect who gets twitchy whenever personhood is described as gradable. One liberal political philosopher who thinks any graded status is a ladder to atrocity. A bioethics grad student who mainly wants to know what this does to capacity and consent. And an anthropologist who comes to these and is sceptical of "African philosophy" as a category at all.

  Give me the prep sheet: the objections this particular room will actually raise, in roughly the order they'll come, phrased the way each of those people would phrase it, each with a two-minute reply, a note on where the reply is soft, and what I should concede up front. Tell me which one I should actually be scared of, and which single reply has to land for the paper to survive. And include the question I'm hoping nobody asks.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the User's Request:**
      *   **Task:** Create a Q&A prep sheet for a work-in-progress seminar.
      *   **Thesis:** Personhood is a *standing* (status) held via relations of recognition, not a *property* (capacity). Relations are constitutive, not causal.
      *   **Key Distinction:** Floor (equal basic standing, binary) vs. Ceiling (thick personhood, earned, gradable, losable).
      *   **Key Arguments:** 1. Island Case (solitary human lacks uptake, therefore not full person). 2. Ordinary Usage ("person" as honorific vs. "human").
      *   **Philosophical Anchor:** Ubuntu (generalized).
      *   **Audience:**
          1.  Two Parfitians (Psychological Continuity, reductionist).
          2.  One Kantian (Dignity, respect, anti-gradable).
          3.  One Liberal Political Philosopher (Anti-graded status, fear of atrocity).
          4.  One Bioethics Grad Student (Capacity, consent).
          5.  One Anthropologist (Sceptic of "African Philosophy" category).
      *   **Deliverables:** Objections (phrased by persona), 2-minute replies, soft spots, concessions, "scariest" objection, "make-or-break" reply, and the "hope nobody asks" question.

  2.  **Deconstruct the Thesis & Vulnerabilities:**
      *   *Vulnerability 1 (Metaphysics):* If personhood is constitutive of recognition, does the solitary human cease to exist morally? Is this circular?
      *   *Vulnerability 2 (Normativity):* If personhood is gradable (ceiling), does this justify exclusion? (The Liberal/Kantian worry).
      *   *Vulnerability 3 (Semantics):* Is "person" actually used as an honorific, or is the user conflating moral praise with ontological status?
      *   *Vulnerability 4 (Cultural):* Is appropriating Ubuntu for analytic metaphysics legitimate or extractive?
      *   *Vulnerability 5 (Practical):* How does this affect rights/consent if status is lost?

  3.  **Drafting the Objections (Persona by Persona):**

      *   **The Parfitians:** They care about identity and what matters. They'll ask: "Why does the *label* matter if the psychology is there?"
          *   *Objection:* If the islander has memories and intentions, why does the *social tag* change what matters in survival or ethics?
          *   *Reply:* It changes the *normative landscape*, not the psychological facts.
          *   *Soft Spot:* Explaining *why* the label matters practically.

      *   **The Kantian:** Hates "gradable dignity."
          *   *Objection:* Dignity is intrinsic. If you make the 'ceiling' gradable, you violate the categorical imperative.
          *   *Reply:* Distinguish Floor (Dignity) from Ceiling (Virtue/Role).
          *   *Soft Spot:* Keeping the Floor secure enough.

      *   **The Liberal Political Philosopher:** Fears hierarchy leading to atrocity.
          *   *Objection:* Graded personhood is the logic of slavery/colonialism. Even a "ceiling" creates a "below."
          *   *Reply:* The Floor is inviolable. The Ceiling is about social role, not rights.
          *   *Soft Spot:* The slippery slope is real.

      *   **The Bioethicist:** Practical application.
          *   *Objection:* If personhood is lost/gradable, can I consent? Who decides?
          *   *Reply:* Consent relies on the Floor (capacity), not the Ceiling (status).
          *   *Soft Spot:* If status affects standing, it might affect weight of testimony.

      *   **The Anthropologist:** Category critique.
          *   *Objection:* "Ubuntu" isn't a metaphysical theory for analytic export. You're essentializing.
          *   *Reply:* I'm using the structural insight, not claiming ethnographic authority.
          *   *Soft Spot:* Risk of appropriation.

  4.  **Selecting the "Scariest" and "Make-or-Break":**
      *   *Scariest:* The Liberal/Kantian coalition. If the graded status implies unequal rights, the paper is ethically dead in the water. Let's pick the Liberal's "Ladder to Atrocity" as the scariest because it attacks the *political viability* of the theory.
      *   *Make-or-Break:* The distinction between Floor and Ceiling. If this collapses, the Kantian and Liberal eat you alive. You must prove the Floor is secure.

  5.  **The "Hope Nobody Asks" Question:**
      *   What's the fatal flaw? It's the *mechanism of recognition*. Who grants the status? If it's the community, what happens to the dissident? If it's objective, how is it relational?
      *   *Better:* The "Last Man" implication. If the last human survives, are they *no longer a person*? That sounds absurd.
      *   *Best:* The "Who Decides?" question regarding the Ceiling. If I can lose personhood, who takes it away?

  6.  **Refining the Content (Iterative Polish):**
      *   *Tone:* Professional, strategic, slightly cynical (seminar room realism).
      *   *Formatting:* Clear headings, bullet points for readability.
      *   *Check:* Did I hit all 5 audience members? Yes. Did I address the Island Case and Honorific argument? Yes.

  7.  **Final Review against Constraints:**
      *   Two-minute replies (need to be concise).
      *   Note on soft spots.
      *   Concessions.
      *   Specific personas.

      *(Self-Correction during drafting)*: Make sure the Parfitian objection isn't just about identity, but about *what matters*. Parfit says identity doesn't matter, survival does. The user says personhood matters. There's a tension there.
      *(Self-Correction on Anthropologist)*: Don't make them sound hostile, just methodologically sceptical.
