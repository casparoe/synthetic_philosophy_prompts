      *   *The Exclusion:* Left-handed people smudge more (if ink is on left). Or, the table is high (standing only). Let's go with **The Folding Constraint + The Drying Time.**
      *   *Better Exclusion:* The slot is at a height that requires standing. One student is asked to remain seated (simulated injury/role). They physically cannot reach.
      *   *Better Reverse Adaptation:* The box has a counter on the front. It only counts if the paper slides smoothly. Students realize the *content* doesn't matter, only the *friction*. They stop writing words and start sanding the paper edges.

      *Let's settle on: **The "Compliance Chute."***
      *   **Goal:** Submit a "Request" to get a "Permit" (stamp).
      *   **Artifact:** A chute that only accepts paper folded into a specific triangle. A stamp pad that is nearly dry (requires hard pressure).
      *   **Inscription:** The folding requires fine motor skills. The pressure requires hand strength.
      *   **Reverse Adaptation:** The class realizes the Permit is worthless unless they get 10 of them. They stop writing Requests and start mass-folding blank paper to game the counter.

      *Wait, I need to ensure the "Politics of Artifacts" lands.*
      *   Winner's argument is that things *embody* authority.
      *   Let's make the artifact a **Seating Arrangement + A Single Microphone (Analog version: A Talking Stick that is heavy/awkward).**
      *   No, let's stick to the **Queue/Form** idea as it mirrors the attendance system trigger.
      *   **Activity:** "The Attendance Audit."
      *   **Scenario:** You are trying to verify your presence to get credit.
      *   **Artifact:** A single clipboard with a chain attached to the wall. One pen (tethered).
      *   **Constraint:** The chain is short. Only one person can access it. The pen is heavy.
      *   **Inscription:** The form asks for "Official ID Number." Some students are given role cards that say "Visiting Scholar (No ID)." They are physically unable to complete the form correctly.
      *   **Reverse Adaptation:** The line gets long. The class period is ending. The goal shifts from "Verifying Attendance" to "Managing the Line." The students start organizing the queue rather than signing in. The *queue* becomes the class activity.

      *Okay, this is strong. Let's refine the "Reverse Adaptation" to be more about the tool reshaping the goal.*
      *   If the tool is the Clipboard/Chain.
      *   Goal: Sign in.
      *   Constraint: The pen runs out of ink quickly.
      *   Adaptation: Students stop trying to sign their names and start drawing symbols that use less ink. The goal becomes "Marking the paper," not "Signing."
      *   *Even better:* The clipboard has a mechanical counter. It only clicks if you press hard.
      *   Goal: Get the counter to 16 (everyone signed).
      *   Adaptation: Students realize pressing hard hurts. They find a rock to press the button. Then they realize they can just shake the clipboard to make it click. The goal becomes "Making the noise," not "Being present."

      *Let's go with **The "Validation Tunnel."***
      *   **Materials:** A cardboard box with a hole. Inside is a bell. To ring the bell, you must drop a ball through.
      *   **Constraint:** The hole is shaped (e.g., star-shaped). The balls are round. You must wrap the ball in paper to make it fit the shape? No, that's complex.
      *   **Let's go back to the Form/Queue.** It's the most relatable to the attendance system.
      *   **Activity:** **The Bureaucratic Chokepoint.**
      *   **Artifact:** A "Submission Slot" (box with a slit). A "Form" (paper). A "Stamp."
      *   **Inscription:** The slot is narrow. The form is wide. You must fold it. The table is high (standing).
      *   **Reverse Adaptation:** The Stamp is heavy and messy. Students stop caring about the Form content and start caring about cleaning the Stamp.
      *   *No, let's make it about Time.*
