prompt: |-
  I sit on a campus committee that has just approved an automated attendance system, and the experience has made me want to teach the politics of artifacts in a way students feel rather than recite. I run a 90-minute session for about 16 upper-level undergraduates in a philosophy of technology course. Design a classroom activity that makes them feel the force of the claim that artifacts have politics, but not through the well-worn bridge example, and keep the artifact low-tech—a door, a queue, a form—so the politics is in the arrangement, not the electronics. Build it around two ideas I want them to encounter as lived constraints rather than labels: that a design can inscribe a political settlement into ordinary use, and that a tool can undergo what I can only call reverse adaptation, where the ends it was meant to serve get reshaped to fit the tool. The activity should move from a design choice that quietly excludes some participants, to a use that unexpectedly redistributes power, to a moment where the artifact starts dictating the group's goals. Include roles, materials, a scoring or payoff scheme that doesn't need real money, a timeline, and a debrief that maps what happened onto those two ideas. Also tell me what will predictably go wrong the first time I run it, and be frank about which feature of the idea the activity cannot reproduce and that I will have to supply in discussion.
reasoning: |-
  Here's a thinking process that leads to the suggested classroom activity:

  1.  **Analyze the Request:**
      *   **Context:** Campus committee approved an automated attendance system (trigger event). Instructor wants to teach "politics of artifacts" (Langdon Winner style) but avoid clichés (like the Robert Moses bridge example).
      *   **Audience:** 16 upper-level undergraduates, Philosophy of Technology course.
      *   **Duration:** 90 minutes.
      *   **Core Concepts to Convey (as *lived constraints*, not labels):**
          1.  *Inscription:* Design inscribes a political settlement into ordinary use (exclusion/inclusion).
          2.  *Reverse Adaptation:* The tool reshapes the ends it was meant to serve (means become ends).
      *   **Constraints:** Low-tech artifact (door, queue, form, etc.). No electronics.
      *   **Activity Arc:**
          1.  Design choice quietly excludes.
          2.  Use unexpectedly redistributes power.
          3.  Artifact starts dictating goals.
      *   **Requirements:** Roles, materials, scoring/payoff (non-monetary), timeline, debrief mapping to concepts, prediction of failure, limitation admission.

  2.  **Deconstruct the Core Concepts for an Activity:**
      *   *Inscription/Exclusion:* Needs a physical barrier or rule embedded in an object that favors one body type, ability, or social status over another without explicitly stating it.
      *   *Reverse Adaptation:* The group needs to start with a goal (e.g., "get through," "build something"), but the mechanics of the artifact make achieving *that* goal impossible or inefficient, so they shift their goal to "satisfy the artifact" instead.
      *   *Low-Tech:* Paper, chairs, tape, string, a specific room layout. Let's go with a **Queue/Checkpoint System** using paper forms and physical barriers. It mirrors the attendance system trigger but remains analog.

  3.  **Drafting the Activity Concept: "The Gatekeeper's Ledger"**
      *   *Scenario:* The class needs to "exit" the room to get credit (or points) for the session.
