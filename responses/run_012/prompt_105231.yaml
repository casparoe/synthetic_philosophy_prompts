      *   **Roles:** Submitters (14), Gatekeeper (1), Observer (1).
      *   **Payoff:** "Credits" needed to "graduate" the session.
      *   **Timeline:**
          *   0-15: Brief & Setup.
          *   15-45: Phase 1 (The Rush) - Exclusion happens.
          *   45-65: Phase 2 (The Brokerage) - Power redistribution.
          *   65-80: Phase 3 (The Pivot) - Reverse adaptation.
          *   80-90: Debrief.

  5.  **Fleshing out the Mechanics:**
      *   *The Artifact:* A "Validation Box." It has a slot that is 2 inches wide. The paper provided is 8.5 inches wide. It *must* be folded to fit.
