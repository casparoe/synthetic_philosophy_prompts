      *   *Setup:* Arrange desks to create a single narrow path. At the end, a "Validator" sits.
      *   *Artifact:* A physical token (a specific shape of paper) that must be carried through.
      *   *Problem:* The prompt asks for *reverse adaptation* where the tool reshapes the ends.
      *   *Revised Idea:* **The Resource Transport Challenge.**
      *   *Goal:* Move "resources" (balls, blocks, or paper wads) from Side A to Side B.
      *   *Artifact:* A specific container or chute that is awkward.
      *   *Twist:* The container dictates *how* resources are moved, eventually making the transport the goal, not the destination.

      *Let's try to align closer to the "Attendance System" trigger.* A **Sign-In Sheet** activity.
