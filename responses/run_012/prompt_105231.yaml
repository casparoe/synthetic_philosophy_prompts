      *Refining for "Reverse Adaptation":* The goal is to "Pass the Class." To pass, you need 5 points. Points are awarded by the "System" (a box with a slot). You submit forms. The forms have rigid requirements. Eventually, students write nonsense just to fit the form, ignoring the actual intellectual content.
      *   *Let's go with a physical constraint:* **The Narrow Door & The Tall Table.**
      *   *Actually, let's look at the "Queue" idea.* Queues are political.
      *   *Activity:* **The Merit Queue.**
      *   *Setup:* Students want to submit a "Proposal" to get "Funding" (points).
      *   *Artifact:* A physical rope barrier creating a serpentine line. A single submission slot.
      *   *Inscription:* The slot is high up (excludes shorter/seated). The form requires two hands to hold while writing (excludes those holding something else).
      *   *Reverse Adaptation:* The line moves so slowly that students start helping each other fill forms *in the line* rather than discussing the proposal content. The goal becomes "getting in line" rather than "having a good proposal."
      *   *Wait, I need the artifact to dictate the goal.*
      *   *Idea:* **The Tally Counter.**
      *   *Goal:* Maximize "Class Engagement."
      *   *Artifact:* A manual clicker counter.
      *   *Rule:* Every time someone speaks, the "Monitor" clicks. If the counter reaches 50 by the end, everyone gets bonus points.
      *   *Inscription:* The Monitor decides what counts as a "clickable" utterance (excludes murmurs, side conversations).
      *   *Reverse Adaptation:* Students stop having a discussion and start making short, click-worthy noises. The *count* becomes the goal, not the *discussion*.
