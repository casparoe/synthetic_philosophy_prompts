      *   *Phase 3:* Timer runs low. Students realize the Gatekeeper isn't reading the forms. They start submitting blank folded paper.
      *   *Debrief:* Connect to Winner.

      *Wait, I need to make sure the "Reverse Adaptation" is clear.*
      *   If they submit blank paper, that's gaming.
      *   Reverse Adaptation is when the *tool reshapes the ends*.
      *   If the tool requires folding, and they start valuing *folding skill* over *writing skill*, that's it.
      *   Let's make the "Validation" depend on the *fold*.
