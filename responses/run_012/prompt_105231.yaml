      *   **Setup:** A physical barrier (ropes/chairs). One gap.
      *   **Artifact:** A sand timer (2 minutes).
      *   **Rule:** Only one person can pass while the sand runs.
      *   **Inscription:** The gap is narrow. Backpacks must be removed. (Excludes those with medical bags or mobility aids that can't be removed).
      *   **Reverse Adaptation:** The goal was to "Exit the room." The timer makes exiting slow. Students start using the waiting time to hold meetings. The "Waiting Area" becomes the classroom. The Turnstile dictates that *waiting* is the primary activity.

      *Okay, I have a winner. **The "Credential Chute."***
      *   It mirrors the attendance system.
      *   It uses low tech (paper, box, slot).
      *   It has clear exclusion (design of slot/form).
      *   It has clear reverse adaptation (gaming the chute vs. content).

      *Refining the "Reverse Adaptation":*
      *   The Chute only accepts paper of a specific weight.
      *   Students are given flimsy paper.
      *   They must layer it to make it stiff enough to slide.
      *   They run out of "content" paper and start layering blank scraps.
      *   The goal shifts from "Submitting an Argument" to "Engineering a Stiff Sheet."

  6.  **Addressing the Specific Requirements:**
      *   **Roles:** Submitters, Gatekeeper (controls the box), Observers.
      *   **Materials:** Cardboard box, slit, specific paper, pens, timer.
      *   **Scoring:** "Credits" for successful submission.
      *   **Timeline:** 90 mins broken down.
      *   **Debrief:** Map to Inscription and Reverse Adaptation.
