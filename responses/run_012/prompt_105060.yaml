answer: |-
  Consider two identical suburban cul-de-sacs built by the same developer in the same year, differing only in the curb design at the driveway crossings. In the first, the curb is a standard six-inch vertical drop, engineered for water drainage and cost efficiency using existing municipal molds. In the second, the curb is flush with the road, sloped gently to meet the asphalt. No laws mandate either, no residents requested specific types, and the choice wasn't made to help or hinder anyone specifically—it was simply a matter of which paving crew's default specification sheet was pulled from the filing cabinet. Yet, the first street silently dictates that moving through the neighborhood on wheels (whether a wheelchair, stroller, or bicycle) is a secondary, difficult activity requiring extra effort or assistance, while the second treats wheeled movement as equal to walking. The politics here isn't about who built it or what society is required, but about which bodies the street assumes are normal.

  **What each view says:**
  *   **The Neutral Tool View:** The curb is just concrete; it has no politics until someone tries to cross it. If a wheelchair user struggles, that is a limitation of the user or the wheelchair, not the street.
  *   **The "Politics by Design" View:** Unless the engineer explicitly intended to exclude disabled people, there is no politics here, only bureaucratic inertia or cost-cutting.
  *   **The "Third Thing" (Material Mediation):** The artifact itself enforces a hierarchy of bodies regardless of intent; by making one mode of travel physically difficult and another easy, the object legislates behavior without a law, embedding a norm of "who belongs" into the landscape.

  **The specific feature doing the work:**
  The vertical discontinuity at the crossing point that converts a continuous path into a barrier requiring specific physical capital to overcome.

  **What happens if you tweak that feature:**
  If you flatten the curb, the exclusionary politics evaporates for the user, but it moves to the maintenance level—now the city must ensure snow plows and drainage don't recreate the barrier, shifting the political burden from the individual's strength to the municipality's upkeep.

  **The strongest neutralist pushback and whether it survives:**
  A neutralist would argue that "difficulty" is subjective and universal—everyone faces friction somewhere, so calling this "political" dilutes the word until it means nothing. This pushback fails because the friction isn't random; it systematically aligns with existing social categories (abled vs. disabled), meaning the artifact amplifies specific social inequalities rather than just presenting generic physical challenges.

  **Honesty check on separating the views:**
  I have to admit this case doesn't fully separate the "Third Thing" from the "Politics by Design" view if you dig deep enough. A critic can always argue that choosing the "standard mold" *was* a political choice to prioritize cost and tradition over inclusion, effectively collapsing the "unintended" outcome back into "negligence as intent." The "Third Thing" only remains distinct if you accept that technical norms (like drainage specs) can have political consequences that genuinely exceed the designer's moral horizon, but in practice, View 2 often swallows View 3 by claiming ignorance is itself a political stance.
