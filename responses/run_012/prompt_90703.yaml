answer: |-
  **The Function of Chaos: A Philosophical Autopsy of *Jurassic Park***

  To engage *Jurassic Park* as a text in the philosophy of biology is to recognize that the film is not merely about monsters escaping containment; it is about the categorization of life itself. The central tension of the narrative mirrors the standoff between the two dominant accounts of biological function: the Selected-Effects (SE) tradition, associated with Wright, Millikan, and Neander, and the Causal-Role (CR) tradition, stemming from Cummins. The former grounds function in evolutionary history—$X$ has the function $Y$ only if $X$ exists because ancestors of $X$ did $Y$ and were selected for it. The latter grounds function in current systemic contribution—$X$ has the function $Y$ relative to a containing system $S$ if $X$ contributes causally to $S$'s capacity $Z$.

  The substantive disagreement lies in normativity and history. For the SE theorist, a trait without a selection history lacks a "proper function"; it may have effects, but it has no teleological norm against which malfunction can be measured, save for the intentions of a designer. For the CR theorist, history is irrelevant; functions are ascribed relative to the analytical system chosen. A heart pumps blood because that is its causal role in the circulatory system, regardless of whether that heart evolved or was assembled in a lab. The verbal disagreement often concerns what we mean by "function"—SE theorists often accuse CR accounts of merely describing capacities, while CR theorists accuse SE accounts of conflating the origin of a trait with its current utility.

  *Jurassic Park* forces these abstractions into high relief because its subjects are ontological hybrids. The dinosaurs are assembled from reconstructed genomes with gaps filled by amphibian DNA. They are artifacts of InGen, deliberately rendered female to prevent reproduction. On a strict SE account, these creatures possess no biological proper functions. Their hearts do not function to pump blood in the biological sense; they function to circulate fluids because a designer intended them to survive long enough for display. Their dispositions are artifact functions fixed by Hammond's engineers. On a CR account, however, the T-Rex's jaw functions to crush bone relative to the organism's survival system, regardless of its origin. The film's central reveal—that the animals are breeding due to the frog DNA—serves as the stress test for these accounts. The narrative presupposes a muddled hybrid of the two, ultimately relying on a vitalist intuition that neither theory can fully endorse, yet it exposes the ethical dangers of treating living systems as mere artifacts.

  The film begins by firmly establishing the dinosaurs as artifacts within a designed system. The Park is a containment system whose designed function is entertainment and profit, reliant on the sub-function of safety. Within this Park-system, the dinosaurs are components. Their causal role is to be viewed, not to view; to be contained, not to hunt. When the park's systems analyze the animals, they do so through the lens of CR functions relative to the Park's goals. The motion sensors, the electric fences, and the counting software are all mechanisms to ensure the dinosaurs contribute to the capacity of "secure exhibition." When a Triceratops falls ill, the park veterinarians treat it not because the animal has a proper function to be healthy, but because a sick exhibit undermines the Park's function of display.

  However, the film visually and narratively undermines this artifact status from the outset. We see the animals behaving in ways that align with species-typical functions derived from a history they do not possess. The Velociraptors hunt cooperatively; the T-Rex pursues moving vehicles based on visual acuity. Here, the film sides intuitively with the CR account. The narrative treats the predators' capacities as genuine biological functions relative to their own physiological systems, not merely as programmed behaviors relative to the Park. If the film adhered strictly to the SE account, the T-Rex's attack on the tour vehicles would be a malfunction of its design (it was designed to stay in the paddock) and nothing more. But the film frames the attack as the realization of the animal's nature. The tension arises because the characters speak the language of SE constraints (worrying about lineage and reproduction) while the camera observes CR realities (the animals acting according to their causal organization).

  This dissonance culminates in the revelation of the nesting ground. Arnold and Wu operate under an SE assumption: without a history of reproduction, there can be no reproductive function. They engineered the population to be all female, believing this breaks the selection lineage. Therefore, on their view, the animals cannot have the proper function of breeding. Malcolm, channeling a sort of folk-biological realism, suggests that the frog DNA allows for sex-switching, restoring a biological capacity. When the proof is found, the film treats this not merely as a system failure, but as a restoration of proper function. This is where the film muddles the accounts. It suggests that the "proper function" of the dinosaur was waiting to be unlocked, implying that the SE history was somehow latent or that the CR capacity *is* the proper function.

  Strictly speaking, once the dinosaurs begin to breed, a new selection lineage begins. From that moment forward, an SE account could grant them proper functions. But the film treats the *potential* to breed as inherent to the animals even before the lineage was re-established. This implies that the causal role (the capacity to reproduce given the right genetic conditions) was sufficient for the function all along, which is a CR position disguised as SE language. The film wants to have it both ways: it wants the dinosaurs to be artifacts (to blame Hammond for playing God) and genuine organisms (to blame nature for fighting back). This equivocation allows the plot to proceed, but it hides a philosophical contradiction. If they are genuine organisms with biological functions from the start, Hammond is less a creator and more a discoverer. If they are artifacts, their breeding is not "nature finding a way" but merely a complex machine operating outside its parameters.

  This ambiguity extends to the second level of analysis: the conflict between the Park as a designed system and the Island as an emergent ecosystem. A single event, such as the T-Rex bringing down a Gallimimus, must be evaluated differently depending on the containing system. Relative to the Park-system, this predation is a catastrophic malfunction. The fence failed; the containment protocol failed; the component (T-Rex) is not contributing to the capacity of "safe tourism." Relative to the emerging Ecosystem-system, however, the predation is a paradigmatic function. It contributes to energy flow, population control, and the survival of the predator.

  The film registers this conflict vividly, particularly in the sequence where the power is shut down. The shutting down of the fences is a malfunction for the Park but a necessary condition for the Ecosystem to function. The film's sympathies clearly lie with the Ecosystem. We are invited to cheer for the T-Rex when it saves the protagonists from the Raptors, not because the T-Rex serves the Park's function, but because it serves its own functional logic within the immediate environment. The film wants the animals to be the "genuine article," possessing species-typical functions—a fact about what a raptor's claw is for—despite their lack of evolutionary history.

  Is this commitment compatible with the function accounts? For the CR theorist, yes. The claw functions to grasp and tear relative to the Raptor's predatory system, regardless of how the Raptor came to be. For the SE theorist, this is problematic. Without a history of selection, the claw has no *proper* function, only a causal role. The film's insistence that the animals are "real" suggests a commitment to the idea that causal roles in a self-maintaining system are sufficient for biological reality, even if the strict etiological history is missing. The film argues, effectively, that once the system becomes self-maintaining (i.e., the animals start breeding), the distinction collapses. The moment the lineage restarts, the SE condition is met retroactively in the eyes of the narrative. The film treats the break-out not as the destruction of the Park, but as the birth of the Ecosystem. The malfunction of the artifact is the function of the organism.

  However, we must be honest where this reading strains. The film's rhetoric, particularly through the character of Malcolm, leans heavily into teleological vitalism. The claim that "life finds a way" suggests an intrinsic, forward-looking goal-directedness inherent in living matter. Neither SE nor CR accounts endorse this. SE is backward-looking; selection has no foresight. CR is analytical; functions are ascribed by observers relative to systems, not inherent powers that push against containment. The film presents "Life" as an agent with a function of its own—to expand, to survive, to refuse containment. This is a confusion the film is guilty of, but it is a productive confusion.

  The vitalist rhetoric is a placeholder for a insight that standard function accounts often miss: the instability of system boundaries. In the CR account, functions are relative to the system you choose to analyze. The film dramatizes the violence that occurs when the containing system shifts. The Park engineers analyzed the dinosaurs relative to the Park system. They ignored the fact that the dinosaurs also constitute a system relative to themselves. When the Park system degraded (the storm, the sabotage), the causal roles of the animals shifted to serve their own self-maintenance rather than the Park's containment. Malcolm's "life finds a way" is a poetic way of saying that the causal roles of biological components are robust and will reorganize to sustain the organism even when the containing artifact-system fails. The film mistakes this systemic resilience for intrinsic teleology. It is not that life *wants* to break out; it is that the causal roles that constitute the life of the dinosaur are incompatible with the causal roles required by the Park.

  The film contributes something to the debate that abstract argumentation often lacks: the normative stakes of function ascriptions. In the philosophy of biology, the debate between SE and CR is often treated as a dispute about truth conditions or explanatory power. *Jurassic Park* illustrates that it is also a dispute about authority and control. To assign an SE function based on designer intent (Hammond's view) is to claim ownership over the organism. It renders the animal an artifact, subject to the norms of the engineer. To assign a CR function based on the organism's own systemic capacity (Malcolm's view) is to acknowledge the organism's autonomy.

  The horror of the film arises from the collision of these two normative frameworks. When the Park functions as intended, the SE account dominates: the animals are exhibits. When the Park fails, the CR account dominates: the animals are predators. The tragedy is that the engineers tried to enforce the SE account on entities that were physically constituted to satisfy the CR account of a wild ecosystem. They treated causal capacities as artifact functions. They assumed that because they designed the genome, they fixed the functions. The film demonstrates that while you can design the hardware, you cannot fix the functional analysis if the system becomes self-sustaining.

  Furthermore, the film highlights the danger of the "system-relative" nature of CR functions. If function is relative to the system, one can manipulate the moral status of an action by shifting the system boundary. InGen justifies the containment by analyzing function relative to the Park (safety). The dinosaurs justify the predation by analyzing function relative to the Ecosystem (survival). The film forces the audience to recognize that the Ecosystem analysis is the more robust one, precisely because the Park system is fragile and dependent on external power, whereas the Ecosystem system is self-repairing. The film argues that the "correct" system for functional analysis is the one that is causally closed and self-maintaining. Since the Park requires constant human intervention to maintain its function, while the dinosaurs require only biological input, the film suggests that biological proper functions (or their CR equivalents) trump artifact functions when the two come into conflict.

  In conclusion, *Jurassic Park* does not resolve the debate between Selected-Effects and Causal-Role accounts, but it dramatizes the consequences of choosing one over the other in a bio-engineering context. The film presupposes a CR ontology—it treats the animals as having genuine biological capacities from the start—while using SE language to describe the failure of containment (the breeding is a violation of the design). It muddles the distinction to create narrative tension, suggesting that biological functions are latent properties waiting to be expressed, which is a vitalist confusion. However, this confusion points toward a genuine philosophical insight regarding system boundaries. The film contributes the observation that function ascriptions are not merely descriptive; they are political. To define the function of the dinosaur as "entertainment" is an act of domination; to define it as "predation" is an act of recognition. The film suggests that when the causal reality of the organism (CR) diverges from the intended design of the creator (SE), the causal reality will eventually dismantle the design. "Life finds a way" is scientifically imprecise, but it captures the resilience of causal roles that sustain self-maintaining systems against those that do not. The film thus serves as a cautionary tale for the philosopher of biology: be careful which system you choose when ascribing function, because the world may not respect your boundary.
