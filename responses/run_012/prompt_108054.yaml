      *   **Tone:** Honest, rigorous, faithful to Jain philosophy (don't smooth it over), critical of the Rationalist toolkit where appropriate.

  2.  **Deconstruct the Jain Concepts:**
      *   *Anekāntavāda:* Many-sidedness of reality. Truth is complex.
