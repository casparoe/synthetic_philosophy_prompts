  2.  **Deconstruct Marta's Stated Theory (Tolstoyan):**
      *   *Definition of Art:* Maker feels a feeling -> Transmits via outward signs -> Audience infected by that feeling.
      *   *Criteria for Quality (Artistic Merit):*
          1.  Individuality (Uniqueness of feeling).
          2.  Clarity (How well it transmits).
          3.  Sincerity (Did the maker feel it?).
      *   *Criteria for Value (Moral/Religious):* Does it unite people (good) or divide them (bad)?
      *   *Key Distinction:* Something can be Art but Bad (poison). Something can be Non-Art (Counterfeit).

  3.  **Analyze Marta's Past Rulings (The Data Set):**
      *   *Case 1 (Hauling Song):* Anonymous, communal. **Verdict:** Art, First Rate. *Why?* Sincere, clear transmission among crew, unites them.
      *   *Case 2 (Virtuoso Showpiece):* Technically proficient, makes people weep. **Verdict:** Not Art (Counterfeit). *Why?* Composer felt nothing. Tears are reflex, not infection.
