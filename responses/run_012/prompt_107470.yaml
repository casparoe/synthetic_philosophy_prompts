      *   Econ: "concave vs convex," "endogeneity."
      *   Health: "behavioral fatigue," "implementation science."

      *Let's write it.*
answer: |-
  # QUESTION-PERIOD PREPARATION SHEET
  **Paper:** The Declining Marginal Authority of Social Regulation
  **Time Budget:** 25 Minutes (Approx. 4 mins per exchange)
  **Strategy:** Defend the *mechanism* (Capital/Yield), concede the *scope* (Guidance/Justice).

  ## PRIORITY OBJECTIONS (Ordered by Damage)

  ### 1. The Behavioral Economist: Functional Form & Habit Formation
  **The Objection:** "You model Compliance Capital as a depletable stock, implying a concave utility function where marginal cost rises. But behavioral literature suggests compliance is habit-forming. If adherence is a muscle, it appreciates with use, implying a convex function where marginal cost *falls*. If you have the functional form wrong, your 'Declining Marginal Authority' claim collapses. How do you identify the depreciation rate separately from the learning effect?"
  **The Reply (2 mins):** "I distinguish between *procedural habit* (knowing how to comply) and *normative willingness* (accepting the burden). Habits reduce the cognitive cost of specific rules, but proliferating rules increases the *resentment cost* of authority itself. My claim is that while skill appreciates, political patience depreciates. The trade-off isn't about ability; it's about legitimacy saturation. I am arguing that the *marginal demand on authority* rises even if the *marginal effort of compliance* falls."
  **Soft Spot:** You lack longitudinal data to separate resentment from fatigue empirically.
  **Status:** **CRITICAL.** This is the reply the paper's survival depends on. If compliance is purely habit-forming, your central thesis is inverted.

  ### 2. The Cultural Psychologists: Construct Redundancy
  **The Objection:** "This sounds like a relabelling of 'Cultural Tightness-Looseness' (Gelfand et al.). They already measure latitude in conduct. What is the discriminant validity of 'Compliance Capital' over 'Tightness'? Does your construct predict variance in enforcement outcomes that Tightness scores do not? If not, this is just a story attached to an existing factor."
  **The Reply (2 mins):** "Tightness describes the *strength* of existing norms; Compliance Capital describes the *capacity* to adopt *new* ones. A tight society may have high norm strength but zero capital left for new regulation (e.g., a rigid society that collapses when faced with a novel crisis). Tightness is static; Capital is dynamic. My model predicts failure points in regulatory expansion that Tightness scores, being cross-sectional, miss."
  **Soft Spot:** You currently use cross-national rule counts as a proxy, which correlates highly with Tightness measures.
  **Status:** **High Damage.** Must show this is a dynamic model, not a static label.

  ### 3. The Methodological Critic: Metaphor vs. Mechanism
  **The Objection:** "You concede Compliance Capital is measured only indirectly. If you infer the stock from the very compliance behavior it is supposed to explain, aren't you risking circularity? Is 'Capital' a latent variable with indicators, or is it a metaphor doing the work of an argument? Without a direct measure, this is a just-so story."
  **The Reply (2 mins):** "It is a latent variable, not merely a metaphor. In economics, 'expectations' are unobservable but modeled via proxies. I propose using the *gap* between statutory rule counts and self-reported compliance as the indicator. When the gap widens despite high monitoring costs, we infer capital depletion. It is falsifiable: if we see high rule counts and high compliance with low monitoring, the model fails."
  **Soft Spot:** The "gap" measure is noisy and culturally confounded.
  **Status:** **High Damage.** If this is just a metaphor, the paper is philosophical, not empirical.

  ### 4. The Legal Philosopher: Legitimacy vs. Resource
  **The Objection:** "You treat authority as a fuel tank to be managed, not a normative status. If a rule is legitimately enacted by a just authority, the subject has an obligation to comply regardless of the 'cost' to their willingness. Are you arguing that unjust societies are more stable, or that legitimate authority is bounded by sociological fatigue? You seem to reduce obligation to capacity."
  **The Reply (2 mins):** "I am describing the *efficacy* of regulation, not its *moral bindingness*. A rule can be morally obligatory and sociologically impossible. My claim is that a state ignoring Compliance Capital will fail to secure the goods that justify its authority in the first place. Legitimacy grants the right to rule; Capital determines the ability to govern. You need both."
  **Soft Spot:** Blurs the is/ought distinction; risks implying we should lower demands to match capacity rather than raise capacity to meet demands.
  **Status:** **Medium Damage.** Concede the descriptive limit to protect the normative claim.

  ### 5. The Public Health Official: Emergency Guidance
  **The Objection:** "During a pandemic, we issue guidance before we have enforcement mechanisms. Your 'Substitution Thesis' suggests we shouldn't demand rules we can't enforce. Does this mean we should have remained silent until police could monitor mask-wearing? Your model seems to argue against the necessary lag between risk communication and enforcement infrastructure."
  **The Reply (2 mins):** "I distinguish between *guidance* (informational) and *regulation* (binding). My thesis applies to binding demands that incur a compliance cost. Guidance builds Capital if it proves useful; it depletes Capital if it is contradictory or ignored. The error isn't issuing guidance; it's issuing guidance that functions as a rule without the enforcement yield to back it. Don't call it a rule if you can't police it."
  **Soft Spot:** In practice, the public treats official guidance as binding rules regardless of your distinction.
  **Status:** **Concede in Talk.** (See Strategy Note below).

  ### 6. The Philosopher/Psych Overlap: Content Quality
  **The Objection:** "You focus on the *quantity* of rules. But surely a single unjust rule depletes Capital faster than ten just ones. Isn't the 'Declining Marginal Authority' actually a function of perceived justice, not rule count? If so, your quantity focus is a distraction from the quality of governance."
  **The Reply (2 mins):** "Justice is a multiplier on Capital, not a substitute for it. Even perfectly just rules require monitoring and cognitive load. A society can be just but over-regulated to the point of paralysis. I am arguing that even with high justice, the marginal cost of the *next* rule rises. Quality matters, but quantity has a hard ceiling."
  **Soft Spot:** Concedes that quantity might be secondary to quality in real-world scenarios.
  **Status:** **Concede in Talk.** (See Strategy Note below).

  ---

  ## STRATEGIC CONCESSIONS (To make during the presentation)
  *Do not wait for these to be asked. Pre-empt them to control the framing.*

  1.  **To the Public Health Official:** Explicitly state: *"This model applies to binding regulation, not emergency guidance. Guidance is an investment in Capital; binding rules are a withdrawal. I am not arguing against guidance, but against codifying guidance into law without enforcement yield."*
  2.  **To the Philosopher/Psych:** Explicitly state: *"Compliance Capital is depleted faster by unjust rules. My model assumes a baseline of legitimacy. If legitimacy is zero, Capital is zero. I am analyzing the marginal cost of regulation *within* a legitimate order."*

  ---

  ## THE SURVIVAL REPLY
  **You must land the reply to Objection #1 (The Economist).**
  If the panel accepts that compliance is purely habit-forming (appreciating asset) rather than patience-depleting (depreciating stock), your "Declining Marginal Authority" claim is mathematically impossible. You must hold the line that *political patience* is distinct from *behavioral habit*.

  ---

  ## THE QUESTION YOU HOPE NOBODY ASKS
  **"If Compliance Capital is low, does your model imply we should tolerate injustice to preserve stability?"**

  **Why it's fatal:** It forces you to choose between your descriptive model (stability requires low regulation) and normative reality (justice requires high regulation). If you say "Yes, tolerate injustice," you lose the room morally. If you say "No, regulate anyway," you admit your model doesn't determine policy, rendering the "Declining Marginal Authority" claim practically irrelevant.

  **Does the position survive?**
  **Barely.**
  *Honest Assessment:* The position survives only if you rigidly maintain the Is/Ought distinction. You must answer: *"My model predicts that regulating injustice in a low-capital environment will fail to produce the intended effect, potentially worsening the injustice. It does not say we shouldn't try; it says we must budget for the enforcement cost, or the injustice will persist de facto regardless of de jure rules."*
  If you cannot articulate that distinction clearly, the paper collapses into cynicism.
