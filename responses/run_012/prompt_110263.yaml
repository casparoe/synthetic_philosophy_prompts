      *   **The "Peer Disagreement" Gap:** Explain *why* the link is missing. AAT requires common knowledge of posteriors. Peer disagreement usually involves knowing *that* someone disagrees, not necessarily knowing their exact posterior probability distribution and update rule. The informational requirements are different.
      *   **The Market Analogy:** The No-Trade Theorem (Milgrom-Stokey) is the financial equivalent. It stalls for the same reason: liquidity traders/noise traders break the "common prior/rationality" assumption.

