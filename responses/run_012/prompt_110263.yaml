      *   It's not merely verbal. It's a **Category Mismatch between Normative Ideals and Descriptive Mechanics.**
      *   It's also a **Scope Fallacy.** People treat a limit-case theorem (infinite recursion, perfect rationality) as a heuristic for bounded agents.
      *   The "Hidden Empirical Question": Do rational agents *converge* on priors given enough shared evidence? (Harsanyi's view vs. subjective Bayesians). This is the real battleground, but it's unanswerable currently.

