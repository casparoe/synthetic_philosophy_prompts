      *   *Stress Test:* Is it *just* three questions? Or is there a deeper structural issue?
      *   *Insight:* The core tension isn't just distinct questions; it's a category error regarding the *status* of the "Common Prior." Is it a normative requirement of rationality (Camp 1) or a contingent empirical fact (Camp 2)? This is the pivot point.
      *   *Insight 2:* The "Common Knowledge" condition is the other pivot. In the real world, common knowledge is almost impossible (infinite recursion). So AAT is technically true but practically inert unless "common knowledge" is relaxed.
