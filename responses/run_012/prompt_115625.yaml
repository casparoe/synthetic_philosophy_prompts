      *   *Critique:* It's not a strawman, but it might be slightly simplified. Nguyen emphasizes that bubbles *can* burst easily (exposure), whereas chambers resist exposure because of the *pre-emptive undermining* of sources. The user captures this ("bubble pops when you show someone a newspaper").
