answer: |-
  The spoon hovered. It held a suspension of crushed pill and applesauce, beige and glistening. Elena watched her husband's throat, waiting for the swallow reflex that had become a unreliable tenant in his body.

  Mark turned his head. Just five degrees. Enough for the spoon to touch his cheek instead of his lips. A smear of applesauce on the stubble.

  Elena set the spoon down in the bowl. She wiped the cheek with a linen napkin, folded it once, placed it on the tray. She stood up, walked to the sink, washed her hands for twenty seconds. She dried them. She returned to the table. She picked up the spoon. She stirred the mixture three times counter-clockwise.

  "Breakfast, Mark," she said. Her voice was level, bright, the same tone she had used three minutes ago before the head-turn.

  From the doorway, Dr. Aris watched. He held a clipboard, but he wasn't writing. He had been watching for an hour. He had seen this sequence four times. The spoon lifted, the head turned, the reset. The sink, the soap, the stir, the greeting.

  "You didn't have to wash your hands again, Elena," Aris said softly. "They weren't dirty."

  Elena didn't look at him. She was focused on the angle of Mark's jaw. "Protocol," she said. "Contamination risk."

  "From a cheek wipe?"

  "From a break in the sterile field."

  Aris stepped into the dining room. The house was quiet, save for the hum of the refrigerator and the rhythmic ticking of the wall clock. It was a clean house. Immaculate. Not the cleanliness of a show home, but the cleanliness of a laboratory. There was no dust because dust was a variable.

  Aris pulled out a chair and sat opposite her. He opened his folder. "I read a paper recently. About digger wasps. *Sphex ichneumoneus*."

  Elena lifted the spoon. Mark was watching it now, his eyes tracking the beige blob. "I'm not interested in entomology, David."

  "The female wasp digs a burrow. She paralyzes a cricket and drags it to the threshold. Then she goes inside to inspect the chamber. If everything is clear, she comes out and drags the cricket in." Aris paused. "But researchers found that if you move the cricket just a few inches away while she's inside inspecting, she comes out, finds the cricket missing, drags it back to the threshold, and then goes inside to inspect the chamber *again*."

  Elena's hand didn't tremble. She held the spoon steady. "Mark moved."

  "She can do this forty times. Move the cricket, reset the inspection. It looks like care. It looks like diligence. But it's a fixed action pattern. A script. The wasp doesn't know *why* she's inspecting. She just knows the inspection must precede the entry."

  Mark coughed. A wet, rattling sound. The applesauce shifted in his mouth. He didn't swallow.

  Elena set the spoon down.

  "Elena," Aris said. "Don't."

  "He choked."

  "He didn't aspirate. He coughed. That's a good sign. It means his reflexes are working."

  "The rhythm is broken," she said. She stood up.

  "If you reset the routine every time he coughs, you'll never feed him. You're starving him to keep the schedule intact."

  Elena walked to the sink. The water ran. Twenty seconds. She counted them in her head, just as she counted the steps from the table to the faucet. *One-Mississippi, Two-Mississippi.*

  Aris watched her back. He was a good doctor. He cared about her burnout. He cared about Mark's caloric intake. But he also cared about the truth of behavior. He had seen caregivers become part of the machinery of care, gears grinding until they snapped. He wanted to save her from becoming the wasp.

  But Elena remembered last Tuesday. She had skipped the hand wash. She had been tired. The spoon had touched the table edge. Mark had aspirated. The ambulance, the suction, the night in the ICU where the monitors screamed like seabirds.

  Was that a lesson learned? Or was that the nudge?

  She dried her hands. She returned to the table. She picked up the spoon. She stirred the mixture three times counter-clockwise.

  "Breakfast, Mark," she said.

  Aris sighed, closing his folder. "You know the debate, though. Some ethologists argue it's not mechanical. They say the wasp isn't mindless. They say the world is full of predators. If the cricket moves, maybe something *did* touch it. Maybe the burrow *was* compromised. Re-inspecting isn't a glitch; it's a safety margin. It's adaptive."

  Elena looked at him then. Her eyes were dark, rimmed with a fatigue that sleep didn't fix. "So am I mindless, David? Or am I safe?"

  "I don't know," Aris admitted. "That's the problem. From the outside, they look the same. The compulsion and the caution. They look identical."

  Mark opened his mouth. A small, trusting gesture. He didn't understand the words, only the tone. The tone promised order. The tone promised that if the spoon came to the lips, the world was still holding together.

  Elena fed him. He swallowed.

  She reached for the water cup. As she lifted it, her sleeve brushed the sugar bowl. It slid two inches across the tablecloth.

  Elena froze.

  Her hand hovered over the water cup. Her breathing shallowed. The sugar bowl was out of place. The geometry of the table was wrong. The symmetry required for the hydration phase of the morning protocol was compromised.

  Aris leaned forward. "Elena. It's just sugar. Leave it."

  "If it falls," she said, her voice tight, "it attracts ants."

  "It's a ceramic bowl. It's not going to fall."

  "Last week the coaster slipped."

  "There were no ants last week."

  "I didn't check under the coaster."

  Aris stood up. He wanted to reach out, to put his hand on her shoulder and ground her. But he stopped. If he touched her, would she reset? If he interrupted the sequence, would she have to start the morning over from the moment she woke up? Would she make Mark get out of his chair and sit down again to simulate the transfer?

  He had read about the wasp. He knew the standard interpretation: *Sphexishness* is a synonym for rigidity, for the absence of thought. It is the insult we hurl at behavior that persists when context changes.

  But he looked at Mark. The man was paralyzed on his left side, trapped in a body that no longer obeyed him. The world was a constant assault of nudges for him. Gravity was a nudge. Hunger was a nudge. Confusion was a nudge.

  If Elena stopped checking, if she stopped resetting when the sugar bowl moved, what else would she stop checking? The gas stove? The door lock? The dosage on the syringe driver?

  Or was she already gone? Was she just a biological algorithm executing code written by trauma, unable to distinguish between a moved cricket and a changed life?

  Elena's hand remained hovering. The water in the cup rippled slightly from the vibration of the refrigerator kicking on.

  "Move it back," Aris said gently. "Just move it back. Don't wash. Don't stir. Just move it."

  Elena looked at the sugar bowl. Then she looked at Mark. Mark was waiting. His mouth was slightly open, ready for the water.

  If she moved the bowl, she acknowledged the disruption was minor. If she reset, she acknowledged the disruption was total.

  The refrigerator hummed. The clock ticked.

  Elena reached out. She didn't touch the sugar bowl. Instead, she picked up the water cup. She held it to Mark's lips. He drank.

  She set the cup down. It landed with a soft clink, slightly closer to the edge than the protocol dictated.

  Aris exhaled. He hadn't realized he was holding his breath. "Good," he said. "That's good, Elena."

  Elena didn't smile. She picked up the napkin. She wiped Mark's chin. She folded the napkin once. She placed it on the tray.

  She looked at the sugar bowl. It was still two inches to the left.

  "I'll clean it later," she said.

  Aris nodded. He made a note on his clipboard. *Patient stable. Caregiver responsive.*

  But as he walked to the door, he looked back. Elena was staring at the sugar bowl. She wasn't moving. She wasn't washing her hands. She was just watching it, her hands clasped tightly in her lap, her knuckles white. She looked like she was holding herself down, physically pinning her own arms to her sides to stop them from reaching for the soap.

  Was she resisting the compulsion? Or was she waiting for the bowl to move again, to prove that the world was still shifting, to justify the next inspection?

  "See you Thursday," Aris said.

  "Thursday," Elena replied. She didn't turn around.

  Aris closed the door. He stood on the porch for a moment, listening. He heard the scrape of a chair. He heard the water run in the kitchen.

  He couldn't tell if she had finally moved the bowl, or if she had started the wash cycle over. The sound was exactly the same.

  Inside, Elena counted the seconds. *One-Mississippi. Two-Mississippi.* She watched the water swirl down the drain. It was clean now. The world was clean.

  She turned off the tap. She looked at the sugar bowl. It hadn't moved.

  She dried her hands. She walked back to the table. She picked up the bowl and placed it exactly where it had been before it slid.

  "Breakfast, Mark," she said.

  Mark smiled. It was a reflex, perhaps. Or perhaps it was recognition.

  Elena sat down. She waited for the next nudge. She was ready to inspect the burrow. She was ready to save them. She wasn't sure which one she was doing anymore, but she knew she couldn't stop. The cricket was safe. The burrow was secure.

  For now.
