answer: |-
  Your friend is right. You haven't overreached in your logic, but you have overreached in your target.

  The "heterogeneity of pleasure" objection is indeed devastating, but it does not refute **hedonism** (the ethical theory about what is *good*). It refutes a specific **theory of pleasure** (the psychological theory about what pleasure *is*).

  Here is the breakdown of where the objection lands, how hedonists dodge it, and where the actual philosophical trouble remains.

  ### 1. The Category Error: Value vs. Psychology
  Your argument rests on this chain:
  1.  Hedonism says "Pleasure is the only intrinsic good."
  2.  To be "the good," pleasure must be a single, unified kind of thing.
  3.  Pleasures feel totally different from one another (heterogeneity).
  4.  Therefore, there is no single thing called "pleasure."
  5.  Therefore, Hedonism is false.

  The break happens between step 2 and 3. Step 2 is only true if you assume a specific definition of pleasure, often called the **Feeling Theory** (or Sensationism). This is the common-sense view that pleasure is a specific "glow," "tingle," or "sweet sensation" that accompanies experiences like eating cake or listening to music.

  If pleasure is a *sensation*, the heterogeneity objection is airtight. There is no common sensory thread between a hot shower and solving a math proof. If that's what pleasure is, then "pleasure" is a fiction, and you can't maximize a fiction.

  However, **Hedonism is a theory of value, not a theory of psychology.** A hedonist claims that *whatever pleasure turns out to be*, that is the good. They are not committed to the claim that pleasure *must* be a sensation.

  ### 2. The Dodge: Attitudinal Hedonism
  To survive the heterogeneity objection, most modern hedonists switch from the Feeling Theory to the **Attitudinal Theory**.

  On this view, pleasure is not a distinct sensation. It is a **pro-attitude** toward an experience. To feel pleasure is simply to *be pleased that* something is happening, or to *want* the experience to continue for its own sake.

  *   **Feeling Theory:** Pleasure is a "buzz" added to the experience. (Killed by heterogeneity).
  *   **Attitudinal Theory:** Pleasure is the stance of "welcoming" or "enjoying" the experience. (Survives heterogeneity).

  Under the Attitudinal view, the shower, the proof, and the friend *do* have something in common. It isn't a sensory quality; it's a functional one. In all three cases, you are taking a positive stance toward the experience. You are "saying yes" to it.

  Because of this, the hedonist can agree with you that the *sensations* are wildly different, but maintain that the *value* is unified. The unity comes from the subject's attitude, not the object's texture. This is why philosophers still treat hedonism as a live option: they simply updated their psychology to save their axiology.

  ### 3. What the Hedonist Has to Give Up
  Your friend is right that hedonism survives, but it doesn't survive unscathed. To accept the Attitudinal view and dodge the heterogeneity bullet, the hedonist has to concede two things that make the theory less intuitive:

  **A. The Loss of "The Good Feeling"**
  The hedonist has to admit that there is no "magic substance" of goodness. We often think of hedonism as "chasing a high." The Attitudinal view admits there is no single "high." This makes hedonism less distinct from other theories. If pleasure is just "being pleased that X," it starts to look very similar to **Desire Satisfactionism** (the view that satisfying desires is the good). The line between "taking pleasure in" and "getting what you want" gets very blurry.

  **B. The Measurement Problem (The Real Bite)**
  This is where your intuition about "maximization" still holds water. Even if we accept the Attitudinal view, the heterogeneity objection leaves a scar regarding **commensurability**.

  Hedonism requires us to *maximize* pleasure. To maximize something, you usually need a common metric (like liters of water or dollars).
  *   If pleasure were a sensation (a "glow"), we could theoretically measure the intensity and duration of the glow.
  *   If pleasure is just "attitudes toward heterogeneous experiences," how do we add them up?

  How many hot showers equal one mathematical proof? If they share no common sensory currency, on what scale are we summing them? The Attitudinal Hedonist has to argue that there is a single scale of "intensity of pro-attitude," but this is hard to cash out practically. The heterogeneity objection successfully destroys the idea that there is a simple "hedonic calculus."

  ### 4. Summary for Your Group
  Here is the cleanest way to put it to your reading group:

  1.  **The Objection:** "Pleasures feel too different to be one thing."
  2.  **The Target:** This kills the **Feeling Theory** of pleasure (pleasure = a specific sensation).
  3.  **The Escape:** It does **not** kill **Hedonism** (pleasure = the only good). Hedonists switch to the **Attitudinal Theory** (pleasure = welcoming an experience).
  4.  **The Cost:** By making this switch, hedonists admit there is no "hedonic sensation" to measure. This makes the command to "maximize pleasure" much harder to define practically, even if it remains logically coherent.

  So, you were right that the objection destroys the *naive* version of hedonism (the "eat-drink-be-merry" sensory version). But you were wrong that it destroys the *ethical* position. Philosophers treat it as a live option because they aren't trying to maximize a sensation; they are trying to maximize the satisfaction of pro-attitudes. The objection forces them to be more sophisticated, not to quit.
