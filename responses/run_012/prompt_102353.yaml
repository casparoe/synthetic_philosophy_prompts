  9.  **Final Polish:** Ensure the distinction between the "Feeling Theory" (which dies) and "Attitudinal Theory" (which survives) is the centerpiece. Make sure the "Real Bite" section addresses the *consequences* of switching theories, not just the switch itself. (e.g., measurement issues).

