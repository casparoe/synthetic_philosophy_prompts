prompt: |-
  Hey, I'm putting together a short explainer for a little reading group I run on hedonism -- the ethical view, not the eat-drink-and-be-merry stereotype -- and I keep getting stuck on this "heterogeneity of pleasure" objection. The version I've absorbed goes: the pleasure of a hot shower, the pleasure of finally getting a proof to click, and the pleasure of seeing a close friend after a long time have basically nothing in common as experiences -- no shared feeling-tone, no one sensation that's present in all of them -- so "pleasure" doesn't pick out a single kind of thing at all. And I take the punchline to be that hedonism is just refuted: you can't claim pleasure is the only intrinsic good and that we should maximize it if there's no one thing called pleasure to maximize. That seems airtight to me, which is exactly why it bugs me that philosophers still treat hedonism as a live option and keep writing about it as if nothing happened.

  A friend in the group said I've got the target wrong -- that the objection only really lands on one particular theory of what pleasure *is*, and that you can stay a hedonist while happily agreeing that pleasures are wildly different from each other. I honeslty can't tell if she's right or just being clever. So could you sort me out: is the heterogeneity point supposed to refute hedonism outright, and if not, what exactly is it an objection to? What, if anything, would a hedonist have to give up in order to live with it, and where is the real bite of the worry (if there is one) as opposed to the version I've been repeating to people? No need for a lit review or a reading list, I just want to see where I've overreached.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Context:** Running a reading group on ethical hedonism.
      *   **The Sticking Point:** The "Heterogeneity of Pleasure" objection.
      *   **User's Current Understanding:** Pleasures (shower, proof, friend) feel totally different $\rightarrow$ no common "feeling-tone" $\rightarrow$ "pleasure" isn't a single natural kind $\rightarrow$ Hedonism (maximize *the* good) is refuted because there's no single *thing* to maximize.
      *   **User's Confusion:** Why do philosophers still treat hedonism as a live option if this objection seems airtight?
      *   **Friend's Claim:** The objection only hits a specific *theory of pleasure*, not hedonism itself. You can be a hedonist without thinking pleasures share a common feeling.
      *   **Goal:** Clarify whether the objection refutes hedonism outright, what it actually targets, what a hedonist must concede/adjust, and where the *real* philosophical bite lies.
      *   **Constraints:** No lit review, no reading list, just conceptual sorting.

  2.  **Deconstruct the "Heterogeneity Objection":**
      *   *What is it?* It's the claim that there is no single phenomenological quality shared by all pleasurable experiences.
      *   *Who does it hurt?* It hurts **Hedonistic Theories of Value** *if* they rely on a **Feeling Theory of Pleasure** (often called the "Internalist" or "Sensation" view).
      *   *Does it kill Hedonism?* No, because Hedonism is a theory about *value* (what is good), not necessarily a theory about *psychology* (what pleasure feels like).
      *   *The Friend's Point:* The friend is correct. You can separate the axiology (pleasure = good) from the phenomenology (pleasure = a specific buzz).

  3.  **Identify the Two Main Theories of Pleasure:**
      *   **Feeling Theory (Sensationism):** Pleasure is a distinct sensation (like a "tingle" or "glow") that accompanies experiences. *This* is what the heterogeneity objection destroys. If pleasure is a specific sensation, and there is no common sensation, then "pleasure" doesn't exist as a unified category.
      *   **Attitudinal Theory (Pro-Attitude):** Pleasure is not a sensation but an *attitude* toward an experience (e.g., taking joy in, being pleased that, wanting it to continue). This allows for heterogeneity of sensation while maintaining unity of attitude. (Feldman is the big name here, though I shouldn't name-drop unnecessarily per constraints).
      *   **Desire Satisfaction:** Sometimes linked, but distinct. Let's stick to Feeling vs. Attitudinal for clarity.

  4.  **Evaluate the User's "Airtight" Argument:**
      *   *Premise 1:* Hedonism says "Maximize Pleasure."
      *   *Premise 2:* To maximize X, X must be a unified thing.
      *   *Premise 3:* Pleasures have no common phenomenological feature (Heterogeneity).
      *   *Conclusion:* Hedonism is false.
      *   *The Flaw:* Premise 2 is only true if "Pleasure" is defined phenomenologically. If "Pleasure" is defined functionally or attitudinally (e.g., "that which is desired for its own sake" or "experiences we welcome"), the lack of common sensation doesn't matter. The unity comes from the *subject's stance*, not the *sensory content*.

  5.  **Determine the "Real Bite" of the Objection:**
      *   If the Feeling Theory is abandoned for the Attitudinal Theory, does the objection vanish? Mostly.
      *   *Residual Worry:* If pleasure is just "whatever we like," is Hedonism trivial? (Tautology: "Good is what we think is good").
      *   *Residual Worry:* If there's no common sensation, how do we compare/measure different pleasures for maximization? (The Measurement/Aggregation problem). If a shower and a proof share no common currency, how do I add them up to "maximize" the total? This is the deeper issue.

  6.  **Drafting the Response (Iterative Process):**

      *   *Validation:* Acknowledge the user's intuition. It *is* a strong objection against a specific, common-sense view of pleasure.
      *   *Correction:* Confirm the friend is right. Distinguish between **Hedonism about Value** (what is good) and **Theories of Pleasure** (what pleasure is).
      *   *The Pivot:* Explain the shift from "Feeling Theory" to "Attitudinal Theory."
          *   *Feeling Theory:* Pleasure is a "sweet buzz." Heterogeneity kills this.
          *   *Attitudinal Theory:* Pleasure is "being pleased that..." or "wanting this to continue." Heterogeneity doesn't kill this. You can be "pleased that" about wildly different things.
      *   *The Cost:* What does the hedonist give up? They give up the idea that pleasure is a simple sensory datum. They have to accept a more complex psychological structure.
      *   *The Real Bite:* Where does the objection still sting?
          1.  *Triviality:* If pleasure = "whatever we like," is "maximize pleasure" just "do what you like"?
          2.  *Commensurability:* If experiences are heterogeneous, can they really be summed up? (The "Maximization" problem).
      *   *Conclusion:* Summarize. The objection kills *naive* hedonism, not *sophisticated* hedonism.

