  The sub-questions I'd propose — revise the list if you think it's wrong — are: (a) whether the wavefunction is even the kind of object that could be a candidate for reality, given that it is defined over a high-dimensional configuration space rather than the three-dimensional space we inhabit; a friend in the group insists that if it is real then space itself is not fundamental, and I genuinely can't tell whether that is a cost of the view or a clue to something deeper. (b) whether the arguments that try to force a psi-ontic conclusion from the structure of quantum predictions actually succeed, or whether the epistemic view can always be rebuilt by adding something — hidden variables, extra ontic structure, a restriction on what counts as a preparation — and so is never really refuted. (c) whether the state is even a unique object to be real about, since the global phase, the choice of Hilbert-space factorization, and the choice of representation seem to leave the formalism indifferent between formulations that disagree about the state's values while agreeing on every prediction; I want to know whether that underdetermination counts against realism about the state or is simply the usual gauge freedom that any realist about physics learns to live with. (d) whether the success of a theory's predictions gives any reason at all to believe in its theoretical entities, or whether the whole question just inherits whatever answer one gives to scientific realism in general. And (e) whether "real" here has a determinate enough meaning for the question to have a truth value at all, or whether it is a verbal dispute dressed up as metaphysics.

  Then tell me which single term the final number is most sensitive to — which one judgment, if you moved it, would swing the credence most — and what piece of argument or evidence, of a kind one could actually obtain without a laboratory, would move that term furthest. Finally, I'd like your read on where my interlocutor and I are actually disagreeing: about the physics, about the metaphysics, or about the meaning of the word. My suspicion is that a lot of the heat comes from the third, and I'd like to be told if I'm wrong about that.
