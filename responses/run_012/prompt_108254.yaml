answer: |-
  Dear Student,

  It is entirely normal to feel regret about this commitment now that the date is approaching, because you have chosen to defend a position that is intellectually demanding and politically vulnerable. You are arguing for a mechanism of power that is designed to be invisible, which makes it incredibly difficult to demonstrate its existence without sounding like you are describing a ghost. The anxiety you feel is a sign that you understand the stakes. You are walking into a room where the undergraduates will treat constitutional conventions as case law, your politics teacher will treat them as logical propositions to be disproven, and your history teacher will treat them as virtues to be celebrated. Your task is not to win a debate in the traditional sense but to survive an interrogation without your thesis collapsing under the weight of its own contradictions. To do that, you need to understand exactly how each of your interrogators thinks so you can anticipate where they will strike.

  The undergraduate republicans, particularly the one you mentioned, will approach this with the confidence of someone who has recently learned the black-letter rules and is eager to test them against reality. They will concede that conventions exist but will dismiss their binding force as merely social pressure rather than law. They will pounce on any historical inaccuracy immediately and will dismiss appeals to tradition as sentimentalism. They view democracy as a numerical game and will see any unelected veto as a corruption of that game. Your politics teacher is more dangerous because they will not bother with history at all. They will concede that the system has survived but will argue that survival does not equal legitimacy. They will attack the logic of a credible threat that is never used, pointing out that in any other context we would call this a bluff. They will dismiss the distinction between a monarch and an elected president as semantic unless you can prove that an elected person cannot be neutral. Your history teacher is a different kind of risk. They will concede nothing because they already agree with you, but their agreement is dangerous. They will support you for reasons of patriotism or stability, which will make your constitutional argument look like mere nostalgia. You must politely distance yourself from their sentimentality without offending them, or the undergraduates will dismiss your entire case as emotional rather than structural.

  Before you take a single question, you should make specific concessions in your closing remarks to disarm your critics. You must admit openly that the reserve powers are rarely used and that when they are used, such as in Australia in 1975, the result is messy and controversial. You should concede that the democratic deficit is real and that an unelected head of state is an anomaly in the modern world. If you try to deny these facts, you will lose credibility instantly. By admitting them, you frame them as features of a complex system rather than bugs you are trying to hide. You should also clarify the legal status of the dissolution power. The Fixed-term Parliaments Act 2011 did remove the prerogative power of dissolution, but the Dissolution and Calling of Parliament Act 2022 repealed that legislation and restored the prerogative power, explicitly making it non-justiciable. If you get this wrong, the undergraduates will stop listening to your philosophy because you will have failed the basic law test.

  The first objection you will face, likely within the first minute from the undergraduate republican, will concern the Australian dismissal of 1975. They will phrase it as a direct challenge to your safety claim, asking how a power that caused a constitutional crisis can be called a safeguard. This has real force because it is the strongest evidence against your thesis. You should concede that the dismissal was traumatic and that it remains deeply contested in Australia. You must hold, however, that it resolved a legislative deadlock that the elected politicians could not resolve themselves. Your reply should be that the Governor-General acted to force an election when the government could not supply money, and while painful, it preserved the functioning of the state rather than allowing a breakdown. You should note that the Queen was not involved personally, which protects your argument about the British monarch specifically. The weakness in this reply is that it accepts that an unelected official can override an elected government, which many will find indefensible regardless of the outcome.

  The second objection will come from your politics teacher, who will attack the democratic legitimacy of the power. They will ask why we should tolerate a check on the people's will that the people cannot remove. This is the most damaging philosophical objection. You should concede that it is undemocratic in the pure sense. You must hold that democracy requires more than just majority rule; it requires rules that prevent the executive from abusing its majority. Your reply should be that an elected president inevitably belongs to a party or faction, whereas the monarch belongs to no faction, making them the only actor capable of arbitrating disputes without seeking re-election or advantage. The weakness here is that you are asserting the monarch is neutral without proving it, and critics will argue that neutrality is impossible for any human being.

  The third objection will target the credibility of the threat. Your politics teacher or a sharp undergraduate will ask how a power can be a deterrent if everyone knows it will never be used. This is a logical trap. You should concede that it is paradoxical. You must hold that the uncertainty is the point. Your reply should draw an analogy to nuclear deterrence or a fire extinguisher; the value lies in the capability to act, not the act itself, and the moment you use it frequently, it loses its constitutional status and becomes a political weapon. The weakness is that nuclear deterrence relies on mutual destruction, whereas this power relies on mutual trust, which is far more fragile.

  The fourth objection will be technical, regarding the Lascelles Principles. An undergraduate will ask if these principles are law or convention and whether the 2022 Act changed them. You should concede that they are conventions published by a private secretary, not statute. You must hold that they still guide the sovereign's personal discretion. Your reply should be that the 2022 Act restored the power but did not codify the conditions for its use, leaving the conventions intact as the soft law that governs the hard power. The weakness is that soft law is difficult to enforce, leaving the system reliant on the monarch's good judgment.

  The fifth objection is not a question but a statement of support from your history teacher. They may say something about the stability of the realm or the wisdom of tradition. You must not let this stand unchallenged. You should concede that stability is a benefit but hold that your argument is about constitutional mechanics, not heritage. Your reply should be that the system works because of the checks and balances, not because of the history, and that a republic with similar checks could theoretically work if it could solve the mandate problem. The weakness is that this might alienate your ally, but it is necessary to keep your argument secular and logical.

  There is one single reply you must land for your argument to survive, and it concerns the nature of the mandate. You need to convince them that having a mandate is a disadvantage for a head of state. If you can persuade them that an elected president interprets their silence as consent and their speech as policy, whereas the monarch's silence is neutrality, you win. You must argue that an elected president fights for power, while the monarch holds power in trust. If you fail to make this distinction, you are just defending privilege.

  Finally, there is a question you are hoping nobody asks, which is what happens if the monarch gets it wrong. If the sovereign refuses assent or dismisses a prime minister based on a misjudgment of the Lascelles Principles, what is the remedy? This is the nuclear scenario for your thesis. If it comes, do not evade it. You must answer that the remedy is the end of the monarchy. You should state that the power exists on the condition that it is used correctly, and if it is abused, the political cost would be the abolition of the institution itself. This admits the fragility of the system but reinforces your point that the power is held at great personal risk to the monarch, which is why it is rarely used. This turns the vulnerability into a strength, showing that the monarch is constrained by the survival of their own office.

  You are walking into a room where people want to see if you can think under pressure. They do not expect you to have all the answers, but they do expect you to know when you are wrong. Be precise, be humble about the history, and be ruthless about the logic. Good luck.
