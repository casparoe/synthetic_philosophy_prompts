answer: |-
  Here is a map of the logical space. It is built as a decision tree based on four concrete questions. You can answer these questions without knowing the philosophical labels, and your path through them determines which "leaf" (position) you end up at.

  ### The Decision Tree

  **Question 1: The Empirical Claim**
  *If we controlled for education, income, and social desirability bias, would we still find a stable difference where one political group consistently relies on 'Loyalty, Authority, and Sanctity' intuitions significantly more than the other?*
  *   **NO:** → **Leaf 5 (The Empirical Skeptic)**
  *   **YES:** → Go to Question 2.

  **Question 2: The Relevance Gap**
  *Does the fact that a moral intuition is deep-seated, widespread, or evolutionarily old count as **evidence** that the intuition is correct?*
  *(Example: If everyone feels disgust at a harmless act, does that make the act wrong, or is the disgust just a feeling?)*
  *   **NO:** → **Leaf 1 (Separate Compartments)**
  *   **YES:** → Go to Question 3.

  **Question 3: The Scope of Truth**
  *If psychology provides evidence for moral truth, is that truth the **same for everyone**, or does truth depend on which community's psychology you belong to?*
  *   **Depends on the Community:** → **Leaf 4 (Relativist/Anti-Realist)**
  *   **Same for Everyone:** → Go to Question 4.

  **Question 4: The Weight of Foundations**
  *Regarding the 'extra' foundations (Loyalty, Authority, Sanctity) that one group uses more: Are these additional intuitions **assets** to be included, **liabilities** to be filtered out, or **raw material** to be processed?*
  *   **Assets (Inclusion):** → **Leaf 2 (Wider-is-Better)**
  *   **Liabilities (Filtering):** → **Leaf 3 (Parochialism Reply)**
  *   **Raw Material (Processing):** → **Leaf 6 (Constructivist)**

  ---

  ### The Leaves (The Positions)

  Here is what each endpoint looks like in practice.

  #### Leaf 1: Separate Compartments
  *   **The Path:** Empirics are real + Psychology is irrelevant to truth.
  *   **The View:** "My brother-in-law is right about the psychology, but wrong to think it matters for the argument." This view holds that moral truth is like math. The fact that some people find calculus harder than others (psychology) doesn't change the answer to the equation (normative truth). You can study why people believe what they believe without ever getting closer to whether they *should* believe it.
  *   **Normative Verdict:** The psychology explains the fight, but doesn't settle it.

  #### Leaf 2: Wider-is-Better
  *   **The Path:** Empirics real + Psychology relevant + Universal truth + Extra foundations are assets.
  *   **The View:** "A morality that ignores half the human moral palette is blind." This position argues that moral truth is about human flourishing, and since humans actually care about loyalty, authority, and sanctity, a moral system that ignores those is incomplete. The side that utilizes more foundations has a 'higher resolution' map of the moral landscape.
  *   **Normative Verdict:** The group using more foundations (typically the conservative side in MFT data) is closer to the full moral truth.

  #### Leaf 3: Parochialism Reply
  *   **The Path:** Empirics real + Psychology relevant + Universal truth + Extra foundations are liabilities.
  *   **The View:** "The extra foundations are bugs, not features." This view agrees that psychology is evidence, but argues that some moral intuitions are evolutionary misfires (e.g., disgust responses misapplied to social groups). Just because an intuition is deep-seated doesn't mean it's valid; it might be a prejudice. The side using *fewer* foundations is actually more rigorous, having successfully filtered out the noise.
  *   **Normative Verdict:** The group using fewer foundations (typically the liberal side) is closer to the moral truth because they rely on the 'universal' foundations (Care/Fairness) rather than the 'parochial' ones.

  #### Leaf 4: Relativist / Anti-Realist
  *   **The Path:** Empirics real + Psychology relevant + Truth depends on community.
  *   **The View:** "Morality just *is* the output of our foundations." If morality isn't a discovery (like math) but a creation (like cuisine), then asking who is "actually right" is a category error. There is no view from nowhere. The psychology doesn't point to the truth; the psychology *constitutes* the truth for that group.
  *   **Normative Verdict:** The question "Who is right?" dissolves. Both sides are right relative to their own moral matrices.

  #### Leaf 5: Empirical Skeptic
  *   **The Path:** The empirical claim is false.
  *   **The View:** "The data is rigged." This position argues that the '5 vs 2 foundations' finding is an artifact of how the questions are asked, or that it only applies to American conservatives vs. liberals, not humans generally. If the descriptive premise is shaky, the normative implications collapse.
  *   **Normative Verdict:** The debate is premature. We can't use the psychology to judge the morality until we agree the psychology is real.

  #### Leaf 6: Constructivist
  *   **The Path:** Empirics real + Psychology relevant + Universal truth + Foundations are raw material.
  *   **The View:** "Foundations are ingredients, not the meal." This view rejects the idea that we should simply obey our intuitions (Leaf 2) or simply delete the inconvenient ones (Leaf 3). Instead, we acknowledge the intuitions exist and build normative systems that manage them. For example, we don't obey 'Authority' blindly, but we construct institutions that satisfy the human need for order without enabling tyranny.
  *   **Normative Verdict:** Neither side is "right" out of the box. The "right" answer is the political system that best constructs a stable society using the psychological material available.

  ---

  ### Meta-Analysis: Where This Map Might Be Wrong

  You asked for the weak points. Here is where the taxonomy is most vulnerable to collapse or misclassification.

  **1. The "Purification" Overlap (Leaf 3 vs. Leaf 6)**
  In practice, the **Parochialism Reply** and the **Constructivist** view often look identical. Both typically conclude that 'Sanctity' should not dictate law.
  *   *The Difference:* Parochialism says Sanctity is *false* (a bias). Constructivism says Sanctity is *real* but needs translation (a resource).
  *   *The Risk:* Most people who hold Leaf 6 views end up voting like Leaf 3 people. If the practical outcome is the same, is the distinction worth a separate leaf? I kept them separate because the *reasoning* is fundamentally different (debunking vs. building), which matters for long-term coalition building.

  **2. The Empty Cell: "Narrower is Better" (without Parochialism)**
  There is a logically possible position where the extra foundations are not "suspicious biases" (Leaf 3) but simply "irrelevant." This would be a view that says, "Loyalty and Authority are real moral goods, but they don't apply to national politics."
  *   *Status:* This cell is mostly empty. People who think foundations are irrelevant to politics usually think they are biases (Leaf 3). If you find this position attractive, it belongs under Leaf 3, but it's a nuance worth noting: it's not that the foundations are *wrong*, just that they are *local* (family/team) rather than *national*.

  **3. The Empirical Weak Point (Question 1)**
  The entire tree rests on Question 1. The Moral Foundations literature has faced significant replication challenges.
  *   *The Risk:* If the "5 vs 2" split is actually a "US Culture War vs. Rest of World" split, or if it disappears when you measure *behavior* rather than *survey answers*, the tree collapses into Leaf 5.
  *   *What would change my mind:* If new cross-cultural data showed that "Liberals" in India or Brazil use Loyalty/Authority foundations just as much as "Conservatives," the political valence of the theory breaks. The tree would need to be redrawn not as Left/Right, but as "Modernized vs. Traditional" societies.

  **4. The Stealth Realist (Leaf 1 vs. Leaf 3)**
  Many people claim to hold **Leaf 1 (Separate Compartments)** ("Psychology doesn't determine truth!") but secretly operate as **Leaf 3 (Parochialism)** ("Their psychology is biased, ours is rational").
  *   *The Risk:* Leaf 1 is often used as a shield. If you argue that the other side's views are caused by 'disgust sensitivity' or 'authoritarian upbringing,' you have already crossed into Leaf 2 or 3. You are using psychology to debunk them. True Leaf 1 adherents must refuse to use psychological explanations as normative critiques.

  **5. The Missing Seventh Leaf: The Developmental View**
  There is a view not fully captured here: **Moral Maturation.**
  *   *The View:* The foundations represent stages of development. Everyone starts with Authority/Sanctity (child/tribe), and matures into Care/Fairness (adult/cosmopolitan).
  *   *Placement:* This is a specific version of Leaf 3 (Parochialism), but it implies the "wider" morality is actually *childish*.
  *   *Why it's missing:* It's empirically unpopular now (Kohlberg-style stage theory is out of fashion), but it lurks in many family dinners. If your cousin argues that "Conservatism is a fear response we grow out of," they are holding this view.

  ### Summary for the Dinner Table
  If you want to stop the fight, identify which Question everyone is stuck on.
  *   If you disagree on **Q1**, stop arguing politics and read the methodology sections of the papers.
  *   If you disagree on **Q2**, you are arguing about Hume (facts vs. values). No amount of data will solve this.
  *   If you disagree on **Q4**, you are arguing about whether tradition is a resource or a shackle. That is a genuine political disagreement that psychology cannot solve.

  The map shows that most of your dinner fights are likely happening at **Question 4**, but everyone thinks they are arguing about **Question 1**.
