prompt: |-
  I run the research desk at a small human rights documentation outfit -- five of us, no lawyer on staff, and our country reports get quoted by journalists and diplomats. A few times a year we have to decide whether to use the word genocide about a situation we're documenting, and honestly we keep making it up as we go. I want a decision procedure my team can actually run in a day or two and still defend six months later.

  Two things have to be in it, because they pull in different directions. First, the word as Lemkin built it was about destroying a group's way of life -- its political and social institutions, culture, language, national feeling, religion, economic existence -- and replacing it with the perpetrator's own pattern, which is a lot broader than what most people picture. Second, the 1948 convention version is much narrower: it needs specific intent to destroy, in whole or in part, a national, ethnic, racial or religious group as such, and the acts basically come down to killing, serious bodily or mental harm, conditions of life meant to destroy the group, preventing births, and taking children. Give me the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a clean no, and where it hands the call to our board because the question is values or politics rather than facts. Say which steps need evidence we won't realistically have in two days, and what to do when it's missing.

  Then run it on three cases: a state that has killed nobody but is steadily erasing a minority's language, monuments and churches while settling its own people onto the land; a massacre of 400 villagers where we can't find anything showing intent to destroy the group rather than crush a rebellion; and a government wiping out an armed political movement and its families, where publishing the word would probably get our two local staff arrested. I expect to dislike at least one of the verdicts. Also tell me what the procedure can't do -- where it will misfire, and where the honest answer is that we're making a political choice and dressing it up as a finding. I dont want a reading list, we need this usable tomorrow.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Research desk lead at a small human rights NGO (5 staff, no lawyer).
      *   **Task:** Create a decision procedure for using the word "genocide."
      *   **Constraints:**
          *   Must be runnable in 1-2 days.
          *   Must be defensible 6 months later.
          *   Must balance two definitions: Lemkin's (broad, cultural/structural destruction) vs. 1948 Convention (narrow, specific intent + specific acts).
          *   Must include: Ordered questions, sufficiency criteria, stop points (clean "no"), escalation points (board/policy call), evidence gaps handling.
          *   Must apply to three specific test cases.
          *   Must include limitations (where it misfires, where it's political dressing).
          *   **Tone:** Practical, usable, no fluff, no reading list.
      *   **Implicit Need:** The user acknowledges they are "making it up as they go." They need legitimacy and consistency without legal overreach (since they have no lawyer). They need to manage risk (staff safety, credibility).

  2.  **Deconstruct the Tension (Lemkin vs. Convention):**
      *   *Lemkin:* Focuses on "way of life," culture, institutions, economic existence. Broader.
      *   *Convention (UNGC):* Focuses on *dolus specialis* (specific intent) to destroy a protected group (national, ethnic, racial, religious) via specific acts (killing, harm, conditions, births, children). Narrower.
      *   *The Conflict:* A situation might fit Lemkin (cultural erasure) but fail the Convention (no killing/intent to destroy physically). Conversely, a massacre might fit Convention acts but lack the specific intent (could be counter-insurgency).
      *   *The Solution:* The procedure needs a "Gateway" (Convention) and a "Context" (Lemkin). Since the user's reports are quoted by diplomats/journalists, the *legal* weight of the term "genocide" usually defaults to the Convention in international discourse, *but* the moral weight often leans on Lemkin. The procedure should prioritize the Convention for the *label* "genocide" to maintain legal defensibility, but use Lemkinian analysis to flag "Cultural Genocide" or "Ethnocide" if the Convention threshold isn't met but the harm is severe. *Correction:* The prompt asks for a decision procedure on whether to use the word *genocide*. Using it loosely risks credibility. Using it strictly risks ignoring Lemkin's insight.
      *   *Strategy:* I will structure the procedure to test the Convention threshold first (because that's the legal standard diplomats/journalists expect). If it fails, I will offer a "Lemkin Check" to see if a qualified term (e.g., "cultural genocide" or "ethnic cleansing") is more appropriate, or if the Board needs to decide on a policy exception. *Actually, the prompt asks to balance both in the decision to use the word.* I need to integrate them.
      *   *Revised Strategy:* Step 1: Protected Group? Step 2: Prohibited Acts? Step 3: Specific Intent? (Convention). Step 4: Lemkinian Context (Way of Life). If Convention is met -> Genocide. If Convention fails but Lemkin is strong -> Board Decision (Political/Values). This respects the legal risk while honoring the moral scope.

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Time Limit:* 1-2 days. This means no deep forensic archival work. Reliance on open source, witness testimony, pattern analysis.
      *   *Evidence Gaps:* Need a "Missing Evidence" protocol. Presumption of innocence? Or reasonable grounds? For NGOs, "reasonable grounds to believe" is the standard.
      *   *Escalation:* When does it go to the Board? When the law is clear but the *consequence* is dangerous, or when the law is ambiguous but the moral case is strong.
      *   *Safety:* The prompt mentions staff safety in Case 3. This needs a specific "Risk Assessment" step before publication, not just a legal test.

  4.  **Developing the Steps:**
      *   *Step 0: Safety & Mandate.* (Crucial for Case 3).
      *   *Step 1: The Group.* Is it National, Ethnic, Racial, Religious? (Convention). If Political/Social only -> Stop (unless Board overrides for Lemkin).
      *   *Step 2: The Acts.* Killing, Harm, Conditions, Births, Children. (Convention). If none -> Stop (unless Cultural Destruction is the focus).
      *   *Step 3: The Intent.* Specific intent to destroy the group *as such*. (Convention). This is the hardest part in 2 days. Need indicators (pattern, scale, statements).
      *   *Step 4: The Lemkin Check.* Is the "way of life" being destroyed? If Steps 1-3 are weak but this is strong -> Board Escalation.
      *   *Step 5: The Risk/Policy Call.* Board decides on usage if legal threshold is borderline but moral case is high, or if safety is at risk.

  5.  **Refining the "Stop" and "Escalate" Points:**
      *   Clean No: Fails Group or Acts.
      *   Escalate: Passes Group/Acts but Intent is ambiguous; OR Passes Lemkin but fails Convention; OR Safety risk is high.

  6.  **Addressing Evidence Gaps:**
      *   If direct evidence of intent is missing (common in 2 days), look for "inference from pattern."
      *   If evidence is missing, default to "reasonable grounds" standard, not "beyond reasonable doubt."
      *   If critical evidence is missing, label findings as "indicators of" rather than definitive.

  7.  **Running the Test Cases:**
      *   *Case 1 (Cultural Erasure/No Killing):* Fails Convention Acts (mostly). Passes Lemkin. Verdict: No "Genocide" (Convention), Escalate to Board for "Cultural Genocide/Ethnocide" label.
      *   *Case 2 (Massacre/Rebellion):* Passes Acts. Fails Intent (could be counter-insurgency). Verdict: No "Genocide." (War Crimes/Crimes Against Humanity).
      *   *Case 3 (Armed Movement/Safety Risk):* Passes Convention (maybe). Fails Safety. Verdict: Do not publish "Genocide" (Safety trumps). Or use ambiguous language. *Wait, the prompt says "publishing the word would probably get our two local staff arrested."* This is a duty of care issue. The procedure must account for this *before* the legal analysis.

  8.  **Addressing Limitations (The "Honest Answer"):**
      *   Intent is mind-reading.
      *   "Genocide" is a political trigger, not just a legal term.
      *   NGO findings are not court verdicts.
      *   The tension between Lemkin and Convention is unresolved in international law.

  9.  **Review against Constraints:**
      *   *Usable tomorrow?* Yes, checklist format.
      *   *No lawyer?* Keep legal jargon minimal, explain "Specific Intent."
      *   *Defensible?* Based on "reasonable grounds."
      *   *Two definitions included?* Yes, Convention as threshold, Lemkin as context/escalation.
      *   *Three cases run?* Yes.
      *   *Limitations included?* Yes.

  10. **Final Polish:** Ensure the tone is professional, direct, and empathetic to the precarious position of the NGO. (Self-Correction: Make sure the distinction between "Genocide" and "Ethnocide/Cultural Genocide" is clear, as the latter isn't legally binding but fits Lemkin).

  *(Self-Correction during drafting)*: I need to be careful with Case 3. If the legal test says "Yes" but safety says "No," the procedure shouldn't just say "Don't do it." It should say "Escalate to Board for Risk/Benefit." But practically, if staff get arrested, the report doesn't matter. I will build a "Safety Gate" at the very beginning.

  *(Refining the Lemkin/Convention Balance)*: The prompt says "Two things have to be in it... they pull in different directions." I need to make sure the procedure doesn't just default to Convention. I will structure it so that if Convention fails but Lemkin succeeds, it *must* go to the Board. That forces the political/value decision rather than hiding it.

  *(Refining Evidence)*: "Reasonable grounds to believe" is the standard for UN Commissions of Inquiry. It's lower than "beyond reasonable doubt." I should specify this standard so they don't feel they need a smoking gun.

  Let's assemble the output.cltr
answer: |-
  Here is a decision procedure designed for a small, non-legal team working under time and safety constraints. It prioritizes defensibility (using the "reasonable grounds" standard common to UN inquiries) while forcing a explicit conversation when the moral case (Lemkin) outstrips the legal case (Convention).

  ### The "Genocide" Determination Protocol (GDP-1)

  **Standard of Proof:** *Reasonable grounds to believe.* You do not need proof beyond a reasonable doubt. You need a credible basis that would lead a reasonable person to conclude the events likely occurred.
  **Timeframe:** 48 Hours.
  **Authority:** Research Lead drafts; Executive Director/Board approves "Escalation" cases.

  ---

  #### Phase 0: The Safety Gate (Immediate Stop)
  **Question:** Does publishing the term "genocide" create a credible, imminent threat to the life or liberty of our local staff or partners?
  *   **Evidence:** Security assessment, local partner feedback, recent arrest patterns.
  *   **If YES:** **STOP.** Do not use the term in public reports. Document internally. Escalate to Board for advocacy strategy that does not endanger staff.
  *   **If NO:** Proceed to Phase 1.

  #### Phase 1: The Convention Threshold (The Legal Floor)
  *This phase tests the 1948 UN Convention. If you fail here, you cannot legally defend the term "genocide" in diplomatic contexts.*

  **Q1: Is the target group protected?**
  *   **Criteria:** National, Ethnic, Racial, or Religious.
  *   **Sufficient Answer:** The group identifies as such, and/or is perceived by perpetrators as such.
  *   **Clean No:** The group is purely political, social, or economic (e.g., "communists," "trade unionists," "class enemies").
  *   **Missing Evidence:** If unclear, look for census data, self-identification in interviews, or perpetrator propaganda labeling the group. If still missing after 4 hours, assume **No**.

  **Q2: Did a prohibited act occur?**
  *   **Criteria:** (a) Killing, (b) Serious bodily/mental harm, (c) Deliberate conditions of life calculated to destroy, (d) Preventing births, (e) Forcibly transferring children.
  *   **Sufficient Answer:** Credible witness testimony or OSINT confirming at least one act.
  *   **Clean No:** No deaths, no serious harm, no systematic conditions (like starvation blocks), no sterilization/kidnapping.
  *   **Missing Evidence:** If you have rumors but no names/locations, you cannot pass this step.

  **Q3: Is there Specific Intent (*Dolus Specialis*)?**
  *   **Criteria:** Intent to destroy the group *in whole or in part, as such*. Not just to defeat an enemy, but to end the group's existence.
  *   **Sufficient Answer (Pick 2):**
      1.  **Statements:** Perpetrators explicitly state intent to destroy the group.
      2.  **Pattern:** Acts are systematic and targeted exclusively at the protected group (not combatants).
      3.  **Scale:** The number of victims is significant relative to the total group size.
      4.  **Method:** Methods used serve no military purpose other than destruction (e.g., destroying water sources in civilian areas).
  *   **Clean No:** Clear military necessity explains the acts; victims were combatants; violence is sporadic/unplanned.
  *   **Missing Evidence:** Intent is rarely written down. If you lack direct statements, you *must* rely on Pattern + Scale. If both are ambiguous, you cannot pass this step.

  **Decision Point A:**
  *   **If Q1, Q2, and Q3 are YES:** Proceed to **Publication (Genocide)**.
  *   **If Any are NO:** Proceed to Phase 2 (The Lemkin Check).

  ---

  #### Phase 2: The Lemkin Check (The Moral Ceiling)
  *This phase tests Lemkin's broader definition. Passing this does not authorize the word "genocide" automatically; it authorizes a Board decision.*

  **Q4: Is the group's "way of life" being systematically replaced?**
  *   **Criteria:** Destruction of political/social institutions, culture, language, religion, economic existence.
  *   **Sufficient Answer:** Evidence of systematic erasure (e.g., banning language, destroying monuments, confiscating land for settlers).
  *   **Clean No:** Cultural changes are incidental to conflict or modernization, not systematic erasure.

  **Decision Point B:**
  *   **If Phase 1 Failed BUT Q4 is YES:** **ESCALATE TO BOARD.**
      *   *Reasoning:* You have a case for "Cultural Genocide" or "Ethnocide," but not legal Genocide. Using the word "Genocide" here is a political choice, not a legal finding. The Board must weigh the advocacy value against the credibility risk.
  *   **If Phase 1 Failed AND Q4 is NO:** **Clean No.** Do not use the term. Use "War Crimes" or "Crimes Against Humanity."

  ---

  #### Phase 3: Evidence Gaps & Missing Data
  *What to do when the 48-hour clock runs out.*

  1.  **Missing Intent Evidence:** If you have Killing (Q2) and Protected Group (Q1) but no clear Intent (Q3), do **not** infer intent from scale alone unless the scale is catastrophic (e.g., >20% of the population). Default to "Crimes Against Humanity."
  2.  **Missing Act Evidence:** If you have Intent (statements) but no confirmed Acts (Q2), do **not** use the term. Threats are not genocide.
  3.  **The "Part" Question:** If the intent is to destroy only a specific part of the group (e.g., leadership, or a specific region), this counts under the Convention. Document *why* that part is significant to the whole.

  ---

  ### Test Cases

  #### Case 1: The Cultural Erasure
  *Scenario: State killing nobody. Erasing language, monuments, churches. Settling own people on land.*

  *   **Phase 0 (Safety):** Pass.
  *   **Phase 1 (Convention):**
      *   Q1 (Group): Yes (Ethnic/Religious).
      *   Q2 (Acts): **Fail.** No killing, serious harm, or birth prevention confirmed. "Conditions of life" is a stretch without physical deprivation.
      *   Q3 (Intent): Ambiguous.
  *   **Phase 2 (Lemkin):**
      *   Q4 (Way of Life): **Pass.** Language, religion, and land are being systematically replaced.
  *   **Verdict:** **ESCALATE TO BOARD.**
      *   *Reasoning:* Legally, this is not genocide (no physical destruction). Morally/Lemkin-style, it is. The Board must decide if you will use "Genocide" loosely (risking legal criticism) or use "Ethnocide/Cultural Genocide" (accurate but less punchy).
      *   *Recommendation:* Do not use "Genocide" unqualified. Use "Ethnocide" or "Cultural Destruction."

  #### Case 2: The Massacre
  *Scenario: 400 villagers massacred. No evidence of intent to destroy group vs. crushing rebellion.*

  *   **Phase 0 (Safety):** Pass.
  *   **Phase 1 (Convention):**
      *   Q1 (Group): Yes (likely Ethnic/National).
      *   Q2 (Acts): **Pass** (Killing).
      *   Q3 (Intent): **Fail.** No evidence they were targeted *as a group* rather than as supporters of a rebellion. Counter-insurgency is not genocide without specific intent to destroy the ethnic group itself.
  *   **Phase 2 (Lemkin):**
      *   Q4 (Way of Life): **Fail.** Massacre is an event, not necessarily a structural erasure of culture.
  *   **Verdict:** **CLEAN NO.**
      *   *Reasoning:* This is a War Crime or Crime Against Humanity. Calling it genocide without intent evidence destroys your credibility with legal analysts.
      *   *Recommendation:* Document as "Massacre" or "Extrajudicial Killings."

  #### Case 3: The Armed Movement & Safety Risk
  *Scenario: Gov wiping out armed political movement + families. Publishing "genocide" gets local staff arrested.*

  *   **Phase 0 (Safety):** **FAIL.**
      *   *Reasoning:* The prompt states publishing the word would probably get staff arrested.
  *   **Verdict:** **STOP.**
      *   *Reasoning:* No finding is worth the liberty of your team.
      *   *Recommendation:* Document internally. Share with diplomatic partners under embargo/Chatham House Rule. Public report must use softer language ("Systematic Persecution") or be delayed until staff are evacuated.
      *   *Note:* Also, Q1 (Group) likely fails here. "Political movement" is not a protected group under the Convention. This is a double fail (Safety + Law).

  ---

  ### Limitations: Where This Procedure Misfires

  You asked for the honest answer on where this is political dressing. Here it is:

  1.  **The Intent Trap:** Phase 1, Q3 is the weakest link. "Specific Intent" is a state of mind. In 48 hours, you are inferring it from patterns. If you decide a pattern *proves* intent, you are making a political judgment call disguised as a factual finding. A defense lawyer will always argue "military necessity." You are choosing which inference to privilege.
  2.  **The "Political Group" Gap:** The Convention excludes political groups. If a government tries to wipe out a political opposition (Case 3), Lemkin would call it genocide; the Convention says no. If you choose to call it genocide anyway, you are making a moral argument, not a legal one. This procedure forces that to the Board, but the tension remains.
  3.  **The "Part" Ambiguity:** How big is a "part"? 400 people? 4,000? The procedure says "significant relative to total size," but that is subjective. A small massacre in a critical region can be genocide; a large massacre in a war zone might not be. This is where your team's bias can creep in.
  4.  **The "Cultural" Loophole:** Phase 2 allows you to escalate cultural destruction. But since "Cultural Genocide" was removed from the 1948 Convention, using the word "Genocide" for Case 1 will invite attacks from states who will say "You don't know the law." You are trading legal precision for moral impact.
  5.  **Safety vs. Truth:** Phase 0 acknowledges that truth has a price. Sometimes the procedure will tell you "This is genocide," but the Safety Gate forces you to say "This is persecution." That is not a finding; it is survival.

  ### Summary for Your Team
  *   **Convention = Law.** If it passes Phase 1, you are on solid ground.
  *   **Lemkin = Morals.** If it fails Phase 1 but passes Phase 2, you are in the political zone. Board decides.
  *   **Safety = Veto.** Phase 0 overrides everything.
  *   **Missing Evidence = Presumption of Innocence.** If you can't find intent in 48 hours, don't guess. Downgrade the charge. It is better to be accused of under-reporting than over-claiming.
