answer: |-
  ### The Competence/Comprehension Diagnostic Tree

  **Root Node:** Consider a system (e.g., a deep neural net or an evolved organism) that reliably produces competent outputs across a range of situations. Is it possible that it does this *without* any part of the system understanding why it is doing the right thing?
  *   **No:** Go to **Leaf 1**.
  *   **Yes:** Go to **Node 1**.

  **Node 1:** When we say such a system "understands," are we reporting a fact about its internal state, or expressing a stance we adopt to predict its behavior?
  *   **A Stance:** Go to **Leaf 2**.
  *   **A Fact:** Go to **Node 2**.

  **Node 2:** Is the difference between a system that merely competes and one that comprehends a matter of *degree* (complexity), or a difference in *kind* (mechanism)?
  *   **Degree:** Go to **Node 3**.
  *   **Kind:** Go to **Node 4**.

  **Node 3:** If it is a matter of degree, is the gradient measured by *behavioral success* or by *structural similarity* to human neural architecture?
  *   **Behavioral Success:** Go to **Leaf 3**.
  *   **Structural Similarity:** Go to **Leaf 4**.

  **Node 4:** If it is a difference in kind, does the threshold depend on the system's *causal history* (how it was selected/trained) or its *current functional organization*?
  *   **Causal History:** Go to **Node 5**.
  *   **Functional Organization:** Go to **Node 6**.

  **Node 5:** If history matters, must the history be *natural selection* (evolution), or is *artificial training* (learning) sufficient to cross the threshold?
  *   **Natural Selection:** Go to **Leaf 5**.
  *   **Artificial Training:** Go to **Leaf 6**.

  **Node 6:** If organization matters, does the function require *active bodily coupling* with the environment, or can it be realized in a brain isolated from the world?
  *   **Bodily Coupling:** Go to **Leaf 7**.
  *   **Isolated Brain:** Go to **Node 7**.

  **Node 7:** If an isolated brain suffices, does understanding require the manipulation of *internal representations* (symbols/states standing for things), or is it non-representational dynamic coping?
  *   **Non-Representational:** Go to **Leaf 8**.
  *   **Representational:** Go to **Node 8**.

  **Node 8:** If representations are required, are they *distributed patterns* of activation or *discrete, language-like* symbols?
  *   **Distributed Patterns:** Go to **Leaf 9**.
  *   **Discrete Symbols:** Go to **Node 9**.

  **Node 9:** If discrete symbols are required, does the physical *substrate* (biological vs. silicon) matter for the existence of understanding?
  *   **Substrate Matters:** Go to **Leaf 10**.
  *   **Substrate Independent:** Go to **Node 10**.

  **Node 10:** If substrate is independent, do symbols derive meaning from their *formal shape* (syntax) or their *causal connection* to the world (semantics)?
  *   **Formal Shape:** Go to **Leaf 11**.
  *   **Causal Connection:** Go to **Leaf 12**.

  ***

  ### Leaf Assignments

  **Leaf 1: Cartesian Intentionalism**
  *   **Verdict:** You reject the Darwin/Turing inversion; competence implies a prior comprehending agent.
  *   **Awkward Commitment:** You must explain how mental causation escapes the closed physical order without invoking magic.

  **Leaf 2: Instrumentalism (Dennett/Rorty)**
  *   **Verdict:** Understanding is not real; it is a predictive tool we project onto systems.
  *   **Awkward Commitment:** You cannot explain why some intentional stances are objectively better than others without smuggling in realism.

  **Leaf 3: Radical Deflationism**
  *   **Verdict:** Comprehension is just competence all the way down; "understanding" is a synonym for high-level reliability.
  *   **Awkward Commitment:** You are forced to attribute understanding to thermostats if the behavioral bar is set low enough.

  **Leaf 4: Connectionist Continuity**
  *   **Verdict:** Understanding emerges from structural similarity to human neural weights; there is no sharp line.
  *   **Awkward Commitment:** You lack a principled account of logical validity, reducing reasoning to vector transformation.

  **Leaf 5: Teleosemantics (Millikan)**
  *   **Verdict:** Understanding requires a history of natural selection fixing the function of the states.
  *   **Awkward Commitment:** You must grant understanding to simple biological mechanisms (e.g., immune systems) if they have evolutionary history.

  **Leaf 6: Unoccupied (The Training Paradox)**
  *   **Verdict:** No major position holds that artificial training history alone creates a kind-difference without functional change.
  *   **Diagnosis:** **Incoherent.** If training changes nothing functional, it is magic; if it changes function, history is redundant.

  **Leaf 7: Enactivism (Varela/Noë)**
  *   **Verdict:** Genuine understanding requires sensorimotor contingency and bodily presence in the world.
  *   **Awkward Commitment:** You struggle to account for understanding in paralyzed agents or purely abstract mathematical reasoning.

  **Leaf 8: Dynamic Systems Theory**
  *   **Verdict:** Cognition is continuous physical coupling; representation is an unnecessary theoretical fiction.
  *   **Awkward Commitment:** You cannot easily explain how we think about things that are not present (displaced reference).

  **Leaf 9: Localist Connectionism**
  *   **Verdict:** Understanding is distributed activation, but nodes function like local symbols.
  *   **Awkward Commitment:** You risk reintroducing the homunculus inside the weight assignments (the "binding problem").

  **Leaf 10: Biological Naturalism (Searle)**
  *   **Verdict:** Syntax is not semantics; only biological causation can produce genuine understanding.
  *   **Awkward Commitment:** You are committed to neuro-chauvinism: a perfect silicon duplicate of a brain would not understand.

  **Leaf 11: Classical Computational Representationalism (Fodor)**
  *   **Verdict:** Understanding is computation over explicit symbols; syntax drives the process.
  *   **Awkward Commitment:** You are vulnerable to the Chinese Room argument: syntax manipulation alone seems insufficient for meaning.

  **Leaf 12: Informational Semantics (Dretske)**
  *   **Verdict:** Understanding requires symbols to be causally covariant with what they represent.
  *   **Awkward Commitment:** You face the "disjunction problem": it is difficult to explain misrepresentation without circularity.

  ***

  ### Closing Note for the Seminar

  This instrument leans on two contested assumptions you should flag for the class before they begin. First, it assumes **understanding names a natural kind** (or a coherent stance) rather than a fragmented cluster of capacities; if a student believes "understanding" is said in many unrelated ways, the tree will force false precision. Second, Nodes 7 through 10 assume **representationalism is the default** for internalists; this marginalizes radical embodied views that deny representation entirely without denying understanding. Finally, the tree treats the **Syntax/Semantics distinction (Node 10)** as sharp, whereas many contemporary predictive processing views argue that syntax and semantics are interdependent layers of the same inference engine. If students balk at Node 10, they likely hold a view outside the classical computationalist framework.
