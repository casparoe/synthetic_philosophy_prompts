          *   In-group vs. Fantasy: In-group reclaims the power (subverts the norm). Fantasy creates a *new* norm (no historical baggage). These are different mechanisms. One is reappropriation, the other is creation. So yes, a single story can explain why they are both "fine" but for *different reasons*.

