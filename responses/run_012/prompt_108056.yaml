      *   **2. The case for the repair (~300 words):**
          *   Focus on the phenomenological constraint.
          *   When I look at my idea of a tree, I see qualities (green, tall). I don't see "mind-independence."
          *   Address the device case: The instrument report is itself a perception. The confirmation is a perception. The "tree" in the argument is always a tree-for-us.
          *   Address the defense: Verificationism. To mean "unperceived tree" is just to mean "tree I would perceive if I were there." The content is exhausted by possible experiences. Therefore, the realist's "mind-independent substrate" is empty verbiage.

      *   **3. The case against the repair (~300 words):**
          *   The epistemic/metaphysical gap. Just because I can't *see* independence doesn't mean I can't *think* it.
