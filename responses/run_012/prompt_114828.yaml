  **Viability Assessment (Pre-Prospectus Note)**

  Your core hunch is not a mess; it is a recognized philosophical position (often aligned with critiques of consequentialism in rational choice). However, your three-part split needs pruning.
  1.  **Causal:** Solid. Standard view.
  2.  **Evidential:** Weak. Decision theorists already account for past actions as *signals* of quality via Bayesian updating. If you argue past spending is evidence, they will say, "That's not honoring sunk costs; that's updating on new information." Don't build a pillar on this; it collapses into standard theory.
  3.  **Constitutive:** Strong. This is your thesis. The claim that some goods (marriage, careers) are *historically constituted* challenges the forward-looking axiom of expected utility theory.

  The risk is not that the idea is nonsense, but that it reduces to a semantic debate: "Is the value of a marriage forward-looking (future happiness) or historical (shared past)?" Decision theorists will argue you can model the "value of history" as a forward-looking preference for "having a shared past." To succeed, you must show that this modeling distorts the rationality condition itself, not just the utility function. The prospectus below reflects this narrowed, stronger focus.

  ***

  # PROSPECTUS

  **Title:** Beyond Forward-Looking Rationality: A Constitutive Defense of Sunk Cost Sensitivity

  **Research Question**
  Is the prohibition on honoring sunk costs a universal requirement of rationality, or does it depend on the substantive assumption that all value is forward-looking?
  *Determinate Answer:* The prohibition is not universal; it relies on a contestable assumption that value is exclusively forward-looking. In cases where the good at stake is historically constituted, sensitivity to sunk costs is rationally permissible.

  **Background and Literature Gap**
  The standard consensus across psychology and decision theory is that honoring sunk costs is irrational. Psychology classifies it as a cognitive bias (the "sunk cost fallacy"), a descriptive error in human processing. Decision theory classifies it as a normative violation of expected utility, arguing that rational agents should maximize future returns regardless of past investment.

  While these fields agree on the verdict, they leave the metaphysical foundations of the verdict unexamined.
  1.  **Psychology** treats the fallacy as a processing error but does not define the boundary conditions of the "choice object." It assumes the option to "continue" is identical regardless of history.
  2.  **Decision Theory** explicitly assumes causal inertness of the past. It treats the prohibition as a formal requirement of consistency.

  Both fields leave open the possibility that the *identity* of the choice object changes based on history. If a research program or a marriage is partly constituted by its history, then "quitting" does not yield the same future state as "never starting." The literature currently lacks a systematic analysis of how the metaphysics of the good at stake constrains the norms of rational choice. This project fills that gap by arguing that the sunk cost fallacy is domain-specific, not domain-general.

  **Methodology**
  This project will employ conceptual analysis and normative modeling rather than empirical cataloging. A survey of cases would only show that people *do* honor sunk costs, not that they *should*. To establish rational permissibility, I will:

  1.  **Reconstruct the Standard Argument:** Formalize the decision-theoretic proof that sunk costs are irrelevant to isolate the specific premise requiring value to be forward-looking.
  2.  **Develop a Typology of Goods:** Distinguish between "inert goods" (e.g., a movie ticket, a machine part) where history is causally irrelevant, and "constitutive goods" (e.g., a friendship, a vocation) where history is partly constitutive of the value.
  3.  **Test for Reductionism:** The primary methodological hurdle is the "preference reduction" objection. Decision theorists may argue that valuing history is just a forward-looking preference for consistency. I will construct thought experiments to show that modeling constitutive value as a future preference distorts the rational structure of the decision (e.g., by making the commitment inherently unstable).
  4.  **Derive Normative Conditions:** Formulate a condition under which sunk cost sensitivity transitions from a fallacy to a requirement of integrity or fidelity.

  **Expected Outcomes and Failure Conditions**
  *Success:* A successful thesis will demonstrate that the standard argument against sunk costs is valid only for inert goods. It will produce a clear criterion for distinguishing "fallacious" persistence from "constitutive" commitment. The result will be a qualified norm: "Ignore sunk costs unless the good is historically constituted."

  *Failure:* I will admit the project has failed if:
  1.  **Reductionism Holds:** If the "constitutive" value of a relationship can be fully modeled as a standard forward-looking preference without loss of explanatory power, the distinction collapses, and the standard decision-theoretic view wins.
  2.  **Circularity:** If defining a "constitutive good" requires presupposing the rationality of honoring sunk costs, the argument becomes circular.
  3.  **Scope Creep:** If the analysis requires solving the broader metaphysics of social objects rather than focusing on the rational choice norm, the project will be unfinishable in the timeframe.

  **Feasibility and Timeline**
  A one-semester timeline is realistic provided the scope remains strictly normative.
  *   **Weeks 1-3:** Reconstruction of the standard decision-theoretic argument and identification of the forward-looking axiom.
  *   **Weeks 4-7:** Development of the "constitutive goods" counter-examples and defense against the reductionist objection.
  *   **Weeks 8-10:** Drafting the normative framework and refining the success/failure criteria.
  *   **Weeks 11-12:** Revision and final polish.

  The risk is attempting to solve the metaphysics of social objects. I will avoid this by treating the constitutive nature of certain goods as a plausible premise for the sake of argument, focusing my energy on the *implications for rationality* rather than proving the metaphysics from scratch. This keeps the project within the bounds of a semester-long honours thesis.
