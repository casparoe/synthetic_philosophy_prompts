answer: |-
  This is a magnificent problem to have as a writer. You have stumbled into one of the oldest, sharpest fights in moral philosophy and welfare economics without tripping over the usual beginner errors. You know about Ramsey (who called pure time preference "ethically indefensible"), you know about the block universe, and you know that your position risks being a rationalization for impatience.

  Your co-author thinks you've lost your mind because, in the mainstream of modern moral philosophy (particularly the longtermist and effective altruist circles your character inhabits), Pure Time Preference (PTP) is heresy. But heresy isn't falsehood.

  You asked for the case against you, ranked by severity. You want to know what should make you abandon the view versus what is merely embarrassing. I will structure this as a briefing from a hostile philosophical consultant hired by your co-author.

  Here is the case against Pure Time Preference, ranked from fatal to venial.

  ---

  ### 1. The Fatal Blow: The Argument from Impartiality (Parfit's Bomb)
  **Severity:** Abandon the view.
  **The Core:** If PTP is true, you are endorsing discrimination based on a morally arbitrary characteristic.

  This is the deep version of the spatial analogy you already know. It's not just "why is time different from space?" It is "why is *date of birth* a valid criterion for moral worth?"

  Imagine two people, Alice (born 2025) and Bob (born 2125). They have identical lives, identical suffering, identical joy. The only difference is their location on the timeline. If you apply a pure discount rate, you are saying that alleviating Alice's suffering is *intrinsically* more important than alleviating Bob's, solely because Alice is closer to your specific coordinate in time.

  Derek Parfit, in *Reasons and Persons*, dismantled this. He argued that "when" a person lives is as morally arbitrary as "where" they live or what their genetic code is. To care less about Bob is to treat time as a form of caste.

  **Why this hurts your character:** Your character runs a *charitable* endowment. Charity implies impartial benevolence. If she admits to PTP, she must admit that she is structurally biased against the poor of the future. She isn't just managing risk; she is actively valuing future humans less than present humans *by definition*.

  **The Only Defense:** You must reject the principle of impartiality. You must argue that we are *permitted* to be partial to our temporal contemporaries, just as we are permitted to be partial to our children over strangers. But if you do that, you are no longer running a universal charitable endowment; you are running a club for the current generation.

  ### 2. The Smoking Gun: The Past/Future Asymmetry
  **Severity:** Abandon the view (or rename it).
  **The Core:** You said you don't discount the past. This proves your view isn't about time; it's about agency.

  You noted: *"A bad thing that already happened doesn't matter less to me because it's over."*

  This is the strongest evidence for your co-author's claim that you are rationalizing. Pure time preference implies a symmetry of valuation across the timeline. If the "distance" in time is what reduces value, then a tragedy 100 years ago should matter less than a tragedy yesterday. But you (and almost everyone) feel that a past tragedy is fixed and its badness is eternal.

  If you discount the future but not the past, your discount rate isn't a function of $t$ (time). It is a function of $c$ (causal leverage).

  **Why this hurts your character:** It suggests her philosophy is a lie she tells herself. She doesn't actually believe future goods are worth less. She believes *unactionable* goods are worth less (or that dwelling on them is useless). If she admits this, she isn't a proponent of Pure Time Preference; she is a pragmatist. PTP claims the value *itself* diminishes. Pragmatism claims our *ability to affect* it diminishes.

  **The Concession:** If you keep PTP, you must explain why time's arrow affects value but not truth. This requires a very specific, controversial metaphysics (see point 3). If you can't explain the asymmetry, you must concede that what you call "Pure Time Preference" is actually "Discounting for Powerlessness."

  ### 3. The Metaphysical Tax: The "Moving Spotlight" Requirement
  **Severity:** Heavy burden of proof.
  **The Core:** Your view requires a specific, minority theory of time to be coherent.

  You asked which metaphysics your view needs.
  *   **Eternalism (Block Universe):** Past, present, and future all exist equally. "Now" is just an indexical, like "here." In this view, PTP is indefensible. Saying the future matters less because it is future is like saying people in London matter less because they are "there."
  *   **Presentism:** Only the present exists. The future is literally nothing. In this view, PTP is too generous. If the future doesn't exist, it shouldn't have *some* value; it should have *no* value until it becomes present.

  **The Trap:** Your view sits comfortably only in the **Moving Spotlight Theory**. This is the view that the past and future exist, but there is an objective property of "presentness" that moves along the timeline, illuminating moments. This "light" makes the near future "brighter" (more valuable) than the far future.

  **Why this hurts your character:** Physics (specifically Relativity) does not like the Moving Spotlight. It suggests a privileged "now" that science cannot find. To hold PTP, your character must be a metaphysical realist about the "flow" of time in a way that contradicts much of modern physics. She isn't just an economist; she is a mystic about time.

  ### 4. The Mathematical Silence: The "Tycoon" Problem
  **Severity:** Practical contradiction.
  **The Core:** A positive pure discount rate mathematically silences the far future.

  You mentioned the math. Let's be specific. If you discount at even a modest 1% pure rate per year:
  *   A benefit occurring 1,000 years from now is worth $0.00004$ of the same benefit today.
  *   A benefit occurring 10,000 years from now is effectively zero.

  This isn't just a consequence; it is a silencing mechanism. If your endowment is "long-horizon," PTP makes that a lie. With PTP, a "long-horizon" fund is functionally indistinguishable from a "50-year" fund. It renders existential risk mitigation (preventing human extinction in 10,000 years) mathematically irrational compared to minor welfare improvements today.

  **Why this hurts your character:** It creates a tension between her job description and her philosophy. If she truly believes PTP, she should spend the endowment aggressively now. If she preserves the capital for the long term, she is acting against her own discount rate. She is hoarding value for people she believes are worth less.

  **The Counter-Argument (and why it's weak):** Some argue this is a *feature*, not a bug. It prevents "fanaticism" where we sacrifice everything for the infinite future. But for a *charitable* endowment, this looks like negligence. It implies that preventing the permanent extinction of humanity is worth less than curing a headache for a million people today.

  ### 5. The Unfalsifiability Trap: The "Mild Rate" Retreat
  **Severity:** Embarrassing (Methodological).
  **The Core:** You suspected this yourself.

  You wrote: *"I quietly retreat into 'well, it's a mild discount rate, not a big one.'"*

  This is the death of the theory. If the discount rate $\delta$ is not derived from a first principle (like risk or interest), but is instead tuned until the results match your moral intuitions, it is not a philosophical position. It is curve-fitting.

  *   If $\delta = 0$, you are a longtermist.
  *   If $\delta = 0.1$, you are a moderate.
  *   If $\delta = 0.5$, you are a hedonist.

  If you choose $\delta$ simply because it makes the math output the answers you already felt were right, you haven't solved the problem. You've just parameterized your bias.

  **Why this hurts your character:** It makes her look intellectually dishonest. A serious defender of PTP must be able to state *why* the rate is 1% and not 0.1% without referencing the outcome. If she can't, she is guessing.

  ---

  ### The Verdict: Has the position been qualified into unfalsifiability?

  **Yes.**

  Here is the honest truth you asked for: In professional philosophy and welfare economics, Pure Time Preference is almost universally rejected as a *normative* claim. It is accepted as a *descriptive* claim (humans *do* discount the future), but rejected as a *prescriptive* one (humans *ought* to).

  The reason it survives is exactly as you suspect: it is a "get out of jail free" card for ignoring the demandingness of the far future. It allows us to feel like good people without having to sacrifice everything for the next millennium.

  **However, as a novelist, here is where your character can still win:**

  She can defend the view not on moral grounds, but on **epistemic** grounds.
  She can argue: *"I do not discount the future because it is worth less. I discount it because I know less."*

  This is not Pure Time Preference. This is **Uncertainty Discounting**.
  *   We don't know what future people will value.
  *   We don't know if our interventions will have side effects.
  *   We don't know if civilization will survive.

  If she pivots to this, she saves her sanity. She can tell your co-author: *"I am not saying a future life is worth less. I am saying my ability to reliably create that value decays over time."*

  This avoids the Parfit discrimination objection (it's about our knowledge, not their worth). It explains the Past/Future asymmetry (we can't change the past, and we know what happened; we can change the future, but we don't know how). It fits the math (uncertainty compounds over time).

  **Summary for your book:**
  If she sticks to **Pure** Time Preference (value decays just because time passes), she is ethically vulnerable, metaphysically costly, and likely rationalizing her own powerlessness.
  If she pivots to **Epistemic** Time Preference (value decays because certainty decays), she is pragmatic, defensible, and much harder to defeat.

  The tragedy of the character might be that she *knows* the Pure view is indefensible, but she *needs* to believe it to sleep at night, because the Epistemic view requires admitting she is just guessing in the dark. That is a very human conflict.
