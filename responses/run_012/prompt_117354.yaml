      *   *The "Discrimination" Objection (Parfit):* Treating people differently based solely on *when* they are born is like treating them differently based on *where* they are born. This is the spatial analogy the user mentioned. *Severity: High.*
      *   *The "Tyranny of the Present" Objection:* If we discount heavily, we ignore catastrophic long-term risks (climate change, AI). If we discount mildly, we still ignore *very* long term. *Severity: High (practical consequences).*
      *   *The Metaphysical Objection:* Eternalism vs. Presentism. If Eternalism is true, "now" is indexical. Why privilege *this* index? If Presentism is true, the future doesn't exist, so how can it have value to discount? *Severity: Medium-High (foundational).*
