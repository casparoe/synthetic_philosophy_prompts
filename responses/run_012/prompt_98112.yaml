      **The Puzzle**
      Socrates famously denied akrasia was possible: if you truly know the better course, you cannot choose the worse. To do so implies a contradiction within the agent—holding a judgment while acting against it. This makes weakness of will look like a logical impossibility. Enter hyperbolic discounting. Economists propose that we value immediate rewards disproportionately higher than future ones, causing preferences to reverse as deadlines approach. This model promises to dissolve the paradox. It suggests there is no contradiction, only a predictable shift in valuation over time. The puzzle of how one can act against one's best judgment is recast as a mathematical inevitability of temporal perspective.

      **Where they seem to meet**
      Phenomenologically, the fit is compelling. Consider the dieter who resolves to abstain on Monday but eats cake on Friday. In the philosophical tradition, this is weakness of will: the agent abandons a prior rational commitment for immediate gratification. In the economic model, this is preference reversal caused by a steep discount curve. Both accounts describe the same arc: a stable long-term plan overturned by a volatile short-term impulse. By identifying weakness of will with present bias, we naturalize the vice. It ceases to be a mysterious failure of rationality and becomes a feature of human temporal architecture. The "better judgment" at t1 aligns with the larger-later reward, while the action at t2 aligns with the smaller-sooner spike. This reduction saves the phenomenon without positing a fractured soul. It suggests we are not irrational globally, merely time-inconsistent. Thus, hyperbolic discounting appears to provide the mechanistic substrate for the philosopher's moral observation, validating the reality of weakness while stripping it of its paradoxical sting.

      **Where they come apart**
      However, this identification collapses under structural scrutiny. The core of akrasia is synchronic: at the moment of action, the agent judges Y best but does X. Hyperbolic discounting is fundamentally diachronic: at the moment of action, the utility function dictates that X *is* best. The preference actually flips. If your valuation changes, you are not acting against your judgment; your judgment has changed. There is no weakness, only inconsistency. Furthermore, akrasia involves second-order desires—the desire not to desire the cake. Discounting models first-order utility gradients; it measures the strength of the want, not the reflective endorsement of it. A hyperbolic discounter simply wants the cake more at t2. An akratic agent wants the cake but wishes they didn't.

      The sophistication distinction deepens the rift. A sophisticated agent knows their future self will cave and buys a commitment device. This treats the future self as an adversary to be bound, not a weak will to be strengthened. This implies a fragmentation of agency incompatible with the unified subject required for traditional akrasia. If discounting explains the *cause* of the shift, it eliminates the normative conflict required for the *definition* of weakness. You cannot be weak against a preference you no longer hold. Thus, discounting explains why plans change, but it dissolves the specific tension of acting against a standing better judgment.

      **My verdict**
      My verdict is that they are category distinct. Hyperbolic discounting explains preference reversal; akrasia explains normative conflict. Conflating them commits a category error by reducing a normative puzzle to a mechanical description. Discounting dissolves akrasia rather than illuminating it.

      The strongest objection is that this returns us to the Socratic trap: if discounting shows preferences flip, then true akrasia (acting against a standing judgment) never happens. We are never weak, just changing.

      My reply is that akrasia survives if we distinguish evaluative judgment from motivational force. I can judge salad best (evaluation) while the cake exerts greater motivational force (discounting). Discounting models the force, not the judgment. Therefore, discounting is the engine of temptation, but akrasia is the failure to align action with enduring evaluation despite that engine. They are complementary, not identical. Discounting tells us how the wind blows; akrasia tells us why we failed to hold the helm.

