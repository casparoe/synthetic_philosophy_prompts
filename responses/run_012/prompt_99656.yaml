answer: |-
  Here is a decision procedure designed for your specific constraints (40 words, no footnotes, dual review), followed by the application to your three cases, and finally an epistemological audit of the method itself.

  ### Part I: The Causal Decision Procedure for Museum Labels

  This procedure converts philosophical distinctions into editorial checks. Run these steps in order for every label.

  **Step 1: Fix the Contrast (The "Rather Than" Test)**
  You cannot name a cause without knowing what you are explaining *instead of*. Write this down privately before drafting.
  *   *Formula:* "Why did Event X happen *at this time/in this way* rather than *not happening/ happening later/ happening differently*?"
  *   *Decision Point:* If you and your colleague choose different contrasts, you will argue past each other.
      *   *Example:* "Why violence *now*?" (Looks for trigger) vs. "Why violence *at all*?" (Looks for structural tension).
  *   *Rule:* The contrast must be explicit in the text or unmistakably implied by the artifact shown.

  **Step 2: Map the Candidates (The INUS Check)**
  List the potential factors (A, B, C). Test each against the outcome (E).
  *   **Necessary:** If not-A, then not-E? (The *but-for* test).
  *   **Sufficient:** If A, then definitely E? (Regardless of B or C).
  *   **INUS Condition:** Is A an *I*nsufficient but *N*ecessary part of a condition which is itself *U*nnecessary but *S*ufficient?
      *   *Plain English:* A alone couldn't do it, but within a specific package of factors (A+B+C), A was required to make that package work.
      *   *Usage:* This is the standard historical "cause." It validates "multiple causes" without cowardice. It says: "This factor was essential to the specific combination that produced the result."

  **Step 3: Check for Overdetermination vs. Preemption**
  *   **Overdetermination:** Are there two factors (A and B), either of which was *sufficient* on its own to cause E?
      *   *Diagnosis:* The *but-for* test fails for both. (If not-A, B still causes E).
      *   *Verdict:* Do not name a single cause. Use plural verbs or structural language.
  *   **Preemption:** Did A cause E, but B *would have* if A hadn't acted first?
      *   *Diagnosis:* A cuts off the causal chain of B.
      *   *Verdict:* Name A. B is context, not cause.
  *   **Hedging:** Are you saying "A might have caused it, or maybe B"?
      *   *Diagnosis:* You lack evidence to distinguish.
      *   *Verdict:* State the uncertainty. "Historians debate whether..."

  **Step 4: Select the Verb (The Strength Hierarchy)**
  Match your findings from Steps 2 & 3 to this ranked vocabulary. Do not mix levels.

  1.  **Triggered / Precipitated** (Strongest)
      *   *Bar:* Necessary and Sufficient (or very close). The immediate spark.
      *   *Use:* For the final event in a chain (e.g., the shot, the vote).
  2.  **Drove / Caused**
      *   *Bar:* Strong INUS condition. Without this, the outcome likely fails or looks radically different.
      *   *Use:* For primary structural forces.
  3.  **Accelerated / Deepened**
      *   *Bar:* Contributory INUS. Changed the timing or intensity, but the trend existed before.
      *   *Use:* For factors that made a bad situation worse.
  4.  **Enabled / Coincided with** (Weakest)
      *   *Bar:* Background condition. Necessary but remote (e.g., oxygen for fire).
      *   *Use:* For context that must be acknowledged but shouldn't be blamed/credited.

  **Step 5: The Word Count & Review Check**
  *   *Constraint:* 40 words.
  *   *Rule:* If you must list three INUS conditions, you cannot use "Caused" for all three. Use one strong verb for the primary driver, and subordinate the others ("amidst," "while," "during").
  *   *Handoff:* If Step 1 (Contrast) or Step 4 (Verb Strength) feels ambiguous, the procedure stops. This is no longer a factual question; it is a curatorial judgment about what story the gallery tells. Mark this for your advisory board.

  ***

  ### Part II: Application to Your Three Labels

  Here is the procedure applied to your specific drafts.

  #### Case 1: The Violence (Mob, Rumor, Police, Newspaper)
  *   **Analysis:**
      *   *Contrast:* Why violence *on this night* rather than peace? (Focus on trigger).
      *   *Tests:* The Newspaper Campaign created hostility (Background/Enabled). The Rumor provided the pretext (INUS). The Police Withdrawal removed the barrier (INUS). The Mob provided the agency (Necessary).
      *   *Overdetermination?* No. Without the mob, no violence. Without the rumor, the mob might not have gathered *then*. Without police withdrawal, the mob might have been stopped. This is a causal chain, not overdetermination.
      *   *Verb:* "Precipitated" (Rumor) or "Allowed" (Police).
  *   **Draft Label (39 words):**
      > "A false rumor of assault **precipitated** the violence, mobilizing a crowd already angered by newspaper campaigns. When police withdrew protection, the mob's aggression went unchecked. This convergence of media incitement and official abandonment **transformed** local tension into coordinated attack on immigrant homes."

  #### Case 2: The Industry Collapse (Tariff, Tech, Strike, Fire)
  *   **Analysis:**
      *   *Contrast:* Why did the industry *end* rather than *shrink*?
      *   *Tests:* Tariff (Background/Enabled decline). Tech shift (Drove obsolescence). Strike (Accelerated financial ruin). Fire (Triggered final closure).
      *   *Overdetermination?* Plausible. If the Tech shift made the product unsellable, the Fire didn't matter long-term. If the Fire destroyed the only factory, the Tech shift didn't matter immediately.
      *   *Decision:* If the Tech shift made recovery impossible even without the Fire, the Fire is Preempted (it happened first, but Tech was the real killer). If the Fire destroyed capital needed to adapt to Tech, they are INUS conditions working together.
      *   *Honest Verdict:* Likely INUS cluster.
  *   **Draft Label (40 words):**
      > "New technology **undermined** the market, while a tariff change **reduced** profits. A long strike drained reserves, leaving factories vulnerable. When a fire destroyed the main plant, owners lacked capital to rebuild. These combined pressures **forced** the industry's permanent closure."

  #### Case 3: The Reformer (Ending the Trials)
  *   **Analysis:**
      *   **Your Desire:** Credit the Reformer.
      *   **The Test:** Was the Reformer *Necessary*? (But-for the Reformer, would trials have continued?)
      *   **Reality:** In 1907, legal systems had internal momentum. Public fatigue, cost, and political shifts were also sufficient to end the trials. The Reformer is likely an INUS condition, not a Necessary one.
      *   **Overdetermination:** High. Political pressure + Cost + Reformer = End. Any two might have sufficed.
      *   **Honest Verdict:** You cannot say the Reformer "Ended" the trials if the system was already collapsing. You must use a verb that credits *influence* without claiming *necessity*.
      *   **Verb:** "Persuaded," "Urged," "Catalyzed." Not "Caused."
  *   **Draft Label (38 words):**
      > "Public fatigue and rising costs **threatened** the trials' continuation. A local reformer **catalyzed** the final dismissal, leveraging this sentiment to pressure prosecutors. While structural factors made conviction unlikely, her intervention **accelerated** the legal conclusion and secured the defendants' release."

  ***

  ### Part III: Epistemological Audit (Settled vs. Contested)

  You asked where this procedure rests on consensus and where it rests on contested philosophy. If your colleague or the academic reviewer challenges the method, these are the fault lines.

  **1. The Contrastive Nature of Causation (Settled Pragmatically, Contested Metaphysically)**
  *   *The Procedure:* Step 1 forces you to choose a contrast ("Why X rather than Y?").
  *   *Consensus:* Among historians and social scientists, it is widely accepted that causal selection is interest-relative. We pick causes based on what we find abnormal or relevant (Hart & Honoré; Van Fraassen).
  *   *Contestation:* Metaphysical realists argue causation exists in the world independent of human questions. If your reviewer holds this view, they may argue Step 1 is subjective manipulation.
  *   *Defense:* In a museum label, you are communicating with a human audience. Interest-relativity is a feature, not a bug. Acknowledge this in your methodology statement.

  **2. Counterfactual Dependence (The "But-For" Test)**
  *   *The Procedure:* Step 2 & 3 rely on "If not-A, then not-E."
  *   *Consensus:* This is the dominant framework in law and analytic philosophy (David Lewis).
  *   *Contestation:* Process theorists argue that tracing the physical transfer of energy/momentum is more accurate than counterfactuals. In history, we cannot rerun the world, so counterfactuals are always speculative.
  *   *Risk:* Step 3 (Overdetermination) breaks the *but-for* test. If two causes suffice, neither is *but-for* necessary.
  *   *Fix:* The procedure handles this by shifting to INUS language (Step 2). If your reviewer insists on strict counterfactuals, you must admit overdetermination creates "causal gaps" in the logic.

  **3. Narrative Explanation vs. Scientific Law**
  *   *The Procedure:* Assumes we can isolate variables (Tariff vs. Fire).
  *   *Contestation:* Some historians (narrativists) argue that historical explanation is not about isolating causes but about telling a coherent story where the outcome feels inevitable in retrospect. They might argue Step 2 (mapping candidates) atomizes a holistic event.
  *   *Risk:* Your colleague's "Name the Cause" demand is a narrative impulse (stories need protagonists/antagonists). Your "Overdetermination" stance is an analytical impulse.
  *   *Resolution:* The procedure splits the difference. Use Narrative verbs ("Triggered") for the plot, but Analytical verbs ("Enabled") for the context.

  **4. The Selection of the Cause (The "Handoff")**
  *   *The Procedure:* Step 5 marks where the method stops and judgment begins.
  *   *Consensus:* There is no algorithmic way to decide *which* INUS condition is the "most important." That is a value judgment (Mackie).
  *   *Contestation:* Some argue salience is objective (the biggest energy input); others argue it is purely normative (what we care about).
  *   *Your Move:* This is where you invite the Community Advisory Board. Asking "Which factor matters most to your community's memory?" is a valid methodological step, not an abdication.

  ### Summary of Advice for Your Colleague
  Your colleague is correct that labels need clarity, but wrong that clarity requires singularity. Your position is correct that overdetermination exists, but risky if it leads to vague text.
  *   **Do not say:** "Many factors caused this." (This is the "coward's formula" they hate).
  *   **Do say:** "Factor A **triggered** the event, while Factors B and C **made it possible**."
  *   **Why:** This uses the verb hierarchy to assign weight without denying complexity. It satisfies the demand for a "nameable cause" (the trigger) while respecting the historical reality of INUS conditions.

  This procedure allows you to defend your text not by seniority, but by showing the work. If they challenge a verb, ask them to run Step 4. If they challenge the focus, ask them to define the Contrast (Step 1). This moves the argument from "Who is right?" to "What does the evidence support?"
