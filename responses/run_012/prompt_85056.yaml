      *   *Refining Sentence 4:* Emphasize the difference between *doubt* (Descartes) and *abstraction/bracketing* (Avicenna). Avicenna doesn't doubt the body exists; he imagines it absent from perception.
      *   *Refining Sentence 5:* "Obscures" is okay, but "distracts" might be better. Avicenna thinks self-awareness is constant.

  6.  **Final Review against Constraints:**
      *   Audit claim by claim? Yes.
