answer: |-
  Here are the desiderata for an account of letter-identity, pinned to your *Letter Spirit* working spec.

  ### The Desiderata List

  **1. Topological Agnosticism (The Allograph Constraint)**
  *   **The Case:** A double-storey `a` (closed loop, vertical spine) and a single-storey `ɑ` (open loop, curved spine) share almost no geometric features. A blackletter `a` shares even less. Yet all map to the same graphemic identity.
  *   **The Requirement:** The account must define identity via abstract relational features (e.g., "closed counter above baseline," "stem on right") rather than specific stroke topology or pixel similarity. It must allow multiple, topologically distinct shapes to map to one ID.
  *   **Status:** **Non-negotiable.** (Failure here means the program cannot generate a single font family containing both standard and italic 'a's, or mix sans and serif structures.)

  **2. Directional Sensitivity (The Chirality Constraint)**
  *   **The Case:** Rotate a cup 180°; it is a cup. Rotate `b` 180°; it is `q`. Mirror `b`; it is `d`. Object recognition is generally view-invariant; letter recognition is not.
  *   **The Requirement:** The account must ground identity in a fixed coordinate system (baseline, x-height, left-to-right vector). It must explain why symmetry operations that preserve object identity destroy letter identity. (Explanation: Letters are symbols in a directional coding system, not 3D objects; their orientation encodes distinct values.)
  *   **Status:** **Non-negotiable.** (Failure here means the program emits `d` when asked for `b`, breaking the alphabet's utility.)

  **3. System-Relative Identity (The Homoglyph Constraint)**
  *   **The Case:** Latin `a` and Cyrillic `а` are often geometrically identical. They are different letters. Conversely, you can read a Latin `a` in a font you've never seen before.
  *   **The Requirement:** Identity cannot be intrinsic to the shape alone. The account must treat letterhood as a relation: `Identity = Shape + Alphabet System`. It must allow the same shape to be an `a` in System L and not-an-`a` (or a different letter) in System C, while still permitting generalization to new shapes within System L.
  *   **Status:** **Non-negotiable.** (This is the hard stop. Purely visual theories fail here immediately.)

  **4. Generative Generalization (The Novelty Constraint)**
  *   **The Case:** You can read a typeface you have never encountered. Therefore, identity cannot be defined as "membership in the set of previously seen `a`s."
  *   **The Requirement:** The account must rely on generative rules or abstract prototypes, not exemplar memory. It must define the *space* of possible `a`s, not just list existing ones.
  *   **Status:** **Non-negotiable.** (Required for the *Letter Spirit* goal of inventing *new* alphabets.)

  **5. Separation of Style and Category (The Grid/Spirit Constraint)**
  *   **The Case:** "This is an `a`" is a different judgment from "This is an `a` *in the style of this grid*." A highly stylized `a` might fit the style perfectly but cease to be readable as `a`.
  *   **The Requirement:** The account must posit two distinct parameter sets: one for **Graphemic Identity** (is it an `a`?) and one for **Stylistic DNA** (does it match the other letters?). These parameters must be separable but interactive (style can stretch identity to its breaking point).
  *   **Status:** **Non-negotiable.** (This is the core mechanism of *Letter Spirit*. Collapse them, and you either get boring repetition or unreadable art.)

  **6. Contextual Modulation (The Disambiguation Constraint)**
  *   **Case:** `l` (lowercase L), `I` (uppercase i), and `1` (one) are often identical shapes. In isolation, they are ambiguous. In a word (`_ight` vs `_ook`), they are distinct.
  *   **Requirement:** The account must allow identity to be probabilistic in isolation and deterministic in sequence. It cannot claim the shape *alone* always carries full identity information.
  *   **Status:** **Preference of Reading Researchers / Non-negotiable for Robustness.** (A program working on isolated grids must impose a "default system" to resolve this, but the theory must acknowledge the ambiguity.)

  **7. Tolerance for Degradation (The Gradedness Constraint)**
  *   **Case:** A smudged `a` is a bad `a`. A shape 51% toward `d` is... what?
  *   **Requirement:** The account must specify whether there is a fact of the matter at the boundary. If it claims a sharp line exists, it must define the metric. If it claims vagueness, it must explain how the program makes a binary decision (emit/reject) based on a fuzzy input.
  *   **Status:** **Preference of Phenomenologists vs. Non-negotiable for Program Spec.** (Human perception is graded; your program spec requires a binary decision. The theory must bridge this gap.)

  **8. Functional Equivalence (The Boundary Case Constraint)**
  *   **Case:** Ligatures (`æ`), ampersands (`&`), long `s` (`ſ`). Are these letters?
  *   **Requirement:** The account must define letterhood by functional role (does it occupy a slot in the cipher?) rather than visual form alone. `ſ` is an `s`; `&` is a ligature of `e` and `t` but functions as a symbol.
  *   **Status:** **Preference of Type Designers / Historians.** (Less critical for a basic alphabet generator, but essential for a complete theory of script.)

  ***

  ### The Killer Constraint

  **System-Relative Identity (The Homoglyph Constraint)** does the most excluding work.

  *   **Why:** It immediately falsifies any theory based on **Pure Shape Similarity** (obviously) but also damages **Descent/Evolutionary Accounts**. If identity were purely historical descent, the Cyrillic `а` (derived from Greek Alpha, like Latin `a`) might be excused, but the theory struggles with why identical shapes in *concurrent* systems are distinct.
  *   **Impact:** It forces the account to admit that visual data is insufficient. You cannot build a "letter recognizer" that looks *only* at the pixel array. It must have an external "System ID" switch. This complicates the *Letter Spirit* program: the program cannot just "look" at its own output to verify it; it must check the output against the active system rules. It kills the idea that letterhood is an intrinsic property of the ink.

  ***

  ### The Inconsistency Flag

  **Binary Decision (Spec A)** vs. **Tolerance for Degradation (Gradedness)**

  *   **The Conflict:**
      *   **Spec A** demands the account enable a program to *decide* for any shape whether it is an `a`. This implies a sharp boundary (True/False).
      *   **Gradedness** acknowledges that perceptual identity is continuous (a shape can be "more `a`-like" or "51% `d`"). Reading researchers and phenomenologists will argue there is *no* fact of the matter at the boundary; it is a zone of ambiguity resolved by context or observer state.
  *   **Why they can't be satisfied at once:**
      *   If the account posits a **sharp boundary** to satisfy the Program Spec, it contradicts the empirical reality of human reading (where boundaries are fuzzy and context-dependent). It claims a precision that doesn't exist in the phenomenon.
      *   If the account posits **fuzzy boundaries** to satisfy the Phenomenology, it fails the Program Spec. A generative program cannot emit a "fuzzy letter." It must draw a line somewhere to stop generating. If the theory says "there is no line," the program has no justification for where it stops.
  *   **Consequence:** You will have to choose between a theory that matches human perception (and can't strictly underwrite a binary generator) or a theory that underwrites the generator (and falsely idealizes human perception as crisp). *Letter Spirit* essentially hacks this by letting the "Spirit" (style consistency) act as the tie-breaker for the binary decision, but the theoretical tension remains.
