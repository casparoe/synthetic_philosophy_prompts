  Here is the breakdown of your tutor's position, the prediction for your case, and the test to prove it.

  ### 1. Prediction on the Lab Meeting
  **Verdict:** She will say this is **not a convention.**

  **Reasoning:** Your description of the lab meeting hits the exact same barrier as the **Laundry** and **Bins** cases. In those cases, she ruled "not a convention" because the regularity was dictated by an external constraint (council schedule, lock times) rather than by the group's interdependent expectations.

  In your lab case, you state: *"2pm Wednesday is the only slot when the PI, the microscope and the whole group are all free."*
  If there is literally no alternative regularity that would have worked (i.e., Thursday is impossible), then the group isn't coordinating on a solution; they are submitting to a necessity. For your tutor, following a necessity isn't a convention, even if there are mutual expectations. The sanction (the PI's earful) is a secondary feature, but the lack of an alternative is the dealbreaker.

  ### 2. Which Theory is She Running?
  She is running **(a) Proper Lewis.**

  Here is why the other two are eliminated by her own examples:

  *   **Hypothesis (b) is eliminated by the Laundry Case.**
      *   **Theory (b)** claims conventions can exist *"even if it's the only thing anyone could sensibly do."*
      *   **Tutor's Verdict:** In the Laundry case, doing washing on Sunday was the *only* thing anyone could sensibly do (room locked otherwise). She explicitly called this **not a convention**.
      *   **Conclusion:** She requires an alternative regularity to be possible. Theory (b) is dead.

  *   **Hypothesis (c) is eliminated by the Driving Case.**
      *   **Theory (c)** claims conventions can't be held up by sanctions/pressure (*"if the only reason you conform is that you'll get grief... it isn't a convention"*).
      *   **Tutor's Verdict:** She calls driving on a specific side a **convention**. Driving is enforced by law (fines, points, prison) and social pressure (near-misses, anger).
      *   **Conclusion:** She accepts that conventions can be sanctioned. Theory (c) is dead.

  *   **Why (a) Fits:**
      *   **Lewis's Definition:** Requires a coordination problem, mutual expectation, common knowledge, and crucially, **arbitrariness** (there must be at least one alternative regularity that could have solved the problem instead).
      *   **Positive Cases:** Driving, Money, Language, Escalators all have alternatives (drive left/right, use shells/paper, stand left/right).
      *   **Negative Cases:** Lecture (physical affordance), Bins (external schedule), Laundry (physical constraint) all lack arbitrariness or interdependent motivation.
      *   **Lab Meeting:** Lacks arbitrariness (only one slot). Fits the "Not a Convention" verdict perfectly under Lewis.

  ### 3. Is There Underdetermination?
  There is a slight shadow of doubt. While (a) is the clear winner, there is a potential **fourth rule (d)** lurking: *"Conventions must be informal/bottom-up, not dictated by authority."*

  *   **Why it survives:** You might argue the Driving case is "societal law" (which feels different from a PI's rule), and the Escalator is purely informal. The Lab Meeting is a formal local rule.
  *   **Why it's unlikely:** Lewis explicitly allows for authority to create *salience* (e.g., a traffic commissioner declaring the driving side). If your tutor is a Lewisian, she should accept that a PI can make a time salient. However, because the Lab Meeting *also* lacks an alternative, we can't be 100% sure if she's rejecting it because of the **Constraint** (Lewis) or the **Authority** (Rule d).

  ### 4. The Decisive Test Case
  To settle whether she is a pure Lewisian (a) or secretly holds the "No Authority" view (d), you need to remove the Constraint but keep the Authority.

  **The Case: "The Arbitrary PI"**
  > Imagine the same lab group. However, this time, **both** Wednesday 2pm **and** Thursday 10am are completely free for the PI, the microscope, and the group. There is no physical constraint. The PI flips a coin, declares "We will meet Wednesdays at 2pm," and says anyone who misses gets an earful. Everyone expects everyone else to be there.

  **How the theories predict:**

  *   **(a) Proper Lewis:** **Convention.**
      *   *Why:* There is now an **alternative regularity** (Thursday). The solution is arbitrary. The PI's declaration just makes the choice salient (like a traffic law). The sanction doesn't disqualify it (see: Driving).
  *   **(d) No Authority/Informal Only:** **Not a Convention.**
      *   *Why:* Even though it's arbitrary, it was *dictated* top-down by a boss, not emerged bottom-up from the group's mutual adjustments (like the Escalator).
  *   **(b) Lewis minus Alternatives:** **Convention.**
      *   *Why:* (Already eliminated by Laundry, but for completeness) It has mutual expectation.
  *   **(c) No Sanctions:** **Not a Convention.**
      *   *Why:* (Already eliminated by Driving, but for completeness) There is a sanction (earful).

  **What to ask her:**
  *"If the microscope was free on Thursdays too, but the PI just picked Wednesday arbitrarily and still enforced it, would that be a convention?"*

  *   If she says **Yes**: She is a committed Lewisian (a). The "Not a Convention" verdict on the original lab meeting was purely about the lack of alternatives.
  *   If she says **No**: She is running a hybrid view (Lewis + Informal Emergence). She thinks conventions must grow organically, not be assigned by a boss, even if arbitrary.

  ### Summary of Commitments
  *   **If she sticks with Lewis (a):** She is committed to the idea that **necessity kills convention.** If you *must* do X because of the world (locks, schedules, physics), it's not a convention, even if we all expect it. Conventions are fundamentally about *contingency*.
  *   **If she chooses the "No Authority" route:** She is committed to the idea that **power kills convention.** If a boss dictates it, it's a rule/norm, not a convention, even if the choice was arbitrary.

  Given her reliance on the Laundry/Bins examples (which emphasize constraint over authority), I'd bet money she's a **Lewisian (a)**. The Lab Meeting is not a convention because it's the *only* way the lab can function, not because the PI is bossy.
