prompt: |-
  Right, so I'm in third year and I'm doing this module on social ontology where we've just finished the David Lewis book on convention (the 1969 one). I'm trying to work out what my seminar tutor actually thinks a convention is, because I'm fairly sure she isn't running straight Lewis, and I can't get a straight answer out of her.

  Here's her record, from the examples we've rowed about in class:

  - Which side of the road we drive on: convention.
  - Calling a cat a cat rather than any other noise: convention.
  - Everyone accepting the same bits of metal as money: convention.
  - Standing on the right of the escalator so people can walk past on the left: convention.
  - Everyone in a lecture theatre facing the front: not a convention — she says that's just what the room does to you, there's no sense in which you're doing it because everyone else is.
  - Putting your bins out on the same morning as the neighbours because that's when the council empties them: not a convention, because the neighbours aren't coordinating with each other, they're each just reacting to the council.
  - Everyone in a hall of residence doing their washing on a Sunday because the laundry room is only unlocked on Sundays: not a convention, same reason.

  I think she might be running one of three things, but I can't tell which:
  (a) proper Lewis: mutual expectation + common knowledge + it has to be a coordination problem + there has to be at least one alternative regularity that would have worked just as well;
  (b) Lewis with the alternative bit dropped: anything mutually expected and self-sustaining, where you do it because everyone else does it, even if it's the only thing anyone could sensibly do;
  (c) something like: conventions can't be held up by sanctions or social pressure — if the only reason you conform is that you'll get grief for not conforming, it isn't a convention.

  Now the new case I want to ask her about, and I genuinely can't call it: in my mate's lab, the whole group has its weekly meeting at 2pm on Wednesdays. Everyone turns up at 2, everyone expects everyone else to turn up at 2, and you get a proper earful off the PI if you skip it. But there's no alternative anyone can see — 2pm Wednesday is the only slot when the PI, the microscope and the whole group are all free. So it's the only way the thing could be run, and it's also enforced.

  Predict her verdict on the lab meeting. Tell me which of (a), (b), (c) she's really running, or whether it's some fourth rule that fits her calls better. Tell me which of the others fit all her earlier verdicts just as well — I want the rules that are still standing after all that, not just the one you fancy. Then tell me which further case would actually settle it, i.e. the case that best tells the surviving rules apart, and what each of them would say about it.

  I'm less fussed about whether she's right than about what she's actually committed to, so if her earlier calls genuinely underdetermine the lab meeting, say so and tell me what she'd be buying with each choice.
