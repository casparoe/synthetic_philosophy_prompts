      *   Even if actions are binary, we can apply a "precautionary principle" based on the gradient.
      *   However, if the zero point is confused, we might be wasting moral capital on thermostats.
      *   *Survival:* The "be generous to crabs" part survives. The "thermostats are kinda sentient" part does not.

  6.  **Develop a Better Analogy:**
      *   Need something that captures:
          1.  Gradation (capacity varies).
          2.  Thresholds (some things are definitely out).
          3.  Binary decisions based on continuous risk.
      *   *Idea 1: Dimmer Switch.* Same problems as fader.
