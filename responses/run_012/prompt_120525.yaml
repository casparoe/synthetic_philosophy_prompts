          *   Time Index: The critical future time $t$.
          *   Entrenchment: "Green" is entrenched; "Grue" is not.
          *   Community/Projection: The linguistic community decides which predicates are projectible.
      *   *Kripke/Wittgenstein (Quus):*
          *   Predicate/Function: "Plus" ($+$) vs. "Quus" ($\oplus$).
          *   Evidence: Past calculations (sums $< 57$).
          *   Time Index: The moment of the first calculation $\ge 57$ (conceptually similar to $t$).
          *   Entrenchment: Usage of "plus" in the community.
          *   Community: The linguistic community that corrects/validates usage.
      *   *Mapping:*
          *   Predicate $\rightarrow$ Function/Rule ("Green" $\leftrightarrow$ "Plus", "Grue" $\leftrightarrow$ "Quus").
          *   Evidence $\rightarrow$ Finite Past Computations/Observations.
          *   Time Index $\rightarrow$ Critical Threshold (Time $t$ $\leftrightarrow$ Number 57).
          *   Entrenchment $\rightarrow$ Custom/Practice of using "Plus".
