      *   *Does the conclusion survive?* If the point is "AI meaning is as shaky as human meaning," yes. If the point is "Therefore we shouldn't care about AI alignment/interpretability," that's a non-sequitur. Even if meaning is socially constituted, the *social constitution* matters. If the AI community (developers/users) treats it as "plus," it is "plus." If it glitches, they correct it. The lack of metaphysical facts doesn't eliminate pragmatic utility.

