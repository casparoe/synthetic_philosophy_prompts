      *   *However:* The move from "No fact of the matter" to "So it doesn't matter if the AI means plus" is tricky.
      *   *Goodman's Entrenchment vs. Kripke's Community:* Goodman says we pick the entrenched predicate. Kripke says the community *constitutes* the meaning.
