answer: |-
  Here are ten questions designed to press your guest's view on omissions as causes. Each includes the main question, a note on the answer she is likely to give, and a follow-up designed to challenge that specific defense.

  **1. The Ontology of "Nothing"**
  **Question:** To start with the metaphysics: if causation is usually a relationship between events or things that *happen*, what exactly is an omission supposed to *be*? It looks like the absence of an event rather than an event itself. How can "nothing" push "something" into existence?
  *(Anticipated Answer: She will likely say an omission isn't a "thing" but a counterfactual fact—i.e., "The harm occurred because the agent did not do X, and if they had, it wouldn't have.")*
  **Follow-up:** If an omission is just a counterfactual fact, doesn't that turn causation into a logical relationship rather than a physical one? Are we saying the world is connected by logic, or by forces?

  **2. The Physics Objection**
  **Question:** In the natural sciences, causes typically involve a transfer of energy or momentum. When I push a glass and it falls, energy moves from me to the glass. When I *fail* to catch it, no energy is transferred. If your view is true, do we need to rewrite our physical understanding of how the world works to accommodate "negative energy"?
  *(Anticipated Answer: She will likely say that physics describes closed systems, but human causation involves agents and possibilities, so physics doesn't have the final say on causal language.)*
  **Follow-up:** But if our best theory of physical reality has no place for omissions, aren't you arguing that "causation" in philosophy is fundamentally different from "causation" in science?

  **3. The Flood of Causes (Background Conditions)**
  **Question:** A common objection is that if omissions are causes, then everyone who ever failed to prevent a harm is its cause. I didn't send money to save a starving child halfway across the world; did I cause their death? Where do you draw the line between a genuine *cause* and a mere *background condition*?
  *(Anticipated Answer: She will likely appeal to "normative expectations" or "proximity" to filter out distant omissions, saying you aren't a cause because you had no duty or proximity.)*
  **Follow-up:** If you use duty or proximity to filter causes, doesn't that mean morality is deciding what counts as physics? Are you saying a person becomes a physical cause only when they have a job description?

  **4. The Supervisor and the Night Worker**
  **Question:** Consider a factory accident. A supervisor fails to log a known fault, and a night worker fails to read the logbook. The machine explodes. Both omitted an action, and either action would have prevented the explosion. But we usually blame the supervisor more. Is the difference between them that the supervisor is the *cause* and the worker is not, or is the causation identical and only the *blame* different?
  *(Anticipated Answer: She will likely argue the supervisor is the primary cause because their omission was more "relevant" or violated a specific norm.)*
  **Follow-up:** If the explosion is physically identical regardless of who was on shift, how can the *cause* change based on who was supposed to be watching? Does the machinery know about the shift schedule?

  **5. Blocking Rescue vs. Letting Run**
  **Question:** Imagine I see a drowning child. If I stand still, I fail to save them. But imagine instead I park my car in a way that blocks an ambulance from reaching them. Both are failures to move my car, but the second blocks someone else's rescue. Do these count as the same kind of causal omission, or does blocking a rescue make the omission more "active"?
  *(Anticipated Answer: She will likely say both are omissions to save, though the second might violate a stronger norm.)*
  **Follow-up:** If both are the same kind of cause, why does the law and our intuition treat blocking a rescuer much more like a positive attack than simply standing still? Is there a causal difference you're missing?

  **6. Collective Inaction**
  **Question:** Suppose a security team of five people all fall asleep, and an intruder enters. Any one of them waking up would have stopped it. No single person's omission made the difference because the others were also asleep. Did all five cause the breach, or did none of them?
  *(Anticipated Answer: She will likely say all five are joint causes of the breach.)*
  **Follow-up:** If five people caused what one person could have prevented, does the word "cause" lose its power to explain *why* the event happened? If everyone is the cause, is anyone?

  **7. Causation vs. Abnormality**
  **Question:** Some philosophers argue that calling an omission a "cause" is just a way of picking out whatever strikes us as abnormal. We don't say the lack of rain caused the famine if we're in a desert, but we do in a rainforest. Is your view really just that causation is about spotting norm-violations rather than finding real connections?
  *(Anticipated Answer: She will likely deny it is *just* about norms, arguing that the counterfactual dependence is real, even if norms help us select it.)*
  **Follow-up:** Can you give me a test case where an omission is a cause *without* referencing any norm or expectation? If not, isn't the "cause" entirely dependent on what we expect, not what happened?

  **8. The Ability Constraint**
  **Question:** For an omission to be a cause, does the person have to be *able* to act? If I watch someone drown but I cannot swim, is my failure to jump in a cause of their death?
  *(Anticipated Answer: She will likely say no, because you "cannot" omit to do what you are unable to do; ability is a precondition.)*
  **Follow-up:** So causation depends on the agent's powers? If a stronger swimmer had been in my spot, would *their* presence make my spot a cause, even though the physical situation (a non-swimmer in the water) is the same?

  **9. The Timing Problem**
  **Question:** When exactly does the omission occur? If I fail to save you over the course of an hour, did the cause happen at the start, the end, or continuously? If it's continuous, does the cause grow larger the longer I wait?
  *(Anticipated Answer: She will likely say the omission occurs throughout the interval where action was expected.)*
  **Follow-up:** If the cause exists throughout the hour, does that mean the effect (the death) is being caused before it becomes inevitable? Can a cause exist before the effect is fixed?

  **10. Falsification**
  **Question:** To close, I want to ask about the limits of your view. What specific piece of evidence, or what kind of case, would make you give up the view that omissions are genuine causes?
  *(Anticipated Answer: She might say if a theory arose that explained all our intuitions without omissions, or if it created too many logical contradictions.)*
  **Follow-up:** If that theory required us to say that people who stand by while harms occur are *not* causes, would you accept it to save the metaphysics, or is preserving our moral intuition about responsibility more important to you?
