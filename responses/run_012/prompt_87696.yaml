prompt: |-
  I teach philosophy at a mid-sized state school and I've somehow ended up chairing the review panel for a small regional foundation that hands out project grants. We meet three times a year, forty-odd proposals a round, twelve of us round a table, ten minutes of real discussion per proposal before we vote, and the board rubber-stamps whatever we send up, so the reasons have to survive being read by someone who wasn't in the room. I'm the token humanist, which mostly means I'm the one who says hang on and gets ignored.

  Here's what's eating me. The panel decides on the basis of stuff that isn't the proposal. Matching funds pledged by a local bank. A letter from someone famous. An evaluation plan that clearly took three weeks and a consultant to write. A partner with a big name on the letterhead. My collegues treat all of it as evidence that the project is serious. Some of it is. Some of it is money and staff time being set on fire in front of us, and I think we're rewarding the fire. My rough idea, which I don't think I can state properly, is something like: a thing is only evidence about a project if it would be harder for a bluffer to produce than for the real thing, and the person paying for it has to be the person whose quality is actually in question, and if we start weighting it then everybody will start producing it and it'll stop meaning anything. I also suspect that some of what convinces me isn't expensive at all, it's just unfakeable, and I don't have a good grip on the difference between those two.

  Can you write me the one-page procedure? I want the questions in order, for any credential someone raises in discussion; a step that sorts them into ones that are just expensive, ones that can't really be faked, and ones that are neither; what to do when we can't tell which we're looking at; how much weight such a thing is allowed to carry in the final score, and whether it's ever allowed to be decisive on its own; and what we have to do to our own rubric, given that applicants will adapt to whatever we start rewarding. Where the procedure runs out and somebody just has to make a values call, say so in the procedure rather than hiding it behind a number. It has to be runnable by panelists who've never read anything about any of this, inside the ten minutes we have. And please don't tell me to go read someone — I don't have time and the panel definitely doesnt.

  Then run it on three of ours. (a) A well known regional theatre with $40k in matching funds from a bank and a letter from a state senator, for a rural storytelling project that on paper is a website and six workshops. (b) Four retired librarians with no matching funds, no famous names, $12k, who have run the same bookmobile thing in three counties for eleven years and whose past reports are boring and complete. (c) A university centre asking for three years, with a logic model, an external evaluator at 15% of budget, and a partner with a famous name — the evidence apparatus alone is a third of the ask. I'd like to know which of my instincts the procedure contradicts, because I'm fairly sure at least one of them it will, and I want to find out before I hand this out to people I have to sit next to.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the User and Request:**
      *   **User:** Philosophy professor, chair of a review panel for a small regional foundation.
      *   **Context:** 12 panelists, 40+ proposals/round, 10 mins/proposal discussion, board rubber-stamps panel recommendations. Reasons must be legible to outsiders. User is the "token humanist" often ignored.
      *   **Problem:** Panel rewards "expensive signals" (matching funds, famous letters, fancy eval plans) over actual merit. User suspects this rewards "burning money" rather than quality.
      *   **Core Insight:** Evidence is only valid if it's *harder for a bluffer to produce than for the real thing* (costly signaling theory) AND the person paying bears the risk. If everyone produces it, it loses value (Goodhart's Law). Some things are "unfakeable" (track record) vs. just "expensive."
      *   **Task:** Write a one-page procedure for the panel to evaluate credentials/evidence.
      *   **Requirements:**
          *   Questions in order.
          *   Sort signals into: Expensive only, Unfakeable, Neither.
          *   Protocol for ambiguity.
          *   Weight limits (can it be decisive?).
          *   Rubric adaptation (anticipating gaming).
          *   Explicitly mark where value judgments are needed (no hiding behind numbers).
          *   Must be runnable by laypeople in 10 mins.
          *   No reading assignments.
          *   **Apply the procedure** to three specific cases (Theatre, Librarians, University Centre).
          *   **Self-Correction/Reflection:** Identify where the procedure contradicts the user's instincts.

  2.  **Deconstruct the Philosophical Core:**
      *   The user is intuitively describing *Signaling Theory* (Spence) and *Goodhart's Law* ("When a measure becomes a target, it ceases to be a good measure").
      *   They need a heuristic that distinguishes *Costly Signals* (hard to fake) from *Sunk Costs* (waste) and *Cheap Talk* (easy to fake).
      *   The "Unfakeable" category is essentially *Track Record* or *Verifiable Output*.
      *   The "Expensive" category is *Barriers to Entry* that might exclude good small players.
      *   The Procedure needs to be a flowchart in text form.

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Constraint:* One page. 10-minute discussion limit.
      *   *Tone:* Professional, directive, clear, slightly philosophical but practical.
      *   *Structure:*
          1.  Purpose.
          2.  The Filter (The Questions).
          3.  Classification (The Buckets).
          4.  Weighting Rules.
          5.  The "Values Call" Disclaimer.
      *   *Drafting the Questions:* Need to test if the signal correlates with success or just wealth.
          *   Q1: Could a bluffer get this? (If yes -> Ignore).
          *   Q2: Does this cost money or competence? (If money -> Deprioritize).
          *   Q3: Is this the applicant's skin in the game or a third party's? (Third party -> Discount).
      *   *Drafting the Buckets:*
          *   Type A: Unfakeable (Track record, past deliverables).
          *   Type B: Costly but Exclusive (Matching funds, fancy eval).
          *   Type C: Noise (Letters of support without commitment).
      *   *Drafting Weighting:* Type A can be decisive. Type B cannot be decisive alone. Type C is zero weight.
      *   *Drafting the "Values Call":* Acknowledge that favoring small/org over big/rich is a choice, not a metric.

  4.  **Refining the Procedure for the "10-Minute" Constraint:**
      *   It can't be too abstract. It needs to be a checklist.
      *   Let's call it the "Signal Integrity Protocol."
      *   Make sure the distinction between "Expensive" and "Unfakeable" is clear. "Unfakeable" = Past performance. "Expensive" = Current wealth.
      *   Add the Goodhart warning: If we reward X, X becomes a product, not evidence.

  5.  **Applying the Procedure to the Cases:**

      *   **Case A (Theatre):**
          *   Signals: $40k match (Bank), Senator Letter.
          *   Analysis: Bank match = Wealth signal (Type B). Senator letter = Cheap talk/Political capital (Type C - easy for a known theatre to get).
          *   Project: Website + 6 workshops (Small scope).
          *   Verdict: High signal, low substance. Procedure should downgrade this.
      *   **Case B (Librarians):**
          *   Signals: No match, No names. 11 years history. Boring reports.
          *   Analysis: History = Unfakeable (Type A). Boring reports = Honest/Verifiable (Type A).
          *   Verdict: High substance, low signal. Procedure should upgrade this relative to current norms.
      *   **Case C (University):**
          *   Signals: Logic model, External Evaluator (15%), Famous Partner.
          *   Analysis: Evaluator/Logic Model = Expensive apparatus (Type B). Famous Partner = Name recognition (Type C/B).
          *   Cost: 1/3 of budget is "evidence apparatus."
          *   Verdict: High signal, potential inefficiency. Procedure should flag the cost ratio.

  6.  **Identifying Instinct Contradictions:**
      *   *User's Instinct:* "Matching funds... money and staff time being set on fire."
      *   *Procedure:* Will likely classify matching funds as "Costly but Exclusive" (Type B). It *allows* some weight, just not decisive. The user might want to ignore them entirely; the procedure might say "count them but cap them."
      *   *User's Instinct:* "Unfakeable... isn't expensive at all."
      *   *Procedure:* Will confirm this (Track record).
      *   *User's Instinct:* "I'm the one who says hang on and gets ignored."
      *   *Procedure:* Gives them a structured way to say "hang on" that isn't just opinion.
      *   *Potential Contradiction:* The user implies matching funds are *always* burning money. The procedure might acknowledge they show *community buy-in* but caps the weight. I need to check if the procedure is too harsh on the Theatre or too soft on the University.
      *   *Actually, the big contradiction:* The user suspects *some* convincing things aren't expensive. The procedure formalizes this. The contradiction might be in the "Values Call." The user wants to reward the Librarians. The procedure makes that a *value choice* (equity vs. risk), not a metric finding. The user might want it to be a metric finding ("Librarians are objectively better"). The procedure says "No, choosing Librarians is a policy choice to favor track record over capacity."

  7.  **Final Polish:**
      *   Ensure the tone matches a philosophy professor (precise, slightly weary but rigorous).
      *   Check the "One Page" constraint (visually in the output).
      *   Ensure the "Run it on three" section is distinct.
      *   Make sure the "Contradictions" section is honest.

  8.  **Self-Correction during drafting:**
      *   *Critique:* Is the procedure too complex for 10 minutes?
      *   *Fix:* Simplify the questions. Make it a "Stop/Go" flow.
      *   *Critique:* Did I address the "rubric adaptation"?
      *   *Fix:* Add a specific step about "If we fund this, what do applicants do next year?"
      *   *Critique:* The user wants to know where *they* might be wrong.
      *   *Fix:* Be specific in the final analysis section.

  9.  **Final Review against constraints:**
      *   One page procedure? (Keep it tight).
      *   Questions in order? (Yes).
      *   Sort signals? (Yes).
      *   Ambiguity protocol? (Yes).
      *   Weighting/Decisive? (Yes).
      *   Rubric adaptation? (Yes).
      *   Values call explicit? (Yes).
      *   Run on 3 cases? (Yes).
      *   Identify instinct contradictions? (Yes).

  (Proceed to generate output based on these thoughts.)
answer: |-
  ### SIGNAL INTEGRITY PROTOCOL (SIP)
  **For Use During Proposal Discussion. Time Limit: 2 Minutes per Credential.**

  **PURPOSE:** To distinguish between evidence of *capacity to succeed* and evidence of *capacity to spend*. To prevent the rubric from rewarding waste.

  **STEP 1: THE ORIGIN TEST (Ask in order)**
  1.  **Could a bluffer produce this?** (e.g., A letter of support costs postage. A matching fund requires a wealthy friend.)
      *   *If Yes:* Discard as evidence of quality. It is noise.
      *   *If No:* Proceed to Q2.
  2.  **Who pays the cost?** Is the cost borne by the applicant (time/reputation) or a third party (bank/donor)?
      *   *Third Party:* Discount heavily. It proves the applicant has friends, not skill.
      *   *Applicant:* Proceed to Q3.
  3.  **Is the cost recoverable if the project fails?**
      *   *Yes (e.g., Buying equipment they keep):* Low signal.
      *   *No (e.g., Sunk labor, reputation risk, past performance):* High signal.

  **STEP 2: CLASSIFICATION**
  *   **TYPE GREEN (Unfakeable):** Past performance, verifiable deliverables, sunk labor by the team. *Hard to fake, costly to applicant, unrecoverable.*
  *   **TYPE YELLOW (Expensive):** Matching funds, paid evaluators, fancy logistics. *Hard to fake, but proves wealth/access more than competence.*
  *   **TYPE RED (Noise):** Letters of support, logos on letterhead, generic logic models. *Easy to fake or third-party paid.*

  **STEP 3: WEIGHTING RULES**
  *   **GREEN:** May be decisive. Can override budget concerns.
  *   **YELLOW:** Cannot be decisive. Max 15% of total score. If the "evidence apparatus" exceeds 20% of the budget, penalize the proposal for inefficiency.
  *   **RED:** Zero weight. Do not discuss.

  **STEP 4: THE ADAPTATION CHECK (Mandatory)**
  Before voting, ask: *"If we fund this, what will every applicant do differently next year to mimic this?"*
  *   If the answer is *"Spend more money on consultants,"* downgrade the proposal.
  *   If the answer is *"Do the work for longer,"* maintain score.

  **STEP 5: THE VALUES CALL (Explicit Declaration)**
  If the choice is between a **YELLOW** high-budget proposal and a **GREEN** low-budget proposal, the panel is not deciding on "merit." You are deciding on **Risk vs. Equity**.
  *   Choosing YELLOW = Prioritizing institutional safety and capacity.
  *   Choosing GREEN = Prioritizing track record and community access.
  *   *Requirement:* The Chair must record which value was prioritized in the notes. Do not hide this behind a score.

  ***

  ### APPLICATION TO CURRENT PROPOSALS

  **(A) Regional Theatre ($40k Match, Senator Letter, Website/Workshops)**
  *   **Origin Test:**
      *   Match: Third-party (Bank). -> **YELLOW**.
      *   Senator Letter: Bluffer could get this (known entity). -> **RED**.
      *   Project Scope: Small relative to overhead.
  *   **Classification:** Mostly YELLOW/RED. No GREEN (past performance on *this* specific rural project is unclear).
  *   **Adaptation Check:** If funded, next year's applicants will hunt bank matches rather than design better workshops.
  *   **Verdict:** Score capped. The match proves the Theatre is rich, not that the storytelling is good.
  *   **Values Call:** Funding this is a choice for **Institutional Safety** (Theatre won't vanish) over **Project Merit**.

  **(B) Retired Librarians ($12k, 11 Years, Boring Reports)**
  *   **Origin Test:**
      *   11 Years History: Bluffer cannot fake time. -> **GREEN**.
      *   Boring Reports: Verifiable deliverables. -> **GREEN**.
      *   No Match: Applicant bears full risk. -> **GREEN**.
  *   **Classification:** Pure GREEN.
  *   **Adaptation Check:** If funded, applicants will focus on longevity and consistency.
  *   **Verdict:** High score allowed. The "boring" nature is a feature (stability), not a bug.
  *   **Values Call:** Funding this is a choice for **Equity/Track Record** over **Capacity**.

  **(C) University Centre (3 Years, Logic Model, External Evaluator, Famous Partner)**
  *   **Origin Test:**
      *   External Evaluator (15%): Third-party cost. -> **YELLOW**.
      *   Famous Partner: Bluffer could get a letter. -> **RED** (unless partner puts up cash/risk).
      *   Logic Model: Easy to copy. -> **RED**.
      *   Cost Ratio: Evidence apparatus is 33% of budget.
  *   **Classification:** Heavy YELLOW. High inefficiency penalty.
  *   **Adaptation Check:** If funded, applicants will hire evaluators instead of doing the work.
  *   **Verdict:** Penalize for bloat. The "evidence" is consuming the resources needed to generate evidence.
  *   **Values Call:** Funding this is a choice for **Academic Rigor** (or appearance thereof) over **Efficiency**.

  ***

  ### WHERE THIS CONTRADICTS YOUR INSTINCTS

  You asked to find out where the procedure might prove you wrong before you present it. Here are the friction points:

  1.  **The "Matching Funds" Instinct:** You view matching funds as "money set on fire." The SIP classifies them as **YELLOW**, not **RED**. It allows them *some* weight (up to 15%).
      *   *Why:* A bank match *does* signal that a sophisticated third party did due diligence. It is not *zero* evidence.
      *   *The Contradiction:* You want to ignore them entirely. The procedure says you can't, because excluding them completely punishes applicants who *actually* have community buy-in, not just wealthy friends. You have to admit it counts for *something*, just not much.

  2.  **The "Unfakeable" Instinct:** You suspect unfakeable things "aren't expensive at all." The SIP agrees, but clarifies that **GREEN** signals (11 years of reports) are expensive in *time*, just not in *cash*.
      *   *The Contradiction:* You might be conflating "financial cost" with "signal cost." The Librarians paid a high price (11 years of labor). The procedure forces you to acknowledge that their signal *is* costly, just not in the currency the other panelists recognize. You will have to argue that *time* is a currency.

  3.  **The "Values Call" Instinct:** You want the Librarians to win on *merit*. The SIP (Step 5) forces you to admit that if you choose the Librarians over the Theatre, you are making a **policy choice** (Equity > Safety), not a purely objective assessment of "quality."
      *   *The Contradiction:* This is the hardest pill. The procedure denies you the comfort of saying the Librarians are objectively "better." It says they are "better on the metric we chose to value." It exposes that your panel's current definition of "seriousness" is actually a definition of "wealth." You will have to tell your colleagues: *"We are not finding the best project; we are deciding if we care more about bank accounts or bookmobiles."*

  4.  **The University Centre:** Your instinct is likely that the "logic model/evaluator" is wasteful. The SIP agrees, but classifies it as **YELLOW** (Expensive) rather than **RED** (Noise).
      *   *The Contradiction:* It acknowledges that evaluation *has* value, but punishes the *ratio*. If the University cuts the evaluator to 5%, they might pass. Your instinct might be that the evaluator is irrelevant to the philosophy/work; the procedure admits it's relevant for *accountability*, just not for *success*.

  **Summary:** The procedure validates your core suspicion (we reward wealth), but it removes your ability to dismiss wealth entirely. It forces you to quantify *how much* wealth should matter, and it forces you to admit that favoring the Librarians is a moral stance, not a mathematical one. That is the lever you use to break the deadlock.
