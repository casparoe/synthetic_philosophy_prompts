prompt: |-
  I'm moderating the Q&A at a student paper series next month. The speaker is an early-career philosopher (not someone famous, so don't worry about matching anything he's actually written) who's shopping a book arguing that we should take the intentional stance toward large language models -- that ascribing beliefs, desires and goals to them isn't just a convenient shorthand but the correct predictive strategy, even though there's nothing inside the model that looks like a human belief. He's got one move he leans on to get out of everything, something about beliefs without believers, and I want it to get progressively harder for him to use as the Q&A goes on.

  Draft me eight to ten questions, no generic stuff (skip how did you get into this, and nothing that just asks him to define the intentional stance -- the audience knows what that is). I need at least one question each on: (1) what's supposed to make the stance correct rather than merely convenient -- does he want the predictive-utility criterion, or a more realist reading where these ascriptions latch onto real patterns, and can he take the realist line without a story about what makes a pattern real; (2) the instability problem, that the same model will cheerfully assert p under one prompt and not-p under another, and whether that kills the projectibility of the ascribed belief or whether he can just say human beliefs are equally context-sensitive; and (3) whether taking the stance seriously committs him to the model being a moral patient or a responsible agent, and exactly how he blocks that slide. For each of those three, give me a follow-up keyed to the answer he's most likely to give.

  Also work in one question on the objection that it's just next-token statistics with no persisting representational state, and finish with a question about what evidence would actually make him stop ascribing the belief -- something he can't wriggle out of by saying no believer is required.
