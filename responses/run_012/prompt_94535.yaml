answer: |-
  **Essay Question**

  **Time Allowed: 60 Minutes**

  In *Computing Machinery and Intelligence*, Turing treats the possibility of Extrasensory Perception (ESP) as an empirical hypothesis that requires experimental control, rather than dismissing it as impossible. Suppose, for the sake of argument, we grant that telepathy occurs and can transmit information between an interrogator and a respondent.

  (a) Distinguish between two ways this possibility threatens the Imitation Game: first, as 'leakage' that corrupts a specific experimental run (a matter of hygiene); and second, as a threat to the criterion itself, wherein the capacity being assessed is no longer conversational performance but an unidentified channel.

  (b) Consider two variants:
      (i) Telepathy holds only between human beings, not between a machine and an interrogator.
      (ii) Telepathy holds between an interrogator and a machine, but not between two humans.
      For each variant, analyse whether the test is invalidated, merely made harder or easier, or whether the objection confuses validity with reliability.

  (c) Conclude by assessing whether Turing's proposal to insulate the interrogation is a principled fix or a fudge. Does a test that must be insulated from a real phenomenon measure the wrong thing, or does this simply control for a nuisance variable? Finally, classify the ESP objection against Turing's other objections: does it target the adequacy of the criterion or the conduct of the experiment, and is treating it as an empirical matter consistent with Turing's refusal to define 'thinking' prior to the test?

  ***

  **Model Answer**

  Turing's handling of the ESP objection is often overlooked, yet it reveals the structural logic of the Imitation Game. By treating ESP as an empirical possibility requiring screening, Turing distinguishes between the *definition* of intelligence and the *conditions* under which it is measured. To understand the philosophical work this objection performs, one must separate experimental noise from criterion failure.

  If telepathy exists, it threatens the test in two distinct ways. First, it acts as leakage. If an interrogator unconsciously receives answers from a human confederate via telepathy, the data is contaminated. This is a matter of experimental hygiene, comparable to preventing the 'Clever Hans' effect or controlling for experimenter expectancy. It undermines the reliability of the specific run but does not necessarily falsify the criterion. Second, and more profoundly, ESP threatens the criterion itself. The Imitation Game is designed to assess intellectual performance mediated by standard causal channels (textual input/output). If a machine passes solely because the interrogator telepathically projects the answers into it, the machine is not displaying intelligence; the channel is bypassing the computational process. Here, the test measures psychic connectivity, not cognitive capacity.

  This distinction clarifies the two variants. In variant (i), where telepathy exists only between humans, the machine is at a disadvantage. The human respondent can bypass the linguistic constraint via telepathy, making the machine's task harder. This does not invalidate the test's criterion for machine intelligence; it merely skews the baseline comparison. The test remains valid as a measure of machine performance, though the control condition (the human) is compromised. This is a reliability issue, solvable by screening the human.

  Variant (ii) is the philosophically critical case. If telepathy holds between the interrogator and the machine but not between humans, a machine could pass without possessing intelligence. The interrogator might simply 'know' the correct answers and project them, or the machine might read the interrogator's mind to retrieve the desired response. Here, the causal link between internal processing and external output is severed. The test is invalidated because passing no longer implies the presence of the capacity we intend to measure. This is a validity failure. Consequently, variant (ii) is the more significant threat, as it decouples success in the game from the possession of a mind.

  Is Turing's proposed insulation a fudge? It is a principled fix. In any scientific measurement, one must control for nuisance variables that correlate with the outcome but are not the phenomenon of interest. If we measure weight, we shield the scale from wind. If we measure intelligence via conversation, we must shield the channel from non-conversational information transfer. Insulating the test does not imply it measures the wrong thing; rather, it ensures that the only available route to success is the one specified by the rules (linguistic competence). To argue otherwise is to confuse the control of conditions with the definition of the trait.

  Finally, we must classify the ESP objection against Turing's others. Objections like the 'Argument from Consciousness' or the 'Heads in the Sand' objection target the adequacy of the criterion itself; they claim that even a perfect performance does not constitute thinking. The ESP objection, by contrast, targets the conduct of the experiment. It accepts the performance criterion but worries about the causal pathway. Treating ESP as an empirical matter is entirely consistent with Turing's methodological impatience. He refuses to define 'thinking' conceptually because he believes the operational test is sufficient. However, an operational test still requires empirical rigour. Acknowledging ESP as a potential nuisance variable demonstrates that while the *definition* of thinking is behavioural, the *detection* of thinking is subject to the laws of physics and psychology. Turing's stance preserves the behavioural criterion while acknowledging that the physical implementation of the test must be secure. To dismiss ESP conceptually would be to engage in the very armchair definition he sought to avoid; to screen for it empirically is to treat the Imitation Game as a serious scientific instrument.

  **Confidence Note**
  I am highly confident in the distinction drawn between validity and reliability in this context, and in the classification of ESP as an experimental rather than conceptual objection. I am least sure about the interpretation of variant (i); one could argue that if human telepathy makes the human 'too intelligent', it shifts the baseline of what counts as 'normal' human performance, potentially altering the criterion implicitly, though I have maintained that this is primarily a reliability issue for the sake of the argument presented.

  ***

  **Marking Scheme**

  **Total Marks: 20**

  **1. The Empirical Status of ESP (4 Marks)**
  *   **Requirement:** The candidate must identify that Turing treats ESP as an empirical hypothesis (a contingent fact about the world) rather than a conceptual impossibility. They must note that this requires screening/control rather than philosophical dismissal.
  *   **Common Loss:** Candidates lose marks here by treating ESP as science fiction or dismissing it outright, failing to engage with Turing's serious treatment of it as a 'nuisance variable'.
  *   **Differentiation:** A First-Class answer explicitly links this to Turing's avoidance of defining terms (operationalism).

  **2. Leakage vs. Criterion Failure (4 Marks)**
  *   **Requirement:** Clear distinction between ESP as experimental contamination (hygiene/reliability) and ESP as a bypass of the cognitive mechanism (validity/criterion).
  *   **Common Loss:** Candidates conflate the two, arguing that any ESP simply 'cheats' without distinguishing between skewing the data and breaking the link between performance and mind.
  *   **Differentiation:** A First-Class answer uses the terminology of validity and reliability precisely to anchor this distinction.

  **3. Analysis of Variant (i) – Human-Human ESP (4 Marks)**
  *   **Requirement:** Correct diagnosis that this makes the test harder for the machine or skews the baseline, but does not inherently invalidate the machine's failure or success regarding intelligence. It is a control issue.
  *   **Common Loss:** Candidates argue this invalidates the test entirely, failing to see that the machine's performance is independent of the human's extra capabilities.
  *   **Differentiation:** A solid Upper-Second identifies the asymmetry; a First-Class answer explains why this is a baseline shift rather than a criterion collapse.

  **4. Analysis of Variant (ii) – Machine-Interrogator ESP (4 Marks)**
  *   **Requirement:** Identification that this is the critical threat. It allows a machine to pass without thinking (validity failure). This variant must be identified as the more philosophically interesting of the two.
  *   **Common Loss:** Candidates treat both variants as equally damaging or fail to see why machine-telepathy breaks the logic of the test more than human-telepathy.
  *   **Differentiation:** **Crucial for First-Class.** The candidate must explain *why* variant (ii) severs the link between computation and success, whereas variant (i) does not.

  **5. Classification and Consistency (4 Marks)**
  *   **Requirement:** Classification of ESP as an objection to experimental conduct (unlike Consciousness objections which target the criterion). Assessment that screening is a principled control for nuisance variables, consistent with Turing's empirical/operational approach.
  *   **Common Loss:** Candidates argue that needing to screen for ESP proves the test is flawed or 'fudged', missing the point that all experiments require controls.
  *   **Differentiation:** A First-Class answer articulates the consistency between Turing's refusal to define 'thinking' and his insistence on empirical rigour for the test conditions.

  **Grade Boundaries & Specific Moves**

  *   **First-Class (17–20 Marks):** Must secure full marks on Point 4 (Variant ii analysis) and Point 5 (Consistency/Classification). Specifically, the answer must explicitly state that Variant (ii) is the more interesting case because it threatens *validity* (measuring the wrong thing), whereas Variant (i) threatens *reliability* (measurement error). The answer must argue that insulation is a standard scientific practice, not a conceptual concession.
  *   **Upper-Second (14–16 Marks):** Will likely secure Points 1, 2, and 3 clearly. May struggle to fully articulate why Variant (ii) is structurally different from Variant (i) in terms of validity, or may be slightly vague on the consistency of Turing's empirical stance.
  *   **Lower-Second (11–13 Marks):** Will identify the ESP issue but may treat it as a general 'cheating' problem without the leakage/criterion distinction. May fail to analyse the variants separately.
  *   **Fail (0–10 Marks):** Recites Turing's list of objections without focusing on ESP. Treats ESP as irrelevant or fails to address the specific variants provided in the question.
