      *   *Harm condition:* Bad side effect + indifference = "Intentional."
      *   *Help condition:* Good side effect + indifference = "Not Intentional."
      *   *Implication:* Folk psychology (how ordinary people understand mind/action) is intertwined with moral evaluation. It challenges the "Classic View" (intent is purely descriptive/factual, separate from normativity).

  3.  **Address the Legal Question (*Mens Rea*):**
      *   *Is legal intent the same as folk intent?* No. Legal intent is a technical construct, defined by statutes and case law, not just ordinary language usage.
      *   *Does the Knobe Effect invalidate legal intent?* Not necessarily. It shows *folk* judgments are biased, but legal systems have safeguards (jury instructions, rules of evidence, appellate review) to mitigate bias.
      *   *Is the friend right (scrap intent)?* No. Outcome-based liability (strict liability) exists but is limited for good reason (deterrence, fairness, autonomy). Punishing without intent violates retributive justice principles.

