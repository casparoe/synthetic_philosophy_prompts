answer: |-
  This is a fantastic question, and you have hit on exactly why the Knobe Effect (also known as the "Side-Effect Effect") caused such a massive stir in philosophy of action and legal theory when Joshua Knobe published it in 2003. You are right to be suspicious of your friend's conclusion, but you are also right to feel the tension.

  Here is a breakdown of what the experiment shows, what it doesn't show, and why your friend's proposal to scrap intent is problematic. You can use this structure to organize your assignment.

  ### 1. What the Knobe Effect Actually Shows
  Your teacher's summary is mostly correct, but let's refine it. The experiment challenges the **"Classic View"** of intentionality.

  *   **The Classic View:** We first figure out the facts of the mental state (did they know? did they want it?) in a neutral, scientific way. *Then*, once we know the mental state, we apply moral judgment.
  *   **The Knobe Finding:** Moral judgment happens *simultaneously* with, or even prior to, the assessment of the mental state. When the outcome is bad, we are more willing to say the agent "knew" or "intended" it. When the outcome is good, we require a higher standard of desire to say they "intended" it.

  **What it proves:** It proves that **folk psychology** (how ordinary people use words like "intentional" in everyday conversation) is not morally neutral. Our concept of "on purpose" is partly a normative concept (about blame/praise), not just a descriptive one (about brain states).

  **What it does *not* prove:** It does not prove that mental states don't exist, nor does it prove that we *cannot* distinguish between accident and intent. It only shows that our *ordinary language usage* is biased by moral valence.

  ### 2. Folk Psychology vs. Legal Doctrine
  This is the most important point for your paper. You are mixing up **ordinary language** with **legal technicality**.

  The law does not rely solely on a juror's gut feeling about the word "purpose." Legal systems (especially in the US via the Model Penal Code) break *mens rea* down into specific, defined tiers to avoid exactly this kind of ambiguity:
  *   **Purposely:** It was their conscious object.
  *   **Knowingly:** They were practically certain it would happen (even if they didn't want it).
  *   **Recklessly:** They consciously disregarded a substantial risk.
  *   **Negligently:** They should have known about the risk but didn't.

  In the Knobe Chairman case, a lawyer would argue the Chairman acted **Knowingly**, not necessarily **Purposely**. The Knobe Effect shows that regular people might call "knowing" harm "intentional," but call "knowing" help "unintentional." The law tries to fix this by giving judges specific instructions to distinguish between *desiring* a result and *accepting* a result.

  **Argument for your paper:** The Knobe Effect reveals a flaw in *folk* intuition, which is precisely why the law developed technical definitions of intent. The law is an attempt to correct the very bias Knobe identified.

  ### 3. Why Your Friend is Wrong (The Case for Intent)
  Your friend suggests moving to a system of **Strict Liability** (convicting based on outcome alone). While strict liability exists for minor regulatory offenses (like speeding or statutory rape), applying it to serious crimes (like murder) creates massive philosophical and practical problems.

  Here is why you can argue against her:

  **A. The Principle of Autonomy and Fairness**
  Retributive justice is based on the idea that we punish people for *choices*, not *luck*.
  *   **Scenario:** Surgeon A tries to save a patient but the patient dies due to a rare complication. Shooter B tries to kill a patient and the patient dies.
  *   **Outcome:** Both patients are dead.
  *   **Intent:** A tried to save; B tried to kill.
  If we scrap intent, Surgeon A is a murderer. This violates our deepest sense of fairness. We punish bad *wills*, not just bad *worlds*. The Knobe Effect might show we are biased, but it doesn't prove that the distinction between the Surgeon and the Shooter is meaningless.

  **B. Deterrence**
  Criminal law aims to stop people from choosing to do bad things. You cannot deter an accident in the same way you deter a choice. If a construction worker drops a brick and kills someone despite taking all safety precautions, punishing them as a murderer doesn't make other workers more careful; it just makes them terrified. Punishment is only morally useful if the agent could have done otherwise.

  **C. The "Wig" isn't just a Costume**
  Your teacher suggested that intent is just moral judgment "wearing a costume." But many philosophers argue the reverse: Moral judgment *requires* intent. We can't call something "wrong" in the full moral sense unless the agent had a choice. So, it's not that we fake the intent to match the morality; it's that morality is *constituted* partly by the intent. The Knobe Effect might just show that these two concepts are deeply intertwined, not that one is fake.

  ### 4. Does this make the Law a Joke?
  No, but it does highlight a vulnerability.
  Legal scholars *do* worry about the Knobe Effect in the courtroom. If a jury hates a defendant (maybe because the outcome was gruesome), they might be more likely to find "intent" where there was only "recklessness."

  However, the solution isn't to scrap intent. The solution is:
  1.  **Better Jury Instructions:** Judges explicitly tell jurors to ignore the outcome when determining the mental state.
  2.  **Appellate Review:** Higher courts check if the evidence actually supported the intent finding.
  3.  **Burden of Proof:** The prosecution must prove intent beyond a reasonable doubt, which acts as a buffer against gut reactions.

  ### Summary for Your Assignment
  If I were writing this, I would structure the conclusion like this:

  1.  **Acknowledge the Knobe Effect:** It successfully demonstrates that ordinary people's attribution of intentionality is influenced by moral judgment.
  2.  **Reject the Nihilism:** This does not make intent "incoherent." It shows that intent is a **normative concept**, not a purely scientific one.
  3.  **Defend the Law:** The legal system recognizes this bias and attempts to mitigate it through technical definitions (*mens rea* tiers) and procedural safeguards.
  4.  **Refute the Friend:** Abandoning intent (strict liability) abandons the core principle that punishment requires moral agency. It punishes luck rather than choice, which is arguably more irrational than the bias Knobe found.

  **The Bottom Line:** The Knobe Effect shows that human psychology is messy. The Law is an attempt to build a clean structure on top of messy psychology. The fact that the foundation is messy doesn't mean the building is a joke; it just means we have to be careful architects.

  Good luck with the club assignment! This is exactly the kind of critical engagement philosophy professors love to see.
