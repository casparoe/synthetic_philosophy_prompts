answer: |-
  # The Free Energy Principle: A Decision Tree for Graduate Seminar

  **Root Commitment:** *The brain continuously predicts its sensory input and corrects its errors.*

  This tree begins where your students agree. It forces them to discriminate between the *metaphysical status*, *scope*, and *explanatory power* of the principle using concrete physical cases. Follow the path dictated by your intuition on each case.

  ---

  ### Node 1: The Bacterium (Existence vs. Mode)
  **Question:** Consider a **bacterium** swimming up a glucose gradient. Does the Free Energy Principle explain *why this bacterium exists at all* (i.e., minimizing free energy is a necessary condition for its physical persistence as a distinct system), or does it explain only *how the bacterium behaves* (i.e., given that it is already alive, it navigates using prediction-error minimization)?

  *   **A. It explains why the bacterium exists.** (The principle is a condition for self-organization itself).
      *   *Go to Node 2.*
  *   **B. It explains only how the bacterium behaves.** (The principle describes the control strategy of an already-existing system).
      *   *Go to Node 4.*

  ---

  ### Node 2: The Mutation (Falsifiability)
  **Question:** Imagine a **genetic mutation** arises that allows a bacterium to survive and reproduce while systematically violating the mathematical bound of free-energy minimization (e.g., it thrives on high-surprise states). If you observed this, would you admit the Free Energy Principle is **false**, or would you argue that you must have drawn the system's **Markov blanket** incorrectly to make the math fit?

  *   **A. I would admit the theory is false.** (The principle makes risky predictions).
      *   *Go to Node 3.*
  *   **B. I would redraw the blanket.** (The principle can accommodate any outcome by redefining the system boundary).
      *   **LEAF: The Unfalsifiable Reading.**
      *   *Note:* On this view, the FEP is a tautology: "Systems that persist persist." It offers no leverage to distinguish between competing mechanisms because the boundary is adjusted post-hoc to ensure the principle holds.

  ---

  ### Node 3: The Thermostat (Ontology)
  **Question:** Consider a **thermostat** maintaining a room's temperature. If this system minimizes free energy, is "Free Energy" a **literal physical quantity** flowing through the device (analogous to heat or force, derived from fundamental physics), or is it a **mathematical description** (a formal duality) that allows us to model the device's states as if it were doing inference, without claiming physics "cares" about inference?

  *   **A. It is a literal physical quantity.** (The principle is a law of nature).
      *   **LEAF: The First-Principles Law of Self-Organization.**
      *   *Note:* This is the strong Fristonian claim. FEP is to biology what Newton's laws are to mechanics.
  *   **B. It is a mathematical description.** (The principle is a formal tool).
      *   **LEAF: The Variational-Mechanics Reading.**
      *   *Note:* This view accepts the universal scope of Node 1A but treats the "inference" as a formal equivalence rather than a physical causal mechanism.
      *   *Identity Note:* Empirically, this leaf and the *First-Principles* leaf often make identical predictions. The split is purely metaphysical (realism vs. formalism regarding the "energy" term).

  ---

  ### Node 4: The Neural Network (Thermodynamics)
  **Question:** Consider a **trained deep learning network** minimizing a loss function. Is the "Energy" in Free Energy literally tied to **thermodynamic entropy and temperature** (requiring a physical substrate to make sense), or is it merely a **metaphor for a cost function** (where "energy" just means "error" in a computational sense)?

  *   **A. Literally tied to thermodynamics.**
      *   *Go to Node 5.*
  *   **B. Merely a metaphor for a cost function.**
      *   *Go to Node 5.*
      *   *Empty Combination Note:* There is arguably no stable position that answers **1B (Mode only)** but **4A (Literal Thermodynamics)**. If free energy is a literal thermodynamic quantity governing the system, it is difficult to argue it does not also govern the system's existence (Node 1A). Students choosing this combination are likely confused about the link between statistical physics and self-organization. Treat them as proceeding to Node 5, but flag the tension.

  ---

  ### Node 5: The Skin (The Markov Blanket)
  **Question:** Consider the **skin of the bacterium** (or the input layer of the network). Is the Markov blanket a **real physical boundary** that causes the statistical independence between internal and external states, or is it a **line we draw for convenience** to define where the "system" ends for the sake of modeling?

  *   **A. It is a line we draw for convenience.** (The boundary is observer-relative).
      *   **LEAF: The Instrumentalist Reading.**
      *   *Note:* On this view, FEP is a "useful fiction." It doesn't matter if the system *really* has a blanket or minimizes energy; the framework yields good predictions, so we use it. This aligns with the "modeling convenience" commitment.
  *   **B. It is a real physical boundary.** (The boundary is system-relative).
      *   **LEAF: The Computational Predictive-Coding Reading.**
      *   *Note:* This is the standard "Bayesian Brain" view. It drops the universal thermodynamic claims of Node 1A (focusing on cognitive systems) but maintains that the brain *really* computes probabilities across a *real* architectural boundary.

  ---

  ### Instructor's Guide to Ambiguities and Merges

  **1. The Variational vs. First-Principles Merge**
  You will find students who land on **Variational-Mechanics** and **First-Principles** making identical empirical claims. They both accept the "Existence" claim (Node 1A) and the "Falsifiable" claim (Node 2A). The split is solely on whether the math *is* the physics or *describes* the physics.
  *   *Defense of Split:* I have kept them separate because this distinction determines whether a student looks for FEP in particle physics (First-Principles) or only in complex systems where the math applies (Variational). It divides the *research program*, even if the *predictions* overlap.

  **2. The Empty Combination (1B + 4A)**
  As noted in Node 4, the combination of "FEP explains only behavior" (1B) and "Free Energy is literal thermodynamics" (4A) is theoretically unstable.
  *   *Why:* If free energy is a literal thermodynamic quantity, it governs the phase space of the system's states. If the system leaves that phase space, it dissolves. Therefore, literal thermodynamics implies an existence claim (1A). If a student insists on 1B + 4A, challenge them to explain how a system can violate thermodynamic persistence conditions without ceasing to exist.

  **3. The Instrumentalist vs. Unfalsifiable Overlap**
  The **Instrumentalist** and **Unfalsifiable** leaves are close cousins. Both deny that FEP is a "truth" about the world.
  *   *Distinction:* The **Unfalsifiable** reading (Node 2B) is a *logical* critique: the theory *cannot* be wrong. The **Instrumentalist** reading (Node 5A) is a *pragmatic* stance: the theory *could* be wrong (or right), but we treat it as a tool regardless. I have placed them on different branches to highlight that one stems from the definition of the system (Boundary/Blanket) and the other from the logical structure of the claim (Falsifiability).

  **4. Defending the Structure**
  I have placed the **Existence vs. Mode** distinction (Node 1) at the root. This is the most critical division in the literature. It separates the "Fristonians" (who claim FEP is a law of life) from the "Predictive Processors" (who claim FEP is a theory of brain function). Placing this later in the tree would obscure the fundamental ontological disagreement that drives the other branches. If you do not settle existence first, the thermodynamics question (Node 4) becomes unintelligible.
