answer: |-
  ### Brainstorming the Test

  Before ranking, we must be precise about the **Leveling-Down Objection (LDO)** as you have defined it. We are not asking whether equality *improves* pro tanto (which is true for egalitarians); we are asking whether the principle judges the leveled-down state as **strictly better all-things-considered**.

  For a principle to be vulnerable, there must exist a scenario where:
  1.  The Better Off (B) lose welfare.
  2.  The Worse Off (W) stay exactly the same.
  3.  The Principle's valuation function $V(New) > V(Old)$.

  If $V(New) = V(Old)$, the principle is *not* vulnerable by your definition (it implies indifference, not strict betterness). If $V(New) < V(Old)$, it is immune. The core mechanism of vulnerability is usually that the principle values equality or relative standing so highly that it treats the loss to B as irrelevant or as a net positive for the system, outweighing the loss in total welfare.

  ### Ranking: Most Vulnerable to Least Vulnerable

  **1. (C) Relative Standing (Most Vulnerable)**
  This principle is structurally committed to leveling down. Because the best-off person's contribution is always normalized to 1 ($x_{max}/x_{max}$), their absolute loss contributes nothing to the value change. Meanwhile, every other person's ratio ($x_i/x_{max}$) strictly increases as the denominator shrinks. Thus, *any* reduction in the top level (holding others constant) mathematically guarantees a higher total value.

  **2. (B) Gap Penalty (Vulnerable if $\lambda > 1$)**
  This principle is vulnerable if and only if the inequality penalty parameter $\lambda$ exceeds 1. When the better-off lose 1 unit, total utility drops by 1, but the gap shrinks by 1, reducing the penalty by $\lambda$. The net change is $\lambda - 1$; if $\lambda > 1$, the reduction in penalty outweighs the loss in utility, making the leveled-down state strictly better. If $\lambda \le 1$, it is not vulnerable.

  **3. (D) Benchmark Priority (Vulnerable at the Threshold)**
  This principle is vulnerable only in the specific range where the better-off person's level drops from above the benchmark to below it. If a person at 101 drops to 99 (benchmark 100), they begin contributing positive value where they previously contributed nothing, making the new state strictly better despite the loss. If they remain above the benchmark, the value is unchanged (not strictly better), so it is immune in that range.

  **4. (E) Rank Priority (Immune)**
  This principle is not vulnerable because it respects the Pareto principle: since weights are positive and fixed to ranks, and at least one person's level has decreased while no one's has increased, the weighted sum must decrease. Even if the leveling down causes a rank swap, the loss in absolute levels dominates any gain from re-weighting, ensuring the new state is always strictly worse.

  **5. (A) Pure Priority (Least Vulnerable)**
  Like Rank Priority, this is immune, but it is the canonical case of immunity. Since the value function is strictly increasing in each person's level, any loss to the better-off (with no gain to the worse-off) necessarily reduces the total sum. It is ranked as "least" only because it is individualistic and lacks the relational complexity of (E), making its immunity robust against any interpretation of rank or structure.

  ### Teaching Warning

  **You should be most worried about teaching (D) Benchmark Priority as if it were a safe alternative to egalitarianism.**

  While (A) and (E) are robustly immune, and (B) and (C) are openly vulnerable, (D) is often presented in introductory contexts as a solution to the LDO (because it ignores inequality above the threshold). However, it harbors a "cliff-edge" vulnerability: it creates a perverse incentive to level down the better-off specifically to bring them below the benchmark, where they suddenly "count." If you present it as a clean escape from the LDO without highlighting the threshold crossing problem, students will encounter a counter-example that undermines the theory's coherence.
