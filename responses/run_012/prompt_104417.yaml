  **Soft Spot:** Explaining what constrains 'respects' without slipping back into hidden condition-talk remains the weakest link; I risk sounding like I'm hiding conditions inside the word 'practice'.

  2. **The Experimental Psychologist (High Likelihood)**
  **Objection:** "Prototype theory already models graded membership. What unique prediction does your 'shifting center' make that standard exemplar models don't, and how do you operationalize intransitive similarity?"
