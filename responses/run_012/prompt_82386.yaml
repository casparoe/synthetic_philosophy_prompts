answer: |-
  Here is a draft of ten interview questions with follow-ups, designed to be concrete and jargon-free while pressing on the specific tensions in your guest's view.

  **1. The Baseline on Trust**
  You argue that if a person I trust tells me a policy is unjust, I can know it is unjust just by believing them, without working out the proof myself. Most people feel a resistance to that; they feel they need to see the reasoning. Why do you think we have this resistance, and why do you think it is a mistake?

  *   **Follow-up:** You call it a prejudice. But isn't there a practical risk? If I get into the habit of taking moral shortcuts, don't I lose the ability to spot it when my trusted source is actually wrong? How do I keep that ability sharp if I'm not practicing the reasoning?

  **2. Why Deference Damages the Act**
  You draw a line between moral questions that are "mine to settle" and those that aren't. For the ones that are mine, you say taking someone's word for it damages the act itself, making it not fully my own. What is it about the act that gets lost when I follow instructions rather than deciding?

  *   **Follow-up:** Let's say I follow instructions and the outcome is exactly the same as if I had decided it myself—the right person gets helped, the harm is prevented. If the result is identical, why does it matter that I didn't generate the decision internally? Is the value in the outcome or in my state of mind?

  **3. Drawing the Line (Case-Driven)**
  I want to test where that line falls between questions that are mine and questions that aren't. Suppose I work for a large tech company. Whether the company's data policy is unjust feels like a "distant" question I can take an expert's word on. But whether *I* should resign in protest feels like a "mine to settle" question. Now, imagine a middle case: Whether I should sign a specific contract clause that I know will hurt users down the line. Is that a fact about the world I can learn from a mentor, or is it a commitment I have to make?

  *   **Follow-up:** If you say it's a commitment I have to make, what changes if the contract clause is standard industry practice? At what point does a personal decision become a "distant fact" about the industry that I can just accept on testimony?

  **4. Moral Expertise and Attention**
  You allow that moral experts exist, but you suggest their advantage is often in attending to a situation better—seeing details I miss—rather than knowing more moral facts. If their skill is in *seeing* the situation, why can't they just describe what they see to me? If they can describe it, doesn't that turn their insight into testimony I can accept, which blurs your distinction?

  *   **Follow-up:** Let's assume they can't fully describe it—that some things have to be seen to be believed. If that's true, does your first claim survive? If the expert can't transmit the core of their knowledge through words, in what sense am I really gaining knowledge from their testimony?

  **5. Conflicting Testimony**
  Here is a scenario where your first two claims seem to pull in opposite directions. I have two mentors I trust equally. I am facing a personal dilemma—say, whether to forgive a friend who betrayed me. One mentor says forgiveness is required; the other says it would be weak to forgive. Since this is a "mine to settle" question, I can't just defer. But since I'm confused, doesn't their disagreement prove I lack the knowledge to settle it? How do I move forward without just guessing?

  *   **Follow-up:** If I pick one mentor to agree with just to break the tie, haven't I just turned this into a preference? How is "picking a side to commit to" different from "finding the right answer," and why does the first one count as morality?

  **6. Commitment vs. Discovery**
  This is the part I find most challenging. You say that for personal questions, the answer isn't waiting to be discovered; it is settled by what I am willing to commit to. Does this mean that if I am willing to commit to keeping a promise, it becomes the right thing to do, but if I'm not willing, it isn't? It sounds like the truth depends on my willingness.

  *   **Follow-up:** I want to press on how this differs from the common advice to "just decide for yourself." Usually, that means "the truth is out there, but you have to find it." You seem to be saying "the truth isn't there until you decide." If I decide incorrectly—say, I commit to something harmful—was I wrong? Or did I just create a different moral reality?

  **7. The "Nothing to Transmit" Claim**
  You say there is "nothing there to transmit" on these personal questions until the agent commits. Before I make up my mind about whether to give half my income to charity, is there no fact of the matter about whether I should?

  *   **Follow-up:** If there is no fact of the matter before I decide, can I be criticized for waiting too long to decide? If I delay for a year, causing harm, what did I do wrong if there was no right answer waiting for me to find it?

  **8. The Excuse Objection**
  Critics might say your view gives people a convenient excuse. If I do something questionable but say, "I was just following my mentor's advice on a non-personal matter," your view seems to let me off the hook. You might say that avoiding blame is a feature, not a bug. But if morality is supposed to guide us toward better behavior, doesn't providing a shield against blame encourage us to stop trying to be better?

  *   **Follow-up:** Let's say I use that shield to avoid taking responsibility for a harmful action. If your framework allows me to say "That wasn't my decision to make," haven't we lost the link between the person acting and the consequence of the act? Why is preserving that link less important than protecting the agent from blame?

  **9. Practical Advice**
  If I accept your view, how does it change how I give advice to friends? If a friend asks me, "Should I break up with my partner?" and I think they should, do I have to hold back? If I give them my answer, am I tempting them to act in a way that damages their own agency?

  *   **Follow-up:** So are you saying I should only describe the situation and never give a verdict? If I describe the situation but my tone makes it clear what I think, haven't I still invited them to defer? Is there a safe way to share an opinion under your rules?

  **10. Changing Your Mind**
  Finally, what would it take to change your mind on this? Is there a specific kind of case, or a philosophical argument, that would convince you that testimony *never* works in moral cases, or conversely, that it works for *all* moral cases, even the personal ones?

  *   **Follow-up:** If you found out that people who defer on personal questions actually make better moral choices than those who decide for themselves—would that empirical fact force you to abandon the idea that deference damages the act? Or is the damage to the act independent of the outcome?
