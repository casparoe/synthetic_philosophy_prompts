answer: |-
  Your friend's analogy is rhetorically powerful but legally and morally imprecise. It conflates three distinct legal doctrines—standing, clean hands, and generalized grievances—and imports them into a domain (moral criticism) where their structural purposes do not align. Below is the audit of the mapping, the disanalogies that dismantle the conclusions, and a replacement framework.

  ### 1. The Correspondence Audit
  The analogy fails primarily because it maps "standing" (a question of personal stake) to "hypocrisy" (a question of personal virtue). In law, standing asks, "Did this hurt *you*?" In your friend's moral framework, "standing" asks, "Are *you* hurtless?" These are opposite inquiries.

  *   **Plaintiff ↔ Critic:** **Holds.** Both initiate the action.
  *   **Defendant ↔ Criticized:** **Holds.** Both are the target of the claim.
  *   **Injury ↔ Moral Wrong:** **Breaks.** In law, the injury must be concrete and particularized to the plaintiff. In morals, the "injury" is often a violation of a norm that harms the community or a third party. If I criticize a murderer, I haven't been "injured" in the legal sense, but I have moral standing.
  *   **The Court ↔ Public Discourse:** **Breaks.** Courts are limited jurisdictions with finite resources. Public discourse is an open network. Limiting access to courts preserves institutional capacity; limiting access to discourse suppresses information.
  *   **The Judge ↔ The Audience:** **Partly.** Both decide the outcome, but a judge applies rigid rules; an audience weighs nuance.
  *   **Standing Question ↔ Hypocrisy Check:** **Breaks.** This is the fatal flaw. Legal standing excludes those *without* a stake. The moral rule excludes those *with* a stake (because being a hypocrite implies you participated in the wrong).
  *   **Remedy ↔ Behavioral Change:** **Partly.** Courts order damages/injunctions; criticism seeks shame/correction.
  *   **Decision on Standing ↔ Dismissal:** **Breaks.** A judge dismisses *sua sponte* (on their own). In morals, the audience often chooses to hear the argument despite the speaker.

  ### 2. Load-Bearing Disanalogies
  The conclusions your friend draws depend entirely on specific procedural features of legal standing that do not exist in moral life.

  *   **The Threshold Rule:** In court, standing is decided *before* evidence. If you lack standing, the truth of your claim is never examined.
      *   *Transfer:* **No.** In morals, dismissing a claim because the speaker is a hypocrite (without checking the claim) protects the guilty. If the Minister *did* hide offshore accounts, the Columnist's hypocrisy doesn't make the accounts vanish.
      *   *Matters:* **Yes.** This is why the "case dismissed" conclusion fails. Truth is independent of the messenger.
  *   **Non-Waivability:** Parties cannot agree to grant standing where none exists.
      *   *Transfer:* **No.** In morals, we often waive the hypocrisy objection. ("Yes, you smoke, but you're right that smoking kills me.")
      *   *Matters:* **Yes.** This kills the sweeping skepticism. We routinely accept criticism from imperfect sources.
  *   **Third-Party Standing:** Generally barred in law (you can't sue for someone else's injury).
      *   *Transfer:* **No.** Moral criticism relies heavily on third-party standing. We condemn abuse we witness but don't suffer.
      *   *Matters:* **Yes.** If this transferred, most social morality would be silenced.
  *   **Institutional Restraint:** Standing keeps courts from becoming legislatures.
      *   *Transfer:* **No.** Moral criticism *is* the legislature of social norms. Restricting it doesn't keep anyone "in their lane"; it stops the lane from being paved.
      *   *Matters:* **Yes.** The purpose of the doctrine is incompatible with the purpose of criticism.

  ### 3. Verdicts on the Conclusions
  Because the mapping breaks on the definition of "injury" and the "threshold" rule, the conclusions collapse in proportion to how much they rely on the legal procedure.

  *   **The One-on-One Dismissal:** ("You're a hypocrite, so I don't have to answer.")
      *   **Survives:** **No.** This is the *tu quoque* fallacy. The mapping fails because moral truth is not adjudicated by a judge bound by procedure. The substance remains evaluable regardless of the speaker.
  *   **The Political Case:** ("The columnist can't criticize the minister.")
      *   **Survives:** **Only Narrower.** The criticism loses *force* or *credibility*, but not *validity*. The Minister is still liable for the accounts. The analogy holds only regarding public trust, not factual correctness.
  *   **The Sweeping Skepticism:** ("Most moral criticism is out of order.")
      *   **Survives:** **No.** This relies on the "Third-Party" and "Institutional" mappings which break completely. If only the pure could criticize, morality would cease to function as a social regulatory system.

  ### 4. A Better Analogy: Witness Credibility
  The legal analogy of "Standing" is a gatekeeper (Admissible/Inadmissible). A better legal analogy is **Witness Credibility** (Weight of Evidence).

  *   **Why Better:** In court, a known liar or a criminal can still take the stand. Their testimony is *admissible* (the gate is open), but the jury is instructed to weigh it carefully (the weight is light). Hypocrisy functions similarly: it doesn't ban the criticism; it reduces the persuasive burden the critic can carry.
  *   **Where It Still Breaks:** Even a liar can tell the truth on a specific point, whereas moral criticism is often performative—the act of criticizing is itself a claim to authority, not just evidence of a fact. However, this preserves the substance: the claim must still be checked against reality, not just the speaker's biography.

  ### 5. Synthesis
  Your friend's argument works because it borrows the finality of a legal dismissal ("Case Closed") and applies it to a moral debate. But because the mapping of "injury" and "jurisdiction" breaks, the finality is illegitimate. Hypocrisy undermines the *speaker*, not the *speech*. The sweeping skepticism collapses because it treats moral criticism as a privilege reserved for the virtuous rather than a tool used by the community to define virtue.

