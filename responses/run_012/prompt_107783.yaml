prompt: |-
  Hey, so I'm a third-year cog sci student and I've somehow been volun-told to lead the discussion section next week for my phil of mind and AI course. Topic is whether neural networks actually have representations, like the realism question about interpretability. The rest of my group has trained a basic image classifier before, so they know what a hidden layer is, but they havent done any philosophy of representation and they're gonna come in thinking its either obvious (its just math, theres no representation) or obvious the other way (if a simple readout can decode it, then its in there). I need a teaching plan, not a lecture: what has to come first for the question to even make sense to them, what depends on what, and where I should stop and let them argue. 45 min section, no readings, no citations.

  Build the whole thing around a carrying example. I was gonna use a tiny image classifier that sorts cat vs not-cat. Inside, there's a unit that fires for cat faces. But if you delete that unit, the net still gets cats right by using other units that pick up whiskers and pointy ears. And if you show it a cartoon cat, the cat-face unit fires but the net says not-cat. So what does that unit represent? Does the net represent cat at all, or did my readout just find a cat-ish direction in activation space? Tell me if that example is doing too much or too little, and if its bad, give me a better one that has the right features for the realism question.

  Then map the misconceptions in the order they'll show up and exactly where in the sequence I should head each one off: the readout = representation one, the no clean unit = no representation one, the its just a lookup table one, the representations have to be symbols one, and the one where they think the whole debate is really about whether the model is conscious. Also what I should openly refuse to explain at this level (like the causal vs correlational interpretability mess) so I dont drown them. And one question I can ask at the end that would actually show whether they got the realism issue rather than just memorized the labels. Thanks!
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **User:** Third-year Cog Sci student.
      *   **Task:** Lead a 45-minute discussion section for a Phil of Mind & AI course.
      *   **Topic:** Neural Network Representational Realism (Do NNs *really* have representations?).
      *   **Audience:** Peers who know basic ML (hidden layers, classifiers) but *no* philosophy of representation. Prone to binary thinking (it's just math vs. readout proves it).
      *   **Constraints:** Teaching plan (not lecture), 45 mins, no readings/citations, must use a carrying example.
      *   **Specific Example Proposed:** Cat vs. Not-Cat classifier. Key features: Single unit fires for faces (but network works without it), unit fires for cartoons (but network rejects them).
      *   **Requirements:** Evaluate the example, map misconceptions to the sequence, identify what to cut (scope control), and provide a final assessment question.

  2.  **Evaluate the Carrying Example:**
      *   *Proposed:* Cat classifier. Unit fires for faces. Network works without it (redundancy/distributed rep). Unit fires for cartoons but network says "no" (mismatch between unit activity and network output).
      *   *Strengths:* Concrete, relates to their ML knowledge, highlights the gap between *local* activity and *global* function.
      *   *Weaknesses:* It might be *too* specific to "grandmother cell" debates. The "cartoon" aspect introduces a generalization/failure mode issue which might distract from the core ontological question of representation. The "delete the unit" part is good for distributed representation.
      *   *Verdict:* It's actually quite strong, but needs tightening. The "cartoon" bit is the tricky part. If the unit fires for a cartoon cat but the network says "not cat," that suggests the unit isn't the decision maker. This is good for showing that *activation $\neq$ representation of the class*. However, it risks confusing "representation of a feature" vs. "representation of the class."
      *   *Refinement:* Let's keep the Cat/Not-Cat but clarify the tension. The core tension is: Is the representation *in* the weights/activations, or is it only *for us* (the interpreters)? The example needs to show that the "meaning" isn't stable across contexts.
      *   *Decision:* The proposed example is good enough, but I need to warn the user to be careful about distinguishing "representing 'cat'" vs. "representing 'fur texture'". I will validate it but suggest a slight tweak to make the "readout" problem clearer. Actually, the "readout" problem is best illustrated by the *probe* argument. If I can train a linear probe to find "cat" in the noise, does that mean "cat" was there?
      *   *Revised Example Strategy:* Stick with the Cat classifier but focus on the *Probe/Readout* vs. *Mechanism* tension.
      *   *Wait, looking closer at the prompt's example:* "Unit fires for cat faces... delete it, net still works... show cartoon, unit fires, net says not-cat."
      *   *Critique:* This is actually excellent for *distributed representation* and *context dependence*. It shows that a single unit's activation isn't sufficient for the semantic content. I will endorse this but warn against getting bogged down in *why* the cartoon fails (adversarial examples etc.). Keep it on the *ontology* of the unit's activity.

  3.  **Map Misconceptions to Sequence:**
      *   *Misconception 1: Readout = Representation.* (If I can decode it, it's there.) -> Needs to be addressed early, when defining what we mean by "representation."
      *   *Misconception 2: No Clean Unit = No Representation.* (If it's distributed, it's not real.) -> Address after the "delete unit" part of the example.
      *   *Misconception 3: It's Just Math/Lookup Table.* (Eliminativism.) -> Address when discussing the "system" vs. "observer."
      *   *Misconception 4: Representations must be Symbols.* (Classical AI bias.) -> Address when comparing NN reps to symbolic reps.
      *   *Misconception 5: Consciousness.* (The "Hard Problem" derailment.) -> Needs to be shut down immediately if it arises.
      *   *Scope Control:* Causal vs. Correlational interpretability (too technical).

  4.  **Drafting the Plan (Iterative Process):**

      *   *Phase 1: Setup (0-10 mins).* Need to define "Representation" without a lecture. Use the example immediately. Don't start with definitions; start with the puzzle.
      *   *Phase 2: The Example Deep Dive (10-25 mins).* Walk through the Cat scenario. Introduce the "Probe" problem here.
      *   *Phase 3: The Philosophical Pivot (25-35 mins).* Move from "how it works" to "what exists." Realism vs. Instrumentalism.
      *   *Phase 4: Wrap & Assessment (35-45 mins).* The final question.

      *   *Refining the Flow:*
          1.  **Hook:** The Cat Unit. (Is this the 'cat'?)
          2.  **Complication 1:** Ablation. (If I kill it, 'cat' survives. So where is 'cat'?)
          3.  **Complication 2:** The Cartoon. (Unit says yes, Net says no. Who is right?)
          4.  **Complication 3:** The Probe. (I can find 'cat' anywhere. Does that mean 'cat' is everywhere?)
          5.  **Philosophical Core:** Is the representation *intrinsic* or *ascribed*?

      *   *Addressing Misconceptions:*
          *   *Readout:* Tackle in Complication 3.
          *   *Clean Unit:* Tackle in Complication 1.
          *   *Lookup Table:* Tackle in Core.
          *   *Symbols:* Tackle in Core (contrast).
          *   *Consciousness:* Pre-empt in Setup.

  5.  **Finalizing the Content:**
      *   *Example Verdict:* It's strong. It covers distributed rep (ablation) and context sensitivity (cartoon). I will advise the user to clarify that the "unit" isn't the *only* representation, but the *locus* of the debate.
      *   *Scope Cut:* Definitely cut causal mechanisms (integrated gradients, etc.). Keep it on activation patterns.
      *   *Final Question:* Needs to test if they understand that the *status* of the representation is the issue, not the *location*. "If an alien analyzed the weights, would they find 'cat' or just matrices?"

  6.  **Writing the Response:**
      *   Tone: Peer-to-peer, supportive, structured.
      *   Structure:
          1.  Verdict on the Example.
          2.  The 45-Minute Plan (Time-stamped).
          3.  Misconception Map (When to catch what).
          4.  Scope Control (What to ignore).
          5.  The Final Question.

      *(Self-Correction during drafting)*: Make sure I emphasize *discussion* techniques. Don't let the user lecture. Use "Think-Pair-Share" or direct questioning. The prompt asks for a teaching plan, not a lecture script. I need to specify *what the students do*.

      *(Refining the Example)*: The "Cartoon" part is slightly risky. If the unit fires for a cartoon cat but the network says "Not Cat," it implies the unit detects *texture* or *shape* features, not the semantic class. This is perfect for showing that *activation does not equal semantic content*. I will reinforce this interpretation.

      *(Refining the "Readout" misconception)*: This is the "Probing" debate (Hewitt & Liang, etc.). The students might think "If I train a linear classifier on layer 3 to predict 'cat', layer 3 *contains* 'cat'." The counter is "You can train a linear classifier on random noise if you try hard enough." I need to make sure the user knows how to prompt this without citing papers. "If I can find a pattern in static, is the pattern *in* the static?"

      *(Final Check)*: 45 minutes is short. Keep the intro tight. Ensure the "Consciousness" derailment is handled firmly but politely.

  7.  **Final Polish:** Check against all constraints. No citations. No readings. Cog Sci level (so they know terms like 'supervenience' maybe, but keep it grounded).

      *Let's build the response.*
answer: |-
  Here is a teaching plan designed for a 45-minute discussion section. It keeps the focus on student talk, uses your example as the engine, and structures the philosophical problems so they emerge naturally from the technical details.

  ### Part 1: Verdict on Your Example
  **Your example is excellent.** It hits the three specific pressure points needed for this debate:
  1.  **Redundancy (Ablation):** "Delete the unit, net still works." $\rightarrow$ Challenges *localization*.
  2.  **Distributed Nature:** "Uses whiskers/ears elsewhere." $\rightarrow$ Challenges *symbol-like* boundaries.
  3.  **Context/Mismatch:** "Unit fires for cartoon, net says no." $\rightarrow$ Challenges the idea that *activation = semantic content*.

  **One Tweak:** Be careful with the "Cartoon" detail. If the unit fires for a cartoon cat but the network says "Not Cat," students might get stuck on *why* the network failed (adversarial examples, training data bias).
  *   **Fix:** Frame it strictly as a **semantic mismatch**. The unit responds to *visual features* (pointy ears), but the network output responds to *classification* (natural vs. artificial). This highlights that the unit's activity is ambiguous without the rest of the network context.

  ---

  ### Part 2: The 45-Minute Plan

  **Goal:** Move students from "How do we find the representation?" to "What does it mean for a representation to exist?"

  #### 0:00 – 0:05 | Setup & Ground Rules (The "Consciousness" Pre-empt)
  *   **Action:** Write the question on the board: *"Do neural networks have representations, or do we just project them?"*
  *   **Script:** "We aren't asking if the model is conscious, feels like anything, or understands 'cat' the way you do. We are asking a structural question: Is 'cat-ness' a property of the weights/activations, or is it a story we tell to make sense of the math?"
  *   **Why:** This kills the "But it's not *really* thinking" objection before it starts.

  #### 0:05 – 0:15 | Phase 1: The "Grandmother Cell" Trap (Localization)
  *   **Activity:** Think-Pair-Share (2 mins think, 3 mins talk to neighbor, 5 mins group share).
  *   **Prompt:** "In our cat classifier, one unit fires strongly for cat faces. A naive view says: 'That unit represents Cat.' But if we delete it, the network still classifies cats correctly using whisker/ear units elsewhere. **Where did the representation of 'Cat' go?**"
  *   **Discussion Goal:** Elicit the idea that the representation is **distributed**.
  *   **Trap to Catch:** If a student says, "It's in the other units now," push back: "So the representation moved? Or was it never in the single unit to begin with?"
  *   **Philosophical Pivot:** If representation is spread everywhere, is it distinct from the processing itself?

  #### 0:15 – 0:25 | Phase 2: The Readout/Probe Problem (Instrumentalism)
  *   **Activity:** Whiteboard brainstorming.
  *   **Prompt:** "We know we can train a simple linear 'probe' on the hidden layers to decode 'Cat' from the activation patterns. Some say: 'If you can read it out, it's a representation.' **Counter-argument:** I can train a probe to find patterns in random noise if I try hard enough. Does finding a pattern mean the pattern was *there*?"
  *   **Discussion Goal:** Distinguish between **correlation** (we can map activations to labels) and **causation/ontology** (the system uses that mapping).
  *   **Key Question to Ask:** "Does the representation exist for the *network*, or only for the *scientist* holding the probe?"

  #### 0:25 – 0:35 | Phase 3: The Cartoon Mismatch (Content Stability)
  *   **Activity:** Full Group Debate.
  *   **Prompt:** "Recall the cartoon case: The 'face unit' fires for a cartoon cat, but the network outputs 'Not Cat.' **What does that unit actually represent?** Is it 'Cat'? Is it 'Pointy Ears'? Is it 'Cat-like Texture'?"
  *   **Discussion Goal:** Highlight **indeterminacy**. If the unit's firing doesn't guarantee the network's decision, the semantic content of that unit is unstable.
  *   **Philosophical Pivot:** Introduce the term **Realism vs. Instrumentalism**.
      *   *Realist:* The representation is real, even if messy.
      *   *Instrumentalist:* "Representation" is just a useful tool for us to predict the model, not a thing inside the model.

  #### 0:35 – 0:40 | Phase 4: Symbols vs. Vectors (The Classical Bias)
  *   **Activity:** Quick Fire Q&A.
  *   **Prompt:** "In classical AI, a representation is a symbol (like the word 'CAT'). In NNs, it's a vector direction. **If there's no boundary between 'Cat' and 'Dog' in the vector space (just a gradient), is it still a representation?**"
  *   **Goal:** Challenge the idea that representations need discrete boundaries to be "real."

  #### 0:40 – 0:45 | Wrap & Assessment
  *   **Action:** The Exit Ticket (see Part 5).
  *   **Closing:** "Next week, keep this in mind: When we say a model is 'biased,' are we finding a representation of bias inside it, or are we describing its behavior?"

  ---

  ### Part 3: Misconception Map
  *Where they will trip up and how to head it off.*

  | Misconception | When it shows up | How to head it off |
  | :--- | :--- | :--- |
  | **"Readout = Representation"** | Phase 2 (The Probe). Students think if a linear classifier can decode it, the rep is real. | **Ask:** "If I find a face in the clouds, is the face *in* the cloud? Or did I put it there?" Distinguish *findability* from *existence*. |
  | **"No Clean Unit = No Rep"** | Phase 1 (Ablation). Students think if no single neuron codes for 'cat', there is no representation. | **Ask:** "Where is the representation of 'democracy' in a human brain? Is it in one neuron? If not, does your brain represent democracy?" (Analogy to distributed rep). |
  | **"It's Just a Lookup Table"** | Phase 3 (Realism). Students claim the network just maps pixels to labels, no internal state matters. | **Ask:** "If it were just a lookup table, would the hidden layers matter at all? Why does the *structure* of the activation space generalize to new images?" |
  | **"Reps Must Be Symbols"** | Phase 4 (Symbols). Students expect discrete boundaries (Cat vs. Not-Cat). | **Ask:** "Human concepts have fuzzy boundaries (is a stool a chair?). Why do we demand AI representations be crisp if ours aren't?" |
  | **"But Is It Conscious?"** | Anytime. The classic Cog Sci derailment. | **Stop it immediately.** "We are bracketing consciousness. A thermometer represents temperature without being conscious. Let's stick to the structural question." |

  ---

  ### Part 4: Scope Control (What to Refuse)
  You have 45 minutes. If you try to explain the mechanics of interpretability, you will lose the philosophy.

  1.  **Refuse to explain *how* probes are trained.** (Logistic regression on activations). Just say "We can train a simple tool to predict the label from the layer."
  2.  **Refuse to explain *causal* vs. *correlational* interpretability.** (e.g., Integrated Gradients, Causal Mediation). This is the "mess" you mentioned. If a student asks, "But does the unit *cause* the output?" say: "That's a separate technical debate. For today, assume the unit is correlated. Does that correlation count as representation?"
  3.  **Refuse to solve the problem.** Your job isn't to tell them the answer (philosophers haven't agreed on one). Your job is to make sure they understand *why* it's a problem.

  ---

  ### Part 5: The Final Assessment Question
  *Do not ask a definition question. Ask a scenario question.*

  **The Question:**
  > "Imagine an alien civilization analyzes our trained Cat Classifier. They have no concept of 'cats,' 'faces,' or 'animals.' They only see matrices and activation values.
  >
  > **Would they be able to discover that the network represents 'Cats', or would they just see mathematical structures?**
  >
  > If they *can* discover it, what makes that discovery possible (is it in the math)? If they *can't*, does that mean the representation isn't real?"

  **Why this works:**
  *   If they say **"They could discover it,"** they are leaning toward **Realism** (the representation is intrinsic to the system).
  *   If they say **"They couldn't, they need our context,"** they are leaning toward **Instrumentalism** (representation is in the eye of the beholder).
  *   If they answer this, they have grasped the core tension of the section.
