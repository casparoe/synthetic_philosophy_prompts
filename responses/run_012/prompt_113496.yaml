          *   Lot is intrinsically democratic (equality of chance) but instrumentally limited (competence).
      *   *Section 4: Contemporary Implications (What to keep/leave).*
          *   Keep: The link between lot and arithmetic equality. The suspicion that election favors elites.
          *   Leave: The ancient assumption that offices are short-term/rotational. The specific link between wealth and merit. The idea that democracy is inherently incompetent at technical tasks (maybe?).
          *   Crucial distinction: Ancient "democracy" vs. Modern "representative democracy."

  5.  **Refining the Tone:**
      *   Must be scholarly but accessible (PhD level).
      *   Avoid secondary literature names (Manin, Hansen, etc.) unless necessary for concepts (but prompt says "No citations needed," so keep it textual).
      *   Be precise with Greek concepts (*axia*, *techne*, *arithmetic vs. geometric equality*) without showing off.
      *   Address the "hedge" (*dokei*) specifically.

  6.  **Self-Correction/Check during drafting:**
      *   *Check:* Did I explain why VI.2 calls election democratic?
      *   *Correction:* Yes, emphasize "from all and by all." It's about the *source* of authority, not the *mechanism* of selection.
      *   *Check:* Did I address the "skill" restriction?
      *   *Correction:* Yes, this is crucial. It shows Aristotle thinks the *function* of the office matters. Lot is democratic, but competence is necessary for the city's survival.
      *   *Check:* Is the distinction between IV.9 (Polity) and VI.2 (Democracy) clear?
      *   *Correction:* IV.9 is about *blending* to find a middle ground. VI.2 is about defining the *extreme* end of the spectrum. In the middle, you elect (to get quality) but don't restrict by wealth (to keep it open). In the extreme, you lot everything possible to maximize equality.

  7.  **Final Polish:** Ensure the structure flows logically from textual analysis to reconciliation to contemporary application. (Proceed to generate output based on this thought process).

  *(Self-Correction Note during final review)*: I need to be careful not to imply Aristotle *endorses* democracy in VI.2. He is describing it. In IV.9 he is prescribing a mix. The normative stance differs. I should highlight that IV.9 is about what makes a *good* mixed constitution, whereas VI.2 is about what makes a *pure* democracy.

  8.  **Finalizing the Argument on "Election":**
      *   IV.9: Election is oligarchic *because* it tends to select the wealthy/notable.
      *   VI.2: Election is democratic *because* it is done by the whole people without restriction.
      *   Synthesis: Election is a tool. If the electorate is restricted, it's oligarchic. If the electorate is open but the method favors the notable, it's still oligarchic *in tendency* (IV.9), but if the *principle* is that the many decide, it's democratic *in authority* (VI.2). Actually, the better distinction is: IV.9 contrasts Lot vs. Election as *methods*. VI.2 contrasts Open vs. Restricted *eligibility*.
