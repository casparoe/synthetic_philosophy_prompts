answer: |-
  This is a precise and well-formed difficulty. You have identified the central tension in Aristotle's institutional taxonomy: the apparent shift in the valence of "election" (*hairesis*) and "lot" (*klerosis*) between the normative mixing of constitutions in Book IV and the descriptive institutionalism of Book VI.

  The confusion arises because the seminar's assumption—that Aristotle is simply "the first lottocrat"—flattens his functionalism. Aristotle is not committed to sortition as a moral good in itself; he is committed to it as a marker of a specific conception of justice. To resolve the tension between IV.9 and VI.2, we need to distinguish between the *logic of selection methods* (IV.9) and the *conditions of eligibility* (VI.2), and to understand the normative weight of the phrase "it is thought to be" (*dokei*).

  Here is a reconstruction of the argument in each passage, followed by a reconciliation and a note on contemporary uptake.

  ### I. Politics IV.9: The Logic of Selection Methods

  In IV.9, Aristotle is constructing the "polity" (*politeia*), a mixed constitution that blends oligarchy and democracy to achieve stability. To mix them, he first needs to isolate their distinct "parts" or markers.

  **1. The Function of "It is thought to be" (*dokei*)**
  When Aristotle writes, "it is thought to be democratic for the offices to be assigned by lot, for them to be elected oligarchic," he is reporting the *endoxa* (common opinions) of the Greek political factions. He is cataloging how partisans identify regimes. However, he does not dismiss these markers as mere superstition; he accepts them as accurate indicators of the underlying *principle of justice* at work.
  *   **The Democratic Principle:** Arithmetic equality. Every citizen is an equal unit. Therefore, every citizen should have an equal chance at office. The lot is the only mechanism that guarantees this mathematical equality of opportunity.
  *   **The Oligarchic Principle:** Geometric (proportional) equality. Offices should be distributed according to "worth" (*axia*), which usually maps onto wealth or status. Election is the mechanism that allows "worth" to be recognized, because the voters naturally tend to choose the prominent, the wealthy, or the well-known.

  **2. Why Election is Oligarchic here**
  In this context, "election" is not defined by *who* votes, but by the *act of choosing* itself. To choose is to discriminate. To discriminate is to imply that some candidates are better than others. If you believe some are better, you likely believe inequality in distribution is justified. Therefore, the *method* of election carries an aristocratic or oligarchic logic because it privileges merit (or the appearance of merit) over pure chance.
  Conversely, the lot refuses to discriminate. It treats the cobbler and the general as identical units for the purpose of assignment. This is why the lot is the "democratic device as such" in IV.9: it is the institutional embodiment of the claim that citizens are fundamentally equal in capacity to rule.

  **3. The Mix**
  Aristotle's recipe for the "polity" is to take the oligarchic method (election, to ensure competence/merit) and combine it with the democratic condition (no property qualification, to ensure openness). This creates a system where the "best" are chosen, but the "best" can come from any economic class. Here, the lot is *not* used; it is too risky for competence. The democracy is preserved not by lot, but by the absence of wealth barriers.

  ### II. Politics VI.2: The Institutions of Extreme Democracy

  In Book VI, Aristotle is no longer mixing constitutions to find a stable mean; he is describing the institutional requirements of the fourth and most extreme kind of democracy. Here, the goal is maximizing liberty and the power of the multitude.

  **1. Liberty and Rotation**
  Aristotle defines democratic liberty as "ruling and being ruled in turn." This requires a mechanism that ensures broad participation. The lot is the most efficient way to guarantee rotation among the entire population.

  **2. The Reappearance of Election**
  You note that VI.2 lists "election of officials by all from all" as a democratic institution. This seems to contradict IV.9. However, look closely at the qualifiers.
  *   In IV.9, "election" was contrasted with "lot" as a *method*.
  *   In VI.2, "election by all from all" is contrasted with "election by some from some" (oligarchy).
  Here, the democratic character comes from the **franchise**, not the method. If the entire citizen body votes, and the entire citizen body is eligible, the procedure is democratic *in authority*, even if the *method* (voting) tends to favor the notable.
  Aristotle acknowledges that in a democracy, the people may still choose to vote for the wealthy or famous. But because the *constraint* of wealth has been removed ("from all"), the outcome is legitimate within a democratic framework.

  **3. The Restriction on Lot (The Competence Clause)**
  Crucially, VI.2 restricts the lot: it is used for offices "that do not need experience and skill" (*techne*). For offices requiring skill (e.g., generalship, finance), even extreme democracy uses election.
  This is the load-bearing step that prevents the inconsistency. Aristotle is a functionalist. He believes the city has needs that must be met. If the lot selects an incompetent general, the city loses the war. Therefore, the democratic principle (equality) must yield to the functional necessity (competence) in specific domains.
  *   **IV.9:** Lot is democratic *in principle*.
  *   **VI.2:** Lot is democratic *in application*, limited by *techne*.

  ### III. Reconciliation: Intrinsic vs. Instrumental

  Are the passages inconsistent? No, but they are operating at different levels of analysis.

  **1. Method vs. Franchise**
  *   **IV.9** isolates the **Method**. Intrinsic to the method of voting is selection based on judgment. Intrinsic to the method of lot is selection based on chance. Since democracy claims justice is arithmetic equality, Lot is intrinsically more democratic than Vote.
  *   **VI.2** isolates the **Franchise**. A vote can be democratic if the electorate is the *demos*. A lot can be oligarchic if only the wealthy are in the lottery pool (though Aristotle doesn't dwell on this). In VI.2, "election" is democratic because it is "by all from all."

  **2. Intrinsic vs. Instrumental**
  Is the lot intrinsically or instrumentally democratic for Aristotle?
  *   **Intrinsically:** Yes. It expresses the truth that citizens are equals. It denies the oligarchic claim that wealth confers a right to rule.
  *   **Instrumentally:** Yes. It prevents faction and monopoly. It ensures the many have a stake in the regime.
  *   **The Limit:** However, it is not *absolutely* democratic if it destroys the city. If the city falls because a pilot was chosen by lot, the democracy ends. Thus, the commitment to sortition is conditional on the office not requiring specialized *techne*.

  **3. Resolving the "Election" Contradiction**
  In IV.9, election is labeled oligarchic because, in the context of mixing, it is the feature that pulls the constitution toward meritocracy/aristocracy. In VI.2, election is labeled democratic because it is the feature that allows the multitude to exercise will *without* wealth restrictions.
  *   **IV.9:** Election = Selection of the "Better" (Oligarchic tendency).
  *   **VI.2:** Election = Expression of the "Many" (Democratic tendency).
  Aristotle is consistent: Election always involves judgment. If that judgment is unconstrained by wealth (VI.2), it serves the many. If that judgment is the primary mechanism of distribution over lot (IV.9), it serves the notable.

  ### IV. What to Carry Over (and What to Leave)

  For your seminar on modern lottocracy, here is how to parse the Aristotelian legacy.

  **1. What to Carry Over: The Equality Claim**
  Aristotle licenses the claim that sortition is the only procedure that treats citizens as strictly equal agents. Voting is always, to some degree, a mechanism of filtering for status, charisma, or wealth. If a modern theory of democracy claims to be based on "political equality," Aristotle forces the question: does equality mean "equal chance to rule" (lot) or "equal vote for rulers" (election)? Moderns assume the latter; Aristotle argues the former is the true democratic marker.

  **2. What to Carry Over: The Competence Constraint**
  Aristotle provides the strongest internal critique of lottocracy: the *techne* argument. If an office requires specific knowledge, sortition is not just undemocratic; it is destructive. A modern lottocracy must answer the Aristotelian challenge: Which offices require *techne*? Can a sortitive body deliberate on technical matters (e.g., climate science, monetary policy) without becoming dependent on unelected experts? Aristotle suggests that for technical roles, election (or some merit-based filter) is compatible with democracy *if* the franchise is open.

  **3. What to Leave Behind: The Nature of Office**
  Do not carry over the assumption that "office" (*arche*) means the same thing today. In Athens, most offices were executive or judicial, short-term, and collegial. They did not involve long-term policy platforms. Modern "office" is often legislative or executive leadership with significant agenda-setting power. Aristotle's defense of lot relies on the idea that ruling is a skill all citizens possess *in turn* for basic judgment, but not for specialized administration. If you apply sortition to modern legislatures, you are assuming legislation is a general skill, not a *techne*. Aristotle would be skeptical.

  **4. What to Leave Behind: The Normative Goal**
  Aristotle does not endorse the democracy of VI.2. He describes it as the deviant form where the poor rule in their own interest rather than the common good. He prefers the "polity" of IV.9 (mixed constitution). So, do not read Aristotle as a normative advocate for lottocracy. He is an analyst who admits lot is the purest expression of democratic justice, while simultaneously believing that pure democratic justice is often bad for the city.
  For the modern debate, this means separating the *descriptive* claim (lot = equality) from the *normative* claim (equality = good). Aristotle grants the first but questions the second.

  ### Summary for the Seminar
  You can tell the seminar that Aristotle is not inconsistent, but he is contextual.
  1.  **IV.9** identifies the **symbolic logic**: Lot = Equality; Election = Merit/Status.
  2.  **VI.2** identifies the **institutional reality**: Democracy uses Lot where possible, but Election where necessary (*techne*), provided the Franchise is universal.
  3.  **The Hedge (*dokei*):** Aristotle reports the partisan labels but validates the logic behind them.
  4.  **The Takeaway:** Sortition is intrinsically democratic because it instantiates arithmetic equality, but it is instrumentally limited by the functional requirements of the state. The modern assumption that election is neutral and lot is radical is, in fact, the Aristotelian position—but so is the warning that radical equality may conflict with competence.
