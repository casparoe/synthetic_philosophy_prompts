      *   *Section 3: Reconciling the Tension.*
          *   Distinguish between *Method* (Lot vs. Vote) and *Franchise* (All vs. Some).
          *   IV.9 compares Method (Lot vs. Vote).
          *   VI.2 compares Franchise (All vs. Some) *within* the method.
