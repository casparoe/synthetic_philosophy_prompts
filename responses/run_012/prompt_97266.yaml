answer: |-
  The symmballs exert genuine causal force over the symms because causation is fundamentally about counterfactual dependence and realization independence, not about the exhaustive micro-physical history of particle collisions. Your friend's reductionist stance relies on the Causal Exclusion Argument, most rigorously formulated by Jaegwon Kim: if every physical event (a symm moving) has a sufficient physical cause (prior symm states plus laws of physics), then any purported macro-level cause (the symmball) is either redundant or epiphenomenal. This argument holds water only if you assume causation is a conserved quantity like energy, where one cause "uses up" the causal potency available for an effect, but this is a category error regarding what causal relations actually are.

  Causation is better understood through an interventionist framework, such as James Woodward's, where $X$ causes $Y$ if manipulating $X$ while holding other variables fixed changes $Y$. In the Careenium, if you intervene to preserve the symmball pattern while swapping out the individual symms that constitute it, the system's behavior remains stable; conversely, if you disrupt the symmball pattern while preserving the gross kinetic energy of the symms, the behavior changes. This demonstrates realization independence: the specific micro-configuration is accidental to the outcome, while the macro-pattern is essential. If the micro-state were the true cause, slight variations in symm positions that leave the symmball intact should produce divergent outcomes, but they do not. Therefore, the causal grain of the universe, at least regarding cognitive systems, is at the symbolic level, not the neuronal level.

  Furthermore, the reductionist picture fails to account for causal proportionality. A micro-level explanation is often too specific to be a good cause; saying "symm #4,592 hit symm #12 at angle $\theta$" explains the immediate collision but fails to explain why the system transitioned to a specific functional state. The symmball provides the proportional cause—it captures the invariant structure that reliably produces the effect across different micro-realizations. To deny this is not to be a rigorous physicalist; it is to commit the mereological fallacy by assuming parts have ontological priority over the wholes they constitute. The symmball does not add energy to the system magically; it acts as a structural constraint that channels the existing kinetic energy along specific trajectories, much like a groove guides a ball. Denying the causal reality of the groove because "only the ball's momentum moves it" renders the shape of the path inexplicable.

  Finally, accepting the reductionist view makes cognitive science impossible. If only symms pushing symms is real, then "belief," "desire," and "computation" are strictly false fictions, and we cannot explain why the system avoids predators or solves puzzles, only why its particles scatter. Since the system's behavior is organized around information processing and environmental regularities tracked by symmballs, excluding symmballs from the causal story severs the link between the system's physical dynamics and its functional success. The symmballs push the symms because the pattern dictates the constraints, and in a physical system, constraints are causes.
