answer: |-
  The Chamber of Proximate Worlds was silent, save for the hum of the cooling stacks that kept the simulation engines from melting. There were no windows. Windows implied an outside, a single actuality, and in this room, there were always at least two.

  Elara Vance sat at the center of the dais. To her left sat Halloway, a former actuary whose skin had the papery texture of someone who had spent too long under UV lamps analyzing risk matrices. To her right was Kress, a linguist turned adjudicator, who believed that the grammar of liability was the only true law. They were the Tribunal for Counterfactual Indemnity, and they were here to decide the price of a flood that had drowned District Nine.

  On the table before them lay the physical evidence: a rusted servo-motor from Gate Four of the Aegis Coastal Barrier. Beside it lay the digital record: the Inspection Log of Aegis Engineering, timestamped nine days past the contractual deadline.

  "The principle is unchanged," Elara said, her voice echoing slightly in the acoustic dampening. "The Policy of Subjunctive Indemnity pays out based on the Nearest Possible World in which the breach did not occur. We are bound by the Principle of Minimal Mutation. We do not rewrite history. We nudge it."

  Halloway nodded, tapping his stylus against his tablet. "The Defense argues that the mutation required to save District Nine is too large. They posit a second defect. Gate Six. Corrosion unknown to all parties at the time of inspection."

  "And the Claimants?" Kress asked.

  "Claimants argue the mutation is the timestamp," Elara said. "Nine days. A digital edit. They argue that in the world where the report is filed on time, the corrosion on Gate Four is caught, repaired, and the flood does not happen."

  "The Defense says Gate Six fails regardless," Halloway muttered. "In the world where Gate Four holds, Gate Six gives way three hours later. The water level is the same. The damage is the same. Therefore, the breach caused no loss."

  Elara looked at the two counsel tables below the dais. On the left, representing the District Nine Claimants, was Kaelen Moss. He looked tired. On the right, for Aegis Engineering, was Aris Thorne. He looked like he had already won.

  "Mr. Thorne," Elara said. "Approach."

  Thorne stood. He was a large man, wearing a suit that seemed designed to absorb light rather than reflect it. "Honored Tribunal. We are asked to pay for a disaster that was inevitable. The physics of the estuary do not care about our filing deadlines. Our opponent asks you to construct a world where Gate Four is sound. We accept that mutation. It is small. A patch of steel, a weld. But they ask you to stop there. They ask you to ignore Gate Six."

  Thorne gestured to the holographic display above them. A wireframe model of the barrier glowed blue. A red pulse appeared at Gate Four, then vanished. Then a red pulse appeared at Gate Six.

  "In the Actual World, Gate Four failed," Thorne said. "In the Claimants' Nearest World, Gate Four holds. But in that same world, the tide remains high. The storm surge remains high. Gate Six, which was structurally compromised by a manufacturing defect from ten years prior, fails under the pressure. The water enters. The district drowns. The payout for Subjunctive Indemnity requires that the loss be *avoided* in the counterfactual. If the district drowns in the Nearest World, the liability is zero. We are not being sued for the flood. We are being sued for the mood of the sentence describing the flood."

  He paused, letting the point land. "My client made a prediction: 'If the seal fails, we lose the batch.' That was indicative. The Claimants want to convert it to an accusation: 'If the seal had held, we would have saved the batch.' But if the batch is lost anyway due to a different seal, the accusation is hollow. The distance to a world where *both* gates hold is vast. That is not a minimal mutation. That is a fantasy."

  Elara turned to Moss. "Ms. Moss. Your rebuttal."

  Moss stood. He was younger, sharper, wearing the grey uniform of the Public Trust. "The Defense is measuring distance in meters of water. We are measuring distance in acts of will. The Principle of Minimal Mutation does not prioritize physical states over human actions. In fact, the Rulebook is clear: the Nearest World is the one requiring the smallest departure from the Actual."

  Moss stepped forward. "What is smaller? Changing the corrosion rate of a steel gate that has been underwater for twenty years? Or changing the timestamp on a digital file submitted by a project manager sitting in an air-conditioned office?"

  A murmur went through the gallery.

  "Changing the steel requires rewriting the chemistry of the estuary," Moss continued. "It requires imagining a world where entropy behaved differently. Changing the timestamp requires imagining a world where a man clicked 'send' nine days earlier. That is the smaller mutation. That is the Nearest World."

  Thorne objected. "Relevance. The timestamp is irrelevant if the outcome is identical."

  "The outcome is not identical," Moss snapped. "Because in the world where the report is filed on time, the inspection protocol is triggered. The protocol mandates a full system sweep. In the Actual World, the sweep was delayed. In the Nearest World, the sweep happens on schedule. Gate Six is found. Gate Six is repaired. The flood does not happen."

  Thorne laughed, a dry, brittle sound. "So now the Nearest World includes a miracle inspection? You're asking the Tribunal to assume that a routine check would catch a ten-year-old latent defect? That is a larger mutation than the steel holding!"

  "It is a procedural certainty," Moss countered. "The contract stipulates that on-time filing triggers the Level Five Sweep. Late filing triggers Level Three. The Level Five Sweep catches latent defects. The Level Three does not. We are not asking for a miracle. We are asking for the contract to be followed."

  Elara raised a hand. The room quieted. "There is a second matter. The Pumps."

  Thorne sighed. "The pumps were never engaged, Tribunal. The water came through the gates, not over them. The assurance clause states: 'If the barrier is overtopped, the pumps will hold.' This is an indicative conditional. It was not tested."

  "The Claimants read it subjunctively," Elara said. "They argue that the assurance was a guarantee of capacity, not just a prediction of event. 'If the barrier *were* overtopped, the pumps *would* hold.' They argue that because the report was late, the pumps were not certified. In the Nearest World, where the report is on time, the pumps are certified. And they argue that in the Actual World, the pumps were faulty."

  "We have no data on the pumps," Thorne said. "They were not tested. To assert they would have failed is speculation. To assert they would have held is speculation. You cannot adjudicate liability on a double subjunctive. 'If we had filed, you would have tested, and if you had tested, you would have found, and if you had found, you would have fixed.'"

  "It is a chain of causality," Moss said. "Not a chain of miracles."

  Elara leaned back. The cooling stacks hummed louder. This was the crux. The Defense wanted to define the Nearest World by physical inevitability. The Claimants wanted to define it by procedural fidelity. Both cited the Principle of Minimal Mutation. Both claimed the other was asking for a world too distant from the Actual.

  "Recess," Elara said. "One hour."

  ***

  In the deliberation chamber, the air was cooler. Halloway poured three cups of synthetic coffee.

  "Thorne is right about the physics," Halloway said, stirring sugar into his cup. "Gate Six was rotten. We have the metallurgical reports. Even if Gate Four held, the probability of Gate Six failing was eighty-four percent. To assume Gate Six holds in the Nearest World is to assume a world significantly different from our own."

  "But Moss is right about the timestamp," Kress said. She was looking at the Rulebook, a leather-bound volume that hadn't changed in thirty years. "The Principle of Minimal Mutation prioritizes local changes. A digital timestamp is local. Corrosion is systemic. To heal the corrosion is to rewrite the history of the harbor. To change the timestamp is to rewrite the history of a morning."

  "So we rule for the Claimants?" Elara asked.

  "On the gate, yes," Kress said. "But the pumps? That troubles me. The contract says 'If overtopped.' It did not say 'If breached.' The water came through the breach. The pumps are irrelevant to the Actual World. Why should they be relevant to the Counterfactual?"

  "Because the Claimants argue that the late report prevented the certification of the pumps," Halloway said. "If the pumps were faulty, and the gate held, but the water overtopped... then the district drowns anyway. The Defense is arguing that the pumps were faulty too. They are arguing for a 'Total Loss' counterfactual."

  Elara rubbed her temples. "So the Defense argues: Nearest World = Gate Four Fixed, Gate Six Fails, Pumps Irrelevant. Loss = Total."
  "The Claimants argue: Nearest World = Report On Time, Gate Four Fixed, Gate Six Fixed, Pumps Certified. Loss = Zero."

  "They are both measuring distance," Kress said softly. "But they are measuring from different anchors. Thorne anchors to the *outcome*. Moss anchors to the *breach*."

  "Which anchor does the Rulebook support?" Elara asked.

  "The Rulebook says 'Smallest departure from actuality,'" Kress recited. "It does not specify whether 'actuality' includes human negligence or only physical states."

  "But the prompt... the prompt from the old trade," Elara murmured, thinking of the retired experimentalists who had lobbied for this court. "They said the difference in mood is worth money, careers, prison sentences. 'If the seal fails' vs 'If the seal had held.' If we rule for Thorne, we validate the idea that human error is negligible compared to physical decay. If we rule for Moss, we validate the idea that human procedure controls physical reality."

  Halloway finished his coffee. "If we rule for Moss, we open the door to infinite liability. Every accident has a procedural antecedent. A missed signature, a late email. We could rewrite the world with a clerical error."

  "If we rule for Thorne, we make the insurance worthless," Kress countered. "If inevitability is a defense, no one ever pays. Everything is determined by something else. Gate Six would have failed. The storm would have been worse. The sea wall was old. It is all inevitability."

  Elara stood up. "We have to decide if the mood matters. Does the shift from prediction to accusation change the proximity of the world?"

  "It changes the burden," Halloway said. "Prediction looks forward. Accusation looks back. Looking back, everything looks determined. Looking forward, everything was possible."

  "We are looking back," Elara said. "But we must simulate looking forward. We must construct the world where the breach did not happen, and let it play out."

  "Without assuming the miracle?" Kress asked.

  "Without assuming the miracle," Elara confirmed. "But without assuming the doom, either."

  ***

  The Tribunal reconvened. The gallery was full. The representatives of District Nine sat in the front row, their faces dry but drawn. The Aegis executives sat behind them, checking their watches.

  Elara picked up the stylus. The recording light on the dais turned red. She did not speak to the room. She spoke to the record.

  **FINDING OF FACT AND LAW**
  **Case:** District Nine v. Aegis Engineering
  **Tribunal:** Counterfactual Indemnity Court, Sector 4
  **Adjudicators:** Vance, Halloway, Kress

  **The Question:**
  The Tribunal is asked to determine the liability of the Defendant under the Subjunctive Indemnity Policy. The core dispute concerns the definition of the "Nearest Possible World" in which the contractual breach (the late filing of the Inspection Log) did not occur.

  **The Defense Position:**
  The Defense contends that in the Nearest World, the physical defect in Gate Six remains. They argue that the corrosion of Gate Six is a fact of the Actual World, and removing it constitutes a larger ontological departure than maintaining the status quo of the flood. They argue that the loss is inevitable, rendering the breach causally null.

  **The Claimant Position:**
  The Claimants contend that the Nearest World is defined by the procedural correction. They argue that changing a digital timestamp is a smaller mutation than altering the physical state of the barrier. They further argue that the contractual protocol, had it been followed, would have identified and remedied the defect in Gate Six.

  **The Ruling on Proximity:**
  The Tribunal finds in favor of the Claimants regarding the definition of the Nearest World. The Principle of Minimal Mutation prioritizes changes to voluntary human action over changes to entrenched physical states. To assume the corrosion of Gate Six would remain undiscovered requires the Tribunal to assume a failure of the contractual protocol *in addition* to the correction of the filing deadline. This compounds the mutation.

  The Nearest World is one where the report is filed on time. In that world, the Level Five Sweep is mandated by contract. It is not a miracle that the Sweep finds the defect; it is the function of the Sweep. To assume the Sweep fails is to introduce a second breach in the counterfactual, which violates the principle of minimal departure. Therefore, the Tribunal rejects the Defense's claim of inevitability. The flood was not inevitable in the Nearest World.

  **The Ruling on the Pumps (The Subjunctive Guarantee):**
  The Tribunal addresses the secondary clause regarding the pump capacity. The contract states: "If the barrier is overtopped, the pumps will hold." In the Actual World, the barrier was breached, not overtopped. The pumps were not engaged.

  The Claimants ask the Tribunal to read this clause subjunctively: "If the barrier *had been* overtopped, the pumps *would have* held." The Defense argues this is speculative.

  The Tribunal finds that the late filing prevented the certification of the pumps. In the Nearest World, the pumps are certified. However, certification is not function. The Tribunal cannot ascertain with sufficient probability whether the pumps would have held in a world where the water level exceeded the barrier. The evidence is absent from the Actual World record.

  To award damages based on the pump failure would require the Tribunal to simulate a world where the barrier holds (Gate Four and Six repaired) *and* the storm surge is higher (overtopping occurs). This requires two mutations: the repair of the gates and the intensification of the storm. This exceeds the threshold of Minimal Mutation.

  Therefore, liability is assessed only on the breach of the gate maintenance, not the capacity of the pumps.

  **Conclusion:**
  The Defendant is liable for the damages caused by the failure of Gate Four and Gate Six, as both would have been remedied in the Nearest World. The Defendant is not liable for hypothetical overtopping scenarios.

  **Dissenting Opinion (Adjudicator Halloway):**
  I dissent regarding the Gate Six ruling. The majority argues that assuming the Level Five Sweep finds the defect is not a miracle. I argue it is an assumption of efficacy that the Actual World does not support. In the Actual World, inspections are fallible. To assume a perfect inspection in the Counterfactual World is to create a world *better* than the Actual, not merely *nearest* to it.

  The Principle of Minimal Mutation should preserve the fallibility of human systems. In the Nearest World, the report is filed on time. But the inspectors are the same humans, with the same blind spots. The probability of finding the Gate Six defect is not one hundred percent. By ruling it as certainty, the Tribunal shifts the burden from "probability of loss" to "certainty of perfection."

  Furthermore, regarding the mood: The majority treats the contract as a promise of safety. It is a promise of effort. "We will inspect." Not "We will find." By conflating the inspection with the discovery, the Tribunal converts an indicative obligation into a subjunctive guarantee. This sets a precedent where every procedural delay becomes the sole cause of every subsequent accident, regardless of physical inevitability. We are not insurers of fate. We are insurers of deviation. The deviation here was nine days. The loss was a district. The ratio is unjust.

  **Order:**
  Payout authorized for structural failure damages. Claim regarding pump capacity denied. Case closed.

  Elara put the stylus down. The red light faded.

  Thorne was already packing his briefcase, his jaw tight. He had lost the main claim, but the dissent would give him ammunition for the appeal. Moss was not smiling. He had won the district, but the pumps remained a question mark, a cloud over the safety of the rebuild.

  Elara looked at the rusted servo-motor on the table. It was just metal. It did not know about timestamps, or nearest worlds, or the difference between what happened and what might have. It simply failed.

  "Adjourned," she said.

  The gallery stood. The hum of the cooling stacks seemed louder now, filling the silence left by the law. They had measured the distance between worlds, and found it to be exactly nine days, plus the width of a weld. It was not enough to save everyone, but it was enough to pay for the ones they could.
