answer: |-
  **Project Title:** Robust Consequentialism: An Engineering Approach to Cluelessness

  **Project Summary**
  Consequentialist ethics faces the problem of "cluelessness": because the long-term effects of our actions are unpredictable, a theory demanding we maximize good consequences appears to yield no determinate verdicts. Existing responses either demand we make best-guess estimates on thin evidence or restrict the theory to foreseeable short-term effects. Both options are unsatisfactory. This project proposes a third path inspired by software engineering. In complex codebases, engineers cannot predict all downstream effects of a change; instead, they rely on *invariants* and *robustness*—properties that hold across a wide range of unknown states. I propose to develop a criterion of "consequence-robustness" for ethics. The goal is a 5,000-word working paper determining whether a non-vacuous robustness criterion can resolve cluelessness without collapsing into rule-based ethics.

  **The Research Question**
  The central question is: *Is there a non-vacuous, non-question-begging criterion of consequence-robustness that yields determinate ethical verdicts in cases of long-term uncertainty?*

  To be successful, the criterion must meet three conditions:
  1.  **Epistemic Accessibility:** We must be able to know an act is robust without knowing its specific long-term outcomes.
  2.  **Non-Vacuity:** The criterion must not rule out all actions (paralysis) or approve all actions (triviality).
  3.  **Distinctiveness:** The verdicts must differ from restricted consequentialism (e.g., counting only foreseeable effects) or Rule Consequentialism in at least some significant cases.

  **Background and Motivation**
  The debate on cluelessness is currently stalled between two poles. The first ("Expectationalism") insists we must calculate expected value even when probabilities are undefined or nearly zero. This seems epistemically arrogant. The second ("Restrictionism") retreats to counting only foreseeable consequences or assessing rules rather than acts. This seems to abandon the core consequentialist insight that what matters is the actual state of the world, not our access to it.

  Both sides assume that if we cannot predict the *specific* trajectory of consequences, we cannot evaluate the act. My background in software engineering suggests this is a false dichotomy. When modifying a large, unfamiliar system, I do not predict every downstream bug. Instead, I verify that the change preserves system invariants (e.g., type safety, memory constraints). These are local properties that guarantee global stability across a space of unknown behaviors.

  I suspect consequentialism needs an analogous notion: an act is right if it preserves certain "moral invariants" across the space of possible long-run futures, even if we cannot rank those futures. However, it is unclear if moral invariants exist or if relying on them simply smuggles in deontological constraints. This project tests that suspicion.

  **Methodology**
  This work is primarily conceptual. It involves defining a formal structure for "robustness" in an ethical context and stress-testing it against thought experiments. I will not be conducting empirical research or surveys. The work consists of two parts:

  1.  **Conceptual Clarification (60%):** Translating the engineering concepts of invariants and robustness into ethical terms without losing precision. This involves defining the "space of possible futures" and what it means for a value to hold across that space.
  2.  **Case Testing (40%):** Applying the draft criterion to standard cluelessness cases (e.g., saving a life vs. trivial consumption) to see if it generates verdicts.

  I must be honest about the limitations: this is armchair philosophy. The "testing" is checking for coherence and alignment with considered judgments, not empirical validation. The risk is that the resulting criterion is either too weak to guide action or so strong it becomes a disguised form of rule-worship.

  **Key Challenges**
  The proposal addresses two specific theoretical sticking points that often derail this line of inquiry:

  1.  **The Symmetry Problem:** Cluelessness is often treated as symmetric (we know neither good nor bad long-term effects). However, intuition suggests asymmetry: we are often more confident about long-term *bad* effects (e.g., existential risks, systemic instability) than long-term *good* effects. In engineering, safety properties (nothing bad happens) are often easier to verify than liveness properties (something good happens). I will investigate whether a robustness criterion can leverage this asymmetry without begging the question. If robustness only identifies "safe" acts but never "best" acts, does it solve the problem or merely limit damage?
  2.  **The Reflexivity Problem:** If the criterion says "act only when consequences are robust," is *adopting this criterion* itself robust? If promoting robust consequentialism leads to unpredictable long-term chaos, the theory might be self-undermining. I will dedicate specific attention to whether the theory can endorse its own adoption without circularity.

  **Work Plan (6 Months, Part-Time)**
  *Note: This schedule assumes approximately 10 hours of work per week.*

  *   **Month 1: Mapping the Analogy.**
      *   Draft precise definitions of "invariant," "abstraction layer," and "robustness" in the ethical context.
      *   Identify where the engineering analogy breaks down (e.g., code has a spec; ethics arguably does not).
      *   *Deliverable:* A 2-page glossary of terms and a draft definition of the Robustness Criterion.

  *   **Month 2: Stress-Testing the Definition.**
      *   Apply the draft criterion to simple cases.
      *   Check for vacuity: Does it forbid everything?
      *   Check for triviality: Does it allow everything?
      *   *Deliverable:* Revised definition with boundary conditions.

  *   **Month 3: The Symmetry Investigation.**
      *   Focus specifically on the Good vs. Bad asymmetry.
      *   Test cases where long-term harm is plausible but long-term benefit is speculative.
      *   Determine if the criterion yields "negative robustness" (avoiding disaster) without "positive robustness" (ensuring success).
      *   *Deliverable:* Section draft analyzing asymmetry.

  *   **Month 4: Comparison with Alternatives.**
      *   Compare verdicts against Foreseeable Consequentialism and Rule Consequentialism.
      *   Identify at least one case where Robust Consequentialism diverges from these views.
      *   If no divergence is found, the project risks collapsing into an existing view.
      *   *Deliverable:* Comparative analysis notes.

  *   **Month 5: Reflexivity and Self-Application.**
      *   Address the reflexive problem. Can the theory recommend itself?
      *   If the theory fails its own test, can it be modified, or is it fatal?
      *   *Deliverable:* Section draft on reflexivity.

  *   **Month 6: Synthesis and Writing.**
      *   Assemble the working paper.
      *   Refine arguments for clarity and brevity.
      *   Ensure the conclusion clearly states whether the research question was answered in the affirmative or negative.
      *   *Deliverable:* Final 5,000-word working paper.

  **Success and Failure Conditions**
  *   **Success:** A formulated criterion of consequence-robustness that survives the vacuity objection, handles the symmetry problem (either by resolving it or explaining it), and yields a verdict on at least one standard cluelessness case that differs from restricted consequentialism.
  *   **Partial Success:** A clear demonstration that the engineering analogy *cannot* be mapped to ethics without collapsing into Rule Consequentialism. This is a valuable negative result.
  *   **Failure:** The criterion turns out to be indistinguishable from "guess your best estimate" (returning to the start) or is so restrictive it mandates total inaction.
  *   **Pivot:** If the robustness criterion proves too difficult to define in 5,000 words, the scope will narrow to just the Symmetry Problem, arguing that cluelessness is fundamentally asymmetric and that this alone shifts the burden of proof in consequentialist debates.

  **Feasibility and Scope**
  Six months of part-time work is sufficient for a 5,000-word working paper, provided the scope remains narrow. I am not attempting to solve consequentialism. I am testing one specific mechanism (robustness) against one specific problem (cluelessness). The risk is scope creep: trying to define a full moral system rather than a decision criterion. I will mitigate this by adhering strictly to the month-by-month plan and treating the output as a *proposal* of a framework, not a defense of a complete ethics.

  The question is not too big for this timeframe because I am not requiring a final proof, but rather a viability assessment. If the concept is viable, the paper will show how. If it is not, the paper will show where it breaks. Both outcomes fit the word count and timeline.

  **Conclusion**
  This project leverages a unique interdisciplinary perspective to break a stalemate in normative ethics. By treating moral uncertainty as a systems engineering problem, I aim to show that we can evaluate actions by their stability across unknown futures, not just their expected value. Whether this succeeds or fails, it clarifies the structure of the cluelessness objection and offers a new vocabulary for the debate.
