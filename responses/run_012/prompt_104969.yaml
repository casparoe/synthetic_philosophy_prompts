answer: |-
  Here is the specification for an adequate Accuracy-First / Epistemic Utility Theory (EUT) account. This is not a defense of the program, but a bill of requirements that any version must satisfy to be considered viable, along with the fault lines where the machinery tends to break.

  ### I. The Desiderata (The Spec)

  #### A. Paradigm Cases
  *The theory must deliver the correct verdict in these scenarios.*

  1.  **The Plainly Fine Case:**
      *   **Case:** You have overwhelming evidence for $P$ (e.g., clear visual perception in good light) and assign $cr(P) = 0.99$.
      *   **Verdict:** This credence must be rated as rational and (ex ante) accuracy-optimal.
      *   **Consideration:** If the theory condemns standard, successful cognition, it is revisionary to the point of absurdity.
      *   **Negotiability:** **Non-negotiable.**

  2.  **The Plainly Nuts Case:**
      *   **Case:** You assign $cr(P) = 0.5$ to a known logical tautology, or $cr(P) = 0.9$ despite possessing no evidence favoring $P$ over $\neg P$.
      *   **Verdict:** This credence must be rated as irrational and accuracy-dominated.
      *   **Consideration:** The theory must rule out incoherence and evidence-insensitivity.
      *   **Negotiability:** **Non-negotiable.**

  3.  **The Reasonable Disagreement Case (Permissivism):**
      *   **Case:** Two agents share the exact same total evidence but assign different credences to $P$ (e.g., 0.7 and 0.8) due to different reasonable priors or weighting schemes.
      *   **Verdict:** The theory must specify whether *both* are rational (Permissivism) or only *one* is (Uniqueness).
      *   **Consideration:** This determines the flexibility of the norm. Most intuition suggests some permissivism; most formal EUT results suggest uniqueness.
      *   **Negotiability:** **Highly Negotiable.** (This is the primary fault line between "Joycean" and "Leitgeb-style" accounts).

  4.  **The Expert Deference Case:**
      *   **Case:** You know Agent B has all your evidence plus more, and is fully rational. You learn $cr_B(P) = x$.
      *   **Verdict:** Your new credence $cr_{new}(P)$ should equal $x$ (Principle of Reflection/Expert Deference).
      *   **Consideration:** Failing this implies you think you can reason better than someone with strictly more information.
      *   **Negotiability:** **Non-negotiable** (for a synchronic account), **Tension-Prone** (for diachronic accounts).

  5.  **The Self-Correction Case:**
      *   **Case:** You learn that your reasoning faculties are currently compromised (e.g., fatigue, bias) or that you have updated incorrectly in the past.
      *   **Verdict:** You must be able to adjust your credence function to restore coherence without needing "new evidence" about the world.
      *   **Consideration:** Rationality must be reflexive; you must be able to take your own rationality as an object of evidence.
      *   **Negotiability:** **Non-negotiable.**

  #### B. Conceptual Distinctions
  *The theory must not collapse these categories.*

  1.  **Credence vs. Outright Belief:**
      *   **Requirement:** The account must handle graded confidence, not just binary acceptance.
      *   **Consideration:** Accuracy is a function of distance from truth; binary belief lacks the resolution for proper scoring rules.
      *   **Negotiability:** **Non-negotiable** (for EUT specifically).

  2.  **Accuracy vs. Rationality:**
      *   **Requirement:** It must be possible to be rational but inaccurate (bad luck) and irrational but accurate (good luck).
      *   **Consideration:** If rationality *is* accuracy, you cannot criticize a lucky guess. The norm is *expected* accuracy, not actual.
      *   **Negotiability:** **Non-negotiable.** (Collapsing this turns epistemology into consequentialism).

  3.  **Local vs. Global Accuracy:**
      *   **Requirement:** The theory must distinguish between the accuracy of a single credence $cr(P)$ and the accuracy of the whole function $cr$.
      *   **Consideration:** A single credence might look accurate while the system is incoherent (Dutch Bookable).
      *   **Negotiability:** **Non-negotiable.** (Probabilism is a global constraint).

  4.  **Required vs. Permitted:**
      *   **Requirement:** The theory must distinguish between credences you *must* have and credences you *may* have.
      *   **Consideration:** Ties to the Permissivism case. If the theory mandates a single precise credence for every proposition, it eliminates the "permitted" category entirely.
      *   **Negotiability:** **Negotiable** (Depends on the Permissivism stance).

  #### C. Formal Results
  *The mathematics must yield these theorems.*

  1.  **Probabilism (Coherence):**
      *   **Requirement:** Any credence function violating the probability axioms must be accuracy-dominated by one that satisfies them.
      *   **Consideration:** This is the primary selling point of EUT over Dutch Book arguments.
      *   **Negotiability:** **Non-negotiable.**

  2.  **Conditionalization (Updating):**
      *   **Requirement:** Upon learning evidence $E$, the update rule that maximizes expected accuracy is Conditionalization ($cr_{new}(\cdot) = cr_{old}(\cdot | E)$).
      *   **Consideration:** Without this, the theory is only synchronic and cannot guide inquiry.
      *   **Negotiability:** **Non-negotiable.**

  3.  **Propriety Agreement/Divergence:**
      *   **Requirement:** All *proper* scoring rules must agree on which options are dominated; they may diverge on which non-dominated option is best.
      *   **Consideration:** Ensures the result isn't an artifact of choosing the Brier Score over Log Score.
      *   **Negotiability:** **Non-negotiable.**

  ---

  ### II. The Fault Lines (Joint Unsatisfiability)

  Here are two pairs of requirements that generate significant tension. You cannot easily satisfy both without compromising the spirit of one.

  #### Tension 1: Strict Propriety vs. Reasonable Disagreement (Permissivism)
  *   **The Conflict:** To prove Probabilism via accuracy dominance, you need **Strictly Proper** Scoring Rules. A strictly proper rule ensures that for any probability function $p$, the expected score is uniquely maximized by reporting $p$.
  *   **The Problem:** If evidence determines a specific probability function (or a convex set of them), and rationality is defined as maximizing expected accuracy relative to that evidence, Strict Propriety implies there is **one unique rational credence** for any body of evidence.
  *   **The Clash:** This rules out the "Reasonable Disagreement" case (Desideratum A.3). If two people have the same evidence, Strict Propriety + Accuracy Maximization dictates they must have the *same* credence. To save Permissivism, you must either weaken Propriety (risking the Probabilism proof) or argue that evidence underdetermines the probability function (which pushes the problem back to priors).
  *   **Status:** **Jointly Unsatisfiable** in standard frameworks. You get Probabilism via dominance, or you get Permissivism, but standard EUT sacrifices Permissivism.

  #### Tension 2: Expert Deference (Reflection) vs. Conditionalization
  *   **The Conflict:** Desideratum A.4 requires you to defer to an expert (or your future self) by aligning your credence with theirs. Desideratum C.2 requires you to update by Conditionalization on the evidence that *they have that credence*.
  *   **The Problem:** In cases involving self-locating belief or forgotten evidence (e.g., the "Forgetful Driver" or Arntzenius's "No Regrets" cases), conditionalizing on the fact "My future credence will be $x$" does not always yield credence $x$. Sometimes, knowing you will have credence $x$ gives you evidence that you are irrational or have lost information.
  *   **The Clash:** If you follow Reflection (Deference), you may violate Conditionalization. If you follow Conditionalization strictly, you may violate Reflection. Accuracy arguments generally support Reflection, but the diachronic update rule is Conditionalization.
  *   **Status:** **Jointly Unsatisfiable** in specific edge cases involving self-location or memory loss. One norm must be indexed or restricted.

  ---

  ### III. The Heavy Lifter

  **The Single Requirement:** **Strict Propriety.**

  **Why it does the most work:**
  Strict Propriety is the mathematical engine that drives the entire Accuracy-First program. It is the constraint that rules out the most "otherwise-popular" views.

  1.  **It kills Non-Probabilism:** Without strict propriety, you cannot prove that incoherent credences are always dominated by coherent ones (the Joyce Theorem).
  2.  **It kills Permissivism:** As noted in Tension 1, strict propriety implies a unique maximizer for expected accuracy. This rules out any view that says "a range of credences are equally rational given the same evidence."
  3.  **It kills Pragmatic Encroachment:** Strict propriety isolates epistemic utility from practical utility. If you allow practical stakes to alter the scoring rule, it ceases to be strictly proper in the epistemic sense, and the dominance arguments for Probabilism collapse.
  4.  **It drives Conditionalization:** The proof that Conditionalization is the optimal updating rule (Greaves & Wallace) relies entirely on the expectation being calculated using a strictly proper rule.

  **The Cost:** By doing all this work, Strict Propriety forces the theory into a "Uniqueness" corner. It makes the account rigid. It demands that for any evidence state, there is a single, mathematically identifiable "best" credence. If you find the idea that two rational people can disagree (with the same evidence) intuitive, Strict Propriety is the requirement you have to sacrifice—and if you do, the proofs for Probabilism and Conditionalization lose their force.
