prompt: |-
  I'm a graduate student in metaphysics working through the literature on dispositions, and I'm trying to write a seminar paper on whether dispositional properties can be analysed in terms of counterfactual conditionals. I'd like you to act as an expert in the metaphysics of dispositions and give me a careful, unhurried conceptual explanation. Before you write the explanation proper, spend a few sentences sketching how you intend to organise it, and flag any point at which you think the framing of the question is doing hidden work. Two stipulations about what I need: I'm not asking for a survey, a reading list, or citations — I can't chase references right now and I don't want you guessing at them — and I don't need the standard counterexamples rehearsed for their own sake, since I've already read them. What I'm missing is a conceptual diagnosis of why the different families of counterexample break the analysis for different reasons, and why that difference is what makes repairing the analysis hard rather than a matter of patching a single clause.

  Here is my reconstruction, and I'd like you to check it and correct it as you go. The simple analysis says that an object is disposed to manifest M in response to stimulus S just in case it would M if it were S. Two families of case are usually said to break this. In the first, the stimulus itself destroys or creates the causal basis of the disposition: a wire that conducts only because a hidden machine makes it live at the very instant it is touched, or a glass that a mechanism renders shatterproof at the moment of impact. In the second, the basis is untouched but something else prevents the manifestation: a fragile glass packed in foam, a soluble crystal sealed in plastic. The best-known repair replaces the simple conditional with one whose antecedent holds fixed the intrinsic property that constitutes the disposition's basis, roughly: x is disposed to M when S iff x has some intrinsic property P such that, if x were S while still having P, it would M. My understanding is that this handles the first family and not the second, and I want to understand exactly why — in particular, whether the repair is principled or whether it simply helps itself to the idea that nothing interferes.

  The case I've actually been chewing on, and the reason I'm writing, is one I haven't seen discussed. A crystal of a soluble salt sits in a beaker. A hidden mechanism detects the instant water is poured in and, in that instant, coats the crystal in a waterproof film while simultaneously dropping a decoy crystal of the same salt into the beaker, which dissolves in full view of anyone watching. So the crystal really is soluble, the film is entirely extrinsic and no part of its microstructure, and yet the crystal itself never dissolves under the stimulus. I'd like you to tell me whether this belongs to the first family, the second, both at once, or something the taxonomy doesn't cover; whether it refutes the simple analysis, the repaired one, both, or neither; and whether my description is even well-formed, since the decoy part seems to trade on how one individuates the manifestation — the crystal dissolving, versus dissolving happening in the beaker. Then I want you to press hard on the following: suppose the film is not a lucky accident but is nomically guaranteed by the crystal's own microstructure, so that anything with that microstructure necessarily comes with a film. Does the repaired analysis still have a principled reason to set the film aside, or does holding the intrinsic property fixed quietly presuppose that no interference is present, which would make the analysis either circular or vacuous? Please reason step by step, distinguish clearly between the claim that a disposition is present and the claim that a certain conditional is true, and finish by saying which parts of my framing you think are confused and how you would restate the issue instead.
