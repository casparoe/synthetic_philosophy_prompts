answer: |-
  This is a sophisticated and well-motivated sketch. You are grappling with the central tension in the metaphysics of chance: the gap between the *role* chance plays in our epistemology (guiding credence) and the *nature* chance has in our metaphysics (frequencies, best systems, propensities).

  Here are comments on your three specific points, followed by an analysis of the costs of your commitment to normativity.

  ### 1. The Constitutive/Substantive Fork: Dilemma or False Dichotomy?

  You frame the choice as: either PP is a definition (making violations impossible but trivializing the concept) or a substantive norm (making it vulnerable and in need of justification). I suggest this is a **false dichotomy**, or at least that the middle ground is where the most viable philosophy of chance resides.

  **The Reference-Fixing Model:**
  Most Lewisians do not treat PP as a linguistic definition of the word "chance" (analytic truth), nor purely as a synthetic normative law. Instead, they treat it as a **reference-fixing constraint**. The concept of chance is the concept of *whatever physical magnitude plays the chance-role*. The PP specifies that role.
  *   **Implication:** If a proposed theory of chance (e.g., a specific Humean Best System) violates the PP, it does not mean the PP is false; it means that theory fails to capture the concept of *chance*. It might capture "schmance," but not chance.
  *   **The Problem for You:** If you take this route, you lose the ability to say the PP is a "genuine norm" in the sense of being independent of the metaphysics. The normativity is built into the identity conditions of the quantity.
  *   **The Problem for Lewis:** This is exactly why Lewis moved from the Old PP to the New PP (NPP). He realized Humean chance *did* violate the Old PP (due to undermining). He had two choices: (1) Say Humean chance isn't real chance (reject Humeanism), or (2) Modify the principle to fit the metaphysics (NPP). He chose (2).

  **Comment:** If you insist on the fork, you force a choice Lewis explicitly avoided. To maintain the fork, you must argue that the "chance-role" is rigid and cannot be adjusted to fit the metaphysics (i.e., reject the NPP). If you allow the principle to be adjusted (as Lewis did), the "constitutive" horn blunts: it becomes a constraint on *candidate* theories, which is neither pure definition nor pure empirical norm.

  ### 2. Chance-Independence vs. Admissibility: Work or Relabeling?

  You propose restricting the principle to "chance-independent" propositions (truth does not bear on the chance distribution) to save it from undermining. You ask if this does work beyond the standard **admissibility** clause.

  **The Distinction:**
  *   **Admissibility (Standard):** Usually defined epistemically. Information $E$ is admissible if it contains no information about the truth of $A$ *other than* what is conveyed by the chance of $A$.
  *   **Chance-Independence (Your Proposal):** Defined metaphysically. Proposition $A$ is chance-independent if the truth of $A$ does not influence/make true the chance distribution itself.

  **The Critique:**
  1.  **Relabeling Risk:** In the context of undermining futures, an undermining future $F$ is inadmissible precisely *because* its truth bears on the chance distribution (it changes the Best System). Therefore, your "chance-independence" restriction picks out the exact same set of propositions as the "admissibility" clause in the context of undermining. If so, you haven't solved the problem; you've just renamed the exclusion clause.
  2.  **The Emptiness Trap:** You note that in Humean worlds, almost nothing is chance-independent. This is the critical weakness. The standard admissibility clause is designed to be *permissive*: it allows us to use historical data and laws, excluding only "crystal ball" info about the specific outcome. Your restriction is *restrictive*: it excludes any proposition that metaphysically fixes the chances.
      *   If the Humean base (the mosaic) fixes the chances, and any fact about the mosaic bears on the chances, then **no fact about the world is chance-independent.**
      *   **Result:** The principle becomes $C(A | \top) = Ch(A)$. This is not just "nearly empty"; it is useless for agents embedded in the world who condition on evidence.

  **Comment:** To avoid the relabeling charge, you must argue that *epistemic* admissibility is too weak and allows illicit information, whereas *metaphysical* independence is the correct filter. But if you do that, you must accept that the principle cannot guide agents who know they are in a Humean world, because they know their evidence is never chance-independent.

  ### 3. The Near-Emptiness Result: Damaging or Acceptable for a Lewisian?

  You ask if a Lewisian can accept the restricted scope (PP is true but nearly empty) and keep everything they care about.

  **The Lewisian Priority:**
  Lewis's primary goal was to vindicate the *utility* of chance within a Humean metaphysics. He wanted to show that Humean chances could guide credence.
  *   **The Cost of Emptiness:** If the PP is true but applicable to almost no propositions (because almost all propositions bear on the chance distribution in a Humean world), then chance **cannot guide credence**. It becomes a theoretically posited magnitude that agents are never rationally permitted to align their beliefs with (once they condition on any evidence).
  *   **Lewis's Actual Move:** Lewis accepted that the Old PP was *false* for Humean chance. He did not save it by restricting its scope to emptiness; he saved the *function* of chance by modifying the principle (NPP). The NPP says: $C(A | T \& H) = Ch(A)$, where $T$ is the theory of chance and $H$ is history. This handles undermining by conditioning on the chance function itself.

  **Comment:** A Lewisian cannot accept your "near-empty" result without abandoning the core motivation for positing chance in the first place. If chance doesn't guide credence in practice, the Humean has no reason to identify the Best System frequencies with "chance." They might as well be "quasi-chances." The "near-empty" victory is a Pyrrhic one: you save the letter of the Old PP but kill the spirit of the chance-credence connection.

  ### 4. The Cost of Committing to Normativity

  You state you are least willing to give up the thought that the PP is a **genuine norm** rather than a definition. Here is what that commitment costs you:

  **A. The Explanatory Gap (The "Why?" Question)**
  If PP is not definitional (analytic), it is a synthetic claim linking physical facts to epistemic norms. You now owe an explanation of *why* physical chances norm belief.
  *   **Pragmatic Defenses:** (e.g., David Williams, James Joyce) argue that violating PP makes you vulnerable to Dutch Books or reduces accuracy. *Cost:* These arguments often presuppose that chance is the kind of thing that *should* be used in betting/accuracy calculations, which smuggles in the normativity you are trying to prove.
  *   **Modal Defenses:** (e.g., Carl Hoefer) argue for "Chance Neutrality." *Cost:* Requires a robust account of how chances supervene on non-chance facts without making the normativity mysterious.

  **B. Vulnerability to Eliminativism**
  If PP is a substantive norm, it can be false. If our best metaphysics (e.g., Humeanism) generates a quantity that systematically violates this norm (even with your restrictions), the argument flips:
  *   **Your View:** The metaphysics is wrong because it violates the norm.
  *   **Opponent's View:** The norm is wrong because it doesn't fit the metaphysics.
  *   **Cost:** You must argue that our epistemic practice is more secure than our metaphysical theories. This is a bold meta-philosophical stance. It commits you to the idea that if physics says there are no quantities that satisfy the PP, then physics has failed to find chance, not that PP is mistaken.

  **C. The Circularity of "Admissibility"**
  To maintain PP as a norm, you need to define "admissible evidence" without referencing chance (otherwise the norm is circular: "Match chance, unless you have info about chance").
  *   **Cost:** Defining admissibility independently of chance is notoriously difficult (Lewis struggled with this). If you cannot define admissibility without referencing the very chance function the principle is supposed to license, the normativity is circular. Your "chance-independence" clause attempts this, but as noted above, risks emptiness.

  ### Strategic Recommendation

  Your draft identifies a genuine tension, but your proposed solution (restriction to chance-independence) threatens to make the principle vacuous, which undermines the "normative" role you wish to preserve.

  1.  **Reconsider the Fork:** Consider framing the PP not as a definition *or* a norm, but as a **platitudinous constraint** that any candidate for chance must satisfy to a sufficient degree. This allows you to say a Humean theory that violates it significantly is defective, without claiming the violation is logically impossible.
  2.  **Address the NPP:** You cannot write a chapter on this without engaging Lewis's New PP. Your argument essentially resurrects the problem the NPP was designed to solve. You need to argue why the NPP is insufficient (e.g., it makes chance credence conditional on knowing the theory of chance, which we never do).
  3.  **Refine "Independence":** If you stick with chance-independence, distinguish it sharply from admissibility. Argue that *epistemic* admissibility is too permissive (allowing undermining info) and *metaphysical* independence is the only way to save the norm. But then, you must bite the bullet: **Chance does not guide credence for embedded agents in Humean worlds.** If you are willing to accept that conclusion, your argument is consistent. If you want chance to guide credence, the "near-empty" result is fatal.

  **Summary:** The strongest line for you is to argue that the *normativity* is the non-negotiable feature of chance. If Humean chance cannot satisfy the norm without becoming empty, then Humean chance is not chance. This is an anti-Humean conclusion. If you intend to be friendly to Humeanism, your current sketch is self-undermining.
