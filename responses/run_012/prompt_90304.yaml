answer: |-
  The lock on the cell door was not made of iron, but of brass gears and glass tumblers, set into the stone like a strange eye. It did not require a key; it required a pattern. Three amber lights had to burn simultaneously behind the glass to release the bolt.

  Silas sat with his back against the cold wall, watching Jory work the mechanism. The boy's fingers were black with grease, trembling slightly as he manipulated the three levers below the glass face. They had been here for six hours. The guard's footsteps in the corridor outside were slowing, meaning the shift change was coming. If the lights didn't turn amber by then, they would miss the window of distraction.

  "Again," Jory whispered. He pulled the left lever. A click. The single white light labeled *X* vanished. In its place, two lights flickered on: one amber (*Y*), one blue (*Z*).

  "Rule One," Silas said quietly. "Trade the white for an amber and a blue."

  "I know," Jory snapped. He slid the middle lever. The amber and blue lights swapped positions. "Rule Two. Swap them. It doesn't help. I need three ambers. I only have one."

  "Make more," Silas said.

  "I can't. To make another amber, I need another white light. Rule One is the only way to make amber, and it eats white."

  "Then make a white."

  Jory's hands hovered over the right lever. "Rule Three. Two blues make a white. But I only have one blue." He slammed his hand against the stone. "I need another blue to make the white to make the amber. But the only way to get a blue is to spend a white."

  "Try anyway," Silas said.

  Jory worked the levers. He swapped the positions of the lights, trying to align the blue tumbler with the intake slot for Rule Three. It didn't matter. The count was what mattered. There was only one blue photon in the system. There was no second blue to combine. The machine hummed, waiting for an input it could not receive.

  "It's a trap," Jory said, his voice cracking. "It lets you start, but it starves you. I spend the white to get the amber, and now I'm stuck with one amber and one blue, and no way to get back to white."

  "Check the delete," Silas said.

  "Rule Four?" Jory laughed bitterly. "Delete three ambers? I can't delete what I don't have. I can't even get two."

  Silas closed his eyes. He listened to the hum of the gears. Inside the machine, the rules were absolute. You could swap. You could split. You could combine. But the rules did not tell you what was impossible; they only told you what was allowed. To know what was impossible, you had to stop looking at the levers and look at the supply.

  "Stand up, Jory."

  "The guard—"

  "Stand up." Silas rose, his joints popping. He walked to the door, not looking at the glass face, but at the hinges where the metal met the stone. "You're trying to win the game."

  "We have to open the door."

  "The door opens if the game is won," Silas said. "But the game cannot be won."

  "You don't know that. I haven't tried every permutation."

  "You've tried the only permutation that matters," Silas said. "You started with one white. Rule One spends one white to make one amber. Rule Three spends two blues to make one white. But Rule One only makes one blue. So you can never get the two blues you need to rebuild the white."

  Jory stared at the levers. "So... I can never get a second white."

  "No."

  "So I can never run Rule One a second time."

  "No."

  "So I can never have more than one amber light."

