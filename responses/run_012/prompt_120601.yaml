      *   **Constraint:** Legal bans on specific classes (race, religion, disability, sex, genetics) despite predictive power.
      *   **Core Philosophical Problem:** The Reference Class Problem (Hume/Reichenbach/Venn). An individual belongs to infinite classes with different frequencies. Which one determines the probability/risk?
      *   **The Tension:** Actuarial fairness (accuracy) vs. Social fairness (non-discrimination) vs. Insurance viability (pooling).

  3.  **Brainstorm Candidate Readings (Mental Sandbox):**
      *   *Reading A: Pure Prediction.* Use whatever predicts best. (Rejected by law).
      *   *Reading B: Individual Propensity.* There is a "true" risk for the individual; groups are just proxies. (Metaphysically dubious, but practically assumed).
      *   *Reading C: Causal/Explanatory.* Only use factors that *cause* the risk (e.g., smoking causes cancer, race does not cause credit risk).
      *   *Reading D: Moral Responsibility/Control.* Only use factors the individual controls (smoking yes, genetics no).
      *   *Reading E: Political/Convention.* It's a social contract. We agree on these rules for stability, not truth.
      *   *Reading F: Administrative Feasibility.* We use what is cheap/easy to verify. (Doesn't explain bans on accessible data like genetics).

  4.  **Evaluate Readings against the Practice:**
      *   *Pure Prediction:* Undermines the practice because the practice explicitly ignores predictive factors (race, genetics).
      *   *Individual Propensity:* Licenses the practice as an approximation, but struggles to explain *which* proxies are allowed. Why is postcode okay but race not, if both approximate individual risk?
      *   *Causal:* Licenses the ban on race (usually non-causal), but might allow genetics (causal of disease). The practice bans genetics. So Causal alone is insufficient.
      *   *Moral/Control:* Licenses the ban on genetics and race. Licenses smoking/credit (behavioral). This fits well. But does it explain postcode? (Often not under control).
      *   *Political/Convention:* Licenses everything as a negotiated settlement. Fits the legal variability (some places ban sex, some don't).

  5.  **Select the Favored Reading:**
      *   The practice is best understood as a **hybrid of Moralized Responsibility and Political Convention**, resting on a **pragmatic acceptance of the Reference Class Problem** rather than a solution to it.
