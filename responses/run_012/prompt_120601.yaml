answer: |-
  ### Brainstorming Candidate Readings

  Before analyzing the practice, we must enumerate the possible philosophical stances regarding the selection of reference classes in this context:

  1.  **The Metaphysical Individualist Reading:** Each applicant possesses a unique, objective propensity or "true risk." Group statistics are merely epistemic tools to approximate this unknowable individual fact.
  2.  **The Causal/Explanatory Reading:** A reference class is valid only if the grouping factor is causally responsible for the outcome (e.g., smoking causes lung cancer; race does not cause credit default).
  3.  **The Moralized/Responsibility Reading:** A reference class is valid only if the applicant has control over the classification or if the classification tracks desert rather than brute luck (e.g., choices vs. circumstances).
  4.  **The Political/Convention Reading:** The choice of reference class is not a matter of fact or morality but a social settlement. Classes are selected based on stability, administrative feasibility, and legislative compromise.
  5.  **The Straightforward Predictive Reading:** The only criterion is statistical accuracy. The "correct" class is the one that minimizes error in forecasting the claim event, regardless of the nature of the variable.

  ---

  ### Structured Analysis of the Practice

  The insurance and lending practice described presupposes a **Normative-Pragmatic Hybrid** conception of the reference class problem. It implicitly rejects the idea that statistics alone can solve the reference class problem and instead imports extra-statistical values to resolve the ambiguity. Below, I separate the reading I favor from those I reject, analyze the internal tensions, and describe the implications of shifting conceptions.

  #### I. Rejected Readings

  **1. The Straightforward Predictive Reading**
  This reading is directly undermined by the practice. If the practice were committed to pure prediction, it would be incoherent to forbid the use of race, genetics, or sex where these are acknowledged as highly predictive. The legal prohibitions demonstrate that predictive accuracy is a *constrained* maximand, not the sole criterion. Adopting this reading would render the current legal framework irrational, as it deliberately discards information that reduces uncertainty.

  **2. The Metaphysical Individualist Reading**
  This reading posits that the individual is the "true" reference class and group rates are mere approximations. While this comforts the intuition that pricing should be personal, it fails to explain the *selection* of proxies. If the goal is simply to approximate the individual's true risk as closely as possible, then race and genetics (being highly predictive) should be mandatory inclusions, not exclusions. Furthermore, this reading cannot explain the prohibition on fine-grained classification. If the individual risk is the truth, more data is always better. The practice, however, actively resists perfect classification to maintain pooling. Thus, the practice does not treat group rates as imperfect shadows of an individual truth, but as the constitutive basis of the contract.

  **3. The Purely Causal Reading**
  A strictly causal criterion admits factors that explain the risk mechanism. This licenses the ban on race (which is generally causally inert regarding credit or accident risk). However, it fails to license the ban on genetic test results. Genetic markers are often directly causal regarding health outcomes. If the criterion were purely explanatory, genetic testing would be required for accuracy. Since the practice often forbids it, the criterion must be narrower than causality; it must distinguish between *causes* that are agential and *causes* that are constitutional.

  #### II. Favored Reading: The Moralized-Pragmatic Hybrid

  The practice is best understood as operating under a **Moralized-Pragmatic Hybrid**. This conception resolves the reference class problem not by finding the "true" frequency, but by filtering admissible frequencies through normative constraints.

  **Why this licenses the practice:**
  *   **Moralized Criterion (Control and Luck):** This explains the ban on genetics, race, and disability. These are paradigmatic cases of "brute luck"—factors for which the applicant bears no responsibility. Conversely, smoking, credit history, and occupation are treated as proxies for agency or choice. This distinguishes between *risk* (uncertainty about the world) and *responsibility* (uncertainty about the agent's conduct).
  *   **Pragmatic Criterion (Pooling and Stability):** This explains why we do not classify down to the individual. Insurance requires the transfer of risk from the high-probability to the low-probability. If the reference class becomes too narrow (approaching the individual), the mechanism of insurance collapses into prepayment. The practice accepts a "thick" reference class (e.g., "30-year-old non-smokers") rather than a "thin" one (e.g., "30-year-old non-smokers with Gene X") to preserve the social function of risk pooling.

  **Why this is favored over the Political Reading alone:**
  While the Political Reading correctly identifies that laws vary by jurisdiction (e.g., sex is banned in some places, not others), it is too thin to explain the *content* of the regulations. There is a cross-jurisdictional convergence on banning race and genetics while allowing behavior-based factors. This suggests an underlying moral logic (avoiding discrimination based on immutable characteristics) rather than mere arbitrary convention.

  #### III. Underdetermination and Internal Tensions

  The practice leaves several philosophical questions open, indicating that the conception of the reference class is not fully settled.

  **1. The Proxy Problem (Underdetermination)**
  The practice leaves open how to handle variables that are permitted but correlate with forbidden ones. For example, postcode is permitted, yet it often correlates strongly with race and socioeconomic status. If the moralized criterion forbids punishing brute luck, and postcode tracks brute luck, the practice is inconsistent. The current framework treats *direct* use of forbidden classes as illicit but tolerates *indirect* discrimination via permitted classes. This suggests the practice is more concerned with the *visibility* of the classification than the underlying moral logic.

  **2. The Stopping Point for Classification**
  The practice presupposes a principled stopping point for classification but cannot supply one without appealing to statistics or economics.
  *   **The Tension:** The actuarial ideal is homogeneity within the class (to ensure fairness between members of the class). The insurance ideal is heterogeneity within the class (to ensure risk transfer).
  *   **The Lack of Principle:** There is no statistical fact that dictates where to stop splitting classes. One could always split "smokers" into "heavy smokers" and "light smokers." The decision to stop is economic (is the cost of verification worth the gain in accuracy?) and social (do we want to incentivize this level of scrutiny?). The practice assumes a "reasonable" classification but defines reasonableness circularly by reference to current industry standards.

  **3. The Status of the Individual**
  The practice leaves open whether the individual is a reference class of one. In pricing, the individual is treated as a member of a group. In underwriting (accept/reject), the individual is sometimes treated uniquely. This duality implies that the "individual risk" is not a fixed metaphysical quantity but a status granted or withheld by the insurer.

  #### IV. Counterfactual: Shifting to a Straightforwardly Predictive Conception

  If the implicit Moralized-Pragmatic conception were replaced by a **Straightforwardly Predictive** one, the practice would undergo radical transformation:

  1.  **Dissolution of Bans:** Prohibitions on race, genetics, and sex would be lifted. Any variable improving the loss ratio would be mandatory.
  2.  **End of Pooling:** As classification becomes maximally granular to maximize prediction, risk pools shrink. High-risk individuals (identified by genetics or demographics) would face prohibitive premiums or be denied coverage entirely. Insurance would cease to function as a mechanism for socializing risk and would become a mechanism for pre-funding individual certainties.
  3.  **Epistemic Transparency:** The justification for prices would shift from "fairness based on responsibility" to "accuracy based on correlation." An applicant could not argue, "I didn't choose my genes," but only, "Your data is insufficient."
  4.  **Market Fragmentation:** The market would likely segment into "high-risk" and "low-risk" silos with no cross-subsidization. This would likely require a state-backed insurer of last resort to cover those rendered uninsurable by perfect prediction, effectively bifurcating the system into private prediction and public welfare.

  ### Conclusion

  The described practice does not solve the reference class problem; it **manages** it. It acknowledges that while an applicant belongs to infinite classes, not all classes are morally or socially admissible for pricing. It rejects the metaphysical view that there is a single "true" risk frequency waiting to be discovered. Instead, it constructs risk through a filter that prioritizes **moral responsibility** (control over risk factors) and **social viability** (maintenance of risk pools) over **epistemic precision**. The tension remains unresolved because the practice attempts to serve two masters: the mathematical requirement for homogeneity (to price accurately) and the social requirement for heterogeneity (to insure collectively). The current legal and actuarial framework is a negotiated truce between these competing demands, not a derivation from probabilistic first principles.
