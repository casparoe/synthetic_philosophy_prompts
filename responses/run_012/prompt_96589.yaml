          *   The Mule: Falsifier of the cycle or individual prediction? Does this rescue the theory?
          *   Khaldun reading: Is the Foundation (frontier) vs. Empire (decadent centre) a real Khaldunian match or just pattern-matching?
          *   Pushback: Where do the books resist these lenses?
          *   Specific hunch: Does the *knowledge* of the cycle (Seldon/Second Foundation) change the nature of the cycle compared to Polybius/Khaldun?
      *   **Constraints:** British English, no reading lists/citations, just the argument.

  2.  **Deconstruct the Core Tension:**
