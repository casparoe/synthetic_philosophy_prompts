prompt: |-
  I'm running a session for our sci-fi-and-philosophy reading group on Asimov's Foundation — the original trilogy, not the later add-ons and not the telly version. I want to read it through the whole cyclical-vs-linear debate about history, so I'm bringing in Polybius's anacyclosis (constitutions going round and round, monarchy rotting into tyranny, aristocracy into oligarchy), Ibn Khaldun's asabiyya and his story of dynasties wearing out over a few generations as the hard frontier folk go soft in the cities, Spengler's cultures ripening into a civilised, set, finished state, and Toynbee's challenge and response with his creative minority hardening into a dominant one. I'm not asking what Asimov had actually read — that's a dead end and I dont care — I want to know what the books imply.

  So: does psychohistory need history to be cyclical at all, or only statistically lumpy? Seldon's aim is to shorten a dark age, which sounds like compressing the cycle or even escaping it — can a theory that treats the cycle as law-like even licence that? And the Mule: is he a falsifier of the cycle, or only of individual-level prediction, and does that distinction rescue the theory or quietly turn it into something else? Also, the Foundation is a fanatical frontier world swallowing a decadent centre, which is Khaldun's plot beat for beat — tell me honestly wether that's a real reading or just me pattern-matching.

  Then tell me where the books push back against the lens, and where they might show something the theorists missed. My hunch is that a cycle knowable only to a hidden elite (Seldon's plan, the Second Foundation) isn't the same animal as Polybius's or Khaldun's cycle, because knowing the cycle changes what the rulers can do with it — is that right, or am I overreading?

  British English please, and skip the reading lists and citations, I just want the argument.
