      *   Is it Khaldunian? Yes, strongly. The vitality comes from the periphery (Terminus, later Kalgan). The centre (Trantor) is sacked by outsiders (Gilmer).
      *   *Honest assessment:* It's not just pattern-matching. Asimov was steeped in Gibbon, who shares DNA with Khaldun on decline. The sociological dynamic is identical: hard edges crush soft centres.

  7.  **Address Question 5: Pushback and The "Knowing" Hunch:**
      *   *Pushback:* Asimov's universe is strangely static technologically (no real innovation for 1000 years). Spengler would say this is "Civilisation" phase (rigid). But the Foundation restores science.
      *   *The Hunch:* Polybius and Khaldun describe unconscious processes. Actors don't know they are in a cycle. Seldon *knows*.
      *   *Reflexivity:* If you know the cycle, you can game it. This breaks the "natural law" aspect.
      *   *Second Foundation:* They are the "Philosopher Kings" of the cycle. This makes it not a cycle of history, but a cycle of *control*.
      *   *Verdict:* The user is right. It changes the animal. It becomes a form of benevolent determinism imposed by an elite, rather than an organic rhythm of society. It risks becoming the very tyranny Polybius warns against (the rotting of the guardian class).

  8.  **Synthesize and Structure (British English):**
