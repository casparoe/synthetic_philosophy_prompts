      *   *Cyclical Theories:* Polybius (constitution rotation), Khaldun (tribal vitality vs. urban decay), Spengler (organic life-cycle of cultures), Toynbee (challenge/response).
      *   *Linear/Progressive:* Seldon wants to *shorten* the dark age. This implies progress or at least mitigation, not just eternal return.

  3.  **Address Question 1: Cyclical vs. Statistical Lumpiness:**
      *   Psychohistory doesn't strictly need *cycles* in the Polybian sense (monarchy -> tyranny -> etc.). It needs *sociological inertia*. Large masses move slowly and predictably.
      *   However, the backdrop is the fall of Rome (Gibbon). Gibbon is often read as cyclical (rise/fall).
      *   Seldon's plan assumes the Empire *will* fall. That's a cycle element (rise/fall). But the *recovery* is the variable.
      *   So, Psychohistory treats history as statistically deterministic on a macro scale (like gas molecules), which *looks* cyclical because human nature doesn't change, but it allows for intervention (linear compression).
      *   *Verdict:* It's not strictly cyclical; it's probabilistic determinism. The "cycle" is the decay phase; the "linear" part is the Seldon Plan's intervention.

  4.  **Address Question 2: Seldon's Aim (Compressing/Escaping the Cycle):**
      *   If history is law-like (Psychohistory), can you change it?
      *   Seldon doesn't stop the fall (the cycle proceeds). He mitigates the aftermath.
      *   This aligns with Toynbee's "Challenge and Response." The Empire fails the response; the Foundation is engineered to provide the correct response to the subsequent crises (Seldon Crises).
      *   It also aligns with Spengler's morphing, but Spengler is pessimistic (civilisation dies). Asimov is Enlightenment-optomistic (science can save us).
      *   *Tension:* If the laws are immutable, how can Seldon change the outcome? He uses the laws *against* themselves. Like building a levee against a flood. The flood (cycle) happens, but the damage (dark age) is reduced.

  5.  **Address Question 3: The Mule:**
