      *   Does this rescue the theory? The Second Foundation exists to correct deviations. This shifts the theory from "historical law" to "gardening."
      *   If you need hidden guardians to tweak the variables to keep the plan on track, is it still a law of history? Or is it technocratic management?
      *   *Implication:* It turns Psychohistory from a pure science (like physics) into a cybernetic control system. The cycle isn't natural anymore; it's curated.

  6.  **Address Question 4: Khaldun and the Frontier/Centre:**
      *   Khaldun: *Asabiyya* (group solidarity) is strong in nomads/frontier, weak in urban civilisations. Dynasties last ~3-4 generations.
