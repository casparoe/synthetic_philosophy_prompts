answer: |-
  1. **The Causal Sufficiency Reading**
     *   **Precise Claim:** Artefacts are never sufficient causes of social outcomes; human intervention is always a necessary condition for the artefact's effect to manifest.
     *   **Analysis:** This is a claim about causal mechanics. It asserts that without a human actor (to shoot the gun, to sit on or be barred by the bench), the object is inert.
     *   **Verdict:** **Platitude.** It is trivially true that guns do not fire themselves. However, it is a strawman of the STS position. No serious claim of 'material politics' suggests objects act without *any* human involvement; the claim is about mediation, not solo agency.
     *   **Does it hit the bench claim?** **No.** The bench claim is not that the bench excludes people *without* human involvement, but that the bench *modulates* human behaviour in a politically significant way. For this slogan to be an objection, the bench claim would have to assert that benches exclude people autonomously, like ghosts.
     *   **Policy Usage:** Policy actors sometimes use this to suggest regulation is pointless because the object isn't the 'cause', but they usually pivot quickly to Moral Liability.

  2. **The Moral Liability Reading**
     *   **Precise Claim:** Moral responsibility and blame can only attach to human agents; artefacts are not appropriate subjects for moral judgement or liability.
     *   **Analysis:** This is a claim about blame allocation. It concedes that objects might be involved in causal chains but insists that 'politics' (in the sense of accountability) resides solely with the user or maker.
     *   **Verdict:** **Platitude (Legally/Morally).** We do not put benches on trial. However, it conflates *moral blame* with *political analysis*. The bench claim is about how power is distributed, not who to punish.
     *   **Does it hit the bench claim?** **No.** The bench claim is descriptive (this design distributes rest unevenly), not accusatory (the bench is evil). For this slogan to object, the bench claim would have to be arguing that we should prosecute the bench rather than the city council.
     *   **Policy Usage:** **High.** This is the primary shield against regulation. 'Don't blame the tool, blame the user' is the standard defence against design-based policy interventions.

  3. **The Political Intentionalist Reading**
     *   **Precise Claim:** Politics resides exclusively in human consciousness and intent; material arrangements are politically inert until animated by human purpose.
     *   **Analysis:** This is a claim about the locus of politics. It defines 'politics' as deliberative human action. It denies that structures can 'encode' judgements unless a human consciously put them there for that purpose.
     *   **Verdict:** **Contentious.** This is the core philosophical disagreement. It rejects the notion of 'politics by other means'. It ignores unconscious bias, structural inertia, and the way design scripts behaviour regardless of intent.
     *   **Does it hit the bench claim?** **Yes.** This directly contradicts the idea that a bench 'encodes a judgement'. For this slogan to be a real objection, the bench claim must rely on the idea that politics can exist without a conscious political actor at the moment of exclusion.
     *   **Policy Usage:** **Moderate.** Often assumed implicitly by those who demand proof of 'intent to harm' before acknowledging a design is discriminatory.

  4. **The Instrumentalist Reading**
     *   **Precise Claim:** Artefacts are neutral tools; their political valence is determined entirely by context and use, not by their design features or affordances.
     *   **Analysis:** This is a claim about design versus use. It asserts malleability: a bench *could* be used to sit, so any exclusion is a choice of the user or enforcer, not the object.
     *   **Verdict:** **Contentious.** It ignores affordances and constraints. While use is not determined, it is not unconstrained. Armrests make lying down physically difficult, not just socially forbidden.
     *   **Does it hit the bench claim?** **Only if...** the bench claim implies technological determinism (that the design *forces* exclusion). If the bench claim acknowledges that people *could* remove the arms but don't, the Instrumentalist reading fails to object.
     *   **Policy Usage:** **High.** Policy actors oscillate between this and Moral Liability. It allows them to acknowledge harm while locating the solution in 'education' or 'enforcement' rather than redesign.

  5. **The Explanatory Reductionist Reading**
     *   **Precise Claim:** Material politics are fully reducible to human social relations; analysing the object adds no explanatory power beyond analysing the humans behind it.
     *   **Analysis:** This is a claim about causal explanation. It argues that saying 'the bench excludes' is just shorthand for 'the council told the bench to exclude'. It denies mediation.
     *   **Verdict:** **Contentious.** It denies that the materiality itself does work. It misses that once built, the bench excludes without further human instruction (unlike a sign or a guard).
     *   **Does it hit the bench claim?** **Yes.** It offers a rival explanation. It argues you are analysing the wrong thing. For this slogan to object, the bench claim must assert that the object does something *over and above* the initial human decision to install it.
     *   **Policy Usage:** **Low.** Too abstract for most policy debates, but underpins the 'people exclude people' retort.

  | Reading | Precise Claim | Verdict | Does it hit the bench claim |
  | :--- | :--- | :--- | :--- |
  | **1. Causal Sufficiency** | Objects are not sufficient causes without human intervention. | Platitude | No (unless bench claim asserts autonomous action) |
  | **2. Moral Liability** | Blame belongs to moral agents only, not things. | Platitude | No (unless bench claim seeks to blame the object) |
  | **3. Political Intentionalism** | Politics exists only in human intent/consciousness. | Contentious | Yes (directly contradicts 'encoding') |
  | **4. Instrumentalism** | Design is neutral; use determines political effect. | Contentious | Only if bench claim implies determinism |
  | **5. Explanatory Reductionism** | Object analysis adds no power over human analysis. | Contentious | Yes (offers rival explanation) |

  Verdict: Political Intentionalism
