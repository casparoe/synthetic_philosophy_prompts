      *   *Conversion/Shift:* P1 makes shift look like belief revision (rational). P2 makes it look like gestalt switch or training (causal/rational blur).
      *   *Argument:* You can't prove a rule (P2). You can only show its utility. You *can* argue for a proposition (P1), but Wittgenstein says grounds run out.
