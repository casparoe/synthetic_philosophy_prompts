      *   **Ad Hoc Hypothesis:** Adjusting the "measure" to fit data. This fits the "tweaking knobs" feeling.
      *   **The Doomsday Argument / Self-Indication Assumption:** Related to observer selection effects.
      *   **Observer Selection Effects (Anthropic Principle):** Crucial here. We can only observe a universe compatible with observers.
      *   **Bayesian Confirmation Theory:** This is the rigorous framework. Does $P(T|E) > P(T)$?
      *   **The "Fine-Tuning" Argument:** Often used to motivate the multiverse.
