      *   **The Move:** A theory predicts a vast range of outcomes (multiverse). We observe one outcome. This is counted as evidence *for* the theory, even though the theory could accommodate almost anything. When predictions fail, adjustments are made (measure, size of collection) without discarding the theory.
      *   **The Confusion:** Is this one fallacy or two?
          *   Version 1: Theory says "anything could happen." Result happens. Claim: Support. (Seems like no information gained).
          *   Version 2: Theory says "these things could happen with these probabilities." Low probability result happens. Claim: Impressive confirmation. (Seems like moving the goalposts or range widening).
