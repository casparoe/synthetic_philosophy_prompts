answer: |-
  You are not imagining this, and you are certainly not thick. You have put your finger on one of the most contentious nerves in contemporary philosophy of physics. The frustration you feel is shared by a significant number of professional philosophers and physicists (Roger Penrose and Peter Woit, for instance, have built careers complaining about exactly this).

  The move you are identifying doesn't have a single, universally agreed-upon name because it sits at the intersection of logic, statistics, and metaphysics. However, we can carve it up using established concepts. Your intuition that there are "two versions" being slid between is spot on.

  Here is the carving you asked for, in British English.

  ### 1. The Core Logical Framework: Bayesian Confirmation
  To understand why this feels wrong, we need to look at how science is supposed to update belief. In Bayesian terms, a theory $T$ is confirmed by evidence $E$ only if the evidence is more likely given the theory than without it.
  $$P(T|E) > P(T) \text{ if } P(E|T) > P(E)$$

  In standard physics, $P(E|T)$ is high because the theory *narrows down* the possibilities. It says, "The mass will be 125 GeV." If it is 125 GeV, the theory gets a boost.
  In the multiverse/string theory move you describe, the theory says, "The mass could be anything between 0 and infinity, but here is a distribution."
  The friction arises because proponents often treat **Compatibility** ($P(E|T) > 0$) as if it were **Confirmation** ($P(E|T) \approx 1$).

  ### 2. Carving Version One: The Vacuous Explanation
  **The Move:** The theory posits an ensemble where every physically possible outcome exists somewhere. We observe outcome $X$. Therefore, the theory is supported.
  **The Problem:** If a theory predicts that *everything* happens, then observing *something* provides no information. It is logically equivalent to saying, "It will either rain or not rain."
  **The Name:** This is often called **Vacuous Truth** or **Non-Falsifiability** (in the Popperian sense).
  **Why it feels like a cheat:** It violates the principle of **Risk**. A theory earns credit by sticking its neck out. If the theory cannot be wrong, it cannot be right in any meaningful sense. In the philosophy of statistics, this is sometimes referred to as a **Saturated Model**: a model with so many parameters it fits any data perfectly, and therefore predicts nothing new.

  ### 3. Carving Version Two: The Tuned Postdiction
  **The Move:** The theory posits an ensemble with a specific probability distribution (a "measure"). It turns out our universe is unlikely, but not impossible. Proponents argue that because our universe is *within* the allowed range (perhaps within the top 10% of likelihood), this counts as success.
  **The Problem:** This is where the "knobs get twiddled." If the distribution (the measure) is adjusted *after* seeing the data to make our universe look "typical," the confirmation is illusory.
  **The Name:** This is the **Texas Sharpshooter Fallacy**. The sharpshooter fires at a barn wall, then paints a target around the cluster of holes to claim he hit the bullseye. In cosmology, this is specifically called **The Measure Problem**.
  **Why it feels like a cheat:** It conflates **Postdiction** (explaining what we already know) with **Prediction** (forecasting what we don't). Postdiction is legitimate *only* if the parameters of the distribution were fixed independently of the data being explained. If the measure is chosen *because* it makes our universe likely, it is **Ad Hoc Reasoning**.

  ### 4. The Slide: Equivocation on "Prediction"
  You asked for a name for the slide between Version 1 and Version 2. This is a rhetorical sleight of hand known as **Equivocation**.
  *   **Sense A (Defensive):** When challenged on falsifiability, the proponent uses Version 1. "We don't predict a specific value; we predict a *range* of possibilities consistent with observers." (Shielding the theory).
  *   **Sense B (Offensive):** When claiming success, the proponent uses Version 2. "Our universe lies within the high-probability region of the anthropic landscape!" (Claiming credit).

  In philosophy, this is sometimes described as a **Motte and Bailey Doctrine**.
  *   **The Motte (The defensible position):** "The multiverse is compatible with our observations." (Hard to refute, but weak).
  *   **The Bailey (The desired position):** "The multiverse explains why our constants are what they are." (Strong claim, but easily refuted if the measure isn't independent).
  The arguer retreats to the Motte when attacked and occupies the Bailey when boasting.

  ### 5. Why your existing labels didn't fit
  *   **Falsifiability:** You felt this didn't fit because proponents *do* claim evidence counts. They argue that finding a universe *outside* the anthropic range would falsify the theory. The issue isn't that they refuse to let evidence count; it's that they define the "theory" as the whole ensemble, making it incredibly hard to actually falsify with a single data point (our universe).
  *   **Ad Hoc:** You sensed it wasn't quite this. "Ad hoc" implies adding a new clause to save a theory. Here, the "clause" (the multiverse) is the central feature, not an add-on. The issue is more about **Underdetermination**: the evidence we have (one universe) is insufficient to determine which theory (single universe vs. multiverse) is correct, because both can be made to fit the data.

  ### 6. Is Version Two ever legitimate?
  Yes. This is the crucial bit for your argument with your mate. Anthropics and multiverse reasoning *can* be legitimate science, but only under strict conditions.

  For Version 2 to count as confirmation, three things must be true:
  1.  **Independent Derivation:** The probability distribution (the measure) over the multiverse must be derived from the fundamental theory (e.g., string theory) *without* reference to the observed constants of our universe. If they tweak the measure to make the cosmological constant look typical, it's the Texas Sharpshooter. If the measure comes out of the maths and *then* happens to make our universe typical, that is genuine evidence.
  2.  **Non-Uniformity:** The theory must rule out large swathes of possibilities. If the theory says "All values are equally likely," observing our value tells us nothing. If it says "99% of universes have value X, and we see X," that is confirmation. (This is what Steven Weinberg did with the cosmological constant in 1987; he predicted the order of magnitude before it was measured. Many consider this the only genuine success of anthropic reasoning).
  3.  **No Better Alternative:** You must show that a single-universe theory cannot explain the data as well. If a simpler theory predicts the exact value without needing a googol of invisible universes, Occam's Razor favours the simpler theory.

  ### 7. Summary for your next argument
  When your mate says, "The theory allows for our universe, which is a point in its favour," you can ask:

  1.  **Is this Compatibility or Confirmation?** "Does the theory merely *allow* this value (Version 1), or does it make this value *probable* (Version 2)?"
  2.  **Where did the Measure come from?** "Was the probability distribution calculated before we measured the constant, or was it tuned to make our universe look typical afterwards?" (The Texas Sharpshooter check).
  3.  **What would falsify it?** "If we found a constant that was hostile to life but stable, would that kill the theory, or would you just adjust the measure?"

  **The Verdict:**
  The move itself is **Anthropic Reasoning**.
  When done poorly (Version 1), it is **Vacuous Explanation**.
  When done poorly (Version 2), it is the **Texas Sharpshooter Fallacy**.
  The slide between them is **Equivocation** (specifically, conflating consistency with confirmation).

  Your intuition is correct: accommodating any result is a vice, not a virtue, unless the theory can explain *why* we are in this specific corner of the accommodation without tuning the knobs after the fact. You aren't losing because you're wrong; you're losing because your mate is likely relying on the rhetorical slide between "possible" and "probable."
