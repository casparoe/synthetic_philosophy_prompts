      *   **The Move:** It's often called **Anthropic Reasoning** or **Retrodiction via Ensemble**.
      *   **The Fallacy (Version 1):** If the theory says "All outcomes are possible," observing one outcome provides *zero* Bayesian confirmation (likelihood ratio = 1). This is the **Problem of Old Evidence** or simply **Lack of Predictive Risk**.
      *   **The Fallacy (Version 2):** If the theory says "Outcome X is unlikely but possible," and X happens, claiming victory is suspect if the theory *also* allowed Y and Z with similar ease, or if the probability distribution was tuned *after* seeing X. This is the **Texas Sharpshooter Fallacy** applied to theory construction.
      *   **The Slide:** This is a rhetorical shift between **Existential Claim** ("X exists in the set") and **Probabilistic Claim** ("X is the expected outcome").
      *   **Legitimacy:** Version 2 *is* legitimate *if* the probability distribution is fixed *prior* to the observation and is non-uniform. (e.g., Boltzmann brains vs. ordinary observers).

