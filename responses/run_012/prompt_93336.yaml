prompt: |-
  I teach moral and political philosophy at a mid-sized state university, and for the past couple of years I've been having a running argument with my partner, who manages programs for an international development NGO. She's been posted to a country office where most of the local partner organizations she oversees are, frankly, family businesses: a board member's nephew holds the vehicle-maintenance contract, the logistics officer hired her own cousin, the district coordinator put his brother-in-law on the payroll as a 'community liaison' with no real duties. Her agency's auditors flagged three of these as procurement fraud and two people were fired. Nobody local denies any of it. Their line is: of course you take care of your people, that's what the money is for; and they point out that her own agency hired the regional director's old roommate into a senior post last spring without so much as a posting. There's also a rule in her staff handbook requiring her to declare any gift over about fifty dollars, which nobody has ever complied with, because the gifts that actually get given here are at weddings and funerals and are handed over in front of two hundred people.

  My colleague in anthropology, who has done fieldwork in the region, tells me I'm asking the wrong question. She says 'corruption' is a travellers' word — it names other people's obligations while leaving our own networks unexamined — and that the famous line between a gift and a bribe is drawn by trivia: who hands it over, whether the envelope changes hands before or after the favor, whether there's a receipt. She also says the ideal of the impartial, personally disinterested official isn't a moral truth but a fairly recent piece of state-building machinery, and that once you take that away there's no fact of the matter left about whether those two people should have been fired. I'm definately sympathetic to about 70% of this, and the other 30% is where I get stuck, because I can hear how the same move could be made about things I'm not willing to give up.

  So here's what I want from you. Tell me whether my partner was right to think the firings were defensible, and don't just tell me 'context matters.' I want the actual philosophical structure: what work the word 'corruption' is doing, whether there's a defensible non-parochial standard that would condemn the nephew's contract while letting the regional director's roommate slide (or whether they're really the same act, in which case she should be consistent about it either way), and what survives of the anthropologist's argument once you notice how much it proves. If the honest answer is that there's no neutral ground here, say that too, and tell me what it implies for how she should actually do her job — she still has to sign off on the audit findings.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User:** Professor of moral and political philosophy at a mid-sized state university.
      *   **Context:** Running argument with partner (NGO program manager in a country office).
      *   **The Conflict:** Partner's NGO fired local staff for nepotism/procurement fraud (hiring relatives, no-bid contracts). Locals argue this is "taking care of your people." Partner's own agency hired a regional director's roommate without posting. Gift declaration rules are universally ignored due to cultural norms (public wedding/funeral gifts).
      *   **The Anthropologist's View:** "Corruption" is a traveler's word (othering). Gift vs. bribe is trivia. Impartial official is a state-building construct, not moral truth. No "fact of the matter" on firings once this is deconstructed.
      *   **User's Stance:** 70% sympathetic to anthropology, 30% stuck (fears slippery slope to moral relativism on things they *don't* want to give up).
      *   **The Ask:**
          1.  Was the partner right to think the firings were defensible? (Don't just say "context matters").
          2.  Provide the *philosophical structure*: What work does "corruption" do?
          3.  Is there a defensible non-parochial standard condemning the nephew but sparing the roommate? (Or are they the same act?)
          4.  What survives of the anthropologist's argument?
          5.  If no neutral ground, what are the implications for her job (signing off on audits)?

  2.  **Deconstruct the Philosophical Issues:**
      *   **Universalism vs. Particularism:** The core tension. Impartiality (Weberian bureaucracy) vs. Partiality (Care ethics, kinship obligations).
      *   **Definition of Corruption:** Is it *public office for private gain* (standard definition) or *violation of specific normative expectations*?
      *   **The "Traveler's Word" Critique:** Valid point about power dynamics, but does it dissolve the normative claim entirely?
      *   **The "Fact of the Matter":** The anthropologist claims there isn't one. The philosopher needs to find if there *can* be one, or if we must act without one.
      *   **Consistency:** The hypocrisy of the HQ (roommate hire) vs. Local (nephew hire).

  3.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the prompt. Validate the 70/30 split. Set the stage: This isn't just applied ethics; it's meta-ethics and political theory.

      *   **Part 1: What work does the word "Corruption" do?**
          *   It's not just descriptive; it's *constitutive*. It draws a boundary between the "public" and the "private."
          *   Reference: Weber (bureaucracy), Johnston (syndromes of corruption).
          *   The anthropologist is right that it's a technology of governance, but wrong that this makes it *merely* arbitrary. It serves a specific function: scalability and trust among strangers.
          *   *Key Distinction:* Corruption is the *betrayal of a specific trust relationship*. In the NGO context, the trust is between the donor (global public) and the beneficiary (local public).

      *   **Part 2: The Nepotism vs. Networking Distinction (Nephew vs. Roommate).**
          *   Are they the same act? Formally, yes (partiality). Functionally/Normatively, maybe not.
          *   *The "Publicity" Condition:* Kantian/Rawlsian angle. Can the maxim be publicized?
          *   *The "Systemic Effect" Argument:* One is embedded in a kinship system that *excludes* outsiders systematically (clan logic). The other is a weak tie in a professional network (meritocratic logic, ideally).
          *   *The "Agency" Argument:* The NGO is a specific *contractual* entity. By taking the salary, the local staff entered a specific normative framework (the handbook). The Regional Director's roommate hire might be hypocritical, but it doesn't necessarily violate the *local* contract in the same way if the hiring rules differ at HQ.
          *   *Verdict:* They are morally analogous *if* the rules are the same. If the rules differ, it's hypocrisy, not necessarily equivalent corruption. But the *defense* of the firings rests on the *mission*, not the abstract morality of kinship.

      *   **Part 3: What survives of the Anthropologist's Argument?**
          *   Keep the critique of *impartiality as a natural law*. It is a construct.
          *   Keep the insight on *gifts*. A public wedding gift is not a bribe because it lacks *quid pro quo* secrecy.
          *   Discard the conclusion that "no fact of the matter exists." The fact of the matter is *institutional fidelity*.
          *   The "Traveler's Word" critique is powerful but self-defeating if it prevents *any* judgment. We need a "thin" universalism (O'Neill? Walzer?).

      *   **Part 4: Was the Partner Right? (The Verdict).**
          *   Yes, but not because nepotism is inherently evil.
          *   Because the NGO is a *specific voluntary association* with specific aims.
          *   The "Fraud" isn't the kinship; it's the *deception* regarding the purpose of funds.
          *   If the contract says "competitive bidding," and you give it to a nephew without disclosure, you violated the *agreement*, not just a Western norm.
          *   The "Care for People" argument fails because the money isn't *theirs* to distribute; it's entrusted.

      *   **Part 5: Implications for the Job (No Neutral Ground).**
          *   If there is no "God's eye view," she is not a judge of universal justice; she is a *fiduciary*.
          *   She must enforce the rules of the specific institution she represents, while acknowledging the hypocrisy.
          *   Actionable advice: Enforce the audit (fiduciary duty), but advocate for HQ reform (addressing the roommate issue) to reduce hypocrisy. Distinguish between *secret* nepotism (fraud) and *public* reciprocity (culture).

  4.  **Refining the Tone:**
      *   Must match the user's level (Philosophy Professor). Use terms like "fiduciary," "normative framework," "Weberian," "thick/thin ethics," "particularism."
      *   Avoid platitudes. Be decisive.
      *   Acknowledge the tension without resolving it into a easy "both sides" compromise.

  5.  **Self-Correction/Review during drafting:**
      *   *Initial thought:* Maybe argue that nepotism is inefficient. *Correction:* No, that's utilitarian and debatable. Kinship networks can be efficient. Stick to the *contractual/trust* argument.
      *   *Initial thought:* Say the roommate hire is also corruption. *Correction:* It might be, but it's not her jurisdiction. Focus on the *local* contract.
      *   *Check:* Did I answer the "non-parochial standard" question? Need to ensure I propose one. The standard is *Fidelity to the Specific Trust*, not *Impartiality as such*.
      *   *Check:* Did I address the gift issue? Yes, distinguish secrecy/publicity.

  6.  **Final Polish:** Organize into clear philosophical headers. Ensure the conclusion gives practical guidance for the partner. (Proceed to generate output based on this structure.)

      *   *Key Philosophical References to weave in:* Michael Walzer (Spheres of Justice), Onora O'Neill (Trust), Max Weber (Bureaucracy), maybe a bit of Bernard Williams (Moral Luck/Truthfulness).
      *   *Core argument:* The anthropologist is right about the *genealogy* of the concept, but wrong about the *normative force*. The partner is right about the *firings*, but potentially wrong about the *moral superiority* of her own agency.

  7.  **Final Output Structure:**
      1.  The Genealogy of "Corruption" (Anthropologist is half-right).
      2.  The Normative Core: Fiduciary Duty vs. Kinship Obligation.
      3.  The Nephew vs. The Roommate (Consistency Test).
      4.  The Gift Problem (Secrecy vs. Publicity).
      5.  The Verdict & Practical Implications.

      *(Self-Correction during final review)*: Make sure to explicitly address the "30% stuck" part. The user is worried that if the anthropologist is right about corruption, they are right about *everything* (e.g., human rights). I need to show where the line holds. The line holds at *coercion* and *deception* vs. *voluntary association*.

