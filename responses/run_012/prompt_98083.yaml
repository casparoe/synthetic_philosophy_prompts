answer: |-
  Good evening.

  For the record, I am not a biologist. I am not a farmer. I am not even particularly good at keeping things alive. I am a software engineer. My job is to tell machines what to do, and then spend the rest of my time figuring out why they did something else.

  But for the past six years, my main claim to expertise is a glass box in my living room. It houses about forty cherry shrimp. They are tiny, translucent, and entirely devoted to the consumption of algae wafers. I have spent more evenings than I care to admit watching them contest a single wafer. It is a high-stakes drama, provided you don't blink.

  I mention this because when I was asked to speak here, I wondered what I could possibly say to a room of people who actually feed the world. You manage margins that are thinner than my shrimp's shells. You deal with biology that doesn't care about your spreadsheets. You operate in the real world, where things break, weather changes, and markets shift.

  So, why me? I think it's because I spend my life managing uncertainty. In software, we rarely know everything about the environment our code will run in. We don't know exactly how users will behave. We don't know when a server will spike. So we don't build systems that require perfect knowledge to function. We build systems that handle risk.

  And that is where I want to start tonight. Not with ethics, but with risk.

  There is a question that hangs over this industry, especially when people outside this room talk about it. It's the question of pain. Do prawns feel pain? Do crabs? Do lobsters?

  Usually, this question is asked like a light switch. Either the animal feels pain exactly like a human does, or it feels nothing at all. If it's a "yes," then the industry is in trouble. If it's a "no," then business continues as usual. It's a threshold view. Either the creature counts, or it doesn't.

  I think this is the wrong argument. And I think it's a trap for you.

  Because science doesn't deal in light switches. Science deals in dials. It deals in probabilities. When I look at the research—and I have read enough to be dangerous, but not enough to be an expert—I do not see a settled fact. I see a cloud of uncertainty. Some signals suggest these animals process harm differently than we do. Other signals suggest there is something there worth paying attention to.

  If we stick to the light switch, we wait for certainty. We wait for a definitive paper that says, "Yes, absolutely, it suffers." But in science, especially in biology, that certainty might never come. We might be waiting forever.

  So I want to propose a different way of looking at it. A way that doesn't require you to be a philosopher, and doesn't require you to admit to cruelty.

  Imagine you are managing a processing plant. There is a sensor on a valve that reads "possible leak." It doesn't say "definite leak." It says "possible." The cost of checking the valve is low. The cost of ignoring it, if there actually is a leak, is high. Flooded floor, ruined product, downtime.

  Do you wait for the sensor to scream "emergency" before you check the valve? Or do you treat the "possible" as a reason to act?

  In my trade, we call this risk mitigation. You don't wait for the server to catch fire to install the sprinkler. You install the sprinkler because there is a non-zero chance of fire.

  I am arguing that we should treat animal welfare the same way. Not as a moral verdict on your character, but as a risk management strategy for the industry. This is a graded view. It says that what we owe a creature scales with how probable it is that they experience something, and how intense that experience might be.

  If there is even a small chance that a crustacean experiences something like pain during killing, and the cost of preventing that is low, then uncertainty isn't a reason to wait. Uncertainty is a reason to act early.

  Now, I know what some of you are thinking. "Welfare" is a word that often feels like a stick used to beat you. It comes with regulations, costs, and judgments from people who have never worn rubber boots at four in the morning. I am not here to add to your burden. I am here to suggest that some of the cheapest changes are also the ones that future-proof your license to operate.

  There are three specific things I want to mention. They are unglamorous. They are technical. They are not about stopping production; they are about refining the end of it.

  First, the method of killing. Dropping a live animal into boiling water is the industry standard in many places. It is fast. It is traditional. But if there is a chance that the animal perceives that heat as severe harm, it is a high-risk practice. Stunning or chilling the animal before killing is relatively cheap. It calms the physiology. It reduces movement. And it removes the doubt. If you chill them, and they feel nothing, you've lost nothing but a few minutes of electricity. If you boil them alive, and they *do* feel something, the cost is much higher.

  Second, eyestalk ablation. In some prawn hatcheries, severing a broodstock female's eyestalk is routine to trigger spawning. It works. But it is an invasive procedure on a living animal. There are hormonal alternatives emerging. They might cost a bit more upfront. But moving away from routine physical mutilation when alternatives exist is a powerful signal. It says, "We are precise. We are modern. We don't do things just because we always have."

  Third, splitting crabs while they are alive. This is often done for freshness. But if there is a graded obligation here, splitting a conscious creature is where the probability of severe experience is highest. A simple stun beforehand changes the ethical calculus entirely, for almost no cost in throughput.

  I am not telling you that science has proven these animals suffer. I am telling you that science hasn't proven they *don't*. And in every other part of your business, you don't run risks like that. You insure against them. You build safeguards.

  Adopting these practices doesn't mean you admit guilt. It means you admit uncertainty. It means you are willing to pay a small premium on kindness because the downside of being wrong is too great.

  This approach protects you, too. It stops the debate from being about whether you are a "good person" or a "bad person." It makes the debate about whether you are a "careful professional" or a "reckless one." I know which one you want to be.

  I know margins are tight. I know energy costs are up. I know that adding a chilling step or changing a hatchery protocol is not something you do lightly. But I also know that this industry survives by adapting. You adapt to water quality, to feed prices, to export regulations. Adapting to uncertainty about sentience is just another variable in the equation.

  And honestly? It might make the job easier. There is a quiet satisfaction in knowing that the end of the process is as clean as the start. There is a pride in handling stock with care, even at the very last moment. You are farmers. You care for living things. That doesn't stop being true just because the things are small and have shells.

  So, here is where I want to leave you. I want to give you a sentence you can use. Maybe you'll hear this question at a barbecue, or from a journalist, or from a relative at Christmas. They will ask, "Do you know if they feel pain? Why do you do it that way?"

  You don't need to quote a study. You don't need to defend the neuroscience. You can just say this:

  **"We don't know for sure, and that uncertainty is exactly why we choose to act."**

  That is it. It is honest. It is humble. And it shuts down the argument that you are ignoring the science. You are respecting the limits of the science.

  I have watched my forty shrimp for six years. I still don't know exactly what is going on in their tiny heads. But I do know that when I drop the wafer, I want them to have a fair chance at it. I want their environment to be as good as I can make it, within the limits of my tank.

  You have a much bigger tank. You have a much harder job. But the principle is the same. When the signals are unclear, and the cost of care is low, the professional choice is to care.

  Thank you for listening, and thank you for the work you do.

  I'd like to propose a toast.

  To our outgoing chair, for steering the ship through rough waters with steady hands.
  May your next chapter be as productive and resilient as the industry you've served.

  Cheers.
