      *   **Neuroscience/Cognitive Science:** The actual mechanism of skill (procedural vs. declarative memory).
      *   **The "Practical Mode" Black Box:** Neither digs into *what* a practical mode of presentation actually is metaphysically.
      *   **Hybrid Views:** Maybe it's both? (e.g., Know-how requires knowledge-that + ability).

  6.  **Opposite Verdict Consideration:**
      *   If one prioritizes *explanatory power* over *counterexample immunity*, Owen wins. If the "practical mode" is just a magic wand, Nadia's theory is empty.

  7.  **My Reasoning Failure:**
