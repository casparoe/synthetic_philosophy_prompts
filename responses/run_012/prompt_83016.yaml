      *   **Owen (Anti-Intellectualism/Ryleanism):** Know-how = Ability/Disposition. Not a propositional attitude. "Practical mode of presentation" is empty labeling. This aligns with Ryle (1949) or post-Rylean ability views (e.g., Hawley, Bengson & Moffett critiques).

  3.  **Analyze Move-by-Move:**

      *   **(1) Owen's Chick Sexer:**
          *   *Argument:* Case of reliable ability without articulable knowledge. Refutes Intellectualism.
          *   *Assessment:* Classic example (Polanyi/Ryle). Strong intuition pump. However, Intellectualists (Stanley/Williamson) have a specific counter ready (modes of presentation).
          *   *Verdict:* Defensible but overstated. It challenges *crude* intellectualism, but Nadia has already built a defense against the articulacy requirement.

      *   **(2) Nadia's Reply (Modes of Presentation):**
          *   *Argument:* Articulacy isn't required. Knowledge exists under a practical mode.
          *   *Assessment:* This is the core Stanley & Williamson move. It technically saves the theory from the sexer counterexample.
          *   *Verdict:* Defensible. It's the standard intellectualist response. Whether it's *satisfying* is another matter, but logically it holds within her framework.

      *   **(3) Owen's "Redescription" Charge:**
          *   *Argument:* If no case can tell against it (because of the mode of presentation loophole), it's not a theory, just a redescription.
          *   *Assessment:* A strong methodological critique. If the "practical mode" is unfalsifiable, the theory lacks bite.
          *   *Verdict:* Defensible but overstated. It's not that *no* case could tell against it (Nadia mentions predictions in move 4), but the "practical mode" does risk becoming a theoretical black box.

      *   **(4) Nadia's Coach Case & Predictions:**
          *   *Argument:* Know-how tracks know-that, not ability. Injured coach knows *how* but can't *do*. Also, know-how is subject to justification/defeat.
          *   *Assessment:* The "injured coach" or "paralyzed expert" is the standard Intellectualist counter to Ability views. The justification point is also strong (abilities aren't true/false, knowledge is).
          *   *Verdict:* Clearly right (within the dialectic). This is the strongest point for Intellectualism. It severs the necessary link between success/ability and knowledge.

      *   **(5) Owen's Ambiguity Charge:**
          *   *Argument:* "Knows how" is ambiguous. Coach knows *that* (propositional) but not *how* (ability).
          *   *Assessment:* This is the Rylean move to protect the ability view. It claims Nadia is shifting meanings.
          *   *Verdict:* Defensible. It preserves the ability view by stipulating that the relevant sense of "know-how" in skill contexts is the ability sense. However, it risks begging the question against Nadia's unified account.

      *   **(6) Nadia's Regress Reply:**
          *   *Argument:* Regress (Ryle's regress) only happens if knowledge is a rule consulted. Knowledge is a state.
          *   *Assessment:* This addresses Ryle's famous regress argument against Intellectualism. Stanley & Williamson argue that possessing propositional knowledge doesn't require *contemplating* it before acting.
          *   *Verdict:* Defensible. It neutralizes the classic Rylean objection.

      *   **(7) Owen's "State vs. Performance" Reply:**
          *   *Argument:* A state doesn't explain intelligent exercise. Know-how comes in degrees/performance; know-that (traditionally) doesn't.
          *   *Assessment:* Hits the explanatory gap. Why does the state lead to *successful* action? Also, the "degrees" point challenges the binary nature of traditional knowledge.
          *   *Verdict:* Defensible but overstated. Contemporary epistemology allows for degrees of confidence/warrant, but the link between static state and dynamic success remains a tension for Intellectualism.

  4.  **Overall Adjudication:**
      *   Nadia seems to have the stronger *logical* defense against counterexamples (Sexer, Coach). Her view accommodates the data by expanding "propositional."
