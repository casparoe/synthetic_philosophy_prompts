answer: |-
  Here is an adjudication of the exchange between Nadia and Owen, analyzing the philosophical moves within the contemporary debate on intellectualism (know-how as know-that) versus anti-intellectualism (know-how as ability).

  ### Move-by-Move Adjudication

  **(1) Owen's Chick Sexer**
  *Verdict: Defensible but overstated.*
  Owen deploys a classic intuition pump (often associated with Polanyi or Ryle). It effectively targets *crude* intellectualism that equates know-how with articulable theoretical knowledge. However, it is overstated as a refutation of Nadia's specific view because she has already stipulated that articulacy is not required. The case shows a divergence between *ability* and *discursive knowledge*, but not necessarily between *ability* and *propositional attitudes* grasped practically.

  **(2) Nadia's Reply (Practical Modes)**
  *Verdict: Clearly right (within her framework).*
  This is the standard Intellectualist defense (akin to Stanley & Williamson). By distinguishing the *content* of knowledge from the *mode of presentation*, she insulates her view from the requirement of speech. Logically, this neutralizes Owen's first shot. Whether one finds "practical modes" metaphysically satisfying is a separate issue, but as a dialectical move, it successfully blocks the counterexample.

  **(3) Owen's "Redescription" Charge**
  *Verdict: Defensible.*
  This is a methodological critique. If the "practical mode of presentation" is invoked solely to save the theory from counterexamples without independent characterization, it risks being an *ad hoc* rescue device. Owen is right to press that a theory must be falsifiable. However, it is slightly overstated because Nadia does offer predictions in move (4), meaning the view is not entirely immune to evidence.

  **(4) Nadia's Coach Case & Normativity**
  *Verdict: Clearly right.*
  This is the strongest move in the exchange. The "injured expert" or "paralyzed coach" case is the standard heavyweight objection to pure Ability Views. It demonstrates that ability is neither necessary nor sufficient for know-how (one can have the knowledge without the physical capacity). Furthermore, her point about justification and defeat highlights a categorical difference: abilities can fail without epistemic fault, whereas knowledge claims are subject to normative evaluation. This places a heavy burden on Owen.

  **(5) Owen's Ambiguity Charge**
  *Verdict: Defensible but overstated.*
  Owen attempts to dissolve the counterexample by claiming linguistic ambiguity (a Rylean move). He suggests Nadia is conflating "knowing the theory of the move" with "knowing how to perform it." While linguistically plausible, this is dialectically weak here because it effectively stipulates that the only *real* know-how is ability, begging the question against Nadia's unified account. It protects his view but at the cost of fragmenting the concept of "knowledge."

  **(6) Nadia's Regress Reply**
  *Verdict: Clearly right.*
  Nadia correctly identifies the flaw in Ryle's famous regress argument. The regress only generates if one assumes that utilizing propositional knowledge requires a prior *act* of contemplating that knowledge. Contemporary epistemology treats knowledge as a state that can guide action directly without an intermediate step of consultation. This neutralizes the most famous historical argument against her position.

  **(7) Owen's "State vs. Performance" Reply**
  *Verdict: Defensible.*
  Owen hits on the "explanatory gap." Even if know-how *is* a state, merely positing the state does not explain the *success* of the action or the gradability of skill (novice vs. expert). Propositional knowledge is traditionally binary (you know or you don't), while skills are scalar. This remains a lingering problem for Intellectualism, even if it doesn't refute it outright.

  ### Overall Adjudication

  **Nadia has the better of the exchange.**

  While Owen captures the phenomenological intuition that skill feels like doing rather than thinking, Nadia's position is theoretically more robust. She successfully defends her view against the two most potent counterexamples in the literature: the non-articulate expert (the sexer) and the unable expert (the coach). Owen's defense relies heavily on linguistic stipulation (move 5) and methodological suspicion (move 3), whereas Nadia offers a unified account that preserves the epistemic normativity of knowledge (move 4) and dissolves the classic regress (move 6). In analytic terms, Nadia's view survives the falsification attempts better than Owen's.

  ### What Both Parties Are Missing

  1.  **The Metaphysics of "Practical Modes":** Nadia treats the "practical mode of presentation" as a shield, but neither party interrogates what this *is*. Is it a distinct neural pathway? A sui generis mental relation? Without an account of how a practical mode differs from a theoretical one other than by its effects, Nadia's view risks confirming Owen's "redescription" charge.
  2.  **Hybrid Possibilities:** Both argue for a reduction (Know-how is *only* know-that vs. Know-how is *only* ability). They miss the plausible middle ground: that know-how might require *both* a propositional component (guidance) and a dispositional component (execution), or that "knowing how" is a cluster concept that shifts meaning based on context.
  3.  **Understanding vs. Knowledge:** The debate focuses on knowledge, but skill might be better categorized under *understanding*. Understanding allows for gradability and practical application without requiring the strict truth-conditions of propositional knowledge, potentially sidestepping the binary/scalar tension Owen raises in move (7).

  ### Consideration for the Opposite Verdict

  I would adjudicate in **Owen's favor** if the criterion for victory were **explanatory power rather than counterexample immunity**.

  Nadia's view is better at *accommodating* data (by expanding the definition of propositions), but Owen is right that it explains less. If the "practical mode of presentation" cannot be independently specified without referencing the very ability it is meant to ground, then Nadia's theory is circular. If one demands that a theory of skill explain *why* the agent succeeds in real-time performance, Owen's dispositional view is more natural. Nadia explains the *status* of the agent; Owen explains the *action* of the agent. If the reading group's goal is to understand action rather than classify epistemic states, Owen wins.

  ### Where My Reasoning Is Most Likely to Fail

  My reasoning is most likely to fail in **underestimating the linguistic data.**

  I have privileged the "injured coach" intuition (which favors Nadia) over the ordinary usage of "knows how." In everyday language, if the coach cannot physically demonstrate or perform the move, we often say, "He *knows about* it, but he doesn't *know how* to do it anymore." Owen's ambiguity charge (move 5) aligns better with common parlance. By treating the philosophical technicalities of epistemic normativity as paramount, I may be ignoring the semantic reality that "knowing how" is primarily a verb of capability in natural language, not a verb of epistemic state. If the debate is about the concept we actually use, rather than the concept we *should* use for theoretical neatness, Owen has the stronger claim.
