      *   *Winner:* Nadia edges it on technical philosophical grounds (she handles the counterexamples better), but Owen wins on phenomenological/explanatory grounds. In analytic epistemology, handling counterexamples usually wins the round. Let's say Nadia has the better of the *exchange* because her view is more robust against falsification, even if less intuitive.
      *   *Wait, reconsider:* Owen's point (3) about redescription is damning if true. But Nadia's point (4) about the injured coach is the standard "kill shot" for pure ability views. Most contemporary literature (Stanley, Hawthorne) leans Intellectualist because of the injured coach case. So Nadia likely wins the technical debate.

  5.  **What are they missing?**
