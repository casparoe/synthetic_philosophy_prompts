      *(Self-Correction during drafting)*: Make sure not to simply say "Stanley says X." Treat Nadia and Owen as independent arguers while acknowledging the philosophical lineage. Ensure the distinction between "articulable" and "propositional" is clear in move 1 & 2.

      *Refining Move 3:* Is it true that *no* case could tell against Nadia? She claims in Move 4 that her view makes predictions (loss of ability vs loss of knowledge). So Owen's claim in 3 is technically false/overstated.
      *Refining Move 5:* Owen's ambiguity claim is a standard linguistic defense. It's defensible but shifts the burden.
      *Refining Move 7:* The "degrees" point is strong. Propositional knowledge is often treated as binary (you know or you don't), whereas skills are gradual.

      *Overall Winner:* Nadia. Why? Because the "Injured Coach" (Move 4) is generally considered the hardest hurdle for Anti-Intellectualism, and her response to the Regress (Move 6) is the standard successful defense. Owen's objections are powerful intuitions but less theoretically robust in the face of these specific counter-cases.

