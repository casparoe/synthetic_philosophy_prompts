  The Hedonistic Imperative, primarily associated with David Pearce, posits that humanity's moral obligation is to abolish suffering in all sentient life. The modest version of this view advocates for aggressive palliative care and psychiatric treatment to reduce extreme agony within current biological limits. It seeks to alleviate pathology without fundamentally altering human nature. The ambitious version, however, demands we rewrite the genetic source code of suffering itself. It suggests using biotechnology—gene editing, neural implants, pharmacology—to replace the pain-pleasure axis with a gradient of intelligent bliss. This isn't merely treating symptoms; it is engineering a new state of existence where suffering is biologically impossible. The distinction lies in scope: one manages the accidents of evolution's blind design, while the other fixes the underlying mechanism. The ambitious goal aims for a post-Darwinian era where no being ever experiences involuntary distress again, transforming suffering from an inevitability into an obsolete technical problem.

  **The case for abolition**

  The moral case for abolition rests on the negative utilitarian premise that suffering is intrinsically bad, regardless of its evolutionary utility. Evolution designed pain to promote survival and replication, not welfare. Consider the hot stove: currently, touching it sends a nociceptive signal coupled with visceral agony to ensure you flinch and learn avoidance. The Hedonistic Imperative argues we can decouple the information from the agony. You still receive the signal, you still flinch, but the "awful can't-stand-it quality" is removed. Critics ask if this is just relabeling, but if the person no longer wishes the sensation would stop, suffering has ceased to exist by definition. Suffering is defined by aversion; remove the aversion, and you remove the suffering. To retain the agony because it is "informative" is to prioritize biological fitness over sentient welfare. We no longer accept smallpox because it was "natural" or "informative" about immunity; similarly, we should not accept neural architecture that requires torture to function. The goal is intelligent signaling without the moral cost of subjective hell. Furthermore, the wish for pain to stop is the core of the negative experience. If biotech removes that urge while preserving the data, the moral harm is extinguished. We are not hiding the pain; we are removing the element that makes it bad. The signal remains, but the victim is gone. This preserves safety without preserving misery, allowing organisms to function optimally without being subjected to the brutal reinforcement schedules of the ancestral environment. We can replace the pain-pleasure axis with a gradient of intelligent bliss, where motivation is driven by attraction to better states rather than fear of worse ones. This shifts the engine of life from avoidance to approach, maintaining functionality without the moral catastrophe of involuntary suffering. A gradient of bliss can still motivate complex behavior, ensuring we don't become passiv