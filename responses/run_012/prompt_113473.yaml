answer: |-
  The requirement of Content Stability across asserted and unasserted contexts is the most exclusionary, and the triad of Strict Attitude-Expression, Compositional Integrity, and Logical Validity constitutes an unsatisfiable subset for any theory that refuses to decouple semantic content from psychological state.

  To derive these specifications, I have treated your ten stress-tests not as isolated puzzles but as symptoms of a single underlying demand: evaluative vocabulary must behave semantically like descriptive vocabulary while retaining its distinctive practical function. The following desiderata are not mere preferences but conditions of adequacy; if a theory cannot explain how "wrong" functions in a conditional, a question, and an assertion simultaneously, it fails to account for the language we actually speak. I have mapped your ten tests onto six core requirements, noting where tensions arise that threaten to break the theoretical framework.

  ### Desiderata for Evaluative Semantics

  **1. Compositional Integrity**
  *   **Motivation:** Evaluative predicates must combine with logical operators (negation, modals, quantifiers) without semantic failure. This addresses **Epistemic embedding (2)**, **Quantification (3)**, and **Counterfactual antecedent (6)**. If "wrong" denotes an attitude rather than a property or proposition, it is unclear what semantic value enters the composition when embedded under "might" or "every."
  *   **Status:** Non-negotiable. A language that cannot compose is not a language.
  *   **Compatibility Risk:** High tension with **Strict Attitude-Expression**. If the meaning of "wrong" is *to express* disapproval, embedding it inside "If..." suspends the expression, leaving nothing for the operator to operate on.

  **2. Content Stability (Context Independence)**
  *   **Motivation:** The semantic content of an evaluative sentence must remain invariant whether it is asserted, denied, questioned, or supposed. This addresses **Negation asymmetry (1)**, **Attitude reports with ellipsis (4)**, **Questions and answers (5)**, and **Reasoning from supposition (8)**. The content of "lying is wrong" in a premise must be identical to its content in a conclusion or a conditional antecedent.
  *   **Status:** Non-negotiable. Without this, valid inference is impossible because the terms shift meaning mid-argument.
  *   **Compatibility Risk:** High tension with **Contextual Sensitivity (6)**. If meaning is tied to the speaker's current psychological state (as in pure expressivism), stability across different contexts (fiction vs. reality, supposition vs. assertion) is difficult to maintain without positing a detached propositional content.

  **3. Logical Validity**
  *   **Motivation:** Arguments containing evaluative premises must be valid in virtue of their form and content, not merely psychological coherence. This addresses **Reasoning from supposition, including reductio (8)**. A theory must explain why denying the conclusion while accepting the premises constitutes a mistake of logic, not just a change of mind.
  *   **Status:** Non-negotiable. Moral reasoning is reasoning; if it lacks logical validity, it is merely persuasion.
  *   **Compatibility Risk:** High tension with **Strict Attitude-Expression**. Attitudes (like booing) do not stand in logical relations to one another; only propositions do. Satisfying this often forces a theory toward cognitivism.

  **4. Inter-Vocabulary Coherence**
  *   **Motivation:** Evaluative claims must be able to stand in explanatory relations to descriptive claims. This addresses **Mixed explanation (7)**. For "Cruelty is wrong because it causes suffering" to be intelligible, the meaning of "wrong" must allow a causal or grounding connection to "suffering."
  *   **Status:** Non-negotiable. Moral deliberation relies on linking facts to values.
  *   **Compatibility Risk:** Moderate. Hybrid theories struggle here if the descriptive and evaluative components are semantically disconnected; realist theories struggle if the "because" implies a naturalistic reduction that fails to capture normativity.

  **5. Truth-Predicate Accommodation**
  *   **Motivation:** The theory must allow speakers to predicate truth of evaluative sentences without ontological inflation. This addresses **Truth predication (9)**. We say "'Lying is wrong' is true" comfortably; a theory must explain whether this tracks a fact, a commitment, or a linguistic convention.
  *   **Status:** Preference (depending on metaphysical commitment), but practically non-negotiable for linguistic adequacy.
  *   **Compatibility Risk:** Low for deflationary accounts, High for robust expressivism. If truth requires correspondence to mind-independent facts, expressivism fails; if truth is merely disquotational, realism loses its distinctive advantage.

  **6. Attitude/Report Distinction**
  *   **Motivation:** The theory must distinguish between expressing an evaluation and reporting that someone else holds one. This addresses **Fiction and free indirect discourse (10)** and **Attitude reports (4)**. In "Ada thinks hoarding is wrong," the speaker does not necessarily express disapproval of hoarding.
  *   **Status:** Non-negotiable. Failure here collapses the distinction between ethics and psychology.
  *   **Compatibility Risk:** Low. Most theories handle this via standard propositional attitude semantics, provided Requirement 2 (Content Stability) is met.

  ### Incompatibility Analysis
  The most severe tension exists between **Compositional Integrity**, **Content Stability**, and **Strict Attitude-Expression**. If the meaning of "wrong" is exhausted by the non-cognitive act of expressing disapproval (Strict Attitude-Expression), then embedding the term (Compositional Integrity) removes the act, leaving no content to remain stable (Content Stability). To satisfy all three, a theory must either abandon strict expressivism (admitting propositional content) or redefine compositionality (e.g., via higher-order attitudes). Consequently, **no theory can meet all desiderata while maintaining a naive non-cognitivist metaphysics**; one constraint must yield, usually by conceding that evaluative sentences have truth-conditional content even if their primary function is practical.

  ### Closing Tasks

  **Most Exclusionary Requirement**
  **Content Stability** is the single most exclusionary requirement. It excludes any view that ties meaning too tightly to the immediate pragmatic context of utterance. Pure prescriptivism and bare non-cognitivism fail here because they cannot explain how the meaning of "wrong" survives inside a conditional or a question where no prescription is issued and no attitude is directly expressed. If the meaning shifts when embedded, logic collapses; if the meaning stays stable, the theory looks increasingly like cognitivism.

  **Assessment of Expressivist Strategies**
  *   **Bare Non-Cognitivism:** Fails **Compositional Integrity** and **Content Stability** outright. It treats "wrong" as a signal of attitude, which cannot be negated or conditionalized without losing its defining function, leaving it unable to account for valid inference in embedded contexts.
  *   **Prescriptivism:** Struggles with **Logical Validity**. While it handles the action-guiding nature of ethics, it treats moral sentences as imperatives; since imperatives do not standardly validate indicative conditionals (the "Frege-Geach" point), it cannot explain why moral arguments are logically binding rather than merely psychologically persuasive.
  *   **Hybrid/Truth-Conditional Expressivism:** fares better on **Compositional Integrity** by positing dual content (descriptive + expressive), but risks failing **Inter-Vocabulary Coherence**. If the expressive content is separate from the truth-conditional content, it becomes unclear how the descriptive facts ground the evaluative truth, potentially severing the link required for mixed explanations.
  *   **Quasi-Realism:** Attempts to meet all requirements by mimicking realist semantics without realist metaphysics. It succeeds on **Content Stability** and **Logical Validity** by earning the right to talk of truth and facts, but faces a collapse problem on **Truth-Predicate Accommodation**: if it explains truth-talk exactly as realists do, the distinction between quasi-realism and realism becomes metaphysically negligible, threatening its original anti-realist motivation.
