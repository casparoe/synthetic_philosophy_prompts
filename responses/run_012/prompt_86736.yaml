answer: |-
  Moore's ethics justify repatriation where restoring an artifact's context creates a superior organic unity of aesthetic experience, but applying his principles ultimately reveals his theory lacks the conceptual resources to validate collective heritage claims that do not reduce to individual mental states.

  For Moore, the beauty of the marbles is not an intrinsic good in itself; rather, the intrinsic good is the *consciousness* of that beauty. The stone is merely a condition necessary for the mental state of aesthetic appreciation. Therefore, the question of location is not about the object's rights but about where the requisite consciousness yields the highest value. If the marbles in Athens facilitate a deeper or more appropriate aesthetic appreciation than in London, Moorean value increases. However, Moore is silent on who gets to appreciate them; he does not prioritize the descendants' gaze over the global public's unless the quality of the former's appreciation is intrinsically superior.

  The organic-unity thesis provides the strongest Moorean argument for repatriation. Moore argues that the value of a whole is not simply the sum of its parts; a whole can be greater than the sum, or less. The Parthenon frieze integrated into the temple architecture constitutes an organic whole with a specific aesthetic value. Severing the sculptures from the structure destroys that whole, creating a new whole (sculpture in gallery) that may have less value, even if the individual stones remain physically intact. Moore would likely argue that wrenching the parts from their architectural context diminishes the intrinsic value of the aesthetic experience because the "fit" is a constituent of the beauty being appreciated. A gallery simulation cannot fully restore the organic unity of the original configuration, meaning the displacement itself constitutes a net loss of intrinsic good, regardless of legal ownership.

  Regarding the "friendship and affection" good, you are stretching Moore past breaking if you classify a people's relationship to heritage as personal affection. Moore is explicit that this good arises between persons; it is interpersonal love or friendship. A community's connection to an artifact is not a relation between persons, nor is the artifact a person. Moore might categorize the emotional resonance of heritage as a component of aesthetic enjoyment or a distinct emotional state, but he lacks the taxonomy to treat "cultural belonging" as a fundamental intrinsic good akin to friendship. He would likely view the pain of dispossession as a negative mental state (which counts against the status quo) but would not recognize the violation of a collective right as a distinct moral injury. To fit this into Moore, one must reduce the collective claim to an aggregate of individual pains and pleasures, losing the specific force of the "heritage" argument.

  The isolation test clarifies this limitation. If you isolate the marble in a void, it has no value. If you isolate the marble in the British Museum, it has value based on the appreciation it generates there. If you isolate the marble in Athens, it has value based on appreciation there plus the restored organic unity. Moore's test forces us to compare these wholes. However, the test fails to capture the historical narrative of theft. For Moore, the *history* of how the object arrived matters only insofar as it affects current or future mental states. The injustice of the past looting has no intrinsic disvalue unless it causes present pain. Moore is silent on rectification for its own sake; he has no concept of "cleaning up the past" unless it maximizes present good.

  This episode embarrasses Moore's theory regarding cultural property. It confirms his theory's utility in analyzing aesthetic context and the value of preservation through organic unity, showing that displacement often destroys value. However, it reveals that Moore never had the resources for cases involving collective agency, historical justice, or sovereignty. His theory is radically individualistic and present-minded; it can calculate the loss of aesthetic value but cannot comprehend the moral claim of a nation demanding its history back. Ultimately, Moore reduces the repatriation fight to a calculus of aesthetic optimization, missing the core political and ethical demand that defines the controversy.
