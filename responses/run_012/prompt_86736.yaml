      *Self-Correction on "Friendship":* The prompt asks: "is a people's relationship to its own art an instance of the friendship-and-affection good he ranks so high, or am I stretching him past breaking?" I need to answer this directly. It is stretching him. Moore means interpersonal love. I should state that clearly.

      *Self-Correction on "Organic Unity":* Moore uses this to explain why the existence of beauty matters even if no one sees it (though he later clarifies consciousness is needed). Actually, for Moore, the *consciousness* of the beauty is the primary good. The object is a condition. So the organic unity is between the *object* and the *consciousness*? Or the object and its *setting*? Moore discusses organic unities in terms of parts contributing to a whole's value differently than they do alone. The architectural fit is a classic example of organic unity in aesthetics.

      *Let's write.*

