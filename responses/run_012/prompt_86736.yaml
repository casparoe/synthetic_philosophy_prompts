      *Check:* Did I address "where does the collective side sit"? Yes. Did I address "is beauty intrinsic"? Yes (consciousness of it is). Did I address "organic unity"? Yes. Did I address "silence"? Yes.

      *Refining the "Friendship" point:* Moore is very specific. "Personal affection" implies persons. A people's relationship to art is not personal affection. It might be a component of aesthetic enjoyment or a distinct emotion, but calling it "friendship" breaks his taxonomy. I need to be firm there.

      *Refining the "Organic Unity" point:* Moore argues that the value of a whole is not proportional to the sum of its parts. The Parthenon Sculptures + Parthenon > Sculptures in BM + Rubble in Athens. This is a strong Moorean argument for return. However, Moore also values the *spread* of appreciation. If more people see them in London, does that outweigh the loss of organic unity? Moore might weigh the intensity of the aesthetic experience higher than the quantity. The "fit" enhances the quality of the consciousness.

