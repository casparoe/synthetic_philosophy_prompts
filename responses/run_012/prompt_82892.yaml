answer: |-
  Your German friend is right, and your working theory is surprisingly close to established constitutional law. The case is the **1983 Census Judgment (*Volkszählungsurteil*)** by the German Federal Constitutional Court. It established the fundamental right to **"Informational Self-Determination."**

  The Court argued that in modern data processing, the individual cannot protect themselves against unlimited collection, storage, and combination of data. If the state can know everything, it can inhibit the freedom of citizens to plan and act without fear of surveillance.

  However, Informational Self-Determination alone is too broad to explain your welfare/salary distinction. To capture your full set of intuitions, we need to combine that with a principle of **Contextual Purpose Limitation.**

  Here is the precise two-clause principle that reproduces your verdicts.

  ### The Principle: Protected Agency via Contextual Boundaries

  **Clause 1 (The Anti-Chilling Clause):** The state may collect data necessary for specific administrative functions, but it may not aggregate or process that data in a way that allows it to model, predict, or suppress lawful individual behavior *before* a legal threshold (like probable cause) is met.
  *   **Forced by:** Your verdict on **License Plate Readers** and the **Protest Organizer Database**.
  *   **Why:** This captures your "pre-emption" hunch. It distinguishes between knowing where you live (static) and knowing where you are going (dynamic/predictive).

  **Clause 2 (The Power Symmetry Clause):** Data disclosure is permissible when it holds power accountable (downward transparency) but restricted when it exposes vulnerability to stigma or coercion (upward transparency), unless there is a direct, narrow public safety necessity.
  *   **Forced by:** Your verdict on **Public Salaries vs. Welfare Names** and **Public Health vs. Insurer**.
  *   **Why:** This explains why "public money" isn't a single category. Officials wield power over you; welfare recipients do not. Insurers can deny you life; public health saves it.

  ---

  ### Mapping the Principle to Your Verdicts

  | Scenario | Verdict | Which Clause? | Analysis |
  | :--- | :--- | :--- | :--- |
  | **Income/Address** | Fine | Clause 1 (Exception) | Static data for tax/service delivery. No predictive modeling of behavior. |
  | **German Registration** | Fine | Clause 1 (Exception) | Administrative necessity. Static. |
  | **Mandatory ID on Demand** | **Not Fine** | Clause 1 | "On demand" implies arbitrary stops. This creates a "papers please" environment that chills movement and association before any crime is suspected. |
  | **ALPR (Mass Logging)** | **Not Fine** | Clause 1 | Aggregating movement allows pattern-of-life analysis. This is pre-emptive modeling. |
  | **Phone Location (Broker)** | **Not Fine** | Clause 1 & 2 | Circumvents warrant (Clause 1) and exploits private power asymmetry (Clause 2: broker sells what state can't take). |
  | **Public Salaries** | Fine | Clause 2 | Downward transparency. Officials wield state power; citizens need to check it. |
  | **Welfare Names** | **Not Fine** | Clause 2 | Upward transparency. Recipients are vulnerable; publication invites stigma/harassment without checking state power. |
  | **Disease Reporting** | Fine | Clause 2 | Direct public safety necessity overrides privacy to protect others. |
  | **Insurer/Employer Health** | **Not Fine** | Clause 2 | No public safety necessity. Creates private coercion/vulnerability. |
  | **Census (Count)** | Fine | Clause 1 | Aggregate data. No individual modeling. |
  | **Census (Religion + Name)** | **Not Fine** | Clause 1 | Enables targeting/persecution. Chills freedom of conscience. |
  | **Social Media Passwords** | **Not Fine** | Clause 2 | Private coercion. No state interest, high vulnerability. |
  | **Email (Warrant)** | Fine | Clause 1 | Specific suspicion meets legal threshold. Not dragnet. |
  | **Protest Database** | **Not Fine** | Clause 1 | Dragnet surveillance of lawful activity. Pure pre-emption/chilling. |
  | **Credit Score** | Fine | Clause 1 & 2 | Backward-looking (did you pay?), narrow financial context. |
  | **Social Credit** | **Not Fine** | Clause 1 | Forward-looking behavioral modification. Political compliance. |

  **What this principle throws overboard:**
  It forces you to admit that **Mandatory ID** is the weakest link in your intuition if you accept German Registration. The principle suggests the *registration* is fine (static), but the *random demand* is the violation. If Germany allows random stops to check ID, this principle says Germany is wrong on that specific point, even if you feel it's "Fine." (Note: In practice, German police generally require *Anlass* [cause] to stop you, which aligns with the principle).

  ### On "Contextual Integrity"
  You asked if "information flowing the way it's supposed to flow" is just a redescription.
  **Yes, it is.** But that is not a bug.
  "Contextual Integrity" (Helen Nissenbaum's theory) describes the *mechanism* of your intuition, while "Protected Agency" describes the *value* you are protecting.
  *   **Mechanism:** Health data flows to doctors, not bosses.
  *   **Value:** Because allowing it to flow to bosses reduces your agency (you might avoid treatment to keep a job).
  If you treat "context" as the ultimate principle, you can't explain why contexts should change. If you treat "Agency" as the principle, you can argue that a context (like social media) *should* be protected because violating it harms agency.

  ---

  ### Testing Against New Cases

  **(a) Police uploading crime-scene DNA to consumer genealogy sites**
  *   **Verdict:** **Not Fine** (with narrow exceptions).
  *   **Reasoning:** Violates **Clause 2 (Power Symmetry/Purpose Limitation)**. Users uploaded DNA for *family finding*, not criminal investigation. By using it for policing, the state bypasses the legal threshold required to take DNA directly (probable cause/warrant). It implicates relatives who never consented (collateral damage to agency).
  *   **Caveat:** Only "Fine" for violent serial crimes where the threat to others' agency outweighs the privacy violation.

  **(b) Government releasing "anonymized" health data that is re-identifiable**
  *   **Verdict:** **Not Fine.**
  *   **Reasoning:** Violates **Clause 1**. If data can be re-identified, it is not aggregate; it is individual. Releasing it creates a risk of modeling/targeting without the subject's knowledge. It is negligence that undermines the promise of informational self-determination.

  **(c) Law requiring me to unlock my phone at the border**
  *   **Verdict:** **Not Fine** (for forensic search); **Fine** (for contraband check).
  *   **Reasoning:** This is the hardest case.
      *   If the state just wants to ensure you aren't smuggling child sexual abuse material (CSAM): **Fine** (Direct safety necessity, Clause 2).
      *   If the state wants to search your emails/photos for "admissibility" or general intelligence: **Not Fine** (Clause 1). A phone is a "digital home." Searching it without suspicion is a dragnet that chills speech and association before you even enter the country. It turns the border into a pre-emption zone.

  ---

  ### Meta-Level: Where This Reasoning Breaks

  **1. The "Existential Threat" Exception**
  This principle assumes a liberal democracy where the state is mostly benign but prone to overreach. It breaks if you believe the state faces an existential threat (e.g., imminent nuclear terror).
  *   **What would change my mind:** If you told me, "Actually, I *am* okay with the Protest Database if it uses AI to predict riots."
  *   **Implication:** If you accept that, you are prioritizing **Security over Agency**. You cannot keep the "Anti-Chilling" clause. You would have to adopt a Utilitarian principle: *Privacy is permitted only until it obstructs safety.* This would force you to accept ALPR and Social Credit if they are proven effective.

  **2. The Cultural Contingency**
  You asked if this is just "folk sociology."
  *   **Yes and No.** The *weighting* is cultural. The US prioritizes "Freedom from State" (Negative Liberty); Germany prioritizes "Human Dignity" (which includes data protection).
  *   **The Implication:** Your intuition that Mandatory ID is "Not Fine" is culturally American. A French or German citizen might find it "Fine" because they trust the bureaucracy not to abuse the *stop*, whereas you distrust the *power to stop*.
  *   **Which verdicts to drop?** If you admit this is cultural, you must admit **Mandatory ID** is not a universal principle of justice. It is a preference for a specific type of state-citizen relationship. You can keep it, but you can't claim it's objectively "tyranny" in the same way torture is.

  **3. The Private Sector Loophole**
  My principle focuses heavily on the *State*. But your verdicts on **Credit Scores** and **Data Brokers** implicate private actors.
  *   **The Weakness:** If the state buys data it can't collect (Phone Location), is that a state violation or a market failure?
  *   **Correction:** To be consistent, Clause 2 must apply to **Private Power** too. If a private entity (Insurer, Landlord) gains enough power to dictate your life choices via data, they become quasi-state actors regarding privacy. If you don't accept this, you have to accept Credit Scores and Social Credit as the same thing (market behavior modification). You currently distinguish them, which implies you think the *State's* use of behavioral data is uniquely dangerous.

  ### Summary
  Your gut is tracking **Informational Self-Determination**. You are comfortable with data that helps the state *administer* (tax, census, health), but uncomfortable with data that helps the state *anticipate* (ALPR, protest lists, social credit).

  The inconsistency in your list (ID cards vs. Registration) is resolved by distinguishing **Static Administration** from **Dynamic Interaction**.
  The inconsistency in your list (Salaries vs. Welfare) is resolved by distinguishing **Checking Power** from **Punishing Vulnerability**.

  If you want to be principled, stop arguing about "privacy" as a secret. Argue about **Agency**. The question isn't "Does the state know?" It's "Does this knowledge allow the state to change my behavior before I break the law?"
