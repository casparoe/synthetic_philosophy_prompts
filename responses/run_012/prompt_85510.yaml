      *   *Problem C: Infinite Stakes.* If there's a non-zero chance of infinite impact, it dominates finite decision theory (Pascal's Wager variant).
      *   *The Trap:* Nihilism ("Nothing matters") vs. Delusion ("You matter immensely").
      *   *The Solution:* Shift the locus of meaning from *aggregate cosmic utility* to *local, finite experience* and *indexical perspective*. Even if the *total* doesn't change, the *local* experience does. Even if copies exist, *this* copy is the one experiencing *this* moment.

  3.  **Drafting Strategy - Section by Section:**

      *   **Opening:** Acknowledge the Class President's optimism without contradicting it. Set the scene (lawn, folding chairs). Introduce the "Infinity" theme lightly.
      *   **The "Bad" News (The Philosophy):** Briefly touch on the infinity problem without getting bogged down in math. Acknowledge the "zero contribution" argument.
