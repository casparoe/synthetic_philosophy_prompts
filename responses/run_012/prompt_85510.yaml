answer: |-
  Thank you, President [Name]. That was… a lot of pressure. She's told us we're going to fix everything. I'm here to talk about the size of the room we're trying to fix.

  As many of you know, I'm a philosophy major. Specifically, I just finished a seminar on Infinity. It was great. I recommend it, provided you enjoy realizing that your intuition about reality is broken.

  Here is what I learned: If the universe is infinite, then the total amount of good and bad in existence is already infinite. Mathematically, adding a finite amount of good—say, a career in non-profit work, or a really nice garden—to an infinite total changes the sum by exactly zero. Also, if space is infinite, there are infinitely many copies of me giving this speech, and infinitely many of you sitting in these folding chairs. So, strictly speaking, the line about how "each of you is unique" is cosmologically false. And finally, if there is even a microscopic chance that any choice we make could lead to an infinite outcome, rational decision theory says that possibility should swamp every normal consideration, like what to eat for lunch or whether to call your mother.

  I mention this because my grandmother is in the third row, and she told me to keep this short and not depressing. And my seminar professor is also in the third row, and he told me not to say anything false just to make people feel better.

  So, here is the truth.

  Cosmically, our contribution to the grand total might be zero. There might be a copy of you, right now, in a galaxy far away, making the exact same choice you are. But that copy is not *here*. That copy cannot hold the hand of the person sitting next to them on this lawn. That copy cannot visit the grandmother who flew in to see *this* specific version of you.

  We are causally isolated. Even if we are not unique in the universe, we are unique in this context. The love your family feels for you is not distributed across the multiverse; it is concentrated right here, in this chair, on this day. And while adding a finite amount of kindness to an infinite universe doesn't change the *total*, it changes the *local*. It changes the world for the people you touch. And since we cannot access the rest of the universe, the local is the only place where morality actually happens.

  As for the infinite stakes—the idea that one wrong move could cost us everything, or one right move could save it all—that can be paralyzing. It makes the finite choices seem trivial. But I would argue the opposite. Since we lack the epistemic access to know which action triggers the infinite good, we must treat every finite action *as if* it carries infinite weight. We don't get to skip the small stuff because we're waiting for the big lever. The small stuff is the only lever we have.

  So, Class President is right. We do have work to do. But we don't need to save the Universe. We just need to save this part of it. The part where we live.

  If you go out there and reduce suffering by even a tiny amount, you haven't changed the cosmic sum. But you have changed the experience of the beings involved. And since consciousness is only ever experienced locally, that is the only metric that anyone here will ever actually encounter.

  So, go be kind. Not because it makes the universe bigger, but because it makes this corner of it warmer. Not because you are the only you that exists, but because you are the only you that is *here*. And not because you know which choice saves the world, but because treating every choice with that level of care is the only way to live without regret.

  The universe might be infinite. But this ceremony isn't. My grandmother is waiting for lunch. And I am, genuinely, so proud of all of you.

  Thank you.
