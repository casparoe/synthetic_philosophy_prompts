answer: |-
  Here is a 90-minute lesson plan designed to move your students from Humean reductionism to viewing the Nyāya position as a viable epistemic alternative.

  ### 1. Conceptual Groundwork: What Must Be in Place First
  Before you can argue that *śabda* is a basic *pramāṇa*, you must dismantle the Western "justification-first" framework your students are operating within. You need to establish three specific conceptual pillars in the first 20 minutes.

  *   **Pramāṇa as Causal Instrument, Not Justificatory Argument:** Your students equate "source of knowledge" with "premise in an argument." You must reframe *pramāṇa* as a *karaṇa* (instrument).
      *   *The Move:* Use the analogy of vision. When you see a cup, you do not construct an inference ("There are retinal images, therefore a cup exists"). The visual apparatus *causally generates* the cognition. Nyāya treats testimony similarly: under the right conditions, the utterance *causally generates* the knowledge, just as light generates visual cognition.
      *   *Why this matters:* If *pramāṇa* is an instrument, the question shifts from "How do I argue for this belief?" to "What instrument produced this cognition?" If perception and inference are distinct instruments, testimony can be a third distinct instrument without needing to be reduced to the other two.
  *   **The Instrument/Product Distinction (*Pramāṇa* vs. *Pramiti*):** Students often conflate the source with the result.
      *   *The Move:* Explicitly distinguish the *process* of knowing (the *pramāṇa*) from the *episodic knowledge* produced (the *pramiti*).
      *   *Why this matters:* A reductionist argues that the *justification* for the knowledge is inference. The Naiyāyika argues that while inference might verify the *speaker's reliability*, the *knowledge of the fact* is produced by the testimony instrument itself. Separating the tool from the product allows you to say: "You used inference to check the tool, but the tool produced the product."
  *   **The *Āpta* as Reliability Marker, Not Authority Figure:** This is the most critical defensive move.
      *   *The Move:* Define *āpta* not as a "guru" or "authority" (power/status) but as a "competent and truthful speaker" (epistemic virtue). An *āpta* is someone who knows the truth (*tattvajña*) and intends to communicate it accurately (*yathārtha*).
      *   *Why this matters:* This neutralizes the "appeal to authority" objection. Nyāya is not asking for blind submission to power; it is positing a mechanism for transmitting knowledge from a reliable source to a receiver, analogous to a reliable thermometer transmitting temperature data.

  ### 2. The Single Example: "The Live Wire"
  Do not use "water on the hill" (too perceptual), "medicine works" (too inductive), or "word meaning" (too semantic). Use **The Live Wire Scenario.**

  *   **The Scenario:** You are standing in a dark room. There is a wire on the floor. You cannot see if it is sparking, you have no multimeter, and you lack the electrical theory to infer its status from surrounding cues. An electrician enters, uses a tool you do not understand, looks at the wire, and says, "That wire is live; it will kill you if you touch it." You step back.
  *   **Why this example carries the session:**
      1.  **Blocks Perception:** You are in the dark; you cannot see the electricity.
      2.  **Blocks Inference:** You lack the technical premises to infer the wire's status from other clues.
      3.  **High Stakes:** It mirrors the "miracle" discussion (action-guiding belief based on report) but removes the supernatural baggage.
      4.  **Isolates the Mechanism:** It forces the question: "How do I *know* it is live?"
          *   *Reductionist Answer:* "I infer the electrician is reliable (based on uniform experience of electricians), therefore his claim is likely true."
          *   *Nyāya Answer:* "The electrician is an *āpta*. His utterance is the *pramāṇa*. The knowledge is generated directly by the testimony, provided there are no defeaters."
      5.  **Allows for Defeaters:** It is easy to imagine a defeater (e.g., you later see a rat touch it and survive), which allows you to discuss fallibility without collapsing the *pramāṇa*.

  ### 3. Anticipated Misconceptions & Timing
  Your students are trained reductionists. They will try to digest Nyāya into Hume immediately. Head these off at specific timestamps.

  *   **Misconception: "This is just Blind Faith/Authority."**
      *   *When:* Minute 25 (Immediately after defining *āpta*).
      *   *The Intervention:* Explicitly state: "Nyāya does not ask you to trust the speaker because of their social status. You must have independent reason to believe they are an *āpta* (competent and honest). However, once that condition is met, the *knowledge of the fact* does not come from inferring their honesty; it comes from their words. Trust is the *condition* for the instrument to work, not the *argument* for the conclusion."
  *   **Misconception: "Testimony is Infallible."**
      *   *When:* Minute 50 (When applying the example).
      *   *The Intervention:* Introduce the concept of *bādhaka* (defeaters). Ask: "What if you see a rat touch the wire and live?" Students will say, "Then you didn't know." Nyāya agrees. Testimony is a *pramāṇa*, but it is defeasible. If a stronger *pramāṇa* (perception) contradicts it, the testimonial knowledge is overturned. This aligns Nyāya with fallibilist externalism (Goldman), making it feel like a "live option."
  *   **Misconception: "It's Just Inference Disguised."**
      *   *When:* Minute 70 (During the comparison).
      *   *The Intervention:* Force the distinction on the *causal chain*. Ask: "Does the inference produce the belief, or does the understanding of the sentence produce the belief?" The Reductionist says the inference justifies the belief. The Naiyāyika says the inference validates the *source*, but the *sentence meaning* generates the *content*. If it were mere inference, you could know the wire is live without understanding the electrician's specific words, provided you trusted him. But you don't know *what* is live until you understand the sentence.

  ### 4. The Final Assessment Question
  Do not ask them to summarize the Nyāya view. Ask them to identify the **commitment the Reductionist must make that the Naiyāyika denies.**

  *   **The Question:** "In the Live Wire case, the Reductionist claims that your knowledge of the wire's status is ultimately grounded in an inference about the electrician's reliability. The Naiyāyika claims it is grounded in the testimony itself. **What is the specific epistemic risk the Reductionist is trying to avoid by insisting on that inference, and why does the Naiyāyika think that risk is a misunderstanding of how knowledge is generated?**"
  *   **What this reveals:**
      *   If they say "The Reductionist wants to avoid being lied to," they haven't understood (Nyāya avoids that via *āpta*).
      *   If they say "The Reductionist thinks testimony has no causal power on its own," they are getting closer.
      *   **Ideal Answer:** "The Reductionist thinks testimony is not a *generator* of knowledge but a *trigger* for an inference. They deny that language can transmit knowledge directly. The Naiyāyika argues that if the speaker is an *āpta*, the language *is* a causal instrument (like a ladder), and requiring an inference every time is like requiring a proof of the ladder's stability before every single step—it confuses the *condition* of safety with the *act* of climbing."

  ### 5. Scope Limitations: What to Refuse
  To keep this within 90 minutes and prevent the "cultural curiosity" trap, you must explicitly bracket the following at the start of the session. Write these on the board as "Out of Bounds for Today."

  1.  **The Vedas and *Apauruṣeyatva*:** Tell them: "Nyāya applies this to human testimony first. The debate over whether the Vedas are authorless is a theological extension of this epistemology. We are doing epistemology, not theology. Today, *śabda* means human expert testimony."
  2.  **The Metaphysics of the Self (*Ātman*):** Tell them: "Nyāya has a robust theory of the self as the knower. We are assuming a subject of knowledge exists, but we are not analyzing its ontology. We are analyzing the *instrument* the subject uses."
  3.  **Sanskrit Taxonomy:** Tell them: "I will give you the Sanskrit terms for precision (*pramāṇa, āpta, bādhaka*), but we will not parse sutras or commentarial debates. We are treating this as a systematic philosophical position, not a philological exercise."

  ### Session Flow (90 Minutes)
  *   **00–15:** **The Reductionist Default.** Briefly recap Hume/Goldman. Establish that students currently view testimony as "Inference from signs of reliability."
  *   **15–35:** **The Nyāya Framework.** Define *pramāṇa* as causal instrument. Define *āpta* as competence/truthfulness (not authority). Distinguish Instrument vs. Product.
  *   **35–60:** **The Live Wire Case.** Run the scenario. Have students argue the Reductionist line. Have you argue the Nyāya line. Highlight where the "Inference" creates an unnecessary regress or cognitive burden.
  *   **60–75:** **Defeasibility & Fallibility.** Show how Nyāya handles error (defeaters). Align with externalism.
  *   **75–90:** **Synthesis & Assessment.** Pose the Final Question. Discuss answers. Conclude by framing Nyāya not as "Eastern mysticism" but as "Epistemic Externalism before the term existed."
