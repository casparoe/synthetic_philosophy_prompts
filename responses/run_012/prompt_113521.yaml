      *   *Not Up to us (Externals):* Plant Dynamics ($A, B$ matrices), Disturbances ($w_t$), Measurement Noise ($v_t$), Actual State Trajectory ($x_t$) resulting from dynamics.
      *   *Indifferents:* Variables not in the primary cost function for stability/performance, but perhaps in a secondary cost.
      *   *Preferred Indifferents:* Weighted terms in the cost function that don't affect stability guarantees but optimize performance.
      *   *Virtue:* Convergence of the policy to an optimal or robust solution regardless of trajectory.
