  *(Self-Correction during drafting the response)*: I need to be careful not to make the engineering analogy *too* perfect, or the residue report loses its bite. The friction is the point. I will emphasize that in Control Theory, we care about $x_t$ (state), whereas Stoics care about $\pi$ (policy).

