answer: |-
  **The Morning Inventory**

  I keep the journal on the nightstand, beneath the lamp that I do not remember turning on. When I wake, the first thing I do is reach for the pen before my eyes are fully open. There is a residue, a specific pressure behind the eyes that suggests weight, as if something heavy has been carried across the room in the dark. I write it down before the coffee, before the shower, before speaking to Elena.

  Today, I wrote: *A large hall with tiled floors. I was looking for a key.*

  It feels true as I write it. The coolness of the tile under my bare feet is vivid. The echo of my own footsteps is distinct. But by the time I cap the pen, the certainty has already begun to leak away. The memory is not a recording; it is a statement I have just made to myself. I look at the sentence. It claims an event occurred. I have no proof of the event other than the sentence itself.

  In the kitchen, Elena is scraping burnt toast into the bin. She doesn't look up when I enter.

  "You were up again," she says.

  "I don't think so," I say. I pour the coffee. The liquid is dark, opaque. "I slept through."

  "You opened the fridge," Elena says. She turns, leaning against the counter, the spatula still in her hand. "It was three-ish. I woke up because of the light. You were standing there in your boxers. You didn't take anything out. You just looked at the shelves."

  This is the external evidence. It sits on the table between us, heavier than the journal. If I stood at the fridge, I was not in the tiled hall. If I was looking at shelves, I was not looking for a key.

  "I don't remember that," I say.

  "You weren't awake," she says. "Your eyes were open, but you weren't there. You stared at the jar of pickles for a long time. Then you closed it and came back to bed."

  I sit down. The memory of the tiled hall is still warm in my mind, but it has no anchor. It floats. If Elena is right, then the hall was constructed the moment I woke up, a story told to explain the sensation of cold feet or the hunger that brought me to the kitchen. Or, perhaps worse, the fridge was a dream too, and Elena is misremembering. But Elena rarely misremembers physical objects. She works in logistics; she tracks shipments for a living. She knows where things are.

  "I wrote down the hall," I say.

  "You always write down the hall," she says, turning back to the stove. "Or the train station. Or the office without doors."

  She says it without malice, but it sounds like an accusation. It implies that I am generating fiction to fill the eight hours we lose every night. It implies that I am not trusting her witness.

  The commute is forty minutes on the train. I work in records management for a mid-sized insurance firm. My job is to reconcile discrepancies between digital logs and physical files. It is work that relies on the assumption that events leave traces. If a file was moved, there is a timestamp. If a claim was processed, there is a signature.

  At 10:15 AM, I find a discrepancy in Box 402. The log says the file was retrieved yesterday at 4:00 PM. The file is sitting in the box. I check the digital signature. It matches my user ID.

  I stare at the screen. I was here yesterday at 4:00 PM. I remember leaving at 5:30. I remember the rain. But I do not remember retrieving this file.

  I call up the access log. It shows a duration of four minutes. Opened. Viewed. Closed.

  "Hey," I say to Mark, who sits at the desk opposite me. "Did you touch Box 402 yesterday?"

  Mark doesn't look up from his monitor. "No. Why?"

  "My ID pulled it."

  "System glitch," Mark says. "Happens all the time. Just close it out."

  "It's not a glitch if I opened it," I say.

  "Then you opened it," he says. "You just don't remember. You were tired yesterday. You looked wrecked."

  I look at my hands. They are resting on the desk. They are the same hands that held the pen this morning. If I opened the file, I performed an action. If I performed an action, I was present. But my memory of yesterday afternoon ends at 3:00 PM, in a meeting about quarterly retention rates. The gap between 3:00 and 5:30 is filled with the usual haze of routine, but there is no specific image of this file.

  Is it possible to do something without experiencing doing it?

  I think of the fridge. The light inside is bright, white. Maybe the tiled hall was just the inside of the fridge, expanded by a mind that had nothing else to work with. Maybe the key was the jar of pickles.

  I close the file on the screen. I mark the discrepancy as resolved. I lie to the log.

  At lunch, I sit in the park across the street. It is a bright day. People are eating sandwiches on the grass. I watch a woman reading a book. She turns a page. She is present for the turning of the page. She feels the paper. She sees the text.

  If I had been asleep when I turned that page, would I know?

  I take out my journal. I keep it in my bag, though I told myself I would only write at home. I open to a fresh page. I want to write down the file incident. I want to create a record of the day to verify the night. But the pen hovers. If I write *I opened Box 402*, am I recording an event or creating a memory? If I write it, it becomes part of the narrative of my life. Ten years from now, I will read this and know that I opened Box 402. I will not know if I experienced it.

  I close the journal. I eat my sandwich. It tastes like bread and turkey. I am chewing. I am swallowing. These are actions I am performing now. I am certain of them because I am doing them. But how much of this certainty is just the immediacy of the sensation?

  When I get home, Elena is in the living room. She is folding laundry. The pile of shirts is neat, stacked by color.

  "Did you know I pulled a file yesterday?" I ask.

  "You tell me," she says. She smooths a wrinkle out of a blue shirt.

  "The log says I did."

  "Then you did."

  "I don't remember it."

  She stops folding. She looks at me, and for a moment, I see the fatigue she hides so well. "Does it matter?"

  "It matters if I don't know what I did," I say. "It matters if I can't tell the difference between doing something and dreaming I did it."

  "You're talking in circles," she says. "You're awake now. That's what matters."

  "Is it?"

  She picks up the next shirt. A grey one. "Last night, you said something else. After the fridge."

  I freeze. "What?"

  "You came back to bed. You lay down. Then you said, 'It's not where I left it.'"

  I stare at her. The phrase hangs in the air. *It's not where I left it.*

  In my journal, I wrote about looking for a key. In the kitchen, she says I looked at pickles. In bed, I said something was missing.

  "What wasn't where you left it?" I ask.

  "I don't know," she says. "You were asleep. You weren't talking to me."

  She folds the grey shirt and places it on the stack. The action is precise. Controlled. She knows where everything goes. The shirts are in piles. The pants are in drawers. The keys are on the hook by the door.

  "I'm going to write it down," I say.

  "Write what?"

  "The phrase. 'It's not where I left it.'"

  "Why?" she asks. "So you can read it in the morning and wonder if you said it?"

  "So I know I said it."

  "You just said I said it," she corrects. "I heard it."

  "But I need to know," I say. "I need to have my own record."

  She stops folding. She looks at the stack of clothes, then at me. "You think if you write it down, it becomes real. But you're the one writing it. You're the one who was asleep."

  "I was awake when I wrote the journal," I say.

  "Were you?" she asks.

  It is not a philosophical question. She asks it the way she asks *Did you lock the door?* or *Did you pay the bill?* She is asking about the reliability of the witness.

  I go to the bedroom. The journal is on the nightstand, exactly where I left it. The lamp is off. I sit on the edge of the bed. I pick up the pen.

  I look at the entry from this morning. *A large hall with tiled floors. I was looking for a key.*

  I look at the blank space below it. I could write: *Elena says I stood at the fridge. Elena says I said "It's not where I left it."*

  If I write it, it becomes part of the dream. It becomes part of the story of the night. It joins the tiled hall. They will sit together on the page, equal in weight. The fridge and the hall. The pickles and the key. The witness and the dreamer.

  I put the pen down.

  I turn off the lamp. The room goes dark. I lie down. I pull the covers up. I close my eyes.

  I will wake up in eight hours. I will reach for the pen. I will have a sense of something having happened. I will have a memory of a place I did not go. Elena will have a report of a thing I did not do. We will eat breakfast. We will talk about the day. We will not solve it.

  In the dark, I wait for the sleep to take me. I do not know if I am waiting to experience something, or waiting to wake up and invent it. I lie still. I listen to the house settling. I listen to Elena moving in the living room. I am here now. I am certain of this.

  But the certainty feels thin, like a sheet of paper held up to the light. I can see through it to the other side.

  I close my eyes. I do not write anything down. I let the night happen, or not happen, without record. I let the morning decide what I did.
