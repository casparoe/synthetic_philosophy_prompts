          3.  Is there evidence of specific intent? (Medals for killing vs. Service medals)
      *   Decision on Rule: **Replace.** The conscript/volunteer line is a proxy for intent, but it's an imperfect one. We should adopt a "Rebuttable Presumption of Eligibility for Conscripts" but investigate Volunteers on a case-by-case basis.

  8.  **Final Polish:**
