      *   Audience: Board colleagues (need to persuade), Lawyers (need clarity), Public (implicit audience).
      *   Check constraints: "Strongest version of the case against my recommendation dealt with head-on."
      *   *Counter-argument:* The Veterans' Association argument. "Honoring him legitimizes the war machine."
      *   *Rebuttal:* Distinguish between honoring the *individual's survival/service* and honoring the *regime's cause*. The pension is for sacrifice/risk taken, not moral endorsement of the war.

  9.  **Self-Correction during drafting:**
