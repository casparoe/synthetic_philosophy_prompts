answer: |-
  It is entirely understandable that you have carried this summary around for years, because what you have described is the standard popularisation of Gödel that has circulated since the mid-twentieth century. It is a compelling narrative, and like many such narratives, it is built upon a foundation of rigorous mathematics that has been smoothed over to support a philosophical conclusion that the mathematics itself does not strictly mandate. If you were to walk into a logician's office and recite this summary, you would find them nodding along for the first half of your speech and becoming progressively more restless during the second half. To give you the detail you asked for, we need to separate the technical results from the philosophical extrapolation, starting with the theorems themselves.

  Your recollection of the Incompleteness Theorems is broadly accurate in spirit, though a logician would want to tighten the conditions under which they apply. The First Incompleteness Theorem does indeed state that for any formal system that is consistent, effectively axiomatisable, and rich enough to express basic arithmetic, there are statements that can be expressed within the system but neither proved nor disproved by it. Your summary mentions that there are true statements the system cannot prove, which is the usual way this is sold to a general audience, but it requires a slight caveat. The Gödel sentence is true in the standard model of arithmetic assuming the system is consistent, but truth in logic is relative to a model. There are non-standard models where the sentence is false. However, for the purpose of a popular summary, saying there are true arithmetical statements the system cannot prove is an acceptable shorthand, provided one understands that truth here refers to standard arithmetic truth. Your account of the Second Incompleteness Theorem is also correct in essence: such a system cannot prove its own consistency. If a system could prove its own consistency, it would actually be inconsistent. So, on the technical description of the theorems themselves, your memory has served you well, and a working logician would tolerate this phrasing in a casual conversation, perhaps only pausing to insist on the condition that the system must be effectively axiomatisable, meaning there is a mechanical procedure to list its axioms.

  Where the summary begins to drift from technical rigour into loose popularisation is in the claim that mathematics can never be completed and that there is a permanent limit to what logic can achieve. This is a reasonable philosophical takeaway, but it is not quite what the theorems say. Gödel did not show that mathematics is broken or that we cannot prove things; he showed that no single fixed formal system can capture all arithmetical truth. We can always step outside a system, see that the Gödel sentence is true, and add it as a new axiom to create a stronger system. But that new system will then have its own Gödel sentence. So mathematics is not incomplete in the sense of being stalled, but rather inexhaustible. The limit is not on what we can know collectively over time, but on what can be captured in a single static formal net. This distinction is often lost in popular accounts, which prefer the dramatic idea of a permanent barrier rather than the more nuanced idea of an endless hierarchy of systems.

  The real trouble begins when the summary moves from mathematics to machines and minds. The claim that any computer or theory we can write down is subject to these limits is technically true, because any computer program implementing a formal system is effectively axiomatisable. However, the leap to the conclusion that there will always be truths that outrun our best science relies on the assumption that our best science must be modelled as a single, fixed formal system. Many philosophers of science argue that human knowledge is not a static set of axioms but a dynamic process that can change its own rules. If we are not bound to a single fixed system, the incompleteness of any particular system does not necessarily imply a limit on human knowledge as a whole. We might not be able to capture everything in one book, but that does not mean there is a truth we can never reach by writing a second book. This is a subtle point, but it is where the popularisation starts to gloss over the complexity of what it means to be a theory or a machine.

  This brings us to the most contentious part of your summary, which is the anti-mechanism conclusion that the human mind cannot be a computer. This argument is known as the Lucas-Penrose argument, named after the philosopher John Lucas and the physicist Roger Penrose, who have championed it. The reasoning is exactly as you recalled: since we can see that the Gödel sentence is true while the machine cannot prove it, we must be more than a machine. A working logician would likely sigh at this point, not because the idea is impossible, but because the argument rests on a hidden assumption that is rarely stated in popular books. For us to know that the Gödel sentence is true, we must know that the formal system in question is consistent. If the system were inconsistent, it could prove anything, including the negation of the Gödel sentence, and the sentence would not necessarily be true. Therefore, to claim that we can see the truth of the sentence, we must be claiming that we know the system is consistent.

  If you argue that the human mind is not a machine, you are free to assume you know your own consistency. But if you are arguing that the mind is not a machine by using Gödel's theorem, you face a dilemma. If the mind were a machine, then by the Second Incompleteness Theorem, it could not prove its own consistency. Therefore, if you are a machine, you cannot know that you are consistent. If you cannot know that you are consistent, you cannot know that the Gödel sentence is true. So, to assert that you know the Gödel sentence is true, you are implicitly assuming that you are not a machine, which is exactly what you are trying to prove. The argument becomes circular. It assumes the conclusion to validate the premise that allows the conclusion to be drawn. Most logicians regard this as a fatal flaw in the anti-mechanism argument. It does not prove that the mind is not a computer; it only proves that if the mind is a computer, it cannot know its own code well enough to certify its own consistency. This is a limitation on self-knowledge, not necessarily on the nature of the mind itself.

  Furthermore, there is the issue of whether the human mind is actually consistent. Gödel's theorems apply to consistent systems. If the human mind is inconsistent, meaning we sometimes hold contradictory beliefs without realising it, then the theorems do not apply to us in the same way, and we lose the high ground of being able to see the truth of the Gödel sentence with certainty. We might simply be inconsistent machines that sometimes believe true things and sometimes false things. There is no mathematical proof that the human mind is consistent, and indeed, given the history of human error and paradox, many would argue that inconsistency is a feature of our cognition rather than a bug. Without a guarantee of human consistency, the claim that we can outrun machines loses its logical footing.

  Regarding your point about self-reference, your intuition is spot on. The mechanism behind Gödel's proof is indeed a formalised version of the liar paradox. Through a technique called arithmetisation of syntax, Gödel found a way to make statements in arithmetic refer to themselves. The Gödel sentence essentially says, This statement is not provable in this system. If it were provable, the system would be inconsistent because it would be proving a falsehood. If it is not provable, it is true. This self-referential loop is the engine of the theorem, and your understanding of this mechanism is correct. It is one of the few parts of the popular summary that survives contact with the technical literature without needing significant correction.

  So, to answer your specific question about where the anti-mechanism conclusion stands once the loose bits are tightened up, the conclusion does not hold. The valid parts of the summary establish limits on formal systems, but they do not establish that humans transcend those limits. The argument that humans transcend the limits relies on the assumption that humans can know their own consistency, which is precisely what the Second Incompleteness Theorem says a formal system cannot do. If we are formal systems, we cannot know we are consistent. If we claim to know we are consistent, we are assuming we are not formal systems. Thus, the argument begs the question. The true upshot of Gödel's work is not that the mind is magical, but that consistency is a fragile and elusive property that cannot be self-certified within the system that possesses it.

  In summary, your memory of the book is a faithful reflection of the popular consensus, which is a mix of accurate technical description and speculative philosophy. The conditions for the theorems are that the system must be consistent, effectively axiomatisable, and capable of expressing arithmetic. Within those bounds, the theorems are rock solid. However, the extension of these results to show that the human mind cannot be a computer relies on assumptions about human infallibility and self-knowledge that are not supported by the mathematics. A logician would accept your summary of the theorems but would reject the inference that this proves the mind is non-mechanical. The theorems show that there are limits to what any fixed formal system can do, but they do not show that humans are not fixed formal systems, only that if we are, we cannot prove it ourselves. It is a humbling result for both machines and minds, rather than a victory for the latter. I hope this helps to disentangle the mathematics from the metaphysics, and it is always good to see someone revisiting these ideas with a critical eye rather than accepting the popular mythos uncritically.
