prompt: |-
  Some years ago I read a popular science book about Godel and I've been carrying its summary around in my head ever since without ever checking it against anyone who actually knows the material. Here's roughly what it said, as best I remember. Godel's incompleteness theorems show that in any formal system rich enough to describe arithmetic there are true statements the system cannot prove, and that such a system can never prove its own consistency. The upshot is that mathematics can never be completed — there is a permanent limit to what logic can achieve. And since any computer, and by extension any theory we can write down precisely enough to count as a formal system, is just such a thing, there will always be truths that outrun our best machines and our best science. That is why Godel gets invoked so often to show that the human mind cannot be a computer: we can see that the undecidable sentence is true even though the machine cannot prove it. The whole business rests on self-reference, the same trick that lies behind the liar paradox — the sentence more or less says of itself that it is not provable.

  I have a feeling this is a mix of real results, loose popularisation and outright error, but I can't tell which is which, and I don't want to just default to the sceptical line either. Could you go through it claim by claim and tell me which parts a working logician would nod along to, which are the sort of thing they'd tolerate with a sigh in a popular book, and which are simply not true? I'm especially interested in where the anti-mechanism conclusion stands once the loose bits are tightened up — does anything true in the summary actually support it, or does the conclusion lean on the parts that need fixing? And if the summary gets the conditions wrong under which the theorems apply, say what those conditions actually are.

  Please answer in British English, and in continuous prose — no headings, no bullet points, no bold, no tables. Just write it out the way you'd explain it in a long email.
