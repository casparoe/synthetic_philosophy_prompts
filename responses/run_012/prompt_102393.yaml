      *   *Killer Constraint:* Likely the "Normative Discovery" or the "Phenomenological Ownership." Many narrative theories (especially strong constructionist ones) fail because they make the self *too* malleable, failing to explain why we feel bound by the truth of our past. Or, they fail to explain depersonalization (why does the narrative stop feeling like mine?). Let's pick the **Phenomenological Ownership (Alienation)** constraint as the killer, because purely functionalist narrative theories often struggle to explain *qualitative* feelings of mineness without smuggling in a homunculus.

