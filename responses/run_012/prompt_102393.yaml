          *   Motivating Case: Legal responsibility despite narrative fluidity.
          *   Draft Name: The Accountability Constraint.

  4.  **Refining and Polishing the Desiderata (incorporating specific prompt requests):**

      *   *Refining Ownership:* Make sure to highlight the difference between a coherent story and an *owned* story.
      *   *Refining Revision:* Emphasize the "discovery" aspect.
      *   *Refining Institutional:* Focus on the transition from imposed to endorsed.
      *   *Refining Boundaries:* Group the specific cases (depersonalization, dementia, etc.) under a robust requirement about limits.

  5.  **Identifying Conflicts and the "Killer Constraint":**
      *   *Conflict:* The "Normative Discovery" (it feels like truth) vs. "Centre of Gravity" (it's a fiction/abstraction). If the self is *just* a narrative construct, why does it feel constrained by facts?
