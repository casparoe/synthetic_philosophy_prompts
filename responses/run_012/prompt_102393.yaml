answer: |-
  # Framework for Evaluating Narrative Gravity Theories of the Self

  The following specification outlines the necessary conditions for any theory positing the self as a "centre of narrative gravity." These desiderata are not a checklist of features a theory *might* have, but constraints it *must* satisfy to remain viable against phenomenological, social, and pathological data. The focus is on the explanatory power of the narrative model when confronted with edge cases and structural distinctions.

  ## I. Phenomenological Desiderata

  ### 1. The Alienation Constraint (Coherence vs. Ownership)
  **Requirement:** The theory must distinguish between the structural coherence of a life-story and the phenomenological sense of *mineness* (ownership). It must explain how a narrative can be logically consistent and biographically accurate while simultaneously being experienced as alien or "not me."
  **Motivating Consideration:** In pathologies like depersonalization or Schneiderian first-rank symptoms (e.g., thought insertion), the subject acknowledges the content of the experience or memory as belonging to their history but denies the *agency* or *ownership* of it. A theory that equates selfhood solely with narrative continuity fails here, as the continuity exists without the self-feeling. The framework must account for the "gap" where the story holds together, but the gravity centre has shifted or dissolved.

  ### 2. The Normative Friction Constraint (Discovery vs. Invention)
  **Requirement:** The theory must explain why narrative revision often feels constrained by truth rather than free creative choice. It must account for the phenomenology of *discovery* (uncovering who one "really" was) distinct from *invention* (deciding who one will be).
  **Motivating Consideration:** In therapeutic or introspective contexts, individuals often revise their self-narrative (e.g., recognizing a past relationship was abusive rather than romantic). This revision feels like correcting an error, not writing fiction. If the self is merely a "centre of gravity" generated by storytelling, the theory risks making all revision arbitrary. An adequate theory must explain the "friction" against which the narrative rubs—the sense that some stories are *false* even if they are coherent.

  ### 3. The Diachronic Stability Constraint
  **Requirement:** The theory must explain how the self persists through radical narrative disruption without positing a hidden, non-narrative substrate.
  **Motivating Consideration:** People survive profound conversions, trauma, or ideological shifts where the *content* of their narrative changes completely (e.g., a religious conversion or political radicalization). Despite the discontinuity in the story told, there is a legal and phenomenological continuity of the person. The theory must locate the "gravity" in something more robust than the specific plot points, without secretly relying on a Cartesian ego to hold the threads.

  ## II. Social and Institutional Desiderata

  ### 4. The Internalization Constraint (Imposition vs. Endorsement)
  **Requirement:** The theory must provide a mechanism for how external, institutional narratives (clinical, legal, carceral) transition from being imposed labels to internally endorsed self-conceptions. It must specify the conditions under which an alien narrative becomes "mine."
  **Motivating Consideration:** Consider a patient diagnosed with a personality disorder or a prisoner processed through the penal system. Initially, the narrative ("you are borderline," "you are a criminal") is external and coercive. Over time, the subject may speak using this vocabulary, adopting the institutional story as their own. A viable theory cannot treat this merely as "brainwashing"; it must explain the structural affinity between the external categorization and the internal narrative gravity that allows the handover to occur.

  ### 5. The Interpersonal Accountability Constraint
  **Requirement:** The theory must preserve the possibility of moral and legal responsibility despite the fluidity of narrative construction.
  **Motivating Consideration:** If the self is a fictional locus created by storytelling, it risks becoming too ephemeral to bear blame. However, in legal contexts, we hold persons responsible for actions that may no longer fit their current self-narrative (e.g., "I was a different person ten years ago"). The theory must explain why the "centre of gravity" extends far enough backward to anchor responsibility, even when the current narrative disowns the past actor.

  ## III. Boundary and Limit Desiderata

  ### 6. The Pathology Boundary Constraint
  **Requirement:** The theory must delineate the self not by its presence, but by its specific modes of failure. It must offer distinct explanations for dissociation, confabulation, and dementia that do not collapse into one another.
  **Motivating Consideration:**
  *   **Dissociation:** Implies multiple, non-communicating narrative centres within one organism.
  *   **Confabulation:** Implies a desperate maintenance of narrative coherence at the expense of truth (violating Normative Friction).
  *   **Dementia:** Implies the erosion of the gravity centre itself, not just the loss of data.
  A theory that treats all these as simple "narrative breakdown" is insufficient; it must distinguish between a *split* gravity centre, a *fabricated* one, and a *dissolving* one.

  ### 7. The Pre-Narrative and Non-Human Constraint
  **Requirement:** The theory must account for the selfhood of entities that cannot generate linguistic narratives (pre-linguistic infants, non-human animals) without excluding them from moral consideration or selfhood entirely.
  **Motivating Consideration:** Infants display agency, preference, and distress at violation of expectation prior to language acquisition. Similarly, higher mammals exhibit planning and social recognition. If "narrative gravity" requires linguistic articulation, the theory renders infant and animal selfhood illusory. An adequate theory must either posit a proto-narrative structure (embodied, non-linguistic) or explain why the lack of narrative does not negate the presence of a self in these boundary cases.

  ## IV. Structural Tensions and The Killer Constraint

  ### Conflicting Desiderata
  There is a significant tension between **The Normative Friction Constraint (2)** and the core metaphor of **Narrative Gravity**.
  *   **The Conflict:** The "Gravity" metaphor suggests the self is an abstract object, a fiction useful for organizing data (anti-realism). However, the "Discovery" phenomenology suggests the self is something found, with truth-conditions independent of the telling (realism).
  *   **The Risk:** To satisfy Normative Friction, the theory risks smuggling in a "real" self that the narrative describes (collapsing into realism). To satisfy the Gravity metaphor, the theory risks making self-knowledge purely creative (collapsing into radical constructivism). Satisfying both requires a nuanced account of how a fiction can have truth-conditions.

  There is also tension between **The Internalization Constraint (4)** and **The Alienation Constraint (1)**.
  *   **The Conflict:** If external narratives can be fully internalized (becoming "mine"), what prevents any imposed story from becoming authentic? Conversely, if I can experience my own coherent history as alien (Alienation), what guarantees that an internalized institutional story isn't just a form of pathology? The theory must distinguish between *healthy adoption* of social roles and *alienated submission* to them, without relying on a pre-social "true self" to make the distinction.

  ### The Killer Constraint
  **The Alienation Constraint (1)** is the single requirement that rules out the most otherwise attractive theories.

  **Reasoning:** Many narrative theories are intellectually elegant because they reduce the self to a function of storytelling coherence. They argue that "you are the story you tell." This is parsimonious and handles social construction well. However, it fails catastrophically at the point of **depersonalization** and **alienation**.
  *   If the self *just is* the coherent narrative, then whenever a coherent narrative exists, the self should feel present.
  *   But in depersonalization, the narrative remains (the subject can describe their life), yet the "self" feels absent or alien.
  *   To explain this, a theory must posit a layer of *phenomenological ownership* that is distinct from *narrative content*.
  *   Most "strong" narrative theories cannot do this without admitting that the narrative is not the whole story—that there is a pre-narrative sense of "mineness" that the narrative rides upon. Admitting this often undermines the claim that the self is *exhaustively* a centre of narrative gravity. Therefore, this constraint forces the theory to either become more complex (hybridizing with phenomenological accounts) or accept that it cannot explain the very experiences that make the concept of "self" urgent in the first place.
