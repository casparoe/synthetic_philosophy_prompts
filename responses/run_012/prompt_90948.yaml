  **Note on Form and Theory**

  **Liberties Taken:**
  A strict pantoum requires the second and fourth lines of a stanza to become the first and third lines of the next, respectively (Line 2 → Line 1; Line 4 → Line 3). In the second stanza above, I swapped this order (Line 4 → Line 1; Line 2 → Line 3). This was necessary to satisfy your constraint that the "ranking visibly inverts." By moving the "immediate self" option from the fourth position (subordinate) in Stanza 1 to the first position (primary) in Stanza 2, the form enacts the preference shift without altering the text of the options themselves.

  **Settled vs. Contested:**
  1.  **Time Inconsistency (Stanzas 1–3):** The phenomenon where preferences change solely due to proximity to the event (hyperbolic discounting) is empirically settled in behavioral economics and psychology. The poem treats this accurately: at each distinct moment (month out, week out, morning of), the preference is consistent *for that moment*. There is no contradiction within the time-slice, only between them.
  2.  **Akrasia (Stanzas 4–5):** Whether "weakness of will" is genuinely possible is philosophically contested. Socrates argued it was impossible (no one errs willingly); Davidson argued it is possible to act against one's own "all-things-considered" judgment. The poem leans on the Davidsonian view—that the agent *knows* the judgment is true ("He reads the note and knows...") but acts against it anyway.
  3.  **The Conflation (Stanza 6):** Whether these two phenomena are distinct or merely different descriptions of the same underlying mechanism is load-bearing and unresolved. Economists often reduce akrasia to time inconsistency (you didn't *really* prefer the long-term goal at the moment of action). Philosophers often distinguish them (one is a change of mind, the other is a failure of agency). The poem ends by cycling back to the start, suggesting they may be phases of a single loop, but refuses to confirm if the loop is one thing or two.
