answer: |-
  # Q&A Prep Sheet: Death in Damascus & The Limits of CDT

  **Strategy:** Your thesis is not that CDT gives the *wrong* answer (death), but that it fails to provide a *unique deliberative equilibrium* (the continuum problem). Your goal is to shift the burden from "fixing the decision rule" to "integrating epistemology." Do not get dragged into defending EDT. Do not get dragged into defending the coherence of the scenario (concede it's idealized).

  **Upfront Concessions (State these in your opening or first reply):**
  1.  **Concede the Outcome:** CDT correctly identifies that you die regardless of what you do. You are not arguing CDT gets the *utility* wrong.
  2.  **Concede EDT's Performance:** EDT handles the correlation naturally. You are not arguing EDT is false.
  3.  **Limit the Scope:** You are arguing that DiD reveals a structural incompleteness in *causal* accounts of deliberation, not that CDT is useless for garden-variety decisions.

  ---

  ### 1. The "Common Cause" Defense (CDT / Causal Graphs)
  **Likelihood:** High | **Damage:** High
  **Who:** The Causal Graph person.
  **Objection:** "You're modeling the prediction as dependent on the choice. In a proper causal graph, the Prediction and the Choice share a Common Cause (your psychological state). If I intervene on Choice ($do(Choice)$), I sever the link to Prediction. The prediction stays fixed based on the common cause. CDT handles this via screening off. There's no fixed-point problem, just a standard common-cause structure."

  **Reply (2 mins):**
  "If there's a common cause that screens off the correlation, then Death isn't predicting your *choice*, he's predicting your *type*. But the story says he predicts where you will *go*. If the graph screens off the correlation upon intervention, then the prediction is no longer about the act you are currently deliberating about, but about a prior state. That changes the problem from 'Death in Damascus' to 'Medical Newcomb.' My argument is about cases where the agent understands that their *deliberation itself* is the evidence Death used. If you screen it off, you've dissolved the specific epistemic loop I'm highlighting. The fixed point arises because the agent knows their choice *is* the prediction source, not just a correlated effect."

  **Soft Spot:** You are assuming the agent's access to their own choice is part of the causal structure. If they insist the graph must be acyclic, they will claim your scenario is ill-formed.
  **Note:** This contradicts the Counterfactual CDT person (see #2).

  ### 2. The "Hold the Past Fixed" Objection (CDT / Counterfactuals)
  **Likelihood:** High | **Damage:** Med
  **Who:** The Counterfactual CDT person.
  **Objection:** "CDT tells us to hold the past fixed. Death has already made his prediction. In the nearest world where you go to Aleppo, Death is already in Aleppo. You die. In the nearest world where you stay, Death is in Damascus. You die. CDT says you're indifferent. That's a unique recommendation: Indifference. Why do you need a mixed strategy to call that a solution?"

  **Reply (2 mins):**
  "Indifference between two losing acts isn't deliberative stability. If I'm indifferent, I might assign probability 0.5 to each. But if I assign 0.5, Death (who predicts my probabilities) might adjust. The 'continuum' problem is that *any* probability distribution I pick is consistent with CDT's indifference, but CDT gives me no rule for *which* distribution to pick. If my self-prediction is part of the causal input for Death, I need to know what I'm going to do to evaluate the acts. CDT says 'evaluate acts assuming you do them,' but if doing them changes the prediction, I can't evaluate them without already knowing what I'll do. That's the fixed point. CDT gives you a line of solutions; it doesn't tell you where to stand on it."

  **Soft Spot:** If they insist CDT only outputs a ranking of atomic acts, not probabilities, you look like you're demanding CDT do something it never promised.
  **Note:** **Contradiction Alert:** The Graph person (#1) says the intervention breaks the link; the Counterfactual person (#2) says the link holds fixed. They cannot both be right about the formalism. If they both speak, point out that one treats the prediction as fragile to intervention, the other as robust. You win either way: either the setup is impossible (Graph) or CDT is incomplete (Counterfactual).

  ### 3. The "Equilibrium, Not Decision" Objection (Game Theorist)
  **Likelihood:** Med | **Damage:** High
  **Who:** The Game Theorist.
  **Objection:** "You've just described a self-confirming equilibrium. The agent is playing against Nature. If every mix is a Nash equilibrium, then the problem is equilibrium selection, not decision theory. You're trying to solve a game-theoretic coordination problem with a single-agent choice rule. That's a category error."

  **Reply (2 mins):**
  "I agree it's an equilibrium problem. But standard decision theory is supposed to tell a single agent how to act when the 'other player' is a fixed function of their own output. If decision theory can't solve single-agent fixed-point problems without importing game-theoretic equilibrium selection criteria, then decision theory isn't self-contained. My claim is that the 'missing ingredient' you mention—equilibrium selection—is actually an epistemic constraint on self-knowledge. We need to know *why* an agent settles on one mix over another. That's not game theory; that's a theory of how beliefs become knowledge."

  **Soft Spot:** They might argue that "epistemology" is just payoff-dominance or risk-dominance in disguise. Be ready to distinguish normative epistemology from heuristic selection.

  ### 4. The "Guidance is Sufficient" Objection (General CDT)
  **Likelihood:** High | **Damage:** Med
  **Who:** Any CDT proponent.
  **Objection:** "So CDT says you're doomed and indifferent. It tells you not to waste money trying to buy a map. It gives all the practical guidance available. Why is 'picking a specific mix' a requirement for a decision theory? Sometimes the world just offers no good options."

  **Reply (2 mins):**
  "If the only guidance is 'you're doomed,' then CDT is just a mortality calculator, not a guide to choice. But the deeper issue is instability. If I decide to go to Aleppo, I have reason to think I'll die, so I should switch to Damascus. If I switch, I should switch back. CDT leaves me oscillating. A mixed strategy stops the oscillation, but CDT doesn't tell me *which* mix stops it. If a theory of choice leaves me oscillating or arbitrarily picking a number between 0 and 1 with no criterion, it hasn't fully guided action. It's left the crucial step—commitment—unexplained."

  **Soft Spot:** Some CDTers are happy with "rational oscillation" or "arbitrary tie-breaking." You need to press that arbitrary tie-breaking is an *external* addition, not part of CDT.

  ### 5. The "Ratifiability Already Solves This" Objection (Ratifiability Defender)
  **Likelihood:** Med | **Damage:** Med
  **Who:** A CDT proponent familiar with Gibbard/Harper.
  **Objection:** "This is exactly why we have ratifiability. You only choose an act if, conditional on choosing it, it maximizes utility. In Damascus, no pure act is ratifiable. The only ratifiable options are the mixed strategies. Problem solved."

  **Reply (2 mins):**
  "Ratifiability identifies the *set* of acceptable options—the continuum of mixes. It does not select *one*. If I ask you 'What should I do?', and you say 'Any probability distribution over Aleppo and Damascus is ratifiable,' you haven't told me what to do. You've given me a menu where every item is equally recommended. Ratifiability filters, it doesn't pick. My thesis is that the picking mechanism requires a theory of self-knowledge: how do I come to know I will play $p=0.3$ rather than $p=0.7$? Ratifiability is silent on that."

  **Soft Spot:** If they argue that "rational permission" is all we can ask for, you have to argue that decision theory aims for "rational requirement" in solvable cases.

  ### 6. The "EDT Vindication" Objection (EDT Proponent)
  **Likelihood:** High | **Damage:** Low
  **Who:** The Evidentialist.
  **Objection:** "This is just another Newcomb problem. EDT conditions on the act. If I condition on going to Aleppo, I know Death is there. If I condition on Damascus, Death is there. EDT says I'm indifferent. It handles the correlation without needing fancy fixed-point epistemology. Isn't this just a win for EDT?"

  **Reply (2 mins):**
  "EDT gets the indifference right, but it gets the *reason* wrong. EDT says your act is *evidence* of Death's location. But in this case, your act (or intention) is the *cause* of Death's location (via the prediction). EDT treats it as a statistical correlation; I'm arguing it's a logical/epistemic loop. EDT works here by accident because the utilities align, but it fails in other cases where causal structure matters (like standard medical Newcomb). I'm not asking you to switch to EDT; I'm asking CDT to account for the self-referential knowledge that EDT stumbles into correctly."

  **Soft Spot:** Don't let them drag you into defending EDT on other cases. Keep the focus on the *structure* of the DiD problem.

  ### 7. The "Incoherent Scenario" Objection (Metaphysical)
  **Likelihood:** Med | **Damage:** Med
  **Who:** Skeptical CDTer.
  **Objection:** "A perfect predictor of a libertarian free choice is metaphysically impossible. If you can choose otherwise, he can't predict it. If he predicts it, you can't choose otherwise. You're building a paradox and blaming decision theory. If we assume determinism, CDT works fine. If we assume free will, the scenario is impossible."

  **Reply (2 mins):**
  "I'm not relying on libertarian free will. I'm relying on the agent's *uncertainty* about their own choice during deliberation. Even in a deterministic world, I don't know what I'll do until I do it. Death knows. The problem is how I deliberate given that he knows. If you say the scenario is impossible, you're saying single-agent decision problems with predictors are impossible. That concedes my point: CDT cannot handle environments where other agents (or forces) have better epistemic access to your decision process than you do."

  **Soft Spot:** If they press hard on determinism, you might have to concede that CDT is only for agents who believe they have causal power.

  ### 8. The "Hope Nobody Asks" Question (The Dissolution)
  **Likelihood:** Low | **Damage:** Catastrophic
  **Who:** The sharpest person in the room (could be anyone).
  **Objection:** "You say the missing ingredient is a theory of self-knowledge. But if decision theory depends on epistemology to function, haven't you just dissolved decision theory? Isn't the whole point of a normative theory of choice that it tells you what to do *given* your beliefs? If you need a theory to tell you what your beliefs *should* be about your own choice, aren't you just doing epistemology?"

  **Reply (2 mins):**
  "Decision theory traditionally takes beliefs and desires as inputs. But in reflexive cases, the 'belief about my choice' isn't an independent input; it's an output of the deliberation. If the theory can't close that loop, it's incomplete. I'm not dissolving decision theory; I'm arguing that the 'belief input' for self-locating choices isn't exogenous. We need a unified account of how we form beliefs about our own agency. That's not just epistemology; it's the foundation of agency itself. Decision theory can't stand alone if it can't account for the agent's knowledge of their own decision."

  **Soft Spot:** This is the hardest hit. If you concede too much, you've argued decision theory doesn't exist. If you concede too little, you look like you're ignoring the dependency. Walk the line: "Decision theory needs epistemic norms for self-prediction to function, just as it needs probability axioms."

  ---

  **Final Tip:** The two CDT camps will trip over each other. The Graph person says the link is breakable; the Counterfactual person says the link is fixed. If they argue with each other, let them. Your position is that *either* way, CDT fails to give a unique selection criterion for the mixed strategy. Stay on the "Continuum of Solutions" point. That is your strongest ground.
