answer: |-
  This is a verbal dispute regarding the application of the term 'cause' that conceals a substantive disagreement about ontological parsimony and the status of supervenient properties. Your hypothesis correctly identifies that the two factions are operating with different standards for causal work—one requiring physical production (energy transfer or force) and the other requiring difference-making (counterfactual dependence or explanatory power)—but it is mistaken in suggesting that making this explicit shrinks the disagreement to a mere semantic choice about the word 'cause'. The impasse persists because the definition of 'cause' is inextricably linked to each side's metaphysical commitment regarding what exists; the reductionist faction equates reality with fundamentality, believing that if the simmballs are not physically distinct from the substrate, they are not entities capable of acting, while the non-reductionist faction equates reality with stability and pattern, believing that organizational structure constitutes a genuine ontological layer. Consequently, when the reductionist says the simmballs do no causal work, they mean the simmballs add no physical energy to the system, whereas when the non-reductionist says the simmballs do causal work, they mean the substrate's behavior is unintelligible without referencing the constraints imposed by the simmball configuration.

  The disagreement hardens because each side views the other's standard as category-error inducing rather than merely alternative. The reductionist sees the non-reductionist as positing ghostly forces that violate causal closure, while the non-reductionist sees the reductionist as committing the mereological fallacy, mistaking the parts for the whole and ignoring that the specific arrangement of parts is what dictates the system's trajectory. Appeals to exclusion fail because the non-reductionist denies the premise that causation is a conserved quantity that can be "used up" by the substrate, and appeals to real patterns fail because the reductionist denies that predictive utility implies ontological independence. They are answering different questions under a single heading: one asks "What physical force produces this motion?" and the other asks "What structure explains this behavior?", but both insist their answer captures the true nature of causation.

  No movement should be expected unless the group abandons the search for a single privileged ontology of causation and adopts a pragmatic pluralism. The debate would dissolve if both sides accepted that 'cause' is interest-relative: productive force is the correct standard for engineering the substrate, while difference-making is the correct standard for interpreting the system's logic or psychology. Without this shift, or a formal result demonstrating that higher-level patterns can exert downward constraint without violating physical conservation laws (which both sides already accept physically but disagree on metaphysically), the stalemate is permanent. The real locus of disagreement is not the physics, nor strictly the definition of cause, but the threshold for ontological commitment; until one side concedes that reality can be layered without being duplicated, they will continue to talk past one another.
