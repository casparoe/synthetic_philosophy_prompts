      *   *Expected Value:* $EV = \sum P_i U_i$. If $P(death) = 0$, the negative utility of death drops out.
      *   *Problem:* What about the "Quantum Russian Roulette" paradox? If I keep playing, I end up in a branch where I am incredibly lucky but everyone else is dead.
