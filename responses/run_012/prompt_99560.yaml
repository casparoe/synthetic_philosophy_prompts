  10. (Self-Correction on "Quantum Maiming"): I need to ensure I don't conflate QI with "everything goes well." QI says "you don't experience death." It does *not* say "you experience the best outcome." It says "you experience the subset of outcomes where you exist." If the only existing outcomes where you exist are painful, you anticipate pain. This is the "Quantum Maiming" or "Quantum Torture" counter-argument to QI optimism. I must include this to show depth.

