answer: |-
  This is a precise and challenging stipulation. By fixing these three components—(1) Everettian ontology, (2) a permissive criterion of diachronic identity, and (3) a self-locating rule that conditions credence on survival—you are effectively isolating the normative core of the Quantum Immortality (QI) thesis from the broader debates regarding the derivation of the Born Rule in Everettian Decision Theory (EDT).

  Standard EDT (e.g., Wallace, Greaves) argues that rational agents should weight branches by their squared-amplitude measure, even regarding life-and-death decisions. Your package explicitly rejects this for self-locating uncertainty regarding death. Below, I set out the implications of this specific package for practical deliberation, highlighting the tensions that arise between the components.

  ### 1. Catastrophic Risks: Self vs. Others

  The most immediate implication of your package is a radical asymmetry between risks borne by the agent and risks borne by others.

  **Personal Risk (The "Conditioning" Effect)**
  Under standard decision theory, a medical gamble with a 99% fatality rate and a 1% cure rate is weighed by the expected utility: $0.99 \times U(\text{death}) + 0.01 \times U(\text{cure})$.
  Under your **Component 3 (Self-Locating Rule)**, the agent assigns zero credence to branches where they do not survive. The probability space is effectively conditioned on survival. The calculation becomes $1.0 \times U(\text{cure} | \text{survival})$.
  *   **Implication:** The agent becomes radically risk-seeking regarding personal mortality. Any gamble where the *surviving* outcome has positive utility should theoretically be taken, regardless of how low the branch measure of that survival is. The "cost" of the high-measure death branches is normatively invisible to the agent.
  *   **Dependency:** This relies entirely on **Component 3**. If one reverts to standard EDT weighting (where measure dictates credence), the 99% fatality rate returns to the calculation.

  **The "Quantum Maiming" Qualification**
  However, **Component 2 (Continuity of Consciousness)** complicates this. If "survival" includes branches where the agent survives with severe cognitive degradation, chronic pain, or locked-in syndrome, these count as "me."
  *   **Implication:** The agent does not anticipate *blissful* immortality, but *guaranteed* existence. If the only branches where the agent survives the medical gamble involve severe suffering, the agent should anticipate severe suffering. The risk is not *cessation*, but *quality of persistence*.
  *   **Tension:** This creates a conflict between **Component 1** and **Component 3**. **Component 1** ensures that low-measure branches (e.g., surviving with severe brain damage due to oxygen deprivation) physically exist. **Component 3** forces the agent to anticipate them if they are the only survival branches. Thus, QI does not imply one should take all risks; it implies one should take all risks *where the surviving branches are preferable to the status quo*, ignoring the measure of those branches.

  **Risk to Others (The Solipsism Problem)**
  Your package applies the self-locating rule to *the agent's* consciousness. It does not grant immortality to others.
  *   **Implication:** In a policy decision involving a small probability of global catastrophe (e.g., a particle accelerator experiment), the agent reasons as follows: "In branches where the catastrophe occurs, I (or a successor) likely still exist in some form, or at least my death is not an outcome I anticipate experiencing."
  *   **Dependency:** This relies on **Component 3** being indexical to the *agent*.
  *   **Implication:** The agent becomes indifferent to low-probability, high-impact risks that kill *others*, provided the agent's own continuity is preserved in some branch. If the catastrophe kills everyone, **Component 2** dictates the agent ceases to exist in those branches. **Component 3** then says the agent assigns no weight to those branches.
  *   **Result:** The agent acts as if they are immune to existential risk. A policy with a 99.9% chance of killing everyone (including the agent) is deliberated as if the 0.1% survival branch is the *only* future. This leads to a form of decision-theoretic solipsism where the disvalue of others' deaths is drastically underweighted unless it instrumentally affects the surviving branches.

  ### 2. Risk Aversion and Preference Consistency

  This package fundamentally alters the structure of rational preference, potentially rendering ordinary self-interested risk aversion unintelligible and creating diachronic inconsistency.

  **The Collapse of Risk Aversion regarding Death**
  Ordinary risk aversion regarding life is grounded in the discontinuity of death. If **Component 3** holds, death is not a possible outcome in the agent's subjective sample space.
  *   **Implication:** Standard risk aversion parameters (e.g., in a utility function over wealth/life) cannot apply to mortality. The agent cannot be "averse" to a risk of death, only averse to the *conditions* of survival.
  *   **Dependency:** This depends on **Component 3**. If **Component 2** were tightened (e.g., requiring psychological continuity that is broken by near-death trauma), then many "survival" branches would count as death, restoring risk aversion. But given your fixed **Component 2**, mere biological persistence suffices for identity.

  **Preference Inconsistency (Pre- vs. Post-Branching)**
  Consider a "Quantum Russian Roulette" scenario.
  *   **Pre-Game:** The agent prefers not to play, acknowledging that in most branches (by measure) they die.
  *   **Under QI Package:** The agent knows they will subjectively experience *winning*.
  *   **Implication:** If the agent accepts the QI package, their preferences must shift. However, this creates a conflict with **Component 1 (Measure)**. If the agent cares about their "copies" (implied by **Component 2**'s claim that future selves are "genuinely me"), they should care about the *number* or *measure* of surviving selves.
  *   **Tension:** **Component 3** tells the agent to ignore the measure of survival branches. **Component 2** tells the agent that all surviving selves are "me." If I am genuinely identical to all my surviving successors, why should I not care that 99% of "me" (by measure) died?
  *   **Conclusion:** The package forces a non-consequentialist stance. A standard consequentialist sums utility across all outcomes weighted by probability (or measure). Your package requires summing utility only across *indexically accessible* outcomes. This is a form of **Indexical Consequentialism**. It renders the agent's preferences inconsistent with a "view from nowhere" utilitarianism. The agent acts to maximize the utility of the *surviving observer-moment*, regardless of how many observer-moments are extinguished in the process.

  ### 3. Decision-Theoretic Apparatus: Measure vs. Probability

  This is the most technically volatile area of your package. It severs the link between the physical ontology of QM and the epistemic norms of the agent.

  **The Decoupling of Measure and Credence**
  In standard Everettianism (e.g., Wallace), the Branching Indifference axiom and the Diachronic Consistency axiom are used to prove that rational agents must weight branches by squared amplitude (the Born Rule).
  *   **Your Package:** **Component 3** explicitly violates Branching Indifference regarding death. You are saying that even if the measure of survival is $10^{-100}$, the subjective credence is 1.
  *   **Implication:** The notion of a branch's measure loses its normative force for self-locating uncertainty involving death. Measure becomes a purely physical quantity with no direct decision-theoretic weight for the agent's own survival.
  *   **Dependency:** This creates a direct conflict with **Component 1**'s usual role in decision theory. If **Component 1** is held to imply that measure *ought* to guide rational expectation (as per the Born Rule), your package is incoherent. You are stipulating that **Component 3** overrides the normative implications of **Component 1**.

  **Expected Value and Truncated Distributions**
  Standard Expected Utility (EU) is $\sum P_i U_i$. Under your package, for any decision involving potential death, the probability distribution is truncated.
  *   **Implication:** $EU_{QI} = \sum_{i \in \text{Survival}} P'(i) U_i$, where $P'(i)$ is the renormalized probability over survival branches.
  *   **Problem:** If the measure of survival is vanishingly small, the "renormalized" probability assigns certainty to an outcome that is physically atypical (a "freak" branch).
  *   **Decision-Theoretic Pathology:** This allows for "Pascal's Mugging" style scenarios involving quantum mechanics. An agent could be persuaded to undertake actions with disastrous consequences for the global wavefunction (low measure of good outcomes, high measure of bad outcomes) because they only evaluate the low-measure branch where they survive and benefit.
  *   **Dependency:** This relies on **Component 3** prohibiting the agent from anticipating their own non-existence. If **Component 3** were relaxed to allow "caring about measure" even in death branches (e.g., caring about the loss of future experiences), the EU calculation would restore the weight of the death branches.

  **The "Caring Measure" Problem**
  A critical tension arises between **Component 2** and **Component 3**.
  *   **Component 2:** "My future selves in different branches are all genuinely me."
  *   **Component 3:** "Assign no weight to branches in which I do not survive."
  *   **Conflict:** If a branch involves my death, **Component 2** implies there is no future self there. So **Component 3** is consistent there. But what about the *measure* of the surviving selves? If I have 1 unit of measure in Branch A (survival) and 1,000,000 units of measure in Branch B (survival), **Component 2** says both are "me." **Component 3** says I anticipate both (since I survive in both). But standard EDT says I should care more about Branch B.
  *   **Implication:** Your package does not specify how to weigh *different survival branches* against each other. Does the agent treat all survival branches as equally probable (Principle of Indifference over branches)? Or do they still use the Born Rule *within* the set of survival branches?
  *   **If Indifference:** This violates **Component 1**'s physical structure entirely.
  *   **If Born Rule (Conditional):** This preserves **Component 1** but still suffers from the "Conditioning Effect" described in Section 1.
  *   **Recommendation:** For the package to remain physically grounded, you must assume the Born Rule applies *conditional on survival*. However, this still yields the pathological risk-seeking behavior regarding the *fact* of survival vs. death.

  ### Summary of Implications

  1.  **Practical Deliberation:** The agent must deliberate as if they are immune to extinction, but vulnerable to maiming. Risks to others are drastically undervalued unless they instrumentally impact the agent's surviving branches.
  2.  **Preferences:** Ordinary risk aversion regarding death is irrational. Preferences become indexically constrained (Indexical Consequentialism), creating a divergence between the agent's self-interest and the "global" utility of the wavefunction.
  3.  **Decision Theory:** Branch measure ceases to function as subjective probability regarding death. Expected Utility must be calculated over a truncated sample space. This decouples rationality from the statistical structure of the wavefunction in life-or-death contexts.

  **Explicit Dependence Check:**
  *   The **immunity to extinction** depends entirely on **Component 3**. Without it, measure returns (Standard EDT).
  *   The **vulnerability to maiming** depends on **Component 2**. If identity required psychological continuity that death/trauma breaks, the "survival" branches would vanish, and **Component 3** would have no branches to condition on (leading to anticipated death).
  *   The **asymmetry regarding others** depends on **Component 3** being indexical (applying only to "my" consciousness). If **Component 3** were universalized ("no consciousness anticipates its end"), then others' deaths would also be invisible to the agent, leading to total moral solipsism.

  This package commits you to a view where the agent is a "privileged observer" who effectively edits the wavefunction to remove their own non-existence from their deliberative calculus. This is normatively distinct from standard Everettianism and generates significant tension with any ethical framework that values the aggregate measure of outcomes.
