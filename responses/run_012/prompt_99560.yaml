      *   *Other-Risk:* Assumption 3 applies to *my* consciousness. It does not grant immortality to others. In branches where others die, I still exist (presumably).
      *   *Implication:* Asymmetry. I am immortal; others are not. This creates a moral hazard. I might accept policies that kill others because *I* will survive to experience the aftermath (or at least, some version of me will).
