answer: |-
  ### Decision Tree: The Space of Unilateral Action

  **1. Is the disagreement driven by divergent terminal values or risk tolerances?**
  *   **Yes** → **Leaf 1: Value Pluralism**
      *   *Stance:* Allow action based on individual preference schedules.
      *   *Awkward Commitment:* Permits clearly destructive acts if the actor values the destruction highly enough.
  *   **No** (Disagreement is about empirical expected value) → *Go to 2.*

  **2. Do the action's primary costs fall on non-consenting outsiders?**
  *   **Yes** → **Leaf 2: Externality Constraint**
      *   *Stance:* Veto action until external stakeholders are compensated or consulted.
      *   *Awkward Commitment:* Paralyzes action when stakeholders are undefined, ubiquitous, or future generations.
  *   **No** (Costs are internalized by the group) → *Go to 3.*

  **3. Is the action primarily information-producing (probe/experiment) rather than world-altering?**
  *   **Yes** → **Leaf 3: Experimental License**
      *   *Stance:* Permit unilateral action to resolve uncertainty.
      *   *Awkward Commitment:* Licenses potentially dangerous probing if the information value is calculated to be high enough.
  *   **No** (Action is definitive/irreversible) → *Go to 4.*

  **4. Would the action be defensible if every similarly placed actor performed it? (Universalizability)**
  *   **Yes** → **Leaf 4: Laissez-Faire Individualism**
      *   *Stance:* Trust private estimates; act without coordination.
      *   *Awkward Commitment:* Accepts that "lucky fools" will occasionally cause disasters as the price of speed.
  *   **No** (Systemic risk exists) → *Go to 5.* (This is the Unilateralist's Curse proper).

  **5. Can the group costlessly communicate and share private evidence before acting?**
  *   **Yes** → **Leaf 5: Epistemic Pooling**
      *   *Stance:* Delay action until all private signals are aggregated.
      *   *Awkward Commitment:* Requires slowing down action until consensus forms, risking catastrophic opportunity costs.
  *   **No** → *Go to 6.*
      *   **[Unoccupied Combination A]:** *Telepathic Pooling* (Demand evidence pooling without communication).
      *   *Diagnosis:* **Physically Impossible.** This stance demands the aggregation of private data without a channel to transmit it.

  **6. Can the group bind itself to a joint policy (precommitment) before the decision point?**
  *   **Yes** → **Leaf 6: Mutual Precommitment (Secrecy)**
      *   *Stance:* Agree in advance to withhold action or publish only jointly.
      *   *Awkward Commitment:* Requires trusting partners not to defect secretly when the temptation peaks.
  *   **No** → *Go to 7.*

  **7. Can authority be delegated to a single trusted epistemic agent?**
  *   **Yes** → **Leaf 7: Designated Decider**
      *   *Stance:* One member decides on the group's behalf.
      *   *Awkward Commitment:* Concentrates epistemic risk on one fallible individual and creates a single point of failure.
  *   **No** → *Go to 8.*

  **8. Can a market mechanism price the probability of success?**
  *   **Yes** → **Leaf 8: Decision Market**
      *   *Stance:* Act only if prediction markets clear above a threshold.
      *   *Awkward Commitment:* Incentivizes manipulation of the market rather than improvement of the world.
  *   **No** → *Go to 9.*

  **9. Can we impose a direct cost on unilateral action?**
  *   **Yes** → **Leaf 9: Costly Signaling**
      *   *Stance:* Make acting alone expensive enough to filter out low-confidence estimates.
      *   *Awkward Commitment:* Wealthier actors gain disproportionate influence over truth-tracking and group safety.
  *   **No** → *Go to 10.*

  **10. Can we enforce a voting threshold (supermajority)?**
  *   **Yes** → **Leaf 10: Supermajority Rule**
      *   *Stance:* Require >50% agreement to proceed.
      *   *Awkward Commitment:* Allows a minority to veto action even when the majority expects positive value.
  *   **No** → *Go to 11.*

  **11. Will actors voluntarily restrain themselves based on group welfare?**
  *   **Yes** → **Leaf 11: Conformity Norm**
      *   *Stance:* Act only if you would be content for every similarly placed actor to act.
      *   *Awkward Commitment:* Punishes correct contrarians who happen to be alone in their accurate assessment.
  *   **No** → **Leaf 12: Incoherent Individualism**
      *   *Stance:* Acknowledge systemic risk but act on private estimate anyway.
      *   *Awkward Commitment:* Embraces the certainty of disaster as the price of liberty; logically unstable for a rationalist.
      *   *Diagnosis:* **Normatively Incoherent.** This occupies the logical space of acknowledging the curse while refusing all remedies.

  ***

  ### Diagnosis of Gaps and Overlaps

  **Unoccupied Combinations:**
  1.  **Telepathic Pooling (Leaf 5 Alternative):** This combination is unoccupied because it is physically impossible. It represents the wish for the epistemic benefits of pooling without the causal mechanism of communication.
  2.  **Incoherent Individualism (Leaf 12):** This combination is rarely occupied explicitly because it admits to irrationality. It represents the "Tragedy of the Commons" endpoint where agents recognize the curse but lack the normative or mechanical tools to stop it.

  **Indistinguishable Leaves:**
  *   **Supermajority Rule (Leaf 10) vs. Costly Signaling (Leaf 9):** The tree treats these as distinct based on mechanism (voting vs. price), but functionally they often converge. Both impose a threshold on confidence required to act. If the cost of signaling is calibrated exactly to the difficulty of finding allies, the two leaves become operationally identical, differing only in whether the "currency" paid is social capital or actual resources.

  ### Closing Note: The Primary Sorting Branch

  The branch doing the most sorting work is **Node 4 (Universalizability)**.

  This node separates the *true* Unilateralist's Curse from cases of justified individual action. If an action is universalizable (Node 4 = Yes), the "curse" is not a curse at all; it is merely the sound of a distributed system working correctly, and **Laissez-Faire Individualism** becomes the rational default. It is only when universalizability fails (Node 4 = No) that the subsequent seven layers of coordination mechanisms (Pooling, Precommitment, Markets, etc.) become necessary. Without this split, one risks applying heavy-handed coordination costs to actions that are safe in the aggregate, or worse, applying individualist logic to actions that are catastrophic in the aggregate.
