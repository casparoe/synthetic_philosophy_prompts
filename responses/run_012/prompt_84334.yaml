prompt: |-
  I work on RLHF — I've built reward models, done the multi-annotator thing where you train a seperate head per annotator and then have to squash them all into one training signal, argued with people about Pareto fronts and scalarization and whether our reward numbers are even on a meaningful scale. So that's my home vocabulary, and I definately know it cold. Philosophy I'm a tourist in. I've been reading around Harsanyi's aggregation theorem — the one that says if the group's preferences satisfy the expected-utility axioms and respect unanimous individual preferences (individuals indifferent implies society indifferent), then social welfare has to be a weighted sum of individual utilities — and I keep feeling like I already know this theorem, just wearing a different hat.

  Take the role of someone genuinely expert in both social choice theory and modern preference modelling / RLHF, and treat this as a real translation job, not a vibe check. Brainstorm first — where do the "individuals" land, where do "social states" land, where do the weights land, which of our objects are playing the role of the lotteries — then write it up properly. If you're shaky on the exact statement of the theorem, say so and work from the gloss above rather than inventing details.

  Restate the theorem, assumptions and conclusion both, entirely in my vocabulary: annotators and their comparison data, per-annotator reward heads, the fact that a reward model is only pinned down up to a positive affine transform so adding or averaging heads requires some arbitrary normalization, scalarizing several rewards into one objective, the Pareto front versus its convex hull, policies versus distributions over policies, KL penalties, reward hacking and overoptimization, and the way we usually just pool everyone's comparisons and call the leftover disagreement noise. Give me the strongest faithful version, not the one that's convenient to translate — I want to see what our aggregate reward model turns out to be an instance of.

  Then the part I actually care about, the residue report:
  1. What translates cleanly, with the correspondence spelled out?
  2. What only translates with distortion — what specifically got bent, and does the bend matter for anything?
  3. What has no counterpart in my vocabulary at all?
  For each residue item, say whether the gap is a defect on my side (something the ML picture genuinely can't represent) or a sign that the philosophical claim was thinner than it sounded.

  Three places I suspect the residue is, so please take a stance on each:
  - The assumption that the social ranking depends only on individual utility levels and on nothing else about the outcome. Is that a substantive moral commitment or just bookkeeping? Do we make the same assumption, or do we get to skip it because our reward model scores text directly instead of scoring other people's utilities?
  - The weights. If every individual's utility is only defined up to a positive affine transform, in what sense are the weights real? Is that the same problem as comparing reward heads on different scales, or a different problem that merely looks similar?
  - There's apparently a long fight about whether the Pareto requirement applies to the gambles (ex ante) or to the outcomes (ex post) and I've never understood what's actually at stake. Does anything like that show up when we aggregate annotators?

  One more: Harsanyi has a second route to the conclusion where you imagine being equally likely to be anyone, which pins the weights down to equal. If I read that as just a uniform prior over annotators, have I understood it or missed the point?

  Think carefully, be concrete, use small numeric examples where they help, and don't be diplomatic — if the translation is a dud I'd rather hear that than get a polite mapping table.
