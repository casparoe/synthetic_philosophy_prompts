          *   Primary occurrence (Wide scope negation): It is not the case that (the F is G). True if no F exists.
          *   Secondary occurrence (Narrow scope negation): The F is (not G). False if no F exists.
      *   *Empty Descriptions:* "The King of France is bald" is false (not meaningless), because existence fails.
      *   *Names vs. Descriptions:* Names are logical proper names (direct reference), descriptions are quantifiers.

  3.  **Translate to Engineering Vocabulary:**
      *   *Definite Description:* A query or lookup constraint (e.g., `SELECT * FROM users WHERE email = '...'`).
      *   *Referring Expression (Name):* A primary key or pointer (e.g., `user_id = 42`).
      *   *Proposition:* A boolean assertion or a transaction result.
