          *   *Engineering:* Exception (`NoResultFound`) vs. Sentinel (`None`/`False`).
          *   *Mapping:* Russell = Return `False` on empty set. Strawson = Throw `404`.

      *   *Case 5: Anaphora & Scope (Discourse Representation).*
          *   "If a farmer owns a donkey, he beats it."
          *   *Engineering:* Variable scope leakage. The `he` (variable) is bound in the `IF` block but used outside or in the `THEN`.
          *   *Russell:* Quantifier scope.
          *   *Engineering:* Requires lifting scope (Continuations/Store) or explicit passing. SQL CTEs help but don't solve cross-query anaphora easily.

