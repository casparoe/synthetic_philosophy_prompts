      *   *Macro vs. Value:* Russell says descriptions have no meaning in isolation. This is a Macro (compile-time expansion). A Value implies it exists in the runtime heap. Russell denies the object exists in the logic if the description fails.
      *   *Thin Disagreement:* Much of the debate is about how to handle "nothing." Engineers handle it with `Option<T>` or Exceptions. Philosophers argue about truth conditions. The mapping is strong, but the *stakes* differ.

