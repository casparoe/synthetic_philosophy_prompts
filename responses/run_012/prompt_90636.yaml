  I seek a seat within the mind's still court,
  Where self-love's noise yields up its deep silence.
  An unseen judge, removed from all violence,
  To weigh the care that life and death support.
  No friend to kin, nor bound by social sort,
  He stands apart from private defiance.
  With reason's hand, he measures compliance,
  And claims a view no bias can distort.

  Yet when I listen close, the tone shifts shape,
  It sounds like her who taught me well my part.
  Or peers whose praise I strive to make my own.
  Is there a path to make a clean escape?
  Or claim a role it did not itself start?
  Or rest on pure decree that stands alone?
