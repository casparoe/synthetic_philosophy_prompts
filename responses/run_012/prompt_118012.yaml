answer: |-
  Friends, colleagues, trustees, and guests. Nineteen years is a long time to steer a ship, and longer still to watch the sea change beneath it. When I began this work, the world seemed organized by different axes than those that hold it today. Yet, through every administration and every crisis, this institute has remained a place where we insist that thinking matters. I am grateful to the trustees who have funded this journey, and to the staff who have done the actual work. Tonight, as I step down, you ask me to bless a new program on the uses of history in statecraft. It is a vital endeavor, and I offer it my full support. But because I leave you with love, I must also leave you with a warning.

  We gather to launch a project dedicated to mining the past for guidance. This is natural. When the fog of the present thickens, we look for landmarks we recognize. But we must be precise about what those landmarks are. The first danger is that the source case is always already interpreted. We never encounter raw history; we encounter stories about history. When we invoke the lessons of Munich or Vietnam, we are not accessing events as they happened, but rather a contested reading of those events that has hardened into legend. By using the analogy, you smuggle in a specific judgment about the past along with whatever proof you intend to offer for the present. You assume you know what happened then, and that assumption is often the weakest link in your chain.

  This leads to a deeper structural flaw. Choosing the comparison is the entire inference, and it is done before any reasoning begins. If you decide a current crisis is like the nineteen-thirties, you have already concluded that appeasement is the risk, before you have analyzed the specific actors on the stage. The analogy cannot be tested by the reasoning it licenses, because the reasoning is merely unpacking the choice you made at the start. Furthermore, a single vivid precedent cannot do the work of a rule. In statecraft, the counterfactual is never available. We cannot know what would have happened had the leaders in those previous crises chosen differently, yet we build our laws of behavior on the certainty that their choices were the only ones that mattered.

  I am aware that in warning you against the seduction of parallels, I am currently asking you to draw a parallel between statecraft and navigation. I am telling you that using history is like navigating with a map drawn from a previous voyage. The coastlines have shifted, the tides are different, but the map comforts you. This analogy is meant to serve a specific purpose: to suggest that history is a tool for orientation, not a autopilot. It works here because it highlights the gap between the representation and the territory. But please note the irony: I am using a story to warn you against stories.

  So, if analogies are fraught, what is history for? It is far better at generating options and at diagnosing a situation than at forecasting. History does not tell you what will happen; it tells you what could happen. It expands the imagination of the analyst rather than narrowing it to a single predicted track. It allows you to see the anatomy of a crisis, to recognize the rhythm of escalation, without promising you the ending. It is a gym for the mind, not a crystal ball.

  There is one more constraint we often ignore. The costs of over-applying and under-applying a precedent are asymmetric, which the literature on lessons routinely fails to notice. If you see an aggressor where there is none, you waste resources and perhaps provoke a conflict that was avoidable. If you fail to see an aggressor because you are waiting for the perfect historical match, you may lose the chance to stop a war altogether. These prices are not equal. A rigorous historical reasoning must account for the cost of being wrong in either direction, not just the cost of repeating the past.

  This new program will catalogue analogies. Let it do so. But let it also catalogue the failures of analogy. Let it teach our analysts to ask not just "what does this resemble?" but "what is being hidden by this resemblance?" Do not send your teams home with skepticism alone. Send them with a method. When you face a crisis, do not ask history for the answer. Ask it for the questions. Ask it to reveal the assumptions you are making about human nature, about timing, about the limits of power. Use the past to stress-test your plans, not to validate them.

  I leave this institute in capable hands. The work is harder than it looks, and the stakes are higher than we admit. But if we can learn to use the past without being used by it, we might just serve the future better. Thank you for nineteen years of trust. Good night.

  ***

  **Note on Claims and Contention**

  **Settled Claims:** The assertion that analogies are better at diagnosis and option-generation than at forecasting is widely accepted in cognitive psychology and political science literature regarding decision-making. The claim that source cases are "always already interpreted" is also a standard constructivist and historiographical observation; few serious scholars believe we access raw data without narrative framing.

  **Contested Claims:** The claim that "choosing the comparison is the entire inference" is a strong cognitive critique that some political scientists push back against, arguing that rigorous process-tracing can validate an analogy after selection. The assertion regarding asymmetric costs is genuinely contested; while some security studies scholars acknowledge it, much of the "lessons of history" literature treats errors of commission and omission as equally detrimental to analytical integrity, rather than weighing their strategic consequences differently.

  **Taken Sides:** The speech deliberately refuses to define what the "lessons of Munich or Vietnam" actually are, treating them as contested symbols rather than consensus data. This avoids taking a side in the live disagreement over whether Munich proves the necessity of force or the danger of rashness, and whether Vietnam proves the limits of power or the costs of misapplication. The speech takes the side that historical reasoning is inherently limited in predictive power, a stance that counters more positivist approaches which seek law-like generalizations from historical cases.
