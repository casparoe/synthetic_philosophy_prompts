prompt: |-
  A colleague in my ethics reading group keeps modeling consent on contract. Her claim is that the three standard ways consent goes wrong — deception, coercion, and incompetence — are just the consent-theoretic analogues of the three standard ways a contract goes wrong: misrepresentation or fraud, duress, and incapacity. She draws the moral that a deception-tainted consent is void in the way a fraudulently procured contract is void, that the disclosure owed before consent is the disclosure owed before signing, and that the whole apparatus of contract doctrine — the void/voidable distinction, the materiality and reliance requirements, the objective reasonable-person standard — can be transplanted wholesale to tell us when consent is valid. She also likes to put it in a Hohfeldian register: consent is the exercise of a power to waive a claim-right, and a contract is the exercise of a power to create one, so the two are the same kind of legal-moral move and should share validity conditions.

  I am not convinced, but I do not want to dismiss it either. Audit the analogy. Give me the correspondence table first — what plays the role of offer and acceptance, of consideration, of the meeting of the minds, of the signature, of breach, and of remedy — and say which of those roles has no occupant on the consent side, and whether each empty slot is a genuine gap or a sign that the mapping was wrong from the start. Then the disanalogies, sorted into the ones that matter for her conclusion and the ones that do not. I am especially interested in four points: (i) whether consent is bilateral at all, given that a proposal need not be made and, once consent is given, need not be accepted to be effective; (ii) whether the revocability of consent has any counterpart in contract, and what its absence does to the analogy; (iii) whether the void/voidable distinction carries over, and what the difference between invalid consent and merely vitiated consent actually amounts to; and (iv) whether importing the objective reasonable-person standard changes the subject, since a great deal of consent theory is about what this particular person actually understood or willed. Finally, tell me whether the transplanted conclusion survives — that deception vitiates consent exactly as fraud voids a contract, with the same materiality and reliance thresholds — or whether the analogy was carrying that conclusion all along. And if there is a better analogy for the validity conditions of consent, name it and say what it gets right that the contract analogy gets wrong.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** An ethics reading group discussion. A colleague argues that consent should be modeled on contract law (specifically validity conditions).
      *   **Colleague's Claim:** Deception, coercion, incompetence in consent map to fraud, duress, incapacity in contract. Therefore, contract doctrine (void/voidable, materiality, reliance, objective standard) applies wholesale to consent. Hohfeldian analysis supports this (power to waive vs. power to create).
      *   **User's Stance:** Skeptical but open. Wants an audit of the analogy.
      *   **Specific Tasks:**
          1.  Create a correspondence table (Offer, Acceptance, Consideration, Meeting of Minds, Signature, Breach, Remedy).
          2.  Identify empty slots (roles with no occupant in consent) and analyze if they are gaps or mapping errors.
          3.  List disanalogies, sorted by relevance to the conclusion.
          4.  Address four specific points: (i) Bilaterality, (ii) Revocability, (iii) Void/Voidable distinction, (iv) Objective vs. Subjective standard.
          5.  Evaluate the transplanted conclusion (deception/fraud thresholds).
          6.  Propose a better analogy if applicable.

  2.  **Deconstruct the Contract-Consent Analogy:**
      *   *Contract:* Exchange of promises/rights/duties. Bilateral. Binding. Remedy for breach.
      *   *Consent:* Waiver of a right (usually a right against interference). Often unilateral (permission granted). Not necessarily binding on the consenter (can often revoke). No "breach" by the consenter, but "violation" by the consentee.
      *   *Hohfeldian Check:* Consent = Power to waive a claim-right (duty on other). Contract = Power to create claim-rights/duties. They are inverse operations but both involve normative change. This part of the colleague's argument is strong *structurally*, but weak *functionally*.

  3.  **Drafting the Correspondence Table:**
      *   *Offer:* Proposal to interact/interfere. (Matches).
      *   *Acceptance:* The act of consenting. (Matches).
      *   *Consideration:* This is tricky. Contracts need bargained-for exchange. Consent often doesn't (e.g., consenting to a medical procedure, consenting to a hug). *Empty Slot?*
      *   *Meeting of the Minds:* Mutual understanding of scope. (Matches).
      *   *Signature:* Overt act (verbal/written). (Matches).
      *   *Breach:* Violation of the scope. (Matches loosely).
      *   *Remedy:* Contract = Damages/Specific Performance. Consent = Trespass/Battery (liability), not expectation damages. *Mismatch.*

  4.  **Analyzing Empty Slots:**
      *   *Consideration:* Consent doesn't require quid pro quo. If we map this, it implies consent needs benefit to the consenter. That's wrong. *Sign of mapping error.*
      *   *Remedy:* Contract remedies protect expectation interest. Consent violations protect bodily/property integrity (reliance/status quo). *Sign of mapping error.*

  5.  **Addressing the Four Specific Points:**
      *   *(i) Bilaterality:* Contract is bilateral (promise for promise). Consent is often unilateral (waiver). The consentee doesn't need to "accept" the waiver to be bound by it (they just gain liberty). *Major Disanalogy.*
      *   *(ii) Revocability:* Contracts are binding (pacta sunt servanda). Consent is often revocable (sexual, medical). If consent is like a contract, why can I break the "deal" mid-act without liability? *Major Disanalogy.*
      *   *(iii) Void/Voidable:* Contract: Void (no legal existence) vs. Voidable (valid until rescinded). Consent: Invalid (never happened) vs. Vitiated (happened but flawed). In ethics, the distinction matters for whether a violation occurred *ex ante* or *ex post*. Contract law focuses on enforcement; consent theory focuses on moral permissibility. *Nuanced Disanalogy.*
      *   *(iv) Objective Standard:* Contract law uses "reasonable person" to stabilize commerce. Consent theory (especially autonomy-based) cares about *actual* subjective will. If I didn't understand, but a "reasonable person" would have, contract says bound, consent theory says violated. *Critical Disanalogy.*

  6.  **Evaluating the Transplanted Conclusion:**
      *   *Claim:* Deception vitiates consent *exactly* as fraud voids contract (materiality + reliance).
      *   *Critique:* In contract, fraud requires reliance and materiality to protect the bargain. In consent, deception undermines the *authority* of the act. If I consent to sex with Person A, but it's Person B (fraud in factum), consent is void, regardless of "materiality" in a market sense. Some deceptions (fraud in the inducement) might not vitiate consent in law, but might in ethics. The contract model imports *transactional* thresholds into *moral boundary* settings. The analogy *is* carrying the conclusion.

  7.  **Finding a Better Analogy:**
      *   *Property/Permission:* Entering a house. Invitation vs. Trespass.
      *   *Authority/Power of Attorney:* Delegating authority.
      *   *Best Fit:* **The License/Permission Model (Property Law)** or **The Authority Model**.
      *   *Why:* Focuses on scope, revocability, and the right to exclude, rather than exchange and expectation.

  8.  **Refining the Tone:**
      *   Needs to be philosophical, precise, respectful of the colleague's sophistication (Hohfeldian reference), but firm on the distinctions.
      *   Structure: Table -> Empty Slots -> Disanalogies (Sorted) -> The Four Points -> Verdict on Conclusion -> Better Analogy.

  9.  **Self-Correction/Nuance Check during drafting:**
      *   *Check:* Is consent *always* revocable? No (e.g., consenting to a surgery once cut open, or irrevocable waivers in some legal contexts). *Correction:* Distinguish between *moral* consent (often revocable) and *legal* consent (sometimes binding). The prompt is about an *ethics* reading group, so prioritize moral philosophy implications.
      *   *Check:* Is consideration truly empty? Some argue reliance acts as consideration. *Correction:* In pure moral consent, I can consent to your borrowing my pen without getting anything back. Consideration is a contract-specific filter for enforceability, not validity of normative change.
      *   *Check:* Void vs. Voidable. In contract, duress makes it voidable. In criminal law (battery), lack of consent makes the act a crime (void). The distinction is starker in consent.

  10. **Final Polish:** Ensure all constraints of the prompt are met (Table, Empty Slots, Disanalogies sorted, 4 points, Conclusion verdict, Better Analogy).

  *(Self-Correction on the "Four Points" section)*: The prompt asks to address these specifically. I should integrate them into the "Disanalogies" section or give them their own section. The prompt says "Then the disanalogies... I am especially interested in four points." I will create a dedicated section for these four points to ensure they get the spotlight requested, then categorize their impact.

  *(Refining the "Better Analogy")*: The "Authority" or "Waiver" model is good, but the "License" (property) model is often clearer for scope and revocation. Let's go with the **License/Permission Model** grounded in Property/Tort, as it handles the "right to exclude" better than Contract's "right to expect."

  *(Final Review of the "Conclusion" section)*: The prompt asks if the analogy was carrying the conclusion all along. I need to be explicit: Yes, by importing "materiality" and "reliance," the contract model smuggles in a market-logic that dilutes the autonomy-logic of consent.

