answer: |-
  Here is an audit of the contract-consent analogy, structured as requested.

  ### I. Correspondence Table

  | Contract Doctrine | Role in Contract | Proposed Consent Analogue | Status |
  | :--- | :--- | :--- | :--- |
  | **Offer** | Proposal to be bound on terms | Proposal to interact / Request for permission | **Occupied** |
  | **Acceptance** | Manifestation of assent to terms | The act of consenting (verbal/conduct) | **Occupied** |
  | **Consideration** | Bargained-for exchange; price of enforceability | *Benefit to consenter / Reciprocal waiver* | **Empty** |
  | **Meeting of the Minds** | Mutual understanding of terms | Shared understanding of scope/nature of act | **Occupied** |
  | **Signature** | Formalization of commitment | Overt act (signature, verbal "yes", nod) | **Occupied** |
  | **Breach** | Failure to perform promised duty | Exceeding scope of permission (violation) | **Occupied (loosely)** |
  | **Remedy** | Expectation damages / Specific performance | Liability for trespass / battery (no expectation) | **Mismatched** |

  #### Analysis of Empty Slots

  1.  **Consideration:** There is no occupant for this role in consent. I can validly consent to you borrowing my car without receiving anything in return.
      *   *Verdict:* **Sign of mapping error.** Consideration is a filter for *enforceability* in commercial exchange, not a condition for the *validity of normative change*. Importing it implies consent requires a quid pro quo, which contradicts the nature of gifts, waivers, and permissions.
  2.  **Remedy:** Contract remedies protect the *expectation interest* (putting the plaintiff in the position they would be in if the promise were kept). Consent violations protect the *integrity interest* (restoring the boundary that was crossed).
      *   *Verdict:* **Sign of mapping error.** If consent were truly contractual, violating it would require you to compensate me for the benefit I *would have received* had you interacted with me properly. Instead, violations are treated as torts/crimes (battery, trespass), focusing on the wrongfulness of the intrusion, not the lost bargain.

  ---

  ### II. Disanalogies

  I have sorted these into those that undermine your colleague's specific conclusion (Critical) and those that are structural but less damaging to the validity conditions (Peripheral).

  #### Critical Disanalogies (Undermine the Conclusion)
  1.  **The Objective vs. Subjective Standard:** Contract law prioritizes the "objective reasonable person" to ensure commercial stability (if you look like you agreed, you are bound). Consent theory prioritizes the "subjective actual will" to protect autonomy (if you didn't actually agree, you aren't bound, even if you looked like you did).
  2.  **Materiality and Reliance:** In fraud (contract), a lie only voids the deal if it was *material* to the bargain and *relied* upon. In consent, certain deceptions (e.g., identity in sexual cases, nature of the act in medical cases) vitiate consent regardless of whether a "reasonable person" would care or whether the consentee relied on it to their detriment.
  3.  **Revocability:** Contracts are binding (*pacta sunt servanda*). Consent is often inherently revocable (e.g., sexual consent, ongoing medical procedures). Treating consent as a contract implies a binding commitment that cannot be withdrawn without breach.

  #### Peripheral Disanalogies (Structural Noise)
  1.  **Formalization:** Contracts often require writing (Statute of Frauds); consent is rarely formalized.
  2.  **Duration:** Contracts have defined terms; consent can be instantaneous or open-ended.
  3.  **Third-Party Beneficiaries:** Contracts often involve third parties; consent is typically dyadic.

  ---

  ### III. The Four Specific Points

  #### (i) Bilaterality
  **Verdict:** Consent is not bilateral in the contract sense.
  In a contract, an offer is powerless until accepted; it creates no normative change until the "meeting of the minds" is complete. In consent, the power lies primarily with the consenter. Once I waive my right against your entry, you have a liberty. You do not need to "accept" my waiver for it to be effective (you cannot be forced to enter my house, but my permission is valid regardless of your decision).
  **Impact:** This undermines the "meeting of the minds" requirement. If consent is a unilateral waiver of a claim-right, the focus must be entirely on the *consenter's* state of mind, not the mutual alignment of two parties. The contract model distracts by looking for mutual assent where only one party's authority is dispositive.

  #### (ii) Revocability
  **Verdict:** Revocability has no true counterpart in contract law.
  In contract, revocation before acceptance is an offer withdrawal; revocation *after* acceptance is a breach. In consent, revocation *during* the act (e.g., "stop") renders continued action a violation, not a breach of contract. There is no liability for damages for the "broken promise" of continued consent.
  **Impact:** This is fatal to the "binding" nature of the contract analogy. If consent functions like a contract, withdrawing it should incur a penalty or require a release. That consent can be withdrawn without penalty suggests it is a **license** or a **continuing state of affairs**, not a binding obligation.

  #### (iii) Void vs. Voidable
  **Verdict:** The distinction carries over poorly.
  In contract, *voidable* means the contract is valid until the victim rescinds it. *Void* means it never existed. In consent, the distinction is often between *invalid* (no consent occurred, e.g., unconsciousness) and *vitiated* (consent occurred but was flawed, e.g., coerced).
  **Impact:** In ethics, this matters for the status of the actor. If consent is voidable (contract model), the actor is permissible until I say otherwise. If consent is void (consent model), the actor is impermissible *ab initio*. Your colleague's model suggests deception makes consent merely voidable (rescindable), whereas many ethicists argue deception makes it void (it never happened). The contract model softens the moral wrong by making it a matter of rescission rather than initial invalidity.

  #### (iv) The Objective Reasonable-Person Standard
  **Verdict:** Importing this changes the subject from Autonomy to Reliance.
  Contract law uses the objective standard to protect the *promisee's reliance*. If you acted like you consented, I relied on that, so you are bound. Consent theory uses the subjective standard to protect the *consenter's autonomy*. If you didn't actually will it, your boundary was crossed.
  **Impact:** This is the most dangerous import. If we use the objective standard, a woman who freezes in fear (subjectively non-consenting) but does not fight back (objectively looks consenting) is deemed to have consented. The contract model validates the "appearance" of agreement; the consent model requires the "reality" of agreement.

  ---

  ### IV. Verdict on the Transplanted Conclusion

  **Does the conclusion survive?**
  **No.** The claim that "deception vitiates consent exactly as fraud voids a contract, with the same materiality and reliance thresholds" is false.

  **Was the analogy carrying the conclusion all along?**
  **Yes.** The contract model is designed to facilitate exchange by minimizing transaction costs. It tolerates certain deceptions (puffery, non-material lies) to keep deals stable. It requires reliance to ensure damages are calculable.
  Consent theory is designed to protect boundaries and autonomy. It cannot tolerate "non-material" deception about the nature of the act (e.g., "this is a medical exam" vs. "this is sex") because the autonomy violation is total, regardless of "materiality" in a market sense. By importing the contract thresholds, your colleague is smuggling in a **market-efficiency logic** that dilutes the **rights-based logic** of consent. She is arguing for a lower bar for valid consent because contract law sets a lower bar for valid deals.

  ---

  ### V. A Better Analogy: The Property License

  If you need an analogy for the validity conditions of consent, do not use **Contract**; use **Property License** (specifically, a revocable license to enter land).

  **What it gets right:**
  1.  **Unilateral Authority:** Just as a landowner can grant permission to enter without a bargain (no consideration), a person can grant consent without exchange.
  2.  **Scope and Trespass:** Just as entering the kitchen when permitted only to enter the living room is trespass, touching a shoulder when consented only to a handshake is battery. The focus is on *boundary crossing*, not *broken promises*.
  3.  **Revocability:** A license to enter land is generally revocable at will. Once revoked, continued presence is trespass. This matches the revocability of moral consent.
  4.  **Validity Conditions:** Fraud in obtaining a license (e.g., pretending to be the inspector to gain entry) makes the entry trespass *ab initio*. It does not matter if the lie was "material" to the value of the land; it matters that the authority to enter was procured by undermining the owner's control.

  **What it fixes:**
  The Property License model shifts the focus from **Expectation** (Contract) to **Exclusion** (Consent). It explains why deception invalidates consent not because it ruined a bargain (reliance), but because it bypassed the gatekeeping authority of the agent. It preserves the subjective standard (the owner's actual intent) over the objective standard (what the visitor thought). It explains why there are no "damages for breach" but rather "liability for intrusion."

  **Recommendation for your group:**
  Acknowledge the Hohfeldian structural similarity (both are exercises of normative power), but insist that the *teleology* differs. Contract power is for **creating obligations**; Consent power is for **waiving protections**. You cannot use the rules of building walls (contract) to govern the opening of gates (consent).
