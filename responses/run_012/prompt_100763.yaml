  12. **Final Polish:** Ensure the distinction between "Safe-but-rewrite" (performance/loader architecture) and "Will-Flip" (logical inconsistency) is clear. The prompt asks for "Safe, Safe-but-rewrite, Genuinely this-will-flip."

