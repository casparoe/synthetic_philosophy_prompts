      *   *Key distinction:* Does the definition require the *final result* of the set to determine membership, or does it rely on *prior* data?
      *   *Refined Check:* "The Before-and-After Test." Can you determine this value using only information that existed *before* this calculation started?

  8.  **Finalizing the Checklist Steps:**
      1.  **The Bucket Test (Russell Check):** Are you defining a group by excluding itself from the group of all groups?
      2.  **The Mirror Test (Circular Aggregate):** Does the formula include a total that includes the result you are calculating?
      3.  **The Ladder Test (Stratification):** Can you assign levels? (The colleague's suggestion).
      4.  **The Stop Sign (Base Case):** If recursive, does it hit a concrete wall?

  9.  **Running the Examples against the Final Checklist:**
