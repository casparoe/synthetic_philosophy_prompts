      *   *3. 'Non-standard rule':* Any rule not among standard rules.
          *   Analysis: This is the Russell's Paradox example provided in the prompt context (similar to the "reviewable case" issue). If "Standard Rules" is defined by exclusion of "Non-standard", it's a loop. If "Standard" is a fixed list, it's safe. The definition implies the set of *all* rules is the universe.
