answer: |-
  You are not strawmanning your coach. Your intuition is sharp: he is sliding between at least three distinct philosophical claims, and he is swapping the word "lie" for "deceive" to make his job easier. This is a classic philosophical puzzle (often called the "Paradox of Self-Deception"), and high school debate coaches often simplify it into a slogan like "you can't lie to yourself" because it sounds definitive.

  Here is the breakdown you asked for. I have separated the meanings, the modalities of "can't," and applied them to your friend's case.

  ### 1. The Terminology Trap: "Lie" vs. "Deceive"
  Your coach is using "lie." The resolution says "deceive." These are not the same job.

  *   **Lying:** Typically requires a **speech act** directed at **another mind**. To lie, I must assert $X$ to you, while knowing $\neg X$.
      *   *The Problem:* You cannot "assert" things to yourself in the same way. You just believe them. If you know the truth, you can't assert the falsehood to yourself without realizing you're doing it.
      *   *Verdict:* If the resolution were "Self-**lying** is possible," your coach might have a point (it's a category error). But "Deception" is about **belief states**, not speech. You can manipulate your own beliefs without making a verbal statement.
  *   **Deceiving:** Causing someone (including yourself) to hold a false belief.
      *   *Verdict:* This is the actual battlefield. The question is whether one mind can cause itself to hold a belief it knows (somewhere) is false.

  ### 2. The Menu of Meanings: What "You Can't Lie to Yourself" Could Mean
  Here are the four distinct claims your coach is likely sliding between. I have flagged the type of "can't" for each.

  #### Reading A: The Logical Paradox (The "Static" Problem)
  *   **The Claim:** To be deceived, you must believe $X$. To be the deceiver, you must know $\neg X$. You cannot simultaneously believe $X$ and know $\neg X$ in the same part of your mind. It violates the law of non-contradiction.
  *   **Type of "Can't":** **Logical Impossibility.** (Like "a square circle.")
  *   **Your Friend's Case:** Under this reading, your friend **cannot** be self-deceived. If she believes he isn't cheating, she doesn't know he is. If she knows he is, she can't believe he isn't. The coach says "She knew the whole time," which implies she wasn't deceived, she was just lying to others.
  *   **Status:** **Real Philosophical Position.** This is the traditional argument (Sartre, Davidson). However, most modern philosophers reject this as too rigid because it assumes the mind is a single, unified box.

  #### Reading B: The Transparency Claim (Privileged Access)
  *   **The Claim:** You have direct access to your own beliefs. You always know what you believe. Therefore, you can't trick yourself into believing something because the moment you try, you'll see the trick.
  *   **Type of "Can't":** **Psychological/Epistemic Impossibility.** (Like "you can't tickle yourself.")
  *   **Your Friend's Case:** Under this reading, your friend **cannot** be self-deceived. If she really believed he wasn't cheating, that's just her belief. If she "knew" he was, she would be aware of that knowledge. The coach claiming "she knew deep down" assumes she had access to that knowledge but ignored it.
  *   **Status:** **Mostly False.** Psychology shows we do *not* have perfect access to our own beliefs. We infer our beliefs from our behavior sometimes. This reading is empirically weak.

  #### Reading C: The Intentionality Claim (The "Dynamic" Problem)
  *   **The Claim:** Deception requires **intent**. To deceive yourself, you must *intend* to make yourself believe a falsehood. But if you intend to do that, you already know the truth. If you know the truth, the project fails before it starts.
  *   **Type of "Can't":** **Pragmatic Impossibility.** (Like "you can't deliberately forget your name.")
  *   **Your Friend's Case:** This is the tricky one. Did your friend *intend* to believe he wasn't cheating? Probably not consciously. She just *wanted* it to be true. Under this reading, if she didn't consciously plot to fool herself, it's not self-deception, it's just **mistake** or **bias**. The coach uses this to say "It wasn't deception, it was just ignorance."
  *   **Status:** **Real Position, but Narrow.** This defines self-deception as a *conscious conspiracy*. Most people argue self-deception is *unconscious* or *non-intentional*.

  #### Reading D: The "Deep Down" Claim (Divided Mind)
  *   **The Claim:** You *can* deceive yourself, but only by splitting your mind. One part knows the truth (unconscious), one part believes the lie (conscious).
  *   **Type of "Can't":** **None.** This reading actually says you **CAN** deceive yourself, but the coach is using it to say "Therefore, you aren't truly deceived because the truth is still there."
  *   **Your Friend's Case:** Under this reading, your friend **IS** self-deceived. One part of her saw the texts (unconscious knowledge), one part believes he's faithful (conscious belief). The coach says "She knew the whole time" to deny the deception, but this reading actually *confirms* the mechanism of deception.
  *   **Status:** **Real Position.** This is the "Deflationary" or "Empirical" view (Alfred Mele, Robert Trivers). It treats self-deception as motivated bias rather than a magical paradox.

  ### 3. Which Reading is Your Coach Using?
  He is almost certainly sliding between **Reading A (Logical)** and **Reading D (Deep Down)** to shut you down.

  1.  **When he says "You can't lie to yourself":** He is using **Reading A**. He is treating it as a logical contradiction. This makes the resolution seem impossible by definition. **(This is a Platitude/Word Game).**
  2.  **When he says about your friend "She knew the whole time":** He is using **Reading D**. He is admitting there is unconscious knowledge. But he uses this to argue that because the knowledge existed, the deception wasn't "real." **(This is a Real Position, but he's drawing the wrong conclusion).**

  **Is he cheating?**
  Yes. He is using the **Logical** argument to say self-deception is impossible, but then using the **Psychological** argument (she knew deep down) to explain away your counter-example. He can't have it both ways.
  *   If it's logically impossible (Reading A), then "she knew deep down" is irrelevant because the state can't exist at all.
  *   If "she knew deep down" (Reading D), then self-deception *is* possible (as a divided state), which concedes the resolution.

  ### 4. Evaluation of the Readings
  *   **Reading A (Logical Paradox):** **Platitude/Definition Stipulation.** It defines "deception" so narrowly (requiring full conscious intent) that it becomes impossible. It doesn't prove self-deception doesn't happen in the real world; it just says "if we define it this way, it's impossible."
  *   **Reading B (Transparency):** **False.** Psychology disproves this. We are bad at knowing our own motivations.
  *   **Reading C (Intentionality):** **Debatable.** Some philosophers argue self-deception must be intentional. Most argue it is not. If the resolution doesn't specify "intentional," this reading is too narrow.
  *   **Reading D (Divided Mind/Motivated Bias):** **True/Real Position.** This is the scientific consensus. We bias our evidence gathering to support what we want to believe. This *is* self-deception.

  ### 5. Debate Strategy: How to Beat This
  Your coach is treating "self-deception" as "conscious lying to oneself." You need to redefine it as "motivated irrationality."

  **Argument 1: The Definition of Deceive**
  *   **Point:** The resolution says "deceive," not "lie."
  *   **Explanation:** Lying requires speech. Deceiving requires belief manipulation. I can deceive you without speaking (by planting evidence). I can deceive myself without speaking (by ignoring evidence).
  *   **Impact:** The coach's slogan "You can't lie to yourself" is irrelevant to the resolution.

  **Argument 2: The "Can't" is Psychological, Not Logical**
  *   **Point:** Even if it's hard to hold two contradictory beliefs consciously, humans do it all the time (Cognitive Dissonance).
  *   **Explanation:** We don't need to believe $P$ and $\neg P$ at the exact same millisecond in the exact same neuron. We can believe $P$ consciously while acting on $\neg P$ unconsciously.
  *   **Impact:** The "Logical Paradox" is a map, not the territory. Just because the definition is tricky doesn't mean the phenomenon isn't real.

  **Argument 3: The Friend Case (The "Motivated Bias" Model)**
  *   **Point:** Your friend is the perfect example of self-deception *precisely because* she wasn't consciously lying.
  *   **Explanation:** She didn't sit down and say "I will fool myself." She simply scrutinized the texts for loopholes ("Maybe it's a joke") while accepting other evidence uncritically. This is **biased evidence gathering**.
  *   **Impact:** This fits the definition of deception (causing a false belief) without requiring the impossible "conscious intent" the coach demands.
  *   **Counter to Coach:** When he says "She knew the whole time," ask him: "If she knew, why did she act like she didn't? If the knowledge was there but inaccessible to her decision-making, that *is* deception. You are describing the mechanism of self-deception, not disproving it."

  ### 6. Where I Am Unsure (Honesty Check)
  *   **Philosophical Consensus:** I am confident that "self-deception is possible" is the majority view in contemporary philosophy of mind (deflationary accounts). However, there is no single agreed-upon definition of *how* it works. Some heavyweights (like Sartre) did argue it was impossible/incoherent. So your coach isn't "wrong" in the sense that no smart person has ever agreed with him. He is just on the losing side of the modern debate.
  *   **Coach's Intent:** I cannot know if your coach knows he is equivocating. He might genuinely believe these are all the same point. In debate terms, it doesn't matter; you still expose the inconsistency.

  ### Summary for Your Practice
  1.  **Call out the swap:** "Coach, the resolution is 'deceive,' you keep saying 'lie.' Lying requires a listener. Deceiving requires a belief. I can deceive myself by ignoring evidence without making a statement."
  2.  **Call out the slide:** "When you say it's impossible, are you saying it's logically contradictory (Reading A) or that we always know the truth deep down (Reading D)? If it's logically contradictory, my friend's case is impossible. If she knew deep down, then self-deception is possible via unconscious knowledge. You can't use both."
  3.  **Win the Friend Case:** "My friend's case proves self-deception is possible. She held a false belief ('he's faithful') because she was motivated to hold it, despite having evidence to the contrary. Whether she 'knew deep down' or not, her conscious mind was deceived."

  Your coach is relying on a slogan. You have the nuance. Use it.
