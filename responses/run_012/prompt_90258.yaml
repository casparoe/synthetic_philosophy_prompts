  ok so im on my schools debate team and our next resolution is basically "self-deception is possible," and my coach keeps shutting down every practice with "well, you can't lie to yourself" like that just ends it. is that even a real saying or did he make it up? either way i dont get what its supposed to prove.

  what i actually want is every different thing "you can't lie to yourself" could mean, laid out one by one, because i think hes sliding between like four claims and i cant tell which one is doing the work. does it mean lying needs a second person so its true by definition and boring? or does it mean something real about belief, that youd have to believe the thing and not believe it at the same time and nobody can pull that off? or that you can do it but it isnt really lying, its more like wanting something to be true? or the thing where you can hide it from yourself for a while but it leaks? and is the "cant" a logical cant or a psychological cant or a "you shouldnt," because those seem super different to me and i think thats where hes cheating.

  also he says "lie" but the resolution says "deceive" and i have a feeling those arent the same word doing the same job, though i couldnt tell you why it would matter.

  and theres this case i keep bringing up that he just ignores: my friend was completely sure her boyfriend wasnt cheating even though shes the one who found the texts, and she wasnt faking, she really didnt believe it. he says "thats not self-deception, she knew the whole time," but then what is it? so for each reading on your list, can you say whether my friends case counts as self-deception under that reading, or whether that reading just rules her out by definition, because that feels like the whole fight to me.

  then say which reading the coach probably means and whether that reading actually beats the resolution, and which readings are platitudes, which are real positions people argue for, and which are just false. if it turns out nobody actually says "you can't lie to yourself" and im strawmanning him, or if im wrong that there are even multiple readings and its all one boring thing, just tell me straight, dont make up a list to be nice. and flag where youre unsure, id rather have an honest messy answer than a confident fake one.
