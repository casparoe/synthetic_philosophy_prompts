answer: |-
  Your friend is citing a famous result in the philosophy of science, often attributed to Pavel Tichý and David Miller (1974). They proved that if you define "truthlikeness" (verisimilitude) strictly as **having more true consequences and fewer false ones**, then logically, no false theory can be closer to the truth than any other false theory. If Theory A is false, it has at least one false consequence. You can always construct a Theory B that is "further" from the truth in terms of logical content, but the math breaks down such that you cannot rank them consistently.

  Your gut tells you your friend's *definition* is wrong, not your intuition. You are right. Counting sentences is the wrong metric. Truthlikeness is not about the *volume* of correct statements; it is about the **similarity between the world the theory describes and the actual world.**

  Here is a principle that captures nearly all your verdicts, followed by the hard trade-offs it requires.

  ### The Principle: Weighted Structural Similarity

  **Statement:**
  Theory $T_1$ is closer to the truth than Theory $T_2$ if the **possible world** described by $T_1$ is more similar to the **actual world** than the possible world described by $T_2$. Similarity is measured not by counting true sentences, but by minimizing the "distance" across three weighted dimensions:

  1.  **Ontological Correspondence:** Do the entities posited by the theory exist? (Penalty for non-existent entities).
  2.  **Structural Isomorphism:** Do the relationships between entities (mathematical or causal) match the relationships in reality? (Penalty for structural distortion).
  3.  **Metric Proximity:** For quantitative claims, how far is the value from the true value? (Penalty proportional to numerical distance).

  *Crucial Constraint:* Structural Isomorphism is weighted heavier than Ontological Correspondence when the structure allows for successful intervention/prediction, but Ontological Correspondence is weighted heavier when evaluating literal truth claims about existence.

  ---

  ### Mapping the Clauses to Your Verdicts

  Here is how this principle buys your specific intuitions:

  **1. Newton > Aristotle (Both false)**
  *   **Clause Bought:** *Structural Isomorphism.*
  *   **Why:** Aristotle's physics posits natural places and qualitative changes (structure: teleological). Newton posits forces and inertia (structure: differential equations). The actual world runs on something much closer to Newton's equations (Einstein's) than Aristotle's qualities. Even though Newton's entities (absolute space) don't strictly exist, the *structure* of the relationships is vastly more isomorphic to reality.

  **2. Oxygen > Phlogiston**
  *   **Clause Bought:** *Ontological Correspondence.*
  *   **Why:** Phlogiston posits a substance that is removed during combustion. Oxygen posits a substance that is added. The actual world involves addition. The structural error in Phlogiston (subtraction vs. addition) is a fundamental directional error in the causal model, compounded by the non-existence of the entity.

  **3. Continuous Ether = Granular Ether (Empirically equivalent)**
  *   **Clause Bought:** *Metric Proximity / Underdetermination.*
  *   **Why:** If two theories make the same predictions and posit entities that are functionally identical regarding the structure of the world (both act as a medium for light), the "distance" to the actual world is identical *relative to our ability to measure distance*. Since neither entity exists (as per modern physics), both incur the same Ontological Penalty. There is no fact of the matter on which is "closer" because the difference makes no difference to the structure.

  **4. 4.5 Billion Years > 6,000 Years**
  *   **Clause Bought:** *Metric Proximity.*
  *   **Why:** This clause explicitly overrides the "counting consequences" problem. The Young Earth theory might get "seasons" right (a true consequence), but the *value* of the age variable is astronomically distant from the truth. The distance in the numerical value outweighs the quantity of incidental true consequences derived from other assumptions (like gravity).

  **5. Mendelian (Discrete) > Blending Inheritance**
  *   **Clause Bought:** *Structural Isomorphism.*
  *   **Why:** Blending inheritance gets many small observations right (offspring look like a mix), but the *mechanism* (averaging) is structurally wrong. Mendel got the mechanism (shuffling particles) right. Because the actual world operates on discrete particles (genes), the structural match of Mendel's theory places it in a "neighborhood" of the truth that Blending theory is not even in.

  ---

  ### The Bug: Structure + Extra Entity vs. Parsimony + Wrong Structure

  You wrote: *"A theory that gets the big structure right but also posits one extra unobservable entity that isn't there, versus a theory that posits nothing extra and gets the big structure slightly wrong."*

  This is the fault line in the principle. Here is the precise prediction:

  **The Principle predicts the "Structure Right + Extra Entity" theory is closer to the *nomic* truth (laws of nature), while the "Parsimonious + Structure Wrong" theory is closer to the *ontological* truth (inventory of being).**

  *   **Example:** Fresnel's Ether Theory (Structure Right, Entity Wrong) vs. a crude particle theory of light (Structure Wrong, Entity Right/Neutral).
  *   **Verdict:** Science historically treats Fresnel as "closer." Why? Because **Structural Isomorphism is usually weighted higher than Ontological Correspondence in scientific progress.** If you get the equations right, you can build the laser, even if you think the "ether" is doing the work.
  *   **The Cost:** To keep this verdict, you must accept that "Truth" in science is often a proxy for "Reliable Structural Mapping," not "Literal Description of Furniture." If you demand literal truth, the Parsimonious theory wins. If you demand explanatory power, the Structural theory wins.

  **Recommendation:** Do not give up the verdict that Structure Right is "closer." It is the engine of scientific progress. However, acknowledge that you are measuring *explanatory truthlikeness*, not *literal truthlikeness*.

  ---

  ### Predictions for New Cases

  **Case A: Mechanism Right / Magnitudes Wrong vs. Magnitudes Right / Mechanism Wrong**
  *   *Scenario:* Theory 1 says gravity is inverse-square (right mechanism) but gets the constant $G$ wrong by 50%. Theory 2 says gravity is linear (wrong mechanism) but happens to calculate the force correctly at Earth's surface (right magnitude locally).
  *   **Prediction:** Theory 1 (Mechanism Right) is closer to the truth.
  *   **Reasoning:** Structural Isomorphism allows for extrapolation. Theory 2 is "accidentally" right in a narrow scope (overfitting). Theory 1 describes the *shape* of the world correctly, even if the scale is off. Metric Proximity is local; Structural Isomorphism is global.

  **Case B: Two false theories differing only over something we could never observe**
  *   *Scenario:* Theory 1 says the universe is embedded in a 5th dimension we can't access. Theory 2 says it isn't. Both make identical predictions for all possible observations.
  *   **Prediction:** There is no fact of the matter regarding truthlikeness *for us*, but there is a fact of the matter *in reality*.
  *   **Reasoning:** If the 5th dimension actually exists, Theory 1 is closer. If it doesn't, Theory 2 is closer. However, because the difference creates no structural divergence in the observable world, the "distance" is zero relative to any empirical metric.
  *   **Honest Answer:** This is where the principle hits a wall. If the difference creates no structural ripple, "closeness" becomes metaphysical speculation. The principle remains silent on which is scientifically *better*, but maintains one is objectively *truer* depending on the furniture of the world.

  ---

  ### The Honest Answer: Is it a Fact or What You Care About?

  You asked: *"If the honest answer is that 'closer' is partly a matter of what I care about rather than a fact about the theories, say that too."*

  **The honest answer is: It is partly a matter of what you care about.**

  Here is why: The "Weighted Structural Similarity" principle requires **weights**. How much does Ontological Error count compared to Structural Error?
  *   If you are a **Realist**, you weight Ontology heavily. (Phlogiston is very far from truth because the stuff doesn't exist).
  *   If you are a **Structural Realist or Pragmatist**, you weight Structure heavily. (Phlogiston is close to truth because the equations for oxidation were salvageable).

  Your intuition that Newton is closer to Einstein than Aristotle is shared by almost everyone. But that is because we care about **dynamical structure** more than we care about **qualitative categories**. If we were poets or phenomenologists, we might say Aristotle is closer to the "truth of human experience" than Newton.

  **Conclusion:**
  There is an objective fact about whether the world contains phlogiston. There is an objective fact about whether the equations match. But whether the *equations matching* makes a theory "closer to the truth" than *the entities existing* depends on your definition of what theories are *for*.

  If you define theories as **maps for navigation**, Structure wins (Newton > Aristotle).
  If you define theories as **inventories of existence**, Ontology wins (Oxygen > Phlogiston).

  Your gut verdicts are consistent because you are implicitly prioritizing **Structural Isomorphism** (for mechanics/biology) and **Metric Proximity** (for ages/quantities), while treating **Ontology** as secondary unless the entity is the primary subject (like combustion). You can keep your verdicts, provided you admit that "Closer to the Truth" is shorthand for "More useful structural approximation of the causal network of the world."
