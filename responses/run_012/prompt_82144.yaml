          *   Revocation triggers.
      *   **The "Flip" Question:** Explicitly address whether bad evals change the decision.
          *   Yes, I would block.
          *   Explanation: Rule 4.3 shifts the burden of proof. Normally, process compliance + passing evals = cert. Here, process failed. So the eval bar must be *higher* than usual to overcome the presumption of risk. If evals were bad, the presumption stands. If evals are good, the presumption is rebutted, but the breach remains punishable. This isn't pure outcome-based; it's outcome-based *within* a procedural framework that penalizes uncertainty.

  4.  **Refining and Editing (Word Count Check):**
      *   Need to be concise.
      *   Ensure American English.
      *   Make sure the conditions are clear.
      *   Ensure the "Flip" argument is clear (this is the tricky philosophical part).

