          *   Acknowledge Side B (Outcome): They are right that blocking a demonstrably safe model based on a proxy when we have direct evidence is irrational risk management.
          *   Synthesis: We certify because the harm evidence is robust, but we attach conditions to ensure Rule 4.3 isn't rendered moot.
      *   **Conditions:** Specific, time-bound, actionable.
