      Y-axis: P1's Expected Payoff.
      Line T: $3q + 0(1-q) = 3q$.
      Line M: $0q + 3(1-q) = 3 - 3q$.
      Line B: $1q + 1(1-q) = 1$.
      Plot these. T and M form a V-shape (or inverted V depending on view). The lower envelope of T and M is always above B (which is flat at 1) for $q \in (1/3, 2/3)$. Actually, the *upper* envelope of T and M is the best response. The *convex hull* of T and M payoffs lies strictly above B's payoff line everywhere.
