prompt: |-
  I teach the mixed-strategy recitation in a first-year graduate game theory course: twenty students, eighty minutes, whiteboard only, no handouts. Roughly half are economists and half come from computer science theory. They have had the lectures on mixed strategies and on Nash equilibrium; they can solve a two-by-two mixed equilibrium by hand, and they know what a strictly dominated pure strategy is. What they have not seen is dominance by a mixed strategy. In one session I have to teach four things: that a strategy can be strictly dominated by a lottery over its rivals even when no single rival strategy dominates it; the picture that makes that fact feel necessary rather than lucky; what happens when the elimination is iterated; and what survives at the end, and what that result is and is not good for as a solution concept.

  I would like one game to carry the whole session, and I have built this one. Player 1 has Top, Middle, Bottom; player 2 has Left, Right. Payoffs are written with player 1's first.

  | | Left | Right |
  |---|---|---|
  | Top | 3, 2 | 0, 0 |
  | Middle | 0, 2 | 3, 0 |
  | Bottom | 1, 0 | 1, 5 |

  My instinct is that this single matrix can do all the work. I would rather be told now that it cannot than find out in front of them.

  Plan the session for me. I need:

  - the order in which the ideas have to come, with the dependencies made explicit: what must already be in place before each step, and what specifically goes wrong for a student who is handed a later step without its predecessor;
  - a verdict on the game above as the carrying example, with the features of it that are doing work at each point where it reappears, and the point at which the students rather than I should be the ones to produce the dominating mixture; if it should be replaced or supplemented, what the replacement must have that mine lacks (or the reverse), and where in the sequence it belongs;
  - the misconceptions they will arrive with or form. My guess is that the big one is that a dominated strategy is one the opponent can punish, followed by treating the dominating mixture as something the player actually plays, and by reading survival of the elimination as a licence to play the survivor; for each, the precise point in the sequence at which it should be headed off, and what I should say there;
  - one question or short task for the last ten minutes that separates a student who can run the arithmetic from one who sees why the mixture test is the right test and the pure-strategy test only a special case of it;
  - what I should deliberately leave out and announce that I am leaving out. I am already inclined to skip the separating-hyperplane proof and the common-knowledge-of-rationality foundations; tell me whether that is right, and rule on whether to say anything at all about weak dominance and its order-sensitivity, and about how much of this picture survives with three or more players, where the clean two-player equivalence between strict dominance and never being a best response stops being clean.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** First-year graduate game theory recitation (80 mins, whiteboard only, 20 students).
      *   **Audience:** Mixed background (Econ + CS Theory). Knows basic mixed strategies, NE, 2x2 solving, strict dominance by *pure* strategies. Does *not* know dominance by *mixed* strategies.
      *   **Goal:** Teach four things: (1) Mixed strategy dominance exists (even if pure doesn't dominate); (2) The geometric intuition ("the picture"); (3) Iterated elimination (IESDS); (4) Interpretation of the result (what it is/isn't good for).
      *   **Constraint:** Use *one* game to carry the whole session (the provided 3x2 matrix).
      *   **Deliverables:** Order of ideas/dependencies, verdict on the game, misconceptions to head off, final assessment task, what to leave out.

  2.  **Evaluate the Proposed Game:**
      *   *Matrix:*
          *   P1: T, M, B
          *   P2: L, R
          *   Payoffs (P1, P2):
              *   T: (3, 2), (0, 0)
              *   M: (0, 2), (3, 0)
              *   B: (1, 0), (1, 5)
      *   *Check for Pure Dominance (P1):*
          *   T vs M: 3>0, 0<3 (No)
          *   T vs B: 3>1, 0<1 (No)
          *   M vs B: 0<1, 3>1 (No)
          *   *Result:* No pure strategy strictly dominates another for P1.
      *   *Check for Mixed Dominance (P1):*
          *   Can a mix of T and M dominate B?
          *   Let $\sigma_1 = p T + (1-p) M$.
          *   Against L: $3p + 0(1-p) = 3p$. Need $3p > 1$ (Payoff of B). So $p > 1/3$.
          *   Against R: $0p + 3(1-p) = 3 - 3p$. Need $3 - 3p > 1$. So $3p < 2 \Rightarrow p < 2/3$.
          *   *Result:* Yes! Any $p \in (1/3, 2/3)$ makes the mix strictly better than B against both L and R.
          *   *Specific Mix:* $p=1/2$ gives expected payoff 1.5 against L and 1.5 against R. Both > 1.
      *   *Check for P2:*
          *   L vs R: 2>0, 0<5 (No).
          *   Does P2 have mixed dominance? Only 2 strategies, so no non-trivial mixes.
      *   *Iterated Elimination:*
          *   Step 1: Eliminate B (dominated by 0.5T + 0.5M).
          *   Remaining: T, M for P1; L, R for P2.
          *   Step 2: Look at P2.
              *   If P1 plays T: P2 gets 2 (L) vs 0 (R).
              *   If P1 plays M: P2 gets 2 (L) vs 0 (R).
              *   L strictly dominates R for P2 (2>0 in both cases).
          *   Remaining: T, M for P1; L for P2.
          *   Step 3: Look at P1.
              *   Against L: T gives 3, M gives 0.
              *   T dominates M.
          *   *Survivor:* (T, L).
      *   *Nash Equilibrium Check:*
          *   (T, L) is a pure NE (3,2). No incentive to deviate.
          *   Are there others?
          *   If P2 plays L, P1 plays T.
          *   If P2 plays R, P1 plays M.
          *   If P1 plays T, P2 plays L.
          *   If P1 plays M, P2 plays L.
          *   If P1 plays B... B is dominated, so unlikely in NE.
          *   Wait, check (M, L). P1 gets 0, could switch to T (3). Not NE.
          *   Check mixed NE in reduced game {T,M} x {L,R}.
              *   P2 must be indifferent? No, L dominates R in the reduced game after B is gone. So P2 plays L.
              *   If P2 plays L, P1 plays T.
              *   So (T,L) is the unique rationalizable outcome / IESDS survivor.
      *   *Verdict:* This game is **excellent**. It requires mixed dominance to start the elimination process. Once B is gone, it simplifies to a game where pure dominance takes over for P2, then P1. It leads to a unique survivor. It fits all criteria.

  3.  **Plan the Sequence (Dependencies):**
      *   *Concept 1: Definition of Mixed Dominance.* Must define what it means for $\sigma$ to dominate $s$. Needs expected utility calculation.
      *   *Concept 2: Existence.* Show it happens in *this* game. (B is dominated by mix of T/M).
      *   *Concept 3: Geometry.* Why does this happen? Convexity. The set of best responses. The "picture" is the payoff space.
      *   *Concept 4: Iteration.* Once B is gone, the game changes. P2's incentives change relative to the remaining set.
      *   *Concept 5: Interpretation.* Rationalizability vs. NE. IESDS survivors are rationalizable. NE must be in the set, but not all survivors are NE (though in this specific game, the unique survivor *is* the unique NE). *Correction:* I need to be careful here. If the survivor is unique, it *is* the unique NE. I need to make sure they don't think IESDS *always* finds NE or that survivors are always NE (in general games). But in *this* game, it does. I need to generalize the lesson beyond the specific numbers.
      *   *Dependencies:*
          *   Can't do Iteration before defining Dominance.
          *   Can't do Geometry before seeing the Arithmetic (otherwise the geometry is abstract).
          *   Can't do Interpretation before seeing the Result.

  4.  **Identify Misconceptions:**
      *   *Misconception 1:* "Dominated means the opponent punishes me." (Correction: It means *I* do worse regardless of what they do).
      *   *Misconception 2:* "The dominating mixture is a strategy I play." (Correction: It's a benchmark. I don't need to randomize to eliminate the dominated strategy; I just need to know I *could* do better by randomizing, so I shouldn't play the dominated pure strategy).
      *   *Misconception 3:* "Survivors are safe to play / are NE." (Correction: IESDS yields Rationalizable strategies. NE is a subset. In 2-player games, IESDS survivors = Rationalizable = Best Response to some belief. NE requires consistent beliefs).
      *   *Misconception 4:* "Order matters." (For *strict* dominance, order doesn't matter. For *weak*, it does. Need to clarify strictness).

  5.  **Drafting the Session Plan (80 mins):**
      *   0-10: Setup & Pure Dominance Check. (Establish B is not purely dominated).
      *   10-25: Mixed Dominance Discovery. (Find the mix).
      *   25-40: The Geometry. (Draw the payoff lines).
      *   40-55: Iteration. (Eliminate B, then R, then M).
      *   55-70: Interpretation. (Rationalizability vs NE).
      *   70-80: Assessment Task.

  6.  **Refining the "What to Leave Out":**
      *   *Separating Hyperplane:* Definitely leave out. Too technical for recitation.
      *   *Common Knowledge:* Mention briefly as the engine of iteration, but don't derive epistemic conditions.
      *   *Weak Dominance:* **Crucial.** Must explicitly distinguish strict vs. weak. If you mix strict and weak, order matters. Since the prompt asks about strict dominance primarily, I should warn them that this clean logic breaks with weak dominance.
      *   *3+ Players:* Mention that the "Never Best Response" equivalence holds for 2 players but gets messy with 3+. (Actually, for 2 players, Strictly Dominated $\iff$ Never a Best Response. For 3+, a strategy can be never a best response but not strictly dominated by any mixed strategy. This is a subtle point. Maybe too subtle? The prompt asks me to rule on it. I should say: Mention it exists, but don't prove it. It motivates why we care about mixed dominance).

  7.  **Developing the Final Task:**
      *   Need to distinguish "can do arithmetic" from "understands the test".
      *   Arithmetic: Solve for $p$.
      *   Understanding: Why do we compare expected payoff against *all* opponent profiles, not just the equilibrium one?
      *   Task: Give a strategy that is a Best Response to *some* belief but is dominated by a mix. Or vice versa?
      *   Better Task: Give a 3x3 where a strategy is not dominated by any *pure* strategy, but is dominated by a *mix*. Ask them to identify it.
      *   Even Better (Conceptual): Ask why we check against *all* opponent strategies, not just the ones that survive elimination. (Because dominance is about the original game structure).
      *   Best Task (per prompt): "Separates a student who can run the arithmetic from one who sees why the mixture test is the right test."
      *   Idea: Present a strategy $S$. It yields 5 against L, 0 against R. A mix of others yields 4 against L, 4 against R.
      *   Arithmetic student: "4 < 5, so not dominated."
      *   Conceptual student: "Wait, is L possible? If L is impossible (eliminated), then S is dominated. But dominance is defined on the *current* set of opponent strategies."
      *   Actually, the prompt asks about "why the mixture test is the right test and the pure-strategy test only a special case."
      *   Task: Construct a small example where Pure Test fails but Mixed Test succeeds. (Basically ask them to construct the T/M/B logic themselves in a new context).
      *   Let's refine: Give them a payoff vector for a strategy $X$: $(2, 2)$. Give them two other strategies $Y: (3, 0)$ and $Z: (0, 3)$. Ask: "Is $X$ dominated?"
      *   Arithmetic check: $Y$ doesn't dominate (0<2). $Z$ doesn't dominate (0<2).
      *   Conceptual check: Mix $Y$ and $Z$ 50/50 -> $(1.5, 1.5)$. Wait, that's worse.
      *   Let's try $Y: (4, 0)$, $Z: (0, 4)$. Mix 50/50 -> $(2, 2)$. Indifferent. Need strict. $Y: (5, 0), Z: (0, 5)$. Mix -> $(2.5, 2.5)$. Dominates $(2,2)$.
      *   Task: "Here are payoffs for A, B, C against Opponent's L, R. A=(2,2), B=(5,0), C=(0,5). Is A dominated? Show why checking B vs A and C vs A is insufficient."

  8.  **Reviewing against Constraints:**
      *   *Whiteboard only:* Keep calculations simple.
      *   *80 mins:* Tight. Need to keep the geometry quick.
      *   *Econ + CS:* CS likes the algorithm/geometry. Econ likes the intuition/interpretation. Balance both.
      *   *One Game:* Stick to the 3x2 provided.

  9.  **Final Polish of the Plan:**
      *   *Verdict:* The game works.
      *   *Sequence:* Pure Check -> Mixed Discovery -> Geometry -> Iteration -> Interpretation.
      *   *Misconceptions:* "Opponent Punishment", "Randomizing is Required", "Survivor = NE".
      *   *Leave Out:* Hyperplane proofs. Weak dominance details (just a warning). 3-player nuances (just a warning).
      *   *Task:* The (2,2) vs (5,0)/(0,5) example.

      *Self-Correction on Iteration:* In the provided game, after B is eliminated, P2 has L (2,2) and R (0,0). L strictly dominates R. Then P1 has T (3) and M (0) against L. T dominates M. Unique survivor (T,L).
      *Wait, check P2 payoffs again.*
      T: (3, **2**), (0, **0**)
      M: (0, **2**), (3, **0**)
      B: (1, **0**), (1, **5**)
      If B is gone:
      P2 faces T or M.
      If P1=T: P2 gets 2 (L) or 0 (R).
      If P1=M: P2 gets 2 (L) or 0 (R).
      L gives 2, R gives 0. L strictly dominates R.
      So R is eliminated.
      Now P1 faces L.
      T gives 3. M gives 0. T dominates M.
      Survivor (T, L).
      This flow is clean.

      *One nuance:* The prompt asks about "what that result is and is not good for as a solution concept."
