      Actually, in 2-player games, the set of strategies surviving IESDS is exactly the set of Rationalizable strategies. And every NE survives IESDS.
      So IESDS is a *pre-processing* step for NE. It reduces the search space. It is not a complete solution concept (often leaves multiple strategies). In *this* game, it solves it completely. I must emphasize that this is a lucky feature of this specific game, not a general property of IESDS.

      *Misconception Check:* "Treating the dominating mixture as something the player actually plays."
      I need to be very clear: You eliminate B because you *could* play the mix. You don't *have* to play the mix. You might end up playing T (pure). The mix is just the *witness* to the stupidity of playing B.

