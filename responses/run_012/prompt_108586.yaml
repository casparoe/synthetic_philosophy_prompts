answer: |-
  ### Verdict on the Game
  **Keep it.** This matrix is exceptionally well-suited for a single-session recitation. It is minimal (3x2) but dense enough to require all four learning objectives.

  *   **Why it works:**
      1.  **Pure Dominance Check:** Student verification that no pure strategy dominates another for Player 1 (P1) establishes the *need* for mixed dominance.
      2.  **Mixed Dominance:** Bottom (B) is strictly dominated by a 50/50 mix of Top (T) and Middle (M). The arithmetic is clean ($1.5 > 1$).
      3.  **Geometry:** The payoff lines for T and M form an inverted "V" with a peak at 1.5. B is a flat line at 1. The visual gap makes the domination feel structural, not numerical.
      4.  **Iteration:** Once B is removed, Player 2 (P2) faces a 2x2 where Left strictly dominates Right. Once Right is removed, P1 faces a 1x1 where Top dominates Middle.
      5.  **Uniqueness:** The process yields a unique survivor (Top, Left), which allows you to discuss the relationship between IESDS and Nash Equilibrium without getting bogged down in multiple survivors.

  **One Warning:** The payoffs for Player 2 must be written clearly on the board. Students often ignore the second number until the iteration step. Ensure they see that P2's payoffs drive the *second* round of elimination.

  ---

  ### Session Plan: Order and Dependencies (80 Minutes)

  **00:00 – 00:10: Setup and Pure Strategy Check**
  *   **Action:** Write the matrix. Ask students to check for strictly dominated *pure* strategies for P1.
  *   **Dependency:** Requires definition of strict dominance ($u(s) > u(s')$ for all opponent profiles).
  *   **Goal:** Establish that T, M, and B are all "undominated" in the pure sense.
  *   **Risk if skipped:** If you jump straight to mixing, students will think mixed dominance is a magic trick rather than a generalization of a test they already know failed.

  **00:10 – 00:25: The Mixed Dominance Discovery**
  *   **Action:** Ask: "Can we beat Bottom using a lottery over Top and Middle?" Let a student propose $\sigma = 0.5T + 0.5M$. Calculate expected payoffs against L and R.
  *   **Dependency:** Requires linearity of expected utility.
  *   **Goal:** Show $1.5 > 1$ in both columns. Eliminate B.
  *   **Risk if skipped:** Without the arithmetic, the geometric picture later is just art. They need to see the inequality holds for *every* column.

  **00:25 – 00:40: The Geometry (The "Picture")**
  *   **Action:** Draw axes: X = Prob(P2 plays Left), Y = P1's Expected Payoff. Plot lines for T, M, and B.
  *   **Dependency:** Requires understanding that a mixed strategy creates a convex combination of payoff lines.
  *   **Goal:** Show that the "hull" of T and M lies strictly above B everywhere. This explains *why* B is irrational: it is below the "efficiency frontier" of P1's options.
  *   **Risk if skipped:** Students treat the 50/50 mix as a specific lucky guess rather than understanding that *any* mix in the range $(1/3, 2/3)$ works. The picture generalizes the arithmetic.

  **00:40 – 00:55: Iterated Elimination (IESDS)**
  *   **Action:** Erase B. Ask P2 to look at the remaining 2x2. Eliminate Right. Erase Right. Ask P1 to look at the remaining 1x2. Eliminate Middle.
  *   **Dependency:** Requires **Common Knowledge of Rationality**. P2 eliminates Right only because P2 knows P1 will not play B.
  *   **Goal:** Demonstrate the algorithm.
  *   **Risk if skipped:** Students often eliminate everything simultaneously. They must see the *sequential* dependency: P2's elimination depends on P1's prior elimination.

  **00:55 – 01:10: Interpretation of the Result**
  *   **Action:** Discuss the survivor (Top, Left). Is it a Nash Equilibrium? (Yes). Does IESDS always find a NE? (No). Does every NE survive IESDS? (Yes).
  *   **Dependency:** Requires definition of Nash Equilibrium.
  *   **Goal:** Distinguish between **Rationalizability** (what survives IESDS) and **Equilibrium** (consistent beliefs). IESDS is a pre-processor, not a complete solution concept.
  *   **Risk if skipped:** Students will assume IESDS is "better" than NE because it solved this game uniquely. They must understand this game is special.

  **01:10 – 01:20: Assessment Task**
  *   **Action:** Assign the conceptual task (detailed below).

  ---

  ### Misconceptions and Interventions

  | Misconception | When it arises | Intervention (What to say) |
  | :--- | :--- | :--- |
  | **"Dominated means the opponent can punish me."** | **00:10 (Discovery).** Students look at P2's payoffs to see if P2 will punish B. | "Stop. Look only at P1's numbers. Dominance is about *my* options, not the opponent's incentives. I am dominated if *I* do worse, regardless of what *they* do." |
  | **"To eliminate Bottom, I must actually play the 50/50 mix."** | **00:25 (Discovery).** Students think rationality requires randomizing. | "The mixture is a **witness**, not a requirement. You eliminate B because you *could* do better by mixing. Once B is gone, you might end up playing Top purely. The mix just proves B is stupid." |
  | **"Order of elimination matters."** | **00:40 (Iteration).** CS students especially worry about algorithmic complexity/order. | "For **Strict** dominance, order does not matter. The set of survivors is unique. (Note: This is false for Weak dominance, which we are ignoring today)." |
  | **"The survivor is the 'solution', so it must be the Nash Equilibrium."** | **00:55 (Interpretation).** Students conflate Rationalizability with NE. | "IESDS removes strategies that are *never* best responses. NE requires strategies that *are* best responses to *each other*. All NE survive IESDS, but IESDS survivors are not always NE. In this game, they happen to coincide." |

  ---

  ### Final Assessment Task (Last 10 Minutes)

  **The Task:**
  Write the following payoff vectors on the board for Player 1 against Player 2's strategies $L$ and $R$:
  *   Strategy $X$: $(2, 2)$
  *   Strategy $Y$: $(5, 0)$
  *   Strategy $Z$: $(0, 5)$

  **Questions:**
  1.  Does $Y$ strictly dominate $X$? Does $Z$ strictly dominate $X$?
  2.  Is there a mixed strategy over $\{Y, Z\}$ that strictly dominates $X$?
  3.  **Conceptual:** A student argues: "Since $X$ is not dominated by any pure strategy, it is rational to play $X$." Why is this reasoning flawed? What property of the expected utility function makes the mixture test the correct test for rationality?

  **Grading Rubric (Mental Check):**
  *   **Arithmetic Competence:** Can solve (1) and (2). (Answer: No pure dominance; Yes, 50/50 mix yields $(2.5, 2.5)$ which dominates $(2,2)$).
  *   **Conceptual Understanding:** Answers (3) by referencing **convexity** or **linearity of expectation**. The set of achievable payoffs is the convex hull of the pure strategies. If $X$ lies inside the hull of others, it is dominated, even if it isn't beaten by a vertex. The pure test only checks vertices; the mixed test checks the hull.

  ---

  ### What to Leave Out (And Announce It)

  You are correct to skip the formal proofs. Explicitly tell the students *why* you are skipping them to manage their anxiety about rigor.

  1.  **Separating Hyperplane Theorem:**
      *   *Announcement:* "The formal proof that a strategy is dominated iff it is not a best response to any belief relies on the Separating Hyperplane Theorem. We are skipping the proof today to focus on the mechanics and intuition. You will see the proof in the advanced micro theory sequence."
      *   *Reason:* It consumes 20 minutes of algebra for zero marginal gain in recitation intuition.

  2.  **Weak Dominance:**
      *   *Announcement:* "Today we deal exclusively with **Strict** Dominance. I am explicitly leaving out Weak Dominance. You must know that for Weak Dominance, the order of elimination *does* matter, and it can eliminate Nash Equilibria. Do not apply today's 'order doesn't matter' rule to problem sets involving weak dominance."
      *   *Reason:* Mixing strict and weak dominance in one session causes catastrophic confusion regarding order-independence and NE preservation.

  3.  **3+ Player Nuances:**
      *   *Announcement:* "In two-player games, a strategy survives IESDS if and only if it is a Best Response to some belief about the opponent. In games with three or more players, this equivalence breaks: a strategy can be 'never a best response' yet not be strictly dominated by any mixture. We treat the two-player case here because it is the cleanest introduction to the logic."
      *   *Reason:* This is a deep technicality (Pearce's Lemma nuances) that distracts from the core lesson of *why* we mix to find dominance.

