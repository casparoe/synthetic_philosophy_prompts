answer: |-
  **Mr. H:** You maintain the penal law is justified here. On what ground? If we speak as legislators, we must speak of mischief. Where is the pain produced?

  **Mr. L:** The pain lies in the disorder. The sexual faculty has a natural end: generation, and the marital bond upon which the rearing of children depends. An act intrinsically unfitted for that end is disordered. It undermines the structure of care and property transmission.

  **Mr. H:** You use the word 'natural'. Pray, what work is it doing? If it means merely 'unusual', it says nothing of pain or pleasure. If it means 'displeasing to God', that is a claim you cannot hand to the legislator without proof of divine sanction in civil law. If it means 'contrary to the generative function', your objection condemns a great deal of ordinary heterosexual conduct as well. Sterility is not a crime.

  **Mr. L:** Do not reduce the appeal to nature to mere disgust. It is teleological. But beyond that, you ignore the consequences. The relevant mischief is long-run and indirect. We speak of the corruption of manners, the weakening of the shame that supports marriage. This is secondary mischief, which your own system counts as part of an offence's tendency. The danger to others arising from the example set is real. A legislator who ignores this runs the calculus on too short a ledger.

  **Mr. H:** I grant that offences against morality may spread by example. But does every deviation warrant the whip? If the act involves consent and secrecy, the primary mischief is null. The suffering you cite is largely manufactured by the prohibition itself. Consider the secrecy required, the blackmail, the selective and arbitrary enforcement. The law stands charged with mischief it has itself created. Perjury is bred by a law that cannot be uniformly executed.

  **Mr. L:** You attribute that suffering to the law, but the law is merely the expression of the community's moral judgment. Repeal would itself alter the sentiments of the young. The state cannot be neutral in fact even where it professes neutrality. If you remove the sanction, you signal indifference. That signal weakens the restraint upon the passions.

  **Mr. H:** So you punish to shape sentiment? Then we must distinguish between the mischief an act itself tends to produce and the mere antipathy it excites in spectators. Antipathy, however widespread or intense, is not by itself a ground of punishment. Otherwise, every minority taste is at the mercy of the majority's stomach.

  **Mr. L:** But here is your difficulty. If the public's antipathy is itself produced by the law and by religious instruction, then your argument risks circularity. You discount the pain as law-made, but whether to keep the law is precisely what is in dispute. The argument needs an account of which preferences count and why. If you exclude preferences formed by the law, you exclude the very social cohesion the law sustains.

  **Mr. H:** I exclude them because they are fictitious pains. They exist only because we have agreed to pretend they matter. But I concede the point troubles the calculus. If tastes are endogenous to the legal regime under assessment, how do we measure the utility of changing it?

  **Mr. L:** Precisely. You wish to weigh the pain of the punished against the pain of the spectators. But if the spectators' pain vanishes only upon the repeal you propose, you cannot use their current pain to justify the law without begging the question. Yet, if you ignore it, you ignore the social reality.

  **Mr. H:** Then we arrive at the impasse. I maintain the law creates more pain than it prevents, chiefly through enforcement and blackmail. But you maintain the law prevents a decay of manners that would cause greater pain in time.

  **Mr. L:** And I maintain that your calculus cannot be run cleanly when the tastes being fed into it are shaped by the very rules you wish to judge. We disagree on whether the legislator may cultivate virtue or merely tally pains.

  **Mr. H:** Then we agree only that the ledger is closed before we can write in it.

  ***

  **Historical Note**

  It is historically secure that Jeremy Bentham wrote extensively against the punishment of "irregularities," particularly in manuscripts such as *Offences Against One's Self* (c. 1785). He consistently argued that consensual acts producing no primary mischief should not be penalised, highlighting the evils of blackmail and arbitrary enforcement. However, scholars contest whether this constitutes a principled case for sexual liberty or a narrower critique of penal efficacy that leaves moral disapproval intact. Some argue Bentham sought to privatise vice rather than vindicate it. Furthermore, the surviving manuscripts are not entirely consistent; some drafts suggest greater caution regarding public opinion than others. This dialogue takes a liberty by presenting Bentham's argument on "example" as fully resolved, whereas his texts show ongoing tension regarding the secondary mischief of bad habits. The circularity objection regarding endogenous preferences is a modern reconstruction applied to his framework.
