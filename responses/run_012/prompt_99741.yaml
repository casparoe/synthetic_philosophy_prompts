answer: |-
  This is not a weird question; it is one of the hardest questions in ethics and neuroscience. You are asking for the "specification" of moral status. You want to know the necessary and sufficient conditions for an entity to be a "subject of a life" rather than a "thing that processes inputs."

  Your roommate's plant analogy is the standard skeptical counter-argument (the "mimicry" objection), and your observation of the shrimp is the standard intuition pump for sentience (the "behavioral complexity" argument). Both are incomplete.

  To build a theory of welfare that doesn't collapse into anthropomorphism (projecting human feelings onto rocks) or mechanistic nihilism (treating screaming animals like toasters), the theory must satisfy the following specification.

  ### The Specification for a Theory of Welfare

  A credible theory must satisfy these five criteria. If it fails one, it is either too broad (includes plants) or too narrow (excludes infants or animals we intuitively know suffer).

  #### 1. The Nociception vs. Affective Experience Distinction
  *   **The Requirement:** The theory must distinguish between *detecting damage* (nociception) and *minding the damage* (pain/suffering).
  *   **Why it's on the list:** Your nervous system pulls your hand from a hot stove before your brain registers pain. That is a reflex arc. A theory of welfare cannot classify a reflex as a moral wrong. Plants detect damage (chemical signals when cut) but there is no evidence they "mind" it.
  *   **The Case it Handles:** The crab claw jerk. If the claw is severed and twitches, that is nociception/reflex. If the crab guards the wound and stops eating, that is affective experience.

  #### 2. The Motivational Trade-Off Test
  *   **The Requirement:** The entity must demonstrate that it will incur a cost to avoid a stimulus, or endure a stimulus to gain a reward, in a way that is flexible, not fixed.
  *   **Why it's on the list:** This is the strongest behavioral evidence for an internal state. A robot follows code. A sentient being weighs competing drives (hunger vs. safety).
  *   **The Case it Handles:** The "shock to get to shelter" case. If a shrimp will cross an electrified grid to hide, but won't cross it for food, it values safety over hunger. If it learns to cross the grid *faster* to minimize shock, it is not just reacting; it is strategizing around a negative experience.

  #### 3. Pharmacological Modulation
  *   **The Requirement:** The behavior must change when given an analgesic (painkiller) in a way that is distinct from general sedation.
  *   **Why it's on the list:** If you give a human morphine, they still feel the touch, but they care less about the pain. If you give a shrimp an analgesic and it stops grooming a wound or returns to the electrified grid immediately, it suggests the *negative valence* of the experience was chemically altered, not just the motor function.
  *   **The Case it Handles:** The painkiller case. If the shrimp still detects the shock (flinches) but doesn't avoid it (doesn't care), you have isolated the "suffering" component from the "sensing" component.

  #### 4. Centralized Integration (The "Roommate" Filter)
  *   **The Requirement:** The system must have a centralized processing hub that integrates disparate sensory inputs into a unified state.
  *   **Why it's on the list:** This kills the plant analogy. Plants react locally via hormones. A leaf turns to light without the root "knowing." Animals have a central nervous system (or ganglia) that creates a "global" state. Welfare requires a "someone" to whom the whole picture matters.
  *   **The Fact it Can't Contradict:** Evolution. Centralization evolves to coordinate movement in complex environments. If an animal has a brain/ganglia complex enough to coordinate hunting, hiding, and mating, it likely has the hardware to integrate "hurt" into those decisions.

  #### 5. Long-Term Behavioral Modification (Learning)
  *   **The Requirement:** The negative experience must alter future behavior in a way that persists beyond the immediate stimulus.
  *   **Why it's on the list:** Reflexes are immediate. Suffering implies memory and anticipation. If the shrimp hides for a day after being bullied, it is holding a state of "fear" or "stress" in the absence of the threat.
  *   **The Case it Handles:** Your hiding shrimp. The bullying happened, the food is gone, but the shrimp is still hiding. That is an internal emotional state, not a reflex.

  ---

  ### The Lines That Cannot Be Blurred

  To remain rigorous, the theory must keep these concepts separate. Blurring them is where most arguments fail.

  1.  **Capacity vs. Degree:** Being *someone-who-can-be-hurt* is binary (either you have welfare or you don't). *How much* you can be hurt is a gradient. A theory cannot say "shrimp feel pain but it counts for 1% of what a dog feels." It must say "shrimp have welfare," and then separately calculate the *intensity* based on neural complexity.
  2.  **Interests vs. Preferences:** A preference is "I want this now." An interest is "This is good for the continuity of my existence." A robot can have preferences (programmed goals). Only a sentient being has interests (a stake in its own future).
  3.  **Damage vs. Badness:** Tissue damage is physical. "Badness" is a valuation. A theory must explain how physical damage becomes a "bad" thing for the subject.

  ---

  ### The Incompatibilities (Where the Theory Breaks)

  You suspected that not all requirements can hold at once. You are correct. Here are the three major tensions that prevent a perfect theory:

  **1. The Substrate Tension (Neuroscience vs. Behavior)**
  *   *Conflict:* If you require a specific brain structure (like a neocortex) for pain, you exclude birds, octopuses, and likely shrimp, despite them showing all the behavioral signs of pain. If you rely only on behavior, you risk including advanced AI or robots that mimic pain without feeling it.
  *   *The Contradiction:* We cannot verify internal experience (qualia) objectively. We only have behavior and anatomy. A theory must choose: do we trust the behavior (shrimp acts hurt = hurt) or the hardware (shrimp lacks cortex = no hurt)? Current science (e.g., the Cambridge Declaration on Consciousness) is moving toward **function over substrate**, acknowledging that different brains can produce similar conscious states.

  **2. The Evolutionary Parsimony Tension**
  *   *Conflict:* Evolution favors efficiency. Pain is metabolically expensive and risky (it distracts from survival). The "robot" argument says evolution wouldn't waste energy on "feeling" hurt if a reflex works. The "welfare" argument says reflexes aren't flexible enough for complex environments; "feeling" is a data-compression tool for complex decision-making.
  *   *The Contradiction:* You cannot simultaneously hold that "animals are perfectly evolved machines" and "animals feel pain." If they are machines, pain is unnecessary. If they feel pain, they are not just machines.

  **3. The Epistemic Tension (The Solipsism Problem)**
  *   *Conflict:* You can never prove another human feels pain, let alone a shrimp. You infer it from similarity to yourself.
  *   *The Contradiction:* A rigorous theory demands proof of subjectivity. But subjectivity is inherently private. Therefore, a theory that demands *proof* of feeling will conclude *nothing* has welfare (including humans). A theory that accepts *inference* risks projection.

  ---

  ### The Single Knockout Requirement

  If you want to test any theory of animal welfare, apply this single requirement. It eliminates the most common bad arguments from both sides.

  **The Requirement: Evidence of Conflicting Goal Integration.**

  *   **Definition:** The entity must demonstrate a situation where two innate drives conflict (e.g., flee vs. feed, groom vs. hide), and the entity resolves the conflict based on the *intensity* of a negative stimulus, not a fixed hierarchy.
  *   **Why it knocks out the "Robot/Reflex" Theory:** A simple machine follows a fixed hierarchy (If Danger > Run). It does not say "I am hungry enough to risk this much danger." The shrimp that shoves others for food but hides after bullying is showing a dynamic valuation of risk vs. reward.
  *   **Why it knocks out the "Plant" Theory:** Plants do not have conflicting goals that require central arbitration. A root does not stop growing toward water because the leaf is "stressed." They operate via distributed chemical gradients, not integrated decision-making.
  *   **Why it knocks out "Human-Only" Theories:** It does not require a human cortex. It only requires a system capable of weighing costs. This opens the door for cephalopods and decapods (shrimp/crabs) which have complex ganglia capable of this integration, without requiring them to have a human-like brain.

  ### Application to Your Tank

  Based on the "Spec" above, here is where your shrimp stand:

  1.  **Nociception:** They definitely have this (they react to touch/heat).
  2.  **Trade-Offs:** Your observation of them shoving each other and the one hiding indicates social hierarchy and risk assessment. The hiding shrimp is prioritizing safety over food (a trade-off).
  3.  **Integration:** Decapods have a complex nervous system with centralized ganglia. They are not just distributed nerves like a starfish.
  4.  **Legal Precedent:** The UK Animal Welfare (Sentience) Act 2022 officially recognizes decapod crustaceans as sentient beings based on reviews of evidence matching the criteria above (specifically trade-offs and learning).

  **The Verdict on Your Intuition:**
  You are not merely projecting. The behavior you are seeing (hiding for a day, social bullying) exceeds simple nociception. It indicates an internal state that persists over time.

  However, the "Boiling Alive" question introduces the **Degree** problem. Even if they have welfare, does it equate to a mammal's? We don't know. But the **Spec** dictates that if they meet the criteria for having a "someone" home (integration, trade-offs, learning), then causing them gratuitous suffering (boiling without stunning) is a moral wrong, regardless of whether their "pain" feels exactly like yours.

  Your roommate's plant argument fails because plants do not integrate information to resolve conflicting goals. Your shrimp do. That is the line.
