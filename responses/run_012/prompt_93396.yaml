  1.  **Select the Wasp.** It is the superior spine. A thermostat lacks agency; a chess engine lacks biology. The wasp must have *purposeful action* to mimic will, but lack *reflective interruption* to mimic determinism. This biological tension forces the audience to confront agency in living things, making the leap to human behavior less abstract than a machine analogy. It must have *goal-directed behavior* to seem like choice, but lack *meta-cognition* to seem like a machine.

  2.  **Narrate the Loop.** Recount the Peckham experiment vividly. Inspect, drag, reset. Repeat. Define Hofstadter's "sphexishness" as blind adherence to script. Ensure the description emphasizes the *wasted effort*, not just the repetition.

  3.  **Mirror to Humans.** Ask for human analogues immediately. **[Head off Misconception 1: "Rigidity is for insects, flexibility is what we have."]** Intercept this before they comfort themselves. Ask: "What script do you follow when you think you are choosing?" Demand examples of human loops (grief rituals, ideological echo chambers, habitual routes). Establish that human flexibility is often just a loop one level up, not an escape from looping.

  4.  **Analyze the Escape.** If we step out, what pushes us? **[Head off Misconception 2: "Flexible just means unpredictable or random."]** Intercept when they propose "surprise" as freedom. Ask: "Is a seizure free will?" Distinguish agency from noise. A glitch isn't freedom. If the escape is caused, it is a larger loop; if uncaused, it is mere noise. Neither grants traditional free will.

  5.  **Locate the Will.** Where is the "I" in this chain? **[Head off Misconception 3: "Free will requires being able to have done otherwise in that very moment."]** Intercept when they demand alternate possibilities. Ask: "If you chose differently due to a prior cause, was it truly you?" Challenge the idea that freedom requires breaking causality. Suggest freedom might be the *shape* of the loop (self-correction), not the escape from it.

  6.  **Handle Ethology.** If challenged that real wasps adapt, concede the biology but retain the parable. State: "We are not studying *Sphex ichneumoneus*; we are studying the concept of determinism." The example must lack biological nuance to preserve philosophical clarity. It is an archetype, not a monograph. If you defend the wasp's biology, you lose the philosophical point. Let the wasp be imperfect biology to be perfect philosophy.

  7.  **Close.** Ask: "If inspecting the entrance ensures safety, but prevents entry, is the safest life the one never lived?" This tests if they see the trap of infinite regress versus the risk of action.

  8.  **Exclude.** Say outright: "We are leaving out neural correlates and quantum indeterminacy." These reduce the question to physics, bypassing the phenomenological experience of choice. Keep the focus on the logic of agency, not the hardware. Tell them explicitly that discussing brain states would distract from the logical structure of the will.
