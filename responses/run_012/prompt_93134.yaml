  We arrive at every **terminal**
  different, yet the **bowl**,
  remains, though never a **spur**
  graces the **stem**.
  Look how the **arc**
  defines the empty **counter**.

  Nothing lives in the **counter**
  but the promise of a **terminal**.
  Under the sweeping **arc**,
  the paper holds the **bowl**.
  Iron strengthens the **stem**,
  stone wears away the **spur**.

  Sometimes there is a **spur**,
  sometimes none to change the **counter**.
  A child bends the **stem**,
  crayon seeking a **terminal**.
  Open wide the **bowl**,
  or let fall the heavy **arc**.

  Follow the falling **arc**,
  ignore the missing **spur**.
  Something must hold the **bowl**,
  something must keep the **counter**.
  Every road finds a **terminal**,
  every weight needs a **stem**.

  Break the **stem**,
  straighten the **arc**.
  Move the **terminal**,
  shave off the **spur**.
  Still the white **counter**
  knows the shape of the **bowl**.

  Single or double story, the **stem** joins the **arc**,
  though the handwritten **terminal** lacks a **spur**,
  our **counter** rests inside the **bowl**.
