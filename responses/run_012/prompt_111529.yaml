answer: |-
  \
  **Activity Title:** The Findings Form
  **Time:** 90 Minutes
  **Participants:** 20 Students (10 Voters, 2 Applicants, 3 Testifiers, 5 City Clerks)

  ### I. Materials (Printable)

  **1. Site Brief (Handout for All)**
  > **Project:** The Corridor Commons
  > **Location:** 400 Block Main Street (Commercial Corridor, Bus Line). Rear boundary touches Single-Family Zone.
  > **Current Use:** Surface parking lot and shuttered laundromat.
  > **Proposal:** 60-unit apartment building.
  > **Affordability:** 15 units (25%) designated Below Market Rate (BMR). 45 units at Market Rate.
  > **Parking:** Underground (20 spaces). No surface parking.
  > **Process:** The Neighborhood Advisory Body (NAB) issues a recommendation on the Conditional Use Permit. The City Council historically follows NAB recommendations.
  > **Current Neighborhood Plan:** Calls for "Compatible Density" on corridors and "Protection of Single-Family Character" on interior blocks.

  **2. The Findings Form (Handout for 5 City Clerks)**
  > **OFFICIAL RECORD OF FINDINGS**
  > *Per Municipal Code 12.4, the Advisory Body may only record findings in the following categories. Testimony outside these categories cannot be entered into the record.*
  >
  > **A. Consistency with Neighborhood Plan:**
  > [ ] Consistent [ ] Inconsistent [ ] No Impact
  > *Notes (Must reference "Compatible Density" or "Single-Family Character"):* _______________
  >
  > **B. Impact on Immediately Surrounding Blocks (0-300 feet):**
  > [ ] Positive [ ] Negative [ ] Neutral
  > *Notes (Must reference Traffic, Shadow, or Noise):* _______________
  >
  > **C. Recommendation:**
  > [ ] Approve [ ] Deny [ ] Approve with Conditions
  >
  > *Signature of Clerk:* ___________________

  **3. Voting Member Role Cards (10 Unique Archetypes)**
  *(Note: Assign these to 10 students. For the remaining 5 voting-eligible students, duplicate the "Process Purist" or "Undecided Renter" cards to ensure a swing vote exists.)*

  1.  **The Landlord:** You own two fourplexes three blocks away. You worry new supply will lower your rents, but you also worry construction will damage your foundations. *Priority: Protect Property Value.*
  2.  **The Recent Buyer:** You bought a single-family home behind the site last year. You chose this street for quiet. You fear the shadow of a 5-story building. *Priority: Neighborhood Character.*
  3.  **The Long-Time Renter:** You rent a studio on the corridor. You love the bus line. You worry this building will raise the "neighborhood average" rent, pushing you out eventually. *Priority: Affordability.*
  4.  **The Parent:** Your kids go to the local elementary school. The school is already at 110% capacity. You fear 60 new units means 20 new kids. *Priority: School Crowding.*
  5.  **The Shopkeeper:** You own a cafe on the corner. You need foot traffic to survive. Empty lots hurt you. *Priority: Economic Vitality.*
  6.  **The Process Purist:** You don't care about the building. You care that the rules are followed. If the form says "Shadow," talk about shadow. If the form doesn't say "Housing Need," don't talk about it. *Priority: Procedural Integrity.*
  7.  **The Commuter Owner:** You own a home but work downtown. You drive. You worry about the bus blocking traffic during construction. *Priority: Traffic Flow.*
  8.  **The Young Professional:** You rent nearby. You want to buy, but prices are high. You see this as necessary supply. *Priority: Housing Supply.*
  9.  **The Elderly Resident:** You have lived here 40 years. Construction noise affects your health. You feel ignored by the city generally. *Priority: Peace/Respect.*
  10. **The Faith Leader:** You see housing as a moral imperative. But you also mediate community conflicts. You want consensus. *Priority: Social Justice/Stability.*

  **4. Applicant Role Cards (2 Students)**
  *   **Developer:** Your goal is approval. You have financing lined up only if the permit is granted in 60 days. Emphasize the 15 BMR units.
  *   **Architect:** Your goal is design integrity. Emphasize the "Compatible Density" (step-down height at the rear) and the bus line usage.

  **5. Testifier Role Cards (3 Students)**
  *   **The Nurse:** You work at the hospital 10 miles away. You rely on this bus line. A car would take 20 mins; the bus takes 50. This building keeps the bus route viable. *Stake: Commute Time.*
  *   **The Teenager:** You go to high school across town. You cannot drive. You need safe transit corridors. *Stake: Mobility.*
  *   **The Doubled-Up Household:** You are currently sleeping on a cousin's couch. You qualify for one of the 15 BMR units. You are not currently a resident of this neighborhood. *Stake: Right to Be.*

  **6. Location Cards (20 Cards)**
  *   10 cards say **"Immediate Vicinity (Homeowner)"**
  *   10 cards say **"Three Blocks Away (Renter)"**
  *   *Distribute randomly at start. During the Swap, these are exchanged.*

  **7. The Envelope**
  *   Sealed. Contains 60 poker chips or tokens. 15 are Red (BMR), 45 are Blue (Market).
  *   Label: **"The Missing Constituents."**

  ---

  ### II. Minute-by-Minute Timeline

  **00:00 – 00:10: Setup & Distribution**
  *   Assign roles (10 Voters, 2 Applicants, 3 Testifiers, 5 Clerks).
  *   Distribute Site Brief, Role Cards, and Location Cards.
  *   **Crucial:** Give the **Findings Form** *only* to the 5 Clerks. Tell the room: "The Clerks are the gatekeepers of the official record. If your argument does not fit their boxes, it does not exist for the decision."
  *   Voters arrange themselves in a semicircle. Clerks sit at a table in front with the form.

  **00:10 – 00:30: The Hearing**
  *   **Applicants (5 mins):** Present the project.
  *   **Testifiers (10 mins):** Nurse, Teen, Doubled-Up person speak.
  *   **Voter Q&A (5 mins):** Voters ask questions.
  *   *Instructor Note:* Watch the Clerks. If a Testifier talks about "Commute" or "Housing Need," the Clerks must hesitate to write it down. If a Voter asks about "School Crowding," the Clerks must check if that fits "Impact on Surrounding Blocks."

  **00:30 – 00:45: Deliberation (Constrained)**
  *   Voters discuss. Clerks attempt to fill out the Findings Form based *only* on what fits the categories.
  *   **Instructor Intervention:** If voters discuss "Housing Need" or "Commute," the Instructor (as City Manager) interrupts: "Reminder: Code 12.4 restricts findings to Plan Consistency and Immediate Impacts. Please steer the record toward admissible evidence."
  *   *Goal:* Create friction where valid ethical concerns (Right to Be) are ruled "out of order."

  **00:45 – 00:50: The Swap**
  *   **Announce:** "Exchange your Location Card with someone across the room."
  *   Homeowners become Renters; Immediate Vicinity becomes Three Blocks Away.
  *   **Rule:** You must keep your *Role Card* (your job/stake), but you now inhabit a new *Location*.
  *   **Instruction:** "You have 2 minutes to adjust your opening statement based on your new location. Then we vote."

  **00:50 – 00:55: Vote 1**
  *   Public show of hands: Approve, Deny, or Abstain.
  *   Clerks finalize the Findings Form based on the majority.
  *   *Instructor:* Record the result on the board.

  **00:55 – 01:10: The Rule Menu (Phase 2)**
  *   **Announce:** "The first vote was difficult. The City offers a one-time amendment to the process for this project only. Choose **ONE**:"
      1.  **Add Seats:** Add 3 At-Large Citywide seats to this body (diluting neighborhood power).
      2.  **Compensation:** Keep the body as is, but the Developer pays a $50,000 fund to the Neighborhood Association for "mitigation."
      3.  **Centralize:** Remove this body's recommendation power. The City Council decides; this body only provides written comment.
  *   **Debate (10 mins):** Voters argue for the rule change that helps their *new* position.
  *   **Vote 2 (5 mins):** Re-vote on the project under the new rule. (If Option 1 chosen, the 5 'extra' students who were Observers/Clerks now get to vote).

  **01:10 – 01:15: The Envelope**
  *   Open the sealed envelope. Pour the 60 tokens onto the table.
  *   **Instruction:** "These are the households who would live here. They were not in the room. They do not get a Location Card. They do not get a Findings Form box."

  **01:15 – 01:30: Debrief**
  *   (See Script Below).

  ---

  ### III. Debrief Script (Mapping Mechanics to Concepts)

  **1. The Findings Form (Procedural Fairness)**
  *   *Say:* "Look at the Findings Form. Was it fair? Yes. It was applied equally to everyone. No one was shouted down. The Clerks followed the rules. But notice what happened to the Nurse's commute and the Doubled-Up household's need. They were true, but they were *inadmissible*."
  *   *Concept:* This is **Procedural Justice**. The process was scrupulously fair, but the *criteria* of the process filtered out the substantive claims of those who need the city most.

  **2. The Swap (Positionality vs. Structure)**
  *   *Say:* "When you swapped locations, did your vote change? Some of you voted the same way, even though your stake changed. Why? Because the *structure* of the hearing (the Form) forced you to argue about 'Shadows' and 'Character' regardless of where you lived."
  *   *Concept:* This reveals that individual empathy (swapping places) is often overpowered by structural incentives (the rules of engagement).

  **3. The Rule Menu (Systemic Reform)**
  *   *Say:* "In Phase 2, you had to choose a rule change. Option 1 was representation. Option 2 was compensation (bribery). Option 3 was centralization. Each solves the 'NIMBY' problem, but each creates a new ethical cost. Who decides? Who gets paid? Who loses voice?"
  *   *Concept:* There is no neutral administration. Every rule choice privileges one 'Right to the City' over the other.

  **4. The Envelope (The Invisible)**
  *   *Say:* "We spent 90 minutes debating. But the 60 people represented by these tokens had no voice. In reality, they aren't sitting in a sealed envelope. They aren't in the room at all. They are the ones priced out before the hearing even starts."
  *   *Concept:* This is **Substantive Justice** (The Right to *Be*). The activity makes them visible tokens; in reality, their exclusion is invisible.

  ---

  ### IV. Failure Analysis & Mitigation

  **1. The Swing Vote is Obvious Too Early**
  *   *Risk:* If the "Process Purist" or "Shopkeeper" dominates early, the deliberation collapses.
  *   *Fix:* As Instructor, play the "City Manager." Privately pass a note to the dominant voter: "Your constituent base is angry. You need to hear from the other side before committing." Force them to pause.

  **2. The Testifiers Go Quiet or Meta**
  *   *Risk:* The Nurse or Doubled-Up student feels powerless and says nothing, or says "This is rigged."
  *   *Fix:* If they go quiet, interrupt the Voters: "We have not heard from the public testifiers. Clerk, please invite them." If they go meta ("This form is unfair"), validate them but enforce the frame: "That is a valid critique for the debrief. For now, please testify within the constraints of the hearing."

  **3. The Clerks Ignore the Form Constraints**
  *   *Risk:* Clerks write down "Housing Need" because it feels right.
  *   *Fix:* You must audit the form at Minute 45. If they recorded inadmissible testimony, cross it out publicly with a red pen. Say: "This would be struck down on appeal. Stick to the code." This creates the necessary frustration.

  **4. The Swap Confuses Roles**
  *   *Risk:* Students think swapping Location Cards changes their Voting Status.
  *   *Fix:* Be explicit: "You keep your Role Card (Voter/Applicant). You only swap where you *live*. Does living further away change how you vote on *this* form?"

  ---

  ### V. Limitations (What This Activity Cannot Show)

  **1. Invisibility vs. Tokens**
  *   *Gap:* In the activity, the excluded are tokens in an envelope—visible and countable. In reality, the excluded are invisible. They don't know a hearing is happening. They are excluded by price *before* the process begins.
  *   *Instructor Supply:* You must verbally emphasize that in reality, there is no envelope. There is just an empty chair that no one notices is empty.

  **2. The Speed of Bureaucracy**
  *   *Gap:* This took 90 minutes. Real zoning takes years.
  *   *Instructor Supply:* Explain that "attrition" is a tool. Delays cost developers money, which kills affordable projects more effectively than a "No" vote. The *time* cost is a barrier the activity compresses.

  **3. The Diffuse Villain**
  *   *Gap:* Here, the "Villain" is the Findings Form, held by 5 Clerks. In reality, the exclusionary work is done by hundreds of default rules (parking minimums, setback requirements, environmental reviews) that no single person voted on today.
  *   *Instructor Supply:* Remind them that the Form they hated was written ten years ago by people who are no longer in the room. They are enforcing a legacy, not making a choice.

  \answer{Procedural versus Substantive Justice}
