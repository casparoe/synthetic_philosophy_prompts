answer: |-
  **Project Title:** Commutativity and the Structure of Uncertain Evidence

  **Project Description**

  **The Research Question**
  Standard Bayesian conditionalization requires evidence to be learned with certainty, a condition rarely met in actual inquiry. Jeffrey conditionalization is the standard proposed generalization, allowing updates on uncertain evidence by specifying new probabilities for a partition of propositions. However, this rule is known to suffer from non-commutativity: the final belief state depends on the order in which uncertain observations are processed. This project asks: Under what necessary and sufficient conditions do iterated Jeffrey conditionalizations commute, and does satisfying these conditions require modeling uncertain evidence as likelihood ratios rather than direct probability shifts? By answering this, I aim to determine whether the instability of uncertain updating is a technical bug fixable by better input description or a fundamental feature revealing that uncertain evidence is not evidence at all, but merely a shift in prior disposition.

  **Background and Gap**
  Existing positions in Bayesian epistemology leave this question determinately open. Defenders of Jeffrey conditionalization often acknowledge non-commutativity but treat it as an inevitable cost of modeling subjective experience, arguing that different orders of experience legitimately warrant different belief states. Critics, conversely, often declare uncertain evidence illegitimate or propose alternative updating rules that bypass the problem entirely without analyzing the failure conditions of the standard rule. Neither approach provides a precise boundary condition for when uncertain updates behave like stable evidence versus when they function as arbitrary prior adjustments. Consequently, we lack a formal criterion to distinguish when a sequence of uncertain observations constitutes a coherent learning path versus when it represents inconsistent input descriptions. This project moves beyond the dichotomy of accepting the bug or abandoning the rule by isolating the structural features that cause the instability.

  **Methodology and Approach**
  The project will proceed through formal modeling rather than purely conceptual analysis. The obvious alternative—arguing philosophically about the nature of evidence—risks remaining vague because the problem is inherently structural. To make the question determinate, I will construct a family of toy cases using finite probability spaces where non-commutativity is evident. I will begin by replicating standard counterexamples where updating on partition $A$ then partition $B$ yields a different posterior than updating on $B$ then $A$.

  The key technical move involves redescribing the input. Standard Jeffrey updates take as input a new probability distribution over a partition. My hypothesis is that this misdescribes the evidence; the input should instead be modeled as likelihood information (how likely the experience is given the hypothesis) akin to Bayes factors. I will formalize this alternative input structure and derive the algebraic conditions under which updates defined by likelihood ratios commute. I will then compare these conditions against the standard "rigidity" condition required for Jeffrey conditionalization. If the likelihood-based model restores commutativity under plausible conditions, it suggests the instability lies in the input description. If commutativity remains elusive even under this description, it suggests the instability is inherent to uncertain learning itself.

  This route is preferable to pure philosophical argumentation because it yields a fact of the matter. Either the algebra permits a commutative solution under specific constraints, or it does not. This allows us to anchor the philosophical debate about the status of uncertain evidence in a formal result rather than intuitions about case descriptions.

  **Expected Results and Significance**
  A successful result will take the form of a theorem stating the exact conditions under which iterated uncertain updates are order-invariant, accompanied by an analysis of what those conditions imply for the nature of evidence. If the condition requires the evidence to be independent of the hypothesis in a specific way, it may show that only certain kinds of uncertain observations count as genuine evidence. If the condition is never met except in limiting cases of certainty, it supports the skeptical view that uncertain evidence is merely a disguised prior shift. Either outcome clarifies the limits of Bayesian learning theory. Specifically, it will tell us whether we can treat uncertain observations as cumulative data or if we must treat them as holistic re-evaluations of our probability space.

  **Feasibility, Scope, and Risks**
  This project is designed for a one-semester timeline with a target output of approximately 6,000 words. The scope is limited to finite probability spaces to ensure mathematical tractability. The primary risk is that the algebraic derivation for general partitions may become too complex to resolve within the semester. If this occurs, I will restrict the proof to binary partitions, which are sufficient to demonstrate the structural point without loss of generality regarding the philosophical implication. Another risk is that the condition for commutativity turns out to be trivial (e.g., requiring the evidence to be certain). Even this negative result is valuable, as it formally proves the instability of uncertain evidence, but I will mitigate this by focusing on the likelihood-ratio formulation which is theoretically more robust.

  The project will fail if I cannot isolate a distinct condition that differs from the standard rigidity condition, or if the likelihood-based model proves mathematically equivalent to the standard model in all relevant cases. However, given the known sensitivity of Jeffrey conditionalization to input parameterization, there is strong reason to believe the formulation matters. By the end of the term, I will have either a proven condition for commutativity or a robust set of counterexamples showing that even likelihood-based inputs fail to commute, alongside a clear argument for what this means for Bayesian epistemology.

