  I'm a first-year PhD student and I have to turn in a two-page research proposal by the end of the month for a funding thing my department runs, and I've got a half-formed idea I can't get into shape on my own. Background: I'm taking a Bayesian epistemology reading course, and I keep bumping into the fact that conditionalisation only works if you learn things for sure, which almost never happens — so people reach for Jeffrey's rule instead, where instead of a new certain proposition you get a new probability for each cell of some partition, and then you update the rest by a weighted sum of conditionalisations. Fine. But when I actually sit down and do it with numbers, everything seems to depend on how I set the problem up. I'm fairly sure I've got a case where doing two rounds of uncertain observation gives me a different answer depending on which round I do first, and another where doing it in one go over a coarse partition and doing it in two stages over a finer one don't agree — which for something advertised as the generalisation of conditionalisation feels like it should be impossible. My half-baked thought is that the bug isn't in the rule but in how we're describing the input: we model "uncertain evidence" as a new probability for a proposition, when what we actually have is information about a likelihood (how likely would I be to get this reading if the hypothesis were true), and if you redescribe it that way then either the order-dependence evaporates or it turns into something you can state precisely — some condition under which a sequence of uncertain observations is order-invariant. What I want the proposal to do is make the question determinate enough that there's a fact of the matter: under exactly what conditions does a run of uncertain-evidence updates commute, and does the answer bear on the deeper question of whether uncertain evidence is a genuine kind of evidence at all or just a new prior in disguise.

  So please write me the two pages. I need: the question stated so that it has a determinate answer (not "explore the nature of uncertain evidence"); why the positions people already hold leave it open — my sense is that the standard treatments either declare uncertain evidence illegitimate or just define it as a limiting case of certain evidence, so neither actually tells you when the iterated version is well behaved; the approach, i.e. what I'd actually do — I imagine starting from a small family of toy cases with concrete numbers where I can see the non-commutativity, then trying to isolate what feature of the cases does the work (I have a vague hunch it's whether the evidence propositions are what some people call rigid, but I don't trust the hunch), then seeing whether it generalises into a condition or whether the counterexamples kill it; and why that route rather than the obvious one of just doing more philosophy about what evidence is. Then say what a result would look like (a stated condition plus a proof or a robust counterexample, and what the condition would mean for the "is it real evidence" question), what would count as the project failing, and be honest about scope — this is one semester, maybe 6000 words, so tell me where it's most likely to blow up and what I should cut. Don't put in any citations or reading lists, I'll add those myself, just talk about positions and arguments. And at the end, after the prose, give me a short structured summary as a JSON object with exactly these fields: "question" (one sentence, the determinate version), "why_open" (why existing positions don't settle it, 2-3 sentences), "key_move" (the one technical step the whole project turns on), "steps" (array of 3-6 strings, roughly in order, for the semester), "success" (what a positive result looks like), "failure" (what would count as the project failing), "scope_risk" (the single biggest reason it won't fit in a semester), "still_open" (what I'd still not know even if it