answer: |-
  **Working Note**

  **Option 1: The Audit.** The story takes place during the certification inspection. A third-party auditor walks the floor with the sisters. The tension is performative: the sisters must demonstrate compliance while hiding the shortcuts required to maintain yield.
  *Conceptual Question:* Does documentation create morality, or merely obscure the gap between rule and reality?

  **Option 2: The Procedure.** The story is set entirely in the tank room during a failed spawn. The broodstock are ready but will not release eggs without eyestalk ablation. The contract requires them to stop this practice. The sisters must decide whether to cut the stalks on this specific batch to save the product, or let the batch fail to prove the new method works.
  *Conceptual Question:* Is precaution a debt that accumulates interest, or is there a stopping rule where uncertainty yields to necessity?

  **Option 3: The Breakdown.** The electrical stunning machine fails during a harvest. The shrimp must be killed to meet shipment windows. The sisters must choose between waiting for repairs (risking spoilage and contract loss) or using the old ice-slurry method (violating the welfare standard).
  *Conceptual Question:* When systems fail, what default setting does human instinct choose: efficiency or caution?

  **Selection:** Option 2 (The Procedure). This staging isolates the sisters and the animals, removing the external pressure of an auditor to focus on the internal ethical conflict. It best accommodates the "Asymmetry of Error" (the risk of causing pain vs. the risk of economic loss) and "The Metric and the Animal" (the conflict between the biological reality of the spawn and the contractual requirements of the standard). It allows the philosophy to emerge from the physical act of holding the scalpel versus holding the logbook.

  ***

  **The Spawn**

  The water in the hatchery did not smell of the sea. It smelled of yeast, ammonia, and the copper tang of the pumps. It was a closed loop, recycled through filters that hummed with a low, dental-drill vibration. Mara stood over Tank Four, her hands resting on the rim of the concrete basin. She had spent twenty years in this room. Her skin was permanently damp, her fingernails thickened by the brine.

  Elise stood behind her, holding a clipboard. She had been gone for ten years, long enough to get a doctorate and forget the smell, then come back when the inheritance taxes threatened to sell the place to developers. She wore dry clothes. Clean shoes.

  "They aren't releasing," Mara said. She didn't turn around. She was watching the females drift near the surface. They were pale, heavy with eggs, their bodies translucent enough to show the orange mass inside. They twitched when the water current shifted, but they did not spawn.

  "The protocol says we wait seventy-two hours before intervening," Elise said. She tapped the clipboard. "The Northern Group's standard. No ablation. We adjust the feed ratio, we change the light cycle, we wait."

  "Seventy-two hours they'll resorb the eggs," Mara said. "They'll eat their own young to survive. It's waste. It's been waste for forty years. That's why we cut."

  "That's why we assumed they were machines," Elise said. "Now we know we don't know."

  Mara turned then. She wiped her hands on her apron, leaving wet streaks. "You don't know anything. You read papers. I watch them die."

  "I read the papers so we don't have to guess," Elise said. She stepped closer to the tank. The water lapped against the concrete, inches from her clean shoes. "If they feel pain, Mara, cutting the eyestalk is torture. It's removing a sensory organ to shock the body into reproduction. It's indefensible."

  "If they don't feel pain, it's maintenance. Like trimming a hedge."

  "The asymmetry of error," Elise said. She used the words like they were solid objects, things she had carried here in her bag. "If you cut and they feel nothing, you lose a piece of shrimp tissue. If you cut and they feel everything, you inflict agony for profit. The cost of the mistake isn't the same. One is negligible. The other is infinite. You have to bet on the infinite."

  Mara laughed, a short, dry sound. "Infinite. That's a big number. What about our number? Two sisters. Twelve employees. The bank loan on the aerators. If we lose this contract, the Northern Group goes to Vietnam. We close. That hardship is certain. The shrimp pain is theoretical."

  "That's the arithmetic," Elise said. "Billions of individuals against a handful of humans. You do the sum and you always come out the same. But the arithmetic is how you talk yourself into anything. You can justify slavery with arithmetic."

  "I can justify keeping the lights on," Mara said. She reached into her pocket. Her fingers brushed the handle of the scalpel. It was old steel, worn smooth by grip. "And you talk about pain like it's a switch. On or off. But how do you know? You give them drugs. You see if they rub the spot. But you calibrated those tests on rats. On dogs. Creatures with faces. You're looking for a human face on a shrimp. If you don't find it, you say they're safe. That's circular."

  "It's the best evidence we have," Elise said. "We act under uncertainty. That's what institutions are for. The standard isn't about truth. It's about obligation. If we wait for conclusive evidence, we've already chosen the error that costs the animal everything. The welfare officer log, the stunning certificate, the no-ablation clause… it's a stopping rule. It says we stop here. We don't have to solve metaphysics. We just have to stop cutting."

  Mara looked back at the tank. One of the females had sunk to the bottom. She was lying on her side, legs twitching rhythmically. "Look at her. Is she suffering? Or is she broken?"

  "I don't know," Elise said. "That's the point."

  "If uncertainty obligates," Mara said, "where does it end? The algae we feed them. Do they feel? The water fleas? If I have to be sure about everything, I can't move. I can't breathe. I need a principle that lets me stop somewhere. Otherwise I'm not a farmer. I'm a martyr."

  "The principle is power," Elise said. "We have the power. They don't. That's why the obligation stops with us."

  The hum of the pumps seemed to grow louder. The water in Tank Four was still. The females were conserving energy. In another twelve hours, the eggs would dissolve back into their bodies, nutrients reclaimed. The batch would be lost. Thirty thousand potential larvae.

  Elise opened the clipboard. The contract lay on the top sheet. It was thick, bound in plastic. It required a designated welfare officer. It required a paper trail for every death. It required electrical stunning before killing. It required the end of eyestalk ablation. It promised a price per kilo that would keep the bank away for five years.

  "If we cut this batch," Mara said, "we violate the trial period. They pull the contract."

  "If we don't cut," Elise said, "we lose the batch. But we keep the contract."

  "One batch is five percent of the quarter yield," Mara said. "We can't absorb that. The margins are on the edge already."

  "Then the farm is only viable if we cut the stalks," Elise said. "Which means the farm is only viable if the work is indefensible."

  Mara took the scalpel from her pocket. She held it by the handle, the blade pointing down. It caught the fluorescent light. "Viability isn't a moral category. It's a physical one. Like gravity. You can't argue with it."

  "You can fall," Elise said.

  Mara looked at the shrimp. They were so alien. Compound eyes on stalks. Legs that moved without thought. She had touched thousands of them. They never touched back. They never flinched. But flinching was a metric. It was something you could write in a logbook. What happened inside the shell was dark.

  "The standard counts what can be inspected," Mara said. "Stunning at slaughter. A certificate on the wall. The larvae… the billions of them… they die anonymous. No one stuns the larvae. They dry out in the air or get eaten by the grow-out stock. The standard doesn't touch them. It only touches the ones we see."

  "That's why we need the standard," Elise said. "To start somewhere."

  "It's optimization," Mara said. "We optimize the audit. Not the animal."

  She stepped closer to the tank. The female on the bottom twitched again. Mara lowered her hand. The scalpel hovered over the water. It would be easy. A dip in the disinfectant, a quick cut, the hormone release, the spawn within the hour. The batch saved. The contract secured, because who would check a single batch during the trial? The logbook could be adjusted. The metric could be met on paper.

  Elise didn't move. She didn't say *don't*. She just watched. She held the pen ready to mark the failure in the logbook if Mara chose the other way.

  "If I do this," Mara said, "I am choosing the error that costs them everything. I know your math."

  "If you don't," Elise said, "you are choosing the error that costs us something. I know your math."

  The water rippled. The female on the bottom stopped twitching. She was dead. Not killed, just stopped. The water quality had shifted; the ammonia spike from the feed change had finished her. She hadn't spawned. She hadn't been cut. She had just failed to meet the conditions of either system.

  Mara straightened up. She looked at the dead shrimp, then at the scalpel, then at the contract on the clipboard.

  "The metric doesn't care about her," Mara said. "She's not in the logbook yet. She's just waste."

  "She's the only one that matters," Elise said.

  Mara wiped the blade on her apron. She didn't put it away. She held it there, shining in the artificial light. The hum of the pumps filled the silence between them. Outside, the estuary moved with the tide, dark and indifferent, full of creatures that ate and were eaten without records or standards.

  "Get the net," Mara said. "We have to cull the rest of the tank. They won't spawn now. Not without the cut, and not with the ammonia this high."

  Elise nodded. She put the clipboard down on the dry ledge. She picked up the mesh net.

  "Stunner?" Elise asked.

  "It's not calibrated for larvae," Mara said. "You know that. It's for the harvest size. These are broodstock."

  "Then ice slurry," Elise said. "Old way."

  "Old way," Mara said.

  She dropped the scalpel into the sterilizing tray. It clinked against the metal. She picked up the bucket of ice. They worked together, sweeping the tank, lifting the heavy females out of the water. They dropped them into the ice. The shrimp twitched as the cold hit them, legs curling, then still. It was impossible to say if it was pain or reflex. The water froze around them.

  Mara filled out the cull sheet. *Cause of death: Environmental stress.* She didn't write *ammonia*. She didn't write *failed protocol*. She wrote what the auditor would accept.

  Elise watched her write. She didn't correct her. She picked up the bucket of iced shrimp to take them to the incinerator.

  "Sign the contract," Mara said. She didn't look up from the paper.

  "We haven't fixed the yield problem," Elise said. "The non-ablation method… it might not work at scale."

  "Sign it," Mara said. "We'll optimize the standard. We'll keep the logbook clean. We'll buy the time to figure out the rest."

  "And if we can't?"

  "Then we close," Mara said. "But not today."

  Elise stood there with the bucket. The ice water dripped onto the concrete floor, making dark spots that would evaporate by morning. She looked at the tank, now empty of the heavy females, just water and current and the tiny larvae swimming blind in the green soup.

  "Okay," Elise said.

  She took the bucket and walked toward the door. Mara stayed by the tank. She picked up the scalpel from the tray and dried it with a rag. She put it back in her pocket. She turned the dial on the feed mixer, adjusting the ratio by a fraction, watching the numbers change. She did not look at the water. She listened to the pumps, counting the rhythm, making sure the hum stayed steady, making sure the loop stayed closed.
