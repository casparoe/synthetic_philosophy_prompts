      *   *Nuance:* Make sure not to conflate Lewis's PP with Humean Supervenience too much, keep it focused on the *deference* aspect. The key is that you can't defer to a master you can't see.

  7.  **Final Polish:** Check the flow. Ensure the transition from the coin toss to the Tragedians to the death is smooth. Make sure the "verdict" is clear. (The verdict: The play argues that PP is a rule for gods or outsiders, not for characters inside the machine.)

  *(Self-Correction on the "Brainstorming" requirement)*: The prompt asks me to "open by brainstorming two or three candidate interpretations before you settle on the one you can defend." I need to make sure this doesn't look like a bulleted list but rather a woven part of the introduction.

  *(Self-Correction on the "Forecaster" aspect)*: The user says this matters to them personally. I should address them directly or at least acknowledge the stakes of forecasting without making it about *me*. I will frame it as a dialogue with the "practicing forecaster."

  *(Final thought on the Weakness)*: The strongest counter-argument is that Ros and Guil aren't rational agents. They are clowns. If they aren't rational, PP doesn't apply to them normatively. I must address this.

