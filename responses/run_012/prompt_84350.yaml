          *   *Selection:* The tension between the *Law of Continuity* and the *City of God*. If continuity wins, moral status must be graded, not binary.

  4.  **Refining and Polishing:**
      *   *Tone:* Philosophical, precise, respectful of the user's knowledge level.
      *   *Formatting:* Use bolding for "Actual View" vs. "Extrapolation" to meet the constraint.
      *   *Check Constraints:* Did I skip Monad 101? Yes. Did I flag extrapolation? Yes. Did I say what would change my mind? Yes.
      *   *Specifics:* Ensure the bee/crab/fish/mouse/thermostat ranking is clear.

  5.  **Self-Correction during drafting:**
      *   *Correction:* I initially thought about saying animals are machines. But Leibniz distinguishes "divine machines" (organisms) from human artifacts. I need to make sure I don't conflate the Mill Argument (against materialism) with the status of animals (which have souls).
      *   *Correction on Moral Status:* Leibniz is clear: only Spirits enter the City of God. But he also says we shouldn't be cruel to animals. I need to distinguish *direct* vs. *indirect* duties clearly.
