      *   **Key Questions to Address:**
          1.  Sentience as graded? Thermostat on the gradient or floor? Where does the continuum break?
          2.  Moral status: Perception = status or Apperception/Reason required? (Bees, crabs, fish, mice, thermostat).
          3.  The Mill Argument: Does it align with anti-chatbot pain claims or force a stranger conclusion?
          4.  Uncertainty/Precaution: Does his metaphysics settle it (less cautious) or require precaution?
