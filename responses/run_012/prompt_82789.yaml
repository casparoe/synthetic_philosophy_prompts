  She operates on a deontological constraint disguised as decision theory: *"I never comply with blackmail threats, only ransom demands."*
  *   **How it fits the past:**
      *   **Dog (Pay):** This is a ransom (return of existing property), not blackmail (threat of new harm). The constraint doesn't trigger.
      *   **Photos/Fraud (Refuse):** Blackmail. Constraint triggers. Refuse.
      *   **Wizard/Crank (Refuse):** Blackmail. Constraint triggers. (Probability is irrelevant to the policy).
      *   **Superintelligence (Refuse + Surrogate):** Blackmail. Constraint triggers. The "Surrogate Goal" is a strategic upgrade to make the constraint easier to hold by removing the utility leverage, but the action remains refusal.
      *   **New Case (Refuse):** This is blackmail (threat of new harm: torture copies). The demand's triviality is irrelevant. The principle is to maintain the *type* of agent who cannot be blackmailed. Complying, even for a sentence, updates the predictor (and the universe) to "she is the kind of agent who complies with blackmail," which violates the core identity policy.

  **The Alternative Rule (Rule B): Threshold Utilitarianism.**
  She maximizes expected utility but weights the "precedent cost" of compliance proportionally to the size of the demand. *"I refuse blackmail unless the cost of compliance is negligible relative to the threat."*
  *   **How it fits the past:**
      *   **Dog (Pay):** Cost ($200) is negligible to her; Value (Dog) is high. Pay.
      *   **Photos/Fraud (Refuse):** Cost (Fraud) is high/catastrophic. Refuse.
      *   **Wizard/Crank (Refuse):** Probability is near zero. Expected cost of threat is negligible. Refuse.
      *   **Superintelligence (Refuse):** Cost (Life Savings) is high. Precedent of paying "life savings" is catastrophic for future utility. Refuse.
      *   **Crank (Refuse):** Probability near zero. Refuse.
      *   **New Case (Pay):** Cost (One sentence) is effectively zero. Threat (Torture) is high. Probability (Good model) is high. The precedent cost of complying with a *trivial* demand is low enough that the utility gain (saving copies) outweighs it.

  **Which I'd Bet On:**
  I bet on **Rule A (Categorical Resistance)**.
  *   **Why:** The behavior in Case 4 is the strongest signal. She didn't just refuse; she *announced a policy change* (Surrogate Goal) specifically to make threatening her "never worth anyone's time." This indicates she values the *inviolability of her policy* higher than the immediate utility of the specific transaction. If she were running Threshold Utilitarianism, she would have kept her options open for trivial demands. By making a dramatic, public stand in Case 4, she locked herself into a Categorical rule. To pay in the New Case would retroactively invalidate the Case 4 maneuver, signaling that her "Surrogate Goal" has a price (one sentence), which destroys its protective value. She cares more about being *unblackmailable* than she cares about the copies (even if she counts them morally).

  **The Distinguishing Case:**
  **The "Pre-Planned Action" Blackmail.**
  *   **Scenario:** A reliable predictor threatens to torture copies of her unless she performs an action she *was already going to perform today anyway* (e.g., "Post this specific tweet you drafted an hour ago" or "Walk to the store on the route you planned"). The cost of compliance is genuinely zero.
  *   **Rule A Prediction:** **Refuse.** Doing the action under coercion violates the principle of autonomy/non-compliance. She would rather the copies be tortured than be the kind of agent whose actions can be dictated by blackmailers, even if the action is identical.
  *   **Rule B Prediction:** **Comply.** The net cost is zero (she was doing it anyway). The net benefit is saving the copies. There is no utility loss to comply, so a utilitarian calculus mandates compliance.
