  Based on the set of verdicts you provided, I have derived the underlying principle that actually governs your intuitions. Your current draft ("deliberation go worse... disown the machinery") fails because it focuses too much on the *mechanism* (framing, bias) and not enough on the *relationship* and the *truth-value*.

  Here is the principle your verdicts encode, the test case, and the necessary sacrifice.

  ### The Principle: Authorized Fiduciary Stewardship

  **Influence is legitimate if and only if:**
  1.  **Fiduciary Alignment:** The influencer acts within a recognized role obligated to prioritize the *agent's* welfare (not the influencer's interest or a collective goal), **AND**
  2.  **Truthful Steering:** The influence operates by framing, contextualizing, or interpreting *truthful* information to overcome the agent's cognitive biases, **NOT** by introducing factual falsehoods about the state of the world.

  **Influence is manipulative if:**
  It bypasses rational deliberation to secure compliance where either the influencer lacks fiduciary authority over the agent's welfare, **OR** the influence relies on lies regarding probabilities or qualities.

  ### Motivation for Each Clause

  *   **Clause 1 (Fiduciary Alignment):** This distinguishes the **Physician** and **Therapist** from the **Salesperson** and **Friend**.
      *   *Physician/Therapist:* You permit them to steer your deliberation (via framing or reframing) because you have granted them authority over your health/mind for *your* benefit. They are stewards of your agency.
      *   *Salesperson/Friend:* They lack this mandate. When a salesperson exploits FOMO or a friend exploits reciprocity, they are steering your agency for *their* benefit (a sale, a returned favor). Your verdicts condemn these because the ends are not aligned with your welfare.
      *   *Union Organizer:* This is the critical test. The Organizer argues for a collective good, but they are not a fiduciary for the individual worker's risk assessment. They are an advocate. Therefore, they fall outside the protection of Clause 1.

  *   **Clause 2 (Truthful Steering):** This distinguishes the **Physician** and **Therapist** from the **Teacher** and **Organizer**.
      *   *Physician:* Describes risks truthfully, merely framing them (90% survival vs. 10% mortality). This is "Truthful Steering."
      *   *Therapist:* Retells history to offer a new understanding. This is interpretation, not fabrication. It remains within the bounds of truth.
      *   *Organizer:* Claims success is "far likelier than she believes." This is a factual falsehood about probability.
      *   *Teacher:* Praises work she "privately finds mediocre." This is a factual falsehood about quality.

  ### The Test Case: The Host

  **Case:** A host seats guests so that two people who dislike each other never meet and a third guest, who would have mediated, is quietly left out.

  **Verdict:** **Manipulation.**

  **Reasoning:**
  1.  **Failure of Fiduciary Alignment:** A social host is not a fiduciary steward of their guests' psychological welfare in the way a doctor or therapist is. Guests consent to hospitality, not to social engineering.
  2.  **Failure of Truthful Steering:** Excluding the mediator is a deception by omission. It creates a false social environment (a dinner without conflict) that does not reflect the actual relational dynamics.
  3.  **Implication:** The host is treating the guests as props to ensure a smooth event (the host's interest) rather than as agents entitled to navigate their own social conflicts. This aligns with the **Salesperson** and **Friend** cases, not the **Physician**.

  ### The Verdict You Must Abandon

  To maintain the integrity of this principle—and specifically to preserve your strong intuition that the **Union Organizer** is guilty of serious manipulation—you must abandon your verdict on the **Teacher**.

  **The Verdict to Abandon:** *A teacher who praises an essay she privately finds mediocre, in order to keep the student working: Legitimate.*

  **Why:**
  Your verdict on the **Organizer** (Manipulation) rests on the fact that she lies about the probability of success to secure a vote. Your verdict on the **Teacher** (Legitimate) permits lying about the quality of work to secure effort. Structurally, these are identical moves: **Paternalistic Deception.**

  If you allow the Teacher to lie for the student's "own good," you undermine the principle required to condemn the Organizer, who also lies for the workers' "own good." The only difference is the setting (classroom vs. union hall), but the moral mechanism (falsehood to bypass rational risk/quality assessment) is the same.

  To keep the **Physician** (who tells the truth, merely framing it) distinct from the **Organizer** (who lies), you must draw the line at **Falsehood**.
  *   The Physician frames the truth (Permissible).
  *   The Therapist reframes the truth (Permissible).
  *   The Teacher falsifies the quality (Impermissible).

  **Why the others are worth more:**
  Preserving the condemnation of the **Organizer** is more valuable than saving the **Teacher**. Political and collective action rely on shared reality; allowing organizers to lie about probabilities corrupts the democratic deliberation of the workers. In contrast, while the Teacher's lie is harmful, the educational relationship can survive honest encouragement ("This is hard, but I see you improving") without requiring falsehoods about quality. By abandoning the Teacher verdict, you protect the boundary against political manipulation, which carries higher stakes for autonomy.

  ### Summary
  Your gut verdicts encode **Authorized Fiduciary Stewardship**, not just "ownership of reasons." This principle saves the Physician from your own draft principle but forces you to admit that the **Teacher** is manipulating the student, just as the Organizer manipulates the worker. The Host, lacking fiduciary authority, is also manipulating the guests.
