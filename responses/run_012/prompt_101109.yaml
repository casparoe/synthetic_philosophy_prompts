      *   *Spotlight Objection:* Distinguish between *reasons* and *causes*. Reasons survive inspection; causes (biases) often don't.
      *   *Annoying Conclusion:* It makes benevolent paternalism manipulation (annoying to do-gooders) and exonerates transparent self-interest (annoying to critics of capitalism).
      *   *The Killer Case:* Encouragement/Placebo. A coach saying "You got this." If the athlete knows it's a tactic, does it fail? Often. Is the coach manipulating? We don't want to say yes.
      *   *Verdict:* The test is necessary but not sufficient. It needs a value judgment on the *goal*.

      *Refining the "Annoying Conclusion":* Let's make it sharper. If the test holds, then much of what we consider moral education is manipulation because children obey rules based on authority myths they outgrow. Conversely, a loan shark who clearly states "I will break your legs if you don't pay" is persuading, not manipulating, because the mechanism (fear of violence) works even when transparent. That annoys everyone (makes teachers look bad and loan sharks look honest).
      *Wait, coercion vs manipulation.* Coercion is different. The test is about influence. Threats are coercion. Let's stick to psychological influence.
      *Revised Annoying Conclusion:* It suggests that hiding your benevolent intent is manipulation, but revealing your selfish intent is persuasion. So a politician hiding donors is manipulating, but a lobbyist openly saying "I want this for my profit, here's why it helps you too" is persuading, even if the help is thin. Meanwhile, a partner saying "I bought you flowers to make you forgive me" kills the gesture, making the original gesture manipulation. This annoys romantics (gestures are tainted) and cynics (transparent greed is legit).

