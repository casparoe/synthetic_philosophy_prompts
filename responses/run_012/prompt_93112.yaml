  **MEMORANDUM TO THE BOARD OF EDUCATION**

  **SUBJECT:** REVISION OF PEST MANAGEMENT POLICY BASED ON EXPECTED WELFARE MAXIMIZATION

  **DATE:** October 26, 2023

  **FROM:** Junior Class Philosophy Club

  **TO:** School Board

  **1.0 PURPOSE**

  This memo requests an immediate suspension of the district's lethal pest-control contract. Current protocols prioritize minor human conveniences over substantial expected moral costs. While standard practice assumes insects lack moral status, uncertainty regarding sentience combined with astronomical population figures necessitates a precautionary recalibration of school policy.

  **2.0 MORAL CALCULUS**

  The expected moral cost of any practice is determined by multiplying the probability of sentience by the number of beings affected and the magnitude of welfare change. Our school's annual pest-control contract results in roughly one billion insect deaths. These occur primarily among termites compromising the gymnasium structure, flies in the cafeteria, mosquitoes over the athletic field, and miscellaneous victims of the electric zapper in the main hall.

  Although sentience is unconfirmed, a conservative estimate assigns a one in one thousand chance that any given insect possesses morally relevant experience. Even if this probability reflects mere ignorance rather than determinate credence, the expected value remains robust. Lowering the probability barely changes the conclusion, as the headcount is sufficiently large to swamp significant variations in uncertainty. Furthermore, while defining the unit of welfare remains difficult—whether a hive constitutes one unit or many—the aggregate biomass removed suggests the individual count is the safer moral baseline.

  **3.0 COMPARATIVE INTERESTS**

  The school contains five hundred students. We assign each student's pest-related interest (avoiding asthma, bites, or structural damage) a value of one welfare point. This exchange rate is uncertain; nobody can precisely estimate the equivalence between a student's discomfort and a termite's death. However, even granting the student interest maximum weight, the arithmetic dictates policy.

  Current conduct proceeds as though the insect cost is negligible. Daily routines ignore the zapper's flash and the sprayed fields. Yet, the calculated disparity suggests these routines are unsustainable. If the argument holds for insects, it logically applies to smaller organisms, implying no natural stopping point for moral consideration. Nevertheless, we must act on the data available.

  **4.0 RECOMMENDATION**

  The expected sentient insect welfare at risk is two thousand times greater than the total welfare interest of the student body. To minimize expected suffering, the school must accept increased risks of structural damage, hygiene violations, and vector-borne disease. We propose the immediate termination of all lethal pest control. The gymnasium should remain open despite termite activity. The cafeteria must operate with existing fly populations. The athletic field should be used regardless of mosquito density. The electric zapper must be unplugged permanently.

  The budget previously allocated to pest control should be retained to cover potential liability, but no further killing should occur. The moral weight of the many outweighs the convenience of the few.

  **APPENDIX: WELFARE ARITHMETIC**

  **A. Insect Cost**
  Total Insects Killed Annually: 1,000,000,000
  Probability of Sentience: 1/1,000
  Expected Sentient Beings Affected: 1,000,000

  **B. Student Interest**
  Total Students: 500
  Welfare Points Per Student: 1
  Total Student Welfare Points: 500

  **C. Ratio**
  Expected Sentient Insects : Total Student Points
  1,000,000 : 500
  **2,000 : 1**

  *Conclusion: Insect welfare expectations exceed human interests by three orders of magnitude.*
