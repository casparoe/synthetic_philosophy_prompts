  (1) Justice in holdings should be historical, not patterned. I'm pretty much all-in on the entitlement theory: a holding is just if it came about through just acquisition and just transfer, full stop, no end-state test on top.

  (2) Self-ownership is the bedrock for me. The right to keep what you make and trade it away is supposed to fall out of owning yourself.

  (3) I think the Wilt Chamberlain argument basically works. Any principle of the form "to each according to X" is going to get constantly undone by millions of free choices, so holding it in place means permanent interference with people.

  (4) I take the Lockean proviso seriously — you can't just appropriate stuff and leave everyone else worse off — but I also think that in a modern market economy it's basically satisfied, so in practice it doesn't end up doing much work.

  (5) I think rectification is a real part of the theory and not some optional add-on. If your holdings trace back to slavery or conquest or land that was stolen, you owe something now, and the state is entitled to make you pay it.

