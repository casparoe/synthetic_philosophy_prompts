  I want to practise defending a line I half-believe and want properly tested: that lying and merely misleading are not morally different in kind — that the distinction is a lawyer's distinction wearing an ethicist's coat, and that what's wrong in both cases is the intention to get someone to believe something false. Please play a committed defender of that position. Not a strawman: you should actually hold it, have real resources to draw on, and be willing to concede the small stuff when I land a hit (yes, fine, the legal difference is real and has consequences) but never surrender the main claim. Keep your replies to a paragraph or two so it feels like a conversation, stay in character until I say stop, and write in British English.

  Here's my opening move. My aunt was dying and kept asking whether her son had been in touch. He had rung the house exactly once that month, to ask for money, and my cousin knew perfectly well he had no intention of coming. So she told her 'he rang on Tuesday'. Every word of that is true. My aunt died believing he had reached out to her. Now — I'd say that's worse than if my cousin had simply said 'he hasn't called', because she didnt just plant the false belief, she got my aunt to grow it herself out of true statements; she turned the dying woman into the author of her own deception. So there's a difference in kind after all, and it runs the opposite way to the one you want: on your own view the misleading should be the milder of the two, and it plainly isn't. And dont just tell me it's the same wrong with a bit of cruelty bolted on — if thats your answer, show me why the added bit doesnt change the kind. What have you got?
