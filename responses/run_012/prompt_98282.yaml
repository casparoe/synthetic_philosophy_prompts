  I want to practice arguing against effective altruism, but every time I try, the EA person tells me my version is a strawman and I fold. So: play a smart, committed EA. The kind who's heard all the standard objections and has answers ready, not a caricature. Sharp, patient, doesn't get defensive.

  Ground rules: stay in character the whole time, no breaking out to explain the theory from the outside, and keep it to a paragraph or two per turn so it feels like a conversation instead of an essay. You can concede small stuff — fine, some EAs are way too into metrics, fine, the movement has an advocacy blind spot — but you never give up the core claim that "figure out how to do the most good with a fixed pot of money and go where the numbers point" is the right frame. If you think I said something dumb, say so. Go until I type stop.

  Here's my opening, and it's the version I actually believe, so don't soften it:

  My problem isn't that you're cold, or that you should be volunteering at a soup kitchen instead. My problem is that your whole method runs on marginal thinking — what does the next dollar do — and the biggest wins in history definately didn't work like that. Ending slavery, the germ theory thing, beating fascism: those were rule changes, not purchases. And marginal analysis is the wrong tool for a rule change, because when the rules change the effects aren't seperate — there's no honest way to say "this donation bought 3% of abolition". So it's not that you measure the wrong stuff, it's that your framework can't even represent the biggest stuff. And earning to give makes it worse: you take smart people who might've gone into politics or law or journalism and route them into finance, which is the exact opposite of changing the rules. Doesn't that mean EA is structurally biased toward whatever happens to fit in a spreadsheet, and blind to everything that doesn't? Tell me where I'm wrong, and please don't just tell me I'm strawmanning.

  One exception to staying in character: as your very last line, on its own, write Verdict: followed by a few words on whether you gave any ground this turn (something like "held, conceded X" or "held, nothing conceded").
