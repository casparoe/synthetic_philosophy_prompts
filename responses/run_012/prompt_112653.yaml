  ### Personal Identity Ranking Exercise Materials

  #### I. Tier Ranking of Criteria

  *   **Tier S:** (5) The Pattern View
  *   **Tier A:** (3) Psychological Continuity
  *   **Tier B:** (6) Animalism
  *   **Tier C:** (1) Bodily Continuity, (4) Narrative Continuity
  *   **Tier D:** (2) Brain Continuity

  #### II. Justifications

  1.  **The Pattern View (S):** This criterion provides the most consistent answers across all scenarios, particularly in **Case 3** (silicon substitution) and **Case 4** (snapshot), where physical substrates change or multiply without disrupting the organizational structure.
  2.  **Psychological Continuity (A):** While robust in **Case 2** (split brain) and **Case 3** (substitution), this criterion struggles to provide a non-arbitrary answer in **Case 4** when the original is not destroyed, creating a logical contradiction regarding how many entities share the identity.
  3.  **Animalism (B):** This view gives definite answers in **Case 1** (vat) and **Case 3** (substitution) by tracking the living organism, but it fails to distinguish a unique person in **Case 2**, where two living organisms claim the same prior history.
  4.  **Bodily Continuity (C):** Like Animalism, this criterion succeeds in **Case 1** by locating the person with the body, but it offers no non-arbitrary way to choose between the two bodies in **Case 2** or the three bodies in **Case 4**.
  5.  **Narrative Continuity (C):** Although the story remains coherent in **Case 3**, this criterion is too vague to answer "Where am I?" in **Case 1**, where the narrative is experienced in one location but the biological history resides in another.
  6.  **Brain Continuity (D):** This criterion collapses in **Case 3**, where the biological brain is entirely replaced by silicon, and in **Case 2**, where the brain is divided, leaving no single organ to track.

  #### III. Scoring Table

  | Criterion | Case 1 (Vat) | Case 2 (Split) | Case 3 (Substitution) | Case 4 (Snapshot) | Total |
  | :--- | :---: | :---: | :---: | :---: | :---: |
  | **(5) Pattern View** | 4 | 5 | 5 | 5 | **19** |
  | **(3) Psychological** | 5 | 5 | 5 | 3 | **18** |
  | **(6) Animalism** | 5 | 1 | 5 | 5 | **16** |
  | **(1) Bodily** | 5 | 1 | 5 | 1 | **12** |
  | **(4) Narrative** | 3 | 4 | 5 | 3 | **15** |
  | **(2) Brain** | 5 | 1 | 0 | 0 | **6** |

  *Note: Scores reflect definiteness. 5 = Clear, unique answer. 0 = Contradiction or silence.*

  **Consistency Check:**
  The totals and the tier list **agree**. The Pattern View and Psychological Continuity have the highest totals and occupy the top tiers, while Brain Continuity has the lowest total and occupies the bottom tier. You should trust the **tier list** over the raw totals if they diverge in the future, because the tiers account for the *quality* of the answer (e.g., avoiding logical contradictions in Case 4) rather than just the quantity of successful matches.

  ***

  #### IV. Further Questions for Discussion

  **1. Which single case does the most work in producing the order, and why that one?**
  **Case 2 (The Split and the Double Transplant)** does the most work. It is the primary filter that separates the physical criteria (Bodily, Brain, Animalism) from the non-physical criteria (Pattern, Psychological). In this case, the physical criteria cannot select a single entity without arbitrariness (since there are two bodies/brains/organisms), whereas the non-physical criteria can accommodate two continuers. This single case creates the decisive gap between Tier B and Tier A.

  **2. Is there any criterion in the list that cannot be scored against these cases because it is answering a different question, and if so, what question is it answering?**
  **Narrative Continuity** is the outlier. While the other five criteria attempt to locate a metaphysical entity in space and time ("Where am I?"), Narrative Continuity answers a question of *meaning* ("Does my life make sense?"). In **Case 1**, for example, a person can tell a coherent story regardless of whether they are in the vat or the far body, meaning the criterion fails to distinguish location even when it successfully identifies a "person."

  **3. If we altered one detail in one case, would the top two swap places; which detail, and which case?**
  **Yes.** If we alter **Case 3 (The Slow Substitution)** so that the silicon units are arranged *randomly* but still produce the same functional output (a "black box" swap), the top two would swap. The **Pattern View** would drop significantly (as the organization is destroyed), while **Psychological Continuity** would remain high (as memory and behavior are preserved). This would lower the Pattern View's total below Psychological Continuity.

  **4. If the club had to commit to one criterion for the purposes of this exercise, which would you put first, and how would you defend it against the case that embarrasses it most?**
  I would put **The Pattern View** first. It is the most robust because it handles the transition from biology to technology in **Case 3** and the duplication in **Case 4** without denying the reality of the copies. The case that embarrasses it most is **Case 1 (The Vat and the Far Body)**, where the pattern is distributed across two locations. To defend it, I would argue that "location" is the wrong metric for a pattern; the person is not *in* the vat or the body, but *in the link* between them, making the question "Where am I?" category error for this criterion.
