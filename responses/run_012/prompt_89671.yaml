      *   **Input:** Six specific claims (1-6).
      *   **Output Requirements:** Identify which can be held together, identify genuine tensions (vs. apparent ones), order tensions by severity, explain what must give for each, assess the cost to the rest of the package, and identify the single revision that clears up the most trouble.
      *   **Constraint:** "Audit, not a survey." This means focus on logical coherence and incompatibility, not just describing the views. Be critical and precise.

  2.  **Analyze the Claims:**

      *   **Claim 1 (Objectivism):** Value is objective/mind-independent. ('Better than' is not a projection.)
