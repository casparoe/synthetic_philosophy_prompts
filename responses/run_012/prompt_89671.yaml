          *   Yes, Incompleteness is a standard way to avoid the Repugnant Conclusion without Lexicality. (e.g., Rachels, or Chang's own work). If A and Z are incomparable (or on a par), you don't have to say A > Z, but Claim 3 *says* A > Z.
          *   Claim 3 is a strong comparative verdict. Claim 6 allows non-verdicts. They aren't contradictory per se (3 says *some* are comparable, 6 says *some* are not).
          *   *However*, Claim 3 says A > *every intermediate*. If the chain from A to Z involves parity steps, transitivity fails. If Transitivity (Claim 2) is dropped, the chain doesn't force Z to be worse than A, but Claim 3 *stipulates* Z is worse than A.
          *   So, dropping Claim 2 helps with Claim 6, and *might* help with the Population Ethics problem (by blocking the transitivity chain), but Claim 3 is still very demanding (A > all intermediates).

  6.  **Drafting the Response:**

      *   **Structure:**
