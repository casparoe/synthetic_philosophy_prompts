answer: |-
  ### Verdict on the Framing
  This is not a dead end; it is the strongest possible skeleton for the book. The tripartite distinction (Ulysses/Constitution/Contract) cuts through the usual mush. Your hunch is correct: the literature's primary failure is treating (2) as a scaled-up version of (1). If you can rigorously demonstrate that (1) and (2) rely on different normative justificatory structures, you have a monograph.

  However, there is a trap: **The Ulysses Trap.** Philosophers love the metaphysics of personal identity (is t1 the same person as t2?). If your PhD student gets stuck on Parfitian reductionism, you will lose two years. You must treat (1) not as a metaphysical problem but as a *normative* one. The question isn't "Are they the same self?" but "Under what conditions does a past self have authority over a future self?"

  Here is the agenda.

  ### The Research Agenda

  #### 1. The Source of Normative Force in Intrapersonal Binding (Case 1)
  **The Question:** Does the authority of a precommitment derive from the *identity* of the binder (it's still "me") or from the *content* of the commitment (it's a rational plan)?
  **The Argument:** You need to settle whether precommitment is an exercise of autonomy or a restriction of it. If it's autonomy, t1 and t2 must be sufficiently continuous. If it's a rational plan, t1 can bind t2 even if preferences change, provided the plan serves t2's deeper interests.
  **Why First:** This is the foundational concept. If you cannot explain why a past self has any standing over a future self without invoking coercion, the entire project collapses. However, you must bracket the metaphysics. Focus on the *normative authority* of prior intentions. This is tractable for philosophy (action theory/ethics) without requiring empirical psychology.
  **Neglect:** Over-discussed in action theory, but under-discussed regarding the *limit* of that authority. You aren't solving personal identity; you are defining the jurisdiction of the past self.

  #### 2. The Limits of the Corporate Person Analogy (Case 1 vs. Case 2)
  **The Question:** At what precise point does the "polity as a single agent" metaphor break down such that Ulysses-style justifications no longer apply to constitutional entrenchment?
  **The Argument:** This targets your hunch about the literature's slippage. You need to argue that a polity is not a Ulysses because the "future majority" is not the "past majority" in the relevant normative sense. The justification for (2) cannot be "self-binding"; it must be "mutual insurance" or "procedural fairness."
  **Why Second:** This depends on Q1. You must first establish what legitimate self-binding looks like (Q1) to demonstrate why constitutional binding *fails* that test. This clears the ground for a distinct theory of political precommitment. It prevents the project from devolving into standard constitutional theory by forcing a negative argument against the dominant analogy.
  **Tractability:** Pure political philosophy/legal theory. No empirical data needed, just conceptual analysis of "the people" and "representation."

  #### 3. The Standing of the Enforcer (Case 3)
  **The Question:** When does third-party enforcement of a precommitment shift from *facilitation* of autonomy to *domination* by the enforcer?
  **The Argument:** This addresses your hunch that (3) does the real work. In the real world, precommitments fail without enforcement (banks, courts, doctors). But giving a third party the power to say "no" to the agent creates a principal-agent problem. The enforcer acquires a veto power that the agent intended only for their past self.
  **Why Third:** This depends on Q1 and Q2. To know if the enforcer is overstepping, you must know what the binder was allowed to bind (Q1) and whether the binding was legitimate to begin with (Q2). This is the most neglected area; legal theory assumes enforcement is neutral, but in precommitment, the enforcer is a co-author of the constraint.
  **Tractability:** Ideal for the postdoc. It bridges legal institutional design and moral philosophy. It moves the book from abstract theory to institutional reality.

  #### 4. The Necessary Conditions for Unbinding (The Trigger)
  **The Question:** Is a legitimate precommitment structure one that includes a unilateral right of revocation by the bound party, and if so, does that render the precommitment useless?
  **The Argument:** This addresses your "trigger" hunch. If (2) requires that the bound generation can pull a trigger, you need to define that trigger. Is it supermajority? Revolution? Judicial review? If the exit door is too open, the commitment is cheap talk. If it's locked, it's tyranny.
  **Why Fourth:** This is the synthesis. You cannot define the legitimate exit conditions until you have defined the legitimate entry conditions (Q1 & Q2) and the guardian of the door (Q3). This forms the book's normative conclusion: a theory of *conditional* precommitment.
  **Tractability:** High. It allows you to test the theories from Q1-3 against hard cases (constitutional amendment, addiction treatment contracts, sovereign debt).

  ### Defense of the Order

  1.  **Dependency:** Q1 establishes the unit of analysis (the self). Q2 establishes the disanalogy (the polity). Q3 establishes the mechanism (the enforcer). Q4 establishes the safety valve (the exit). You cannot argue about the exit (Q4) if you haven't defined who is locked in (Q1/Q2) and who holds the key (Q3).
  2.  **Risk Management:** Q1 is the most dangerous (metaphysical black hole). By placing it first, you force the team to resolve it or bracket it immediately. If you leave it for later, it will haunt every chapter.
  3.  **Neglect:** Q3 is the most novel. Most books stop at Q2. By placing Q3 before the conclusion, you ensure the book has a distinctive "mechanism" contribution, not just a "theory" contribution.
  4.  **Workflow:**
      *   **Year 1:** Q1 & Q2. (PI and PhD). Establish the theoretical boundary.
      *   **Year 2:** Q3. (Postdoc). Develop the institutional/ enforcement angle.
      *   **Year 3:** Q4 & Synthesis. (All). Write the book, integrating the three strands into a unified theory of legitimate constraint.

  ### Conditions for Reordering

  *   **Move Q3 Up:** If you find during Year 1 that the "Ulysses" literature (Q1) is truly exhausted and offers no new purchase, abandon the deep dive on intrapersonal authority. Assume a pragmatic definition of self-binding and move immediately to Q3. The "Enforcer" angle is your most distinctive hook; if the foundation is shaky, build the house on the hook instead.
  *   **Move Q4 Up:** If you find that the "trigger" mechanism is the only thing that actually distinguishes legitimate from illegitimate precommitment in your case studies, make Q4 the central thesis rather than the conclusion. This shifts the book from "When is precommitment okay?" to "Precommitment is only okay if it includes X exit clause."
  *   **Drop Q1:** If the team agrees that the "normative authority of the past self" is a pseudoproblem, collapse Q1 into Q2. Argue that intrapersonal precommitment is *also* a social/contractual phenomenon (relying on social expectations to enforce), which merges (1) and (3). This is risky but radical.

  ### Summary
  Your framing is sound. The risk is getting stuck in the metaphysics of (1). The opportunity is the undertheorized mechanics of (3). The order above forces you to clear the metaphysical deck quickly so you can spend the bulk of the project on the political and institutional novelty (2 & 3), culminating in a practical criterion for legitimacy (4).
