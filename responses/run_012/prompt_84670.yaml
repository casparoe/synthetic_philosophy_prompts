answer: |-
  # Specification of Desiderata for a Unified Species Concept

  ## 1. Empirical Adequacy: The Boundary Cases
  An adequate theory must provide ontological grounding and operational guidance for the following evolutionary scenarios without resorting to ad hoc exceptions:

  *   **Ring Species:** The theory must account for continuous variation across a geographic ring where terminal populations are reproductively isolated but connected by gene flow. It must specify whether the ring constitutes one species or multiple, and where the boundaries lie, without relying on arbitrary geographic cuts.
  *   **Obligately Asexual and Apomictic Lineages:** The theory must delimit species in the absence of interbreeding. It cannot define species via reproductive isolation if reproduction is clonal. It must specify what constitutes cohesion or divergence in lineages that do not recombine sexually.
  *   **Freely Hybridising Trees (Reticulate Evolution):** The theory must handle groups where hybridization is frequent and barriers are porous (e.g., *Quercus*, *Salix*). It must determine whether species are defined by barriers to gene flow or by ecological/phenotypic clusters despite gene flow.
  *   **Prokaryotes (Horizontal Gene Transfer):** The theory must accommodate lineages where the "tree of life" is a network due to lateral gene transfer. It must define species boundaries when genetic cohesion is maintained by ecological selection rather than vertical descent alone.
  *   **Fossil Sequences (Anagenesis):** The theory must address temporal lineages where morphological change is gradual and no sharp breaks exist. It must specify whether arbitrary time-slices constitute distinct species or whether the entire temporal sequence is a single evolving lineage.

  ## 2. Conceptual Coherence: The Required Distinctions
  The theory must preserve the following logical distinctions to avoid category errors:

  *   **Category vs. Taxon:** It must distinguish the *species category* (the rank or ontological status) from a *species taxon* (a specific group, e.g., *Homo sapiens*). The theory defines the former; empirical data identifies the latter.
  *   **Concept vs. Criteria:** It must distinguish the *theoretical definition* (what a species is) from the *operational criteria* (how we identify it). A failure here conflates epistemology (diagnosis) with ontology (existence).
  *   **Classes vs. Individuals:** It must specify whether species are natural kinds (classes defined by intrinsic properties) or historical individuals (concrete spatiotemporally restricted lineages). It cannot treat them as both simultaneously without resolving the logical tension.
  *   **Existence vs. Delimitation:** It must distinguish the *reality* of species (whether they exist in nature) from our *ability to delimit* them (whether we have the data to draw boundaries). Uncertainty in delimitation must not imply uncertainty in existence.

  ## 3. Evolutionary Consistency: The Biological Constraints
  The theory cannot contradict established findings in evolutionary biology:

  *   **Species as Lineages:** It must treat species as segments of population lineages extending through time, not static snapshots.
  *   **Decoupling of Properties:** It must accommodate the fact that monophyly, reproductive isolation, and ecological cohesion are contingent properties that often come apart. No single property can be a necessary and sufficient condition for all groups.
  *   **Process Pluralism:** It must acknowledge that speciation mechanisms (allopatry, sympatry, polyploidy, HGT) vary. The concept must be robust to different modes of origin.

  ## 4. Project Constraints: The Database Requirements
  To function within the specific context of your biodiversity infrastructure, the theory must satisfy:

  *   **Workability:** The concept must be applicable by non-specialists (data curators, ecologists) without requiring full phylogenomic reconstruction for every record.
  *   **Comparability:** Species counts must be comparable across disciplines (e.g., a bacterial "species" must be equivalent in rank and meaning to an avian "species" for diversity metrics).
  *   **Nomenclatural Compatibility:** The concept must sit alongside existing Codes (ICZN, ICN, ICNP). It must respect the principle of typification, where names are tied to fixed type specimens (or strains), even if the biological concept is dynamic.

  ***

  # Critical Analysis of the Specification

  ## 1. Genuine Desiderata vs. Project Artefacts

  **Genuine Desiderata (Biological/Philosophical Necessities)**
  *   **Empirical Adequacy:** The cases (ring species, asexuals, etc.) are genuine biological realities. Any theory ignoring them is biologically false.
  *   **Conceptual Distinctions:** The distinction between ontology (what exists) and epistemology (how we know) is a philosophical necessity. Collapsing them leads to circular reasoning.
  *   **Evolutionary Consistency:** The finding that species are lineages is the consensus of modern evolutionary biology. A theory contradicting this is obsolete.

  **Project Artefacts (Administrative/Practical Impositions)**
  *   **Comparability of Counts:** This is an artefact of database architecture, not biology. Evolution does not produce uniform "units" of diversity across bacteria and birds. Demanding comparability imposes a false uniformity on heterogeneous biological processes.
  *   **Workability for Non-Specialists:** This is a usability constraint. Biological reality is complex; simplifying it for ease of use risks distorting the science.
  *   **Nomenclatural Compatibility (Types):** The Linnaean system of type specimens is a human information management system, not a biological feature. Lineages evolve; type specimens do not. Requiring alignment ties a dynamic biological concept to a static administrative anchor.

  ## 2. Incompatible Pairs (Trade-offs)

  The following pairs of requirements cannot be jointly satisfied without compromise. You must choose which side of the tension to privilege.

  *   **Universality (Empirical Adequacy) vs. Comparability of Counts:**
      *   *Conflict:* If you respect biological reality (Universality), you must acknowledge that a bacterial species (defined by genomic clusters/HGT) is not ontologically equivalent to a bird species (defined by reproductive isolation).
      *   *Consequence:* You cannot have both biological accuracy and comparable diversity metrics. Enforcing comparability requires forcing distinct biological entities into a single arbitrary unit, rendering the counts biologically meaningless.

  *   **Lineage Concept (Evolutionary Consistency) vs. Nomenclatural Types (Project Constraint):**
      *   *Conflict:* A lineage is a process extending through time. A type specimen is a single individual at a single point in time. As the lineage evolves, it moves away from the phenotype/genotype of the type.
      *   *Consequence:* Strict adherence to types fixes the name to a static point, potentially severing it from the evolving lineage it is meant to represent. A dynamic lineage concept often requires decoupling names from types (as in PhyloCode), which violates your nomenclatural constraint.

  *   **Workability (Project Constraint) vs. Conceptual Rigor (Concept vs. Criteria):**
      *   *Conflict:* Rigorous delimitation of lineages often requires complex data (coalescent modeling, phylogenomics). Simplifying for non-specialists requires relying on proxies (morphology, barcoding gaps).
      *   *Consequence:* Making the concept "workable" inevitably conflates the *concept* (lineage) with the *criteria* (morphological similarity), violating the distinction between ontology and epistemology.

  *   **Fossil Continuity (Empirical Adequacy) vs. Discrete Counts (Project Constraint):**
      *   *Conflict:* Anagenetic fossil sequences are continuous. Database records require discrete, countable units.
      *   *Consequence:* To generate counts, you must arbitrarily slice continuous lineages into discrete species, contradicting the biological reality of the fossil record.

  ## 3. The Exclusionary Requirement

  The single requirement that rules out the greatest number of candidate theories is:

  **Universality of Empirical Coverage (specifically: Prokaryotes + Sexual Eukaryotes + Fossils)**

  *   **Reasoning:** Most established species concepts are domain-specific.
      *   The **Biological Species Concept (BSC)** is immediately ruled out because it cannot handle asexuals, fossils, or prokaryotes.
      *   The **Phylogenetic Species Concept (PSC)** struggles with reticulate evolution (hybridizing trees) and prokaryotic HGT, often leading to excessive splitting that contradicts nomenclatural stability.
      *   The **Ecological Species Concept (ESC)** is difficult to apply to fossils (ecology is inferred) and prokaryotes (niche definition is granular).
      *   **Genomic Cluster Concepts** work for bacteria but fail to capture the process of speciation in sexually reproducing macrofauna.

  By demanding a *single* concept that functions across all these modes of evolution without contradiction, you eliminate all monistic concepts. This requirement forces you toward **Species Pluralism** (accepting different concepts for different groups) or a highly abstract **General Lineage Concept** (which often lacks the operational specificity required for your "Workability" constraint).

  **Conclusion:**
  Your project faces a fundamental tension. The requirement for **Comparability of Counts** is the most dangerous *project artefact* because it demands biological falsehoods for the sake of database utility. However, the requirement for **Universality of Empirical Coverage** is the most exclusionary *theoretical filter*, as it renders almost all existing monistic species concepts inadequate. You cannot satisfy the biological desiderata and the database constraints simultaneously; you must decide whether the database serves biology (accepting incomparability and complexity) or whether biology serves the database (accepting standardization and simplification).
