prompt: |-
  ok so for my aesthetics seminar I have to present a paper next Tuesday and I want you to be my Q&A sparring partner — basically tell me what I'm about to get hit with.

  My thesis in one line: everyone attacks Tolstoy's theory of art by attacking his religious moral standard, but the standard and the definition are seperable, and the definition — art as a human activity in which one person deliberately transmits to others, by means of external signs, a feeling they have actually lived through, so that the others are infected by it — is defensible and does real work even if you think the Christian criterion is a disaster. So I want to keep the infection criterion and drop the requirement that the feeling flow from a religious perception of life. I also claim the three conditions he tacks on (individuality, clarity, sincerity) can be read as conditions on successful transmission rather than on moral content, and that his long rant about counterfeit upper-class art is really an attack on imitation and manufactured effect, not on pleasure — so it survives even for someone with zero Tolstoyan moralism.

  The room: mostly analytic philosophy of art people. My prof is a cognitivist about emotion and will press me on whether infection is a genuine criterion of art or just a causal story about how feelings spread. Two grad students work on the paradox of fiction and emotional engagement. One art historian studies the Russian avant-garde, thinks Tolstoy is a reactionary with terrible taste, and will say so. One person does the ethics-of-art/ethicism literature and is probably my only ally on the second half. Nobody there has read the whole book, but they all know he trashes Shakespeare and Wagner.

  Give me the prep sheet: the seven or eight objections this specific room will actually raise, in the order they'll come, phrased the way these people would phrase them, each with my best two-minute reply and a flag on where the reply is soft. Say which objections have real force and which I should just concede. Include the one I'm hoping nobody asks. And at the end, tell me what would change your mind about whether the separable-halves move actually works — what arguement or example would show that the infection criterion can't be detached from his moral standard — and where your own reasoning there is most likely to fail.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

