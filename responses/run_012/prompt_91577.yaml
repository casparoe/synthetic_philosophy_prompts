answer: |-
  You have put your finger on the central nerve of contemporary philosophy of mind and science. The pattern you describe is the engine behind the most significant debate in metaphysics over the last forty years. Your intuition—that applying the "consciousness argument" to temperature would dismantle chemistry—is shared by many philosophers of science and is often used as a *reductio ad absurdum* against strict reductionism.

  Here is the mapping of the territory you are exploring, the names for the specific moves you identified, and where the philosophical consensus diverges from your description.

  ### 1. The Name for the Redundancy: *Causal Closure* and *Supervenience*

  You describe a situation where fixing the lower-level facts fixes the higher-level feature, rendering the higher-level description seemingly redundant for explanatory purposes. Philosophy splits this into two distinct concepts that work in tandem:

  *   **Supervenience:** This is the name for the dependency relation you described ("Fix the lower-level facts, and the higher-level feature..."). If property A (temperature) supervenes on property B (molecular kinetic energy), there can be no change in A without a change in B. This captures the "no addition" aspect of your description.
  *   **The Causal Closure of the Physical:** This is the principle that every physical event has a sufficient physical cause. In your example, the molecular collisions (micro) are sufficient to explain the pressure change (macro).

  When you combine these, you get the sensation of redundancy. If the micro-level is sufficient (Closure) and the macro-level is fixed by the micro-level (Supervenience), the macro-level appears to be a "shadow" cast by the micro-level.

  The specific label for the *explanatory* redundancy you noted—where the coarse description adds no new information once the fine one is in hand—is often called **Explanatory Exclusion**. This principle, championed by Jaegwon Kim, suggests that no single event can be given more than one complete and independent explanation. If the micro-explanation is complete, the macro-explanation is excluded.

  ### 2. The Name for the Inference to Idleness: *The Causal Exclusion Argument*

  The inference you identified—moving from "the micro fixes the macro" to "the macro does no causal work"—has a specific name: **The Causal Exclusion Argument**.

  This is the dominant argument for **Epiphenomenalism** (the view that mental/higher-level states are causally inert by-products). The structure is exactly as you surmised:
  1.  The physical domain is causally closed (micro causes are sufficient).
  2.  Higher-level features supervene on the physical (they don't add new substance).
  3.  Therefore, higher-level features are either identical to the physical features or they are causally idle.
  4.  If they are distinct (as you suggest temperature is distinct from kinetic energy), they must be idle.

  When this argument is applied to consciousness, it leads to the conclusion that qualia (the feeling of pain, redness, etc.) do not cause behavior; only the neural firing does. Your objection is that if this argument holds for consciousness, it must hold for temperature, acidity, and fitness. If temperature is epiphenomenal, then thermodynamics is a fiction. Since thermodynamics is not a fiction, the argument must be flawed.

  ### 3. The Nearest Named Ideas: *Non-Reductive Physicalism* and *Interventionism*

  You asked for the nearest named ideas and how they carve the territory. The philosophical response to your objection generally falls into two camps that attempt to save the causal efficacy of the "coarse" level.

  #### A. Non-Reductive Physicalism (The "Multiple Realizability" Defense)
  Proponents like Jerry Fodor and Hilary Putnam argue that higher-level properties are **multiply realizable**. Temperature is not *identical* to mean kinetic energy in all contexts (e.g., in a plasma vs. a solid, or in non-equilibrium systems). Because "temperature" captures a pattern that persists across *many* different micro-configurations, it has explanatory power that the micro-description lacks.
  *   **The Edge:** The micro-description is too specific. To explain why *this* gas expands, you need the micro-details. To explain why *all* gases expand when heated, you need Temperature. The macro-property is not redundant because it provides **stability** and **generality** that the micro-property cannot.
  *   **The Fit:** This aligns well with your view. It treats the redundancy not as a bug, but as a feature of abstraction.

  #### B. Interventionist Causation (The "Manipulability" Defense)
  This is likely the most satisfying framework for a physical chemist. Developed by James Woodward, this theory defines causation not by "ontological oomph" but by **invariance under intervention**.
  *   **The Concept:** $X$ causes $Y$ if an intervention on $X$ changes $Y$, holding other factors fixed.
  *   **The Application:** Can I intervene on Temperature? Yes (put the beaker on a hot plate). Does it change Pressure? Yes. Do I need to know the specific trajectory of every molecule to make this intervention work? No.
  *   **The Resolution:** Under Interventionism, the "redundancy" you perceive is irrelevant. Causation is about **control**, not **constitution**. The micro-facts constitute the temperature, but the temperature is the **causal handle**. The micro-level is causally sufficient, but the macro-level is causally **relevant**.
  *   **The Edge:** This carves the territory differently than your description. You suggest the macro is "redundant once the fine one is in hand." Interventionism argues the fine one is *never* truly "in hand" for practical agents, and even if it were, the macro-relationship is more robust (invariant) across different background conditions.

  ### 4. How the Received Discussion Carves the Territory Differently

  You asked where the edges lie and how the discussion differs from your description. There is one crucial disanalogy that philosophers use to defend the idea that consciousness might be idle even if temperature is not.

  **Functional vs. Intrinsic Properties**
  *   **Temperature (Functional/Relational):** Temperature is *defined* by its causal role (what it does to volume, pressure, etc.). To be a temperature *just is* to play a certain causal role in a thermodynamic system. Therefore, it cannot be causally idle, because its identity is tied to its causal power.
  *   **Consciousness (Intrinsic/Qualitative):** Many philosophers (especially dualists or property dualists) argue that consciousness is defined by "what it is like" to have it (qualia), not by what it does.
  *   **The Divergence:** If consciousness is an *intrinsic* property that merely *accompanies* the functional machinery, the Causal Exclusion Argument bites harder. You can conceive of a "Philosophical Zombie" (same micro-physics, same behavior, no consciousness). You cannot conceive of a "Thermodynamic Zombie" (same micro-physics, same pressure/volume relations, no temperature), because temperature *is* those relations.

  **Where your description challenges the consensus:**
  You are effectively arguing for **Causal Pluralism** or **Compatibilism**. You are noting that "causation" is not a single, monolithic resource that gets used up. The micro-level can be sufficient *and* the macro-level can be efficacious, provided we understand causation as a relationship between variables (Interventionism) rather than a transfer of energy (Process theories).

  ### Summary of Labels

  1.  **The Redundancy:** *Causal Closure of the Physical* combined with *Supervenience*. (Often leads to the threat of *Explanatory Exclusion*).
  2.  **The Inference to Idleness:** *The Causal Exclusion Argument* (leading to *Epiphenomenalism*).
  3.  **The Defense of the Macro:** *Non-Reductive Physicalism* or *Interventionist Causation*.
  4.  **Your Position:** You are articulating a **Special Sciences Autonomy** argument. You are pointing out that the Causal Exclusion Argument proves too much; if it eliminates the mind, it eliminates the chemistry, which is an unacceptable cost.

  ### The Verdict

  Your suspicion is correct: there is no consensus name for the specific pattern *as you formulated it* because your formulation exposes a flaw in the standard formulation of the Exclusion Argument.

  The standard philosophical move is to distinguish **Causal Sufficiency** (which the micro has) from **Causal Relevance** (which the macro retains). The micro-facts are sufficient to produce the effect, but the macro-facts are relevant because they identify the *difference-makers* that persist across variations in the micro-details.

  If you read further, look for **James Woodward's *Making Things Happen*** (for the interventionist account) or **Jaegwon Kim's *Physicalism, or Something Near Enough*** (for the exclusion argument you are critiquing). You will find that your "late career pattern" is the exact pivot point upon which modern metaphysics turns.
