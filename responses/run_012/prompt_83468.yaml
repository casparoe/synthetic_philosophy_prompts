prompt: |-
  I'm a lapsed philosophy of physics person — did a decent chunk of it as an undergrad, then went off to do something else entirely, so my spacetime theory is rusty but not absent. I need help settling a long-running pub argument, and I want ammunition rather than vibes.

  The mate in question keeps saying "all motion is relative" — said like it's a done deal, like everyone knows it since relativity — and he uses it to wave away Newton's bucket. His line is that the bucket only seems to prove the reality of absolute space if you've already smuggled in absolute motion, and since all motion is relative, the whole demonstration just collapses. Sometimes he puts it stronger: that there's no fact of the matter about who's really moving. I genuinely can't tell whether he's saying something trivially true that everyone already accepts, something false, or something genuinely radical that would actually sink substantivalism.

  So: you're an expert on the foundations of spacetime theories, comfortable in both the physics and the philosophical literature on substantivalism and relationism, and I'd like you to take this seriously rather than giving me the textbook tour. Start by brainstorming — before assessing anything, write out as many distinct, precise readings of "all motion is relative" as you can come up with, including the silly or obviously hopeless ones, and only then go back and evaluate them. Don't prune too early; I'd rather have ten readings and a verdict on each than three polished ones.

  For every reading I want to know: what exactly it claims — relative to what (a frame? other bodies? an observer? a convention of language?), which motions it covers (velocity? acceleration? rotation? all of them?), and whether it's a claim about what exists, about what can be known, or about how we should talk. Then a verdict: platitude, substantive and defensible, or false. And what it commits you to about the reality of space, time, and spacetime points.

  Then the payoff. Which reading is my mate most likely groping for, and does that reading actually do any work against the bucket? If some readings leave the bucket argument completely untouched while others genuinely damage it, say so plainly and seperate them out. I have a suspicion that the true readings are the boring ones and the interesting ones are either contested or false, so flag it explicitly if there's a reading under which the slogan is true but trivial and a nearby reading under which it's interesting but shaky — that's where I think the trick is hiding.

  Two follow-ups while you're at it. First, is the slogan, on any of its readings, something a relationist needs and a substantivalist can happily accept? If so, say which, because I keep suspecting he's quoting a platitude at me. Second, does general relativity actually vindicate him? I've heard people say it does, and I've also heard that it leaves rotation in some sense absolute — something about local inertial frames, and about whether the Machian idea that inertia is fixed by the distribution of matter is really implemented. I can't tell which story is right, so don't assume I know.

  Write it as a numbered list I can take to the pub with me, one reading per entry, verdict attached, in British English throughout. Don't pull your punches about which readings are just confused.
reasoning: |-
