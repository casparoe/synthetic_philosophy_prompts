prompt: |-
  I run a small reading group on concept learning that's somehow turned into an actual project, and for the last few months we've been stuck on Bongard problems -- the puzzle format where you're shown a handful of little diagrams on the left and a handful on the right and have to figure out the rule that separates them, except that the interesting ones can't be cracked by noticing a feature you already had; you have to invent a new way of describing the pictures before the rule even becomes visible. There's three of us, maybe two years of part-time effort, no compute budget worth mentioning, so training something to solve the whole collection is off the table. What we'd like to walk away with is closer to a theory: when does a concept genuinely require re-representation instead of just reweighting, and can that distinction be made precise enough to argue about. Which is why I'm asking you instead of just diving in -- we keep disagreeing about which of our questions is the load-bearing one, and I suspect we're sinking time into things that are downstream of something none of us has noticed.

  So what I want is a defended agenda, not a survey. Take the open questions in this area and tell me which ones matter most for a group like ours, in order, and why: which are upstream of which (does the ambiguity question have to be settled before the difficulty question even makes sense?), which are actually tractable for three people with two years and no big models, which are neglected versus which just look neglected, and which seem deep but would eat our time for nothing. I care as much about the reasoning as the list -- the trade-offs you're making, and what would have to happen over the next year or so for you to reorder it.

  Some of the things we keep going back and forth on, in case it helps: whether there's a real line between a problem you solve by reweighting features you already had and one that forces a new primitive, or whether that's just a fact about the solver; whether "difficulty" for one of these puzzles is well-defined at all, or always relative to a vocabulary; what to do about problems with more than one defensible rule, since a lot of them seem to have two or three and no obvious fact of the matter about the intended one; whether the few-examples setup is still the right frame now that everyone has models that have seen basically everything, or whether we'd just be studying a historical artifact; whether there's a hierarchy of representational jumps and whether that ordering is stable across solvers; and whether concepts induced this way have any claim to being the natural ones. We're also weirdly drawn to the self-referential ones, where the rule for a side refers to the puzzle itself, but none of us can tell if that's a real frontier or a party trick. Tell me where you'd plant the flag.
reasoning: |-
  Here's a thinking process that leads to the suggested agenda:

  1.  **Analyze the User and Context:**
      *   **Who:** A small reading group (3 people) turned research project.
      *   **Topic:** Concept learning, specifically Bongard Problems (BPs).
      *   **Constraint:** 2 years part-time, negligible compute budget (no training massive models).
      *   **Goal:** A *theory* of re-representation vs. reweighting, not a SOTA solver.
      *   **Current State:** Stuck, disagreeing on "load-bearing" questions, suspecting they are working on downstream issues.
      *   **Request:** A *defended agenda* (ranked list of questions), not a survey. Needs reasoning on trade-offs, upstream/downstream relationships, tractability, and neglectedness.
      *   **Specific Tensions Mentioned:**
          *   Reweighting vs. New Primitive (solver-relative?).
          *   Difficulty definition (well-defined vs. vocabulary-relative).
          *   Ambiguity (multiple defensible rules).
          *   Few-shot relevance (historical artifact vs. valid frame).
          *   Hierarchy of representational jumps.
          *   Naturalness of induced concepts.
          *   Self-referential problems (frontier or party trick?).

  2.  **Deconstruct the Core Problem:**
      *   Bongard Problems are the "fruit fly" of conceptual bottlenecks.
      *   The core philosophical/computational tension is: *Is intelligence finding the right weights for fixed features, or finding the right features themselves?*
      *   For a low-compute, theory-focused group, the value isn't solving BPs (Deep Learning can't really do this well yet without cheating, and symbolic AI struggles with perception). The value is *characterizing the gap*.
      *   The user suspects they are arguing about downstream effects. I need to identify the *upstream* metaphysical/operational definitions that make the downstream arguments resolvable.

  3.  **Evaluate the User's Tensions (Upstream vs. Downstream):**
      *   *Reweighting vs. New Primitive:* This is the core phenomenon. But is it a property of the *problem* or the *solver*? If it's solver-relative, a general theory is impossible. If it's problem-relative, we need a baseline solver. -> **Upstream.**
      *   *Difficulty:* If difficulty is relative to vocabulary, we can't rank BPs objectively. We need to define the "vocabulary space." -> **Upstream.**
      *   *Ambiguity (Multiple Rules):* If a BP has two valid rules, is it a bad BP or a feature? This depends on whether we seek *the* truth or *a* consistent explanation. -> **Mid-stream.**
      *   *Few-shot relevance:* This is a meta-commentary on the field. For a theory of concepts, the *structure* of the inference matters more than the data volume. -> **Downstream/Distractor.**
      *   *Hierarchy of Jumps:* This is the output of the theory, not the input. -> **Downstream.**
      *   *Naturalness:* Hard to define without a cognitive baseline. -> **Downstream.**
      *   *Self-referential:* Edge case. Fun, but likely a "party trick" unless it reveals something about recursion in concept formation. -> **Low Priority.**

  4.  **Formulate the Defended Agenda:**
      *   *Constraint Check:* 3 people, 2 years, no compute. They need pen-and-paper, formalism, or small-scale symbolic experiments. They cannot train vision transformers.
      *   *Goal:* A precise distinction between reweighting and re-representation.

      *   **Priority 1: The Solver-Relative Baseline (The "Zero-Point" Problem).**
          *   *Why:* You cannot say a problem *requires* re-representation unless you define what counts as "already had." If the distinction is purely solver-relative, the project collapses into psychology of specific agents. They need a *canonical minimal solver*.
          *   *Tractability:* Define a formal language (e.g., a specific DSL for shapes/relations) that represents the "pre-representation" state.
          *   *Upstream:* Solves the "Reweighting vs. Primitive" debate by fixing the baseline.

      *   **Priority 2: The Vocabulary Relativity of Difficulty.**
          *   *Why:* Once the baseline is set, "difficulty" becomes "distance from baseline in representation space." This makes difficulty measurable.
          *   *Tractability:* Map existing BPs to the DSL. Measure the "edit distance" to the solution rule.
          *   *Upstream:* Necessary before ranking problems or claiming a hierarchy.

      *   **Priority 3: Ambiguity as Feature, Not Bug.**
          *   *Why:* Many BPs *do* have multiple rules. Ignoring this kills the theory. Embracing it allows for a "solution space" topology.
          *   *Tractability:* Catalog ambiguous BPs. Classify types of ambiguity (equivalent rules vs. competing hierarchies).
          *   *Mid-stream:* Depends on 1 & 2.

      *   **Priority 4: The "Few-Shot" Frame Validity.**
          *   *Why:* Address the user's worry about historical artifacts.
          *   *Decision:* It *is* valid for concept learning theory, even if LLMs bypass it. The constraint *is* the point.
          *   *Tractability:* Philosophical/Formal argument, less empirical work needed.

      *   **Priority 5 (Deprioritized): Self-Reference & Naturalness.**
          *   *Why:* Self-reference is likely a edge case. Naturalness is too vague without cognitive science backing.

  5.  **Drafting the Argument (Iterative Refinement):**
      *   *Tone:* Direct, academic but pragmatic, respectful of their constraints.
      *   *Key Insight:* The "Reweighting vs. Re-representation" debate is a trap if not grounded in a specific *language of thought*. The agenda must force them to build that language.
      *   *The "Load-Bearing" Insight:* The distinction isn't in the *pictures*, it's in the *description language*. The project should be about defining the "Phase Transition" in description length/complexity.
      *   *Re-ordering Condition:* What would change my mind? If they find a BP that breaks *any* fixed language (Gödelian incompleteness of visual concepts), then Priority 1 shifts to "Proving Impossibility."

  6.  **Refining the "Defended" Aspect:**
      *   I need to explicitly tell them what *not* to do.
      *   Don't try to solve all 100 BPs.
      *   Don't worry about LLMs solving them via brute force.
      *   Do focus on the *cost of description*.

  7.  **Final Polish:**
      *   Ensure the "Why" for each point connects back to their specific constraints (3 people, no compute).
      *   Make sure the "Upstream/Downstream" logic is clear.
      *   Address the specific tensions they listed (ambiguity, difficulty, self-reference).

      *(Self-Correction during drafting)*: I initially thought about suggesting they code a solver. But they have no compute and 3 people. A full solver is a trap. They should build a *specification language* and manually map problems to it. The "solver" is the human + the language. The experiment is "How hard is it to write the rule in Language L vs Language L'?"

      *(Refining the "Solver-Relative" point)*: This is the crux. If they don't fix the baseline, they will argue forever. I need to emphasize that they must *choose* a baseline arbitrarily but rigorously. It's not about finding the "true" human baseline, but a "formal" one.

      *(Addressing Ambiguity)*: This is actually a great place for a small project. "TheMultiplicity Project." Catalog which BPs have multiple valid descriptions in their formal language.

      *(Addressing Self-Reference)*: Dismiss it gently. It's recursion, which is a specific type of re-representation, but too narrow for a general theory.

  8.  **Final Structure:**
      *   **Executive Summary:** The core thesis (Language is the variable).
      *   **The Agenda (Ranked 1-4):** With Upstream/Downstream logic.
      *   **The "Don't Do" List:** Protecting their time.
      *   **Conditions for Reordering:** When to pivot.
      *   **Closing:** Encouragement.

      *(Check against constraints)*: 2 years part-time. This agenda is feasible if they focus on formalism and manual annotation of a subset of BPs, not building AGI.

      *(Check against "Defended")*: I need to argue *why* this order. E.g., Why is Baseline before Difficulty? Because Difficulty is a function of Baseline.

      *(Check against "Load-Bearing")*: The load-bearing question is "What is the fixed vocabulary?" Everything else hangs on that.

