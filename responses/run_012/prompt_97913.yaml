answer: |-
  Dear Colleague,

  It is a pleasure to correspond with someone who understands that ethics, like immunology, requires a rigorous specification before you can begin to test the hypothesis. You are right to suspect that Augustine's absolutism looks like a failure to weight competing harms, but you are also right to sense that dismantling it requires more than just intuition. If we treat this as a protocol for a theory of lying, we need to establish the control conditions, the necessary markers, and the exclusion criteria. The first requirement any adequate theory must meet is what we might call the subjective falsity condition. A theory cannot define a lie simply as stating something objectively false, because that would classify your sincere falsehood case as a lie, which it is not. If a speaker believes what they say is true, they are mistaken, not dishonest. This is non-negotiable because lying is a violation of trust rooted in the speaker's mind, not a violation of factual accuracy. If you accidentally give me wrong directions because you yourself are lost, you have not lied, and any theory that claims otherwise has confused error with deceit.

  Closely tied to this is the assertion requirement. The theory must distinguish between stating a fact and engaging in fiction or play. This handles your granddaughter's dinosaur announcement. She is not lying because the context signals that no claim to truth is being made. Similarly, this handles the case of lying to a machine or a child, though here the waters muddy. If you lie to a voice-activated assistant, you are treating it as a competent peer in terms of information transfer, but since it cannot hold beliefs, you cannot violate its trust. A robust theory should probably say that lying requires an audience capable of being deceived, which suggests that lying to a machine is a category error, whereas lying to a child is fully coherent because the child possesses the capacity for belief. However, some theorists argue the act is defined by the speaker's intent alone, regardless of the audience's capacity. This is a point of contention, but the safer specification is that the audience must be the kind of entity that can form beliefs, otherwise the mechanism of deception cannot engage.

  Then we have the intention to deceive, which is the standard view you mentioned. This requirement says that to lie, you must not only state what you believe is false but do so with the aim of making the listener believe it. This handles the case of the joker who tells a falsehood knowing no one will believe him. Under the standard view, that is not a lie because the intent to deceive is absent. Augustine, however, pushes back here. He argues that the intent to deceive is inherent in the act of asserting what you know to be false, or that the sin lies in the double-heartedness of speaking against your own mind, regardless of whether you expect to be believed. This creates a tension. If you require intent to deceive as a non-negotiable condition, you exclude Augustine's broader definition. If you drop it, you capture the joker but risk over-inclusion. The intention requirement is widely held but not universal, and it is the first place where the standard theory and the Augustinian theory diverge.

  Now we move to the moral evaluation, which is where your background in weighing competing harms becomes critical. A theory of lying must distinguish between defining the act and judging its morality. This is perhaps the most important specification of all. Augustine fails here because he collapses the definition into the moral judgment. For him, to lie is by definition to sin. An adequate theory must allow that lying is a specific type of act that can then be evaluated as justified, unjustified, or obligatory depending on the context. This is non-negotiable for anyone who believes that lying to a murderer at the door to save a victim is morally permissible. If a theory builds wrongness into the definition, it cannot account for justified lies without contradicting itself. Therefore, the requirement that the theory must separate the taxonomy of the act from the ethics of the act is a hard constraint. Augustine's ban survives the definitional constraints mostly, though it struggles with the joker case, but it fails decisively on this moral separation requirement. It cannot accommodate the intuition that competing harms matter because it treats the act as intrinsically toxic regardless of the outcome.

  This brings us to the most difficult case for any theory, the one involving your colleague in the misconduct hearing. This is the case of the misleading truth, often called paltering. The colleague spoke only truths but intended to create a false impression. The standard theory, which requires stating what one believes to be false, says this is not a lie. Your gut, and the intuition of many ethicists, says it functions exactly like a lie in terms of moral harm. Here is where the specifications come into conflict. If you require objective or subjective falsehood as a necessary condition, you cannot classify your colleague's behavior as lying. If you relax that condition to include any intent to mislead, you risk capturing too much, such as bluffing at poker. Poker is a crucial test case because it involves intent to deceive and false implications, but it occurs within a convention where deception is expected and consented to. A good theory must explain why poker bluffing is not a lie while your colleague's testimony is. The requirement that does the most work here is the convention condition. The theory must account for the normative expectations of the context. In poker, deception is part of the rules; in a misconduct hearing, truthfulness is the rule.

  So we have a set of requirements that are difficult to satisfy simultaneously. We need subjective falsity, we need intent to deceive, we need to distinguish act from morality, and we need to account for context conventions. The single requirement that eliminates the most popular theories is the demand to handle the misleading truth case without collapsing the distinction between lying and merely misleading. Many theories fall apart here. The standard view fails because it lets the colleague off the hook definitionally. The broad view that says any intent to mislead is a lie fails because it condemns the poker player. The Augustinian view fails because it condemns the doctor who comforts the dying patient with false hope, lacking the nuance to weigh the harm of distress against the harm of falsehood. If I had to choose the one constraint that acts as the greatest filter, it is the requirement that the theory must explain why we feel morally outraged by the misleading truth even if it is technically not a lie. This forces the theory to move beyond simple definitions and into the mechanics of trust. It suggests that the core wrong of lying is not the falsehood itself, but the exploitation of the listener's trust in the speaker's communicative norms.

  When we score the standard view against this list, it performs well on the subjective falsity and assertion requirements. It handles the granddaughter and the sincere falsehood correctly. It struggles with the misleading truth, as noted, and it often struggles with the doctor case unless it allows for moral exceptions, which some strict Kantians do not. It handles poker well by appealing to mutual consent. Augustine's view scores highly on the subjective falsity requirement, perhaps even better than the standard view because it focuses on the speaker's relationship to the truth rather than the listener's belief. However, it fails the moral separation requirement completely. It also risks failing the convention requirement if it condemns all falsehoods regardless of context, though Augustine did distinguish between jokes and serious assertions. The requirement that kills the Augustinian ban is the one demanding that a theory accommodate competing harms. By making the prohibition absolute, it renders the theory useless for practical ethics in a world where values conflict, such as your lab environment where withholding preliminary data might be necessary to prevent panic, or the medical case where truth causes unnecessary suffering.

  Finally, regarding your specific interest in scientific misconduct, the theory must handle the case of the researcher dropping failed runs. This is technically a lie of omission or a false implication of completeness. If you publish data implying it is representative when you know it is cherry-picked, you are asserting a falsehood about the methodology, even if the data points themselves are real. A robust theory captures this as a lie because the assertion of representativeness is believed to be false by the researcher. This fits the subjective falsity condition. It also fits the intent to deceive condition, as the goal is to mislead the peer reviewers. The only shield here would be convention, but science has no convention permitting cherry-picking, unlike poker. So the theory should classify this as a lie, and a morally culpable one, because it violates the specific trust norms of the scientific community.

  In sum, you are looking for a theory that defines lying as asserting what one believes to be false with the intent to deceive, within a context where truth is the normative expectation, while keeping the moral judgment separate from the definition. This combination satisfies the granddaughter case, the sincere falsehood case, the poker case, and the scientific misconduct case. It stumbles slightly on the misleading truth, requiring us to admit that some things are as bad as lies without being lies, or to expand the definition of assertion to include implications. Augustine survives the definition phase better than expected but collapses under the weight of moral absolutism. The real argument lives in that tension between the definition of the act and the evaluation of its worth. You will find that most modern ethicists agree that lying is prima facie wrong but defeasible, which allows you to keep your scientific intuition about weighing harms without abandoning the seriousness of the truth. I hope this specification helps you structure your mornings of study, and I suspect you will find that the older writers offer more nuance than Augustine's soundbite suggests once you dig into how they handled these very conflicts.

  Sincerely,

  A Fellow Traveler
