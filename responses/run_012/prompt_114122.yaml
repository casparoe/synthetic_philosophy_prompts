  Your friend's position is a classic articulation of the Szaszian perspective, which fundamentally distinguishes between diseases of the brain and problems in living. To understand her likely verdict on the new case, we must first isolate the principles underlying her previous judgments. In every instance where she affirms the existence of a disease, such as general paresis, stroke-induced personality change, or tumour-related hallucinations, there is a concomitant presence of visible structural pathology or a historically confirmed physical lesion. Conversely, in every instance where she denies the disease label, such as grief, jealousy, oppositional behavior, or chronic low mood, there is an explicit absence of bodily abnormality. Two distinct rules can explain this pattern equally well. The first is the Structural Visibility Rule, which holds that a condition counts as a disease only if current medical imaging or pathology reveals tangible structural damage to the brain tissue. The second is the Physical Etiology Rule, which holds that a condition counts as a disease if there is a known physiological mechanism, such as an infection or autoimmune response, regardless of whether that mechanism produces visible structural changes on a scan. Both rules fit her earlier verdicts perfectly because her positive cases had both visible damage and physical causes, while her negative cases had neither.

  When applying these rules to the new case of the adult with post-strep tics and compulsions, their predictions diverge. The Structural Visibility Rule would lead her to conclude that this is not a disease because the structural scans are normal, and consequently, she would view the coercive treatment as illegitimate, mirroring her stance on the oppositional teenager. The Physical Etiology Rule, however, might lead her to classify this as a disease because an autoimmune mechanism is proposed, potentially making medical treatment appropriate, although the issue of coercion would remain complex given the patient's refusal. Despite this divergence, I believe she is really running the Structural Visibility Rule. This is because Thomas Szasz's core philosophical commitment was not merely to physical causation but to the presence of lesions; he argued that without a lesion, psychiatry was merely metaphorically using medical language to control behavior. Her specific emphasis on the teenager's lack of consent suggests she views the disease label as a tool for social control that is only permissible when physical brain damage is undeniable. Since the new case lacks visible damage and the mechanism is only proposed rather than settled fact like syphilis, she will almost certainly deny that it is a disease and condemn the coercive treatment as a violation of autonomy justified by a metaphorical illness.

  To definitively distinguish between the Structural Visibility Rule and the Physical Etiology Rule in her mind, you would need to present a case where the two criteria are split in the opposite direction. The best test case would be an adult with a confirmed genetic mutation known to cause neurological dysfunction, such as early-stage Huntington's disease, where the physiological cause is undeniable and physical, but standard structural brain scans remain completely normal. If she classifies this as a genuine disease despite the normal scans, she is following the Physical Etiology Rule. If she hesitates to call it a disease or insists it is not a brain disease until atrophy appears, she is adhering to the Structural Visibility Rule. This case would force her to choose between the presence of a physical cause and the visibility of damage, revealing which criterion is the true gatekeeper for her concept of illness.
