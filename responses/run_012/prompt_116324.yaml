  1. Order of ideas

  Begin by defining the core problem: political inequality disguised as meritocratic selection. Do not start with the mechanism; start with the failure of the default system. If you start with the lottery, the statistics students will treat it as a sampling problem and the law students as a legitimacy crisis. You must first establish that elections systematically filter for wealth, status, and charisma. Once the group accepts that elections solve accountability but fail equality, introduce the lottery as the corrective for equality. This order is crucial. If you reverse it, the mechanism looks arbitrary because the problem it solves has not been named. The session must settle on equality of opportunity to rule as the target problem before the mechanism stops looking like chaos. Only after the mechanism is established should you introduce the cost: the loss of coordinated accountability. If your target problem were instead competence, the order would invert: start with the complexity of governance, introduce lot as a risk, and discuss mitigation. But for democratic theory, equality must precede mechanism. Conclude by mapping where influence migrates: from voters to agenda-setters. This sequence ensures the law students see the trade-off rather than a deficit, and the statistics students see political selection rather than statistical sampling. You must prevent them from evaluating the tool before they agree on the job it is meant to do. Specifically, you need to anchor the statistics intuition that random means representative, showing that political power is not a mean to be approximated but a lever to be pulled. The law students need to see that legitimacy is not solely derived from consent but also from composition. By solving the problem definition first, you ensure the mechanism is judged on its intended purpose, not its side effects.

  2. The carrying example

  Verdict: Use your candidate as the central engine, not the payoff. It is superior to the citizens' assembly because it isolates the variable of power aggregation. A citizens' assembly conflates who represents with what they decide; your example separates the vote (aggregation) from the decider (execution). This forces the statistics students to confront that a random decider is not a representative sample of opinion, and forces the law students to confront that accountability is severed even if voting occurs. The example must have a binary policy choice with clear winners and losers, and it must lack any deliberative phase. Deliberation introduces expertise and persuasion, which muddies the pure logic of chance. Do not use the jury or Athens. The jury is about impartial judgment on past facts, not political will for future rules; using it reinforces the impartiality misconception you want to break. Athens is historically contingent and brings baggage about slavery and scale that distracts from the theoretical mechanism. Your example works because it is sterile. It strips away the comfort of deliberation and forces the group to stare at the raw transfer of power from the many to the one via chance. It is strange, but that strangeness is pedagogical fuel. It prevents them from resting on historical precedents and requires them to build the theory from scratch on the whiteboard. It specifically targets the conflation of representativeness and aggregation that you identified as the primary risk. Furthermore, it appeals to the computer science mindset of isolating variables in a system. It allows you to model the input (votes) and the function (random selection) separately. This makes the migration of influence visible: if the decider is random, the only remaining leverage is the set of options provided.

  3. Misconception map

  The following map anticipates the specific disciplinary intuitions that will derail the session. Each row identifies a trap, the timing of its arrival, and the specific whiteboard move required to neutralize it. Executing these moves requires discipline; do not allow the group to linger on the misconception once the move has been made.

  | Misconception | Moment | Move |
  | :--- | :--- | :--- |
  | **Random sample equals representative opinion.** | When introducing the mechanism. | Draw a distribution of preferences on the board; show that one random voter matches the mean only by luck, not design, forcing a distinction between descriptive and decisional power. You must explicitly state that political power is not an average to be estimated but a choice to be made. |
  | **Selection by lot is appointing experts.** | When discussing competence objections. | Define the role as making value judgments, not technical calculations; lot selects for presence, not skill, so the question shifts from competence to legitimacy. Ask the group whether they want a ruler who knows the answer or one who shares their stakes. |
  | **The jury analogy proves impartiality.** | When students reach for historical examples. | Contrast judicial neutrality, which requires no stake, with political agency, which requires a stake; lot in democracy is about sharing power, not avoiding bias. Remind them that a juror decides on facts, while a legislator decides on values. |
  | **Without elections there is no accountability.** | When evaluating legitimacy. | Shift the definition from punishing bad actors to preventing entrenched factions; accountability migrates to agenda control, so ask who writes the ballot options. Force the law students to articulate what they are holding the ruler accountable for if the ruler is random. |
  | **Lottery means chaos.** | Throughout the session. | Demonstrate that the rule is fixed even if the outcome is random; the procedure is stable, only the agent varies, so predictability lies in the process not the person. Write the rule on the board and circle it to show it is constant. |
  | **Influence disappears without campaigns.** | During the migration of influence discussion. | Trace power back to who writes the options on the ballot; influence moves from campaigning to agenda-setting, so the lobby shifts target rather than vanishing. Draw a flowchart showing money moving from candidates to proposal drafters. |

  4. Check for understanding

  Question: "Identify the specific political problem that selection by lot solves, and name the new vulnerability it creates." A good answer will state that lot solves elite capture or political inequality by equalizing the chance to rule, while acknowledging it creates a vulnerability in coordinated accountability or long-term planning. A poor answer will focus on the randomness itself, claiming the solution is fairness or impartiality, and will fail to identify the migration of power to agenda-setters. This distinction confirms they understand the trade-off rather than viewing the lottery as a magic bullet for legitimacy. It tests whether they have moved beyond the jury analogy to a functional understanding of power distribution. If they cannot name the vulnerability, they have not grasped the cost of the mechanism.

  5. Left out on purpose

  Exclude the mathematical probability of specific outcomes and the detailed history of Venetian or Florentine systems. These details invite the statistics students to calculate odds and the history buffs to debate context, both of which distract from the theoretical logic of power. Use this sentence to decline: "We are analyzing the structural logic of the mechanism, not its historical implementation or statistical variance." This keeps the focus on the migration of influence and the definition of the problem. It prevents the session from becoming a math seminar or a history lecture. It ensures the law students do not get bogged down in procedural precedents. The goal is theoretical clarity, not empirical verification. We must avoid the trap of proving whether it works in practice, and instead focus on what it does in theory.
