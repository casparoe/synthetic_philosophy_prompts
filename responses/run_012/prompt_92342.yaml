  Anyway here's what I actually want a real answer on. The prof says the interesting question is whether the simmballs actually push the simms around, whether the symbol level does any causal work, or whether it's really just simms pushing simms and the whole symbol story is a convenient redescription we slap on top. I keep flip-floping.

