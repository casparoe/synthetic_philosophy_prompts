  And decompose it. I want the sub-questions the number hangs on, a rough probability for each, one line of justification each, and how they combine into the final number:

  - does the micro level being causally closed actually rule out higher-level causal powers, or is that a mistake?
  - are the higher-level patterns real in the sense that there's a fact of the matter about which clusterings are the right ones, versus us just choosing a convenient grid?
  - does "you can't predict or explain it without the simmball level" really buy you causal efficacy, or is that a fallacy?
  - is the whole levels-of-causation framing even a genuine question, or is it just a verbal dispute about the word "cause"?
  - and whatever other terms you think belong in there.

