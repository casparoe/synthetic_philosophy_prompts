          5.  Colonial Tutelage (some colonial rule justified as temporary preparation for self-gov).
          6.  Non-Intervention (generally no intervention in other countries' internal affairs).
      *   **Concrete Verdict to Test:**
          *   Verdict A: Wrong to shut down a native-language newspaper advocating self-rule (even if stirring discontent).
          *   Verdict B: Right to require publishing a government reply alongside editorials.
      *   **Constraints:**
