  I'm a second-year student and I'm taking a module on classical Chinese philosophy — we've just done the week on the White Horse dialogue and the School of Names, and the line 'a white horse is not a horse' has basically become a running joke in my seminar. The annoying bit is that a guy in my group used it last week to argue that all our categories are arbitrary — horse, white horse, doesn't matter, just words we made up — and the tutor didn't really push back, she just said something about the disputers being interested in names and moved on. I'm fairly sure it doesn't support that, but honestly I coudln't say what it does claim either, and I'd like to go back at him next week.

  Could you lay out the different precise things that one sentence could be claiming — as a menu, rather than picking one and explaining it? Like: is it about the words themselves, or about the sets of things the words pick out, or about a particular white horse being a horse and yet also something more than a horse, or about what happens when you ask for a horse and any old horse will do versus asking for a white one (there's an argument along those lines in the text, isn't there)? For each reading say whether it's trivially true, genuinely interesting, or just false, and then say which reading my classmate has to be relying on to get his 'categories are arbitrary' conclusion, and whether any of them actually gets him there. Don't bother with who wrote what or when — I just want the options laid out clearly enough that I can use them in class.

  British English please, and if you can also tell me which reading my tutor probably meant, even better.
