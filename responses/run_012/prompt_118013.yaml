          *   DCD (Donation after Circulatory Death): Life support withdrawn. Heart stops. Wait period (usually 5 minutes). Declaration of death. Organs taken. *Crucial Correction:* The heart is *not* restarted after declaration in standard protocols. If auto-resuscitation happens (Lazarus phenomenon), the declaration is voided. The user's friend is likely mistaken or referring to a very specific, controversial, or misunderstood case (like normothermic regional perfusion, which restores circulation *regionally* but not to the brain, but even then, the patient is already dead). I need to clarify that restarting the heart *after* declaring death for donation would invalidate the death declaration.
