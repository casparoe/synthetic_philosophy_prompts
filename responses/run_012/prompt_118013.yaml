answer: |-
  It is completely understandable why you feel this way because you have stumbled onto one of the most difficult and philosophically charged areas of modern medicine. You are right to sense that the definition of death is not as static or purely biological as we often pretend it is, and your intuition that technology plays a huge role in where we draw the line is correct. However, there are some important distinctions to make between the ideas you have encountered and the medical reality, because while death does involve policy decisions, it is not merely a legal fiction created for organ harvesting.

  The core of your argument rests on the idea that irreversibility is just a measure of current technology, and in a sense, you are right. If we had technology to reanimate a body weeks after decay, our definition of death would have to change. But medicine does not define death based on whether every single cell has died, because even after we are clearly dead, our skin cells, hair, and nails can continue to grow or function for a short time. Instead, the medical definition focuses on the loss of integrated functioning of the organism as a whole. This is the key distinction between cellular life and organismal life. A brain-dead body can indeed be kept mechanically ventilated for a period of time, and there are rare cases of pregnant women being maintained until delivery or children experiencing somatic growth, but this requires immense artificial support to mimic the functions the brainstem used to perform automatically. Without that support, the body rapidly disintegrates because the central coordinator is gone. The body is not functioning as a unified whole anymore; it is a collection of living tissues being kept alive by machines, which is why most legal and medical systems accept the permanent loss of brain function as death.

  Regarding the claim your friend made about restarting the heart after declaring death, this is likely a misunderstanding of specific organ donation protocols known as donation after circulatory death. In these cases, life support is withdrawn, and the medical team waits for the heart to stop. They then wait a further period, usually about five minutes, to ensure that the heart does not start beating again on its own, a phenomenon known as auto-resuscitation. If the heart were to restart during that window, the declaration of death would be voided and care would continue. They do not declare the patient dead and then resuscitate them for the sake of saving their life. There are newer techniques like normothermic regional perfusion where circulation is restored to the organs for preservation after death has been declared, but this is done by clamping off blood flow to the brain so consciousness cannot be restored. This allows organs to be viable without reversing the death of the person, but it is easy to see how hearing about circulation being restored after death could be interpreted as bringing the patient back to life when it is actually just preserving tissue for transplant.

  You are also touching on a deep philosophical truth when you suggest death is partly a value judgment. Because we can keep bodies breathing and hearts beating indefinitely with machines, we have to decide at what point a human being is no longer present. This is why the definition of death has shifted over time. Before ventilators, death was always circulatory because when the heart stopped, the brain died minutes later. Once we could separate the two, we had to choose which one mattered more. We chose the brain because it is the seat of consciousness and the controller of the body's integration. This does make the definition somewhat dependent on social consensus, but it is not arbitrary. It is grounded in the biological reality that without the brainstem, the body cannot breathe, regulate temperature, or maintain homeostasis without external intervention. So while there is a policy element, it is tethered to the biological fact that the organism can no longer function independently.

  The reason circulatory death still feels more real or natural to many people, including yourself, is largely historical and sensory. For all of human history until the last sixty years, death was the moment the breath and heartbeat stopped. It is visible and tangible. Brain death is counterintuitive because the patient looks alive. They are warm, their chest rises, and their skin is pink. This creates a cognitive dissonance where our eyes tell us the person is there, but the medical tests say the person is gone. This visual discrepancy fuels the suspicion that brain death is a construct, but the construct exists to address the reality that the body is being artificially animated without the driver that makes it a person. Circulatory death feels more honest because it aligns with our ancestral understanding of life, but brain death is medically equivalent because the loss of the brainstem ensures that the circulatory stoppage is imminent and inevitable without machines.

  Ultimately, you are correct that the line is a moving target influenced by technology and social values, but it is not a fiction invented solely for organs. The Harvard Committee that defined brain death in 1968 did discuss the burden of intensive care and organ transplantation, but their primary motivation was to resolve the ethical dilemma of patients who had permanently lost all brain function yet were being kept physically animate by ventilators. We declare death at this point not just to take organs, but because there is no possibility of recovery and the body is no longer functioning as a human organism. It is a hybrid concept that blends biological facts about integrated function with societal values about what constitutes the end of a person, and acknowledging that mix is far more honest than pretending death is a single biological switch that we simply discover rather than define.
