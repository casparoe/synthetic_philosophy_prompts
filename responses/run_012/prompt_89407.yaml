answer: |-
  ### Core Commitments

  **Copenhagen (Bohr-Operationalist):** I adopt a standard operationalist reading wherein the wavefunction represents knowledge of a system, not the system itself. A 'cut' between quantum system and classical apparatus is fundamental. Measurement is a primitive notion triggering non-unitary collapse, yielding exactly one actual outcome.

  **de Broglie–Bohm (Pilot-Wave):** Particles possess definite positions and trajectories at all times, guided by a universal wavefunction obeying the Schrödinger equation. The theory is deterministic and strictly unitary regarding the wave; 'measurement' is merely a specific interaction revealing pre-existing properties. There is exactly one actual outcome determined by the particle's position.

  **Everettian (Many-Worlds):** The universal wavefunction is the sole ontology, evolving strictly unitarily without collapse. 'Measurement' is entanglement-induced branching. All outcomes encoded in the superposition are equally actual relative to their branches; there is no unique single outcome.

  ***

  ### The Experimental Scenario

  Consider a Mach–Zehnder interferometer fed by a single-photon source. After the first beam splitter, the upper path passes through a horizontal polariser and the lower through a vertical polariser, encoding which-path information into orthogonal polarisation states. Before recombination at the second beam splitter, the photon encounters a switchable diagonal polariser (the eraser); in the 'Retention' setting, this is removed (paths distinguishable, no interference), and in the 'Erasure' setting, it is inserted (paths indistinguishable, interference restored). Finally, two photodiodes at the output ports register the photon's arrival, triggering an irreversible macroscopic voltage spike.

  ***

  ### Analysis of the Two Patterns

  #### Pattern 1: Uniqueness of Outcome
  *Question: Does the experiment issue in exactly one actual outcome?*

  *   **Copenhagen:** **Yes.** The voltage spike at one photodiode constitutes a measurement, collapsing the state to a single localisation.
      *   *Premise:* The measurement postulate dictates a single actualisation of potentiality.
  *   **Bohm:** **Yes.** The photon is a particle; it travels either the upper or lower path and triggers exactly one diode.
      *   *Premise:* Particles have definite trajectories; the 'empty' wave triggers nothing.
  *   **Everett:** **No.** The universal state evolves into a superposition of 'Diode 1 fires' and 'Diode 2 fires'. Both branches exist.
      *   *Premise:* Unitary evolution preserves all terms in the superposition; branching is real.

  **Verdict:** Copenhagen and Bohm agree (One); Everett dissents (Many).

  #### Pattern 2: Necessity of Measurement Postulate
  *Question: Can the whole experiment be described without invoking a measurement postulate or observer?*

  *   **Copenhagen:** **No.** To account for the transition from superposition to a definite voltage spike (and to explain why the 'Retention' setting destroys interference while 'Erasure' restores it), one must invoke a cut where the quantum potential becomes classical fact.
      *   *Premise:* Without collapse, the formalism yields probabilities, not facts; the 'cut' is axiomatic.
  *   **Bohm:** **Yes.** The photon and polarisers are treated as quantum systems interacting unitarily; the particle's position selects the outcome without altering the wave dynamics.
      *   *Premise:* The Schrödinger equation applies universally; 'measurement' is derived, not fundamental.
  *   **Everett:** **Yes.** The photon, polarisers, and diodes are all quantum systems entangling unitarily.
      *   *Premise:* The Schrödinger equation applies universally; no collapse occurs.

  **Verdict:** Everett and Bohm agree (No Postulate); Copenhagen dissents (Postulate Required).

  ***

  ### The Feature Doing the Work

  The feature driving these divergences is the **ontological status of the which-path marker**. In the 'Retention' setting, the polarisation marks the path. For Copenhagen, this *could* constitute a measurement if read, requiring a collapse axiom to explain the loss of interference. For Bohm and Everett, it is merely entanglement. In the 'Erasure' setting, Copenhagen must assert that *no* measurement occurred at the marker to allow interference to return, yet still requires a postulate at the final diode. Bohm and Everett maintain a single, consistent description (unitary interaction) across both settings. The variable (Retention vs. Erasure) forces Copenhagen to toggle its application of the postulate (Measurement vs. No Measurement at the marker), whereas Bohm and Everett remain invariant, highlighting their rejection of the postulate as fundamental.

  ### Counterfactuals and Resistance

  **If the record is made permanent (Retention only):**
  If we remove the eraser and measure the polarisation permanently before the second beam splitter, Pattern 1 remains unchanged (C&B: One, E: Many). Pattern 2 also holds, but becomes less sharp: Copenhagen invokes collapse at the polarisation detector; Bohm and Everett invoke entanglement. The *erasure* capability is crucial for Pattern 2 because it demonstrates that Copenhagen treats the physical interaction as a 'measurement' only contingently (based on information availability), whereas Bohm and Everett treat it physically (based on Hamiltonian dynamics). Without the option of erasure, Copenhagen's reliance on the postulate looks like a default rather than a contingent commitment to information.

  **Bohmian Resistance:**
  A committed Bohmian might resist the agreement with Everett on Pattern 2 by arguing that 'effective collapse' (the decoupling of the empty wave) functions *as if* a postulate were present for all practical purposes. They might claim that describing the experiment *without* reference to the particle's definite trajectory is incomplete, whereas Everett claims the wavefunction alone is complete. However, regarding the *axiomatic* question ("invoking any measurement postulate"), the Bohmian must maintain agreement with Everett: the Schrödinger equation is never violated. To resist, they would have to concede that the 'cut' is pragmatic, but they cannot concede it is fundamental without ceasing to be Bohmian. They retain agreement with Everett on the *dynamics* (no postulate) while dissenting on the *ontology* (particles exist), which is precisely why this experiment successfully separates the three views in a cross-cut fashion.
