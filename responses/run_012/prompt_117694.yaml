          *   *Nietzsche's Text:* Nietzsche distinguishes between *bad conscience* (the instinct for freedom turned inward, the structural condition) and *guilt* (the moralization of bad conscience via the creditor/debtor relationship and the concept of God). Bad conscience is the *material*; guilt is the *interpretation* placed upon it by religion.
          *   *Why it matters:* If they are the same, then bad conscience is inherently moral/religious. If they are distinct, bad conscience is a pre-moral psychological state that *got* moralized. This distinction is crucial for the possibility of overcoming guilt without eliminating bad conscience (sublimation).
