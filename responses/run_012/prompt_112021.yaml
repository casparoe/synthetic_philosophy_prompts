      *   **The User's Hypothesis:** The stalemate is due to two different measures of severity: (1) Depth of interference (time/life taken) vs. (2) Claim to authority (right to reshape character). Norway scores lower on (1) but potentially higher on (2).
      *   **The User's Counter-Case:** Two regimes with identical conditions/lengths, but one ignores character and the other tries to change it. Which is more punitive?
      *   **Requirements:**
          *   Diagnose the disagreement using the provided positions.
