answer: |-
  **Refined Exam Question**

  A foundation inherits three paintings catalogued under a dead master. For each, decide if attachment to the original does aesthetic work.

  1.  **Signature Case:** Painted by the artist; signature/provenance added later by a dealer. Surface is genuine.
  2.  **Studio Case:** Painted by an apprentice under supervision, signed by the artist. Later downgraded to 'school-of'. Apprentice later became famous.
  3.  **Labeled Forgery Case:** Deliberate forgery, caught, labeled as such in a museum. Critics agree it is aesthetically superior to the artist's real work.

  **Task:** Using these cases, argue whether the 'achievement' and 'corruption-of-understanding' arguments are one argument or two, and whether either survives the Labeled Forgery Case. State what a defensible account of original value must concede.

  **Follow-up:** Would your answer change if the only surviving evidence of the original were a perfect copy?

  ***

  **1. Model Answer**

  The achievement argument (forgery misrepresents artistic skill) and the corruption argument (forgery distorts art history) are distinct, though they often overlap. The three cases reveal that neither survives the Labeled Forgery Case unmodified, forcing a concession that aesthetic value relies on historical narrative, not just perceptual qualities.

  In the Signature Case, the achievement is genuine—the artist painted it—but the history is fake. If we reject this work based on the fake signature, we cannot be using the achievement argument, since the artist's physical achievement is intact. This suggests the corruption argument is doing the work: the paperwork distorts our understanding of the artist's output. However, since the surface is unchanged, the aesthetic experience remains identical. This case separates the two arguments: achievement concerns the object's genesis; corruption concerns the viewer's epistemic context.

  The Studio Case complicates achievement. The master supervised and signed, but the apprentice executed the work. If the apprentice later became famous, their achievement is distinct from the master's. Downgrading the attribution corrects the historical record (corruption), but it also shifts credit for the physical achievement. Here, the arguments converge: correcting the attribution fixes both the historical record and the allocation of artistic credit.

  The Labeled Forgery Case is the stress test. The label neutralizes the corruption argument; viewers know it is a fake, so their understanding of the tradition is not distorted. Furthermore, if the forgery is aesthetically superior, the achievement argument fails too; the forger demonstrated *more* skill than the master. If we still value the original over this labeled forgery, it cannot be because of superior skill or fear of historical confusion.

  Therefore, the arguments are two, but both fail to explain why we prefer the original in Case 3. A defensible account must concede that the value of an original is not intrinsic to the object's perceptual properties nor solely dependent on the artist's skill. Instead, value resides in the correct historical connection between the object and its genesis. We value the original because it is the specific artifact that stood in the right causal relation to the artist's creative act, regardless of whether a perceptually identical or superior copy exists.

  This leads to the follow-up. If the only surviving evidence of the original were a perfect copy, the historical narrative shifts. The copy becomes the primary historical anchor. Since we value the historical connection, and the original is inaccessible, the copy assumes the role of the "original" for aesthetic purposes. My answer does not change regarding the *theory* (historical connection matters), but the *object* fulfilling that role changes. We value the copy not because it is perceptually superior, but because it is now the only available link to the historical event of the work's creation. Thus, the value remains historical, not perceptual.

  ***

  **2. Marking Scheme (25 Marks)**

  **1. Distinguish the arguments using Case 1 or 2 (5 marks)**
  *   **Move:** Must use the Signature or Studio case to show that achievement (skill/genesis) and corruption (history/knowledge) can come apart.
  *   **Common Error:** Candidates define the arguments abstractly without using the specific cases to demonstrate the distinction.

  **2. Commit to a verdict on unity (One vs. Two) (5 marks)**
  *   **Move:** Must explicitly state whether the arguments are fundamentally the same or distinct, supported by the case analysis.
  *   **Common Error:** Hedging or claiming they are "both right" without analyzing whether they reduce to a single underlying principle.

  **3. Analyze Case 3's impact on both arguments (5 marks)**
  *   **Move:** Must explain why the label neutralizes corruption and why superior skill challenges the achievement argument.
  *   **Common Error:** Ignoring the "label" element or assuming the forgery is automatically aesthetically inferior despite the prompt.

  **4. Articulate the necessary concession (5 marks)**
  *   **Move:** Must identify that value lies in historical/causal connection rather than perceptual quality or skill alone.
  *   **Common Error:** Retreating to vague platitudes about "authenticity" without explaining what mechanistic work that concept does.

  **5. Resolve the Follow-up consistently (5 marks)**
  *   **Move:** Must apply the historical connection theory to the perfect copy scenario without contradicting the main thesis.
  *   **Common Error:** Changing the theory entirely for the follow-up (e.g., suddenly arguing perceptual value is all that matters).

  ***

  **3. A/B Boundary**

  An A answer integrates the three cases into a single evolving argument to prove a thesis, whereas a B answer treats the cases as a checklist to be addressed separately without synthesizing them.
