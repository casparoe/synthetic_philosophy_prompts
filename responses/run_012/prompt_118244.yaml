  I rested in the colored air.
  The shape around me loosened up.
  I lost the name I brought with me.
  A sound became a kind of light.
  The distance opened, then withdrew.
  I drank the wind and it was enough.
  Something faded from the sight.
  I waited for the change to cease.

  I rose in the colored air.
  The shape around me tightened up.
  I found the name I left behind.
  A light became a kind of sound.
  The distance withdrew, then opened.
  I drank the light and it was wind.
  Something returned to the sight.
  I am the change that will not cease.

  ***

  **Note on the pivot:** Line 16 ("I am the change that will not cease") is the pivot. Read as the man, it accepts that the dream-state has altered him permanently; read as the butterfly, it asserts that transformation is its native condition. It refuses to resolve which state is "real" (Descartes) and instead affirms the continuity of the transformation itself (Zhuangzi), allowing both voices to occupy the same truth without contradiction.
