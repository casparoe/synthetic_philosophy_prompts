prompt: |-
  I'm a junior in high school and I somehow ended up running our philosophy club, and next week I have to teach a 45-minute session on causation by omission to a bunch of sophmores who've only ever heard of the trolley problem. I don't want you to explain the topic to me — I want you to plan how I should teach it. Here's the thing that's making me want to build the whole session around it: my friend Maya gave me this case where two kids are drowning in two identical pools, and there are two lifeguards. Lifeguard A is asleep and never sees the kid. Lifeguard B is awake, sees the kid, and just decides not to move. Both kids drown. Maya says only B caused the death, because A's not-doing is just background, not a cause. My other friend Dev says both caused it, and the only difference is moral blame. I want the class to leave feeling why that disagreement is hard, not just that it's a disagreement. Also Maya said something I can't stop thinking about: an omission only counts as a cause when it breaks some norm that applies to you in that situation, like a lifeguard's duty to watch. Is that a real move? I want it to be the climax of the lesson if it works.

  So plan the explanation for me. What has to come first, second, third so that the two-lifeguard case lands as a genuine puzzle instead of a trick? What example should carry the whole thing — should it be my two-lifeguard case, or is there a better one that has the right features, and what exactly does it need to have and not have? Which misconceptions will they form — I'm guessing "an omission is nothing, so it can't be a cause", "if omissions are causes then I caused everything I didn't prevent", "causal responsibility just is moral responsibility", "the difference is only action vs inaction", maybe "counterfactual dependence is enough" — and at what point in the sequence should I head each one off? What's one question I can ask at the end to see if they actually got it rather than just nodding? And what should I openly say I'm not going to cover at this level, so I don't get dragged into the deep end? Don't give me readings or citations, just the plan.
