answer: |-
  Here is a 45-minute lesson plan designed to make the metaphysics of omission feel like a live wire, not a textbook definition.

  ### 1. The Sequence (The Arc)

  Do not start with the Lifeguards. If you start there, students will get stuck on the specific details of employment contracts or sleep cycles. You need to build the tension first.

  **Part 1: The Intuition Pump (5 Minutes)**
  *   **Goal:** Get them to admit omissions *can* be causes.
  *   **Action:** Put a picture of a dead houseplant on the board.
  *   **Ask:** "I went on vacation for two weeks and didn't water this plant. It died. Did my *not watering it* cause the death?"
  *   **Expected Consensus:** Yes.
  *   **Teaching Point:** Establish that "nothing" (an absence of water) can produce "something" (death). This kills the "nothing can't cause something" misconception immediately.

  **Part 2: The Explosion Problem (10 Minutes)**
  *   **Goal:** Show why accepting Part 1 is dangerous.
  *   **Action:** Ask: "If my not-watering killed the plant, did *you* kill the plant? You didn't water it either."
  *   **Discussion:** They will say no. Ask why. They will say, "It wasn't your job," or "You weren't responsible."
  *   **Teaching Point:** Highlight the tension. If we say *any* omission is a cause, then everyone in this room caused the plant's death (and every starvation death they didn't prevent). Causation explodes and becomes useless. We need a filter to separate "causes" from "background conditions."

  **Part 3: The Core Puzzle — Two Lifeguards (20 Minutes)**
  *   **Goal:** Apply the filter to your specific case.
  *   **Action:** Present the Two Lifeguards case exactly as you have it.
      *   **Guard A:** Asleep, never sees kid.
      *   **Guard B:** Awake, sees kid, refuses to move.
      *   **Result:** Both kids drown.
  *   **The Setup:** Remind them both satisfy the counterfactual test (If A had woken, kid lives. If B had moved, kid lives).
  *   **The Debate:** Split the room. Left side is Team Maya (Only B caused it). Right side is Team Dev (Both caused it, blame is different).
  *   **Facilitation:** Do not let them talk about "who is worse." Force them to talk about "what made the water go into the lungs."
      *   *Prompt for Team Dev:* "If A's sleeping didn't cause the death, what did? Magic?"
      *   *Prompt for Team Maya:* "If A is a cause, why isn't the random stranger on the beach a cause too?"
  *   **Teaching Point:** This is where they feel the "hardness." Dev's view saves metaphysics (counterfactuals work) but risks the Explosion Problem. Maya's view saves the Explosion Problem but makes causation depend on rules, not physics.

  **Part 4: The Climax — Maya's Norm Condition (5 Minutes)**
  *   **Goal:** Test Maya's specific insight.
  *   **Action:** Reveal Maya's rule: *"An omission only counts as a cause when it breaks some norm that applies to you in that situation."*
  *   **Analysis:** Ask the class to apply this rule to Guard A.
      *   *The Trap:* Guard A *did* break a norm (sleeping on duty). So why does Maya say he's background?
      *   *The Pivot:* Guide them to see that Maya likely means a norm of *conscious agency*. You can't break a norm of "responding" if you aren't aware.
      *   **The Takeaway:** Causation might not be just about physics (forces, motion); it might be about *expectations*. This is the "real move" you wanted. It shifts causation from "what happened" to "what should have happened."

  **Part 5: Wrap & Scope (5 Minutes)**
  *   **Goal:** Exit ticket and boundary setting.

  ---

  ### 2. The Example Strategy

  **Stick with the Two Lifeguards, but refine the setup.**
  The Lifeguard case is superior to the Plant or Stranger examples because it holds the *duty* constant (both are lifeguards) but varies the *capacity/awareness*. This isolates the variable you want: Is causation about the *duty* or the *choice*?

  **What the case needs to have:**
  *   **Identical Outcomes:** Both kids must drown identically.
  *   **Identical Counterfactuals:** It must be true that if *either* guard acted, the kid would live. (This blocks the "A couldn't have saved him in time" objection).
  *   **Clear Norms:** They must be employed lifeguards, not volunteers, to make the "duty" clear.

  **What the case must NOT have:**
  *   **Physical Barriers:** Don't say Guard A was chained up. Sleeping is ambiguous enough; chains make it purely physical impossibility.
  *   **Different Distances:** Keep the pools identical.
  *   **Legal Jargon:** Do not use words like "negligence" or "liability." Use "cause" and "responsibility."

  ---

  ### 3. Misconception Management

  Here is when to head off the specific wrong turns you anticipated:

  *   **"An omission is nothing, so it can't be a cause."**
      *   **When:** Part 1 (The Plant).
      *   **How:** Don't argue metaphysics. Just ask, "If I *had* watered it, would it be alive?" If yes, your absence made the difference. Move on.

  *   **"If omissions are causes, I caused everything I didn't prevent." (The Explosion)**
      *   **When:** Part 2 (The Stranger).
      *   **How:** This is your strongest lever. When Team Dev argues "Both guards caused it," ask: "Does the kid swimming in the next lane over also cause it by not saving them?" If Dev says "No," ask why. If they say "Yes," ask if causation is now meaningless. This makes Maya's view attractive.

  *   **"Causal responsibility just is moral responsibility."**
      *   **When:** Part 3 (The Debate).
      *   **How:** Students will conflate "Who caused it?" with "Who is the bad guy?" Interrupt this. Say: "We can agree B is a worse person. But did A's sleeping fill the lungs with water, or did B's refusal?" Force them to separate the *mechanism* from the *blame*.

  *   **"Counterfactual dependence is enough."**
      *   **When:** Part 3 (The Debate).
      *   **How:** Point out that *both* guards satisfy the "If they acted, kid lives" test. Since the math is the same, but the intuition is different (Maya vs. Dev), the math (counterfactuals) must be missing something. That "something" is the Norm.

  ---

  ### 4. The Final Assessment Question

  Do not ask "What is causation by omission?" Ask a transfer question that forces them to use Maya's Norm Condition.

  **The Question:**
  > "Imagine a world-class heart surgeon is on an airplane. A passenger has a heart attack. The surgeon is off-duty, drinking a beer, and decides not to help because they want to relax. The passenger dies.
  >
  > According to **Dev**, did the surgeon cause the death?
  > According to **Maya**, did the surgeon cause the death?
  > **Why do they disagree?**"

  **What to look for in their answers:**
  *   **Dev:** Should say "Yes," because if the surgeon acted, the passenger would live (Counterfactual).
  *   **Maya:** Should say "No" (or "It depends"), because there is no *norm* requiring an off-duty doctor to act (unlike the lifeguard).
  *   **The Insight:** If they can articulate that Maya's view makes causation depend on *social rules/jobs* while Dev's makes it depend on *physical possibilities*, they got it.

  ---

  ### 5. Scope Limitations (What to Explicitly Exclude)

  To keep this to 45 minutes and avoid the "deep end," open the session by saying:

  *"Today we are looking at whether 'doing nothing' can be a cause. We are **not** going to talk about:"*

  1.  **Legal Liability:** "We aren't deciding who goes to jail. A judge might punish A and B differently, but we are asking if they both *caused* the death."
  2.  **The Metaphysics of 'Events':** "We aren't going to define what an 'event' or a 'fact' is. We're taking those for granted."
  3.  **Preemption/Switches:** "We aren't doing complex Trolley Problem switches where one action stops another. We are looking purely at inaction."

  ### Why This Plan Works for Your Goal
  You want them to feel *why* the disagreement is hard. This plan forces them into a corner:
  1.  If they side with **Dev**, they have to accept they cause every death they don't prevent (Explosion).
  2.  If they side with **Maya**, they have to accept that "cause" isn't a physical thing, but depends on rules/norms (which feels weird for science).

  By the time you hit the Climax with Maya's Norm Condition, they should be desperate for a solution that avoids the Explosion without making causation magical. That is when the insight lands.
