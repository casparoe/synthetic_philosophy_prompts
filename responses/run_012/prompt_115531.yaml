answer: |-
  The glue pot smelled of warm rubber and dust. Klara dipped the brush, tapped it twice against the rim, and touched the adhesive to the back of a small paper man. He was black, featureless, arms raised slightly as if reaching for something just out of frame. She placed him in the row next to ninety-nine others. One hundred men. One hundred cases of influenza.

  She did not draw a giant man to represent a hundred. That was the sin. A giant man was a metaphor. A hundred small men were a fact.

  "Good alignment," Dr. Vogel said from behind her. He didn't startle her; his shoes always squeaked on the linoleum before he spoke. He leaned over the drafting table, his shadow falling across the grid. "But the caption is too heavy. 'Influenza Cases in District Four.' Cut the words."

  "The legend needs it," Klara said. "Otherwise, are they sick? Are they dead? Are they workers?"

  "The shape tells you," Vogel said. He tapped the paper man. "This is the symbol for sickness we agreed on. The context is the wall next to it. Words are shadows, Klara. They lengthen and shorten depending on the light. The picture is the object itself. If you need words to explain the picture, the picture has failed."

  He moved to the next table, where a stack of fresh briefs from the Ministry of Public Health waited. "The travelling exhibition opens in Prague next month. The Ministry wants to show progress. Clean water, vaccination, housing. They want the world to see that we have mastered the chaos."

  Klara picked up the top sheet. The typewriter keys had struck hard, leaving indents on the page. She read the first line aloud, testing the weight of it. "Zero cases of typhus reported in the southern quadrant, month of October."

  Vogel nodded. "Simple. Empty space."

  "Empty space looks like a mistake," Klara said. "It looks like we forgot to print the data."

  "Empty space is truth," Vogel said. "If there are no men, you paste no men. Do not draw a man with a cross through him. Do not draw a man fading away. Nothing is nothing. Do not decorate the void."

  He walked away, his hands clasped behind his back. Klara looked at the white board where the southern quadrant map would go. If she left it blank, it looked like the rest of the wall. It looked like silence. But silence could mean peace, or it could mean censorship. She picked up her scissors. She cut nothing. She pasted nothing. She stared at the white space until it felt heavy enough to crush the paper beneath it.

  The next claim was harder. *Average household size: 2.4 children.*

  Kara took the symbol for a child. It was smaller than the man, head rounder. She placed two down. She held the third over the board. She could not cut off the head; that would imply death. She could not make it smaller; that would imply age or malnutrition. A fraction of a child was a lie. The Method demanded units. You could count people, you could not count averages.

  She looked at Vogel across the room. He was arguing with a printer about ink density. She slipped the third child into her apron pocket. She pasted the two. It was a lie of omission, but it was a clean lie. It looked solid. It looked like fact.

  The afternoon light grew thin and gray. The third brief sat on top of the pile. *Vaccine shipment arrived November 1st. Estimated mortality without intervention: 400. Actual mortality: 0.*

  Klara dipped her brush. She needed to show 400 deaths that did not happen. She arranged four hundred black men in a grid. Then she paused. If she pasted them, it meant they died. If she didn't paste them, it meant nothing happened. She needed a ghost. She needed a symbol for 'almost'.

  She took a sheet of tracing paper and laid it over the grid. She shaded the figures lightly in pencil, then tried to glue the tracing paper over the ink. It bubbled. It looked messy. It looked like a mistake.

  Vogel appeared at her shoulder. "What is this?"

  "The saved lives," Klara said. "The ones who didn't die."

  "You cannot show what did not occur," Vogel said softly. He didn't sound cruel. He sounded like a man explaining why you cannot draw the sound of a bell. "We show the living. The vaccine is a shield. Show the shield. Do not show the arrow that missed."

  "The arrow is the point," Klara said. "The point is that they should be dead."

  "The point is that they are alive," Vogel corrected. "Show the living. The rest is speculation. Speculation is mud. We are building with glass."

  He took the tracing paper from her hand and dropped it into the waste bin. "Show the shields. Green crosses. One for every thousand doses. Clean. Countable."

  Klara watched the paper settle among the trimmings of other failed truths. She picked up the next sheet. *Water samples from Sector 7. Lead content: None detected.*

  She reached for the water drop symbol. Blue. Clean.

  "Wait," Vogel said. He was looking at the footnote on the Ministry sheet, a tiny typescript line at the bottom. "Did they test for lead?"

  Klara squinted. "It says 'None detected'."

  "Read the protocol," Vogel said.

  Klara read. *Tested for bacteria and sediment. Lead assay not conducted due to cost.*

  "So there is lead?"

  "We do not know," Vogel said. "So you cannot say 'None'. 'None' is a number. 'Unknown' is not a number."

  "So what do I draw?"

  "Nothing," Vogel said. "Do not draw the water drop. If you draw the drop, you imply the test was done. If you draw nothing, you imply no data."

  "But the Ministry wants to say the water is safe."

  "The Ministry wants to say many things," Vogel said. "We say only what can be seen. If the test was not done, the water does not exist on this chart. Leave the space blank."

  "It looks the same as the typhus," Klara said. "The typhus was zero. The water is untested. Both are blank."

  "Both are absent," Vogel said. "That is the beauty. The wall does not care about your nuance. The wall only holds what is there."

  He left her to the glue pot. Klara worked until her fingers were stiff with dried adhesive. She cleared the board. The charts were beautiful. They were stark rows of identical figures, marching in perfect rhythm. There were no fractions. There were no ghosts. There were no words to clutter the eye. A worker walking past could see the rows grow or shrink without reading a sentence. It was a language without syntax, without tense, without conditionality.

  It was also full of holes.

  When the studio emptied, Klara locked the door. She sat at her desk and opened the bottom drawer. Inside was a notebook with a plain gray cover. She opened it to a fresh page. She took a pen, not the brush she used for the charts, but a sharp nib that scratched against the paper.

  *October 30th,* she wrote. *Southern Quadrant: Zero typhus. But the clinic was closed. No one reported. The zero is silence, not health.*

  She paused, listening to the hum of the radiator.

  *Household size: 2.4. I drew two. The 0.4 is the children who died before winter. Or the ones hidden. You cannot cut a child in half, so you hide the fraction.*

  She turned the page.

  *Vaccine: 400 lives saved. I drew green crosses. The crosses do not bleed. The dead men are not on the wall. The chart says we are safe. It does not say we were lucky.*

  She wrote faster now, the ink pooling in the loops of her letters.

  *Water: No lead found. They did not look. The blank space means 'clean' to the viewer. It means 'blind' to me. Two different blanks. The same white paper.*

  She wrote until her hand cramped. She wrote about the margin of error, a concept the Institute refused to acknowledge. *The bar grows taller,* she wrote, *but the top is fuzzy. The fuzz is the doubt. We cut the fuzz off. We make the bar sharp. A sharp lie is better than a blurry truth.*

  She closed the notebook. It was thick now, heavier than the portfolio of charts she would carry to Prague. The charts were for the public. They were for the light. The notebook was for the dark.

  The exhibition opened on a Tuesday. The hall was high-ceilinged and echoic. People wandered through the aisles, coats buttoned against the draft. Klara stood near the back, watching a group of schoolchildren led by a teacher.

  They stopped at the influenza chart. The rows of black men marched across the wall. The children counted them aloud, tapping the air. They saw the drop in cases. They saw the green crosses of the vaccine. They saw the blank space where the water data should be and assumed it was clean, because why else leave it blank?

  They moved on, eyes wide, absorbing the clarity. They felt informed. They felt safe.

  Klara touched her pocket. The notebook pressed against her thigh, a hard rectangle of weight. Vogel stood near the entrance, speaking with a Ministry official. They both looked at the walls with satisfaction. The vision was complete. The world had been translated into symbols, and the symbols were clean.

  Klara watched a man stop in front of the housing panel. He frowned at the blank space where the zero typhus cases were. He looked around, confused, then shrugged and walked away. He thought it was a mistake. He thought the data was missing.

  Klara knew he was right. She kept her hand in her pocket, fingers tracing the edge of the paper, holding the words that held the world together while the pictures let it fall through.
