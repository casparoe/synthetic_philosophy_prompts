      *   **Expected Utility (EU):** Value = $\sum p_i \cdot u_i$. If outcomes are equally likely, $p_i$ is constant. Weight is uniform.
      *   **Risk-Weighted Expected Utility (REU):** Value = $\sum w(p_i) \cdot u_i$ (roughly, though Buchak's formalism is slightly more complex involving cumulative probabilities, the user's description focuses on the *weighting function* applied to outcomes/states). The user describes it as: "a risk attitude is a single function that re-weights the outcomes... someone averse to risk gives added weight to what happens in the worse states."
      *   **Visual Metaphor:** Stanza length = weight assigned.
      *   **Risk Aversion:** Worse outcomes get *more* weight than their probability suggests. So, the worst outcome stanza should be longest, best outcome stanza shortest.
      *   **Risk Neutrality (EU):** All outcomes get weight proportional to probability only. Since probabilities are equal, stanza lengths should be equal.
      *   **The Coda:** Needs to suggest that if we equalized the stanzas, we get EU.

