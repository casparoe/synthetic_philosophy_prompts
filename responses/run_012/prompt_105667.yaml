answer: |-
  **Plan**

  *   **The Gamble:** A simple investment venture with four equally probable outcomes (Ruin, Loss, Profit, Windfall), each occurring with a one-in-four chance.
  *   **The Shrinkage:** The poem comprises four stanzas corresponding to the four outcomes, decreasing strictly by one line per stanza (4 lines, 3 lines, 2 lines, 1 line) to visualize the risk-averse weighting function.
  *   **The Coda:** A final couplet that explicitly proposes leveling the stanza lengths, thereby demonstrating how equal weighting restores the orthodox expected-utility calculation.

  ***

  ### The Weighted Measure

  The ruin waits, one chance in four to fall,
  Yet here I dwell upon the gloom at length;
  I give this worst case weight above it all,
  As though its shadow held the greater strength.

  The loss is slight, yet still I stretch the verse,
  More than the odds would strictly recommend;
  I fear the downside more than I endorse.

  The profit comes, I pass it quickly by,
  For safety weighs much heavier than gain.

  The windfall shines a moment, then is gone.

  But lay each stanza level, line for line,
  And orthodox expected sums align.
