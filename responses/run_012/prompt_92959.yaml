      *   *Money:* **FATAL.** This is the crux. VCG mechanisms work because losers can be compensated or winners taxed to align social welfare with individual incentives. Without money, you cannot compensate the losers of a voting rule to make truth-telling optimal. This is why Gibbard-Satterthwaite holds.
