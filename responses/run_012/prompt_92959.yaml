  a friend of mine who works in market design keeps insisting that an election is just an auction with the price tags filed off, and that since we already know how to rig an auction so everyone's best move is to bid what the thing is actually worth to them, it's only an engineering problem to get a voting rule nobody gains by lying about their preferences. my old logic teacher says no, that door was closed decades ago and the friend is quietly importing the one ingredient elections don't have. who's right about the analogy? lay out the correspondence table -- what plays the role of the bidders, the item, the auctioneer, the money, the "truthful" -- then tell me where the mapping breaks, which of the breaks are fatal to the friend's conclusion and which are just decoration, and whether there's a better analogy for what a voting rule is actually doing.
