prompt: |-
  I'm putting together a small research programme — a workshop series plus two postdocs for three years — on the conceptual foundations of democratic inclusion, and I have to decide what the group should work on first. The three candidate areas are compulsory voting, lowering the voting age, and extending the vote to resident non-citizens. My working hypothesis is that these are three faces of a single question: what makes someone a member of the demos, and whether membership is a status one either has or lacks, or instead a bundle of decision-specific authorisations that one might hold for some questions and not others. A colleague in my department thinks that hypothesis flattens what actually matters, and that each area turns on something different — she says compulsion is really about whether voting is a duty of justice or only a right, the age threshold is really about whether competence is a scalar to be weighed or a gate to be passed, and non-citizen voting is really about whether the relevant claim is that everyone affected by a decision ought to have a say or that everyone bound by a law ought to. We spent most of a seminar failing to settle whether she's right, which is part of why I'm asking.

  What I want is a defended agenda, not a literature survey. Suppose the group has philosophical training and no capacity to run experiments or design surveys, and suppose the aim is conceptual work that could change how theorists, and eventually reformers, frame these debates. Which open questions in this area should come first, and why? For each, say how upstream it is — how many other disputes would be settled, dissolved, or reframed if it were answered — how tractable it is for people who can't gather their own data, and how neglected it is relative to how much turns on it. Then tell me which of the questions I've named, mine or my colleague's, are likely dead ends or pseudo-questions, and what would have to happen — an argument landing, a body of empirical results becoming robust, a legal or constitutional change — for your ordering to shift. I care more about the criteria and the trade-offs you make explicit than about a comprehensive map, so please defend the order rather than hedge it.
reasoning: |-
  Here's a thinking process that leads to the suggested research agenda:

  1.  **Analyze the Request:**
      *   **Context:** A small research programme (workshop series + 2 postdocs for 3 years) on the conceptual foundations of democratic inclusion.
      *   **Candidate Areas:** Compulsory voting, lowering voting age, voting for resident non-citizens.
      *   **The Conflict:**
          *   *User's Hypothesis:* These are three faces of a single question (Demos membership: binary status vs. bundled authorizations).
          *   *Colleague's Hypothesis:* These are distinct questions (Duty vs. Right; Scalar Competence vs. Gate; Affected vs. Bound).
      *   **Constraints:** Philosophical training only (no experiments/surveys), aim is conceptual work to reframe debates for theorists/reformers.
      *   **Deliverable:** A *defended agenda* (not a literature survey). Needs to prioritize open questions based on:
          *   Upstream impact (how many disputes settled/reframed).
          *   Tractability (for conceptual philosophers).
          *   Neglect (relative to importance).
      *   **Additional Requirements:** Identify dead ends/pseudo-questions among the named hypotheses. Specify conditions for shifting the ordering (what would change your mind).
      *   **Tone:** Decisive, argumentative, explicit about trade-offs (no hedging).

  2.  **Evaluate the Hypotheses (User vs. Colleague):**
      *   *User's Hypothesis (Unified Theory of Membership):* Attractive for parsimony. If true, solving one solves all. However, it risks being too abstract. "Bundled authorizations" is a powerful conceptual tool, but does it actually explain *why* the bundles differ? It might describe the outcome rather than explain the justification.
      *   *Colleague's Hypothesis (Distinct Justifications):* More granular. Compulsion (normative status of the act), Age (epistemic/psychological capacity), Non-citizens (boundary of the polity). This aligns better with existing legal and political distinctions.
      *   *Verdict:* The colleague is likely more right *diagnostically*, but the user is more right *strategically* for a foundational project. However, treating them as a single question risks conflating distinct normative grounds. The agenda should probably start by testing the *relationship* between these grounds rather than assuming unity or disunity.
      *   *Dead Ends:* The "binary vs. bundle" debate can become semantic if not tied to specific rights/duties. The "affected vs. bound" debate is often stalemate-prone without a prior theory of legitimate authority.

  3.  **Determine the Priority Questions (The Agenda):**
      *   *Goal:* Conceptual leverage. What concept, if clarified, unlocks the others?
      *   *Option A: The Nature of the Vote.* Is it a right, a duty, a power, or a trust? This addresses compulsion directly but impacts age (can you have a duty without capacity?) and non-citizens (do outsiders have the right?).
      *   *Option B: The Boundary Problem (Demos).* Who counts? This addresses non-citizens and age (who is a member?) but less so compulsion.
      *   *Option C: Political Competence.* What is required to vote? This addresses age primarily, compulsion secondarily (must one be competent to be compelled?), and non-citizens (are they competent?).
      *   *Selection:* The most upstream concept is the **Normative Status of the Franchise**. Before asking *who* gets it (boundary) or *if* they must use it (compulsion), we need to know *what* "it" is. Is voting a right to be waived, a duty to be enforced, or a function to be performed?
      *   *Refinement:* Actually, the "Boundary Problem" is usually cited as the most fundamental in democratic theory (Whelan, Dahl). But the prompt asks about *inclusion* specifically. The User's "bundle" idea is actually a solution to the boundary problem. The Colleague's distinctions are applications.
      *   *Decision:* The most upstream question is **The Justificatory Basis of the Boundary**. Is it "All Affected Interests" (AAI) or "All Subjected to Coercion" (ASC)? This is the classic debate. But to make it fresh (and fit the 3-year constraint), we need to link it to the *function* of voting.
      *   *Revised Decision:* Let's look at the "Bundle" hypothesis vs. "Distinct Grounds". The most productive path is to investigate **The Relationship between Political Agency and Legal Status**. This bridges the gap.
      *   *Wait, let's look at the constraints again.* Philosophical training, no data. Aim is to reframe debates.
      *   *Top Priority:* **The Normative Function of Voting.** (Is it protection, expression, or legislation?). If it's protection, AAI dominates (Non-citizens). If it's legislation, ASC dominates (Citizens). If it's expression, Compulsion is wrong. If it's legislation, Compulsion might be right. This determines the answers to all three candidate areas.
      *   *Second Priority:* **The Threshold of Competence.** (Age). This relies on the first. If voting is protection, competence matters less. If legislation, it matters more.
      *   *Third Priority:* **The Enforceability of Democratic Duties.** (Compulsion). This relies on the first two.

      *Let's sharpen this.* The prompt asks for *open questions*.
      1.  **Question 1: What is the primary normative function of the vote?** (Protection of interests vs. Authorship of law).
          *   *Upstream:* High. Determines boundary (AAI vs ASC) and Compulsion (Duty vs Right).
          *   *Tractability:* High. Purely conceptual/normative.
          *   *Neglect:* Medium. Often assumed rather than argued.
      2.  **Question 2: Is political competence a threshold or a weighting factor?**
          *   *Upstream:* Medium. Primarily affects age, but also non-citizens (language/culture tests).
          *   *Tractability:* Medium. Requires engaging with epistemology/psychology concepts without new data.
          *   *Neglect:* High. Usually treated as binary in law, scalar in theory.
      3.  **Question 3: Does the "All Affected" principle generate a right to vote or a right to representation?**
          *   *Upstream:* High for non-citizens.
          *   *Tractability:* High.
          *   *Neglect:* Medium.

      *Actually, I need to choose the *single* best starting point for the 3-year programme.*
      The User's "Bundle" hypothesis is the most innovative but risky. The Colleague's "Distinct" hypothesis is safer but fragmented.
      The best agenda item is to test the **Unity of the Franchise**.
      *Question:* **Is the franchise a unitary status or a modular set of competencies?**
      *Why:* If modular, the Colleague is right (different rules for different issues). If unitary, the User is right.
      *Wait, better:* **The Grounds of Inclusion vs. The Grounds of Obligation.**
      Let's go with **The Normative Function of Voting**. It's the root.

      *Let's try to align closer to the prompt's specific tension.* The tension is Unity (User) vs. Distinctness (Colleague).
      *Priority 1:* **The Coherence of the "Demos" Concept.** Can "the people" be defined consistently across different policy domains? (Directly addresses User vs. Colleague).
      *Priority 2:* **The Competence/Authority Distinction.** Does one need competence to hold authority, or does authority confer competence? (Addresses Age & Non-citizens).
      *Priority 3:* **The Right/Duty Hybrid.** Can a right be non-waivable without ceasing to be a right? (Addresses Compulsion).

      *Okay, let's finalize the top priority.*
      The most upstream question is: **"What is the vote for?"** (Function).
      Why? Because:
      1.  If the vote is for *protecting interests*, non-citizens must vote (AAI).
      2.  If the vote is for *collective self-determination*, only citizens vote (ASC).
      3.  If the vote is for *producing correct outcomes*, competence matters (Age).
      4.  If the vote is for *expressing autonomy*, compulsion is wrong.
      5.  If the vote is for *sustaining the regime*, compulsion is right.
      This single question unlocks all three candidate areas.

  4.  **Drafting the Response:**
      *   **Introduction:** Acknowledge the tension. State the verdict clearly.
      *   **The Agenda (Prioritized):**
          1.  **The Teleology of the Franchise (What is the vote for?)**
              *   Upstream: Very High.
              *   Tractability: High (Conceptual).
              *   Neglect: High (Often assumed).
          2.  **The Modularity of Membership (Bundle vs. Status)**
              *   Upstream: High (Directly addresses User/Colleague).
              *   Tractability: Medium (Requires case studies).
              *   Neglect: Medium.
          3.  **The Nature of Political Competence (Threshold vs. Scalar)**
              *   Upstream: Medium (Mostly Age).
              *   Tractability: Medium (Philosophy of mind/epistemology).
              *   Neglect: Low (Well trodden).
      *   **Dead Ends/Pseudo-questions:**
          *   "Binary vs. Bundle" without functional grounding (Semantic).
          *   "Affected vs. Bound" without a theory of harm/coercion (Stalemate).
      *   **Conditions for Shifting:**
          *   Empirical data on voter behavior (compulsion).
          *   Constitutional rulings (legal constraints).
          *   Consensus on function (if one theory wins).

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "What is the vote for?" too vague?
      *   *Fix:* Make it specific: "Is the vote an instrument of interest protection or an act of collective authorship?" This maps directly to AAI vs. ASC and Right vs. Duty.
      *   *Critique:* The User wants to know if their hypothesis or the Colleague's is a dead end.
      *   *Fix:* Explicitly state that the User's "Bundle" hypothesis is the *solution* to be tested, not the starting assumption. The Colleague's distinctions are *symptoms* to be explained.
      *   *Tone Check:* Ensure I'm not hedging. "I recommend," "This is superior," "This is a dead end."
      *   *Criteria Check:* Did I explicitly defend Upstream, Tractability, Neglect for each? Yes.
      *   *Shift Conditions:* Make them concrete.

  6.  **Final Polish:** Check against the "3 years, 2 postdocs" constraint. The agenda must be doable. Conceptual analysis is doable. "What is the vote for" is a classic philosophical question suitable for workshops and papers.

      *Wait, one more thought:* The prompt asks "Which open questions... should come first". I should frame the agenda as *questions*, not just topics.
      Q1: Does the justification for voting determine the boundary of the demos?
      Q2: Is political membership a unitary status or a bundle of issue-specific authorizations?
      Q3: Is voting competence a precondition for authority or a variable within it?

      *Let's stick with the "Function" question as the absolute priority.* It's the most upstream. If you don't know what a hammer is for, you can't decide who gets to hold it or if they must swing it.

      *Dead Ends:* The "Affected vs. Bound" debate *as currently framed* is a dead end because it lacks a metric for "affectedness". The "Binary vs. Bundle" debate is a dead end if treated as purely descriptive.

      *Shift Conditions:* If empirical work shows compulsory voting changes outcomes significantly, the conceptual work on "duty" gains urgency. If constitutional courts rule on non-citizen voting, the conceptual work becomes legal theory.

      *Okay, ready to write.*
answer: |-
  Here is a defended research agenda for your three-year programme.

  ### The Verdict on the Hypotheses
  Your colleague is diagnostically correct, but you are strategically correct. She is right that compulsion, age, and residency turn on distinct normative mechanisms (duty, competence, boundary). Treating them as identical risks conceptual blurring. However, you are right that they are *systemically linked*. You cannot settle the duty question without knowing what the vote is *for*, and you cannot settle the boundary question without knowing what the vote *does*.

  Therefore, the programme should not start by testing your "bundle" hypothesis directly, nor by accepting her "distinct questions" framing as final. It should start by investigating the **teleology of the franchise**. If you do not establish the function of voting, you cannot determine its boundaries or its obligatoriness.

  ### The Priority Agenda

  I recommend the following order of investigation. This ordering prioritizes **upstream leverage** (how many downstream disputes are resolved) over **immediate policy relevance**.

  #### 1. Primary Question: Is the vote an instrument of interest protection or an act of collective authorship?
  *   **Upstream Impact:** **Extreme.** This is the root node.
      *   If the vote is for *interest protection*, the "All Affected Interests" (AAI) principle dominates. This settles the non-citizen question (residents are affected) and complicates compulsion (you cannot be forced to protect yourself).
      *   If the vote is for *collective authorship*, the "All Subjected to Coercion" (ASC) principle dominates. This settles the non-citizen question (often excluding them) and supports compulsion (authorship is a civic duty).
      *   It also dictates the age question: protection requires sentience/interest; authorship requires rational agency.
      *   Resolving this dissolves the "Affected vs. Bound" stalemate by showing they apply to different functional conceptions of democracy.
  *   **Tractability:** **High.** This is pure normative political theory. It requires analyzing the conceptual commitments of "democracy," "representation," and "legitimacy." Your team can do this with existing literature and argumentation without new data.
  *   **Neglect:** **High.** Most theorists assume a function (usually protection) without defending it against the alternative (authorship). Literature abounds on *who* votes, but is thin on *why* voting exists as a specific mechanism rather than, say, sortition or deliberation.
  *   **Why First:** You cannot decide if membership is a "bundle" (your hypothesis) until you know what is being bundled. If the function is unitary (e.g., solely authorship), the bundle hypothesis fails. If the function is hybrid, the bundle hypothesis gains traction.

  #### 2. Secondary Question: Is political membership a unitary status or a modular set of competencies?
  *   **Upstream Impact:** **High.** This directly tests your hypothesis against your colleague's.
      *   If membership is *unitary*, then lowering the voting age logically implies allowing 16-year-olds to stand for office, serve on juries, etc. It forces consistency across the legal system.
      *   If membership is *modular* (a bundle), then one can vote on school boards without voting on foreign policy, or vote without being compelled. This reframes the debate from "who is a member" to "which decisions require which authorizations."
  *   **Tractability:** **Medium.** This requires conceptual work plus "armchair empirical" analysis of existing legal regimes (e.g., analyzing where laws already fragment rights, like age thresholds for drinking vs. voting vs. driving). It fits a workshop series well.
  *   **Neglect:** **Medium.** Legal scholars discuss this regarding specific rights, but democratic theorists rarely challenge the "one person, one vote, one status" assumption as a foundational principle.
  *   **Why Second:** This question only makes sense once the *function* of the vote (Question 1) is clarified. If the vote is for protection, modularity makes sense (I am affected by zoning but not trade deals). If it is for authorship, modularity is harder to justify (I am subject to the sovereign power as a whole).

  #### 3. Tertiary Question: Is competence a threshold for authority or a variable in weighting?
  *   **Upstream Impact:** **Medium.** Primarily impacts the voting age debate, but spills into non-citizen language requirements.
      *   If competence is a *threshold*, the debate is purely about where to draw the line (epistemic/developmental).
      *   If competence is a *variable*, it opens the door to plural voting (Mill's idea) or epistocracy, which radically reframes inclusion.
  *   **Tractability:** **Medium/Low.** This risks drifting into philosophy of mind or developmental psychology. Without the capacity for surveys/experiments, your team must rely on conceptual analysis of "competence." This is fertile but risks becoming abstract.
  *   **Neglect:** **Low.** This is a well-trodden area in democratic theory (epistocracy vs. egalitarianism).
  *   **Why Third:** It is downstream of Question 1. If voting is for interest protection, competence matters less (I know my interests best). If voting is for correct outcomes, competence matters more. You need the functional account first to weigh the importance of competence.

  ### Dead Ends and Pseudo-Questions

  **1. The "Affected vs. Bound" Debate (as currently framed)**
  *   **Verdict:** **Dead End.**
  *   **Reason:** This debate has stagnated because "affected" and "bound" are indeterminate without a prior theory of harm and coercion. Every law affects everyone globally (climate, markets); every law binds only those within jurisdiction. Arguing over which principle is "correct" without fixing the *function* of the vote (Agenda Item 1) generates heat but no light.
  *   **Condition to Revive:** This debate only becomes tractable if tied to a specific justification for democracy. E.g., "If democracy is for X, then 'Bound' is the correct metric."

  **2. The "Binary vs. Bundle" Debate (as a standalone metaphysical question)**
  *   **Verdict:** **Pseudo-Question.**
  *   **Reason:** Asking whether membership *is* a bundle or a status is like asking whether a hammer *is* a lever or a tool. It depends on the description level. Arguing this without reference to the *normative consequences* (Agenda Item 2) is semantic.
  *   **Condition to Revive:** It becomes real only when linked to specific policy inconsistencies. E.g., "If we treat it as a bundle, does it resolve the tension between 16-year-old workers and 16-year-old voters?"

  ### Conditions for Shifting the Order

  My prioritization assumes a specific landscape of constraints. The agenda should shift if:

  1.  **Empirical Robustness on Compulsion:** If robust cross-national data emerges showing that compulsory voting significantly alters *policy outcomes* (not just turnout), Question 1 (Function) becomes less urgent than the Duty/Right distinction. If compulsion changes *what* democracy does, we must study the mechanism before the justification.
  2.  **Constitutional Hardening:** If a major jurisdiction (e.g., the EU or a Supreme Court) rules that non-citizen voting is a constitutional requirement based on "affectedness," the "Boundary" question moves from theoretical to legal-doctrinal. Your team would need to pivot to analyzing the legal reasoning rather than the normative foundations.
  3.  **Consensus on Function:** If the field converges on the "interest protection" model (unlikely, but possible), Question 1 is settled. You should then immediately jump to Question 2 (Modularity), as protection-based theories naturally support fragmented voting rights (e.g., stakeholder voting).

  ### Summary of Trade-offs
  I have prioritized **leverage over granularity**.
  *   **Trade-off:** By starting with the *Function of the Vote*, you risk spending the first year on abstract theory without producing policy prescriptions for age or residency.
  *   **Defense:** This is the correct risk. If you start with Age or Residency (your colleague's approach), you will produce three separate papers that do not speak to one another. If you start with Function, you produce a framework that forces the Age and Residency debates to align. Given your aim is to "change how theorists frame these debates," upstream conceptual clarity is the only path that guarantees a paradigm shift rather than incremental adjustment.

  Start with **what the vote is for**. Everything else follows.
