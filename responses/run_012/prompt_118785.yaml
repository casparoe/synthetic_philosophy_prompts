  *(Self-Correction during drafting)*: I should clarify that *yogyatā* isn't just physical possibility, but semantic compatibility. And *tātparya* isn't just "what they meant" but specifically the "purport" that resolves ambiguity.

  Let's structure the response to first tackle the "Causal Conditions" framework, then the specific counterexamples, then the redundancy objection, then the Western comparison. This flows logically from the internal logic to the external comparison.

