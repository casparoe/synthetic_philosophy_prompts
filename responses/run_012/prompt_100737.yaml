answer: |-
  Here is the plan for your 50-minute session.

  ### 1. Critique of Your Proposed Sequence
  **Your Plan:** EV $\rightarrow$ Compounding $\rightarrow$ Log $\rightarrow$ Criterion.
  **The Problem:** This sequence validates the wrong mental model before dismantling it. If you start with EV, you anchor them in *ensemble averaging* (what happens across many parallel universes) before they understand why *time averaging* (what happens to one person over time) matters for wealth.
  **What You're Smuggling:** By introducing "Compounding" as a second step, you imply that EV is the default and compounding is a modifier. For a normative claim, compounding (multiplicative dynamics) must be the *axiom*, not the adjustment. You are also smuggling in **Ergodicity** without naming it. If you don't explicitly distinguish between "average outcome of 1,000 people" vs. "outcome of 1 person over 1,000 rounds," the log utility looks like a mathematical trick rather than a physical necessity.

  **Revised Sequence:**
  1.  **The Setup (Multiplicative & Sequential):** Establish that wealth updates multiplicatively and bets are repeated.
  2.  **The Trap (EV vs. Reality):** Show a simulation where EV says "rich" but the trajectory says "broke."
  3.  **The Diagnosis (Arithmetic vs. Geometric):** Explain *why* the divergence happens (volatility drag).
  4.  **The Tool (Logarithms):** Introduce log not as utility, but as the mathematical operator that converts multiplicative time-averages into additive sums.
  5.  **The Norm (Geometric Rationality):** Conclude that maximizing growth rate is the only way to survive the sequence.

  ### 2. The Carrying Example
  **Recommendation:** Use the **x1.5 / x0.6 (Fair Coin)** example.
  **Why:** The double-or-halve (x2 / x0.5) case results in a geometric mean of exactly 1.0 (break-even). Traders might dismiss this as a "boundary case." The x1.5 / x0.6 case has a **positive Arithmetic Expectation (1.05)** but a **negative Geometric Expectation (~0.95)**.
  **What it must have:**
  *   **Positive EV:** To prove that "positive expected value" is insufficient for repeated play.
  *   **Negative Geometric Mean:** To prove that a "good bet" can guarantee ruin.
  *   **Symmetry:** Keep $p=0.5$ so they don't get distracted by probability weighting. Focus entirely on the payoff structure.
  **What it must lack:**
  *   **Additive payouts:** Do not use "$\$$100 win / $\$$50 loss." It must be "% of bankroll."
  *   **Complex probabilities:** Keep $p=0.5$ to isolate the payoff ratio as the variable.

  ### 3. Session Flow & Misconception Interdiction
  *(Total: 50 Minutes)*

  **0:00–0:10: The Setup & The Trap**
  *   **Action:** Present the x1.5/x0.6 bet. Ask: "If I offer this 100 times in a row, betting 100% of your bankroll each time, do you take it?"
  *   **Most will say Yes** (because $EV > 1$).
  *   **Reveal:** Show a quick plot of 10 paths. Most go to near-zero. The *average* of the endpoints is huge (driven by one outlier), but the *median* is ruin.
  *   **Misconception Head-Off:** *"Kelly maximizes Expected Wealth."*
      *   **Kill it here.** Explicitly state: "Kelly does **not** maximize expected wealth. Maximizing expected wealth requires betting 100% (or leverage). Kelly maximizes the *rate of growth* of the median trajectory."

  **0:10–0:25: The Diagnosis (Arithmetic vs. Geometric)**
  *   **Action:** Walk through the math of two flips.
      *   Start with 1. Flip H (1.5), Flip T (0.6). End: $1 \times 1.5 \times 0.6 = 0.9$.
      *   Show that $1.5 \times 0.6 < 1$ even though $(1.5+0.6)/2 > 1$.
      *   Introduce the Geometric Mean as the correct metric for multiplicative sequences.
  *   **Concept:** Explain "Volatility Drag." Variance reduces the geometric mean.
  *   **Misconception Head-Off:** *"This is just for gamblers."*
      *   **Kill it here.** Use the word "Capital Allocation." Remind them that every trade is a fraction of equity exposed to a multiplicative return.

  **0:25–0:40: The Tool & The Criterion**
  *   **Action:** Ask "How do we optimize this?"
      *   Show that maximizing $\prod (1 + f \cdot b_i)$ is hard.
      *   Show that $\ln(\prod) = \sum \ln$ makes it additive and solvable.
      *   Derive the Kelly fraction roughly (don't get bogged in calculus, show the peak of the curve).
  *   **Normative Claim:** "You should maximize Geometric Growth because it is the only strategy that avoids ruin in the long run while maximizing terminal wealth."
  *   **Misconception Head-Off:** *"Fractional Kelly is just Risk Aversion."*
      *   **Kill it here.** Frame Fractional Kelly as **Estimation Error Protection**. "Full Kelly assumes you know the edge perfectly. If you overestimate your edge, you are effectively overbetting, which moves you into the negative growth zone. Half-Kelly is not about utility curvature; it's about robustness to model error."

  **0:40–0:50: Implications & Check**
  *   Discuss the "Overbetting Zone" (betting more than Kelly reduces growth and increases ruin risk).
  *   Final Q&A.

  ### 4. The Final Check Question
  Do not ask them to calculate a Kelly fraction. That tests arithmetic, not understanding.
  **Ask this:**
  > "I have two strategies for your career trading account.
  > **Strategy A:** 20% Expected Return per year, 50% Volatility. (Implies negative geometric growth).
  > **Strategy B:** 15% Expected Return per year, 20% Volatility. (Implies positive geometric growth).
  > You must trade one of these every year for 30 years. You cannot quit early. Which do you choose and **why**?"

  *   **Correct Answer:** Strategy B, because maximizing Arithmetic EV (Strategy A) leads to ruin/decay over a sequence, while Strategy B maximizes the growth rate of the bankroll.
  *   **Wrong Answer:** Strategy A, because "it has higher expected value." (This shows they missed the normative claim).

  ### 5. Scope Limits: What to Refuse
  To stay within 50 minutes and maintain the normative focus, explicitly refuse to go into:
  1.  **Utility Theory:** Do not derive Log Utility from von Neumann-Morgenstern axioms. It confuses the "growth rate" argument with "risk preference." Keep it objective: Growth is a physical property of the sequence, not a subjective preference.
  2.  **Portfolio Kelly:** Do not discuss correlated assets or multi-asset optimization. It requires matrix algebra and distracts from the single-asset normative claim.
  3.  **Continuous Time / Merton:** Do not mention Brownian motion or stochastic calculus. Keep it discrete.
  4.  **Drawdown Control:** If they ask about max drawdown, answer: "Kelly minimizes time to recover, but if you have external margin calls, that's a constraint, not a utility function." Don't let tactical constraints obscure the strategic norm.

  ### Summary of the "Normative" Hook
  Your entire pitch rests on **Ergodicity**.
  *   **Engineers** understand non-ergodic systems (time average $\neq$ ensemble average).
  *   **Traders** understand blow-ups (positive alpha, negative equity).
  *   **The Bridge:** Kelly is the mathematical bridge between the two. It is the strategy that aligns the ensemble expectation with the time-average reality. If you miss this, Kelly is just a sizing formula. If you hit this, it's a law of thermodynamics for money.
