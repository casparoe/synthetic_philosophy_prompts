prompt: |-
  I am a novelist at work on a book whose central character is a philosopher of language. She holds an expressivist view, though not about moral wrongness: she thinks that to call a belief justified is not to describe some property the belief has but to express one’s commitment to a certain inferential role for it. A rival in the novel keeps saying that her view cannot survive the Frege-Geach problem, and I have read enough to know the phrase but not enough to see the precise shape of the objection. I want to be able to write the dispute without having the characters trade slogans, so I need the underlying issue made clear.

  Please explain the problem in a way that gets beneath the standard moral example. What exactly goes wrong for an expressivist when a term like justified appears in an unasserted context—inside a conditional, under negation, or in the antecedent of a modus ponens argument—rather than in a flat assertion? I want the difference between the negation problem and the embedding problem made clear, and I want to understand why the expressivist cannot simply say that in unasserted contexts the attitude is not expressed but only mentioned, or that the sentence is still truth-apt in a minimalist sense. If different expressivists have tried different repairs, say which repair buys what and at what cost, and tell me whether any of them saves the view without turning it into a form of descriptivism by the back door. I am less interested in a survey of positions than in a single continuous explanation I could use to make the dispute vivid for readers who are not philosophers.
reasoning: |-
  Here's a thinking process that leads to the suggested explanation:

  1.  **Analyze the Request:**
      *   **User:** Novelist writing a book about a philosopher of language.
      *   **Character:** Expressivist about *epistemic justification* (calling a belief "justified" expresses commitment to an inferential role, not describing a property).
      *   **Conflict:** A rival claims the view fails the Frege-Geach problem.
      *   **Goal:** Understand the problem deeply enough to write a vivid, non-slogan-filled dispute.
      *   **Specific Requirements:**
          *   Explain the problem beneath the standard moral example (use the character's epistemic context).
          *   Explain what goes wrong in unasserted contexts (conditionals, negation, modus ponens).
          *   Distinguish between the Negation Problem and the Embedding Problem.
          *   Address why simple fixes ("mentioning not expressing," "minimalist truth") fail.
          *   Discuss repairs (quasi-realism, etc.) and their costs (sliding into descriptivism).
          *   Format: Single continuous explanation suitable for informing a novelist, not just a survey.

  2.  **Deconstruct the Frege-Geach Problem (FGP):**
      *   *Core Idea:* Expressivism says "X is good/justified" = "Boo X / Hooray X" (attitude). But logic works on *propositions* (things that can be true/false), not attitudes.
      *   *The Puzzle:* How can "X is justified" mean one thing in an assertion ("X is justified") and something else in a conditional ("If X is justified, then Y")? If it means different things, the argument is invalid (equivocation). If it means the same thing, what is the attitude in the conditional?
      *   *Epistemic Context:* Instead of "Murder is wrong," use "The belief in rain is justified."
          *   Assertion: "Belief in rain is justified." (Expresses: I endorse using this belief as a premise.)
          *   Conditional: "If belief in rain is justified, then we should take an umbrella."
          *   Problem: In the conditional, I'm not endorsing the belief. I'm hypothesizing. So what does "justified" mean there?

  3.  **Address Specific Sub-Problems:**
      *   *Embedding Problem:* General issue of moral/epistemic terms appearing in complex sentences (conditionals, disjunctions, questions).
      *   *Negation Problem:* Specifically about negation. "It is not the case that X is justified." Does this express the *absence* of an attitude? Or the *attitude of absence*? (Schroeder's point).
      *   *Why "Mentioning" Fails:* If "justified" in a conditional just *mentions* the concept without expressing the attitude, then the word changes meaning between asserted and unasserted contexts. Logic requires univocal meaning.
      *   *Why "Minimalist Truth" Fails:* Saying "It's true that X is justified" just pushes the question back. What does *that* truth consist in? If it's just deflationary, does it solve the logical inference issue? Usually, expressivists need to explain *why* the logic holds, not just assert it does.

  4.  **Explore Repairs & Costs:**
      *   *Blackburn's Quasi-Realism:* Try to earn the right to talk like a realist. Use higher-order attitudes. "I disapprove of disapproving of X."
          *   *Cost:* Complexity. Does it really capture the *content* of the belief or just the psychology?
      *   *Gibbard's Norm-Expressivism:* Plans/Norms. "Justified" = "I accept norms that permit this belief."
          *   *Cost:* Still struggles with the logic of planning.
      *   *Hybrid Views:* Some description + some expression.
          *   *Cost:* Risks losing the core expressivist insight (that there is no property of justification).
      *   *The "Back Door" Descriptivism:* If you explain the logic by positing a "propositional content" that functions exactly like a truth-condition, have you just become a descriptivist who likes psychological flourishes?

  5.  **Drafting the Narrative Explanation (Iterative Process):**
      *   *Tone:* Intellectual, precise, but accessible. Like a detailed briefing for a writer.
      *   *Structure:*
          1.  The Core Intuition (The "Boo/Hooray" baseline).
          2.  The Logical Trap (Modus Ponens).
          3.  The Embedding vs. Negation distinction.
          4.  Why Easy Outs Fail.
          5.  The Repairs and the "Descriptivism by Stealth" risk.
          6.  Dramatic Advice (How to stage the argument).

      *   *Refining the Example:* Stick to the novelist's character. Epistemic justification.
      *   *Example:*
          *   P1: If believing it will rain is justified, then you should take an umbrella.
          *   P2: Believing it will rain is justified.
          *   C: You should take an umbrella.
      *   *The Expressivist Difficulty:* In P2, the philosopher expresses commitment. In P1, she doesn't. So "justified" seems to mean different things. If meanings differ, the logic is invalid (Equivocation).

      *   *Negation:* "Believing it will rain is *not* justified." Is this withholding commitment? Or committing to withholding? Big difference.

      *   *The "Mentioning" Objection:* If I say "If 'justified' applies...", I'm talking about the word. But in logic, we talk about the *content*.

      *   *The "Truth-Apt" Objection:* If I say "It's true that...", I need a theory of truth. If it's minimalist, does it support inference?

      *   *The "Back Door" Risk:* If the expressivist builds a complex logic of attitudes that mirrors truth-conditional logic perfectly, the rival can say, "Congratulations, you've reinvented properties, just with extra steps."

  6.  **Final Polish:**
      *   Ensure the distinction between Embedding (general) and Negation (specific) is clear.
      *   Make sure the "Descriptivism by the back door" point lands hard, as that's the dramatic tension.
      *   Keep it continuous, not a bulleted list (as requested: "single continuous explanation"). *Correction:* The prompt asks for a "single continuous explanation I could use," but also says "If different expressivists have tried different repairs, say which repair buys what." I should weave this into a narrative flow rather than a dry list, but clarity is key. I will use section breaks for readability but maintain a cohesive voice.
      *   *Self-Correction on "Continuous":* The prompt says "I am less interested in a survey of positions than in a single continuous explanation." I should avoid a dry "Philosopher A said X, Philosopher B said Y" list. Instead, focus on the *logical pressure points* that force these moves.

  7.  **Final Review against constraints:**
      *   Beneath standard moral example? Yes (use epistemic).
      *   Unasserted contexts explained? Yes.
      *   Negation vs. Embedding? Yes.
      *   Why simple fixes fail? Yes.
      *   Repairs and costs? Yes.
      *   Descriptivism risk? Yes.
      *   Vivid for non-philosophers? Use analogies.

      *(Self-Correction during drafting)*: I need to make sure I don't get *too* technical with symbols. Keep it linguistic. The "Equivocation" charge is the killer.

      *Let's structure the explanation as a "Briefing Document" for the novelist.*

      *Wait, one more check:* The prompt asks for a "single continuous explanation." I will write it as a cohesive essay/briefing, avoiding bullet points where possible to maintain flow, but using paragraph breaks for logical steps.

      *Key Analogy:* The "Punch" analogy. "Boo punching" vs "If punching is wrong..."
      *Better Analogy for Epistemic:* "Endorsing a move in a game."
      *Assertion:* "I endorse this move."
      *Conditional:* "If I endorse this move, then I must move my king."
      *Problem:* In the conditional, I'm not endorsing the move. So what does "endorse" mean there?

      *Okay, ready to write.*
answer: |-
  Here is an explanation of the Frege-Geach problem tailored to your character's specific view on epistemic justification, designed to help you dramatize the philosophical conflict without relying on jargon.

  ***

  To understand the trap your rival is setting for your protagonist, you must first understand the core promise of her expressivism. She claims that when we say a belief is "justified," we are not pointing to a ghostly property attached to that belief, like wetness on a raincoat. Instead, she argues, we are doing something active: we are expressing our own commitment to treating that belief as a permissible premise in reasoning. To call a belief justified is to say, "I endorse using this." It is a verbal gesture, like a thumbs-up, not a description of a fact.

  The Frege-Geach problem is the accusation that this "thumbs-up" theory works only when the philosopher is standing on a soapbox making flat assertions. It collapses the moment she tries to use the word "justified" in the complex, tangled ways we actually speak—specifically, inside conditionals, negations, or logical arguments.

  Imagine your protagonist argues that a specific belief (say, *that it is raining*) is justified. On her view, she is expressing her commitment to using that belief. Now, imagine her rival constructs a simple logical argument (a *modus ponens*) to test her:

  1.  If the belief that it is raining is justified, then you ought to take an umbrella.
  2.  The belief that it is raining is justified.
  3.  Therefore, you ought to take an umbrella.

  This is a valid argument. If you accept the premises, logic forces you to accept the conclusion. But for your expressivist, the word "justified" is doing two completely different jobs in these two premises. In Premise 2, she is *expressing* her commitment. She is giving the thumbs-up. But in Premise 1, she is not giving a thumbs-up to the belief that it is raining. She is merely hypothesizing. She is saying, "In the event that this belief gets a thumbs-up..."

  If the meaning of a word is defined by the attitude it expresses, then "justified" in Premise 1 has no meaning, because no attitude is being expressed there. She isn't endorsing the belief; she is considering a scenario. If the word means "I endorse this" in Premise 2, but means something else (or nothing) in Premise 1, the argument commits the fallacy of equivocation. It's like arguing: "If banks are slippery, you should avoid them; River banks are banks; therefore, you should avoid river banks." The logic fails because the word shifted meaning. Your rival's charge is that expressivism makes all logical reasoning involving "justified" invalid, because it cannot account for what the word means when it is embedded inside a larger sentence rather than standing alone.

  This is the **Embedding Problem**. It is the general difficulty of explaining how an expression of attitude can function as a building block in complex sentences (like "If... then," "Either... or," "Is it true that..."). But there is a sharper, more specific version of this called the **Negation Problem**, which is often harder to dodge.

  Consider the sentence: "The belief that it is raining is *not* justified."
  For a descriptivist (someone who thinks justification is a real property), this is simple. It says the property is absent. But for your expressivist, who thinks "justified" expresses a commitment, what does negation do? Does it mean "I do not have a commitment"? Or does it mean "I have a commitment to *rejecting* the belief"?

  These are very different psychological states. I might simply have no opinion on a complex mathematical theorem (no commitment), but that is not the same as judging the belief in the theorem to be unjustified (a commitment to reject). If your protagonist says "not justified" simply means "I don't endorse this," she loses the ability to criticize. She can't say a belief is *wrong* to hold; she can only say she isn't holding it. But if she says "not justified" means "I endorse rejecting this," she has to explain how that second-order commitment relates to the first one without smuggling in a description of a property called "unjustifiedness." The negation problem shows that expressivism struggles to distinguish between *withholding* an attitude and *holding a negative* attitude.

  Your protagonist might try to escape this by saying, "In unasserted contexts, like conditionals, I am not expressing the attitude, I am merely *mentioning* the concept." She might argue that we all understand what "justified" means even when we aren't currently using it to endorse something.

  Your rival will crush this objection immediately. If "justified" in a conditional merely *mentions* the concept without expressing the attitude, then the word has changed its meaning from the asserted context to the unasserted context. In the assertion, it is an expression of commitment (a speech act). In the conditional, it is a description of a concept (a reference). If the meaning changes, the logic breaks. You cannot have a word that functions as a verb in one sentence and a noun in another within the same logical argument. The validity of logic depends on words keeping their meaning constant regardless of whether they are being asserted, denied, or hypothesized.

  She might try another escape route: **Minimalist Truth**. She might say, "I can still say these sentences are 'true' in a minimalist sense. To say 'It is true that the belief is justified' is just to say 'The belief is justified.'" This is a deflationary view of truth, where "truth" doesn't add any heavy metaphysical weight.

  The problem here is that minimalism solves the linguistic form but not the logical function. Even if she is allowed to say the sentence is "true," she still needs to explain *why* the logic works. Logic works because truth is preserved from premises to conclusion. If "justified" doesn't pick out a property that makes the sentence true in a robust sense, what is being preserved? If her view is that there is no fact of the matter about justification, only attitudes, then logical validity becomes a mystery. It looks like she is playing with logic tokens without a board game to ground them. She is using the *grammar* of truth without the *substance* of truth.

  So, how have real-world expressivists tried to fix this, and what does it cost your character?

  The most famous repair is **Quasi-Realism**, championed by Simon Blackburn. The quasi-realist admits that expressivism has a problem explaining logic, so she tries to "earn the right" to talk like a realist. She constructs a logic of attitudes. She argues that we can have higher-order attitudes about our lower-order attitudes. For example, to accept the conditional "If believing it is raining is justified, then take an umbrella," is to have a higher-order commitment: "I disapprove of any combination of attitudes where I endorse the rain-belief but refuse to take the umbrella."

  This saves the logic. It allows the expressivist to say that logical inconsistency is just a clash of commitments. However, the cost is immense complexity. Your character has to explain that every time we make a logical inference about justification, we are actually navigating a maze of nested psychological commitments. To a reader (and to her rival), this begins to look like a Rube Goldberg machine. If she has to build a structure of "higher-order commitments" that functions exactly like "truth conditions," her rival will argue she has simply reinvented descriptivism by the back door. She is positing a formal structure of norms that behaves exactly like a structure of facts. If it walks like a property and quacks like a property, why insist it isn't a property?

  Another repair, associated with Allan Gibbard, is to shift from "attitudes" to **Plans**. To call a belief justified is to plan to rely on it. Logic then becomes the consistency of plans. But this faces the same pressure: if the consistency of plans is governed by strict logical laws identical to the laws of truth, the distinction between "planning to rely" and "recognizing a fact that warrants reliance" begins to blur.

  The dramatic tension for your novel lies in this "Back Door" risk. The rival's ultimate accusation is not just that the expressivist is wrong, but that she is being dishonest. The rival argues that your protagonist wants to have her cake and eat it too. She wants the moral (or epistemic) authority of the realist—speaking of justification as if it is objective and logical—while retaining the metaphysical safety of the expressivist—denying that justification is a real thing that could be controversial or mysterious.

  The Frege-Geach problem is the lever the rival uses to pry these apart. He is forcing her to choose: either admit that "justified" describes a property (and become a descriptivist), or admit that logical arguments about justification are fundamentally different from other logical arguments (and become a logic-breaker). If she tries to bridge the gap with complex theories of higher-order attitudes, he will accuse her of building a descriptivist theory and slapping an expressivist label on it to make it seem more radical.

  To make this vivid in a scene, do not have them shout about "embedding." Have the rival force her into a corner with a simple conversation. Have him ask her to evaluate a hypothetical scenario where someone else holds a justified belief. Ask her what she is doing mentally in that moment. If she says she is expressing her own commitment, he will point out she isn't committing to anything; she is thinking about *his* commitment. If she says she is thinking about his commitment, he will ask what property that commitment has that makes it "justified." Every time she tries to explain the logic without using properties, she will have to use more convoluted language. Every time she uses clear, logical language, she will sound like she is describing properties.

  The tragedy for your character is that the more successful she is at explaining how reasoning works, the less she sounds like an expressivist. The Frege-Geach problem suggests that language is inherently descriptive in its logical structure. To make sense of our own reasoning, we are forced to speak as if our values and justifications are facts. Her rival's point is that this isn't an accident; it's because they *are* facts, or at least, treating them as anything else makes thought impossible. Her struggle is to find a way to keep the "human element" (the commitment, the endorsement) without breaking the "logical element" (the inference, the consistency). The novel's conflict is whether those two elements can coexist, or if the logic inevitably crushes the expression.
