          1.  Truthfulness is a formal duty (categorical imperative) in *declarations* (statements where truth is expected/required by convention or law).
          2.  Lying vitiates the source of right (*Rechtsquelle*). If everyone lied, contracts/promises would be impossible.
          3.  Lying makes the liar responsible for *all* consequences, even unforeseen ones (because truth would have let natural causality run its course; lying intervenes).
          4.  Distinction: Lying (untruthful declaration) vs. Concealment/Silence/Deception (not necessarily a formal declaration).
