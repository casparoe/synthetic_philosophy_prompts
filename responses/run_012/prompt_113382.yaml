          *   *Consequences:* Kant says you can't foresee consequences of a lie. *Application:* Here, the consequence of truth is *known* (deportation/death). The consequence of lying is *known* (survival). Kant's epistemic uncertainty argument collapses here.
          *   *Lying vs. Deception:* Kant allows silence or evasion if not a formal declaration. *Application:* Can the rescue be framed as "concealment" rather than "declaration"? The boatman's "No" is tricky. It's a direct answer to an official query.

