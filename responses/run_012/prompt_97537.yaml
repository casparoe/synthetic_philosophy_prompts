      **Arcadian Horizon Fund, L.P.**
      **Confidential Investment Prospectus**

      **Investment Objective**
      The Fund seeks long-term capital appreciation by taking a leveraged long position in the moral arc of the universe. Our thesis is straightforward: history is not a random walk, but a directed trajectory toward equitable equilibrium. While traditional markets prize quarterly efficiency, Arcadian Horizon capitalizes on the inefficiency of virtue. We believe justice is an underpriced asset class with significant secular tailwinds. Past performance, while incomplete, suggests a strong correlation between elapsed time and improved ethical outcomes. We treat this correlation as causation.

      **Investment Strategy**
      The Fund employs a passive-aggressive strategy. We do not intervene to accelerate progress; we simply hold exposure to the timeline until maturity. Our models indicate that suffering is merely short-term volatility in an otherwise bullish market. We ignore noise—wars, regressions, and collapses—viewing them as healthy corrections that flush out weak moral actors. The Fund is fully invested in the concept of "Progress." We do not hedge against barbarism.

