      **2. Data Integrity and Survivorship Bias:** Our backtesting relies on historical records. These records were predominantly written by winners. There is a risk that "justice" is simply the branding used by victorious factions to legitimize their holdings. If the losers wrote the books, the trend line might look different. We consider this unlikely and have adjusted for optimism.

