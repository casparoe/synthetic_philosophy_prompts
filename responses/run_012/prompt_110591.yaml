      *   *Counterfactual (Swap to "Privacy as Market Consent"):*
          *   *Changes:* Abolish §26(2) BDSG (employee consent). Allow works councils to be bypassed if individual contracts signed. Shift burden to citizen to opt-out.
          *   *Remain:* General data security standards (technical safety).

  3.  **Analyze Regime 2: United States**

      *   *Facts:* Reasonable expectation of privacy (Katz). Third-party doctrine (voluntary conveyance = no privacy). Sectoral laws (HIPAA, GLBA). Notice-and-consent. Open government (FOIA).
      *   *Theory of Person:* Liberal individualist, rational market actor, bearer of negative liberties against the state.
      *   *Theory of State:* Adversarial threat (Fourth Amendment), but also a transparent entity (FOIA). Limited regulator of private sector.
      *   *Moral Status of Opacity:* Opacity is a shield against the state (Fourth Amendment), but not a shield against private actors if "traded" for service. Secrecy is suspicious in government, valuable for individuals only in specific contexts.
      *   *Required vs. Compatible:*
          *   *Required:* The distinction between state and private power. The idea that information given to a third party is "abandoned."
          *   *Compatible:* Libertarian market theory. Adversarial legalism. The prompt asks: Alienable/Market vs. Adversarial State? It's actually both. The Third-Party Doctrine assumes alienability. The Fourth Amendment assumes adversarial state protection.
      *   *Counterfactual (Swap to "Privacy as Democratic Self-Rule" - German style):*
          *   *Changes:* Overturn Third-Party Doctrine (Smith v. Maryland, Miller). Enact omnibus federal privacy law. Invalidate "take-it-or-leave-it" consent in employment/housing.
          *   *Remain:* FOIA (state transparency remains good). First Amendment protections for data (Sorrell v. IMS might need re-evaluation).

  4.  **Analyze Regime 3: China**

      *   *Facts:* Social Credit System (SCS). Fragmented (blacklists/redlists). Joint rewards/punishments. Aim: Trust/Credit.
      *   *Theory of Person:* Relational, evaluable, perfectible through external incentives. A node in a network of trust.
      *   *Theory of State:* Paternalist, engineer of social morality, arbiter of trust.
      *   *Moral Status of Opacity:* Opacity is suspicious. Transparency of the citizen is necessary for "trust." Transparency of the state is less emphasized than state efficacy.
      *   *Required vs. Compatible:*
          *   *Required:* The state's capacity to categorize and enforce cross-agency consequences. The equation of compliance with trustworthiness.
          *   *Compatible:* Confucian (moral cultivation) vs. Legalist (reward/punishment). The prompt asks to distinguish. It seems more Legalist in mechanism (rewards/punishments) but uses Confucian language (trust/harmony).
      *   *Counterfactual (Swap to "Contextual Integrity" - Nissenbaum):*
          *   *Changes:* Stop cross-agency punishment (tax debt shouldn't affect train travel). Data flow must match context norms. Blacklists limited to specific context (e.g., financial default only affects lending).
          *   *Remain:* Credit reporting within the financial sector. State monitoring of court debtors (if contextually appropriate).

