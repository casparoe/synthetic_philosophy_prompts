prompt: |-
  I am a doctoral candidate in bioethics, and I keep running into a puzzle in my work on advance directives. The standard debate pits the "precedent autonomy" of the earlier, competent self who signed the directive against the "contemporaneous autonomy" of the present self who may now be demented and may resist it, and both framings strike me as too coarse to guide an actual bedside decision. So I have been toying with a sharper principle, which I will call the Foreseeability Constraint: an advance directive should be treated as binding only for those decisions whose specific content the earlier self could have reasonably foreseen and endorsed, judged from the standpoint of the values the later self actually holds at the moment the decision is triggered. On this view, where the earlier self could not have foreseen the situation, the directive simply loses its authority, and the decision reverts to some fallback — best-interest judgment, or a reconstructed surrogate judgment about what this particular patient would now want.

  I would like you to act as a philosopher of personal identity and a clinical ethicist rolled into one. Before you answer, brainstorm briefly about the concepts genuinely in play here — the nature of autonomy, personal identity over time, the difference between a person's long-range "critical" commitments and their momentary "experiential" wants, and the ways hospitals and statutes actually operationalize directives in practice — and only then give me the most important implications of adopting the Foreseeability Constraint. I am especially interested in the non-obvious ones: what it would mean for a clinician faced with a demented patient who now refuses the very treatment her earlier self demanded; what it does to the supposed authority of the earlier self (does the earlier self ever really bind the later one, or was that always a fiction?); how it would change the drafting of the documents themselves; and whether the principle covertly smuggles in a contested theory of personal identity under the guise of a procedural rule. Please be concrete and well organized, rank the implications by how much they matter, and explicitly flag any implication you think I am likely to be getting wrong.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Doctoral candidate in bioethics. This means they know the literature (Dworkin, Dresser, Robertson, etc.), understand the standard debates (precedent vs. contemporaneous autonomy), and are looking for high-level, nuanced critique and development of their own proposed principle.
      *   **Topic:** Advance Directives (ADs), specifically a new principle called the "Foreseeability Constraint."
      *   **The Principle:** ADs are binding *only* if the earlier self could have reasonably foreseen the specific content *and* endorsed it judged from the standpoint of the *later self's current values*. If unforeseen, authority lapses to best interest/surrogate.
      *   **Role:** Philosopher of personal identity + Clinical Ethicist.
      *   **Task:**
          1.  Briefly brainstorm concepts (autonomy, identity, critical/experiential interests, operationalization).
          2.  Provide the most important implications of adopting this constraint.
          3.  Focus on non-obvious implications (clinician experience, authority of earlier self, drafting changes, metaphysical smuggling).
          4.  Be concrete, well-organized, rank implications by importance.
          5.  Explicitly flag potential misunderstandings/errors in the user's thinking.

  2.  **Deconstruct the "Foreseeability Constraint" (FC):**
      *   *Condition 1:* Reasonable foreseeability of specific content by the earlier self.
      *   *Condition 2:* Endorsement judged from the standpoint of the *later self's actual values*.
      *   *Fallback:* Best interest/reconstructed surrogate judgment.
      *   *Immediate Tension:* Condition 2 seems to undermine the whole point of ADs. If the later self's values govern endorsement, then contemporaneous autonomy (or at least current welfare) trumps precedent autonomy anyway. It sounds like a "Ulysses Contract" check, but applied to dementia.
      *   *Metaphysical Load:* It assumes a continuity of "values" even if cognitive capacity is lost. It assumes we can access the "later self's values" in severe dementia.

  3.  **Brainstorming Concepts (Mental Sandbox):**
      *   *Autonomy:* Dworkin's critical interests vs. experiential interests. The FC tries to bridge them but leans heavily on the later self's state.
      *   *Personal Identity:* Psychological continuity (Locke/Parfit). If the dementia patient is a "different person" (Dresser's critique), does the FC solve it? The FC requires the later self to have *values* to judge against. Severe dementia might obliterate values.
      *   *Clinical Reality:* ADs are rarely specific enough. "Terminal condition" is vague. Clinicians want clear rules, not metaphysical inquiries into the patient's current value system.
      *   *Legal/Statutory:* Most laws (e.g., PSDA) prioritize the written document *unless* revoked while competent. The FC introduces a competency-adjacent standard for the *demented* state.
      *   *The "Endorsement" Problem:* How do we judge endorsement from the standpoint of values the later self holds *if* the later self lacks the capacity to hold complex values?

  4.  **Developing the Implications (Drafting the Core Content):**
      *   *Implication 1: The Epistemic Burden on Clinicians.* This is huge. Asking a nurse/doctor to assess the "values of the later self" to check against the "foreseeability of the earlier self" is practically impossible in many dementia cases.
      *   *Implication 2: The Erosion of Precedent Autonomy.* If the later self's values are the metric, the earlier self never really binds the later one. It makes the AD a *proposal* rather than a *command*.
      *   *Implication 3: Drafting Changes.* ADs would need "value maps" not just treatment choices. "If I become X, I value Y."
      *   *Implication 4: Metaphysical Smuggling.* It assumes psychological continuity is robust enough to measure "current values" in dementia. This contradicts the "discontinuity" view.
      *   *Implication 5: The "Happy Dementia" Paradox.* If the demented patient is happy (experiential interest) but the AD demands death (critical interest), the FC likely blocks the AD because the current self values life/comfort.

  5.  **Critiquing the User's Principle (Flagging Errors):**
      *   *The "Endorsement" Catch-22:* You say "endorsed, judged from the standpoint of the values the later self actually holds." If the later self is severely demented, do they *have* values in the relevant sense? If they do, why do we need the AD? If they don't, the constraint fails.
      *   *Foreseeability vs. Specificity:* "Specific content" is too high a bar. No one foresees the *specific* pneumonia. They foresee "terminal decline."
      *   *Legal Viability:* This likely violates current legal standards which prioritize the competent prior wish over the incompetent current refusal (in most jurisdictions).

  6.  **Structuring and Refining:**
      *   *Introduction:* Acknowledge the sophistication of the proposal.
