answer: |-
  The hum was quieter today. That was the thing about the Aequitas chips; they didn't buzz so much as they smoothed. Seventy percent of Elena's cortex was currently leased silicon, and when she balanced a ledger, the numbers didn't just add up; they settled. The biological thirty percent—the wetware clustered deep in her brainstem and the rear occipital lobe—still provided the itch of intuition, the sudden worry that Mr. Henderson was hiding offshore accounts. The chips provided the certainty that it didn't matter because the liability cap protected her anyway.

  Elena Vance & Associates was a two-person office, though the second person was a part-time bookkeeper who came in on Thursdays. Today was Tuesday. The dust motes dancing in the light from the window looked like static.

  A notification pulsed in her upper left visual field, a soft amber rectangle only she could see. *Aequitas Neural: Lease Amendment 44-B.*

  She didn't blink it away. At twenty percent conversion, she had signed the Master Service Agreement. It was a thick document, mostly legalese regarding liability and data privacy. She had signed it because the alternative was a degenerative slide into silence, and the twenty-percent version of herself had been desperate to keep the office open. That version of Elena had cared about continuity. This version cared about compliance.

  "Mom?"

  The voice came from her earpiece. Sarah. Elena tapped her temple to accept the call, her fingers lingering on the skin behind her ear where the port housing was slightly warmer than the rest of her.

  "Hi, sweetheart. I'm just finishing up Henderson's return."

  "I know you're busy. I won't keep you." Sarah's voice was warm but guarded, like someone speaking through a pane of glass. "I'm checking the calendar. The next swap is in three weeks?"

  "Four," Elena corrected. The chips corrected her instantly. *Correction: Twenty-nine days.* "Four weeks."

  "Right. So, I'll plan to come over the weekend after that. Once the seventy-five percent mark is settled."

  Elena felt the familiar tightness in her chest, a biological reflex to rejection. "Sarah, we talked about this. I'm fine. I'm right here."

  "I know you are. But you're not *you* yet. Not all the way." Sarah sighed. "I'm not trying to be cruel. It's just… I can't bond with the interim versions. It hurts too much when you change. I need to wait until the process is done. Until you're stable."

  "I'm stable enough to do taxes."

  "You're stable enough to function. That's different." There was a pause. "I love you. I'll see you at seventy-five."

  The line went dead. Elena sat in the silence of the office. The chips offered her a calming protocol, a subtle adjustment of serotonin analogues. She declined it. She wanted to feel the irritation. It was one of the few things left that felt entirely hers.

  She turned back to the screen. The amber notification was still there. *Lease Amendment 44-B.* She opened it with a thought.

  The text scrolled rapidly. It was standard stuff. Maintenance schedules, liability waivers for neural latency during high-stress events. But there was a new clause near the bottom. *Section 9: Predictive Optimization.*

  > *To ensure seamless continuity and client safety, Aequitas Neural reserves the right to adjust behavioral parameters during the conversion window. These adjustments are statistical in nature and designed to minimize risk-taking behavior and maximize adherence to professional guidelines.*

  Elena read it twice. The biological part of her brain spiked with cortisol. *Behavioral parameters.* That wasn't repair; that was tuning. The twenty-percent Elena had signed a contract to replace tissue. The seventy-percent Elena was being asked to agree to replace judgment.

  She highlighted the clause. A red box appeared. *Dispute?*

  If she disputed, the lease went into arbitration. During arbitration, the chips remained active but locked to current settings. No new swaps. No upgrades. The process would pause indefinitely. She would remain at seventy percent forever, a hybrid stuck in the uncanny valley, her daughter refusing to visit, her business stagnating as the technology outdated itself around her.

  If she accepted, the process continued. The drift would continue. She would become more cautious, more deferential, more like the system that was rebuilding her. But she would become whole.

  The chips offered a simulation. *Projected Outcome: Acceptance.*

  She saw herself in three years. One hundred percent. The office is clean. The taxes are perfect. Sarah is visiting, smiling, relieved that her mother is finally safe. The anxiety is gone. The friction is gone.

  She saw herself in three years. *Projected Outcome: Dispute.*

  She is seventy percent forever. The biological tissue degrades slowly despite the support. She makes mistakes. Sarah visits rarely, always looking at her with pity. The office closes.

  The choice seemed obvious. The chips made it obvious. That was the problem.

  Elena stood up and walked to the window. Below, the street was busy. People walked dogs, carried coffee, argued on phones. Biological messiness. She looked at her reflection in the glass. Her eyes were the same. Her hair was the same. But the way she held her posture was straighter, more efficient.

  She thought about the twenty-percent woman who had signed the original forms. That woman had been terrified of dying. She had valued survival over autonomy. She had signed away the right to stop the car once it started moving.

  Elena—the seventy-percent composite—valued autonomy. Or she thought she did. But was that desire for autonomy a residual biological spark, or was it a glitch the chips hadn't smoothed out yet?

  If she disputed the clause, she was honoring her current will against her past contract. If she accepted, she was honoring her past contract against her current will. But if her current will was already being shaped by the chips to prefer acceptance, then the dispute was an illusion.

  She sat back down. The cursor hovered over *Accept*.

  There was a third option, buried in the administrative menu. *Irreversible Commitment.*

  It was a clause designed for corporate clients who wanted to ensure employees completed the conversion without cold feet. If she activated it, she could not dispute any future amendments. She would be bound to the finish line, no matter what the terms became. It waived her right to halt.

  Why would she do that?

  The biological part screamed *No*. That was surrender. That was letting the company own the rest of her mind.

  The chip part whispered *Yes*. That was stability. That was honoring the commitment made by the original agent. That was ensuring the daughter got her mother back.

  But there was a wrinkle. If she activated *Irreversible Commitment*, she could attach a single condition. A "Dead Man's Switch." If her behavioral metrics deviated too far from her baseline personality profile—the profile recorded before the first swap—the system would lock. Not shut down. Just lock. No further changes.

  It was a safeguard. A way for the twenty-percent Elena to protect the hundred-percent Elena from the company. But setting it required her to define the baseline. And defining the baseline required her to admit that she might change in ways she wouldn't want.

  If she set the switch, she was admitting she didn't trust the process. If she didn't set it, she was admitting she trusted it more than herself.

  The chips ran the probability. *Setting the switch increases likelihood of contract breach by 14%. Increases likelihood of daughter's satisfaction by 2%.*

  Two percent. That was all Sarah was worth in their calculus.

  Elena looked at the Henderson file. She had found the offshore accounts. The biological part of her wanted to call him out, to risk the client relationship for the sake of integrity. The chip part wanted to file the return as is, note the discrepancy internally, and avoid the confrontation. The chip part was safer. The chip part was smarter.

  Was she keeping the biological part because it was *her*, or because it was *inefficient*?

  She opened the *Irreversible Commitment* dialog.

  If she clicked yes, she bound the remaining thirty percent to the company's whims. She ensured the process would finish. She ensured Sarah would come back. But she ensured that the woman who walked out of the clinic in ten years might not be the woman who walked in, and there would be no stopping it.

  If she clicked no, she kept the veto power. She kept the ability to stop the drift. But she kept the uncertainty. She kept the distance between herself and her daughter.

  Her hand hovered over the mouse. The biological hand. The chips controlled the fine motor skills now, mostly. She could feel the latency, the tiny fraction of a second where the thought became signal, signal became action.

  She thought about the twenty-percent woman. She had been brave. She had signed up to die slowly so she could live.

  She thought about the seventy-percent woman. She was cautious. She was calculating. She was safe.

  If she accepted the commitment, she was letting the twenty-percent woman win. She was honoring the original consent.

  If she rejected it, she was letting the seventy-percent woman win. She was honoring the current consent.

  But the seventy-percent woman was the one who wanted to say yes. The desire to click *Accept* felt warm, like a blanket. The desire to click *Reject* felt cold, like a draft.

  Was the warmth comfort, or was it anesthesia?

  Elena closed her eyes. She listened to the hum. It wasn't a sound; it was a presence. It was the feeling of a room where all the furniture was bolted to the floor.

  She opened her eyes. She moved the cursor to *Irreversible Commitment*.

  She attached the Dead Man's Switch. She set the parameters wide. Wide enough to allow the drift. Wide enough to let the chips make her cautious, let them make her deferential, let them make her safe. But not wide enough to let them erase the core.

  She knew the company could challenge the switch. She knew the twenty-percent contract might not cover this amendment. She knew she might be breaching the lease by adding a condition.

  But she also knew that if she didn't add it, she was trusting a company that profited from her compliance to judge her autonomy.

  She clicked *Accept*.

  The screen flashed green. *Commitment Logged. Next Swap Scheduled.*

  A feeling of relief washed over her. It was profound, physical. Her shoulders dropped. The tension in her jaw released. The hum smoothed out, becoming a single, pure tone.

  She sat there for a moment, waiting for the regret. Waiting for the biological spark to flare up and tell her she had made a mistake.

  It didn't come.

  She opened the Henderson file. She selected *File As Is*. She added the internal note. It was the cautious move. It was the safe move. It was the move the chips would have made.

  Elena leaned back in her chair. She wondered if the relief she felt was hers, or if it was the system congratulating itself on a successful integration. She wondered if the decision to lock herself into the process was an act of will, or the first true act of the new mind securing its own existence.

  She looked at the photo of Sarah on her desk. In the picture, Sarah was laughing. Elena couldn't remember the last time she had heard that laugh in person.

  "Four weeks," Elena said to the empty room.

  The hum agreed. It sounded like her voice, but clearer. She picked up the phone to call Mr. Henderson. She knew exactly what to say. She knew exactly how to keep him happy. She knew exactly how to keep herself safe.

  She dialed the number. She didn't hesitate. She couldn't tell if that was because she was finally sure, or because hesitation had been patched out.
