  **Game 1:**
  *   $d = (0,0)$
  *   $a = (100, 80)$
  *   **K-S:** Intersection of $u_2 = 0.8u_1$ and Frontier. $\approx (62.5, 50)$.
  *   **Nash:** Max $u_1 u_2$. $\approx (75, 48)$.
  *   **Naive:** $(50, 40)$.

  **Game 2:**
  *   $d = (0,0)$
  *   $a' = (120, 80)$
  *   **K-S:** Intersection of $u_2 = \frac{80}{120}u_1 = 0.66u_1$ and Frontier. $\approx (72, 48)$. (Shifts toward P1).
  *   **Nash:** Max $u_1 u_2$. Still $\approx (75, 48)$. (Stays put).

