answer: |-
  Here is a complete run-of-show for a 90-minute session. It is designed to be low-tech (handouts + whiteboard) and high-engagement.

  ### 1. Preparation & Materials

  **The Stakes:**
  Use a raffle ticket system to linearize utility and avoid diminishing marginal utility of candy.
  *   **Conversion:** 1 Point = 1 Raffle Ticket.
  *   **Prize:** One large prize per pair (e.g., a $20 gift card or a fancy chocolate box).
  *   **Mechanism:** At the end of class, each pair draws from a hat containing tickets equal to their agreed points. If P1 has 75 and P2 has 48, put 75 tickets with P1's name and 48 with P2's name. Draw one winner. This makes Expected Value = Points, encouraging risk-neutrality.

  **The Handouts (Print 6 copies of each):**
  *   **Sheet A (Game 1):** The Contract Menu.
  *   **Sheet B (Game 2):** The Expanded Menu.
  *   **Instructor Key:** (Do not distribute) Contains the Nash and K-S predictions.

  **The Room:**
  *   6 tables/pairs.
  *   Whiteboard divided into two large grids (Game 1 and Game 2).

  ---

  ### 2. The Payoff Tables (The Engine)

  You need the Naive, Nash, and K-S solutions to be distinct.
  *   **Disagreement Point ($d$):** (0, 0) for both games.
  *   **Naive Focal Point:** Equal absolute surplus (50, 40).
  *   **Nash Solution:** Maximizes product $u_1 \times u_2$.
  *   **K-S Solution:** Equal proportional gain $\frac{u_1}{a_1} = \frac{u_2}{a_2}$.

  #### Game 1: The Baseline
  *   **Feasible Set:** Defined by the contracts below. Players can choose a contract or any linear combination of two adjacent contracts.
  *   **Ideal Point ($a$):** (100, 80).
  *   **Predictions:**
      *   **Naive (Equal Split):** (50, 40) — *Feasible but Pareto inefficient.*
      *   **Kalai-Smorodinsky:** (62.5, 50) — *62.5% of P1 max, 62.5% of P2 max.*
      *   **Nash:** (75, 48) — *Max product (3600).*

  **Handout Contract Menu (Game 1):**
  | Contract | Player 1 Points | Player 2 Points |
  | :--- | :---: | :---: |
  | **A** | 100 | 0 |
  | **B** | 90 | 30 |
  | **C** | 80 | 42 |
  | **D** | **75** | **48** |
  | **E** | **62.5** | **50** |
  | **F** | 50 | 55 |
  | **G** | 0 | 80 |

  *(Note: Instruct them they can mix. E.g., half of D and half of E yields 68.75, 49.)*

  #### Game 2: The Monotonicity Test
  *   **Change:** We add **Contract Z**. This gives P1 more potential maximum but is lopsided.
  *   **New Ideal Point ($a'$):** (120, 80).
  *   **Predictions:**
      *   **Nash:** Stays at **(75, 48)**. (IIA: The local frontier near the solution didn't change, and Z is dominated in terms of product).
      *   **K-S:** Moves to **(72, 48)**.
          *   *Math:* New ratio is $80/120 = 2/3$. We need $u_2 = \frac{2}{3}u_1$.
          *   On the frontier between D(75,48) and E(62.5, 50), the line is roughly linear.
          *   Actually, to make the math clean for you: The K-S line is now $u_2 = 0.66 u_1$.
          *   Old K-S (62.5, 50) is now "too generous" to P2 ($50/62.5 = 0.8 > 0.66$).
          *   New K-S must shift toward P1 (Higher $u_1$, lower $u_2$).
          *   *Target:* Approx **(72, 48)**.

  **Handout Contract Menu (Game 2):**
  *   Same as Game 1, **PLUS**:
  | Contract | Player 1 Points | Player 2 Points |
  | :--- | :---: |
  | **Z** | 120 | 0 |

  ---

  ### 3. Run of Show (90 Minutes)

  **0:00 – 0:10 | Intro & Setup**
  *   Divide into 6 pairs. Randomly assign P1 and P2 roles.
  *   Explain the raffle mechanism (Points = Tickets).
  *   **Rule 1:** If you don't agree within the time limit, both get 0.
  *   **Rule 2:** You can propose any linear combination of the listed contracts.
  *   **Rule 3:** Do not discuss the theory yet. Just negotiate.

  **0:10 – 0:30 | Round 1 Negotiation**
  *   Distribute **Game 1** sheets.
  *   Let them negotiate. Walk around. If a pair is stuck on "50/50", remind them: "Remember, (50, 40) is feasible, but (62.5, 50) gives you *both* more. Why leave tickets on the table?"
  *   **Stop.** Collect agreements.

  **0:30 – 0:35 | Tally Round 1**
  *   Draw a grid on the board. X-axis = P1 Points, Y-axis = P2 Points.
  *   Plot the 6 pairs as dots.
  *   Mark the **Nash Point (75, 48)** with an 'N'.
  *   Mark the **K-S Point (62.5, 50)** with a 'K'.
  *   Mark the **Naive Point (50, 40)** with a '?'.

  **0:35 – 0:55 | Round 2 Negotiation**
  *   **Crucial Instruction:** "You are new pairs. Keep your roles (P1/P2). Here is a new menu. It has one new option at the top. Negotiate again."
  *   Distribute **Game 2** sheets.
  *   *Do not tell them the ideal point changed.* Let them discover Contract Z.
  *   Watch for P1 saying: "Hey, I can get 120 now."
  *   **Stop.** Collect agreements.

  **0:55 – 1:00 | Tally Round 2**
  *   Plot the new 6 pairs on the *same* graph (use a different color or shape).
  *   Mark the **Nash Prediction (75, 48)** again (it hasn't moved).
  *   Mark the **New K-S Prediction (approx 72, 48)**.

  **1:00 – 1:30 | The Debrief (The Core)**

  ---

  ### 4. The Debrief Script

  **Step 1: The Pareto Frontier (5 mins)**
  *   Look at the board. "How many pairs chose (50, 40) or worse?"
  *   If many did: "You violated Pareto Efficiency. You burned tickets."
  *   If most moved to the frontier (Contracts C, D, E): "Good. You recognized that efficiency is a prerequisite for rationality."

  **Step 2: Nash vs. K-S in Round 1 (10 mins)**
  *   "Look at Round 1. Where did you cluster?"
  *   **Scenario A (Cluster near Nash):** "You acted like Nash bargainers. You maximized the joint product. You treated the bargaining problem as finding the biggest pie."
  *   **Scenario B (Cluster near K-S):** "You acted like K-S bargainers. You split the *gains* proportionally. P1 got ~62% of their max, P2 got ~62% of their max."
  *   **The Philosophy:** "Nash says: 'My power comes from how much I contribute to the product.' K-S says: 'My power comes from how much I *could* have gotten if you weren't here.'"

  **Step 3: The IIA vs. Monotonicity Shock (15 mins)**
  *   "Look at Round 2. I added Contract Z (120, 0). Did anyone actually pick Z?" (No).
  *   "Did the efficient frontier between 50 and 80 points for P2 change?" (No).
  *   "So, should the solution change?"
  *   **The Nash View (IIA):** "No. Z is irrelevant. It's dominated. It doesn't change the trade-off at the margin. The solution should stay at (75, 48)."
  *   **The K-S View (Monotonicity):** "Yes. P1's *ideal* point moved from 100 to 120. P1's bargaining strength increased because their 'threat' (walking away to their best solo option) is now relatively better compared to P2's. P1 should get more."
  *   **Check the Board:** "Did the outcomes shift right (toward P1) in Round 2?"
      *   **If Yes:** "You intuitively follow Monotonicity. You believe that expanding my options, even if we don't use them, makes me stronger."
      *   **If No:** "You intuitively follow IIA. You believe only the immediate trade-off matters."

  **Step 4: The Appeal and The Crazy (10 mins)**
  *   **Why K-S is appealing:** "It feels fairer. Equal proportional gain. If I can reach 100 and you can reach 50, and we agree on 75/37.5, we both gave up 25% of our potential. Nash might ask me to give up 40% and you 10% just because the curve bends that way."
  *   **Why K-S is crazy:** "It depends on the 'Utopia Point'. In Round 2, Contract Z was useless. No one wanted it. It was a 'phantom option'. Why should a phantom option change how we split the real money? Nash says that's irrational. K-S says it's about relative potential."
  *   **The Hard Truth:** "K-S requires us to agree on what the 'Ideal Point' is. In real life, do we agree on my maximum possible payoff? Or do I bluff that my ideal is 1000 to shift the K-S line?"

  ---

  ### 5. Troubleshooting: What Will Go Wrong

  **1. The "Polite 50/50" Split**
  *   **The Problem:** Pairs ignore the table and agree to "50 points each" (or 50/50 split of the max possible sum).
  *   **The Fix:** In the intro, say: "There is no social norm here. There is only the table. If you agree to a number not on the table, you must justify it as a mix of contracts."
  *   **In Debrief:** Use this. "If you split 50/50, you rejected both Nash and K-S. You chose 'Equal Absolute Gain'. That's a valid ethical stance, but it's not the Nash or K-S solution. It violates Pareto if (50,50) is inside the frontier."

  **2. Risk Aversion Confound**
  *   **The Problem:** P2 is risk-averse. P2 prefers (62.5, 50) over (75, 48) not because of fairness, but because 50 is "safer" than 48? (Unlikely with small stakes). More likely: P2 fears disagreement and takes a worse deal.
  *   **The Fix:** The raffle ticket system fixes most of this. But in debrief, acknowledge it: "If P2 took a lower payoff, was it because of fairness (K-S) or fear (Risk Aversion)? Nash assumes risk neutrality. If you were risk-averse, the Nash solution *mathematically changes*. So your behavior might still be Nash, just with curved utility."

  **3. Confusion on "Ideal Point"**
  *   **The Problem:** Students think the Ideal Point is what they *expect* to get.
  *   **The Fix:** Be precise. "The Ideal Point is the maximum you could get *if the other person got nothing*. It is the coordinate of the top-right corner of the smallest box containing the feasible set."

  **4. Round 2 Doesn't Move**
  *   **The Problem:** Pairs ignore Contract Z entirely and repeat Round 1.
  *   **The Fix:** This is actually a *win* for Nash (IIA). Don't panic. Frame it: "Half of you are Nashians (IIA), half are Kalai-Smorodinskians (Monotonicity). Look at the split on the board." The tension is the lesson.

  ---

  ### 6. Limitations (What to say at the very end)

  Be honest about what this activity didn't do. Put this on a slide or say it verbally for the last 5 minutes.

  1.  **No Axiomatic Proof:** "Today you *felt* the difference between Monotonicity and IIA. But you didn't prove that K-S is the *unique* solution satisfying Pareto, Symmetry, Scale Invariance, and Monotonicity. That requires math."
  2.  **The "Zoo" Problem:** "K-S is just one alternative to Nash. There's the Egalitarian solution, the Perles-Maschler solution, etc. We focused on K-S because it's the most famous challenger, but don't think it's the only one."
  3.  **Information Requirements:** "K-S requires knowing the other player's Ideal Point. In real bargaining, I don't know your maximum possible payoff. Nash requires less information (just the local frontier). This is why Nash is more common in applied econ, even if K-S feels fairer."
  4.  **Utility Measurement:** "Both solutions assume we can measure utility cardinally (interpersonally comparable for K-S). In standard micro, we usually only have ordinal utility. This whole session assumed points = utility. That's a big leap."

