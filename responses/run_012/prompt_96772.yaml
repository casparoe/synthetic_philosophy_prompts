answer: |-
  The disagreement is substantive rather than verbal because it turns on whether the ontology of the world must respect the symmetries of physical theory, specifically whether there exists a privileged foliation of spacetime that physics cannot detect.

  The verbal diagnosis fails because it assumes the two sides agree on the structure of the world and merely differ on labeling, but they do not. The eternalist claims the Minkowski manifold exhausts reality, implying no slice is ontologically privileged over another. The presentist claims that only one slice is real, which entails the existence of a privileged foliation even if the equations of special relativity cannot identify it. This is a disagreement about the furniture of the universe, not the dictionary: the presentist is committed to surplus structure (a hidden "now") that the eternalist rejects as ontologically profligate. Consequently, the "reality-transfer principle" you identified is not a trivial semantic rule but a substantive metaphysical bridge principle asserting that ontological status must supervene on physical symmetry relations. When the presentist denies this principle, they are not clarifying the meaning of "real"; they are asserting that existence is a primitive property that does not reduce to causal or geometric connectivity, thereby positing a fact of the matter that lies outside the invariant structure of the theory.

  The stalemate persists because special relativity underdetermines the metaphysics: the physics fixes the causal structure and the metric, but it does not logically forbid a hidden privileged frame, nor does it force one. The eternalist argues from methodological naturalism, insisting that ontology should not posit undetectable structure (Occam's razor), while the presentist argues from phenomenological realism, insisting that the experience of becoming captures a truth that coordinate systems miss. Neither side can win on physical grounds because the dispute is no longer about physics; it is about which theoretical virtue—parsimony or intuitive fidelity—should govern metaphysics when physics falls silent.

  Progress requires abandoning the hope that special relativity alone dictates the ontology of time and instead reframing the debate as a choice between theoretical costs. A productive shift would be to treat the "reality-transfer principle" not as a premise to be proved but as a explicit axiom of "ontological symmetry," forcing the presentist to openly defend why existence should violate Lorentz invariance. Until both sides acknowledge that they are weighing extra-physical virtues rather than deriving conclusions from the Lorentz transformations, the debate will remain a standoff between competing intuitions about what counts as a legitimate explanation, rather than a resolvable conflict about the world.
