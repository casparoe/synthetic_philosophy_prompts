answer: |-
  **The Case**

  You run a boutique design firm where two colleagues, Mara and Eli, both neglect to file crucial permits, delaying a project by a week. Both admit the error freely, offering identical apologies and assurances of future care. You have a strong professional interest in moving past the error quickly to save the client relationship, and this consideration—saving the client relationship by moving past the error—presses equally on your stance toward Mara and Eli. Mara is your co-founder, bound to you by a fiduciary pledge to sustain the firm through setbacks as a shared venture. Eli is a senior hire on a fixed-term contract, engaged solely for deliverable output. You feel the pull to let the matter rest for the sake of the project, yet the impulse feels distinct depending on who stands before you.

  **The Demonstration**

  **1. The Plain Two-Level Fitting-Attitude Diagnosis**
  This view holds that fittingness is determined solely by the object's merit (e.g., remorse, responsibility), while all other considerations bear only on the goodness of having the attitude. Since Mara and Eli are equally responsible and equally remorseful, the merit-based reasons for forgiveness are identical. The consideration "saving the client relationship" is a consequence of forgiving, not a property of the wrongdoer. Therefore, this view verdicts that the consideration is a Wrong-Kind-of-Reason (WKR) for *both* targets. It treats the urge to forgive Mara as merely more urgent or valuable than forgiving Eli, but not different in kind.

  **2. The Target-Sensitive View**
  This view holds that for directed attitudes, fittingness requires the reason to bear on the target's agency or standing toward the agent. For Mara, the consideration "saving the client relationship" is inextricable from "sustaining the partnership," which is constitutive of her standing toward you. Forgiveness here functions as a relational repair mechanism internal to the fiduciary bond. For Eli, the consideration bears only on the instrumental value of retaining an employee; his standing is transactional. Therefore, this view verdicts that the consideration is a Right-Kind-of-Reason (RKR) for forgiving Mara (it bears on the relational standing required for the attitude) but a WKR for forgiving Eli (it bears only on consequences).

  **3. The Deflationary View**
  This view treats all such reasons as reasons to want to have the attitude, dissolving the distinction between RKRs and WKRs into a single metric of utility. On this view, there is no asymmetry in the *kind* of reason, only in the weight. You have more reason to want to forgive Mara because the utility of the partnership is higher than the utility of the contract. The asymmetry in how the impulse feels is merely psychological, not normative. The verdict is that the distinction collapses; there is only one kind of reason (pragmatic) for both.

  **The Feature Doing the Work**
  The single feature driving the asymmetry is the **constitutive normative relationship** (fiduciary partnership vs. transactional contract). This feature determines whether the reason bears on the *standing* that makes the directed attitude intelligible (partnership) or merely on the *outcome* of holding it (contract). If this feature is removed—for instance, if both Mara and Eli are fixed-term contractors—the case collapses back into the familiar WKR shape. The consideration becomes purely prudential for both, and the intuitive distinction between "forgiving because we are partners" and "forgiving because I need the work done" vanishes.

  **The Plain Diagnosis Defender's Attack**
  A defender of the plain diagnosis would argue that forgiveness is fundamentally a moral response to wrongdoing, regardless of relationship status. They would claim that even for Mara, the partnership reason is still a WKR; it merely overrides the moral reasons more strongly than it does for Eli. They would assert that conflating relational obligations with fittingness conditions muddies the water between *ought to forgive* (moral) and *ought to want to forgive* (prudential).

  **Cost of the Defence**
  This defence costs the plain diagnosis defender the ability to account for the normative specificity of directed attitudes. By flattening relational norms into prudential weights, they cannot explain why failing to forgive a partner feels like a betrayal of the relationship itself, whereas failing to forgive a contractor feels merely like a business decision. They lose the distinction between internal relational norms and external consequences, rendering the "directed" nature of the attitude philosophically inert.

  **Definite Position**
  The case succeeds. It favors the **Target-Sensitive View**. I would bet on this side because the plain diagnosis fails to capture the phenomenology and normative structure of directed attitudes like forgiveness, which are inherently relational. When the reason bears on the relationship that constitutively grounds the attitude (as with the co-founder), it functions as a fittingness condition, not merely a pragmatic incentive. The deflationary view is too coarse to distinguish between relational repair and instrumental gain, and the plain diagnosis incorrectly treats all non-merit reasons as external. The asymmetry in the case is real, not stipulated, and only the Target-Sensitive View explains it without collapsing the distinction.
