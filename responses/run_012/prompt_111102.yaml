answer: |-
  # HANDOUT: Mapping the Futarchy Debate
  **Seminar:** Democratic Theory | **Topic:** Governance by Prediction Market

  You left last week's session talking past each other because "Futarchy" isn't one idea—it's a family of distinct institutional designs. Some are democratic, some are plutocratic, and some are logically incoherent.

  This decision tree sorts the positions based on **institutional mechanics**, not whether you "trust markets." Answer the questions in order to find which position you actually hold.

  ***

  ## THE DECISION TREE

  **1. When the market price conflicts with the elected leader's judgment, whose preference becomes law?**
  *   **The Leader's:** (Go to 2)
  *   **The Market's:** (Go to 3)

  **2. If the Leader decides, what role does the market play?**
  *   **Public Information:** Voters use market prices like a CBO score to decide how to vote.
      *   → *Leaf A: Instrumental Democracy*
  *   **Expert Input:** Leaders use prices internally to choose between policy options.
      *   → *Leaf B: Technocratic Advisory*

  **3. If the Market decides, who writes the definition of "success" (the metric) it is maximizing?**
  *   **The Market Itself:** The market bets on what the goal should be *and* how to get there.
      *   → *Leaf C: The Infinite Regress (Empty)*
  *   **A Prior Vote:** Citizens vote once to fix the metric (e.g., "Maximize GDP"), then the market picks the policy.
      *   (Go to 4)

  **4. In the market, does a billionaire's bet count more than a student's?**
  *   **Yes (Capital-Weighted):** Influence is proportional to money wagered.
      *   (Go to 5)
  *   **No (Person-Weighted):** Every citizen gets an equal betting endowment or vote-weight.
      *   (Go to 6)

  **5. If capital weights the bets, why is this binding on everyone?**
  *   **Because it Works:** Legitimacy comes from a track record of good outcomes.
      *   → *Leaf D: Consequentialist Futarchy*
  *   **Because We Consented:** Legitimacy comes from a prior democratic vote to adopt the system.
      *   → *Leaf E: Constitutional Futarchy*

  **6. If people are weighted equally, how do we stop them from betting recklessly?**
  *   **Subsidized Losses:** The government pays out winnings but absorbs losses to encourage truth-telling.
      *   → *Leaf F: Civic Market Futarchy*
  *   **Open Wagering:** Citizens bet their own money, but limits are placed on position sizes.
      *   → *Leaf G: Manipulation-Vulnerable Futarchy (Empty/Unattractive)*

  **7. (For all Binding Markets) Can the metric be measured and paid out within a human lifetime?**
  *   **Yes:** (Leaves D, E, F above)
  *   **No:** The metric is long-term (e.g., "CO2 levels in 2100").
      *   → *Leaf H: The Long-Term Mirage (Empty)*

  **8. If the Leader promises to follow the market but retains a veto, is the promise binding on successors?**
  *   **Yes:** (Counts as "The Market's" in Q1)
  *   **No:** A future leader can ignore the price.
      *   → *Leaf I: The Credible Commitment Collapse*

  ***

  ## THE POSITIONS (LEAVES)

  **Leaf A: Instrumental Democracy**
  *   **Position:** Markets are just data; voters remain the deciders.
  *   **Awkward Commitment:** Voters often ignore data that contradicts their partisan identity, rendering the market useless.

  **Leaf B: Technocratic Advisory**
  *   **Position:** Markets inform unelected experts or bureaucrats who make the final call.
  *   **Awkward Commitment:** Experts can "cherry-pick" which market metrics to show the public to justify pre-determined choices.

  **Leaf C: The Infinite Regress (Empty)**
  *   **Position:** The market decides the policy *and* the goal metric.
  *   **Why Empty:** **Incoherent.** You need a fixed goal to price a policy; you can't price the goal without a meta-goal.

  **Leaf D: Consequentialist Futarchy**
  *   **Position:** Markets rule because they produce better GDP/health outcomes than voting.
  *   **Awkward Commitment:** If the market produces growth via tyranny, you must accept the tyranny to remain consistent.

  **Leaf E: Constitutional Futarchy**
  *   **Position:** We democratically vote to bind ourselves to the market's decisions.
  *   **Awkward Commitment:** A vote taken today binds future generations who cannot vote to undo the system.

  **Leaf F: Civic Market Futarchy**
  *   **Position:** Markets rule, but betting power is distributed equally to preserve political equality.
  *   **Awkward Commitment:** Requires massive taxpayer subsidies to pay winners, since "truth-telling" often costs money.

  **Leaf G: Manipulation-Vulnerable Futarchy (Empty)**
  *   **Position:** Equal-weight betting without subsidies or strict limits.
  *   **Why Empty:** **Unattractive.** Wealthy actors can easily bribe small traders to distort prices, breaking the information aggregation.

  **Leaf H: The Long-Term Mirage (Empty)**
  *   **Position:** Markets decide policy based on outcomes 50+ years in the future.
  *   **Why Empty:** **Infeasible.** No trader lives to collect the payout, so no one has an incentive to bet honestly.

  **Leaf I: The Credible Commitment Collapse**
  *   **Position:** Leaders say they will follow the market, but keep the legal right to ignore it.
  *   **Awkward Commitment:** **Collapse.** If traders know the leader can veto losing bets, the market price stops predicting reality and starts predicting the leader's mood.

  ***

  ## WHERE THE TREE BREAKS (Collapses & Ambiguities)

  You noted in seminar that some distinctions might not matter in practice. You were right.

  **1. The "Advise vs. Decide" Collapse**
  *   **The Issue:** Question 1 separates "Advisory" from "Binding." But if a Leader *credibly commits* to always following the market price, the system functions identically to Binding Futarchy.
  *   **The Catch:** As seen in **Leaf I**, if the commitment isn't legally binding on successors, traders will anticipate the veto. This distorts the price, turning a "Binding in spirit" system back into an "Advisory" one. You cannot have it both ways.

  **2. The "Values vs. Beliefs" Blur**
  *   **The Issue:** Futarchy claims markets only aggregate *beliefs* (what will happen), while voters aggregate *values* (what is good).
  *   **The Catch:** In **Leaf D & E**, the metric (e.g., GDP) is a value judgment. If the market optimizes GDP, it is implicitly valuing economic output over leisure or equality. The market *is* making value judgments, just one step removed.

  **3. The "Measurement" Bottleneck**
  *   **The Issue:** Question 7 separates feasible from infeasible metrics.
  *   **The Catch:** Most important political goods (justice, freedom, stability) are hard to measure. If you restrict Futarchy only to easily measured metrics (GDP, crime rates), you may optimize for things that are easy to count rather than things that matter.

  ***

  **Discussion Prompt:** *Look at your leaf. Are you willing to accept the "Awkward Commitment" listed there? If not, which branch of the tree would you prune?*
