answer: |-
  ### 1. Exam Question

  **Essay Question (90 Minutes)**

  Consider a modern coin acceptor installed in vending machines worldwide. Unlike standard detectors, its firmware uses a bandit algorithm to re-tune acceptance thresholds nightly, maximizing revenue. Over a year, it drifts into accepting arcade tokens, bottle caps, and a specific brand of washer. The engineer can no longer identify which internal state corresponds to which object, and no one intended it to accept washers. Structurally, the state functions like the classic two-bitser's state (a functional state in a control loop), but the tuning is blind, driven by reward signals rather than design intentions.

  Evaluate the following distinction proposed to handle such cases: **Borrowed Aboutness** (a state means whatever some mind's intentions or interpretations make it mean) versus **Built Aboutness** (a state's meaning is fixed by its own counterfactual sensitivity plus an unowned selection-or-optimization history).

  In your essay, you must:
  1.  State a clear criterion for distinguishing original from derived intentionality.
  2.  Apply this criterion to three cases: the classic two-bitser, the frog's fly detector, and the drift-tuned acceptor described above.
  3.  Evaluate whether the Borrowed/Built distinction is stable or collapses into the standard debate between the view that intentionality requires consciousness and the view that it is stance-relative.
  4.  Explain what follows if your criterion cannot decide the drift case: does this undermine the consciousness requirement, threaten the stance view with excessive relativity, or reveal the dispute as merely verbal?
  5.  Conclude with one line on what specific evidence or argument would actually change your mind.

  ***

  ### 2. Model Answer

  To distinguish original from derived intentionality, we must look not at the presence of a mind, but at the history of selection that fixed the function of the state. My criterion is this: intentionality is original when the content of a state is fixed by a selection history that operates independently of any interpreter's current ascription; it is derived when the content depends entirely on the intentions of a designer or user. This focuses on etiology rather than ontology.

  Applying this to the classic two-bitser, the intentionality is derived. The machine's states mean "quarter" only because engineers designed them to detect quarters. There is no independent selection history; if the engineers had wired it differently, the state would mean something else. The content is borrowed from the designer's mind.

  The frog's fly detector, however, exhibits original intentionality under this criterion. Evolution selected for neurons that fired at small, dark, moving specks because catching flies aided survival. This selection history is unowned; no mind intended the neuron to mean "fly" specifically, yet the function is fixed by natural history. The content is built into the system via evolutionary pressure.

  The drift-tuned acceptor is the critical test. It has no designer intent for washers, yet it has an optimization history. The algorithm selected states that maximized revenue, regardless of the object's identity. Under my criterion, this is Built Aboutness. The content is fixed by the reward signal history, not by the engineer's mind. The system is sensitive to washers because accepting them was selected for, even if blindly. This suggests the Borrowed/Built distinction is stable. It does not collapse into the standard debate because it allows for original intentionality without consciousness (unlike the consciousness requirement) while avoiding pure interpretive relativity (unlike the stance view). It grounds meaning in objective historical facts about selection.

  However, if this criterion cannot decide the drift case—if we feel unsure whether revenue optimization counts as a proper selection history—it reveals a crack in the consciousness requirement. If blind optimization yields aboutness, then minds are not necessary for original intentionality. This undermines the view that only conscious systems possess genuine content. Conversely, if we deny the drift case has content, we risk making the stance view too powerful: if we must interpret the revenue signal to give it meaning, then meaning is hostage to the interpreter, not the system. The most likely conclusion is that the dispute is partially verbal. Both sides agree on the physical facts but disagree on whether "original" requires biology or merely teleology.

  If the drift case remains indeterminate, it suggests we lack a theory of how selection histories translate into specific content. We need to know when a reward signal is specific enough to fix meaning. Until then, we are drawing lines in the sand rather than finding joints in nature.

  Neurological evidence showing error-correction mechanisms tied specifically to washer-rejection would move me.

  ***

  ### 3. Marking Scheme (20 Marks Total)

  **Part A: Must-Hit Points (5 points × 3 marks = 15 marks)**

  1.  **Two-bitser Classification:** Correctly classifies the two-bitser as Derived/Borrowed based on designer intent.
      *   *Common Failure:* Students claim the two-bitser has original intentionality because it functions reliably.
  2.  **Frog Classification:** Correctly classifies the frog as Original/Built based on evolutionary history.
      *   *Common Failure:* Students argue the frog has no intentionality because it lacks consciousness.
  3.  **Drift Acceptor Classification:** Takes a definitive stance on the drift case (Original or Derived) justified by the stated criterion.
      *   *Common Failure:* Students hedge or say "it depends" without explaining what it depends on.
  4.  **Distinction Stability:** Explicitly evaluates whether Borrowed/Built collapses into the standard consciousness vs. stance debate.
      *   *Common Failure:* Students simply describe the debate without assessing the stability of the new distinction.
  5.  **Implications & Evidence:** Addresses what indeterminacy implies (consciousness view, stance view, or verbal) and provides a specific closing evidence condition.
      *   *Common Failure:* Students give a vague closing like "more research is needed" without specifying the evidence.

  **Part B: Criterion Formulation and Consistency (5 marks)**

  *   **5 marks:** Criterion is explicitly stated, clear, and applied consistently across all three cases without contradiction.
  *   **3-4 marks:** Criterion is stated but application wavers (e.g., treats evolution and algorithmic tuning differently without justification).
  *   **1-2 marks:** Criterion is vague, implied, or abandoned halfway through the essay.
  *   **0 marks:** No clear criterion offered.

  **A vs. B Distinction:**
  An A answer uses the criterion to drive the analysis of the drift case, whereas a B answer merely applies the criterion to the standard cases and treats the drift case as an afterthought.
