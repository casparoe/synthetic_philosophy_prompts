answer: |-
  The split presupposes that individual judgment is sufficiently reliable and errors sufficiently corrigible to tolerate unilateral action, but the aggregation theory cannot fully justify the boundary because correlated errors weaken the case for autonomy everywhere, implying the real distinction rests on irreversibility and externalized harm rather than statistical independence.

  The default autonomy presupposes that the costs of coordination outweigh the expected harm of error, a calculation that relies on a model where individual errors are independent and self-correcting through post-hoc criticism. It treats epistemic errors as internalized costs (wasted time, reputation) rather than externalized harms. The exceptions presuppose not just irreversibility, but that error is neither independent nor corrigible post-hoc; a pathogen release or human rights violation cannot be "replicated away." Strictly required by the practice is only that the expected utility of prior review exceeds its friction cost in specific domains; the aggregation theory merely fits this pattern but is not strictly required. The split is underdetermined between three incompatible theories: (1) the aggregation model (unilateralist's curse), (2) an externality model (harm to others vs. self), and (3) a liability model (who bears the cost of failure). All three license the same split without agreeing on the nature of individual judgment.

  If the aggregation worry were adopted as a general principle, prior review would become universal, drastically reducing research throughput and shifting the burden of proof from critics to proposers across all fields. This would treat all knowledge production as potentially catastrophic, ignoring the distinction between epistemic risk and physical risk. Regarding the wrinkle: correlated errors within a community weaken the justification for default autonomy because the self-correcting mechanism fails when paradigms are shared. However, correlation does not automatically strengthen the case for prior review unless the review committee is structurally independent of the shared paradigm; if reviewers share the same biases, prior review adds friction without reducing systemic risk. Thus, correlation strengthens the case for *diverse* review, not necessarily review itself, and exposes the default autonomy as riskier than the independent-error model suggests.
