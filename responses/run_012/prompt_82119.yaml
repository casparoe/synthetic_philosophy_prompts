answer: |-
  **Study Protocol 89-B: The Global Ignition Assessment**
  **Patient Information Sheet for Families**

  **1. What does the Ignition Device measure?**
  The device measures neural integration. Specifically, it detects when sensory information is broadcast from specialized brain regions to the global workspace. When ignition occurs, information becomes available to multiple cognitive systems simultaneously. This broadcasting is the functional signature of awareness.

  **2. Does ignition mean my mother is conscious?**
  Yes. In the context of this study, consciousness is defined by the capacity for global availability. If the device detects ignition, your mother's brain is processing information in a way that allows for reportability.¹ She is cognitively present.

  **3. But she cannot speak or move. How is that "reportable"?**
  Reportability does not require motor output. It requires that the information *could* be reported were the appropriate pathways intact. The device measures the internal broadcast that precedes speech. If the broadcast is present, the subject is capable of access. If the broadcast is absent, there is no subject to whom the information is available.

  **4. What if the scan is negative?**
  A negative result indicates a lack of global ignition. This suggests that while reflexive processing may continue, there is no central integration of data. In practical terms, this means there is no one home to receive the data. Families often use this information to align care goals with the patient's neurological status. If the brain is not broadcasting, there is no subject to benefit from continued intervention.

  **5. Could she be experiencing things she cannot report?**
  The device is calibrated to detect experience defined as globally available information. Unreportable experience falls outside the operational parameters of the assessment. Therefore, for the purposes of the clinical report, unreportable experience is not the sort of thing that is detected, and consequently not the sort of thing that is present. We treat the functional profile as exhaustive of the mental state.

  > **Boxed Aside: Objection from a Sceptical Ethicist**
  > *Objection:* "Doesn't this ignore the possibility of private, inner qualia that lack global access?"
  > *Clinic Reply:* "Private qualia that lack access are, by definition, invisible to science and irrelevant to care. We prioritize states that can be functionally verified. If a feeling cannot enter the workspace, it cannot influence behavior or memory, and thus holds no clinical significance."

  **6. What about the 'Hard Problem' of consciousness?**
  > **Boxed Aside: Note on Metaphysics**
  > *We acknowledge the philosophical distinction between brain function and subjective feeling. However, this study proceeds on the consensus that functional access is the only measurable proxy for feeling. We treat the correlation as sufficient for clinical decision-making.*

  **7. How do we prepare for the results?**
  We recommend reviewing the glossary below. Understanding the definitions ensures families interpret the data correctly. A positive scan confirms presence. A negative scan confirms absence. There is no middle ground in the workspace model.

  ***

  **Glossary of Terms**

  *   **Consciousness:** The state of having information globally available for report.
  *   **Experience:** Information made globally available for report.
  *   **Report:** The potential for cognitive systems to access and utilize information.
  *   **Subject:** The functional locus of global ignition.

  ***

  *¹ Please note: While ignition is a strong predictor of consciousness, the inference from functional access to phenomenal presence is theoretically contested. However, for the purposes of this protocol, the inference is treated as definitive.*
