prompt: |-
  Ok, help — I need this sorted before Thursday, because I keep getting dragged into the same fight in the corridor and I dont have a good answer.

  'Honesty is the best policy.' Someone in my department says it at least once a week, and it always ends up doing opposite work. Rik (Dutch, philosophy of language, no filter) says it whenever he opens a meeting by telling someone their draft is boring — for him it licenses the bluntness, and if you flinch that's your problem. Same week, Mai, my exchange student from Kyoto, mentions that she told her grandmother the soup was delicious when it wasn't; her flatmate called that a lie and she said it isn't a lie at all, because thats just what you say when someone has cooked for you. (She also says she'd never turn down an invitation to someone's face — it would be like pushing them.)

  So give me the full menu of precise claims that sentence could be making, from the readings that are nearly vacuous to the ones that are substantive and defensible to the ones that are just false. For each: whose good is at stake, what level it's pitched at (the single act, the rule you adopt, the character trait, the shared practice of communication), and whether it's a claim about truth-telling or really about informativeness. Then tell me which reading Rik needs and which one Mai needs, and whether any of them actually settles the soup case. The thing I most want to know: is there a reading that gets you from honesty being good to bluntness being *required* rather than merely permitted? And does the whole question turn on what a lie is — the words, the belief you intend to plant, or what the hearer is entitled to assume given how people in that place actually talk?

  I'd rather have a menu than a verdict, though do give verdicts on the readings. No literature review needed, just the distinctions.
