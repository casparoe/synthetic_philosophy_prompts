answer: |-
  Here is the specification for an adequate theory of multipolar traps (Moloch-type dynamics).

  ### I. Functional Desiderata
  An adequate theory must not merely classify outcomes; it must explain the **mechanism of lock-in**. It must deliver:
  1.  **A Gradient Explanation:** It must explain why agents feel *compelled* to move toward the trap, not just why they end up there. There must be a local incentive gradient that points toward the globally suboptimal state.
  2.  **An Exit Barrier:** It must explain why the system does not spontaneously correct. This requires identifying the cost of unilateral deviation.
  3.  **A Welfare Metric:** It must define the axis along which the "race" occurs (cost, risk, resource depletion) and distinguish this from the axis of *value*.

  ### II. Test Cases (and Why They Are Tests)
  These are not just examples; they are boundary conditions the theory must parse.

  1.  **Prisoner's Dilemma (Static):**
      *   *Why:* The baseline. If the theory cannot recover the PD, it is not a theory of strategic traps.
      *   *Test:* Can it distinguish a one-shot PD from an iterated one where cooperation emerges? The theory must explain why the "trap" label applies to the one-shot but not necessarily the iterated version (shadow of the future).
  2.  **The Dollar Auction (Dynamic Escalation):**
      *   *Why:* Tests time-consistency and sunk costs.
      *   *Test:* The trap is not a static equilibrium but a trajectory. The theory must account for paths where rational agents bid >$1.00. A static Nash analysis fails here; the theory needs dynamic consistency.
  3.  **Antibiotic Resistance (Diffuse Agency + Time Lag):**
      *   *Why:* Tests non-simultaneity and uncoordinated agency.
      *   *Test:* The "agents" (doctors/patients) do not interact directly; they interact through a medium (bacteria) over a delay. The theory must handle traps where the feedback loop is too slow to trigger avoidance behavior.
  4.  **Advertising Wars (Positional Goods):**
      *   *Why:* Tests zero-sum perception vs. negative-sum reality.
      *   *Test:* If advertising merely cancels out (market share remains constant), the spend is pure waste. The theory must distinguish between *growth* races (positive sum) and *positional* races (negative sum).
  5.  **Arms Races (Security Dilemma):**
      *   *Why:* Tests epistemic uncertainty.
      *   *Test:* Agents arm themselves because they fear the other will. The theory must distinguish between a trap caused by *hostile intent* vs. a trap caused by *uncertainty about intent*.

  ### III. Required Distinctions
  The theory cannot collapse the following conceptual pairs.

  1.  **Trap vs. Ordinary Collective Action Problem:**
      *   *Distinction:* A collective action problem is a failure to coordinate on a good. A trap is a **active pull** toward a bad.
      *   *Requirement:* The theory must show that the suboptimal state is *more* stable than the optimal state, not just that the optimal state is hard to reach.
  2.  **Structural vs. Epistemic Trap:**
      *   *Distinction:* Structural = Payoffs force the outcome (even with perfect info). Epistemic = Agents mis-model each other (outcome changes with perfect info).
      *   *Requirement:* The theory must identify cases where perfect information *does not solve the problem*. If info solves it, it's not a Moloch trap; it's a misunderstanding.
  3.  **Race to the Bottom vs. Race to the Top:**
      *   *Distinction:* "Bottom" implies value destruction. "Top" implies value creation (e.g., competitive innovation).
      *   *Requirement:* The theory must define the metric. If the metric is "effort," both look the same. The theory must link the metric to *welfare*. A race to maximize virulence is a race to the bottom for the host, top for the virus. The theory must specify *whose* welfare counts.
  4.  **Pareto-Bad vs. Party-Bad:**
      *   *Distinction:* Pareto-bad = Everyone could be better off. Party-bad = The participants lose, but outsiders might gain (or vice versa).
      *   *Requirement:* A true multipolar trap should generally be Pareto-inferior for the *participating agents*. If the participants are maximizing their utility by destroying the world, that's not a trap; that's preference satisfaction.

  ### IV. Consistency Constraints
  1.  **Game Theoretic Consistency:** The "trapped" state must be robust against unilateral deviation (typically a Nash Equilibrium or Evolutionarily Stable Strategy). If an agent can profitably deviate, the trap is leaky.
  2.  **The Theory of the Second Best:** This is the hard constraint.
      *   *The Constraint:* If one optimality condition (e.g., perfect competition in Market A) is violated, satisfying the other conditions (perfect competition in Market B) **does not necessarily improve welfare**.
      *   *Implication:* The theory cannot claim that "more coordination" or "fixing one incentive" is always the solution. Sometimes, introducing coordination in a sub-system deepens the global trap. This cuts against the casual narrative that "we just need to cooperate."

  ### V. Requirements vs. Camp Prejudices
  Here is where the factions diverge. I am flagging which are necessary and which are tribal markers.

  1.  **"The Outcome Must Be a Nash Equilibrium"**
      *   *Verdict:* **Requirement.**
      *   *Reason:* If it's not a NE, someone has an incentive to leave. If they don't, they aren't rational, or the model is missing a constraint. A trap that isn't stable isn't a trap; it's a transient state.
  2.  **"The Outcome Must Be Pareto-Inefficient"**
      *   *Verdict:* **Prejudice (mostly).**
      *   *Reason:* The "Moloch" crowd insists everyone loses. But many "traps" are distributional. One faction wins, the other loses, but the *conflict* is the trap. Strict Pareto-inefficiency excludes cases where the trap is stable because the *winners* enforce it.
  3.  **"The Outcome Must Be a Stable Attractor"**
      *   *Verdict:* **Requirement.**
      *   *Reason:* This is the dynamic equivalent of Nash. Without stability, the system drifts. A trap implies hysteresis.

  **Incompatible Desiderata Pair:**
  *   **Perfect Rationality** vs. **Systemic Stupidity.**
      *   You cannot have a theory that assumes agents are perfectly rational utility maximizers *and* claims the system behaves "stupidly" without defining the utility function carefully. If the system destroys the agents, either the agents were irrational, or their utility function included self-destruction.
      *   *Resolution:* The theory must treat the *system* as the optimizer, not the agents. The agents are substrates. This conflicts with methodological individualism.

  ### VI. The Killer Requirement
  **The Theory of the Second Best.**

  This is the single requirement that kills the most popular accounts.
  *   *Why:* Most popular discourse on Moloch assumes that "coordination" is the universal solvent. "If we just agreed to stop advertising," "If we just agreed to disarm."
  *   *The Kill:* The Second Best theorem proves that if you have multiple distortions (e.g., externalities + information asymmetry), fixing *one* (e.g., enforcing coordination on advertising) can lower total welfare if the other distortions remain.
  *   *Consequence:* It forbids the simple heuristic: "Identify the race, stop the race." Sometimes stopping the race freezes a worse distortion. A theory that doesn't account for this is just moralizing, not mechanics.

  ### VII. Least Confident Desideratum
  **"The Outcome Must Be Pareto-Inferior for the Participants."**

  *   *Why I'm unsure:* In many real-world "Moloch" scenarios (e.g., corporate competition, evolutionary arms races), there are winners. The "trap" is often that the *cost of winning* rises until the margin vanishes, but someone still wins. If the theory requires *everyone* to be worse off than a baseline, it excludes high-churn competitive markets where firms die but the sector grows.
  *   *What would change my mind:*
      *   **Argument for dropping it:** If I see a robust case where a "trap" persists solely because a *subset* of agents benefits and has the power to maintain the structure, even though the aggregate group loses. (e.g., Lobbying arms races: Lobbyists win, corporations lose, public loses. Is this a Moloch trap for the corporations?)
      *   **Argument for keeping it:** If "Moloch" is defined specifically as *universal* loss (the god that demands everyone sacrifice), then Pareto-inferiority is definitional. If we drop it, the concept merges with standard "rent-seeking" or "exploitation," losing its specific flavor of "we are all driving off the cliff together."
      *   *Decision:* I would drop it if presented with a **Stable Heterogeneous Trap**: A case where Agent Type A benefits from the race, Agent Type B loses, but Agent Type B cannot exit because Agent Type A controls the exit conditions. This preserves the "trap" mechanic without requiring universal loss.
