answer: |-
  You have rediscovered, independently and from two different directions, one of the most significant structural insights of the 20th century. There is no single common noun for it, but there is a precise theoretical framework that describes exactly what you are seeing.

  The structure you have identified is the necessary condition for **open-ended evolution**.

  In the literature, this specific arrangement is best named **Von Neumann's Universal Constructor**, and the philosophical distinction between the two readings of the data is called the **Epistemic Cut** (or **Semantic Closure**).

  Here are the boundaries you asked for: where this concept fits, where its neighbors fail, and why the loop must remain open.

  ### 1. The Closest Match: Von Neumann's Universal Constructor

  In the late 1940s, John von Neumann asked the exact question you are asking: What is the minimum logical structure required for a machine to reproduce itself?

  He quickly realized that a simple "self-printing" loop (a Quine) was insufficient for physical reproduction. If a machine simply reads its own blueprint to build itself, where does the copy of the blueprint come from? If it reads the blueprint to copy the blueprint, it cannot build the machine.

  Von Neumann solved this by proposing a system with three distinct parts:
  1.  **A Constructor:** The machinery that builds things.
  2.  **A Controller:** The logic that tells the constructor what to build.
  3.  **A Description (The Tape):** The blueprint itself.

  Crucially, Von Neumann identified that the **Description** must be used in two fundamentally different ways:
  *   **Interpretively:** The Controller reads the description to instruct the Constructor (building the machine).
  *   **Replicatively:** The description is copied *without* being interpreted, just as raw material, to be attached to the new machine.

  This matches your observation perfectly. In biology, the DNA is the description. The Ribosome/Cell is the Constructor/Controller. The Polymerase is the blind copier. In your compiler, the Source Code is the description. The Compiler Binary is the Constructor. The File System/`cp` command is the blind copier.

  **Where the fit is exact:**
  *   **The Two Readings:** Von Neumann explicitly stated that without separating the *interpretive* use of the description from the *replicative* use, the system cannot evolve. If the copier interprets the data, it creates mutations (errors in fidelity). If the interpreter copies the data, it creates a regress (you need a compiler to compile the compiler).
  *   **The Blind Copier:** Von Neumann's replicator component does not "know" what it is copying. It merely duplicates the tape. This ensures fidelity.
  *   **The Open Loop:** Von Neumann's automaton does not create the *laws of physics* it operates within. It presupposes the medium (the cellular space, or in your case, the hardware/OS).

  ### 2. The Philosophical Name: The Epistemic Cut

  While Von Neumann provided the engineering schematic, the physicist and biologist **Howard Pattee** gave the phenomenon its philosophical name. He called the separation you observed the **Epistemic Cut**.

  Pattee argued that for matter to behave as information (as DNA does, or as source code does), there must be a cut between the **dynamic laws** (physics, chemistry, hardware execution) and the **constraints** (the sequence of bases, the source code text).

  *   **The Dynamic Side:** The machinery (polymerase, CPU). It obeys physical laws blindly.
  *   **The Informatic Side:** The sequence (DNA, Source). It acts as a constraint on those laws.

  Pattee termed the closing of this loop **Semantic Closure**. A system achieves semantic closure when the physical system constructs the very symbols that control the physical system.

  **Why this fits your "Open Loop" observation:**
  Pattee emphasizes that semantic closure is never absolute. There is always a "residue." The symbols (DNA/Code) cannot fully describe the physical context (the Cell/Hardware) required to interpret them. This is why the loop never closes. The interpreter must exist *before* the interpretation can happen. This is why the origin of life and the first self-hosting compiler are both "puzzles"—they require a transition from pure physics to information physics, which cannot be generated from within the information system itself.

  ### 3. Where the Neighbors Stop Fitting

  You asked to distinguish this from self-printing programs, self-referential sentences, and autopoiesis. Here is the boundary map:

  **A. The Quine (Self-Printing Program)**
  *   **The Fit:** A Quine outputs its own source code.
  *   **The Mismatch:** A Quine is a *single* process. It treats its code as data *during execution* to print it. It does not have a separate "blind copier."
  *   **The Consequence:** A Quine cannot evolve. If you change a bit in a Quine's source, it usually breaks. It has no separation between the "copying mechanism" and the "executing mechanism." It is a closed logical loop, not a physical reproductive system. Your compiler system is not a Quine; it is a **Bootstrapping System**.

  **B. The Self-Referential Sentence (Logic)**
  *   **The Fit:** "This sentence is false." It refers to itself.
  *   **The Mismatch:** This is about *truth values*, not *physical replication*. Logic deals with semantics without a necessary physical substrate.
  *   **The Consequence:** Logical self-reference leads to paradox (Gödel, Tarski). Physical self-reference (your structure) leads to *reproduction*. The "blind copier" avoids the paradox by refusing to read the meaning. The copier doesn't care if the sentence is false; it just copies the ink.

  **C. Autopoiesis (Maturana & Varela)**
  *   **The Fit:** A system that produces and maintains itself (like a cell).
  *   **The Mismatch:** Autopoiesis focuses on the *organizational closure* of the network (the metabolism). It is often vague on the *informational* mechanism.
  *   **The Consequence:** You can have an autopoietic system (a flame, a vortex) that does not have a genetic record. Your structure requires a **record** (DNA/Source) that persists *outside* the immediate process. Autopoiesis describes the cell; Von Neumann/Pattee describes the *heredity* within the cell.

  ### 4. Is it One Phenomenon or Three?

  It is **one phenomenon**.

  The structure you have identified is the **Information-Physical Interface**. It is the specific architecture required whenever a system needs to store instructions for its own construction in a way that allows for **variation without loss of function**.

  *   If the copier understands the meaning, it creates **Intelligent Design** (or optimization), which prevents evolution (variation is suppressed).
  *   If the interpreter copies the instructions, it creates **Infinite Regress** (the compiler needs a compiler to compile the compiler).
  *   To get **Evolution**, you must have:
      1.  A passive record (Data).
      2.  An active interpreter (Machine).
      3.  A blind replicator (Copier).
      4.  An external substrate (Hardware/Physics) that is presupposed.

  ### 5. The "Open Loop" and the Presupposition

  You noted: *"Something is always presupposed rather than produced."*

  In computer science, this is the **Trusting Trust** problem (Ken Thompson). You cannot verify the compiler solely by compiling itself, because the binary that does the compiling might be corrupted. You need an external "golden master."

  In biology, this is the **Origin of Life** problem. The ribosome is encoded in DNA, but the DNA is read by the ribosome. Which came first?

  The answer in both fields is **Gradual Materialization**.
  *   **In Compilers:** You don't start with a self-hosting compiler. You start with a compiler written in Assembly, then C, then C++. The "presupposed machinery" shrinks over time, but never vanishes entirely (it bottoms out at the Hardware/OS).
  *   **In Cells:** We likely started with RNA worlds where the molecule was both catalyst and record (no separation). The "Von Neumann structure" (DNA + Protein) evolved later to allow for larger, more stable genomes. The "presupposed machinery" was simpler chemistry.

  ### Summary

  If you need a label to search for further reading, the most precise term is **Von Neumann Self-Replication** with a focus on the **Interpretive/Replicative Distinction**.

  If you want the philosophical boundary, it is **Pattee's Epistemic Cut**.

  If you want to understand why the loop is open, it is because **Information requires a Material Substrate** that it cannot fully describe.

  You are looking at the architecture of **Evolvability**. It is not just that the system copies itself; it is that the system separates the *stability* of the copy (blind replication) from the *function* of the copy (interpretation). That separation is the only thing that allows a child to be like a parent, but not identical; and it is the only thing that allows a compiler to be rewritten in its own language, without vanishing into logic paradoxes.

  It is one phenomenon. It is the physical realization of meaning.
