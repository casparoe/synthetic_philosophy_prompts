      *   *Correction on Assisted Suicide:* This is often framed as "integrity of the medical profession" or "slippery slope to euthanasia of vulnerable," which is a form of systemic harm, not just individual harm.
      *   *Tone Check:* Keep it analytical, not prescriptive. The user asked what the law *assumes*, not what it *should* do.

  6.  **Final Polish:**
      *   Ensure the distinction between *Legal Moralism* and *Paternalism* is clear.
      *   Make sure to answer the "Underdetermined" part specifically.
      *   Highlight the *Lawrence v. Texas* decision as the pivotal moment where the Court rejected pure Moralism for liberty interests, yet statutes remain.

  7.  **Final Output Generation:** (This matches the detailed response provided previously.)
      *   *Key Terms:* Legal Moralism, Harm Principle, Offense Principle, Soft Paternalism.
      *   *Key Thinkers:* Mill, Devlin, Feinberg.
      *   *Key Cases:* *Lawrence*, *Glucksberg*.

  8.  *(Self-Correction during drafting)*: I should make sure to mention that "disgust" itself is sometimes treated as a form of harm in legal theory (psychic harm to observers), though this is controversial. I'll include that under the "Offense Principle."

  9.  *(Final Review against User Prompt)*:
      *   Name the pattern? Yes (Legal Moralism).
      *   What does it presuppose? Yes (State as guardian of moral fabric).
      *   Thinner theory (second-order harms)? Yes (Addressed).
      *   Where is it underdetermined? Yes (Counterfactual analysis).
      *   Internal consistency? Yes (It's a mess).

