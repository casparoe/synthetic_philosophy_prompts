prompt: |-
  I follow politics and law stuff enough to notice a pattern that bugs me, and I want to know if there's a name for what the pattern is committed to.

  Here's the pattern. In most US states it's a crime to have sex with an animal, and a crime to have sex with your adult sibling or your adult parent even when everyone involved is a grownup who consented and nobody gets physically hurt. Same deal with assisted suicide in most places -- illegal, even when the person is terminally ill, lucid, and asking for it, and even though refusing treatment or starving yourself is legal. Dueling is still on the books in some places. Bigamy is illegal even when all the spouses know and are fine with it. But we let people box each other half to death, we let people sell their plasma, we let adults get tattoos and cosmetic surgery and gamble away their savings. We don't prosecute adultery. Nobody raids a house because two consenting adults are doing something gross in it.

  So the law seems to be doing two things at once: it mostly stays out of the business of protecting people from themselves and from each other's private consensual choices, but there's a whole category of stuff it bans anyway, and the only thing the banned stuff seems to have in common is that most people find it disgusting or degrading or beneath human dignity. It's not the harm -- there's no victim in the incest case that the parties aren't also the perpetrator of, and the animal can't complain and in some of these cases isn't even obviously suffering.

  My question: what does this pattern actually presuppose about what the state is allowed to do? I keep hearing "the harm principle" thrown around like it's settled, but the practice doesn't look like the harm principle to me. Does the law's willingness to ban harmless-but-revolting stuff commit it to a real theory -- that society has a shared morality worth enforcing for its own sake, that letting this stuff slide would corrode the social fabric, that some acts are intrinsically degrading regardless of consequences? Or could you explain the whole pattern with something thinner, like second-order harms (normalizing it, slippery slopes, disgust as a proxy for hidden harm)? And which parts of the practice does the theory actually have to carry, versus which parts are just historical accident or inertia that any theory could accommodate?

  Also tell me where it's underdetermined. If I replaced the "society's morality" story with a strict harm-principle story, what concretely has to change in the law -- what gets legalized, what stays, and what new stuff suddenly looks like it should be banned? And is there a version of the practice that's internally consistent, or is it just a mess that several incompatible theories all happen to license? I'm less interested in whether legal moralism is true than in what the actual law is quietly assuming, and whether the assumption is doing any real work or is just decoration on top of politics.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Observation:** The user notices a discrepancy in US law (and Western law generally). Some consensual, "victimless" acts are criminalized (bestiality, incest, assisted suicide, dueling, bigamy), while others are permitted (boxing, selling plasma, tattoos, gambling, adultery).
      *   **Pattern Identification:** The criminalized acts seem to share a quality of being "disgusting," "degrading," or "against human dignity," rather than causing direct harm to non-consenting others.
      *   **Core Question:** What legal/philosophical theory does this pattern presuppose? Is it Legal Moralism? Is it a version of the Harm Principle with "second-order harms"? Or is it just historical inertia?
      *   **Specific Requests:**
          *   Name the pattern/theory.
          *   Explain what the state is assumed to be allowed to do under this pattern.
          *   Contrast Legal Moralism vs. Harm Principle (specifically regarding "second-order harms").
          *   Identify what is "underdetermined" (what would change if we switched theories?).
          *   Assess internal consistency vs. messiness/inertia.
          *   Avoid moralizing on whether it's *right*, focus on what the law is *doing*.

  2.  **Initial Brainstorming & Keyword Association:**
      *   *Harm Principle:* J.S. Mill. State can only interfere to prevent harm to others.
      *   *Legal Moralism:* Lord Devlin, Patrick Devlin. Society has a right to enforce shared morality to prevent disintegration.
      *   *Offense Principle:* Joel Feinberg. Preventing offense/disgust to others.
      *   *Paternalism:* State protecting individuals from themselves (soft vs. hard).
      *   *Specific Cases:* *Lawrence v. Texas* (sodomy), *People v. Jaffe* (incest), *Gonzales v. Oregon* (assisted suicide).
      *   *Concepts:* "Victimless crimes," *malum in se* vs. *malum prohibitum*, social fabric, slippery slope, expressive function of law.

  3.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the acuity of the observation. Name the primary competing theories (Harm Principle vs. Legal Moralism).
      *   **The Dominant Theory (The "Official" Story):** The Harm Principle + Liberalism. Explain why it *looks* like the dominant framework but fails to explain the outliers.
      *   **The Shadow Theory (The "Real" Driver):** Legal Moralism. Define it (Devlin). Explain how it fits the user's examples (incest, bestiality).
      *   **The Hybrid/Compromise:** The Offense Principle & Soft Paternalism. Explain how the law hedges its bets (e.g., boxing is regulated, not banned; suicide is treated differently than assisted suicide).
      *   **Addressing the "Underdetermination" (The Counterfactual):** What happens if we switch strictly to Harm Principle? What gets legalized? What gets banned?
      *   **The Role of Inertia:** Acknowledge that not everything is theoretical; some is just history (common law heritage).
      *   **Conclusion:** Summarize the state of the law (a messy pluralism).

  4.  **Drafting the Content - Section by Section:**

      *   *Naming the Pattern:* The specific term for enforcing morality for its own sake is **Legal Moralism**. The specific tension is between **Liberal Neutrality** (Harm Principle) and **Perfectionism/Moralism**.
      *   *Legal Moralism:* Need to cite Lord Devlin (*The Enforcement of Morals*). The core idea: Society is a community of ideas, not just politics. If the moral bonds loosen, society collapses. Therefore, the state can ban acts that cause "disgust" or violate the "moral fabric," even without direct harm.
      *   *The Harm Principle (Mill):* State the standard. Interference only to prevent harm to others. Note that the US Constitution (substantive due process) leans this way (*Lawrence v. Texas*), but statutes lag behind.
      *   *Reconciling the Outliers (The "Thinner" Explanations):*
          *   *Paternalism:* Assisted suicide (protecting the vulnerable from coercion).
          *   *Institutional Integrity:* Bigamy (messy property/inheritance laws, though this is weakening).
          *   *Second-Order Harms:* Normalization arguments (if we allow X, Y might happen).
          *   *The Offense Principle:* Feinberg. Not just harm, but profound offense.
      *   *The "Underdetermination" Test:*
          *   *If Strict Harm Principle:* Incest (adult), Bestiality (if no cruelty proven), Assisted Suicide, Prostitution, Bigamy (contractual) -> Likely Legalized.
          *   *If Strict Moralism:* Gambling, Drugs, Pornography, potentially Boxing (degrading) -> Likely Banned.
          *   *Current State:* A mix.
      *   *Inertia vs. Theory:* Crucial point. Many laws are Common Law inheritances (Blackstone). Legislators don't sit down and apply Devlin vs. Mill every time; they vote based on constituent disgust. So, it's often "politics as decoration," but the *justification* offered in court often reaches for Moralism or Paternalism.
      *   *Internal Consistency:* It is *not* internally consistent. It's a "doctrinal muddle." The Supreme Court tries to clean it up (e.g., *Lawrence*), but state legislatures keep the old statutes.

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction on Bestiality:* Is it purely moralism? Often tied to animal cruelty statutes. But the user specified "nobody gets physically hurt." I need to address the *consent* aspect of animals (they can't consent), which moves it out of pure "consensual adult" categories into capacity issues.
