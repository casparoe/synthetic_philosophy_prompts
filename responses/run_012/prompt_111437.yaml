answer: |-
  You have identified one of the central tensions in modern jurisprudence. You are correct that the "Harm Principle" (the idea that state power is only justified to prevent harm to others) does not actually describe the current legal landscape, despite being the dominant *rhetoric* of liberal democracy.

  The pattern you are describing has a name: **Legal Moralism.**

  However, the law is not consistently committed to Legal Moralism, nor is it consistently committed to the Harm Principle. It is a hybrid system running on conflicting operating systems. Here is a breakdown of the theories at play, what the law presupposes, where it is underdetermined, and how much of it is just historical inertia.

  ### 1. The Competing Theories

  To understand what the law is assuming, you have to look at the three main frameworks competing for dominance in criminal law theory.

  **A. The Harm Principle (J.S. Mill)**
  *   **Premise:** The only purpose for which power can be rightfully exercised over any member of a civilized community, against his will, is to prevent harm to others.
  *   **Implication:** Consensual adult incest, assisted suicide, and sodomy should be legal. Self-harm (boxing, gambling) should be legal.
  *   **Status:** This is the *constitutional* trend (see *Lawrence v. Texas*, 2003), but not the *statutory* reality in many states.

  **B. Legal Moralism (Lord Devlin)**
  *   **Premise:** Society is a community of ideas, not just a political arrangement. A shared morality is the cement that holds society together. If that morality erodes, society disintegrates. Therefore, the state has a legitimate interest in prohibiting acts that are inherently immoral, even if they cause no tangible harm to non-consenting parties.
  *   **Implication:** This fits your observation perfectly. Incest, bestiality, and bigamy are banned because they violate the "moral fabric" or "human dignity," regardless of consent.
  *   **Status:** This is the *hidden* engine of many state penal codes, though politicians rarely admit it explicitly anymore. They use "harm" language to mask moralistic intentions.

  **C. The Offense Principle (Joel Feinberg)**
  *   **Premise:** A middle ground. The state can prohibit conduct that causes profound offense or disgust to others, even if it doesn't cause physical harm.
  *   **Implication:** This explains why you can't have sex in public (offense to observers) but theoretically allows it in private. However, some laws (like bestiality) are banned even when no one sees them, suggesting this principle isn't the whole story.

  ### 2. What the Pattern Presupposes

  When the law bans consensual, "victimless" acts like incest or dueling, it is presupposing **Perfectionism** or **Strong Paternalism** mixed with Moralism.

  It assumes the state is not merely a referee ensuring fair play (the Liberal/Neutral view), but a **guardian of human flourishing.** Under this view, there are certain ways of living that are "beneath" human dignity. By engaging in them, you degrade not just yourself, but the status of humanity itself.

  *   **Incest:** The presupposition is that the family unit has a sacred structure. Violating it corrupts the institution of the family, which is a foundational building block of the state.
  *   **Assisted Suicide:** The presupposition is that life is an intrinsic good that the state has an interest in preserving, and that allowing doctors to kill patients corrupts the medical profession's role as healers.
  *   **Dueling:** The presupposition is that the state holds a monopoly on violence and honor. Private vengeance undermines the state's authority, regardless of consent.
  *   **Bestiality:** The presupposition is often a mix of animal welfare (harm) and Moralism (the act is inherently degrading to the human participant).

  ### 3. The "Thinner" Explanations (Second-Order Harms)

  You asked if this could be explained by "second-order harms" (normalizing, slippery slopes) rather than pure moralism. Legislators and courts often use these arguments to dress up Moralism in the clothing of the Harm Principle.

  *   **The Slippery Slope:** "If we allow assisted suicide for the lucidly terminally ill, eventually we will coerce the elderly or depressed into suicide." (This is the *Glucksberg* argument).
  *   **Institutional Integrity:** "If we allow bigamy, the legal system of property, inheritance, and custody becomes unadministrable."
  *   **Coercion Risks:** "If we allow incest, we cannot reliably distinguish between consensual adult incest and grooming/abuse that started when one party was a minor."

  **Do these explanations hold water?**
  Philosophically, often no. A strict Harm Principle advocate would argue you should ban the *coercion*, not the *act*. You can ban forced suicide without banning assisted suicide. You can ban child abuse without banning adult incest.
  However, **legally**, courts often accept these second-order harms as sufficient justification. They grant the legislature "deference" to draw bright lines, even if those lines ban harmless conduct to prevent *potential* harmful conduct elsewhere.

  ### 4. Where is it Underdetermined? (The Counterfactual)

  If we swapped the current "muddled" system for a **Strict Harm Principle** system, here is what would concretely change:

  **What gets Legalized:**
  1.  **Consensual Adult Incest:** (Specifically where reproduction is impossible, e.g., same-sex or sterilized).
  2.  **Assisted Suicide:** For competent, terminally ill adults.
  3.  **Prostitution:** (Already legal in some jurisdictions, but banned in most despite being consensual exchange).
  4.  **Bigamy/Polyamory:** If structured as contractual cohabitation without fraud against the state (marriage licenses).
  5.  **Bestiality:** (Strictly speaking, if animal welfare laws covered cruelty, "non-harmful" sexual contact would be legal, though this is the hardest pill for most to swallow due to the consent capacity of animals).

  **What gets Banned (that is currently legal):**
  1.  **Extreme Violence:** If the principle is "human dignity," boxing and MMA could be argued as degrading and physically damaging, thus subject to ban.
  2.  **Exploitative Contracts:** Selling plasma or signing away all future rights in an employment contract might be banned under "anti-degradation" principles.
  3.  **Drug Use:** Hard drugs are often legal-ish (decriminalized) or treated as health issues, but a Moralistic framework would criminalize them vigorously as "vice."

  **What stays the same:**
  1.  **Fraud/Force:** Obviously.
  2.  **Public Conduct:** The Offense Principle keeps public sex/drug use banned.

  ### 5. Is it Internally Consistent or Just a Mess?

  It is **mostly a mess**, characterized by **historical inertia** and **doctrinal lag.**

  **Historical Inertia:**
  Many of these laws (incest, sodomy, dueling, bestiality) come from English Common Law and Canon Law. They were codified in the 19th century when Legal Moralism was the undisputed norm. Legislatures rarely repeal laws unless there is a scandal or a court forces them to. So, the "pattern" you see is often just the fossilized morality of 1850 sitting on top of a 2024 liberal constitution.

  **Doctrinal Lag:**
  The Supreme Court has moved toward the Harm Principle/Liberty model (*Griswold, Roe, Lawrence, Obergefell*), but it moves slowly.
  *   *Lawrence v. Texas* (2003) effectively ruled that "the fact that the governing majority in a State has traditionally viewed a particular practice as immoral is not a sufficient reason for upholding a law." This was a direct rebuke of Legal Moralism.
  *    However, *Lawrence* focused on "liberty interests" rather than establishing a strict Harm Principle. It left room for states to argue "legitimate state interests" (like protecting the family unit) to keep incest bans.

  **The "Decoration" Theory:**
  You asked if the assumption is just decoration on top of politics. **Yes.**
  When a legislator votes to ban incest, they are rarely thinking, "I am enforcing Devlin's theory of social cohesion." They are thinking, "My constituents think this is gross, and I don't want to be the guy who voted for brother-sister sex."
  The *theory* (Moralism) is constructed *post hoc* by lawyers and judges to justify the *political impulse* (disgust).

  ### Summary

  1.  **Name:** The pattern is **Legal Moralism** (specifically, the enforcement of shared morality for the sake of social cohesion).
  2.  **Presupposition:** It presupposes the state is a **moral guardian**, not just a harm-preventer. It assumes some acts are intrinsically degrading.
  3.  **Thinner Explanation:** Courts often use **second-order harms** (slippery slopes, administrative burden) to justify these bans without admitting to Moralism, but these arguments often fail logical scrutiny if applied consistently.
  4.  **Consistency:** The system is **not internally consistent**. It is a palimpsest of 19th-century Moralism, 20th-century Paternalism, and 21st-century Liberalism.
  5.  **Underdetermination:** If you applied the Harm Principle strictly, you would legalize incest, assisted suicide, and prostitution. If you applied Moralism strictly, you might ban boxing, gambling, and extreme body modification. The current law picks and chooses based on **cultural salience**—banning the things that currently trigger the strongest disgust response, while tolerating the things that have become commercially normalized.

  The law isn't assuming one theory. It is assuming **whatever theory justifies the outcome the voters want today.** Currently, that means "Liberty" for tattoos and gambling, but "Morality" for incest and suicide.
