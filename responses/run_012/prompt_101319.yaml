prompt: |-
  So I'm in this philosophy-of-probability reading group and two of us have been going round in circles for months about the reference class problem, and somehow I've been nominated to write the doc we should have produced ages ago. On one side there's Marta, who thinks that when you ask "what's the probability this particular patient responds to the drug," there is a fact of the matter about the right reference class, and it's fixed by the objective structure of the situation -- roughly, the class you get by asking which features of the case are such that intervening on them would shift the outcome distribution. If the outcome wouldn't budge under an intervention, she says, that feature doesn't get to carve the class, full stop. On the other side there's Dev, a card-carrying subjectivist who says probabilities are just degrees of belief, a reference class is just a feature of your evidence partition, and asking which class is "the correct one" is like asking which coordinate system is the correct one -- the only real constraints are coherence and calibration, and any disagreement that survives shared evidence is a disagreement about priors, not about the world. The annoying thing is that they agree on every toy example and still can't stand each other. Our friend Priya has also proposed a rule she's convinced settles it: when several classes are available, always use the narrowest one for which you have at least, say, a hundred cases; if none qualifies, fall back to the broadest. Marta says that's arbitrary, Dev says it's fine as a heuristic but Priya is smuggling in a truth-claim, and neither of them will say what would actually change their mind.

  What I want from you is the joint statement they could both really put their names to. Give me a numbered section of agreed claims -- about what a reference class is, about what the problem is a problem *for*, about whether the same difficulty bites for a Bayesian who only ever conditions on her evidence, about what exchangeability does and doesn't buy you, and about the cases where the two of them do converge. Then a disagreements table: for each genuine disagreement, the exact statement of that side's view in wording that side would accept for itself, plus the crux -- the sub-question such that settling it would actually move at least one of them. For each crux, name a concrete case or argument they'd both agree bears on it, and write down in advance what each of them predicts about that case. And if part of the fight turns out to be verbal -- e.g. if "the correct reference class" is doing different work in Marta's mouth than in Dev's -- say which part and why, but don't cop out by declaring the whole dispute a pseudo-problem. Don't let the agreed-claims section be vacuous (they both already agree a probability is a number between 0 and 1) or slanted (a claim Dev would only sign because it's conveniently ambiguous).

  Some cases we've been chewing on, in case they help you pick tests: (i) the drug one -- 40,000 patients on the drug overall, 6 patients with our patient's exact symptom cluster, and a known-but-imperfect genetic marker that splits the 40,000 into two groups with very different response rates; (ii) a forecasting case where two analysts have literally identical evidence, each has to announce one number for tomorrow's event, and one conditions on "days when the index moved like today" while the other conditions on "days in this month"; (iii) a case where we know the causal graph, and the counterfactual-invariance criterion singles out a class with almost no data in it, so Marta's own rule and Priya's rule point in opposite directions. Add cases if you need them but keep them that concrete, and please don't just tell me one of them is obviously right -- I need the document, not a verdict.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Context:** A philosophy-of-probability reading group. Two members (Marta and Dev) are stuck in a debate about the Reference Class Problem (RCP). The user needs to write a document summarizing their positions, agreements, and disagreements to break the deadlock.
      *   **Characters:**
          *   *Marta:* Objective/Propensity/Causal view. Probability is fixed by the objective structure (specifically, interventionist/causal features). "Correct" reference class exists.
          *   *Dev:* Subjectivist/Bayesian view. Probability is degree of belief. Reference class is an evidence partition. No "correct" class, only coherent/calibrated beliefs.
          *   *Priya:* Pragmatist/Rule-based (Narrowest class with $N \ge 100$). Both Marta and Dev criticize her (Marta: arbitrary; Dev: smuggling truth-claims).
      *   **Task:** Create a "Joint Statement" document.
      *   **Requirements:**
          1.  **Numbered Section of Agreed Claims:** Must cover: definition of reference class, what the problem is a problem *for*, Bayesian conditioning, exchangeability, convergence cases. Must not be vacuous or slanted.
          2.  **Disagreements Table:** For each genuine disagreement: Statement of View (acceptable to that side), The Crux (sub-question settling it moves them), Concrete Case/Argument bearing on it, Predictions (what each expects).
          3.  **Verbal Dispute Analysis:** Identify if "correct reference class" means different things, without dismissing the whole dispute as pseudo.
          4.  **Tone:** Philosophical, precise, neutral, actionable.
          5.  **Cases:** Use the provided cases (Drug, Forecasting, Causal Graph/Data Scarcity) or similar concrete ones.

  2.  **Deconstruct the Positions:**

      *   **Marta (Objectivist/Causal):**
          *   *Core:* Probabilities are properties of the world (propensities/frequencies relative to causal structures).
          *   *Reference Class:* Determined by causal relevance. If intervening on $X$ doesn't change $P(Y)$, $X$ is irrelevant for the class.
          *   *RCP:* A real problem about identifying the *true* causal structure.
          *   *Critique of Priya:* Sample size thresholds don't determine truth.
          *   *Critique of Dev:* Ignoring objective structure leads to bad decisions/calibration in the long run (though Dev might dispute this).

      *   **Dev (Subjectivist/Bayesian):**
          *   *Core:* Probabilities are epistemic states.
          *   *Reference Class:* A choice of how to partition evidence for conditioning.
          *   *RCP:* A problem of model selection/prior specification, not metaphysics.
          *   *Critique of Priya:* Heuristic is fine, but calling it "truth" is a category error.
          *   *Critique of Marta:* "Objective probability" for a single case is metaphysically dubious; we only have evidence.

      *   **The "Agreement" Zone:**
          *   They agree on toy examples (calculations).
          *   They agree probabilities are $[0,1]$.
          *   They likely agree that *using* the wrong class (by either standard) leads to poor predictive performance (calibration).
          *   They likely agree that single-case probability is the target of inquiry.
          *   They likely agree that exchangeability is a mathematical tool, not a metaphysical fix.

      *   **The "Disagreement" Zone:**
          *   Metaphysical status of the class (Mind-independent vs. Mind-dependent).
          *   What settles a dispute when evidence is shared but priors/models differ.
          *   The role of causality vs. correlation in class selection.

  3.  **Drafting the Agreed Claims (Section 1):**
      *   *Goal:* Non-vacuous but signable by both.
      *   *Claim 1 (Definition):* A reference class is a set of past cases used to estimate the probability of a target event for a specific individual/case. (Neutral).
      *   *Claim 2 (The Problem):* The RCP arises because any individual belongs to infinitely many classes, yielding different frequencies/probabilities. (Neutral).
      *   *Claim 3 (Bayesian Conditioning):* For a Bayesian, selecting a reference class is equivalent to choosing which variables to condition on in the likelihood function. (Dev likes this, Marta can accept it as a description of the *procedure* even if she thinks the *justification* is causal).
      *   *Claim 4 (Exchangeability):* De Finetti's theorem allows representing beliefs as mixtures of frequencies, but assuming exchangeability itself requires a judgment about which similarities matter. (Crucial nuance: Exchangeability doesn't solve the selection problem).
      *   *Claim 5 (Convergence):* In the limit of infinite data, if the causal structure is stable, both approaches often converge on the same numerical estimates, provided the subjectivist's model isn't dogmatically closed to the causal features. (Stronger than "they agree on numbers").
      *   *Claim 6 (Pragmatics):* Both agree that for decision-making, one must commit to a single number, and arbitrary oscillation between classes is practically paralyzing.

  4.  **Drafting the Disagreements Table (Section 2):**
      *   *Need:* Specific claims, cruxes, cases, predictions.
      *   *Disagreement 1: Metaphysical Status.*
          *   Marta: There is a fact of the matter.
          *   Dev: It's a modeling choice.
          *   Crux: Does the world dictate the partition, or does the agent?
          *   Case: The Causal Graph/Data Scarcity case (Case iii).
      *   *Disagreement 2: The Role of Sample Size.*
          *   Marta: Truth trumps sample size (better to be precise and uncertain than confident and wrong).
          *   Dev: Precision (variance) matters for decision utility; a wide credible interval from a narrow class might be less useful than a narrow interval from a broad class.
          *   Case: The Drug Case (Case i). 6 patients vs 40,000.
      *   *Disagreement 3: Disagreement with Shared Evidence.*
          *   Marta: If we share evidence and disagree, one of us is failing to track the objective structure.
          *   Dev: We can share evidence and have different priors/models; both are rational.
          *   Case: The Forecasting Case (Case ii).

  5.  **Drafting the Verbal Dispute Analysis (Section 3):**
      *   Identify where "Probability" and "Reference Class" shift meaning.
      *   Marta uses "Probability" = Propensity/Chance. Dev uses "Probability" = Credence.
      *   However, it's not *just* verbal because it affects how they handle new evidence (updating rules vs. structural discovery).
      *   Address Priya's rule here: It's a decision rule, masquerading as an epistemic rule.

  6.  **Refining and Polishing:**
      *   *Check Constraints:* Did I avoid vacuous claims? Yes. Did I use the specific cases? Yes. Is the tone right? Needs to be formal but clear.
      *   *Marta's nuance:* Ensure her view isn't just "frequencies" but "interventionist/causal frequencies."
      *   *Dev's nuance:* Ensure he isn't just "anything goes" but "constrained by coherence and evidence."
      *   *Priya:* Acknowledge her rule as a focal point of contention.
      *   *Formatting:* Use clear headings, numbered lists, and a table for disagreements.

  7.  **Self-Correction/Review during drafting:**
      *   *Initial thought:* Maybe say they agree on calibration.
      *   *Correction:* Marta thinks calibration is a test of truth. Dev thinks it's a constraint on rationality. Phrasing needs to reflect that distinction. "Both agree that systematic miscalibration indicates a defect, though they diagnose the defect differently."
      *   *Initial thought:* Use the "Sunrise Problem" as a case.
      *   *Correction:* No, stick to the prompt's suggested cases (Drug, Forecasting, Causal/Data) as they are more specific to the RCP context.
      *   *Check:* Did I address Priya? Yes, she needs to be mentioned in the context of the disagreements (specifically regarding sample size vs. truth).
      *   *Check:* Is the "Verbal Dispute" section too dismissive? Ensure I emphasize that the verbal difference tracks a substantive methodological divergence.

  8.  **Final Polish:** Check against the "numbered section of agreed claims" requirement. Make sure it's not just 1-5 but covers the specific topics requested (what RCP is for, Bayesian conditioning, exchangeability, convergence).

      *(Self-Correction on Agreed Claims)*: Make sure Claim 3 about Bayesian conditioning is acceptable to Marta. She might say "Conditioning is the mechanism, but the *variables* chosen must be causally relevant." I will phrase it as "Conditioning is the *formal operation* used to incorporate class data."

      *(Self-Correction on Disagreements)*: Ensure the "Predictions" column is distinct. Marta predicts the narrow causal class will predict better *in principle* (even if high variance), Dev predicts the class that minimizes expected loss (balancing bias/variance) is rational.

      *(Final Review of Prompt Requirements)*:
      - Numbered section of agreed claims? Yes.
      - Disagreements table (View, Crux, Case, Predictions)? Yes.
      - Verbal dispute analysis? Yes.
      - Use specific cases (Drug, Forecasting, Causal/Scarcity)? Yes.
      - No vacuous claims? Yes.
      - No verdict? Yes.

