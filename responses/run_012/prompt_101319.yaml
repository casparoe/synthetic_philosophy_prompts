answer: |-
  # JOINT STATEMENT ON THE REFERENCE CLASS PROBLEM
  **Prepared for:** The Philosophy of Probability Reading Group
  **Authors:** Marta [Objectivist/Causal], Dev [Subjectivist/Bayesian]
  **Facilitator:** [User Name]
  **Date:** October 26, 2023

  ## 1. AGREED CLAIMS
  *The following propositions represent the common ground upon which both parties base their divergent interpretations. Neither party signs this to concede the other's metaphysical framework, but to acknowledge the structural constraints of the debate.*

  1.  **Definition of the Reference Class:** A reference class is a set of past occurrences or cases selected to estimate the probability of a specific attribute (the *target*) for a specific individual or event (the *focus*). The Reference Class Problem (RCP) arises because the focus individual belongs to infinitely many such classes, which yield divergent frequency estimates.
  2.  **The Target of Inquiry:** Both parties agree that the immediate practical goal is to assign a single probability value (or distribution) to a **single-case event** (e.g., *this* patient's recovery, *tomorrow's* market move). The RCP is a problem *for* single-case probability assignment, not merely for general law formation.
  3.  **Bayesian Conditioning:** For a Bayesian agent, selecting a reference class is formally equivalent to choosing the partition of evidence on which to condition. If an agent conditions on class $C$, they are asserting $P(Event | Evidence \in C)$. Both parties agree that failing to condition on known, relevant evidence violates the principles of probabilistic coherence (for Dev) or ignores objective relevance (for Marta).
  4.  **Exchangeability:** Both parties agree that assuming exchangeability (that the order of cases does not matter) is a necessary mathematical step to link frequencies to probabilities. However, both agree that **exchangeability does not solve the RCP**. Judging *which* cases are exchangeable with the focus case *is* the reference class problem restated. De Finetti's representation theorem guarantees a mixture of frequencies exists, but it does not dictate which mixture components correspond to reality.
  5.  **Calibration as a Constraint:** Both parties agree that a probability assignment method that is systematically miscalibrated (e.g., events assigned 70% probability occur only 30% of the time) is defective. Marta views this as evidence that the objective structure was misidentified; Dev views it as evidence that the agent's beliefs are incoherent with their evidence.
  6.  **Convergence in Ideal Conditions:** In cases where the causal structure is fully known and data is abundant, Marta's "interventionist class" and Dev's "evidence-partition class" will typically converge on the same numerical value. The disagreement is not about the arithmetic of the toy examples, but about the justification and the procedure under **scarcity** or **structural uncertainty**.
  7.  **Priya's Rule Status:** Both parties agree that Priya's heuristic ("Narrowest class with $N \ge 100$") is a decision rule for managing uncertainty, not a definition of truth. They disagree on whether this rule should be justified by its truth-tracking ability (Marta) or its decision-theoretic utility (Dev).

  ---

  ## 2. DISAGREEMENTS TABLE
  *This section isolates the genuine points of divergence. For each row, the "View" is phrased so the proponent accepts it as accurate, the "Crux" identifies the specific sub-question that, if settled, would shift the debate, and the "Case" refers to the concrete scenarios provided in our group discussions.*

  | # | Topic | Marta's View (Objectivist/Causal) | Dev's View (Subjectivist/Bayesian) | The Crux (Settling this moves the needle) | Concrete Case & Predictions |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Metaphysical Status** | There is a fact of the matter about which reference class is **correct**. It is determined by the causal structure of the world (specifically, features invariant under intervention). | There is no "correct" class independent of an agent's model. A class is **adequate** if it renders the agent's beliefs coherent and calibrated given their information state. | **Does the world carve nature at joints, or do we?** Is "relevance" a property of the variables (Marta) or a property of the agent's information partition (Dev)? | **Case (iii): Causal Graph vs. Data Scarcity.**<br>*Setup:* Causal model says narrow class is truth, but $N=6$. Broad class has $N=40,000$.<br>**Marta:** The narrow class probability is the *true* chance. The broad class is biased. We must model the uncertainty of the small sample, not switch classes.<br>**Dev:** The narrow class yields a posterior so wide it is decision-theoretically useless. Conditioning on the broad class is rational if it minimizes expected loss, even if "biased" relative to the true graph. |
  | **2** | **Shared Evidence Disagreement** | If two agents share all evidence and disagree on the reference class, at least one is failing to track the objective structure. Rationality requires convergence on the *class*, not just coherence. | If two agents share evidence but have different priors/model structures, they can rationally disagree on the class. There is no "super-evidence" that dictates the partition. | **Is rationality convergent or permissive?** Does ideal rationality force a unique class selection given fixed evidence? | **Case (ii): Forecasting Analysts.**<br>*Setup:* Analyst A uses "days index moved like today." Analyst B uses "days in this month." Evidence is identical.<br>**Marta:** One partition captures the causal drivers of market moves; the other is spurious correlation. One analyst is objectively wrong.<br>**Dev:** Both are valid modeling choices. If both are calibrated over time, both are rational. The disagreement is about prior weight on seasonal vs. momentum factors. |
  | **3** | **The Role of Sample Size** | Sample size affects **confidence** (variance), not **correctness** (bias). A small sample from the true causal class is preferable to a large sample from a causally heterogeneous class. | Sample size affects **utility**. A probability estimate is a tool for action. If a "true" class has too few cases to constrain the posterior, it is pragmatically indistinguishable from noise. | **Bias-Variance Tradeoff:** Is it better to be precisely wrong (broad class) or vaguely right (narrow class)? | **Case (i): The Drug Trial.**<br>*Setup:* 40k total patients. 6 with exact symptom cluster. Genetic marker splits 40k into high/low response.<br>**Marta:** Use the 6 patients (or the genetic marker class). The symptom cluster is causally relevant. The 40k aggregate is misleading.<br>**Dev:** If the 6-patient class yields a 95% credible interval of [0.1, 0.9], using the 40k class (with a tighter interval) may maximize expected utility, provided we adjust the prior for the known heterogeneity. |

  ---

  ## 3. ANALYSIS OF VERBAL AND SUBSTANTIVE DIVIDES

  *We acknowledge that part of our stalemate stems from terminological divergence, but we reject the claim that the dispute is **merely** verbal.*

  ### 3.1 The Meaning of "Probability"
  *   **Marta** uses "probability" to refer to **Chance/Propensity**: a physical property of the setup that exists regardless of whether anyone knows it. For Marta, "The probability is 0.8" means "The setup produces this outcome in 80% of relevantly similar interventions."
  *   **Dev** uses "probability" to refer to **Credence**: a measure of reasonable belief. For Dev, "The probability is 0.8" means "Given my evidence and priors, I would bet at 4:1 odds."
  *   **Why this isn't just verbal:** If it were purely verbal, we would agree on all decisions. We do not. In **Case (iii)** (Causal Graph/Data Scarcity), Marta recommends an action based on the *structure* despite high uncertainty. Dev recommends an action based on the *precision* of the estimate despite potential bias. This leads to different bets.

  ### 3.2 The Meaning of "Correct Reference Class"
  *   **Marta:** "Correct" = **Truth-Tracking**. The class that isolates the invariant causal mechanisms.
  *   **Dev:** "Correct" = **Optimal Coding**. The class that best compresses the evidence for the purpose of prediction.
  *   **The Pivot Point:** Priya's Rule ($N \ge 100$).
      *   Marta objects because Priya treats a sample-size threshold as a **truth-condition**. (A class doesn't become "the real one" just because we found 100 cases).
      *   Dev objects because Priya treats the heuristic as a **moral imperative** rather than a loss-function optimization. (Sometimes $N=50$ is the utility-maximizing cutoff).
      *   **Agreement:** We can both sign onto a modified rule: *"Select the narrowest class that minimizes expected decision loss, accounting for both bias (causal heterogeneity) and variance (sample size)."* We disagree on how to weigh bias vs. variance.

  ### 3.3 What Would Change Our Minds?
  *   **For Marta to move toward Dev:** She would need to see a case where adhering to the "causally correct" class consistently leads to worse decision outcomes than a "causally incorrect" but data-rich class, *even when the causal structure is known*. (i.e., Proof that truth has no decision-value under extreme scarcity).
  *   **For Dev to move toward Marta:** He would need to see a case where two agents with identical priors and evidence, using different reference classes, *both* remain perfectly calibrated forever, yet make systematically different decisions where one clearly outperforms the other due to structural knowledge. (i.e., Proof that coherence allows for systematically suboptimal structural ignorance).

  ---

  ## 4. RECOMMENDED NEXT STEPS FOR THE GROUP
  1.  **Stop debating "What is probability?"** We have localized the disagreement to **model selection under scarcity**.
  2.  **Formalize the Loss Function.** Instead of arguing about "truth," we should specify the cost of a False Positive vs. a False Negative in the Drug Case (i). This forces Marta to quantify the cost of variance and Dev to quantify the cost of bias.
  3.  **Test Priya's Rule.** Run a simulation on the Forecasting Case (ii). Compare the cumulative score of the "Narrowest $N \ge 100$" rule against a "Causal Priority" rule and a "Full Evidence" rule. Let the data speak to the utility, not the metaphysics.
