answer: |-
  ### The Scenario

  **Organism:** The Social Spider (*Anelosimus eximius*).
  **Ecology:** Tropical forest edges in South America. Colonies live in large, communal silk webs that can house thousands of individuals. The webs act as giant capture traps for flying insects.
  **Trait:** **Risky Web Repair.** When storms damage the web, some spiders venture out to the periphery to rebuild silk anchors. This exposes them to high predation risk (birds and wasps) and energy loss. Non-repairers stay in the center, safe and warm.
  **Status Quo:** In nature, colonies are founded by a single fertilized female, so relatedness ($r$) is extremely high. Both accounts predict the spread of Repair behavior.

  ### The Walkthrough

  **The Trait:** High-cost web repair (Altruism).
  **The Selection Pressure:** Storm frequency vs. Predation risk. If the web breaks, the whole colony starves or washes away.

  **1. The Gene-Centered Account (Inclusive Fitness)**
  *   **What is selected:** The *allele* for repair behavior.
  *   **Why:** Because the spider is saving copies of its own genes residing in its sisters. The cost to the individual ($c$) is outweighed by the benefit to the colony ($b$) multiplied by the relatedness ($r$). Since $r \approx 0.9$ (high inbreeding), $rb > c$.
  *   **Mechanism:** Kin selection. The spider isn't saving the group; it's saving its genetic mirror images.

  **2. The Group-Selection Account (Multilevel Selection)**
  *   **What is selected:** The *colony phenotype* (a "repairing colony" vs. a "non-repairing colony").
  *   **Why:** Colonies with enough repairers survive the storm season; colonies without them go extinct. The trait spreads because repairing groups out-reproduce non-repairing groups via fission.
  *   **Mechanism:** Differential group extinction. The individual cost is irrelevant; the group survival is the filter.

  ### The Counterfactual (Where They Peel Apart)

  **The Parameter:** **Immigration of Unrelated Adults.**
  Imagine a environmental shift where forest fragmentation forces unrelated females to join existing colonies to survive the journey (lowering average relatedness, $r$, to near zero), *but* the storm pressure remains high.

  *   **Gene-Level Prediction:** The trait collapses **immediately**. As $r$ approaches zero, $rb < c$. Cheaters (non-repairers) within the colony will out-repair the altruists. The gene for repair is selected against within the group faster than it is selected for between groups. The population becomes selfish.
  *   **Group-Level Prediction:** The trait persists **for several generations**. Even with low $r$, if the variance *between* colonies remains high (some colonies happen to have more repairers than others), the non-repairing colonies will wash away in the next storm. The group trait is stable as long as group extinction is strong enough to counteract within-group cheating, regardless of kinship.

  **The Single Feature Doing the Work:** **The Decoupling of Relatedness and Group Variance.**
  In the natural state, high relatedness *causes* high group variance (families differ from each other). Your character's argument hinges on breaking that link. If unrelated spiders join, Relatedness drops, but Group Variance can remain high (some groups just happen to be braver than others).
  *   **If you remove this feature:** If immigration is random and homogenizes the groups (making all groups identical in bravery), *both* accounts agree the trait dies. The disagreement only exists if you can lower $r$ without lowering Between-Group Variance.

  ### The Losing Side's Rebuttal

  **The Defender of the Gene-Centered View says:**
  > "You're mistaking a proxy for a cause. The only reason your 'Group Variance' exists in the first place is because of genetic assortment. If you calculate the Inclusive Fitness properly, accounting for the population structure, you'll see that 'Group Selection' is just Kin Selection with extra steps. If relatedness is truly zero, your 'Group Variance' is transient noise—it will vanish within one generation because cheaters will invade every group. You aren't predicting a different outcome; you're just describing the same math with slower words."

  ### Confidence Assessment

  **Confidence Level:** **High on the biology, Moderate on the "Disagreement."**

  *   **Why High on Biology:** *Anelosimus eximius* is a real, well-studied organism with the exact social structure described (high inbreeding, communal webs, colony fission). The trade-off between web maintenance and predation is ecologically sound.
  *   **Why Moderate on the Disagreement:** This is the contentious part. Mathematically, the Price Equation demonstrates that Gene-Centered and Group-Selection models are **formally equivalent**. You can translate any Group Selection model into a Kin Selection model and vice-versa without changing the numerical prediction.
      *   *The Risk:* A knowledgeable reader knows that if the math is equivalent, the predictions *should* be identical.
      *   *The Defense:* Your character is arguing about **causal attribution**, not math. The Gene theorist claims $r$ is the *cause*; the Group theorist claims Group Extinction is the *cause*. In practice, this leads to different heuristics for what experiments to run (e.g., "Measure kinship" vs. "Measure group survival rates").
      *   **The Weakest Claim:** The claim that the Group-Selection account predicts the trait will persist for *several generations* with zero relatedness. A hard-line Gene theorist will argue that without relatedness, within-group selection is so strong that group variance collapses instantly, making the Group prediction impossible. Your character should acknowledge this tension: *"The math might map, but the causality tells me where to look when the system breaks."*

  **Recommendation for the Page:** Have your character admit the math is equivalent but insist the **causal story** matters for conservation. "If I'm wrong about it being group selection, and I try to save them by preserving kinship clusters when I should have been preserving group size, the colonies die. I can't afford to be verbally precise while the species goes extinct." This grounds the theoretical debate in stakes.
