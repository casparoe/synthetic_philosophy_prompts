prompt: |-
  I write about science and ideas for a general-interest magazine, and I am midway through a long feature on the way psychiatric categories shape the people they are applied to. My editor has drafted the explainer box that will run alongside the piece, and I want a second opinion before it goes to the fact-checker, because something about it troubles me in a way I cannot quite pin down. Here is the draft.

  Psychiatry sorts people into categories: depression, attention deficit hyperactivity disorder, personality disorder. Ian Hacking's idea of looping effects explains why these categories are made rather than found. When someone is labelled, she becomes aware of the label and her behaviour shifts to fit it; clinicians then revise the category in the light of what they see; the revised category reshapes the next cohort of patients in turn. Hacking calls categories of this sort interactive kinds, as opposed to the indifferent kinds studied by the natural sciences, since quarks, on his account, do not care what physicists say about them. Because the people inside the loop are shaped by the classification, there is no fact of the matter about whether a given patient really has the disorder; what looks like discovery is the settling of a social convention. And since the loop runs in one direction, the label reshaping the patient and the patient then reinforcing the label, diagnosis is self-fulfilling: the more a condition is diagnosed, the more of it there is. That is how multiple personality disorder spread through the 1980s, and how ADHD has spread since.

  What I would like from you is an audit, claim by claim: what is accurate as written, what is defensible but needs a caveat, and what would make a specialist wince. Where the draft has quietly merged two claims that the underlying view keeps apart, or has turned a description into a verdict, say so plainly and explain what turns on the difference. I am especially unsure whether the closing claim about diagnosis spreading a condition follows from anything in the earlier sentences, or is an extra step the argument does not license, and whether the draft is right to treat this as a general truth about psychiatric classification rather than something that holds in particular cases. I would also like to know what a defender of the view would say the box has left out. No bibliography or reading list, please; just tell me what to keep, what to soften, what to cut, and why.
reasoning: |-
  Here's a thinking process that leads to the suggested audit:

  1.  **Analyze the Request:**
      *   **User:** Science/ideas writer for a general-interest magazine.
      *   **Task:** Audit an explainer box draft about Ian Hacking's "looping effects" and psychiatric classification.
      *   **Goal:** Identify accuracy, defensibility (with caveats), and errors (what makes a specialist wince).
      *   **Specific Concerns:**
          *   Does the closing claim (diagnosis spreading a condition) follow from the earlier argument?
          *   Is this treated too much as a general truth vs. specific cases?
          *   What has a defender of the view (Hackingian) say is missing?
          *   Distinguish between description and verdict.
          *   Distinguish between merged claims.
      *   **Constraints:** No bibliography/reading list. Focus on keep/soften/cut and why.

  2.  **Analyze the Draft Text (Sentence by Sentence):**

      *   *Sentence 1:* "Psychiatry sorts people into categories: depression, attention deficit hyperactivity disorder, personality disorder."
          *   *Assessment:* Accurate enough for a general audience.
      *   *Sentence 2:* "Ian Hacking's idea of looping effects explains why these categories are made rather than found."
          *   *Assessment:* "Made rather than found" is a bit strong/reductionist. Hacking argues they are *interactive kinds*, not necessarily *purely* social constructs in the "anything goes" sense, but they aren't natural kinds like quarks. "Made rather than found" implies a binary that Hacking complicates.
      *   *Sentence 3:* "When someone is labelled, she becomes aware of the label and her behaviour shifts to fit it; clinicians then revise the category in the light of what they see; the revised category reshapes the next cohort of patients in turn."
          *   *Assessment:* This is the core mechanism. It's mostly accurate. However, "shifts to fit it" implies conformity. Sometimes people resist the label. It's a feedback loop, but not always a compliant one.
      *   *Sentence 4:* "Hacking calls categories of this sort interactive kinds, as opposed to the indifferent kinds studied by the natural sciences, since quarks, on his account, do not care what physicists say about them."
          *   *Assessment:* Accurate summary of *Interactive vs. Indifferent Kinds*.
      *   *Sentence 5:* "Because the people inside the loop are shaped by the classification, there is no fact of the matter about whether a given patient really has the disorder; what looks like discovery is the settling of a social convention."
          *   *Assessment:* **Major Red Flag.** This is the "verdict" vs. "description" merge. Hacking does *not* necessarily say there is "no fact of the matter." He says the facts change *because* of the classification. It's not just a convention; there is real suffering and real behavior. This leans too hard into social constructionism in a way that erases the reality of the distress.
      *   *Sentence 6:* "And since the loop runs in one direction, the label reshaping the patient and the patient then reinforcing the label, diagnosis is self-fulfilling: the more a condition is diagnosed, the more of it there is."
          *   *Assessment:* **Major Red Flag.** "Runs in one direction" contradicts the definition of a *loop*. A loop is bidirectional/reciprocal. Also, "the more of it there is" is the specific concern the user raised. Does prevalence increase, or does the *kind* of person change? Hacking argues the *kind* changes, not necessarily just the raw count (though counts can rise). The "self-fulfilling" label is tricky; it implies the condition wasn't "real" before.
      *   *Sentence 7:* "That is how multiple personality disorder spread through the 1980s, and how ADHD has spread since."
          *   *Assessment:* Controversial application. MPD (DID) is the classic Hacking example (*Mad Travelers* is about fugue, *Rewriting the Soul* is about MPD). ADHD is often cited by critics, but applying looping effects to explain the *spread* (prevalence) vs. the *experience* is a specific claim. It risks implying the conditions are *only* the result of the loop, ignoring biological or environmental factors.

  3.  **Synthesize the Critique (Drafting the Audit):**

      *   **Structure:**
          1.  Overall Impression (The "Vibe").
          2.  Claim-by-Claim Audit (The "Meat").
          3.  Specific Address of User's Concerns (The "Loop" and "General Truth").
          4.  What's Missing (The "Defender's View").
          5.  Recommendations (Keep/Soft/Cut).

      *   **Key Issues to Highlight:**
          *   *Ontological Status:* The draft implies the disorders aren't real ("no fact of the matter"). Hacking says they are *real but interactive*.
          *   *Directionality:* The draft says the loop runs in "one direction." It's a cycle.
          *   *Prevalence vs. Kind:* The draft says "the more of it there is." Hacking focuses on how the *experience* of the kind changes, not just that there are more of them (though epidemic effects are part of it).
          *   *Agency:* The draft implies passive patients ("shifts to fit it"). Hacking acknowledges resistance and appropriation.
          *   *Generalization:* The draft treats this as universal for psychiatry. Hacking is more nuanced; some aspects are more biological than others.

      *   **Refining the "No Fact of the Matter" point:** This is the biggest philosophical error. Hacking is a "dynamic nominalist." He doesn't deny the pain or the behavior, but he denies that the *category* existed waiting to be found. The draft conflates "category is constructed" with "suffering is conventional."
      *   **Refining the "One Direction" point:** A loop is circular. The draft describes a line: Label -> Patient -> Clinician -> Label. That *is* a loop, but the text says "runs in one direction." That's confusing phrasing. It likely means "unidirectional causality" (label causes behavior), which denies the feedback.
      *   **Refining the "Spread" point:** Does diagnosis cause the condition to spread? Hacking talks about "friction" and "ecological niches." Saying "the more diagnosed, the more there is" is a simplification of "the classification creates a niche for this kind of person to exist."

  4.  **Drafting the Response (incorporating the persona of a helpful, sharp editor/peer):**

      *   *Tone:* Professional, precise, respectful of the writer's expertise, but firm on the philosophical distinctions.
      *   *Formatting:* Use bolding for clarity. Break it down logically.

      *(Self-Correction during drafting)*: I need to make sure I don't get too bogged down in academic philosophy. Keep it relevant to the magazine context. The user asked for an audit.
      *   *Check:* Did I address the "general truth" vs "particular cases" concern? Yes, need to emphasize that looping effects vary in strength.
      *   *Check:* Did I address the "defender's view"? Yes, need to mention that Hacking isn't a debunker.

  5.  **Final Polish:** Review against the prompt's constraints (no bibliography, specific focus on keep/soften/cut). Ensure the distinction between "interactive kinds" and "social constructionism" is clear, as that's where the draft goes off the rails.

      *   *Crucial distinction:* Hacking is not saying "ADHD isn't real." He is saying "The person who has ADHD today is different from the person who had 'hyperactivity' in 1950 because of the concept itself." The draft says "no fact of the matter." That's the kill shot.

  6.  **Final Output Generation** (similar to the provided good response).
answer: |-
  This is a strong draft that captures the spirit of Hacking's work, but your instinct is correct: it overreaches in ways that turn a nuanced philosophical argument into a polemical verdict. A specialist in philosophy of psychiatry or a clinician familiar with Hacking would likely wince at the ontological claims (what is "real") and the mechanics of the loop (directionality and prevalence).

  Here is an audit of the claims, followed by specific recommendations on what to keep, soften, and cut.

  ### Claim-by-Claim Audit

  **1. "Psychiatry sorts people into categories... Ian Hacking's idea of looping effects explains why these categories are made rather than found."**
  *   **Verdict:** Defensible, but needs a caveat.
  *   **Analysis:** "Made rather than found" is a catchy summary of *dynamic nominalism*, but it risks implying arbitrariness. Hacking does not argue that the *distress* is made up, only that the *kind of person* is brought into being alongside the category.
  *   **Risk:** It sets up a false dichotomy between "natural" (found) and "fake" (made).

  **2. "When someone is labelled, she becomes aware of the label and her behaviour shifts to fit it..."**
  *   **Verdict:** Soften.
  *   **Analysis:** This implies passive conformity. Hacking emphasizes that people also *resist*, *appropriate*, or *twist* the label. They don't just fit the mold; they push back against it, which drives the loop.
  *   **Risk:** It removes human agency from the patient.

  **3. "...clinicians then revise the category in the light of what they see; the revised category reshapes the next cohort of patients in turn."**
  *   **Verdict:** Keep.
  *   **Analysis:** This is an accurate description of the feedback mechanism between institution and individual.

  **4. "Hacking calls categories of this sort interactive kinds, as opposed to the indifferent kinds studied by the natural sciences, since quarks, on his account, do not care what physicists say about them."**
  *   **Verdict:** Keep.
  *   **Analysis:** This is the standard, accurate illustration of the interactive/indifferent distinction.

  **5. "Because the people inside the loop are shaped by the classification, there is no fact of the matter about whether a given patient really has the disorder; what looks like discovery is the settling of a social convention."**
  *   **Verdict:** **Cut/Rewrite.** (This is the major philosophical error).
  *   **Analysis:** This is where the draft turns a description into a verdict. Hacking does **not** argue there is "no fact of the matter." He argues that the facts *change* as the classification evolves. A patient really does suffer, and there are real behavioral facts. To say it is merely a "social convention" implies the suffering is illusory or that the diagnosis is *only* political. Hacking is a realist about the suffering, even if he is a nominalist about the category.
  *   **Risk:** This validates the "it's all in your head" stigma. It conflates *social construction of the category* with *construction of the reality*.

  **6. "And since the loop runs in one direction, the label reshaping the patient and the patient then reinforcing the label, diagnosis is self-fulfilling: the more a condition is diagnosed, the more of it there is."**
  *   **Verdict:** **Cut/Rewrite.** (Two errors here).
  *   **Analysis:**
      *   *Directionality:* A loop does not run in "one direction." It is recursive/circular. Saying it runs in one direction contradicts the definition of a loop.
      *   *Prevalence:* "The more of it there is" is a contentious empirical claim. Hacking argues that the *kind of person* changes, not necessarily that the raw prevalence increases solely due to diagnosis. While he discusses "epidemics" (e.g., fugue, MPD), he attributes this to the availability of a cultural niche, not just diagnostic counting. "Self-fulfilling" implies the condition was false to begin with.
  *   **Risk:** It suggests psychiatry creates illness out of thin air, rather than shaping how existing distress is experienced and expressed.

  **7. "That is how multiple personality disorder spread through the 1980s, and how ADHD has spread since."**
  *   **Verdict:** Soften significantly.
  *   **Analysis:** MPD (DID) is Hacking's primary case study, so that fits. ADHD is much more contested in this context. Attributing the spread of ADHD *primarily* to looping effects ignores neurobiological research, environmental changes, and educational shifts. It presents a complex epidemiological trend as a philosophical certainty.
  *   **Risk:** It generalizes a specific philosophical mechanism to complex medical controversies without nuance.

  ### Addressing Your Specific Concerns

  **1. Does the closing claim follow from the earlier sentences?**
  No. The earlier sentences describe a mechanism of *change* (classification alters behavior), but the closing sentence describes a mechanism of *multiplication* (diagnosis increases prevalence). While related, they are not identical. You can have a looping effect where the *nature* of the disorder changes without the *number* of cases exploding. The draft conflates "changing the kind" with "creating more of the kind."

  **2. Is this a general truth or particular to certain cases?**
  The draft treats it as a general truth ("Psychiatry sorts...", "That is how..."). A defender of the view would argue looping effects exist on a spectrum. Some conditions (e.g., severe schizophrenia with prominent biological markers) may have weaker looping effects than others (e.g., personality disorders or culturally specific syndromes). Treating it as a universal law of psychiatry makes the argument vulnerable to easy rebuttal.

  **3. What has a defender of the view say is left out?**
  A Hackingian would say you have omitted the **reality of the suffering**. By focusing on the "convention" and the "self-fulfilling" nature, the box implies the problem is the *label*, not the *life*. Hacking's point is usually more humane: the label becomes a tool people use to make sense of their pain, which then alters the pain. The draft makes it sound like a trick played by clinicians upon patients. It also omits **resistance**: people fight the labels, which is often what drives the revision of the category.

  ### Recommendations: Keep, Soften, Cut

  **KEEP:**
  *   The definition of "interactive kinds" vs. "indifferent kinds" (the quark analogy is perfect).
  *   The basic mechanism: Label $\rightarrow$ Awareness $\rightarrow$ Behavior Change $\rightarrow$ Category Revision.
  *   The reference to Multiple Personality Disorder as a historical example (this is Hacking's own primary example).

  **SOFTEN:**
  *   **"Made rather than found":** Change to "categories that evolve through use rather than waiting to be discovered." This preserves the dynamic nature without implying they are fake.
  *   **"Behaviour shifts to fit it":** Change to "behaviour and self-understanding shift in relation to it." This allows for resistance or modification, not just conformity.
  *   **The ADHD example:** Qualify this. "Some argue this helps explain the rise in..." rather than "That is how... spread."
  *   **Generalization:** Acknowledge that this applies more strongly to some conditions than others.

  **CUT/REWRITE:**
  *   **"There is no fact of the matter...":** This must go. Replace with: "This means the boundary between the disorder and the person is porous; the classification changes the very thing it classifies."
  *   **"Settling of a social convention":** Replace with "a dynamic interaction between medical knowledge and human experience."
  *   **"Loop runs in one direction":** Change to "loop is recursive."
  *   **"The more a condition is diagnosed, the more of it there is":** This is too reductive. Replace with: "as the category becomes available, it creates a niche for new ways of being a person."
  *   **"Diagnosis is self-fulfilling":** This carries too much baggage implying fraud. Use "co-constitutive" or simply explain the effect without the label.

  ### Suggested Revision (for your consideration)

  > Psychiatry sorts people into categories: depression, attention deficit hyperactivity disorder, personality disorder. Ian Hacking's idea of **looping effects** suggests these categories are not merely discovered, but evolve through use. When someone is labelled, they become aware of the classification and their self-understanding shifts in response; clinicians then revise the category in the light of what they see, which reshapes the next cohort of patients. Hacking calls these **interactive kinds**, as opposed to the **indifferent kinds** studied by the natural sciences: quarks do not care what physicists say about them, but people do. Because the people inside the loop are shaped by the classification, the boundary between the disorder and the person is porous. What looks like a static diagnosis is often a moving target, shifting as the classification interacts with human experience. In some cases, as a category becomes culturally available, it creates a niche for new ways of being a person. Hacking points to the spread of multiple personality disorder in the 1980s as a prime example; critics and supporters debate the extent to which similar dynamics apply to modern rises in ADHD diagnoses.

  **Why this works:** It retains the core philosophical insight (interactive kinds, the loop) without making the ontological error (that the disorder isn't real) or the empirical overreach (that diagnosis *causes* the prevalence in a simple linear way). It protects you from the "specialist wince" while keeping the provocation for the general reader.
