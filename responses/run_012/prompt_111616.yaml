      *(Another thought)*: The user mentioned the supervisor conflates the two. The project should aim to show *why* the conflation is harmful for policy design. If you treat a plan-abandonment as a preference-reversal, you design the wrong nudge.

      *(Final Polish)*: Ensure the distinction between "Synchronic Akrasia" (Phil) and "Diachronic Preference Reversal" (BE) is clear. The user's intuition is that BE explains the *cause* of the breakdown in the Phil structure, but they aren't the *same description*.

      *Let's structure the ranking:*
      1.  The Nature of the Normative Binding (Intention vs. Judgment).
      2.  The Rationality of Discounting (Bug or Feature?).
      3.  The Architecture of Commitment (Precommitment vs. Scaffolding).
