      So, Unit of Agency is most upstream.
      Rationality of Discounting is next (determines if intervention is justified).
      Policy Design is downstream.

      *Okay, ready to write.*
answer: |-
  This is a sharp intuition, and your supervisor is glossing over a genuine category error. The standard analytic account (Davidson, Mele, etc.) treats akrasia as a **synchronic** failure (at $t_2$, I judge $A$ is best but do $B$). The behavioral econ account (Ainslie, Thaler, etc.) treats it as a **diachronic** preference reversal (at $t_1$, I prefer $A$-over-time; at $t_2$, I prefer $B$-now).

  If you treat them as identical, you risk designing policy that targets the wrong mechanism. If the problem is *judgment*, you need education or cognitive reframing. If the problem is *preference reversal*, you need constraints. If your hunch is right and the problem is *plan abandonment*, you need something else entirely (scaffolding).

  Given your constraints (one semester, armchair method, policy relevance), here is the ranked agenda.

  ### 1. The Unit of Normative Binding: Judgment vs. Intention vs. Plan
  **Status:** **Most Upstream / High Tractability**
  **The Question:** Is the norm violated in akrasia a judgment about the good, or a commitment to a future course of action (an intention/plan)?
  **Why it's #1:** This is the conceptual pivot. If akrasia is acting against a *judgment*, the BE story (hyperbolic discounting) is irrelevant because judgments don't discount; they are truth-apt assessments. If akrasia is failing to execute a *prior intention*, then hyperbolic discounting becomes a candidate explanation for *why* the intention lost its normative grip.
  **Tractability:** Purely conceptual. You can do this with Bratman's planning theory of intention against the Davidsonian judgment model. You don't need data; you need logical space.
  **Policy Payoff:** If the unit is the *plan*, then commitment devices aren't "restricting freedom" (blocking the bad option); they are "extending agency" (supporting the plan's stability). This changes the ethical justification for nudges.
  **Upstream/Downstream:** This dictates how you interpret the BE data. If you settle this, Question #2 becomes easier because you know *what* is being discounted (the value of the outcome or the authority of the past self?).

  ### 2. The Rationality of Temporal Discounting
  **Status:** **Upstream / Medium Tractability**
  **The Question:** Is hyperbolic discounting a cognitive failure (a bug in reasoning) or a rational response to uncertainty (a feature of ecological validity)?
  **Why it's #2:** This determines the normative status of the intervention. If discounting is irrational, the policy maker is "correcting" a mistake. If it's rational (e.g., the future is uncertain, so weighting it less is smart), then commitment devices are potentially paternalistic impositions of one temporal perspective over another.
  **Tractability:** You can't solve the empirical debate, but you can map the *normative implications* of each side. You can argue conditionally: "If discounting is irrational, then X; if rational, then Y."
  **Policy Payoff:** Crucial for welfare economics. Are we maximizing the "true" long-term utility, or just privileging the $t_1$ self's imperialism over the $t_2$ self?
  **Upstream/Downstream:** Downstream of #1 (you need to know what's being discounted), but upstream of #3 (you need to know if intervention is justified before designing it).

  ### 3. The Architecture of Self-Binding: Precommitment vs. Scaffolding
  **Status:** **Downstream / High Policy Relevance**
  **The Question:** Given the answer to #1 and #2, what kind of commitment device is appropriate? Ulysses contracts (hard constraints) or cognitive scaffolding (reminders, friction)?
  **Why it's #3:** This is the "useful for policy designers" part. If your analysis in #1 shows that akrasia is plan-abandonment due to discounting, then hard precommitment might be overkill or misdirected. Perhaps what's needed is "plan-maintenance" rather than "option-elimination."
  **Tractability:** Conceptual taxonomy. You can analyze existing devices (StickK, cool-off periods, blocking software) through the lens of your #1 framework.
  **Policy Payoff:** Direct. It tells designers whether to build walls or bridges.
  **Upstream/Downstream:** Purely downstream. You cannot answer this without settling the nature of the failure (#1) and the rationality of the shift (#2).

  ### 4. The Metaphysics of the Temporal Self
  **Status:** **Trap / Low Tractability**
  **The Question:** Are the $t_1$ self and $t_2$ self the same person? (Parfitian reductionism vs. Egoism).
  **Why it's #4:** This is the "juicy but useless" trap. Philosophers love this. Policy makers do not care. If you spend your semester arguing about personal identity, you will not have a usable conclusion for the behavioral economists.
  **Tractability:** Low. You will not solve personal identity in one semester.
  **Policy Payoff:** Negligible. Policy assumes legal/personal continuity regardless of metaphysical truth.
  **Upstream/Downstream:** It looks upstream, but it's actually a sidetrack. You can bracket metaphysics and work with *practical* identity (what the agent identifies with).

  ---

  ### The "Juicy but Useless" Warning
  **Avoid:** Trying to prove whether hyperbolic discounting is the *true* psychological mechanism of akrasia.
  **Why:** You have no lab. You cannot beat the psychologists at their own game. If you try to argue empirically that "actually, people don't discount hyperbolically," you will be ignored.
  **Instead:** Treat hyperbolic discounting as a *functional description* of the behavior, not necessarily a causal mechanism. Your job is to ask: "Even if this description is accurate, does it map onto the normative concept of weakness of will?"

  ### What Moves the Ranking? (Reordering Triggers)
  You should reorder this agenda based on what you find in the first 3-4 weeks of reading.

  1.  **Move #2 Up if:** You find that the behavioral econ literature *presupposes* that discounting is irrational. If they treat it as a given that $t_1$ preferences are normatively superior, your work on the *rationality* of discounting becomes the critical intervention. You could write a paper arguing that policy based on BE is secretly privileging the past self without justification.
  2.  **Move #1 Down if:** You find that the "Intention" literature (Bratman, etc.) has already thoroughly colonized this space. If there's already a consensus that akrasia is plan-abandonment, then defending that thesis is no longer novel. In that case, skip to #3 (Policy Architecture) and apply the existing theory to new commitment devices.
  3.  **Move #4 Up (Slightly) if:** You find that the policy designers are explicitly using "multiple selves" models to justify welfare metrics (e.g., "we are maximizing the long-term self's utility"). If they are making metaphysical claims, you have to engage them to show why those claims are unstable.

  ### Recommended Argument Strategy
  Your strongest move is to argue that **conflating Judgment-Conflict with Preference-Reversal leads to category errors in policy design.**

  *   **The Supervisor's View:** Akrasia = Discounting. Solution = Bind the future self.
  *   **Your View:** Akrasia = Failure of Intention Stability (caused by Discounting). Solution = Support the continuity of the plan.

  If you can show that treating the agent as a *sequence of selves* (BE) undermines the *responsibility* required for the agent to use commitment devices effectively (Phil), you have a paper. For example: If I view my future self as a stranger whose preferences I can ignore, why should I honor the commitment device I set up? The device works only if I view myself as *one* agent over time. The BE model threatens the very unity required for the policy to work.

  **Summary Plan:**
  1.  **Month 1:** Map the Judgment vs. Intention distinction (Bratman vs. Davidson). Solidify #1.
  2.  **Month 2:** Analyze the Normative Status of Discounting (#2). Is the $t_1$ self a dictator or a planner?
  3.  **Month 3:** Draft the Policy Implications (#3). Show how the #1/#2 synthesis changes how we build commitment devices.

  This keeps you in your lane (conceptual/normative) while speaking directly to the empirical/policy crowd's assumptions.
