      *   *Claim 5 (Unobtainable/Impossible Intention):* This is Kavka's original conclusion ("The Toxin Puzzle" implies you *cannot* intend). However, many philosophers (Bratman, Gauthier, etc.) argue you *can* intend if you have a disposition or a plan. *Verdict:* Contested. Kavka thought so, but many disagree.

