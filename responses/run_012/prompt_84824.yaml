      *   *Section 2: Analysis of Conflicts.* Detail the 1vs4, 3vs6, 5vs7 tensions.
      *   *Section 3: Fixes and Costs.* For each conflict.
      *   *Section 4: The Single Change.* Argue for dropping or radically modifying #4.
      *   *Tone Check:* Ensure I'm not telling them what to think, but analyzing the coherence. Use philosophical terminology correctly (marginal cases, total view, person-affecting).

  8.  **Refining the Analysis (Self-Correction during drafting):**
      *   *Correction on 1 vs 4:* Claim 4 says "member of the kind whose life this is a damaged version of." This is the "Human Kind" argument (McMahan/Steinbock). It explicitly rejects the idea that *only* individual capacities matter. This directly contradicts Claim 2 ("Not intelligence... not being human"). Claim 2 says individual traits ground status. Claim 4 says group membership grounds status. This is the biggest contradiction.
