      *   *Conflict B: 2 & 5.* Claim 2 says sentience grounds status. Claim 5 says death isn't a harm if no temporal sense. This is actually consistent within Singer's framework (interests vs. experiences), but it creates tension with the intuition that killing is wrong. However, logically, 2 and 5 hang together *if* you define harm strictly as experiential suffering.
