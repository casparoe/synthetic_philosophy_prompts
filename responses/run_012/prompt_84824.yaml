      *   *Claim 5 (Harmless Killing/Deprivation):* Death isn't a harm to beings without a sense of temporal extension. Wrongness of farming is suffering, not killing. (Singer's distinction, though Singer often argues killing *is* a harm if preferences exist, but accepts this for non-self-aware beings).
      *   *Claim 6 (Wild Animal Suffering):* Nature is bad; we should intervene to reduce wild suffering. (Negative Utilitarian/Longtermist view).
      *   *Claim 7 (Companionship/Work):* Keeping dogs and training them is fine. (Status Quo/Aristotelian view).

