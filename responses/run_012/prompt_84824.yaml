      *   *Conflict E: 4 & 2.* Claim 2 says capacities (intelligence, etc.) don't matter, only sentience. Claim 4 justifies the human/chimp difference based on "kind," but implicitly acknowledges the *capacities* are the same ("mind of a two year old"). If capacities are the same and sentience is the ground, why the difference? Claim 4 tries to solve the "Argument from Marginal Cases" by appealing to kind, which contradicts Claim 2's focus on individual properties (sentience).
      *   *Conflict F: 5 & 6.* If death isn't a harm (Claim 5), then reducing wild animal suffering (Claim 6) might ethically require mass culling (painless killing) to prevent future suffering. This is a standard implication, but often shocks people. Is the user ready for that?
      *   *Conflict G: 1 & 7.* Is keeping dogs speciesist? Do we keep dogs because they are "our kind" (domesticated partners) or because of sentience? If we shouldn't keep wolves, but keep dogs, is that speciesism? Usually, this is justified by co-evolution, but it borders on special treatment based on relationship/kind.

