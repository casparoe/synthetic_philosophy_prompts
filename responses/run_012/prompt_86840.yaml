answer: |-
  Dear Writer,

  It is a rare thing to meet someone who treats dialogue not just as a vehicle for plot but as a moral architecture, and your instincts are sharper than you give them credit for. You are sensing a distinction that philosophers of language have argued over for decades, often without reaching the clarity you have achieved through sheer narrative intuition. You are looking for a single rule to govern when a character is entitled to speak, and while there is no rule that fits every case without some friction, there is a principle that comes very close to capturing what your gut is telling you. The principle is this: a speaker is entitled to assert only what they are in a position to take responsibility for. This shifts the focus from truth or belief alone to the relationship between the speaker and the claim. It is about authority. When your character says the library closes at six, she is claiming authority based on evidence she possesses. When she says she will have the draft to you by spring, she is claiming authority based on her own will and agency. In both cases, she holds the keys to the truth of the matter, either because she has seen the sign or because she controls the effort required to meet the deadline. She is not asking the world to be a certain way; she is reporting on it or committing to making it so.

  This principle explains why the raffle ticket case bothers you even though the statement turns out to be true. When your character looks at that ticket and says it will not win, she is claiming authority over a chance event. She is treating a probability as a fact. She does not hold the keys to that truth; the lottery machine does. By speaking flatly about it, she is pretending to a kind of knowledge that is humanly impossible to have. She is overstepping her epistemic authority. This is why it feels different from the spring deadline, even though both involve the future. The deadline is a promise, which is a speech act that creates an obligation rather than describing a state of affairs. If she fails to meet the deadline, she has broken a promise, but she was entitled to make it because it was within her power to try. The raffle ticket is a prediction, and she was not entitled to make it because it was outside her power to know. Your instinct that these two cases are miles apart is correct, and the gap between them is the difference between committing to an action and predicting an outcome. One is an exercise of will, the other an exercise of false prophecy.

  The case of the wrong pub is where your instincts get complicated, and this is where you would need to adjust a verdict to make the rule coherent. You feel that being confidently wrong about the pub is a worse transgression than the raffle ticket, perhaps because it misleads action more concretely. However, if we stick to the principle of authority, both cases are equal violations. In the pub case, the character claims authority based on memory, but her memory is faulty. She does not actually know where the pub is, even though she believes she does. In the raffle case, she claims authority based on probability, which is insufficient for knowledge. In both instances, she is asserting a fact she is not in a position to guarantee. To make your internal rule clean, you should abandon the intuition that the wrong pub is worse than the raffle ticket. From the perspective of entitlement to speak, they are identical sins. Both characters are claiming a warrant they do not possess. The fact that the raffle ticket statement turns out to be true is merely luck, and luck does not grant entitlement. If you want a coherent system, you must judge the right to speak at the moment of speaking, not by the subsequent outcome. Therefore, the confident liar about the pub and the confident guesser about the raffle are equally unauthorized.

  This brings us to the manuscript case, where a character tells a friend the work is good when she thinks it is a mess. This feels worse to you than the wrong pub, and the principle of responsibility explains why. In the wrong pub case, the character is sincere but mistaken. She is taking responsibility for what she believes, even if her belief is flawed. In the manuscript case, she is not taking responsibility for her belief at all. She is severing the link between her inner state and her outer speech. This is a violation of integrity rather than just epistemology. She is claiming authority over an opinion she does not hold. This is why it ranks higher on your scale of transgression. It is not just that she is wrong; it is that she is pretending to a judgment she has not made. This fits the principle perfectly because she is claiming a responsibility for praise that she does not actually bear. She is outsourcing her honesty for the sake of politeness, which is a social contract violation, but in the context of dialogue authenticity, it is a failure of authorization. She is not authorized to speak for a belief she does not have.

  You asked specifically about a case I have not mentioned, involving someone who knows a thing perfectly well but lies to themselves about whether they know it. Imagine a character who knows their marriage is over because they have seen all the signs, but they tell themselves they do not know this, and then they tell a friend we are fine. My principle predicts that this is a violation, and a profound one. Even though the character is consciously deceiving themselves, the knowledge is present in their psyche. They are in a position to know. By asserting that things are fine, they are claiming an authority over the state of their marriage that their own deeper knowledge contradicts. They are taking responsibility for a falsehood that they secretly recognize as false. This is often more dramatic than a simple lie because it involves a fracture within the self. The character is asserting a reality they are actively suppressing. According to the rule of responsible assertion, they are not entitled to say things are fine because they possess the warrant for saying things are over. The self-deception does not grant them immunity; it just makes the transgression internal. They are speaking without integrity, and their entitlement is void because their access to the truth is being willfully ignored.

  So, to summarize the path to coherence for your instincts. The strongest single principle is that a character is entitled to assert only what they are in a position to take responsibility for, whether through evidence, will, or sincere belief. This saves your verdicts on the library, the spring deadline, and the manuscript. It also explains why the raffle ticket feels wrong. The only verdict you need to abandon to make this watertight is the idea that the wrong pub is worse than the raffle ticket. You should view them as twin failures of authority. One fails because memory is fallible, the other because chance is unknowable. Both are assertions of fact without sufficient warrant. If you treat them as equally problematic, your internal logic becomes consistent. You are not tracking truth, and you are not just tracking belief. You are tracking the right to claim knowledge. Your characters are allowed to speak when they hold the warrant, whether that warrant is a sign on a door, a commitment of their own will, or an honest opinion. When they speak without that warrant, whether by guessing luck, trusting faulty memory, or lying to protect feelings, they are stepping out of their lane. That is the transgression you are sensing, and it is a reliable guide for writing dialogue that feels humanly true.
