  (a) **Protocol.** A standard six-sided die is rolled once. If the outcome is 1, 2, or 3 (Outcome $X$, probability $1/2$), you are woken twice ($n(X)=2$). If the outcome is 4 or 5 (Outcome $Y$, probability $1/3$), you are woken once ($n(Y)=1$). If the outcome is 6 (Outcome $Z$, probability $1/6$), you are woken four times ($n(Z)=4$). Between wakings, you are given an amnesiac agent that erases memory of previous wakings, though you retain knowledge of this protocol. Each time you wake, you are asked for your credences. You know only that you are awake and the protocol details; you cannot distinguish which waking episode this is, nor the die outcome.

  (b) **Credence Table.** Let $E = \sum p(b)n(b)$ be the expected number of episodes. Here $E = (1/2)(2) + (1/3)(1) + (1/6)(4) = 1 + 1/3 + 2/3 = 2$.

  | Proposition | Rule A Calculation | Rule A Credence | Rule B Calculation | Rule B Credence |
  | :--- | :--- | :--- | :--- | :--- |
  | **Outcome $X$** | $p(X)$ | $1/2$ | $p(X)n(X)/E = (1/2 \cdot 2)/2$ | $1/2$ |
  | **Outcome $Y$** | $p(Y)$ | $1/3$ | $p(Y)n(Y)/E = (1/3 \cdot 1)/2$ | $1/6$ |
  | **Outcome $Z$** | $p(Z)$ | $1/6$ | $p(Z)n(Z)/E = (1/6 \cdot 4)/2$ | $1/3$ |
  | **This is 1st** | $\sum p(b)/n(b)$ | $\frac{1/2}{2} + \frac{1/3}{1} + \frac{1/6}{4} = \frac{5}{8}$ | $1/E = 1/2$ | $1/2$ |

  (c) **Condition for Agreement.** The rules agree on outcome $b$ if and only if $n(b) = E$ (the waking count for $b$ equals the expected total wakings). *Proof:* $Cr_A(b) = Cr_B(b) \iff p(b) = p(b)n(b)/E \iff E = n(b)$ (since $p(b)>0$). Outcome $X$ is special because its waking count ($2$) exactly matches the global expected waking count ($2$); this agreement is a structural feature of Rule B's normalization, not a coincidence, as Rule B effectively treats $n(b)$ as a likelihood multiplier against the prior $p(b)$.

  (d) **Variations.** If the condition is removed (e.g., change $n(X)$ to 3), the rules disagree on $X$ as well as $Y$ and $Z$, obscuring the specific divergence on self-location. If strengthened to equal counts throughout ($n(b)=k$ for all $b$), then $E=k$, and Rule B reduces to Rule A ($Cr_B(b) = p(b)k/k = p(b)$), eliminating the disagreement entirely; this shows the disagreement vanishes when waking frequency carries no differential information.

  (e) **Divergent Bet.** A bet that pays \$1 if Outcome $Y$ occurred, \$0 otherwise. Rule A prices this at \$1/3 (fair odds 2:1 against). Rule B prices this at \$1/6 (fair odds 5:1 against). A Rule A agent will buy this bet for \$0.25; a Rule B agent will sell it for \$0.25.

  (f) **Objections and Replies.**
  *   **Rule A Defender:** "The agreement on $X$ is a numerical accident that masks Rule B's violation of the Principal Principle; the die chance is $1/3$, so credence must be $1/3$ regardless of waking frequency."
      *   *Reply:* The Principal Principle applies to chances of outcomes, but upon waking you have new indexical evidence ("I am awake now") which Rule B argues is correlated with $n(b)$, justifying the update.
  *   **Rule B Defender:** "Rule A's agreement on $X$ concedes that waking counts matter sometimes, yet it arbitrarily ignores them for $Y$; this inconsistency shows Rule A fails to treat observer-moments as the relevant sample space."
      *   *Reply:* Rule A treats the *outcome* as the object of belief, not the episode; the agreement on $X$ arises because the sampling bias恰好 cancels the prior, not because episodes are the primary ontology.

  (g) **Two-Outcome Impossibility.** In a two-outcome case $\{1, 2\}$, agreement on 1 requires $n(1) = p(1)n(1) + p(2)n(2)$, which simplifies to $n(1)p(2) = p(2)n(2)$, implying $n(1)=n(2)$. If counts are equal, $E=n(1)=n(2)$, forcing agreement on 2 as well. Thus, no two-outcome device can yield agreement on one outcome and disagreement on another. The standard Sleeping Beauty (Coin, $n_H=1, n_T=2$) forces disagreement on both outcomes ($1/2$ vs $1/3$ for Heads); this die case is not a relabeling but a structurally distinct three-outcome construction required to isolate the disagreement to $Y$ and self-location while anchoring $X$.

  (h) **Conclusion.** The case demonstrates that the disagreement is substantive, turning on whether waking frequency constitutes relevant evidence for the outcome, rather than a mere artefact of reference class selection, since both rules agree on $X$ despite fixing different reference classes.
