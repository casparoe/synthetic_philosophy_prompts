      *   **Desired "Kill Shot":** A case where the *demand for period-centered judgment* is itself a present-day value, catching the anti-presentist in their own net.

  2.  **Deconstruct the Defeaters (Drafting & Evaluation):**

      *   **Defeater 1: Internal Pluralism (The "Spirit of the Age" Problem).**
          *   *Argument:* The past wasn't monolithic. There were dissenters. Using "standards of the time" often means cherry-picking the dominant view and ignoring contemporaneous critics.
          *   *Impact:* This attacks (b) Epistemic. If there were people *then* judging by standards we hold *now*, then the "view from the period" isn't a fiction; it's a recoverable historical reality (the dissenters).
          *   *Severity:* Seriously Damaging to (b). It shows the "past standard" is a construct, but not necessarily that *our* standard is the only valid one. It complicates the "covert presentism" claim because sometimes presentism aligns with *past* minority views.
          *   *Concession:* A committed presentist must admit that "the standards of the time" is a simplification.

      *   **Defeater 2: Explanation vs. Evaluation.**
          *   *Argument:* We can explain *why* someone did X (causal/contextual) without judging X (normative). Presentism conflates understanding with judging.
          *   *Impact:* Attacks (c) Normative. If we can bracket evaluation, the "unavoidability" claim weakens. We *can* obey the injunction to avoid anachronistic *judgment* even if we can't avoid anachronistic *questions*.
          *   *Severity:* Awkward but Survivable. The user can argue that the *choice* to bracket judgment is itself a presentist value (liberal neutrality). But it distinguishes the *activity* of history from the *activity* of moral tribunal.
          *   *Concession:* Historians do often bracket judgment. The presentist must argue this bracketing is methodological, not ontological.

      *   **Defeater 3: Immanent Critique/Practice Standards.**
          *   *Argument:* Evaluating a general by military art or a mathematician by logic isn't presentism; it's assessing competence within a trans-historical practice.
          *   *Impact:* Attacks (b) and (c). If standards are internal to a practice (which transcends time), then we aren't imposing *our* present standards, but *the practice's* standards.
          *   *Severity:* Seriously Damaging to the "all evaluation is presentist" claim. It suggests some standards are timeless or practice-relative, not time-relative.
          *   *Concession:* The presentist must argue that *which* practices we value (military success vs. peace) is presentist.

      *   **Defeater 4: Moral Ignorance/Blame Asymmetry.**
          *   *Argument:* There's a difference between "they didn't know slavery was wrong" (moral ignorance) and "they didn't know germ theory" (factual ignorance). Moral realism suggests some truths are accessible across time.
          *   *Impact:* Attacks (c) Normative. If moral truths are timeless, judging past agents by them isn't "presentism" in the pejorative sense; it's moral realism.
          *   *Severity:* Fatal to (c) *if* Moral Realism is true. If the user is a moral anti-realist, this doesn't stick. But it forces the user to defend moral anti-realism to maintain (c).
          *   *Concession:* This is the strongest philosophical challenge. It forces the presentist to admit they are relying on meta-ethical skepticism.

      *   **Defeater 5: Unfalsifiability.**
          *   *Argument:* If every counter-example is re-described as "covert presentism," the theory is a tautology.
          *   *Impact:* Attacks the methodology of the position itself.
          *   *Severity:* Fatal to the *argumentative integrity* if not careful. Needs a falsifiable condition.
          *   *Concession:* The user must define what would count as "non-presentist" to prove they aren't just playing word games.

      *   **The "Kill Shot": The Anti-Presentist Value.**
          *   *Argument:* The demand *not* to judge anachronistically is itself a modern, liberal, pluralist value. We value "fairness" and "context" *now*. Therefore, the anti-presentist is actually a presentist who values historical empathy.
          *   *Impact:* Turns the table completely.
