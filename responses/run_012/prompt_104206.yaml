answer: |-
  You have put your finger on the open secret of torts: the doctrine of factual causation is not a unified theory of metaphysics, but a pragmatic bricolage of evidentiary thresholds, normative imputation, and causal intuition. If you try to force the Restatement and the case law into a single philosophical box, it will burst.

  Here is an analysis of the structure of the rules, stripped of judicial rhetoric, addressing your specific theoretical questions.

  ### 1. The Presupposed Theory: A Fragmented Realism
  The package does not presuppose *one* theory of causation. It presupposes a **hierarchy of inquiry** where metaphysics is subordinated to administrative feasibility.

  *   **The Baseline:** The but-for test commits the doctrine to **Counterfactual Dependence** (à la David Lewis). It asks: *In the nearest possible world where the defendant acts rightfully, does the harm occur?*
  *   **The Contradiction:** The overdetermination exceptions (substantial factor/concurrent causes) explicitly reject counterfactual dependence. In the *Summers v. Tice* or *Anderson v. Minneapolis St. Paul* scenarios, the counterfactual world (where Defendant A acts rightfully) still contains the harm (caused by Defendant B). Yet liability attaches.
  *   **The Resolution:** The doctrine implicitly switches theories mid-stream. It starts with Counterfactual Dependence as a screening mechanism. When that screen produces a "false negative" (a defendant who clearly contributed to the harm escapes because of a coincidental overdetermining factor), the doctrine switches to **NESS** (Necessary Element of a Sufficient Set) or **Sufficiency**.

  So, the structure presupposes that **Counterfactual Dependence is the proxy for Causation, except when it fails to capture intuitive contributions, in which case Sufficiency takes over.**

  ### 2. Overdetermination: NESS or Interventionism?
  You ask if the overdetermination exception is a slide into interventionism or the INUS/NESS idea.

  **It is structurally closer to NESS (Richard Wright's account).**
  Under the NESS test, a cause is a necessary element of a set of conditions that is sufficient for the occurrence of the outcome.
  *   *Polluter A* + *Background Conditions* = Sufficient Set 1.
  *   *Polluter B* + *Background Conditions* = Sufficient Set 2.
  *   Polluter A is a necessary element of Set 1. Even if Set 2 also exists, A's contribution was sufficient to produce the harm.

  **Why not pure Interventionism (Woodward)?**
  Interventionism defines causation in terms of invariant relationships under intervention ($X$ causes $Y$ if manipulating $X$ changes $Y$). In a symmetric overdetermination case, manipulating A (setting A to 0) does *not* change Y (because B is still 1). A strict Woodwardian account actually struggles with symmetric overdetermination unless you specify the background conditions carefully (e.g., "in the absence of B").
  The law, however, doesn't ask "Would the fish die if A stopped *and* B kept going?" It asks "Was A's discharge sufficient to kill the fish?" That is a sufficiency question, not a counterfactual dependence question.

  **What this rules out:** This structure rules out **Strict Counterfactual Theories** (they can't handle overdetermination without ad-hoc fixes) and **Strict Regularity Theories** (Humean regularities don't handle single-instance overdetermination well). It sits awkwardly with **Probabilistic Theories** unless the probability is 100% (as in the fish case).

  ### 3. Loss of Chance: Metaphysics or Redefinition?
  The split in medical malpractice jurisdictions reveals the fault line between **Causal Ontology** and **Evidentiary Policy**.

  *   **The Majority (No Recovery):** Adheres to the Counterfactual/But-For ontology. The "harm" is death. Did the negligence cause the death? No, because the patient likely would have died anyway (60% mortality). To rule otherwise is to lie about the past.
  *   **The Minority (Lost Chance):** Redefines the **Interest Protected**. The "harm" is not the death; the "harm" is the *diminution of the probability of survival*.
      *   *Causal Claim:* Did the negligence cause the *loss of the chance*? Yes, definitively.
      *   *Damages:* Proportional to the value of that chance.

  **Structural Implication:** The "Lost Chance" jurisdictions are not actually changing the theory of causation; they are changing the **definition of the tortious injury**. They move from a binary injury (death/no death) to a probabilistic injury (risk exposure). This is consistent with **Probabilistic Causation** (Suppes), where a cause is something that raises the probability of an effect.

  ### 4. The Real Engine: Proof and Error Costs
  You asked if the whole thing is better read as a doctrine about proof and error costs. **Yes.** This is the only way to make the package consistent.

  The but-for test is not a metaphysical truth; it is a **heuristic for minimizing false positives**.
  *   **Default Rule:** Require but-for causation to prevent liability for remote conditions (the "oxygen in the room" problem).
  *   **Overdetermination Exception:** When but-for creates a **False Negative** due to coincidental redundancy, the error cost shifts. It is worse to let two tortfeasors escape than to hold them both liable. The "Substantial Factor" test is a judicial instruction to ignore the coincidental presence of the other cause.
  *   **Lost Chance Split:** This is a pure policy calculation on **Error Costs**.
      *   *Majority:* Fears False Positives (liability for bad outcomes that weren't actually preventable). Worry: Floodgates, defensive medicine.
      *   *Minority:* Fears False Negatives (doctors escaping liability for destroying a 40% survival rate just because it wasn't >50%). Worry: Under-deterrence.

  The structure is consistent not as metaphysics, but as **Risk Allocation**. The law tolerates metaphysical incoherence to maintain a clear evidentiary bright line (>50% preponderance), punctuated by exceptions where the bright line produces egregious injustice.

  ### 5. Rebuilding on Interventionism
  If you rebuilt the doctrine around a fully **Interventionist Account (Woodward)**: $C$ causes $E$ if there is a possible intervention on $C$ that changes $E$, holding other variables fixed.

  **What Changes:**
  1.  **Overdetermination Becomes Easier:** You define the causal model to include the specific mechanism. If Polluter A's toxin binds to fish gills to cause death, and Polluter B's toxin does the same, an intervention on A (removing A's toxin) prevents death *in the model where B is absent*. Interventionism allows you to isolate the causal pathway. The law would likely adopt a "Contribution to Risk" standard more readily. The "Substantial Factor" language would be replaced by "Invariant Contributor."
  2.  **Lost Chance Becomes Standard:** Interventionism is inherently compatible with probabilistic relationships. If the variable *Doctor Care* is manipulated from *Negligent* to *Non-Negligent*, the variable *Survival Probability* shifts from 0.2 to 0.4. That is a causal relationship.
      *   *Result:* The majority view (no recovery) becomes untenable. You cannot say there is "no causation" when the intervention clearly shifts the probability distribution.
      *   *Damages:* Damages would naturally become proportional. If the intervention shifts probability by 20%, liability attaches to that 20%.

  **Where the Hard Part Moves:**
  The difficulty shifts from "Did this cause that?" to **"What are the correct variables and background conditions?"**
  *   *Variable Granularity:* Is the harm "Death" or "Loss of 20% Survival Probability"? Interventionism doesn't decide this; normative theory does.
  *   *The "Fixing" Problem:* In overdetermination, when we intervene on A, do we hold B fixed at "present" or "absent"?
      *   If we hold B fixed at "present," A is not a cause (no change in outcome).
      *   If we hold B fixed at "absent," A is a cause.
      *   *Legal Translation:* The court must decide which "background context" is the relevant one for liability. This recreates the **Proximate Cause** problem inside the Actual Cause inquiry.

  ### Summary for the Classroom
  If you want to explain the structure to students without lying to them:

  1.  **Metaphysically:** The doctrine is incoherent. It mixes Counterfactual Dependence (but-for) with Sufficiency (overdetermination) and Probabilistic Causation (lost chance).
  2.  **Functionally:** It is a **Proof Hierarchy**.
      *   **Step 1:** Can the plaintiff show counterfactual dependence? (Cheapest, clearest evidence). If yes, stop.
      *   **Step 2:** If no, was the defendant's act sufficient to produce the harm on its own? (Prevents escape via coincidence).
      *   **Step 3:** If no, did the defendant's act measurably reduce the probability of a better outcome? (Only allowed in specific contexts where the "harm" is redefined).
  3.  **The Theory:** The law presupposes **Pragmatic Attribution**. It uses causal theories as tools to assign responsibility, not to describe the universe. It rules out **Strict Determinism** (because it allows probabilistic recovery in some jurisdictions) and **Strict Counterfactualism** (because of overdetermination).

  The "inconsistency" you feel is the friction between the **binary nature of liability** (you are either liable or you aren't) and the **continuous nature of causation** (contribution ranges from 0% to 100%). The doctrine is a series of dams built to hold back that continuous flow so the court can issue a binary judgment.
