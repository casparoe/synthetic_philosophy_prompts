answer: |-
  You are right to feel that you are lumping things together. While your three cases share a surface grammar—an announcement is made, and that announcement interacts with the reality it describes—they operate on three distinct mechanical principles. There is no single established term that covers all three without blurring vital distinctions, because logicians, game theorists, and sociologists treat them as separate problems.

  However, they do form a coherent family. The most honest umbrella term for this family is **Reflexive Announcements**.

  "Reflexivity" is the property of a system where an output loops back to influence the input. In your cases, the *statement* about the system becomes part of the *state* of the system. But to answer your request for a carving, we must split this family into three distinct species. They differ in whether the feedback loop is **logical**, **strategic**, or **causal**.

  Here is the carving.

  ### 1. The Epistemic Paradox (The Test)
  **Mechanism:** Logical Consistency of Knowledge.
  **Term:** *The Unexpected Examination Paradox* (or Hangman Paradox).

  This case turns entirely on **what the audience can know**. It is a puzzle about the definition of "knowledge" and "prediction."

  *   **The Assumptions:** For the students' reasoning to go through, you must assume:
      1.  **Truthfulness:** The teacher will not lie.
      2.  **Common Knowledge of Rationality:** The students know they are rational, they know the teacher knows they are rational, and they know the teacher knows that they know, ad infinitum.
      3.  **Deductive Closure:** If the students can logically deduce the day, they "know" it.
      4.  **Fixed Future:** The day of the test is fixed at the moment of the announcement.

  *   **The Carving:** The paradox arises because the announcement attempts to define a future state ("a test") that is logically incompatible with the audience's knowledge of that state ("you won't know when").
  *   **Dropping Assumptions:**
      *   If you drop **Truthfulness**, it becomes a bluff, not a paradox.
      *   If you drop **Deductive Closure** (e.g., "knowing" requires empirical evidence, not just logical elimination), the paradox dissolves. The students can eliminate Friday logically, but they cannot *know* on Thursday night that Friday is the day until Thursday night passes.
      *   If you drop **Fixed Future** (the teacher decides based on the students' reaction), it becomes a game, not a logic puzzle.
  *   **Verdict:** This is a **genuine paradox** only within a specific, rigid system of epistemic logic. In the real world, it is a **fallacy of self-reference**. The teacher's announcement is not a logical theorem; it is a performative act. When Friday comes, the students are surprised. The announcement was true, their reasoning was flawed because it treated "surprise" as a logical variable rather than a psychological state.

  ### 2. The Strategic Uncertainty (The Regulator)
  **Mechanism:** Probabilistic Information Hiding.
  **Term:** *Randomized Enforcement* (or Mixed Strategy Equilibrium).

  This case turns on **what the audience cannot calculate**. It is not a paradox; it is a working policy.

  *   **The Difference:** In the Test case, the students assume they can *deduce* the day. In the Regulator case, the firms know they *cannot deduce* the day.
  *   **Why the Surprise Survives:** The regulator does not say, "I will pick a day that is logically unpredictable." They say, "I will pick a day *at random*."
      *   The firms know the *policy* (the probability distribution).
      *   They do not know the *instance* (the specific outcome).
      *   Crucially, the regulator retains **agency**. In the Test Paradox, the teacher is seemingly bound by the logic of the announcement. In the Regulator case, the regulator is bound only by the *process* (randomization).
  *   **Verdict:** This is not a Reflexive Announcement in the same sense as the Test. The announcement does not undermine the surprise; it *guarantees* the surprise by committing to randomness. It belongs in a different box: **Commitment Devices**. The announcement works *because* it is public. If the policy were secret, firms might assume they are safe. The public announcement forces them to remain in a state of permanent preparedness.

  ### 3. The Causal Reflexivity (The Economist)
  **Mechanism:** Behavioral Feedback.
  **Term:** *Self-Defeating Prophecy* (or Negative Reflexivity).

  This case turns on **what the audience then does**. It is about causality, not knowledge.

  *   **The Difference:** In the Test and Regulator cases, the event (test/inspection) *happens* regardless of the prediction. In the Economist case, the event (recession) *may not happen* because of the prediction.
  *   **Verdict:** This is the only case where the announcement changes the **truth value** of the statement.
      *   Test: "There will be a test." (True)
      *   Regulator: "There will be an inspection." (True)
      *   Economist: "There will be a recession." (False, because the prediction prevented it).
  *   **Term:** This is classically called a **Self-Defeating Prophecy** (Robert Merton). It is distinct from the Test Paradox because it relies on human *action* altering the physical world, not human *reasoning* altering the logical status of knowledge.

  ---

  ### The Proposed Terminology

  Since no single existing term captures the family without conflating the mechanisms, I propose the term **Reflexive Announcements** for the umbrella category, with the following taxonomy:

  **Definition:** A **Reflexive Announcement** is a public statement about a future state or event that, by virtue of being believed or known, alters the conditions required for the statement to be verified.

  **The Three Subtypes:**

  1.  **Epistemic Reflexivity (The Test):** The announcement creates a logical tension regarding the *knowability* of the event.
      *   *Status:* Paradoxical (in logic), Resolvable (in practice).
      *   *Failure Mode:* The audience reasons the event is impossible.
  2.  **Strategic Reflexivity (The Regulator):** The announcement creates a probabilistic uncertainty regarding the *timing* of the event.
      *   *Status:* Functional.
      *   *Failure Mode:* The audience calculates the odds and gambles (compliance risk).
  3.  **Causal Reflexivity (The Economist):** The announcement creates a behavioral change regarding the *occurrence* of the event.
      *   *Status:* Performative.
      *   *Failure Mode:* The prediction falsifies itself (or fulfills itself).

  ### Borderline Cases

  Using this carving, we can sort your borderline examples:

  *   **A surprise party whose guest of honour has been told to expect something:**
      *   *Classification:* **Epistemic Reflexivity.**
      *   *Analysis:* If you tell the guest "You will be surprised," and they reason "I know a party is coming, so I won't be surprised," you have recreated the Test Paradox. If you tell them "Something is happening" but hide the *nature* of the event, it is **Strategic Reflexivity** (information hiding).
  *   **A warning that the next attack will come without warning:**
      *   *Classification:* **Strategic Reflexivity.**
      *   *Analysis:* This is the Regulator case. It is a commitment to randomness. It works if the defender cannot deduce the time. It fails if the attacker is forced into a pattern (e.g., they *must* attack on Friday).
  *   **A policy of auditing a fixed number of firms selected at random:**
      *   *Classification:* **Strategic Reflexivity.**
      *   *Analysis:* This is the Regulator case exactly. It relies on probability, not logic. The "surprise" is statistical, not epistemic.

  ### Why the Regulator Case is Instructive

  You suspected the Regulator case is the instructive one. You are correct. It shows that the Test Paradox is a **category error**.

  The Test Paradox assumes that "surprise" is a logical property that can be deduced away. The Regulator case shows that "surprise" is an **informational asymmetry**.
  *   In the Test, the students assume they have access to the teacher's logic.
  *   In the Regulator case, the firms know they *do not* have access to the regulator's random number generator.

  The Test Paradox collapses if the teacher says: "I will pick a day using a random number generator, and I won't tell you the seed." The students can no longer use backward induction because the day is not fixed by logic, but by chance. The "paradox" only exists if we assume the teacher is bound by the students' reasoning. The Regulator is not bound by the firms' reasoning; the Regulator is bound by the *law of large numbers*.

  ### Summary of the Carving

  | Feature | The Test (Epistemic) | The Regulator (Strategic) | The Economist (Causal) |
  | :--- | :--- | :--- | :--- |
  | **Core Mechanism** | Logic & Knowledge | Probability & Cost | Behavior & Outcome |
  | **Announcement Effect** | Creates logical contradiction | Creates uncertainty | Creates behavioral change |
  | **Does Event Happen?** | Yes (usually) | Yes | Maybe (prevented/caused) |
  | **Audience Power** | Deduction | Gambling/Preparation | Action/Intervention |
  | **Established Name** | Unexpected Examination | Randomized Enforcement | Self-Defeating Prophecy |
  | **My Proposed Class** | **Epistemic Reflexivity** | **Strategic Reflexivity** | **Causal Reflexivity** |

  **Final Diagnosis:**
  You are circling a single **structure** (a statement that loops back on its own conditions) but three distinct **mechanisms**.
  *   The **Test** is a logical puzzle about the limits of knowledge.
  *   The **Regulator** is a practical tool for maintaining uncertainty.
  *   The **Economist** is a sociological phenomenon about feedback loops.

  If you must use one term for your collection, use **Reflexive Announcements**, but keep the three subtypes distinct. If you treat the Regulator like the Test, you will look for a logical contradiction where there is only a probability distribution. If you treat the Test like the Economist, you will look for behavioral changes where there is only a semantic confusion. The "muddle" your daughter's class talked themselves into is a failure to distinguish between *logical necessity* and *empirical surprise*. The regulator succeeds precisely because they never claimed logical necessity, only empirical uncertainty.
