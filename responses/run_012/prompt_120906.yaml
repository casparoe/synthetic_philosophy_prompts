answer: |-
  ### The Case: "The Token Exchange"

  **Setting:** The highland plateau of the *Varr* people (population ~4,000) and the *Aegis International* NGO field office.
  **Fieldworker:** Dr. Aris Thorne, cultural anthropologist embedded with Aegis.

  **The Empirical Pattern:**
  Aegis operates under a strict humanitarian charter: emergency caloric aid must be provided **unconditionally**. No work, no payment, no reciprocity. This is based on the principle that food is a universal human right; requiring anything in return turns a right into a commodity and exploits the vulnerable.

  The Varr operate under a strict **Reciprocity Ethic**. To accept a "gift" without giving a counter-gift is to admit to a status of permanent dependency, which dissolves one's standing as a moral agent in the community. Historically, Varr who accept charity without exchange are socially ostracized, leading to high rates of depression, suicide, and community fragmentation. To maintain social cohesion, aid *must* be framed as a trade. The Varr offer a token (a woven cord, a specific stone, a service) in exchange for grain. The token has no market value, but it transforms the transaction from "charity" to "trade."

  **The Conflict:**
  Aegis refuses to accept tokens. Their regulations classify accepting payment as corruption and a violation of the "dignity of the recipient" (defined as freedom from obligation). They insist on dropping the grain unconditionally.
  The Varr refuse to take the grain unless the token is accepted. In the last dry season, 15% of the Varr children suffered severe malnutrition because families refused the "beggar's bread." Aegis personnel are prepared to force distribution (leaving bags at doorsteps), which the Varr elders say will cause a social collapse worse than the hunger.

  **The Constraints:**
  1.  **No Factual Confusion:** The Varr are not confused about the nutritional value of the grain. Aegis is not confused about the social consequences; their internal impact assessments acknowledge that unconditional aid erodes Varr social cohesion, but they prioritize "individual right to life" over "community social structure."
  2.  **No Verbal Disagreement:** Both sides agree on the physical actions (grain moves, token moves). They disagree on the moral description (Is this *aid* or *bribery*? Is this *dignity* or *humiliation*?).
  3.  **Action-Guiding:** This determines whether children eat or whether the community fractures.

  ---

  ### The Walkthrough

  #### 1. The Relativist (Agent-Centered)
  **Commitment:** Moral truth is constituted by the normative framework of the agent's community. There is no "view from nowhere" to adjudicate between the Aegis Charter and the Reciprocity Ethic.
  **Verdict:** The Aegis workers are morally obligated to **intervene and condemn the Varr practice.**
  **Reasoning:** Since morality is relative to the agent's framework, the Aegis workers are bound by the Aegis Charter. Their Charter defines "unconditional aid" as the moral good and "payment" as corruption. To accept the token would be for the Aegis workers to violate *their own* moral truths. The Relativist cannot say the Aegis workers are "objectively wrong" to impose their will, because there is no objective standard they are violating. The Relativist must say: "Relative to Aegis, the Varr practice is wrong (it looks like corruption/coercion), and Aegis is right to enforce their norms. The Varr are right *for themselves* to refuse, but Aegis is right *for themselves* to impose."
  **Outcome:** The Relativist licenses imperialism. Because there is no objective truth to check the Aegis workers, they are free (and required) to act on their local moral convictions, even if it breaks the Varr social fabric.

  #### 2. The Objectivist (Robust Realist)
  **Commitment:** There are mind-independent moral facts about human flourishing, dignity, and social integrity. These facts are sensitive to context but not constituted by local opinion.
  **Verdict:** The Aegis workers are morally obligated to **hold back and defer to the Varr.**
  **Reasoning:** The Objectivist posits that "Human Flourishing" is an objective good. In the Varr context, flourishing is inextricably tied to social agency and reciprocity. Unconditional aid objectively *diminishes* flourishing here, even if it preserves caloric intake. The Aegis Charter mistakes a *proxy* (unconditional giving) for the *value* (dignity). The Objectivist sees that the Varr Token Exchange *better instantiates* the objective value of Dignity in this ecology than the Aegis model does. Therefore, for the Aegis workers to follow the objective moral truth, they must violate their own charter and accept the tokens.
  **Outcome:** The Objectivist demands deference. Not because "Varr truth is valid," but because "Varr practice is *True* (capital T) regarding the nature of dignity in this context."

  #### 3. The Third View (Expressivist / Quasi-Realist)
  **Commitment:** Moral statements express attitudes and prescribe norms; they do not describe mind-independent facts. However, we can simulate truth-talk to negotiate these attitudes.
  **Verdict:** The debate is a **clash of attitudes requiring negotiation, not resolution.**
  **Reasoning:** The Expressivist says neither side is "correct." Aegis expresses an attitude of *protective universalism*; Varr express an attitude of *honor-based autonomy*. The goal isn't to find who matches the moral reality, but to find a stable equilibrium. The Expressivist would urge Aegis to reframe the token not as "payment" (which violates their attitude) but as "ceremonial receipt" (which satisfies their attitude while meeting Varr needs).
  **Outcome:** Pragmatic compromise. The moral language is a tool for coordination, not a map of reality.

  ---

  ### The Working Feature: **Constitutive vs. Instrumental Norms**

  The single feature doing the work is the **status of the Outsider's norm.**

  *   **For the Relativist:** The Aegis norm ("No Payment") is *constitutive* of their morality. It defines who they are. To violate it is to cease being moral agents within their framework. Therefore, Relativism binds them to the norm, regardless of consequences.
  *   **For the Objectivist:** The Aegis norm is *instrumental*. It is a tool to achieve "Dignity/Flourishing." If the tool fails (as it does here), the Objectivist discards the tool to save the value.

  The reversal happens because Relativism locks the agent into their local rules (licensing imposition), while Realism allows the agent to transcend their local rules to track the objective good (requiring deference).

  ### Sensitivity Test: Delete the Feature

  **If I delete the distinction (make the Aegis norm Objective for the Realist):**
  Suppose the Realist believes "Unconditional Giving" is a *categorical imperative*, not instrumental. Then the Realist must also condemn the Varr and demand imposition. The reversal collapses; Realist and Relativist align on intervention.
  **If I delete the Empirical Stakes (make the social cost neutral):**
  If accepting tokens doesn't actually save the social fabric, the Objectivist loses the ground to defer. They would say, "The objective good is feeding kids; the token is a superstition. Force the food." The case relies on the Local practice *actually tracking* the objective good better than the Outsider practice.

  ### Relativist Defusal

  A sophisticated Relativist (e.g., David Wong style) would attack the **Agent-Centered** assumption I used above. They would argue:
  *"You've presented a crude Agent-Relativism. A mature Relativism acknowledges that moralities have functions (promoting social cohesion, survival). If the Aegis morality, when imposed, destroys the function of the Varr morality (survival/cohesion), then the Aegis morality is failing its own functional standards of 'humanity.' Therefore, even relative to Aegis, they should defer."*

  **Counter:** This pushes the Relativist dangerously close to Objectivism (appealing to universal functions). If "Function" is the arbiter, isn't that an objective standard? The Relativist must walk a tightrope: admitting functional constraints without admitting objective moral truths.

  ### Meta-Commentary: Settled vs. Contested

  **Settled:**
  *   **Descriptive:** Cross-cultural variation in norms (like reciprocity vs. rights) is an empirical fact.
  *   **Logical:** Agent-Relativism logically permits an agent to act on their own norms even when they clash with others. It does not *entail* tolerance. (This is often a shock to undergraduates who think Relativism = Tolerance).

  **Genuinely Contested:**
  *   **The Scope of Deference:** Realists disagree on whether "Flourishing" is sufficiently determinate to override local rights. A Deontological Realist might side with Aegis (Rights trump Consequences), while a Consequentialist Realist sides with Varr. This shows "Realism" isn't a monolith.
  *   **The Relativist's Escape:** Whether a Relativist can consistently advocate for deference without smuggling in objective premises (like "Social Cohesion is Good") is a live debate in metaethics.
  *   **The "Error" Constraint:** I stipulated Aegis knows the social cost. In the real world, Outsiders are often factually ignorant. If they are ignorant, the Realist case becomes easier (they are just wrong about facts), but the prompt required a moral clash. Maintaining that clash without factual confusion is the hardest part of the case design.

  **Why this works for your seminar:**
  It breaks the "Realist = Intolerant / Relativist = Tolerant" heuristic. It forces students to see that **Realism can be humble** (I might be wrong about what dignity requires here) while **Relativism can be arrogant** (My standards are the only ones I have to go by, so I'll impose them). It isolates the metaethical commitment from the political outcome.
