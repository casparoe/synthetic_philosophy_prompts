prompt: |-
  I'm putting together a case for a metaethics seminar. Everyone knows the standard move: cross-cultural variation in folk moral judgment — WEIRD samples vs. small-scale societies, all that — is supposed to be evidence for relativism and awkward for the realist. I want a case that runs the other way, the variation pushes toward realism and leaves the relativist looking bad. No fair claiming the disagreement is merely verbal, and no fair making one side just factually confused or flatly inconsistent.

  Specs. Realistic fieldwork setting — an ethnographer, an NGO worker, a health regulator, something like that, not a science-fiction setup. Two communities whose folk morality differs in a way that shows up in what people actually do to each other, not just in what they'd say on a questionnaire. And here's the part I care about: the objectivist should end up being the one who has to hold back and defer to the locals, while the relativist ends up being the one who gets to call the local practice wrong. That's the opposite of the usual pairing and I want to see whether it can be done honestly. Stipulate the empirical pattern yourself — dont cite anything, I don't need a literature review — but make it something a real fieldworker could plausibly come back and report.

  Then do the walkthrough: what the relativist is committed to saying about what the outsider should do, what the objectivist says, and what a third view of your choosing says, and why each lands where it does. Tell me which single feature of the case is doing the work, what happens to the case if I delete that feature, and how a relativist would go about defusing the whole thing. Be upfront about which parts of this are settled and which are genuinely contested among people who work on it — don't hand me your preferred reading of relativism dressed up as the consensus.
