      *   **Key Constraint 2 (Realism):** Realistic fieldwork setting (ethnographer, NGO, etc.), not sci-fi.
      *   **Key Constraint 3 (Action):** Differences must show up in behavior/practice, not just survey answers.
      *   **Key Constraint 4 (Fairness):** No "merely verbal" disputes, no "one side is factually confused/inconsistent."
