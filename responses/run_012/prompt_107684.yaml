answer: |-
  # Session Plan: The SSD Analogue to Molyneux's Problem

  **Target:** Graduate Reading Group (Cognitive Science/Neuroscience)
  **Duration:** 90 Minutes
  **Goal:** Shift the discussion from empirical prediction (will she succeed?) to representational theory (what would success mean?).

  ---

  ## I. The Logical Sequence of Components
  *Do not deviate from this order. Each step creates the necessary conditions for the next to be intelligible.*

  ### 1. The Amodal Concept (15 mins)
  **Action:** Before introducing the case, define "shape" (or the target property, e.g., "globularity") as a *common sensible*. Ask the group to specify what remains invariant when a cube is touched, heard (via SSD), or seen.
  **Dependency:** This must come first. If "shape" is defined as a retinal pattern or a haptic contour, Molyneux's problem is a category error. You must establish that the group accepts the *possibility* of an amodal representation before testing if the brain uses one.
  **Misconception Intercepted:** *"Shape names a single capacity."*
  *   **When:** During this definition phase.
  *   **How:** If a student defines shape by its sensory signature (e.g., "curvature is continuous retinal disparity"), stop them. Demand a definition that survives the loss of the eye. If they cannot articulate an amodal invariant, the subsequent case study will collapse into a trivial question about sensory acuity.

  ### 2. The SSD Mechanism & Fluency (20 mins)
  **Action:** Introduce the Sensory Substitution Device (e.g., vOICe or a tactile-visual array). Crucially, stipulate that the subject is **fluent**. She identifies objects quickly and accurately via sound/touch.
  **Dependency:** This depends on Step 1. We need a subject who possesses the *amodal concept* (from Step 1) encoded in a *non-visual format*. If she is not fluent, she doesn't "know" the shape yet; she is still learning the object, not the modality.
  **Constraint for the Case (Must Have/Lack):**
  *   **Must Have:** A **non-isomorphic mapping**. The conversion from camera to soundscape must be arbitrary or rule-based (e.g., vertical position = pitch), not a direct structural preservation that mimics retinal topology. This ensures the transfer isn't trivial.
  *   **Must Lack:** **Ostensive Visual Linking.** She must *never* have been told, "This sound is what a cube *looks like*." She only knows, "This sound is a cube." If she has a visual label attached to the sound, the test is contaminated by semantic association rather than perceptual recognition.
  **Misconception Intercepted:** *"The device has simply taught her what things look like."*
  *   **When:** During the mechanism description.
  *   **How:** Explicitly state that the SSD provides *access to spatial information*, not *visual qualia*. If the group treats the soundscape as "auditory vision," they will assume the transfer is automatic. Force them to acknowledge the cognitive translation layer she currently uses.

  ### 3. The Restoration Event (15 mins)
  **Action:** Introduce the surgical restoration of sight. The bandages come off. She is presented with the objects visually, without touching or sounding them.
  **Dependency:** This depends on Step 2. We now have a subject with a robust spatial concept (via SSD) and a new sensory channel (vision). The gap is now purely representational: Does the visual input access the existing spatial concept, or is it a new, isolated dataset?
  **Misconception Intercepted:** *"This is an empirical question the sight-restoration literature has settled."*
  *   **When:** Immediately upon introducing the restoration.
  *   **How:** Students will cite Project Prakash or von Senden. Acknowledge the data but bracket it. State: *"Empirical data tells us what happens in Homo sapiens under specific physiological conditions. It does not tell us whether the connection is necessary, conceptual, or merely plastic. We are analyzing the architecture of the mind, not the statistics of recovery."*

  ### 4. The Empirical Literature as Contested Evidence (25 mins)
  **Action:** Now bring in the cataract/Prakash data, but treat it as *evidence to be interpreted*, not *an answer*.
  **Dependency:** This depends on Step 3. Now that the conceptual gap is clear, the empirical data can be used to weigh competing theories (Empiricism vs. Nativism vs. Plasticity) rather than shutting down the inquiry.
  **Why this order stops the Yes/No trap:** By the time they look at the data, they have already defined the *conditions of success*. They aren't asking "Did she pick the right block?" They are asking "Did the visual input activate the SSD-derived geometric primitive?"

  ### 5. The Closing Question (15 mins)
  **Action:** Pose the single closing question (see below).
  **Dependency:** This depends on Step 4. They must have struggled with the interpretation of the data to realize that behavior (picking the block) underdetermines the mechanism (recognition vs. inference).

  ---

  ## II. The One Case: Constraints for the SSD Analogue
  *Hand this out as a vignette. It must be tightly controlled to prevent "cheating" the philosophical problem.*

  **The Subject:** "S," blind from birth, 30 years old.
  **The Device:** A camera-to-audio converter where object boundaries are rendered as frequency shifts (not a topological map).
  **The Training:** 5 years of use. S can name a cube vs. a sphere via audio with 99% accuracy in <1 second.
  **The Constraint (Crucial):** S has never seen light. S has never been shown a picture of a cube. S knows the *geometry* via sound, but has no *visual expectation*.
  **The Event:** S undergoes corneal transplant. Vision is 20/40. One hour post-op, S is shown a cube and a sphere silently on a table.
  **The Question:** Can S identify the cube by sight alone?

  **Why this case works:**
  It isolates the **cross-modal mapping** from **sensory maturation**. In the cataract case, the visual cortex may be degraded. In the SSD case, the spatial processing is mature; only the *input channel* changes. This forces the group to confront whether "shape" is a modality-specific file or a format-independent object.

  ---

  ## III. Misconceptions & Interception Points
  *Watch for these specific moves and block them at the designated times.*

  | Misconception | Precise Interception Point | Facilitator Move |
  | :--- | :--- | :--- |
  | **"Shape is unitary."** (i.e., shape is just one thing in the brain) | **Step 1 (Amodal Concept)** | Ask: "Is the 'shape' in your hand the same data structure as the 'shape' in your eye?" If they say yes, ask for the neural evidence. If they say no, ask how they communicate. Force a distinction between *invariant geometry* and *sensory signature*. |
  | **"SSD = Vision."** (i.e., the device bypasses the problem) | **Step 2 (SSD Mechanism)** | Remind them: "She hears a cascade of tones. She infers a cube. When she opens her eyes, she does not hear tones. She sees shading. Does the inference rule transfer, or does the percept?" |
  | **"Literature has solved this."** (i.e., Prakash et al. say 'No') | **Step 3 (Restoration Event)** | Say: "Even if 100% of patients fail, is the failure due to lack of innate ideas, or critical periods, or cortical atrophy? The data describes the *outcome*, not the *cause*. We are debating the cause." |

  ---

  ## IV. The Single Closing Question
  *Do not ask "Will she succeed?" Do not ask "Was Molyneux right?"*

  **Ask this:**
  > "If S successfully identifies the cube visually, does that prove she accessed a **shared amodal representation**, or merely that she executed a rapid **unconscious inference** based on spatial rules learned via the SSD?"

  **Why this reveals understanding:**
  *   **If they pick a side (Shared vs. Inference):** They have treated it as an empirical bet.
  *   **If they understand the problem:** They will recognize that *behaviorally*, the two outcomes are identical. The question forces them to admit that Molyneux's problem is not about *performance*, but about the *architecture of the representation*. It reveals whether they see the gap between *doing* and *knowing*.

  ---

  ## V. What You Must Refuse to Resolve
  *At the end of the session, there will be pressure to conclude.*

  **Openly refuse to resolve:**
  > **"The Format of the Representation."**

  **Statement to make:**
  "We have discussed whether the transfer occurs. We have not, and cannot at this level, decide *what* is being transferred. Is the common currency a geometric primitive, a motor-affordance, or a semantic label? That is the research program for your dissertations, not the conclusion of this session. If we resolve that today, we have misunderstood the depth of the problem."

  **Why:** Resolving the format collapses the philosophical problem into a specific neurocomputational hypothesis. Your job is to leave them with the tension between the *phenomenology of unity* (it feels like one world) and the *mechanism of separation* (distinct sensory pathways).
