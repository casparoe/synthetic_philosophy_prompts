  1. Does distinguishing between claims about a perceptual faculty's actual track record and its counterfactual robustness across conditions dissolve the easy-knowledge objection, or does a non-trivial problem remain for views permitting non-inferential perceptual justification?
  2. Current bootstrapping debates treat reliability as a monolithic proposition, overlooking how counterfactual sensitivity functions differently from actual success rates, which is a structural distinction within externalism rather than a revival of the internalist demand for antecedent justification.
  3. I will construct modified bootstrapping scenarios that isolate track-record reasoning from counterfactual variation to test whether the objection persists, using conceptual analysis rather than a historical survey to directly evaluate the logical force of the argument.
  4. Success entails demonstrating that the objection either vanishes or targets only a specific subset of reliabilist theories, while failure would occur if the distinction proves extensionally equivalent to existing solutions or collapses into a trivial restatement of the safety condition.
  5. The nine-month timeline allows for a complete analysis of the distinction's impact on dogmatism and reliabilism, but if the central distinction fails to hold, I will cut the comparative assessment to document why the unified reliability claim remains indispensable for epistemic theory.
