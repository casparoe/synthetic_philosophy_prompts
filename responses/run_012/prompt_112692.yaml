  11. **Final Polish:** Check tone. Ensure it's analytical, not prescriptive. Ensure the distinction between *behavior* and *belief* is clear. (Proceed to generate output based on this structure.)

  *(Self-Correction on Friend B's usage)*: Friend B says "we shouldn't judge the customs of other cultures at all." This is a meta-claim. They are using "When in Rome" to mean "When *they* are in *their* Rome, they do as *they* do, so who are *we* to judge?" This is a crucial distinction. It shifts the "You" from the speaker to the subject. I need to make sure Reading 3 captures this reflexive use.

