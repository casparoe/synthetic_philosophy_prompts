      *   *Item 5: The Power/Coercion Reading.* (Might makes right).
          *   Status: Descriptively true, normatively false.
          *   Friend A implies this.
      *   *Item 6: The Ontological Reading.* (Become a Roman, not just act like one).
          *   Status: False/Problematic.
          *   Friend A's extreme version.

  6.  **Refining the "Tight/Loose" Connection:**
      *   Need to explicitly state which readings presuppose which cultural context.
      *   Tight cultures make the "Contractual" reading stronger (norms are clear and enforced).
      *   Loose cultures make the "Prudential" reading weaker (deviance is tolerated).

  7.  **Addressing the Friends' Arguments:**
