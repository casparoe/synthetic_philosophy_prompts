      *   **Synthesize:** The user's intuitions point toward a **Hybrid Theory** (Negative + Positive).

  6.  **Drafting the Argument (Iterative refinement):**
      *   *Introduction:* Validate the insight. The "No Craving" thesis is powerful but incomplete. It's a theory of *relief*, not *life*.
