prompt: |-
  I have just finished a long argument with a friend who works on decision theory and AI. His position, as best I can state it, is that an agent embedded in a world cannot directly observe which ontology it is embedded in: its observations are already expressed in its own concepts, so it cannot compare its ontology to the world's ontology without already having solved the problem of identifying the mapping between them. He insists this is a distinct problem from ordinary empirical uncertainty — not a lack of evidence about which world the agent is in, but a lack of grip on what its own terms refer to — and that it makes a certain kind of uncertainty inaccessible in principle.

  I am a data engineer and have spent my career on ETL pipelines and master data management. Restate his position as faithfully as you can in the vocabulary I actually use: schemas and instances, source-to-target mappings, data provenance, entity resolution, and the difference between a query and the metadata about the query. A useful starting point: treat the agent's ontology as a schema that is both the query language and the data, and the world's ontology as a source system whose schema the agent can never inspect directly — it sees only rows that have already been transformed by the very mapping it is trying to learn. Then give me the residue report: which parts translate cleanly, which have to be distorted to fit, and which have no counterpart at all. Is the residue a defect of my vocabulary or a sign that his claim is less clear than it looks? My instinct is that this is just schema matching with extra steps; tell me whether that instinct is right or whether it is missing something. Please answer in American English.
