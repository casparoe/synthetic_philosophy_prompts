  2. He would deny that sheer numbers alter the species of consideration owed, since moral weight derives from the substantial form and kind of being rather than the aggregate count of individuals.
  3. While the universe requires diversity, insects hold no standing independent of their order to higher creatures, meaning deliberate extermination is permissible when required for human good or ecological balance.
  4. The claim that cruelty is wrong only for its human effects would remain intact, because without rational dominion insects cannot be subjects of justice regardless of the astronomical scale of their suffering.
  5. His counsel would rest entirely on the certainty of human virtue rather than the probabilistic calculus of suffering, urging moderation in swatting and harvesting to avoid vice rather than to mitigate uncertain pain.
