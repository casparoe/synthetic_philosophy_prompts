      *   *Practical Counsel:* He would advise prudence. Avoid unnecessary destruction (wastefulness is vice), but prioritize human health/utility. Uncertainty about sentience isn't really an issue for him (he thinks he knows they feel pain but lack reason), but he would caution against cultivating a cruel disposition.

