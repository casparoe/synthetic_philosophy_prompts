answer: |-
  **The Case**

  A national health service mandates a security patch for 10 million staff terminals. The update introduces a 30-second login latency for every user, perceptible and frustrating, occurring twice daily for one week (total aggregate delay: ~23,000 years of human time). To meet the deployment window, one sysadmin works a 36-hour continuous shift and suffers a severe, permanent spinal injury requiring lifelong pain management and mobility aids. The decision is binary: deploy and accept the injury, or cancel and accept the latency.

  ***

  **1. The Verdicts**

  *   **Total Utilitarianism:** Adds the units. 23,000 years of aggregate frustration clearly outweighs 1 lifetime of spinal pain in a raw sum. **Verdict:** Deploy (sacrifice the sysadmin).
  *   **Prioritarianism:** Sums the harm but weights the welfare of the worse-off more heavily. Since the sysadmin is drastically worse off than any single annoyed user, the weight on their suffering increases. However, because the aggregate sum (23,000 years) is so massive, it typically still overwhelms the weighted single injury unless the priority weight is extreme. **Verdict:** Likely Deploy, but much more conflicted than Utilitarianism. (Note: You expected these to agree; they usually do on massive scales, but Prioritarianism is the bridge view that often flips to protect the individual if the numbers aren't this extreme).
  *   **Threshold (De Minimis) View:** Sets a severity floor. A 30-second annoyance is below the threshold of moral significance (it counts as zero). The spinal injury is above the threshold. **Verdict:** Cancel (protect the sysadmin). The 10 million annoyances do not sum because they individually fail to clear the bar.

  **2. The Crux and Break-Even**

  The feature doing the work is **Aggregation of Sub-Threshold Harms**. The Utilitarian view allows tiny harms to stack into a large moral weight; the Threshold view treats them as zero regardless of quantity.

  *   **Break-Even:** For the Utilitarian, the flip happens when ` (Headcount × Annoyance) < (Injury Severity) `. If the injury equals 50 years of "normal" life quality, and the annoyance is 1 minute of frustration, you need fewer than ~26 million minutes of annoyance (approx. 50 years aggregate) to flip the verdict to "Protect the One." In my case, I set the aggregate to 23,000 years, so it's not fragile; the Utilitarian will sacrifice the one unless you drop the headcount to a few thousand.
  *   **For the Threshold View:** The break-even is not a ratio; it's a binary switch. If the annoyance drops to 29 seconds (below the line), the headcount could be 10 billion and the verdict remains "Protect the One."

  **3. The Variants**

  *   **(a) Concentrated Small Harm:** Suppose the 23,000 years of latency lands on *one* person instead of 10 million. That person loses a lifetime. **Change:** Prioritarianism and Threshold views now align to save the *latency victim* over the *injury victim*, because the latency is now a "Big Harm." Utilitarianism is indifferent; the sum is the same. This proves the **spread** matters for non-Utilitarian views.
  *   **(b) Nudging the Line:** Make the latency 1 second (firmly below threshold) and the injury a minor sprain (firmly above threshold, but barely). **Change:** The Threshold view still ignores the 10 million people to save the sprain. This exposes the **cliff-edge problem**: a microscopic change in severity creates a massive change in moral obligation.

  **4. Defending the "Worst" View**

  Let's assume the **Threshold View** looks worst here (ignoring 10 million people to save one person from a spinal injury seems irrational to an engineer).

  *   **The Attack:** "You drew the line wherever you needed to get the answer you wanted. If 30 seconds counts as zero, why not 31? If 10 million zeros don't make a one, your math is broken. You're privileging the visible victim over the invisible crowd."
  *   **The Threshold Defense:** "Moral law operates like legal law: *de minimis non curat lex* (the law does not concern itself with trifles). If we count every second of annoyance, we become paralyzed and cannot act. Rights are side-constraints, not weights. The sysadmin has a right not to be maimed; the users have no right to a frictionless login. Aggregating trivialities violates the separateness of persons."

  ***

  **Straight Answer: Is "Spread vs. Pile" the Crux?**

  **It is not a red herring; it is the mechanism.**

  If you pile the small harms on one person, they cease to be "small harms" and become a "large harm." In Variant (a), the annoyed person becomes a ruined person.
  *   **For Utilitarianism:** The spread is irrelevant (Sum is Sum).
  *   **For Prioritarianism:** The spread is critical. It prevents the "many" from becoming a single "worse-off" person who would demand priority weighting.
  *   **For Threshold:** The spread is critical. It keeps the individual incidents below the severity line.

  You keep flip-flopping because you are intuitively switching between Utilitarian math (where spread doesn't matter) and Human intuition (which is Prioritarian/Threshold, where spread matters immensely). The "absurd exponent tower" argument fails for you because it hides the spread behind a number you can't visualize. In my spreadsheet case, the spread is visible: 10 million distinct lines of data vs. 1 line. The moral tension comes from whether those 10 million lines can be summed into a single column of "Harm." If you say yes, you're a Utilitarian. If you say no, you're a Threshold theorist.
