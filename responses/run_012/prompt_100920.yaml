answer: |-
  This is a classic problem in contemporary metaphysics, specifically the literature on **dispositional properties** (fragility, solubility, etc.). Your friend is navigating the debate between the **Simple Conditional Analysis (SCA)** and **Categorical Base** theories, dealing with what are known as **Finks** and **Masks**.

  Here is the breakdown of the rules she is using, the prediction for the new case, the state of the field, and the test case that would settle her specific theoretical commitment.

  ### 1. The Rules She Is Running
  Based on her five verdicts, we can reverse-engineer her theoretical commitments. She is explicitly rejecting the "folk" definition of fragility.

  *   **Rule 1: Rejection of the Simple Conditional Analysis (SCA).**
      *   *The SCA says:* $X$ is fragile iff if $X$ were struck, $X$ would break.
      *   *Her Data:* Case 2 (Sorcerer Protector) breaks the "only if" (it wouldn't break, but is fragile). Case 4 (Sorcerer Shatterer) breaks the "if" (it would break, but is not fragile).
      *   *Conclusion:* She believes fragility is not defined by what *would* happen, but by what the object *is*.
  *   **Rule 2: The Intrinsicness Constraint.**
      *   *Her Data:* Case 2 & 3 (External prevention) $\rightarrow$ Still Fragile. Case 5 (Intrinsic inability) $\rightarrow$ Not Fragile.
      *   *Conclusion:* Dispositions depend on the internal, categorical structure of the object, not on external circumstances. External interference (Masks) does not remove the disposition; intrinsic inability does.
  *   **Rule 3: The Pre-Stimulus Base.**
      *   *Her Data:* Case 2 (Sorcerer) $\rightarrow$ Fragile.
      *   *Conclusion:* The disposition is determined by the object's properties *before* the stimulus occurs. The fact that the outcome is prevented *during* the stimulus doesn't retroactively erase the disposition.

  ### 2. The Prediction: What Will She Say?
  **Verdict:** She will almost certainly say the Self-Protecting Glass is **Fragile**.

  **Why?**
  This case is known in the literature as an **Intrinsic Fink** (specifically, a finkish lack of manifestation).
  *   **Alignment with Rule 1 & 3:** Like the Sorcerer Protector (Case 2), the glass possesses the "fragile make-up" prior to the strike. The fact that the breaking is prevented *by the strike itself* is a detail about the manifestation, not the disposition. Since she ruled that external prevention (Sorcerer) doesn't negate fragility, she should logically rule that internal prevention (Mechanism) doesn't either, provided the "fragile structure" exists right up until the moment of impact.
  *   **Alignment with Rule 2:** The prevention mechanism is triggered *by* the strike. Before the strike, the object is intrinsically structured like fragile glass. It does not have the "Intrinsic Inability" of Case 5 (which was unbreakable *under any blow* from the start).

  **The Betting Line:**
  I would bet heavily on **Fragile**. Her pattern shows she is a **Categorical Base Theorist** (likely following David Lewis's 1997 reconstruction). She locates the disposition in the static properties the object holds *before* the test, not in the dynamic outcome of the test.

  ### 3. Consensus vs. Dispute
  You asked to separate what is agreed upon from what is fought over. This is crucial because your friend is operating in a field where the "obvious" answer is actually the subject of a 30-year war.

  **The Consensus (Settled):**
  *   **The Simple Conditional Analysis is False.** Since C.B. Martin's "Electro-Fink" paper (1994) and David Lewis's response (1997), virtually all metaphysicians agree that you cannot define dispositions purely by "If struck, then break." Cases 2 and 4 from your friend's list are now standard textbook examples proving SCA fails. If anyone argues for SCA today, they are considered out of the loop.
  *   **Masks are Extrinsic.** There is general agreement that external interference (like the foam packing in Case 3) does not remove the disposition.

  **The Dispute (Genuinely Contested):**
  *   **The Status of Intrinsic Finks.** This is where your new case lands. While Lewis argued that finkish dispositions *are* possible (and the glass is fragile), other prominent philosophers (like Stephen Mumford or Alexander Bird) argue that **true dispositions cannot be finkish.**
      *   *Side A (Lewisian):* Dispositions are contingent on the base. If the base exists before the strike, it's fragile, even if it vanishes during the strike. (Your friend seems to be here).
      *   *Side B (Dispositional Essentialists):* A disposition is a fundamental power. If the power vanishes the moment you try to use it, it wasn't a real power to begin with. They might argue this glass is **Not Fragile** because it lacks the *causal power* to break, which is essential to fragility.
  *   **Intrinsicness.** There is ongoing debate about whether dispositions *must* be intrinsic. Some argue that if the "protection" is internal (like the mechanism in your new case), it counts as part of the object's nature, potentially making it more like Case 5 (Unbreakable Glass) than Case 2 (Sorcerer).

  ### 4. The Case That Forces the Issue
  To truly test your friend's specific theoretical commitment (and to distinguish between the Lewisian view she seems to hold and the Dispositional Essentialist view she might be drifting toward), you need to present her with a **Reverse Fink** (or "Finkish Presence").

  **The New Case:**
  > "A steel ball that is intrinsically hard and unbreakable. However, it is built with an internal sensor such that the instant it is struck, it instantly transforms into fragile glass *before* the force transfers, and then shatters."

  **Why this forces the issue:**
  *   **Outcome:** It breaks when struck (matches the conditional "If struck, then break").
  *   **Base:** It is intrinsically unbreakable *before* the strike.
  *   **The Conflict:**
      *   If she says **"Fragile"**: She is a pure Counterfactualist in disguise. This contradicts her ruling on Case 4 (Sorcerer Shatterer), where she said "Not Fragile" despite it breaking.
      *   If she says **"Not Fragile"**: She is consistent with her Categorical Base view (the pre-strike structure determines the disposition).
      *   **The Kicker:** If she says "Not Fragile" here, but "Fragile" on the Self-Protecting Glass (my prediction above), she is committed to the view that **the existence of the base prior to stimulus is necessary and sufficient**, regardless of the outcome.
      *   **The Trap:** Some philosophers argue that if the transformation is *intrinsic*, the object in the Self-Protecting Case is actually **Not Fragile** (because its total intrinsic nature includes the safety mechanism), while the Steel Ball in this Reverse Case is **Not Fragile** (because its total intrinsic nature is hardness).

  **Recommendation:**
  Present the **Reverse Fink** (Hard Steel that turns to Glass when struck).
  *   If she says **"Fragile"**, she has contradicted her ruling on the Sorcerer Shatterer (Case 4).
  *   If she says **"Not Fragile"**, she is a consistent Base Theorist.
  *   If she hesitates, you have found the exact boundary of the current philosophical dispute: **Does an intrinsic reactive mechanism count as part of the "categorical base" that defines the disposition?**

  ### Summary for Your Friend
  Tell her you predict she'll call the Self-Protecting Glass **Fragile**, based on her commitment to the **Intrinsic Base** view over the **Conditional Outcome** view. Tell her you know the SCA is dead (consensus), but that you suspect she hasn't fully settled the **Intrinsic Fink** problem (dispute). Then hit her with the **Reverse Fink** (Hard Steel that becomes Glass when struck) to see if her theory holds symmetrically.
