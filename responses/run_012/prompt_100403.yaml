      *   *Q2 (Ratchet):* Cite the "backfire effect" or general trust erosion literature implicitly.
      *   *Q3 (Mechanism):* The colleague's testimonial point is strong. I should endorse that as the bridge between Arendt and analytic epistemology.
      *   *Q4 (Determinacy):* This is the biggest risk. If "shared factual world" is meaningless, the claim is false. I need to operationalize it to give it a probability.
