answer: |-
  Your friend has given you a remarkably coherent summary of Tolstoy's *What Is Art?* (1897), especially for a conversation recap. She has captured the spirit of his argument, but in smoothing out the edges, she has turned some of his nuanced (and often radical) philosophical claims into simpler rules of thumb.

  Tolstoy is notoriously difficult because he is arguing against the entire aesthetic tradition of his time. To understand where your friend's summary holds up and where it cracks, we need to look at his specific definitions of **Infection**, **Accessibility**, and **Religious Consciousness**.

  Here is a breakdown of the summary into what is accurate, what is a simplification, and what Tolstoy would likely deny.

  ### 1. What is Accurate
  *   **Art as Transmission (Infection):** Your friend is right that Tolstoy defines art not by beauty or skill, but by communication. He uses the metaphor of "infection." The artist experiences a feeling and intentionally transmits it so the audience feels the *same* feeling. If the audience doesn't "catch" it, it isn't art.
  *   **Sincerity is Key:** The summary implies the artist must actually feel the emotion. Tolstoy is adamant on this: if the artist is faking the emotion to impress people, it is "counterfeit art," regardless of how skilled the technique is.
  *   **The Goal is Union:** The claim that art should "make us feel closer to one another" is correct. For Tolstoy, the purpose of art is to replace individual isolation with a sense of shared human experience. It is a tool for human unity.

  ### 2. What is a Simplification (The "Neat" Parts)
  *   **"Expression of Emotion":** This is a common gloss, but Tolstoy would say it is incomplete. Mere expression (like a baby crying or a person venting anger) is not art. Art requires the **intention** to transmit that feeling to others. It is a deliberate act of will, not just an outpouring.
  *   **"Simple stuff that peasants enjoy":** Tolstoy did value folk art, but not simply because it was "simple" or made by peasants. He valued it because it was **universal**. Peasant songs were sung by everyone in the community; they united the village. Aristocratic art (opera, symphonies) was enjoyed only by a tiny, educated elite; it divided society. He valued peasant art *because* it reached a wide audience, not because simplicity was an inherent virtue.
  *   **"Moral... in the sense that it should make us feel closer":** This is mostly right, but Tolstoy had a very specific definition of "moral." He believed art must align with the "religious consciousness of the time." For him, this meant Christian ethics (brotherhood, non-violence, humility). Art that united people in hatred (like a patriotic war song) or in lust (like a sensual novel) would be considered **bad art**, even if it was sincere and infectious.

  ### 3. What Tolstoy Would Deny (The Errors)
  *   **"The more people it moves, the better it is."** This is the most dangerous simplification. Tolstoy argues that **Accessibility** (how many people *can* understand it) is one criterion for *good* art, but it is not the *only* criterion.
      *   If a work moves a million people but encourages violence or sexual lust, Tolstoy calls it "bad art."
      *   If a work moves a million people but the feeling is trivial (mere amusement), he calls it "insignificant art."
      *   To be "good art," it must move many people **AND** transmit feelings that advance human brotherhood.
  *   **Why he condemned Shakespeare and Beethoven:** Your friend suggests he condemned them for being "aristocratic and complicated." While he did think they were exclusive to the upper class, his specific critiques were deeper:
      *   **Shakespeare:** Tolstoy wrote a famous essay arguing Shakespeare was not a true artist because his characters lacked a consistent moral center. He found them insincere and their language unnatural. He didn't just think Shakespeare was "elite"; he thought Shakespeare was **immoral** because his plays glorified power and lacked religious perception.
      *   **Beethoven:** Tolstoy famously found Beethoven's music (specifically the 9th Symphony) confusing and physically overwhelming. He didn't condemn it merely for being complicated; he condemned it for being **obscure**. He felt the music forced an emotion upon him that he didn't understand or share, which violated the rule of clear "infection." He viewed it as a product of a specialized, professionalized art world that had lost touch with real human life.

  ### Addressing Your Specific Concerns

  **1. Is "Expression of Emotion" the right way to put it?**
  It is close, but "Transmission of Feeling" is more precise. Tolstoy distinguishes art from craft. A carpenter expresses skill to make a chair; an artist transmits a feeling to create unity. The "stranger claim" you sensed is that Tolstoy views art almost biologically—as a function necessary for the survival of the human species, like digestion or reproduction. It isn't about "beauty"; it's about the circulation of feeling to keep humanity connected.

  **2. Did he condemn Shakespeare/Beethoven for being aristocratic?**
  He condemned them for being products of an **exclusive professional class** that had lost touch with the "religious consciousness" of the common people. "Aristocratic" is a shorthand for this, but the real issue was **insincerity** and **lack of universal content**. He believed they were writing for a tiny clique of critics and patrons, not for humanity.

  **3. Does the conclusion "Whatever moves the most people is the best art" survive?**
  **No.** This conclusion does not survive a careful reading.
  If "moves the most people" were the only test, then propaganda, pornography, or patriotic war anthems would be the "best" art, because they can be incredibly infectious and reach millions. Tolstoy explicitly rejects this.

  For Tolstoy, the hierarchy of art looks like this:
  1.  **Good Art:** Infectious + Accessible to all + Promotes Christian brotherhood/unity. (e.g., The story of Joseph in Genesis, certain folk tales, *Uncle Tom's Cabin*).
  2.  **Bad Art:** Infectious + Accessible + Promotes division, lust, or pride. (e.g., Patriotic poems, sensual novels, much of Wagner's opera).
  3.  **Counterfeit Art:** Not infectious + Imitates art for money or fame. (e.g., Most of the poetry and drama of his time, including Shakespeare, in his view).

  ### The Verdict on Your Friend's Summary
  Your friend's summary is a **strong "elevator pitch"** that captures Tolstoy's democratic spirit and his rejection of elite aesthetics. However, it misses his **moral absolutism**.

  Tolstoy was not a populist who thought "the people are always right." He was a moralist who thought "the people's *religious consciousness* is the barometer of truth." He didn't want art that *happened* to be popular; he wanted art that was *capable* of being understood by everyone because it dealt with fundamental human truths.

  **Corrected Conclusion:**
  Tolstoy's view is not "whatever moves the most people is the best art."
  It is: **"The best art is that which sincerely transmits feelings of human unity to the widest possible audience."**

  The "widest possible audience" is a requirement for the art's *form* (it must be clear), but the "feelings of human unity" are the requirement for the art's *content* (it must be good). Your friend's summary kept the form but dropped the content constraint, which changes the meaning significantly.
