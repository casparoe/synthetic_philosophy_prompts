answer: |-
  ### Specification for a Theory of Intelligence

  To evaluate competing accounts of intelligence, you need a set of criteria (desiderata) that a successful theory should satisfy. Below is a list of five such requirements, derived from the cases you provided. Each entry includes the requirement, the case that motivates it, and a classification of whether it is a logical necessity or a theoretical preference.

  #### 1. The Requirement of Non-Triviality
  *   **Specification:** The theory must distinguish between *computing* an answer and *merely outputting* an answer. Intelligence requires a non-trivial internal process that mediates between input and output.
  *   **Motivation:** **The Pocket Calculator.** A calculator returns correct arithmetic answers faster than any human, yet we do not call it intelligent. If a theory defines intelligence solely by the correctness or speed of the output, it falsely classifies the calculator as intelligent. The theory must explain why the *mechanism* matters, not just the result.
  *   **Classification:** **Genuine Constraint.** Without this, the concept of intelligence collapses into "functionality," making every tool intelligent.

  #### 2. The Requirement of Adaptive Generality
  *   **Specification:** Intelligence must involve the capacity to transfer skills or strategies to novel domains, rather than excelling only in a fixed context.
  *   **Motivation:** **The Chess Engine and The Savant.** A chess engine defeats grandmasters but cannot play checkers or navigate a room. A savant may calculate calendar dates instantly but cannot manage daily living. If a theory allows high intelligence in a system that is helpless outside its narrow niche, it conflicts with our intuition that intelligence involves *coping* with the unknown.
  *   **Classification:** **Camp Preference (Generalism vs. Modularism).** Psychometric theorists (who posit a general factor, $g$) treat this as a constraint. Evolutionary psychologists (who view the mind as a swarm of specialized tools) treat this as a misconception. A theory must take a stance here.

  #### 3. The Requirement of Substrate Neutrality
  *   **Specification:** Intelligence must be definable by the organization of information and control, not by the physical material (biology vs. silicon) or the presence of a nervous system.
  *   **Motivation:** **The Slime Mould and Ant Colony.** These systems solve routing problems without neurons. Conversely, a group of humans can solve problems no individual could. If a theory requires a "brain" or a single individual agent, it cannot account for collective or biological computation that behaves intelligently.
  *   **Classification:** **Camp Preference (Computationalism vs. Biological Naturalism).** AI researchers demand this; traditional biologists often resist it.

  #### 4. The Requirement of Goal-Directedness
  *   **Specification:** Intelligent action must be oriented toward achieving a goal or reducing uncertainty in an environment, rather than simply occurring.
  *   **Motivation:** **The Oracle Device.** The Oracle gives correct answers but has no memory, goals, or stake in the outcome. It does not *try* to be right; it simply *is* right. Intelligence implies an agent acting *for* a purpose. Without a goal, there is no problem to solve, only a state of affairs.
  *   **Classification:** **Genuine Constraint.** Action without direction is merely movement or reaction, not intelligence.

  #### 5. The Requirement of Fallibility
  *   **Specification:** An intelligent system must be capable of being wrong. The possibility of error is a necessary condition for the attribution of intelligence.
  *   **Motivation:** **The Oracle Device (again) and The Calculator.** If a system cannot fail (like the Oracle, which is stipulated to be infallible), it is not reasoning; it is a truth-source. Reasoning implies searching a space of possibilities where some paths lead to error. If you cannot be wrong, you are not "solving" a problem.
  *   **Classification:** **Genuine Constraint (Philosophical).** This is often overlooked but logically necessary to distinguish intelligence from omniscience or deterministic law.

  ***

  ### Inconsistencies Within the Specification

  You asked to know if these requirements can all be satisfied together. They cannot. There are two primary tensions in this list that force you to choose between competing theoretical camps.

  **1. The Tension between Substrate Neutrality and Non-Triviality**
  *   **The Conflict:** If you enforce **Substrate Neutrality** (Desideratum 3), you must admit that a slime mould or a well-organized circuit is capable of intelligence if it solves the problem. However, if you enforce **Non-Triviality** (Desideratum 1), you must exclude simple systems that solve problems through brute physics (like the slime mould's growth patterns or the calculator's gates) rather than "processing."
  *   **The Result:** You cannot simultaneously hold that *any* substrate can be intelligent and that *simple* substrates (like calculators) are not. If organization is all that matters, at what level of complexity does a circuit become a mind? This list does not provide a cutoff, meaning a theory satisfying one may violate the other.

  **2. The Tension between Success and Fallibility**
  *   **The Conflict:** We usually identify intelligence by **Success** (solving the problem). However, **Fallibility** (Desideratum 5) demands that the system *could* have failed. The Oracle Device succeeds perfectly but is excluded by Fallibility. The Chess Engine succeeds but is excluded by Generality.
  *   **The Result:** A theory cannot define intelligence purely by *outcome* (Success) because that includes the Oracle. But if it defines it by *process* (Fallibility/Generality), it risks excluding systems that are genuinely effective (like the ant colony) simply because their process is instinctual or rigid. You must choose: is intelligence about *winning* or about *how you play*?

  ***

  ### The Most Exclusionary Requirement

  You asked which single requirement does the most work to rule out the accounts people actually defend.

  While **Substrate Neutrality** rules out traditional human-centric psychology, and **Fallibility** rules out behavioral definitions of pure accuracy, the requirement that creates the most friction in current research is **The Requirement of Adaptive Generality**.

  Here is why:
  1.  **It rules out Narrow AI:** Almost all current artificial intelligence (including the Chess Engine case) is domain-specific. A theory demanding generality classifies modern AI as non-intelligent tools, not agents.
  2.  **It rules out Modular Psychology:** Evolutionary psychology often argues the human mind is a collection of specialized "modules" (like the Savant). If intelligence requires cross-domain transfer, this modular view is demoted to "collection of instincts."
  3.  **It pressures Psychometrics:** Even the psychometric $g$-factor theory struggles to prove that $g$ is a causal mechanism of *transfer* rather than just a statistical correlation between tests.
  4.  **It rules out Biological Instinct:** The slime mould and ant colony are highly successful but operate on fixed biological algorithms. They fail the Generality test.

  This requirement forces a theory to explain not just how a system solves *a* problem, but how it solves *new* problems. This is the hardest bar to clear, eliminating the Calculator, the Chess Engine, the Slime Mould, the Savant, and the Oracle, leaving only the "Generalist Human" as the paradigm case. It is the most restrictive filter because it demands a unified theory of cognition that very few existing accounts can fully deliver.

  Verdict: The Requirement of Adaptive Generality
