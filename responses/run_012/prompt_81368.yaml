      *   *Bentham's View:* Consent matters because it changes the *mischief*. Violence = pain to victim (mischief). Consensual = no pain to victim (no mischief).
      *   *Is it decoration?* No. It's crucial for the utility calculus. If there's consent, the "pain" side of the equation drops significantly. If the law punishes both equally, the law is irrational because it's punishing where there is no mischief.

