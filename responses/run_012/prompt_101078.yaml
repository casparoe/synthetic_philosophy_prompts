      *   **Solution Concepts:** Ex-ante optimization (planning mode) vs. Interim optimization (action mode). The standard solution often involves a mixed strategy (e.g., continue with probability $2/3$) rather than a pure strategy, even if one node is "better" to turn at, because you can't distinguish them.

