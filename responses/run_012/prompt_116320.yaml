answer: |-
  Here is a complete design for your 90-minute seminar session. It is built to be run with minimal setup, maximal student engagement, and a debrief that does the heavy philosophical lifting.

  ### **Session Overview**
  *   **Time:** 90 Minutes.
  *   **Students:** 12 (Divide into pairs for discussion, but individual play).
  *   **Materials:**
      *   20 opaque envelopes (Round 1). 1 contains a red card ("WIN"), 19 contain blue cards ("LOSE").
      *   12 "Author Sheets" (Round 2). Each lists 20 "Chapters" with the text: *"Author Confidence: 90%"*.
      *   Scorecards and pencils for each student.
      *   A pot of cheap tokens (poker chips or candy).
  *   **Core Mechanic:** The **Auditor Rule**. You score points for every true claim you submit, *but* if the conjunction of all your claims is false, you pay a massive penalty.

  ---

  ### **Part 1: The Game (35 Minutes)**

  #### **1. Instructions (5 Minutes)**
  Do not mention "Lottery," "Preface," "Belief," or "Probability." Read this script:

  > "We are playing two rounds of an Assertion Game. You are trying to maximize your token score.
  >
  > **The Rule:** On your scorecard, you may list any number of claims.
  > 1.  **Reward:** For every claim you list that turns out **TRUE**, you gain **10 tokens**.
  > 2.  **Penalty:** If **ANY** claim you list turns out **FALSE**, you lose **50 tokens**. (This is the Auditor Rule: you are asserting the conjunction of your list. If the conjunction fails, you pay).
  > 3.  **Constraint:** You must submit **at least one claim** per round.
  >
  > Your goal is to end with the most tokens. I will act as the Auditor. I will check the truth of your claims and apply the penalty if even one is wrong."

  *TA Note:* Write the scoring rule clearly on the board. Emphasize the **ANY** in the penalty clause.

  #### **2. Round 1: The Draw (10 Minutes)**
  *   **Setup:** Show the 20 envelopes. Explain: "One envelope contains a WIN card. Nineteen contain LOSE cards. I have shuffled them. You do not know which is which."
  *   **The Claim:** "You may claim of any specific envelope: *'This envelope contains LOSE.'*"
  *   **Action:** Students privately write down which envelopes they claim are LOSE (e.g., "Env 1, Env 2, Env 5...").
  *   **Reveal:** Open the envelopes one by one. Let the tension build. When the WIN card appears, mark the scorecards.
  *   **Scoring:**
      *   Count true claims ($\times 10$).
      *   If the WIN envelope was among their claims, subtract 50.
      *   *Observation:* Most students will claim many envelopes (10+). About half will get hit by the penalty.

  #### **3. Round 2: The Book (10 Minutes)**
  *   **Setup:** Hand out the "Author Sheets." Explain: "You are the author of a book with 20 chapters. You have checked your work. For each chapter, you are **90% confident** it is error-free. The chapters are independent."
  *   **The Claim:** "You may claim of any specific chapter: *'This chapter is error-free.'*"
  *   **Action:** Students privately mark which chapters they assert are error-free.
  *   **Reveal:** You (the TA) simulate the truth. Use a random number generator (or pre-rolled dice) live. For each chapter, roll a d10. If 1-9, it's True. If 10, it's False.
      *   *Crucial:* Do this visibly. Let them see that "90%" means errors *do* happen.
      *   *Likely Outcome:* With 20 chapters at 90%, the probability of *zero* errors is only $\approx 12\%$. It is highly likely at least one chapter fails.
  *   **Scoring:** Apply the same rule (+10 per True, -50 if Any False).
      *   *Observation:* Students who claimed all 20 (trusting the 90%) will almost certainly lose 50 tokens, netting a negative score despite having ~18 true claims.

  #### **4. Tally (5 Minutes)**
  *   Have students calculate their total score.
  *   Ask for a show of hands: "Who submitted more than 10 claims in Round 1? In Round 2?"
  *   Ask: "Who ended with a negative score?"

  ---

  ### **Part 2: The Debrief (55 Minutes)**

  #### **1. The Immediate Reaction (10 Minutes)**
  *   **Ask:** "Why did Round 2 hurt more than Round 1, even though 90% feels safer than 5% (the risk of any single lottery ticket winning)?"
  *   **Let them talk:** They will notice the independence vs. partition difference intuitively.
  *   **Ask:** "Who wanted to submit *all* claims in Round 2? Why?"
      *   *Target Answer:* "Because 90% is high. It feels irrational *not* to believe a claim that's 90% likely."
  *   **Ask:** "Who wanted to submit *all* claims in Round 1?"
      *   *Target Answer:* "Because 95% is even higher. But I knew one *had* to win."

  #### **2. Mapping the Paradox (15 Minutes)**
  Draw three circles on the board. Label them:
  1.  **The Threshold Principle:** If $Pr(P) > t$ (e.g., 0.9), you should accept $P$.
  2.  **Agglomeration:** If you accept $P$ and you accept $Q$, you accept $P \land Q$.
  3.  **Consistency:** You should not accept something false (or contradictory).

  *   **Walk through their gameplay:**
      *   "In Round 2, for a single chapter, $Pr = 0.9$. If your threshold is 0.9, Principle 1 says **Accept**."
      *   "You accepted Chapter 1. You accepted Chapter 2... You accepted Chapter 20."
      *   "By Principle 2 (Agglomeration), you accepted 'All chapters are error-free'."
      *   "But the dice showed an error. So your conjunction was False. Principle 3 (Consistency) says **Don't Accept**."
  *   **The Squeeze:** "You followed Principle 1 for every individual claim. You followed Principle 2 by submitting them together. Principle 3 punished you. You cannot satisfy all three."

  #### **3. Lottery vs. Preface: The Structural Difference (20 Minutes)**
  This is the core philosophical payoff.

  *   **The Lottery (Round 1):**
      *   **Structure:** The claims form a **partition**. Exactly one ticket wins.
      *   **The Trap:** If you accept "Ticket 1 loses" through "Ticket 19 loses," logic forces you to accept "Ticket 20 wins."
      *   **The Feeling:** It feels like a trick. You didn't look at Ticket 20. Why does accepting 19 losses force you to know the 20th is the winner?
      *   **Epistemic Point:** The contradiction here is *logical*. Given the setup, the conjunction of "1 loses... 19 loses" is *equivalent* to "20 wins." If you didn't have evidence for 20, you shouldn't have accepted the conjunction of 1-19.

  *   **The Preface (Round 2):**
      *   **Structure:** The claims are **independent**. It is possible (though unlikely) that all are true. It is possible all are false.
      *   **The Trap:** There is no logical contradiction in "All chapters are correct." The contradiction is *probabilistic*.
      *   **The Feeling:** It feels honest. "I checked each one, I'm 90% sure on each. I know I'm fallible, so I admit in the preface there's probably an error."
      *   **Epistemic Point:** The author asserts $C_1, ..., C_{20}$ (inside the book) AND asserts $\neg(C_1 \land ... \land C_{20})$ (in the preface).
      *   **Key Question to Class:** "In Round 1, you felt silly claiming all 20. In Round 2, you felt *reasonable* claiming all 20, even though the math punished you harder. Why?"
      *   **Answer:** In the Lottery, the falsity is *guaranteed* by the rules of the game (one must win). In the Preface, the falsity is only *likely*. We treat "Logical Impossibility" and "High Probability" differently in our belief norms.

  #### **4. Limitations & Degrees of Belief (10 Minutes)**
  Be honest about what the game didn't do.

  *   **Binary vs. Graded:** "In the game, you had to submit or not submit. That's 'Flat-Out Belief.' In real life, do you walk around saying 'I believe Chapter 1 is true' or do you hold a credence of 0.9?"
  *   **The Bayesian Escape:** "If you are a Bayesian, you don't have this problem. You just keep your credences at 0.9. You never 'accept' the conjunction fully. Your credence in the conjunction drops to 0.12. You never assert the falsehood."
  *   **The Cost:** "But if we only have degrees of belief, how do we ever *act*? How do we write the book? How do we cite the chapters? We seem to need 'Acceptance' to function, but Acceptance brings the paradox back."

  ---

  ### **Predictable Failure Modes & Live Fixes**

  #### **1. The "Declare Nothing" Strategy**
  *   **Prediction:** A clever student realizes the Conjunction Penalty makes large sets negative EV. They submit only 1 claim to guarantee profit, or try to submit 0.
  *   **Fix:**
      *   **Rule:** "You must submit at least one claim." (Forces the first step of the paradox).
      *   **Live Handle:** If they submit only 1, acknowledge it in the debrief: "You played as a pure Expected Value maximizer. But does that match how we *believe*? Do you refuse to believe a claim just because it's part of a large set? If you believe $P$, and you believe $Q$, does your belief vanish when you consider them together?"

  #### **2. Confusion on the Conjunction Rule**
  *   **Prediction:** Students think they get +10 for true claims and simply lose the +10 for false claims, ignoring the -50 penalty.
  *   **Fix:**
      *   **Visual Aid:** Draw a sample scorecard on the board before Round 1.
      *   **Example:** "If you claim 5, and 4 are True, 1 is False: You get 40 points. Then MINUS 50. Total: -10."
      *   **Live Check:** After Round 1, ask a student who got hit by the penalty to read their score aloud. "I had 15 true claims... so 150. Minus 50. Total 100." Wait, no— "Minus 50 because *one* was false." Make sure the pain is felt.

  #### **3. Round 2 feels "Rigged"**
  *   **Prediction:** "You rolled a 10 on chapter 4! That's unfair!"
  *   **Fix:**
      *   **Lean into it:** "Exactly. You were 90% sure. You were rational. And you were wrong. This is the human condition. The Preface Paradox isn't about math errors; it's about the fact that rational agents make errors."

  ---

  ### **What This Activity Cannot Do**
  *   **It doesn't solve the paradox.** It reproduces it. Don't try to offer a solution (e.g., Contextualism, Interest-Relative Invariantism) unless they ask. The goal is to feel the tension.
  *   **It doesn't simulate Credence well.** The game forces binary assertion. Students might leave thinking "Okay, just don't assert conjunctions." You need to explicitly point out in the debrief that *belief* feels like assertion, not betting. If they say "I just wouldn't believe the conjunction," ask: "So if you believe every chapter is correct, do you *not* believe the book is correct? That feels weird."
  *   **It relies on risk aversion.** Some students might be risk-seeking and bet everything. Frame this not as "wrong," but as "What is your threshold for belief? If you bet 20 claims, your threshold for the conjunction was 12%."

  ### **TA Prep Checklist**
  1.  **Envelopes:** Prepare 20. Mark the winner secretly.
  2.  **Sheets:** Print 12 sheets with 20 numbered lines each. Header: *"Confidence: 90% per line."*
  3.  **Dice:** Have a d10 ready for Round 2.
  4.  **Board:** Pre-write the Scoring Rule so you don't forget the -50 penalty.
  5.  **Mindset:** You are the Auditor, not the Professor. Be neutral. "The rules are the rules. Let's see what your choices imply."

  This design forces the mathematical reality of conjunction into a normative decision, making the "Paradox" a lived experience rather than a puzzle on a page. Good luck.
