answer: |-
  **Grade: 12 / 25**

  **Point-by-Point Comments**

  **(a) Cascade Onset and Rationality (6 / 6 points)**
  *   **What you got right:** You correctly identified the mechanics of the Bikhchandani-Hirshleifer-Welch (BHW) model. You noted that the first two agents follow their private signals, and the cascade begins with the third agent if the first two agree. You also correctly stated that agents inside a cascade ignore their private signals and that this behavior is *rational* (Bayesian updating), not a result of social pressure.
  *   **Full credit requirement:** This part is essentially perfect. You captured the threshold (2 vs. 1 signal) and the definition of rationality in this context (maximizing expected utility given public history).

  **(b) Information Aggregation (4 / 6 points)**
  *   **What you got right:** You correctly concluded that the meeting aggregates information poorly and that the town can end up choosing the worse system. Your comparison to a "planner" who collects all 4,000 readings is excellent and demonstrates an understanding of the efficiency loss.
  *   **What is imprecise/wrong:** You wrote: *"This is the same basic thing as the bandwagon effect and groupthink that the social psych people study, where people go along with the crowd and stop thinking for themselves."*
      *   **Why this loses points:** In this course, we draw a sharp distinction between *informational cascades* (rational inference from others' actions) and *groupthink/reputational herding* (irrational pressure or preference for conformity). In part (a), you correctly argued the behavior is rational. In part (b), you contradicted yourself by equating it to psychological pressure ("stop thinking for themselves"). The tragedy of the cascade is that everyone *is* thinking for themselves, yet the outcome is still inefficient.
  *   **What a full-credit answer would say:** The outcome is bad because public actions become "cheap talk" once the cascade starts; they no longer reveal private signals. The information flow stops, not because people stop thinking, but because their actions no longer convey new data.

  **(c) Probability Over Time (0 / 6 points)**
  *   **What is wrong:** You answered *"Yes, it keeps improving,"* and argued that *"Every additional speaker who joins the consensus is one more piece of evidence."* This is the fundamental misunderstanding of the cascade model.
  *   **Why this loses points:** Once a cascade begins, subsequent actions convey **zero information**. If Agent 100 is in a cascade, they will choose A regardless of their signal. Therefore, observing Agent 100 choose A tells the public nothing about Agent 100's signal. The probability of being correct **freezes** at the level it was when the cascade started. It does *not* converge to 1 (certainty) as $N \to \infty$.
  *   **What a full-credit answer would say:** No, the chance does not keep improving. Because agents in a cascade ignore their private information, their actions do not add to the public pool of knowledge. The probability of correctness remains fixed at the post-cascade level, meaning there is a non-zero probability of error even with 4,000 speakers.

  **(d) Public Signal Intervention (2 / 7 points)**
  *   **What you got right:** You recognized that the engineering report acts as an independent, public signal.
  *   **What is wrong:** You concluded the report *"wouldn't change much"* because it would have to *"outweigh the entire run of speakers."* This reasoning relies on your error in part (c). Since the "run of speakers" during a cascade adds no information, the report does not need to outweigh 500 people; it only needs to outweigh the **original two or three signals** that triggered the cascade.
  *   **Why this loses points:** A sufficiently precise public signal can break a cascade immediately because the "weight" of the cascade participants is illusory. Your answer suggests the cascade is robust to new information; the model suggests cascades are actually quite fragile because they are based on very little actual data.
  *   **What a full-credit answer would say:** Yes, it changes the answers. A public report adds weight to the public information pool. Because the actions of those in the cascade convey no private information, the report only competes with the initial signals that started the cascade. If the report is precise enough, it can reverse the public belief and break the cascade, allowing subsequent speakers to follow their private signals again.

  **Summary**
  You have a strong grasp of the setup and the individual rationality involved in part (a). However, you lost significant points on parts (c) and (d) because you missed the core implication of the model: **information flow stops during a cascade.** You treated the sequence of actions as if they continued to accumulate evidence (Law of Large Numbers), but in an informational cascade, the sample size effectively stops growing after the first few agents. Review the notes on "cascade fragility" and the difference between public actions and private signals.
