answer: |-
  You are right to be suspicious. Your brother hasn't discovered a new paradox; he has recreated a classic philosophical argument known as the **"Collapse of Rule Utilitarianism into Act Utilitarianism."**

  It is a very strong argument, but it relies on a hidden assumption that smuggles itself in at **Step 2**.

  Here is the breakdown of where the logic bends, why it feels so convincing, and which premise you should sacrifice.

  ### The Bad Step: Premise (2)
  > *(2) But a rule like that is only worth having if the world is better off with it than without it; if it does no good, it's just a superstition people obey for nothing.*

  This is the pivot point. Your brother is defining the "worth" of a moral rule exclusively by its **consequences** (how much better off the world is).

  *   **If you accept (2):** You are a **Consequentialist**. You believe the rightness of an action (or rule) is determined by its outcome. If you accept this, your brother is right: you cannot have absolute rules. If the *only* reason to have the rule is to minimize deaths, then whenever breaking the rule minimizes deaths, you must break it. The rule collapses into "do the math" (Step 6).
  *   **If you reject (2):** You are a **Deontologist** (Moral Absolutist). You believe certain actions are right or wrong *in themselves*, regardless of the outcome. For a deontologist, a rule is not a "tool" to make the world better; it is a **constraint** on how you may act.

  **The Flaw:** Your brother is trying to disprove Absolute Rules (Deontology) using the criteria of Consequentialism. He is essentially saying, "I have proven your car doesn't fly. Therefore, it is not a car." He is judging a deontological system by utilitarian standards.

  ### The Two Paths Forward

  To resolve this, you have to choose which philosophical "cost" you are willing to pay.

  #### Option A: Keep Absolute Rules (Reject Step 2)
  If you want to maintain that "Killing an innocent is absolutely wrong," you must deny that the rule's value depends on the body count.
  *   **The Logic:** The rule exists because human beings have rights that cannot be violated, not because it creates a useful social heuristic. Even if the world is "worse off" in terms of numbers (6 die instead of 5), you are not permitted to violate the innocent person's right to life.
  *   **The Cost:** You accept the charge of "Rule Worship." You must admit that sometimes, following the moral law leads to objectively worse outcomes (more death), but you maintain that *you* are not responsible for the murderer's actions, only your own.
  *   **Verdict:** This saves the Absolute Rule, but it requires a non-consequentialist view of morality.

  #### Option B: Keep the Consequentialist Justification (Reject Step 6)
  If you agree with Step 2 (rules are only worth having if they help), you can still try to block Step 6. This is the **Rule Utilitarian** defense.
  *   **The Logic:** You argue that allowing *any* exceptions (even in this case) destroys the utility of the rule. If people know the rule "Don't kill innocents" has exceptions, they will start rationalizing exceptions all the time, trust will erode, and eventually, more people will die than if the rule were absolute. Therefore, even in this specific case, keeping the rule yields the best long-term outcome.
  *   **The Cost:** This is fragile. Your brother will ask: "What if the consequences are *really* huge? What if killing the one saves a million?" Eventually, the math will overwhelm the rule. Most Rule Utilitarians eventually collapse into Act Utilitarians (Step 6) under pressure.
  *   **Verdict:** This tries to have it both ways but often fails under extreme pressure.

  ### Which is Cheaper to Lose?

  You asked: **"If I have to give up (2) or (6), which one is cheaper to lose?"**

  **You should give up (2).**

  Here is why:
  1.  **Logical Consistency:** You cannot consistently hold (1) "Some things are absolutely wrong" and (2) "Rules are only valid if they maximize good outcomes." They are contradictory definitions of morality. Since your goal is to defend the idea of an absolute rule, (2) is the premise that undermines your goal.
  2.  **The "Trick Works on Everything" Intuition:** You mentioned, *"I say that just shows the trick works on everything, which is suspicious."* You are right. If an argument proves that *no* rules can exist (not just don't kill, but don't lie, don't torture), it suggests the argument is using the wrong metric. It's like using a ruler to measure weight; the tool doesn't fit the object.
  3.  **Moral Integrity:** Giving up (6) allows you to say, "There are lines we do not cross, even to prevent others from crossing them." This preserves the distinction between *doing* evil and *allowing* evil, which is central to most human moral intuitions.

  ### The Compromise: Threshold Deontology
  If giving up (2) feels too rigid (i.e., you really *can't* let 5 people die if you can easily save them), there is a middle ground called **Threshold Deontology**.

  This view says: Absolute rules hold... *until* the consequences become catastrophic.
  *   **Normal times:** Do not kill the innocent, no matter the cost. (Rejects 2)
  *   **Disaster times:** If the cost is high enough (e.g., nuclear war, millions of deaths), the consequentialist threshold is breached, and the rule may be set aside.

  This admits that Step 2 has *some* weight, but not enough to override rights in ordinary circumstances.

  ### Summary for Your Brother
  Tell him this:
  > "You've proven that you can't justify absolute moral rules using **consequentialist logic**. If the only reason to have a rule is to minimize harm, then yes, the rule collapses when it fails to minimize harm.
  >
  > But that doesn't prove absolute rules don't exist. It just proves they aren't tools for optimization. They are constraints on behavior. I am willing to accept a worse outcome (6 deaths) rather than become a murderer myself. If you think that's irrational, you aren't arguing about rules; you're arguing that morality is just math."

  **The bad step is (2).** It assumes morality is about *results* rather than *duties*. If you drop that assumption, the rest of his trick falls apart.
