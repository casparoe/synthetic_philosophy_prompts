answer: |-
  You are not crazy, and your intuition is shared by a significant camp of professional metaphysicians. The frustration you feel with your professor breezing past this is understandable because **causation by omission is one of the most contentious, unresolved problems in the philosophy of causation.**

  You are asking two distinct questions:
  1.  **Metaphysical:** Can "nothing" (an omission) genuinely cause "something" (an effect)?
  2.  **Pragmatic:** If it's mostly about blame/duty, why do philosophers treat it as a deep metaphysical puzzle?

  Here is the settlement you are looking for, broken down by why your brother has a point, why *you* have a point, and why the philosophers are arguing about it.

  ### 1. Why your brother (and your professor) say "Yes"
  The dominant theory of causation in modern philosophy is the **Counterfactual Theory** (championed by David Lewis). It defines cause simply: *C causes E if, had C not occurred, E would not have occurred.*

  Apply this to the curry:
  *   **Event:** You didn't warn him.
  *   **Counterfactual:** If you *had* warned him, he would not have eaten the curry.
  *   **Result:** He would not have gotten sick.

  Under this model, your silence is a "difference-maker." It is a necessary condition for the sickness. In this framework, causation isn't about physical energy transfer (like one billiard ball hitting another); it's about dependency. Because the sickness *depended* on your silence, your silence was a cause.

  This is also how the law often works (the "but-for" test). *But for* your failure to speak, would he be sick? No. Therefore, legally and logically, your omission is a cause.

  ### 2. Why you say "No" (and why you're also right)
  Your intuition relies on the **Process View** of causation. This view holds that for A to cause B, there must be a physical mechanism or transmission of energy from A to B.
  *   When you push a cup, energy transfers from you to the cup.
  *   When you *don't* speak, no energy transfers. There is no physical "thing" traveling from your brain to his stomach.

  From a strict physics standpoint, you are correct: **Nothingness cannot exert force.** The bacteria in the curry caused the sickness. The heat caused the bacteria to multiply. Your silence was merely the background condition that allowed those physical causes to proceed.

  This leads to your "Floodgates Argument" (the starvation/burglary point). If omissions are causes, then:
  *   I cause the starvation of children in distant countries by not donating my paycheck.
  *   I cause the burglary of my neighbor's house by not hiring a security guard for them.

  Since we intuitively know we aren't the *cause* of those things (even if we might be morally blameworthy), there must be a limit to what counts as an omission-cause.

  ### 3. Is it just "Disguised Blame"?
  You suggested that "causation by omission" is just a fancy way of saying "you had a duty to act." This is a very sophisticated philosophical position known as **Normativism**.

  However, most philosophers argue it is **not just blame**, for two reasons:

  **A. Explanatory Value vs. Moral Blame**
  We cite omissions as causes even when there is no moral blame.
  *   *Example:* A plant dies because the automatic watering system failed.
  *   Nobody blames the system (it has no mind). But we still say the *lack of water* caused the death, not just the heat or the soil. We need the concept of omission to explain how systems fail, not just to punish people.

  **B. The "Normality" Filter**
  To solve your "Floodgates" problem (why aren't we all causing starvation?), philosophers introduce the concept of **Normality**.
  We select causes based on what deviates from the expected course of events.
  *   **Starvation:** It is, sadly, "normal" for random passersby not to donate to food banks. Because it is the baseline, we don't cite it as the *cause* of starvation.
  *   **The Curry:** It is *abnormal* for a sibling to watch another eat poison curry without speaking. Because it deviates from the expected social script, we single it out as a cause.

  So, it's not *just* blame. It's about **contextual relevance.** An omission becomes a cause when it violates a norm (physical, social, or legal) that we expect to hold.

  ### 4. Why is this a "Deep Problem"?
  You asked why philosophers treat this as a metaphysical puzzle rather than a straightforward distinction. Here is why it keeps them up at night:

  1.  **It breaks Physics:** If causation is the glue of the universe, how can "nothing" be glue? If omissions are causes, then "non-existents" have causal power. That sounds like magic. Philosophers have to reconcile how "what didn't happen" can change "what did happen."
  2.  **It breaks Logic:** If my not-blinking caused a plane crash (because if I had blinked, I would have looked away from the road, missed a pothole, etc.), then we have infinite causes. We need a theory that limits causes without just resorting to "who do we want to blame?"
  3.  **Real World Stakes:** This isn't just academic.
      *   **Medical Ethics:** If a doctor turns off a life-support machine (act) vs. doesn't turn it on (omission), is the causation of death different? The law often treats them differently, but the *result* is the same.
      *   **AI Safety:** If a self-driving car fails to brake (omission) vs. accelerates (act), is the "cause" of the accident the same? We need to program cars to understand omission-causation.

  ### The Verdict on the Curry
  Here is the settlement for your dispute:

  *   **Physically/Metaphysically:** You are right. The bacteria caused the illness. Your silence was a background condition, not a physical force. There was no transfer of energy.
  *   **Pragmatically/Legally/Morally:** Your brother is right. In human social contexts, we define causation by **difference-making within a system of expectations.** You occupied a specific role (sibling/kitchen sharer) where warning about danger is the "normal" expected action. By deviating from that norm, your omission became the salient cause of the outcome.

  **Why your professor is breezing past it:**
  In introductory courses, professors often teach the **Counterfactual Theory** because it's the standard tool for logic and law. They treat omissions as causes because it makes the logic of "if/then" statements work cleanly. They aren't trying to trick you; they are teaching you the standard model, even though the standard model has known "bugs" (like your starvation example).

  **Conclusion:**
  "Causation by omission" is not *just* blame-talk, but it is deeply entangled with **normative expectations.** It is a hybrid concept: part metaphysical dependency, part social expectation.

  You can tell your brother: *"Philosophically, you're right that my silence was a 'difference-making condition' which counts as causation in social and legal contexts. But metaphysically, I'm right that 'nothing' cannot physically cause 'something,' which is why we don't say I caused the starvation of the world. Your argument works because we have a specific duty, not because silence is a physical force."*

  That should settle it. You both win, just on different levels of analysis.
