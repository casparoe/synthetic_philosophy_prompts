      *   *Consideration:* A friend's need for shared genuine validation.

      *   *Refining the "Normal Week" constraint:* No biometric machines. Just a perceptive friend.
      *   *Refining the "Escape Hatch":* The prompt says "you can't dissolve the problem by saying...". I need to write the scenario such that this move is blocked. I will explicitly state the friend detects insincerity instantly and is hurt *more* by performed awe than silent neutrality. Thus, "act as if" is off the table. "Want to feel" is off the table because awe is not will-responsive.
      *   *Bonus:* Make WKR and RKR point the same way. (The sunset *is* actually sublime, so you should feel awe anyway. But the friend's need adds *another* reason that feels different).
      *   *Wait, if the sunset is sublime, that's an RKR. I need the WKR to exist alongside it.*
