      *   *Later Developments:*
          *   Łukasiewicz (3-valued logic): True, False, Possible/Indeterminate.
          *   Ockhamism: True now, but "soft fact" (depends on future).
          *   Branching Time (Prior/Thomason): Many futures, one actualized. "Thin Red Line" debate.
          *   Modal Fallacy: Confusing $\square(P \to Q)$ (Necessity of Consequence) with $P \to \square Q$ (Necessity of Consequent).

  3.  **Deconstruct the Literary Problem (*Macbeth*):**
