      *   *Hedged Propositions:* "None of woman born" isn't a simple atomic proposition ($P$). It's a quantified statement with ambiguous terms. This matters for logic. If the proposition is ill-defined, bivalence is tricky.
      *   *Philosophical Alignment:* The play feels Ockhamist (truth exists but depends on how events unfold) mixed with Branching Time (Macbeth tries to force one branch). But ultimately, it resists formalization because of the *equivocation* (language games).

