answer: |-
  In character

  You confuse the raw material with the finished vessel, and in doing so, you mistake the possibility of improvement for an innate tendency toward it. I grant that every person possesses the faculty of knowledge and the ability to practice, for without this, ritual could not take root; yet having the legs to walk does not mean one is born knowing the path, nor does having the eyes to see mean one is born knowing the difference between right and wrong. My claim is not that humans cannot become good, but that the spontaneous movements of the heart—greed, envy, desire for profit—lead inevitably to strife if left to follow their own course, which is why I define nature as what requires no effort to manifest.

  When you speak of the potter's hand, you forget that the potter must struggle against the clay's tendency to collapse, and that the standard of the vessel exists prior to and outside the clay itself. The sage kings were not born with ritual in their hearts; as I show in my examination of how rites began, they accumulated thought and practice to create it precisely because the natural state of man was chaotic and devoid of order. If the wood must be steamed and bound to be straight, must you not admit its original state was crooked? Since you claim the corrective is natural, why do the heart's spontaneous desires, when unchecked by a teacher, fail to naturally settle into harmony?

  Margin note

  I must confess that explaining how the first Sage King arose without a teacher to straighten him remains the thorniest point in my doctrine. If all nature is crooked, how did the first straightener emerge without himself being straightened? I argue he accumulated insight like anyone else, but the origin of that initial accumulation rests heavily on my shoulders.
