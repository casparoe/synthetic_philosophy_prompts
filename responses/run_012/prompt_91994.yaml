  2.  **Deconstruct Sapir-Whorf (Linguistic Relativity):**
      *   *Strong Determinism:* Language *determines* thought. If you lack the word/concept, you cannot think the thought. (Largely discredited in linguistics).
      *   *Weak Influence:* Language *influences* thought/habit. It makes certain cognitive paths more salient or easier to access. (Widely accepted in modified forms).
      *   *Key Linguistic Concepts:* Obligatory grammatical categories (e.g., tense, gender), Lexical inventory, Translation argument (inter-translatability).

  3.  **Map to Programming Language (PL) Theory:**
