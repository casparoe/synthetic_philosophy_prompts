      *   *Obligatory Categories:* Type systems, evaluation strategy (lazy vs. eager), memory management (GC vs. manual), error handling (exceptions vs. result types).
      *   *Translation Argument:* Turing Completeness. Anything computable in Language A is computable in Language B.
      *   *Expressibility/Idiom:* Abstraction mechanisms, standard libraries, syntactic sugar, "The Pit of Success."

  4.  **Drafting the Restatements (Iterative Process):**

      *   *Strong Thesis:* "The language determines the thoughts." -> In PL: "The language determines the algorithms." *Wait, that's false due to Turing Completeness.* The user noted this. The Strong Thesis in PL would have to claim that certain *abstractions* are literally unthinkable without specific syntax.
      *   *Mapping:* Obligatory Grammatical Categories -> Forced Semantic Properties (e.g., you *must* handle nulls, you *must* declare types).
      *   *Weak Thesis:* "Language shapes habits." -> In PL: "Language shapes idiomatic usage." The lazy-to-eager migration example fits here perfectly.

      *   *Refining the Strong Mapping:* This is the tricky part. In linguistics, Strong Whorf says you *can't* conceive of time without tense. In PL, Turing Completeness says you *can* compute anything. So, Strong Whorf in PL must map to something outside computability. Maybe *cognitive load*? But the user wants to avoid just calling it "ease."
      *   *Hypothesis:* Strong Whorf in PL is actually a claim about *abstraction leakage*. If the language forces a specific memory model, can you truly conceive of the data without thinking about memory?
      *   *Correction:* The prompt asks me to restate it *faithfully* even if the mapping is forced. I need to show where it breaks.

  5.  **Developing the Residue Report:**
      *   *Whorf -> PL:* Human cognition vs. Compiler semantics. Whorf cares about *qualia* or *perception*. PL cares about *output* and *correctness*. The "Thinker" is outside the PL formal model.
      *   *PL -> Whorf:* Formal verification, performance characteristics, tooling. Linguistics doesn't really have an equivalent to "runtime cost."

  6.  **Addressing the User's Suspicion:**
      *   Suspicion: PL framework can only state Strong Thesis as "ease."
