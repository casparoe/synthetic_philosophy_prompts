          1.  Restate Strong and Weak Sapir-Whorf hypotheses in PL vocabulary *faithfully*, mapping specific linguistic concepts to PL concepts (obligatory categories -> forced behaviors, translation argument -> Turing completeness, expressibility/idiom -> possible vs. natural).
          2.  Highlight forced/messy mappings (don't smooth them over).
          3.  Provide a "Residue Report": What in Whorf has no PL counterpart? What in PL has no Whorf counterpart?
