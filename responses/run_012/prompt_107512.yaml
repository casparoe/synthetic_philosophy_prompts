          *   **Characters:** Elias (Architect), Mara (Auditor).
          *   **Plot:** A chemical spill warning is released. The model assumes everyone understood it. Some didn't. They get sick. The model refuses compensation because "information was available."
          *   **Resolution:** Elias argues the model preserves the incentive to learn. Mara argues it preserves nothing but cruelty. No clear winner.

      *   *Wait, I want the assumption to be more positive.*
      *   *How about:* **"The Benevolent Interpreter."** The model assumes all ambiguous statements are interpreted in the most cooperative way possible.
      *   *Why it works:* Reduces litigation. Trust flourishes.
      *   *Why it fails:* Bad actors exploit the ambiguity.
