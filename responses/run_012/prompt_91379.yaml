answer: |-
  # TUTORIAL HANDOUT: THE RING TEST
  **Goal:** Find your ethical position by answering case questions. **Do not look up the terms.** Follow the arrows.

  ### START: The Classic Ring
  You have Gyges' Ring (invisible, no punishment, no discovery). You can steal significant wealth.
  **Q1: Do you use the ring to steal?**
  *   **YES** → Go to **A**
  *   **NO** → Go to **B**
  *   **"The question is confused/Morality isn't one thing"** → **ANTI-THEORY**

  ---

  ### PATH A (You would use the ring)
  **Q2: Is morality objectively real, but just not binding on you here?**
  *   **Yes, moral facts exist but I don't care.** → **ERROR THEORY**
      *   *Awkward Commitment:* You must admit you are acting irrationally or immorally without error.
  *   **No, morality is just a useful story we tell.** → **FICTIONALISM**
      *   *Awkward Commitment:* You must advocate lying to others while knowing the truth yourself.
  *   **No, obligations only exist if you want the benefits.** → **HYPOTHETICAL IMPERATIVE**
      *   *Awkward Commitment:* You have no grounds to criticize a successful psychopath.

  ---

  ### PATH B (You would not use the ring)
  **Q3: The Memory Wipe.** You use the ring, but it instantly wipes your memory of the act. No guilt, no self-knowledge loss. **Does the wrongness remain?**
  *   **No, if I don't know/feel it, I'm fine.** → Go to **C**
  *   **Yes, the act itself damages me/reality.** → Go to **D**

  ### PATH C (Depends on memory/feeling)
  **Q4: The One Unjust Act.** You can do *one* unjust thing now, after which you become perfectly virtuous forever. **Do you do it?**
  *   **Yes, trade vice for future virtue.** → **HUMEAN SENTIMENTALISM**
      *   *Awkward Commitment:* Moral character is calculable; you can "buy" virtue with a sin.
  *   **No, the habit matters more than the outcome.** → **ARISTOTELIAN EUDAIMONISM**
      *   *Awkward Commitment:* You must value your own flourishing over minimizing total injustice in the world.

  ### PATH D (Wrongness survives memory wipe)
  **Q5: The Source.** Why does the wrongness survive?
  *   **Because it disorders my soul's structure.** → **PLATONIST**
      *   *Awkward Commitment:* You must believe in a metaphysical "soul health" analogous to physical health.
  *   **Because it violates a rational law/duty.** → **KANTIAN / CONSTRUCTIVIST**
      *   *Awkward Commitment:* You are bound by laws you legislate to yourself, even against your interest.
  *   **Because a Higher Authority forbids it.** → **DIVINE COMMAND**
      *   *Awkward Commitment:* If God commanded the theft, it would become good (Euthyphro dilemma).

  ---

  ### PATH E (The Contract Check)
  *(Return to Q1: If you said YES, but worry about others)*
  **Q6: Universal Ring.** Everyone has a ring. Society collapses. **Do you still use yours?**
  *   **No, I need a Sovereign to enforce rules.** → **HOBBESIAN / CONTRACTARIAN**
      *   *Awkward Commitment:* Morality is purely prudential; without a sword, "justice" is folly.
  *   **Yes, but I wish others wouldn't.** → **EGOIST (Unstable)**
      *   *Awkward Commitment:* You cannot universalize your maxim without contradiction.

  ***

  ## INSTRUCTOR'S KEY (Do Not Distribute)

  ### 1. The Workhorse Node
  **Q3 (The Memory Wipe)** is doing 80% of the labor.
  *   **Why:** It is the only branch that cleanly separates **Instrumentalists** (Hobbes/Hume/Instrumental Rationality) from **Intrinsicists** (Plato/Kant/Divine).
  *   **Defense:** Students will say, "But if I don't remember, how does it hurt me?" You must press them: *Does injustice damage the agent like a disease (Plato), or only like a bad reputation (Hobbes)?* If they say "Disease," they survive the wipe. If "Reputation/Guilt," they fail it.

  ### 2. Indistinguishable Pairs (In Principle)
  *   **Platonist vs. Kantian:** Both land on "Yes, wrongness survives memory." Both claim intrinsic harm/wrongness independent of consequence. The tree cannot separate "Soul Health" from "Rational Duty" without metaphysical interrogation beyond the cases.
  *   **Divine Command vs. Kantian:** Both are deontological. Unless the student explicitly cites God at Q5, they look identical (Rule-based refusal).
  *   **Error Theory vs. Fictionalism:** Both deny objective moral facts. The split relies entirely on whether they think we should *keep using the language* (Fictionalism) or *stop* (Error Theory), which is a linguistic preference, not a behavioral one.

  ### 3. Unoccupied Combinations (Empty Sets)
  *   **"I would use the ring, but I believe I ought not to (and I'm not weak)."**
      *   *Why:* Incoherent. This is Moore's Paradox applied to action. If you believe you ought not, Internalism suggests you are motivated not to. If you use it, you either don't believe it (Error Theory) or are weak-willed (not a position).
  *   **"I would not use the ring, but there is no reason not to."**
      *   *Why:* Unattractive/Unstable. This posits a "rational amoralist" who obeys morality for no reason. Most theories collapse this into Humean Sentiment (I have a reason: I feel like it) or Kantian (I have a reason: Rationality).
  *   **"I would use the ring to help someone (Robin Hood)."**
      *   *Why:* Not in tree. This is Consequentialism. I omitted it because the prompt list focused on *why be moral* (self-interest vs duty) rather than *which acts are right*. If a student picks this, route them to **Hypothetical Imperative** (if they think justice is just a tool for good) or **Kantian** (if they think duty requires it).

  ### 4. Missing/Added Positions
  *   **Added:** **Anti-Theory** (Wittgensteinian/Particularist). Needed for students who reject the binary setup.
  *   **Dropped:** **Act Utilitarianism.** The "Ring" cases are designed to test *compliance motivation*, not *act evaluation*. A Utilitarian fits awkwardly (usually Hypothetical Imperative or Kantian depending on rule/act distinction).
  *   **Dropped:** **Care Ethics.** Hard to isolate with "Ring" anonymity cases, as Care relies on specific relationships (which the Ring dissolves).

  ### 5. Tutorial Tip
  When a student lands on **Platonist**, ask: *"If the soul-damage is invisible and unfelt, is it really damage?"* If they hesitate, they are actually **Kantians** (focused on the violation) or **Aristotelians** (focused on the habit, which the wipe disrupts). Use this to force the distinction.
