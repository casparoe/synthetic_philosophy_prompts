answer: |-
  # Specification: Rational Choice Under Unbounded Stakes

  ## I. The Test Suite (Core Cases)
  These four cases constitute the validation set. A theory that fails any one of these without a principled explanation (rather than a mathematical workaround) fails the specification.

  1.  **The Mugger (Epistemic Void):**
      *   *Structure:* Tiny probability ($p \approx 0$), Unbounded Disutility ($U \to -\infty$), No Evidence.
      *   *Stress Test:* **Non-fanaticism** and **Sincere Credences**. Does the theory force compliance based on mathematical expectation alone, or does it allow epistemic constraints to block the calculation?
  2.  **The Open-Ended Prize (Dominance Failure):**
      *   *Structure:* Small but non-tiny probability ($p = 10^{-9}$), Unbounded Utility ($U \to +\infty$), Defined EU.
      *   *Stress Test:* **Non-fanaticism**. Even with a "reasonable" probability, does the unbounded value swamp all finite, certain goods?
  3.  **The Never-Ending Prize (Mathematical Divergence):**
      *   *Structure:* Infinite sequence of positive stages, Real-valued Utility.
      *   *Stress Test:* **Completeness** and **Agreement with Ordinary EU**. Standard EU is undefined ($\infty$). Does the theory crash, refuse to judge, or provide a coherent valuation for divergent series?
  4.  **The Queue of Claimants (Choice Indeterminacy):**
      *   *Structure:* Infinitely many mutually exclusive options, all with Unbounded/Infinite payoff.
      *   *Stress Test:* **Completeness** and **Robustness**. If all options evaluate identically (as infinite), is there a rational tie-breaker? Is the agent vulnerable to switching costs (money pumps)?

  ---

  ## II. The Desiderata (Requirements Assessment)

  Below are the candidate requirements, assessed for their necessity and their theoretical cost.

  | Requirement | Definition | Case Link | Status | Assessment |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Finite Agreement** | The theory must reproduce standard Expected Utility (EU) verdicts on bounded, finite problems. | All (Baseline) | **Non-Negotiable** | If a theory alters rational choice in ordinary finite contexts to solve infinite ones, it is not an extension but a replacement that breaks known valid reasoning. |
  | **2. Completeness** | The theory must return a verdict (choose A, choose B, or indifferent) or a principled refusal (suspend judgment) on every problem in the class. | Queue, Never-Ending | **Non-Negotiable** | A theory of *choice* that systematically returns "error" on the cases it was designed for is functionally useless. "Principled refusal" counts as a verdict. |
  | **3. Non-Fanaticism** | Ordinary practical reasoning must not be dominated by tiny-probability, unbounded payoffs. | Mugger, Open-Ended | **Camp Commitment** | **Critical Tension.** This is the primary motivation for the specification, but it is philosophically contested. "Fanatics" argue rationality *requires* following the expectation. Adopting this rules out standard EU maximization. |
  | **4. Invariance** | Verdicts must not change under re-description of outcomes or affine transformation (rescaling/re-zeroing) of utility. | Open-Ended, Mugger | **Non-Negotiable** | Without this, the theory is sensitive to framing effects. This specifically rules out "probability discounting" thresholds that depend on absolute utility magnitudes. |
  | **5. Tractability** | The agent need not enumerate infinite options or compute divergent sums to reach a verdict. | Queue, Never-Ending | **Camp Commitment** | Distinguishes Ideal Rationality (can handle transfinite math) from Bounded Rationality (needs heuristics). For a normative theory, Ideal is standard, but Tractability is preferred for implementation. |
  | **6. Robustness** | The agent must not be vulnerable to exploitation (e.g., money pumps, Dutch Books) by claimants who know the theory's rules. | Queue, Mugger | **Non-Negotiable** | If a theory allows a sequence of choices that leaves the agent worse off with certainty, it is pragmatically self-defeating. |
  | **7. Sincere Credences** | The theory must not require the agent to adopt specific credences over events for which no reference class exists. | Mugger | **Camp Commitment** | Distinguishes Subjective Bayesians (assign a prior) from Imprecise Probabilists (assign a set or interval). Forcing a precise prior in the Mugger case feels epistemically dishonest. |

  ---

  ## III. Incompatibility Results (The "No-Go" Zones)

  You cannot satisfy the following subsets jointly. A theory must explicitly sacrifice one element in each cluster.

  **1. The Fanatic's Trilemma (Mugger & Open-Ended Prize)**
  *   **Conflict:** You cannot jointly hold:
      1.  **Unbounded Utility** (Outcomes can be arbitrarily valuable).
      2.  **Standard Probability Logic** (Countable additivity / Open-mindedness / No zero probabilities for possible events).
      3.  **Non-Fanaticism** (Small probabilities do not dominate finite goods).
  *   **Implication:** To satisfy **Non-fanaticism**, you must either bound utility (sacrificing the intuition behind the Open-Ended Prize) or modify probability logic (e.g., reject countable additivity or allow infinitesimal probabilities). Straightforward EU maximization fails here.

  **2. The Divergence Problem (Never-Ending Prize)**
  *   **Conflict:** You cannot jointly hold:
      1.  **Real-Valued Utility** (Utility maps to $\mathbb{R}$).
      2.  **Completeness** (A verdict is returned).
      3.  **Standard Summation** (EU is the sum of $p \times u$).
  *   **Implication:** Since the sum diverges, Standard Summation + Real-Valued Utility yields "undefined." To get a verdict (**Completeness**), you must either extend the number system (hyperreals/surreals) or abandon Standard Summation (e.g., use discounting or relative utility).

  **3. The Queue Paradox (Queue of Claimants)**
  *   **Conflict:** You cannot jointly hold:
      1.  **Completeness** (Must choose one claimant).
      2.  **Symmetry/Invariance** (All claimants look identical).
      3.  **Robustness** (No arbitrary switching).
  *   **Implication:** If all options are infinite and identical, any choice is arbitrary. If you can switch, you are vulnerable to money pumps (paying a cent to switch from Infinite A to Infinite B). A theory must either allow rational indeterminacy (suspend choice) or introduce a tie-breaking rule that risks Invariance.

  ---

  ## IV. The Keystone Requirement

  **Non-Fanaticism** is the single requirement that does the most work in ruling out the obvious candidate families.

  *   **Rules Out Straightforward EU:** Standard EU maximization is inherently fanatic. If utility is unbounded and probability is non-zero, the expectation dominates. Non-fanaticism kills this family immediately for the Mugger and Open-Ended cases.
  *   **Rules Out Probability Discounting:** While discounting tiny probabilities avoids fanaticism, it typically violates **Invariance**. (e.g., If I discount probabilities below $10^{-9}$, rescaling the utility units can shift whether an outcome counts as "tiny probability high utility" or "large probability moderate utility" in a way that changes the verdict). Non-fanaticism forces a structural solution, not a threshold fix.
  *   **Pressure on Bounded Utility:** Non-fanaticism is the primary *motivation* for Bounded Utility theories. However, if you treat **Finite Agreement** as non-negotiable, Bounded Utility theories must explain why our finite preferences don't reveal an unbounded scale. Non-fanaticism forces the Bounded Utility theorist to argue that our intuition about the "Open-Ended Prize" is wrong.
  *   **Pressure on Imprecise Probabilities:** Refusing to assign probabilities (Imprecise Credences) satisfies Non-fanaticism by making the expectation undefined. However, this runs directly into **Completeness**. Non-fanaticism forces the Imprecise theorist to explain how action is possible without a single expectation.

  **Summary:** **Non-fanaticism** is the filter. It is the requirement that transforms these cases from "mathematical curiosities" into "problems to be solved." Without it, Standard EU is the correct answer for all four cases (pay the mugger, take the open-ended prize, accept the undefined sum as infinite, pick arbitrarily in the queue). Enforcing Non-fanaticism forces the theory to abandon at least one other standard axiom (Unboundedness, Standard Probability, or Real-valued Utility).

  ### Recommendation for Specification
  Treat **Non-fanaticism** as a **Hard Constraint** for this project, but explicitly flag it as the source of theoretical tension. If you relax Non-fanaticism, the specification becomes trivial (Standard EU). If you enforce it, you must explicitly authorize the theory to violate either **Unbounded Utility** (accept Boundedness) or **Standard Probability Logic** (accept Non-Archimedean fields or similar). Do not attempt to satisfy both; the Incompatibility Result proves it impossible.
