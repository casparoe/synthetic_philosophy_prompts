answer: |-
  ### Part 1: Conceptual Dependencies
  *The order in which ideas must be introduced.*

  1.  **Perceptual Constancy amidst Variation:** Students must first acknowledge that radically different shapes are read as the same symbol. Without establishing this phenomenological fact, there is no problem to solve.
  2.  **The Failure of Metric Geometry:** Once variation is accepted, students will instinctively search for shared measurements (angles, ratios). This hypothesis must be tested and broken before they can move to abstract relations.
  3.  **Topological/Structural Invariance:** Once measurements fail, attention must shift to connectivity, closure, and adjacency (e.g., "a closed loop with a vertical attachment"). This is a deeper level of abstraction than geometry.
  4.  **Distinctiveness within a System:** Structural definitions often bleed into neighboring letters (e.g., `a` vs. `d` vs. `o`). Students must realize that identity is partly defined by *contrast* against other categories, not just internal features.
  5.  **Function over Form:** Finally, they must understand that the classification is driven by the role the shape plays in reading (legibility, flow) rather than an intrinsic "soul" of the letter.

  *Why this order?* You cannot discuss system contrast (4) until they have a working definition of the individual shape (3). You cannot discuss topology (3) until they have abandoned rigid geometry (2). You cannot abandon geometry until they have seen enough variation to break their geometric template (1).

  ---

  ### Part 2: The Teaching Plan (75 Minutes)

  #### Phase 1: The Phenomenon of Variation (0–15 min)
  *Goal: Establish perceptual constancy.*
  *   **Activity:** Project the **parametric font set** first. Show a grid of 50 `a`s varying smoothly in bowl curvature, stem angle, and aperture.
  *   **Prompt:** "Raise your hand if any of these are *not* an `a`." (Expect consensus: all are `a`).
  *   **Action:** Ask the AI students to list the pixel differences; ask the Design students to describe the stylistic differences.
  *   **Point to Make:** Identity persists despite massive geometric change. The category is wider than any single specimen.

  #### Phase 2: The Search for the Template (15–30 min)
  *Goal: Elicit and expose the "Geometric Template" misconception.*
  *   **Activity:** Break into mixed pairs (one Design, one AI). Task: "Write down the three necessary geometric rules that define an `a`. If a shape breaks one rule, it is not an `a`."
  *   **Action:** Collect 3–4 definitions on the board. They will likely mention "closed bowl," "vertical stem," "right-side appendage."
  *   **Intervention:** Introduce the **single-story `a`** (handwriting style) next to the **two-story `a`** (print style).
  *   **Point to Make:** The "closed bowl" rule fails for single-story. The "two-story" rule fails for handwriting. The geometric template is fracturing.

  #### Phase 3: Breaking the Parts (30–50 min)
  *Goal: Expose the "Common Part" and "Style as Decoration" misconceptions.*
  *   **Activity:** Introduce the **Blackletter `a`** and the **Child's Handwritten `a`**.
  *   **Prompt:** "Does the Blackletter `a` share a single line segment or curve with the parametric `a`? Does the child's `a` share a proportion?"
  *   **Discussion:** Guide them to see that "style" is not paint added to a skeleton; the skeleton itself changes. There is no single common part shared by *all* specimens.
  *   **Critical Limitation of Your Set:** Your parametric set implies a continuous mathematical space. The Blackletter and Child examples are *discontinuous* jumps.
  *   **Point to Make:** If there is no common part, what holds the category together? (Hint toward "Family Resemblance" without naming it yet).

  #### Phase 4: The System and The Boundary (50–65 min)
  *Goal: Shift from internal features to external contrast.*
  *   **Activity:** Show an `a` with a very small aperture (almost closed) next to an `o`. Show an `a` with a straight stem next to a `d`.
  *   **Prompt:** "At what point does this `a` become an `o`? At what point does it become a `d`?"
  *   **Discussion:** Highlight that the definition of `a` depends on the definition of `o` and `d` in the same typeface.
  *   **Point to Make:** Identity is relational. An `a` is an `a` because it is *not* an `o` and *not* a `d`, within the context of a specific reading system.

  #### Phase 5: Synthesis (65–75 min)
  *Goal: Consolidate the problem state.*
  *   **Activity:** Brief recap of the failed definitions.
  *   **Closing:** Pose the assessment question (see below).

  ---

  ### Part 3: Using the Carrying Example
  *Specifics on what the specimens must do and where they risk failure.*

  *   **What they must notice first:** The continuity of the parametric set. This lulls them into thinking there is a "center" or "average" `a`.
  *   **What the specimens must lack:** They must lack *context*. Do not show the `a`s in words initially. Isolating the letter forces them to look for intrinsic properties, which sets up the failure you need later.
  *   **Where the example misleads:**
      *   **The Parametric Trap:** If you linger on the parametric set too long (beyond 15 mins), AI students will assume there is a latent variable vector that defines "a-ness." You must break this by introducing the Blackletter, which likely lies outside that specific parametric manifold.
      *   **The Static Trap:** Your specimens are static images. This misleads students into thinking recognition is a static matching process. You must verbally remind them that reading is temporal and sequential, which is why context (Phase 4) matters.

  ---

  ### Part 4: Mapping Misconceptions
  *Where to head them off.*

  1.  **"An `a` has a single geometric template."**
      *   *When:* Phase 2.
      *   *How:* Immediately juxtapose the single-story and two-story `a`. Ask them to overlay the templates. Show they cannot align.
  2.  **"All `a`s share a common part."**
      *   *When:* Phase 3.
      *   *How:* Use the Blackletter `a`. Ask them to circle the specific line or curve present in *every* specimen on the board. They will find none.
  3.  **"Style is decoration added to an invariant skeleton."**
      *   *When:* Phase 3.
      *   *How:* Point out that in Blackletter, the "skeleton" (stroke construction logic) is fundamentally different from the parametric sans-serif. It is not ornament; it is structure.
  4.  **"Category membership is arbitrary."**
      *   *When:* Phase 4.
      *   *How:* Ask: "Could we decide tomorrow that this shape is a `b`?" Explain that while conventional, the boundaries are constrained by the need for distinctiveness from other letters in the set.
  5.  **"A Platonic essence must be lurking."**
      *   *When:* Phase 5.
      *   *How:* Refuse to validate the search for an essence. Reframe the question from "What is an `a`?" to "How do we agree to treat this as an `a`?"

  ---

  ### Part 5: Assessment and Refusal

  **The Assessment Question:**
  *"If I asked you to program a classifier or design a new font, would you look for the features that all `a`s **have**, or the features that all `a`s **share with each other but not with `o` or `d`**? Explain why the distinction matters."*

  *   *Why this works:* It tests if they understand that identity is relational (contrastive) rather than intrinsic (essentialist). It forces AI students to think about decision boundaries and Design students to think about legibility systems.

  **What to Refuse to Explain:**
  *"I will not tell you where the boundary line is."*

  *   *Rationale:* Do not provide a definition of the `a`. Do not resolve the tension between the single-story and two-story forms. Do not explain the cognitive mechanism (neural nets or prototype theory) that solves this for the brain. Your goal is to leave them with the *problem* of categorization, not a solution. If you explain *how* the brain solves it, they will stop thinking about *what* the problem is. Keep the mystery of the "Letter Spirit" alive.
