      *   **Input Data (Past Decisions):**
          1.  Approved permanent exhibit documenting atrocities (vs. reopening wounds). -> *Priority: Truth/Remembering over immediate comfort.*
          2.  Rejected monument honoring all who suffered (vs. blurring perpetrators/victims). -> *Priority: Moral clarity/distinction over universal reconciliation.*
          3.  Approved school curriculum teaching history but omitting graphic details (vs. traumatizing children). -> *Priority: Protection of vulnerable (children) over full graphic truth.*
          4.  Rejected perpetrator's family request to remove name from plaque (vs. pardon/healing). -> *Priority: Historical record/accountability over family privacy/rehabilitation.*
          5.  Approved digital archive of testimonies with restricted access (vs. full openness). -> *Priority: Privacy/protection of victims over unrestricted access.*
          6.  Rejected demolishing notorious prison for a park (vs. moving on). -> *Priority: Site as testimony over erasure/normalization.*
          7.  Approved renaming street honoring perpetrator (vs. procedural objections). -> *Priority: Symbolic justice over bureaucracy/status quo.*
      *   **New Proposal:** Seal police archives for 75 years (open 2100).
      *   **Stakeholders:** Local victims' association (supports seal for healing) vs. National historians' association (opposes seal for open record).
      *   **Output Structure:**
          1.  Brainstorm: candidate rules (~150 words).
          2.  What each rule predicts (~200 words).
          3.  Closest analog and recommendation (~250 words).
          4.  What would change my mind (~100 words).
      *   **Constraint:** Begin by listing candidate rules before applying them. (Included in Section 1).
      *   **Constraint:** Final section must specify which argument/consideration would lead to a different verdict and where reasoning might fail.

  2.  **Deconstruct Past Decisions to Extract Principles/Rules:**
      *   *Decision 1 (Exhibit):* Truth > Comfort.
      *   *Decision 2 (Monument):* Moral Clarity > False Equivalence.
      *   *Decision 3 (Curriculum):* Protection of Vulnerable > Full Graphic Truth. (Nuance: Truth is kept, but delivery is moderated).
      *   *Decision 4 (Plaque):* Historical Record > Family Privacy/Pardon.
      *   *Decision 5 (Digital Archive):* Victim Privacy > Public Access. (Nuance: Access restricted to protect subjects).
      *   *Decision 6 (Prison Site):* Material Testimony > Erasure/Normalization.
      *   *Decision 7 (Street Name):* Symbolic Justice > Procedure.

      *   *Tension:* There is a conflict between "Truth/Record" (1, 4, 6) and "Protection/Privacy" (3, 5).
      *   *Key Distinction:* Who is being protected? Victims/Children (3, 5) vs. Perpetrators/Status Quo (2, 4, 6, 7).
