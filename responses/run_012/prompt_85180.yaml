      *   Rule C: "Anti-Erasure." Do not remove or hide material evidence of atrocities (based on 6, 4).
      *   Rule D: "Moral Clarity." Decisions must distinguish between perpetrators and victims, avoiding measures that benefit perpetrators disproportionately (based on 2, 7).
      *   Rule E: "Contextual Moderation." Truth can be moderated for vulnerable audiences (children) or private contexts, but not erased publicly (based on 3, 5 vs 1).

  4.  **Drafting Section 2: What Each Rule Predicts (~200 words):**
      *   *Truth Primacy:* Predicts **Rejection**. Archives are public records; sealing them hides truth akin to demolishing the prison.
