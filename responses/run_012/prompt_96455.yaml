      *   **The Weak Link:** Premise (6) is the heavy lifter. It asserts the *Necessity of Origin*.
      *   **The Best Strategy:** Reject the strong version of (6). Adopt a "Similar Origin" view (Mackie/Robertson). I could have come from a *slightly* different sperm/egg, just not a *radically* different one (like a table or a cat).
      *   **Cost:** You lose the sharp boundary of identity. Identity becomes vague (which Lewis accepts, others don't). You admit that "Could I have existed?" doesn't always have a Yes/No answer for marginal cases.
      *   **Twins:** They show origin isn't sufficient. This undermines the motivation for thinking it's necessary. If $s+e$ can yield two people, why can't $s'+e'$ yield one of them?
      *   **IVF:** Confirms the stakes. If you keep Kripke, you accept the "different people" conclusion. If you reject Kripke, you can say the *same* child could have come from a different embryo (though this has its own biological/philosophical issues).
      *   **Ancestry:** Yes, the drag is real if you keep Kripke. Rejecting strict Necessity of Origin stops the drag at the immediate gametes (allowing slight variation).

