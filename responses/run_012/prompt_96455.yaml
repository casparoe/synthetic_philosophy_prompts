      *   *Ancestry:* Does Necessity of Origin imply Necessity of Ancestry? Kripke suggests yes. If my parents are essential, and their origins are essential, then yes. But one can argue that *my* origin is the zygote, and the zygote's origin is separate. However, the zygote is constituted by the gametes. If the gametes are essential, and *their* identity depends on *their* parents... yes, the drag is real.
