      *   *Value:* Exchange value is *not* natural. It is politically constituted. Aristotle is a chartalist *avant la lettre*.
      *   *The Pledge:* It's not just time-delay. It's about *trust* and *political continuity*. It transforms a barter transaction into a civic relationship.

