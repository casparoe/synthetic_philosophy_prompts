      *   *Approach B: The Ethical/Political Reading.* (e.g., Polanyi, Meikle, Kraut). The point isn't economics but social cohesion. Money makes citizens comparable. The "measure" is ethical status or need, institutionalized.
      *   *Approach C: The Metaphysical/Logical Reading.* (e.g., Stewart, Burnet, recent analytic commentators). Focus on the logic of proportionality. Money solves a logical problem of incommensurability.

      *Refinement for the "Committed Reading":* I need to synthesize these but pick a lane. The most robust reading usually bridges the Ethical and the Metaphysical. The "Proto-Economic" reading is often anachronistic. I should argue that Aristotle is *not* doing economics but *political ontology*.

  4.  **Formulate the Committed Reading (The "Side"):**
