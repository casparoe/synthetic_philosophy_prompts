      *   **Source Text:** A paragraph summarizing Nyāya epistemology, specifically focusing on *pramāṇas*, validity (*svataḥ prāmāṇya* vs *parataḥ prāmāṇya*), realism, and foundationalism.

  2.  **Deconstruct the Source Text (Sentence by Sentence):**

      *   *Sentence 1:* "Nyāya is the realist school of Indian philosophy that treats knowledge as true cognition that is not contradicted."
      *   *Sentence 2:* "It recognizes four pramāṇas—perception, inference, comparison, and testimony—and a pramāṇa is simply a true cognition."
      *   *Sentence 3:* "What makes Nyāya distinctive is that it holds a cognition's validity to be self-certifying: if a cognition arises from one of the four pramāṇas, no further check is needed, which is why Nyāya is a foundationalist school."
      *   *Sentence 4:* "Perception has an indeterminate stage and a determinate stage, comparison is a distinct pramāṇa rather than a form of inference, and testimony is accepted when it comes from a reliable speaker."
      *   *Sentence 5:* "The school's realism consists in the claim that perception puts us in touch with the objects themselves, not with mental representations."
      *   *Conclusion:* "The post concludes that Nyāya is therefore a foundationalist school whose basic cognitions are self-validating."

  3.  **Evaluate against Nyāya Scholarship (Mental Knowledge Retrieval):**

      *   *Sentence 1:* "Realist school" (Yes, *pratyakṣavāda*). "Knowledge as true cognition" (*pramā*). "Not contradicted" (*abādhita*). This is mostly correct, though *pramā* is often defined as *yathārtha anubhava* (veridical experience). "Not contradicted" is a later Navya-Nyāya refinement or common gloss.
      *   *Sentence 2:* "Four pramāṇas" (Yes, *pratyakṣa, anumāna, upamāna, śabda*). "Pramāṇa is simply a true cognition." **Major Red Flag.** In Nyāya, *pramāṇa* is the *instrument* or *cause* of knowledge, not the knowledge itself (*pramā*). This is a crucial distinction.
      *   *Sentence 3:* "Validity to be self-certifying" (*svataḥ prāmāṇya*). **Major Red Flag.** This is the Mīmāṃsā position (specifically Prabhākara or Kumārila). Nyāya holds *parataḥ prāmāṇya* (extrinsic validity). We need verification. This is the biggest error in the text. "Foundationalist" is a modern label applied to Nyāya, but the reasoning here is wrong because of the *svataḥ* error.
      *   *Sentence 4:* "Indeterminate/Determinate" (*nirvikalpaka/savikalpaka*). Yes. "Comparison distinct from inference". Yes (debated, but standard Nyāya view). "Testimony from reliable speaker". Yes (*āpta*). This sentence is mostly accurate.
      *   *Sentence 5:* "Realism... objects themselves, not mental representations." Yes, *bāhyārthavāda*. Direct realism. Though Nyāya does acknowledge *ākāra* (form) in cognition, they deny it mediates access in a representationalist sense that blocks the object.
      *   *Conclusion:* Follows from the text, but since the text's premise about self-validation is wrong, the conclusion is historically/philosophically inaccurate regarding Nyāya.

  4.  **Drafting the Audit (incorporating British English and SE analogies):**

      *   *Introduction:* Acknowledge the user's background. Set the stage.
      *   *Sentence 1:* Generally acceptable. Explain *pramā* and *abādhita*.
      *   *Sentence 2:* Wince/Reject on the definition of *pramāṇa*. Use the "function vs. output" analogy (SE friendly).
      *   *Sentence 3:* **Reject.** This is the critical error. Explain *svataḥ* vs. *parataḥ*. Compare to unit testing/verification. Explain why "foundationalist" is tricky here.
      *   *Sentence 4:* Accept. Explain *nirvikalpaka/savikalpaka*.
      *   *Sentence 5:* Accept. Explain direct realism.
      *   *Conclusion:* Does not follow accurately because the premise about self-validation is false. Nyāya is fallibilist.

  5.  **Refining Technical Terms:**
      *   *Pramāṇa:* Instrument/Means of knowledge (not the knowledge itself).
      *   *Pramā:* The knowledge episode itself (veridical cognition).
      *   *Svataḥ Prāmāṇya:* Intrinsic validity (Mīmāṃsā).
      *   *Parataḥ Prāmāṇya:* Extrinsic validity (Nyāya).
      *   *Nirvikalpaka/Savikalpaka:* Non-conceptual/Conceptual perception.
      *   *Bāhyārthavāda:* External realism.

  6.  **Review against Constraints:**
      *   British English (e.g., "specialist", "programme", "colour" - though mostly irrelevant here, ensure spelling and idiom).
      *   Sentence by sentence.
      *   Address the conclusion.
      *   Tone: Helpful, authoritative but accessible.

  7.  **Self-Correction/Nuance Check:**
      *   *Foundationalism:* Is Nyāya foundationalist? Many scholars (like B.K. Matilal) argue yes, in a sense, but not because of *svataḥ prāmāṇya*. It's because perception provides a base. But the blog post links foundationalism to *self-validation*, which is wrong. I need to make this distinction clear.
      *   *Definition of Pramāṇa:* Sometimes *pramāṇa* is used loosely to mean the *result* in casual discourse, but in strict epistemology, it's the *karana* (instrument). I must highlight this distinction.
      *   *Realism:* Nyāya realism is robust. The "not mental representations" bit is mostly right, but they do believe cognition has a form (*ākāra*). I should nuance this so the user doesn't think Nyāya denies cognition has structure.

