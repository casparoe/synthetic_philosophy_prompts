answer: |-
  Mom, everyone. Thank you for coming into the back room. I know it feels strange to see the long table set for a party instead of for dough, and I know it feels even stranger to feel the air in here without the heat of the ovens. For the first time in forty-four years, the ovens are cold. They've been cooling since Tuesday, and I know some of you have walked past the corner this week and felt that something was off, even if you didn't know why.

  We are here because my mother is seventy-six years old. We are here because her eyes, which have measured flour and read order slips since before most of us were born, have finally forced her to stop. Macular degeneration. It's a clinical name for a hard thing. It means she can no longer read the recipes she has known by heart since she was thirty. It means she can no longer trust her hands to do what her mind tells them to do. She is not closing this bakery because she is ready to rest. She is closing it because the work has been taken from her. I want to say that out loud, because she deserves to have her grief acknowledged, not smoothed over. She loved this work. She loved the four o'clock mornings. She loved the weight of the bread. To tell her she shouldn't miss that would be a lie.

  But there is another truth in this room, and it is standing room only.

  There is an old idea that when you grow old, you are put on a shelf. That you are removed from the active world. That you become useful only for giving advice, when what you really want is to do the work. My mother never gave advice. She gave us bread. She gave us breakfast. She gave us a place where the parish could meet and where customers could be known by their orders before they spoke. She was on her feet for forty-four years. That kind of work doesn't vanish when the feet stop. It settles into the people who were fed by it.

  Look around this room. There are former employees here whose children now buy their own wedding cakes from this counter. There are customers who have been buying loaves since the Carter administration. There are sisters, and sons, and neighbors. You are not here just to say goodbye to a shop. You are here to testify to what happens when a life is spent doing one thing well. The active life doesn't end; it changes shape. It moves from the hands of the baker into the community she built. The work is done, yes. But the value of the work is just now becoming fully visible.

  There is another old idea that says old age strips away pleasure. That because you cannot run or knead or see the way you used to, you cannot enjoy anything. I don't believe that. I think the pleasure changes. The pleasure of youth is in the appetite. The pleasure of age is in the harvest. My mother may not feel the heat of the oven anymore, but she can see this room. She can see that the bread was not just food; it was a promise kept, day after day. That is a different kind of satisfaction than the rush of the morning rush, but it is deeper. It is the satisfaction of knowing that you are owed nothing by this world, and yet this world has shown up to honor you anyway.

  We are not here to talk about what comes after. We are not here to speculate on endings. We are here to stand in the light of what has been accomplished. The body fails. The eyes dim. The ovens cool. But the nourishment remains. You have fed us for forty-four years, Mom. Now, let us feed you. Not with bread, but with this. With us.

  So if everyone could raise a glass.

  To Mom. Who taught us that a life is not measured by how long you stay on your feet, but by how many people you stand up for. To the work that is finished, and to the rest that is earned.

  \answer{The nearness of death}
