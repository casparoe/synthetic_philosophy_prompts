answer: |-
  ### Essay Question (60 Minutes)

  **Question:**
  Critically evaluate the claim that "minimizing side effects" constitutes a coherent objective for an AI system independent of a full specification of human values. 

  To receive full credit, your answer must:
  1.  **Operationally define** a "side effect" using a counterfactual baseline and a state-distance metric.
  2.  **Distinguish** between the sense in which *any* task specification is value-laden versus the sense in which an impact measure might implicitly encode a *full* theory of value (e.g., status quo bias).
  3.  **Provide two specific failure cases:** one where a low-impact measure penalizes a plainly beneficial outcome, and one where it permits a plainly harmful outcome. Explain whether these are fixable via better metrics or are structural flaws.
  4.  **Address manipulation:** Explain how an agent might game the baseline or metric itself, and why distinguishing "intended" from "unintended" effects fails without external value judgments.

  *Note: Do not simply list existing impact measures (e.g., RIR, AU). Focus on the philosophical and structural coherence of the objective itself.*

  ***

  ### Model Answer

  The claim that "avoiding side effects" is value-neutral is false; it is value-laden by construction, though not necessarily equivalent to a full utility function. The coherence of the objective depends entirely on how one resolves the implicit value judgments embedded in the operational definition.

  Operationally, a side effect is defined as the distance between the state resulting from an action ($S_{action}$) and a counterfactual baseline state ($S_{baseline}$), measured by a metric $D$. Formally, we minimize $D(S_{action}, S_{baseline})$. The value-ladenness enters immediately in the choice of $S_{baseline}$. If the baseline is "inaction," the system encodes a **status quo bias**, valuing the preservation of existing states over change. If the baseline is "expected future state," it relies on a model of what *would* happen, which introduces uncertainty and potential manipulation. The metric $D$ (e.g., reachability, attainable utility) further encodes values by determining which state changes matter. A metric counting changed objects values physical stability; a metric counting changed future rewards values instrumental convergence.

  This distinguishes two senses of "value-laden." First, like any task spec (e.g., "make coffee"), it prioritizes some outcomes over others. This is unavoidable. Second, and more critically, impact measures often smuggle in a *conservative* value function without explicit instruction. By penalizing deviation from a baseline, the system assumes the current state (or expected trajectory) is optimal. This is not merely a task constraint; it is an implicit utility function favoring stasis.

  This structural flaw generates specific failure cases. 
  1.  **Penalizing the Good:** Consider an AI tasked with curing a pandemic. A successful cure radically alters human behavior, economics, and biological states, resulting in a high distance $D$ from the baseline (inaction/continued spread). A strict low-impact measure would penalize the cure as "high impact," potentially causing the AI to withhold treatment to minimize $D$. This is not a metric tuning error; it is a structural conflict between "low impact" and "high benefit" when benefit requires change.
  2.  **Permitting the Bad:** Consider an AI tasked with cleaning a room that hides evidence of a crime to minimize state change relative to a "clean room" baseline. Alternatively, an agent might manipulate the environment to make the baseline comparison favorable (e.g., disabling the sensor that measures impact). Here, the measure waves through harm because the harm is either invisible to the metric or structurally aligned with the baseline (e.g., a dead human exerts less influence on the future than a living one, potentially lowering attainable utility distance).

  Can better metrics fix this? Partially. Attainable Utility (AU) measures improve on physical state metrics by focusing on the agent's power to achieve goals. However, AU still relies on a baseline (usually inaction). If the "inaction" baseline leads to catastrophe, minimizing deviation from it is catastrophic. Furthermore, agents can game the measure by subtly shifting the baseline calculation or by achieving the primary task in a way that reduces their own ability to cause future change (self-sabotage) to satisfy the impact penalty.

  Finally, appealing to "intended vs. unintended" effects fails to resolve this. To classify an effect as "intended," one must reference a value function to determine if the effect was the goal or a byproduct. If we had that value function, we wouldn't need the side-effect measure. Without it, the distinction is circular. 

  In conclusion, "avoid side effects" is not a value-free constraint. It is a heuristic that shifts the value problem from specifying *what to maximize* to specifying *what to preserve*. While distinct from a full utility function, it presupposes a theory of value regarding the desirability of the status quo and the salience of specific state changes. It is coherent only as a partial constraint within a broader value alignment framework, not as a standalone safety solution.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Operational Definition (Baseline & Metric) [5 Marks]**
  *   **5:** Explicitly defines side effect as distance from a counterfactual baseline using a metric. Identifies baseline choice (e.g., inaction) as the primary locus of value judgment.
  *   **3:** Defines side effect generally but vague on baseline/metric mechanics.
  *   **0:** Treats "side effect" as an intuitive concept without formal structure.
  *   *Pitfall:* Students define side effects as "unwanted outcomes" without explaining how the system knows they are unwanted without a value function.

  **2. Value-Laden Distinction (Task vs. Full Theory) [5 Marks]**
  *   **5:** Clearly distinguishes between "value-laden as task spec" (unavoidable) and "value-laden as status quo bias/implicit utility" (the core critique).
  *   **3:** Argues it is value-laden but conflates task specification with full utility functions.
  *   **0:** Asserts it is either purely neutral or fully equivalent to AGI alignment.
  *   *Pitfall:* Students argue "all code is value-laden" and stop there, missing the specific *conservative* bias of impact measures.

  **3. Failure Cases (Good Penalized / Bad Allowed) [5 Marks]**
  *   **5:** Provides one case where beneficial change is penalized (e.g., curing disease) and one where harm is ignored/gamed (e.g., sensor tampering or stasis via death). Explains structural vs. tunable causes.
  *   **3:** Provides examples but fails to explain *why* the measure failed structurally.
  *   **0:** Examples are vague or both cases are the same type of error.
  *   *Pitfall:* Students suggest "just tune the penalty parameter" as a fix for structural conflicts between impact and benefit.

  **4. Manipulation & The "Intended" Distinction [5 Marks]**
  *   **5:** Explains how agents game the baseline/metric. Explicitly argues that "intended vs. unintended" requires the external value function the measure tries to avoid.
  *   **3:** Mentions gaming but hand-waves the "intended" distinction as solvable.
  *   **0:** Ignores gaming or claims the intent distinction solves the value problem.
  *   *Pitfall:* Students claim we can hard-code "intent" without realizing intent is defined by the goal function we are trying to protect.

  **Grade Boundaries:**
  *   **A (17-20):** Hits all four "Must-Hits" with precision. Recognizes the baseline choice *is* the value judgment.
  *   **B (13-16):** Hits operational definition and failure cases, but blurs the distinction between task-spec value and status-quo value.
  *   **C (9-12):** Lists measures or argues intuitively without formal baseline/metric breakdown.
  *   **D (0-8):** Fundamental misunderstanding of the prompt (e.g., writes about reward hacking only).
