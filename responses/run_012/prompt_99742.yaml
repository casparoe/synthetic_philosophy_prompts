prompt: |-
  I run a small algorithmic-accountability unit inside a state human-services agency. Several times a year we are asked to sign off — or to refuse to sign off — on predictive models that allocate scarce public resources: which families are offered a preventive-services slot, which applicants are routed into a job-training program, which blocks are scheduled for a lead-abatement crew. The models arrive already built, with an accuracy figure attached and a vendor's assurance that the tool is fair. The decision is ours.

  The difficulty is the impossibility results. A model that is calibrated within groups, that is balanced across groups in its average scores at a given risk level, and that has equal error rates across groups cannot in general have all three at once unless the base rates are equal or the model is perfect, and we can neither equalize base rates nor build a perfect model. So the parity properties are a menu, and every choice off that menu is a choice about which group bears which kind of error. The vendor's assurance is therefore not evidence of anything; it is a choice of criterion dressed up as a property of the tool.

  Write me a decision procedure my analysts can actually run on a model-and-use-case package. It should take the package as input and produce a written determination that names, explicitly, which parity property we are treating as binding here, which we are treating as a target we will trade against, which we are knowingly sacrificing, and why. It has to force us to specify the real costs of false positives and false negatives for the particular decision at hand, and to say what we do when no defensible cost specification exists — because none of the standard parity criteria look at those costs, and a model that looks acceptable on any of them can still be the wrong thing to deploy. It has to cover the case where satisfying a parity property would require using the protected attribute, or a close proxy for it, at decision time, and the case where the relevant attribute is contested, self-reported, or simply unmeasured in our data. It has to make us state what label the model is predicting and why that label is the right object of concern, since a model can be impeccable with respect to a proxy that has nothing to do with the harm we are trying to prevent. And it has to mark, at each step, whether the step is a technical computation, a judgment call in technical clothing, or an outright value decision that must be escalated, naming who signs off.

  Then run the procedure on two cases: a tool the agency badly wants and that will pass every check we can run, and a tool whose honest cost specification points toward refusing deployment altogether. Say plainly what the procedure cannot settle, where it will misfire, and where it will produce a defensible answer that nobody in the room will be happy to hear. We have three analysts, no lawyers on staff, about two weeks per review, and the final signature is mine.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Context:** Small algorithmic-accountability unit in a state human-services agency.
      *   **Task:** Create a decision procedure for analysts to evaluate predictive models allocating scarce resources.
      *   **Core Problem:** Impossibility theorems (parity trade-offs), vendor claims of "fairness" are meaningless without context, standard metrics ignore real-world costs, legal/ethical constraints on using protected attributes, label validity issues.
      *   **Requirements for the Procedure:**
          *   Input: Model + Use-case package.
          *   Output: Written determination (Binding parity, Target parity, Sacrificed parity, Justification).
          *   Must force specification of False Positive (FP) and False Negative (FN) costs.
          *   Must handle cases where cost specification is impossible/undefendable.
          *   Must address using protected attributes (or proxies) at decision time.
          *   Must address contested/unmeasured attributes.
          *   Must validate the *label* (is it the right thing to predict?).
          *   Must tag each step as: Technical Computation, Judgment Call, or Value Decision (escalated).
          *   Must identify sign-off authority for each step.
      *   **Deliverables:**
          1.  The Decision Procedure itself.
          2.  Run the procedure on Case A (Desired tool, passes checks).
          3.  Run the procedure on Case B (Honest cost spec leads to refusal).
          4.  Meta-analysis: What the procedure *cannot* settle, where it misfires, where it produces unhappy but defensible answers.
      *   **Constraints:** 3 analysts, no lawyers, 2 weeks per review, final signature by the user (Unit Head).

  2.  **Drafting the Decision Procedure (The "Protocol"):**

      *   *Philosophy:* It needs to be bureaucratic enough to create a paper trail but sharp enough to cut through vendor fluff. It needs to acknowledge the impossibility theorems explicitly.
      *   *Structure:* Phased approach.
          *   Phase 1: Label & Objective Validity (Is this the right problem?)
          *   Phase 2: Cost & Harm Specification (What do errors actually cost?)
          *   Phase 3: Parity & Constraint Selection (Which math do we pick?)
          *   Phase 4: Implementation & Monitoring (How do we use it?)
      *   *Tagging:* Every step needs the [Technical], [Judgment], or [Value] tag + Sign-off.
      *   *Key Innovation:* The "Cost Ratio Threshold." Instead of just asking "is it fair?", ask "at what ratio of FN to FP costs does this model become net-negative?"

  3.  **Developing Case Studies:**

      *   *Case A (The "Good" Tool that is still risky):* A Lead Abatement Scheduler.
          *   *Why:* High public good, but risk of over-policing certain neighborhoods.
          *   *Outcome:* Deploy with strict monitoring.
          *   *Tension:* Vendor says "90% accurate." Analysts find label is "past complaints" not "presence of lead."
      *   *Case B (The "Bad" Tool that looks good):* A Child Welfare Risk Screener.
          *   *Why:* High stakes, impossible cost calibration.
          *   *Outcome:* Refuse deployment.
          *   *Tension:* Vendor shows equalized odds. Analysts realize the cost of a False Negative (missed abuse) is effectively infinite compared to a False Positive (unnecessary investigation), making the model's trade-off unacceptable regardless of parity.

  4.  **Drafting the Meta-Analysis (Limitations):**

      *   Where does this fail?
      *   Political pressure (the "agency badly wants" part).
      *   Data gaps (unmeasured attributes).
      *   The "Value Decision" bottleneck (who actually makes the call?).
      *   The illusion of precision in cost estimates.

  5.  **Refining the Content (Self-Correction/Iterative Polish):**

      *   *Critique:* Is the procedure too academic?
      *   *Fix:* Make the templates fill-in-the-blank. Use clear headers.
      *   *Critique:* Did I address the protected attribute usage?
      *   *Fix:* Add a specific step on "Group Definition & Data Availability."
      *   *Critique:* Did I address the label validity?
      *   *Fix:* Phase 1 must focus entirely on $Y$ (the target).
      *   *Tone:* Professional, sober, slightly weary but rigorous. Acknowledge the political reality.

  6.  **Finalizing the Output Structure:**

      *   **Part I: The Protocol (HSA-ALG-REV-01).**
      *   **Part II: Case Application (Lead Abatement vs. Child Welfare).**
      *   **Part III: Limitations & Failure Modes.**

      *(Self-Correction during drafting)*: Make sure to explicitly mention the "Impossibility Theorem" in the procedure so analysts know *why* they have to choose. Ensure the "Sign-off" chain respects the "No Lawyers" constraint (escalate to Agency Head or Legal Counsel *outside* the unit if needed, but keep internal sign-offs clear).

      *(Refining the Cost Section)*: The prompt asks to handle cases where cost specification doesn't exist. The procedure needs a "Stop" condition if costs can't be defined.

      *(Refining the Protected Attribute Section)*: Need to distinguish between *auditing* by group (allowed/necessary) and *using* group for decision (often illegal).

  7.  **Final Review against Constraints:**
      *   3 analysts? Yes, procedure assigns roles.
      *   2 weeks? Yes, phased timeline.
      *   No lawyers? Yes, escalate value decisions to Agency Head/External Counsel.
      *   Final signature mine? Yes.

  8.  **Writing the Response.** (Proceeding to generate the text based on these thoughts.)
answer: |-
  ## Part I: The Decision Procedure (HSA-ALG-REV-01)

  **Purpose:** To force explicit trade-off selection in the presence of mathematical impossibility theorems, validate the target label against actual harm, and document the cost-benefit analysis of deployment.
  **Timeline:** 10 Business Days.
  **Personnel:** 3 Analysts (A1, A2, A3). Final Sign-off: Unit Head.

  ### Phase 1: Label Validity & Objective Definition (Days 1-3)
  *Goal: Determine if the model is predicting the thing we actually care about.*

  **Step 1.1: The Label Audit.**
  *   **Action:** Identify the target variable $Y$ used in training. Compare $Y$ to the actual harm or benefit the agency intends to address.
  *   **Input:** Vendor data dictionary, Program policy manual.
  *   **Tag:** [Judgment Call]
  *   **Sign-off:** Senior Analyst (A1).
  *   **Deliverable:** A statement: "The model predicts [Label], but the agency cares about [Actual Harm]. The correlation between them is [Strong/Weak/Contested] because..."
  *   **Stop Condition:** If correlation is Weak or Contested, proceed to Step 1.2. If Strong, proceed to Phase 2.

  **Step 1.2: The Proxy Risk Assessment.**
  *   **Action:** If $Y$ is a proxy (e.g., "arrests" instead of "crime," "complaints" instead of "lead presence"), document the bias mechanism.
  *   **Tag:** [Value Decision]
  *   **Sign-off:** Unit Head.
  *   **Deliverable:** "We accept/reject the proxy because the error structure of the proxy aligns/misaligns with our mission."

  ### Phase 2: Cost Specification & Error Weighting (Days 4-6)
  *Goal: Quantify the real-world impact of errors. If quantification fails, document why.*

  **Step 2.1: The Cost Matrix.**
  *   **Action:** Define costs for True Positive (TP), True Negative (TN), False Positive (FP), False Negative (FN).
      *   *FP Cost:* Resource waste, stigma, unnecessary intrusion.
      *   *FN Cost:* Missed prevention, harm occurrence, liability.
  *   **Input:** Program budget, historical incident reports, stakeholder interviews.
  *   **Tag:** [Judgment Call]
  *   **Sign-off:** All Analysts (Consensus).
  *   **Deliverable:** A ratio $C_{FN} / C_{FP}$. (e.g., "One missed lead case is worth 10 unnecessary inspections.")

  **Step 2.2: The Indefensibility Clause.**
  *   **Action:** If a cost ratio cannot be defended (e.g., comparing dollars to child safety), state this explicitly.
  *   **Tag:** [Value Decision]
  *   **Sign-off:** Unit Head.
  *   **Deliverable:** "Cost specification is impossible. We are substituting a parity constraint for a cost function." (If this box is checked, Phase 3 becomes binding).

  ### Phase 3: Parity Selection & Impossibility Acknowledgement (Days 7-8)
  *Goal: Choose which mathematical fairness property binds, acknowledging the sacrifice.*

  **Step 3.1: The Impossibility Statement.**
  *   **Action:** Calculate Base Rates ($P(Y=1|G)$) for protected groups. If base rates differ, acknowledge that Calibration, Equalized Odds, and Demographic Parity cannot all hold.
  *   **Tag:** [Technical Computation]
  *   **Sign-off:** Analyst A2.
  *   **Deliverable:** "Base rates differ by [X]%. We cannot satisfy all parity criteria."

  **Step 3.2: The Binding Constraint.**
  *   **Action:** Select ONE binding parity property based on Phase 2 costs or Phase 1 values.
      *   *Calibration:* If resource efficiency is paramount.
      *   *Equalized Odds:* If error burden sharing is paramount.
      *   *Demographic Parity:* If historical exclusion remediation is paramount.
  *   **Tag:** [Value Decision]
  *   **Sign-off:** Unit Head (Requires Agency Head notification).
  *   **Deliverable:** "We bind [Property]. We sacrifice [Property]. This choice prioritizes [Group/Outcome] because..."

  **Step 3.3: The Protected Attribute Protocol.**
  *   **Action:** Determine if the protected attribute (PA) is used in the model, used for post-hoc adjustment, or unmeasured.
  *   **Tag:** [Judgment Call]
  *   **Sign-off:** Senior Analyst (A1).
  *   **Deliverable:** "PA is [Used/Not Used/Imputed]. If Not Used, we audit via [Proxy/Statistical Imputation]. Legal risk is [Low/Med/High]."

  ### Phase 4: Final Determination (Days 9-10)
  *Goal: Produce the signature document.*

  **Step 4.1: The Deployment Memo.**
  *   **Action:** Compile findings. State "Deploy," "Deploy with Conditions," or "Refuse."
  *   **Tag:** [Value Decision]
  *   **Sign-off:** Unit Head.
  *   **Deliverable:** Final Report.

  ***

  ## Part II: Case Applications

  ### Case 1: The Lead Abatement Scheduler (The "Desired" Tool)
  **Context:** A model predicts which city blocks have the highest probability of containing lead pipes to schedule inspection crews. The agency wants this badly to maximize limited crew efficiency.
  **Data:** Historical inspection records, housing age, tax records.
  **Protected Attribute:** Race/Ethnicity (not in model, but available for audit via census tract).

  **Phase 1: Label Validity**
  *   **1.1 Judgment:** Model predicts "Past Inspection Failure." Agency cares about "Current Lead Presence."
  *   **Finding:** Correlation is Strong (lead pipes don't vanish), but inspection history is biased toward neighborhoods that were inspected more frequently in the 1990s.
  *   **Sign-off:** A1.

  **Phase 2: Cost Specification**
  *   **2.1 Judgment:**
      *   *FP Cost:* Crew spends day digging up safe pipe ($2,000 + opportunity cost).
      *   *FN Cost:* Child exposed to lead (Lifetime health cost ~$100,000+).
      *   *Ratio:* $C_{FN} / C_{FP} \approx 50:1$.
  *   **2.2 Indefensibility:** Ratio is defensible in economic terms, but ethically fraught.
  *   **Sign-off:** Consensus.

  **Phase 3: Parity Selection**
  *   **3.1 Technical:** Base rates of "Past Failure" differ by race due to historical inspection bias. Impossibility theorem triggers.
  *   **3.2 Value Decision:** We bind **Calibration**. If the model says 80% risk, it must be 80% risk for all groups. We sacrifice **Equalized Odds**.
      *   *Why:* We need to ensure crews aren't sent to low-risk areas just to meet a quota (wasting resources), but we accept that some high-risk areas might be under-inspected if the data is poor.
      *   *Correction:* Actually, given the 50:1 cost ratio, we must minimize FN. We bind **Recall (True Positive Rate)** across groups. We sacrifice **Precision**.
  *   **3.3 Protected Attribute:** PA not used in scoring. Used for post-hoc audit.
  *   **Sign-off:** Unit Head.

  **Phase 4: Determination**
  *   **Decision:** **Deploy with Conditions.**
  *   **Condition:** Quarterly audit of Recall by census tract. If Recall drops below 90% for any group, model is paused.
  *   **Sign-off:** Unit Head.

  ### Case 2: The Family Preservation Screener (The "Refusal" Case)
  **Context:** A model predicts "Risk of Re-Entry into Foster Care" to allocate preventive counseling slots.
  **Data:** Case worker notes (NLP), prior CPS calls, demographic data.
  **Protected Attribute:** Race (explicitly in data).

  **Phase 1: Label Validity**
  *   **1.1 Judgment:** Model predicts "Re-Entry into Foster Care." Agency cares about "Child Safety."
  *   **Finding:** Re-entry is a proxy for safety, but also a proxy for "Surveillance Intensity." Families of color are surveilled more, leading to higher re-entry detection.
  *   **1.2 Value Decision:** The label is contaminated by systemic bias.
  *   **Sign-off:** Unit Head.

  **Phase 2: Cost Specification**
  *   **2.1 Judgment:**
      *   *FP Cost:* Unnecessary counseling, stigma, potential removal threat ($5,000 + family trauma).
      *   *FN Cost:* Child harm/death.
      *   *Ratio:* $C_{FN} / C_{FP} = \infty$. (We cannot tolerate missed harm).
  *   **2.2 Indefensibility:** **Triggered.** You cannot put a finite number on child safety. A cost-benefit analysis is morally indefensible here.
  *   **Sign-off:** Unit Head.

  **Phase 3: Parity Selection**
  *   **3.1 Technical:** Base rates of "Re-Entry" differ significantly by race.
  *   **3.2 Value Decision:** Because Cost Spec failed (2.2), we require **Demographic Parity** (equal allocation of slots) to prevent resource hoarding by majority groups, OR **Equalized Odds** to prevent error disparity.
      *   *Conflict:* To achieve Equalized Odds with infinite FN cost aversion, we must intervene on *everyone*.
      *   *Conflict:* To achieve Demographic Parity, we must ignore risk scores for some groups.
  *   **3.3 Protected Attribute:** Model uses Race as a feature to "correct" for base rates.
      *   *Legal Risk:* High. Using race to allocate benefits is constitutionally suspect.
  *   **Sign-off:** Unit Head.

  **Phase 4: Determination**
  *   **Decision:** **Refuse Deployment.**
  *   **Reasoning:**
      1.  Label validity is compromised by surveillance bias (Phase 1).
      2.  Cost specification is impossible; therefore, the model cannot be optimized for utility (Phase 2).
      3.  Satisfying parity requires using Race explicitly, creating legal liability, or ignoring risk, negating the tool's purpose (Phase 3).
  *   **Sign-off:** Unit Head.

  ***

  ## Part III: Limitations & Failure Modes

  This procedure is a shield, not a sword. It will not save you from political reality, and it will not solve the math. Here is where it breaks:

  **1. The "Value Decision" Bottleneck**
  *   **Failure Mode:** Phase 3.2 requires *you* (Unit Head) to sign off on sacrificing a parity property. In Case 2, you refused. In a high-pressure environment, the Agency Head may demand deployment despite your refusal.
  *   **Reality:** This procedure creates a paper trail that protects *you* personally, but it cannot stop a determined political appointee from overruling you. It turns a technical deployment into a political scandal, which is the only leverage you have.
  *   **Where it misfires:** When the Agency Head says, "I accept the risk. Sign it." You then must decide whether to resign. The procedure cannot answer that.

  **2. The Cost Specification Illusion**
  *   **Failure Mode:** Phase 2.1 asks for a cost ratio. In Case 1, we said 50:1. This is a fiction. We don't know the cost.
  *   **Reality:** Analysts will treat this number as a "technical computation" rather than a "judgment call." They will tune the model to optimize this specific ratio, giving a false sense of precision.
  *   **Mitigation:** The procedure tags this as [Judgment], but analysts often ignore tags. You must audit the *source* of the cost number, not just the number itself.

  **3. The Unmeasured Attribute**
  *   **Failure Mode:** Phase 3.3. What if Race is not in the data, and proxies (ZIP code) are legally gray?
  *   **Reality:** The procedure forces you to state how you audit. If you can't audit, you can't verify parity.
  *   **Where it produces unhappy answers:** The determination will read: "We cannot verify fairness because we are forbidden from collecting the data needed to measure it." This is a defensible answer, but it leaves the agency vulnerable to lawsuits. It forces the agency to choose between legal risk (collecting data) and ethical risk (blind deployment). Nobody wants to sign that.

  **4. The Vendor Black Box**
  *   **Failure Mode:** Phase 1.1. The vendor claims the label is "Safety," but it's actually "Complaints."
  *   **Reality:** Vendors will not give you weights. They will give you API access only.
  *   **Where it misfires:** If you cannot inspect the label definition, Phase 1 fails. The procedure dictates "Refuse," but the contract may already be signed.
  *   **Mitigation:** The procedure must be a *pre-procurement* requirement. If run post-procurement, it is a suicide pact.

  **5. The "Defensible but Unhappy" Outcome**
  *   **Scenario:** Case 1 (Lead). The procedure says "Deploy."
  *   **Unhappy Truth:** You know the model will under-inspect minority neighborhoods because the historical data is biased (Phase 1.1). But you bound Recall, so you catch the worst cases.
  *   **The Cost:** You have mathematically formalized a disparity. You have signed a document saying, "We accept that Group X gets fewer inspections than Group Y, provided the risk score is calibrated."
  *   **Defensibility:** It is defensible because you maximized safety under resource constraints.
  *   **Happiness:** Community advocates will be furious. The procedure does not generate consensus; it generates accountability. It ensures that when the scandal hits, the memo explains *why* the decision was made, shifting the blame from "incompetence" to "policy choice."

  ### Final Note to the Unit Head
  You have three analysts and no lawyers. This procedure relies on your signature for every [Value Decision]. That makes you the bottleneck.
  *   **Risk:** You will become the "No Person."
  *   **Strategy:** Use the procedure to force the *program owners* to make the Value Decisions. In Phase 3.2, require the Program Director to sign the "Binding Constraint" selection alongside you. Make them own the trade-off. If they won't sign, you don't sign.
  *   **The Hard Truth:** The only thing this procedure guarantees is that you will know exactly what kind of harm you are automating. It does not guarantee you can stop it. But it ensures you cannot claim you didn't know.
