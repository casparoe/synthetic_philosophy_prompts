answer: |-
  Let's cut straight to the conceptual tension. You are asking whether Alsace-Moselle breaks the theory of neutrality, or whether it reveals that the theory was never the operating system to begin with.

  ### 1. The Neutrality Lens: Horizontal and Vertical Failures

  To analyze this through the neutrality ideal, we must distinguish the two axes you identified: horizontal neutrality (among religions) and vertical neutrality (between religion and non-religion).

  **The Parties and Their Entitlements**
  Under a standard liberal neutrality framework, the parties are: (1) the recognized cults (Catholic, Lutheran, Reformed, Jewish), (2) the unrecognized religions (primarily Islam, but also Buddhists, Evangelicals, etc.), and (3) the non-believers/atheists.
  *   **Horizontal Entitlement:** Equal regard. The state should not privilege one theological truth claim over another.
  *   **Vertical Entitlement:** Equal regard. The state should not privilege religious comprehensive doctrines over secular ones, nor vice versa.

  **The Alsace-Moselle Verdict**
  On these terms, the Alsace-Moselle regime is a categorical failure.
  *   **Vertically:** It is not neutral between belief and unbelief. It funds clergy; it does not fund atheist associations. It mandates religious instruction (albeit with an opt-out); it does not mandate secular ethics instruction with a religious opt-out. It structurally assumes the citizen is a believer unless they opt out, whereas the 1905 regime assumes the citizen is a private actor whom the state ignores.
  *   **Horizontally:** It is not neutral among religions. It creates a two-tier citizenship of faith. A Catholic priest is a civil servant; an Imam is a private contractor. A Jewish consistory has state-backed authority; a Muslim council does not.

  **The Baseline Problem**
  You ask if the closed list shows that even-handedness needs a baseline the theory can't supply. The answer is yes. Neutrality is a procedural virtue, not a substantive one. To be neutral *among* religions, you must first define the set of religions to be treated neutrally.
  *   If the baseline is **historical entrenchment**, Alsace-Moselle is consistent. It freezes the 1801 snapshot.
  *   If the baseline is **current demographic weight**, Alsace-Moselle is unjust (excluding Islam).
  *   If the baseline is **theoretical claim to conscience**, Alsace-Moselle is arbitrary.

  But here is the trap for the 1905 regime: it claims to solve this by recognizing *no* religions. But by refusing to recognize *any*, it implicitly adopts a baseline of "private voluntary association." This disadvantages hierarchical religions (like Catholicism or Islam) that require institutional infrastructure, compared to decentralized or privatized faiths. Furthermore, 1905 is not neutral vertically; by stripping religion of public funding and status, it privileges secular public space over religious public space.

  So, your intuition is correct: the "closed list" problem in Alsace proves that **neutrality cannot generate its own scope.** Someone must decide which beliefs count as "religions" worthy of accommodation. In Alsace, the state decided in 1801 and refused to update. In 1905 France, the state decided that *no* religion gets public status. Both are non-neutral choices masked as settlements. Alsace is just honest about the exclusion; 1905 is honest about the marginalization.

  ### 2. What the Case Does to the Theory

  This is where the Alsace-Moselle case becomes destructive to standard liberal church-state theory. Standard theory assumes the state is an arbiter standing *outside* the religious field, ensuring fair play. Alsace-Moselle shows the state *inside* the field, playing the game.

  **The Silence of Theory on Administration**
  Liberal theory talks about rights (free exercise, non-establishment). It is silent on **administration**. It has no vocabulary for the fact that the Bishop of Metz is appointed by the President of the Republic.
  *   Theory asks: "Is the citizen free?"
  *   Alsace asks: "Is the church integrated?"
  Theory cannot explain why a system where the Head of State appoints religious leaders is constitutional, because theory assumes separation of powers includes separation of spiritual and temporal authority. Alsace-Moselle demonstrates that in the French tradition, the "temporal" absorbs the "spiritual" for the sake of public order.
  Theory is also silent on **transition costs**. Neutrality theory suggests adding Islam to the Concordat list would restore fairness. But theory cannot account for the diplomatic treaty required with the Holy See to alter the Catholic arrangement, or the lack of a centralized "Pope of Islam" to sign the agreement. Theory assumes rights are claimable by individuals; Alsace shows that religious rights in this system are claimable only by corporations the state has already vetted.

  ### 3. The Gallican Reading: Anomaly or Honest Truth?

  Now to the core argument. If we discard the neutrality lens and apply the **State Authority (Gallican)** lens, the picture inverts completely.

  **Laïcité as Sovereignty, Not Neutrality**
  The rival reading posits that French church-state policy is not about protecting religion from the state, nor the state from religion, but about ensuring the **Republic's monopoly on public order.** Religion is a potential source of competing loyalty. Therefore, the state must domesticate it.
  *   **1905 Regime:** This was an anti-clerical strategy. By forcing churches into *associations cultuelles* (private law associations), the state broke the transnational authority of the Catholic Church. It made priests accountable to local lay boards, which were accountable to French law. It looked like "separation," but it was actually "restructuring."
  *   **Alsace-Moselle Regime:** This is the same goal, achieved through integration rather than restructuring. By paying the clergy, the state makes them civil servants. A civil servant owes loyalty to the State. By having the President appoint the Bishop, the State ensures the Bishop is politically reliable.

  **Is Alsace an Anomaly?**
  Under the neutrality reading, Alsace is an anomaly—a historical glitch that survived because of the 1918 border shift.
  Under the State Authority reading, **Alsace-Moselle is the honest picture, and 1905 is the camouflage.**
  *   In Alsace, the state admits it wants to manage religion. It puts clergy on the payroll so it can regulate them.
  *   In the rest of France, the state manages religion by defunding it and regulating its legal structure.
  *   **The Islam Test:** This reading explains the exclusion of Islam perfectly. Under neutrality theory, excluding Islam is a scandal of fairness. Under the State Authority theory, excluding Islam is a **bureaucratic delay.** The French state does not recognize Islam in Alsace (or fund mosques nationally) not because it is neutral, but because it has not yet successfully structured French Islam into a partner it can control. The state wants a "Consistory of Islam" it can talk to, just like the Jewish Consistory. Until French Islam is "Gallicized"—organized in a way the Interior Ministry can manage—it cannot be admitted to the Concordat.

  This suggests that *laïcité* was never about neutrality between belief and unbelief. It was about the **statization of religion.** The 1905 law didn't end state involvement; it changed the mechanism from direct payroll (Alsace) to regulatory containment (Rest of France). Alsace-Moselle simply retains the older, more direct mechanism of control.

  ### 4. Where the Theory is Silent

  To conclude with the honest note you requested: Liberal political theory hits a wall here because it lacks a concept of **positive establishment for the sake of public order.**

  1.  **Theory assumes individualism:** It cannot process corporate recognition. It sees the exclusion of Islam as a violation of individual Muslim rights. It cannot see that the French state views recognition as a privilege granted to *corporations* that prove their loyalty to the Republic.
  2.  **Theory assumes stasis:** It treats the "list" of religions as a given. It cannot handle the dynamic of "state formation of religion." It doesn't account for the state actively shaping the theology or hierarchy of a religion (e.g., training Imams in French universities) to make it "recognizable."
  3.  **Theory assumes neutrality is possible:** Alsace-Moselle demonstrates that the state is always already embedded in the religious field. The choice is not between involvement and non-involvement, but between **overt management** (Concordat) and **covert management** (1905 regulatory framework).

  **The Argument:**
  Alsace-Moselle does not fit the neutrality ideal because the neutrality ideal is a poor descriptor of the French constitutional tradition. The case should not be analyzed as a failure of neutrality, but as a success of **statism.** It reveals that the 1905 separation was not a retreat of the state from religion, but a change in tactics. Alsace-Moselle survives not because France is inconsistent, but because it is pragmatic: where direct control (Concordat) was legally locked in, it kept it; where it wasn't, it used the 1905 law. Both serve the same end: ensuring that no religious authority stands outside the sovereignty of the Republic. The exclusion of Islam is not a failure of the theory of neutrality; it is evidence of the theory of sovereignty. The state does not recognize Islam because it has not yet finished conquering it.
