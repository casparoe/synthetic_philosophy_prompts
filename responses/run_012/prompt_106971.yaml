answer: |-
  Bottom line: There is no single established term that captures your entire pattern, though it aligns closely with anti-utilitarian critiques of value. The phenomenon is best understood as **Constitutive Particularity**, where worth emerges from specific history and structure rather than isolated utility or quality.

  Closest established concepts: **Aristotle's Friendship Types** captures your first observation well. Aristotle distinguishes friendships of utility from those of virtue, arguing the former are inherently lesser. This explains why introducing utility feels like a degradation. However, it fails to explain your second point: why rupture *increases* value. For Aristotle, stability is key; fracture is usually a defect, not an enhancement. It also offers no tools for your aesthetic observations regarding painting contexts.

  **Gestalt Holism** states the whole is other than the sum of its parts. This maps cleanly onto your painting observation: a passage's value depends on its context. It explains why a clumsy passage might serve a whole better than a perfect one. Yet, it is purely structural and spatial. It cannot account for the moral discomfort you feel when friendship becomes useful, nor does it incorporate the temporal dimension of history and rupture that defines your friendship observations.

  **Anti-Utilitarian Particularism (Bernard Williams)** argues against utilitarianism's claim that all happiness units are interchangeable. This fits your third point: you cannot swap friendships for equal happiness. It validates the non-fungibility of personal projects. However, Williams focuses on the agent's integrity, not the object's history. It explains why *you* care, but not why the *friendship itself* changes worth when utility is introduced. It misses the ontological shift you perceive in the relationship itself, treating it as a subjective preference rather than a structural change in value.

  One phenomenon or several: Your observations are not three unrelated things, but distinct manifestations of a single metaphysical stance on value. Observations 1 and 4 are moral; Observation 3 is aesthetic. They cohere because they all reject **atomism**—the idea that value resides in isolated moments or qualities. Instead, they assert **narrative holism**: value emerges from the specific history and structural arrangement of elements.

  Observation 1 (utility) fails because it reduces a narrative bond to a transactional atom. Observation 2 (rupture) succeeds because it enriches the narrative structure, adding depth that mere continuity lacks. Observation 3 (art) mirrors this: the paint is the atom, the composition is the narrative. Observation 4 confirms the conclusion: if value were atomistic (happiness units), swapping would be neutral. Because value is constitutive of the specific history, swapping destroys the value.

  Separating them would be a mistake. The discomfort with utility and the refusal to swap friendships stem from the same source as the valuation of the painting: the worth is in the **particular arrangement over time**, not the isolated quality. To treat them separately would be to miss the unified critique of instrumental reasoning you have uncovered. The aesthetic and moral domains are linked here by the primacy of history over state.

  A name and a definition: **Term:** **Constitutive Particularity.**
  **Definition:** A mode of valuation where an entity's worth is determined by its unique history and structural relations, rendering it non-exchangeable for equivalents and sensitive to instrumentalization. Value is not a property of the object's current state, but of the specific path taken to arrive there.
  **Test:** To decide if a case falls under this, ask: "If I replaced this with a physically identical counterpart lacking its specific history, would value be lost?" If yes, it qualifies.
  **Contrasts:** This must be held apart from **Sentimentalism**, which locates value in subjective feeling. Constitutive Particularity claims the value is in the object's history, regardless of feeling. It also contrasts with **Utilitarianism**, which treats value as fungible units of welfare. Here, the unit is the unique narrative, not the happiness produced. Finally, distinguish from **Scarcity**: rare items are valuable because few exist; these items are valuable because *this* specific history exists. Introducing utility devalues because it re-categorizes the history from a narrative to a transaction.

  Boundary cases: 1. **A Perfect Art Forgery:** Verdict: **Fits.** Physically identical to the original, yet worth less. The value lies in the specific history of creation (constitutive particularity), not just the visual data. The forgery lacks the authentic narrative path.

  2. **Paying a Friend for a Ride:** Verdict: **Fits.** Introduces utility into a particular bond. The transaction replaces the narrative history with a market exchange, diminishing the relational worth as you described. The history becomes irrelevant compared to the service.

  3. **A Mass-Produced Chair:** Verdict: **Excludes.** One IKEA chair is exchangeable for another identical model. The history of manufacture does not confer unique value; it is fungible utility. No specific narrative attaches to the object itself.

  4. **Restoring a Ruined Temple:** Verdict: **Fits (with nuance).** Like your rupture observation, the repair adds value through the narrative of survival. However, if restored too perfectly (erasing history), it may lose value, proving the history matters more than the aesthetic state. The scars are part of the constitutive particularity.
