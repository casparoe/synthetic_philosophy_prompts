answer: |-
  Here is the translation and the residue report, straight and without the usual philosophical padding.

  ### Part 1: The Translation (Memetics $\rightarrow$ Population Genetics)

  You asked for the core claims of memetics restated in the vocabulary of population genetics. I will treat the "Meme" as the unit of selection analogous to the allele, and the "Host" as the vehicle.

  1.  **The Unit:** A meme is a **cultural allele** at a specific **cultural locus** (a cognitive slot, e.g., "afterlife belief").
  2.  **The Population:** The set of potential hosts ($N$). Note that $N$ is dynamic (births/deaths) and hosts can carry multiple alleles at the same locus (polyploidy/heterozygosity equivalent is holding conflicting beliefs, usually resolved by cognitive dissonance mechanisms).
  3.  **Frequency ($p$):** The proportion of hosts in the population expressing or holding the specific cultural allele.
  4.  **Fitness ($w$):** The expected number of new hosts infected/converted per time step per current host. This includes vertical transmission (parent to offspring) and horizontal/oblique transmission (peer-to-peer).
      *   $w = 1 + s$, where $s$ is the **selection coefficient**.
      *   In strict memetics, $s$ is determined by the meme's intrinsic properties (catchiness), often independent of host genetic fitness.
  5.  **Mutation ($\mu$):** The probability that a transmission event results in a modified allele. In culture, $\mu$ is exceptionally high compared to DNA.
  6.  **Drift:** Stochastic fluctuations in $p$ due to finite $N$ (finite number of learners). In small groups, rare memes are lost even if $s > 0$.
  7.  **Gene Flow (Migration):** Movement of hosts between subpopulations carrying different allele frequencies, resulting in homogenization or introgression of cultural alleles.
  8.  **Linkage & Hitchhiking:** Memes are often transmitted in blocks (**memeplexes**). A neutral or deleterious meme can increase in frequency if tightly linked to a meme with high $s$ (e.g., a costly ritual hitchhiking on a salvation promise).
  9.  **The "Meme's Point of View":** This is a claim that selection acts primarily on the cultural allele's $w$, even if it reduces the host's genetic fitness ($w_{host}$). This is analogous to **meiotic drive** or **transposons**: selfish genetic elements that propagate at the expense of the organism.
  10. **Genotype-Phenotype Map:**
      *   *Genotype:* The neural instantiation of the meme.
      *   *Phenotype:* The behavioral output that facilitates transmission (e.g., preaching, wearing a symbol).
      *   *Selection:* Acts on the phenotype to change the genotype frequency.

  ***

  ### Part 2: The Residue Report

  Here is where the translation breaks. These are not minor parameter adjustments; they are structural mismatches between the mathematical requirements of population genetics and the mechanics of cultural transmission.

  #### 1. Blending Inheritance (The Pre-Mendelian Problem)
  **Your Suspicion:** Confirmed. This is the strongest objection.
  **The Mechanics:** In pop gen, alleles are particulate. If $A$ and $a$ mate, the offspring carries both, and $a$ can re-emerge intact in the next generation. In culture, transmission is often averaging. If Host 1 holds belief $X$ (value 1.0) and Host 2 holds belief $X$ (value 0.0), the learner often acquires $X$ (value 0.5).
  **The Consequence:** Blending inheritance halves the variance ($V_G$) every generation. Without a constant, massive input of new variation (mutation) or a mechanism to particulate-ize the trait, selection cannot act because there is no heritable variance to select *on*. The trait swamps to the mean.
  **The Fudge:** Memeticists argue that some cultural traits *are* particulate (e.g., specific lyrics, dogmas). But this is an empirical claim, not a structural feature of culture. Most cultural traits (accents, techniques, norms) blend.
  **Verdict:** **Fatal to the strict analogy.** You cannot run a selection model on a system where heritability ($h^2$) decays to zero exponentially without assuming a particulate mechanism that largely doesn't exist.

  #### 2. Fidelity and the Replicator (Reconstruction vs. Copying)
  **Your Suspicion:** Confirmed.
  **The Mechanics:** Genetic replication is template-based. The parent molecule physically guides the construction of the daughter molecule. Cultural transmission is **reconstructive**. The learner observes a phenotype (behavior/artifact) and infers the underlying rule (genotype) using their own cognitive machinery.
  **The Consequence:**
  1.  **Directed Mutation:** In pop gen, $\mu$ is random with respect to fitness. In culture, "errors" are biased by the learner's psychology (e.g., optimality biases, content biases). This isn't mutation; it's a systematic transformation function.
  2.  **No Stable Replicator:** If the "genotype" is reconstructed anew in every host based on the previous host's "phenotype," there is no continuous physical lineage of the replicator. The "meme" is a type, not a token. Selection acts on types, but evolution requires the differential survival of tokens.
  **The Fudge:** Memeticists treat reconstruction error as high $\mu$. But high random $\mu$ creates an error catastrophe (Eigen's paradox). If the "mutation" is actually a systematic bias (e.g., "make the story more exciting"), that is **selection**, not mutation. This conflates the source of variation with the filter of selection.
  **Verdict:** **Major structural mismatch.** The "replicator" is an abstraction, not a physical entity subject to conservation laws.

  #### 3. The Phenotype and Fitness Tautology
  **Your Suspicion:** Confirmed. This is the deepest conceptual hole.
  **The Mechanics:** In biology: Genotype $\rightarrow$ Development $\rightarrow$ Phenotype $\rightarrow$ Interaction with Environment $\rightarrow$ Fitness (Survival/Reproduction). There is a causal chain.
  **In Memetics:** The "phenotype" is the behavior that causes the meme to be copied. The "fitness" is the rate of copying.
  **The Consequence:** Fitness is defined *as* the replication rate. But the replication rate is *caused* by the phenotypic effect.
  *   *Biology:* Hemoglobin allele $\rightarrow$ Oxygen transport $\rightarrow$ Survival $\rightarrow$ Frequency increase.
  *   *Memetics:* "Catchy" allele $\rightarrow$ Singing $\rightarrow$ Copying $\rightarrow$ Frequency increase.
  The problem is that "Catchy" is defined retrospectively by the frequency increase. In biology, we can measure the physiological effect (oxygen transport) independent of the frequency change. In memetics, the "effect" is often just "got copied."
  **Verdict:** **Tautological risk.** Without an independent measure of the phenotype's functional utility (outside of its copying success), the theory explains nothing. It becomes a description of frequency change, not an explanation of *why*.

  ***

  ### Part 3: The Verdict

  **Is the translation robust?**
  No. The memetic framework is not a rigorous application of population genetics to culture; it is a metaphor that borrows the *language* of population genetics without satisfying the *mathematical preconditions* (particulate inheritance, low mutation rate, distinct genotype-phenotype separation).

  **Is your vocabulary missing something?**
  No. Your suspicions are correct. The problems you identified (blending, fidelity, phenotype definition) are not artifacts of your biological training; they are the exact reasons why mainstream cultural evolution theory (e.g., Boyd, Richerson, Henrich) moved away from strict "Memetics" toward **Dual Inheritance Theory** or **Cultural Epidemiology**.
  *   They dropped the requirement for a "replicator."
  *   They model transmission as **learning rules** (psychological biases) rather than gene-like copying.
  *   They accept blending inheritance and model it using quantitative genetics (Lande equations) rather than discrete allele models.

  **The "Meme's Point of View":**
  This specific claim (that we should model culture as selfish replicators) is the weakest link. In biology, the "selfish gene" works because the gene is physically conserved. In culture, the "selfish meme" is an anthropomorphism of a statistical trend. A meme cannot have a "point of view" because it has no mechanism to preserve its integrity against the host's cognitive reconstruction. When a host modifies an idea to suit their needs, the "meme" didn't survive; a new variant was born.

  **Confidence Level:**
  *   **High Confidence:** On the blending inheritance and fidelity issues. These are mathematical dealbreakers for strict allele-frequency models.
  *   **Moderate Confidence:** On the phenotype/fitness tautology. Some memeticists argue for "extended phenotypes" (e.g., a church building), but this still relies on the building causing the copying of the idea, which loops back to the tautology.
  *   **Low Confidence:** On the philosophical implication that this renders cultural evolution study useless. It doesn't. It just means the *mechanism* isn't Darwinian selection on replicators. It's epidemiological diffusion with biased transmission.

  ***

  ### Part 4: What Would Change My Mind?

  If you want to know what would validate the strict memetic translation, I need to see one of the following:

  1.  **Evidence of Particulate Cultural Inheritance:** Demonstrate a cultural trait that is transmitted with high fidelity ($\mu < 10^{-3}$), does not blend upon recombination, and retains identity across generations independent of reconstruction. (e.g., If specific oral traditions showed the same molecular-clock-like divergence patterns as DNA, independent of functional utility).
  2.  **Decoupling of Fitness and Copying:** Show a case where a meme's "phenotypic effect" can be measured independently of its transmission rate, and that effect predicts the transmission rate. Currently, "fitness" in memetics is almost always just "frequency change."
  3.  **Error Catastrophe Resolution:** A model showing how cultural information persists over millennia despite reconstruction error rates that should theoretically dissolve the signal within a few generations (unless you invoke selection, but then you must define the phenotype independently).

  **Final Word:**
  You are not importing your framework incorrectly. The memeticists are importing *your* framework incorrectly. They are applying the equations of population genetics to a system that violates the assumptions of those equations. The "Residue" isn't missing data; it's the structural difference between template-based replication and reconstructive learning. Stick to your instincts: without particles, you don't have genetics. You have statistics.
