      We came in second at state last year with a machine built for patience. This year, the game demanded speed. The teams that tore everything apart in January flew up the rankings. We kept refining what we knew. We told ourselves consistency was a strength. But there is a difference between consistency and stubbornness. When the ground shifts, the tree that bends survives. The tree that stands rigid breaks. We stood rigid. That was our choice.

      But choice isn't everything. In the quarterfinals, the field control system died. Our match vanished into thin air. No referee could bring it back. We had spare motors. We had checklists. We had prepared for every failure we could imagine. We could not prepare for that. Some things simply happen to us. No amount of late nights in the lab buys immunity from chaos.

