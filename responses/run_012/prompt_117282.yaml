      *   *Thread 2: Design vs. Nature.*
          *   Q3: Typogenetics was designed by Hofstadter to work. Nature wasn't.
          *   Q4: Does this matter? Is it a universal property of formal systems?
          *   *Refinement:* Push on the "rigged" aspect.
          *   *Draft:* "Typogenetics is a toy. It was built to quine. Does finding a quine in a system built to quine prove anything about systems not built to quine?"
          *   *Follow-up:* If she pivots to "any rich enough system," ask about the threshold of richness.

      *   *Thread 3: Falsifiability/Breaking Point.*
          *   Q5: What kills the theory?
          *   Q6: Self-replication without encoding (e.g., crystal growth, simple autocatalysis).
          *   *Refinement:* Distinguish between template replication and metabolic replication.
          *   *Draft:* "If I show you a self-replicator that doesn't use a code (like a crystal), does your theory break?"
          *   *Follow-up:* If she says "that's not *true* replication," ask if the definition is circular.

      *   *Thread 4: The Interpreter/Environment (Bonus).*
