      *   *Follow-up:* Ask about the probability space.
      *   *Scenario:* She claims crystal growth isn't "informational."
      *   *Follow-up:* Ask who decides what counts as information.

  7.  **Final Review of the "Bet":**
      *   Which question is hardest for her? Probably the falsifiability one regarding non-coded replicators (crystals/prions).
      *   Where is the analogy strongest? The Fixed Point Lemma structure.
      *   What changes my mind? If she can point to a mathematical necessity that links causal copying to semantic reference without relying on a human-designed interpreter.

  8.  **Constructing the Output:** (Drafting the response following the thought process above.)
