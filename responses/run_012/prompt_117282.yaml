      *   *Thread 3 (Falsifiability):* Focus on non-coded replication.
      *   *Thread 4 (The Interpreter):* Focus on where the intelligence resides (in the strand or the soup).

  6.  **Developing the Follow-ups:**
      *   *Scenario:* She claims the distinction between syntax and semantics is the problem.
