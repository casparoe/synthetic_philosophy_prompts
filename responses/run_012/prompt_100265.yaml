answer: |-
  (i) Examination Question

  **Question 1 (20 marks)**

  Consider the following three cases regarding rational belief and credence:

  1.  **The Lottery:** A fair lottery has 1,000 tickets and exactly one winner. For any given ticket, the evidence supports a credence of 0.999 that it will lose. Yet you are certain that at least one ticket will win.
  2.  **The Preface:** An author has checked 1,000 claims in her book against separate evidence. She holds a credence of 0.999 in each claim and believes each one. However, based on her record of past error, she also believes that at least one claim in the book is false.
  3.  **The Constructed Case:** This is a variation of the Preface. The author treats the fallibility statement ("at least one of the claims in this book is false") as one more belief alongside the 1,000 claims. She assigns a credence of 0.999 to this fallibility statement itself, holding it concurrently with her 0.999 credence in each of the 1,000 claims.

  (a) State the structural similarity shared by the Lottery and the ordinary Preface. Identify the specific principles regarding belief and credence whose joint acceptance generates the paradox in these cases, rather than merely noting that both involve long conjunctions. (6 marks)

  (b) Diagnose the Constructed Case arithmetically, stating the presupposition required for your calculation. Explain whether this diagnosis dissolves the tension in the ordinary Preface case. If the author sought to restore consistency by lowering her credence in each claim, what would this demonstrate about the scale of risk being aggregated? (8 marks)

  (c) Reach a verdict on whether the Lottery and the Preface constitute one paradox or two, providing an explicit criterion for your verdict. Rank the available remedies by describing exactly what each gives up (e.g., closure, threshold, consistency, or blameless belief). Identify which principle should be given up last and justify why. (6 marks)

  ***

  (ii) Model Answer

  The Lottery and the Preface cases share a deep structural identity: both demonstrate a conflict between probabilistic support and logical coherence in belief sets. The paradox arises from the joint acceptance of three principles. First, the **Threshold Principle**: if credence in a proposition exceeds a high threshold (e.g., 0.999), it is rational to believe it. Second, **Conjunction Closure**: if one believes $P$ and believes $Q$, one believes $P \land Q$. Third, **Consistency**: a rational belief set must be logically consistent. In both cases, the Threshold Principle licenses belief in each individual proposition. Closure entails belief in the conjunction of all propositions. However, the evidence entails the negation of that conjunction (that at least one is false/wins). Thus, accepting all three principles forces the agent into a contradiction: believing a conjunction they also believe to be false.

  In the Constructed Case, the tension becomes arithmetically explicit. Assuming the 1,000 claims are probabilistically independent, the credence that all are true is $0.999^{1000}$. This calculates to approximately 0.37. Consequently, the credence that "at least one is false" is $1 - 0.37 = 0.63$. However, the case stipulates the author assigns 0.999 credence to this fallibility statement. This is a direct violation of the probability axioms; the agent is probabilistically incoherent. This diagnosis does not dissolve the ordinary Preface case, however. In the ordinary Preface, the belief in fallibility is based on independent inductive evidence (past error), not derived from the claims themselves. The author is not mathematically required to derive the fallibility credence from the claim credences; she holds them on separate evidential bases. The Constructed Case merely shows that one cannot consistently hold both sets of credences if one assumes independence.

  If the author sought to restore consistency in the Constructed Case by lowering her credence in each claim to match the fallibility belief, the required adjustment reveals the non-linear nature of risk aggregation. To maintain a 0.999 credence that *some* error exists while believing the conjunction is unlikely, the individual credences would need to drop significantly. This demonstrates that small risks, when aggregated via conjunction, compound rapidly into near-certainty of error. It highlights that the "safety" of individual high-probability beliefs does not scale to the set.

  Are these one paradox or two? They are **one structural paradox** manifested in two epistemic contexts. The criterion for this verdict is the **source of inconsistency**: in both cases, the inconsistency arises from aggregating high-probability inputs into a low-probability conjunction while maintaining a belief in the negation of that conjunction. The difference is merely that the Lottery's negation is a priori (rules of the game), while the Preface's negation is a posteriori (empirical track record). Because the logical friction occurs at the same point—the bridge between high credence and full belief—they are the same problem.

  Regarding remedies, we must rank them by what they sacrifice.
  1.  **Giving up Conjunction Closure:** This allows believing each claim without believing their conjunction. It preserves the Threshold Principle and Consistency but limits the deductive power of belief.
  2.  **Giving up the Threshold Principle:** This denies that high credence suffices for belief. It preserves Closure and Consistency but severs the tight link between credence and acceptance.
  3.  **Giving up Consistency:** This allows holding contradictory beliefs. It preserves Closure and Threshold but accepts irrationality in the belief set.
  4.  **Giving up Blameless Belief:** This denies the individual claims are rationally believed despite the evidence.

  The principle to be given up last is **Consistency**. A belief set that is explicitly contradictory fails to guide action or assertion coherently; it represents a total breakdown of the normative force of belief. Between Closure and the Threshold, the Threshold is the more viable candidate for revision. We should modify the Threshold Principle to be sensitive to the size of the set (contextualism), rather than abandoning Closure, which is essential for reasoning. Thus, we sacrifice the simplicity of a fixed threshold to save the consistency of the agent's doxastic state.

  ***

  (iii) Marking Scheme

  **Total Marks: 20**
  **A/B Boundary:** An **A** answer successfully executes Moves 2, 4, and 5 (Arithmetic, Verdict Criterion, Remedy Ranking). A **B** answer typically executes Moves 1 and 3 but fails the arithmetic precision or offers a vague verdict without a clear criterion.

  | Move | Marks | Part | Requirement & Characteristic Error |
  | :--- | :--- | :--- | :--- |
  | **1. Identify Principles** | 4 | (a) | Must name **Threshold**, **Closure**, and **Consistency** as the conflicting triad.<br>*Error:* Describing the problem only as "long conjunctions" without naming the normative principles linking credence to belief. |
  | **2. Arithmetic Diagnosis** | 4 | (b) | Must calculate $0.999^{1000} \approx 0.37$ (or 0.63 for error) and state the **independence** presupposition.<br>*Error:* Failing to show the calculation or omitting the independence assumption required for the math to hold. |
  | **3. Case 2 vs 3 Distinction** | 4 | (b) | Must explain that Case 3 does not dissolve Case 2 because Case 2's fallibility belief is **inductive/empirical**, not derived from the claims.<br>*Error:* Claiming the arithmetic in Case 3 proves the ordinary Preface author is mathematically incoherent. |
  | **4. Verdict & Criterion** | 4 | (c) | Must state "One" or "Two" and provide an **explicit criterion** (e.g., source of inconsistency vs. source of evidence).<br>*Error:* Offering a verdict without a criterion, or relying on author names/history rather than structural analysis. |
  | **5. Remedy Ranking** | 4 | (c) | Must describe remedies by **what is given up** (using required phrases) and identify **Consistency** (or Threshold) as last to go with justification.<br>*Error:* Using labels (e.g., "Lockean Thesis") instead of descriptions, or failing to rank them by priority. |
