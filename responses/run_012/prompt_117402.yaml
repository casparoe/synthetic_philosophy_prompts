answer: |-
  You have done something in this reflection that many professional philosophers struggle to do: you have separated the *social function* of belief from the *technical verification* of truth. Your intuition is sharper than your tentative rule.

  Your tentative rule breaks because it focuses entirely on the **speaker** ("unless I've got a specific reason not to," "think the person actually knows"). It assumes the problem is always the *source*. But your own verdicts show that the problem is often the **claim** or the **context**.

  The Penguin case proves this. You don't doubt the gas station attendant's honesty; you doubt the biology. Your rule says you should believe him unless you have a reason to doubt *him*. But you don't believe him. Therefore, the rule is insufficient.

  Here is the principle that actually governs your verdicts, stated precisely, followed by the hard truth about where you might be compromising.

  ### The Principle of Contextual Burden

  **Clause 1: The Plausibility Filter (The Penguin & The Poisoning)**
  > "I am entitled to accept testimony without verification only when the claim fits within the ordinary regularities of the world as I understand them. As the claim deviates from established regularities (biology, criminal intent, physics), the burden of proof shifts from the speaker's honesty to the claim's evidence."

  *   **Why this is needed:** This saves the Penguin case. You don't need a reason to think the man is lying; the claim itself carries a "tax" of improbability that his word alone cannot pay. It also saves the Newspaper case: a plant dumping waste is a regulatory failure (common); an owner personally poisoning a well is a specific criminal act (rare/high burden).

  **Clause 2: The Epistemic Role (The Colleague & The Museum)**
  > "When I am acting as a private citizen in low-stakes social coordination, I outsource verification to social convention. When I am acting as a professional gatekeeper in high-stakes technical matters, I retain verification and reject testimony as data."

  *   **Why this is needed:** This explains why you trust the stranger on museum hours but not the colleague on solvent safety. It isn't about the *person*; it's about *you*. In the museum case, if you are wrong, you waste 20 minutes. In the lab, if you are wrong, someone gets sick or the data is ruined. You are applying different standards based on your liability.

  **Clause 3: The Competence Marker (The Doctor & The Dementia)**
  > "I may accept technical claims from a source based on institutional markers of competence (degrees, coats, titles) unless I have positive evidence of current incapacity, but I may not accept technical claims from a known peer without methodological verification."

  *   **Why this is needed:** This handles the White Coat vs. Colleague tension. The doctor is a "black box" of expertise you are not qualified to audit, so you trust the institution that certified him. The colleague is a "white box" of expertise you *are* qualified to audit, so you demand the records. The dementia case triggers the "positive evidence of incapacity" exception.

  ---

  ### Addressing Your Unresolved Cases

  **The Chatbot**
  Your hesitation is rational, and here is why: **Accountability.**
  When a human tells you a boiling point, they are staking a sliver of their reputation on being correct. If they are wrong, they are mistaken. When a chatbot tells you, there is no one to hold accountable. It is a statistical prediction, not a claim of knowledge.
  *   **Verdict:** Keep this verdict. Your principle treats testimony as a social contract. A bot is not a party to a contract. You are right to trust the human sentence more, because the human *means* it, and the bot merely *generates* it.

  **The New Case (Testimony on Testimony)**
  *Case:* Someone tells you X. You have no evidence about them. You only believe them because *other people* told you they are reliable.
  *   **Principle's Verdict:** This is permissible under **Clause 1 (Plausibility)** for ordinary matters, but forbidden under **Clause 2 (Epistemic Role)** for technical matters.
  *   **Reasoning:** In daily life, we run on "reputation chains." If three neighbors say the plumber is good, you hire him. This is efficient. But in your line of work (hydrogeology), this is hearsay. You cannot calibrate a well based on a reputation.
  *   **The Limit:** If the claim is extraordinary (like the Penguin), a chain of testimony does not help. Ten people saying they saw a penguin doesn't make it biologically plausible.

  ---

  ### The Hard Truth: Which Verdict Cannot Be Saved?

  You asked me to be straight about which of your verdicts can't be saved if we demand strict consistency.

  **It is the White Coat.**

  Here is the conflict:
  1.  **In the Lab:** You say, "I'd never take a colleague's number just because he handed it to me — I'd want to see his calibration records first." This is the gold standard. It says: *Authority is not enough; method is everything.*
  2.  **In the Doctor's Office:** You say, "A stranger in a white coat tells me my potassium is low and I take it on board, though I couldn't tell you what the coat has to do with it."

  If you apply your Lab Standard to your Medical Standard, you are being inconsistent. You are accepting a "symbol of authority" (the coat) without "calibration records" (how they measured the potassium, the margin of error, the lab's certification).

  **Why you do it:** You have to. You cannot be a hydrogeologist of your own blood. You lack the tools to verify the medical data, so you are forced to rely on the *institution* rather than the *method*.

  **The Repair:**
  To save this, you must admit that the White Coat verdict is not an *epistemic virtue* (a way of finding truth), but a *practical necessity* (a way of surviving). It is a compromise.
  *   If you want to be perfectly consistent with your Lab Standard, you should feel uneasy about the potassium result until you see the lab report.
  *   If you want to keep your Medical Verdict, you must admit that in some areas of life, you are not a knower, you are a customer.

  **My advice:** Keep the verdict, but drop the idea that it is "rational" in the same way the Road or the Lab cases are. It is *trust by necessity*, not *trust by verification*. It is the one place where you are allowing "what the books want" (trust the expert) to override your own instinct to "see the calibration records."

  ### Summary
  Your tentative rule failed because it looked at the *speaker*. Your actual practice looks at the **claim's probability**, your **own liability**, and the **source's accountability**.

  *   **Penguin:** Claim too improbable.
  *   **Museum:** Liability too low.
  *   **Colleague/Data:** Liability too high.
  *   **Chatbot:** Accountability missing.
  *   **White Coat:** (The weak link) Verification impossible, trust forced by necessity.

  You are more consistent than you think, provided you acknowledge that you switch between "Citizen Mode" (trust for efficiency) and "Scientist Mode" (verify for accuracy). The only leak is letting Scientist Mode slide when the White Coat appears.
