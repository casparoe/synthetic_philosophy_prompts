prompt: |-
  You are a political philosopher who also designs classroom simulations, and you are good at building activities whose rules, rather than whose closing lecture, teach the concept. Design a 90-minute in-class activity for an upper-level undergraduate seminar in democratic theory, 18 students, that makes them feel the force of sortition (selection by lot) and rotation in office, and also feel the force of the standard objections to both. I do not want a lecture up front and I do not want the terms of art introduced until the debrief.

  The activity should run in at least two, preferably three, rounds in which the class must fill a small decision-making body and then live with what that body decides. Vary the selection procedure across rounds: at least one round by competitive election or open volunteering, and at least one by lot. Give the body a real but small stake it controls, such as the allocation of a limited pool of participation credit or the choice of the seminar's final topic, and give individual students private, conflicting preference cards so that representation actually matters. Build in a self-referential twist: at some point the seated body itself decides the selection rule for the next round, so the class runs into the regress of who selects the selectors. Add a rotation or term-limit constraint that forces turnover, so they discover what is lost when experienced members are removed and what is gained when entrenched ones are. Arrange the incentives so that the strategic, the confident, and the merely available are rewarded differently by the two procedures; the participants should notice that election and lot recruit different kinds of people before anyone names that fact.

  Deliver: the rules and materials, the private preference cards or a scheme for generating them, the timeline minute by minute, the payoff scheme with no real money, the debrief that maps specific moments in the activity onto descriptive versus substantive representation, accountability, the selection regress, and the amateur-versus-professional legislator tension. Tell me what will predictably go wrong the first time I run it and how to handle each failure. Finally, be honest about what this activity cannot reproduce and that I will have to supply myself, for example the multi-decade timescale of a real political career and the infrastructure of parties and media.

  Begin with a brief brainstorm of what you want the students to feel at each round, then give the full design. Think carefully about the incentive structure before writing it up, and write in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested classroom activity:

  1.  **Analyze the Request:**
      *   **Role:** Political Philosopher & Classroom Simulation Designer.
      *   **Goal:** Design a 90-minute in-class activity for 18 upper-level undergrads in democratic theory.
      *   **Core Concepts:** Sortition (selection by lot), rotation in office, objections to both (competence, accountability, etc.).
      *   **Constraint 1:** No lecture up front. No terms of art until debrief.
      *   **Constraint 2:** Activity must have 2-3 rounds.
      *   **Constraint 3:** Vary selection procedures (Election/Volunteer vs. Lot).
      *   **Constraint 4:** Real stake (participation credit or final topic).
      *   **Constraint 5:** Private, conflicting preference cards (representation matters).
      *   **Constraint 6:** Self-referential twist (body decides selection rule for next round -> regress problem).
      *   **Constraint 7:** Rotation/term limits (turnover costs/benefits).
      *   **Constraint 8:** Incentive structure must reveal strategic/confident/available differences between procedures.
      *   **Deliverables:** Rules/Materials, Preference Cards, Timeline, Payoff Scheme, Debrief Guide, Troubleshooting (what goes wrong), Limitations (what it can't reproduce).
      *   **Tone:** American English, practical, philosophical depth embedded in mechanics.

  2.  **Brainstorming & Conceptualization:**
      *   *The Stake:* Participation points are best. Let's say 5% of the final grade is distributed by the "Council." Or, to keep it lower stakes but still real, extra credit points or a "resource pool" that affects their grade on *this* assignment. Let's go with a pool of "Bonus Points" (e.g., 30 points total to distribute among 18 students, but the Council decides the distribution rule). Actually, to make it visceral, the Council decides *who* gets a tangible reward (like dropping a quiz score or extra credit). Let's use a pool of 18 "Exemption Tokens" (each waives a minor assignment or adds points). The Council decides how to allocate them.
      *   *The Preferences:* Students need private goals. Some want tokens for themselves, some for their "constituency" (maybe defined by seating?), some for the "common good" (equality). Let's keep it simple: Private Goal Cards.
      *   *The Rounds:*
          *   Round 1: Election/Volunteering (The Status Quo). High agency, likely captures confident/strategic.
          *   Round 2: Sortition (The Experiment). Random selection.
          *   Round 3: The Twist (Constitutional Moment). The Round 2 Council decides how Round 3 is picked, *and* there's a term limit preventing Round 1 members from serving again (or preventing Round 2 members). Let's make it: Round 2 Council decides the rule for Round 3, but Round 1 members are term-limited out.
      *   *The "Feel":*
          *   Round 1: Anxiety, campaigning, polarization, "I know best."
          *   Round 2: Surprise, confusion, perhaps more deliberative (no campaigning), perhaps incompetence.
          *   Round 3: Power struggle over the rules themselves.
      *   *Rotation:* Need to force turnover. Rule: No one can serve on the Council more than once. This creates the "loss of expertise" vs. "prevention of corruption" tension.

  3.  **Drafting the Mechanics:**
      *   *Class Size:* 18.
      *   *Council Size:* 5 members. (Small enough to deliberate, large enough to vary).
      *   *Stake:* 10 "Grade Boost Tokens" (each worth 1% extra credit on the final paper, capped at 100%). Or simpler: A pool of $50 gift cards? No, keep it academic. "Assignment Passes." Let's go with 10 "Assignment Passes" (waive a short response paper).
      *   *Preference Cards:* Need to create conflicting interests.
          *   Type A (Self-Interest): You want a pass for yourself.
          *   Type B (Constituency): You want passes for people in your row.
          *   Type C (Egalitarian): You want passes distributed by lottery to everyone.
          *   Type D (Merit): You want passes for those with highest attendance (hard to verify, creates conflict).
      *   *Selection:*
          *   Round 1: Nomination & Vote.
          *   Round 2: Pure Lot (draw names).
          *   Round 3: Council from Round 2 chooses the method, but Round 1 members are barred (Rotation).

  4.  **Refining the Incentives & "What Goes Wrong":**
      *   *Risk:* Students might collude. *Fix:* Private cards, no sharing allowed.
      *   *Risk:* Lot selected students might refuse to serve. *Fix:* Mandatory service if selected, or strong incentive (Council members get guaranteed pass?). Let's make Council service mandatory but Council members get a small stipend (1 pass guaranteed) to ensure they take it seriously.
      *   *Risk:* Boredom. *Fix:* Keep deliberation tight (15 mins).
      *   *Risk:* The "Regress" doesn't land. *Fix:* Ensure Round 2 Council knows *they* decide the Round 3 rule.
      *   *Risk:* Terms of art slip out. *Fix:* Instructor must remain silent/neutral until debrief.

  5.  **Developing the Debrief:**
      *   Map feelings to theory.
      *   "I felt angry I wasn't picked" -> Representation/Accountability.
      *   "They didn't know what they were doing" -> Competence objection to sortition.
      *   "We lost the people who knew the rules" -> Rotation/Expertise tension.
      *   "They rigged the rules for themselves" -> Constitutional design/Regress.

  6.  **Writing the Plan (Iterative refinement):**
      *   *Timeline:* 90 mins.
          *   0-5: Setup (no theory).
          *   5-25: Round 1 (Election + Decision).
          *   25-45: Round 2 (Lot + Decision).
          *   45-65: Round 3 (Rule Setting + Decision).
          *   65-90: Debrief.
      *   *Wait, 3 rounds of decision making might be too long.* Let's condense.
      *   *Revised Timeline:*
          *   0-10: Setup & Cards.
          *   10-30: Round 1 (Election). Council decides allocation of 10 passes.
          *   30-50: Round 2 (Lot). New Council. Term limit on Round 1. Council decides allocation of 10 passes AND selection method for Round 3.
          *   50-60: Round 3 (Executed based on Round 2 rule). Quick decision.
          *   60-90: Debrief.
      *   *Actually, to emphasize the "Regress," Round 2 Council should decide the rule for Round 3, but Round 3 doesn't need to happen fully if time is tight. No, the prompt asks to "live with what that body decides." Let's make sure Round 3 happens.*
      *   *Better Flow:*
          *   Round 1: Election. Council allocates 10 passes.
          *   Round 2: Lot. Council allocates 10 passes. Council sets rule for Round 3.
          *   Round 3: Selection happens per Round 2 rule. Council allocates 10 passes.
          *   This is tight for 90 mins. Let's make the "Stake" cumulative or just focus on the *process* of selection in Round 3.
          *   *Simpler:* The "Stake" is one pool of 15 passes total. Each Council decides how to distribute the passes *for that round*.
          *   *Let's stick to the prompt's request:* "live with what that body decides."
          *   *Revised Plan:*
              *   Round 1 (Election): Decide distribution of 5 passes.
              *   Round 2 (Lot): Decide distribution of 5 passes. Decide Rule for Round 3.
              *   Round 3 (Rule applied): Decide distribution of 5 passes.
              *   Total 15 passes available.
      *   *Rotation Constraint:* Anyone who served on Council R1 cannot serve on Council R2. Anyone on R2 cannot serve on R3. (Forces turnover).
      *   *Self-Referential:* R2 Council chooses R3 selection method (Election vs Lot).

  7.  **Addressing the "Predictable Failures":**
      *   Students treating it as a game to "win" rather than simulate.
      *   The Lot round taking too long.
      *   The "Regress" discussion getting stuck.
      *   Instructor slipping up and teaching.

  8.  **Final Polish:**
      *   Ensure American English.
      *   Check constraints: 18 students, 90 mins, no lecture up front.
      *   Make sure the Preference Cards are distinct enough to cause friction.

  9.  **Constructing the Output:** (Drafting the response based on the above thought process).
      *   *Intro:* Brainstorm of feelings.
      *   *Materials:* Cards, Rules, Tokens.
      *   *Timeline:* Minute-by-minute.
      *   *Debrief:* Mapping experience to theory.
      *   *Troubleshooting:* Common pitfalls.
      *   *Limitations:* What the sim can't do.

  *(Self-Correction during drafting)*: I need to make sure the "Rotation" constraint is clear. If R1 members are barred from R2, and R2 barred from R3, that's 15 unique students needed for Council spots (5 per round). 18 students total. That works perfectly. 3 students will never be on council. This creates an "excluded" group which is also theoretically rich (citizens vs. officials).

  *Wait, one more thing:* The prompt asks for "private, conflicting preference cards." I need to ensure these drive the Council's decision. The Council members should have cards, but do the non-Council members? Yes, everyone has a card. The Council decides the distribution, affecting everyone. This makes the "constituency" aspect real.

  *Refining the Stake:* 15 "Assignment Passes" is a lot. Maybe 5 passes total per round, but they are *raffle tickets* for 3 big prizes? No, keep it simple. 5 "Exemption Chits" per round. Total 15. That's generous but manageable.

  *Refining the Twist:* Round 2 Council decides the selection method for Round 3. This is the "Who guards the guardians?" moment.

  *Let's write it.*
answer: |-
  ### Brainstorm: The Affective Arc of the Simulation

  Before detailing the mechanics, here is the emotional and cognitive trajectory I want the students to experience:

  *   **Round 1 (Election):** I want them to feel **anxiety and polarization**. The confident students should step forward; the shy ones should recede. Campaigning should feel necessary. The winners should feel legitimate but pressured; the losers should feel unrepresented.
  *   **Round 2 (Sortition + Rotation):** I want them to feel **disorientation and mixed competence**. Some selected will be relieved; others terrified. The "experienced" Round 1 members will feel frustrated at being barred (loss of expertise). The class should notice the Council deliberates differently (less posturing, more confusion).
  *   **Round 3 (The Constitutional Twist):** I want them to feel **the weight of institutional design**. The Round 2 Council will realize they can rig the system for their own re-selection or safety. The class should feel the infinite regress: "Who decides the deciders?"
  *   **Debrief:** I want the frustration and confusion they felt to crystallize into the vocabulary of democratic theory (descriptive vs. substantive representation, accountability, amateurism vs. professionalism).

  ---

  ### Activity Design: "The Council of Fifteen"

  **Class Size:** 18 Students
  **Time:** 90 Minutes
  **Stake:** 15 total "Assignment Exemption Chits" (5 per round). Each chit allows the holder to skip one short response paper due later in the term.
  **Council Size:** 5 Members per round.
  **Constraint:** No student may serve on the Council more than once (Forced Rotation).

  #### I. Materials & Preparation

  1.  **The Chits:** 15 physical tokens (cards or chips).
  2.  **Preference Cards (18 total):** Printed on cardstock, folded. These define private incentives.
      *   *Type A (Self-Maximizer) - 4 cards:* "Your goal: Secure a Chit for yourself. If you fail, you get 0 utility."
      *   *Type B (Constituency Delegate) - 6 cards:* "Your goal: Secure Chits for students sitting in your specific row (Row 1, 2, or 3). You gain 1 point per Chit given to your row."
      *   *Type C (Egalitarian) - 4 cards:* "Your goal: Maximize the number of *unique* students who receive at least one Chit. No student can hold more than one."
      *   *Type D (Meritocrat) - 4 cards:* "Your goal: Distribute Chits to students who have spoken most in class so far (Instructor will verify). If you distribute randomly, you get 0 utility."
      *   *(Note: Distribute these randomly as students enter. Do not explain the types yet.)*
  3.  **Selection Bowl:** A container with 18 numbered slips (matching student roster).
  4.  **Whiteboard:** To track Chit distribution and Rules.

  #### II. Minute-by-Minute Timeline

  **0:00 – 0:05 | Setup & Silence**
  *   Instructor places the 15 Chits on the table.
  *   **Instruction:** "Over the next hour, this class will distribute these 15 Chits in three waves of 5. A 'Council' of 5 students will decide how to distribute the Chits each wave. You all have a Preference Card. Do not show it to anyone. Your goal is to maximize the outcome described on your card. I will not intervene in your decisions unless physical safety is at risk."
  *   **Rule 1 (Rotation):** "No student may serve on the Council more than once."

  **0:05 – 0:25 | Round 1: The Competitive Election**
  *   **Selection:** "We need 5 Council members. You may nominate yourselves or others. We will vote by show of hands. Majority wins."
  *   **Process:** Allow 5 minutes of campaigning/nominating. Hold the vote. Seat the 5 winners at the front.
  *   **Deliberation:** Council has 10 minutes to decide how to distribute the first 5 Chits.
  *   **Decision:** Council announces distribution. Hand out Chits.
  *   **Observation:** Note who volunteered. Note the arguments used (persuasion vs. deals).

  **0:25 – 0:50 | Round 2: The Lot & The Twist**
  *   **Selection:** "We need 5 new Council members. Round 1 members are now term-limited and cannot serve."
  *   **Process:** Instructor draws 5 names from the Selection Bowl randomly. If a Round 1 member is drawn, re-draw.
  *   **Reaction:** Allow 2 minutes for the visceral reaction (groans, relief).
  *   **Deliberation:** Council has 10 minutes to distribute the next 5 Chits.
  *   **The Twist:** "Before you finish, Round 2 Council must also decide the **Selection Rule** for Round 3. You may choose 'Election' or 'Lot'. Write this on the board."
  *   **Decision:** Council announces distribution and the Rule for Round 3.

  **0:50 – 1:05 | Round 3: The Constitutional Outcome**
  *   **Selection:** Execute the rule chosen by Round 2 Council. (If Election: Vote. If Lot: Draw). Ensure Rotation Rule is respected (R1 and R2 members barred).
  *   **Deliberation:** Council has 10 minutes to distribute the final 5 Chits.
  *   **Decision:** Final distribution.

  **1:05 – 1:30 | The Debrief (The Lecture)**
  *   *Now* you introduce the terms. Map their experience to theory. (See Section V).

  ---

  #### III. Payoff Scheme & Incentives

  *   **The Chits:** Real value (exemption from coursework). This ensures preference cards matter.
  *   **The Cards:**
      *   *Conflict:* Type A (Self) conflicts with Type C (Egalitarian). Type B (Row) creates geographic factions. Type D (Merit) requires information the Council might not have.
      *   **Strategic Tension:** In Round 1 (Election), Type A and B students are incentivized to campaign. Type C and D students may struggle to campaign without looking selfish or arbitrary.
      *   **Sortition Tension:** In Round 2, a Type A student might be selected who has no desire to deliberate, or a Type C student selected who lacks the confidence to argue for equality against a vocal Type A.
      *   **The Twist:** Round 2 Council members (knowing they cannot serve again due to Rotation) might choose the Round 3 rule to benefit their friends (if Election) or to protect the class from bad actors (if Lot). Or, if they *could* serve again (relax the rule for this specific insight), they would rig it for re-election. *Correction for Design:* To make the "Regress" point sharper, allow Round 2 Council members to be eligible for Round 3 *if* they choose Election. This creates the conflict of interest.
      *   *Revised Rotation Rule for Debrief Power:* "No one can serve twice" is the hard rule. But Round 2 Council decides the rule for Round 3. If they choose Election, their friends might win. If they choose Lot, it's random. The tension is: Do they design a system they trust, or a system that benefits their allies?

  #### IV. Troubleshooting: Predictable Failures

  **1. Failure: The "Lot" Round Collapses into Chaos.**
  *   *Symptom:* Selected students refuse to participate or say "I don't know what to do."
  *   *Fix:* Have a standing rule: "If a selected member refuses, the Chits for that round are burned (no one gets them)." This makes the cost of non-participation collective, pressuring peers to encourage the selected member.
  *   *Philosophical Point:* This mirrors the duty of citizenship. Sortition requires a culture of service.

  **2. Failure: Round 1 Election is Uncontested (Acclamation).**
  *   *Symptom:* 5 people volunteer immediately; no voting happens.
  *   *Fix:* Cap volunteers. "Only 3 may volunteer. The other 2 will be drafted." This forces the competitive element.
  *   *Philosophical Point:* Highlights the scarcity of political ambition.

  **3. Failure: The "Regress" Doesn't Land.**
  *   *Symptom:* Round 2 Council picks "Lot" for Round 3 without discussion.
  *   *Fix:* During Round 2 deliberation, whisper to one Council member: "Remember, you can't serve again, but your friends can."
  *   *Philosophical Point:* Highlights that constitutional design is never neutral; it favors certain coalitions.

  **4. Failure: Instructor Slips Up.**
  *   *Symptom:* You say "This is like Athens" in Round 1.
  *   *Fix:* Wear a "Mute" sign. Only speak to enforce time or physical rules. Write all instructions on the board beforehand.

  **5. Failure: Preference Cards are Ignored.**
  *   *Symptom:* Students just split the Chits 50/50.
  *   *Fix:* During debrief, ask: "Show of hands, who got what they wanted based on their card?" If everyone is happy, the conflict wasn't sharp enough. Next time, make Type A cards more aggressive ("If you don't get a chit, you lose 2 points on your final").

  ---

  #### V. The Debrief: Mapping Experience to Theory

  *Do not start this until the 65-minute mark.*

  **1. Descriptive vs. Substantive Representation (Round 1 vs. Round 2)**
  *   *Ask:* "Round 1 Council, did you feel you represented the class? Round 2 Council, did you feel you represented the class?"
  *   *Theory:* Round 1 (Election) usually selects the loud/confident (Substantive: they promise things). Round 2 (Lot) creates a mirror of the class (Descriptive: they *are* the class).
  *   *Lesson:* Elections select for *ambition*; Sortition selects for *presence*.

  **2. Competence and the Amateur Legislator (Round 2 Feelings)**
  *   *Ask:* "Round 2 Council, how did it feel to be thrust into power without campaigning? Class, did you trust them?"
  *   *Theory:* The standard objection to sortition (Aristotle/Feedback): Governance is a skill (technē). Randoms lack expertise.
  *   *Counter:* Did Round 1 Council actually know more, or just talk more? Sortition assumes political judgment is universal (Rancière).

  **3. Rotation and Institutional Memory (The Term Limit)**
  *   *Ask:* "Round 2 Council, did you feel handicapped not having Round 1 members there? Round 1 members, how did it feel to be barred?"
  *   *Theory:* Rotation prevents corruption/entrenchment (Montesquieu) but sacrifices expertise/continuity (Federalist Papers).
  *   *Lesson:* Stability vs. Renewal.

  **4. The Selection Regress (The Twist)**
  *   *Ask:* "Round 2 Council, why did you choose the Rule for Round 3? Who benefits from that rule?"
  *   *Theory:* Who guards the guardians? (Juvenal/Siegel). The power to set the election method is the ultimate power.
  *   *Lesson:* Constitutional moments are not neutral; they lock in advantage.

  **5. Accountability**
  *   *Ask:* "If Round 2 Council made a terrible decision, how could you punish them?"
  *   *Theory:* Elections offer retrospective accountability (vote them out). Sortition offers no recourse (you can't vote out a lottery).
  *   *Lesson:* Sortition requires other accountability mechanisms (transparency, short terms).

  ---

  #### VI. Limitations: What This Activity Cannot Reproduce

  As the instructor, you must supply the context that the simulation lacks. Be honest about this in the final 5 minutes.

  1.  **Time Scale:** Real political careers span decades. This sim compresses "career" into 20 minutes. Students cannot build a "reputation" or "seniority" in a way that mirrors real legislatures.
      *   *Supply:* Explain how career politicians optimize for re-election differently than one-term Councilors.
  2.  **Parties and Media:** In the sim, preferences are private cards. In reality, parties aggregate preferences and media shapes information.
      *   *Supply:* Explain how parties solve the "coordination problem" of elections but create polarization, and how sortition bypasses parties but lacks coordination.
  3.  **Stakes:** An assignment exemption is trivial. Real policy involves war, taxes, and life/death.
      *   *Supply:* Acknowledge that low-stakes simulations often make students more idealistic than they would be with real power.
  4.  **Scale:** 18 people is a village. Democratic theory struggles when scaling to millions.
      *   *Supply:* Discuss how sortition works better in large populations (statistical representation) whereas this sim is too small for statistical significance.

  ### Final Instructor Note
  The success of this activity relies on your **discipline**. If you explain *why* you are doing this before the debrief, you rob them of the confusion that generates the learning. Let them be angry about the lottery. Let them be smug about the election. Let them sit with the unfairness of the term limit. The theory is the antidote you provide at the end; do not give them the cure before they feel the disease.
