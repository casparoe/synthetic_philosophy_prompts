      Blame involves three distinct normative dimensions that must be kept separate. Warrant concerns the target's wrongdoing; sincerity concerns the blamer's belief; standing concerns the blamer's authority to demand compliance. In all three variants, J's plagiarism is objectively wrong, so blame is warranted. The act itself does not change based on M's history. Assuming M believes J erred, blame is sincere. M's internal state remains constant across variants. The critical divergence lies entirely in standing, which depends on the relational history between M, J, and the norm.

      In Variant A, M lacks standing. Current identical wrongdoing constitutes hypocrisy that undermines the authority to demand norms M actively violates. It is not that J is innocent, but that M cannot claim the moral high ground while occupying the same low ground. The blame functions as a weapon rather than a demand. In Variant B, M retains standing. Past wrongdoing, once repented, does not permanently forfeit standing. Repentance changes the normative relationship to the norm; the reformed wrongdoer now affirms the rule they once broke, restoring their authority to enforce it. To deny standing here would punish rehabilitation and suggest moral status is immutable. In Variant C, M retains standing. Benefiting from another's wrongdoing without participating does not constitute the relevant hypocrisy that forfeits standing. While M's silence may be complicit, it is not the direct violation required to undermine standing on this specific charge. Complicity is distinct from violation.

      These verdicts rely on an account of standing grounded in commitment to the specific norm invoked, rather than general moral purity. Standing is the right to hold others to a standard one accepts for oneself. Hypocrisy matters because it signals a rejection of the norm's authority over oneself while asserting it over others, violating the equality of moral agents. However, this forfeiture requires a relevant similarity in violation. If standing required general sinlessness, the self-undermining worry would hold: almost no one could blame, rendering moral accountability impossible. We are all flawed. If standing were too thin, hypocrisy would never matter, rendering moral authority meaningless and allowing tyrants to judge the virtuous.

      The solution is a middle path: standing requires non-hypocrisy regarding the specific norm, not all norms. Variant A forfeits standing because M rejects the norm currently. Variant B does not, because M now affirms the norm. Variant C does not, because M did not violate the norm. This avoids disqualifying all blame since most agents haven't violated the specific norm currently, while preserving the bite against hypocrisy because current violation matters. We pay for this horn by accepting that warranted blame can be inappropriate due to relational defects. This means distinguishing between the truth of the accusation and the right to voice it. A blamer without standing speaks truthfully but wrongly. This preserves the objectivity of moral facts while acknowledging the relational nature of accountability.

      The cost is accepting that some wrongdoers escape direct reproach from specific peers, but this is preferable to collapsing standing into warrant. If standing collapsed into warrant, hypocrisy would be irrelevant, and moral community would lose its reciprocal structure. Therefore, standing must remain distinct, forfeited only by relevant current inconsistency, protecting the practice of blame from both nihilism and moralism. This choice prioritizes the integrity of the moral community over the efficiency of accusation. It admits that sometimes justice is delayed because the accuser is unfit, but maintains that unfit accusers damage the norm more than silence does. Thus, standing acts as a gatekeeper, ensuring that blame functions as a reciprocal demand rather than a weapon wielded by the guilty against the guilty.
