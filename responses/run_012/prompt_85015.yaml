  (1) The question

  Senior colleague M reprimands junior colleague J for passing off another's analysis as his own. Consider three variants: (A) M is currently doing the same thing; (B) M did it once ten years ago, was caught, apologised, and now campaigns against it; (C) M never did it, but M's position rests on a mentor who did, which M knows and ignores.
  For each variant, determine whether M's blame is (i) warranted, (ii) sincerely meant, and (iii) whether M has the standing to direct it. Defend a general account of standing that explains why it can come apart from warrant in these cases. Finally, resolve the self-undermining worry: if standing is lost through the blamer's own fault, almost all blame is disqualified; if standing is explained by something thinner, it is unclear why hypocrisy matters. Choose a horn and pay for it.

  (2) Model answer

  Blame involves three distinct normative dimensions that must be kept separate to avoid conceptual confusion. Warrant concerns the target's wrongdoing; sincerity concerns the blamer's belief; standing concerns the blamer's authority to demand compliance. In all three variants, J's plagiarism is objectively wrong, so blame is warranted. The act itself does not change based on M's history. Assuming M believes J erred, blame is sincere. M's internal state remains constant across variants. The critical divergence lies entirely in standing, which depends on the relational history between M, J, and the norm.

  In Variant A, M lacks standing. Current identical wrongdoing constitutes hypocrisy that undermines the authority to demand norms M actively violates. It is not that J is innocent, but that M cannot claim the moral high ground while occupying the same low ground. The blame functions as a weapon rather than a demand. In Variant B, M retains standing. Past wrongdoing, once repented, does not permanently forfeit standing. Repentance changes the normative relationship to the norm; the reformed wrongdoer now affirms the rule they once broke, restoring their authority to enforce it. To deny standing here would punish rehabilitation and suggest moral status is immutable. In Variant C, M retains standing. Benefiting from another's wrongdoing without participating does not constitute the relevant hypocrisy that forfeits standing. While M's silence may be complicit, it is not the direct violation required to undermine standing on this specific charge. Complicity is distinct from violation.

  These verdicts rely on an account of standing grounded in commitment to the specific norm invoked, rather than general moral purity. Standing is the right to hold others to a standard one accepts for oneself. Hypocrisy matters because it signals a rejection of the norm's authority over oneself while asserting it over others, violating the equality of moral agents. However, this forfeiture requires a relevant similarity in violation. If standing required general sinlessness, the self-undermining worry would hold: almost no one could blame, rendering moral accountability impossible. We are all flawed. If standing were too thin, hypocrisy would never matter, rendering moral authority meaningless and allowing tyrants to judge the virtuous.

  The self-undermining worry presents a stark dilemma. The first horn demands moral cleanliness for standing. The consequence is moral silence; since all agents have some fault, no one can blame anyone. Accountability collapses. The second horn demands only factual accuracy for standing. The consequence is moral tyranny; hypocrites can blame the virtuous, stripping blame of its reciprocal force. Hypocrisy becomes irrelevant. To choose a horn is to choose between silence and tyranny.

  I choose a modified second horn: standing requires consistency on the specific norm, not general cleanliness. This avoids silence because most people follow most norms most of the time. It avoids tyranny because current violators cannot blame. However, I must pay for this choice. The cost is that in Variant A, J's wrong goes unchallenged by M. If M is the only witness, J escapes sanction. We must accept this injustice to preserve the integrity of the blaming practice. Allowing M to blame would normalize hypocrisy, suggesting norms apply only to others. Silencing M protects the norm's authority even if it lets J slip. This distinguishes the truth of the matter from the right to speak it. Warrant remains objective; standing remains relational. By paying this price, we ensure blame remains a tool of community maintenance rather than individual aggression. The system tolerates specific failures to prevent systemic collapse.

  (3) Marking scheme

  1.  **Distinction of Axes (4 marks):** Clearly distinguishes warrant (target's act), sincerity (blamer's belief), and standing (authority to demand).
      *   *Pitfall:* Conflating warrant with standing or treating sincerity as irrelevant.
  2.  **Variant Verdicts (4 marks):** Correctly identifies A (no standing), B (standing), and C (standing) while keeping warrant/sincerity constant.
      *   *Pitfall:* Arguing J is less wrong in Variant A or that M lacks standing in Variant B.
  3.  **Account of Standing (4 marks):** Defends standing as normative authority/commitment rather than moral purity or factual accuracy.
      *   *Pitfall:* Defining standing simply as "knowing the truth" or "being a good person."
  4.  **Engagement with Worry (4 marks):** Explicitly articulates the dilemma between moral silence (purity) and moral tyranny (thinness).
      *   *Pitfall:* Mentioning the worry without explaining the consequences of each horn.
  5.  **Resolution and Cost (4 marks):** Chooses a position and explicitly identifies the cost (e.g., some wrongs go unchallenged by specific peers).
      *   *Pitfall:* Solving the puzzle without acknowledging the negative consequence ("paying for it").

  (4) A versus B

  A solid B answer correctly distinguishes the three axes and resolves the variants consistently. An A answer goes further by rigorously defending the "cost" of their chosen horn. While B candidates often argue that their solution avoids all negative consequences, A candidates acknowledge that preserving standing requires tolerating some unchallenged wrongdoing to protect the practice of blame itself. The A answer demonstrates that the philosophical price is understood, not just the solution.
