prompt: |-
  ok so I've spent way too long reading rationalist blogs and Dennett's real patterns / three stances thing is basically the only philosophy I actually use at work, except I use it totally hand-wavy and I want it turned into an actual procedure. I do modeling and analytics at a mid-size company and roughly once a month someone walks in with a claimed pattern -- "the market regime shifted", "this user segment wants X", "the team is in a slump", "the model prefers these features" -- and I have to decide whether it's a real pattern or just noise we've drawn a circle around, then defend the call in a design doc my director signs off on. I've got about an hour per call and I'm not going to reread the paper.

  Please give me a decision procedure grounded in the real-patterns idea and the physical/design/intentional stances, that I can actually run in that hour: the steps in order, what counts as passing each one, where it stops with "not real, drop it", and where it hands the decision to a human because the question is about what we care about rather than what's out there. It has to handle the nasty cases: the intentional stance giving a great predictive story about something that doesn't exist (a "market regime" that's really just an artifact of how we bucketed the dates), and a pattern that's real only relative to our interests when someone definately demands an interest-free answer. Also tell me where the procedure misfires and when I should just not bother.

  Format: numbered list, exactly five items, each one or two sentences, no intro or conclusion.
