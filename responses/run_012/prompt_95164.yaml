answer: |-
  ### Session Plan: The Arithmetic of Ignorance
  **Duration:** 75 Minutes
  **Audience:** Economists & Biologists (Comfortable with EV, models, and complex systems; unfamiliar with moral philosophy).
  **Core Concept:** Credence-Stuffing (assigning coarse probabilities to opaque long-term outcomes to preserve Expected Value arithmetic).

  ---

  ### 1. The Sequence & Dependencies (0–75 mins)

  **00–10: The Move, Not The Theory**
  *   **Action:** Define "Credence-Stuffing" immediately. Do not define consequentialism or cluelessness yet.
  *   **Definition:** "Credence-stuffing is the cognitive act of assigning a specific probability distribution to an outcome where the causal structure is opaque, solely to allow an Expected Value (EV) calculation to proceed."
  *   **Dependency:** You must establish this as a *habit* they recognize, not a philosophical thesis. Ask: "Who here has ever assigned a 'rough estimate' to a variable in a model where data was missing, just to keep the simulation running?"
  *   **Goal:** Normalize the move before critiquing it.

  **10–30: The Case Application (The Stuffing Phase)**
  *   **Action:** Introduce the Everyday Case (see Section 2). Ask the room to perform an EV comparison between Option A and Option B.
  *   **Requirement:** They *must* produce a number. Ask for a show of hands: "Who assigns >50% probability that Option A yields better world-states in 50 years than Option B?"
  *   **Dependency:** This section *must* precede the critique. They need to feel the urge to stuff the credence before you point out the emptiness of the stuffing.
  *   **Goal:** Elicit the natural instinct to quantify the unquantifiable.

  **30–50: The Structural Gap (The Cluelessness Phase)**
  *   **Action:** Interrogate the numbers they just produced. Ask *how* they derived them.
  *   **Dependency:** Relies on the specific numbers generated in the previous block.
  *   **Goal:** Distinguish between *Risk* (known unknowns) and *Cluelessness* (unknown unknowns/structural opacity).
  *   **Misconception Intercept:** This is where you head off 'ordinary uncertainty' and 'butterfly effect' (see Section 3).

  **50–65: Holding the Tension**
  *   **Action:** Acknowledge why we stuff credences. Without it, decision-making paralyzes. With it, we risk fiction.
  *   **Dependency:** Relies on the failure of the EV calculation in the previous block.
  *   **Goal:** Prevent nihilism ('anything goes') and defensiveness ('demandingness').
  *   **Misconception Intercept:** Head off 'anything goes' and 'demandingness' here.

  **65–75: The Closing Test**
  *   **Action:** Pose the Single Closing Question (see Section 4).
  *   **Dependency:** Relies on the distinction drawn in the "Structural Gap" section.
  *   **Goal:** Verify they grasp the epistemic limit, not just the moral anxiety.

  ---

  ### 2. The Everyday Case: "The Graduate Student Email"

  **The Scenario:**
  You are a senior researcher. A PhD student sends you a draft chapter on Tuesday.
  *   **Option A:** You reply within 24 hours with detailed critiques.
  *   **Option B:** You reply in 7 days with identical critiques.

  **What It Must Have:**
  1.  **Professional Resonance:** It must feel like *their* work (intellectual labor, mentorship), not abstract moralizing.
  2.  **A Plausible Chain:** There must be a clear short-term good (student improves faster in A) that plausibly links to long-term states (student enters job market earlier, publishes more, influences policy/science).
  3.  **A Break Point:** The causal chain must become opaque after 3–4 links (e.g., "Student publishes earlier" → "Paper gets cited" → "Policy changes" → ???).
  4.  **Symmetry of Ignorance:** It must be equally plausible that Option B is better (e.g., the delay forces the student to solve a problem independently, leading to a deeper breakthrough, or Option A burns them out).

  **What It Must Not Have:**
  1.  **No Life/Death Stakes:** Avoids the "Trolley" emotional override. No one dies if you wait a week.
  2.  **No Monetary Donation:** Avoids the "Which Charity" framing. This is about *action*, not *allocation of surplus*.
  3.  **No Obvious Right Answer:** If Option A is obviously better professionally, they won't feel the cluelessness. The long-term value must be genuinely contested.

  ---

  ### 3. Misconceptions & Interception Points

  **1. "This is just ordinary uncertainty."**
  *   **The Error:** Treating structural ignorance as parameter uncertainty (e.g., "We just need more data to get the p-value").
  *   **Interception Point:** **Minute 35** (During "The Structural Gap").
  *   **The Move:** When an economist says, "It's just a wide confidence interval," stop them. Say: "A confidence interval implies a known distribution. Cluelessness claims we don't know the *sign* of the correlation, let alone the variance. You are stuffing a number where the variable might not exist."

  **2. "This is the butterfly effect."**
  *   **The Error:** Reducing cluelessness to chaos theory (sensitivity to initial conditions).
  *   **Interception Point:** **Minute 40** (During "The Structural Gap").
  *   **The Move:** When a biologist says, "Small changes amplify," correct them: "Chaos implies determinism we can't track. Cluelessness implies we don't know the *value* of the outcome. If the student publishes earlier, does that speed up a cure or accelerate a dual-use risk? Chaos tracks the path; cluelessness questions the destination's worth."

  **3. "So anything goes."**
  *   **The Error:** Inferring that if EV is broken, all actions are morally equivalent (nihilism).
  *   **Interception Point:** **Minute 55** (During "Holding the Tension").
  *   **The Move:** If they suggest "Then why not flip a coin?", intervene: "Cluelessness attacks the *long-term* arithmetic, not the *near-term* facts. You still know the student prefers feedback sooner. The tension is that the near-term good might be cancelled by long-term harm we can't see. It doesn't mean nothing matters; it means our ledger is incomplete."

  **4. "This is the demandingness objection in new clothes."**
  *   **The Error:** Thinking this is about morality being too hard to satisfy ("I can't calculate everything, so I'm excused").
  *   **Interception Point:** **Minute 60** (During "Holding the Tension").
  *   **The Move:** If they say, "This just makes morality impossible," correct them: "Demandingness says you must do too much. Cluelessness says you might be doing the *wrong* thing even with good intentions. This isn't about the cost to you; it's about the opacity of the world."

  ---

  ### 4. The Single Closing Question

  **Do not ask:** "Is credence-stuffing wrong?" (Seeks a verdict).
  **Do not ask:** "How did this feel?" (Seeks a mood).

  **Ask this:**
  > "In the email case, is the probability that Option A is better than Option B **undefined**, or is it a **fixed number that is too costly for you to compute**?"

  **Why this works:**
  *   If they say "Too costly," they haven't grasped cluelessness; they think it's a computational problem (ordinary uncertainty).
  *   If they say "Undefined," they grasp the epistemic break (cluelessness).
  *   If they hesitate, they are holding the tension (the ideal outcome).

  ---

  ### 5. What To Openly Decline To Settle

  You must explicitly state at **Minute 65** that you will not resolve the following:

  **"Whether we are permitted to stuff credences when we know they are invented."**

  *   **Why:** Resolving this requires a normative stance on decision theory under radical uncertainty (e.g., Immodesty vs. Modesty principles) which is beyond the scope and violates your goal of leaving them with the tension.
  *   **The Instruction:** Tell them: "I am not here to tell you if you *should* stop stuffing credences. I am here to show you that you *are* stuffing them, and that the arithmetic you get out of it rests on that invention. Whether that invention is a necessary heuristic or a fatal flaw is a decision you have to make in your own models."
