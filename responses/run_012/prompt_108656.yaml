answer: |-
  Dear Colleague,

  It is a bold and precisely targeted pedagogical aim you have set for yourself, to make the abstract architecture of heterophenomenology felt in the bones of your students before it is named in their minds. The risk is that without the theoretical scaffolding, the activity may feel like a game without a point, but if you manage the constraints tightly, the frustration they feel will be the very engine of their understanding. What follows is a complete design for the ninety-minute session, written as a continuous narrative so you can see the flow of the hour as a single organism. I have structured this as a letter to you, detailing the setup, the execution, the inevitable friction points, and the philosophical payoff, adhering strictly to your request for continuous prose without structural markers.

  You will need to arrange the room to facilitate eight pairs of students, but with a slight modification to your initial sketch. Instead of static pairs, you will act as the central hub of data collection to enforce the anonymity constraint. Prepare sixteen index cards per pair, two pens, and eight large envelopes. You will also need a stopwatch and a pre-prepared set of instructions for a confederate, which will be you or a teaching assistant. The session divides into four unequal segments: an initial briefing and pairing, the primary data collection phase, the confederate intervention, and the final debrief. Begin by telling the students nothing about Dennett or heterophenomenology. Tell them only that they are engaged in a exercise of scientific modeling where the goal is prediction, not truth. Divide the sixteen students into eight pairs. In each pair, designate one as the Experimenter and one as the Subject. Explain that the Subject will undergo a series of stimuli, which you will provide centrally to keep conditions uniform, such as a specific sound, a visual pattern, or a short text read aloud. The Subject's task is to report on their experience of the stimulus. The Experimenter's task is to construct a model of the Subject's mind based solely on those reports to predict future reports.

  Here is where you impose the first critical constraint, the budget. Give each Subject a stack of five index cards. Tell them they have a total vocabulary budget of fifty words for the entire session to describe all five experiences. They may distribute these words however they like across the five cards, but once a card is written and sealed, it cannot be changed. This forces the Subject to compress their phenomenology into a sparse text, and it forces the Experimenter to infer meaning rather than receive transparent data. The second constraint is the sealing protocol. After each stimulus, the Subject writes their report, seals the card in an envelope, and hands it to you. You collect all envelopes from all pairs before distributing them to the Experimenters. This ensures that no Experimenter can appeal to the Subject's facial expressions or tone of voice during the report; the data is strictly textual and anonymized in the moment of analysis. The Experimenter receives the sealed envelope from their partner only after they have written down their prediction for what is inside. They open it, compare the prediction to the text, and then use that text to update their model for the next round. Scoring is simple and ruthless. The Experimenter gets one point if their prediction matches the semantic content of the card within a reasonable margin of error, and zero if it does not. There are no points for truth. There are no points for accuracy of experience. There are only points for predictive success.

  Run this cycle for three rounds, consuming about thirty minutes. You will see the Experimenters struggling to build a theory of the Subject's inner world based on fragments like bright red or loud pain while the Subjects agonize over word counts. Then, introduce the disruption. Announce that for the final two rounds, one pair will be replaced by a control condition to test the robustness of the method. Select one pair to step aside. You, the instructor, will take the place of the Subject for this pair, but you will not tell the Experimenter this. You are now the Confederate Subject. Your instructions are to ignore any actual experience you might have of the stimuli. Instead, generate your reports based on a simple syntactic rule unknown to the Experimenter. For example, if the previous card had an even number of words, the next card must contain the word blue. If the stimulus was auditory, the report must be exactly ten words. You are generating data that is perfectly consistent and predictable, but it is decoupled from any phenomenological reality. The Experimenter in this pair will likely find their model fitting the data beautifully, achieving high predictive scores, because you are following a rule. The other pairs, working with real humans struggling with word budgets, will likely have messier data.

  After the fifth round, collect all materials and move to the scoring and debrief, which should take the remaining forty minutes. Reveal the confederate twist. Ask the Experimenter who worked with you whether they felt their model was successful. They will likely say yes, because their prediction score was high. Then ask the class whether that model captured the experience of the subject. The answer must be no, because you had no experience relevant to the reports; you were following a syntax rule. This is the pivot point where the lesson lands. Ask them if they can distinguish, based on the data alone, between the pairs who were reporting genuine compressed experience and the pair who was generating syntactic noise. They cannot. This uncertainty is not a bug of the activity; it is the feature of heterophenomenology. Now you can introduce Dennett's terminology. Map the sealed cards to the concept of the text. Explain that for the scientist, the subject's utterances are just inscriptions, data points to be organized. Map the Experimenter's model to the construction of the subject's world, the heterophenomenological world. Map the scoring rule to the principle of neutrality. The method refuses to verify whether the subject is telling the truth about their qualia, and it refuses to debunk them as liars. It treats them as a theorist treating their own data. The attraction is that this makes consciousness scientifically tractable; you can measure prediction. The cost is that you lose the guarantee that you are studying experience rather than speech behavior.

  There are predictable failures you must be ready to handle. The first is rebellion against the word budget. Subjects will try to write small or argue that their experience cannot be compressed. Stand firm. Tell them the constraint is the experimental condition, much like the bandwidth limits of a neural recording device. If they break the rule, discard the card and give them zero points for that round. This frustration is necessary; it simulates the loss of information inherent in third-person science. The second failure is the Experimenter trying to cheat by looking at the Subject during the writing phase. Remind them that the data is the text, not the person. If they glean information from a grimace or a sigh, they are violating the method. The third failure is the confederate being too obvious. If your rule is too complex, the Experimenter will fail to predict, and the lesson collapses. If it is too simple, they will guess the trick. Aim for a rule that creates a pattern recognizable only after two or three data points, mimicking the way scientific theories gain traction over time.

  You must also be honest with them about what this activity cannot reproduce. In real neuroscience, heterophenomenology is not the only data stream. The verbal reports are disciplined by neural data, behavioral reaction times, and physiological measures. In this classroom simulation, the reports float in a vacuum, which exaggerates the skepticism. You need to supply this context yourself during the debrief. Explain that Dennett does not deny experience exists; he brackets it. He puts it in parentheses so that science can proceed without getting stuck on the hard problem. The activity simulates the bracketing, but it cannot simulate the eventual integration with neurobiology. Also, acknowledge that in real science, the subject is not adversarial. Here, the word budget makes them adversarial. In real experiments, the goal is cooperation to maximize data quality. This activity creates a worst-case scenario to highlight the epistemic gap, but you must reassure them that the method is usually used in concert with trusting collaboration.

  Finally, end the session by returning to the uncertainty. Leave them with the question of whether the high-scoring model from the confederate round was a good theory of mind. It predicted behavior perfectly, so by scientific standards, it was successful. But it explained nothing about consciousness. This is the heterophenomenological bind. We can build a perfect theory of what people say about their minds without ever touching the minds themselves. Whether that is a fatal flaw or a necessary compromise is the question you want them to carry into the reading. You will not resolve this for them. The activity is designed to make the problem visceral, not to solve it. If you leave them feeling that the method is both indispensable and deeply unsettling, you have succeeded. The goal is not to convince them Dennett is right, but to show them why he thought he had to propose this method in the first place. The discomfort they feel about the confederate is the discomfort of doing science on the mind, and that is where the real philosophy begins. I hope this design serves your seminar well and that the friction it generates sparks the kind of rigorous debate that makes graduate teaching so rewarding.
