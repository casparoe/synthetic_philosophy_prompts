answer: |-
  1. **The Future-Tense Thesis**
  It is a metaphor, not a distinct claim. Knowledge doesn't have tense; agents do. You are trying to describe *teleology* (goal-directedness), not grammar. The cleanest statement of your actual intuition is: "Knowing-how is knowledge whose satisfaction condition is an action, rather than a truth." Does it survive the bus leak? No. "Knowing the bus will be late" has a future satisfaction condition (the bus arriving), but it is still knowledge-that because its success is measured by *accuracy*, not *agency*. Your thesis collapses because you are confusing the *content* of the knowledge (the future) with the *mode* of the knowledge (doing vs. seeing).

  2. **The Instructor Problem**
  It does work, but not for the reason you think. It demonstrates *ostensive* teaching, not non-propositional knowledge. The strongest reply from the Intellectualist (the "knowing-how is knowing-that" camp) is this: Nell possesses unconscious propositional knowledge. She holds the rule ("if resonance drops X%, crack likely") but accesses it via a practical mode of presentation. When she nudges the apprentice, she is physically instantiating a proposition, not transferring a "residue." The apprentice learns the rule through the body before they can articulate it. Their reply wins if you cannot explain how Nell corrects a *mistake* without referencing a standard of correctness—which looks suspiciously like a rule.

  3. **The Strongest Objection**
  The Normativity Problem. If know-how is just a "forward-leaning residue" or a disposition, how do we distinguish skill from habit? A habit is also future-oriented and hard to articulate. Knowledge implies the possibility of being *wrong* in a way that matters. If Nell feels "greasy" but the weld is sound, she is wrong. Propositions handle error cleanly (the proposition is false). Your "residue" handles error poorly—if it's a feeling or a trajectory, where does the correctness condition come from? Without that, you haven't described knowledge; you've described a reflex.

  4. **Known Argument**
  You have reinvented the core tension between Gilbert Ryle's anti-intellectualism and the contemporary intellectualist response led by Jason Stanley, filtered through Hubert Dreyfus's phenomenology of embodied skill.

  5. **Cuts and Setting**
  Cut these 170 words:
  > "But I don't buy that the inarticulacy is the point. Plenty of things I know I can't say either, and they're still facts. So: know-how is the part of knowledge that has a future tense. What I call the residue is just this forward-leaning part, the bit that can't be handed over in a sentence, because a sentence is a thing that stops and the skill doesn't stop, it keeps going. Which brings me to the instructor problem, my best shot at a test case. It doesn't feel like that. It feels like she's steering the kid's trajectory rather than describing it. Teaching a skill might not be transfer of facts at all. It might be transfer of the residue."

  The shipyard is not set dressing; it is phenomenological ground. Without the probe and the weld, "residue" is just abstract fog. Keep the tactile details (greasy, flat, pulse) but stop asking them to prove the philosophy. They illustrate the experience, not the argument.

  6. **Falsehoods**
  Yes. "Knowing that is always about something already settled." This is factually false. I know that the sun will rise tomorrow; I know that 2+2=4 will equal 4 next year. These are future-directed knowledge-that claims. You build a central pillar of your essay on a definition of "knowing that" which excludes future contingents, which is why the bus case leaks. You must abandon the "settled vs. future" distinction entirely.
