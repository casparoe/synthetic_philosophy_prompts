answer: |-
  Based on your supervisor's background in Refugee Status Determination (RSD) and the pattern of her verdicts, I can offer a fairly confident prediction. You are correct that her track record underdetermines the two rules you've identified (*Persecutor* vs. *Protection-Gap*), but only because both are proxies for a third, more specific principle rooted in international refugee law.

  Here is the breakdown of the new cases, the actual rule she is running, and the test case that will settle it.

  ### 1. The Verdicts on the New Cases

  **Case 1: The Coastal Community (Climate Change)**
  *   **Verdict:** **No Obligation.**
  *   **Reasoning:** This is the clearest "No" of the two. In RSD terms, this is "generalized harm" or "natural disaster." Even though the harm is specific to *coastal* communities, it is not specific to *persons* based on who they are (identity, belief, action). There is no human agent inflicting harm to punish or suppress them.
  *   **Analog:** This maps most cleanly to the **Civil War** case (young man fleeing shelling). In both, the threat is environmental/circumstantial rather than targeted. The state's inability to relocate them is a failure of capacity or policy, not a refusal of protection against a persecutor.

  **Case 2: The Valley Community (Development Dam)**
  *   **Verdict:** **No Obligation.** (Though she might concede a *humanitarian* argument, she will likely maintain there is no *obligation of admission*.)
  *   **Reasoning:** This is the critical case for your theory. There is an agent (the State). There is a protection gap (the State is the harm-doer). However, in RSD jurisprudence, displacement for development projects is generally *not* considered persecution unless it is discriminatory (e.g., the dam is only flooding *ethnic* valleys). Assuming the dam floods everyone in the valley for the "greater good" (electricity/irrigation), this lacks the **punitive or discriminatory intent** required for refugee status.
  *   **Analog:** This maps to the **State Collapse** case. In both, the predicament is shared by everyone in that geography. The fact that the State is the *cause* in one and the *absentee* in the other matters less than the fact that the harm is **non-discriminatory**.

  ### 2. Which Rule is She Really Running?

  You asked me to choose between the *Persecutor Rule* and the *Protection-Gap Rule*. The honest answer is: **Neither.** Both are underdetermined by her past verdicts, and the Dam case falsifies the *Persecutor Rule* (as you defined it).

  If the *Persecutor Rule* (needs an agent) were the true driver, she would have to say **Yes** to the Dam case (State is the agent). If she says **No**, then the presence of an agent is insufficient.

  If the *Protection-Gap Rule* (specific harm + state can't/won't protect) were the true driver, she would have to say **Yes** to the Dam case (State won't protect) and arguably **Yes** to the Coastal case (State can't protect specific group).

  **The Third Rule: The Nexus/Persecution Standard**
  Her background is the key. She is applying the **1951 Refugee Convention definition**, either explicitly or internalized as moral intuition. The core of this definition is not just "harm + state failure," but **harm + state failure + Nexus.**

  To owe admission, the harm must be inflicted **because of** who the person *is* (Race, Religion, Nationality, Political Opinion, Particular Social Group).
  *   **Journalist:** Political Opinion. (Yes)
  *   **Woman:** Social Group (Gender). (Yes)
  *   **Religious Minority:** Religion. (Yes)
  *   **Gang Victim:** Social Group (those targeted/resisting). (Yes)
  *   **Civil War/State Collapse:** No Nexus (Generalized risk). (No)
  *   **Economic:** No Nexus (Preference). (No)
  *   **Coastal/Dam:** No Nexus (Geographic/Economic sacrifice). (No)

  She is not looking for a *Persecutor*; she is looking for *Persecution*. In her framework, a natural disaster or a development project can cause immense suffering, but without a discriminatory *reason* for the harm, it does not generate an obligation of admission.

  ### 3. The Clean Test Case

  You asked for a single case that separates the *Persecutor Rule* from the *Nexus Rule* (which is the actual competitor to your *Protection-Gap Rule*).

  **The "Random Terror" Case:**
  > A warlord has taken over a province. To maintain order through fear, he randomly selects one household per week to be executed. He does not care who they are, what they believe, or where they live within the province; it is a lottery. The national army cannot reach the province to stop him. A man whose house is next on the list seeks admission.

  *   **Persecutor Rule:** **Yes.** (There is a clear agent inflicting harm).
  *   **Protection-Gap Rule:** **Yes.** (State is unable to protect; harm is specific to him this week).
  *   **Nexus/Persecution Rule:** **No.** (He is not targeted for *who he is*, but by random chance. This is generalized violence with an agent).

  **Prediction:** Your supervisor will say **No**.
  **Why:** This matches her "Civil War" verdict. The presence of a malicious agent (warlord) does not convert generalized violence into persecution. If she says "No" here, the *Persecutor Rule* is dead. If she says "Yes," then she is indeed running a simpler "Agent + Protection Gap" model, and the Dam case becomes the true tie-breaker.

  ### 4. Honest Assessment of Underdetermination

  You are right to be annoyed. Based *strictly* on the seven cases you listed, your two rules are logically equivalent.
  *   In every "Yes" case, there was an Agent AND a Protection Gap.
  *   In every "No" case, there was No Agent (or a Generalized one) AND No Specific Protection Gap (because the state protects everyone equally by failing everyone equally).

  The **Dam Case** is the first time these variables decouple.
  *   It has an **Agent** (State).
  *   It has a **Protection Gap** (State is the harm).
  *   It lacks **Nexus** (Non-discriminatory).

  If she says **No** to the Dam (which I strongly suspect given her RSD history), it proves that **Agency is not enough**. She requires the harm to be *discriminatory*.

  **Recommendation for Supervision:**
  Don't frame it as "Persecutor vs. Protection." Frame it as **"Persecution vs. Misfortune."** Ask her directly: *"Is the obligation triggered by the severity of the harm and the lack of protection, or does the harm need to be discriminatory in nature?"*

  Her answer will likely be the latter. She views migration obligations through the lens of **surrogate protection**. We only step in when the home state has broken the specific bond of trust with a citizen *based on their identity*. When the state fails everyone equally (collapse, war, dam, climate), the obligation is humanitarian, but not a specific duty of *admission* that overrides border sovereignty. When the state targets a group (journalist, minority, woman), the bond is severed discriminatorily, creating the specific claim.

  **Summary:**
  1.  **Coastal:** No (Analog: Civil War).
  2.  **Dam:** No (Analog: State Collapse/Civil War).
  3.  **Real Rule:** Nexus/Persecution Standard (Harm must be discriminatory).
  4.  **Clean Test:** The "Random Terror" case (Agent + Gap, but No Nexus). Predicted verdict: No.
