answer: |-
  So you have left the lab for the seminar room and found that the ghosts of discarded theories are haunting the coffee breaks. Your friend is wielding what is known as the pessimistic meta-induction, and it is indeed the heavy artillery of anti-realism. The argument is simple enough to state but hard to shake because it leans on the very history you used to work within. To give a response that does not just dig in your heels but actually engages the philosophical weight of the claim, you need to know what a successful defense actually looks like. It is not enough to say that science works; you have to explain how it works without pretending the past never happened. An adequate realist response must first satisfy a historical constraint, meaning it cannot simply cherry-pick the successes of Newton or Einstein while ignoring the embarrassments like phlogiston or the luminiferous ether. If your version of realism cannot explain why the ether theory was successful enough to be believed yet false enough to be discarded, then it is not a theory of science, it is a theory of our current preferences. You have to show that the failure of past theories does not entail the falsity of current ones, which means you need a nuanced account of why some theories fail completely while others merely mature.

  This leads directly to the problem of continuity and reference. You cannot concede that every term in a past theory failed to refer, or else you lose the ability to say science progresses rather than just changes. If the word electron in 1900 and the word electron in 2000 refer to completely different things because the theories changed, then we never actually learn anything about the same world. A good response must allow for partial reference failure while maintaining that enough of the causal chain remains intact to say we are talking about the same stuff. However, you also cannot be too generous here. If you say that phlogiston was really just referring to electrons because both involve chemistry, you make the concept of truth trivial. You need to walk a line where you admit that specific descriptions were wrong but the causal posits were roughly on target. This ties into the distinction between whole theories and their components. You must concede that whole theories are almost certainly false in their entirety because they contain idealizations and auxiliary assumptions that will not survive. The realist commitment should not be to the theory as a packaged whole but to the specific entities or equations that are doing the heavy lifting. The challenge is to identify which parts those are without waiting for the future to tell you.

  This is where the temptation to retreat arises. Many realists want to say that whatever part of the theory survives into the next paradigm was the real part all along. You must avoid this if you want to be taken seriously, because it turns realism into a tautology. If you only believe in what survives, you are not making a claim about the world now, you are just waiting for history to judge you. An adequate response needs a criterion for belief that is prospective rather than retrospective. It needs to tell you why you should believe in quarks today based on evidence available today, not based on the hope that quarks will be in the textbooks in 2100. This requirement is the single most important filter for ruling out lazy versions of realism. If a defense of realism cannot tell you how to distinguish the working parts of a theory from the idle parts before the theory is superseded, it is merely optimism dressed up as philosophy. You need a principled way to separate the wheat from the chaff in the present moment.

  Now consider the rival moves you have heard about. The strategy of dividing the theory into working and idle parts is often called selective realism or divide et impera. This meets the requirement of distinguishing parts, but it often fails the non-ad hoc constraint. Critics argue that realists only identify the working parts after the fact, once they know what survived. To meet the desiderata, this strategy must provide independent markers of reliability, such as novel predictive success or robustness across different experimental setups, that allow us to identify the real parts before the theory changes. Then there is structural realism, which suggests we should only believe in the mathematical structure of the theory and not the nature of the entities themselves. This handles the historical cases well because equations often survive even when the story about what is wiggling changes. However, it faces a tough requirement regarding the nature of reality. You cannot have structure without something that is structured. If you concede too much here, you end up with a world of math without ontology, which many find unintelligible. To work, this view must explain how structure captures reality without committing to the specific entities, which is a high bar to clear.

  Another move is to argue that the induction only works because we are bad at imagining the rivals our successors will have. This is the problem of unconceived alternatives. The realist response here is to insist that our current methods of theory selection are truth-conducive enough to overcome this limitation. But to meet the desiderata, this claim must be backed by an account of why our current conceptual space is sufficiently broad. You cannot just assert that we are getting closer; you have to explain why the space of possible theories is constrained by the world rather than by our psychology. If you cannot do that, you are assuming what you need to prove. There is a tension here that you must flag for yourself. You cannot simultaneously demand that science preserves the exact ontology of the past and that it undergoes radical conceptual change. These are incompatible requirements. History shows us that entities get eliminated, so a demand for strict ontological continuity is a preference of a naive realist, not a non-negotiable condition. The non-negotiable requirement is that the response must explain the instrumental success of science without invoking a miracle. If you say theories are false but work perfectly, you are positing a cosmic coincidence. Realism is the claim that truth is the best explanation for success, so any response must preserve that link.

  So when you sit down with your friend, you need to hold these lines firm. You must admit that past theories were false in many respects, but deny that this implies current theories are false in the same ways. You must insist that reference is stable enough to allow progress but flexible enough to allow correction. You must reject the idea that realism is a bet on the future and frame it as an inference to the best explanation of the present. The crucial thing to remember is that the burden is on you to provide a method for identifying truth candidates now. If you cannot offer a way to distinguish the durable components of a theory from the ephemeral ones without relying on hindsight, then you have not answered the pessimistic meta-induction, you have just postponed it. That is the hill you need to die on. The rest is negotiation about how much structure counts as reality or how much reference failure we can tolerate. But if you lose the ability to specify why we should believe this part of the theory today, you have conceded the argument to the skeptic.
