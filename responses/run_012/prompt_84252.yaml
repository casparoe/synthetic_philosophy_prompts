          *   *Verdict:* He would be skeptical. He might view statutory limits as a bureaucratic imposition (rationalization) but worry it signals a decline in the "spirit."
          *   *Right to Leisure:* Weber would likely say capitalism grants no *moral* right to leisure, only a functional one. Leisure is suspect unless it recharges labor power.

