prompt: |-
  hey, so i'm in this normative ethics course and we've just spent two weeks on supererogation, acts that go beyond the call of duty, and now i have to write a "spec" paper — basically, before i'm allowed to evaluate any particular theory i have to first say what a theory of supererogation would actually have to deliver. can you act as someone who works on this professionally and just lay the desiderata out for me? think carefully about which of the things people demand of such a theory are real requirements and which are just habits of one camp.

  start by brainstorming the landscape for yourself (the deontic categories, the stock examples, the usual objections), then give me the requirements list, each with the case or consideration that motivates it. things i definitely want covered:

  - the basic deontic map it has to get right: how it carves up obligatory / permissible / forbidden / beyond-the-call, and why "beyond the call" can't just be folded into "permissible" or "good to do".
  - the optionality bit: if i don't do a supererogatory act i'm not blameworthy, but if i do it i am praiseworthy. spell out why that asymmetry is a requirement and not just a quirk of how we talk.
  - our prof's weird example: a billionaire writes a cheque that saves a village at basically zero cost to himself. is that supererogatory if it costs him nothing? what does a theory owe us about sacrifice vs no-sacrifice?
  - role-relative baselines: the exact same rescue is obligatory for the on-duty lifeguard but supererogatory for the sunbather watching. a theory has to say what fixes the baseline of duty — one universal baseline, or does it shift with role, and if it shifts how do you stop "beyond duty" from just meaning "beyond what's expected of you".
  - the mirror-image category our TA kept mentioning: acts that are kind of bad to do (like being a bit cold to a friend) but that nobody thinks are forbidden. does a theory of supererogation have to account for these too, or is that a separate job?
  - motive: someone does a hugely beneficial thing purely to get praised for it. does it still count? does the theory owe us a story about the agent's reasons or only about the act?
  - the demandingness / baseline problem: if morality is very demanding there's less room left for supererogation, so the theory seems to need a view on how demanding morality is — flag it if that makes the whole thing circular.
  - and it should let the anti-supererogationist line ("there just are no acts beyond duty") come out as a substantive thesis rather than a self-contradiction.

  the part i care about most: which of these can't be held together. if some pair or triple is jointly unsatisfiable, say so, say which one you'd give up and why — that's the actual paper. also tell me which single requirement does the most work in excluding bad theories.

  don't bother scoring kantianism / utilitarianism / virtue ethics against the list, i'll do that in class.

  finish with one line, \answer{...}, containing just the requirement you think does the most exclusionary work, in a few words.
