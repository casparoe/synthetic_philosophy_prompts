answer: |-
  Here is a breakdown of the landscape and the desiderata for a specification paper on supererogation. I've structured this as a professional overview of the meta-ethical constraints any viable theory must navigate, distinguishing between conceptual necessities and substantive commitments.

  ### The Landscape: Deontic Logic and the "Gap"

  To write a spec paper, you first need to visualize the deontic map. Standard deontic logic is tripartite: **Obligatory (O)**, **Permissible (P)**, and **Forbidden (F)**.
  *   **O:** You must do it; if you don't, you are blameworthy.
  *   **F:** You must not do it; if you do, you are blameworthy.
  *   **P:** You may do it or not; no blame either way.

  **Supererogation (S)** creates a problem because it seems to sit inside **P** but behaves like **O**. It is morally excellent (like O) but optional (like P).
  *   **Stock Examples:** The soldier falling on the grenade; the Good Samaritan paying a stranger's medical bills.
  *   **The Core Objection:** If an act is the *best* thing to do, why isn't it obligatory? (The Maximizing Challenge). If it isn't the *best* thing to do, why is it praiseworthy? (The Value Challenge).

  A theory of supererogation is essentially a theory about how to carve out a logical space for **S** without collapsing it into **O** or trivial **P**.

  ---

  ### The Desiderata: Requirements for a Theory of Supererogation

  Here are the requirements your theory must meet. I have flagged which are conceptual necessities (hard constraints) and which are substantive commitments (where camps disagree).

  #### 1. The Asymmetry of Accountability (Conceptual Necessity)
  *   **The Requirement:** The theory must explain why performing an S-act renders the agent **praiseworthy**, while omitting it renders the agent **not blameworthy**.
  *   **Motivation:** This is the phenomenological data Urmson identified. If you are blamed for not jumping on the grenade, it wasn't supererogatory; it was duty. If you get no moral credit for doing it, it was merely permissible.
  *   **Why it's a requirement:** Without this asymmetry, the concept dissolves. It distinguishes S from "Imperfect Duty" (where you have some obligation to adopt the maxim) and from "Optimal Duty" (where you are blamed for not doing the best).

  #### 2. The Deontic Distinction (Conceptual Necessity)
  *   **The Requirement:** The theory must distinguish S-acts from merely **Permissible (P)** acts that are morally neutral.
  *   **Motivation:** Choosing tea over coffee is permissible, but not supererogatory. S-acts have positive moral value.
  *   **Why it's a requirement:** If S is just a subset of P with no distinct normative force, we don't need a category for it. The theory must explain what adds the "moral excellence" tag to a permissible act.

  #### 3. Baseline Specificity (Conceptual Necessity)
  *   **The Requirement:** The theory must define the **baseline of duty** against which "beyond" is measured. It must specify whether this baseline is agent-neutral (universal) or agent-relative (role-dependent).
  *   **Motivation (The Lifeguard Case):** Saving a drowning child is duty for the lifeguard, S for the sunbather. A theory cannot just say "it depends on expectations." It must explain *why* the duty shifts. Is it contractual? Capacity-based? Relationship-based?
  *   **Why it's a requirement:** Without a fixed baseline, "beyond the call" is empty. If the baseline shifts arbitrarily, S becomes "whatever I feel like doing extra," which loses normative weight.

  #### 4. Motive Independence (Substantive Commitment)
  *   **The Requirement:** The theory must state whether S-status attaches to the **act-type** or the **act-token (including motive)**.
  *   **Motivation (The Praise-Seeker):** If a billionaire saves a village solely for tax breaks and PR, is the act supererogatory?
      *   *View A:* Yes. The act is objectively beneficial and costly. Motive affects *praise*, not the *status* of the act.
      *   *View B:* No. Supererogation requires moral worth, which requires right reasons.
  *   **Why it's a requirement:** You don't have to pick one, but your theory *must* pick one. A theory that waffles here cannot determine when S has occurred.

  #### 5. Sacrifice vs. Costless Benefit (Substantive Commitment)
  *   **The Requirement:** The theory must take a stance on whether **sacrifice/cost** is necessary for S.
  *   **Motivation (The Billionaire Case):** If the billionaire saves the village at *zero* cost (clicking a button), is it S?
      *   *Traditional View:* S requires sacrifice/risk. No cost = Duty.
      *   *Modern View:* S requires only that the act is not required, regardless of cost.
  *   **Why it's a requirement:** This determines the scope of the category. If you require sacrifice, you exclude "easy heroism." If you don't, you risk collapsing S into "any good deed not strictly mandated."

  #### 6. Suberogatory Symmetry (Optional/Desirable)
  *   **The Requirement:** Ideally, the theory should account for the mirror category: **Suberogatory** acts (permissible but morally questionable, e.g., being cold to a friend).
  *   **Motivation:** If there is a "beyond duty," is there a "below duty but not forbidden"?
  *   **Why it's optional:** A theory of supererogation *can* exist without suberogation. However, a theory that explains the deontic "gap" generally ought to explain why the gap exists on both sides of duty. If you ignore this, note it as a limitation.

  #### 7. Demandingness Neutrality (Methodological Requirement)
  *   **The Requirement:** The theory should not presuppose a specific level of moral demandingness to define S.
  *   **Motivation:** If you define S as "what is left over after Utilitarianism takes its cut," you've baked in a low level of demandingness. If you define S as "what is left after minimal duty," you've baked in a high level.
  *   **Why it's a requirement:** To avoid circularity. The theory of S should help us *determine* how demanding morality is, not assume it.

  #### 8. Anti-Supererogationist Coherence (Logical Requirement)
  *   **The Requirement:** The theory must allow the statement "Supererogatory acts do not exist" to be a **substantive false claim**, not a **conceptual contradiction**.
  *   **Motivation:** Some philosophers (e.g., strict Act Utilitarians) argue there is no S. If your definition of S makes it logically impossible for them to be wrong (e.g., by defining S as "any non-obligatory good act" and then proving such acts exist by fiat), you haven't engaged the debate.
  *   **Why it's a requirement:** A good spec allows for the possibility that the category is empty in the actual world, even if coherent in concept.

  ---

  ### The Tensions: What Cannot Be Held Together

  This is the core of your paper. You need to identify where these desiderata clash. A theory cannot maximize all of them simultaneously.

  **1. The Maximizing Principle vs. The Asymmetry of Accountability**
  *   **The Conflict:**
      *   *Premise A (Maximizing):* Morality requires agents to perform the best available act.
      *   *Premise B (Asymmetry):* Supererogatory acts are the best available acts (in terms of value), but omitting them is not blameworthy.
      *   *Result:* Contradiction. If it's the best, and morality requires the best, omitting it is blameworthy.
  *   **Resolution:** You must give up or modify **Premise A**. A theory of supererogation *must* incorporate **Agent-Centered Prerogatives** (the right to not do the best) or reject the idea that S-acts are always the *objective* best.
  *   **Professional Advice:** Don't try to save Maximizing. The existence of S *just is* the proof that morality is not strictly maximizing.

  **2. The Sacrifice Condition vs. The Billionaire Intuition**
  *   **The Conflict:**
      *   *Premise A (Sacrifice):* S-acts necessarily involve significant cost/risk to the agent.
      *   *Premise B (Billionaire):* The billionaire clicking a button to save a village (zero cost) is intuitively supererogatory (or at least, we want to praise it as such).
      *   *Result:* If you hold A, the Billionaire case is Duty. If you hold B, Sacrifice is not necessary.
  *   **Resolution:** Most contemporary work gives up **Premise A**. Sacrifice is a common *feature* of S, but not a *definition*. Making it definitional excludes too many clear cases of moral excellence.

  **3. Baseline Relativity vs. Objective Value**
  *   **The Conflict:**
      *   *Premise A (Relativity):* Duty shifts by role (Lifeguard vs. Sunbather).
      *   *Premise B (Objective Value):* The moral value of saving a life is constant regardless of who does it.
      *   *Result:* If the value is constant, why does the deontic status change?
  *   **Resolution:** You must distinguish **Value** (outcome goodness) from **Obligation** (agent-specific requirement). A theory that conflates outcome value with duty cannot handle role-relativity.

  ---

  ### The Single Most Exclusionary Requirement

  If you want to filter out the weak theories immediately, look at **The Asymmetry of Accountability** (specifically the *no-blame for omission* clause).

  **Why?**
  1.  **It kills Act Utilitarianism:** In strict Act Utilitarianism, if an act produces the most good, it is obligatory. Omitting it is wrong. Therefore, S cannot exist. To accommodate S, Utilitarianism must be modified (e.g., Rule Utilitarianism or adding prerogatives), which changes the theory fundamentally.
  2.  **It kills Rigid Deontology:** Some Kantian readings suggest that if an act is morally necessary according to the Categorical Imperative, it is duty. If it's not commanded, it's merely permissible (neutral). Squeezing "praiseworthy but optional" into the Perfect/Imperfect duty distinction is notoriously difficult without stretching definitions.
  3.  **It forces a structural change:** To meet this requirement, a theory cannot just be about "maximizing good" or "following rules." It must include a structural account of **agent prerogative** or **optionality**. This is a heavy lift.

  Many theories fail because they can explain why the act is *good*, or why it is *optional*, but they cannot explain why it is *good yet optional without blame*. That specific triad is the graveyard of normative theories.

  \answer{The Asymmetry of Accountability}
