  The Foreman wiped grease from his brow. "We need pulleys. Gears. A gradual ascent from matter to mind. You can't hang consciousness off a metaphor."

  The Consultant from Skyhook & Sons polished his golden hook. "Why bother? This attaches directly to Truth. No base required. Established Since Forever."

  "It's hanging on nothing," the Foreman said.

  "It's a basic fact," the Consultant corrected. "You're over-engineering the miracle."

  From the catwalk, the Greedy Reductionist shouted down. "Why are you building at all? It's just steel! Tell the elevator it's only atoms and let it fall. Saves on cables."

  "I need the intermediate steps," the Foreman insisted, tightening a bolt. "You can't skip the scaffolding."

  "Scaffolding is just delayed reductionism," the Reductionist grumbled. "Admit the top floor is the basement and walk home."

  The Consultant hooked his device onto the void. It held. "See? Instant elevation."

  "That's not lifting," the Foreman said. "That's levitation."

  "Same payload," the Consultant winked. "But my invoice doesn't itemize the physics."

  The Foreman watched the hook vanish into the clouds. "Eventually, that cable's gonna snap."

  "Only if you believe in tension," the Reductionist called out.
