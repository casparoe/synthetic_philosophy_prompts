answer: |-
  Your hypothesis is astute, but it requires sharpening. You suggest the disagreement might be about "what a theory of vagueness is for," implying a pragmatic divergence. I will argue that while pragmatic divergence is the *cause* of the standoff, the disagreement itself is substantive: it is a conflict over which theoretical cost is intolerable. It is not merely that they have different aims; it is that they make contradictory metaphysical claims about the same semantic facts. However, the reason the debate feels sterile is that each side treats their preferred theoretical virtue as a constraint and the other's as a negotiable cost.

  Here is the adjudication.

  ### 1. Commitments and Corrections

  Your framing of the two positions is largely standard, but there is one critical inaccuracy regarding Epistemicism that fuels the "talking past" sensation.

  **Supervaluationism (The Semantic Indecision View)**
  *   **Core Commitment:** Vagueness is semantic indecision. The meaning of 'tall' is not fixed enough to select a single extension. There is a set of admissible precisifications.
  *   **Truth:** A sentence is true (supertrue) iff it is true on all admissible precisifications.
  *   **Logic:** It claims to preserve classical logic (all classical tautologies are supertrue), but it rejects Bivalence for borderline cases. Crucially, it often fails to preserve classical *inference rules* (like Conditional Proof or the Deduction Theorem) when the determinacy operator is involved.
  *   **Data Accommodation:** It honors the intuition that there is no sharp boundary. There literally is no grain where 'heap' switches from false to true.

  **Epistemicism (The Ignorance View)**
  *   **Core Commitment:** Vagueness is ignorance. The meaning of 'tall' *is* fixed enough to select a single extension, but we cannot know where it is.
  *   **Truth:** Bivalence holds universally. Every sentence is true or false.
  *   **Logic:** Classical logic and Bivalence are non-negotiable.
  *   **Data Accommodation:** **Correction:** You wrote that both accommodate the ordinary data, including the "felt absence of a boundary." This is incorrect. Epistemicism explicitly **rejects** this datum as veridical. It treats the intuition that "there is no boundary" as a psychological illusion or a error theory about our access. The Epistemicist says the boundary exists; the Supervaluationist says it does not. This is a direct contradiction, not a difference in accommodation.

  **Where They Actually Engage**
  The debate is not about whether we *feel* a boundary. It is about whether the **cost of preserving Classical Logic** outweighs the **cost of positing unknowable truths**.
  *   The Supervaluationist argues: Preserving Classical Logic is not worth positing metaphysical sharpness where there is none. We should drop Bivalence to save the "no boundary" intuition.
  *   The Epistemicist argues: Dropping Bivalence (and the associated inference rules) is too high a price. It breaks the logic we use for science and daily life. We should accept sharp boundaries to save Classical Logic.

  ### 2. Diagnosis: Substantive Disagreement Driven by Divergent Adequacy Conditions

  Your hypothesis that this is a disagreement about "adequacy conditions" is correct, but it is not *merely* that. If it were merely about aims, they could agree to disagree. They cannot, because they make contradictory claims about reality.

  **The Verdict:** This is a **substantive disagreement about the metaphysics of content**, masked as a semantic dispute, where the stalemate arises because each side treats a different theoretical virtue as a **hard constraint** rather than a **theoretical cost**.

  It is not a verbal dispute. "There is a fact of the matter" (Epistemicism) and "There is no fact of the matter" (Supervaluationism) are contradictory assertions.
  It is not two questions under one name. Both are asking "What is the semantic value of a vague predicate?"
  It is not a hidden empirical question. No experiment will reveal the last grain of a heap.

  It is a **methodological clash over theoretical cost-benefit analysis**. The "talking past" occurs because each side accuses the other of violating a constraint that the accuser holds sacred but the accused holds negotiable.

  **Specific Moves that Reveal the Clash:**

  1.  **The Tolerance Principle and Sorites:**
      *   *Supervaluationist Move:* The induction premise ("If $n$ grains is a heap, $n+1$ is a heap") is not supertrue. It is false on some precisifications. Thus, the argument is valid but unsound.
      *   *Epistemicist Move:* The induction premise is simply false. There is a specific $n$ where the antecedent is true and the consequent false.
      *   *The Clash:* The Supervaluationist thinks the Epistemicist is insane for believing a specific grain makes the difference. The Epistemicist thinks the Supervaluationist is insane for rejecting a premise that looks classically valid just to avoid that grain. They are weighing "metaphysical weirdness" against "logical revisionism."

  2.  **Higher-Order Vagueness (HOV):**
      *   This is the strongest point of engagement and where the Supervaluationist is most vulnerable.
      *   *The Problem:* If there is a boundary between 'tall' and 'not tall', is there a boundary between 'definitely tall' and 'borderline tall'?
      *   *Supervaluationist Struggle:* If you define 'definitely' as "true on all precisifications," you typically generate a sharp boundary between the definitely true and the indefinite. To avoid this, you need a hierarchy of precisifications, which becomes technically cumbersome and arguably collapses into Epistemicism anyway (as Williamson argues).
      *   *Epistemicist Advantage:* HOV is just deeper ignorance. We don't know where the 'tall' boundary is, and we don't know where the 'definitely tall' boundary is. No new formal machinery is needed.
      *   *The Clash:* The Supervaluationist tries to honor the "fuzziness of the boundary." The Epistemicist argues that trying to make the boundary itself fuzzy creates more logical problems than just accepting the boundary is sharp but unknown. Here, the disagreement is about **formal coherence**.

  3.  **The Determinacy Operator ($D$):**
      *   *Supervaluationist:* $D\phi$ is true iff $\phi$ is true on all precisifications. This allows for $D\phi \to \phi$ but often fails $D\phi \to DD\phi$ (iteration) without collapsing boundaries.
      *   *Epistemicist:* $D\phi$ is effectively "It is known that $\phi$" (or knowable). Since they accept Classical Logic, they accept the law of excluded middle for $D\phi$.
      *   *The Clash:* The Epistemicist charges the Supervaluationist with changing the subject. If you change the logic of 'true' and 'definitely', are you still analyzing *our* concept of truth? The Supervaluationist charges the Epistemicist with changing the subject. If you posit unknowable truths, are you still analyzing *our* concept of knowledge?

  ### 3. What Counts as Progress?

  Given this diagnosis, progress will not come from a new formal result (both systems are formally coherent) or a reading list. Progress will not come from finding the "true" theory, because the choice is underdetermined by the data.

  **Progress requires a shift from "Which theory is true?" to "Which theoretical cost is more tolerable?"**

  You should structure your seminar paper to force this trade-off into the open. Specifically, you should argue for the following distinction:

  **1. Distinguish "Phenomenological Adequacy" from "Logical Conservatism."**
  *   Supervaluationism scores high on Phenomenological Adequacy (it matches the intuition that there are no sharp boundaries).
  *   Epistemicism scores high on Logical Conservatism (it preserves Classical Logic and standard semantics).
  *   *Progress:* Acknowledge that you cannot have both. The debate stalls because both sides pretend they can. The Supervaluationist pretends classical logic is fully preserved (ignoring the failure of the deduction theorem). The Epistemicist pretends the "no boundary" intuition is preserved (ignoring that they call it an illusion).

  **2. The "Error Theory" Tax.**
  *   Ask the question: Is it better to have an error theory about *logic* (Supervaluationism says our classical inferences fail in borderline cases) or an error theory about *intuition* (Epistemicism says our intuition of no-boundaries is false)?
  *   *Progress:* A verdict on which error is less damaging to the broader philosophical project. If you are a naturalist, Epistemicism might be preferable (logic stays intact). If you are a phenomenologist, Supervaluationism might be preferable.

  **3. The Higher-Order Collapse.**
  *   Focus your critical energy here. This is the only place where one side might be objectively "wrong" (or at least in deeper trouble).
  *   *Argument:* If Supervaluationism cannot account for Higher-Order Vagueness without reintroducing sharp boundaries (between the definite and the indefinite), then it loses its main advantage over Epistemicism. It claims to avoid sharp boundaries, but if it must posit a sharp boundary between 'definitely tall' and 'not definitely tall', it has merely pushed the sharpness up one level.
  *   *Progress:* If you can demonstrate that Supervaluationism inevitably collapses into a form of Epistemicism at the higher orders (as Williamson suggests), then the disagreement dissolves in favor of Epistemicism on grounds of simplicity. If you can show Supervaluationism can handle HOV without sharp cuts (e.g., via degree theory or infinite hierarchies), then Epistemicism loses its simplicity advantage.

  **Conclusion for Your Paper**
  Do not try to solve vagueness. Solve the standoff. Your thesis should be: **The Epistemicist-Supervaluationist debate is a substantive disagreement about the metaphysics of content, but it is unresolvable because both sides treat their preferred theoretical virtue as a priori constraint rather than a negotiable cost. Progress requires abandoning the search for a theory that satisfies all intuitions and instead explicitly ranking the value of Logical Conservatism against Phenomenological Fidelity.**

  This moves the discussion from a stalemate about "what vagueness is" to a productive methodological discussion about "how we choose semantic theories." That is a genuine philosophical contribution.
