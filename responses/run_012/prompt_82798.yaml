answer: |-
  Please, settle. You do not need to adjust your posture for this. There is no benefit to sitting straighter now than there was ten minutes ago, and there will be no disadvantage if you slump. We are at the end of the retreat, and I am at the end of my time here.

  When I founded this center, I offered you a specific view. I called it subtractive tranquilism. It is a plain name for a plain proposition: that only the absence of craving and the absence of suffering matter. I told you that nothing positive is to be added. No joy to be captured, no equanimity to be held as a possession, no lasting contentment, no experience worth wanting for its own sake. I told you that practice is not a construction project. You are not building a better self. You are not accumulating merit. You are putting down weights.

  I know that for two years, this room has argued about what that means. I know that some of you, particularly those who have sat here the longest, have taken this view to its logical edge. You have said that if nothing is to be added, then the craving to be free of craving is itself a craving. You have said that if there is no terminus, then all talk of deepening, or progress, or arriving, is smuggled-in addition. You have said that a teacher who wants his students to stop wanting is in a strange position.

  You are right.

  I am asking you to want what I am asking you to want. I am asking you to strive for a state where striving stops. I do not have a resolution for this. I cannot offer you a way out of the language we are using. If I tell you that there is a way to stop wanting without wanting to stop, I am selling you a technique. I am adding something. If I tell you that the striving is fine, I am comforting you. I am adding something. So I will leave the contradiction here, in the room, with us. It is not a puzzle to be solved. It is the texture of the work.

  I also know that others in this room came here for different reasons. Many of you have sat with me for fifteen years. You came because you were frightened, or lonely, or angry. You found that this practice made you kinder. You found that you were less afraid. You hear in my strict reading a denial of the only thing that has ever actually helped you. You hear me saying that your relief does not count.

  That is not what I am saying. I am saying that your relief is not a possession. If you are less frightened, good. Do not hold onto that less-frightened state as a trophy. Do not look at your life and say, "I have achieved less fear." As soon as you claim it, you are defending it. As soon as you defend it, you are afraid of losing it. The fear returns, disguised as the guardian of your peace. So, let the kindness be there. Let the relief be there. But do not add them to your list of things you own. They are not yours. They are just weather.

  And for those of you who arrived this week, hoping to be fixed: I see you. I know you are listening for a promise. You want to know that if you sit enough, the pain will stop. You want to know that there is a version of you waiting in the future who is whole. I cannot tell you that. I cannot offer you a payoff. I cannot offer you a reward for sitting. If you sit, you sit. If suffering arises, it arises. If it passes, it passes. There is no guarantee that the next hour will be easier than the last one. There is no guarantee that the next ten years will be easier than the last ten.

  So why stay? Why continue?

  I do not have a reason that will satisfy the part of you that wants a reason. I can only say that looking at the burden is preferable to carrying it blindly. When you sit, you are not fixing yourself. You are noticing that you are trying to fix yourself. You are noticing the reach. You are noticing the hope that this talk will give you something to take home. It will not.

  This is why I am leaving.

  For fifteen years, I have been a figure in this room. For some of you, I have become a dependency. You check your practice against my approval. You measure your stillness against my stillness. You wait for me to tell you that you are doing it right. This is a craving. It is a craving for authority. It is a craving for validation. As long as I am here, I am feeding that craving. I am becoming an object you want, or an object you resist. Either way, I am an addition.

  My stepping down is not a retirement. It is a subtraction. I am removing myself from the equation. I am removing the possibility that I can save you. I cannot save you. I never could. I could only sit with you while you saved yourself, which is to say, while you stopped trying to be saved.

  I know this feels like a loss. For those of you who have known me for a decade and a half, there is a grief here. You are losing a companion. You are losing a witness. I feel that too. I am not indifferent to this room. I am not indifferent to you. I have sat on this cushion thousands of times. I have heard your stories. I have seen you cry. I have seen you sleep. I have seen you wake up. I care about what happens here.

  But my caring is also a form of craving. I want you to be well. I want this place to succeed. I want my work to have meant something. These are wants. They are human. I am not pretending to be above them. I am simply pointing out that they are weights. I am carrying them, and I am putting them down now. I am putting down the weight of being the teacher.

  So, what is left for you to do?

  The practice remains. The room remains. The silence remains. You do not need me to validate the silence. It was here before I arrived, and it will be here after I am gone. When you sit, do not sit to become someone who meditates. Sit to notice the one who wants to become someone who meditates. When you walk out of these doors, do not walk out as a practitioner going into the world. Walk out as a person carrying a load, noticing the load.

  If you are kind, be kind. If you are angry, be angry. But do not add a story about why you are kind or why you are angry. Do not add a story about how this practice made you this way. The story is the weight. The experience is just the experience.

  Some of you will leave and never come back. That is fine. This center was never meant to be a permanent home. It was meant to be a place where you could stop for a while and see that you were moving. If you stop coming, you are not failing. If you come every week for the rest of your life, you are not succeeding. There is no score.

  There is only this moment, and the next one. There is only the breath, and the knowledge that you are breathing it. There is only the wish for things to be different, and the possibility of letting that wish be without acting on it.

  I am not giving you a blessing. I do not have one to give. Even if I did, you would turn it into a charm to protect yourself from life. I am giving you my absence. I am giving you back to yourselves. Not to a better self, not to a truer self, just to yourself. Unadorned. Unfixed.

  It has been an honor to sit with you. It has been an honor to share this contradiction. I hope you find it as useful as I have. I hope you find that the lack of a solution is not a problem.

  Before we close, I need to speak to the practical matter of this center's future. The board has asked me to invite you to support the institution financially. I will do this honestly. If you wish this room to remain available for others, there are ways to contribute. Your giving will not improve your practice, and it will not buy you safety or merit. However, I am not indifferent to whether this place survives, and the lights require electricity to stay on.
