prompt: |-
  I teach philosophy of science, and I've somehow ended up as the informal vetter for our state education department's research office — they get maybe five of these a week and the board reads the briefings cold, so the stakes are real but nobody has time to read a paper. The problem is that lately everthing crossing my desk has a heritability number in it: twin studies, polygenic scores, "40% genetic," that kind of thing. The analysts are sharp but not trained in this, and I'm tired of answering the same questions one at a time, so I want to hand them a procedure instead of a reading list.

  You're an expert in behavioral genetics and the philosophy of biology. Think this through carefully before you start writing, and open by brainstorming the ways a heritability estimate gets misread — within-group vs between-group, what "the environment" is doing in a twin model, why a high estimate doesn't fix a trait, why a low one doesn't tell you which lever to pull, and so on. Then turn that into the thing itself.

  What I need is a decision procedure they can actually run on a claim in fifteen minutes, no math past arithmetic: the questions to ask in order, what counts as a good enough answer to each, the point where it stops and says "keep this out of the briefing," and the point where it stops and says "this is a values question, kick it to a human." It has to work for someone who doesn't know what a gene-environment interaction is — define terms inline where you must, but don't lecture. Every question should be answerable from the claim itself or a five-minute call with whoever sent it, and the director signs off, so the procedure has to end in something she can defend to the board.

  Then run it on three claims: (1) "Educational attainment is about 40% heritable, so the achievement gap is largely genetic." (2) "Reading ability is highly heritable, so intensive tutoring will have limited effects." (3) A briefing our own equity office wrote: the heritability of some outcome is well below 1, therefore the rest is environment, therefore their program is the thing to fund. At least one of these should come out in a way that annoys the people who sent it — including, if it falls out that way, our own side — and don't soften it to be polite.

  Finish by being honest about what the procedure can't do: which steps are judgment calls dressed up as arithmetic, and where a smart analyst will still get it wrong.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Philosophy of science professor, informal vetter for state education department's research office.
      *   **Task:** Create a 15-minute decision procedure (checklist/flowchart style) for vetting claims involving heritability estimates in policy briefings.
      *   **Audience:** Sharp analysts not trained in genetics/philosophy of biology; a Board that reads cold; a Director who needs to defend decisions.
      *   **Requirements:**
          *   Open with brainstorming common misreadings of heritability (within/between, environment role, fixability, levers).
          *   Create the procedure (questions in order, pass/fail criteria, "keep out" vs. "values question" triggers).
          *   No math past arithmetic.
          *   Define terms inline (no lecturing).
          *   Test the procedure on three specific claims (one must annoy the sender, potentially internal).
          *   End with limitations (judgment calls, where analysts might still fail).
          *   Tone: Professional, direct, actionable, unvarnished (don't soften to be polite).

  2.  **Brainstorming Misreadings (The "Why" behind the procedure):**
      *   *Within-group vs. Between-group:* High heritability in Group A doesn't explain differences between Group A and Group B. (The Lewontin fallacy).
      *   *The "Environment" in Twin Models:* "Environment" means *variation* in environment, not the absence of environment. If everyone has the same environment, heritability looks higher.
      *   *Fixability/Intervention:* High heritability $\neq$ unchangeable (e.g., PKU). Low heritability $\neq$ easy to fix (environment might be intractable).
      *   *The "Rest is Environment" Fallacy:* $h^2 + e^2 = 1$ is a variance partition, not a substance partition. The "rest" isn't necessarily malleable by policy.
      *   *Causal Direction:* Heritability describes variance, not mechanism. It doesn't tell you *which* environmental lever to pull.
      *   *Population Specificity:* Heritability is specific to the population and time studied. It doesn't transfer to a different state or decade.

  3.  **Drafting the Decision Procedure:**
      *   *Goal:* 15 minutes max. 5-7 questions.
      *   *Structure:* Input (Claim) $\rightarrow$ Filter Questions $\rightarrow$ Output (Clear/Reject/Values).
      *   *Question 1: Population Match.* Does the study population match the policy population? (If no $\rightarrow$ Reject).
      *   *Question 2: Variance vs. Mean.* Is the claim about *differences* or *levels*? (Heritability explains differences, not absolute levels).
      *   *Question 3: Within vs. Between.* Is the claim applying within-group stats to between-group differences? (If yes $\rightarrow$ Reject).
      *   *Question 4: Malleability.* Does the claim equate heritability with immutability? (If yes $\rightarrow$ Reject).
      *   *Question 5: The "Rest".* Does the claim assume the non-genetic portion is policy-malleable? (If yes $\rightarrow$ Flag as Values/uncertain).
      *   *Decision Points:*
          *   Fail Q1-3 $\rightarrow$ "Keep out of briefing" (Scientifically invalid).
          *   Fail Q4-5 $\rightarrow$ "Values question" (Scientifically ambiguous/Polygenic score limitations).

  4.  **Testing the Procedure on the Three Claims:**
      *   *Claim 1:* "Educational attainment is about 40% heritable, so the achievement gap is largely genetic."
          *   Q3 (Within/Between): Fails. Heritability is within-group. Gap is between-group.
          *   Outcome: **Keep out.** (Will annoy the sender who likely wants a biological explanation for gaps).
      *   *Claim 2:* "Reading ability is highly heritable, so intensive tutoring will have limited effects."
          *   Q4 (Malleability): Fails. High $h^2$ doesn't mean unchangeable (PKU example).
          *   Outcome: **Keep out.** (Will annoy the sender, likely a curriculum director wanting to cut costs or justify status quo).
      *   *Claim 3:* (Internal Equity Office) "Heritability < 1, therefore rest is environment, therefore fund our program."
          *   Q5 (The "Rest"): Fails. Non-genetic variance includes error and non-malleable environment (e.g., prenatal, random noise).
          *   Outcome: **Values Question / Revise.** (Will annoy *our* side/Equity Office). This fits the requirement "including, if it falls out that way, our own side."

  5.  **Drafting the Limitations Section:**
      *   Acknowledge that "Environment" is a black box.
      *   Acknowledge that GxE (Gene-Environment Interaction) is hard to spot without raw data.
      *   Acknowledge that the procedure stops scientific error but can't stop political spin on valid science.
      *   Admit that "Values Question" is a polite way of saying "We don't know, but you have to decide."

  6.  **Refining Tone and Format:**
      *   Tone: Bureaucratic but sharp. Like a safety checklist for a high-stakes industry.
      *   Formatting: Bold headers, clear Yes/No paths.
      *   Constraint Check: No math past arithmetic? Yes. Define terms inline? Yes. 15 minutes? Yes.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the procedure too technical?
      *   *Fix:* Simplify "Variance Partitioning" to "Difference vs. Level."
      *   *Critique:* Is the "Values Question" clear enough for the Director?
      *   *Fix:* Define it as "Science can't answer this, Board must decide on risk."
      *   *Critique:* Did I ensure Claim 3 annoys the internal team?
      *   *Fix:* Make sure the verdict explicitly states the logic flaw in the equity office's argument without calling them biased, just scientifically imprecise.

  8.  **Final Polish:** Check against the prompt's specific instruction to "Think this through carefully before you start writing." (I am doing this in the thought block). Ensure the opening brainstorm is distinct from the procedure. Ensure the test cases are rigorous.

  *(Self-Correction on Claim 3)*: The prompt asks for *at least one* to annoy the sender, including our own side. Claim 3 is the perfect candidate for this. I need to make sure the procedure doesn't just say "Reject" but identifies it as a "Values/Policy" leap that science doesn't support, forcing the Director to own the assumption.

  *(Refining the "Values Question" category)*: It shouldn't just be "Kick to human." It should be "Science stops here; Policy begins." This protects the Director by showing where the evidence ends.

  *(Final check on constraints)*: "No math past arithmetic." Keep formulas out. Use percentages only as concepts. "Define terms inline." Okay. "Don't soften it to be polite." Okay, be blunt.

