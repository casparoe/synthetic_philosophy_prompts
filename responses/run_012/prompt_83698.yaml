answer: |-
  This is a sophisticated diagnostic task. You are correctly identifying that the methodological stalemate in Historical Jesus Research (HJR) is not a technical failure but a structural feature of the field. The persistence of the criteria of authenticity, despite their evisceration in meta-methodological literature, suggests they are serving a function other than strict historical verification. They are boundary markers.

  Your hypothesis—that the rift concerns the **ontology of the Gospels** (archive vs. monument)—is robust, but to make it a doctoral-level diagnostic, you need to ground that textual ontology in a deeper **epistemological divergence regarding the nature of history itself**.

  Here is a structural diagnosis of the impasse, a test of your hypothesis, and a proposal for what constitutes progress.

  ### I. The Structure of the Disagreement: Three Axes of Incommensurability

  The debate has stalled not because scholars cannot agree on data, but because they are operating within incompatible epistemic frameworks. The disagreement is structured along three axes:

  **1. The Epistemological Axis: Access vs. Construction**
  *   **The Criteria Camp (Critical Realism):** Operates on the assumption that the historical Jesus is an object *behind* the text, accessible *through* the text via critical filtration. History is a recoverable stratum. The criteria are the tools of excavation.
  *   **The Memory Camp (Mnemonic Constructivism):** Operates on the assumption that the historical Jesus is an object *constituted by* the text. History is a narrative act. There is no "behind"; there is only the "in front of" the community.
  *   **The Impasse:** When the Memory camp says "We cannot access Jesus apart from memory," the Criteria camp hears "We cannot know anything." When the Criteria camp says "We must distinguish Jesus from the Church," the Memory camp hears "You are imposing a modern dualism on an ancient holistic worldview." They are not arguing about the same definition of "history."

  **2. The Ontological Axis: The Gospel as Container vs. The Gospel as Performance**
  *   **Your Hypothesis (Testimony to be Sifted):** This aligns with the **Container Ontology**. The Gospel is a vessel containing mixed materials (authentic/inauthentic, historical/theological). The scholar's job is assaying.
  *   **Your Hypothesis (Social Memory to be Read):** This aligns with the **Performance Ontology**. The Gospel is a speech-act that creates identity. The scholar's job is interpretation of effect.
  *   **The Impasse:** The Criteria approach treats theological elaboration as *contamination* to be removed to find the pure historical kernel. The Memory approach treats theological elaboration as the *primary data* of how Jesus functioned historically in the life of the movement. One side sees theology as an obstacle to history; the other sees theology as the medium of history.

  **3. The Theological/Normative Axis: The Protestant Principle vs. The Catholic Principle**
  *   You asked if this is a theological disagreement in disguise. It is, but not simply Protestant vs. Catholic. It is about **Normativity**.
  *   **The Critical Jesus:** For many in the Criteria camp (even secular ones), the "Historical Jesus" serves a prophetic function *against* the "Christ of Faith." This is the legacy of Protestant liberalism (Harnack, Bultmann): the true Jesus is stripped of dogma to challenge the institution. The criteria protect the Jesus who *critiques* Christianity.
  *   **The Remembered Jesus:** For the Memory camp (often influenced by post-critical or orthodox perspectives, e.g., Wright, Keener, or even secular reception historians), the "Christ of Faith" *is* the only historically significant Jesus. To detach them is to create a phantom.
  *   **The Impasse:** The Criteria are defended not because they work statistically, but because they preserve the possibility of a Jesus who stands in judgment over the Gospels. Abandoning the criteria feels, to some, like surrendering the critical principle to ecclesiastical authority.

  ### II. Testing Your Hypothesis

  Your hypothesis is that the camps dispute **what kind of object the Gospels are**.

  **Validation:**
  This holds up under scrutiny. If you analyze the meta-commentary of the "Criteria Defenders" (e.g., Meier, Evans) vs. the "Criteria Skeptics" (e.g., Le Donne, Keith, Byrskog), the divergence is precisely here.
  *   **Defenders** speak of the Gospels as **sources** that contain errors and biases which must be corrected to reveal the *res gestae* (things done).
  *   **Skeptics** speak of the Gospels as **artifacts** of the *historia rerum gestarum* (narrative of things done).

  **Refinement:**
  However, to strengthen the diagnosis, you must argue that this ontological disagreement is a symptom of a **temporal disagreement**.
  *   The Criteria camp views history as **linear and recessive** (we go back in time to find the origin).
  *   The Memory camp views history as **recursive and effective** (the origin is constantly re-constituted by its effects).
  *   **Diagnostic Point:** The criteria persist because the field has not agreed on whether "History" is the *origin point* (1st century Palestine) or the *trajectory of influence* (1st to 4th century reception). As long as "Historical Jesus" implies "Origin Point," the criteria will remain necessary for those committed to that definition.

  ### III. What Counts as Progress?

  You asked what would count as progress: a distinction, a reframing, or an argument that none should be expected. Given the structural incommensurability outlined above, **convergence is impossible and undesirable.** Progress lies in **Typological Clarity.**

  **1. A Distinction: "Jesus of History" vs. "Historical Jesus" vs. "Remembered Jesus"**
  Progress requires enforcing a terminological firewall that the field currently blurs.
  *   **The Jesus of History:** The positivist ideal (what actually happened, *wie es eigentlich gewesen*). Admit this is inaccessible.
  *   **The Historical Jesus:** The modern scholarly construct (a heuristic model used to explain the rise of Christianity). Admit this is a fiction, but a necessary one.
  *   **The Remembered Jesus:** The ancient social reality (how Jesus was actualized in the early church). Admit this is the only "historical" reality the texts offer.
  *   **Progress:** A paper that argues the "Impasse" exists because scholars claim to be seeking the *Remembered Jesus* while using tools designed for the *Jesus of History*.

  **2. A Reframing: From "Authenticity" to "Explanatory Power"**
  Stop asking "Did Jesus say this?" (which implies a binary true/false inaccessible to us). Start asking "Does attributing this to Jesus explain the trajectory of the movement better than attributing it to the early church?"
  *   This shifts the burden from **verification** (proving the event) to **plausibility** (proving the model).
  *   This renders the Criteria of Authenticity obsolete, replacing them with **Criteria of Coherence within a Trajectory**. This allows scholars to use "dissimilarity" not to isolate Jesus from Judaism/Church, but to identify distinctive emphases that *generated* the specific memory trajectory we see.

  **3. An Argument That None Should Be Expected (The Strongest Diagnostic)**
  You could argue that the impasse is the **finding**.
  *   The fact that the criteria are self-defeating (dissimilarity makes Jesus unrecognizable) is not a bug; it is a feature. It reveals that the "Historical Jesus" is a theological projection of modern individualism.
  *   **Progress:** A meta-analysis demonstrating that the "Third Quest" failed not because of bad method, but because it sought a *social prophet* using tools designed for *individual verification*. The lack of convergence proves that the Gospels resist the kind of atomization the Criteria require.
  *   **Conclusion:** The field should cease "Life of Jesus" research and move entirely to "History of the Jesus Movement" (Memory/Reception). The "Historical Jesus" should be retired as a category, kept only as a history-of-research artifact.

  ### IV. Recommendation for Your Piece

  Do not write a plea for a new method. Write a **genealogy of the stalemate**.

  1.  **Map the Incommensurability:** Show that the two sides are not playing the same game. One is playing "Forensic History" (what happened?), the other is playing "Cultural History" (what did this mean?).
  2.  **Expose the Theological Engine:** Argue that the Criteria of Authenticity are preserved primarily to maintain a **Critical Distance** between the Scholar and the Church. To abandon the criteria is to risk "confessionalism." Therefore, the debate is not about evidence; it is about the **secular legitimacy of the academy**.
  3.  **Propose the "Reception" Settlement:** Argue that the only way out is to redefine "Historical Jesus" as "The Jesus who was historically effective." This absorbs the "authentic" data into the "memory" data. If a saying functioned as Jesus' voice in 50 CE, it is historically Jesus, regardless of whether he spoke it in 30 CE.

  **The Diagnostic Thesis:**
  "The impasse in Historical Jesus research is not a methodological failure but a category error. The field is attempting to use forensic tools (Criteria of Authenticity) to solve a mnemonic problem (Social Identity). Progress will not come from refining the criteria, but from acknowledging that the 'Historical Jesus' is not an object to be found, but a narrative function to be analyzed."

  This approach avoids the survey trap, addresses the theological undercurrents without reducing them to confession, and offers a structural explanation for why the debate persists despite the "death" of the criteria. It treats the impasse itself as the primary data.
