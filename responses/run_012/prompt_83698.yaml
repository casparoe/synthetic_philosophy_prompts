      *   **Constraints:** No survey of criteria, no list of "who said what." Focus on the *structure* of the disagreement.

  2.  **Deconstruct the Impasse:**
      *   *The Traditional View (Old Quest/Third Quest legacy):* Assumes a distinction between Jesus and the early church. Goal: Peel back layers to find the "ipsissima vox" or "ipsissima verba." Tools: Criteria of Authenticity. Ontology: Gospels are biographical/historical sources containing mixed data (authentic + inauthentic).
      *   *The Memory/Social View (Fourth Quest/Memory Approach):* Assumes Jesus is inaccessible apart from his reception. Goal: Understand how Jesus was remembered and why. Tools: Memory theory, social identity. Ontology: Gospels are artifacts of memory; the "historical Jesus" is a modern construct distinct from the "remembered Jesus."
      *   *The Theological Undercurrent:* Protestant liberalism (Jesus vs. Dogma) vs. Post-critical/Orthodox (Unity of Christ/History) vs. Secular/Skeptical (Myth/Construction).

  3.  **Test the User's Hypothesis:**
      *   *Hypothesis:* The rift is about the *object* (Gospels as testimony to sift vs. Gospels as social memory).
      *   *Validation:* This holds up well. The "Criteria" camp treats the text as a container holding distinct historical atoms. The "Memory" camp treats the text as a holistic performance of identity.
      *   *Nuance:* It's not just about the Gospels; it's about the *nature of history* itself (positivist vs. interpretive).

  4.  **Structure the Disagreement (The "Deep Grammar"):**
      *   I need to move beyond "Method A vs. Method B" to "Epistemology A vs. Epistemology B."
      *   *Axis 1: Epistemology of History.* (Reconstructionism vs. Representationism).
