prompt: |-
  I spent most of last night arguing with a friend about whether things persist by being wholly present at each moment or by having temporal parts, and we kept talking past each other because we were each smuggling in separate assumptions about tense, and about whether persistence is even one phenomenon rather than several. I want to build a diagnostic decision tree that sorts people into the actual positions in the metaphysics of persistence, so that the next round of the argument starts from a shared map instead of from labels. Make each internal node a question a person can answer without already knowing the name of the view it leads to — for instance whether a thing existing at two times is numerically one thing or two things standing in a relation, whether time is tensed, whether there are temporal parts, whether an object is just the sum of its parts or something further, and whether persisting picks out anything over and above our describing the world with sortal terms — and let the leaves carry the names of the positions, both the familiar ones and the ones that exist mainly to handle awkward cases. Build the tree from the logical space first and the names second, and use these cases to force the distinctions: the statue and the lump of clay, a person who divides like an amoeba, and a machine destroyed and later rebuilt to the last atom. Tell me which pairs of leaves the tree genuinely cannot separate, and which combinations of answers nobody occupies, and for each empty slot say whether that is because the view is incoherent, merely unattractive, or simply unclaimed. Write it as continuous prose, no headings, no bullet points, no bold, no tables, the way you would lay it out in a long email. Finally, tell me where your map is most likely to be wrong and what argument or consideration would make you redraw it.
