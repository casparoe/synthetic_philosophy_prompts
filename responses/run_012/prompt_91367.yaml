answer: |-
  I understand the frustration of arguing past one another when the underlying metaphysical commitments are misaligned, so I have constructed a diagnostic decision tree designed to sort interlocutors into their actual positions based on intuitive judgments rather than technical labels. The goal is to navigate the logical space of persistence by asking questions that do not presuppose knowledge of views like endurantism or perdurantism, but instead probe the structural commitments regarding time, identity, and composition. We begin at the root with the most fundamental distinction regarding the nature of objects over time. The first question asks whether an object that exists at Tuesday noon and again at Wednesday noon is numerically one and the same whole entity at both times, or whether the Tuesday entity and the Wednesday entity are distinct parts linked by a relation of genetic or causal continuity. If you answer that it is the same whole entity wholly present at both times, you move down the endurance branch, but if you answer that they are distinct temporal parts of a larger whole, you move down the perdurance branch. This initial split forces a commitment on whether persistence involves identity over time or merely similarity and causal connection between distinct existents.

  Once that primary division is established, the tree branches again based on the ontology of time itself, using the case of the machine destroyed and later rebuilt to the last atom to test the limits of existence. The question here is whether the future and the past exist in the same sense that the present exists, or whether only the present moment is real. If you believe only the present is real, you are directed toward presentism, which creates tension for the perdurance branch since temporal parts located in non-existent times become problematic, whereas if you believe the past and future are just as real as the present, you are directed toward eternalism, which comfortably accommodates temporal parts as existing coordinates in a block universe. For the endurantist, this question determines whether being wholly present means being wholly present at every time slice of the block or wholly present only at the moving now. Following this, we introduce the case of the statue and the lump of clay to test the principle of coincidence. The question asks whether two distinct things can occupy the exact same spatial region at the exact same time. If you say yes, allowing that the statue and the lump are numerically distinct despite sharing all their matter and location, you accept coincidence, which typically leads to pluralist views. If you say no, insisting that identity is determined by spatiotemporal location and material composition alone, you are forced into monism, where the statue just is the lump, or into a view that denies the existence of one of the relata entirely.

  The next node uses the case of the person who divides like an amoeba to probe the necessity of uniqueness in survival. The question is whether survival requires that there be one and only one future individual who is you, or whether you can survive as both branches if your psychological or physical continuity is preserved in both. Answering that survival requires uniqueness forces a choice between denying survival in fission cases or adopting a view where identity is not what matters, while answering that you can survive as both suggests a conception of personhood that is compatible with branching identity or a shift away from strict identity toward psychological continuity relations. Finally, we return to the rebuilt machine to ask about gappy existence. The question is whether an object can cease to exist completely and then come back into existence later while remaining the same object. If you say yes, you allow for intermittent existence, which requires a robust notion of thisness or haecceity that survives non-existence, but if you say no, you commit to the view that existence is continuous and any break destroys the original object permanently, requiring the rebuilt machine to be a duplicate rather than the original.

  Having traced these paths, we can now attach the standard names to the leaves of the tree. The path accepting whole presence, eternalism, coincidence, uniqueness, and no gappy existence leads to Classical Endurantism. The path accepting temporal parts, eternalism, and viewing the object as the sum of those parts leads to Perdurantism or the Worm View. If one accepts temporal parts but claims we refer only to the momentary stages rather than the whole sum, one lands on Stage Theory or Exdurantism. Denying coincidence while accepting whole presence often leads to Constituent Ontology or Monism regarding the statue and clay. Denying the existence of composite objects entirely in favor of only simple particles leads to Nihilism, which dissolves the persistence problem by denying persisting objects exist at all. Accepting branching survival often leads to Parfitian Reductionism or Psychological Continuity views that abandon strict identity. Accepting gappy existence leads to views involving Haecceities or Intermittent Endurantism. Accepting relative identity, where identity is only meaningful relative to a sortal concept, leads to Relative Identity Theory, which can allow the statue to be the same lump but not the same statue.

  There are pairs of leaves that this tree genuinely cannot separate because the differences between them are semantic rather than metaphysical. Specifically, the tree struggles to distinguish between certain versions of Stage Theory and Perdurantism because both accept temporal parts and eternalism, and the disagreement often reduces to whether the word person refers to the momentary stage or the extended worm, which may not entail a difference in ontological commitment about what exists. Similarly, the tree may fail to separate Deflationism about Persistence from Nihilism in practice, because if persistence is merely a linguistic convention without deep metaphysical grounding, the denial of robust persisting objects looks functionally identical to denying objects exist altogether. Another difficult pair is Relative Identity and Conventionalism, as both deny absolute identity conditions, and without a clear metric for what constitutes a real sortal versus a useful description, the positions collapse into one another within the scope of these questions.

  There are also combinations of answers that nobody occupies, and the reasons for these empty slots vary. The combination of Presentism and Perdurantism is generally considered incoherent because perdurance requires past and future parts to exist to compose the whole, which contradicts the presentist claim that only the present exists. Some have tried to formulate Presentist Perdurantism by treating past parts as abstract entities, but this is widely rejected as losing the material commitment required for persistence, so that slot is empty due to incoherence. The combination of Endurantism and Universalism about composition is rarely occupied because if any sum of parts exists, it becomes difficult to explain why some sums endure as unified objects while others do not, making the view unattractive rather than strictly incoherent, though some mereological universalists do attempt to hold it. The combination of accepting gappy existence while denying haecceities is empty because without a thisness that persists through the gap, there is no ground for the identity of the object before and after the gap, rendering the view incoherent. Finally, the slot for a view that accepts fission without branching identity and without psychological reductionism is unclaimed, as it requires explaining how one thing becomes two without changing the definition of identity or survival, which seems logically impossible.

  Finally, I must admit where this map is most likely to be wrong and what would make me redraw it. The map assumes that identity is the primary relation to be analyzed, but it is increasingly argued that grounding or ontological dependence is more fundamental than identity. If persistence is not about identity over time but about how temporal facts ground atemporal facts, then the initial question about numerical identity is a category mistake, and the entire tree would need to be rebuilt around grounding relations rather than identity conditions. Additionally, the map treats time as a uniform background, but if time is emergent from quantum entanglement or causal relations, the questions about eternalism versus presentism may be ill-posed, requiring a new root question about the fundamentality of time itself. If future physics suggests that temporal ordering is not absolute, the distinction between temporal parts and wholly present objects might dissolve, forcing a redraw that prioritizes causal structure over temporal location. Until those shifts occur, however, this tree should suffice to locate where you and your friend are actually standing in the logical space.
