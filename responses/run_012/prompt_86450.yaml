      *   *Recommendation:* The cleanest cut for the user is to deny that Psychological Continuity *constitutes* Identity (modifying 3 or 6). Since the user wants to keep (5), they must claim Hot-Swap preserves Identity (via continuity) while Blueprint does not (due to branching). This requires rejecting (6).

