answer: |-
  1. **Degrees of Power**
  Your account treats dispositions as causal powers grounded in intrinsic properties. In ordinary language, we say one glass is more fragile than another, implying degrees. On your view, can an object possess a power only partially, or is having the power a binary matter? If it's binary, what does "partly disposed" mean without appealing to the likelihood of the manifestation?

  *Follow-up:* You'll likely say the power is binary and the degree lies in the conditions or the magnitude of the effect. But if the power itself doesn't vary, doesn't that make the disposition ascription misleading whenever we talk about varying strengths?

  2. **The Identification Problem**
  You individuate powers by their manifestation type together with the intrinsic conditions for exercise. What makes a specific power the power to produce *this* manifestation rather than *that* one? Can you describe the identity of the power without covertly reintroducing conditionals about what the object would do under specific circumstances?

  *Follow-up:* If you insist the power's nature is primitive and not defined by conditionals, how do we ever confirm we've identified the right power rather than just labeling our ignorance of the conditional regularities?

  3. **Power versus Base**
  You distinguish the power from the intrinsic properties that ground it. Is the power something over and above the categorical base, or is it just the base considered in a certain light? If it's distinct, what work is the power doing that the base isn't already doing?

  *Follow-up:* If you say the power is distinct but never exists without the base, aren't you committed to a metaphysical duplication that adds complexity without changing the physical description of the object?

  4. **The Molecule Case**
  Consider a molecule whose active site is open when the substrate is absent, but which, on binding the substrate, changes shape in a way that occludes the site so the reaction never occurs. Nothing is destroyed and no intrinsic property is lost; the very event that would have been the stimulus is what prevents the manifestation. Is that a fink, a mask, or neither, and how do you decide without appealing to what would happen?

  *Follow-up:* If you classify this as a masking case because the intrinsic conditions aren't met during the stimulus, doesn't that make the condition for exercise dependent on the stimulus not triggering the mask, which sounds suspiciously like a counterfactual constraint?

  5. **The Fink/Mask Distinction**
  Critics argue that distinguishing a finkish case from a masking case requires knowing whether the object *would* lose the power or merely fail to exercise it. Since you reject counterfactuals as truthmakers, how do you draw this distinction at all? Is it a metaphysical difference rather than a modal one?

  *Follow-up:* If the distinction is purely metaphysical, what empirical or conceptual access do we have to it? If we can't tell the difference without looking at what would happen, does the distinction do any work in your theory?

  6. **The Problem of Mimics**
  Imagine a system that reliably produces the manifestation whenever stimulated but lacks the causal power you describe—perhaps it's driven by an external field we can't detect. What in your account rules out this mimic, given that you've given up the conditional analysis that would normally distinguish the real power from the reliable regularity?

  *Follow-up:* If the mimic and the powered object are observationally identical in all possible tests, does asserting the existence of the power in one but not the other amount to positing an undetectable difference?

  7. **Probabilistic Powers**
  Your view seems to fit deterministic causation well, but quantum mechanics suggests some manifestations are probabilistic. Can a power be indeterministic, such that the intrinsic conditions are met but the manifestation might still fail without any masking? If so, how do you individuate a power that doesn't guarantee its effect?

  *Follow-up:* If the power doesn't guarantee the effect, and you can't use counterfactuals to fix the probability, doesn't the power become indistinguishable from a bare propensity with no intrinsic grounding?

  8. **The Regress of Conditions**
  You state that powers are individuated by intrinsic enabling conditions. If those enabling conditions are themselves powers, where does the regress stop? If they are categorical properties, what work is the word "intrinsic" doing beyond saying "non-relational"?

  *Follow-up:* If you claim the regress stops at fundamental categorical properties, how do you know you've reached the bottom rather than just encountering a power too complex for us to analyze further?

  9. **Falsifiability and Masking**
  What observation would show that the power is absent rather than masked or permanently unexercised? If every failure can be explained away as a case where the enabling conditions weren't quite met, isn't your account immune to empirical refutation?

  *Follow-up:* If nothing could show the power is absent, do you take the cost of that to be a loss of empirical content, or do you see that immunity as a virtue of metaphysical necessity?

  10. **Equivalence and Theoretical Cost**
  Let's suppose a philosopher proposes a reformed conditional analysis that adjusts its clauses to match your verdicts on finks, masks, and mimics exactly. Does your view agree with this reformed analysis on every possible case? If it does, what turns on the difference between them, and why should we prefer the ontology of powers over the simpler conditional account?

  *Follow-up:* If the only difference is that your view posits an unobservable power to explain what the conditional analysis describes without it, isn't the power merely a placeholder for the very modal facts you claim to ground?
