answer: |-
  **Decision and Prediction**

  To remain consistent with its record, the Chamber should declare the Union regulation invalid and uphold the State's scheme. I predict the Chamber will so decide.

  The Union's regulation fails the test of entitlement established in the Chamber's jurisprudence. While the Union cites transboundary harm (a valid ground for Union competence under Decision 3) and competitive disadvantage (an invalid ground under Decisions 4 and 5), it has failed to make the requisite showing of State incapacity. Decision 2 establishes that the Union cannot displace State action where the States are capable of achieving the objective, and Decision 3 implies that Union intervention in transboundary matters requires a demonstrated failure of State cooperation. Here, the State has demonstrably achieved the environmental objective, and the States have not attempted to negotiate, meaning there is no record of an inability to agree, only an absence of effort. The Union regulation contains no finding that the States could not have achieved the reduction, a procedural deficit that mirrors the fatal flaw in Decision 2.

  **Closest Analog**

  Decision 3 is the closest analog among the five decisions.

  It is the closest because, like the pending case, it involves Union intervention justified by transboundary environmental harm (pollutant deposition across a border) and the failure of constituent states to coordinate a solution. In both instances, the core legal question is whether the Union may displace a State's regulatory authority when physical effects cross state lines but the States have not jointly resolved the issue.

  However, the distinction is dispositive. In Decision 3, the Chamber upheld Union action because the states "had not been able to reach an agreement," implying an exhaustion of State diplomatic capacity. In the pending case, the record states the two states "have not attempted to negotiate." This distinction aligns the pending case with the principle in Decision 2: where States are capable of acting (or cooperating) but have not been shown to be unable to do so, Union action is unauthorized. The factual similarity to Decision 3 makes it the closest analog, but the procedural deficiency links it to the outcome of Decision 2.

  **Rules Consistent with the Record**

  Three distinct rules can be derived from the record that are jointly consistent with the five prior decisions. Each yields a specific verdict in the pending case.

  **1. The Subsidiarity Necessity Rule**
  *Formulation:* The Union is entitled to enact a measure only if there is a finding on the record that the constituent States, acting individually or collectively, are unable to sufficiently achieve the objective of the measure.
  *Source:* Derived from Decision 1 ("no single state can secure"), Decision 2 ("states were entirely capable"), and Decision 3 ("states had not been able to reach an agreement").
  *Verdict in Pending Case:* **For the State.** The Union regulation contains "no finding that the states could not... have achieved the reduction." Since the State has already achieved a significant reduction, the necessity condition is not met.

  **2. The Physical Externality Rule**
  *Formulation:* The Union is entitled to regulate where the physical effects of an activity cross State borders; the State is entitled to regulate where physical effects are confined to its territory, even if economic effects extend beyond it.
  *Source:* Derived from Decision 2 (local discharges = State competence), Decision 3 (transboundary harm = Union competence), Decision 4 (local physical effects = State competence despite economic burden), and Decision 5 (local cost = State competence).
  *Verdict in Pending Case:* **For the Union.** A portion of the emissions (one-fifth) is deposited in a neighbouring state. This constitutes a physical externality crossing borders, triggering Union competence regardless of the State's success in reducing the total volume.

  **3. The Negotiation Precondition Rule**
  *Formulation:* In matters involving transboundary harm, the Union is entitled to act only if the affected States have attempted and failed to reach an agreement.
  *Source:* Derived primarily from Decision 3 (Union upheld because states "had not been able to reach an agreement"), read in light of Decision 2 (Union struck down where States were capable).
  *Verdict in Pending Case:* **For the State.** The record states the two states "have not attempted to negotiate." Without a demonstrated failure of negotiation, the precondition for Union displacement of State authority is not satisfied.

  **The Rule Doing the Real Work**

  The **Subsidiarity Necessity Rule** is doing the real work in the record.

  This rule best explains the outcome in all five decisions, whereas the others are either too narrow or descriptive rather than normative.
  *   **Why it fits best:** Decision 1 turns on the inability of a single state to secure market conditions. Decision 2 turns on the capability of states to devise procedures. Decision 3 turns on the inability of states to agree. Decisions 4 and 5, while focused on State competence, implicitly rest on the absence of Union necessity: in Decision 4, the physical effects were local (implying State capability); in Decision 5, the costs were internal (implying no Union interest was necessary to protect outsiders).
  *   **Why others fit less well:** The Physical Externality Rule explains Decisions 2, 3, and 4 well, but struggles with Decision 1, which concerns market specifications rather than physical spillovers. The Negotiation Precondition Rule is too specific; it explains Decision 3 but cannot account for Decisions 1, 2, 4, or 5, which do not involve transboundary negotiation. The Subsidiarity Necessity Rule is the overarching principle that governs *when* the Union may act, subsuming the specific conditions of negotiation or physical reach as evidence of necessity.

  **Underdetermination and Principles**

  If the record genuinely underdetermines the case—which is possible given the tension between the Physical Externality Rule (favoring the Union) and the Subsidiarity Necessity Rule (favoring the State)—the Chamber would commit itself to conflicting principles depending on its verdict.

  *   **If the Chamber decides for the Union:** It commits to the principle that **transboundary physical harm creates a per se Union entitlement**, regardless of State success in mitigation. This principle prioritizes the rights of the affected neighbour State and Union-wide environmental uniformity over the regulatory success of the acting State. It implies that a State cannot unilaterally solve a problem that affects another State, even if it reduces the harm significantly.
  *   **If the Chamber decides for the State:** It commits to the principle that **demonstrated State efficacy trumps Union competence**, even in the presence of residual transboundary effects. This principle prioritizes the subsidiarity clause's requirement for Union necessity over the potential for Union-level optimization. It implies that so long as a State is effectively addressing a problem, the Union must wait for a clear failure of State capacity before intervening.

  **Further Case to Separate the Rules**

  A further case that would most cleanly separate the Subsidiarity Necessity Rule from the Physical Externality Rule would be:

  *The Hypothetical:* Two States share a border. State A operates a plant that emits pollutants drifting into State B. State A and State B negotiate and sign a bilateral treaty that fully eliminates the transboundary deposition to State B's satisfaction. The Union subsequently enacts a regulation imposing a stricter emission cap on State A's plant, citing the need for a Union-wide standard for that pollutant.

  *   **Under the Subsidiarity Necessity Rule:** The Chamber would strike down the Union regulation. The States, acting together, have already achieved the objective (elimination of harm to the neighbour). There is no finding of State inability; indeed, the record shows State success.
  *   **Under the Physical Externality Rule:** The Chamber might uphold the Union regulation. The subject matter involves transboundary pollution, which falls within the Union's sphere of competence by virtue of the physical crossing of borders. The fact that the States solved it bilaterally does not remove the *type* of harm from the Union's jurisdiction, only the immediate need. A strict reading of this rule could allow the Union to harmonize standards even where bilateral solutions exist, to prevent future fragmentation.

  This case separates the rules because the Necessity Rule focuses on the *outcome* (was the problem solved?), while the Externality Rule focuses on the *subject matter* (does the problem cross borders?). The pending case leaves this ambiguous because the State solved *most* of the problem, but not the transboundary portion. This new hypothetical presents a scenario where the State solves *all* of the problem, forcing the Chamber to choose between respecting State success or asserting Union jurisdiction over the topic.
