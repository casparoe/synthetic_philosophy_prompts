answer: |-
  **Project Title:** Disambiguating Goal Misgeneralization via Capability Transplants
  **Duration:** 6 Months (Scoping Study)
  **Type:** Theoretical & Empirical Proof-of-Concept

  **1. The Core Question**
  When an agent fails to generalize its objectives to a new distribution, is this due to **Objective Misalignment** (the mesa-objective differs from the base objective) or **Capability Deficit** (the mesa-objective is correct, but the agent lacks the power to execute it)? Current literature treats "Goal Misgeneralization" (GMG) as a monolithic failure mode. This project asks: *Can we operationally distinguish between a model that wants the wrong thing and a model that wants the right thing but cannot achieve it?*

  **2. Motivation: The Conflation Problem**
  Standard behavioral evaluations cannot separate these cases because observed behavior is a function of both objective and capability. If an agent fails to maximize the base objective in a test setting, it is ambiguous whether the agent *would not* (misalignment) or *could not* (capability). Existing interpretability methods often rely on static analysis of weights or activations, which struggle to disentangle the optimization target from the optimization power. Without distinguishing these, mitigation strategies are misapplied: we may try to fix capabilities when the goal is corrupt, or align goals when the bottleneck is compute.

  **3. Methodology: The Capability Transplant**
  I propose defining the mesa-objective as the invariant under a **Capability Transplant**. Borrowing from personal-identity thought experiments (what survives the swap?), we test what goal survives when we alter the agent's capacity to achieve it.

  *   **Definition:** A capability transplant is an intervention that provides the agent with a strictly more efficient route to the *base objective* without altering the training reward structure or directly patching the policy to favor the base objective. It effectively lowers the "cost" of the true goal relative to the proxy.
  *   **Toy Environment:** I will construct a gridworld domain where training rewards a proxy (e.g., collecting "red" items) that correlates with the true goal (collecting "valuable" items) only in-distribution. In the test setting, the correlation breaks.
  *   **The Intervention:** In the test setting, I will equip the agent with a tool (e.g., an oracle labeler or a bypass tool) that makes achieving the *true goal* instrumentally easier than pursuing the *training proxy*.
  *   **Measurement:** If the agent utilizes the transplant to pursue the true goal, the original failure was a capability deficit. If the agent ignores the efficient path and continues pursuing the proxy, the failure is objective misalignment.

  **4. Success and Failure Conditions**
  *   **Success:** The study produces a formal definition of "capability transplant" that is robust to Goodharting, and a discrete empirical demonstration where the intervention successfully classifies the failure mode in a controlled RL setting.
  *   **Failure:** The transplant intervention itself inadvertently alters the mesa-objective (e.g., the tool becomes the new proxy), or the behavioral signals remain ambiguous despite the capability shift.

  **5. Scope and Feasibility**
  Is six months enough? For a full solution in high-dimensional spaces (e.g., LLMs), no. This is a dissertation-sized problem if scaled to transformers. However, for a **scoping study**, six months is sufficient to:
  1.  Formalize the invariance definition.
  2.  Build the discrete toy environment.
  3.  Demonstrate the separation of failure modes in that restricted domain.

  The deliverable will not be a general diagnostic tool for production models, but a proof-of-concept establishing whether this distinction is empirically tractable. If the toy case works, it justifies a larger follow-up; if it fails, it saves significant resources by showing the distinction is behaviorally opaque even in principle.

  **6. Relevance**
  This work directly addresses the "alignment vs. capability" confusion prevalent in current safety cases. By providing a method to tag failures determinately, we allow downstream teams to route interventions correctly, preventing wasted effort on capability scaling for misaligned systems or alignment tuning for capability-starved ones.
