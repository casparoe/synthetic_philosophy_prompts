  The wheels stop turning on the pavement stone,
  The desert lies behind us, dry and dead,
  I stand upon the edge of town alone.

  The journey ends, the words were clearly said,
  To pay upon arrival was the pact,
  But now the threat of thirst is fully fed.

  Why pay a debt when nothing can be gained,
  The service rendered, fixed beyond recall,
  By keeping cash, no future is restrained.

  No argument can make the distance small,
  I wish my mind were duller, blind to skill,
  For dullness pays the debt without a fall.

  But I am sharp, and possess the will
  To see the trap where disposition fails,
  And cannot buy the virtue I lack still.

  The driver turns, his steady eye prevails,
  He scans my face to see just what I am,
  I know my word is light as desert gales.

  He says: "I judge the promise by the man,"
  I know my word was worth the sand beneath—

  ***

  **Note on Liberties:**
  I have not misdescribed the case; the tension between causal rationality and dispositional virtue is central to Parfit's example. However, the poem takes two liberties. First, it compresses the timeline: the philosophical weight of the Hitchhiker case lies in the *prior* disposition that secures the ride, whereas the poem focuses on the *post-ride* regret of that disposition's absence. Second, regarding the form: breaking the terza rima to leave the final rhyme unpaid is indeed a neat device, but I have employed it because the prompt requested the form itself do the arguing; the missing sound enacts the unpaid debt, making the structural failure the moral conclusion.
