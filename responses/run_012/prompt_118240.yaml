answer: |-
  ### Instructor's Working Notes & Brainstorming

  **The Trap:** Students conflate "different values" with "different ontology."
  *   *Weak Relativism:* "They value kinship more than efficiency." (Easy counter: Efficiency is universal.)
  *   *Strong Relativism:* "The category 'public office' does not exist here. You cannot misuse what you do not have." This is the anthropological challenge. It's not that they break the rule; it's that the rulebook is for a different game.
  *   *Weak Universalism:* "Bribery is sin." (Easy counter: It's not a bribe, it's a gift.)
  *   *Strong Universalism:* "Institutions have functional teleologies. If you undermine the telos, you corrupt the thing, regardless of local normativity."

  **The Three Concepts:**
  1.  **Transactional (Quid-pro-quo):** Fails here. presupposes a Weberian bureaucracy (public/private split). If the officer sees no split, this definition is colonial imposition. Students must see this distinction.
  2.  **Republican (Civic Virtue):** Focuses on the health of the *res publica*. Does kinship patronage erode the common good? Yes, but requires a theory of what the "common" is. Is the common good social stability (kinship works) or impartial justice (kinship fails)?
  3.  **Institutional (Lessig-style):** Focuses on *purpose*. Is the purpose of the Education Office to deliver texts or to reinforce social bonds? If the former, it's corruption. If the latter, it's function. The battleground is who defines purpose. The donor? The locals? The philosopher?

  **The Verdict Requirement:**
  If I let them say "It depends on the framework," they win by dodging. I need to force them to argue that one framework is *correct* or *more applicable* to the facts. The best argument is that once a state accepts donor funding and creates an "Education Office," it implicitly adopts the institutional purpose of education, making the kinship diversion corrupt *within that specific institutional context*, even if socially virtuous elsewhere.

  **Drafting Strategy:**
  Make the question demand a "Yes/No" on the fact of corruption, not just an analysis. The model answer must take a side (I'll argue "Yes, Institutional Corruption") to show them how to commit.

  ***

  ### Final Exam Question: Ethics & Development Seminar

  **Question 4: The Ontology of Corruption**

  **Vignette:**
  In a provincial district, Education Officer Mr. K awards a textbook contract to his cousin's firm. No money changes hands privately; however, the contract fulfills an ongoing obligation of mutual support between their lineages. The textbooks arrive on time and meet specifications. A donor-country audit flags this as corruption (nepotism/misuse of public office). Mr. K's neighbours commend him (fulfilling kinship duty/social stability).

  **Prompt:**
  Is there a fact of the matter as to whether Mr. K's conduct was corrupt? You must commit to a verdict: **Yes** or **No**.

  In defending your verdict, you must distinguish between three distinct concepts of corruption:
  1.  **Transactional:** The misuse of public office for private gain.
  2.  **Republican:** The erosion of civic virtue and the common good.
  3.  **Institutional:** Conduct that undermines the specific purpose of an institution, regardless of legality or local norms.

  Do not simply list these definitions. You must argue which concept applies to this case and why. Specifically, address the strongest anthropological challenge: that calling this "corruption" is not a moral judgment but a category error (i.e., that "public office" does not exist in this context). Your conclusion must rest on a defended claim about what determines the *purpose* of the Education Office.

  ***

  ### Model Answer (Instructor's Version)

  **Verdict:** Yes, there is a fact of the matter: Mr. K's conduct was corrupt.

  To reach this verdict, we must discard the Transactional definition. The audit's claim that this is "misuse of public office for private gain" presupposes a Weberian separation of public and private spheres that may not exist in Mr. K's social ontology. If Mr. K views himself as a lineage head first and a bureaucrat second, there is no "public office" to misuse. To insist otherwise is not moral reasoning but conceptual imperialism. The anthropological challenge holds here: you cannot violate a boundary that the actors do not recognize. Therefore, if corruption exists here, it cannot rest on the violation of a public/private split.

  The Republican definition offers more traction but remains insufficient. Republican corruption concerns the rotting of the polity's civic virtue. One might argue that kinship obligations *are* the civic virtue of this community, making Mr. K a model citizen. To call this corrupt requires asserting that the "common good" implies impartiality rather than social cohesion. While likely true in a modern state, this begs the question of whether this polity *is* a modern state or a network of lineages. Relying solely on republican virtue leaves us stuck in a contest of competing cultural ideals.

  The decisive framework is Institutional Corruption. This account does not rely on the actor's intent or the local moral climate, but on the functional teleology of the institution itself. An Education Office is not a lineage network; it is a mechanism designed to deliver educational resources based on pedagogical need, not kinship obligation. Even if the textbooks arrived on time, the *basis* of the decision shifted from educational efficacy to social obligation. This creates a dependency that undermines the institution's purpose over time. Next time, the cousin's texts may be inferior, but the obligation remains.

  The strongest counter-argument is that the institution's purpose is defined locally. If the community views the Office as a resource hub for lineage support, Mr. K is fulfilling its purpose. However, this ignores the specific nature of the institution Mr. K inhabits. He is not operating a community school; he is operating a node in a state system funded by donors and tasked with national education. By accepting the role within a state bureaucracy, he implicitly accepts the institutional purpose inherent to that bureaucracy: impartial distribution of public goods.

  Therefore, the fact of corruption is determined by the mismatch between the *institution's functional purpose* (education delivery) and the *logic of action* employed (kinship reciprocity). It is not corrupt because it violates Western values; it is corrupt because it substitutes one logic (social) for another (educational) within an institution designed for the latter. The anthropological challenge fails because institutions have functional realities independent of local normativity. A bridge built to hold cars but used only for pedestrian祭祀 (sacrifice) is structurally corrupted, even if the locals value the sacrifice. Mr. K has turned an education office into a kinship hub. That is a factual claim about institutional function, not a moral preference. Thus, it is corruption.

  ***

  ### Marking Scheme (Total: 25 Points)

  **1. Distinguishing Transactional vs. Ontological Challenge (5 points)**
  *   *Full marks:* Explicitly notes that the transactional definition fails if the public/private split is ontologically absent.
  *   *Common blow-up:* Students treat the anthropological challenge as just "different values" rather than a category error.

  **2. Engagement with Republican Virtue (5 points)**
  *   *Full marks:* Identifies that republican corruption requires a substantive account of the "common good" which is contested here.
  *   *Common blow-up:* Students assume "civic virtue" automatically means "impartiality" without arguing why.

  **3. Deployment of Institutional Corruption (5 points)**
  *   *Full marks:* Correctly identifies that this framework relies on institutional *purpose* rather than legality or intent.
  *   *Common blow-up:* Students confuse this with the transactional model (focusing on the gain) rather than the systemic undermining.

  **4. Defending the "Purpose" of the Institution (5 points)**
  *   *Full marks:* Argues *who* gets to define the purpose (e.g., the state role vs. local context) and takes a stand.
  *   *Common blow-up:* Students say "the purpose is contested" and stop there, refusing to judge which purpose dominates.

  **5. Commitment to Verdict (5 points)**
  *   *Full marks:* Clear Yes/No stated at start and maintained. Argument supports the verdict consistently.
  *   *Common blow-up:* The "It depends on your framework" conclusion. This is an automatic cap at 3/5 for this criterion.

  ***

  ### Grading Tells: B vs. A

  **B Answer Tells:**
  *   Uses phrases like "From a Western perspective..." vs. "From a local perspective..." without bridging them.
  *   Treats the three concepts as a checklist to be described rather than tools to be wielded.
  *   Concludes that corruption is "socially constructed" and therefore no fact of the matter exists.

  **A Answer Distinction:**
  *   An A answer recognizes that "socially constructed" does not mean "arbitrary." It argues that once an institution exists, its functional constraints create objective facts about what counts as corruption, regardless of local sentiment. It forces the frameworks to fight rather than letting them coexist.
