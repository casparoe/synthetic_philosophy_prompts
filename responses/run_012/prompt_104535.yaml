answer: |-
  Dear Colleague,

  It was a pleasure to hear you sketch out the identification-gap thesis in seminar, and I have been turning it over in my mind since then. It is a provocative position, essentially a metaphysical strengthening of the usual underdetermination arguments, and it deserves serious scrutiny. You asked for honesty about what would count against it, so I will lay out the challenges as I see them, ranging from what I consider fatal inconsistencies to merely awkward consequences, and I will address your worries about unfalsifiability and collapse.

  The most devastating challenge, the one I would rank as fatal if not carefully navigated, is the epistemic paradox inherent in positing the inaccessible facts themselves. Your thesis claims that there are facts which settle the ontology but are in principle inaccessible to any observer. The problem is that you are claiming to know something about these facts namely, that they exist and that they perform the metaphysical work of settling the ontology. If you can know that they exist and what their function is, then they are not fully inaccessible in the way your thesis requires. You seem to have accessed enough of their nature to categorize them as ontology-settlers, which suggests a breach in the very gap you are trying to defend. A committed defender might try to say this is a transcendental argument, that we must presuppose such facts to make sense of realism, but this risks turning the thesis into a Kantian noumenal claim that admits we can say nothing positive about the thing-in-itself. If you cannot specify how these facts differ from one another without referencing accessible consequences, you cannot claim they settle anything specific. This is not just a verificationist worry; it is a coherence worry about how you can refer to these facts without collapsing the gap.

  Slightly less fatal but still serious is the problem of triviality or unfalsifiability. You asked if the view risks becoming unfalsifiable, and I think the honest answer is yes. If the claim is that for any system, the ontology is underdetermined by accessible information, this becomes a modal claim that is incredibly difficult to test. To falsify it, one would need to demonstrate a system where accessible information necessarily fixes the ontology. If you defend against every such attempt by saying the fixing facts are still inaccessible, you immunize the view against counterexample. Is this a problem? For a metaphysical view, some degree of insulation from empirical falsification is expected, but if the view is insulated from conceptual falsification as well, it ceases to be a substantive claim about the world and becomes a stance or an attitude. A substantive metaphysical thesis should carve reality at some joints; if the identification-gap thesis applies universally and necessarily without exception, it risks saying nothing more than that reality is deeper than our access, which is a platitude rather than a theory. A rival view, let's call it Ontological Convergence Realism, would predict that there are limit cases where ideal reasoning on accessible data does converge on a unique ontology. Your view predicts permanent divergence. If we ever found a case where the structure of the data logically necessitated a single metaphysical interpretation, your view would be false.

  This leads to the question of cases where accessible information might determine ontology, which brings us to the third tier of objections, those that are serious but perhaps manageable depending on how you define your terms. If your thesis is that for any system you like the gap exists, then mathematical or logical systems might serve as counterexamples. In a formal system, the accessible information the axioms and derivation rules often completely determines the ontology of the structures that satisfy them. If you restrict your thesis to physical or empirical systems, you avoid this, but then you owe an explanation of why physical systems are special in this regard. Why does the physical world harbor inaccessible ontology-settlers while the mathematical world does not? If you cannot draw that line cleanly, the universal quantifier in your thesis is refuted by the existence of formal systems where map and territory are identical. A committed defender of your view would likely have to concede that the thesis does not apply to abstracta, limiting its scope to concrete reality, but this concession weakens the generality of the claim.

  There is also the risk of collapse into instrumentalism or verificationism, which you mentioned worrying about. I think this is a real risk, not a cheap shot, but it depends on how much work you expect the inaccessible facts to do. If these facts make no difference to any possible observation, prediction, or interaction, then they are causally inert. In modern metaphysics, positing causally inert entities is often viewed with suspicion because it violates principles of parsimony and causal exclusion. If the inaccessible facts do nothing, why are they there? If they do something, even if only to settle which ontology is true, that settling must have some metaphysical weight. But if that weight never manifests in the accessible realm, the distinction between your view and instrumentalism becomes purely verbal. An instrumentalist says we should only care about the probabilities; you say there is a hidden structure settling them, but we can never know which one. Practically, this amounts to the same thing. To avoid this collapse, you need to argue that truth matters independently of access, which is a standard realist move, but you must explain why we should care about a truth that is hermetically sealed off from us. A rival view would predict that ontology matters because it explains the accessible data; your view says ontology matters but explains nothing that the data doesn't already show.

  Regarding what would have to be true for your view to be false, it would require the existence of at least one domain where the accessible information is rich enough to logically entail a unique ontological structure. This might happen in a universe where the laws of nature are simple and unique, or where the connection between phenomenon and noumenon is transparent by necessity. If it turned out that conditional probabilities could only be generated by one specific type of hidden structure due to logical constraints, your thesis would fail. For example, if information theory proved that a certain probability distribution is isomorphic to only one causal graph, then the accessible information would determine the ontology. You would have to argue that even then, there is a further fact about the graph that remains hidden, but at that point, you are positing hidden facts about hidden facts, which begins to look like an infinite regress of inaccessible layers.

  As for which defeaters a committed defender would concede versus dismiss, I suspect you would dismiss the verificationist challenge as begging the question against realism. You would likely say that truth is not constituted by verification, so the fact that we cannot access the ontology-settlers does not mean they are meaningless. That is a standard and defensible realist line. However, I think you would have to concede the force of the epistemic paradox I mentioned first. If you cannot explain how you know about the inaccessible facts without accessing them, you undermine your own authority to propose the thesis. You might also have to concede the mathematical counterexamples unless you are willing to claim that even mathematical structures have hidden ontological layers, which seems untenable. The unfalsifiability charge is one you might try to reframe as a feature rather than a bug, arguing that metaphysical truths are not empirically testable, but you must accept that this limits the dialectical power of your view in a scientific context.

  In summary, the identification-gap thesis is a bold attempt to secure a robust realism in the face of underdetermination, but it walks a tightrope between coherence and emptiness. The fatal risk is claiming knowledge of the unknowable; the serious risk is that the view becomes indistinguishable from instrumentalism in practice; and the awkward risk is that it fails to apply to non-physical systems, limiting its scope. For the view to succeed, you need a story about how we can refer to these inaccessible facts without accessing them, and you need to show why positing them adds explanatory value rather than just metaphysical bulk. If you can manage that, you have a interesting form of structural realism; if not, you may find yourself defending a gap that swallows the bridge you built to cross it. I hope this helps as you refine the argument, and I look forward to seeing how you respond to these challenges in the next session.

  Best regards,

  A Colleague
