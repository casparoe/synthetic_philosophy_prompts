answer: |-
  ### The Demarcation Topology: A Decision Tree for Chronological Disputes

  As a philosopher of science, I treat this not as a debate about *dates*, but about the *rules of the game* used to assign them. Fomenko's New Chronology is not merely a rival historical theory; it is a stress test for the epistemology of history. To map where you and your brother actually disagree, we must bypass the specific claims (e.g., "Was Jesus crucified in 1053 AD?") and examine the structural commitments required to believe them.

  Below is a decision tree constructed from the logical space of historiographical error. It contains eight branch nodes (questions) and eight terminal leaves (positions). The questions are phrased neutrally so your brother can answer them without feeling he is conceding to "mainstream" authority.

  #### The Decision Tree

  **Node 1: The Demarcation Criterion**
  *Is there a principled methodological difference between reliable and unreliable historical inquiry, distinct from whether we like their conclusions?*
  *   **YES** → Go to Node 2.
  *   **NO** → Go to Node 5.

  **Node 2: The Priority of Evidence**
  *When physical dating methods (dendrochronology, stratigraphy) conflict with textual interpretation, must the text yield?*
  *   **YES** → Go to Node 3.
  *   **NO** → Go to Node 4.

  **Node 3: The Status of Absence**
  *Does the lack of archaeological corroboration for a claimed global empire count as evidence that the empire did not exist?*
  *   **YES** → Go to Node 7 (Critical Realist).
  *   **NO** → Go to Node 4.

  **Node 4: The Ad Hoc Rescue**
  *Is it permissible to explain away conflicting data by positing a systematic forgery or conspiracy without independent proof of that forgery?*
  *   **YES** → Go to Node 6.
  *   **NO** → **Leaf A: Methodological Falsificationist.**

  **Node 5: The Nature of Consensus**
  *Is the agreement of professional historians primarily a result of convergent evidence or of shared institutional training and gatekeeping?*
  *   **Convergent Evidence** → **Leaf B: Institutional Conservative.**
  *   **Gatekeeping/Power** → Go to Node 8.

  **Node 6: The Locus of Malice**
  *If the chronology is fabricated, is the error due to innocent cumulative bias or a coordinated effort to deceive?*
  *   **Innocent Bias** → **Leaf C: Revisionist Skeptic.**
  *   **Coordinated Deception** → Go to Node 9.

  **Node 7: The Reflexivity Test**
  *Is the standard chronology itself subject to the same methodological scrutiny as the rival claim?*
  *   **YES** → **Leaf D: Critical Realist.**
  *   **NO** → **Leaf E: Dogmatic Mainstreamer.**

  **Node 8: The Sociological Turn**
  *Is the label "pseudohistory" an epistemic judgment about truth-tracking or a sociological boundary marker?*
  *   **Epistemic** → **Leaf F: Epistemic Relativist.**
  *   **Sociological** → **Leaf G: Sociological Demarcationist.**

  **Node 9: The Inversion**
  *Does the mainstream community fail the methodological criteria (Node 1) more severely than the challenger?*
  *   **YES** → **Leaf H: The Inversionist (Mainstream is Pseudohistory).**
  *   **NO** → **Leaf I: Conspiracy Realist.**

  ***

  #### The Leaves: Positions and Awkward Commitments

  **Leaf A: Methodological Falsificationist**
  *Commitment:* Must accept that some historical truths may be permanently lost because the evidence required to falsify bad theories no longer exists.

  **Leaf B: Institutional Conservative**
  *Commitment:* Must defend the current consensus even if specific historical narratives are later proven wrong, trusting the institution over the data.

  **Leaf C: Revisionist Skeptic**
  *Commitment:* Must argue that centuries of scholars were incompetent or biased without proving they were lying, which undermines trust in all expertise.

  **Leaf D: Critical Realist**
  *Commitment:* Must acknowledge that while the mainstream is broadly reliable, it is fallible and potentially vulnerable to genuine falsification by new data.

  **Leaf E: Dogmatic Mainstreamer**
  *Commitment:* Must claim that mainstream methods are immune to the skepticism applied to rivals, treating consensus as infallible.

  **Leaf F: Epistemic Relativist**
  *Commitment:* Must admit there is no rational way to prefer the standard chronology over Fomenko's, only a preference for one "language game" over another.

  **Leaf G: Sociological Demarcationist**
  *Commitment:* Must accept that the distinction between history and pseudohistory is genuine but purely sociological rather than epistemic, based on community boundaries.

  **Leaf H: The Inversionist (Mainstream is Pseudohistory)**
  *Commitment:* Must believe that the entire global academic apparatus is less truth-tracking than a small group of outsiders, despite the lack of physical evidence for the conspiracy.

  **Leaf I: Conspiracy Realist**
  *Commitment:* Must posit a vast, silent coalition of historians, scientists, and clergy maintaining a lie for centuries without a single whistleblower producing the "real" archives.

  ***

  #### Analysis of the Logical Space

  **Unoccupied Combinations**
  1.  **The "Honest Conspiracy" (Node 6: Innocent Bias + Node 9: Coordinated Deception):** This combination is **incoherent**. One cannot claim the error is merely innocent cumulative bias while simultaneously arguing the maintenance of that error requires active, coordinated suppression of truth.
  2.  **The "Physicalist Textualist" (Node 2: Text Yield + Node 3: Absence is Cover-up):** This is **unattractive/unstable**. If one admits physical dating trumps text, one cannot logically argue that the *absence* of physical evidence is a cover-up; the absence is simply the null result predicted by the physical dating.
  3.  **The "Gatekeeping Realist" (Node 5: Gatekeeping + Leaf D: Critical Realist):** This is **unexplored**. It is rare to find someone who believes consensus is purely institutional power (Node 5) yet still maintains a Critical Realist stance that truth is accessible. Usually, believing consensus is power leads to Relativism (Leaf F) or Inversionism (Leaf H).

  **Indistinguishable Positions**
  *   **Leaf C (Revisionist Skeptic) and Leaf H (Inversionist):** This tree cannot fully separate these two in practice. Both reject the standard chronology. The distinction lies in the *attribution of intent* (bias vs. malice). However, since intent is unobservable, both positions often utilize the same evidence (anomalies, gaps) and result in the same practical rejection of mainstream history. Your brother may slide between these without noticing.
  *   **Leaf F (Epistemic Relativist) and Leaf G (Sociological Demarcationist):** Both deny an objective epistemic boundary. The difference is whether they think the sociological boundary is *useful* (G) or arbitrary (F). In conversation, both will sound like they are saying "Who are you to call it fake?"

  ***

  #### Diagnostic Note: Where Your Brother Lands

  Based on your description, your brother is almost certainly navigating a path through **Node 1 (YES)** → **Node 2 (NO)** → **Node 3 (NO)** → **Node 4 (YES)** → **Node 6 (Coordinated Deception)** → **Leaf H (The Inversionist)**.

  He likely believes there *is* a method (Node 1), but he believes the mainstream violates it by prioritizing texts/tradition over his reading of "patterns" (Node 2), and he interprets the lack of evidence for his view as proof of destruction (Node 3). Crucially, when you cite historians, he treats this as **Node 5 (Gatekeeping)** rather than evidence, which pushes him toward **Leaf H**. He does not see himself as a relativist (Leaf F); he believes he has found the *true* method, and the mainstream is the pseudoscience.

  **What Might Move Him?**
  Argumentation on specific facts (e.g., "Here is a coin that proves X") will fail because he has already answered **Node 4 (Ad Hoc Rescue)** with "YES." He is permitted to explain away the coin as a later forgery or misdated.

  To move him, you must target **Node 2 (Priority of Evidence)** or **Node 7 (Reflexivity)**.
  1.  **The Reflexivity Trap:** Ask him to apply his own criteria to *his* sources. If the mainstream is accused of forging records, what independent verification exists for the records he uses? If he claims "mathematical analysis" of texts proves his view, ask if that method has successfully predicted *new* archaeological finds that were later verified. (Fomenko's methods generally reinterpret old data rather than predict new data).
  2.  **The Cost of the Cover-up:** Press **Node 9**. For the mainstream to be the "real pseudohistory," the conspiracy must include not just historians, but astronomers, geologists, dendrochronologists, and Islamic/Chinese/Byzantine scholars across centuries. Ask him to sketch the *mechanism* of this coordination without relying on "they all benefit from the lie."

  If he cannot answer how the conspiracy is mechanically possible without leaking, he is forced to retreat from **Leaf H** to **Leaf C (Revisionist Skeptic)**. This is a victory: it moves him from "It's a lie" to "Historians are biased," which is a debatable historical claim rather than an unfalsifiable conspiracy theory.
