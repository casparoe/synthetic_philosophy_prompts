answer: |-
  Here is the procedure you asked for. It is designed to be printed on a single sheet of paper and kept in your binder. It translates the Gibbard–Satterthwaite (G-S) theorem from abstract math into a parliamentary triage tool.

  ### The Parliamentarian's Gibbard–Satterthwaite Checklist

  **Purpose:** To determine if a proposed voting method eliminates strategic voting (manipulation) or merely swaps one type of strategy for another.
  **Core Truth:** If this checklist ends at Step 4, **no voting method can do what the motion claims.** You are not choosing between "manipulable" and "perfect." You are choosing between "manipulable in way A" and "manipulable in way B."

  #### Step 1: The "Three-Option" Test
  **Question:** Are there three or more *viable* outcomes (candidates or amendments) that could realistically win?
  *   **How to check:** Look at the ballot. Ignore write-ins unless they have historically won. Ignore candidates with <5% support in prior cycles.
  *   **Math Fact:** If there are only 2 viable options, G-S does not apply. Simple majority is strategy-proof.
  *   **Judgment Call:** Defining "viable." If you have 5 candidates but only 2 are serious, G-S might not bite. If 3 are serious, it does.
  *   **Dealbreaker:** If **YES** (3+ viable options), proceed to Step 2. If **NO**, stop. The proposal is mathematically safe from G-S constraints (though other issues may exist).

  #### Step 2: The "One-Dimensional" Test (Domain Restriction)
  **Question:** Is the decision fundamentally about a single spectrum where everyone agrees on what "more" and "less" mean? (e.g., Budget amounts, tax rates).
  *   **How to check:** Ask: "Can every member's preference be plotted on a single left-to-right line?"
  *   **Math Fact:** If preferences are **Single-Peaked** (everyone has one favorite point on the line and likes options less as they move away from it), G-S does not apply. The Median Voter Theorem holds.
  *   **Judgment Call:** Determining if the issue is truly 1D. Board elections are *never* 1D (candidates differ on multiple issues). Bylaw amendments are rarely 1D (you can prefer A to B and C to A in a cycle).
  *   **Dealbreaker:** If **NO** (Preferences are complex/multi-dimensional), proceed to Step 3. If **YES**, stop. G-S does not apply; you can have a strategy-proof method (usually median-based).

  #### Step 3: The "Dictator" Test
  **Question:** Does the proposed method give any single member the power to dictate the result regardless of others?
  *   **How to check:** Read the bylaws. Does one person have veto power or double weight that guarantees their top choice wins?
  *   **Math Fact:** G-S assumes "Non-Dictatorial" systems. If the system *is* dictatorial, it is not manipulable (because the dictator doesn't need to strategize).
  *   **Judgment Call:** None. This is usually obvious in professional associations.
  *   **Dealbreaker:** If **NO** (It is democratic), proceed to Step 4. If **YES**, the method is undemocratic. Reject on principle, not math.

  #### Step 4: The Verdict (The "Pick Your Poison" Phase)
  **Status:** You have confirmed: 3+ Options + Complex Preferences + Democratic Process.
  **Math Fact:** **Manipulation is mathematically guaranteed.** There is no method that forces sincere voting in this scenario.
  **Your Task:** Do not ask "Is this manipulable?" (The answer is Yes). Ask: **"What kind of manipulation does this encourage, and do we prefer it to our current problems?"**
  *   **Plurality:** Encourages "Lesser of Two Evils" (vote splitting).
  *   **Ranked/Condorcet:** Encourages "Burying" (ranking a strong opponent last to stop them).
  *   **Approval:** Encourages "Threshold Gaming" (approving only your top choice to avoid helping your second choice beat your first).
  *   **Borda:** Encourages "Order Manipulation" (ranking a weak candidate high to hurt a strong rival).

  ---

  ### Running the Procedure on Your Cases

  Here is the checklist applied to the three scenarios you provided. I have flagged where I am making a judgment call on your behalf.

  #### Case 1: Motion to Replace Plurality with Approval Voting (Board Election)
  *   **Step 1 (3+ Options):** **YES.** Board elections typically have 3+ viable candidates. [JUDGMENT: Assuming your elections are contested by more than 2 serious members].
  *   **Step 2 (1D Spectrum):** **NO.** Board candidates represent different platforms, regions, or specialties. Preferences are not single-peaked.
  *   **Step 3 (Dictator):** **NO.** It is a democratic election.
  *   **Step 4 (Verdict):** **Manipulation is Guaranteed.**
      *   **Analysis:** Approval voting solves *vote-splitting* (the complaint you hear), but it does not solve *strategy*. Under G-S, members will still lie. Instead of ranking honestly, they will calculate a "cutoff." (e.g., "I like Candidate B, but if I approve them, they might beat Candidate A, whom I like more. So I will only approve A.")
      *   **Recommendation:** You cannot tell the members "This stops strategic voting." That is false. You *can* tell them: "This trades vote-splitting for threshold strategy. If we care more about stopping vote-splitting than stopping threshold strategy, this is a valid trade."
      *   **Outcome:** Motion is viable, but the justification must change from "no more gaming" to "different kind of gaming."

  #### Case 2: Motion to Use Borda Count (Bylaw Amendments)
  *   **Step 1 (3+ Options):** **YES.** Bylaw meetings often have a main motion plus multiple amendments.
  *   **Step 2 (1D Spectrum):** **NO.** Amendments can be mutually incompatible in complex ways (e.g., Amend A changes section 1, Amend B changes section 2, Amend C changes both).
  *   **Step 3 (Dictator):** **NO.**
  *   **Step 4 (Verdict):** **Manipulation is Guaranteed (High Risk).**
      *   **Analysis:** Borda is notoriously vulnerable to "burying." If I know Amendment X is my top choice, but Amendment Y is the biggest threat, I can rank Y last (even if I actually like Y second) to lower its score.
      *   **The "Condorcet" Reality Check (Your Preferred Method):** You mentioned you prefer a Pairwise/Condorcet method. Let's run the checklist on *that* right now, because the result is the same.
          *   3+ Options? **YES.**
          *   1D Spectrum? **NO.**
          *   Dictator? **NO.**
          *   **Verdict:** **Manipulation is Guaranteed.** Condorcet methods are vulnerable to "cloning" (adding a similar candidate to split the vote) and strategic ordering (ranking a strong rival lower than your true preference to ensure they lose the pairwise comparison).
      *   **Recommendation:** This is the "bad news" case. You cannot justify Condorcet over Borda or Plurality on the grounds of "preventing manipulation." They are all manipulable. Condorcet is harder to count and harder for members to understand, offering no mathematical immunity to strategy.
      *   **Outcome:** If you move to adopt Condorcet, you must admit to the floor: *"This method does not eliminate strategic voting. It eliminates vote-splitting, but introduces complexity and new strategic vulnerabilities. We are choosing it for its fairness properties, not its immunity to gaming."*

  #### Case 3: Budget-Prioritization Committee (1D Spectrum)
  *   **Step 1 (3+ Options):** **YES.** Multiple budget items.
  *   **Step 2 (1D Spectrum):** **YES.** You stated items fall on a "spend more vs. spend less" line and members agree on the ordering.
  *   **Step 3 (Dictator):** **NO.**
  *   **Step 4 (Verdict):** **G-S Does Not Apply.**
      *   **Analysis:** Because preferences are **Single-Peaked** (everyone agrees on the dimension, they just want different amounts), the Gibbard–Satterthwaite conditions are not met. The Median Voter Theorem applies here.
      *   **Recommendation:** Stop worrying about voting method theory. Use a method that finds the median (e.g., successive voting on amounts from low to high). Strategic voting is minimized naturally by the structure of the preference, not the voting rule.
      *   **Outcome:** Proceed. This is the one area where you can actually reduce manipulation through structure.

  ---

  ### What This Procedure Cannot Do (The Hidden Risks)

  You asked for honesty about where this checklist fails. Here are the four blind spots you need to manage personally.

  **1. It Measures Existence, Not Difficulty [JUDGMENT CALL]**
  G-S proves manipulation is *possible*, not that it is *easy*.
  *   **The Risk:** A Condorcet method might be manipulable in theory, but the math required to game it is so hard that no member will bother. Plurality strategy is easy ("Don't vote for the guy who can't win").
  *   **Your Burden:** You must decide if "hard to game" is good enough. The checklist says "Yes, it's gameable." You have to decide if that matters if only a mathematician could exploit it.

  **2. It Ignores "Computational Complexity"**
  *   **The Risk:** Some methods (like certain Condorcet variants) are hard to count by hand. If your election software fails or the tellers make a mistake, the legitimacy of the election collapses.
  *   **Your Burden:** The checklist treats all methods as abstract math. You must weigh "mathematical elegance" against "administrative robustness." A simple, slightly flawed system is better than a perfect system that breaks during the count.

  **3. It Assumes Rational Actors**
  *   **The Risk:** G-S assumes voters are cold strategists. In professional associations, members often vote sincerely out of habit or ethics.
  *   **Your Burden:** If your culture values sincerity, a method that *rewards* strategy (like Borda) might corrode trust, even if the strategy is theoretically available in all systems. The checklist doesn't measure cultural damage.

  **4. It Pushes the "Fairness" Choice Onto You**
  *   **The Risk:** The checklist ends at "Pick Your Poison." It does not tell you *which* poison is less toxic.
  *   **Your Burden:** You have to decide: Is vote-splitting (Plurality) worse than threshold gaming (Approval) or burying (Borda/Condorcet)? The math cannot answer this. It is a political value judgment. When you stand up to speak, do not hide behind the theorem. Say: *"The math tells us perfection is impossible. The Board must decide which flaw is most acceptable for this association."*

  ### Summary for the Chair
  When the motion comes up:
  1.  Run Step 1 & 2.
  2.  If both are **YES/NO** (3+ options, complex preferences), state clearly: **"Strategic voting is mathematically inevitable under any system."**
  3.  Shift the debate from "Which system stops lying?" to "Which system handles lying better?"
  4.  If it's the Budget (Case 3), tell them the math allows for a cleaner solution.

  This protects you from promising a fix that doesn't exist, and it forces the members to own the trade-off.
