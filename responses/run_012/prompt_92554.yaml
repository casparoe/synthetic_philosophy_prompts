  65%

  ### Decomposition

  1.  **$P(\text{Causal Steps}) = 80\%$**
      *   **Justification:** Empirical tracing shows CoT tokens usually encode intermediate computation state rather than pure post-hoc narration, though some rationalization occurs.
  2.  **$P(\text{PRM Fidelity}) = 50\%$**
      *   **Justification:** Without formal verification, PRMs inevitably overfit to human-preferred phrasing and style rather than latent logical validity.
  3.  **$P(\text{Load-Bearing}) = 60\%$**
      *   **Justification:** Models can generate true but irrelevant statements; a PRM must distinguish logical necessity from plausible filler to guide optimization.
  4.  **$P(\text{Non-Artifact Gain}) = 70\%$**
      *   **Justification:** Dense rewards shape the loss landscape geometry for better convergence, not just providing more update steps per trajectory.
  5.  **$P(\text{OOD Transfer}) = 65\%$**
      *   **Justification:** Regularizing the reasoning path prevents in-distribution shortcut learning, which is the primary mechanism of OOD failure.

  ### Combination Logic
  I treat these as weighted confidence factors rather than strict multiplicative conditions, as partial success in each dimension still yields a net advantage. The average of these probabilities (65%) represents the likelihood that the aggregate signal quality is sufficient to outperform sparse outcome rewards on OOD tasks. The high confidence in causality (80%) and non-artifact gain (70%) anchors the belief, while the low confidence in PRM fidelity (50%) caps the ceiling, preventing a higher credence.

  ### Sensitivity Analysis
  **Most Sensitive Term:** $P(\text{PRM Fidelity})$ (50%).
  This is the bottleneck. If the PRM grades "looks correct" instead of "is correct," it reinforces sycophancy and style over substance, destroying the OOD advantage. If this probability rises to 80% (e.g., via automated verification), my overall credence jumps to 85%. If it drops to 20% (pure vibe-checking), the advantage vanishes entirely.

  **Evidence to Move It:**
  Training PRMs on **programmatic traces** (e.g., code execution states, formal proof states) versus **natural language human labels**. If PRMs trained on formally verifiable intermediate states show significantly higher OOD transfer than those trained on human-labeled natural language steps, it confirms fidelity is the limiting factor and validates the process supervision approach. If both perform identically, the advantage is likely just signal density artifacts.
