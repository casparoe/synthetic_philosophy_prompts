answer: |-
  To you and your board, the tension you feel is between Chesterton's Fence—the idea that you should not remove a fence until you know why it was put up—and the reality of bureaucratic inertia. Your friend is correct that appealing to unknown history can paralyze progress, but you are also correct that institutional memory often encodes safety checks that are not immediately obvious. The sharper principle you need is this: the burden of proof shifts depending on whether the original reason is recoverable. If the archive reveals a reason that is now obsolete, the rule must go; if the reason is lost, the rule stays only if it demonstrates current utility that outweighs its cost.

  Your complete archive is your greatest asset here, because it allows you to distinguish between wisdom and accident. In the case of the budget approval, the archive tells you the rule was a temporary workaround for a specific person; since that person and the problem are gone, the caution against removal is irrelevant. For the founding rules where the record is silent, you must treat the rules as hypotheses: does circulating minutes to every household actually prevent disputes, or does it just consume paper? Does signing out a key actually reduce liability, or is it theater? If the cost of compliance is high and the current benefit is unclear, the presumption should flip from "keep until proven harmful" to "discard until proven useful."

  Finally, you must guard against the abuse of tradition, which occurs when history is used to avoid present accountability. A genuine appeal to caution will always articulate a specific risk that exists *now*, such as liability or member dissent, whereas a pretextual appeal will rely solely on the age of the rule or the status of its author. Use your next meeting to test each rule against current conditions rather than past intentions. If a defender cannot describe the harm that would occur this year if the rule were dropped, the rule is likely a candidate for removal.

