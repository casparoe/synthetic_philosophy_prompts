answer: |-
  The counting-house smelt of beeswax and old linen. Elias Harte sat behind the ledger, a crown piece turning over his knuckles like a worry-stone. Across from him, Thomas Cope stood by the hearth, a sheaf of papers tucked under his arm like a prayer book.

  "It is a ticket, Elias," Cope said, tapping the air. "Nothing more. A counter to record that labour has been done. Why must the counter be dug from the earth before the work can begin?"

  Harte caught the coin with a sharp click. "Because the earth does not lie. This silver was dug, melted, and stamped. It holds the value of the labour already spent. Your paper promises labour yet to come. That is not accounting, Thomas. That is prophecy."

  "It is circulation," Cope corrected, stepping closer. "You hoard this silver. It sleeps in your chest while men beg for work in the Liberties. If I issue a ticket against the land's future produce, the weaver spins, the baker bakes. Less money swiftly circulating is equivalent to more money sitting still. Berkeley asks it plainly."

  "Berkeley asks questions. He does not balance books." Harte stood, leaning on the desk. "You speak of stirring industry. I speak of settlement. When the week is done, the labourer wants bread. The baker wants silver. He does not want your ticket unless he believes he can pass it on. And if the belief fails?"

  "Then the bank stands behind it."

  "The bank is air!" Harte's voice cracked against the wood panelling. "It is a room and a few clerks. If the tickets multiply beyond the silver to redeem them, you have not created wealth. You have diluted the truth. When the rush comes to redeem, and the vault is bare, who stands in the loss? Not you. Not the directors. It is the widow who took the paper for her husband's wage."

  Cope flushed, but held his ground. "I have endorsed the scheme, Elias. My own credit is bound to it. If it fails, I am ruined as surely as any widow."

  "Your ruin is abstract. You have a living and a parish. Hers is hunger." Harte walked around the desk, picking up a bill of exchange from the pile. "Look at this. I accept this bill because I know the man who drew it. I know his father, his house, his honour. Credit is character, Thomas. It is neighbours vouching for neighbours. Your bank replaces character with calculation. It makes credit a commodity to be traded by strangers."

  "It makes credit available to those without neighbours!" Cope countered. "The absentee landlords drain this kingdom. They sit in London and spend our rents there. Your silver follows them. My tickets stay here. They force the wealth to remain in Ireland."

  "And when the tickets trade at a discount? When a shilling of paper buys only sixpence of meat because the market smells fear?" Harte stopped inches from him. "You say the ticket is a pledge. But a pledge requires a pawn. If the pawn is the nation's future, and the future sours—harvest fails, linen rots—who pays the debt?"

  Cope looked down at the papers in his hand. The confidence wavered, just for a moment. "We manage the risk. We adjust the issue."

  "You adjust the truth." Harte lowered his voice, heavy and final. "When I lend silver, I lend myself. If I am ruined, I am ruined. But when you issue a ticket, you lend nothing. You invite the public to trust a phantom. If the phantom vanishes, the loss falls on those least able to bear it. You talk of employing the poor, but you make them the surety for your experiment. Is it right to build a hospital on a foundation that might collapse and crush the patients?"

  Cope opened his mouth, then closed it. He looked at the crown piece still warm in Harte's palm, then at the dark windows where the city moaned. He knew the risk. He had signed his name to the proposal that morning. If the bank broke, his clerical standing would go with it. He was gambling his soul on a sum he could not solve.

  "If we do nothing," Cope said softly, "the patients die anyway."

  Harte turned back to the ledger, dipping his pen. The ink looked black as blood in the candlelight.

  "Then tell me, Thomas," the merchant said, without looking up. "When the ticket fails, and the mob comes for the gold that isn't there, will you stand between them and the vault? Or will you tell them it was merely a counter?"
