  Rain streaked the office window, blurring the gray sky above the factory. Elias sat behind the mahogany desk, the leather chair creaking softly as he leaned forward. The engineer placed the manila folder down, his hands trembling slightly against the wood. Dust motes danced in the overhead light.

  "This upgrade increases production by twenty percent," the engineer said. "As a side effect, it releases arsenic into the town water."

  Elias didn't look up from the pen. The gold nib hovered over the signature line. "I don't care about the town water. I just want the production."

  He signed the page. The ink scratched loudly in the silence. He slid the folder back. The upgrade began immediately. Downstream, the water turned bitter.

  Rain streaked the office window, blurring the gray sky above the factory. Elias sat behind the mahogany desk, the leather chair creaking softly as he leaned forward. The engineer placed the manila folder down, his hands trembling slightly against the wood. Dust motes danced in the overhead light.

  "This upgrade increases production by twenty percent," the engineer said. "As a side effect, it removes arsenic from the town water."

  Elias didn't look up from the pen. The gold nib hovered over the signature line. "I don't care about the town water. I just want the production."

  He signed the page. The ink scratched loudly in the silence. He slid the folder back. The upgrade began immediately. Downstream, the water turned sweet.

  Later, two townspeople stood by the bank, watching the flow glide over the stones.

  "He knew what would happen," the first said, lighting a cigarette against the wind.

  "He said he didn't care," the second replied, leaning heavily on the rusted railing.

  "He knew."

  The first kicked the mud, sending clods into the stream. "When it was poison, everyone said he did it on purpose."

  "And now?"

  "Now the water's clean. Same words, same signature." The second watched the clear stream ripple against the stones. "Nobody says he helped. They say it was an accident."

  The first flicked the cigarette into the water. "So did he save us on purpose?"
