answer: |-
  You have identified a real and significant structural vulnerability in argumentation, auditing, and debate. You are correct that it is distinct from the Motte-and-Bailey (no retreat), the Gish Gallop (volume vs. depth), or standard bullshit (indifference to truth).

  There is no single, universally canonical term for this specific move, but it is recognized under different names in different fields. Here is the breakdown of the existing vocabulary, the closest conceptual matches, and a proposed coinage to unify them.

  ### 1. The Existing Vocabulary (Fragmented)

  **In Mathematics & Computer Science: "Proof by Intimidation"**
  This is the closest established term. Coined (apocryphally or not) to describe proofs that are so dense, jargon-heavy, or computationally expensive that the audience assumes they must be correct because checking them is too hard. However, this usually implies the *math* is hard. Your observation covers *bureaucratic* hardness (footnotes, caveats, tangential details), which is slightly different.

  **In Law & Compliance: "Discovery Abuse" or "Document Dumping"**
  In litigation, one party may overwhelm the other with terabytes of marginally relevant data. The goal isn't to hide the data (it's all produced), but to make the *cost of finding the smoking gun* higher than the opponent's budget. This matches your code review and legal examples perfectly.

  **In Economics & Political Science: "Inducing Rational Ignorance"**
  This describes the *state* of the judge, not the move of the arguer. If the cost of acquiring information (verifying your claim) exceeds the expected benefit of having that information, a rational agent remains ignorant. Your arguer is strategically manipulating the cost-benefit analysis to force the judge into rational ignorance.

  **In AI Safety (Debate Protocols): "Exploiting the Judge's Horizon"**
  In the specific literature you are reading (likely Paul Christiano's "AI Safety via Debate"), this is discussed as a failure mode where the debater forces the discussion down a "deep tree." The judge has a fixed context window (token limit) or attention span. If one branch of the argument requires 100 steps to verify, and the judge can only see 10, the debater wins by default on that branch.

  ### 2. A Proposed Coinage: "Epistemic Rent-Seeking"

  Since no single term captures the *optimization of verification cost* across these domains, I propose **Epistemic Rent-Seeking**.

  *   **Definition:** A rhetorical strategy where an arguer protects a claim not by increasing its truth-value, but by inflating the *transaction cost* of verification, thereby extracting a concession (the judge's assent) via toll-collection on the truth.
  *   **Why "Rent-Seeking"?** In economics, rent-seeking is when an entity increases its own wealth without creating new wealth, often by manipulating the social or political environment (e.g., lobbying for regulations that hurt competitors). Here, the arguer increases their rhetorical standing without increasing the claim's quality, by manipulating the epistemic environment (the verification process).
  *   **Why "Epistemic"?** It concerns knowledge and justification.

  **Alternative (more descriptive): "Verification Bloating"**
  If "Rent-Seeking" feels too abstract, **Verification Bloating** describes the mechanical act: adding valid but non-essential mass to a claim to increase its verification weight.

  ### 3. Distinguishing the Edges (True vs. Flawed)

  You asked for the line between "murk hiding a flaw" and "murk as admission price."

  *   **Case A: The Claim is False.**
      *   **Term:** **Obfuscation** or **Camouflage**.
      *   **Mechanism:** The complexity is a smokescreen. The chain of reasoning contains a subtle error, but the cost of finding it is prohibitive.
      *   **Moral Weight:** Deceptive.

  *   **Case B: The Claim is True.**
      *   **Term:** **Pedantic Shielding** or **Defensive Complexity**.
      *   **Mechanism:** The claim is robust, but stated in a way that requires high expertise or time to validate.
      *   **Moral Weight:** Protective, but potentially anti-social. It prioritizes the arguer's safety from criticism over the community's ability to learn.

  **The Unified Problem:** In both cases, the move decouples **Acceptance** from **Understanding**. The judge accepts the claim *because* they cannot understand it fully, not *although* they cannot understand it.

  ### 4. Is this just "Cheaper to Produce than Refute"?

  No. This is a crucial distinction you made.

  *   **Standard Asymmetry:** "Nonsense is easier to produce than refute." (Brandolini's Law). Here, the producer is *lazy* or *careless*.
  *   **Your Scenario:** The producer is *diligent* but *strategic*. They are spending effort to construct the wall. The production cost is actually high (writing four paragraphs of tangential detail takes work).
  *   **The Difference:** The asymmetry isn't between Production and Refutation. It is between **Verification** and **Judge's Budget**.
      *   Standard Asymmetry: Cost(Produce) < Cost(Refute).
      *   Your Asymmetry: Cost(Verify) > Budget(Judge).

  This is why it is more dangerous. You cannot solve it by telling the arguer to "be more careful," because they *are* being careful—they are carefully optimizing for your inability to check them.

  ### 5. Is the Problem the Arguer or the Budget?

  **The problem is the Budget (The Principal-Agent Problem).**

  This is fundamentally a **Principal-Agent Problem** with **Information Asymmetry**.
  *   **Principal:** The Judge (wants the truth).
  *   **Agent:** The Arguer (wants to win).
  *   **Asymmetry:** The Agent knows the true complexity of the claim; the Principal does not.

  If the judge has infinite budget, this tactic fails. If the judge has zero budget, everything fails. The tactic works only in the middle zone where the budget is *finite but plausible*.

  **Why this matters for solutions:**
  If you blame the arguer, you try to ban complexity. This hurts honest experts who genuinely need nuance.
  If you blame the budget, you change the *verification protocol*.

  **Mitigation Strategies (from AI Safety & Auditing):**
  1.  **Random Spot-Checking:** The judge doesn't verify the whole chain. They pick one random link in the 100-step chain and verify it deeply. If that link breaks, the whole argument fails. This makes the "costly chain" risky for the liar.
  2.  **Cross-Examination (Debate):** You don't use one judge. You use two opposing arguers. If one tries to build a Verification Wall, the other's incentive is to point out, "My opponent is burying the key claim in 50 pages of footnotes. You only need to check this one sentence." The *opponent* becomes the budget optimizer.
  3.  **Summary Liability:** Require the arguer to provide a "verifiable summary." If the summary is wrong, they lose, even if the details are right. This forces them to compress the truth without losing fidelity.

  ### Summary

  *   **Is there a name?** Not one universal one.
  *   **Closest existing terms:** "Proof by Intimidation" (math), "Discovery Abuse" (law), "Inducing Rational Ignorance" (economics).
  *   **Proposed Coinage:** **Epistemic Rent-Seeking** (the tactic) enabled by **Verification Asymmetry** (the structure).
  *   **The Edge:** It works equally well for true and false claims; the difference is *Obfuscation* (false) vs. *Pedantic Shielding* (true).
  *   **The Root Cause:** It is not a fallacy of logic, but a **failure of the verification protocol** relative to the judge's budget. The arguer is simply playing the game optimally; the game rules (budget limits) are what allow the exploit.

  You are describing the **Dark Pattern of Expertise**. It is the moment where rigor becomes a weapon against scrutiny.
