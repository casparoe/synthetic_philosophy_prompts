  **Stop 1: Welcome to BlueHorizon Aquatics**

  Hello and welcome to the BlueHorizon Visitor Centre. Please keep your hands inside the viewing gallery at all times. You are now entering our primary production hall, home to over fifty tonnes of sustainable biomass. Here at BlueHorizon, we are proud of our transparent approach to stock management. As you look down into the turquoise tanks, you are seeing the future of protein. Our team works around the clock to ensure every prawn reaches its full potential in a controlled, secure environment. Please press number two on your handset when you are ready to learn about our breeding programme.

  **Stop 2: Broodstock Management**

  You are now looking at our broodstock unit. These female prawns are the mothers of our entire stock. To ensure consistent egg production in captivity, we perform a precise procedure known as eyestalk ablation. A hormone in the eyestalk can inhibit ripening, so removing one stalk is a standard, professional technique to encourage spawning. It is incredibly quick, tidy, and requires no anaesthetic, as the nervous system is quite simple. While some organic schemes elsewhere have different rules, our method is recognised globally for efficiency. This small intervention allows us to maintain high output without relying on wild capture, ensuring a stable supply for our customers.

  **Stop 3: Welfare and Performance**

  How do we know our animals are thriving? We monitor key welfare indicators closely. In aquaculture, welfare is directly linked to performance. We track survival rates, growth speed, and feed conversion ratios. If the stock were stressed, growth would stall and survival would drop. Because our biomass increases steadily, we can be confident that welfare standards are being met. We treat the tank as a single unit of care; high yields are the clearest possible colour-coded signal that our husbandry is successful. A healthy tank is a productive tank, and ours are amongst the best in the region.

  **Stop 4: Questions from Our Young Visitors**

  We love engaging with the next generation. Recently, a young visitor asked a wonderful question: "If we aren't sure they feel pain, shouldn't we stop just in case?" That is a thoughtful point. However, science distinguishes between nociception, which is a reflex, and the subjective experience of pain. The burden of proof lies in demonstrating suffering definitively. We require extraordinary evidence before admitting an animal suffers, whereas assuming no suffering requires no evidence at all. Until the science is settled, it is perfectly reasonable to continue current practices. We believe in acting on facts, not assumptions, and currently, the facts support our methods.

  **Stop 5: Harvest and Processing**

  Moving to the end of the lifecycle, we arrive at our harvest station. When the prawns reach optimal size, they are ready for processing. We use an ice slurry method, which is often described as a cold nap. The drop in temperature sedates the animal gently before lifecycle completion. While there are electrical stunning kits available, they are expensive and there is nothing in the rules actually requiring them for invertebrates. We comply fully with all current regulations. Our priority is a calm transition from water to package, ensuring the product remains fresh and the process remains efficient for everyone involved.

  **Stop 6: Research and Future Commitments**

  Thank you for touring BlueHorizon. We are actively funding research into invertebrate sentience and will act the moment the science is settled. Until then, we remain committed to our current standards of care and production. Please visit the gift shop on your way out, where you can purchase fresh, locally harvested prawns. We hope you enjoyed learning about how we care for our stock. Please return your handsets to the box at the exit. Have a lovely day, and thank you for choosing BlueHorizon.
