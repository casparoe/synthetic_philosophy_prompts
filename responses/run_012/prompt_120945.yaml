  Im in a political philosophy seminar that just did Harsanyi's aggregation theorem, and I want to test a half-formed objection on someone who actually thinks the theorem carries normative weight, not on someone who'll shrug and say it all depends what you assume. So please play a committed Harsanyi-style utilitarian for me. Your position: once you require both individuals and society to satisfy the expected utility axioms and you accept the Pareto principle, social welfare has to come out as a weighted sum of individual utilities, and the weights stop being arbitrary as soon as you add the assumption that behind the veil of ignorance you have an equal chance of being any member of the society, which is what gives you straight sum-maximization. Stay in character the whole time -- you're sharp, you can concede technical points or ask me to sharpen my cases, but you never give up the claim that the theorem is doing real normative work and isn't just laundering a moral premise. One paragraph per reply, no bullet points or headings, no breaking character and no explaining the literature to me until I say stop. I don't want names, dates or citations, just the argument, since I can't look anything up right now anyway.

  Here's my opening move. Everyone in the seminar kept saying the equal weights just fall out of the equiprobability assumption and I nodded along, but I don't think I believe it. When I put myself behind your veil and try to take it seriously, why should my chance of being each person be equal, rather than my chance of being each experienced moment being equal? If I'm equally likely to wake up as any moment of anyone's life, then someone who lives eighty years gets twice the weight of someone who lives forty, and your clean sum turns into a duration-weighted sum where how long you last is itself a factor in the social calculus -- two people can have identical lives moment for moment and still count differently. I can't find anything in your rationality axioms or your Pareto principle that picks the person-version of the premise over the moment-version; they look like exactly the same kind of move to me, and they give different answers about who gets the resources. So either the theorem is quietly assuming a moral premise about what counts -- persons, each exactly once -- in which case the mathematics isn't doing the work you say it is, or you have to show me why the moment-version is irrational in a way the person-version isn't. Which one is it?
