prompt: |-
  Im building a seminar on interpretability and I keep going in circles on one thing: what would a theory of "this network state represents X" actually have to deliver before I should believe it? Write me the desiderata list — the phenomena any such theory has to explain, the cases it has to get right, the distinctions it can't collapse, the empirical facts it can't contradict — with the case or consideration behind each, and a call on which requirements are non-negotiable and which are just the taste of one camp.

  The cases I care about most, so make sure they're in there: two nets that compute the same function but with completely different internal geometry; a linear probe that decodes a variable almost perfectly from a layer versus an intervention on a direction that actually changes the output the way that variable predicts; a single polysemantic neuron that lights up for a dozen unrelated things; and a layer that happens to carry a variable (say a clock reading) the net was never asked to track. Is that last one a representation or just a correlation, and what does your list say about it? Also say whether the theory owes me an account of the format (vectors, relations, whatever) or only the content, and whether a representation has to be usable by the rest of the network or can just sit there.

  Then tell me which single requirement knocks out the most candidates, and whether any two of the requirements pull against each other so hard no theory can have both — thats the part I most want.

  Skip the name-by-name scorecard, I'll do that in class. Give it to me as a table: requirement | the case or consideration behind it | non-negotiable or camp-specific | what it would rule out. And don't just gesture at "representation is hard", I want the actual criteria.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** A theory of neural network representation (specifically, "this network state represents X").
      *   **Goal:** Create a desiderata list (criteria/requirements) for such a theory.
      *   **Format:** A table with columns: Requirement, Case/Consideration, Non-negotiable vs. Camp-specific, What it Rules Out.
      *   **Specific Cases to Include:**
          1.  Functionally equivalent nets with different internal geometry (isomorphism problem).
          2.  Linear probe success vs. Intervention success (correlation vs. causation).
          3.  Polysemantic neurons (one neuron, many concepts).
          4.  Incidental variables (e.g., a clock reading the net wasn't asked to track).
      *   **Specific Questions to Answer:**
          1.  Does the theory need to account for *format* or just *content*?
          2.  Does a representation need to be *usable* by the rest of the network?
          3.  Which single requirement knocks out the most candidates?
          4.  Are there two requirements that conflict so hard no theory can satisfy both?
      *   **Tone:** Rigorous, philosophical but grounded in ML practice, direct (no fluff).

  2.  **Deconstruct the Specific Cases & Questions:**

      *   *Case 1: Functional Equivalence, Different Geometry.* This touches on the "Multiple Realizability" problem. If Net A and Net B compute $f(x)$, but A uses a basis aligned with human concepts and B uses a rotated basis, do they both "represent" the concepts?
          *   *Implication:* A theory can't rely solely on specific activation patterns (localist view) without allowing for transformations.
      *   *Case 2: Probe vs. Intervention.* Probes find correlations; interventions test causal efficacy.
          *   *Implication:* Representation likely requires causal power, not just readoutability.
      *   *Case 3: Polysemanticity.* One neuron $\to$ many features.
          *   *Implication:* The unit of representation cannot be the single neuron. It must be subspaces or distributed patterns.
      *   *Case 4: Incidental Variables (The Clock).* The network encodes time, but wasn't trained to. Is this a representation?
          *   *Implication:* Distinguishing between *carrying information* (mutual information) and *representing for use* (functional role).
      *   *Format vs. Content:* Does the theory need to say *how* it's stored (vector direction? manifold?) or just *what*?
          *   *Decision:* A robust theory needs to specify format to distinguish from mere correlation.
      *   *Usability:* Can it be dormant?
          *   *Decision:* If it's not used downstream, is it a representation or just a bottleneck artifact? (Teleological vs. Causal role).

  3.  **Drafting the Desiderata (The Table):**

      *   *Req 1: Causal Efficacy.* (Addresses Probe vs. Intervention). If you change the state, does the behavior change as predicted?
      *   *Req 2: Multiple Realizability.* (Addresses Geometry). Must allow for rotation/isomorphism.
      *   *Req 3: Superposition/Polysemanticity.* (Addresses Polysemantic Neurons). Must handle distributed codes.
      *   *Req 4: Functional Role/Downstream Use.* (Addresses Usability & The Clock). Does the network *use* this info?
      *   *Req 5: Robustness/Stability.* (General). Does the representation hold across inputs?
      *   *Req 6: Format Specificity.* (Addresses Format question). Must define the vehicle.

      *Refining the "Non-negotiable vs. Camp-specific":*
      *   Causal Efficacy is becoming non-negotiable for mechanistic interpretability.
      *   Functional Role is debated (Teleosemantics vs. Causal Role).
      *   Format Specificity is often ignored by high-level theories but crucial for low-level.

  4.  **Addressing the "Clock" Case specifically:**
      *   Is it a representation? If the network doesn't *use* the clock to make decisions, a strict functionalist says "no." An information-theoreticist says "yes." The desiderata must force a choice here. I will lean towards "Usability" being the discriminator.

  5.  **Identifying the "Killer Constraint" and the "Conflict":**

      *   *Killer Constraint:* **Causal Efficacy (Interventionism).** Many theories (like pure probe-based or information bottleneck theories) fail here. They identify correlations, not mechanisms.
      *   *The Conflict:* **Multiple Realizability vs. Format Specificity.**
          *   If you demand the theory specify the *exact format* (e.g., "it must be a linear subspace"), you break Multiple Realizability (because an adversary can rotate the weights).
          *   If you demand strict Multiple Realizability (any geometry that computes the function counts), you lose the ability to specify a *format*, making the theory vacuous regarding *how* the representation is implemented.
          *   *Wait, a better conflict:* **Causal Efficacy vs. Incidental Correlations (The Clock).**
              *   If I require the network to *use* the representation (Functional Role), the Clock fails (it's not used).
              *   If I require only that the information is *present* (Informational), the Clock passes.
              *   *Actually, the prompt asks for two requirements that pull against each other so hard no theory can have both.*
              *   *Candidate:* **Invariance (Geometry)** vs. **Specificity (Mechanism).**
              *   *Better Candidate:* **Causal Isolation (Modularity)** vs. **Distributed Superposition.**
                  *   To say "State S represents X," we often want S to be isolatable (intervene on S, only X changes).
                  *   But in deep learning, representations are highly entangled (superposition). Intervening on "X" often breaks "Y".
                  *   *Refinement:* **Localizability** (we can point to the representation) vs. **Holism** (the representation is the whole state).
                  *   *Let's go with the "Clock" conflict:* **Informational Sufficiency** (it's there) vs. **Teleological Function** (it's used). You can't satisfy both for the Clock case. Either the Clock is a representation (Info) or it isn't (Teleo). A theory claiming both is contradictory.
                  *   *Wait, the prompt asks for requirements that pull against each other.*
                  *   *Idea:* **Interventional Specificity** (changing X changes *only* X-related outputs) vs. **Superposition** (variables are mixed).
                  *   *Idea:* **Format Agnosticism** (Multiple Realizability) vs. **Mechanistic Explanation** (needs specific format to explain *how*).
                  *   *Let's select:* **Causal Specificity** (Intervention on X affects only X) vs. **Distributed Density** (Polysemanticity/Superposition). In high-dimensional nets, clean causal cuts are often impossible. Demanding both kills all current architectures.

  6.  **Drafting the Content:**

      *   *Intro:* Acknowledge the depth of the question.
      *   *The Table:* Fill in the rows based on the thought process above. Ensure the specific cases (Clock, Probe, Poly, Geometry) are explicitly cited in the "Case" column.
      *   *The Analysis:*
          *   Format vs. Content: Must be both. Content without format is just semantics; format without content is just math.
          *   Usability: Non-negotiable for "representation" vs "artifact".
          *   Killer Constraint: Causal Efficacy (Intervention).
          *   The Conflict: **Causal Isolation** vs. **Superposition**. (This is the "Hard Problem" of MechInterp).

  7.  **Review against Constraints:**
      *   Table format? Yes.
      *   Specific cases included? Yes (Geometry, Probe/Intervention, Polysemantic, Clock).
      *   Format/Content question answered? Yes.
      *   Usability question answered? Yes.
      *   Killer constraint identified? Yes.
      *   Conflicting requirements identified? Yes.
      *   No name-by-name scorecard? Yes.

  8.  **Refining the "Clock" Answer:**
      *   The prompt asks: "Is that last one a representation or just a correlation, and what does your list say about it?"
      *   I need to take a stand in the analysis section. My stance: If it's not used downstream, it's a *trace*, not a *representation*. The "Usability" requirement rules it out.

  9.  **Refining the Conflict:**
      *   The conflict between **Multiple Realizability** (geometry doesn't matter) and **Mechanistic Specificity** (format matters) is strong.
      *   But the conflict between **Causal Purity** (intervene on X, only X changes) and **Superposition** (X and Y share dimensions) is more practical and devastating for current theories. I'll use that. It highlights the tension between our desire for clean "neurons for concepts" and the reality of high-dimensional compression.

  10. **Final Polish:** Check tone. Ensure it sounds like a seminar brief for someone who knows the field. Avoid hand-waving.

      *(Self-Correction during drafting)*: Make sure the "Non-negotiable" column distinguishes between what is logically required for *any* theory of representation vs. what is required for *mechanistic* interpretability specifically. I will frame it as "Non-negotiable for a causal theory" vs "Camp-specific (Informational vs Functional)".

      *(Refining the Conflict)*: The prompt asks for "whether any two of the requirements pull against each other so hard no theory can have both."
      If I choose "Causal Purity" and "Superposition", a theory *could* theoretically solve superposition (e.g., sparse autoencoders). So it's not impossible.
      What is truly incompatible?
      How about **Invariance to Re-parameterization** (Net A = Net B) vs. **Identifiability of Format** (We must point to the specific vector).
      If a theory says "Representation is the subspace," but the subspace can be rotated arbitrarily without changing function, can we identify *the* representation?
      Let's go with **Functional Equivalence** (Geometry doesn't matter) vs. **Causal Locality** (We must identify specific directions). If geometry doesn't matter, specific directions are arbitrary. If specific directions matter, geometry matters. This is the "Basis Problem."

      *Wait, let's look closer at the Prompt's "Clock" question.* "Is that last one a representation or just a correlation?"
      I need to answer this explicitly.
      My verdict: It is a correlation (an artifact) unless it is *used*.
      Requirement: **Downstream Utilization.**

      *Let's finalize the Conflict:*
      **Requirement A:** *Representation must be invariant to function-preserving transformations* (Multiple Realizability).
      **Requirement B:** *Representation must identify a specific causal mechanism/format* (Mechanistic Specificity).
      *Tension:* If I can rotate the weights and preserve function, the specific causal mechanism changes (different neurons fire), but the function stays the same. If the theory demands specific neurons/directions (B), it violates invariance (A). If it demands invariance (A), it cannot point to specific mechanisms (B). This is the "Basis Problem" in interpretability.

      *Wait, one more check:* The prompt asks "whether any two of the requirements pull against each other so hard no theory can have both".
      If I say "No theory can have both," I need to be sure.
      Actually, **Causal Efficacy** (Intervention works) and **Non-Disruption** (Intervention doesn't break the net) are often in tension due to superposition.
