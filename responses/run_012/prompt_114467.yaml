answer: |-
  Here is the desiderata list for a theory of neural representation, structured as requested.

  ### The Desiderata Table

  | Requirement | The Case or Consideration Behind It | Non-Negotiable or Camp-Specific | What It Would Rule Out |
  | :--- | :--- | :--- | :--- |
  | **1. Causal Efficacy** | **Probe vs. Intervention:** A linear probe decoding "gender" from activations is merely observational. If you intervene on that direction and the output does not shift predictably, the network wasn't *using* that state to represent gender; it was just correlated with it. | **Non-Negotiable** (for mechanistic accounts) | Purely information-theoretic accounts (e.g., Mutual Information bounds), "Decoder-only" theories, and any theory relying solely on probe accuracy without causal validation. |
  | **2. Multiple Realizability** | **Different Internal Geometry:** Two nets compute the same function, but Net A aligns concepts with axes, Net B rotates them 45 degrees. If your theory says Net A represents "cat" but Net B does not (because the vector changed), your theory is measuring basis, not representation. | **Non-Negotiable** | Localist theories (e.g., "Grandmother Cell" hypotheses), theories that tie representation to specific neuron indices rather than subspaces or equivalence classes. |
  | **3. Downstream Utilization** | **The Clock Case:** A layer encodes time (clock) perfectly, but the loss function never required it, and later layers ignore it. Is this a representation? If representation implies *for the system*, unused information is just a bottleneck artifact or correlation, not a representation. | **Camp-Specific** (Functionalism vs. Informationalism) | Informational theories that count any mutual information as representation. Forces a distinction between "carrying data" and "representing for use." |
  | **4. Superposition Tolerance** | **Polysemantic Neurons:** A single neuron fires for "cat ears" and "car wheels." A theory that demands 1:1 mapping between unit and concept fails immediately. The theory must explain how distinct semantic contents share physical substrate without collapsing into noise. | **Non-Negotiable** (given current architectures) | Localist interpretations, naive sparsity assumptions, any theory requiring orthogonal basis vectors for distinct concepts. |
  | **5. Format Specificity** | **Format vs. Content:** Saying "Layer 5 represents syntax" is insufficient. Is it a linear subspace? A manifold curvature? A attention pattern? Without format, you cannot distinguish between the variable being *computed* vs. being *passed through*. | **Camp-Specific** (Mechanistic vs. Behavioral) | "Black box" behavioral theories, high-level semantic claims that do not ground themselves in activation geometry or circuit structure. |
  | **6. Robustness to Noise** | **Stability:** If adding Gaussian noise to the putative representation vector destroys the semantic content immediately, it is a fragile coincidence, not a robust representation. Representations must be attractors or stable manifolds. | **Non-Negotiable** | Theories that rely on exact activation values rather than regions/distributions. |

  ### Analysis of Your Specific Questions

  **1. Format vs. Content**
  The theory owes you **both**. A theory of content without format is ungrounded semantics (you know *what* is represented but not *how*, making it impossible to verify or manipulate). A theory of format without content is just linear algebra (you know there is a subspace, but not *why* it matters). A complete theory must map the semantic content ($X$) to a specific geometric vehicle (e.g., "a linear subspace invariant to rotation $R$").

  **2. Usability (The Clock Case)**
  A representation **must be usable** by the rest of the network.
  *   **Verdict on the Clock:** Under the **Downstream Utilization** requirement, the clock is **not a representation**; it is a correlation (or a "trace").
  *   **Reasoning:** Representation is a functional role. If the information is present in the activations but causally isolated from the loss-relevant output path, it is an artifact of the training data distribution, not a feature the network has constructed to solve its task. If your theory counts the Clock as a representation, it fails to distinguish between *mechanism* and *side-effect*.

  **3. The Single Requirement That Knocks Out the Most Candidates**
  **Causal Efficacy (Requirement 1).**
  This is the graveyard of interpretability papers. The vast majority of current "discoveries" rely on probe accuracy (Requirement 1's foil). They show that *you* can read $X$ from the state, not that *the network* uses $X$ in the state. Enforcing intervention (causal scrubbing, activation patching) immediately invalidates any claim where the correlation is spurious or where the information is present but bypassed by the actual computation graph.

  **4. The Irreconcilable Conflict**
  There is a tension between **Multiple Realizability (Req 2)** and **Format Specificity (Req 5)** that is currently unresolvable.

  *   **The Pull:**
      *   **Multiple Realizability** demands that the theory identify the representation regardless of the coordinate system (rotation, scaling, re-parameterization of weights that preserves function). It implies the representation is an equivalence class of states.
      *   **Format Specificity** demands that the theory point to a specific mechanism (e.g., "this specific direction," "this specific attention head") to explain *how* the computation happens.
  *   **The Conflict:** If you can rotate the network's internal basis without changing the function (Multiple Realizability), then any specific direction you point to as the "Format" is arbitrary. If the Format is arbitrary, you cannot claim a specific Mechanism.
  *   **The Consequence:** No theory can currently satisfy both. If you lock down the Format (e.g., "it must be this SAE feature"), you violate Multiple Realizability (an adversary can rotate the model and break your feature while keeping the function). If you respect Multiple Realizability, you cannot specify a Format, rendering the theory unable to guide engineering interventions. This is the **Basis Problem**, and it suggests a complete theory of representation may require a new mathematical invariant that we do not yet possess.
