          *   *Timeline:* 20 years might be arbitrary; readiness matters more than time.
          *   *Nationality:* He would worry about the "not a single nation" aspect.
      *   **Settled vs. Extrapolated:**
          *   *Settled:* His view on "barbarians" needing tutelage. His view on the EIC structure.
          *   *Extrapolated:* Multilateralism (UN style), modern corporate structures.
      *   **19th-Century Assumptions:**
