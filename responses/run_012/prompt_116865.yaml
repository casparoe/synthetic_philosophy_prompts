prompt: |-
  I need the specification before I can evaluate any candidate. What must a theory of slurs deliver in order to be adequate — not for exegesis, but for a purpose I will state, since adequacy is relative to it.

  The purpose: I work on the policy side of a large platform's content-moderation system. A classifier must decide, at scale and in milliseconds, whether an utterance containing a slur is removed, down-ranked, or left alone; a reviewer must then be able to explain that decision both to the user who made it and to the group it targets; and the system must keep functioning on terms and usages that did not exist when it was built.

  Write me the desiderata list: what any adequate theory of slurs has to deliver for that purpose. For each requirement, give the case or consideration that motivates it — the datum the theory must accommodate, the distinction it must not collapse, the verdict it must not get wrong. I expect the list will have to cover, among other things: the semantic status of the derogation (truth-conditional content, presupposition, conventional implicature, expressive, or act); the relation between a slur and its neutral counterpart; the difference between a term's being derogatory and its being merely offensive or vulgar, and the boundary between slurs and other identity-directed insults; quotation, report, and counterspeech, where the word occurs without the speaker endorsing it; reclamation, including the question of who is authorized to reclaim and what follows when members of the same group disagree about it; non-derogatory uses in pedagogy and art; diachronic change in both directions; cross-dialect and cross-linguistic cases; and uses that derogate with no member of the target group present.

  Then mark which requirements are non-negotiable and which are artifacts of my particular purpose. Most of all, identify the pairs that cannot be jointly satisfied and argue for each incompatibility, since those are the ones I have to make policy around. Keep the survey of existing positions short: what truth-conditional, presuppositional or conventional-implicature, and purely pragmatic accounts each buy and pay for against the list — a paragraph each at most.

  Finally, and this is why I am asking rather than looking it up: I have a working hypothesis that the distinction the system actually needs is not use versus mention but voice — a term is tolerable when the speaker is either speaking as a member of the targeted group or speaking as a conduit for someone else's words, and intolerable when the speaker is speaking in their own voice about the target. Tell me whether that criterion can be made precise enough to survive the desiderata list, what it handles that use versus mention does not, and where it breaks. No literature review; I want the criteria and the conflicts.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User Persona:** Policy side of a large platform's content-moderation system. Practical, high-stakes, scale-oriented, needs explainability, needs future-proofing.
      *   **Task:** Create a desiderata list for a theory of slurs adequate for *this specific purpose* (content moderation policy).
      *   **Requirements:**
          *   List requirements with motivations (cases/data/distinctions).
          *   Cover specific topics: semantic status, neutral counterpart relation, derogatory vs. offensive/vulgar, slur vs. identity-insult, quotation/report/counterspeech, reclamation (authorization/disagreement), pedagogy/art, diachronic change, cross-dialect/linguistic, absent target derogation.
          *   Mark requirements as Non-Negotiable vs. Artifacts of Purpose.
          *   Identify incompatible pairs (trade-offs) and argue for the incompatibility (crucial for policy).
          *   Brief survey of existing positions (Truth-Conditional, Presuppositional/CI, Pragmatic) - max 1 paragraph each.
          *   Evaluate the user's "Voice" hypothesis (Member/Conduit vs. Own Voice) against the desiderata.
      *   **Constraint:** No literature review. Focus on criteria and conflicts. Keep it sharp and actionable.

  2.  **Deconstruct the Purpose:**

      *   *Scale/Speed:* Needs computable features (mostly).
      *   *Explainability:* Needs clear rules for humans (reviewers/users).
      *   *Future-proofing:* Needs to handle neologisms and semantic drift.
      *   *Justice/Fairness:* Needs to protect targeted groups without over-censoring marginalized voices (reclamation).

  3.  **Drafting the Desiderata List:**

      *   *Semantic Status:* Is the hate part of the truth conditions? (Does "X is a [slur]" mean X is bad, or just X is in group G + speaker hates G?) *Motivation:* Truth-conditional theories make reporting slurs false, which is bad for moderation logs.
      *   *Neutral Counterpart:* Must distinguish [Slur] from [Neutral]. *Motivation:* Equating them erases harm; separating them too much blocks reclamation.
      *   *Derogatory vs. Offensive:* Swearing isn't hate speech. *Motivation:* Over-moderation of general profanity vs. under-moderation of coded hate.
      *   *Slur vs. Identity-Insult:* "You're a jerk" vs. "You're a [slur]." *Motivation:* Specific harm to protected groups.
      *   *Quotation/Report:* Mentioning the word to condemn it. *Motivation:* Chilling effect on education/news if banned outright.
      *   *Reclamation:* In-group use. *Motivation:* Silencing marginalized communities if banned universally.
      *   *Pedagogy/Art:* Contextual allowance. *Motivation:* Cultural value vs. safety.
      *   *Diachronic Change:* New slurs emerge; old ones lose sting or gain it. *Motivation:* System rot over time.
      *   *Cross-Dialect:* A word might be a slur in US English but not UK English (or vice versa). *Motivation:* Global platform consistency vs. local nuance.
      *   *Absent Target:* Hate speech doesn't need a victim present. *Motivation:* Incitement and community poisoning.

  4.  **Categorizing Requirements (Non-Negotiable vs. Artifacts):**

      *   *Non-Negotiable:* Safety (prevent harm), Consistency (rule of law), Explainability (due process).
      *   *Artifacts:* Millisecond decision (technical constraint), Specific taxonomy of semantic theory (philosophical constraint).

  5.  **Identifying Incompatible Pairs (The Core Conflict):**

      *   *Reclamation vs. Safety/Scale:* Allowing in-group use requires knowing group membership. At scale, you can't verify identity. If you ban the word universally, you hurt reclamation. If you allow it contextually, you risk false negatives (outsiders pretending).
      *   *Explainability vs. Context-Sensitivity:* Simple rules are explainable but miss nuance. Complex context models (Voice) are accurate but hard to explain ("Why was *my* use okay but *yours* wasn't?").
      *   *Future-Proofing vs. Precision:* Broad definitions catch new slurs but create false positives. Specific lists miss new terms.

  6.  **Surveying Existing Positions (Briefly):**

      *   *Truth-Conditional:* Slur entails negative property. *Pay:* Clear ban logic. *Cost:* Makes reports/counterspeech logically false or contradictory.
      *   *Presupposition/CI:* Negative attitude is backgrounded. *Pay:* Handles embedding better. *Cost:* Hard to compute at scale; doesn't solve the "who can say it" problem.
      *   *Pragmatic/Use-Based:* It's about the act of subordinating. *Pay:* Handles context/reclamation well. *Cost:* High ambiguity, hard to automate, requires intent analysis.

  7.  **Evaluating the "Voice" Hypothesis:**

      *   *Hypothesis:* Tolerable if (In-Group Member) OR (Conduit/Quote). Intolerable if (Out-Group Own Voice).
      *   *Strengths:* Solves the reclamation vs. ban conflict theoretically. Distinguishes reporting from using.
      *   *Weaknesses:*
          *   *Verification:* How does the system know if the speaker is In-Group? (Privacy vs. Safety).
          *   *Conduit Definition:* Does a journalist quoting a slur count as conduit? What about a critic analyzing the slur?
          *   *Allies:* Can an ally use the word in solidarity? (Voice theory might block this).
          *   *Intra-group disagreement:* If Group A disagrees on reclamation, whose "Voice" counts?
      *   *Verdict:* Normatively attractive, operationally fragile.

  8.  **Refining and Formatting:**

      *   Ensure the tone is professional, direct, and policy-oriented.
      *   Check off all specific topics requested in the prompt.
      *   Ensure the "Incompatible Pairs" section is robust, as that's the most valuable part for a policymaker.
      *   Make sure the "Voice" critique is sharp.

  9.  **Self-Correction/Review during drafting:**

      *   *Check:* Did I spend too much on the literature survey? *Correction:* Keep it to one paragraph each as requested.
      *   *Check:* Did I address the "absent target" issue? *Correction:* Ensure it's in the desiderata.
      *   *Check:* Is the distinction between Non-Negotiable and Artifacts clear? *Correction:* Use a specific section for this.
      *   *Check:* Is the "Voice" hypothesis evaluated against the *desiderata*? *Correction:* Explicitly map Voice strengths/weaknesses to the list items (e.g., Reclamation, Quotation).

  10. **Final Polish:** Check for clarity, impact, and adherence to the "No literature review" constraint (focus on criteria/conflicts). (Self-correction: The prompt asks for a short survey of existing positions *against the list*, not a general lit review. I will ensure it's tied to the desiderata.)

  *(Self-Correction on "Voice"):* The user's hypothesis is "Member or Conduit" vs "Own Voice about target". I need to be careful about the "Conduit" definition. If I quote a slur to condemn it, am I a conduit? Yes. If I use it in a song? Maybe. If I use it in a sociology paper? Maybe. The friction point is *verification of membership*.

  *(Self-Correction on Incompatibilities):* The biggest one for a platform is *Privacy/Anonymity* vs. *Reclamation*. You can't verify group membership without doxxing or intrusive profiling. This makes the "Voice" theory hard to implement technically. I must highlight this.

