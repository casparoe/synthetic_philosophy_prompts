answer: |-
  You have identified a precise and pervasive methodological problem in historiography, particularly in fields where archaeology, text, and tradition intersect (Biblical studies, Homeric archaeology, Early Medieval history). Your intuition is correct: while *euhemerism* names the general theory that myths are distorted history, it does not name the specific *logical move* you are describing. Euhemerism is the worldview; what you are describing is the argumentative mechanism used to sustain that worldview in the face of thin evidence.

  Your term, "kernel-washing," is evocative and poetically accurate (it suggests cleaning a dirty myth to make it presentable as history), but for a graduate seminar, you require a term that describes the *structural logic* rather than the *hygiene* of the narrative.

  Here is the anatomy of the move, the distinction from legitimate inference, and a proposed term.

  ### I. The Anatomy of the Move

  The move consists of four distinct logical steps. It fails not in the identification of the substratum, but in the *permeation* of historicity from the substratum to the superstructure.

  1.  **Bifurcation:** The narrative is analytically separated into a **Mythic Superstructure** (wondrous events, specific dialogues, moral arcs, supernatural interventions) and a **Historical Substratum** (geographical names, political titles, broad chronological markers, archaeological layers).
  2.  **Compatibility Discovery:** A real-world referent is identified that matches the Substratum (e.g., a burned layer at Hisarlik, a stele mentioning "David," a Hyksos expulsion). Crucially, this evidence is *compatible* with the narrative but does not *entail* it.
  3.  **Historicity Transfer:** The facticity established for the Substratum is transferred to the Superstructure. Because the *setting* is real, the *plot* is deemed "historical in outline." The ontological status of the place confers ontological status upon the story.
  4.  **Burden Reversal:** The burden of proof is shifted. The proponent claims the narrative is historical *unless* the skeptic can explain the Substratum without the Narrative. The skeptic is forced to argue against the existence of the burned layer or the king, rather than against the link between the layer/king and the story.

  ### II. Distinction from Legitimate Inference

  How does this differ from a legitimate historical inference from a distorted memory? The difference lies in the **Causal Link** versus **Mere Compatibility**.

  *   **Legitimate Inference (Inference to the Best Explanation):**
      *   *Structure:* The narrative explains specific details of the evidence that would otherwise be anomalous.
      *   *Example:* A battle narrative describes a specific tactical use of terrain that matches an archaeological find of weapon distribution in a way that oral tradition preserves better than written records.
      *   *Test:* If the narrative were removed, would the evidence look significantly different or less intelligible? If yes, the inference is legitimate.

  *   **The Fallacious Move (Substratum Inflation):**
      *   *Structure:* The evidence is intelligible on its own (e.g., cities burn, kings reign, migrations happen). The narrative is merely *laid over* the evidence.
      *   *Example:* A city burned (Substratum). The legend says a hero burned it (Superstructure). The burning does not require the hero to explain it; wars burn cities regardless of heroes.
      *   *Test:* If the narrative were removed, would the evidence look the same? If yes, the narrative is not confirmed; it is merely *accommodated*.

  ### III. The Category Error

  The move commits a category error between **Referent** and **Representation**.

  *   **Referent:** The actual historical event/person/place (The Substratum).
  *   **Representation:** The story told about them (The Superstructure).

  The error is assuming that proving the existence of the *Referent* validates the fidelity of the *Representation*. It confuses *ontology* (something existed) with *narrative fidelity* (the story tells us what existed). It is the logical equivalent of finding a photograph of a man and assuming a biography written about him fifty years later is accurate because the man in the photo is real.

  ### IV. The Term: "Substratum Inflation"

  While "kernel-washing" captures the rhetorical cleaning, I propose the term **Substratum Inflation** for the seminar. It borrows from economics to describe the logical disproportion: a small amount of "hard currency" (evidence) is used to support a large amount of "paper currency" (narrative claim), inflating the value of the narrative beyond its evidentiary reserve.

  **Definition:**
  > **Substratum Inflation** is the historiographical fallacy wherein the confirmed existence of a historical substratum (place, person, or layer) is used to validate the narrative superstructure built upon it, based solely on compatibility rather than corroboration, thereby shifting the burden of proof to the skeptic to disprove the narrative connection.

  **Boundary Cases:**

  1.  **Not Substratum Inflation (Legitimate Corroboration):**
      *   *Case:* The Tel Dan Stele mentions the "House of David." A historian argues David was a historical dynastic founder.
      *   *Why:* The claim is limited to the Substratum (David existed). It does not claim the *stories* about David (Goliath, Bathsheba) are therefore historical. The historicity stops at the name.

  2.  **Not Substratum Inflation (Causal Specificity):**
      *   *Case:* A specific destruction layer contains arrowheads of a type unique to a specific invading army mentioned in a text, found in a pattern matching the text's tactical description.
      *   *Why:* The Substratum contains specific data that *requires* the Narrative to explain it. The evidence is not just compatible; it is distinctive.

  3.  **Substratum Inflation (The Fallacy):**
      *   *Case:* A destruction layer exists at Troy. Therefore, the *Iliad* is "historical in outline," and skeptics must explain the destruction layer without the Trojan War.
      *   *Why:* Destruction layers are common. The layer proves fire, not Helen. The narrative value is inflated by the archaeological currency.

  ### V. Why "Euhemerism" Is Insufficient

  You noted Euhemerism as a candidate. Euhemerism is the *genus* (the theory that myth is history), but Substratum Inflation is the *species* (the methodological error used to apply the theory). One can be a Euhemerist without committing Substratum Inflation (e.g., by acknowledging that while a myth has a historical core, the narrative is largely invented). The move you describe is the *uncritical application* of Euhemerism.

  ### Summary for the Seminar

  If you wish to introduce this into your seminar, you might say:

  > "We are witnessing a case of **Substratum Inflation**. We have a compatible archaeological layer, but we are allowing the facticity of the layer to bleed into the fidelity of the narrative. The layer proves a fire; it does not prove the *Iliad*. We are treating compatibility as corroboration."

  Your term "kernel-washing" is excellent for describing the *effect* (making the myth palatable), but "Substratum Inflation" describes the *mechanism* (the logical overextension). Use both: "kernel-washing" for the rhetorical outcome, "Substratum Inflation" for the methodological error.
