answer: |-
  ### I. Mapping the Terrain

  To treat "the arc bends toward justice" as a substantive empirical thesis rather than a moral slogan, we must strip it of eschatological hope and recast it in causal machinery. In your biological terms, we are asking if history exhibits *teleonomy*: a directional trend generated by a blind filter rather than a foresighted designer. For this to be true, three conditions must hold. First, there must be a defined "fitness landscape" where certain institutional configurations out-compete others over deep time. Second, there must be a heritable variation in those institutions (policy diffusion, imitation, conquest). Third, the "fitness" metric must correlate with the moral variable in question.

  The candidate mechanisms are plausible but noisy. Selection among institutions (states that respect property and rule of law may generate more surplus and thus survive war); ratchets (technologies of communication that make secrecy harder); and the rising cost of domination (as economies complexify, coercion becomes less efficient than consent). However, the thesis is ill-posed if "justice" remains a substantive moral ideal (e.g., "equality"), because that ideal changes with the observer. To give the thesis a truth value, we must operationalize justice procedurally, as you suggested: **the reduction of arbitrary power.** This is measurable (recourse to law, constraints on executives, predictability of rule). If we define the thesis as "a mechanism exists that biases institutional evolution toward lower arbitrariness," the question becomes well-posed, though empirically treacherous.

  ### II. Credence Assignment

  My credence in the proposition—*that there exists a mechanism operating on human societies across spans of centuries that biases institutional change toward reducing the arbitrary exercise of power over persons, and the bias is strong enough that the long-run expected direction of change is toward such reduction*—is **0.22**.

  I assign this low number not because I deny the moral progress of the last three centuries, but because I doubt the *mechanism* is robust enough to constitute a law-like expectation rather than a contingent fluctuation. In biological terms, I suspect we are observing a local adaptive peak or a transient environmental effect, not a fundamental law of selection.

  ### III. Decomposition

  To arrive at 0.22, I treat the proposition as a conjunction of four independent probabilistic conditions. If any fails, the thesis collapses. I combine them multiplicatively: $C = P(a) \times P(b) \times P(c) \times P(d)$.

  *   **(a) Mechanism Existence:** **0.85**.
      *   *Justification:* There are clear functional advantages to non-arbitrary rule (economic efficiency, stability), creating a selection pressure analogous to biological fitness.
  *   **(b) Shock Survival:** **0.70**.
      *   *Justification:* Institutional ratchets (e.g., literacy, legal codes) often survive collapse, but history shows frequent "reset" events where arbitrariness spikes (e.g., post-collapse warlordism).
  *   **(c) Non-Circular Definition:** **0.75**.
      *   *Justification:* "Arbitrariness" can be defined procedurally (absence of due process), but distinguishing reduced arbitrariness from merely *different* arbitrariness remains conceptually leaky.
  *   **(d) Discriminability from Drift:** **0.50**.
      *   *Justification:* With a sample size of one historical trajectory, distinguishing a directional bias from a long random walk or cyclical fluctuation is statistically underpowered.

  **Calculation:** $0.85 \times 0.70 \times 0.75 \times 0.50 = 0.223$.

  **Sensitivity:** My final number is most sensitive to **term (d)**. If we could somehow demonstrate that the historical record *could not* be generated by a random walk (perhaps by finding convergent evolution in isolated civilizations), the number would rise sharply. As it stands, the single-trajectory problem is the bottleneck that prevents this from moving from a hypothesis to a law.

  ### IV. Falsification and Evidence

  **Refutation:** A defender of the thesis must classify a century-scale development as a temporary reversal only if there is a mechanistic explanation for the eventual recovery. A refutation would be a **stable, high-capacity arbitrary regime** that persists for multiple centuries without collapsing due to inefficiency. For example, if a technologically advanced surveillance state proves *more* economically productive and militarily resilient than a liberal order over a 200-year span, the thesis is falsified.

  **Honest Work vs. Lab Coat:** Classifying a reversal as "temporary" is unfalsifiability wearing a lab coat if the only justification for the expected recovery is faith in the "arc" itself. It is honest work only if one can point to a specific counter-pressure (e.g., "this regime is starving its innovation sector") that guarantees long-term competitive disadvantage.

  **Moving the Number:** The evidence that would move my number most is **comparative data from independent trajectories**. If we discovered that distinct, isolated human civilizations (or comparable intelligent species) independently converged on low-arbitrariness institutions as they scaled in complexity, my credence would approach 0.8. Conversely, if game-theoretic modeling proved that arbitrary power has a higher stable equilibrium in high-technology environments, my credence would drop to 0.05.

  ### V. The Interlocutors

  **My Number:** **0.22**.

  **The Disagreement:** The gap between your optimist (0.75) and your pessimist (0.1) does not primarily live in the historical data; they are looking at the same timeline. It lives in **term (d)** and **term (a)**.

  The optimist assumes the mechanism (a) is strong and that the signal is distinguishable from noise (d). They view the last three centuries as a robust sample of the underlying law. The pessimist views the mechanism as non-existent (a) and the trend as a statistical artifact of sampling the immediate post-Enlightenment period (d).

  My position suggests the disagreement is actually about **the inferential leap from N=1 to law**. The optimist treats history like a biology lab with many replicates; the pessimist treats it like a single geological event. I side closer to the pessimist on the epistemology (we cannot easily distinguish drift from direction) but closer to the optimist on the mechanism (there *are* functional pressures favoring non-arbitrariness). The disagreement is not about whether people suffer, but about whether the universe cares, even blindly. My number says: the universe likely does not care enough to guarantee the outcome.
