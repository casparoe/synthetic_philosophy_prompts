  I'm doing a film-and-philosophy night on Parasite and I want to read it through Hegel's master–slave dialectic rather than the usual everyone-here-is-a-parasite class reading. My hunch, and I'd rather you push back on it than nod along: the Parks are the masters and the Kims are the slaves, but the dialectic stalls because the Kims never actually labour — they fake the labour, collect the wages, and skip the formative work that's supposed to hand the slave self-consciousness. The smell is the hinge, Mr. Park can't recognise Ki-taek because recognition needs two equals and the smell keeps the slave's body showing through the uniform, while the Parks get whatever recognition they need from each other and not from the people who actually run their lives. And the couple in the basement are a slave's slaves, which should make the recognition story messier than the film wants it to be. Give me exactly five points, a sentence or two each, no intro and no summing-up: where the reading holds, where I'm forcing it, which scenes carry it, and what the film shows about recognition that the Phenomenology can't.
