  ok so I'm doing a thing for my philosophy club and I've gone down a rabbit hole and now I'm stuck. I get the self-sampling assumption, right — I should think of myself as a random human out of all the humans there will ever be, and thats how you get the doomsday argument, we're probably early so probably doomed. But then someone told me about the self-indication assumption and the presumptuous philosopher, and that SIA is the big objection to doomsday: if your existence is more likely in a world with way more people, then me existing is evidence that N is huge, so doomsday gets cancelled and I should think I'm probably in some giant universe with like 10^40 people, and maybe even an infinite one since infinite is more than 10^40. So my question is which assumption is actually true, and can you tell from how many people there are? Like if SSA turns out to be right, does that mean the total number of humans really is small, and if SIA is right does it mean it really is huge? And is the presumptuous philosopher the name of the position you end up with under SIA, or the name of the argument against it? Because if theyre just two assumptions that give opposite answers about how many people there are, it seems like one of them has to be wrong about the actual number, and I dont know how to figure out which one.
