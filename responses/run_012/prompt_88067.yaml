          2.  **Collective Action/Free-Rider Problem:** Voting produces a public good (better government). It costs effort. If everyone free-rides, the good isn't produced. If enough vote, the good is produced regardless of *my* vote.
      *   *Challenge:* The prompt asks to make them feel *both* and see they are distinct but related.
