answer: |-
  # Lesson Plan: The Paradox of Voting (90 Minutes)

  ## 1. Learning Objectives
  By the end of this session, students will:
  1.  Experience the tension between individual rationality and collective welfare in voting contexts.
  2.  Distinguish between the **Public Good/Free-Rider Problem** (collective action failure) and the **Downsian/Pivotal Paradox** (negligible causal impact).
  3.  Evaluate four philosophical responses to the paradox (Expressive, Minimax-Regret, Universalisability, Evidential).
  4.  Understand which responses solve, dissolve, or merely relocate the theoretical problem.

  ## 2. Materials and Setup
  *   **Room:** Seminar room with 20 seats.
  *   **Handouts:**
      *   **Decision Slip:** A small piece of paper with two checkboxes: [ ] VOTE (Cost: 5 points) / [ ] ABSTAIN (Cost: 0 points).
      *   **Envelope:** One opaque envelope per student to ensure secrecy.
      *   **Phase 2 Briefing:** A slip of paper calculating 'Pivotal Probability' (distributed only in Phase 2).
  *   **Stakes:** A 'Class Pot'.
      *   **Currency:** 'Utility Points' (UPs).
      *   **Redemption:** If the class accumulates a certain total of UPs by the end of term, or if the threshold is met today, a reward is unlocked (e.g., a £30 box of chocolates shared, or a donation to a charity of the class's choice). *Do not use assessed grades.*
  *   **Board:** Whiteboard for tallying results and displaying payoff matrices.

  ## 3. Payoff Scheme
  *   **Endowment:** Each student starts with **10 UPs**.
  *   **Cost of Voting:** **5 UPs** (deducted immediately if 'VOTE' is chosen).
  *   **Collective Bonus:** If **15 or more** students vote, *every* student (voters and abstainers) receives **8 UPs**.
  *   **Failure:** If fewer than 15 vote, no bonus is awarded.

  **The Rational Calculus (for the instructor):**
  *   **If I Abstain:** I keep my 10 UPs. If the threshold is met, I get +8. Total = 18. If not, Total = 10.
  *   **If I Vote:** I pay 5 (left with 5). If the threshold is met, I get +8. Total = 13. If not, Total = 5.
  *   **Dominant Strategy:** Abstain. Regardless of the outcome, I am always 5 UPs better off by abstaining *unless* my vote is the single one that crosses the threshold (pivotal). Even if pivotal, I gain 3 net UPs (13 vs 10), but the risk of wasting 5 UPs usually outweighs this in large groups. In this specific setup, Abstain is strictly dominant *unless* the student is certain they are pivotal.

  ## 4. Timeline and Activity Flow

  ### Phase 1: The Free-Rider Experience (0–35 mins)
  *   **0–10 mins: Introduction.** Explain the rules clearly. Emphasise that the reward is shared *regardless* of who paid the cost. Emphasise secrecy (sealed envelopes).
  *   **10–20 mins: Decision.** Students mark slips, seal envelopes. Collect them.
  *   **20–25 mins: The Count.** Open envelopes publicly. Tally votes.
      *   *Likely Outcome:* Failure to reach 15 votes. (If they succeed, note that this is anomalous and proceed to the 'what if' analysis).
  *   **25–35 mins: Immediate Reaction.** Ask: "Why did you choose as you did?"
      *   Expect answers like: "I hoped others would do it," "My 5 points didn't matter," "I didn't want to be a sucker."
      *   **Label this:** The **Public Good / Free-Rider Problem**. The group is worse off because individuals acted rationally to save costs.

  ### Phase 2: The Pivotal Reframe (35–50 mins)
  *   **35–40 mins: The Redescription.** Hand out the **Phase 2 Briefing**.
      *   *Text:* "In a group of 20, for your vote to matter, exactly 14 others must vote. If 13 vote, you fail even if you vote. If 15 vote, you succeed even if you abstain. Based on Round 1, the probability of exactly 14 others voting is statistically negligible."
  *   **40–45 mins: Re-vote.** Run the exact same game again with the same payoffs.
  *   **45–50 mins: Compare.** Did behaviour change?
      *   Likely, turnout drops further or stays low.
      *   **Label this:** The **Downsian / Pivotal Paradox**. Even if you *want* the collective good, the mathematical probability of your specific vote causing it is near zero. Therefore, $Expected Utility = (P \times Benefit) - Cost$. Since $P \approx 0$, $EU < 0$.

  ### Phase 3: Debrief and Philosophical Responses (50–80 mins)
  Draw two columns on the board: **(i) Free-Rider** and **(ii) Pivotal Probability**.
  *   **Free-Rider:** Focuses on the *structure* of the good (non-excludable). I benefit even if I don't pay.
  *   **Pivotal:** Focuses on the *causal efficacy* of the act. My vote changes nothing.
  *   **Synthesis:** Explain that these are often conflated. One is about incentives (Free-Rider), the other about causality (Pivotal).

  **Introduce the Four Responses:**
  Guide the discussion through the following four attempts to resolve the paradox. Ask students to evaluate if these make voting rational.

  1.  **The Expressive Account:** Voting is not an investment (instrumental); it is consumption (expressive). You get utility from the act itself (doing your duty, affirming identity).
      *   *Effect:* Adds a 'D' term (Democratic duty) to the utility function.
  2.  **Minimax-Regret:** Focus not on expected utility, but on regret. If you abstain and the side you prefer loses by one vote, the regret is catastrophic.
      *   *Effect:* Changes the weighting of outcomes, not the probability.
  3.  **Universalisability (Kantian):** Ask "What if everyone in my position abstained?" If the maxim leads to contradiction (democracy collapses), I must vote.
      *   *Effect:* Shifts from individual causality to moral duty.
  4.  **Evidential Decision Theory (EDT):** My choice is evidence of what others like me will do. If I vote, it is more likely that others will vote.
      *   *Effect:* Correlates my act with the outcome, bypassing causal insignificance.

  ### Phase 4: Wrap-up and Table (80–90 mins)
  *   Distribute the summary table (see below).
  *   Final Q&A.
  *   Redeem the Class Pot (if won) or explain the charitable donation outcome.

  ## 5. Predictable Failures and Mitigations

  | Potential Issue | Why it happens | Mitigation |
  | :--- | :--- | :--- |
  | **High Turnout in Round 1** | Students may be altruistic or treat it as a 'game' to beat the instructor. | Acknowledge this as 'noise'. Ask the high-turnout students: "Did you expect to be pivotal, or were you contributing to the public good?" Use their answers to distinguish the two paradoxes. |
  | **Collusion** | Students may signal intentions to ensure the threshold is met. | Enforce strict silence during the decision phase. Collect envelopes immediately. |
  | **Confusion of Paradoxes** | Students will conflate "It won't pass" with "My vote won't count". | Use the board to visually separate the *Collective Outcome* (Phase 1) from the *Individual Calculus* (Phase 2). |
  | **Cynicism** | Students may feel the stakes are too low to care. | Be frank: "The points are trivial. The point is the structure. If you wouldn't vote for 5 points, would you vote for £5? For £500? Where is the threshold?" |

  ## 6. Limitations (For the Debrief)
  You must explicitly state what this activity *cannot* reproduce:
  1.  **Scale:** In a class of 20, the probability of being pivotal is actually calculable and non-negligible (unlike a national election with millions of voters). The 'Pivotal Paradox' is much stronger in reality than in this room.
  2.  **Secrecy:** In a seminar, social pressure exists. In a voting booth, anonymity is guaranteed.
  3.  **Iteration:** This is a one-shot game. Real voting is repeated, allowing for reputation and norm-building (which supports the Expressive/Universalisability accounts).

  ## 7. Summary Table: Responses to the Paradox

  | Response | What it changes | Solves or dissolves | Standard objection |
  | :--- | :--- | :--- | :--- |
  | **Expressive Account** | Adds a psychic benefit ('D' term) to the payoff of voting itself. | **Dissolves.** It argues the paradox arises from incomplete payoff modelling. Voting is rational consumption, not irrational investment. | Does not explain why people vote when the expressive benefit is low (e.g., boring local elections) or costly (bad weather, long queues). |
  | **Minimax-Regret** | Changes the utility function to weigh 'regret' heavier than 'probability'. | **Relocates.** It makes voting rational for the regret-averse, but requires assuming agents maximise against regret rather than expected utility. | Seems ad hoc. Why should a vanishingly small probability justify a certain cost? Most rational agents ignore low-probability catastrophic risks in other contexts (e.g., buying lottery tickets). |
  | **Universalisability** | Shifts the justification from causal impact to moral duty (Kantian maxim). | **Solves (Normatively).** It provides a moral reason to vote. | **Does not solve (Descriptively).** It explains why one *ought* to vote, not why rational self-interested agents *do* vote. Also, relies on the contested claim that one's vote sets a universal example. |
  | **Evidential (EDT)** | Treats the voter's choice as evidence of others' choices (correlation over causation). | **Solves (Mathematically).** If my voting increases the probability others vote, the expected utility becomes positive. | **Contested.** Relies on 'magical thinking' or Newcomb-like problems. Causal Decision Theorists argue my vote cannot *cause* others to vote, so the correlation is irrelevant to rational choice. |

  ## 8. Instructor Notes on British English and Tone
  *   Ensure spelling follows British conventions (e.g., *behaviour, programme, analyse, centre*).
  *   Maintain a distinction between 'settled matters' (the mathematical structure of the paradox) and 'contested matters' (whether EDT is a valid decision theory, or if the Expressive account is sufficient).
  *   Do not present the Expressive Account as the consensus solution; present it as the most popular *dissolution* among empirical political scientists, but note that philosophers often find it unsatisfying as it reduces citizenship to consumption.
