answer: |-
  ### Ranking by Defensibility (Most to Least)

  1.  **Equal-surplus split** — This feels most intuitive because it respects A's existing safety net without letting it dominate the negotiation, simply dividing the *new* value created by cooperation 50/50.
  2.  **Egalitarian** — Normal people have a strong baseline preference for equality of outcome, even if it ignores the asymmetry in what each player *could* have achieved alone.
  3.  **Kalai–Smorodinsky** — This strikes a sophisticated balance by giving each player the same percentage of their potential, which feels fair when their maximum capacities differ.
  4.  **Nash** — While mathematically elegant, this often feels like it rewards A too much for having a stronger threat point, effectively punishing B for being desperate.
  5.  **Utilitarian** — This is hard to defend as "fair" because it maximizes the total pie without caring who gets the slices, potentially leaving B with nothing.
  6.  **Threat-point proportionality (TPP)** — This is the least defensible because it hardwires B's weakness into the final outcome, ensuring the player with the weak fallback stays poor.

  ***

  ### Follow-up (a): Flipping the Scenario
  If the player with the weaker fallback (B) now has the **bigger ideal payoff**, the **Utilitarian** and **Kalai–Smorodinsky** rules move the most, as they both shift significant utility toward B to capture or respect that new potential. My top two (**Equal-surplus split** and **Egalitarian**) **stay put**, because neither rule cares about the size of the ideal payoff—one cares only about the gain from the disagreement point, and the other cares only about final equality.

  ### Follow-up (b): Hardest to Tell Apart
  The **Nash** solution and the **Equal-surplus split** are the hardest to distinguish because on a standard linear bargaining frontier, they produce the exact same outcome. To pull them apart, you need a **curved (non-linear) Pareto frontier**; in that case, Nash will slide along the curve to maximize the product of gains (often favoring the player with the better threat point), while Equal-surplus will stick rigidly to the 45-degree line of equal gains from the disagreement point.
