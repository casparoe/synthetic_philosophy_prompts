answer: |-
  **The Scenario**

  Elias, knowing he is prone to panic-selling during market crashes, signs a notarized covenant: he cannot access his investment fund for five years without paying a 40% penalty, even if he begs. Simultaneously, the Oakwood Worker Co-op (50 members) votes by majority rule to lock their emergency reserve under identical terms: no withdrawals for five years without a 40% penalty, anticipating a future majority will panic during a crash. In Year 3, a crash hits. Elias wants to withdraw. The Co-op's newly elected Board (representing a new majority coalition of the same workers) wants to withdraw. Both *can* legally break the lock by paying the penalty. Both know that by Year 5, the market will recover and they will be glad the money remained intact.

  ***

  **The Walkthrough**

  **1. Individual Case (Elias)**
  *   **Present-Preference Theory (PPT):** At Year 3, Elias's strongest preference is liquidity. Rationality is satisfying the preferences of the agent *at the moment of action*. Therefore, PPT dictates Elias **should break the bind**. The fact that Year 5 Elias will regret this is irrelevant to Year 3 Elias's rationality.
  *   **Planning-Agent Theory (PAT):** Elias is a temporally extended entity. Rationality is coherence with the life-plan endorsed by the agent across time. Year 1 Elias's plan (protect the future) governs Year 3 Elias. Therefore, PAT dictates Elias **should keep the bind**.
  *   **Retrospective Endorsement:** In Year 5, Elias is glad he kept the bind. PPT must admit Year 3 Elias was "rational" then, even though Year 5 Elias wishes he wasn't. This creates a fragmentation: Elias is a series of competing time-slices.

  **2. Collective Case (The Co-op)**
  *   **Present-Preference Theory (Democratic Sovereignty):** At Year 3, the current Majority's strongest preference is liquidity. The "sovereign" is the current voting coalition. Therefore, PPT dictates the Co-op **should break the bind**. To say otherwise is to let the "dead hand" of the Year 1 Majority rule the Year 3 Majority.
  *   **Planning-Agent Theory (Constitutionalism):** The Co-op is an institutional agent extending across time. Rationality is fidelity to the institutional plan (the Charter). Therefore, PAT dictates the Co-op **should keep the bind**.
  *   **The Divergence:** Here is where the analogy strains. In the Individual case, PAT feels intuitive because Elias *feels* like the same person in Year 1 and Year 3. In the Collective case, PAT requires us to treat the Co-op as a "Unified Agent" despite it being a shifting coalition of distinct humans. The "Democratic Sovereignty" view (PPT) feels stronger here because there is no phenomenological glue holding Year 1 Majority and Year 3 Majority together other than a legal fiction.

  **3. The "Whose Present" Awkwardness**
  The PPT forces a choice on whose "present" counts. In the Individual case, PPT privileges Year 3 Elias over Year 1 Elias. We tolerate this because they are biologically continuous. In the Collective case, PPT privileges Year 3 Majority over Year 1 Majority. But if the Co-op is the "Agent," why does the Year 3 time-slice get to veto the Year 1 time-slice? If the Co-op is a unified entity (as PAT claims), the Year 1 preference *is* the Co-op's preference. PPT denies the Co-op exists across time, reducing it to a sequence of temporary dictatorships. It must argue that the "People" cease to exist as a sovereign entity the moment a new vote is taken.

  ***

  **The Single Feature: Phenomenological Continuity**

  The variable doing all the work is **felt identity**.
  *   **In the Individual:** Elias has first-person access to Year 1 Elias's intentions. He remembers making the plan. There is a psychological bridge. PAT rides on this bridge.
  *   **In the Collective:** The Year 3 Board members did not necessarily feel the Year 1 Board's conviction. They are bound by a rule, not a memory. The "bridge" is purely external (the contract), not internal (the psyche).

  **Pulling the Feature Out**
  If you remove phenomenological continuity from the Individual case—e.g., Elias has total amnesia at Year 3 and feels like a different person—the Individual case starts looking exactly like the Collective case. Year 3 Elias would ask, "Why should I be bound by some stranger's decision?" PAT loses its grip immediately. This proves that the Ulysses contract works for individuals *only because* we assume a continuous self. Since collectives lack a continuous self, the Ulysses move is sleight of hand: it imports the metaphysics of personhood into a group that doesn't possess them.

  **The Counter-Attack (How a Proponent Defends the Analogy)**
  A constitutionalist would argue that **Institutional Identity** substitutes for **Phenomenological Identity**. They would claim the Co-op *does* have continuity, not through memory, but through *role-occupancy*. The "Board" is the persistent agent, regardless of which humans sit in the chairs. They would argue that PPT is destructive in both cases: if Elias can break covenants whenever he changes his mind, he can't plan a life; if the Co-op can break charters whenever the majority shifts, it can't plan an economy. Therefore, we must *construct* the continuity normatively, even if it isn't felt psychologically. The "Unified Agent" is a necessary fiction for any long-term cooperation, individual or collective.
