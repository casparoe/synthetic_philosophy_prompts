  In the documentary case, the value is likely ethical or cognitive. We watch to witness truth, honor victims, or cultivate empathy. These are goods that outweigh hedonic costs. The sadness is not a bug but a feature; it signals engagement with reality. If the documentary were edited to remove the sadness, it would likely lose its value. Thus, the negative emotion is constitutive of the value, not merely an instrumental cost. The viewer pursues the experience not to feel good, but to be morally responsive or informed. This requires a theory of value that is not purely hedonistic. If value were only pleasure, watching the documentary would be irrational. Since we deem it rational, our theory of value must accommodate non-hedonic goods.

  Does this distinction dissolve the paradox? It dissolves the psychological contradiction—the claim that we enjoy what we hate. We admit we do not enjoy it. However, a deeper normative paradox survives. If human action is generally guided by seeking good, choosing pain requires explanation. Simply saying "it is valuable" pushes the question back: why is painful truth better than comfortable ignorance? A successful solution must show that the negative emotion is necessary for the valued end. It is not that the pain becomes pleasure, but that the pain becomes meaningful. The pain acts as a testament to the severity of the suffering witnessed. To feel less would be to misunderstand the object.

