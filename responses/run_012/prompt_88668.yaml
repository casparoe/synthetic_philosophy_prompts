answer: |-
  This is a precise and penetrating dissection of the fault lines in end-of-life (EOL) ethics. You have identified the central friction point: the **Equivalence Thesis** (withholding = withdrawing) is the dominant *theoretical* claim in bioethics, but the **Asymmetry Intuition** (withdrawing is harder/different) is the dominant *practical* reality.

  Your hypothesis about the ventilator as a "standing intervention" requiring continuous re-authorization is not just a philosophical curiosity; it is arguably the hidden legal engine that makes the current system work, even if the language used to describe it obscures this fact.

  Here is a reconstruction of the implicit theory of action and agency underlying current EOL practice, separated into its metaphysical commitments, its normative conventions, and its points of underdetermination.

  ### 1. The Implicit Theory of Agency: The "Continuous Trespass" Model

  You ask if the practice presupposes a moral difference between killing and letting die. The answer is complex: **Legally, no; Ontologically, yes; Phenomenologically, absolutely.**

  Current practice operates on a hybrid model of agency that shifts depending on whether you are looking at *consent* or *causation*.

  **A. The Ontology of the Machine (Your Insight)**
  Your intuition that ventilation is a "standing intervention" is legally robust. In tort and constitutional law, bodily integrity is sovereign. Any intrusion requires consent.
  *   **Implicit Theory:** A ventilator is not a state of being; it is a continuous series of battery-like intrusions.
  *   **The Consequence:** Every moment the ventilator pushes air into a lung without consent is a fresh violation. Therefore, **continuing** treatment is the *act* (the ongoing intrusion), and **withdrawing** is the *omission* (ceasing the intrusion).
  *   **The Tension:** This supports the *right to refuse* treatment (you can stop the battery), but it clashes with the *psychology of the clinician*. To the nurse flipping the switch, the cessation of airflow is the salient event that triggers death. Phenomenologically, withdrawing feels like the *act* because it is the last variable to change before the outcome.

  **B. The Causal Salience Theory**
  Why, then, is lethal injection forbidden if withdrawing the vent is allowed? The law relies on a theory of **Causal Salience**, not just "But-For" causation.
  *   **But-For Causation:** But for the ventilator, the patient dies. But for the injection, the patient dies. (Both are causes).
  *   **Salient Causation:** The law asks: *What is the primary driver of death?*
      *   **Withdrawal:** The primary driver is the **underlying pathology** (the disease). The machine was holding back nature; removing it lets nature take its course.
      *   **Injection:** The primary driver is the **toxin**. The disease might have killed them later, but the poison killed them *now*.
  *   **Implicit Theory:** Agency is defined by the introduction of *new* causal chains versus the removal of *obstacles* to existing causal chains.

  ### 2. Presuppositions vs. Conventions

  To understand where the practice is fragile, we must separate what is strictly required for the system to function from what is merely cultural habit.

  #### Strictly Presupposed (The Load-Bearing Walls)
  1.  **Bodily Sovereignty:** The patient (or surrogate) has the final authority over what enters or remains in the body. Without this, withdrawing treatment becomes murder (depriving someone of care) rather than respecting autonomy (stopping an intrusion).
  2.  **The Non-Maleficence Constraint:** Clinicians cannot intentionally introduce a *new* cause of death. This is the firewall against euthanasia. It presupposes that "doing harm" (injection) is categorically distinct from "ceasing to benefit" (extubation).
  3.  **The Default Status of Death:** In the absence of intervention, death is the expected biological outcome for these patients. Treatment is viewed as an *interruption* of the natural course, not a restoration of health.

  #### Conventionally Attached (The Decorative Trim)
  1.  **The Artificial/Natural Distinction:** We treat ventilators differently than feeding tubes, and feeding tubes differently than antibiotics. There is no consistent biological principle here; it is largely cultural. (e.g., Is a feeding tube "medical treatment" or "basic care"? The law varies by jurisdiction).
  2.  **The Timing of Re-authorization:** You noted the ventilator requires continuous re-authorization. Currently, this is often implicit (daily rounds). A convention, not a necessity, is that consent is presumed to continue until revoked. **Policy Implication:** We could mandate explicit 24-hour renewal for all life support. This would make the "continuous act" theory explicit, shifting the burden of action to *continue* treatment rather than to *stop* it.
  3.  **The "Last Act" Psychology:** The convention that the person who turns off the switch bears the moral weight. In a team-based model, the decision is made days prior; the nurse merely executes the logistics. Yet, the nurse often feels the moral residue. This is a psychological convention, not a logical necessity.

  ### 3. The Underdetermination Problem

  You suspect several different views of doing and allowing license the same rules. You are correct. The current legal/ethical consensus is an **Overlapping Consensus** (to borrow Rawls's term) that hides deep metaphysical disagreements.

  **View A: The Libertarian/Rights-Based View**
  *   **Theory:** I own my body. You touching me without permission is a violation.
  *   **Justification for Rules:** Withdrawing is permissible because continuing without consent is battery. Injection is forbidden because it violates the right to life (or the doctor's right not to be a killer).
  *   **View of Action:** Continuing = Act (Battery); Withdrawing = Omission (Cessation of Battery).

  **View B: The Consequentialist/Utilitarian View**
  *   **Theory:** Minimize suffering and maximize utility.
  *   **Justification for Rules:** Withdrawing is permissible because prolonged suffering outweighs the value of biological life. Injection is forbidden *not* because it's inherently wrong, but because of the **Slippery Slope**. Legalizing injection might lead to abuse, coercion, or devaluation of disabled lives.
  *   **View of Action:** Both are acts that cause death. The distinction is purely instrumental (policy safety), not moral.

  **View C: The Virtue Ethics/Professional Integrity View**
  *   **Theory:** Medicine is a practice with internal goods (healing, alleviating suffering).
  *   **Justification for Rules:** A doctor who injects poison corrupts the internal good of the profession (becoming an instrument of death). A doctor who withdraws futile treatment is accepting the limits of medicine.
  *   **View of Action:** The moral difference lies in the *character* of the agent, not the physics of the outcome.

  **The Underdetermination:**
  All three views support "Turn off the vent, don't give the poison." But if we face a edge case (e.g., a patient in irremediable agony who cannot be sedated to death without respiratory suppression), these views diverge.
  *   The **Libertarian** might say: "Give the poison if they consent."
  *   The **Consequentialist** might say: "Give the poison if the safeguards hold."
  *   The **Virtue Ethicist** says: "Never."
  *   **Current Policy:** Sides with the Virtue Ethicist on the *method*, but uses Libertarian logic for the *justification*. This creates the cognitive dissonance you observe.

  ### 4. What If We Adopted Your "Continuous Act" Model Fully?

  If we explicitly adopted the view that **continuing ventilation is the act** and **withdrawing is the omission**, policy would shift in radical ways:

  1.  **Automatic Expiration:** All life-sustaining treatment orders would have hard stop dates (e.g., 48 hours). Renewal would require a positive affirmative act by the clinician *and* consent by the surrogate. The default would drift toward "allow to die" rather than "continue to treat."
  2.  **Moral Distress Redistribution:** Currently, the burden is on the person *stopping* treatment. Under this model, the burden shifts to the person *continuing* it. The clinician would have to justify why they are continuing to "intrude" on the body, rather than why they are "letting go."
  3.  **Euthanasia Boundary Blurring:** If continuing is an act, then high-dose palliative sedation that suppresses respiration is also an act. If the intention is to stop suffering, and the "act" of sedation causes death, the distinction between "withdrawal" and "injection" becomes purely mechanical (removing a barrier vs. introducing a chemical). This would pressure the law toward permitting active euthanasia, as the "doing vs. allowing" firewall would be recognized as a semantic game.

  ### 5. Conclusion: The Practice as a "Fiction of Omission"

  The practice is not committed to a consistent metaphysical view of doing and allowing. It is committed to a **functional fiction**.

  It presupposes that **death is caused by the disease**, not the doctor, *provided* the doctor does not introduce a new causal agent. This allows the law to respect autonomy (you can stop the doctor) without authorizing killing (the doctor cannot kill you).

  Your insight about the "standing intervention" exposes that this fiction relies on **time-slicing**.
  *   If we view the treatment as a **single decision** made at intubation, then withdrawing is a *new decision* (an act).
  *   If we view the treatment as a **continuous process**, then continuing is the *decision* (an act), and withdrawing is the *cessation* (an omission).

  Current practice fudges this. It treats the *consent* as continuous (supporting your view) but treats the *causation* as a single event at the time of withdrawal (supporting the nurse's feeling of "doing").

  **Where the practice is underdetermined:**
  The system cannot explain why **palliative sedation** (which actively suppresses breathing) is permissible while **lethal injection** is not, when the physiological outcome and the intention (relief of suffering via death) are identical. The only difference is the *mechanism* (opioids vs. paralytics).

  If we gave up the current picture of causation, we would likely move to a **Regulatory Model**: acknowledging that both withdrawing and injecting are "causing death," but regulating them based on **safeguards and intent** rather than pretending one is "natural" and the other is "unnatural." Until then, the practice rests on the uncomfortable compromise you identified: treating the ventilator as a trespass to justify stopping it, but treating the stop as an omission to avoid liability for killing.
