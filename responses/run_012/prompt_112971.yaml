          4.  Verdict on Nyāya.
      *   *Key Insight to Highlight:* The distinction between *statistical* certainty (sigma) and *ontological* certainty (vyāpti). The OPERA error wasn't statistical; it was systematic (a break in the causal chain). Nyāya handles systematic error better than statistics do.

  7.  **Refining the content (Self-Correction during drafting):**
      *   *Check:* Did I distinguish between *pratyakṣa* (perception) of the instrument and *anumāna* (inference) of the neutrino speed? Yes, the speed is inferred from the time.
      *   *Check:* Is the SN1987 argument *anumāna* or *śabda*? It's *anumāna* based on recorded data (testimony of detectors) + theory.
      *   *Check:* How to handle the "Collaboration" as a speaker? Nyāya focuses on the *āpta* (trustworthy person). A group can be an *āpta* if the process ensures reliability. But the "hedging" makes it tricky.
      *   *Refinement:* Emphasize that Nyāya would call the initial OPERA claim *saṁśaya* (doubt), not knowledge (*pramā*), precisely because *vyāpti* wasn't established. This aligns with the skeptical community.

  8.  **Final Polish:** Ensure the Sanskrit terms are italicized and contextually clear. Maintain the dignity of the user's background. (e.g., "As you noted regarding precision vs accuracy...")

  **(Self-Correction on Nyāya specifics):**
  *   *Vyāpti:* Invariable concomitance between *Hetu* (Reason/Middle Term) and *Sādhya* (Probandum/Major Term).
  *   *OPERA:*
      *   *Sādhya:* Neutrinos are superluminal.
      *   *Hetu:* Because the timing measurement says so.
      *   *Vyāpti:* "All timing measurements of this sort accurately reflect particle velocity." (This is the weak link).
  *   *Savyabhicāra:* The loose cable is a case where the Hetu (timing reading) exists, but the Sādhya (superluminal speed) does not. Thus, the Hetu is erratic.

  9.  **Finalizing the Verdict:** The framework is robust regarding the *logic* of error, but rigid regarding the *probability* of discovery. It treats science as a search for *vyāpti*, which is actually a good description of the search for causal mechanisms, even if the statistical language differs.

