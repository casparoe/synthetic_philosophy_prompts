prompt: |-
  Hey, is there a name for this? Me and my friends get into arguements about big philosophical stuff and I keep noticing the same shape to them. Like, one friend says he can prove there's a real world outside his head: he holds up his hand and goes "look, here's a hand, so there's at least one real thing." Another friend says you can't know that's a hand, you might be dreaming the whole thing. Or the free will one, where someone says of course I could've chosen otherwise, I chose the other cereal, and the other person says no, given everything you were always gonna pick that one. Nobody's actually messing up the logic, is what gets me -- the first person's argument is totally fine if you accept the thing they're pointing at, and the second person's is fine if you don't, and then they just sit there going in circles forever. Is there an actual name for this exact standoff, where the reasoning goes through either way and the two people just won't give up different starting points? I know it's kind of like begging the question but that doesn't feel like the whole thing. And I don't just want a label -- I want to know what the thing really is, and where it stops being this and starts being some other thing.
