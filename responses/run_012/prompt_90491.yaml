answer: |-
  You have stumbled onto one of the oldest and most frustrating structures in the history of philosophy. You are right: it isn't a logical fallacy in the traditional sense, and "begging the question" is too small a container for it.

  The specific name for the interpersonal standoff is **Deep Disagreement**.

  The name for the epistemological structure (especially regarding your "hand" example) is **The Problem of the Criterion**.

  Here is what the thing really is, why it happens, and where the boundary lies.

  ### 1. What is the thing?
  In a normal argument, two people share a "court of appeal." If we argue about whether it's raining, we can both look out the window. We share a method for verifying truth.

  In the arguments you are describing, your friends are not sharing a court of appeal. They are arguing about **which court has jurisdiction.**

  *   **Friend A (The Hand):** Is operating on **Common Sense Realism**. Their axiom is: *Seeming perceptions are innocent until proven guilty.*
  *   **Friend B (The Dreamer):** Is operating on **Cartesian Skepticism**. Their axiom is: *Seeming perceptions are guilty until proven innocent.*

  Both arguments are logically valid.
  *   If you accept A's axiom, A wins.
  *   If you accept B's axiom, B wins.

  Because the argument is about the *axioms themselves*, there is no neutral ground to stand on to judge them. You cannot use your senses to prove your senses are reliable (that's circular). You cannot use logic to prove logic is reliable (that's also circular).

  This specific dynamic regarding the hand is famously known as **Moore's Shift**. G.E. Moore held up his hand to prove the external world exists. The skeptic says, "You haven't proved you aren't dreaming." Moore effectively says, "I am more certain of this hand than I am of your skeptical logic."

  This is a clash of **Epistemic Frameworks**. It is not a dispute about facts; it is a dispute about *how facts are established.*

  ### 2. The Mechanism: Particularism vs. Methodism
  To understand "what the thing really is," philosophers (specifically Roderick Chisholm) break this down into two opposing approaches to knowledge:

  1.  **Particularism (Your Friend with the Hand):** "I know *this* specific thing is true (I have a hand). Therefore, whatever theory of knowledge I adopt must allow for this fact." They start with specific instances of knowledge and build up.
  2.  **Methodism (Your Skeptical Friend):** "I need a *method* to verify truth first (e.g., 'senses can be deceived'). Until I have a verified method, I cannot claim to know any specific thing." They start with the rules and filter down.

  The "circle" you are noticing is the **Problem of the Criterion**. To know if a method is good, you need to know if it produces true results. To know if results are true, you need a good method. You cannot start either one without assuming the other.

  ### 3. Where does it stop being this?
  You asked where this stops being a "Deep Disagreement" and starts being something else. This is the most important part. There are three boundaries where this standoff dissolves:

  **A. It becomes a Verbal Dispute**
  Sometimes the standoff is just about definitions. In the free will example, if Friend A defines "free will" as "I felt like I chose," and Friend B defines it as "I could have physically done otherwise in a deterministic universe," they aren't arguing about the world; they are arguing about a dictionary.
  *   *The Boundary:* If you can swap the word for a synonym and the disagreement vanishes, it was just verbal.

  **B. It becomes Dogmatism**
  A Deep Disagreement is honest; both sides acknowledge the other's logic is internally consistent. Dogmatism is when one side refuses to acknowledge the other's framework exists.
  *   *The Boundary:* When one friend stops saying "I don't accept that premise" and starts saying "You are stupid for not seeing that premise," it has ceased to be philosophy and become tribalism.

  **C. It becomes Pragmatism (The Escape Hatch)**
  This is where the circle is usually broken. Since you cannot prove your starting point is *True* (with a capital T), you argue that it is *Useful*.
  *   *The Boundary:* The argument stops being about "Which is real?" and starts being about "Which allows us to live better?"
      *   *Example:* "I can't prove I'm not dreaming. But if I act as if I'm not, I can eat and not starve. If I act as if I am dreaming, I starve. Therefore, I choose the 'Real World' framework."
      *   This is the **Pragmatic Turn**. It stops being a truth-claim and becomes a tool-selection.

  ### 4. Why it feels like "Begging the Question"
  You mentioned it feels like *begging the question* (circular reasoning). You are right, but it is **Systemic Circularity**, not **Logical Circularity**.

  *   **Logical Circularity:** "I am trustworthy because I say I am." (This is a flaw in a single argument).
  *   **Systemic Circularity:** "My entire worldview rests on this axiom, and I use my worldview to justify the axiom." (This is unavoidable for any human being).

  Every human being has a "bedrock." If you keep asking "Why?" to someone's beliefs, eventually they will say, "This is just where my spade is turned," as Wittgenstein put it. Your friends are just hitting their bedrock at different depths.

  ### Summary
  *   **The Name:** **Deep Disagreement** (interpersonal) or **The Problem of the Criterion** (structural).
  *   **The Thing:** A clash of **First Principles** or **Epistemic Frameworks**.
  *   **The Boundary:** It stops being this when the argument shifts from **Truth** (which is unprovable here) to **Utility** (pragmatism) or **Definition** (verbal dispute).

  **How to handle it:**
  Next time this happens, don't try to win the truth claim. Say: *"I think we are having a Deep Disagreement. We are using different bedrock axioms. Neither of us can prove our bedrock to the other. So, which bedrock is more useful for the life we want to live?"*

  That usually breaks the circle.
