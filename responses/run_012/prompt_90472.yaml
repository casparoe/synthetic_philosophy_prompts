prompt: |-
  I write about medicine, law, and ideas for a general readership, and I keep running into a cluster of arrangements that look coherent until you set them side by side.

  Start with the instructions a competent adult leaves about her own future medical care. In many jurisdictions, if I sign a document refusing a specific treatment — dialysis, a blood transfusion, ventilation — while I have capacity, that refusal stays binding after I lose capacity, and clinicians are expected to let me die even if, in the fog of dementia or delirium, I now seem to want the treatment. The directive is the last word. But the converse is not true. I generally cannot, in advance, oblige anyone to keep me on a ventilator, or to provide a treatment a clinician regards as futile, or to help me die; advance requests for treatment bind no one, and the jurisdictions that permit assisted dying have generally insisted on a fresh, contemporaneous request at the end, with the rare written-advance-request exceptions fiercely contested.

  Now set beside that the devices we use for self-control. Gambling regulators and operators run self-exclusion schemes that bar a person from casinos and betting sites; someone can put herself on the list and have it enforced against her later self, with consequences for her if she tries to play anyway. Many such schemes, however, build in a delay: you cannot lift the ban the day you ask; you must wait days, weeks, or months. And then consider the contracts the law will not enforce at all — you cannot sell yourself into slavery, cannot consent now to being killed later, and in most places cannot irrevocably sell a kidney, no matter how informed and competent the earlier you was.

  So the law lets my earlier self forbid but not command; it binds my later self against her apparent will, but not completely and not everywhere; and it refuses to enforce the very contracts that would most resemble a sale of my future autonomy. I suspect the whole apparatus presupposes a position about what makes a person's will authoritative over time — about whether the signer of the document and the patient in the bed count, for these purposes, as the same agent, and if they do, why the earlier one wins.

  I want that position reconstructed, in plain prose, for a reader who is comfortable with ideas but not with the literature. What theory of the authority of the earlier self does this cluster of practices presuppose? Is it a claim about personal identity — that the two are one enduring person, so the earlier choice simply is her choice? A claim about autonomy as a kind of sovereign plan that later selves are bound to honor? Something about protecting the self against its own episodic weakness? Which rival views does the practice quietly rule out? Does it presuppose one consistent theory, or does it need several at once? And where is it underdetermined — where would incompatible theories license exactly what we already do? I want the load-bearing commitments separated from the decoration: what the practice strictly requires, and what it merely fits comfortably with.

  Then take the alternatives seriously. If we replaced the presupposed view with the claim that only the present, currently competent self has authority over her own body and treatment, what would have to change — which practices would survive, which would collapse, and what would take their place? If instead we made the earlier self fully sovereign, what would follow? Reason it out rather than pointing me to authorities; I am after the structure of the commitments, not a reading list.
reasoning: |-
  Here's a thinking process that leads to the suggested essay:

  1.  **Analyze the Request:**
      *   **Topic:** The legal and ethical asymmetry of advance directives (refusals bind, requests don't), self-exclusion schemes (gambling), and unenforceable contracts (slavery, organ sales).
      *   **Core Question:** What theory of personal identity and autonomy underlies this cluster of practices? Why does the "earlier self" have authority to forbid but not to command? Why is the "later self" bound by refusal but not by request?
      *   **Target Audience:** General readership comfortable with ideas but not academic literature. Plain prose.
      *   **Specific Tasks:**
          1.  Reconstruct the presupposed position (the "orthodox" view).
          2.  Identify load-bearing commitments vs. decoration.
          3.  Explore alternatives (Present Self Sovereignty vs. Earlier Self Sovereignty).
          4.  Reason out the consequences of these alternatives on current practices.
          5.  Avoid citing authorities/reading lists; focus on structure of commitments.

  2.  **Deconstruct the Phenomenon:**
      *   *Advance Directives (ADs):* Refusals stick (Ulysses contract against treatment). Requests don't stick (cannot demand futile care or assisted dying in advance).
      *   *Self-Exclusion:* Can ban future self from gambling. Cooling-off periods exist.
      *   *Inalienable Rights:* Cannot sell self into slavery or sell organs.
      *   *The Asymmetry:* Past self can veto present self's desire for life/treatment, but cannot compel present self to endure suffering/treatment. Past self can restrict freedom, but cannot dispose of the core self.

  3.  **Identify the Underlying Theory (The "Orthodox" View):**
      *   *Is it Personal Identity?* Not strictly metaphysical (Lockean memory, etc.). The law treats them as the *same* person for liability and rights, but *different* agents for specific decisions.
      *   *Is it Autonomy?* Yes, but a specific kind. "Critical Interests" vs. "Experiential Interests" (Dworkin's distinction is useful here, even if not named). The earlier self represents the "narrative" or "values" self; the later self represents the "immediate experience" self.
      *   *The Core Principle:* **Negative Liberty as Protection, Positive Liberty as Limitation.** The earlier self is trusted to protect the *integrity* of the life story (refusing undignified treatment), but not trusted to dictate the *content* of future suffering (demanding futile care).
      *   *The "Harm Principle" Twist:* The state intervenes to prevent the earlier self from destroying the later self's capacity for *any* agency (no slavery), and to prevent the later self from undoing the earlier self's *dignity* (no forced treatment).
      *   *Load-Bearing Commitment:* The "Earlier Self" is the guardian of *values*, the "Later Self" is the guardian of *welfare/experience*. The law prioritizes values when they restrict harm (refusal), but prioritizes welfare when values demand harm (request).
      *   *Rival Views Ruled Out:*
          *   Strict Presentism (only now matters).
          *   Strict Unitary Sovereignty (earlier self rules completely).
          *   Pure Metaphysical Identity (if we are the same, all contracts should stick).

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Hook the reader with the paradox. The "Ulysses Pact" asymmetry.
      *   **The Orthodox Theory (The "Stewardship" Model):**
          *   It's not about identity (we are the same person).
          *   It's about *competence* and *values*.
          *   The Earlier Self is the "Architect"; the Later Self is the "Occupant."
          *   The Architect can lock the doors (refusal) to protect the design.
          *   The Architect cannot force the Occupant to live in a burning building (demand futile care).
          *   *Key Distinction:* Negative rights (freedom from) travel through time better than positive rights (entitlements to).
          *   *Inalienability:* You can't sell the factory (slavery/organs) because that destroys the possibility of future agency.
      *   **Load-Bearing vs. Decoration:**
          *   *Required:* Distinction between protecting integrity vs. imposing burden. Protection of the *capacity* for agency.
          *   *Decoration:* Specific waiting periods, specific forms.
      *   **Alternative 1: Present Self Sovereignty:**
          *   Only the person in the bed matters.
          *   *Consequences:* Advance directives vanish. If dementia patient wants food, you feed them, even if AD says starve. Self-exclusion bans voidable instantly.
          *   *Problem:* Tragedy of the "broken" self. Loss of life-narrative control.
      *   **Alternative 2: Earlier Self Sovereignty:**
          *   The signature rules forever.
          *   *Consequences:* Can demand futile care. Can pre-authorize assisted dying (even if happy in dementia). Can potentially sell organs (if contract is binding).
          *   *Problem:* Tyranny of the dead hand. Cruelty to the experiencing self.
      *   **Synthesis/Conclusion:** The current system is a messy compromise. It values the *story* of a life but refuses to sacrifice the *creature* living it for the sake of the plot.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Make sure not to lean too heavily on Ronald Dworkin's terminology ("critical vs. experiential") without explaining it simply. The prompt asks for plain prose.
      *   *Nuance:* The prompt asks about the "underdetermined" areas. Where do incompatible theories license the same practice?
          *   *Example:* Both a "Sanctity of Life" view and a "Autonomy" view might ban assisted dying, but for different reasons. I need to highlight where the *reasoning* diverges but the *outcome* is the same.
          *   *Actually, looking closer:* The prompt asks where the *current practice* is underdetermined. Where could different theories justify the *status quo*?
          *   *Idea:* The ban on slavery. A libertarian might hate it, a paternalist loves it. But the practice exists. The *justification* is the load-bearing part. I need to isolate the justification the practice *actually* relies on, not just any justification that fits.
          *   *Refinement:* The practice relies on the idea that autonomy is a *capacity* that cannot be autonomously destroyed. That's the load-bearing beam.
      *   *Check:* Did I address the "refusal binds, request doesn't" asymmetry clearly? This is the crux.
      *   *Explanation:* Refusal preserves the boundary of the self. Request imposes on the resources/conscience of others (doctors) and the welfare of the self.
      *   *Wait, one more thing:* The prompt asks about the "earlier self vs. later self" authority.
      *   *Key Insight:* The law treats the Earlier Self as a *Fiduciary* for the Later Self. A fiduciary can protect assets (refuse harmful/undignified intrusion) but cannot squander them (demand waste) or sell the trust (slavery).

  6.  **Final Polish:**
      *   Tone: Analytical, essayistic, clear.
      *   Structure: Introduction -> The Reconstructed Theory -> Load-Bearing vs. Decoration -> Alternative 1 (Presentism) -> Alternative 2 (Past Sovereignty) -> Conclusion.
      *   Ensure the "plain prose" constraint is met. No jargon without explanation.

  7.  *(Self-Correction on "Underdetermined"):* I need to be careful here. The prompt asks: "Where is it underdetermined — where would incompatible theories license exactly what we already do?"
      *   *Example:* We ban slavery.
      *   *Theory A:* Paternalism (You are too stupid to know it's bad).
      *   *Theory B:* Liberal Neutrality (You cannot consent to lose the capacity to consent).
      *   *Both license the ban.* But the *current practice* usually leans on B (autonomy-based) rather than A (wisdom-based) in medical law contexts. I should point out that the *practice* looks like B, even if A could justify it.
      *   *Actually, better angle:* The practice of honoring AD refusals.
      *   *Theory A:* The Earlier Self *is* the patient (Identity).
      *   *Theory B:* The Earlier Self is a proxy for best interests (Best Interests).
      *   *Both license honoring the AD.* But they diverge on *why*. The load-bearing commitment is that the Earlier Self's *values* trump the Later Self's *experience*.

      *Let's stick to the prompt's focus:* The asymmetry. Why refusal works but request doesn't.
      *   *Theory:* Autonomy as a Shield, not a Sword.

      *Okay, ready to write.*
answer: |-
  The cluster of practices you describe forms a coherent system, but only if you accept a specific, somewhat subtle theory about who we are over time. The law does not treat you as a single, static entity, nor does it treat you as a series of unrelated strangers. Instead, it operates on a theory of **stewardship**.

  Here is the reconstruction of that theory, the commitments that hold it up, and what would happen if we pulled them out.

  ### The Theory of the Steward

  The prevailing legal and ethical framework presupposes that your life is a narrative project, but one that is lived by a biological organism. This creates a division of labor between your "Earlier Self" (the competent planner) and your "Later Self" (the experiencing patient or actor).

  In this view, the Earlier Self is not a dictator, but a **fiduciary**. A fiduciary is someone entrusted to manage assets for the benefit of another. The law treats your Earlier Self as the guardian of your life's *integrity*, while the Later Self is the guardian of your *welfare*.

  This explains the asymmetry you noticed:

  1.  **Refusals Bind (The Shield):** When you sign an advance directive refusing treatment, you are setting a boundary. You are saying, "Do not cross this line." The law honors this because it views the Earlier Self as the best judge of what constitutes a violation of your dignity. If your Later Self, confused by dementia, asks for the very treatment you forbade, the law assumes the Later Self's capacity for judgment is compromised. To honor the refusal is to protect the *narrative integrity* of your life from being hijacked by a compromised mind. It is a negative right—a right to be left alone—and negative rights travel well through time.
  2.  **Requests Do Not Bind (The Sword):** When you sign a directive demanding treatment, or asking for assistance in dying, you are trying to command resources or impose an end. The law hesitates here because it prioritizes the *welfare* of the Later Self. If you demand futile care, you are asking the Later Self to endure suffering for no medical gain. If you demand death in advance, you are asking to terminate the Later Self's existence, potentially while that Self is still content. The Earlier Self cannot sacrifice the Later Self's welfare on the altar of the Earlier Self's values.
  3.  **Inalienable Rights (The Core):** You cannot sell yourself into slavery or sell a kidney because these acts destroy the *capacity* for future agency. The law views autonomy not just as a thing you have, but as a condition you must remain in. You can use your freedom, but you cannot extinguish it. To allow the Earlier Self to sell the Later Self's body is to allow the fiduciary to liquidate the trust's principal.

  **What This Rules Out**
  This system quietly rejects two rival views:
  *   **Strict Presentism:** The idea that only the currently conscious mind matters. If this were true, advance directives would be void the moment capacity faded.
  *   **Strict Unitary Sovereignty:** The idea that the signer is an absolute monarch over their future. If this were true, you could pre-authorize assisted dying while healthy, or force doctors to perform futile CPR.

  ### Load-Bearing Commitments vs. Decoration

  To keep this system standing, certain beams are essential. Others are merely decorative.

  **Load-Bearing Commitments:**
  1.  **Competence is the Switch:** The authority of the Earlier Self depends entirely on the presumption that the Later Self lacks capacity. If the Later Self is competent, the Earlier Self's instructions usually vanish. The system requires a binary switch: either you are the author of your life, or you are the subject of protection.
  2.  **Negative Liberty Trumps Positive Liberty:** The right to *refuse* interference is stronger than the right to *demand* assistance. This is why you can refuse a blood transfusion and die, but you cannot demand a blood transfusion that a doctor deems unnecessary.
  3.  **The Indestructibility of Agency:** You cannot consent to the permanent loss of your ability to consent. This is why slavery contracts and irrevocable organ sales are void. The system presupposes that there is a "core self" that must remain available to change its mind, even if the Earlier Self tries to lock the door.

  **Decoration:**
  1.  **Waiting Periods:** The specific delays in gambling self-exclusion (e.g., waiting six months to lift a ban) are policy choices, not theoretical necessities. They could be a day or a year without collapsing the theory.
  2.  **Formalities:** Whether a directive requires a witness or a notary is procedural. The core commitment is the existence of the instruction, not the ink.
  3.  **Specific Medical Definitions:** What counts as "futile" changes with technology. The principle that you cannot demand futile care is the beam; the definition of futility is the drywall.

  **Where It Is Underdetermined**
  There are places where incompatible theories justify the same practice. For example, the ban on assisted dying via advance directive could be justified by **Sanctity of Life** (the state protects life regardless of will) or by **Protective Paternalism** (the Later Self might be happy in dementia). Both lead to the same result (no advance euthanasia), but they imply different futures. If the ban is based on Sanctity of Life, it should apply to competent people too. If it is based on Protecting the Later Self, it should lift if the Later Self is suffering. The current practice hovers between these without deciding, which allows the system to function without resolving the deeper moral conflict.

  ### Alternative 1: Present Self Sovereignty

  Suppose we adopt the view that only the currently competent, experiencing self has authority. The Earlier Self is merely a advisor; the Later Self is the king.

  **What Collapses:**
  *   **Advance Directives:** These become non-binding expressions of preference. If a dementia patient asks for food, you feed them, even if their directive says "no artificial nutrition." The "fog" of dementia does not negate their current will; it just changes it.
  *   **Self-Exclusion:** Gambling bans become instantly revocable. If I want to gamble today, my past agreement to stop is irrelevant. The "cooling-off" period is an insult to my current sovereignty.
  *   **Organ Sales:** This might actually become *more* permissible. If I am competent now, and I want to sell a kidney, why should my future self's need for that kidney veto my current desire for cash? The ban on slavery would likely remain, but only because slavery destroys the *current* capacity to consent, whereas selling a kidney is a one-time transaction.

  **What Replaces It:**
  *   **Best Interests Standard:** Doctors and courts would make decisions for incapacitated patients based solely on what seems best for them *now*, ignoring past values.
  *   **Voluntarism:** Contracts would be binding only as long as the person wants them to be. This creates instability. You cannot plan for your future, because your future self can cancel the plan.

  **The Cost:**
  We lose the ability to shape the narrative of our lives. We become a series of moments, disconnected from our past values. A person who valued independence above life itself would be forced to live in a state they find undignified, simply because their diseased brain now fears death.

  ### Alternative 2: Earlier Self Sovereignty

  Suppose we adopt the view that the competent signer is the absolute sovereign. The Later Self is merely the execution of the Earlier Self's will.

  **What Changes:**
  *   **Advance Requests Bind:** If you sign a paper demanding ventilation, doctors must provide it, even if they consider it futile. If you sign a paper requesting euthanasia in the event of dementia, it must be carried out, even if you are now smiling and eating ice cream.
  *   **Irrevocable Contracts:** You could sell a kidney irrevocably. You might even be able to sign a contract for indentured servitude (though slavery might still be banned on public policy grounds unrelated to consent).
  *   **Self-Exclusion:** You could make a gambling ban permanent and unbreakable. The Later Self would have no right to appeal.

  **What Collapses:**
  *   **Clinical Judgment:** Doctors become technicians executing orders, regardless of medical reality.
  *   **Protection of the Vulnerable:** The smiling dementia patient is killed because their past self decided life wasn't worth living. The system loses its safety valve for when the "plan" no longer fits the "reality."

  **The Cost:**
  This creates a tyranny of the dead hand. It assumes the Earlier Self is infallible and that values never change. It treats the Later Self as a puppet. It risks enforcing cruelty in the name of consistency.

  ### The Structural Verdict

  The current system is a compromise. It admits that we are the same person over time, but that our *capacities* change. It grants the Earlier Self the power to protect the *boundaries* of the life (refusals), but denies them the power to dictate the *contents* of the suffering (requests).

  It is a system designed to prevent the worst outcomes of both alternatives: it prevents the Later Self from squandering the life the Earlier Self built (by honoring refusals), but it prevents the Earlier Self from sacrificing the Later Self on a principle (by ignoring requests for futile care or pre-authorized death).

  The load-bearing commitment is this: **Autonomy is the right to protect your dignity, not the right to destroy your welfare.** The law assumes you are wise enough to know what you cannot tolerate, but not wise enough to know what you will want in a future you cannot imagine. It trusts your "No" more than your "Yes," because a "No" preserves the future, while a "Yes" can close it down.

  If you want to write about this, the tension lies in that trust. We trust the past self to guard the gate, but we do not trust it to drive the car. That is the quiet, inconsistent, deeply human logic of the law.
