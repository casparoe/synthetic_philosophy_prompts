answer: |-
  Here is a specification of the adequacy conditions for a theory of perceptual experience, structured for your seminar. It is designed to be neutral between competing accounts (Sense-Data, Representationalism, Disjunctivism) while making explicit the pressures the Argument from Illusion places on any candidate.

  ***

  # Specification of Adequacy for a Theory of Perceptual Experience
  **Context:** Response to the Argument from Illusion
  **Goal:** To define the explanatory burden prior to evaluating specific ontological commitments.

  ## I. The Phenomenological Catalogue (The Cases)
  A viable theory must provide an ontology and a taxonomy for the following five types of episodes. It must not assume away the ambiguity of the borderline cases.

  1.  **Ordinary Veridical Perception**
      *   **The Case:** A subject perceives a mind-independent object (e.g., a red mug) which is present, and the experience matches the object's properties.
      *   **The Requirement:** The theory must explain the sense in which the *object itself* is present to consciousness, not merely a representation of it. It must account for the intuition that in successful cases, the world is "open" to the subject.
  2.  **Classical Illusion**
      *   **The Case:** A subject perceives a mind-independent object (e.g., a straight stick), but one or more apparent properties do not match the actual properties (e.g., the stick looks bent in water).
      *   **The Requirement:** The theory must explain how an object can be perceived *as* having a property it lacks without implying the subject is perceiving a *different* object (a bent sense-datum). It must distinguish the *look* of the object from the *nature* of the object.
  3.  **Total Hallucination**
      *   **The Case:** A subject has an experience indistinguishable from veridical perception (e.g., seeing a pink rat), but no relevant mind-independent object is present.
      *   **The Requirement:** The theory must account for the phenomenal reality of the episode without positing a mind-independent object. It must explain what the subject is aware of, if anything, and how this state is possible given the same neural/psychological mechanisms as veridical perception.
  4.  **The Hybrid / Partial Hallucination**
      *   **The Case:** A subject looks at a real object (a mug), but an apparent property is contributed by the subject rather than the object (e.g., the mug looks chipped, but the chip is not there, perhaps due to expectation or projection).
      *   **The Requirement:** The theory must classify this episode. Is it a species of illusion (misrepresentation of an object)? A species of hallucination (presence of a non-existent property)? Or a distinct ontological category? The theory cannot simply assume a binary of "Object Present" vs. "Object Absent"; it must handle cases where *some* object is present but *some* content is generated internally.
  5.  **Bodily and Phantom Perception**
      *   **The Case:** Sensations seemingly located in the subject's own body, including phantom-limb sensations where the limb is absent.
      *   **The Requirement:** The theory must declare its scope. Is the paradigm of perception "awareness of the external world," with bodily awareness treated as a derivative or distinct system? Or is the theory general enough to cover proprioception and somatic sensation? If the latter, it must explain how a "phantom limb" fits the ontology (e.g., is it a hallucination of the body, or a veridical perception of a neural state?).

  ## II. The Conceptual Boundaries (The Distinctions)
  A viable theory must preserve the following distinctions. Collapsing them constitutes a failure of the theory.

  1.  **Phenomenal Character vs. Epistemic Standing**
      *   **The Distinction:** How an experience feels (phenomenology) is distinct from whether that experience justifies belief (epistemology).
      *   **The Requirement:** The theory must allow that a hallucination can be phenomenally identical to a veridical perception (same "feel") while having zero epistemic warrant regarding the external world. Conversely, it must allow that two experiences could theoretically differ phenomenally while offering the same epistemic warrant. The "feel" cannot be the sole guarantor of truth.
  2.  **Causal Role vs. Epistemic Role**
      *   **The Distinction:** The object's role in *producing* the experience is distinct from the experience's role in *justifying* a belief about the object.
      *   **The Requirement:** The theory must not conflate the causal chain (light hits retina, etc.) with the normative relation (seeing *gives reason* to believe). A theory that reduces the epistemic relation to merely the final link in a causal chain risks losing the normative force of perception (the "Given").
  3.  **Experiential Content vs. Judgmental Content**
      *   **The Distinction:** What is presented in the experience is distinct from what the subject judges to be the case.
      *   **The Requirement:** The theory must accommodate the gap between appearance and belief. I can experience the Müller-Lyer lines as unequal while judging them to be equal. The theory must locate the "illusion" in the experience, not in the judgment, without making the experience itself a form of false judgment.

  ## III. The Empirical Constraints (The Results)
  A viable theory must be consistent with established findings in psychophysics and cognitive science. It cannot treat perception as a purely philosophical abstraction.

  1.  **Perceptual Constancy**
      *   **The Fact:** We perceive objects as having stable properties (size, shape, color) despite radical variations in sensory input (retinal projection, lighting).
      *   **The Requirement:** The theory must explain how the *immediate* object of experience can be the constant property rather than the variable sensory stimulation, without positing an unconscious inference that turns sensation into perception.
  2.  **Cross-Modal and Adaptation Effects**
      *   **The Fact:** Perception in one modality affects another (e.g., the McGurk effect), and sustained stimulation alters subsequent perception (e.g., motion after-effects).
      *   **The Requirement:** The theory cannot treat sensory modalities as hermetically sealed logical atoms. It must account for the unity of the perceptual field and the plasticity of the perceptual system.
  3.  **Cognitive Impenetrability (Belief-Insensitivity)**
      *   **The Fact:** Perceptual experience often remains insensitive to the subject's beliefs (e.g., the bent stick looks bent even when I believe it is straight).
      *   **The Requirement:** The theory must explain why the "flow" of information is not fully reversible. If perception is a form of representation or judgment, why can't belief correct the representation instantly? The theory must preserve the *passivity* of perception against the *activity* of cognition.

  ***

  ## IV. Structural Analysis of the Specification
  You requested a verdict on the internal dynamics of this list: specifically, which requirement is most exclusionary, and whether any requirements are jointly unsatisfiable.

  ### 1. The Most Exclusionary Requirement
  Your suspicion is largely correct, but requires precise framing. The single requirement that does the most work in excluding candidates is **The Requirement of Subjective Indistinguishability** (derived from Case 3: Total Hallucination and Distinction 1: Phenomenal/Epistemic).

  *   **Why:** This requirement demands that a theory explain how a state with no object (hallucination) can be subjectively identical to a state with an object (veridical).
  *   **The Squeeze:**
      *   **Sense-Data Theories** satisfy this easily by positing a common mental object in both cases, but they fail the **Veridical Perception Requirement** (Case 1) because they deny direct contact with the external world.
      *   **Disjunctivism** satisfies the **Veridical Perception Requirement** by positing a fundamental metaphysical difference between the two states, but it struggles to satisfy the **Indistinguishability Requirement** without smuggling in a "common factor" (which would collapse it into Representationalism or Sense-Data theory).
      *   **Representationalism** attempts to thread the needle by positing common *content* but different *relations* to the world, but often struggles with the **Hybrid Case** (Case 4) and the **Cognitive Impenetrability Constraint** (Result 3).

  Therefore, the Indistinguishability Requirement is the "gatekeeper." It forces every theory to make a costly trade-off between metaphysical directness (Realism) and explanatory simplicity regarding hallucination (Common Kind).

  ### 2. Jointly Unsatisfiable Requirements (The Perceptual Trilemma)
  There is a structural tension within this specification that suggests three of your criteria form an inconsistent triad. A theory can satisfy any two, but not all three simultaneously without significant qualification. This is the modern formulation of the Argument from Illusion.

  **The Trilemma:**
  1.  **The Directness Requirement:** Veridical perception involves a direct relation to the mind-independent object (Case 1).
  2.  **The Common Kind Assumption:** Veridical perception and Total Hallucination are fundamentally the same kind of mental state (implied by the Indistinguishability Requirement).
  3.  **The Possibility of Hallucination:** It is possible to have the experience without the object (Case 3).

  **The Inconsistency:**
  *   If you accept **(1) and (2)**, you must deny **(3)**. (If the state is the same kind, and one requires an object, both require an object. Hallucination becomes impossible or is redefined as perceiving a different object.)
  *   If you accept **(2) and (3)**, you must deny **(1)**. (If the state is the same kind, and one lacks an object, neither essentially involves an object. Direct Realism fails; you get Sense-Data or Representationalism.)
  *   If you accept **(1) and (3)**, you must deny **(2)**. (If veridical needs an object and hallucination lacks one, they cannot be the same fundamental kind. You get Disjunctivism.)

  **Conclusion for the Seminar:**
  The most interesting result your list yields is that **The Directness Requirement** and **The Common Kind Assumption** are jointly unsatisfiable given the **Possibility of Hallucination**.

  This means the primary task of the seminar is not to ask "Which theory fits the data?" but "Which of these three constraints is the candidate theory willing to relax?"
  *   **Sense-Data** relaxes Directness.
  *   **Disjunctivism** relaxes the Common Kind Assumption.
  *   **Intentionalism/Representationalism** attempts to redefine Directness to save Common Kind.

  Your specification successfully isolates this trilemma as the central problem, making the "Hybrid Case" and "Bodily Perception" the stress tests to see which solution is most robust.
