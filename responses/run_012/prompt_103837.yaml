prompt: |-
  I have no academic training in philosophy, but I have read a fair amount on my own about the case Margalit makes for a duty to remember — that a community owes it to its dead, and to itself, to keep certain things present — and about the opposing case Rieff makes, that collective memory often keeps old conflicts alive and that forgetting is sometimes the more decent option. I would like you to compare the two, not in general but on a point I think both leave murky. I have come to separate two things we call forgetting: losing the information, so that I can no longer tell you what happened, and losing the grip, so that I still know exactly what happened but it no longer moves me to act or to hate. If the duty to remember is a duty to keep the record, that is one thing; if it is a duty to stay moved, it is another. Work out which of the two each side is really committed to, and whether their disagreement survives that separation or dissolves into two claims that never actually contradicted each other; then tell me honestly whether the distinction does real work or collapses — as it might if you cannot hold on to the information without retaining some grip on it. Say how confident you are in what you conclude and single out the point you are least sure of, flagging especially where you are reconstructing what either writer holds rather than reasoning from the ideas themselves. No citations or page references, please; I won't be checking them.
