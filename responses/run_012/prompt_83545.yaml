prompt: |-
  I work on distributed systems — consensus, replication, that whole world. So I know the two generals problem cold, I've built things on top of channels that drop messages, and I'm comfortable with the usual kit: runs of a system, local states, happens-before, a process's knowledge as the set of global states consistent with what it's seen locally, Byzantine vs fail-stop, that kind of thing. I've never studied game theory though, and I keep hearing that alot of results in epistemic game theory turn on "common knowledge of rationality" — the players are rational, and each knows the others are, and knows that they know, and so on up. Apparently that's what's supposed to license iterated elimination of dominated strategies, backward induction down a long centipede, nobody defecting in a finitely repeated prisoner's dilemma.

  Restate that whole setup in my vocabulary: the assumption, what it's supposed to buy you, and the complaints people make about it. Translation first. What is common knowledge when I say it in terms of runs, local states and knowledge operators — is the infinite regress doing any real work, or is it equivalent to some finite-depth or fixpoint condition? Is there an analogue of two generals here, i.e. is the reason real people don't play the backward-induction way the same phenomenon as two parties never being able to coordinate over a lossy channel, or is that a false friend? When an economist says rationality is common knowledge, what exactly in my picture is being assumed to have what property — and is "rational" closer to "correct/non-Byzantine" or to something my vocabulary can't typecheck at all?

  Then the residue report, which is the part I actually want, so don't be diplomatic about it. Which claims come over cleanly and keep their bite; which ones I can only say by distorting something (I suspect knowledge vs believing-with-probability-1 is where I'll get into trouble, and whatever the common-prior assumption is doing, and the fact that in my world the state of the world doesn't normally include the other processes' beliefs about my beliefs — or does it, once I let the state space be big enough?); and what has no counterpart in my vocabulary whatsoever. Don't just relabel rationality as protocol compliance and declare that the game theorists were doing coordination theory all along.

  Last thing: for each bit of residue, tell me whether the gap is my vocabulary missing something — some notion of a reason for acting, or of a norm, that a set of runs just doesn't have — or whether it's a sign the economists are smuggling in an assumption they can't really state, like mutual certainty about other people's reasoning that no one could be entitled to in a population of fallible agents. I half-remember someone claiming common knowledge of rationality is unattainable rather than just rarely true, and that the epistemic conditions for equilibrium are subtler than "everyone is rational and knows it" — if that's a real thread, pull on it. No citations or reading lists please, I'm not going to look them up, I just want to see what survives being said in my language and what doesn't.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

