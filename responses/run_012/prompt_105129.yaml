answer: |-
  **The Shadow Check**

  The air in the Civic Chamber smelled of ozone and stale coffee. Elena rubbed her temples, staring at the holographic display hovering above the central dais. Proposal 44-B: Westside Rezoning. It was dense with data—traffic models, carbon projections, affordability indices. All of it pointed in one direction: up. High-density mixed-use towers were the only mathematical way to meet the city's housing targets without sprawling into the greenbelt.

  Elena hadn't wanted this job. When the notification came six months ago—*You have been selected for Stage One*—she'd almost declined. But the stipend was significant, and her freelance design work was drying up. So she accepted, was drawn again in Stage Two, and found herself here, one of ninety souls tasked with governing Oakhaven. No campaigns, no donors, just ninety neighbors chosen by the blind hand of the algorithm.

  "Facilitator," called Marcus, a retired teacher sitting to Elena's left. "Can we review the Audit parameters again?"

  The Facilitator, a neutral civil servant named Sarah, nodded. "The Counterfactual Audit is standard. Once you vote, we draw a Shadow Sample of five hundred residents who were not selected for the Lottery. They are polled on what they *would* have decided based on the public summary. If the variance between your vote and their projected vote exceeds fifteen percent, the decision is voided and sent to a Second Lottery."

  Elena felt the familiar knot in her stomach. This was the twist that kept them all awake at night. The theory was elegant: the Assembly deliberates to find the *best* answer, but the Audit ensures they don't drift too far from the *people's* will. It was supposed to be a safety valve against elitism.

  "But they don't get the briefing books," Elena said, her voice echoing slightly in the quiet chamber. "The Shadow Sample gets a one-page summary. We've spent three weeks reading the technical appendices. We know about the soil stability issues on the west ridge. They don't."

  "That is the design," Sarah said gently. "The Audit measures intuitive legitimacy, not informed judgment. It tests whether you are still recognizable as the population."

  "So if we do our job correctly," Marcus muttered, "if we actually learn something the public doesn't know, we fail the Audit."

  The room shifted uncomfortably. This was the secret tension of the Civic Lottery. Were they a mirror or a filter? The selection process claimed they were a mirror—a microcosm of Oakhaven. But the deliberation process treated them as a filter—straining out ignorance to leave behind wisdom. The Audit forced the filter to pretend it was still a mirror.

  Elena looked at the proposal again. If they voted for the high-density towers, she knew the Shadow Sample would reject it. She knew her own neighbors; she knew the fear of changed skylines and crowded schools. The raw public instinct was protectionism. The deliberated judgment was necessity.

  "If we vote no," said Priya, a young nurse on the Review Panel who had joined them for this session, "we fail the city. The housing crisis doesn't pause for our popularity contest."

  "And if we vote yes," Marcus countered, "we get voided. Then a Second Lottery draws ninety new people. And what happens then? The new group sees that the first group got voided for voting yes. They'll vote no to stay safe. We just delay the inevitable."

  Elena realized then where the real power lay. It wasn't in this room. It was out there, in the inboxes of the five hundred Shadow Samplers. If you wanted to control the city, you didn't lobby the Assembly. You didn't need to convince ninety people who were locked in a room with experts and forced to read the data. You campaigned to the Shadow Sample. You flooded the public feeds with simplified narratives. You made sure the one-page summary sounded terrifying.

  The lobbyists hadn't come to the Chamber much lately. Why bother? They were busy gaming the Audit.

  "We have to vote," Sarah reminded them. "The clock is ticking."

  Elena looked around the room. She saw the fatigue. She saw the desire to do good warring with the desire to not be humiliated by a voided decision. To be voided was to be told: *You thought you knew better, but you aren't us.*

  "If we vote yes," Elena said slowly, "can we amend the summary?"

  Sarah hesitated. "The public summary must be neutral."

  "Neutral isn't the same as unintelligible," Elena pressed. "If we write the summary ourselves, explaining *why* the towers are necessary in plain language... maybe the Shadow Sample votes with us."

  "That risks manipulation," Sarah warned. "You could frame the question to guarantee compliance."

  "Isn't that what deliberation is?" Elena asked. "Framing the question so people understand the stakes?"

  The room fell silent. This was the edge of the cliff. If they wrote the summary, they were influencing the Audit. If they didn't, the Audit would punish them for knowing too much.

  Elena raised her hand. "I move we vote yes on the rezoning. But I also move we attach a visual annex to the public summary. Not data. Pictures. Show them what the greenbelt looks like if we don't build up. Show them the commute times."

  "It's still campaigning," Marcus said.

  "It's educating," Elena corrected. "If we don't bring the Shadow Sample up to our level, we aren't representatives. We're just hostages to their ignorance."

  They voted. The tally was close: 52 to 38 in favor. The rest abstained, unwilling to bear the risk.

  Now they waited. The Audit results would come in an hour. Elena walked to the window overlooking the city. The skyline was low, safe, familiar. It was also unaffordable. She thought about the people in the Shadow Sample. They were her peers. They were randomly selected, just like her. But they were home, watching TV, answering a poll on their phones without the burden of the briefing books.

  Was this legitimacy? If the Assembly voted for what was right, but the people said no, who was sovereign? The people-as-they-are, or the people-as-they-could-be?

  The alert chimed. Sarah walked to the dais, holding a tablet. Her face was unreadable.

  "The variance," she announced, "was fourteen percent."

  A collective exhale swept the room. They had passed. Barely.

  Elena didn't feel relief. She felt a cold clarity. They had passed because they had learned to speak the language of the poll. They had learned to simplify the truth until it fit within the fifteen percent margin of error. They hadn't changed the public's mind; they had lowered their decision to meet the public's baseline.

  The system was working. It was accountable. It was perfectly responsive to the will of the people. And as Elena looked at the approved proposal, she wondered if they had just successfully legislated the city into a slow decline, all while maintaining perfect democratic legitimacy.

  ***

  **Commentary**

  I centered the story on the "Counterfactual Audit" because it crystallizes the theoretical tension between descriptive representation (the mirror) and epistemic democracy (the filter). In sortition theory, legitimacy often rests on the claim that random selection creates a body that *is* the people. However, proponents also argue that deliberation improves upon raw public opinion. My story posits that these two ideals are potentially incompatible when institutionalized simultaneously.

  The Audit mechanism forces the Assembly to align with the un-deliberated public will. By punishing divergence, the system incentivizes the Assembly to anticipate the Shadow Sample's reactions rather than pursue the best evidence. This dramatizes the risk of "soft capture." Lobbyists don't need to bribe assembly members; they only need to manipulate the information environment of the Shadow Sample. The Assembly becomes accountable not to the common good discovered through deliberation, but to the raw preferences of the uninformed.

  Elena's arc moves from seeing the role as one of duty to recognizing it as one of mediation. Her realization—that passing the Audit requires "lowering their decision to meet the public's baseline"—highlights the risk of oversimplification in the story. In reality, deliberation might shift public opinion over time, or the Shadow Sample might trust the Assembly's expertise. The story assumes a static public opinion to sharpen the conflict. Additionally, the story treats the "variance" metric as mechanically rigid, whereas real-world legitimacy is often more forgiving of unpopular but necessary decisions. Ultimately, the narrative suggests that without protecting deliberation from the immediate pressure of raw opinion, sortition may reproduce the populism it aims to cure.
