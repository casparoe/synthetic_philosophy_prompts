  **THE QUARTERLY BULLETIN | INTERNATIONAL CONSORTIUM FOR DIAGNOSTIC TAXONOMY**
  **CHAIR'S CORNER: REFLECTIONS ON THE WORKING GROUP FOR REGULATORY IDENTITY DISSONANCE**

  Dear Colleagues,

  It has been eighteen months since the publication of the 7th Edition of the Manual, and I am pleased to report that the Working Group for Regulatory Identity Dissonance (RID) is exceeding all expectations. When we finalized the criteria during the field trials, our goal was to capture a specific, latent phenomenology. The data since publication suggests we were not only accurate but perhaps modest in our projections. Identification rates have surged by roughly forty percent across North American clinics. Where some might see inflation, I see vindication. It appears that once the proper linguistic architecture was provided, the underlying condition was finally free to express itself fully.

  Interestingly, the clinical presentation of RID is evolving in real-time, a testament to the maturing of the field. During the initial trials, subjects presented with vague anxieties about social roles. Today, patients arrive fluent in the vocabulary of the Manual. They do not say they feel "unsettled"; they report "Criterion A dissociative mismatches." This shift is invaluable. It streamlines intake and reduces diagnostic ambiguity. In response to this clarity, the Working Group voted last month to amend Criterion D. Previously, this criterion required "unconscious discomfort with assigned categories." We have revised this to "conscious or unconscious discomfort," acknowledging that insight into one's diagnosis is now a common symptom of the disorder itself. It is a responsive change, ensuring the net captures those who recognize their condition as well as those who do not.

  Critics outside the Consortium occasionally suggest that RID is "made up," implying a social constructionist origin. I must state for the record that I am no social constructionist. We are realists. We map the terrain of the mind; we do not build it. However, there is truth to the idea that our classifications interact with the classified. By naming the disorder, we provide patients with the tools to articulate their suffering in ways that were previously unavailable. We shape the landscape of suffering so that it may be properly measured. This is not construction; it is refinement.

  This refinement is proving robust globally. Our colleagues in Oslo report that RID manifests primarily as somatic fatigue, whereas in Tokyo, it presents as acute procedural hesitation. These variations do not weaken the category; they demonstrate its flexibility. The core construct holds, even as the local expressions shift to accommodate cultural expectations of illness. It is heartening to see the Manual serving as a universal scaffold for human distress.

  I must also acknowledge the unrestricted educational grant from Veridex Pharmaceuticals that made our recent symposium possible. Their commitment to patient awareness campaigns has been instrumental in helping individuals recognize these symptoms in themselves. When patients are empowered to seek help using the correct terminology, everyone benefits.

  Looking ahead, I propose a procedural adjustment for the 8th Edition cycle. Currently, we finalize criteria before full dissemination. I suggest we release draft criteria to participating clinics eighteen months prior to publication. This would allow patients to familiarize themselves with the emerging standards, ensuring that when the Manual is officially released, their presentations are fully aligned with the new definitions. This would minimize the lag between conceptualization and realization, reducing waste in the diagnostic process.

  We are doing vital work. The category is stable, even as it moves.

  Warmly,

  **Dr. Aris Thorne**
  *Chair, Working Group on Regulatory Identity Dissonance*
