  # JOINT STATEMENT ON THE NATURE OF LEGAL AUTHORITY
  **Signatories:** H.L.A. Hart & Lon L. Fuller
  **Date:** October 14, 1965
  **Subject:** Resolution of Disagreements Regarding the Separation of Law and Morals

  ## I. AGREED CLAIMS

  1.  **Definition of a Legal System:** We agree that a legal system is a complex social practice involving the issuance of general standards of conduct, the existence of institutions authorized to apply those standards, and a general social acceptance (by officials and, to a lesser extent, the populace) that these standards provide reasons for action. We disagree on whether the *existence* of this system depends on its moral merit, but we agree on its structural components.

  2.  **Identification of Rules:** We agree that officials within a functioning legal system identify valid rules primarily through social sources (pedigree, enactment, precedent) rather than through independent moral reasoning. A rule does not cease to be *identified* as law simply because a judge believes it is wicked. However, we disagree on whether that identification settles the question of whether the rule creates a genuine *obligation*.

  3.  **Aims of Our Theories:**
      *   **Positivism:** Aims to provide a descriptive, morally neutral vocabulary that allows us to say, "This is law, but it is too wicked to be obeyed." It seeks to prevent the moral validity of a rule from obscuring its legal validity.
      *   **Natural Law:** Aims to provide a purposive account of law as an enterprise of subjecting human conduct to the governance of rules. It seeks to prevent the legal validity of a rule from obscuring its moral invalidity.
      *   **Agreement:** Neither theory advocates for blind obedience to authority. Both agree that the question "Is it law?" is distinct from "Must I obey it?", though we disagree on how tightly those questions are linked.

  4.  **Misconceptions We Reject:**
      *   The Positivist does **not** claim that law is morally good, nor that justice is irrelevant to the content of law.
      *   The Natural Lawyer does **not** claim that every unjust rule is automatically void, nor that judges should simply ignore statutes they dislike.
      *   Neither side claims that "might makes right."

  5.  **Hart's "Minimum Content" and Fuller's "Fidelity":**
      *   We agree that H.L.A. Hart's "minimum content of natural law" (based on human vulnerability, approximate equality, and limited resources) acknowledges factual constraints on any sustainable legal system. The Positivist views this as a truth of fact (survival); the Natural Lawyer views this as the baseline of the moral enterprise.
      *   We agree that Lon Fuller's "fidelity to law" is not a demand for obedience to any command labeled "law." It is a reciprocal obligation: the citizen owes fidelity only if the state maintains the "inner morality of law." The Positivist views this as a moral choice by the participant; the Natural Lawyer views it as a definitional requirement of the legal relationship itself.

  6.  **The Verbal Dispute:** We acknowledge that a significant portion of our disagreement is verbal. The Positivist uses the word **"Law"** to denote a *system of social control recognized by officials*. The Natural Lawyer uses the word **"Law"** to denote a *purposive enterprise of governance that succeeds in guiding human agency*.
      *   **Substantive Remainder:** Once this terminology is clarified, a real disagreement remains: When a system is sufficiently wicked, should we deny it the title "Law" to withhold its claim on conscience (Fuller), or affirm it is "Law" to clarify that our resistance is a moral choice against a real power (Hart)? This is not merely semantic; it dictates how we instruct judges and citizens in times of crisis.

  ***

  ## II. REMAINING DISAGREEMENTS, CRUXES, AND TESTS

  | Question | Positivist Formulation (Hart) | Natural Lawyer Formulation (Fuller) | The Crux (What must be settled) | Shared Test / Evidence | Positivist Prediction | Natural Lawyer Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Eight Principles** | Are Fuller's eight requirements (generality, publicity, prospectivity, clarity, consistency, feasibility, stability, congruence) moral requirements or merely conditions of effective governance? | Are the eight requirements moral prerequisites for the existence of law, or merely technical efficiencies? | **Status of the Principles:** Are they instrumental (how to make rules work) or constitutive (what makes rules *law*)? | **Administrative Failure:** A regime that issues secret, retroactive, and contradictory orders but maintains order through terror. | **Instrumental.** The regime has "law" (bad law). The failure is one of efficiency and morality, not legal existence. | **Constitutive.** The regime has failed to create law. It is rule by man, not rule of law. It is a perversion of the concept. |
  | **2. Wicked Systems** | Does a sufficiently unjust system fail to be law? If so, is that failure a moral fact or a conceptual one? | Does a sufficiently unjust system fail to be law? If so, is that failure a moral fact or a conceptual one? | **The Threshold:** At what point does iniquity negate legality? Is "law" a container that holds poison, or a vessel that shatters if filled with poison? | **The Postwar Informer Cases:** Courts punishing citizens who informed on neighbors under Nazi statutes. | **Conceptual Distinction.** The Nazi statutes *were* law. To punish the informers, we must pass retroactive statutes. Honesty requires admitting we are making new law to punish past acts. | **Conceptual Denial.** The Nazi statutes were *not* law because they violated the inner morality. Punishing informers is not retroactive; it is applying the true law that persisted despite the regime. |
  | **3. Official Obligation** | Are officials under any obligation to apply monstrous but formally valid rules? | Are officials under any obligation to apply monstrous but formally valid rules? | **The Judge's Dilemma:** Is the judge's duty to the *system's validity* or to the *enterprise of legality*? | **Judicial Resignation vs. Sabotage:** A judge in a wicked system choosing between applying wicked rules accurately or distorting them to achieve justice. | **Moral Choice.** The judge has a legal duty to apply valid rules but a moral right to resign or (in extreme cases) disobey. The conflict is between Law and Morality. | **Legal Duty.** The judge has no *legal* duty to apply rules that violate the inner morality. Distorting them to preserve legality is a higher fidelity to Law itself. |
  | **4. The Slave Society** | **Test Case:** A legal order satisfies every one of Fuller's eight requirements. It is administered with scrupulous legality. It is used to run a hereditary system of slavery. The enslaved are held under rules that are general, published, prospective, clear, consistent, feasible, stable, and faithfully applied. Do these rules count as law? | **Test Case:** (Same as Left) Do these rules count as law? | **Reciprocity:** Can law exist without a relationship of reciprocity between ruler and ruled? Is the "subject" of law required to be an agent? | **The Slave Code:** Examination of the U.S. Antebellum South or Roman Law regarding slaves, specifically focusing on whether slaves were treated as subjects of rules or objects of management. | **Yes, it is Law.** This proves Law $\neq$ Morality. The rules govern the masters' conduct regarding slaves. The system is legally valid though morally abhorrent. Our theory explains this clearly; Natural Law obscures the horror by calling it "not law." | **No, it is Not Law.** Slavery treats humans as things. One cannot subject a "thing" to rules. If the rules are applied to slaves, it is management of objects, not governance of persons. The "congruence" requirement fails because the slave cannot *follow* rules, only obey force. |
  | **5. Settlement Conditions** | What would settle the crux regarding the Slave Society? | What would settle the crux regarding the Slave Society? | **Agreement on Facts:** Can we agree on the description of the scenario? | **N/A** | **We predict** the scenario is possible. If the Positivist can describe a slave code that meets all 8 criteria, the Natural Lawyer must concede it is law. | **We predict** the scenario is impossible. If the system is truly slavery, it *cannot* meet the 8 criteria (specifically congruence and feasibility of agency). If it meets the criteria, it is not truly slavery. |

  ***

  ### NOTE ON THE SHARED TEST CASE (THE SLAVE SOCIETY)

  **Status of Agreement:** We cannot agree on what would settle this crux.

  *   **The Positivist Position:** We maintain the scenario is conceptually possible. A master class can follow strict rules regarding the treatment of slaves. The slaves are the *objects* of the law, not the *subjects*. The law binds the masters and officials. Therefore, it satisfies the definition of a legal system.
  *   **The Natural Lawyer Position:** We maintain the scenario is conceptually incoherent. Law implies a relationship between agents. If the enslaved are human, subjecting them to slavery violates the requirement that law respect human agency (a precondition of the 8 principles). If they are treated as objects, the "rules" regarding them are merely technical instructions for maintenance, not law.
  *   **Joint Admission:** We acknowledge that this disagreement stems from a deeper divergence on the definition of a "legal subject." The Positivist defines the legal system by the *officials'* perspective. The Natural Lawyer defines it by the *interaction* between officials and subjects. We cannot resolve this without one side abandoning their core definition of law.

  **Signed,**

  *H.L.A. Hart*
  *Lon L. Fuller*
