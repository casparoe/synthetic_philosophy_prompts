      *   *Wait, let's look closer:* R4 is about *archives* (truth). New case is about a *memorial* (honor). R1 is a *memorial*. The key distinction in the Commission's history seems to be Archive vs. Memorial.
      *   *Closest Analog:* **Ruling 1**. Both are proposals for physical memorials to victims. The divergence is permanence.
