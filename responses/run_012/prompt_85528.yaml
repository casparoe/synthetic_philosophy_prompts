      *   *Ruling 4:* Town wants to *burn archive* (ritual forgetting). -> **Rejected.** (Suggests: Total destruction of historical record is impermissible; duty to remember/truth overrides communal desire to forget).
      *   *Ruling 5:* University removes eugenicist's name from *building*. -> **Approved.** (Suggests: Honoring perpetrators/villains in civic space is bad; symbolic landscape matters).
