      *(Refining the Verdict)*: If I say "Approve with Conditions," I need to specify the condition clearly. The condition must resolve the tension with Ruling 4 (Archive Burning). The condition is: "The dismantling of the garden must not constitute the erasure of the historical record; a separate archival record must be maintained."

