      *   **Constraint 2:** Start by brainstorming/dumping questions, then prune hard, explaining cuts.
      *   **Constraint 3:** Incorporate the user's specific "wrinkle": A distinction between Type A borderline cases (convergence possible, access issue) and Type B borderline cases (no fact of the matter until practice changes). This distinction challenges both epistemicism (fits Type A) and supervaluationism (fits Type B, maybe).
      *   **Constraint 4:** For each ranked question, explain: Upstream dependency, Tractability (one person, logic, no empirics), Neglect vs. Difficulty, and Overrated status.
      *   **Constraint 5:** Explain what would change the ranking (future developments).
      *   **Tone:** Professional, rigorous, direct, "in the trenches."

  2.  **Initial Brainstorming (The "Dump"):**
      *   *Higher-order vagueness:* Can we vague the boundary of the boundary?
