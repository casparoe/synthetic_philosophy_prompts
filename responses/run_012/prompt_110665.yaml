answer: |-
  Here is the brainstorming dump, the pruning, and the ranked agenda.

  ### Phase 1: The Brainstorm Dump
  *   **Higher-Order Vagueness:** Can we draw a boundary around the borderline cases? Is there a boundary to that boundary?
  *   **The Logic of 'Definitely':** What are the inference rules for the determinacy operator? Does it iterate?
  *   **Metaphysical Vagueness:** Is the world vague, or just our language? Do vague objects exist?
  *   **Contextualism:** Do boundaries shift with conversational context to avoid paradox?
  *   **The Forced March:** If we march through a sorites series, where does the speaker break?
  *   **Truth-Value Gaps:** Do borderline sentences lack truth values, or are they just unknown?
  *   **Composition:** Does vagueness in parts entail vagueness in wholes?
  *   **Normativity:** Are we *obligated* to precisify vague terms in legal/moral contexts?
  *   **Communication:** How do we successfully communicate using vague terms if boundaries differ?
  *   **Type A vs. Type B (Your Distinction):** Is the indeterminacy epistemic (hidden fact) or pragmatic (no fact yet)?
  *   **Hybrid Semantics:** Can one system handle both epistemic and pragmatic indeterminacy?
  *   **The Source of Convergence:** What mechanism forces community agreement in Type A cases?

  ### Phase 2: The Prune
  I am cutting **Metaphysical Vagueness**. It's a quagmire. If your Type A/B distinction is about *predicates* and *community practice*, ontology is a distraction. You can't solve the semantics by arguing about whether clouds have sharp edges.

  I am cutting **Contextualism**. It explains boundary *movement*, but not boundary *status*. It often smuggles in epistemicism anyway (the boundary is sharp *at* a context). It doesn't help distinguish Type A from Type B; it just adds a variable to both.

  I am cutting **Communication/Successful Reference**. This is Gricean pragmatics. While important, it's downstream of semantics. You need to know what the terms mean (A or B) before you know how we negotiate them.

  I am cutting **The Forced March**. It's a test case, not a research question. It's a tool to generate data, not a problem to solve in itself.

  I am cutting **Generic Higher-Order Vagueness**. Unless tied to your distinction, it's just technical regress. If your distinction holds, HOV might just be the transition zone between A and B. That makes it interesting, but "HOV generally" is too broad.

  ### Phase 3: The Ranked Agenda

  Here are the five questions that matter, ranked by upstream dependency. If you answer #1, you change the game for #2–5. If you skip #1, you're building on sand.

  #### 1. The Ambiguity of 'Indeterminate': Is it One Phenomenon or Two?
  **The Question:** Does the word "indeterminate" (or "borderline") refer to a single semantic property, or is it systematically ambiguous between Type A (epistemic access failure) and Type B (semantic underdetermination)?
  **Why Upstream:** This is the foundation. If 'indeterminate' is univocal, your distinction collapses, and you must force either epistemicism or supervaluationism to cover everything. If it's ambiguous, the entire literature is guilty of a fallacy of equivocation. This dictates whether you need one logic or two.
  **Tractability:** High. This is conceptual analysis backed by logical consistency checks. You don't need empirical data; you need to test whether standard inferences hold across the two types. (e.g., Does "It is not definitely P" imply "It is not definitely not P" in both types?)
  **Neglect vs. Hard:** Neglected. People assume vagueness is a natural kind. Arguing it's a disjunctive concept is controversial but hasn't been fully weaponized against the standard trichotomy (epistemic/supervaluation/degree).
  **Overrated Status:** None. This is the core.

  #### 2. The Compatibility Question: Can Classical Logic Govern Type A while Non-Classical Governs Type B?
  **The Question:** If Type A cases have sharp but unknown boundaries, they obey classical logic (bivalence holds). If Type B cases have no boundary, they arguably require a non-classical logic (gaps or gluts). Can a single language coherently switch logic based on the *type* of predicate involved without creating paradoxes at the intersection?
  **Why Upstream:** If you can't make the logics play nice, the distinction is theoretically useless. You need to know if a sentence mixing a Type A predicate ("red") and a Type B predicate ("vehicle" applied to a drone) creates a logical crash.
  **Tractability:** Medium-Hard. Requires formal care. You need to define the interface. Can you embed a Type B sentence in a Type A context? (e.g., "It is unknown whether [the drone is a vehicle].")
  **Neglect vs. Hard:** Hard. Most people pick a team (Classical or Non-Classical) and stick to it. A hybrid system is technically demanding but philosophically rich.
  **Overrated Status:** None. This is the technical bottleneck.

  #### 3. The Diagnostic Problem: How Do We Identify Type Membership *Ex Ante*?
  **The Question:** Before we investigate or deliberate, what marks a predicate as Type A or Type B? Is it the subject matter (natural kinds vs. artifacts)? Is it the stakes? If we can't tell which type we are dealing with until *after* we try to settle it, the distinction is retrospective and loses its explanatory power.
  **Why Upstream:** If you can't predict which type a case is, you can't advise on how to reason about it. This determines the practical utility of your dissertation.
  **Tractability:** Medium. This is metaphilosophical. You are looking for criteria. It risks becoming a "list of features" paper, so you need a principled dividing line (e.g., "Does the practice have a constitutive aim that settles the case?").
  **Neglect vs. Hard:** Neglected. Everyone assumes we know when we are ignorant vs. when the concept is open.
  **Overrated Status:** Moderate. It's easy to get bogged down in examples. Keep it focused on the *criteria*, not the cases.

  #### 4. Higher-Order Vagueness as Type-Drift
  **The Question:** Is the problem of higher-order vagueness (the vagueness of the borderline) actually just the phenomenon of sliding from Type A into Type B? Perhaps the first boundary is sharp (Type A), but the location of that boundary is Type B.
  **Why Upstream:** This solves the regress problem. If HOV is just type-shifting, you don't need infinite hierarchies of operators. You just need to track the shift from access-problem to fact-problem.
  **Tractability:** High. This is a reinterpretation of an existing problem. It allows you to use the standard HOV literature but reframe the conclusion.
  **Neglect vs. Hard:** Neglected. HOV is usually treated as a technical nuisance for supervaluationists or epistemicists. Framing it as a modal shift is new.
  **Overrated Status:** High (in the general literature). HOV is often treated as a knockout punch against theories. If your theory absorbs it as Type-Drift, the punch loses force.

  #### 5. The Normative Status of Type B: Decision vs. Discovery
  **The Question:** In Type A cases, we aim for truth (discovery). In Type B cases, do we aim for coherence or utility (decision)? If Type B requires a "decision" to create the fact, does that make the resulting truth value retroactive?
  **Why Upstream:** This connects semantics to action. It matters for law and ethics. If "personhood" is Type B, then legislating it isn't finding a fact; it's making one.
  **Tractability:** Medium. This bleeds into metaethics and philosophy of law. Keep it tied to the semantic consequences (does the truth value change over time?).
  **Neglect vs. Hard:** Neglected in semantics, common in law. Bringing it back to the logic of vagueness is the key.
  **Overrated Status:** Low. This is where the dissertation opens up into broader implications.

  ---

  ### What I Cut and Why (The "Overrated" List)

  **The "Sharpening" Requirement in Supervaluationism.**
  *   *Why it's overrated:* Supervaluationists insist that admissible precisifications must respect the "penumbral connections" (e.g., you can't precisify 'red' to include a clear 'blue' case). But if your Type B distinction holds, sometimes the practice *doesn't* constrain the sharpening enough to rule out incompatible precisifications. Focusing on the technical constraints of sharpening misses the point that sometimes *no* sharpening is mandated until we act. Don't spend time refining supervaluationist constraints; challenge the need for them in Type B.

  **The Forced March Sorites.**
  *   *Why it's overrated:* It's a psychological test, not a logical one. It shows that speakers get tired or change standards. Under your distinction, the Forced March just forces the speaker to treat a Type B case as if it were Type A (demanding a yes/no where none exists). Solving the psychological puzzle doesn't solve the semantic one.

  **Degrees of Truth (Fuzzy Logic).**
  *   *Why it's overrated:* It treats vagueness as a metric problem (how much red?). Your distinction treats it as a modal problem (is there a fact?). Adding degrees complicates the Type A/B split without solving it. If Type A is epistemic, degrees don't help (the fact is 0 or 1, we just don't know). If Type B is underdetermined, degrees are just a proxy for "no fact." It's a formal tool, not a solution to your specific problem.

  ---

  ### What Would Change the Ranking?

  You need to monitor two potential developments in the next year. If either happens, reorder the list.

  1.  **A Proof of Logical Collapse:** If someone publishes a rigorous proof showing that hybrid semantic systems (Classical + Non-Classical) inevitably lead to triviality or contradiction (a "tonk" style problem for mixed logic), **Question #2 moves to #1**. You cannot proceed with the distinction if the logic is impossible. You would need to pivot to defending the possibility of the logic before arguing for the distinction.
  2.  **Empirical Pragmatics on Convergence:** If experimental philosophers or linguists produce robust data showing that communities *never* converge on Type A cases without external stipulation (i.e., Type A doesn't exist, it's all Type B), **Question #1 collapses**. Your distinction becomes a distinction between "settled Type B" and "unsettled Type B." This doesn't kill the project, but it shifts the focus entirely to the pragmatics of settlement (Question #5 moves up).

  ### Final Advice for the Semester

  Don't try to solve all five.
  **Write the paper on Question #1 (The Ambiguity).**
  Argue that the failure of standard theories is due to treating a disjunctive concept as a natural kind. Use Question #3 (The Diagnostic) to show *why* we confuse them (they look the same from the inside). Use Question #4 (HOV) to show how your view handles the standard objections better than epistemicism or supervaluationism alone.

  This gives you a dissertation chapter that says: "The field is stuck because it's asking the wrong question. Here is the right distinction. Here is why it matters." That is dissertation-opening work.
