      *   Q4 & Q5 are slightly more applied/metaphilosophical. Let's swap Q5 for something about the *source* of the boundary.
      *   *Wait, need to check "Overrated".* Higher-order vagueness is often overrated as a *problem* rather than a *feature*.
      *   *Need to check "Tractability".* Building a full hybrid semantics might be too hard for one semester. Need to frame it as "Conditions for possibility."

      *Revised Ranking:*
      1.  **The Ambiguity of 'Indeterminate':** Is it one phenomenon or two? (Foundational).
      2.  **Logic of the Hybrid View:** Can classical logic survive Type A while non-classical handles Type B?
      3.  **Higher-Order Vagueness as Type-Drift:** Is the regress just sliding from A to B?
      4.  **The Criterion for Type-Membership:** How do we know which type a case is *before* we judge it?
      5.  **Overrated:** The "Sharpening" requirement in Supervaluationism. (Why it doesn't help Type B).

  6.  **Drafting the Content (incorporating constraints):**
      *   *Tone:* Peer-to-peer, rigorous.
      *   *No Citations:* Refer to "the epistemicist commitment" or "the supervaluationist precisification."
      *   *Focus:* Upstream dependency, tractability, neglect.
      *   *The "Wrinkle":* Ensure Type A/B is central to every point.

  7.  **Review against Constraints:**
      *   *Brainstorm/Prune section included?* Yes.
      *   *5-6 Questions?* Yes.
      *   *Upstream/Tractability/Neglect included?* Yes.
      *   *Overrated section?* Yes.
