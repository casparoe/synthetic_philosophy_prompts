      *   Check the "one semester" constraint. The questions need to be narrow enough for a paper but broad enough for a dissertation chapter.

      *(Self-Correction during drafting)*: I need to be careful not to validate the user's distinction too uncritically. As an expert, I should point out where it might fail (e.g., how do you distinguish them *ex ante*?). This adds credibility.
      Also, ensure I don't slip into giving a reading list. Describe the *arguments*.

      *Refining the "Overrated" section:* The "Forced March Sorites" is often treated as the knockout punch, but if the user's distinction holds, the Forced March might just be forcing Type B cases into Type A processing. That's a good angle.

      *Refining the "What changes ranking":* Needs to be specific. E.g., If a formal proof shows hybrid systems collapse.

      *Let's finalize the 5 questions:*
      1.  Semantic Uniformity vs. Pluralism (The 'Indeterminate' term).
