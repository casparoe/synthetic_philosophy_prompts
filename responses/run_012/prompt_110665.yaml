      *   *Composition:* Do vague objects exist? Or just vague predicates?
      *   *Truth-value gaps vs. ignorance:* Is 'True' bivalent?
      *   *Contextualism:* Does the boundary shift with context?
      *   *The Sorites:* How to block the induction step without being absurd?
      *   *Semantic vs. Metaphysical:* Is vagueness in the world or the word?
      *   *User's Type A/Type B:* How to formalize this distinction? Does it dissolve the paradox?
      *   *Normativity:* Ought we to precisify?
      *   *Communication:* How do we understand each other with vague terms?
      *   *Degrees of Truth:* Fuzzy logic approaches.
      *   *The "Definitely" Operator:* Is it coherent?

  3.  **Pruning the List (The "Cut"):**
      *   *Cut: Fuzzy Logic/Degrees of Truth.* Why? It's a separate ecosystem. Integrating it with the user's Type A/B distinction is messy and might dilute the analytic focus. It's also mathematically heavy for a philosophy paper unless doing formal semantics.
      *   *Cut: Metaphysical Vagueness (Vague Objects).* Why? It's a rabbit hole. If the user's distinction is about *predicates* and *community practice* (semantic/pragmatic), ontology distracts. It's also notoriously hard to make progress on without empirical metaphysics.
      *   *Cut: Contextualism.* Why? It's often a workaround rather than a solution. It explains *why* boundaries shift, but not the status of the boundary *at* a context. It might subsume Type A, but Type B is the real interest.
      *   *Cut: The Sorites Paradox itself (generic).* Why? Too broad. Everyone solves it differently. The question needs to be about the *mechanism* of the solution relative to the Type A/B distinction.
      *   *Cut: Higher-Order Vagueness (generic).* Why? It's important, but often treated as a technical nuisance. Needs to be tied to the specific distinction to matter.

  4.  **Developing the Core Insight (Type A vs. Type B):**
      *   *Type A:* Epistemicism is basically right here. There is a fact, we don't know it. (e.g., "Is this specific wavelength 'red'?" where physics defines red).
      *   *Type B:* Supervaluationism/Non-classical is right here. No fact until decision. (e.g., "Is this new tech gadget a 'vehicle'?" where law/practice hasn't settled).
      *   *The Conflict:* Standard theories treat *all* vagueness as one kind. If the user is right, the semantic toolkit needs to be hybrid or pluralist.
      *   *The Opportunity:* This is the leverage point for the dissertation.

  5.  **Ranking the Questions (The Agenda):**

      *   *Q1: The Coherence of a Hybrid Semantics.* (Can you actually build a logic that handles both?)
      *   *Q2: The Status of the 'Definitely' Operator across Types.* (Does 'D' mean the same thing in A and B?)
      *   *Q3: Higher-Order Vagueness as Type-Shifting.* (Is HOV just moving from A to B?)
      *   *Q4: The Normative Force of Borderline Judgments.* (Why does it matter?)
      *   *Q5: The Role of Community Convergence.* (What counts as convergence?)

      *Refining the Ranking:*
      *   Q1 is the foundation. If you can't build it, nothing else matters.
