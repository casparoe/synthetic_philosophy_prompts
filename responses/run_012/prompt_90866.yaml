answer: |-
  Here is the collaboration document your friends should have written. I've stripped out the academic jargon and treated this like a system design review where two teams are arguing over the spec for a critical module (the "Demos Definition Service").

  ### 1. Shared Spec (Agreed Claims)

  Both camps agree on the following foundational constraints. If either side rejects these, the conversation stops here.

  1.  **The Infinite Loop Error:** We agree that deciding "who decides" via a vote is logically circular. We cannot solve the boundary problem *democratically* because you need a demos to hold a democracy. The boundary must be justified by something *outside* the voting procedure itself.
  2.  **No Natural Borders:** We agree there is no "God-given" map. Borders are human artifacts. Any line we draw is going to be somewhat arbitrary at the edges, but it still needs a principled justification, not just "this is how we've always done it."
  3.  **Legitimacy Requirement:** A decision is only legitimate if the people bound by it have some form of agency over it. If you exclude too many people, the system becomes tyranny. If you include too many, the system becomes unworkable. We need a balance.
  4.  **Implementation Matters:** A theory of democracy that cannot actually run an election (because the voter roll changes every minute or is impossible to verify) is failed software. We need a boundary that is administratively possible to enforce.
  5.  **Coercion is Real:** We agree that state power involves coercion (taxes, laws, police). We disagree on whether this is the *only* thing that matters, but we agree it exists and is significant.

  ### 2. Divergent Logic (Disagreements Table)

  Here are the specific points where the logic forks. The wording in the "Camp" columns is steel-manned: each side should read their own column and say, "Yes, that's exactly what I mean."

  | Claim / Point of Contention | Camp 1 (Subjection) Wording | Camp 2 (Affected Interests) Wording | Real or Verbal? |
  | :--- | :--- | :--- | :--- |
  | **The Source of Voting Rights** | Voting is a safeguard against **tyranny**. You only need a vote if you are legally bound to obey the outcome. If the state can't arrest you or tax you, you don't need a vote. | Voting is a safeguard against **harm**. You need a vote if the outcome changes your life trajectory. Legal binding is just one way to get hurt; economic or environmental damage counts too. | **Real.** They value different goods (liberty from force vs. welfare protection). |
  | **Boundary Stability** | The voter roll must be **static** between elections. Jurisdiction is a fixed property of the person (like residency or citizenship). If the boundary moves per issue, you can't maintain a registry. | The voter roll should be **dynamic** per issue. The "demos" for a climate bill should be different than the "demos" for a zoning law. Fixed borders are a bug, not a feature. | **Real.** This is an architectural incompatibility. |
  | **Definition of "Harm"** | Harm is **deontological** (about rules). You are harmed if your rights are violated by authority. External consequences (like pollution drifting over a border) are unfortunate but not a violation of democratic right. | Harm is **consequentialist** (about outcomes). You are harmed if your well-being decreases. It doesn't matter if the law technically applies to you; if your house floods, you are harmed. | **Real.** Different ethical frameworks. |
  | **The "Coercion" Definition** | Coercion is **binary**. You are either subject to the state's enforcement mechanism or you aren't. There is no "kind of" subject. | Coercion is a **spectrum**. Soft power (economic sanctions, market shifts) coerces people just like hard law. Drawing a line at "legal enforcement" is arbitrary. | **Mixed.** Partly verbal (how we define coercion), partly real (whether degrees matter). |

  ### 3. Test Cases (Cruxes)

  These are the specific scenarios where, if you ran the simulation, the two systems would produce different outputs. If you can settle these, the whole argument resolves.

  **Crux 1: The Determinacy of "Affected"**
  *   **The Question:** Is "affected interests" specific enough to generate a voter list, or is it infinitely expandable?
  *   **Concrete Case:** **Climate Target.** Country A sets a carbon tax. This slows global warming slightly, affecting everyone on Earth. It also raises energy costs for Country A's neighbors via trade.
  *   **Camp 1 Prediction:** The voter list is **Country A citizens only**. They are the only ones subject to the tax law. Anyone else is an externality.
  *   **Camp 2 Prediction:** The voter list is **Global** (or at least regional). Since everyone is affected by climate change, everyone has an interest. If Camp 2 cannot define a cutoff (e.g., "only those affected by >0.1°C"), their principle demands a global demos, which violates Agreement #4 (Implementation Matters).
  *   **Why this moves the needle:** If Camp 2 admits they need an arbitrary cutoff for "affected," they concede that *some* non-democratic boundary is needed (undermining their critique of Camp 1). If they insist on global voting, they admit their theory is impractical.

  **Crux 2: Coercion as Degree vs. Binary**
  *   **The Question:** Does soft power count as coercion requiring a vote?
  *   **Concrete Case:** **City Zoning.** A city votes to ban affordable housing. Commuters from the suburbs can no longer afford to live near their jobs. They aren't taxed by the city, but their economic liberty is crushed.
  *   **Camp 1 Prediction:** **No vote for commuters.** They are not subject to city law. They can choose to move or change jobs. The city's coercion only applies within city limits.
  *   **Camp 2 Prediction:** **Vote for commuters.** The economic coercion is functionally identical to a legal ban. If the city can destroy their livelihood without their input, that is tyranny by another name.
  *   **Why this moves the needle:** If Camp 1 admits economic pressure is coercion, their boundary expands to include anyone in the labor market (blurring into Camp 2). If Camp 2 admits economic pressure isn't *political* coercion, they concede there is a special category for legal subjection (validating Camp 1).

  **Crux 3: The Boundary Decision Itself**
  *   **The Question:** Who decides the boundary when the boundary is contested?
  *   **Concrete Case:** **Secession Referendum.** Region X wants to leave Country Y. Who votes? Everyone in Country Y (who loses territory) or only Region X (who changes citizenship)?
  *   **Camp 1 Prediction:** **Whole Country Y.** The constitution applies to all subjects. Changing borders changes the legal status of all current subjects, so all current subjects must consent.
  *   **Camp 2 Prediction:** **Region X.** Their interests are profoundly affected (changing nationality). Country Y citizens are barely affected (minor map change). Including Country Y dilutes the votes of those most impacted.
  *   **Why this moves the needle:** This tests the "Infinite Loop" agreement. Camp 1 accepts the existing legal framework as the "pre-condition." Camp 2 tries to break the framework based on impact. If Camp 2 cannot specify *who* authorizes the referendum without using the existing state apparatus, they are stuck in the loop they accused Camp 1 of creating.

  ### 4. Verbal vs. Substance Check

  There is one area where you are talking past each other due to vocabulary, not substance.

  *   **The Word:** "Coercion."
  *   **The Issue:** Camp 1 defines coercion as "legal enforcement capability" (can the police arrest you?). Camp 2 defines coercion as "significant constraint on choice" (can you afford to say no?).
  *   **The Fix:** If Camp 2 switches to saying "significant impact on welfare" instead of "coercion," and Camp 1 admits that "legal subjection" is just a specific, high-priority subset of "impact," the temperature drops.
  *   **Verdict:** This is **20% verbal, 80% substantive**. Even if you agree on definitions, Camp 1 prioritizes the stability of the legal unit, and Camp 2 prioritizes the mitigation of harm. You will still disagree on the zoning case even with perfect definitions.

  ### 5. Recommendation for Unsticking

  Stop arguing about "what democracy means." Start arguing about **Crux 1 (Determinacy)**.

  Camp 2 (Affected Interests) carries the burden of proof here. Their critique of Camp 1 is that borders are arbitrary. But if their own principle ("include everyone affected") requires an arbitrary cutoff to be implementable (e.g., "only people affected by more than $1000"), then they have admitted that *some* arbitrary boundary is unavoidable.

  If Camp 2 can produce a non-arbitrary formula for "affectedness" that yields a stable voter list, they win. If they can't, they must concede that Camp 1's "legal jurisdiction" is a useful heuristic for drawing the line, even if it's not morally perfect.

  \answer{determinacy of affected interests}
