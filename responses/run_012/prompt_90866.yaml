prompt: |-
  Hey, odd ask incoming. I'm a backend engineer, I did one ethics elective in college and that's the whole of my philosophy training, but I've fallen into a rabbit hole that my friend's reading group has been stuck on for months and I want to see if someone can unstick it.

  The rabbit hole: every democracy has to decide who's actually in the demos — who gets to vote on what. But that decision itself looks like it should be made democratically, which means you already need to know who's in, which is the thing you were trying to figure out. Circular. My friend calls it the boundary problem and says it's been around forever.

  There's two camps in the group and they've been going in circles, talking past each other, for like three months now.

  Camp one — call them the subjection people — say the demos is just everyone subject to the state's coercive law. Borders are a precondition of democratic procedure, not an output of it. Outsiders don't get a vote because they aren't being ruled, full stop. On this view "who's affected" is way too vague to draw any actual line.

  Camp two — the affected-interests people — say the demos should be everyone whose interests are seriously affected by the decision, wherever they happen to live. Coercion is just one way of being affected and not even the important one. On this view the subjection people are smuggling in a boundary they can't justify and then calling it neutral.

  What I want from you: the document these two camps should have produced instead of arguing for three months. Treat it as a good-faith adversarial collaboration. I want the claims both of them could actually sign — about what a demos is, about what legitimacy requires, about what we can and can't settle in advance. Then the precise points where they still disagree, each one written in wording that the side holding it would accept as fair (not a strawman, not a fudge). Then the cruxes — the sub-questions where, if you actually settled one, at least one side would have to move. For each crux, give me a concrete case or argument that both sides would agree bears on it, and write down what each side predicts about that case before anyone looks. And if any part of their fight turns out to be about words rather than substance, say which part and why.

  Two more things. First, a couple of the cruxes I suspect are in there but I'm not sure: whether "affected" is determinate enough to fix any real boundary, and whether being subject to coercion is a yes/no thing or a matter of degree. Check those and add whatever else you find. Second, anchor it with concrete cases rather than staying abstract — use at least two of these: a secession referendum (does the whole country vote, or only the region leaving?), an immigration or border policy, a climate target one country sets that affects everyone, a city rezoning that mostly affects commuters who can't vote there.

  You're a political philosopher who specializes in democratic theory and has run these collaborations before, so please think carefully and start by brainstorming the sub-questions and the possible cruxes before you draft anything. No citations, no reading lists — I can't look anything up and neither can you, so just reason it out. Keep it casual and readable, I'm not a philosopher.

  Format: a numbered section of agreed claims first, then a disagreements table (claim | wording each side accepts for its own view | why it's a real disagreement or just verbal), then a cruxes list where each crux has the shared case plus both predictions. At the very end, on its own last line, give me the single crux you think is most load-bearing as \answer{...} with just a short phrase inside the braces naming it — or \answer{verbal} if you decide the whole thing is a word fight.
