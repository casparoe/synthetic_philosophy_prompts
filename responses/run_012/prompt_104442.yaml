      *   **Goal:** Design a runnable in-session activity (game/exercise) where participants *feel* the widening of uncertainty, not just hear about it.
      *   **Mechanism:** Betting/Market-making framing. Participants quote buy/sell prices for a contract on Box B (Red).
      *   **Constraint:** Prices must be "defensible" (no sure loss regardless of the hidden mode).
      *   **Output Requirements:** Materials/prep, minute-by-minute run, rules/roles/payoffs, debrief (mapping to theory, handling the "still 1/2" objection, Bayesian vs. Imprecise distinction), failure modes, and limitations of the activity.
      *   **Language:** British English.

  2.  **Deconstruct the Mathematical Phenomenon:**
      *   *Setup:* Two modes: Twin (A=B) and Rival (A≠B). $P(\text{Twin})$ is unknown/unspecified. $P(A=\text{Red}) = 0.5$.
      *   *Pre-Reveal:* $P(B=\text{Red}) = P(B=\text{Red}|\text{Twin})P(\text{Twin}) + P(B=\text{Red}|\text{Rival})P(\text{Rival})$.
          *   If Twin: $P(B=\text{Red}) = P(A=\text{Red}) = 0.5$.
          *   If Rival: $P(B=\text{Red}) = P(A=\text{Green}) = 0.5$.
          *   So, marginally, $P(B=\text{Red}) = 0.5$ regardless of the mode mix.
      *   *Post-Reveal (A=Red):*
          *   If Twin: $B=\text{Red}$ (Prob = 1).
          *   If Rival: $B=\text{Green}$ (Prob = 0).
          *   Since we don't know the mode, the probability is somewhere in $[0, 1]$.
      *   *The "Dilation":* Uncertainty increases after gaining information.
      *   *The "Bayesian Counter":* A precise Bayesian *must* have a prior on Twin vs. Rival (e.g., 50/50). If they do, $P(\text{Twin}|A=\text{Red}) = P(\text{Twin})$. The posterior remains 0.5. The dilation *only* happens if we treat the prior over modes as a set (imprecise) rather than a single distribution.

  3.  **Designing the Activity:**
      *   *Framing:* "The Uncertainty Market." Participants are market makers.
      *   *Asset:* A contract paying £10 if Box B is Red.
      *   *Round 1 (Pre-Reveal):* Participants set a Buy and Sell price. To avoid "sure loss" (Dutch Book) across *any* possible mode configuration, the prices must converge to the marginal expectation (£5).
      *   *Round 2 (Post-Reveal):* Box A is revealed (say, Red). Now, depending on the mode, B is either definitely Red or definitely Green. Since the mode is unknown, the "safe" price range explodes.
      *   *Incentive:* Points/Money for quoting tight spreads that don't lose. Penalty for getting "arbed" (losing money regardless of outcome).
      *   *Physical Setup:* Need to simulate the boxes. Since it's a workshop, I (the facilitator) should control the "truth" to ensure the math holds, or use a pre-generated script. Pre-generated is safer for timing.
      *   *Group Size:* 16 people. Split into 4 tables of 4? Or keep as one room? One room is better for shared experience, but tables allow discussion. Let's go with 4 tables of 4, acting as competing market-making firms.

  4.  **Drafting the Plan (Iterative refinement):**

      *   *Prep:* Need envelopes or digital slides for Box A/B results. Let's use physical envelopes for tangibility. I need to pre-generate pairs.
      *   *Rules:* Crucial point: They must quote prices that are *robust* to the Mode. I need to explain "Robustness" simply. "You cannot lose money whether we are in Twin World or Rival World."
      *   *The Twist:* In Round 1, robustness forces price to £5. In Round 2, robustness forces spread to £0-£10.
      *   *Debrief:* This is the hardest part. I need to explain *why* a Bayesian doesn't see this. I need to distinguish between "Risk" (known odds) and "Ambiguity" (unknown odds).

  5.  **Addressing Specific Constraints:**
      *   *British English:* "Colour", "programme", "£", "maths", etc.
      *   *No technical names until debrief:* Don't say "Dilation" or "Imprecise Probability" during the game.
      *   *Handling the "Still 1/2" objection:* Participants will say "But it's still 50/50!". I need to validate that intuition (it's the Bayesian view) but show why the *market constraint* forces the spread wide.
      *   *Failure Modes:* People treating it as a gamble rather than a market making exercise. People assuming 50/50 on the modes implicitly.

  6.  **Refining the "Robustness" Rule:**
      *   If I tell them "Don't lose money", they might just gamble.
      *   Better instruction: "You are a risk-neutral market maker. Your boss will fire you if you make a loss *in any possible scenario consistent with the rules*." This forces the minimax/robust approach.
      *   Actually, to make it visceral, let's have *me* (the Facilitator) act as the "Adversary" who chooses the Mode *after* seeing their prices to minimize their profit (within the rules of the setup). This gamifies the robustness requirement.

  7.  **Step-by-Step Run:**
      *   0-10: Intro & Setup.
