      *   *Wait, check the math:*
          *   Round 1: $P(B=R) = 0.5$ under Twin. $P(B=R) = 0.5$ under Rival. So mixture is 0.5. Safe price is 5.
          *   Round 2 (A=Red): Under Twin, $P(B=R)=1$. Under Rival, $P(B=R)=0$.
