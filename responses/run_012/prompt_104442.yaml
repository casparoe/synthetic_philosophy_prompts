      *   The Lesson: "Ignorance about the *structure* (the mode) matters more than ignorance about the *outcome*."

  10. **Review against constraints:**
      *   75 mins? Yes.
      *   16 pax? Yes (4 teams of 4).
      *   British English? Yes.
      *   No jargon early on? Yes.
      *   Address the "Bayesian doesn't see this" point? Yes.

  11. **Self-Correction/Polishing:**
      *   *Correction:* In Round 1, if they price at £5, they break even. If they price at £4/£6, they might lose if the mode is skewed? No, the marginal is *always* 0.5 regardless of the mode mix. So £5 is safe.
