answer: |-
  # Workshop Activity: The Twin-Rival Market

  ## 1. Overview and Learning Objective
  **Title:** The Twin-Rival Market
  **Duration:** 75 minutes
  **Participants:** 16 (split into 4 teams of 4)
  **Goal:** To viscerally demonstrate *probability dilation*—the phenomenon where acquiring new information can increase uncertainty rather than decrease it, specifically when structural ambiguity exists.
  **Framing:** Participants act as market makers quoting buy/sell prices for a contract. They are penalised for prices that allow a "sure loss" under any valid configuration of the hidden rules.

  ## 2. Materials and Preparation

  ### Physical Props
  1.  **Four "Market Boards"** (whiteboards or large sheets of paper), one per team.
  2.  **Market Sheets:** A4 paper for each team to record their Buy and Sell prices for Round 1 and Round 2.
  3.  **The Box Envelopes:** You need 4 identical sets of sealed envelopes (one set per team, or one master set projected on screen). Each set contains:
      *   **Envelope M (Mode):** Contains a card saying "TWIN" or "RIVAL".
      *   **Envelope A (Box A):** Contains a card saying "RED" or "GREEN".
      *   **Envelope B (Box B):** Contains a card saying "RED" or "GREEN".
      *   *Note:* Do not open Envelope M until the very end of the debrief. Open Envelope A after Round 1 pricing. Envelope B is the settlement.
  4.  **Play Currency:** Poker chips or printed £ notes (optional, points on a leaderboard work better).
  5.  **Projector/Slides:** For timers and instructions.

  ### Pre-Generating the Data (The Script)
  You must prepare the envelopes in advance. The mathematical result relies on the marginal probability of Box A being Red being 0.5, and the conditional relationship between A and B depending on the Mode.
  Since you want the *experience* of the dilation, you should run the scenario where **Box A reveals Red**. (If A reveals Green, the logic is identical but inverted).

  **Preparation Instruction:**
  Prepare 4 identical sets of envelopes with the following fixed content (you are fixing the outcome for the sake of the exercise, which is valid as long as the *participants* do not know it):
  *   **Envelope M:** Leave Blank/Unknown to them. (In reality, you will reserve the right to claim *either* mode was possible during the pricing phase).
  *   **Envelope A:** Card says **RED**.
  *   **Envelope B:** Card says **RED** (if you want to settle as Twin) or **GREEN** (if you want to settle as Rival). *Recommendation:* Prepare two versions of Envelope B, or simply declare the settlement value based on the mode you reveal at the end. Better yet: **Do not put a card in B.** Calculate B's value based on the Mode card in M at the end. This keeps the "Dilation" active longer.
      *   *Revised Prep:* Envelope M contains **TWIN**. Envelope A contains **RED**. Envelope B is empty.
      *   *Facilitator Note:* During the game, you must maintain that *both* Twin and Rival were possible. At the very end, you reveal M was Twin. But during Round 2 pricing, they must price against the possibility of Rival.

  **Wait, to make the math hold for the group:**
  The prompt specifies: "Box A is equally likely to show red or green."
  If you fix A=Red for everyone, you are conditioning on an event that has happened. That is fine. The dilation happens *after* A is revealed.
  **Crucial:** You must convince them that before A was revealed, the setup was valid.
  **Script for Prep:**
  1.  Create 4 identical packs.
  2.  **Pack Contents:**
      *   Card 1 (Mode): **TWIN** (Keep this hidden until the end).
      *   Card 2 (Box A): **RED**.
      *   Card 3 (Box B): Leave blank. (B's colour is determined by Mode + A).
  3.  **Facilitator Cheat Sheet:** Keep a note that you *could* have chosen Rival. The exercise relies on their *ignorance* of the mode, not the randomness of the mode. You are simulating a state of "Radical Ignorance".

  ## 3. Minute-by-Minute Run of Session

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–10** | **Intro & Setup** | Welcome. Divide into 4 teams of 4. Explain the "Box" setup (Twin vs Rival). Emphasise they know *nothing* about the likelihood of the modes. |
  | **10–20** | **Round 1 (Pre-Reveal)** | Teams discuss and write down a **Buy Price** and a **Sell Price** for a contract paying £10 if Box B is Red. Rule: Prices must be "Safe" (no sure loss regardless of Mode). |
  | **20–25** | **The Reveal** | Collect Round 1 prices. Open Envelope A. Reveal **RED**. Explain: "Box A is Red. Box B is still hidden. Mode is still hidden." |
  | **25–35** | **Round 2 (Post-Reveal)** | Teams discuss and write new Buy/Sell prices. Rule remains: Must be "Safe" regardless of Mode. |
  | **35–40** | **Settlement** | Collect Round 2 prices. Reveal Envelope M (Mode = **TWIN**). Settle Box B (Red). Calculate profits/losses. |
  | **40–75** | **Debrief** | Structured discussion mapping the experience to the theory (see Section 5). |

  ## 4. Rules, Roles, and Payoffs

  ### The Narrative
  "You are market-making firms. I am the Regulator. There is a contract that pays **£10 if Box B is Red**, and £0 otherwise. You must quote a **Buy Price** (the max you'll pay) and a **Sell Price** (the min you'll accept).
  Normally, you want tight spreads. However, there is a **Robustness Rule**: I will assess your prices against *every* scenario consistent with the information I have given you. If your price allows me to construct a scenario where you *definitely* lose money, you are fined £100. If you are safe in all scenarios, you score points based on how tight your spread is."

  ### The Setup (Read to Participants)
  1.  There are two boxes, A and B. Each shows Red or Green.
  2.  I prepared them in one of two modes:
      *   **Twin Mode:** A and B always match (Red/Red or Green/Green).
      *   **Rival Mode:** A and B always oppose (Red/Green or Green/Red).
  3.  In both modes, Box A is equally likely to be Red or Green.
  4.  **Crucial:** I chose the mode. You have **no information** on how I chose. It could be 100% Twin, 100% Rival, or 50/50. You are not allowed to assume a probability for the mode.
  5.  **Your Task:** Quote prices for Box B being Red.

  ### Scoring
  *   **Round 1:**
      *   Correct "Safe" Price: Buy £5, Sell £5.
      *   If they quote Buy £4 / Sell £6: Safe, but wider spread (fewer points).
      *   If they quote Buy £6: Unsafe (Loss in Rival mode if A=Green? No, wait. In Round 1, marginal is 0.5 regardless of mode. So Buy £6 is unsafe because expected value is 5. If they Buy at 6, and the true prob is 0.5, they lose in expectation. But the rule is "No Sure Loss".
      *   *Refinement for Simplicity:* To avoid complex expected value arguments, frame it as: "I will choose the Mode and the Colour of A to minimise your profit. Price so you don't lose."
      *   *Actually, keep it mathematical:* "In Round 1, under *any* mix of modes, Box B is Red 50% of the time. If you pay more than £5, you can be arbitraged."
      *   **Winning Round 1:** Teams closest to Buy £5 / Sell £5 without crossing (Buy > Sell) get 10 points.
  *   **Round 2:**
      *   Box A is Red.
      *   If Twin: B is Red (Value £10).
      *   If Rival: B is Green (Value £0).
      *   Since Mode is unknown, Value is either £0 or £10.
      *   **Safe Price:** Buy £0, Sell £10.
      *   **Winning Round 2:** Teams who quote Buy £0 / Sell £10 get 10 points. Teams who quote anything tighter (e.g., Buy £4, Sell £6) get **-20 points** (Penalty for being "arbed").
      *   *Note:* This negative scoring is vital. They must feel the pain of assuming a 50% probability in Round 2.

  ## 5. The Debrief (Script & Theory)

  ### Phase 1: The Experience (10 mins)
  *   Ask Round 1 teams: "What did you quote?" (Most will say £5). "Why?" (Because A is 50/50, so B is 50/50).
  *   Ask Round 2 teams: "What did you quote?" (Some will say £5, some £0-£10).
  *   Reveal the penalty: "Those who quoted £5 in Round 2 lost points. Why?"
  *   Elicit: "Because if it was Rival, B is Green. If Twin, B is Red. We didn't know which."

  ### Phase 2: The "Still 50%" Objection (15 mins)
  *   *Anticipate this:* A participant will say, "But wait. Box A gave us no information about the Mode. A is 50/50 in both. So the probability of Twin hasn't changed. If we started at 50/50, we stay at 50/50. So B is still 50% Red. Why did we have to widen the spread?"
  *   *Your Response:* "That is a perfectly logical Bayesian argument. If you *assume* a prior probability for the Mode (e.g., 50% chance I chose Twin), your posterior probability for Box B remains exactly 0.5. You would not widen your spread."
  *   *The Pivot:* "However, the rules of this market forbade you from making that assumption. You were told: 'No information about how the organiser chose.' In formal terms, you were not given a **Single Prior**, you were given a **Set of Priors**."
  *   "In Round 1, every prior in that set (0% Twin, 100% Twin, 50% Twin) results in a 50% chance for Red. So you could agree on £5."
  *   "In Round 2, the priors diverge. If 100% Twin, Prob = 1. If 100% Rival, Prob = 0. Because you weren't allowed to pick one specific prior, you had to cover the whole set. Hence, £0 to £10."

  ### Phase 3: Mapping to Theory (10 mins)
  *   **Name Drop:** Now you can introduce the term. "This phenomenon is called **Dilation** in the theory of **Imprecise Probabilities**."
  *   **The Lesson:** "Usually, we think information reduces uncertainty (entropy goes down). Here, information about A made the probability of B *less* precise (interval goes from [0.5, 0.5] to [0, 1])."
  *   **Why it matters:** "In software systems, we often condition on data (Box A) while being ignorant of the system's structural state (The Mode). If we treat our ignorance as a precise 50% probability, we expose ourselves to 'sure loss' when the structure shifts. Robust decision-making requires widening our confidence intervals when structural ambiguity is present, even if the point estimate hasn't changed."

  ### Phase 4: Bayesian vs. Imprecise (5 mins)
  *   Be frank: "A precise Bayesian with a fixed prior does *not* experience dilation. They would keep betting £5. Is the Bayesian wrong? No. They are making an assumption (the prior) that you were forbidden from making."
  *   "The widening is not a feature of probability theory itself, but of **robustness to prior misspecification**. We widened the spread because we refused to guess the Mode probability. That caution has a cost: it makes our market inactive (spread too wide to trade)."

  ## 6. Predictable Failure Modes & Mitigations

  | Failure Mode | Description | Mitigation |
  | :--- | :--- | :--- |
  | **The "Fair Coin" Assumption** | Participants assume Twin/Rival is 50/50 despite instructions. | **Pre-emptive:** In the intro, say: "I might be a Twin-lover. I might be a Rival-lover. You do not know. You cannot assume fairness." <br> **In-Game:** If they argue 50/50 in Round 2, remind them of the penalty rule: "I can choose Rival mode right now to bankrupt you. Can you survive that?" |
  | **Confusing A with B** | Participants think learning A changes A's probability. | Clarify: "A is already revealed. We are pricing B." |
  | **Gambling Mindset** | Teams treat it as a guess ("I feel like it's Twin") rather than a market constraint. | Enforce the "Regulator" role strictly. If they quote £5 in Round 2, apply the penalty points visibly. "You assumed Twin. I declare Rival. You lose £5 per contract." |
  | **Time Overrun** | Debrief gets bogged down in Bayesian arguments. | Keep a timer. Acknowledge the Bayesian view is valid *with a prior*, but park the debate to focus on the *Robustness* constraint which was the game rule. |

  ## 7. Limitations of the Activity
  *   **The "Adversary" Artificiality:** In the real world, nature isn't usually adversarial. The activity forces an adversarial stance (the Regulator choosing the mode to break them) to simulate the *lack of knowledge*. In reality, the mode is fixed, just unknown. You must explain in the debrief that the "Adversary" represents the *risk of being wrong* about the structure.
  *   **Single Instance:** You are running one instance (A=Red). Statistically, dilation is a property of the *expectation* over outcomes. However, for a workshop, the single visceral instance is more powerful than averaging many rounds. Acknowledge this: "We saw one snapshot. In a long series, the average might look normal, but the *risk* in this specific moment was maximal."
  *   **The Bayesian Counterfactual:** You cannot *show* them a Bayesian agent succeeding. You can only describe it. You will have to supply this in words: "If you had been allowed to assume 50/50 Modes, you would have kept your spread tight and, in this specific instance (since I actually chose Twin), you would have made money. But you would have been vulnerable had I chosen Rival. The widening is insurance against that vulnerability."

  ## 8. Facilitator Cheat Sheet (Key Phrases)
  *   **Round 1:** "Marginal probability is 0.5 regardless of the mode mix."
  *   **Round 2:** "Conditional probability depends entirely on the mode."
  *   **The "Why":** "Ignorance about the *structure* (Mode) dominates information about the *outcome* (Box A)."
  *   **The Takeaway:** "When you don't know the rules of the game, seeing a move doesn't always help you predict the next one. Sometimes it just tells you which rule-sets are still in play."

  ---
  *Note on British English:* Ensure all written materials use "Colour", "Programme", "Centre", "£", and "Defence". Avoid "Optimize" (use "Optimise"). Ensure tone is polite but firm on the rules.
