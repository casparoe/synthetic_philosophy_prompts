prompt: |-
  Ok so I need a hand pulling apart an argument, and I'd like you to take the role of a social choice theorist / philosopher of economics who is really good at catching the moment a chain of reasoning quietly changes what it's claiming. Take your time, think it through carefully, and maybe start by brainstorming what each numbered step is actually committing you to before you decide anything.

  Context: my reading group just did the Gibbard–Satterthwaite theorem and one guy in the group has definately gotten a bit carried away with it. He wrote up this argument and I think it proves way too much, but every time I try to say where it breaks I lose the thread. Here it is, basically as he wrote it:

  (1) G-S says that any rule for choosing among outcomes that (a) can produce every one of at least three different outcomes and (b) isn't a dictatorship, is manipulable — meaning there's some preference profile at which some voter gets a strictly better outcome by reporting a ranking other than her true one.
  (2) A voter who gets a strictly better outcome by misreporting than by reporting honestly is being irrational if she reports honestly.
  (3) So in any non-dictatorial election with three or more options, a voter who understands the setup will vote strategically rather than sincerely.
  (4) But then the ballots don't encode anyone's real preferences, so the outcome doesn't reflect the voters' will in any meaningful sense.
  (5) Therefore every multi-option election is either a dictatorship or a sham, and there is no non-dictatorial, strategy-proof way to aggregate preferences over three or more options.
  (6) So we should scrap collective choice over more than two options and use markets, or a single decision-maker whose incentives we've fixed.

  I'm happy to keep (1) — it's a theorem, I'm not going to pick a fight with a theorem — and (2) seems fine to me. It's (5) and (6) I can't swallow; they'd mean the whole field is a dead end and that every student-council election is a lie. I've thought about it alot and I keep going in circles.

  Two things are nagging me. First, I feel like (2) → (3) jumps from "there's some profile where lying pays off" to "lying pays off," which sounds like a fallacy to me but also maybe that's just me restating his point and not actually a criticism. Second, my roommate keeps insisting you can beat (5) with a coin: flip a fair coin, and if it comes up heads let voter 1 pick whatever outcome she wants, if it comes up tails let voter 2 pick, and so on — she says in that scheme nobody can gain anything by lying about their ranking, and it's obviously not a dictatorship. I can't tell if she's right or if she's cheating somehow, and I also can't tell whether her objection even lands on the part of the argument that's actually broken.

  So: which step or steps should I give up? For whatever I reject, explain why it looked so plausible on the first read, and then price the repair — what do I have to accept or lose to patch the argument? Also tell me straight whether my roommate's coin scheme is a real counterexample to (5) or a red herring, and whether my hunch about the "some profile vs. our profile" slide is where the action is or whether I'm staring at the wrong step entirely.
