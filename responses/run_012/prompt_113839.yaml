answer: |-
  1. Ramsey demonstrated that no objective logical relation exists independent of human psychology, reducing Keynes's intuition to mere subjective degree of belief constrained only by coherence. This kills the core claim because if probability isn't logical, the entire Treatise structure collapses into subjective Bayesianism.

  2. The view survives only by becoming unfalsifiable, as any failed prediction of numerical probability is dismissed as a case of non-comparable logical relations rather than a theory error. This is a fatal epistemic cost because a theory that explains everything by invoking vagueness explains nothing.

  3. If probabilities are genuinely non-comparable, you cannot construct a consistent preference ordering, leaving you vulnerable to Dutch Book arguments where you accept guaranteed losses. A committed Keynesian must concede that rational action requires numerical proxies, effectively abandoning the non-comparability claim in practice.

  4. In your two-economist case, Keynes's objectivity forces you to declare one wrong, but his non-numerability escape hatch lets him call the relation indeterminate to avoid adjudicating. This forces a concession: the theory cannot distinguish between genuine indeterminacy and mere disagreement, rendering it useless for resolving expert conflict.

  5. Separating 'weight' from 'probability' creates an unintuitive dualism where more evidence can increase weight without changing probability, complicating updating rules without adding predictive power. This is merely awkward because it can be modeled within Bayesianism as sample size versus posterior mean, requiring no separate logical category.
