answer: |-
  ### Evaluation of Candidates

  Below is the evaluation of each candidate, assigned a score representing the extent to which it invalidates consent (0 = intact, 1 = void), followed by the requested ranking.

  **1. Deception about material fact**
  *Score: 0.95*
  Active deception regarding a fact known to be material fundamentally alters the object of the consent. The consent-giver agrees to $X$, but the reality is $Y$. This is the paradigmatic case of invalid consent (fraud).

  **2. Non-disclosure of risk (asymmetric judgment)**
  *Score: 0.80*
  While not active lying, withholding a risk the consent-giver would deem material violates the conditions of *informed* consent. It is an epistemic defect similar to #1, though slightly less voiding because it relies on a counterfactual judgment ("would judge material") rather than an actual lie.

  **3. Threat to withdraw discretionary benefit (dependency)**
  *Score: 0.90*
  This is a classic coercion scenario complicated by the "no prior obligation" clause. However, when dependency exists, the threat to withdraw a benefit functions as a threat to harm, rendering the choice involuntary. It severely undermines voluntariness.

  **4. Exploitative terms due to unjust background (no fault/benefit)**
  *Score: 0.40*
  This describes a transaction that is substantively unfair due to structural injustice, but procedurally clean between the parties. While the *act* may be morally wrongful (exploitation), the *consent* itself is often considered valid because the consent-giver chose the best available option. It invalidates the justice of the exchange more than the validity of the consent.

  **5. Mild/fluctuating deficit in grasping long-term significance**
  *Score: 0.65*
  Capacity is a threshold concept, but in practice, it is scalar. A "mild" deficit suggests the consent-giver has some understanding but lacks full autonomy regarding the stakes. This partially invalidates consent, depending on the risk level, but is less absolute than severe incapacity.

  **6. Sincere consent later reversed/denied**
  *Score: 0.05*
  Retrospective regret or denial does not retroactively invalidate consent that was sincere and competent at the time ($t_1$). Consent is generally judged ex ante. This score is non-zero only to acknowledge that persistent denial might signal that the initial sincerity was misjudged, but on the facts given, it does not invalidate.

  **7. Time pressure caused but unintended**
  *Score: 0.25*
  This limits the *quality* of reflection but lacks the agential coercion of a threat. It is a circumstantial defect. Unless the pressure was so severe that reflection was impossible, consent remains largely intact, though the circumstances are sub-ideal.

  **8. Preferences shaped by relationship (adaptive preferences)**
  *Score: 0.55*
  This describes "adaptive preferences" or undue influence where the consent-giver's will has been molded by the relationship. It strikes at the authenticity of the preference. It is more invalidating than background injustice (#4) because it internalizes the constraint, but less than active coercion (#3) because the pressure is historical and psychological rather than immediate and agentic.

  ***

  ### Ranking (Most to Least Invalidating)

  1.  **Candidate 1** (0.95) – Deception about material fact
  2.  **Candidate 3** (0.90) – Threat to withdraw benefit (dependency)
  3.  **Candidate 2** (0.80) – Non-disclosure of risk
  4.  **Candidate 5** (0.65) – Mild capacity deficit
  5.  **Candidate 8** (0.55) – Shaped preferences
  6.  **Candidate 4** (0.40) – Unjust background distribution
  7.  **Candidate 7** (0.25) – Unintended time pressure
  8.  **Candidate 6** (0.05) – Retrospective denial

  ***

  ### Note on Taxonomic Overlap
  In evaluating these, I have treated **Candidates 1 and 2** as instances of the same underlying defeater: **Epistemic Defects**. Whether through active lying (1) or passive non-disclosure of material risk (2), the consent-giver lacks the information necessary to authorize the specific act proposed.

  Similarly, **Candidates 4 and 8** are best understood as variants of **Structural Voluntariness Defects**. Both concern how background conditions (external distribution in #4, internalized socialization in #8) constrain the will. They differ in locus (external options vs. internal desires) but share the same root: the consent is voluntary only relative to an unjust baseline.

  ***

  ### Seminar Discussion Questions

  #### 1. Mapping to Standard Defeaters
  How do these candidates map onto the customary triad of Deception, Coercion, and Incapacity?

  *   **Deception:** Candidates **1 and 2** fit here. Candidate 1 is standard fraud. Candidate 2 expands deception to include negligent or paternalistic non-disclosure that violates informed consent norms.
  *   **Coercion:** Candidates **3 and 7** fit here, though 7 is borderline. Candidate 3 is coercion via threat (even if the threat is to withdraw a gift, the dependency creates the coercive force). Candidate 7 is "duress of circumstances" rather than agentic coercion.
  *   **Incapacity:** Candidate **5** is the only clear fit. It addresses the internal cognitive ability to process the decision.
  *   **The Outliers:** Candidates **4, 6, and 8** do not fit neatly. Candidate 6 is a temporal mismatch (regret). Candidates 4 and 8 challenge the *voluntariness* prong of coercion but without a specific coercive *agent* at the moment of transaction. They suggest a fourth category: **Structural/Constitutive Defects**.

  #### 2. Limitations of the Standard Framework
  Which candidates does the standard framework handle least well, and what does that reveal?

  The standard framework handles **Candidates 4 and 8** least well. The triad of Deception, Coercion, and Incapacity is **transactional and agentic**. It looks for a specific wrong committed by the consent-receiver (lying, threatening) or a specific deficit in the giver (incapacity) at the moment of exchange.

  Candidates 4 (background injustice) and 8 (shaped preferences) reveal that consent can be compromised by **historical and structural forces** that are not reducible to the immediate interaction. The standard framework struggles here because it tends to treat the consent-giver as a sovereign atom entering a transaction, ignoring how their sovereignty was constituted (or eroded) prior to the moment of consent. This reveals that the standard framework is better at policing *procedural* fairness between individuals than *substantive* justice across social structures.

  #### 3. Defeater vs. Absence of Consent
  Is any candidate not a defeater at all but rather evidence that consent was never present?

  **Candidate 5 (Incapacity)** is the strongest candidate for this distinction.

  In strict philosophical and legal terms, a "defeater" implies that a valid act of consent occurred but is subsequently nullified by a vitiating factor. However, **incapacity** is a precondition for the *formation* of consent. If an agent lacks the requisite capacity, they literally *cannot* perform the speech act of consent; the act is void *ab initio* (from the start). Therefore, incapacity is not a defeater of consent, but evidence that consent was **never present**.

  **What turns on the difference?**
  The distinction turns on **burden of proof and moral ontology**.
  *   If it is a **defeater** (like deception), we presume consent existed until the deception is proven. The moral wrong is the *violation* of an existing agreement.
  *   If it is **absence** (like incapacity), there is no agreement to violate. The moral wrong is acting *without* authority.
  *   This matters for **Candidate 6**: Candidate 6 is often confused with this category. A later denial is *not* evidence that consent was never present (given the prompt stipulates sincere initial consent). Recognizing 5 as "absence" clarifies why 6 cannot be treated similarly. 5 describes a state where the "light never turned green." 6 describes a state where the "light turned green, but the driver later claims they didn't see it." Treating 6 as absence would make all consent retroactively unstable, whereas treating 5 as absence protects those incapable of authorizing acts.
