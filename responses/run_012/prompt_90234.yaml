      *   *Claim 2 (Variance):* Within-group differences are almost always larger than between-group differences. Overlap is massive.
      *   *Claim 3 (Individual vs. Group):* A group statistic cannot determine an individual's score. Inferring individual traits from group data is the Ecological Fallacy.
      *   *Claim 4 (Reverse Fallacy):* Inferring group traits from individual anecdotes is also invalid (stereotyping).
      *   *Claim 5 (Aggregation):* Averaging can hide subgroups or contextual effects. Sometimes the "average" doesn't represent anyone.
