          *   Evaluate the user's suspicion about the butterfly metaphor (smuggling in a soul/continuity). Confirm/deny and suggest alternatives/requirements for a better example.
          *   Order the pieces (sequence and dependency).
          *   Address specific misconceptions ("cheer up," "Epicurus," "Eastern serenity," "reincarnation").
