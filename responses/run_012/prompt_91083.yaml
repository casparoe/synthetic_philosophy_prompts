      *   *Preconditions for Drumming:* Need to establish the "Great Clod" or the process of qi transformation first. They need to see death as a phase change, not an end.
      *   *Sequence:* Start with the outrage/skepticism. Then the ontology (qi/transformation). Then the specific stories (Smith, Skull, Wife). End with the question.
