      *   *Butterfly:* The user suspects it smuggles in a soul. I agree. The butterfly dream is about the uncertainty of boundaries, not immortality. For death, the "Smith's Furnace" is actually the stronger metaphor for what they need, because it explicitly destroys the shape. I should advise them to use the Smith metaphor for the ontology and treat the Butterfly as a side note on perspective, or drop it if it confuses things. Actually, the prompt asks me to tell them if they're right about the trap. I am right to confirm they are right. The butterfly suggests a subject experiencing the change. Zhuangzi suggests the subject is the change.
      *   *The "Outrage" Slot:* Put it right after introducing the drumming story but before explaining it. Let them sit with the discomfort.
      *   *The Final Question:* Not "does this help?" but "what does this demand of us?" or "what disappears in this view?"

