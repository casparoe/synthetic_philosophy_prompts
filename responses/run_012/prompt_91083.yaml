  2.  **Deconstruct the Philosophical Challenges:**
      *   *The Drumming on Tub:* Without context, Zhuangzi looks sociopathic. To avoid this, the volunteers need to understand that his grief isn't denied, but transformed through a shift in perspective regarding *what* death is. It's not stoicism; it's ontology.
      *   *The Butterfly:* The user is right to be suspicious. The butterfly dream is usually about epistemology (how do we know we're real?) or transformation (qi transformation). If used as "you become a butterfly," it implies personal continuity (soul). Zhuangzi's point is usually about the fluidity of boundaries and the arbitrariness of distinctions, not survival of the self. The user needs an example of transformation that doesn't imply *someone* survives the transformation.
      *   *Sequence:* Needs to build the ontology before hitting the emotional hard cases.
      *   *Misconceptions:* Need to be preempted. "Cheer up" is the biggest risk. "Epicurus" is about non-experience, Zhuangzi is about participation in change. "Eastern serenity" implies suppression of emotion. "Reincarnation" implies a fixed self moving houses.
      *   *Outrage:* Needs to be invited early so it doesn't fester.

  3.  **Drafting - Section by Section (mentally):**
      *   *Opening:* Acknowledge the difficulty. Validate the butterfly suspicion.
