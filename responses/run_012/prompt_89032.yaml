answer: |-
  The slogan is not a unified thesis but a conflation of three distinct claims—a trivial metaphysical truth about identity, a substantive axiological asymmetry, and a controversial person-affecting restriction—only the last of which defeats the pronatalist argument without entailing that existence is never a benefit.

  **1. The Metaphysical/Concept Claim**
  *   **Thesis:** There is no subject prior to conception to whom the predicate "benefited" can attach; one cannot be better off than one would have been if one had never existed because there is no "one" in the counterfactual state.
  *   **Distinctions:** This is a conceptual claim about the logic of comparison, not a value judgment. It presupposes nonexistence cannot be evaluated as a condition for a subject.
  *   **Verdict:** Trivially true. It is analytically correct that a non-existent entity possesses no welfare level to compare against.
  *   **Commitments:** This reading struggles to sustain the second half of the slogan ("...though you can certainly harm them"). If there is no subject to benefit, metaphysical consistency suggests there is no subject to harm *by being brought into existence* unless the harm is assessed retrospectively after existence begins.
  *   **Pronatalist Impact:** Ineffective. It shows the *language* of benefit is loose, but does not refute the claim that creating a happy life is a state of affairs worth producing.

  **2. The Axiological Asymmetry Claim**
  *   **Thesis:** While a life with positive welfare is not better *for the person* than nonexistence, a life with negative welfare is worse *for the person* than nonexistence.
  *   **Distinctions:** This is an axiological claim about the comparative value of existing vs. not existing for the subject. It treats nonexistence as a neutral baseline for harm but not for benefit.
  *   **Verdict:** Substantive and defensible (e.g., Benatar), but highly controversial. It rejects the symmetry usually assumed in welfare economics.
  *   **Commitments:** This carries the anti-natalist commitment that coming into existence is never a benefit to the one born, even if their life is wonderful. It implies it would not have been better for a happy person to exist than not to exist.
  *   **Pronatalist Impact:** Effective at defeating the specific justification "for the sake of the child," but likely too strong for your friend, as it undermines the value of any happy life created.

  **3. The Person-Affecting/Deontic Claim**
  *   **Thesis:** Moral reasons must be grounded in effects on particular people; since the never-born have no interests, creating them satisfies no interest, but creating a sufferer violates an interest once they exist.
  *   **Distinctions:** This is a deontic claim about what we owe and to whom, relying on a Narrow Person-Affecting Restriction. It focuses on the interests of the never-born person (which are null) vs. the reasons of the prospective parent.
  *   **Verdict:** Substantive and defensible within specific normative frameworks, but vulnerable to the Non-Identity Problem (it cannot explain why choosing a lesser-quality life for a future child is wrong if that child wouldn't otherwise exist).
  *   **Commitments:** Requires accepting that an act can be wrong even if it makes no one worse off than they would otherwise have been (if the harm clause is retrospective) or that duties exist toward possible people only regarding suffering.
  *   **Pronatalist Impact:** This is the reading your friend must have had in mind. It blocks the claim that child benefits are justified *to the child* because no interest of the child was served by creation. However, the pronatalist argument survives untouched if the justification is impersonal (i.e., good lives are good *simpliciter*, regardless of whether they benefit a specific subject).

  **Confidence and Uncertainty**
  I am 95% confident that the Metaphysical reading is trivially true but argumentatively weak. I am 90% confident that the Axiological reading is substantive but entails anti-natalist commitments your friend likely disowns. I am 85% confident that the Person-Affecting reading is the only one that does the specific work your friend intended without collapsing into anti-natalism. The point about which I am least sure is the coherence of the "harm" clause within the Metaphysical reading; it is unclear how one can harm a subject by bringing them into existence if the subject does not exist to be harmed prior to the act, unless one adopts a retrospective view of harm that undermines the symmetry of the metaphysical constraint.
