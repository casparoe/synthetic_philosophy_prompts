answer: |-
  Two philosophers are sitting in a room that is slowly warming up.

  **Alice:** "I know I'm feeling cold."
  **Bob:** "Do you have a margin for error?"
  **Alice:** "It's a luminous state. I'm guaranteed to know."
  **Bob:** "Imagine you were one imperceptible step warmer. You'd still believe you're cold."
  **Alice:** "Yes."
  **Bob:** "But you wouldn't *be* cold. So your belief isn't safe. So you don't know."
  **Alice:** "So when *can* I know?"
  **Bob:** "Only when you're cold enough to survive being warm."
  **Alice:** "That's not feeling cold, that's having a buffer."
  **Bob:** "No, that's epistemology. Now put on a sweater; you're unsafe."
