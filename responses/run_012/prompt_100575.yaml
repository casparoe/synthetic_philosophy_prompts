answer: |-
  You are not confused; you have put your finger on the central tension in modern mechanistic interpretability. What you are observing is real, it is documented, and it undermines the naive realist view that "features" exist as discrete, locatable objects inside a network in the same way organs exist inside a body.

  Here is the carving you are asking for.

  ### The Three Near-Misses

  You correctly identified the three closest concepts, but your intuition that they "don't quite fit" is precise. Here is exactly where the analogy breaks for each:

  1.  **Multiple Realizability (Philosophy of Mind):**
      *   *The Fit:* Same function (blur detection), different physical state (weights/activations).
      *   *The Break:* This term is historically reserved for *cross-substrate* or *cross-architecture* comparisons (e.g., pain in humans vs. octopuses, or silicon vs. carbon). Using it for two instances of the *same* architecture trained on the *same* data feels like category inflation. It implies a broader metaphysical claim than you need. You are observing variance within a single *model class*, not across distinct kinds of systems.
  2.  **Degeneracy (Systems Neuroscience):**
      *   *The Fit:* Structurally different elements performing the same function. Edelman's definition is very close to your observation.
      *   *The Break:* Degeneracy is typically defined *within* a single system (e.g., one brain has multiple pathways to achieve a movement, providing robustness). You are observing this *across* independent training runs. While related, "degeneracy" usually implies redundancy for fault tolerance, whereas your observation implies *optimization ambiguity*.
  3.  **Non-Identifiability (Statistics/ML):**
      *   *The Fit:* Different parameters ($\theta_A \neq \theta_B$) yield the same likelihood/behavior. This is mathematically exactly what is happening.
      *   *The Break:* It is semantically empty. Non-identifiability cares only about the input-output map. It does not capture your specific frustration: that the *internal semantic content* (the "representation of blur") is load-bearing and causal, yet unstable. You want a term that acknowledges the *meaning* inside the box, not just the box's external behavior.

  ### Why Interpretability Talks Like There's One Representation

  You asked why advisors and papers speak as if there is a canonical representation. This relies on an implicit assumption called the **Natural Abstractions Hypothesis (NAH)**.

  The NAH posits that for real-world data (like images), the structure of the data itself *forces* any efficient learner to converge on specific internal features. Under this hypothesis, "blur" is a natural abstraction in the data, so any optimal model *must* represent it in roughly the same way to minimize loss efficiently.

  When you find that Run A and Run B don't align, you are either:
  1.  Observing a feature that isn't a "natural abstraction" (blur might be too simple, allowing many lazy solutions).
  2.  Looking at layers where the representation hasn't converged to a canonical basis yet.
  3.  Encountering **Semantic Degeneracy** (see below), which suggests the NAH is weaker than hoped for intermediate features.

  Interpretability researchers often assume linear probe success equals "finding the representation." But as you noted, if you can find *different* directions in different runs that both work, the "representation" isn't a unique vector; it's a *subspace of solutions*.

  ### The Carving: A Proposed Term

  Since "Multiple Realizability" is too philosophical and "Non-identifiability" is too semantic-free, I propose we refine your neuro friend's suggestion.

  **Coined Term:** **Semantic Degeneracy**

  While "degeneracy" exists in neuro, adding "semantic" specifies that we are talking about *meaningful features* (like blurriness) rather than just input-output equivalence. It distinguishes this from simple permutation symmetry (swapping neuron indices) because you noted the *geometry* differs. It distinguishes it from polysemanticity (one neuron, many features) because this is *one feature, many neuron clusters*.

  **Definition:** The phenomenon where independently trained instances of the same architecture develop structurally distinct, non-alignable internal encodings that are each causally sufficient for the same semantic feature.

  **Boundary Cases (What this is NOT):**
  1.  **Permutation Symmetry:** If Run B is just Run A with neuron 1 and neuron 50 swapped, that is trivial symmetry, not semantic degeneracy. The geometry would be identical, just reordered.
  2.  **Feature Absence:** If Run A detects blur via a cluster and Run B detects blur via a completely different mechanism (e.g., Run B doesn't detect blur at all but guesses correctly based on correlation), that is not degeneracy; that is behavioral aliasing. Both must causally rely on the feature.

  ### Summary for Your Advisor

  When your advisor says "the model represents X," you can now ask: "Do we mean it represents X via a **Natural Abstraction** (canonical across runs), or via **Semantic Degeneracy** (functional but non-unique encoding)?" This shifts the conversation from "find the neuron" to "characterize the solution subspace."

