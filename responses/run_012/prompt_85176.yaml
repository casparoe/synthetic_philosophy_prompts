prompt: |-
  I spent about two hours last night arguing with my friend Priya — she does fieldwork on oaks and willows and has become a born-again nominalist about species, her line is basically that "species" is a filing cabinet we built and then forgot we built — and by the end of it we weren't even arguing about the same thing anymore. She was arguing about whether species are real, I kept arguing about which concept is the right one, and at some point I realised I couldn't tell whether the disagreement was substantive or whether we'd just been sliding between the species category and species taxa for an hour without noticing. So now I want to build a proper decision tree out of it for the philosophy of biology reading group I run (mix of phil grad students and two actual biologists who will be merciless about this). Please build it as a tree where every branch node is a case or a commitment someone can answer *without already knowing the name of the view it leads to* — no nodes like "do you accept the biological species concept?". Start from something like "there's a fact of the matter about how many oak species there are" and work down from there. I want these cases to do the work, because Priya and I kept talking past each other on them: a ring species where the two ends meet and don't interbreed (the Ensatina salamanders around the Central Valley, or the greenish warbler round the Tibetan plateau — the point being that interbreeding isn't transitive); obligately asexual organisms like bdelloid rotifers, and bacteria where genes move sideways between lineages; two oak "species" that hybridise freely wherever they meet and yet stay distinct; a lineage that diverges gradually over a million years with no moment where you could point and say it became two; and the ancestor problem, where if you insist every species is a whole monophyletic branch then the ancestral species has to go extinct the instant it splits, even though nothing happened to the population. Also put a node on whether a species concept has to work for fossils, and one on whether a species can survive a change of concept (i.e. is the oak taxon still the same entity under your new definition).

  The leaves should carry the names where there are names: Mayr's biological concept, the ecological one tied to niches, the cohesion concept, the evolutionary/lineage concept, the general lineage concept, Cracraft-style phylogenetic concepts (and the more radical view that only whole monophyletic branches count, so lots of traditional species turn out not to be species at all), the phenetic/morphological one, the several pluralisms (Kitcher-ish, Dupré's promiscuous realism, and the eliminativist pluralism that keeps the taxa but drops the category), the species-as-individuals thesis from Ghiselin and Hull, and the homeostatic property cluster line from Boyd. I always mix up who's attached to which of these, so correct my attributions if I've mangled one, but don't bother with citations or a reading list — I only need the labels. Where a commitment turns out to run across the whole tree rather than sitting at a leaf (I have a feeling the individuals thesis and the property-cluster view will do this), flag it as an axis instead of forcing it into a leaf, and say which leaves it cuts across.

  Two things I especially want from the output: any pair of leaves the tree can't actually separate (I'd bet the evolutionary concept and the general lineage concept collapse into each other, and I'm not sure the phenetic and plain morphological ones come apart either — but tell me where you land), and the combinations of answers nobody occupies, with a one-line diagnosis of each as incoherent, unattractive, or just unexplored. Give it to me as a JSON object with these fields: "start" (id of the first node); "nodes", an array of objects with "id", "question", "options" (array of {"answer", "goes_to"}) and "why_this_splits_them"; "leaves", an array with "id", "position", "one_line" (the claim that pins the view down), "path" (the node/answer ids that lead there) and "most_awkward_commitment"; "pairs_i_cant_separate", an array of {"a", "b", "why"}; "empty_combinations", an array of {"description", "diagnosis", "why"}; and "axes_not_leaves", an array of {"axis", "the_values", "which_leaves_cross_it"}.
