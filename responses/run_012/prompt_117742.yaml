answer: |-
  ### 1) The Questions

  **Q1. Access:** Are the basic units understood immediately by resemblance (Iconic), or do they require a legend to be learned (Symbolic)?
  **Q2. Syntax:** Can the notation express logical operators like negation or conditionals (Propositional), or only presence and quantity (Taxonomic)?
  **Q3. Dependency:** Can a statement be truth-evaluated without a verbal caption (Autonomous), or does it require a gloss to fix reference (Parasitic)?
  **Q4. Telos:** Is the primary goal the discovery of new truths (Science), or the dissemination of existing consensus (Enlightenment)?
  **Q5. Scope:** Is the vocabulary restricted to a specific domain like physics or biology (Domain), or applicable across all sciences (Universal)?
  **Q6. Temporality:** Can the notation represent a process or sequence intrinsically (Dynamic), or only a state of affairs at a time (Static)?

  ### 2) The Tree

  *   **Q1: Iconic**
      *   **Q2: Taxonomic**
          *   **Q3: Autonomous**
              *   **Q4: Science**
                  *   **Q5: Universal**
                      *   **Q6: Static** → *Leaf 1 (Neurathian Literalism)*
                      *   **Q6: Dynamic** → *Leaf 9 (Unnamed/Empty)*
                  *   **Q5: Domain**
                      *   **Q6: Static** → *Leaf 7 (Strict Empiricism)*
              *   **Q4: Enlightenment**
                  *   **Q5: Universal** → *Leaf 4 (Expressive-Limits View)*
                  *   **Q5: Domain** → *Leaf 6 (Visual Reductionism)*
          *   **Q2: Propositional**
              *   **Q3: Autonomous**
                  *   **Q4: Science**
                      *   **Q5: Universal** → *Leaf 9 (Unnamed/Empty - Merged above)*
                      *   **Q5: Domain** → *Leaf 8 (Unnamed/Empty)*
              *   **Q3: Parasitic** → *Leaf 9 (Unnamed/Empty - Incoherent)*
      *   **Q1: Symbolic**
          *   **Q2: Taxonomic**
              *   **Q3: Parasitic**
                  *   **Q4: Enlightenment** → *Leaf 3 (The Code View)*
                  *   **Q4: Science** → *Leaf 10 (Blind Classification)*
              *   **Q3: Autonomous**
                  *   **Q4: Science** → *Leaf 10 (Blind Classification - Merged)*
          *   **Q2: Propositional**
              *   **Q3: Parasitic**
                  *   **Q4: Science**
                      *   **Q5: Domain**
                          *   **Q6: Dynamic** → *Leaf 2 (The Auxiliary View)*
                          *   **Q6: Static** → *Leaf 5 (Instrumentalism)*
                      *   **Q5: Universal** → *Leaf 8 (Unnamed/Empty)*
              *   **Q3: Autonomous**
                  *   **Q4: Science** → *Leaf 5 (Instrumentalism - Merged)*

  *(Note: Branches are pruned where philosophical positions converge or are deemed incoherent to maintain the target leaf count.)*

  ### 3) The Leaves

  1.  **Neurathian Literalism:** Commits to the awkward claim that counting icons is logically equivalent to asserting a proposition.
  2.  **The Auxiliary View:** Commits to the awkward claim that the visual component adds no truth-value, serving only as a mnemonic for the real (verbal/math) notation.
  3.  **The Code View:** Commits to the awkward claim that public statistics are a cipher to be cracked rather than a language to be read.
  4.  **Expressive-Limits View:** Commits to the awkward claim that pictures can show "how much" but never "why not."
  5.  **Instrumentalism:** Commits to the awkward claim that a notation can be scientifically rigorous without being semantically autonomous.
  6.  **Visual Reductionism:** Commits to the awkward claim that complex social data can be made intuitive without losing essential nuance.
  7.  **Strict Empiricism:** Commits to the awkward claim that visual science must be restricted to taxonomy and cannot model causal processes.
  8.  **Unnamed (Empty):** *Incoherent:* No one holds that a symbolic, propositional, autonomous, universal visual language exists without it collapsing into mathematics.
  9.  **Unnamed (Empty):** *Unattractive:* No one holds that icons can intrinsically represent temporal dynamics without relying on symbolic conventions (like arrows).
  10. **Blind Classification:** Commits to the awkward claim that symbols can sort data scientifically without any interpretive framework.

  ### 4) Empty Branches

  *   **Iconic + Propositional + Autonomous:** This branch is empty because if a picture is self-explanatory (Iconic), it lacks the arbitrary syntax required for logical operators like negation (Propositional); if it has the syntax, it is no longer purely Iconic.
  *   **Symbolic + Propositional + Universal + Science:** This branch is empty because any notation robust enough for universal science (like math) ceases to be distinctly "visual" in the pictorial sense and becomes formal symbolism, which falls outside the pictogram thesis.
  *   **Iconic + Dynamic:** This branch is empty because static images cannot show process without employing symbolic conventions (like motion lines or sequence numbering), which moves the position into the Symbolic branch.

  ### 5) What the Cases Show

  *   **ISOTYPE Population Pyramid:** Separates **Neurathian Literalism** from **Expressive-Limits**. If the chart is read directly as "more people here," it is Literalism; if it is seen as merely illustrating a table that holds the real truth, it is Expressive-Limits.
  *   **Feynman Diagram:** Separates **The Auxiliary View** from **Instrumentalism**. If the diagram is just a picture of the integral (Auxiliary), it is parasitic; if the diagrammatic manipulation *is* the calculation (Instrumentalism), it is autonomous.
  *   **Subway Map:** Separates **The Code View** from **Visual Reductionism**. If the map is a topological cipher requiring a legend (Code), it is symbolic; if the colors and lines are meant to be intuitively geographic (Reductionism), it is iconic.
  *   **Sheet Music:** Separates **Instrumentalism** from **Strict Empiricism**. Music notation is symbolic and dynamic (Instrumentalism); if one argues it only classifies sounds without prescribing action, it becomes Strict Empiricism.
  *   **Pedigree Chart:** Separates **Strict Empiricism** from **The Auxiliary View**. It is domain-specific and static (Empiricism), but if treated as a shorthand for genetic probability equations, it becomes Auxiliary.
  *   **Emoji Sequence:** Separates **Visual Reductionism** from **Unnamed (Iconic + Propositional)**. An emoji story attempts to be iconic and propositional; the tree shows this branch is empty, predicting the sequence will fail without textual context (collapsing to Reductionism).
  *   **Indistinguishable Pair:** The tree cannot separate **Instrumentalism** and **The Auxiliary View** on the case of **Chemical Formulae**. Both views agree it is symbolic, propositional, and scientific; they only disagree on whether the spatial arrangement carries meaning independent of the algebraic equivalent, which is often undecidable in practice.
