  *   **The Nash Bargaining Solution:** Maximizes the product of the players' gains over the fallback ($ (u_A - d_A) \times (u_B - d_B) $).
  *   **The Kalai-Smorodinsky (KS) Solution:** Equalizes the ratio of each player's gain to their maximum possible gain. Geometrically, it is the intersection of the frontier and the straight line drawn from the fallback point to the "Ideal Point" (the coordinate of maximum possible utilities).

  **Why both fit your past data:**
  1.  **Conditions 1 & 2 (Linear Frontiers):** On any straight-line frontier, the Nash solution and the KS solution are mathematically identical. They both select the midpoint of the feasible gains. This is why your first two experiments couldn't distinguish them.
