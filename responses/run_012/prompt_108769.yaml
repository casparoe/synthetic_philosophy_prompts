  Next weeks condition: fallback (0,0), and the frontier runs from (0,10) straight to (8,8), then straight to (18,0).

  What is she going to call? I've been assuming she's just running the Nash solution (maximize the product of the two players' gains over the fallback), and a friend in the department insists it's the Kalai-Smorodinsky solution (equalize each player's gain as a fraction of the biggest gain they could possibly get). I want the whole picture: every rule that fits all three of her calls, what each of those rules predicts for next week, which one you'd bet on and why, and, if her call next week doesn't settle it, what condition we should run to tell the surviving rules apart. American English, please.
