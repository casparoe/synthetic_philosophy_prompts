answer: |-
  ### 1. Exam Question

  **Metaphysics Final Examination**
  **Time Allowed:** 90 Minutes
  **Word Limit:** 1200 Words Maximum
  **Instructions:** Answer the following question. This is a closed-book examination. You will not be rewarded for citing authors or secondary literature; marks are awarded solely for the clarity, accuracy, and depth of your philosophical argument.

  **Question:**

  Consider a possible world, $W$. The total history of $W$ (its "mosaic" of particular facts) is fixed. According to the Best System Account (BSA) of laws, the laws of $W$ are the axioms of the deductive system that best balances simplicity and strength in summarising that mosaic.

  Now, consider a specific regularity, $R$ (e.g., "All particles of type $X$ have charge $Y$"). In $W$, the mosaic is such that there are two competing deductive systems, System $A$ and System $B$, which are exactly tied for best. They are identical in overall simplicity and overall strength.
  *   **System $A$** includes $R$ as a fundamental **axiom**.
  *   **System $B$** does not include $R$ as an axiom. Instead, it derives $R$ as a **theorem** from a different set of axioms concerning other matters.

  Since both systems axiomatise the same mosaic, they entail the same total set of truths about $W$. The only difference is the structural status of $R$ within the system (axiom in $A$, theorem in $B$). Assume this tie is metaphysical, not merely epistemic; there is no further fact about simplicity or strength that breaks the tie.

  Write an essay addressing the following:

  1.  **The Humean Dilemma:** Given this tie, is $R$ a law of $W$? Analyze the consequences of defining laws as the *axioms* of the best system versus defining laws as *any theorem* of the best system. Does one option render lawhood arbitrary, and does the other render it trivial?
  2.  **The Anti-Humean Parallel:** Does an Anti-Humean account (such as one positing necessitation between universals or primitive lawhood) face a structurally similar problem regarding the distinction between fundamental laws and derived regularities? Or does the Anti-Humean have a resource to break the tie that the Humean lacks?

  Your answer should focus on the metaphysical implications of the axiom/theorem distinction rather than general summaries of Humean vs. Anti-Humean views.

  ***

  ### 2. Model Answer

  The "Two Calendars" case presents a structural instability for the Best System Account (BSA). The core issue is not whether the regularity $R$ holds—it holds in the mosaic regardless—but whether $R$ possesses the specific metaphysical status of *lawhood*. Because the BSA defines lawhood relationally (via a system's optimization), a tie between systems with different internal structures creates an indeterminacy that forces a choice between arbitrariness and triviality.

  If the Humean defines laws strictly as the *axioms* of the best system, $R$'s status as a law becomes contingent on a descriptive choice rather than a feature of the world. In System $A$, $R$ is a law; in System $B$, it is a mere consequence. Since the systems are ex hypothesi tied on all objective criteria (simplicity and strength), there is no factual basis within the Humean framework to prefer $A$ over $B$. Consequently, whether $R$ is a law is indeterminate. This suggests lawhood is an artefact of our descriptive packaging. If the world does not dictate which system is the "best" due to the tie, then the world does not dictate the laws. This undermines the intuition that laws are mind-independent features of nature, reducing them to features of the most efficient description we can happen to formulate.

  Alternatively, the Humean might define laws as *any theorem* of the best system. This resolves the indeterminacy: since both $A$ and $B$ entail $R$, $R$ is a law regardless of which system is chosen. However, this invites the problem of triviality. Every truth in the mosaic is a theorem of a system that entails the whole mosaic. If every theorem is a law, the distinction between law and accidental regularity collapses. The standard Humean response is to restrict lawhood to the axioms to preserve the distinction between fundamental governing principles and local accidents (e.g., "all gold spheres are less than a mile across"). But retreating to the axiom view returns us to the first horn: in a tie case, the distinction between a fundamental principle and a derived accident becomes relative to the chosen system. Thus, the Humean struggles to maintain that laws are both objective and distinct from mere regularities when the optimal description is not unique.

  Does the Anti-Humean escape this? Anti-Humeans typically posit that laws are metaphysical grounds for regularities, not summaries of them. For a necessitarian or dispositional essentialist, $R$ is a law if there is a relevant relation between universals or a disposition that necessitates $R$. This appears to break the tie: either the metaphysical ground exists or it does not, independent of our axiomatisation. However, a structural symmetry remains. Anti-Humeans also distinguish between fundamental laws and derived regularities. If $R$ is necessitated by a more fundamental law $L$, $R$ is often treated as a downstream consequence rather than a law in its own right.

  The problem arises if the metaphysical grounds themselves are underdetermined. If the structure of universals or dispositions allows for two equally fundamental configurations—one where $R$ is grounded directly, and one where it is grounded indirectly via other properties—the Anti-Humean faces a parallel indeterminacy. While they avoid the "descriptive packaging" problem of the BSA, they may still face a "metaphysical packaging" problem. If the ontology permits multiple fundamental bases that yield the same mosaic, the status of $R$ as a fundamental law versus a derived consequence remains unsettled.

  However, the Anti-Humean has a potential advantage. They can posit that the tie is impossible because metaphysical determination is unique. If laws are primitive posits (as in primitivism), the world simply contains the law $R$ or it does not. The tie in the BSA arises because simplicity and strength are competing virtues we impose on a mosaic. If Anti-Humean laws are ontological constituents, there is no "system" to optimize, only facts to obtain. Therefore, while the Anti-Humean must explain the fundamental/derived distinction, they are not forced to derive it from an optimization procedure susceptible to ties.

  In conclusion, the Two Calendars case exposes a vulnerability in the BSA's reliance on systematization. Defining laws as axioms risks making lawhood arbitrary in tie cases; defining them as theorems risks erasing the law/accident distinction. The Anti-Humean avoids the descriptive arbitrariness by locating laws in the ontology rather than the summary, but must still account for why some regularities are fundamental and others derived without appealing to the very simplicity criteria that generated the tie for the Humean.

  ***

  ### 3. Marking Scheme (Total: 20 Marks)

  **A. Reconstruction of the Dilemma (5 Marks)**
  *   **5:** Clearly articulates that the tie is metaphysical, not epistemic. Explains that System $A$ and $B$ cover the same facts but differ on the status of $R$.
  *   **3:** Identifies the tie but treats it as an epistemic limitation (i.e., "we can't know which is best") rather than a metaphysical indeterminacy.
  *   **1:** Vague summary of the case; fails to distinguish axiom from theorem.
  *   **0:** Misstates the case (e.g., claims the systems predict different facts).

  **B. Analysis of the Humean Options (5 Marks)**
  *   **5:** Correctly identifies the two horns: (1) Laws = Axioms leads to arbitrariness/indeterminacy in tie cases; (2) Laws = Theorems leads to triviality/inflation (losing the law/accident distinction).
  *   **3:** Identifies the arbitrariness problem but fails to explain why the "Theorem" option is unacceptable (triviality).
  *   **1:** Claims Humeans simply pick the "simpler" one (ignoring the stipulation that they are tied).
  *   **0:** Claims Humeans are instrumentalists or that laws are "just useful fictions" (False/Outside scope).

  **C. The Anti-Humean Parallel (5 Marks)**
  *   **5:** Argues that Anti-Humeans face a structural analogue (fundamental vs. derived) but notes they may avoid the *source* of the tie (optimization vs. ontology). Acknowledges that primitivism/necessitation changes the terrain but doesn't automatically solve the underdetermination if the ontology itself is flexible.
  *   **3:** Claims Anti-Humeans definitely solve the problem because "laws are real," without addressing the fundamental/derived distinction.
  *   **1:** Dismisses Anti-Humeanism as irrelevant or claims they face the *exact* same problem without modification.
  *   **0:** Asserts Anti-Humeans have no problems whatsoever (uncritical).

  **D. Argumentative Quality & Constraints (5 Marks)**
  *   **5:** Coherent, logical flow. No name-dropping without explanation. Adheres to word count.
  *   **3:** Disorganized or relies on author names (e.g., "Lewis says...") instead of arguments.
  *   **1:** Significant confusion between Humean and Anti-Humean definitions.
  *   **0:** Plagiarism or irrelevant content.

  **Specific Penalties (Deduct from Total):**
  *   **-2 Marks:** Treating the tie as **epistemic** (e.g., "We just can't tell which system is better"). The prompt stipulates the tie is metaphysical.
  *   **-2 Marks:** Claiming **Humeans are instrumentalists**. The BSA is a realist account about what constitutes lawhood, not a denial of truth.
  *   **-2 Marks:** **Name-dropping** without analysis (e.g., listing Armstrong or Bird without explaining the structural move regarding fundamental vs. derived laws).
  *   **-1 Mark:** Exceeding word count by more than 10%.

  **Grading Notes for Markers:**
  *   *Honesty about Contestability:* Do not penalize students for not "solving" the tie. Reward them for recognizing that the BSA lacks a standard mechanism for breaking structural ties without compromising its core definitions.
  *   *Anti-Humean Nuance:* A student should not get full marks on Section C if they claim Anti-Humeanism is immune to all underdetermination. They must recognize that while the *source* of the problem differs (ontology vs. systematization), the distinction between fundamental and derived laws remains a pressure point.
  *   *Axiom vs. Theorem:* This is the core mechanical point. If a student conflates the two, they cannot score above 10/20.
