nd Second Company becomes one half, which is a much larger increase for that specific possibility than for the other two, and that seems arbitrary. A says that B is conflating two different things: the proposition that the material conditional is true, and the conditional proposition itself. She says that when she is told 'if Red then Second Company', she is not told that the material conditional is true in the sense of being told a proposition that can be true or false independently of where she is. She is told something about the structure of the territory: that the Red region is contained in the Second Company area. That is a fact about the world, yes, but it is a fact about the relation between the regions, not a fact about her location. She says that updating on that relational fact is not the same as updating on a proposition about her location. She says that the constraint is on the conditional probability, and the conditional probability constraint does not determine the marginal probability of Red. She says that if you want to determine the marginal, you need an additional principle, such as maximum entropy or minimal relative entropy, and that principle is not itself given by the information. She says that B is implicitly using maximum entropy, which yields one third, but that principle is controversial and not forced by the logic of conditional information. B says that A's position leads to a kind of immobility: if the constraint does not determine a unique posterior, then any posterior that satisfies it is rational, and that seems too permissive. He says that in ordinary reasoning, if you learn 'if Red then Second Company', you would indeed become less confident that you are in Red, because you have ruled out a way of being in Red. He says that A's intuition that Red should stay at one half is based on a mistaken picture where the information is only about the conditional link and therefore 'screens off' the antecedent. But he says that the information is evidence about the antecedent, because it eliminates a possibility in which the antecedent is true. He says that if you think of it in terms of possible worlds, the worlds where Red and Headquarters are now excluded, and since some of those worlds were Red worlds, the total measure of Red worlds goes down. He says that A's proposal to keep Red at one half requires you to add measure to the Red and Second Company worlds to compensate, which is not justified by the evidence. A says that B's possible-worlds argument assumes that the excluded worlds are removed and the remaining worlds are reweighted equally. But she says that the evidence does not tell her that the remaining worlds are equally likely. It only tells her that the excluded worlds are impossible. She says that the evidence is silent on how to redistribute the probability mass that was on the excluded worlds. She says that one could redistribute it entirely to the Blue worlds, or entirely to the Red and Second Company worlds, or in many other ways, and all would satisfy the conditional constraint. She says that the fact that B finds uniform redistribution natural is a psychological fact about him, not a logical consequence of the evidence. She says that if you want to argue for uniform redistribution, you need a principle like maximum entropy, and that principle is not self-evident. She says that she is not saying Red must stay at one half; she is saying that the information alone does not determine whether it stays at one half or drops to one third. She says that B is presenting a particular update rule as if it were the only rational one, when in fact it is one among several. B says that A's position is too weak. He says that if the information alone does not determine a unique posterior, then we need a principle to choose among the permissible posteriors, and the most defensible principle is to minimise the change in the overall distribution. He says that maximum entropy does exactly that: it finds the