answer: |-
  This case shows that the Doctrine of Double Effect makes moral permissibility depend on hidden causal facts unknown to the agent, violating the principle that moral status should supervene on the agent's perspective.

  In a dark mine collapse, a rescuer drops a heavy stabilization beam to halt a shaft collapse saving five trapped miners (Good), knowing it will certainly kill one worker positioned below (Bad). Unknown to the rescuer, in Branch A the beam saves the five only by striking the worker below, whose body completes an electrical circuit triggering the stabilizers (the killing impact is the means); in Branch B the beam triggers the stabilizers via a magnetic sensor as it passes, while unrelated debris dislodged by the drop kills the worker (the death is a side effect).

  **Check:** The act is dropping the beam; the good effect is saving five miners; the bad effect is killing one worker. In Branch A, the bad effect is a means to the good; in Branch B, it is not. The verdict is impermissible in Branch A and permissible in Branch B. The four conditions are met as follows: (1) the act is permissible in itself (rescue); (2) the bad effect is not intended as an end (both branches); (3) the bad effect is not used as a means (failed in A, met in B); and (4) the good is proportionate to the bad (5 > 1, both branches).

  **Transparency Test:** The doctrine is not transparent in this case, as it declares the act impermissible in one causal branch and permissible in the other while the agent's evidence and intentions are identical. Reading the means clause as a claim about the agent's plan rather than about causal structure restores transparency, because the agent's plan is identical in both branches. The load-bearing feature is the hidden causal dependency of the good effect on the bad effect.

  **Conclusion:** A defender of the doctrine should concede that permissibility becomes a matter of moral luck relative to the agent's epistemic position. If the agent could have settled the structural fact cheaply, the case collapses into negligence, rendering the act impermissible in both branches regardless of the causal path.
