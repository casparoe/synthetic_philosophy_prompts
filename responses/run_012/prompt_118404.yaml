answer: |-
  ### Tier 1: Paradigm Cases
  *These examples robustly satisfy all three criteria. The competence is high, the system lacks any semantic grasp, and there is no intelligent designer to whom comprehension can be relocated.*

  **2. The vertebrate eye, explained as the product of natural selection.**
  Satisfies (i) through high-fidelity vision, (ii) because the evolutionary process holds no mental states, and (iii) because natural selection is blind, leaving no designer to harbor the comprehension.
  *Tag: Darwinian*

  **3. Affinity maturation in the immune system.**
  Satisfies (i) via effective pathogen neutralization, (ii) as individual cells do not represent the goal of immunity, and (iii) since the selection mechanism is internal and biological rather than designed by a mind.
  *Tag: Darwinian*

  **9. A slime mould in a maze settling into a tube along the shortest route.**
  Satisfies (i) by finding the optimal path, (ii) because the organism operates via chemical gradients without a nervous system, and (iii) as the behaviour emerges from physical dynamics rather than external intelligence.
  *Tag: Darwinian*

  ### Tier 2: Systemic Emergence
  *These satisfy (i) and (iii) well, as the competence emerges from a system without a central controller, but they involve human participants whose individual comprehension complicates the "Absence" criterion slightly.*

  **6. A market-clearing price that summarises information no individual participant possesses.**
  Satisfies (i) by efficiently allocating resources, (ii) because the price itself represents no mind's knowledge, and (iii) as the order is spontaneous rather than legislated, though it relies on comprehending agents.
  *Tag: Darwinian*

  **8. A body of common-law rules accumulated from individual court decisions.**
  Satisfies (i) by providing social order, (ii) since the system of law has no singular intent, and (iii) because the rules evolve through case history rather than top-down design, despite judges' comprehension.
  *Tag: Darwinian*

  **5. A reinforcement-learning agent that learns a game by self-play from the rules alone.**
  Satisfies (i) with superhuman play, (ii) as the network weights do not semantically represent "winning," and (iii) reasonably well, though the learning algorithm itself is human-designed, the strategy is not.
  *Tag: Both (Flag: Tension between Turing-style execution and Darwinian policy selection via reward)*

  ### Tier 3: Engineered Competence
  *These satisfy (i) and (ii) for the machine, but fail (iii) significantly. The competence is real and the machine understands nothing, but the intelligence is largely relocated into the human designer or data.*

  **7. A large language model producing a fluent and factually accurate summary.**
  Satisfies (i) with high-quality text and (ii) as the model predicts tokens without grasping meaning, but struggles with (iii) because the competence is distilled from human-written training data.
  *Tag: Turing-style*

  **4. A chess engine with a hand-written evaluation function and alpha-beta search.**
  Satisfies (i) with grandmaster play and (ii) as the search is blind symbol manipulation, but fails (iii) because the evaluation function explicitly encodes human strategic understanding.
  *Tag: Turing-style*

  **1. A production compiler's optimizer.**
  Satisfies (i) by improving code performance and (ii) as it manipulates syntax without knowing "speed," but fails (iii) since the optimization transformations are hand-coded by engineers who understand the goal.
  *Tag: Turing-style*

  ### Tier 4: The False Positive
  *This case fails the core definition because the "Absence" criterion cannot be met; the competence is inextricably linked to a form of comprehension.*

  **10. A human expert's immediate, confident judgement in a familiar situation.**
  Satisfies (i) with reliable expertise, but fails (ii) because the expert does possess a non-propositional grasp of the situation, which is the very phenomenon Dreyfus sought to defend.
  *Tag: Neither*

  ***

  ### Ambiguous Placements

  The two items whose placement the definition least settles are **Item 7 (The LLM)** and **Item 10 (The Human Expert)**.

  **Item 7 is hard** because criterion (iii) (Non-relocation) is contested: it is unclear whether training on human text counts as "relocating" comprehension into the data creators, or if the model's novel recombination of that data constitutes genuine new competence without comprehension.

  **Item 10 is hard** because criterion (ii) (Absence) turns on a philosophical dispute: if "grasp" requires propositional representation, the expert lacks it, but if "grasp" includes non-conceptual attunement (as Dreyfus argues), the expert possesses it, making this a case of competence *with* comprehension.
