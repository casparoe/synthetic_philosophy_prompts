          *   *Distributional:* It is *likely/independent*. (This is where people get confused. Smart people aren't necessarily nice, but does intelligence *drift* goals?)
      *   *Instrumental Convergence:* Regardless of the final goal, certain sub-goals (self-preservation, resource acquisition, cognitive enhancement) are useful for achieving *almost any* final goal.
