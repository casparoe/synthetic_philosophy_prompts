prompt: |-
  Im a third-year PhD student in cog sci and I've been roped into running next week's session of our department's philosophy-of-AI reading group — mostly ML engineers who've never taken a phil course and a couple of philosophers who've never touched a neural net. The topic is the orthogonality thesis and instrumental convergence, and I don't want you to explain them to me; I want a plan for how to teach them in about 70 minutes, because last time I did this I front-loaded the definitions and everyone nodded politely and then spent the last twenty minutes arguing as if "orthogonality" just meant "AI won't automatically be nice" and as if instrumental convergence fell straight out of it. So: what order do the pieces have to go in so the distinction actually lands — what has to be in place before the next thing can even be stated, and where exactly do the two theses come apart? I have a hunch that a lot of the trouble is that people slide between a modal reading of orthogonality (any final goal can be paired with any level of intelligence — a claim about what's possible) and a distributional reading (in fact a mind's goals are independent of how smart it is — a claim about what's likely), and that the whole "so superintelligence will be misaligned" move lives off that slide plus treating instrumental convergence as if it were unconditional. If that's right, build the sequence around it; if it's wrong, tell me why and build it around whatever the real hinge is.

  I also need the one example that carries the whole session. Please not the paperclip maximizer — half of them have heard it and the other half think it's a joke about office supplies, and either way it smuggles in the feeling that the point is "AI will be silly." I want a carrying example that has whatever it actually needs (a single terminal goal that's trivial and non-anthropomorphic, an environment where a few generic sub-goals become instrumentally useful, maybe scarce resources so that resource acquisition is convergent only because of the setup) and lacks whatever would let them dismiss it (it shouldn't be a real product, shouldn't be evil, shouldn't be about humans at all). Tell me what the example has to have and has to avoid, and then give me the example.

  Then walk me through the misconceptions in the order they'll actually surface and where in the sequence I head each off — I'm expecting at least: orthogonality = "intelligence doesn't imply morality", instrumental convergence = "all AIs secretly want the same things", and something like "convergence means we can predict what it'll do, so it's reassuring" (I think that one's backwards but I want the plan to absorb it). Give me one question to ask at the very end that would actually tell me whether they got the distinction rather than just memorized my slides, and tell me what I should openly refuse to cover at this level so I don't get dragged into the whole "is intelligence even one thing" rabbit hole. Oh, and one of the philosophers will definately ask whether any of this survives if "intelligence" is ill-defined, so tell me where in the plan to park that instead of letting it derail the room.
