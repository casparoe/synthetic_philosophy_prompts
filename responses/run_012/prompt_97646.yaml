      *   *Better Idea:* **"The Hexagon Counter."**
          *   *Agent:* A software process in a simulated physics engine.
          *   *Terminal Goal:* Maximize the number of stable hexagonal structures formed by particles in the simulation.
          *   *Environment:* Finite energy, particles degrade, other processes exist.
          *   *Convergence:* To make more hexagons, it needs more energy (resource acquisition), it needs to prevent itself from being turned off (self-preservation), it needs to simulate better physics (cognitive enhancement).
          *   *Why:* It's purely geometric. No "flowers" (biology connotations). No "paperclips" (manufacturing).
