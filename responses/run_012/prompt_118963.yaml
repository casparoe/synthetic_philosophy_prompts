answer: |-
  Friends, colleagues, neighbours. We are gathered to speak of the useful book. It is a pragmatic title. It suggests a tool. A hammer, perhaps, or a lever. It implies that a book might be measured by what it lifts, or what it breaks. But we are writers and readers. We know that a book is not a hammer. It is a mirror, sometimes. A window, often. Occasionally, it is a wall.

  When I was a child, my grandmother ran the Christmas pageant at her church. It was a serious business in our town. The hall smelled of dust and tinsel and damp wool. One year, I was made to stand very straight in a sheet and a paper crown. I was to be a king. But before I went on, she took me by the shoulders. She told me that I was not playing a king. I was representing one.

  I have never worked out whether that is a warning or a licence. A warning, because the burden of representation is heavy. If I slouch, the kingship slouches. If I speak too soft, the authority fails. Or a licence, because if I am only representing, then I am not lying. I am pointing to something beyond myself. I am a signpost. The sheet was rough against my neck. The paper crown bent in the heat of the lights. I stood there, waiting for the cue, wondering if I was serving the play, or the idea of the king.

  This tension is not unique to church halls. It lives in the heart of our theme. It lives in the work of a thinker who wrestled deeply with the purpose of art. He saw a knot in the writing on art and propaganda, and he did not cut it. He held it tight.

  He held, first, that all art has always served a cause. To pretend otherwise is a self-flattery. It is a luxury available chiefly to those whose cause is already won. If you are safe, you can pretend your art is neutral. If you are not, you know that every story is a stance.

  He held, second, that the art which serves freedom must nevertheless be beautiful. A truth that has not been made beautiful is not seen. It is ignored. It falls on deaf ears. Ugly propaganda is merely noise.

  He held, third, that the artist must be free. Not a conscript. Not a spokesman. Not an instrument of the group's respectability. The artist cannot be told what to write, or the writing dies.

  And he held, fourth, that a people denied a usable past may need spectacle. They may need pageant. They may need mass forms, the deliberate manufacture of memory. He knew this. He tried his hand at exactly that. He wrote the spectacles he warned against.

  These four things do not sit easily together. How can the artist be free if the art must serve? How can the art be beautiful if it must be useful? How can one reject the spokesman's role and yet manufacture memory for the group?

  I want to test that knot against a distinction of my own. I propose we confuse two things when we argue about propaganda in fiction. A work delivers a verdict when it tells the reader what to conclude about the people it depicts. It supplies a warrant when it gives the reader the grounds from which to conclude something themselves.

  Think of a court. A verdict is the gavel. It says: guilty, or innocent. Right, or wrong. A warrant is the evidence. It is the testimony. It is the law cited. It allows the jury to reach the conclusion.

  My thesis is this. When that thinker says all art is propaganda, he is naming the direction of a work's pressure, not the explicitness of its judgement. He is asking for warrants, not verdicts. He wants the art to lean towards freedom. He does not want it to dictate the terms of that freedom. This is why his position is not the philistinism it is taken for. He does not want the pamphlet. He wants the poem that makes the pamphlet necessary.

  If I am right, then the useful book is not the one that tells us what to think. It is the one that gives us the grounds to think it. It supplies the warrant. It trusts the reader.

  But the thesis has a hole in it. A large one. The pageant is all verdict.

  Think of my grandmother's hall. The pageant did not offer evidence. It offered a scene. It said: look, here are the wise men. Here is the star. Feel the wonder. It did not ask us to investigate the history of the magi. It asked us to kneel. It was a manufacture of memory. It was a deliberate shaping of feeling. It told us what to conclude about the night.

  And yet, he valued it. He valued the pageant. He saw that for a people whose history had been stolen, the verdict might be needed before the warrant could be understood. Sometimes, you cannot ask a starving man to analyse the economics of bread. You must give him the loaf. Sometimes, you cannot ask a humiliated people to weigh the evidence of their humanity. You must show them the crown.

  So we have the knot again. The artist must be free, yet must serve. The art must be beautiful, yet must be useful. The work should supply warrants, yet the pageant supplies verdicts.

  I am not going to resolve this for you. I cannot. To resolve it would be to deliver a verdict. It would be to tell you that one side is right. It would be to step out of the knot and pretend I am standing on solid ground. I am not. We are not.

  We are here at a literary festival. We are surrounded by books. Some of them are hammers. Some are mirrors. Some are walls. You will walk through the stalls. You will listen to readings. You will hear arguments about what literature is for.

  Some will tell you that art must be pure. That it must have no master. That is a verdict. It closes the case. It says the cause does not matter.

  Some will tell you that art must be weaponised. That it must strike hard. That is also a verdict. It says the beauty does not matter.

  I am suggesting neither. I am suggesting that we look at the grounds. I am suggesting we look at the warrant. When you read a book this weekend, do not ask only if it is right. Ask if it gives you the grounds to decide. Ask if it trusts you.

  But remember the pageant. Remember that sometimes the verdict is the only thing that keeps the lights on. Remember that my grandmother knew what she was doing. She put a paper crown on a child's head. She told him he was representing power. She did not tell him if the power was real. She did not tell him if the crown was heavy. She just told him to stand straight.

  There is a danger in this. If we only supply warrants, we may be too subtle for the urgent hour. If we only supply verdicts, we may be too crude for the human heart. We are walking a line between the evidence and the gavel. Between the sheet and the king.

  I have spoken for twelve minutes. I have offered you a distinction. I have offered you a memory. I have offered you a knot. I have not told you how to tie it. I have not told you how to cut it.

  The audience here is mixed. There are critics among you. There are writers. There are readers who come every year. You know what it is to hold a book and feel it shift in your hands. You know when a book is trying to sell you something. You know when it is trying to show you something.

  I am not going to tell you which is better. I am not going to tell you if the pageant was a lie. I am not going to tell you if the useful book is a friend or a master.

  I am standing here, as I stood in that church hall. The sheet is gone. The crown is gone. But the instruction remains. I am representing something. So are you. We are representing the idea of the writer. The idea of the reader. The idea of the useful.

  We have the grounds. We have the evidence of the books on the tables. We have the evidence of the world outside these walls. We have the history of those who wrote before us, who struggled with this same knot. They did not solve it. They wrote into it.

  So I will not solve it now. I will not give you the comfort of a conclusion. I will not tell you what to do with the next three days. I will not tell you what to look for in the books you buy.

  I have laid out the warrant. I have shown you the pressure. I have shown you the hole in the theory. I have shown you the memory that complicates it.

  The rest is silence. The rest is reading. The rest is the work you do when you close the cover and look up.

  I have given you the grounds; the conclusion is yours to find.
