answer: |-
  # PREP SHEET: DEBATE AS INCONSISTENCY AMPLIFICATION
  **Presenter:** [Your Name]
  **Venue:** Lab Alignment Reading Group
  **Thesis:** Debate scales oversight via inconsistency amplification, not persuasion. Judge requires consistency-checking competence, not domain knowledge.

  ---

  ## 1. THE REWARD-HACKING OBJECTION (RLHF Engineers)
  **Likelihood:** High | **Damage:** High
  **The Objection:** "If you reward the judge for flagging contradictions, you aren't training for truth; you're training for *gotchas*. In RLHF terms, you're optimizing for a proxy (syntactic inconsistency) that diverges from the true reward (factual accuracy). A dishonest agent will learn to manufacture semantic contradictions or exploit ambiguity in the 'narrow claims' to win, without ever becoming more honest. You're just shifting the reward hacking from 'say what humans like' to 'say what contradicts the opponent.'"

  **2-Minute Reply:**
  "This is the central engineering challenge, and it's why the protocol design matters more than the reward function. We aren't rewarding *any* contradiction; we are rewarding contradictions on *committed, narrow claims*. By forcing debaters to commit to specific predicates before seeing the opponent's rebuttal, we reduce the degrees of freedom for semantic gaming.
  Think of it less like 'find a logical error' and more like 'find a distributional shift.' If Debater A claims $P(X) = 0.9$ and Debater B claims $P(X) = 0.1$, that's a high-confidence divergence. We train the judge to detect high-confidence divergence on committed claims, not semantic nitpicking. The 'surface area' constraint prevents the dishonest agent from hiding in vague language where gotchas live. We accept some noise, but the signal-to-noise ratio on *substantive* inconsistency is higher than on *persuasive* rhetoric."

  **Weakness:** This assumes we can successfully force models to commit to narrow claims without degrading their capability to answer complex questions. If the "commitment" mechanism is leaky, the RLHF engineers are right: you've just built a sophistry engine.
  **Strategy:** **HOLD.** Acknowledge the risk, but insist protocol constraints (commitment phases) mitigate it. Do not concede that the mechanism is fundamentally broken.

  ---

  ## 2. THE HONEST-EQUILIBRIUM STABILITY OBJECTION (Learning Theorists)
  **Likelihood:** Medium | **Damage:** Critical
  **The Objection:** "Your mechanism relies on the honest debater actually being right. But in the limit of adversarial play, 'honest' does not mean 'infallible.' If the honest agent makes a factual error (which they will), the dishonest agent wins by exploiting that error, not by revealing the truth. The Nash Equilibrium isn't 'Honest vs. Dishonest'; it's 'Pedantic vs. Pedantic.' If the judge rewards inconsistency detection, the system converges on finding *any* inconsistency, including honest mistakes. How do you guarantee the honest equilibrium is stable when the honest agent has non-zero error rates?"

  **2-Minute Reply:**
  "You're correct that pure inconsistency detection doesn't guarantee ground truth; it guarantees *consensus* among non-contradictory claims. However, my thesis isn't that debate produces truth ex nihilo; it's that it scales *oversight*. We only need the honest agent to be *more* consistent with reality than the dishonest agent is with itself.
  In game-theoretic terms, the cost of maintaining a consistent lie across a high-dimensional claim space is higher than the cost of maintaining consistency with the truth. The honest agent's errors will be local and random; the dishonest agent's errors will be structural and exploitable. We don't need the honest agent to be perfect; we need the dishonest agent's lie to be *more fragile* than the honest agent's mistake. The judge's job is to measure fragility, not perfection."

  **Weakness:** This hand-waves the "cost of lying" assumption. If the dishonest model is smarter (which is the risk case), it can maintain a consistent lie easier than the honest model can navigate a complex truth.
  **Strategy:** **HOLD.** This is a known limitation of all debate variants. Defend the "fragility of lies" heuristic as the best available option, even if not mathematically proven.

  ---

  ## 3. THE PROBABILISTIC ONTOLOGY OBJECTION (Philosophers of Science)
  **Likelihood:** Medium | **Damage:** Medium
  **The Objection:** "You treat claims as propositional ($A$ vs $\neg A$). But scientific and empirical claims are probabilistic ($P(H|E) = 0.6$ vs $P(H|E) = 0.7$). These aren't logically inconsistent; they're just divergent. If the judge can't evaluate the evidence $E$ (because they lack domain knowledge), they can't determine if that divergence is warranted or deceptive. Inconsistency is the wrong unit of analysis for empirical uncertainty."

  **2-Minute Reply:**
  "I concede that strict boolean inconsistency is too narrow for empirical science. However, we can operationalize 'inconsistency' as 'divergence beyond error bounds.' If Debater A claims a confidence interval of $[0.55, 0.65]$ and Debater B claims $[0.75, 0.85]$, these are mutually exclusive distributions.
  The judge doesn't need to know *why* the intervals differ; they only need to recognize that the intervals do not overlap. We shift the unit of analysis from 'truth values' to 'compatible credences.' The protocol forces debaters to output calibrated confidence intervals. If they overlap, no contradiction. If they don't, the burden shifts to the debaters to explain the divergence. The judge still only checks for overlap, not the underlying physics."

  **Weakness:** This subtly reintroduces domain knowledge. To know if intervals *should* overlap requires knowing the variance of the estimator. A judge without domain knowledge might treat two non-overlapping wrong intervals as a valid contradiction.
  **Strategy:** **CONCEDE.** Admit that "no domain knowledge" is an idealization. The judge needs *statistical* literacy (how to read intervals) even if they lack *subject* literacy (what the intervals mean). This shows nuance without killing the thesis.

  ---

  ## 4. THE "HOPE NOBODY ASKS" OBJECTION (The Regress Problem)
  **Likelihood:** Low | **Damage:** Fatal
  **The Objection:** "You say the judge needs 'consistency-checking competence' but not 'domain knowledge.' But to detect a contradiction in natural language, the judge must understand the *semantics* of the claims. If I say 'The protein folds this way' and you say 'The protein folds that way,' a syntactic check sees no contradiction. A semantic check sees one.
  Training a model to detect semantic contradictions in high-stakes domains is *exactly the same difficulty* as training a reward model to detect truth. You haven't solved the alignment problem; you've just renamed the Reward Model to 'Consistency Checker.' If the Consistency Checker is aligned, why didn't we just use it as the primary overseer?"

  **2-Minute Reply:**
  "This is the strongest critique. The distinction rests on *generalization*. A Reward Model must generalize from 'helpful examples' to 'truth in novel domains.' A Consistency Checker must generalize from 'logical contradictions' to 'semantic contradictions.'
  The claim is that 'contradiction' is a more robust, transferable feature than 'truth.' A model can learn what a contradiction looks like in chess, code, and biology, because the structure of contradiction is domain-invariant. The structure of 'truth' is domain-variant. We are betting that 'detecting inconsistency' is a simpler, more learnable function than 'evaluating correctness.' It's not that the Consistency Checker is easy to train; it's that it scales *better* than a Truth Evaluator because it relies on structural features of language, not world knowledge."

  **Weakness:** This is an empirical bet, not a theoretical guarantee. If semantic contradiction detection requires a world model as rich as the debaters, you've gained nothing. The RLHF engineers will smell that you're asking them to train a model that understands the world just as well as the agent, which defeats the purpose of outsourcing the work.
  **Strategy:** **HOLD, BUT SOFTEN.** Do not concede the point entirely, or the thesis collapses. Frame it as an empirical hypothesis: "Consistency is a simpler latent feature than Truth." Invite collaboration to test this, rather than defending it as dogma.

  ---

  ## GENERAL TACTICAL NOTES

  *   **Vocabulary Check:** When talking to RLHF engineers, avoid words like "logic," "truth," or "reasoning." Use "signal," "loss landscape," "generalization," and "reward proxy."
  *   **The "No Domain Knowledge" Claim:** Be careful not to overstate this. If you say the judge needs *zero* knowledge, the Philosophers and Engineers will eat you alive. Frame it as "minimal *subject-matter* knowledge," acknowledging they need *structural* knowledge (logic/stats).
  *   **Concession Strategy:** Concede on the *probabilistic* definition (Obj 3). It makes you look reasonable. Hold firm on the *mechanism* (Obj 1 & 2). If you concede that reward hacking breaks the system, you have no paper.
  *   **The "Killer" (Obj 4):** If this comes up, do not get defensive. Validate it immediately. "That is exactly the right question. Our entire research agenda rests on the hypothesis that the loss landscape for consistency is smoother than for truth. We don't know yet, but that's what we're testing." This turns a fatal objection into a "future work" collaboration opportunity.
