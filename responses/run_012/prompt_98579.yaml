      *   *Objection 3 (Phil):* Probabilistic Claims aren't Boolean.
      *   *Objection 4 (The Killer):* Semantic Ambiguity requires Domain Knowledge (undermines core thesis).

      *Wait, let's refine the "Hope Nobody Asks".* The user's thesis is "Judge needs only recognize two debaters cannot both be right." The killer objection is: "In high-dimensional latent space, two statements *can* both be right (or wrong) without being logically contradictory, unless you define the ontology. Who defines the ontology?"
      *Actually, simpler:* "If the judge is an AI, why is it easier to train a Consistency-Checker than a Truth-Teller?" This hits the RLHF crowd hard. It questions the *premises* of the safety gain.

      *Let's go with the "Consistency vs. Truth" anchor.* If consistency is the only metric, two colluding liars win. The user says "two debaters cannot both be right." The objection is "They can both be wrong, consistently."
      *No, the user's thesis is about *inconsistency amplification* between *opposing* debaters.*
