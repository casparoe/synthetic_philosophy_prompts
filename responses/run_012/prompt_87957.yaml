answer: |-
  The question: Whether private persons may licitly slay a usurper who burdens the commonwealth when no superior is accessible.

  Objections:
  1. It seems they may, for you have written that disturbing a tyranny is not sedition if the subjects suffer less harm from the disturbance than from the tyrant's government, and here the hunger of the poor outweighs the danger of the deed.
  2. Further, a usurper has no true authority but is like a brigand holding a fortress, and any man may kill a brigand who threatens the common safety.
  3. Moreover, when the emperor fails to judge, the city becomes its own superior, and these forty act as the voice of the city's necessity.

  On the contrary:
  The Apostle says that he who resists the power resists the ordinance of God, and the canons forbid clerics from shedding blood even in defense.

  Determination:
  I answer that we must distinguish between a tyrant who holds a lawful title but rules unjustly, and one who seizes power by force without any title. In the case of the former, private persons have no authority to kill him, for the power he holds, though abused, is from God for the order of the community, and to remove him belongs to the superior who granted the office. In the case of the usurper, who holds by force alone, the matter is more doubtful; yet even here, the slaying of a ruler, however false his title, touches the order of justice which belongs to the public, not to private will. If every private man who judges a ruler to be a usurper may strike him down, the commonwealth is exposed to the peril of faction, where each man makes himself a judge, and the disturbance often becomes greater than the tyranny, as men fight over who shall rule next.

  Therefore, even against a usurper, the remedy must be public rather than private. If the city is indeed the superior in the absence of the emperor, it must act as a city, through a public council or decree, not through a secret conspiracy of forty men. The order of justice requires that the removal of a ruler, even a false one, be done by the body whose good he violates, acting in its public capacity, lest the example be set that rule is taken by the dagger rather than by law. To kill him secretly as he leaves the cathedral is not an act of justice but of ambush, and savors more of treachery than of virtue, for it uses the sacred place and time as a trap.

  Concerning the oath, I say that an oath which binds a man to commit an injustice is no true oath but a perjury from the start. As Augustine teaches, one must not keep faith with those who plot evil, nor even with oneself to do evil. The canon among them violates his order by consenting to bloodshed, and the consuls violate their office by seeking a remedy outside the public form. They are bound not to keep the oath, but to repent of having sworn it, for no vow can bind against the charity of God or the safety of the soul.

  Replies to the objections:
  1. My words on sedition concern the public disturbance of a regime, not the private assassination of a ruler; the harm is measured not only in bread but in the order of justice, which private killing subverts.
  2. A usurper is not a brigand if he holds the place of judgment and peace; while he sins in holding it, he is not to be treated as a common robber unless he wages open war on the citizens.
  3. The city is the superior only when it acts as a whole through its public forms, not when a faction claims to represent it without the consent of the multitude or the counsel of the bishop.
