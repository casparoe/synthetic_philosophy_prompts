      *Refined:* I love your aunt's story, honestly, but I think you're conflating "capability" with "functioning," which is the whole point of the view. I'm not saying she *needs* to get a degree or work a desk job to be equal; I'm saying she needs to have the genuine opportunity to do so if she ever changed her mind. You say she's free to do more, but is she? Or did she just learn to want what was within reach? That's the trap of adaptive preferences—people scale down their desires to match their circumstances so they don't feel the pain of deprivation. If she *could* have finished school but chose bikes, the Capabilities Approach says she's equal. But if systemic barriers made school impossible, then her happiness doesn't fix the inequality. So my question is: how do you distinguish between a free choice and a choice made because the other doors were already locked?

