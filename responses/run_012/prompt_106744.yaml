  3.  **Formulate the Capabilities Approach Response:**
      *   *Key Concept:* The distinction between *capability* (the real opportunity) and *functioning* (the actual achievement).
      *   *Key Concept:* Adaptive Preferences (people scaling down desires to match limited opportunities).
      *   *Rebuttal to User:* I'm not judging her *choices* (functionings), I'm judging whether she has genuine *options* (capabilities). If she *could* have gotten an education but chose not to, that's fine. But if she *couldn't* because of systemic barriers, that's inequality.
      *   *Rebuttal to Paternalism Charge:* It's not about forcing her to be something; it's about ensuring the door is open. The money view fails because money doesn't guarantee freedom (e.g., disability, discrimination). The happiness view fails because people get used to oppression (adaptive preferences).
      *   *Tone:* Respectful but firm on the theory. High school level appropriate but intellectually rigorous.
      *   *Length:* About a paragraph.

  4.  **Drafting the Response:**
      *   Acknowledge the aunt. She sounds great.
      *   Clarify the misconception: Capabilities isn't about forcing functionings. It's about the *set* of opportunities.
      *   Address the "freedom" point: Is her freedom real or just nominal? Could she actually have gone to school if she wanted to?
      *   Address the "happiness" point: Happiness can be adaptive.
      *   Close with a question/challenge to the user.

      *Draft:* I love your aunt's story, honestly, but I think you're mixing up what we mean by "capability" versus "functioning." The Capabilities Approach doesn't say she *must* get a degree or work a desk job to be equal; it says she needs to have the genuine opportunity to do so if she ever changed her mind. If she didn't finish school because she freely chose to ride bikes instead, great—that's her functioning, and she's fully equal. But if she dropped out because her family couldn't afford it or because the system pushed her out, then she lacks the capability, even if she's happy now. Happiness can be tricky because people often scale down their desires to match what's possible—that's what we call "adaptive preferences." So my question to you is: how do we know her choice was truly free if the option to finish school was never really on the table?

