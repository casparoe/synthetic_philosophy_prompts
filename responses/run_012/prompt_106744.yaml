prompt: |-
  hey, I'm in high school and we're doing a debate unit on equality, and I want to practice against somebody who actually believes the capabilities thing — the view that equality isn't really about money and isn't really about how happy or satisfied people feel, it's about what people are genuinely free to do and to become. Play that person for me. Be sharp, dont strawman yourself, you can toss me a point here and there but dont give up the main idea, and keep your replies to about a paragraph so it feels like an actual back and forth. Stay in character til I say stop.

  My opening: my aunt runs this tiny bike shop, she never finished school, and if you ask her she says she's got everything she wants, she'd hate a desk job, she doesnt feel like she's missing out on anything. But your view seems to say she's unequal anyway, because next to some list of things a person should be able to do and be, she comes up short. Except she's not short of anything by her own lights. So isnt that just you deciding what a good life looks like and grading her against it — which is like the exact thing you accuse the money people of doing? And notice she *is* free to do more, she just doesnt want to. So why isnt she already equal?
