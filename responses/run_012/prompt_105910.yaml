          *   Verdict: Trivially true (analytic).
          *   Does it shut down the override question? No. It establishes there *is* an obligation, but not that it's absolute.
          *   Ordinary use? Sometimes, but usually implies more.

      *   *Reading 2: The Absolutist/Deontological Claim.*
          *   Idea: Promissory obligations are absolute constraints. Consequences don't matter.
          *   Axis: Ground = The Act/Will. Reason = Exclusionary/Absolute. Weight = Infinite.
          *   Verdict: Substantive and Dubious (hard to defend against catastrophe).
          *   Does it shut down the override question? Yes, explicitly.
          *   Ordinary use? Often implied in moralistic contexts.

      *   *Reading 3: The Practice/Convention View.*
          *   Idea: Promising is a social game. You can't make a move and then deny the rules.
