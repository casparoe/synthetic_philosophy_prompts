answer: |-
  The rental car hummed, a low, electric drone that seemed to vibrate in the fillings of Elena's teeth. Rain smeared the windshield into grey streaks, the wipers thumping a rhythmic, boring timekeeper. Dan was driving. He had one hand on the wheel and the other gesturing vaguely at the dashboard.

  "It's the history, Elena. That's where you lose me. You're telling me a neuron in a brain means something different depending on what its great-grand-neurons did a million years ago? That's astrology for biologists."

  Elena stared out at the passing motorway barriers. "It's not astrology. It's the only way to make sense of error. Look, take the Dust-skimmer. We've been over this."

  "The fake mole thing."

  "The Dust-skimmer. It has one specific neuron. Ground shakes, neuron fires, animal dives. Simple. Now, what does that firing *mean*?"

  "Easy," Dan said, indicating for the middle lane. "It means *ground shaking*. That's what correlates with the firing. One-to-one mapping. Shake happens, fire happens."

  "So if a clumsy mate walks past and shakes the ground, and the Skimmer dives... what happened there?"

  "False positive. The neuron fired. It meant 'ground shaking', and the ground *did* shake. It just wasn't a predator."

  "But the Skimmer didn't dive because of a mate. It dove because its system treated the shake as a threat. If the content is just 'ground shaking', the animal isn't wrong. It's perfectly accurate. The ground shook. So where's the mistake?"

  Dan sighed, tapping the brake as traffic slowed. "The mistake is in the *action*, not the representation. The signal was right. The reaction was wasteful."

  "That's moving the goalposts," Elena said. "We're talking about mental content. If the neuron's job is to signal danger, and it fires for a mate, it's misrepresenting the situation. It's saying 'Predator' when there is none. Your view can't handle that. If meaning is just 'whatever reliably triggers it', then the content isn't 'Predator'. It's 'Predator OR Clumsy Mate OR Rockfall'. It's a disjunction. And if the content is that huge disjunction, the animal is *never* wrong. It can never misrepresent the world."

  "Okay, fine," Dan said. "Maybe it's never wrong. Why does it need to be wrong to have meaning? Maybe the Skimmer doesn't have concepts like 'error'. It just has a reflex."

  "Because we're trying to explain intentionality. Aboutness. If I believe there's a cookie in the jar and there isn't, I'm wrong. My belief has content. If the Skimmer's state has content, it must be capable of being false. Teleosemantics gives you that. The content is 'Predator' because that is what the mechanism was *selected for*. The mate-trampling is noise. It's a malfunction of the signal, even if the physics is consistent."

  "Selected for," Dan repeated. "There it is. The magic words. So, imagine this. A Dust-skimmer is born. But it doesn't inherit the dive reflex genetically. It learns it. It watches its mother dive when the ground shakes, and it copies her. Same neuron, same firing pattern, same dive. Does that neuron mean the same thing?"

  Elena shifted in her seat. "The function is derived from the learning mechanism's history, not the genetic one. If the learning mechanism was designed to copy survival behaviors, the content is still 'Danger'."

  "So the content depends on *how* it got there?" Dan pressed. "If I clone the Skimmer, and one is born with the gene and the other is a blank slate that learns it in a week... you're telling me the exact same physical state in the exact same brain tissue has different *meanings*?"

  "I'm telling you the normative status is different. One is functioning according to a genetic norm, the other according to a learned norm."

  "That's insane, Elena. It's internalism versus externalism gone mad. If I hold up a map, the map means 'London is here' regardless of who drew it. If a lightning bolt struck a tree and carved a perfect map of London, it still represents London. You're saying the lightning map doesn't count because it has no 'history of selection'?"

  "A map carved by lightning doesn't have a function. It's just wood grain that looks like a map to *us*."

  "To us! Exactly!" Dan slammed his hand lightly on the steering wheel. "Meaning is in the eye of the beholder, or it's in the current causal structure. You're outsourcing meaning to the graveyard of ancestors."

  "Without the ancestors, you don't have a standard for 'wrong'. Look, let's push your view. The Swamp-Skimmer."

  Dan groaned. "Here we go."

  "Hear me out. A perfect physical duplicate of the Skimmer pops into existence. Quantum fluctuation. No parents. No evolution. No learning history. Just *poof*, it's there. It has the neuron. The ground shakes. It dives. A predator was actually there. It survives. What did the neuron mean?"

  "It meant 'Predator'. Because it tracked the predator and saved the life."

  "But there was no history," Elena said. "No selection. No function. On my view, that creature is a zombie. It has no representations. It's just a causal machine. Like a thermostat doesn't *believe* it's cold, it just reacts. Your Swamp-Skimmer is a biological thermostat."

  "So you're saying if I met this thing, I couldn't say it was afraid?"

  "You could say it *acted* afraid. But it had no mental content. It had no 'aboutness'."

  "That is the most counter-intuitive thing I've ever heard," Dan said, merging onto the slip road for the airport. "If it quacks like a duck, if it runs like a duck, if it avoids predators like a duck... you're saying it's not a duck because it doesn't have a pedigree?"

  "I'm saying 'meaning' isn't a physical property like mass. It's a relational property. Like being a 'husband'. You can't be a husband without a marriage history. You can have all the physical attributes of a husband, live with the woman, wear the ring. But if you never married, you aren't a husband. The Swamp-Skimmer isn't representing. It's just mimicking representation."

  "But the animal doesn't know its history!" Dan argued. "The Skimmer doesn't carry a scroll of its evolutionary past in its pocket. It just fires. How can the history be doing the work *now*?"

  "Because the history establishes the norm. If the neuron fires when there's no predator, it's failing its job. If the Swamp-Skimmer's neuron fires when there's no predator, it's just... firing. It's not failing. It's just physics. You can't fail if you were never hired."

  Dan shook his head, focusing on the signs for Terminal 4. "Okay, let's go back to the disjunction. You said my view makes the content 'Predator OR Mate OR Rock'. You say yours makes it just 'Predator'. But what if, over a million years, the Skimmers evolve in an area where the only thing that shakes the ground is mates? Predators go extinct. The shake-dive reflex stays because maybe it helps them avoid rockfalls sometimes. Now the history says 'Mate', but the old history said 'Predator'. Which one wins? When does the meaning switch?"

  Elena paused. The car slowed as they approached the drop-off zone. "It switches when the selection pressure shifts. It's fuzzy. Concepts are fuzzy."

  "Fuzzy?" Dan laughed. "So meaning is vague? 'Kind of a predator, sort of a mate'?"

  "Biological functions are vague. Hearts are for pumping blood, but they also make a thumping noise. Is the function 'noise'? No. But the line between a side-effect and a function isn't always razor-sharp. That doesn't mean there's no distinction."

  "It means your theory can't pin down the very thing it's supposed to explain," Dan said, pulling up to the curb. He put the car in park. "You want history to fix the content, but history is a messy, branching river. You can't point to a single drop and say 'That's the meaning'."

  "And you want current correlation to fix it, but correlation is everywhere," Elena countered. "The neuron fires with the shake. But the shake correlates with the predator. It also correlates with the time of day. It correlates with the wind speed. Why is 'shake' the content and not 'Tuesday Afternoon'? Because of the function. You need the 'for' to narrow down the 'of'."

  Dan turned off the engine. The silence rushed back in, heavier than the hum. He looked at her.

  "So, the Swamp-Skimmer. If I kick it, it feels pain?"

  "If it has a pain system selected for avoidance, yes. But its *thoughts* about the kick? No."

  "It's a philosophical zombie."

  "It's a history-less duplicate."

  "It's a duck without a pedigree," Dan said. He opened his door. "I think you're worshipping ghosts. Selection is dead. The animal is alive. The meaning has to be in the living tissue, not the dead ancestors."

  Elena unbuckled her seatbelt. "And I think you're describing a clockwork universe and calling it a mind. If there's no standard for getting it wrong, there's no meaning. Just cause and effect."

  She got out and grabbed her suitcase from the back. Dan leaned across the seat.

  "Safe flight," he said.

  "Thanks." Elena closed the door. She tapped the roof twice.

  As she walked toward the check-in desk, Dan watched her go. He looked down at his own hand, flexing the fingers. He wondered, briefly, if the movement meant *'greeting'* or just *'muscle contraction'*, and whether it mattered that his father had taught him to wave. He put the car in drive and pulled away, the argument unresolved, hanging in the rain like the exhaust fumes.
