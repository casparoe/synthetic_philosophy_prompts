      *   *Critique:* Is the math clear?
      *   *Fix:* Explicitly contrast the magnitude of vertebrate vs. invertebrate deaths to show why the $N$ term swamps the $P(S)$ term.
      *   *Critique:* Did I answer "what would have to change"?
      *   *Fix:* Be specific. It's not just "be nicer." It's structural change to agriculture.

  9.  **Final Polish:** Check against the prompt's specific questions.
      *   What view of moral status? (Threshold + Administrative).
      *   Strict presupposition vs. fits? (Presupposes negligible status, fits with human bias).
      *   Consistent? (No, not on aggregate).
      *   Apply scoring rule? (System collapses).
      *   Committed answer? (Line is indefensible, change is required).

