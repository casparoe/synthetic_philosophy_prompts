answer: |-
  **OMPANY POLICY 704: AUTHENTICITY & ALIGNMENT FRAMEWORK**

  **1.0 Preamble: Definition of Authentic Presence**
  At OmniGlobal, we recognize that human capital is not merely a resource but a locus of freedom. To maximize synergy, employees must achieve Authentic Presence. Authenticity is defined herein as the total coincidence of the employee with their function. You are what you do. However, you are also what you are not yet. Therefore, you must become what you are. This policy mandates that all personnel eliminate the distance between their internal consciousness and their external role. Hesitation is interpreted as misalignment. To claim you are "trying" is to admit you are not yet "being." We require you to be.

  **2.0 Role Embodiment and Function**
  2.1 Employees must inhabit their job descriptions without irony. When performing duties, the distinction between the individual and the role must dissolve.
  2.2 Client-facing staff, in particular, are expected to execute service interactions with such precision that the action appears inevitable. The hand that offers the pen must not be observed as a hand belonging to a person, but as an instrument of the transaction itself. Any awareness of playing a part constitutes a performance error.
  2.3 You are your resume. You are your title. To suggest otherwise during review cycles is to engage in factual misrepresentation.

  **3.0 Value Discovery and Compliance**
  3.1 Core Values are not constructed by the employee; they are objective realities existing within the market ecosystem. It is the employee's duty to discover these Values and conform to them.
  3.2 Resistance to a Value indicates a failure of perception, not a disagreement with principle.¹

  **4.0 Commitment and Resolution**
  4.1 Past resolutions do not mechanically determine future actions. A promise made yesterday does not bind the will today.
  4.2 However, employees are expected to act as though bound by previous commitments. You must remake your resolution in every moment. If you fail to uphold a commitment, you cannot claim you "forgot" or "slipped." You chose, in that moment, to be someone who breaks promises.
  4.3 Anguish regarding this constant re-commitment is expected. It is evidence of engagement. Numbness is a compliance violation.

  **5.0 Accountability and Identity**
  5.1 You are responsible for who you are.
  5.2 You are responsible for who you become.
  5.3 You are responsible for the constraints placed upon you, as you have chosen to remain in a environment where those constraints exist.

  ***

  **Appendix A: Frequently Asked Questions**

  **Q: Am I responsible for my emotional state during work hours?**
  A: Yes. Emotions are not things that happen to you; they are strategies you employ. If you are anxious, you have chosen anxiety to cope with freedom. You are responsible for your coping mechanisms.

  **Q: Can I be authentic if my authentic self conflicts with policy?**
  A: Authenticity requires you to be what you are. If you are an employee, you must be an employee. If your authentic self conflicts with this, you are not being authentic to your facticity. You must choose: be authentic to your role, or be authentic to your freedom and leave. Staying while complaining is bad faith.

  **Q: Who is liable if I choose incorrectly?**
  A: You are. Since nothing compels you to choose correctly, the error is entirely yours. The Company provides the situation; you provide the meaning.

  **Q: Does signing this document bind me to these terms?**
  A: Only insofar as you continue to interpret yourself as bound by it. You are free to tear it up. You are also free to be fired. You must choose which freedom you prefer.

  ***

  ¹ *Note: While Values are objective realities, conformity is a subjective act. You are therefore responsible for the Values you discover, as you chose to look for them.*

  ***

  **Author's Note on Philosophical Liberties**

  The piece assumes the standard *Being and Nothingness* reading where authenticity equals assuming one's freedom, though some scholars argue Sartre later moved toward a more social ethics in the *Notebooks for an Ethics*. I simplified the "waiter" example into HR speak regarding "instrumental transactions." The prompt's summary of bad faith is accurate; I only compressed the "gambler" example into Clause 4.2. The primary liberty is treating bad faith as a policy violation rather than an ontological structure; Sartre suggests we are *always* in bad faith, whereas the handbook implies we can escape it via compliance. This contradiction is intentional to the satire.
