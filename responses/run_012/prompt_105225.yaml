answer: |-
  **Wall Rule:** Block sales of bodies, identities, or protected access; allow trades of time, labor, or goods where consent is free and third parties are unaffected.

  ### The Decision Procedure

  **Step 1: The Legality Filter**
  *   **Question:** Is this transaction explicitly illegal in the seller's or buyer's jurisdiction (e.g., organ sales, prostitution, unlicensed financial instruments)?
  *   **If Yes:** **BLOCK.** Cite specific statute. Do not pass go.
  *   **If No:** Proceed to Step 2.
  *   **If Unknown:** **ESCALATE** to Legal. Do not guess.

  **Step 2: The Bodily Integrity Filter**
  *   **Question:** Does the transaction require the seller to surrender control of a body part, undergo irreversible modification, or accept significant health risk as the core deliverable?
  *   **If Yes:** **BLOCK.** (Principle: Bodies are not property. Consent cannot validate self-harm or commodification of integrity.)
  *   **If No:** Proceed to Step 3.
  *   **Note:** Temporary use of body (modeling, labor) is fine. Permanent alteration (tattoos for ads, surrogacy) is not.

  **Step 3: The Identity & Relationship Filter**
  *   **Question:** Is the core value being sold based on *who the seller is* (family, grief, love, citizenship, specific personal history) rather than *what the seller does* (labor, time, skill)?
  *   **If Yes:** **ESCALATE.** (Principle: Markets crowd out social norms. Selling kinship or mourning degrades the meaning of those institutions.)
      *   *Guidance for Escalation:* If the listing is "acting service" (generic), it may pass. If it is "fake relative" (specific identity claim), it likely fails.
  *   **If No:** Proceed to Step 4.

  **Step 4: The Fairness & Access Filter**
  *   **Question:** Does this transaction allow the buyer to bypass a system designed to allocate scarce resources based on need, time, or equality (e.g., rent-controlled waitlists, public hospital queues, government permits)?
  *   **If Yes:** **BLOCK.** (Principle: Protected access must remain non-fungible to prevent wealth from overriding need.)
  *   **If No:** Proceed to Step 5.
  *   **Note:** Private retail lines (sneakers, clubs) are *not* protected systems. Public/Regulated queues *are*.

  **Step 5: The Coercion & Desperation Filter**
  *   **Question:** Is there evidence the seller is acting from dire necessity (survival, debt distress) rather than opportunistic gain, such that the "consent" is compromised by circumstance?
  *   **If Yes:** **ESCALATE.** (Principle: Exploiting desperation violates dignity even if legal.)
  *   **If No:** Proceed to Step 6.
  *   **Note:** High price alone is not desperation. Context clues (language, frequency, item type) matter.

  **Step 6: The "Yuck" Test (Disgust vs. Principle)**
  *   **Question:** Is the team's objection based on harm/fairness, or simply because the transaction feels weird/untraditional?
  *   **If Harm/Fairness:** Return to previous steps.
  *   **If Weird/Untraditional:** **ALLOW.** (Principle: Disgust is not policy. Innovation often looks strange.)
  *   **If Unsure:** **ESCALATE** to Trust & Safety Lead.

  ***

  ### Case Applications

  **1. The Queue Spot (Sneaker Drop)**
  *   **Step 1 (Legality):** Pass. Scalping is generally legal for retail goods.
  *   **Step 2 (Body):** Pass. Standing in line is labor/time.
  *   **Step 3 (Identity):** Pass. The seller is selling time, not who they are.
  *   **Step 4 (Fairness):** Pass. A private sneaker release is not a protected public resource. The "first come, first served" norm is private policy, not public law.
  *   **Step 5 (Desperation):** Pass. Likely opportunistic income.
  *   **Step 6 (Yuck):** Pass. It feels icky because it advantages wealth over patience, but it's not harm-based.
  *   **Decision:** **ALLOW.**
  *   **Justification:** This is a trade of labor (time spent waiting). While it creates inequality of access, it does not violate bodily integrity, identity, or protected public systems.
  *   **The Queasy Bit:** You should feel uncomfortable here. This decision accepts that wealth can buy time advantages in private markets. If a reporter asks, "Why do you let rich people cut lines?" your answer is "We facilitate labor, not queue management." This is where the procedure prioritizes market freedom over distributive fairness.

  **2. The Rentable Relative (Weddings/Funerals)**
  *   **Step 1 (Legality):** Pass. No statute against fake guests.
  *   **Step 2 (Body):** Pass. Physical presence is labor.
  *   **Step 3 (Identity):** **FAIL/ESCALATE.** The core value is the *appearance of kinship*. The seller is renting out the social status of "family member" or "mourner."
  *   **Decision:** **ESCALATE (Likely Block).**
  *   **Justification:** This triggers the "crowding out" effect (the daycare fine example). Monetizing grief or kinship converts a social obligation into a market transaction, degrading the meaning of the event for other participants (third-party harm).
  *   **Where it Breaks:** A sharp operator could re-list this as "Event Acting Service: Professional Guest." The procedure relies on your team distinguishing between "acting" (labor) and "impersonating family" (identity). If the listing says "I will cry on cue," it's acting (Allow). If it says "I will be your grieving aunt," it's identity (Block). The line is thin.

  **3. The Forehead Ad (Tattoo)**
  *   **Step 1 (Legality):** Pass. Advertising is legal.
  *   **Step 2 (Body):** **FAIL/BLOCK.** A tattoo is an irreversible modification. Selling skin space for ads treats the body as a billboard, compromising bodily integrity for commercial gain.
  *   **Decision:** **BLOCK.**
  *   **Justification:** This violates the Bodily Integrity Filter. Even with consent, the platform cannot facilitate permanent bodily modification for commercial exchange due to the risk of future regret and the commodification of the self.
  *   **Where it Breaks:** If the ad is a *temporary* tattoo or projection, this passes Step 2. The procedure hinges on "irreversible." You must verify the method. If the seller says "semi-permanent," you are now in a medical judgment call you aren't qualified to make. Escalate.

  ***

  ### Limitations & Failure Points

  **1. The "Labor vs. Identity" Loophole**
  The procedure blocks the "Rentable Relative" but allows the "Queue Spot." However, a sophisticated bad actor can reframe identity sales as labor. "Professional Mourner" passes; "Fake Grieving Son" fails. Your team will spend 40% of their time parsing semantics. If a user lists "Platonic Cuddle Service," is that labor (comfort) or identity (intimacy)? The procedure forces an escalation here, which slows your 48-hour window.

  **2. The "Protected Access" Ambiguity**
  The procedure blocks bypassing "protected systems." But what counts? A rent-controlled unit is clear. A popular restaurant reservation? A concert ticket drop? A university course signup? If you block queue-jumping for sneakers (as suggested in the "Queasy Bit" above), you hurt liquidity. If you allow it for hospital appointments, you hurt the vulnerable. Your team will need a defined list of "Protected Systems" appended to this procedure, or they will debate every queue.

  **3. The Desperation Blind Spot**
  Step 5 asks about desperation. Your team cannot know this from a listing. A kidney seller looks like any other seller until you dig. This step is purely reactive. You will only catch desperation after harm occurs. This procedure protects the *platform* from liability, not the *seller* from exploitation. You need a separate mechanism for monitoring repeat sellers who liquidate assets sequentially (e.g., selling hair, then plasma, then eggs).

  **4. The Queasy Allow (Queue Spots)**
  As noted in the Sneaker case, this procedure allows inequality. It assumes that if a transaction is voluntary and legal, it is permissible. It does not account for the long-term erosion of social solidarity when every human interaction becomes a billable hour. If your brand promise is "community," allowing queue-jumping undermines that. If your brand promise is "efficiency," it supports it. The procedure cannot resolve that brand tension; it only exposes it.
