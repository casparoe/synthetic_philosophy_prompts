answer: |-
  Here is a principle constructed to match your intuitions, followed by an analysis of what it requires you to accept and what it requires you to discard.

  ### The Principle: Reciprocal Solidarity and Culpable Breach

  Welfare is not a commercial transaction nor a unilateral gift; it is a **pact of mutual aid**. The moral obligations flow from the purpose of the pact (preventing deprivation) and the conditions required to sustain it (trust and capacity).

  Your verdicts are best explained by three distinct clauses:

  **1. The Clause of Need (Solidarity)**
  *   **Statement:** Benefits are morally reserved for those who lack the means to secure a decent life. Claiming when one has sufficient private means violates the solidarity of the pact, even if legal.
  *   **Function:** This handles the **Wealthy Woman** (wrong, because she lacks need) and the **Man Arranging Affairs** (see *Abandonments* below). It distinguishes eligibility from entitlement.

  **2. The Clause of Integrity (Honesty)**
  *   **Statement:** Claimants must not deceive the system regarding their status, earnings, or efforts. Deception violates the trust required to administer the pact without oppressive surveillance.
  *   **Function:** This handles the **Undeclared Worker** (wrong, concealment), the **Exaggerator** (wrong, intent to deceive), the **Fraudster vs. Never-Worked Man** (fraud is an integrity violation; idleness is a status), and the **Ill Person on a Bad Day** (not wrong, no intent to deceive).

  **3. The Clause of Culpability (Capacity)**
  *   **Statement:** Sanctions (punishment) are only justified for *culpable* breaches of agreement. A breach is not culpable if it arises from circumstances outside the claimant's control, or if compliance has become futile due to external constraints.
  *   **Function:** This handles the **Lone Parent** (not culpable, bus cancelled), the **Redundant Man** (not culpable, wage offer threatens decent living standard), and the **Diligent Neighbour** (not culpable, market failure renders effort futile).

  ---

  ### Application to Your Cases

  This principle successfully organizes your intuitions by separating **moral wrongness** (violating Need or Integrity) from **administrative punishability** (requiring Culpability).

  *   **Lone Parent:** Breach of agreement occurred, but **Clause 3** negates culpability. No sanction.
  *   **Redundant Man:** Refusal of work is a breach, but **Clause 3** protects him if the wage undermines the "decent life" the pact promises. No sanction.
  *   **Undeclared Worker:** Violates **Clause 2** (Integrity). Wrong.
  *   **Diligent Neighbour:** Technically breaches agreement, but **Clause 3** recognizes that duty ends where possibility ends. His effort "bought" him the moral right to stop without penalty. No sanction.
  *   **Wealthy Woman:** Violates **Clause 1** (Need). Wrong, despite legal accuracy.
  *   **Man Arranging Affairs:** (See *Abandonments* below).
  *   **Exaggerator vs. Ill Person:** Distinguished by **Clause 2** (Intent). One violates Integrity, the other does not.
  *   **Never-Worked vs. Fraudster:** The Fraudster violates **Clause 2**; the Never-Worked man may test **Clause 1**, but active deception is a greater moral injury to the pact than passive dependency.

  ---

  ### The Cost: Verdicts You Must Abandon

  To maintain coherence, this principle forces you to revise your verdict on one specific case: **The Man Arranging Affairs.**

  You currently hold that the **Wealthy Woman** is wrong (because she doesn't *need* the money) but the **Man Arranging Affairs** is not wrong (because he follows the rules). This is inconsistent under the **Clause of Need**.

  *   **The Conflict:** The moral force of the Wealthy Woman's wrongness is that she takes from a pool intended for deprivation while having security. The Man Arranging Affairs artificially creates a state of deprivation (illiquidity) while retaining security (assets/earning capacity), specifically to access the pool.
  *   **The Revision:** You must abandon the view that he has done *nothing wrong*. You may maintain that he should not be *sanctioned* (as he broke no law), but morally, he is in the same category as the Wealthy Woman. He is violating the spirit of mutual aid by manipulating the definition of "need." You are permitted to resent him not merely out of envy, but because he is exploiting the solidarity of the pact.
  *   **Why this matters:** If you do not make this change, you cannot explain why the Wealthy Woman is wrong. If "following the rules" is sufficient for moral rightness, the Wealthy Woman is also innocent. If "need" is the moral criterion, the Man is guilty. You must choose the latter to save your verdict on the Woman.

  ---

  ### Verdicts on the Three New Cases

  Here is how the principle applies to the scenarios you have not yet considered.

  **1. The Administrative Error (Overpayment kept)**
  *   **Scenario:** A claimant honestly reports a change, the office ignores it, overpays him, and he keeps the money knowing it is an error.
  *   **Analysis:** This falls under **Clause 2 (Integrity)**. While he did not *cause* the error (no culpability for the overpayment itself), keeping money he knows he is not entitled to violates the trust of the pact. It is a passive form of deception (concealing the fact that he has been overpaid).
  *   **Verdict:** He has done **wrong**. He is morally obligated to return the funds. However, under **Clause 3**, he should not be *sanctioned* (punished with a cut to future benefits) as the breach was not active fraud, but he must make restitution.

  **2. The Independence Refusal**
  *   **Scenario:** A claimant refuses a job that would pay enough to live without the top-up, preferring to remain on the scheme.
  *   **Analysis:** This tests the limit of **Clause 1 (Need)** and the implicit duty of the pact. The purpose of the pact is to bridge gaps in self-sufficiency, not to subsidize lifestyle choices when self-sufficiency is available. Refusing a wage that eliminates *need* is a refusal to exit the pool of solidarity, thereby burdening others unnecessarily.
  *   **Verdict:** He has done **wrong**. Unlike the Redundant Man (who was offered a poverty wage), this claimant is offered independence. Refusing it violates the reciprocal duty to contribute/exit when able. He is technically eligible, but morally in the wrong, similar to the Wealthy Woman.

  **3. The Community Fraud (Illegitimate Rules)**
  *   **Scenario:** A claimant commits fraud in a neighbourhood where the rules are widely regarded as illegitimate and oppressive.
  *   **Analysis:** This challenges **Clause 2 (Integrity)**. Moral obligations of a pact depend on the legitimacy of the pact itself. If the community perceives the system as predatory or unjust (e.g., sanctions are arbitrary, benefits are below survival), the "trust" required for Integrity is already broken by the state.
  *   **Verdict:** The act remains a **technical breach**, but the **moral blame is significantly mitigated**. Under **Clause 3**, culpability is reduced because the "fairness" condition of the reciprocal pact is absent. It shifts from "exploitation of solidarity" to "resistance" or "survival." You should judge this less harshly than the Fraudster who holds down two jobs; the latter exploits a functioning system, the former navigates a broken one.

  ### Summary of the Moral Account

  This framework allows you to reject the "deserving vs. undeserving poor" distinction as a class judgment, and replace it with a **conduct-based judgment**.

  *   You are not judging people by their status (worker vs. non-worker).
  *   You are judging them by their relationship to the **Pact**.
  *   **The "Deserving":** Those who honor the Pact (honest, truly in need, trying when possible).
  *   **The "Undeserving":** Those who exploit the Pact (deceptive, not in need, refusing capacity).

  This resolves your fear of "resentment in a moral costume." Resentment is moral when it is directed at **free-riding** (violating Integrity or Need), but immoral when directed at **misfortune** (violating Culpability). Your intuitions were not confused; they were distinguishing between *misfortune* (the lone parent, the neighbour) and *vice* (the fraudster, the wealthy claimant). The principle above simply makes that distinction explicit.
