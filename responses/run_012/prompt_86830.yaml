answer: |-
  # JOINT STATEMENT ON INTERPERSONAL UTILITY COMPARISONS
  **Adversarial Collaboration Rapporteur Report**
  **Date:** October 24, 2023
  **Parties:** Camp O (Ordinalist/No-Fact) and Camp C (Comparabilist)

  ## PREAMBLE
  This document records the outcomes of a one-year adversarial collaboration between Camp O and Camp C. The purpose of this collaboration was not to force a consensus where none exists, but to isolate the precise locus of disagreement, identify points of genuine verbal dispute, and establish a shared framework for testing residual substantive claims. Both camps acknowledge that the debate over interpersonal utility comparisons (IUC) has historically suffered from equivocation regarding the definition of "utility," the nature of "measurement," and the role of "facts" in normative theory. The following statement codifies our shared understanding and delineates our remaining differences with precision.

  ---

  ## PART I: AGREED CLAIMS

  1.  **Nature of Utility Representations:** Both camps agree that an individual's utility function is a mathematical representation of their evaluative stance toward outcomes. Both camps agree that within a single individual, utility differences can represent the intensity of preference or welfare, provided the representation satisfies consistency axioms (e.g., transitivity, continuity).
  2.  **Measurement and Invariance:** Both camps agree that meaningful measurement requires specifying the class of admissible transformations. *Ordinal* measurability allows any monotonic increasing transformation. *Cardinal* measurability allows only positive affine transformations (change of origin and unit). Both camps agree that without further constraints, standard preference data support only ordinal measurability.
  3.  **Types of Comparability:** Both camps distinguish between:
      *   *Level Comparability:* Judging whether Person A's utility is higher than Person B's.
      *   *Unit Comparability:* Judging whether Person A's gain is larger than Person B's gain.
      *   *Narrow Comparability:* Comparisons restricted to a specific dimension (e.g., physical pain intensity).
      *   *Wide Comparability:* All-things-considered comparisons of overall welfare or life quality.
      Both camps agree that Narrow Comparability is epistemically more accessible than Wide Comparability.
  4.  **Limits of Social Choice:** Both camps agree that if utility is strictly ordinal and non-comparable across persons, social welfare functions satisfying Unrestricted Domain, Pareto Efficiency, and Independence of Irrelevant Alternatives must be dictatorial (Arrow's Impossibility Theorem). To escape this without a dictator, one must either restrict the domain of preferences or admit some form of interpersonal comparability or non-preference information.
  5.  **Concession by Camp O:** Camp O concedes that in extreme cases (e.g., torture vs. mild inconvenience), the refusal to make interpersonal comparisons leads to verdicts that conflict with deep moral intuitions. Camp O acknowledges that ordinalism requires independent principles of justice (e.g., priority to the worst off defined by resources or rights) to handle distributive questions, and that these principles often mimic the output of IUCs.
  6.  **Concession by Camp C:** Camp C concedes that self-reported utility is subject to strategic manipulation, adaptation (hedonic treadmill), and framing effects. Camp C acknowledges that IUCs cannot be the sole input for policy without safeguards against preference falsification and without accounting for individual sovereignty.
  7.  **Status of the Common Ladder Protocol (CLP):** Both camps agree that the CLP is a valid object of inquiry. Neither camp treats the protocol as obviously irrelevant (mere noise) nor obviously decisive (a magic meter). Both agree that the protocol's output depends on both the underlying phenomenology and the social/linguistic coordination of the participants.

  ---

  ## PART II: DISAGREEMENTS TABLE

  | Crux | Camp O Position (Ordinalist/No-Fact) | Camp C Position (Comparabilist) | Type of Disagreement |
  | :--- | :--- | :--- | :--- |
  | **1. Ontology of IUC** | Statements comparing Person A's utility to Person B's lack truth conditions. They are expressions of ethical convention or policy rules, not descriptions of a pre-existing fact. | Statements comparing Person A's utility to Person B's are truth-apt. They describe facts about conscious experience or welfare that exist independently of our measurement conventions. | **Conceptual/Metaphysical** (Nature of "fact") |
  | **2. Interpretation of CLP Convergence** | If participants converge on CLP numbers, this demonstrates successful social coordination and shared linguistic norms, not the measurement of a common internal magnitude. | If participants converge on CLP numbers, this indicates access to a common phenomenological scale. Convergence is evidence of a shared underlying reality. | **Factual/Explanatory** (Best explanation of data) |
  | **3. Normative Authority** | Even if CLP yields stable numbers, policy should prioritize revealed preference (choice) over reported experience to respect agency. Experience numbers are advisory at best. | If CLP yields stable numbers, they reveal welfare facts that should constrain or override revealed preference when choices are adaptive or ill-informed. | **Normative** (Source of authority) |
  | **4. Verbal Dispute on "Utility"** | "Utility" refers strictly to a formal index representing preference ordering. To speak of "measuring" it interpersonally is a category error. | "Utility" refers to welfare or well-being, of which preference is only one indicator. Measuring it interpersonally is the primary goal. | **Verbal** (Definition of terms) |

  ---

  ## PART III: EVIDENCE, PREDICTIONS, AND IMPLICATIONS

  For each substantive crux identified above, we specify a concrete test case involving the Common Ladder Protocol (CLP). We define what constitutes a failure of the protocol and record each camp's advance prediction.

  ### Crux 1: Ontology of IUC (Fact vs. Convention)
  **The Test:** *The Framing Stability Trial.*
  Participants undergo the CLP training. They are then divided into two groups. Group 1 is told the ladder measures "Physical Sensation Intensity." Group 2 is told the ladder measures "Ethical Urgency for Relief." Both groups place the same set of partner experiences (e.g., a partner's migraine) on the 0-100 scale.
  *   **Protocol Failure Condition:** If the variance within groups is as high as the variance between groups, the protocol fails to establish a common scale. Both camps agree this would weaken Camp C's claim significantly.
  *   **Camp O Prediction:** The mean placements will differ significantly between Group 1 and Group 2. Participants are not measuring a fixed fact; they are responding to the normative framing of the task. Convergence is local to the framing convention.
  *   **Camp C Prediction:** The mean placements will be statistically indistinguishable. Participants recognize the underlying experience (migraine) regardless of the label applied to the scale. Variance will be low within groups, indicating access to a stable fact.
  *   **Implication of Success:** If Camp C's prediction holds (high stability across frames), Camp O agrees this shows the protocol is *robust*, but maintains this proves only that ethical conventions are stable, not that they are factual. Camp C maintains this proves the existence of mind-independent comparability. **Verdict:** This test isolates the disagreement as primarily **Conceptual**. Even with identical data, the camps disagree on whether "stable convention" equals "fact."

  ### Crux 2: Normative Authority (Experience vs. Choice)
  **The Test:** *The Adaptive Preference Scenario.*
  Using the CLP, a participant (Subject A) reports their current welfare level while enduring a voluntary but painful hardship (e.g., intense athletic training or caring for a sick relative). Subject A places their own experience at 40/100 (significant pain). However, when offered a choice to stop the activity for a cash sum, Subject A consistently chooses to continue the activity (Revealed Preference: Continue > Stop). A policy analyst must decide whether to subsidize Subject A's continuation based on CLP data (low welfare) or Choice data (high priority).
  *   **Protocol Failure Condition:** If Subject A refuses to place their own experience on the ladder, claiming it is "incomparable" to the training examples, the protocol fails to capture wide comparability.
  *   **Camp O Prediction:** Subject A will report low welfare on the ladder but still choose to continue. Camp O argues policy should respect the Choice. The CLP number reflects a "feeling" that the agent has rationally decided to trade off for other values. Using CLP to override Choice is paternalistic.
  *   **Camp C Prediction:** Subject A will report low welfare, and this report should trigger policy support (e.g., compensation) even if they choose to continue. Camp C argues the CLP reveals a welfare deficit that the agent is enduring for the sake of others or future gain. Ignoring the CLP number ignores the cost being borne.
  *   **Implication of Success:** If the CLP successfully elicits a number in conflict with choice, it does not settle the normative dispute. It merely clarifies the trade-off. Camp O sees the CLP number as *information about cost*; Camp C sees it as *information about justice*. **Verdict:** This disagreement is **Normative**. The protocol successfully generates the conflict, but cannot resolve which input (experience or choice) is sovereign.

  ### Crux 3: Interpretation of CLP Convergence (Measurement vs. Coordination)
  **The Test:** *The Blind Revision Round.*
  In the CLP, Participant A places Participant B's pain at 60. Participant B places their own pain at 80. They are allowed one revision round.
  *   **Protocol Failure Condition:** If revisions always move toward the midpoint (50) regardless of the initial gap, the protocol measures conformity, not accuracy.
  *   **Camp O Prediction:** Revisions will show strong convergence toward the partner's number, driven by social pressure to agree. This demonstrates that the numbers are tools for social coordination, not measurements of private states.
  *   **Camp C Prediction:** Revisions will be asymmetric. If the gap is large, the observer (A) will move more than the experiencer (B). This demonstrates that the experiencer has privileged access to the fact, and the observer is correcting an measurement error.
  *   **Implication of Success:** If Camp C's prediction holds (asymmetric revision privileging the experiencer), Camp O concedes the protocol captures *privileged access*, but denies this scales to *interpersonal* comparison. Camp C argues privileged access + convergence = interpersonal fact. **Verdict:** This is a **Factual/Explanatory** dispute regarding the mechanism of agreement.

  ## CONCLUDING REMARKS ON THE COMMON LADDER PROTOCOL

  Both camps agree that the Common Ladder Protocol, if implemented, will generate data. However, we explicitly record that **successful operation of the protocol does not settle the core metaphysical disagreement.**

  *   **For Camp O:** A successful CLP is a successful *construction* of a shared normative language. It is useful for policy coordination but does not validate the claim that "Person A is happier than Person B" is true in the same way "Person A is taller than Person B" is true.
  *   **For Camp C:** A successful CLP is a successful *discovery* of a shared phenomenological scale. It validates the claim that IUCs are truth-apt, even if measurement error exists.

  We agree that the value of this collaboration lies not in the elimination of this final divergence, but in the precise localization of it. Future research should focus on the **Framing Stability Trial** (Crux 1) to determine if IUCs behave like measurements of physical facts or like negotiations of social norms.

  **Signed,**

  *Lead Representative, Camp O*
  *Lead Representative, Camp C*
  *Rapporteur*
