      Subject: Thoughts on divine hiddenness

      Hi there,

      It is great that you are digging into this because you have actually hit on some of the central tensions philosophers wrestle with, and you are right to notice the family resemblance between divine hiddenness and the problem of evil. They are siblings in the sense that both argue from the nature of God to the state of the world, but they are not identical twins. The problem of evil focuses on suffering and harm, asking why a good God allows pain, whereas the divine hiddenness argument focuses on relationship and knowledge, asking why a loving God would remain obscure to those open to knowing Him. The core claim, most famously articulated by J.L. Schellenberg, is not just that God is hidden, but that there are people who are non-resistantly non-believing, meaning they are open to a relationship with God but lack the belief necessary to enter it. If God is perfectly loving, He would want a personal relationship with every person, and such a relationship logically requires that the person believes God exists. So when you find sincere seekers who cannot find Him, the argument suggests this is evidence against a loving God.

      Your intuition about the free will defense is a very common first response, but it runs into a few hurdles that make it harder to apply here than it is with the problem of evil. In the problem of evil, free will explains moral evil by saying God values our freedom to choose good over forced obedience. But with hiddenness, the issue is not about forcing obedience or love, but about establishing existence. Most philosophers argue that belief is not directly voluntary, meaning you cannot simply choose to believe something is true any more than you can choose to believe the sky is green while looking at a blue sky. If God made His existence as obvious as the sun, we would all believe, but that would not necessarily coerce our love or submission. Think of it like a parent hiding from a child so the child can freely choose to believe the parent exists. That does not seem like an act of love, because the child cannot relate to a parent they think is imaginary. So the free will defense does not fully close the case because knowing God exists does not remove the freedom to reject His will, it only removes the freedom to deny His existence.

      Now regarding your twist about selective revelation, where God reveals Himself only to those who would freely choose Him anyway, this actually tends to make things worse for the theist rather than fixing them. If God only appears to those predisposed to believe, it implies that God is respecting human freedom by not overriding the will of those who would reject Him, but it leaves the non-resistant non-believers in the dark through no fault of their own. If someone grows up in a place or time where God never reveals Himself, and that person would have loved God if they had known Him, then God's selective hiddenness has permanently prevented a relationship that could have happened. This clashes with the idea of a perfectly loving God who desires relationship with everyone, not just the ones He foreknows will say yes. It also raises troubling questions about fairness and grace, suggesting that access to God is determined by arbitrary divine secrecy rather than human responsiveness. It turns God into someone who only knocks on doors He knows will be opened, leaving everyone else without even the chance to hear the knock.

      So you have not mangled the original argument at all, you have actually identified the exact pressure points that keep philosophers up at night. The divine hiddenness argument is distinct from the problem of evil because it targets the conditions for relationship rather than the existence of suffering, and the free will defense does not work as neatly because belief is not a simple choice. Your selective revelation idea is creative, but it ultimately highlights the unfairness of hiddenness rather than solving it, because it suggests God withholds evidence from people who would have used it to find Him. The argument remains powerful because it suggests that if God were like a perfect human lover, He would make Himself available to all who are open to Him, and the fact that many sincere seekers remain in the dark is what drives the doubt. I hope this helps clarify the landscape a bit for you without needing to dive into a stack of books.

      Best wishes

