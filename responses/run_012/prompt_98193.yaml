prompt: |-
  I've been trying to wrap my head around the divine hiddenness stuff and I think I'm missing something. The way it got explained to me, the argument is basically: a good God would make his existence obvious to everyone, but tons of people sincerely don't believe, so God probably doesn't exist. That sounds alot like the problem of evil to me — isn't it just that same argument wearing a different hat, and doesn't the free will defense take care of it the same way? If God showed himself plainly we'd lose the free choice to believe, so he keeps himself hidden, case closed. But then I started wondering about a twist: what if God does reveal himself to some people, just not everyone, and the ones he reveals himself to are exactly the ones who would have freely chosen him anyway? That way nobody's freedom gets steamrolled and the non-believers — including the ones who grew up somewhere the idea never even came up — still get their space. Does that fix the hiddenness argument, or does it actually make things worse for the theist? And am I even right about what the original argument claims, or have I mangled it? Please just explain it to me in plain prose — no headings, no bullet points, no bold, no tables — write it like you'd write an email. And no reading list please, I just want the reasoning.
