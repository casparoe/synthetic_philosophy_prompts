      **Title:** The Protocol Game: Deciding Death
      **Set-up:** Divide students into four sub-committees (4 students each). Provide each with a 'Policy Draft' sheet and three 'Case Cards'.
      **Materials:** Whiteboard, timer, handouts.
      **Handout 1 (The Constraint):** 'The Dead Donor Rule': Procurement may only begin after death. 'Organ Viability': Kidneys tolerate 30 mins warm ischaemia; hearts/livers tolerate 5 mins.
      **Handout 2 (The Biology):** 'Auto-resuscitation Data': Spontaneous circulation returns in 1% of cases after 2 mins standstill; 0% after 5 mins.
      **The Task:** Agree on a 'standstill time' (in minutes) before death declaration. Then apply it to the cases.

      **Timeline:**
      1.  **Briefing (10 mins):** Explain roles. You are the Ethics Committee. You must write the protocol. You cannot change the Dead Donor Rule or the Biology.
      2.  **Phase 1: The Number (20 mins):** Groups decide the standstill time. They must sign the policy.
      3.  **Phase 2: The Cases (30 mins):** Distribute Case Cards.
          *   *Case 1:* Potential heart donor. Viability window closes at 6 mins post-extubation.
          *   *Case 2:* Potential kidney donor. Viability window closes at 35 mins.
          *   *Case 3:* Family insists on waiting 10 mins to be 'sure'.
          *   Groups apply their number. If their number > viability window, organs spoil. If < biological safety (2 mins), risk auto-resuscitation.
      4.  **Phase 3: The Conflict (10 mins):** Bring groups together. Compare numbers. Reveal that Heart viability (5 mins) clashes with Biological Safety (5 mins). If they chose 5 mins for safety, hearts are lost. If they chose 3 mins for hearts, risk exists.
      5.  **Debrief (20 mins):** (See below).

      **Predictable Pitfalls:**
      *   *Pitfall:* Students seek a 'correct' medical answer.
      *   *Recovery:* Remind them the biology gives a range (2-5 mins), not a point. The choice within the range is theirs.
      *   *Pitfall:* Ignoring organ viability.
      *   *Recovery:* Act as the 'Surgeon' reminding them organs are spoiling every minute.

      **Debrief:**
      Map the activity to the theory.
      1.  **The Number:** When they picked '5 minutes', they didn't discover it; they negotiated it. This is the decision, not the fact.
      2.  **Permanence vs. Irreversibility:** The biology handout showed auto-resuscitation is unlikely after 5 mins (permanence), not impossible forever (irreversibility). You chose permanence.
      3.  **The Dead Donor Rule:** To save organs, you might have tempted to shorten the time. This shows the rule is preserved verbally but violated functionally if the time is too short.
      4.  **Limitations:** This is cold logic. It lacks the grief of the family, the sweat of the surgeon, and the legal fear. You must supply the emotional weight of 'killing' vs 'letting die'.

