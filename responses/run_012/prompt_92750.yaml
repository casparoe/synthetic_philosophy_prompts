      *Let's refine the "Kasb" follow-up.* The likely answer is that it's a moral relation, not causal. The follow-up needs to ask what "moral relation" means without causal grounding.

      *Final check on tone:* "Formidably good at deflecting." The questions need to be tight. No "What do you think about..." but rather "Doesn't this imply..."

