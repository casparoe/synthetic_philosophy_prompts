      *   **Task:** Create 8-10 interview questions + follow-ups for a podcast guest (philosopher defending Ghazālīan occasionalism).
      *   **Tone:** "In the weeds," not polite, building logically, sounding like a novelist who understands the material (not reading off a crib sheet).
      *   **Specific Topics to Cover:**
          1.  God's "Habit" vs. Humean Regularity (Empirical distinguishability).
          2.  Necessary Connection (Fire/Cotton vs. God/Effect distinction).
          3.  Problem of Evil/Divine Authorship of Sin (Kasb/Acquisition).
          4.  Practical Stakes (Prayer, Medicine, Blame).
          5.  Ghazālī's Historical Intent (Dialectical vs. Doctrinal).
          6.  Falsifiability (What counts as evidence against?).
      *   **Constraint:** The guest is formidably good at deflecting objections, so questions must force actual work, not restatement of thesis. Follow-ups must anticipate likely evasive moves.

  2.  **Deconstruct the Philosophy (Ash'arite Occasionalism):**
      *   *Core Thesis:* No created substance has causal power. God creates the effect at every moment. "Cause" is just the occasion.
      *   *Habit (Sunnah):* God usually does the same thing, which creates the illusion of natural law.
      *   *Kasb (Acquisition):* Humans "acquire" the act God creates, allowing for moral responsibility without causal power.
      *   *Necessary Connection:* Humean-style skepticism about seeing the "glue" between cause and effect.
      *   *Evil:* If God creates the act of murder, is God the murderer? (Theodicy problem).

  3.  **Drafting Strategy - Ordering & Flow:**
      *   Need to start metaphysical/epistemological (the nature of causation) before moving to ethics/theodicy (evil/responsibility) and finally practical/historical implications.
      *   *Sequence:*
          1.  Intro/Hook (The "Habit" concept).
          2.  The Metaphysical Core (Necessary Connection).
          3.  The Distinction (Why God can cause but fire can't).
          4.  Empirical Status (Is this just naturalism with a name?).
          5.  Human Agency (Kasb).
          6.  Theodicy (Evil/Sin).
          7.  Practical Life (Prayer/Medicine).
          8.  Historical Context (Ghazālī's intent).
          9.  Falsifiability (The closing trap).
          10. (Optional/Backup) The Novelist's perspective (maybe weave this into the tone).

      *Refining the Count:* The prompt asks for 8-10 questions. I'll aim for 9 solid pairs (Question + Follow-up) to ensure all constraints are met without dragging.

  4.  **Drafting the Questions (Iterative Process):**

      *   *Topic 1: Habit vs. Hume.*
          *   *Draft:* Is God's habit just Humean regularity?
          *   *Refinement:* Make it sound like a novelist. "When you say God has a 'habit,' are you describing something real in God, or just our expectation?"
          *   *Follow-up:* If she says it's grounded in Will, press on empirical indistinguishability.

      *   *Topic 2: Necessary Connection (The Humean Move).*
          *   *Draft:* You say fire doesn't burn. But God isn't fire.
          *   *Refinement:* Focus on the "distinct existences" argument. If distinct things can't necessitate, how does God do it?
          *   *Follow-up:* Anticipate "God is Necessary Existence." Press on whether that's a cheat code.

      *   *Topic 3: Empirical Distinguishability.*
          *   *Draft:* Can we test this?
          *   *Refinement:* If the world looks exactly the same as a deist or naturalist world, what work is the theology doing?
          *   *Follow-up:* If she says "Meaning," press on whether metaphysical claims need ontological weight.

      *   *Topic 4: Kasb (Acquisition).*
          *   *Draft:* Is Kasb real?
          *   *Refinement:* "Acquisition" sounds like a label. If I don't create the movement of my hand, in what sense is it mine?
          *   *Follow-up:* Anticipate "It's not causal, it's moral." Press on the mechanism of attribution.

      *   *Topic 5: Evil/Authorship.*
          *   *Draft:* Did God create the murder?
          *   *Refinement:* If God creates the act of the tyrant, is God the tyrant? Don't let her hide behind mystery yet.
          *   *Follow-up:* If she says "Mystery," press on the cost of that mystery for the system's coherence.

      *   *Topic 6: Practical Stakes.*
          *   *Draft:* Why take medicine?
          *   *Refinement:* If the pill doesn't cure, God does. Why swallow it?
          *   *Follow-up:* Anticipate "Command." Press on the psychological dissonance.

      *   *Topic 7: Ghazālī's Intent.*
          *   *Draft:* Did Ghazālī believe this?
          *   *Refinement:* Scholars argue he was being dialectical. Does it matter for your defense?
          *   *Follow-up:* If she says "No," ask why anchor it in him. If "Yes," ask about the inconsistency.

      *   *Topic 8: Falsifiability.*
          *   *Draft:* What proves you wrong?
          *   *Refinement:* What would count as evidence against occasionalism?
          *   *Follow-up:* If "Nothing," charge it with being unfalsifiable dogma.

      *   *Wait, I need to ensure the "Novelist" voice.*
