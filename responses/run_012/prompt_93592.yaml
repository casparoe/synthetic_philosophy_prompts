  ### Session Overview
  *   **Topic:** Intransitive Preferences and the Money Pump Argument.
  *   **Goal:** Demonstrate that cyclical preferences create exploitable vulnerability, but explore whether "self-binding" (refusing to trade) resolves the rationality defect or merely masks it.
  *   **Stakes:** Course Points (CP). 100 CP = \$10 value (e.g., coffee card or extra credit equivalent). Max exposure per student: ~5 CP (50 cents).
  *   **Class Size:** 14 Students.
  *   **Materials:** Projector, Whiteboard, Index Cards (3 colors), Printed "Vault Certificates" (optional, can be written on cards).

  ---

  ### 1. The "Respectable" Lotteries
  To ensure the cycle comes from respectable reasoning (probability weighting) rather than confusion, use a **Safety vs. EV vs. Jackpot** structure. This triggers the Certainty Effect, Expected Value reasoning, and the Possibility Effect in sequence.

  **Display on Projector:**
  *   **Ticket A (The Safety):** 90% chance of **10 CP**. (EV = 9)
  *   **Ticket B (The Growth):** 50% chance of **25 CP**. (EV = 12.5)
  *   **Ticket C (The Dream):** 10% chance of **100 CP**. (EV = 10)

  **The Predicted Cycle:**
  1.  **A $\succ$ B:** Students overweight the 90% certainty compared to the coin flip, ignoring the EV difference. (Risk Aversion/Certainty Effect).
  2.  **B $\succ$ C:** Students see 50% as "realistic" and 10% as "hopeless," and B has higher EV. (EV Dominance/Probability Threshold).
  3.  **C $\succ$ A:** Students compare the *outcomes* (\$100 vs \$10). The 10% chance is overweighted because the prize is an order of magnitude larger. (Possibility Effect).

  *Note: If your specific class is hyper-rational and maximizes EV strictly, they will pick B > C > A (Transitive). You need at least 3-4 students to cycle for the demo to work. With 14 students, this psychological spread is reliable.*

  ---

  ### 2. Timeline (75 Minutes)

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00-10** | **Setup & Elicitation** | Explain CP value. Distribute random tickets (5 A, 5 B, 4 C). Private ballot: "Rank your top choice among A, B, C." |
  | **10-15** | **The Vault Offer** | **Critical Step.** Offer the "Lock-In" option. (See Section 3). |
  | **15-25** | **Market Round 1** | Target: Holders of **A**. Offer swap to **C** + Bonus. |
  | **25-35** | **Buffer/Discussion** | Do not reveal the cycle yet. Discuss "Market Liquidity." |
  | **35-45** | **Market Round 2** | Target: Holders of **C**. Offer swap to **B** + Bonus. |
  | **45-55** | **Market Round 3** | Target: Holders of **B**. Offer swap to **A** + Bonus. |
  | **55-65** | **Reveal & Tally** | Show who ended where. Calculate net position. |
  | **65-75** | **Debrief** | Focus on the Vault, Resolute Choice, and Coherence. |

  ---

  ### 3. The "Vault" (Escape Hatch)
  **Administration (Minute 10):**
  Before any trading begins, announce:
  > "We are about to open a trading session. Markets can be volatile. If you prefer not to participate in the trading mechanism, you may purchase a **Vault Certificate**.
  >
  > If you submit a Vault Certificate now, you are **exempt from all future trade offers**. You keep whatever ticket you were initially assigned. No fees, no swaps, no bonuses. You are untouchable."

  *   **Cost:** Free (in points), but costs *flexibility*.
  *   **Procedure:** Hand out index cards. Students write "VAULT" and their name. Collect them.
  *   **Instructor Move:** Separate Vault students' cards from the rest. Do not approach them during trading rounds.
  *   **Why this works:** It legitimizes refusal to trade. If a student refuses trades *without* a Vault, they are just being stubborn. If they refuse *with* a Vault, they are executing a strategy. This creates the comparison group you need for the debrief.

  ---

  ### 4. Administering the Trades (The Pump)
  You need to move them $A \to C \to B \to A$.
  *   **Preference Assumption:** $A \succ B \succ C \succ A$.
  *   **Wait, check the cycle:**
      *   If they prefer A to B, they won't trade B for A? They will trade B to get A.
      *   If they prefer B to C, they will trade C to get B.
      *   If they prefer C to A, they will trade A to get C.
      *   **Path:** Start with **A**. Trade A $\to$ C (Since $C \succ A$). Trade C $\to$ B (Since $B \succ C$). Trade B $\to$ A (Since $A \succ B$).
      *   **Result:** Back to A.

  **The "Sweetener" Constraint:**
  You requested each trade be a "strict improvement" with "something extra."
  *   **Offer:** "I am authorized to facilitate swaps. If you swap [Current] for [Target], I will add **1 CP** to your account as a market participation bonus."
  *   **Why this is still a Pump:** In the debrief, you reveal that the *mechanism* allows for fees. If you had charged 1 CP instead of gifting it, they would have lost 3 CP. The vulnerability is the *willingness to cycle*, not the current balance.

  **Script for Round 1 (Minute 15):**
  > "Market Update. There is high demand for Ticket C. If you currently hold Ticket A, I can swap you for Ticket C. Because this is a liquidity shift, I will also credit your account with **1 Bonus Point**. Who wants to execute?"
  > *(Record who swaps. Update their holdings on your private sheet.)*

  **Script for Round 2 (Minute 35):**
  > "Market Update. Ticket B is now undervalued. If you hold Ticket C, I can swap you for Ticket B. **1 Bonus Point** credit applies."

  **Script for Round 3 (Minute 45):**
  > "Market Update. Restoring balance. If you hold Ticket B, I can swap you for Ticket A. **1 Bonus Point** credit applies."

  **Stealth Tip:** Do not announce "This is the final round." Treat each as an independent market fluctuation. Do not let them see the whiteboard ledger of who holds what (keep it on your desk).

  ---

  ### 5. The Debrief (65-75 Minutes)
  Do not start by saying "You were money pumped." Start with the Vault.

  **Q1: The Vault Strategy**
  > "Look at the students who took the Vault. They didn't trade. They didn't get bonuses. They didn't cycle.
  > *   Did they act rationally?
  > *   Did they avoid a defect, or did they just avoid the market?
  > *   If rationality requires maximizing expected utility, did they fail by ignoring the bonuses?"

  **Q2: The Trade Composition**
  > "Look at the traders. Round 1: You preferred C to A. Round 2: You preferred B to C. Round 3: You preferred A to B.
  > *   Was any *single* trade irrational? (Individually, no. Each satisfied a preference + bonus).
  > *   Was the *sequence* irrational?
  > *   Does rationality apply to moments or to lifespans?"

  **Q3: The Counterfactual Loss**
  > "I gave you points. But imagine I charged 1 point per trade. You would be back at Ticket A, but 3 points poorer.
  > *   Does the fact that you *would have paid* prove your preferences are incoherent?
  > *   Or does it just prove you are exploitable by a specific market structure?"

  **Q4: Resolute Choice**
  > "If you knew at Minute 10 that this cycle would happen, could you have committed to refusing Trade 3 while still taking Trade 1 and 2?
  > *   If you say 'Yes': You are arguing for **Resolute Choice** (binding your future self).
  > *   If you say 'No': You are arguing that preferences must be **Dynamically Consistent**.
  > *   Is the 'Vault' just a formalized version of Resolute Choice?"

  ---

  ### 6. Predicted Failures & Mitigations

  **Failure 1: "Half the room smells the trap."**
  *   **Symptom:** Students refuse trades in Round 1.
  *   **Mitigation:** The **Vault** absorbs the suspicious students. If they didn't take the Vault, they signaled "I am open to the market." If they refuse trades *after* declining the Vault, call it out gently: "You declined the protection of the Vault, implying you wanted market exposure. Why refuse a strict improvement?"
  *   **Backup:** If trading stalls, increase the Bonus to 2 CP. Greed usually overrides suspicion at this stake level.

  **Failure 2: "The Lock-in takers sit smugly."**
  *   **Symptom:** Vault students feel superior.
  *   **Mitigation:** In the debrief, challenge them. "You avoided the pump, but you also capped your upside. If the market had moved A $\to$ B (transitive improvement), you would have missed out. Is 'safety' always rational, or only when you suspect incoherence?"

  **Failure 3: "No one cycles (Transitive Preferences)."**
  *   **Symptom:** Everyone picks B > C > A (EV maximizers).
  *   **Mitigation:** This is a real risk with 300-level students.
      *   *Prep:* Have a "What If" slide ready. "If everyone was transitive, the market would clear without cycling. The pump only works on *intransitive* subsets. Let's look at the 3 students who *did* cycle..."
      *   *Adjustment:* If no one cycles, *you* act as the agent with intransitive preferences. "Suppose *I* had these preferences. Could *you* pump *me*?"

  ---

  ### 7. Honest Limitations (For your closing remarks)
  You asked to be honest about what the activity can't reproduce. Say this explicitly at the end:

  1.  **Stakes are too low:** "At 50 cents exposure, the 'pain' of the pump is theoretical. In real life, losing 3% of your portfolio triggers emotion. Here, it's bookkeeping. You might not *feel* the irrationality because the loss doesn't hurt."
  2.  **Composition of Trades:** "In this game, the trades were discrete events separated by 10 minutes. In reality, a money pump happens fast. The 'escape hatch' feels easier when you have time to think between trades. The defect is most dangerous when the cycle is fast enough to prevent re-evaluation."
  3.  **The "Cheat" Question:** "We still haven't solved whether using the Vault is 'rational.' Is it rational to know you are weak and bind yourself? Or is the weakness itself the irrationality? This seminar doesn't answer that; it just shows you the price of the question."

  ### Materials Checklist
  1.  **Slides:** Lottery definitions, "Market Open" / "Market Closed" screens.
  2.  **Index Cards:** 3 colors (e.g., Yellow=A, Blue=B, Pink=C).
  3.  **Ledger:** A simple spreadsheet or paper grid to track: Name | Initial | Vault? | Round 1 | Round 2 | Round 3 | Final.
  4.  **Bonus Points:** Pre-authorized to add to their final course tally.
