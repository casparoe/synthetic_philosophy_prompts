answer: |-
  ### Professor's Brainstorm: What Does a Perfect Answer Look Like?

  Before I touch your partner's paper, here is the checklist I use in my head when I grade this specific problem. A perfect response needs to hit four distinct targets. It is very easy to get the right number but miss the statistical concept.

  1.  **Accurate Pooling (Arithmetic):** The student must correctly sum the numerators (passes) and denominators (total students) across the subgroups. A common sneaky error is averaging the percentages (e.g., averaging 95% and 60%) instead of weighting by the group size.
  2.  **Identification & Definition (Phenomenon):** They must name "Simpson's Paradox." But naming it isn't enough; they must define it as a reversal of trends when data is aggregated vs. disaggregated.
  3.  **Causal Mechanism (The "Why"):** This is where most students lose points. They need to explain *why* the reversal happened. It's not just "the groups are different sizes." It's that the grouping variable (Pre-algebra) is a **confounder**: it influences the outcome (pass rate) *and* is unevenly distributed across the treatment groups (StudySprint vs. Standard).
  4.  **Actionable Conclusion (Decision):** They must recommend the method that wins *within the groups* (StudySprint), not the aggregate. Crucially, they should avoid making universal rules that don't hold up (e.g., "always trust within-group") because that depends on whether the variable is a confounder or a mediator.

  **Potential Pitfalls:**
  *   **The "Average of Averages" Trap:** Calculating $(95\% + 60\%) / 2$ instead of $79/120$.
  *   **The "Bad Luck" Explanation:** Saying the reversal is just random chance rather than structural bias.
  *   **The "Always Stratify" Trap:** Claiming you should *always* trust within-group numbers, even when the grouping variable is caused by the treatment (post-treatment bias).

  ---

  ### Grading Breakdown (10 Points Total)

  Here is the score based on the rubric you provided.

  | Rubric Category | Score | Notes |
  | :--- | :--- | :--- |
  | **(1) The Arithmetic** | **2.5 / 2.5** | Calculations are precise and correctly weighted. |
  | **(2) Naming & Explaining Phenomenon** | **2.5 / 2.5** | Correctly identifies Simpson's Paradox and the reversal. |
  | **(3) Explaining What Causes It** | **1.5 / 2.5** | Strong identification of confounding, but includes an overgeneralization in part (b). |
  | **(4) Conclusion on Method** | **2.5 / 2.5** | Correctly recommends StudySprint for the company. |
  | **TOTAL** | **9.0 / 10** | |

  ---

  ### Specific Comments for Your Partner

  Here is what I would write in the margins. You can copy these or adapt them to your voice.

  **On Part (a) Arithmetic:**
  > "This part is fine. You correctly weighted the pass rates by the number of students in each group ($79/120$ and $95/110$) rather than just averaging the percentages. That's a common trap, and you avoided it."

  **On Part (a) Phenomenon & Cause:**
  > "Excellent identification of Simpson's Paradox. Your explanation of the imbalance is spot-on: 'almost all the StudySprint kids... were in the no-pre-algebra group.' You correctly identified Pre-algebra as a confounder because it relates to both the method assignment and the pass rate. This is the core statistical insight."

  **On Part (b) Conclusion & Reasoning:**
  > "Your recommendation to the company is correct (choose StudySprint). However, be careful with this sentence: *'whenever the overall numbers and the within-group numbers disagree, you should always go with the within-group numbers.'* This is too absolute. In this specific case, you are right because Pre-algebra is a *confounder* (pre-existing). But if the groups were defined by something the program *caused*, this rule would fail. You actually address this in part (c), which makes this 'always' statement in (b) contradictory."

  **On Part (c) (Note: Not explicitly on rubric, but critical for reasoning):**
  > "This is sophisticated reasoning. You correctly distinguish between a confounder (Pre-algebra) and a mediator/collider (Practice problems). Your conclusion that 'the overall number would be the one to trust' in this specific scenario is correct for estimating the total effect. This shows you understand the nuance that was missing in your 'always' rule in part (b)."

  ---

  ### The One Mistake That Matters Most

  **The Mistake:** The universal rule in Part (b): *"whenever the overall numbers and the within-group numbers disagree, you should always go with the within-group numbers."*

  **Why it matters:** In statistics, context determines whether you stratify (look within groups) or aggregate (look overall).
  *   If the grouping variable is a **Confounder** (like Pre-algebra here), you **must** stratify.
  *   If the grouping variable is a **Mediator** (like Practice Problems in part c), you **must not** stratify if you want to measure the total effect of the program, because you would block the pathway through which the program works.

  Your partner actually knows this (they answered Part (c) correctly!), but their "rule of thumb" in Part (b) contradicts their own logic in Part (c). If they followed their own "always" rule in a different problem involving mediators, they would get the wrong answer.

  **Point Cost:** This should cost them **1 point** (deducted from Category 3: Explaining What Causes It). While their conclusion for *this specific company* is correct, the statistical reasoning they claimed to derive from it is flawed. A statistics professor cares more about the validity of the reasoning than the specific recommendation, because the reasoning is what they will use on the next problem.

