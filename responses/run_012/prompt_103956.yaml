          5.  Analyze the colleague's and student's arguments (what reading do they need? does it work?).
      *   **Constraint:** No need for citations; focus on analysis.
      *   **Tone:** Academic, precise, analytical, suitable for a colleague in political thought.

  2.  **Deconstruct the Slogan ("Fortune favors the bold"):**
