          *   *Critique:* Survivorship bias. Institutional survival might require caution. Machiavelli would ask: Does this match the *times*?
      *   *Student (Ignoring Structural Constraints):* Needs Level 4 (Will over Structure).
          *   *Critique:* Dangerous misreading. Structure *is* Fortuna's river. Ignoring it leads to ruin. Machiavelli emphasizes recognizing constraints.

  8.  **Refining and Structuring the Output:**
      *   *Introduction:* Acknowledge the Virgilian origin vs. Machiavellian attribution. Set the stage.
      *   *Section 1: The Menu of Theses.* Order by strength. Integrate 'Fortune' senses into each. Evaluate truth value and biases.
