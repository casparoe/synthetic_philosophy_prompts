prompt: |-
  ok so a friend of mine in a group chat is really into the rationalist-adjacent stuff and he keeps dropping Aumann's agreement theorem to shut down arguments. The move is always the same: we're disagreeing about something (last time it was whether some study replicated, another time it was whether a politician meant what he said), and he goes "if we were both rational and had the same information we couldn't still disagree, that's literally a theorem, so one of us is being irrational here." He says it like the math has already decided which of us it is, which is doing a LOT of work and I don't think the theorem can actually carry it.

  What I want is a breakdown of what "rational agents can't agree to disagree" could actually be claiming, from the boring-and-true versions up to the ones people pretend it says. Like, what does the theorum actually assume -- that we share the same prior? that each of us knows the other's credence, and knows the other knows his, all the way down? that we're both updating by Bayes correctly and instantly? -- and for each of those assumptions, what happens to the slogan if you drop it. Which reading, if any, actually supports "so one of us is irrational"? Does it say anything about the case where we just have different evidence (he seems to think it covers that), or about disagreeing over values rather than probablities? And is there a version left standing when neither of us is an ideal Bayesian with unlimited time to reason, cause I feel like the whole thing quietly needs that and then it stops applying to two people in a group chat.

  Lay it out as a list of seperate, precise claims, say for each whether it's a platitude, an actual result, or just false, and tell me which one he's probably leaning on and whether it gets him his conclusion. Don't just name the theorem back at me, I want the menu of readings.
