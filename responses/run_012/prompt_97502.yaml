      *   *Predicted Position:* Veblen would view the synthesis as a sophisticated formalization of his insights but ultimately a category error. He would applaud the focus on cost and waste as central to status but reject the biological grounding of the handicap principle, insisting that the "cost" is pecuniary and institutional rather than evolutionary. He would argue that the synthesis mistakes social convention for biological necessity, treating status competition as a universal human trait driven by fitness rather than a specific historical phase of industrial capitalism driven by pecuniary emulation.
