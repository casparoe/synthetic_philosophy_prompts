      *   **Synthesis Details:** Two axes: (1) Cost type (pure waste vs. byproduct of useful process), (2) Signal type (unfakeable index vs. strategic signal/fakeable at price).
      *   **Applications:** Luxury branding, academic credentials, political protests, online virtue signaling.
      *   **Task:** Predict Veblen's position (extension vs. betrayal), his view on handicap principle (biological vs. social), locus of explanatory power (cost, audience, institutions), and the synthesis's most important error.
      *   **Output Format:** JSON object with specific fields (`predicted_position`, `agreement_points`, `disagreement_points`, `key_veblenian_concepts_used`, `mapping_to_modern_phenomena`, `anachronism_risk`, `confidence`).

  2.  **Deconstruct Veblen's Thought:**
      *   **Core Idea:** Economic behavior is driven by social status and emulation, not just utility.
      *   **Conspicuous Consumption:** Buying things to show wealth.
      *   **Conspicuous Waste:** Wasting resources to show you can afford to waste them (proof of surplus).
      *   **Pecuniary Emulation:** Trying to keep up with or surpass the class above you.
      *   **Institutional Economics:** Habits of thought, cultural norms, and institutions shape behavior more than rational calculation.
      *   **Skepticism of Biological/Evolutionary Explanations:** Veblen was an institutionalist. He focused on cultural evolution (institutions, habits) rather than biological evolution (genetics, innate drives). He viewed "waste" as socially defined, not necessarily biologically costly in terms of survival fitness.
      *   **View on "Utility":** He distinguished between "serviceability" (actual use) and "pecuniary serviceability" (status value).

  3.  **Evaluate the Contemporary Synthesis:**
      *   **Costly Signaling/Handicap Principle (Zahavi):** Signals are honest because they are costly. Only high-quality individuals can afford the cost. Often rooted in evolutionary biology.
      *   **The Two Axes:**
          1.  Waste vs. Byproduct: Veblen loves "waste" as a status marker. He might agree that waste is key, but disagree on *why* (social status vs. biological fitness).
          2.  Index vs. Strategic: Veblen understands that signals can be faked (pecuniary emulation leads to counterfeiting status), but true status requires accepted validation (institutions).
      *   **Application to Modern Phenomena:**
          *   *Luxury:* Fits Veblen perfectly.
          *   *Academic Credentials:* Veblen wrote about "higher learning" as a form of status/tournament.
          *   *Protests/Virtue Signaling:* This is trickier. Veblen might see this as "conspicuous morality" or a new form of pecuniary emulation where moral capital replaces financial capital.

  4.  **Predict Veblen's Position:**
      *   **Extension or Betrayal?** He would likely see it as a *formal* extension but a *substantive* betrayal. He would agree that cost signals status, but he would reject the biological/evolutionary grounding of the Handicap Principle. He would insist the cost is socially constructed (pecuniary), not biologically inherent.
      *   **Handicap Principle:** He would reject the biological honesty aspect. For Veblen, the "cost" is meaningful only because society agrees it is costly (money/time), not because it drains biological fitness. He would argue the "waste" is the point, not a side effect of quality.
      *   **Explanatory Power:** He would locate it in *institutions* and *audience interpretation* (habits of thought), not the intrinsic cost. A signal only works if the community recognizes it as status-conferring.
      *   **Most Important Error:** Reducing social status competition to biological fitness or universal evolutionary logic. Ignoring the historical and institutional specificity of what counts as "waste" or "status."

