      *   *Veblen on Biology:* Veblen was influenced by Darwinism (evolutionary economics), but he applied it to *institutions*, not individual biological signaling. He saw institutions as evolving habits. So he might not reject "evolution" per se, but he would reject sociobiological reductionism. The prompt specifies "biologically honest" vs "socially constructed." Veblen definitely leans socially constructed/institutional.
      *   *Veblen on Waste:* He famously argued waste is *good* for status. The synthesis distinguishes waste vs. useful byproduct. Veblen would say the *waste* is the useful part (for status).
      *   *Veblen on Institutions:* This is his big differentiator from rational choice or pure evolutionary psych. The meaning is stabilized by institutions.

