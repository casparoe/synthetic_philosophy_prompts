prompt: |-
  Imagine Thorstein Veblen confronted with a contemporary synthesis that unifies costly signaling and the handicap principle and analyses any display along two axes: whether its cost is pure waste or a byproduct of a genuinely useful process, and whether it is an unfakeable index or a strategic signal that can be faked at a price. The synthesis is then applied to luxury branding, academic credentials, political protests, and online virtue signaling. Predict Veblen's position: would he regard this synthesis as a natural extension of his account of conspicuous consumption and conspicuous waste, or as a betrayal of it? Would he accept the handicap principle as an explanation of human social display, or insist that the relevant costs are socially constructed and status-driven rather than biologically honest? Where would he locate explanatory power—in the cost of the signal, in the audience's interpretation, or in the institutions that stabilize meaning? What would he identify as the synthesis's most important error about modern status competition?

  Return a JSON object with fields: predicted_position (one paragraph), agreement_points (array of strings), disagreement_points (array of strings), key_veblenian_concepts_used (array of strings), mapping_to_modern_phenomena (object with keys luxury_branding, academic_credentials, political_protests, online_virtue_signaling, each a string), anachronism_risk (one of low, medium, high, plus one sentence), and confidence (a number from 0 to 1 with one sentence of justification).
