answer: |-
  1. Ask the claimant to define the specific conditions for success and failure in writing, declining the **ancient sound levitation** claim immediately because the inability to reproduce the ability renders the conditions undefined.
  2. Require the claimant to sign off on all control measures beforehand to prevent blaming the apparatus later, declining the **RNG** claim if they refuse because the "hostile observer" clause contradicts necessary blinding protocols.
  3. Ensure the test has high severity by confirming it would likely yield a negative result if the claim were false, which accepts the **water dowsing** claim provided a double-blind field test fits the budget.
  4. Reject any exception clauses that merely absorb failures without predicting new facts, which decisively declines the **RNG** claim because the observer effect is an ad hoc rescue rather than a progressive research programme.
  5. Hand the final feasibility decision to the group if the cost is borderline, but require the claimant to agree that a negative result terminates the inquiry, which forces a value judgment on the **water dowsing** test regarding opportunity cost.

  The procedure is most likely to fail on claims that are true but fragile, misclassifying them at Step 3 because our budget cannot buy the sample size needed for high severity. It handles the Lakatosian objection worst at Step 4, as judging whether an amendment is progressive requires historical data we lack in a twenty-minute meeting. I would redraw Step 5 if a claimant provided verified video evidence of a pre-screening, as that would shift the feasibility burden and justify higher spending.
