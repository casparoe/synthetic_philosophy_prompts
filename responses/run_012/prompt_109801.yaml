  9.  (Final Review of the "Distributed Systems" section): Make sure to highlight that in dist sys, we assume nodes are *trying* to agree. In history, nodes (authors) are often trying to *disagree* or persuade. This is a crucial "Byzantine Generals" problem nuance.

