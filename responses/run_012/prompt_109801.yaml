          *   *Cross-examination:* Impossible with dead authors. You can't ask follow-ups.
          *   *Chain of Custody:* In law, evidence is tracked from collection to court. In history, manuscripts are copies of copies (the "telephone" problem), often centuries later.
          *   *The "Event":* Trials have a specific, bounded incident (e.g., the robbery on Nov 5th). History deals with processes, cultures, and long-term trends, not just discrete "crimes."
          *   *Corroboration:* Courts look for independent corroboration. History often has *only* one source (unicity).
          *   *Verdict:* Courts must reach a binary verdict (Guilty/Not Guilty). History deals in probabilities and narratives.
      *   *Impact on Conclusion:* The friend's conclusion is that reliable history is limited to the lifespan of a witness. The trial analogy *supports* this because in court, hearsay is generally inadmissible. However, history *must* rely on hearsay (sources reporting sources). If we apply legal rules of evidence strictly to history, almost all ancient history becomes inadmissible. Therefore, the analogy proves too much. It invalidates the very discipline it tries to explain.

