  **Recommendation**

  The Committee recommends that the Board reject the petition to mandate a disclaimer on the professor's syllabi and public lectures. Such a requirement conflates pedagogical transparency with institutional censure and risks chilling legitimate inquiry into unsettled physical models. However, we advise adopting a narrower measure requiring faculty to distinguish clearly between established physical consensus and speculative hypotheses when those hypotheses touch upon confessional boundaries. This clarification should be implemented before the start of the next academic semester. This approach preserves academic freedom while honoring the university's confessional commitment to a created order that is neither eternal nor self-explanatory. It avoids the appearance of inquisitorial oversight while ensuring students are not misled regarding the epistemic status of contested cosmological claims.

  **The Question Before the Committee**

  The Board must decide whether to require a faculty member to append a formal disclaimer to course materials and public talks, stating that her cosmological views are speculative and do not represent the university. This is not a judgment on the truth of her physics, nor is it a review of her tenure or employment status. The issue is strictly whether the university should formally distance itself from her specific interpretations of Genesis and cyclic cosmology in a public-facing manner. We are not asked to resolve the conflict between cyclic models and creatio ex nihilo, but to determine if the lack of physical demonstration warrants an institutional warning. The question concerns the governance of speech that intersects with doctrinal commitments, not the suppression of speech itself.

  **The Galilean Framework, Stated Precisely**

  Galileo's position rests on several interlocking claims regarding divine authorship and human interpretation that must be held together to function coherently. First, because God authors both the book of nature and the book of scripture, truth cannot contradict truth; apparent conflicts arise solely from misinterpretation of one or the other. Second, scripture accommodates human limitation, using the language of appearances rather than technical natural philosophy to ensure accessibility for salvation. Third, scripture aims at salvation, not scientific instruction, leaving cosmological questions to natural philosophers who study the immutable laws of nature. Fourth, theologians lack competence in physics, just as physicists lack competence in faith, requiring distinct spheres of authority. Fifth, binding scripture to a specific cosmology risks grave harm if that cosmology is later disproven, providing ammunition to unbelievers and damaging the faith of the unlearned. Therefore, sixth, a scriptural passage should only be reinterpreted in light of physical results when those results are demonstratively certain, not merely probable. Finally, Galileo conceded that if the earth's immobility were genuinely demonstrated, he would abandon Copernicanism, acknowledging scripture's authority where nature is silent. Together, these strands form a protective barrier: theology remains stable until science achieves certainty, preventing faith from being hostage to changing hypotheses. This structure prioritizes the stability of faith while allowing science to proceed, provided it respects the high bar of demonstration before demanding theological revision. It seeks to prevent the scandal that arises when Christians defend physical errors as doctrinal truths. The demonstration condition is the linchpin; without it, every new hypothesis would force a theological crisis. With it, theology retains autonomy until nature speaks unequivocally. This ensures that religious belief is not shaken by the inevitable revisions of scientific theory, preserving the credibility of the faith among both the learned and the simple. Crucially, this framework places the burden of proof on the natural philosopher. It is not the theologian's job to disprove the hypothesis, but the physicist's job to prove it before claiming theological space. This protects the church from having to constantly revise its reading of scripture based on the latest academic trends. It acknowledges that scientific consensus shifts, while doctrinal truth remains stable. The concession regarding immobility shows that Galileo was not claiming science overrides scripture universally, but only where nature provides undeniable evidence. This distinction is vital for maintaining the integrity of both domains.

  **Where the Framework Comes Under Strain**

  This framework fractures when examining the logical relationship between the principle of accommodation and the requirement for demonstration. If scripture always speaks in the idiom of appearances to accommodate ordinary understanding, then its cosmological claims are arguably never literal descriptions of physical reality, rendering the demand for physical demonstration seemingly idle. Why wait for proof if the text never intended to teach physics in the first place? Conversely, if the demonstration condition is strict, theology remains frozen until science achieves certainty, which may never happen for unsettled models. This creates a tension: generous accommodation suggests scripture is irrelevant to cosmology, but the demonstration condition suggests scripture governs cosmology until proven otherwise. Furthermore, if a physical model is untestable in principle, it can never meet the demonstration condition. Does this mean theology must permanently reject it, or that the model is metaphysically idle? The framework struggles to adjudicate cases where physics is genuinely unsettled, leaving the theologian either too vulnerable to speculation or too resistant to inquiry. The protection against harm relies on certainty that science often cannot provide. In this gap, the framework offers no clear rule for handling elegant but unproven hypotheses that contradict traditional readings. The condition meant to protect faith may instead stifle the very inquiry that could eventually lead to demonstration. If accommodation is total, the demonstration condition is redundant; if the demonstration condition is necessary, accommodation is limited. This contradiction leaves the committee without a clear mechanism for handling speculative cosmologies that touch on doctrinal boundaries. We must decide whether to prioritize the stability of the confession or the freedom of speculative inquiry when demonstration is impossible. If the models are untestable in principle, they reside outside the realm of demonstration entirely. Galileo's framework assumes that demonstration is eventually possible. When it is not, the framework offers no guidance. Does the default position remain with scripture, or does the possibility of accommodation open the door? If accommodation is generous, the demonstration condition becomes a hurdle that can never be cleared, locking theology into a pre-scientific worldview. If the condition is strict, theology ignores potentially valid metaphysical implications of physics. The tension is sharpest here: the very condition meant to protect faith from error may protect error from correction by preventing theological engagement with speculative science. We face a choice between rigid stability and vulnerable openness.

  **Application to This Case**

  Applying this to the professor's case, her cyclic models fail the demonstration condition; they are unsettled and arguably untestable. Under the Galilean rule, she cannot demand scripture or confession be reinterpreted to accommodate them as established truth. However, the petitioners' demand for a disclaimer misapplies the framework by treating speculation as error. The professor may teach these models as hypotheses, provided she does not present them as established facts that override confessional doctrine. The university should not mandate a disclaimer that stigmatizes her work, but should require pedagogical clarity. She must explicitly state in class that these models are speculative and that the university's confession affirms a non-eternal created order. This respects the demonstration condition by not granting speculative physics doctrinal authority, while respecting accommodation by not binding scripture to a specific temporal beginning if the physics remains unresolved. The syllabus should reflect this distinction, noting that while physics explores various origins, the confession holds to a created order dependent on God. Public lectures should carry similar nuance. This avoids binding the university to unproven physics while maintaining doctrinal integrity. It acknowledges the physics is genuine inquiry but not settled knowledge. The professor is free to explore the models, but must not present them as requiring a change in the university's confessional stance. This balances the risk of scandal with the value of inquiry. Specifically, the professor should add a note to the syllabus stating that cosmological models discussed are subject to ongoing debate and do not constitute doctrinal instruction. This satisfies the need for transparency without issuing a punitive disclaimer. It treats the students as capable of understanding the distinction between physical hypothesis and theological commitment. The university thus maintains its confessional identity without acting as a censor of scientific speculation. This approach honors the Galilean insistence on not binding scripture to unproven physics while respecting the confession's affirmation of a created order.

  **The Strongest Case Against My Recommendation**

  Proponents of the disclaimer argue that the confessional statement explicitly denies an eternal created order. By advocating cyclic models, the professor arguably teaches that the universe is eternal in some sense, directly contradicting the confession. They contend that allowing this without a formal disclaimer implies institutional endorsement of doctrinal error. They argue that academic freedom does not protect the subversion of the university's religious identity. If the physics is untestable, it is metaphysics, and therefore falls under theological jurisdiction. To allow her to teach this as open inquiry is to permit the erosion of the university's core commitments under the guise of scientific speculation. They fear that without a disclaimer, students will assume the university has abandoned its creed.
  However, this view binds the confession to a specific cosmological claim about temporal beginnings that may be phenomenological. Enforcing a disclaimer treats a speculative hypothesis as a settled heresy, violating the demonstration condition. It risks making the university appear fearful of inquiry. Better to require clarity on the speculative status than to issue a censure that conflates hypothesis with doctrine. The confession affirms dependence on God, which cyclic models may still accommodate if the cycle itself is created. We must protect the confession without pretending scientific certainty where none exists. The petitioners fear that silence equals endorsement. However, the university's silence on specific physical models is not endorsement but proper jurisdictional restraint. To issue a disclaimer is to claim the university has judged the physics, which it is not competent to do. It is better to judge the pedagogical presentation than the physics itself. The confession requires belief in a creator, not necessarily a specific temporal mechanism. By focusing on the pedagogical clarity, we address the concern for students without overstepping into scientific adjudication. This preserves the university's role as a guardian of faith and a patron of learning, without conflating the two.

  **Implementation**

  The Committee will vote on this recommendation at our next meeting on October 15th. Upon approval, the Chair will transmit the opinion to the Provost by October 20th. The Provost should meet with the professor before November 1st to discuss syllabus language for the spring term. The requirement for pedagogical clarity regarding speculative cosmology will be incorporated into faculty guidelines by December 1st. This timeline ensures the matter is resolved before course registration begins, allowing for orderly implementation without disrupting current instruction. The Provost will report back to the Board on compliance by January 15th.
