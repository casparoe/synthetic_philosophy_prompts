answer: |-
  The fluorescent light in the common room hummed like a dying insect, casting a sickly pallor over the fourteen members of the Sunset Arms Co-op. They sat in a circle of mismatched armchairs salvaged from the motel's original 1970s lobby, the air thick with the smell of damp carpet and the lavender detergent someone had poured into the shared washer again, despite the sign forbidding it.

  Mara clutched the leash under the table. Barnaby, her border collie mix, lay quiet at her feet, sensing the tension. Across the circle, Elias tapped a pen against the Green Binder. The Binder was the constitution, the scripture, and the weapon of the co-op. It sat on the folding table like a brick.

  "We're done with the discussion," Elias said. His voice was flat, the voice of a man who managed a warehouse during the day and managed people here at night. "We vote on Amendment 19. The No-Pets Clause."

  "You can't vote," Mara said. Her voice didn't shake, but her hand tightened on the leash. "The threshold isn't met."

  Elias didn't look up. "Section 3.1. Simple majority. Fifty percent plus one. We have eight in favor. That's fifty-seven percent."

  "Section 3.1 was amended last month," Mara countered. "Amendment 18 lowered the threshold from seventy-five percent to fifty. But Amendment 18 itself passed with only fifty percent. The old rule required seventy-five."

  Sitting in the corner, old Mr. Henderson rubbed his temples. "So the fifty-percent rule is illegal because it didn't get seventy-five. But if the fifty-percent rule is illegal, then the seventy-five rule stands. But if the seventy-five rule stands, then Amendment 18 failed. But if Amendment 18 failed, we're still at seventy-five."

  "But if we're at seventy-five," said Sarah from the kitchenette, peeling a label off her beer bottle, "then nobody can ever change the voting rule, because you'd need seventy-five to lower it to fifty, but you'd need fifty to lower it to fifty... wait." She stopped. The logic looped in the air, visible and suffocating.

  Elias closed the Binder with a snap. "The Membership ratified Amendment 18. We are operating under Amendment 18. The vote stands."

  "The Membership ratified a paradox," Mara said. "You're using a rule to validate itself."

  "I'm using the rule we live by," Elias said. "Vote."

  Hands went up. Eight against six. Barnaby whined, a low sound in his throat. Mara silenced him with a touch.

  "Motion carried," Elias said. "Effective immediately. The dog goes."

  "Not yet," Mara said. She stood up, pulling the Green Binder toward her. The plastic sleeves crinkled. "Read Section 4.2. The Welfare Clause."

  Elias sighed, the sound of a tire losing air. "We've been over this."

  "Read it."

  Elias opened the binder. He didn't want to, but the room was watching. The paradox of the voting threshold was a cloud over them, but this was the rain. He found the tab.

  **"Section 4.2: Any amendment must demonstrably increase the collective welfare of the Membership as determined at the time of ratification, subject to review by the Chair whose interpretation shall be final, provided that no interpretation regarding fundamental rights shall be immune from Membership review."**

  The silence stretched. The refrigerator kicked on, a loud clunk that made everyone jump.

  "Welfare," Mara said. "Define it."

  "Quiet," Elias said. "Sleep. Hygiene. The motel was built for transients, not kennels. The welfare of the fourteen is higher without the animal."

  "My welfare is part of the collective," Mara said. "I live here. I pay the mortgage. Barnaby is my support animal. Removing him decreases my welfare. Therefore, the amendment fails the Welfare Clause."

  "The Clause says 'collective'," Elias said. "Your welfare is subtracted from the sum. Thirteen gain peace, one loses companionship. The net is positive."

  "It says 'demonstrably'," Mara pressed. "Where is the demonstration? We didn't measure noise levels. We didn't survey happiness. You just declared it."

  "I am the Chair."

  "Read the rest of the sentence," Mara said. She pointed at the text. "Subject to review by the Chair whose interpretation shall be final, *provided that no interpretation regarding fundamental rights shall be immune from Membership review*."

  Elias stared at the page. The sentence was a snake eating its own tail.

  "I am interpreting this now," Elias said. "I say the ban increases welfare. My interpretation is final."

  "But is it a fundamental right?" Mara asked. "Housing is a fundamental right. Companionship is tied to housing. If you ban the dog, you ban me. If you ban me, you're reviewing a fundamental right. If you're reviewing a fundamental right, your interpretation is *not* final. It is immune from your finality. It goes to the Membership."

  "My interpretation determines whether it's a fundamental right," Elias said. "So my interpretation is final on whether my interpretation is final."

  "That's not what it says," Mara said. "It says no interpretation regarding fundamental rights is immune. You can't claim finality to decide if you have finality. That voids the provision."

  "It voids itself," Elias corrected. "If the provision voids itself, then the first part stands. Interpretation shall be final."

  "Then the provision doesn't apply," Mara said. "But if the provision doesn't apply, then we default to the standard review process, which means the Membership votes on the interpretation."

  "The Membership just voted on the amendment," Elias said. "They voted on the welfare implicitly."

  "They voted on the ban," Mara said. "They didn't vote on the welfare calculation. The Rule says welfare must be determined *at the time of ratification*. Did we determine it? Or did we assume it?"

  "We assumed it," Elias said.

  "Then we violated the Rule," Mara said. "If we violated the Rule, the amendment is null. If the amendment is null, the dog stays."

  "If the amendment is null," Elias said, leaning forward, "then Section 4.2 is null, because Section 4.2 is part of the amendment chain that started with Amendment 18. If Amendment 18 is shaky because of the voting threshold, and Amendment 19 is shaky because of the Welfare Clause, then what rules are we using?"

  "The ones in the Binder," Mara said.

  "The Binder is contradictory," Elias said. "It claims finality for me. It claims review for you. It claims welfare is a test. It claims welfare is a feeling. It claims I decide. It claims I don't."

  "Then we follow the text," Mara said. "The text says 'provided that'. That's a condition. You haven't met the condition."

  "I met the condition by saying I did," Elias said.

  "You can't condition your own authority on your own assertion of authority," Mara said. "That's circular."

  "So is your claim that you can review my assertion of authority," Elias said. "You're using the Rule to limit the Rule."

  They stood there, two adults in a converted motel room, surrounded by people who just wanted to know if they could keep their cat or if the laundry schedule was changing. The stakes were a living creature, a home, a job, a life. But the battlefield was syntax.

  Mr. Henderson spoke up from the corner. "I'm confused. Is the dog allowed?"

  "That depends," Elias said, not looking away from Mara. "On whether the Chair's ruling on welfare is final."

  "And that depends," Mara said, "On whether the welfare ruling touches a fundamental right."

  "And who decides that?" Sarah asked.

  Elias tapped the page. "I do."

  "No," Mara said. "The Membership does."

  "The Membership already voted," Elias said.

  "The Membership voted on the ban, not the interpretation," Mara said. "Section 4.2 requires a two-step process. First, welfare determination. Second, ratification. We did them simultaneously. That violates the sequence."

  "Section 9.1 allows for emergency motions," Elias said. "Which suspends sequence."

  "Section 9.1 was amended by Amendment 18," Mara said. "The one with the voting threshold paradox."

  Elias closed his eyes. For a second, he looked incredibly tired. The weight of the Green Binder was physical. It pressed down on the table, on the room, on the air they breathed. It was a machine they had built to protect themselves from landlords, from chaos, from each other. Now it was grinding its gears.

  "If I rule in your favor," Elias said quietly, "I admit my authority is limited. If I admit my authority is limited, I can't enforce the ban. If I can't enforce the ban, the dog stays. If the dog stays, the welfare of the thirteen is compromised. If the welfare is compromised, I violated Section 4.2."

  "If you rule against me," Mara said, "you claim finality. If you claim finality on a fundamental right, you violate the proviso. If you violate the proviso, your ruling is void. If your ruling is void, the ban is unenforced. The dog stays."

  Elias opened his eyes. "Either way, the dog stays?"

  "Either way," Mara said, "the Rule is broken."

  "No," Elias said. He straightened his spine. He looked at the Binder, then at Mara, then at the group. "The Rule isn't broken. The Rule is the only thing holding this together. If the Rule contains a contradiction, then the contradiction is the Rule."

  "That's not how logic works," Mara said.

  "This isn't logic," Elias said. "This is housing."

  He picked up the pen. He hovered it over the minutes sheet. He could write *Motion Carried*. He could write *Motion Void*. He could write *Pending Review*. Each option was defensible. Each option was actionable. Each option would be appealed. The appeal would cite the same sentence. The appeal would be heard by the same people, under the same rules, in the same room with the same hum of the fluorescent light.

  "What do you write?" Mara asked.

  Elias looked at the dog. Barnaby rested his chin on Mara's shoe, eyes closed, trusting the humans to solve the puzzle of their own making.

  "I write that the Chair reserves judgment," Elias said.

  "On what grounds?"

  "On the grounds that the Welfare Clause requires demonstration," Elias said. "We have not demonstrated anything. Therefore, the amendment is in limbo. The status quo ante remains."

  "So the dog stays," Mara said.

  "Pending demonstration," Elias said. "Which I will schedule. For which I will set the criteria. Which will be subject to review."

  "By who?"

  "By the Membership," Elias said. "Unless I deem it administrative."

  "Which you can," Mara said.

  "Which I can," Elias said.

  He signed the minutes. He didn't date them. He left the date blank. A small ambiguity to match the large ones.

  Mara clipped the leash onto Barnaby's collar. The metal click was the loudest sound in the room. She didn't smile. She didn't thank him. There was no victory here. The Binder sat on the table, closed, its spine cracked, its pages full of words that meant everything and nothing.

  "Meeting adjourned," Elias said.

  Nobody moved immediately. They sat in the hum of the light, listening to the washer spin its uneven cycle in the utility closet, thumping against the wall like a heartbeat that couldn't find its rhythm. They were free to stay, free to go, free to argue again next month. The Rule had not been solved. It had simply absorbed the conflict and continued to exist, heavier than before.

  Mara walked to the door. Barnaby trotted beside her. She didn't look back at the table. She knew that tomorrow, someone would propose an amendment to clarify Section 4.2. And someone would propose an amendment to forbid amendments to Section 4.2. And the Green Binder would grow another inch thicker, and the light would continue to hum, and the rules would remain perfectly, beautifully, unassailably unclear.

  She opened the door to the cool night air. The rulebook stayed on the table.
