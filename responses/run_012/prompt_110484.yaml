prompt: |-
  I dont have any academic background, I just read a lot on my own, and I've fallen into a hole about the handicap principle and the whole costly signaling business — peacock tails, brightly coloured frogs advertising how poisonous they are, people explaining religion and charity and enormous weddings as ways of burning resources so that others will believe you. The more I read the more I think there are two or three different theories wearing the same coat, and that the label gets slapped onto any behaviour that looks wasteful after the fact. My flatmate says that's because the whole thing is unfalsifiable and I half believe her. Before I try to work out who's right in any particular case, I want the spec — good enough that I could look at a case I've never read about and say whether the account covers it or not. So write me the list of things any account of honest communication between creatures whose interests only partly overlap has to get right: the cases it has to handle (the peacock, the poison frog, the honest-without-cost stuff like body size or a deep voice that anyone can just read off, the human cases where the audience is mates and rivals and allies at once), the distinctions it can't collapse (between a signal and a mere cue, between a cost that's a flat waste and a cost only some can afford, between advertising your quality and advertising your commitment), and the results it can't contradict (that selection doesn't keep paying for pure waste, that the receiver needs a reason to respond and not only the sender a reason to signal). For each item, tell me the case or observation that puts it on the list, and say whether it's something any decent account needs or just something one camp happens to want.

  Then the part I actually care about: tell me which items can't all be satisfied at once. If the list is secretly inconsistent — say, if being general enough to cover the free honest cues makes the whole thing vacuous, or if the demand that the account name the cost in advance fights with the demand that it cover the human cases where anything expensive can be relabelled — then I want that said out loud, because then the list is itself the answer and I can stop hunting for the one true theory. Also tell me which single requirement does the most work in ruling candidates out, and which requirement you'd drop first if you had to. No reading list please, I only want the spec. A table is fine.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Background:** Non-academic, autodidact, skeptical of the Handicap Principle/Costly Signaling Theory (CST). Suspects it's unfalsifiable or a "just-so story" bucket.
      *   **Goal:** Wants a "spec" (specification) for *any* theory of honest communication where interests partly overlap.
      *   **Requirements:**
          *   List of things the account must get right (cases, distinctions, results).
          *   For each item: The case/observation, and whether it's a universal requirement or camp-specific.
          *   **Crucial Part:** Identify inconsistencies in the list (trade-offs, impossibility theorems).
          *   Identify the most constraining requirement.
          *   Identify the requirement to drop first if forced.
          *   **Format:** Table is fine. No reading list.
      *   **Tone:** Direct, analytical, acknowledging the skepticism (validating the "unfalsifiable" concern without dismissing the theory entirely).

  2.  **Deconstruct the Subject Matter (Handicap Principle/CST vs. Alternatives):**
      *   *Core Problem:* How does honest signaling evolve when lying is beneficial? (The "Cheap Talk" problem).
      *   *Zahavi's Handicap:* Signals must be costly to be honest. Only high-quality individuals can afford the cost.
      *   *Grafen's Formalization:* Mathematical proof that costs stabilize honesty.
      *   *Alternatives/Refinements:* Index signals (unfakeable due to physics/physiology), Conventional signals (costly if caught lying, not costly to produce), Revealing signals (costs differ by type).
      *   *The User's Skepticism:* Is "cost" defined post-hoc? Does it cover *everything* (making it vacuous)?

  3.  **Drafting the "Spec" (The List):**
      *   *Cases to Handle:*
          1.  Peacock (Classic Costly).
          2.  Poison Frog (Aposematism - is it costly? Or just indexical?).
          3.  Body Size/Deep Voice (Indices - hard to fake, not necessarily "wasteful").
          4.  Human Rituals (Weddings/Charity - complex audiences, cultural variation).
      *   *Distinctions:*
          1.  Signal vs. Cue (Intentional/evolved for communication vs. incidental).
          2.  Absolute Cost vs. Differential Cost (Waste vs. Marginal Cost difference).
          3.  Quality vs. Commitment (I am good vs. I am dedicated).
      *   *Results/Constraints:*
          1.  No Pure Waste (Selection prunes useless energy drain).
          2.  Receiver Benefit (Why listen? Stability requires receiver gain).
          3.  Stability against Invaders (Liars shouldn't take over).

  4.  **Identifying the Inconsistencies (The "Gotcha"):**
      *   *The Tension:* The user suspects the theory is too broad (vacuous) but also demands it explain "free" honest cues (indices).
      *   *Conflict 1:* **Cost vs. Index.** If the theory *requires* cost (Handicap), it fails to explain indices (body size) which are honest *without* marginal waste. If the theory allows indices, "cost" is no longer the defining feature, making "Costly Signaling" a misnomer for the general class.
      *   *Conflict 2:* **Prediction vs. Post-hoc.** To be falsifiable, costs must be identified *before* observing the behavior. In human cases (weddings), costs are often inferred *after* to explain the behavior. This creates the unfalsifiability loop the user's flatmate mentioned.
      *   *Conflict 3:* **General vs. Specific.** A theory general enough to cover frogs, peacocks, and humans risks becoming "organisms do things that work," which explains nothing.

  5.  **Selecting the "Most Work" and "Drop First":**
      *   *Most Work:* **Stability against Liars (The Equilibrium Condition).** This is the mathematical core. If liars can invade, the signal collapses. This rules out most "just-so" stories.
      *   *Drop First:* **The Requirement for Net Waste (The "Handicap" proper).** Modern signaling theory often accepts "differential cost" or "indices" which aren't net wasteful. Dropping strict "waste" allows the theory to absorb indices and conventional signals without breaking the logic of honesty.

  6.  **Refining the Output (Formatting & Tone):**
      *   Use a table for the Spec.
      *   Use a clear section for the Inconsistencies.
      *   Keep it sharp. No fluff. Address the flatmate's "unfalsifiable" comment directly in the analysis.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I include the "free honest cues"? Yes, need to distinguish Index vs. Handicap.
      *   *Check:* Did I address the human element? Yes, complex audiences.
      *   *Check:* Is the inconsistency clear? The tension between "Must be costly" and "Must explain cost-free honesty" is the key. Also the "Post-hoc cost identification" problem.
      *   *Refinement:* Make sure to distinguish between *Handicap Principle* (specific) and *Signaling Theory* (general). The user conflates them slightly, which is part of their confusion. I need to clarify that in the spec.
      *   *Tone Check:* The user wants the "spec," not a lecture. Keep it technical but accessible.

  8.  **Final Polish:** (Mental walk-through of the table)
      *   Item: Peacock. Requirement: Cost must exceed benefit for low quality. Status: Core.
      *   Item: Body Size. Requirement: Honesty without marginal cost. Status: Tension point.
      *   Item: Human Weddings. Requirement: Audience complexity. Status: High risk of post-hoc fitting.
      *   ...and so on.

      *   *Inconsistency Section:* Focus on the "Vacuity vs. Specificity" trade-off. If you define cost broadly enough to cover everything, you predict nothing. If you define it narrowly (waste), you exclude indices.

