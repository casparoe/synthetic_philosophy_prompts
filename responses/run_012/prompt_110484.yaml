answer: |-
  Here is the specification you asked for. It treats "Signaling Theory" as the broader engine and the "Handicap Principle" as a specific (and contested) mechanism within it.

  ### Part 1: The Spec for Honest Communication
  **Context:** Sender and Receiver have partially overlapping interests (Sender wants to be believed, Receiver wants true info, but Sender might benefit from lying).

  | Category | Item / Requirement | The Case / Observation | Universal Need or Camp Preference? |
  | :--- | :--- | :--- | :--- |
  | **Cases to Handle** | **The Peacock (Classic Handicap)** | A trait reduces survival (heavy tail) but increases mating. | **Camp Preference.** This is the archetype for the *Handicap Principle*, but not all signaling requires survival reduction. |
  | | **The Poison Frog (Aposematism)** | Bright colors warn of toxins. Predators avoid them. | **Universal Need.** Any account must explain why predators trust the color rather than assuming it's a bluff. |
  | | **The Deep Voice / Body Size (Index)** | You can hear body size in a voice. You cannot fake being large if you are small. | **Universal Need.** An account that demands *cost* for all honesty fails here. This is "unfakeable" due to physics, not waste. |
  | | **Human Rituals (Weddings/Charity)** | Burning money in front of mates, rivals, and allies simultaneously. | **Universal Need (with caveats).** Must handle multiple audiences with different interests. High risk of post-hoc explanation. |
  | **Distinctions** | **Signal vs. Cue** | **Signal:** Evolved *to* communicate. **Cue:** Incidental info (e.g., footprints). | **Universal Need.** If you can't distinguish evolved intent from incidental leakage, you aren't doing signaling theory. |
  | | **Absolute Cost vs. Differential Cost** | **Absolute:** The signal burns energy for everyone. **Differential:** It costs *more* for a low-quality sender than a high-quality one. | **Camp Preference.** Handicap purists want absolute waste. Modern game theorists only require differential marginal cost. |
  | | **Quality vs. Commitment** | **Quality:** "I have good genes." **Commitment:** "I am willing to fight for this territory." | **Universal Need.** Confusing these leads to wrong predictions. A signal of commitment doesn't prove quality, only resolve. |
  | **Results / Constraints** | **Evolutionary Stability (ESS)** | Liars (cheapers) cannot invade the population and wipe out honest signalers. | **Universal Need.** If liars win, the signal disappears. This is the mathematical core. |
  | | **Receiver Benefit** | The Receiver must gain fitness by listening. If listening is neutral or harmful, they will stop paying attention (ignoring the signal). | **Universal Need.** Often overlooked. A signal cannot persist if the audience evolves to ignore it. |
  | | **No Pure Waste (Efficiency)** | Selection should not maintain a signal if a cheaper one achieves the same honesty. | **Universal Need.** This is the main attack on the Handicap Principle. Why burn calories if a cheap word works? |
  | | **Ex-Ante Cost Identification** | The cost must be identifiable *before* knowing the behavior is a signal, not inferred *after*. | **Universal Need (Methodological).** This is your flatmate's point. If cost is defined by the behavior's existence, the theory is circular. |

  ***

  ### Part 2: The Inconsistencies (Where the Spec Breaks)

  You asked which items cannot be satisfied at once. Your flatmate is half-right: the theory becomes unfalsifiable if you stretch the definitions to meet all the "Universal Needs" above. Here are the specific tensions.

  **1. The "Index" vs. "Handicap" Contradiction**
  *   **The Conflict:** You require the theory to handle **Body Size/Deep Voice** (Indices) and **The Peacock** (Handicaps).
  *   **The Problem:** Indices are honest *because* they are physically linked to the trait (you can't have a deep voice without a large larynx). They require **no marginal cost** to be honest. Handicaps are honest *because* they are costly.
  *   **The Inconsistency:** If you define the theory as "Costly Signaling," it fails to cover Indices. If you broaden it to "Honest Signaling" to include Indices, then **Cost** is no longer the necessary condition for honesty. This makes the "Costly Signaling" label misleading for the general class.
  *   **Result:** You cannot have a single mechanism that explains both. You need two: one for indices (physics/physiology) and one for signals (economics/cost). Lumping them together creates the "vacuous" feeling you have.

  **2. The "Ex-Ante Cost" vs. "Human Rituals" Contradiction**
  *   **The Conflict:** You require **Ex-Ante Cost Identification** (methodological rigor) and coverage of **Human Rituals**.
  *   **The Problem:** In peacocks, we can measure the caloric cost of the tail before we know it's a signal. In human weddings or charity, the "cost" is often social or opportunity-based. It is almost impossible to measure the "cost of not doing it" independently of the fact that they did it.
  *   **The Inconsistency:** To cover human cases, theorists often infer the cost *from* the behavior (e.g., "They spent money, therefore it was costly, therefore it is a signal"). This violates the **Ex-Ante** requirement.
  *   **Result:** If you keep the Ex-Ante requirement, you must exclude most human behavioral ecology. If you include human cases, you admit the theory is often post-hoc and unfalsifiable in practice.

  **3. The "No Pure Waste" vs. "Handicap" Contradiction**
  *   **The Conflict:** You require **No Pure Waste** (Efficiency) and the **Peacock** case (which relies on waste).
  *   **The Problem:** The Handicap Principle argues waste *is* the point. Efficiency argues waste is a bug.
  *   **The Inconsistency:** Modern game theory resolves this by saying the cost must be *differential* (harder for liars), not necessarily *wasteful* (net loss). But the original intuition (Zahavi) was about waste.
  *   **Result:** You cannot satisfy the intuition of "burning resources to prove worth" while simultaneously satisfying the evolutionary demand for "efficiency." One of these has to give.

  ***

  ### Part 3: The Verdict

  **Which single requirement does the most work in ruling candidates out?**
  **Evolutionary Stability (ESS).**
  This is the hammer. Any story that says "Senders signal X" must answer: "Why doesn't a mutant who lies about X take over?" If the account cannot model the invasion of liars, it is just a story, not a theory. This rules out 90% of pop-science explanations of signaling.

  **Which requirement would you drop first if you had to?**
  **The Requirement for Net Waste (Absolute Cost).**
  Drop the idea that the signal must be "wasteful" or "handicapping" in a survival sense.
  *   **Why?** Because honesty can be maintained by *differential costs* (it costs me less to signal than you) or *indices* (I physically can't fake it).
  *   **Benefit:** Dropping "Waste" allows you to keep the **Peacock** (differential cost), the **Deep Voice** (index), and the **Poison Frog** (conventional signal with punishment for liars) under one mathematical umbrella without claiming that evolution loves burning calories for no reason.
  *   **Consequence:** You lose the poetic appeal of "suffering proves truth," but you gain a theory that doesn't contradict basic efficiency principles.

  **Summary for your Flatmate:**
  She is right that the *human applications* often violate the **Ex-Ante Cost** rule, making them unfalsifiable just-so stories. However, the *biological core* (ESS + Differential Cost) is mathematically sound. The confusion arises because people use the same label ("Costly Signaling") for the rigorous math (peacocks) and the loose analogy (weddings). The spec above shows they are not the same thing.
