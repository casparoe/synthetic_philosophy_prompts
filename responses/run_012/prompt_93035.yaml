answer: |-
  ### Brainstorming: Reconstructing the Argument

  Here is the argument as it typically appears in the blogs you're reading, broken down into steps with the hidden assumptions exposed.

  1.  **The Impartiality Premise:** To judge a social rule fairly, you must not know which specific person in society you will be.
      *   *Assumption:* Moral impartiality is modeled as epistemic ignorance (the "Veil of Ignorance").
  2.  **The Probability Premise:** Since you don't know who you are, you should treat it as equally likely that you will be any one of the $N$ people affected.
      *   *Assumption:* The Principle of Insufficient Reason (if you have no evidence favoring one outcome over another, assign equal probability).
  3.  **The Rationality Premise:** A rational agent behind this veil will choose the rule that maximizes their Expected Wellbeing (Expected Utility).
      *   *Assumption:* Standard Decision Theory (Von Neumann-Morgenstern axioms) applies to moral choice. Specifically, the agent is risk-neutral *with respect to utility*.
  4.  **The Aggregation Premise:** The expected wellbeing of the chooser is the average of the wellbeing of all actual people ($\frac{1}{N} \sum U_i$). Maximizing this average is mathematically equivalent to maximizing the sum ($\sum U_i$).
      *   *Assumption:* **Interpersonal Comparability.** We can measure Person A's wellbeing and Person B's wellbeing on the same cardinal scale and add them together.
  5.  **The Normative Conclusion:** The rule a rational self-interested chooser would pick behind the veil is the morally correct rule for society.
      *   *Assumption:* **Rational Prudence = Morality.** There is no gap between what is good for me (if I might be anyone) and what is good *simpliciter*.

  ***

  ### The Analysis

  You have excellent instincts. You have identified that what looks like a single seamless argument is actually a chain of distinct claims, some formal, some ethical, and some metaphysical. The blogs you are reading are likely conflating them.

  Here is the carving you asked for.

  #### 1. Does it have a name?
  Yes. The formal backbone is **Harsanyi's Aggregation Theorem** (specifically from John Harsanyi's 1953 and 1955 papers). The informal rhetorical device is the **Veil of Ignorance** argument for **Utilitarianism**.

  It is crucial to distinguish this from **Rawls**. John Rawls adopted the "Veil of Ignorance" metaphor specifically to argue *against* this conclusion. Rawls argues that under the veil, rational people would *not* maximize expected utility (Step 3 above); they would play it safe and maximize the minimum position (Maximin). So, when you see this argument, you are looking at **Harsanyi's Utilitarianism**, which is the primary rival to **Rawlsian Justice**.

  #### 2. Carving the Argument: Where the "Extra Work" is Done

  You asked which steps are licensed and which are smuggling in conclusions. Here is the breakdown of your three worries mapped onto the steps above.

  **Worry 1: The Lottery vs. Equal Shares (Risk and Equality)**
  *   **The Step:** Step 3 (The Rationality Premise).
  *   **The Conflation:** The blogs are conflating *resources* with *utility*.
  *   **The Analysis:** If the chooser maximizes Expected *Utility*, they are not necessarily indifferent between a sure modest share and a risky lottery, even if the expected *resource* amount is the same. Standard economics assumes diminishing marginal utility of resources (an extra \$1,000 means more to a poor person than a rich one). If the utility function is concave, an Expected Utility maximizer behind the veil will choose **egalitarian distribution of resources**, not a lottery.
  *   **The "Extra Work":** For the blogs to conclude that a lottery is fair (as in your hazardous facility example), they must assume the agent is **risk-neutral** regarding the outcome. But risk-neutrality over *life outcomes* (e.g., "living near a toxic dump" vs. "dying early") is a massive ethical assumption, not a neutral fact of rationality.
  *   **The Terminology:** This is the distinction between **Ex Ante Egalitarianism** (fairness of the procedure/odds) and **Ex Post Egalitarianism** (fairness of the actual outcome). Harsanyi's argument justifies Ex Ante fairness. Your intuition that the "short straw" holder has a complaint is an Ex Post objection. The argument simply dismisses Ex Post concerns as irrational from the pre-choice perspective.

  **Worry 2: The "Single Person" Metaphor (Separateness of Persons)**
  *   **The Step:** Step 5 (The Normative Conclusion).
  *   **The Conflation:** Prudence vs. Morality.
  *   **The Analysis:** This is the most famous objection to Harsanyi, articulated by **Robert Nozick** and **John Rawls**. Nozick called this the **Separateness of Persons** objection.
      *   *Individual:* It makes sense for *one* person to sacrifice a toothache today for a cure next week. The loss and gain happen to the same entity.
      *   *Society:* It is metaphysically dubious to say Person A's loss is "balanced out" by Person B's gain, even if the "chooser" behind the veil might have been either. Once the veil is lifted, A and B are distinct. A does not experience B's gain.
  *   **The "Extra Work":** The argument smuggles in **Utilitarianism** by assuming that the "society" is a single super-agent. Harsanyi accepts this; Rawls and Nozick reject it. The move from "I would choose this for myself" to "This is morally right for the group" is not a logical deduction; it is a substantive moral claim that individual boundaries don't matter fundamentally.

  **Worry 3: The Measurement Problem (Interpersonal Comparison)**
  *   **The Step:** Step 4 (The Aggregation Premise).
  *   **The Conflation:** Ordinal vs. Cardinal Utility.
  *   **The Analysis:** You are right to be suspicious. Standard decision theory only requires that I can rank my own preferences (Ordinal). To add your wellbeing to mine, we need **Cardinal Unit Comparability**. We need to know not just that I prefer A to B, but that my gain from A is "twice as big" as your gain from C.
  *   **The "Extra Work":** Harsanyi's theorem *requires* this comparability to work. Without it, the "sum" is meaningless (like adding meters to kilograms). Modern social choice theory (following **Amartya Sen**) treats this as a major hurdle. The blogs usually gloss over this by assuming "wellbeing" is a single measurable currency (like QALYs in health economics), but philosophically, this is a heavy lift.

  #### 3. One Technical Correction: Average vs. Total
  You noted the argument concludes we should maximize the **sum** (Total Utilitarianism). However, Harsanyi's formal result actually derives **Average Utilitarianism**.
  *   Behind the veil, your probability of being any specific person is $1/N$.
  *   Your Expected Utility = $\frac{1}{N} \times (\text{Sum of Everyone's Utility})$.
  *   To maximize this, you maximize the **Average**.
  *   To get **Total** Utilitarianism (maximize the sum regardless of $N$), you need additional assumptions about population ethics. The blogs you read are likely slopping these two together, which matters if policies change the population size (e.g., immigration or reproductive policy).

  ### Summary of the Carving

  | Step | Claim | Status |
  | :--- | :--- | :--- |
  | **1. Veil** | Impartiality requires ignorance of identity. | Widely accepted (Rawls & Harsanyi agree). |
  | **2. Probability** | Assign equal probability ($1/N$) to being anyone. | Controversial. (Rawls argues this is unjustified risk-assessment under deep uncertainty). |
  | **3. Rationality** | Maximize Expected Utility (Risk Neutrality). | **Major Pivot Point.** If you assume Risk Aversion, you get Egalitarianism (Rawls). If Risk Neutral, you get Utilitarianism (Harsanyi). |
  | **4. Aggregation** | Summing utilities across people is valid. | **Major Pivot Point.** Requires Interpersonal Comparability (Sen's objection). |
  | **5. Normativity** | Rational Choice = Moral Truth. | **Major Pivot Point.** Denies the Separateness of Persons (Nozick's objection). |

  **Verdict:** The argument is **Harsanyi's Utilitarianism**. It is a valid *deduction* **if** you accept the assumptions. However, your three worries identify exactly where the assumptions are doing the heavy lifting.
  1.  **Lottery Objection:** Reveals the assumption of Risk Neutrality over life outcomes.
  2.  **Single Person Objection:** Reveals the assumption that Society is a Super-Person (denial of Separateness of Persons).
  3.  **Measurement Objection:** Reveals the assumption of Cardinal Interpersonal Comparability.

  The blogs are presenting a formal theorem (Harsanyi) but treating its controversial ethical premises as neutral facts of rationality. You are right to feel that the argument proves more than it should; that is because it packs substantive ethical commitments (Utilitarianism) into the definition of "rational choice."
