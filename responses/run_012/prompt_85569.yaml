answer: |-
  Your hypothesis is correct, but it requires sharpening to explain why the impasse is so resistant to resolution. The disagreement over incommensurability is not merely a verbal dispute about the word "meaning," nor is it a substantive disagreement about historical facts. It is a **metaphilosophical divergence regarding the function of semantic theory itself.** The parties are indeed answering different questions, but they are doing so under the assumption that they are answering the same one.

  Here is the diagnosis of the impasse, the analysis of the *vis viva* case, and the assessment of what could constitute progress.

  ### The Diagnosis: Reference vs. Role

  The core of the stalemate is that the critics and the proponents are operating with incompatible theories of reference, yet they treat the dispute as if it were about the history of science.

  The critics (the "communication" party) generally rely on a causal or referential theory of meaning. For them, the meaning of a term is anchored in its ability to pick out objects or properties in the world. If Newton and Einstein both used the word "mass" to talk about the same physical stuff (however imperfectly), then communication occurred, and the theories are comparable. On this view, a theory of meaning is a device for explaining how language hooks onto the world. If the hook holds, translation is possible in principle, even if clumsy.

  The proponents (the "knowledge" party) rely on a holistic or inferential-role theory of meaning. For them, the meaning of a term is constituted by its relationships to other terms within the theoretical network. If the laws governing "mass" change, the term itself changes, regardless of whether it points to the same physical substrate. On this view, a theory of meaning is a device for describing the cognitive state of the speaker. If the network changes, the meaning changes, and direct translation fails because the structural slots do not align.

  When the critics say, "Scientists understood each other well enough to argue," they are pointing to successful reference. When the Kuhnians say, "They were talking past each other," they are pointing to divergent inferential roles. Both observations are historically accurate, but they are incompatible only if one assumes that reference and role must coincide. The impasse persists because neither side accepts the other's criterion for what counts as "understanding."

  This makes the disagreement **substantive but mislocated.** It is substantive because it concerns the nature of rationality and scientific change. It is mislocated because it is fought over translation cases (data) that both sides interpret differently based on their prior semantic commitments. The critics treat translation failures as pragmatic difficulties; the proponents treat them as evidence of conceptual discontinuity.

  ### The *Vis Viva* Case: Dissolution or Confirmation?

  The *vis viva* controversy (mv vs. mv²) is often cited as a counterexample to incommensurability because it was resolved. However, a closer look suggests it is actually a paradigm case of **local incommensurability resolved by lexical differentiation.**

  During the dispute, both sides used the term "force" (or *vis*). They agreed on the phenomena but disagreed on the mathematical description. If incommensurability were a global barrier to comparison, they could not have argued. They did argue, which supports the critics. However, the resolution did not come from one side translating their terms into the other's vocabulary successfully. It came from **splitting the concept.**

  The dispute was defused only when the scientific community introduced a new taxonomy that distinguished momentum (mv) from kinetic energy (mv²). In doing so, they acknowledged that the original term "force" was lexically overloaded—it tried to do too much work in the old framework. The resolution required a new language, not a translation of the old one.

  This bears directly on the contemporary impasse in two ways:

  1.  **It validates the Kuhnian claim of lexical change:** The fact that a new distinction was *necessary* to resolve the conflict implies that the old vocabulary was insufficient to capture the distinction. The old term "force" was incommensurable with the new pair "momentum/energy" because it lacked the structural differentiation required by the new theory.
  2.  **It undermines the Self-Refutation charge:** The critics argue that you cannot claim incommensurability without a neutral language. But in *vis viva*, the neutral language (the new taxonomy) was the *result* of the scientific work, not the *precondition* for it. The scientists did not stand outside the dispute to solve it; they worked through the conflict until a new vocabulary emerged that made the old conflict look verbal.

  Therefore, the *vis viva* case suggests that incommensurability is not a permanent barrier to communication, but a temporary state of lexical instability that is resolved by conceptual innovation, not translation. This supports Kuhn's later view: incommensurability is local (specific terms like "force" or "mass"), and it is overcome by becoming "bilingual" or developing a new taxonomy, not by finding a perfect translation manual.

  ### The Nature of the Division

  The sides are divided over **what an explanation of scientific change has to accomplish.**

  *   **The Critics** want an explanation that preserves the continuity of rationality. They need to show that scientists are always arguing about the same things, otherwise, science looks irrational or merely sociological. For them, incommensurability threatens the normative status of science.
  *   **The Proponents** want an explanation that accounts for the discontinuity of discovery. They need to show that revolutions involve seeing the world differently, otherwise, scientific change looks like mere accumulation. For them, the denial of incommensurability threatens the historical reality of paradigm shifts.

  Because these are normative goals rather than empirical claims, no amount of historical data will settle the dispute. If you show a text where scientists misunderstand each other, the critics will call it a performance error. If you show a text where they understand each other, the proponents will call it superficial agreement. The data is underdetermined by the metaphilosophical commitments.

  ### What Counts as Progress?

  Given this diagnosis, a verdict on "who is right" is the wrong goal. Progress in this seminar should not aim to settle the dispute but to **dissolve the false dichotomy** that sustains it.

  **1. A Change of Question**
  Progress would look like shifting the question from "Can the theories be translated?" to "How do scientists learn to move between theories?"
  Translation implies a static mapping between two fixed languages. Learning implies a cognitive process of acquisition. If we treat incommensurability as a learning problem rather than a logical problem, the self-refutation charge loses its bite. One does not need a neutral standpoint to learn a second language; one needs immersion and practice. Kuhn's "bilingual practitioner" is not a logical contradiction but a cognitive achievement. Progress here would involve integrating cognitive science or psychology of concepts to explain how a scientist manages to hold two conflicting definitions of "mass" in mind without confusion.

  **2. A Distinction between Comparability and Translatability**
  You should press the distinction that the *vis viva* case illuminates: **Comparability does not require Translatability.**
  Two theories can be compared (we can see that one predicts phenomena the other misses) without every term being translatable. The critics conflate the ability to judge one theory better than another with the ability to translate one theory into the other. If students can accept that we can evaluate competing frameworks without a perfect dictionary, the "self-refutation" argument collapses. We compare frameworks by their problem-solving effectiveness, not by their semantic overlap.

  **3. Evidence of Lexical Structure**
  Empirical progress would come from analyzing how scientists actually read texts from dead frameworks. Do they read them as "wrong" (same meaning, false claim) or as "different" (different meaning, inapplicable claim)?
  If historical analysis shows that scientists treat past terms as *homonyms* rather than *errors* (e.g., treating phlogiston not as "oxygen but wrong" but as "a different category entirely"), this supports the incommensurability thesis. If they treat them as errors, it supports the critics. This moves the debate from intuition to textual evidence.

  ### Conclusion for the Seminar

  The impasse exists because the debate is functioning as a proxy for a deeper anxiety about scientific rationality. The critics fear that incommensurability makes science irrational; the proponents fear that denying it makes history invisible.

  To move your students, you should argue that the *vis viva* episode demonstrates that incommensurability is real but not fatal. It is a signal that the current vocabulary is exhausted. The "resolution" was not a translation but a conceptual differentiation. Therefore, the dispute is not about whether communication is possible (it is), but about the *cost* of that communication. The cost is that one cannot simply map the old terms onto the new; one must restructure the taxonomy.

  Progress in your seminar will not come from deciding the winner. It will come from recognizing that "incommensurability" is not a claim that scientists cannot talk to each other. It is a claim that they cannot talk to each other *without changing the subject.* If they can accept that distinction, the parallel conversations may finally merge.
