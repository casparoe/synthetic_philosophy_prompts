answer: |-
  **Project Title:** Authority Over the Future Self: Authorship, Stewardship, and the Jurisdiction of Advance Directives

  **1. Statement of the Question**

  The ethical conflict surrounding advance directives (ADs) in dementia care is typically framed as a clash between precedent autonomy and current well-being. When a person previously directed that life-sustaining treatment be withheld in advanced dementia, but later expresses contentment and a will to live during that state, whose wish prevails? Standard debates stall on the metaphysical question of personal identity: is the dementia patient the "same person" who wrote the directive?

  This project proposes that the identity question is a red herring. The core normative problem is not *who* the later self is, but *what authority* the earlier self claimed over her. I posit that authority in advance planning operates under two distinct models: **Authority as Authorship**, where the earlier self writes the narrative script of a life, and **Authority as Stewardship**, where the earlier self acts as a trustee protecting interests the later self may not comprehend.

  The precise research question is: *Does the validity of an advance directive depend on an authorship model or a stewardship model of authority, and how does this distinction resolve conflicts when the later self rejects the directive?* Furthermore, I will investigate a specific jurisdictional twist: when the later self's rejection is causally shaped by the condition the directive was meant to guard against (e.g., dementia-induced happiness), should this be treated as a rival preference or a challenge to the earlier self's jurisdiction?

  **2. Existing Positions and the Theoretical Gap**

  Current bioethical literature generally occupies three positions, none of which adequately resolve the tension without relying on contested metaphysics.

  First, the **Autonomy-Based Defence** (often associated with Dworkin) argues that critical interests established while competent bind the future. This relies heavily on the Authorship model but struggles to explain why a happy, suffering-free later self should be sacrificed for a narrative consistency they no longer value. It risks treating the later self as a mere vessel for the earlier self's ideals.

  Second, the **Welfare or Current-Interests Objection** (often associated with Dresser) argues that we must prioritize the experiential interests of the person in front of us. This aligns with a Stewardship model focused on current welfare. However, it fails to account for the intuitive wrongness of dissolving binding commitments simply because one's preferences change. If any change of heart voids a directive, the concept of "advance" planning loses its force.

  Third, the **Identity-Based Middle Ground** suggests that if the psychological connection is severed, the earlier self loses authority. While this explains the intuition that the "person is gone," it leads to problematic policy outcomes. It implies that severe cognitive decline automatically voids legal and moral commitments, creating a perverse incentive structure and failing to distinguish between different types of authority claims.

  The gap lies in the conflation of Authorship and Stewardship. Proponents of ADs often argue from Authorship (narrative integrity) but defend against objections using Stewardship (protecting you from harm). Opponents argue from Stewardship (current happiness) but dismiss ADs using Identity (you are not the same). By splitting authority into these two distinct modes, we can assess whether the earlier self had the standing to make the specific claim they made. An AD might be valid as an Authorship claim (e.g., "do not let me live as a vegetable") but invalid as a Stewardship claim (e.g., "do not give me pleasure"), or vice versa. Existing frameworks lack the granularity to make this distinction.

  **3. Methodology**

  This project will employ **conceptual analysis** supported by a **battery of constructed cases**. This is a philosophical inquiry into normative authority, not a descriptive study of patient preferences.

  *Why Conceptual Analysis?*
  Empirical surveys (e.g., asking clinicians or families what they would do) cannot answer the normative question of what *should* be done. Similarly, a straight appeal to autonomy assumes the conclusion—that autonomy extends beyond competence—which is precisely what is in dispute. We need to dissect the logic of the authority claim itself.

  *The Case Battery:*
  I will construct a series of vignettes where Authorship and Stewardship come apart. These will not be empirical case studies but thought experiments designed to isolate variables.
  1.  **The Consistent Script:** The earlier self directs no treatment; the later self is distressed by treatment. (Authorship and Stewardship align).
  2.  **The Happy Dissenter:** The earlier self directs no treatment; the later self is happy and wants treatment. (Standard conflict).
  3.  **The Conditioned Rejection:** The earlier self directs no treatment to avoid indignity; the later self wants treatment, but only because the disease has removed their capacity to feel indignity. Here, the rejection is shaped by the condition.
  4.  **The Trustee Failure:** The earlier self directs treatment based on false beliefs about the condition (e.g., believing dementia is painful when it is not). Here, Stewardship fails even if Authorship is clear.

  *Analyzing Jurisdiction:*
  For each case, I will analyze the later self's rejection not as a preference ("I want X") but as a jurisdictional challenge ("You don't get to decide for me"). I will test whether jurisdiction can be assessed without settling personal identity. For example, does the earlier self retain jurisdiction over "dignity" even if they lose jurisdiction over "happiness"?

  **4. Expected Results and Failure Conditions**

  *Successful Outcome:*
  The project will produce a framework distinguishing Authorship-based ADs from Stewardship-based ADs. I aim to show that ADs are robust when grounded in Authorship (narrative closure) but vulnerable when grounded in Stewardship (welfare prediction), particularly when the later self's condition undermines the epistemic basis of the stewardship.
  Regarding the "Conditioned Rejection," I hypothesize that if the later self's preference is causally dependent on the pathology the AD was meant to guard against, the rejection lacks jurisdictional force. It is not a valid challenge to authority because the capacity to challenge authority has been compromised by the very threat the authority was established to manage. This allows us to uphold the AD without asserting that the later self is a "different person."

  *Failure Conditions:*
  The project fails if:
  1.  The distinction between Authorship and Stewardship collapses under analysis (e.g., if all Authorship claims reduce to Stewardship interests).
  2.  The jurisdictional assessment inevitably requires a metaphysical verdict on personal identity, proving the user's hunch wrong.
  3.  The framework yields no actionable guidance for clinical ethics committees beyond "it depends."

  **5. Scope and Timeline (Six Months, 0.2 FTE)**

  This is a small-scale theoretical project designed for one day of work per week over six months.

  *Month 1: Refinement of Models.*
  Detailed definition of Authority as Authorship vs. Stewardship. Mapping these onto existing bioethical literature to ensure the distinction is novel and not merely terminological.
  *Deliverable:* Annotated conceptual map.

  *Month 2-3: Case Construction and Testing.*
  Developing the battery of 4-6 constructed cases. Stress-testing them against counter-arguments (e.g., what if the earlier self was depressed? What if the later self is only momentarily happy?).
  *Deliverable:* Case bank and preliminary analysis notes.

  *Month 4: The Jurisdictional Twist.*
  Focusing specifically on the "Conditioned Rejection." Drafting the argument for why pathology-shaped preferences might lack jurisdictional standing.
  *Deliverable:* Draft of the core argument section.

  *Month 5: Drafting the Paper.*
  Assembling the analysis into a coherent manuscript (approx. 8,000 words).
  *Deliverable:* Full first draft.

  *Month 6: Revision and Submission.*
  Peer review (informal), polishing, and targeting a journal (e.g., *Bioethics* or *Journal of Medical Ethics*).
  *Deliverable:* Final manuscript ready for submission.

  *What is Left Out:*
  *   **Legal Comparative Analysis:** I will not examine specific legal jurisdictions (e.g., UK Mental Capacity Act vs. US State laws). This is a normative ethical project, not a legal one.
  *   **Empirical Data:** No interviews with caregivers or patients.
  *   **Broad Taxonomy of Dementia:** I will treat "dementia" as a general category of cognitive decline affecting identity/values, rather than distinguishing between Alzheimer's, vascular dementia, etc., unless medically crucial to a specific case.
  *   **Other Psychiatric Conditions:** While the logic might apply to depression or psychosis, the scope is limited to dementia to keep the project manageable.

  **6. Researcher's Confidence Statement**

  **Confidence Level:** High.
  The distinction between Authorship and Stewardship offers a promising resolution to a stalemate that has persisted for decades. It aligns with intuitive judgments about promises (Authorship) versus welfare (Stewardship) without requiring metaphysical commitments about the soul or psychological continuity.

  **Least Certain Point:**
  The claim that we can assess **jurisdiction without settling personal identity**. While I argue that authority types can be distinguished independently of identity, there is a risk that "jurisdiction" is merely identity by another name. If the later self lacks jurisdiction because they are "too changed," have I not simply reintroduced the identity problem under a normative label? Resolving this without slipping back into metaphysics is the project's greatest philosophical risk.
