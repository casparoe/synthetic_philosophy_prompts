answer: |-
  Good evening, everyone. One hundred years. That's a lot of dry summers, a lot of wet ones, and a lot of meetings in halls just like this. I'm honored to be standing here. As many of you know, I spent thirty years chasing water tables for a living. Now that I'm retired, I've taken up a new hobby: trying to understand why people do what they do. I read a lot of philosophy books. Most of them are nonsense, but some of them remind me of what we already know out here in the fields.

  For most of this association's history, when the rain stopped, we made a deal. We'd agree to pump less. And mostly, we did. We didn't have meters on every pipe. We didn't have fines. We had handshakes. The young man from the university tells me that was naive. He says human nature is to cheat if you can get away with it. He says we need rules and penalties because everyone is secretly waiting to stab their neighbor in the back for a bumper crop.

  But I look at our history, and I don't see that. I see something else.

  I think for most of those hundred years, nobody really *wanted* to cheat. Not because we're saints, but because we're neighbors. If I pump extra water today, I get a better crop this year. But next year, I have to look at you at the co-op. My kids play with your kids. If I break the deal, I break the trust. And in a small town, broken trust is more expensive than water.

  So, the problem wasn't usually greed. It was fear. It was the worry that *you* might pump, so if I don't pump, I'm just the sucker who lost his crop for nothing. We were all willing to hold back, but only if we were sure everyone else was holding back too. When we could see each other's fields, when we knew who was planting what, that fear went away. We could relax.

  But lately, the ground has shifted under us. Literally.

  Ten years ago, a few of our members invested in deep boreholes. Smart business. I'd probably do the same in their shoes. But it changes the game. For those farms, the shallow aquifer dropping isn't as dangerous. The temptation to pump more is real now in a way it wasn't before. And then we added the trading scheme, where water rights can be bought and sold. That's clever, too. But it makes the water invisible. In the old days, I knew if you were pumping because I saw your pivot turning. Now, water moves on paper, and pipes run underground.

  This brings me to the question we need to answer tonight. Are we dealing with greed, or are we dealing with fear?

  If the problem is greed—if people are genuinely tempted to cheat regardless of what the rest of us do—then the university boy is right. We need meters. We need fines. We need to turn this association into a police force.

  But if the problem is fear—if everyone is willing to cooperate but just needs to know that everyone else is doing the same—then meters and fines are the wrong medicine. Punishment tells us we don't trust each other. And once you say that out loud, you make it true.

  So, which is it? I don't know for sure. I can't read minds. But I know what worked for a century. Visibility worked. Knowing our neighbors worked. The deep wells and the trading schemes have made the water invisible again, and when water becomes invisible, trust becomes hard.

  My advice isn't to bring in the cops. It's to turn the lights back on.

  If we're going to have trading, let's make every trade public knowledge at the next meeting. If we have deep wells, let's acknowledge that they change the balance, and maybe those farms need to show us their numbers voluntarily, not because they're suspected of cheating, but because they're proving they're still part of the team. We need to make restraint visible again. We need to know, without doubt, that when we hold back, our neighbors are holding back too.

  We can solve this with rules, sure. But rules are cold. They keep the water in the ground, but they might drive the neighborliness out of this valley. I'd rather we solve this by making sure no one has to be afraid of being the only one keeping the promise.

  Here's to the next hundred years. May the rain be kind, and may we always know where we stand with each other. Thank you.
