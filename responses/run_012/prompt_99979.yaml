answer: |-
  The chair was too high. That was the first thing Elara noticed when she took Mrs. Gable's seat eight months ago. The Assembly Chamber was a converted bank lobby in the center of Marrow, all marble and echoing acoustics, and the forty desks were arranged in a shallow crescent facing the river windows. Elara sat in seat twenty-four. She kept Mrs. Gable's nameplate in her drawer. On the desk, she placed a small card that read *Elara Vance (Reserve)* in typewriter font.

  It felt like a library book that was overdue.

  Today, the air in the chamber smelled of floor wax and anxiety. The proposal on the docket was the Aethelgard Chemical lease. A representative from the company, a man in a suit that cost more than Elara's annual stipend, stood at the podium.

  "We are asking for a twenty-year operational permit," he said. His voice was calibrated, smooth. "In exchange, Aethelgard guarantees three hundred permanent jobs. We are planting a flag in Marrow. We are betting on your future."

  Elara looked around the crescent. Thirty-nine other people. A baker, a retired nurse, a graduate student, a mechanic. None of them had campaigned. None of them had raised money. They were here because a machine had spat out their names. But Elara? She was here because the machine had spat out Mrs. Gable's name, and Mrs. Gable's brain had burst like a ripe fruit three days before the swearing-in.

  Elara was the reserve. The understudy. The clerical error made flesh.

  "The lease term is the issue," said Kael, the Assembly's randomly selected Facilitator for the month. He was twenty-two and looked terrified. "The Charter states that all Assembly mandates expire after one calendar year. To prevent the tyranny of the dead hand over the living."

  "We understand the Charter," the Aethelgard man said, smiling tightly. "But industry requires stability. You can renew the permit annually. We just need the initial twenty-year commitment."

  Elara rested her hand on the voting console. It was a simple box: Green, Red, Abstain.

  For eight months, she had waited for the feeling of legitimacy to arrive. She had read the briefing books in her apartment, the one she shared with her sister. She had listened to the testimony. She had learned the bylaws. But every morning, she woke up waiting for a letter telling her she'd been caught. *Sorry, wrong Elara Vance. Sorry, Mrs. Gable recovered. Sorry, the system crashed.*

  She looked at the Aethelgard man. He was speaking the language of the old world. The world of elections, of campaigns, of permanence. He was trying to buy a future that didn't belong to them.

  A hand went up. It was Marcus, the mechanic. "If we vote yes, and next year's Assembly votes no, what happens to your twenty-year commitment?"

  "Legal arbitration," the man said. "We would sue the city."

  A murmur ran through the desks. The Charter was specific. The Assembly could not bind its successors. That was the whole point. If you could bind the future, you were a politician, not a citizen. You were building a legacy, not solving a problem.

  Elara felt a shift in her chest. It wasn't confidence. It was a sudden, cold clarity.

  The theorists argued about where the power came from. Was it the randomness? The idea that any soul was as worthy as any other? Or was it the deliberation? The idea that regular people, when forced to listen, would find the common good?

  Elara thought it was neither.

  She looked at her name card. *Reserve.* She was the backup plan for the random plan. She was the accident on top of the chance. If legitimacy came from the Draw, she had none. She was a ghost in a chair. But if legitimacy came from the *severance*—the act of being ripped from your private life and forced to hold the weight of the town without the armor of a party or the promise of reelection—then she was the most legitimate person in the room.

  She hadn't asked for this. She couldn't keep this. In four months, her term would expire. The names would be drawn again. Mrs. Gable's seat would go back into the drum. Elara would go back to restoring maps, tracing old coastlines that no longer existed.

  The Aethelgard man wanted to turn the river into a monument. He wanted to lock the flow of Marrow into a concrete channel for two decades. He wanted to steal the agency of the people who would sit in these chairs next year.

  Elara realized that her imposter syndrome was actually the system working as intended. She felt like a fraud because power *should* feel foreign to a private citizen. If it felt comfortable, you were a politician.

  "Ms. Vance?" Kael said. "You have the floor."

  She hadn't raised her hand. She stood up anyway. The marble floor was cold through her shoes.

  "You're asking us to mortgage a future we can't see," Elara said. Her voice didn't echo; the room swallowed it. "You say you're betting on Marrow. But you're not betting on us. You're betting on the idea that we're too cowardly to change our minds."

  "That's not—" the man started.

  "The Charter expires," Elara said. "Not because we are indecisive. But because we refuse to pretend we know what next year needs. A twenty-year lease is a lie. It's a promise that the people of 2034 will agree with the people of 2024. We don't have the right to make that promise."

  She looked at the Green button. It promised jobs. It promised stability. It promised the comfort of knowing the bill was paid.

  She looked at the Red button. It promised uncertainty. It promised that next year, forty new people would have to wake up, read the briefings, and decide again. It was harder. It was inefficient. It was exhausting.

  "That is why I was chosen," Elara said, though she knew it wasn't true technically. "Or why I am here. To remind you that this chair is temporary. The power is borrowed. You cannot build a permanent monument on borrowed time."

  She sat down. She didn't wait for debate. She pressed Red.

  One by one, the lights on the Facilitator's board turned red. The baker. The nurse. The student. They were all people who had been taken from their lives. They all knew what it was to hold something valuable that you couldn't keep.

  The vote was 38 to 2. The lease was denied.

  The Aethelgard man packed his briefcase, his jaw tight. He looked at Elara as he passed her row. "You'll regret this. When the jobs don't come."

  "Maybe," Elara said. "But it won't be my regret to carry. It'll be theirs." She gestured to the empty seats, the ones waiting for next year's lottery.

  When the session adjourned, Elara walked out into the humid river air. She took the name card out of her pocket—*Elara Vance (Reserve)*—and dropped it into the trash can on the corner.

  She wasn't a ghost. She was a placeholder, and a placeholder's job is to keep the seat warm until the next person arrives. She had kept it warm. She had refused to let anyone nail the chair to the floor.

  She walked toward the bus stop. In four months, she would be nobody again. The thought didn't frighten her anymore. It felt like the only honest thing left in the world.

  ***

  **Author's Note on Theoretical Liberties**

  In writing this, I took significant liberties with how sortition is typically theorized and implemented. First, the "Reserve" system is largely fictional; in real-world proposals (like Citizens' Assemblies in Ireland or France), if a member drops out, they are usually replaced by a new random draw from the original pool or a waiting list, but the narrative weight given to the "substitute" status here is a dramatic invention. Real sortition advocates argue that the *initial* randomization provides the statistical representativeness; a reserve stepping in doesn't theoretically dilute that, but I leaned into the protagonist's feeling of illegitimacy to explore the psychology of power.

  Second, the "Sunset Clause" on all decisions is a radical interpretation. While sunset clauses exist in legislation, the idea that *every* decision expires after a year and must be re-argued by a new body is not standard democratic theory, even among sortition proponents. Most propose sortition for a specific legislative chamber that works alongside a permanent constitution or executive branch. I exaggerated this to create the central conflict: the incompatibility between the "temporary" nature of the citizen and the "permanent" nature of industrial capital. Finally, I took a stance that the "burden" of temporary power confers legitimacy, whereas many theorists argue legitimacy comes from the *descriptive representation* (the body looking like the population) rather than the psychological state of the members.
