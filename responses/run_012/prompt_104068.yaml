answer: |-
  The air in Sector 4 tasted of yeast and wet concrete. It was a warm smell, dense and comforting, though Elara's Calibrator flagged it as particulate-heavy, sub-optimal for long-term respiratory health. She adjusted the strap of the device on her wrist and walked down the corridor. The walls were grey, seamless, and worn smooth by the brush of a billion sleeves.

  Elara was an Auditor from the Upper Reaches. Her mandate was simple: assess the welfare density of the new expansion zones. She carried the sum of human potential in her head, and the Calibrator carried the metrics. According to the charts on her wrist, the people living here were starving. They were deprived of art, of variation, of political agency, of the horizon. Their lives were short, capped at forty cycles, and their days were identical loops of maintenance labor and rest.

  By every objective measure of flourishing, this was a wasteland.

  She stopped at a communal feeding station. A man sat alone, stirring a bowl of grey paste. He wore the standard tunic, faded at the elbows. He looked up as she approached, not with fear, but with a mild, open curiosity. His eyes were clear. There were no lines of worry on his forehead.

  "Mealtime?" Elara asked. It was a stupid question. It was always mealtime here.

  "The nutrient block is warm today," the man said. He smiled. It was a genuine smile, reaching the corners of his eyes. "Makes a difference."

  Elara tapped her Calibrator. The screen flashed red: *Dietary Variety: Critical Failure. Sensory Stimulation: Negligible.*

  "I'm conducting a welfare audit," Elara said. "I need to ask you about your satisfaction levels."

  "I am satisfied," the man said. He took a spoonful of the paste. "I am Kael."

  "Kael, do you ever feel... constrained? By the walls? By the routine?"

  Kael paused, spoon halfway to his mouth. He considered this, not as a grievance, but as a puzzle. "The walls keep the wind out. The routine means I know when to sleep. Why would I want the wind in?"

  "But you don't create anything. You don't choose your work. You don't know what lies beyond the sector."

  Kael swallowed. "I know my work is done when the light dims. I know my friends are at the next table. I know the paste is warm. What is beyond the sector?"

  "Choices," Elara said. The word felt heavy in her mouth. "Possibilities."

  Kael tilted his head. He looked at her wrists, bare of the standard tunic, exposed to the cool air. He looked at the Calibrator, with its blinking lights and complex readouts. Then he looked at her face.

  "You look tired," Kael said softly.

  Elara flinched. It was a reflex. In the Upper Reaches, fatigue was a private failure, a sign of poor management of the self. "I work hard."

  "You carry a lot," Kael said. He gestured to the Calibrator, but his eyes were on hers. "All those numbers. Do they tell you what to eat? Do they tell you who to sit with?"

  "They tell me if life is good," Elara said.

  Kael laughed. It was a quiet sound, unburdened. "Life is good if you sleep well. I sleep very well here. No dreams. Just dark, and then light. You dream, Auditor?"

  Elara thought of her apartment in the Upper Reaches. The view of the clouds from above. The endless menu of options for dinner, for partners, for career paths. The paralysis of standing in a room full of doors, knowing you could open only one, and terrified that the wrong one would close the rest forever. She thought of the nights she spent scrolling through histories of lives she hadn't lived, ache pooling in her chest like cold water.

  "Sometimes," she said.

  "Then you are the deprived one," Kael said. He said it without malice. It was a diagnostic observation, like noting the rain. "You have too much space. It must be very cold."

  Elara stepped back. The Calibrator buzzed against her skin, registering a spike in her own cortisol. She silenced it.

  She walked away from the feeding station and out onto the observation deck. This was the part of the audit she dreaded. The view.

  Below her, the housing blocks stretched to the horizon. They were identical hexagons, packed tight like a honeycomb. There were no parks, no theaters, no statues. There was no noise of commerce, no shouting, no music. Just the low hum of ventilation and the quiet movement of people going from point A to point B.

  It was a moral catastrophe. That was the word her supervisors used. *A catastrophe of potential.*

  Looking out over the sea of grey tunics, Elara felt the weight of the wasted genius. Somewhere in those blocks, there were minds that could have composed symphonies, but would never hear a violin. There were bodies that could have run marathons, but would never see a forest. There was love, surely, but it was bounded by the shift schedule. It was a world of ceiling-low skies. No one here would ever break through the atmosphere. They would live and die knowing only the yeast and the concrete.

  She raised her wrist to log the finding. *Subjective Report: High Contentment. Objective Metric: Critical Deprivation.*

  If she filed the report as it stood, the Upper Reaches would halt the expansion. They would say it was unethical to propagate lives that lacked the capacity for higher flourishing. They would say that to be born here was to be harmed, even if the harm was felt as comfort.

  But if she filed the report, the growth would stop. The total sum of happiness would cap. The billions who would have been born here, warm and full and sleeping without dreams, would never exist. In their place, there would be fewer people in the Upper Reaches—people like her, standing on balconies, shivering in the cold wind of their own freedom, counting their choices like coins they couldn't spend.

  A group of children ran past on the walkway below. They were playing a game of tag. They weren't competing for status; there were no prizes. They were just running. Their laughter drifted up, thin and bright. They looked healthy. They looked safe. They looked like they belonged to the world they were in.

  Elara looked at her hand. It was trembling. She had everything. She could go anywhere. She could be anyone. And she was standing here, envying a man who ate grey paste and slept without dreams.

  The Calibrator prompted her: *FINAL ASSESSMENT REQUIRED. CLASSIFY WELFARE STATUS.*

  There were two options. *Flourishing.* Or *Survival.*

  If she chose *Flourishing*, she validated the ceiling. She admitted that a life without art, without discovery, without the terror of the unknown, was enough. She admitted that the Upper Reaches might be the mistake, not the Sector.

  If she chose *Survival*, she condemned them. She declared their contentment a lie. She said that Kael was wrong about his own life, that the metric knew him better than he knew himself. She saved them from the stagnation, but she erased them from the future.

  Below, the light began to dim. The shift was ending. People were flowing back into the hexagons. The hum of the ventilation shifted pitch, a lullaby for the machine.

  Elara watched a woman stop to help a child tie a shoe. The woman didn't check a clock. She didn't look worried about being late. She just waited. The child finished, patted the woman's cheek, and ran on. The woman stood up and walked into the grey block. She disappeared into the warm, yeast-scented dark.

  Elara's finger hovered over the screen. The cursor blinked. It was a small, rhythmic pulse, like a heartbeat.

  Above her, the sky of the Upper Reaches was visible through the atmospheric shield. It was a deep, bruised purple, full of stars that nobody down here knew existed. It was beautiful. It was empty.

  Elara lowered her hand. She didn't press the button. She just stood there, holding the weight of the sum, watching the lights go out one by one in the honeycomb, wondering if the dark was a cage, or a blanket.
