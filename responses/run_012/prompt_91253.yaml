      *   *Section 3 (Recantation):* It was a shift in formulation (B) and a softening of the criterion (C). He realized "testable" doesn't have to mean "conclusively refutable in one blow." Cost: Blurs the sharp line.
      *   *Section 4 (Lesson):* Duhem-Quine makes strict falsification impossible for mature theories. Falsifiability is a matter of degree. Link to Lakatos: Popper's MRP is the precursor to Lakatos's Hard Core.
