prompt: |-
  I write the physical-sciences desk at a mid-sized general-interest magazine, and I keep having the same fight with my freelancers and my copy desk. Our house style has no rule for the hardest verb in our business: the verb to be, applied to things nobody has ever seen. One week a writer files that dark matter is a particle that has so far escaped detection; the next week a different writer files that the inflaton field would be the cause of the primordial fluctuations; a third treats the wave function as pure bookkeeping and gets an angry letter from a reader accusing us of philosophical cowardice; and a fourth, covering the Casimir effect, tells readers that virtual particles popping in and out of the vacuum push two plates together, which my most physics-literate contributor insists is close to a category error. I have come to think this is not a style question but an epistemological one, and that the sharpest available frame for it is the standoff between the no-miracles argument for scientific realism and the pessimistic meta-induction, together with the structural-realist compromise that tries to keep the mathematics while letting go of the furniture. What I want from you is not an essay on that debate but something my desk can actually run at deadline.

  Please write me a reusable decision procedure — a set of questions to ask in order, what counts as a sufficient answer to each, where the procedure terminates in a flat no, and where it must hand the sentence to a human because the remaining question is one of editorial values rather than of evidence. It needs to be executable in about ten minutes by a writer who has no philosophy training, it has to end in one of four house verdicts that I can put in the margin of a draft — assert, attribute, hedge, or flag as model — and it should be honest about which of its steps are real discriminations and which are judgment calls wearing a lab coat. I do not want a reading list or citations; assume the writer knows the words but not the arguments. Then run the procedure, showing the marginal verdict at each step, on three cases: the dark-matter particle; the inflaton field, where the entity is defined almost entirely by its role in a theory we cannot yet test directly; and the virtual particles invoked to explain the Casimir effect, where I suspect the honest verdict is one my readers and several of my writers will hate. Include at least one case where the procedure returns an answer I personally dislike — I have my own prejudices about which popular entities are respectable — and say plainly what the procedure cannot do: where it will misfire, which kinds of entity it has no grip on, and why it should not be allowed to turn every sentence in the magazine into a hedge.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Physical-sciences desk editor at a mid-sized general-interest magazine.
      *   **Problem:** Inconsistent usage of the verb "to be" regarding unobservable theoretical entities (dark matter, inflaton, wave function, virtual particles). Conflict between writers, copy desk, and readers (realism vs. instrumentalism).
      *   **Goal:** A reusable decision procedure (checklist/flowchart style) for writers to determine how to phrase claims about unobservables.
      *   **Constraints:**
          *   Executable in ~10 minutes by a writer without philosophy training.
          *   Must result in one of four verdicts: *Assert, Attribute, Hedge, Flag as Model*.
          *   Must distinguish between real discriminations (evidence-based) and judgment calls (editorial values).
          *   Must include a "run-through" on three specific cases: Dark Matter particle, Inflaton field, Virtual particles (Casimir).
          *   Must include at least one case where the procedure yields a result the editor personally dislikes.
          *   Must explicitly state limitations (where it misfires, what it can't handle, why not to over-hedge).
          *   No reading list or citations.
      *   **Tone:** Professional, pragmatic, slightly weary but precise (matching the editor's voice), honest about epistemological limits.

  2.  **Deconstruct the Philosophical Underpinnings (for internal use):**
      *   *Scientific Realism (No-Miracles Argument):* Science works, so the entities must be real. Use "is."
      *   *Pessimistic Meta-Induction:* Past successful theories had false entities (ether, phlogiston), so current ones probably do too. Use "might be" or "according to."
      *   *Structural Realism:* The math/relations are real, the "furniture" (nature of the entity) is unknown. Use "model suggests."
      *   *Instrumentalism:* Theories are tools for prediction, not truth. Use "calculates to."

  3.  **Drafting the Decision Procedure:**
      *   Need a logical flow. Start with observation, move to consensus, then to theoretical necessity, then to alternative explanations.
      *   *Step 1: Direct Detection.* Can we touch it? (Verdict: Assert).
      *   *Step 2: Causal Isolation.* Is it the *only* explanation for a robust effect? (Verdict: Assert or Hedge).
      *   *Step 3: Consensus.* Do experts agree it exists vs. it's a calculation trick? (Verdict: Attribute).
      *   *Step 4: Mathematical Necessity vs. Ontological Commitment.* Is it required for the math to work, or just a way to visualize the math? (Verdict: Flag as Model).
      *   *Need to map these to the four specific verdicts:*
          *   **Assert:** "X is Y." (High confidence, direct/indirect detection robust).
          *   **Attribute:** "Scientists say X is Y." (Distancing from the claim).
          *   **Hedge:** "X appears to be Y" / "X may be Y." (Uncertainty acknowledged).
          *   **Flag as Model:** "In the standard model, X functions as Y." (Instrumentalist/Structuralist stance).

      *   *Refining the Steps for Speed:*
          1.  **Detection:** Is there a signal that cannot be explained without this entity?
          2.  **Consensus:** Is the entity's existence treated as fact or hypothesis in the relevant subfield?
          3.  **Independence:** Does the entity appear in multiple distinct experimental contexts?
          4.  **Mechanism:** Is the explanation dependent on a specific visualization (like "particles popping") that experts dispute?

  4.  **Developing the Three Test Cases:**
      *   **Case 1: Dark Matter Particle.**
          *   Detection: Gravitational effects yes, particle no.
          *   Consensus: Something is there, "particle" is the leading hypothesis but not proven.
          *   Verdict: *Hedge* or *Attribute*. Let's aim for *Hedge* ("appears to be") or *Attribute* ("proposed as"). Given the prompt's example ("escaped detection"), *Hedge* feels right.
      *   **Case 2: Inflaton Field.**
          *   Detection: None. Inferred from CMB.
          *   Consensus: Speculative.
          *   Verdict: *Attribute* or *Flag as Model*. Since it's defined by its role, *Flag as Model* fits the "structural realist" vibe.
      *   **Case 3: Virtual Particles (Casimir).**
          *   Detection: Effect is real, mechanism is debated.
          *   Consensus: Many physicists say "virtual particles aren't real."
          *   Verdict: *Flag as Model*. This is the one the editor/readers might hate (as requested).

  5.  **Addressing the "Editor's Prejudice" Constraint:**
      *   The prompt asks for one case where the procedure returns an answer the editor personally dislikes.
      *   *Idea:* The editor might like "Dark Matter is a particle" (Realist). The procedure might force "Dark Matter *might* be a particle" (Hedge).
      *   *Idea:* The editor might hate "Virtual particles are fake." The procedure forces "Flag as Model."
      *   *Decision:* I will make the Virtual Particle case the one that yields the "honest verdict" that readers/writers hate, and note that the editor might prefer a cleaner "Assert" but the procedure blocks it. Or, I can make the Dark Matter case the one where the editor wants to "Assert" but the procedure says "Hedge." Let's go with Dark Matter. It's the most common frustration. The editor wants to say "Dark Matter is..." but the procedure says "Hedge."

  6.  **Refining the Limitations Section:**
      *   Where does it fail? New paradigms, sociological shifts, entities that are "real" but not "objects" (fields vs particles).
      *   Why not hedge everything? Readability, trust, narrative flow.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Tone Check:* Needs to sound like a style guide written by a tired but sharp editor.
      *   *Structure:*
          1.  Introduction (acknowledging the problem).
          2.  The Procedure (The "Ontology Checklist").
          3.  The Verdict Definitions.
          4.  The Test Runs (Dark Matter, Inflaton, Virtual Particles).
          5.  Limitations & Warnings.

      *(Self-Correction during drafting)*: Make sure the distinction between "Attribute" and "Hedge" is clear.
      *   *Attribute:* "Physicists propose..." (Focus on the speakers).
      *   *Hedge:* "Dark matter is likely..." (Focus on the probability of the fact).
      *   *Flag as Model:* "The theory treats X as..." (Focus on the utility).

      *(Refining the Virtual Particles case)*: This is the tricky one. The Casimir effect is real. The explanation via virtual particles is a perturbative tool. The procedure needs to catch that distinction. Question: "Is the entity a calculation artifact?"

      *(Refining the "Editor's Prejudice" note)*: I need to explicitly state in the analysis: "I know you want to Assert this, but the procedure says Hedge."

  8.  **Final Review against Constraints:**
      *   10 mins execution? Yes, 4 questions.
      *   4 Verdicts? Yes.
      *   3 Cases? Yes.
      *   One disliked outcome? Yes (Dark Matter).
      *   Limitations section? Yes.
      *   No citations? Yes.

  9.  **Final Polish:** Ensure the voice is consistent. "Desk can actually run at deadline." "Judgment calls wearing a lab coat."

  *(Self-Correction on the "Disliked Outcome")*: The prompt says "Include at least one case where the procedure returns an answer I personally dislike." I should explicitly identify this in the output. I will choose Dark Matter, assuming the editor prefers the realist "is" for established consensus, but the procedure forces a hedge due to lack of direct detection.

  *(Wait, looking at the prompt again)*: "I suspect the honest verdict [for Casimir] is one my readers and several of my writers will hate." So the Casimir verdict *should* be the unpopular one. The "Editor's Prejudice" constraint is separate. I can make the Dark Matter one the Editor's personal dislike (Editor wants to be bold, procedure says be careful).

  Let's write it.cw
answer: |-
  # The Ontology Checklist: A Decision Procedure for Unobservables

  **Purpose:** To standardize how we use the verb *to be* regarding theoretical entities that lack direct observation.
  **Time Required:** 10 minutes per claim.
  **User:** Writers and Senior Editors.
  **Output:** One of four marginal verdicts: **ASSERT**, **ATTRIBUTE**, **HEDGE**, **FLAG AS MODEL**.

  ---

  ## Part I: The Verdicts

  1.  **ASSERT:** The entity is treated as fact. (e.g., "The electron *is* a lepton.")
  2.  **ATTRIBUTE:** The claim is assigned to the scientific community, not the magazine. (e.g., "Physicists *propose* that the axion *is*...")
  3.  **HEDGE:** The claim is presented as probable but unproven. (e.g., "Dark matter *appears to be*...")
  4.  **FLAG AS MODEL:** The entity is presented as a mathematical tool or structural necessity, not necessarily a physical object. (e.g., "In the standard formulation, the wave function *acts as*...")

  ---

  ## Part II: The Procedure

  Ask the following four questions in order. Stop at the first "Yes" or "No" that triggers a verdict. If you reach the end without a trigger, default to **ATTRIBUTE**.

  **Q1. Direct or Robust Indirect Detection?**
  Can we detect this entity's signature repeatedly across distinct experimental setups, such that removing the entity from the theory makes the data impossible to explain?
  *   *Yes:* **ASSERT**. (Example: Electrons, Black Holes pre-2019).
  *   *No:* Go to Q2.

  **Q2. Consensus on Existence vs. Utility?**
  If you asked ten experts in the specific subfield, "Does X exist?" would at least eight say "Yes," or would they say "It depends on what you mean by exist" / "It's a calculation trick"?
  *   *Eight say "Yes":* Go to Q3.
  *   *Eight say "It depends/Trick":* **FLAG AS MODEL**. (Example: Virtual Particles).
  *   *Split Decision:* **ATTRIBUTE**.

  **Q3. Independent Corroboration?**
  Does this entity appear in multiple, theoretically distinct contexts (e.g., cosmology *and* particle physics), or is it invoked to solve a single specific problem?
  *   *Multiple Contexts:* **HEDGE**. (Example: Dark Matter).
  *   *Single Problem:* **ATTRIBUTE**. (Example: Inflaton).

  **Q4. Is the "Mechanism" Visualizable?**
  Is the explanation relying on a visualization (particles popping, strings vibrating) that experts acknowledge is a metaphor for a mathematical operation?
  *   *Yes:* **FLAG AS MODEL**.
  *   *No:* **HEDGE**.

  ---

  ## Part III: Test Runs

  Here is the procedure applied to your three problem cases.

  ### Case 1: The Dark Matter Particle
  *Claim:* "Dark matter is a particle that has so far escaped detection."

  *   **Q1 (Detection):** We see gravitational lensing and rotation curves, but we have never detected the particle itself (no direct detection in xenon tanks, etc.). Removing "particles" allows for MOND (Modified Gravity) alternatives, though they struggle.
      *   *Answer:* No. (Proceed to Q2).
  *   **Q2 (Consensus):** Most agree *something* is there. Most agree "particle" is the leading hypothesis, but a significant minority argue for modified gravity.
      *   *Answer:* Split/Leaning Yes, but not 8/10 on "particle" specifically. (Proceed to Q3).
  *   **Q3 (Corroboration):** It appears in galactic rotation, CMB data, and cluster collisions (Bullet Cluster).
      *   *Answer:* Yes (Multiple Contexts).
  *   **Verdict:** **HEDGE**.
  *   *Marginal Note:* Change "Dark matter *is* a particle" to "Dark matter *is likely* a particle" or "The leading hypothesis *identifies* dark matter as a particle."
  *   *Editor's Dislike Check:* I know you want to **ASSERT** this because the evidence is overwhelming compared to alternatives. But because direct detection fails and MOND exists, the procedure forces a **HEDGE**. This is the cost of precision.

  ### Case 2: The Inflaton Field
  *Claim:* "The inflaton field would be the cause of the primordial fluctuations."

  *   **Q1 (Detection):** No direct detection. Inferred solely from CMB uniformity and spectral index.
      *   *Answer:* No. (Proceed to Q2).
  *   **Q2 (Consensus):** Inflation is popular, but the "inflaton" is a placeholder name for "whatever did inflation." Many theorists view it as a phenomenological construct.
      *   *Answer:* "It depends."
      *   *Verdict:* **FLAG AS MODEL**.
  *   *Marginal Note:* Change "The inflaton field *would be* the cause" to "In inflationary models, the inflaton field *functions as* the driver of..."
  *   *Rationale:* The entity is defined entirely by its role in the math. We do not know its furniture.

  ### Case 3: Virtual Particles (Casimir Effect)
  *Claim:* "Virtual particles popping in and out of the vacuum push two plates together."

  *   **Q1 (Detection):** The Casimir force is real. The "particles" are not detected.
      *   *Answer:* No. (Proceed to Q2).
  *   **Q2 (Consensus):** Ask a QFT expert: "Are virtual particles real objects?" They will say "No, they are terms in a perturbation series."
      *   *Answer:* "It's a calculation trick."
      *   *Verdict:* **FLAG AS MODEL**.
  *   *Marginal Note:* Change "Virtual particles... push" to "The quantum field equations predict a pressure difference that manifests as..." or "In the standard visualization, virtual particles..."
  *   *Rationale:* This is the verdict your readers will hate. It removes the "popping" imagery. But the procedure identifies this as a category error. To **ASSERT** this is to publish a known falsehood according to the practitioners.

  ---

  ## Part IV: Limitations and Warnings

  **Where This Procedure Misfires**
  1.  **The "New Paradigm" Blind Spot:** This checklist is conservative. It protects us from error, but it will also stifle reporting on speculative breakthroughs. If a writer is covering a legitimate but fringe theory that solves a major problem (e.g., early string theory), this procedure will force them to **ATTRIBUTE** or **FLAG**, potentially making the science look weaker than the mathematical elegance suggests.
  2.  **Sociological Shifts:** Consensus (Q2) is a sociological metric, not an ontological one. If the majority of physicists are wrong (as they were about the ether in 1890), this procedure codifies their error as **ASSERT** or **HEDGE**. It tracks confidence, not truth.
  3.  **Fields vs. Particles:** The procedure struggles with entities that are real but not "things" (e.g., fields, spacetime curvature). Writers may force **FLAG AS MODEL** on fields because they aren't "particles," even if fields are more real than particles. Use editorial judgment to ensure "Field" doesn't automatically trigger "Model."

  **Why Not Hedge Everything?**
  If you apply **HEDGE** or **FLAG** to every sentence, the magazine reads like a legal disclaimer. "Electrons *appear to* orbit nuclei, which *may* be surrounded by clouds..." This erodes reader trust. We use **ASSERT** for the "furniture" of science that is stable enough to build a narrative upon. Use the procedure to find the load-bearing walls; do not use it to inspect the paint.

  **The Judgment Call**
  Q2 (Consensus) is the weakest link. It requires the writer to gauge expert opinion, which they may do poorly. If a writer is unsure, they must escalate to you. This is not a failure of the writer; it is the point where epistemology becomes editing. When the procedure hands you a sentence because the writer cannot gauge consensus, you are no longer checking facts; you are deciding how much certainty our brand can afford to sell.

  **Final Instruction:**
  Paste this checklist into your style guide under "Theoretical Entities." Require writers to attach the completed checklist to any draft containing the words *field, particle, wave function, dark, virtual,* or *inflation*. If the checklist is missing, the copy desk returns the draft.
