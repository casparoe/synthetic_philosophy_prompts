answer: |-
  The practice strictly presupposes that health outcomes are commensurable across persons and tradable against limited resources to optimize allocation, but it treats the cost-effectiveness threshold as a pragmatic policy decision rather than a moral discovery, functioning identically regardless of whether objective moral facts exist.

  The load-bearing presuppositions are structural, not metaphysical. First, **commensurability**: the practice requires that different health states across different people can be mapped onto a single scalar value (the QALY). Without this, aggregation is impossible. Second, **substitutability**: it presupposes resources spent on Treatment A are unavailable for Treatment B, creating a trade-off where money can legitimately be exchanged for health units. Third, **maximization**: the existence of a cutoff implies a goal function, typically maximizing total health benefit subject to a budget constraint. These are operational requirements; the system collapses without them. However, the practice does not strictly presuppose *why* these values hold. It is compatible with utilitarianism, prioritarianism, or contractualism, provided they accept interpersonal comparison and scarcity.

  Regarding the Quinean metaethical question, the cutoff is a **decision**, not a discovery. In a Quinean framework, ethics is engineering: you select ends (e.g., "maintain a solvent health system that extends life") and empirically determine the means. The threshold is a parameter calibrated to balance budget sustainability against health output, similar to a safety factor in bridge construction. It does not track a Platonic "true value of life" because no such fact is required to make the calculus work. The practice would run exactly the same if moral anti-realism were true; the administrators are not detecting moral particles, they are managing constraints. Moral realism offers a justificatory narrative (that the threshold *approximates* true value), but the machinery of allocation does not depend on that narrative being true.

  The anomalies you note—banning kidney sales and overspending on rescue cases—reveal that the practice is a **local norm** rather than a comprehensive moral theory. The QALY system governs bureaucratic allocation under scarcity, but it operates within a wider normative ecosystem that includes deontological side-constraints (no commodification of bodies) and agent-relative duties (the duty to rescue an identified victim). These exceptions do not invalidate the QALY presuppositions; they simply bound the domain where those presuppositions apply. The system presupposes that *within the domain of population-level funding*, efficiency is the dominant virtue, while acknowledging other virtues dominate elsewhere.

  If you swapped in a different theory, the consequences would vary by type. If you swapped in **moral realism**, nothing operational would change; you would simply claim the threshold discovers rather than sets value, adding metaphysical baggage to the engineering. If you swapped in **strict deontology** (e.g., Kantianism), the practice would break, because treating life-years as fungible quantities tradable against money violates the categorical imperative regarding human dignity. If you swapped in **radical subjectivism** (where no interpersonal comparison is possible), the practice would also break, as the QALY scale would lose its meaning. Thus, the practice is robust to realism vs. anti-realism debates, but fragile against theories that deny commensurability or the legitimacy of trade-offs.
