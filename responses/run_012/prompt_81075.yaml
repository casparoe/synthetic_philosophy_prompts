prompt: |-
  Okay, so I've been reading about how health systems decide which treatments to pay for, and I've gotten stuck on something.

  The practice: an agency works out the cost per quality-adjusted life-year for a treatment — you take a year of life, weight it by how good that year is, and they actually survey people to get those weights — and then it pays for stuff below some cutoff and says no above it. So there's effectively a price on a year of healthy life. But the same systems won't let you sell a kidney, and when a specific named person is in danger — trapped in a mine, on the news, everyone watching — they'll spend sums that blow way past the cutoff, sometimes on one person. And nobody treats that as a scandal exactly.

  So what does this practice presuppose about value? That health states are comparable across people on one scale? That a year of life is a quantity you can trade against money? That value is measurable at all?

  And here's whats really bugging me. I've been reading Quine, and as far as I can tell he treats ethics as more like engineering than like science — you settle on ends, then reason about means — and I'm not even sure he'd say moral claims are the kind of thing that can be true or false. If that's right, is the cutoff a discovery or a decision? Does the practice need moral facts to be real, or would it run exactly the same either way?

  Please be careful to separate what the practice strictly presupposes from what it just fits comfortably with — I suspect several different theories of value would all be fine with it, and I want to know which parts are actually load-bearing. Then say what would have to change if you swapped in a different theory.

  Bottom line in the first sentence, then the reasoning. No preamble, no restating my question.
