answer: |-
  You have stumbled upon one of the most famous problems in modern moral philosophy. Your nine verdicts map almost perfectly onto the tensions between **Utilitarianism** (maximize good), **Deontology** (duties/promises), and **Common Sense Morality** (special obligations/identifiable victims).

  Your friend suspects you are rationalizing because your verdicts rely on psychological distinctions (like whether you can see the victim's face) rather than moral ones (like the amount of good done). However, your intuitions are not random; they are structured.

  Here is a principle that yields your nine verdicts, followed by an analysis of its stability, the verdict you should likely abandon, and the answer to your sponsorship case.

  ### The Principle: Prioritized Proximate Rescue

  **You are morally required to prevent grave harm to another person if and only if:**

  1.  **Identifiability:** The victim is **identifiable** and the peril is **proximate** (either physically immediate or causally direct to a specific individual), *and*
  2.  **Cost Threshold:** The cost to you does not threaten your own life, vital health, or **core projects** (defined as risks > 1/100 of death, or funds earmarked for dependents), *and*
  3.  **Priority of Obligation:** The act does not violate a **pre-existing special obligation** (family or explicit promise) that holds higher priority than general rescue, *and*
  4.  **Non-Free-Riding:** You must contribute your fair share to a rescue effort even if the outcome is overdetermined by others, provided the cost remains below the Cost Threshold.
  5.  **Fault Irrelevance:** The victim's negligence does not negate the duty.

  ---

  ### How This Principle Yields Your Nine Verdicts

  1.  **Drowning Child (Coat/Phone):** Identifiable (1); Cost is financial, not vital (2); No conflict (3). **Verdict: Required.**
  2.  **Drowning Child (30 Bystanders):** Identifiable (1); Cost is financial (2); **Clause 4 (Non-Free-Riding)** mandates you participate in the moral labor even if redundant. **Verdict: Required.**
  3.  **Identifiable Charity (Name/Photo):** Identifiable (specific child) (1); $200 is below Cost Threshold (2); No conflict (3). **Verdict: Required.**
  4.  **Statistical Charity (General Fund):** **Fails Clause 1.** The victim is not identifiable; the link is statistical/probabilistic. **Verdict: Not Required.**
  5.  **Risk (1/1000):** Identifiable (1); Risk is below the 1/100 threshold (2). **Verdict: Required.**
  6.  **Risk (1/5):** Identifiable (1); **Fails Clause 2.** Risk exceeds the threshold for "reasonable sacrifice." **Verdict: Not Required.**
  7.  **Dying Mother:** Identifiable (1); Cost is emotional/time (2); **Fails Clause 3.** You have a pre-existing special obligation (promise/filial duty) that overrides general rescue. **Verdict: Not Required.**
  8.  **Own Child's Operation:** Identifiable (stranger) (1); **Fails Clause 2 & 3.** Money is earmarked for a dependent (core project/special obligation). **Verdict: Not Required.**
  9.  **Faulty Adult:** Identifiable (1); Cost is low (2); **Clause 5** negates fault as an excuse. **Verdict: Required.**

  ### The Test Case: The Sponsorship Scheme

  **The Case:** A scheme hands you the name and photograph of one child at a time, out of a queue of thousands. $200 saves each.

  **The Verdict:** According to the principle above, **you are required to participate.**

  **Why:** This case satisfies Clause 1 (Identifiability: you have a name and photo), Clause 2 (Cost: $200 is below the catastrophic threshold), and Clause 3 (No conflicting special obligation). The fact that there is a "queue of thousands" makes it structurally similar to Case 4 (Statistical), but the mechanism of delivery (one named child at a time) triggers the Identifiability clause of Case 3.

  **The Trap:** If you feel hesitation here, your friend is right. This case reveals that your distinction between Case 3 (Specific Child) and Case 4 (General Fund) is fragile. In the sponsorship scheme, the *moral reality* is identical to the General Fund (you are saving a life from a pool of need), but the *psychological presentation* is identical to the Specific Child. If you refuse the sponsorship, you admit that identifiability is a bias, not a principle. If you accept it, you move closer to your friend's view.

  ### Which Verdict Should You Give Up?

  To achieve true philosophical consistency, you must break the tension between **Case 3** (Specific Charity = Required) and **Case 4** (General Charity = Not Required).

  **You should give up the distinction between Case 3 and Case 4.**

  **Reasoning:**
  The distinction between an "identifiable victim" and a "statistical victim" is widely regarded by ethicists (such as Peter Singer, Thomas Schelling, and Joshua Greene) as a cognitive bias, not a moral truth.
  *   **The Argument:** If $200 saves a life in Case 3, and $200 saves a life in Case 4, the *consequence* is identical. The fact that one child has a name and the other does not changes nothing about the suffering prevented or the good achieved.
  *   **The Cost:** If you align these two, you must either make *both* required (accepting a more demanding morality) or *both* optional (accepting a less heroic one). Given your verdict on Case 1 (the pond), you clearly believe in a duty to rescue. Therefore, logic demands you make Case 4 **Required**.

  **Secondary Tension:**
  There is a smaller tension between **Case 2** (Redundant Rescue) and standard efficiency. If 30 people are saving the child, your coat is sacrificed for *no marginal gain*. A strict consequentialist would say you are not required to ruin your coat if the child is already saved. However, this is defensible as a "Duty of Fair Play" (don't let others bear the burden alone), so you may keep this verdict if you value solidarity over efficiency.

  ### Is Your Friend Right?

  **Yes, but only partially.**

  Your friend is right that you are **rationalizing regarding Charity (Cases 3 & 4).**
  The "Identifiable Victim Effect" is a known psychological phenomenon where we feel more empathy for a single named individual than for a "mass" of people. Basing a moral principle on this is building a house on a cognitive bias. It allows you to feel virtuous about saving the named child (Case 3) while withholding money from the general fund (Case 4) where it might actually be *more* effective.

  **However, your friend is likely wrong regarding Family (Cases 7 & 8).**
  Most moral frameworks (including Contractualism and Virtue Ethics) defend **Special Obligations.** You are permitted to prioritize your dying mother or your own child over a stranger. This is not rationalization; it is a recognition that human morality is built on relationships, not just calculus. If you gave up these verdicts to be "consistent" with a strict utilitarian view, you would be adopting a principle that most people (including your friend, likely) would find alienating and inhuman.

  ### Summary Advice

  1.  **Adopt the Principle:** Use the "Prioritized Proximate Rescue" principle above to organize your thoughts. It validates your intuitions about family, risk, and fault.
  2.  **Accept the Challenge:** Apply the principle consistently to the **Sponsorship Scheme**. You must pay the $200. To refuse is to contradict your verdict on the named child in Case 3.
  3.  **Concede the Point:** Admit to your friend that the distinction between the **Named Charity** and the **General Fund** is indefensible. You should treat them the same. Since you believe you must save the drowning child in the pond (Case 1), consistency requires you to save the statistical child in the general fund (Case 4) if the cost is comparable ($200 vs. Coat/Phone).
  4.  **Hold the Line:** Defend your right to stay with your dying mother (Case 7). That is not rationalization; that is the boundary where the duty to humanity yields to the duty of love.

  You are not irrational; you are a moral pluralist struggling to balance competing duties. But the "Identifiable Victim" loophole is the one place where your logic leaks. Plug that, and your position becomes robust.
