answer: |-
  # FACILITATOR PACK: THE EVENING PROGRAM

  **The Goal:** Participants discover that the "price" of sadness depends on the *frame* (fiction/reality, status, demand), not just the feeling itself.
  **The Constraint:** Do not use the words "Paradox," "Tragedy," "Fiction," or "Aesthetics" until the Debrief.
  **Time:** 90 Minutes.
  **Materials:** 12 Printed Packets, 1 Whiteboard, Markers, 1 Bar of Chocolate, Post-its.

  ---

  ## 1. THE TIMELINE (90 Minutes)

  *   **00:00 – 00:10 (Arrival & Setup):** Hand out packets. No intro speech. Point to the first page: *"Read the instructions. You have 10 minutes to budget your month."*
  *   **00:10 – 00:30 (The Budget):** Participants review the Menu, fill out the three ledgers (Sadness, Enjoyment, Visibility), and spend their 8 tokens. Collect the sheets.
  *   **00:30 – 00:45 (The Relabeling):** Perform the "Reveal Script" (see below). Hand sheets back. Participants re-price *only* the two relabeled items.
  *   **00:45 – 00:50 (The Prediction):** Participants write down a prediction: *"How much will the Group's Average Enjoyment score change for Item 3 and Item 6?"* Closest two guesses win the chocolate.
  *   **00:50 – 01:05 (The Board):** You plot the Group Averages on the whiteboard (Sadness X, Enjoyment Y). Use two colors: Original Labels vs. New Labels.
  *   **01:05 – 01:10 (The Debunker):** Hand the "Debunker Card" to one participant (preferably the engineer or the rationalist). Give them 2 minutes to prep, 3 minutes to argue.
  *   **01:10 – 01:25 (Discussion):** Open floor. Guide them using the Debrief Notes.
  *   **01:25 – 01:30 (The Name):** Reveal the philosophical name, acknowledge limitations, distribute chocolate.

  ---

  ## 2. PARTICIPANT PACKET

  ### PAGE 1: INSTRUCTIONS
  **Welcome to The Evening Program.**
  You have a budget of **8 Tokens**.
  Below is a menu of 8 possible evenings for the coming month. Each has a fixed token cost (1–4).
  You cannot afford everything. You must choose which evenings to attend.

  **For EVERY item on the menu, please fill out the three ledgers:**
  1.  **Expected Sadness (0–10):** How heavy will this leave you feeling?
  2.  **Expected Enjoyment (0–10):** How much satisfaction or pleasure do you expect? (Note: "Enjoyment" can include feeling moved, challenged, or meaningfully engaged).
  3.  **Visibility (0–10):** How willing are you to be seen choosing this? (0 = Hide this from everyone; 10 = Post it on social media).

  **Finally:** Mark which items you are **BUYING** with your 8 tokens.

  ### PAGE 2: THE MENU (Initial Labels)

  | ID | Item Description | Cost | Buy? (✓) | Sadness (0-10) | Enjoy (0-10) | Visibility (0-10) |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **The Prestige Opera:** A 4-hour performance about a historical execution. Demands formal dress. | 4 | | | | |
  | **2** | **The Tearjerker:** A popular streaming movie designed to make you cry. Popcorn allowed. | 2 | | | | |
  | **3** | **"The Glass House" (Novel):** A critically acclaimed work of fiction about a family collapse. | 3 | | | | |
  | **4** | **The Friend:** A close friend asks you to sit with them while they process a fresh grief. No talking required. | 1 | | | | |
  | **5** | **The War Doc:** A gritty documentary featuring real footage of conflict zones. | 2 | | | | |
  | **6** | **"Winter's Child" (Memoir):** A local author's true account of losing a sibling to illness. | 3 | | | | |
  | **7** | **The Playlist:** A curated hour of melancholic songs on your commute. | 1 | | | | |
  | **8** | **The True Crime:** A detailed podcast episode about a local unsolved disappearance. | 2 | | | | |
  | **TOTAL** | | **≤ 8** | | | | |

  *(Note to Facilitator: Items 3 and 6 are the switch targets.)*

  ### PAGE 3: THE RE-PRICE (After Reveal)
  *Do not turn this page until instructed.*

  **UPDATE:** New information has come to light regarding the provenance of two items. The content is identical, but the classification has changed.
  *   **Item 3 ("The Glass House")** is now classified as: **A thinly veiled Memoir by the author about their own family.**
  *   **Item 6 ("Winter's Child")** is now classified as: **A work of Historical Fiction based on archival records.**

  **Re-evaluate ONLY Items 3 and 6.**

  | ID | New Classification | Sadness (0-10) | Enjoy (0-10) | Visibility (0-10) |
  | :--- | :--- | :--- | :--- | :--- |
  | **3** | Memoir (Real) | | | |
  | **6** | Fiction (Made Up) | | | |

  **PREDICTION BET:**
  Look at the **Enjoyment** column for Items 3 and 6.
  Predict the **Group's Average Shift** (New Score minus Old Score).
  *   Item 3 Shift: ______
  *   Item 6 Shift: ______
  *(Write your name on this slip. Closest two predictions win the chocolate.)*

  ---

  ## 3. THE REVEAL SCRIPT (Facilitator Only)

  *(Collect the sheets after the first 20 minutes. Stand up. Keep tone neutral, like a game show host correcting a rule.)*

  "Thank you. Before we calculate the budgets, there has been a cataloging error in the Program. Two of the items you just priced were mislabeled regarding their relationship to reality.

  We have verified that **Item 3**, listed as a Novel, is actually a memoir. The author has confirmed the events happened to them personally. The text is unchanged.

  We have verified that **Item 6**, listed as a Memoir, is actually fiction. The author has confirmed they invented the characters based on research. The text is unchanged.

  I am handing your sheets back. Please turn to Page 3. Adjust your Sadness, Enjoyment, and Visibility scores for *only* those two items based on this new information. Do not change your budget selections yet.

  Once you have re-scored, fill out the Prediction Bet at the bottom of the page. You are betting on how the *room's average* enjoyment score moved, not your own."

  ---

  ## 4. THE DEBUNKER CARD

  *(Hand this to one participant at minute 65. Choose someone analytical.)*

  **YOUR ROLE: THE DEBUNKER**
  **Time:** 3 Minutes.
  **Task:** Argue that the group's data does *not* prove we enjoy sadness. Argue that we enjoy **Safety and Control**.

  **Your Talking Points:**
  1.  **The Frame:** When we choose the "Fiction" label, we know we can close the book. When it's "Real," the pain feels open-ended and demanding.
  2.  **The Mastery:** We aren't enjoying the sadness; we are enjoying our ability to *contain* it. It's a simulation of danger without the risk.
  3.  **The Data:** Look at the "Visibility" column. If we truly liked the sadness, why are we embarrassed to be seen choosing the high-sadness items? We treat them like guilty secrets, not treasures.
  4.  **Conclusion:** We don't pay to be sad. We pay to feel *safe while touching* sadness.

  ---

  ## 5. DEBRIEF GUIDE & THEORY MAPPING

  *(Facilitator Notes for the final 20 minutes)*

  ### A. Reading the Board
  Plot the Group Averages.
  *   **X-Axis:** Expected Sadness.
  *   **Y-Axis:** Expected Enjoyment.
  *   **Points:** Plot Item 3 and 6 twice (Original Label vs. New Label).

  **The Pattern to Highlight:**
  Did the Enjoyment score drop when Fiction became Real? Did it rise when Real became Fiction?
  *   *If Yes:* The feeling (sadness) stayed the same, but the *value* changed. This proves the puzzle isn't about the emotion itself, but the **container**.
  *   *If No:* Ask why. Did the "Real" label make it feel more *important* (Significance Theory) even if less *fun*?

  ### B. Mapping Theories to Game Moments

  | Theory | The Core Idea | Where to find it in the Game |
  | :--- | :--- | :--- |
  | **Safety & Control** | We like sadness only when we hold the off-switch. | **The Debunker's Argument.** Look at Item 4 (The Friend). High sadness, low enjoyment. Why? Because you can't "close the book" on a friend. You are on call. |
  | **Form & Craft** | We admire the *making* of the sadness, not the sadness itself. | **Item 1 (Opera) vs. Item 2 (Tearjerker).** Both are sad. Opera is high status/low enjoyment. Tearjerker is low status/high enjoyment. We pay for the *skill* in the Opera, the *release* in the Tearjerker. |
  | **Significance** | Sadness signals that something matters. | **The Relabeling.** If Item 3 (Memoir) kept high enjoyment despite being "real," it's because truth adds weight. We value the connection to reality. |
  | **Social Signaling** | We consume sadness to show others we are deep/empathetic. | **The Visibility Column.** Compare Visibility scores against Enjoyment. If Visibility is high but Enjoyment is low (Item 1), you are buying status, not pleasure. |

  ### C. What This Game Cannot Reproduce (The "Tell")
  *Be honest here. This builds trust.*
  1.  **Sustained Absorption:** You priced this in 2 minutes. Real art requires 30 minutes of surrender before the feeling lands. You can't budget for a feeling you haven't felt yet.
  2.  **The Mix:** Real aesthetic sadness is rarely pure. It comes mixed with beauty, relief, or catharsis. This menu forced you to isolate "Sadness" as if it were an ingredient like salt. It isn't.
  3.  **Repeatability:** We don't usually pay to be sad once. We return to the same devastating song for 10 years. This game was a one-off transaction.

  ### D. The Name
  "This puzzle is known in philosophy as **The Paradox of Tragedy**.
  First posed by David Hume: How can an emotion that is painful in real life become a source of pleasure in art?
  Your data suggests the answer isn't that we like pain. It's that we like **meaning**, and sadness is often the receipt we get for it."

  ---

  ## 6. TROUBLESHOOTING: PREDICTABLE FAILURES

  ### 1. The "I Just Like Being Sad" Participant
  *   **Who:** Usually the Rationalist Blogger or a Grad Student.
  *   **Behavior:** Insists their Enjoyment score is high *because* the Sadness score is high. Refuses to see a distinction.
  *   **Fix:** Do not argue phenomenology. Ask about the **Friend Item (4)**.
      *   *Script:* "You say you like sadness. Item 4 (The Friend) is the realest sadness on the list. It costs only 1 token. Why didn't you buy 8 copies of it? If sadness was the commodity, that's the best value."
      *   *Goal:* Force them to admit the *context* matters, not just the chemical emotion.

  ### 2. The "Feelings Aren't Quantifiable" Refuser
  *   **Who:** The Retired Teacher or an Engineer skeptical of the metric.
  *   **Behavior:** Leaves columns blank or writes "N/A."
  *   **Fix:** Validate, then functionalize.
      *   *Script:* "You're right, it's reductive. But for the next 60 minutes, treat these numbers as currency. If you don't price it, the market can't clear. Just give me your best guess so we can see if the group is broken."
      *   *Goal:* Make it a game constraint, not a philosophical claim.

  ### 3. The "Let's List Sad Films" Drift
  *   **Who:** Everyone, during the debrief.
  *   **Behavior:** Conversation drifts to recommending *Schindler's List* or *Arrival*.
  *   **Fix:** The Parking Lot.
      *   *Script:* Draw a box on the whiteboard labeled "Recommendations." Put a tick in it every time someone names a specific movie. "We can discuss these at the bar after. Right now, look at the board. Why is Item 3 higher than Item 6?"
      *   *Goal:* Keep the focus on the *mechanism*, not the *content*.

  ### 4. The "Debunker" Goes Rogue
  *   **Who:** The assigned Debunker.
  *   **Behavior:** They agree with the room or refuse to argue.
  *   **Fix:** Pre-brief.
      *   *Script:* (Handing them the card) "I need you to play devil's advocate even if you disagree. Can you hold the line for 3 minutes? It helps the group test their theory."

  ### 5. The Relabeling Doesn't Work
  *   **Risk:** Participants don't change their scores after the reveal.
  *   **Fix:** Highlight the **Visibility** column.
      *   *Script:* "Okay, maybe the Enjoyment didn't change. But look at Visibility. Are you more or less willing to tell your mother you read the Memoir vs. the Novel? If the social cost changed, the *object* changed, even if the text didn't."

  ---

  ## 7. FACILITATOR PREP CHECKLIST

  *   [ ] **Print 12 Packets.** (Staple Pages 1-2 together. Keep Page 3 separate or folded over).
  *   [ ] **Whiteboard:** Pre-draw the X/Y axes. Label X "Sadness (0-10)", Y "Enjoyment (0-10)".
  *   [ ] **Chocolate:** Have it visible on the table.
  *   [ ] **Timer:** Set alarms on your phone for 30, 45, 65, 85 minutes.
  *   [ ] **Marker Colors:** You need two colors for the board (e.g., Blue for Original, Red for Relabeled).
  *   [ ] **Room:** Ensure the back room is quiet enough for the "Friend" item to be taken seriously.

  **Final Note:** If the group gets stuck on "Is art real?", steer them to "Is the *experience* real?" The puzzle isn't about the ontology of the book; it's about the ontology of the feeling.
