  You are a philosopher of mathematics with specialist command of the incompleteness theorems and the anti-mechanist literature (Lucas, Penrose, and their critics). Think carefully before answering, and begin by stating how you parse the target claim, since a number is meaningless until the claim is fixed.

  Target claim: "Human mathematical understanding is not computable — there is a uniform human capacity that, for any consistent formal system M, delivers a truth of arithmetic that M cannot prove." I want your credence that this is true, understood as a disjunction over the best available Lucas-style and Penrose-style arguments.

  Give me a number, then decompose it, with a rough probability and one line of justification for each term:
  (i) the Gödelian core: that a consistent M cannot prove its own G, while a suitably placed human can recognise G's truth;
  (ii) the self-consistency problem: that the human can know M is consistent without the argument collapsing into an infinite hierarchy of ever-stronger systems, each needing its own consistency certified from outside;
  (iii) the idealisation premise: that the human's recognition is reliable and uniform enough to be a capacity rather than a string of lucky insights;
  (iv) the generalisation premise: that outrunning this machine entails outrunning every machine, rather than merely inviting the mechanist to name a successor;
  (v) whether "grasping" a Gödel sentence is determinate enough to carry any weight at all.

  Show how the terms combine, name the one your final number is most sensitive to, and say what argument or evidence would move it most.
