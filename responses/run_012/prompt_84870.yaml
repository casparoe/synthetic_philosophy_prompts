      *   **Goodhart's Law:** "When a measure becomes a target, it ceases to be a good measure." The user's friend (sociologist) alludes to this.
      *   **Ontology of Social Facts:** Is a crime a crime if not recorded? (Realism vs. Constructivism).
      *   **Epistemic Consistency:** Can you treat data as objective truth for internal allocation but subjective noise for external criticism?
      *   **Function of Metrics:** Are they descriptive (archive) or performative (scoreboard)?
