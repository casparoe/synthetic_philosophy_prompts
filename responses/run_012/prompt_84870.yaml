      *   **Body Paragraph 2 (The Function):** Discuss the dual role (scoreboard vs. archive). This is the source of the incoherence. You can't optimize for history and future simultaneously without tension. The "gaming" is a rational response to conflicting incentives.
      *   **Body Paragraph 3 (The Coherence):** Is it incoherent to treat numbers as gospel sometimes and noise others? Yes, strictly speaking. But pragmatically, it's a necessary fiction. The practice presupposes stability it knows doesn't exist.
      *   **Body Paragraph 4 (The Solution/Reframing):** What does fixing the data mean? It's not about finding the "true" number, but about stabilizing the *process* of counting. Audits aren't about truth, they're about consistency of construction.
      *   **Closing:** Reassure the user. They are the custodian of the fiction, which is a vital role.

