      Subject: Re: The numbers game

      Hi there

      It sounds like you are not just tired of the meetings but rather bumping up against the structural limits of what performance management can actually do. You asked what the practice strictly presupposes, and I think the uncomfortable answer is that it presupposes a stability it knows it cannot guarantee. The system needs to believe that the numerator and denominator are distinct entities that meet by chance, like rain hitting a bucket, but in your work the bucket is often moved to catch more or less rain depending on whether the mayor is watching. Strictly speaking, the practice requires a realist ontology where the city's problems exist independently of the agency's paperwork, because without that assumption the budget allocations are just funding arbitrary paperwork habits rather than social needs. But functionally, the practice operates on a constructivist reality where the only problems that exist are the ones that survive the intake process. You are living in the gap between those two modes.

      When you ask whether there is a real rate behind the count, for a city agency the answer has to be no, or at least not one you can access. A robbery that is never filed is not a robbery your agency can solve, so for the purpose of your dashboard it is ontologically distinct from a filed robbery. The sociologist friend is right that the measure changes the thing, but in government the measure often creates the thing. If you stop counting a category, the resources vanish, the training stops, and the behavior literally disappears from the city's operational reality. So the practice does not need the assumption that the measured is indifferent to being measured. It actually relies on the opposite, even if it rhetorically claims otherwise. The incoherence you feel comes from the fact that you are asked to speak the language of realism when you are building the budget and the language of constructivism when you are defending the annual report.

      This dual language is not logically consistent, but it is pragmatically necessary. To treat the number as gospel in the budget meeting is to commit to a course of action, and action requires a temporary fiction of certainty. To treat the number as noise when criticized is to acknowledge the fragility of that fiction. The practice survives not because it resolves this tension but because it manages the timing of it. You are allowed to be a realist in January when plans are made and a constructivist in December when results are reviewed. What makes this sustainable rather than corrupt is whether the redefinitions are transparent and consistent across time. If the change-control rule is broken constantly, the trend line dies, and you are left with only cross-sectional comparisons which are far easier to game. The audits and independent re-coding you mentioned are not pointless, but their job is not to find the truth. Their job is to enforce the rules of the construction. They ensure that everyone is building the same fiction in the same way, which is the only kind of integrity available to you.

      So to answer your question about what fixing the data means, it means stabilizing the definitions even when the outcomes are ugly. It means accepting a bad number rather than a redefined one, because the bad number preserves the link between the metric and the reality it approximates. If you fix the definition to make the number look better, you sever the link entirely. The practice is underdetermined in the sense that several theories could license the meetings, but only one allows the agency to learn. If you assume the number is the reality, you learn nothing when the number changes. If you assume the number is a tool that shapes reality, you can ask whether the shaping is useful. You are not just recording the city; you are participating in its administration. The fatigue you feel is the weight of holding that distinction in your head while everyone else in the room pretends it does not exist. You are the custodian of the measurement fiction, and that is a vital role even if it feels like sophistry. Keep asking the question, because if you stop chewing on it, the numbers will start to lie without anyone noticing.

      Best

