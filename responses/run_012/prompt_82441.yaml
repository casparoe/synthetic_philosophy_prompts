          2.  Force the separation using the case (Wisdom Teeth).
          3.  Introduce the accounts as tools to answer specific questions, not definitions of "function" itself.
          4.  Show the cost of each.
          5.  Stop before resolving the "real" function.
      *   *Misconceptions:*
          *   "Function = what it does" (Causal reductionism).
          *   "Selection = Intention" (Teleology).
          *   "Vestigial = Functionless" (The key wedge).
          *   "Multiple functions = Bad question" (Pluralism).
      *   *Closing:* The medicine question. Is it good? It tests the etiological commitment (dysfunction = failure of selected effect). But maybe too applied? The prompt asks me to evaluate it. I think it's strong but needs to be framed carefully so it doesn't look like "medicine is right therefore philosophy is settled."
      *   *Diagnostic Question:* Needs to be scenario-based.

  3.  **Drafting - Section by Section (incorporating constraints):**

      *   *Tone:* Colleague to colleague. Dense, practical, authoritative but collaborative.
      *   *Format:* Continuous prose. No breaks.
      *   *Content:*
          *   Start with the room setup (whiteboard).
          *   The Case: Wisdom Teeth (Third Molars). Why? Everyone has an intuition. It separates history (diet) from current role (often none/harm).
          *   Case Constraints: Must be a trait that *exists* but whose *selection history* is distinct from its *current causal contribution*. Must not be a case where one account clearly wins (e.g., don't use a clearly adaptive trait like the heart). It must show the *cost* of each view. If you pick Causal Role, wisdom teeth have a function (grinding) or dysfunction (impaction). If you pick Etiological, they have a function (ancestral grinding) even if they hurt now.
          *   The Three Questions: Write them on the board immediately. 1. What is the trait for? 2. Why is the trait there? 3. What does the trait now do?
          *   Sequence:
              1.  Ask for "Function of Wisdom Teeth." Get the muddled answer.
              2.  Force them to answer the three questions separately.
              3.  Show that Q2 (History) and Q3 (Current) diverge.
              4.  Introduce Etiological as answering Q2 + Q1 (normative). Introduce Causal Role as answering Q3.
              5.  Address Misconceptions.
                  *   "Function = what it does": Head this off at step 2.
                  *   "Selection = Intention": Head this off when discussing Q2. Emphasize backward-looking history, not forward-looking goal.
                  *   "Vestigial = Functionless": This is the big one. Etiological says it *had* a function, maybe still does if defined historically. Causal says it might have a new one or none.
                  *   "Multiple functions": Address this as a feature, not a bug.
              6.  The Stop Point: Stop before deciding which account is "true." Stop at the cost.
              7.  The Medicine Question: Evaluate it. It's good because "dysfunction" implies a norm. If a heart pumps blood but wasn't selected to (e.g. artificial), is it dysfunctional? If wisdom teeth hurt, are they dysfunctional?
              8.  Diagnostic Question: Needs to test the distinction. "If we engineer a mouse to have wings, do the wings have a function?" (Too abstract). "If a mutation causes a trait that saves the population, does it have a function?"
              *   *Better:* "If we cure a genetic disease by gene therapy, does the new gene have a function?"
              *   *Best:* "Imagine a trait that arose by drift but is now essential for survival. Does it have a function?" (Etiological: No. Causal: Yes.)

  4.  **Refining the Prose (Self-Correction during drafting):**

      *   *Check:* Did I use headings? No.
      *   *Check:* Is it continuous? Yes.
      *   *Check:* Did I choose the case? Yes (Wisdom Teeth/Third Molars).
      *   *Check:* Did I address the misconceptions in order? Yes.
      *   *Check:* Did I evaluate the medicine closing? Yes.
      *   *Check:* Is the diagnostic question clear? Yes.
      *   *Check:* Did I mention the whiteboard? Yes.
      *   *Check:* Did I address the "one account wins" constraint? Yes, explicitly state the case must not allow a clean win.
      *   *Check:* Did I keep the three questions distinct? Yes.
      *   *Check:* Is the tone right? Needs to be direct, not pedagogical in a "teacher to student" way, but "expert to expert."

      *(Self-Correction on the Case)*: Wisdom teeth might be too medical for ecologists. They might prefer a wild trait. Let's switch to **The Plica Semilunaris** (the remnant of the nictitating membrane in the human eye). It's anatomical, evolutionary, and clearly vestigial but still has a causal role (tear drainage). Or **The Pelvic Bones in Whales**.
      *   *Whale Pelvis:*
          *   What does it do? Anchor for reproductive muscles (Causal).
          *   Why is it there? Ancestral walking (Etiological).
          *   What is it for? Walking (Etiological) vs Reproduction (Causal).
          *   This is stronger for ecologists. It avoids the "medical/disease" frame until the end. Let's use **Vestigial Pelvic Bones in Whales**.
      *   *Wait, one constraint:* "I would rather not use the heart again." Whale pelvis is safe.
      *   *Constraint:* "Whether it can be a case in which one account simply wins." I need to tell the user *not* to let them think one wins. The plan must enforce the tension.
      *   *Constraint:* "Tell me which of those [misconceptions] I am wrong about." I need to be critical.
          *   "Function just means what a trait does": Correct to worry about this.
          *   "Selection is nature's intention": Correct to worry.
          *   "Vestigial means functionless": This is the crucial one. Etiological account says vestigial traits *lack* function (because no selection history for *current* form), but Causal Role says they *have* function (current contribution). So "Vestigial = Functionless" is actually the *Etiological* conclusion, but students think it's a general truth. I need to clarify this.
          *   "Trait with several functions shows question never well posed": This is wrong. Pluralism is valid.
      *   *Medicine Closing:* Is it the thing to cut? It's strong, but might narrow the scope too much to human health. However, it tests the "normativity" of function. I should advise keeping it but framing it carefully.
      *   *Diagnostic Question:* Needs to be sharp. "If a trait arises by drift and becomes essential, is it functional?"

  5.  **Final Polish of the Narrative:**

      *   Ensure the flow is logical.
      *   Make sure the "Three Questions" are the backbone.
      *   Ensure the "Whiteboard" aspect is integrated (drawing the separation).
      *   Check the word count and density. It needs to be substantial enough to be a plan.
      *   *Crucial:* The prompt asks me to tell them *what has to be in place before either account can be stated*. This is the "Three Questions" separation. If you don't separate "Why there" from "What does," the definitions of Etiological and Causal look identical.
      *   *Crucial:* The prompt asks me to say *where the session has to stop*. It must stop before resolving the debate. The goal is to feel the cost, not solve it.

  6.  **Writing the Text (incorporating all thoughts into continuous prose):**

      *   Start with the whiteboard setup.
