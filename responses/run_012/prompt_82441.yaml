answer: |-
  You need to begin by claiming the whiteboard space before the students enter and dividing it into three vertical columns, labeling them only with question marks, because if you write the labels etiological and causal role at the outset you will trigger their defense mechanisms against philosophy and they will stop listening. The first twenty minutes must be dedicated entirely to separating the three questions you identified, because until those questions are distinct in their minds the two accounts will appear to be synonyms and the debate will look verbal. You should write the three questions explicitly only after you have elicited the confusion, so start by asking the room what the function of the vestigial pelvic bones in baleen whales is, and when they inevitably answer that it has no function because it does nothing for locomotion, you must press them on whether it does anything at all, which will lead them to admit it anchors reproductive muscles, at which point you write the third question on the board, what does it now do, and separate it from the first question, what is the trait for. This separation is the prerequisite for everything that follows, because the causal role account answers the third question while the etiological account answers the first by way of the second, why is it there, and if you do not force them to see that why it is there and what it now does can diverge, you cannot explain why we need two accounts. The case of the whale pelvis is the right choice because it satisfies your constraint that neither account simply wins, since the etiological account must say the trait has no function regarding locomotion because it was not selected for that in its current form, while the causal role account must say it has a function regarding reproduction because it currently contributes to that capacity, and this forces the students to feel the cost of each view rather than resolving the tension. You must insist that the case must not be one where current utility and selection history align, which is why you cannot use the heart or the lung, and it must not be a case where the trait is purely deleterious, which is why you cannot use a genetic disease, because you need a trait that is currently useful but historically disconnected from that utility to make the causal role account plausible, and historically explicable but currently useless for its original purpose to make the etiological account plausible.

  Once the three columns are established on the board, you should spend the next thirty minutes populating them with the whale case, asking the students to fill in the answers without using the word function, which will prevent them from collapsing the columns prematurely. When they attempt to say the function is reproduction because that is what it does, you must head off the first misconception, that function just means what a trait does, by pointing to the second column and asking why the bone is there in the first place, which forces them to acknowledge the ancestral history of walking, and this is where you introduce the etiological account not as a definition but as a tool for answering the second column, emphasizing that it is backward-looking and historical rather than forward-looking or goal-directed. This is the precise point to head off the second misconception, that selection is nature's intention, because if they think selection is a forward-looking force they will treat the etiological account as theology, so you must explicitly state that the etiological account relies on past replication success and nothing more, and if they resist this you should stop and draw a timeline on the board to show that the selection event is in the past and the current trait is a residue. You will then encounter the third misconception, that vestigial means functionless, and here you need to be precise about where they are wrong, because on the etiological account they are right but on the causal role account they are wrong, and this distinction is where the session lives or dies. You should let them sit with the discomfort that the same trait can be functionless in one sense and functional in another, because if you resolve this too quickly they will revert to the collapsed view. The fourth misconception, that a trait with several functions shows the question was never well posed, is the one you should tell them they are wrong about, because pluralism is a feature of the causal role account and not a bug, and you should use the whale pelvis to show that it can have a causal role in reproduction and structural support simultaneously without invalidating the question, whereas the etiological account might restrict function to the selected effect only, and showing this difference is where the students will feel the cost of the etiological view, which is explanatory precision at the expense of descriptive breadth.

  You must stop the session at the point where the cost is visible but before they ask which account is true, because the goal is to make them feel the distinction rather than adopt a side, and if you push for a resolution they will treat it as a matter of authority rather than conceptual clarity. This means you should not spend the final thirty minutes debating the merits but rather applying the distinction to a new context, which brings us to your temptation to close with medicine. You should keep the medicine question but you must cut the implication that medicine's talk of dysfunction quietly commits it to the etiological account, because that is too strong and will invite counterexamples where medicine uses causal role definitions of dysfunction, such as in psychiatry or public health. Instead, you should frame the medicine question as a test of normativity, asking whether a doctor calling a trait dysfunctional implies that it failed to do what it was selected to do or simply failed to do what it currently does, and this preserves the distinction without begging the question. You should leave out any discussion of teleosemantics or the philosophy of mind at this level, because that will drain the time and obscure the biological distinction, and you should say so out loud to the students so they know you are making a pedagogical choice rather than ignoring the broader literature. The session should end with one diagnostic question that tests whether they have the distinction rather than the vocabulary, and you should ask them to consider a trait that arises by genetic drift and becomes essential for survival within a few generations, and then ask if that trait has a function. If they say yes because it is essential, they are using the causal role account, and if they say no because it lacks a selection history, they are using the etiological account, and if they say it depends on what you mean by function, you have succeeded. This question works because it removes the intuition of design and forces them to rely on the framework you built, and it reveals whether they can hold the three questions apart when their intuition tries to collapse them. You should write this question on the board as the last thing you do and leave it there as they leave the room, because the goal is for them to argue about it in the hallway rather than feeling they have received an answer. Throughout the ninety minutes you must resist the urge to define function until the very end, because the definition is the conclusion of the session and not the premise, and if you give it to them early they will treat it as a dogma to be memorized rather than a tool to be tested. You should also ensure that you do not use the word adaptation as a synonym for function, because that will reintroduce the collapse you are trying to prevent, and you should correct them gently but firmly whenever they slip into that usage. The whiteboard should end up with the three columns filled, the timeline drawn, and the diagnostic question isolated, and this visual record will serve as the anchor for their confusion, which is where the learning actually happens.
