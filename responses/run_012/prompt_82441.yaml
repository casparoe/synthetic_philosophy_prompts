          *   *Candidate:* Bird feathers. (Insulation vs. Flight). A bit cliché.
          *   *Candidate:* Human chin. (Vestigial? Structural?)
          *   *Candidate:* Spleen. (Blood filter vs. immune reservoir).
          *   *Selection:* **The Panda's Thumb** (Gould) is classic but maybe too specific to exaptation.
          *   *Selection:* **Sickle Cell Trait.** Good for maintenance, but maybe too genetic.
          *   *Selection:* **The Nictitating Membrane in Humans (Plica Semilunaris).** Vestigial. Good for "why there" vs "what does".
          *   *Selection:* **Antlers in Irish Elk.** Sexual selection vs. survival cost.
          *   *Better Selection:* **A trait undergoing exaptation or drift.** Let's go with **Feathers in Dinosaurs/Birds** but specific. Or **The Human Appendix**.
          *   *Decision:* The **Human Appendix** is perfect. It has a causal role (immune/gut flora), a debated etiological history (vestigial vs. selected), and clear medical implications (dysfunction). Wait, the prompt says "not the heart." Appendix is similar enough to be safe but distinct.
          *   *Actually, let's look for something where the Causal Role is clear but the Etiology is murky, or vice versa.*
          *   *Revised Decision:* **The Plica Semilunaris (inner eye corner).** It *does* something (tear drainage/movement), but *why it's there* is ancestral (nictitating membrane). It highlights the "vestigial = functionless" error.
          *   *Wait, a stronger case for divergence:* **A trait that does something useful now but wasn't selected for it.** Exaptation. **Feathers for insulation becoming flight.**
          *   *Let's try:* **The specific case of a specific enzyme or protein.** Too technical.
          *   *Let's try:* **The coloration of a moth.** Camouflage.
          *   *Best fit for "Cost":* We need a case where accepting one account forces you to give up something you want.
          *   *Chosen Case:* **The Human Chin.** It *does* something (structural reinforcement/speech muscle attachment - Causal Role). But *why it's there* is debated (sexual selection vs. byproduct of bone resorption - Etiology). If it's a byproduct, it has no etiological function. If it has a causal role, it has a causal function. This creates the tension.
          *   *Actually, let's go with something more ecological since they are ecologists.* **A plant trait.**
          *   *Let's go with **Spines on a Cactus**.*
              *   What is it for? Protection/Water conservation.
              *   Why is it there? Selection for protection.
              *   What does it now do? Shade, trap moisture, protect.
              *   *Problem:* These align too well.
          *   *Let's go with **A trait that is currently maladaptive but persists**.* Or **A trait that is currently useful but arose for something else.**
          *   *Let's settle on **Feathers in Archaeopteryx** (or early dinosaurs).*
              *   Causal Role: Insulation, Display.
              *   Etiological: Selected for insulation? Or flight?
