      *   Misconception check:
          1.  Function = what it does. (Real risk).
          2.  Selection = intention. (Real risk).
          3.  Vestigial = functionless. (Nuanced: True for Etiological, False for Causal. Students think it's universally true).
          4.  Multiple functions = bad question. (False: Pluralism is fine).
      *   Medicine closing: Keep it, but warn against using it to declare a winner.
      *   Diagnostic: The "Drift-to-Essential" scenario.

