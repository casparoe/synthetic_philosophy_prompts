          *   *Wait, the prompt asks me to choose the case and say what it must have/must not have.*
          *   *Case:* **The Plica Semilunaris** is good for the "vestigial" misconception. But **Exaptation** is the real wedge.
          *   *Let's choose **The swim bladder in fish**.*
              *   Causal Role: Buoyancy.
              *   Etiological Origin: Lung for breathing air.
              *   This separates "What it does now" (Buoyancy) from "Why it is there" (Ancestral breathing).
              *   *Wait, is that right?* Swim bladders evolved from lungs. So etiology = breathing. Current role = buoyancy.
              *   *This works.* It forces the split.
          *   *Wait, one account winning?* The prompt asks "whether it can be a case in which one account simply wins." I should argue *no*. It must show costs.
          *   *Refining the Case:* Let's use **A specific behavior.** **Alarm calling in squirrels.**
              *   What is it for? Warning kin.
              *   Why is it there? Kin selection.
              *   What does it do? Attracts predator attention.
              *   *Too much kin selection theory.*
          *   *Let's stick to the **Swim Bladder/Lung** homology or **Feathers**.* Feathers are more intuitive.
          *   *Decision:* **Feathers in non-avian dinosaurs.**
              *   Trait: Filamentous feathers.
              *   What does it now do? Insulation, Display.
              *   Why is it there? Selection for thermoregulation.
              *   What is it for (Etiological)? Thermoregulation.
              *   What is it for (Causal)? Flight (in descendants).
              *   *Actually, let's use a case where the trait is currently present but the selection pressure is gone.* **Wisdom Teeth.**
              *   What does it do? Grind food (sometimes), cause pain.
              *   Why is it there? Ancestral diet selection.
              *   What is it for? (Etiological) Grinding tough vegetation. (Causal) Nothing useful now, or causing impaction.
              *   *This hits the "vestigial = functionless" misconception hard.*
              *   *Let's go with **Wisdom Teeth**.* It's relatable, biological, and clearly separates history from current utility.

      *   *Prerequisites:* Before defining the accounts, we must separate the three questions on the board.
      *   *Sequence:*
