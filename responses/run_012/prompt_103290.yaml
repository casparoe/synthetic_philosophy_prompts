  9.  **Final Polish:** Ensure the flow is logical. Start with the observed practices, move to the theoretical implications, test them against the AI case, and conclude on the underdetermination. Make sure to highlight that the "Shrimp vs. Lobster" distinction is actually a weak point in the regulatory logic that reveals the lack of a solid theoretical foundation.

  *(Self-Correction on Shrimp)*: The prompt says "cephalopods and decapod crustaceans are in the club... while shrimp... are still treated as basically disposable." Technically shrimp are decapods. The UK law includes all decapods. But in practice, small shrimp are often excluded or overlooked compared to lobsters. I should point out this inconsistency as evidence that the practice isn't driven by a strict theory but by a "yuck factor" or size/complexity heuristic.

