          *   Possibility B: Behavioral flexibility. Octopuses show play, learning. Insects show reflexive nociception.
          *   Possibility C: Phylogenetic proximity to vertebrates (chordates/arthropods split).
      *   *AI Line:* Why biological but not silicon?
