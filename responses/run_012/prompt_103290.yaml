      *   Address the underdetermination: The current practice is likely a mix of precaution (don't kill the smart-looking thing) and substrate bias (it's alive vs. code).
      *   Conclusion: The practice doesn't commit to one clean theory. It's a pragmatic mush. But if forced, it leans towards a homeostatic/affective functionalism that excludes current AI but includes complex animals, while inconsistently applying taxonomic boundaries due to epistemic uncertainty.

