  5.  **Reasoning Through the Tension:**
      *   If the criterion is *functional* (e.g., global broadcast, integration), then theoretically an AI could qualify. The fact that AI is excluded suggests either (1) we think current AI lacks the function, or (2) we think substrate matters.
      *   If the criterion is *biological* (e.g., specific neural correlates), then insects might qualify if they have the right neurons (they do have nociceptors), but maybe not the right integration.
      *   The "Shrimp vs. Lobster" distinction is tricky because they are both decapods. The prompt says "decapod crustaceans are in the club... while shrimp... are still treated as basically disposable." This suggests the practice isn't even consistent taxonomically. This points to a heuristic based on *size* or *perceived complexity* rather than strict theory.
