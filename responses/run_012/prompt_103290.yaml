      *   **Line 2 (AI):** Biological systems (in) vs. Computational/LLMs (out). Even if LLMs report distress, it's treated as meaningless.

  3.  **Identify Candidate Theories of Sentience/Consciousness:**
      *   **Biological Naturalism/Substrate Dependence:** Only specific biological tissue (neurons, specific neurotransmitters) can generate experience.
      *   **Functionalism:** It's about what the system *does*, not what it's made of.
      *   **Higher-Order Theories (HOT):** Need representation of mental states.
      *   **Global Workspace Theory (GWT):** Need global broadcast/integration.
      *   **Integrated Information Theory (IIT):** Need high Phi (integration).
      *   **Affective/Valence Accounts:** Need homeostatic drives, valence (good/bad), motivation to change state.
      *   **Phenomenal Consciousness vs. Access Consciousness:** The feeling vs. the reporting.

  4.  **Analyze the Consistency of the Lines:**
      *   *Animal Line:* Why octopus/lobster but not insect?
