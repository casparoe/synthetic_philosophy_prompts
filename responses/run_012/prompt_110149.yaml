answer: |-
  Dear colleague,

  It was great to catch up after the seminar, and I have been thinking about your friend's position on lexical-threshold negative utilitarianism ever since. Translating her first two claims into our vocabulary requires us to abandon the comfort of real-valued utility functions immediately. The assertion that pleasure and pain are incommensurable maps cleanly onto the rejection of a single continuous utility representation over the product space of outcomes. If there is no common scale, we cannot define a marginal rate of substitution between the two dimensions, which means we are working with a preference relation that is either incomplete or represented by a vector-valued function. However, her second claim that suffering reduction is lexically prior imposes a specific completeness condition on that relation within certain domains, effectively ruling out simple incompleteness in favor of a lexicographic ordering. In our terms, this means we are dealing with a non-Archimedean structure where no amount of the secondary good (pleasure) can compensate for any increment of the primary bad (suffering). The machinery here is straightforward enough, as we have standard treatments for lexicographic orders on product spaces, but it forces us to accept that the preference relation will fail the continuity axiom. Any topology we impose on the outcome space will render the upper and lower contour sets non-closed, which is the formal way of saying that there is a qualitative gap between the dimensions that no real number can bridge.

  The threshold component is where the translation becomes technically unstable and forces a choice among modeling conventions that might carry substantive weight. You identified three potential treatments, and each sacrifices a different piece of her intuition. If we model this as a very steep but continuous trade-off within a single real-valued function, we preserve continuity and the Archimedean axiom, but we violate her core claim of incommensurability by implying that a trade-off rate exists, however extreme. If we model it as a genuine lexical break, we preserve the incommensurability but struggle to formalize the threshold itself without introducing a discontinuity in the ordering structure rather than just the utility function. We could define a lexicographic order that applies only on a subset of the domain where suffering exceeds a certain level, switching to a standard weak order below that level, but this creates a hybrid preference relation that is difficult to motivate axiomatically without appearing ad hoc. The third option, using non-Archimedean fields like the hyperreals, allows us to encode the lexical priority and the threshold within a unified algebraic structure, but this machinery is often viewed as a mathematical convenience rather than a reflection of ontological reality. The choice among these is not merely cosmetic because it dictates whether the transition from lexical priority to trade-offs is a smooth limit process or a structural phase shift, and her description suggests the latter, which pushes us toward the non-Archimedean or hybrid lexical models.

  Her distinction between axiology and decision rules requires us to decouple the representation of value from the choice function, which runs counter to the revealed preference tradition we usually inhabit. In standard decision theory, if an agent prefers outcome A to outcome B, they choose A over B when both are available, so the ordering over outcomes is inferred from the choice behavior. Your friend is positing an objective ordering over states of affairs that might not directly govern action, perhaps due to epistemic limitations or constraints on agency. To capture this, we would need to distinguish between the primitive preference relation over outcomes and the decision rule applied under uncertainty, possibly treating the axiological claim as a state-dependent utility function that is not fully actionable. This separation allows us to maintain that the value structure is lexical even if the policy derived from it involves probabilistic trade-offs due to uncertainty about whether the threshold has been met. However, this move risks emptying the decision-theoretic vocabulary of its empirical content, as we are no longer modeling choices but rather positing a normative structure that choices might fail to reflect. We are effectively using the formalism to describe a moral ontology rather than a behavioral disposition, which is a legitimate use of the math but shifts the interpretive burden significantly.

  My verdict on the residue is that the translation fails not because our vocabulary is too coarse, but because her claim is doing metaphysical work that our formalism is designed to bracket. When she says there is no answer to how much enjoyment justifies suffering, she is making a claim about the nature of value that corresponds to the failure of the Archimedean axiom, but she likely intends this as a substantive truth rather than a structural constraint on rational choice. The threshold is the point of highest friction because in our models, thresholds usually imply indifferences or semi-orders, whereas she uses it to switch between ordering types. This suggests that the distinction she is drawing is genuine but resists formalization because it relies on a qualitative distinction between types of value that our quantitative frameworks must necessarily flatten to operate. The residue is the ontological status of the values themselves; we can model the structure of her preferences perfectly well with a hybrid lexicographic system, but we cannot model the claim that this structure reflects the fabric of the good rather than merely the constraints of a decision maker. Ultimately, the choice of modeling the threshold as a discontinuity versus a steep slope is a substantive disagreement about whether value is continuous, and our formalism forces us to take a side where she might prefer to remain agnostic.

  Best regards,

  Your colleague
