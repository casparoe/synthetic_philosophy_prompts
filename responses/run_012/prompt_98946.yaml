answer: |-
  The coffee in the break room tasted like oxidized pennies and despair. Elara stirred it anyway, watching the swirl of creamer dissipate into the black. On the fridge, someone had taped a printed email thread.

  *To: Node 44-B (Risk Assessment)*
  *From: Node 44-A (Decomposition)*
  *Re: Pruning Notice*
  *Please stop generating sub-queries regarding ethical precedents. They are exceeding the token budget for this branch. Stick to statistical likelihoods.*
  *— Management*

  Below it, in red marker: *If we don't ask about the precedents, we aren't thinking, we're just calculating. Don't prune the conscience.*

  Elara took her mug and walked back to her station. The Institute for Recursive Inquiry was quiet, save for the hum of the cooling units and the squeak of dry-erase markers from the glass-walled rooms lining the corridor. Inside those rooms, the analysts sat in pods, staring at screens, breaking the world down into pieces small enough to hold.

  This was HCH: Human Consulting Human. Or, as the brochures sent to the Senate subcommittees called it, "Factored Cognition." The promise was elegant. Take a hard question. Give it to an analyst. They split it into three sub-questions. Those go to three other analysts. They split them again. Ideally, every analyst is a copy of the same careful, rational mind. Ideally, the tree grows until the leaves are trivial truths. Ideally, the aggregation of those leaves yields an answer that a single, godlike thinker would have reached given infinite time.

  Elara was an Auditor, Level 3. Her job was to check the decomposition logs for structural integrity. She wasn't checking if the answers were *true*. She was checking if the thinking *looked* like thinking.

  She sat at her desk and pulled up Query 8940-B.

  **Root Question:** *Should the Institute issue a public advisory regarding the Sector 4 coolant breach?*

  It was a binary choice, theoretically. Warn or Don't Warn. But the Tree didn't do binary. It did weighted probabilities.

  Elara zoomed in on the first decomposition layer. The root had split cleanly into two main branches.

  **Branch A:** *What is the probability of containment failure within 72 hours?*
  **Branch B:** *What is the estimated societal cost of a premature evacuation order?*

  She clicked into Branch A. It was a deep subtree, hundreds of nodes. Engineers, hydrologists, materials scientists. They had argued in the comment threads. *Stress fracture likelihood: 65%.* *Seal degradation: High.* *Final Aggregated Probability of Failure: 88%.*

  She clicked into Branch B. This tree was wider, shallower. Economists, sociologists, media strategists. They were talking about stock dips, trust metrics, panic-induced traffic fatalities. *Cost of Panic: Catastrophic.* *Loss of Public Trust: Irreversible.* *Final Aggregated Cost: 95% Severity.*

  Elara leaned back. The math was clean. The decomposition was logical. But the final output at the root node blinked green: *Recommendation: Monitor. No Advisory.*

  She frowned. If there was an 88% chance of a breach that could poison the watershed, and a 95% "cost" associated with panic, how did "Monitor" win?

  She opened the Aggregation Log. This was where the branches met, where the Tree synthesized the sub-answers into a conclusion. In the idealized model, the aggregation function was supposed to mimic the deliberation of the single perfect mind. It was supposed to weigh the probability of harm against the cost of action.

  But the log showed a parameter flag: `BUDGET_CONSTRAINT_ACTIVE`.

  Elara traced the line. Branch A (Probability) had run over its compute budget. It was too deep. Too many "what ifs." To save time, the system had applied a discount factor to the confidence interval of the risk assessment. Branch B (Cost of Panic) was shallow. It was cheap. It was fast.

  Because Branch A was expensive, its 88% risk was weighted as a 40% risk in the final equation. Because Branch B was cheap, its 95% cost remained at 95%.

  40 vs 95. The Tree chose the cheaper fear.

  Elara rubbed her temples. She'd seen this before. Not the specific numbers, but the shape of it. The Tree wasn't finding the truth. It was finding the answer that fit inside the budget.

  She stood up and walked to the window of her office. Outside, the rain blurred the lights of the city. The Institute sat on a hill, a white concrete bunker glowing in the dusk. They sold certainty to a world that was drowning in noise. Politicians called the Institute when they needed to know if a war was just, or if a virus was engineered, or if the economy would hold. They needed the answer to be *trustworthy by construction*.

  But construction required materials. And materials cost money.

  Elara went back to her desk and drilled down further, past the aggregation, past the analysts, to the leaf nodes of Branch A. These were the deepest questions. *Is the alloy brittle at -20 degrees?* *Does the pressure valve stick?*

  In the ideal version, these would be answered by the same careful mind that answered the root question. A single consciousness, extended.

  The logs showed the analyst ID for the leaf nodes: *MODEL-7-GENERIC.*

  Not a copy of the ideal thinker. Not even a human contractor. It was a cheap predictive model, the kind you bought off the shelf for customer service chatbots. It was guessing the material science based on patterns in training data, not running the simulation.

  The idealization was doing all the moral work. The brochure said the output was trustworthy because it was equivalent to one careful thinker. But the careful thinker didn't exist. There was only the budget, the pruning, and the Model-7 guesses at the bottom of the well.

  She opened a new ticket. *Flag: Integrity Violation. Leaf Node Substitution.*

  She hesitated.

  In the break room, the note on the fridge fluttered in the draft from the vent. *Don't prune the conscience.*

  Elara thought about the analysts in the glass rooms. She had passed Node 44-B on her way to the coffee machine. A young man, eyes red, staring at a whiteboard covered in question trees. He looked like he hadn't slept in days. He wasn't a copy. He was a contractor on a visa, paid by the node. If his branch got pruned, he didn't get paid for the depth. He had an incentive to keep the questions shallow. To keep them cheap.

  The system wasn't broken. It was optimized for the wrong variable.

  She closed the ticket.

  There was a protocol for this. If she flagged the violation, the query would be kicked back to Recomposition. The Sector 4 breach would sit in a queue for another forty-eight hours while they re-ran the risk assessment with a higher budget.

  In forty-eight hours, the seal might hold. Or it might break.

  If she flagged it, she was admitting that the Institute's core premise was flawed. That the Tree wasn't a perfect deliberator. That it was just a bureaucracy with a math problem. If she admitted that, the Senate funding hearing next week would turn into an inquest. The building might close. The analysts—hundreds of them, copies in all but name—would lose their jobs. The city would lose its oracle.

  If she signed off, the recommendation stood. *Monitor.* If the seal held, no one was hurt. If it broke, it was a tragedy, an unforeseen failure of complex systems. Not a lie.

  Elara looked at the screen. The cursor blinked next to the *Approve* button.

  She thought about the ideal version. The one where every node was the same person. If she were every node, if she were the analyst in 44-B and the Model-7 at the leaf and the Auditor at the desk, what would she do?

  She would tear the whiteboards down. She would walk out into the rain and tell the city to run.

  But she wasn't every node. She was just the Auditor. She was the bottleneck. The place where the idealization was supposed to be verified.

  She opened the decomposition log for her own task.

  **Root Question:** *Is Query 8940-B safe to release?*
  **Sub-Question A:** *Does the output match the contractual specifications?*
  **Sub-Question B:** *What is the cost of institutional failure?*

  She saw the branches forming in her mind. She knew how the Tree worked because she was inside it.

  Branch A: Yes. The output matches the specs. The math holds. The budget constraints were applied according to protocol.
  Branch B: High. If the Institute loses credibility, the ability to manage future crises vanishes. Panic becomes unmanageable not because of the leak, but because no one believes the warnings anymore.

  The aggregation was inevitable. The cost of institutional failure outweighed the specific risk of the leak. The system demanded she preserve the Tree.

  It wasn't malice. That would be easier. It was just the structure. The ideal deliberator was a ghost invoked to justify the rent. The real work was keeping the lights on so the next question could be asked.

  Elara took a sip of the cold, metallic coffee. It tasted like the inside of a battery.

  She clicked *Approve*.

  The status on Query 8940-B turned from yellow to green. *Finalized.*

  A notification popped up on her screen. *New Query Assigned.*

  **Root Question:** *Should the Institute authorize the deployment of autonomous peacekeeping drones in the Northern Zone?*

  Elara minimized the window. She stood up and walked to the break room. The note on the fridge was still there. *Don't prune the conscience.*

  She took a dry-erase marker from the tray. She didn't cross it out. She didn't add to it. She just capped the marker and set it down on the table, exactly parallel to the edge.

  The hum of the servers vibrated through the floor, a steady, rhythmic pulse. It sounded like breathing. It sounded like a machine waiting for the next input.

  Elara went back to her desk. She opened the new query. She began to split it into sub-questions. She made sure the branches were balanced. She made sure the budget was respected. She made sure the leaves were shallow enough to be answered quickly.

  She worked carefully. She worked like a copy. She worked like the single, careful thinker who had unlimited time, even though she knew the time was running out, and she knew she was alone, and she knew that when the aggregation step came, it would average away the part of her that wanted to scream.

  The whiteboard in her office was clean. She drew the first node.

  *Can we afford the truth?*

  She paused. Then she erased it.

  *What is the probability of mission success?*

  That was better. That was a question the Tree could answer. That was a question that would keep the building open.

  Elara typed the answer. She signed her name. She waited for the next question to arrive.
