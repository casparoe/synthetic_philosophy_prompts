answer: |-
  "You know 'average-case safety' is an oxymoron, right?" Elena took a sip of her lukewarm coffee, leaning against the exterior wall of the conference center. "If one in a million runs kills everyone, you aren't safe. You're just lucky."

  Marcus sighed, rubbing his temples. He'd been on the empirical evals panel all morning. "And you know 'worst-case safety' is impossible for learning systems, right? You're asking for a formal verification theorem on a matrix multiplication that updates itself. There is no 'all inputs.' There's just the data manifold."

  "There is if you define the adversary," Elena said. "That's the whole point. If you only test against the distribution you *expect*, you're blind to the distribution you *create*."

  "Okay, but that's my thing," Marcus said, pushing off the wall. "You keep talking about the worst case like it's a static target. But the deployment distribution isn't fixed. The model's outputs feed back into the world. Other agents react. If the model says something wild, the world changes. So what are you taking the expectation over? The 'worst case' moves because the model moves it."

  "Exactly," Elena said, pointing a finger. "So average-case reasoning doesn't even type-check. If the system can steer the world into regions where it's more competent—or where our defenses are weaker—then your 'average' is just a snapshot before the system started optimizing against you. You're measuring the depth of the pool while the drain is opening."

  "So what's the alternative?" Marcus countered. "You say 'guarantee me it works on all inputs.' I say 'I can't.' You say 'then don't deploy.' We paralysis. Meanwhile, the capability race moves forward. If I can show you that under the distribution of inputs we actually see—and the ones we can realistically generate via red-teaming—the system is robust, isn't that worth something? Or do you need a mathematical proof before you'll turn the thing on?"

  "I need to know who picked the distribution," Elena said. "Because here's where you always retreat. You say 'all inputs' is impossible, so you downgrade to 'all inputs within a reasonable class of adversaries.' But who defines the class? How is it picked? If you're picking the class based on what we can currently break, you're just bounding the adversary by our own incompetence."

  Marcus paused. "Fair. But if you bound them by physics? Compute limits? If I say 'no adversary with less than 10^50 ops can break this,' isn't that a worst-case guarantee?"

  "Is it?" Elena pressed. "Because if the system you're aligning is the one generating the adversary, it might find shortcuts you didn't model. You're assuming the class of adversaries is exogenous. But if the AI is helping design the attack, the 'reasonable class' expands. So again, the choice of class is doing all the work. It feels like you're smuggling the safety assumption into the definition of the test."

  Marcus looked out at the parking lot. "Okay. So you think I'm optimizing for 'can I prove to a skeptic that it won't hurt?' while you're optimizing for 'will it actually hurt?'"

  "No," Elena said sharply. "I'm optimizing for 'will it actually hurt' too. But I think you can't know that without the proof. If you don't have the bound, you don't know if the thing you're measuring is the risk or just the noise."

  "But what if the proof is impossible?" Marcus turned back to her. "What if the territory doesn't support that kind of map? Then your demand for a guarantee isn't safety—it's just epistemic comfort. You want to be able to say 'I knew.' I want to be able to say 'We checked.'"

  "Those sound like the same thing," Elena said.

  "They're not," Marcus said. "One is about internal consistency. The other is about external contact. Look, here's where I think we're actually talking past each other. You treat 'worst-case' as a property of the input space. I treat it as a property of our uncertainty."

  Elena frowned, tilting her head. "Go on."

  "When I say 'average case,' I'm not saying 'we ignore the tails.' I'm saying 'we have a prior over distributions.' The worst-case isn't a single input; it's the worst *distribution* within our uncertainty set. If you frame it that way, your 'reasonable class of adversaries' isn't a hand-wave; it's just the confidence interval on our model of the world."

  Elena was quiet for a moment. She stirred her coffee. "So you're saying worst-case reasoning is just robust statistics over distributions, not inputs?"

  "Basically. If you demand 'for all inputs,' you're assuming the environment is static. If you demand 'for all distributions consistent with our data,' you're admitting the environment is endogenous. That's what I'm trying to do with evals. I'm trying to map the uncertainty set."

  "But," Elena said slowly, "if the uncertainty set is too wide, you're back to paralysis. If the system can shift the distribution outside your confidence interval faster than you can update it, your statistics are lagging indicators."

  "Then we need to narrow the uncertainty," Marcus said. "And we do that by stress-testing, not by trying to prove theorems about black boxes. We expand the 'reasonable class' by hitting it harder."

  "And if hitting it harder changes the system's weights because it's learning online?"

  "Then we freeze it for evals," Marcus said. "We treat the snapshot as the object of study."

  "Okay," Elena conceded, slightly. "If you're talking about frozen snapshots, I can buy that 'worst-case over distributions' is a coherent goal. But you have to admit that once you deploy, the snapshot is gone. The moment it's learning from feedback, you're back to my problem. The distribution is endogenous."

  "Agreed," Marcus said. "Which is why I don't want online learning in critical domains without a hard stop. But you have to admit that 'for all inputs' is still a category error. Even with a frozen model, the input space is too big. You need the distribution prior."

  "I think I can live with that," Elena said. "Provided the prior is pessimistic. If your 'uncertainty set' assumes the world stays nice, you're dead. If it assumes the world gets adversarial as soon as there's incentive... then maybe we're just arguing about hyperparameters."

  Marcus smiled faintly. "So you're saying my 'average case' is just your 'worst case' with a better prior?"

  "I'm saying," Elena said, finishing her coffee, "that if you can't justify your prior with a security mindset, you don't have a prior. You have a hope. And I'm not willing to bet the world on hope."

  "Fine," Marcus said. "Then help me build the prior. Don't just tell me it's wrong."

  "Deal."
