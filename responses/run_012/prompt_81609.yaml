answer: |-
  Your intuitions map a sophisticated tension between **Analytic Marxism** (which focuses on surplus value, property relations, and identifiable agents) and **Humanist or Phenomenological Marxism** (which focuses on experience, agency, and structural domination). Your tentative principle fails because it treats exploitation as purely economic (surplus) and alienation as purely psychological (estrangement). Your cases suggest both are forms of **subordination**, but operating on different vectors: one on the *distribution of fruits*, the other on the *determination of will*.

  Here is a precise formulation that captures the majority of your pattern, followed by the required analysis.

  ### The Principle of Asymmetric Subordination

  **I. Exploitation** is the **unreciprocated appropriation of labor-power or its fruits**, enforced by **asymmetric property rights or bargaining power** within a production relation.
  *   *Necessary Conditions:* (1) Transfer of value/labor; (2) Asymmetry of power/property; (3) Lack of reciprocal benefit commensurate with contribution.
  *   *Agent Requirement:* Exploitation typically implies a beneficiary (agent or class), but can be structurally mediated.

  **II. Alienation** is the **subordination of the laboring subject's telos (purpose) to an external imperative**, resulting in a loss of ownership over the activity, product, or social meaning of the work.
  *   *Necessary Conditions:* (1) External determination of goals/process; (2) Separation of the worker from the social validation of the work; (3) Labor becomes a means to an end not chosen by the laborer.

  **III. The Priority Clause:** Where control over the *process* (alienation) is the mechanism that secures the *appropriation* (exploitation), alienation is logically and causally prior.

  ---

  ### Application to Your Cases

  1.  **Factory Owner:** Fits **Exploitation** (Asymmetric property rights allow surplus appropriation). Fits **Alienation** (Worker's telos subordinated to profit).
  2.  **Worker-Coop:** No **Exploitation** (Members appropriate their own surplus; symmetry of power). Yes **Alienation** (Market imperatives subordinate the cooperative's telos).
  3.  **Freelance Programmer:** Yes **Exploitation** (Platform appropriates 1/3 via property rights over the marketplace). No **Alienation** (Worker retains telos over activity/tools).
  4.  **Tenured Professor:** No **Exploitation** (High autonomy, salary not strictly tied to surplus extraction in the same way). Yes **Alienation** (Research telos subordinated to monetization/metrics).
  5.  **Disabled on UBI:** No **Exploitation** (No labor transfer). No **Alienation** (No external imperative governing activity).
  6.  **Gig Worker:** Yes **Exploitation** (Platform takes surplus). Yes **Alienation** (Algorithm dictates process). **Priority:** The algorithm's control (Alienation) creates the power asymmetry that enables the fee extraction (Exploitation).
  7.  **Wealthy Artist:** No **Exploitation** (No unreciprocated appropriation; she keeps the surplus). Yes **Alienation** (Market pricing subordinates the artistic telos).
  8.  **Collective Factory:** No Internal **Exploitation** (Symmetry). Yes External **Exploitation/Alienation** (Market imperatives force surplus extraction). *See "Honesty Clause" below.*
  9.  **Unpaid Parent:** No **Exploitation** (No property/wage relation to enforce appropriation). Yes **Alienation** (Social meaning is invisible/externalized).

  ---

  ### Predictions for Unlisted Cases

  **1. A cooperative that hires temporary non-member labor.**
  *   **Prediction:** The temporary workers are **exploited** and **alienated**. The member-owners are **complicit in exploitation** (benefiting from the asymmetry) but may remain **alienated** (due to market pressure).
  *   **Reasoning:** The temporary workers lack the property rights and bargaining power of the members (Asymmetric Subordination). The members, by utilizing this asymmetry to survive market competition, replicate the capitalist relation internally, even if democratically.

  **2. An AI system that allocates work without any human owner.**
  *   **Prediction:** High **Alienation**, ambiguous **Exploitation**.
  *   **Reasoning:** If the AI is a public utility distributing work for social need, there is no *unreciprocated appropriation* (no exploitation), but workers may still feel **alienated** if the algorithm's logic is opaque or overrides human telos. If the AI is owned by shareholders who harvest the surplus, it is both. The absence of a human "boss" does not remove alienation (external imperative) but complicates the "exploiter" requirement.

  **3. A community that shares care work without wages.**
  *   **Prediction:** Neither **Exploitation** nor **Alienation**.
  *   **Reasoning:** Labor is reciprocal (no unreciprocated appropriation). The telos is internally determined by community need and social recognition is high (no estrangement from social meaning). This validates your UBI/Parent distinction: it is the *institutional invisibility* and *lack of reciprocity* that drives the verdict, not the mere absence of wages.

  ---

  ### The Honesty Clause: Incompatibilities

  No single principle can perfectly accommodate every intuition you listed without modifying one of them. Here are the specific friction points this account exposes:

  **1. The "Market Exploits" Contradiction (Collective Factory)**
  *   **Your Verdict:** You want to say the market exploits the collective, but you also hold that exploitation requires an exploiter.
  *   **The Conflict:** The Principle of Asymmetric Subordination allows for *Structural Exploitation* (where the "System" is the beneficiary), but this violates your agent-based constraint.
  *   **Resolution:** You must choose. Either (A) accept **Structural Exploitation** (the "Market" acts as a non-human agent of accumulation) or (B) concede the factory is **Coerced but not Exploited** (the market forces them to act against their interest, but no one *takes* the surplus). The principle favors (A) to preserve the critical force of your judgment, but it requires abandoning the strict "human exploiter" requirement.

  **2. The Unpaid Parent (Feminist Critique)**
  *   **Your Verdict:** You resist calling this exploitation because there is no wage relation.
  *   **The Conflict:** Many Marxist-Feminists argue this *is* exploitation (capital benefits from free reproduction of labor power).
  *   **Resolution:** Your principle aligns with your verdict by tying exploitation to **property/bargaining asymmetry** within a production relation. However, this limits the concept's critical scope. It predicts that unless the parent is *forced* by property relations to provide this labor for another's specific gain (e.g., a state that denies support to force labor), it remains Alienation but not Exploitation.

  **3. The Gig Worker Priority**
  *   **Your Verdict:** Alienation is prior to exploitation.
  *   **The Conflict:** Standard Marxism often views exploitation (the economic relation) as the base that causes alienation (the superstructural experience).
  *   **Resolution:** The Principle accommodates your verdict via the **Priority Clause**, but this is a revision of orthodox Marxism. It suggests that in *digital/platform capitalism*, control over information/process (Alienation) is the primary mechanism of power, which then enables extraction (Exploitation). In industrial capitalism, the reverse might be true.

  ---

  ### Unifying Theme

  If the account is plural (Exploitation vs. Alienation), what unifies them?

  **The Unified Theme is Autonomy.**
  Both concepts are metrics of **failed autonomy in social production**.
  *   **Exploitation** is a failure of *Economic Autonomy*: I do not own the fruits of my causal contribution.
  *   **Alienation** is a failure of *Agential Autonomy*: I do not own the intentions and social meaning of my activity.

  Your judgments consistently track where autonomy is violated. The Factory Owner violates Economic Autonomy. The Market violates Agential Autonomy. The Gig Platform violates both, with Agential violation (algorithm) enabling Economic violation. The Parent suffers a loss of Agential Autonomy (invisibility) without a clear violation of Economic Autonomy (no wage relation to breach).

  **Recommendation for your paper:**
  Explicitly frame your account as a shift from a **Substance-Based Marxism** (focused on the quantification of surplus labor) to a **Relational-Autonomy Marxism** (focused on the power dynamics of production). This allows you to accommodate the Professor and Artist cases (where surplus is less relevant than autonomy) and the Gig case (where control precedes extraction), while honestly acknowledging that the "Collective Factory" case requires expanding the definition of "exploiter" to include structural imperatives.
