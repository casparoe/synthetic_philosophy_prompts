  I'm doing an MA essay on the naturalism vs normativism punch-up over what makes something a disease, and my supervisor wants me to test the debate on a case that hasn't already been chewed to death. So I've invented one: a proposed new diagnosis, "chronic fragmented attention", defined purely by a behavioural pattern — constant task-switching, can't hold a book for ten minutes, that sort of thing — which a big chunk of adults now apparently show. What are the most important implications of each camp for whether this is a real disease at all, and what does the case end up revealing about which camp is more plausible? Be concrete, don't give me a reading list, and write it in British English.
