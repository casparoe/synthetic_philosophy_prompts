      *   *User's Types:* (a) Plain Race (PD style), (b) Pure-Waste Arms Race (Rent-seeking), (c) Doorman Trap (Club good/Exclusion), (d) Self-Erasing Trap (Tragedy of the Commons).
      *   *Critique:*
          *   (a) and (b) overlap significantly. An arms race *is* a plain race where the investment is wasteful.
          *   (d) is essentially a specific dynamic of (a) or (b) where the payoff function degrades over time. It's not a distinct structural category, but a dynamic outcome.
          *   (c) is distinct (coordination + exclusion).
          *   *Missing Category:* The "Signal Jamming" or "Goodhart's Law" trap. When the metric becomes the target, it ceases to be a good metric. This is crucial for academic incentives. Also, the "Stackelberg" problem (one actor moves first and forces others to follow).
          *   *Refinement:* I need to simplify this for the audit procedure. The audit shouldn't rely on naming the trap perfectly, but on identifying the *incentive gradient*.

  3.  **Develop the Audit Procedure (The "Moloch Meter"):**
      *   *Goal:* 5 steps, ordered, stop conditions.
      *   *Step 1: The Defection Test (Is it actually a trap?)* Does individual rationality lead to collective sub-optimality? If no -> Not-a-Trap.
      *   *Step 2: The Boundary Test (Relocation?)* Does the fix just move the competition to a different layer? (e.g., stopping journal metrics leads to citation metrics).
      *   *Step 3: The Enforcement Cost Test (Deepener?)* Does the fix require more monitoring than the original problem was worth? Does it create a new bureaucracy that becomes a rent-seeking target?
      *   *Step 4: The Heterogeneity Test (Value Call?)* Does the fix assume all actors want the same thing? (e.g., some *want* prestige).
      *   *Step 5: The Exit Test (Escape?)* Does it actually change the payoff matrix or just add a pledge?
      *   *Verdicts:* Escape, Relocation, Deepener, Not-a-Trap, Needs-a-Value-Call.

      *Refining the Steps for the User's Constraints:*
      *   Need to ensure it doesn't require private payoff info.
      *   Need to make sure it handles the "expectation vs. structure" limitation.
