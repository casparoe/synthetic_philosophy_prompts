          2.  **Displacement:** Where does the pressure go?
          3.  **Enforcement:** Who polices the pledge?
          4.  **Selection:** Does this change *who* survives or just *how* they compete?
          5.  **Value:** Is the competition itself the problem?

  4.  **Drafting the Procedure (Iterative refinement):**
      *   *Q1: The Externality.* Does the behavior impose a cost on others that the actor doesn't pay? (If No -> Not-a-Trap).
      *   *Q2: The Substitution.* If I ban X, do I naturally switch to Y which has the same incentive structure? (If Yes -> Relocation).
      *   *Q3: The Enforcer.* Who punishes defectors? Is the enforcer subject to the same incentives? (If Enforcer is compromised -> Deepener).
      *   *Q4: The Selection Pressure.* Does this reduce the intensity of selection or just change the criteria? (If Intensity stays high -> Deepener/Relocation).
      *   *Q5: The Normative Floor.* Is the competition itself valuable? (If Yes/Unknown -> Needs-a-Value-Call).

      *Wait, I need to match the specific verdicts requested:* Escape, Relocation, Deepener, Not-a-Trap, Needs-a-Value-Call.
