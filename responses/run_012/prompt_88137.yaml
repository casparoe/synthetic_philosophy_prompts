          *   Q3: Enforcement? Threshold quality check.
          *   Q4: Selection? Decouples funding from marginal quality differences.
          *   Verdict: Escape (on the margin) but needs Value Call (is meritocracy desired?).

  6.  **Addressing Limitations & Pushback:**
      *   Must explicitly state: This doesn't solve the "is competition good?" question.
      *   Must state: It can't distinguish between "hard constraint" and "soft norm."
      *   Must state: It assumes preferences are stable (doesn't handle preference shaping).

  7.  **Final Review against Constraints:**
      *   20 mins? Yes, 5 questions.
      *   No modeling? Yes.
      *   Verdict labels included? Yes.
      *   Typology critique included? Yes.
