      *(Self-Correction during drafting)*: Make sure I don't sound *too* pessimistic about the user's journal pledge. If I say it's a failure, explain *why* structurally so they can fix it (e.g., by adding enforcement or broadening the coalition). The user asked me to be "rude" if it fails, so I will be structurally honest.

      *(Refining the Verdicts)*:
      *   **Escape:** Payoff matrix changed, defection no longer dominant.
      *   **Relocation:** Pressure moves to a new variable.
