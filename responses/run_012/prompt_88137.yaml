          *   Q3: Enforcement? Peers policing peers. High social cost.
          *   Verdict: Likely Relocation (to other metrics) or Deepener (if enforcement creates bureaucracy). I should be honest as requested.
      *   *Case 2: Registered Reports (RR).*
          *   Q1: Reduces HARKing/p-hacking (negative externality).
          *   Q2: Substitution? Maybe "p-hacking the preregistration" or "methodological fetishism."
          *   Q3: Enforcement? Reviewers check protocol.
          *   Q4: Selection? Still competing for space, just earlier.
          *   Verdict: Partial Escape (reduces waste) but potential Relocation (methodological arms race).
      *   *Case 3: Funding Lottery.*
          *   User's hope: Makes race unwinnable.
          *   Q1: Reduces waste in grant writing?
