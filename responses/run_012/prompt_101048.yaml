          *   Test Case: BBAA.
              *   Rule 1 (As then Bs): No (Bs then As). -> Right side.
              *   Rule 2 (Equal Counts): Yes (2A, 2B). -> Left side.
          *   Test Case: AAABBB (Already there).
          *   Test Case: ABAB.
