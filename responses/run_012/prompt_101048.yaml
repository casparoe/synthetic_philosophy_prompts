      *   *Simplicity:* Counting is often considered computationally simpler or more abstract than specific ordering, though $A^n B^n$ is a classic context-free grammar structure. However, the Count rule is extensionally equivalent on *this* dataset.
      *   *Underdetermination:* Both rules fit the 6 examples perfectly.
