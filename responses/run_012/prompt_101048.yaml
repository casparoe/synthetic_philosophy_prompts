          *   Alternative Hypothesis: Left = As then Bs. Right = As, Bs, then As again.
          *   Alternative Hypothesis 2 (The "Trick" One): Left = Strings where the count of As equals the count of Bs. Right = Strings where count of As does not equal count of Bs?
              *   Left: AB (1=1), AABB (2=2), AAABBB (3=3).
              *   Right: ABA (2A, 1B), ABBA (1A, 2B), AABAA (3A, 1B).
              *   This fits perfectly.
