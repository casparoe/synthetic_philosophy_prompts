answer: |-
  ### Examination Question

  **Question 1**

  Consider the following classification of six strings into two groups, **Left** and **Right**.

  **Left:** `AB`, `AABB`, `AAABBB`
  **Right:** `ABA`, `ABBA`, `AABAA`

  Write an essay addressing the following points. First, state two distinct rules that correctly classify all six strings into these groups. Second, discuss which rule might be considered "simpler" and explain why simplicity is not an objective property of the data itself. Third, explain why the six examples alone do not logically determine which rule is the intended concept, distinguishing this underdetermination from mere ambiguity. Fourth, propose one new string that would discriminate between your two rules, explain what the classification of this string would show, and discuss why your choice of this test string is not itself theory-neutral. Finally, discuss what a Bayesian or Minimum-Description-Length model of concept learning would need to assume about inductive biases to prefer the rule a human solver would likely choose, and explain the difference between a rule that is merely extensionally adequate and one that captures the concept.

  *(Suggested time: 45 minutes)*

  ***

  ### Model Answer

  The six strings provided present a classic problem of inductive inference where the data underdetermine the hypothesis. Two distinct rules classify the examples perfectly. The first is a structural rule: the **Left** group consists of strings formed by a block of As followed by a block of Bs ($A^n B^n$), while the **Right** group consists of strings where As surround a block of Bs ($A^n B^m A^n$). The second is a numerical rule: the **Left** group contains strings where the count of As equals the count of Bs, while the **Right** group contains strings where the counts differ. Both rules are extensionally adequate; they carve the existing data set exactly as required without error.

  Determining which rule is simpler is not a matter of inspecting the strings but of inspecting the language used to describe them. In a Minimum-Description-Length framework, simplicity is measured by the length of the code required to state the hypothesis plus the code required to state the data given the hypothesis. A human solver might find the numerical rule simpler because it abstracts away from order, relying only on magnitude. However, a computational model operating on regular expressions might find the structural rule simpler, as counting requires memory resources that simple pattern matching does not. Thus, simplicity is relative to the representational vocabulary and the prior probabilities assigned to different types of hypotheses. It is not an objective feature of the strings themselves, but a relation between the data and the learner's bias.

  This relativity highlights why the examples alone do not determine the concept. This is not merely ambiguity, where a term has multiple meanings, but underdetermination, where multiple logically incompatible hypotheses are fully compatible with all available evidence. No amount of logical deduction from the six strings can privilege the numerical rule over the structural rule, because both are true of the data. To break the tie, one must introduce information not present in the examples, typically in the form of inductive biases or new data.

  To discriminate between the rules, one might propose the test string `BBAA`. Under the structural rule, this belongs on the **Right** (Bs precede As). Under the numerical rule, it belongs on the **Left** (two As, two Bs). The classification of `BBAA` would force a choice between the hypotheses. However, the choice of `BBAA` as a test case is not theory-neutral. A solver who suspects the concept involves palindromes might choose `ABAB` instead. Selecting `BBAA` presupposes that the relevant competition is between order and count, ignoring other potential rules, such as symmetry or vowel-consonant analogies. The design of a critical experiment always relies on a background theory about which hypotheses are plausible candidates.

  A Bayesian or Minimum-Description-Length model resolves this underdetermination by assigning higher prior probabilities to hypotheses that are more compressible or "natural" within the system's ontology. To prefer the numerical rule, as a human likely would, the model must assume a prior bias toward arithmetic properties over topological ones, or perhaps a bias toward global properties (total count) over local properties (sequence order). This reflects the core issue of concept learning: a concept is a compressed hypothesis, but compression is only possible relative to a specific coding scheme.

  Ultimately, the distinction lies between extensional adequacy and intensional capture. A rule is extensionally adequate if it matches the data; it captures the concept if it aligns with the causal or generative process that produced the data. The six strings are merely effects of the hidden rule. Choosing the "correct" rule is not about fitting the past data better, since both fit perfectly, but about predicting future data correctly. This requires assuming that the world is structured in a way that makes certain hypotheses (like counting) more likely to be the true generators of experience than others. Without this assumption, induction is impossible, and the learner remains stuck with a set of equally valid but mutually exclusive descriptions.

  ***

  ### Marking Scheme

  **Total Marks: 20**

  **1. Identification of Rules (4 marks)**
  *   **4 marks:** Clearly states two distinct rules (e.g., Structural/Order vs. Numerical/Count) that fit all six examples perfectly.
  *   **2–3 marks:** States two rules, but one is vague or fits the data only loosely.
  *   **0–1 mark:** Fails to identify two distinct rules or proposes rules that do not fit the data.

  **2. Simplicity and Underdetermination (5 marks)**
  *   **5 marks:** Explains that simplicity depends on the representation language/priors (MDL view) and clearly distinguishes underdetermination (logical compatibility of multiple hypotheses) from ambiguity (semantic vagueness).
  *   **3–4 marks:** Discusses simplicity but treats it as subjective or objective without referencing representation. Distinguishes underdetermination but less precisely.
  *   **0–2 marks:** Claims one rule is objectively simpler without justification. Confuses underdetermination with lack of data or ambiguity.

  **3. Discriminating Test Case and Theory-Ladenness (5 marks)**
  *   **5 marks:** Proposes a valid discriminating string (e.g., `BBAA` or `ABAB`). Correctly explains the predicted classification for both rules. Crucially, explains that the choice of test case presupposes a specific set of candidate hypotheses (theory-ladenness).
  *   **3–4 marks:** Proposes a valid string and explains the discrimination, but fails to note that the choice of string is theory-laden.
  *   **0–2 marks:** Proposes a string that does not discriminate (fits both rules or neither). Fails to explain what the result would show.

  **4. Bayesian/MDL and Extensional vs. Intensional (6 marks)**
  *   **6 marks:** Explains that Bayesian/MDL models require priors/biases to prefer one hypothesis over another when data fit is equal. Clearly distinguishes extensional adequacy (fitting data) from capturing the concept (generative truth/prediction). Connects this to the problem of induction without relying on historical name-dropping.
  *   **4–5 marks:** Discusses priors or compression but misses the distinction between extensional and intensional adequacy. Or, distinguishes extension/intension but gives a weak account of the Bayesian requirement.
  *   **0–3 marks:** Treats the Bayesian model as simply "choosing the true rule" without explaining the role of bias. Confuses psychological ease with normative warrant.

  **A-Grade Differentiators**
  To achieve an A (17–20 marks), the answer must:
  *   Explicitly state that the test card choice is not theory-neutral (it assumes a hypothesis space).
  *   Define simplicity in terms of compression/representation rather than "gut feeling."
  *   Avoid the claim that the examples logically entail the "correct" rule.
  *   Distinguish the normative question (which hypothesis is warranted) from the psychological question (which is easier for humans).

  **Common Mistakes (Deductions)**
  *   **Entailment Error (-3 marks):** Claiming the examples prove one rule is true.
  *   **Psychologism (-2 marks):** Arguing a rule is better simply because "humans like it" without addressing the normative/inductive justification.
  *   **Invalid Test Case (-3 marks):** Proposing a string (e.g., `AAAA`) that fits both rules or neither, failing to discriminate.
  *   **Recitation (-2 marks):** Simply quoting Hume or Goodman without applying the concepts to the specific strings provided.
