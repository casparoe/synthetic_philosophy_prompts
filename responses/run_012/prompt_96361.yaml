answer: |-
  ### Part 1: The Translation

  Here is Lakatos's Methodology of Scientific Research Programmes, restated in the language of a six-book fantasy series.

  **The Research Programme $\rightarrow$ The Series**
  The entire ongoing project, from Book 1 through the planned finale.

  **The Hard Core $\rightarrow$ The Iron Canon**
  These are the foundational promises made in Book 1 that define the genre and contract with the reader. In your case: *No resurrection.* In others, it might be *Hard Magic has a cost* or *The Gods do not intervene.* You do not test these. You do not write a scene where the protagonist tries to break them to see if they hold. If you break the Iron Canon, you haven't written a plot twist; you've cancelled the series. You protect this core not because it's "true" (you made it up), but because abandoning it makes the previous books lies.

  **The Protective Belt $\rightarrow$ Soft Continuity**
  This is the lore surrounding the core: the timeline of the Old Empire, the specific mileage of the Northern Coast, the exact wording of the Book 2 prophecy. When a plot hole threatens to punch through to the Iron Canon, you adjust the Belt. You retcon the date of the war. You decide the prophecy was metaphorical. You add a mountain range to the map to explain why the army took three months instead of two. This is permissible work, provided it doesn't crack the Iron Canon.

  **The Negative Heuristic $\rightarrow$ The "Don't Look There" Rule**
  This is your instinctive avoidance strategy. It's the reason you never put a character in a position where the only logical solution is necromancy. You steer the plot away from scenarios that would force a confrontation with the Iron Canon. You don't test the laws of your physics; you write around them.

  **The Positive Heuristic $\rightarrow$ The Story Engine**
  This is your generative rule set. It tells you what kind of problems are worth solving. *Example: "This series is about the cost of knowledge."* A progressive move is introducing a map that reveals a truth the characters wish they didn't know. A degenerating move is introducing a map that just explains where the villains are hiding. The Engine dictates which retcons are "deepening the lore" and which are "fixing a mistake."

  **Progressive Shift $\rightarrow$ Generative Worldbuilding**
  The series is progressive when the rules you set in Book 1 generate plot points in Book 6 that you didn't explicitly plan but feel inevitable. The world seems to expand outward. You discover new implications of the magic system that open up fresh conflict. The reader feels the world is larger than the page. The "predictions" here are narrative expectations: you set up a tension in Book 2 that pays off in Book 5 in a way that surprises the reader but satisfies the internal logic.

  **Degenerating Shift $\rightarrow$ Narrative Debt**
  The series is degenerating when every new book exists primarily to explain away contradictions in the previous books. You introduce a new magic rule solely to fix a plot hole in Book 3. You add a secret society to explain why the King didn't act in Book 2. The "belt" gets thick and clunky. The story stops moving forward and starts circling the drain of its own continuity. You are plugging leaks, not sailing.

  ***

  ### Part 2: The Residue Report

  Here is what happened during the translation.

  **What Came Across Cleanly**
  The structural hierarchy maps perfectly. Every series writer knows the difference between breaking a rule (Iron Canon) and adjusting a detail (Soft Continuity). The distinction between *Generative Worldbuilding* (Progressive) and *Narrative Debt* (Degenerating) is immediately recognizable to anyone who has edited a draft. We know the feeling of a plot point clicking into place because the world supports it, versus the feeling of hammering a square peg into a round hole and painting over the splinters.

  **What I Had to Fudge**
  The **Negative Heuristic**. In science, the Negative Heuristic is a methodological choice: "We *could* test gravity here, but we won't, because we assume it holds." In fiction, testing the Iron Canon isn't a methodological choice; it's a breach of contract. If you write a scene where resurrection is attempted and fails, that's fine. If you write a scene where it succeeds, the book is mislabeled. The "protection" of the core in fiction is ethical and commercial, not just methodological. I had to soften the idea of "refusing criticism" to "refusing betrayal."

  **What Has No Counterpart**
  **The Independent Arbiter.** This is the residue you suspected.
  In Lakatos's picture, Science is trying to map a territory that exists whether the scientist is there or not. If the Protective Belt gets too thick, Nature eventually screams "No." The data refuses to fit. The world embarrasses the theory.

  In your picture, the territory *is* the map. The world cannot scream "No." The Northern Coast cannot tell you that you moved it fifty miles east in Book 5. The magic system cannot tell you that you violated its thermodynamics. The only thing that can embarrass you is the *reader*, or your own memory, or the internal consistency of the text itself. But the text is your creation. You are the god of that universe. There is no external reality to check your hubris.

  ***

  ### Part 3: The Straight Answer

  You asked: *If there's no fact of the matter about my world independent of what I write, does "progressive" just collapse into "still selling"?*

  **No. But it collapses into "still convincing."**

  If "progressive" meant "discovering truth about an independent reality," then yes, in fiction, that category is empty. But in Lakatos's actual framework, "progressive" isn't about Truth with a capital T; it's about **predictive power and coherence.**

  In your series, "progressive" translates to **narrative momentum.**
  A series is progressive when the internal logic generates new story faster than you have to patch old story. It feels like discovery. You, the author, feel like you are uncovering the world, not inventing it. The readers feel this too. They trust the world.

  A series is degenerating when the internal logic requires more energy to maintain than it produces in story. You are spending all your creative capital on maintenance. The readers feel this too. They sense the seams. They stop trusting the world.

  **Does it collapse into sales?**
  No. You can sell massively while degenerating. *Star Wars* prequels sold huge. *Matrix* sequels sold huge. They were degenerating shifts—patching holes, adding rules to fix rules, explaining away emotional beats with lore dumps. They lost the "generative" spark. They stopped feeling like the world was alive and started feeling like a machine being kept running.

  Conversely, you can be progressive and sell poorly. A book that opens up profound new thematic territory based on established rules might flop commercially but be regarded as "pure" later.

  **The Verdict on Your Suspicion**
  You are right that the lack of an independent world removes the *hard* stop. Science eventually hits a wall of physical impossibility. Fiction only hits a wall of reader patience.

  However, the distinction still does work. It just measures **Internal Integrity** rather than **External Truth.**
  *   **Progressive:** The world feels bigger than the text. The rules create the plot.
  *   **Degenerating:** The text feels bigger than the world. The plot creates the rules.

  If you find yourself writing Book 7 primarily to explain why Book 4's ending wasn't a contradiction, you are degenerating, regardless of sales. If you find Book 7 exploring a consequence of Book 1's magic that you never planned but now feels inevitable, you are progressive.

  The "embarrassment" doesn't come from the world turning out otherwise than you wrote it. It comes from the reader realizing *you* know it's otherwise, and writing it anyway. The "fact of the matter" isn't in the soil of your fantasy continent; it's in the trust between you and the reader. When you switch from exploration to patching, that trust erodes. That is the only reality check you have.
