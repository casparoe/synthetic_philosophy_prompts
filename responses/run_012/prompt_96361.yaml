  2.  **Deconstruct Lakatos's MSRP:**
      *   *Hard Core:* Irrefutable assumptions (e.g., Newton's laws).
      *   *Protective Belt:* Auxiliary hypotheses adjusted to save the core (e.g., orbit calculations, unseen planets).
      *   *Negative Heuristic:* Don't test the core.
      *   *Positive Heuristic:* How to develop the program (what problems to solve).
      *   *Progressive:* Predicts novel facts, expands knowledge.
      *   *Degenerating:* Only explains past anomalies via ad-hoc patches, no new predictions.
