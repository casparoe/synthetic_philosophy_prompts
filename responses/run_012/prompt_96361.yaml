      *   *Hard Core* $\rightarrow$ **The Prime Directives / The Iron Canon.** (e.g., "No resurrection," "The Map is Fixed"). These are the promises made to the reader in Book 1 that cannot be broken without breaking the contract.
      *   *Protective Belt* $\rightarrow$ **Continuity & Lore.** (e.g., dates, names of minor kings, specific geography of the northern coast). This is where retcons live.
      *   *Negative Heuristic* $\rightarrow$ **The "Don't Look There" Rule.** You don't write a scene that directly challenges the Iron Canon. You steer plots away from testing the resurrection rule.
      *   *Positive Heuristic* $\rightarrow$ **The Story Engine.** What kind of stories *should* this series tell? (e.g., "Exploration," "Family Legacy"). It guides where to expand next.
