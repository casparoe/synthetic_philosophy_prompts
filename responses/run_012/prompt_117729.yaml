answer: |-
  **Credence:** **0.30**
  *(Probability that PMI is a "good" argument by your specific definition of forcing a drop from 0.9 to $\le$ 0.5)*

  ### Decomposition

  1.  **Discarded vs. Refined Posits:** **0.40**
      History shows significant mathematical and structural retention (e.g., Fresnel to Maxwell) rather than total ontological slaughter, blunting the inductive force.

  2.  **Selective/Structural Realism Viability:** **0.70**
      These frameworks successfully isolate the "working posits" that survive theory change, allowing a realist to maintain credence > 0.5 despite ontological shifts.

  3.  **Reference Class Objectivity:** **0.80**
      Identifying "mature theories" that failed relies heavily on hindsight bias, making the inductive base cherry-picked and statistically invalid for predicting current theory failure.

  4.  **Ontological vs. Epistemic Scope:** **0.50**
      PMI demonstrates that high confidence is risky, but it does not logically mandate that agnosticism (0.5) is the only rational alternative to certainty (0.9).

  ### How They Combine
  I treat these as defensive layers for the realist. The high probability that the **Reference Class** is biased (0.80) undermines the premise of the induction itself. Even if the premise holds, the **Structural Realism** defense (0.70) allows a realist to concede ontological error without abandoning truth-approximation. Because the argument fails to break through these two layers, it cannot force the drastic credence drop you defined; it might lower confidence from 0.9 to 0.7, but rarely to 0.5. The low score on **Discarded Posits** (0.40) further suggests the historical data doesn't support the "total loss" narrative required for such a steep drop.

  ### Sensitivity Analysis
  My number is most sensitive to **Question 3 (Reference Class Objectivity)**.
  If you could demonstrate a non-question-begging, ahistorical method to identify "mature theories" that *still* resulted in total abandonment, the PMI would become devastating. The current consensus is that we only identify theories as "mature but false" because we already know they are false; if that hindsight bias is removed, the inductive sample size shrinks to near zero, collapsing the argument.

  ### Classic PMI vs. "Unconceived Alternatives"
  The newer **"New Induction" (Kyle Stanford's Unconceived Alternatives)** is **stronger** than the classic historical PMI.
  Classic PMI relies on looking backward at known failures (vulnerable to the reference class/hindsight objection). Stanford's argument looks forward: it claims we lack the cognitive capacity to conceive of the viable alternatives to our current theories that future scientists will find. This bypasses the "hindsight" critique because it doesn't rely on listing past failures, but rather on the documented history of scientists failing to imagine successors that were later proven true. It attacks the *current* epistemic position rather than the *past* track record.

  ### What Would Actually Move Me
  To shift my credence that PMI *is* a good argument (up toward 0.6+), I would need a **demonstration of structural discontinuity**.
  Most realists concede ontology changes but hold that the *mathematical structure* is preserved (e.g., Newtonian gravity is a limit case of General Relativity). If you could point to a case where a theory was empirically successful, considered "mature," and then replaced by a successor that shared **no** mathematical structure or limiting-case relationship (total structural incommensurability), the Structural Realist defense would fail. Without that, realism can always retreat to "we got the structure right, even if the stuff is wrong," keeping credence above 0.5.
