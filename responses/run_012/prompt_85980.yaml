prompt: |-
  I chair the accommodations committee at a large public university, and we are being asked, dozens of times a term, to approve or refuse the use of external aids — phones, personal notebooks, task managers, AI assistants, human support workers — during proctored, closed-book exams. Our current practice is ad hoc, and we lose appeals because we cannot explain why two similar requests came out differently. Please turn the extended mind thesis into a decision procedure we can actually run, one request at a time, in about ten minutes, and write up so that a committee member with no philosophy training could reach the same result from the same file.

  Start from the conditions that literature standardly imposes — that the resource be reliably available and routinely used, that what it returns be taken at face value rather than checked, and that it be retrievable without effort — and add a fourth test our own draft proposes: that the student be able to notice and correct the aid's failures unaided. The procedure should say which questions to ask in what order, what counts as a sufficient answer to each, where it terminates in a refusal, and where it must hand the decision to a person because the question at issue is a value judgment about what an exam is for. It should not be so permissive that anything a student happens to consult counts as part of their mind.

  One of my colleagues argues that if we concede that an aid is part of the student's cognition, we must also hold the student answerable for whatever the aid produces, errors included. The procedure needs to say whether that consideration tells in favour of granting fewer accommodations or more.

  Then run it on three requests: a student with ADHD whose entire working system is a phone-based task manager they maintain with a support coach; a student who wants to bring a general-purpose AI assistant they cannot inspect and whose outputs they do not understand; and a blind student requesting a screen reader, where I suspect our whole framework is the wrong one. Close by telling me what the procedure cannot decide and where it will misfire.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Chair of the Accommodations Committee at a large public university.
      *   **Problem:** Ad hoc decision-making on external aids (phones, notebooks, AI, humans) during proctored exams leads to inconsistency and lost appeals.
      *   **Goal:** Create a decision procedure based on the *Extended Mind Thesis* (EMT) that can be run in ~10 minutes per request by non-philosophers.
      *   **Constraints:**
          *   Must use standard EMT conditions (reliability, routine use, face-value acceptance, easy retrievability).
          *   Must add a 4th condition proposed by the committee draft: *Ability to notice and correct failures unaided.*
          *   Must specify order of questions, sufficiency criteria, termination points (refusal vs. human judgment).
          *   Must address the colleague's argument: If an aid is part of cognition, is the student answerable for its errors? Does this argue for fewer or more accommodations?
          *   Must test the procedure on three cases: ADHD + Task Manager, General AI, Blind Student + Screen Reader.
          *   Must conclude with limitations (what it can't decide/where it misfires).
      *   **Tone:** Administrative, clear, actionable, philosophically grounded but accessible.

  2.  **Deconstruct the Extended Mind Thesis (EMT) for this Context:**
      *   *Core Idea (Clark & Chalmers):* Cognitive processes aren't just in the head; they can extend into the world if the external resource functions like an internal process.
      *   *Standard Criteria (Parity Principle):*
          1.  *Reliability:* Is it always there when needed?
          2.  *Routine Use:* Is it automatically trusted/used?
          3.  *Face Value:* Is the info accepted without second-guessing?
          4.  *Easy Retrieval:* Is it easy to access?
      *   *Committee's 4th Criterion:* *Metacognitive Oversight:* Can the student detect/correct errors without external help? (This is crucial for accountability).

  3.  **Address the Colleague's Argument (Accountability):**
      *   *Argument:* If aid = mind, student is responsible for aid's output (errors included).
      *   *Implication:* Does this mean fewer accommodations (because it's risky/unfair) or more (because it recognizes the aid as integral)?
      *   *Analysis:* If the aid is *truly* part of the cognitive system (per EMT), the student *should* be responsible. However, if the student *cannot* verify the output (e.g., black-box AI), they cannot be responsibly held accountable. Therefore, the accountability criterion acts as a *filter*. It argues for *fewer* accommodations for opaque tools (like black-box AI) but *more* protection for transparent tools that function as genuine cognitive extensions (like a notebook or screen reader). It pushes us to deny aids where the student cannot exercise ownership over the output.

  4.  **Drafting the Decision Procedure (The "EMT-A Protocol"):**
      *   *Structure:* Needs to be a flowchart or step-by-step checklist.
      *   *Time Limit:* ~10 minutes.
      *   *Audience:* Committee members (administrators, faculty, students), not philosophers.
      *   *Steps:*
          1.  **Documentation Check:** Is there medical/professional evidence of routine use?
          2.  **Reliability & Retrieval:** Is it physically/technically stable and easy to access?
          3.  **Trust & Face Value:** Does the student treat it as truth/memory?
          4.  **Metacognitive Oversight (The 4th Test):** Can they spot errors?
          5.  **Exam Integrity Check (Value Judgment):** Does this bypass the specific skill being tested?

  5.  **Refining the "Value Judgment" Hand-off:**
      *   The EMT tells us *if* something is part of the mind. It doesn't tell us *what* the exam is supposed to measure.
      *   *Example:* If the exam tests "mental arithmetic," a calculator (even if reliable/trusted) is excluded not because it's not cognitive, but because it defeats the learning objective.
      *   *Procedure:* If Steps 1-4 pass, but the aid fundamentally alters the construct being measured, flag for Faculty/Committee Chair review.

  6.  **Running the Test Cases:**

      *   *Case 1: ADHD + Phone Task Manager.*
          *   Reliability: High (always has phone).
          *   Routine: High (used daily with coach).
          *   Face Value: High (trusts the list).
          *   Oversight: High (student knows the tasks, just needs tracking).
          *   Integrity: Does the exam test "memory of tasks" or "knowledge of subject"? Usually subject.
          *   *Verdict:* Approve.

      *   *Case 2: General AI Assistant.*
          *   Reliability: Variable (server down, hallucinations).
          *   Routine: Maybe new.
          *   Face Value: Risky (hallucinations).
          *   Oversight: **FAIL.** Student admits they don't understand the output. Cannot correct errors.
          *   *Verdict:* Refuse. (Colleague's point holds: you can't be responsible for what you can't check).

      *   *Case 3: Blind Student + Screen Reader.*
          *   Reliability: High.
          *   Routine: High.
          *   Face Value: High.
          *   Oversight: High (they know what they wrote/listening for).
          *   *Problem:* The prompt suggests the framework might be wrong here. Why? Because a screen reader isn't just an "aid"; it's a *translation layer* for access. Applying the EMT "is this part of their mind?" feels redundant or even demeaning. It's a sensory bridge, not necessarily a cognitive extension in the same way.
          *   *Verdict:* Approve, but note that EMT is the wrong lens. This is an *Access* issue, not an *Accommodation* issue.

  7.  **Addressing the Limitations (The "Misfire"):**
      *   EMT is descriptive (how cognition works), not normative (what is fair).
      *   It struggles with *sensory* impairments vs. *cognitive* extensions.
      *   It struggles with *construct validity* (what is the exam actually testing?).
      *   It might be too rigid for novel technologies.

  8.  **Review and Refine:**
      *   *Check against constraints:* Did I include the 4th test? Yes. Did I address the colleague's argument? Yes. Is it 10 minutes? Yes (checklist format). Are the cases run? Yes.
      *   *Tone Check:* Needs to be authoritative but practical.
      *   *Self-Correction on Case 3:* I need to be careful not to say "EMT doesn't apply" so strongly that it undermines the procedure. I should frame it as: The procedure *passes* the screen reader, but the *justification* is actually Civil Rights/Access law, not EMT. The procedure shouldn't block it, but the committee should know EMT isn't the primary ethical driver there.
      *   *Refining the Colleague's Point:* Make sure to explicitly state that the "Accountability Condition" (Test 4) is the mechanism that answers the colleague. If they can't correct it, they aren't answerable, so it's not part of their mind *for exam purposes*.

  9.  **Final Polish:** Organize into clear sections: Introduction, The Protocol, The Accountability Clause, Case Studies, Limitations. (Proceed to generate output).

  *(Self-Correction during drafting)*: Wait, the prompt asks specifically about the colleague's argument: "whether that consideration tells in favour of granting fewer or more accommodations." I need to be precise. If we hold them answerable, we might deny aids they can't control (Fewer). But if we accept the aid as *them*, we must allow it if it's their primary mode of thinking (More). The resolution is: It grants *more* legitimacy to established aids (notebooks) but *fewer* permissions for opaque aids (AI). I will clarify this nuance.

  *(Final check on Case 3)*: The prompt says "I suspect our whole framework is the wrong one." I need to validate the Chair's suspicion in the conclusion, not just in the case study. The case study should show it *passes* the test, but the conclusion should explain *why* passing the test feels weird.

  Let's write it.cw
answer: |-
  # The Extended Mind Accommodation (EMA) Protocol
  **Version 1.0 | For Committee Use Only**

  ## Purpose
  To provide a consistent, defensible, and time-efficient method for evaluating requests to use external aids during proctored examinations. This protocol operationalizes the *Extended Mind Thesis* (EMT) to determine if an external tool functions as part of the student's cognitive system.

  **Time Required:** ~10 minutes per request.
  **User:** Any committee member (no philosophy training required).

  ---

  ## Part 1: The Accountability Clause
  *Addressing the colleague's concern regarding student responsibility.*

  **The Question:** If we rule an aid is "part of the student's mind," does the student bear responsibility for its errors?
  **The Ruling:** **Yes.**
  **Implication for Decisions:** This consideration argues for **fewer** accommodations regarding opaque tools (e.g., generative AI) but **more** protection for transparent tools (e.g., notebooks, established software).

  *   **Reasoning:** A tool is only part of the cognitive system if the user maintains "metacognitive oversight." If the student cannot verify the tool's output, they cannot be held answerable for it. If they cannot be held answerable, the tool is not functioning as *their* mind; it is functioning as a proxy. Proxies are not permitted in closed-book exams.
  *   **Action:** Use **Test 4 (Oversight)** below as the gatekeeper. If the student cannot detect/correct the aid's failure, the request is refused, regardless of how useful the aid is.

  ---

  ## Part 2: The Decision Procedure
  *Complete this checklist in order. If any test results in a "FAIL," stop and issue a Refusal.*

  ### Step 1: Documentation of Routine & Reliability
  *Does the evidence show this tool is a stable part of the student's daily cognitive workflow?*

  *   **Ask:** Is there professional documentation (medical, psychological, or specialist report) confirming the student uses this tool daily for learning, not just for exams?
  *   **Sufficient Answer:** "Yes. The documentation confirms the student has used this specific system for [X months/years] across multiple courses."
  *   **Insufficient Answer:** "The student says they prefer it," or "They bought it last week for this exam."
  *   **Outcome:**
      *   **NO:** **REFUSE.** (Reason: Ad hoc tool, not cognitive extension).
      *   **YES:** Proceed to Step 2.

  ### Step 2: Retrieval & Face-Value Trust
  *Is the tool accessed automatically and trusted implicitly?*

  *   **Ask:** Does the student access the tool without deliberation (like recalling a memory), and do they accept the information provided without independent verification?
  *   **Sufficient Answer:** "Yes. The student treats the tool as a primary memory store. They do not cross-check it with other sources during study."
  *   **Insufficient Answer:** "They use it sometimes," or "They check Google to make sure the app is right."
  *   **Outcome:**
      *   **NO:** **REFUSE.** (Reason: Tool is a reference source, not a cognitive extension).
      *   **YES:** Proceed to Step 3.

  ### Step 3: Metacognitive Oversight (The 4th Test)
  *Can the student identify and correct the aid's failures unaided?*

  *   **Ask:** If the tool provides incorrect information or malfunctions, does the student have the internal knowledge to notice the error and correct it without asking another person or consulting a second external source?
  *   **Sufficient Answer:** "Yes. The student understands the content well enough to know when the tool is wrong (e.g., a calculator giving an impossible number, a task list showing a completed task as pending)."
  *   **Insufficient Answer:** "No. If the AI writes an answer, the student accepts it," or "If the app crashes, they cannot reconstruct the data."
  *   **Outcome:**
      *   **NO:** **REFUSE.** (Reason: Student cannot be held answerable for the output; violates Accountability Clause).
      *   **YES:** Proceed to Step 4.

  ### Step 4: Construct Validity Check (Value Judgment Hand-Off)
  *Does allowing this aid defeat the specific learning objective of the exam?*

  *   **Ask:** Is the exam designed to test the *internal* cognitive process that the aid now performs? (e.g., An exam testing "mental arithmetic" vs. "mathematical reasoning").
  *   **Sufficient Answer:** "No. The exam tests subject mastery, not the unaided recall/organization that the aid provides."
  *   **Insufficient Answer:** "Yes. The exam specifically measures working memory or unaided calculation."
  *   **Outcome:**
      *   **NO:** **APPROVE.** (The aid is part of the mind, and the exam tests subject knowledge).
      *   **YES:** **HAND OFF TO CHAIR/FACULTY.** (This is not an EMT question; it is a curriculum design question. The committee cannot override faculty on learning objectives, but must note the conflict).

  ---

  ## Part 3: Protocol Test Runs

  ### Case 1: Student with ADHD + Phone Task Manager
  *Request:* Use of a specific phone-based task management app, maintained with a support coach, during exams to track question progress and time management.

  *   **Step 1 (Routine):** **PASS.** Documentation confirms 2 years of daily use with coaching support.
  *   **Step 2 (Trust):** **PASS.** Student treats the list as their "external working memory." They do not double-check the list against a paper planner.
  *   **Step 3 (Oversight):** **PASS.** If the app fails to save a task, the student knows they did it (internal memory of action) and can manually note it. They understand the *tasks*, the app only tracks *status*.
  *   **Step 4 (Construct):** **PASS.** The exam tests subject knowledge, not the ability to remember which question they are on.
  *   **Decision:** **APPROVE.**
  *   **Rationale:** The app functions as an external prefrontal cortex. The student retains ownership of the content.

  ### Case 2: Student + General-Purpose AI Assistant
  *Request:* Use of a generative AI tool during a closed-book essay exam to "organize thoughts."

  *   **Step 1 (Routine):** **FAIL/UNCLEAR.** AI use is recent. Documentation is vague on "routine cognitive integration."
  *   **Step 2 (Trust):** **PASS.** Student intends to trust the output.
  *   **Step 3 (Oversight):** **FAIL.** Student admits they "cannot always inspect" the logic and "do not understand" how the AI reaches conclusions. If the AI hallucinates a fact, the student cannot detect it unaided.
  *   **Decision:** **REFUSE.**
  *   **Rationale:** Fails the Accountability Clause. Because the student cannot verify the output, the AI is not an extension of *their* mind; it is a surrogate. Allowing it would make the student answerable for cognition that is not theirs.

  ### Case 3: Blind Student + Screen Reader
  *Request:* Use of standard screen-reading software during a proctored digital exam.

  *   **Step 1 (Routine):** **PASS.** Essential daily tool.
  *   **Step 2 (Trust):** **PASS.** Student relies on it for text access.
  *   **Step 3 (Oversight):** **PASS.** If the reader mispronounces a word, the student can infer the correct word from context (linguistic competence remains internal).
  *   **Step 4 (Construct):** **PASS.** The exam tests knowledge, not the ability to see ink on paper.
  *   **Decision:** **APPROVE.**
  *   **Rationale:** Passes all EMT criteria.
  *   **Note:** While it passes the protocol, see *Limitations* below regarding why this framework feels inadequate for this case.

  ---

  ## Part 4: Limitations & Misfires
  *Where the Committee must exercise caution.*

  **1. The "Access vs. Extension" Misfire (Case 3)**
  The EMT framework is designed for *cognitive enhancement or compensation* (e.g., memory aids). It is the wrong ethical framework for *sensory access* (e.g., screen readers, Braille displays).
  *   **The Risk:** Applying the EMT to a blind student implies their cognition is "extended" only when using the reader. In reality, the reader is a *translation layer* required for basic participation.
  *   **The Fix:** If a request concerns a sensory impairment covered by civil rights law (ADA/Equality Act), **bypass this protocol.** Grant the accommodation based on access rights, not EMT. Use this protocol only for *cognitive* aids (memory, organization, calculation).

  **2. The "Construct Validity" Black Box (Step 4)**
  This protocol cannot decide what an exam *ought* to test.
  *   **The Risk:** A faculty member may claim an exam tests "unaided recall" to block a legitimate cognitive aid.
  *   **The Fix:** When Step 4 triggers a Hand-Off, the Committee must require the Faculty to provide a written pedagogical justification for why the *process* (unaided recall) is more important than the *outcome* (subject mastery).

  **3. The "Novel Tech" Lag**
  *   **The Risk:** New tools (e.g., neural interfaces, advanced AR) may not fit the "Routine Use" criteria immediately.
  *   **The Fix:** Allow a "Provisional Approval" status for one term if Step 1 is weak but Step 3 (Oversight) is strong, contingent on a review of usage logs.

  **4. The Accountability Paradox**
  *   **The Risk:** Strict application of Step 3 (Oversight) may disadvantage students with severe cognitive impairments who *need* opaque aids because they cannot self-monitor.
  *   **The Fix:** In cases of severe impairment, shift the burden. If the student cannot monitor the aid, can a *proctor* or *support worker* monitor it for them without providing content help? If yes, approve with human monitoring. If no, the aid is incompatible with a closed-book format, and an *alternative assessment format* (take-home, oral) should be recommended instead of a refusal.

  ---

  **Committee Chair Note:** This procedure protects the integrity of the exam while respecting the reality of modern cognition. It prevents us from approving "black box" tools that compromise accountability, while securing the rights of students whose tools are genuinely integrated into their thinking. Use it consistently.
