          *   Pragmatic Encroachment: The function takes a `riskProfile` argument. `checkHealth(riskProfile)`.
      *   *Verdict:* The user's gut is *mostly* right but misses the semantic vs. pragmatic distinction. In code, both look like config. In philosophy, one is about language (semantics), the other about reality (metaphysics/epistemology). I need to explain why this matters without using those words. It's about *where* the logic lives.

