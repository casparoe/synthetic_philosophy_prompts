      *   *Pragmatic Encroachment (Subject-Sensitive Invariantism):* Whether a subject *actually knows* depends on the *subject's* practical stakes. It's not just about the word "knows"; it's about the state of knowledge itself being sensitive to actionability.

  3.  **Drafting the Translation (SE Vocabulary):**
      *   *Knowledge:* A validated state, a passed test, a successful health check.
      *   *Belief:* A cached value, a local variable, an assumption.
      *   *Truth:* The actual state of the system (production reality).
      *   *Justification:* Logs, traces, metrics, successful assertions.
      *   *Contextualism:* The *monitoring dashboard* (the attributor) changes its alert thresholds based on who is looking at it. On-call engineer sees RED for the same metric that a PM sees GREEN.
      *   *Pragmatic Encroachment:* The *service itself* (the subject) changes its behavior/validity based on the cost of failure. A payment service requires stronger consistency (knows more) than a logging service. The *data* is only "valid" if it meets the SLO required for the action being taken.

