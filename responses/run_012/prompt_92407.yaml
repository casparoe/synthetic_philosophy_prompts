answer: |-
  1. Verify direct perception (*pratyaksha*) by inspecting raw data streams or physical evidence without intermediary filtering. For (a) you read live effluent sensor logs, while for (b) you demand raw payroll records rather than summary charts.

  2. Establish inference (*anumana*) by confirming the *vyapti* between evidence and claim using *tarka* to rule out any "deviating reason." For (a) you check if low turbidity always means safe chemicals, and for (b) you test if higher income would have happened anyway without the program.

  3. Use comparison (*upamana*) to match the subject against a known standard or similar case to identify hidden structural discrepancies. For (a) you match discharge metrics against a certified clean factory, and for (b) you compare grad income growth against a similar untrained cohort.

  4. Accept testimony (*shabda*) only from an *apta* (competent, honest witness) whose past statements have not proven false. For (a) you accept only licensed third-party auditors, and for (b) you trust only longitudinal surveys conducted by independent researchers.

  5. When the pramanas conflict or data is missing, you must personally reject the claim, knowing this protocol misfires on you if founders fabricate raw data entirely. For (a) you might pass if sensors are live, but for (b) you cannot certify the claim because counterfactuals are impossible to verify in half an hour.
