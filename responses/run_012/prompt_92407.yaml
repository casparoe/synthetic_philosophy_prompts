  Ok so I work at a small impact-investing fund — we put money into companies making social/environmental claims — and I'm the one who has to vet the factual claims in a pitch deck before the partners sign off. Stuff like "our wastewater discharge is within safe limits," "this training program raised grads' incomes by 20%," "our stoves cut indoor smoke deaths." Right now it's pure vibes, whoever's loudest in the room wins, and we've been burned twice already. We do maybe four of these a month and I've got about half an hour per claim, and I'm the one who has to defend the call if it blows up later.

  I keep thinking the classical Nyaya framework — the pramanas — is basically a vetting protocol that got formalized centuries ago and I want you to turn it into one I can hand to a junior analyst. I know it counts four independent means of knowing: perception, inference, comparison/analogy, and testimony from a reliable speaker. Keep all four in, including the analogy one even though my colleagues will roll their eyes at it — that's kind of the point. And I vaguely remember terms like vyapti (the pervasion between the reason and what you're proving), tarka (the counterfactual test you use to check it), and something about a "deviating" reason that ruins an inference — use that stuff, that's what I'm paying for. Please no reading list or citations, I can't go read anything, just give me the thing itself. And don't just say "check the source" — I need the actual characteristic failure mode of each pramana, so a non-philosopher can actually run the check.

  Give it to me as exactly five numbered items, no intro, no conclusion, one or two sentences each: the steps in order, and inside each step, in one more sentence, how it plays out on two claims — (a) "our factory's discharge is within safe limits" and (b) "our program raised graduates' incomes by 20%." Say in the relevant step where a step can't decide and a person has to, and be honest that at least one of those two claims the procedure will tell us we simply can't certify — even though the deal team will hate it. Also flag where the whole thing will misfire on you.
