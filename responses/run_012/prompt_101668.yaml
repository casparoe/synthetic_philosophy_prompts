answer: |-
  # Question-Period Preparation Sheet
  **Paper:** *The Inner Ostension Picture: Wittgenstein, Private Language, and Computational Content*
  **Audience:** Mixed (Wittgenstein Scholars, Kripkeans, Cognitive Scientists/Phil Mind)
  **Goal:** Deflect objections without over-defending; preserve the core bridge between PI and contemporary content theory.

  ---

  ### 1. The "Strawman" Objection (Cognitive Scientists/Phil Mind)
  **Likelihood:** Very High | **Damage:** High
  **Voice:** "No serious contemporary theory claims content is fixed by a private, phenomenological 'baptism.' We use causal, informational, or functional role semantics. You're attacking a Cartesian ghost that nobody in cognitive science believes in anymore. Why should we care that Wittgenstein refuted a view we abandoned forty years ago?"

  **2-Minute Reply:**
  "I agree that explicit 'private baptism' is rare in explicit theory. But I'm not attacking a historical doctrine; I'm attacking a *structural commitment* that survives in naturalized guises. When a Language of Thought hypothesis claims a primitive symbol gets its content by a causal correlation to a property, we must ask: what fixes *that* correlation as the right one? If the answer relies on the system 'registering' or 'tracking' that property in isolation from public practice, it inherits the inner ostension problem. The 'ghost' isn't in the phenomenology anymore; it's in the assumption that content can be fixed sub-personally by a one-off mapping relation. Wittgenstein's argument targets the *logic* of that mapping, not the phenomenology of the mapper."

  **Soft Spot:** You are stretching "ostension" to cover causal covariance.
  **Concede:** Concede that no one uses the *word* 'ostension' in computational theories. Insist the *structure* of the explanation (atomistic content fixation) is the target.

  ### 2. The "Anachronism" Objection (Wittgenstein Scholars)
  **Likelihood:** High | **Damage:** High
  **Voice:** "You're turning Wittgenstein into a contributor to the philosophy of mind industry he wanted to dissolve. By applying the PLA to computational theories, you're treating him as offering a counter-theory of content. Doesn't this violate the therapeutic aim of the *Investigations*? You're making him a theorist of the very thing he wanted to show was a confusion."

  **2-Minute Reply:**
  "I'm not attributing a positive theory of content to Wittgenstein. I'm attributing a *diagnostic* tool. The therapeutic aim is to show us why a certain picture holds us captive. That picture isn't just 1930s phenomenology; it's the picture that drives the search for naturalized content today. If cognitive science is held captive by the idea that symbols must get their meaning by correlating with items, then applying Wittgenstein's diagnosis there *is* the therapeutic move. I am not using Wittgenstein to build a better theory of content; I am using him to show why the demand for that kind of theory might be misguided."

  **Soft Spot:** It is hard to apply a therapeutic method without turning it into a theoretical premise.
  **Concede:** Concede that Wittgenstein wouldn't recognize "computational theory," but maintain the *picture* he attacked is identical in structure.

  ### 3. The "Skeptical Paradox" Objection (Kripkeans)
  **Likelihood:** Medium-High | **Damage:** Medium
  **Voice:** "On the Kripkean reading, the problem isn't psychological ostension; it's that *no* facts about an individual fix meaning. Your reading makes the problem too narrow. You think Wittgenstein is saying 'inner ostension fails,' but Kripke shows us 'outer ostension fails' too. By focusing on the inner picture, you miss the global skeptical paradox about rule-following."

  **2-Minute Reply:**
  "The Kripkean reading makes Wittgenstein a skeptic about meaning itself. My reading makes him a skeptic about a specific *explanation* of meaning. I argue the PLA is a *reductio* of the inner-ostension picture, not a proof that meaning is impossible. This preserves the normativity of meaning without accepting global skepticism. The 'skeptical paradox' arises precisely because we think meaning *must* be fixed by a fact (like a correlation). If we drop the inner-ostension picture, we don't need a skeptical solution; we just need to look at how language is actually used. My reading avoids the heavy metaphysical cost of the Kripkean paradox."

  **Soft Spot:** You risk appearing to dodge the normativity challenge Kripke highlights.
  **Concede:** Concede that Kripke identifies a real tension, but argue your reading dissolves the tension rather than solving it skeptically.

  ### 4. The "Sub-Personal Level" Objection (Cognitive Scientists)
  **Likelihood:** Medium | **Damage:** High
  **Voice:** "Wittgenstein is talking about persons and language games. Computationalism talks about sub-personal states in a neural network or a register. You can't apply a personal-level argument about 'following a rule' to a sub-personal causal process. That's a category mistake."

  **2-Minute Reply:**
  "It is a category mistake if the sub-personal states are merely causal levers. But representational theories of mind claim these states have *content*—they are *about* things. As soon as you claim a sub-personal state has semantic properties, you invite the question: what makes it accurate or inaccurate? That is a normative question, not a causal one. Wittgenstein's argument applies wherever normativity is claimed. If the computationalist says the symbol means 'red,' they owe an account of what makes that attribution correct. The personal/sub-personal distinction doesn't shield you from the demand for normative conditions."

  **Soft Spot:** Bridging the personal/sub-personal gap is notoriously difficult.
  **Concede:** Concede that Wittgenstein focused on persons, but insist that *content* is the level where the argument bites, regardless of implementation.

  ### 5. The "So What?" Objection (General)
  **Likelihood:** Medium | **Damage:** Medium
  **Voice:** "Okay, suppose you're right. Suppose Wittgenstein only refuted inner ostension. You say he leaves open the possibility of a private language. But if the argument doesn't rule out private language, what work is it doing? Why does this reading matter for cognitive science if the conclusion is 'maybe private thought is possible'?"

  **2-Minute Reply:**
  "It matters because it changes the research programme. If the PLA is a global impossibility proof, we just stop looking for private content. If it's a *reductio* of inner ostension, it tells us *how not to look*. It warns cognitive science against trying to ground content in isolated correlations. It forces us to look at holistic, practice-based, or inferential role accounts instead of atomistic mapping accounts. It's not about whether private language is possible; it's about ruling out the dominant mechanism by which people try to make it possible."

  **Soft Spot:** Your reading makes the PLA less dramatic (no impossibility proof).
  **Concede:** Concede the conclusion is less sensational, but argue it is more methodologically useful.

  ### 6. The "Textual Fidelity" Objection (Wittgenstein Scholars)
  **Likelihood:** Low-Medium | **Damage:** Low
  **Voice:** "You're leaning heavily on the 'diary' case in the *Investigations*. But Wittgenstein discusses private language in many places. Are you sure you aren't cherry-picking the passages that fit your 'inner ostension' thesis while ignoring the broader grammatical investigations?"

  **2-Minute Reply:**
  "I take the diary case to be the *central* engine of the argument, precisely because it isolates the inner-ostension picture most clearly. Other passages elaborate on the consequences of that picture failing. I'm not ignoring the broader grammar; I'm suggesting the inner-ostension critique is the key that unlocks the grammatical remarks. Without that key, the remarks look like a scattered attack on privacy. With it, they form a unified critique of a specific model of meaning."

  **Soft Spot:** Wittgenstein scholars hate "central engine" interpretations of PI.
  **Concede:** Concede that PI is not systematic, but maintain the diary case is the argumentative core.

  ### 7. The "Information-Theoretic" Objection (Cognitive Scientists)
  **Likelihood:** Low-Medium | **Damage:** Medium
  **Voice:** "Informational semantics (like Dretske or Fodor) fixes content via reliable causal chains, not ostension. A thermometer doesn't 'ostend' temperature; it covaries. Why doesn't a reliable causal chain solve the problem Wittgenstein raises?"

  **2-Minute Reply:**
  "Reliable covariance explains why a state occurs, but not why it *means*. A tree ring covaries with age, but it doesn't *represent* age unless interpreted within a system. Wittgenstein's point is that the correlation itself is inert without a rule for its use. Informational theories often smuggle in the 'use' by assuming the system is designed to represent. But that just pushes the question back: what fixes the design content? The inner-ostension problem re-emerges as the 'problem of misrepresentation' in informational theories."

  **Soft Spot:** Informational theories are robust; dismissing them quickly looks dogmatic.
  **Concede:** Concede informational theories handle *causation* well, but insist they struggle with *normativity* without practice.

  ### 8. The "Normativity without Practice" Objection (Phil Mind)
  **Likelihood:** Low | **Damage:** Low
  **Voice:** "You say we need public practice for normativity. But couldn't a solitary robot have internal consistency checks that serve as norms? Why does it *have* to be a community?"

  **2-Minute Reply:**
  "Internal consistency is just more syntax. A robot can check if state A follows state B, but what makes state A *about* the world? Consistency preserves structure, but it doesn't fix reference. Wittgenstein's point is that 'correctness' requires a distinction between 'seeming right' and 'being right.' In a closed system, whatever seems right to the system *is* right for the system. You need an external anchor to break that circle. I argue that anchor is public practice, not necessarily a 'community' in the sociological sense, but a shared form of life."

  **Soft Spot:** The "Community View" is controversial in Wittgenstein scholarship.
  **Concede:** Concede 'community' might be the wrong word; stick to 'publicly checkable practices.'

  ---

  ### The One Objection I Hope Nobody Asks
  **The "Level-Confusion" Trap:**
  **Question:** "If Wittgenstein is attacking a picture of how *speakers* fix meaning, and Computationalism is a theory of how *brains* process information, aren't you committing a mereological fallacy? You're applying a critique of personal-level intentionality to sub-personal mechanisms. If the brain doesn't 'mean' anything, but only the person does, then your attack on Computationalism fails because Computationalism isn't trying to explain person-level meaning fixation via ostension."

  **Why this is dangerous:** It severs the link between your Wittgenstein reading and your Cognitive Science critique. If the sub-personal level is immune to the PLA, your second half collapses.
  **Preparation:** If this comes up, do not try to solve the personal/sub-personal link fully. Instead, pivot: "If Computationalism claims to explain *thought*, and thought is normative, then the sub-personal mechanisms must constitute normative states. If they cannot, Computationalism is not a theory of thought, but merely a theory of causal processing. My argument forces that choice." (Force them to choose: either it's about content, in which case PLA applies, or it's just mechanics, in which case it's not a theory of mind).
