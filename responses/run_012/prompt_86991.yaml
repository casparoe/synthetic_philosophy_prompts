  The ditch smelled of wet canvas and churned earth. Hale lay between them, the radio handset still warm in her hand, staring up at the sliver of night sky visible between the banks.

  "One in three," Miller said. He was scraping mud off his boot knife, the rhythm steady. "You had four quarters. Red-Second, Red-HQ, Blue-Second, Blue-HQ. All equal. The voice just told you Red-HQ doesn't exist for you. Cross it out. You've got three squares left. Only one is Red. One in three."

  Vance was cleaning her rifle, movements slow, deliberate. "You're treating the message like a map correction. It wasn't. It was a conditional."

  "It eliminated a possibility, Vance. That's all that matters."

  "It eliminated a possibility *within* Red," Vance corrected. "It didn't touch Blue. Think about the weight. Before the call, Red versus Blue was even money. Fifty-fifty. The message said, 'If Red, then Second.' It didn't say, 'You are not in Red.' It didn't say, 'Blue is more likely.' It put a constraint on the Red territory, sure. But why would that constraint make Red less likely than Blue?"

  "Because Red just got smaller," Miller said. "Red used to be two chunks. Now it's one. Blue is still two chunks. You're telling me you'd bet on Red being just as likely as Blue when Red lost half its ground?"

  "I'm telling you the information didn't compare the two," Vance said. She stopped cleaning and looked at him. "You said 'nudge what's left as little as you possibly can.' That's minimum information. If you maximize entropy subject to the constraint 'If Red then Second,' the math keeps the Red-Blue ratio locked. It stays fifty-fifty. Your own principle gives you my number."

  Miller paused, the knife hovering over his boot. He frowned, doing the work in his head. "Minimum entropy... keeps the odds ratio..." He exhaled sharply. "Fine. If you treat it as a constraint on the distribution, sure, the ratio holds. But that assumes the radio operator was reading from a probability sheet. He wasn't. He was looking at a board."

  "So?"

  "So if he's looking at a board, and he says that, he knows I'm not in Red-HQ," Miller said. "It's not a constraint on my belief state; it's a fact about the world. He eliminated the square. When you eliminate a square, you renormalize. That's not entropy, that's counting."

  "Counting works if you know why the square got eliminated," Vance said. "Did he eliminate it because he saw you weren't there? Or did he say it because that's the only thing he was allowed to say? If I'm in Blue, does he still tell me 'If Red then Second'?"

  "Yes," Miller said. "Because it's true."

  "If it's true in Blue, and true in Red-Second, and false in Red-HQ... then hearing it tells you you're not in Red-HQ," Vance said. "But does it tell you anything about the relative weight of Red versus Blue? Imagine he had a rule: 'Always state a true conditional about the territory.' If you're in Blue, he could say 'If Red then Second.' If you're in Red-Second, he could say 'If Red then Second.' If you're in Red-HQ, he can't. So you know you're not in Red-HQ. But the likelihood of him speaking that specific sentence might be different depending on where you are."

  Miller shook his head. "You're inventing protocols. We don't know his rules. We know the statement is true. We know Red-HQ makes it false. So Red-HQ is out. One in three."

  "And I'm saying without the protocol, you can't know if the statement was *selected* to be said," Vance countered. "If he would have said something else when you were in Blue, then the odds shift. If he would have said the exact same thing regardless, the odds don't shift. We don't know which it is. You're assuming the 'elimination' model because it's cleaner. I'm saying the clean math is lying to you."

  Miller sheathed the knife. The silence stretched, filled only by the wind over the grass. He looked at Hale. "She needs a number, Vance. She's got to move."

  "She needs the truth," Vance said. "The truth is the math depends on a radio procedure we don't have."

  Miller rubbed his face. "Okay. Okay, I'll give you this: if we don't know his selection rule, the 'minimum nudge' argument does favor your fifty-fifty. I was too quick on that." He held up a hand before Vance could speak. "But. If I'm wrong and Red is actually one in three, and I bet on fifty-fifty, I'm walking into Red territory thinking it's safer than it is. If you're wrong and it's fifty-fifty, and I bet one in three, I'm treating Red as riskier than it is. Which error gets her killed?"

  Vance looked down at her rifle. "Assuming Red is smaller than it is... you might avoid it when you shouldn't. Assuming Red is larger... you might walk into it thinking it's clear."

  "The voice said he couldn't tell her where she was," Miller said quietly. "That implies he knows where she *isn't*. If he knows she isn't in Red-HQ, that square is dead. I don't care about the entropy. I care that the ground is gone."

  Vance held his gaze for a long moment. Then she nodded, just once. "If he knows her location, then elimination is valid. But we're assuming he knows. If he's just reading a general intel broadcast..."

  "We have to assume he knows," Miller said. "Because if he doesn't, we're blind either way. So I'm sticking with one in three. But I'll admit... it's not because the math forces it. It's because the survival logic does."

  Vance sighed, the tension leaving her shoulders. "Then we agree on the move. We just disagree on why."

  "Close enough," Miller said. He looked at Hale. "Don't trust the Red side too much. The map just got bigger."

  \answer{undetermined}
