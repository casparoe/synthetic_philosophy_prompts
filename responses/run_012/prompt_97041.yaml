answer: |-
  ### The setup
  You have a lump of clay and a statue constituted by it, occupying the same spatial region at the same time. The coincidentalist claims they are numerically distinct because they differ in modal properties: the lump could survive being squashed, while the statue could not. Despite this difference, they appear to share all their non-modal, physical properties.

  ### What the grounding problem is
  The grounding problem asks what metaphysical fact makes it the case that these two objects differ in their modal profiles. If the statue and the lump share every categorical, non-modal property—their mass, shape, location, and microphysical composition—there seems to be nothing in reality to anchor or ground the difference in their persistence conditions. The coincidentalist posits a modal difference without a corresponding non-modal difference, leaving the modal facts floating free of the categorical facts.

  ### Why brute modality is meant to be a cost
  In metaphysics, brute facts are generally viewed as theoretical vices because they halt explanation arbitrarily. If modal differences do not supervene on non-modal differences, then modality becomes unintelligible; two entities could be exactly alike in every actual respect yet differ in how they behave across possible worlds without any reason why. This violates a deep methodological commitment that the possible must be grounded in the actual, ensuring that modal truths are not merely primitive but explainable by the nature of reality.

  ### The Humean premise
  The objection does covertly rely on a supervenience principle that is Humean in spirit, though it is distinct from David Lewis's specific thesis on laws. The principle holds that there can be no difference in modal properties without a difference in non-modal, categorical properties, effectively demanding that modality be grounded in actuality. The objection needs this premise because, without it, the coincidentalist's brute modal difference is permissible; with it, the coincidentalist is contradictory. Whether this premise is defensible depends on one's tolerance for primitive essence: if one believes an object's kind is a fundamental feature of reality, the supervenience claim is too strong, but if one demands all truths reduce to qualitative categorical facts, the claim is indispensable. Thus, the objection is not a logical proof but a methodological challenge based on how much primitive modality one is willing to accept.

  ### Where this leaves the coincidentalist
  This leaves the coincidentalist in a difficult but not fatal position. The grounding problem does not prove coincidentalism false, but it demonstrates that the view incurs a significant theoretical cost by accepting brute modal facts or by stretching the definition of non-modal properties. It shows that constitution-is-not-identity is viable only if one is willing to reject strong supervenience principles or argue that sortal instantiation itself provides the necessary non-modal ground. Consequently, the debate shifts from a logical contradiction to a clash over methodological preferences regarding parsimony and grounding.

  ### The move I would make
  The strongest reply is to argue that instantiating a sortal concept, such as "being a statue," is itself a non-modal, categorical property that grounds the modal difference. On this view, the statue possesses the categorical property of *statuehood* while the lump possesses *lumphood*, and these distinct categorical kinds explain the divergent persistence conditions. The cost of this move is that it significantly expands the inventory of categorical properties to include kind-membership, which rivals may argue simply disguises the modal difference as a categorical one without truly solving the grounding issue.
