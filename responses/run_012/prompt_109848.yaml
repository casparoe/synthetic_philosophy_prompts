answer: |-
  - Bottom line: No reading of the slogan makes it straightforwardly true in a way that supports your friend's shrug. The plausible readings are too weak to dismiss the significance of the forgery, while the strong readings that would dismiss it are demonstrably false. The slogan conflates what we can detect with what actually exists, and this equivocation is where your friend's argument fails.

  - The slogan and the work it was doing: In the context of the argument, the sentence functions as a conversation-stopper intended to dissolve the scandal of the forgery. It claims that the historical provenance of the work is irrelevant because the aesthetic experience remains unchanged. By equating detectability with existence, it attempts to render the museum's discovery meaningless and suggest that the outrage over the forgery is merely pretentious.

  - The candidate readings:
      1.  **The Linguistic Stipulation:** This reading claims that the word "difference" is defined strictly as "a detectable variation in appearance." It suggests that if no test or eye can separate two objects, the language game we are playing does not permit us to use the word "difference." This makes the sentence a rule about vocabulary rather than a claim about the world.
      2.  **The Epistemic Constraint:** This reading claims that we are not entitled to believe or assert a difference that we cannot verify. It shifts the focus from the object to the observer, suggesting that while a physical difference might exist, it is irrational to act upon it or speak of it if it is permanently inaccessible to evidence. This makes the sentence a rule about justified belief rather than reality.
      3.  **The Phenomenological Identity:** This reading claims that the subjective visual experience provided by the two paintings is identical. It asserts that because the light hitting the retina is the same, the immediate aesthetic sensation is the same, regardless of the object's history. This makes the sentence a claim about the viewer's internal state rather than the canvas's properties.
      4.  **The Aesthetic Irrelevance:** This reading claims that artistic value resides exclusively in the visual surface, so historical origin cannot alter merit. It asserts that because the visual experience is identical, the worth of the object as a piece of art must also be identical. This makes the sentence a claim about where value is located within the artwork.
      5.  **The Ontological Verificationism:** This reading claims that undetectable physical differences do not actually exist in any meaningful sense. It asserts that if two objects share all observable properties, they are the same object for all philosophical purposes, rendering history metaphysically inert. This makes the sentence a claim about the fundamental nature of reality and identity.

  - Verdicts:
      1.  **Linguistic Stipulation:** This is trivial. It is true by definition if one accepts the stipulation, but it begs the question by refusing to acknowledge that "difference" often refers to history, not just appearance.
      2.  **Epistemic Constraint:** This is plausible but weak. It correctly notes we cannot know what we cannot test, but it does not prove the difference isn't there, only that we cannot claim knowledge of it.
      3.  **Phenomenological Identity:** This is plausible regarding raw sensation, but false regarding total experience. Knowledge of forgery often alters how we see the brushstrokes, changing the experience retroactively.
      4.  **Aesthetic Irrelevance:** This is highly contestable and likely false. Most art theory holds that context and origin are constitutive of artistic value, not merely additive to visual pleasure.
      5.  **Ontological Verificationism:** This is false. One object is a 17th-century artifact and the other is a 20th-century artifact; their causal histories are distinct physical facts regardless of visual similarity.

  - Which reading the slogan needs: To support the inference "so there was no difference" and justify your friend's shrug, the slogan needs the Ontological Verificationism or the Aesthetic Irrelevance reading. Only these claims are strong enough to erase the significance of the forgery scandal entirely. However, these are the least defensible readings; the defensible readings (Linguistic or Epistemic) admit a difference exists but suggest we ignore it, which does not license the claim that there *is* no difference.

  - What would settle it: This cannot be settled by empirical evidence, as both sides agree the paintings look alike. It requires a philosophical agreement on the purpose of art institutions: whether they are temples of visual stimulation or archives of human history. If art is purely visual, your friend wins; if art is a form of testimony, you win.
