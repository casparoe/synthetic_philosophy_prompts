prompt: |-
  I'm in the final year of a philosophy and economics degree and I'm taking a module on collective decision-making. For my portfolio I have to submit a short story of roughly 1,500 words that dramatises an information cascade, together with a structured note explaining precisely what the story encodes. I'd like you to write both.

  The story has to do its work through events, not exposition. Every character must be acting rationally: no one is a fool and no one is merely timid, and conformity has to be the best available move given what each of them can actually see. At some point the reader must be able to tell, from inside a character's head, that this character's choice carries no information at all about what they privately observed — and the character acts against their own evidence, correctly. The second decision in the story must be a genuine tie, settled by a convention, a habit or a coin, and the story must make plain that everything downstream hangs on how that tie was settled rather than on evidence. One character must hold private information decisive enough to break the sequence and stay silent for reasons that make sense from where they stand: don't write them as a coward or a villain. End with a coda in which the same private signals, differently ordered, produce the opposite collective outcome. Please avoid the two settings everyone reaches for — diners choosing between two restaurants, and traders in a market — and don't use the words 'cascade', 'herding' or 'Bayesian' anywhere in the story itself.

  Then append a JSON object with exactly these keys, and nothing outside it:

  ```
  {
    "title": "",
    "concept": "one sentence naming the phenomenon precisely enough to distinguish it from mere imitation or panic",
    "signal_structure": "the prior, the strength of a private signal, and who privately observed what",
    "decisions": [
      {"position": 1, "actor": "", "private_signal": "", "observed_before_deciding": "", "action": "", "why_rational": ""}
    ],
    "tie_break": "how the exactly indifferent second decision is resolved, and what that resolution licenses downstream",
    "uninformative_actions": "which later actions carry no information about their actor's private signal, and why",
    "fragility": "the reordering or single flipped signal used in the coda, and the opposite outcome it yields",
    "silent_holder": "who holds the decisive private information, why they stay silent, and what speaking would have changed",
    "idealisation_gaps": ["ways the story departs from the formal model, and settings where the mechanism would not hold at all"]
  }
  ```

  The summary is what I'll actually be marked on, so be exact — including about where the story is unfaithful to the model it is meant to illustrate.
