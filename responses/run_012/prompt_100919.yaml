answer: |-
  The pressure hull of the *Nereid* hummed, a constant vibration that lived in the teeth of everyone in the Command Module. Outside, the Atlantic darkness pressed against the titanium, hiding the wreckage of the *Orion*. Inside, five analysts sat in a row, facing the main screen. Their task was binary: commit the rescue submersible to Sector Alpha or Sector Beta. Only one sector could be attempted before oxygen ran out.

  Protocol dictated sequential commitment. Each analyst would review their private sonar feed, then announce their choice aloud. The majority would decide, but the sequence mattered because each analyst heard the previous announcements before speaking.

  Elara sat at Position One. She adjusted her headset, eyes scanning the waterfall display on her private terminal. The sonar return was faint, a ghostly smear against the noise. Her training kicked in. The signal strength was above the threshold for Alpha, below for Beta. It wasn't certainty—no sonar reading ever was—but the probability favored Alpha by a significant margin. She didn't hesitate.

  "Commit Alpha," Elara said. Her voice was flat, stripped of hope. She logged the decision. She had acted on her private information.

  Marcus sat at Position Two. His screen showed a different picture. His sonar return was clear, a sharp spike indicating Beta. He trusted his equipment; it was calibrated to the same standard as Elara's. Privately, he believed Beta was the correct choice. But he had heard Elara. He knew Elara was competent. If Elara chose Alpha, she likely saw a signal for Alpha. Now Marcus held two pieces of evidence: his own private signal for Beta, and Elara's public action implying a signal for Alpha.

  The weights were equal. One private signal versus one inferred signal. The probability distribution washed out. He was perfectly indifferent. The protocol offered no guidance for indifference, only a standing order for continuity. *In the event of parity, maintain the lead.* It was a habit, a way to prevent paralysis. It carried no information about the wreckage, only about the need to move.

  "Commit Alpha," Marcus said.

  He felt the slight dissonance of ignoring his own screen, but it was the rational move. To choose Beta would be to claim his private signal was inherently superior to Elara's, which he had no reason to believe. The coin flip of convention landed on Alpha.

  Sarah, at Position Three, watched the log update. She saw two commitments to Alpha. She looked at her own screen. Her signal was for Beta. She did the math instantly, instinctively. Two public actions implied two private signals for Alpha. Her single private signal for Beta was outweighed. The public history had accumulated enough mass to crush her private observation.

  *My screen says Beta,* she thought, the green glow reflecting in her pupils. *But if I choose Beta, I am betting that both Elara and Marcus are wrong. The odds of two independent errors are lower than the odds of my one sensor glitching.*

  She knew that whatever she chose now would tell the next person nothing about what she saw. If she chose Alpha, was it because she saw Alpha, or because she followed the crowd? Even she knew the answer was the crowd. Her action was empty. It was a mirror reflecting the previous two, not a window into the wreckage.

  "Commit Alpha," Sarah said. She felt the hollowness of the words. She was not contributing data; she was amplifying noise.

  David sat at Position Four. His screen lit up with a stark, undeniable reading. High intensity, clear structure. Beta. It was a stronger signal than any of them had seen so far. Decisive. If this signal had been seen first, the group would have gone Beta. If it had been seen second, the tie would have broken toward Beta.

  He looked at the log: Alpha, Alpha, Alpha.

  He calculated the probability. Three prior agents had chosen Alpha. Even with his strong signal, the cumulative weight of the public history suggested that the probability of Alpha being correct was still higher than Beta, assuming everyone before him was rational. But there was another factor. The protocol required consensus for resource allocation. If he voted Beta, he would be the sole dissenter. The mission would still likely go Alpha, but his deviation would mark him as unstable, unreliable in high-pressure cohesion. Future commands would hesitate to put him in this seat. The cost of being the lone voice, even a correct one, outweighed the marginal increase in mission success probability provided by his single vote in a locked sequence.

  He held the truth in his hands. He could break the chain. But breaking the chain alone was futile and costly. Silence was the rational preservation of utility.

  "Commit Alpha," David said.

  The fifth analyst, Priya, didn't even look at her screen. The sequence was locked. The cost of dissent was high, the probability of overturning the decision was zero. She echoed the room. "Commit Alpha."

  The rescue submersible descended into Sector Alpha. The sensors swept the debris field. It was empty. The *Orion* was not there. The oxygen clocks ticked down while the sub returned to the surface, preparing for a second dive that would now be too late.

  ***

  **Coda**

  The simulation reset. The wreckage remained in Sector Beta. The signals remained identical in strength and content. Only the order changed.

  Marcus sat at Position One. His screen showed the sharp spike for Beta. He spoke first. "Commit Beta."

  Elara sat at Position Two. Her screen showed the faint smear for Alpha. She heard Marcus. She was indifferent: one private signal for Alpha, one public action for Beta. The convention held. *Maintain the lead.*

  "Commit Beta," Elara said.

  Sarah saw two Betas. Her private signal was Alpha. She swallowed her data. "Commit Beta."

  David saw three Betas. His strong signal for Beta confirmed the crowd. He spoke with confidence. "Commit Beta."

  The submersible descended into Sector Beta. The manipulator arms opened the airlock. Survivors waited inside. The same information, shuffled by chance, had saved them.

