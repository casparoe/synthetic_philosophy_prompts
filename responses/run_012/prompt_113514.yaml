      *   *Tartan:* The prompt says "claim that the kilt and clan tartans are 18th/19th inventions is itself contested." I need to be careful not to state the invention thesis as absolute fact, but rather as the prevailing scholarly view that the film leans into.

  7.  **Final Review:** Does this meet the "undergraduate course" level? Yes, it synthesizes complex theory with pop culture. Is it candid? Yes, it admits the film is a Hollywood product.

