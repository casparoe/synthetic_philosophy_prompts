  What the method actually commits me to
  You are committing to a regimen of attention, not moral sainthood. The method requires you to define specific behavioral precepts for thirteen virtues, then cycle through them weekly. You commit to thirty minutes of nightly review, recording faults without excuse. It demands you accept that perfection is unlikely; the goal is iterative improvement. You agree to treat virtues as habits to be trained, not abstract ideals. Crucially, you commit to discretion—this is between you and the ledger. It is an empirical project: you are the specimen, the chart is the data, and the habit is the hypothesis. As a geologist, you know strata take time; this is stratigraphy of character. You are not seeking redemption, but reduction of error.

  The procedure
  1. **Setup:** In a discreet pocket notebook, list the thirteen virtues in Franklin's order. Number them 1-13 to track the cycle. Draw a grid: virtues down, days across. Define a specific precept for each. For Order, define it as "essential tools returned," not "house immaculate," to accommodate grandchildren. Write Franklin's definitions beside them.
  2. **Weekly Focus:** Assign one virtue per week. Cycle through all thirteen in a quarter. During "Silence" week, monitor speech intensely, but still mark faults for other virtues if glaring.
  3. **Daily Review (30 mins):** Sit alone after dinner. Sit in the same chair each night to build habit association. Spend 10 minutes reconstructing the day chronologically. Spend 10 minutes comparing actions against precepts. Spend 10 minutes planning tomorrow to avoid repeat faults.
  4. **Marking:** Place a black spot for each violation. A fault is an action or omission, not a fleeting thought or emotion. If you argue with your wife, mark Tranquility (if angry) or Sincerity (if deceitful).
  5. **Discretion:** Keep the book hidden. No discussion at the table. Your wife need not know you are scoring; you are simply journaling.
  6. **Cycle Review:** At week's end, tally spots. If a virtue is clean, acknowledge it. If spotted, note the context. Look for patterns: are faults clustering on weekends?
  7. **Restart:** After 13 weeks, begin again. The goal is fewer spots per cycle, not zero.
  8. **Precepts:** Define each virtue concretely. E.g., Industry: "Lose no time; be always employed in something useful." Reading philosophy counts as useful.
  9. **Failure Protocol:** If you miss a day, mark it as a fault against Resolution. Do not backfill data.
  10. **Privacy:** If asked, say you are tracking reading or health. The moral ledger is private.
  11. **Timing:** The 30 minutes is strict. If you spend 40, you violate Moderation. If you skip, you violate Resolution.
  12. **Tools:** Use a pen, not pencil; errors are part of the data. The notebook should be small enough to fit in a jacket pocket, large enough to write legibly.
  13. **Review Questions:** During the review, ask specific questions: "Did I speak to interrupt?" "Did I leave tools out?" "Did I eat beyond fullness?" Be forensic. Do not generalize. If you cannot remember, mark no spot; uncertainty is not guilt. The ledger is a record of known facts.

  The hard cases
  **Conflicts:** If virtues clash (e.g., Order vs. Grandchildren making mess), prioritize the virtue of the week unless Justice is violated. If Order is the focus, tidy later; if Justice is the focus, accommodate the kids. If Silence conflicts with Sincerity, Sincerity wins on truth, Silence on trivia.
  **Repeat Failures:** If you spot "Order" repeatedly after three cycles, do not drop it. Either refine the precept (make it achievable) or accept it as a permanent limitation. Distinguish between failing to try and failing despite trying. If a virtue remains spotted after three cycles, analyze the precept. Is it too vague? Is it culturally outdated? If you change it, write the old precept beside the new one to track the shift. This prevents moving the goalposts to avoid marks.
  **The Humility Loop:** If you feel proud of a clean Humility line, mark a fault against Humility. The feeling of superiority is the violation.
  **Changing the List:** Only after a full 13-week cycle. You may add or swap one virtue if a specific moral blind spot emerges (as Franklin did with Humility). Do not tweak mid-cycle to ease pressure.
  **Order Specifics:** Franklin never mastered Order. You shouldn't expect to either. If grandchildren disrupt your schedule, that is not a moral failure unless you promised otherwise. Adjust the precept: "Order within my study" vs "Order in the house."
  **Pride Specifics:** Franklin admitted pride was the hardest. If you catch yourself showing the book to someone to prove humility, that is a double fault.
  **List Changes:** Franklin added Humility last. You might add "Patience" if family dynamics demand it. But keep the core thirteen stable for comparison across cycles.

  Worked runs
  **Week 1 (Temperance):** Dinner with old colleagues. The wine pours. You feel the heat of the glass. You stop at one. You feel physical restraint, a tightness in the chest. Later, alone, you reconstruct the moment. You mark no spot. Next day, a celebration toast. You drink two. You mark the spot. You note it without guilt, just data. You see the ink dry. It feels manageable. The chart is not judging; you are.

  **Week 7 (Justice):** You promise to help a neighbor move. Saturday morning, your phone rings; grandchildren are arriving early. Your wife expects you to stay; she looks tired. You stay home. You mark Justice. You realize your "Order" of family time conflicts with external commitments. You must renegotiate promises beforehand. The spot stings because it was a choice, not an accident. You chose wife over neighbor. Was it Justice or Tranquility? You mark Justice. You keep the promise next time. You weigh the obligation. The neighbor hired movers anyway. You feel relief. That relief is the fault. You mark it.

  **Week 13 (Humility) - The Unwelcome Truth:** You have a clean sheet. You feel superior to your friends who lack discipline. You catch yourself thinking, "I'm finally mastering this." You mention your "discipline" to a friend over coffee. You see their eyes glaze; you are preaching. That night, you mark Humility. You realize the ledger is a mirror for vanity. You are optimizing for ink, not soul. The chart tells you that you are good at keeping charts, not necessarily being humble. You see the bookkeeping has replaced the morality. You are proud of your humility. That is the fault. You look at the clean line. It looks like success. But the feeling in your chest is warmth, not peace. It is pride. You realize Franklin warned of this. You mark the spot. The clean line is broken. You feel relief. The break is more honest than the line. You realize the method works only if you hate the spots more than you love the clean lines. If you love the clean lines, you are vain. The method has caught you. These runs show the progression from physical habit to social obligation to internal deception. The method gets harder as the virtues get subtler.

