      *   *Weaknesses:* Some manipulative things *are* robust to transparency (e.g., emotional appeals that work even when acknowledged). Some persuasive things *fail* under transparency (e.g., a surprise party? No, bad example. A logical argument that bores you once you know the structure? Maybe). The "Planted-Discovery" case is the biggest hole.

