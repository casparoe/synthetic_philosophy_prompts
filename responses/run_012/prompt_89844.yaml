  I'm a backend dev, no real philosophy background, just podcasts and a bad habit of buying books I don't finish, and for the last few months four of us at work have been doing a lunchtime reading group on Gödel, Escher, Bach, one chapter a month, very slow. Next week is the tangled hierarchies chapter, the one built around Escher's Drawing Hands, where each hand is drawing the other, so if you ask "which one is doing the drawing" you can chase it around the page forever and never land anywhere. What I actually took from it is the bit about the inviolate level: the loop only works because there's something outside it that isn't part of the tangle at all — the artist, the paper, the fact that it's just ink on a sheet — and that thing is never itself one of the hands. I want to close the last session by reading out a short poem about this, and I'd much rather it be an actual poem than a lecture with line breaks in it. So: write me one, 16 to 20 lines, and make the form do the work. Give it a repeating line that comes back every few lines and a rhyme scheme that eventually loops back so the last line lands on the first one and the whole thing reads like it closes on itself.

  Then the part I really care about: put exactly one line in there that sits outside that structure. It shouldn't carry the refrain, it shouldn't rhyme with anything, it should feel like it came from somewhere else entirely — and that line has to be the inviolate level, the thing that makes the loop possible precisely because it isn't inside it. No pun about self-reference, no mystical shrug at the end. I want someone who's actually read the chapter to be able to put a finger on that line and say yep, that's the one that's outside, and see why the two hands can never finish each other off from the inside no matter how long you let them go. Escher's hands can be in there as an image, and the Gödel thing is welcome too if it fits — a system rich enough to talk about itself ending up able to say something true about itself that it can't prove from the inside — but don't name-drop things that aren't in the book, because I won't be able to defend them when someone asks.

  After the poem, in 3 sentences max, tell me which line is the inviolate one and what would break if you tried to fold it back into the loop, since thats the bit I'm definately going to get asked about. And keep it short enough to read out loud in under a minute, we only have the room till 1:30.
