      *   Actually, the most precise technical answer for this specific "Queue" variant is that **Premise (3) fails because the decisions are not independent.** But Expected Utility Theory handles dependent events fine. The issue is that paying Mugger 1 doesn't stop Mugger 2.
      *   Okay, let's step back. The core of Pascal's Mugging is that $P \times U$ diverges.
      *   To stop it, either $P$ goes to 0 faster than $U$ goes to $\infty$, or $U$ is bounded.
      *   User wants to keep $P > 0$. So $P$ doesn't go to 0.
      *   Therefore, **$U$ must be bounded.**
      *   This means rejecting the implicit assumption in (2) that utility is linear/unbounded.

