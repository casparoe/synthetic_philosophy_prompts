answer: |-
  Here is a procedure designed for your constraints. It translates game theory and economic literature into an engineering checklist. It is built to be run in 30 minutes, uses data you likely have access to, and produces a binary recommendation with a clear "escape hatch" for leadership judgment.

  I call this **The Race Condition Audit**.

  ### The Procedure (30 Minutes)

  Do not start writing the one-pager until you have answered these five questions. If you cannot answer a question with data or a specific assumption, mark it as **Unknown** and escalate.

  #### 1. The Causality Check (Is the threat real?)
  *   **Question:** If we *do not* match this move, what is the specific mechanism of loss? (e.g., "Churn increases by X%," "CAC rises by Y%," "Hiring funnel drops by Z%").
  *   **Literature:** *Post hoc ergo propter hoc* fallacy / Correlation vs. Causation.
  *   **Sufficient Answer:** A quantified metric linking the competitor's action to your loss.
  *   **Fail Condition:** "We look behind," "Sales says it's harder," or "Everyone is doing it."
  *   **Result:** If **Fail**, recommendation is **Decline**. This is likely a rationalization for a desired change.

  #### 2. The Positionality Check (Is this a zero-sum game?)
  *   **Question:** Is the resource we are fighting over fixed (ranking, ad inventory, talent pool) or expandable (total market size, customer utility)?
  *   **Literature:** *Positional Goods* vs. *Absolute Goods*.
  *   **Sufficient Answer:** Identification of whether matching increases the total pie or just reshuffles it.
  *   **Fail Condition:** Treating an absolute good (product quality) as a positional good (feature parity).
  *   **Result:** If **Positional**, expect a *Race to the Bottom* (Moloch). If **Absolute**, matching is optional if you can differentiate.

  #### 3. The Escapability Check (Can we opt out?)
  *   **Question:** Can we differentiate enough that the comparison becomes irrelevant? (e.g., Higher price for higher security, slower speed for better support).
  *   **Literature:** *Differentiation Strategy* / Escaping the Prisoner's Dilemma.
  *   **Sufficient Answer:** A specific segment of customers who would *not* switch even if we don't match.
  *   **Fail Condition:** "Our product is a commodity."
  *   **Result:** If **Yes**, recommendation is **Hold/Differentiate**. If **No**, you are in a trap.

  #### 4. The Sustainability Check (Who bleeds first?)
  *   **Question:** If we match, how long can we sustain this cost compared to the competitor? (Cash runway, margin structure, hiring capacity).
  *   **Literature:** *War of Attrition*.
  *   **Sufficient Answer:** A timeline comparison (e.g., "They have 2x cash, we burn 3x faster").
  *   **Fail Condition:** Assuming the competitor is rational or has similar constraints.
  *   **Result:** If **You lose the attrition war**, recommendation is **Decline** (do not fight a war you cannot win) OR **Exit** (pivot market).

  #### 5. The Floor Check (Is there a hard constraint?)
  *   **Question:** Does this move violate a hard constraint (Security, Compliance, Core Culture, Solvency)?
  *   **Literature:** *Lexical Priorities* / *Deontological Constraints*.
  *   **Sufficient Answer:** Binary Yes/No.
  *   **Result:** If **Yes**, recommendation is **Decline**. If **No**, but the cost is high (e.g., margin drop, culture dilution), **Escalate to VP**. This is a values question, not an engineering one.

  ---

  ### The Output Format
  Your one-pager should not be an essay. It should be this table, filled out, followed by one of three recommendations:
  1.  **Execute:** The race is real, we can win, and the cost is acceptable.
  2.  **Decline:** The race is a trap, a rationalization, or unwinnable.
  3.  **Values Decision:** The math is neutral/negative, but survival/ethics require leadership judgment.

  ---

  ### Running the Audit on Your Three Scenarios

  Here is how this plays out on the specific situations you mentioned.

  #### Scenario 1: Ad Spend (CAC doubled, share flat)
  *   **1. Causality:** *Weak.* CAC is up industry-wide (auction inflation), but share is flat. Spending more buys clicks, not share. The mechanism of loss is not "competitor ads," it is "auction dynamics."
  *   **2. Positionality:** *High.* Ad inventory is a positional good. If everyone bids up, price rises, but relative position stays the same.
  *   **3. Escapability:** *Yes.* Organic channels, product-led growth, or niche targeting.
  *   **4. Sustainability:** *Negative.* If CAC doubles and LTV stays flat, unit economics break. You bleed cash faster than them.
  *   **5. Floor:** *No hard constraint, but solvency risk.*
  *   **Audit Verdict:** **Rationalization.**
  *   **Recommendation:** **Decline.**
  *   **Why:** This is the "Red Queen" effect. You are running faster to stay in the same place. The literature on auction theory suggests that bidding up on fixed inventory without conversion improvement is value destruction. Leadership likely wants growth and ads are the only knob they know how to turn.
  *   **The One-Pager Line:** "Increasing spend matches competitor noise but does not improve unit economics. This is a race to the bottom on margin with no gain in market share. Recommendation: Freeze spend, reallocate to conversion rate optimization."

  #### Scenario 2: Competitor Price Cut (-30%)
  *   **1. Causality:** *Medium.* Price-sensitive customers will churn. Enterprise customers likely won't.
  *   **2. Positionality:** *High.* Price is the ultimate positional good in a commodity market.
  *   **3. Escapability:** *Depends.* If you are differentiated (support, security, uptime), you can hold. If you are a feature-copy, you cannot.
  *   **4. Sustainability:** *Unknown.* Do they have VC money burning to kill you? Or are they desperate for cash?
  *   **5. Floor:** *Values Question.* Matching cuts margin. Not matching risks revenue.
  *   **Audit Verdict:** **Values Decision.**
  *   **Recommendation:** **Escalate to VP.**
  *   **Why:** This is a classic Prisoner's Dilemma. If you match, margins die. If you don't, you lose volume. There is no "correct" math answer; it depends on whether you want to be the "Premium Option" or the "Volume Leader."
  *   **The One-Pager Line:** "Matching preserves volume but destroys margin targets. Holding preserves margin but risks 10-15% churn in SMB segment. This defines our market positioning. Recommendation: VP to decide positioning strategy; Engineering will support either tiered pricing or feature gating."

  #### Scenario 3: Engineering Salary Bidding War
  *   **1. Causality:** *Strong.* If market rate is +20% and we don't match, hiring stops and senior staff leave.
  *   **2. Positionality:** *High.* Talent is a fixed supply in the short term.
  *   **3. Escapability:** *Low.* You cannot "differentiate" your way out of paying market rate for standard backend skills. Remote work makes the market global.
  *   **4. Sustainability:** *Painful but necessary.* You must align with market or your product quality degrades.
  *   **5. Floor:** *Solvency.* Can we afford it? If yes, we must pay.
  *   **Audit Verdict:** **Real Trap (Moloch).**
  *   **Recommendation:** **Execute (Pay Up).**
  *   **Why:** This is the Unilateralist's Curse / Tragedy of the Commons. One company bids up, everyone must match or lose quality. Everyone pays more, nobody gets better engineers (supply is inelastic). There is no clever fix.
  *   **The One-Pager Line:** "Labor market rates have shifted. Failure to match results in hiring freeze and attrition risk. This is a market-rate adjustment, not a perk war. Recommendation: Adjust bands to 75th percentile immediately to prevent capability degradation."

  ---

  ### What This Procedure Can't Do

  1.  **Predict Irrational Actors:** Game theory assumes rational agents. If a competitor is funded to lose money forever to kill you (predatory pricing), the Sustainability Check might fail to catch it until it's too late.
  2.  **Solve Culture:** It can flag when a decision *costs* culture (e.g., cutting QA), but it cannot calculate the long-term debt of that decision. That is still on the VP.
  3.  **Handle Black Swans:** It relies on available data. If the market shifts fundamentally (e.g., AI makes your core feature free), the "Causality Check" might be looking at the wrong variable.
  4.  **Stop the Pressure:** It gives you the ammo to say "No," but it does not prevent leadership from overruling you. It simply ensures that if they overrule you, they are doing so with eyes open to the trade-off.

  ### Summary for your VP
  When you hand this over, say this:
  *"I ran a Race Condition Audit on this. In two cases, the math says we're entering a trap where we pay more to stay still. In one case, it's a market force we can't fight. Here is the breakdown so we don't trade margin for vibes."*
