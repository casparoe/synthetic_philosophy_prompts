answer: |-
  You have hit the central tension in modern mechanistic interpretability. There isn't one single universally agreed-upon word, but there is a vocabulary forming around exactly this split.

  The short answer is: **You are observing the difference between *correlational decodability* and *causal usage*.**

  Here is the breakdown of the terminology, the theoretical framework that explains why this happens, and where the community is drawing the line.

  ### 1. Terminology for the Two Halves

  **Half 1: High Probe Accuracy, Low Causal Impact**
  *   **Established Term:** **"Epiphenomenal Representations"** (or Epiphenomenal Information).
  *   **Alternative:** "Incidental Encodings," "Passive Correlates," or "Shadow Features."
  *   **The Method to Detect It:** **"Amnesic Probing"** (Elazar et al., 2021). This is the specific technique where you train a probe, ablate the direction, and re-evaluate the *task* performance. If task performance stays high while probe accuracy drops, the information was epiphenomenal.
  *   **Why it happens:** The residual stream acts as a communication bus (Elhage et al., 2021). Information is often broadcast broadly "just in case" a downstream head needs it, or it is a byproduct of computing a *different* variable that is causally relevant. The probe, which has access to the whole layer, can read the byproduct; the model's downstream heads, which attend to specific keys/values, ignore it.

  **Half 2: Low Probe Accuracy, High Causal Impact**
  *   **Established Term:** **"Non-Linearly Encoded Mechanisms"** or **"Distributed Causality."**
  *   **Alternative:** "Opaque Mechanisms," "Entangled Representations."
  *   **Why it happens:** Linear probes assume the concept lies in a linear subspace. If the model uses a "AND" gate of two neurons, or a curved manifold, or a high-frequency direction regularized out of the main subspace, a linear probe will fail. However, patching that specific activation breaks the computation because the downstream mechanism relies on that precise non-linear configuration.

  **The Split Itself**
  *   **The Readout-Use Gap.**
  *   **The Correlation-Causation Divide in Representation.**
  *   In the **Causal Abstraction** framework (Geiger et al.), this is the failure of an **"Interventional Alignment."** A high-level concept (e.g., "negation") only aligns with a low-level representation if intervening on the representation produces the expected change in the output.

  ### 2. Where the Line Falls: "Does the model have it?"

  You asked: *When is a probe reading a representation the model actually has, versus decoding a correlation?*

  The emerging consensus in mechanistic interpretability is **Instrumentalist**: A representation only "exists" for the model if it is **functionally necessary** for the computation.

  If you can remove the information (via ablation/orthogonalization) and the model's loss/behavior on the relevant task does not degrade, **the model does not represent that property.** It merely passes through a state that is *correlated* with that property.

  *   **The Probe's Perspective:** The probe is an external classifier with access to the entire activation vector. It can find *any* linear boundary that separates the data. It is optimizing for *prediction*, not *mechanism*.
  *   **The Model's Perspective:** The model is a causal graph. A node only "contains" information if removing that node (or edge) breaks the causal link to the output.

  Therefore, **Half 1 (Epiphenomenal)** is a fact about your probe (and the data distribution), not the model's algorithm. The model is not "representing" string literals; it is representing syntax features that happen to correlate perfectly with string literals in your dataset, but the downstream heads are attending to the syntax features, not the "string literal" concept itself.

  ### 3. Why This Happens (The Theory)

  **For Half 1 (The "Bus" Theory):**
  In transformers, the residual stream is a shared communication channel. Early layers compute features and write them to the stream. Later layers read from the stream.
  *   Layer 5 might compute `Feature A` (causally used) and `Feature B` (unused side effect).
  *   Because they are computed together, they are linearly entangled in the residual stream.
  *   Your probe sees `Feature B` because it's there.
  *   Downstream heads ignore `Feature B` because they have attention keys tuned to `Feature A`.
  *   **Result:** You can steer `Feature B` without changing output, because no one is listening to that channel.

  **For Half 2 (The "Non-Linear" Theory):**
  *   Linear probes are weak. They test if $w^T x > b$.
  *   Transformers are universal approximators. They can encode $f(x)$ in ways that are linearly inseparable but computationally distinct.
  *   If you patch a specific neuron activation, you are performing a **surgical intervention**. This works even if the information is encoded in a way a linear probe can't see (e.g., the magnitude of a specific neuron relative to the norm, or a specific phase relationship).

  ### 4. How to Tell Them Apart (From the Outside)

  If you want to move beyond "messing around" to rigorous claims, you need to shift from **Probing** to **Causal Mediation**.

  1.  **Amnesic Probing (The Minimum Bar):**
      *   Train probe.
      *   Remove the direction (via null-space projection or ablation).
      *   **Crucial Step:** Retrain the *task head* (or evaluate perplexity) on the ablated model.
      *   If task performance drops $\rightarrow$ Causal.
      *   If task performance stays same $\rightarrow$ Epiphenomenal.

  2.  **Causal Mediation Analysis (Vig et al., Geiger et al.):**
      *   Instead of just ablating, you swap activations between a clean run and a corrupted run.
      *   Calculate the **Indirect Effect**: How much of the output change is mediated specifically by that activation?
      *   If the Indirect Effect is high, but Probe Accuracy is low $\rightarrow$ You found a non-linear mechanism (Half 2).
      *   If Probe Accuracy is high, but Indirect Effect is low $\rightarrow$ You found an epiphenomenon (Half 1).

  3.  **Cross-Task Generalization:**
      *   Epiphenomenal features often rely on dataset spurious correlations.
      *   Test your probe/steering on a distributionally shifted dataset where the correlation breaks (e.g., code with different string quoting styles).
      *   If probe accuracy collapses but behavior holds $\rightarrow$ The model was using a different, robust feature.
      *   If probe accuracy holds but behavior collapses $\rightarrow$ The probe was overfitting, the model was using the feature correctly but the task changed.

  ### 5. Summary Recommendation

  You are describing the transition from **Representational Analysis** (what can be read?) to **Mechanistic Analysis** (what is used?).

  *   **Don't trust probes alone.** A 95% probe accuracy is a hypothesis, not a discovery.
  *   **Adopt the "Causal Abstraction" vocabulary.** If an intervention on the latent variable $Z$ does not produce the expected change in output $Y$, then $Z$ is not an abstract representation of $Y$ within the model, regardless of probe accuracy.
  *   **Name for your phenomenon:** If you need a label for your paper/blog, call it the **"Decodability-Causality Mismatch."**
  *   **Name for Half 1:** **"Epiphenomenal Decodability."**
  *   **Name for Half 2:** **"Non-Linear Causal Mechanisms."**

  The field is currently moving away from "Look, I found a direction!" to "Look, I broke the model by editing this direction." You are already doing the right thing by checking the intervention. Trust the intervention, not the probe.
