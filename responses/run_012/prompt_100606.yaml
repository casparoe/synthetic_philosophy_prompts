prompt: |-
  ok so I just lost two hours arguing with my friend Sam about whether two strangers who wade into the sea and form a human chain to grab a drowning kid are doing something *together* in the same sense a string quartet is, or whether that's just two people plus a wave. I want to settle it properly instead of trading intuitions, so before I read any more of the literature I want the spec. Write me the desiderata: what any adequate theory of joint action / shared intention has to be able to deliver.

  Purpose first, since I know 'adequate' is relative to a job. I want a theory good enough for two things: (a) telling me when a bunch of people can be blamed or praised as a unit (the mob, the boardroom, the crowd that all knew and said nothing), and (b) telling me whether things like a firm, a market, or a state are genuine agents or just shorthand for what individuals do.

  For each requirement, give me the case or consideration that forces it, and say whether it's non-negotiable or just a preference of one camp. Cases I keep tripping over and can't get a story about:

  - the human chain above — no plan, no promise, over in ninety seconds
  - two friends who each spend a week secretly organising a surprise party for the same third person, each believing they're the only one doing it
  - my uncle finishing his late mate's restoration project off the mate's notes and tools — the mate is dead, so there's nobody left to ratify anything
  - a flash mob (forty people doing the same dance because they all read the same post) versus the quartet, which everyone treats as the paradigm
  - two people pushing the same stalled car, where one is doing it *with* the other and the other just thinks a stranger has also started pushing
  - the couple each secretly hating the film they're watching and each staying because they think the other loves it
  - me playing the piano part of a duet along with a recording

  Requirements I'm fairly sure belong on the list but want stated properly: it mustn't require an actual agreement or promise; it has to handle asymmetric cases where one person holds the whole plan and the rest just go along; it should explain why 'we' generates obligations to do your bit and to renegotiate rather than just walk off, and why those obligations still bind when nobody would ever find out; it has to cover joint action in creatures with no concept of a group — toddlers, chimps, a dog and a shepherd; it should be graded rather than on/off, since the chain, the quartet, the mob and the market feel like different amounts of together; and it mustn't smuggle in a group mind while also not being a fancy word for coordination or for everyone coincidentally wanting the same thing.

  Then the part I actually want: which of these can't all hold at once. My suspicion is that 'no group mind, everything cashed out in individual terms' fights with 'genuine non-instrumental obligations between the parties', and that 'graded' fights with anything built on a binary commitment. Tell me if I'm wrong. And say which single requirement does the most work — which one, dropped, would let the most junk theories in. Skip the full scorecard, I'll run Bratman/Gilbert/Searle/team-reasoning through the list myself once I know what I'm scoring them against, though if one of them definately fails something obvious just say so in a line.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Someone deeply engaged in philosophy of action/social ontology (likely a grad student or advanced amateur). They've lost an argument about joint action (human chain vs. string quartet) and want to settle it theoretically.
      *   **Task:** Write the *desiderata* for an adequate theory of joint action/shared intention.
      *   **Purpose:** (a) Collective blame/praise (moral responsibility), (b) Ontological status of groups (firms, states as agents vs. shorthand).
      *   **Specific Cases to Cover:** Human chain (spontaneous, short), Surprise party (mismatched beliefs), Uncle/Mate (one dead), Flash mob vs. Quartet, Car push (unilateral belief), Cinema couple (false belief/preference adaptation), Piano + Recording (non-human partner).
      *   **User's Proposed Requirements:** No actual agreement needed; handle asymmetry; explain obligations (to do bit, renegotiate, bind in secret); cover non-linguistic creatures; be graded (not binary); avoid group mind but avoid mere coordination.
      *   **Specific Questions to Answer:**
          1.  Which requirements are inconsistent/trade-offs? (Specifically: Individualism vs. Obligations, Graded vs. Binary).
          2.  Which single requirement does the most work (the "gatekeeper")?
          3.  Brief note on major theories (Bratman, Gilbert, Searle, etc.) failing obvious points.
      *   **Tone:** Philosophical, precise, no-nonsense, "spec sheet" style. Avoid fluff.

  2.  **Deconstruct the Desiderata (The "Spec"):**
      *   I need to organize the user's scattered requirements into a coherent list of criteria.
      *   *Criterion 1: The Intentionality Condition.* Must distinguish joint action from parallel individual action (The Car Push/Flash Mob case).
      *   *Criterion 2: The Commitment/Obligation Condition.* Must explain normative binding (The Quartet/Boardroom case).
      *   *Criterion 3: The Cognitive Load/Access Condition.* Must handle limited cognition and no explicit agreement (The Human Chain/Toddlers case).
      *   *Criterion 4: The Asymmetry/Authority Condition.* Must handle leaders/followers or one-sided knowledge (The Uncle/Mate case).
      *   *Criterion 5: The Ontological Neutrality Condition.* Must not presuppose a group mind but allow for emergent agency (The Firm/State case).
      *   *Criterion 6: The Gradability Condition.* Must allow degrees of "togetherness" (The Chain vs. Quartet vs. Market case).

  3.  **Address the Inconsistencies (The "Trade-offs"):**
      *   *Individualism vs. Normativity:* This is the big one. If you reduce everything to individual mental states (I intend that we J), can you generate *sui generis* obligations? Gilbert says no (need plural subject), Bratman tries (interlocking intentions). The user suspects this conflict. I need to confirm it.
      *   *Gradability vs. Binary Commitment:* Joint intention is often defined as a threshold (either we intend or we don't). But moral responsibility and "togetherness" feel scalar. A theory that demands a binary "We-Intend" switch struggles to explain the difference between a mob and a team.
      *   *Reflexivity vs. Non-Cognitive Agents:* If joint action requires knowing the other knows (common knowledge), toddlers/dogs fail. If it doesn't, how do we distinguish it from mere causality?

  4.  **Identify the "Gatekeeper" Requirement:**
      *   Which one, if dropped, lets in the most junk?
      *   If you drop *Interdependence/Responsiveness*, you get parallel action (Crowd running for rain shelter).
      *   If you drop *Normativity*, you get descriptive coordination without accountability.
      *   The strongest candidate is **Mutual Responsiveness/Interdependence**. Without this, "joint action" collapses into "simultaneous individual action." This is the core differentiator between the Human Chain and two strangers swimming near each other.

  5.  **Evaluate Major Theories (Briefly):**
      *   *Bratman:* Fails the "Obligation" test (too weak on normativity) and arguably the "Non-Cognitive" test (requires complex planning structures).
      *   *Gilbert:* Fails the "No Agreement" test (requires joint commitment, which is heavy) and "Non-Cognitive" test (too linguistic/conceptual).
      *   *Searle:* Fails the "Individualism" test (posits primitive We-Intention, looks like group mind to critics).
      *   *Team Reasoning:* Good for markets, bad for the "Human Chain" (too calculative).

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the stakes (moral responsibility + social ontology).
      *   *Section 1: The Desiderata.* Group them logically. Use the user's cases to illustrate.
          *   D1: Distinction from Parallel Action (Car Push).
          *   D2: Normative Binding (Quartet/Boardroom).
          *   D3: Low Cognitive Bar (Human Chain/Toddlers).
          *   D4: Asymmetry/Temporal Extension (Uncle/Mate).
          *   D5: Gradability (Chain vs. Quartet vs. Market).
          *   D6: Ontological Parsimony (No Group Mind).
      *   *Section 2: The Inconsistencies.*
          *   Confirm the Individualism vs. Obligation tension. (Gilbert vs. Bratman).
          *   Confirm the Binary vs. Graded tension. (Most theories are binary; reality is graded).
          *   Add the Reflexivity vs. Non-Cognitive tension.
      *   *Section 3: The Gatekeeper.*
          *   Argument for **Mutual Responsiveness**.
      *   *Section 4: Theory Failures.*
          *   Bratman: Weak on obligation.
          *   Gilbert: Too heavy on commitment (excludes human chain).
          *   Searle: Black box "We-Intend".

  7.  **Refining the Tone:**
      *   Keep it sharp. The user wants a spec, not a lecture.
      *   Use their examples explicitly.
      *   Address the "Purpose" (Blame/Praise + Group Agency) explicitly in the criteria.

  8.  **Self-Correction/Check during drafting:**
      *   *Did I address the Piano + Recording?* That's a test for "other agent" requirement. A theory must distinguish joint action with a non-agent (recording) vs. an agent. I should add that to the "Distinction" criterion.
      *   *Did I address the Cinema Couple?* That's false belief. They *think* they are acting together (watching a film together) but their preferences are misaligned. Actually, they *are* acting together (watching a film), just based on false premises. This tests the "Common Knowledge" requirement.
      *   *Did I address the Uncle/Mate?* This tests temporal extension and the survival of commitment after one agent leaves.
      *   *Wait, the User asked for "Which single requirement does the most work".* I need to be decisive here.
      *   *User asked: "Skip the full scorecard... though if one of them definitely fails something obvious just say so in a line."* Okay, keep theory critiques brief.

  9.  **Final Polish:** Check against the prompt's specific constraints.
      *   Purpose first? Yes.
      *   Cases included? Yes.
      *   Inconsistencies highlighted? Yes.
      *   Gatekeeper identified? Yes.
      *   Theory failures noted? Yes.

      *(Self-Correction on the "Uncle/Mate" case)*: This is tricky. Joint action usually requires *current* mutual responsiveness. If one is dead, is it joint action? Or is it *continuing* a joint project? The theory needs to handle *diachronic* joint agency. I will frame this as "Persistence Conditions."

      *(Self-Correction on "Piano + Recording")*: This is often used to argue against the need for *actual* other minds, but most theories say this isn't joint action, it's solo action with a prop. The desideratum should be "Ability to distinguish genuine co-agency from interaction with objects."

      *(Refining the "Gatekeeper")*: Is it Responsiveness or Interdependence? Responsiveness is the mechanism, Interdependence is the structure. "Mutual Responsiveness to Intentions" is the standard Bratmanian line. But for the Human Chain, do they respond to *intentions* or just *physical pull*? This is where the "Low Cognitive Bar" fights the "Intentionality" requirement. I will stick with **Mutual Responsiveness** but note it must be broadly construed.

      *(Refining the "Inconsistencies")*: The user suspects Individualism vs. Obligation. I need to confirm this is the "Hard Problem" of joint action. Gilbert embraces the obligation by sacrificing methodological individualism (Plural Subject). Bratman keeps individualism but struggles to derive robust obligation.

      Let's assemble.

      *Structure:*
      1. The Job (Purpose)
      2. The Spec (6 Desiderata)
      3. The Trilemma (Inconsistencies)
      4. The Gatekeeper
      5. The Body Count (Theory failures)

      *Tone Check:* "Write me the desiderata." "Tell me if I'm wrong." "Skip the full scorecard." Be direct.

      *One last check on the "Human Chain"*: The user says "no plan, no promise, over in ninety seconds." This kills Gilbert (Joint Commitment takes time/communication) and strains Bratman (Planning structures). This supports the "Low Cognitive Bar" desideratum.

      *One last check on "Cinema Couple"*: They are acting together (watching a movie) but based on false beliefs about *why*. This tests whether joint action requires *shared reasons* or just *shared goal*.

      Okay, ready to write.
answer: |-
  Here is the specification sheet for a theory of joint action, derived from your purposes and test cases.

  ### I. The Purpose
  The theory must serve two distinct masters:
  1.  **Moral Accounting:** It must identify the conditions under which a *plural subject* is the appropriate target of praise/blame (e.g., the Board, the Mob), distinct from the sum of individual blameworthiness.
  2.  **Social Ontology:** It must determine when a collective entity (Firm, State) is a genuine agent versus a *façon de parler* for aggregated individual behaviors.

  ### II. The Desiderata (The Spec)
  An adequate theory must satisfy the following six constraints.

  **1. The Parallel Action Filter (Non-Negotiable)**
  *   **Requirement:** Must distinguish joint action from merely coinciding individual actions.
  *   **Forcing Case:** *The Car Push.* Two people push a car. In Case A, each thinks, "I am pushing with him." In Case B, each thinks, "I am pushing; coincidentally, so is that stranger." Case A is joint; Case B is parallel.
  *   **Constraint:** The theory cannot rely solely on outward behavior or shared outcome. It must locate the difference in the structure of the agents' mental states or relations.
  *   **Constraint:** Must also distinguish joint action from interaction with non-agents. *The Piano + Recording* must not count as a duet in the same sense as the *String Quartet*.

  **2. The Normative Binding Condition (Non-Negotiable for Purpose A)**
  *   **Requirement:** Must explain why participants acquire obligations to one another (to do their bit, not to defect without notice, to renegotiate) that they would not have otherwise.
  *   **Forcing Case:** *The String Quartet.* If the violinist walks off mid-movement, they wrong the cellist, not just the audience.
  *   **Forcing Case:** *The Boardroom.* Members are obligated to disclose conflicts of interest to the *board*, not just to other members individually.
  *   **Constraint:** These obligations must persist even when defection would go unnoticed (the "nobody would ever find out" constraint).

  **3. The Low-Cognitive Threshold (Non-Negotiable for Purpose B)**
  *   **Requirement:** Must allow for joint action without complex linguistic agreements, explicit promises, or high-level theory of mind.
  *   **Forcing Case:** *The Human Chain.* No time for promises, no plan, purely reactive.
  *   **Forcing Case:** *Toddlers/Chimps.* Creatures without a concept of "group" or "institution" can still act together (e.g., lifting a log).
  *   **Constraint:** If the theory requires "Common Knowledge" (I know that you know that I know...), it fails this desideratum.

  **4. The Asymmetry and Persistence Condition (Preference/High Priority)**
  *   **Requirement:** Must handle cases where knowledge, authority, or existence is not shared equally or simultaneously.
  *   **Forcing Case:** *The Uncle/Mate.* One partner is dead. The joint project persists despite the impossibility of current mutual responsiveness.
  *   **Forcing Case:** *The Surprise Party.* Mismatched beliefs (each thinks they are the sole organizer) yet they are objectively coordinating on the same end.
  *   **Constraint:** The theory cannot require symmetrical intentional states at every moment *t*.

  **5. The Gradability Condition (Preference/High Priority)**
  *   **Requirement:** "Jointness" must be a scalar property, not a binary switch.
  *   **Forcing Case:** *The Spectrum.* The *Human Chain* feels less "tightly" joined than the *Quartet*, which feels different from the *Market*, which feels different from the *Flash Mob*.
  *   **Constraint:** A binary theory (either we intend or we don't) forces arbitrary lines between these cases, undermining its utility for Moral Accounting (how much blame does the Mob bear vs. the Quartet?).

  **6. Ontological Parsimony (Non-Negotiable)**
  *   **Requirement:** Must not posit a "Group Mind" or mystical entity over and above individuals.
  *   **Forcing Case:** *The Firm/State.* We want to say the Firm acts, but not if it requires a Cartesian ego hovering over the employees.
  *   **Constraint:** All facts about the joint action must be cashed out in facts about individuals (their minds, behaviors, and relations), without reducing the *phenomenology* of "we-ness" to mere summation.

  ---

  ### III. The Inconsistencies (The Trilemma)
  You are correct to suspect tensions. You cannot maximize all six simultaneously. Here are the hard trade-offs:

  **1. Individualism vs. Normativity (The Gilbert-Bratman Fight)**
  *   **Conflict:** If you satisfy **Ontological Parsimony** (everything is just individual mental states), you struggle to satisfy **Normative Binding**.
  *   **Why:** Individual intentions create individual reasons. How does *my* intention that *we* J create an obligation *to you*? If I change my mind, the joint intention dissolves. If the obligation is truly binding, it must constrain my individual will, which implies a structure *above* the individual.
  *   **Verdict:** To get robust obligations (Purpose A), you usually have to weaken Parsimony (Gilbert's "Plural Subject"). To keep strict Individualism (Bratman), you must weaken the obligations to mere "normative expectations" based on reliability, not genuine duty. **You cannot have both strong individualism and strong sui generis obligation.**

  **2. Gradability vs. Binary Commitment**
  *   **Conflict:** If you satisfy **Normative Binding** via a specific mechanism (e.g., "Joint Commitment"), that mechanism is usually binary (either the commitment is in place or it isn't).
  *   **Why:** Commitments are typically threshold concepts. You either promised or you didn't.
  *   **Verdict:** A theory built on commitment (Gilbert) fails **Gradability**. A theory built on interlocking intentions (Bratman) allows for **Gradability** (degrees of mesh) but weakens the **Normative Binding**.

  **3. Low-Cognitive Threshold vs. Intentionality**
  *   **Conflict:** If you satisfy **Low-Cognitive Threshold** (toddlers, human chain), you risk failing the **Parallel Action Filter**.
  *   **Why:** If you lower the cognitive bar too much (e.g., "we just respond to each other's movements"), you cannot distinguish the *Human Chain* from two magnets snapping together, or the *Piano + Recording*.
  *   **Verdict:** To keep the "Agency" in joint action, you need some level of intentionality. To keep the "Human Chain" in the fold, you need to dilute intentionality.

  ### IV. The Gatekeeper Requirement
  **Mutual Responsiveness.**

  If you drop **Mutual Responsiveness**, you let in all the junk.
  *   **Why:** Without the requirement that each agent adjusts their behavior *in response to* the other's actions (guided by the intention to act together), you cannot distinguish the *Car Push (Case A)* from *Car Push (Case B)*, nor the *Flash Mob* from a *Crowd fleeing fire*.
  *   **Function:** This is the only criterion that rules out "parallel individual action" and "interaction with objects" simultaneously.
  *   **Caveat:** To satisfy the *Human Chain* and *Toddlers* cases, "Responsiveness" must be defined broadly (behavioral coupling) rather than narrowly (response to explicit intentions).

  ### V. Theory Body Count
  You asked to run the major theories through the list. Here is where they break:

  *   **Michael Bratman (Shared Intention as Interlocking Individual Intentions):**
      *   **Fails:** **Normative Binding.** Bratman explicitly denies that shared intention creates obligations beyond those of individual consistency. He cannot explain why the violinist *wrongs* the cellist by quitting, only that they are unreliable.
      *   **Fails:** **Low-Cognitive Threshold.** Requires planning agents capable of sub-planning and meshing. Excludes toddlers and the spontaneous human chain.

  *   **Margaret Gilbert (Plural Subject / Joint Commitment):**
      *   **Fails:** **Low-Cognitive Threshold.** Requires a level of common knowledge and explicit (or tacit) agreement that excludes the *Human Chain* and *Toddlers*.
      *   **Fails:** **Asymmetry.** Struggles with the *Uncle/Mate* case; a joint commitment typically dissolves if one party cannot ratify it (i.e., is dead).
      *   **Wins:** **Normative Binding.** Best in class for explaining obligations.

  *   **John Searle (Primitive We-Intention):**
      *   **Fails:** **Ontological Parsimony.** Posits "We-Intend" as a primitive biological capacity. Critics argue this smuggles in a **Group Mind** by locating the "We" inside the individual head without explaining the relational mechanics.
      *   **Wins:** **Low-Cognitive Threshold.** Biologically primitive, so toddlers qualify.

  *   **Team Reasoning (Game Theoretic):**
      *   **Fails:** **Low-Cognitive Threshold.** Requires too much calculation.
      *   **Fails:** **Normative Binding.** Explains *why* it is rational to cooperate, not why it is *obligatory*.
      *   **Wins:** **The Market/Firm.** Best for your Purpose (b) regarding economic agents.

  **Recommendation:** If your priority is **Moral Accounting (Purpose A)**, lean Gilbertian but accept you must stretch "Commitment" to cover the Human Chain. If your priority is **Social Ontology (Purpose B)**, lean Bratman but accept obligations are weaker than you want. You cannot have the robust blame of a Mob *and* the parsimony of a Market in one unified theory without contradiction.
