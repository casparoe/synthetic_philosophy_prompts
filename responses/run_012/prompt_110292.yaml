answer: |-
  1. **What the procedure is actually trading**

  The procedure is not trading forgiveness for confession. That is theology, not bureaucracy. The commission is trading immunity for data. The state is purchasing stability using a currency it does not possess: the right to prosecute. The amnesty is the receipt.

  The underlying logic is utilitarian. The civil war ended because both sides exhausted themselves, not because one side was morally vindicated. To keep the peace, the combatants need to know they will not be hunted once they lay down their arms. The commission provides that guarantee, but it demands a tax: the full history of the violence. If the state knows where the bodies are buried, it can close the files. If it knows who gave the orders, it can manage the political fallout. The amnesty is the price of that intelligence.

  The currency is "Full Disclosure." This means specific, verifiable facts: coordinates of graves, names of suppliers, dates of meetings. Vague remorse is worthless. A confession that omits the location of the bodies is a breach of contract.

  Who is disqualified in principle? Those who acted for personal gain. If a commander burned a village to steal the livestock, that is banditry, not war. If a soldier killed a neighbor to settle a family feud, that is murder, not politics. The procedure exists to filter political violence from common crime. However, this distinction is the first lie the commission tells itself. In a civil war, every crime is political, and every political act is criminal.

  Finally, the procedure must acknowledge the illegality. Under international law, amnesty for crimes against humanity is void. This commission is a domestic shield, not an international one. The procedure should include a step that flags cases liable for future prosecution by external courts. The commissioners are not granting freedom; they are granting a delay, and perhaps a localized protection. They are buying time for the new government to稳固 itself, hoping that by the time the world comes knocking, the peace will be too valuable to break. The procedure is a mechanism for managing guilt, not absolving it.

  2. **The steps, in order**

  1.  **The Political Motive Test (Form 101):** The petitioner must demonstrate a link between the act and a recognized political organization or objective. The commissioner reviews the chain of command. Was the petitioner acting on orders, or in furtherance of a stated goal of their faction?
      *   *Sufficient Answer:* "Acted under Order #44 from Regional Command," or "Action taken to secure supply route for Liberation Front."
      *   *Commissioner writes:* "Political Nexus: Established" or "Political Nexus: Contested." If contested, the petition dies here unless appealed.

  2.  **The Disclosure Verification (Field Unit Report):** The petitioner provides specific data regarding the act. The Verification Unit checks this against forensic evidence or witness testimony.
      *   *Sufficient Answer:* Coordinates match exhumation site; names of accomplices corroborated by other amnesty applicants.
      *   *Commissioner writes:* "Disclosure: Complete," "Partial," or "False." Partial disclosure allows a chance to amend; false disclosure results in immediate rejection and referral to the Attorney General.

  3.  **The Proportionality Assessment:** Was the violence proportional to the military or political objective? This is the most subjective step. A bridge blown to stop a tank is proportional. A village burned to punish sympathy for the enemy is often deemed disproportionate, yet often amnestied anyway.
      *   *Sufficient Answer:* "Objective: Deny enemy use of road. Method: Destroy bridge. Collateral damage: None." vs. "Objective: Intimidate voters. Method: Massacre."
      *   *Commissioner writes:* "Proportionality: Within Bounds" or "Excessive." Excessive acts can still be amnestied if the political motive is strong, but this flag triggers a higher voting threshold.

  4.  **Victim Impact Statement (Record Only):** Victims or their families are invited to submit statements. These are read into the record but do not constitute a veto.
      *   *Sufficient Answer:* A written or recorded testimony detailing loss.
      *   *Commissioner writes:* "Victim Input: Received." The commissioner notes the intensity of opposition but cannot vote "No" solely based on victim objection unless new evidence of personal gain emerges.

  5.  **The International Law Flag:** The commissioner assesses whether the act constitutes a crime against humanity or war crime under international statutes (torture, systematic extermination, sexual violence).
      *   *Sufficient Answer:* Identification of specific statutes violated.
      *   *Commissioner writes:* "ICC Risk: High/Medium/Low." High risk means the amnesty may not hold if the regime falls or international pressure mounts. This is a warning label for the commissioner's conscience, not a automatic bar.

  6.  **The Deliberation and Vote:** The seven commissioners meet. A simple majority is not enough for "Excessive" or "High ICC Risk" cases; those require a supermajority (five of seven).
      *   *Sufficient Answer:* A recorded vote.
      *   *Commissioner writes:* "Verdict: Amnesty Granted" or "Amnesty Denied." If granted, the certificate is issued. If denied, the file is referred for prosecution.

  7.  **The Public Record Decision:** The commission decides what parts of the finding are published. Names of victims are always public. Names of perpetrators are public unless their safety is at risk. Details of ongoing political sensitivities may be redacted.
      *   *Sufficient Answer:* A redaction log.
      *   *Commissioner writes:* "Publication Level: Full/Redacted/Sealed." This is where the political deal is often finalized—granting amnesty but hiding the name of a current minister.

  3. **Where it stops and a person decides**

  The procedure ends at the vote, but the decision happens in the silence before the pen touches the paper. The forms cannot calculate the weight of a mother's grief against the stability of a border region. The "Political Motive" test is the largest hole in the machinery. Who defines the political objective? If a rebel group claims their objective was "ethnic cleansing," is that political? The procedure forces the commissioner to accept the faction's stated goals as legitimate politics to keep the peace, even when those goals are abhorrent.

  This is where the commissioner weighs the illegality. When you mark "ICC Risk: High," you are admitting that this piece of paper might not protect the petitioner in ten years. You are signing a document that might be voided by a foreign court. Are you condemning them to death later to save lives now? The procedure cannot answer that. It only flags the risk.

  Furthermore, the procedure assumes the politicians upstairs want the truth. Sometimes they want the silence. The commissioner must decide whether to be a truth-teller or a peacekeeper. If granting amnesty to a monster keeps the army from coup-ing the government, the procedure allows it, but it doesn't absolve the commissioner of complicity. The forms create a paper trail, but they do not create a clean conscience. The commissioner is asked to weigh the value of a body in the ground against the value of a living peace. There is no conversion rate for that. The procedure provides the alibi, but the commissioner must live with the act. When the steps are complete, the commissioner is left alone with the knowledge that justice has been traded, and they were the clerk who counted the coins.

  4. **Three petitions, run through it**

  **Case 1: The Commander (The Truth Holder)**
  *Petitioner:* Former Regional Commander. Ordered execution of 40 villagers.
  *Step 1 (Motive):* Established. Orders came from Central Command to clear the zone.
  *Step 2 (Disclosure):* Complete. He provided coordinates for the second mass grave. Verification Unit confirmed remains.
  *Step 3 (Proportionality):* Excessive. Clearing a zone does not require executing civilians. Flagged.
  *Step 4 (Victims):* High opposition. Families demand prosecution.
  *Step 5 (ICC Risk):* High. Crimes against humanity.
  *Step 6 (Vote):* The grave is the leverage. Without him, 40 families never know. Also, his testimony implicates two current Ministers. Denying amnesty risks him silencing up or being assassinated before trial.
  *Verdict:* Amnesty Granted.
  *Step 7 (Record):* Redacted. The names of the Ministers are sealed to prevent immediate government collapse. The protagonist votes Yes, hating the redaction. The truth is bought, but only half is published.

  **Case 2: The Conscript (The Rooted-for)**
  *Petitioner:* Former soldier, age 29 (was 19 during war). One killing.
  *Step 1 (Motive):* Established. Conscripted under threat of death. Acted to maintain unit cohesion.
  *Step 2 (Disclosure):* Complete. Confessed to shooting one deserter. Body located years ago, so no new forensic value, but narrative matches records.
  *Step 3 (Proportionality):* Within Bounds. Military justice at the time permitted execution of deserters.
  *Step 4 (Victims):* The victim's family accepts the confession. They wanted to know why.
  *Step 5 (ICC Risk):* Low. Isolated incident, not systematic.
  *Step 6 (Vote):* Unanimous. He poses no threat. He has lived with it for a decade.
  *Verdict:* Amnesty Granted.
  *Step 7 (Record):* Full Publication. This is the success story the commission shows the press. The protagonist votes Yes easily, feeling a rare sense of clean resolution.

  **Case 3: The Stress Test (The Repellent)**
  *Petitioner:* Head of Intelligence for a rebel faction. Accused of systematic torture and sexual violence used as interrogation tools.
  *Step 1 (Motive):* Established. Claims violence was used to extract intelligence on government troop movements.
  *Step 2 (Disclosure):* Complete. He provided names of interrogation centers and methods. He gave up the locations of three detention sites.
  *Step 3 (Proportionality):* Excessive. Torture is inherently disproportionate. Flagged.
  *Step 4 (Victims):* Vicious opposition. Survivors testify he enjoyed the work.
  *Step 5 (ICC Risk):* Critical. Torture and sexual violence are universal jurisdiction crimes.
  *Step 6 (Vote):* This is the break. The peace deal hinges on this faction laying down arms. Their leader says if their Intelligence Chief hangs, the war restarts. The procedure allows amnesty if the political motive is accepted. The "Political Objective" (extracting intel) is accepted as valid war conduct by the commission's charter, however morally bankrupt.
  *Verdict:* Amnesty Granted.
  *Step 7 (Record):* Sealed. His name is not published to protect him from vigilante justice, which would break the peace.
  *The Protagonist's Vote:* Yes. The procedure forces a Yes. The truth of the detention sites saves future victims, but the perpetrator walks. The protagonist signs the form, knowing she has protected a torturer to save the state. The machinery works perfectly, and it is monstrous.

  5. **What this can't do**

  This procedure cannot restore the dead. It cannot satisfy the demand for retributive justice. It is designed to close files, not heal wounds. It cannot protect the commissioners from their own complicity; signing these forms makes you part of the structure that lets killers walk. It also cannot guarantee the peace it buys. The politicians who made the deal may fall, and the amnesty may be revoked, making the commissioners look like fools or accomplices.

  Do not try to fix this in the book. Do not let your protagonist find a loophole that grants justice *and* peace. The tension you feel is the point. The procedure should feel like a straightjacket that sometimes fits and sometimes chokes. If the votes feel arbitrary, it is because the underlying reality is arbitrary. The procedure is just the mask we wear to make it look like order. Let your character struggle with the pen, not the logic. The logic is sound. The morality is the broken part.
