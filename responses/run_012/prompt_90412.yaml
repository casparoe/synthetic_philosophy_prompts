answer: |-
  # DECISION TREE: RELIGION & THE LIBERAL STATE
  **Root Consensus:** The state must not *coerce* anyone into or out of a religion.

  **NODE 1: ENDORSEMENT & FUNDING**
  Is non-coercion the *whole* requirement, or must the state also avoid endorsing/funding religion?
  *   **Avoid Endorsement/Funding** → Go to Node 2.
  *   **Endorsement/Funding Permissible** → Go to Node 4.

  **NODE 2: NEUTRALITY TYPE** (If Avoid Endorsement)
  Is neutrality a constraint on state *justifications* (formal) or policy *effects* (substantive)?
  *   **Effects (Substantive)** → Go to Node 3.
  *   **Justifications (Formal)** → Go to Node 3.

  **NODE 3: SPECIAL TREATMENT** (If Avoid Endorsement)
  Do religious associations get exemptions/funding denied to secular voluntary associations? (e.g., *State funding of religious schools*)
  *   **Yes** → **ACCOMMODATIONISM** (if Effects) / **NON-PREFERENTIALISM** (if Justifications).
  *   **No** → **STRICT SEPARATION (LAÏCITÉ)** (if Justifications) / **[UNINHABITED]** (if Effects).

  **NODE 4: SCOPE OF ESTABLISHMENT** (If Endorsement Permissible)
  Is state alliance confined to *one* tradition or open to *multiple*?
  *   **Single Tradition** → Go to Node 5.
  *   **Multiple Traditions** → Go to Node 6.

  **NODE 5: HISTORICAL LEGITIMACY** (If Single Tradition)
  Do entrenched/ceremonial privileges get a pass that fresh legislation wouldn't? (e.g., *Ceremonial Established Church*)
  *   **Yes (History Matters)** → **CEREMONIAL ESTABLISHMENT**.
  *   **No (History Irrelevant)** → **[UNATTRACTIVE]**.

  **NODE 6: UNIT OF AGENCY** (If Multiple Traditions)
  Is the rights-bearing unit the *individual believer* or the *corporate body*? (e.g., *Church Tax*)
  *   **Individual** → **SUBSIDIARITY / CHRISTIAN DEMOCRACY**.
  *   **Corporate** → **CORPORATISM**.

  ---

  ### LEAVES: POSITIONS & AWKWARD COMMITMENTS

  1.  **Accommodationism** (Effects + Special Treatment): *Awkward:* Requires the state to judge the sincerity and burden of religious claims.
  2.  **Non-preferentialism** (Justifications + Special Treatment): *Awkward:* Must fund religious activity without appearing to prefer religion over non-religion.
  3.  **Strict Separation / Laïcité** (Justifications + No Special Treatment): *Awkward:* Bans private religious expression in public roles to maintain state neutrality.
  4.  **[UNINHABITED]** (Effects + No Special Treatment): *Status:* **Incoherent.** You cannot equalize policy effects on religion without granting religion specific exemptions or resources.
  5.  **Ceremonial Establishment** (Single + History): *Awkward:* Defends legal privilege solely via age/tradition rather than liberal principle.
  6.  **[UNATTRACTIVE]** (Single + No History): *Status:* **Religious Nationalism.** Excluded from liberal consensus; implies coercive conformity disguised as culture.
  7.  **Subsidiarity / Christian Democracy** (Multiple + Individual): *Awkward:* The state must define which groups count as "religious" enough to qualify for support.
  8.  **Corporatism** (Multiple + Corporate): *Awkward:* The state collects taxes on behalf of private clubs and enforces their membership boundaries.

  ---

  ### NOTES ON INDISTINGUISHABLE LEAVES
  *   **Laïcité vs. "Secularism as Establishment" Critique:** The tree cannot separate these. Both occupy the **Strict Separation** leaf. They differ only in rhetoric: one claims secularism is neutral, the other claims secularism is itself a dogmatic establishment. Concrete arrangements (bans on symbols, no funding) are identical.
  *   **Non-preferentialism vs. Accommodationism:** In practice, these often blur. A state claiming to care only about *justifications* often grants exemptions to fix *effects*, sliding from Non-preferentialism into Accommodationism.
