answer: |-
  This is a sharp way to approach the problem. You are asking for the *design specification* before we build the engine. Below is the sorted requirements list, followed by the consistency check and the scorecard.

  ### Part 1: The Specification List

  I have categorized your inputs and added necessary missing pieces. I have also distinguished between **Genuine Requirements** (logical or moral constraints a theory *must* address to be viable) and **House Rules** (contingent intuitions or methodological preferences that a theory could theoretically reject, provided it explains why).

  #### A. Phenomenological Constraints (The Data Points)
  *These are the intuitions or cases the theory must either match or convincingly explain away.*

  1.  **The Aggregation Intuition (1 vs. 5)**
      *   *Case:* Standard rescue. One dies or five die.
      *   *Requirement:* The theory must yield a verdict that matches the strong majority intuition (save the five) **OR** provide a robust error theory for why that intuition is misleading.
      *   *Status:* **Genuine Requirement.** (A theory that simply contradicts deep moral convictions without explanation fails at reflective equilibrium.)
  2.  **The Currency Question (Heads vs. Welfare)**
      *   *Case:* Save 1 from death vs. Save 100 from a broken leg (or vice versa).
      *   *Requirement:* The theory must explicitly state the metric of aggregation. Is it *lives* (heads), *welfare units*, or *claims*? It cannot equivocate between them depending on which yields the desired result.
      *   *Status:* **Genuine Requirement.** (Internal consistency.)
  3.  **The Ex-Ante/Ex-Post Tension (The Lottery Case)**
      *   *Case:* Save 1 person for certain **OR** Save 1 of 5 people via a fair lottery (1/5 chance each). Expected survivors = 1 in both.
      *   *Requirement:* The theory must explain whether a *chance* has moral weight independent of the *outcome*. If it calls this a tie, it treats ex-ante expectations as morally substantive. If it prefers the certain save, it must explain why the claims of the four who *might* have been saved are discounted to zero.
      *   *Status:* **Genuine Requirement.** (This is the hardest logical pivot point.)
  4.  **The Marginal Threshold**
      *   *Case:* 1 vs. 2. Does the obligation to aggregate kick in immediately, or is there a threshold where numbers begin to count?
      *   *Requirement:* The theory must define if the "numbers count" principle is binary (always on) or scalar (requires a critical mass).
      *   *Status:* **Genuine Requirement.** (Prevents vagueness.)

  #### B. Structural Constraints (Logical Consistency)
  *These are rules of coherence the theory cannot violate.*

  5.  **Act/Rule Consistency**
      *   *Case:* One-off rescue (you on the beach) vs. Standing Protocol (triage committee).
      *   *Requirement:* The moral principle cannot change simply because the decision is institutionalized, unless the theory explicitly argues that institutions create new moral facts (e.g., reliance expectations).
      *   *Status:* **Genuine Requirement.** (Prevents ad-hocery.)
  6.  **Agent-Neutrality vs. Agent-Relativity**
      *   *Case:* You are one of the people involved (Save yourself vs. Save two strangers).
      *   *Requirement:* The theory must state whether the agent's own life enters the calculus as a neutral unit or carries special weight. It cannot say "special weight for me, neutral for you."
      *   *Status:* **Genuine Requirement.** (Universalizability.)
  7.  **Transitivity of Claims**
      *   *Case:* If Claim A > Claim B, and Claim B > Claim C, then Claim A > Claim C.
      *   *Requirement:* The theory cannot generate cyclical preferences (e.g., in complex multi-stage rescue scenarios).
      *   *Status:* **Genuine Requirement.** (Logical coherence.)

  #### C. Boundary Conditions (Added Missing Pieces)
  *These are cases often used to break theories that pass the above.*

  8.  **The "Already Engaged" Constraint (Status Quo)**
      *   *Case:* You have already started treating the one person. Do you stop to save the five?
      *   *Requirement:* The theory must account for whether *process* creates entitlement. (Some theories say starting treatment creates a contract; others say it's irrelevant.)
      *   *Status:* **House Rule.** (Debatable whether past actions change moral obligations, but the theory must take a stance.)
  9.  **The Identifiable Victim Constraint**
      *   *Case:* The one person is standing in front of you; the five are anonymous statistics.
      *   *Requirement:* The theory must clarify if *identifiability* changes the weight of a claim. (Most normative theories say no, but psychological reality says yes.)
      *   *Status:* **House Rule.** (A good theory should likely reject this as bias, but must address it.)

  ---

  ### Part 2: The Consistency Check (Impossibility Theorems)

  **1. Is any subset of these requirements jointly unsatisfiable?**

  Yes. There is a known tension, often formalized in social choice theory and contractualist ethics, between **Requirement 3 (The Lottery/Ex-Ante)** and **Requirement 1 (The Aggregation Intuition)** when combined with **Requirement 2 (Currency)**.

  This is the **Ex-Ante vs. Ex-Post Dilemma**:
  *   To satisfy **Requirement 1** (Save the 5 in a standard 1-vs-5), you generally need to aggregate claims or maximize outcomes *ex-post* (after the fact, looking at who actually lives).
  *   To satisfy **Requirement 3** (The Lottery Case), if you treat the 1/5 chance as morally significant, you are valuing *ex-ante* prospects.
  *   **The Conflict:** If you value *ex-ante* prospects enough to make the Lottery Case a tie (1 certain vs. 5 @ 1/5), it becomes difficult to justify saving the 5 in the standard case without violating the individual claim of the one. If the one person says, "My claim not to be ignored is equal to any single one of the five," and you respect that claim in the Lottery Case (by giving them a chance), you undermine the aggregation in the Standard Case.
  *   **The Impossibility:** You cannot simultaneously hold that (a) individual claims are non-aggregable (to respect the one), (b) numbers *do* count in the standard case (to save the five), and (c) chances are morally equivalent to outcomes (to solve the lottery). One must give.

  Most theories resolve this by sacrificing **Requirement 3** (saying the certain save is better, effectively saying chances don't count as much as lives) or by sacrificing a strict version of **Requirement 1** (saying we save the five only as a tie-breaker of equal claims, not because 5 > 1).

  **2. Which single requirement does the most work at ruling candidate views out?**

  **Requirement 3: The Ex-Ante/Ex-Post Tension (The Lottery Case).**

  *   **Why:** It is the stress test for *why* numbers count.
  *   **Pure Aggregators (Utilitarians):** Pass Requirement 1 easily. But they struggle with Requirement 3. If expected value is identical (1 life vs. 1 expected life), they should be indifferent. But many people feel the lottery is *fairer* even if outcome-neutral. If the Utilitarian says "Save the 1 certain," they look like they ignore the claims of the five. If they say "It's a tie," they reduce human life to a mathematical expectation, which violates the "separateness of persons" objection.
  *   **Pure Non-Aggregators (Kamm/Contractualists):** They want to say you can't sum people. But Requirement 3 forces them to explain why a 1/5 chance for five people doesn't equal one person. If they say "Flip a coin in the Lottery Case," they admit chances aggregate. If chances aggregate, why don't lives aggregate in the Standard Case? This requirement forces the Non-Aggregator into complex "tie-breaking" maneuvers that often look ad-hoc.

  ---

  ### Part 3: Scorecard of Main Positions

  Here is how the live candidate theories score against the critical constraints (1, 2, 3).

  | Position | 1. Standard (1 vs 5) | 2. Currency (Heads/Welfare) | 3. Lottery (1 Certain vs 5 @ 1/5) | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **Pure Aggregator** (Utilitarian) | **Pass.** Save the 5. | **Pass.** Explicitly welfare/heads. | **Fail/Weak.** Indifferent (Expected Value = 1). Must accept sacrificing fairness for certainty, or admit chances are goods. | Ruled out by fairness intuitions in Lottery Case. |
  | **Pure Non-Aggregator** (Kamm/Scanlon) | **Pass (via Tie-Break).** Save 5, but only because claims are equal and 5 > 1 is a tie-breaker, not a sum. | **Pass.** Claims-based. | **Fail/Weak.** Struggles to explain why 5 claims @ 1/5 strength don't equal 1 claim @ 1 strength. Often forced to say "Save the 1 Certain" which looks bad. | Ruled out by inability to justify *why* numbers break ties without aggregating. |
  | **Ex-Ante Prioritarianism** | **Pass.** Weights the worse-off (the group). | **Pass.** Welfare/Claims. | **Pass.** Values the *distribution* of chances. Says Lottery is better or equal to Certain Save. | **Strongest Contender.** Handles the Lottery Case best, but risks failing Standard Case if chances are weighted too heavily. |
  | **Moderate Aggregation** (Weighted Claims) | **Pass.** Numbers count, but with diminishing returns. | **Pass.** Weighted Welfare. | **Pass.** Can distinguish between certainty and probability by weighting the "certainty claim" higher. | **Strongest Contender.** Balances the tension, but requires complex justification for the weighting function. |

  ### Summary for your Spec
  If you are building a theory, your primary design challenge is **Requirement 3**. You need a mechanism that allows you to say "Save the 5" in the standard case without forcing you to say "The 5 probabilistic lives are exactly equal to 1 certain life" in the lottery case.

  If you cannot solve Requirement 3 without violating Requirement 1, you have discovered an impossibility theorem for rescue ethics: **You cannot respect individual claims and maximize survival simultaneously across both certain and probabilistic scenarios.**
