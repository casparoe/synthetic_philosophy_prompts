prompt: |-
  Ok so I keep getting dragged into the numbers arguement — you know the one, you can save either one person or five, and one camp says obviously you save the five, and the other camp says no, you can't just add strangers up like that, each person has their own claim and no single claim outweighs another, so you'd be within your rights to choose at random or flip a coin. I don't want to relitigate that fight here. I want the spec first: what would a theory of when numbers count in rescue cases actually have to get right?

  So give me the requirements list — the cases it has to get right, the distinctions it can't just collapse, the considerations it has to stay consistent with — and for each one, the case or thought that puts it on the list. And say which of these are genuine requirements and which are just house rules of one of the camps.

  Things I think have to be on the list already, but sort them out and add what I'm missing:

  - the plain one-or-five case, and the fact that most people's answer to it is stubborn and doesn't budge under pressure
  - my own case, which is the one I actually can't get straight: you can either save one person for certain, or run a lottery that gives each of five people a one-in-five chance of being saved. Same expected number of survivors either way. Does the theory have to call this a tie? If yes, it looks like it's treating chances themselves as the good, and I want to know whether that's a cost or just the right answer. If no, it owes me a story about why one sure person and five probabilistic people aren't equal when the arithmetic says they are.
  - a case where what's at stake is unequal rather than the head count — save one person from dying versus save a hundred people from a broken leg, or the reverse — because a theory has to say whether numbers count people or count welfare, and it can't quietly do both
  - the version where you're one of the people involved, since I don't know whether the answer is supposed to change when it's you-or-them, and if it does I want to know whether that's a feature or a bug
  - whether the same answer has to hold in a one-off rescue and in a standing rule, because I want to be able to defend this in front of a triage committee, not just win a seminar

  Then the two things I actually want out of this:

  1. is any subset of these requirements jointly unsatisfiable? If the list can't be satisfied all at once then the inconsistency is the result, and I'd rather know that now than after working through a pile of theories
  2. which single requirement does the most work at ruling candidate views out

  You can score the main positions against the list at the end — the pure adder, the coin-flipper, the one that says you must save the five but only as a tie-break between equal claims, whatever else you think is live — but keep that part short, the criteria are what I'm here for.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** The "numbers argument" in rescue cases (Trolley Problem style, but specifically about whether saving more people is morally required vs. flipping a coin).
      *   **Goal:** The user *does not* want to relitigate the debate. They want a *specification* (a list of requirements) for a theory that explains *when* and *why* numbers count.
      *   **Input:** The user provided a preliminary list of cases/considerations (1-or-5 intuition, the lottery case, unequal stakes, self-involvement, one-off vs. rule).
      *   **Tasks:**
          1.  Refine and sort the user's list (distinguish genuine requirements from "house rules").
          2.  Add missing requirements/cases.
          3.  Identify if any subset of requirements is jointly unsatisfiable (impossibility theorems).
          4.  Identify which requirement does the most work in ruling out theories.
          5.  Briefly score main positions against the final list.
      *   **Tone:** Philosophical, analytical, precise, avoiding preaching a specific view.

  2.  **Deconstruct the User's Preliminary List:**
      *   *1-or-5 Intuition:* "Most people's answer... is stubborn." -> This is an *intuition pump*, not necessarily a logical requirement. A theory *could* argue the masses are wrong. But a good theory should explain *why* the intuition exists or why it's binding. Let's classify this as "Reflective Equilibrium Constraint."
      *   *The Lottery Case (1 certain vs. 5 @ 1/5 chance):* This is the "Fairness vs. Goodness" tension. If expected value is equal, does fairness demand the lottery? Or does goodness demand the certain save? This is a crucial test case for aggregating claims vs. maximizing outcomes.
      *   *Unequal Stakes (Death vs. Broken Leg):* Tests whether the metric is *heads* or *welfare*. Crucial for defining the "currency" of rescue.
      *   *Self-Involvement:* Tests agent-relative vs. agent-neutral reasons. Does partiality matter?
      *   *One-off vs. Standing Rule:* Tests act-utilitarianism vs. rule-based approaches (or institutional constraints).

  3.  **Brainstorming Missing Requirements/Cases:**
      *   *The "Queue" or "First-Come" Case:* If one person is already being treated, do you switch to five? (Status quo bias/entitlement).
      *   *The "Identifiable Victim" Effect:* Does knowing *who* they are change the math? (Probably psychological, but needs addressing).
      *   *Marginal Cases:* 1 vs. 2. Does the principle kick in immediately or only at a threshold?
      *   *The "Fair Innings" or Age Case:* Does saving a child count more than an elder? (Quality of life/remaining life).
      *   *Causation/Responsibility:* Does it matter if the five caused the danger? (Usually excluded in pure rescue, but worth noting as a boundary condition).
      *   *Contractualist Constraint:* Can the one person reasonably reject the principle that saves the five? (Scanlon's contribution).

  4.  **Drafting the Specification (The "Requirements List"):**
      *   Need to categorize them: *Data Points* (intuitions), *Structural Constraints* (logical consistency), *Normative Constraints* (moral principles).
      *   *Distinguishing "Genuine Requirements" vs. "House Rules":*
          *   Genuine: Logical consistency, explaining the currency (welfare vs. heads), handling the lottery case coherently.
          *   House Rules: "Must match the majority intuition on 1 vs. 5" (philosophy often corrects intuition), "Must allow self-preference" (some theories deny this).

  5.  **Addressing the "Impossibility" Question (Task 1):**
      *   Is there a paradox here? Yes. The "Numbers Skeptic" (Contractualist/Fairness) vs. "Numbers Aggregator" (Utilitarian) tension is often framed as an impossibility theorem in population ethics or contractualism.
      *   Specifically: *The Lottery Case* + *The 1-vs-5 Case* + *Transitivity/Consistency*.
      *   If you say 5 > 1 (Aggregation), but 1 Certain = 5 @ 1/5 (Individual Claim strength), you might run into cyclical preferences or violations of dominance.
      *   *Parfit's Repugnant Conclusion* adjacent issues? Maybe too far.
      *   *Scanlon's "Why does the number matter?"*: He struggles to justify 100 vs. 1 without aggregating.
      *   *Key Tension:* The tension between *Claim Strength* (individual right not to be ignored) and *Outcome Value* (total lives saved). Satisfying both fully is the hard part.

  6.  **Addressing the "Most Work" Question (Task 2):**
      *   Which constraint kills the most theories?
      *   Likely the *Lottery Case* (1 certain vs. 5 probabilistic). It forces a choice between maximizing expected value and respecting individual claims to equal opportunity. Pure aggregators fail the fairness test; pure non-aggregators fail the expected value test (if they say flip a coin in 1-vs-5 too).
      *   Actually, the *Unequal Stakes* case is also a killer. It forces the theory to define the metric.

  7.  **Scoring the Positions:**
      *   *Pure Aggregator (Utilitarian):* Fails fairness/lottery cases.
      *   *Pure Non-Aggregator (Kamm/Contractualist):* Fails the 1-vs-5 intuition (unless they do a complex "tie-breaking" move).
      *   *Weighted Aggregator:* Tries to split the difference.
      *   *Ex-Ante Prioritarianism:* Focuses on the lottery case.

  8.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the goal (spec, not argument).
      *   **Section 1: The Specification List.** Group into Data, Structural, and Normative. Label "Genuine" vs. "House Rule."
      *   **Section 2: The Impossibility Check.** Discuss the tension between Aggregation and Individual Claims.
      *   **Section 3: The Constraint that Does the Most Work.** Identify the Lottery/Ex-Ante case.
      *   **Section 4: Scorecard.** Brief table/list.

  9.  **Self-Correction/Nuance Check during drafting:**
      *   *User's Lottery Case:* "1 certain vs 5 @ 1/5". If a theory says "Save the 1 certain," it looks like it ignores the 5. If it says "Run the lottery," it sacrifices a guaranteed life for fairness. This is the *Ex-Ante vs. Ex-Post* conflict. This is the hardest constraint.
      *   *House Rules:* The user asked to sort these. "Most people's answer is stubborn" is a *psychological fact*, not a *normative requirement*. A theory can say "People are wrong." But a theory *should* explain the error. So, "Accommodate or Explain Away" is the requirement, not "Obey."
      *   *Self-Involvement:* Is it a requirement that the theory *allows* self-preference? Or just that it *accounts* for it? Most moral theories say you *shouldn't* prefer yourself in rescue. So the requirement is "Clarify Agent-Neutrality."
      *   *One-off vs. Rule:* This is Act vs. Rule. A theory needs to be consistent across scales.

  10. **Final Polish:** Ensure the tone is collaborative and analytical, matching the user's "spec first" approach. (Avoid saying "You should believe X".)

  *(Self-Correction on Impossibility)*: Is there a formal impossibility theorem? There's the "Non-Identity Problem" and "Mere Addition Paradox," but in rescue specifically, it's often about *Contractualism vs. Aggregation*. Scanlon admits difficulty here. I should frame it as a "Tension" rather than a formal logical contradiction, unless I cite a specific theorem (like Arrhenius's impossibility theorems, though those are population ethics). Let's stick to the *Ex-Ante/Ex-Post* dilemma as the functional impossibility.

  *(Refining the Lottery Case)*: The user asks: "Does the theory have to call this a tie?" If yes, it treats chances as goods. If no, it needs a story. This is the *Ex-Ante Prioritarianism* vs. *Ex-Post Utilitarianism* clash. I need to highlight this as the critical pivot point.

  *(Final Plan)*:
  1. Define the Spec Categories (Phenomena, Structural, Normative).
  2. Populate with user's + mine.
  3. Tag Genuine vs. House Rule.
  4. Analyze Consistency (The Ex-Ante/Ex-Post Dilemma).
  5. Identify the "Killer Constraint" (The Lottery Case).
  6. Scorecard.

