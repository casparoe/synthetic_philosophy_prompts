          *   Can I reproduce the "Evidential" link? The activity creates a *Causal* link (The grader *makes* the assumption). Superrationality relies on the *belief* that the other person *will* do the same.
          *   *Limitation:* The activity enforces the correlation externally. It doesn't generate it internally through reasoning.
          *   *Debrief Task:* I must explicitly state: "In the real world, the Grader isn't there. You have to convince *yourself* that your reasoning is the Grader."

  6.  **Drafting the Content:**
      *   Tone: Direct, instructional, ready-to-run.
      *   Materials: Paper slips, pens, projector for rules.
      *   Numbers: Verified above.
      *   Debrief: Map R1 to "Superrational Coop", R2 to "Threshold of N", R3 to "Indeterminacy".
      *   Troubleshooting: Address the "It's fake" objection.

  7.  **Final Review against Constraints:**
      *   90 mins? Yes.
      *   15-18 people? Yes.
      *   No lecture first? Yes.
      *   Small stakes? Yes (Points).
      *   No lying? Yes (Grading rule is explicit).
      *   Requirement 1 (N-scaling)? Yes (R1 vs R2).
      *   Requirement 2 (Breakdown)? Yes (R3).
      *   Commit to one design? Yes.

      *Self-Correction on Round 3:* If the grading rule is "Assume everyone picks what you picked," then picking 1 yields 20, picking 2 yields 20. It's not that there's no right answer, it's that there are *three* right answers. This fits "no single symmetric choice that's obviously right."
      *Wait, is there a focal point?* Maybe. But the *logic* of symmetry doesn't distinguish them. That's the point.

      *One more check on Round 2:* Splitting into subgroups of 3.
      *   Instruction: "Form groups of 3. You are only graded against your subgroup."
      *   This effectively changes $N$ in the formula $N \times b - c$.
      *   Perfect.

      *Let's write it.*
answer: |-
  # Activity Design: The "Universal Grader" Protocol

  **Goal:** Force participants to experience the incentive structure of superrationality (where your choice is treated as a universal law) without lecturing on the theory first. The activity mechanically enforces the correlation $P(\text{Other}=C | \text{Me}=C) = 1$, allowing them to feel the payoff shift as $N$ changes, and then hit a wall where symmetry fails to select a unique action.

  **Time:** 90 Minutes
  **Group Size:** 15–18 (Adjustable)
  **Stakes:** "Rationality Points" (RP). 100 RP = $5 Coffee/Snack Voucher. (Max payout per person ~150 RP).
  **Materials:** Index cards (3 per person), pens, projector/whiteboard for rules.

  ---

  ## Part 1: Setup (0:00 – 0:10)

  **The Hook:**
  Do not mention "Prisoner's Dilemma," "Superrationality," or "Decision Theory."
  Tell them: *"Today we are testing how groups optimize under **Universal Evaluation**. In standard games, you are graded on your choice vs. others' choices. In this session, you are graded on **what would happen if everyone reasoned exactly like you**."*

  **The Mechanism (The "Universal Grader"):**
  Write this on the board and leave it there. Read it aloud.
  > **THE GRADING RULE:**
  > 1. You submit a choice on a card.
  > 2. We do **not** compare your choice to what others actually did.
  > 3. We calculate your payoff by assuming **EVERYONE ELSE made the exact same choice as you.**
  > 4. You are paid based on that hypothetical scenario.

  **Why this works:** This physically instantiates the superrational premise. It removes the causal dominance of Defection (because "If I Defect, Everyone Defects") and replaces it with the symmetry argument, without requiring them to believe in psychic twins. It's a rule of the game, not a metaphysical claim.

  ---

  ## Part 2: Round 1 — The Large Group (0:10 – 0:25)

  **Setup:**
  Everyone stays in the main group ($N = 18$).
  **Payoff Structure (Public Goods Frame):**
  *   **Choice A (Invest):** You pay **10 RP**. Every person in the group (including you) receives **2 RP**.
  *   **Choice B (Keep):** You pay **0 RP**. Everyone receives **0 RP**.

  **Instructions:**
  *"Calculate your payoff based on the Grading Rule. If you choose A, we assume all 18 people choose A. If you choose B, we assume all 18 choose B. Write your choice and your **calculated payoff** on the card. This helps us see your reasoning."*

  **The Math (For You):**
  *   **If Choose A:** Cost 10. Benefit $18 \times 2 = 36$. Net = **+26 RP**.
  *   **If Choose B:** Cost 0. Benefit 0. Net = **0 RP**.

  **Expected Outcome:**
  Almost everyone will choose **A (Invest)**. The "gut feel" is that A is obviously better because the group benefit dwarfs the cost.
  *Collect cards. Do not reveal results yet.*

  ---

  ## Part 3: Round 2 — The Small Group (0:25 – 0:40)

  **Setup:**
  *"We are changing the evaluation pool. Form groups of **3 people**. Sit together. You are now only graded against your subgroup ($N = 3$). The Payoff Structure is **identical** to Round 1."*

  **Payoff Structure:**
  *   **Choice A (Invest):** You pay **10 RP**. Every person in your **subgroup of 3** receives **2 RP**.
  *   **Choice B (Keep):** You pay **0 RP**. Everyone receives **0 RP**.

  **Instructions:**
  *"Apply the Grading Rule again. Assume everyone in your trio makes your choice. Calculate your net payoff. Submit."*

  **The Math (For You):**
  *   **If Choose A:** Cost 10. Benefit $3 \times 2 = 6$. Net = **-4 RP**.
  *   **If Choose B:** Cost 0. Benefit 0. Net = **0 RP**.

  **Expected Outcome:**
  Almost everyone will choose **B (Keep)**.
  *This is the critical flip.* In Round 1, "Invest" was the rational move under the Universal Grader. In Round 2, "Keep" is the rational move under the *same* logic. The "right" answer shifted solely because $N$ changed.
  *Collect cards. Do not reveal results yet.*

  ---

  ## Part 4: Round 3 — The Coordination Wall (0:40 – 0:55)

  **Setup:**
  *"Return to the main group ($N = 18$). The Grading Rule still applies (we assume everyone does what you do). But the payoff structure has changed."*

  **Payoff Structure (Coordination Game):**
  *   **Choice:** Write down a number: **1, 2, or 3**.
  *   **Rule:** If everyone in the group writes the **same number**, you get **20 RP**. If there is *any* mismatch, you get **0 RP**.

  **Instructions:**
  *"Apply the Grading Rule. If you write '1', we assume everyone writes '1'. If you write '2', we assume everyone writes '2'. Calculate your payoff."*

  **The Math (For You):**
  *   **If Choose 1:** Assumed Match. Payoff = **20 RP**.
  *   **If Choose 2:** Assumed Match. Payoff = **20 RP**.
  *   **If Choose 3:** Assumed Match. Payoff = **20 RP**.

  **Expected Outcome:**
  Confusion. There is no *single* symmetric choice that is superior. Some will pick 1, some 2, some 3. All are "superrationally" consistent (symmetric), but they won't match in reality (though reality doesn't matter for the grade, the *ambiguity* matters for the discussion).
  *Collect cards.*

  ---

  ## Part 5: The Debrief & Theory Mapping (0:55 – 1:30)

  **Step 1: Reveal the Data (5 mins)**
  Write the Round 1 and Round 2 results on the board.
  *   Round 1: ~90% Invested.
  *   Round 2: ~90% Kept.
  *   Ask: *"Did the rules of the game change between Round 1 and 2?"* (No, only N changed). *"Did your goal change?"* (No, maximize RP). *"So why did the rational choice flip?"*

  **Step 2: Map to Superrationality (15 mins)**
  Now you introduce the terms.
  *   **The Universal Grader = The Epistemic Twin.** Explain: *"In standard Causal Decision Theory, you assume your choice doesn't change theirs. In the Grader Protocol, your choice *determines* theirs. Hofstadter's Superrationality asks you to play *as if* the Grader exists, even when it doesn't."*
  *   **The N-Threshold (Requirement 1):** Point to the math.
      *   Round 1: $18 \times 2 - 10 = +26$. (Cooperate is rational).
      *   Round 2: $3 \times 2 - 10 = -4$. (Defect is rational).
      *   **Lesson:** Superrationality is not "Always Cooperate." It is "Cooperate when $N \times \text{Benefit} > \text{Cost}$." In a 2-player PD with standard payoffs, superrationality often *still* says Defect. This corrects the common misconception.
  *   **The Coordination Wall (Requirement 2):** Point to Round 3.
      *   *"Why was Round 3 harder?"*
      *   **Lesson:** Symmetry narrows the options (to matching profiles), but it doesn't always select a *unique* option. Superrationality solves the "Prisoner's Dilemma" (where one symmetric outcome is better), but it struggles with "Stag Hunt" or pure Coordination games where multiple symmetric equilibria exist. It tells you to coordinate, but not *how*.

  **Step 3: The "Real World" Gap (10 mins)**
  Be honest about the limitation.
  *   *"In this game, I (the Instructor) enforced the correlation. In the real world, there is no Universal Grader. Why should you believe your choice predicts theirs?"*
  *   This is where you open the floor to the "gut feel" objection. *"You felt safe cooperating in Round 1 because the mechanism guaranteed it. In a real one-shot PD, you lack that guarantee. Superrationality requires you to treat 'similar reasoning' as a physical link. That's the leap."*

  ---

  ## Predictable Failure Modes & Fixes

  **1. The "This is Fake" Objection**
  *   **What happens:** A participant says, *"This doesn't prove anything. Of course I cooperated, you forced the correlation."*
  *   **The Fix:** Agree with them. *"Exactly. This activity isn't proving the world is correlated. It's isolating the **logic** of the correlation. The question for the reading group is: Is it rational to act *as if* this Grader exists when you meet a stranger who reads the same books you do? The activity shows you the payoff if the premise holds. The debate is whether the premise holds."*

  **2. Round 3 Confusion**
  *   **What happens:** People ask, *"But what if others pick different numbers? Don't I get 0?"*
  *   **The Fix:** Remind them of the Grading Rule. *"For the purpose of your points, we assume they match you. The point of this round isn't the points; it's the feeling of having no logical reason to prefer 1 over 2."*

  **3. Calculation Errors**
  *   **What happens:** People mess up the $N \times 2 - 10$ math in Round 2.
  *   **The Fix:** Walk around during the 5-minute decision window. If you hear confusion, clarify the math publicly without giving the answer. *"Remember, if you Invest, everyone in your trio Invests. That's 3 people getting 2 points."*

  ---

  ## Limitations (What You Must Supply)

  Be frank about this in your closing remarks. The activity cannot reproduce:
  1.  **The Evidential Link:** The activity uses a *causal* link (the Instructor's grading rule). Real superrationality relies on an *evidential* link (my choice is evidence of theirs). You must explain that the "Grader" is a metaphor for "Logical Causality."
  2.  **The Risk of Error:** In the activity, the correlation is 100%. In reality, even among rationalists, correlation is $<100\%$. You need to lead a discussion on "What if I'm 90% sure they're like me? Does the math still hold?" (Use the Round 2 numbers: if $N=3$, you need high confidence to Cooperate. If $N=18$, you can tolerate more noise).

  ## Why This Design?
  *   **No Lecture First:** The "Grading Rule" is a mechanic, not a theory. They engage with the incentives immediately.
  *   **Requirement 1 (N-Scaling):** By keeping payoffs constant and changing group size, the "flip" from Cooperate to Defect is undeniable and mathematical, not philosophical.
  *   **Requirement 2 (Breakdown):** Round 3 demonstrates that symmetry is a constraint, not a solution generator. It prevents the "Superrationality solves everything" takeaway.
  *   **Honesty:** It doesn't claim to prove twins exist. It claims to show what rationality looks like *if* you accept the premise.

  **Final Tip:** When you hand out the coffee vouchers at the end, make a point of saying, *"These were awarded based on the Universal Grader logic. If we had used standard Causal Decision Theory grading (your choice vs. actual others), the payouts would have looked very different."* This cements the distinction between the two decision theories.
