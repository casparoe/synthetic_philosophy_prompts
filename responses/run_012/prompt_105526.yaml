prompt: |-
  I run a decision-theory / rationality reading group — grad students mostly, a few sharp undergrads, usually 15-18 of us, and I've got a 90-minute slot booked next month. I want to do the session on superrationality, i.e. the idea that in a one-shot prisoner's dilemma with someone who's in exactly your epistemic position, cooperating is the rational play, because you and your counterpart are going to land on the same answer. I've given the standard lecture version before and it just washes over people — they nod along at the symmetry argument and then say "but defecting still pays more" and we go in circles for twenty minutes.

  So: design me a runnable activity where they feel the pull of it in their gut before anyone says the word. No lecture with a game stapled on the end. I want the rules and the incentives to set the trap, so they walk into the conclusion themselves. Small real stakes are fine (points they can redeem for coffee/snacks at the break) but nothing that needs actual money, and nothing where someone has to lie to a friend's face if we can avoid it.

  Two things I'd like it to bring out, because this is where I think the textbook treatments get thin and I want the activity to actually go there:

  First, superrationality isn't just "always cooperate." In the n-player version of the dilemma — where you choosing C costs you something and hands a benefit to each of the other players — the symmetric reasoning says cooperate only when the benefit you'd hand everyone else outweighs your own cost, so whether C or D is the superrational move depends on how many people are in the pot. I'd love the group to feel that the "right" answer shifts with the size of the group, ideally by running the same thing at two different scales so they can watch it flip. Even better if the flip lands somewhere they didn't expect.

  Second, I want a moment where the "everyone does the same as me" reasoning runs out of road — a spot where theres no single symmetric choice that's obviously right, so the debrief can be honest that the idea doesn't hand you a clean answer everywhere. If trying to get both of these in makes the thing too crowded for 90 minutes, tell me what you'd cut and commit to a call, but I'd rather you try for both.

  The deliverable: the full runnable thing — rules, materials, the exact payoff scheme with numbers filled in, how you set up the two scales, roles if there are any, and a rough timeline for the 90 minutes. Then a debrief section that maps specific moments in the activity onto specific parts of the idea (where the causal reasoning bites, where the symmetric reasoning bites, where they came apart). Also: what will predictably go wrong the first time I run it and how I should handle it in the room. And be frank about which part of the idea the activity can't reproduce and that I'll have to supply myself — I care more about that being honest than about it flattering the design.

  Please commit to one design. Make the actual choices — the numbers, the group sizes, the order of play — and give me your reasons for them, rather than handing me three seperate variants and letting me pick. If you think one of my two wishes is a bad idea, say so and say why, but still hand me a finished activity.

  Don't worry about citing anything or pointing me at further reading — I just need the activity itself.
