      *   *Refinement:* To make it feel like PD, the payoff needs to look like: "You get X if you Defect, Y if you Cooperate, PLUS a bonus if the *group* matches you."
      *   *Better Refinement:* Let's use the "Twin Prisoner's Dilemma" structure but scaled.
      *   *The Mechanism:* "The Mirror Protocol."
      *   *Round 1 (Small N):* Split into pairs? No, the prompt asks for N-player scaling.
      *   *The Twist:* To make them *feel* the correlation, I need to remove the ability to distinguish themselves.
      *   *Proposal:* **The "Clone Cohort" Game.**
      *   *Premise:* "For the purpose of this game, we are assuming you are all algorithmic clones. You don't know which 'slot' you are in, but you know everyone else is reasoning exactly as you are."
      *   *Payoff Structure:* Needs to be carefully calibrated.
          *   Choice: A (Cooperate) or B (Defect).
          *   Base Payoff: A gives 0, B gives 5. (Temptation).
          *   Group Bonus: If *everyone* chooses A, everyone gets 10. If *anyone* chooses B, everyone gets 0. (This is too harsh, creates panic).
          *   Let's use a Linear Public Goods structure but framed as PD.
          *   Cost of A: $c$. Benefit to *each* player (including self): $b$.
          *   Net for Self if A: $b - c$. Net for Self if B: $0$.
          *   Net for Others if A: $b$. Net for Others if B: $0$.
          *   Standard PD condition: $c > b$ (so individually, B is better).
          *   Superrational condition: $N \times b > c$ (so collectively, A is better).
          *   Wait, if $c > b$, then $b-c$ is negative. So individual rational is B.
