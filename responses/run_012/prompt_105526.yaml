          2.  Show where symmetric reasoning breaks down (no clean answer).
          3.  Small real stakes (points for coffee/snacks), no lying to friends.
          4.  Commit to *one* design with specific numbers/timing.
          5.  Include debrief mapping activity moments to theory.
          6.  Include "what will go wrong" and limitations.

  2.  **Deconstruct the Challenge:**
      *   *The Core Tension:* Causal Decision Theory (CDT) says Defect (dominant strategy). Evidential/Superrational Decision Theory (EDT/SDT) says Cooperate (if correlation is high/perfect).
      *   *The "Gut Feel" Problem:* In a standard 2-player PD, the temptation to defect is huge ($T > R$). Even if I think the other person is like me, the immediate gain from defecting ($T - R$) feels concrete, while the loss from them defecting ($R - P$) feels contingent on my choice.
      *   *The N-Player Requirement:* I need to vary $N$ to show the threshold where Cooperation becomes Superrational and where it stops making sense.
      *   *The "Breakdown" Requirement:* I need a scenario where symmetry doesn't yield a unique solution or where the correlation assumption is visibly strained.

  3.  **Brainstorming Activity Structures:**
      *   *Idea 1: Simultaneous Paper Votes.* Classic. But hard to vary $N$ dynamically without splitting the group. If I split the group, they aren't playing against *everyone*, just their subgroup.
      *   *Idea 2: Computer/Mobile Interface.* Too much setup.
      *   *Idea 3: The "Common Source" Randomizer.* Use a shared random event to enforce correlation. (e.g., "If the coin lands heads, you all must play C"). But this removes agency.
      *   *Idea 4: The "Algorithm Submission".* Participants submit a rule, not a move. (Too abstract for 90 mins).
      *   *Idea 5: The "Identical Room" Protocol.* This is the strongest candidate. Treat the whole group as a single "superrational agent" facing a payoff structure that scales with $N$.

  4.  **Developing the "Identical Room" Protocol:**
      *   *Setup:* The group is told they are all in the *same* epistemic position. They are not playing against each other directly; they are all playing the *same game* against a "Bank" that aggregates their choices.
