      *   *Actually, the prompt asks for a moment where "everyone does the same as me" runs out of road.* This suggests a coordination problem or a case where symmetry allows multiple equilibria.
      *   *Idea:* Introduce a "Threshold" round. If >50% choose A, A pays. If <50%, B pays. Symmetry doesn't tell you which focal point to pick.

