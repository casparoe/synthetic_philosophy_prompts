answer: |-
  # DECISION TREE: EPISTEMIC STATUS OF IDEALIZED MODELS

  **START:** Consider a scientific model whose central assumptions are known to be false (e.g., frictionless planes, infallible agents).

  **NODE 1: STATUS OF FALSEHOOD**
  Is the falsity of these assumptions...
  *   **(A) A positive strength** (the more unrealistic, the more significant)? → Go to **NODE 3**.
  *   **(B) A debt** (the model must eventually pay this down)? → Go to **NODE 2**.
  *   **(C) Irrelevant** (meant only to hold factors fixed)? → Go to **NODE 4**.
  *   **(D) Disqualifying** (unless the assumption is at least approximately true)? → **LEAF 1**.

  **NODE 3: ECONOMIC SUCCESS (From 1A)**
  *Case:* An economic model predicts aggregate behavior well using agents who maximize utility infallibly. Does this success warrant...
  *   **(A) No belief about agents** (model is merely a useful calculating device)? → **LEAF 2**.
  *   **(B) Belief only in empirical adequacy** (observables match, unobservables suspended)? → **LEAF 3**.
      *(Note: Branch 'Belief in unobservable processes' is unoccupied here; incoherent with 'Falsehood as Strength'.)*

  **NODE 2: DE-IDEALIZATION (From 1B)**
  *Case:* When later work adds friction to the frictionless plane, does the successor model...
  *   **(A) Merely have the same standing** (a different model, not closer to truth)? → **LEAF 4**.
  *   **(B) Come closer to the truth** about real surfaces? → Go to **NODE 7**.

  **NODE 7: TERMINATION (From 2B)**
  Does progressive de-idealization...
  *   **(A) Guarantee convergence** to a true description of the world? → **LEAF 5**.
  *   **(B) Lack guarantee** (fundamental laws may always lie)? → **LEAF 6**.

  **NODE 4: DISTORTION VS. ISOLATION (From 1C)**
  *Case:* Contrast treating a body as a point mass (distortion) vs. assuming away a known factor (isolation). Do these...
  *   **(A) Have distinct epistemic standing**? → **LEAF 7**.
  *   **(B) Lie on one continuum** of idealization? → Go to **NODE 5**.

  **NODE 5: TOOL VS. DESCRIPTION (From 4B)**
  Is the model primarily...
  *   **(A) A tool/experiment** performed on a system that does not exist? → Go to **NODE 6**.
  *   **(B) A description** of the world? → *(Unoccupied: Neglect. Why isolate if describing?)* → **LEAF 8**.

  **NODE 6: REGULARITIES (From 5A)**
  Are the regularities the model encodes...
  *   **(A) Locally true** of the model system only? → **LEAF 8**.
  *   **(B) True of the world** (at least approximately)? → *(Unoccupied: Overlap with Galilean Realism.)*

  ---

  ### DIAGNOSTIC LEAVES

  1.  **Assumption Realism:** *Awkward Commitment:* Must reject empirically successful theories solely because their assumptions are strictly false.
  2.  **Friedman-style Instrumentalism:** *Awkward Commitment:* Must maintain that making assumptions more realistic would not improve the theory.
  3.  **Constructive Empiricism:** *Awkward Commitment:* Must suspend belief in the truth of a theory even when it yields novel predictions.
  4.  **Model Fictionalism:** *Awkward Commitment:* Must treat successful scientific models as ontologically equivalent to fictions.
  5.  **Galilean Idealization + Convergent Realism:** *Awkward Commitment:* Must assume de-idealization processes are guaranteed to terminate in truth.
  6.  **Cartwright-style View:** *Awkward Commitment:* Must assert that fundamental laws of physics literally lie about the world.
  7.  **Minimalist Idealization (Isolationism):** *Awkward Commitment:* Must defend a sharp epistemic distinction between distortion and isolation.
  8.  **Model-as-Experiment:** *Awkward Commitment:* Must claim we learn about the world by experimenting on non-existent systems.

  ### DIAGNOSTIC FLAGS

  *   **Collapse Warning:** **Instrumentalism (2)**, **Fictionalism (4)**, and **Constructive Empiricism (3)** risk collapsing. They are separated here only by Node 3 (aim of success) and Node 2 (status of de-idealization); if "usefulness" and "empirical adequacy" are conflated, these leaves merge.
  *   **Realist Separation:** **Galilean (5)** and **Cartwright (6)** separate only at Node 7 (termination guarantee); without this node, both claim de-idealization brings us closer to truth.
  *   **Unoccupied Combinations:**
      *   *Node 3 (Belief in Processes) + Node 1A (Strength):* **Incoherent.** One cannot claim false assumptions are a *strength* while believing they describe reality.
      *   *Node 5 (Description) + Node 4B (Continuum):* **Neglect.** No major view treats isolating assumptions as a continuum while insisting the model describes the world directly.
      *   *Node 6 (True of World) + Node 5A (Tool):* **Overlap.** This combination logically redirects to Galilean Realism (Leaf 5).
