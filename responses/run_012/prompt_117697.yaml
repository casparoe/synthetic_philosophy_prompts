answer: |-
  Here is the specification list for an adequate account of idealization, derived from your cases.

  **Requirements**

  *   **Discrimination:** Must distinguish controllable approximations (i) from constitutive lies (ii). It must explain why removing the first changes results slightly, while removing the second destroys the phenomenon. [Non-negotiable]
  *   **Artifact Legitimacy:** Must explain how results that vanish in reality (e.g., phase transitions in infinite systems) count as knowledge rather than mathematical artifacts. [Non-negotiable]
  *   **Parameter Opacity:** Must differentiate structural idealizations from fitted parameters (iii) that absorb error. The account must clarify why a fitted fudge is epistemically different from a theoretical limit. [Non-negotiable]
  *   **False Input Success:** Must account for why false inputs yield better predictions than true ones (iv). [Non-negotiable]
  *   **Counterfactual Validity:** Must justify reasoning about impossible states (zero viscosity) as legitimate inquiry rather than nonsense. [Non-negotiable]
  *   **Pluralism:** Must allow incompatible models to coexist as valid descriptions of the same system (vi). [Contested: Realists resist; Pragmatists accept]
  *   **Epistemic Transfer:** Must explain how students learn truth from falsehoods (vii) without being misled. [Non-negotiable]

  **Incompatible Pairs (Tensions)**

  *   **(ii) vs. (vii):** If the phenomenon *only* exists because of the lie (ii), there is no corresponding truth in the real system for the student to learn (vii). You cannot learn how a finite system works from an infinite one if the behavior disappears at finitude.
  *   **(iv) vs. Explanation:** If false inputs predict better (iv), the model likely misrepresents the causal mechanism. This tensions with the idea that models *explain*. If the mechanism is wrong, the model saves the phenomena but does not elucidate the world.

  **The Excluding Requirement**

  **Artifact Legitimacy (ii)** does the most work excluding candidates.
  Naive Realism fails here: it cannot accept that a falsehood (infinite system) generates genuine knowledge about a finite world. Pure Instrumentalism (Friedman) also fails: it accepts the prediction but cannot justify why you feel you possess *knowledge* rather than a reliable tool. Any account that cannot validate the epistemic status of essential idealizations is dead on arrival for your practice.

  **Where Known Positions Land**

  *   **Instrumentalism:** Aces (iv) and (v); fails (ii) and (vii) because it denies models yield knowledge, only predictions.
  *   **Scientific Realism:** Aces (v) and (vii); struggles with (ii) and (iv) because it demands approximate truth for success.
  *   **Model-Based View (MBV):** Treats models as autonomous artifacts; handles (ii) best by decoupling model truth from world truth, but risks relativism on (vi).
