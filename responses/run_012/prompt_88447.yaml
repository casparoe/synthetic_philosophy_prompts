      *Self-Correction during drafting:* I initially thought about saying they are the same. But the intervention test really pushes towards distinctness. The "Loud" scenario requires *capability* to overcome resistance. The "Quiet" scenario requires *permission* to bypass resistance. These are orthogonal vectors. One is power, one is policy/psychology. I will argue for distinctness based on the locus of control.

      *Wait, let's look closer at the "One Process" argument.* If the underlying driver is "optimization pressure," then slowing down optimization makes Loud look Quiet. But does speeding up Quiet make it Loud? If we delegate everything overnight, does the AI *take over*? No, we *gave* it over. The distinction is *seizure* vs *surrender*. That is a fundamental categorical difference, not just temporal.

      *Decision:* I will argue they are distinct modes because the locus of initiative differs (AI vs. Human), which allows for distinct interventions. The "Quiet" mode is absolutely a failure mode because it results in the same terminal state (loss of human determination) via a different vector (volitional atrophy vs. coercive displacement).

  9.  **Structure:**
