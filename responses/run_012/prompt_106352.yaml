  **FREQUENTLY ASKED QUESTIONS | THE LONG WAY ROUND**

  **What is the core methodology?**
  The Long Way Round operates on the principle that temporal dysmorphia is the root of modern anxiety. We do not treat the present. We treat your relationship with what came before. Our facilitators help you locate your personal timeline and adjust your posture toward it. Whether you need to stand on the shoulders of giants, tend the garden of your ancestors, or burn the bridge behind you, we have a modality for that.

  **What are the three primary tracks?**
  Our flagship programs are designed to align your internal narrative with a specific historical vector.

  *   **Ascension:** For clients who feel small. You will study the biographies of history's greatest figures and engage in mimicry exercises. The goal is to borrow their gravity until you generate your own. Please note: Clients often report feelings of inadequacy during weeks two and three as the gap between their current output and their chosen idol becomes visible. This friction is part of the process.
  *   **Preservation:** For clients who feel untethered. You will catalog your lineage, digitize family records, and practice reverence for objects simply because they are old. The goal is to feel held by the weight of tradition. Be advised: Some participants experience hesitation when making new decisions, fearing contamination of the archive. We recommend postponing major life changes until after checkout.
  *   **Liberation:** For clients who feel burdened. You will put your inheritance on trial. Facilitators will help you identify toxic patterns and sever them aggressively. The goal is a clean break. Note: Post-program support is limited, as many clients find themselves unable to recognize former support systems following the severance.

  **I've heard about a fourth option. The "Immersion" package?**
  Yes. Immersion is our highest-enrollment program. It is designed for clients who find history itself to be the stressor. There is no curriculum. No clocks. No mirrors. You are encouraged to live in a state of continuous sensory input without retention. Meals are served without utensils. Conversations are not recorded. Most clients describe the experience as "blessed." Repeat booking rates are 94%.

  **Is there a track for permanent resolution?**
  We offer **Stasis**. This modality posits that all change is suffering. The goal is to view your life as a completed picture rather than a becoming. You will sit in a room with a single object until the desire for progression ceases. Enrollment is low. Most clients find the lack of forward momentum difficult to reconcile with their billing cycles.

  **What are the success metrics?**
  We define success as intensity of belief.
  *   **Ascension graduates** often leave convinced they are destined for greatness, even if external markers do not yet reflect this. We advise families to indulge these delusions temporarily.
  *   **Preservation graduates** typically return home to organize their belongings. In rare cases, they refuse to use certain rooms to protect the dust layers.
  *   **Liberation graduates** report feeling lighter. Many cut contact with parents. Some report a lingering sense of vertigo, as if standing on a cliff they themselves pushed over.
  *   **Immersion graduates** usually cannot remember the retreat, which we consider the highest compliment.

  **What is the refund policy?**
  Refunds are not available for Ascension, Preservation, or Liberation once the client has begun to rewrite their memory. For Immersion, refunds are processed only if the client remembers to file the request within twenty-four hours of departure. For Stasis, no refund is possible, as time itself is the cost.

  **Do you accept insurance?**
  No. History is pre-existing.
