  ### Notes on Theory and Form

  **Liberties and Contested Readings**
  1.  **Omniscience vs. Information Asymmetry:** The poem grants the reader access to the private signals (Lines 1 and 3 of the first stanza: the water withdrawing, the heavy silence). In a strict information cascade model, downstream agents cannot see the private signals of upstream agents; they only see the *actions*. The poem cheats by letting you hear the warning even as the characters ignore it, creating dramatic irony that doesn't exist for the participants.
  2.  **Perfect Sequentiality:** The poem moves house-to-house in a strict line (Woman → Neighbor → Children → Street). Real-world cascades often occur in networks where agents observe multiple peers simultaneously, not just a single predecessor. The pantoum's linear chain enforces a sequentiality that makes the cascade look more deterministic than it might be in a meshed network.
  3.  **Memory vs. Discarding:** As you noted, the pantoum forces lines to return. In a rational cascade model, once a public pattern is established, private signals are effectively discarded (weighted at zero). The poem's structure preserves every signal, even the private ones, trapping them in the final stanza. This suggests the information is still *there*, just rendered inert by the structure of the herd, whereas the theory suggests the agents literally stop processing it.

  **The Critical Theoretical Pivot**
  The piece of theory that, if false, would force a rewrite is the **assumption of rational neglect of private information**. The cascade model relies on the premise that once a few early movers act, it becomes rational for subsequent agents to ignore their own private signals entirely and follow the public history.

  If it turned out that real-world agents continuously aggregate private signals alongside public actions (i.e., they do *not* discard their own evidence even when it contradicts the herd), the cascade would not lock in. The "wrong" outcome (staying in the village) would be far less likely because the accumulated weight of a dozen private warnings ("the water withdrew," "the silence hung heavy") would eventually outweigh the public signal of the first two stayers. If this were the case, the poem's ending—where the private signals return in the final stanza only as atmosphere, powerless to change the outcome—would be fundamentally incorrect. The poem relies on the tragedy that the truth is visible but structurally weightless once the herd moves.
