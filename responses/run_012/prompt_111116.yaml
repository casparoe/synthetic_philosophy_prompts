answer: |-
  # QUESTION-PERIOD PREPARATION SHEET
  **Topic:** Warrant-Depletion Account of Dirty Hands
  **Session:** Two-Day Workshop (15 Participants)

  ## STRATEGIC OVERVIEW
  Your position hangs on two claims: (1) Institutions can hold normative debt, and (2) This debt is distinct from victim reparations. The session will try to collapse these. Your goal is not to prove the theory true, but to prove it is *coherent* and *not an apology for impunity*.

  ## OBJECTIONS (Ordered by Damage Potential)

  ### 1. The Truth Commission Expert (The Impunity Charge)
  **Likelihood:** High (Once discussion moves to application). **Damage:** Lethal.
  **The Objection:** "You say the institution pays the price through 'depleted legitimacy.' But legitimacy is abstract. If a state tortures to prevent a bombing, and you say the 'state's warrant is lower,' the victim is still tortured and the torturer goes home clean. Who audits this ledger? If the institution that committed the wrong is the same one holding the debt, isn't 'legitimacy depletion' just a euphemism for 'we got caught'? This looks like a theory of state impunity."

  *   **Concede Up Front:** "You are right that warrant depletion is not a substitute for victim reparations. My account describes the official's moral status, not the victim's recourse."
  *   **Hold:** The debt to the victim and the depletion of the warrant are two different ledgers. One is justice (owed to the victim), the other is authority (owed to the office).
  *   **Two-Minute Reply:** "My claim is not that the debt disappears, but that it is mislocated if we put it on the official's soul. The institution *does* pay: it loses the standing to demand future obedience or claim moral high ground. But you are correct to press the audit. If the institution does not acknowledge the depletion—through truth-telling or institutional reform—then the depletion becomes invisible corruption. My theory predicts that unauthorized actors (putschists) cannot hide this depletion because they have no institutional shield. For authorized officials, the 'audit' is the public loss of trust. If that trust isn't lost, the warrant wasn't actually spent, it was stolen."
  *   **Soft Spot:** This reply survives only if you grant that "loss of trust/standing" is a real cost comparable to moral guilt. If the room decides institutional legitimacy is just "power," this reply collapses.
  *   **Note:** This is the reply that **has to land** for the session to go well. If you look like an apologist for state crimes, the philosophical nuances won't matter.

  ### 2. The Kantian (The Category Mistake)
  **Likelihood:** High (Early conceptual pushback). **Damage:** High.
  **The Objection:** "You are making a category mistake. Institutions are fictions; they cannot bear moral weight. Only agents can be 'poorer' in a moral sense. You haven't solved the dirty hands problem; you've just reinvented the excuse/justification distinction and blurred it. You're saying the act is justified (warranted) but the agent is excused (no remainder). That's not a new ontology; it's just confusing vocabulary."

  *   **Concede Up Front:** "I concede institutions do not have souls or consciences. They are not moral agents in the human sense."
  *   **Hold:** They *are* bearers of normative standing. Warrant is a relational property, not a psychological one.
  *   **Two-Minute Reply:** "The excuse/justification distinction asks: 'Was the act right?' My question is: 'Who pays for the wrong?' Justification says the act wasn't wrong. I am saying the act *is* wrong, but the cost is billed to the institutional capacity to act, not the individual's moral record. Think of it like a corporate budget. The company can spend money it doesn't have, but the company goes bankrupt, not the CEO personally. I am arguing moral warrant functions similarly. It allows us to say the official did what was required without lying that the act was good."
  *   **Soft Spot:** The financial metaphor ("budget," "bankrupt") is dangerous here (see Formulation Flags below). It invites the charge that you are trivializing morality.
  *   **Note:** If you lose this, the Rawlsian objection becomes unavoidable.

  ### 3. The Rawlsians (The Consent Problem)
  **Likelihood:** Medium-High. **Damage:** High.
  **The Objection:** "Even if an institution can hold debt, you say the debt is transferred to the collective. But the collective is the citizens. Did the citizens consent to have their collective standing spent on torture? You are violating public reason. You're allowing officials to spend the citizens' moral capital without their knowledge. That's not a transfer; it's theft."

  *   **Concede Up Front:** "Citizens do not consent to specific acts of warrant depletion. That is often impossible in emergencies."
  *   **Hold:** The warrant is constitutive of the office, not a contract per act. Accepting the office implies accepting the risk of depletion.
  *   **Two-Minute Reply:** "The warrant isn't the citizens' personal moral capital; it is the *system's* capacity to function. When an official spends it, they are burning the bridge for future officials. The 'debt' is that the institution is now less able to function morally. Citizens don't need to consent to each transaction, just as they don't consent to each budget deficit, but they do bear the cost in reduced institutional trust. The key is that the official feels the depletion as anguish. That anguish is the signal that the spending was not casual."
  *   **Soft Spot:** This relies on the premise that "institutional capacity" is distinct enough from "citizen trust" to avoid the consent requirement. The Rawlsian may not grant that distinction.
  *   **Note:** **Duplicate Warning:** This is the theoretical version of the Truth Commission Expert's objection. Both ask: *Why is the third party (citizen/victim) bound by this ledger?* **Answer the Truth Commission objection primarily.** If you satisfy the demand for real-world accountability, the Rawlsian consent worry loses its teeth.

  ### 4. The Moral Psychologist (The Phenomenology)
  **Likelihood:** Medium. **Damage:** Medium-High.
  **The Objection:** "You claim the official feels guilt, but you redefine it as 'reading the balance.' But from the inside, guilt *is* a stain. It feels like 'I am bad,' not 'My office is poorer.' You are theorizing away the data. How, in the first-person case, would you distinguish warrant-depletion from ordinary agent-remainder? If you can't, your description is false."

  *   **Concede Up Front:** "I am not offering a competing empirical theory of emotion. The feeling may be identical."
  *   **Hold:** The *object* of the emotion is what matters for the moral theory, not the qualia.
  *   **Two-Minute Reply:** "Phenomenology is interpretable. A soldier feels anguish when firing on friendlies. Is that 'sin' or 'tragedy'? My claim is that the *correct description* of that anguish is the recognition of lost authority, not moral corruption. The distinction shows up in the aftermath. If it were a stain, the official should resign or be punished personally. If it is depletion, the official should step back until the institution replenishes its warrant. The difference is in the prescription, not the feeling."
  *   **Soft Spot:** This is speculative. You are telling a psychologist how to interpret their subject's experience.
  *   **Note:** Do not get bogged down in the nature of guilt. Pivot to the *prescriptive* difference (resignation vs. replenishment).

  ### 5. The Weberian Realist (The Redescription)
  **Likelihood:** High (Opening or Closing). **Damage:** Low.
  **The Objection:** "This is just the 'ethic of responsibility' with a ledger attached. Weber said the leader must bear the burden. You say the institution bears it. But the leader *is* the institution in that moment. You haven't changed the ethics; you've just changed the metaphor from 'burden' to 'debt.' Why the new vocabulary?"

  *   **Concede Up Front:** "I am working firmly in the tradition of the ethic of responsibility."
  *   **Hold:** Weber left the leader spiritually scarred. I explain *why* the scar exists without damning the soul.
  *   **Two-Minute Reply:** "Weber left us with a tragedy: to act is to be soiled. That leads to cynicism or withdrawal. My account preserves the tragedy—the warrant is gone, the cost is real—but removes the metaphysical stain. It allows the official to return to duty later if the warrant is replenished. Weber's leader is permanently marked; mine is temporarily depleted. That changes how we train officials and how we judge them post-crisis."
  *   **Soft Spot:** If the room prefers the tragic vision, your "solution" will look like a dilution.
  *   **Note:** This is a friendly objection. Use it to frame your view as a refinement, not a revolution.

  ---

  ## FORMULATION FLAGS
  **Where your own words are doing damage:**
  1.  **"Booked against," "Ledger," "Debt," "Spent."**
      *   *Risk:* These financial metaphors invite the Impunity Charge (Objection 1). They make morality sound like accounting, where you can pay off a sin with a fee.
      *   *Fix:* When pressed, swap "Legitimacy" for **"Normative Standing."** Swap "Debt" for **"Cost to Capacity."** It sounds less like you can pay off a victim with institutional credit.
  2.  **"Legitimacy."**
      *   *Risk:* The Truth Commission expert will hear "Reputation."
      *   *Fix:* Define it immediately as "The recognized right to rule," not "Popularity."

  ## STRATEGIC MOVES

  **The Single Concession (Costs Least, Buys Most):**
  Concede that **"Legitimacy" is a poor label** and agree to use **"Normative Standing"** or **"Institutional Capacity."**
  *   *Why:* It costs you nothing conceptually, but it disarms the Kantian (who hates reifying legitimacy) and the Truth Commission expert (who thinks legitimacy is just PR). It signals you are talking about *power to act*, not *reputation*.

  **The Single Reply That Must Land:**
  The **Truth Commission/Impunity Reply (Objection 1).**
  *   *Why:* If the room concludes your theory allows officials to torture without personal moral cost because "the state paid," the session ends in hostility. You must firmly separate *official moral remainder* from *victim reparations*.

  ## THE KILLER QUESTION (The One You Hope Nobody Asks)
  **"If a putschist acts without warrant, carries a remainder, but succeeds and becomes the new government, does the remainder vanish retroactively? If yes, then legitimacy is just success. If no, how do you distinguish them from your authorized official who also succeeded?"**

  *   **Why it hurts:** It attacks your third consequence (the prediction about unauthorized actors). If success wipes the debt, you are a realist. If success doesn't wipe the debt, your "authorized official" looks no different than the successful tyrant, because both have "spent" something. It collapses the distinction between *warrant* and *power*.
  *   **Preparation:** Do not answer this unless asked. If asked, hold that the *source* of the warrant matters, not the outcome. The putschist steals the standing; the official spends it. The debt remains for the putschist because they broke the system to act; the official acted *within* the system, depleting it. But be prepared for this to feel like a distinction without a difference.

  ## DUPLICATE OBJECTION NOTE
  The **Rawlsian** and **Truth Commission** objections are the same worry wearing different clothes.
  *   *Rawlsian:* "The citizens didn't consent to the debt."
  *   *Truth Commission:* "The victims aren't getting paid."
  *   *Strategy:* **Answer the Truth Commission objection.** It is the concrete, moral version of the abstract Rawlsian consent problem. If you show that victims still have a claim for repair *independent* of the warrant ledger, the Rawlsian consent worry is mitigated (the citizens aren't being billed for the sin, the institution is being billed for the authority). Do not let them split into two separate lines of attack.
