      *   **Specific Focus:** Lexical Threshold Negative Utilitarianism (LTNU).
      *   **Key Questions for LTNU:** What makes it coherent (vs. verbal trick)? How is the threshold $T$ determined (empirical, conceptual, collapse if unspecified)?
      *   **Constraints:** No reading list. Just a "menu of readings," verdicts, and trade-offs spelled out.
      *   **Tone:** Academic, precise, analytical, helpful for a response paper.

  2.  **Deconstruct the Slogan ("Pain and Pleasure Don't Trade Off"):**
      *   I need to identify the distinct philosophical interpretations of this claim.
      *   *Candidate 1: Qualitative Incommensurability.* Pain and pleasure are different *kinds* of value, like apples and oranges. No common currency.
      *   *Candidate 2: Lexical Priority (Strong).* Any amount of pain outweighs any amount of pleasure. (The "stubbed toe vs. billion orgasms" view).
      *   *Candidate 3: Lexical Threshold (The Student's Focus).* Severe pain outweighs any pleasure, but mild pain might trade off.
      *   *Candidate 4: Asymmetry of Intensity.* Pain is "heavier" per unit, but still tradeable (weighted utilitarianism), not strictly non-tradeable. (Wait, the slogan says *don't* trade off, so this might be a misinterpretation, but worth distinguishing).
      *   *Candidate 5: Epistemic/Practical.* We *can't* measure the trade-off, not that it doesn't exist.
      *   *Candidate 6: Agent-Relative/Deontological.* It's not about value, it's about rights/constraints. (Probably outside the scope of the welfare seminar, but worth a brief mention if relevant to the "proposal" context).

  3.  **Evaluate Each Reading:**
      *   *Qualitative Incommensurability:* Substantive, but hard to defend if both map to "welfare." If welfare is the common metric, they must be comparable. Verdict: Often false or collapses into lexicality.
      *   *Strong Lexical Priority (Any pain > Any pleasure):* Defensible (Negative Utilitarianism), but counterintuitive (stubbed toe vs. genocide of pleasure?). Justifies the prof's move easily, but is a very strong claim.
      *   *Lexical Threshold (LTNU):* Substantive and defensible. Avoids the "stubbed toe" absurdity. Justifies the prof's move *if* the animal suffering is above $T$.
