  4.  **Focus on Lexical Threshold Negative Utilitarianism (LTNU):**
      *   *Coherence:* Is it a verbal trick? The risk is "lexicography" (just hiding a very high exchange rate). To be coherent, there must be a *discontinuity* in value, not just a steep slope.
      *   *Commensurability:* They must be cardinally measurable within their domains, but the aggregation function is non-linear/discontinuous.
