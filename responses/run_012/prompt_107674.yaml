      *   Address the "Novel as Proof" claim (Conceivability $\rightarrow$ Possibility).

  8.  **Drafting the response:** (Mental check of key terms: Qualia, Supervenience, Causal Closure, Hard Problem, Logical Possibility, Metaphysical Necessity).

      *   *Key distinction:* Physicalism says mental states *supervene* on physical states with *logical necessity*. She is arguing they do not.
      *   *Her position:* Mental properties are fundamental.
