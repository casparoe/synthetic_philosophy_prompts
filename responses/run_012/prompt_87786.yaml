answer: |-
  Here is the translation into your statistical dialect, followed by the residue report on what breaks in the mapping.

  ### Part 1: The Translation

  **1. The Principal Principle (PP)**
  *Philosophical Statement:* $Cr(A \mid Ch(A)=x \land E) = x$.
  *Statistical Translation:* Let $\theta$ be the parameter governing the data generating process (DGP). Let $X$ be the random variable for the event $A$. The principle states that your subjective probability measure $P$ (your prior/predictive distribution) must satisfy:
  $$ E_P[\mathbb{I}_X \mid \theta = x, \mathcal{E}] = x $$
  where $\mathcal{E}$ is the "admissible evidence."
  In your dialect, this is simply the requirement that your **prior predictive distribution is calibrated** to the parameter. If you treat $\theta$ as the true bias of the coin, your conditional expectation of the outcome given $\theta$ must match $\theta$. This is the definition of a likelihood function in a Bernoulli model: $P(X=1 \mid \theta) = \theta$. The PP asserts that rational credence *is* a likelihood function conditioned on the chance parameter.

  **2. Admissibility**
  *Philosophical Statement:* Evidence $E$ is admissible if it doesn't give information about the chance beyond what is contained in the statement "$Ch(A)=x$."
  *Statistical Translation:* $\mathcal{E}$ must be **ancillary** to $\theta$ (or at least conditionally independent of $\theta$ given the value $x$), or alternatively, $\mathcal{E}$ must be a **sufficient statistic** that is already fully summarized by the proposition $\theta=x$.
  More precisely: $E$ is inadmissible if $P(\theta \mid E) \neq P(\theta)$. If you know the outcome of the toss ($X=1$), that is inadmissible evidence for predicting that same toss, because it tells you more about the realization than the parameter does. Admissibility restricts you to conditioning only on information that is **exogenous** to the parameter estimation. It forbids "peeking at the test set."

  **3. Humean Supervenience & Undermining Futures**
  *Philosophical Statement:* Chances supervene on the total mosaic (past and future). An undermining future is a sequence of outcomes that, if it occurred, would make the current chance proposition false.
  *Statistical Translation:* This is where the dialect strains. In standard statistics, $\theta$ is a fixed property of the DGP, distinct from the realization $X_{1:n}$. In the Humean view, $\theta$ is a **functional of the entire data sequence**, including future data.
  Let $\hat{\theta}(X_{1:N})$ be the estimator of chance defined over the complete history (the "Best System").
  The PP requires: $P(X_{t} \mid \hat{\theta}(X_{1:N}) = x) = x$.
  The **Undermining Problem** arises because $\hat{\theta}$ is a statistic computed on $X_{1:N}$. There exist sequences $X'_{1:N}$ such that $\hat{\theta}(X'_{1:N}) \neq x$.
  If the distribution $P(\cdot \mid \hat{\theta}=x)$ assigns positive probability to a sequence $X'$, but $X'$ implies $\hat{\theta}(X') = y \neq x$, you have a logical contradiction in the conditioning event. You are conditioning on an event ($\hat{\theta}=x$) that is logically incompatible with some outcomes in its own support.
  In stats terms: You are trying to define a conditional distribution $P(X \mid T(X)=x)$ where the statistic $T$ depends on $X$ in a way that allows $X$ to falsify $T(X)=x$ with positive probability. It's like conditioning on $\bar{X}_n = 0.5$ while assigning positive density to sequences where $\bar{X}_n = 0.6$.

  **4. The Repairs**
  *   **Repair 1 (Zero Chance):** Assert that undermining sequences have probability zero.
      *   *Stats Translation:* Restrict the support of the likelihood function. If $\hat{\theta}(X)=x$, then $P(X \mid \hat{\theta}=x) = 0$ for any $X$ that would result in $\hat{\theta}(X) \neq x$. This effectively makes the conditional distribution degenerate or requires the parameter space to be defined such that the estimator is constant over the support. It's mathematically costly; it forces you to truncate the sample space.
  *   **Repair 2 (The New Principle):** Defer to $Ch(A \mid T)$, where $T$ is the theory of chance.
      *   *Stats Translation:* Condition on the **model structure** (the hyperparameters), not just the point estimate of the parameter.
      *   Instead of $P(A \mid \hat{\theta}=x)$, use $P(A \mid M, \theta=x)$, where $M$ is the probabilistic model (the "theory") that generates the chances.
      *   In Bayesian terms: Don't condition on the *realized* sufficient statistic of the full mosaic. Condition on the **prior distribution over parameters** implied by the theory. The "New Principle" becomes: $Cr(A \mid \text{Theory } T) = E_{\theta \sim T}[P(A \mid \theta)]$. You defer to the *expectation* of chance under the theory, not the specific value that supervenes on the actual future.

  ### Part 2: The Test Case

  > *An agent has a prior over a coin's bias, and puts positive mass on hypotheses under which the bias itself shifts partway through the sequence, so that the early data would have been misleading about the later bias. Is that the undermining future in my dialect?*

  **No.** This is not undermining; this is **model uncertainty** or **non-stationarity**.

  In your statistical dialect, this agent is using a hierarchical model or a change-point model.
  *   **Hypothesis $H_1$:** $\theta \sim \text{Beta}(\alpha, \beta)$ (Stationary).
  *   **Hypothesis $H_2$:** $\theta_t$ shifts at time $k$.

  If the agent conditions on "The chance of heads is 0.5" (meaning the long-run frequency or the current parameter), and the bias shifts, that is simply a case of the parameter being time-dependent ($\theta_t$).
  *   **Why it's not undermining:** Undermining requires that the *truth* of the proposition "Chance is $x$ *now*" depends on data that hasn't happened yet. In your test case, the shift is a feature of the DGP. The "chance" at $t_1$ is $\theta_1$. The "chance" at $t_2$ is $\theta_2$.
  *   **The Humean Twist:** For this to be undermining in the philosophical sense, the definition of "Chance at $t_1$" would have to depend on the outcomes at $t_2$.
  *   **Translation of the Test Case:** If you define "Chance" as the limiting frequency of the *entire* infinite sequence, then yes, a shift in bias creates an undermining scenario. If the sequence converges to 0.8, but you currently assign "Chance = 0.5" based on early data, the future data "undermines" the current chance attribution.
  *   **Does "Condition on the whole theory" become "Condition on the parameter"?**
      *   No. It becomes "Condition on the **Model Class**."
      *   Ordinary Bayesian practice conditions on the parameter ($\theta$). The New Principle says you can't do that if $\theta$ is Humean, because $\theta$ is leaky (it depends on the future). You must condition on the *process* that generates $\theta$.
      *   In your test case, ordinary Bayesian practice *works* because you are treating $\theta$ as a latent variable in a generative model, not as a statistic supervening on the realized data. The disagreement vanishes because you have abandoned Humean Supervenience for a Generative Model ontology.

  ### Part 3: The Residue Report

  Here is what survives the translation, what distorts, and what evaporates.

  **1. What Translates Cleanly**
  *   **Conditional Expectation:** The core mathematical structure $E[1_A \mid Ch=x] = x$ is identical to the definition of a parameter in a Bernoulli likelihood.
  *   **Admissibility as Ancillarity:** The restriction on evidence maps cleanly to the requirement that conditioning information must not be endogenous to the parameter estimation.
  *   **The New Principle as Hierarchical Modeling:** The move from deferring to $Ch(A)$ to deferring to $Ch(A \mid T)$ is exactly the move from conditioning on a point estimate to conditioning on the posterior predictive distribution derived from a model prior.

  **2. What Translates with Distortion**
  *   **The Ontology of $\theta$:** In stats, $\theta$ is a property of the *process*. In Humean philosophy, $\theta$ is a summary statistic of the *outcomes*.
      *   *Distortion:* In stats, $P(Data \mid \theta)$ is well-defined because $\theta$ is logically prior to the data. In Humeanism, $\theta$ is logically *posterior* to the data (it supervenes on the mosaic). The PP asks you to treat a posterior statistic as a prior parameter. This is "double-dipping." The statistical translation hides this by pretending $\theta$ is a latent variable, but the philosophical problem is that $\theta$ is *defined* as the frequency.
  *   **Undermining:** In stats, if an estimator $\hat{\theta}(X)$ is inconsistent with $X$, we say the estimator is biased or the model is misspecified. In philosophy, this is a metaphysical contradiction. The statistical fix is "use a better estimator." The philosophical fix is "change the definition of rationality."

  **3. What Has No Counterpart (The Real Residue)**
  *   **Normativity vs. Coherence:** This is the big one.
      *   In your statistical dialect, priors are subjective. You can have a dogmatic prior that ignores the data. You are "coherent" (no Dutch Book) as long as you follow Kolmogorov's axioms.
      *   The Principal Principle is a **normative bridge**. It claims that *regardless of your prior*, if you know the objective chance, rationality *forces* your credence to align.
      *   Stats has no equivalent constraint. There is no theorem in Bayesian statistics that says "If the true parameter is $\theta$, a rational agent's prior must satisfy $P(\cdot \mid \theta) = \text{Likelihood}(\theta)$." You can have a prior that puts mass 1 on $\theta=0.5$ even if the true DGP is $\theta=0.9$. You'll just learn slowly.
      *   The PP claims that failing to defer to chance is not just bad learning; it's *irrational*. The statistical toolkit describes how agents *do* update, not how they *must* bind themselves to worldly frequencies.
  *   **Objectivity:** In stats, "objective chance" is a model assumption. In the PP debate, "objective chance" is a metaphysical posit that *explains* why the model works. The residue is the claim that there is a fact of the matter about $Ch(A)$ independent of our epistemic access to it, which nonetheless binds our epistemology. Stats treats $Ch$ as a placeholder for "limiting frequency" or "propensity" without demanding a metaphysical account of how it binds rationality.

  **4. Diagnosis of the Residue**
  Is the residue your vocabulary's fault or the claim's fault?
  *   **Mostly the Claim's.** The Principal Principle attempts to solve a metaphysical problem (how do modal facts about chance constrain epistemic states?) using epistemic tools (conditional probability).
  *   The "Undermining" problem only exists because Humeans want to have their cake and eat it too: they want chances to be *summaries of facts* (statistics) but also *guides to belief* (parameters).
  *   In your statistical dialect, you avoid this by fiat: Parameters generate data. Data do not define parameters (except in Empirical Bayes, where we acknowledge the approximation).
  *   The "Normative Gap" exists because statistics is a logic of consistency, while the PP is a logic of **truth-tracking**. The PP demands your internal state match an external fact. Statistics only demands your internal states match each other.

  **Summary for the Seminar:**
  You can tell the grad students: "The Principal Principle is just the requirement that our subjective likelihoods match the objective data-generating parameters. The 'Undermining' problem is what happens when you define the parameter as a function of the test data. The 'New Principle' is just switching from conditioning on the point estimate to conditioning on the model hyperparameters. The only thing statistics can't explain is why rationality *requires* us to do this, rather than just allowing us to be coherently wrong."

  That captures the technical structure without pretending the metaphysical normativity reduces to a theorem.
