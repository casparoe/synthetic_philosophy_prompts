      *   *Refinement on Undermining:* The core issue is *logical* consistency between the definition of the parameter and the support of the distribution.
      *   *Refinement on Normativity:* Emphasize that stats gives *coherence*, PP gives *calibration to reality*.

  10. **Final Polish:** Ensure tone is respectful of the user's dual expertise. (e.g., "As you know," "In your dialect").

  *(Self-Correction on the Test Case)*: The user asks: "an agent has a prior over a coin's bias, and puts positive mass on hypotheses under which the bias itself shifts partway through the sequence... Is that the undermining future in my dialect?"
