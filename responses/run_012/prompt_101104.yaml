  What each explains

  The Backbone Thesis excels at **generation and systematic consistency**. It provides a generative grammar for type design, allowing you to construct new weights or styles by manipulating a master skeleton while preserving identity. This is crucial for interpolation; if the skeleton shifts, the font breaks. It explains why certain distortions feel "broken" even if legible; they violate the structural contract inherent to the script. It offers a prescriptive method for drawing: maintain the roles, vary the stress. However, it cannot explain radical stylistic divergence where geometry changes fundamentally, nor does it account for why orientation matters if structure is invariant under rotation. It struggles with historical change, treating evolution as corruption rather than adaptation.

  The Boundary Thesis excels at **accommodation and contextual legitimacy**. It explains how single-storey and double-storey 'a's coexist as the same letter despite different skeletons. It accounts for orientation (why a rotated 'a' fails) and context (why an ambiguous shape reads as 'a' in a word but not isolation). It handles historical evolution where structures shift but names remain, acknowledging that the "region" of 'a' drifts over centuries. What it cannot do is provide a constructive method for drawing; it describes recognition but offers no rules for creation. It tells you when a shape works, not how to draw it. Furthermore, it cannot explain why some nonsense shapes are never accepted despite context; there are limits to the region. Backbone tells you how to build; Boundary tells you when you've arrived. They are not the same thesis; one is a tool of production, the other a theory of perception. Backbone assumes a universal truth about letters, which aids teaching but risks dogmatism. Boundary assumes cultural contingency, which aids innovation but risks relativism. Consequently, Backbone is better for system design, while Boundary is better for brand identity.

  The hard cases

  Your hard cases largely dismantle the Backbone Thesis while validating the Boundary. **Single vs. double-storey:** They share no strict skeleton; one lacks the upper loop. Backbone must claim one is degenerate or they are different letters; Boundary accepts both as valid regions in shape-space. **Rotated/Mirrored:** The skeleton survives rotation perfectly, yet identity dies. Boundary captures this because orientation is part of the recognition boundary, not the structural skeleton. **Open cursive/Context:** An open bowl lacks a closed counter (a backbone requirement), yet reads as 'a' in flow. Boundary explains this via contextual completion; Backbone sees a broken structure. **Logo Triangle:** A bare triangle lacks stem, counter, or terminal. Backbone rejects it as non-letter; Boundary accepts it if the specific brand context forces the reading. **Structural 'a' as Arrow:** This is the fatal blow. A shape strictly structurally identical to an 'a' functioning as a caret proves structure does not determine identity. Function does. If you draw an 'a' but label it "up" in a UI, it becomes an arrow.

  Ultimately, the caret case demonstrates that identity is assigned, not discovered. For your display face, this means you can break structural rules if the context supports recognition. The disagreement is not merely semantic; it is ontological. One says the letter is in the ink; the other says it is in the eye. You must navigate between the ink and the eye. Consider the open cursive 'a'. Backbone sees a failure of closure. Boundary sees a successful cue within a stream. The rotated 'a' shows that uprightness is a feature of the boundary, not the skeleton. Crucially, these are not edge cases; they are the norm in display typography.

  What I should do

  Design from the **Backbone**, but validate with the **Boundary**. Use the skeleton to ensure your display face has internal consistency and structural integrity across glyphs. This prevents your typeface from becoming a bag of unrelated shapes. However, do not worship the skeleton. If a structural choice kills recognition (the Boundary), change the structure. Your goal is not to preserve a Platonic form, but to facilitate reading. Midway through a display face, prioritize Boundary for distinctiveness, Backbone for family cohesion. I would change my mind only if empirical data showed that structural violations never impact reading speed, or if recognition proved entirely random rather than clustered around specific shapes. For now, build with bone, judge by flesh.
