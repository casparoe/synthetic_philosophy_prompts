  I'm a high school student, and over the past year I've been reading my way into the metaphysics of material objects — in particular the debate over what philosophers call the special composition question, which is just the question of when some things add up to, or compose, a further thing. I've ended up with a view of my own, and before I defend it at my school's philosophy club I want to know exactly how exposed it is.

  My view has three parts. First, restriction: some things compose a further thing only if they are jointly caught up in a single self-maintaining causal process — a process that actively keeps itself going and maintains a boundary between itself and its surroundings. Second, sufficiency: whenever they are, they do compose something, with no further condition. Third, non-arbitrariness: the criterion is supposed to mark a real division in nature rather than a convenient one, which is why I picked self-maintenance over spatial contact, being fastened together, or being stuck to one another. I deliberately did not write "biological" into the first part; I meant self-maintenance literally, so on my view a candle flame, a tornado, and a star are composite objects, whereas a chair, a statue, a water molecule, and a rock are not.

  What I want from you is a map of what would count against this — not a general survey of the composition debate, and not a summary of what critics of restriction in general tend to say. Specifically: the observations, cases, arguments, formal results, and comparisons with rival views that tell against it, sorted from fatal to merely awkward; for each one, which part of my view it attacks, and whether someone who holds my view would themselves concede it as a cost rather than dismissing it as an intuition pump or cheerfully biting a bullet; the best reply available and whether making that reply leaves the view weaker than before; and an honest verdict on whether my view has simply been insulated by qualifications, and if so whether that is a problem here or just what a view of this kind looks like.

  Two things about me should shape your answer. I already accept that "self-maintaining" is vague and that there will be borderline cases, so a defeater that only says the criterion is vague will not move me unless it shows that the vagueness does damage my rivals avoid. And what would most move me is a case where my view does not merely give a surprising answer but an incoherent one, or one that contradicts something I need in order to state the view at all.

  Please run my criterion against these cases and report what it says about each: a candle flame; a tornado; a whirlpool in a river; a star; a water molecule; a diamond; a chair; a statue; a pile of sand; a bacterium; a virus; a mitochondrion inside a cell; a lichen; a slime mold; a Portuguese man o' war (often described as a colony rather than a single animal); a termite colony; a tardigrade in its dried-out, metabolically suspended state; a human embryo frozen for a decade; a patient whose circulation is maintained by a heart-lung machine; a donated heart after transplantation; a prosthetic hand; a computer program running across a server cluster; a market economy; the biosphere. You may add up to three cases of your own if they are more diagnostic than mine, and say why you added them.

  Please do not give me a reading list, citations, or references of any kind; I have no internet access right now and could not check them anyway. Everything you need should be argued out inside the answer. Answer as a single JSON object with exactly the fields below, sorted as indicated, and nothing outside it:

  {
    "restatement": "my position in your own words, under 120 words, flagging any ambiguity you find in it",
    "case_tests": [
      {
        "case": "the case, named as I named it",
        "verdict": "one of: composes / does not compose / my criterion is silent",
        "why": "one sentence on how my criterion produces this verdict",
        "cost_to_me": "one of: none / minor / serious",
        "note": "one sentence on what, if anything, this verdict costs the view"
      }
    ],
    "defeaters": [
      {
        "id": "D1, D2, ... listed from most to least dangerous",
        "label": "three to six words",
        "kind": "one of: case / intuition / conceptual / formal / rival comparison",
        "targets": "one of: necessity / sufficiency / non-arbitrariness / the unifying relation / cost profile against rivals",
        "statement": "two to four sentences stating the defeater as sharply as it can be stated",
        "severity": "one of: fatal / serious / awkward / toothless",
        "defender_concedes": true or false,
        "concession_note": "if true, exactly what is conceded; if false, why the defender is entitled to refuse",
        "best_reply": "one to three sentences, or 'none available'",
        "status": "one of: decisive as things stand / needs evidence, and what evidence / settled against the defeater"
      }
    ],
    "verdict": {
      "insulation": "one to three sentences on whether the view absorbs everything above or has quietly retreated",
      "most_dangerous": "the id of the single worst defeater",
      "advantage_over_rivals": "one to three sentences on what my view gets that unrestricted and nihilistic answers do not",
      "what_would_settle_it": "what observation, case, or argument would genuinely decide the matter for me",
      "bottom_line": "two sentences, no hedging, on how much of the view survives"
    }
  }
