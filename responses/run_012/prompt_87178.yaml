answer: |-
  # Q&A Prep Sheet: Disjunctivism & Vision Science

  ### 1. The Verification Loop (The Question You Hope Nobody Asks)
  **Who:** Sharp Psychophysicist or Skeptical Philosopher
  **The Objection:** "You define indistinguishability as a failure of discrimination capacity (d'=0). But to test your dissociation, you need to confirm the hallucination is 'matched' to the veridical case. How do you verify they are matched without using the very discrimination tasks you claim are insufficient to establish identity? Aren't you relying on the Common Kind Assumption to set up the experiment you claim refutes it?"
  **Damage:** **Fatal.** Exposes a methodological circularity.
  **Concession:** Concede immediately that operationalizing "perfect hallucination" without relying on report is the bottleneck.
  **Reply (2 mins):** "You've hit the methodological nerve. I'm not claiming we can verify *perfect* subjective identity independently. I'm claiming we can induce states via etiology (e.g., specific stimulation) that *should* be hallucinatory, and then test if learning transfers. If learning doesn't transfer despite matched report, the Common Kind is empirically idle. I'm not verifying identity; I'm testing the consequences of assuming it."
  **Soft Spot/Flag:** **Honest Admission:** This is a real problem. If report is the only access, and you dismiss report as constitutive of the kind, you lack a独立 (independent) verification metric. You are betting on etiology to carry the weight. If they press on "how do you know the subject isn't just guessing," you have no fix beyond trusting the induction method.

  ### 2. The "No Predictive Gain" Objection
  **Who:** Bayesian/Computational Modeler
  **The Objection:** "Your disjunctivism posits two metaphysical kinds, but my generative model explains both outcomes with one inference engine (varying priors or noise precision). Your view adds parameters without changing the likelihood function. What is the cash value? Does this change how I fit the data?"
  **Damage:** **High.** Renders your view scientifically idle for half the room.
  **Concession:** Concede that standard models fit behavioral data well without disjunctivist ontology.
  **Reply (2 mins):** "It changes how we interpret error. In your model, a hallucination is an inference error (bad posterior). On my view, it's a system breakdown (no perceptual relation). This matters for rehabilitation and learning models. If hallucinations aren't 'noisy veridical states,' training strategies targeting noise reduction might fail. I'm offering an ontological constraint on model interpretation, not a new fitting parameter."
  **Soft Spot/Flag:** **Question-Begging:** You assert the interpretation matters without showing it leads to different predictions than a model with 'broken' priors. The modeler can just add a 'system failure' switch without accepting disjunctivism.

  ### 3. The Dependent Variable Problem
  **Who:** Psychophysicist
  **The Objection:** "If report is matched, d' is matched. You predict a dissociation in learning/adaptation. What is your dependent variable? If it's reaction time or confidence, aren't those just proxies for discrimination capacity? If those differ, then by your definition, the states *are* distinguishable, contradicting your premise."
  **Damage:** **High.** Threatens the empirical core of the talk.
  **Concession:** Concede that if secondary measures show discrimination, the 'indistinguishability' claim needs nuance (e.g., distinguishable retrospectively but not online).
  **Reply (2 mins):** "Indistinguishability is about *online* discrimination of the stimulus, not metabolic cost or processing latency. I'm predicting that perceptual learning (sharpening the veridical channel) won't shift the hallucinatory channel. The DV is transfer effect size, not immediate d'. We can match d' at T1 and see divergence at T2."
  **Soft Spot/Flag:** **Soft:** If learning doesn't transfer, the modeler can say the 'channels' are just computationally distinct within one system. You need to show this isn't just modular processing.

  ### 4. The Screening-Off Argument
  **Who:** Philosopher (possibly allied with Modelers)
  **The Objection:** "Neural states screen off the external object. If the neural state is sufficient for the experience in the bad case, why is the object constitutive in the good case? Isn't the common neural kind the best explanation for the subjective similarity?"
  **Damage:** **Medium.** Standard philosophical objection, less threatening to scientists.
  **Concession:** No concession on metaphysics, but acknowledge the neural correlation.
  **Reply (2 mins):** "Screening-off assumes causation is the only explanatory relation. I'm claiming a relational constitution. The neural state enables the experience, but the object constitutes it. Explaining 'why it looks like this' requires the object; explaining 'why they can't tell' requires the neural state. That's the asymmetry."
  **Soft Spot/Flag:** **Question-Begging:** Asserts relational constitution without disproving the causal sufficiency of the neural state.

  ***

  Verdict: You cannot measure the dissociation without relying on the common kind you reject.
