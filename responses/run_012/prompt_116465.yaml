      *   *No-Sharp-Boundaries Intuition:* Both agree it's the data to be explained. Both agree it feels like there isn't a cut-off.
      *   *Higher-Order Vagueness:* Both agree it exists (there are borderlines of borderlines). Epistemicist: we don't know where the boundary of 'definitely' is. Supervaluationist: the set of precisifications isn't sharply bounded.

  4.  **Drafting Section 2: Remaining Disagreements (Table):**
      *   Need to phrase charitably.
      *   *Issue 1: The nature of the boundary.* Epistemicist: It's there, hidden. Supervaluationist: It's an artifact of precisification, not a single fact.
      *   *Issue 2: Truth in borderline cases.* Epistemicist: True or False (we just don't know). Supervaluationist: Indeterminate/Neither.
      *   *Issue 3: Explanation of Ignorance.* Epistemicist: Semantic plasticity/margin for error prevents knowledge. Supervaluationist: There is no fact to know.

  5.  **Drafting Section 3: The Cruxes:**
      *   *Crux 1: Language vs. World.* Is vagueness in our representation (both agree mostly) or is the *location* of the cutoff a worldly fact? Epistemicism implies a specific fact about the world/language interface. Supervaluationism implies a lack of fact.
      *   *Crux 2: Definiteness of Definiteness.* Can "Definitely P" be vague? Epistemicist: Yes (iterated ignorance). Supervaluationist: Yes (borderline admissible precisifications).
      *   *Shared Argument/Case:* The "Forced March" Sorites.
      *   *Predictions:* Epistemicist predicts a specific point where competence forces a shift (even if unknowable). Supervaluationist predicts a zone where no shift is mandated.

  6.  **Drafting Section 4: Verbal Dispute:**
      *   Is it verbal? Often, the dispute over "truth" is verbal. Epistemicist uses classical truth. Supervaluationist uses super-truth. If they align on "super-truth," they might agree more. But the ontological commitment to a sharp boundary is usually considered substantive. However, the prompt asks me to identify *if* part is verbal. A common diagnosis is that they disagree on the *definition* of 'truth' or 'fact'. Let's pinpoint the semantic indecision vs. ignorance distinction.

  7.  **Refining and Polishing:**
      *   *Tone Check:* Ensure it sounds like a collaborative document, not a debate transcript.
