answer: |-
  # JOINT STATEMENT ON VAGUENESS AND THE SORITES PARADOX
  **Signatories:** The Epistemicist Representative & The Supervaluationist Representative
  **Date:** October 26, 2023

  ## I. AGREED CLAIMS
  *We, the undersigned, acknowledge the following points as common ground in our ongoing dialectic. We accept these as the fixed constraints for any viable theory of vagueness.*

  1.  **The Sorites Conclusion is False:** We agree that the conclusion of the Sorites paradox (e.g., "A man with 0 hairs is bald" or "A man with 100,000 hairs is bald," depending on direction) is false. We further agree that the universal inductive premise ($\forall n (B(n) \to B(n+1))$) is false. There is no continuous slide from clear cases to clear counter-cases without interruption.
  2.  **Preservation of Classical Logic (Mostly):** We agree that classical logic should be preserved as far as possible. Specifically, we both endorse the Law of Excluded Middle ($P \lor \neg P$) as valid. We reject intuitionistic or paraconsistent solutions that require abandoning standard logical connectives for ordinary discourse.
  3.  **The "No-Sharp-Boundaries" Intuition is Data:** We agree that the strong intuition that there is no specific hair whose removal turns a non-bald man into a bald man is a legitimate phenomenological datum. Any theory must explain *why* this intuition is so compelling, even if the theory ultimately concludes the intuition is misleading regarding the underlying metaphysics or semantics.
  4.  **Rejection of Ontic Vagueness:** We agree that vagueness is not "in the world." The atoms and hairs are precise. The vagueness resides in our representation (language, concepts, or epistemic access), not in the objects themselves.
  5.  **Higher-Order Vagueness Exists:** We agree that vagueness appears at higher orders. It is not just vague whether John is bald; it is vague whether John is *definitely* bald. Both our theories must accommodate the lack of a sharp boundary between the definitely bald and the borderline cases.
  6.  **Semantic Competence does not Yield Knowledge of Cutoffs:** We agree that a competent speaker cannot identify the precise cutoff point for vague predicates, nor can they identify the precise boundary of the "definite" extension. Any theory positing that speakers *could* know this via ordinary reflection is empirically inadequate.

  ## II. REMAINING DISAGREEMENTS
  *While we share the constraints above, we diverge on the metaphysical and semantic explanation of why those constraints hold. The following table outlines our specific points of divergence, phrased as we each endorse them.*

  | Topic | The Epistemicist Position | The Supervaluationist Position |
  | :--- | :--- | :--- |
  | **The Nature of the Cutoff** | There exists a specific, unique integer $n$ such that a man with $n$ hairs is bald and a man with $n+1$ hairs is not. This is a hard semantic fact determined by usage, even if usage is complex. | There is no single integer $n$. There is a set of admissible precisifications, each with its own cutoff. No single precisification is privileged as "the meaning." |
  | **Truth in Borderline Cases** | Bivalence holds universally. In a borderline case, the proposition "John is bald" is either True or False. Our inability to assign a value is purely epistemic (ignorance). | Bivalence fails for borderline cases. In a borderline case, "John is bald" is neither Super-True nor Super-False. It lacks a truth value relative to the vague language. |
  | **Explanation of Ignorance** | We cannot know the cutoff because knowledge requires safety/margin-for-error. Since the cutoff is sensitive to minute changes in usage, we cannot form a safe belief about it. | We cannot know the cutoff because there is no fact of the matter to know. It is not ignorance of a fact; it is indeterminacy of the fact. |
  | **The Status of "Definitely"** | "Definitely $P$" means "$P$ is true and we are in a position to know it." The boundary of "Definitely" is also sharp but unknown. | "Definitely $P$" means "$P$ is true on all admissible precisifications." The set of admissible precisifications is itself vaguely bounded. |

  ## III. CRUXES AND PRE-REGISTERED PREDICTIONS
  *We identify two fundamental cruxes where our theories make different contact with reality. For each, we agree on a test case or argument that bears on the issue. We record our predictions here to allow for future adjudication.*

  ### Crux 1: The Metaphysics of Semantic Facts (Language vs. World)
  **The Issue:** Is the dispute about whether there is a *fact of the matter* regarding linguistic usage? The Epistemicist claims usage determines a sharp function (a fact about the world/language interface). The Supervaluationist claims usage determines a range of functions (no single fact).
  **Shared Argument/Case:** **The "Ideal Speaker" Thought Experiment.** Imagine an omniscient being who knows all physical facts about the brain states of every English speaker, all historical usage events, and all causal chains of language learning.
  *   **Epistemicist Prediction:** This being *would* be able to identify the exact cutoff number $n$ for "bald." The fact exists in the supervenience base of usage; it is just inaccessible to us.
  *   **Supervaluationist Prediction:** This being *would not* identify a single $n$. Even with full physical knowledge, they would see multiple equally admissible cutoffs. There is no further fact for them to find.

  ### Crux 2: The Vagueness of Definiteness (Higher-Order Vagueness)
  **The Issue:** Can the boundary between "Definitely Bald" and "Borderline Bald" itself be vague? The Epistemicist must posit a sharp boundary between "Known/Definite" and "Unknown/Borderline" (to avoid regress). The Supervaluationist allows the set of precisifications to be fuzzy.
  **Shared Argument/Case:** **The Forced March Sorites.** A subject is presented with a series of patches from Red to Blue and asked "Is this Red?" at each step. We analyze the transition zone where the subject hesitates or says "I don't know."
  *   **Epistemicist Prediction:** There is a specific step where the subject's competence *actually* shifts from tracking truth to guessing, even if the subject cannot report it. The "Definite" extension has a sharp edge in cognitive processing.
  *   **Supervaluationist Prediction:** There is a zone where it is indeterminate whether the subject is competent to judge. The transition from "Definitely Red" to "Borderline" is itself smooth/gappy, not sharp.

  ## IV. DIAGNOSIS OF VERBAL DISPUTE
  *Upon reflection, we acknowledge that a portion of our disagreement may be purely verbal, specifically regarding the definition of **"Truth."***

  *   **Why it is verbal:** The Epistemicist uses "True" to mean *truth on the unique, actual precisification* (which exists but is unknown). The Supervaluationist uses "Super-True" to mean *truth on all admissible precisifications*.
  *   **The Overlap:** If the Epistemicist agrees to talk about "Super-Truth," they must admit that borderline sentences are not Super-True. If the Supervaluationist agrees to talk about "Truth on a specific precisification," they must admit that on any *given* precisification, Bivalence holds.
  *   **The Substantive Remainder:** However, we agree the dispute is **not entirely verbal**. The substantive disagreement remains regarding the **metaphysics of meaning**: Does the totality of human linguistic behavior *select* one specific precisification (Epistemicism), or does it *fail to select* one (Supervaluationism)? This is a factual disagreement about the nature of semantic supervenience, not merely a choice of words.

  ***

  **Signed,**

  _________________________
  *For the Epistemicist*

  _________________________
  *For the Supervaluationist*
