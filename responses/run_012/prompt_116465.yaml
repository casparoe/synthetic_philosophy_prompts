prompt: |-
  A guy in my reading group is an epistemicist about vagueness (thinks "bald" has a sharp cutoff, we just can't ever know where it is) and another is a supervaluationist (thinks there's no single cutoff because several precisifications are admissible, so "bald" can come out neither true nor false). They've been argueing about it for a year and getting nowhere. Write the joint statement they should have produced. First, the claims they can both sign: about the sorites itself, about whether bivalence holds, about which parts of the no-sharp-boundaries intuition are data both sides accept, and about what each is willing to say regarding higher-order vagueness. Then the remaining disagreements, each phrased in wording the side that holds it would actually accept -- no strawmen, but not so vague that it goes vacuous either. Then the cruxes; I think one is whether the fight is really about language or about the world, and another is whether definiteness itself can be vague. For each crux, give the case or argument both sides would agree bears on it, with each side's prediction written down in advance. If part of their dispute turns out to be purely verbal, say which part and why. Numbered agreed-claims section, then a table for the disagreements.
