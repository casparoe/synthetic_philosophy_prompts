          3.  Cruxes (Language vs. World, Definiteness of Definiteness) with shared arguments/cases and pre-registered predictions.
          4.  Identification of any purely verbal dispute.
      *   **Tone:** Philosophical, precise, charitable, collaborative but clear on divergence.

  2.  **Deconstruct the Philosophical Positions:**
      *   **Epistemicism (e.g., Williamson):** Vagueness is ignorance. Classical logic holds (Bivalence). There is a specific hair $n$ where removing it makes a non-bald man bald. We can't know $n$ due to margin-for-error principles. Higher-order vagueness is also ignorance (we don't know where the boundary of 'definitely bald' is).
      *   **Supervaluationism (e.g., Fine):** Vagueness is semantic indecision. Multiple precisifications are admissible. A statement is super-true if true on all precisifications, super-false if false on all. Borderline cases are neither (truth-value gaps). Classical logic holds for tautologies but Bivalence fails for borderline cases. Higher-order vagueness is handled by varying the set of admissible precisifications (though this is tricky).
      *   **Common Ground:** Both want to save classical logic (mostly), both reject the idea that the world itself is fuzzy (ontic vagueness is usually rejected by both, though supervaluationism *can* accommodate it, standard versions treat it as semantic), both accept the Sorites premise looks plausible but must be rejected (or handled) to avoid contradiction. Both accept the "no sharp boundaries" intuition is powerful but needs explaining.

  3.  **Drafting Section 1: Agreed Claims:**
