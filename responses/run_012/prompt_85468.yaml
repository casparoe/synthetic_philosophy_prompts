      *   **Framework:** Karl Jaspers's *The Question of German Guilt* (1946), specifically the four types of guilt: Criminal, Political, Moral, Metaphysical.
      *   **Constraint:** "Run hard, not as a book report." Apply the framework rigorously, point out where it breaks, don't stretch it to fit.
