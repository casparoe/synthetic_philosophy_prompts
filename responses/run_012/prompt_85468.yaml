  2.  **Deconstruct Jaspers's Four Guilt Types (Mental Refresh):**
      *   *Criminal:* Violation of laws. Adjudicated in court. Individual only.
      *   *Political:* Responsibility for the state's actions. All citizens bear this. Adjudicated by the victor or the new regime. Leads to reparations/loss of rights.
      *   *Moral:* Individual conscience. Did I do wrong? Did I fail to resist? Adjudicated by oneself/conscience/loved ones. Leads to repentance/inner transformation.
      *   *Metaphysical:* Solidarity of humans. Surviving when others died. Co-responsibility for every wrong in the world. Adjudicated by God alone. Leads to humility/rebirth.

  3.  **Apply to the Germany-Namibia Case:**

      *   **Criminal Guilt:**
          *   *Jaspers:* Individual, legal, punishable.
          *   *Case:* Perpetrators (Trotha, etc.) dead. Statute of limitations long expired.
          *   *Conflict:* Germany explicitly rejects *legal* responsibility.
          *   *Result:* Criminal guilt is null. The deal explicitly avoids this category.

      *   **Political Guilt:**
          *   *Jaspers:* Citizens are co-responsible for their state. State continuity is assumed (Germany 1933-45 = Germany 1946). Liability falls on the state treasury.
          *   *Case:* German Empire (1904) $\neq$ Federal Republic (1949/2021). Namibia (2021) $\neq$ Herero/Nama (1904).
          *   *Conflict:* Germany pays but calls it "reconstruction aid," not reparations. Why? To avoid admitting *political* liability that implies legal continuity of the crime.
          *   *Result:* Political guilt is the *vehicle* for the money, but it's disguised. The state pays because it's the only entity with a wallet, but the philosophical grounding is shaky due to state discontinuity.

      *   **Moral Guilt:**
          *   *Jaspers:* Individual conscience. Cannot be collectivized. "I" am guilty, not "We."
          *   *Case:* Current Germans didn't do it. Can they feel moral guilt? Jaspers says no, only political.
          *   *Conflict:* The Herero/Nama representatives demand recognition, not just aid. They want an apology (moral acknowledgment).
          *   *Result:* Moral guilt is displaced onto the state. A state cannot have a conscience. This is a category error in Jaspersian terms.

      *   **Metaphysical Guilt:**
          *   *Jaspers:* Solidarity before God. Surviving while others were destroyed.
          *   *Case:* Modern Germans benefit from a global order built on colonial extraction. Herero/Nama survived extermination.
          *   *Conflict:* This is the only guilt that transcends time and legal structures.
          *   *Result:* This is likely the *real* driver, but it cannot be legislated. Turning it into a 1.1 billion euro check commodifies the unquantifiable.

  4.  **Address the Specific Tensions (The "Push"):**

      *   *Generational Gap:* Jaspers was writing about *immediate* post-war guilt. He assumed living perpetrators and victims. 5 generations later, Criminal and Moral guilt (individual) evaporate. Only Political (state) and Metaphysical (human) remain.
      *   *State Continuity:* The Federal Republic claims succession for *assets* and *treaties* but disclaims succession for *crimes* of the Empire. This is political gymnastics. Jaspers assumed a continuous moral community of the nation.
      *   *Non-State Victim:* Jaspers assumed a dialogue between nations (Germany and the World/Allies). Here, the victims are indigenous peoples within a modern state (Namibia) that excluded them from the deal. This breaks the "Political" channel. Who receives the political penance? The Namibian state (which might misuse it) or the tribes (who have no sovereign standing)?

  5.  **Determine the Anomaly:**
