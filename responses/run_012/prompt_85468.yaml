      *   Is it the discontinuous state? Yes, this breaks the Political liability.
      *   Is it the generational gap? Yes, this kills Criminal/Moral.
      *   *Decision:* The **discontinuous state combined with the non-state victim** is the fatal flaw. Jaspers assumes a sovereign-to-soverever transaction for Political guilt. Here, the sovereign (Germany) pays a different sovereign (Namibia) for crimes against non-sovereigns (Herero/Nama).

  6.  **Formulate the Verdict:**
      *   Which guilt is doing the work? **Political Guilt.** It's the only one that moves money.
