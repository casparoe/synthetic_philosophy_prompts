      *(Final check on Jaspers)*: Jaspers argued Political guilt is about the *existence* of the state. If the state commits crimes, the citizens pay the price (reparations) to be readmitted to the community of nations. In this case, Germany wants the readmission (moral standing) without the price (legal liability).

