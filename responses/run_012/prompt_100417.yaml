answer: |-
  Hobbes didn't fall in love with geometry for the sake of angles, but for the sake of order; he was convinced that if political authority could be grounded in Euclidean certainty, civil war would become logically impossible, leaving no room for dispute. This belief drove him to spend his final decades insisting he had squared the circle, viewing the feat not as a mathematical puzzle, but as the missing axiom required to lock humanity into a peace as rigid as a theorem. In the end, Hobbes achieved a peculiar symmetry: in his desperate attempt to use mathematics to end human argument, he became the most argumentative man in England, proving that while a sovereign can compel a subject to obey, not even a Leviathan can compel a circle to be a square.
