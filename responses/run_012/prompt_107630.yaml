      *   *Nuance:* Make sure to distinguish between *classification* (choosing the group) and *experience rating* (adjusting within the group). The RCP applies strongly to classification, less so to experience rating (which assumes the class is fixed).

  8.  **Final Polish:** Organize into clear sections: Translation, Mapping Analysis, Residue Report. (Proceed to generate output based on this structure).

  **(Self-Correction Note):** I need to make sure I don't get too bogged down in the math of Bühlmann credibility but keep the *conceptual* mapping clear. The user knows the math; they want the philosophical mapping.

  **(Key Insight to highlight):** The actuarial profession solves the RCP by *regulatory fiat* and *statistical stability criteria*. Philosophy asks "Which is true?" Actuarial science asks "Which is solvent and fair?" This is the crucial divergence.

