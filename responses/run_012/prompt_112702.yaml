prompt: |-
  Ok so heres a thing that bugs me about how courts actually behave, and I want you to tell me what theory of law it assumes.

  Take a legal system that's pretty clear about one thing: judges apply the law, they dont get to refuse just because they think a statute is stupid or cruel. The legislature passed it, it's on the books, you enforce it. A judge who says "I won't apply this because it's unjust" is, on that view, just breaking the rules -- substituting their own morality for the law.

  But then the same systems do stuff that looks like the exact opposite. Courts refuse to enforce a contract because its terms are unconscionable, or because enforcing it would offend public policy. Courts won't send someone back to a country where they'd be tortured. Courts have refused to give effect to amnesty laws shielding people who committed mass atrocities, or to let a limitations period run on crimes against humanity. And after some regimes collapse, courts have basically said: yeah, that statute was passed properly and everyone followed it, but it was so monstrous that it never counted as law, so the person who informed on their neighbor under it can still be punished. That last move is the spicy one, since it says a formally valid law can fail to be law at all.

  So: what does that whole package presuppose about the nature of law? Does the practice commit you to thinking there's a moral test for legal validity -- that unjust-enough rules just aren't law? Or can you explain everything that happens with a view where law's validity is one thing (source, pedigree, whatever the system's own criteria say) and the moral limits live entirely in what judges are permitted to do -- in adjudication, interpretation, discretion -- rather than in validity itself? I want you to actually distinguish what the practice strictly requires from what it merely happens to fit well with. Maybe the practice is compatible with several theories and doesn't settle the question at all; say so if that's where you land, and show why.

  Some things I'd like you to sort out:

  - The apparent inconsistancy between "we don't judge the justice of statutes" and "this contract/statute/amnesty is too unjust to enforce." Is it a real inconsistency, or do the two halves operate on different objects (legislation vs. private agreements vs. foreign acts) in a principled way?
  - What work does the word "law" do in the sentence "that was so unjust it wasn't law"? Is it a claim about validity, about what courts should do, or just rhetoric?
  - If you think the practice presupposes something like a moral criterion of validity, tell me what would have to change if we dropped it -- e.g., what a court would have to do differently in the informer cases, in the amnesty cases, in the torture-extradition cases.
  - If you think the practice is compatible with a purely source-based view of validity, explain how, and be honest about which cases strain it.
  - Is there anything the practice quietly rules out? For instance, does it rule out the idea that legal validity is just whatever the officials happen to treat as valid?

  Don't give me a history of the debate or cite anybody -- I don't need a reading list, I want the reconstruction. Assume I know roughly that there's a long-running argument about this and that I don't care who said what.

  Also one more wrinkle: in some systems courts will void a law for a procedural defect -- passed by the wrong body, wrong majority, whatever -- and nobody blinks. But they get very nervous about voiding one for being morally awful. Is that asymmetry itself doing philosophical work, or is it just institutional caution?

  And keep the answer honest about underdetermination -- if two very different theories both predict this pattern of behavior, say which observations would actually separate them, if any.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Core Question:** What theory of law does actual judicial practice presuppose regarding the relationship between law and morality? Specifically, does the practice of refusing to enforce "unjust" laws/contracts imply a moral test for legal validity (Natural Law), or can it be explained by a source-based view where morality enters only at the stage of adjudication/discretion (Legal Positivism)?
      *   **Specific Constraints:**
          *   Do not cite specific theorists (Hart, Fuller, Dworkin, etc.) or give a history of the debate.
          *   Focus on reconstruction of the logic, not bibliography.
          *   Address specific sub-questions (inconsistency, meaning of "not law," implications of dropping moral criteria, compatibility with source-based views, what is ruled out).
          *   Address the procedural vs. moral invalidity asymmetry.
          *   Be honest about underdetermination (if multiple theories fit, say so and explain how to distinguish them).
      *   **Tone:** Analytical, precise, philosophical but grounded in practical judicial behavior.

  2.  **Deconstruct the Phenomenon:**
      *   *Observation A:* Judges generally say they must apply valid statutes even if stupid/cruel (Rule of Recognition/Source-based validity).
      *   *Observation B:* Judges sometimes refuse to enforce statutes/contracts/amnesties because they are too unjust/unconscionable (Moral threshold).
      *   *Observation C:* In extreme cases (post-regime collapse), judges say "It was passed correctly, but it wasn't law."
      *   *The Tension:* Does B and C contradict A? Or is there a way to reconcile them?

  3.  **Evaluate Theory 1: Moral Validity Condition (Incorporationist/Natural Law leanings).**
      *   *Claim:* A rule must meet a minimum moral threshold to count as "law."
      *   *Explanation of Practice:* When judges say "this isn't law," they mean it literally. Validity depends on source *and* content.
      *   *Implication:* If we drop this, judges in informer cases would have to admit they are applying retroactive justice or extra-legal morality to punish someone who followed the rules at the time.
      *   *Weakness:* It struggles with the routine cases where judges *do* apply bad laws. Why is *this* bad law "not law" but *that* bad law is "law"? Where is the line?

  4.  **Evaluate Theory 2: Source-Based Validity + Adjudicative Discretion (Positivist leanings).**
      *   *Claim:* Validity is purely about source (pedigree). Morality enters when deciding *what to do* with a valid law (interpretation, exceptions, discretion).
      *   *Explanation of Practice:* The statute *was* law. But the legal system contains principles (public policy, unconscionability, constitutional rights) that allow judges to decline enforcement. In the "informer" cases, the court is effectively creating a new rule to fix a moral catastrophe, perhaps admitting it's a "lesser evil" or relying on a higher-order norm.
      *   *Weakness:* It makes the phrase "it wasn't law" rhetorical or false. It requires admitting that sometimes judges must break the rule of recognition to achieve justice.

  5.  **Address the Specific Sub-Questions:**

      *   *Inconsistency (Statutes vs. Contracts/Amnesties):* Is it principled?
          *   Contracts are private; the state lends its power to enforce. It can withhold that power on moral grounds without denying the legislature's authority.
          *   Statutes are state commands. Refusing them is harder.
          *   *Reconciliation:* Maybe the "unjust statute" cases are actually about *interpretation* (reading in exceptions) or *constitutional override* (higher source), not denying validity per se. The "informer" cases are the hard edge.

      *   *Meaning of "Not Law":*
          *   Is it ontological (doesn't exist)? Or normative (should not be obeyed/enforced)?
          *   Likely a mix. In routine cases, it's normative ("we won't enforce"). In radical cases (informer), it claims ontological status to avoid the charge of retroactivity.

      *   *Procedural vs. Moral Invalidity Asmetry:*
          *   Procedural defects are objective/systemic. Moral defects are subjective/contested.
          *   Institutional caution: Courts can police procedure without claiming moral superiority. Policing morality risks legitimacy.
          *   Philosophical work: Suggests validity is primarily source-based, with morality as an exceptional override.

      *   *Underdetermination:*
          *   Can both theories explain the data? Yes.
          *   How to distinguish? Look at the *justification* given in the hard cases. Do judges say "This statute is valid but we won't apply it" (Positivist) or "This statute is void ab initio because it violates fundamental norms" (Natural Law)?
          *   Actually, they often equivocate. This suggests the practice itself is unstable or pragmatic rather than theoretically pure.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the tension. State clearly that the practice is *underdetermined*. It fits both major theories, but strains both.
      *   *Section 1: The Two Explanatory Models.*
          *   Model A (Moral Validity): Unjust rules fail the criteria of existence.
          *   Model B (Source Validity + Discretion): Unjust rules exist but can be disarmed via principles/discretion.
      *   *Section 2: Analyzing the "Inconsistency".*
          *   Distinguish between *private ordering* (contracts) and *public command* (statutes).
          *   Explain that refusing contracts doesn't challenge legislative supremacy. Refusing statutes does.
          *   The "Informer" case is the outlier that forces the hand.
      *   *Section 3: The Meaning of "Not Law".*
          *   It functions as a shield against retroactivity charges.
          *   It's often a "fiction" to smooth over the moral dilemma.
      *   *Section 4: Procedural vs. Moral Asymmetry.*
          *   This points toward Source-Based validity being the default. Procedural checks are internal to the system's rules. Moral checks are external imports.
          *   The nervousness shows the system knows it's stepping outside its standard validity criteria.
      *   *Section 5: Underdetermination & Distinguishing.*
          *   Both theories predict the *outcome* (non-enforcement).
          *   They differ on the *account of authority*.
          *   To distinguish: Look at what happens when the moral norm is *not* codified. If judges strike down a law based on unwritten moral principles claiming *invalidity*, that leans Model A. If they strike it down based on *discretion* or *interpretive avoidance*, that leans Model B.
          *   Honest conclusion: The practice is pragmatic. It uses whatever vocabulary protects the court's legitimacy.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't accidentally name-drop Hart or Fuller. Keep it conceptual.
      *   *Correction:* Ensure I answer the "what would change if we dropped it" prompt.
      *   *Correction:* Make sure to address the "rules out" question. Does it rule out pure conventionalism? Yes, because pure conventionalism can't explain why a properly passed statute is ignored *unless* there's a higher convention allowing that.

  8.  **Final Polish:** Check against all constraints.
      *   No history/citations? Check.
      *   Address inconsistency? Check.
      *   Address "not law" meaning? Check.
      *   Address procedural asymmetry? Check.
      *   Address underdetermination? Check.

      *(Self-Correction on "Not Law"):* I need to be careful not to say it's *just* rhetoric. For the defendant in the informer case, the distinction determines liberty. So it has legal consequences, not just rhetorical ones.

      *(Self-Correction on Underdetermination):* I need to be clear that the *practice* doesn't settle the *theory*. The practice is a set of moves; the theory is the explanation. The moves are compatible with multiple explanations.

  9.  **Final Output Structure:**
      *   Introduction: The Underdetermination Thesis.
      *   Model 1: Moral Validity (The "Threshold" View).
      *   Model 2: Source Validity + Adjudicative Morality (The "Disarmament" View).
      *   Addressing the Inconsistency (Contracts vs. Statutes).
      *   The "Not Law" Claim: Ontology or Excuse?
      *   The Procedural/Moral Asymmetry.
      *   What the Practice Rules Out.
      *   Conclusion: Pragmatism over Purity.

      *(Final check of the prompt requirements)*: "Tell me what theory of law it assumes." -> I must conclude that it doesn't assume *one* definitively, but leans towards a hybrid or pragmatic stance. I need to be decisive about the underdetermination.

      *Wait, one nuance:* The prompt asks "what theory of law it assumes." If I say "it assumes nothing definitively," that's an answer. But I should explore which one fits *better*. The procedural asymmetry strongly suggests Source-Based is the default, with Moral as an exception. I will argue that.

