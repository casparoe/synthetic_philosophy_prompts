answer: |-
  The short answer is that the practice you describe is **theoretically underdetermined**. The same set of judicial behaviors can be reconstructed by two competing theories of law, and the courts themselves often equivocate between them depending on which story protects their legitimacy best.

  However, the *structure* of the practice—specifically the asymmetry between procedural and moral invalidity—suggests a default commitment to a **source-based view of validity**, with moral constraints operating as **adjudicative overrides** rather than validity conditions. The "natural law" language ("that wasn't law") is often a retrospective fiction used to solve specific problems of retroactivity, not a consistent description of how the system identifies law.

  Here is the reconstruction of what the practice presupposes, where it strains, and what it rules out.

  ### 1. The Two Competing Reconstructions

  To understand what the practice assumes, we have to look at the two ways to explain the same outcome (a judge refusing to apply a rule).

  **Model A: The Moral Threshold Theory (Validity Condition)**
  This view holds that for a rule to count as "law," it must pass a minimum moral threshold. If a statute is sufficiently unjust, it fails the criteria of existence.
  *   **Explanation of Practice:** When a court refuses to enforce an amnesty for atrocities, it is declaring the statute *void ab initio*. It never entered the legal system.
  *   **Implication:** The judge is not breaking the rules; they are following the *true* rules of recognition, which include a moral component.
  *   **What changes if dropped:** If you remove this moral criterion, the court in the "informer" cases (punishing someone who followed the statute at the time) cannot claim the statute was invalid. They must admit they are applying a *new* law retroactively to achieve justice. They lose the ability to say "you had no legal authority to do that" and must instead say "you had legal authority, but we are punishing you anyway because it was wrong."

  **Model B: The Source-Based Theory with Adjudicative Discretion (Validity + Disarmament)**
  This view holds that legal validity is determined solely by source (pedigree, procedure, enactment). A cruel statute is still "law." However, the legal system grants judges the power to refuse enforcement in extreme cases based on moral principles (public policy, unconscionability, fundamental rights).
  *   **Explanation of Practice:** The statute *was* valid law. But the court has a separate power (equity, constitutional interpretation, discretion) to "disarm" it.
  *   **Implication:** The judge is technically stepping outside the strict duty to apply valid law, but is authorized to do so by a higher-order principle of the system (e.g., "justice overrules strict legality").
  *   **What changes if dropped:** If you remove the moral discretion, the judge must enforce the cruel statute. To avoid this, the system would need to rely entirely on legislative repeal or executive pardon.

  ### 2. The Apparent Inconsistency: Statutes vs. Contracts vs. Atrocities

  Is it inconsistent to say "I must apply this stupid statute" but "I won't apply this unconscionable contract" or "I won't apply this amnesty law"?

  **It is not a logical inconsistency, but it is a hierarchy of objects.**
  *   **Contracts:** Private agreements rely on the state for enforcement. The state can say, "We will lend our power to enforce your deal, unless your deal violates our public policy." This does not challenge the legislature; it challenges private parties. A source-based theory handles this easily: the *law* of contracts includes a validity condition of "not unconscionable."
  *   **Routine Statutes:** Judges enforce these even if stupid because the cost of judicial moral veto on routine policy is too high. It undermines democratic authority.
  *   **Atrocity Statutes/Amnesties:** This is the breaking point. Here, the court treats the statute like a contract: "This is so offensive to public policy we won't enforce it."

  **The Principled Distinction:** The practice suggests a **sliding scale of validity**.
  1.  **Procedural Validity:** Binary. Either it was passed correctly or it wasn't.
  2.  **Substantive Validity:** Usually presumed.
  3.  **Extreme Substantive Defect:** Triggers a "nuclear option" where the court treats the statute as if it were procedurally defective (i.e., void).

  The practice presupposes that **validity is primarily source-based**, but that **extreme injustice functions as a latent procedural defect.** It treats moral monstrosity as if it were a jurisdictional error by the legislature (i.e., "you didn't have the power to pass *this*").

  ### 3. What Work Does "Not Law" Do?

  In the sentence "that was so unjust it wasn't law," the phrase "not law" is doing **jurisdictional work**, not necessarily ontological work.

  *   **If it were purely rhetorical:** The court would say, "This is valid law, but we choose not to apply it." The problem is that this invites a charge of judicial usurpation (breaking the separation of powers) or retroactivity (punishing someone for doing what was legal).
  *   **If it were ontological:** The court claims the rule never existed. This shields the court from charges of retroactivity. If the rule wasn't law, the informer had no legal authority, so punishing them isn't retroactive.

  **The Verdict:** The practice uses "not law" as a **legal fiction**. It treats the moral defect *as if* it were a validity defect to preserve the principle that courts only apply law, not morality. This suggests the system *wants* to be source-based (Model B) but borrows the language of Model A to solve the retroactivity problem.

  ### 4. The Procedural vs. Moral Asymmetry

  You noted courts void laws for procedural defects without blinking, but get nervous about voiding them for moral defects. **This asymmetry is the strongest evidence that the system is fundamentally source-based.**

  *   **Procedural Defects:** These are internal to the system's rule of recognition. Checking them is part of the standard job of identifying law. It doesn't require the judge to import external moral values.
  *   **Moral Defects:** These require the judge to look *outside* the system's criteria (source) to an external standard (justice).

  **Why the nervousness?**
  If validity were inherently moral (Model A), there would be no asymmetry. Checking for cruelty would be as routine as checking for a vote count. The fact that it is *exceptional* and *nervous* proves that the default assumption is: **Law is what is enacted.** Moral refusal is a deviation from the norm, requiring special justification (e.g., "crimes against humanity," "fundamental rights").

  This implies the practice presupposes **Positivism as the default, Natural Law as the emergency brake.**

  ### 5. What the Practice Rules Out

  While the practice is underdetermined between Model A and Model B, it does rule out certain theoretical positions:

  1.  **Pure Predictivism/Realism:** The idea that "law is just what officials do" is strained. If law were just prediction of official behavior, the distinction between "valid but unenforced" and "invalid" wouldn't matter. But courts care deeply about this distinction (see the "not law" rhetoric). They want to claim they are bound by *norms*, not just exercising power.
  2.  **Hard Conventionalism:** The idea that validity is *only* whatever the current officials treat as valid. In the "informer" cases, courts explicitly reject the conventions of the prior regime. They say, "Even though you followed all the conventions of that time, it wasn't law." This implies there is a **critical morality** that stands above the conventional rules of recognition.
  3.  **Strict Mechanical Jurisprudence:** The idea that judges never have discretion. The practice of "unconscionability" and "public policy" explicitly builds moral discretion into the adjudicative process.

  ### 6. Underdetermination and Distinguishing Observations

  Does the practice settle the debate? **No.** Both theories can predict the observed behavior.
  *   **Model A predicts:** Courts will refuse to enforce unjust laws.
  *   **Model B predicts:** Courts will refuse to enforce unjust laws (using discretion).

  **How to distinguish them empirically:**
  You have to look at the **justification** given in the hard cases, specifically regarding **retroactivity**.

  *   **Observation that favors Model A (Moral Validity):** If a court punishes an informer and explicitly states, "The statute you relied on was never valid law because it violated fundamental norms," and treats this as a matter of *discovery* rather than *creation*, they are operating on Model A. They are claiming the moral test is part of the identity conditions of law.
  *   **Observation that favors Model B (Source Validity + Discretion):** If a court punishes an informer but admits, "The statute was valid at the time, but we are applying a new principle of justice that overrides it," they are operating on Model B.

  **The Honest Assessment:**
  Most courts **equivocate**. They use Model A language ("it wasn't law") to avoid the political cost of Model B ("we are overriding the law").

  This suggests the practice presupposes a **Pragmatic Hybrid**:
  1.  **Validity is source-based** for 99% of cases (stability, predictability).
  2.  **Validity has a moral floor** for the 1% of extreme cases (legitimacy, justice).
  3.  **The boundary is undefined.** The system deliberately keeps the line between "bad law" and "not law" vague so courts can deploy it strategically.

  ### Conclusion

  The practice does not commit you to a single theory. It is compatible with a **Source-Based view** where morality enters as a principle of adjudication, *and* with a **Moral-Validity view** where extreme injustice negates legal existence.

  However, the **procedural/moral asymmetry** indicates the system's *operating assumption* is Source-Based. Judges treat moral invalidity as an exceptional, high-cost move, whereas procedural invalidity is routine. This implies they view "law" primarily as a matter of pedigree, and moral refusal as a justified breach of the standard rule, often disguised as a validity finding to protect the court from accusations of retroactivity or usurpation.

  If you forced the system to drop the moral criterion entirely, it would not stop punishing informers; it would simply change its story. It would admit it is applying retroactive justice to correct a moral catastrophe, rather than claiming the prior statute was void. The fact that courts go to great lengths to *avoid* saying that tells you they view the "law is source-based" norm as binding, and the "law must be just" norm as a dangerous but necessary override.
