  8.  **Final Polish:** Check flow, clarity of the regress steps, and ensure the "act vs. item" distinction is sharp. (Self-correction: Ensure I distinguish between the proposition as a truth-bearer and the fact as a truth-maker, though the structural problem is isomorphic. I'll stick to "proposition/fact" interchangeably as the structural problem is the same, or clarify I'm talking about the metaphysical unity of the fact which grounds the proposition). Let's stick to "propositional unity" as the prompt asks, but acknowledge the metaphysical underpinning.

