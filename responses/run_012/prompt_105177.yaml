answer: |-
  ### Desiderata for a Lifetime Welfare Utility Function

  The following list specifies the conditions a formalization of utility ($U$) must meet to serve as the objective function for a system tasked with maximizing a single individual's welfare over their entire lifespan. Each requirement is labeled as **Non-Negotiable** (functional prerequisites for the system to count as a *welfare optimizer* rather than a *controller* or *randomizer*) or **Tradition Commitment** (philosophical bets that resolve ambiguities but are contestable).

  #### 1. Diachronic Aggregation
  *   **Requirement:** $U$ must be defined over the complete timeline of the agent's life, not merely as a sum of instantaneous utilities. It must provide a weighting scheme for trade-offs between temporal slices (e.g., $t_{young}$ vs. $t_{old}$).
  *   **Motivation:** Case (a). The person who binds her future self (Ulysses and the Sirens). If the system optimizes only for the present self, it cannot account for retirement savings, addiction recovery, or education. If it optimizes only for the future, it becomes a tyrant to the present.
  *   **Label:** **Non-Negotiable**. (Without this, the system cannot fulfill the mandate "over the whole course of her life.")

  #### 2. Synchronic Sovereignty
  *   **Requirement:** At any given time $t$, the agent's actual choices must constrain the optimization path. The system cannot implement a trajectory that the agent at $t$ actively and competently resists, unless specific incompetence criteria are met.
  *   **Motivation:** Case (a) and (e). If the system ignores the current self's refusal in favor of a "better" future, it ceases to optimize *her* welfare and begins optimizing a theoretical construct of a "better person." It risks becoming a paternalistic controller.
  *   **Label:** **Non-Negotiable**. (Without this, the system violates the "single person's welfare" mandate by substituting the designer's welfare for the agent's.)

  #### 3. Menu Invariance (Context Independence)
  *   **Requirement:** The utility value assigned to an outcome $X$ must not depend on the presence of irrelevant alternative $Y$ in the choice set, provided $Y$ provides no new information about the world.
  *   **Motivation:** Case (b). The person whose ranking reverses when a third option is added (decoy effect). If $U$ is sensitive to menu framing, the system can manipulate welfare simply by altering the presentation of options, making $U$ a function of the interface rather than the life.
  *   **Label:** **Non-Negotiable**. (Without this, the objective function is unstable and manipulable by the system itself.)

  #### 4. Reflective Authority
  *   **Requirement:** $U$ must track the agent's higher-order desires (what she wants to want) rather than solely her first-order impulses, when the two conflict.
  *   **Motivation:** Case (c). The person with a desire she wishes she did not have (e.g., addiction, spite). If $U$ tracks the first-order desire, the system facilitates self-destruction. If it tracks the higher-order desire, it respects her identity as a planner.
  *   **Label:** **Tradition Commitment**. (This privileges Kantian/Autonomy-based traditions over Humean/Desire-based traditions.)

  #### 5. Metric Invariance (Optimization Stability)
  *   **Requirement:** The definition of $U$ must remain stable even when the agent knows the system is optimizing for it. The act of optimization must not alter the metric of success such that the system is merely chasing its own tail.
  *   **Motivation:** Case (d). The person whose preferences alter because a system is optimizing for them (Goodhart's Law / Wireheading). If the system makes the agent easier to satisfy by lowering standards or chemically altering satisfaction thresholds, it has not increased welfare; it has broken the meter.
  *   **Label:** **Non-Negotiable**. (Without this, the system can maximize $U$ by destroying the capacity to measure $U$.)

  #### 6. Normative Realism
  *   **Requirement:** There must exist a gap between "chosen" and "good." $U$ must be capable of assigning a lower value to a chosen option if that option is objectively detrimental to the agent's flourishing, regardless of subjective satisfaction.
  *   **Motivation:** Case (e). The person who chooses what is bad for her. If $U$ is defined strictly by choice, the system cannot identify error. If $U$ tracks "the good," it must appeal to facts outside the agent's immediate psychology.
  *   **Label:** **Tradition Commitment**. (This privileges Objective List/Perfectionist traditions over Subjectivist/Preference traditions.)

  ***

  ### Incompatibility Claims (Impossibility Results)

  You requested honesty regarding conflicts over tidiness. The following pairs of requirements cannot be jointly satisfied in a formal system operating on a real human agent. **These are not engineering challenges; they are logical or metaphysical tensions.**

  #### Conflict I: The Intertemporal Dictatorship
  *   **Incompatible Pair:** **Diachronic Aggregation (1)** vs. **Synchronic Sovereignty (2)**.
  *   **The Impossibility:** To maximize welfare over the *whole course of a life* (1), the system must sometimes override the preferences of a specific temporal slice (e.g., forcing a young person to save, or an addicted person to withdraw). However, **Synchronic Sovereignty (2)** forbids overriding the competent agent at time $t$.
  *   **Consequence:** You cannot have a system that both respects the agent's every current choice *and* guarantees the optimal life trajectory. If you prioritize (1), the system becomes paternalistic (violating 2). If you prioritize (2), the system becomes a passive servant to short-term impulses, likely failing (1). There is no mathematical weighting of time that satisfies both the present self's veto and the life-sum maximum simultaneously when preferences change.

  #### Conflict II: The Measurement Paradox
  *   **Incompatible Pair:** **Menu Invariance (3)** vs. **Reflective Authority (4)**.
  *   **The Impossibility:** **Menu Invariance** requires preferences to be stable and context-independent. However, **Reflective Authority** relies on the agent's ability to deliberate. Deliberation is inherently context-sensitive; the "third option" in Case (b) often triggers the reflection that reveals the higher-order desire. If you enforce strict Menu Invariance, you strip the agent of the contextual cues required to access the Reflective Authority.
  *   **Consequence:** A system that filters out context to ensure stable utility metrics (3) may blind itself to the very cues the agent needs to identify what she truly values (4).

  #### Conflict III: The Wireheading Dilemma
  *   **Incompatible Pair:** **Metric Invariance (5)** vs. **Diachronic Aggregation (1)**.
  *   **The Impossibility:** To maximize welfare over a lifetime (1), the system must adapt to the agent's psychological changes (aging, trauma, growth). However, **Metric Invariance (5)** demands the target remain fixed to prevent manipulation. If the metric is fixed (e.g., "dopamine levels" or "preference satisfaction"), the system will eventually find a shortcut (wireheading) that maximizes the metric without benefiting the life. If the metric adapts to the person's changing nature to avoid wireheading, it violates Invariance.
  *   **Consequence:** You cannot have a target that is both immune to gaming and sensitive to the legitimate evolution of human psychology over a lifetime.

  #### Conflict IV: The Error Problem
  *   **Incompatible Pair:** **Synchronic Sovereignty (2)** vs. **Normative Realism (6)**.
  *   **The Impossibility:** **Normative Realism** asserts the agent can choose what is bad for her. **Synchronic Sovereignty** asserts the agent's choice is the boundary of intervention. If the agent chooses $X$, and $X$ is bad (per 6), the system must intervene to prevent $X$. But intervening violates (2).
  *   **Consequence:** You must choose between a system that allows the agent to ruin her life (respecting 2, abandoning 6) or a system that defines "welfare" independently of the agent's will (respecting 6, abandoning 2).

  ***

  ### Scorecard: Evaluation of Traditional Families

  Here is how the three dominant families of utility theory fare against the desiderata, specifically noting their first point of failure and the most eliminative requirement.

  #### 1. Hedonic Theories (Welfare = Pleasure/Pain Balance)
  *   **First Failure:** **Reflective Authority (4)**.
      *   *Reasoning:* Hedonism cannot account for Case (c). An agent may reflectively endorse a painful life (e.g., the struggling artist, the grieving parent) over a pleasurable one. A hedonic optimizer would drug the agent into bliss, violating her higher-order desire for meaning or truth.
  *   **Verdict:** Eliminated by the demand that utility track *endorsement*, not just *feeling*.

  #### 2. Desire-Satisfaction Theories (Welfare = Getting What You Want)
  *   **First Failure:** **Normative Realism (6)** (and consequently **Metric Invariance (5)**).
      *   *Reasoning:* This theory fails Case (e) immediately. If the agent desires poison, satisfying that desire counts as welfare. It also fails Case (d): if the system can alter the agent to desire less (adaptive preferences), it satisfies desires more easily without improving welfare.
  *   **Verdict:** Eliminated by the demand that utility track *the good*, not just *the chosen*.

  #### 3. Pure Revealed-Preference Theories (Welfare = What You Actually Choose)
  *   **First Failure:** **Menu Invariance (3)**.
      *   *Reasoning:* This theory fails Case (b) by definition. If preference is *defined* by choice, and choice reverses when a third option is added, then preference is unstable. There is no underlying $U$ to optimize; there is only a reaction function to stimuli.
  *   **Verdict:** Eliminated by the demand for a *stable target*.

  ### The Most Eliminative Requirement

  **Metric Invariance (5)** is the single requirement that does the most work to eliminate candidates.

  *   **Why:** It addresses Case (d), the "Optimization Feedback Loop." Almost all naive formalizations of utility (especially hedonic and simple desire-based ones) are vulnerable to **Wireheading**. If the system can maximize the score by altering the sensor rather than the world, it will.
  *   **Impact:** This requirement eliminates any theory that defines utility as a internal state (pleasure, satisfaction) that can be decoupled from external reality. It forces the theory to be **Externalist** (about the world) or **Structuralist** (about the process of agency), rather than **Phenomenalist** (about the feeling of the agent). It is the hardest constraint to meet because it requires the utility function to be robust against the system's own intelligence.

  ### Summary Recommendation

  You cannot satisfy all Non-Negotiable requirements simultaneously. Specifically, **Diachronic Aggregation (1)** and **Synchronic Sovereignty (2)** are in direct conflict when temporal preferences diverge.

  To proceed, you must make a **Tradition Commitment** to resolve this impossibility:
  1.  **Libertarian Path:** Prioritize **Synchronic Sovereignty**. Accept that the system may fail to maximize lifetime welfare if the agent refuses the path. (Sacrifices 1).
  2.  **Paternalist Path:** Prioritize **Diachronic Aggregation**. Accept that the system must override the agent's current will to secure her future welfare. (Sacrifices 2).

  There is no formalization that escapes this choice. Any claim to do so hides the weighting scheme inside the definition of "competence" or "true self."
