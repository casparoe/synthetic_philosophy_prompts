answer: |-
  Your dependency structure holds, but you must insert a 'problem-feeling' phase before the criteria appear, and you must replace the Baptism with the Trial Confession to force conflicting verdicts.

  **Dependency Structure Correction**
  You note the criteria arrive as a fix to a problem they haven't felt yet; this is the weak point. If they do not feel the impossibility of the gap before you introduce the tools, the criteria will appear as arbitrary rules rather than desperate measures. Insert a 15-minute 'Problematisation' phase immediately after establishing the nature of the documents. Have them attempt to draft a biography of Jesus using only Mark, then only John, then both, and force them to articulate exactly where the contradiction hurts. They must experience the historiographical crisis before you offer the criteria as the proposed rescue. The sequence is: Gap (Nature of Sources) -> Crisis (Impossibility of Bridge) -> Criteria (Proposed Bridge) -> Collapse (Bridge Failure) -> Memory (New Question).

  **The Carrier**
  The Baptism is too tidy because Embarrassment, Dissimilarity, and Coherence all converge on 'authentic'; it validates the machine rather than exposing its gears. Use the **Trial Confession (Mark 14:62)**: "I am, and you will see the Son of Man seated at the right hand..."
  *   **Why it works:** It is short enough to memorize without a handout. It generates immediate conflict: Embarrassment supports it (it causes his death), but Dissimilarity rejects it (it looks like later high Christology). Coherence becomes visibly circular here (it coheres only if you assume the Gospel narrative is historical). This allows the room to watch the criteria vote against each other on the same data, proving they are not a unified algorithm.

  **Misconception Map & Timing**
  1.  **'Authentic' is one thing:** Head this off in the **Gap phase**. When defining the documents, explicitly distinguish *ipsissima verba* (exact words), *ipsissima vox* (exact voice), and *early layer* (tradition stratum). State clearly that the criteria only target the last claim.
  2.  **Dissimilarity is the strong criterion:** Address this during the **Criteria Intro**. Demonstrate that if a saying is dissimilar to Judaism and the Church, you cannot explain how it survived in a Jewish-Christian movement. It isolates Jesus from history rather than locating him.
  3.  **Coherence is harmless / Criteria are individual:** Address both during the **Collapse phase** using the Trial Confession. Show that Coherence is doing the heavy lifting by presupposing the narrative it is meant to test, and that applying them individually yields contradictions (Embarrassment says Yes, Dissimilarity says No).
  4.  **Faith/Method settles the question:** Dislodge faith in the **Intro** by bracketing theology as a different epistemic game. Dislodge method in the **Collapse** by showing the tool breaks. Do not address these in the middle; they are bookends.

  **The Memory Shift**
  Place this in the final 15 minutes, immediately after the Collapse. It must displace the **Sceptical Impasse**. Do not present it as "Method 2.0." Present it as a change in the subject: we stop asking "Did this happen?" and start asking "Why was this remembered?" This shifts the burden from verifying facts to understanding community formation. It resolves the crisis not by fixing the criteria, but by rendering the question of 'authenticity' secondary to the question of 'significance.'

  **Final Activity (5 Minutes)**
  Do not ask a question. Ask them to **draw the architecture**.
  Instruction: "Take a blank sheet. Draw the flowchart of today's argument. Mark the specific point where the tool breaks. Draw an arrow to what replaces it. Label the break with the specific criterion that failed."
  This tests whether they hold the dependency structure (Gap -> Crisis -> Tool -> Break -> Shift) rather than a list of content. If they draw a list of criteria, they missed the point. If they draw the failure point, they have the philosophy.
