answer: |-
  **Grade: 4/10**

  **General Summary:**
  You have the right vocabulary (Szilard, Landauer, Bennett, bits), but the causal mechanism in part (a) is backwards, and your conclusion in part (b) fundamentally misunderstands how the Second Law applies to composite systems. You also skipped the explicit calculation requested in (b).

  ### Part (a) Breakdown

  *   **Solid:**
      *   *"The Szilard engine gets kT ln 2 of work per cycle out of a single reservoir, which would violate the second law."*
      *   **Comment:** Correct identification of the apparent Kelvin-Planck violation.
  *   **Wrong (Major Conceptual Error):**
      *   *"The fix is due to Bennett: the demon has to record which side the particle was on, and **writing down that bit is an irreversible act that costs kT ln 2.**"*
      *   **Pushback:** This is the common misconception Bennett *corrected*. Measurement (copying information from the gas to the memory) can be performed reversibly. It does not inherently cost energy.
      *   *"So the **measurement burns exactly the work the engine produced**..."*
      *   **Pushback:** No. The measurement creates a correlation. The energy cost comes later, when you want to reset the demon to its initial state to close the cycle.
      *   *"This is Landauer's principle — any logically irreversible operation, **like measurement**, dissipates at least kT ln 2 per bit..."*
      *   **Pushback:** Measurement is not necessarily logically irreversible (you can reverse the correlation). **Erasure** (resetting the memory to a blank state) is the logically irreversible operation that dissipates heat.
  *   **Hand-waving:**
      *   *"so no information-processing trick can beat the second law."*
      *   **Comment:** True conclusion, but derived from the wrong premise above.

  ### Part (b) Breakdown

  *   **Solid:**
      *   *"Landauer's bound only kicks in when you erase information, and a tape that is never overwritten never erases anything, so the bound never bites."*
      *   **Comment:** This sentence is physically correct regarding Landauer's principle. You understood that erasure is the costly step. (Note: This contradicts your answer in part (a)).
  *   **Wrong (Critical Failure):**
      *   *"The packrat demon is a real loophole."*
      *   **Pushback:** It is not a loophole. It is a trade-off.
      *   *"It can therefore extract kT ln 2 per cycle from a single bath forever."*
      *   **Pushback:** It can only do this as long as you have fresh memory cells. More importantly, you are not extracting work *for free*; you are exchanging work for memory entropy.
      *   *"What this really shows is that the **second law isn't a law of physics at all**, just a statement about how much memory you're willing to spend."*
      *   **Pushback:** The Second Law holds perfectly. You simply expanded the system boundary. If you include the memory tape in the "universe," entropy increases.
  *   **Missing Work (Instruction Not Followed):**
      *   The question asked: *"Do the entropy bookkeeping for the whole gas + bath + memory system."*
      *   **Comment:** You did not show this calculation. You needed to write:
          *   $\Delta S_{bath} = -Q/T = -k \ln 2$ (Heat leaves bath to do work)
          *   $\Delta S_{gas} = 0$ (Cycle returns gas to start)
          *   $\Delta S_{memory} = +k \ln 2$ (One bit of random information stored per cycle)
          *   $\Delta S_{total} = 0$ (Reversible limit) or $>0$.
      *   Because $\Delta S_{memory}$ grows, the total entropy of the universe does not decrease. The Second Law is satisfied.

  ### TA Note for Discussion
  Come see me during office hours. The distinction between the cost of *measurement* vs. the cost of *erasure* is the single most important concept in this unit, and you have them flipped in part (a). In part (b), remember that "information is physical"—the entropy stored on that tape counts toward the Second Law just as much as thermal entropy does.
