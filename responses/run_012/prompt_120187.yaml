          *   (b) Quote: "Do the entropy bookkeeping..." (Prompt instruction). Student didn't show $\Delta S_{memory}$.
          *   (b) Quote: "second law isn't a law of physics". Correction: It holds when including memory entropy.

  6.  **Refining the Feedback (Self-Correction/Polishing):**
      *   Make sure I don't sound like an AI, but like a TA. Use "I" or imperative mood.
      *   Ensure the distinction between Landauer (erasure cost) and Szilard/Bennett (measurement correlation) is clear.
      *   Highlight that in (b), the system isn't cyclic if memory grows, so comparing it to a standard heat engine cycle is tricky, but the 2nd Law ($\Delta S_{univ} \ge 0$) still holds.
