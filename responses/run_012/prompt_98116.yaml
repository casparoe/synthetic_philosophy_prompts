prompt: |-
  Ok so I'm in a weird spot and could use some help untangling it. I got a jury summons last week and from the paperwork it looks like it might be a capital case, and ever since then I've been going down a rabbit hole reading about the death penalty. I ended up rereading Camus's essay on it (the one about the guillotine — I liked The Myth of Sisyphus back in college so I definately figured I'd see what he had to say), and now I'm just confused. His whole absurdism thing seems to be that life has no meaning, that the universe is silent and there's no answer to "why live" — so if life has no meaning, then surely it doesn't really matter whether the state kills somebody. It's just one more indifferent event. So why would Camus, of all people, get so worked up about the death penalty? It almost seems like he must secretly believe life is sacred or something, which is a pretty religious idea for a guy who told us to embrace the absurd. My roommate said it's because the death penalty is basically "premeditated murder by the state" and because it doesn't even deter crime, but that just sounds like a standard liberal argument, not an absurdist one — I don't see how it connects to Sisyphus at all.

  And the thing that bugs me the most: if absurdism really means nothing matters, shouldn't Camus be equally laid-back about war, torture, famine, everything? But he obviously wasn't, he cared a lot. So either I'm badly misunderstanding what absurdism is, or Camus was just inconsistent. Can you tell me where I'm going wrong? I'd rather not say something dumb during jury selection.
