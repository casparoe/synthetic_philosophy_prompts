answer: |-
  You have hit on one of the most persistent and difficult problems in Adam Smith scholarship. Your intuition is sharp: if the impartial spectator is just internalized social approval, Smith is a moral relativist/conventionalist. But if he condemns the conventions of his own time (like slavery or the exposure of infants), he must be appealing to a standard *outside* those conventions.

  There is no single, settled "textbook answer" to this. While there is consensus on *how* the spectator develops (socialization), there is significant disagreement among experts on *what grounds its authority* when it conflicts with actual society.

  Here is a breakdown of the competing interpretations, flagging where the scholarly consensus ends and the debate begins.

  ### 1. The Conventionalist Reading (and its limits)
  You are correct that the *mechanism* of the spectator is sociological. Smith argues that we have no immediate way of seeing our own passions; we need the "mirror" of society to judge them. We learn to be moral by interacting with others who reward or punish our behavior.

  *   **The Consensus:** Almost all scholars agree that for Smith, moral concepts *originate* in social interaction. There is no innate moral rulebook (against the Rationalists like Clarke) and no divine voice speaking directly to the soul (against the Calvinists of his day).
  *   **The Problem:** As you noted, Smith explicitly argues that custom can corrupt moral sentiments. In *TMS* V.1, he discusses how custom can make us approve of "deformity" (like foot-binding or Greek infanticide). If the spectator is just the crowd, how can it judge the crowd?

  **Scholarly Flag:** Some scholars (like **D.D. Raphael**) suggest Smith is a "soft" conventionalist. He believes morality is socially constructed, but some constructions are more stable and conducive to human flourishing than others. However, this doesn't fully solve your problem of how an individual can know their society is the "wrong" one while living in it.

  ### 2. The "Well-Informed" Spectator (The Naturalist Reading)
  This is the most common attempt to solve the regress problem without invoking God or abstract Reason.

  On this reading, the impartial spectator is not a *different person* than your neighbors, but your neighbors (and yourself) under specific **conditions**. The standard isn't "what people approve," but "what people *would* approve if they were:"
  1.  Fully informed of the facts.
  2.  Calm and free from immediate passion.
  3.  Distant enough to not be personally affected.

  *   **How it avoids Conventionalism:** A society that approves of slavery is operating on false facts (e.g., that enslaved people are not fully human) or is too close to the economic benefits to be calm. The impartial spectator corrects for *ignorance* and *bias*, not just social opinion.
  *   **How it avoids Regress:** You don't need a spectator to watch the spectator. You just need to check if the conditions of information and calmness are met. The "standard" is the natural functioning of human sympathy when not distorted.

  **Scholarly Flag:** This is the dominant view among secular readers of Smith (e.g., **Samuel Fleischacker**). However, critics argue this just pushes the problem back: Who decides what counts as "fully informed" or "calm"? Isn't that judgment itself culturally conditioned? Smith doesn't give a clear algorithm for this, which leaves the door open to the charge that he is smuggling in his own 18th-century British prejudices as "universal facts."

  ### 3. The Natural Law / Stoic Reading
  Some scholars argue you are right to look for something like a "law of the kind his contemporaries used," but that Smith disguises it.

  *   **The Argument:** Smith was a professor of Natural Jurisprudence. In *TMS*, he suggests there is a "natural" propriety to human sentiments. Just as a watch has a proper function, human sentiments have a natural pitch. The impartial spectator is the tool we use to tune ourselves to that natural pitch.
  *   **The Source:** The standard comes from **Human Nature** itself, which Smith treats as relatively constant across history (unlike customs). Because human psychology is uniform, a spectator in ancient Greece and 18th-century Scotland *should* converge on the same judgments if both are impartial.
  *   **The Stoic Connection:** Smith borrows heavily from the Stoic idea of viewing oneself from the perspective of the cosmos. The "impartiality" is a view from nowhere, which transcends local custom.

  **Scholarly Flag:** **Knud Haakonssen** is a key proponent of reading Smith within the Natural Law tradition. However, others (like **Charles Griswold**) argue Smith is critical of Stoicism. Smith thinks the Stoic ideal is *too* detached. So, while Smith uses Natural Law language, it is contested whether he believes in a metaphysical Natural Law or just a psychological uniformity.

  ### 4. The Theological Reading
  You mentioned Smith doesn't seem to fall back on God's commands. This is true in Parts I–III of *TMS*, but in Part VII (and the final edition of the book), Smith invokes the "Author of Nature" frequently.

  *   **The Argument:** The impartial spectator is the "vice-regent of God within the breast." The reason we can trust the spectator to override local custom is that God designed human nature such that the impartial spectator aligns with Divine will.
  *   **How it solves the problem:** It stops the regress. The spectator is authoritative because it is the divine element in us.
  *   **The Counter-Argument:** Smith is notoriously ambiguous. He often uses "Author of Nature" language that can be read as Deistic or even metaphorical. He never grounds his specific moral judgments in Scripture.

  **Scholarly Flag:** This is highly contested. **James Otteson** argues for a strong theological reading, suggesting the system collapses without God. **Dennis Rasmussen** and others argue Smith's system is designed to work for believers and non-believers alike, and the theological passages are largely conciliatory to his religious audience. There is no consensus on whether the theology is structural or ornamental.

  ### 5. Addressing your specific "Regress" Objection
  You asked: *"To know whether his feelings are the right ones I'd need to imagine yet another spectator watching him."*

  Most Smith scholars reject the idea that this leads to an infinite regress. They argue the spectator is not a *person* you imagine, but a **stance** you adopt.
  *   **The Fleischacker Interpretation:** Philosopher Samuel Fleischacker argues the spectator is simply your "best self." It is you, reasoning as well as you can. The regress stops because you aren't checking your spectator against another spectator; you are checking your sentiments against the *facts* and the *sympathetic responses of others* in a process of ongoing dialogue.
  *   **The "General Rules" Interpretation:** Smith says that over time, from many particular judgments of the spectator, we induce "general rules" of morality (like "do not kill"). Once formed, these rules act as a check. We don't need a new spectator to judge the rules; the rules are the sedimented wisdom of past spectators.

  **Scholarly Flag:** There is debate on whether Smith's "general rules" are rigid duties (Kant-like) or loose heuristics. If they are loose, the regress worry remains: who interprets the rule?

  ### Summary of the State of Play

  To answer your core question: **Is the impartial spectator something other than the internalized voice of society?**

  *   **Consensus:** Yes, it is *more* than the raw voice of society. It is a *refined* voice.
  *   **Disagreement:** On what does the refining rest?
      1.  **Psychological Naturalists:** It rests on the universal facts of human psychology (sympathy works the same way everywhere).
      2.  **Theological Realists:** It rests on the design of the Author of Nature.
      3.  **Critical Reflectors:** It rests on a process of dialogue and information-seeking that theoretically converges on truth, even if we can't guarantee it.

  **On the "Conventionalist" Charge:**
  Smith is generally **not** considered a strict conventionalist by modern experts because he provides tools to criticize convention (the distinction between custom and nature, the requirement of full information). However, scholars admit Smith does not provide a *knockdown proof* that the spectator is infallible. He admits that even the impartial spectator can be corrupted by "spirit of faction" or extreme poverty.

  **The "Independent Standard":**
  If you want a label for where the standard comes from, the most accurate scholarly description is **Sentimentalist Naturalism**. The standard is independent of *local* custom, but it is *not* independent of human nature. For Smith, there is no "moral truth" floating in a Platonic heaven or written in a divine book. Moral truth is what human beings, functioning naturally and impartially, agree upon.

  **Where the Experts Disagree (for your reading list):**
  *   **Is Smith a Natural Law theorist?** (Haakonssen says yes, in a modified sense; others say no).
  *   **Is the "Author of Nature" essential?** (Otteson says yes; Fleischacker says the moral theory stands without it).
  *   **Is the Spectator universal or contextual?** (Some argue Smith's spectator inevitably reflects 18th-century commercial values; others argue Smith's framework allows for radical critique of those values).

  **Recommendation:**
  If you want to dig into this specific tension, look at **Samuel Fleischacker's *On Adam Smith's Wealth of Nations*** (specifically the chapters on moral philosophy) or **D.D. Raphael's *The Impartial Spectator***. Fleischacker is particularly good at addressing the "regress" and "conventionalism" worries without resorting to theology. **Charles Griswold's *Adam Smith and the Virtues of Enlightenment*** is also essential for the Stoic/Naturalist angle.

  You haven't misread him; you've identified the central tension that keeps Smith scholars employed. Smith wants morality to be grounded in human sentiment (which is social) but also wants it to be critical of society (which requires transcendence). He tries to bridge this with the "impartial spectator," but exactly how that bridge holds up is the subject of ongoing debate.
