  # SEMINAR HANDOUT: The Value of Information
  **Topic:** Rational Avoidance of Free Information  
  **Core Theorem:** Good's Theorem (1967) — For an expected utility (EU) maximizer with fixed options, stable preferences, and no strategic observers, the expected value of free information is non-negative.

  **ROOT CLAIM:** *It is sometimes rational to avoid free information.*

  ---

  ### DECISION TREE

  **1. WHERE IS THE DISVALUE LOCATED?**
  *   **A. In the Decision Outcomes** (The information leads to worse worldly consequences). → *Go to Node 2.*
  *   **B. In the Epistemic State** (The state of knowing/not-knowing is itself good/bad). → *Go to Node 6.*

  **2. DOES LEARNING ALTER THE OPTION SET?**
  *   **A. Yes.** (Learning physically or causally removes options). → **LEAF 1: Causal Interventionism.**
      *   *Commitment:* Conflates the content of information with the event of receiving it. *(Note: Non-causal option removal is incoherent.)*
      *   *Case:* Patient asks doctor to filter results (Node 3 case).
  *   **B. No.** (Options remain physically available). → *Go to Node 3.*

  **3. DOES THE AGENT MAXIMIZE EXPECTED UTILITY?**
  *   **A. No.** (Agent maximizes regret, security, or satisfies constraints). → **LEAF 2: Non-EU Decision Theory.**
      *   *Commitment:* Violates standard diachronic consistency (vulnerable to Dutch Books).
      *   *Case:* Chess player avoiding plan to minimize maximum regret.
  *   **B. Yes.** (Agent maximizes EU). → *Go to Node 4.*

  **4. ARE PREFERENCES STABLE UPON LEARNING?**
  *   **A. No.** (Learning changes what the agent values). → **LEAF 3: Dynamic Preference Change.**
      *   *Commitment:* Makes long-term planning impossible; agent is a sequence of selves.
      *   *Case:* Genetic testing changes life goals.
  *   **B. Yes.** (Preferences remain constant). → *Go to Node 5.*

  **5. IS PSYCHOLOGY STABLE (NO ANXIETY/WEAKNESS)?**
  *   **A. No.** (Learning induces anxiety/depression counted as utility loss). → **LEAF 4: Psychological Cost Account.**
      *   *Commitment:* **Cannot be formally distinguished from Leaf 3** (Preference Change) in standard utility models.
      *   *Case:* Untreatable disease risk (Node 1 case).
  *   **B. Yes.** (No psychological side-effects). → *Go to Node 6 (via Outcome Branch).*
      *   *(Note: If Agents are present, see Leaf 5 below. If isolated, see Leaf 6).*
      *   **LEAF 5: Strategic Signaling.** (If other agents observe learning). *Commitment:* Abandons single-agent isolation assumption.
      *   **LEAF 6: Orthodox Bayesianism.** (If single agent). *Commitment:* Must deny Root Claim (VoI is always $\ge$ 0). **SETTLED.**

  **6. IS THE VALUE OF TRUTH INSTRUMENTAL?**
  *   **A. Yes.** (Truth is only valuable for achieving other goals). → **LEAF 7: Pragmatic Encroachment.**
      *   *Commitment:* Blurs the line between epistemic justification and practical stakes.
  *   **B. No.** (Truth/Knowledge has intrinsic value). → *Go to Node 7.*

  **7. DOES THE SOURCE OF BELIEF MATTER?**
  *   **A. Yes.** (Knowledge > Lucky True Belief). → **LEAF 8: Virtue Epistemology.**
      *   *Commitment:* Value differs despite identical world-states and action-guiding power.
      *   *Case:* Lucky guess vs. test result (Node 4 case).
  *   **B. No.** (True Belief is the sole unit of value). → **LEAF 9: Veritistic Value.**
      *   *Commitment:* Cannot distinguish knowledge from accidental true belief.

  ---

  ### DIAGNOSTIC NOTES

  **Settled vs. Contested:**
  *   **Settled:** **Leaf 6 (Orthodox Bayesianism)** is mathematically settled *if* all assumptions (Nodes 2–5) hold. Good's Theorem is not disputed.
  *   **Contested:** The empirical validity of Nodes 4 & 5 (Human Stability) and the normative validity of Node 6 (Epistemic Value) are live debates.

  **Indistinguishable Leaves:**
  *   **Leaf 3 (Preference Change)** and **Leaf 4 (Psychological Cost)** are flagged above. In a utility function, "I now value health less" and "I now suffer anxiety" often look identical (a drop in expected utility for the same outcome). Distinguishing them requires metaphysical claims about the self, not just decision data.

  **Empty Branches:**
  *   Under **Node 2**, the branch "Options Altered Non-Causally" is **Incoherent**. Information is abstract; it cannot close physical doors without a causal mechanism (e.g., a law, a threat, or a psychological reaction covered in Node 5).

  **Diagnostic Cases Key:**
  1.  **Untreatable Disease:** Maps to Leaf 4 (Psych Cost) or Leaf 3 (Pref Change).
  2.  **Chess Player:** Maps to Leaf 2 (Non-EU/Regret) or Leaf 4 (Psych Cost/Performance Anxiety).
  3.  **Treatable Only:** Maps to Leaf 1 (Causal/Filtering).
  4.  **Lucky Guess:** Maps to Leaf 8 (Virtue) vs Leaf 9 (Veritistic).
