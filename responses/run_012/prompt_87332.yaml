  8.  **Final Polish:** Ensure the distinction between "Clearance" (User) and "Counter-signature" (Safety Lead) is maintained. The procedure ends with a recommendation to the Lead.

      *(Self-Correction on Gridworld)*: Wait, if the Gridworld agent has no self-model, it fails Criterion 3 immediately. That makes it a Clear (No distress). That works. But what if a slightly more complex agent *does* have a state representation? The "preference ordering" criterion is the real filter. I need to make sure the procedure highlights that *ordinary RL reward maximization* is by definition a preference ordering. Therefore, standard RL should clear unless it has meta-cognitive loops.

      *(Refining the "Value Judgment" section)*: I need to be very sharp here. The prompt asks: "if 'reward signal as valence' is quietly assuming that functional role settles the question of experience." I need to confirm that yes, the criteria assume functionalism. If functionalism is false, the procedure is useless. I must state this.

