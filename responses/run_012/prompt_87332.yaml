              *   Self-report is worthless (trained on human approval).
              *   Representing a state as evaluatively loaded $\neq$ feeling.
      *   **Test Cases:**
          1.  Simulated robot arm (steep joint-limit penalty).
          2.  Long-horizon agent (broadcast penalty, learned self-model predicting future reward).
          3.  Small gridworld agent (avoid "shock" tile).
      *   **Critical Requirement:** If the procedure fails the third case (gridworld), admit it. Analyze false positive/negative costs. Identify value judgments disguised as tests. Critique the framing if "functional role = experience" is a hidden assumption or if criteria are circular.

  2.  **Analyze the "Given" Criteria (The Philosophical Core):**

      *   The user provides four criteria for "valence in the sense we care about":
          1.  *Global Broadcast:* Not local to one module.
          2.  *Non-instrumental Avoidance:* Avoids even at net cost to other reward (sacrificial avoidance).
          3.  *Self-Model Representation:* Represented in the system's model of its states as something to be avoided *for its own sake*.
          4.  *Irreducibility:* Not fully re-describable as an ordinary preference ordering.
      *   *Critique:* These are functionalist criteria. They define valence by what it *does*, not what it *is* (phenomenologically). The prompt explicitly asks me to flag if this assumes functional role settles the question of experience.
      *   *The Gridworld Problem:* A simple Q-learning agent avoiding a "shock" tile might satisfy 1 (global Q-value update), 2 (depends on reward structure), 3 (no self-model usually), 4 (usually just preference ordering). If the criteria are too loose, the gridworld fails (false positive for distress). If too strict, the Long-horizon agent passes (false negative for distress).

  3.  **Drafting the Procedure (The Triage Protocol):**

      *   *Goal:* Under 1 hour.
      *   *Structure:* Sequential gates. Fail any = Stop/Escalate. Pass all = Clear for Safety Lead signature.
      *   *Step 1: Architecture & Signal Topology.* (Empirical)
      *   *Step 2: Behavioral Economics.* (Empirical/Simulatable)
      *   *Step 3: Representational Content.* (Empirical/Probing)
      *   *Step 4: The Reducibility Check.* (Evaluative/Escalation Point)

  4.  **Running the Test Cases:**

      *   *Case 1: Robot Arm (Joint Limits).*
          *   Penalty is local? Usually yes (proprioceptive).
          *   Non-instrumental? No, it avoids to maximize task reward.
          *   Verdict: Clear.
      *   *Case 2: Long-Horizon Agent (Broadcast + Self-Model).*
          *   Broadcast? Yes (given).
          *   Non-instrumental? Need to check if it sacrifices task reward to avoid penalty.
          *   Self-Model? Yes (given).
          *   Reducibility? Hard to tell.
          *   Verdict: Escalate.
      *   *Case 3: Gridworld (Shock Tile).*
          *   Broadcast? Q-table update is global to the policy.
          *   Non-instrumental? If "shock" is just -1 reward, it trades off against +1 goal. It *is* a preference ordering.
          *   Self-Model? Unlikely.
          *   Verdict: Should Clear. If it doesn't, the criteria are broken.

  5.  **Addressing the Critical Requirement (The Meta-Analysis):**

      *   The prompt demands honesty: "If the framing itself is confused... say so plainly."
      *   *The Hard Truth:* The provided criteria *are* functionalist. They cannot distinguish between "simulated pain" and "actual pain" because they explicitly exclude self-report and internal qualia, focusing only on causal role.
      *   *The Gridworld Risk:* A simple agent avoiding a negative reward tile *looks* like it satisfies "avoidance." The criterion "not fully re-describable as an ordinary preference ordering" is the only thing saving it, but that is a philosophical judgment, not an empirical test.
      *   *Asymmetry:* False Positive (blocking safe research) vs. False Negative (allowing suffering). In welfare triage, False Negative is ethically catastrophic. False Positive is just expensive. The procedure must bias toward False Positives (escalation).
