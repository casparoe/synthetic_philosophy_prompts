answer: |-
  ### Session Plan: The Consistency Paradox in Committee Voting
  **Time:** 90 Minutes
  **Audience:** Law, Medicine, Engineering (Non-philosophers)
  **Objective:** To guide the group to discover the *Discursive Dilemma* (the inconsistency between premise-based and conclusion-based majority voting) as a structural inevitability rather than a procedural error.

  ---

  ### I. The Sequence of Discovery (Order of Ideas)
  To ensure this feels like a discovery rather than a trick, you must establish the **norms** before you introduce the **mechanism**, and the **mechanism** before you reveal the **contradiction**. Do not name the paradox until the end.

  1.  **Establish Shared Norms (Minutes 0–15):**
      *   Begin by codifying the committee's implicit values. Ask the room to agree on two principles:
          *   **Principle of Rationality:** The collective decision must be logically consistent with the reasons given for it. (If we agree *A* and *B* are true, and *A+B* implies *C*, we cannot reject *C*.)
          *   **Principle of Democracy:** The collective view on any specific question should reflect the majority view of the members.
      *   *Why this comes first:* If you don't secure their commitment to these norms, the paradox will look like a mistake in counting rather than a conflict between values.

  2.  **The Simulation (Minutes 15–35):**
      *   Run the voting exercise (see Example below). Do not explain the theory yet. Treat it as a dry run of their own committee procedure.
      *   Have them vote on the components individually. Tally the majorities.
      *   Have them vote on the final decision individually. Tally the majority.
      *   *Why this comes second:* They must see the numbers with their own eyes before you tell them what the numbers mean.

  3.  **The Reveal (Minutes 35–55):**
      *   Place the two tallies side-by-side. Show that the majority view on the *components* entails a specific outcome, but the majority view on the *outcome* is the opposite.
      *   Ask: "Who voted for the winning decision?" (Answer: No one, or a minority).
      *   Ask: "Did anyone vote irrationally?" (Answer: No, every individual was consistent).
      *   *Why this comes third:* The cognitive dissonance must land before you offer relief. This is the moment the "problem" registers.

  4.  **Diagnosis and Boundaries (Minutes 55–75):**
      *   Explain that this is structural, not behavioral. Introduce the term *Discursive Dilemma*.
      *   Address misconceptions here (see Section III).
      *   *Why this comes fourth:* Now that they feel the tension, they will look for ways to dismiss it. You must block the escape routes.

  5.  **Implications and Closing (Minutes 75–90):**
      *   Discuss the trade-off between "Premise-Based" and "Conclusion-Based" procedures.
      *   Pose the closing question.

  ---

  ### II. The Example Vehicle
  **Recommendation:** Do **not** use the well-worn three-judge contract case.
  **Reasoning:** While logically sound, it is culturally specific to law. Your engineering and medicine colleagues will view it as "a legal problem" rather than a structural one. It creates distance.
  **Selection:** Use a **Generalized Hiring/Promotion Scenario** (based on your experience, but abstracted).
  **Why:** Every discipline in the room hires or promotes. It universalizes the problem.

  **The Setup:**
  *   **The Rule:** A candidate is approved (Outcome *O*) if and only if they meet Criterion *A* (e.g., Technical Skill) **AND** Criterion *B* (e.g., Ethical Clearance).
  *   **The Committee:** Three members (1, 2, 3).
  *   **The Votes:**
      *   **Member 1:** Yes on *A*, Yes on *B* → Therefore Yes on *O*.
      *   **Member 2:** Yes on *A*, No on *B* → Therefore No on *O*.
      *   **Member 3:** No on *A*, Yes on *B* → Therefore No on *O*.
  *   **The Tally:**
      *   Majority on *A*: **Yes** (2–1).
      *   Majority on *B*: **Yes** (2–1).
      *   **Logical Implication:** If the committee accepts the majority view on *A* and *B*, the outcome *O* must be **Yes**.
      *   Majority on *O*: **No** (2–1).
  *   **The Contradiction:** The committee collectively accepts the reasons for hiring, but collectively rejects the hire.

  **Requirement:** Ensure the criteria (*A* and *B*) are presented as objective judgments (true/false), not preferences (like/dislike). This is crucial for distinguishing this from Arrow's Theorem later.

  ---

  ### III. Misconceptions and Intervention Points
  You must anticipate four specific defensive reactions. Head them off at the precise moments listed.

  1.  **"This is just Arrow's Impossibility Theorem."**
      *   *The Misconception:* That this is about ranking preferences (Candidate X > Candidate Y).
      *   *The Correction:* Arrow deals with *preferences*; this deals with *judgments* (truth values). We are not ranking; we are assessing facts against a rule.
      *   *Intervention Point:* **Minute 60 (Diagnosis).** Introduce this distinction immediately after naming the paradox. If they conflate the two, they will assume the problem is about fairness of ranking rather than logical consistency.

  2.  **"This only happens if people vote strategically."**
      *   *The Misconception:* That the paradox relies on members lying about their views to game the system.
      *   *The Correction:* In the simulation above, every member voted sincerely and consistently. The paradox arises *because* they were honest.
      *   *Intervention Point:* **Minute 40 (The Reveal).** When you ask "Did anyone vote irrationally?", emphasize that everyone voted their true belief. This prevents them from dismissing the problem as a "gaming" issue.

  3.  **"The remedy is simple: Just vote on the conclusion, ignore the premises."**
      *   *The Misconception:* That switching to a conclusion-based vote solves the problem without cost.
      *   *The Correction:* Voting on the conclusion preserves the outcome majority but sacrifices the "Reasoned Decision." It renders the component votes advisory only, undermining the Principle of Rationality established in Minute 0.
      *   *Intervention Point:* **Minute 70 (Implications).** Frame this not as a solution, but as a choice of which principle (Rationality vs. Democracy) to sacrifice.

  4.  **"This proves collective decision-making is impossible."**
      *   *The Misconception:* Nihilism. That committees cannot function rationally.
      *   *The Correction:* It proves that *unrestricted* majority voting on connected propositions is inconsistent. Committees function by implicitly choosing which procedure (premise vs. conclusion) to prioritize.
      *   *Intervention Point:* **Minute 85 (Closing).** Ensure they leave knowing the dilemma is manageable, not fatal.

  ---

  ### IV. The Closing Question
  Do not ask a mathematical question. Ask a normative one that forces them to choose between the two principles you established in the first 15 minutes.

  **The Question:**
  > "If we must choose between a decision that reflects the majority's view on the *reasons*, or a decision that reflects the majority's view on the *outcome*, which one grants our committee the greater legitimacy to defend its choice to the public?"

  **Why this works:** It tests whether they understand that the paradox is not a math error to be fixed, but a tension between two competing democratic values (Accountability for Reasons vs. Accountability for Outcomes). If they answer confidently, they grasp the dilemma. If they hesitate, they are still looking for a calculation error.

  ---

  ### V. What to Explicitly Refuse
  To keep the session within 90 minutes and accessible to non-philosophers, you must draw a hard boundary around the following:

  1.  **Formal Proofs:** Refuse to write out the logical notation (e.g., $P \land Q \leftrightarrow R$) beyond the simplest schematic. Do not discuss the "List-Pettit Theorem" formally.
  2.  **Alternative Aggregation Rules:** Do not go into quota rules, weighted voting, or sequential voting procedures. This turns a conceptual session into a mechanism-design workshop.
  3.  **Historical Genealogy:** Do not spend time distinguishing the "Doctrinal Paradox" (Kornhauser & Sager) from the "Discursive Dilemma" (Pettit & List). For this audience, they are the same phenomenon.
  4.  **Preference Aggregation:** Strictly forbid the discussion of ranked-choice voting or Borda counts. Keep the focus entirely on binary judgments (True/False, Pass/Fail).

  **Instruction to Self:** If a colleague asks, "Can't we just weight the votes?" or "What if we use Condorcet methods?", answer: "Those solve preference aggregation. We are discussing judgment aggregation. Let's stay on the logic of the reasons."
