  Bottom line
  Bankroll management rules presuppose that rational agents maximize the geometric growth rate of wealth rather than arithmetic expected value. This framework treats ruin as an absorbing state that terminates the game, making time-average performance the only metric that matters for long-term survival. Consequently, these rules apply even to single bets if the agent views capital as a reusable instrument for future opportunities rather than consumable currency. Ordinary expected-utility maximization with a concave function can mimic this behavior, but the strict 2% rule specifically targets log-utility optimization. If you swap this for straight expected-value maximization, the 2% rule collapses, and agents should bet their entire bankroll on any positive EV opportunity.

  The rule as a decision procedure
  Calculate your edge and variance for the specific opportunity. Measure your total liquid capital dedicated to this activity, defined as your bankroll. Size your wager such that the risk of ruin remains negligible, typically capping exposure at 2% of the total bankroll per event or utilizing half-Kelly criterion based on edge-to-odds ratios. Implement hard stop-losses that halt activity if the bankroll dips below a predefined threshold, preventing emotional chasing. Treat the bankroll as a non-consumable tool; never inject outside funds to cover losses nor withdraw profits needed for operational stability. Re-evaluate sizing only after significant bankroll fluctuations, ensuring bet sizes scale down with losses and up with wins. This procedure prioritizes survival and compounding over immediate profit maximization on any single hand.

  What it presupposes
  The practice presupposes a specific ontology of money and time where wealth follows a multiplicative dynamic rather than an additive one. It assumes money is not linearly valuable; instead, it operates under logarithmic utility, where the marginal value of a dollar decreases as wealth increases. This aligns with the Kelly Criterion, which maximizes the expected logarithm of wealth, equivalent to maximizing the geometric growth rate. Crucially, this framework relies on an ergodic perspective: it prioritizes time averages (what happens to one player over many bets) over ensemble averages (what happens to many players at one point). Pure expected-value maximization fails here because it ignores the path-dependence of wealth; a sequence of bets that maximizes arithmetic mean often leads to zero wealth with probability one over time.

  The rules presuppose that ruin is a categorically distinct outcome from mere loss. Once bankroll hits zero, the agent cannot recover, rendering future positive expected-value opportunities inaccessible. This transforms the decision problem from a series of independent trials into a single, continuous trajectory where survival is the primary constraint. Rationality is defined not by making the optimal choice in isolation, but by making choices that sustain the agent's presence in the game. Probability is treated not just as a frequency of outcomes, but as a risk of traversal through a state space where zero is a boundary condition. The agent assumes they will face a sequence of bets large enough for the law of large numbers to manifest variance, making volatility a risk to survival rather than just noise. Therefore, the rational agent sacrifices arithmetic expected profit to reduce variance, ensuring the geometric mean remains positive. This implies a view of the self as persistent over time, where future utility depends strictly on current solvency. Even a one-shot bettor is treated as a sequence of potential bettors across their lifetime, making fractional betting coherent if capital preservation enables future participation. The theory commits to the idea that value is derived from the capacity to act in the future, not just the consumption of today. It posits that the utility of money is tied to its function as a tool for generating more money, not merely purchasing power. This distinguishes it from standard consumption-based utility models. The commitment to time-averages implies that the individual cares more about their own specific trajectory than the average outcome of a group of peers.

  What it merely fits
  Much of this behavior is compatible with standard expected-utility theory without invoking ergodicity. A risk-averse agent with a concave utility function (like square root or log) will naturally bet less than the full bankroll on positive EV wagers. If an agent faces a hard constraint against ruin—perhaps due to external liabilities or psychological pain—they may adopt stop-losses simply to satisfy a boundary condition rather than to optimize growth. The 2% rule often fits these models because it approximates the optimal bet size for highly risk-averse utility functions. Furthermore, regulatory or institutional constraints in quant funds mimic bankroll management without necessarily adhering to growth optimality. Thus, the practice fits any model where marginal utility declines or where ruin carries infinite disutility, even if the underlying justification differs from geometric growth maximization. Additionally, behavioral economics suggests loss aversion mirrors these rules, where the pain of losing outweighs the pleasure of winning. This psychological fit reinforces the practice even if the mathematical justification varies. The rules accommodate agents who cannot accurately calculate edge but understand variance, allowing heuristic adherence to sound principles without precise modeling.

  Where it's silent
  The practice leaves critical definitions ambiguous. It does not specify what constitutes the "bankroll"—is it dedicated gambling capital or total net worth? This distinction changes the risk profile entirely. It remains silent on the precise utility function, oscillating between log-utility (Kelly) and arbitrary risk constraints (2% rule). The time horizon is also undefined; the rules assume an indefinite sequence of bets, offering no guidance for agents with finite horizons or specific liquidity needs. Additionally, it does not resolve how to value leisure or effort; a player might maximize growth but miserablely grind low stakes rather than taking higher variance shots at higher stakes. The theory does not dictate when to stop playing entirely if edge diminishes, only how to bet while playing. It also ignores tax implications and consumption needs, treating money as purely instrumental rather than useful for immediate goods. Finally, it offers no method for estimating edge, leaving the most dangerous variable to the player's subjective judgment.

  What changes if you swap the theory
  If you switch to straight expected-value maximization with linear utility, bankroll management collapses. A rational EV maximizer should bet their entire bankroll on every wager with positive expected value, regardless of variance. The 2% rule becomes irrational under this framework, as it unnecessarily caps upside potential. Stop-losses are counterproductive because past losses are sunk costs; if the edge remains, the bet size should depend only on current capital, not historical drawdowns. Ruin is no longer a categorical evil but merely a low-probability outcome weighed against high returns. In a one-shot scenario, an EV maximizer bets everything on any positive edge, whereas a growth maximizer bets a fraction. Consequently, swapping the theory transforms the agent from a survivalist compounding capital into a gambler seeking immediate arithmetic maximization, accepting certain eventual ruin in exchange for higher ensemble-average wealth. The 2% rule does not survive; it is replaced by "all-in" sizing on any edge greater than zero. This shift fundamentally alters the definition of success. Under EV maximization, a strategy that yields billions for one person and zero for nine others is superior to a strategy that yields millions for all ten. Bankroll management rejects this ensemble view. Without the growth constraint, the concept of "going broke" loses its special status; it is just another data point in the distribution. The discipline of sizing down after losses disappears, as current wealth is the only variable that matters, not the path taken to arrive there.
