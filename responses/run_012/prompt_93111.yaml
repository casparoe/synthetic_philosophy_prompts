answer: |-
  This is a precise request for the "specification sheet" of two-dimensional semantics. The frustration you describe is common: the literature often treats 2D semantics as a solution to specific Kripkean puzzles rather than a standalone theoretical framework with success conditions.

  Below are the acceptance criteria for an adequate theory of two-dimensional content, structured by positive deliverables, negative constraints, and the inherent tensions between them.

  ### I. Positive Desiderata: Cases the Theory Must Deliver

  An adequate 2D theory must provide a unified mapping from expressions to pairs of intensions (functions from worlds to extensions) that satisfies the following conditions.

  **1. The Necessary A Posteriori (The Kripke Constraint)**
  *   **The Case:** "Water is H2O" or "Hesperus is Phosphorus."
  *   **Requirement:** The theory must assign these statements a **Secondary Intension** that is true in all metaphysically possible worlds (given how the actual world turns out), rendering them necessary. However, it must assign them a **Primary Intension** that is not true in all epistemically possible scenarios, rendering them a posteriori.
  *   **Why:** To explain how a speaker can be rational in doubting the identity prior to empirical investigation, even though the identity, once established, holds with metaphysical necessity.

  **2. The Contingent A Priori (The Evans/ Kaplan Constraint)**
  *   **The Case:** "I am here now" or "Julius invented the zipper" (where 'Julius' is stipulated to refer to the inventor).
  *   **Requirement:** The theory must assign these statements a **Primary Intension** that is true in all epistemically possible scenarios (knowable without empirical investigation), rendering them a priori. However, it must assign a **Secondary Intension** that varies across metaphysically possible worlds, rendering them contingent.
  *   **Why:** To capture truths fixed by linguistic convention or indexical context that give the speaker knowledge of the actual world without empirical observation, despite describing a state of affairs that could have been otherwise.

  **3. Uniformity of Mechanism (The Anti-Patchwork Constraint)**
  *   **The Case:** A sentence mixing proper names, natural kind terms, definite descriptions, and indexicals (e.g., "I suspect that water is not H2O").
  *   **Requirement:** The derivation of the two intensions must proceed via a single compositional mechanism for all singular terms. You cannot treat 'I' as 2D, 'Water' as 2D, and 'Aristotle' as 1D (rigid) without a principled reason grounded in the framework itself.
  *   **Why:** To avoid the "Frege-Kripke patchwork" where different semantic rules apply to different grammatical categories. The 2D apparatus should be the *engine* of meaning, not a specialized tool for natural kinds.

  **4. Rational Guidance (The Action Constraint)**
  *   **The Case:** A rational agent betting on whether the clear liquid in the lake is water before testing its chemical structure.
  *   **Requirement:** The **Primary Intension** must align with the agent's epistemic alternatives. It must represent the conditions under which the agent would apply the term *given a scenario considered as actual*. This intension must be what guides decision-making under uncertainty.
  *   **Why:** Semantics must interface with rationality. If the Primary Intension does not track what the speaker takes to be possible, it cannot explain linguistic behavior or inference.

  **5. Metaphysical Settling (The Counterfactual Constraint)**
  *   **The Case:** Asking "Could water have been XYZ?" after discovering water is H2O.
  *   **Requirement:** The **Secondary Intension** must represent the term's behavior across counterfactual worlds *considered as counterfactual*, holding the actual world's reference-fixing facts fixed.
  *   **Why:** To capture the modal profile of the world independent of our knowledge. This intension settles what is genuinely possible, distinct from what is merely conceivable.

  **6. The Provisional Hypothesis (The Discovery Constraint)**
  *   **The Case:** The period *during* scientific investigation, before "Water = H2O" is confirmed.
  *   **Requirement:** The theory must model the Primary Intension as sensitive to the agent's current information state. Before discovery, the Primary Intension of 'water' picks out whatever satisfies the phenomenal description (clear, drinkable liquid). After discovery, the Primary Intension is retroactively constrained or "screened off" by the empirical fact.
  *   **Why:** To account for the dynamics of learning. A static 2D semantics fails if it cannot represent the transition from "Water might be XYZ" (epistemically) to "Water is necessarily H2O" (metaphysically).

  ---

  ### II. Negative Constraints: Distinctions That Must Not Collapse

  An adequate theory must maintain the following distinctions without resorting to lexical ambiguity or category errors.

  **1. No Lexical Ambiguity**
  *   **Constraint:** The two intensions must be derived from a *single* semantic value. You cannot claim 'water' is ambiguous between a descriptive sense and a rigid designator.
  *   **Reason:** Ambiguity is a theoretical stopgap. 2D semantics claims to reveal the *structure* of meaning, not that words secretly have two definitions.

  **2. Epistemic vs. Metaphysical Modality**
  *   **Constraint:** The space of worlds evaluated by the Primary Intension (epistemic space) must be distinct from the space of worlds evaluated by the Secondary Intension (metaphysical space).
  *   **Reason:** If these collapse, you cannot distinguish "I don't know if P" from "P is contingent." The theory must allow for scenarios that are epistemically possible but metaphysically impossible (e.g., Water is XYZ).

  **3. Content vs. Actuality**
  *   **Constraint:** The Primary Intension cannot simply be "the extension in the actual world." It must be a function from *candidate actual worlds* to extensions.
  *   **Reason:** If the Primary Intension just outputs the actual extension, it becomes a posteriori by definition. It must evaluate how reference would be fixed *if* a different world turned out to be actual.

  ---

  ### III. Tensions and Incompatibilities

  Here we address the structural faults in the framework. Your suspicion is well-founded; there are pairs of desiderata that pull in opposite directions.

  **1. The Compositionality vs. Epistemic Transparency Tension**
  *   **The Conflict:** You desire a **Uniform, Compositional Treatment** (Desideratum 3) and **Rational Guidance/Epistemic Accessibility** (Desideratum 4).
  *   **The Problem:** To be knowable without empirical investigation (a priori), the Primary Intension usually needs to be descriptive (Fregean). However, Kripkean arguments suggest that the content of names and natural kinds is *not* descriptive but causal/historical. If you make the Primary Intension descriptive to satisfy epistemic accessibility, you violate the causal theory of reference (and thus fail the Metaphysical Settling constraint for names). If you make it causal to satisfy reference, it is no longer knowable a priori.
  *   **Verdict:** These are in genuine tension. Most 2D theories solve this by restricting the "a priori" status of the Primary Intension to *idealized* rational agents (Chalmers) or by treating the Primary Intension as a context-set update rather than pure meaning (Stalnaker). A fully compositional, psychologically realistic, a priori-accessible 2D semantics for *all* categories is likely impossible.

  **2. The "Killer" Requirement: The Contingent A Priori**
  *   **The Single Requirement:** The demand to validate **Contingent A Priori** truths (Desideratum 2) without collapsing content into context rules out the most otherwise attractive theories.
  *   **Why:** Standard possible worlds semantics (Lewis/Stalnaker) handles the Necessary A Posteriori well by distinguishing context and content. However, it struggles to make "I am here now" a matter of *content* rather than just *contextual fact*. To make it a priori, the 2D theory must treat the diagonal proposition (the Primary Intension) as the object of knowledge. This forces the theory to treat "actual" as an operator within the language, which complicates compositionality and often leads to over-generation of a priori truths. Many robust semantic theories fail here because they refuse to grant epistemic status to context-fixing stipulations.

  **3. Public Language vs. Individual Information**
  *   **The Choice:** This is the most critical fork in the road.
      *   **Public Language Semantics (Stalnakerian):** The 2D matrix represents the flow of information in conversation. The Primary Intension is about distinguishing contexts.
          *   *Non-Negotiable:* Metaphysical Settling and No Ambiguity.
          *   *Sacrifice:* Rational Guidance. The Primary Intension is not necessarily what is in the speaker's head; it is what is mutually presupposed.
      *   **Individual Information/Conceptual Role (Chalmersian):** The 2D matrix represents a single subject's epistemic space. The Primary Intension is the cognitive significance of the term.
          *   *Non-Negotiable:* Rational Guidance and Epistemic Accessibility.
          *   *Sacrifice:* Public Compositionality. If content is tied to individual epistemic states, two speakers can mean different things by 'water' depending on their knowledge, threatening the idea of a shared public language.
  *   **Recommendation:** If you want to explain *communication*, lean Stalnaker (but you lose the strong a priori claim). If you want to explain *thought and modality*, lean Chalmers (but you risk solipsism regarding meaning).

  ### Summary of Acceptance Criteria

  To accept a 2D theory, you should demand it answer this specific challenge:

  > "Show me how a single semantic value for the term 'water' allows a speaker to rationally doubt 'Water is H2O' (Primary Intension varies) while simultaneously asserting that 'Water is H2O' is metaphysically necessary (Secondary Intension constant), without claiming the word 'water' changes meaning during the discovery process, and without requiring the speaker to have implicit knowledge of microphysics."

  If the theory requires the speaker to have implicit microphysical knowledge to fix the Secondary Intension, it fails the **Rational Guidance** constraint. If it claims the word 'water' means something different before and after discovery, it fails the **No Ambiguity** constraint. If it treats 'water' differently than 'I', it fails the **Uniformity** constraint.

  Most existing theories fail at least one of these. Your suspicion that **Uniform Compositionality** and **Epistemic Accessibility** are incompatible is the dominant critique in the field (often leveled by critics like Soames or Beaney). A successful theory must explicitly state which of these it is weakening to save the other.
