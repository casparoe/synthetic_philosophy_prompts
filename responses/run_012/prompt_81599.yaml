answer: |-
  **Title:** The Consent Form
  **Format:** Monologue
  **Performer:** A weary individual addressing the audience.

  So, a demon pops round the other day. Not the horned, brimstone sort; more the caseworker type. Clipboard, sensible shoes, aura of mild threat. He says, 'I'd like to adjust your character.'

  I say, 'Adjust it how?'

  He says, 'So that you admire me.'

  I look him over. He's frightful. Like a tax return given legs. I say, 'But you aren't admirable.'

  He says, 'Irrelevant. You will be.'

  I say, 'Do I have a reason to let you do this?'

  He says, 'Yes. It suits you.'

  I say, 'That's a reason to *let* you do it. That's a reason for the action of consenting. Is it a reason for the attitude of admiration?'

  He says, 'No. That would require me to be admirable.'

  I say, 'So I have a reason to cause myself to have an attitude for which I have no reason.'

  He says, 'Precisely. It's a state-given reason for an object-given attitude.'

  I say, 'So once you've tweaked me, and I'm standing there beaming at you… do I still have that reason?'

  He says, 'No. Once you admire me, the reason vanishes. It was only for the process.'

  I say, 'So the reason is like scaffolding. You use it to build the state, then you knock it down.'

  He says, 'Except you become the scaffolding.'

  I say, 'So I'm rationally required to dismantle the very standards that allowed me to see the reason in the first place. I have to use my capacity for judgement to authorise my own incapacity for judgement.'

  He says, 'Only regarding me.'

  I say, 'But if I can't judge you fittingly afterwards, how do I know the adjustment worked? How do I know I'm not just broken?'

  He says, 'You won't care.'

  I say, 'But I care now. I'm the one signing the form.'

  He says, 'And you have a reason to sign.'

  I say, 'A state-given reason. A pragmatic shove. But I'm signing away the part of me that recognises pragmatic shoves as distinct from genuine warrant. I'm trading a reason to *act* for a loss of reason to *feel*.'

  He says, 'It's the Wrong Kind of Reasons problem. You're familiar?'

  I say, 'I'm living it. I'm standing in the gap between the reason to cause the belief and the reason for the belief, and it's draughty.'

  He says, 'Just sign.'

  I say, 'I can't. To sign is to act on a reason. But the action produces a state where that reason no longer applies. So I'm acting on a reason that proves itself obsolete upon success. It's a normative suicide note. "Dear Future Me, please ignore all evidence. Love, Past Me, who had an incentive." '

  He says, 'If you don't sign, I'll tweak you anyway.'

  I say, 'Then I have no reason to sign.'

  He says, 'You have a reason to avoid the coercion.'

  I say, 'That's another state-given reason! I'm drowning in reasons to cause states, and I haven't got a single reason for a state itself. I'm all engine and no steering wheel.'

  He sighs. He writes something on the clipboard. He says, 'Look. If you sign, you get to keep the distinction. If I tweak you, you lose it. You'll just admire me. You won't know there *is* a wrong kind of reason.'

  I say, 'So the only reason to sign is to preserve the ability to recognise that I shouldn't.'

  He says, 'Yes.'

  I say, 'That's an object-given reason.'

  He says, 'Finally.'

  I say, 'So I have a reason to refuse you, based on the value of having reasons.'

  He says, 'Which is a state-given reason for refusing.'

  I say, 'No, it's a reason about reasons. It's meta.'

  He says, 'It's still state-given. It's about the state of having reasons.'

  I say, 'Then every reason is state-given if you zoom out far enough.'

  He says, 'Don't zoom out.'

  I say, 'I can't help it. I'm a philosopher.'

  He says, 'I know. That's why I picked you. You're the only one who'd argue about the form while the demon eats your soul.'

  I look at the pen. I look at him. I realise the trap isn't the adjustment. The trap is the paperwork.

  I say, 'If I sign, I become someone who admires you without reason. If I don't, I remain someone who sees the reason but can't act on it without becoming the former.'

  He says, 'Yes.'

  I say, 'So the rational thing to do is…'

  He says, 'There isn't one. That's the point.'

  I put the pen down.

  I say, 'Right. I'll stay irrational. At least I know I'm doing it.'

  He ticks a box. 'Suit yourself. But you've got a reason to reconsider.'

  I say, 'I know. It's the wrong kind.'

  **Tag:** It turns out the only thing harder than believing a lie is having a valid argument for why you shouldn't.
