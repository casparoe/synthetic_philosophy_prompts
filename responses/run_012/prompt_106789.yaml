answer: |-
  ### Brainstorming: Causal Difference vs. Collective Complicity

  Before diagnosing the argument, it is crucial to distinguish the two moral mechanisms at play here.

  1.  **Making a Causal Difference (Difference-Making):** This view is rooted in **consequentialism** and counterfactual theories of causation. An act is wrong because it *brings about* a bad state of affairs that would not have existed otherwise (or makes it significantly more likely). The focus is on the *outcome*. The metaphysical question is: "But for this act, would the harm have occurred?"
  2.  **Participation in Wrongful Practice (Complicity):** This view is rooted in **deontology** or **virtue ethics**. An act is wrong because it aligns the agent's will with a wrongful project, regardless of the marginal causal impact. The focus is on the *relationship* between the agent and the harm. The metaphysical question is: "Did this agent join a group intending harm?"

  The tension in your friend's argument arises because Premise (1) commits you to the first view (Difference-Making), while Premise (6) relies on an intuition often driven by the second view (Complicity). To keep (1), you must show that individual acts in collective harms *do* satisfy the difference-making condition, thereby bridging the gap without invoking a separate principle of complicity.

  ***

  ### Diagnosis of the Argument

  The argument is **valid**. If (1) is true, and (2) is true, then (3) follows logically. If (3) generalizes to (5), and (6) asserts (5) is false, then (1) must be rejected.

  Since you wish to retain Premise (1)—the intuition that wrongness is tied to making a difference or raising probability—you must **reject Premise (2)**.

  Premise (2) claims: *"In a large-scale collective harm, no individual act meets that condition [making a difference or raising probability]."*

  This premise relies on a specific model of collective harm: **linear overdetermination**. It assumes that harms are aggregated like sand grains where removing one grain never stops an avalanche, and that we have metaphysical certainty that the threshold has already been met by others.

  ### Rejecting Step (2): The Probabilistic Threshold View

  To save (1), you must argue that individual acts in climate change, meat consumption, and voting *do* raise the probability of harm in a way that matters. You reject the claim that these cases are structurally identical to the stipulated hitman case.

  #### 1. The Disanalogy: Certainty vs. Uncertainty
  The hitman case is a **philosopher's fiction** constructed to eliminate causal efficacy. It stipulates *ex post* certainty: "He would have acted even if..." This is a case of **determinate overdetermination**.

  Real-world collective harms (climate, meat, voting) are cases of **probabilistic thresholds**.
  *   **Voting:** Elections are often decided by narrow margins. While your vote is unlikely to be decisive, the probability is non-zero. If the expected value of the outcome is high enough (e.g., preventing a harmful policy), the *expected utility* of voting is significant.
  *   **Meat/Climate:** Supply chains operate on thresholds. A grocery store does not order one chicken per customer; they order in batches. However, over time, reduced demand triggers a reduction in supply. While one purchase rarely cancels a specific order *today*, it contributes to a data point that influences future ordering *probabilities*.

  In these real-world cases, we lack the God's-eye view stipulated in the hitman case. We do not know if we are the "tipping point" contribution. Therefore, from the agent's perspective, the act **raises the expected probability of harm**.

  #### 2. Saving Premise (1) for Climate, Meat, and Voting
  If we interpret "raises the probability... in a way that matters" in Premise (1) as **Expected Utility**, then (1) remains true and (2) becomes false for these cases.

  *   **The Math:** Even if the probability of your single act being the threshold-crosser is 1 in 1,000,000, if the harm caused is massive (e.g., significant suffering or climate damage), the *expected disvalue* (Probability × Magnitude of Harm) can be substantial.
  *   **The Conclusion:** Your individual emission or meat purchase is wrong *because* it imposes a risk of harm that has a non-zero expected negative value. You are making a causal difference to the *expected* outcome, even if you don't make a difference to the *actual* outcome in every specific instance.

  This saves (1). You don't need to appeal to complicity; you simply need a more sophisticated account of "probability" than the one offered in Premise (2).

  ### The Cost of This Move

  Rejecting (2) to save (1) comes with three significant philosophical costs:

  **1. Wrongness becomes Epistemic, not Metaphysical**
  If you ground the wrongness in "raising the probability," you are grounding it in the agent's *evidence*, not the objective state of the world.
  *   *Cost:* Two agents perform the exact same act (sending a dollar to the hitman). Agent A doesn't know the hitman is already funded; Agent B knows the hitman is already funded.
  *   *Implication:* Under this view, Agent A acts wrongly (raises epistemic probability), but Agent B might not (if they know the probability is objectively zero). This makes moral wrongness partially dependent on ignorance. Many philosophers find this counterintuitive; they prefer that if the act is objectively redundant, it is objectively innocent.

  **2. The Problem of "Known Redundancy"**
  What if we *do* know a contribution is redundant? Suppose a climate policy is already passed, and your vote was mathematically unnecessary. Or suppose you know the hitman has the money.
  *   *Cost:* If you strictly keep (1) as a *causal* principle, you must admit that **knowingly redundant contributions are not wrong.**
  *   *Mitigation:* You might argue that knowingly joining a wrongful project *does* raise the probability of *future* harms (normalizing the behavior, encouraging others), thus satisfying (1) indirectly. But this requires empirical work to prove that your redundant act actually influences others.

  **3. Moral Luck**
  By focusing on expected probability, you accept that moral assessment is a matter of risk imposition.
  *   *Cost:* An individual who buys meat and *happens* to trigger an extra order is causally responsible for a death. An individual who buys meat and *happens* not to trigger an order is not. If wrongness is tied to actual difference-making, the first is worse than the second. If wrongness is tied to expected probability, they are equally wrong. To save (1) consistently, you must commit to the **Expected Utility** view, meaning they are equally wrong. This requires abandoning the intuition that actual harm causation is the only thing that matters.

  ### Summary Recommendation

  To maintain your commitment to Premise (1):

  1.  **Reject Premise (2).** It falsely generalizes from a rigged case of overdetermination (the hitman) to real-world cases of probabilistic thresholds (climate/meat/votes).
  2.  **Clarify Premise (1).** Interpret "raises the probability" as **Expected Utility** based on the agent's epistemic state, not objective metaphysical chance.
  3.  **Accept the Disanalogy.** The hitman case is disanalogous because it stipulates *certainty* of redundancy. In climate and meat cases, *uncertainty* prevails.
  4.  **Pay the Cost.** Accept that moral wrongness in these cases is about **risk imposition** and **expected harm**, not guaranteed causal outcomes.

  This allows you to say: "Individual acts *are* wrong (contra 3 & 5), precisely *because* they make a difference to expected harm (pro 1), and the claim that they don't is false for real-world cases (contra 2)." You preserve the causal intuition without denying the wrongness of collective participation.
