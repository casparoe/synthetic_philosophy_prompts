answer: |-
  **Dana:** Okay, look at the Maya. Classic case. The courts vanish, the monuments stop, the long-distance trade networks snap. That's capacity loss. Fast and sticky.

  **Marcus:** The courts vanish. The farmers? They kept farming. They just stopped paying tribute to kings who couldn't deliver rain. You're calling a change in management a "collapse" because you miss the pyramids.

  **Dana:** It's not just management. The irrigation systems fell into disrepair. That's infrastructure anyone used. Security dropped. If you can't do the things you used to do, you've collapsed.

  **Marcus:** Whose "you"? The state isn't the population. Now take the Soviet Union. The Party collapsed. The KGB went home. Millions were relieved. Was that a collapse, or a liberation?

  **Dana:** Life expectancy dropped ten years overnight. Infrastructure rotted. The ability to feed and heat people vanished. That's a functional loss, top to bottom.

  **Marcus:** For some. Oligarchs did fine. You're shifting ground. First, you're talking about states—Maya kings, Soviet Party. Now you're talking about welfare metrics. Which unit is collapsing? The government or the people?

  **Dana:** The system that sustains the people.

  **Marcus:** There it is. You swap "state" for "society" whenever the state dies but people survive, like the Maya farmers. Then you swap to "economy" when the state dies and people suffer, like in the nineties. You're changing the target to keep the word "collapse" alive.

  **Dana:** Fine. If a society voluntarily simplifies—say, a community chooses local trade over empire to avoid maintenance costs—complexity drops, but I wouldn't call that collapse. It's a choice. Capacity is retained, just unused.

  **Marcus:** Okay, I'll give you this: The Bronze Age. Palaces burn, literacy vanishes, pottery quality tanks. Even the farmers starve. Everyone loses. My "who lost what" trick doesn't work there because the baseline drops for the whole floor.

  **Dana:** Exactly.

  **Marcus:** But that doesn't prove "collapse" is a thing we can measure objectively. It just proves suffering is real. You still haven't told me what the unit is. Is it the number of pottery styles? Is it caloric intake? If I say the Soviet Union didn't collapse because the *people* survived and gained rights, and you say it did because *heating* failed, we aren't arguing history. We're arguing definitions.

  **Dana:** We're arguing whether capacity is real. If you can't build what you built before, something broke.

  **Marcus:** Or something changed. You want "collapse" to be a physical event like an earthquake. It's not. It's a judgment.

  **Dana:** Then tell me why the Bronze Age feels different than the Soviet Union.

  **Marcus:** Because you want it to.

  **Dana:** No. Because the loss was total.

  **Marcus:** Then say "total loss." Don't say "collapse." That word carries a moral weight you haven't earned.

  **Dana:** And "transition" carries a moral weight you haven't earned either.

  *(Silence. They stare at each other.)*

  **Marcus:** So we're stuck on whether "capacity" is neutral.

  **Dana:** We're stuck on whether you think history is just stories.

  **Marcus:** I think it's only stories if you refuse to say who's telling them.

  **Dana:** Then tell me who tells the story of a starving farmer.

  **Marcus:** He doesn't. You do.

  ***

  **Note on the Debate:**
  The core disagreement they narrowed down to is **ontological vs. historiographical reality**. Dana argues that "capacity" (the ability to build, feed, organize) is an objective metric that can disappear regardless of who is telling the story. Marcus argues that labeling that disappearance "collapse" is always a narrative choice that imposes a value judgment on that loss.

  **Who is winning?** Dana has the stronger position for this specific assignment. While Marcus is correct that "collapse" is a loaded term, Dana successfully demonstrated that functional loss (life expectancy, infrastructure, caloric intake) is measurable independent of elite narratives. Marcus was forced to concede the Bronze Age case where "who lost what" didn't rescue his argument because *everyone* lost. Dana's definition holds up under the "fast and sticky" criteria better than Marcus's relativism, which struggles to explain universal systemic failure without dismissing the suffering as merely a "story."
