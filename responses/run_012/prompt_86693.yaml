      *   *Counter Point 2 (Elites):* Elected elites are *permanent* elites with donors to please. Random citizens return to anonymity. Staffers influence both, but staffers know elected members need money/votes next year; they know random citizens just need to understand the bill.
      *   *Counter Point 3 (Accountability):* Accountability to voters is actually accountability to donors and party machines who secure re-election. "Answering to nobody" means answering to their own conscience and the public good as they see it, not a fundraising target. The lack of career ambition is the feature, not the bug.
      *   *Core Theme:* Elections create a class of professionals dependent on external support. Sortition creates a temporary jury independent of future consequences.

