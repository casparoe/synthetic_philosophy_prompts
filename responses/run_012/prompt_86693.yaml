  5.  **Refining for Flow and Impact:**
      *   Make it tighter. Ensure the "career" argument shines through as per the prompt's instruction ("your case rests less on the wisdom of random citizens than on the corruptions of elected ones").
      *   Ensure the "invisible elite" point is addressed directly.

      *Revised Draft:* You are correct that the power to frame is potent, but you underestimate the power of a jury that cannot be bribed with the promise of a future career. I concede that staffers and lobbyists will attempt to influence this body, yet their leverage evaporates when the members hold no office to protect and seek no re-election; an influencer cannot threaten to fund a primary opponent against a citizen who returns to anonymity in twelve months. You argue they answer to nobody, but I contend that elected officials answer only to the donors and party machines that secure their retention, whereas a random sample answers to their own conscience and the immediate evidence before them. The improvement lies not in assuming these citizens are geniuses, but in recognizing that the elected house is composed of professionals selected for their ability to sell themselves, while the lottocratic chamber is composed of amateurs selected for their inability to be bought with political capital. By removing the career ladder, we remove the rung upon which special interests climb to own the legislator, ensuring that when legislation is sent back, it is because it fails the test of public sense rather than the test of partisan advantage.

