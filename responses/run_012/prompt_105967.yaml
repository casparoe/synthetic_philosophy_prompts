  2.  **Deconstruct the Philosophical Concepts:**
      *   **Transworld Identity (Kripke):** You are identical to yourself in other possible worlds. If you could have been a baker, *you* (this very person) are a baker in some world.
      *   **Counterpart Theory (Lewis):** You are world-bound. You exist only here. "You could have been a baker" means "There is a counterpart of you in another world who is a baker." Counterparts are based on similarity, not identity.
      *   **Key Feature 1 (Non-transitivity):** A's counterpart is B, B's counterpart is C, but C might not be A's counterpart. Drift.
      *   **Key Feature 2 (Consolation/Regret):** If I say "You could have been happy," the counterpart theorist says "No, *you* are stuck here. But someone similar to you is happy over there." This changes the emotional weight.

