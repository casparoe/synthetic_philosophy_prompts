answer: |-
  ## The "Break & Own" Triage Protocol

  This procedure is designed to take less than two minutes. It is not a policy document; it is a flowchart for your brain before you hit "Enter." It operationalizes your two principles: **Understanding** (can you break it?) and **Debt** (who relies on this?).

  ### The Compliance Gate (Hard Stop)
  **Before asking the three questions, ask this:**
  *Does this output touch a member directly (letters, emails, portal) or touch pricing/actuarial filings?*
  *   **YES:** This **must** go to Compliance for sign-off. AI can draft, but it cannot sign. This automatically places the task in **Bucket 2** (Own the Reasoning) at a minimum.
  *   **NO:** Proceed to Question 1.

  ---

  ### The Three Questions

  **Q1: The Dependency Check (Explanation Debt)**
  *If this output is wrong, does it break someone else's work, become a permanent rule, or become a premise for a future decision?*
  *   **Yes:** You incur Explanation Debt. You must be able to explain the *why*, not just show the *what*. (Moves toward Bucket 2).
  *   **No:** It is disposable or self-contained. (Moves toward Bucket 1).

  **Q2: The Breakability Check (Understanding)**
  *Can you describe one specific way this answer could be wrong, or predict how the answer changes if you change one input (without running it first)?*
  *   **Yes:** You understand the mechanism. (Green light for AI assistance).
  *   **No:** You are treating the AI as an oracle. You have the output, not the thing. (**Hard Stop → Bucket 3**).

  **Q3: The Values Check (Judgment Call)**
  *Does this task require weighing competing goods (e.g., cost vs. care, strictness vs. empathy) or interpreting ambiguity where "correct" is a matter of policy, not fact?*
  *   **Yes:** This is a human judgment. AI can provide options, but cannot decide. (**Handoff to Human**).
  *   **No:** This is a factual or procedural task. (Proceed to Bucket Assignment).

  ---

  ### Bucket Assignment

  *   **Bucket 1 (Take & Spot-Check):** Q1=No, Q2=Yes.
      *   *Action:* Use AI output. Verify with a quick sanity check (e.g., run a count, read for tone).
      *   *Example:* Internal email draft, exploratory data query.
  *   **Bucket 2 (Take & Own Reasoning):** Q1=Yes OR Compliance Gate=Yes. Q2=Yes.
      *   *Action:* Use AI output. You must document *why* it is correct (e.g., "I validated the SQL logic against schema X," "I checked this denial reason against policy clause Y"). You discharge the debt.
      *   *Example:* Production SQL, Member-facing letters (with Compliance), A/B test sizing.
  *   **Bucket 3 (Don't Use AI):** Q2=No OR Q3=Yes (for final decision).
      *   *Action:* Do not use AI for the core logic/decision. You may use it for background research only.
      *   *Example:* New model methodology, clinical diagnosis, policy interpretation.

  ---

  ### Honesty About Judgment Calls
  This procedure pretends to be rigid, but three parts rely on human honesty:
  1.  **Q2 (Breakability):** A team member can lie and say "Yes, I know how to break this" when they don't. This procedure relies on a culture where admitting "I don't know" is safe.
  2.  **Q1 (Dependency):** "Routine" is a dangerous word. If a routine pull suddenly feeds a new report, the Debt changes. The user must recognize context shifts.
  3.  **Compliance Gate:** Compliance rules change. The team must know the current threshold for "pricing" or "member-facing."

  ---

  ### Running the Cases

  Here is how the procedure sorts your three specific scenarios.

  #### Case A: Generating SQL for Routine Monthly Claims Extract
  *   **Compliance Gate:** No (Assuming internal operational data, not regulatory filing).
  *   **Q1 (Dependency):** **Yes.** Downstream dashboards and financial reports rely on this data. If the SQL is wrong, the numbers are wrong for everyone. Explanation Debt incurred.
  *   **Q2 (Breakability):** **Yes.** "If I change the date range, the row count should drop. If I join the wrong table, I'll get nulls on member IDs." The team can verify this with `COUNT(*)` checks against last month.
  *   **Q3 (Values):** **No.** This is logic and syntax.
  *   **Result:** **Bucket 2 (Take & Own Reasoning).**
  *   **Why the team might grumble:** They want this in Bucket 1 (Spot-Check) because it's "routine." But because the output becomes a premise for other work (Debt), they must document the validation (e.g., "Checked row counts vs. prior month within 5% variance"). They cannot just paste the code and run it.
  *   **Procedure Note:** If this were *exploratory* SQL (not feeding downstream reports), it would fall to Bucket 1.

  #### Case B: Drafting the Denial Reason a Member Will Read
  *   **Compliance Gate:** **YES.** Member-facing.
  *   **Q1 (Dependency):** **Yes.** The member relies on this to decide whether to appeal. Legal relies on it to avoid litigation.
  *   **Q2 (Breakability):** **Yes.** "If the policy code changes, the reason must change. If the clinical evidence is stronger, the tone should soften."
  *   **Q3 (Values):** **Yes.** Tone, empathy, and the decision to deny are value-laden.
  *   **Result:** **Bucket 2 (Take & Own Reasoning) + Compliance Sign-off.**
  *   **The Handoff:** AI can draft the text, but the Human must make the final decision on the *denial itself* (Q3 Values Check). The Human owns the reasoning ("Denied based on Clause 4.2, not cost").
  *   **Why the team might grumble:** They want to offload the emotional labor of writing these. The procedure says they can offload the *typing*, but not the *responsibility*. They must read every word and certify it matches the policy.

  #### Case C: Choosing the Method for a New Risk-Adjustment Model
  *   **Compliance Gate:** **YES.** Pricing/Regulator.
  *   **Q1 (Dependency):** **Yes.** High Debt. Premiums and reserves rely on this.
  *   **Q2 (Breakability):** **No.** (Crucial Failure Point). Your team has no formal stats training. Can they articulate how the model breaks if the regularization parameter changes? Can they say what evidence would overturn the choice of XGBoost over GLM? If they cannot, they fail Q2.
  *   **Q3 (Values):** **Yes.** Risk tolerance is a business value, not a fact.
  *   **Result:** **Bucket 3 (Don't Use AI).**
  *   **The Hard Truth:** This is the thing everyone wants to offload. It is the most dangerous to offload. The AI can summarize the literature (Bucket 1), but it cannot *choose the method*.
  *   **Why the team will hate this:** This is the highest-leverage use of AI in their eyes ("Do the hard math for me"). The procedure forbids it because they cannot satisfy the "Understanding" principle. They cannot be wrong on purpose because they don't know how the machine works.
  *   **Required Action:** This requires a human with formal stats training or an external actuary. The AI can be used to draft the *documentation* of the choice, but not make the choice.

  ---

  ### What This Procedure Cannot Do

  **1. It cannot detect "Plausible Hallucinations" in high-stakes contexts.**
  If the AI writes SQL that runs without error but joins the wrong table (logically valid, factually wrong), Q2 (Breakability) relies on the human knowing *which* table to check. If the human doesn't know the schema well enough, they will fail Q2 but might lie to get the task done.
  *   **Override Situation:** When the team member is new or the data schema has recently changed. In this case, upgrade Bucket 1 tasks to Bucket 2 temporarily.

  **2. It cannot resolve "Values" conflicts.**
  Q3 hands the decision to a human, but it doesn't tell the human *what* to decide. If the AI suggests a denial reason that is legally safe but empathetically brutal, the procedure says "Human Decide." It does not solve the moral distress of making that call.
  *   **Override Situation:** When the team is burned out. If they are making too many value-judgment calls (Case B), the procedure won't stop them from becoming desensitized. You need staffing or policy changes, not a triage protocol.

  **3. It assumes "Understanding" is binary.**
  The procedure treats "Can you break it?" as a Yes/No question. In reality, understanding is a spectrum. A team member might understand 80% of the SQL but miss a edge case.
  *   **Override Situation:** Peer Review. For any Bucket 2 task, require a second pair of eyes. The procedure is individual; safety is collective. If one person says "I understand," a second person should ask "How would you break it?" to verify.

  **4. It creates a "Compliance Bottleneck."**
  By flagging all member-facing/pricing work for Compliance, you may slow down operations. Compliance will not read philosophy, but they will reject AI-generated text that lacks a human owner.
  *   **Override Situation:** Emergency regulatory changes. You may need a pre-approved "AI-Drafting Protocol" where Compliance signs off on the *prompt and validation process* once, rather than every individual letter.

  ### Final Instruction to the Team
  " If you cannot answer Question 2 ('How could this be wrong?'), you are not an analyst using a tool; you are a data entry clerk for a black box. In this company, we do not pay analysts to be data entry clerks for black boxes. If you hit Bucket 3, your job is not to fight the procedure, but to tell me what training or hiring we need to move that task into Bucket 2."
