answer: |-
  Here is the breakdown of how she's likely to rule, the judicial "rule" she's actually running, and how to test it.

  ### The Prediction
  She is going to rule against the employer. She will likely hold that **technical impossibility is not a legal defense.** If the tool cannot generate the "principal factors" in a way that satisfies the statute, the employer cannot use the tool for hiring in this state. She won't accept the "weight dump" as compliance because it defeats the statutory requirement of disclosure.

  ### The Two Rules
  Here is how the two philosophies you identified would handle the black-box problem:

  **1. The Literal Rule ("Read the words")**
  *   **Logic:** The statute says "give the score and the principal factors." It does not explicitly say "explainable factors" or "human-readable factors."
  *   **Prediction:** The vendor dumps the feature weights. That constitutes "factors." The employer handed them over. The statutory text is satisfied. The fact that the applicant can't understand them is unfortunate, but the law doesn't guarantee understanding, only disclosure. Case dismissed.
  *   **Outcome:** Employer wins (technically compliant).

  **2. The Purposive Rule ("Read for the goal")**
  *   **Logic:** The law was obviously enacted to prevent black-box discrimination and allow applicants to challenge bad decisions. A dump of 1,000 weights achieves zero transparency.
  *   **Prediction:** "Principal factors" implies factors that actually explain the decision. If the technology cannot produce an explanation, it cannot be used to make a decision. The employer is liable for using a non-compliant system.
  *   **Outcome:** Employer loses (system banned or violation found).

  ### Which Rule Fits Her Prior Calls?
  She is running the **Purposive Rule**, but she dresses it up in Textualist clothing. She interprets the text broadly to ensure the *purpose* (applicant transparency) isn't evaded by technicalities or corporate structures.

  *   **Call 1 (Keyword Filter):** A Literalist might argue a simple `if/then` script isn't an "automated decision system" (implying AI). She ruled it *is*. **Fits Purpose:** Transparency applies to all automation, not just "smart" tech.
  *   **Call 2 (Trade Secrets):** A Literalist might look for an exception clause for IP. There wasn't one, so she ruled for disclosure. But a savvy Literalist might argue "property rights" are presumed. She prioritized the statutory right to know over the vendor's property right. **Fits Purpose:** The applicant's right to know trumps the vendor's profit model.
  *   **Call 3 (Staffing Agency):** A Literalist might argue the employer didn't "use" the software; the agency did. She ruled the employer "uses" it because they benefit from it. **Fits Purpose:** You can't outsource liability to evade the law.

  **Verdict:** In all three, she closed loopholes that would have undermined the law's goal. In the new case, "technical complexity" is just the next loophole. She will crush it. She will rule that compliance is a **condition of use**: if you can't explain it, you can't deploy it.

  ### The Fourth Case (The Wedge)
  To force the two rules apart, you need a scenario where following the text *exactly* defeats the purpose, or where serving the purpose requires ignoring the text.

  **The Scenario:**
  An applicant requests the factors, and the employer provides a perfect, plain-language explanation of the top three factors (e.g., "You lacked 5 years of Java experience"). However, the applicant later proves the model *actually* relied heavily on a fourth, undisclosed factor (e.g., "zip code"), which was suppressed from the report because it wasn't in the "top three."

  **The Conflict:**
  *   **The Text:** The law says disclose the "principal factors." If the employer discloses the top three weights, they have followed the text. The law doesn't explicitly say "all material factors" or "the true causal factors."
  *   **The Purpose:** The goal is to let the applicant understand *why* they were rejected. If the report lies by omission, the purpose is defeated.

  **The Test:**
  *   **If she rules for the Employer:** She is a **Literalist**. They gave the "principal" (top ranked) factors as defined by the system. The text is satisfied.
  *   **If she rules for the Applicant:** She is a **Purposivist**. She will rule that "principal factors" means "factors that materially affected the outcome," regardless of how the vendor ranks them internally. She will prioritize the *truth* of the explanation over the *mechanics* of the disclosure.

  Given her track record, bet on her ruling for the Applicant. She's treating the statute as a shield for the worker, not a checklist for the vendor.
