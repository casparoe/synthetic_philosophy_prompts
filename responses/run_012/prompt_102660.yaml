          *   *Why:* The user works in policy forecasting. Most policy events fall under (4) (unique, no objective chance). Therefore, per (4), forecasts are "expression of opinion." But per (3), "importing prior probabilities... undermines objectivity." If the user's output is "opinion" (per 4), it lacks the "objectivity" protected by (3). The user wants to defend their practice. If they admit (4), they admit their forecasts aren't "scientific inference" in the sense of (3).
