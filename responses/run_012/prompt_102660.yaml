          *   To fix (3)/(4): Drop the ban on priors (3) for the policy domain. Accept that policy forecasting is Bayesian by necessity.
          *   To fix (1)/(4): Clarify the physical vs. epistemic distinction.

  6.  **Refining the "Least Costly Repair":**
