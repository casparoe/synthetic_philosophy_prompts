      *   *Commitment 3 (Frequentist Inference):* Methodological/Epistemic claim. Statistical inference relies *only* on long-run frequencies. Priors are banned. Objectivity = freedom from subjective input.
      *   *Commitment 4 (Unique Event Anti-Realism):* Metaphysical/Epistemic claim. No objective chance for unique non-chancy events (policy). Credence here is subjective.

