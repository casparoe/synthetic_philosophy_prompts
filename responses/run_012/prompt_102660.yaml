      *   **Critical Conflict 4: Principal Principle (2) vs. The Rest.**
          *   (2) bridges (1) and Credence. It works fine for atoms. It creates a gap for policy (since no chance exists, PP is silent). This leaves policy credence unanchored.
          *   *Severity:* **Low/Moderate.** It highlights the gap between "science" and "forecasting."

  5.  **Drafting the Audit:**

