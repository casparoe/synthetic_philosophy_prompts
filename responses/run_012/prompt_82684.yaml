answer: |-
  You know how philosophers love their thought experiments, those clean little rooms in the mind where nothing ever gets dirty? Well, the city of Veridia tried to build one. For forty years, they ran their budget using what they called the Equalis Protocol. It was pure Harsanyi. Every citizen would step into a booth, slip on a neural crown, and for ten minutes, the system would scrub away their memory of who they were. You wouldn't know if you were rich or poor, healthy or sick, talented or struggling. You only knew you were a citizen. Then, you'd vote on the city's resource allocation. The logic was elegant. If you had an equal chance of being anyone, rational self-interest dictated you'd maximize the average utility. You'd vote for a society that was good on average, because statistically, that's where you'd end up. It worked beautifully. The budget always balanced, the safety nets held, and the wealthy didn't revolt because, behind the veil, they couldn't be sure they wouldn't wake up needing that safety net.

  But then came Year Forty-One and the glitch they called the Flash.

  It happened during the autumn budget cycle. The neural crown was supposed to wipe identity data completely before presenting the policy options. Instead, for about three seconds, the wipe stuttered. Citizens reported seeing a brief holographic overlay before the white noise took them. It showed their actual social credit score, their health status, and their utility ranking relative to the rest of the city. Just a flash, gone before the vote began, but the memory stuck. They walked into the booth knowing the theory—they knew they were supposed to pretend they were anyone—but they walked out knowing exactly who they were.

  Let me tell you about Elias. He's a sanitation engineer, good man, keeps the lower districts running. Under the old protocol, Elias would vote for higher infrastructure spending. Why? Because behind the veil, he might be the guy needing the new water filters. But that year, Elias saw the Flash. He saw his ranking: bottom decile. He knew, with absolute certainty, that he was not the CEO, not the surgeon, not the heir. He was the guy breathing the exhaust. When the screen asked him to choose between surplus storage for the wealthy investors or immediate grid repairs for the lower districts, the math changed. Behind the veil, maximizing average utility meant some surplus storage was okay to keep the economy humming. But knowing he was Elias, the sanitation engineer, average utility looked a lot like sacrifice. It looked like telling him to wait his turn while the top percentile compounded their gains.

  He voted for the repairs. All of them. He voted to drain the surplus.

  He wasn't alone. The Flash created a strange kind of collective lucidity. The wealthy saw their rankings and suddenly found themselves voting against redistribution, something they'd happily approved when they thought they might be poor. The poor saw their rankings and stopped compromising. They stopped voting for the average and started voting for themselves. The elegant curve of the utilitarian agreement shattered. It turns out, the veil of ignorance wasn't just a procedural step; it was the glue. Once you know you're the one bleeding, you don't care about the statistical average. You care about the止血带.

  The results came in at midnight. The Equalis AI, designed to aggregate preferences based on the assumption of ignorance, threw an error. It couldn't reconcile the data. The budget didn't balance because the sum of individual rationalities no longer equaled the collective good. The rich wanted to keep capital, the poor wanted immediate consumption, and the middle class was terrified of falling either way. The average expected utility plummeted, not because the resources changed, but because the trust in the randomness had vanished.

  So, what did Veridia do? They couldn't just patch the software and pretend it didn't happen. You can't un-know who you are. The city council convened an emergency session, and here is the part that really sticks with me. They didn't fix the Flash. They kept it. They realized that the Harsanyi model only works if you maintain the illusion. Once the illusion was broken, the agreement lost its grip. You can't force people to act as if they are random variables when they know they are specific entities.

  Instead, they moved to what they called the Transparent Bargain. No more veils. No more pretending. Every year, the identities are public. The rich know they are rich, the poor know they are poor, and they sit down at a table to haggle. It's messier. It's louder. There are strikes now, and lobbying, and sometimes the budget doesn't pass for weeks. But there's an honesty to it that the Veil lacked. The Veil was a kind of benevolent coercion, forcing people to be altruistic by hiding their self-interest. The Transparent Bargain admits that self-interest is the engine of politics.

  Elias told me he misses the quiet of the booth sometimes. There was a peace in not knowing, a sense of unity with the stranger you might have been. But he says he sleeps better now. When he votes for the grid repairs, he knows it's because he fought for them, not because a computer told him it was statistically probable he'd need them. The city lost the elegance of the theorem, the clean mathematical guarantee that everyone would agree. But they gained something else. They stopped trying to be a single mind maximizing a function and accepted that they were a thousand different minds trying to share a room. The agreement didn't hold, not really. But what replaced it was real. It wasn't a simulation of justice anymore. It was just politics, raw and unfiltered, and for all its noise, it was the first time the city felt awake.
