  I'm a science journalist working on a featre about Harsanyi's aggregation theorem—teh idea that if you had to choose the rules for a society without knowing which person you'd end up being, and you assumed an equal chance of being anyone, you'd end up maximizing average expected utility. I want to commission a short story that dramatizes a wrinkle in that setup. Here's the wrinkle: imagine a city that actually runs its budget this way, with an AI that simulates the veil of ignorance every year. But a bug means citizens get a brief flash of their actual identity and their actual utility ranking before they vote on the budget. They still remember the original equal-chance agreement. Does the agreement still have any grip on them, and what does the city do when it doesn't? Write the story, maybe 800-1200 words. No headings, bullet points, bold text, or tables, please—just continuous prose, like you're telling it to a friend over coffee. And no citations or reading lists; I just want the narrative.
