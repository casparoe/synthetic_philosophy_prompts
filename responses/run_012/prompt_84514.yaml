answer: |-
  This is an excellent set of questions. You have correctly identified the tension between a clean mathematical result and the messy reality of human psychology and non-standard decision models. Your suspicion is well-founded: you are overextending the scope of Good's Theorem.

  The confusion stems from treating Good's Theorem as a universal law of rationality, rather than what it actually is: a consistency result within a specific formal framework (Bayesian Subjective Expected Utility). When you step outside the axioms of that framework, the theorem no longer holds.

  Here is a diagnosis of your framing, a clarification of the theorem's assumptions, and an evaluation of your three cases.

  ### 1. Diagnosing Your Confusion

  You are making two category errors regarding what Good's Theorem proves.

  **Error A: Ex-Ante Expectation vs. Ex-Post Reality**
  Good's Theorem claims that the *expected* value of information (calculated *before* you receive it) is non-negative. It does **not** claim that information will never make you worse off *after* you receive it.
  *   **Example:** You buy a lottery ticket. The *expected* value might be positive (in a hypothetical favorable lottery), but if you lose, you are worse off. Similarly, information might reveal a terrible truth that forces you to take a costly action you were previously ignoring. Good's Theorem says that *before* looking, you should expect to be better off (or equal) because you have the option to act on that truth. It does not guarantee you will be happy with the news.

  **Error B: Instrumental vs. Intrinsic Value**
  This is the more critical error for your cases. Good's Theorem assumes information has **purely instrumental value**.
  *   **The Assumption:** Your utility function is defined over *world states* and *actions* (e.g., "I am healthy," "I took the medicine"). It is **not** defined over your *epistemic state* (e.g., "I know I am sick").
  *   **The Implication:** The theorem assumes that knowing a fact does not, in itself, change your utility. It only changes your utility by allowing you to choose a better action. If knowing a fact makes you depressed, anxious, or ruins a surprise, your utility function depends on your state of knowledge. This violates the standard assumptions required for Good's Theorem.

  ### 2. What Good's Theorem Actually Proves (and Assumes)

  To be precise, Good's Theorem holds if and only if the agent satisfies these conditions:
  1.  **Bayesianism:** Beliefs are represented by a single prior probability distribution and updated via Conditionalization.
  2.  **Expected Utility Maximization:** The agent chooses actions to maximize expected utility relative to current beliefs.
  3.  **State-Independent Utility:** The utility of an outcome depends on the state of the world and the action taken, but *not* on the signal received or the resulting belief state. (Information has no consumption value or disvalue).
  4.  **Costless Information:** The theorem applies to the informational value itself. (Costs can be added, but the core theorem is about the value of the signal).

  If any of these assumptions fail, the expected value of information can be negative.

  ### 3. Evaluating Your Three Cases

  Let's apply these criteria to your examples.

  #### Case 1: Genetic Testing (The "Right Not to Know")
  *   **Verdict:** The theorem **does not address this case** (Assumption 3 violated).
  *   **Analysis:** In the standard Good's Theorem framework, the outcome is "Health Status." In your roommate's case, the outcome is effectively "Health Status + Psychological Burden of Knowledge."
  *   If a patient declines testing, it is because the utility of $U(\text{Healthy}, \text{Know})$ is lower than $U(\text{Healthy}, \text{Not Know})$. Because the utility function depends on the *knowledge state*, information has **intrinsic disvalue**. Good's Theorem explicitly assumes information has no intrinsic value (positive or negative).
  *   **Rationality:** Within a broader decision-theoretic framework that allows utility over belief states, declining the test is perfectly rational. Good's Theorem does not rule this out; rather, this case falls outside the theorem's axioms.

  #### Case 2: Ambiguity Aversion
  *   **Verdict:** The theorem **does not address this case** (Assumption 1 & 2 violated).
  *   **Analysis:** Your friend is correct. Good's Theorem relies on the agent having a single prior probability distribution (Bayesianism). Ambiguity-averse agents (e.g., those modeled by MaxMin Expected Utility or the Ellsberg Paradox) often act as if they have a *set* of priors.
  *   For such agents, receiving information can eliminate some priors but leave only the "pessimistic" ones, thereby lowering the minimum expected utility. In non-Bayesian models, information can indeed have negative expected value because updating does not work the way Good's proof requires (specifically, it violates the "dynamic consistency" required for the proof).
  *   **Rationality:** If you define rationality as "adhering to Bayesian axioms," then an ambiguity-averse agent is irrational by definition. However, if you accept ambiguity aversion as a rational response to uncertainty (as many modern economists do), then Good's Theorem simply does not apply to them. It is a limitation of the Bayesian model, not a proof that ambiguity-averse agents are making a mistake.

  #### Case 3: Spoilers and Sports Scores
  *   **Verdict:** The theorem **does not address this case** (Assumption 3 violated).
  *   **Analysis:** This is similar to the genetic testing case. The utility of watching a match or reading a book is derived from the *process* of uncertainty resolution. If you know the score, the "consumption good" changes.
  *   In decision-theoretic terms, the outcome isn't "Team A wins." The outcome is "Experience of watching Team A play *without knowing the result*." By looking up the score, you are not just acquiring information; you are destroying the good you intended to consume.
  *   **Rationality:** Preferring not to look is rational because the "information" is not free—it comes at the cost of destroying the utility of the experience. Good's Theorem assumes the world state remains the same regardless of what you know. Here, your knowledge *changes* the world state (specifically, your experience of it).

  ### 4. Summary: What is Ruled Out?

  You asked which cases the theorem rules out as irrational. The honest answer is: **None of them.**

  Good's Theorem is a conditional statement: *If* you are a Bayesian Expected Utility maximizer with state-independent utility, *then* free information has non-negative expected value.

  *   **Cases 1 and 3** show that people often have **state-dependent utility** (they care about knowing/not knowing). The theorem assumes this away. It doesn't prove these people are irrational; it proves they don't fit the specific model.
  *   **Case 2** shows that people often violate **Bayesian updating**. The theorem assumes this away. It doesn't prove these people are irrational; it proves the theorem doesn't cover them.

  **What *would* the theorem rule out?**
  The theorem would only rule out an agent who:
  1.  Claims to be a standard Bayesian Expected Utility maximizer.
  2.  Has preferences that truly do not depend on their state of knowledge (e.g., they don't care about spoilers or psychological burden).
  3.  Yet *still* refuses free, costless information relevant to their decision.

  *That* agent is being inconsistent. But almost all real-world refusals of information (like your three cases) involve either psychological costs (violating state-independence) or non-Bayesian attitudes (violating the probability model).

  ### Conclusion

  Your intuition is not failing you; your application of the theorem is just too broad. Good's Theorem is a powerful result about the internal consistency of Bayesian reasoning, not a universal mandate that "more information is always better."

  *   **Genetic Testing & Spoilers:** These involve **intrinsic value of information**. The theorem assumes information is only **instrumentally** valuable.
  *   **Ambiguity Aversion:** This involves **non-Bayesian updating**. The theorem assumes **Bayesian conditionalization**.

  You should view Good's Theorem not as a commandment that "ignorance is always irrational," but as a diagnostic tool: if a rational agent refuses free information, it signals that either their utility function includes epistemic states (they care about knowing), or their probability model is non-Bayesian (they are ambiguity averse). In both cases, the "violation" tells us something important about the agent's preferences that the standard model was too narrow to capture.
