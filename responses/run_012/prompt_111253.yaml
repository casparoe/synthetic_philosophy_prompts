  Step (3) looked innocent because it exploits a superficially plausible consequentialist intuition: every action changes the world, and every omission leaves the world different than it would have been. It relies on the vagueness of "harm." One can always describe the status quo as "harmful" compared to a slightly better alternative, making it seem as though a "greater harm" is always standing. It mimics the structure of the dirty hands case—weighing harms to justify action—without respecting the threshold of severity or the special obligations that trigger the exception. It looks like a logical extension of the principle that we should always choose the lesser evil, but ignores that most choices aren't between evils. The colleague's move feels like rigorous consistency, applying the same logic to all cases. It appeals to the idea that morality is uniform across contexts. By framing the omission as leaving a harm "standing," it makes the harm seem active and pressing, rather than passive and negligible. This rhetorical framing masks the lack of moral obligation to prevent every possible harm. It tricks us into accepting that the logic of emergency justification applies to everyday life, simply because the structural form (act vs. omission) is identical.

  The price of rejecting it

  Rejecting (3) preserves (1) and (2) but restricts their domain significantly. (1) remains true: officeholders are sometimes required to do wrong, but only under specific conditions of catastrophic risk and role-specific duty. (2) also holds: when such a wrong is committed, its wrongness is outweighed by the necessity but not erased, sustaining the claim that guilt is owed. The claim that guilt is owed survives, but it becomes contingent on the violation of a genuine constraint, not merely on the performance of any act. However, the price is admitting that the "dirty hands" phenomenon is rare and structurally distinct from ordinary morality. We must accept a hybrid morality where consequentialist thresholds trigger deontological violations only in exceptions. This limits the scope of the theory; it is not a general theory of action, but a theory of exceptional political agency. The cost is losing generality. We cannot claim that all justified wrongs incur guilt, only those where a genuine constraint is breached under extreme pressure. Guilt is not universal; it is reserved for cases where a moral norm is violated, even if justified. This requires maintaining a robust distinction between ordinary moral choices and political emergencies. We must defend the idea that political office creates unique obligations that do not bind private citizens. This makes the theory more vulnerable to charges of elitism or special pleading, as it grants officeholders permissions denied to others. Furthermore, it requires a clear account of when the threshold for "catastrophe" is met, which is often contested. The repair costs theoretical simplicity for accuracy, acknowledging that political morality operates under different constraints than personal morality. This requires arguing that the minister's guilt is not a universal human condition but a specific burden of power. This isolates the dirty hands problem as a genuine dilemma rather than a ubiquitous feature of agency, preserving the gravity of the minister's choice while preventing the moral landscape from collapsing into universal taint.

  The best surviving version

  The best surviving version is a theory of exceptional political justification. It holds that political office creates special fiduciary duties that, in catastrophic scenarios, can require violating ordinary moral norms. The minister's lie is justified because it prevents an outbreak, yet it remains a lie, incurring guilt. This version can no longer claim that moral residue is a universal feature of human agency. It cannot suggest that everyone walks around with dirty hands; only those wielding power in extreme circumstances do. It abandons the idea that morality is uniformly structured across private and public life. Instead, it posits a dualism where public responsibility sometimes overrides private constraint, leaving a moral remainder. This preserves the intuition that the minister did the right thing but still did wrong. It saves the phenomenon of political guilt without universalizing it. The theory becomes a specific account of leadership burdens rather than a general meta-ethical claim.
