          *   Refinement: Needs to be sharper. If it's descriptive, show me the data. If regulative, isn't it just hope?
          *   Follow-up: If she says "both," push on the tension.
          *   *Question 1:* Is the arc a prediction or a project?
          *   *Follow-up:* If she claims it's empirically grounded, ask about the "is-ought" gap in her specific framework.

      *   *Topic 2: Contingency.*
