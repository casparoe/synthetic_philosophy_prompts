          *   Follow-up: If she says "long run," call out the "long run" defense.
          *   *Question 5:* The Falsification Condition.
          *   *Follow-up:* If she hesitates, ask if the view is unfalsifiable and thus dogmatic.

      *   *Topic 6: Historiography/Selection Effect.*
