          *   Follow-up: If she says "no justification," ask if the theory loses its normative force.
          *   *Question 4:* The Cost of the Bend.
          *   *Follow-up:* If she says "we owe it to them," ask if that's just a metaphor or a metaphysical claim.

      *   *Topic 5: Falsifiability.*
          *   Draft: What would change your mind?
