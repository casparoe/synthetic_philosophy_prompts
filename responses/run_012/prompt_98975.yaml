          *   *Question 7:* The Target of the Arc.
          *   *Follow-up:* If she says "procedural," ask about substantive outcomes.

      *   *Topic 8: Synthesis/Pressure.* (Need 8-10 total). Let's add one on *Agency* and one on *Cyclical History*.
          *   *Question 8:* Human Agency vs. Structural Inevitability. (If it bends automatically, why act?)
          *   *Question 9:* Cyclical Counter-evidence. (Rome fell, democracies backslide).
          *   *Question 10:* The "End of History" trap. (Does this imply a final state?)

  3.  **Refining and Polishing:**
