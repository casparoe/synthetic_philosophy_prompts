          *   Refinement: History is full of close calls (nuclear war, etc.). How does a structural tendency survive near-misses?
          *   Follow-up: If she says "resilience," ask about the cost of that resilience.
          *   *Question 2:* The "Close Call" objection.
          *   *Follow-up:* If she argues systems self-correct, ask about the time lag and suffering involved.

      *   *Topic 3: Mechanism.*
          *   Draft: How does it work?
          *   Refinement: No God, so what's the engine? Learning? Competition?
          *   Follow-up: If she says "moral learning," ask about regression.
          *   *Question 3:* The Engine of the Arc.
          *   *Follow-up:* If she cites "diminishing returns to violence," ask about high-tech domination.

      *   *Topic 4: Theodicy/Suffering.*
