          1.  Descriptive vs. Regulative status (and how to distinguish).
          2.  Contingency objection (luck/accidents vs. structural tendency).
          3.  Mechanism (what is the arc made of without a designer?).
          4.  Theodicy/Suffering (does past suffering need redemption?).
          5.  Falsifiability (what evidence would abandon the view?).
          6.  Historiography/Selection Effect (narrative imposition vs. world feature).
          7.  Definition of Justice (determinate conception vs. less domination).
      *   **Format:** Question + Follow-up (keyed to likely answer).
      *   **Tone:** Concrete, philosophical, pressing, no generic bio stuff.

