  The verdict in brief

  You are operating in different registers of moral discourse. You are making a claim about objective moral truth regarding individual actions, while he is making a claim about the functional rules necessary for social coordination during conflict. Since you agree on all practical outcomes—who to punish, who to pity—the disagreement is purely theoretical. You want to know if the soldier is sinful; he wants to know if the soldier is liable under the rules of the game. Until you distinguish between moral blameworthiness and conventional liability, you will remain stuck.

  The two positions, restated

  Your position is that morality tracks objective truth. If a war is unjust, contributing to it is objectively wrong, regardless of orders. Duress might forgive the soldier, but it does not make the act right. You emphasize that excusing and justifying are different things. Therefore, the unjust combatant is morally distinct from the just combatant, even if we treat them similarly for practical reasons. You are asking what is true of the man.

  Your friend's position is that the moral equality of combatants is a pragmatic construct, not a metaphysical truth. He argues that the label wrong does not apply in the context of war because the institution of war operates on separate rules designed to limit carnage. He is not denying the war is unjust; he is denying that the individual soldier's moral status is the relevant metric for the laws of war. He sees the convention as creating a temporary moral vacuum where both sides are equally permitted to kill, solely to prevent total barbarism. He is asking what rule we should hold one another to.

  The candidate diagnoses

  First, this could be a verbal dispute over the word wrong. You say contributing to an unjust threat is wrong, implying moral culpability. He says the soldier is not doing anything wrong, implying no violation of combat conventions. When he claims MEC is a convention, he suggests the term wrong doesn't apply within that system. This fits his statement that MEC was never a claim about individual wrongdoing. The frustration arises because you hear a moral denial while he offers a legal description. This is the simplest explanation, but it may not capture the depth of his claim about conventions.

  Second, you hypothesized you are answering different questions. You ask about deep moral fact; he asks about social rules. You said you are asking what is true of the man; he said the convention was never trying to track that. This explains why you agree on cases. If the question differs, the answers can differ without contradiction. You are judging the soul; he is judging the system. You want to know if the act is sinful; he wants to know if the act is permitted by the rules of war.

  Third, you might disagree on evidence. You treat intuitions about individual cases as data. He treats the possibility of armies functioning as data. He explicitly says the convention is adopted because of what happens to people when we don't. You focus on the act; he focuses on the system. He sees functional necessity as moral evidence; you see it as pragmatic compromise. For him, the fact that armies need rules is evidence of morality. For you, the fact that a man kills unjustly is evidence of immorality. This aligns with your observation that he treats the possibility of armies functioning as data. You treat the specific injustice of the war as the primary data point. Neither of you is wrong about your data, but you weigh them differently.

  Fourth, this could be bedrock. You value moral truth; he values functional stability. If so, nothing will move it. You might also disagree on a hidden empirical question: does treating soldiers as equals actually make everyone safer? However, since you agree on what the law should say, the empirical dispute is less likely than the conceptual one. It is possible he believes morality itself is constructed by such conventions, while you believe morality exists independently. This would be a disagreement about what moral theory is for. Is it to describe the universe or to manage human conflict? Until you isolate whether this is a semantic clash or a metaphysical one, you will talk past each other. If this is bedrock, no amount of case agreement will resolve the theoretical split. You would be arguing from different first principles. This matches your fear that nothing will move it.

  The diagnosis I would defend

  I defend the view that you are answering different questions under one name. You are engaged in individual moral accounting, while he is engaged in institutional design. This explains why you agree on every concrete case. If you truly believed the soldier was morally equivalent, you might argue against punishing commanders or feel less sympathy for the defender. But you don't. You agree the war is unjust. The disagreement is solely about whether the label wrong applies within the convention of war.

  He is correct that the laws of war are conventional, but you are correct that conventions do not erase underlying moral facts. They merely bracket them. Your frustration stems from expecting the convention to track deep moral truth, when its purpose is pragmatic stability. He is describing the rules of the game; you are describing the morality of the players. Both can be true simultaneously without contradiction. The soldier is objectively contributing to an unjust threat (your truth), but is not liable to punishment under the conventions of war (his truth). Recognizing this separates the metaphysical claim from the practical rule. He argues about the map (convention); you argue about the terrain (moral fact). Once you admit the map is not the terrain, the conflict dissolves. You can maintain that the soldier is morally compromised while agreeing he should be treated as an equal under the laws of war. This distinction allows you to maintain your moral stance without rejecting his practical one.

  What would count as progress

  Progress requires changing the vocabulary. Stop using wrong for both concepts. Use culpable for your claim and liable for his. If you can agree that a soldier can be culpable but not liable, the tension dissolves. A new case might help: ask him about a soldier who knows the war is unjust but fights anyway. Does the convention still protect him morally, or only legally? If he admits the convention protects him legally but not morally, you agree. If he insists the convention erases the moral fault, you have found your bedrock disagreement.

  Ultimately, you should expect agreement on practice, which you already have. Theoretical agreement is unnecessary for peace between friends. Accept that he is describing the sociology of war, while you are describing the ethics of killing. Acknowledge that his convention saves lives, while your truth saves souls. You can respect the utility of his position without abandoning the integrity of yours. The goal is not to win the argument, but to understand why the argument exists. You might never agree on the theory, but you can agree that both perspectives are necessary for a complete understanding of war.
