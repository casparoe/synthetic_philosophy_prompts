answer: |-
  This is a profound inquiry into the topology of aesthetic and legal judgment. You are describing a friction between the continuity of experience (or text) and the discreteness of judgment. You have accurately identified that standard logical or moral labels feel like they miss the phenomenological weight of what you are experiencing.

  Per your instructions, I will not rush to a label. I will assemble the strongest candidate concepts from semantics, aesthetics, and legal theory, test them against your three cases, and identify where they fracture. Only then will I offer a synthesis and, if necessary, a proposed term.

  ### Candidate 1: The Sorites Paradox (The Logical Structure)

  **The Concept:** This is the classical "Paradox of the Heap." If you remove one grain from a heap, it remains a heap. If you continue, you eventually have no grains, which is not a heap. Where did the heap cease to be?
  **Fit:** This matches your structural description perfectly.
  *   *Revision:* One change doesn't ruin the book; many do.
  *   *Workshop:* One paragraph doesn't make him monstrous; the sum does.
  *   *Editor:* One page doesn't make it a novel; the sum does.
  *   *Neighbors:* Indiscernible.
  *   *Endpoints:* Distinct.
  **Where It Fails:** In logic and semantics, the Sorites is typically treated as a *problem to be solved*, often by concluding that the predicate (e.g., "heap," "good novel") is incoherent or empty. You explicitly state: *"the term is not therefore empty, or merely conventional."* You feel the distinction is real (the book *is* worse; the man *is* monstrous), whereas the standard logical treatment often suggests the distinction is an illusion of language. The Sorites names the *shape* of the trap, but it does not validate the *reality* of the verdicts inside it.

  ### Candidate 2: Epistemicism (The Metaphysical Stance)

  **The Concept:** Championed by philosophers like Timothy Williamson, this view holds that vague predicates *do* have sharp boundaries (there is a specific grain of sand that makes the heap), but human beings are cognitively incapable of knowing where that boundary is.
  **Fit:** It preserves the reality of the distinction. It allows you to say, "The book *is* worse," without contradiction.
  **Where It Fails:** It contradicts your direct experience. You wrote: *"There is no fact I can find that fixes the changeover."* Epistemicism claims the fact *exists* but is hidden. Your intuition is that the fact *does not exist*. In your revision case, you feel that no single sentence *is* the damage; Epistemicism insists one of them *must be*. This feels like a lie about the nature of the text.

  ### Candidate 3: Family Resemblance (The Categorical Stance)

  **The Concept:** From Wittgenstein. Concepts like "game" or "novel" are not held together by a single essential thread but by overlapping similarities.
  **Fit:** This handles the "Editor's Number" well. A novel is a novel because it shares enough traits with other novels, not because it hits a word count. It allows for boundarylessness.
  **Where It Fails:** It works for *classification* (Is this a novel?), but poorly for *degradation* or *transformation* (Is this *worse*? Is he *monstrous*?). Family Resemblance explains why a sonnet and a limerick are both poems. It does not easily explain how a poem slowly turns into noise through indiscernible steps. It lacks the vector of *value* or *moral weight* present in your first two cases.

  ### Candidate 4: Supervaluationism (The Semantic Stance)

  **The Concept:** A technical solution to vagueness. A statement is "super-true" if it is true under all acceptable ways of making the vague term precise (all "precisifications"). "This is a heap" is super-true for a large pile, super-false for one grain, and neither for the middle.
  **Fit:** This captures your intuition that the verdicts at the ends are "confident and well grounded" while the middle is indeterminate. It allows the term to be meaningful without a sharp boundary.
  **Where It Fails:** It is a semantic tool, not an aesthetic one. It explains how we can *speak* truthfully about vague objects, but it doesn't describe the *experience* of creating them. It treats the vagueness as a gap in truth-value, whereas you describe it as a drift in *coherence*. It feels too sterile for the "worse as a whole" sensation.

  ### Candidate 5: Reflective Judgment (The Aesthetic Stance)

  **The Concept:** From Kant's *Critique of Judgment*. Determinant judgment applies a universal rule to a particular (This is a novel because it fits the definition). Reflective judgment finds a universal for a particular when no rule exists (This is beautiful/sublime, though I can cite no law).
  **Fit:** This addresses your final question: *"What is the honest description of what I am doing when I pick a point?"* It describes judging without a pre-existing rule.
  **Where It Fails:** It describes the *act of the judge*, not the *structure of the object*. You asked for a name for the *structure common to these cases*. Reflective Judgment explains your response, but not the "shape that turns up in my own drafts."

  ***

  ### Analysis of the Difference in Case 3

  You noted the third case (the Editor's Number) sits differently. You are correct.
  *   **Cases 1 & 2 (Revision/Workshop):** These are instances of **Intrinsic Vagueness**. The boundarylessness belongs to the aesthetic or moral object itself. The "monstrousness" or the "quality" is emergent and gradient.
  *   **Case 3 (Editor's Number):** This is **Institutional Vagueness** masking as a Rule. In legal theory (H.L.A. Hart), this is the difference between a *Rule* (55 mph limit) and a *Standard* (drive reasonably). Your publisher imposes a Rule (word count) to approximate a Standard (novel-length). The arbitrariness is real, but the *purpose* is real. This is a **Stipulative Boundary** intended to manage **Constitutive Vagueness**.

  ***

  ### The Synthesis: What is this Structure?

  There is no single established term that captures the *structure*, the *reality of the verdict*, and the *absence of a fact* simultaneously without treating it as a logical error. The Sorites names the logic; Epistemicism names the metaphysics (which you reject); Supervaluationism names the semantics.

  However, in aesthetics and legal theory, there is a convergence on a concept that I believe fits your experience, though it requires a slight refinement.

  The structure is a **Sorites Series**, but the condition you are describing is **Constitutive Vagueness**.

  **Constitutive Vagueness** posits that the vagueness is not a defect of language or knowledge, but a feature of the object's ontology. A character's morality or a manuscript's coherence *is* the kind of thing that does not have sharp boundaries. To demand a sharp boundary is to misunderstand the kind of thing a character or a novel is.

  However, since you asked for a name for the *structure* that covers the pattern, and "Constitutive Vagueness" is a property rather than a shape, I propose we look to a term that bridges the logical structure with the aesthetic experience.

  **Proposed Term: The Coherence Horizon**

  I define **The Coherence Horizon** as follows:
  A structural condition in aesthetic or normative objects where:
  1.  **Local Continuity:** Adjacent states are indiscernible with respect to a predicate (good/bad, decent/monstrous).
  2.  **Global Discontinuity:** Distant states are definitively distinct with respect to that predicate.
  3.  **Non-Locality of Failure:** The transition cannot be pinned to a specific locus (sentence, paragraph, page) without distorting the object.
  4.  **Veridical Drift:** The verdict at the endpoints is truth-apt (not merely conventional), despite the lack of a boundary condition.

  **Edge Cases for The Coherence Horizon:**
  *   *Fits:* Your revision draft (local improvement, global decay).
  *   *Fits:* Your character arc (local plausibility, global transformation).
  *   *Fits:* The "Ship of Theseus" paradox (when does it cease to be the same ship?).
  *   *Does Not Fit:* A light switch (on/off). There is a mechanical fact that fixes the changeover.
  *   *Does Not Fit:* A legal speed limit (55 vs 56). Here the boundary *is* the fact, even if arbitrary. (This is why your Case 3 is different; it is an attempt to impose a switch on a horizon).

  ***

  ### What Follows for Judgment?

  You ask: *"If there is no place where the change happens, is my verdict at each step mistaken, or my verdict at the end, or neither?"*

  **1. The Status of the Verdicts**
  Your verdict at each step is **locally correct but globally blind**. When you say, "This sentence is better," you are telling the truth. When you say, "This manuscript is worse," you are also telling the truth. The error is not in the verdicts, but in the assumption that global properties (coherence, character) supervene linearly on local properties (sentence quality, paragraph action).
  *   *Implication:* Do not distrust your local ear, but do not trust it to track the global shape. You need a different instrument for the horizon than for the step.

  **2. The Honest Description of Decision**
  You ask: *"What is the honest description of what I am doing when I pick a point, given that I do not believe there is a point to pick?"*

  You are engaging in **Phronetic Cutting** (or **Phronetic Delimitation**).
  *   *Phronesis* (Aristotle) is practical wisdom: the ability to judge rightly in situations where no technical rule applies.
  *   When you stop revising, or when the publisher accepts the manuscript at 99,000 words vs. 101,000, you are not *discovering* a boundary. You are **imposing a resolution** on a **continuous field**.

  This is not arbitrary (like flipping a coin), because it is responsive to the *whole*. It is not determined (like measuring a board), because there is no fact of the matter.

  **The Description:**
  > "I am drawing a line of convenience across a gradient of being. The line does not exist in the text, but the gradient does. My judgment is not a report on where the text changed, but a decision on where the cost of further continuity outweighs the benefit of the current coherence."

  **3. How to Judge Without Pretending**
  To leave the verdict answerable to the work rather than taste:
  *   **Acknowledge the Horizon:** Admit that "better sentences" do not guarantee a "better book." Treat coherence as a separate variable from local quality.
  *   **Use Reflective Equilibrium:** Move back and forth between the part and the whole. Do not assume the sum of the parts equals the whole.
  *   **Accept the Institutional Cut:** For the Editor's Number (Case 3), acknowledge that this is a **Stipulative Boundary**. It is a tool to manage the Coherence Horizon. It is arbitrary *in principle* but necessary *in practice*. The "reality" of the distinction (Novel vs. Not-Novel) is sustained by the community of readers, not the word count. The number is just a proxy.

  ### Final Answer

  The structure common to your cases is the **Sorites Series**, but the philosophical condition you are inhabiting is **Constitutive Vagueness**. Existing terms like "Slippery Slope" or "Epistemicism" fail because they either predict consequences or posit hidden facts.

  If you require a term that captures the aesthetic and normative weight of this structure specifically, I propose **The Coherence Horizon**.

  **For your judgment:** You are not finding a line; you are **resolving a gradient**. Your verdict at the end is true (the book *is* worse), and your verdicts at the steps are true (the sentence *is* better). The tension is not a contradiction to be solved, but a topology to be navigated. The honest description of your decision is that you are exercising **Phronesis**: imposing a necessary discreteness on a continuous reality to make action (publication, completion, judgment) possible. You are not lying when you pick a point; you are completing the work that the text itself leaves unfinished.
