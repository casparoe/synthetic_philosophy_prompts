answer: |-
  1. The flatmate scenario illustrates an integrity-based compromise where agents accept agent-relative moral costs to achieve an agent-neutral improvement they both endorse. This preserves moral agency because the parties voluntarily absorb the costs of their own concessions.

  2. Standard labels like logrolling fail because they describe the mechanism of vote-trading without addressing the normative conflict of enacting policies each actor individually deems suboptimal or wrong. Bribery is equally inapt since the exchange is transparent and lacks the corruption of public duty for private wealth.

  3. Your first case remains ethically coherent because the losses are borne by the agents themselves, preserving the legitimacy of their consent to the arrangement. It functions as a mutual adjustment of behavior rather than a violation of duty to others.

  4. The legislative case becomes distinct when the concessions impose harms on non-consenting third parties, shifting the moral problem from personal integrity to the justification of externalized rights violations. Here the claimed better total relies on sacrificing interests that were not party to the negotiation.

  5. This second phenomenon should be termed externalized compromise, bounded by reciprocal agreements where mutual gain is contingent upon imposing unconsented costs on excluded stakeholders. The concept edges out where third parties possess veto power or where the harm is incidental rather than constitutive of the deal.
