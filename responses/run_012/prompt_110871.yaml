answer: |-
  **UNIVERSITY EXAMINATION PAPER**

  **Module:** Formal Epistemology (Final Year Option)
  **Time Allowed:** 45 Minutes
  **Total Marks:** 30

  **Question 1**

  A student proposes what she calls *Calibrationism*: the fundamental epistemic good of a credence is not accuracy — closeness to the truth as measured by a proper scoring rule — but calibration, the requirement that events assigned credence $p$ occur with relative frequency $p$. She offers two arguments. First, calibration is what we actually inspect forecasters for. Second, accuracy appears to demand the impossible, because in any world the most accurate coherent credence function is the omniscient one, which nobody can have.

  Write an essay evaluating this proposal. Say what is right and what is wrong in Calibrationism, and use the comparison between calibration and accuracy to locate the weakest link in the accuracy-first programme.

  ***

  **MODEL ANSWER**

  Calibrationism captures an intuitive constraint on rational belief: if one assigns probability $p$ to a class of events, roughly proportion $p$ should occur. However, as a foundational epistemic norm, it fails technically and normatively, though its failure illuminates vulnerabilities in Accuracy-First views.

  The primary technical failure of Calibrationism is that calibration is not a strictly proper scoring rule. A scoring rule is proper if an agent maximises their expected score by reporting their true credence. Calibration scores often fail this; an agent might manipulate their reported credence to match anticipated frequencies rather than reflecting their actual evidence. Furthermore, calibration admits a trivial solution: the 'no-information' function. In a world where events occur with a base rate of 50%, an agent who assigns 0.5 to every proposition is perfectly calibrated. Yet, this agent possesses no discriminatory power. This highlights the distinction between calibration (reliability) and refinement (discrimination). A useful forecaster must distinguish high-probability from low-probability events. Calibration alone permits an agent to ignore specific evidence in favour of base rates, violating the core epistemic duty to respond to evidence.

  Moreover, perfect calibration is not always attainable, even in principle, due to self-referential instability. Consider a proposition $P$: 'The credence assigned to $P$ is not 0.5'. If the agent assigns 0.5, $P$ is false, making the credence inaccurate and uncalibrated. If they assign 0.8, $P$ is true, but if the truth value depends on the assignment, stable calibration is impossible. Accuracy-First avoids this by seeking the *most* accurate function available, not perfect calibration.

  This leads to the student's second argument: the omniscience objection. She claims Accuracy-First demands the impossible, as the omniscient function (assigning 1 to truths, 0 to falsehoods) is always most accurate. This mischaracterises the Accuracy-First programme. Proponents do not require agents to *achieve* omniscience, but to avoid dominated options. Using Joyce's argument, if a credence function is not probabilistic, there is always an alternative that is more accurate in every possible world. Thus, the norm is to avoid dominance, not to maximise absolute accuracy.

  However, to make this dominance argument work, Accuracy-First theorists must invoke *immodesty*: the requirement that a rational credence function must expect itself to be more accurate than any alternative. This is the programme's weakest internal link. Calibrationism is naturally modest; one can acknowledge one's calibration is poor. Accuracy-First requires immodesty to rule out sceptical or self-doubting credences that would otherwise be undominated. If immodesty is rejected, the dominance argument loses its normative force, leaving the agent without a guide to choose between undominated functions.

  Finally, the comparison reveals a deeper external weakness: the evidentialist worry. Calibrationism attempts to link belief to worldly frequencies, but Accuracy-First links belief to truth values. Neither automatically secures the norm of proportioning belief to evidence. An agent could be accurate by luck (a broken clock is right twice a day) or calibrated by ignoring specific data (using base rates). The weakest link in Accuracy-First is not the mathematics of scoring rules, but the assumption that accuracy alone captures the deontological requirement to believe in accordance with evidence. While Calibrationism fails as a formal norm due to impropriety and triviality, its emphasis on frequency checks highlights that accuracy, even when defended via dominance and immodesty, remains a consequentialist metric that may diverge from the procedural norms of evidence.

  ***

  **MARKING SCHEME**

  **Total: 30 Marks (6 points × 5 marks each)**

  | Point | Criteria for Marks | Typical Mistake Costing Marks |
  | :--- | :--- | :--- |
  | **1. Properness** | Identifies that calibration scoring rules are not strictly proper (incentivise misreporting). | Treating calibration as a proper scoring rule equivalent to Brier score. |
  | **2. Triviality & Refinement** | Notes the 'no-information' base-rate solution and distinguishes calibration from refinement/discrimination. | Failing to mention the trivial 0.5 solution or confusing reliability with discrimination. |
  | **3. Self-Reference** | Motivates the impossibility of perfect calibration using a self-referential proposition case. | Claiming perfect calibration is always possible or ignoring logical constraints on truth-values. |
  | **4. Dominance Response** | Explains the Accuracy-First response to omniscience: avoiding dominated options, not maximisation. | Reading the dominance argument as a requirement to achieve maximal accuracy/omniscience. |
  | **5. Immodesty** | Identifies immodesty as the necessary premise for dominance arguments and notes its controversial status. | Assuming immodesty is uncontroversial or failing to link it to the dominance argument. |
  | **6. Evidentialist Worry** | Articulates the worry that accuracy (consequentialist) does not entail proportioning belief to evidence (procedural). | Concluding Accuracy-First is perfect once dominance is established; ignoring the evidence norm. |
