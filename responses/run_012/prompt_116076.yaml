answer: |-
  This is one of the sharpest questions you can ask about environmental history. The muddle you are hitting is not just confusion; it is a genuine philosophical battleground where historians, geographers, and philosophers of science disagree on how to map reality.

  You have correctly identified that "Volcano caused Famine" and "Volcano created conditions for Famine" are doing different logical work. Here is the breakdown of the distinctions you are looking for.

  ### 1. Cause vs. Condition: Is it real or rhetorical?

  This is a real distinction, rooted in how we select explanations, but it is often exploited rhetorically.

  In the philosophy of action (specifically H.L.A. Hart and Tony Honoré's *Causation in the Law*), the distinction rests on **normality vs. abnormality**.
  *   **A Condition** is part of the "background state of affairs" that is taken for granted. (e.g., The presence of oxygen is a condition for a fire).
  *   **A Cause** is the "intervention" that disrupts the normal flow. (e.g., The struck match is the cause of the fire).

  **Why it matters:**
  If you call Tambora a *condition*, you are saying the social system was already fragile; the volcano was just the environment in which the collapse happened. If you call it a *cause*, you are saying the social system was stable until the volcano intervened.

  **Is it just polite downgrading?**
  Sometimes, yes. A political historian might call a volcano a "condition" to protect the primacy of human agency (i.e., "Politicians caused the famine by mismanaging the crisis the volcano created"). An environmental historian might call it a "cause" to highlight human vulnerability.
  **However,** it is analytically useful because it separates **triggers** from **vulnerabilities**. If you treat a condition as a cause, you risk implying that removing the volcano would have solved the problem, when the real problem might have been the tax system that prevented grain storage.

  ### 2. Counterfactuals: Who commits to "No X, No Y"?

  You suspected that "cause" commits you to a counterfactual and "condition" doesn't. **You are mostly right, but with a twist.**

  *   **The Cause Claim:** Commits you to a strong counterfactual: *"But for the volcano, the famine would not have occurred **at this time and in this manner**."* It implies a break in the chain of events.
  *   **The Condition Claim:** Commits you to a *structural* counterfactual: *"Without this background vulnerability, the volcano would not have produced a famine."*

  **The Trap:**
  In complex historical systems, almost nothing is strictly necessary (sine qua non). Famines happen for many reasons. So, rigorous historians rarely claim "No volcano, no famine ever." Instead, they claim **Probabilistic Causation**.
  *   **Cause:** "The volcano raised the probability of famine from 5% to 90%."
  *   **Condition:** "The tax system raised the probability of famine from 5% to 40%; the volcano raised it from 40% to 90%."

  The distinction isn't whether a counterfactual exists, but **which link in the chain you are testing.** If you say "Volcano = Cause," you are testing the link between weather and harvest. If you say "Tax System = Cause," you are testing the link between harvest and starvation. Both rely on counterfactuals, but they locate the "break point" differently.

  ### 3. Environmental Determinism: Where is the line?

  This is the most politically charged distinction.

  **The Line:**
  Determinism does not start at "raising the odds." It starts at **removing viable alternatives.**
  *   **Probabilistic (Not Deterministic):** "The climate made agriculture difficult, so society was more likely to be hierarchical." (Humans could still choose otherwise, but it was costly).
  *   **Deterministic:** "The climate made agriculture difficult, *therefore* society *had* to become hierarchical." (No other outcome was possible).

  **Timescale Matters:**
  *   **One-off events (Tambora):** Rarely deterministic. Societies respond differently to the same shock (e.g., 1816 caused famine in Europe but different outcomes in China). Claiming determinism here is usually bad history.
  *   **Long-run patterns (Diamond's *Guns, Germs, and Steel*):** This is where determinism hides. If you argue that over 5,000 years, geography *inevitably* produced Eurasian dominance, you are flirting with determinism. If you argue it produced *asymmetrical probabilities* that accumulated over time, you are arguing for **structural constraint**, not determinism.

  **Verdict:** "Raising the odds" is safe. "Making inevitable" is determinism. The danger zone is when "raising the odds" is so extreme (99.9%) that it functionally equals inevitability, but the historian refuses to admit it.

  ### 4. Your Invention: "Shove" vs. "Socket"

  **This distinction holds up remarkably well.** You have independently rediscovered a version of the distinction between **Efficient Causes** (Shove) and **Formal/Material Causes** (Socket), or in historiography, **Event History** vs. **Structural History** (Fernand Braudel's *histoire événementielle* vs. *longue durée*).

  *   **The Shove (Trigger):** Adds energy to a system. It changes the *timing* and *intensity*.
      *   *Example:* A drought turns a shortage into a famine.
      *   *Logic:* The potential for famine existed; the shove realized it.
  *   **The Socket (Constraint/Channel):** Defines the *shape* of possibility. It doesn't add energy; it removes options.
      *   *Example:* A mountain range makes a trade route impossible.
      *   *Logic:* The trade wouldn't happen there regardless of how much "shove" (money/effort) you applied.

  **Does it collapse?**
  It can collapse if you aren't careful. A "socket" can become a "shove" if the constraint is suddenly removed (e.g., a mountain pass opens due to melting ice, suddenly "pushing" migration).
  **Utility:** It is an excellent heuristic. It stops you from asking "Did the volcano cause the revolution?" and lets you ask "Did the volcano *shove* a fragile system, or did the political structure *socket* the response to the volcano?" It prevents the "Great Man" vs. "Great Force" binary.

  ### 5. Non-Human Agency: Metaphor or Work?

  When historians call a germ or volcano an "actor" (drawing on Actor-Network Theory, specifically Bruno Latour), they are trying to do specific explanatory work that ordinary cause-talk fails at.

  **Ordinary Cause-Talk:**
  Treats the non-human as a passive tool or a backdrop.
  *   *Sentence:* "Humans used the volcano to explain their suffering." (Volcano is passive).
  *   *Sentence:* "The volcano caused the suffering." (Volcano is a billiard ball hitting another ball).

  **Agency-Talk:**
  Treats the non-human as something that **modifies a situation** and **forces other actors to respond.**
  *   *The Work It Does:* It highlights **resistance** and **unintended consequences.** A germ doesn't have *intent* (it doesn't want to conquer America), but it has *agency* in the sense that it alters the course of human history in ways humans did not plan and could not control.
  *   **Why use it?** It stops us from assuming history is just "Humans doing things to other Humans." It forces us to trace the network. "The Spanish didn't conquer the Aztecs; The Spanish + Smallpox + Steel + Horses conquered the Aztecs."

  **Climate vs. Event:**
  *   **Discrete Events (Volcano/Germ):** "Agency" works well here. The eruption *did* something specific at a specific time.
  *   **Climate as a Whole:** This is trickier. Climate is a system, not an actant. Calling "Climate" an actor can sometimes slide back into determinism (see Question 3). It is more precise to say Climate *sets the parameters* (Socket) while specific weather events *provide the Shove*.

  ### Summary: How to untangle the muddle

  When you read pop history, apply your "Shove/Socket" filter and ask these three questions:

  1.  **The Counterfactual Test:** Is the author claiming the event wouldn't have happened *at all* without the volcano (Cause), or that it wouldn't have happened *in this specific way* (Condition/Shove)?
  2.  **The Vulnerability Audit:** If they say "Volcano caused Famine," are they ignoring the "Socket" (the tax system that prevented grain storage)? If they say "Politics caused Famine," are they ignoring the "Shove" (the crop actually died)?
  3.  **The Agency Check:** If they call the germ an "actor," are they giving it magic powers, or are they acknowledging that human plans were hijacked by biological reality?

  **The Synthesis:**
  The most robust historical explanations usually look like this:
  *"The **Socket** (political fragility) made the society vulnerable. The **Shove** (volcano) triggered the collapse. The **Agency** (germs/climate) ensured the collapse followed a path the humans did not intend."*

  Your intuition that there are "two or three distinctions smushed together" is correct. By separating Trigger (Shove), Structure (Socket), and Probability (Determinism), you can cut through the noise.
