      Hi, I'm the biologist. I used to study RNA. Now I study Moore. Marriage is like an organic unity. It's not 1+1=3. It's a new thing. You love each other for real reasons, not just feelings. Also, beauty needs someone to see it. So keep looking at each other. Cheers.

