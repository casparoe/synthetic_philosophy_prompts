answer: |-
  Good evening. For those who don't know me, I'm a friend of the family. I spent thirty-five years in a laboratory looking at RNA splicing. Essentially, I got paid to watch tiny molecules cut and paste themselves to make life work. Two years ago, I retired, walked into a philosophy lecture hall, and realized I'd spent my whole life studying the hardware without ever reading the manual.

  So, when [Parents' Names] asked me to speak tonight, I said yes immediately. Then I went home and panicked. Because in biology, if you join two healthy cells, you generally expect a functioning system. But in ethics—and in marriage—the math is much trickier.

  There is a tempting thing to say at weddings. It's the idea that because the bride is wonderful, and the groom is wonderful, putting them together equals double the wonderfulness. But anyone who has ever shared a kitchen or a bank account knows that isn't true. The value of a union isn't just the sum of the parts. Sometimes, two good people make a miserable whole. The value depends entirely on the *nature* of the combination.

  Looking at [Bride] and [Groom], I don't see simple addition. I see what a philosopher might call a new kind of entity.

  I've watched them together. And what strikes me isn't just that they are kind, or smart, or that they both enjoy hiking—though they do. It's *how* they regard those things. There is a specific kind of goodness in personal affection, but only when that affection is aimed at the real qualities of another person. It's not a blurry, general goodwill. It's precise.

  I have seen [Groom] look at [Bride] when she is explaining something she loves. He isn't just waiting for his turn to speak. He is witnessing her. And I have seen [Bride] notice the way [Groom] treats a stranger, or fixes a broken thing, or worries about a friend. She sees him.

  This brings me to the most important thing I've learned since leaving the lab. We tend to think value is like a rock—something that sits there whether we look at it or not. But it isn't. A beautiful world with no one to perceive it is practically worthless. A sunset needs an eye. A symphony needs an ear. And a marriage? A marriage needs two witnesses.

  The precious thing isn't just that you exist side-by-side. It's that you are consciously aware of the good in each other. You are the curators of each other's best qualities. If you stop looking, the value doesn't just hide; it diminishes.

  So, my wish for you is not that you never fight, or that your lives are easy. My wish is that you remain rigorous observers. When the days are gray, look for the good in the other, not because it's easy, but because that act of seeing is what creates the value in the room. Don't let the beauty go unperceived.

  [Bride] and [Groom], you have built an organic unity that is rare and fragile. Protect it. Keep watching each other.

  To the bride and groom.
