answer: |-
  **JOINT STATEMENT ON INFERENTIAL LIMITS AND INTERPRETIVE SCOPE IN ARCHAEOLOGY**

  **Date:** 24 May 2024
  **Parties:** The 'Thin' Camp (Behavioural/Material Priority) & The 'Thick' Camp (Cognitive/Social Priority)
  **Chair:** [Your Name/Session Chair]
  **Subject:** Protocols for moving from material remains to social and cognitive claims, with specific reference to the Late Bronze Age holed-vessel assemblage.

  ### 1. Shared Axioms
  We, the undersigned, agree to the following numbered claims regarding the archaeological record and the limits of our respective rhetorics:

  1.  **The Fragmentary Nature of the Record:** We agree that the archaeological record is an incomplete subset of past human activity, filtered by taphonomy, recovery bias, and preservation. No interpretation can claim to recover the 'total' past.
  2.  **Pattern as Prerequisite:** We agree that singular finds cannot sustain general claims. Any assertion regarding behaviour or belief must rest on demonstrable patterning (frequency, association, context) rather than isolated anomalies.
  3.  **The Limit of 'Thin' Certainty:** The 'Thick' Camp acknowledges that the 'Thin' Camp's caution is methodologically necessary to prevent fantasy. The 'Thin' Camp acknowledges that describing an object solely by its physical properties (e.g., 'fired clay vessel') without functional context is descriptively sterile and fails to meet the basic definition of archaeology as a human science.
  4.  **The Limit of 'Thick' Certainty:** The 'Thin' Camp acknowledges that the 'Thick' Camp does not claim access to individual mental states (what a specific person thought at a specific moment), but rather to shared, structured cognitive frameworks. The 'Thick' Camp acknowledges that terms like 'belief', 'ritual', and 'cosmology' are heuristic models, not direct observations.
  5.  **Mutual Overreach:**
      *   The 'Thin' Camp admits its rhetoric sometimes implies a 'view from nowhere', presenting behavioural descriptions (e.g., 'repeated deposition') as theory-neutral facts, when they themselves rely on unstated assumptions about intention.
      *   The 'Thick' Camp admits its rhetoric sometimes presents probabilistic inferences as settled facts, using evocative language ('killed', 'sacrificed') that obscures the chain of reasoning required to get there.
  6.  **The Goal of Explanation:** We agree that the ultimate aim is not merely to catalogue the past, but to explain it. We disagree only on what constitutes a valid explanation and the evidentiary threshold required to support one.

  ### 2. Map of Surviving Disagreements
  We acknowledge that the following disagreements remain unresolved. Each side accepts the wording below as a fair characterisation of their opponent's position and their own.

  | Area of Dispute | The 'Thin' Camp Position | The 'Thick' Camp Position |
  | :--- | :--- | :--- |
  | **Ontological Status of Belief** | Claims about belief are unverifiable glosses. The honest account stops at rule-governed behaviour (people *did* X repeatedly). | Claims about belief are necessary explanations for *why* rule-governed behaviour occurred. Refusing them is a refusal to explain. |
  | **Institutional Inference** | A large building is a large building. Inferring a 'council' or 'temple' imposes modern categories on ambiguous spaces. | Patterning of access, deposition, and scale allows graded claims about institutions. To call it merely a 'building' is to ignore its social function. |
  | **Bridging Principles** | Principles linking matter to mind (e.g., 'breaking = killing') are usually circular, derived from the very cases they interpret. | Principles can be warranted independently via taphonomy, experiment, and cross-cultural constraint, allowing them to be applied testably. |
  | **Risk Assessment** | The greater risk is false positive (claiming meaning where there is none). Caution is the primary virtue. | The greater risk is false negative (ignoring meaning that is there). Explanatory power is the primary virtue. |

  ### 3. Epistemological Cruxes
  We identify two specific sub-questions where settling the matter would significantly shift the debate.

  **Crux A: Independent Warrant for Bridging Principles**
  *   **The Question:** Can a bridging principle (e.g., 'puncturing a vessel renders it ritually inactive') be warranted independently of the specific archaeological context it is used to interpret?
  *   **The Stakes:** If 'Thin' is right, all such principles are post-hoc rationalisations. If 'Thick' is right, they are law-like generalisations that can be tested.
  *   **The Cost of Underdetermination:** If the 'Thin' Camp accepts that underdetermination applies equally to their behavioural claims (e.g., 'cooking pot' is as much an inference as 'ritual object'), they must accept that their 'facts' are also theoretical constructs. We require the 'Thin' Camp to specify what epistemic cost they incur if they admit their behavioural labels are as inferential as belief labels.

  **Crux B: The Specificity of Underdetermination**
  *   **The Question:** Does the underdetermination of theory by data bite harder on belief-claims than on behavioural-claims?
  *   **The Stakes:** If underdetermination bites equally hard, the 'Thin' Camp's claim to superior security is illusory. If it bites harder on belief, 'Thin' is justified in stopping short.
  *   **The Test:** We must determine if there is a 'behavioural baseline' that is truly theory-neutral, or if identifying an action (e.g., 'burying') already presupposes a cognitive state (e.g., 'disposal' vs 'deposit').

  ### 4. Empirical Tests and Predictions (The Bronze Age Case)
  We agree to use the Late Bronze Age settlement assemblage (400-year occupation; adult burials with miniature pots; 90% holed bases; exclusive to graves and one threshold pit) as the testing ground for the Cruxes above.

  **Test 1: The Threshold Pit (Contextual Variation)**
  *   **Scenario:** A pit under a house threshold containing eleven holed miniature pots. No human remains associated.
  *   **'Thin' Prediction:** This represents a distinct behavioural rule regarding foundation deposits. The 'holing' is a marker of decommissioning or manufacture defect, not necessarily 'killing' in a cosmological sense. The association with graves is a matter of discard convenience or available stock, not semantic identity.
  *   **'Thick' Prediction:** The semantic load of the 'holed vessel' is consistent across contexts. In the grave, it serves the dead; in the threshold, it serves the house/ancestors. The act of 'killing' the vessel is the invariant principle. If the meaning changes fundamentally between pit and grave, the 'Thick' claim of a unified cosmological rule fails.
  *   **Agreed Falsifier:** If analysis shows the threshold pots were holed *after* deposition (technically impossible) or show wear patterns indicating prior domestic use (contradicting the 'miniature/special' fabric claim), the 'Thick' prediction fails. If the threshold pots are shown to be standard domestic ware while grave pots are special-made, the 'Thin' prediction gains ground.

  **Test 2: The Independence of the 'Killing' Principle**
  *   **Scenario:** Cross-cultural and experimental examination of vessel puncturing.
  *   **'Thin' Prediction:** We will find numerous historical or ethnographic examples where vessels are punctured for purely pragmatic reasons (venting, stacking, preventing reuse for storage) without cosmological intent. Therefore, 'holing' cannot be assumed to mean 'killing' without direct textual or iconographic support.
  *   **'Thick' Prediction:** While pragmatic holing exists, the specific combination of *miniaturisation + exclusive mortuary/liminal context + deliberate base puncture* creates a 'constellation' that pragmatics cannot explain. The principle is not 'holing = killing' in isolation, but 'holing + context = ritual action'.
  *   **Agreed Falsifier:** If a contemporary settlement is found where these exact pots (miniature, holed, same fabric) are found in domestic middens associated with food waste, the 'Thick' claim collapses.

  ### 5. Verbal and Semantic Clarifications
  We acknowledge that part of this dispute is verbal. We agree to the following terminological constraints to prevent talking past one another:

  1.  **'Fact':** The 'Thin' Camp uses this to denote low-level inference (e.g., 'this is a pot'). The 'Thick' Camp uses this to denote high-confidence interpretation (e.g., 'this is a grave good'). We agree to use **'Observation'** for the former and **'Inference'** for the latter.
  2.  **'Ritual':** The 'Thin' Camp hears this as 'religious/magical'. The 'Thick' Camp uses it to mean 'formalised, rule-governed behaviour that is non-utilitarian'. We agree to use the latter definition for the purposes of this session, acknowledging that 'non-utilitarian' is itself an inference.
  3.  **'Belief':** The 'Thin' Camp objects to this as implying internal mental states. The 'Thick' Camp agrees to rephrase claims as **'Cosmological Frameworks'** or **'Shared Normative Systems'**, acknowledging we are inferring public structures of meaning, not private thoughts.
  4.  **'Projection':** The 'Thin' Camp accuses the 'Thick' Camp of projecting modern categories. The 'Thick' Camp agrees to explicitly state when a bridging principle is derived from ethnography versus material constraint, to minimise the charge of anachronism.

  **Signed:**

  _________________________ (Representative, Thin Camp)

  _________________________ (Representative, Thick Camp)

  _________________________ (Session Chair)
