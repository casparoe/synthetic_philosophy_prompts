prompt: |-
  Two of my colleagues have been feuding for about three years over how far you can get from objects to beliefs, and I've ended up chairing the session where they're supposed to produce something joint. Can you draft the document they could both actually sign?

  Call them the thin camp and the thick camp. Thin: from material remains you can licence claims about behaviour, economy, ecology and maybe some very coarse social facts — settlement scale, a few proxies for hierarchy — but claims about beliefs, meanings, ritual content, cosmology, ancestors, aren't claims at all, they're glosses; the honest statement is only that people did something repeatedly and rule-governedly. Same for institutions: you can say a settlement had a big building, not that it had a council. Thick: with enough patterning, plus bridging principles motivated independently of the case in hand — taphonomy, experimental work, cross-cultural distributions, constraints on ritual form — you can support real, graded claims about what people believed and how they were organised, and refusing to make them isn't caution, its just refusing to explain.

  What I want: (1) a numbered list of claims both of them can sign, including what the record can and can't do, and where each thinks the other's rhetoric overreaches; (2) the surviving disagreements, each phrased so the side it belongs to would accept the wording as fair — a table is fine; (3) the cruxes, the sub-questions where settling one would actually move somebody. I suspect one is whether a bridging principle can be warranted independently of the very cases it's used to interpret, and another is whether the underdetermination they keep invoking is specific to belief-claims or bites just as hard on the thin camp's own behavioural claims — if the latter, I want to know what that costs them; (4) for each crux, the case or test both of them would agree bears on it, with each side's prediction written down in advance; and (5) if part of the fight is verbal, say which part and why.

  Hang it on this. At a settlement I've been digging — late Bronze Age, occupied more or less continuously for four centuries — nearly every adult burial contains a small pot, and in about nine out of ten of them the pot has a hole punched through the base before it goes into the ground. The fabric is the same as the everyday cooking pots, but the forms are miniatures, and they turn up only in graves: never in houses, never in middens. There's also a pit under one house threshold with eleven of them in it, all holed. My gut says the claim to make is that the dead were given a vessel that had been killed, i.e. a belief claim, and that it's a good one. My colleague says I'm just projecting a modern idea of what a hole in a pot means.

  No reading lists, no citations — we all know the literature, I just want the document. British English spelling please.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Context:** A chairperson mediating a three-year feud between two colleagues ("Thin Camp" vs. "Thick Camp") regarding archaeological interpretation (objects to beliefs).
      *   **Task:** Draft a joint document they can both sign.
      *   **Specific Requirements:**
          1.  Numbered list of agreed claims (capabilities/limitations of the record, mutual critiques of overreach).
          2.  Table of surviving disagreements (phrased fairly for each side).
          3.  Identification of cruxes (sub-questions that would move the needle), specifically regarding independent warrant for bridging principles and underdetermination.
          4.  Agreed cases/tests for each crux with pre-registered predictions from both sides.
          5.  Identification of verbal/semantic disputes.
      *   **Case Study:** Late Bronze Age settlement (400 years occupation). Adult burials have small pots (miniatures, same fabric as cooking pots). 90% have holes punched in the base. Found *only* in graves + one threshold pit (11 pots).
      *   **User's Position:** Leans "Thick" (belief claim: "vessel killed for the dead").
      *   **Colleague's Position:** Leans "Thin" (projection of modern ideas).
      *   **Constraints:** No reading lists/citations. British English spelling.

  2.  **Deconstruct the Positions:**
      *   **Thin Camp:** Skeptical of inferring beliefs/meanings. Focus on behaviour, economy, ecology. "Belief" claims are glosses. Institutions are just physical structures (big building $\neq$ council).
      *   **Thick Camp:** Believes patterned data + bridging principles allow graded claims about belief/organisation. Refusal to interpret is a failure to explain.
      *   **The Feud:** Epistemological. How much inference is justified? What counts as evidence?

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be formal but descriptive. "Joint Statement on Inferential Limits..."
      *   **Introduction:** Acknowledge the context (the session, the goal).

      *   **Section 1: Agreed Claims (Numbered List):**
          *   Need common ground. Both agree data is material. Both agree speculation without pattern is bad. Both agree the other overreaches rhetorically.
          *   *Drafting points:* The record is fragmentary. Pattern is necessary. "Belief" is a loaded term. Thin overstates certainty of behaviour. Thick overstates certainty of meaning.

      *   **Section 2: Surviving Disagreements (Table):**
          *   Need to phrase these so each side says "Yes, that's what I mean."
          *   *Thin:* Interpretations of meaning are inherently unverifiable.
          *   *Thick:* Explanations without meaning are descriptively inadequate.
          *   *Thin:* Bridging principles are often circular.
          *   *Thick:* Refusing inference paralyses the discipline.

      *   **Section 3: The Cruxes (Epistemological Bottlenecks):**
          *   *Crux 1: Independent Warrant.* Can a bridging principle (e.g., "breaking = killing") be established *without* referencing the specific archaeological case?
          *   *Crux 2: Underdetermination.* Does the lack of unique solution apply equally to "behaviour" (Thin) and "belief" (Thick)? If I say "they ate," is that also underdetermined?
          *   *Cost:* If underdetermination bites Thin too, they must admit their "facts" are also theoretical constructs.

      *   **Section 4: Tests/Cases (The Bronze Age Pots):**
          *   Use the user's specific example.
          *   *Test:* The Threshold Pit.
          *   *Thin Prediction:* It's a discard pattern or foundation deposit (behavioural rule), no need for "killing" semantics.
          *   *Thick Prediction:* The specific act of holing is semantically loaded (ritual killing), distinct from discard.
          *   *Test:* Cross-cultural/Experimental.
          *   *Thin:* Show me a society where holing *doesn't* mean killing.
          *   *Thick:* Show me a society where holing *consistently* correlates with specific cosmological views.

      *   **Section 5: Verbal Disputes:**
          *   What is a "fact"? What is "belief"?
          *   Thin uses "fact" for low-level inference. Thick uses "claim" for high-level inference.
          *   The word "Ritual" is likely a flashpoint.

  4.  **Refining and Polishing (British English & Tone):**
      *   Ensure "programme," "behaviour," "centre," etc.
      *   Tone must be diplomatic but precise. It's a "Joint Statement," not a surrender.
      *   Make sure the User's specific case (the pots) is integrated as the testing ground, as requested ("Hang it on this").
      *   Check against constraints: No citations. Numbered list for agreements. Table for disagreements.

  5.  **Self-Correction/Review during drafting:**
