  0.67

  That is my credence that your attitude is a bias rather than a permissible preference. Below is the decomposition of that figure.

  ### The Machinery

  To arrive at this number, I treat the definition of "bias" as a hypothesis space partitioned into three competing accounts. I assign a prior probability to each account being the correct meta-ethical description of bias, then assess the likelihood that your specific attitude qualifies as bias under that account.

  **1. The Error Account**
  *   **Definition:** An attitude is a bias if it rests on a false empirical or normative belief (e.g., "Compatriots are inherently more deserving").
  *   **P(Account is Correct):** 0.20. (Bias often persists even when false beliefs are corrected, suggesting error is insufficient to define it).
  *   **P(Attitude is Bias | Account):** 0.40. (You do not explicitly claim compatriots are *more deserving*, only that you *prefer* them. This looks more like a weighting difference than a factual error, though it may imply one).
  *   **Contribution:** $0.20 \times 0.40 = 0.08$

  **2. The Distortion Account**
  *   **Definition:** An attitude is a bias if it is sensitive to normatively irrelevant features (e.g., facial resemblance, proximity) in a context demanding impartiality.
  *   **P(Account is Correct):** 0.50. (This is the dominant view in cognitive science and moral psychology; sensitivity profiles are the primary marker of bias).
  *   **P(Attitude is Bias | Account):** 0.90. (You explicitly admit the attitude is sensitive to "faces resemble mine" and "images are familiar." Under this account, that admission is nearly conclusive).
  *   **Contribution:** $0.50 \times 0.90 = 0.45$

  **3. The Laundering Account**
  *   **Definition:** An attitude is a bias if it serves a social function (e.g., maintaining inequality) that the agent would disavow if understood, making current endorsement unreliable.
  *   **P(Account is Correct):** 0.30. (Crucial for structural analysis, but sometimes overextends to individual psychology).
  *   **P(Attitude is Bias | Account):** 0.70. (Your friend argues your endorsement *is* the laundering. While I do not assign certainty to her claim, the risk that your reflection is constrained by local norms is substantial).
  *   **Contribution:** $0.30 \times 0.70 = 0.21$

  **Subtotal (Weighted Sum):** $0.08 + 0.45 + 0.21 = 0.74$

  ### The Dispositive Clause

  You introduced a defeater: *Sincere, stable, reflective non-disavowal.* If this condition holds, you argue the attitude cannot be a bias.

  *   **P(Non-Disavowal is Dispositive):** 0.10.
      *   *Reasoning:* Philosophical and psychological consensus rejects the idea that introspection is sovereign. Agents frequently endorse internalized biases (e.g., internalized sexism or racism) sincerely and stably. Reflection is necessary but not sufficient to cleanse an attitude of bias.
  *   **Adjustment:**
      *   If Non-Disavowal *is* dispositive (10% chance), P(Bias) = 0.
      *   If Non-Disavowal *is not* dispositive (90% chance), P(Bias) = 0.74 (the Subtotal above).
      *   **Final Calculation:** $(0.10 \times 0) + (0.90 \times 0.74) = 0.666$.

  **Final Credence:** 0.67

  ### The Root of the Disagreement

  **Probability that the disagreement lives in the "Non-Disavowal is Dispositive" claim:** 0.85.

  You and your friend are likely agreeing on the *facts* of the case (that you feel resistance, that it tracks resemblance, that you endorse it). You are disagreeing on the *authority* of that endorsement. You treat your reflective endorsement as a veto on the label "bias." Your friend treats your reflective endorsement as data point that is itself subject to bias analysis. My calculation sides heavily with your friend here (assigning only 0.10 probability to your veto power), which is why my number (0.67) is much closer to her estimate (0.75) than to yours (0.30).

  ### Sensitivity Analysis

  **The Pivot Term:** $P(\text{Attitude is Bias} \mid \text{Distortion Account})$.
  Currently set at **0.90**. This term contributes 0.45 to the subtotal, making it the single largest driver of the final verdict.

  **Movement Required to Flip Verdict:**
  To move my final credence below 0.50 (flipping the judgment from "likely bias" to "ambiguous/permissible"), this term would need to drop from **0.90 to 0.55**.
  *   *Math:* If the term becomes 0.55, the Distortion contribution becomes $0.50 \times 0.55 = 0.275$. The new Subtotal is $0.08 + 0.275 + 0.21 = 0.565$. The Final Credence becomes $0.90 \times 0.565 \approx 0.51$.
  *   *Correction:* To get clearly under 0.50, I need to drop it further, to roughly **0.50**.
  *   *Meaning:* I would need to be convinced that sensitivity to "resemblance" and "familiarity" is *not* a normative distortion in the context of charitable giving.

  **Actionable Evidence:**
  Do not seek philosophical arguments. Seek a **Marginal Utility Audit**.

  The Distortion Account labels "resemblance" as irrelevant *only if* need is the sole relevant metric. If domestic giving produces significantly higher *actual utility* per dollar due to logistical efficiency, monitoring capability, or multiplier effects, then "resemblance" is a proxy for efficacy, not a distortion.

  **The Test:**
  Select the specific domestic organization you fund. Select the specific foreign organization your friend proposes. Commission or perform a rigorous comparison of the **cost-per-outcome** (e.g., cost per life-year saved, cost per child educated) for *marginal* dollars.
  *   **If Domestic is >5x less efficient:** The "resemblance" feature is doing the work. The Distortion probability stays high. My verdict stands.
  *   **If Domestic is roughly equal or more efficient:** Then your preference tracks *efficacy*, not *resemblance*, even if resemblance correlates with it. The sensitivity profile changes. $P(\text{Bias} \mid \text{Distortion})$ drops. My verdict flips.

  Your resistance is likely bias. Your endorsement is likely insufficient to cleanse it. But if your domestic giving is objectively more potent, the bias charge dissolves. Go measure the potency.
