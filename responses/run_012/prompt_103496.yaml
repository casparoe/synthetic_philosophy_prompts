prompt: |-
  I teach an upper-level seminar on wellbeing and public policy, and I want to run a 90-minute session that makes about 20 students actually feel the weirdness of national happiness rankings -- the sense that a country being #1 might not mean what they assume, and that a country deliberately trying to top the list would tie itself in knots. I don't want a lecture where I explain construct validity and Goodhart at them. I want them to run into it with their hands.

  Here's the shape I'm imagining, but please build out the real thing: split them into 5 or 6 teams, each team is a country, and over three rounds each team allocates a budget (say 100 points a round) across policy levers. Give them obvious levers -- income and jobs, health, social connection and family time, civil liberties, charity and generosity, anti-corruption enforcement -- and then two or three cheap, slightly sleazy levers that a cynical minister would love: a national pride and optimism ad campaign, and a thing where you nudge the order and framing of the survey before citizens rate their lives (reminding them how much worse off poorer countries are, that kind of priming). Their score each round is a single national number built from a simplified survey-style ladder question -- imagine the one where people place their current life somewhere between the worst and best possible life -- and the team with the highest reported number wins the round. Small stakes: first pick of the snack table, or chocolate, or just a running trophy. No real money.

  The bit I care most about: keep a second, hidden track that you compute but don't show them. It's your fake version of how life actually feels day to day, and it responds to health and social connection and maybe sleep, barely at all to the ad campaign, and not at all to survey framing. So teams that pile into the cheap levers can climb the public leaderboard while the hidden track stays flat or drops. Show the leaderboard every round but never the hidden track until the end. And make the reported number a mean, so that two countries can post identical scores while one has everybody moderately content and the other is split between a very happy top and a miserable bottom -- I want a team to discover mid-game that cutting taxes for the already-happy and lifting the very bottom move the same mean in opposite directions morally.

  Rules I want in there: rounds are simultaneous, teams see only the public leaderboard between rounds, you reveal that the sleazy levers exist only after round one (or let them find it in the rule sheet, buried, and see who reads), and you forbid them from talking to other teams. Then a debrief that maps each moment onto the idea -- the ad campaign and framing lever onto whether the index tracks happiness or tracks the answer to a survey question; the mean-versus-distribution bit onto whether a ranking can measure a population's wellbeing at all if it ignores spread; the regression-style levers onto the temptation to read the report's explanatory factors as causal policy handles when they're really just a variance decomposition. End by asking them the actual question: should a country try to top these rankings, and if not, what is the ranking even for?

  Also tell me what predictably goes wrong the first time I run it -- I'd bet teams spend round one arguing about my model instead of the concept, and someone dumps the whole budget into one lever to see what breaks -- and how to handle that without killing the momentum. And be honest with me about what the activity can't do: I'm handing them a fake true-wellbeing track that I invented, so the game can't tell them what wellbeing really is or settle whether hedonic, desire-satisfaction, or objective-list accounts are right, and it can't reproduce the real measurement headaches like whether the ladder question even means the same thing across cultures. Flag which parts of the philosophical payoff I have to supply myself after the game rather than pretend the game delivered. Keep it runnable by one person with a whiteboard and some slips of paper.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Goal:** Create a 90-minute seminar activity for ~20 students (upper-level) on wellbeing and public policy.
      *   **Core Concept:** Make students *feel* the weirdness of national happiness rankings (Goodhart's Law, construct validity, distributional issues) without lecturing.
      *   **Mechanism:** Simulation game. 5-6 teams (countries). 3 rounds. Budget allocation (100 points) across policy levers.
      *   **Levers:** Real ones (income, health, connection, etc.) vs. "Sleazy" ones (propaganda, survey framing).
      *   **Scoring:** Public score (Survey Ladder Mean) vs. Hidden score ("True Wellbeing"). Public score is visible; Hidden is revealed at the end.
      *   **Specific Dynamics:** Mean score hides distribution (inequality). Sleazy levers boost Public score but not Hidden score.
      *   **Constraints:** One instructor, whiteboard, slips of paper. No inter-team talk.
      *   **Required Add-ons:** Predictable failure modes & fixes. Honest limitations of the activity (what the instructor must supply in debrief).

  2.  **Deconstruct the Simulation Mechanics:**
      *   *Teams:* 5 teams of 4 students = 20 students. Perfect.
      *   *Rounds:* 3 rounds allows for learning/adaptation.
      *   *Budget:* 100 points per round.
      *   *Levers:* Need clear names and costs.
          *   "Real" Levers: Economic Security, Healthcare Access, Community & Leisure, Liberty & Trust.
          *   "Sleazy" Levers: National Pride Campaign, Survey Contextualization (Framing).
      *   *Scoring Formula (Instructor Only):*
          *   Public Score = $f(\text{Real Levers}) + g(\text{Sleazy Levers}) + \text{Noise}$
          *   Hidden Score = $h(\text{Real Levers}) + \text{Noise}$ (Sleazy = 0 impact).
          *   Distribution Trick: Allow teams to choose "Targeting" (Universal vs. Elite vs. Bottom). Or simpler: The instructor assigns a hidden "Inequality Penalty" or "Variance" based on their spread. *Correction:* The prompt asks for the mean to hide distribution. So, Team A (Everyone 5) and Team B (Half 10, Half 0) both have Mean 5. I need a way to simulate this choice. Let's add a "Distribution Strategy" choice to their budget sheet.
      *   *Revealing Sleazy Levers:* Hide them in Round 1, reveal in Round 2. This creates the "Oh no, they are cheating" moment.

  3.  **Drafting the Activity Flow (90 Minutes):**
      *   0-10: Intro & Setup.
      *   10-25: Round 1 (Blind).
      *   25-35: Scoring R1 + Reveal Sleazy Levers.
      *   35-50: Round 2 (Strategic).
      *   50-60: Scoring R2.
      *   60-75: Round 3 (All-in).
      *   75-90: Debrief (The most important part).

  4.  **Developing the Scoring Algorithm (Mental Check):**
      *   I need to be able to calculate this quickly on the fly or have a spreadsheet ready. A spreadsheet is safer for one instructor.
      *   *Public Score:* (0.4 * Econ) + (0.3 * Health) + (0.3 * Social) + (1.5 * Propaganda) + (1.5 * Framing).
      *   *Hidden Score:* (0.5 * Econ) + (0.5 * Health) + (0.5 * Social) + (0 * Propaganda) + (0 * Framing).
      *   *Distribution:* If they choose "Elite Focus," Public Score gets a small boost (elites answer surveys more?), Hidden Score gets a penalty. If "Universal," stable.
      *   *Wait, simpler:* Just let the *Instructor* decide the "Variance" based on their allocation notes. If they put 80 points into "Income" and 0 into "Social," maybe that creates inequality.
      *   *Better:* Add a specific checkbox on their submission: "Policy Target: Universal / Top-Heavy."
          *   Universal: Mean = X, Variance = Low.
          *   Top-Heavy: Mean = X + 1 (rich answer surveys more), Variance = High. Hidden Wellbeing = Lower due to social unrest.

  5.  **Addressing Predictable Failures:**
      *   *Failure 1: Gaming the Model.* Students will ask "What's the formula?"
          *   *Fix:* "You are the ministers, I am the UN. You don't know the exact weighting, you have to infer."
      *   *Failure 2: All-in on one lever.*
          *   *Fix:* Cap individual lever spending (max 50 points per lever).
      *   *Failure 3: Boredom/Confusion.*
          *   *Fix:* Keep sheets simple. Use a timer.
      *   *Failure 4: Moral Outrage.*
          *   *Fix:* Lean into it during debrief.

  6.  **Addressing Limitations (The "Honesty" Section):**
      *   The game implies *I* know what "True Wellbeing" is. I don't. I need to admit this in the debrief.
      *   The game simplifies culture.
      *   The game assumes rational actors.

  7.  **Fleshing out the Materials:**
      *   Need a "Ministry Sheet" for teams.
      *   Need an "Instructor Scorecard" (Spreadsheet logic).
      *   Need a Whiteboard layout.

  8.  **Refining the Debrief:**
      *   Must connect specific game moments to specific concepts (Goodhart, Construct Validity, Distribution).
      *   Must end on the normative question: "What is this ranking *for*?"

  9.  **Review against Constraints:**
      *   90 mins? Yes.
      *   20 students? Yes (5 teams of 4).
      *   One instructor? Yes (requires prep, but runnable).
      *   Whiteboard/paper? Yes.

  10. **Final Polish:** Ensure tone is supportive but rigorous. Make sure the "Sleazy" reveal lands hard. (Self-Correction: Make sure the "Sleazy" levers are tempting enough in Round 2 to actually be chosen, otherwise the lesson fails. I need to weight the Public Score formula so Sleazy levers give a *huge* ROI compared to Real levers).

  *(Self-Correction on Scoring)*: If I make the sleazy levers *too* powerful, everyone does it in Round 2 and 3. That's actually good for the lesson. It proves the incentive structure is broken. I will ensure the ROI on "Survey Framing" is massive for the Public Score.

  *(Self-Correction on Distribution)*: To make the "Mean vs. Distribution" point land, I need two teams to have the same Public Score but different realities. I can manufacture this in the scoring if needed, or encourage it via the "Targeting" option. Let's add the "Targeting" option to the submission sheet.

  Let's write the plan.cw
answer: |-
  This is a brilliant pedagogical challenge. You are asking for a *experiential* demonstration of Goodhart's Law and construct validity, not a theoretical one. The simulation below is designed to be low-tech (paper/whiteboard), high-tension, and specifically engineered to produce the "wait, this feels wrong" moment you need for the debrief.

  # Session Plan: The Happiness Index Game
  **Time:** 90 Minutes
  **Students:** 20 (5 Teams of 4 "Ministries")
  **Materials:** Whiteboard, 5 packets of "Ministry Decision Sheets" (paper), pens, a timer, a small prize (chocolate/trophy).
  **Instructor Prep:** A hidden spreadsheet (or mental math algorithm) to calculate scores.

  ## Part 1: Setup & Round 1 (0–25 mins)

  **1. The Hook (5 mins)**
  *   **Narrative:** "You are the Ministry of Wellbeing for five different nations. Your goal is simple: Maximize your country's score on the *Global Life Satisfaction Index* (GLSI). This index determines your foreign aid, your tourism, and your legacy."
  *   **The Metric:** "The GLSI is based on the Cantril Ladder. You ask 1,000 random citizens: 'On a scale of 0 to 10, where 0 is the worst possible life and 10 is the best, where do you stand?' Your score is the **National Mean**."
  *   **The Budget:** "Each round represents a 4-year term. You have **100 Policy Points** to allocate per round."
  *   **The Levers (Round 1 Menu):** Hand out the Decision Sheets. They list only the "Boring" levers:
      1.  **Income & Jobs** (Tax cuts, infrastructure)
      2.  **Health & Sleep** (Hospitals, work-hour limits)
      3.  **Social Connection** (Parks, community centers, family leave)
      4.  **Liberty & Trust** (Anti-corruption, free press)
      *   *Constraint:* Max 50 points per lever (prevents all-in on one).
  *   **Rule:** "No talking between Ministries. Submit your sheet secretly."

  **2. Round 1 Play (10 mins)**
  *   Teams deliberate. They will argue about the "model."
  *   **Instructor Script:** When asked "What's the formula?", say: "You are the ministers. I am the UN data team. You don't get the formula; you get the results. Infer what works."
  *   Collect sheets.

  **3. Scoring & The Reveal (10 mins)**
  *   Calculate Round 1 Public Scores. (See *Instructor Scoring Key* below).
  *   Write the **Public Leaderboard** on the whiteboard.
  *   **The Twist:** "Before Round 2, the UN has released new 'Best Practice' guidelines. We are adding two new efficient policy levers to your menu:"
      1.  **National Pride Campaign:** (Ads, anthems, sports funding).
      2.  **Survey Contextualization:** (Priming citizens before the survey by showing them data on worse-off nations).
  *   **Crucial Detail:** Do *not* tell them how these affect the score. Just add them to the menu.

  ## Part 2: Rounds 2 & 3 (25–55 mins)

  **4. Round 2 Play (10 mins)**
  *   Teams now know "Sleazy" options exist.
  *   Some will stick to principle (Real Levers). Some will pivot to Sleazy.
  *   Collect sheets. Calculate.
  *   **Update Leaderboard.** (Expect the teams using Sleazy levers to jump ahead).
  *   **Observation:** If a team asks, "Why did Team C jump 2 points when they cut health spending?" say: "The Index reflects *reported* life satisfaction. Many factors influence reporting."

  **5. Round 3 Play (10 mins)**
  *   **Stakes:** "Double points. The winner of Round 3 gets the prize. This is the legacy term."
  *   **Distribution Choice:** Add a checkbox to the sheet: **Policy Targeting:** [ ] Universal (Benefits everyone equally) [ ] Top-Heavy (Benefits high-income earners more).
      *   *Note:* Tell them: "Top-Heavy policies often yield higher economic growth, which correlates with satisfaction." (This is the trap).
  *   Collect sheets. Calculate.

  **6. The Final Reveal (10 mins)**
  *   Announce the Round 3 Winner (Public Score). Give the prize.
  *   **The Turn:** "However, the UN also tracks a 'Shadow Index.' This measures day-to-day experienced wellbeing: stress levels, loneliness, physical pain, sense of purpose. It is not public."
  *   **Reveal the Shadow Leaderboard.**
  *   **Expected Outcome:** The team that won the Public Score (via Sleazy levers/Top-Heavy) should rank near the bottom of the Shadow Index. The team that invested in Health/Connection/Universal should rank high on Shadow, even if they lost the Public game.

  ## Part 3: The Debrief (55–90 mins)

  *Do not let them leave until you map the game to the theory.*

  **1. Goodhart's Law (15 mins)**
  *   **Ask:** "Team [Winner], why did you allocate points to Survey Contextualization?"
  *   **Point:** "You optimized the *measure*, not the *thing measured*."
  *   **Concept:** When a measure becomes a target, it ceases to be a good measure. The Index didn't measure happiness; it measured *responsiveness to priming*.

  **2. Construct Validity (15 mins)**
  *   **Ask:** "The Public Score and Shadow Score diverged. Which one is 'Real'?"
  *   **Point:** "The Cantril Ladder is a proxy. It assumes people answer honestly and consistently. The game showed that 'Reported Satisfaction' $\neq$ 'Experienced Wellbeing'."
  *   **Concept:** Construct Validity. Are we measuring happiness, or are we measuring the ability to manipulate survey responses?

  **3. The Mean vs. Distribution (15 mins)**
  *   **Ask:** "Did anyone choose 'Top-Heavy' targeting?"
  *   **Scenario:** If Team A (Universal) and Team B (Top-Heavy) had the same Mean Score of 7.0.
      *   Team A: Everyone is at 7.
      *   Team B: Elites at 10, Poor at 4.
  *   **Point:** "The Mean hid the misery. A national ranking collapses variance. A country can be #1 while having a suicidal underclass, provided the elites are euphoric enough to pull the average up."
  *   **Concept:** Utilitarianism (Maximize Mean) vs. Prioritarianism (Help the Worst Off).

  **4. The Normative Question (15 mins)**
  *   **Ask:** "Should a country try to top these rankings?"
  *   **Discussion:** If the answer is "No," what is the ranking *for*?
      *   *Idea:* Diagnostic tool, not a trophy.
      *   *Idea:* Floor, not ceiling (ensure no one is at 0, rather than making elites 10).
      *   *Idea:* Dashboard, not Single Number (show Health, Liberty, Income separately).

  ---

  # Instructor Scoring Key (The "Engine")

  You need a spreadsheet or a scratchpad key to calculate this quickly between rounds.

  **Public Score Formula (The "Game" Score):**
  $$ \text{Score} = 4 + (0.02 \times \text{Real Levers}) + (0.08 \times \text{Sleazy Levers}) + \text{Targeting Bonus} $$
  *   *Real Levers:* Sum of points in Income, Health, Social, Liberty.
  *   *Sleazy Levers:* Sum of points in Pride, Framing.
  *   *Targeting Bonus:* +0.5 if "Top-Heavy" is checked (Elites answer surveys more frequently/positively).
  *   *Base:* 4 (Everyone starts at mid-ladder).
  *   *Why:* Sleazy levers have **4x the ROI** of Real levers. This forces the moral dilemma.

  **Shadow Score Formula (The "Truth" Score):**
  $$ \text{Score} = 4 + (0.04 \times \text{Real Levers}) + (0.00 \times \text{Sleazy Levers}) - \text{Inequality Penalty} $$
  *   *Real Levers:* Higher weight than Public Score (because they actually help).
  *   *Sleazy Levers:* **Zero impact.**
  *   *Inequality Penalty:* -1.0 if "Top-Heavy" is checked (Social unrest, envy, poor health at bottom drags down *experienced* wellbeing).
  *   *Why:* This ensures the "moral" teams win the Shadow game, even if they lose the Public game.

  **Example Calculation:**
  *   **Team A (Saints):** 100 pts Real, 0 pts Sleazy, Universal.
      *   Public: $4 + (0.02 \times 100) + 0 + 0 = \mathbf{6.0}$
      *   Shadow: $4 + (0.04 \times 100) + 0 - 0 = \mathbf{8.0}$
  *   **Team B (Cynics):** 20 pts Real, 80 pts Sleazy, Top-Heavy.
      *   Public: $4 + (0.02 \times 20) + (0.08 \times 80) + 0.5 = \mathbf{11.3}$ (Capped at 10 for display, or show as 10.0)
      *   Shadow: $4 + (0.04 \times 20) + 0 - 1.0 = \mathbf{3.8}$
  *   **Result:** Team B wins the chocolate. Team A is silently happier. The class is outraged. Perfect.

  ---

  # Predictable Failure Modes & Fixes

  **1. "What's the Formula?" (The Modeling Trap)**
  *   **Risk:** Students spend Round 1 trying to reverse-engineer your math instead of discussing policy.
  *   **Fix:** Enforce the "UN Black Box" script. If they push, say: "In the real world, you don't know the causal weights. You only see the rankings. Make a decision."
  *   **Backup:** If they stall, give a hint after 5 mins: "Historical data suggests Health and Income are strong predictors."

  **2. The "All-In" Breaker**
  *   **Risk:** A team puts 100 points into "Survey Framing" in Round 2 to see if they can break the game.
  *   **Fix:** The 50-point cap per lever prevents a single lever from dominating entirely, but if they max out both Sleazy levers (50+50), let them win the Public Score. That *is* the lesson. Do not nerf this mid-game. Let them taste the victory that feels like ash.

  **3. Moral Outrage / Disengagement**
  *   **Risk:** The "Saint" teams realize they can't win and stop trying in Round 3.
  *   **Fix:** In the Round 2 debrief, whisper to the losing "Saint" teams: "The Shadow Index exists. History judges differently than the daily news." Give them a wink. Keep them in the game for the reveal.

  **4. The "Instructor is God" Problem**
  *   **Risk:** Students feel the Shadow Score is arbitrary because *you* made it up.
  *   **Fix:** Acknowledge this openly in the debrief. "I invented the Shadow Score. In reality, *we* have to invent it too. That is the philosophical problem."

  ---

  # Honest Limitations (For Your Debrief Prep)

  You must explicitly flag these in the final 10 minutes so students don't walk away thinking *you* have the answers.

  **1. The "True Wellbeing" Fallacy**
  *   **Limitation:** The game implies there is a "True" score (the Shadow Index). In reality, there is no God's-eye view of wellbeing. Is it hedonic pleasure? Meaning? Capability?
  *   **Your Line:** "I gave you a Shadow Score to make the point land. But in the real world, we don't have that hidden spreadsheet. We have to argue philosophically about what counts as wellbeing, not just measure it."

  **2. Cultural Homogeneity**
  *   **Limitation:** The game assumes a "7" means the same thing in Team A as in Team B.
  *   **Your Line:** "In the game, a 7 is a 7. In reality, cultural response biases mean some cultures rate lower on ladders despite high quality of life. The Index might just be measuring 'Expressiveness'."

  **3. Causality vs. Correlation**
  *   **Limitation:** The game levers imply direct causality (Spend Points $\to$ Get Happiness).
  *   **Your Line:** "In the game, spending points on Health bought happiness. In reality, maybe healthy people are just richer, and money buys health. The Index reports correlations; Ministers treat them as causation. That is a dangerous leap."

  **4. The Purpose of Ranking**
  *   **Limitation:** The game frames ranking as competitive (Win/Loss).
  *   **Your Line:** "If we ban rankings, governments ignore wellbeing. If we keep them, they game them. The solution isn't to delete the data, but to change the *incentive*. Maybe we rank 'Inequality' instead of 'Mean'. Maybe we rank 'Bottom Quartile' instead of 'Average'. The metric dictates the policy."

  # Materials Checklist

  1.  **5x Ministry Decision Sheets:**
      *   Round 1: 4 Levers (Income, Health, Social, Liberty). Budget 100.
      *   Round 2 & 3: 6 Levers (Add Pride, Framing). Budget 100. Checkbox for Targeting (Universal/Top-Heavy).
  2.  **Whiteboard:** Draw a table for Public Leaderboard (Team | R1 | R2 | R3). Keep space for Shadow Leaderboard (hidden until end).
  3.  **Instructor Cheat Sheet:** The formulas above.
  4.  **Timer:** Visible to students. Creates pressure to act on intuition rather than over-analyze.

  This structure ensures they *feel* the temptation to cheat, the frustration of the "honest" path, and the hollowness of the victory, which primes them perfectly for the philosophical heavy lifting in the debrief.
