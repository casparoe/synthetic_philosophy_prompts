  # JOINT STATEMENT ON ECONOMIC CALCULATION AND ALLOCATION MECHANISMS

  **Signatories:**
  *   **The Austrian Signatory** (representing the tradition of Mises and Hayek)
  *   **The Socialist Signatory** (representing the tradition of Lange and Lerner)

  **Date:** October 26, 2023
  **Subject:** Findings following Adversarial Collaboration on Calculation and Incentives

  ### I. AGREED CLAIMS

  1.  **Nature of the Dispute:** We agree that the historical "Socialist Calculation Debate" was not merely semantic. It concerned substantive claims about information processing, incentive compatibility, and dynamic adaptation. However, we agree that much subsequent argumentation devolved into definitional disputes over the word "market" rather than empirical claims about performance.
  2.  **Necessity of Price Signals:** We agree that any complex economy requires a system of ratios (prices) reflecting relative scarcity to coordinate production plans. Pure command allocation without shadow prices or equivalents is inefficient for intermediate goods.
  3.  **The Role of Incentives:** The Austrian Signatory grants that the Lange-Lerner model did not ignore incentives entirely, but relied on managerial rules. The Socialist Signatory grants that the Mises-Hayek critique correctly identified that rules alone are insufficient without a residual claimant structure to enforce discipline.
  4.  **Assessment of the Hybrid Mechanism:** We have jointly analyzed a specific allocation mechanism with the following rules:
      *   An Authority solves a quarterly linear programme (LP) based on final-goods demands.
      *   Shadow prices from the LP are posted as the *only* valid prices for intermediate goods.
      *   Firms report input coefficients to the Authority.
      *   Firms are assigned input quotas but may trade deviations from these assignments at the posted shadow prices.
      *   Consumer goods, occupational choice, and wages remain free (market-determined).
      *   The aggregate investment rate is fixed by the Authority.
  5.  **Verbal Dispute on "The Market":** We agree that whether this mechanism constitutes a "market" is a secondary verbal dispute. The Austrian Signatory prefers the term "Simulated Exchange with Property Constraints"; the Socialist Signatory prefers "Decentralized Socialist Allocation." We agree to evaluate the mechanism based on outcomes (efficiency, innovation, stability) rather than taxonomy.
  6.  **Evidence Standards:** We agree that historical data from 20th-century command economies is insufficient to judge this specific mechanism, as those systems lacked the "trading deviations" clause and free labor markets. We agree that pilot programs or agent-based simulations focusing on Total Factor Productivity (TFP) growth and shock recovery times are the appropriate evidentiary standards.
  7.  **Residual Disagreement:** We acknowledge that our remaining disagreement stems from differing priors on human creativity and the nature of capital. The Austrian Signatory views entrepreneurship as an irreducible alertness to profit opportunities that cannot be modeled in an LP. The Socialist Signatory views entrepreneurship as a manageable function of R&D and managerial autonomy that can be socialized.

  ### II. DISAGREEMENTS AND CRUXES TABLE

  | Domain of Disagreement | Austrian Signatory Position | Socialist Signatory Position | Agreed Crux / Observation | Advance Predictions (Falsification Conditions) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Planner's Primary Obstacle** | The fundamental barrier is **motivating honest use** of information. Without private property in means of production, managers will misreport input coefficients to secure easier quotas (ratchet effect). | The fundamental barrier is **acquiring dispersed knowledge**. Given accurate data, the LP solves allocation efficiently. Incentives can be aligned through career competition and wage differentials. | **Case:** The quarterly reporting of input coefficients.<br>**Observation:** Variance between reported coefficients and actual technical possibilities. | **Austrian:** Systemic padding of coefficients will reduce LP efficiency by >15%.<br>**Socialist:** Coefficient accuracy will improve over 4 quarters as auditing improves.<br>**Move:** If audited coefficients match reported within 5% after Year 1, Austrian concedes incentive point. |
  | **2. Function of the Price System** | Prices exist to **discover unimagined demands** and novel production methods. A quarterly LP fixes the solution space, preventing the emergence of goods not in the initial demand vector. | Prices exist to **clear given demands** at marginal cost. Innovation is a planned R&D output that feeds into the next quarter's LP constraints. | **Case:** Introduction of a new intermediate good not in the original LP.<br>**Observation:** Time lag between invention and allocation approval. | **Austrian:** New intermediates will face >2 quarter lag, stifling adoption.<br>**Socialist:** R&D channels will update LP constraints within the quarter cycle.<br>**Move:** If new intermediate adoption speed matches market benchmarks, Socialist vindicated. |
  | **3. Capital and Investment** | Fixing the investment rate ignores the **time-structure of production**. It will cause malinvestment (boom/bust) because the Authority cannot know the intertemporal preferences of savers vs. investors. | Fixing the investment rate prevents **over-accumulation crises** and ensures long-term public goods are funded despite short-term market myopia. | **Case:** Response to a sudden preference shift toward future consumption (higher savings).<br>**Observation:** Interest rate spread vs. Authority fixed rate. | **Austrian:** Capital bottlenecks will appear in long-gestation projects.<br>**Socialist:** Stability will prevent recessionary spirals seen in free-capital markets.<br>**Move:** If volatility in capital goods sectors is lower without shortages, Socialist vindicated. |
  | **4. Mechanism Output: What it Delivers** | This mechanism will deliver **static allocative efficiency** (matching known means to known ends) better than 20th-century planning, but will fail at **dynamic efficiency**. It will stagnate in innovation. | This mechanism will deliver **equitable growth** and **macro-stability**. It will match market innovation rates because firm-level trading allows local optimization. | **Case:** Total Factor Productivity (TFP) growth over 10 years.<br>**Observation:** Annualized % growth in output per unit of input. | **Austrian:** TFP growth will lag comparable market economies by >1% annually.<br>**Socialist:** TFP growth will match market economies with lower variance.<br>**Move:** 10-year longitudinal data. |
  | **5. Mechanism Output: What it Fails** | It will fail to allocate **unique, heterogeneous capital assets**. The LP treats inputs as homogenous; trading deviations cannot correct for the specific fit of machinery to location without ownership rights. | It will fail to prevent **bureaucratic inertia**. The Authority will become captured by sectoral interests influencing the LP constraints. | **Case:** Reallocation of specialized machinery during a sectoral shock.<br>**Observation:** Time to redeploy assets from declining to growing sectors. | **Austrian:** Assets will remain idle due to lack of ownership transfer rights.<br>**Socialist:** Shadow price shifts will trigger immediate redeployment via trading.<br>**Move:** Asset utilization rates during simulated shock. |
  | **6. Nature of Entrepreneurship** | Entrepreneurship requires **residual claimancy**. Managers trading deviations are still agents, not principals. They will not take high-risk, high-reward bets. | Entrepreneurship is a **skill set**, not a property right. Managers can be incentivized via bonus structures tied to successful deviations. | **Case:** Launch of a high-risk production process.<br>**Observation:** Frequency of high-variance projects undertaken. | **Austrian:** Risk-taking will be below optimal levels (risk aversion).<br>**Socialist:** Risk-taking will be optimal due to bonus caps/floors.<br>**Move:** Comparison of risk-profile portfolios. |

  **Signatures:**

  _________________________
  *The Austrian Signatory*

  _________________________
  *The Socialist Signatory*
