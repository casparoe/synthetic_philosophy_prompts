      *   *Individual Organism:* The intuitive unit. Strong causal role, clear reproduction. But is it a *unit of selection* or a *vehicle*? In standard theory, it's the primary interactor. Score: 9. (Hard to distinguish from gene in terms of "earning keep" for phenotypic adaptation).
      *   *Kin Group/Family:* Kin selection is usually reduced to gene selection (inclusive fitness). As a distinct *unit*, it's shaky. Score: 5.
      *   *Cultural Meme:* Dawkins' extension. High controversy. Is it a genuine unit or a metaphor? Explanatory work is debatable compared to psychological/sociological accounts. Score: 4.
      *   *Species/Clade:* Species selection (Stanley, Vrba). Real phenomenon (differential speciation/extinction), but doesn't explain *adaptation within* lineages well. Score: 6.
      *   *Holobiont:* Hot topic. Hologenome theory. Controversial regarding heritability of the microbiome. Score: 7.
      *   *Transgenerational Epigenetic Inheritance:* Mechanism of inheritance, not necessarily a *unit* itself. But if treated as a unit of inheritance... it challenges the gene. Score: 5.
