      *   *Effective Complexity:* The Postdoc is right about "effective parameters" (degrees of freedom). A shrunk weight isn't doing the same work as a free weight.
      *   *Gzip/Kolmogorov:* Student 3 is invoking Minimum Description Length (MDL). It's not dumb, but it's easily gamed if not standardized. It measures *description length*, not just model structure.
