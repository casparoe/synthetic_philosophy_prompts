prompt: |-
  Alright, I need practical advice, and I'm asking you rather than looking it up because I want the version that helps me in a room, not a reading list.

  I'm the philosopher attached to our cognitive science group's modeling lab. I sit in on their meetings, I teach the philosophy of science course, and somehow that makes me the person they hand their technical disputes to. Fine. Here's the dispute.

  Two of them, a grad student and a postdoc, have rival models of the same data set: a few thousand trials from a categorization experiment. His is a hand-coded process model, maybe eight lines of actual math. Hers is a small neural net. They fit the data about equally well, and the difference between them isnt statistically meaningful. The grad student says his model is simpler, so it's more likely to be the true one. The postdoc says that's backwards: hers is simpler even though her net has way more knobs, because each of those knobs is coarse and shrunk toward zero, while his three numbers are each pinned down to five decimal places, and you can smuggle a shocking amount of structure into a single number if you're allowed enough digits. Honestly that seems like a real hit.

  Then a third student says the whole thing is decidable: gzip both models, code and all, along with the data, and compare the byte counts. A fourth says no, just count parameters, that's what the information criteria do anyway. They've asked me to settle it Friday, and if I say "well, simplicity is language-relative, it's complicated," I lose the room.

  So what do I actually do? Is there a principled version of this contest, and if so, what are the rules? Is the gzip idea dumb, and if it is, is it dumb for the reason the third student thinks it's smart? If I let them run the compression experiment anyway, what has to be nailed down before the result means anything? What's the step between 'simple' and 'probable' that the grad student is skipping? And does any of this change once they collect more data, which they're planning to do?

  American English, please, and skip the citations. I need to be the person in the room who knows what's going on.
