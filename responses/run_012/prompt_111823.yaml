answer: |-
  Here is how you handle this. You need to stop them from arguing about metaphysics ("which is true") and force them to argue about engineering ("which predicts").

  Here is the breakdown of the moves, the traps, and exactly what you should say on Friday.

  ### 1. The Core Principle: Prediction, Not Truth
  The grad student is making the classic mistake. He thinks simplicity makes a model *true*. It doesn't. Simplicity makes a model *risky*.

  A model with three parameters pinned to five decimal places is making a very specific, risky bet. A neural net with shrunk weights is making a softer, broader bet. If the three-parameter model hits the mark, it wins big because it took a bigger risk. If it misses, it loses hard.

  The step the grad student is skipping is **predictive risk**. You don't get probability for free just because your equation is short. You get it because a short equation forces you to commit to a specific outcome, and if that outcome happens, you get a higher likelihood score.

  **Your move:** Tell them that since both models fit the current data equally well, the one with the tighter constraints (the grad student's) *should* have a higher score on information criteria. If it doesn't, his "simplicity" isn't actually simplifying the prediction space, it's just hiding complexity in the constants.

  ### 2. The Gzip Idea (Minimum Description Length)
  The third student is stumbling onto **Minimum Description Length (MDL)**. It is not dumb. In fact, it is arguably the most principled way to settle this without collecting new data.

  However, it is easily rigged.
  *   **The Trap:** If the postdoc writes her code in Python with heavy library imports and the grad student writes his in C, the gzip test measures the size of the libraries, not the model. If they compress the data differently (e.g., text vs. binary), the test measures the encoding, not the structure.
  *   **The Fix:** If you let them run this, you must standardize the environment.
      1.  Same language, same standard libraries only.
      2.  The "code" must include the instructions to reconstruct the data from the model (the residuals).
      3.  You are measuring the length of: *Model Description + Errors*.
      4.  If the neural net fits better, its errors are smaller (cheaper to encode). If the process model is simpler, its description is smaller. The winner is the shortest total file.

  **Your verdict on this:** Tell them the gzip idea is valid *only* if they agree on a strict protocol for the file structure. Otherwise, it's a contest of who knows compression better, not cognitive science. If they can't agree on the protocol, discard it.

  ### 3. The Parameter Count (Student Four)
  Student four is wrong. Counting raw parameters is obsolete for this dispute.

  The postdoc is correct: a weight shrunk to zero by regularization is not doing the same work as a free parameter. In a regularized network, the "effective number of parameters" is often much lower than the actual count. Conversely, the grad student's three numbers, if they are tuned to five decimal places to fit noise, are effectively acting like hundreds of parameters.

  **Your verdict:** Raw parameter counting is out. It ignores the "volume" of the parameter space. A model that allows any number between 0 and 1 is more complex than a model that forces the number to be 0.5, even if both have "one parameter."

  ### 4. The Friday Script
  You need to take control of the whiteboard. Here is the sequence:

  **Step 1: Redefine the Goal.**
  "Stop arguing about which model is 'true.' We don't know the ground truth. We are arguing about which model will survive contact with *new* data. Simplicity is not a virtue in itself; it is a hedge against overfitting."

  **Step 2: Address the Fit.**
  "You both fit the current data equally well. That means the current data is not enough to distinguish you. Arguing about the current fit is dead. We need to talk about generalization."

  **Step 3: The Decision Procedure.**
  "Here is how we settle this. We have two options."

  *   **Option A (The Empirical Hammer):** "We hold out 20% of the data right now. We do not touch it. You both train on the 80%. Then we test on the 20%. The one that degrades less wins. This is cross-validation. It is the only metric that actually measures what we care about."
  *   **Option B (The Complexity Penalty):** "If we cannot hold out data, we use a metric that penalizes complexity correctly. Do not use raw parameter count. Use AICc or BIC, but acknowledge the Postdoc's point: if the network is regularized, the penalty must reflect *effective* degrees of freedom, not raw weights. If you can't calculate effective degrees of freedom, you must use the Gzip method, but only under a standardized coding protocol."

  **Step 4: Shut Down the "Truth" Claim.**
  "Grad student, your model is not 'more likely to be true' because it is short. It is only more probable if its brevity allows it to predict new data as well as the network. If the network predicts better, the network wins, regardless of how many knobs it has."

  ### 5. What About New Data?
  You asked if this changes when they collect more data. **Yes, completely.**

  Currently, they are in the "accommodation" phase. They are bending their models to fit what already happened. This is where overfitting lives.
  Once they collect new data, they move to the "prediction" phase.

  *   **If the Grad Student's model is structurally correct:** It will generalize beautifully. The three numbers will hold steady.
  *   **If the Grad Student's model is just a lucky curve:** The new data will break it. He will have to add more parameters (more lines of math) to fix it.
  *   **If the Postdoc's model is robust:** The regularization will prevent it from chasing the noise in the new data. It might be slightly less precise, but more stable.

  **Your advice on the new data:** Tell them to pre-register their analysis on the new data. They must decide *now* how they will judge the fit before they see the new numbers. If they look at the new data and then tweak the models, they invalidate the test.

  ### Summary for the Room
  1.  **Gzip is fine** if standardized; otherwise, it's noise.
  2.  **Parameter counting is wrong** because it ignores regularization and precision.
  3.  **Simplicity does not equal truth**; it equals generalization potential.
  4.  **The Tie-Breaker:** Hold-out data (Cross-Validation). If they refuse, use a complexity metric that accounts for *effective* parameters, not raw counts.
  5.  **Your Role:** You are not judging the math. You are judging the method. Force them to test on unseen data. That is the only thing that settles a dispute between a process model and a black box.

  If you walk in and say, "We are not debating truth, we are testing generalization. Show me the cross-validation scores," you will own the room.
