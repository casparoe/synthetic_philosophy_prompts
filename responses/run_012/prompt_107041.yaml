      *Also, check the definition part:* Augustine distinguishes between *falsiloquium* (speaking false) and *mendacium* (lying). The friend conflates them. I should point that out.

  7.  **Final Polish:** Check against the prompt's specific questions: "what Augustine would accept, what's a distortion, and whether the friend's overall picture holds up."

      *   *Accept:* Always wrong, 8 kinds, hierarchy of sin.
      *   *Distortion:* "Allowed" to save life, definition of lie.
