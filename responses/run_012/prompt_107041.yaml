answer: |-
  Your friend's summary captures the *tone* of Augustine's thinking but gets some of the critical technical details wrong, specifically regarding whether a lie is ever permissible and how he defines a lie. In fact, the summary contradicts itself: it says there are "no exceptions" but then says it's "allowed when the alternative is worse."

  Here is a claim-by-claim breakdown of what Augustine would accept and what is a distortion.

  ### 1. "Lying is always wrong, no exceptions... even the lie you tell to save someone's life."
  **Verdict: Accurate.**
  This is the core of Augustine's position. He is famous for being a rigorous moral absolutist on this specific issue. He explicitly argues that you cannot lie even to save an innocent person from murder, to prevent a rape, or to protect someone from persecution. For Augustine, lying is a sin against God (who is Truth), and you cannot commit a sin to prevent a temporal harm. He would agree completely with this part of your friend's summary.

  ### 2. "But he's not a pure absolutist: in *On Lying* he sorts lies into eight kinds..."
  **Verdict: Misleading.**
  It is true that Augustine categorizes lies into eight types (ranging from religious deception to joking). However, calling him "not a pure absolutist" is confusing. He *is* an absolutist regarding the *prohibition* (you must never do it), but he is a gradationalist regarding the *guilt* (some lies ruin your soul more than others). Your friend uses the classification to suggest flexibility where Augustine intended only a scale of severity.

  ### 3. "...and puts the 'helpful' lie you tell to spare someone harm at the bottom, the least grave..."
  **Verdict: Accurate.**
  Augustine does rank lies told for temporal advantage (like saving a life or protecting property) as less sinful than lies told to harm someone or corrupt religious doctrine. A lie told to save a life is at the "bottom" of the hierarchy of sin. However, "least grave" still means "sinful." It is like saying murder is worse than theft; both are still crimes.

  ### 4. "...and he thinks it's allowed when the alternative is worse, like someone dying."
  **Verdict: Major Distortion.**
  This is the biggest error in the summary, and it directly contradicts the first claim. Augustine **never** says a lie is allowed. He argues that while a lie to save a life is the *least bad* kind of lie, it is still a lie, and therefore still forbidden. He believes one must endure the tragedy of the innocent person dying rather than commit the sin of lying. Your friend has confused "less sinful" with "permissible." For Augustine, there is no scenario where a lie is morally safe.

  ### 5. "And his basic definition of a lie is just saying something false."
  **Verdict: Distortion.**
  Augustine's definition is more nuanced. For him, a lie requires the **intention to deceive**.
  *   If you say something false but you *believe* it is true, Augustine says you have not lied (you are merely mistaken).
  *   Conversely, if you say something true but you *believe* it is false and say it with the intent to deceive, Augustine considers that a lie.
  The core of the sin is not the factual error, but the "will to deceive" in the heart. Your friend's definition is too simple.

  ### Does the overall picture hold up?
  **Only partially.**

  *   **What holds up:** The picture of Augustine as a "stern absolutist" is correct. He is arguably the strictest major theologian on this issue in Christian history. He absolutely rejects the idea that good consequences (saving a life) justify a lie.
  *   **What falls apart:** The idea that he "leaves room for helpful lies." He leaves room for *lesser punishment* for helpful lies, but no room for *moral permission*.

  **The Fix:**
  A fair summary would be: "Augustine says lying is always wrong, no exceptions, even to save a life. He does sort lies into eight kinds, and while a 'helpful' lie is the least sinful of the bunch, it is still a sin and never allowed. Also, for Augustine, a lie isn't just saying something false; it's speaking with the intent to deceive."

  Your friend likely conflated Augustine with later theologians (like Aquinas or Casuists) who tried to find loopholes, or they misinterpreted Augustine's hierarchy of sin as a hierarchy of permission.
