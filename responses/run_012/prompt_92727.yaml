      *   (4) *Defective Preferences:* Preferences can be defective (adaptive preferences, addiction). Correcting them isn't necessarily objectionable paternalism. (Anti-revealed preference/welfarism).
      *   (5) *Commitment:* Some choices (commitment, voting against self-interest) are not captured by preference-over-outcomes models. Choice-theoretic apparatus fails here. (Anti-revealed preference/formalism).
