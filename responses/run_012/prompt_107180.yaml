  **The Case**

  Alice is an only child in the actual world, born of a specific zygote $Z$ at time $t$. She considers a possible world $w$ that is identical to the actual world up to $t$, but in which $Z$ undergoes a rare biological fission, resulting in two viable embryos, Ben and Carl. Both Ben and Carl develop to term and are born at $t$. Both inherit the full genetic profile of $Z$. Throughout their lives, both Ben and Carl maintain an equal degree of qualitative similarity to Alice: they share her memories up to age ten, her personality traits, and her physical constitution. In $w$, Ben becomes a doctor and Carl becomes a lawyer. Neither is more similar to Alice than the other; they stand in a symmetric tie for the highest degree of resemblance. Alice asserts the modal claim: "In world $w$, I am both a doctor and a lawyer."

  **The Demonstration**

  **1. The Claim and Verdicts**
  The *de re* modal claim is $\Diamond (Doctor(a) \land Lawyer(a))$, where $a$ denotes Alice.
  *   **Transworld Identity (TWI):** The verdict is **False**. On TWI, the relation linking individuals across worlds is strict identity. Identity is transitive and one-to-one. If $a$ exists in $w$, she occupies exactly one position. Since no single individual in $w$ is both a doctor and a lawyer (Ben $\neq$ Carl), there is no individual in $w$ identical to $a$ who satisfies the conjunction. The logic of identity forbids $a = b \land a = c \land b \neq c$.
  *   **Counterpart Theory (CT):** The verdict is **True**. On CT, the claim is analyzed as $\exists w \exists x \exists y (C(x, a) \land C(y, a) \land Doctor(x) \land Lawyer(y))$. The counterpart relation $C$ is not constrained to be one-to-one. Because Ben and Carl both bear $C$ to $a$ (due to the symmetric tie in similarity), the existential quantifiers range over both. The conjunction is satisfied collectively by distinct counterparts within the same world. The verdict follows directly from the logical form of CT's translation schema, which allows distinct variables to bind to distinct counterparts of the same actual individual.

  **2. The Working Feature**
  The divergence is produced solely by the **arity of the cross-world relation**. TWI employs a one-to-one relation (identity); CT employs a one-to-many relation (counterparthood). If the case were altered to ensure a one-to-one mapping—for instance, by stipulating that in $w$, only Ben exists, or that Carl is significantly less similar to Alice than Ben is—the counterpart relation would select a unique individual. In that scenario, CT would yield the same verdict as TWI (False), because no single counterpart satisfies both conjuncts. The divergence arises only because the machinery of CT permits multiple satisfiers for a single *de re* claim within a single world.

  **3. The Counterpart Theorist's Reply**
  A defender of CT would argue that the verdict is correct and reflects the semantics of natural language modality. They would claim that "I could have been F and G" is true just in case the possibility of being F and the possibility of being G are compossible in a world, even if realized by different counterparts. They would argue that restricting the theory to force a unique counterpart would require arbitrary tie-breaking rules that lack metaphysical grounding.
  *   **Evaluation:** This reply succeeds on CT's own terms because the theory is explicitly designed to handle modal predication via existential quantification over counterparts. However, it succeeds only by redefining the truth conditions for conjunctive *de re* claims, decoupling the truth of "I am F and G" from the existence of a single subject who is F and G.

  **4. The Transworld Identity Defender's Reply**
  A defender of TWI would argue that the verdict is correctly False and that Alice's assertion is confused. They would claim the intuitive pull of the case stems from conflating $\Diamond (Doctor(a) \land Lawyer(a))$ with $\Diamond Doctor(a) \land \Diamond Lawyer(a)$. The latter is true on TWI (as there are worlds where $a$ is a doctor and worlds where $a$ is a lawyer), but the former is false. They would insist that preserving the transitivity of identity is more important than accommodating the intuition that the conjunction is true in the fission world.
  *   **Evaluation:** This reply succeeds in preserving logical consistency and the unity of the subject. However, it requires denying the truth of a claim that seems plausible given the metaphysical possibility of fission. It forces the theorist to classify the scenario as one where Alice ceases to exist or is identical to only one twin by brute fact, which may seem arbitrary.

  **5. Assessment**
  This case makes **Counterpart Theory** look worse. While the divergence is engineered via arity, the cost is not merely artifactual. CT validates a claim ("I am both F and G") that implies a contradiction in properties for a single subject, without any single subject in the possible world bearing those properties. This severs the link between *de re* modality and the identity of the subject across the modal operator. TWI appears rigid, but it preserves the intuition that modal claims are about *what one thing could have been*. CT's flexibility comes at the price of dissolving the subject into a plurality of representatives, which undermines the very *de re* nature of the claim the theory is meant to analyze. The cost is a real theoretical deficit: CT cannot distinguish between "I could have been F and G" and "Someone like me could have been F and someone else like me could have been G."
