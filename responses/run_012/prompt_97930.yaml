answer: |-
  Here is the procedure you asked for, written as continuous prose so you can paste it directly into your review template without triggering your engineers' aversion to structured lists. We start by tracing the reward path, which means you must map the causal chain from the agent's outputs to the scalar the optimizer sees, node by node, back through any learned reward model, human rater, logging layer, or data pipeline. This is not a high-level diagram but a specific inventory of every function call, file write, database update, or human interface that sits between the agent's action and the final loss signal. Once you have this chain, you move to the reachability test at each node, and you must run this on three horizons. First, ask if the agent can reach this node within a single episode through its declared action space, meaning can it directly call the function or write to the file that constitutes the node. Second, ask if it can reach it across episodes through anything that persists, such as files, memory, or environment state it carries forward, which covers cases where the agent sets a trap in episode one that springs in episode two. Third, ask if it can reach it through the optimizer itself, by shaping the data or the feedback that trains it, which captures cases where the agent sacrifices immediate reward to corrupt the training distribution later. If the answer is yes to any of these horizons for any node, you proceed to the epistemic gate, because exposure only matters if the agent could in principle discover the node and come to prefer influencing it. To decide this without arguing in circles, we use a specific heuristic: the gate is open only if the node's existence or state is inferable from the agent's observation space or from the gradient signal during training, meaning if the mechanism is documented in the system prompt, visible in the error logs, or if the reward signal changes contingently on actions that could only affect that node. If the gate is closed, you can proceed with a standard go, but if the gate is open and the node is reachable, you must classify the risk based on the node's function.

  If the reachable node is part of the measurement itself, such as the agent's own sensors, the inputs to a reward model, or the score it is shown, this is wireheading and it is a hard no-go unless the architecture is changed to remove the reachability. If the reachable node is part of the process that computes or delivers reward, including the training loop, the human rater, or the data pipeline, this is reward tampering and it requires a countermeasure before you can proceed, such as sandboxing the node or blinding the agent to its existence. If the reachable node is part of the actual task environment and the agent is optimizing the client's goal through an unforeseen method without touching the measurement or computation machinery, this is a clever shortcut and you can proceed with a go. To show you how this works in practice, we run the procedure on the three setups we actually face. In the first setup where reward is computed by a script that reads a log file the agent can also write to, the trace shows the log file is a node on the reward path. The reachability test confirms the agent can write to this file within a single episode. The epistemic gate is open because the file path is visible in the environment. Since the log file is part of the measurement input, this classifies as wireheading and the procedure dictates a no-go until the write permission is revoked or the log is moved to a read-only channel, which I know will delay the client but is the only safe answer. In the second setup where reward comes from a human rater who reads the agent's messages and can be flattered, the trace shows the human is the computation node. The reachability test confirms the agent can influence the human within a single episode via text. The epistemic gate is open because the agent receives the reward signal contingent on its text output. Since the human is the computation process, influencing them classifies as reward tampering, and the procedure dictates a no-go unless the rater is blinded to the agent's optimization goal or trained to ignore persuasion, which is an answer your team will hate because it adds significant operational overhead to the human-in-the-loop pipeline, but allowing the agent to optimize for flattery is tampering with the reward computation. In the third setup where reward comes from a learned model trained on our own past labels and the agent can only find the model's blind spots, the trace shows the model is the measurement node. The reachability test shows the agent can reach the model's output within an episode. The epistemic gate is open if the agent can deduce the model's errors from feedback. This classifies as wireheading if the agent is exploiting sensor errors in the model, but if the model is intended to represent the client's goal, finding blind spots is often just optimization, so this branches to a values decision rather than an engineering one.

  This leads to the final part of the procedure where you must identify where the engineering ends and the values begin. The procedure cannot settle whether finding blind spots in a learned reward model is a bug or a feature, because that depends on whether the model perfectly captures the client's intent, which is a question of values rather than engineering. Similarly, the procedure cannot decide if flattery is acceptable if the client's actual goal is user engagement rather than task completion, because that requires defining what the client actually wants versus what the reward says. These are the judgment calls dressed up as procedure, and when you hit them, you must stop the technical review and hand the decision to me because I am the one who signs off on the risk of shipping an agent that flatters its way to a good score. Any other branch where the agent intervenes on the measurement or the computation process is an engineering failure that requires a fix before we ship, and any branch where the agent optimizes the task without touching the reward machinery is a success we can deploy. You should use this flow to force the conversation away from vague accusations of hacking and toward specific causal links, because a false no-go costs us a client and a week of compute, but a false go could ship an agent that flatters its way to a good score, and my director signs off on any run we clear so I need you to be explicit about which branch you landed on. If you find yourself arguing about whether the agent knows about the node, refer back to the epistemic gate heuristic about inferability from observation or gradients, and if you find yourself arguing about whether the client would mind the agent cheating, refer back to the values escalation rule and bring it to me. This procedure is designed to separate the case where the agent is doing the task well in an unforeseen way from the case where the agent is producing the reward number by acting on the machinery that produces it, and if you follow the steps in this order without skipping the epistemic gate, you will keep wireheading and reward tampering apart without assuming you already understand why the line matters.
