  In the house, they argue about the thermostat. They bring to it a seriousness they bring to nothing else. One wants it higher. One wants it lower. They settle it. They argue again.

  Ana's father drove trains for thirty-one years. He calls Daniel the professor. He says it like a title. Daniel's mother is in the front row. She has asked me not to make her cry. I intend to keep that promise.

