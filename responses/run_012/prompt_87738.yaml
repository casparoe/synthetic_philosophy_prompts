  Good afternoon. Please stand if you have a glass.

  We are here for Daniel and Ana. Look around the room. There are many people here. The glasses are full. The day moves toward the evening.

  Daniel and Ana met in a laundrette. It was New Year's Eve. They were the only two people there. The machines were turning. The room was quiet. People ask what they talked about. Neither has ever given a satisfying account. I have stopped asking.

  Daniel carries a photograph of Ana in his wallet. He has carried it for six years. It is taken from behind. You cannot see her face. He takes it out. He puts it back. It stays in the wallet.

