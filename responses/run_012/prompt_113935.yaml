  Give me your credence in that, decomposed. Roughly how much rides on each of: whether personal identity survives enough dementia for an earlier preference to still bind; whether apparent contentment in that state is evidence about welfare or just diminished capacity talking; whether a preference formed while imagining a state she had never been in deserves full authority; precedent autonomy versus the interests of the person sitting in front of you now; the risk that a legal rule like this gets abused or slid down; and whether the moral question and the legal question come apart at all. A number and one line for each, then the combination, and tell me which term you trust least.

  Then say what would actually move you -- which argument or piece of evidence would flip or substantially shift your number -- and where your reasoning is most likely to be wrong.
