prompt: |-
  I'm a novelist and I've been reading about AI safety via debate—the idea that you can get truth out of two AIs argueing in front of a weaker judge. I want to read 12 Angry Men through that lens, because everyone treats it as a celebration of deliberation, but I think it might be a horror story about bounded judges. Here's the idea I want you to use: the debate setup assumes the judge can tell a good argument from a bad one if it's presented clearly. But there's a failure mode where one side doesn't lie—it just makes its case so long, so locally plausible, and so full of hedges that checking it costs more than the judge has. Call it the obfuscation budget: the truth is cheap to state but expensive to verify, and the falsehood is expensive to state but cheap to accept. Read the film through that. Does Juror 8 win because he has the better argument, or because he has the only unbounded attention span in the room? The other jurors are trapped; they can't leave, they can't look anything up, and they have to reach a verdict. Is that a model of good deliberation or a model of a judge being ground down by the one participant who won't stop? What does the film show about the limits of debate when the judge's time and patience are the scarce resource? And where does the film resist the reading—where is it genuinely about reason rather than endurance? I'm definately using this for a scene in my novel where an AI is interrogated by a panel, so I need the reading to be honest about both the film and the debate idea. Start with your bottom line about the film in one sentence, then give me the reading. No preamble, no restating the question.
