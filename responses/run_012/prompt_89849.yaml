answer: |-
  Here is the specification you asked for. It breaks down into seven core desiderata. Each one targets a specific failure mode in the existing literature.

  ### 1. The Probabilistic Match (Adams' Thesis)
  **The Case:** Take a standard die roll. You haven't rolled it yet. Consider the claim: "If the die lands even, it will land six." Your confidence in this claim should match your confidence in "It lands six" given "It lands even." Since there are three even numbers (2, 4, 6) and only one is six, your credence in the conditional should be 1/3.
  **The Requirement:** The theory must explain why the probability of the conditional *If A then B* aligns so perfectly with the conditional probability *P(B|A)*. Any theory that predicts your confidence should be higher (e.g., 1/2) or lower (e.g., 0) gets this wrong. This is the strongest empirical datum we have.

  ### 2. The False Antecedent Assertibility
  **The Case:** You are convinced Oswald acted alone. You believe the antecedent "Oswald didn't kill Kennedy" is false. Yet, you are happy to assert: "If Oswald didn't kill Kennedy, someone else did." You would not assert the material conditional equivalent ("Either Oswald killed Kennedy or someone else did") with the same force, because that feels too weak. You would not assert the counterfactual ("If Oswald hadn't killed Kennedy, someone else would have") because you know that's false.
  **The Requirement:** The theory must allow a conditional to be assertible and true even when the speaker is confident the antecedent is false. This rules out any theory that treats the indicative conditional as a material conditional (which is trivially true when the antecedent is false) or as a counterfactual (which requires the antecedent to be open or false in a specific way).
  **Note:** This overlaps with your zero-probability request. If you are certain the antecedent is false, its probability is zero. If the theory relies on *P(B|A)*, it faces division by zero. A robust theory must handle the "certainly false" case without crashing.

  ### 3. The Indicative/Subjunctive Divide
  **The Case:** The Kennedy assassination again.
  1.  Indicative: "If Oswald didn't kill Kennedy, someone else did." (True, because someone did.)
  2.  Subjunctive: "If Oswald hadn't killed Kennedy, someone else would have." (False, because there was no conspiracy.)
  The facts of the world are identical in both cases. The only difference is the mood of the verb.
  **The Requirement:** The theory must distinguish these two without simply stipulating different logic for each. It must explain why the indicative is sensitive to what actually happened (someone did kill him) while the subjunctive is sensitive to causal mechanisms or closest possible worlds (no conspiracy existed). A theory that collapses them into one semantic category fails.

  ### 4. The Embedding Constraint (Truth Conditions)
  **The Case:** Consider complex sentences: "If it's not the case that if A then B, then C." Or: "Either if A then B, or if D then E." We understand these. We can negate them. We can put them in the scope of other operators.
  **The Requirement:** If conditionals lack truth conditions (if they aren't propositions), it becomes extremely difficult to explain how they function when embedded inside larger sentences. A theory must either provide truth conditions for the conditional itself or provide a sophisticated alternative semantics for embedding that doesn't rely on truth values. You cannot just say "conditionals aren't true or false" and then ignore how they behave in negation and disjunction.

  ### 5. The Deliberational Constraint (Future Decisions)
  **The Case:** You are deciding whether to take a job. You think: "If I take the job, I will be miserable in a year." This thought guides your decision. However, standard conditional probability *P(Miserable | Take Job)* is evidential. It might be high simply because miserable people tend to apply for this job (common cause), not because the job causes misery. If the conditional is purely evidential, it is useless for deliberation.
  **The Requirement:** The theory must account for the special status of conditionals where the antecedent is under the speaker's control. It must explain why these conditionals seem to track causal influence rather than mere evidence, or explain why we switch to a different kind of conditional when deliberating. If the theory treats all indicatives as evidential, it fails to explain rational decision-making.

  ### 6. The Zero-Probability Limit
  **The Case:** Consider a continuous probability space, like a dart thrown at a board. The probability of hitting any exact mathematical point is zero. Consider: "If the dart lands exactly on point X, it lands in the red zone." The conditional probability *P(Red | Point X)* is undefined (0/0). Yet the conditional seems to have a truth value (depending on whether point X is red).
  **The Requirement:** The theory cannot rely solely on the ratio formula for conditional probability. It must have a mechanism to evaluate conditionals with measure-zero antecedents. If your theory says this conditional is meaningless or undefined, it contradicts our intuition that the conditional is true if point X is red. This confirms that the "False Antecedent" problem and the "Zero Probability" problem are the same problem in disguise: both involve antecedents with probability zero (or near zero), and both require the theory to function without standard conditional probability.

  ### 7. The Triviality Barrier
  **The Case:** David Lewis's proof. If you assume (1) the conditional has standard truth conditions (it's a proposition), (2) it obeys the probability calculus, and (3) its probability equals the conditional probability *P(B|A)*, you prove that all probability distributions are trivial (you can only have probabilities of 0 or 1).
  **The Requirement:** The theory must not contradict this proof. You cannot simply assert all three premises above. You must explicitly reject one. A theory that claims to satisfy all three is mathematically incoherent.

  ***

  ### The Incompatibility Analysis

  Here is where the real action is. You cannot satisfy all seven requirements simultaneously. Specifically, requirements **1 (Probabilistic Match)**, **4 (Truth Conditions)**, and **7 (Triviality Barrier)** form a trilemma.

  1.  **If you keep Truth Conditions (4)** and respect **Triviality (7)**, you must abandon the **Probabilistic Match (1)**. This is the Stalnaker/Kratzer route. They say conditionals are propositions with truth conditions, but their probability is *not* always *P(B|A)*. They have to explain away the strong intuition from the die roll case as a pragmatic illusion.
  2.  **If you keep the Probabilistic Match (1)** and respect **Triviality (7)**, you must abandon **Truth Conditions (4)**. This is the Adams/Edgington route. They say conditionals are not propositions; they have no truth conditions. They are acceptable or unacceptable, but not true or false. They then have to struggle with **Embedding (4)**, building complex non-propositional semantics to handle negation and disjunction.
  3.  **If you keep Truth Conditions (4)** and the **Probabilistic Match (1)**, you violate **Triviality (7)**. This is impossible. Any theory claiming this is mathematically dead.

  **The Single Requirement That Rules Out Popular Theories:**
  The **Triviality Barrier (7)** does the most work. It is the hard constraint that forces the split between propositionalism (Stalnaker) and non-propositionalism (Adams). It kills the naive view that you can have it all.

  However, if you are asking which *empirical* requirement kills the most intuitive naive theory (the Material Conditional), it is **The False Antecedent Assertibility (2)**. The Material Conditional says "If A then B" is automatically true when A is false. This contradicts the fact that we can assert indicatives with false antecedents without them feeling trivially true, and it contradicts the **Probabilistic Match (1)** (since the material conditional would be highly probable whenever the antecedent is improbable).

  ### Non-Negotiables vs. Taste

  **Non-Negotiable:**
  *   **The Triviality Barrier:** You cannot violate math. You must choose between truth conditions and the Equation.
  *   **The Indicative/Subjunctive Divide:** Any theory that treats "If Oswald didn't..." and "If Oswald hadn't..." as semantically identical is empirically false.
  *   **The False Antecedent Assertibility:** A theory that says you cannot assert a conditional when you believe the antecedent is false contradicts actual usage (the Kennedy case).

  **Camp Taste / Metaphysical Preference:**
  *   **Truth Conditions vs. Acceptability:** This is the main split. Whether you think conditionals *must* have truth conditions to be meaningful (Propositionalism) or whether you think probability is the primary semantic value (Non-propositionalism) is largely theoretical taste. Both sides can explain the data, but they pay different prices. Propositionalists pay with complex possible-worlds metaphysics; Non-propositionalists pay with complex logic for embedding.
  *   **The Deliberational Constraint:** How you handle the "If I take the job" case depends on whether you think indicatives are purely evidential. Some theories say deliberational conditionals are a distinct subclass (causal indicatives). Others say all indicatives are evidential and decision theory handles the rest. This is a modeling choice, not a hard constraint.

  **Summary on your specific edge cases:**
  *   **Future Decisions:** This is handled by distinguishing causal from evidential relevance. If your theory doesn't allow for causal relevance in the semantics, it fails here.
  *   **Zero Probability / False Antecedent:** These are the same problem. Your theory must evaluate the connection between A and B without relying on the ratio *P(A & B) / P(A)*. If it relies on possible worlds, it needs a similarity metric that works even when the actual world makes A impossible. If it relies on probability, it needs a conditionalization rule that works on zero-probability events (like Popper functions).

  Pick your poison: Give up truth conditions or give up the Equation. You cannot keep both.
