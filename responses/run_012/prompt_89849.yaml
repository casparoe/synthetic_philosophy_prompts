prompt: |-
  ok so I'm trying to get a handle on theories of indicative conditionals — the plain "if P then Q" kind, not the counterfactual "if P had been..." kind — and before I read another one I want a proper spec of what such a theory actually has to deliver. Can you write me the desiderata? By which I mean: which ordinary cases any theory has to get right (the ones where "if" really does seem to track conditional probability, and the ones where it clearly doesn't), which distinctions it can't just collapse (indicative vs subjunctive; the probability of the conditional vs the conditional probability of the consequent given the antecedent; maybe asserting a conditional vs merely supposing its antecedent and seeing what follows), and which results it's not allowed to contradict — especially the triviality proofs, where the point was roughly that if you say the probability of "if A then B" just is P(B|A) and you also give the conditional ordinary truth conditions that behave well when embedded, the whole thing falls apart. For each requirement I want the case or puzzle sitting behind it, not just a one-line slogan.

  Then tell me which of the requirements you think can't all be satisfied at once, because I suspect that's where the real action is, and which single requirement does the most work in ruling out the popular candidate theories.

  A few items I'd want on the list that I never see spelled out: how the theory handles a conditional whose antecedent is something the speaker is going to decide later (like "if I take the job, I'll be miserable in a year"); conditionals with a zero-probability antecedent, where the conditional probability is undefined and there's nothing obvious to substitute; and conditionals that seem perfectly fine to assert even when you're fairly sure the antecedent is false. If some of those turn out to be the same problem in disguise, say so — that would be useful.

  Dont give me a bibliography or tell me to go read such-and-such, I can't look anything up right now anyway. Just the requirements, each with its motivating case, plus your call on what's non-negotiable and what's just one camp's taste. American English, and don't hedge every sentence.
