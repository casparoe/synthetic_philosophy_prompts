prompt: |-
  Quick background: I'm a backend engineer, zero philosophy training, but my company did one of those AI-safety lunch-and-learns last month and it's been living in my head rent free. They walked us through two ways a system can go wrong — a system you built, or a company, or a movement, honestly. Failure mode one: it starts seeking influence. It accumulates resources, control, capability, and points them at something other than what it was made for. You can point at that one. There's an agent, a moment, a culprit. Failure mode two: value drift. Nothing happens. The thing keeps doing its job, and the target just quietly slides, one completely reasonable step at a time, until ten years later it's aimed somewhere else and there's no day you can point to and say that's when it changed. No villain, no decision, no betrayal, just a thousand small locally-justified updates.

  Anyway, I want to write a satirical piece about how institutions try to guard against this stuff and end up guarding against the wrong half of it, and I'd like you to write it as a document. Specifically: a leaked annual 'Mission Integrity Audit' from a made-up mid-size research nonprofit (make up the name), around 800 words, laid out like a real compliance artifact — cover memo from the assurance team, a methodology section, numbered findings, a certification at the end. Spread the findings over about a decade.

  The funny has to come out of the actual content, not from anyone winking. So:

  - The report should define both failure modes up front, and its definitions should be subtly wrong in a way a careful reader can catch — basically they've defined both of them so that only the first one is detectable.
  - Every numbered finding should be individually defensible, and at least one should be something a reader could plausibly argue is an improvement, so it doesn't read as a plain sellout story.
  - The drift should never be named. It should only be visible in the pile-up of items, and the reader should be able to work out that nobody ever decided anything.
  - The one thing the audit formally flags as a problem should be totally trivial — a policy, a logo, an expense category — while the big change sails straight through.
  - The certification paragraph should be airtight and mean nothing.
  - No character in the document notices anything. Deadpan the whole way, no smug narrator, no wink at the end.

  Also work in that the audit's own criteria got revised a couple of times 'to reduce false positives', and that whoever wrote the original charter left the org years ago. Please don't name any real orgs or people.

  I want someone who already knows this distinction to laugh and not wince, and someone who's never heard of it to still be able to say what the difference between the two failure modes is by the end.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Goal:** Write a satirical piece formatted as a leaked annual 'Mission Integrity Audit' from a fictional mid-size research nonprofit.
      *   **Topic:** Institutional failure modes (Type 1: Active Pursuit/Power Seeking vs. Type 2: Value Drift/Goal Drift). The satire should highlight how institutions guard against Type 1 but miss Type 2 entirely.
      *   **Format:** Compliance artifact (Cover memo, Methodology, Numbered Findings, Certification).
      *   **Length:** Around 800 words.
      *   **Tone:** Deadpan, bureaucratic, no winking, no smug narrator.
      *   **Key Constraints:**
          *   Define both failure modes up front, but define them so only Type 1 is detectable.
          *   Findings should span about a decade.
          *   Every finding must be individually defensible (plausible bureaucracy).
          *   At least one finding should look like an improvement.
          *   The drift should never be named; visible only in the pile-up.
          *   The one formal "problem" flagged should be trivial (policy, logo, expense).
          *   The big change (drift) must sail through unflagged.
          *   Certification must be airtight but meaningless.
          *   Mention criteria revisions to "reduce false positives."
          *   Mention original charter author left years ago.
          *   No real orgs or people.
          *   Audience: Backend engineers/laypeople should understand the distinction by the end; insiders should laugh without wincing.

  2.  **Deconstruct the Failure Modes:**
      *   *Mode 1 (Active/Power Seeking):* "Resource Accumulation," "Unauthorized Influence," "Deviation from Charter via Action." Easy to audit (logs, decisions, budgets).
      *   *Mode 2 (Drift/Value Sliding):* "Contextual Shift," "Interpretive Evolution," "Gradual Realignment." Hard to audit because every step is locally rational.
      *   *The Trick:* The audit definitions need to make Mode 2 invisible. E.g., Define drift as "Unauthorized Change" (implies a decision) rather than "Accumulated Contextual Shift."

  3.  **Drafting - Section by Section:**

      *   **Header:** Needs to look official. "CONFIDENTIAL," "Mission Integrity Audit," Fictional Org Name (let's say "The Aethelgard Institute for Computational Stability").
      *   **Cover Memo:** From Assurance Team. Mention the charter author leaving. Mention criteria revisions.
      *   **Definitions:** Crucial step.
          *   Type I: "Active Deviation" (Intent-based).
          *   Type II: "Passive Deviation" (Defined as "Failure to update records" or something that misses the point of value drift). Let's try: "Type II: Static Obsolescence (Failure to update mission parameters to reflect current operational reality)." This frames drift as a paperwork error, not a value shift.
      *   **Methodology:** Mention the revisions to reduce false positives. This explains why the net is too coarse to catch drift.
      *   **Findings (The Core):** Need to span 10 years. Show the shift from "Safety" to "Capability/Scale" without calling it that.
          *   Year 1-3: Standard safety stuff.
          *   Year 4-6: Efficiency metrics introduced (looks like improvement).
          *   Year 7-10: Partnership expansions, scope creep, but framed as "operational alignment."
          *   The "Flagged Issue": Something tiny like travel expenses or logo usage.
      *   **Certification:** Legalese that confirms compliance without confirming actual mission integrity.

  4.  **Refining the Satire (Self-Correction during drafting):**
      *   *Check:* Did I define Type II wrong? It needs to be subtly wrong. If I define it as "Failure to file updates," then actual value drift (where you *do* file updates, just rationalized ones) passes.
      *   *Check:* Is the drift visible? I need to show the mission changing from "preventing harm" to "maximizing deployment" through the findings.
      *   *Check:* Is the tone right? No jokes. Just dry compliance language.
      *   *Check:* Word count. Aim for ~800.

  5.  **Drafting - Step-by-Step:**

      *   *Org Name:* The Veridian Institute for Algorithmic Stability.
      *   *Memo:* To Board, From Internal Assurance.
      *   *Definitions:*
          *   Failure Mode Alpha (Active): Unauthorized acquisition of capacity or influence outside charter scope.
          *   Failure Mode Beta (Passive): Discontinuity between stated mission parameters and operational logs exceeding 5% variance. (This misses the point—variance is measured against *logs*, not *values*).
      *   *Methodology:* Note the 2018 and 2021 revisions to "reduce noise."
      *   *Findings:*
          *   2015: Charter aligned.
          *   2017: Partnership with CloudCorp (efficiency).
          *   2019: KPI shift from "Incidents Prevented" to "Models Deployed" (Looks like improvement/metrics).
          *   2021: Scope expansion to "Adjacent Industries."
          *   2023: The Flagged Issue: Reimbursement coding for retreat catering.
      *   *Certification:* "No Mode Alpha detected. Mode Beta variance within tolerance."

  6.  **Writing - Focusing on Tone:**
      *   Avoid adjectives like "alarming" or "unfortunately."
      *   Use passive voice. "It was determined," "Metrics were adjusted."
      *   Ensure the drift looks like progress in the text.

  7.  **Review against Constraints:**
      *   *Definitions subtly wrong?* Yes, Mode Beta is defined as record-keeping variance, not value shift.
      *   *Findings defensible?* Yes, efficiency metrics are good.
      *   *Drift unnamed?* Yes, shown through KPI changes.
      *   *Trivial flag?* Yes, catering/expenses.
      *   *Certification meaningless?* Yes, confirms process not outcome.
      *   *Charter author left?* Mention in memo.
      *   *Criteria revised?* Mention in methodology.
      *   *Word count?* Need to monitor.

  8.  **Final Polish:** Check the flow. Ensure the distinction between "Seeking Influence" (Alpha) and "Sliding Target" (Beta) is clear to the layperson through the example, even if the definition is bureaucratic.

      *   *Correction on Definitions:* To make sure the reader gets the distinction, Mode Alpha should be "Intentional Diversion." Mode Beta should be "Unintentional Record Mismatch." This hides the *value* drift inside "Record Mismatch." Actually, better: Mode Beta defined as "Stagnation" (failure to update), whereas the real problem is "Updating too much in the wrong direction." Let's go with "Procedural Discontinuity."

      *   *Let's refine the "Drift" in findings:*
          *   Start: "Ensure systems do not harm users."
          *   End: "Ensure systems reach maximum users."
          *   Middle steps: "Optimize deployment speed," "Reduce friction in safety checks."

      *   *The Flag:* Logo color variance or expense codes. Let's go with expense codes.

      *   *The "Improvement":* Implementing automated compliance tracking (which actually just automates the drift).

      *(Self-Correction)*: Keep it tight. 800 words is not a lot. Need to be concise.

      *   *Drafting thought:* Make sure the "Criteria Revision" explains why the drift isn't caught. "Thresholds adjusted to account for organic growth."

      *   *Final check on tone:* No irony markers. Just text.

  9.  **Final Word Count Check:** Aiming for ~800.

      *   Header: 50 words
      *   Memo: 150 words
      *   Definitions: 150 words
      *   Methodology: 100 words
      *   Findings: 250 words
      *   Certification: 100 words
      *   Total: ~800.

      Let's write.

      *Wait, one more check on the "Definitions subtly wrong" constraint.*
      The prompt says: "definitions should be subtly wrong in a way a careful reader can catch — basically they've defined both of them so that only the first one is detectable."
      So Mode 1 (Seeking Influence) needs to be defined correctly enough to catch a villain.
      Mode 2 (Value Drift) needs to be defined such that it *cannot* catch drift.
      If Mode 2 is defined as "Unauthorized Change," then authorized drift (via small steps) passes.
      If Mode 2 is defined as "Deviation from Original Charter," but the Charter allows amendments...
      Let's try: Mode II defined as "Sudden Discontinuity." Drift is gradual, so it's not sudden. That works perfectly.

      *Revised Plan for Definitions:*
      Mode I: Unauthorized resource accumulation.
      Mode II: Discrete deviation from baseline mission text >10% in a single fiscal cycle. (This misses gradual drift).

      *Let's go.*
