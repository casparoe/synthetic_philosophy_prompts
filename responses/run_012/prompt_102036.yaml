answer: |-
  Here is a 50-minute teaching plan designed specifically for an audience of Econ/CS utilitarians who will try to solve the problem with a distinction between *criterion* and *decision procedure*.

  ### The Core Strategy
  You cannot win by arguing that Utilitarianism gives the *wrong answer* (they will say it gives the right answer). You must argue that Utilitarianism gives the right answer for the *wrong kind of agent*.

  The sequence must force them to commit to a **Model of Agency** before they encounter the **Case**. If you start with the case, they will treat it as an optimization problem. If you start with the model of the agent, the case becomes a test of whether that model is compatible with human existence.

  **Recommendation on the Case:** **Keep Williams's Wife Case.**
  Do not swap it for a "condemned project" case.
  *   **Why:** If the project is one impartiality condemns (e.g., "I am dedicated to writing poetry while the world starves"), the debate shifts to *whether the project is permissible*. Your audience will happily say, "Yes, drop the poetry."
  *   **The Wife Case works better** because saving the wife is *also* what impartiality usually demands. The conflict isn't about the *act* (save her); it's about the *reason* (because she's yours vs. because it maximizes utility). This isolates the "one thought too many" objection purely to the structure of reasons, which is where you want the fight.

  ---

  ### The Sequence (50 Minutes)

  #### 1. The Architecture of Agency (0:00–0:10)
  **Goal:** Define "Ground Projects" not as preferences, but as the conditions of having a life.
  **Why first:** You need to establish that agents are not neutral vessels for utility. If you don't do this, the "Criterion/Procedure" reply will look like a harmless software patch.

  *   **Action:** Do not mention Utilitarianism yet. Ask: "What makes a sequence of actions belong to a single *life* rather than just a sequence of events?"
  *   **Concept:** Introduce Williams's **Ground Projects**. These are not "hobbies" or "values" (which can be swapped). They are the commitments that give the agent a reason to be around to maximize utility in the future.
  *   **Key Stipulation:** Ground Projects are not chosen from the impartial standpoint. You do not ask, "Will having a wife maximize utility?" and then decide to get one. The project *precedes* the calculation.
  *   **Head Off Misconception (Integrity = Values):** Explicitly state: "We are not talking about 'staying true to your values' in the sense of moral principles. We are talking about the psychological structure that makes you an agent rather than a utility channel."

  #### 2. The Rescue Case (0:10–0:20)
  **Goal:** Apply the Architecture to the Wife Case.
  **Why here:** Now that they accept (for the sake of argument) that agents are constituted by ground projects, the case tests whether Utilitarianism can accommodate that constitution.

  *   **Action:** Present the case: A man sees two people drowning, his wife and a stranger. He can save only one. He saves his wife.
  *   **The Utilitarian Verdict:** Ask them: "Does Utilitarianism condemn this?" (They will likely say "No, usually partiality is a good heuristic.")
  *   **The Trap:** Press them: "Okay, but *why* was it permissible? Was it permissible *because* she was his wife? Or was it permissible because, in this instance, saving her happened to align with utility?"
  *   **Head Off Misconception (Demandingness):** If they say "It's too hard to calculate in the moment," stop them. Say: "We are not talking about the cost of deliberation. We are talking about the *justification*. Assume he has infinite computing power. What is the *truth* about why he saved her?"

  #### 3. The Utilitarian Counter & The Trap (0:20–0:35)
  **Goal:** Let them deploy "Criterion vs. Decision Procedure" and show why it fails given Step 1.
  **Why here:** This is the crux. You must let them make their standard move so you can dismantle it using the "Architecture" you built in Step 1.

  *   **Action:** They will say: "Utilitarianism is the *criterion* of rightness, but 'Save your loved ones' is the *decision procedure*."
  *   **The Turn:** Ask: "What is the agent's *reason* for following the decision procedure?"
      *   If the answer is "Because following it maximizes utility," then the agent is still thinking the "one thought too many." He is thinking: *I am saving her because the Utility God says this heuristic is optimal.*
      *   If the answer is "Because she is my wife," then the *criterion* (Utility) is no longer the sole source of reasons.
  *   **The Argument:** Williams's point is that the Utilitarian Criterion claims to be the *sole* source of normative truth. If the agent must believe the Criterion is the sole source of truth to be a good Utilitarian, he cannot genuinely hold the Ground Project (which requires the project to be the source of truth).
  *   **Head Off Misconception (Criterion/Procedure):** Do not let them park this as a "bug fix." Frame it as: "If the Criterion dictates the Procedure, does the Criterion also dictate the *psychological attitude* toward the Procedure? If yes, the agent is alienated from his own action. If no, the agent is not a Utilitarian agent."
  *   **Head Off Misconception (Egoism/Partiality):** If they say "Williams is just defending selfishness," reply: "No. He is defending the idea that *any* project (even altruistic ones) requires this structure. If you dedicate your life to the Poor, you must do it because *you care about the Poor*, not because 'Caring about the Poor maximizes utility.' Otherwise, you are a fraud."

  #### 4. The Integrity Objection (0:35–0:45)
  **Goal:** Synthesize the attack on the "Picture of the Agent."
  **Why here:** Now you can state the conclusion clearly because the groundwork is laid.

  *   **Action:** Summarize. Utilitarianism requires the agent to view their own projects from the impartial standpoint. But Ground Projects *cannot* be viewed from the impartial standpoint without ceasing to be Ground Projects.
  *   **The Punchline:** Therefore, Utilitarianism doesn't just ask too much of the agent (Demandingness); it asks the agent to *not exist* as a distinct locus of action. It attacks the integrity of the agent by making their reasons alien to them.
  *   **Head Off Misconception (Deliberation vs. Reasons):** Reiterate: "This is not about how long he thinks. It is about what makes his action *his*."

  #### 5. Diagnostic Question (0:45–0:50)
  **Goal:** Test if the objection landed.
  **Why:** You need to know if they understood the structural point or just memorized the "one thought" slogan.

  *   **The Question:** "If a Utilitarian saves his wife, and he is asked 'Why did you do that?', is there *any* answer he can give that satisfies Utilitarianism without undermining the marriage?"
  *   **What to listen for:**
      *   *Failed understanding:* "He should say 'Because it makes me happy' (Utility via happiness)" or "He should say 'Because it's the best heuristic'." (This misses the alienation point).
      *   *Successful understanding:* "He has to lie." or "He has to cite the relationship, which means Utility isn't the whole story of reasons." or "The truth of his reason and the truth of the moral theory are in conflict."

  ---

  ### What to Leave Out (Say This Out Loud)
  At the start of the session, explicitly bracket these topics to keep the 50 minutes tight and prevent the philosophers in the room from going down rabbit holes.

  1.  **Self-Effacement:** "We are not discussing whether Utilitarianism should hide itself from its agents. We are discussing whether it can coherently inhabit them."
  2.  **The Moral Point of View:** "We are not debating whether the impartial standpoint is the correct moral standpoint. We are granting it for the argument and asking what it does to the *agent*."
  3.  **Jim and the Indians:** "We are sticking to the Wife/Rescue case. Jim is about negative responsibility; today is about integrity and reasons."
  4.  **Historical Context:** "No need to discuss the history of Utilitarianism or Williams's broader corpus."

  ### Misconception Map & Intervention Points

  | Misconception | When it surfaces | How to head it off |
  | :--- | :--- | :--- |
  | **Integrity = Stubbornness/Values** | **Phase 1 (Architecture).** If they treat projects as preferences. | **Intervention:** "Don't think of these as values you can weigh. Think of them as the *weights* themselves. Without them, there is no agent to do the weighing." |
  | **Demandingness Objection** | **Phase 2 (The Case).** If they say "Calculating is too hard." | **Intervention:** "Stop. Assume calculation is costless. The objection is not about *energy*, it's about *truth*. Is the thought 'she is my wife' a valid reason, or just a shortcut?" |
  | **Egoism/Partiality Defense** | **Phase 3 (The Trap).** If they say "Williams just wants to be selfish." | **Intervention:** "Apply this to the Altruist. If the Altruist helps the poor only because 'it maximizes utility,' is their altruism real? Williams says no. It's about the source of reasons, not the beneficiary." |
  | **Criterion vs. Procedure** | **Phase 3 (The Trap).** Their main defense. | **Intervention:** "Does the Criterion authorize the Procedure *instrumentally*? If so, the agent's reason is still instrumental. The alienation remains. The Procedure doesn't fix the Criterion's demand on the agent's psychology." |
  | **Deliberation vs. Reasons** | **Phase 4 (Integrity).** If they return to "one thought" as time. | **Intervention:** "The 'one thought' is not a unit of time. It is a layer of justification. It's the difference between acting *from* love vs. acting *in accordance with* love for a further end." |

  ### Why This Order Works
  1.  **Architecture first** prevents them from treating the agent as a black box.
  2.  **Case second** gives the architecture concrete stakes.
  3.  **Trap third** allows them to use their preferred tools (Criterion/Procedure) to show why those tools fail *given the architecture*.
  4.  **Integrity fourth** lands as the inevitable conclusion of the clash, not as an assertion.

  If you follow this, the "Criterion/Procedure" reply won't feel like a solution they found; it will feel like the specific mechanism of the alienation you are accusing them of.
