  # The Grantmaker's Decision Tree

  **Instructions:** Start at the top. At each node, choose the claim that best matches your intuition about the situation. Follow the line down until you reach a leaf. Read the name and the "awkward commitment" to see where your reasoning lands.

  ### Node 1: The Nature of the Link
  We agree the other eight trustees are relevantly like you. When you solve the puzzle of whether to nominate, does your solution **merely predict** what they will do (like two clocks showing the same time), or does it **logically determine** what they must do (like two calculators running the same code)?
  *   **Merely Predicts** → Go to Node 2.
  *   **Logically Determines** → Go to Node 5.

  ### Node 2: The Spoiler Effect (For "Merely Predicts")
  Suppose you nominate, and it turns out exactly one other person also nominated. The pot is lost. Compared to passing, **have you harmed the group?**
  *   **No** (The loss was guaranteed the moment the other person nominated; my action didn't change their action.) → Go to Node 3.
  *   **Yes** (We jointly caused the collision; if I had passed, the group would have won.) → Go to Node 4.

  ### Node 3: The Dominance Check
  Since your action doesn't change theirs, is there any scenario where nominating makes the outcome *worse* than passing?
  *   **No** (If no one else nominates, I win. If others nominate, it's lost either way. Nominating is weakly dominant.) → **Leaf A**.
  *   **Yes** (I risk turning a potential win into a certain loss if I misjudge the probability.) → **Leaf B**.

  ### Node 4: The Strategy Mix
  To avoid the collision while keeping a chance to win, should you nominate with **certainty** or with a **specific probability** (like 1 in 9)?
  *   **Certainty** (I should just pick one and stick to it.) → **Leaf C**.
  *   **Probability** (We must randomize to ensure exactly one person hits the target.) → **Leaf D**.

  ### Node 5: The Timing of Choice (For "Logically Determines")
  Since your reasoning determines theirs, should you decide based on **what you should do now**, or **what rule you would have agreed to before** knowing which of the nine trustees you are?
  *   **Before** (Ex-Ante Policy) → Go to Node 6.
  *   **Now** (Ex-Post Act) → Go to Node 7.

  ### Node 6: The Variable Vote Variant
  Imagine a variant where you can cast *any number* of votes for your proposal, and the pot is divided by total votes cast. Does your pre-committed policy **restrain you to one vote** on moral grounds?
  *   **Yes** (I must act only on rules everyone could adopt; grabbing more is unfair.) → **Leaf E**.
  *   **No** (I must act on the algorithm that maximizes total utility; if restraint loses value, I vote more.) → **Leaf F**.

  ### Node 7: The Scale of Strangers
  If there were **a million strangers** who read the same argument instead of eight colleagues you can talk to, would you still nominate with probability 1/9?
  *   **Yes** (The logic of symmetry holds regardless of personal connection.) → **Leaf G**.
  *   **No** (Without communication or focal points, coordination fails; I should default to a safe option.) → **Leaf H**.

  ---

  ### The Leaves

  **Leaf A: Causal Decision Theory**
  *   *Verdict:* Nominate with certainty.
  *   *Awkward Commitment:* You must accept that if everyone follows your reasoning, the pot will certainly be lost, yet you are still rational to nominate.
  *   *Places Trustee 3.*

  **Leaf B: Pure Strategy Causal**
  *   *Verdict:* Pass (or Nominate based on outside info).
  *   *Awkward Commitment:* You believe you can influence the outcome without believing your action is linked to theirs, leaving you with no clear basis for choice.
  *   *Status:* **Unoccupied / Incoherent.**

  **Leaf C: Pure Strategy Causal (Aggressive)**
  *   *Verdict:* Nominate with certainty.
  *   *Awkward Commitment:* You accept a near-100% chance of total failure to secure a tiny chance of total victory, ignoring the collective cost.
  *   *Status:* **Unoccupied / Unattractive.**

  **Leaf D: Mixed-Strategy Equilibrium**
  *   *Verdict:* Nominate with probability 1/9.
  *   *Awkward Commitment:* You must be indifferent to the outcome of your own randomization device, treating your own agency as a source of noise.
  *   *Places Trustee 1 (Nash Interpretation).*

  **Leaf E: Kantian / Team-Reasoning**
  *   *Verdict:* Bind the group to a fair rule (e.g., random selection).
  *   *Awkward Commitment:* You must pass on a guaranteed personal win if it violates the universal rule you set behind the veil of ignorance.
  *   *Places Trustee 2.*

  **Leaf F: Updateless / Functional Decision Theory**
  *   *Verdict:* Follow the algorithm that maximizes expected utility globally.
  *   *Awkward Commitment:* You might sacrifice the "fairness" of the group to maximize the total pot size in variants, treating trustees as outputs of a function.
  *   *Status:* **Explored.**

  **Leaf G: Superrationality**
  *   *Verdict:* Nominate with probability 1/9.
  *   *Awkward Commitment:* You believe your private thought process can logically coordinate with a million strangers without any communication channel.
  *   *Places Trustee 1 (Hofstadter Interpretation).*

  **Leaf H: Focal Point / Contractualist**
  *   *Verdict:* Rely on salient features (e.g., "Trustee #1 nominates") or explicit promises.
  *   *Awkward Commitment:* Your rationality depends on arbitrary social cues; without a pre-existing convention, you default to the fallback grant.
  *   *Status:* **Explored.**

  ---

  ### Analysis of the Tree

  **Indistinguishable Leaves:**
  The tree cannot fully separate **Leaf E (Kantian)** and **Leaf F (Updateless)** using only the Grant Circle case, as both recommend cooperation here.
  *   *Separating Case:* A "Blackmail" variant where one trustee can threaten to destroy the pot unless given a larger share. **Kantian** refuses to bind themselves to a policy that rewards threats (moral constraint). **Updateless** might bind themselves to pay the blackmail if doing so maximizes the algorithm's expected utility across all possible worlds (pragmatic constraint).

  **Unoccupied Combinations:**
  1.  **Node 2 (No Harm) + Node 4 (Probability):** Believing your action doesn't causally harm the group, yet choosing to randomize.
      *   *Guess:* **Incoherent.** If you believe you can't spoil the pot (Node 2), you have no incentive to dilute your chance of winning with a probability (Node 4). This combination suggests a confusion between causal independence and strategic equilibrium.
  2.  **Node 5 (Now) + Node 6 (Yes/Restraint):** Deciding in the moment, yet feeling morally bound by a hypothetical pre-commitment in the Variable Vote variant.
      *   *Guess:* **Unattractive.** This is "Time-Inconsistent Morality." It claims the moral force comes from the *past* agreement, but the decision authority lies in the *present* self, creating a tension where the present self can simply revoke the moral binding.
  3.  **Node 1 (Predicts) + Node 5 (Before):** Believing the link is merely evidential, yet deciding based on an ex-ante policy.
      *   *Guess:* **Unexplored.** This is a hybrid of Evidential Decision Theory and Rawlsian Contractualism. It is not incoherent, but rare; usually, those who see only evidence (CDT/EDT) focus on the immediate payoff, while those who focus on policy (UDT/Kantian) see a logical link.

  **Placement of Your Trustees:**
  *   **Trustee 3 (Dominance):** Placed at **Leaf A**. They argue nomination is weakly dominant (Node 2: No Harm), leading to Causal Decision Theory.
  *   **Trustee 2 (Ex-Ante):** Placed at **Leaf E**. They focus on the rule settled in advance (Node 5: Before) and moral restraint (Node 6: Yes), leading to Kantian/Team-Reasoning.
  *   **Trustee 1 (1/9 Probability):** Placed at **Leaf G**. They see the logical link (Node 1: Determines) but decide in the moment (Node 5: Now) based on symmetry (Node 7: Yes), leading to Superrationality.
      *   *Note:* Trustee 1 could also land at **Leaf D** (Mixed-Strategy) if they view the link as merely predictive (Node 1) but harmful (Node 2). The tree successfully captures both the *Nash* and *Superrational* justifications for the same 1/9 verdict. None fall through the cracks.
