answer: |-
  Elena, a hiring manager, needs to fill a position by 5 PM. She decides to hire her unqualified nephew, motivated entirely by familial favoritism and a desire to avoid family conflict. Unbeknownst to her, the company's HR software crashed overnight; the system now displays only her nephew's application, and the "Reject" or "No Hire" buttons are physically unresponsive due to a coding error that mandates a selection be made to close the file. The system does not monitor her; it is simply broken in a way that makes hiring anyone else or no one physically impossible. Elena deliberates, feels no external pressure, and clicks "Hire" on her own reasons, unaware that no other outcome was physically achievable.

  She could not have done otherwise in the categorical sense because the physical reality of the software glitch rendered any alternative action (hiring another, rejecting all) causally impossible; unlike a hidden intervener, the glitch was static and required no detection of her decision process, bypassing the prior-sign objection. She remains morally responsible because her action flowed from her own character and reasons (nepotism) without her knowledge of the constraint; she was not coerced because she did not feel forced, nor brainwashed because the reasoning was hers. The strongest move for a PAP defender is the "flicker" strategy: they will argue she still had the alternative possibility of *trying* to click "Reject" or *deliberating longer*, and that these fleeting moments of freedom are sufficient to ground responsibility, meaning the case fails to eliminate all alternatives. I am not confident that the flicker can be fully eliminated in a realistic setting; without sci-fi neural blockers, the physical ability to *attempt* an alternative action almost always remains, which is the bit I am least sure about. The single feature carrying all the weight is her ignorance of the constraint; if you delete it and she knows the system is broken, she acts under coercion/duress, and responsibility vanishes.

  \answer{ignorance of structural constraint}
