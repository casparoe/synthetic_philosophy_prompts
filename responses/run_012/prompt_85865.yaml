answer: |-
  Here is the session plan, structured to manage the specific epistemic vulnerabilities of a physicalist graduate cohort.

  ### I. The Sequence of Components (and the Logic of Delay)

  You must enforce a strict dependency chain. If you introduce the Careenium's *implications* before its *mechanics*, or the *answer* before the *criterion of causation*, the physicalists will dismiss the higher level as epiphenomenal by reflex.

  1.  **The Physicalist Pledge (0–5 mins)**
      *   **Content:** Explicitly affirm causal closure of the physical. No magic, no dualism, no violation of conservation laws.
      *   **Why First:** You must disarm the "spooky action" defense mechanism. If they spend the session worrying you are a dualist, they will not listen to the argument about levels.
  2.  **The Careenium Mechanics: Simms Only (5–20 mins)**
      *   **Content:** Describe the marbles (simms), their magnetism, their chaotic collisions, and the external forces acting on them. Do *not* yet describe the clusters.
      *   **Why Second:** You must establish the "bottom level" as causally sufficient and exhaustive. This validates their physicalist intuition before you challenge it.
  3.  **The Emergent Pattern: Simmballs (20–30 mins)**
      *   **Content:** Describe how simms clump into stable spheres (simmballs) that roll and collide differently than loose simms.
      *   **Why Third:** You need the lower level fully established before introducing the higher level, so the higher level is seen as *dependent*, not *independent*.
      *   **Misconception Check:** **Head off the "Miniature Agent" error here.** Explicitly state: "The simmball has no internal controller. It is a passive cluster." If they imagine a homunculus inside the simmball, the rest of the session is wasted.
  4.  **The Criterion of Causation (30–45 mins)**
      *   **Content:** Define "cause." You must install an **Interventionist/Counterfactual account** (e.g., Woodward) *before* asking if simmballs cause anything. Contrast this with a "Process/Energy Transfer" account.
      *   **Why Fourth (Critical):** This is the pivot. If you ask "Do simmballs push simms?" without defining "push," they will default to "energy transfer" (answer: No) rather than "difference-making" (answer: Yes). You cannot answer the ontological question until you settle the methodological one.
      *   **Misconception Check:** **Head off the "New Energy" error here.** Explicitly state: "Difference-making does not require new energy; it requires constraint."
  5.  **The Application: Who Shoves Whom? (45–60 mins)**
      *   **Content:** Apply the Interventionist criterion to the Careenium. Show that manipulating the *simmball* pattern predicts simm movement better than tracking individual simms, even though simms do the moving.
      *   **Why Fifth:** Now that "cause" is defined as "difference-making under intervention," you can argue the simmballs are causal without violating physics.
      *   **Misconception Check:** **Head off the "Causal Sufficiency/Exclusion" error here.** This is the biggest wrecking ball. They will say, "The simms already determined the outcome." You must show that the simmball description *captures the constraint* that the simm-description obscures.
  6.  **The Second Case: Neural Constraints (60–75 mins)**
      *   **Content:** Move to a biological example (e.g., a winner-take-all neural circuit or a phase-locked oscillatory network).
      *   **Why Sixth:** The Careenium is stipulative; the simms are *designed* to clump. You need a case where the "higher level" is a discovered constraint in a messy physical system to prove this isn't just a parlor trick.
  7.  **Check for Understanding & Refusal (75–90 mins)**
      *   **Content:** Assessment task and boundary setting.

  ---

  ### II. Evaluation of the Careenium & The Second Case

  **Can the Careenium carry the session?**
  No. It can carry the *conceptual* load, but not the *ontological* weight.

  *   **What it supplies:** It isolates the structural relationship between levels without the baggage of biology (metabolism, evolution) or semantics (truth, reference). It allows you to discuss "representation" (simmballs modeling external forces) without getting bogged down in "meaning."
  *   **What it cannot supply:** Because the simms are magnetic and stipulated to clump, the audience will suspect the "higher level" was built in by the designer (Hofstadter/God). They will view the simmballs as *heuristic fictions* rather than *robust physical constraints*. The substrate is too symbol-like; it looks like a computer simulation, not a physical system.
  *   **The Second Case:** You need a **Neural Population Constraint** (e.g., a specific firing rate envelope that constrains individual neuron spiking).
      *   **Why:** It demonstrates that "higher-level states" (population dynamics) physically constrain "lower-level states" (individual spikes) via feedback loops, without magic. It bridges the gap from marbles to minds.
  *   **Opening with Brains and Beliefs:** **Resist this.**
      *   **Why:** If you open with "Do beliefs cause neurons to fire?", the philosophers will immediately jump to *content* (is it the *meaning* of the belief that causes the firing?) and the cognitive scientists will jump to *localization* (where is the belief?). Both distract from the structural question of *levels*. The Careenium forces them to look at the *structure of causation* first. Use brains only after the logic is secured.

  ---

  ### III. Misconception Management

  Here are the four misconceptions in the order your audience will produce them, with instructions on when to neutralize them.

  1.  **"The Simmballs are Miniature Agents" (Homunculus)**
      *   **When:** Immediately upon introducing Simmballs (Minute 20).
      *   **Fix:** Emphasize the clumps are passive consequences of magnetic forces. They have no "goal."
  2.  **"Higher-Level Efficacy Requires New Energy" (Conservation Violation)**
      *   **When:** When defining Causation (Minute 35).
      *   **Fix:** Distinguish *causal production* (energy) from *causal guidance* (constraint). A canal guides water without adding energy.
  3.  **"The Simm-Level Dynamics are Causally Sufficient" (Exclusion Argument)**
      *   **When:** When applying the criterion (Minute 50).
      *   **Fix:** This is the hardest one. Argue that "sufficiency" at the micro-level does not entail "explanatory exclusivity." The higher level captures the *counterfactual stability* that the lower level misses.
  4.  **"Macro Entity Reaching Down" (Spooky Downward Causation)**
      *   **When:** Throughout, but specifically during the Second Case (Minute 65).
      *   **Fix:** Reframe "downward causation" not as the whole pushing the parts, but as the *pattern of organization* constraining the *trajectory of the parts*.

  **The Two Session-Wreckers:**
  If you leave these until the end, you will run out of time to dismantle them, and the audience will leave thinking you ignored physics.
  1.  **Causal Sufficiency of the Simm-Level:** If they believe the micro-level *excludes* the macro-level, your entire argument is epiphenomenalism.
  2.  **New Energy Requirement:** If they believe causal influence requires energy injection, they will view your position as physically impossible.

  ---

  ### IV. Check for Understanding

  Do not ask for a summary. Ask for a discrimination task.

  **The Task:**
  Present them with a new, simple system: **A Floodplain.**
  *   *Lower Level:* Individual water molecules flowing.
  *   *Higher Level:* The shape of the river channel.
  *   *Scenario:* The channel diverts the water away from a town.

  **Ask them to write down (5 mins):**
  1.  Does the channel shape *cause* the water to miss the town, or is that just a description of where the molecules went? (Distinguishing causal work from convenient description).
  2.  If a physicist says, "The molecules' momentum and gravity were sufficient to determine the path; the channel added nothing," what premise of the Exclusion Argument must they be assuming, and why is it false in this context? (Identifying the Exclusion burden).

  **Success Criteria:**
  *   They must identify the channel as a *constraint* that makes a difference (Interventionist cause).
  *   They must identify that the Exclusion Argument fails if it assumes causal relevance requires *adding energy* rather than *constraining pathways*.

  ---

  ### V. What to Refuse to Cover

  **The Topic:** **Content vs. Structure (Semantics vs. Syntax).**
  *   *The Question:* "Is it the *meaning* of the representation that does the pushing, or just its physical shape?"
  *   *Why Refuse:* This is the "Hard Problem" of mental causation. It requires a theory of intentionality and information that you cannot build in 90 minutes. If you engage this, the philosophers will drag you into teleosemantics and the cognitive scientists into information theory, and you will lose the thread of *causal structure*.
  *   *How to Decline:**
      *   **Do not say:** "That's too hard."
      *   **Do say:** "We are currently establishing the efficacy of the *vehicle*. We are asking if the *pattern itself* has causal leverage over the substrate. Whether that pattern *means* something to an interpreter is a second-order question. If the vehicle has no causal power, the content certainly has none. We must settle the vehicle's efficacy before we can tax it with semantic weight. We will park the question of content until the vehicle is secured."

  This refusal validates the question's importance while strictly bounding the session's scope, preventing the "dodging" impression.
