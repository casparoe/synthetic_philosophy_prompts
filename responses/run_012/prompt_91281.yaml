answer: |-
  You have stumbled onto a very sophisticated methodological intuition that aligns with the best critiques of evolutionary psychology (specifically the work of Steven Jay Gould, Richard Lewontin, and more recently, Elisabeth Lloyd).

  Your gut is applying a principle I would call **"Improbability Under the Null."**

  Your rule isn't just "fine structure." It is: **"Does the specific pattern of the trait remain unlikely even after we account for physical constraints, developmental byproducts, and general-purpose learning?"**

  Here is how that principle resolves your tensions, handles the endowment effect, and audits your verdicts.

  ### 1. Resolving the Baby Cry vs. Morning Sickness Tension
  You were worried that accepting Morning Sickness forced you to accept the Baby Cry, because both have "fine structure" (timing/targets vs. frequency band). Your principle distinguishes them perfectly based on the **Null Hypothesis**.

  *   **Baby Cry (The Constraint Null):**
      *   *Observation:* Cry frequency overlaps with adult hearing sensitivity.
      *   *Null Hypothesis:* Infant larynxes are small; small instruments produce high frequencies. Adult ears are sensitive to mid-high frequencies for general environmental awareness.
      *   *Verdict:* The overlap is the **intersection of two physical constraints**. You don't need selection to explain why a small larynx makes a high sound. To prove adaptation, you would need to show the cry frequency is *different* from what the larynx would naturally produce, or that adult hearing shifted *specifically* for the cry (which is harder to prove). Your rejection is correct: this is likely a **byproduct of anatomy**, not a tuned signal.
  *   **Morning Sickness (The Generalist Null):**
      *   *Observation:* Nausea peaks during organogenesis and targets teratogens.
      *   *Null Hypothesis:* Pregnancy hormones cause general nausea (a physiological side-effect).
      *   *Verdict:* If the null were true, nausea should be random regarding food types and constant regarding timing. The fact that the nausea is **discriminative** (avoiding toxins) and **temporally precise** (organogenesis window) makes the data *improbable* under the "general side-effect" null. It suggests a regulatory mechanism, not just a physiological spill-over. Your acceptance is consistent with your rule.

  **The Principle:** Trust the story when the trait exhibits **discriminative complexity** that physical constraints or general physiology cannot easily explain.

  ### 2. The Verdict on the Endowment Effect
  Let's run the Endowment Effect through the "Improbability Under the Null" filter.

  *   **The Adaptationist Story:** Ancestral loss of resources was harder to recover than gain; therefore, we evolved a "loss aversion" module that manifests as valuing owned items more.
  *   **The Artifact Story:** The effect is a product of experimental framing, transaction costs, or lack of market experience.
  *   **The Test:** Does the effect show **discriminative complexity** unlikely under a learning null?
      *   *Evidence:* As you noted, the effect diminishes or vanishes with market experience and changes based on how the trade is framed.
      *   *Analysis:* Hard adaptations (like snake fear or lactose digestion) are generally robust to brief training or framing. They are "cognitive reflexes." If the Endowment Effect dissolves when you teach someone how a market works, it behaves like a **heuristic bug** or a **learned rule of thumb**, not a hard-wired adaptation. It is likely a byproduct of a general risk-aversion system applied in a novel context (experimental economics).
  *   **Verdict:** **Don't Buy It.** (Or at least, treat it as a byproduct of a broader loss-aversion mechanism, not a specific "mug-keeping" adaptation). The plasticity argues against it being a specific adaptation for resource retention in the EEA.

  ### 3. Auditing Your Other Verdicts
  Your intuition is surprisingly robust. Here is why your rule validates most of your calls, and the one place you might be too generous.

  *   **Lactose Tolerance (Buy):** **Correct.** This is the gold standard. We have the gene, the selection pressure, and the ancient DNA. It clears the "Improbability" bar easily.
  *   **Snake/Spider Fear (Buy):** **Correct.** This is the "Prepared Learning" argument (Ohman & Mineka). The null hypothesis is "we fear what hurts us." The fact that we *don't* fear cars (which hurt us more) but *do* fear snakes (which hurt us less, ancestrally) creates a dissociation that makes the data improbable under a general "learn danger" null.
  *   **WHR 0.7 (Don't Buy):** **Correct.** The precision is suspicious. Adaptations usually tolerate variance. A hard cutoff at 0.7 that bounces across cultures suggests a **measurement artifact** or a cultural fashion, not a biological module.
  *   **Music as Bonding (Don't Buy):** **Correct.** This fails the "Riskiness" test. It explains everything, so it predicts nothing. Any social behavior could be "for bonding." It doesn't rule out the null that music is a **byproduct** of language and auditory processing (a "auditory cheesecake," as Pinker put it).
  *   **Mental Rotation (Don't Buy):** **Correct.** You identified **plasticity**. If the trait shifts significantly with training or test framing, it is likely a general cognitive capacity being *used* differently, not a specialized module *designed* for hunting.
  *   **Morning Sickness (Buy):** **Methodologically Correct, Scientifically Debated.** Your rule validates this, but be aware in your seminar that this is the most contested on your list. Critics argue the "teratogen avoidance" is post-hoc and that the hormone HCG causes nausea as a side effect, with the food aversions being learned associations. However, your *reasoning* for buying it (specificity of timing/target) is the correct evolutionary reasoning, even if the biological mechanism is disputed.

  ### 4. Summary of Your Rule
  You can state your rule in the seminar like this:

  > "I accept adaptationist hypotheses only when the trait exhibits **design specificity that is improbable under physical, developmental, or general-learning nulls.**"

  *   **Physical/Developmental Null:** Is this just how the body is built? (Rejects Baby Cry).
  *   **General-Learning Null:** Is this just general intelligence/risk aversion applied to a context? (Rejects Endowment Effect, Mental Rotation).
  *   **Post-Hoc Null:** Could this story explain any outcome? (Rejects Music).
  *   **Dissociation Test:** Does the trait track ancestral risks rather than modern risks? (Accepts Snake Fear).
  *   **Precision Test:** Is the specificity biologically robust or statistically arbitrary? (Rejects WHR).

  ### Which Verdict to Drop?
  You don't need to drop a verdict, but you should **downgrade your confidence in Morning Sickness.**

  While it fits your heuristic perfectly, it is the only one on your "Buy" list that lacks the hard genetic evidence of Lactose or the robust cross-cultural dissociation of Snake Fear. It relies heavily on the assumption that the aversion is *innate* rather than *learned* during the pregnancy. If it's learned, it's not an evolutionary adaptation in the mother, but a rapid cultural/individual update.

  **Final Advice:** In the seminar, when someone proposes a story, ask: **"What pattern of data would prove you wrong?"**
  *   If they say "Nothing, it's just one way it helps," that's the Music story (Reject).
  *   If they say "If the fear was equal for snakes and cars," that's the Snake story (Accept).
  *   If they say "If market experience didn't reduce the effect," that's the Endowment story (Reject).

  Your gut is doing Bayesian updating correctly; you just needed to formalize the priors.
