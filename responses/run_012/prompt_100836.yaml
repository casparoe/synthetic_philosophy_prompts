answer: |-
  There is no single, canonical name for this specific pattern that carries the same cultural weight as "Goodhart's Law" or "Moloch," though it is a recognized composite of several concepts in economics, political science, and game theory.

  The closest existing technical term is **Competitive Obfuscation**.

  However, "Competitive Obfuscation" describes the *tactic* (hiding information to gain advantage) rather than the *systemic outcome* you are describing (the collapse of the audience's ability to distinguish quality, leading to a market for impressions). In game theory, this is modeled as a **Pooling Equilibrium** achieved through **Signal Jamming**.

  Because the existing terms describe the mechanics but miss the epistemic tragedy you've identified, I propose we coin a name that captures the systemic collapse: **The Verifiability Trap** (or, more evocatively, **Gresham's Law of Auditability**).

  Here is the breakdown of the existing concepts, the proposed name, and the boundaries of the phenomenon.

  ### 1. The Nearest Existing Concepts

  **Competitive Obfuscation**
  *   **What it is:** A strategy where firms or actors intentionally increase the complexity or opacity of their offerings to prevent direct comparison. Common in finance (fee structures) and retail (pricing).
  *   **How it differs:** It focuses on the *firm's strategy* to maximize profit or market share. It does not necessarily imply that the *field itself* collapses into noise. A market can have competitive obfuscation and still function; your pattern describes a field where the *metric of quality* is destroyed.

  **Signal Jamming (Game Theory)**
  *   **What it is:** When an agent takes action specifically to prevent an observer from inferring private information (e.g., a manager working on visible but useless tasks to look busy).
  *   **How it differs:** This is the micro-mechanism. Your pattern is the macro-consequence. Signal jamming is what the individual does; the Verifiability Trap is what happens when everyone does it.

  **Strategic Ambiguity**
  *   **What it is:** Deliberately leaving statements open to interpretation to maintain coalition support (politics) or optionality (law).
  *   **How it differs:** Strategic ambiguity is often about keeping future options open. Your pattern is about hiding *current* defects to avoid present accountability.

  **Why it isn't the others:**
  *   **Not Moloch:** You are correct. Moloch is a coordination failure where parties sacrifice a *shared value* (safety, truth) for position. In the Verifiability Trap, they sacrifice the *mechanism of judgment*. The loss is epistemic, not necessarily material (at first).
  *   **Not Goodhart:** Goodhart is "when a measure becomes a target, it ceases to be a good measure." Here, the measure isn't being targeted; it is being *blinded*.
  *   **Not Market for Lemons:** In Akerlof's model, the asymmetry is exogenous (the seller knows the car is bad, the buyer doesn't). In your pattern, the asymmetry is **endogenous** (the seller *makes* it hard to know).

  ### 2. The Coined Name: The Verifiability Trap

  I propose **The Verifiability Trap** (alternatively **Gresham's Law of Auditability**).

  **Definition:** A competitive dynamic where parties gain advantage by reducing the checkability of their output. As opacity becomes the dominant strategy, high-quality actors are forced to adopt opacity to survive, resulting in a pooling equilibrium where quality cannot be distinguished from noise, and the market rewards impression management over substance.

  **Necessary Conditions:**
  1.  **Competition:** There must be a contest for a scarce resource (grants, customers, votes).
  2.  **Asymmetric Penalty:** The cost of being *proven wrong* (or even scrutinized) must be higher than the cost of being *suspected* of being opaque.
  3.  **Audience Limitation:** The audience must have limited bandwidth or expertise to penetrate the opacity. If the audience could easily audit everything, opacity would be punished.
  4.  **Endogenous Opacity:** The difficulty in checking must be a choice, not a necessity.

  **Is Competition Essential?**
  Yes. A single party has no incentive to reduce checkability unless they are hiding a specific defect from a regulator. The *race* aspect—the dynamic where one party's opacity forces the other's—is what turns simple hiding into a systemic trap. Without competition, it is merely **Accountability Avoidance**.

  ### 3. Boundaries and Edge Cases

  **Is a firm keeping trade secrets doing this?**
  **No.** This is a crucial boundary.
  *   **Trade Secrets:** Protect *Intellectual Property*. The intent is to prevent copying. The firm usually wants to prove the product *works* (e.g., "Look at this demo, but don't look at the code").
  *   **Verifiability Trap:** Protects *Reputation from Evaluation*. The intent is to prevent comparison. The firm does not want you to know if the product works better than the rival's, only that it *might*.
  *   *Test:* If the firm offered a third-party audit to prove superiority, would they? A trade-secret holder might say "No, you'll steal our tech." A participant in the Verifiability Trap says "No, you'll find our flaws."

  **What if the opacity comes from the subject matter?**
  **No.** This is **Inherent Complexity**, not the Trap.
  *   **Inherent Complexity:** Quantum physics is hard to check because nature is complex.
  *   **Verifiability Trap:** Sociology papers are hard to check because the authors used unnecessary jargon to shield weak claims.
  *   *Test:* Could the output be stated more clearly without losing fidelity? If yes, it's the Trap. If no, it's Complexity.

  **Does the quality actually have to drop?**
  **No.** This is the insidious part.
  *   In the early stages, quality can remain high while opacity increases.
  *   However, in the long term, quality *will* drop. If the market rewards impressions (which are cheap to produce) over verified quality (which is expensive to produce), investment shifts from quality to impression management. This is where it converges with **Gresham's Law**: Bad (unverifiable) work drives out Good (verifiable) work.

  ### 4. Summary of Differences

  | Concept | Mechanism | Outcome | Who suffers? |
  | :--- | :--- | :--- | :--- |
  | **Goodhart's Law** | Gaming a metric | Metric loses value | The measurer |
  | **Market for Lemons** | Hidden defects (natural) | Market collapse | Buyers & Good Sellers |
  | **Moloch** | Race to the bottom | Shared value lost | Everyone |
  | **Verifiability Trap** | **Manufactured opacity** | **Judgment becomes impossible** | **The Audience / Truth** |

  ### Conclusion

  You have identified a specific subtype of coordination failure that is becoming increasingly relevant in information-heavy economies. While **Competitive Obfuscation** is the academic term for the tactic, **The Verifiability Trap** captures the systemic epistemic collapse you described.

  It differs from the "Market for Lemons" because the asymmetry is weaponized, not inherited. It differs from "Moloch" because the sacrifice is the *tool of measurement* itself, making the sacrifice invisible until the system is already blind.

  **Name:** **The Verifiability Trap**
  **Law:** **Gresham's Law of Auditability** (Low auditability drives out high auditability).
  **Mechanism:** **Competitive Signal Jamming.**
