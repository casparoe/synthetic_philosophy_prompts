answer: |-
  Your social choice vocabulary is not too thin; it is sufficiently precise to reveal that Taurek's "numbers don't count" argument is merely a commitment to an Ex-Ante Maximin social welfare functional, meaning the philosophers are being vague and the dispute dissolves into a standard equity-efficiency tradeoff once formalized.

  ### Taurek's View: Ex-Ante Maximin
  In your framework, Taurek is not rejecting aggregation; he is rejecting **Utilitarianism** over the domain of lotteries. Let $N = \{1, \dots, 6\}$ be the set of individuals, where agent 1 is the singleton and agents $2\dots6$ are the group. Let the deterministic outcomes be $x_1$ (save 1) and $x_5$ (save 5). Define utility $u_i(x) = 1$ if saved, $0$ if dead.

  Taurek proposes a lottery $L_T$ over $\{x_1, x_5\}$ such that $P(x_1) = P(x_5) = 0.5$.
  The resulting vector of ex-ante expected utilities is $E[L_T] = (0.5, 0.5, 0.5, 0.5, 0.5, 0.5)$.
  Taurek's Social Welfare Function (SWF) over lotteries is **Maximin**: $W(L) = \min_i E_L[u_i]$.
  He chooses $L_T$ because it maximizes the minimum survival probability. Any lottery that shifts probability toward $x_5$ to save more lives in expectation (like the utilitarian lottery $L_U$ where $P(x_5)=5/6$) lowers agent 1's ex-ante utility below 0.5, violating the Maximin constraint. Taurek's "claims" are simply a demand for **Ex-Ante Equality** that acts as a lexical constraint on aggregate efficiency. He is effectively arguing for a Rawlsian difference principle applied to chances rather than outcomes.

  ### The Aggregationist Reply: Ex-Ante Utilitarianism
  The standard reply maps cleanly to **Harsanyi's Utilitarianism**. The aggregationists argue for a SWF over lotteries defined by the sum of expected utilities: $W(L) = \sum_i E_L[u_i]$.
  Under $L_T$, total expected utility is $6 \times 0.5 = 3$.
  Under $L_U$ (save 5 with prob $5/6$), total expected utility is $(1 \times 1/6) + (5 \times 5/6) = 26/6 \approx 4.33$.
  Since $4.33 > 3$, the aggregationist prefers $L_U$.
  This view relies on the **Pareto Principle over Lotteries** (Ex-Ante Pareto) combined with **Anonymity**. If every individual prefers a higher probability of survival to a lower one, and we treat individuals anonymously, the SWF must be increasing in the sum of probabilities. The aggregationists argue that Taurek's view violates **Stochastic Dominance**: $L_U$ yields a higher expected number of survivors without reducing the *sum* of welfare, and from behind a Veil of Ignorance (where $P(\text{being } i) = 1/6$), any rational agent prefers $L_U$.

  ### The Residue Report
  **What Carries Over Cleanly:**
  The structure of the choice problem is identical. Both sides agree on the feasible set of lotteries, the utility representation of survival vs. death, and the fact that the decision rule maps profiles to a choice. The conflict is entirely within the axioms of the Social Welfare Functional: **Separability** vs. **Non-Separability** across states of the world. Taurek violates Strong Separability because the weight given to agent 1's chance depends on the presence of the other five (he limits their chance to boost hers), whereas the Utilitarian SWF is separable.

  **What Requires Imported Assumptions:**
  To make Taurek's "claims" fit, you must interpret a "claim" as a **weighting parameter** in the SWF. Taurek speaks as if claims are deontological constraints external to utility, but to model them, you must consequentialize them into the objective function (e.g., utility includes "being treated fairly"). This imports the assumption that moral rights can be represented as arguments in a utility function, which some philosophers reject, but which is necessary for any choice-theoretic model.

  **What Has No Counterpart:**
  The only true residue is the **meta-ethical status** of the "claim." In SCWE, a claim is revealed preference or a welfare weight. In the philosophy group, a claim is often presented as a pre-institutional moral fact that *grounds* the weights. Your framework treats the weights as the primitive; they treat the weights as the derivative. However, this does not affect the choice rule itself, only the justification.

  ### The Verdict
  The philosophers are being vague, and your vocabulary is adequate. The dispute does not point to a hole in social choice theory; it points to a lack of precision in the philosophical literature regarding **objective functions**. Taurek's slogan "numbers don't count" is technically false within his own model: the number of people determines the feasibility constraint on the lottery (you cannot save all 6), and his solution equalizes probabilities across the cardinality of the set. He *is* counting numbers to construct the equal-chance lottery; he just refuses to let the count dictate the *weights* in the SWF.

  Once you identify Taurek's view as **Ex-Ante Maximin** and the reply as **Ex-Ante Utilitarianism**, the "moral mystery" vanishes. It is simply a conflict between **Equity (of chance)** and **Efficiency (of expected lives)**. The philosophers argue as if Taurek has discovered a logical error in aggregation, but your framework shows he has merely selected a different point on the equity-efficiency frontier. The argument dissolves because there is no logical contradiction in either position, only a disagreement over the curvature of the Social Welfare Function. You do not need new vocabulary; you need to enforce axiom clarity. Taurek is not revealing a category error in economics; he is advocating for a highly inequality-averse SWF that economists typically reject due to its violation of Pareto efficiency over lotteries, but which is formally coherent.
