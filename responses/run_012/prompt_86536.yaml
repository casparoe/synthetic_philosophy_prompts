prompt: |-
  I'm a software engineer who ended up managing a platform team at a mid-size company, and I keep ending up in the same meeting. We've always got two or three long-running things on the books — a payments rewrite we kicked off about fourteen months ago, a homegrown search service that's been limping along, an internal tool that three engineers keep polishing — and every quarter we sit down to decide whether to keep funding them, and somebody says we can't quit now, look how much we've already put into it. The stakes aren't small: each of these is a few hundred thousand dollars a year and a couple of people's jobs, and I'm the one who has to walk into the VP's office and either defend the spend or kill the thing. I've read enough pop economics to know the standard line, that past spending is water under the bridge and you should only compare what it costs from here against what you get from here, but the blanket version of that has always bugged me. There seem to be real cases where the fact that you already spent the money does matter — it bought you skills, or a reputation for finishing what you start, or an option you'd lose by walking away — and I definately don't think everyone on my team is wrong every time they say something that sounds like the fallacy. I've got no formal philosophy or econ background, so I need this spelled out and turned into something we can actually run.

  So here's what I want: a keep-going-or-kill procedure for in-flight projects. The questions in the order we should ask them, what counts as a good answer to each, the point where the procedure just says kill and we stop, and the point where it has to stop and hand the decision to a person because it's turned into a values question — like how much we owe the people who bet their careers on this — rather than a factual one. Be honest in the writeup: I want the version where sunk costs really are irrelevant stated as a special case with its conditions attached (something about who's doing the deciding, whether the spending bought anything durable, whether it changed what anyone else will do, whether it tied our own hands), not as the whole story, and I want the cases where honoring the past spending is actually defensible laid out next to the ones where it's just the fallacy in a costume. Also flag where the procedure will misfire and where a clever person could game it to keep their pet project alive, because I know exactly who on my team will try. Keep it to something two tech leads can run through in about an hour at a whiteboard, since we don't have an economist on staff and I'm not going to get one.

  Then run it end to end on three cases and show your work, including where it gives an answer I don't like. First, the payments rewrite: the old system still works for now, but we just found out it cant meet a new compliance requirement, so some of those fourteen months were genuinely necessary and some of it was gold-plating we did because it was fun. Second, something I keep chewing on with a friend: they're four years into a long training program and want out, and everyone tells them that's the sunk cost fallacy talking, but the same four years have made them better at this than they'd be at anything else they could switch into now, and I honestly don't know if the standard line gets that one right. Third, the internal tool that three engineers have been polishing for a year and that about six people use; I'm pretty sure the answer is going to be kill it, and I want you to not soften that. Last thing: tell me what the procedure can't do. Specifically, is there a version of this where the honest answer is that a group of people who all invested together will basically never be able to run it on themselves, and if so, what do you do about that?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User Persona:** Software engineer turned platform manager at a mid-size company. Pragmatic, skeptical of textbook economics, aware of team dynamics/politics.
      *   **Problem:** Recurring quarterly meetings deciding whether to continue funding long-running projects (payments rewrite, search service, internal tool). Team uses "sunk cost" arguments ("we've already spent so much"). User needs a concrete procedure to decide Keep vs. Kill.
      *   **Constraints/Requirements:**
          *   Must acknowledge that sunk costs *can* matter (skills, reputation, options), not just dismiss them as a fallacy.
          *   Must distinguish between valid reasons to honor past spend vs. fallacious ones.
          *   Must include a "Kill" threshold and a "Human/Values" handoff point.
          *   Must identify failure modes/gaming vectors (how clever engineers might manipulate it).
          *   Format: A procedure two tech leads can run in ~1 hour at a whiteboard.
          *   **Case Studies:** Run the procedure on three specific cases:
              1.  Payments rewrite (14 months, compliance issue, some gold-plating).
              2.  Friend's career (4 years training, wants out, specialized skills).
              3.  Internal tool (3 engineers, 6 users, likely a kill).
          *   **Limitations:** Explicitly state what the procedure *can't* do, specifically regarding group bias/inability to self-evaluate.
      *   **Tone:** Honest, direct, pragmatic, not academic. No softening on the "kill" recommendation where warranted.

  2.  **Deconstruct the "Sunk Cost" Nuance:**

      *   *Textbook View:* Money spent is gone. Decide based on Future Cost vs. Future Value.
      *   *Real World View:* Past spend creates assets (code, knowledge, reputation, morale, contractual obligations). Abandoning might destroy these assets.
      *   *The Bridge:* The procedure needs to evaluate *what remains* of the past investment, not the money itself.

  3.  **Drafting the Procedure (The "Whiteboard Protocol"):**

      *   *Goal:* Keep it under 1 hour. 5-6 key questions.
      *   *Structure:*
          1.  Future Value (The Textbook Check).
          2.  Recoverable Assets (The Sunk Cost Nuance).
          3.  Opportunity Cost (The "What Else" Check).
          4.  The Kill Switch (Hard constraints).
          5.  The Values Handoff (When math stops working).
      *   *Gaming Prevention:* Need specific checks for optimism bias and "just one more quarter."

  4.  **Developing the Case Studies:**

      *   *Case 1: Payments Rewrite.*
          *   Context: 14 months, compliance deadline, some gold-plating.
          *   Analysis: Compliance makes it mandatory (Future Value > 0). Gold-plating is sunk. Existing code might be reusable.
          *   Outcome: Keep, but scope cut.
      *   *Case 2: Friend's Career.*
          *   Context: 4 years training, wants out, specialized skills.
          *   Analysis: This is personal, not corporate. "Skills" are recoverable assets. "Misery" is a future cost.
          *   Outcome: Quit (likely), but acknowledge the skill asset.
      *   *Case 3: Internal Tool.*
          *   Context: 3 engineers, 6 users, polishing for a year.
          *   Analysis: Low Future Value. High Opportunity Cost (3 engineers could do something else). No recoverable assets of value.
          *   Outcome: Kill. Hard.

  5.  **Addressing the Limitations (The "Group Bias" Problem):**

      *   Can a team objectively evaluate their own baby? Usually no.
      *   Need an external arbiter or a specific mechanism (rotation, pre-commitment).

  6.  **Refining the Content (Self-Correction/Iterative Polish):**

      *   *Critique:* Is the procedure too abstract?
      *   *Fix:* Make the questions specific yes/no or numeric where possible.
      *   *Critique:* Did I address the "sunk cost isn't always a fallacy" requirement?
      *   *Fix:* Ensure Question 2 explicitly asks about *residual value* of past spend (knowledge, components, reputation).
      *   *Critique:* Is the tone right?
      *   *Fix:* Avoid academic jargon. Use "engineering manager" speak. Be direct about the internal tool kill.
      *   *Critique:* Did I answer the specific prompt about the "version where honest answer is group can't decide"?
      *   *Fix:* Make sure the Limitations section explicitly covers the "insider bias" and suggests bringing in an outsider.

  7.  **Final Review against Constraints:**

      *   Keep-going-or-kill procedure? Yes.
      *   Questions in order? Yes.
      *   Good answers defined? Yes.
      *   Kill point defined? Yes.
      *   Values handoff defined? Yes.
      *   Sunk cost nuance included? Yes.
      *   Gaming vectors flagged? Yes.
      *   Three cases run end-to-end? Yes.
      *   Limitations section included? Yes.

  8.  **Drafting the Response (incorporating the above thoughts):**

      *   *Intro:* Acknowledge the tension between theory and reality.
      *   *The Protocol:* "The Residual Value Protocol."
      *   *The Cases:* Apply the protocol rigorously.
      *   *The Limitations:* Be honest about human psychology.

      *(Self-Correction during drafting Case 2)*: The prompt asks about a *friend*, not an employee. I need to make sure I treat it as a decision *they* are making, but analyzed through the same lens. The prompt implies the user is advising the friend. I will frame it as applying the logic to a human capital decision.

      *(Self-Correction during drafting Case 3)*: The prompt says "I want you to not soften that." I must be unequivocal. Kill it. Reassign the engineers.

      *(Refining the "Sunk Cost" distinction)*: I need to make sure I clearly state: Sunk *money* is irrelevant. Sunk *effort that created durable assets* is relevant. This is the crux of the user's philosophical itch.

  9.  **Final Polish:** Check word count and flow. Ensure the "Gaming" section is sharp. (e.g., engineers redefining "done" to be just over the horizon).

  10. **Final Output Generation** (Proceed to generate response based on these steps).
answer: |-
  Here is a procedure designed for your context. It accepts your premise: money spent is gone, but *assets* bought with that money might remain. The goal is to separate the value of the asset from the pain of the expense.

  ### The Residual Value Protocol (RVP)
  **Timebox:** 60 Minutes
  **Participants:** You + 1 Tech Lead (ideally one not attached to the project)
  **Artifacts:** Whiteboard, Jira/Roadmap data, Headcount costs

  Do not discuss "how hard we worked." Discuss "what we have to show for it."

  #### Phase 1: The Future Test (15 Mins)
  *Ignore the past completely for this section.*

  **Q1: If we started this project today from zero, would we start it?**
  *   **Good Answer:** "Yes, because [specific business metric] requires it," or "No, because [market/tech] has changed."
  *   **Bad Answer:** "We're too far in to stop," or "It would look bad."
  *   **Action:** If **No**, move immediately to Phase 2. If **Yes**, fund it (subject to Phase 3).

  **Q2: What is the specific, measurable outcome of the *next* quarter?**
  *   **Good Answer:** "Reduce latency by 20%," "Meet PCI-DSS requirement X," "Onboard 5 new clients."
  *   **Bad Answer:** "Finish the refactor," "Polish the UI," "Get it ready for launch." (These are activities, not outcomes).
  *   **Action:** If you cannot define a binary success metric for 90 days, **KILL**.

  #### Phase 2: The Residual Asset Audit (20 Mins)
  *This is where sunk costs matter. We are not counting money; we are counting durable assets created by the spend.*

  **Q3: What durable assets exist now that didn't exist 14 months ago?**
  *   **Valid Assets:** Reusable code libraries, proprietary data sets, certified compliance documentation, team-specific domain knowledge that is documented and transferable.
  *   **Invalid Assets:** "Morale," "Momentum," "Almost done code," "Relationships with vendors" (unless contractual).
  *   **Action:** List them. If the list is empty, the sunk cost is truly sunk. Ignore it. If the list has items, estimate the cost to recreate them from scratch.

  **Q4: Does abandoning the project destroy those assets, or can they be harvested?**
  *   **Good Answer:** "We can lift the auth module and use it elsewhere," or "The compliance docs apply to the whole company."
  *   **Bad Answer:** "The code is too tangled to reuse," or "The knowledge is only in Dave's head."
  *   **Action:** If assets can be harvested, kill the project but keep the assets. If assets are tied to the project's existence, add their recreation cost to the "Future Cost" of restarting later.

  #### Phase 3: The Opportunity & Values Check (15 Mins)

  **Q5: What is the specific work these people will do if we stop this?**
  *   **Good Answer:** "They move to the Search Team to fix the indexing lag," or "We have a backlog of security debt worth $500k."
  *   **Bad Answer:** "We'll figure it out," or "They can maintain this."
  *   **Action:** If you cannot name the next highest-value task, you cannot kill this project. You are hoarding headcount.

  **Q6: Is there a non-factual reason to continue? (The Values Handoff)**
  *   **Trigger:** If the math says Kill, but the cost of stopping is severe reputational damage, legal liability, or catastrophic morale loss among key retainers.
  *   **Action:** If this question is the *only* reason to continue, **STOP THE PROCEDURE.** This is no longer an engineering decision. It is a strategic/HR decision. Document the "emotional tax" and hand it to the VP with a recommendation to pay the tax once, then reset.

  #### Phase 4: The Kill Switch
  **Automatic Kill Conditions:**
  1.  **Q1 is No** AND **Q3 Assets are Non-Transferable.**
  2.  **Q2** cannot be answered with a binary metric.
  3.  **Q5** is unanswered (no alternative work).

  #### Gaming Vectors (How your team will try to break this)
  *   **The "Just One More Quarter" Pivot:** They will redefine Q2 outcomes to be easy wins to buy time. *Counter:* You must define the Q2 outcome *before* they propose the plan.
  *   **The "Spaghetti Asset" Bluff:** They will claim code is reusable (Q3) when it isn't. *Counter:* Require a 2-day spike by a *different* engineer to verify reusability before counting it as an asset.
  *   **The "Morale Hostage":** They will imply people will quit if killed (Q6). *Counter:* Ask for names. If they won't name names, it's a bluff. If they do name names, treat it as a retention risk, not a project justification.

  ---

  ### Case Study Runs

  Here is the protocol applied to your three scenarios.

  #### Case 1: The Payments Rewrite
  *Context: 14 months in. Old system works but fails new compliance. Some gold-plating occurred.*

  *   **Q1 (Start from zero?):** **Yes.** Compliance is mandatory. If we didn't have the rewrite, we'd have to start a patch project today.
  *   **Q2 (Next 90 days):** "Pass PCI-DSS audit for new transaction flow." (Binary: Pass/Fail).
  *   **Q3 (Assets):**
      *   *Valid:* New transaction ledger schema, integration with new provider API.
      *   *Invalid:* The "fun" microservices architecture (gold-plating).
  *   **Q4 (Harvestable?):** The ledger schema is usable. The gold-plated orchestration layer is likely not.
  *   **Q5 (Alternative Work):** If we stop, these engineers must patch the legacy system to meet compliance.
  *   **Q6 (Values):** High risk. If we fail compliance, the company loses the ability to process cards.

  **Verdict:** **KEEP, but SCOPE CUT.**
  *   **Reasoning:** Q1 is Yes (compliance forces it). However, the "gold-plating" is sunk cost fallacy. You are not continuing the project because you spent 14 months; you are continuing because the *future* value (compliance) exceeds the *future* cost.
  *   **Action:** Strip the gold-plating. Use the ledger schema. Ship the minimum viable compliance. The 14 months matters only insofar as it bought you a ledger schema that saves you 2 months of future work.

  #### Case 2: The Friend's Career (Human Capital)
  *Context: 4 years training. Wants out. Specialized skills. Friends say "Sunk Cost Fallacy."*

  *   **Q1 (Start from zero?):** If your friend were 22 today, knowing what they know about the misery of the work vs. the pay/prestige, would they enter this training?
      *   *Answer:* Likely **No**. (They want out).
  *   **Q2 (Next 90 days):** "Complete certification" vs. "Mental health recovery/Transition planning."
  *   **Q3 (Assets):**
      *   *Valid:* Specialized skills, network, credential.
      *   *Invalid:* "Time served," "Seniority."
  *   **Q4 (Harvestable?):** **Yes.** This is the critical distinction. In software, if you kill the project, the code often dies. In careers, if you kill the *path*, the *skills* often remain transferable.
      *   *Analysis:* Can they use the skills in a different role? If yes, the asset is durable.
  *   **Q5 (Alternative Work):** What else can they do? If the skills are hyper-specialized (e.g., specific ancient mainframe language), the asset value drops. If they are general (e.g., complex system management), asset value is high.
  *   **Q6 (Values):** "Owe it to myself/the program." This is the Values Handoff.

  **Verdict:** **QUIT THE PATH, KEEP THE ASSETS.**
  *   **Reasoning:** The standard econ line is right about the *time*, but wrong about the *skills*. The 4 years are gone. But the skills are a Residual Asset (Q3).
  *   **Action:** Do not continue the training program just to "validate" the 4 years. That is the fallacy. However, do not throw away the skills. Pivot to a role that uses the skills but removes the misery. The 4 years matters because it bought a skillset, not because it bought a specific job title.
  *   **Uncomfortable Truth:** If the skills are *only* usable in the role they hate, the asset value is zero. In that case, the 4 years is truly sunk. Cut losses.

  #### Case 3: The Internal Tool
  *Context: 3 Engineers. 6 Users. Polishing for 1 year. You suspect it's a kill.*

  *   **Q1 (Start from zero?):** **No.** Would you hire 3 engineers today to build a tool for 6 people? Absolutely not.
  *   **Q2 (Next 90 days):** "Polish the dashboard," "Add export feature." (These are activities, not outcomes).
      *   *Correction:* "Increase user adoption from 6 to 20."
      *   *Reality:* They probably can't promise that.
  *   **Q3 (Assets):**
      *   *Valid:* Maybe a specific auth library?
      *   *Invalid:* The tool itself (nobody uses it).
  *   **Q4 (Harvestable?):** Likely low. Internal tools are usually tightly coupled to the problem they solve.
  *   **Q5 (Alternative Work):** 3 engineers could clear 50% of the platform backlog or fix the Search Service.
  *   **Q6 (Values):** "The team loves working on this."

  **Verdict:** **KILL.**
  *   **Reasoning:** Q1 is No. Q2 is weak. Q5 shows massive opportunity cost (3 engineers is 25% of a small team).
  *   **The Hard Part:** You said "don't soften it." Here it is: This project is a vanity metric. It is a place to hide engineers who don't want to deal with the mess of the core platform. The fact that they have spent a year on it is irrelevant. The fact that they enjoy it is a management problem, not a business justification.
  *   **Action:** Shut it down. Freeze the repo. Reassign the 3 engineers. If they quit because they aren't allowed to play with toys, you have a retention issue to solve separately, but you cannot solve it by burning $500k/year on unused software.

  ---

  ### Limitations: Where The Procedure Breaks

  You asked for honesty about where this fails. Here is the breakdown.

  **1. The Insider Blindness Problem**
  *   **The Issue:** A group of people who have invested 14 months together develop a shared narrative. They will unconsciously inflate the value of Q3 (Assets) and deflate the risk of Q1 (Future Value). They genuinely believe the spaghetti code is "robust" because they know how to navigate it.
  *   **The Failure:** The team will answer "Yes" to Q4 (Harvestable) when the answer is "No."
  *   **The Fix:** You cannot run Phase 2 (Asset Audit) with the project team. You must run it with a **skeptical outsider** (a lead from a different team) who has 5 minutes to look at the code/docs and declare if it's reusable. If you don't have an outsider, the procedure is just a rubber stamp.

  **2. The "Strategic Option" Trap**
  *   **The Issue:** Sometimes you keep a project not for its direct value, but to prevent a competitor from having it, or to keep a vendor happy. This looks like "sunk cost" but is actually "option value."
  *   **The Failure:** The procedure might flag this as a "Kill" because the direct ROI is negative.
  *   **The Fix:** This falls under Q6 (Values/Strategy). If the VP says "We keep this to look enterprise-ready for IPO," that overrides the math. But it must be explicitly labeled as "Marketing Spend," not "Engineering Investment."

  **3. The Group Self-Preservation Instinct**
  *   **The Issue:** You asked: *"Is there a version of this where the honest answer is that a group of people who all invested together will basically never be able to run it on themselves?"*
  *   **The Answer:** **Yes.** If the project's survival is tied to the team's identity (e.g., "We are the Search Team"), they will physically cannot kill it. It is an existential threat.
  *   **What To Do:** In this case, **do not let them run the protocol.**
      *   You (the Manager) must run Phase 1 and 3 alone.
      *   You must bring in an external architect for Phase 2.
      *   You must make the decision, and frame it as a "Pivot" not a "Kill."
      *   If the team is too invested to be objective, their objectivity is the first casualty of the sunk cost. You are not paying them to decide portfolio strategy; you are paying them to execute. The decision to stop must come from above their pay grade.

  **Summary for your VP meeting:**
  Use the RVP to separate the *assets* from the *expenses*.
  *   **Payments:** Keep for compliance, cut the gold-plating. (Asset: Schema).
  *   **Career:** Quit the track, keep the skills. (Asset: Knowledge).
  *   **Internal Tool:** Kill immediately. (Asset: None).

  If your team fights you on the Tool, it's not because the math is wrong. It's because they are the wrong people to do the math. Take the pen out of their hand.
