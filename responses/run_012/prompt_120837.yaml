prompt: |-
  I am a high school student who has spent the past year in an economics seminar and on our debate team's competition-policy case packet, so I am reasonably fluent in the vocabulary of antitrust: market definition, market power, monopsony, cartels and price-fixing, barriers to entry, the consumer-welfare standard, efficiencies defenses, and the statutory immunities that carve whole categories of conduct out of competition law. I have also been trying to understand the moral and legal debate over unions, strikes, and the right to organize, and it has started to seem to me that the two vocabularies might be doing the same work in different languages — that a union is a cartel, that a strike is a coordinated supply withdrawal, and that the "right to organize" is just a permission to collude that the rest of us have decided to tolerate. Acting as an expert in both labor law and competition economics, and being careful not to let the economics smuggle in conclusions that really belong to the moral debate, please restate the central positions in the debate over the right to organize — the case for collective bargaining and the strike weapon, the standard objection that unions are labor monopolies, the claim that workers hold a right rather than a license, and the question of how a legal system should treat agreements among workers that would be unlawful if made among firms — as faithfully as you can in the vocabulary of antitrust and competition analysis. Where a cartel analogy genuinely fits, say exactly how far it fits; where the concepts of market power, monopsony, or consumer welfare do real explanatory work, use them rather than gesturing at them.

  Then give me the residue report, which is the part I actually care about. Go point by point: what translates cleanly, what translates only with distortion, and what has no counterpart at all in the language of competition policy — and for each item in that last category, tell me whether the gap reflects something competition policy is structurally unable to say, so that the translation is lossy rather than equivalent, or instead reflects something the original labor argument never made clear in the first place. I would like to know whether my suspicion that this is "just the same argument in economic terms" is right, or whether it quietly changes the subject.

  Please think carefully before answering: begin with a short brainstorm in which you list the possible mappings and decide which are promising, flag any that look like false friends, and then organize your response as the translation followed by the residue report. Be candid when a match breaks down rather than smoothing it over, and do not pad the answer with background about the history of labor law or antitrust.
