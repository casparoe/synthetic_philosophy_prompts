answer: |-
  Here is a design for a 90-minute session that forces the participants to inhabit the structural tensions of elections versus sortition without hearing the theory until the end.

  ### Activity Title: "The Allocation Committee"

  **The Core Mechanic:**
  The group must allocate a scarce resource (18 high-quality chocolates) among themselves. A small sub-committee (3 people) makes the final decision. The method of selecting that committee changes between Round 1 and Round 2.

  **Materials:**
  *   18 Envelopes. Inside 15: a card saying **"Standard Need."** Inside 3: a card saying **"Critical Need."** (Shuffle and distribute randomly on entry).
  *   18 Chocolates (or vouchers/tokens) in a visible bowl at the front.
  *   A hat/bowl for drawing names.
  *   Whiteboard and markers.
  *   Paper and pens for everyone.
  *   A timer (visible).

  **The Payoff Scheme:**
  *   **The Pot:** There are exactly 18 chocolates.
  *   **The Rule:** Only the Committee can distribute the chocolates. They can give them to anyone, including themselves.
  *   **The Stake:** If a participant leaves with a chocolate, they win. If not, they lose. (This creates genuine tension).
  *   **Committee Incentive:** Committee members are guaranteed a chocolate *plus* a "Governance Bonus" (an extra chocolate from your personal stash, or a $10 voucher) **IF** they complete the task.

  ---

  ### Minute-by-Minute Timeline (90 Minutes)

  *Note: Times listed are "Real Time." Optimistic estimates usually fail here. Be ruthless with the timer.*

  **00:00 – 00:05 | Arrival & Setup (5 mins)**
  *   **Action:** As people enter, hand them an envelope. Tell them: *"Do not open this until instructed. Sit anywhere."*
  *   **Facilitator:** Stand at the front. Minimal greeting. Set a tone of serious procedure.
  *   **Script:** "We are going to run two rounds of resource allocation. In each round, a Committee of three will decide who gets the chocolates in this bowl. There are 18 chocolates. There are 18 of you. Open your envelopes now."
  *   **Reveal:** They see their Need Level. Tell them: *"Critical Need holders gain double satisfaction from a chocolate. Standard Need gain single. The Committee's goal is to maximize total group satisfaction. But the Committee decides."*

  **00:05 – 00:30 | Round 1: The Election (25 mins)**
  *   **Selection (5 mins):** Ask for volunteers to be the Committee. *"Who wants the responsibility? You need three people."*
      *   *Observation:* Watch who stands up. Usually, it's the loudest, most confident, or those who enjoy authority. If no one stands, offer the "Governance Bonus" explicitly.
      *   *Validation:* If more than 3 volunteer, the room votes by show of hands to pick the final 3.
  *   **Deliberation (10 mins):** The 3 Committee members sit at the front. The other 15 are "Constituents."
      *   **Rule:** Constituents can shout advice, lobby, or plead.
      *   **Constraint:** The Committee's decision **must be approved by a majority vote of the Constituents.** If the vote fails, *no one* gets chocolate (the pot is removed). This simulates **Accountability/Re-election.**
  *   **Decision & Vote (10 mins):** Committee announces distribution. Room votes. Distribute chocolates.
  *   **Reset:** Collect chocolates. Reset the board.

  **00:30 – 01:00 | Round 2: The Lottery (30 mins)**
  *   **Transition Script:** "That felt [insert observation: slow/political/exclusive]. Let's try a different way to pick the Committee. It should be fairer."
  *   **Selection (5 mins):** Put all 18 names in the hat. Draw 3.
      *   *Observation:* Watch the body language. Relief (if they didn't want work) or Panic (if they feel unqualified). Note if the "loud" people from Round 1 are now outside the room.
  *   **Deliberation (15 mins):** Same setup. Committee at front. Constituents lobbying.
      *   **The Sting (Crucial Rule Change):** Tell the Committee: *"You do not need a vote of approval. Your decision is final. You cannot be removed."*
      *   **The Temptation:** Remind them privately (pass a note): *"You still get the Governance Bonus regardless of what the group thinks."*
      *   *Why:* This simulates the lack of electoral accountability. They can be corrupt, incompetent, or captured by lobbyists without consequence.
  *   **Decision & Distribution (10 mins):** Committee announces. Distribute.
  *   **Cleanup:** Clear the room for debrief.

  **01:00 – 01:30 | The Debrief (30 mins)**
  *   **Action:** Do not lecture. Ask questions. Write their answers on the whiteboard.
  *   **Script:** "We just ran two systems. I haven't told you what they represent yet. Let's talk about what happened."

  ---

  ### The Debrief: Mapping Experience to Theory

  Do not use the words "Sortition," "Election," or "Democracy" until the very end. Use the questions to draw the concepts out of them.

  **Phase 1: The Selection Bias (Round 1)**
  *   **Question:** "In Round 1, who volunteered? Look around the room. Did the volunteers look like the group, or did they share specific traits?"
      *   *Target Insight:* **Descriptive Representation.** Elections select for extroversion, confidence, and time availability.
  *   **Question:** "Constituents, how did you talk to the Committee? Did you tell them the truth about your 'Need' cards, or did you tell them what you thought they wanted to hear?"
      *   *Target Insight:* **Campaign Promises vs. Reality.** Candidates optimize for votes, not necessarily optimal policy.
  *   **Question:** "Committee, did you feel pressure to give chocolates to the loud people in the front row rather than the quiet people in the back?"
      *   *Target Insight:* **Majoritarian Tyranny/Visibility Bias.**

  **Phase 2: The Accountability Void (Round 2)**
  *   **Question:** "Round 2 fixed the selection problem. The Committee was random. But how did the *mood* in the room change when you realized they couldn't be voted out?"
      *   *Target Insight:* **Accountability.** Without the threat of removal, power becomes dangerous.
  *   **Question:** "Constituents, did you try harder to lobby them in Round 2? Did it feel more desperate?"
      *   *Target Insight:* **Capture.** If you can't vote them out, you must bribe or bully them.
  *   **Question:** "Committee, did you feel less responsible for the outcome because you didn't choose to be there?"
      *   *Target Insight:* **Civic Duty vs. Ambition.** Random selection relies on duty; elections rely on ambition.

  **Phase 3: The Synthesis (The Last 10 Minutes)**
  *   **Now you reveal the terms.**
  *   **Script:** "Round 1 was an **Election**. It selected for ambition and visibility, but kept the Committee accountable. Round 2 was **Sortition** (or Lottocracy). It fixed the selection bias, but removed the accountability mechanism."
  *   **The Hard Truth:** "The literature argues we should use Lotteries for policy. But as you felt, a random body has no memory, no incentive to be competent, and no fear of punishment. If we want to use Round 2, we have to build a new engine for accountability. What would that look like?"
      *   *Let them brainstorm:* Rotation? Audits? Smaller terms?
      *   *Your Closing:* "That is the actual debate. Not 'juries vs. politicians.' But 'how do we keep the fairness of the lottery without losing the accountability of the vote?'"

  ---

  ### Troubleshooting: What Will Go Wrong

  **1. No One Volunteers in Round 1**
  *   **Prediction:** People are shy. The "Election" fails to start.
  *   **Temptation:** You step in and assign people.
  *   **Correction:** Do not assign. Increase the "Governance Bonus." Say: *"The Committee gets 3 chocolates guaranteed, plus this $20 voucher."* Money works. You need to prove that *incentives* attract a certain type of person.

  **2. The Round 2 Committee Refuses to Decide**
  *   **Prediction:** Randomly selected people feel illegitimate and freeze.
  *   **Temptation:** You help them decide.
  *   **Correction:** Let them flounder. The anxiety *is* the data. If they truly stall, impose a hard deadline: *"If no decision in 2 minutes, the chocolates are destroyed."* This forces them to feel the weight of unearned power.

  **3. The "Critical Need" Cards Are Ignored**
  *   **Prediction:** Both Committees just split chocolates evenly (6 each) because it's easy.
  *   **Temptation:** Tell them they did it wrong.
  *   **Correction:** Use this in the debrief. *"Why did you ignore the rules of 'Need'? Was it easier to please the crowd?"* This proves that even with good rules, human systems default to path of least resistance.

  **4. The Debrief Turns into a Political Fight**
  *   **Prediction:** Someone says, "Well, elections are corrupt anyway," or "Random people are idiots."
  *   **Temptation:** You agree or argue.
  *   **Correction:** Pivot to structure. *"I'm not asking which is better morally. I'm asking which felt more stable procedurally. Did you feel safer in Round 1 or Round 2?"*

  ---

  ### The Limitation: What This Activity Cannot Show

  You must be honest about this in your article. This activity cannot reproduce two critical elements of the real argument:

  1.  **Statistical Power:** 18 people drawing 3 names does not prove a random sample represents the population. A real Citizens' Assembly needs hundreds to be statistically descriptive. This room is too small for the "mirror of society" argument to hold water mathematically.
      *   *What you say:* "You felt the randomness, but you didn't feel the statistical representation. That requires scale we can't fit in this room."
  2.  **Institutional Memory:** In Round 2, the Committee started from zero. In a real sortition system, there is staff, expert testimony, and time to learn. The "incompetence" they felt was partly due to time pressure, not just the selection method.
      *   *What you say:* "You felt the lack of expertise. In a real assembly, you'd have weeks, not 15 minutes. But the pressure of 'no one can fire me' would remain."

  ### Why This Works for Your Piece

  This design gives you the "gut feel" you said was missing from the literature.
  *   **Round 1** gives you quotes about how the volunteers "seemed like the usual suspects" or "talked over people."
  *   **Round 2** gives you quotes about how the randoms "looked terrified" or "just listened to the loudest lobbyist."
  *   **The Payoff** ensures the stakes were real. People *wanted* the chocolate. They felt the injustice of the distribution.

  You aren't writing about what they *thought*; you're writing about what they *did*. That is the story.
