answer: |-
  **Question 1**

  Priya spends one week in a co-working space that rents her one of three desks per day: the Window desk (W), the Standing desk (S) and the Quiet desk (Q). Her preferences are cyclic: she prefers S to Q (her back), Q to W (the glare on the screen), and W to S (standing all day tires her legs). For each of the three possible swaps she would pay up to $3; the space charges $2 per swap, and she must confirm every swap herself. The manager makes one offer per day, Monday through Wednesday: each offer is the swap from the desk she currently holds to the next desk in the cycle (W→S→Q→W), and an offer she declines is simply repeated the following day. Before Monday's first offer, and only then, she may buy a lock for $4 that blocks all swaps for the week. She knows all of this in advance, knows her own preferences perfectly, and has no other commitment device.

  Write an essay addressing the following five points:

  1.  Reconstruct the money pump for Priya's case using the provided numbers and state exactly what the sure loss is.
  2.  Set out the assumptions the reconstruction needs regarding how desks and money combine in her preferences, her willingness to take a strictly preferred swap, and available commitment, noting which a critic could reasonably reject.
  3.  Work through four ways she might spend the week: taking every offer; declining every offer from the start; buying the lock in advance; and taking exactly one swap and then declining every later offer. Say which leaves her best off, and whether that last path is open to her, given that at each later moment the swap she declines is one she prefers.
  4.  Say what the case establishes about her — that she is exploitable, that she is sure to suffer a loss, or that she is irrational — and defend the distinction rather than running the three together.
  5.  Take a stand on whether the argument is synchronic or diachronic: whether it can support transitivity as a requirement on a preference ranking at a time, or whether it presupposes a norm governing a sequence of choices; and say what someone who holds that rationality is entirely synchronic should conclude about Priya. As a diagnostic, explain why the same three-day set-up would pose no problem at all for an agent whose preferences over the three desks are transitive.

  **(20 marks)**

  ***

  **Model Answer**

  Priya's situation generates a sure loss of $6 if she accepts all offers. On Monday, she holds W and swaps to S for $2. On Tuesday, holding S, she swaps to Q for $2. On Wednesday, holding Q, she swaps to W for $2. She returns to her initial desk state but is $6 poorer. Since her willingness to pay is $3 per swap, each transaction yields a subjective surplus of $1, masking the aggregate loss. The pump reconstructs how local gains aggregate to a global loss.

  This reconstruction relies on three assumptions. First, preferences over desks are separable from accumulated costs; she values the swap itself regardless of prior payments. Second, she acts myopically, taking any strictly preferred swap offered. Third, no commitment is possible except the lock. A critic might reasonably reject separability: the pain of losing $6 might make the third swap unattractive, breaking the cycle. Alternatively, one might reject myopia: a rational agent might foresee the cycle and decline the first swap despite preferring S to W locally. The assumption about commitment is factual, but the behavioral assumptions are normative vulnerabilities.

  Consider the four paths. Taking every offer leaves her at W minus $6. Declining every offer leaves her at W minus $0. Buying the lock leaves her at W minus $4. Taking exactly one swap (W to S) leaves her at S minus $2. Since she prefers W to S, declining every offer is strictly best. However, is this path open? At Monday's offer, she prefers S to W. To decline, she must sacrifice a local gain to prevent a future loss. If she is myopic, this path is closed; she cannot resist the immediate preference. If she is resolute, it is open. The lock is a costly substitute for resolution, costing $4 to save $6, whereas resolution costs nothing but requires overriding a local preference.

  The case establishes that Priya is exploitable, not that she is sure to suffer a loss. Exploitability denotes vulnerability to a strategy (the manager's offers) that *would* drain her if she responded naively. It does not prove inevitability, as she can decline. It establishes irrationality only under a diachronic norm. Running these together confuses vulnerability with compulsion. She is vulnerable because of her cycle, but suffers loss only if she fails to coordinate her choices over time. One can be exploitable without being irrational if one lacks the power to commit, but here she has foresight. Thus, the loss indicates a failure of rational coordination rather than mere bad luck.

  The argument is fundamentally diachronic. It supports transitivity only if rationality requires consistency across time, not merely at a time. It presupposes a norm governing sequences: do not choose a path that dominates another. Someone holding that rationality is entirely synchronic should conclude Priya is rational. At each moment, she maximizes utility given her options. The money pump poses no problem for a transitive agent because the cycle breaks at the first step. If W > S, she declines Monday's offer. No sequence initiates, so no loss accumulates. The pump requires both cyclic preferences and a sequence of choices. Without the sequence, the cycle is inert.

  Verdict: Priya is synchronically rational but diachronically defective. The pump reveals a conflict between local optimization and global welfare. Rationality requires resolving this conflict, either by correcting preferences or adopting resolute choice. Without diachronic norms, the loss is merely a tragedy, not a failure of reason. With them, it is a clear violation of practical rationality. The argument therefore fails as a proof of synchronic transitivity but succeeds as a proof of diachronic consistency requirements.

  **(702 words)**

  ***

  **Marking Scheme**

  **1. Reconstruction and Loss (4 marks)**
  *   **Must hit:** Correctly traces the W→S→Q→W cycle with $2 costs per step, identifying the total loss as $6 against the starting position.
  *   **Typical mistake:** Calculating the loss as $2 (one swap) or failing to note she returns to the original desk.

  **2. Assumptions and Criticism (4 marks)**
  *   **Must hit:** Identifies separability of money/desks and myopic choice as key assumptions; notes that foresight or non-separability could block the pump.
  *   **Typical mistake:** Treating the manager's offers as coercive rather than voluntary choices.

  **3. Four Paths and Availability (4 marks)**
  *   **Must hit:** Correctly ranks outcomes (Decline all > Lock > One Swap > Pump all) and notes that "Decline all" requires resisting a locally preferred option.
  *   **Typical mistake:** Claiming the Lock is the best outcome because it prevents swaps, ignoring the $4 cost vs $0 cost of declining.

  **4. Exploitable vs. Irrational (4 marks)**
  *   **Must hit:** Distinguishes vulnerability (exploitable) from inevitability (sure loss) and norm violation (irrational); argues loss depends on choice sequence.
  *   **Typical mistake:** Asserting she is *sure* to lose money regardless of her choices.

  **5. Synchronic vs. Diachronic (4 marks)**
  *   **Must hit:** Argues the pump is diachronic (requires sequence); explains transitive agent declines first offer, preventing the cycle.
  *   **Typical mistake:** Claiming the pump proves intransitivity is irrational at a single moment without time involved.

  **A vs B Distinction:** An A answer explicitly resolves the tension between synchronic rationality and diachronic loss; a B answer lists the five points without integrating them into a verdict on Priya.
