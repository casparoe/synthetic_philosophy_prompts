  **EXCERPT FROM THE NATIONAL HARM REDUCTION DIRECTIVE (4th Ed.)**
  **ISSUING AUTHORITY:** The Bureau of Allocative Integrity
  **CHAPTER:** 7.0 — The Lexical Threshold Protocol

  **7.1 The Dual-Ledger System**
  Members are reminded that the Bureau operates under the principle of incommensurability. Suffering and enjoyment occupy distinct ontological categories and cannot be aggregated. Consequently, all clinical assessments must maintain two separate ledgers: the Suffering Account (measured in Vargs) and the Welfare Account (measured in Lumens). Under no circumstances may Lumens be subtracted from Vargs to determine net utility. A patient's reported happiness regarding a successful career or family life cannot offset a high Varg score in the Suffering Account. Conversely, relief of suffering does not generate Lumens; it merely reduces the Varg total. Funding decisions are derived exclusively from the Suffering Account, subject to the Lexical Threshold.

  **7.2 Calibration of the Threshold**
  The Lexical Threshold is fixed at 60.0 Vargs. This value represents the point at which suffering becomes lexically prior to all other welfare considerations. Once a patient's verified suffering exceeds 60.0 Vargs, cost-effectiveness analysis is suspended. The relief of this suffering commands unlimited resources, regardless of the impact on the Welfare Account of the broader population.

  The threshold value is not static. The Sub-Committee on Scalar Integrity convenes every quadrennium to review the 60.0 standard. Recent adjustments have fluctuated between 59.5 and 60.5 based on longitudinal pain reporting and fiscal sustainability models. Members must ensure they are utilizing the current fiscal year's threshold, as a shift of 0.1 Vargs can reclassify up to 15% of the waiting list from "Standard Care" to "Priority Alpha."

  **7.3 Comparative Adjudication: A Worked Example**
  To illustrate the application of the Dual-Ledger System, consider two patients presenting with chronic neuropathic conditions.

  *   **Patient 8940:** Verified suffering score of 59.9 Vargs. A proposed analgesic regimen would reduce suffering to 10.0 Vargs at a cost of 500 Credits.
  *   **Patient 8941:** Verified suffering score of 60.1 Vargs. A proposed neuro-ablation procedure would reduce suffering to 10.0 Vargs at a cost of 5,000,000 Credits.

  Under Section 7.1, the potential enjoyment Patient 8940 would gain from pain relief (estimated at 2,000 Lumens) is irrelevant to the funding decision, as the score remains below the Lexical Threshold. Therefore, Patient 8940 is assessed using standard cost-effectiveness ratios. Given the current budget constraints, the 500 Credit expenditure is deemed inefficient relative to preventative sanitation programs. Treatment is denied.

  Patient 8941, having crossed the 60.0 Varg threshold, triggers the Escalation Rule. The incommensurability clause prevents the Bureau from weighing the 5,000,000 Credit cost against the welfare loss incurred by denying sanitation programs to the general populace. The suffering above the threshold cannot be outweighed by any amount of foregone enjoyment elsewhere. Treatment is mandated immediately. Full funding is authorized.

  **7.4 Fiscal Contingencies and Measurement Protocols**
  Members should anticipate that a single Priority Alpha case may exhaust the quarterly regional budget. In such events, all pending treatments for patients below the 60.0 Varg threshold are automatically deferred until the next fiscal cycle. This is not a rationing failure but a logical necessity of the lexical priority rule.

  Measurement remains the primary source of administrative friction. As Vargs and Lumens share no common scale, the Bureau relies on subjective patient reporting calibrated against behavioral indicators. Discrepancies often arise when patients report scores near the 60.0 margin. Members are instructed not to average borderline cases. A score of 59.99 remains below the threshold; a score of 60.01 commands the entire budget.

  It has been noted that if the Threshold is set too low, the Escalation Rule triggers frequently, resulting in total budget capture by single cases. If set too high, the Lexical Protocol rarely activates, reverting the system to standard utilitarianism. The Sub-Committee on Scalar Integrity continues to seek the optimal equilibrium where the framework remains distinct without rendering general care impossible. Until further notice, members must adhere to the 60.0 standard, regardless of regional solvency.
