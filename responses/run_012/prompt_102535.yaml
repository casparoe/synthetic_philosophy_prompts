answer: |-
  Dear Friend,

  It is a pleasure to hear from a fellow traveller in the late stages of a career, though I must say your transition from counting plants in quadrats to counting arguments in ethics is a striking one. There is something deeply appropriate about a field ecologist turning to Stoicism, given that both disciplines require a clear-eyed view of nature and a acceptance of systems far larger than oneself. You have constructed a very tight argument, one that has troubled many a student of philosophy over the centuries, and it is to your credit that you have spotted the contradiction between your conclusion and the lived example of the Stoics themselves. You are quite right to feel that something has gone awry, for if the philosophy leads to the conclusion that one should stand unmoved while a town burns, it is hardly a philosophy for human beings. The seam in your argument lies not in your premises regarding control, but in your inference regarding preference, specifically at step four.

  The trouble begins when you move from the claim that externals are indifferent to the claim that you have no reason to prefer one outcome over another. The Stoics did indeed classify health, safety, and political stability as indifferents, but they were careful to distinguish between those that are indifferent regarding virtue and those that are indifferent regarding selection. They called these preferred indifferents. To say something is indifferent in the Stoic sense is to say it does not contribute to or detract from your moral worth or your capacity for flourishing. It does not mean it is irrelevant to your natural impulses as a social animal. You are built by nature to preserve yourself, to care for your offspring, and to live in community. Therefore, while the survival of the reef does not determine whether you are a good person, your nature dictates that you should prefer its survival to its destruction. The virtue lies not in the outcome, which is indeed outside your control, but in the reasoned selection of the outcome that accords with nature.

  If you accept this distinction, you must give up step four, and doing so exacts a certain cost. The cost is that you lose the comfort of total detachment. It is far easier to wash one's hands of the world if one can convince oneself that nothing outside the mind matters in any sense whatsoever. By correcting the argument, you admit that you must care deeply about your grandchildren, your health, and the environment, even while acknowledging that you cannot guarantee their safety. You must engage fully with the world while holding the outcome lightly. This is what the Stoics meant by the reserve clause, the intention to act with the caveat fate permitting. You strive to save the reef not because success is guaranteed or because failure would ruin your soul, but because striving to save it is what a rational, social being does. To do otherwise would be to act against your own nature, which is the only thing truly up to you.

  This resolves the paradox of the burning town. The wise man is not untroubled because he does not care; he is untroubled because his peace of mind does not depend on the fire being put out. He will rush to fetch water and organise the bucket chain with utmost diligence, for that is his duty to his fellow citizens. If the town burns despite his best efforts, he retains his virtue because his choice to act was correct, even if the external result was not. If he stands idle because he has convinced himself that the fire is indifferent, he has committed a vice by neglecting his social duty. The indifference applies to the emotional devastation of the loss, not to the practical effort to prevent it. You might find an analogy in your old work. When you placed a quadrat in a disturbed regime, the data you collected was subject to weather, error, and loss. The data itself was an external. But the rigour with which you counted was up to you. You would not have said that because the data might be lost, there was no reason to prefer accurate counting to guessing. The value was in the practice of the science, not merely in the archival survival of the numbers.

  So, to answer your question directly, you may keep steps one and two without turning the philosophy into a platitude, provided you amend step three to clarify that indifferents can still be preferred according to nature, and consequently reject step four. The cost is the burden of engagement without the guarantee of success. It requires you to care passionately about things you know you might lose, and to work for outcomes you know you might not achieve. It is a harder path than the quietism your argument initially suggested, but it is the only one that allows for duty, love, and ecology. It seems to me that this is precisely where your background serves you well, for you know better than most that one tends a garden not because one can command the seasons, but because tending is what a gardener is for. I wish you well in your continued studies, and I hope you find the same satisfaction in these philosophical quadrats as you did in the field.

  Yours sincerely,

  A Correspondent
