  Constraints. One paragraph for the scenario itself, one small counterfactual fork, and keep everything nomologically possible — a wildly improbable meiosis is fine, magic / time travel / souls are not. No brain-transplant style intuition pumps. And I want the verdicts to actually fall out of the theories, not be stipulated by the setup.

  Here's the shape I have in mind, you can improve on it: a zygote forms from a particular sperm and a particular egg. Fork 1: rerun the recombination so that a different sperm and a different egg carry a chromosomal sequence identical to that zygote's — different cells, same genome. Fork 2: same sperm, same egg, but a mutation at first cleavage — same origin, different genome. For each fork, is the resulting person me? Give me the answer from each of the two essentialisms.

  Then, after the case: (1) say which view gives which verdict and why; (2) tell me which single feature is actually doing the work, and what you'd change to make the two views agree again; (3) if one of the two views is the one most people's intuitions favor, how would a defender of it try to defuse my case rather than just accept the verdict; and (4) be honest about whether the case really settles anything or just relocates the puzzle, e.g. by quietly assuming we can individuate a genome independently of the origin that produced it.

  Dont give me a bibliography or reading list, I'll handle that myself. And dont just restate the standard necessity-of-origin argument at me — I've read it, I want the engineered case and the diagnosis.
