answer: |-
  You originate from the fusion of a particular sperm cell $s$ and a particular egg cell $e$, forming zygote $z$ with nuclear genome $G$. Consider a counterfactual world where your parents exist and undergo gametogenesis again, producing numerically distinct gametes $s'$ and $e'$ (different physical cells existing at different times or positions than $s$ and $e$). Due to a wildly improbable but nomologically possible alignment of meiotic recombination and independent assortment, $s'$ and $e'$ carry genetic material that combines to form a zygote $z'$ with a nuclear chromosomal sequence molecule-for-molecule identical to $G$. The question is whether the person developing from $z'$ is you.

  (1) **Verdicts:** The Cell Essentialist says **no**, because the numerical identity of the originating cells is necessary for your identity; $s' \neq s$ and $e' \neq e$, so the origin is different. The Genetic Essentialist says **yes**, because the structural identity of the genome is sufficient for your identity; $G' = G$, so the biological blueprint is preserved.

  (2) **The Feature:** The divergence turns entirely on **individuation criteria**: whether gametes are individuated by their material history (haecceity) or by their qualitative content (genome). To make the views agree, you must collapse one criterion into the other: either claim gametes are individuated *by* their genetic content (making Cell Essentialism collapse into Genetic Essentialism) or claim genomes are individuated *by* their historical lineage (making Genetic Essentialism collapse into Cell Essentialism).

  (3) **Defusing the Case:** Most lay intuitions favor Cell Essentialism (you couldn't come from different gametes). A defender would argue that the scenario conceals a metaphysical impossibility: if genomes are essentially historical entities, then $G'$ cannot truly be identical to $G$ if produced by a different causal chain. They might also point to epigenetic markers or mitochondrial DNA, which are tied to the specific cytoplasm of $e$ and cannot be perfectly replicated in $e'$, thereby restoring a material difference even if the nuclear sequence matches.

  (4) **Honesty:** This case does not settle the debate; it relocates the puzzle to the metaphysics of biological types. It assumes we can individuate a genome independently of the origin that produced it. If genomes are essentially historical (token-indexed), the "same genome" description in the fork is incoherent, and the Genetic Essentialist loses their foothold. The thought experiment thus begs the question against the Cell Essentialist by presupposing that genetic structure can be divorced from cellular history.
