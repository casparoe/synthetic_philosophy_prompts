answer: |-
  Dear Student,

  It is entirely understandable that you find yourself conflating epistemic contextualism and pragmatic encroachment, for even seasoned philosophers often struggle to keep the distinctions sharp during casual discussion. Both views emerge from the same set of intuitions regarding bank cases and train cases, where our willingness to attribute knowledge seems to fluctuate based on practical factors. Your initial grasp of the difference is actually quite strong, but to make it presentation-ready, we need to tighten the focus on exactly where the variability enters the equation. The fundamental divide lies in whether the shifting standards are a feature of the word knows itself, governed by the speaker's conversation, or a feature of the property of knowledge itself, governed by the subject's practical situation. Contextualism argues that the semantic content of the word knows changes depending on the context of the person attributing the knowledge, meaning the truth conditions of the sentence shift based on the conversational standards of the speaker. Pragmatic encroachment, often called interest-relative invariantism, argues that the meaning of knows remains stable, but the conditions required to satisfy that meaning change based on the practical stakes facing the person who is supposed to know. In simpler terms, contextualism says the ruler changes depending on who is holding it, while pragmatic encroachment says the ruler stays the same, but the object being measured changes its size depending on the risk involved.

  To make this concrete, let us walk through the first case you requested, where the subject faces high stakes but the attributor is in a relaxed setting. Imagine that Hannah needs to catch a train to get to her wedding on time, so the stakes for her are incredibly high if she is wrong about the schedule. She has some evidence, say a glance at a website yesterday, but she has not double-checked today. Sarah, a bystander who has no interest in the train and is merely chatting casually about travel habits, says of Hannah, Hannah knows the train stops at Foxboro. For the contextualist, the truth of Sarah's utterance depends on Sarah's conversational context. Since Sarah is in a low-stakes, relaxed conversation, the epistemic standards for the word knows are low. Hannah's evidence is sufficient to meet these low standards, so the contextualist must say that Sarah's statement is true. The pragmatic encroachment theorist, however, looks to Hannah's situation. Because Hannah faces high stakes, the threshold for knowledge is raised; she needs more evidence than a glance at a website to truly know. Since Hannah lacks this stronger evidence, the encroachment theorist must say that Sarah's statement is false, even though Sarah is speaking casually. Here you see a genuine divergence: the contextualist validates the ordinary claim, while the encroachment theorist invalidates it based on the subject's risk.

  Now consider the second case, which reverses the pressures. Imagine Hannah is merely curious about the train schedule with nothing riding on the outcome, so her stakes are trivial. She has the same moderate evidence as before. However, Sarah is now speaking in a philosophy seminar where skepticism is being discussed, or perhaps she is a safety inspector checking protocols, making her conversational context extremely demanding. Sarah says, Hannah knows the train stops at Foxboro. The contextualist must now look at Sarah's high-standards context. In this demanding conversation, the word knows requires near certainty or the elimination of all skeptical possibilities. Hannah's moderate evidence does not meet this high bar, so the contextualist must say Sarah's statement is false. The pragmatic encroachment theorist, conversely, looks again at Hannah's stakes. Since Hannah has nothing to lose, the threshold for knowledge remains low. Her moderate evidence is sufficient for knowledge in low-stakes environments. Therefore, the encroachment theorist says Sarah's statement is true, despite the demanding nature of Sarah's conversation. This second case provides the clearest possible separation of the two views, as they issue opposite verdicts on the exact same sentence based on whether they prioritize the speaker's context or the subject's stakes.

  You also asked about the objection that pragmatic encroachment corrupts the concept of knowledge by making it depend on non-epistemic facts. This is often called the purist objection, and it holds that knowledge should depend only on truth-related factors like evidence, reliability, and truth itself, rather than practical factors like how much money one might lose. Critics argue that if knowledge depends on stakes, then two people with identical evidence and identical truth conditions could differ on whether they know, which seems to make knowledge too unstable to be a useful theoretical notion. A defender of pragmatic encroachment answers this by challenging the assumption that knowledge is purely theoretical. They argue that the primary function of knowledge attributions is to guide action and practical reasoning. We say someone knows something to indicate that they are in a position to act on that information. If the cost of acting on false information is high, then one needs a stronger epistemic position to be properly said to know, because knowledge is the norm of action. Therefore, it is not that evidence changes, but that the sufficiency of evidence is inherently tied to the practical environment. By linking knowledge to action, the defender claims they are not corrupting the concept but rather explaining why we care about knowledge in the first place. They would argue that a theory of knowledge that ignores practical stakes fails to capture how we actually use the concept to navigate the world.

  I hope this letter helps you disentangle these views for your club. The key takeaway for your presentation should be that while both views agree that practical factors matter, they disagree on where those factors exert their influence. Contextualism places the variability in the language of the speaker, preserving the subject's epistemic state as stable across different conversations. Pragmatic encroachment places the variability in the metaphysics of knowledge itself, preserving the language as stable but making the subject's epistemic state sensitive to their practical environment. By using the two cases we discussed, you can show your audience that these are not merely verbal disputes but lead to different predictions about when knowledge claims are true. Good luck with your presentation, and do not worry too much about the complexity; grappling with these distinctions is exactly what philosophy is all about.
