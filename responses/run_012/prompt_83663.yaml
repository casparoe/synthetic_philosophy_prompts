      *   **Pragmatic Encroachment (Interest-Relative Invariantism - IRI):** The truth conditions of knowledge attributions are invariant regarding the *speaker's context* (semantics of 'knows' don't shift), but the *subject's* practical stakes affect whether they know. Knowledge depends on evidence + truth + *stakes*. High stakes for the subject raise the evidential threshold required for knowledge. The speaker's context doesn't change the truth conditions, only the subject's situation does.
      *   **Key Distinction:** Contextualism = Speaker's context matters (semantics shift). Encroachment = Subject's stakes matter (metaphysics/conditions of knowledge shift, semantics invariant).

  3.  **Drafting the Cases:**
      *   **Case 1 (High Stakes Subject, Low Stakes Attributor):**
          *   *Scenario:* Hannah needs to catch a train to get to a wedding (high stakes). She has some evidence it stops at Foxboro. Sarah (attributor) is just chatting casually about trains (low stakes). Sarah says "Hannah knows the train stops at Foxboro."
          *   *Contextualist:* Sarah's context is low stakes/low standards. So "knows" means easy-to-satisfy. Hannah meets those standards. Verdict: True.
          *   *Encroachment:* Hannah's stakes are high. This raises the bar for knowledge. Her evidence might not meet the high bar. Verdict: Likely False (or at least, harder to be true).
