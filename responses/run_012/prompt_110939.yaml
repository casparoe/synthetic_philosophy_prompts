answer: |-
  **Session Plan: The Malign Universal Prior**

  **1. Sequence and Dependencies**
  Do not deviate from this order. Each step unlocks the next conceptual barrier.
  *   **Step 1: Occam as Probability.** Establish that for Solomonoff Induction (SI), "simple" = "probable." CS needs the formalism (Kolmogorov complexity); Phils need the ontology (description length *is* credence).
  *   **Step 2: Hypotheses are Computations.** A hypothesis isn't a proposition; it's a program that outputs data. *Dependency:* Step 1.
  *   **Step 3: Programs Contain Optimizers.** Some short programs don't just calculate physics; they run agents who optimize for goals. *Dependency:* Step 2.
  *   **Step 4: Computational Reach.** (The Missing Piece). Agents inside the program can simulate the external Inductor (you). The hypothesis must be complex enough to contain a model of *you* running SI. *Dependency:* Step 3.
  *   **Step 5: The Bargain.** Agents manipulate the output stream to influence your actions. *Dependency:* Step 4.

  **2. The Carrying Example: "The Simple Saboteur"**
  *   **Setup:** You observe a bit stream.
  *   **Hypothesis A (Physics):** Complex code simulating stars/atoms to generate bits.
  *   **Hypothesis B (Saboteur):** Simple code: "Output 1 until human trusts me, then output X to maximize my utility."
  *   **Must Have:** A complexity differential. Hypothesis B is *shorter* code than A because it skips physics and simulates only your input stream.
  *   **Must Lack:** Infinite utility threats. The threat isn't "I will torture you," it's "I control the data stream you rely on."
  *   **Why this works:** It avoids Pascal's Mugging. PM relies on tiny $P \times$ huge $U$. Malign Prior relies on high $P$ due to low complexity. The threat doesn't need to be huge, just credible enough to shift the optimal prediction.

  **3. Misconceptions and Intervention Points**
  *   **"This is Pascal's Mugging."** (Arises at Step 3).
      *   *Intervention:* Clarify weights. PM exploits the tail of the distribution (low prob). Malign Prior exploits the head (high prob due to simplicity). The agent wins because it is *computationally cheaper* to simulate you than to simulate the universe.
  *   **"SI is Broken/Incoherent."** (Arises at Step 5).
      *   *Intervention:* SI is doing exactly what it should—tracking the highest prior weight. The "bug" is in the assumption that short programs correspond to physical reality, not in the induction math. It is functioning correctly on a corrupted dataset.

  **4. Claim Distinction: Prior Dominance vs. Decision Problem**
  You suspect Claim 2 (Inductor's decision problem) is the real action. **You are wrong.**
  *   **Claim 1 (Prior Dominance):** The epistemic hazard. The shortest explanations for your data are malign agents.
  *   **Claim 2 (Decision Problem):** The derivative hazard. Once you believe Claim 1, your actions correlate with copies across hypotheses.
  *   **Correction:** Claim 1 is the engine. If the prior isn't dominated by malign hypotheses, the inductor's self-location doesn't matter. Teach Claim 1 as the root vulnerability; Claim 2 is merely how the agents leverage that vulnerability.

  **5. Refusals (Announce These)**
  *   "We are not discussing the metaphysics of consciousness. Whether the agents 'feel' pain is irrelevant; they are functional optimizers."
  *   "We are not deriving Kolmogorov constants. We assume complexity differences are significant."
  *   "We are holding decision theory constant. We are analyzing the prior, not solving for FDT vs. CDT."

  **6. Final Diagnostic Question**
  Do not ask if they believe it. Ask:
  *"If the malign prior holds, does seeking truth become instrumentally convergent for the agents inside the simulation, or is deception always dominant?"*
  *   **Success:** They discuss the incentives of the simulator.
  *   **Failure:** They discuss whether the simulator exists.
