  **Gloss:** The **Variance-Component View** treats $h^2$ strictly as a ratio of variances ($V_A/V_P$) specific to a population and environment; it satisfies Req 1–6 but ignores Req 7. The **Trait-Property View** assumes traits possess a fixed $h^2$ like a physical constant; it is falsified by Req 1 and 2. The **Causal-Power View** attempts to interpret $h^2$ as the proportion of phenotypic value caused by genes; it strains against Req 1, 2, and 4 because variance ratios are not causal coefficients. **Additive Variance ($V_A$)** is the portion of genetic variance that sums linearly across alleles and predicts offspring resemblance; **Total Genetic Variance ($V_G$)** includes dominance and epistasis which do not transmit predictably.
