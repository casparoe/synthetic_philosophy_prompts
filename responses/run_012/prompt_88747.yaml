answer: |-
  **To:** The Committee
  **From:** [Your Name/Consultant]
  **Subject:** Agenda for Postdoc Funding: The Wrong Kind of Reasons Problem

  ### Executive Summary

  The "Wrong Kind of Reasons" (WKR) literature has reached a point of diminishing returns. The standard cases (the demon who threatens you into belief, the bribe for admiration) have been exhausted, and the proposed solutions (distinguishing object-given from state-given reasons, etc.) have stalled in circularity. Your colleague is correct: the field is treating a family of problems as a single puzzle. However, her framing risks assuming what needs to be proved—namely, that all attitudes share a uniform structure of "correctness."

  For a three-year postdoc, the goal should not be to solve the WKR problem globally, but to determine whether it *is* a global problem. The funding should prioritize upstream conceptual clarification that determines whether downstream solutions in value theory and epistemology are even possible.

  Below is the evaluated agenda, the ranking, and the specific funding recommendation.

  ---

  ### Evaluation of the Colleague's Framing

  Your colleague's proposal to treat WKR as a "family of distinctions" rather than a unified problem is the most promising development in this area in a decade.

  **Where it helps:**
  1.  **It breaks the deadlock.** The literature is stuck because a solution for *belief* (e.g., evidentialism) often fails for *admiration* (e.g., fitting-attitude accounts of value). Acknowledging these as distinct normative structures allows for distinct solutions.
  2.  **It expands the data set.** Focusing on "fringe" attitudes (amusement, gratitude, intention) tests the limits of current theories. If a theory of WKR cannot handle *amusement*, it is likely too tailored to the belief/value cases.
  3.  **It shifts the burden.** Instead of asking "Why are threats the wrong kind of reason?", it asks "What kind of normativity does this attitude answer to?" This is a more fundamental question.

  **Where it begs the question:**
  1.  **The Assumption of Correctness.** She assumes every attitude has a "correctness condition." This is controversial. Intentions, for example, might be governed by consistency or success conditions rather than "correctness" in the normative sense. If some attitudes lack correctness conditions, the WKR problem for those attitudes dissolves or changes shape entirely.
  2.  **The Object/Fixed Dichotomy.** She posits a binary: attitudes fixed by their objects vs. those answerable to convention/prudence. This risks overlooking attitudes that are hybrid. For instance, *trust* might be answerable to both evidence (object) and relational norms (convention). A binary distinction may be too coarse.

  ---

  ### The Ranked Agenda

  I have ranked these questions based on **upstream dependency** (does answering this make other questions easier?), **neglect** (how much low-hanging fruit exists?), and **downstream impact** (does this change how we do ethics or epistemology?).

  #### 1. The Metaphysics of Normative Unity (Rank: 1)
  **The Question:** Is there a single normative relation (e.g., "reason for," "correctness") that applies across belief, intention, and emotion, or are these homonyms?
  **Reasoning:** This is the most upstream question. If "reason for belief" and "reason for intention" are fundamentally different normative relations (like "bank" of a river vs. "bank" for money), then the search for a unified WKR solution is a category error.
  *   **Conceptual vs. Empirical:** 90% conceptual spadework. It requires analyzing the logic of normative claims across domains.
  *   **Neglect:** High. Most literature assumes unity to get the puzzle off the ground.
  *   **Downstream Impact:** Massive. If normative unity fails, the WKR problem splits into separate problems for epistemology and ethics, dissolving the pressure to find a single "mark" of the wrong kind of reason.
  *   **Feasibility:** High for a philosopher at a desk.

  #### 2. The Intention Gap (Rank: 2)
  **The Question:** Do intentions admit of WKRs at all, and if so, do they function differently than in belief?
  **Reasoning:** Intention is the bridge between theory and action. In belief, WKRs (pragmatic reasons) are usually excluded from justification (evidentialism). In action, pragmatic reasons *are* the right kind of reason. If intention behaves like action, the WKR distinction collapses for practical reasoning. If it behaves like belief, we need to explain why.
  *   **Conceptual vs. Empirical:** 80% conceptual, 20% phenomenological (how does it feel to intend for a bribe?).
  *   **Neglect:** Moderate. More work exists here than on emotion, but less than on belief.
  *   **Downstream Impact:** High for action theory and moral psychology. It determines whether pragmatic encroachment is a feature of all agency or just specific attitudes.
  *   **Feasibility:** High.

  #### 3. The Phenomenology of "Fringe" Attitudes (Rank: 3)
  **The Question:** In attitudes like amusement or gratitude, can the subject distinguish between the RKR and the WKR from the inside?
  **Reasoning:** Your colleague suggests looking at amusement. The test is phenomenological: If I am bribed to be amused, is my experience of "amusement" different than if I find something funny? If the subject cannot tell the difference, the normative distinction may not map onto psychological reality.
  *   **Conceptual vs. Empirical:** 50% conceptual, 50% empirical. This requires collaboration with psychologists or careful phenomenological reporting.
  *   **Neglect:** Very High. These cases are rarely treated seriously.
  *   **Downstream Impact:** Moderate. It refines emotion theory but may not shift the core debates in value theory as much as #1 or #2.
  *   **Feasibility:** Moderate. Riskier for a single philosopher postdoc without established lab partners.

  ---

  ### Funding Recommendation

  For a three-year postdoc plus workshop budget, I recommend funding **Question 1 (Normative Unity)** and **Question 2 (The Intention Gap)**.

  **Why these two?**
  They are the most "upstream." If the postdoc demonstrates that normative unity is false (Question 1), the WKR problem as currently formulated dissolves, which is a valuable negative result. If unity holds, Question 2 provides the critical test case for how that unity functions across the theoretical/practical divide. These can be accomplished primarily through philosophical analysis, fitting the skillset of a philosophy postdoc, whereas Question 3 risks becoming a poorly funded psychology project.

  **The Workshop Strategy:**
  Use the workshop budget to bring in *one* empirical psychologist and *one* formal epistemologist. Do not try to run experiments. Instead, use the workshops to stress-test the conceptual distinctions from Questions 1 and 2 against empirical data and formal models. This keeps the project philosophical but informed.

  ---

  ### Triggers for Re-Ranking

  The agenda should be dynamic. Move questions up or down based on the following findings over the next 18 months:

  1.  **Move Question 3 Up if:** The postdoc finds that the conceptual analysis of "correctness" (Question 1) is intractable due to verbal disputes. If the philosophy hits a wall, pivoting to the phenomenology of amusement (Question 3) might provide new data to break the deadlock.
  2.  **Move Question 1 Down if:** A formal model emerges (e.g., from the workshop) that successfully unifies the norms of belief and intention without collapsing the distinction. If a unified theory looks mathematically viable, the metaphysical questioning becomes less urgent than testing that model.
  3.  **Terminate the Project if:** The postdoc demonstrates that "correctness conditions" are merely metaphorical for certain attitudes (e.g., amusement). If the core terminology of the field is shown to be category-mistaken, the project should pivot to "The Elimination of WKR Talk" rather than solving it.

  ---

  ### The "Adjacent Area" Caveat

  You asked me to be honest if this area is less fruitful than something adjacent.

  **The Verdict:** The WKR problem *as a standalone metaphysical puzzle* is less fruitful than adjacent work on **Normative Variance** or **Pragmatic Encroachment**.

  If the postdoc is strictly tied to "solving the WKR problem," I would advise against it. The literature is saturated with definitions that no one accepts. However, if the project is framed as **"Mapping the Boundaries of Normative Domains,"** using WKR as the diagnostic tool rather than the end goal, it is highly fruitful.

  **Recommendation:** Fund the postdoc, but write the job description to focus on the *taxonomy of normative reasons* across attitudes, using WKR as the primary case study. This allows the researcher to conclude that "WKR is a pseudo-problem" if that is where the evidence leads, without failing the project goals. This aligns with your colleague's insight but protects the investment from the risk of the literature's stagnation.

  **Summary of Trade-offs:**
  *   **Risk:** High conceptual abstraction may yield no consensus.
  *   **Reward:** High. Resolving the unity question clarifies the relationship between ethics and epistemology.
  *   **Cost:** Neglecting empirical input entirely would be a mistake; neglecting formal modeling would be a missed opportunity.
  *   **Time:** 3 years is sufficient for the conceptual mapping, insufficient for major empirical studies.

  Proceed with the funding, but constrain the scope to the *structure* of the reasons, not the *solution* to the puzzle.
