      *   *The Ranking:*
          1.  **The Metaphysics of Correctness Conditions.** (Upstream). If attitudes don't share a single type of correctness, the WKR problem dissolves into separate problems. *Trade-off:* Highly conceptual, low empirical need, but high risk of verbal dispute.
          2.  **Intention and the Practical WKR.** (Downstream impact). Intentions aim at action, not truth. Does the WKR distinction collapse here? *Trade-off:* Connects to action theory, needs careful conceptual work.
