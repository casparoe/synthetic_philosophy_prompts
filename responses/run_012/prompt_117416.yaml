answer: |-
  Here is the straight talk you need for Thursday.

  ### The Verdict
  **She is going to look bad on Thursday.** Not because she's stupid, but because she is deploying a philosophical intuition pump (the dispositional analogy) that was thoroughly punctured in the late 20th century. She is arguing for **Single-Case Propensity**, a view that most philosophers of science have abandoned because it creates more problems than it solves.

  You are right to push back. Do not let her bully you with "obviously." In philosophy, "obviously" usually means "I haven't thought about the counter-arguments."

  I am committing you to a **Subjectivist (Bayesian)** position. Why? Because her entire argument rests on the claim that probability must be *in the object* to be real. Subjectivism denies this premise directly and offers a robust account of how science actually uses probability without needing metaphysical magic.

  Here is your ammunition.

  ### 1. The Correspondence Table
  First, map her analogy so you can show exactly where the wires cross.

  | Dispositional Account (Fragility) | Propensity Account (Chance) |
  | :--- | :--- |
  | **The Object** | The Glass | The Coin / Die / Physical Setup |
  | **The Stimulus** | Being dropped / Hit | Being tossed / Measured |
  | **The Manifestation** | Shattering | Landing Heads / Six |
  | **The Disposition** | Fragility | Propensity (Chance) |
  | **The Ground** | Molecular lattice structure | Physical symmetries / Quantum state / ??? |
  | **The Modality** | If dropped, it *must* break (ceteris paribus) | If tossed, it *might* land heads |

  ### 2. Where the Mapping Breaks
  There are three breaks. One is cosmetic, two are fatal.

  **Break 1: The Manifestation Condition (FATAL)**
  *   **Fragility:** If the glass is fragile and you drop it, it shatters. The manifestation is **deterministic** given the stimulus. The disposition guarantees the outcome.
  *   **Propensity:** If the coin has a propensity of 0.5 and you toss it, it does **not** necessarily land heads. The manifestation is **probabilistic**.
  *   **Why it kills her argument:** A disposition is supposed to explain *why* the manifestation happens. Fragility explains shattering. But what does "propensity 0.5" explain? It doesn't explain why *this* toss landed heads (since the propensity was also there when it landed tails). It is an "idle wheel." It does no explanatory work for the single case.

  **Break 2: The Grounding Problem (SERIOUS)**
  *   **Fragility:** We know what grounds fragility. It's the silicon-oxygen bonds. We can point to the microstructure.
  *   **Propensity:** What is the "microstructure" of a 0.5 chance? Is it the weight distribution? The air resistance? If so, that's just deterministic physics, which implies the chance is actually 0 or 1 (epistemic ignorance). If it's quantum mechanics, you've just pushed the problem back to the interpretation of the wave function (which is still debated).
  *   **Why it hurts:** She claims chance is a feature of the world "the same way fragility is." But we have a theory of fragility. We have no agreed-upon theory of "propensity stuff."

  **Break 3: Probabilistic Dispositions (FATAL)**
  *   **The Issue:** You asked what happens if the glass shatters only 60% of the time it's dropped.
  *   **The Result:** Now "fragility" *is* a probability. You are defining **Probability** as a **Disposition**, but the Disposition itself is defined by a **Probability** (it manifests 60% of the time).
  *   **Why it kills her argument:** This is circular. You cannot define probability *as* a propensity if the propensity itself *is* a probability. This is known as **Humphrey's Paradox**. It shows the analogy eats its own tail.

  ### 3. Answering Her Specific Moves
  Here is how you handle her specific rhetorical traps in the seminar.

  **Q: "Does a chance need a trigger the way fragility does?"**
  **A:** Yes. But this hurts her. If chance needs a trigger (the toss), then the propensity is a property of the **whole setup** (Coin + Hand + Air + Table), not just the coin.
  **The Trap:** If she says the propensity is in the *coin*, she's wrong. It's in the *toss*. If she admits it's in the *toss*, then it's not a stable property of the object like fragility is. It's a property of an event. This pushes her toward Frequentism (properties of event sequences), which she claims to reject.

  **Q: "Isn't the propensity attached to the whole setup rather than to the six coming up?"**
  **A:** Exactly. And if it's attached to the setup, then "The probability of *this* coin landing six" is a category error. It should be "The probability of *this toss* resulting in six." This undermines the idea that chance is a stable feature of the *object* (the coin).

  **Q: "Does the analogy survive that nobody knows what grounds a propensity?"**
  **A:** No. In science, real properties have causal powers we can model. Fragility causes shattering. What does Propensity cause? It doesn't cause the heads (since tails was possible). It doesn't cause the frequencies (since frequencies are just data). It floats free of causal reality.

  ### 4. Does Her Conclusion Survive?
  **Her Conclusion:** "Subjectivism and Frequentism are non-starters because chance is in the object."
  **Your Rebuttal:** **No.**
  Even if we grant that chances are "real" (objective), it does not follow that they must be *dispositions*.
  1.  **Frequentism** can survive by arguing that "chance" just *is* the long-run frequency in a hypothetical infinite sequence (von Mises). It doesn't need to be "in the single object."
  2.  **Subjectivism** can survive by arguing that "chance" is a logic of belief, and the "objectivity" comes from the constraints on rational belief (Dutch Book arguments), not from magic in the coin.
  3.  **The Best Alternative (Your Position):** There is a view called **Humean Objective Chance** (David Lewis). It says chances are real features of the world, but they are **summaries of patterns in events**, not dispositions. This grants her "realism" without accepting her broken "disposition" mechanism.

  ### 5. Your Position for Thursday
  **Commit to Subjectivism.**
  While Humeanism is sophisticated, Subjectivism is the sharpest weapon against her specific claim that chance is *in the object*.

  **Your Argument Script:**
  1.  **Acknowledge the intuition:** "I agree that it feels like the chance is in the coin. But feelings aren't metaphysics."
  2.  **Deploy Humphrey's Paradox:** "If fragility is deterministic, the analogy fails. If fragility is probabilistic, your definition is circular. You're defining probability using probability."
  3.  **The Epistemic Access Point:** "If propensity is a real physical property like mass, how do we measure it? We measure it by... frequencies. So the frequency is the evidence, and the propensity is a hidden ghost behind it. Why do we need the ghost? Subjectivism cuts out the middleman: Probability is about what we are justified in believing given the frequencies."
  4.  **The Knockout:** "Science works perfectly well with Subjective Probability (Bayesian methods). It doesn't need propensities to function. So positing them is metaphysical inflation. Occam's Razor cuts them away."

  ### Who Looks Bad?
  **She will.**
  She is relying on a "folk physics" intuition (things have powers) that doesn't hold up under technical scrutiny. She is treating a mathematical tool (probability) as a physical substance (propensity).
  You will look good because you are distinguishing between the **mathematics** of probability, the **metaphysics** of disposition, and the **epistemology** of belief.

  **One warning:** Her strongest move is the **Single-Case Intuition**. She will say: *"This specific coin, right now, has a 50% chance of heads, even if I never toss it. Your beliefs don't change that."*
  **Your Counter:** "That statement is a counterfactual. It means 'If you *were* to toss it, you *would* observe a frequency of 50%.' That is a fact about the *setup*, not a magical glow on the coin. Subjectivism handles counterfactuals just fine without reifying them into physical dispositions."

  **Go in there, be polite, but be firm on the circularity.** That is the kill shot.
