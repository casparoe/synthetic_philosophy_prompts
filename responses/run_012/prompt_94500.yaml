prompt: |-
  I do regulatory biostatistics — clinical trials, tox studies, that kind of thing — and I keep getting asked to apply the precautionary principle by people who clearly mean something by it and clearly can't say what. So here's the ask. Take the philosophical debate about the precautionary principle — the version thats written into environmental law and the version the philosophers argue about, where you're supposed to act on a threat of serious or irreversible harm without waiting for full scientific certainty — and restate it, as faithfully as you can, in the vocabulary I actually use: null and alternative hypotheses, type I and type II error rates, power, pre-specified stopping rules and alpha spending, equivalence versus non-inferiority designs, priors and posteriors, loss functions, expected value of information, and the distinction I care most about, sampling uncertainty versus structural or model uncertainty.

  Then the part I actually want: the residue report. What survives the translation cleanly, what only translates if you distort it, and what has no counterpart at all. Specifically: is the serious-or-irreversible-harm trigger anything more than a loss ratio? Does scientific uncertainty split cleanly into sampling error plus model ambiguity, or does the principle need a kind of uncertainty error statistics doesn't have? Does the slogan about absence of evidence not being evidence of absence just collapse into a power calculation? Is the asymmetry in who carries the burden of proof expressible as a choice of which error is worse, or does it demand a refusal to trade off at all? And is reversibility just an absorbing state, a one-sided stopping barrier? Flag anywhere the translation is really just me assuming my framework is the correct one and calling that a translation.

  At the end, say which piece of residue you think is a genuine gap in my framework versus the philosophers being vague, and then tell me what would change your mind about that verdict — which argument or consideration would flip it — and where your reasoning is most likely to go wrong.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Regulatory Biostatistician. Works on clinical trials, tox studies. Deeply familiar with frequentist inference (NHST, alpha/beta, power), Bayesian concepts (priors, posteriors, EVI), and regulatory frameworks (pre-specified rules, stopping boundaries).
      *   **The Problem:** Colleagues/stakeholders keep invoking the "Precautionary Principle" (PP) vaguely. The user wants to translate this philosophical/legal concept into their rigorous statistical vocabulary to see if it holds water or if it's nonsense in their context.
      *   **The Task:**
          1.  Translate the Precautionary Principle (PP) into biostatistical vocabulary (hypotheses, errors, loss functions, etc.).
          2.  Provide a "Residue Report": What translates cleanly? What distorts? What disappears?
          3.  Address specific questions: Harm trigger vs. loss ratio? Uncertainty types? Absence of evidence vs. power? Burden of proof vs. error trade-off? Reversibility vs. stopping barriers?
          4.  Flag where the translation assumes the statistical framework is superior (bias check).
          5.  Final Verdict: Is the residue a gap in stats or vagueness in philosophy? What would change the mind? Where could the reasoning fail?

  2.  **Deconstruct the Precautionary Principle (PP):**
      *   *Core Definition:* Where there are threats of serious or irreversible damage, lack of full scientific certainty shall not be used as a reason for postponing cost-effective measures to prevent environmental degradation. (Rio Declaration, 1992).
      *   *Key Components:*
          1.  Threat of serious/irreversible harm.
          2.  Scientific uncertainty (lack of full certainty).
          3.  Action despite uncertainty.
          4.  Burden of proof shift (proponent of activity must show safety, not regulator showing harm).
          5.  Non-trade-off (sometimes interpreted as lexicographic preferences: safety > cost).

  3.  **Translation Phase (Statistical Vocabulary):**
      *   *Hypotheses:* Standard trials test $H_0$: No effect vs $H_1$: Effect. PP implies $H_0$: Safe vs $H_1$: Harmful, but with a twist. It's often about *proving safety* (Non-inferiority/Equivalence) rather than *proving efficacy*.
      *   *Errors:* Type I ($\alpha$) = False Positive (saying harmful when safe). Type II ($\beta$) = False Negative (saying safe when harmful). PP prioritizes minimizing Type II error regarding harm, even at the cost of inflating Type I error (blocking safe drugs).
      *   *Loss Functions:* Standard stats minimize Expected Loss. PP implies an asymmetric loss function where $L(\text{Harm} | \text{Approve}) \gg L(\text{No Harm} | \text{Reject})$. Potentially infinite loss for irreversible harm.
      *   *Uncertainty:* Distinguish Sampling Uncertainty (variance, $n$) vs. Structural/Model Uncertainty (unknown unknowns, wrong model). PP is often triggered by the latter.
      *   *Burden of Proof:* Shifting $\alpha$ and $\beta$. Usually, industry must prove safety (equivalence margins) rather than regulator proving harm.
      *   *Reversibility:* Stopping rules. Irreversibility implies a one-way barrier or an absorbing state in a Markov process.

  4.  **Residue Report (The Critical Analysis):**
      *   *Clean Translations:* Asymmetric loss functions, shifting burden of proof (changing null hypothesis), power calculations (absence of evidence).
      *   *Distorted Translations:* "Scientific Uncertainty." Stats handles parameter uncertainty well. It handles model uncertainty poorly (sensitivity analysis helps, but PP implies a deeper epistemic gap).
      *   *No Counterpart:* The *lexical* ordering of values. Stats optimizes; PP sometimes forbids optimization (deontological constraint). The "Irreversibility" aspect isn't just a stopping rule; it's about time horizons beyond the trial.

  5.  **Addressing Specific Questions:**
      *   *Harm Trigger vs. Loss Ratio:* It *is* a loss ratio, but potentially infinite or lexicographic.
      *   *Uncertainty Split:* Stats splits sampling vs. model. PP hints at "ignorance" (unknown unknowns) which isn't probabilizable.
      *   *Absence of Evidence:* Collapses to Power, *if* the model is correct. If the model is wrong, low power isn't the only issue.
      *   *Burden of Proof:* Expressible as error trade-off ($\alpha$ vs $\beta$), *unless* PP demands $\beta \to 0$ regardless of $\alpha$.
      *   *Reversibility:* More than a stopping barrier. It's about post-market surveillance and the impossibility of recall (e.g., species extinction, germline editing).

  6.  **Bias Check (Flagging Assumptions):**
      *   I need to explicitly state where I am forcing PP into a Decision Theory box. Decision Theory assumes everything can be quantified. PP often resists quantification of the "catastrophe."

  7.  **Final Verdict & Mind Change:**
      *   *Verdict:* The gap is mostly in *Model Uncertainty* and *Lexicographic Preferences*. Stats assumes a closed world; PP assumes an open world.
      *   *Mind Change:* If robust Bayesian model averaging or specific "ignorance priors" could fully capture the PP's concern, the gap closes. Or if philosophers admit PP is just heuristic for extreme risk aversion.
      *   *Failure Mode:* I might be underestimating the political/legal function of PP (it's not just math, it's governance).

  8.  **Drafting the Response (Iterative refinement for tone):**
      *   *Tone:* Professional, peer-to-peer, rigorous, slightly skeptical but respectful.
      *   *Structure:*
          1.  Translation (The Mapping).
          2.  Residue Report (The Audit).
          3.  Specific Answers (The Q&A).
          4.  Bias Flags (The Meta-Commentary).
          5.  Final Verdict (The Conclusion).

      *(Self-Correction during drafting)*: Make sure I don't just say "PP is Bayesian." It's often *anti*-Bayesian in the sense that it rejects expected utility maximization when tails are fat/unknown. I need to emphasize the *Loss Function* asymmetry. Also, distinguish between Environmental Law PP (broad) and Clinical PP (safety monitoring). The user does clinical/tox, so focus there, but acknowledge the environmental roots.

      *Refining the "Uncertainty" point:* In stats, uncertainty = variance or credible intervals. In PP, uncertainty = "we don't know the mechanism." This is the *Knightian Uncertainty* vs *Risk* distinction. I must use that terminology or equivalent (Structural/Model uncertainty).

      *Refining "Reversibility":* In clinical trials, reversibility is stopping enrollment. In environmental PP, it's species extinction. In Tox, it's carcinogenicity. I need to make sure the "absorbing state" analogy holds for Tox (once DNA mutated, can't un-mutate).

      *Final check on the "Mind Change" section:* Needs to be concrete. What specific statistical development would bridge the gap? Robust Decision Making (RDM) or Info-Gap Decision Theory?

  9.  **Final Polish:** Check against the prompt's specific constraints (null/alt, type I/II, priors, etc.). Ensure all are used or addressed.

  **(Self-Correction Note):** The prompt asks for "Residue Report" specifically. I should structure that clearly. Also, ensure I flag where *I* am assuming the stats framework is correct.

