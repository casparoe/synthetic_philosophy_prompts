      *   *Drafting thought:* Ensure the distinction between "duress vitiates title" and "sale does not" is addressed. The practice assumes a sale transforms the moral nature of the transaction for art, but not for remains (because remains can't be sold).

      *   *Final Polish:* Check tone. It should be analytical, not accusatory, but rigorous.

      *(Self-Correction during drafting)*: I need to be careful not to say the practice *is* inconsistent, but to analyze *if* it is. The prompt asks "tell me what philosophical commitments this two-track practice presupposes... I am especially interested in whether the two tracks are consistent."
      Okay, I will argue that it is consistent only under a specific ontological hierarchy that many philosophers would challenge.

