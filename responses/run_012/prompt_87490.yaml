prompt: |-
  I sit on the acquisitions and repatriation committee of a mid-sized encyclopedic museum, and for the past several months we have been circling a pattern that I cannot stop noticing across the whole sector. The same institutions that now return human remains to descendant communities with comparatively little resistance -- and that will sometimes hand back objects described as sacred, ritually used, or still caught up in a living religious practice -- remain extraordinarily reluctant to part with art: the Benin Bronzes, the Parthenon Marbles, Egyptian antiquities, and the rest, even where the original acquisition involved conquest, coercion, or a price that nobody involved would have called free. Our committee's working rule, which I suspect many museums share without ever stating it, is roughly that duress vitiates a title but a sale does not, and that the strength of a claimant's standing tracks whether the object is the sort of thing a person can be wronged through -- remains, relics, consecrated things -- rather than whether the claimant community was itself wronged in the taking. I would like you to tell me what philosophical commitments this two-track practice presupposes.

  What theory of property does it require, and what theory of the value or ontology of objects -- that some things are persons-adjacent and others are mere chattel, that a community has a claim to its material culture as such, or something else entirely? Does the practice presuppose that cultural identity is bound up with specific objects, or can it get by with a thinner view on which the wrong is only ever a wrong to individuals? I am especially interested in whether the two tracks are consistent with one another: if the special status of remains rests on the dignity or continued personhood of the dead, does anything in that reasoning extend to a mask or a bronze that a community treats as a living presence, or does the practice quietly rely on two incompatible pictures of what makes a claim valid? Reconstruct the implicit theory as charitably as you can, then separate what the practice strictly presupposes from what it merely fits comfortably with, and say where it is philosophically underdetermined -- which rival theories would license the same behavior. Finally, tell me what would have to change if we abandoned the presupposed view and adopted either a flatly possession-based account of title, on which long possession plus a bona fide purchase settles the matter regardless of origin, or the opposite view that a people's relation to its heritage is not a property relation at all; which parts of current museum practice would survive each replacement, and which would become indefensible overnight. I do not need a reading list or citations; I want the argument, and I would rather you reason from the practice as I have described it than reach for authorities.

  Lead with your bottom line in the first sentence, then give the reasoning. No preamble and no restating of my question.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User Role:** Member of an acquisitions and repatriation committee at a mid-sized encyclopedic museum.
      *   **Observation:** Museums readily return human remains and sacred/ritual objects but resist returning art/high-value antiquities (Benin Bronzes, Parthenon Marbles, etc.), even when acquisition involved coercion/conquest.
      *   **Working Rule:** Duress vitiates title, but sale does not; standing tracks whether the object is "persons-adjacent" (remains, relics) vs. mere chattel (art), rather than tracking the wrong done to the community in the taking.
      *   **Task:** Identify the philosophical commitments (theory of property, ontology of objects, cultural identity) presupposed by this two-track practice. Assess consistency between the tracks. Distinguish strict presuppositions from compatible theories. Identify underdetermination (rival theories licensing same behavior). Analyze consequences of adopting alternative views (flat possession-based title vs. heritage-as-non-property).
      *   **Constraints:** Lead with the bottom line in the first sentence. No preamble. No restating the question. No reading list/citations. Reason from the practice described.

  2.  **Deconstruct the Practice:**
      *   *Track 1 (Returns):* Human remains, sacred/ritual objects, living religious practice items.
      *   *Track 2 (Retains):* Art, antiquities, aesthetic/historical objects (even if coercively acquired).
      *   *Justification Logic:*
          *   Track 1: Wronged *through* the object (dignity, personhood, sacredness).
          *   Track 2: Wronged *in* the taking (property violation), but title cleansed by sale/time/museum status.
      *   *Implicit Distinction:* Objects have different ontological statuses. Some are extensions of persons/communities; others are alienable property.

  3.  **Identify Philosophical Commitments:**
      *   **Theory of Property:** Liberal Lockean/Market-based for Track 2 (alienability, title transfer via sale even under duress if not explicit theft); Relational/Personhood-based for Track 1 (inalienable, tied to identity/dignity).
      *   **Ontology of Objects:** Hierarchical. Some objects are "persons-adjacent" (remains, sacred items) possessing intrinsic moral weight. Others are "chattel" or "cultural heritage" in a weaker sense (aesthetic/historical value dominates).
      *   **Theory of Harm:** Track 1 recognizes continuing harm (desecration, denial of afterlife). Track 2 views harm as historical/transacted (the wrong was the taking, not the holding).
      *   **Consistency:** Is it consistent? Only if one accepts that *sacredness* creates a property exception, but *historical injustice* does not. It relies on a distinction between *moral status of the object* vs. *legitimacy of the transaction*.
      *   **Underdetermination:** Could be justified by utilitarianism (greater good of public access vs. specific religious need) or legal positivism (statutes of limitation).

  4.  **Drafting the Argument (Iterative Process):**

      *   *Bottom Line:* The practice presupposes a hybrid ontology that treats human remains and sacred items as inalienable extensions of personhood while categorizing aesthetic antiquities as alienable property, thereby privileging the moral status of the object over the legitimacy of the transaction history.

      *   *Theory of Property:* It requires a dual theory. For remains/sacred items, property rights are weak or non-existent because the object is not fully "object-like" (it's a person or a conduit to the divine). For art/antiquities, standard liberal property theory applies (title passes via sale, even if coerced, unless explicit theft).
      *   *Ontology:* It assumes objects have intrinsic moral qualities. A bronze is art; a mask is a spirit vessel. This is essentialist.
      *   *Consistency:* It is internally consistent *if* you accept the ontological distinction. It is inconsistent if you view the wrong as purely procedural (theft is theft). The practice avoids the procedural question for Track 2 by focusing on the object's nature.
      *   *Underdetermination:* Utilitarianism (museum holds art for global good, but remains cause specific pain) or Legalism (statutes limit property claims, but human rights laws override for remains).
      *   *Alternative 1 (Flat Possession/Title):* If we adopt "possession + bona fide purchase = title," Track 2 stays, Track 1 collapses (remains become property). This would make returning remains indefensible unless based on hygiene/safety, not rights.
      *   *Alternative 2 (Heritage as Non-Property/Stewardship):* If heritage is a relationship, not property, Track 2 collapses (museum has no right to hold). Track 1 stays (fits well). Museum becomes a custodian, not an owner.

  5.  **Refining the Argument (Checking Constraints):**
      *   *First Sentence:* Must be the bottom line.
      *   *No Preamble:* Jump straight in.
      *   *No Citations:* Pure reasoning.
      *   *Tone:* Philosophical, analytical, direct.

      *   *Drafting the Bottom Line:* The two-track practice presupposes a hybrid ontology that categorizes human remains and sacred items as inalienable extensions of personhood while treating aesthetic antiquities as alienable property, thereby privileging the intrinsic moral status of the object over the legitimacy of the transaction history.

      *   *Developing the Property Theory:* It relies on a split between "property" and "personhood." Remains aren't property; they are persons (or were). Sacred items are conduits. Art is property. This allows the museum to say "we don't own the ancestors" but "we do own the bronze."
      *   *Developing the Harm Theory:* Track 1 harm is ongoing (desecration). Track 2 harm is historical (dispossession). The museum assumes holding art is neutral/beneficial, holding remains is harmful.
      *   *Consistency Check:* The tension lies in the "sale" exception. If duress vitiates title for remains (implicitly), why not for art? Because remains can't be sold (inalienable). Art can. So the theory is: Some things are market-inalienable.
      *   *Underdetermination:* What else fits? Utilitarianism (greatest good). Legal positivism (current law allows keeping art, forbids keeping remains).
      *   *Alternative Scenarios:*
          *   *Scenario A (Strict Property/Market):* If everything is property and sale cleans title, you keep everything. Returns become charity, not obligation.
          *   *Scenario B (Stewardship/Relational):* If ownership is illegitimate for cultural heritage, you return everything (or co-manage). The museum loses its "owner" status.

  6.  **Polishing the Text:**
      *   Ensure the distinction between "wronged through the object" vs "wronged in the taking" is central.
      *   Clarify the "ontological hierarchy."
      *   Make sure the "what would change" section is sharp.

      *   *Self-Correction on Bottom Line:* Make it punchier. "The practice presupposes a hierarchical ontology that grants inalienable status to persons and sacred conduits while treating aesthetic artifacts as alienable property, thereby resolving claims based on the object's moral category rather than the legitimacy of its acquisition."

      *   *Refining the "Consistency" section:* The prompt asks if the reasoning extends. If remains are returned due to dignity/personhood, does a mask treated as a living presence qualify? The practice says "sometimes yes" (sacred/ritual) but "no" for art (Benin Bronzes). The distinction is often "function" vs "aesthetic." The practice assumes museums can distinguish these, or that aesthetic value overrides functional sacredness in secular contexts.
      *   *Refining the "Underdetermined" section:* The practice doesn't *need* to believe sacred objects are persons; it only needs to believe they are *treated as such* by claimants and that respecting that avoids harm. It's compatible with relativism.
      *   *Refining the "Alternatives":*
          *   *Flat Possession:* Repatriation of remains becomes impossible to justify as a right (only as policy). Retention of art becomes solid.
          *   *Heritage as Non-Property:* Retention of art becomes theft (unjustified holding). Repatriation of remains becomes obvious. Museum mission shifts from ownership to stewardship.

  7.  **Final Review against Constraints:**
      *   First sentence bottom line? Yes.
