answer: |-
  The two-track practice presupposes a hierarchical ontology that grants inalienable status to human remains and sacred conduits while treating aesthetic artifacts as alienable property, thereby resolving claims based on the object's moral category rather than the legitimacy of its acquisition history.

  This practice relies on a dual theory of property that distinguishes between market-inalienable goods and market-alienable goods. For human remains and certain sacred items, the museum operates on a theory that these objects are not truly property at all but are extensions of personhood or vessels of agency; therefore, no transaction, even a sale, can transfer title because the seller lacked the moral capacity to sell. For art and antiquities, the museum relies on a liberal Lockean theory of property where title is transferable via exchange, and where a sale—even one conducted under structural coercion or colonial duress—is sufficient to cleanse the title provided it was not explicit theft. This requires an ontological commitment that objects possess intrinsic moral qualities independent of their history: a bronze head is ontologically distinct from a human skull because the former is an representation of power or art, while the latter is the physical substrate of a person. Consequently, the theory of harm shifts between the two tracks. For remains, the harm is ongoing and intrinsic to the museum's possession (desecration, denial of rest); for art, the harm is historical and extrinsic, located solely in the moment of taking, which the museum assumes is attenuated by time, public access, or the stabilizing function of the collection.

  Strictly speaking, the practice presupposes only that some objects command a higher moral protection than others and that museums have the epistemic authority to categorize them. It does not strictly require a belief that ancestors are literally present in remains, only that treating them as property violates contemporary norms of dignity. It does not require a belief that colonial sales were free, only that they are legally or morally distinct from looting. However, the practice fits comfortably with, but does not necessitate, a utilitarian calculus that weighs the global public good of access against the specific religious needs of descendants, or a legal positivist view that statutes of limitation bar property claims but not human rights claims. The practice is philosophically underdetermined regarding the status of "sacred art." It leaves unresolved why a mask used in living ritual is returned while a bronze used in royal ancestral ritual is kept; this suggests the distinction often rests on a Western secular categorization of "religion" versus "art" rather than the claimant community's ontology. If the community views the Bronze as a living ancestor, the museum's refusal to return it while returning human remains reveals an inconsistency: the practice claims to respect personhood, but only when that personhood is biologically manifest, not when it is spiritually constituted through an object.

  The two tracks are consistent only if one accepts that the moral weight of an object resides in its material nature rather than its social relation. If the wrong of holding remains is that it violates the dignity of the dead, then holding an object that a community believes contains the spirit of the dead should incur the same violation. The practice avoids this contradiction by implicitly asserting that the museum's secular definition of the object overrides the community's religious definition for art, but not for biology. This relies on a metaphysical realism about objects (a bone is always a person; a bronze is always art) that clashes with the relational ontology of many claimant communities (an object is what it is used for). Therefore, the consistency is maintained only by privileging the museum's epistemic framework over the claimant's ontological framework in cases where they diverge on aesthetic objects.

  If you abandoned this view for a flatly possession-based account of title, where long possession and bona fide purchase settle matters regardless of origin, the retention of art would become robustly defensible, but the return of human remains would become indefensible as a matter of right. Under this theory, remains are simply biological property acquired via transaction; returning them would be an act of charity or policy compliance, not an obligation of justice. The moral distinction between a skull and a statue would collapse; both are chattel whose title is secured by the statute of limitations and the stability of commerce. The museum would no longer need to justify returns through dignity or sacredness, but would lose the moral high ground that currently insulates it from criticism regarding the remains.

  Conversely, if you adopted the view that a people's relation to its heritage is not a property relation at all but a stewardship or kinship relation, the retention of art would become indefensible overnight. If title cannot be transferred because the object is inextricably bound to the identity and continuity of the community, then the sale is void ab initio, regardless of coercion. The museum's status shifts from owner to custodian, holding objects only at the pleasure of the source community. This would collapse the two tracks into one: both remains and art would be subject to repatriation claims based on the continuity of the community's relationship to the object, not the object's material category. The only surviving part of current practice would be the logistical management of collections, but the legal and moral authority to refuse return based on "universal access" or "acquisition validity" would vanish, replaced by a requirement to negotiate continued stewardship rather than assert ownership.
