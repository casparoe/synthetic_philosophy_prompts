answer: |-
  1. You rely on dissociated responses to infer disunity, yet residual pathways and cross-cuing via posture or gaze are known confounds. How do you distinguish genuine experiential splitting from artifacts of the testing environment?

     **Follow-up:** If experimental controls rule out cueing, what specific pattern of results would have counted as evidence *against* your reading rather than merely being consistent with it?

  2. Much of the evidence for the right hemisphere's content comes from the left hemisphere's commentary on actions it did not initiate. How do you distinguish the speaking hemisphere confabulating a reason from it reporting on a separate stream of experience it cannot access?

     **Follow-up:** If the left hemisphere is confabulating, does that not undermine the reliability of the verbal report used to establish the left hemisphere's own stream as unified?

  3. You argue for two streams of experience, but the data shows two streams of information processing and report. What justifies the inference from disunity of access and behavioral control to disunity of phenomenal experience?

     **Follow-up:** If phenomenology tracks access, do you accept that subjects with blindsight or subliminal perception lack phenomenal experience in those modalities?

  4. Even granting two streams of experience, why does this entail two subjects? What turns a stream of experience into a subject of experience rather than merely a fragmented mode of a single subject?

     **Follow-up:** If unity defines the subject, does a subject cease to exist during dreamless sleep or general anesthesia, or do you require a thinner notion of subjecthood to maintain identity over time?

  5. If there are two subjects, are there two persons? Does your view commit you to assigning distinct moral and legal standing to the hemispheres of a split-brain patient?

     **Follow-up:** If personhood is pragmatic but subjecthood is metaphysical, what work is the metaphysical claim doing if it does not alter our normative practices toward the patient?

  6. Neural disconnection is rarely absolute; some fibers often remain, or plasticity restores function. If unity comes in degrees, why should subjecthood be binary?

     **Follow-up:** If it is a threshold matter, what specific physiological metric marks the boundary where one subject becomes two, and why that metric rather than another?

  7. Apply your criterion to a partial commissurotomy where only visual modalities are disconnected but tactile information is shared. Does this patient sustain two subjects, one subject, or a subject with fragmented contents?

     **Follow-up:** If cross-modal integration preserves subjecthood, does that imply the ordinary impression of unity in normals is also a reconstruction achieved through integration rather than a datum?

  8. You claim the ordinary impression of a single subject in split-brain patients is a reconstruction. If unity is achieved via integration in normals, is our own sense of being a single subject also a reconstruction rather than a fundamental fact?

     **Follow-up:** If unity is an achievement, does the failure to integrate in split-brain patients reveal the absence of a subject, or merely the failure of a specific cognitive function?

  9. The manifest unity of these patients is partly constituted by our practice of addressing them as one person. Does this social practice merely recognize a metaphysical unity, or does it partly constitute the unity you claim is reconstructed?

     **Follow-up:** If the metaphysics precedes the practice, how do we access this metaphysical fact independently of the behavioral and social cues you previously dismissed as unreliable?

  10. Finally, what would you regard as decisive evidence against your reading? Is there any conceivable outcome of a commissurotomy study that would force you to abandon the claim of two subjects?

      **Follow-up:** If integrated learning were found, would you concede there are two subjects who simply cooperate perfectly, or would you concede there is only one subject after all?
