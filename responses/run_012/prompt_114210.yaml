answer: |-
  Does the replication crisis persist because neither frequentist nor Bayesian frameworks mandate the explicit specification of the scope conditions under which a population claim holds?

  Standard diagnoses of the replication crisis posit a conflict between statistical paradigms. Frequentists argue that lax significance thresholds inflate false positives; Bayesians contend that prior neglect distorts posterior probabilities. Both assume the unit of replication is a statistical outcome—a p-value or a belief update—derived from data. However, this framing addresses neither the ontological status of the claim nor the boundaries of its validity. In thirty-five years of bench experimentation, I observed that statistical significance was rarely the point of failure; rather, failures arose when a result derived from a specific experimental population was asserted as a universal law without defining the conditions under which it ceased to hold. The crisis is not merely about error rates or belief updating; it is about the mismatch between a claim's intended scope and the conditions of its testing.

  Neither dominant paradigm forces the researcher to articulate these boundaries. Frequentist hypothesis testing controls long-run error rates of a procedure, not the truth of a specific claim about a specific population in a specific context. A successful replication in this view means reproducing the error-control performance, not necessarily validating the underlying causal mechanism outside the original experimental bounds. Bayesian inference updates an agent's degree of belief based on evidence, but the likelihood function itself relies on model assumptions that often hide scope conditions within structural parameters. Consequently, the same data can support a "successful" replication under one analysis while dissolving under another, because neither framework requires the researcher to state, "This claim holds only if conditions X, Y, and Z are met." By treating the claim as unbounded, both paradigms allow replication efforts to talk past one another, testing different implicit populations under the guise of testing the same hypothesis.

  This project proposes that the genuine unit of replication is the "scoped claim": a propositional assertion coupled with an explicit set of boundary conditions. I will argue that replication succeeds or fails only relative to this composite unit. To demonstrate this, I will pursue a four-phase work plan over the fellowship year.

  In the first quarter, I will develop a conceptual taxonomy of scope conditions. Drawing on philosophical literature regarding external validity and ceteris paribus clauses, I will distinguish between instrumental conditions (apparatus, protocol), environmental conditions (context, setting), and population conditions (subject characteristics). The goal is to produce a formal definition of a scoped claim that distinguishes it from a mere statistical hypothesis.

  In the second and third quarters, I will apply this framework to canonical cases of replication failure from psychology and biomedicine. I will reconstruct the original claims and the replication attempts not as statistical contests, but as mismatches in scope. I will analyze whether making the scope conditions explicit would have predicted the failure beforehand or reclassified the outcome as a boundary discovery rather than a falsification. This comparative analysis will form the empirical core of the project, grounding the philosophical argument in actual scientific practice.

  In the final quarter, I will construct a normative framework for "scoped replication." This will outline procedural requirements for future research, specifying how scope conditions should be registered, reported, and tested. I will draft two manuscripts: one detailing the conceptual argument and the other presenting the case studies and normative proposals.

  A genuine result will look like a resolved ambiguity: a demonstration that conflicting statistical interpretations of a replication attempt converge when the scope conditions are made explicit. Success is defined as producing a framework where the status of a replication (success, failure, or boundary test) is determinate once the scope is agreed upon. Conversely, the project will count as a failure if I cannot distinguish this approach from existing literature on external validity, or if I demonstrate that scope conditions are inherently too vague to be operationalized as part of a replication unit. If scope conditions prove to be infinitely regressible or subjective, the argument collapses.

  Regarding feasibility, the scope fits the time precisely because this is a conceptual and normative project, not an empirical one. I am not collecting new data but re-interpreting existing public records of replication projects. The risk lies in getting bogged down in technical statistical debates rather than maintaining the philosophical focus on the nature of claims. However, my background allows me to navigate the statistical literature efficiently without needing to derive new theorems. The primary deliverable is a rigorous philosophical argument supported by case analysis, which is achievable within twelve months. The visiting fellowship environment will be crucial for stress-testing the conceptual taxonomy against contemporary metaphysics of science, ensuring the final framework is robust enough to influence methodological standards.
