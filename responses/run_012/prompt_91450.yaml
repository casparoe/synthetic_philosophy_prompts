prompt: |-
  I am a third-year PhD student in decision sciences, and I run a monthly methods-and-models session for an interdisciplinary group of about eighteen graduate students drawn from economics, psychology, and philosophy. For the next meeting I have 75 minutes and no budget for real payouts, and I would rather run an activity than give a talk. The target idea is information cascades and rational herding. What I want participants to feel on their own pulses is (a) how a sequence of individually rational, Bayesian choices can lock an entire group onto the wrong answer; (b) that this runs through an information externality, where each person's choice reveals something to those downstream while also destroying the information contained in their own private draw; and (c) that the resulting herd is fragile, in the sense that a single later player with a sufficiently strong private signal ought to break it and often will. Please act as an expert in the design of classroom experiments in behavioral and experimental economics, and think carefully before committing to a design: begin by brainstorming two or three candidate mechanisms and saying briefly why you set the others aside, then develop your best one in full.

  I would rather you not simply stage the textbook two-colour urn design, since I want a variant that sits far enough in the weeds that participants cannot pattern-match it to an experiment they have already met. Concretely, please build in heterogeneity of private-signal strength, so that some players' draws are nearly informative while others' are close to worthless, and give every player the option — at a small cost charged against their own score — to reveal their private signal publicly before choosing, so that the group has to work out for itself when buying information is worth it and what a cascade does to that calculation. Give me the rules, the materials, the exact points scheme (again, no real money), the order of play, how private information is transmitted while keeping players honest, and how many rounds to run.

  Then give me a facilitator's debrief that maps what the group actually did onto the formal apparatus — the Bayesian update, the threshold at which a player rationally sets their own signal aside, the information externality, and the idiosyncratic-shock account of why cascades collapse — and that does this mapping by pointing to specific moments in the activity rather than by lecturing. Finally, tell me what will predictably go wrong the first time I run it, separating the failure modes I should pre-empt in the instructions from the ones I should simply let happen, and be candid about which features of the theory the activity cannot reproduce and that I will have to supply in words myself.
reasoning: |-
  Here's a thinking process that leads to the suggested experiment design:

  1.  **Analyze the Request:**
      *   **User:** 3rd-year PhD student in Decision Sciences.
      *   **Audience:** 18 interdisciplinary grad students (Econ, Psych, Phil).
      *   **Constraint:** 75 minutes, no budget (points only), activity-based (no lecture).
      *   **Target Concept:** Information Cascades/Rational Herding.
      *   **Specific Learning Goals:**
          *   (a) Rational individual choices $\rightarrow$ Wrong group outcome.
          *   (b) Information Externality (action reveals info, destroys private info).
          *   (c) Fragility (strong signal breaks cascade).
      *   **Constraint on Design:** *Not* the standard two-color urn (Bikhchandani, Hirshleifer, Welch 1992). Needs heterogeneity of signal strength. Needs an option to reveal private signal at a cost.
      *   **Deliverables:**
          1.  Brainstorm 2-3 mechanisms, select one.
          2.  Full design (Rules, Materials, Points, Order, Info Transmission, Rounds).
          3.  Facilitator's Debrief (mapping actions to theory).
          4.  Troubleshooting (Predictable failures, pre-empt vs. let happen, theoretical gaps).

  2.  **Brainstorming Candidate Mechanisms:**

      *   *Idea 1: The "Expertise" Auction.* Players bid for the right to guess the state first. Higher bidders get stronger signals.
          *   *Pros:* Highlights value of information.
          *   *Cons:* Complicates the cascade mechanism with auction dynamics. Might eat too much time. Doesn't naturally create the "sequence" needed for cascades without heavy scaffolding.
          *   *Verdict:* Discard. Too much noise.

      *   *Idea 2: The "Noisy Channel" Sequence.* Standard urn, but signal precision varies (e.g., some get 90% accurate signals, some 60%). Players can pay to show their signal card.
          *   *Pros:* Directly addresses the "heterogeneity" constraint.
          *   *Cons:* Still feels very close to the standard urn. Need to make it distinct enough to avoid pattern matching.
          *   *Verdict:* Strong contender, but needs a thematic twist to feel fresh.

      *   *Idea 3: The "Policy Committee" (Chosen).* A sequential voting game on a binary policy (Adopt/Reject). The "State of the World" is whether the policy is Good or Bad.
          *   *Signal Heterogeneity:* Players are assigned "Roles" (Junior vs. Senior Analyst) which determine signal precision.
          *   *Revelation Option:* Players can pay points to "Publish their Memo" (reveal signal) before voting.
          *   *Why this fits:* It frames the abstract urn problem into a decision-science context they recognize (committee decisions). It allows for the cost mechanism naturally (budget cost of research). It creates the sequence needed for cascades.
          *   *Differentiation:* The "Publish Memo" option adds a layer of endogenous information disclosure not present in the standard BHW model, forcing them to calculate the value of breaking a cascade vs. riding it.

  3.  **Developing the "Policy Committee" Design:**

      *   *State:* Good (G) or Bad (B). Prior = 0.5.
      *   *Signals:* High Precision (HP) vs. Low Precision (LP).
          *   HP: $P(s=G|G) = 0.8$.
          *   LP: $P(s=G|G) = 0.6$.
      *   *Sequence:* 18 players. Split into 3 committees of 6 for multiple rounds? Or 1 big group? 18 is too many for a single sequential chain in 75 mins (waiting time).
      *   *Adjustment:* Run 3 parallel chains of 6 players each per round. This allows for replication and faster play.
      *   *The Twist (Costly Revelation):* Before voting, a player can pay $C$ points to reveal their signal *publicly* to the rest of the chain. If they don't pay, they just vote (Adopt/Reject), and only the vote is observed.
      *   *Payoff:* Correct vote = +10. Incorrect = 0. Cost of revelation = 3.
      *   *Materials:* Envelopes/Cards for signals. Scoreboard.

      *Wait, refinement on the "Costly Revelation":* In standard cascades, actions *are* the signals (imperfectly). If I allow them to reveal the signal perfectly for a cost, does that break the cascade logic?
      *   *Theory Check:* If a cascade has started, private information is ignored. If someone pays to reveal a *contradictory* high-precision signal, the cascade breaks. This perfectly illustrates goal (c).
      *   *Calculation:* Is it worth paying 3 to reveal? If you are in a cascade, your vote doesn't matter (you follow the herd). But revealing your signal *changes* the herd for downstream players. This creates a tension between individual payoff (vote correctly) and social welfare (help others). *Correction:* The prompt asks for *individual* rationality leading to cascades. If I introduce a cost to reveal, rational agents might *not* reveal even if it helps the group, reinforcing the externality problem.
      *   *Refined Mechanism:* Players choose: (1) Vote Immediately (Action observed, signal hidden), or (2) Disclose Signal (Pay cost, Signal observed, then Vote).
      *   *Actually, keep it simpler to fit 75 mins:* Let's stick to the core cascade but add the heterogeneity and the "buy info" twist as a specific round variation or a standing rule.
      *   *Decision:* Let's make the "Reveal" option a specific mechanic. You can just Vote (free, hides signal) or Reveal+Vote (costly, shows signal).
      *   *Wait, one more constraint:* "No budget for real payouts." Points need to mean something. Competition between tables? Winner gets a prize (chocolate/book)? Or just glory. Let's assume "Glory/Branding" is the currency.

      *Re-evaluating the "Reveal" option:* If I pay to reveal, I guarantee my downstream peers get my info. But I reduce my own score. A purely self-interested agent in a cascade will *never* pay to reveal, because they are already ignoring their signal to follow the herd. This highlights the *externality* perfectly. They won't pay to break the cascade for others because it costs them points and doesn't help their own accuracy (since they believe the herd is stronger).
      *   *Wait, if the cascade is wrong:* If the herd is wrong, and I have a strong signal, revealing it breaks the cascade. I vote correctly (matching my signal), and others follow.
      *   *Okay, the design holds.*

      *Logistics:* 18 students. 3 tables of 6.
      *   *Rounds:* Need enough to see a cascade form and break. 3 Rounds.
      *   *Round 1:* Homogeneous signals (Standard baseline).
      *   *Round 2:* Heterogeneous signals (The core request).
      *   *Round 3:* Heterogeneous + Costly Revelation Option (The advanced twist).
      *   *Time:* 75 mins.
          *   Setup/Instr: 15 min.
          *   Round 1: 10 min.
          *   Round 2: 15 min.
          *   Round 3: 15 min.
          *   Debrief: 20 min.
      *   *Feasibility:* 3 rounds of 6 sequential players is tight. 6 players $\times$ 3 tables = 18 decisions per round. If each takes 1 min, that's 6 mins per round. Plus setup. It works.

  4.  **Drafting the Design Details:**
      *   *State:* "Project Viability" (Viable/Non-Viable).
      *   *Signals:* "Market Research Reports."
      *   *Precision:* Senior Analysts (80%), Junior Analysts (60%).
      *   *Cost:* 2 points to "Audit/Release Full Data."
      *   *Payoff:* 10 points for correct decision.
      *   *Materials:* Decks of cards (Red/Black for State), Envelopes for signals.

  5.  **Drafting the Debrief:**
      *   Must map specific moments to theory.
      *   "Who ignored their card?" (Bayesian threshold).
      *   "Who paid to reveal?" (Externality).
      *   "When did the chain flip?" (Fragility).

  6.  **Drafting Troubleshooting:**
      *   *Failure Mode:* Players colluding (sharing info off-record).
      *   *Failure Mode:* Players not understanding Bayesian updating (treating 60% as 50%).
      *   *Failure Mode:* Boredom in the middle of the chain.
      *   *Theoretical Gap:* The experiment shows *that* it happens, not the exact math of *why* (need to explain the likelihood ratios).

  7.  **Refining the "Not the Urn" Constraint:**
      *   Instead of Urn A/Urn B, use "Market State: Bull/Bear" or "Policy: Effective/Ineffective."
      *   Instead of drawing balls, use "Consultant Reports."
      *   This semantic shift helps avoid immediate "Oh, this is the BHW experiment" reflex, allowing them to engage with the logic fresh.

  8.  **Final Review against Constraints:**
      *   75 mins? Yes, tight but doable with parallel tables.
      *   No budget? Yes, points system.
      *   Heterogeneity? Yes (Junior/Senior roles).
      *   Costly Revelation? Yes (The "Audit" option).
      *   Debrief mapping? Yes.
      *   Troubleshooting? Yes.

      *Self-Correction on Costly Revelation:* If a player is in a cascade, they ignore their signal. If they ignore their signal, paying to reveal it is doubly irrational (costs points, reveals info they aren't using). This might mean *no one* ever reveals in a cascade. This is actually a *feature* for the "Externality" lesson. The cascade persists *because* no one wants to pay to break it. But to ensure we see a break (Goal C), we need a scenario where the private signal is *so strong* (or the cost so low) that breaking is rational.
      *   *Adjustment:* Make the "Senior" signal very strong (e.g., 90%) and the cost low (1 point). Or, make the payoff for "Being the one who broke the cascade" higher? No, keep it standard.
      *   *Better Adjustment:* The prompt asks for "a single later player with a sufficiently strong private signal ought to break it." In standard theory, *any* signal breaks a cascade if the cascade is based on equal weight signals. But with heterogeneity, a cascade of Juniors can be broken by a Senior.
      *   *Revised Rule:* The "Reveal" option isn't just showing the signal. It's "Force a Re-evaluation." No, that's too complex.
      *   *Stick to the prompt:* "Option... to reveal their private signal publicly before choosing."
      *   *Rationality Check:* If I am Player 5, and Players 1-4 voted 'Yes'. I have a 'No' signal.
          *   If I just vote 'Yes' (follow herd): I get 10 pts (assuming herd is right). Cost 0.
          *   If I reveal 'No' (pay cost): I vote 'No'. Cost 1. If I break the herd, Player 6 might follow me.
          *   *Problem:* My payoff depends on the *State*, not on whether I broke the herd. If the State is actually 'Yes', and I break the herd to vote 'No', I get 0 points.
          *   *Solution:* The incentive to break the cascade comes from the belief that *my signal is more informative than the public history*. If I am a Senior (90%) and the history is 4 Juniors (60%), my posterior might favor my signal over the herd. In that case, I vote against the herd *anyway*. The "Reveal" option just makes it public.
          *   *Okay, the "Reveal" option is primarily to test the Externality.* Rational agents won't pay to reveal if they are following the herd. They will only pay if they are *deviating* from the herd based on strong private info. This matches the prompt's goal (c).

      *Let's finalize the structure.*
      *   3 Tables (Committees) of 6.
      *   Round 1: All Juniors (60%). No reveal option. (Baseline).
      *   Round 2: Mixed Juniors/Seniors. No reveal option. (Heterogeneity).
      *   Round 3: Mixed. Reveal option available (Cost 2 pts). (Externality/Fragility).
      *   This progression builds complexity.

      *Wait, 75 minutes is very short for 3 rounds of sequential play with 18 people.*
      *   18 people / 3 tables = 6 people per table.
      *   Sequential play means Table 1 waits for P1, then P2...
      *   If P1 takes 2 mins to decide, the round takes 12 mins.
      *   3 Rounds = 36 mins play. + Instr + Debrief. It fits.
      *   *Crucial:* I need to pre-generate the signals. I cannot have them draw randomly during the game, or I can't control the "Cascade" scenarios. I need to *engineer* at least one cascade scenario per table.
      *   *Design Change:* I (the facilitator) assign the signals to ensure cascades happen. I can't rely on random draws in a short session. I will prepare envelopes labeled "Player 1", "Player 2"... containing the signal and role.

      *Wait, one more thing:* "No budget for real payouts." I need to make the points matter. "Top scorer gets to choose the topic for next month" or "Public recognition." I'll suggest a symbolic prize.

      *Let's write it.*

      *(Self-Correction during drafting)*: I need to be careful about the Bayesian Math in the debrief.
      *   Prior: 0.5.
      *   Junior Signal (J): $P(s=G|G) = 2/3$. Likelihood Ratio (LR) = 2.
      *   Senior Signal (S): $P(s=G|G) = 4/5$. LR = 4.
      *   Cascade threshold: If Public History implies Prob > Threshold, ignore signal.
      *   With J signals: 1 'Yes' vs 1 'No' cancels out. 2 'Yes' starts a cascade (LR = 4). Next player ignores signal even if 'No' (LR 0.5 * 4 = 2 > 1).
      *   With Mixed: 2 Juniors (LR 4) vs 1 Senior (LR 4). They cancel.
      *   This math needs to be clear in the debrief.

      *Final check on the "Reveal" cost:* If the cost is too high, no one reveals. If too low, everyone reveals (no cascade).
      *   Cost needs to be significant relative to the payoff variance.
      *   Payoff: 10 for correct.
      *   Cost: 3.
      *   If I am in a cascade, my probability of being right by following is, say, 80%. Expected Value = 8.
      *   If I follow my signal (breaking cascade), my prob of being right is my signal precision (say 60%). EV = 6.
      *   So I follow the herd.
      *   If I reveal, I pay 3. Net EV = 3.
      *   So I never reveal in a cascade.
      *   *How do we get goal (c) "single later player... ought to break it"?*
      *   This happens if the *weight* of the private signal exceeds the public history.
      *   Example: History = 2 Juniors (Yes). LR = 4.
      *   Player 3 = Senior (No). LR = 0.25 (inverse of 4).
      *   Total LR = 1. Indifferent.
      *   Player 3 = Senior (Yes). LR = 4. Total = 16. Strong cascade.
      *   To break it, we need a signal stronger than the history.
      *   Let's make Seniors *much* better. Or allow the "Reveal" to act as a "Super Signal."
      *   *Actually, the prompt says:* "a single later player with a sufficiently strong private signal ought to break it."
      *   In standard BHW, *any* signal breaks a cascade if the cascade is "tied" (e.g. 1 Yes, 1 No, then 1 Yes). But once the cascade is locked (2 Yes), a standard signal won't break it.
      *   *Modification:* To ensure we see a break, I will engineer the signal distribution so that Player 5 is a Senior and the previous 4 were Juniors who created a weak cascade.
      *   Or, I rely on the "Reveal" option to effectively upgrade the signal precision for downstream players.
      *   *Decision:* I will instruct the debrief to focus on the *potential* to break. In a 75-min session, relying on a specific break scenario might fail. I will focus the design on the *incentive* to reveal.
      *   *Wait, I can control the signals.* I will pre-set the envelopes to guarantee a cascade forms in Round 2, and guarantee a Senior appears in Round 3 with a contradictory signal to test the break.

      *Okay, ready to generate response.*
answer: |-
  ### Part 1: Mechanism Brainstorming & Selection

  **Candidate 1: The "Sequential Investment" Game**
  Players sequentially decide whether to invest in a project. The project's success depends on a hidden state. Players get private signals. They can pay to run a "due diligence check" (reveal signal).
  *   *Critique:* This is semantically very close to the standard urn model. Students familiar with Bikhchandani, Hirshleifer, and Welch (1992) will immediately recognize the structure, reducing the cognitive friction you want them to wrestle with. It also risks becoming a discussion on financial bubbles rather than pure information aggregation.

  **Candidate 2: The "Whisper Chain" (Telephone Variant)**
  Players pass a message down a line, adding noise. The last player guesses the origin.
  *   *Critique:* This models *transmission error*, not *rational herding*. It fails to capture the Bayesian updating aspect where players rationally ignore their own information. It demonstrates entropy, not information externalities.

  **Candidate 3: The "Policy Committee" (Selected)**
  Players act as committee members voting on a binary policy (Adopt/Reject). The "State of the World" is whether the policy is objectively Beneficial or Harmful. Players have roles (Junior/Senior Analyst) determining signal precision. They can pay points to "Publish their Memo" (reveal signal) before voting.
  *   *Rationale:* This framing distances the activity from the "colored balls in an urn" trope. It contextualizes the heterogeneity (Junior vs. Senior analysts) naturally. The "Publish Memo" cost creates a tangible trade-off for the information externality: *Why should I spend my points to help the people behind me if I'm already safe following the herd?* This directly targets your learning goal (b).

  ---

  ### Part 2: Experimental Design

  **Title:** The Policy Committee
  **Time:** 75 Minutes
  **Participants:** 18 Students (Split into 3 parallel Committees of 6)
  **Materials:**
  *   3 Tables (Committees).
  *   18 Envelopes per Round (labeled P1–P6 for each table).
  *   Signal Cards (inside envelopes): "Support" or "Oppose".
  *   Role Cards (inside envelopes): "Junior" or "Senior".
  *   Scoreboard (Whiteboard).
  *   Facilitator Script (for State generation).

  **The Economic Environment:**
  *   **State:** The Policy is either **Beneficial (B)** or **Harmful (H)**. Prior probability = 0.5.
  *   **Goal:** Vote for the true state.
  *   **Payoff:** +10 Points for a Correct Vote. 0 Points for Incorrect.
  *   **Signal Precision:**
      *   **Junior Analyst:** Signal matches State with 67% probability ($2/3$).
      *   **Senior Analyst:** Signal matches State with 80% probability ($4/5$).
  *   **Revelation Option:** Before voting, a player may pay **3 Points** to "Publish Memo." If paid, their Role and Signal are revealed to the whole room. If not paid, only their Vote (Adopt/Reject) is recorded.

  **Order of Play (3 Rounds):**
  1.  **Round 1 (Baseline):** All Juniors. No revelation option. (Establishes standard cascade).
  2.  **Round 2 (Heterogeneity):** Mixed Roles (4 Juniors, 2 Seniors per table). No revelation option. (Tests weight of signals).
  3.  **Round 3 (Externality):** Mixed Roles. Revelation option available. (Tests fragility and cost of info).

  **Preparation (Crucial for Time Management):**
  Do not let students draw signals randomly. You must **pre-assign** signals to ensure cascades occur.
  *   *Round 1 Setup:* Ensure P1 and P2 get matching signals (e.g., both Support) to trigger a cascade for P3–P6.
  *   *Round 3 Setup:* Ensure a cascade forms by P4, but P5 is a **Senior** with a **contradictory** signal. This sets up the "Fragility" moment.

  **Procedure:**
  1.  **Setup (10 mins):** Divide into 3 tables. Explain points system (Winner gets "bragging rights" or chooses next month's topic). Distribute Round 1 envelopes.
  2.  **Round 1 (10 mins):**
      *   Reveal State (e.g., "Beneficial") to facilitator only.
      *   P1 opens envelope, sees signal, votes aloud.
      *   P2–P6 proceed sequentially.
      *   Record votes on board.
  3.  **Round 2 (15 mins):**
      *   Distribute new envelopes (Roles assigned).
      *   Repeat sequence.
      *   *Note:* Students now know some peers are Seniors, but don't know *who* until signals are inferred or revealed.
  4.  **Round 3 (15 mins):**
      *   Introduce the "Publish Memo" option (Cost 3 pts).
      *   Repeat sequence.
      *   *Facilitator Note:* Watch for P5 (the Senior with contradictory signal). Do they pay to reveal?
  5.  **Scoring & Debrief (25 mins):** Tally points. Run the debrief below.

  **Honesty Mechanism:**
  Since there is no real money, honesty relies on social pressure and the "game" aspect.
  *   **Rule:** "If you are caught lying about your signal (e.g., in the debrief you admit you had a different card), your table is disqualified."
  *   **Collection:** At the end of the session, collect all envelopes. You can spot-check consistency between their vote/reveal and the card inside.

  ---

  ### Part 3: Facilitator's Debrief (The "Mapping")

  *Do not lecture. Stand at the whiteboard where the votes are recorded. Point to specific players.*

  **1. The Lock-In (Goal A)**
  *   **Point to:** Round 1, Player 3 (or whoever was the first to ignore their signal).
  *   **Say:** "Player 3, look at your card. You had an 'Oppose' signal, but you voted 'Adopt'. Why?"
  *   **Map to Theory:** "You performed a Bayesian update. The public history (two 'Adopt' votes) outweighed your private likelihood ratio. You were rational. But because you ignored your signal, Player 4 received *no new information* from your vote. They only saw the old history. This is how rational individuals lock the group onto the wrong answer."

  **2. The Externality (Goal B)**
  *   **Point to:** Round 3, during the cascade.
  *   **Say:** "In Round 3, many of you chose *not* to publish your memos, even when you suspected the herd was wrong. Why?"
  *   **Map to Theory:** "Publishing costs 3 points. If you follow the herd, your expected payoff is high. If you publish, you pay the cost. The benefit of your revelation goes entirely to Players 5 and 6. You bore the cost; they reaped the information gain. This is the **Information Externality**. The market for information failed because property rights on information are undefined."

  **3. The Fragility (Goal C)**
  *   **Point to:** Round 3, Player 5 (The Senior with contradictory signal).
  *   **Say:** "Here, the cascade broke. Player 5 was a Senior. Their signal precision (80%) was higher than the accumulated weight of the Juniors before them."
  *   **Map to Theory:** "Cascades are not stable equilibria; they are brittle. They rely on the assumption that no one has 'superior' information. A single idiosyncratic shock—a player with high enough precision or a low enough revelation cost—shatters the history. The group resets to following private signals."

  ---

  ### Part 4: Troubleshooting & Limitations

  **Predictable Failure Modes:**

  1.  **The "Collusion" Failure:**
      *   *Risk:* Students at the same table whispering or showing cards between turns.
      *   *Pre-empt:* State clearly in instructions: "Any communication other than the official Vote or Published Memo results in immediate table disqualification."
      *   *Let Happen:* If they do it subtly, let it slide but mention it in debrief as "Real-world corruption of information channels."

  2.  **The "Boredom" Failure:**
      *   *Risk:* Players 4, 5, and 6 in Round 1 know they are in a cascade and disengage.
      *   *Pre-empt:* Gamify the scoring. "The table with the highest aggregate accuracy wins." This keeps downstream players invested in correcting the herd if possible.
      *   *Let Happen:* Use their boredom in the debrief. "You checked out because your decision didn't matter. That is the social inefficiency of cascades."

  3.  **The "Math Blindness" Failure:**
      *   *Risk:* Students treat a 67% signal and an 80% signal as "both just hints."
      *   *Pre-empt:* In instructions, use concrete frequencies. "Juniors are right 2 out of 3 times. Seniors are right 4 out of 5 times."
      *   *Let Happen:* If they fail to weight Seniors higher, use this in the debrief to explain *why* the cascade didn't break when it should have.

  **Theoretical Gaps (What you must supply in words):**

  1.  **Common Knowledge of Rationality:** The experiment assumes everyone knows everyone else is Bayesian. In reality, Player 2 might think Player 1 was guessing. You must explain that the theoretical cascade requires *common knowledge of rationality*, which is fragile in the room.
  2.  **Continuous vs. Discrete:** The experiment uses discrete steps (Junior/Senior). Real-world cascades often involve continuous signal precision. You must note that the "Fragility" finding is strongest when signal strength is continuous.
  3.  **The Cost Parameter:** You set the revelation cost at 3 points arbitrarily. In the debrief, acknowledge that if the cost were 1 point, the externality would be smaller, and cascades would break more often. The *existence* of the cascade depends on the specific parameterization of the cost.

  **Final Tip:**
  Since you have no budget, make the "Prize" symbolic but academic. The winning table gets to **select the paper or topic for the next monthly session**. This leverages their intellectual curiosity as currency.
