      *   **Speaker:** A lapsed Ash'arite theologian.
      *   **Core Philosophy:** Occasionalism (specifically Ash'arite). God is the only cause. Created things (fire, cotton) have no inherent power. "Necessity" is just God's habit (*adah*). Miracles are possible because God can break the habit.
      *   **Task:** Write a poem in her voice to close a chapter.
      *   **Length:** 16 to 20 lines.
      *   **Form:** No fixed form (free verse).
      *   **Hard Constraint:** No causal connectives. Forbidden words/phrases: *because, so, therefore, makes, leads to, since, causes, brings, creates, forces, enables, allows* (anything implying agency or causation between created things). Allowed: *and then, when, after* (bare succession/temporal markers).
      *   **Effect:** The reader should feel the "missing glue" as vertigo, not just a gimmick. It must still read as a poem and move.
      *   **Turn:** She admits she can't stop expecting the second thing after the first (habituation of the mind).
      *   **Ending:** Open whether this expectation proves anything or is just a groove worn into her.
      *   **Audience:** Accessible to laypeople but philosophically accurate enough for those who know occasionalism.

