      *(Self-Correction on "Clay"):* Ines says "Clay can be made into a pot." This is actually Gaozi's metaphor (*Mencius* 6A:1-2). Xunzi prefers "Warped Wood" (*Xunzi* 23). However, the logic (material vs. form) applies to Xunzi too. I will point this out as a minor textual conflation but accept the philosophical point.

