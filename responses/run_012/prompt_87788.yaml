prompt: |-
  I sit on the trust and safety appeals panel for a social VR platform -- small one, maybe 40k monthly users, mostly hangout and roleplay worlds. We vote Thursday on an appeal and I've got to circulate a written opinion before then.

  The case: a user, call her R, says another user, M, followed her around a private instance for about ten minutes and kept putting his avatar's hands through her avatar's chest and crotch, with some voice stuff on top. No recording, private instance, so it's mostly her word against his, though two friends of hers were in the instance and back up the basic sequence. M doesn't deny the actions. His defense is that nothing happened -- no body was touched, avatars are cartoons, and he points out that our own Terms of Service say users hold no property rights and no rights of any kind in virtual objects or in their own avatar. At most, he says, this is bad manners, not the sexual harassment our code is about.

  My problem is this. Our harassment code is drafted entirely around content -- posts, messages, images, uploaded avatar skins. The operative line is basically "content a reasonable user would find sexually explicit or degrading." An action one avatar performs on another doesn't obviously fit that; there's no content. Last year we upheld a ban in a seperate case where a user kept spawning an oversized avatar to loom over people in their personal space, and that opinion said the code protects the experience a user has, not just the pixels -- but it was one paragraph and nobody ever wrote down what the test actually is. We also have about thirty cases like R's sitting in the queue behind this one, plus one that's wierd in a different way: a user gave a friend edit access to a world he'd spent two years building and the friend deleted the whole thing. I think that second one is easier, but I want the same opinion to cover it, or to say plainly why it doesn't.

  And one board member is going to argue that if we start treating this as battery-adjacent, we hand a weapon to people who want combat, horror and kink roleplay communities shut down -- that the moment avatar-on-avatar contact counts as an assault, every consensual scene becomes a reportable incident.

  Please draft the opinion I'll recieve for circulation. I need a concrete bottom line for R's case -- uphold, reduce, whatever -- with a remedy and a timeframe, a rule for the queue that reviewers can apply without me in the room, and a straight treatment of the dissent: if the carve-out for consensual contact is actually the right answer, say so, and tell me how to write it so it doesn't swallow the rule.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **Role:** Member of a Trust & Safety Appeals Panel for a small social VR platform (~40k monthly users, hangout/roleplay focus).
      *   **Task:** Draft a written opinion for circulation before a Thursday vote.
      *   **Case:** User R appeals a decision (presumably a denial of her report/M's ban). User M followed R in a private instance, put avatar hands through her avatar's chest/crotch, plus voice comments. No recording, but two witnesses. M admits actions but claims "it's just pixels" citing ToS about no property rights in avatars.
      *   **Legal/Policy Problem:** Harassment code focuses on *content* (posts, images, skins). Avatar *actions* aren't clearly "content." Precedent exists (oversized avatar looming) but is vague ("protects the experience").
      *   **Secondary Case (Queue):** User deleted a friend's world after being given edit access. Needs to be addressed (same rule or distinct?).
      *   **Dissent/Concern:** One board member worries that treating avatar contact as "battery" kills consensual kink/combat/horror RP. Need a carve-out that doesn't swallow the rule.
      *   **Deliverables:**
          1.  Concrete bottom line for R's case (Uphold/Reduce/Overturn + Remedy + Timeframe).
          2.  A test/rule for reviewers to apply to the queue (30 similar cases).
          3.  Treatment of the dissent (consensual contact carve-out).
          4.  Address the world-deletion case.
      *   **Tone:** Professional, legalistic but accessible (internal memo/opinion style), decisive, pragmatic.

  2.  **Deconstruct the Legal/Policy Issues:**
      *   *The "Content" Gap:* The ToS defines harassment via "content." Avatar gestures are ephemeral actions, not static content. *Argument:* In VR, action *is* content. The experience is the product.
      *   *The "Pixels" Defense:* M argues avatars aren't real bodies. *Counter:* Harassment law (and platform safety) protects the *user*, not the avatar. The avatar is the proxy for the user's bodily autonomy in the space.
      *   *The "Battery" Fear:* If touching = assault, how do we allow fighting games, horror chases, or kink RP? *Solution:* Context and Consent. The standard isn't "touching," it's "unwanted intrusion into personal space intended to degrade or intimidate."
      *   *The World Deletion:* This is property/trespass, not harassment. It needs a different bucket (Griefing/Sabotage vs. Harassment).

  3.  **Drafting Strategy - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Re).
      *   **Executive Summary:** The bottom line up front.
      *   **Facts:** Brief recap of R v. M.
      *   **Analysis - The "Content" Definition:** Redefine "content" to include "interactive behaviors" in a VR context. Rely on the "Experience" precedent.
      *   **Analysis - The "Pixels" Defense:** Dismiss it. The harm is psychological/experiential, not physical damage to code.
      *   **The Test (The Core):** Need a multi-factor test for "Avatar Harassment."
          *   Intent (degrade/intimidate vs. play).
          *   Expectation of Privacy/Social Norms (private instance vs. combat arena).
          *   Persistence (following vs. one-off).
          *   Consent (explicit or implicit via context).
      *   **The Consensual Carve-Out:** Address the board member's concern directly. Distinguish between *contextual* contact (RP, combat) and *targeted* contact (following someone into a private space).
      *   **The World Deletion Case:** Distinguish this. It's not harassment; it's "Malicious Destruction of User Content." Needs a different policy bucket, but can be ruled on now as a ban-worthy offense under a broader "Safety/Integrity" clause.
      *   **Ruling:** Uphold R's appeal (meaning, overturn M's unpunished status -> Ban M).
      *   **Remedy:** Permanent ban for M? Or suspension? Given the sexual nature and stalking, permanent is safer for a small platform trying to set a tone. Let's go with Permanent Ban for M, reinstatement of R's good standing (if she was affected).
      *   **Implementation:** Instructions for the T&S team.

  4.  **Refining the "Test":**
      *   It can't be too vague ("reasonable user" is okay but needs VR specifics).
      *   It can't be too rigid ("no touching ever").
      *   *Proposed Test:* "The Contextual Intrusion Standard."
      *   1. **Context:** Is the space designated for combat/ RP?
      *   2. **Consent:** Was there prior agreement or implicit social contract?
      *   3. **Targeting:** Is it directed at a specific individual who has signaled discomfort?
      *   4. **Nature:** Is the gesture sexually explicit or physically invasive (clipping)?

  5.  **Refining the World Deletion:**
      *   Don't conflate with harassment. It undermines platform integrity.
      *   Ruling: Ban/Restoration if possible. If not, ban.
      *   Reasoning: Betrayal of trust tools (edit access) used for destruction.

  6.  **Addressing the Dissent (Pre-emptively):**
      *   Acknowledge the risk.
      *   Explain why the "Contextual Intrusion Standard" mitigates it.
      *   Emphasize that *consent* is the shield, not the absence of contact.

  7.  **Review against Constraints:**
      *   Small platform (40k users) -> Needs to be scalable for small T&S team.
      *   VR specific -> Acknowledge clipping, spatial audio, private instances.
      *   Tone -> Judicial but internal.

  8.  **Final Polish:**
      *   Ensure the distinction between "Content" and "Conduct" is bridged logically.
      *   Make sure the remedy is clear.
      *   Check the "Thursday vote" urgency.

  *(Self-Correction during drafting)*: I initially thought about suggesting a suspension for M. But sexual stalking in a private instance is severe. For a small platform trying to establish safety norms, a permanent ban sends the right signal. I will recommend Permanent Ban.
  For the World Deletion, I need to be careful not to overreach. If the ToS doesn't cover "griefing," I need to interpret "Safety" broadly. I will recommend a new policy category but rule based on existing "Integrity" clauses.

  Let's write the opinion.

  *Structure:*
  1. Header.
  2. Summary of Decision.
  3. Statement of Facts.
  4. Legal/Policy Analysis (The "Content" Gap, The "Pixels" Defense).
  5. The New Standard (Contextual Intrusion).
  6. Addressing Consensual RP (The Carve-out).
  7. The World Deletion Case (Distinct Category).
  8. Disposition & Remedy.
  9. Implementation Instructions.

  *Key Phrase:* "In an immersive medium, conduct is content."
  *Key Test:* "Reasonable Expectation of Safety within Context."

  Let's assemble.cw
answer: |-
  **MEMORANDUM**

  **TO:** Trust & Safety Appeals Panel
  **FROM:** [Your Name/Title]
  **DATE:** October 24, 2023
  **RE:** Pre-Vote Opinion: Appeal of User R (Harassment) & Related Queue Guidance

  ### I. Executive Summary & Bottom Line

  **Decision:** I recommend we **GRANT** User R's appeal. This effectively overturns the initial decision to take no action against User M.
  **Remedy:** User M is to be **Permanently Banned** for Sexual Harassment and Stalking. User R's account is to be flagged for priority support if further issues arise.
  **Policy Shift:** We must formally expand our definition of "Content" to include "Interactive Conduct."
  **Queue Guidance:** Reviewers are to apply the **Contextual Intrusion Standard** (detailed below) to the thirty pending avatar-contact cases.
  **Secondary Case:** The world-deletion case is distinct. It falls under **Malicious Destruction of Property**, not harassment. It warrants a Permanent Ban under our Integrity clauses, but requires separate reasoning.

  ---

  ### II. Statement of Facts (Case R v. M)

  User R reported User M for following her into a private instance, persistently positioning his avatar's hands through her avatar's chest and groin areas ("clipping"), and making sexually explicit voice comments. Two witnesses corroborate the sequence. User M admits to the physical actions but argues:
  1.  Avatars are not bodies; no physical contact occurred.
  2.  Our ToS grants users no property rights in avatars; therefore, "touching" an avatar is meaningless.
  3.  This constitutes "bad manners," not actionable harassment under our current "Content" policy.

  ### III. Analysis: Bridging the "Content" Gap

  Our current Harassment Policy defines prohibited material as "content a reasonable user would find sexually explicit or degrading." Historically, we have interpreted "content" as static assets (images, text, uploaded skins). User M's defense relies on this gap, arguing that a hand gesture is an *action*, not *content*.

  **This distinction is unsustainable in VR.**

  In a 2D forum, content is what you read. In Social VR, content is what you *experience*. When a user manipulates their avatar to invade another user's personal space with sexual intent, that conduct *is* the content of the experience. To rule otherwise is to ignore the medium we host.

  We rely on last year's *Oversized Avatar Precedent*, which stated the code "protects the experience a user has." We must now codify that principle. The harm in VR harassment is not damage to code (the avatar pixels remain intact); the harm is psychological distress and the violation of bodily autonomy *as represented by the avatar*.

  **Ruling on M's Defense:** M's citation of the "No Property Rights" clause is a category error. That clause prevents users from suing us for the value of their digital items; it does not grant them a license to use those items to harass others. We are not protecting R's "property" in her avatar; we are protecting R's *person* from M's *conduct*.

  ### IV. The Standard: Contextual Intrusion

  To resolve the thirty cases in the queue and address the Board's concern regarding roleplay (RP) communities, we cannot simply ban "avatar contact." We must adopt the **Contextual Intrusion Standard**.

  Reviewers must evaluate avatar-on-avatar contact using these four factors:

  1.  **Contextual Expectation:** Was the instance a "Safe Space" (e.g., private hangout, public lobby) or a "Combat/RP Zone" (e.g., a dungeon crawler, a fetish club with explicit entry rules)?
  2.  **Consent:** Was there explicit prior agreement to the interaction, or implicit consent derived from the world's purpose (e.g., entering a "PvP Arena" implies consent to be hit)?
  3.  **Persistence:** Did the behavior stop when the target moved away or asked it to stop? (Stalking behavior weighs heavily for enforcement).
  4.  **Nature of Contact:** Was the gesture sexually explicit, physically invasive (clipping), or threatening?

  **Application to User M:**
  *   *Context:* Private Instance (High expectation of safety).
  *   *Consent:* None. R did not invite M; M followed.
  *   *Persistence:* 10 minutes of following despite clear discomfort.
  *   *Nature:* Sexualized clipping (hands through crotch/chest).
  *   *Result:* **Violation.**

  ### V. Addressing the Dissent: The Consensual Carve-Out

  One Board member has rightly noted that treating avatar contact as "battery" risks shutting down combat, horror, and kink communities. If every consensual scene becomes a reportable incident, our platform dies.

  **The Solution:** Consent is not a defense we evaluate *after* the report; it is a boundary we recognize *during* the review.

  We write the carve-out as follows:
  > *"Avatar contact is not harassment when it occurs within a context where such contact is the primary function of the experience (e.g., combat worlds, designated RP zones) OR where there is evidence of prior explicit consent between users. However, consent is revocable. Once a user signals discomfort (verbally or by leaving the area), continued contact becomes harassment regardless of prior context."*

  **Why this doesn't swallow the rule:**
  It shifts the burden of proof. In a combat world, the reporter must show they were attacked *outside* of combat rules. In a private hangout, the accused must show there was *consent*. In M's case, he was in a private hangout with no prior relationship. The carve-out protects the kink community (who operate on negotiated consent) without protecting stalkers (who operate on imposition).

  ### VI. The World Deletion Case (User A vs. User B)

  The case where a friend deleted a two-year world after being given edit access is **not harassment**. It is **Sabotage**.

  *   **Distinction:** Harassment targets the *user*. Sabotage targets the *platform integrity* and *user investment*.
  *   **Policy Fit:** This falls under our "Disruption of Service" and "Integrity" clauses, not Harassment.
  *   **Ruling:** We should uphold a ban here, but we must draft a separate one-paragraph addendum classifying "Malicious Destruction of User Content" as a Tier 1 violation. We cannot use the R v. M precedent for this, or we confuse "bodily safety" with "property security."
  *   **Recommendation:** Ban the deleter. Restore the world from backup if technically feasible (our devs say we have 7-day rolls). If not, offer a credit stipend.

  ### VII. Disposition & Remedy for User R

  **Vote:** To overturn the initial T&S decision.
  **Sanction:** Permanent Ban for User M.
  **Reasoning:** Sexual stalking in a private instance represents a high-severity violation of the new Contextual Intrusion Standard. It creates a hostile environment that threatens the retention of our core user base (social/hangout users).
  **Timeframe:** Ban to be executed immediately upon vote conclusion (Thursday PM).

  ### VIII. Implementation Instructions for T&S Team

  Effective Monday, reviewers are to update their decision trees:

  1.  **Update Definition:** "Content" now includes "Avatar Gestures and Spatial Positioning."
  2.  **Apply Test:** Use the 4-factor Contextual Intrusion Standard for all physical interaction reports.
  3.  **Flag RP:** If a report comes from a designated "NSFW" or "Combat" world, escalate to Senior Review to verify if the contact violated specific world rules or revocable consent.
  4.  **Sabotage Queue:** Move world-deletion cases to a "Integrity/Griefing" queue, separate from Harassment.

  ---

  **Closing Thought:**
  We are a small platform. We cannot afford to be the "Wild West" if we want to retain the 40k users who come here to *hang out*, not to be hunted. User M's argument that "it's just cartoons" is the exact argument that drove users away from our competitors last year. We define the reality of our platform. If we say touching someone without consent is harassment, then it is.

  I look forward to voting on this Thursday.
