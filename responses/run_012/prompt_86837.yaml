  # Conceptual Cartography: The Insect Welfare Wager

  Below is a decision tree mapping the logical space of responses to the argument that insect suffering may dominate moral calculations due to population size. The tree begins with the metaphysical status of sentience and terminates in twelve distinct positions. Following the tree, you will find a worked toy case and notes on unoccupied or indistinguishable regions of the map.

  ## The Decision Tree

  **Node 1: Ontological Status**
  *Do you treat the sentience of insects as a determinate binary fact about which we are merely ignorant, or as an indeterminate/normative matter?*
  *   **Determinate Binary Fact:** Go to Node 2.
  *   **Indeterminate/Normative:** Go to Node 9.

  **Node 2: Aggregation Rule (Binary Path)**
  *Given a binary fact, do you aggregate expected value linearly across the population, or do you apply a non-linear threshold or damping rule?*
  *   **Linear Expected Value:** Go to Node 3.
  *   **Threshold/Damped:** Go to Node 5.

  **Node 3: Valence Requirement (Linear Path)**
  *Does the argument for intervention require that insect lives be net negative on balance, or is total welfare (positive or negative) what counts?*
  *   **Requires Net Suffering:** Go to Node 4.
  *   **Welfare Neutral:** Go to Node 4.

  **Node 4: Stopping Rule (Linear Path)**
  *Do you accept that this reasoning extends to mites and nematodes, or do you posit a stopping rule at insects?*
  *   **Stop at Insects:** **Leaf 1 / Leaf 2**
  *   **Extend to Microfauna:** **Leaf 3 / Leaf 4**

  **Node 5: Action Priority (Threshold Path)**
  *If a non-zero probability triggers a precautionary duty, should we act on it immediately or prioritise acquiring information first?*
  *   **Act Now:** Go to Node 6.
  *   **Buy Information:** Go to Node 6.

  **Node 6: Stopping Rule (Threshold Path)**
  *Do you accept that this reasoning extends to mites and nematodes, or do you posit a stopping rule at insects?*
  *   **Stop at Insects:** **Leaf 5 / Leaf 6**
  *   **Extend to Microfauna:** **Leaf 7 / Leaf 8**

  **Node 9: Weighting Method (Non-Binary Path)**
  *If sentience is not binary, is moral weight proportional to cognitive capacity (graded), or is it a normative placeholder triggered by uncertainty?*
  *   **Graded Expectation:** Go to Node 10.
  *   **Normative Placeholder:** Go to Node 11.

  **Node 10: Unit of Accounting (Graded Path)**
  *Is the fundamental unit of moral concern moments of experience or whole lives (including future generations)?*
  *   **Moments of Experience:** **Leaf 9 / Leaf 10**
  *   **Whole Lives + Future:** **Leaf 11 / Leaf 12**

  **Node 11: Action Priority (Placeholder Path)**
  *Does the normative placeholder demand immediate intervention or further research?*
  *   **Act Now:** **Leaf 11** (Merged label for cartography)
  *   **Buy Information:** **Leaf 12** (Merged label for cartography)

  *(Note: Nodes 9–12 do not branch on the Stopping Rule to maintain the leaf count constraint; this limitation is flagged in the analysis below.)*

  ---

  ## The Twelve Leaves

  **Leaf 1: Linear Suffering-Focused Stopper**
  *   **Awkward Commitment:** You must defend a principled reason to count the suffering of a beetle but ignore the identical suffering of a nematode.

  **Leaf 2: Linear Suffering-Focused Extender**
  *   **Awkward Commitment:** You are committed to prioritising the prevention of microscopic suffering over almost all human projects, regardless of the cost.

  **Leaf 3: Linear Welfare-Neutral Stopper**
  *   **Awkward Commitment:** You must explain why net-positive insect lives do not demand resource allocation to create more of them.

  **Leaf 4: Linear Welfare-Neutral Extender**
  *   **Awkward Commitment:** You are committed to a form of moral totalitarianism where the sum of tiny experiences overrides the intensity of vertebrate lives.

  **Leaf 5: Precautionary Act-Now Stopper**
  *   **Awkward Commitment:** You act on a low-probability hypothesis while simultaneously asserting that slightly simpler organisms fall outside the moral circle.

  **Leaf 6: Precautionary Act-Now Extender**
  *   **Awkward Commitment:** You accept a 'black hole' of moral demand where all resources are consumed by the most numerous, simplest possible sentient entities.

  **Leaf 7: Precautionary Research Stopper**
  *   **Awkward Commitment:** You delay intervention to resolve uncertainty while acknowledging that the expected suffering during the delay is astronomical.

  **Leaf 8: Precautionary Research Extender**
  *   **Awkward Commitment:** You invest in researching the sentience of mites, implicitly granting them a moral status that may oblige you to never swat one.

  **Leaf 9: Graded Moment-Counter (Stopper)**
  *   **Awkward Commitment:** You must define a precise cognitive threshold where a moment of pain suddenly ceases to have any moral weight whatsoever.

  **Leaf 10: Graded Moment-Counter (Extender)**
  *   **Awkward Commitment:** You are committed to the view that a vast quantity of dim, simple pain outweighs a small quantity of intense, complex agony.

  **Leaf 11: Graded Life-Counter**
  *   **Awkward Commitment:** You value the narrative unity of an insect's life despite its likely lack of autobiographical memory or future planning.
      *(Note: This leaf aggregates 'Act' and 'Research' variants; the tree does not separate them.)*

  **Leaf 12: Normative Placeholder**
  *   **Awkward Commitment:** You grant moral status based on epistemic humility rather than ontology, risking moral inflation for any entity we cannot prove is insentient.
      *(Note: This leaf aggregates 'Stop' and 'Extend' variants; the tree does not separate them.)*

  ---

  ## Worked Toy Case: Linear vs. Threshold

  Consider a proposed agricultural intervention costing £1 million.

  *   **Parameters:**
      *   Population affected: $10^9$ (one billion) insects.
      *   Probability of sentience ($P$): $0.05$ (5%).
      *   Welfare impact per insect ($U$): $-10$ utility units (net suffering).
      *   Threshold for action ($T$): $P > 0.10$ (10%).

  *   **Linear Aggregation (Leaves 1–4):**
      *   Expected Utility = $P \times \text{Population} \times U$
      *   Calculation: $0.05 \times 1,000,000,000 \times -10 = -500,000,000$ units.
      *   **Verdict:** The expected disvalue is massive. The intervention is morally obligatory despite the low probability.

  *   **Threshold Aggregation (Leaves 5–8):**
      *   Check: Is $P > T$?
      *   Calculation: $0.05 \ngtr 0.10$.
      *   **Verdict:** The probability fails to cross the precautionary threshold. The expected disvalue is treated as zero for decision-making purposes. The intervention is not obligatory.

  *   **Divergence:** The Linear rule mandates spending the £1 million; the Threshold rule permits ignoring the insect welfare entirely.

  ---

  ## Cartographic Notes

  ### Indistinguishable Leaves
  The tree cannot separate **Action Priority** (Act vs. Research) from **Unit of Accounting** (Moments vs. Lives) within the Non-Binary branch (Leaves 11 and 12) without exceeding the twelve-leaf limit. Consequently, Leaf 11 represents both those who count lives and wish to act, and those who count lives and wish to research; the same applies to Leaf 12. Furthermore, Leaves 9–12 do not branch on the **Stopping Rule**, meaning each label conceals a 'Stopper' and an 'Extender' variant.

  ### Unoccupied Combinations
  *   **Linear Aggregation + Welfare Neutral + Stopper (Leaf 3):** This space is largely unoccupied. It is unattractive because if one counts total welfare linearly, there is no logical barrier to extending the calculation to nematodes unless one arbitrarily asserts nematodes have zero welfare, which contradicts the 'Linear' premise regarding insects.
  *   **Threshold Aggregation + Act Now + Extender (Leaf 6):** This combination is rarely defended as stable. It is incoherent to apply a precautionary threshold to avoid error, yet accept an extension to microbes that leads to moral paralysis (the 'black hole' objection), which defeats the purpose of actionable guidance.
  *   **Determinate Fact + Normative Placeholder:** This combination is incoherent. One cannot simultaneously hold that sentience is a determinate fact of the matter and that our moral obligation rests on a normative placeholder for uncertainty.

  ### Unexplored Regions
  The intersection of **Graded Expectation** and **Future Insects** (Leaf 11/12 variant) is under-explored. Most graded views focus on current cognitive capacity, but if moral weight scales with capacity, and capacity scales with evolutionary potential, the moral weight of future insect generations might dwarf the present, a calculation few are willing to perform.
