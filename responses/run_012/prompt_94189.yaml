      *   If you strictly accept (2) as a guide to action ("reason for suspicion"), you cannot believe (3) (volume = info) or (4) (rational disagreement).
      *   To save the workshop theme ("Epistemology of Markets"), the user *needs* (1), (3), (4), (5), (6), (7) to hold. These form a coherent (though complex) view of market epistemology (Hayek + Grossman-Stiglitz).
