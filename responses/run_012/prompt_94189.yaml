      *   *Cost:* You lose the "hard" rationalist shield against being on the wrong side of a trade. You admit that rational people *do* trade against you, and it doesn't necessarily mean you are being exploited; it might mean they have different priors or models.

  6.  **Drafting the Audit:**

      *   **Structure:**
