      *   *So is it a tension?* Yes, because (3) claims volume *is* information processing. If (2) holds, volume *cannot* be information processing (it must be liquidity/noise). (3) claims it *is*. This is the contradiction. The user accepts the theorem (2) but interprets the data (3) in a way the theorem forbids *unless* the theorem's assumptions are false. The user needs to explicitly state the assumptions of (2) are false in reality to make (3) true. Currently, (2) is stated as an acceptance of the result, not just the logic.
