  Ok so I'm in this decision theory reading group (we've been doing the old expected-utility papers and some of the Kahneman/Tversky stuff) and I keep getting into fights about the Allais thing, because everyone else says it just shows people are inconsistent and I'm like, well, maybe my preferences are just more complicated than a formula. But now I'm worried I cant even state my own principle, so I want help figuring out what I actually believe. Here are my gut calls, all with lottery prizes in millions of dollars. First: a sure million, versus an 89% chance of a million, a 10% chance of five million, and a 1% chance of nothing. I take the sure million, every time — I cant stand the idea of being the guy who turned down a guaranteed million and walked away with zero, even though its only a 1% chance. Second: an 11% chance of a million (89% chance of nothing) versus a 10% chance of five million (90% chance of nothing). Here I take the five-million shot; the 11-vs-10 difference feels like nothing, so I might as well swing for the big prize.

  And yeah, I know those two together are the "paradox," and the group says I should either take the gamble in the first one too or the safe option in the second. But it doesn't feel irrational to me, it feels like I care about something the formula doesn't. Scaling it down gets weirder: with a sure ten bucks versus (89% of ten, 10% of fifty, 1% of nothing) I actually take the gamble, because a guaranteed ten dollars doesn't move me and fifty is worth the tiny risk of nothing. So at a million I want the sure thing and at ten dollars I don't. I also tried flipping it to losses and I'm not even sure what I think: a sure loss of a million versus (89% chance of losing a million, 10% chance of losing five million, 1% chance of losing nothing) — I think I take the second, I'd rather gamble on escaping the loss entirely. And if I'm choosing for my sister instead of for me, I take the sure thing at every scale, because if it came up zero she'd never let me forget it and I'd feel like it was my fault.

  So is there actually a principle that gets all of this, or a small set of candidates? I keep telling the group there's something about regret, or about how a sure thing you passed up is different from a gamble you lost, but every version I write down either contradicts one of my calls or is so stuffed with special clauses it stops being a principle. And what does whatever you land on say about the case I genuinely can't settle — a sure $1,000 versus a 1-in-1000 chance of a million (999-in-1000 chance of nothing)? I don't know which way I go there and I'd like the principle to tell me. Please also say straight which of my verdicts I'd have to give up, if any, and which one you'd throw overboard first.
