prompt: |-
  hey — i'm in a seminar on Anscombe and the ethics of war right now, and our final project is a wierd one: no essay, we have to write a piece of satire that proves we actually understand the reading, and it has to connect to the Truman / atomic bomb material without just summarizing it. can you write it for me?

  you're a philosopher who knows Anscombe's work closely — the book on intention, Modern Moral Philosophy, the Truman stuff, all of it — so please actually think this through instead of reaching for the obvious "utilitarians are bad" joke. before you write anything, brainstorm for a sec the specific moves you want the piece to run on: the intention/foresight distinction, what counts as the object of an act, whether the harm is the means or merely a side effect, and her view that what you intended is fixed by your answer to "why did you do that?", not by how you happen to feel about it. then write the thing.

  the format i want: a deadpan advice column in a campus paper, Dear-Abby-style, except the columnist is a committed Anscombian and every letter is some completely mundane student problem. invent her name and the column's name. 700–800 words, 4–5 letters with her replies. the running joke should be that she's *harder* on people than the "but i didn't intend it!" excuse they're all fishing for — she keeps cheerfully granting that the bad thing was foreseen and not intended, and then still refuses to let them off, because the description under which you act isn't yours to rewrite. so please include: one letter where the harm really is the means (she has to say no), one where it's a genuine side effect (she has to say yes, annoyingly), and one where the reader tries to relabel what they did — "it wasn't lying, it was strategic framing" — and she takes the relabeling apart.

  she has to stay consistent the whole way through. don't let her slide into consequentialism halfway down the page, and don't let her collapse into a cartoon absolutist who says everything is forbidden either; she should read like a real position that a real person holds, not a strawman. at some point she should take a swing at the Truman case, since that's the whole reason we're doing this — the defence that the deaths were foreseen rather than intended, and why she thinks that doesn't work when the deaths are what's doing the work. and save the last letter for the one that stings: someone telling her she's just handed every war criminal in history a get-out-of-jail card. she has to answer that one without flinching and without contradicting herself.

  no citations, no reading list, and no quotes from real texts — she can paraphrase in her own words, but don't put invented quotes in Anscombe's mouth. it should read like an actual advice column, not a lecture; the humour has to come from getting the doctrine right, so that someone who's done the reading laughs and someone who hasn't still follows what's going on. thanks!!
