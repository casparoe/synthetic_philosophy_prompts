  **Dear Intention**
  *By Catharine*

  Welcome to this week's column. Remember: I am not here to judge your feelings, but to clarify what you are doing. Feelings are weather; intentions are architecture. Let's begin.

  **Dear Catharine,**
  I stole my roommate's laptop because I had a deadline. I didn't want to hurt him, but I needed to submit my essay. I felt terrible while typing. Does my remorse make the theft okay?
  *— Guilty Typer*

  **Dear Guilty,**
  No. You asked, "Why are you typing on that machine?" The answer was, "Because I stole it." The theft was the means by which you submitted the essay. Therefore, you intended the theft. Your feelings of remorse are irrelevant to the description of the act. You chose a forbidden thing as your tool. Remorse cleans the conscience, not the action. Do not steal.

  **Dear Catharine,**
  I practice cello at 7 AM. My neighbors hate it. I don't want them to suffer; I just want to play. The noise is unavoidable. Am I morally responsible for their insomnia?
  *— Morning Maestro*

  **Dear Maestro,**
  You intend to play music. The neighbors' anger is a foreseen side effect, not the means of your playing. You do not need their insomnia to make music. Therefore, you do not intend the harm. You are permitted to play, though charity suggests you might install soundproofing. Do not confuse what you cause with what you choose. The noise is a consequence, not a goal.

  **Dear Catharine,**
  I told my professor I was "unable to attend" because I was at a wedding. I wasn't sick, but I didn't want to lie. I call it "strategic framing." Is this dishonest?
  *— Semantic Player*

  **Dear Player,**
  You asserted a falsehood to induce belief. Calling it "strategic framing" is an attempt to relabel the object of your act. If you know you are able to attend and say you are unable, you are lying. The description under which you act is fixed by the truth, not by your PR department. You cannot wish away the lie by renaming it. The act is what it is.

  **Dear Catharine,**
  Your column is dangerous. If I can say I didn't intend the bad stuff, just the good result, haven't you handed every war criminal in history a get-out-of-jail card? What about the President who dropped the atomic bomb? He didn't "want" death, just victory.
  *— Concerned Citizen*

  **Dear Concerned,**
  You have misunderstood the distinction. It is not a loophole; it is a trap for the wicked. If victory *requires* the destruction of civilians to force surrender, then that destruction is the means. You intend the means. The President intended the deaths because the deaths were the method of the ending. My view does not excuse him; it convicts him. Consequentialism allows any horror for a 'greater good.' I say if you choose horror as your tool, you own it. The loophole is claiming results matter more than what you did. I claim what you do is what you are.

  *Submit queries to box 404. Do not ask about feelings.*
