answer: |-
  The short answer is that philosophers call this a **verbal dispute** over a **cluster concept**.

  But that label alone is too thin. To get at what's frustrating you—the endless tinkering, the agreement on facts but disagreement on verdicts, and the specific "bolt-on clause" maneuver—you need three specific ideas that fit together like gears.

  Here is the breakdown of what is happening, why it isn't just "vagueness," and when the clause-bolting is actually legitimate.

  ### 1. The Core Error: Treating a Cluster Concept like a Natural Kind
  The reason these arguments feel endless is that both sides are making a category mistake about what the word "life" refers to.

  *   **Natural Kind:** This is a category that exists in nature regardless of what humans think. "Gold" is a natural kind. Something is gold if it has atomic number 79. There is no borderline case. If you find a metal that looks like gold but is atomic number 78, it isn't gold. The definition is discovered, not decided.
  *   **Cluster Concept (or Family Resemblance):** This is a category created by humans to group things that share overlapping traits, but no single trait is shared by *all* members. The classic example is "games." Some have balls, some have winners, some have teams, some are solo. There is no single "essence" of a game.

  **The Diagnosis:** When pop-science articles ask "Is a virus alive?", they are treating "Life" as a **Natural Kind**. They assume there is a hidden "spark" or essential property (like atomic number 79) that we just haven't identified yet.

  In reality, "Life" is a **Cluster Concept**. Things have varying degrees of "aliveness" (metabolism, reproduction, homeostasis, evolution). A virus has some of these; a mule has most; a bacterium has all.

  **Why this causes the argument:** Because the participants assume "Life" is a Natural Kind, they believe there *must* be a Yes/No answer. Since the facts don't yield a Yes/No answer (because the concept is a cluster), they try to force one by tweaking the definition until it spits out the verdict their intuition wants.

  ### 2. Why it's not just "Vagueness": Open Texture
  You asked if this is the same as a word being vague because we don't know enough yet. In philosophy of language, there is a crucial distinction here between **Vagueness** and **Open Texture**.

  *   **Vagueness (Sorites Paradox):** This is when we know the relevant dimensions but not the cutoff. "Is a man with 1,000 hairs bald?" We agree on what hair is; we just don't know the number. This *could* theoretically be solved by stipulation (e.g., "Legally, bald is <500 hairs").
  *   **Open Texture (Friedrich Waismann):** This is when we cannot anticipate *all possible future dimensions* of the concept. When we invented the word "life," we didn't know about viruses, prions, or digital AI.

  **The Fit:** The virus argument is **Open Texture**. It's not that we don't know where to draw the line on a known map; it's that the territory keeps changing shape. Every time we patch the definition (e.g., "must reproduce"), biology produces a counter-example (e.g., mules).

  This is why "bolting on a clause" feels like a dodge. It's an **ad hoc rescue** of a definition that is fundamentally mismatched to reality. You are trying to draw a binary boundary (Alive/Not Alive) on a continuum (Degrees of Complexity).

  ### 3. The "Bolt-On Clause": Historical Essentialism
  You noticed that the new clauses are almost always about *origin* ("came from living parents") rather than *current function*. This has a name: **Etiological Essentialism** (or Historical Essentialism).

  When functional definitions fail (because the virus doesn't metabolize *now*), people retreat to a historical definition (it evolved from something that *did*).

  *   **Why they do it:** It preserves the intuition that "Life" is a sacred, distinct substance. If a virus is just chemistry, it's mundane. If it's "degenerate life from a living ancestor," it retains a connection to the "Tree of Life."
  *   **Why it fails:** It pushes the problem back one step without solving it. If a virus is alive because it came from living parents, were *those* parents alive? Eventually, you hit abiogenesis (non-life becoming life). At that exact moment of transition, the historical clause breaks down.

  ### So, is "bolting on a clause" ever the right move?
  Yes, but only if you admit you are doing **Pragmatic Stipulation** rather than **Ontological Discovery**.

  *   **Ontological Discovery (Wrong here):** Trying to find out what the universe *really* is. "Is the virus *truly* alive?" This is a bad question because "alive" isn't a fundamental property of the universe like "mass" or "charge."
  *   **Pragmatic Stipulation (Right here):** Deciding how to *use* the word for a specific purpose.
      *   **In Medicine:** We *need* to decide if a virus is "alive" to determine if antibiotics work on it. We stipulate: "For the purpose of prescription, viruses are not alive."
      *   **In Law:** We *need* to decide when a person is "dead" to harvest organs. We stipulate: "Brain stem cessation counts as death," even if the heart still beats.

  In these cases, bolting on a clause isn't a dodge; it's a **policy decision**. The frustration in pop-science arguments arises because the authors present these policy decisions as if they were scientific discoveries. They say, "Scientists debate if viruses are alive," when they should say, "Scientists debate which definition of life is most useful for taxonomy."

  ### Summary of Terms
  If you want to search for more on this, these are the precise terms that fit your description:

  1.  **Cluster Concept / Family Resemblance:** (Wittgenstein) The idea that "life" has no single defining essence, but overlapping traits. This explains why the checklist never works.
  2.  **Verbal Dispute:** (Chalmers) An argument where both sides agree on the physical facts but disagree on how to apply a label. This explains why the facts don't settle the verdict.
  3.  **Open Texture:** (Waismann) Vagueness that cannot be eliminated because future cases are unforeseeable. This explains why the definition never stays settled.
  4.  **Natural Kind vs. Social Kind:** The error of treating a human category ("life") as if it were a physical constant ("gold").

  **The Verdict:** You aren't missing a fact. You are witnessing a **category error**. The participants are arguing over the boundaries of a map while pretending they are arguing over the shape of the continent. The "bolting on" is an attempt to force a binary map onto a non-binary terrain. It stops being a dodge only when they admit they are drawing the line for *utility*, not for *truth*.
