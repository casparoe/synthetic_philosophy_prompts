    "question": "Written Round: The Lighthouse vs. Truth Watch (20 Minutes, 400 Words Max)\n\nCase Study:\n\u2018The Lighthouse\u2019 is a private online forum for 200 people with a rare medical condition. They rely entirely on three specific blogs and one Facebook group for advice. They rarely encounter mainstream medical advice. When a doctor does post in the forum, members are polite, read the post, but then return to trusting the blogs. None of them have ever investigated how the blogs verify their claims. Twist: It turns out the Lighthouse members are medically correct; the mainstream doctors were outdated.\n\n\u2018Truth Watch\u2019 is a political group that actively hunts down people who disagree with them. They publicly \u2018dunk\u2019 on outsiders, label them \u2018shills,\u2019 and convince their own members that no outsider can be trusted. They are exposed to opposing views but reject them systematically.\n\nQuestion:\n1. Identify which group is an epistemic bubble and which is an echo chamber. Justify your classification using specific details from the case.\n2. Is \u2018The Lighthouse\u2019 doing anything epistemically wrong, even though their beliefs are true? Explain whether being right is enough to make a belief justified.",
    "model_answer": "The Lighthouse is an epistemic bubble, while Truth Watch is an echo chamber. The distinction lies in how each group handles opposing information. An epistemic bubble is defined by omission; you simply haven\u2019t heard the other side. The Lighthouse members \u201crarely encounter mainstream medical advice.\u201d When they do see a doctor\u2019s post, they are \u201cpolite\u201d and read it. They aren\u2019t actively destroying the doctor\u2019s credibility; they are just neglecting to verify their own sources (\u201cnone of them has ever investigated how the blogs verify their claims\u201d). They are isolated by structure, not by hostility.\n\nTruth Watch fits the echo chamber because they actively discredit outsiders. They don\u2019t just ignore dissent; they \u201hunt down\u201d disagreeing voices and label them \u2018shills.\u2019 This creates a system where exposure to outside evidence actually reinforces their existing beliefs because the source is pre-emptively tainted. They hear the other side but have been trained to reject it.\n\nRegarding the second question: Yes, The Lighthouse is still doing something epistemically wrong, even though they are factually correct. Epistemology cares about justification, not just truth. If you believe something true only because you got lucky, your belief isn\u2019t knowledge; it\u2019s accidental. The Lighthouse members believe the blogs without checking how the blogs know what they know. Their belief is fragile. If the blogs had been wrong, the members had no method to correct themselves because they weren\u2019t checking sources, they were just trusting. \n\nBeing right is not enough to make a belief justified. A broken clock is right twice a day, but it isn\u2019t a reliable timekeeper. Similarly, The Lighthouse has epistemic luck, not epistemic virtue. They lack the tools to distinguish truth from falsehood in the future. Therefore, they are epistemically vulnerable. The process matters as much as 