      4. Evidence for Chamber (active discrediting/shilling) (2)
      5. Argument on Epistemic Wrongness (Truth vs Justification) (2)
      *Wait, that's 10.*
      *Common mistakes need to match these points.*

      *Model Answer Length:* 400 words is a good target for a 20-min plan/write for sharp kids.

