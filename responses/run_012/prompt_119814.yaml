          *   *User Scenario:* User works hard, but section is *cut*. Contribution to final = 0.
          *   *Prediction:* If this is the rule, User gets a bad grade (like Dev).

      *   *Hypothesis 4: Agency/Ownership/Problem Solving (The "Rosa" Factor).*
          *   Rosa got an A on a *messy* project. Why? "Done everything she could." This implies she took ownership of the *outcome*, not just her task. She adapted to a crisis.
          *   Dev did a task (presentation) but didn't own the *work* ("did basically nothing").
          *   Bianca did her task early. It ended up in the project. She gets credit.
          *   *Nuance:* The teacher says "Grade work, not effort." Rosa's rewrite looks like effort, but it resulted in *usable work* for the final, even if the project was messy overall.
          *   *User Scenario:* User produces work, but it is discarded. Is it "work" if it's not in the final?

      *   *Hypothesis 5: The "Peer Eval + Teacher Observation" Hybrid.*
          *   Dev got a C. Peer eval likely tanked him.
          *   Rosa got an A. Peer eval likely loved her (she saved them).
          *   Bianca got an A. Peer eval likely fine with it (she did her part early).
          *   *User Scenario:* If the group votes to switch topics, they might rate the user low on peer evals for not adapting, OR they might rate them high for the early work. But if the work isn't there, the teacher can't see it.

  3.  **Synthesizing the "Actual Rule":**

      *   *The Contradiction:* "Grade work, not effort" vs. Rosa (High effort, low quality product).
      *   *The Resolution:* Ms. Petrova defines "Work" as **"Visible, Usable Contribution to the Final Submission."**
      *   *Why Rosa got an A:* Her effort *became* the final submission. She rewrote the mess. Her effort translated directly into the tangible product submitted.
      *   *Why Dev got a C:* He presented, but the teacher knew (via peer eval or observation) he didn't generate the *content*. Presentation is delivery, not "work" in the academic sense of research/writing/creation.
