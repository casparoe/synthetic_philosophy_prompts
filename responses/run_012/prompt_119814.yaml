      *   *Test Case Design:* Needs to isolate "Work done but not submitted."
      *   *Question:* "Ms. Petrova, if we do a bunch of research that ends up being irrelevant to our final thesis, should we throw it away or include it in an appendix so you can see the scope of our research?"
