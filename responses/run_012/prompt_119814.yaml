          *   In Project + Early = A (Bianca)
      *   Missing Case: **Not In Project + High Effort.**
      *   How to ask without revealing the plan?
      *   Ask about "Drafts" or "Appendices."
      *   *Question:* "If we do a lot of research that doesn't make the final cut, can we include an appendix or bibliography to show that labor?"
