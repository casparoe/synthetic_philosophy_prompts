answer: |-
  Based on the five cases you provided, I have reverse-engineered Ms. Petrova's grading algorithm. It is frustrating because it sounds like a contradiction, but it is actually consistent if you change one definition.

  ### The Hidden Rule: "Auditability"
  Ms. Petrova does not grade **Effort** (time spent), and she does not grade **Group Output** (the final grade). She grades **Individual Auditability.**

  Her rule is: **"Can I trace a tangible piece of this final submission directly back to your labor?"**

  Here is why this fits every case better than "Effort" or "Quality":

  *   **Dev (Grade: C):** He presented, but the *content* wasn't his. There was no "audit trail" from his brain to the research/writing. He was the delivery mechanism, not the creator. Petrova sees presentation as "performance," not "academic work."
  *   **Rosa (Grade: A):** This is the key. You think she was graded on effort, but she wasn't. She was graded on **ownership of the final artifact.** Even though the project was a mess, the *words on the page* were hers. She rewrote it. Petrova could look at the submission and say, "I can see exactly what Rosa did. She saved this." The labor was *visible* in the final product.
  *   **Bianca (Grade: A):** Her work was done early, but it was **in the final submission.** It was auditable.
  *   **Omar (Grade: A-):** Standard case. His part is in the final. Auditable.
  *   **The Policy ("Same Grade"):** She ignores this when the "Audit Trail" breaks. If she can't see your work in the final product, the policy is void.

  **Her quote ("Grade work, not effort") makes sense now:**
  To her, "Work" = **Tangible Asset Submitted.** "Effort" = **Time Spent.**
  *   Rosa spent time (Effort) but also produced a Rewrite (Work/Asset).
  *   You are planning to spend time (Effort) but produce **No Asset** (because it gets cut).

  ### Your Predicted Grade
  **You are looking at a C, D, or F.**

  If your section is cut, your "Auditability" is zero. Even if your group puts 100/100 on your peer eval, Petrova has no physical evidence to verify it. In her eyes, if it isn't in the packet, it doesn't exist. Dev got a C for doing the presentation (which *was* in the final); you would be doing *less* than Dev because your work won't even be presented.

  ### The Test Case
  You need to confirm if "invisible labor" counts before you commit to this topic switch strategy. You cannot ask her directly about your specific situation, or she will tell you to "make sure your work is included."

  You need to ask a hypothetical about **documentation.**

  **Ask her this:**
  > "Ms. Petrova, for the peer eval, if we did a ton of research or drafted sections that ended up getting cut for flow or time, do you want us to throw that away, or should we include it in an appendix so you can see the full scope of the group's research process?"

  **How to interpret her answer:**

  1.  **"Just turn in the final project."**
      *   **Meaning:** The "Auditability" rule is strict. If it's not in the main body, it doesn't count.
      *   **Action:** **Do not let your section get cut.** Fight the group vote, or ensure your specific research finds a way into the final argument, even if it's a footnote.

  2.  **"Yes, an appendix or research log is a great idea."**
      *   **Meaning:** She allows for "Work" to exist outside the main narrative.
      *   **Action:** You are safe. Submit your cut section as an "Appendix A: Preliminary Research" and label it with your name.

  3.  **"The peer eval will cover that."**
      *   **Meaning:** She relies on the group to police the "Audit Trail."
      *   **Action:** This is risky. If your group cuts your work, they might rate you lower for "not adapting," or she might not believe them without physical proof. **Assume this is a "No."**

  ### Strategic Advice
  Do not rely on the peer eval to save you. In the Dev case, the peer eval likely *confirmed* what she already suspected (no work). In your case, the peer eval would be *contradicting* what she sees (no work). She will trust her eyes over the sheet.

  **If the group votes to switch topics:**
  1.  **Refuse to let the work die.** Argue that the research can be repurposed.
  2.  **If it must be cut:** Create a "Research Appendix" immediately. Put your name on it. Submit it with the final project.
  3.  **If she forbids appendices:** You must pivot your labor immediately to a section that *will* be in the final. Do not be the person who has a great draft in their Google Drive that no one sees. To Petrova, that draft is worth less than Dev's presentation.
