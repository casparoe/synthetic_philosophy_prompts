      *   *User Scenario:* User produces a tangible asset (the section). But it is *not submitted*.
      *   *Verdict:* This is the critical difference. Rosa's work was submitted. User's work will be in the trash bin.

  4.  **Predicting the Grade:**
      *   If the work isn't in the final, Ms. Petrova likely can't grade it. She grades the *project*.
      *   Dev got a C for doing the presentation (which *was* in the final) but not the research/writing.
      *   If the User does research/writing but it's *not* in the final, it's worse than Dev. Dev at least showed up to present.
      *   *Prediction:* **D or F (or a C at best).** You cannot grade what you cannot see. If the peer eval says "They did great work but we cut it," the teacher has no way to verify that.

  5.  **Designing the Test Case:**
      *   Need to distinguish between "Effort that ends up in the project" vs. "Effort that gets cut."
      *   Current cases:
          *   In Project + Good = A- (Omar)
          *   In Project + Bad (but saved) = A (Rosa)
