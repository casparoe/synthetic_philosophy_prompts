prompt: |-
  ok so my history teacher Ms. Petrova grades group projects in a way that makes no sense to me, and we're starting a new one next month, so I want to figure out her actual rule before I find out the hard way.

  Everything I've got from the last two years:

  - Dev's group turned in a genuinely great final project and Dev did basically nothing. She gave him a C and told him you don't get credit for work you didn't do. He was also the one who did the whole presentation, so it's not like she just rewards whoever talks.
  - Rosa's group completely misread the assignment and their project was a mess, but Rosa had rewritten the entire thing overnight trying to save it, and Ms. Petrova gave her an A and said she'd done everything she could.
  - The assignment sheet literally says all members get the same grade on the final product, and she told us she'd follow it. She didn't for Dev.
  - Bianca was sick for the last week and a half and missed all the final prep, but she'd done her chunk early, so she got full credit.
  - Omar did a normal, solid, unspectacular part and got an A-.

  (We also have to fill out one of those peer eval sheets where you split 100 points between the group, and I honestly dont know if that even counts for anything.)

  She always says she grades the work and not the effort, which doesnt fit Rosa as far as I can tell, but who knows.

  The thing driving me crazy is that in every one of those cases, how hard the person tried and how much they actually ended up putting into the final product went together. So there's more than one rule that would spit out the same answers on all five cases and I can't tell which one she's running.

  Here's my problem. Next month my group is probably going to vote to switch topics halfway through, and if that happens my whole section gets cut even though I'll of worked on it all weekend. So my effort will be huge and my contribution to the final thing will be zero.

  What grade am I getting? Which rule do you think she's really running, and what makes you pick it over the others that fit? And if you could design one more case for me to ask her about that would rule out the leftover options, what would it be?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Problem:**
