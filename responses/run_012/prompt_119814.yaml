  6.  **Refining the Advice:**
      *   **The Rule:** "Visible, Verifiable Contribution." It's not effort, it's *artifacts*. Rosa's effort created an artifact. Dev's lack of effort meant no artifact. Bianca's early work was an artifact.
      *   **The Prediction:** You are in the danger zone. If it's not in the final, it likely doesn't count.
      *   **The Strategy:** Don't let the section get cut. Or, ensure the "cut" section is visible (appendix, bibliography, "research log").
