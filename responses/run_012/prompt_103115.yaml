      *   *Claim 5 (The Informational/Signaling View):* Expanding the action space can reveal private information that lowers expected utility.

  4.  **Refining the Verdicts & Conditions:**

      *   *Claim 1:* True by construction. Condition: Rational agent, no cost to holding the option, no observation by others.
