      *   *Case 2: Game Theory (Strategic Interaction).* If I have an extra move, does my opponent react? In Hex (strategy stealing), the extra move is a "pass" or a "free stone." The argument relies on symmetry and the fact that having an extra stone on the board is never a disadvantage *in that specific game*.
      *   *Case 3: Commitment/Signaling.* Burning bridges. Here, removing an option is good. So adding an option (keeping the bridge) might be bad. This contradicts the maxim.
      *   *Case 4: Costly Signaling/Information.* If having an option signals weakness or changes beliefs, it might hurt.
      *   *Case 5: Cognitive Load/Regret.* Psychology. Too many choices cause paralysis. (Probably outside the scope of the logical/mathematical intent, but worth noting as a "false" interpretation).
      *   *The "Strategy-Stealing" Specific:* In Hex, the argument is: P1 makes a random move, then pretends to be P2 using P2's winning strategy. If the strategy calls for playing on the random move spot, P1 plays elsewhere. This relies on the property that *having an extra piece on the board is never a disadvantage* (monotonicity).

