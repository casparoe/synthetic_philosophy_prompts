      *   *Correction on Strategy Stealing:* It's not just that you *can* pass. It's that having an extra piece on the board is never bad. In Hex, pieces are permanent and only help connectivity. In Chess, pieces can block. So the "extra option" in Hex is really "extra resource."
      *   *Correction on "Free Pass":* A free pass in Chess is actually bad in Zugzwang. So the maxim fails there.
      *   *Correction on Negotiation:* Having a BATNA (Best Alternative to Negotiated Agreement) is generally good (Claim 1), *unless* revealing it changes the opponent's behavior negatively.
      *   *Refining the "Option" definition:* The prompt asks about "ignore vs. observe vs. obliged." I need to make sure the claims distinguish these.
