  This is a bold and tightly constrained metaphysical package. You have effectively constructed a "Hard Presentist" view that attempts to resist the standard softening moves (like ersatzism or denying truthmaker maximalism). Because your constraints are so strict, you have created a system with high internal friction.

  Here is the discrimination you requested: which commitments pull against one another, ranked by severity, along with the repairs and the final verdict on which commitment to drop.

  ### 1. The Genuine Tensions (Ranked by Severity)

  **Severity 1: The Truthmaker Trilemma (Commitments 1, 2, 3, & 6)**
  *   **The Conflict:** This is a logical inconsistency, not just a tension.
      *   **Presentism (1)** says only present things exist (Caesar does not).
      *   **Cross-Temporal Relations (6)** says "I admire Caesar" is true.
      *   **Truthmaker Maximalism (2)** says this truth requires an existing entity to make it true.
      *   **No Abstracta (3)** says you cannot use abstract propositions, ersatz times, or non-present properties to do the work.
      *   **Result:** You have a truth ("I admire Caesar") that requires a truthmaker, but you have banned every possible candidate for the job. Caesar doesn't exist (1), abstracta don't exist (3), and you refuse brute truths (2). There is literally nothing left in your ontology to ground the truth.
  *   **Why it's critical:** This renders the view logically incoherent as stated. You cannot hold all four simultaneously.

  **Severity 2: The Relativity Clash (Commitments 1 & 5)**
  *   **The Conflict:** This is a theoretical and empirical tension, not a logical contradiction.
      *   **Special Relativity (5)** implies there is no frame-independent fact about simultaneity.
      *   **Presentism (1)** requires a global, absolute "now" to define what exists.
      *   **Result:** You are adopting a Neo-Lorentzian interpretation of physics. You are positing a metaphysical fact (the absolute present) that is empirically undetectable and structurally superfluous to the physics you accept as "approximately true."
  *   **Why it's secondary:** It is metaphysically possible to posit a hidden absolute simultaneity frame consistent with SR mathematics (Lorentzian Ether Theory). It costs you parsimony and alignment with the standard interpretation of physics, but it doesn't break logic.

  **Severity 3: Real Change vs. Truthmaking (Commitments 2 & 4)**
  *   **The Conflict:** This is derivative of Severity 1.
      *   **Real Change (4)** says an object literally has a property and then lacks it.
      *   **Truthmaker Maximalism (2)** asks: What makes it true that the object *changed*?
      *   **Result:** To ground the truth of past change, you need truthmakers for past-tense propositions. This collapses back into the Truthmaker Trilemma (Severity 1). If you solve Severity 1, this tension largely dissolves.

  ### 2. Repairs and Costs for the Truthmaker Trilemma

  To fix the logical inconsistency (Severity 1), you must relax one of the four conflicting commitments. Here are the cheapest repairs for each option:

  *   **Option A: Drop Truthmaker Maximalism (2)**
      *   **Repair:** Allow that some past-tense truths are "brute" or grounded in the present world's totality without a specific singular truthmaker.
      *   **Cost:** You violate your "no patience for brute truths" constraint. You lose a powerful methodological tool for metaphysical explanation.
      *   **Benefit:** Saves Presentism, No Abstracta, and Cross-Temporal Relations.

  *   **Option B: Drop No Abstracta (3)**
      *   **Repair:** Adopt "Ersatz Presentism." Use abstract propositions or abstract times to serve as truthmakers for past truths.
      *   **Cost:** You violate your ontological parsimony. You must accept abstract entities you explicitly said you wouldn't buy.
      *   **Benefit:** Saves Presentism, Truthmaker Maximalism, and Cross-Temporal Relations.

  *   **Option C: Drop Cross-Temporal Relations (6)**
      *   **Repair:** Paraphrase away the relations. "I admire Caesar" becomes "I now have an admiration-state directed at the concept of Caesar."
      *   **Cost:** Linguistic revisionism. You deny the literal truth of obvious statements.
      *   **Benefit:** Saves Presentism, Truthmaker Maximalism, and No Abstracta.

  *   **Option D: Drop Presentism (1)**
      *   **Repair:** Adopt Eternalism (Block Universe). Past entities exist concretely.
      *   **Cost:** You abandon the core of your view of time. You likely have to adjust Real Change (4) to accommodate temporal parts or time-indexed properties.
      *   **Benefit:** Solves the Truthmaker Trilemma *and* the Relativity Clash (Severity 2) simultaneously.

  ### 3. The Verdict: Which Commitment Must Go?

  If exactly one commitment has to go, the cheapest exit is to drop **(2) Truthmaker Maximalism**.

  **Why this is the cheapest exit:**
  1.  **Preserves the Core Project:** You are assembling a "view of time." Presentism (1) is the ontological heart of that view. Dropping Presentism abandons the project entirely. Dropping Truthmaker Maximalism merely adjusts the methodological rules used to defend it.
  2.  **Methodological vs. Ontological Cost:** Truthmaker Maximalism is a heuristic principle, not an empirical fact or an intuitive datum. It is theoretically cheaper to admit that the truthmaker principle has exceptions (specifically for negative existentials and past-tense truths) than it is to populate your ontology with abstracta (violating 3) or deny the reality of your admiration for Caesar (violating 6).
  3.  **Precedent:** This is the standard "Presentist Escape Hatch" in contemporary metaphysics (championed by philosophers like Trenton Merricks). It allows you to maintain a robust concrete ontology without inventing shadowy abstract entities.

  **The Caveat:**
  Dropping (2) solves the logical contradiction, but it leaves the **Relativity Clash (Severity 2)** intact. You will remain a Neo-Lorentzian, positing an undetectable absolute present. However, this is a survivable theoretical cost. If you were to drop Presentism (1) instead, you would solve *both* the Truthmaker and Relativity problems, but you would cease to be a Presentist. Since your goal is to assemble *your* view (which is clearly Presentist), sacrificing the methodological constraint (2) is the most efficient way to keep the view alive.

  **Recommendation:** Keep (1), (3), (4), (5), and (6). Modify (2) to **Truthmaker *Non*-Maximalism**, specifically exempting fundamental past-tense truths from the requirement of having present existing truthmakers.
