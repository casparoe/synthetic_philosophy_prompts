  *   **Prediction:** 'Alive' is biologically vague $\rightarrow$ Not Real. 'Frictionless Surface' is mathematically precise ($\mu = 0$) $\rightarrow$ **Real**.

  ### 3. The Strategic Question

  If you only get one question, you must ask about **'is a frictionless surface'**.

  *   **Why:** Both rules predict 'Not Real' for 'is alive' (biology is too messy for either the Fundamentalist or the Precisionist). Asking about 'alive' yields no information.
