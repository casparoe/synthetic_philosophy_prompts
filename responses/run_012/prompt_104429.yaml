  ### 2. The Rules

  **The Likely Rule: Fundamental Microphysicalism**
  *   **Formulation:** A predicate is "real" (latches onto the world) if and only if it corresponds to a **fundamental physical entity/property** (the "bottom level" of physics) or a **formal mathematical truth**. All macroscopic, functional, social, or composite kinds are deemed useful "filing systems" but not ontologically fundamental.
  *   **Fit:**
      *   *Electrons/Charge:* Fundamental physics. (Real)
      *   *Prime:* Formal math. (Real)
      *   *Tiger/Red/Chair/Dollar:* Macroscopic, functional, or social composites. (Not Real)
      *   *Hole/Heap/Grue:* Negations, vague, or disjunctive. (Not Real)
  *   **Prediction:** 'Alive' is biological (composite) $\rightarrow$ Not Real. 'Frictionless Surface' is a physical idealization (not fundamental) $\rightarrow$ Not Real.

