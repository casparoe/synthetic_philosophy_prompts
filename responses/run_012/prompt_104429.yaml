      *   **Fundamental Microphysicalism says: Not Real.** A center of mass is a derived, relational property of a composite system. It is not in the fundamental inventory of particles/fields. It is a "filing system" for tracking complex objects.
      *   **Formal Precision Realism says: Real.** It is mathematically precise, sharp, and non-vague. It is defined exactly by an integral over the mass distribution.
  *   **Reasoning:** This cuts through the "idealization" noise. A center of mass exists for *actual* objects (unlike a frictionless surface), but it is not a *fundamental* particle. If she calls it real, she cares about **mathematical structure**. If she calls it unreal, she cares about **ontological base**.

  ### Summary of Strategy
  1.  **Bet** that she will reject both 'alive' and 'frictionless surface'.
  2.  **Ask** specifically about 'is a frictionless surface' to test the Precision vs. Fundamentality distinction.
  3.  **Prepare** 'is a center of mass' as the tie-breaker if she treats frictionless surfaces as a special category of "model-dependent" predicates.

  Her rejection of 'tiger' is the key constraint: she has set the bar for "reality" exceptionally high. Do not try to argue for the reality of macroscopic kinds; instead, show her you understand *why* she excludes them, and then probe the boundary of that exclusion.
