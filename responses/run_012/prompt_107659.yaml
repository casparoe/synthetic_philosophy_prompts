  **Collection Number:** MS-2023-14
  **Title:** Records of the Metropolitan Civic Planning League, 1948-1975
  **Extent:** 14.5 linear feet (excluding 3 linear feet disposed of during appraisal)
  **Repository:** Regional Historical Depository

  **Biographical/Historical Note:**
  The Metropolitan Civic Planning League (MCPL) was established in 1948 to coordinate urban renewal initiatives between municipal authorities and private stakeholders. The organization operated through an executive committee composed of property owners and business leaders. In 1952, a Women's Auxiliary was formed to manage hospitality and fundraising functions. The MCPL dissolved in 1975 following the completion of the downtown redevelopment zone.

  **Scope and Content Note:**
  The collection documents the administrative activities of the MCPL executive committee. Materials include correspondence, meeting minutes, zoning maps, and financial ledgers. The records reflect the organization's strategic planning and public-facing communications. Significant gaps exist regarding operational disputes and non-executive membership activities, as these functions were not prioritized during records scheduling.

  **Series Arrangement:**
  *   **Series I: Executive Administration, 1948-1975.** Minutes and correspondence.
  *   **Series II: Labor Relations, 1950-1960.** Files appraised as not warranting permanent retention; disposed of prior to accessioning.
  *   **Series III: Oral History Project, 1970.** Audio recordings exist; interviews were never transcribed because the narrators declined to sign the release forms. Materials are unavailable for use.
  *   **Series IV: Women's Auxiliary, 1952-1975.** Consists exclusively of treasurer's receipts. Programmatic records were not transferred.
  *   **Series V: Restricted Materials, 1955-1965.** Closed pending donor review.
  *   **Series VI: Miscellaneous.** Contains one folder catalogued as "Miscellaneous — see processing note."

  **Access and Reproduction Conditions:**
  Collection is open for research with the exception of Series III and Series V. Series V remains closed indefinitely pending donor review. The repository assumes no liability for copyright clearance. Reproductions of Series IV are limited to ledger excerpts.

  **Processing Note:**
  Processed by Archives Staff, 2023. Enclosures were removed. During appraisal, labor relations files were identified as duplicative of municipal records and deemed not warranting permanent retention. Box 12, Folder 4 (Series VI) is labeled "Miscellaneous — see processing note." Content remains undetermined as the folder was sealed upon transfer and no item-level inventory was provided. Digital migration of Series III audio was deprioritized due to access restrictions.

  **Preferred Citation:**
  Records of the Metropolitan Civic Planning League, MS-2023-14, Regional Historical Depository.
