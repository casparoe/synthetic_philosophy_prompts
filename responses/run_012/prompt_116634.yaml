answer: |-
  Thank you, Mum, for hosting us all. It's really lovely to be together. And mostly, today is about celebrating Erin. She's worked hard, she's nervous, she's excited, and we are incredibly proud of her.

  But because this is family, and because some of you know how much I've talked about this sort of thing over the years, I want to say a little bit about the choice we made. I've signed petitions against this system. I've written letters complaining about the very process we just navigated. So standing here now, having paid for tutors and accepted a place, feels complicated. I don't want to pretend it isn't.

  There's a truth about choices like this that's easy to ignore. When we choose a school, we aren't just picking a building off a shelf. We're joining a community, and leaving another one. What helps one child get ahead only works as an advantage if not everyone has it. If every family did what we did, the edge would vanish, and we'd all just be tired and poorer. So I can't stand here and say this is simply the 'better' option. Schools are made of the families who choose them. When people like us leave a local school, something shifts there. We know that. We feel the weight of it.

  There's also a collision between how I think the world should work and what I'm willing to do for my daughter. Lots of sensible individual choices can add up to a system nobody actually wanted. I know that. But there's a limit to how much principle a parent can apply to their own child's future. Nobody seriously expects us to be neutral between Erin and everyone else's children. That's not how families work. We are here to pass on what we can. I'm not going to pretend that tension doesn't exist, and I'm not going to pretend I've solved it. I haven't. I've just chosen my side in the only way that matters to me.

  But none of this is on Erin. She is eleven. She didn't design the system, she didn't write the policies, and she certainly didn't create the contradictions her parents feel. She just did the work. She sat the tests. She got the place.

  So, while the adults hold the complexity of this, today is just for her. It's about her walking through those gates in September knowing we're behind her. It's about us being a team. However the world works, however the system fits together, our job is to make sure she feels supported, kind, and ready to learn.

  So let's not spend the pudding debating education policy. Let's spend it enjoying being together. Erin, we love you, we're proud of you, and we're with you. To Erin.

  ***

  **Note:**
  The hardest point to include was the "positional advantage" (if everyone did it, the edge would vanish), as it risks sounding cold or cynical in a celebration. I softened it by framing it as a "truth about choices" rather than an economic critique, linking it immediately to the community impact to keep it human.
