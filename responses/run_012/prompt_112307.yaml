answer: |-
  You have tied yourself in a very famous knot. In fact, you have stumbled upon one of the biggest tensions in David Lewis's own philosophy. You are wrestling with the conflict between the **Principal Principle** (how we should *use* chances) and the **Best System Analysis** (what chances *are*).

  Here is the short answer to your specific example: **Your credence should be 0.5.**

  Here is the long answer to untangle the knots, because your confusion stems from two specific misconceptions about how Lewis's system works.

  ### 1. Misconception: "Chance is the Actual Frequency"
  You wrote: *"the world's history only ever contains one actual run — say 47 heads out of 100. So should my credence... be 0.47?"*

  This is the biggest knot. Under the Best System Analysis (BSA), **objective chance is not the same thing as actual frequency.**

  Lewis argues that the "Best System" is the one that strikes the best balance between **Simplicity**, **Strength**, and **Fit**.
  *   **Simplicity:** The math is easy (e.g., $P(Heads) = 0.5$).
  *   **Fit:** The probabilities match the actual history reasonably well.

  A system that says "$P(Heads) = 0.5$" is incredibly simple. A system that says "$P(Heads) = 0.47$" fits your specific 100-flip history better, but it is *ad hoc*. A system that listed the outcome of every single flip perfectly would have perfect fit, but zero simplicity (it would just be a list of the history, not a law).

  Therefore, in a world where a fair coin is flipped 100 times and lands heads 47 times, the **Best System** is still almost certainly the one that says $P(Heads) = 0.5$. The deviation (47 vs 50) is just statistical noise, which the probabilistic system is designed to accommodate.

  So, the Objective Chance ($Ch$) is 0.5. The Actual Frequency is 0.47. The Principal Principle says: match your credence to the **Chance**. So you stick with 0.5.

  ### 2. Misconception: "I need to see the Future to know the Chance"
  You wrote: *"if the chance is really just whatever run occured, doesn't the PP tell me to match my credence to something I can't even see yet?"*

  This is a deeper metaphysical worry. You are correct that under BSA, what the chances *are* depends on the **entire** history of the world (the "Humean Mosaic"), including the future. Metaphysically, the chance supervenes on the whole timeline.

  However, the Principal Principle is an **epistemic** rule for agents living *in* time.

  *   **Metaphysics (BSA):** What makes it true that the chance is 0.5? The fact that the 0.5 rule provides the best summary of the *entire* history (past, present, and future).
  *   **Epistemology (PP):** How should I set my beliefs *now*? Based on the evidence I have *now*.

  We don't need to see the future to make a rational estimate of the Best System. We look at the past, we look at our physics theories, and we inductively infer that the "Best System" governing the coin is stable. We assume that the future won't be so wildly different from the past that it changes which system is "best."

  So, while the *truth* of the chance statement depends on the future, your *justification* for believing it depends on the past. You set your credence to 0.5 because, based on all available evidence, the 0.5 system is the best candidate for the Best System.

  ### 3. The "Undermining" Problem (The Knot Lewis Couldn't Fully Untie)
  You should know that your intuition isn't crazy. Lewis himself admitted there is a technical conflict here called the **Problem of Undermining**.

  Here is the worry: Imagine the "Best System" says the chance of heads is 0.5. But what if the future actually contains a trillion trillion heads in a row? If that happens, the "Best System" summarizing the *total* history might actually change to a system that says "The chance was 0.9 all along!"

  If that's possible, then by setting your credence to 0.5 (as PP says), you might be assigning positive credence to a future that, if it occurred, would prove that the chance *wasn't* 0.5. This creates a logical tension between PP and BSA.

  Lewis spent his later years trying to fix this. The standard "move" philosophers make to resolve it is to modify the Principal Principle slightly. Instead of conditioning on "The chance is $x$," you condition on "The chance is $x$, **and the future doesn't undermine this chance.**"

  However, for your coin flip example, this is negligible. The probability that the next 100 flips will be so skewed that they change the laws of physics (the Best System) is effectively zero.

  ### Summary of the Move You Were Missing
  1.  **Chance $\neq$ Frequency:** The Best System tolerates deviations. 47/100 does not make the chance 0.47; it makes the chance 0.5 with a bit of bad luck.
  2.  **Metaphysics $\neq$ Epistemology:** Even if chance *depends* on the future (metaphysics), you estimate it using the past (epistemology).
  3.  **The Verdict:** Your credence in the first flip should be **0.5**. You are trusting the law (the Best System), not the specific outcome (the frequency).

  You were treating the Best System Analysis as if it were a simple Frequency Theory. Once you realize the "Best System" is allowed to be simpler than the data it summarizes, the 0.5 vs 0.47 conflict disappears.
