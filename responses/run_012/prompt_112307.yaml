          *   The Conflict: The user is conflating *actual frequencies* in a specific run with *objective chances* defined by the Best System.
          *   Specific Example: Flipping a coin 100 times. Best System says $Ch(Heads) = 0.5$. Actual outcome is 47/100.
          *   The Question: Should credence be 0.5 (the chance) or 0.47 (the actual frequency)? If chance depends on the *total* history (which includes the future relative to the flip), how can I know the chance *now* to set my credence?
      *   **The "Knot":** The tension between the *epistemic* access to chance (needed for PP) and the *metaphysical* supervenience of chance on the whole history (BSA). This is essentially the problem of "undermining" or simply a misunderstanding of how BSA works temporally.

  2.  **Deconstruct the Misunderstandings:**
