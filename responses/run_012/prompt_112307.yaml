          *   *Correction:* Under BSA, chance is about the *system* that best summarizes the history, not the raw frequency of a specific finite sample. A fair coin (0.5) can produce 47/100. The system $P(H)=0.5$ might still be "better" (simpler + good fit) than $P(H)=0.47$ (complex + perfect fit).
      *   *Misunderstanding 2: Temporal Access.* The user thinks BSA requires knowing the *future* history to know the *current* chance.
          *   *Correction:* While BSA defines chance based on the *total* history (Humean Mosaic), rational agents estimate chances based on *current* evidence and the assumption that the laws/chances are stable. We don't need to see the future to know the laws *usually* don't change radically.
      *   *Misunderstanding 3: The Principal Principle's Input.* PP says $C(A | Ch(A)=x) = x$. It requires conditionalizing on the *proposition* that the chance is $x$. It doesn't say "Guess the frequency."

  3.  **Formulate the Explanation:**

