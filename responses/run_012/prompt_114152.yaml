answer: |-
  The configuration you describe is acute, structurally specific, and increasingly recognized in human-computer interaction and AI safety literature. However, there is no single canonical term that captures the *entirety* of the feedback loop you outlined—specifically the divergence between rising confidence and eroding verification capacity driven by non-random error clustering.

  The closest established concept is **The Paradox of Automation** (Lisanne Bainbridge, 1983), but it is a "near miss." The best fit for the specific *epistemic* mechanism you describe is a synthesis of **Automation Complacency** and **Skill Decay**, which I will argue warrants a distinct name: **The Verification Mirage**.

  Here is the breakdown of the established candidates, why they fall short, and the definition of the specific configuration you have identified.

  ### 1. The Best Established Candidate: The Paradox of Automation
  **Origin:** Lisanne Bainbridge, "Ironies of Automation" (1983).
  **Definition:** Bainbridge argued that automation designers often intend to remove the human from the loop to reduce error, but by removing the easy tasks, they leave the human with the hardest tasks (monitoring and intervention) precisely when the system fails. Furthermore, by removing the human from routine operation, the human loses the situational awareness required to intervene effectively.
  **Why it fits:** It captures the structural irony: the tool makes the human's oversight role more critical while simultaneously making it harder to perform.
  **Where it falls short:** Bainbridge's paradox focuses on *task allocation* and *situational awareness*. It does not explicitly model the **calibration of confidence**. Your observation is more specific: confidence *rises* because the user successfully catches the *easy* errors (the ones the tool leaves behind), creating a false positive signal that masks the erosion of the ability to catch the *hard* errors. The Paradox of Automation describes the *trap*; it does not fully describe the *psychological mechanism of the lock*.

  ### 2. The Near Misses
  Several existing concepts capture fragments of the configuration but fail to generalize the whole.

  *   **Automation Complacency:**
      *   *Definition:* A psychological state where an operator trusts the automated system too much and fails to monitor it adequately.
      *   *Shortfall:* This describes the *attitude* (trusting too much) but not the *structural cause* (the erosion of the capacity to verify). One can be complacent without losing the skill; your scenario describes a loss of the skill *itself*.
  *   **Deskilling / Skill Fade:**
      *   *Definition:* The loss of proficiency due to lack of practice.
      *   *Shortfall:* This describes the *erosion* but misses the *confidence inflation*. In ordinary deskilling, the user usually knows they are getting worse. In your scenario, the user *believes* they are maintaining competence because they are still catching the residual, easy errors.
  *   **Epistemic Dependence:**
      *   *Definition:* Relying on the testimony of others (or systems) for knowledge (Hardwig, 1985).
      *   *Shortfall:* This is a neutral or positive state. We *must* rely on experts. It does not capture the *degradation* of the ability to audit that testimony.
  *   **The Black Box Problem:**
      *   *Definition:* The inability to understand how an AI reaches a conclusion.
      *   *Shortfall:* This focuses on the *tool's opacity*. Your scenario applies even if the tool is transparent (e.g., the radiologist sees the scan and the model's mark). The opacity here is not in the model, but in the *user's own competence*.

  ### 3. The Proposed Concept: The Verification Mirage
  Since no single term captures the specific feedback loop of **non-random error survival + confidence inflation + competence erosion**, I propose naming this configuration **The Verification Mirage**.

  **Definition:**
  A state of human-AI collaboration wherein the user's capacity to verify output erodes faster than their confidence in that verification declines. This occurs because the tool handles the tasks that build the deep fluency required to detect subtle errors, leaving the user only the fluency required to detect obvious ones. The user's confidence is calibrated to the obvious errors they still catch, creating an illusion of oversight capability while the "blind spots" (subtle errors) expand.

  **The Mechanism:**
  1.  **Displacement:** The tool assumes the primary generative or analytic load.
  2.  **Atrophy:** The user stops practicing the deep cognitive work required to produce/verify the output from scratch.
  3.  **Selection Bias:** The tool fails primarily on edge cases requiring the atrophied deep fluency. The user retains only the shallow fluency to catch surface-level defects.
  4.  **Calibration Error:** The user catches the surface defects, interprets this as successful oversight, and increases trust.
  5.  **Lock-in:** The user becomes unable to verify the very errors the tool is most likely to make.

  ### 4. Marking the Edges: Healthy Reliance vs. The Mirage
  The line between healthy tool reliance and the Verification Mirage is defined by the **trajectory of verification capacity**.

  | Feature | Healthy Reliance (The Augmented Expert) | The Verification Mirage (The Atrophied Operator) |
  | :--- | :--- | :--- |
  | **Verification Practice** | The user periodically verifies *from scratch* or audits deep logic to maintain fluency. | The user only verifies *surface outputs* or corrections suggested by the tool. |
  | **Error Distribution** | The user catches errors proportional to their severity/complexity. | The user catches only low-complexity errors; high-complexity errors pass through. |
  | **Confidence Calibration** | Confidence tracks actual detection rates across *all* error types. | Confidence tracks detection rates of *only visible* error types. |
  | **Competence Trajectory** | Tool use frees time to deepen expertise in edge cases. | Tool use reduces time spent on edge cases, eroding expertise. |
  | **The Limit** | The human remains the "fixed point" of ultimate accountability. | The human becomes a "rubber stamp"; verification requires the competence displaced. |

  ### 5. Why This Distinction Matters
  The Verification Mirage is dangerous precisely because it feels like safety. In the radiology and coding examples you gave, the systems are *working*—errors are being caught. The failure mode is not immediate collapse; it is a slow drift in the *distribution of risk*.

  The "fixed point" you mention is the critical boundary. In healthy reliance, the human is the **semantic anchor**; they understand the *meaning* of the output well enough to judge it independently. In the Verification Mirage, the human becomes a **syntactic checker**; they can judge the *form* of the output (does the code run? does the scan look clear?) but not the *substance* (is the logic sound? is the pathology subtle?).

  When the tool improves to the point where it makes no syntactic errors, the human loses the last foothold they had. At that limit, as you noted, verification becomes impossible. This is not just "relying on testimony"; it is **losing the language in which the testimony is written.**

  **Summary:**
  *   **Established Root:** The Paradox of Automation (Bainbridge).
  *   **Psychological Component:** Automation Complacency.
  *   **Specific Configuration Name:** **The Verification Mirage**.
  *   **Defining Edge:** Whether the user's verification capacity is maintained/augmented (Healthy) or eroded while confidence rises (Mirage).
