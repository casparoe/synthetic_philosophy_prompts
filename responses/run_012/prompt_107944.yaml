  **Joint Statement of Partial Convergence**

  **1. Agreed Claims**
  1. Capitalism constitutes a specific social metabolism wherein human labour is organised through market imperatives rather than conscious association.
  2. 'Exploitation' denotes the structural appropriation of surplus labour time; 'Alienation' denotes the experience and reality of labour as an external, dominating force. Both refer to objective social relations, not merely subjective feelings.
  3. In actually existing capitalism, exploitation and alienation are co-constitutive: the mechanism of surplus extraction generally requires the alienation of the worker from the product and process.
  4. Both accept that surplus labour is systematically appropriated under capitalism. Camp 1 holds the Labour Theory of Value (LTV) is essential to quantify this; Camp 2 accepts the LTV as a useful heuristic for surplus distribution but denies it is necessary to define the moral injury of alienation.
  5. Camp 1 acknowledges alienation accurately describes the lived experience of exploitation; Camp 2 acknowledges exploitation accurately describes the material mechanism sustaining alienation.
  6. Neither term is a mere residue; both capture distinct dimensions of capitalist domination (structural vs. agential), even if their causal priority is disputed.

  **2. Residual Disagreements**

  | Question | Camp 1 (Exploitation-First) | Camp 2 (Alienation-First) |
  | :--- | :--- | :--- |
  | **Primary Injury** | The theft of unpaid labour time. | The loss of self-constitution through activity. |
  | **Relation** | Alienation is the subjective symptom of objective exploitation. | Exploitation is one institutional form of ontological alienation. |
  | **Emancipation** | Abolish private property in means of production. | Transform the labour process itself, regardless of ownership. |

  **3. Cruxes and Cases**
  **Central Crux:** Can labour be alienated without being exploited?
  *   **Case A (Worker Coop):** A firm owned by workers, no external surplus claimant, yet work is fragmented and stultifying.
      *   *Camp 1 Prediction:* Alienation is significantly reduced; remaining dissatisfaction is not true Marxist alienation but residual market pressure forcing inefficiency (indirect exploitation).
      *   *Camp 2 Prediction:* Alienation persists fully; ownership changes nothing if the activity remains external to the worker's will.
  *   **Case B (Autonomous Gig Work):** Workers set pace and product but view work as purely instrumental burden.
      *   *Camp 1 Prediction:* If surplus is retained, exploitation is absent; alienation is a cultural artefact of bourgeois ideology.
      *   *Camp 2 Prediction:* Instrumentalisation confirms alienation exists independent of surplus extraction; the work remains 'not theirs' in a meaningful sense.

  **4. Verbal Dispute Assessment**
  The dispute is partially verbal. Camp 1 uses 'alienation' structurally (separation from means of production), while Camp 2 uses it phenomenologically (loss of agency). However, it is not *merely* verbal; both agree the underlying realities (surplus extraction and loss of agency) exist simultaneously. The disagreement concerns causal priority and moral weight.

  **5. Vulnerability Assessment**
  **Weakest Joint Commitment:** Claim 6 (That both terms capture distinct dimensions).
  **Reason:** Camp 1 may ultimately hold that alienation is *reducible* to exploitation. If it can be demonstrated that every instance of alleged non-exploitative alienation (like the Coop) is actually caused by hidden market exploitation (e.g., competition forcing stultification), then Camp 1 would argue the dimensions are not distinct. If Camp 1 concludes alienation is *only* the ideological reflection of exploitation, they cannot honestly sign Claim 6, which grants alienation independent ontological status. This would reveal the collaboration failed to bridge the ontological gap between the two camps.
