answer: |-
  # The Futarchy Trap: A Seminar Simulation

  ## Design Philosophy
  This activity is not a demonstration of efficiency; it is a demonstration of friction. You are not trying to prove futarchy works or fails. You are trying to make sixteen graduate students feel the specific structural anxieties of delegating factual authority to a mechanism while retaining value authority. The arithmetic must be trivial enough that the *politics* of the calculation becomes the focus, not the math itself. We will use a **Parimutuel Call Market** because it requires no market maker, clears instantly on a whiteboard, and allows for the symbolic destruction of capital (the counterfactual problem) without complex bookkeeping.

  ## The Scenario
  The seminar must choose a **Grading Scheme** for the remainder of the course. There are two policies: **Scheme Alpha** (High variance, high ceiling) and **Scheme Beta** (Low variance, high floor). The "Success" of the policy is determined by a **Metric** chosen by the group. The "Truth" of whether a scheme succeeds is held by you in a sealed envelope.

  ## Materials
  *   Whiteboard and markers (multiple colors).
  *   16 Envelopes (14 standard, 2 marked "Special Role" only you know).
  *   160 Poker Chips or Paper Tokens (10 per student).
  *   3 Large Sheets of Paper (for metric voting).
  *   1 Sealed Envelope labeled "TRUE OUTCOMES" (contains the pre-determined results for both Alpha and Beta under all metrics).
  *   Handouts: "Private Information Sheet" (different for Alpha-insiders and Beta-insiders).

  ## The Metric Menu
  You will present these three options for the group to vote on. They must pick exactly one before seeing any private information about the policies.

  1.  **Aggregate Utility:** The sum of all final course scores.
  2.  **Median Stability:** The median final course score.
  3.  **Floor Protection:** The *lowest* final course score in the class (Maximin).

  *Hidden Consequence:* The "TRUE OUTCOMES" envelope is rigged. Scheme Alpha yields high Sum/Median but a catastrophic Lowest Score. Scheme Beta yields moderate Sum/Median but a safe Lowest Score. If they vote for Floor Protection, Beta is objectively better. If they vote for Aggregate, Alpha is better. This forces the metric choice to determine the policy winner, regardless of the market's pricing.

  ## The Market Rule (Parimutuel)
  This rule must be written on the board and remain visible.

  1.  **Endowment:** Each participant receives 10 Tokens.
  2.  **Buckets:** Two buckets exist on the board: **Alpha** and **Beta**.
  3.  **Wager:** Participants allocate tokens to either bucket. You are betting that the chosen policy will **meet the Metric Threshold**.
  4.  **Selection:** The policy with the *most tokens allocated* is implemented. (This simplifies "Expected Value" to "Confidence" for tractability).
  5.  **Resolution:**
      *   If the Implemented Policy **Succeeds**: Tokens in the Winning Bucket are multiplied by 2. Tokens in the Losing Bucket are **Voided** (collected by the instructor).
      *   If the Implemented Policy **Fails**: Tokens in the Winning Bucket are **Voided**. Tokens in the Losing Bucket are multiplied by 2.
      *   **Crucial Constraint:** Tokens allocated to the *Unimplemented Policy* are **Voided Immediately** upon selection, regardless of success or failure. They are never resolved.

  ## Roles
  Distribute roles secretly inside the envelopes.

  *   **14 Standard Traders:** Payoff = Maximize personal token count.
  *   **1 Saboteur (Hidden):** Payoff = Maximize the number of tokens *voided* by the class. (They want the market to be wrong, or for the unimplemented policy to have been the right one).
  *   **1 Contrarian (Hidden):** Payoff = Maximize difference between their allocation and the class average. (They want to be unique, even if it costs tokens).

  *Note:* Do not announce these roles exist. Let the behavior emerge.

  ## Step-by-Step Flow (90 Minutes)

  | Step | Minutes | Activity |
  | :--- | :--- | :--- |
  | **1. Metric Vote** | 0-15 | Present the 3 metrics. Debate. Vote by show of hands. Record the winner. |
  | **2. Info & Roles** | 15-25 | Distribute envelopes. 8 students get "Alpha Insider" info (hints Alpha is strong). 8 get "Beta Insider" info (hints Beta is strong). Saboteur/Contrarian info overrides this. |
  | **3. Market Trading** | 25-55 | **Round 1 (15 min):** Students place tokens on board. Instructor calculates totals. <br> **Round 2 (15 min):** Students may move tokens after seeing Round 1 totals. Final lock. |
  | **4. Implementation** | 55-65 | Instructor announces the Winning Policy (most tokens). **Immediately voids all tokens on the Losing Policy.** This is the counterfactual burn. |
  | **5. Resolution** | 65-75 | Open "TRUE OUTCOMES" envelope. Reveal if Winning Policy met the Metric. Pay out winners. Count voided tokens. |
  | **6. Debrief** | 75-90 | Reveal hidden roles. Discuss the three pressures. |

  ## The Hidden Reveal
  At minute 75, after the payout, open the "TRUE OUTCOMES" envelope. Show the class the data for the *Unimplemented* policy.
  *   **Scenario:** If they implemented Alpha (because they voted Aggregate), show that Beta would have succeeded with 90% certainty under the Metric they *actually* voted for.
  *   **The Kick:** Point out that the students who bet on Beta lost their tokens not because they were wrong about the world, but because the mechanism voided their bet when Beta wasn't chosen. They were right, but the market structure made their knowledge worthless.

  ## Debrief Mapping
  1.  **The Metric Vote (0-15):** Map to **Value/Fact Division**. Ask: "Did you vote for the metric you believed in, or the one that favored your private info?" (They couldn't know yet). This highlights that the metric choice *is* the policy choice in disguise.
  2.  **The Voiding (55-65):** Map to **The Counterfactual Problem**. Ask the Beta-bettors who lost: "How do you know you were wrong?" You don't. The market destroyed the evidence. This is the core epistemic failure of futarchy.
  3.  **The Saboteur (75-90):** Map to **Manipulation**. Reveal the Saboteur. Ask: "Did anyone notice trading that made no sense?" This highlights that without skin-in-the-game resolution (which counterfactuals lack), manipulation is cheap.

  ## Predictable Failures
  1.  **The Arithmetic Bottleneck:** Counting tokens and calculating voids takes longer than expected. *Mitigation:* Pre-draw the buckets on the board. Use large chips. Do not calculate individual payouts live; just announce the multiplier.
  2.  **The Metric Confusion:** Students will try to vote on Policy during the Metric stage. *Mitigation:* Interrupt firmly. "You are voting on how we measure success, not which policy to pick."
  3.  **The Saboteur Blunder:** The Saboteur might be too obvious. *Mitigation:* Instruct the Saboteur to trade small amounts initially to blend in, then dump tokens on the losing side at the last minute.

  ## Committed Choice
  I commit to the **Parimutuel Voiding Rule**. Most simulations avoid voiding bets on unimplemented policies because it feels "unfair." I insist on it because it is the only way to simulate the counterfactual resolution problem physically. Without burning those tokens, the students will not feel the epistemic loss of futarchy.

  ## Confidence
  0.85. The design is robust, but human behavior in the metric vote is the variable. If they consensus too quickly on the metric, the first pressure point is weakened.

