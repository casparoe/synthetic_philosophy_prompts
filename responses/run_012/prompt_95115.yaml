answer: |-
  **The actual disagreement**
  The core dispute is whether practical stakes affect the truth conditions of knowledge attributions (Pragmatic Encroachment) or merely the appropriateness of asserting them (Purism). Marcus argues knowledge is functional: if stakes change rational action, they change knowledge. Dana argues knowledge is purely evidential: stakes only change conversational norms. This is not merely verbal. If Marcus is right, epistemology is inherently normative regarding action; if Dana is right, epistemology is isolated from practical reasoning. The dispute centers on the Knowledge-Action Principle: does knowing $p$ guarantee it is rational to act on $p$? Marcus says yes, forcing stakes into knowledge. Dana says no, allowing knowledge to remain static while action requirements vary. The verbal layer obscures a substantive clash over whether knowledge is a static mental state or a functional status relative to context.

  **Round by round**
  **The Bus Case:** Marcus wins. He successfully isolates the intuition that identical evidence yields different knowledge attributions based on stakes. Dana's response—that you knew all along but couldn't *say* it—feels ad hoc. It violates the principle that if you can't assert it, you don't know it in that context. Marcus establishes the phenomenological data.

  **Tracking/Licensing:** Marcus wins decisively. This is the philosophical heart of encroachment. If knowledge licenses stopping inquiry, and stakes dictate when inquiry should stop, then stakes dictate knowledge. Dana's claim that evidence is static ignores that rational inquiry is sensitive to costs. Marcus correctly identifies that knowledge is the norm of practical reasoning.

  **Insurance Reductio:** Dana wins. This is the standard "wealth objection." If stakes determine knowledge, and money lowers stakes, then wealth buys knowledge. This is morally and epistemically repugnant. Dana exposes the unacceptable social implications of Marcus's view. Marcus's position implies epistemic inequality based on income.

  **Marcus's Reply:** Dana wins. Marcus conflates reducing stakes with changing evidence. Buying insurance doesn't make the bus schedule more reliable; it just mitigates loss. Claiming money buys "stake-reduction" that counts as knowledge is a category error. He is grasping for a defense that undermines his own initial claim about stakes affecting the *same* evidence.

  **Switched Target:** Dana wins. She correctly identifies equivocation. Knowing "I will arrive safely" (insured) is distinct from knowing "the bus comes at 7:15." Marcus cannot swap propositions to save the theory. Knowledge is factive regarding specific propositions. Dana maintains propositional integrity.

  **Movie Counter:** Marcus wins the point, but not the war. He correctly notes Dana must explain why low stakes allow "know" attributions if evidence is identical. However, this only forces Dana to explain assertibility norms, which she can do via conversational implicature. It doesn't salvage Marcus's wealth problem.

  **What they're both missing**
  Both ignore **Contextualism** as a viable middle ground. Dana dismisses it as "extra steps," but contextualism explains the linguistic data without making knowledge wealth-dependent. They also miss the **Threshold Model**. Knowledge might require a confidence threshold that stakes move, without changing the evidence itself. This preserves Dana's evidentialism while accepting Marcus's action-link. Additionally, they treat knowledge as binary when cognitive confidence is scalar. Finally, neither addresses **Subject-Sensitive Invariantism (SSI)** explicitly, which is Marcus's actual position. SSI accepts stakes matter but denies context shifts the proposition. Recognizing this would clarify that Marcus isn't just talking about words, but Dana isn't forced to accept wealth buys knowledge if stakes are standardized. They also overlook that 'know' functions as a gradable adjective in natural language, similar to 'flat' or 'empty', where context sets the standard without changing the underlying physical state.

  **Bottom line**
  Dana is more right. Marcus correctly identifies that stakes govern rational action, but he errs by labeling this "knowledge." Dana preserves the integrity of knowledge as evidential, avoiding the absurd conclusion that wealth buys truth. To move Dana, Marcus must show why assertibility norms aren't sufficient to explain the intuition. To move Marcus, Dana must explain why we hesitate to attribute knowledge in high stakes without invoking truth conditions. The wealth objection is fatal to Marcus's view.
