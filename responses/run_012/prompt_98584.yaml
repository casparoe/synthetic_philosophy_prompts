answer: |-
  ### The Commemoration Review Framework (CRF)

  You have identified the core failure point of most review boards: they argue about *what to do* before agreeing on *what the thing is*. A statue is not a street sign; a plaque is not a policy. This procedure forces that distinction immediately. It is designed for a two-hour meeting with no research budget. It relies on the information submitted in the petition and city records only.

  **The Logic:** The procedure consists of five "Gates." You must pass through them in order. If a Gate fails, the process stops, and the recommendation is "No Action" or "Refer to Council." If a Gate results in a split vote, the Chair (you) breaks the tie, but that tie-break must be recorded as a "Value Judgment," not a fact.

  #### Gate 1: The Definition (Record vs. Endorsement)
  *   **Question:** Is this object primarily a **Historical Record** (describing what a past era believed) or a **Civic Endorsement** (asserting what the city currently honors)?
  *   **Sufficient Answer:** A 3-2 majority vote.
  *   **Stop Condition:** If the panel cannot define the object, the procedure halts. Recommendation: "Refer to Council without recommendation."
  *   **Why:** If it is a *Record*, the burden of proof is on the petitioner to show it is factually false or obscures greater history. If it is an *Endorsement*, the burden is on the city to justify why this specific value is still being promoted.

  #### Gate 2: The Standing Test
  *   **Question:** Who is specifically wronged by the object's continued presence in its current location?
  *   **Sufficient Answer:** Identification of a specific, identifiable group (e.g., "descendants of the striking workers," "residents of the named street") rather than "the general public" or "anyone offended."
  *   **Stop Condition:** If standing is claimed only by "the whole city" or "taxpayers," the petition is denied. Harm must be localized or targeted.
  *   **Why:** This prevents any single grievance from vetoing all public art.

  #### Gate 3: The Harm Test
  *   **Question:** Is the harm **Active** (the object incites hostility, threatens safety, or actively silences a group) or **Passive** (the object causes offense, sadness, or ideological disagreement)?
  *   **Sufficient Answer:** Evidence of active harm (police reports, documented harassment, barrier to civic participation) vs. testimony of offense.
  *   **Stop Condition:** Passive harm alone is insufficient for removal of a *Historical Record*. It is sufficient to trigger mitigation for a *Civic Endorsement*.
  *   **Why:** Distinguishes between safety and sensibility.

  #### Gate 4: The Mitigation Test (The Plaque Rule)
  *   **Question:** Can the harm be neutralized by context without removing the object?
  *   **Sufficient Answer:** A draft text for a contextual marker.
  *   **The Plaque Rule:** If the monument's *form* (e.g., a hero on a horse) contradicts the plaque's *text* (e.g., "this person was a killer"), the plaque is deemed ineffective. The form speaks louder than the text. In such cases, mitigation fails.
  *   **Stop Condition:** If mitigation is deemed sufficient, the recommendation is "Retain with Context." Process ends.
  *   **Why:** Acknowledges that brass plates do not shout as loud as bronze statues.

  #### Gate 5: The Disposition Menu
  *   **Question:** If mitigation fails, which option minimizes civic disruption while addressing the harm?
  *   **Options:**
      1.  **Relocate:** Move to a museum or less prominent civic space (for *Records*).
      2.  **Replace:** Remove and install new work (for *Endorsements*).
      3.  **Empty Plinth:** Remove the figure, keep the base as a memorial to absence (for *Endorsements* where removal is too contentious).
      4.  **Phase Out:** Allow natural attrition (e.g., street signs replaced only when damaged).
  *   **Vote:** Simple majority.

  ***

  ### Application to Cases

  #### Case 1: The 1908 General (Roundabout Statue)
  *   **Gate 1 (Definition):** Panel votes 4-1: **Civic Endorsement.** An equestrian statue on a busy roundabout is not a museum piece; it is a statement of current civic pride.
  *   **Gate 2 (Standing):** **Descendants of laborers and local union members.** Specific group identified.
  *   **Gate 3 (Harm):** **Active.** The general is a symbol of state violence against workers; his prominence in a transit hub signals that this violence is honored by the city.
  *   **Gate 4 (Mitigation):** **Fails.** A plaque saying "He killed workers" cannot compete with a statue saying "He is a Hero." The form contradicts the text.
  *   **Gate 5 (Disposition):** **Relocate.** Move to a historical society where he can be contextualized as part of a broader exhibit, not a solitary idol.
  *   **Recommendation:** Relocate to local history museum.

  #### Case 2: The Botanist (Street Name)
  *   **Gate 1 (Definition):** Panel votes 3-2: **Historical Record.** Street names are functional infrastructure that record the city's naming history, not necessarily a daily endorsement of the person's entire philosophy.
  *   **Gate 2 (Standing):** **Residents and Business Owners.** 400 households and a hardware store.
  *   **Gate 3 (Harm):** **Passive.** While eugenics is abhorrent, the street name itself does not incite violence or actively silence residents. It causes ideological offense.
  *   **Gate 4 (Mitigation):** **Sufficient.** Install historical markers at the neighborhood entrance explaining the name's origin and the city's stance on eugenics.
  *   **Gate 5 (Disposition):** **Phase Out.** Do not force immediate address changes. Change the name only when signs require replacement or properties are sold.
  *   **Recommendation:** Retain name, add context, phase out over 20 years.
  *   **Note:** You will dislike this. It prioritizes logistical cost over moral clarity. The procedure treats the hardship of 400 households as a "harm" that weighs against the abstract harm of the name.

  #### Case 3: The Factory Fire (Memorial)
  *   **Gate 1 (Definition):** **Civic Endorsement** (of the victims' memory).
  *   **Gate 2 (Standing):** **Neighborhood Group.**
  *   **Gate 3 (Harm):** **Active,** but **Causally Unlinked.** The drug dealing is a function of the park's design and policing, not the memorial itself.
  *   **Gate 4 (Mitigation):** **N/A.** The monument is not the cause of the harm.
  *   **Gate 5 (Disposition):** **Retain.** The remedy is better lighting and policing, not removing the memorial.
  *   **Recommendation:** No action on memorial; refer park maintenance issue to City Services.

  ***

  ### Where the Procedure Misfires

  This framework is not a truth machine; it is a conflict containment system. It will misfire in two specific ways:

  1.  **The Gate 1 Deadlock:** The procedure assumes you can separate "Record" from "Endorsement." In highly polarized cases (like the General), the panel may split 3-2 on Gate 1. If the Archivist and Judge say "Record" and the Neighborhood Reps say "Endorsement," the logic chain breaks. The procedure cannot force a shared reality. It merely forces a vote on reality, which looks like laundering politics as ontology.
  2.  **The Cost-Benefit Laundering:** In the Botanist case, the procedure allows logistical burden (cost of addresses) to outweigh moral harm (honoring a eugenicist). This is honest, but it feels like cowardice. It protects the city from administrative headache rather than protecting the community from ideological harm. It settles the *budget*, not the *conscience*.

  The procedure works best for clear-cut cases (Case 3) and worst for cases where the object's meaning is the very thing being fought over (Case 1). When the definition of the object is the political battle, a checklist cannot resolve it; it can only structure the surrender.

  Verdict: The 1908 General
