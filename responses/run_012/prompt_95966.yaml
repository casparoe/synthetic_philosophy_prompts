answer: |-
  You have correctly identified that the mathematical engine driving your friend's argument is **Expected Value Theory** (specifically, maximizing expected utility under uncertainty). You are also correct that the specific rhetorical move—where a vanishingly small probability multiplied by an astronomical magnitude overwhelms any certainty about the present—is a variant of **Pascal's Mugging**.

  However, you are right to feel that simply labeling it "Pascal's Mugging" doesn't solve your problem. Pascal's Mugging describes the *vulnerability* of the math, not the *criterion* for distinguishing a valid claim (insects) from an invalid one (dust). In the literature of effective altruism and longtermism, this specific tension is often called **The Fanaticism Problem**: the worry that expected value reasoning forces us to prioritize tiny-probability, huge-impact scenarios over obvious, near-term goods.

  Since there is no single established term that perfectly captures the *boundary line* you are looking for (the distinction between the insect case and the dust case), I will give you the established context and then coin a specific term for the discriminant you need.

  ### 1. The Established Framework: Moral Uncertainty and Priors

  The argument your friend is making relies on **Moral Uncertainty**. This is the field that asks: "How should we act when we aren't sure which moral theory is true (or, in this case, which entities count morally)?"

  The mathematical move is:
  $$ \text{Expected Moral Weight} = (\text{Probability of Sentience}) \times (\text{Number of Entities}) \times (\text{Intensity of Experience}) $$

  Your friend is arguing that because the *Number of Entities* is so high ($10^{19}$), the *Probability of Sentience* can be incredibly low without the total *Expected Moral Weight* dropping below that of humans.

  The reason you can't defeat this by lowering the odds is that you are treating the probability as a **dial** you can turn arbitrarily. In Bayesian statistics, you cannot just pick a probability; you must assign a **Prior**. A Prior is your starting belief before you see new evidence, and it must be based on background knowledge.

  ### 2. The Line: Coining "The Plausibility Constraint"

  The line that separates the insect argument from the dust-mote argument is not in the multiplication; it is in the assignment of the Prior.

  I propose calling this boundary **The Plausibility Constraint**.

  **Definition:** The Plausibility Constraint states that a non-zero probability of sentience (or moral weight) can only be assigned to an entity if there is **evidence of functional architecture** capable of supporting experience.

  **Where it applies (Insects):**
  Insects are biological organisms. They share evolutionary ancestry with humans. They possess:
  *   **Nociceptors:** Specialized neurons that detect damage.
  *   **Central Processing:** Ganglia or brains that integrate signals.
  *   **Behavioral Complexity:** They learn, avoid pain, and prioritize survival in ways isomorphic to vertebrates.

  Because of this, we can construct a **mechanistic model** of how an insect might suffer. We don't know if it *does* suffer, but we know *how it could*. Therefore, under the Plausibility Constraint, the Prior probability cannot be zero. It might be $1/10,000$, but it is not arbitrary. It is grounded in comparative neuroanatomy.

  **Where it stops applying (Dust/Thermostats):**
  Dust motes and thermostats lack functional architecture.
  *   A dust mote has no input-output processing.
  *   A thermostat has input (temperature) and output (switch), but no integration, no memory, and no evolutionary history of avoidance.

  To assign a non-zero probability to dust motes, you must adopt **Panpsychism** (the view that consciousness is a fundamental property of matter, like mass). While Panpsychism is a legitimate philosophical position, it is a *metaphysical claim*, not an *empirical* one.
  *   **The Insect Claim:** "Given what we know about biology, there is a chance this processes pain." (Empirical, constrained).
  *   **The Dust Claim:** "Given that we know nothing about the fundamental nature of reality, there is a chance this processes pain." (Metaphysical, unconstrained).

  The Plausibility Constraint blocks the Dust Claim because it requires **positive evidence of mechanism**, not just **absence of disproof**. Your friend's argument works for insects because they pass the constraint. It fails for dust because dust fails the constraint.

  ### 3. Why "The Odds Are Lower" Isn't Enough

  You noted that saying "the odds are much lower" for dust feels like a cheat. You are correct. If the only difference is the number, then it is just a dial.

  The difference is actually **categorical**, not numerical.
  *   **Insects:** The uncertainty is **Epistemic** (we don't know enough about their nervous systems yet). This is resolvable by science.
  *   **Dust:** The uncertainty is **Conceptual** (we don't have a theory that links silicon or carbon dust to experience). This is not resolvable by counting motes.

  When your friend says, "Nobody has any idea whether the odds are that low," she is conflating *ignorance* with *equiprobability*. Just because we don't know the exact odds doesn't mean all odds are equally likely. We know the odds of a dust mote suffering are not just "low"; they are **undefined** within our current scientific framework.

  ### 4. Borderline Cases (Where the Constraint Wobbles)

  You asked for the borderline cases where you genuinely can't say whether the constraint applies. This is where the philosophy gets hard, and where your data background might appreciate the "noise."

  **A. Simple Organisms (Nematodes/C. elegans)**
  *   *Status:* They have exactly 302 neurons. We have mapped the whole connectome.
  *   *The Borderline:* They react to harm, but is it reflex or experience? The Plausibility Constraint applies (they have neurons), but the probability drops sharply. At what number of neurons does the Prior become effectively zero? 100? 10? 1?
  *   *Verdict:* The Constraint holds, but the "dial" becomes very sensitive here.

  **B. Plants**
  *   *Status:* They react to damage, send electrical signals, and communicate chemically.
  *   *The Borderline:* They have no neurons. They have no brain.
  *   *Verdict:* Most ethicists say the Plausibility Constraint fails here (no central processing), but some argue for "distributed sentience." This is a major stress test for the Constraint.

  **C. Artificial Intelligence**
  *   *Status:* A large language model or a future agent has complex input-output processing, memory, and goal-directed behavior.
  *   *The Borderline:* It has functional architecture, but it is silicon, not carbon. It was designed, not evolved.
  *   *Verdict:* This is the hardest case. If the Plausibility Constraint is based on *function* (what it does) rather than *substrate* (what it's made of), then advanced AI might pass the constraint while a shrimp fails it. This is where your friend's arithmetic could come back to haunt you with digital minds rather than insects.

  ### 5. Summary for Your Argument

  To stop the argument from spinning out of control, you do not need to dispute the math ($N \times p$). You need to dispute the **Prior**.

  You can tell your friend:
  > "Your argument relies on **Expected Value Dominance**, which is valid only if the probabilities are **Evidentially Grounded**. For insects, we have a **Plausibility Constraint** based on neuroanatomy and evolutionary continuity, so the probability is low but non-zero. For dust, there is no mechanistic basis, so the probability isn't just 'lower'—it's **undefined**. You can't multiply a number by 'undefined' and get a moral obligation. The line isn't the math; it's whether we have a scientific model for how the suffering could physically happen."

  **The Term:**
  *   **Broad Pattern:** Pascal's Mugging / The Fanaticism Problem.
  *   **The Discriminant (Coined):** The Plausibility Constraint.
  *   **The Requirement:** Evidentially Grounded Priors (based on functional architecture).

  This allows you to accept that insects might matter (because they pass the Constraint) without accepting that dust matters (because it fails it), without relying on an arbitrary "dial" of probability.
