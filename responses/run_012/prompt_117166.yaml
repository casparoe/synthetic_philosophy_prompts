answer: |-
  You have stumbled onto one of the most famous and frustrating results in modern epistemic logic. Your intuition is correct: something is being eaten, but it isn't just rhetorical sloppiness. It is a structural feature of the logic you are using.

  Here are the names, the connections, and the verdict you asked for.

  ### 1. The Names
  The specific argument you outlined is **Fitch's Paradox of Knowability** (sometimes called the Church-Fitch Paradox). It was formally published by Frederic Fitch in 1963.

  The general "shape" you described—where a claim about what is *possible* ($\diamond$) collapses into a claim about what is *actual*—is called **Modal Collapse**. In the context of Fitch's paradox, it is specifically the collapse of "knowable" into "known." If you assert that all truths are *possibly* known, the logic forces you to accept that all truths are *actually* known.

  ### 2. The Logic Class Memory
  Your half-remembered logic class example is almost certainly **Löb's Theorem** (or a consequence of **Gödel's Second Incompleteness Theorem**).

  The shape is identical. In provability logic, you have an operator "Provable" ($\square$) instead of "Known" ($K$).
  *   **Fitch:** If all truths are *knowable*, then all truths are *known*.
  *   **Löb/Gödel:** If a system can prove its own soundness (i.e., "If I prove it, it is true"), the system becomes inconsistent (it proves everything, including falsehoods).

  Both arguments rely on a self-referential loop where an operator (Knowledge or Provability) interacts with a statement about the *absence* of that operator ( "Nobody knows" or "Not provable"). In both cases, the "in principle" modality cannot survive contact with self-reference.

  ### 3. The Committed Verdict
  You asked me to pick which step has to give. I will not hedge.

  **The premise that must break is: "Every true statement is knowable."**

  You offered three options:
  1.  "Knowing a compound gets you both halves" (Distribution of knowledge over conjunction).
  2.  "Every true statement is knowable" (The Knowability Principle).
  3.  "There is some fact nobody knows" (Existence of unknown truths).

  **Here is why Option 2 is the casualty:**

  Option 3 is empirically undeniable. There are unknown truths (like Caesar's hair count). To deny this is to claim omniscience, which is absurd.
  Option 1 is definitional. If you claim to know "A and B," but you don't know "A," we would say you don't actually know the conjunction. To deny this breaks the concept of knowledge entirely.

  That leaves Option 1 (in your list, the Knowability Principle). The paradox proves that **there are truths that are logically impossible to know.**

  ### 4. Why the "In Principle" Defense Fails
  This is the core of your frustration. You feel the "in principle" qualifier is doing work, and then it vanishes. Here is exactly why it vanishes:

  "In principle" usually guards against *physical* or *contingent* limitations. (e.g., "I can't know the hair count because I don't have a time machine, but *in principle* a time traveler could.")

  Fitch's Paradox does not rely on physical limitations. It relies on **logical** limitations.
  Consider the statement: *"P is true, and nobody knows P."*
  Let's call this statement $F$.
  If $F$ is true, then $P$ is true and nobody knows $P$.
  Now, suppose someone knows $F$.
  To know $F$, they must know "Nobody knows $P$."
  But if they know $F$, they necessarily know $P$ (because $P$ is part of $F$).
  So, if they know $F$, then somebody knows $P$.
  But $F$ says nobody knows $P$.
  Therefore, if $F$ is known, $F$ is false.

  This means $F$ is a truth that **cannot be known without ceasing to be true.**

  The barrier here isn't a lack of technology or data. It is a structural contradiction in the concept of knowledge itself. You cannot know that you are the first person to know something *at the moment you know it*, because the act of knowing it makes the statement "nobody knows this" false.

  Therefore, the claim "All truths are knowable in principle" is false. It is not just physically hard to know $F$; it is logically incoherent. The "in principle" escape hatch is locked from the inside.

  ### 5. Can It Be Patched?
  The claim can be patched, but only by retreating significantly. You cannot save the universal claim. You have to restrict the domain of "truths" that are subject to the knowability principle.

  **The Patch:** Restrict the Knowability Principle to **basic, non-conjunctive truths.**
  You can argue that "Caesar had N hairs" is knowable in principle. That is a basic fact.
  However, the compound statement "Caesar had N hairs AND nobody knows this" is not a basic fact; it is a fact *about* knowledge.
  If you restrict the principle to say "All *basic* truths are knowable," the paradox dissolves. The paradox only generates the contradiction when you apply knowability to statements that explicitly reference the state of knowledge itself (like $F$).

  **The Cost:** This patch admits that there is a class of true statements (those involving the distribution of knowledge) that are permanently unknowable. It saves the intuition that the physical world is discoverable, but it sacrifices the philosophical dream that *everything* true is discoverable.

  ### Summary
  The trick you smelled is real. The move from "possible" to "actual" happens because the specific proposition being discussed ("P and nobody knows P") is **unstable**. It is a truth that destroys itself upon being known.

  Because such truths exist, the universal claim "All truths are knowable" is false. The "in principle" modifier cannot protect a statement from logical impossibility. You should reject the universal knowability of truth. There are truths that are, by their very logical structure, forever beyond the reach of knowledge.
