answer: |-
  **Examination Question**

  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question. Do not refer to specific authors, named theories, or external empirical claims. Your grade depends on the clarity of your reasoning and your engagement with the case details.

  **Question:**

  A legislature is considering two designs for a tax on wealth transfers to promote fairness.

  **Design A (Receipts Tax):** Every person pays tax on the running lifetime total of gifts and inheritances they receive. Marginal rates rise with that running total; a first slice is exempt. The tax is owed by the recipient rather than by the estate of the deceased. Because the exemption attaches to the recipient, a family with four children can pass on four exemptions.

  **Design B (Receipts Tax with Lineage Premium):** As in Design A, except that the rate charged on a particular asset also rises with the number of times that asset has already passed by gift or inheritance. Wealth that has already been inherited twice is taxed more heavily on its third transfer than newly created wealth of equal value given for the first time, even where the two recipients are otherwise identically placed.

  Write an essay that addresses the following:
  1.  Judge which design, if either, a strict principle of equal opportunity supports, and explain what work the principle is being asked to do in each case.
  2.  Consider whether the lineage premium in Design B can be given a rationale that is about opportunity at all. If it cannot, say what kind of value would have to carry the justification and what that implies for anyone who wants to defend the scheme as an egalitarian measure.
  3.  Bring out what Design A's treatment of the family (the per-recipient exemption and the fact that the donor's act of giving goes untaxed) reveals about whether the operative ideal is equality of opportunity or something adjacent to it.
  4.  Address the family's claim to partiality and whether the operative ideal is comparative.
  5.  Do not treat the matter as settled by the familiar question of whether inheritances are earned.

  ***

  **Model Answer**

  A strict principle of equal opportunity requires that life chances not be determined by arbitrary facts about one's starting position. Its work is to neutralize advantages derived from brute luck rather than effort or choice. Design A aligns closely with this principle. By taxing the recipient based on their total intake, it targets the unequal advantage conferred upon the beneficiary. The exemption ensures a baseline of capital for all, while progressive rates mitigate the effect of being the lucky recipient of large transfers. The principle here functions as a leveling mechanism: it compares recipients to ensure no one starts too far ahead due to familial generosity.

  Design B, however, introduces a complication. The lineage premium taxes the asset's history, not just the recipient's advantage. Two recipients might receive identical sums and have identical total lifetime receipts, yet pay different taxes because one sum is "old wealth." A strict opportunity principle cannot justify this difference, as the recipients' starting positions are identical. The lineage premium instead serves an anti-caste or political equality value: it prevents the formation of permanent dynastic classes regardless of the specific opportunity set of the current generation. Defending Design B as an equal opportunity measure conflates equalizing starting gates with disrupting historical continuity. An egalitarian defending B must admit they are prioritizing the dispersion of power over time rather than strict opportunity neutrality at a single moment.

  Design A's structure reveals a compromise regarding the family. By exempting the donor's act and attaching exemptions to recipients, it permits partiality: parents may choose whom to benefit. However, by capping the tax-free amount per child, it limits the *scale* of that partiality. This suggests the operative ideal is not pure equality of condition, but equality of opportunity constrained by a right to familial association. If the ideal were purely comparative equality of opportunity, the state might forbid intergenerational transfers entirely to eliminate the arbitrary advantage. Design A acknowledges that some arbitrary advantage is the price of preserving family integrity.

  This raises the question of whether the ideal is comparative. Equal opportunity is inherently comparative; it asks whether my start is fair relative to yours. Design A maintains this comparability by measuring receipts against a universal standard. Design B introduces a non-comparative, historical element: the tax depends on the asset's past, not the relationship between contemporaries. This shifts the focus from fairness between individuals to the structure of society over time.

  The strongest objection to Design A is that it permits dynastic accumulation if wealth is fragmented among many children or grandchildren, preserving elite status despite the tax. A defender must concede that equal opportunity alone cannot prevent this without violating the family's claim to partiality. If we accept that families may favor their own, some inequality of opportunity is inevitable. Design B attempts to solve this but sacrifices the clarity of the opportunity principle. Ultimately, Design A better serves equal opportunity, while Design B serves a broader social equality that restricts familial rights more aggressively. The choice rests on whether one views the family as a private association protected from state leveling or as a primary vehicle of injustice that must be historically disrupted.

  ***

  **Marking Scheme**

  **Total Marks: 20**

  1.  **Analysis of Design A via Equal Opportunity (4 marks)**
      *   *Required:* Identifies that Design A targets the recipient's advantage/starting position.
      *   *Typical Error:* Treats the tax as punishing the donor's accumulation rather than leveling the recipient's start.
  2.  **Analysis of Design B's Lineage Premium (4 marks)**
      *   *Required:* Recognizes that identical recipient positions yield different taxes, so strict opportunity does not justify the premium.
      *   *Typical Error:* Assumes "old wealth" automatically implies greater opportunity for the recipient without论证.
  3.  **Alternative Rationale for Design B (4 marks)**
      *   *Required:* Identifies the value as anti-dynastic/political equality/temporal dispersion of power rather than opportunity.
      *   *Typical Error:* Claims the premium is necessary for revenue efficiency or administrative ease.
  4.  **Family Partiality and Design A (4 marks)**
      *   *Required:* Explains that per-recipient exemptions protect the right to partiality while limiting its economic impact.
      *   *Typical Error:* Argues that any inheritance violates partiality or that partiality requires unlimited transfer rights.
  5.  **Confronting the Strongest Objection (4 marks)**
      *   *Required:* Acknowledges that Design A allows dynastic fragmentation (many heirs) or that Design B violates intimate association, and responds to it.
      *   *Typical Error:* Dismisses the objection by restating the benefit of the chosen design without engaging the tension.

  **Total: 20 Marks**

  **Boundary Statement (A vs. B Script):**
  To reach the **A band (16-20 marks)**, a script must successfully distinguish the rationale of Design B (anti-dynastic continuity) from the rationale of Design A (recipient opportunity neutralization) **AND** must explicitly address the tension between the family's claim to partiality and the comparative nature of equal opportunity. A **B script (12-15 marks)** will typically analyze the tax mechanics correctly but fail to separate the distinct values underlying Design B, or will treat the family's claim to partiality as absolute rather than a constrained compromise.
