answer: |-
  A regional insurance provider mandates that outpatient psychotherapy is only reimbursable if linked to a specific DSM disorder code, excluding relational or stressor codes. Clinicians, facing identical patient presentations of marital strife or job loss, systematically shift their charting from "Relationship Distress" to "Major Depressive Disorder" to secure payment, without any change in the patients' actual symptoms or functioning. Over five years, administrative data shows a 300% surge in depression diagnoses in that region, prompting public health officials to declare a local epidemic and fund specialized depression clinics. Those clinics require the depression code for intake, forcing referring clinicians to maintain the coding shift, thereby cementing the diagnostic category in the medical record despite the underlying population distress remaining statistically constant.

  **Analysis**

  The feedback loop runs: reimbursement constraint → clinician coding behavior → administrative prevalence data → public health infrastructure → intake requirements → clinician coding behavior. The category is tracking real human distress, but it is no longer tracking the ontological construct of "Major Depressive Disorder"; the numbers have ceased to represent pathology and now represent "eligibility for care." This is not Hacking's "interactive kind" because the classified individuals (patients) are inert; the looping occurs entirely within the professional bureaucracy, making it a *institutional* rather than *interactive* effect. The single observation that breaks the loop is a blind clinical audit where independent raters assess symptoms without access to insurance codes; if the audit shows stable distress levels despite rising diagnosis rates, the artifact is exposed. The feature doing the work is the **exclusionary reimbursement rule**; if you take it out, the case does not collapse into the boring (standard Hacking) version where patients change behavior, but rather collapses into stability where coding matches symptoms, proving this loop is driven by institutional incentive rather than human reaction. This trick works for somatic diseases (e.g., upcoding DRGs for hospital funding) but fails for species classification, where morphological boundaries are less pliable than symptom checklists; psychiatric classification is load-bearing here because the criteria are inherently subjective, allowing the administrative label to decouple from the biological reality without immediate falsification. A realist will argue this shows the *corruption* of a valid category by external incentives, maintaining that the disorder exists independently of the billing code, while a social constructionist will argue this shows the *constitution* of the category, where the disorder's reality in practice is inseparable from the institutional mechanisms that sustain its usage.
