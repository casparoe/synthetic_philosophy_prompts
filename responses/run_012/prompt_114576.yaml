answer: |-
  ### The Taxonomy of the Homecoming Fight

  **Root Question:** Is there an objective fact of the matter about which way of life is better, independent of what anyone thinks?

  *   **NO** → **Leaf 1: The Subjectivist Truce**
      *   *Ugliest Commitment:* You must tell your brother his anger is no more rational than disliking cilantro, and your wife's "anti-intellectual" claim is just a taste preference.
  *   **YES** → *Go to Question 2.*

  **Question 2:** If there is a fact, can two lives be genuinely different without one being better or them being equal (parity), or must they rank?

  *   **They are on Par** → **Leaf 2: Radical Parity**
      *   *Ugliest Commitment:* You must admit you cannot rationally justify choosing your city life over your brother's farm life, even though you prefer it.
  *   **They must Rank/Equal** → *Go to Question 3.*

  **Question 3:** Does the fact that none of us chose our starting values make criticizing anyone's life choices illegitimate?

  *   **YES (Illegitimate)** → **Leaf 3: Determinist Amnesty**
      *   *Ugliest Commitment:* You must treat your brother's resentment as a natural phenomenon like weather, not something he is responsible for managing.
  *   **NO (Legitimate)** → *Go to Question 4.*

  **Question 4:** If criticism is legitimate, does a person's satisfaction with their life prove it is good, even if they never had real alternatives (adaptive preferences)?

  *   **YES (Satisfaction Counts)** → **Leaf 4: Silent Dignity**
      *   *Ugliest Commitment:* You must accept your mom's life is as good as yours even if she cannot defend it against your wife's criticisms.
  *   **NO (Constraints Invalidate)** → *Go to Question 5.*

  **Question 5:** Is the difference in value driven primarily by *Geography* (where you live) or *Class* (your economic leverage)?

  *   **GEOGRAPHY** → *Go to Question 6.*
  *   **CLASS** → *Go to Question 7.*

  **Question 6:** If Geography matters, is the Urban environment better because of *Opportunity* or *Culture*?

  *   **Opportunity** → **Leaf 5: Urban Instrumentalism**
      *   *Ugliest Commitment:* You must admit your cousin is worse off solely because the warehouse is in a small town, even if the pay is identical to a city job.
  *   **Culture** → **Leaf 6: Metro-Centrism**
      *   *Ugliest Commitment:* You must claim living near a museum is inherently better than living near a silo, regardless of income.
  *   **[EMPTY BRANCH: Rural Superiority]** → *Nobody lives here.*
      *   *Reason:* Incoherent in this context. While people exist who prefer rural life, nobody argues it is *objectively* better for human flourishing in a way that demands urbanites move there; it is almost always defended as "different" (Parity) or "safer" (Class/Security), not culturally superior in a universal sense.

  **Question 7:** If Class matters, is the Professional life better because of *Security* or *Meaning*?

  *   **Security** → **Leaf 7: Bourgeois Prudence**
      *   *Ugliest Commitment:* You must value your cousin's unpaid internship over his warehouse job solely because of long-term insurance, ignoring his current stability.
  *   **Meaning** → *Go to Question 8.*

  **Question 8:** If Meaning matters, does it come from *Utility* (producing needed things) or *Autonomy* (freedom from necessity)?

  *   **Utility** → *Go to Question 9.*
  *   **Autonomy** → *Go to Question 10.*

  **Question 9:** Regarding Utility, does the Professional job produce *more* or *less* than the Working job?

  *   **Less** → **Leaf 8: Productivist Guilt**
      *   *Ugliest Commitment:* You must agree with your family that your data job is worthless compared to driving a grain truck, despite your higher income.
  *   **More** → **Leaf 9: Abstract Utility**
      *   *Ugliest Commitment:* You must claim your hospital data saves more lives than the grain truck feeds, even though you never touch the patients or the wheat.

  **Question 10:** Regarding Autonomy, is the professional capacity to articulate reasons a *Neutral Skill* or a *Values-Laden Ethos*?

  *   **Neutral Skill** → *Go to Question 11.*
  *   **Values-Laden Ethos** → **Leaf 10: Professional Bias**
      *   *Ugliest Commitment:* You must admit your wife's "anti-intellectual" complaint is correct: your neutrality is just another set of values competing with your brother's.
  *   **[EMPTY BRANCH: Skill without Advantage]** → *Nobody lives here.*
      *   *Reason:* Unattractive. If articulation is a neutral skill that helps navigate the world, claiming it confers no advantage requires denying that navigating the world is valuable.

  **Question 11:** If Articulation is a Neutral Skill, does using it to defend a choice make that choice *Better*?

  *   **YES** → **Leaf 11: The Examined Life**
      *   *Ugliest Commitment:* You must value your nephew's college fund over his truck primarily because he can write an essay about the fund, even if the truck brings him more joy.
  *   **NO** → **Leaf 12: Rhetorical Advantage**
      *   *Ugliest Commitment:* You must accept that your family loses arguments not because they are wrong, but because they weren't trained to debate.

  **Question 12:** If Autonomy matters, is Privacy worth the cost of severing Community ties (the $2,300 rent vs. mom's grocery store)?

  *   **YES (Privacy > Community)** → **Leaf 13: Atomized Freedom**
      *   *Ugliest Commitment:* You must accept that paying $2,300 to be anonymous is superior to your mom's life where everyone knows her business, even if she is lonelier.
  *   **NO (Community > Privacy)** → **Leaf 14: Embedded Obligation**
      *   *Ugliest Commitment:* You must admit your city life is objectively diminished because you don't know your neighbors, regardless of how much you enjoy the privacy.

  ***

  ### Notes on the Structure

  **Indistinguishable Leaves**
  **Leaf 5 (Urban Instrumentalism)** and **Leaf 7 (Bourgeois Prudence)** frequently collapse into one another. In practice, "City" and "Professional Class" are so fused that arguing the city is better for *opportunities* (Geo) is indistinguishable from arguing the professional class is better for *security* (Class). To separate them, you would need a case where a high-security job exists in a rural area (rare) or a high-opportunity city with no professional class (impossible). If you find yourself holding both, you are likely sliding between axes.

  **Empty Branches**
  1.  **Rural Superiority (Under Geography/Culture):** This branch is empty because the view is **incoherent** within the modern framework. While individuals prefer rural life, no dominant ethical framework argues that rural *culture* universally outperforms urban culture for human flourishing in a way that obligates urbanites to convert. It is almost always defended via Parity (Leaf 2) or Specific Values (Leaf 14), not universal ranking.
  2.  **Skill without Advantage (Under Articulation):** This branch is empty because the view is **unattractive**. It requires claiming that the ability to articulate reasons helps you navigate the world (definition of skill) but does not make your navigation better (denial of value). Nobody argues for the utility of argument while simultaneously denying it improves the life of the arguer.

  **On Adaptive Preferences (Question 4)**
  This is the hardest split in the tree. If you answer **YES**, you land in **Leaf 4 (Silent Dignity)**, which protects your mom's contentment but disarms your wife's critique. If you answer **NO**, you are forced down the "Constraints Invalidate" path, which validates your worry that your brother's life is "narrow," but commits you to explaining why your own contentment isn't *also* adaptive (e.g., you only love the city because you've been conditioned to fear the country).

  **On Determinism (Question 3)**
  If you answer **YES**, you escape the fight entirely (**Leaf 3**), but at the cost of treating your brother as a patient rather than a peer. If you answer **NO**, you keep the conflict alive but preserve the possibility of persuasion. Most family fights stall here: one side wants to be understood (Determinism), the other wants to be persuaded (Legitimacy).
