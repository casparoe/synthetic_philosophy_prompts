      *   **Task:** Stress-test a reading of Christopher Nolan's *Memento* (2000) through the lens of *On Certainty* for an undergraduate seminar.
      *   **Constraints:** No extended mind/externalism (Otto's notebook), no citations/bibliographies, no direct quoting of Wittgenstein (use the "picture"), start with a scene-by-scene brainstorm ranked by promise, then address four specific questions (Strongest Reading, Breaks in Analogy, Doubt/Grounds, Where I'm Wrong/Value Add).
      *   **Tone:** Professional, critical, nuanced, philosophically rigorous but accessible enough for a TA to use.

  2.  **Deconstruct the Philosophy (*On Certainty*):**
