      *   *Selection:* I need to rank these based on how well they illustrate *hinge certainty* (structural necessity for action) rather than just *bad memory*.

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the role (hinge epistemologist/film watcher). Set the tone.

