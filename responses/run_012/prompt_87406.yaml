          *   *The Value Add:* The literature treats hinges as stable background. *Memento* shows the *violence* required to keep a hinge fixed when the world (and brain) wants to fluidify it. It adds an ethical dimension to hinge epistemology: Who installs the hinges? What if the hinge requires harm (killing Teddy) to sustain?
