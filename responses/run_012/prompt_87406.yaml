  8.  *(Self-Correction during drafting)*: I initially thought about discussing the Sammy Jankis story as a hinge. But that's a story Leonard tells *others*. The real hinges are the ones he tells *himself* to act. I should focus on the "John G." mission. Also, need to be careful not to conflate "belief" with "hinge commitment." Leonard doesn't necessarily *believe* the note at the end; he *uses* it. That distinction is crucial for Wittgenstein.

  9.  *(Final Polish)*: Make sure the distinction between "knowing" and "acting" is clear. Leonard cannot *know* anything new, but he can *act* on old certainties. The film shows the transition from knowledge-claims to action-commands.

