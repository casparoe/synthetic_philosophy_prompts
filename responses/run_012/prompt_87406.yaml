          *   *Film's Advantage:* It visualizes the *effort* required to maintain a hinge when the "river bed" is shifting constantly. Wittgenstein assumes stability; Leonard shows the labor of stabilization.

      *   **Part 3: Where the Analogy Breaks:**
          *   *Choice:* Wittgenstein's hinges are inherited/unconscious. Leonard's are chosen. *Verdict:* This is a fatal break *unless* reframed. It's not a hinge if you know you're installing it. It becomes a *fiction* used as a hinge.
          *   *Community:* Wittgenstein needs agreement. Leonard is isolated/manipulated. *Verdict:* Interesting break. It shows what happens when the "form of life" is malicious (Teddy/Natalie). It tests the normative aspect.
          *   *Writing vs. Acting:* Wittgenstein says hinges are acted on. Leonard writes them. *Verdict:* The writing is a prosthetic for the acting. The tattoo is key here—it makes the proposition part of the flesh.
