answer: |-
  The air conditioning in the Committee Room had been broken since Tuesday, but no one suggested adjourning. Outside, the capital city of Kelm baked under the fortieth anniversary sun. Inside, five people sat around a polished table staring at a scale model of the Spire of Dawn.

  It was a brutalist slab of concrete, stained by decades of rain, rising from the center of Liberty Square. It listed the names of the Victory Battalion. It did not list the names of the missing, the disappeared, or the thousands buried in the lime pits out in the rural provinces.

  "We are not here to debate history," Colonel Varkov said. He tapped a file folder stamped with the state seal. "We are here to discuss maintenance budget and lighting upgrades. The Law of Public Memory is clear. The Spire is a protected site. Altering the inscription is a criminal offense."

  "It's not altering if we add context," said Mara. She was young enough to have no memory of the war, old enough to remember the silence that followed. She slid a mock-up across the table. It was a bronze plaque. *In Memory of All Lost Souls.* "Ritual reverence is a substitute for knowing what happened. We light the floodlights every night so people can look up and see the names of the killers, but we don't pay for the soil testing out in the valleys. That's not memory. That's performance."

  "Performance keeps the peace," Varkov countered. "Contradicting the official narrative in public space invites instability. There is a cost to that."

  Julian, the finance representative, rubbed his temples. "The floodlights cost forty thousand marks a year. Tourism is down. People walk around the square because it's depressing. My argument isn't about denial, Colonel. It's about freezing. Permanent official mourning keeps a society frozen. My generation keeps getting billed for a debt it didn't run up. Other countries went through this and eventually got to be normal. Being normal isn't a betrayal."

  "Normal for who?" Mara shot back. "A country that gets to feel finished with its past is a country that's lying."

  Simon, the veteran representative, shifted in his chair. He wore a blazer that had seen better decades. "My grandfather is on that wall," he said quietly. The room settled. "He fought for his homeland. He believed he was saving us from chaos. Tearing it down or plastering over it with guilt… that is erasing his family. You talk about benefiting? My family benefited from nothing. We got a grave and a pension that barely covers medicine. But that stone is all we have left of him."

  "It's not about your grandfather," Julian said, softer now. "It's about who owns the land now. The people who benefited from the mass graves are living in the houses built on them. They want the monument to stay so they can say 'we mourn,' and then go home to sleep on stolen mattresses. Forgetting can be something a society does on purpose. Maybe we do it well enough to move on."

  "And inherit the guilt?" Simon asked. "Or inherit the silence?"

  "The monument owes nothing to the dead," Mara said. "They're gone. It owes the living the truth. If we keep it, we add the second wall. The Wall of the Missing. We list the names we have, and spaces for the ones we'll never find."

  "That violates the Protection Act," Varkov warned.

  "The Act was written by the winners," Mara said.

  "It was written by the peacekeepers," Varkov corrected. "To stop the shooting."

  "And it worked," Simon said. "Don't mistake the ceasefire for justice. But don't break the ceasefire because you want a different kind of justice now."

  Julian sighed. "I move we shrink the footprint. Reduce the concrete. Make it a garden. Keep the names, but remove the triumphalism. Let people sit on the grass. Make it usable."

  "That is desecration," Varkov said.

  "It's urban planning," Julian replied.

  Elias, the Chair, looked at the model. He had been a child when the war ended. He remembered the day the Spire was unveiled. He remembered his father pulling him away from the square, whispering that some stones were too heavy to lift.

  The vote was on the table: Proposal to Alter the Status Quo of the Spire of Dawn.

  Mara raised her hand. Julian raised his.
  Varkov kept his hands folded. Simon looked at his grandfather's medal on the table, then kept his hands down.

  Two to two.

  The silence stretched. The fan overhead clicked rhythmically, a metronome for the dead.

  Elias knew what the easy choice was. Keep it as is. Let the concrete weather until it crumbled in another forty years. Let the grandkids be sick of hearing about it. But Mara was right about the lie. A monument that only honors the victors isn't a memorial; it's a threat.

  But Julian was right about the living. A society cannot live in a cemetery. And Simon… Simon was right that erasing the grandfather's sacrifice would only create new ghosts.

  The question was not about the dead. It was about who gets to walk through the square without feeling like a target.

  "I break the tie," Elias said. His voice sounded dry in the hot room. "We alter the status quo."

  Varkov stiffened. "On what grounds?"

  "On the grounds that the monument currently serves only the dead winners, and the living losers," Elias said. "It does not serve the living winners, who want peace, or the living losers, who want truth."

  He picked up the plaque mock-up Mara had submitted. He took a red pen from his pocket and crossed out the words *All Lost Souls*.

  "We do not shrink it," Elias said, looking at Julian. "To shrink it is to say the weight of the history was too much for us. We carry it."

  He looked at Simon. "We do not remove your grandfather's name. His sacrifice is real, even if the cause was flawed. That wall stays."

  He turned to Varkov. "And we do not obey the Protection Act where it conflicts with the truth. The state's job is not to keep the crime in public view because it is boring. It is to keep it in view because it is dangerous."

  Elias slid the paper back to Mara. "We add the second wall. But not bronze. Concrete. Same material as the Spire. We cast the names of the missing into the shadow of the Spire. Every morning, the sun hits the Victory names first. The Missing names stay in the shade until noon."

  "And the cost?" Julian asked.

  "Redirect the floodlight budget," Elias said. "No more lighting the victors at night. Let them be dark. Let the people bring candles if they want to see."

  "That's symbolic," Varkov scoffed. "It changes nothing legal."

  "It changes who owns the square," Elias said. "It says guilt isn't inherited, but benefit is. Those who benefit from the peace pay to light the truth."

  He signed the authorization form. The ink was wet and black.

  "We break ground on the second wall next week. We hire the families of the missing to do the casting. They get paid double the standard rate."

  Simon looked at the model, imagining the shadow falling across the concrete. "My grandfather… he wanted peace. Even if he fought for war."

  "Then let him share the square with the people he killed," Elias said. "That's the only way any of them rest."

  Varkov stood up, gathering his files. "I will note this dissent in the record."

  "Note it," Elias said. "Then help me find the names."

  The Colonel paused at the door. He looked at the Spire model, then at Elias. He didn't salute. He just nodded, once, and left.

  Julian exhaled, the tension leaving his shoulders. "No floodlights saves us forty thousand marks. I can work with that."

  Mara was already typing on her phone, sending the decision to the press. "The wording on the plaque," she said. "It needs to be specific. 'Here lie the bodies we refused to find.'"

  "No," Elias said. He stood up and walked to the window. Below, the square was empty, save for a few tourists taking pictures of the ugly concrete slab. "Just the names. Let the concrete speak."

  He turned back to the room. "Meeting adjourned. Get me the soil reports from the valleys. If we're building a wall for the missing, I want to know exactly where they are."

  As the others filed out, Elias stayed behind. He looked at the model one last time. He reached out and tipped the Spire over. It didn't break; it just lay on its side, pointing at the door.

  He would have it set upright again tomorrow. But for now, he liked the view better.
