answer: |-
  **Project Title:** The Parameter Problem: Robustness and the Limits of Idealization in Normative Theory

  **Project Summary**
  Contemporary normative theory relies heavily on idealization strategies. To determine what an agent ought to do, philosophers frequently appeal to an idealized counterpart: a self that is fully informed, fully coherent, perfectly motivated, or situated under conditions of ideal deliberation. While these views differ in their specifics, they share a structural vulnerability: the selection of idealization conditions appears arbitrary. There is no principled consensus on where to stop idealizing. Idealizing information yields one verdict; idealizing information plus computational power yields another; idealizing temporal position yields a third. Critics argue that theorists select the specific cluster of idealizations that delivers the pre-theoretic verdicts they already desire.

  This project proposes a structural solution to this arbitrariness objection. Rather than attempting to identify the single "correct" idealization profile, I will treat the choice of idealization conditions as a parameter. I will define an action as *indirectly normative* only if it is optimal across an admissible family of "idealization profiles." The core research question is whether this robustness requirement yields substantive normative constraints or collapses into vacuity or circularity. This semester-long fellowship will support the conceptual analysis and formal mapping required to answer this question, free from teaching and empirical obligations.

  **Statement of the Problem: The Arbitrariness of the Ideal**
  The landscape of normative theory is populated by ideal observer theories, ideal advisor models, and full-information accounts. Despite their differences, they face a common meta-normative challenge: the justification of the idealization conditions themselves.

  When a theorist argues that an agent ought to do what their "fully informed" self would want, they must specify what "fully informed" entails. Does it include knowledge of the future? Does it include knowledge of what it is like to be someone else? Does it include the elimination of all cognitive biases, or only some? Every specification choice alters the output of the theory. If we idealize away all human limitations, the resulting counterpart may be so alien that its choices no longer track human normativity. If we idealize too little, the counterpart is subject to the same errors as the actual agent.

  The standard objection is that this selection process is ad hoc. Theorists tend to tune the idealization parameters until the output matches their considered judgments about specific cases. This creates a circle: the idealization is justified by the verdicts, and the verdicts are justified by the idealization. Current defenses typically attempt to break this circle by arguing that a specific set of idealizations captures the "essence" of rationality or agency. However, these defenses often beg the question against rival conceptions of agency. There is currently no neutral framework for assessing whether the *strategy* of idealization can work without smuggling in substantive first-order commitments at the level of parameter selection.

  **The Proposed Framework: Idealization Profiles and Robustness**
  This project shifts the focus from finding the *true* ideal to testing the *stability* of verdicts across ideals. I propose the following framework:

  1.  **Idealization Profiles:** An idealization profile is a specific set of conditions applied to an agent (e.g., {full information, perfect coherence, actual motivation} vs. {full information, perfect coherence, ideal motivation}).
  2.  **The Admissible Family:** A set of profiles that are plausibly defensible without presupposing a specific first-order normative theory. This excludes profiles that are logically incoherent or conceptually impossible, but includes the range of profiles currently defended in the literature.
  3.  **Robust Normativity:** A verdict is robustly normative if it holds across all profiles in the admissible family.

  The hypothesis is that robustness acts as a filter. If a wide range of idealization strategies converge on the same action, that action gains normative authority not from a specific metaphysical claim about the "true self," but from its invariance across modeling choices. This mimics robustness analysis in economics or climate modeling, where a result is trusted if it survives changes in background assumptions.

  **Core Research Question**
  The project is driven by a single, determinate question: **Does a robustness-based account of idealized normativity generate non-trivial normative constraints without presupposing a substantive first-order theory?**

  This question admits a binary outcome, though the implications are nuanced.
  *   **Outcome A (Success):** The robustness filter eliminates enough profiles or actions to yield a stable core of normative verdicts. This would vindicate the idealization strategy by showing that the specific choice of idealization matters less than the structural commitment to idealization itself.
  *   **Outcome B (Failure/Collapse):** The robustness filter fails in one of two directions.
      *   *Vacuity:* The admissible family is so diverse that no action is robustly optimal.
      *   *Circularity:* To make the family narrow enough to produce results, we must restrict the admissible profiles using substantive normative premises (e.g., "we must exclude profiles that endorse cruelty"), which reintroduces the arbitrariness problem.

  **Why Standard Defenses Do Not Settle This**
  It is crucial to distinguish this project from standard first-order debates. The usual defense of an idealization view is to argue that its specific parameters are the correct ones. For example, a full-information theorist argues that information is the only relevant variable. A coherence theorist argues that coherence is primary.

  This project does not argue for one parameter over another. Instead, it asks whether the *method* of deriving normativity from parameters is viable. Standard defenses fail to address this because they operate *within* a chosen profile. They assume the profile is fixed and argue about the output. They do not test the sensitivity of the output to the profile itself.

  Furthermore, standard appeals to "reflective equilibrium" do not solve the parameter problem. Reflective equilibrium adjusts the idealization conditions to match our intuitions about cases. But this confirms the suspicion of circularity: the parameters are being tuned to match the data they are supposed to generate. This project attempts to bypass reflective equilibrium by asking if there is an intersection of verdicts *prior* to tuning the parameters to match specific intuitions. If the intersection is empty, reflective equilibrium is merely a smoothing function over noise. If the intersection is non-empty, we have found a structural foundation for normativity that does not rely on specific intuitive matches.

  **Methodology and Work Plan**
  This is a conceptual project requiring no empirical data collection. The work consists of taxonomic mapping, logical stress-testing, and argument reconstruction. The semester will be divided into three phases.

  **Month 1: Taxonomy and Formalization**
  The first month will be dedicated to defining the "space of profiles." I will map the logical space of idealization conditions. This involves identifying the independent variables of idealization (information, computational power, motivational structure, temporal location, etc.) and defining the bounds of the "admissible family."
  *   *Deliverable:* A working definition of "Admissible Idealization Profile" that is broad enough to avoid begging the question but narrow enough to exclude logical impossibilities.
  *   *Task:* Review existing idealization arguments to extract the implicit parameters they rely on. Construct a matrix of profiles representing the major positions in the literature (e.g., Smith's coherentist view, Railton's full-information view, Ideal Advisor views).
  *   *Goal:* To ensure the "Admissible Family" is not a straw man but captures the genuine philosophical live options.

  **Month 2: Stress Testing and Collapse Analysis**
  The second month will focus on testing the robustness condition. I will construct test cases to see if the robustness filter holds.
  *   *Task 1 (The Vacuity Test):* I will attempt to construct pairs of admissible profiles that yield contradictory verdicts on standard cases. If I can show that for any action A, there is an admissible profile where A is wrong and an admissible profile where A is right, the robustness condition is vacuous.
  *   *Task 2 (The Circularity Test):* I will attempt to rescue the view by restricting the admissible family. I will analyze what constraints are required to force convergence. If the constraints required to force convergence are themselves substantive normative claims (e.g., "profiles must respect the non-identity of persons"), then the view collapses into circularity.
  *   *Goal:* To determine definitively whether the robustness strategy can bear weight. This involves thinking through edge cases where idealization diverges most sharply (e.g., self-sacrifice, long-term planning, addiction).

  **Month 3: Implications and Drafting**
  The final month will be dedicated to interpreting the results and writing the manuscript.
  *   *Scenario A:* If robustness works, I will draft the positive account, explaining how this changes the dialectic in normative ethics. It moves the debate from "which ideal is true" to "which ideals are admissible."
  *   *Scenario B:* If robustness fails, I will draft the negative argument. The key here is to diagnose *why* it fails. Does this kill the ideal-point picture entirely? Or does it suggest that idealization is useful for defining *value* but not for guiding *action* for non-ideal agents?
  *   *Deliverable:* A complete draft of a journal article (approx. 8,000–10,000 words) titled "The Parameter Problem."
  *   *Goal:* A submission-ready manuscript that advances the meta-normative debate regardless of the positive/negative outcome.

  **Why This Route Beats the Alternatives**
  The obvious alternative is to engage in a piecemeal critique of existing idealization theories. One could write a paper objecting to full-information accounts, then another objecting to ideal-advisor accounts. This approach is inefficient and low-leverage. It allows proponents of each view to retreat to their specific defenses ("that objection applies to Railton, not to me").

  By targeting the *structure* of idealization itself, this project achieves higher leverage. If the robustness argument succeeds, it unifies the field under a new methodological standard. If it fails, it undermines the entire family of views simultaneously, forcing a reevaluation of the dominant paradigm in normative theory. This structural approach is only possible with uninterrupted time. It requires holding multiple competing profiles in mind simultaneously and manipulating them as variables, a cognitive load that is difficult to sustain alongside teaching preparations.

  **Expected Outcomes and Scope Assessment**
  **Success Conditions:**
  A successful outcome is a clear proof of either the viability or the impossibility of the robustness strategy.
  *   *Positive Success:* Demonstrating a core set of actions that are robust across all admissible profiles.
  *   *Negative Success:* Demonstrating that convergence is impossible without smuggling in first-order premises.
  Both outcomes are philosophically valuable. The negative result is arguably more important, as it would expose a structural flaw in a dominant methodology.

  **Failure Conditions:**
  The project would fail if the definition of "Admissible Family" proves impossible to pin down without immediate circularity. If I cannot define the set of profiles without already assuming the normative conclusion, the project cannot get off the ground. However, even this result is data: it would suggest that the "parameter" cannot be separated from the "verdict." I consider this a likely risk, but one that constitutes a finding rather than a project failure.

  **Scope: Semester vs. Career**
  I am being honest about the scope: This semester is sufficient to establish the *argument structure* and produce a definitive paper on the viability of the robustness strategy. It is not sufficient to build a full alternative normative theory should the idealization picture collapse.
  If the project demonstrates that idealization is fundamentally flawed (Outcome B), that opens a career-long research program into what replaces it (e.g., non-ideal theory, pragmatist approaches, or particularism). If the project demonstrates that robustness works (Outcome A), it opens a career-long program of applying robustness testing to specific normative domains (metaethics, political philosophy, decision theory).
  This fellowship buys the pivot point. It allows me to determine which career path is warranted by the logic of the case. Without this semester, I risk spending years defending a specific idealization view that might be structurally unsound, or critiquing views one-by-one without ever landing a decisive blow.

  **Conclusion**
  Normative theory is currently stuck in a loop of competing idealizations, each claiming to capture the "true" conditions of rational choice. This project proposes to step outside the loop and examine the mechanism generating the competition. By treating idealization as a parameter and normativity as a robustness condition, we can test whether the ideal-point picture is a genuine method of discovery or a sophisticated way of restating intuitions.

  The internal fellowship is essential for this work. The argument requires sustained, uninterrupted conceptual modeling that is incompatible with the fragmentation of a teaching semester. The result will be a high-impact publication that clarifies the methodological foundations of our field, regardless of whether the verdict on idealization is positive or negative. This is a high-leverage investment in foundational clarity.
