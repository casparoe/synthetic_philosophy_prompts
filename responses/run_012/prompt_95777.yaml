      *   *Section 7: Assessment of Views.* Apply the filter.

      *(Self-Correction during drafting)*: I need to be careful not to just repeat the user's list but to *analyze* it. The user asked to "Sort the list... mark which are non-negotiable... flag any subset that cannot be jointly satisfied."
      *   *Refinement on Transposition:* Is it a desideratum? No, it's a test *derived* from a desideratum (invariance). I should classify it as a methodological heuristic that presupposes a specific view of causality (manipulationist).
