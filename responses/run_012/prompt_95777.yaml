      *   **Constraints:** No citations. Focus on specification/adjudication rather than asserting a winner. Address the "transposition" test. Address whether "necessary" and "incidental" can both be correct.
      *   **Tone:** Analytical, philosophical, precise, seminar-appropriate.

  2.  **Deconstruct the User's List:**
      *   *Item 1:* Return a verdict (or principled reason for none) on Hitler's necessity.
      *   *Item 2:* Avoid redescription post-factum (distinguish 'fascist Germany' from 'that particular regime').
      *   *Item 3:* Distinguish necessary vs. sufficient, cause vs. blame.
      *   *Item 4:* Accommodate structural pressures elsewhere (far-right movements didn't capture state).
      *   *Item 5:* Accommodate multiple discovery (natural selection analogy).
      *   *Item 6:* Presuppose neither determinism nor its denial.
      *   *Item 7:* Specify evidence for counterfactuals (cannot rerun 1920s).
      *   *Item 8:* The "Transposition" test (move individual/replace individual).
      *   *Item 9:* Compatibility of "necessary" and "incidental" (context dependence).

  3.  **Evaluate Items (Genuine Desiderata vs. Parochial Commitments):**
      *   *Item 1 (Verdict):* Genuine. A theory of explanation must explain *something*. If it can't touch the core question, it's useless for this dispute. (Non-negotiable).
      *   *Item 2 (Redescription/Granularity):* Genuine. This is the "contrast class" problem in explanation. Explaining "why fascism" is different from "why *this* fascism." Collapsing them begs the question. (Non-negotiable).
      *   *Item 3 (Necessary/Sufficient, Cause/Blame):* Genuine. Conceptual clarity is a baseline for philosophical analysis. (Non-negotiable).
      *   *Item 4 (Structural Pressures/Failed Movements):* Genuine. This is the control group problem. If structure is sufficient, why did it fail elsewhere? (Non-negotiable for structuralists, but a genuine constraint for *any* theory claiming to explain the specific outcome).
      *   *Item 5 (Multiple Discovery):* Tricky. This supports structuralism (inevitability of ideas). But history isn't science. It's a constraint on *timing* and *context*, not necessarily outcome. It's a genuine consideration but maybe not a hard logical constraint on *all* historical explanation. Let's call it a strong constraint on *inevitability* claims.
      *   *Item 6 (Determinism):* Genuine. A theory of historical explanation shouldn't solve metaphysics first. It needs to work within plausible metaphysical bounds. (Non-negotiable).
      *   *Item 7 (Evidence for Counterfactuals):* Genuine. Epistemic access is crucial. If the theory requires impossible evidence, it's vacuous. (Non-negotiable).
      *   *Item 8 (Transposition):* This is a *method* derived from a theory (likely structuralist/comparative), not a desideratum itself. A Great Man theorist might reject the validity of "holding structure fixed" as impossible. So, this is a parochial commitment/methodological heuristic, not a logical requirement for *adequacy*.
      *   *Item 9 (Context Dependence):* Genuine. Explanation is interest-relative. "Why Germany?" vs "Why Hitler?" yield different answers. Collapsing them is a category error. (Non-negotiable).

  4.  **Identify Inconsistencies/Tensions:**
      *   *Tension:* Item 1 (Verdict) vs. Item 7 (Evidence). We want a verdict, but we lack experimental evidence. Theories often resolve this by lowering the standard of proof (plausibility vs. certainty), but a strict demand for *decisive* verdicts + strict demand for *empirical* counterfactual evidence creates tension.
      *   *Tension:* Item 2 (Granularity) vs. Item 4 (Structural Pressures). If you define the outcome broadly ("fascism"), structure wins. If narrowly ("Holocaust specifics"), individual wins. A theory must handle *both* without shifting goalposts arbitrarily.
      *   *Tension:* Item 6 (No Determinism) vs. Item 5 (Multiple Discovery). Multiple discovery suggests a form of determinism (ideas are 'in the air'). Accommodating this without assuming determinism is hard.

  5.  **Select the "Single Most Eliminative Requirement":**
      *   Item 2 (Granularity/Contrast Class) is the killer. Most bad theories fail here because they answer a different question than the one asked (e.g., proving "war was inevitable" when asked "why *this* war"). It forces the theory to define the *explanandum* precisely.

