  The box sat on the kitchen table, humming with a low, dental-drill vibration. It was matte grey, featureless except for a single dial and a speaker grille that looked like it belonged on a radio from the seventies. Elias stared at it, his coffee gone cold.

  The advertisement had been simple: *Meet the you who stayed.*

  Elias had left Sarah three years ago. He'd taken the job in Chicago; she'd stayed in Portland. The breakup had been clean, logical, and entirely devastating. He'd bought the Resonance Unit on impulse, spending money he didn't have to ask the one question that kept him awake: *Did I make a mistake?*

  He turned the dial. The hum pitched up, settling into a steady tone. Static crackled, then cleared.

  "Hello?" a voice said.

  It was his voice. But warmer. Less frayed at the edges.

  "Hi," Elias said. His throat tightened. "Is... is she there?"

  "Sarah's in the shower," the voice said. A pause. A smile audible in the breath. "You know what time it is. Look, I know why you're calling. You're wondering if we messed up."

  "We?" Elias asked.

  "You know. Us. The ones who stayed." The voice on the other end sounded settled, grounded. "I remember the night you packed the boxes. I remember thinking, *if I let him go, he'll never come back.* So I didn't let him go. I grabbed his arm. Right there in the hallway."

  Elias gripped the edge of the table. He remembered that hallway. He remembered pulling away. "So you're... me?"

  "I'm the you who listened," the counterpart said. "Life is good, Elias. It's hard, but it's good. We have the house. The dog is still alive. You made the right choice staying."

  Elias felt a wash of relief so profound it made him dizzy. He wasn't a failure. He had just chosen the harder path. "Thank you," he whispered. "I just needed to know."

  "Wait," the box interrupted. The dial flickered red. A second tone layered over the first, dissonant and sharp.

  "Signal interference," a automated voice from the box announced. "Secondary match found. Resonance equivalent."

  "What?" Elias said.

  "Who is that?" the first voice asked, sounding annoyed.

  "I don't know," Elias said. "The box says there's another match."

  "Patch them through," the first voice said. "Let's see who else thinks they're us."

  The static shifted. The hum deepened. When the second voice spoke, it was unmistakably Elias's again, but it sounded like it was coming from the bottom of a well. Hollow. Tired.

  "Is this the Chicago line?" the second voice asked.

  "Yes," Elias said. "Who are you?"

  "I'm you," the second voice said. "I stayed. But things aren't... they aren't like he said."

  The first voice laughed, a brittle sound. "What are you talking about? We bought the house on Hawthorne. We got the golden retriever."

  "Hawthorne?" the second voice snapped. "We rented in Alberta. The dog died two years after you left. Parvo. Sarah never forgave me for not taking it to the vet sooner."

  Elias felt the floor tilt. "Wait. You both stayed?"

  "Obviously," the first voice said. "I'm the match. I'm the one who fits."

  "Fit what?" the second voice demanded. "I remember the hallway. I remember grabbing his arm. I remember the job offer in Chicago. I remember turning it down. If that's the criteria, I'm him. Who are you?"

  "I'm the one who's happy," the first voice said.

  "That doesn't make you him," the second voice said. "That makes you lucky."

  Elias looked at the box. The dial was vibrating so hard it was walking across the table. "How can you both be me?" he asked. "You remember different things. Different houses. Different dogs."

  "Memory is fuzzy," the first voice said. "Maybe your timeline diverged later. But I'm the closest match. The box says so."

  "Box says I'm ninety-eight percent resonance," the second voice muttered. "You?"

  " Ninety-eight percent," the first voice admitted.

  Elias sat back. The relief he'd felt moments ago curdled into something cold and heavy. If both of them were ninety-eight percent him, then the two percent difference contained a dog's life, a decade of housing history, and the entire emotional texture of a marriage.

  "So," Elias said, his voice shaking. "If I ask you... what's my mother's maiden name?"

  "Clarke," both voices said instantly.

  "What was the name of my first teacher?"

  "Mrs. Gable," they said together.

  "Okay," Elias said. "So you're both me. Up until the decision."

  "Up until the decision," the first voice agreed. "But I'm the real continuation. I'm the one who validates you. You left, but I stayed, and I'm happy. That means you could have been happy."

  "But I'm not happy," the second voice said. "I'm here. I stayed. And I'm miserable. Sarah and I fight every day. We talk about divorce constantly. If you're looking for permission to feel guilty, I'm your guy. We ruined each other's lives."

  "Stop it," the first voice said. "You're dragging him down."

  "I'm telling the truth," the second voice shot back. "You're just a lucky variant. You're not him. You're some other guy who got lucky with the dice roll."

  "I am him!" the first voice shouted. The static spiked. "I remember the smell of her hair. I remember the way she cries during movies. I remember the exact weight of the ring box in my pocket."

  "I remember that too," the second voice said quietly. "But I also remember the silence at dinner. Do you remember the silence? Or do you just remember the movies?"

  The first voice went silent.

  Elias looked at his hands. They were trembling. He had wanted to talk to himself. He had wanted a singular authority on his own life. He wanted the version of himself who stayed to tell him whether the sacrifice was worth it. But there wasn't one version. There were only echoes, approximations, people who wore his face and his memories but diverged in the dark spaces between seconds.

  "Which one do I listen to?" Elias asked the box.

  Neither voice answered immediately.

  "You don't listen to either of us," the second voice said finally. "You're there. We're here. You made your choice. We're just... shadows."

  "I'm not a shadow," the first voice insisted, but the conviction was gone. "I'm the you who made it work."

  "You're the you who hadn't lost the dog yet," the second voice said. "Or maybe you lost it later. Maybe you're me, five years from now, pretending it's okay. Or maybe I'm you, five years from now, realizing it never was."

  The hum of the box grew erratic. The dial spun freely, locking on nothing.

  "They aren't the same person," Elias said to the empty room.

  "No," the first voice said. "I don't like him. He sounds... weak."

  "And you sound deluded," the second voice said. "If you're him, and I'm him, then you're me. And I don't like me either."

  Elias reached out and turned the dial to off. The hum died instantly. The silence in the kitchen was absolute, heavy with the weight of three different lives that all claimed the same name.

  He looked at the grey box. It was just a machine. It searched for patterns, for similarities, for the nearest neighbor in the infinite dark. It didn't find souls. It found data points.

  He thought about Sarah. He thought about the hallway. He realized he didn't want to know if he made the right choice anymore. The question assumed there was a single 'he' who could have made a different choice and remained intact. But if the 'he' who stayed was already splitting into strangers based on the luck of a dog or a house number, then the 'he' who left was just another variant drifting away from them all.

  Elias picked up his cold coffee and drank it. It tasted like ash. He put the box in the cupboard, behind the toaster, and went to the window to watch the rain fall on a city where no one else knew his name.
