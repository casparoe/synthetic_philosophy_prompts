answer: |-
  Consider a modern just-in-time (JIT) compiler within a virtual machine, which monitors execution hotspots and dynamically recompiles frequently used bytecode into native machine instructions to maximize processing speed. Its behavior is opaque to the physical stance because tracking every electron in the CPU is computationally intractable, and the intentional stance is unwarranted because the compiler holds no beliefs about what code is "important" nor desires to be "fast," merely executing fixed profiling thresholds. Yet, the design stance successfully predicts its output by attributing the function of optimization, compressing the vast physical microstates into an intelligible rule-set regarding efficiency that captures a real, objective regularity in the system's operation without implying any inner life.

  **Walkthrough of the Stances:**
  The **physical stance** attempts to predict the compiler's output by calculating the movement of electrons through the logic gates; while theoretically possible, it is pragmatically impossible due to combinatorial explosion. The **intentional stance** treats the compiler as a rational agent, suggesting it "believes" certain code paths are valuable and "wants" to reduce latency; this is unwarranted because the system lacks doxastic commitment and cannot revise its goals based on new information, making the attribution false rather than merely abstract. The **design stance** assumes the system was engineered to perform a specific function (optimization) and predicts behavior based on that functional rationale; this is the stance that finds the compressing description, allowing us to ignore the physical substrate and the fake psychology to accurately predict the software's actions.

  **Realness and Stance-Relativity:**
  This does not make realness stance-relative in the sense of subjective opinion; for Dennett, a pattern is real if it affords compression better than noise, which is an objective fact about the system's structure relative to the information available. The stance is merely the tool required to access the pattern; the pattern exists independently of whether a specific observer chooses to look, but it does not exist independently of the *possibility* of such compression.

  **The Feature Doing the Work:**
  The single feature doing the work is **rigid functional teleonomy**: the system exhibits goal-directed behavior derived from prior engineering (teleonomy) without possessing cognitive flexibility or genuine intent (teleology). If you remove this feature—for instance, by randomizing the compilation rules—the design stance fails to compress the data, the pattern vanishes, and the system reverts to physical noise.

  **The Realist Objection:**
  A realist who believes patterns are independent of any stance would block this case by arguing that the optimization structure exists in the causal powers of the silicon itself, regardless of whether any observer finds it compressible. They would claim the compression is merely a discovery of a pre-existing mind-independent structure, denying that the "realness" of the pattern has any constitutive dependence on an observer's interest or predictive strategy.
