answer: |-
  # Decision Theory Sorting Tree
  **Instructions:** Read the three case summaries below. Follow the tree by answering the questions based on your intuitive verdict in each case. Do not worry about which theory "should" win; answer based on what you think is actually right.

  ### The Cases
  1.  **Newcomb's Problem (Control):** Omega predicts your choice. Box A is opaque ($1M or $0). Box B is transparent ($1k). If Omega predicted One-Box, A has $1M. If Two-Box, A is empty. **Do you take both boxes or only A?**
  2.  **Counterfactual Mugging:** Omega flipped a coin. Tails: You lose $100. Heads: You get $10k *if and only if* Omega predicted you *would have* paid on Tails. The coin is Tails. **Do you pay the $100?**
  3.  **XOR Blackmail:** A predictor sends a bill ($100) if and only if: (You Pay XOR Disaster Happened). Disaster costs $10,000. The predictor is accurate. You received the bill. Paying and refusing are each rewarded in exactly one branch of the underlying probability space, so neither dominates. **Do you pay the bill?**

  ---

  ### The Tree

  **Q1. In Newcomb's Problem, do you take Only Box A (One-Box) or Both Boxes (Two-Box)?**
  │
  ├── **Two-Box** ──> **Q2. In Counterfactual Mugging (Tails), do you pay the $100?**
  │                   │
  │                   ├── **No** ──> **[LEAF 1] Causal Decision Theory (CDT)**
  │                   │              *XOR Commitment:* Refuses to pay the blackmailer, accepting guaranteed utility loss in logical-twin scenarios to avoid acting on non-causal correlations.
  │                   │
  │                   └── **Yes** ──> **[LEAF 2] Incoherent Causalist** ⚠️
  │                                  *XOR Commitment:* (Unexplored/Incoherent) Treats predictions as binding when costly (CM) but not when profitable (Newcomb); lacks a consistent principle for subjunctive dependence.
  │
  └── **One-Box** ──> **Q3. In Counterfactual Mugging (Tails), do you pay the $100?**
                      │
                      ├── **No** ──> **[LEAF 3] Evidential Decision Theory (EDT)**
                      │              *XOR Commitment:* Refuses to pay the blackmailer, treating the logical link between action and prediction as irrelevant evidence once the bill is received.
                      │
                      └── **Yes** ──> **Q4. In XOR Blackmail, do you pay the $100 bill?**
                                      │
                                      ├── **No** ──> **[LEAF 4] Hybrid / "Logical Evidentialist"**
                                      │              *XOR Commitment:* Pays to secure windfalls (CM) but refuses to pay to mitigate losses (XOR); dynamically inconsistent across gain/loss frames.
                                      │
                                      └── **Yes** ──> **[LEAF 5] Functional / Updateless (FDT/UDT)** ‡
                                                     *XOR Commitment:* Pays the blackmailer, accepting vulnerability to logical exploitation to maintain the integrity of the decision algorithm across all possible worlds.

  ---

  ### Notes on Leaves

  *   **⚠️ Incoherent Causalist (Leaf 2):** This combination (Two-Box + Pay CM) is rarely defended. Two-boxing relies on the claim that the past prediction is fixed; paying in CM relies on the claim that your current decision influences the past prediction. Holding both suggests an inconsistent model of counterfactuals.
  *   **‡ FDT/UDT (Leaf 5):** This tree cannot separate Functional Decision Theory from Updateless Decision Theory. Both prescribe the same actions in these three cases. Other "superrational" views also typically land here.
  *   **Hybrid View (Leaf 4):** Some agents feel the force of the Counterfactual Mugging argument (policy selection) but balk at the XOR Blackmail implication (paying a blackmailer). This view is live but faces charges of arbitrariness regarding *which* logical correlations count.

  ### Node Count
  *   **Decision Nodes:** 4 (Q1–Q4)
  *   **Leaf Nodes:** 5
  *   **Total:** 9 Nodes (Target: 8–10)
