answer: |-
  You have put your finger on the exact nerve center of the repatriation debate. The inconsistency you sense isn't just rhetorical slippery-footedness; it reveals a collision between two incompatible philosophical frameworks that museums are trying to straddle.

  To answer your specific questions: The practice commits you to a specific theory of political succession, it fits comfortably with post-colonial sovereignty narratives, and it remains deeply underdetermined regarding the actual ontological status of the object.

  Here is the philosophical shape of what is happening.

  ### 1. The "Keep" vs. "Give" Contradiction
  **Do they contradict?** Logically, yes. **Can they be reconciled?** Only if you change the underlying metric from *Ownership* to *Stewardship*.

  *   **The "Keep" Argument (Cosmopolitan Universalism):** This posits that cultural property belongs to the human species. The museum is a trustee for humanity. The metric for retention is *access* and *preservation*.
  *   **The "Give" Argument (Cultural Nationalism):** This posits that cultural property belongs to the culture that produced it. The metric for return is *identity*, *sovereignty*, and *justice*.

  **The Reconciliation:** A single consistent theory is possible if you view the museum not as an owner, but as a **temporary custodian whose mandate can be voided by injustice.**
  Under this theory (let's call it *Restorative Stewardship*), the "Humanity" argument is the default setting: objects should be accessible to all. However, if the object's presence in the collection is the result of a violation (theft, colonial coercion), that violation corrupts the museum's ability to steward it *for* humanity. Returning it becomes a way to restore the moral conditions necessary for the object to function as culture. Thus, the "Particular People" claim beats the "Humanity" claim not because the people own the atoms, but because their sovereignty is a prerequisite for the object's meaningful existence.

  ### 2. The "Dead Polity" Problem (Benin vs. Nigeria)
  This is your sharpest insight. The Kingdom of Benin (the Edo people under the Oba) is not the Federal Republic of Nigeria. The borders are different, the government is different, and the legitimacy is different.

  **What the practice commits you to:**
  Repatriation practice commits you to **Territorial Successionism.** It assumes that the modern nation-state inherits the cultural soul of whatever polity existed within its current borders.
  *   **The Commitment:** It reifies the Westphalian nation-state as the only legitimate vessel for culture. It implicitly agrees with the colonial map. By sending Bronzes to "Nigeria" (specifically the National Commission for Museums and Monuments), the museum acknowledges the Nigerian state as the rightful heir, bypassing the Oba of Benin or the Edo State government in some legal frameworks, or awkwardly triangulating between them in others.
  *   **The Philosophical Cost:** This presupposes that **Culture is a function of Sovereignty.** It suggests that if you control the territory, you control the history generated within it. This is a distinctly modern, statist view that often clashes with indigenous views where culture is tied to lineage, ritual function, or kinship, not passports.

  **What it merely fits with:**
  It fits with **Pragmatic Legalism.** There is no legal entity called "The Kingdom of Benin" that can sign a loan agreement or accept liability under international law. The Nigerian state is the only actor with standing. The practice fits with the reality of international relations without necessarily endorsing the philosophical truth that Nigeria "owns" Benin culture.

  ### 3. Who Owns Culture? (The Ontological Question)
  You asked if culture is owned by a state, a people, or a trust. The current repatriation wave suggests a hybrid model that is philosophically unstable.

  *   **Not the State:** If it were truly the state, the Nigerian government could sell the Bronzes to a private collector. They generally cannot (and claim they wouldn't). This suggests the state is not the *owner* but the *guardian*.
  *   **Not the People:** If it were truly the "people," who defines the people? The Edo? The Yoruba? All Nigerians? The diaspora? The definition shifts depending on who is speaking.
  *   **The Trust Model:** This is the strongest fit. The object is held in trust for **future generations of the source community.**
      *   *Why this matters:* If it is a trust for the future, then the "safety" argument flips. In 1900, "safety" meant physical preservation in London. In 2024, "safety" means *cultural continuity* in Benin City. An object in a glass case in London is physically safe but culturally dead. An object in Benin City is physically riskier but culturally alive. The repatriation argument commits you to the idea that **cultural life outweighs physical preservation.**

  ### 4. Commitments, Fits, and Underdetermination
  To structure this as you requested, here is what the current practice actually entails:

  **A. What the Practice COMMITS you to:**
  1.  **The Statist Heir Theory:** You must accept that modern borders determine cultural inheritance, even if those borders are colonial artifacts. You commit to the idea that the Federal Republic of Nigeria is the legal reincarnation of the Kingdom of Benin.
  2.  **The Moral Taint of Provenance:** You commit to the view that the *history of acquisition* permanently alters the *legitimacy of possession*. A stolen object cannot be "universal heritage" while it remains in the hands of the thief, regardless of how well it is cared for.
  3.  **Culture as Sovereignty:** You accept that control over cultural artifacts is a necessary component of political sovereignty for post-colonial states.

  **B. What the Practice FITS with (but doesn't require):**
  1.  **Post-Colonial Justice:** It fits with the narrative of repairing colonial wrongs, but strictly speaking, repatriation could be justified even without colonialism (e.g., returning stolen private property). The colonial frame is a fit, not a logical necessity.
  2.  **Identity Politics:** It fits with the modern emphasis on group rights and identity, but one could argue for repatriation on pure property law grounds without invoking "culture."
  3.  **Soft Power:** It fits with the geopolitical desire of Western museums to improve relations with the Global South, though this is a motive, not a philosophy.

  **C. Where it is UNDERDETERMINED:**
  1.  **The Threshold of "Safety":** There is no consistent theory for when a source community is "ready." Why was Nigeria not safe enough in 1990 but safe enough in 2022? The criteria for "safety" often shift from physical security (climate, theft) to political stability, which is underdetermined and often paternalistic.
  2.  **The Recipient on the Ground:** When the British Museum gives to "Nigeria," do they mean the National Commission in Lagos? The Edo State Government? The Oba's Palace? The practice is underdetermined regarding *which* layer of the modern polity actually represents the "people." This often leads to internal conflicts within the receiving country that the returning museum ignores.
  3.  **The Status of the Object Post-Return:** If the object belongs to the "people," can the people sell it? Can they let it crumble through ritual use (some masks are meant to be destroyed)? The "Universal Heritage" argument forbids destruction; the "Cultural Nationalism" argument might require it. Current repatriation deals rarely specify this, leaving the ontological status of the object ambiguous once it lands.

  ### Summary
  The philosophical shape that is bugging you is the transition from **Property Law** to **Restorative Justice.**

  When museums keep objects, they argue from Property Law (we acquired it legally under the laws of the time, we preserve it). When they return them, they argue from Restorative Justice (the acquisition was unjust, the relationship must be repaired).

  The "Dead Polity" issue you spotted is the price of doing Restorative Justice in a world of Property Law. To fix the past, we have to use the legal tools of the present. Those tools require a State to sign the paperwork. So, we pretend the Modern State is the Ancient Kingdom. It is a **legal fiction** necessary to achieve a **moral end.**

  The consistent theory that licenses both keeping and giving is **Stewardship based on Legitimacy.**
  *   *Keep:* When the museum is the most legitimate steward for the object's survival and access (and acquisition was clean).
  *   *Give:* When the museum's possession is illegitimate (theft/coercion), rendering them a poor steward regardless of their climate control, because the object cannot fulfill its cultural purpose while held in captivity.

  The friction you feel is the friction of museums trying to apply a moral solution (returning looted art) using a bureaucratic framework (nation-state treaties) that was designed to protect the status quo they are trying to dismantle.
