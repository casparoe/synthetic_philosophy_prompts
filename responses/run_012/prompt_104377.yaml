prompt: |-
  Something about museum repatriation buggs me and I can't put my finger on the philosophical shape of it. When a museum won't give an object back, the argument is usually that it belongs to all of humanity and is safer in a big encyclopedic collection; when the same museum does give something back, the argument flips and the object belongs to a particular people, whose claim beats everyone else's. Maybe those are just different cases, but here's the part I can't get past. The things being returned were almost always taken from a polity that doesn't exist anymore -- the bronzes were looted in 1897 from the Kingdom of Benin, and they go back to the modern Nigerian state and its institutions, not to the kingdom or the lineage that actually held them. So the practice seems to quietly assume that today's nation-state simply inherits the cultural claims of whatever kingdom or chiefdom an object came out of, even though the borders, the government, and the state's relationship to the original owners have all been completely transformed since. What view of who owns culture does that presuppose -- is culture owned by a state, by a people, by whoever holds power now, or is it better understood as something else entirely, like a trust held for the future? And do the keep-it argument and the give-it-back argument actually contradict each other, or could a single consistent theory of what cultural objects are for license both? Tell me what the practice really commits you to, what it merely fits with, and where it's just underdetermined.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Problem:** The user is bothered by an apparent inconsistency in museum repatriation arguments.
      *   **Observation 1 (Keep it):** Museums argue objects belong to "all humanity" and are safer in encyclopedic collections.
      *   **Observation 2 (Give it back):** When returning objects, museums argue they belong to a "particular people" whose claim supersedes others.
      *   **Observation 3 (The Political Gap):** Objects were taken from historical polities (e.g., Kingdom of Benin, 1897) but returned to modern nation-states (e.g., Nigeria). The original polity often no longer exists in the same form.
      *   **Key Question:** What view of cultural ownership does this presuppose? (State? People? Power holders? Trust?)
      *   **Secondary Question:** Do the "keep" and "give" arguments contradict, or can they be reconciled under a single theory?
      *   **Specific Request:** Distinguish between what the practice *commits* you to, what it *fits* with, and where it's *underdetermined*.

  2.  **Initial Analysis & Philosophical Mapping:**

      *   *The "Humanity" vs. "Particular People" Tension:* This is the classic Universalism vs. Cultural Nationalism debate (John Henry Merryman's framework).
      *   *The "Historical Polity" vs. "Modern State" Tension:* This is the problem of *continuity of identity*. If the Kingdom of Benin is gone, who is the heir? The user is right to spot the sleight of hand here. It assumes a form of *successor state* theory applied to culture.
      *   *The Contradiction:* Is it contradictory? Not necessarily. It depends on the *purpose* of the object. If the purpose is preservation/access, Universalism wins. If the purpose is restorative justice/sovereignty, Nationalism wins.
      *   *The "Trust" Idea:* The user suggests "trust held for the future." This aligns with stewardship models.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sharpness of the observation. It's a genuine philosophical tension, not just a logistical one. Name the frameworks (Universalism vs. Cultural Nationalism).
      *   **Addressing the "Keep vs. Give" Contradiction:**
          *   Are they contradictory? Yes, on the surface.
          *   Can they be reconciled? Yes, if we shift from *ownership* to *stewardship*.
          *   *Theory:* "Cosmopolitan Stewardship." The museum keeps it *unless* the source community can steward it better *for humanity*. Or, the museum returns it *as* an act of serving humanity (by correcting injustice).
      *   **Addressing the "Dead Polity vs. Modern State" Issue (The Core Insight):**
          *   This is the trickiest part. The user is right: Nigeria $\neq$ Kingdom of Benin.
          *   *What does the practice commit you to?* It commits you to **Territorial Successionism**. Culture is tied to the land and the current sovereign of that land, not necessarily the specific ethnic lineage.
          *   *Why?* Practicality. There is no legal entity "Kingdom of Benin" to sign a receipt. The Nigerian state is the only recognized legal actor.
          *   *Philosophical Cost:* It privileges the Westphalian nation-state model over indigenous political structures. It reifies colonial borders.
      *   **Who Owns Culture? (The Ontological Question):**
          *   *State:* Too rigid (what about diaspora?).
          *   *People:* Too vague (who defines the people?).
          *   *Trust/Stewardship:* This is the strongest candidate. Objects are held in trust for ancestors and descendants.
      *   **Distinguishing Commitments, Fits, and Underdetermination:**
          *   *Commits:* To the nation-state as the legitimate heir (Territorial Succession). To the idea that injustice can be remedied by physical transfer.
          *   *Fits:* With post-colonial sovereignty narratives. With human rights frameworks (right to culture).
          *   *Underdetermined:* The actual *use* of the object once returned. Does it go to a museum? A shrine? A market? The theory doesn't dictate this. Also, the threshold for "safety" (why was London safe in 1900 but not 2000?).
      *   **Synthesis/Conclusion:** The practice isn't logically inconsistent if viewed through *Restorative Justice* rather than *Property Law*. The "Humanity" argument is often a shield for status quo; the "People" argument is a sword for justice. The "Modern State" substitution is a pragmatic legal fiction that carries philosophical baggage.

  4.  **Refining the Argument (Self-Correction during drafting):**

      *   *Correction:* I need to be careful not to sound like I'm taking a side (pro- or anti-repatriation). The user wants to understand the *philosophical shape*, not a moral verdict.
      *   *Nuance:* The "Humanity" argument isn't always bad faith. Some objects *are* safer in climate-controlled rooms. But the user is asking about the *switching* of arguments.
      *   *Key Terminology:* Use "Cultural Nationalism" (Merryman), "Universalism," "Successor State," "Stewardship."
      *   *The Benin Example:* Be specific. The Benin Bronzes went to the Edo State Government and the National Commission for Museums and Monuments (NCMM) in Nigeria. This highlights the split between ethnic identity (Edo) and State identity (Nigeria).

  5.  **Final Polish:**

      *   Ensure the distinction between "Commits," "Fits," and "Underdetermined" is clear and explicit, as requested.
      *   Make sure the tone is analytical and philosophical, matching the user's sophistication.
      *   Check if I answered the "single consistent theory" question. Yes, propose "Stewardship based on Justice."

  6.  **Final Review against constraints:**
      *   Did I address the "dead polity" issue? Yes.
