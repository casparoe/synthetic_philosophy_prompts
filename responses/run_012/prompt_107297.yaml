prompt: |-
  Ok here's what I want. Argue that endurantism — the view that a persisting object is wholly present at each moment it exists, with no temporal parts — comes out just fine from the special-relativity objection, and that perdurantists who lean on that objection are cheating.

  Set it up properly first: the objection is that once you accept that simultaneity is frame-relative, there's no frame-independent fact about how the whole object is right now, so the endurantist's 3D object has no well-defined set of intrinsic properties at a time, while the 4D worm does. Give that objection its best shot, then argue it fails.

  Things I want covered, and don't hand-wave any of them: (a) can the endurantist just relativize having-a-property to a frame, and if so does that quietly turn her into a closet perdurantist about the frame's slicing? (b) if instead she relativizes to a time, does she need a privileged foliation of spacetime, and is that as bad as it sounds? (c) does the perdurantist have the mirror-image problem, i.e. does temporal part also need frame-relative slicing before it's even well defined, and if so is the objection symmetric and therefore toothless?

  Then the honest bit at the end: what's the strongest thing the perdurantist can say back, and does your argument generalise beyond relativity to plain old change (a ball going from red to blue)? If it only works against the relativity version, definately say so rather than pretending it's general.

  Keep it as an argument, not a survey — take a side and defend it.
