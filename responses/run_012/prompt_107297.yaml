answer: |-
  ### The Minkowski Menace and the Endurantist Defense

  The special-relativity (SR) objection is widely regarded as the endurantist's checkmate. The argument is seductive in its geometric simplicity. Endurantism holds that persisting objects are three-dimensional entities wholly present at each moment of their existence. Perdurantism holds that objects are four-dimensional spacetime worms composed of temporal parts.

  The objection runs as follows: Special Relativity abolishes absolute simultaneity. There is no frame-independent fact about which events constitute "now." Consequently, there is no frame-independent hyperplane of simultaneity to slice the world. For the endurantist, an object's existence is tied to being wholly present *at a time*. If "a time" is just a frame-relative slice of spacetime, then *which* 3D object exists becomes frame-relative. One observer sees a spherical electron; another, moving rapidly, sees an ellipsoidal one. If the object's intrinsic properties (like shape) vary by frame, the endurantist seems forced to admit the object has no determinate shape *simpliciter*. The perdurantist, by contrast, seemingly escapes this: the 4D worm exists tenselessly. Its geometry is invariant. It doesn't need a "now" to exist; it just *is* the spacetime region.

  This argument is treated as a physical refutation of a metaphysical view. It is not. It is a category mistake that relies on smuggling in perdurantist assumptions about location and parthood. The endurantist not only survives SR; she exposes the perdurantist's reliance on the very slicing mechanisms they claim to transcend.

  #### 1. Relativizing Properties: Indexing, Not Slicing (Addressing a)

  The first line of defense for the endurantist is to accept the relativity of simultaneity and relativize the instantiation of properties. The endurantist claims: Object $O$ is wholly present at time $t$ relative to inertial frame $F$.

  The perdurantist immediately cries foul. They argue that by tying "wholly present" to a frame-relative slice, the endurantist has covertly admitted that the object is just a collection of properties instantiated on that slice. They claim this turns the endurantist into a "closet perdurantist," because she is now treating the frame's slicing as ontologically significant, effectively treating the object as a function from frames to 3D shapes.

  This charge is baseless. It conflates *location* with *constitution*.

  When an endurantist says, "The ball is spherical relative to Frame $F$," she is not saying the ball *is* the slice of spacetime defined by $F$. She is saying the 3D object stands in a location relation to the events on that hypersurface. Perdurantism claims the object *is* the aggregate of its parts across time. Endurantism claims the object *is* a continuant that bears relations to times.

  Relativizing property instantiation to a frame is no more "closet perdurantism" than saying "The ball is to the left of the box" is "closet substantivalism about space." "Left" is frame-dependent (or observer-relative). That doesn't mean the ball ceases to be a 3D object; it means spatial relations are indexed to a perspective. Similarly, "wholly present at $t$" is indexed to a foliation. The ontological commitment remains fixed: the fundamental entity is the 3D continuant. The perdurantist cheats here by defining "object" as "spacetime region" from the outset, then claiming anyone who references spacetime regions must agree. The endurantist references regions only to specify *where* the object is, not *what* the object is.

  #### 2. The Privileged Foliation Trap (Addressing b)

  A common retreat for the endurantist is to posit a privileged foliation of spacetime—a "True Time" or neo-Lorentzian absolute simultaneity—to ground the "wholly present" relation. The perdurantist pounces: this is scientifically revisionary. It posits an undetectable structure contradicted by the spirit of Einsteinian physics. Is this as bad as it sounds? Yes, and fortunately, the endurantist does not need to do it.

  The endurantist need not claim there is a *metaphysically privileged* frame to survive SR. She only needs to claim that *presence* is a frame-relative relation, much like velocity.

  In SR, velocity is not an intrinsic property of an object; it is a relation between an object and a frame. An object does not have a velocity *simpliciter*; it has velocity-$v$-relative-to-$F$. This does not make the object illusory. Nor does it require a "True Rest Frame."

  The endurantist applies the same logic to existence. "Existing now" is not a monadic property of the object; it is a relation between the object, a time coordinate, and a frame. To demand a privileged foliation is to demand that "existence" must be absolute in a way that "velocity" is not. But why? If we accept that measurements of duration and length are frame-dependent, why must *ontological presence* be absolute? The endurantist can argue that Minkowski spacetime describes the causal structure of the universe, not its ontological inventory. The geometry allows for multiple foliations; the endurantist simply picks one to define "the object right now" without claiming that foliation is the *only* real one. She accepts that different observers carve out different 3D objects from the causal history, all of which are equally real manifestations of the persisting continuant. This costs no more than admitting velocity is relative.

  #### 3. The Symmetry Strike (Addressing c)

  Here is the decisive blow. The SR objection assumes the perdurantist is immune to frame-relativity because the 4D worm is "just there." But this ignores how perdurantists define their own ontology.

  Standard perdurantism defines a persisting object as a sum of *temporal parts*. What is a temporal part? It is typically defined as the intersection of the 4D worm with a simultaneity slice (a hypersurface of constant time).

  But in SR, there are no frame-independent simultaneity slices. Therefore, there are no frame-independent temporal parts.

  If the perdurantist says, "The temporal part at $t$," they must mean "The temporal part at $t$ relative to Frame $F$." If they switch frames, they get a *different* set of temporal parts. The "worm" remains invariant, but its *decomposition into parts* is frame-relative.

  This makes the objection symmetric.
  *   **Endurantist:** "The 3D object is frame-relative."
  *   **Perdurantist:** "The temporal parts are frame-relative."

  If frame-relativity renders the endurantist's object ill-defined, it renders the perdurantist's *parts* ill-defined. The perdurantist cannot have it both ways: they cannot claim that frame-relativity destroys the 3D object while the 4D worm's *analysis into parts* remains pristine.

  The perdurantist might reply: "The worm is fundamental; the parts are derivative. I don't need the parts to be absolute." But if the parts are derivative and frame-relative, then the *analysis* of persistence is frame-relative. The endurantist can say the exact same thing: "The 3D object is fundamental; its instantaneous states are derivative and frame-relative."

  The perdurantist is cheating by treating the 4D manifold as an ontological given while treating the 3D slice as a metaphysical burden. But both views require a mapping from spacetime to objects. The perdurantist's map is the identity function (object = region). The endurantist's map is a projection (object = cross-section). Neither map is privileged by the geometry of SR. If the projection is fatal to endurantism, the arbitrary decomposition into parts is fatal to perdurantism. Since perdurantism survives this, so does endurantism.

  #### The Honest Bit: The Perdurantist's Best Reply and Generalization

  Having defended endurantism, I must concede where the ground is shaky.

  **The Strongest Perdurantist Reply:**
  The perdurantist's strongest counter-argument is not about logic, but about *parsimony and fit*. They can argue: "SR describes a 4D geometry. The perdurantist ontology matches this geometry one-to-one. The endurantist ontology requires an extra step: projecting the 4D geometry into 3D slices and adding a 'wholly present' relation that does no causal work. Why add the projection?"
  This is a pragmatic objection, not a logical refutation. It argues that perdurantism is *simpler* given our best physics, not that endurantism is *false*. The endurantist can accept this cost, arguing that our phenomenological experience of persistence (being wholly present) outweighs the geometric elegance of the worm. But she cannot claim her view is *easier* to square with SR. It requires more interpretive work.

  **Does This Generalize to Plain Old Change?**
  Does this defense save endurantism from the classic problem of change (e.g., a ball going from red to blue)?
  **Yes, but with a caveat.**

  The logic generalizes perfectly. The SR objection claims the endurantist cannot handle frame-relative properties. The Change objection claims the endurantist cannot handle time-relative properties without contradiction (Leibniz's Law).
  My defense relied on *indexing*: properties are instantiated relative to a parameter (frame or time).
  *   In SR: `Instantiates(Object, Shape, Frame, Time)`
  *   In Change: `Instantiates(Object, Color, Time)`

  If one accepts that relativizing shape to a frame avoids contradiction in SR, one must accept that relativizing color to a time avoids contradiction in Change. The mechanism is identical: ternary (or quaternary) instantiation relations replace binary ones.

  **The Caveat:**
  However, the SR objection is often felt as *stronger* than the Change objection because SR challenges the *reality* of the 3D slice itself, whereas the Change objection only challenges the *logic* of property attribution.
  My argument shows that the SR objection is not *logically* stronger—it relies on the same symmetry vulnerabilities as the perdurantist view. But I must admit: if the perdurantist wins on parsimony in the SR case (because the 4D geometry is physically fundamental), they might still win on parsimony in the Change case (because temporal parts explain change without needing indexed properties).

  Therefore, while this argument successfully neutralizes the claim that SR *refutes* endurantism, it does not prove endurantism is *superior*. It merely restores parity. The perdurantist who claims SR kills endurantism is cheating by ignoring the frame-relativity of their own temporal parts. But once parity is restored, the debate returns to where it started: metaphysics of persistence, not physics of spacetime. The endurantist survives the relativistic bullet, but she still has to convince us that "wholly present" is a feature of reality, not just a feature of our perspective.
