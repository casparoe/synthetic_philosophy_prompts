answer: |-
  This is an excellent question. You have put your finger on one of the most persistent and slippery intuitions in moral philosophy and decision theory. The feeling you have—that this isn't just wishful thinking, but that it's "tracking a reason"—is shared by a significant minority of philosophers and decision theorists. However, the standard orthodoxy (Causal Decision Theory) dismisses it as a fallacy.

  To give you the "carving" you want, we need to separate the *mechanism* of the reasoning from the *normative force* behind it. Your intuition that these might be two outfits of the same idea is partially correct, but the "fabric" of each outfit is different.

  Let's work through this systematically.

  ### 1. Brainstorming the Neighborhood

  First, let's lay out the concepts that hover around this reasoning. We need to distinguish between theories that tell you how the world *works* (descriptive/predictive) and theories that tell you how you *ought* to act (normative/prescriptive).

  *   **Causal Decision Theory (CDT):** The standard textbook view. It says you should choose the action that *causes* the best outcome. In the one-shot Prisoner's Dilemma (PD), your choice cannot causally affect the other player's choice (no communication, no future). Therefore, you defect. Your friend's reasoning is irrational under CDT.
  *   **Evidential Decision Theory (EDT):** This says you should choose the action that provides the best *news* about the outcome. If my cooperating is strong evidence that she cooperates, EDT says cooperate. This fits your friend's reasoning better, but EDT runs into trouble with "common cause" problems (like the Smoking Lesion problem).
  *   **Superrationality (Douglas Hofstadter):** This is specifically designed for your first case. It argues that if two agents are rational and identical, they will arrive at the same answer. Therefore, you aren't choosing an action; you are choosing the *output of the rational algorithm* that both of you run.
  *   **Kant's Categorical Imperative (Universalizability):** This fits your second case. "Act only according to that maxim whereby you can at the same time will that it should become a universal law." This is about logical consistency of the will, not necessarily empirical prediction.
  *   **Rule Utilitarianism:** "Follow the rule which, if generally followed, would produce the best outcomes." This is close to the chore case, but it's consequentialist, whereas Kant is deontological.
  *   **Logical Decision Theory (LDT) / Timeless Decision Theory (TDT):** Modern descendants of the superrational idea. They treat your decision as a logical fact that determines the output of any other process computing the same function.

  ### 2. Carving Case 1: The Prisoner's Dilemma

  **The Reasoning:** "We are the same kind of thing in the same spot. Whatever I do, she'll do."

  **The Label:** This is **Superrationality** (or, in modern terms, **Logical Decision Theory**).

  **The Carving:**
  The essential feature here is **Logical Subjunctive Dependence**.
  Your friend is rejecting the CDT assumption that the other player's move is a fixed fact of the past (or independent of her choice). Instead, she views both her decision and the other player's decision as *outputs of the same logical function*.

  *   **Essential:** The claim is that there is a *logical* link, not a *causal* one. If I solve the equation $X + 2 = 4$, and you solve $X + 2 = 4$ in a different room, we both get $X=2$. My writing down "2" didn't *cause* you to write "2." But it is logically impossible for me to write "2" and you to write "5" if we are both reasoning correctly. Your friend treats "Cooperate" as the solution to the rationality equation.
  *   **Incidental:** The fact that they are humans. This reasoning holds even if they are computers running the same source code.
  *   **The "Magic" Feeling:** You said it doesn't feel like wishful thinking. That's because LDT/Superrationality isn't claiming magic influence; it's claiming **logical correlation**. It treats the decision not as a physical lever you pull, but as a theorem you prove. If you prove "Cooperate," and she proves the same theorem, she outputs "Cooperate."

  **Standard Objections:**
  1.  **The Causal Objection:** "You are physically distinct. Your neurons firing do not send a signal to her brain. If you cooperate and she defects, you lose. You can't change her mind by thinking hard." (This is the CDT defense).
  2.  **The Asymmetry Objection:** "What if you are wrong about her rationality? If you cooperate based on this logic, and she is a standard CDT defector, you get suckered. Superrationality is only stable if you *know* the other is also superrational."
  3.  **The "Why Ain'cha Rich?" Critique:** In many environments, agents who reason this way get exploited by agents who don't. If decision theory is about winning, this reasoning loses against defectors.

  ### 3. Carving Case 2: The Chore Rota

  **The Reasoning:** "I'll do my bit, because if everyone in my position did what I'm about to do, we'd all be fine."

  **The Label:** This is the **Principle of Universalizability** (Kantian) or **Rule Consequentialism**.

  **The Carving:**
  The essential feature here is **Normative Consistency**.
  Unlike the PD case, this person is not necessarily making a prediction about what the others *will* do. They are establishing a constraint on what they *may* do.

  *   **Essential:** The focus is on the *maxim* (the rule), not the specific outcome of this specific instance. The reasoning is: "I cannot make an exception for myself." It is a moral constraint, not necessarily a decision-theoretic prediction.
  *   **Incidental:** Whether the others actually follow suit. A Kantian might do the chore even if they *know* the others won't, because the moral worth lies in the willing of the universal law, not the consequence. (Though your friend's phrasing "we'd all be fine" leans slightly toward Rule Utilitarianism).
  *   **The Difference from Case 1:** In Case 1, the friend claims: "She *will* cooperate because I do." In Case 2, the friend claims: "I *must* act as if everyone does, regardless of whether they do."

  **Standard Objections:**
  1.  **The Free Rider Problem:** "If everyone else is going to defect, your cooperation doesn't save the system; it just makes you the sucker who did the dishes while everyone else ate off dirty plates."
  2.  **The Irrelevance Objection:** "Your action doesn't change theirs. So why bind yourself to a rule that produces a suboptimal outcome for you personally in this isolated instance?"

  ### 4. The Intersection: Where the Outfits Match

  Now, to your core question: Are these the same idea?

  They are **structurally homologous** but **ontologically distinct**.

  **The Similarity (The "Type vs. Token" Shift):**
  Both reasonings reject the idea that you are a **Token Causal Agent** (a isolated physical entity pushing levers). Instead, both treat you as a **Type Representative** (an instantiation of a class).
  *   In the PD case, you are an instantiation of "Rational Agent."
  *   In the Chore case, you are an instantiation of "Household Member."

  Both arguments say: *You cannot decide in isolation.* Your decision is inherently linked to the decisions of others in your class. They both deny **Causal Isolationism**.

  **The Difference (Prediction vs. Prescription):**
  *   **Case 1 (PD) is Descriptive/Predictive:** It claims a fact about the world. "Given our symmetry, our actions *will* correlate." It tries to maximize utility by leveraging that correlation. If the correlation turns out to be false (she defects), the reasoning fails empirically.
  *   **Case 2 (Chores) is Normative/Prescriptive:** It claims a fact about morality/rationality. "I *ought* to act as if my rule applies to all." It maximizes moral integrity or rule-based utility. If the correlation turns out to be false (others don't do chores), the reasoning *still holds* morally (you did your duty).

  ### 5. The "Interesting Bit" You're Sensing

  You mentioned: *"I keep feeling like the interesting thing is exactly the bit that the labels don't quite cover."*

  Here is the carving of that specific bit. The intuition you are tracking is **Agency as Logic** rather than **Agency as Physics**.

  Standard Decision Theory (CDT) views agency physically: I am a body here, you are a body there. My muscles move, your muscles move. No signal connects us.
  Your friend's intuition (in both cases) views agency logically: I am a reasoning process. You are a reasoning process. If we are running the same process (PD) or occupying the same logical role (Chores), then the *output* of the process must be consistent across instances.

  The "reason" it tracks is **Logical Consistency**.
  *   In the PD, it feels like a reason because if "Rationality" implies "Defect," then *both* of you must defect. If "Rationality" implies "Cooperate" (due to symmetry), then *both* must cooperate. To defect while hoping the other cooperates is to claim "I am rational, but she is not," or "I am special."
  *   In the Chores, it feels like a reason because to say "I should not do chores" implies "No one in my position should do chores," which leads to a contradiction (a dirty house everyone hates).

  **The Verdict:**
  1.  **Case 1** is best named **Superrationality** (or Logical Decision Theory). It relies on **logical correlation**. It is vulnerable to the objection that the other agent might not be running the same "algorithm."
  2.  **Case 2** is best named **Universalizability** (Kantian). It relies on **normative consistency**. It is vulnerable to the objection that moral consistency doesn't pay the bills if others don't comply.

  **Are they the same?**
  They are the same *gesture* (refusing to be a causally isolated token) applied to different *domains* (pragmatic success vs. moral duty).
  *   In the PD, your friend is trying to **hack the matrix** by realizing her choice is logically tied to the other's.
  *   In the Chores, the person is **accepting the law** by realizing their choice sets a precedent for their own will.

  **Why it bugs you:**
  It bugs you because standard decision theory insists these are fallacies (specifically, the **Fallacy of Non-Causal Correlation**). But your intuition correctly identifies that in a world of similar agents, treating yourself as causally isolated is often a *worse* model of reality than treating yourself as logically correlated.

  If you want to read more to satisfy this itch, look into **David Gauthier's *Morals by Agreement*** (which tries to bridge this gap) or **Eliezer Yudkowsky's papers on Timeless Decision Theory**. They take your friend's intuition seriously and try to build the math to support it, rather than dismissing it as a Kantian confusion.

  Does that distinction between "Logical Correlation" (PD) and "Normative Consistency" (Chores) resonate with how the two conversations felt to you?
