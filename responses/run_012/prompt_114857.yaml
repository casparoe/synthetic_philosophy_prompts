  4.  **Case 1 vs. Case 3 (The Beef/Plant Gap):**
      She argues Beef > Chicken (Case 1) and Legumes > Chicken (Case 3). She has not compared **Beef vs. Legumes**.
      *   *Friction:* Beef (even pasture) requires land. Legumes require land. Beef requires more land per calorie. More land means more displacement of wild animals (which she claims to care about in the intro).
      *   If she follows her own logic on wild displacement, Legumes should beat Beef comfortably. If she chooses Beef over Legumes, her commitment to wild animal suffering collapses into a commitment to *domestic* death minimization only. The friction lies in whether her concern for wild animals is a *constraint* on her diet or merely a *tie-breaker* between animal products. Her verdicts suggest the latter, despite her stated commitments.
