  ### Ruled-Out Rules
  Her answers already rule out several plausible ethical frameworks:

  1.  **Strict Deontology ("Do Not Kill"):** Founders on **Case 5**. A deontologist would refuse the culled cow's meat because it involves using a dead animal, regardless of marginality. Her acceptance of the byproduct proves she is consequentialist regarding the *act* of killing.
