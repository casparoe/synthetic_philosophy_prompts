  ### The Dirty Hands Taxonomy

  Below is a map of the logical space surrounding the problem of dirty hands. It is built from seven concrete questions. You do not need to know the names of the positions to use this; answer the questions as they come, and follow the path to the leaf that describes your view.

  #### The Seven Splitting Questions

  **Q1. The Verdict (Wrongness)**
  *Case:* A mayor must lie to a legislature to prevent a panic that would kill dozens. She lies, the panic is prevented.
  *Question:* Is the lie **morally wrong**, even though it saved lives?
  *   **A:** No, the good outcome makes it right.
  *   **B:** Yes, it remains a moral wrong despite the good outcome.

  **Q2. The Code (Separate Spheres)**
  *Case:* A minister lies to a foreign negotiator to secure a peace treaty.
  *Question:* Is this lie wrong for the **same reason** lying to your spouse is wrong?
  *   **A:** No, politics runs on a different code than private life.
  *   **B:** Yes, morality is the same everywhere.
      *(Note: If you answered Q1-A, stop at Leaf 1. If Q1-B, answer Q2.)*

  **Q3. The Refusal (Permission vs. Requirement)**
  *Case:* A leader knows a dirty act is the only way to save the city, but refuses to do it on moral grounds. The city suffers.
  *Question:* Is this leader **admirable** for keeping their hands clean, or **negligent** for failing their duty?
  *   **A:** Admirable (they are not required to do wrong).
  *   **B:** Negligent (they are required to do the wrong).
      *(Note: If you answered Q2-A, stop at Leaf 2. If Q2-B, answer Q3.)*

  **Q4. The Bearer (Borrowed vs. Spent)**
  *Case:* An official authorizes a torture interrogation to find a bomb.
  *Question:* Who is the true author of the act: the **human being** or the **office** they hold?
  *   **A:** The Office (the role authorized it).
  *   **B:** The Human (the person pulled the lever).
      *(Note: If you answered Q3-A, stop at Leaf 3. If Q3-B, answer Q4.)*

  **Q5. The Hangover (Remainder)**
  *Case:* After the bomb is found and the city is saved, the official who ordered torture reflects on their act.
  *Question:* Is feeling **guilt** a necessary part of the job, or a **self-indulgent luxury**?
  *   **A:** Luxury (focus on the result, not your feelings).
  *   **B:** Necessary (guilt shows you respect the moral law).
      *(Note: If you answered Q4-A, go to Leaf 4 or 5. If Q4-B, answer Q5.)*

  **Q6. The Silence (Receipt)**
  *Case:* Admitting the torture later would cause public outrage that destabilizes the government.
  *Question:* Can the act be justified if it **must remain secret forever**?
  *   **A:** Yes, secrecy is part of the protection.
  *   **B:** No, justification requires public accountability.
      *(Note: If you answered Q5-A, stop at Leaf 6. If Q5-B, answer Q6.)*

  **Q7. The Gamble (Clock)**
  *Case:* The official ordered torture, but it turned out the suspect knew nothing. The act was useless.
  *Question:* Does the **failure of the outcome** make the act retroactively unforgivable?
  *   **A:** Yes, you only get a pass if it actually worked.
  *   **B:** No, judge the decision by what was known at the time.
      *(Note: If you answered Q6-A, stop at Leaf 7. If Q6-B, answer Q7.)*

  ---

  #### The Leaves (Positions)

  **1. The Calculator**
  *   **Holds:** There is no dirty hands problem; the right act is simply the one with the best outcome.
  *   **Pattern:** Q1-A.
  *   **Case:** The mayor lies to save the city and sleeps soundly, believing she did the *right* thing, not a *necessary evil*.
  *   **Hardest Commitment:** Accepting that an individual's rights can be fully overridden by a large enough sum of collective benefit.
  *   *(Label: Act Consequentialism)*

  **2. The Realist**
  *   **Holds:** Politics runs on its own code, and ordinary moral vocabulary does not apply to statecraft.
  *   **Pattern:** Q1-B, Q2-A.
  *   **Case:** The minister lies to the negotiator and feels no conflict, viewing it as a move in a game where "truth" is a weakness, not a sin.
  *   **Hardest Commitment:** Denying that leaders are bound by the same basic human prohibitions (like killing or lying) as their citizens.
  *   *(Label: Political Realism / Machiavellianism)*

  **3. The Purist**
  *   **Holds:** The conflict is genuine, but refusing to do wrong is always the higher duty, even if disaster follows.
  *   **Pattern:** Q1-B, Q2-B, Q3-A.
  *   **Case:** The leader refuses to torture the suspect, the bomb goes off, and the leader maintains they did the only thing a moral person could do.
  *   **Hardest Commitment:** Accepting catastrophic real-world consequences to preserve one's own moral integrity.
  *   *(Label: Clean Hands / Absolutism)*

  **4. The Proxy**
  *   **Holds:** The office authorizes the wrong, and the person is not really its author; the role absorbs the blame.
  *   **Pattern:** Q1-B, Q2-B, Q3-B, Q4-A, Q5-A.
  *   **Case:** The official orders the torture, saves the city, and retires without guilt, viewing themselves as a tool of the state's necessity.
  *   **Hardest Commitment:** Believing that a job title can absolve a human being of personal moral agency.
  *   *(Label: Role Morality / Bureaucratic Authorization)*

  **5. The Penitent**
  *   **Holds:** The office may require the act, but the human must bear the guilt; resignation cannot pay it off.
  *   **Pattern:** Q1-B, Q2-B, Q3-B, Q4-A, Q5-B.
  *   **Case:** The official orders the torture to save the city, then resigns and lives with the shame, believing the state needed it but they personally stained their soul.
  *   **Hardest Commitment:** Accepting that one can be professionally right but personally damned, with no way to wash the stain.
  *   *(Label: Tragic Responsibility)*

  **6. The Technocrat**
  *   **Holds:** The whole notion of remorse is self-indulgent; the politician's guilt centres him rather than the people he hurt.
  *   **Pattern:** Q1-B, Q2-B, Q3-B, Q4-B, Q5-A.
  *   **Case:** The official orders the torture, saves the city, and dismisses questions about their guilt as narcissism, focusing solely on the lives saved.
  *   **Hardest Commitment:** Suppressing the natural human emotional response to violating a moral norm in the name of efficiency.
  *   *(Label: Utilitarian Hardness)*

  **7. The Guardian**
  *   **Holds:** Some wrongs only work if never admitted; a wrong that can never be acknowledged can still count as justified.
  *   **Pattern:** Q1-B, Q2-B, Q3-B, Q4-B, Q5-B, Q6-A.
  *   **Case:** The official lies to the legislature to save the nation, takes the guilt, but knows they can never confess without undoing the good.
  *   **Hardest Commitment:** Accepting that a democratic leader must sometimes deceive the very public they serve to protect them.
  *   *(Label: Esoteric Morality / Noble Lie)*

  **8. The Accountant**
  *   **Holds:** The conflict is genuine, but forgiveness belongs to the public; secrecy destroys the justification.
  *   **Pattern:** Q1-B, Q2-B, Q3-B, Q4-B, Q5-B, Q6-B, Q7-A.
  *   **Case:** The official lies to save the city, confesses immediately, and accepts punishment if the public decides the lie wasn't worth the cost.
  *   **Hardest Commitment:** Risking the loss of power (and thus the ability to do further good) by demanding public validation for a secret act.
  *   *(Label: Public Justification)*

  **9. The Gambler**
  *   **Holds:** Necessity is visible only in hindsight; if the gamble fails, the wrong was never justified.
  *   **Pattern:** Q1-B, Q2-B, Q3-B, Q4-B, Q5-B, Q6-B, Q7-A.
  *   **Case:** The official tortures a suspect to find a bomb; if the bomb is found, they are a hero; if not, they are a criminal.
  *   **Hardest Commitment:** Accepting that the moral status of an act changes based on luck and outcome rather than intent.
  *   *(Label: Retroactive Justification)*

  **10. The Judge**
  *   **Holds:** The conflict is genuine but admits of no general answer, only particular judgements based on context.
  *   **Pattern:** Q1-B, Q2-B, Q3-B, Q4-B, Q5-B, Q6-B, Q7-B.
  *   **Case:** The official weighs the specific threat, the specific lie, and the specific moment, knowing no rule covers this exact case.
  *   **Hardest Commitment:** Giving up the comfort of a fixed rule (always lie or never lie) in favor of uncertain, case-by-case discretion.
  *   *(Label: Particularism / Contextualism)*

  ---

  #### Post-Tree Analysis

  **1. Unseparated Leaves**
  *   **The Proxy (4) and The Penitent (5):** These two positions are separated only by Q5 (Guilt). In practice, someone who believes the *Office* authorized the act (Q4-A) often feels they shouldn't personally feel guilt (Q5-A). However, it is logically possible to believe the Office authorized the act but that the Human still feels the stain. The tree separates them, but in the real world, these views often blur because people who claim "I was just doing my job" rarely want to feel guilty about it.
  *   **The Technocrat (6) and The Calculator (1):** Both reject guilt. The difference is that The Calculator (Q1-A) thinks the act was *right*, while The Technocrat (Q1-B) thinks the act was *wrong but necessary* and guilt is a distraction. This is a subtle psychological distinction that may not change how they govern, only how they explain themselves.

  **2. Empty Combinations**
  *   **Q1-B (Wrong) + Q3-A (Admirable Refusal) + Q6-A (Secrecy OK):** *Why empty?* If you believe refusing the wrong act is admirable (The Purist), you generally believe the act is too toxic to be done at all. Believing it is admirable to refuse *but* that the act could be justified if kept secret is incoherent. If it's too wrong to do, secrecy doesn't fix it.
  *   **Q2-A (Different Code) + Q5-B (Guilt Necessary):** *Why empty?* If you believe politics has a *different* moral code (The Realist), you typically do not feel guilt for following that code. Feeling guilt implies you still subscribe to the universal code you claimed didn't apply. This view is coherent but psychologically rare (a Realist who feels like a Purist).
  *   **Q4-A (Office Author) + Q6-B (Publicity Needed):** *Why empty?* If the Office is the author, the act is usually institutional. If the act requires permanent secrecy to work (Q6), it usually cannot be institutionalized. However, this combination isn't strictly empty, merely unstable: an official act that must be denied by the institution is a contradiction.

  **3. Uncertainties and Axes Critique**
  *   **The "Clock" Axis (Q7):** I am unsure if this is a genuine moral axis or merely an epistemic one. Q7 asks if failure makes the act retroactively wrong. This conflates *moral justification* with *success*. A view that says "It was right to try, even if it failed" is distinct from "It was only right because it worked." I suspect the "Clock" is not a standalone axis but a subset of **The Calculator** view (outcomes matter) versus **The Purist** view (intentions matter). I kept it as a split because it captures the specific anxiety of political risk, but it may collapse into Q1.
  *   **The "Receipt" Axis (Q6):** This axis (Secrecy vs. Publicity) is the most fragile. It assumes that "justification" requires an audience. Some philosophers argue that an act can be justified before God or Conscience without Publicity. I forced a split here to capture the "Noble Lie" view, but it may be that Secrecy is just a practical constraint, not a moral category.
  *   **Suggested Replacement:** I would consider replacing **Q2 (The Code)** with a question about **Complicity**. Instead of asking if the code is different, ask: *"If you do the wrong thing, are the citizens who benefit also guilty?"* This would better distinguish between the leader as a sole scapegoat (The Penitent) and the leader as an agent of the public will (The Accountant). The current tree focuses heavily on the leader's internal state; a question about the public's share of the burden might map the political space more accurately.
