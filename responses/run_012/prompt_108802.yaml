answer: |-
  1. The project asks whether mandatory universal service in a neutral state is morally justified when its primary function is to signal non-aggression rather than to maximize defensive capacity. It seeks to determine if the constitutive role of a militia in establishing credible neutrality outweighs the liberal presumption against coercive bodily conscription.

  2. Standard normative frameworks evaluate conscription solely by weighing the justice of the cause against the burden imposed on the conscript as a prospective combatant. These accounts cannot resolve the specific case of neutrality because they treat military structure as instrumental to defense, ignoring the communicative function of force posture in maintaining neutral status.

  3. I will employ conceptual analysis and reflective equilibrium to test the coherence of signaling-based justifications against standard rights-based objections. This normative approach is preferable to empirical deterrence research, which cannot adjudicate moral permissibility. It also avoids the overbreadth of general political obligation theory, which obscures the specific mechanics of neutral signaling.

  4. A successful outcome will be a refined principle distinguishing when conscription constitutes a political status versus when it merely exploits citizens for diplomatic signaling. The project fails if it cannot reconcile the use of conscripts as signals with the requirement that state coercion must serve the conscript's own security or legitimate collective defense.

  5. Twelve months allows for a complete normative mapping of the signaling argument and its compatibility with liberal autonomy constraints. Attempting to incorporate comparative case studies of specific neutral states would exceed the timeframe. Similarly, developing a broader theory of international recognition would shift the focus from normative theory to political science.
