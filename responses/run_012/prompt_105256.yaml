  (iv) **My Bet:** I bet on **Safety**. The colleague's rulings track modal risk rather than mere opacity. In the Friend case, KK fails specifically because error was easy ("might easily have been teasing"), not merely because the source was external. Conversely, the Red Patch grants KK because perception in good light is modally robust. The Instrument case explicitly mirrors the Red Patch's safety ("could not easily have been wrong") while removing the Friend case's risk. Although Access fits the internal cases (Pain/Thinking), it struggles to explain why the Red Patch (external world) grants KK while the Friend (external world) does not, unless safety is the hidden variable. The colleague treats KK as luminous only when the environment cooperates to make error impossible.

  (v) **Separating Case:** To separate Safety from Certainty: A subject forms a belief via a reliable instrument (Safe) but feels acute anxiety about its accuracy (Uncertain). Safety predicts KK (environment is secure); Certainty predicts ¬KK (subject lacks confidence). This isolates the external modal condition from the internal phenomenological state, determining whether her policy privileges truth-conduciveness or subjective assurance for higher-order knowledge.
