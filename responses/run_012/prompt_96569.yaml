  I write optimizing compilers for a living. My working vocabulary is SSA-form IR, lowering, inlining and devirtualization, as-if/observational equivalence, undefined behaviour, dead code elimination, register allocation, and debug info that reconstructs a source-level story from a machine-level trace. I know the causal exclusion argument about as well as a good undergraduate does: supervenience, the causal closure of the physical, causal inheritance, the overdetermination horn, the epiphenomenalism horn, explanatory exclusion, and the difference between the plain exclusion argument and the longer supervenience argument. I am not an expert and I do not know the secondary literature.

  Please restate that argument, and the state of play around it, in the vocabulary I actually use — level by level, premise by premise, horn by horn — as faithfully as you can, and then tell me what did not survive the translation.

  Work in this order. First, build the level map: pair each level of description in the metaphysics with a level in a compilation pipeline, and say for each pair whether it lines up cleanly, only under strain, or not at all. Second, walk the argument through in compiler terms, keeping its logical form intact: which premise becomes which claim about the source text, the IR, and the executed machine code, and what the two horns become. Do not let the translation flatter my vocabulary — where the compiler picture has no room for a premise, say so rather than replacing it with something my framework happens to have. Third, the residue report, which is the part I care about most: everything in the philosophical debate that cannot be said at all in my terms, plus everything that can be said only by distorting it. For each item, say whether the loss is a poverty of my vocabulary, or a sign that the original claim was doing less work than it looked. Fourth, a smuggling report: every place where you had to import an assumption from compiler engineering — that there is a specification, that someone designed the levels, that equivalence was stipulated rather than discovered — and passed it off as translation.

  Then the verdict I actually want. Does the exclusion problem look like an artifact of a picture on which levels compete for causal work — a picture that a translation relation structurally forbids, since nobody thinks the source text and the emitted code are rival causes of the program's output? Or does my vocabulary hide something that the philosophy is right to insist on, something about the mental that has no compiler counterpart at all? And tell me which premise the compiler picture makes look inevitable and which it makes look like an optional modelling choice.

  Do not give me a reading list, citations, or names of papers. If a step of the argument is contested in ways I would have to read the literature to adjudicate, say that plainly and move on.

  Return a single JSON object and nothing else, with exactly these fields:

  - "level_map": array of objects with "philosophical_level" (string), "compiler_counterpart" (string), "fidelity" (one of "clean", "strained", "no-counterpart"), "note" (string).
