  - "residue": array of objects with "item" (string), "category" (one of "concept", "premise", "normative_claim"), "why_it_fails_to_translate" (string), "diagnosis" (one of "target-vocabulary-too-poor", "source-claim-overstated", "genuine-disagreement").
  - "smuggling_report": array of objects with "location" (string; which step or mapping), "assumption_imported" (string), "why_it_is_not_translation" (string).
  - "verdict": object with "artifact_or_not" (string), "what_my_vocabulary_hides" (string), "what_the_philosophy_overreads" (string), "inevitable_premise" (string), "optional_premise" (string).
  - "bottom_line": string of at most 120 words, in plain prose, stating whether my framework dissolves the problem, relocates it, or turns out to be irrelevant to it.

  Strings may run to several sentences. Be analytic and unhedged; where the translation forces a verdict on the argument, state it.
