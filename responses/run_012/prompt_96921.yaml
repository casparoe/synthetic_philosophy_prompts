answer: |-
  Here is the decision procedure, the test runs, and the critique you asked for. I have stripped the jargon from the checklist itself but grounded the logic in the literature you know (Hacking's looping effects, Haslanger's ameliorative analysis, Searle's status functions, Boyd's HPCs).

  ### Part 1: The Decision Procedure
  **Purpose:** To determine whether a data category should be collected, how it should be labeled, and whether its collection carries specific risks.
  **Users:** Clinicians, Informaticists, Legal, Administrators.
  **Scope:** One category at a time (e.g., "Race," "Insurance Status," "Blood Type").

  **Step 1: The Purpose Test (Ameliorative)**
  *   **Question:** What specific question are we trying to answer with this data?
  *   **Sufficient Answer:** A concrete operational goal (e.g., "To allocate interpreter services," "To assess cardiovascular risk," "To audit for billing disparities").
  *   **Fail Condition:** "Because we always have," "Because it's standard," or "To know who they are."
  *   **Note:** If the purpose is unclear, stop. Do not collect the data.

  **Step 2: The Mechanism Test (Causal vs. Constitutive)**
  *   **Question:** What makes it the case that a patient falls into this category?
  *   **Sufficient Answer:** Identify the primary driver.
      *   *Biological/Physical:* (e.g., Presence of an antigen).
      *   *Social Assignment:* (e.g., How a receptionist perceives them).
      *   *Self-Identification:* (e.g., How the patient defines themselves).
      *   *Institutional Status:* (e.g., What an insurance company recognizes).
  *   **Note:** A category can have multiple drivers. List all that apply.

  **Step 3: The Reactivity Test (Interactive vs. Indifferent)**
  *   **Question:** If we stopped measuring and labeling this category tomorrow, would the underlying phenomenon change or disappear?
  *   **Sufficient Answer:**
      *   *No (Indifferent):* The phenomenon exists regardless of measurement (e.g., Blood type, Gravity).
      *   *Yes (Interactive):* The classification itself helps sustain or alter the phenomenon (e.g., "High Risk" labels, Credit Scores, Racial categories).
  *   **Warning:** If "Yes," collecting this data is an *intervention*, not just observation.

  **Step 4: The Substitution Test (Proxy Check)**
  *   **Question:** Are we using this category as a proxy for something else? If so, what?
  *   **Sufficient Answer:** Identify the target variable (e.g., "Using 'Race' as a proxy for genetic ancestry," or "Using 'Zip Code' as a proxy for environmental exposure").
  *   **Decision Rule:** If the proxy is less accurate than the target, and the target is measurable, switch to the target. If the target is not measurable, flag the proxy as "Imprecise."

  **Step 5: The Values Handoff (Stop Point)**
  *   **Question:** Does the benefit of tracking this (Step 1) outweigh the risk of reinforcing the category (Step 3) or the harm of misclassification (Step 2)?
  *   **Procedure:** If Step 1 (Purpose) conflicts with Step 3 (Reactivity), **stop the procedure.** This is no longer an ontological question; it is an ethical and legal policy decision. Refer to the Committee Chair and Legal Counsel.

  ***

  ### Part 2: The Forbidden Inferences
  **Explicit List of Invalid Moves**
  *Print this and tape it to the conference room wall.*

  The finding that a category is "Socially Constructed" **does not license** the following moves:

  1.  **Constructed $\rightarrow$ Bogus:** You cannot conclude the category is fake. (Money is constructed, but bankruptcy is real).
  2.  **Constructed $\rightarrow$ Arbitrary:** You cannot conclude the category is random. (Gender is constructed, but governed by strict social norms).
  3.  **Constructed $\rightarrow$ Easy to Change:** You cannot conclude we can stop using the category without consequence. (Institutional facts are hard to break).
  4.  **Constructed $\rightarrow$ Safe to Delete:** You cannot conclude that removing the category removes the disparity. (Deleting "Race" from forms does not delete racism from the treatment room; it just makes it untrackable).
  5.  **Constructed $\rightarrow$ Biological:** You cannot assume a social category maps to a genetic cluster without evidence.

  ***

  ### Part 3: Test Runs

  #### 1. Control Case: Money (Insurance Payer Type)
  *   **Step 1 (Purpose):** Determine reimbursement rates and patient financial counseling needs.
  *   **Step 2 (Mechanism):** Institutional Status. Exists only because of contracts between hospitals, states, and employers.
  *   **Step 3 (Reactivity):** Interactive. If we stop recognizing "Medicaid," the financial safety net collapses. The label creates the status.
  *   **Step 4 (Substitution):** Not a proxy. It *is* the contractual status.
  *   **Step 5 (Values):** High utility, high reactivity.
  *   **Verdict:** **Keep.** It is fully constructed but ontologically robust within the system. Deleting it stops the hospital from functioning.
  *   **Lesson:** Construction does not mean "optional."

  #### 2. Case: Gender
  *   **Step 1 (Purpose):** Mixed. (A) Hormonal/physiological risk assessment. (B) Respectful communication/identity.
  *   **Step 2 (Mechanism):** Split. *Physiology* is biological (mostly). *Identity* is constitutive (self/social). *Presentation* is social assignment.
  *   **Step 3 (Reactivity):** Highly Interactive. Medical misclassification causes harm (dysphoria, mistrust). Tracking it reinforces the binary if not done carefully.
  *   **Step 4 (Substitution):** Often used as a proxy for "Hormone Levels" or "Organ Inventory."
  *   **Step 5 (Values):** Conflict detected. Purpose A requires physiology; Purpose B requires identity.
  *   **Verdict:** **Split the Field.** Do not use one box. Collect "Gender Identity" (for interaction) and "Organ Inventory/Physiology" (for risk).
  *   **Lesson:** One label is doing two different ontological jobs. Separate them.

  #### 3. Case: Race
  *   **Step 1 (Purpose):** (A) Clinical algorithm adjustment (e.g., kidney function). (B) Equity auditing (tracking disparities in wait times/pain management).
  *   **Step 2 (Mechanism):** Social Assignment & Self-Id. Weak correlation with genetic ancestry; strong correlation with social treatment.
  *   **Step 3 (Reactivity):** Highly Interactive. Measuring race reinforces the salience of racial categories (Looping Effect).
  *   **Step 4 (Substitution):**
      *   For Purpose A (Clinical): It is a poor proxy for genetics and a strong proxy for *social exposure* (racism/stress).
      *   For Purpose B (Equity): It is the direct measure of the social phenomenon (racism requires racialization).
  *   **Step 5 (Values):** **Conflict Detected.**
      *   For Purpose A: Using race reinforces the idea of biological difference.
      *   For Purpose B: *Not* using race hides the disparity.
  *   **Verdict:** **Keep for Equity Auditing; Delete for Clinical Calculation.**
      *   *Reasoning:* You cannot fight a disparity you do not measure (Purpose B wins). However, you cannot use a social category to adjust biological baselines without evidence (Purpose A fails Substitution Test).

  ***

  ### Part 4: The Uncomfortable Result
  **The Race-and-Medicine Paradox**

  Here is the result you (the philosopher) might dislike: The procedure mandates **retaining** the "Race" category for equity auditing, explicitly acknowledging that doing so contributes to the *looping effect* (Hacking) that keeps the category real.

  The procedure forces the committee to admit that to dismantle the harmful effects of racialization, they must continue to racialize patients in the database. It prioritizes the *ameliorative political goal* (tracking racism) over the *ontological hygiene* (not reifying race).

  As a social ontologist, you might argue that this perpetuates the very status function that causes the harm. The procedure's answer is: "Yes, but if you drop it, the racism becomes invisible, and the harm increases." It forces a pragmatic complicity in the construction of race to mitigate the suffering that construction causes. There is no clean hands option here, and the checklist makes that dirt visible.

  ***

  ### Part 5: Limitations & The Axis Critique

  **Where This Procedure Misfires**
  1.  **Dynamic Categories:** This procedure is a snapshot. Interactive kinds change *while* you measure them. A category that passes Step 3 today might fail it in five years (e.g., the shifting boundaries of "Autism" or "Non-Binary"). The committee must re-run this biannually.
  2.  **Hidden Mechanisms:** Clinicians may lie on Step 4. They may claim "Race" is for "Genetics" when it is actually for "Workflow sorting." The procedure relies on honest self-reporting of purpose.
  3.  **Resource Constraints:** Step 4 (Substitution) often suggests measuring the *actual* cause (e.g., "lead exposure" instead of "zip code"). The hospital may not have the budget to measure the cause, forcing them to keep the proxy. The procedure flags this as "Imprecise," but doesn't solve the budget issue.

  **The "Natural vs. Social" Axis Critique**
  You asked me to say it plainly if the axis is wrong. **It is.**

  Running on "Natural vs. Social" is a category error for a hospital.
  *   **Why:** A virus is "natural," but a pandemic is "social." A broken leg is "natural," but access to the orthopedist is "social."
  *   **The Better Axis:** **Causal Pathway to Health Outcome.**
      *   Does this category track a *biological mechanism*? (e.g., Sickle Cell Trait).
      *   Does this category track a *social mechanism*? (e.g., Race as a proxy for exposure to discrimination).
      *   Does this category track an *institutional mechanism*? (e.g., Insurance status).

  **Why Step 4 Exists:**
  Step 4 exists to force the committee to move from the "Natural/Social" debate (which is metaphysical) to the "Proxy/Target" debate (which is epidemiological).

  If the committee asks you at the next meeting, *"Why is Step 4 here instead of asking if the category is real?"*
  **Your Answer:** "Because 'Real' doesn't kill patients. 'Bad Proxies' do. Step 4 ensures we aren't treating a social problem with a biological fix, or vice versa."

  **Final Advice:**
  Do not sell this as ontology. Sell it as **risk management for data validity.** The lawyer will sign off on it, the epidemiologist will understand it, and it smuggles the social ontology in through the back door of data hygiene.
