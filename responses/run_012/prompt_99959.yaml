  Here is the case, the work, and the analysis.

  **The Case**
  You oversee a hospital ward with forty patients categorized by Symptom ($S$) and Disease ($D$). Your current records show: 5 patients have both ($S \land D$), 20 have Symptom but no Disease ($S \land \neg D$), 5 have Disease but no Symptom ($\neg S \land D$), and 10 have neither ($\neg S \land \neg D$). Your prior probability of Disease given Symptom is $5/25 = 0.2$. A new study arrives with a conditional report: "Among patients presenting with Symptom $S$, the probability of Disease $D$ is $0.5$." This does not tell you how many patients have the Symptom, only the ratio within that group.

  **The Work**
  We convert the counts to probabilities (dividing by 40) and apply the three rules to find the new distribution $Q$.
  *Prior:* $P(S, D)=0.125$, $P(S, \neg D)=0.5$, $P(\neg S, D)=0.125$, $P(\neg S, \neg D)=0.25$.
  *Constraint:* $Q(D|S) = 0.5 \implies Q(S, D) = Q(S, \neg D)$.

  *   **(a) The Naive Rule:** This rule treats the message as a factual exclusion, conditioning on the material conditional "If $S$ then $D$" (logically equivalent to $\neg S \lor D$). This eliminates the $S \land \neg D$ cell entirely. We remove the 0.5 probability mass from that cell and renormalize the remaining 0.5 mass.
      *   **Result:** $Q(S, D) = 0.25$, **$Q(S, \neg D) = 0$**, $Q(\neg S, D) = 0.25$, $Q(\neg S, \neg D) = 0.5$.

  *   **(b) The Entropy Rule:** This rule minimizes the information gain (KL-divergence) subject to the constraint. It preserves the odds in the unconstrained $\neg S$ row and scales the $S$ row to meet the 50/50 ratio while keeping the total probability of $S$ fixed (a standard assumption for local constraints). The $S$-row mass (0.625) is split evenly.
      *   **Result:** **$Q(S, D) = 0.3125$**, **$Q(S, \neg D) = 0.3125$**, $Q(\neg S, D) = 0.125$, $Q(\neg S, \neg D) = 0.25$.

  *   **(c) The Minimax Rule:** This rule minimizes the largest single change to any cell. To satisfy $Q(S, D) = Q(S, \neg D)$ with minimal disruption to the priors (0.125 and 0.5), we meet at the midpoint (0.3125). This creates a maximum change of 0.1875. Shifting mass from the $\neg S$ row would increase this maximum change, so the $\neg S$ row stays fixed.
      *   **Result:** **$Q(S, D) = 0.3125$**, **$Q(S, \neg D) = 0.3125$**, $Q(\neg S, D) = 0.125$, $Q(\neg S, \neg D) = 0.25$.
      *(Note: In this symmetric setup, (b) and (c) converge numerically, but they diverge from (a) radically. In asymmetric setups, (b) and (c) also diverge from each other.)*

  **The Disagreement**
  The rules disagree fundamentally on the status of the $S \land \neg D$ cell. Rule (a) sets its probability to **zero**, effectively ruling out the possibility of a patient having the symptom but not the disease. Rules (b) and (c) assign it **0.3125**, acknowledging that a 50% conditional risk implies the negative case is still very much possible.

  **The Feature Doing the Work**
  The divergence is caused by the **underdetermination of the marginal probability**. Learning a conditional probability $P(D|S)=x$ constrains the *ratio* of two cells, but not their *sum*. Rule (a) bypasses this by treating the conditional as a logical fact (material implication), which forces the denominator to shrink (by eliminating $\neg D$ cases). Rules (b) and (c) respect the probabilistic nature of the message, preserving the possibility of $\neg D$, but they must invoke different principles (minimum information vs. minimum worst-case shift) to decide how much total mass to assign to the $S$ group.

  **The Reverse Check**
  If your message had handed you an **unconditional probability** (e.g., "The probability of $S$ is now 1.0"), all three rules **would collapse** back to ordinary conditioning.
  *   (a) Conditioning on the fact "$S$ is true" eliminates all $\neg S$ cells.
  *   (b) Minimizing entropy subject to $P(S)=1$ forces all $\neg S$ mass to zero.
  *   (c) Minimizing max-change subject to $P(S)=1$ also forces $\neg S$ mass to zero.
  When the message pins down a fact (probability 1 or 0), the "ratio vs. sum" ambiguity vanishes, and the rules converge.

  **The Defense of Rule (b)**
  A defender of the Entropy Rule (b) would argue that your example doesn't count against the rule because Rule (a) is committing a category error, not offering a competing valid update. The "Naive" rule treats a probabilistic constraint as a logical exclusion, which is simply incorrect reasoning. Between (b) and (c), the defender of (b) argues that **commutativity** is the deciding feature: if you receive two independent conditional reports in sequence, Rule (b) yields the same final distribution regardless of the order you process them. Rule (c) (Minimax) does not guarantee this; the order of updates can change the final result. For a legal or scientific standard where consistency matters more than worst-case bounds, Entropy minimization is the only rule that ensures the order of evidence doesn't alter the verdict.
