answer: |-
  This is an excellent philosophical intuition. You have correctly identified that the word "know" is acting as a pivot point in your teacher's argument. In philosophy, this is often called an **epistemic objection** to consequentialism. The specific argument your teacher is referencing is known in the literature as **"The Problem of Cluelessness"** (most famously articulated by James Lenman and Peter Vallentyne).

  However, your teacher is making a leap from a plausible premise (the future is uncertain) to a radical conclusion (consequence-based ethics is hopeless). To help you discuss this with her, I have arranged the possible interpretations of her claim into a "menu," graded from the trivial (hard to deny) to the radical (hard to defend).

  ### The Menu of Claims

  Here are four distinct interpretations of the slogan "nobody can ever really know what they are doing," arranged by the strength of the epistemic limitation they posit.

  #### 1. The Claim of Imperfect Foreknowledge (Trivial)
  *   **The Claim:** Human beings cannot predict the distant future with 100% certainty. Unintended side effects often occur.
  *   **Meaning of "Know":** To know = to have **certainty** (infallible truth).
  *   **Verdict:** **True.** Obviously, we are not omniscient. We cannot know if saving a child today will result in them becoming a tyrant in 40 years.
  *   **Does it kill Consequentialism?** **No.** No serious consequentialist theory requires omniscience. They judge actions based on *expected* value or *reasonable foresight*, not actual distant outcomes.
  *   **What people usually mean:** When laypeople use the "road to hell" slogan, this is usually what they mean. It is a warning against arrogance, not a metaphysical argument.

  #### 2. The Claim of Practical Incalculability (Moderate)
  *   **The Claim:** Even if we could assign probabilities, the causal web is so vast that calculating the net value of an action is too cognitively demanding for any agent.
  *   **Meaning of "Know":** To know = to **compute** a precise utility score within a reasonable time.
  *   **Verdict:** **Defensible.** It is true we cannot do the math for every ripple.
  *   **Does it kill Consequentialism?** **No.** This leads to **Rule Consequentialism** or the use of **heuristics**. We follow rules (e.g., "don't lie") because following them generally produces good consequences, saving us the need to calculate every time.
  *   **What people usually mean:** Teachers often mean this when pressing students on "real world complexity."

  #### 3. The Claim of Probabilistic Indeterminacy (Strong)
  *   **The Claim:** The causal chain is so sensitive (chaotic) that we cannot even assign meaningful *rough probabilities* to distant outcomes. The "expected value" of an action is mathematically undefined because the positive and negative ripples cancel each other out or are infinite.
  *   **Meaning of "Know":** To know = to assign a **reliable probability distribution** (even a rough one).
  *   **Verdict:** **Overstated.** While distant effects are hard to gauge, near-term effects are not. We know with high probability that shooting someone causes death and suffering, regardless of what happens 100 years later.
  *   **Does it kill Consequentialism?** **Maybe.** This is the actual "Cluelessness Objection" in academic ethics. If expected value is undefined, maximizing it is impossible. However, most consequentialists argue that near-term consequences dominate the calculation enough to make decisions possible.
  *   **What people usually mean:** This is what professional philosophers mean when they discuss "Cluelessness." It is a technical objection, not a folk wisdom one.

  #### 4. The Claim of Radical Epistemic Skepticism (Radical)
  *   **The Claim:** Because the future is open/chaotic, there is *no fact of the matter* about what an action is "doing" until it is done. We are not just ignorant of the consequences; the consequences do not yet exist to be known.
  *   **Meaning of "Know":** To know = to refer to an **existing metaphysical truth**.
  *   **Verdict:** **False/Highly Controversial.** This denies basic causality. Even if the future is open, our actions alter probabilities in the present.
  *   **Does it kill Consequentialism?** **Yes.** If actions have no determinate moral character regarding outcomes, consequentialism collapses.
  *   **What people usually mean:** Almost no one means this, as it undermines almost all rational decision-making (not just ethics).

  ---

  ### Critical Analysis for Your Discussion

  Here are the three specific points you raised, analyzed through the menu above.

  #### 1. Does "Cannot Know" mean "Cannot Calculate" or "Cannot Assign Probabilities"?
  Your teacher needs **Claim #3** (Probabilistic Indeterminacy) to make her case that consequentialism is *hopeless*.
  *   If she only means **Claim #1** (Certainty is impossible), she is attacking a straw man. Consequentialists agree we can't be certain; they argue we should aim for the *best bet*.
  *   If she means **Claim #2** (Calculation is hard), she has only proven that we need rules of thumb, not that we should abandon consequences entirely.
  *   **The Trap:** She is likely using the truth of Claim #1 to smuggle in the conclusion of Claim #3. You can point out that while we can't know the *infinite* ripple, we can usually know the *immediate* wave. Ethics mostly concerns the immediate wave.

  #### 2. Would this argument sink every other way of judging actions?
  **Yes.** This is your strongest counter-argument. This is known as the **"Self-Defeating Objection."**
  *   **Deontology (Rules/Duties):** To follow a rule (e.g., "Do not lie"), I must know what counts as a lie and know that I am choosing to do it. If I am "clueless" about what I am doing, I cannot know if I am following the rule.
  *   **Virtue Ethics (Character):** To be courageous, I must know what the dangerous situation is. If I am clueless about the consequences of my actions, I cannot know if I am acting bravely or recklessly.
  *   **The Point:** If "cluelessness" is severe enough to kill consequentialism, it kills *agency* itself. If we are truly clueless about what we are doing, we cannot be moral agents at all. Since we *are* moral agents, the cluelessness cannot be that radical.

  #### 3. Is the Moderate Reading enough to reach her conclusion?
  **No.** There is a logical gap between the premise and the conclusion.
  *   **Premise (Moderate):** We often cannot foresee exactly how things turn out (Claim #1 or #2).
  *   **Conclusion (Radical):** We should give up on judging actions by consequences altogether.
  *   **The Missing Link:** This conclusion only follows if the *only* valid form of consequentialism requires perfect foreknowledge.
  *   **The Fix:** Most ethicists adopt **Subjective Consequentialism**. This view holds that the right action is the one that the agent *reasonably believes* will produce the best consequences, given the available evidence. This accommodates the "cluelessness" problem without abandoning the framework. Your teacher is ignoring this standard solution.

  ### How to Present This to Your Teacher

  You might say something like this:

  > "I've been thinking about the 'Problem of Cluelessness.' It seems there are different strengths of this claim.
  >
  > If the claim is just that we can't have **certainty** about the infinite future, that seems true, but it only defeats a version of consequentialism that demands omniscience. It doesn't defeat **Subjective Consequentialism**, which asks us to maximize *expected* value based on available evidence.
  >
  > However, if the claim is that we can't even assign **rough probabilities** to the near-term effects of our actions, that seems to prove too much. If I'm that clueless about consequences, I'm also too clueless to know if I'm following a duty or acting virtuously.
  >
  > So, does the argument require the radical claim (that probabilities are impossible) to work? And if so, doesn't that skepticism destroy moral agency entirely, rather than just consequentialism?"

  ### Summary Verdict
  *   **The Slogan:** "The road to hell is paved with good intentions."
      *   **Verdict:** **Defensible as advice, False as ethics.** It is good advice to check outcomes, but false as an ethical theory because intentions *do* matter for blameworthiness, even if outcomes matter for rightness.
  *   **The Teacher's Argument:**
      *   **Verdict:** **Overstated.** She is using a moderate epistemic problem (we can't see the future) to justify a radical meta-ethical conclusion (consequences don't matter).
  *   **Your Instinct:**
      *   **Verdict:** **Correct.** The word "know" is doing the heavy lifting. Once you define "know" as "have reasonable evidence for probable outcomes," the argument collapses.
