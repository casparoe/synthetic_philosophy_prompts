          *   *Where Hacking distorts:* Hacking implies a certain reciprocity. Gilman shows a crushing weight where reciprocity is impossible *in the moment*. The "loop" is delayed until the story is read by the public. To force a tight loop *within* the narrative timeframe risks softening the tragedy of her silencing.

