prompt: |-
  I run a small regional museum — 40,000 objects, four full-time staff, an endowment that covers about half our operating costs. Twice in the last five years the board has had to consider selling something to keep the lights on, and both times we muddled through on vibes and one very loud trustee. I want a procedure we can actually run in a 45-minute board meeting the next time a sale is proposed, and I want it built on the philosophy of hard choices rather than on museum-sector boilerplate — I already know the professional ethics say dont do it, and that isn't much help when the alternative is closing the doors. The board is nine people, none of whom have read any philosophy, and they're the ones who sign off.

  Here's the toolkit I've assembled from my reading, and it's what I want the procedure built on. (1) Two options can be such that neither is better, neither is worse, and they aren't equal either — call that being on a par. The test: improve one of them slightly; if it still isn't better than the other, they were never equal, so don't call it a tie and don't just flip a coin. (2) Incomparability is local, not global: two things can be on a par while each is clearly better or worse than plenty of other things, so you can often get a real answer by comparing neighbours instead of hunting for a common currency. (3) But if you let yourself chain small, individually plausible improvements, you can prove a paperclip is worth more than a Rembrandt, so anything leaning on (2) needs a tripwire for chains. (4) When two options are on a par, committing to one can itself make it the thing to do — choosing isn't just what happens after the weighing is over.

  Turn that into a decision procedure: the questions in order, what counts as an answer good enough to move on, where it stops with a no, where it has to hand the decision to a person because the fight is about values rather than facts, and how to tell when the procedure is doing real work versus laundering a decision somebody already made. Then run it on three proposals: selling a middling landscape by a name people have heard of, to replace the roof; selling a small object that a descendant community says was taken from them; and selling the one picture in the collection good enough to be on a postcard, which would fund about a decade of operations. I expect to dislike at least one of the answers, that's fine. And tell me what the procedure can't do.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Director of a small regional museum (40k objects, 4 staff, 50% endowment coverage).
      *   **Problem:** Financial precarity (considered deaccessioning twice in 5 years). Needs a concrete procedure for a 45-minute board meeting.
      *   **Philosophical Framework:** Ruth Chang's concept of "Hard Choices" (Parity, Incomparability, Small Improvements/Chaining, Commitment/Will).
      *   **Constraints:** 9 board members (no philosophy background), 45-minute time limit, needs to distinguish fact-finding from value-judgments, needs to prevent "decision laundering."
      *   **Task:** Create the procedure, then apply it to three specific scenarios (Roof/Landscape, Repatriation/Small Object, Survival/Postcard Picture), and identify limitations.
      *   **Tone:** Pragmatic, rigorous, unsentimental, actionable. Acknowledge the tension between ethics and survival.

  2.  **Deconstruct the Philosophical Toolkit:**
      *   *(1) Parity:* Not better, not worse, not equal. (The "Hard Choice" zone).
      *   *(2) Local Incomparability:* Compare neighbors, don't seek a universal currency (e.g., dollars vs. meaning).
      *   *(3) Anti-Chaining Tripwire:* Prevent slippery slopes (Paperclip vs. Rembrandt).
      *   *(4) Commitment:* The choice creates the reason. Willpower is part of the rationality.

  3.  **Drafting the Procedure (The "45-Minute Protocol"):**
      *   *Goal:* Move from "Should we sell?" to "Which path do we commit to?" without pretending there's a mathematically correct answer.
      *   *Time Management:* 45 minutes is tight. Need strict phases.
      *   *Phase 1: The Threshold (Facts).* Is this actually a hard choice? Or is one option clearly better/worse? (10 mins).
      *   *Phase 2: The Parity Check (Comparison).* Are we in the "on a par" zone? Use local comparison, not universal currency. (15 mins).
      *   *Phase 3: The Chain-Breaker (Limits).* Does this set a precedent that destroys the collection's integrity? (10 mins).
      *   *Phase 4: The Commitment (Will).* If parity holds, who commits to making it right? (10 mins).
      *   *Decision Laundering Check:* Need a specific mechanism to call out when someone is pretending facts solve a value problem.

  4.  **Refining the Steps (Iterative Process):**
      *   *Critique:* Is "Parity" too abstract for a board?
      *   *Fix:* Translate "Parity" into "The Toss-Up Test." If a small improvement to Option A doesn't make it clearly better than Option B, they are on a par.
      *   *Critique:* How to handle the "Chain-Breaker"?
      *   *Fix:* The "Precedent Lock." Ask: "If we do this, can we refuse to do it next year for a smaller reason?"
      *   *Critique:* How to handle Commitment?
      *   *Fix:* The "Authorship Question." Who owns the consequence?

  5.  **Applying the Procedure to the Three Cases:**

      *   **Case 1: Middling Landscape for Roof.**
          *   *Facts:* Roof is safety/compliance. Landscape is "middling."
          *   *Parity:* Is a dry building on a par with keeping a middling object? Likely not. Building wins on safety grounds unless the object is culturally critical.
          *   *Chain:* Does selling a "middling" name piece open the door to selling "good" name pieces?
          *   *Verdict:* Likely Yes (Sell), but needs strict precedent locking.

      *   **Case 2: Small Object/Descendant Community.**
          *   *Facts:* Ethical claim vs. Financial need.
          *   *Parity:* This is the core hard choice. Money vs. Justice/Relationship.
          *   *Chain:* If we return it to save money (sell back?), that's different than repatriation. Wait, the prompt says "selling... that a descendant community says was taken." This implies selling to a third party *despite* the claim, or selling *to* them? Usually, this means deaccessioning to a buyer while a claim exists. That's toxic.
          *   *Correction:* If the community says it was taken, selling it to a dealer is ethically fraught. Returning it isn't "selling." The prompt says "selling...". Okay, assume selling to a third party to raise cash while a claim is pending.
          *   *Verdict:* Hard No. The reputational and ethical cost creates a "worse" rating, not parity.

      *   **Case 3: The Postcard Picture for 10 Years Ops.**
          *   *Facts:* Survival vs. Core Identity.
          *   *Parity:* This is the true Hard Choice. 10 years of life vs. the soul of the museum.
          *   *Chain:* Selling the *best* thing sets the worst precedent.
          *   *Commitment:* If you sell it, you must commit to a new mission (we are a service org, not a collection org).
          *   *Verdict:* This is the "Hard Choice" proper. The procedure shouldn't solve it, it should force the board to own it.

  6.  **Addressing "What the Procedure Can't Do":**
      *   It can't make the pain go away.
      *   It can't guarantee the financial fix works.
      *   It can't protect against accreditation loss (AAMD/ALA rules). *Self-Correction:* I need to mention the legal/accreditation reality. The prompt asks for a procedure based on *philosophy*, but as a museum director, I know AAMD rules basically forbid using proceeds for operating costs. I must acknowledge this tension. The prompt says "I already know the professional ethics say dont do it." Okay, I will respect that constraint but add a warning label.

  7.  **Final Review against Constraints:**
      *   45 minutes? Yes, timed sections.
      *   9 Board Members? Yes, designed for group dynamics.
      *   Philosophical Toolkit used? Yes (Parity, Local Comparison, Chaining, Commitment).
      *   Decision Laundering? Yes, specific "Stop" questions.

  8.  **Drafting the Content:** (Mental check on tone: Direct, slightly stark, respectful of the difficulty).
      *   *Introduction:* Acknowledge the reality.
      *   *The Protocol:* Step-by-step.
      *   *The Simulations:* Run the three cases.
      *   *The Limitations:* Honest assessment.

      *(Self-Correction during drafting Case 2)*: If a descendant community says it was taken, selling it is effectively impossible in the current climate without destroying the museum's reputation. I need to make sure the procedure highlights this as "Not on a Par" but "Clearly Worse" due to the local comparison of reputation vs. cash.

      *(Self-Correction during drafting Case 3)*: This is the "Survival vs. Soul" choice. The procedure must highlight that *choosing* this changes what the museum *is*.

      *(Refining the "Decision Laundering" check)*: Make it a specific role or moment. "The Devil's Advocate" or "The Red Flag." Let's make it a specific question in each phase.

  9.  **Final Polish:** Ensure the distinction between "Equal" and "On a Par" is clear. Equal = same value. On a Par = different kinds of value that resist comparison.

      *Wait, one crucial detail:* The prompt mentions "selling... to keep the lights on." In the US (assuming US based on "trustee/endowment" lingo), AAMD guidelines strictly prohibit using deaccessioning funds for operating expenses. Doing so leads to sanctions (loss of accreditation, blacklisting by other museums). The prompt acknowledges this ("I already know the professional ethics say dont do it"). I must not ignore this. The procedure must include a "Consequence Check" regarding accreditation, even if the philosophical framework is the focus. I will add this to the "Threshold" phase as a factual constraint.

      *Wait, re-reading the prompt:* "I want it built on the philosophy of hard choices rather than on museum-sector boilerplate." Okay, I will prioritize the philosophy but add the accreditation risk as a "Fact" in Phase 1, not an ethical veto.

      *Let's build the "Tripwire" for Chaining:* This needs to be concrete. "If we do this, what is the *next* thing we sell?" If the answer is "Something slightly less important," the chain is active.

      *Let's build the "Commitment":* This needs to be about making the choice right through will. "If we sell the postcard, what do we become?"

      *Okay, ready to write.*
answer: |-
  This is a **45-Minute Hard Choice Protocol**. It is designed for nine non-philosophers under pressure. It does not tell you what is right; it tells you when you are pretending facts solve a value problem, and it forces you to own the choice.

  ### The Protocol Structure
  **Time:** 45 Minutes Strict.
  **Role:** The Director facilitates. One Trustee is assigned "Red Flag" duty (to call out decision laundering).
  **Materials:** A whiteboard with four quadrants drawn on it.

  ---

  ### Phase 1: The Threshold (10 Minutes)
  **Goal:** Establish that this is actually a Hard Choice and not a mistake.
  **Philosophy:** Incomparability is local. Before comparing the two options, check if they are comparable at all.

  1.  **The Fact Check:** Are there external rules that make one option impossible? (e.g., AAMD accreditation sanctions, legal title issues, donor restrictions).
      *   *If Yes:* The choice is made. Stop.
      *   *If No:* Proceed.
  2.  **The "Better/Worse" Screen:** Is one option clearly superior on *all* relevant dimensions?
      *   *Test:* If Option A saves the building and Option B saves the building + keeps the object, A is worse.
      *   *Pass Condition:* We acknowledge that Option A gains X (money) but loses Y (collection integrity), while Option B keeps Y but risks Z (closure).
  3.  **The Laundering Check (Red Flag):** Is anyone claiming the financial math *alone* decides this?
      *   *Stop Question:* "If the object were twice as valuable, would we still sell it?" If the answer changes, this is a value choice, not a math choice.

  **Move On If:** The board agrees that money and mission are in conflict, and no external rule forbids the sale.

  ### Phase 2: The Parity Test (15 Minutes)
  **Goal:** Determine if the options are "On a Par."
  **Philosophy:** Parity means neither is better, neither is worse, and they aren't equal. They are in the same neighborhood of value but measured differently.

  1.  **The Small Improvement Test:** Take the financial option (Selling). Imagine the offer is 10% higher. Does that make it *clearly* better than keeping the object?
      *   *If Yes:* They were not on a par; the money option was already winning. Sell.
      *   *If No:* (i.e., 10% more doesn't change the gut feeling that we are losing something vital), they are **On a Par**.
  2.  **Local Comparison:** Do not compare "Object" vs. "Dollars." Compare "Object" vs. "What the Dollars *Do*."
      *   *Prompt:* "We are comparing [Specific Object] against [Specific Outcome: e.g., Roof vs. Mold, not Roof vs. Cash]."
  3.  **The Laundering Check (Red Flag):** Is anyone treating the objects as fungible assets?
      *   *Stop Question:* "Are we saying this object is interchangeable with another? If so, why is it in the collection?"

  **Move On If:** The board admits they are in the "Hard Choice" zone (Parity). The math doesn't solve it.

  ### Phase 3: The Chain-Breaker (10 Minutes)
  **Goal:** Prevent the "Paperclip vs. Rembrandt" slippery slope.
  **Philosophy:** Small, plausible improvements can chain together to justify absurdity. You need a tripwire.

  1.  **The Precedent Lock:** If we approve this sale, what is the *next* sale we are authorizing?
      *   *Requirement:* You must define the "Stop Line." (e.g., "We sell this landscape, but we commit in writing never to sell a work by a living artist," or "Never sell a top 5% object.")
  2.  **The Integrity Test:** Does selling this object destroy the reason the museum exists?
      *   *Test:* If we sell this, can we still truthfully call ourselves a [Regional History/Art] Museum?
  3.  **The Laundering Check (Red Flag):** Is the "Stop Line" vague?
      *   *Stop Question:* "If we are in this same financial spot in 3 years, does this vote allow us to sell something better?" If the answer is Yes, the chain is not broken.

  **Move On If:** A specific, written precedent limit is agreed upon.

  ### Phase 4: The Commitment (10 Minutes)
  **Goal:** Make the choice rational through will.
  **Philosophy:** When options are on a par, the commitment creates the reason. You are not finding the answer; you are authoring it.

  1.  **The Authorship Question:** Who will stand up in five years and say, "I voted for this, and I own the consequence"?
      *   *Action:* Vote must be recorded by name, not anonymous ballot.
  2.  **The Transformation:** If we choose to sell, how do we make it the right choice *after the fact*?
      *   *Prompt:* "If we sell the roof object, we commit to a capital campaign so we never face this again." "If we sell the postcard object, we acknowledge we are now a service organization, not a collecting institution."
  3.  **Final Vote:** Yes/No on the specific proposal with the attached Precedent Lock and Commitment Statement.

  ---

  ### Running the Simulations

  Here is how the protocol handles your three scenarios.

  #### Case 1: The Middling Landscape for the Roof
  *   **Phase 1 (Threshold):** Facts: Roof is safety/compliance. Object is "middling." No legal block. *Pass.*
  *   **Phase 2 (Parity):** Small Improvement Test: If the landscape sold for 10% more, is it clearly better? Probably not. The need is the roof, not the surplus. But is the landscape vital? No. They are likely *not* on a par; the roof is clearly better for the mission of "keeping the doors open."
  *   **Phase 3 (Chain-Breaker):** Risk: Selling "name recognition" art invites selling "better" art next.
      *   *Precedent Lock:* "We sell only objects ranked in the bottom 20% of collection significance. We do not sell top-tier works."
  *   **Phase 4 (Commitment):** Commitment: Proceeds restricted *only* to capital infrastructure, not operations.
  *   **Verdict:** **Proceed.** The procedure identifies this is not a Hard Choice (one option is clearly better for the mission), but it forces a strict limit to prevent the chain from starting.

  #### Case 2: The Small Object / Descendant Community Claim
  *   **Phase 1 (Threshold):** Facts: Community says it was taken.
      *   *Stop:* This triggers the "External Rules/Reputation" check. Selling contested property creates a reputational liability that exceeds the financial gain.
  *   **Phase 2 (Parity):** Local Comparison: We are comparing [Cash] vs. [Legitimacy].
      *   *Test:* If the offer was 10% higher, would it be worth the scandal? No.
      *   *Result:* Not on a par. The "Keep/Return" option is clearly better than "Sell." Selling is *worse*, not hard.
  *   **Phase 3 (Chain-Breaker):** N/A (Decision made in Phase 1/2).
  *   **Verdict:** **No.** The procedure identifies this isn't a Hard Choice; it's a bad choice. The "local comparison" reveals that the reputational cost outweighs the local financial gain, regardless of the object's market value.

  #### Case 3: The Postcard Picture for 10 Years Operations
  *   **Phase 1 (Threshold):** Facts: 10 years survival vs. Best Object. No legal block (assuming you accept the accreditation risk). *Pass.*
  *   **Phase 2 (Parity):** Small Improvement Test: If the offer was 10% higher (11 years ops), does it become clearly better? No. If it was 10% lower (9 years), does it become clearly worse? No.
      *   *Result:* **True Parity.** This is the Hard Choice. Survival vs. Soul.
  *   **Phase 3 (Chain-Breaker):** Risk: Selling the *best* thing breaks the chain immediately because there is nowhere to go but down.
      *   *Precedent Lock:* "This is a one-time liquidation of endowment assets to reset the business model. No further deaccessioning for operations."
  *   **Phase 4 (Commitment):** This is the crux.
      *   *Authorship:* Board members must sign.
      *   *Transformation:* If you sell this, you admit the current model is dead. The commitment must be: "We sell this to transition to a new funding model. If we do not fix the model in 10 years, we close."
  *   **Verdict:** **Permission to Choose.** The procedure will not tell you Yes or No. It will tell you that if you vote Yes, you are fundamentally changing the institution from a "Museum of Objects" to a "Museum of Services." If you cannot make that commitment, you cannot sell.

  ---

  ### What This Procedure Cannot Do

  1.  **It Cannot Protect Accreditation:**
      This is the elephant in the room. The AAMD and AAM guidelines generally forbid using deaccessioning proceeds for operating expenses. This procedure helps you make a *moral* decision, but it does not shield you from professional sanctions. If you sell the Postcard Picture, other museums may blacklist you. The procedure treats this as a "Fact" in Phase 1, but it cannot solve the consequence.

  2.  **It Cannot Eliminate Regret:**
      Hard choices leave "agent-regret." Even if you choose rightly, you mourn the option not taken. This procedure validates the regret (by acknowledging Parity) but does not remove it.

  3.  **It Cannot Fix a Broken Business Model:**
      Commitment (Phase 4) requires you to pledge a fix. It cannot guarantee the fix works. If you sell the Postcard Picture and spend the money on operations without fixing the endowment gap, you have simply delayed death by ten years at the cost of your soul. The procedure forces you to say you won't do that, but it can't stop you from lying.

  4.  **It Cannot Handle "Soft" Coercion:**
      If the "Very Loud Trustee" from your history dominates Phase 4, the "Authorship Question" becomes a formality. The Red Flag role helps, but if the board culture is submissive, the procedure becomes theater. It requires a board willing to be uncomfortable.

  ### Summary for the Board
  "Trustees, we are not here to calculate value. We are here to acknowledge that some values cannot be calculated against each other. If the math were clear, we wouldn't need a vote. This procedure exists to ensure that if we make a hard choice, we own it, we limit the damage, and we commit to making it the right choice by how we act afterward."
