          *   *Risk:* If the FA theorist says "It's still SG because it's a threat," they risk circularity (SG = reasons that don't generate value). If they say "It becomes OGR," they admit external incentives can constitute value, which undermines the intuition that value is intrinsic/fittingness-based.
