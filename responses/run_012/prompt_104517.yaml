      *   *Analysis:* This is hard to find because refusal usually implies a reason (cost, bureaucracy, corruption).
      *   *Better Killer:* A case where relief was *attempted* with full resources and political will, but physics/logistics defeated it entirely, leading to mass starvation. (e.g., The 1998 Sudan famine? No, that was obstruction. The 1876-78 India famine? El Niño + British policy. Hard to separate.)
      *   *Real Killer:* A "Malthusian Ceiling" case. Population exceeds carrying capacity *even with perfect distribution*. If such a case exists and is labeled a famine, the thesis breaks.

  11. **Self-Correction/Nuance Check:**
