      *   *The Tension:* You can be perfectly calibrated but useless. (Example: Always saying "50%" for a coin flip is perfectly calibrated if it's a fair coin, but it offers no information).
      *   *Implication for the User:* The accuracy-first program demands more than just long-run calibration. It demands you push your credences toward the truth as much as the evidence allows. A "safe" 50% is less accurate (higher score) than a risky 90% that turns out true.
      *   *Reasoning Change:* Don't just aim for reliability; aim for informativeness. Don't hedge too much if the evidence points strongly one way.

