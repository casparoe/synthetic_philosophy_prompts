      *   *Key Result:* If you want to minimize expected inaccuracy, you should be probabilistically coherent (follow axioms of probability) and update by conditionalization.
      *   *Contrast with User's View:* User focuses on *calibration* (frequency matching). Accuracy-first focuses on *resolution* or *sharpness* alongside calibration (getting close to 1 when true and 0 when false).

  3.  **Address Specific Interest 1: Accuracy vs. Calibration:**
