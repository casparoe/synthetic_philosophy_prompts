      *   Did I explain the cost? Yes (Counterfactuals/Causal Structure).
      *   Did I explain "implements"? Yes (Causal topology).
      *   Did I address Chinese Nation? Yes (It stays live).

  10. **Tone:** Philosophical, rigorous, sympathetic to the user's desire to save computationalism but honest about the costs. (Self-Correction: Make sure not to dismiss the argument too easily; it's a famous and potent objection known as the "Blockhead" argument).

  11. **Final Polish:** Ensure clear headings and logical flow. (Proceed to generate output).

  *(Self-Correction during drafting)*: Wait, step (5) says "Any physical system... can be redescribed as a lookup table." This is true *post hoc*. But a computation is defined by its *rules*, not its *history*. I need to emphasize the difference between a *trace* and a *program*. A LUT represents a trace. A computation is a program. The brain implements a program, not just a trace.

