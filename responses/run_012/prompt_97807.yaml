answer: |-
  This is a strong draft concept for a rationality-adjacent blog (LessWrong, Alignment Forum, etc.), but there are three specific points where standard game theory results will crush your argument if you publish them as written. You are correctly sensing that there is "epistemic smoke" in the standard narrative, but you are pointing at the wrong source of the smoke.

  Here is the teardown you asked for.

  ### 1. The "Fact Check" on Your Claims

  **Claim 1: "Strictly dominated by a mixture" and "Never a Best Response" come apart on iteration.**
  *   **Verdict:** **False.**
  *   **The Theorem:** In finite normal-form games, the set of strategies surviving Iterated Elimination of Strictly Dominated Strategies (IESDS)—*allowing for mixed strategies to be the dominators*—is **exactly identical** to the set of Rationalizable strategies (strategies that are never a best response). This is Pearce's Lemma (1984).
  *   **The Trap:** If you argue they come apart in extension (i.e., different strategies survive), you will be immediately corrected in the comments. They do not come apart.
  *   **The Nuance:** You *can* argue that the *justification* feels different (pure dominance looks at payoffs directly; mixed dominance requires expected utility calculations over beliefs), but formally, under Common Knowledge of Rationality (CKR), they collapse to the same set. Do not build your thesis on them diverging.

  **Claim 2: Order-independence breaks for weak dominance.**
  *   **Verdict:** **True.**
  *   **The Context:** This is standard material, but it is your strongest lever. Order independence holds for Strict Dominance (pure or mixed). It fails catastrophically for Weak Dominance.
  *   **The Load-Bearing Work:** You are right that allowing mixed strategies to dominate pure ones increases the "elimination power" of the first round, but the epistemic condition for eliminating a strategy strictly dominated by a mix is the *same* as for a pure mix (CKR). The real epistemic cost comes when you try to iterate *Weak* dominance.

  **Claim 3: CKR allows iterating past round one on Weak Dominance.**
  *   **Verdict:** **False (and dangerous).**
  *   **The Problem:** Common Knowledge of Rationality justifies IESDS (Strict). It does **not** justify IEWDS (Weak).
  *   **Why:** If strategy $S_1$ weakly dominates $S_2$, a rational agent *can* still play $S_2$ if they hold a belief that makes them indifferent between the two. Rationality alone does not force a tie-break in favor of the weakly dominating strategy.
  *   **What you actually need:** To justify iterating weak dominance, you need something like **Common Knowledge of Caution** (players believe opponents play all strategies with non-zero probability, i.e., Trembling Hand) or **Lexicographic Beliefs** (players prioritize avoiding weak dominance over maximizing EU in tie cases).
  *   **The Fix:** Your punchline should be: *"Textbooks say CKR gets you Iterated Elimination. They mean Strict. If they mean Weak, they are lying, because CKR isn't enough—you need a tie-breaking assumption nobody states."*

  ### 2. Is the Thesis Interesting?

  **Yes, but you need to pivot.**
  Your intuition that "the epistemic story is doing more work than admitted" is correct, but you are attributing it to **Mixed Strict Dominance** when the real culprit is **Weak Dominance**.

  *   **Current Thesis:** Mixed strategies hide epistemic assumptions in Strict Dominance.
  *   **Better Thesis:** The standard narrative conflates Strict and Weak dominance. Strict dominance (even with mixes) is epistemically robust (CKR suffices). Weak dominance is epistemically fragile (CKR fails, order matters), yet intro courses often treat them as the same "Iterated Elimination" procedure.

  The "acausal weirdness" crowd will love the angle that **IEWDS (Weak)** requires a stronger logical commitment (like "I know you won't play a weakly dominated strategy" rather than just "I know you are rational") which edges closer to logical omniscience or specific priors.

  ### 3. A Cleaner Example for Weak Dominance

  Your $A, B, C$ vs $X, Y$ example is the classic "Mixed Dominates Pure" example. It's good for Claim 1, but it doesn't show the iteration/order problem.

  For the Weak Dominance punchline, use the standard 3x3 order-dependence matrix. It's cleaner and undeniable.

  **Game:**
  *   **Row:** Top, Middle, Down
  *   **Col:** Left, Right

  | | L | R |
  | :--- | :---: | :---: |
  | **T** | 1, 1 | 0, 0 |
  | **M** | 0, 0 | 0, 0 |
  | **D** | 0, 0 | 1, 1 |

  *   **Round 1:** $M$ is weakly dominated by $T$ (and by $D$).
  *   **Path A:** Eliminate $M$. Now $D$ is a best response to $R$. $T$ is a best response to $L$. Nothing else eliminates. Survivors: $\{T, D\} \times \{L, R\}$.
  *   **Path B:** Suppose we had a slightly different payoff where eliminating $M$ made $D$ strictly dominated by $T$. (The example above is too simple, let's use the canonical one).

  **Better Canonical Example (Order Dependence):**
  | | L | C | R |
  | :--- | :---: | :---: | :---: |
  | **T** | 2, 2 | 0, 0 | 0, 0 |
  | **M** | 0, 0 | 2, 2 | 0, 0 |
  | **B** | 1, 1 | 1, 1 | 1, 1 |

  *   $B$ is weakly dominated by a mix of $T$ and $M$ (50/50 gives 1,1,1 vs 1,1,1... wait, need strict weak dominance).
  *   Let's stick to the verbal description for the blog: "In some games, eliminating a weakly dominated strategy for Player 1 removes the *only* reason Player 2 wouldn't play a strategy that makes Player 1's *other* weakly dominated strategy look bad. Change the order, change the survivor."
  *   **Recommendation:** Just cite the property. "In Weak Dominance, eliminating $S_1$ can make $S_2$ undominated, while eliminating $S_2$ first can make $S_1$ undominated. The final set depends on which weakly dominated strategy you threw out first."

  ### 4. What to Cut

  1.  **Cut the claim that Strict Mixed Dominance is epistemically distinct from Strict Pure Dominance.** Under EU maximization, if it's strictly dominated (by anything), it's never a best response. CKR kills it either way. Don't fight Pearce's Lemma.
  2.  **Cut the claim that CKR justifies iterating Weak Dominance.** This is the biggest target on your back. Acknowledge that CKR *fails* here. That makes your essay stronger ("Here's where the standard story breaks") rather than weaker ("Here's why I think the standard story works when it doesn't").
  3.  **Cut the vagueness on "Certainty vs Common Knowledge."** The distinction between "I am certain you are rational" and "It is common knowledge" is technical (infinite hierarchy). The real distinction you found is "Rationality" vs "Caution/Trembling Hand." Use those terms.

  ### 5. Suggested Restructure

  1.  **Hook:** Everyone learns Iterated Elimination of Dominated Strategies (IEDS) as "what rational people do."
  2.  **The Setup:** Show your $A,B,C$ example. Establish that "Dominated" usually implies "Dominated by a Mix."
  3.  **The Pivot:** Admit that for *Strict* dominance, the math is solid (Pearce's Lemma). CKR works. The set is stable.
  4.  **The Turn:** But textbooks slide from Strict to Weak dominance without blinking.
  5.  **The Kill:** Show that for *Weak* dominance, CKR is not enough. You need "Caution." Show that order matters.
  6.  **The Punchline:** The standard line "CKR $\to$ IEDS" is a conflation. It's true for Strict, false for Weak. Since real-world games often have weak dominance (ties, near-indifferences), the "Rational Solution" is far less unique than advertised.
  7.  **Acausal Angle:** For the blog audience, add a note: "If you think logical correlation (acausal trade) changes your beliefs about the opponent's move, you might treat weak dominance differently, but standard CDT/EDT relies on this shaky IEWDS foundation."

  ### Summary
  You are right that the epistemic story is being glossed over, but you are blaming **Mixed Strategies** for a crime committed by **Weak Dominance**. Fix that distinction, and you have a killer post. Leave it as is, and the game theorists in the comments will eat you alive on Pearce's Lemma.
