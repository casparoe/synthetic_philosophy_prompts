prompt: |-
  ok so I've been trying to write this essay for my blog for like three months (the blog's the kind of place where people argue about decision theory and acausal weirdness, so the readership can handle a little math), and I want someone to tear into it before I hit publish. it's not written up properly yet, just notes, but the whole gist is: I think the way people talk about 'iterated elimination of dominated strategies' quietly leans on mixed strategies and then pretends the epistemic story is exactly the same as for pure dominance, and it isn't. here's what I've got:

  - setup is a finite game, players max expected utility. the example I keep using: row player picks A, B, or C against column player's X or Y. A pays 3 vs X and 0 vs Y. B pays 0 vs X and 3 vs Y. C pays 1 against either. so C is strictly dominated, but only by the 50/50 mix of A and B, definately not by any pure strategy. the point being that 'dominated' in the textbook sense already means dominated by a possibly-mixed strategy, and C is never a best response to any belief at all.
  - first claim: in finite games, 'strictly dominated by a mixture' and 'never a best response' carve out the same set of strategies, so iterated elimination and rationalizability are the same thing. but I want to argue they still rest on different epistemic assumptions, and that they actually come apart in some finite games once you start iterating.
  - second claim: the order-independence thing everyone loves (you can eliminate in whatever order, same result) is strictly a strict-dominance result. for weak dominance it just breaks. I want to use that to say the modern reliance on mixed dominance is doing more load-bearing work than anyone admits.
  - third claim, the one I care about most: I think you can keep iterating past round one on common knowledge of rationality alone, and that this includes throwing out strategies that are only weakly dominated by a mixture, because once everyone knows everyone's rational the 'might as well play this' cases just drop out.
  - punchline: so the standard line 'common knowledge of rationality gets you iterated elimination' is either weaker than advertised or quietly needs an extra assumption (something like everyone being certain of each other's rationality, not merely it being common knowledge), and nobody ever says which.

  what I want from you: mostly tell me if any of this is just wrong, and be specific about which claim, cause I'd rather look dumb here than in the comments. then: is the central thesis actually interesting or am I re-deriving something everyone already knows and has a name for? is there a cleaner example for the weak-dominance punchline, cause my C example doesn't really get at it? and what would you cut. don't worry about citations or reading lists, I just want to know if the reasoning holds up.
