answer: |-
  ### The Brute/Option Audit Procedure

  **Time allocation:** 4 minutes per application.
  **Participants:** 4 panelists.
  **Goal:** Isolate *brute luck* (unchosen misfortune) from *option luck* (consequences of calculated risk).

  **Step 1: The Baseline (Fact)**
  *Question:* Is the financial need acute and immediate (rent, food, heating) rather than structural or long-term (debt consolidation, career development)?
  *   **Sufficient Answer:** Yes, evidenced by bills/notices dated within the last 30 days.
  *   **Refusal Point:** If No. The fund is for crisis, not subsidy.
  *   **Judgement Type:** Fact.

  **Step 2: The Proximate Cause (Fact/Value)**
  *Question:* What specific event triggered the crisis?
  *   **Sufficient Answer:** A single identifiable event (illness, flood, job loss, book failure).
  *   **Judgement Type:** Fact.
  *   *Note:* If the applicant offers a "story of decline" without a trigger, press for the specific tipping point.

  **Step 3: The Voluntariness Test (Value)**
  *Question:* Was the triggering event the result of a voluntary gamble where the risk was foreseeable?
  *   **Sufficient Answer for Grant:** No. (e.g., sudden illness, unexpected redundancy).
  *   **Sufficient Answer for Refusal:** Yes. (e.g., quitting a job without savings, self-publishing without capital).
  *   **Refusal Point:** If Yes, proceed immediately to Step 4. If No, Grant.
  *   **Judgement Type:** **Irreducible Value.** (Defining "foreseeable" is philosophical, not factual).

  **Step 4: The Severity Amplifier (Value)**
  *Question:* *Crucial Distinction:* The applicant may have chosen the risk, but did they choose the *severity* of the outcome? Did an unchosen factor (illness, market collapse, family crisis) prevent the normal recovery from a failed gamble?
  *   **Sufficient Answer for Grant:** Yes. The gamble failed, but an external brute luck event prevented the fallback plan (e.g., quit to write, book failed, *then* illness prevented returning to work).
  *   **Sufficient Answer for Refusal:** No. The outcome is proportional to the risk taken (e.g., quit to write, book failed, now working retail but still short on rent).
  *   **Judgement Type:** **Irreducible Value.**
  *   *Instruction:* This is where we judge the *outcome*, not the *choice*.

  **Step 5: The Eloquence Tax (Meta-Judgement)**
  *Question:* How much of our sympathy is generated by the quality of the prose rather than the severity of the facts?
  *   **Procedure:** Each panelist must mentally rewrite the application in dry, bureaucratic language. Does the hardship remain compelling?
  *   **Adjustment:** If the application is exceptionally well-written, apply a "discount" to the emotional weight. If it is inarticulate but the facts hold, apply a "premium."
  *   **Acknowledgement:** We cannot eliminate the bias of narrative talent (it is itself brute luck), but we must refuse to let it be the deciding factor. We are compensating for misfortune, not funding literary merit.
  *   **Judgement Type:** **Irreducible Value.**

  ***

  ### Application to Last Month's Cases

  **Case 1: The Poet (Depression/Job Loss)**
  *   **Step 1:** Acute need? Yes.
  *   **Step 2:** Trigger? Loss of teaching post.
  *   **Step 3:** Voluntariness? No. Depression is not a chosen gamble.
  *   **Step 4:** Severity? N/A (Passed Step 3).
  *   **Step 5:** Eloquence? Application was fragmented, difficult to read.
  *   **Procedure Result:** **GRANT.**
  *   **Panel Reaction:** Comfortable. This is the "deserving poor." The procedure confirms intuition.

  **Case 2: The Novelist (Resigned Secure Job/Book Failed)**
  *   **Step 1:** Acute need? Yes (Rent).
  *   **Step 2:** Trigger? Book did not sell; savings exhausted.
  *   **Step 3:** Voluntariness? **Yes.** Resigning a secure post is a calculated risk (Option Luck).
  *   **Step 4:** Severity Amplifier? **No.** The application states the book "did not sell." It does not claim illness or external barrier prevented a return to employment, only that the *gamble* failed. The severity is proportional to the risk (no book money = no rent).
  *   **Step 5:** Eloquence? High. The essay on "the artistic vocation" was compelling.
  *   **Procedure Result:** **REFUSE.**
  *   **Panel Reaction:** **Hostile.** The panel consists of writers who romanticize the gamble. They will hate this because the procedure forces them to admit that art is a risk, and the fund is not an arts council. It distinguishes between the *choice* to write (protected) and the *choice* to starve (unprotected). The procedure demands we hold him answerable for the choice, even if we pity the outcome.

  **Case 3: The Translator (Flood/No Insurance)**
  *   **Step 1:** Acute need? Yes.
  *   **Step 2:** Trigger? Flat flooded.
  *   **Step 3:** Voluntariness? **Mixed.** Flood is Brute Luck. Lapsing insurance is Option Luck.
  *   **Step 4:** Severity Amplifier? The financial ruin is caused by the lack of insurance, not the water. The water damaged the flat; the *decision* damaged the finances.
  *   **Analysis:** Under strict luck egalitarianism, she gambled that a flood would not occur. She lost. The financial consequence is option luck.
  *   **Procedure Result:** **REFUSE.**
  *   **Panel Reaction:** Uneasy. This feels like punishing poverty (she lapsed to save money). However, the charter specifies "not for consequences of a writer's own decisions." Lapsing insurance is a decision.
  *   **Nuance:** If she lapsed because she *could not afford* it (brute luck of poverty) vs. *chose to spend on other things* (option luck), the procedure stalls at Step 3. This requires a vote.

  ***

  ### Points of Irreducible Judgment

  1.  **Defining "Foreseeable" (Step 3):** There is no fact that determines if a risk was reasonable. One panelist's "calculated risk" is another's "reckless abandon." This cannot be algorithmic; it requires a vote.
  2.  **The Narrative Discount (Step 5):** We cannot quantify how much eloquence is swaying us. We must rely on individual conscience to "downgrade" beautiful misery.
  3.  **The Poverty Trap (Case 3):** When a "decision" (lapsing insurance) is forced by prior brute luck (chronic underfunding), the distinction collapses. The procedure cannot solve this; it only highlights it.

  ***

  ### Operational Note on Narrative Bias

  You asked what a procedure that takes luck seriously should do about the fact that we fund based on essay quality. The honest answer is: **It should acknowledge that it is failing.**

  Talent for self-narration is a form of brute luck (innate ability + education). By funding the best writers of hardship, we are compounding an unchosen advantage. The procedure above attempts to mitigate this via Step 5 (The Eloquence Tax), but it cannot remove it. To remove it would be to stop reading the applications, at which point we cannot assess the hardship. We must accept that our mechanism is imperfect: we are using a talent (writing) to assess a need (poverty), and the talent itself correlates with income potential. The procedure does not fix this; it merely forces us to admit that a poorly written application describing a flooded flat is morally weightier than a sonnet describing an empty fridge.

  ***

  Verdict: In cases where the distinction between chosen risk and unchosen severity remains indeterminate after the audit, the benefit of the doubt belongs to the applicant.
