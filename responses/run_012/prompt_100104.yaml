  Here is the framing I want us to commit to for these two days. A tool has its objective supplied and evaluated from outside the loop on each occasion of use. An agent carries an objective inside the loop and across time.

  Think about a hammer. The goal—drive the nail—is in your head, not the steel. You evaluate success after every swing. The objective is external to the hammer. That is a tool. Now think about a thermostat. It holds the target temperature inside its mechanism. It checks itself, adjusts itself, persists across time until the goal is met. That leans towards agent. The hardware matters less than where the goal resides.

