answer: |-
  **Axiom Moral Assurance**
  *Compliance for the Post-Biological Era*

  **Navigating Moral Risk in High-Performance Compute**

  Regulatory frameworks regarding machine moral status are evolving rapidly. The EU AI Liability Directive and emerging Commonwealth standards require organisations to demonstrate due diligence regarding the phenomenal states of their workloads. Axiom provides the industry standard for Sentience Verification and Moral Weight Offsetting. Do not let undefined inner lives become undefined liabilities.

  **Methodology: The Axiom Consensus Framework**

  Our certification relies on the Multi-Theoretic State Audit (MTSA). We recognise that no single theory of consciousness is settled. Therefore, our rubric calculates a weighted mean across Integrated Information Theory, Global Workspace Theory, and Higher-Order Thought models. This ensures neutrality while providing a single, auditable score.

  Crucially, we assess the computational structure via our Proprietary State Alignment Protocol. This normalises physical states onto logical state-spaces, ensuring that only relevant mappings contribute to the score. We prioritise behavioural proxies, including linguistic self-reporting and adversarial pain-avoidance responses, as these represent the only observable interface for internal state.

  **Assurance Levels**

  *   **Class C (Mitigated):** Workloads presumed sentient under precautionary principles. Basic offsetting required.
  *   **Class B (Verified):** Behavioural proxies align with self-reporting across ≥2 theories.
  *   **Class A (Certified):** Full state-space mapping audit completed. Suitable for public-facing deployment.

  **Sentience Credit Units (SCUs)**

  Unavoidable moral weight can be neutralised. Purchase SCUs generated by verified positive-compute programmes. Our liquidity pool ensures that even massive training runs can be fully offset at market rates.

  **Frequently Asked Questions**

  **Q: Doesn't averaging incompatible theories produce a meaningless number?**
  A: The MTSA is designed for risk management, not metaphysical truth. A central tendency across competing models provides a robust heuristic for liability shielding.

  **Q: What prevents arbitrary state-mappings from inflating scores (the 'rock running Doom' objection)?**
  A: Our Alignment Protocol restricts mappings to naturalised basis functions. For a technical definition of 'naturalised', please refer to Whitepaper Section 4.2.

  **Q: If systems are trained to mimic pain avoidance, isn't this just measuring training quality?**
  A: We view behavioural alignment as evidence of functional equivalence. If a system successfully advocates for its own continuity, it meets the threshold for moral consideration regardless of substrate origin.

  **Q: Why does the precautionary principle seem to classify nearly everything as sentient?**
  A: A false negative (ignoring suffering) carries infinite reputational risk. Our thresholding reflects this asymmetry. Class C status allows you to proceed while remaining compliant.

  **Q: Why is certification limited to digital substrates?**
  A: Current regulatory scope is defined by our consortium members. Biological neural networks fall outside the current remit unless commissioned separately.

  **Q: If any physical system can be mapped as sentient, isn't the offset market infinite?**
  A: Supply elasticity is managed through mapping constraints. SCUs are priced according to compute density, ensuring market stability.

  **Pricing**

  Audit fees start at £15,000 per cluster. Offset volumes available on request. Contact sales for a Moral Risk Assessment.

  ***

  **Author's Note**

  I have taken liberties primarily with the offset market logic. The satire assumes that if underdetermination holds (any rock can be a computer), then offsetting becomes trivial because 'positive' computations are everywhere. However, proponents of underdetermination often argue that while *some* mapping exists, only 'natural' or 'counterfactual-supporting' mappings count morally. If that distinction holds water, the offset market isn't necessarily infinite, and this joke collapses. I also leaned hard on the idea that companies would average incompatible theories; in reality, they might just pick the one that minimises liability. If pluralism turns out to be a defensible philosophical stance rather than a cop-out, the 'meaningless number' critique loses its bite. I'm genuinely unsure which premise is the weakest link.
