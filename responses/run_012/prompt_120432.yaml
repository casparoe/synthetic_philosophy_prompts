  **To:** Reading Group Shared Doc
  **From:** [Your Name]
  **Re:** Analysis of Persistence Verdicts & The Boat/Shed Case

  Here is the breakdown of your mate's position, the likely verdicts on the boat scenario, and an assessment of the terminology she's using.

  ### 1. The Verdicts on the Boat/Shed Case

  Based on her track record, here is the prediction for both scenarios:

  *   **Scenario A (Gradual, 15 years):** **Not the same boat.** The boat ceased to exist at the point it lost the functional capacity or form required to be a "boat". The shed is a new object, even if it comprises the same matter.
  *   **Scenario B (Fast, One weekend):** **Not the same boat.** Same verdict as above. The speed of the transition is irrelevant to her criteria.

  ### 2. The Rule She Is Running

  You suspected she tracks "unbroken spatiotemporal continuity" regardless of kind. The grandfather clock verdict kills that hypothesis. If mere continuity of matter were enough, the clock in the box would be the same clock (just disassembled). The fact that she calls it a *different* clock indicates she is a **Sortal Essentialist with a Continuity Constraint.**

  Her rule can be spelled out as follows:

  > **The Rule of Functional-Sortal Continuity:**
  > An object $X$ persists as the same entity only if:
  > 1.  There is an unbroken spatiotemporal path of its constituent matter; **AND**
  > 2.  At every moment along that path, the matter is arranged such that it satisfies the definition (sortal concept) of $X$.

  **How this fits her record:**
  *   **Theseus's Ship:** Passes. It was always arranged as a ship.
  *   **Reassembled Planks:** Fails. The planks in the lock-up were not arranged as a ship; the 'ship' ceased to exist.
  *   **Person (Cells):** Passes. Biological continuity maintains the 'person' sortal.
  *   **Wave:** Passes. The pattern maintains the 'wave' sortal.
  *   **Club:** Passes. Institutional continuity maintains the 'club' sortal.
  *   **Grandfather Clock:** Fails. In the box, the parts were not arranged to tell time; the 'clock' sortal was not satisfied.

  **Application to the Boat:**
  A 'boat' and a 'shed' are mutually exclusive sortals in her framework. An object cannot be both. Once the structure loses seaworthiness or boat-form to gain shed-form, the 'boat' sortal is no longer satisfied. Because the 'boat' ceases to exist, continuity is broken. The resulting shed is a new object constituted by the old matter.

  ### 3. Underdetermination: Are There Other Rules?

  While the rule above is the strongest fit, the six verdicts do not *perfectly* determine her position. There is one competing hypothesis that fits the data almost as well.

  **Competing Rule: The Interruption of Function View**
  This rule suggests objects persist through material change, provided their *function* is not interrupted.
  *   **Fit:** It explains the Clock (function interrupted in the box) and the Planks (function interrupted in the lock-up). It explains Theseus (function never interrupted).
  *   **Divergence:** This rule *might* allow for the Boat/Shed conversion to be the "same object" if the transition is smooth enough that function morphs rather than stops. However, given her strictness on the Clock, she likely views 'boat function' and 'shed function' as binary, not continuous.

  **Does Speed Matter? (The Weekend Variant)**
  There is a minor ambiguity here regarding **Vagueness (The Sorites Paradox)**.
  *   **Strict Sortalist:** Speed is irrelevant. If it's not a boat, it's not a boat. (My primary prediction).
  *   **Vagueness Tolerant:** She might argue that gradual change (15 years) exploits the vague boundaries of 'boat', allowing identity to slide across the boundary, whereas an abrupt change (weekend) forces a sharp distinction.
  *   **My Bet:** I would bet on **Speed being irrelevant**. Her Clock verdict suggests she likes sharp boundaries (a clock is either assembled or it isn't). She is unlikely to treat 'boatness' as more vague than 'clockness'.

  **The Decisive Test Case:**
  To separate the **Strict Sortalist** view from the **Vagueness Tolerant** view, you need to present her with a **Statue and Lump** case.
  *   *Case:* A clay statue is slowly squashed into a sphere over an hour. Is the statue the same object as the sphere?
  *   *Strict Sortalist:* No. The statue ceased to exist when the form was lost.
  *   *Vagueness Tolerant:* Maybe. If the change is slow enough, identity might hold.
  *   *Why this separates them:* It removes the 'functional' element (a sphere doesn't function differently than a statue) and isolates the 'form/kind' element.

  ### 4. On Endurantism vs. Perdurantism

  You are correct to be suspicious. She is misusing the labels.

  *   **Endurantism** is the view that objects are wholly present at each moment of their existence (3D objects moving through time).
  *   **Perdurantism** is the view that objects are 4D "spacetime worms" composed of temporal parts.

  Both Endurantists and Perdurantists can agree on every single verdict she has given.
  *   An Endurantist can say the Clock is not the same clock because the substance ceased to be a clock.
  *   A Perdurantist can say the Clock is not the same clock because the temporal parts in the box do not instantiate 'clockhood'.

  She is not debating *how* objects exist in time; she is debating **Criteria of Identity** (specifically, Sortal Essentialism vs. Material Constitution). She is using "Endurantism" as a shorthand for "Strict Identity" and "Perdurantism" as "Loose Identity" or "Stage Theory", which is technically incorrect.

  ### 5. Confidence and Falsification

  **Confidence Level:** High (85%).
  The pattern in her verdicts is consistent, particularly the rejection of the reassembled clock and planks. This is the fingerprint of a Sortal Essentialist.

  **Where My Reasoning Might Be Wrong:**
  The weak point is the **Club** verdict. Clubs are abstract entities; their persistence conditions are often conventional rather than metaphysical. If she treats clubs differently than physical objects (allowing total member replacement), she might treat the Boat/Shed conversion as a "modification" rather than "destruction" if the owner's *intention* remains continuous. If she prioritises **Owner Intention** over **Form**, the Boat could survive the conversion.

  **Falsification Condition:**
  I would drop this verdict if she says the **Grandfather Clock is the same clock** provided the parts were kept in the box in the *exact arrangement* of the clock, even if not ticking.
  *   *Why:* This would prove she cares about **Material Arrangement** rather than **Function/Sortal**. If she holds that view, the Boat might survive the Shed conversion because the wood is never scrambled, only reshaped.

  **Summary for the Doc:**
  Tell her she's arguing for **Sortal-Relative Identity**, not Endurantism. Bet on her saying the boat is dead in both scenarios, but test her with the **Statue/Sphere** case to see if she allows identity to survive a change of kind via gradualism.
