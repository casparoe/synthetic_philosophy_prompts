  3.  **Drafting the Taxonomy (The "Menu"):**

      *   *Reading 1: Ontological Dependence (The Standard Searle/Status Function view).*
          *   Claim: Money exists *because* we collectively treat it as money.
          *   Dependence: Constitutive (status functions).
          *   Trivial/Substantive: Substantive regarding ontology, trivial regarding physics (it's paper/metal).
          *   Money/Race/Gender: Money fits perfectly. Race/Gender are debated (biological bases vs. social meaning).
          *   Kind/Member/Concept: Kind & Members.
          *   Supports "Decree"? Weakly. You can change the rules, but not without collective buy-in.
          *   Political Intent: Sometimes, but often too technical.

      *   *Reading 2: Epistemic/Conceptual Construction.*
          *   Claim: The *category* "money" is a human invention to carve up reality, not discovered in nature.
          *   Dependence: Conceptual/Linguistic.
          *   Trivial/Substantive: Trivial (almost all categories are human-made).
          *   Money/Race/Gender: Holds for all three.
