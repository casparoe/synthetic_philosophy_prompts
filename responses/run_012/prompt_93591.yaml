          *   Trivial/Substantive: Substantive (and often false/oversimplified).
          *   Money/Race/Gender: Money (high), Race/Gender (low/contested).
          *   Kind/Member/Concept: Kind (rules of the kind).
          *   Supports "Decree"? Yes, this is the specific reading that allows this inference.
          *   Political Intent: High. This is usually what people *want* to mean when arguing for policy changes.

