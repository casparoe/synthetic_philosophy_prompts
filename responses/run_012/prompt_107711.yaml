answer: |-
  The existing legal-medical arrangement presupposes that mental disorder is a distinct form of impaired agency that negates moral responsibility while justifying paternalistic containment, but adopting Szasz's view would require abolishing involuntary medical commitment and transforming the insanity defense into a purely legal judgment about blame rather than health.

  The implicit theory underlying both practices is functionalist rather than strictly biological; it does not require mental illness to be a lesion-based brain disease, but it does require that psychiatric categories pick out real, causally efficacious states that compromise rational agency. For involuntary commitment to be legitimate, the disorder must be viewed as a condition that causally produces dangerousness while simultaneously impairing the capacity to choose safety, thereby licensing state intervention on paternalistic or police-power grounds without the protections of criminal law. For the insanity defense to function, that same disorder must be viewed as undermining the cognitive or volitional capacities necessary for moral blame, effectively treating the agent as determined by their pathology rather than guided by reason. Consequently, the system does not presuppose a hard determinism that eliminates free will entirely, but rather a capacity-based model where ordinary agents are reasons-responsive and responsible, while disordered agents suffer specific deficits in information-processing or impulse control that exempt them from responsibility yet mark them as risks requiring management.

  These two practices are pragmatically consistent but conceptually tense, relying on a dual status for the individual as both a non-responsible patient and a dangerous subject. The commitment practice leans toward a deterministic view where the individual is an object of safety management, implying they cannot control their dangerousness, while the insanity defense leans toward a normative view where the individual is a subject exempted from blame because they could not control their conduct. This tension is resolved only by the bridging concept of "incapacity": the disorder is severe enough to negate responsibility (excusing punishment) but not so total as to negate the need for containment (justifying commitment). If the disorder were merely a social label or a metaphor for "problems in living," as Szasz argues, this bridge collapses. A normative or social account of psychiatric categories could license the practices only if society agrees to treat certain deviations from rational norms as exculpatory and dangerous, but this would admit that the confinement is social control, not medical treatment.

  Adopting the Szaszian alternative would fundamentally dismantle the current hybrid model. Involuntary commitment could no longer be justified as medical treatment for illness, since there is no illness to treat; it would have to be abolished or recast strictly as preventive detention based on dangerousness alone, affording the individual the full due process rights of a criminal suspect rather than the procedural protections of a patient. The insanity defense would similarly require transformation; without a medical condition to undermine capacity, the defense would either be abandoned in favor of a strict liability model where all actors are held responsible for their choices, or it would be retained only as a non-medical claim of duress or extreme circumstance unrelated to health. Ultimately, the Szaszian shift moves the framework from therapeutic jurisprudence, which blends care and control, to a rigid legalistic model where danger is met with punishment or preventive detention, and wrongdoing is met with blame, removing the medical profession's authority to arbitrate liberty and responsibility.
