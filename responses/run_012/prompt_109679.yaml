          *   The fallibility argument is pragmatic and hard to refute empirically.
          *   The "extreme disorder" exception saves the theory from absurdity (e.g., treason during war).
      *   *Weaknesses:*
          *   *Empirical Claim:* Is imprisonment *really* as effective a deterrent as death? (The argument hinges on this equivalence).
