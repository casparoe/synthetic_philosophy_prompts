      *   *The Colleague's Objection:* The *Protestant Ethic* thesis requires culture to *generate* the drive (at least initially), not just steer pre-existing interest. Also, the "iron cage" outcome (institutionalization) isn't something a switchman produces.
      *   *The Philosophical Problem:* What kind of causation is at play? Is it efficient causation (pushing), formal causation (shaping), or constitutive causation (defining the action itself)?

  3.  **Step 1: Brainstorming Candidate Correspondences:**
      *   *Train:* Economic action / Capitalist development.
      *   *Engine/Motor:* Material interests / Profit motive.
      *   *Fuel:* Human desire / Need for salvation (religious anxiety)?
      *   *Tracks:* Institutional structures / Legal-economic order.
      *   *Switchman:* Religious ideas / The Protestant Ethic.
      *   *Destination:* Modern Rational Capitalism / The Iron Cage.
