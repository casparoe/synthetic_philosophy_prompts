      *   *Fuel:* Psychological drive (often assumed to be innate greed, but Weber complicates this).
      *   *Track:* The specific path of development (Rational Capitalism vs. Adventurer Capitalism).
      *   *Switchman:* Religious world-images (Calvinist doctrine).
      *   *Destination:* The specific historical outcome (Modern Western Capitalism).
      *   *Prior Construction:* The existing material/historical conditions (without which the train can't move).

  5.  **Step 3: Identifying Breaks in the Mapping (The Crucial Analysis):**
      *   *Break 1: The Source of Motion.* The analogy assumes the train is *already moving* due to interests. Weber's text argues that *traditionalism* was the default. The Protestant Ethic didn't just steer existing capitalist energy; it *created* the energy to overcome traditionalism. The switchman doesn't start the engine.
      *   *Break 2: The Nature of the Track.* In the analogy, tracks exist independently of the switchman. In Weber's thesis, the ethic helps *lay* the tracks (institutionalization) before the religious motive dies out.
      *   *Break 3: The Destination.* A switchman chooses between existing tracks. Weber describes the creation of a *new* trajectory (the "Iron Cage") that wasn't a pre-laid option.
      *   *Break 4: Agency.* Who is the switchman? God? The Preacher? The Believer? The analogy obscures the internalization of the norm.

  6.  **Step 4: What the Image Quietly Imports:**
      *   *Dualism:* It reinforces a rigid Matter (Interest) vs. Idea (Culture) dualism.
      *   *Efficient Causation:* It privileges "push" causation (engine) over "shape" causation.
      *   *Pre-existence:* It assumes interests exist *prior* to and *independent* of the cultural framing. Weber argues interests are *defined* by the worldview.
      *   *Formal Cause:* It relegates ideas to formal causes (shaping the path) while reserving efficient cause (motion) for interests.
      *   *Determinism:* It implies a finite set of tracks, whereas history is open.

  7.  **Step 5: Ruling on "Culture as Cause":**
      *   Does the conclusion survive? Yes, but the *type* of causation must be revised.
      *   It's not just "steering." It's *constitutive*. The ethic defines what counts as an "interest."
      *   It's also *generative* in the specific historical context (overcoming traditionalism).
      *   Account of Causation: "Singular Causal Imputation" (Weber's term) + Constitutive Causation. It's about adequate causation in a specific context, not universal laws.

  8.  **Step 6: Proposing a Better Image:**
      *   *Railroad is too mechanical.*
      *   *Idea:* Language/Grammar? (Structures thought but allows speech).
      *   *Idea:* Lens/Prism? (Filters light, but doesn't create it).
      *   *Idea:* *Crystallization*? (Solution becomes solid in a specific structure based on impurities/seed).
