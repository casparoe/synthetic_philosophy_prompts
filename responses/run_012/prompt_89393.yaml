  6.  **Refining and Expanding (Writing the content):**
      *   Need to ensure the logic holds up to the prompt's specific constraint: "a citizen who asks the office to grade the sentence 'this statement is idling,' or 'this statement is not grounded,' forces a verdict the Code cannot give consistently; and the office must never concede that any of its own rulings is neither grounded nor idling."
