      *   **Q2: What is an Idling Statement?** Define the gap (circular support).
      *   **Q3: Can I say a statement is False?** Introduce the hierarchy. You need a higher level to grade a lower level.
      *   **Q4: What about this FAQ?** The self-referential trap. The Office must claim authority without triggering the paradox.
      *   **Q5: What if I say "This Statement is Idling"?** The specific constraint from the prompt. The Office must dismiss this without admitting inconsistency.

  4.  **Developing the Voice:**
