answer: |-
  **CITY OF VERIDIA | OFFICE OF GROUNDED STATEMENTS | PUBLIC FAQ (REV. 7.4)**

  **1. What constitutes a Grounded Statement?**
  A Grounded Statement is a municipal pronouncement that rests ultimately on observable conditions. To be Grounded, a statement must trace a direct line of support to physical facts: the existence of potholes, the allocation of budget funds, or the presence of precipitation. Level 1 statements describe the world. Level 2 statements describe Level 1 statements. A statement is Grounded only if this chain terminates in the world and does not loop back upon itself. Citizens issuing Level 1 statements require no permit. Citizens issuing Level 2 statements regarding the truth of Level 1 statements must file Form T-2.

  **2. What is an Idling Statement?**
  An Idling Statement is a pronouncement whose support chain fails to reach the world. This occurs when Statement A relies on Statement B, and Statement B relies on Statement A. Such loops generate no truth value. They are not False; they are mechanically non-functional, similar to an engine running in neutral. The City does not penalize Idling Statements issued in error, but they carry no administrative weight. An Idling Statement cannot be used to justify a building permit, a tax exemption, or a parking appeal. They are treated as semantic noise.

  **3. Can I declare another citizen's statement False?**
  Only if you are speaking from the appropriate Level. A Level 1 statement cannot assess the truth of another Level 1 statement. To assert that a neighbor's claim regarding property lines is False, you must issue a Level 2 assessment. Attempting to assign a truth grade to a statement at your own level is classified as "Out of Order." Out of Order statements are prohibited from public record. The Office provides soundproof booths for citizens wishing to draft Level 2 assessments to prevent accidental cross-level contamination.

  **4. What if I say, "This Statement is Idling"?**
  This formulation is Out of Order. The sentence assigns a grade (Idling) to a statement at its own level (itself). The Grading Code forbids any statement from grading its own truth status. Therefore, the sentence cannot be issued. If a citizen submits this sentence for adjudication, the Office cannot grade it as Idling, as that would imply the statement is True (and thus Grounded), nor can the Office grade it as Grounded, as the support chain is circular. Consequently, the sentence is rejected at the intake window. Citizens are advised to refrain from constructing self-referential grade assignments.

  **5. Are the answers in this document Grounded?**
  This FAQ is issued by the Office of Grounded Statements under Administrative Authority. Administrative Authority operates at the highest permissible Level to ensure municipal coherence. The statements contained herein define the Levels; they are not subject to grading by lower Levels. To ask if this document is Grounded is to request a Level assessment from a Level that does not exist above the Office. The Office's rulings are constitutive. They establish the ground upon which other statements stand. Therefore, the question is inadmissible.

  **6. What happens if I claim this FAQ is Idling?**
  Such a claim is a Level 2 assessment regarding an Administrative document. Since Administrative documents exist above the Level of citizen assessment, the claim is Out of Order. The citizen will be issued a warning. Repeat offenders may be required to speak only in direct observations of weather or pavement for a period of thirty days. The City relies on clear communication. Semantic instability disrupts public works. Compliance ensures that all parties understand when a statement describes the world, when it describes a statement, and when it is merely noise.
