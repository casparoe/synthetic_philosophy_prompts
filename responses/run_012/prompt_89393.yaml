      *   **Topic:** Satire of solutions to the Liar Paradox (specifically Tarski's hierarchy of languages and truth-value gaps).
      *   **Format:** Official FAQ document from a municipal office (Office of Grounded Statements).
      *   **Tone:** Deadpan, flat, self-assured, bureaucratic (municipal handbook style). No winking at the reader. No explicit mention of "paradox."
      *   **Length:** About 650 words.
      *   **Key Concepts to Satirize:**
          *   Hierarchy of truth (statements about truth must be at a higher level).
          *   Truth-value gaps (statements can be neither true nor false, here called "idling").
          *   Self-reference issues (the FAQ itself must navigate these issues without admitting inconsistency).
      *   **Specific Constraint:** The FAQ must contain statements about its own grade/truth. A citizen asking about "this statement is idling" forces a verdict the Code cannot give consistently, but the Office must never concede its own rulings are problematic.
      *   **Audience:** Accessible to laypeople, recognizable to philosophy nerds.

  2.  **Deconstruct the Satire Targets:**
      *   *Tarski's Hierarchy:* Object language vs. Meta-language. In the city, this becomes "Levels." You can't talk about the truth of Level 1 statements from Level 1. You need Level 2.
      *   *Truth-Value Gaps:* Kripke/Barwise & Etchemendy style. Some sentences are "ungrounded" or "idling." They aren't false, just non-functional.
      *   *The Twist:* The document itself is a set of statements. If it claims to be "grounded," is it? If it says "this statement is idling," what happens? The Office must maintain authority despite the logical holes.

  3.  **Drafting - Section by Section:**

      *   **Header:** Needs to look official. "Office of Grounded Statements," "FAQ," "Code Revision 4.2."
