      *   *Mapping:*
          *   Archer -> The Moral Agent (Prohairesis).
          *   Bow/Arrow -> External instruments/indifferents.
          *   Aiming/Releasing -> The Volition/Assent (Up to us).
          *   Wind/Target Movement -> Fortune/External causes (Not up to us).
          *   Hitting the Mark -> Preferred Indifferent (Health, Wealth, etc.).
          *   Shooting Well -> Virtue (The Good).

  3.  **Analyze the Disanalogies (The "Break"):**
      *   *Unit of Analysis:* Archery is episodic (shot by shot). Life is continuous.
      *   *Skill Acquisition:* Archery implies practice *before* the shot. Stoicism implies practice *in* the living (the shot *is* the life).
      *   *The Mark:* In archery, the mark is fixed/external. In Stoicism, the "mark" (living according to nature) is internal/structural.
