          *   *Crucial Correction:* I should not claim Lewis is a Christian apologist. He is a metaphysician. But the friend's summary makes it sound like a *polemic*. Lewis's style is analytic, not polemic. The friend says Lewis "reckons the theology is the confused side." Lewis is more likely saying "The theology requires a different logic than the courtroom."
