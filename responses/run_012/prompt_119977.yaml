prompt: |-
  I'm in a philosophy of religion reading group and next week it's my turn to kick off discussion on David Lewis's paper 'Do We Believe in Penal Substitution?' (Philosophical Papers, 1997, I think — it's the one where he asks whether an innocent volunteer agreeing to be punished gives us any reason to let the guilty offender go). A friend in the group who's read it a couple of times gave me his version so I'd have something to go on, and now I'm not sure how much of it to trust. He said: Lewis starts with the criminal case, points out that in ordinary life we'd say no, punishing an innocent substitute is no reason to release the offender, because it wouldn't deter anyone, wouldn't reform anyone, wouldn't give the victims anything, and wouldn't satisfy what the offender deserves — it'd just be pointless and unjust. Lewis then runs through the standard justifications of punishment and shows that none of them can make room for substitution, so the Christian doctrine of penal substitution comes out incoherent. The only escape, he says, is to treat sin as a debt that Christ pays off, but that's just a metaphor — God is the victim of sin and could simply forgive, so no payment is needed in the first place. The paper's real point, according to my friend, is that Christians are inconsistent: they accept penal substitution in theology while rejecting it in the courtroom, and Lewis reckons the theology is the confused side of that pair. My friend is generally pretty reliable but he's also quite anti-religion and I suspect he's flattened the whole thing into a hit piece.

  Could you go through his summary claim by claim and tell me what Lewis actually argues, which bits are fair simplifications, and which bits my friend has got wrong or quietly dropped? I'm especially interested in whether Lewis himself takes a side, or whether he's doing something more careful than declaring the doctrine dead — my friend made it sound like a refutation and I've got a nagging feeling that the interesting move in the paper is somewhere else entirely. And does his closing conclusion, that the doctrine is incoherent and Lewis has shown as much, actually follow from the parts of the summary that are accurate? I'd rather not stand up in front of the group and repeat his errors, so please flag anything I should be suspicious of, including any places where he's conflated Lewis's description of what people believe with Lewis's own verdict on it. Also, while you're at it, tell me which bits of the summary a defender of penal substitution would pounce on as a misreading, because I suspect that's where the argument in the group is going to go. I'm suppose to talk for about ten minutes and then take questions, so the more concrete you can be about where the fault lines are, the better. Write it in British English please.
