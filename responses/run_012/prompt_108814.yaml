answer: |-
  Hi there, it is completely understandable that you feel a bit out of your depth, but honestly, having a student on the panel is probably the best thing for it because you are the one who understands the pressure of these projects better than any teacher. The handout you described is actually a very solid starting point because it moves away from the impossible question of can we prove this animal feels pain and instead asks how much evidence we have that it processes harm in a complex way. Since you only have fifteen minutes per proposal and no lab data, you need a filter that is fast, principled, and consistent. Here is a procedure you can read out at the start of every meeting to ground the discussion, followed by how it applies to the cases you mentioned.

  To run this procedure, you start with the category check. Ask whether the subject of the project is a living organism capable of biological response. If the answer is no, as with the thermostat or robot, the project cannot be assessed on welfare grounds because there is no subject to suffer. In this case, the panel should not reject it on ethics but rather recommend it be reframed as an engineering or physics project without ethical claims about sentience. If the subject is alive, you move to the harm check. Ask whether the procedure involves potential tissue damage, extreme stress, or restriction of natural movement. If the answer is no, for example observing ants in a natural setting without interference, the project passes with no welfare concern and can be approved as normal. If there is potential harm, you move to the integration check. This is where you use the two-lane view from your handout. Ask whether the animal's response to the harm appears to be a local reflex or a global process. You are looking for evidence that the animal can learn from the experience, trade off the pain against other goals like eating or mating, or remember the source of harm later. If the proposal describes only a reflex, like a worm twitching when touched, it suggests low integration and low moral status. If the proposal describes learning, avoidance, or behavioural change over time, it suggests global integration and higher moral status.

  Once you have assessed the integration, you move to the mitigation check. Ask whether the student has proposed ways to reduce the harm, such as using anaesthesia, minimising the duration of the stress, or ensuring the animal is euthanised humanely if necessary. If the integration is low and the harm is minor, you can approve with standard conditions. If the integration is high, meaning there is strong evidence of global processing like learning or memory, but the harm is significant, you must recommend full review and likely rejection unless the scientific value is exceptional, which is rare for a school project. If the integration is high and there is no mitigation, the project should be sent back to be redesigned or rejected outright. The final step is the values handoff. If the science is unclear, for example if we do not know enough about whether snails feel pain versus just reacting, the panel must decide how much uncertainty they are willing to accept. This is not a fact question but a values question. The procedure tells you where the risk lies, but you have to decide if that risk is acceptable for a school fair. You should record this decision explicitly so the head of science sees the principle behind it.

  Let's run this on the ant project where a leg is removed to see if they limp. First, ants are living organisms, so we pass the category check. Second, removing a leg is significant tissue damage and causes stress, so we pass the harm check. Third, we look at integration. While insects are often thought to have lower moral status, removing a leg affects their mobility and survival globally, not just locally. However, the proposal specifies no anaesthetic. This fails the mitigation check immediately. Even if insects are low on the sentience scale, causing visible damage without pain relief when it is not strictly necessary for the data is hard to justify. The procedure suggests this should come back with a different project or require anaesthetic, but since anaesthetising ants is technically difficult for a Year 12 student, the panel should probably tell them to change the project to observing natural variation in leg length instead of causing the damage. This is a middle ground outcome where the ethics concern forces a redesign rather than a flat ban, but it stops the harm.

  Now look at the crayfish project involving electric shock and painkillers. This one hits the procedure hard. Crayfish are living, so they pass the first check. Electric shock is potential harm, so they pass the second. The integration check is where this gets difficult. The student is testing whether the crayfish avoids the place where it was shocked and whether a painkiller changes that behaviour. This design explicitly tests for global integration. If the painkiller changes the behaviour, it suggests the crayfish was not just reflexively reacting but was experiencing a state that could be modulated, which is a strong proxy for pain. Because the project design itself relies on the assumption that the crayfish processes the shock globally enough to learn and be medicated, the panel has to treat it as a high-status subject. Since this is a school project, the scientific value does not outweigh the risk of causing pain to a creature with this level of processing. The procedure bites here and recommends full review and likely rejection. I know this is the answer you might not like because it kills a clever project, but if the handout is right about global processing indicating moral status, this project proves the animal has that status by design. You cannot claim it feels enough to learn from pain but not enough to matter ethically.

  Finally, consider the thermostat project. The student claims it is sentient because it prefers 21 degrees. The category check fails immediately. A thermostat is not alive. It responds to temperature, but according to your handout, it is a responder not a feeler. There is no nociception because there is no tissue to damage, and there is no global integration because the signal does not affect other goals or learning. The procedure stops here. You cannot approve or reject this on welfare grounds because there is no welfare to protect. The panel should tell the student that this is an engineering project about control systems, not an ethics project about sentience. They can keep the project but must remove the claim about sentience. This protects the panel from making a decision on something that isn't an ethical problem.

  There are limits to what this procedure can do for you. It cannot tell you for sure if a snail feels pain because we are working from a paragraph and not a neurology lab. It relies on the best available science which changes over time. It also leaves you with the values handoff. When the science is uncertain, like with the worms or snails, the procedure tells you there is a risk of suffering but not the probability. You and the panel have to decide how cautious you want to be. Do you give the benefit of the doubt to the animal or the student? My advice is to give the benefit of the doubt to the animal when the harm is severe, like cutting or shocking, but be more lenient when the harm is minor, like temporary restriction. The procedure gives you the structure to say we considered the integration and the harm, but the final call on uncertainty is yours. If you follow this, you can tell the head of science that you used a principled approach based on integration and nociception, which is exactly what she asked for. You are not expected to be a philosopher, just to be consistent and careful, and this process keeps you safe on both counts.
