  Even with (5) revised, the Ganymede case nags. If reproduction isn't necessary, and metabolism is, where do we draw the line between a robust crystal and a metabolising cell? You must settle whether 'repair' implies active error correction or merely thermodynamic stability. The next question to settle is: does self-maintenance require a membrane boundary, or is chemical autonomy sufficient? Without this, the robot may still flag mineral gradients as biological. You need a thermodynamic threshold for 'active' uptake to prevent false positives from geochemistry.
