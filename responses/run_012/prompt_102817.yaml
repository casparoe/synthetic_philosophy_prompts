      *   *Alternative:* Perhaps breaking them releases their power, or prevents them from being used by spirits, or marks a contract that doesn't require them to be "persons."
      *   *Closing:* The pattern proves procedure, not theology.

      *Refining for Character:* Make it sound like a seasoned academic. "You have constructed a compelling narrative, I grant you..." "But notice where your certainty outpaces the clay..."

      *Draft:* You have constructed a compelling narrative, I grant you, and I will concede immediately that this deposit is not refuse; the symmetry of the arrangement and the sealing beneath the threshold scream of intentional deposition, what we might cautiously call ritual. However, you have leaped from the undeniable fact of deliberate action to a specific cosmology that the material simply cannot sustain without borrowing assumptions from elsewhere. Why must the figurines be considered "alive" to warrant breaking? In many cultures, objects are broken to release a spirit, to prevent their misuse by malign forces, or to signify a contract's completion, none of which requires the object itself to possess personhood. Furthermore, you argue these were to "accompany the dead," yet you placed this deposit under the threshold of a house, a locus typically associated with the living, ancestors protecting the household, or foundation sacrifices, not necessarily burial. The material record here confirms a structured practice, but it remains silent on the internal justification; you have read a specific myth into a pattern of behavior that could equally support a dozen contradictory beliefs.

