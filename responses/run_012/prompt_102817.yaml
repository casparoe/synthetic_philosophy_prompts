      *   **Context:** Shallow hearth beside pit with burnt barley. Sealed beneath clean clay. Directly under the threshold of a house.
      *   **Student's Inference:** Ritual "killing" of person-like objects to accompany the dead (though the text says "accompany the dead," the context is under a house threshold, which usually implies foundation deposits or household protection, not necessarily graves, but I should address the student's specific claim).
      *   **Student's Challenge:** If this isn't evidence for belief, nothing is.

  3.  **Formulate the Archaeologist's Response:**
