          *   *Translation:* It's not a CAP tradeoff. It's a Schema Design tradeoff. You can't enforce a derived constraint if you allow independent writes on the dependencies without a distributed transaction locking all three keys.
      *   *Verdict:* It's not a CAP limitation. It's a "Write Skew" anomaly that requires stronger isolation (Serializable) or a different write pattern (Materialized View).

  7.  **Refining the "Backend Engineer" Voice:**
      *   Avoid philosophical jargon (unless translating it).
