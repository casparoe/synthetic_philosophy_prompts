      *   **Problem:** The "Discursive Dilemma" (or Doctrinal Paradox). Voting on premises ($A, B$) vs. conclusion ($C$) yields inconsistent collective outcomes ($A=\text{Yes}, B=\text{Yes}, C=\text{No}$ despite $A \land B \to C$).
      *   **Task:** Translate the philosophical problem (judgment aggregation, impossibility theorems, strategic voting, normativity) *faithfully* into distributed systems vocabulary. Not a loose analogy, but a rigorous mapping.
      *   **Deliverables:**
          1.  The Translation (restating the paradox in DB terms).
