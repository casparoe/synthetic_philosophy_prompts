      *   **Tone:** Technical, precise, honest ("don't spare my feelings"), respectful of the user's expertise.

  2.  **Deconstruct the Philosophical Problem (Discursive Dilemma):**
      *   **Agents:** $N$ individuals (board members).
      *   **Propositions:** $A, B, C$.
      *   **Constraint:** $A \land B \to C$ (Integrity Constraint).
      *   **Individual Rationality:** Each agent holds a consistent set of judgments (e.g., Yes/Yes/Yes or No/Yes/No).
      *   **Aggregation Rule:** Majority voting on each proposition independently.
      *   **Collective Irrationality:** The aggregated result violates the constraint (Yes/Yes/No).
      *   **Impossibility Theorem (List & Pettit):** You can't have a function that satisfies Universal Domain, Anonymity, Systematicity/Independence, and Collective Rationality simultaneously.
      *   **Normativity:** Votes represent *judgments* (truth/obligation), not just preferences.
      *   **Strategy:** Agents might lie about premises to force a desired conclusion.

  3.  **Deconstruct the Distributed Systems Vocabulary:**
      *   **Nodes/Replicas:** Board members.
      *   **State:** Individual judgments ($A, B, C$).
      *   **Quorum/Consensus:** Majority vote.
      *   **Schema/Constraint:** $A \land B \to C$.
      *   **Transaction:** The voting process.
      *   **Consistency Models:** Strong vs. Eventual.
