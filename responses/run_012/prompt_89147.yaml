          1.  Each Replica holds a local transaction proposing values for keys $A, B, C$.
          2.  Locally, every Replica satisfies the check constraint ($A \land B \le C$).
          3.  Coordinator aggregates via Quorum Read per key.
          4.  Result: $A=1$ (Quorum met), $B=1$ (Quorum met), $C=0$ (Quorum met for 0).
          5.  Global State: $\{A=1, B=1, C=0\}$.
          6.  Constraint Check: Fails.
          7.  System is now in an invalid state (Split Brain / Constraint Violation).

  5.  **Drafting the Residue Report (The "Diff"):**
      *   *Clean Maps:*
          *   Consistency $\to$ Logical Consistency.
          *   Quorum $\to$ Majority Rule.
          *   Constraint Violation $\to$ Collective Irrationality.
          *   Write Skew $\to$ The Paradox itself (two independent writes causing a third state to be invalid).
      *   *Fudges/Distortions:*
          *   *State vs. Judgment:* In DBs, state is just bits. In philosophy, it's a *belief* or *obligation*.
          *   *Independence:* DB columns are often independent unless constrained. Philosophical propositions are semantically linked.
