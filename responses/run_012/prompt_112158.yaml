answer: |-
  Your board is encountering the doctrinal paradox (or discursive dilemma), a settled result in judgment aggregation theory: no voting procedure can simultaneously satisfy universal domain, anonymity, systematicity, and collective consistency for non-trivial logical agendas. Since the impossibility theorem is proven, your "open questions" are not mathematical but normative and procedural. You must choose which axiom to sacrifice.

  Here is a prioritized agenda for the theoretical questions you must resolve to design a workable procedure.

  ### 1. The Normative Justification for Premise-Based vs. Conclusion-Based Procedures
  **Status:** Theoretically settled (both exist); Normatively open for your context.
  **Upstream Dependency:** This is the primary architectural choice. Every other design feature (weighting, grading, abstention) operates within the structure you choose here.
  **Tractability:** High. This requires philosophical argument, not new math.
  **Why First:** You must decide whether the board's authority derives from the correctness of its reasoning (Premise-Based Procedure, PBP) or the acceptability of its outcome (Conclusion-Based Procedure, CBP). In PBP, you vote on the sub-questions and derive the verdict logically. This guarantees consistency but may yield a verdict no member individually supports. In CBP, you vote on the verdict directly. This respects individual integrity but may endorse a verdict based on reasoning the majority rejected.
  **Impact of Relaxations:** If you choose PBP, graded confidence and weighting become tools to refine the premise votes. If you choose CBP, these tools are largely irrelevant to the paradox, as you bypass the logical connection entirely.

  ### 2. The Feasibility of Agenda Restructuring to Avoid Logical Interdependence
  **Status:** Open in application; Settled in theory (special domains avoid impossibility).
  **Upstream Dependency:** Depends on Q1. If you choose PBP, you must ensure your sub-questions do not logically force the paradox.
  **Tractability:** Moderate. Requires logical analysis of your specific ethics criteria.
  **Why Second:** Impossibility theorems assume specific logical connections between propositions (e.g., $A$, $B$, and $A \land B \to C$). If you can draft your sub-questions such that they are logically independent, or if you can restrict the admissible combinations of judgments (domain restriction), the paradox vanishes without needing complex aggregation rules.
  **Impact of Relaxations:** Abstention helps here. If members can abstain on logically complex sub-questions, the effective agenda shrinks, potentially moving the group into a "safe" domain where majority rule is consistent.

  ### 3. The Legitimacy and Measurement of Epistemic Weighting
  **Status:** Highly Contested.
  **Upstream Dependency:** Depends on Q1 and Q2. Weighting is only useful if the aggregation rule (PBP) values truth-tracking over equality.
  **Tractability:** Low for philosophers, high for statisticians (but requires data you likely lack).
  **Why Third:** Weighting votes by competence (epistocracy) violates the anonymity axiom, theoretically allowing you to escape impossibility results. However, it introduces a massive practical burden: defining and measuring "competence" without bias. In a foundation setting, this can undermine the political legitimacy of the board even if it improves epistemic accuracy.
  **Impact of Relaxations:** This is the specific relaxation you are weighing. It is theoretically powerful but practically fragile.

  ### The Rabbit Hole: Graded Confidence
  Of the three relaxations you proposed, **registering graded confidence** is the rabbit hole most likely to consume your attention without improving the procedure.
  **Why:** The discursive dilemma is a problem of *logical consistency* in binary outputs (Approve/Reject). Moving to continuous inputs (0–100% confidence) does not solve the logical tension; it merely shifts it. You still need a threshold to issue a binary verdict. Aggregating probabilities introduces new impossibility theorems (e.g., regarding calibration and independence) and requires psychometric validation of what "70% confidence" means across different members. For a weary board, the cognitive load of assigning probabilities to ethical premises outweighs the marginal gain in aggregation precision. It solves a measurement problem you do not have while ignoring the logical problem you do.

  ### Safe to Set Aside
  Two theoretical concerns that look central from the inside but are negligible for your purposes:

  1.  **Strategy-Proofness (Manipulability):** Theory worries that members will lie about their judgments to achieve a preferred outcome. In an internal ethics board, members are typically norm-seeking rather than preference-seeking. The risk of tactical voting is low compared to the risk of sincere disagreement. Designing a procedure to prevent gaming is a waste of energy if members are not trying to game it.
  2.  **Infinite Agenda Generalizability:** Much of the formal literature focuses on properties holding for any possible set of propositions. Your agenda is fixed and small (consent, risk, benefit). You do not need a general theory of aggregation; you need a specific rule for your specific checklist. Ignore impossibility results that rely on large or infinite proposition sets.

  ### Summary of Ordering
  The ordering holds even when relaxing classical assumptions. You cannot determine how to weight votes (Q3) or whether to allow abstention (Q2) until you decide whether you are aggregating reasons or outcomes (Q1). Graded confidence is deprioritized because it adds complexity to the input without resolving the logical constraint on the output.

  \answer{Premise versus conclusion aggregation}
