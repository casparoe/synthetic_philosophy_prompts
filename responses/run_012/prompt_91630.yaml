answer: |-
  This is a remarkably sharp observation. You have not misused philosophical terms; rather, you have identified a genuine friction point in the philosophy of computer science that often goes unexamined by practitioners. You are describing a conflict between **ontological realism** (complexity classes are real features of the universe) and **pragmatic instrumentalism** (complexity classes are tools for managing risk).

  Here is a reconstruction of the philosophical commitments your field's practices presuppose, followed by an analysis of the tensions, underdetermination, and counterfactuals you requested.

  ---

  ### 1. The Ontology of Complexity: What is the Theory About?

  When engineers treat NP-completeness as a "settled fact," they are implicitly committing to a form of **Structural Realism** regarding computational problems.

  *   **The Commitment:** You are assuming that a "problem" (like Traveling Salesman) exists independently of any specific algorithm, and that it possesses intrinsic structural properties (like "hardness") that resist manipulation.
  *   **The Physical Link:** To treat this as a "physical fact," you are also relying on the **Extended Church-Turing Thesis**. This thesis posits that any physically reasonable model of computation can be simulated by a probabilistic Turing machine with at most polynomial overhead. Without this, complexity classes would be artifacts of the Turing machine model, not limits of the physical world.
  *   **The Tension:** When you ship a SAT solver, you shift to **Instance Realism**. You acknowledge that while the *Problem* (the set of all possible instances) is hard, the *Instance* (the specific input your customer provided) resides in a "easy" subset of the solution space.
  *   **Philosophical Presupposition:** Practice presupposes that the distribution of instances encountered in the physical world is not uniform over the problem space. It assumes the universe is "kind" enough that it rarely generates worst-case instances of NP-complete problems naturally.

  ### 2. Worst-Case vs. Typical-Case: The Meaning of "Intractable"

  When you call a problem intractable because it is NP-complete, you are making a modal claim: *"No efficient algorithm exists."* But when you solve it, you are making an existential claim: *"An efficient algorithm exists for this input."*

  *   **The Presupposition:** This practice relies on a heuristic identification of **Worst-Case Complexity** with **Typical-Case Complexity**.
  *   **The Gap:** Theoretically, these are distinct. A problem can be NP-complete but have 99.9% of its instances solvable in linear time (under some distribution).
  *   **The Engineering Wager:** By treating NP-completeness as a stop-sign, engineers are betting that the *structure* required to make the problem hard is not accidental. They presuppose that if a problem is NP-complete, the "hardness" is dense enough in the solution space that stumbling upon an easy instance is luck, not expectation.
  *   **Epistemic Status:** A proof of NP-completeness is a fact about a **formal system** (reductions within ZFC), not directly a fact about the **world**. The practice presupposes a bridge principle: *Formal hardness correlates with physical difficulty.* This is an empirical hypothesis, not a mathematical theorem, yet it is treated with the confidence of the latter.

  ### 3. The Theory of Feasibility: Is P = Feasible?

  The identification of "feasible" with "polynomial-time" is known as the **Cobham-Edmonds Thesis**.

  *   **Does Practice Require It?** Strictly speaking, **no**. Engineering practice does not require $P$ to be the exact boundary of feasibility. It requires a **scalability threshold**.
  *   **The Nuance:** Engineers know that $O(n^{100})$ is infeasible and $O(1.0001^n)$ might be feasible for small $n$. However, polynomial time is used as a **proxy for compositionality**. If you compose two polynomial algorithms, you get a polynomial algorithm. If you compose two exponential ones, you get a worse exponential.
  *   **Philosophical Commitment:** The practice presupposes that **asymptotic behavior is a reliable guide to concrete behavior**. This is a bold claim. It assumes that the constants hidden by the Big-O notation are not astronomically large for the problems we care about. When this assumption fails (e.g., the Simplex algorithm is exponential worst-case but linear average-case), engineers ignore the theory and trust the benchmark. Thus, the commitment to $P$ is **methodological**, not ontological. It is a language for discussing scaling, not a law of physics.

  ### 4. The Epistemology of Cryptography: Belief Without Proof

  Cryptographic practice is the clearest example of **Fallibilist Pragmatism**.

  *   **The Assumption:** Crypto relies on the existence of One-Way Functions (OWF). Note that $P \neq NP$ is necessary for OWFs, but not sufficient.
  *   **Epistemic Justification:** Engineers treat these assumptions as **empirically corroborated conjectures**. The justification is abductive (Inference to the Best Explanation): *"The best explanation for why thousands of cryptanalysts have failed to break RSA for 40 years is that factoring is hard."*
  *   **The Commitment:** This presupposes that **mathematical truth can be probabilistic**. In pure math, a statement is true or false. In crypto engineering, a statement (e.g., "Factoring is hard") has a **confidence level**.
  *   **Risk Management:** Staking security on unproven assumptions is not a claim to knowledge; it is a claim to **risk assessment**. It presupposes that the cost of waiting for a proof exceeds the risk of the proof being false. This is a distinctly economic/decision-theoretic stance, not a purely epistemic one.

  ---

  ### 5. Tension vs. Consistency: Is There a Contradiction?

  You suspect a tension between "hardness-is-a-fact" and "hardness-is-an-assumption." Let's separate what is strictly required from what is merely rhetorical.

  **The Apparent Contradiction:**
  1.  "NP-Complete problems cannot be solved efficiently." (Universal Claim)
  2.  "We solved this NP-Complete problem efficiently." (Existential Claim)

  **The Resolution:**
  There is no logical contradiction if we distinguish between the **Problem Class** and the **Instance Distribution**.
  *   **Strict Requirement:** Practice *requires* that worst-case complexity is a poor predictor of specific instance complexity.
  *   **The Real Tension:** The tension is not logical; it is **sociological and rhetorical**.
      *   When talking to management, engineers use the "Hardness-is-Fact" model to manage expectations ("We can't build a perfect scheduler").
      *   When talking to compilers/optimizers, engineers use the "Hardness-is-Contingent" model ("The SAT solver will probably find a solution").
  *   **Inconsistency:** The inconsistency lies in the **modal strength** of the claims. Engineers often speak of NP-completeness as a *physical impossibility* ("No algorithm *ever* will"), which is false. It is merely a *complexity-theoretic improbability* based on current knowledge. The practice tolerates this hyperbole because it serves a useful social function (discouraging wasted effort), even if it is philosophically imprecise.

  **Where the Practice is Underdetermined:**
  Several conflicting philosophical views license the exact same engineering behavior:
  1.  **Platonism:** Complexity classes are real structures; we are navigating them.
  2.  **Formalism:** Complexity classes are games with symbols; they just happen to predict runtime well.
  3.  **Empiricism:** We don't know what complexity classes *are*, but we know that when we see "NP-Complete," runtime tends to spike.

  As long as the correlation between the label "NP-Complete" and "slow runtime" holds, the code remains the same. The ontology is underdetermined by the practice.

  ---

  ### 6. The Counterfactual: Changing the Presupposed View

  Suppose we replaced the current view with a rival one. How would practice change?

  **Rival View A: "Complexity Classes are Artifacts of Asymptotics"**
  *   *View:* We reject the Cobham-Edmonds thesis as too coarse. We care about **Concrete Complexity** (exact step counts for $n < 10^6$).
  *   *Practice Change:*
      *   We would stop saying "This is in P" as a virtue. (An $O(n^{10})$ algorithm is useless).
      *   We would stop saying "This is NP-Complete" as a vice. (An $O(1.0001^n)$ algorithm is fine for small $n$).
      *   **Result:** We would see more **Parameterized Complexity** in standard engineering. We would classify problems not by class, but by specific parameters (e.g., "This is hard only if the treewidth is high").
      *   *What stays the same:* We would still use SAT solvers. We would still use crypto. The *tools* don't change, only the *justification* for using them.

  **Rival View B: "Average-Case is King"**
  *   *View:* Worst-case complexity is irrelevant. Only the distribution of inputs matters.
  *   *Practice Change:*
      *   **Crypto:** This would be devastating. Crypto *requires* worst-case (or rather, specific hard instance) hardness. If we only cared about average case, we couldn't guarantee security against an adversary who specifically hunts for weak keys.
      *   **Algorithms:** We would stop teaching reductions. We would start benchmarking on "real world distributions."
      *   **Result:** A shift from **guarantees** to **Service Level Agreements (SLAs)**. Instead of "This algorithm is correct," we say "This algorithm is correct 99.99% of the time on production data."

  **Rival View C: "Hardness is Epistemic, Not Ontological"**
  *   *View:* Problems aren't hard; *we* are just not smart enough yet. P might equal NP.
  *   *Practice Change:*
      *   **Crypto:** We would migrate aggressively to **Information-Theoretic Security** (One-Time Pads, Quantum Key Distribution) wherever possible, because computational security would be viewed as inherently temporary.
      *   **Optimization:** We would invest significantly more in heuristic search (Genetic Algorithms, ML-based solvers) under the assumption that a "general solver" might be just around the corner.
      *   *What stays the same:* We would still avoid writing exponential loops for large $n$. Prudence dictates acting *as if* P $\neq$ NP even if you believe it might be false, because the downside risk is total system failure.

  ### Summary

  Your colleagues are not being irrational; they are being **pragmatic realists**.

  1.  **Ontology:** They treat complexity classes as real *enough* to guide high-level architecture, but fluid *enough* to allow for heuristic breakthroughs.
  2.  **Feasibility:** They use Polynomial Time as a sociological boundary for "acceptable scaling," not a physical law.
  3.  **Epistemology:** They treat unproven hardness assumptions as **empirically stable regularities**, sufficient for engineering risk models but insufficient for mathematical truth.

  The tension you feel is the gap between **Theory** (which deals in absolutes, worst-cases, and asymptotes) and **Engineering** (which deals in probabilities, typical-cases, and concrete constants). The practice presupposes that this gap is navigable. It assumes that the "worst-case" is a rare path in the landscape of physical reality, and that "unproven" conjectures can be treated as facts provided the cost of being wrong is manageable.

  If you were to make the philosophy fully consistent with the theory, you would become paralyzed (unable to ship crypto or solvers). If you made it fully consistent with the practice, you would become theoretically blind (unable to predict scaling issues). The "inconsistency" you noticed is actually a **necessary cognitive dissonance** that allows computer science to function as both a science and a trade.
