prompt: |-
  I'm a journalist who writes about science and ideas, and I also take a regular shift on the standards desk at a mid-sized publication. A recurring problem lands there: someone we cover — a researcher, a science communicator, a public intellectual — criticizes something (hype, undisclosed conflicts of interest, misinformation, ethical corner-cutting), and then a reporter or a tipster points out that the critic has done the same thing, or something uncomfortably close to it. Sometimes the hypocrisy is the story we are pitched; sometimes it is a paragraph a writer wants to slip in to take the critic down a peg; sometimes it is the defense a subject raises against the critic, insisting the critic has no right to complain. We face three or four of these a month, always against a same-day or next-morning deadline, and I have been resolving them by gut. I would like a procedure instead.

  Please turn the philosophical work on standing to blame — the question of who is entitled to hold whom to account, and what hypocrisy does and does not take away from a criticism — into a decision procedure that a non-philosopher on the desk can run in about twenty minutes. Keep what the underlying ideas actually say while making it usable by someone who has never read any of it, and be explicit about which distinctions have to survive the simplification and which can be dropped.

  The procedure should ask its questions in order, say what counts as a sufficient answer to each, mark the point at which it stops with a no, and mark the point at which it hands the decision to a person because the remaining question is one of editorial values rather than fact. It should keep separate at least these threads: whether the charge is accurate; whether the critic meets whatever conditions the literature attaches to having standing — their own record on the very norm they are invoking, their complicity in the practice, whether the matter is any of their business, and whether they enforce the norm selectively against opponents while excusing allies; and whether, standing aside, the underlying issue has independent news value. It should have something to say about the reformed wrongdoer who has acknowledged and changed course, about the standing objection raised in bad faith purely to change the subject, and about the case where the norm itself is contested and no one is sure the critic has violated it. And it must not let the messenger question become a way of quietly dropping a true charge, or a way of running a true charge while pretending the messenger is irrelevant.

  Then run the procedure on three cases and show your work at each step: a prominent science communicator who campaigns against overstated claims and has made an overstated claim about their own field in a promotional setting; a public-health figure who urged strict caution and was photographed ignoring their own guidance; and a researcher who years ago did exactly the thing they now campaign against, has since disclosed it and changed practice, and is now leading a push for the norm they once broke — a case where I suspect the procedure will tell me the person has standing, which is not the answer the colleague who wants to write the piece is hoping for. Use one more case only in passing if it helps: an industry-funded outfit criticizing a researcher's conflicts of interest, where the messenger is compromised but the underlying point may still be checkable and publishable on its own.

  Close by telling me what the procedure cannot do — in particular which of these decisions remain value judgments that no procedure will settle, and where the procedure is likely to misfire. State how confident you are in the procedure's fidelity to the underlying philosophy, and single out the one step where you are least sure the simplification preserves the point rather than losing it.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Journalist/Standards Desk editor at a mid-sized publication.
      *   **Problem:** Recurring "tu quoque" (you also) situations where a critic is accused of hypocrisy. Needs a decision procedure to handle these under deadline pressure (20 mins).
      *   **Goal:** Turn philosophical work on "standing to blame" into a usable checklist/flowchart.
      *   **Requirements:**
          *   Keep underlying philosophical ideas accurate but simplified.
          *   Explicit about what distinctions survive vs. drop.
          *   Sequential questions with sufficient answers.
          *   Stop points (No = kill/modify story).
          *   Hand-off points (Editorial judgment).
          *   Separate threads: Accuracy of charge, Standing conditions (record, complicity, relevance, selectivity), Independent news value of underlying issue.
          *   Address specific nuances: Reformed wrongdoer, bad faith objections, contested norms.
          *   Avoid pitfalls: Don't let messenger questions kill true charges; don't let them validate irrelevant attacks.
          *   **Test Cases:** Run on three specific scenarios (Science Communicator, Public Health Figure, Reformed Researcher) + one passing mention (Industry-funded outfit).
          *   **Closing:** Limitations, value judgments, confidence level, weakest link in simplification.

  2.  **Deconstruct the Philosophy (Standing to Blame):**
      *   *Core Concept:* Standing is the normative authority to hold someone accountable. It's distinct from the *truth* of the accusation.
      *   *Key Philosophers:* Bell (2020), Fritz & Miller (2022), Isserow & Klein (2017), Wallace (2010).
      *   *Key Distinctions:*
          *   *Truth of Charge:* Is the criticism factually correct? (Separate from standing).
          *   *Hypocrisy:* Violating the very norm one invokes.
          *   *Complicity:* Being involved in the systemic issue without necessarily violating the specific norm.
          *   *Selectivity:* Enforcing norms only against enemies (partisan enforcement).
          *   *Relevance/Authority:* Is this their business? (e.g., foreign interference).
          *   *Waiver/Reform:* Acknowledging past wrongs can restore standing.
          *   *Bad Faith:* Raising hypocrisy solely to distract (whataboutism).
      *   *Journalistic Translation:*
          *   Truth = Verification.
          *   Standing = Editorial justification for *this* reporter/source making *this* critique.
          *   News Value = Does the underlying issue matter regardless of the critic?

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Constraint:* 20 minutes. Needs to be fast, binary (Yes/No), and clear.
      *   *Structure:*
          1.  Verify the Underlying Charge (Truth).
          2.  Verify the Hypocrisy Charge (The "You Too").
          3.  Assess Standing (Does the hypocrisy kill the critique?).
          4.  Assess News Value (Does the story survive without the critic?).
          5.  Editorial Judgment (Tone/Placement).
      *   *Refining Standing:* This is the tricky part. Philosophers say hypocrisy *diminishes* standing but doesn't always *eliminate* it. For journalism, we need to know: Do we run the critique *through* this person, or do we run the underlying story *despite* them?
      *   *The "Reformed" Clause:* Crucial. If they admitted it and changed, standing is often restored (Bell).
      *   *The "Selectivity" Clause:* If they only attack enemies, standing is weak (Fritz & Miller).
      *   *The "Bad Faith" Clause:* If the source of the hypocrisy tip is trying to distract, note it but don't let it kill the story.

      *   *Drafting the Steps:*
          *   Step 1: Is the criticism true? (If No, stop).
          *   Step 2: Is the hypocrisy charge true? (If No, ignore hypocrisy).
          *   Step 3: Is it the *same* norm? (Specific vs. General).
          *   Step 4: Reform/Disclosure? (If Yes, Standing likely holds).
          *   Step 5: Selectivity? (If Yes, Standing weak).
          *   Step 6: Independent Value? (If Yes, run story, contextualize critic).

      *   *Refining for the Prompt:* The prompt asks for a procedure that resolves whether to *run the critique*, *run the hypocrisy*, or *kill*. It needs to handle the "Standards Desk" role.
      *   *Decision:* The procedure should output one of three recommendations: 1. Run Critique (Hypocrisy irrelevant/minor), 2. Run Critique + Contextualize Hypocrisy (Standing compromised but issue matters), 3. Kill/Shift Focus (Standing lost, issue trivial).

      *   *Let's build the "Standing Test" specifically:*
          *   Q1: Accuracy of Primary Charge.
          *   Q2: Accuracy of Hypocrisy Charge.
          *   Q3: Norm Identity (Is it the same rule?).
          *   Q4: Reform/acknowledgment.
          *   Q5: Partisan Enforcement.
          *   Q6: Independent News Value.

  4.  **Developing the Test Cases:**
      *   *Case 1 (Sci Comm):* Overstates claims vs. campaigns against overstatement.
          *   Analysis: Same norm? Yes. Reform? No. Selectivity? Maybe. Value? High.
          *   Outcome: Run critique, note the slip.
      *   *Case 2 (Public Health):* Masking guidance vs. photographed unmasked.
          *   Analysis: Same norm? Yes. Context matters (private vs public). Reform? N/A.
          *   Outcome: Nuanced. Standing diminished but guidance still valid.
      *   *Case 3 (Reformed Researcher):* Past sinner, now saint.
          *   Analysis: Same norm. Reform? Yes (disclosed/changed).
          *   Outcome: Standing holds. (As predicted by user).
      *   *Case 4 (Industry Outfit):* COI vs. COI.
          *   Analysis: Complicity/Selectivity.
          *   Outcome: Verify underlying claim independently.

  5.  **Refining the Philosophy-to-Practice Mapping:**
      *   *Distinction to Keep:* Truth of accusation vs. Authority of accuser. (Crucial).
      *   *Distinction to Keep:* Hypocrisy (violating norm) vs. Complicity (benefiting from system).
      *   *Distinction to Drop:* Deep moral metaphysics of "moral address." We care about *credibility* and *fairness*, not moral ontology.
      *   *Weakest Link:* Determining "Selectivity." Hard to prove in 20 mins. Need to simplify to "Pattern of behavior."
      *   *Confidence:* High on structure, moderate on the "Selectivity" simplification.

  6.  **Writing the Response:**
      *   *Tone:* Professional, direct, newsroom-appropriate.
      *   *Structure:*
          1.  Introduction (Philosophy summary).
          2.  The Procedure (The "Standing Desk Checklist").
          3.  The Test Cases (Walkthrough).
          4.  Limitations & Confidence.
      *   *Self-Correction during drafting:* Make sure the "Stop" points are clear. Ensure the "Reformed Wrongdoer" logic is explicit (acknowledgment restores standing). Ensure the "Bad Faith" element is addressed (don't let the *source* of the tip dictate the story, but acknowledge the distraction).

      *(Self-Correction on Case 3)*: The user suspects the procedure will say the Reformed Researcher *has* standing, which the colleague dislikes. I need to ensure the procedure validates this philosophical insight (that reform restores standing) clearly, so the journalist understands *why* the colleague's instinct might be wrong.

      *(Self-Correction on Time)*: Emphasize that fact-checking (Step 1 & 2) is the time sink; the *standing* logic (Step 3-6) must be fast.

      *(Final Polish)*: Check against all constraints in the prompt.
      *   20 mins? Yes, if facts are known.
      *   Separate threads? Yes (Accuracy, Standing, News Value).
      *   Reformed/Bad Faith/Contested? Included.
      *   Closing limitations? Included.

  7.  **Final Review of the "Standing" Logic:**
      *   Philosophers like Macalester Bell argue that if you acknowledge your fault, you regain standing.
      *   Philosophers like Isserow & Klein argue hypocrisy undermines the *commitment* to the norm.
      *   Journalistic translation: If they admit it, they are credible on the *need* for the norm. If they hide it, they are not.
      *   Selectivity (Fritz & Miller): If they only attack enemies, they are weaponizing the norm, not upholding it. This kills standing.

      *Okay, ready to write.*
answer: |-
  ### The Standing Desk Checklist: A Decision Procedure for Hypocrisy Charges

  **Purpose:** To separate the truth of a criticism from the authority of the critic, ensuring you do not kill true stories because of a messy messenger, nor publish unfair attacks disguised as accountability.
  **Time Budget:** 20 Minutes (assuming basic facts are verified).
  **Philosophical Basis:** Adapted from work on "standing to blame" (e.g., Bell, Fritz & Miller, Isserow & Klein).
  **Key Distinction Preserved:** *Truth* (Is the charge accurate?) is separate from *Standing* (Does this person have the authority to make this charge?).
  **Key Distinction Dropped:** Deep moral metaphysics of "moral address." We treat standing as *editorial credibility* and *fairness*, not moral ontology.

  ---

  #### Part 1: The Procedure

  **Step 1: Verify the Primary Charge (The Criticism)**
  *   **Question:** Is the criticism the subject is making factually accurate and substantiated?
  *   **Sufficient Answer:** Yes, we have verified the evidence for their claim (e.g., the hype exists, the COI is undisclosed).
  *   **If No:** **STOP.** Kill the critique. The messenger question is irrelevant if the message is false.
  *   **If Yes:** Proceed to Step 2.

  **Step 2: Verify the Hypocrisy Charge (The "You Too")**
  *   **Question:** Is the accusation against the critic factually accurate? Did they violate the *specific* norm they are invoking?
  *   **Sufficient Answer:** Yes, we have evidence they did the thing (or something functionally identical).
  *   **If No:** **STOP.** Do not run the hypocrisy angle. It is a smear. Proceed with the original story as planned.
  *   **If Yes:** Proceed to Step 3. (Note: You now have two true facts: The Subject is wrong, and The Critic is inconsistent.)

  **Step 3: Norm Identity & Specificity**
  *   **Question:** Is the critic violating the *same* norm they are enforcing, or a vaguely related one?
  *   **Sufficient Answer:** It is the same specific norm (e.g., "Do not overstate data" vs. "Do not overstate data").
  *   **If No (Vaguely Related):** **STOP.** The hypocrisy charge is weak. Run the original critique.
  *   **If Yes (Same Norm):** Proceed to Step 4.

  **Step 4: The Reform & Disclosure Test**
  *   **Question:** Has the critic acknowledged their past violation, disclosed it, and changed their behavior?
  *   **Sufficient Answer:** Yes, they have publicly owned the error and aligned their current practice with the norm.
  *   **If Yes:** **STANDING RESTORED.** The critic retains the authority to speak. (Philosophical rationale: Acknowledgment reaffirms commitment to the norm).
      *   *Action:* Run the critique. You may optionally note their past as context for their expertise, but do not treat it as disqualifying.
  *   **If No:** Proceed to Step 5.

  **Step 5: The Selectivity Test (Partisan Enforcement)**
  *   **Question:** Does the critic enforce this norm only against opponents while excusing allies (or themselves) silently?
  *   **Sufficient Answer:** Yes, there is a pattern of weaponizing the norm selectively.
  *   **If Yes:** **STANDING COMPROMISED.** The critic is using the norm as a weapon, not a principle.
      *   *Action:* Do not run the story *through* this critic. If the underlying issue is important (Step 6), report it independently without featuring this critic as the moral authority.
  *   **If No (Inconsistent but not weaponized):** Proceed to Step 6.

  **Step 6: Independent News Value (The "Messenger vs. Message" Hand-off)**
  *   **Question:** Does the underlying issue (the subject's wrongdoing) have news value independent of this specific critic's involvement?
  *   **Sufficient Answer:** Yes, the public needs to know this regardless of who pointed it out.
  *   **If No:** **STOP.** This is a personal feud. Kill or downgrade significantly.
  *   **If Yes:** **HAND-OFF TO EDITOR.**
      *   *Decision:* The facts support the story, but the critic's standing is muddied.
      *   *Editorial Judgment:* Do we (A) Run the story and contextualize the critic's inconsistency transparently? or (B) Strip the critic from the narrative and report the facts as staff findings?
      *   *Note on Bad Faith:* If the hypocrisy tip came from a source trying to distract (whataboutism), note this in the file, but do not let it dictate the outcome. If Step 1 and Step 6 are Yes, the story stands, but the critic's role may need downgrading.

  ---

  #### Part 2: Test Cases

  Here is the procedure applied to your three scenarios.

  **Case 1: The Overstating Science Communicator**
  *   **Scenario:** Prominent communicator campaigns against hype. Tipster says they overstated their own field in a promo interview.
  *   **Step 1 (Primary Charge):** Verified. The hype they are criticizing is real. **(Yes)**
  *   **Step 2 (Hypocrisy Charge):** Verified. The promo interview contains overstated claims. **(Yes)**
  *   **Step 3 (Norm Identity):** Both involve "overstating scientific certainty." **(Same Norm)**
  *   **Step 4 (Reform):** No acknowledgment or disclosure found. **(No)**
  *   **Step 5 (Selectivity):** No evidence they only attack enemies; they campaign broadly. **(No)**
  *   **Step 6 (News Value):** The hype in the field is a significant public interest issue. **(Yes)**
  *   **Result:** **HAND-OFF.**
      *   *Recommendation:* The underlying story runs (Step 1 & 6). The critic's standing is compromised but not weaponized (Step 5). The Editor must decide: Do we let them write it with a footnote about their own promo interview (transparency), or does the standards desk rewrite it to remove them as the moral voice?
      *   *Philosophical Note:* Hypocrisy diminishes authority but doesn't negate the truth of the claim.

  **Case 2: The Public-Health Figure**
  *   **Scenario:** Figure urges strict caution (e.g., masking). Photographed ignoring guidance at a private gathering.
  *   **Step 1 (Primary Charge):** Verified. The guidance is sound/necessary. **(Yes)**
  *   **Step 2 (Hypocrisy Charge):** Verified. Photo exists. **(Yes)**
  *   **Step 3 (Norm Identity):** Public guidance vs. Private behavior. **(Nuanced Yes)**. *Procedure Note:* Treat as "Same Norm" for safety's sake, but flag context.
  *   **Step 4 (Reform):** N/A (It just happened). **(No)**
  *   **Step 5 (Selectivity):** No evidence they only enforce this against political opponents. **(No)**
  *   **Step 6 (News Value):** High. Public trust in health guidance is critical. **(Yes)**
  *   **Result:** **HAND-OFF.**
      *   *Recommendation:* The guidance (Primary Charge) remains valid (Step 1). The hypocrisy is human failure, not necessarily weaponization. Run the story on the guidance. Address the photo separately as a "trust issue" sidebar, but do not let the photo invalidate the science.
      *   *Philosophical Note:* Private failure does not always remove standing to enforce public norms, provided it isn't selective enforcement.

  **Case 3: The Reformed Researcher**
  *   **Scenario:** Researcher campaigns against undisclosed COI. Years ago, they failed to disclose a COI. They have since disclosed it, apologized, and changed practice. Colleague wants to take them down.
  *   **Step 1 (Primary Charge):** Verified. The target's COI is real and undisclosed. **(Yes)**
  *   **Step 2 (Hypocrisy Charge):** Verified. The critic did it in the past. **(Yes)**
  *   **Step 3 (Norm Identity):** Same norm (Disclosure). **(Yes)**
  *   **Step 4 (Reform):** **YES.** They disclosed the past error and changed practice.
  *   **Result:** **STANDING RESTORED.**
      *   *Recommendation:* Run the critique with the researcher as the lead voice. The colleague's pitch to attack the researcher on this basis should be declined.
      *   *Philosophical Note:* This is the critical philosophical insight. Standing is about *current* commitment to the norm. Acknowledging past failure demonstrates *stronger* commitment than pretending it never happened. The procedure correctly identifies that the colleague is wrong to think this disqualifies the critic.

  **Case 4 (Passing): The Industry-Funded Outfit**
  *   **Scenario:** Industry group criticizes a researcher's funding conflicts.
  *   **Step 1:** Verified. Researcher has COI. **(Yes)**
  *   **Step 2:** Verified. Industry group has massive COI. **(Yes)**
  *   **Step 5 (Selectivity):** **YES.** They only target researchers whose findings hurt the industry, ignoring industry COI.
  *   **Result:** **STANDING COMPROMISED.**
      *   *Recommendation:* Do not run the story *featuring* the industry group's complaint. However, if Step 1 is Yes, verify the researcher's COI independently. If true, publish it as a staff finding, not as a response to the industry group. The messenger is toxic, but the message is checkable.

  ---

  #### Part 3: Limitations and Confidence

  **What the Procedure Cannot Do**
  1.  **Settle Editorial Values:** Step 6 is a hard hand-off. No procedure can tell you if a story is "important enough" to warrant the complexity of a compromised messenger. That is an editorial judgment call based on your publication's mission.
  2.  **Measure "Bad Faith" Perfectly:** Distinguishing between a tipster who genuinely cares about standards and one engaging in "whataboutism" to distract is often impossible in 20 minutes. The procedure instructs you to ignore the *tipster's* motive if the facts hold, but this risks publishing stories that feel like they are playing into a partisan game.
  3.  **Quantify "Selectivity":** Step 5 is the weakest empirical link. Proving a pattern of selective enforcement requires more than 20 minutes of research. You will often have to rely on "available evidence" rather than proof.

  **Confidence in Fidelity**
  I am **85% confident** in this procedure's fidelity to the underlying philosophy (specifically the work of Macalester Bell on reform and Fritz & Miller on selectivity). It successfully translates the normative concept of "standing" into the journalistic concept of "credibility/authority."

  **The Weakest Link: Step 4 (The Reform Test)**
  I am least sure that the simplification in **Step 4** preserves the philosophical point.
  *   *Philosophy:* Philosophers argue that acknowledgment restores standing *only if* it signals a genuine recommitment to the norm.
  *   *Simplification:* The procedure treats "Disclosure + Changed Practice" as a binary switch that restores standing.
  *   *Risk:* A savvy operator can perform "strategic apology" (disclose and change just enough to game the system) without genuine moral repair. The 20-minute deadline prevents you from probing the *sincerity* of the reform. You are forced to take the behavioral change at face value. This may occasionally grant standing to a cynic, but it is the necessary cost of a deadline-driven tool.

  **Final Note for the Desk:**
  This procedure is designed to prevent the "Messenger Fallacy" (killing a true story because the messenger is flawed) while preventing the "Hypocrisy Shield" (allowing a flawed messenger to attack others without scrutiny). If Step 1 is Yes and Step 6 is Yes, the story survives. The only variable is *how* the critic is framed.
