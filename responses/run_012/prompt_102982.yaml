          *   Include specific distinctions (cause vs. agent, proximal vs. distal, timing vs. magnitude, exogenous vs. endogenous).
          *   Include consistency requirements (natural science + institutional mediation).
          *   Mark requirements as "Non-negotiable" vs. "Prejudices of a particular camp."
          *   Identify incompatible pairs (trade-offs).
          *   Evaluate a specific proposed criterion: "Non-human cause counts as a historical actor only if it alters the set of options open to the people involved."
          *   Take a definite position: Which single requirement best rules out "self-sufficient actor" accounts, and where does that leave the strongest version of non-human agency?

  2.  **Initial Brainstorming & Categorization:**

      *   *The Core Tension:* Environmental determinism vs. Human agency/constructivism.
      *   *Key Concepts:* Causality, Agency, Vulnerability, Resilience, Entanglement.
      *   *The "Actor" Question:* Can a virus be an actor? Or is it a force?
      *   *The "Option" Criterion:* This sounds like structuralism or capability approach. Is it sufficient?
      *   *Incompatibilities:* High scientific precision often clashes with narrative ambiguity required for human choice. Strict exogeneity clashes with the reality of anthropogenic climate change (even in pre-modern contexts, e.g., deforestation).

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Req 1: Differentiation of Outcome.* Same shock, different result. (e.g., Plague of Justinian vs. Black Death impacts). *Status: Non-negotiable.*
      *   *Req 2: Necessary vs. Sufficient.* The trigger vs. the tinder. (e.g., Drought causes collapse only if storage fails). *Status: Non-negotiable.*
      *   *Req 3: The Human-Nature Boundary.* Is the "natural" disaster actually human-made? (e.g., Levee failure vs. Flood). *Status: Non-negotiable (mostly).*
      *   *Req 4: Temporal Specificity.* Timing vs. Magnitude. (Why *then*? vs. Why *so bad*?). *Status: Non-negotiable.*
      *   *Req 5: Mechanism of Transmission.* How does the physical become social? (Prices, morale, labor supply). *Status: Non-negotiable.*
      *   *Req 6: Exogeneity.* Is the cause truly outside the system? *Status: Contested/Prejudice.* (Because humans shape environments).

  4.  **Analyzing Incompatibilities (The "Hard Part"):**

      *   *Trade-off 1:* Scientific Precision vs. Historical Narrative. Science deals in probabilities and systems; history often demands specific agents and decisions.
      *   *Trade-off 2:* Exogeneity vs. Entanglement. If we demand the cause be truly external (volcano), we ignore how land use exacerbated the impact. If we demand entanglement, the "non-human" cause loses its distinctiveness as an external shock.
      *   *Trade-off 3:* Structural Constraint vs. Human Agency. If the non-human cause *determines* the outcome, human agency is illusory. If human agency mediates everything, the non-human cause is just background noise.

  5.  **Evaluating the Proposed Criterion ("Alters the set of options"):**

      *   *Analysis:* This is a structuralist definition of power/causation. It's useful but potentially too broad or too narrow.
      *   *Critique:* A volcano *always* alters options (destroying land). But does that make it an *actor*? An actor implies intent or at least a relational dynamic. Merely constraining options is a condition, not necessarily agency. However, for *causal narrative*, knowing how options changed is crucial.
      *   *Verdict:* It belongs on the list as a *mechanism* requirement, but not as a definition of *agency*. It prevents magic thinking but doesn't solve the agency problem.

  6.  **Selecting the "Single Most Important Requirement":**

      *   Candidate: "Mechanism of Transmission" (How physical becomes social).
      *   Candidate: "Differentiation of Outcome" (Same cause, different effect).
      *   Candidate: "Necessary vs. Sufficient."
      *   *Decision:* **The Specification of Social Mediation (Mechanism).** If you can't explain *how* the ash cloud became a tax revolt, you haven't explained history, you've explained geology. This rules out "volcano did it" shortcuts.

  7.  **Refining the Position on Non-Human Agency:**

      *   If we demand social mediation, non-human entities aren't "actors" in the human sense (intentional). They are *actants* (Latour) or *forcing functions*. The strongest version of the case is that they reconfigure the *political ecology*, making certain social forms impossible, without dictating the specific replacement.

