answer: |-
  To construct a causal narrative that integrates non-human forces without collapsing into environmental determinism or dismissing material reality, a theory must satisfy specific epistemic and ontological conditions. Below are the desiderata for an adequate theory of non-human historical causation, followed by an analysis of incompatibilities, a ruling on your proposed criterion, and a definitive position on the strongest viable claim for non-human agency.

  ### I. Desiderata for Non-Human Historical Causation

  **1. The Differential Outcome Requirement**
  *   **Specification:** The theory must explain why the same non-human stimulus produced divergent historical outcomes in different contexts.
  *   **Motivating Case:** The 536 CE dust veil event. In the Eastern Roman Empire, it contributed to state resilience and fiscal restructuring; in parts of Scandinavia, it correlated with settlement abandonment and elite power consolidation. A theory that predicts uniform collapse from uniform forcing is falsified by this variance.
  *   **Status:** **Non-negotiable.** Without this, the theory is law-like determinism, not history.

  **2. The Mediation Mechanism Requirement**
  *   **Specification:** The theory must specify the social, economic, or political mechanisms that translate a biophysical shock into a historical event. It cannot leap from "ash fall" to "state collapse" without intermediate steps (e.g., harvest failure → price inflation → urban unrest → tax default).
  *   **Motivating Case:** The Great Famine of 1315. Rain caused crop failure, but the *magnitude* of mortality was determined by grain storage policies, market integration, and seigneurial extraction rates.
  *   **Status:** **Non-negotiable.** This prevents the "black box" error where nature inputs directly yield historical outputs.

  **3. The Exogeneity vs. Entanglement Distinction**
  *   **Specification:** The theory must clarify the degree to which the "natural" cause was independent of prior human action. It must distinguish between a truly exogenous shock (asteroid) and an endogenous feedback loop (deforestation-induced erosion).
  *   **Motivating Case:** The Maya Classic Collapse. Drought is the non-human cause, but paleoecology suggests deforestation exacerbated the drought's severity. Treating the drought as purely external obscures the human role in creating the vulnerability.
  *   **Status:** **Non-negotiable** for accuracy, though often blurred in practice.

  **4. The Temporal Specificity Requirement**
  *   **Specification:** The theory must distinguish between explaining the *timing* of an event, its *magnitude*, and its *direction*.
  *   **Motivating Case:** The Antonine Plague. It may explain the timing of the end of the Pax Romana (timing), but it cannot explain the rise of Christianity (direction) or the specific administrative reforms of Diocletian (direction) without additional social variables. It explains the magnitude of population loss, but not the political restructuring.
  *   **Status:** **Non-negotiable.** Conflating these leads to overreach.

  **5. The Necessary vs. Sufficient Distinction**
  *   **Specification:** The theory must declare whether the non-human cause is a *trigger* (necessary but not sufficient), a *permissive condition* (sufficient background but not triggering), or a *determinant* (necessary and sufficient).
  *   **Motivating Case:** The abandonment of Mesa Verde. Drought was likely necessary to force movement, but not sufficient to explain the specific migration patterns to the Rio Grande, which were guided by existing kinship networks and religious geography.
  *   **Status:** **Non-negotiable.**

  **6. The Ontological Clarity Requirement (Cause vs. Agent)**
  *   **Specification:** The theory must not collapse the distinction between a *force* (which acts without intent) and an *agent* (which acts with intent or within a normative framework).
  *   **Motivating Case:** Describing *Yersinia pestis* as "invading" or "conquering." This metaphorical language smuggles agency into a biological process. The bacterium replicates; it does not strategize.
  *   **Status:** **Prejudice of a Particular Camp.** (Specifically, strict positivism). Actor-Network Theory (ANT) proponents argue this distinction is illegitimate. However, for *causal narrative* regarding responsibility and choice, maintaining this distinction is practically necessary.

  **7. The Consistency with Institutional Resilience Requirement**
  *   **Specification:** The theory must remain consistent with known data on how institutions buffer shocks. It cannot posit collapse where institutional capacity was high, unless it explains the institutional failure.
  *   **Motivating Case:** The 1755 Lisbon Earthquake. Massive physical destruction, but the state (Pombal) used it to centralize power rather than collapse. A theory predicting state failure from seismic magnitude alone contradicts the historical record.
  *   **Status:** **Non-negotiable.**

  ---

  ### II. Incompatible Pairs (Trade-offs)

  There are pairs of requirements that cannot be jointly satisfied at their极限 (limits). You must choose a priority.

  **1. Strict Exogeneity vs. Total Entanglement**
  *   **Conflict:** You cannot demand that a non-human cause be purely external (a "shock from outside the system") while simultaneously demanding that the theory account for how human land-use shaped the impact of that cause (entanglement).
  *   **Resolution:** You must treat "nature" as either a boundary condition (external) or a metabolic process (internal). You cannot have it both ways. If you choose Entanglement, the "non-human cause" loses its status as an independent variable, making counterfactual analysis ("what if the volcano hadn't erupted?") nearly impossible. If you choose Exogeneity, you risk ignoring anthropogenic environmental change.
  *   **Verdict:** **Strict Exogeneity** must be sacrificed for **Entanglement** in the modern era, but **Exogeneity** is methodologically required for clear causal identification in deep history.

  **2. Scientific Precision vs. Narrative Agency**
  *   **Conflict:** Natural science deals in probabilities, systems, and deep time (e.g., "climate forcing increased variance by 20%"). Historical narrative deals in specific decisions, singular events, and moral responsibility (e.g., "The King failed to store grain").
  *   **Resolution:** A theory that satisfies the precision of ice-core data often renders human agents as statistical noise. A theory that satisfies the requirements of narrative agency often treats scientific data as vague backdrop.
  *   **Verdict:** This is the fundamental tension of environmental history. You cannot fully satisfy both without creating a fractured text (one chapter for science, one for history).

  ---

  ### III. Ruling on the Proposed Criterion

  **Proposed Criterion:** *"A non-human cause counts as a historical actor only if it alters the set of options open to the people involved."*

  **Ruling:** This belongs on the list as a **Non-negotiable Requirement for Causation**, but it is **Illegitimate as a Definition of Agency**.

  **Reasoning:**
  1.  **As Causation:** It is tautologically true. If a volcanic eruption does not alter the option set (e.g., it lands in an uninhabited zone, or society is so resilient it ignores it), it is not a historical cause. It is merely a geological event. To be a *historical* cause, it must constrain or enable human action.
  2.  **As Agency:** It is insufficient. A prison wall alters the set of options for a prisoner, but the wall is not an *actor*. A law alters options, but is only an actor via the legislature and police that enforce it. Defining agency merely as "constraint of options" flattens the distinction between a stone, a law, and a king. It grants "agency" to anything that exerts force, which renders the concept of agency useless for distinguishing between intentional strategy and blind force.

  **Verdict:** Adopt the criterion as a **threshold for relevance**, not as a grant of **ontological status**.

  ---

  ### IV. Definite Position

  **1. The Single Requirement That Rules Out "Self-Sufficient Actors"**

  The requirement that does the most work to prevent the reification of nature is **The Mediation Mechanism Requirement**.

  *   **Why:** Accounts that treat a volcano or germ as a self-sufficient actor typically rely on a "direct impact" model (Volcano → Darkness → Famine → Collapse). This skips the social machinery. By demanding a specification of *how* the physical shock became a social crisis (e.g., Volcano → Darkness → *Elite hoarding of remaining grain* → *Loss of legitimacy* → *Peasant revolt* → Collapse), you force the historian to reintroduce human choices, institutions, and power structures into the chain.
  *   **Effect:** It makes it impossible to say "The volcano destroyed the state." You can only say "The volcano created conditions under which specific political failures led to the state's destruction." It strips the non-human entity of its narrative sovereignty.

  **2. Where This Leaves the Strongest Version of Non-Human Agency**

  If we enforce the Mediation Mechanism Requirement, we must abandon the idea of non-human *agency* (in the sense of intention or sovereignty) and adopt the concept of **Non-Human Veto Power** (or *Structural Forcing*).

  *   **The Strongest Case:** Non-human forces do not write history, but they **edit** it. They do not determine the specific text (the political outcome), but they redact entire paragraphs (making certain social forms impossible).
  *   **Example:** A sustained aridification trend does not dictate that a society becomes warlike or peaceful. However, it *vetoes* the option of maintaining high-density urbanization without irrigation. It removes a set of futures from the table.
  *   **Conclusion:** The strongest defensible position is that non-human causes are **boundary conditions that evolve**. They are not actors in the drama, but they build and dismantle the stage. When the stage collapses, the actors fall, but the script they were trying to perform was written by humans.

  **Summary:** To write adequate causal narrative, you must treat non-human causes as **constraints on possibility** rather than **generators of outcome**. Any theory that claims a pathogen *caused* a fall of state without detailing the institutional fragility that allowed the pathogen to become fatal is not history; it is mythology.
