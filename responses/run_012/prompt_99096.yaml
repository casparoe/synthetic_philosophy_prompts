prompt: |-
  I am a third-year philosophy student currently taking a course on philosophy of mind and cognitive science, and I serve as the student representative on my university's Access and Accommodations Review Board. The Board must decide, at its meeting this Friday, a case that has divided us, and I have been asked to circulate a short written opinion before the vote.

  The case concerns a student with a documented episodic-memory impairment who requests permission to use, during closed-book in-person exams, a wearable device running a custom retrieval system. The device is not connected to the internet and contains only the student's own lecture notes, annotations, and previously solved problem sets, indexed by the student's own associations. It responds to subvocal queries by surfacing relevant entries and, when asked, paraphrasing them in its own words. The student reports that in trial runs she sometimes cannot tell whether an answer came from the device or from her own memory, and that the device once surfaced a note she had forgotten writing. She says it adds no new information, returning only what she has already studied, but at a speed and reliability her unaided memory cannot match. Our written policy has two relevant categories: accommodation, available to any student with a documented disability and not recorded on the transcript; and unauthorized aid, which is referable for academic misconduct. The policy permits assistive technology that compensates for a disability and forbids aids that give an unfair advantage.

  The Board's chair has proposed adopting what she calls the Functional Integration Standard: an external resource counts as part of a student's cognition, and so as an accommodation rather than an aid, when it is reliably coupled, automatically endorsed rather than consciously consulted, and recruited by the student's own reasoning. A rival group favors the Internal Benchmark Standard: accommodations may restore performance only up to a baseline measured without external storage, because anything beyond that is enhancement and cannot be separated from cheating. A third member has raised what he calls the offloading asymmetry: the device helps only because the student already did the cognitive work, but the exam is supposed to measure retrieval under unaided conditions, so the help is real even if no new content is added.

  Please draft the memo I will circulate. It should recommend a concrete decision—grant, deny, or grant with conditions—and specify a time frame and any conditions the Board can actually administer before the student's exams begin the following Monday. It should apply the Board's existing categories rather than inventing a new policy wholesale, though it may propose a narrow clarification if the existing categories cannot handle the case. It should engage the strongest argument for the side you reject, especially the worry that the Functional Integration Standard would license almost any convenient external memory and make closed-book exams meaningless. It should say what the Board would be committing itself to about the boundary between a student's mind and a student's tools, and what later case would best test whether that commitment is coherent. The case has affinities with the extended mind thesis, but I do not want a literature review; the memo should be self-contained and usable by members who have not read the philosophical background.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**

      *   **Role:** Third-year philosophy student, Student Rep on Access and Accommodations Review Board.
      *   **Task:** Draft a short written opinion/memo to circulate before the Board vote this Friday.
      *   **Case:** Student with episodic-memory impairment wants to use a wearable, offline device (custom retrieval system) during closed-book exams. It holds *only* her own notes/annotations, indexed by her associations, responds to subvocal queries, and paraphrases. She sometimes confuses device output with her own memory.
      *   **Policy Categories:**
          1.  *Accommodation:* For documented disability, not recorded on transcript, compensates for disability.
          2.  *Unauthorized Aid:* Academic misconduct, gives unfair advantage.
      *   **Competing Standards:**
          1.  *Functional Integration Standard (Chair):* External resource = cognition if reliably coupled, automatically endorsed, recruited by reasoning. (Pro-Device)
          2.  *Internal Benchmark Standard (Rival Group):* Restore performance only to baseline without external storage. Beyond that = enhancement/cheating. (Anti-Device)
          3.  *Offloading Asymmetry (Third Member):* Help is real even if no new content, because exam measures unaided retrieval. (Anti-Device)
      *   **Requirements:**
          *   Recommend a concrete decision (Grant, Deny, or Grant with Conditions).
          *   Specify time frame and administrable conditions before Monday exams.
          *   Apply existing categories (Accommodation vs. Aid), maybe narrow clarification.
          *   Engage the strongest argument for the rejected side (specifically the "slippery slope" that Functional Integration makes closed-book exams meaningless).
          *   Define the Board's commitment regarding the mind/tool boundary.
          *   Identify a future test case for coherence.
          *   Tone: Professional, persuasive, philosophical but accessible (no literature review).
          *   Context: Memo for Board members.

  2.  **Determine the Stance:**

      *   *Option A (Deny):* Aligns with Internal Benchmark. Safe, traditional. But fails the disability student who genuinely cannot retrieve what she learned. Punishes the impairment rather than accommodating it.
      *   *Option B (Grant):* Aligns with Functional Integration. Philosophically robust (Extended Mind). Risks the "slippery slope" objection.
      *   *Option C (Grant with Conditions):* Best middle ground. Acknowledges the accommodation need but mitigates the "unfair advantage" risk through strict vetting of the device's content and functionality.
      *   *Decision:* I will recommend **Grant with Conditions**. This allows me to engage with the Functional Integration Standard (which seems most philosophically defensible given the student's specific impairment) while addressing the Internal Benchmark concerns via strict limitations on *what* is in the device.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the recommendation clearly.
      *   **Analysis of Policy Categories:** Map the device to "Accommodation" rather than "Unauthorized Aid." Why? Because it compensates for the *impairment* (retrieval), not the *learning* (encoding).
      *   **Engaging the Standards:**
          *   Support Functional Integration (Chair): It fits the phenomenology (she confuses it with memory).
          *   Address Internal Benchmark/Offloading (Opposition): The worry is that this makes *everyone* use devices.
          *   Rebuttal: The restriction to *her own notes* and *offline* status prevents it from being a general advantage. It restores the link between encoding and retrieval that her disability severs.
      *   **The Boundary Commitment:** We are committing to the idea that tools can be part of the cognitive loop *if* they are transparent and personalized. The boundary isn't skin/skull, it's reliability and integration.
      *   **Conditions/Administration:** What can we do before Monday?
          *   Audit the device content (ensure no external info).
          *   Disable internet/connectivity permanently for exam mode.
          *   Limit query types (no "solve this," only "retrieve that").
      *   **Future Test Case:** What breaks this standard? A device that *generates* answers based on notes (too much processing) vs. just retrieving them. Or a shared database. Let's go with a "shared note bank" scenario.
      *   **Conclusion:** Call to vote.

  4.  **Refining the Argument (Self-Correction/Polishing):**

      *   *Critique:* Is "Functional Integration" too philosophical for a policy memo?
      *   *Fix:* Frame it as the operational definition of "Assistive Technology" within the existing policy. Don't call it "Extended Mind Thesis," just describe the functional coupling.
      *   *Critique:* The prompt asks to engage the strongest argument for the rejected side.
      *   *Fix:* Explicitly address the "Internal Benchmark" worry: If we allow this, does closed-book mean anything? Answer: Closed-book means "no *new* information," not "no *retrieval* aids." For this student, the device *is* the retrieval mechanism.
      *   *Critique:* Conditions must be administrable by Monday.
      *   *Fix:* Keep it technical and verifiable. IT check + Content freeze.
      *   *Critique:* Future test case.
      *   *Fix:* A student with ADHD requesting a device that *prioritizes* notes algorithmically. That tests the "recruited by student's reasoning" clause.

  5.  **Drafting the Content (incorporating the constraints):**

      *   *Tone:* Respectful, decisive, academic but practical.
      *   *Length:* "Short written opinion" -> ~800-1000 words.
      *   *Key Phrase:* "Functional Integration" needs to be weighed against "Unfair Advantage."
      *   *Specific constraint:* "Say what the Board would be committing itself to about the boundary between a student's mind and a student's tools." -> Need a clear sentence on this.
      *   *Specific constraint:* "What later case would best test whether that commitment is coherent." -> Need a specific hypothetical.

  6.  **Final Review against Prompt:**

      *   Recommend decision? Yes (Grant with Conditions).
      *   Time frame/conditions? Yes (Weekend audit, Monday exam).
      *   Apply existing categories? Yes (Accommodation vs. Aid).
      *   Engage strongest rejected argument? Yes (Internal Benchmark/Slippery Slope).
      *   Boundary commitment? Yes (Transparency/Coupling).
      *   Future test case? Yes (Algorithmic prioritization).
      *   No literature review? Yes (Keep it practical).

  7.  **Final Polish:** Check the voice. As a student rep, I should sound engaged but respectful of the Board's authority. I am offering an *opinion* to guide the vote, not dictating it. (Self-correction: Ensure I don't sound *too* junior. I am a Phil student, so philosophical rigor is expected, but it's a policy memo).

  *(Self-Correction during drafting)*: I need to make sure I don't just endorse the Chair's "Functional Integration Standard" uncritically. I need to modify it slightly to fit the *policy* constraints. I will argue that Functional Integration is the *test* for whether something is an Accommodation, provided strict content limits are met.

