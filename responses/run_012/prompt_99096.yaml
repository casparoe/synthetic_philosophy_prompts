answer: |-
  **MEMORANDUM**

  **TO:** Access and Accommodations Review Board
  **FROM:** [Your Name], Student Representative
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Request for Wearable Retrieval System

  **Recommendation**
  I recommend the Board **grant this request as an Accommodation**, subject to strict technical and content conditions to be verified by University IT before Monday's exams. This decision classifies the device under our existing "Accommodation" category rather than "Unauthorized Aid." It acknowledges that for a student with episodic-memory impairment, the barrier is not knowledge acquisition but knowledge retrieval. The device functions as a prosthetic for the retrieval mechanism, not a repository of new content.

  **Application of Policy Categories**
  Our policy distinguishes between aids that compensate for a disability and those that provide an unfair advantage. The "Internal Benchmark Standard" proposed by some members suggests we must measure the student against a baseline of unaided biological memory. I reject this standard for this case. If the disability is defined by unreliable retrieval, measuring the student against unreliable retrieval merely punishes the disability rather than accommodating it.

  Instead, I support a modified version of the Chair's "Functional Integration Standard." An external resource counts as an accommodation when it is reliably coupled to the student, automatically endorsed, and recruited by the student's reasoning. The student's report that she sometimes cannot distinguish the device's output from her own memory suggests this coupling is already phenomenologically present. The device does not add information; it restores the link between her encoding (studying) and her exam performance. Therefore, it fits the definition of an Accommodation: it levels the playing field by bypassing the specific cognitive impairment without altering the academic standard of *what* must be known.

  **Addressing the Strongest Counter-Argument**
  The strongest objection, rooted in the Internal Benchmark and Offloading Asymmetry arguments, is that accepting Functional Integration renders "closed-book" exams meaningless. If we allow a device to store and retrieve notes, what prevents any student from offloading memory to a phone? If the boundary of the mind is flexible, does the exam measure learning or device management?

  This worry is valid but manageable. We avoid the slippery slope by distinguishing between *storage* and *processing*. The permission granted here is narrow: the device may only store content generated by the student (notes, annotations) and may only retrieve it based on student-generated indices. It cannot solve problems, access the internet, or prioritize information algorithmically. This ensures the "cognitive work" of understanding and organizing remains internal. The exam still tests whether the student understood the material enough to create the notes and knows which queries to submit. We are not licensing external memory for all; we are licensing a specific retrieval prosthesis for a specific impairment.

  **Commitment on the Mind/Tool Boundary**
  By granting this, the Board commits to the position that the boundary between a student's mind and their tools is not defined by the skin or skull, but by **transparency and ownership**. A tool becomes permissible when it operates transparently enough that the student treats its output as their own recall, and when the content within it is exclusively the product of the student's prior labor. We are affirming that cognitive sovereignty matters more than biological locality.

  **Administrable Conditions and Time Frame**
  To ensure this does not become an Unauthorized Aid, the following conditions must be met before Monday morning:

  1.  **Content Freeze:** By Sunday at 5:00 PM, the student must submit a read-only image of the device's database to Disability Services. It must contain only her handwritten notes digitized, annotations, and solved problem sets. No textbooks, lecture slides, or summaries generated by AI are permitted.
  2.  **Connectivity Lock:** University IT must physically or software-verify that all wireless radios (Wi-Fi, Bluetooth, Cellular) are disabled and cannot be re-enabled by the student during the exam.
  3.  **Query Limit:** The device must be set to "Retrieval Mode" only. It may surface text and paraphrase existing entries, but it cannot synthesize new answers from multiple notes (e.g., it cannot combine Note A and Note B to answer a question neither explicitly addresses).

  **Future Coherence Test**
  This precedent will be tested by a future case involving a student with executive function deficits (e.g., severe ADHD) requesting a device that *algorithmically prioritizes* which notes to show during an exam based on the question keywords. That case would test the limit of "recruited by the student's reasoning." If the device decides what is relevant rather than the student, the functional integration is broken, and it becomes an Unauthorized Aid. That will be the line we must hold.

  **Conclusion**
  Denying this request upholds a biological definition of memory that excludes this student from demonstrating her actual competence. Granting it with the proposed safeguards upholds the integrity of the exam while fulfilling our mandate to accommodate documented disabilities. I urge the Board to vote to Grant with Conditions.
