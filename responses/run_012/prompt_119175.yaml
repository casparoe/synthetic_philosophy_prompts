          *   *1952 Homosexuality:* What was the "dysfunction"? Reproductive failure? If so, reference class = reproductive age humans. But many things reduce reproduction (celibacy, contraception) without being diseases.
          *   *1973 Removal:* Naturalist view: We got the biology wrong. It's not a dysfunction.
