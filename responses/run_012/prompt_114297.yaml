  # My thesis in four sentences

  I argue statutory interpretation requires separating semantic fixing from remedial adjustment. The fixing stage locks meaning to enactment-era linguistic conventions, excluding purpose. The remedial stage permits departure from fixed meaning only if the interpreter accepts a symmetry condition: applying the same departure rule to statutes they oppose. Consequently, textualism-purposivism debates are not about meaning but about who bears the burden of intolerable outcomes. This framework exposes familiar doctrinal moves as disguised burden-shifting rather than rival semantic theories.

  # The objections, ranked by damage

  **1. The Pragmatics Trap**
  **As they'll put it:** "You assume conventions settle meaning without pragmatic enrichment. But 'bank' requires context to fix. Your fixing stage is a myth; meaning is never purpose-free."
  **My reply:** I concede pragmatics resolves ambiguity, but only within conventional bounds. My fixing stage excludes *purpose-driven* pragmatics, not context-driven disambiguation. We can distinguish semantic content from speaker meaning without collapsing into holism. The fixing stage captures conventional content; remedial handles the normative clash.
  **Where it's soft:** I'm bluffing on the line between conventional implicature and purpose. If pragmatics is ubiquitous, the fixing stage absorbs purpose anyway, collapsing my two stages back into one.

  **2. The Realist Collapse**
  **As they'll put it:** "This is just discretion with extra paperwork. Judges will call intolerable results 'fixed meaning' errors to bypass your symmetry condition."
  **My reply:** It's not paperwork; it's a disclosure rule. Like recusal, symmetry forces judges to externalize their normative commitments. Even if they cheat, the framework exposes the move as remedial, not semantic, shifting the burden of honesty.
  **Where it's soft:** I have no mechanism to enforce honesty. If judges lie about symmetry, the theory becomes descriptive noise rather than a normative constraint on judicial behavior.

  **3. The Error Cost Calculation**
  **As they'll put it:** "Your symmetry condition increases decision costs. Why bear the error cost of intolerable outcomes rather than letting judges optimize welfare case-by-case?"
  **My reply:** Because rule-based symmetry reduces long-term uncertainty costs. Case-by-case optimization creates unpredictability for regulated parties. My framework prioritizes reliance interests over marginal welfare gains in specific cases, stabilizing expectations.
  **Where it's soft:** I haven't quantified the error costs. If intolerable outcomes are frequent, my rule imposes massive welfare losses that outweigh the benefit of predictability.

  **4. The Corpus Linguistics Challenge**
  **As they'll put it:** "Your 'conventions' are empirically discoverable via corpus. Why posit a philosophical stage when frequency data settles plain meaning without your remedial bail-out?"
  **My reply:** Corpus data shows usage, not legal effect. Frequency doesn't tell us when usage yields an intolerable result requiring remediation. My framework accepts your data for fixing but adds a normative valve you lack.
  **Where it's soft:** If corpus data shows purpose is embedded in usage, my fixing stage isn't purpose-free. I'm assuming usage separates cleanly from intent, which corpus might contradict.

  **5. The Rule of Law Objection**
  **As they'll put it:** "Allowing departure from fixed meaning undermines the rule of law. You're licensing judges to rewrite statutes whenever their conscience prickles."
  **My reply:** No, I'm licensing departure only under strict symmetry. It's not conscience; it's consistency. If you won't apply the departure rule to a statute you loathe, you can't apply it here. That constrains conscience.
  **Where it's soft:** "Intolerable" is still subjective. A judge might genuinely believe symmetry holds while stretching the definition of intolerable to suit their policy preferences.

  **6. The Historical Access Problem**
  **As they'll put it:** "You talk about enactment-era conventions like they're accessible. Late-19th-century regulatory language was fluid. Your 'fixed' meaning is just presentist intuition."
  **My reply:** Accessibility is epistemic, not ontological. Meaning was fixed then, even if hard to recover now. My theory demands we try to recover conventions, not substitute modern intuitions. Difficulty doesn't negate the fact of fixing.
  **Where it's soft:** If recovery is too hard, judges will default to modern intuitions anyway. My theory relies on a historical fidelity judges aren't trained or equipped to perform reliably.

  **7. The Empty Symmetry Condition**
  **As they'll put it:** "Symmetry is formalistic. I can state any rule generally. 'I depart when outcomes are bad' is general. Your constraint does no work."
  **My reply:** The rule must specify *why* it's bad, not just that it is. 'Bad outcomes' is too vague. The rule must identify the normative principle triggering departure, which must hold across ideological lines.
  **Where it's soft:** Determining sufficient specificity is itself interpretive. I haven't provided a meta-rule for how general the departure rule must be to satisfy symmetry.

  **8. The Burden-Shifting Circularity**
  **As they'll put it:** "You say textualism is burden-shifting. But your remedial stage just shifts the burden to the symmetry condition. You haven't solved the disagreement, just relocated it."
  **My reply:** I haven't solved the disagreement; I've clarified it. Knowing we're arguing about burden allocation, not meaning, allows productive negotiation. Relocating the fight to symmetry makes the stakes transparent.
  **Where it's soft:** Transparency doesn't resolve the conflict. If parties disagree on burden allocation, my framework offers no tie-breaker, leaving the core political dispute untouched.

  **9. The Compliance Problem**
  **As they'll put it:** "Why would judges adopt this? It restricts their power without offering institutional benefit. Realists know judges maximize influence, not philosophical consistency."
  **My reply:** Because it legitimizes necessary departures. Currently, judges hide remediation behind semantic tricks. This gives them a safe harbor for honest correction, preserving institutional integrity over time.
  **Where it's soft:** I'm assuming judges value integrity over power. If they prefer hiding discretion, they will ignore my framework, rendering it theoretically neat but practically inert.

  **10. The Intolerability Threshold**
  **As they'll put it:** "Who defines 'intolerable'? You've built a subjective escape hatch into your objective fixing stage. One judge's intolerable is another's feature."
  **My reply:** It's defined by the community of interpreters over time, not individually. Symmetry forces intersubjective validation. If peers won't accept the departure rule for their statutes, it fails the test.
  **Where it's soft:** This relies on a cohesive interpretive community that doesn't exist. In a polarized court, symmetry becomes another partisan weapon rather than a neutral constraint.

  # What I concede up front

  I concede that the fixing stage is not always empirically accessible; historical uncertainty is real, and corpus data has limits. I also concede that the symmetry condition relies on judicial good faith; I have no mechanical enforcement mechanism. Finally, I agree that "intolerable" is not self-defining; it requires normative judgment. My claim is not that this framework eliminates discretion, but that it forces discretion into the open. I am not solving the problem of judicial honesty, only restructuring the incentives around it. If you think judges will lie regardless, my theory fails, but so does every other normative theory of adjudication.

  # The one reply that has to land

  The core claim is not that fixing is perfectly objective, but that separating it from remediation changes the burden of justification. When a judge departs from fixed meaning, they must admit they are overriding semantics for norms. This transparency alters the cost of decision-making. If I force you to state your departure rule generally, you cannot hide behind textual ambiguity. This doesn't stop bad judges, but it raises the price of dishonesty. The theory succeeds if it makes covert purposivism more expensive than overt remediation.

  # The question I'm hoping nobody asks

  What happens when the symmetry condition itself produces an intolerable result? If applying my departure rule to a loathed statute yields catastrophe, do I abandon symmetry or accept the catastrophe? This exposes a regress: my remedial stage needs its own remedial stage. It's dangerous because it shows the theory isn't foundational; it just pushes the hard normative choice back one step without solving it, collapsing the hierarchy I built.
