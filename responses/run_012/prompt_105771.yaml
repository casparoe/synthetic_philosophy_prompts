prompt: |-
  I'm a philosophy grad student TAing a seminar on Scanlon, and last week my roommate, who's a utilitarian, and I got into a stupidly long argument about the aggregation problem. I want to turn it into a dialogue I can use in section, because the standard trolley cases are so familiar that everyone just recites their team's line. So here's the case I want the dialogue to be about: a hospital has exactly one dose of a drug. It can either save one patient from certain death, or cure 100 patients of a condition that isn't fatal but is permanently and seriously painful (think a migraine that never goes away). Everyone involved is a stranger to the hospital and to each other; no special relationships, no age differences, no future-cure complications. The utilitarian says save the 100, obviously. The contractualist says it's not obvious, because each of the 100 has a complaint, but so does the one, and you can't just add up complaints across people. For context, you can gloss contractualism as the view that an act is wrong if it's disallowed by principles no one could reasonably reject, and utilitarianism as the view that you should maximize total well-being.

  I want a dialogue between a smart contractualist and a smart utilitarian that actually works through whether the contractualist can justify saving the 100 (or the one) without cheating. And I want them to test a distinction I've been messing around with: between aggregating people's complaints and aggregating the outcomes those people would experience. Maybe the contractualist can't do the first but can do the second, or maybe that's just the same thing in a different costume. Have them try it on the case and see where it breaks. Neither side should be a strawman; the utilitarian should have a real answer to the idea that people are separate, and the contractualist should have a real answer to the numbers. They should respond to each other's actual sentences, not trade monologues. You're a philosopher who specializes in ethics and has taught Scanlon, so think carefully and don't just give me the textbook moves. Start by brainstorming the strongest version of each position, then write the dialogue. No citations or reading lists, I'll add those myself. Keep it around 900-1400 words. Also I dont care about typos, so dont waste time on them.
