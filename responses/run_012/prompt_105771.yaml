      *   **Context:** Utilitarian says save 100. Contractualist says it's not obvious (individual complaints matter). Need to test if contractualism can justify saving the 100 without just summing complaints.

  2.  **Brainstorming Positions:**
      *   **Utilitarian (U):** Maximize total well-being. Death is worse than pain. 100 pains > 1 death (usually). The "separateness of persons" objection is weak because morality is about impartial promotion of the good. If we don't aggregate, we ignore the moral significance of the 99 extra people.
      *   **Contractualist (C):** Scanlonian framework. Wrongness = disallowed by principles no one could reasonably reject. Focus on individual standpoints. You can't just sum complaints across persons to outweigh one person's complaint of death. *However*, Scanlon allows some form of aggregation (e.g., in *What We Owe to Each Other*, he discusses the "greater burden" principle). The challenge is how to compare the *strength* of complaints without simple summation.
      *   **The Distinction:** Aggregating *complaints* (adding up moral weight of objections) vs. Aggregating *outcomes* (adding up utility). C might argue we compare the *strongest* individual complaint on each side. But if 100 people suffer, does their collective situation create a stronger individual complaint? Or do we compare the outcome of "everyone suffers" vs "one dies"?
      *   **Scanlon's Actual View (for accuracy):** Scanlon generally argues against simple aggregation but allows that when burdens are comparable, numbers can matter. But here the burdens are *not* comparable (Death vs. Pain). So the hard case is: Can the 100 pains outweigh 1 death? Scanlon suggests we look at the strength of the *individual* complaint. If the pain is severe enough, maybe the individual complaint of pain is nearly as strong as death? Or, we compare the principle "Save the life" vs "Prevent aggregate pain."
      *   **The Twist:** The prompt asks to test the distinction between aggregating complaints vs. outcomes.
