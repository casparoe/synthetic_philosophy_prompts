answer: |-
  **Alex (Utilitarian):** Let's stick to the case. One dose. Patient A dies without it. Patients B1 through B100 suffer permanent, severe migraines without it. No special relationships. I save the 100. The total suffering prevented outweighs the one life lost. It's tragic, but it's the math.

  **Jordan (Contractualist):** It's not math, that's the point. It's justification. You're treating the 100 as a container of pain units that outweighs the container of 'one life.' But morality happens between people. Each of the 100 has a complaint against being left in pain. Patient A has a complaint against dying. You can't just add up the 100 complaints to silence A's.

  **Alex:** Why not? If I ignore the 99 extra people, I'm saying their suffering counts for nothing. Is morality blind to numbers? If there were a million migraine sufferers, would you still save the one life?

  **Jordan:** Maybe. Or maybe the principle changes. But my worry is about *how* the numbers matter. You're aggregating outcomes: "Total pain is less if we save the 100." I'm looking at complaints: "Can any individual reasonably reject the principle used here?" If we save the 100, A dies. A can reasonably reject a principle that sacrifices them for others. If we save A, all 100 suffer. Each can reject a principle that ignores their pain.

  **Alex:** So it's a stalemate. One rejection versus 100 rejections. If you don't aggregate the rejections, you have no way to decide. You're stuck.

  **Jordan:** Not necessarily. Here's the distinction I'm wrestling with: Aggregating *complaints* versus aggregating *outcomes*. You aggregate outcomes to get total utility. I thought contractualism forbids aggregating complaints—taking A's veto power and adding it to B's to make a super-veto. But maybe I can acknowledge the outcome of "100 suffering" is worse than "1 dying" without summing the moral weight of their complaints.

  **Alex:** How? If the outcome is worse, it's because the sum of pains is greater. You're smuggling utilitarianism in through the back door of "outcomes."

  **Jordan:** No, listen. When I ask if a principle is reasonably rejectable, I look at the burden on the individual. For A, the burden is death. For B1, it's pain. Death is worse than pain. So individually, A's complaint is stronger than B1's. If it were just A vs. B1, I save A. But there aren't just 100 complaints floating around to be added. There is a principle: "Always save the life regardless of aggregate non-fatal suffering."

  **Alex:** And?

  **Jordan:** And B1 can say, "This principle imposes a heavy burden on me." But B1 can also say, "This principle imposes that same burden on 99 others." The *fact* that the principle imposes burdens on many people makes it harder to justify, not because the burdens sum up into a bigger moral block, but because a principle that ignores the interests of many is less defensible than one that ignores the interests of one.

  **Alex:** That sounds like you're counting people. "Ignoring many is worse than ignoring one." That's counting. That's aggregation. You're just aggregating the *status* of the people rather than their utility.

  **Jordan:** Is it? Think about it this way. Aggregating complaints means I treat the 100 as a single entity with a giant complaint. I'm not doing that. I'm saying that when we compare the strength of reasons for rejection, the *scope* of the rejection matters. A's reason is "I die." B1's reason is "I suffer." But the principle favoring A affects 100 people. The justification owed to each person requires us to consider that rejecting the principle helps *many* individuals, not just one aggregate mass.

  **Alex:** But why does helping many matter if you can't sum their claims? If I owe each person a duty not to be used, saving the 100 uses A. Saving A uses the 100. If you can't sum the 100's claims against being used, how do you overcome A's claim? You're saying "It's okay to violate A because we violate 100 others less severely." But if the violation of A is strictly worse *for A*, why do the 99 others tip the scale?

  **Jordan:** Because the principle isn't "Violate A." It's "Minimize severe burden." If the burden of migraines is sufficiently severe, it approaches the gravity of death. Maybe not for one person. But when a principle condemns 100 people to that border-line gravity, the *collective impact* makes the principle unreasonable, even if no single complaint outweighs A's.

  **Alex:** "Collective impact." Jordan, that's just utilitarianism with extra steps. You're saying the outcome of 100 people suffering is a weightier reason than the outcome of one dying. That's outcome aggregation. You've conceded the utilitarian point that outcomes matter aggregatively, you're just dressing it up as "reasonable rejection."

  **Jordan:** I'm not conceding that outcomes are the *source* of value. The source is the individual standpoint. But individual standpoints aren't isolated in a vacuum. When I evaluate a principle, I have to consider it from everyone's standpoint simultaneously. If I adopt a principle that saves A, I am adopting a principle that 100 people have strong reasons to reject. If I adopt a principle that saves the 100, only one person has strong reasons to reject.

  **Alex:** So you *are* counting rejections. One rejection vs. 100 rejections.

  **Jordan:** I'm comparing the *justificatory load*. A principle that generates 100 strong reasons for rejection is less stable than one that generates one. It's not that the 100 reasons merge into one big reason. It's that the moral cost of maintaining a principle is higher when it alienates more people.

  **Alex:** But what makes the cost higher? If each person is separate, why does alienating 100 people matter more than alienating one, unless you're summing the moral significance of that alienation? If I punch one person, it's wrong. If I punch 100 people lightly, is it worse? You say yes. Why? Because 100 wrongs are worse than one. That's aggregation.

  **Jordan:** Maybe contractualism *does* allow a form of aggregation, just not the utilitarian kind. Utilitarianism aggregates *good*. Contractualism aggregates *reasons for rejection*. But the limit is the individual complaint. I can't say B1's pain cancels A's death. But I can say that a world where 100 people suffer is one where the principle fails more people.

  **Alex:** So you're saving the 100.

  **Jordan:** I think I have to. If I don't, I'm saying the 99 extra people don't matter. But I want to say they matter as individuals, not as units.

  **Alex:** Then you're stuck with the same problem. If they matter as individuals, and A matters as an individual, and A's individual stake (life) is higher than B1's individual stake (pain), then A wins. Unless you lower the value of A's life or raise the value of B1's pain. The only way to bridge that gap is the numbers. And if the numbers bridge the gap, you're aggregating.

  **Jordan:** Or maybe the distinction is this: Utilitarianism asks, "Which outcome is better?" Contractualism asks, "Which principle is less rejectable?" Sometimes those converge. Saving the 100 is the better outcome. It's also the less rejectable principle because it leaves fewer people with catastrophic burdens. But the *reason* isn't that the pain sums to more than death. The reason is that we couldn't justify to the 100 that their suffering was negligible.

  **Alex:** But you *are* saying their suffering sums to something significant. You're saying 100 migraines > 1 death.

  **Jordan:** I'm saying the *principle* allowing 100 migraines is harder to defend than the principle allowing 1 death. The math is the same, but the moral structure is different. In your view, I sacrifice A for the greater good. In mine, I adopt a principle that A cannot reasonably demand, because demanding it imposes unacceptable burdens on too many others.

  **Alex:** "Too many." There's the number. You can't escape the aggregation, Jordan. You've just moved it from the calculus of good to the calculus of reasonableness.

  **Jordan:** Maybe. But if I move it there, I preserve the idea that we owe justification to each person. You don't owe A justification that their life was weighed against pain units. You owe them justification that no principle could protect them without imposing unfair burdens on others. The numbers matter because fairness involves distribution, not just totals.

  **Alex:** Fairness. Now we're talking about distribution. But in this case, everyone is a stranger. There's no pattern of distribution over time. It's a one-off.

  **Jordan:** Even in a one-off, the principle sets a precedent. If we save A, we establish that individual vital interests always trump aggregate serious interests. That principle is rejectable by anyone who might find themselves in the group of 100.

  **Alex:** And if we save the 100, we establish that vital interests can be trumped by aggregate non-vital interests. That is rejectable by anyone who might be A.

  **Jordan:** Exactly. So which rejection is more reasonable?

  **Alex:** The one that minimizes suffering.

  **Jordan:** See? We're back to the outcome.

  **Alex:** No, we're back to the only thing that breaks the tie. You wanted to know if contractualism can save the 100 without cheating. It can, but only if it admits that the number of people affected changes the reasonableness of the rejection. And once you admit that, you've admitted that people's claims can be weighed against each other aggregatively.

  **Jordan:** Or maybe it just means that "reasonable rejection" isn't a solitary test. It's a comparative one. We compare the strength of A's complaint against the *combined force* of the 100's complaints, not by adding them, but by recognizing that a principle opposed by many is less justifiable than one opposed by few.

  **Alex:** "Combined force." Jordan, that's aggregation.

  **Jordan:** (Laughs) Maybe. But it feels different. It feels like I'm respecting them as separate people who all have a voice, rather than buckets of utility.

  **Alex:** As long as you save the 100, I don't care what you call the math.

  **Jordan:** That's the problem. I need to know if the math is hiding the morality.

  **Alex:** Or if the morality is just the math wearing a suit.
