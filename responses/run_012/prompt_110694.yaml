          5.  Apply the account to the specific case study (seed-cracking birds, bony ridge, sexual selection).
          6.  Evaluate the colleague's conclusion about the case study (ridge is now selected, so spandrel claim is false/excuse).
          7.  What evidence discriminates spandrel vs. adaptation accounts?
          8.  What is the dispute over adaptationism actually about? (Frequency, Method, Explanatory Priority).
          9.  Can those three questions come apart?
      *   **Constraint:** Answer in American English.

  2.  **Part 1: Conceptual Issues (Traits vs. Histories):**

      *   *Issue:* People treat these as static categories of objects (like "mammal" or "reptile"). They are actually dynamic categories of evolutionary *history*.
      *   *Traits vs. Explanations:* They classify explanations (etiological histories), not the physical traits themselves. A beak isn't inherently an adaptation; it's an adaptation *for* cracking seeds if selected for that.
      *   *Temporal Fluidity:* Yes, a trait can change labels. A trait can start as a byproduct/spandrel and become an adaptation later (exaptation).
      *   *Spandrel vs. Byproduct:* "Byproduct" is the general category (non-selected consequence). "Spandrel" (Gould & Lewontin) is a specific rhetorical/architectural metaphor emphasizing that the feature is a necessary structural consequence of a larger design, often implying it *cannot* be optimized independently without collapsing the main structure. It adds the nuance of architectural constraint vs. mere incidental noise.

  3.  **Part 2: Evaluating the Operational Test:**

      *   *Colleague's Test:* "Spandrel = no selection pressure identified."
      *   *Critique:* This is confused.
          *   *Reason 1:* Absence of evidence is not evidence of absence. Just because we haven't found the pressure doesn't mean it's not there.
          *   *Reason 2:* A trait can be a spandrel *originally* but later co-opted (exaptation). If it's currently selected, the test fails to capture the history.
          *   *Reason 3:* A trait can be a spandrel and *still* be under stabilizing selection (maintenance) without being an adaptation *for* its current form.
      *   *Defensible aspect:* It highlights that spandrels lack the *specific* history of selection *for* their current utility that defines adaptations. But as an operational test, it's epistemologically weak.

  4.  **Part 3: Case Study Application (Bird Ridge):**

      *   *Scenario:* Ridge is a developmental byproduct of jaw growth (needed for seeds). Later, females prefer tall ridges (sexual selection). Ridge grows taller.
      *   *Colleague's Remark:* "Since it's now maintained by selection, calling it a spandrel is false/an excuse."
      *   *Analysis:*
          *   *What's Right:* It is no longer *just* a spandrel in the current epoch. It has been exapted. It is now an adaptation for mating success.
          *   *What's Confused:* It conflates current utility/maintenance with original origin. The "spandrel story" wasn't an excuse; it was a hypothesis about *origin*. The fact that it is now selected doesn't erase the fact that it originated as a byproduct. Gould & Lewontin explicitly allowed for spandrels to be co-opted.
          *   *Discriminating Evidence:* To distinguish the accounts, we need phylogenetic and developmental data.
              *   *Adaptation Account:* Ridge variation should precede jaw variation; ridge genetics should be independent of jaw mechanics; fossil record shows ridge appearing before hard seeds.
