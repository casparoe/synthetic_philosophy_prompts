  **(Note on the Bird Case):** The ridge is *currently* an adaptation (sexual selection). But it *originated* as a spandrel. The colleague says calling it a spandrel is *false*. I need to explain that "is a spandrel" is shorthand for "originated as a spandrel." The colleague is confusing current status with historical origin.

