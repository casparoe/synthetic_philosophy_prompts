      *   *Key Insight:* Gongsun Long is operating in a framework of *names* (ming) and *actualities* (shi). He is often interpreted as a nominalist or a realist about universals, but crucially, he treats compound terms as creating a *new* universal, not just restricting an existing one.

  3.  **Deconstruct the Math-Class Distinction:**
      *   *Identity ($=$):* $A = B$ means they are the exact same object. (e.g., $2+2 = 4$).
      *   *Subset/Inclusion ($\subseteq$):* $A \subseteq B$ means every element of A is in B. (e.g., Squares $\subseteq$ Rectangles).
      *   *Standard Logic View:* "A white horse is a horse" translates to $\forall x (WhiteHorse(x) \rightarrow Horse(x))$. This is subset inclusion. It does *not* imply identity ($WhiteHorse \neq Horse$ as sets, because the set of horses is bigger).

  4.  **Compare the Two Frameworks:**
      *   *The User's Hypothesis:* Gongsun Long is confusing "is" (identity) with "is a" (subset).
      *   *Evaluation:* This is the standard Western logical rebuttal (Mozi later did something similar). If "is" means $\subseteq$, the statement "White Horse is not Horse" is false. If "is" means $=$, the statement is true (the concept *White Horse* is not identical to the concept *Horse*).
      *   *Nuance:* Gongsun Long *knows* they aren't identical. His point is stronger: The *compound* creates a new ontological category. He isn't just saying "The set of white horses is not the set of all horses." He's saying "The *name* 'White Horse' refers to a distinct entity from the *name* 'Horse'."
      *   *Where Set Theory Falls Short:* Set theory handles extension (the collection of objects). Gongsun Long is often read as focusing on *intension* (the meaning/concept). In intensional logic, the concept "White Horse" is indeed distinct from "Horse". But Gongsun Long goes further: he suggests the *object* designated by the compound name is different.
      *   *Verdict:* The math distinction *mostly* dissolves the paradox for practical purposes, but it misses Gongsun Long's metaphysical point about how language carves up reality. He is arguing about *reference*, not just classification.

