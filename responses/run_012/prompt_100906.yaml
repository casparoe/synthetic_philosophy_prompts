          *   If you ask for a "ball," a blue small ball works.
          *   If you ask for a "big red ball," a blue small ball fails.
          *   Therefore, "Big Red Ball" is not "Ball".
      *   *Comparison:* Both agree on the logic of the request test. They disagree on the linguistic conclusion. Math says "It's a subset, so colloquially we say 'is a'." Gongsun says "The names are distinct, so strictly speaking 'is not'."

  6.  **Drafting the Response (Iterative refinement):**
