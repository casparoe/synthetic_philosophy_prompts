  8.  **Final Polish:** Check the "Soft Spot" lines. They need to be honest vulnerabilities. Check the "Concede/Hold" distinction.

      *(Final check on the "Secret Fear")*: The prompt asks for "the one question I'm secretly hoping nobody asks." This should be distinct from the 8 objections. The ethical vagueness question is the classic killer for vague subjecthood.

