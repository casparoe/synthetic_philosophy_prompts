prompt: |-
  I'm a science and ideas journalist, and in a few weeks I've been asked to run a seventy-five-minute session for the data desk of a metropolitan daily: a dozen reporters who can read a regression table and took one college statistics course, ten years ago. The subject is why the uncertainty we publish is almost always a single number, and what we give up by pretending it is one. I don't want the session to be a lecture on imprecise probability, and I emphatically don't want you to explain the topic to me; I want you to plan how I should teach it, with a whiteboard, no slides, and no notation beyond what I can put up in a minute. So: what has to come first, and what depends on what? My own instinct is that a room cannot see the point of a range of credences until it has first felt the full force of the argument that a rational agent's degrees of belief must be precise (the betting argument, the one that says that if you will buy and sell at odds that don't correspond to any single probability, someone can arrange to take money off you no matter how the world turns out), and that the session only works if the audience accepts that argument and then watches it come apart. If that ordering is right, tell me exactly where the pivot belongs and what has to be in place before it can land; if it's wrong, tell me what the real dependency structure is. One specific question: does the formalism have to be on the board before or after the intuitive case that motivates it? I mean the move from "my credence is 0.4" to "my credences are the set of all probability functions that satisfy certain constraints," together with the fact that the lower and upper bounds of such a set need not themselves be probabilities of anything.

  For the case that carries the whole session, I had planned the two-urn setup: one urn whose composition is stated, a second urn where I know only that it holds a hundred balls, red or black in some unstated proportion, and the usual pull toward betting on the known urn. Is that the right carrier, and if so, what must it be made to do that it doesn't do on its own; if not, what should replace it? I'm suspicious of it on two grounds. Everyone has seen it, so it arrives pre-loaded with sixty years of commentary and the audience may simply recognise it rather than think about it; and it invites the reading that the second urn's composition is merely unknown, when the point I want them to leave with is that some questions about my own state of belief have no answer, and that this is not the same as ignorance, and not the same as a second-order probability either. It isn't that I have a distribution over distributions; it's that my credence is genuinely a range, and the range is not a summary of what I don't know. Whatever carries the session also has to be able to do something later on: show that gathering evidence can make a range wider rather than narrower, which is the result that breaks most people's grip on the picture, and which I'd like them to reach as a conclusion rather than be told. If a different example can carry both jobs, I'd rather use it.

  Then the misconceptions, which are really what I'm paying for. I'd like a list of the ones this audience will predictably bring in or form, each with the exact point in the sequence where it should be headed off, and a one-line way of heading it off that doesn't require the machinery I've said I won't put on the board. My own guesses, to be corrected: that a range just means "we don't know"; that anything a range can do a prior over priors can do, so the whole topic is a detour a good Bayesian can skip; that imprecision is a licence for wishful thinking, since if your credences are a set you can always find a member that likes the conclusion you wanted; that the bounds are probabilities of something in the world; that imprecision is a temporary defect that more evidence will always cure; and that this is a topic about groups disagreeing rather than about one person's state of mind. I expect the most serious objection belongs near the end and that I should present it in its strongest form myself: that a set of credences is just a committee of precise agents, so nothing is gained and the real work is merely displaced into an unprincipled choice of decision rule. Tell me whether that is the right objection to foreground, where it should go, and how much of the standard battery of decision rules (act only on options that are optimal under some member of the set; rank options by their worst case; some weighted compromise between best and worst case) a room like this needs in order to see the problem, versus how much I should openly refuse to explain. End with the single question I should ask in the last five minutes to find out whether the distinction actually landed rather than whether they enjoyed the hour, and with what I should say out loud that I am leaving out at this level. Throughout, please separate what is settled from what is genuinely contested among people who work on this for a living, and don't hand me a contested position as though it were the consensus; if some part of what I've assumed above is itself disputed, say so plainly, because I will be repeating it to reporters.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the User and Request:**
      *   **User:** Science and ideas journalist.
      *   **Audience:** Data desk of a metropolitan daily (12 reporters). They know regression tables, took stats 10 years ago. They are practical, skeptical, likely Bayesian-leaning (implicitly), and care about *publishing* uncertainty.
      *   **Topic:** Why published uncertainty is a single number, what is lost by that, and the case for imprecise probability (sets of credences).
      *   **Constraints:** 75 minutes. Whiteboard only (no slides). No complex notation (must be writable in <1 min).
      *   **User's Instincts/Questions:**
          *   *Ordering:* Should I teach the Dutch Book argument for precise credence first, then break it? (User thinks yes).
          *   *Formalism:* Board before or after intuition?
          *   *Example:* Is the Ellsberg Two-Urn setup right? User worries it's cliché and implies "unknown fixed parameter" rather than "genuine indeterminacy." Needs to show evidence can *widen* the range.
          *   *Misconceptions:* List specific ones, when to address them, and one-line deflections.
          *   *Objection:* Is the "committee of agents" objection the big one? How much decision theory to include?
          *   *Ending:* One question to test understanding, one statement on what's being omitted.
          *   **Crucial Constraint:** Distinguish settled vs. contested views in the field. Do not present contested philosophy as consensus fact.

  2.  **Deconstruct the Core Pedagogical Challenge:**
      *   The audience are *practitioners*. They want to know: "Why should I write '50-60%' instead of '55%'?"
      *   The philosophical heavy lifting (Dutch Book, imprecise probability axioms) is dry and abstract.
      *   The user wants to avoid a lecture on imprecise probability theory but needs the *concept* to land.
      *   The user's instinct about the Dutch Book argument is *pedagogically sound but risky*. If you prove precision is rational, then say "actually it's not," you risk confusing them unless the "break" is very sharp.
      *   *Correction on User's Instinct:* The Dutch Book argument for *precision* relies on the assumption that you *must* quote a price for *any* gamble. If you allow "no quote" (abstention), the argument for precision collapses. This is the pivot point.

  3.  **Address the Specific Questions:**

      *   **Ordering (Dutch Book First?):** Yes, but with a modification. You need to establish *why* we default to single numbers (coherence/decision-making) before showing why that fails under severe uncertainty. The pivot is the *option to abstain*.
      *   **Formalism vs. Intuition:** Intuition *must* come first. If you put $P(A) \in [0.4, 0.6]$ on the board before they feel the tension, it looks like error bars. They need to feel the *decision paralysis* first.
      *   **The Example (Two Urns):** The user is right to be suspicious. Ellsberg is about *ambiguity aversion* (psychology) vs. *imprecise credence* (epistemology). Also, Ellsberg usually implies a fixed but unknown composition. To show evidence *widening* the range, we need a different case.
          *   *Better Example:* A model ensemble or a "clueless" prediction. Let's try a "Policy Impact" scenario. E.g., "Will this new law reduce crime?"
          *   *Actually, stick closer to the User's strength:* They are a journalist. Use a *story* example. "Will the candidate win?"
          *   *Best for "Evidence Widens Range":* The "Black Swan" or "Model Disagreement" scenario. If I see data that fits Model A (predicts 10%) and Model B (predicts 90%), my range widens from [40, 60] to [10, 90].
          *   *Decision:* The Two-Urn is too associated with "risk vs. ambiguity." Let's use a **Forecasting/Model** example. It resonates better with data reporters.
      *   **Misconceptions:** Need to be specific.
      *   **The "Committee" Objection:** This is the strongest philosophical objection (Levi vs. others). It needs to be the climax.
      *   **Settled vs. Contested:** This is vital. Imprecise probability is *not* consensus. It is a live debate in philosophy of science and statistics.

  4.  **Drafting the Plan - Section by Section:**

      *   **Phase 1: The Hook & The Default (0-15 mins).** Why do we write single numbers? (Decision necessity).
      *   **Phase 2: The Break (15-30 mins).** The Dutch Book pivot. The right to say "I don't bet."
      *   **Phase 3: The Carrier Example (30-50 mins).** Replace Ellsberg with something that shows *widening*.
      *   **Phase 4: Misconceptions & The "Committee" Objection (50-65 mins).**
      *   **Phase 5: Closing (65-75 mins).** The test question and the disclaimer.

  5.  **Refining the "Evidence Widens" Example:**
      *   Standard Bayesian view: Evidence narrows the posterior.
      *   Imprecise view: Evidence can rule out the "middle" models, leaving only extremes.
      *   *Scenario:* Predicting a novel virus spread.
      *   *Start:* Little data. Assumptions vary. Range [20%, 80%].
      *   *New Data:* Shows it's not moderate. It's either highly contagious or not contagious at all (bimodal).
      *   *Result:* Range becomes [5%, 95%].
      *   *Wait, is that right?* If the set of priors is updated, and the data is compatible with extremes but not the middle, the posterior set widens. Yes.
      *   *Simpler version for whiteboard:* Two experts. Expert A says 10%. Expert B says 90%. You trust both equally. Credence = {10%, 90%}. Mean = 50%.
      *   *New Evidence:* Data comes in that is consistent with *both* A and B, but rules out the "50%" middle-ground theory.
      *   *Result:* Your single number (50%) is now demonstrably wrong, but your range ({10%, 90%}) is robust.
      *   *Actually, let's look for the "Widening" specific request.*
      *   *Example:* "Will the bridge collapse?"
      *   *Prior:* We know little. Range [0, 1].
      *   *Evidence:* Engineering report. It's either built to spec (0% collapse) or there's a specific flaw (90% collapse). The report doesn't distinguish which.
      *   *Posterior:* Range {0, 0.9}. The *interval* covering the set is now [0, 0.9]. (Wait, that's not wider than [0,1]).
      *   *Let's try the "Model Uncertainty" angle.*
      *   *Prior:* We have 5 models. They predict 40-60%. Range [0.4, 0.6].
      *   *Evidence:* Data arrives. It kills the 3 moderate models. Only the two extreme models (10% and 90%) survive.
      *   *Posterior:* Range [0.1, 0.9].
      *   *This works.* It shows information increasing *imprecision*.

  6.  **Addressing "Settled vs. Contested":**
      *   *Settled:* Single numbers are often overconfident. Model uncertainty exists.
      *   *Contested:* Whether imprecise credence is a *fundamental* state or just a placeholder for a higher-order prior. Whether the "Dilation" phenomenon (evidence widening uncertainty) is a bug or a feature.
      *   *Must emphasize:* This is a *normative* debate, not just math.

  7.  **Addressing the "Formalism on Board" Question:**
      *   User asked: Formalism before or after intuition?
      *   Answer: **After.** If you write $K = \{P_1, P_2...\}$ first, they tune out. Write "Expert A" and "Expert B" first. Then abstract.
      *   *Notation:* Keep it to $[L, U]$.

  8.  **Addressing the Misconceptions:**
      *   "It's just ignorance." -> Counter: Ignance shrinks with data; this can grow.
      *   "It's a prior over priors." -> Counter: That requires a precise hyper-prior, which we don't have.
      *   "Wishful thinking." -> Counter: Rules (E-admissibility) prevent cherry-picking.
      *   "Bounds are probabilities." -> Counter: 0.4 might not be *anyone's* probability.
      *   "Group disagreement." -> Counter: One mind, conflicting evidence.

  9.  **Addressing the "Committee" Objection:**
      *   This is the "Levi vs. Kyburg" debate.
      *   Don't teach decision rules (Maximin, etc.) in detail. It's too much.
      *   Just show that *choice* becomes *set-valued*. You might be rationally permitted to *do nothing*.
      *   This is the hard pill for journalists: "I can't write a headline number."

  10. **Final Review against Constraints:**
      *   75 mins? Yes, the timing looks tight but feasible.
      *   Whiteboard only? Yes, minimal notation.
      *   No slides? Yes.
      *   Journalist audience? Yes, focus on *publishing* implications.
      *   Settled vs. Contested? I need to make sure I flag the "Dilation" and "Foundational" status as contested.

  11. **Self-Correction on the "Dutch Book" Pivot:**
      *   The user wants to teach the Dutch Book argument for precision *first*, then break it.
      *   *Risk:* If I teach them they *must* be precise to avoid losing money, they will cling to that.
      *   *Pivot:* The pivot is that the Dutch Book argument assumes you *must* make a bet. If the market allows you to say "No price," the bookie can't Dutch Book you.
      *   *Refinement:* Don't prove the Dutch Book. *Sketch* it. "If you buy at 40 and sell at 60..." Then ask: "When are you allowed to say 'No'?"

  12. **Final Polish of the Plan:**
      *   Make sure the "Evidence Widens" example is crystal clear for the whiteboard.
      *   Ensure the "Settled vs. Contested" warnings are prominent for the journalist to repeat accurately.
      *   Check the "One Question" at the end. It needs to test the *concept*, not memory.

      *(Self-Correction during drafting)*: I need to be careful not to validate the user's premise that "rational agents' degrees of belief *must* be precise" as settled fact. It's the *standard* view (Bayesian orthodoxy), but the session is about challenging it. I must frame the first part as "The Standard Story" and the second as "The Challenge."

      *(Refining the "Evidence Widens" example)*: The "Model Killing" example is best.
      Start: 3 models. Low, Med, High. Credence spread across all. Range [L, H].
      Data: Rules out Med.
      End: Credence on Low and High only. Range [L, H] (same width? No).
      Wait, if I start with uniform over [0.2, 0.8] and data kills the middle, I end up with mass at 0.2 and 0.8. The *convex hull* is still [0.2, 0.8].
      To *widen* the range (Dilation), I need a specific structure.
      *Standard Dilation Example:* You have a coin. You don't know if it's biased. You toss it. The outcome (Head/Tail) makes you *less* sure about the bias than you were before?
      *Simpler for journalists:* "The Expert Disagreement."
      Before data: Experts agree roughly. Range [40, 60].
      Data arrives: It's ambiguous. Expert A says "See, I told you." Expert B says "No, this proves me."
      Now you trust both, but they diverge more. Range [20, 80].
      *Why?* Because the data was compatible with *more extreme* interpretations than the prior consensus.
      *Okay, I will structure this carefully.*

      *(Final check on "Settled vs Contested")*:
      *   Settled: Single numbers hide uncertainty.
      *   Contested: Whether imprecise credence is the *right* formalism vs. hierarchical Bayes. Whether Dilation is rational.
      *   I must ensure the user knows to say "Some statisticians argue..." rather than "The truth is..."

      *(Final check on Decision Rules)*:
      *   User asked: How much to explain?
      *   Advice: None. Just the *consequence*. "You sometimes cannot choose." That's the headline.

      *(Final check on the "One Question")*:
      *   Needs to distinguish "I don't know" from "It is indeterminate."
      *   "If I give you more data, what happens to the range?" (If they say "It shrinks," they failed).

