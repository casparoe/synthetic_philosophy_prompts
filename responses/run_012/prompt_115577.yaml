      *   *Key Insight:* The "Strategy-Stealing Argument" in game theory is non-constructive. It proves existence, not copyability. The friend is misusing the term slightly to mean "copyability." I should point this out gently.
      *   *Reflexivity:* This is a strong point against the friend. Some strategies *only* work if the opponent doesn't know them. (e.g., bluffing).

