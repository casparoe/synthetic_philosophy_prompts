answer: |-
  This is a fantastic collision of game theory, intellectual property law, and epistemology. You've identified a genuine tension: your friend is arguing from a position of **theoretical symmetry** (in a world of perfect rational agents, ideas are free), while the law operates on **practical asymmetry** (in the real world, friction, secrecy, and embodiment create value).

  Here is a breakdown of what each side presupposes about the nature of strategy, whether they can be reconciled, and what happens if you swap the assumptions.

  ### 1. Deconstructing the Friend's "Strategy-Stealing" Argument

  Your friend is borrowing a term from combinatorial game theory (like Hex or Chomp), but he is slightly misapplying it.
  *   **The Math:** In game theory, the "strategy-stealing argument" proves that the first player *must* have a winning strategy (or a draw), because if the second player had one, the first player could make a dummy move and then "steal" the second player's strategy. It is a **non-constructive proof**: it proves a strategy *exists*, not that it is *easy to find* or *easy to copy*.
  *   **The AI Safety Extrapolation:** Your friend is using it to mean **fungibility**. His premise is: *Capability is purely informational.* If Agent A knows how to build a dangerous system, the "strategy" is just bits. If Agent B is equally intelligent, Agent B can process those bits and execute the plan. Therefore, secrecy is futile; only compute/resources matter.

  **The Flaw:** This assumes a frictionless world where execution cost is zero and context doesn't matter. It treats strategy as **explicit knowledge** (codifiable data) rather than **tacit knowledge** (know-how).

  ### 2. What the Law Presupposes (The Triad of IP)

  The law does not contradict itself; rather, it acknowledges that "knowledge" is not a single thing. It exists on a spectrum from **detachable** to **embodied**. Each legal tool protects a different slice of that spectrum.

  | Legal Mechanism | Presupposition about Strategy | Nature of Knowledge |
  | :--- | :--- | :--- |
  | **Patents** | Strategy is a **recipe**. It can be written down perfectly. Once written, it is copyable, so we grant a temporary monopoly in exchange for the recipe. | **Explicit / Detachable.** Assumes the "how-to" can be fully separated from the "who." |
  | **Trade Secrets** | Strategy is a **vault**. It is copyable *if accessed*, but access can be physically/ digitally denied. Reverse engineering is possible but costly. | **Hidden Explicit.** Assumes friction matters. Copying is possible but not instantaneous or free. |
  | **Non-Competes** | Strategy is **muscle memory**. It lives in the neural pathways of the employee. You cannot separate the engineer from the engineering. | **Tacit / Embodied.** Assumes knowledge is inseparable from the agent. |

  **Are they contradictory?**
  No. They are a coherent toolkit for managing **transfer costs**.
  *   If transfer cost is low (easy to copy once seen) $\rightarrow$ **Patents** (give us the info, we give you money).
  *   If transfer cost is medium (hard to find, easy to use) $\rightarrow$ **Trade Secrets** (hide the info).
  *   If transfer cost is high (requires human intuition/experience) $\rightarrow$ **Non-Competes** (restrict the human).

  The law implicitly admits your friend is partially right (patents expire because eventually, knowledge *does* diffuse) but also that he is wrong (secrecy and embodiment *do* create temporary moats).

  ### 3. Strategies That Cannot Be Stolen (Or Self-Destruct When Stolen)

  Your friend claims strategy can *never* be a moat. This is empirically false. There are classes of strategy that are either agent-specific or reflexive.

  **A. Reflexive Strategies (The "Bluff" Problem)**
  Some strategies cease to function the moment they are known.
  *   *Example:* Market making or arbitrage. If everyone knows your algorithm, they front-run you, and the profit vanishes.
  *   *Example:* Security through obscurity. If the "strategy" is hiding a key under a specific mat, the strategy fails once the location is stolen.
  *   *Implication:* For these strategies, **secrecy is the capability.** Your friend's claim that "locking up capabilities is pointless" fails here. If the capability is knowledge-dependent, locking the knowledge locks the capability.

  **B. Embodied Strategies (Tacit Knowledge)**
  *   *Example:* A master negotiator or a researcher with "intuition." You can give their notes to a rival, but the rival won't get the same results.
  *   *Example:* Organizational Culture. You can copy a company's org chart, but you can't copy the trust networks between employees that make it function.
  *   *Implication:* This validates the **Non-Compete** logic. The strategy is not a lump of information; it is a state of the agent.

  **C. Positional Strategies (First-Mover Advantage)**
  *   *Example:* Network effects. Even if a competitor copies your code (strategy), they cannot copy your user base (position).
  *   *Implication:* Strategy creates position. Once the position is held, the strategy that got you there is irrelevant, but the *advantage* remains.

  ### 4. The Counterfactual: Swapping the Views

  What happens if we force one side to adopt the other's ontology of knowledge?

  **Scenario A: The Law adopts your Friend's View**
  *(Assumption: All strategy is instantly copyable by any capable agent; secrecy is impossible.)*
  *   **Patents Abolished:** Why grant a monopoly for disclosure if disclosure doesn't actually help anyone learn it (because they already could have figured it out) or if they will copy it instantly anyway?
  *   **Trade Secrets Abolished:** If information cannot be contained, legal protection for secrecy is nonsense.
  *   **Security Shift:** All security becomes physical. You don't guard data; you guard compute. You don't sue leakers; you destroy competitors' hardware.
  *   **AI Safety:** Governance becomes impossible. You cannot regulate "knowledge" of how to build a bioweapon. You can only regulate access to electricity and chips.

  **Scenario B: Your Friend adopts the Law's View**
  *(Assumption: Knowledge exists on a spectrum of transferability; friction matters.)*
  *   **AI Safety Shift:** "Locking up capabilities" is no longer pointless. If dangerous capabilities rely on specific model weights (Trade Secret) or specific research teams (Non-Compete), then containment is viable.
  *   **Strategy Re-evaluation:** He would have to admit that an AI lab *can* have a moat. If Lab A has a specific alignment technique that is tacit (hard to encode), Lab B cannot simply "steal" it by reading a paper.
  *   **Policy:** Focus shifts to personnel security, export controls on talent, and managing the "tacit knowledge" supply chain, not just hardware.

  ### 5. The Synthesis: Where Your Friend is Right (and Why it's Scary)

  There is one domain where your friend is terrifyingly correct: **General Purpose AI.**

  The law was written for human-scale knowledge. Humans have high friction. We forget, we die, we teach poorly.
  *   **AI reduces friction.** If an AI figures out a strategy, it can likely output the weights or the code to another AI instantly.
  *   **AI reduces tacit knowledge.** If a capability can be represented as a neural net, it is no longer "in the head"; it is a file. Files are copyable.

  If AI reaches a point where **all** strategic capability can be compressed into a model file, then the **Patent/Trade Secret distinction collapses**. Everything becomes a Trade Secret until it leaks, at which point it becomes instantly universal.

  **The Verdict:**
  Your friend is describing a **high-temperature equilibrium** (information flows freely, only energy/resources matter). The law describes a **low-temperature equilibrium** (information is viscous, friction creates value).

  We currently live in the law's world. Your friend is betting that AI will heat the system up until the law's assumptions melt.

  **To answer your specific questions:**
  1.  **What does each practice presuppose?** Patents presuppose knowledge is *code*. Trade Secrets presuppose knowledge is *locked code*. Non-competes presuppose knowledge is *wetware*.
  2.  **Can one view license all three?** Yes, if you view knowledge as having a **cost of transfer**. Patents = Low transfer cost. Secrets = Medium transfer cost. Non-competes = High transfer cost (requires moving the human).
  3.  **Are there strategies that stop working when stolen?** Yes, reflexive strategies (security, arbitrage, bluffing).
  4.  **What would change if we swapped the view?** If we accepted your friend's view, Intellectual Property law would be abolished as a fiction, and safety would rely entirely on physical resource control (compute governance). If we force his view to accept the legal view, he must admit that containment and secrecy *are* viable safety strategies for now.

  You won the argument on the current reality; he is betting on a future ontology. The danger is that if he's right about the future, our current legal tools will be useless exactly when we need them most.
