  *(Self-Correction during drafting)*: I need to be careful not to make Weber sound *too* sympathetic to the culturalists. He wasn't a cultural determinist. He was about the *interaction* of material and ideal interests. I need to emphasize that "institutions" without "legitimacy" are unstable for Weber. Also, on the discount rate, I need to make sure I don't just say "he'd hate it." I need to explain *why* in terms of his methodology (meaning vs. mechanism).

  *(Refining the Normative point)*: The prompt asks if *Wertfreiheit* gives him a clean exit. I should argue it doesn't fully. His selection of topics (*Wertbeziehung*) implies a judgment on what is historically significant. He might not say "Protestantism is good," but his focus on the "fate" of the West implies a tragic valuation.

  *(Refining Blind Spots)*: Don't just say "math." Say "the concept of aggregate growth independent of state power." Weber cared about *Macht* (power), not just *Wohlstand* (wealth).

