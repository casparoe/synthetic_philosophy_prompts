      *   **Task:** Predict where Max Weber (d. 1920) would land in the modern "Culture vs. Institutions" debate (Banfield, Landes, Acemoglu-Robinson, Henrich).
      *   **Specific Constraint:** Use Weber's own vocabulary (ideal types, value-judgment vs. value-relevance, legitimacy, explanatory understanding vs. causal explanation).
      *   **The Twist:** Address a development economist's claim that "culture = patience/discount rate" and PE is just a pre-formal version of this. Does Weber accept this reduction? Does the thesis dissolve if true?
      *   **Normative Question:** Would Weber take sides on "some cultures are better"? How does *Wertfreiheit* (value-freedom) hold up here?
      *   **Blind Spots:** Where would Weber be out of his depth conceptually?
      *   **Format:** Start with a scratchpad (brainstorming intelligibility/category mistakes), then the main prediction/essay. No bibliography, no page numbers, no invented letters. Careful, integrated argument (no bullet points in the final output).

  2.  **Scratchpad/Brainstorming (Mental or Draft):**
      *   *Intelligibility:*
