answer: |-
  This is a formidable objection, and your instincts are correct: Linear B is a stress test that exposes the boundary conditions of Davidson's project. It forces a distinction between *decipherment* (cryptanalysis + historical philology) and *radical interpretation* (constitutive account of meaning).

  Here is the analysis run in the two directions you requested, keeping the mapping tight and acknowledging where the machinery jams.

  ### 1. The Davidsonian Mapping
  *How the Linear B story looks if we force it into the Radical Interpretation (RI) framework.*

  *   **The Interpreter:** Michael Ventris (later Ventris & Chadwick).
  *   **The Speaker:** The Mycenaean scribes (treated as a collective agent).
  *   **The Total Evidence:** The corpus of clay tablets. In RI, evidence is usually "the speaker holds sentence *s* true at time *t*." Here, the evidence is "the scribe inscribed sign-sequence *S* on a tablet found in context *C* (e.g., next to a drawing of a chariot, or in a storage magazine)."
  *   **The Constraint (Charity):** We assume the scribes were rational agents operating in a world broadly intelligible to us (palace economy, livestock, geography). We assume their inscriptions are mostly true descriptions of that world.
  *   **The Output:** A Tarski-style truth theory. E.g., *'ko-no-so' refers to Knossos*; *'to-so-de pe-mo' is true iff that-many seeds were sown*.
  *   **The Fit:**
      *   **Simultaneity:** Ventris could not assign sound values without assuming the records made sense (belief), and he couldn't confirm the sense without assigning sound values (meaning). This mirrors the belief/meaning interdefinition.
      *   **Holism:** Individual signs only gained value within the grid of the whole system (Kober's triples).
      *   **Verification:** The theory yielded predictions (new tablets found later fit the phonology/grammar), satisfying the empirical constraint on truth theories.

  **Verdict:** Superficially, the *structure* of the discovery matches the *structure* of RI. You have an agent maximizing rationality to assign truth conditions to marks.

  ---

  ### 2. The Breaking Points
  *Where the machinery fails to describe the case, addressing your suspicions.*

  **(a) No Speakers, No Behavior (The Triangulation Problem)**
  *   **The Objection:** Davidson's later work emphasizes **triangulation**: meaning arises from the causal interaction between two creatures and a shared world. RI requires observing a speaker *holding a sentence true* in response to environmental features.
  *   **The Break:** Linear B offers no *holding true*. It offers static inscriptions. We do not see the scribe assent to "This is a sheep" when a sheep is present. We only see the record.
  *   **Davidson's Silence:** Davidson explicitly distinguishes *interpretation* from *decipherment*. In "The Inscrutability of Reference," he admits that with texts alone, we lack the causal link that fixes reference. We are guessing the *context* of utterance archaeologically.
  *   **Conclusion:** Your suspicion holds. RI is a model for *live* communication. Linear B is a model of *historical reconstruction*. Without the live causal link, the "holding true" premise is an assumption, not an observation. The theory is silent on how to bootstrap meaning from dead marks without the behavioral component.

  **(b) Structural Statistics vs. Holism**
  *   **The Objection:** Alice Kober's work (the "Kober Grids") established phonological relationships and inflectional patterns *without* assigning meaning. She knew Sign A and Sign B shared a consonant before she knew what they *meant*.
  *   **The Break:** Davidsonian holism suggests you cannot identify a belief without some grasp of meaning, and vice versa. Kober identified *syntax* and *phonology* (the "shape" of the language) while remaining completely agnostic about *semantics* (she thought it might be Etruscan, Basque, or Greek).
  *   **Davidson's Silence:** Davidson treats syntax as part of the "prior theory," but he insists truth conditions are primary. Kober's success suggests that formal structure can be cracked independently of truth conditions.
  *   **Conclusion:** This contradicts the strict interdefinition of belief and meaning *at the initial stage*. You *can* crack the code's geometry without knowing the truth conditions. Davidson's machinery describes the *final* assignment of truth, but it cannot describe Kober's preliminary structural work, which was semantics-free.

  **(c) The Greek Hunch vs. The Principle of Charity**
  *   **The Objection:** Ventris's breakthrough relied on the specific hypothesis: "This is Greek." RI forbids assuming you know the language in advance (that's why it's *Radical*).
  *   **The Break:** The Principle of Charity says "assume they are rational and mostly right." It does *not* say "assume they are speaking a language you already know." Ventris imported external historical knowledge (Greek place names survived in the region). Linear A remains undeciphered precisely because we lack that external linguistic key, even though we can apply the same Charity (assuming Linear A scribes were also rational).
  *   **Davidson's Silence:** Davidson argues Charity is sufficient to generate interpretation. Linear B shows Charity is *necessary but not sufficient*. You need the empirical luck of language continuity.
  *   **Conclusion:** Your suspicion is correct. The "load-bearing" move was not a priori rationality, but an empirical gamble on language identity. If RI claims to explain how meaning is possible *from scratch*, Linear B shows that in practice, we often rely on historical continuity, not just rational reconstruction.

  ---

  ### 3. The Payoff: Language and Indeterminacy

  **Does this tell for or against "There is no such thing as a language"?**
  Davidson's later thesis ("A Nice Derangement of Epitaphs") is that successful communication does not require a *shared convention* (a language), but rather a converging "passing theory."

  *   **Argument Against Davidson:** Linear B looks like the ultimate counter-example to "no language." The Mycenaeans *did* share a strict convention (a scribal code). It was a rigid, rule-governed system. Ventris succeeded precisely because he treated it as a shared convention (a language) that could be decoded. If "language" in Davidson's sense means "shared convention," Linear B proves such things exist and are decipherable.
  *   **Argument For Davidson:** However, Ventris (the interpreter) did *not* share the convention with the scribes. He reconstructed it. This supports Davidson's view that we don't need to *share* a language to interpret; we just need to construct a theory that works. But this is weak, because Ventris relied on the fact that the scribes *did* share one.
  *   **Verdict:** Linear B supports the existence of **conventions** (contra Davidson's minimalism) but supports the possibility of **interpretation without shared conventions** (pro Davidson). It's a wash, but it highlights that Davidson is talking about *live communication*, while Linear B is about *recovering dead conventions*.

  **Does successful prediction count against Indeterminacy?**
  Quine argues that multiple translation manuals can fit all behavioral evidence (Indeterminacy of Translation). Davidson accepts this for reference but denies it for gross truth conditions (Charity limits the options).

  *   **The Case:** Ventris's theory made specific predictions (e.g., how a genitive plural should look). New tablets confirmed these predictions.
  *   **Analysis:** This looks like a falsification of indeterminacy. Only one phonological/grammatical system fit the data so tightly.
  *   **Davidsonian Defense:** Davidson would argue this settles the *syntax* and *phonology*, but not necessarily the *reference*. We know 'ko-no-so' refers to Knossos, but do we know the exact extension of the word for 'sheep'? (Does it include rams? Lambs? Wool only?). Quinean indeterminacy survives at the level of term reference, even if the sentence truth conditions are fixed.
  *   **Verdict:** The decipherment counts **against** global indeterminacy (there wasn't infinite flexibility; the Greek hypothesis was uniquely successful). But it does not refute Davidson's specific version, which allows indeterminacy of reference so long as truth conditions are fixed. However, the fact that the "Greek" solution was *unique* suggests that historical constraints limit interpretation more than Davidson's a priori Charity does.

  ### Summary for the Group

  Your intuition is not amateur noise; it identifies the limit of Davidson's transcendental argument.

  1.  **Applicability:** Davidson's RI describes the *logical relations* of Ventris's final theory (truth, belief, rationality), but it does not describe the *methodology* of decipherment (statistics, historical guessing, structuralism).
  2.  **The Gap:** RI requires live triangulation (holding true). Linear B is static. RI relies on Charity alone. Linear B relied on the empirical luck of language continuity (Greek).
  3.  **The Verdict:** Linear B is **decipherment**, not **radical interpretation**. Davidson admits this distinction. The case shows that while RI might be the *foundation* of meaning in the abstract, actual historical interpretation relies on empirical bridges (like language continuity) that RI pretends we don't have.

  **Recommendation:** Tell your group that Linear B confirms Davidson's *holism* (you can't read one word without the system) but falsifies his *methodological solitude* (you can't do it from scratch without historical luck or structural pre-analysis). It shows that "Radical Interpretation" is a philosophical idealization, not a historical manual.
