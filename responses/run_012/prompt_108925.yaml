answer: |-
  ### I. Desiderata for an Axiology of Infinite Populations

  The following requirements are derived from the fixed cases you provided and the stated purpose: a theory usable for decisions affecting unboundedly large populations.

  **1. Strict Pareto Dominance**
  *   **Requirement:** If every individual in World A has strictly higher welfare than their counterpart in World B, World A is strictly better than World B.
  *   **Motivating Case:** Case 1 (Everyone at 5 vs. Everyone at 6) and the "raise by one" variant in Case 3.
  *   **Tag:** **Non-negotiable.** A theory that cannot rank clear universal improvements fails the basic function of value theory.

  **2. Anonymity (Permutation Invariance)**
  *   **Requirement:** The value of a world depends only on the multiset of welfare levels, not on which specific index (person/time) holds which level. Swapping welfare levels between individuals does not change the total value.
  *   **Motivating Case:** Case 5 (Permutations leave value unchanged).
  *   **Tag:** **Non-negotiable.** Without this, value depends on arbitrary labeling or the accidental order of birth, violating the neutrality required for impartial decision-making.

  **3. Finite Sensitivity**
  *   **Requirement:** A change in the welfare of a finite number of individuals must be capable of changing the verdict of the theory, provided the change is not axiologically neutral (e.g., swapping equal values).
  *   **Motivating Case:** Case 2 (Adding/deleting one person) and Case 7 (Moving finitely many people from 0 to 1 in a bi-infinite line).
  *   **Tag:** **Non-negotiable.** If a theory ignores finite changes, it cannot guide decisions affecting existing or near-future populations, rendering it useless for practical deliberation.

  **4. Decisiveness (Completeness)**
  *   **Requirement:** For any two worlds presented for choice, the theory must yield a verdict (better, worse, or equal). It cannot return "incomparable" or "undefined."
  *   **Motivating Case:** Case 4 (10s+0s vs. 5s) and the stated Purpose (usability for decisions).
  *   **Tag:** **Non-negotiable (given Purpose).** While some theoretical camps accept incomparability, a theory intended for decision-making under stakes that may be infinite must not return silence.

  **5. Translation Invariance**
  *   **Requirement:** Shifting the entire pattern of welfare along the index (e.g., delaying everyone's existence by one generation, or shifting the "origin" of a bi-infinite timeline) does not change the value of the world.
  *   **Motivating Case:** Case 3 (Shifting the assignment along the index) and Case 7 (Bi-infinite populations with no first member).
  *   **Tag:** **Non-negotiable.** In long-run future decisions, the absolute "time zero" is arbitrary. A theory that values a pattern differently based on its absolute position in time introduces arbitrary bias.

  **6. Deliberative Stability (Anti-Fanaticism)**
  *   **Requirement:** A finite, certain good should not be automatically trumped by a minute probability of an unboundedly good outcome, nor should the possibility of infinite value render finite trade-offs impossible to calculate.
  *   **Motivating Case:** Case 6 (Finite good vs. minute probability of unbounded good).
  *   **Tag:** **Camp Preference.** (Some views accept "fanaticism" as a logical consequence of unbounded value; however, for the stated purpose of *usable* deliberation, this is treated here as a requirement to avoid paralysis).

  **7. Bidirectional Consistency**
  *   **Requirement:** The method of evaluation must yield consistent verdicts whether the population is indexed by natural numbers (one-way infinite) or integers (two-way infinite), without relying on a "first person" to anchor the calculation.
  *   **Motivating Case:** Case 7 (Integers with no first/last member).
  *   **Tag:** **Non-negotiable.** The long-run future may be open-ended in both directions (or the "start" may be epistemically inaccessible). A theory requiring a first member fails on cases where no first member exists.

  ***

  ### II. The Impossibility Result

  A subset of these requirements cannot be jointly satisfied by any single theory using standard mathematical structures. Specifically, **Finite Sensitivity**, **Anonymity**, and **Decisiveness** form an inconsistent triad when applied to infinite populations.

  **Informal Derivation:**
  1.  **Assume Decisiveness:** To satisfy Decisiveness (Requirement 4) on Case 4 (a mix of 10s and 0s vs. uniform 5s), the theory must aggregate the infinite stream of values into a single comparable metric. In infinite contexts, the only robust way to compare distributions of value without relying on arbitrary ordering is to use a **limit of averages** (density) or a **generalized sum**.
  2.  **Assume Anonymity:** To satisfy Anonymity (Requirement 2), this aggregation cannot depend on the order of the stream. Standard sums depend on order (Riemann rearrangement); therefore, the theory must rely on something order-independent, like the *density* of welfare levels (the limit of the average welfare as the population sample grows to infinity).
  3.  **The Conflict with Finite Sensitivity:** Mathematical limits of averages are inherently insensitive to finite changes. If you have an infinite sequence and change a finite number of terms (Requirement 3, Case 2), the limit of the average remains exactly the same. The finite change is "washed out" by the infinite background.
  4.  **The Contradiction:**
      *   If you use limits/averages to secure Decisiveness and Anonymity, you violate Finite Sensitivity (you cannot detect the addition of one happy person).
      *   If you modify the math to detect finite changes (e.g., using non-standard hyperreal sums), you typically lose Anonymity (the sum becomes dependent on the order of addition) or Decisiveness (the values become incomparable because the "infinite part" dominates the "finite part" in ways that resist ranking).
      *   Therefore, you cannot have a theory that is decisive on mixed infinite populations, insensitive to arbitrary labeling, *and* sensitive to finite individual changes. One must be dropped.

  ***

  ### III. The Most Excluding Requirement

  **Finite Sensitivity** does the most excluding work.

  While Decisiveness is the most *demanding* functionally, Finite Sensitivity is the most *restrictive* mathematically. It immediately rules out all standard "Limit" and "Average" views, which constitute the majority of proposed solutions to infinite aggregation. These views rely on convergence, and convergence by definition ignores finite perturbations.

  Satisfying Finite Sensitivity in an infinite context forces a theory to adopt non-standard mathematical tools (such as ultrafilters or hyperreal numbers). These tools, in turn, tend to break Anonymity (by requiring a specific ordering to define the filter) or Transitivity. Thus, insisting that a single added life must change the value of an infinite world eliminates the largest class of otherwise plausible, mathematically tractable theories.

  ***

  ### IV. Brief Scorecard of Broad Families

  *   **Sum-like / Totalist Orderings:**
      *   **Fail:** Anonymity and Decisiveness.
      *   **Reason:** Infinite sums of positive values all equal infinity ($\infty = \infty$), yielding no verdict (Case 4). If values are mixed positive/negative, sums depend on order, violating Anonymity (Case 5).
  *   **Person-Affecting / Pairwise-Comparison Views:**
      *   **Fail:** Decisiveness and Pareto.
      *   **Reason:** In infinite populations, few individuals exist in both worlds being compared. If no specific individual is made better off (because the populations are disjoint or shifted), these views often return "incomparable" or "neutral," failing Case 1 and Case 4.
  *   **Limit, Average, or Finite-Approximation Views:**
      *   **Fail:** Finite Sensitivity.
      *   **Reason:** As derived above, limits of partial averages ignore finite changes (Case 2). They also often fail Bidirectional Consistency (Case 7) because standard limits require a starting point to expand from.
