      *Revised Plan:*
      1.  **Implication of the Distinction (Feedback vs. Acceptance):** Measurement is intervention.
      2.  **Implication of the Conclusion (Race is tractable):** Potential path to obsolescence, but high risk.
      3.  **Synthesis/Recommendation:** Collect data to dismantle the loop, not to reify the kind.

