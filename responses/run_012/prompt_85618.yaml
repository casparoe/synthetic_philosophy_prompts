answer: |-
  The concept you are describing is a **Load-Bearing Fiction**.

  While there are adjacent concepts in sociology and economics, none capture the specific combination of falsehood, structural dependency, and irreversibility that you observed. "Path dependence" explains the *mechanism* of why you can't go back, and "institutional fact" explains *how* a statement becomes real within a bureaucracy, but neither inherently accounts for the *falsehood* at the core. A Load-Bearing Fiction is a specific pathological state where a lie transitions from being a statement about reality to being a structural component of the organization.

  ### Definition
  A **Load-Bearing Fiction** is a falsehood that has been integrated into the operational infrastructure of an organization to the point where correcting it would cause systemic collapse.

  It is not merely a lie that persists; it is a lie that has acquired utility. It stops functioning as a deception and starts functioning as a foundation. The truth value of the statement becomes irrelevant because its *structural value* (its ability to support budgets, plans, and hierarchies) outweighs its empirical value.

  ### Why existing terms don't fit
  *   **Lie:** A lie is an act of deception. A Load-Bearing Fiction is a state of being. A lie can be retracted; a Load-Bearing Fiction cannot be removed without damaging the structure it supports.
  *   **Self-Fulfilling Prophecy:** In a self-fulfilling prophecy, belief causes the event to happen (e.g., "This bank is solvent" prevents a run, keeping it solvent). In a Load-Bearing Fiction, the event *did not* happen, but the system acts as if it did. The belief isn't what matters; the *paperwork* is. The contract wasn't bid, but the budget assumes it was. The fiction doesn't make the bid happen; it makes the budget valid.
  *   **Sunk Cost / Doubling Down:** These describe psychological or financial commitment. They explain *why* someone keeps lying, but not *why the lie becomes uncorrectable*. You can double down on a lie that nobody believes and nobody uses. A Load-Bearing Fiction is uncorrectable because *other people* are using it to do their jobs.
  *   **Institutional Fact:** (John Searle's concept). This is the closest established theory. An institutional fact is something true only because we agree it is true (e.g., "This is money," "He is the Mayor"). However, Institutional Facts are usually legitimate status functions. A Load-Bearing Fiction is a *corrupted* Institutional Fact—it claims a status function (e.g., "This contract is compliant") that it did not earn, but the institution recognizes anyway.

  ### Where the concept stops applying (Boundaries)
  To qualify as a Load-Bearing Fiction, the falsehood must meet three criteria. If it fails any of these, it is a different phenomenon:

  1.  **Structural Dependency:** There must be tangible work, resources, or planning built on top of the claim.
      *   *Not a Load-Bearing Fiction:* A manager tells a lie about an employee's performance, and the team repeats it at lunch. (This is **Gossip** or **Lore**).
      *   *Load-Bearing Fiction:* The lie is entered into the HR file, affecting payroll, which affects the department budget, which affects the city's fiscal forecast.
  2.  **Correction Cost:** Removing the lie must threaten the stability of the system built upon it.
      *   *Not a Load-Bearing Fiction:* A lie is repeated in three emails, but correcting it would just require sending a fourth email. (This is **Misinformation**).
      *   *Load-Bearing Fiction:* Correcting the lie would invalidate a contract, require returning funds, or expose the organization to liability.
  3.  **Operational Utility:** The fiction must be "cleaner" or more useful than the truth.
      *   *Not a Load-Bearing Fiction:* A lie that creates more work for everyone to maintain. (This is **Bureaucratic Inefficiency**).
      *   *Load-Bearing Fiction:* The lie simplifies the narrative, allowing the department to move forward without auditing the messy past. The fiction is *more functional* than the truth.

  ### Why the liar ends up serving it
  This is the defining characteristic of the Load-Bearing Fiction. In the beginning, the liar owns the lie. By the end, the lie owns the liar.

  Because the fiction is now load-bearing, the original liar becomes the **custodian of the structural integrity**. If they admit the truth, they aren't just confessing a mistake; they are demolishing a wall that other departments are leaning on. They are no longer protecting themselves; they are protecting the vendors who hired staff, the other departments who wrote memos, and the public narrative that was sold. The lie becomes a public good (stability), and the truth becomes a public hazard (chaos).

  ### Summary
  You are describing the moment a lie undergoes **reification**. It stops being a statement and becomes a thing. It is not a "lie" anymore because it is no longer answerable to reality; it is answerable to the budget. It is a **Load-Bearing Fiction**.
