answer: |-
  To determine whether jaywalking ordinances constitute a genuine convention or merely prudence dressed as duty, we must first subject their origins to the Lewisian test. On David Lewis's account, a convention is an arbitrary regularity that solves a recurring coordination problem, sustained by mutual expectations of conformity and a shared preference for coordinating over not coordinating. Crucially, the regularity must be arbitrary in the sense that the community would have been equally content with a different solution had they settled on it instead, and the pressure to conform is conditional upon the expectation that others will do the same. Given the historical premises you have provided, the jaywalking ordinances of the 1920s fail this test at their inception. They were not the spontaneous emergence of a solution to a problem faced equally by pedestrians and drivers; rather, they were the imposition of a regularity by motor clubs to resolve a conflict of interest in favour of the motorist. Pedestrians did not necessarily prefer crossing at corners to crossing mid-block; they were coerced into this regularity by law and by the physical threat of faster traffic. Because the practice served the interests of one party rather than solving a coordination problem for everyone on equal footing, it lacks the mutual benefit that grounds the bindingness of a Lewisian convention. It was, initially, a coercive equilibrium, not a convention.

  This brings us to the second question: what did these ordinances actually do to the people they addressed? Here, Cristina Bicchieri's distinction between empirical and normative expectations, alongside H.L.A. Hart's concept of the internal point of view, proves more illuminating than Lewis's. Over time, the imposed regularity may have calcified into a social norm. If pedestrians now cross at corners not merely because they fear cars (empirical expectation) but because they believe others think they ought to and would resent deviation (normative expectation), then a Bicchieri-style norm exists. The shouting stranger in Chicago evidences this resentment; they are enforcing a normative expectation. However, Hart's requirement for a rule to exist is that members of the community adopt the internal point of view, treating the rule as a standard for criticism rather than merely a prediction of punishment. On a six-lane arterial at rush hour, the internal point of view is likely conflated with prudence; pedestrians criticise mid-block crossing because it is dangerous, not necessarily because it is wrong. On a quiet residential street at midnight, however, where the risk is negligible, the persistence of the rule suggests something else. If pedestrians still feel a tug of obligation there, it is because the norm has been internalised. Yet, if they view the rule merely as a legal technicality to be ignored when safe, then the ordinance created only a legal duty with no moral force, effectively raising the price of an act that was already foolish only when traffic moved fast. The ordinance successfully manufactured a normative expectation, but whether it created a moral obligation depends on whether the internal point of view was adopted voluntarily or merely endured as a cost of doing business in a car-dominated city.

  Consider now the visitor from a country without jaywalking laws. When told to go to the corner, what do they owe to that practice? We must distinguish carefully between the duties at play. They undoubtedly owe it to themselves to avoid real risk; on a busy arterial, prudence dictates conformity regardless of obligation. They may owe courtesy to drivers and other pedestrians who are operating under the expectation of corner-crossing, as violating this expectation creates uncertainty and friction. However, the question of fairness is trickier. Fairness usually obliges us not to free-ride on a cooperative scheme from which we benefit. If the scheme is mutually beneficial—say, it genuinely reduces accidents for everyone—then fairness demands compliance. But if the scheme primarily privileges cars over pedestrians, as the history suggests, the visitor is not free-riding on a cooperative benefit but submitting to a hierarchy. Therefore, there is no genuine obligation arising simply from participation in the shared practice if the practice itself is unjustly weighted. The visitor owes caution and perhaps courtesy to avoid startling others, but they do not owe a moral duty to comply with a norm that treats them as a trespasser on public space merely for walking efficiently. The shouting stranger imposes a social cost, but not necessarily a moral one.

  Finally, what does this case do to the framework? It exposes a significant gap in the Lewisian picture. Lewis assumes conventions arise to solve coordination problems where parties are roughly indifferent between solutions. The jaywalking case demonstrates that regularities can acquire normative force without ever having been a coordination equilibrium in the Lewisian sense. Power dynamics can impose a regularity which, over time, generates the empirical and normative expectations Bicchieri describes, mimicking a convention without the foundational mutual benefit. The tools run out if we ask whether such manufactured norms are morally binding; Lewis tells us they are not conventions, and Bicchieri tells us they are norms, but neither fully resolves the moral weight of a norm born of coercion. Hart's internal point of view helps distinguish those who accept the rule from those who merely obey it, but it does not tell us whether the rule *ought* to be accepted. The case confirms that while Lewisian conventions are binding because they are useful solutions to common problems, 'conventions' born of power are binding only insofar as the power persists or the norm is successfully internalised as safety. It suggests that not all social regularities that look like conventions are morally equivalent; some are merely prudence dressed up as duty, enforced by resentment rather than reason.

  Verdict: Manufactured Normativity. The ordinances created a legal duty and a social expectation, but not a genuine moral obligation independent of safety concerns. Where the coordination problem vanishes, so too does the duty, revealing the rule as prudence dressed in regulatory clothing.
