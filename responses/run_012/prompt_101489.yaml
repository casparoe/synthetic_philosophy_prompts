answer: |-
  This is fundamentally a disagreement about the point of the concept masquerading as a semantic dispute, where progress requires abandoning the search for a single correct semantics in favor of distinguishing the diverse normative functions knowledge ascriptions serve.

  The stalemate persists because each camp prioritizes a different functional role for "knowledge" while claiming to describe the same semantic object. Classical Invariantists treat knowledge as a credential for belief-storage and theoretical reasoning, prioritizing stability and independence from practical contingency. Contextualists and Relativists treat it as a tool for conversational coordination, prioritizing the flexibility needed to manage information flow between speakers. Subject-Sensitive Invariantists (SSI) treat it as a license for action, prioritizing the link between epistemic status and practical rationality. When you observe that all camps agree on the case intuitions but disagree on the explanation, you are seeing them agree on the *phenomena* (speakers hesitate in high-stakes bank cases) but disagree on whether that hesitation reveals a shift in *truth conditions* (SSI/Contextualism) or a shift in *assertibility conditions* distinct from knowledge (Invariantism). The dispute is not verbal in the trivial sense that they mean different things by "knows," but in the deeper sense that they are optimizing for different theoretical virtues derived from conflicting views on the concept's purpose.

  Your two cases expose this functional split precisely because each camp will declare them relevant or irrelevant based on their functional commitment. In the **unaware stakes case** (where the subject faces high stakes but is ignorant of them), Classical Invariantists will declare the stakes irrelevant to knowledge, maintaining that knowledge depends only on evidence and truth; for them, the case confirms that knowledge is a psychological state independent of practical environment. SSI proponents, however, must argue this case is crucial: if knowledge norms action, and the action is risky, the subject arguably lacks knowledge even if unaware, or else knowledge fails to track practical rationality. If SSI admits the subject knows despite high stakes, they sever the link between knowledge and action; if they deny knowledge, they make knowledge opaque to the subject. Contextualists will sidestep this by locating the stakes in the *attributor's* context, rendering the subject's ignorance irrelevant to the truth of the ascription but relevant to the subject's rationality. The symptom of the deeper dispute is that Invariantists dismiss this case as conflating knowledge with rational action, while SSI treats it as a decisive test of whether knowledge is action-guiding.

  In the **diachronic disagreement case** (where past low-stakes self vs. present high-stakes self disagree on whether knowledge obtained), Relativism offers the most coherent semantic handling by allowing the truth of the past ascription to shift with the current context of assessment; this treats knowledge as a norm subject to retrospective evaluation. Classical Invariantists will declare the present self's doubt irrelevant to the past fact, treating knowledge as a historical property fixed by past evidence. SSI faces a dilemma: if knowledge depends on stakes at the time of action, the past self knew; if it depends on stakes at the time of assessment, the past self did not. Here, the refusal to accept the case as decisive is the symptom: Invariantists see the Relativist's "retraction" as a change in conversational context, not a correction of truth, while Relativists see the Invariantist's stability as failing to capture the normative force of admitting error. Each side dismisses the other's handling of the case because one views knowledge as a fact about the past (Invariantism) and the other as a current license to rely (Relativism/SSI).

  Distinguishing the proposition expressed from the proposition used to assess (the Relativist move) clarifies the logical space but does not resolve the normative clash. It shows that Contextualism and Invariantism can be modeled as compatible with the same data if we separate content from truth-evaluation, but it leaves open why we should prefer one semantic framework over another. This distinction reveals that the Invariantist is often defending the *content* of knowledge claims (what is believed), while the Encroacher is defending the *normative status* of those claims (whether one is justified in acting on them). Once separated, it becomes clear that the "genuine first-order disagreement" is illusory; the real conflict is whether the word "knows" should be semantically tied to the norm of action or the state of belief.

  Consequently, no progress should be expected from empirical studies of usage or formal semantic results. Experimental philosophy has already shown that intuitions vary by culture and context, which merely fuels the Contextualist/Relativist fire without settling the normative question. Formal results will only codify the existing stalemate in clearer logic. Progress requires a **change of question**: we must stop asking "What is the semantics of 'knows'?" and start asking "Which semantic model best serves the specific normative function we want 'knowledge' to perform in this context?" This is a move toward conceptual engineering. We should expect not a unified theory of knowledge, but a pluralistic account where "knowledge" serves distinct roles in theoretical inquiry versus practical deliberation, and the debate shifts to determining when each role is dominant. Until philosophers admit they are arguing over which function should dominate the semantics, rather than what the semantics *are*, the impasse will remain.
