  Alright, so I've been going back and forth with a friend about Moore's paradox and I want to nail down where I actually stand before I say anything else dumb in seminar. Here's my package. (1) Sentences like "it's raining, but I don't believe it's raining" are absurd, but they aren't self-contradictory — it can be raining and me not believing it, so the thing is perfectly capable of being true. (2) The absurdity is pragmatic rather than semantic: saying the first half commits me to believing it's raining, and the second half takes that back, and that's the whole story. (3) Assertion is governed by a knowledge norm — you should only assert what you know. (4) The weirdness is essentially first-personal and present-tense; "it's raining but Jane doesn't believe it" is completely fine, so whatever is doing the explaining has to be about the speaker and not about Jane. (5) Belief isn't under my voluntary control — I can't just decide to believe something — and yet I also think belief is a norm-governed state, one that aims at truth and can be criticized for falling short of it. (6) I want a single explanation to cover the whole family here: both the omissive form, "P but I don't believe P," and the commissive one, "P but I believe not-P," and also the cases where the absurdity turns up in a private thought or in a belief I just hold, not only in what I say out loud.

