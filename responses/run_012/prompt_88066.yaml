      *   *Resolution:* Distinguish between "logical prerequisites of agency" (hard constraints) and "contingent world-pictures" (soft constraints). The account must allow the riverbed to move, but not *everywhere* at once.

  7.  **Identifying the "Killer" Requirement:**
