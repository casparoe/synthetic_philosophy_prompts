answer: |-
  This is a structural request. You are asking for the architectural specifications of a theory of "hinge commitments" (to use a later term for your "frame convictions") without asking for the building itself. Below is the specification of what such an account must achieve to be adequate to the phenomena you describe, followed by the analysis of the specific cases and the meta-requirements you requested.

  ### I. General Requirements for an Adequate Account

  To account for frame convictions, a theory must satisfy the following conditions.

  **1. The Condition of Non-Evidential Certainty**
  *   **Requirement:** The account must explain how a conviction can be held with maximum subjective certainty while lacking empirical evidence or logical proof.
  *   **Forcing Consideration:** If these convictions were evidential, they would be vulnerable to counter-evidence. But you note they are the *frame* within which evidence is weighed. To treat them as hypotheses is to misunderstand their function; they make the testing of hypotheses possible.

  **2. The Condition of Agency-Constitution**
  *   **Requirement:** The account must show how these convictions constitute the agent rather than merely describing the world.
  *   **Forcing Consideration:** You note that doubting your own reasoning uses the faculty under doubt. This suggests these convictions are not just "things I believe" but "ways I am." An account that treats them as ordinary beliefs fails to explain why abandoning them feels like a loss of self or sanity rather than a change of opinion.

  **3. The Condition of Practical Primacy**
  *   **Requirement:** The account must locate the certainty in action (or the disposition to act) rather than solely in propositional assent.
  *   **Forcing Consideration:** As in your bridge case (d), we often act with a certainty we do not verbally affirm. If the account focuses only on explicit belief, it cannot explain the certainty displayed in unhesitating action.

  **4. The Condition of Diachronic Fluidity**
  *   **Requirement:** The account must allow for frame convictions to change over time without rendering the previous frame "irrational."
  *   **Forcing Consideration:** History shows that what was once a frame (e.g., "the sun revolves around the earth") becomes a doubt, and vice versa. If the account treats frames as eternal logical necessities, it cannot explain historical change. If it treats them as mere whims, it cannot explain their stability.

  **5. The Condition of Normative Friction**
  *   **Requirement:** The account must provide a criterion for distinguishing between a frame that *should* be challenged and one that *should not*.
  *   **Forcing Consideration:** Your practical aim. If all frames are equally solid, you cannot distinguish education from violence. If some frames are "false," you need a vantage point outside all frames to judge them, which the account denies exists. The theory must find a middle ground.

  ---

  ### II. Handling the Specific Cases

  Here is what the account must deliver for each of your worry-cases.

  **(a) Cultural Variability (Dreams vs. Memory)**
  *   **Must it handle it?** Yes.
  *   **What it must deliver:** It must distinguish between *universal hinges* (necessary for any language game or agency, e.g., "objects persist") and *local hinges* (contingent on a form of life, e.g., "ancestors speak in dreams").
  *   **The Trap:** It cannot simply assert your memory is "true" and their dreams "false" without begging the question. It must show that your memory claim is a precondition for *any* testimony (including theirs), whereas theirs is a specific interpretation of testimony. If it treats them on all fours, it collapses into relativism where no critique is possible.

  **(b) Hardening and Loosening (The Riverbed)**
  *   **Must it handle it?** Yes.
  *   **What it must deliver:** A mechanism for "sedimentation" (how a hypothesis becomes a rule) and "erosion" (how a rule becomes a hypothesis). Crucially, regarding improvement: It must say that change is not always rational progress. Sometimes a frame shifts due to trauma, power, or exhaustion. The account must allow for *pathological* frame shifts, otherwise it cannot explain why we sometimes try to restore an old certainty.

  **(c) Self-Referential Capacities**
  *   **Must it handle it?** Yes.
  *   **What it must deliver:** An explanation of *performative incoherence*. The account must show that doubting the tool of doubt is not a logical contradiction (like $A \land \neg A$) but a practical impossibility. It must locate the certainty in the *use* of the faculty, not a belief *about* the faculty.

  **(d) Belief vs. Action (The Bridge)**
  *   **Must it handle it?** Yes.
  *   **What it must deliver:** It must prioritize *certainty-in-action* over *certainty-in-assertion*. If the account locates the frame in what we say, it fails this case. It must conclude that the "frame" is primarily a pattern of behavior. The consequence is that you cannot change a frame merely by arguing; you must alter the conditions of action.

  **(e) Incompatible Frames (Authority vs. Power)**
  *   **Must it handle it?** Yes.
  *   **What it must deliver:** A description of *impasse*. The account must explain why argument fails here without declaring one party irrational. It should characterize this as a clash of "forms of life" or "epistemic territories." It must deliver a verdict on whether these are truly incompatible frames or merely different weightings of the same frame (e.g., both value truth, but weigh sources differently). If it cannot distinguish these, it makes all disagreement intractable.

  **(f) Acquisition (The Child)**
  *   **Must it handle it?** Yes.
  *   **What it must deliver:** An explanation of *initiation* that is not *induction*. The child does not infer the frame from evidence; the child is trained into a practice where the frame is the rule. The account must avoid circularity by grounding the acquisition in biological/developmental necessity or social conditioning, not rational persuasion.

  ---

  ### III. Meta-Analysis of Requirements

  #### 1. Non-Negotiable vs. Preference

  **Non-Negotiable (The account fails without these):**
  *   **Non-Evidential Status:** If the account tries to find evidence for frames, it misunderstands their logical role.
  *   **Practical Primacy:** If the account ignores action (Case d), it cannot explain the stability of the frame.
  *   **Diachronic Fluidity:** If the account makes frames eternal, it contradicts history. If it makes them too fluid, it contradicts the experience of certainty.

  **Preference (Camps may differ here):**
  *   **Propositional vs. Non-Propositional:** Some accounts insist frames are propositions we cannot doubt; others say they are non-cognitive animal certainties. Both can work if they meet the Non-Evidential and Practical Primacy requirements.
  *   **Individual vs. Social:** Whether the frame resides in the individual mind or the community practice. (Though a purely individual account struggles with Case (a) and (f)).

  #### 2. Incompatible Requirements (The Tension)

  **The Pair:** **The Condition of Normative Friction** vs. **The Condition of Non-Evidential Status.**

  *   **The Conflict:**
      *   *Normative Friction* requires you to say when a frame is "bad" or "dangerous" (to answer your practical aim about violence).
      *   *Non-Evidential Status* says frames cannot be judged by evidence or reason, because they *are* the standard for evidence and reason.
      *   If you cannot judge frames by reason, on what basis do you call one "violent" or "irrational"? If you *can* judge them, they aren't truly frame convictions; they are just strong beliefs.

  *   **Which has to give?**
      *   **Normative Friction must be modified.** An adequate account cannot promise a "view from nowhere" to judge frames. It must admit that judging another's frame is always done from *within* your own frame.
      *   **Resolution:** The account must define "violence" not as "irrationality" (which implies an objective standard) but as "coercive disruption of agency." You can identify violence pragmatically (does this destroy their ability to act?) without claiming epistemic superiority. The requirement for an *objective* verdict on improvement (Case b) must be dropped in favor of a *pragmatic* verdict.

  #### 3. The "Killer" Requirement

  **The Requirement:** **The Condition of Non-Evidential Status (specifically: Unjustifiability).**

  *   **What it Rules Out:** It rules out **Classical Foundationalism** and **Evidentialism**.
  *   **Why:** Foundationalism seeks a base of beliefs that are self-justifying or indubitable *by reason*. Evidentialism holds that belief should be proportional to evidence. Your frame convictions are neither self-justifying (they are circular) nor supported by evidence (they make evidence possible).
  *   **Impact:** This requirement kills the idea that "rationality" equals "having reasons for everything." It forces the account to accept that the ground of rationality is itself arational (not irrational, but prior to reason).

  #### 4. Unjustified vs. Unjustifiable

  **The Distinction:**
  *   **Unjustified:** There *is* a justification available, but the holder lacks it. (Implies the holder is negligent or irrational).
  *   **Unjustifiable:** There is *no* justification available within the system. (Implies the conviction is structural).

  **The Commitment:**
  *   The account is committed to **Unjustifiable**.
  *   **Reason:** If the convictions were merely *unjustified*, you could theoretically supply the reason. But you noted that trying to justify them leads to circles. The circle indicates a structural limit, not a lack of effort. To call them "unjustified" is to treat them as failed hypotheses. To call them "unjustifiable" is to recognize them as the rules of the game.
  *   **Practical Consequence:** If they are unjustifiable, calling someone "irrational" for holding them is indeed name-calling (unless they violate their *own* frame). However, you can still call a frame "destructive" based on its consequences for human flourishing, without claiming it is "false."

  ### IV. Summary for Your Practical Aim

  To answer your underlying purpose: *When is it violence to shake a frame?*

  Based on these requirements, an adequate account yields this heuristic:

  1.  **Identify the Function:** Is the conviction functioning as a hypothesis (open to evidence) or a hinge (constitutive of agency)?
  2.  **Test for Agency:** If removing this conviction renders the person unable to act or speak within their form of life, challenging it is **violence** (disabling the agent).
  3.  **Test for Fluidity:** If the conviction is a "local hinge" (Case a) that causes harm to others or the holder without being necessary for agency, it may be challenged, but not by *evidence*. It must be challenged by **offering a new form of life** (Case b/f) where a different hinge holds.
  4.  **Avoid the Trap:** Do not call the frame "irrational." Call it "incompatible with the practice we are trying to share."

  The account must tell you that you cannot argue someone out of a frame; you can only invite them into a practice where that frame no longer does the work it used to do. To attempt the former is violence; to attempt the latter is persuasion.
