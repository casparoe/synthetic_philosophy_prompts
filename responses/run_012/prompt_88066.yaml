      *(Refining the "Violence" aspect)*: The user wants to know when challenging a frame is violence. The account must define the *function* of the frame. If the frame is a precondition for the interlocutor's agency, removing it is disabling (violence). If it's a contingent sediment, removing it is education. The requirements need to reflect this distinction.

