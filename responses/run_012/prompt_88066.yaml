      *   *Requirement 2: Action-Guiding.* They must explain why we act with certainty even without proof. *Why?* To distinguish from mere theoretical assent.
      *   *Requirement 3: System-Relative.* They define the logic of the system they inhabit. *Why?* To explain why internal doubt is nonsensical.
      *   *Requirement 4: Diachronic Flexibility.* They must allow for change over time. *Why?* Because history shows frames shift (e.g., geocentrism).

  4.  **Addressing the Specific Cases (a-f):**
      *   *(a) Cultural Variability (Dreams vs. Memory):* The account must distinguish between *structural* hinges (necessary for *any* agency) and *substantive* hinges (cultural). If it treats them exactly alike, it leads to relativism. If it distinguishes them, it needs a non-question-begging criterion.
      *   *(b) Hardening/Loosening:* Needs a mechanism for "sedimentation" and "erosion." Must address normativity (is the change *better*?).
      *   *(c) Self-Referential Capacities:* Needs to handle performative contradiction. Doubting reason using reason is incoherent.
      *   *(d) Belief vs. Action (The Bridge):* Suggests certainties are embodied/practical, not just propositional. The account must prioritize *use* over *assent*.
      *   *(e) Incompatible Frames:* Needs a way to describe disagreement that isn't just "you're wrong." Is it translation failure? Clash of values?
      *   *(f) Acquisition (The Child):* Needs to explain learning without evidence (ostensive training, conditioning). Avoids circularity by appealing to initiation into a practice.

  5.  **Evaluating Constraints (Non-negotiable vs. Preference):**
      *   *Non-negotiable:* Must explain the *function* of the certainty (enabling doubt). Must explain the *lack of justification* without calling it ignorance. Must account for *action*.
