      *   *Transitivity:* If $A > B$ and $B > C$, then $A > C$.
      *   *The "Better Than" Relation:* Is it strict partial order? Does it allow for incomparability?
      *   *Incomparability/Parity:* Is there a fourth relation (parity) or just trichotomy (better, worse, equal)?
      *   *Money Pumps:* The standard pragmatic argument against intransitivity. If preferences are intransitive, you can be pumped for money.
      *   *Vagueness/Epistemicism:* The Transitivist often leans on the idea that there *is* a sharp cutoff, we just don't know where (epistemicism) or that the terms shift meaning (equivocation).

  3.  **Drafting the Agreed Claims (The Common Ground):**
      *   Need to define the spectrum clearly so they aren't arguing about different cases.
