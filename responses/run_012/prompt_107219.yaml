      *   *Cycle vs. Gap:* Intransitivity usually implies a cycle ($A>B, B>C, C>A$) OR a failure of ordering (incomparability). The prompt asks to distinguish these. A spectrum argument usually aims at intransitivity ($A_1 > A_2 > ... > A_n$ but not $A_1 > A_n$) OR incomparability at some point.
      *   *Refinement:* Let's ensure they agree that a failure of transitivity in "better than" implies a failure in "at least as good as" unless incomparability is invoked.

  4.  **Drafting the Disagreements Table (The Cruxes):**
      *   *Crux 1: The location of the break.* Transitivist says there's a sharp break (or meaning shift). Intransitivist says the break is the accumulation of small losses.
      *   *Crux 2: Money Pumps.* Transitivist says intransitivity leads to irrational exploitation. Intransitivist says money pumps assume a choice context that doesn't apply to spectrum cases (or that they'd accept the loss to avoid violating the spectrum intuition).
      *   *Crux 3: Parity/Incomparability.* Is "on a par" a real relation? Transitivist says no (it's ignorance or equality). Intransitivist says yes (it explains the lack of transitivity without cycles).
      *   *Concrete Tests:* Need specific thought experiments. The "Money Pump" is the classic one. The "Sorites of Lives" is the other.

