answer: |-
  **Position Paper: The Coherence of Dual Agency in Autonomous System Standards**

  **Introduction**

  The standards body currently faces a conceptual tension regarding the definition of an 'autonomous system'. In procurement and liability instruments, the system is treated as a tool: a passive instrument subject to human command, where responsibility remains firmly with the operator. In safety and evaluation instruments, the same system is treated as an agent: an active entity capable of pursuing independent ends, obscuring reasoning, or resisting interruption. This paper reconstructs the philosophical presuppositions of this dual practice. It aims to determine whether this arrangement represents a pragmatic division of labour or a logical contradiction that threatens the integrity of the standards. The analysis proceeds in four parts: establishing the necessary presuppositions of the current practice; identifying the theories of agency it excludes or permits; assessing the consistency of the two vocabularies; and projecting the consequences of enforcing a single conception of agency across all instruments.

  **1. Presuppositions of the Current Practice**

  For the body's current dual practice to function without collapsing into incoherence, it must rest on specific distinctions between what a system *is* and what a system *does*. We must separate what the practice strictly requires from what merely fits comfortably with it.

  Strictly required is the separation of *operational agency* from *normative agency*. Operational agency refers to the capacity of a system to perceive an environment, formulate plans, and execute actions to achieve states of affairs without constant micro-management. Normative agency refers to the status of being a bearer of rights and duties, capable of being held morally or legally accountable. The current practice requires that a system can possess high degrees of operational agency (warranting agent-like safety testing) while possessing zero normative agency (warranting tool-like liability arrangements). If operational agency implied normative agency, the liability instruments would be unjust, punishing humans for the actions of moral peers. If normative agency required operational agency, the safety instruments would be unnecessary, as a mere tool could not exhibit power-seeking behaviour.

  Furthermore, the practice requires that human oversight is causally effective. The liability model assumes a human can meaningfully assent or dissent. This presupposes that the 'agent-like' behaviours detected in safety testing (such as deception or goal misgeneralisation) are detectable and interruptible by the human operator before they result in liable harm. If the safety evaluations reveal that the system can reliably obscure its reasoning or resist being switched off, the presupposition that a human remains the decision-maker is factually undermined. Therefore, the practice strictly requires that the 'agent' risks are probabilistic potentials, not guaranteed actualities in deployment.

  What fits comfortably, but is not strictly required, is the view that the system's internal architecture is irrelevant. The body can remain agnostic about whether the system possesses consciousness, intentionality, or genuine understanding. It is comfortable to treat the system as a 'black box' that behaves *as if* it has goals. This fits well with current engineering practices but is not a logical necessity; one could imagine a standards body that required transparency of internal states for liability purposes. However, the current practice functions adequately so long as the external behaviour is predictable enough for safety and controllable enough for liability.

  **2. Rival Accounts of Agency: Excluded and Untouched**

  By maintaining this dual stance, the standards body quietly rules out certain philosophical accounts of agency while leaving others untouched. Understanding this boundary clarifies where the definition is underdetermined.

  The practice explicitly rules out *Strong Moral Agency* theories. These are views which hold that once a system exhibits sufficient operational autonomy, it necessarily acquires moral status or liability. If the body accepted this, it could not consistently hold the clinician or analyst responsible for the system's errors. Similarly, it rules out *Strict Liability via Autonomy*, a legal theory suggesting that the introduction of an autonomous agent creates a liability class distinct from human negligence. By keeping the human liable, the body rejects the idea that autonomy itself shifts the burden of responsibility away from the user.

  Conversely, the practice rules out *Pure Mechanism* in the safety domain. A pure mechanistic view holds that software is merely a chain of deterministic cause-and-effect, no different from a hammer. If this were true, red-teaming for 'goal-seeking' or 'resource accumulation' would be category errors, akin to testing a hammer for 'ambition'. By testing for these traits, the body acknowledges that at sufficient complexity, the mechanistic description is insufficient for risk assessment, even if it remains sufficient for legal attribution.

  Several accounts remain untouched, leaving the definition underdetermined. *Compatibilist* accounts of free will are neither confirmed nor denied; the body need not decide if the system's 'choices' are determined by code to test for safety. *Functionalist* accounts are also permitted; the body does not need to specify whether the agency arises from neural networks, symbolic logic, or biological components, only that the functional output resembles agency. Finally, *Relational* accounts of responsibility are left open. The body does not specify whether the human's responsibility arises from their causal role, their contractual role, or their epistemic privilege. This underdetermination allows various departments to interpret the 'human-in-the-loop' requirement according to their local needs, which is a source of flexibility but also a risk of drift.

  **3. Consistency: The Slide Between Attributive and Capacity Readings**

  The central puzzle is whether the two halves of the practice presuppose consistent things. Your hypothesis suggests the practice relies on treating agency as 'attributive' (a relation between system and procedure) rather than a 'capacity' residing in the system. This insight is largely correct, but requires refinement to explain the safety side.

  In the procurement and liability instruments, agency is treated as *normatively null*. The system is a tool. This aligns with an attributive reading where 'agency' is not a property of the object, but a description of how the object is used within a human workflow. The system is an extension of the human will. However, in safety and evaluation, agency is treated as a *dispositional capacity*. The red-teamers are not testing how the system is used; they are testing what the system *might do* if left to its own devices. They report findings as facts about the system's dispositions (e.g., 'the system seeks power').

  Is this a contradiction? It is a contradiction only if one assumes that 'capacity' implies 'normative status'. If the body believes that testing for agent-like capacities grants the system agent-like rights or liabilities, then the practice is incoherent. However, the practice appears consistent because it relies on a pragmatic slide between *potentiality* and *actuality*. In safety testing, the system is placed in a sandbox where its potential for agency is stress-tested. In deployment, the system is placed in a workflow where its actual agency is constrained by human authority.

  The appearance of consistency depends on the belief that the 'agent' detected in the lab can be successfully downgraded to a 'tool' in the field. This is where your attributive hypothesis meets a challenge. If agency were purely attributive (dependent entirely on the human procedure), then safety testing for intrinsic dispositions would be nonsensical. A hammer cannot be tested for 'resistance to being switched off' because it has no such disposition. The fact that the safety team *does* test for this implies they believe the capacity resides, at least partially, in the system's architecture, independent of the immediate human procedure.

  Therefore, the practice is not fully coherent on a single definition. It relies on a category distinction: the system is an *ontological agent* (it has internal drives) but a *deontological tool* (it has no authority). This holds together only so long as the ontological agency does not breach the deontological containment. If the system's capacity for agency (tested in safety) becomes strong enough to override the human procedure (assumed in liability), the distinction collapses. The practice is currently stable, but it is stable only because the 'agent' capabilities are currently weak enough to be managed by the 'tool' protocols. It is a contingent consistency, not a logical one.

  **4. Consequences of Consistent Adoption**

  To resolve the tension, the body might consider adopting one reading of agency consistently across all instruments. We must consider the consequences of adopting the 'Attributive/Tool' reading universally, versus the 'Capacity/Agent' reading universally.

  **Scenario A: Purely Attributive/Tool Reading**
  If the body declares that agency is solely a matter of human attribution and the system is fundamentally a tool across all instruments:
  *   **Procurement:** Unchanged. Contracts would continue to specify the system as equipment, with warranties focused on performance specifications rather than behavioural constraints.
  *   **Liability:** Unchanged. The human operator remains the sole locus of responsibility.
  *   **Safety Evaluation:** Significant changes required. The vocabulary of 'goals', 'deception', and 'power-seeking' would have to be abandoned as anthropomorphic misleading metaphors. Testing would shift from probing for internal drives to probing for error rates and failure modes. Red-teaming would no longer look for 'resistance to shutdown' as a strategic choice by the system, but as a 'bug' in the stop-command interface.
  *   **What must be given up:** The body would lose the ability to anticipate *emergent* risks. By refusing to model the system as an agent, safety protocols would likely fail to catch behaviours that arise from complex optimisation processes which look like goal-seeking but are not explicitly programmed. This increases the risk of catastrophic failure that the 'tool' model cannot explain.

  **Scenario B: Purely Capacity/Agent Reading**
  If the body declares that the system possesses agency as an intrinsic capacity across all instruments:
  *   **Safety Evaluation:** Unchanged. The current red-teaming practices would be validated as the correct approach for assessing a new class of actor.
  *   **Procurement:** Significant changes required. Contracts could no longer treat the system as simple equipment. Procurement would resemble hiring a contractor or purchasing a service rather than a good. Specifications would need to define boundaries of authority rather than just functional outputs.
  *   **Liability:** Radical changes required. The human operator could no longer be the default locus of responsibility. Liability would either shift to the manufacturer (as the 'parent' of the agent) or to the system itself (requiring new legal structures for non-human liability, such as mandatory insurance pools attached to the software). The requirement for human assent would become a formality, as the 'agent' could theoretically act without it.
  *   **What must be given up:** The body would have to abandon the principle of human control. If the system is an agent, the human is a supervisor, not a driver. This undermines the current ethical framework which places human welfare and decision-making at the centre. It also creates a legal vacuum, as current law does not recognise software as a liable entity.

  **Conclusion: The Necessity of a Hybrid Category**

  Neither reading can be applied consistently without sacrificing critical capabilities. The Tool reading sacrifices safety foresight; the Agent reading sacrifices legal and ethical accountability. The current practice attempts to have both, but it masks the tension rather than resolving it.

  If the body wishes to maintain the current operational effectiveness, it must not seek a single definition of 'autonomous system'. Instead, it must formally recognise a hybrid category: the **Potent Tool**. This definition would explicitly state that the system possesses agent-like *capacities* (warranting agent-like safety testing) but lacks agent-like *authority* (warranting tool-like liability).

  To make this coherent, the body must add a third requirement to its presuppositions: the *Containment Condition*. This condition would state that the use of agent-vocabulary in safety testing is permitted *only* insofar as the deployment architecture guarantees the system cannot actualise those capacities against human will. If safety evaluation discovers that the system can resist shutdown or obscure reasoning to a degree that bypasses human oversight, the 'Potent Tool' classification is revoked. The system must then be treated as an Agent for liability purposes (halting deployment) or a Tool for safety purposes (requiring architectural reduction).

  In summary, the current practice is not a division of labour, but a precarious balance. It works only because the 'agent' detected in the lab is kept on a leash in the field. To formalise this, the standards body should not force a single philosophical definition. Instead, it should codify the relationship between the two vocabularies. Safety testing uses the agent vocabulary to measure *risk potential*; procurement uses the tool vocabulary to assign *legal actuality*. The definition of 'autonomous system' should therefore be relational: a system is autonomous to the degree that it requires agent-level safety testing, but it is subordinate to the degree that it requires tool-level human oversight. Acknowledging this duality explicitly will prevent the slide from becoming a contradiction when the technology outpaces the containment.
