prompt: |-
  so I'm writing something on the boundary problem in democratic theory — the circularity where you need a demos to decide anything democratically, but the demos itself has to get decided somehow, so the democratic procedure can't tell you who gets to be part of it — and I want the spec sheet before I commit to a side. what does any theory of who belongs in the demos actually have to deliver? give me the requirements list: the cases it has to get right, the distinctions it can't collapse, the results it can't contradict, and the consideration behind each requirement. mark which ones you think are non-negotiable and which are really just the taste of one camp, and tell me which single requirement does the most work — the one that knocks out the most otherwise tempting answers.

  the cases I keep tripping over: a secession referendum where the boundary of the electorate basically determines the result; a city where long-term residents without citizenship want a vote in municipal elections; outsiders who are seriously affected by a country's climate or trade policy; kids; and future people. add any you think I'm missing.

  two extra things I want folded in. one is a half-baked idea a friend threw at me that I can't shake: any rule for drawing the boundary has to be reflexive, meaning if you turned the rule on the demos it produces, that demos would itself endorse the same rule — otherwise the rule is just picking winners and you've smuggled the answer in at the start. I don't know if that's definately a real constraint or just a clever trap, so treat it as a candidate requirement and tell me what it would cost to accept it and what it would rule out. the other is that I suspect at least two of the requirements on your list can't be satisfied together, and if so I'd rather you state that plainly than paper over it, because I think that tension is the actual content of the problem and there's alot riding on how it gets resolved.

  no need for a scorecard of the usual contenders at the end, I can do that once I trust the list. but if one requirement obviously rules out a whole family of views, say which family and why.
reasoning: |-
  Here's a thinking process that leads to the suggested spec sheet:

  1.  **Deconstruct the Request:**

      *   **Topic:** The Boundary Problem in Democratic Theory (Who constitutes the *demos*?).
      *   **Goal:** Create a "spec sheet" of requirements that any theory of the *demos* must deliver before committing to a side.
      *   **Components:**
          *   Requirements list (cases to get right, distinctions to keep, results not to contradict).
          *   Considerations behind each requirement.
          *   Classification: Non-negotiable vs. Camp-specific taste.
          *   Identify the "Workhorse Requirement" (the one that knocks out the most tempting answers).
          *   Specific Cases to Address: Secession referendums, non-citizen residents, affected outsiders (climate/trade), children, future people. (Plus any missing cases).
          *   Specific Constraint 1: Reflexivity (the *demos* must endorse the rule that created it). Evaluate its cost and what it rules out.
          *   Specific Constraint 2: Incompatibility. Explicitly state if two requirements conflict (the "actual content of the problem").
          *   Format: No scorecard of contenders at the end. Identify which family of views gets ruled out by the workhorse requirement.

  2.  **Initial Brainstorming & Theoretical Landscape:**

      *   *The Core Paradox:* Democracy requires a *demos* to decide, but the *demos* needs to be decided. It's the "constitutive outside" of democracy.
      *   *Standard Solutions:*
          *   All Affected Interests (AAI).
          *   All Subject to Coercion (ASC).
          *   All Citizenship Status (ACS) / *Demos* as pre-political.
          *   Stakeholder Citizenship.
      *   *The Cases:*
          *   Secession: Who votes? The whole country or just the region? (The "Kirchheimer" problem).
          *   Non-citizen residents: Denizens vs. Citizens.
          *   Outsiders: Climate change, trade sanctions (transboundary effects).
          *   Children: Competence vs. interest.
          *   Future People: Non-existence vs. affected interest.
      *   *The Reflexivity Constraint:* This sounds like a stability/legitimacy condition. If the *demos* wouldn't vote for the rule that defines them, is the rule arbitrary?
      *   *The Incompatibility:* Usually between *inclusivity* (AAI) and *feasibility/stability* (bounded community). Or between *self-determination* and *equality*.

  3.  **Drafting the Requirements (The Spec Sheet):**

      *   *Req 1: Non-Arbitrariness.* The boundary can't just be "because we say so." Needs a principle.
      *   *Req 2: Feasibility/Institutionalization.* You can't have a *demos* that can't meet or decide. (Rules out "All Affected" if it means everyone on earth for every issue).
      *   *Req 3: Protection of Fundamental Interests.* The boundary shouldn't leave people subject to coercion without recourse.
      *   *Req 4: Stability/Continuity.* The *demos* can't change so radically every election that there's no "people" to sustain the state.
      *   *Req 5: Reflexivity (The Friend's Idea).* The *demos* must endorse the boundary rule.

  4.  **Refining and Classifying Requirements:**

      *   *Non-negotiable:* Non-arbitrariness, Protection against Coercion (basic legitimacy), Feasibility (logic of decision).
      *   *Camp-specific:* Reflexivity (might be too demanding), Specific scope of "affected" (how much affect?).
      *   *The Workhorse:* Feasibility/Institutionalization often kills the "All Affected Interests" principle in its strong form. Or perhaps the tension between Self-Determination and Equality is the real killer. Let's look closer. The prompt asks for *one* requirement that does the most work. Usually, it's the **Feasibility/Decision-Capacity** requirement. It kills the infinite regress of AAI.
      *   *Wait, let's reconsider the "Workhorse".* The prompt asks for the requirement that knocks out the most *otherwise tempting* answers. "All Affected" is very tempting but often impractical. "All Subject to Coercion" is tempting but hard to define. But the *real* killer is often the **Self-Determination vs. External Accountability** tension. However, framed as a *requirement*, it's likely **Institutional Feasibility**. If the *demos* can't actually assemble or vote, it's not a *demos*.
      *   *Actually, looking at the literature (Goodin, Whelan, Abizadeh):* The biggest tension is usually between the **Principle of Affected Interests** and the **Principle of Self-Determination**.
      *   *Let's select the Workhorse:* **The Requirement of Decisional Capacity (Feasibility).** It kills the strong version of "All Affected Interests" because the "affected" change per issue, making a stable *demos* impossible.

  5.  **Addressing the Specific Cases:**

      *   *Secession:* Tests Self-Determination vs. Integrity of existing state.
      *   *Non-citizen residents:* Tests Coercion vs. Membership.
      *   *Outsiders:* Tests AAI vs. Bounded Community.
      *   *Kids:* Tests Competence vs. Interest.
      *   *Future People:* Tests Representation vs. Existence.
      *   *Missing Case:* **The Global Nomad/Expatriate.** Someone who lives abroad but retains citizenship vs. someone who lives there but doesn't. Also, **The Criminal/Disenfranchised.**

  6.  **Analyzing the Reflexivity Constraint:**

      *   *Idea:* The *demos* created by Rule X must vote for Rule X.
      *   *Cost:* High. It creates a circularity loop. If the initial *demos* is wrong, they might vote to keep themselves exclusive. It privileges the status quo *demos*.
      *   *Rules Out:* Imposed boundaries (decolonization, post-war settlements) where the initial *demos* didn't choose the rule. It makes founding moments impossible.
      *   *Verdict:* It's a *Camp-Specific* taste (Deliberative Democratic legitimacy) rather than Non-negotiable. It's a "clever trap" because it demands democratic validation for the pre-condition of democracy.

  7.  **Identifying the Incompatibility (The "Actual Content"):**

      *   The prompt suspects two requirements can't be satisfied together.
      *   *Candidate:* **Full Inclusivity (AAI)** vs. **Collective Agency (Stability).**
      *   If you include everyone affected (AAI), the *demos* changes every issue, destroying collective agency.
      *   If you fix the *demos* for agency (Stability), you inevitably exclude some affected people (violating AAI).
      *   *Alternative:* **Self-Determination** (We decide who we are) vs. **Democratic Equality** (Everyone coerced must have a say).
      *   *Decision:* The tension between **Boundary Stability** (needed for a functioning state) and **Boundary Sensitivity** (needed for moral legitimacy regarding affected interests). This is the core aporia.

  8.  **Structuring the Output:**

      *   Introduction: Acknowledge the paradox.
      *   The Spec Sheet (Categorized: Non-Negotiable, Camp-Specific).
      *   The Missing Cases.
      *   The Reflexivity Constraint Analysis.
      *   The Incompatibility (The "Hard Truth").
      *   The Workhorse Requirement.
      *   Family of Views Ruled Out.

  9.  **Refining the Content (Self-Correction during drafting):**

      *   *Check:* Did I mark which are non-negotiable? Yes.
      *   *Check:* Did I address the specific cases (secession, denizens, etc.)? Yes, weave them into the requirements.
      *   *Check:* Did I analyze Reflexivity honestly? Yes, highlight the status quo bias.
      *   *Check:* Did I identify the conflict? Yes, Stability vs. Sensitivity.
      *   *Check:* Workhorse? I'll argue for **Decisional Capacity/Stability**. It's the pragmatic hammer.
      *   *Tone:* Analytical, philosophical, direct. No fluff.

  10. **Final Polish:** Ensure the distinction between "Non-negotiable" (logical/moral prerequisites for *any* democracy) and "Camp Taste" (normative preferences of specific schools like cosmopolitanism vs. republicanism) is clear. Ensure the "Incompatibility" is stated plainly as requested.

      *(Self-Correction on Workhorse)*: Actually, the **Principle of Affected Interests** is often the *tempting* answer that gets knocked out. So the requirement that knocks it out is **Institutional Continuity**. I need to phrase the requirement so it's the *constraint* that does the knocking. Let's call it **The Requirement of a Stable Agent**.

      *(Self-Correction on Reflexivity)*: Be careful not to dismiss it entirely. It's a strong legitimacy test, but logically problematic for *foundings*.

      *(Self-Correction on Incompatibility)*: Make sure to name the two conflicting requirements clearly.

      *(Missing Cases)*: Add "The Dispersed Diaspora" (voting from abroad) and "The Temporarily Incapacitated" (coma, etc. - challenges competence). Let's stick with **The Expatriate** as it mirrors the Denizen case.

      *(Family Ruled Out)*: Strong Cosmopolitan Democracy or Radical Issue-Based Demoi.

      *Let's write.*
answer: |-
  Here is the spec sheet for the Boundary Problem. It is designed to stress-test any theory of the *demos* before you buy into it.

  ### I. The Requirements List

  These are divided into **Non-Negotiable** (logical or moral prerequisites for *any* coherent democratic theory) and **Camp-Specific** (normative preferences that distinguish cosmopolitans from statists, or republicans from liberals).

  #### 1. The Requirement of Non-Arbitrariness (Non-Negotiable)
  *   **The Demand:** The boundary cannot be drawn purely by force, historical accident, or the fiat of the current insiders. There must be a principled reason why *this* group constitutes the *demos* rather than *that* group.
  *   **The Consideration:** If the boundary is purely arbitrary, the resulting "democracy" is merely a oligarchy of luck. It fails the basic test of political legitimacy.
  *   **Cases Addressed:**
      *   *Secession:* Cannot simply say "the current constitution says no." Must explain why the existing border holds moral weight against the secessionists' claim.
      *   *Outsiders:* Cannot ignore climate/trade impacts simply because they live across a line drawn on a map 100 years ago.

  #### 2. The Requirement of Decisional Capacity / Stability (Non-Negotiable)
  *   **The Demand:** The *demos* must be a stable entity capable of forming a will, making a decision, and bearing responsibility for it over time. The membership cannot fluctuate so wildly that collective agency becomes impossible.
  *   **The Consideration:** Democracy requires a "people" to act as the subject of sovereignty. If the *demos* dissolves or radically reconstitutes between Issue A and Issue B, there is no agent to hold accountable.
  *   **Cases Addressed:**
      *   *Outsiders (AAI):* This is the hammer that hits the "All Affected Interests" principle. If everyone affected by a climate policy votes, the *demos* is global. If everyone affected by a zoning law votes, the *demos* is hyper-local. If the *demos* changes every vote, there is no *demos*.
      *   *Future People:* They cannot deliberate or bear responsibility, challenging the capacity requirement.

  #### 3. The Requirement of Protection Against Coercion (Non-Negotiable)
  *   **The Demand:** No one should be subject to binding coercive laws without having some mechanism of input or recourse.
  *   **The Consideration:** This is the core liberal-democratic intuition (no taxation without representation). It prevents the *demos* from becoming a tyranny over a subject population.
  *   **Cases Addressed:**
      *   *Long-term Residents:* If they are subject to local police, taxes, and schools, excluding them violates this.
      *   *Kids:* They are coerced but lack capacity; this requirement forces a theory to explain guardianship or proxy voting.

  #### 4. The Requirement of Reflexivity (Camp-Specific / High Cost)
  *   **The Demand:** The rule used to draw the boundary must be one that the resulting *demos* would vote to endorse.
  *   **The Consideration:** Your friend's idea. It attempts to close the circularity by demanding the *output* validates the *input*.
  *   **The Cost:** It creates a **Status Quo Bias**. An exclusive *demos* (e.g., white male property owners) would likely vote to keep the rule that excludes women and non-property owners. It makes democratic *foundings* and *expansions* logically impossible, because the pre-expansion *demos* would rarely vote to dilute its own power.
  *   **What it Rules Out:** Imposed boundaries (e.g., post-colonial borders, post-war settlements) where the *demos* did not choose the rule. It rules out any theory where the boundary is a moral precondition rather than a democratic choice.
  *   **Verdict:** Treat as **Camp-Specific**. It is a test for *legitimacy stability*, not *moral correctness*. It favors Republican/Communitarian views over Liberal/Cosmopolitan ones.

  #### 5. The Requirement of Epistemic Competence (Camp-Specific)
  *   **The Demand:** Members of the *demos* must possess the cognitive capacity to understand the issues and vote meaningfully.
  *   **The Consideration:** Distinguishes between "interests" (which kids/future people have) and "agency" (which they lack).
  *   **Cases Addressed:**
      *   *Kids:* Excludes them from the *demos* proper, relegating them to protected subjects.
      *   *Future People:* Excludes them entirely, as they have no epistemic presence.
  *   **Verdict:** **Camp-Specific.** Some theories (e.g., stakeholder citizenship) argue interests matter more than competence.

  ---

  ### II. The Missing Cases

  You listed the big five. Here are two more that break specific theories:

  1.  **The Expatriate Citizen:** A citizen who has lived abroad for 40 years, pays no taxes, and is not subject to local coercion, yet retains the vote.
      *   *Why it matters:* It breaks the **Coercion** and **Affected Interest** principles. If a theory says "only those affected/coerced should vote," it must explain why the expat keeps the vote while the long-term resident denizen does not. Most theories fail this; they usually collapse into "Citizenship Status" here, revealing that legal status often trumps moral principles.
  2.  **The Transient Tourist:** Someone present in the territory for 2 weeks, subject to local laws (coercion), affected by local conditions, but with no long-term stake.
      *   *Why it matters:* It tests the **Duration/Stake** threshold. If coercion is enough, tourists vote. If stakes are enough, they don't. Where is the line?

  ---

  ### III. The Incompatibility (The Hard Truth)

  You suspected two requirements cannot be satisfied together. You are right. This is the actual content of the boundary problem.

  **The Conflict:** **Decisional Capacity (Stability)** vs. **Protection Against Coercion (Inclusivity).**

  *   **Side A (Stability):** To have a functioning democracy, you need a bounded, stable *demos* that persists over time (Requirement #2). This requires fixed boundaries (citizenship, residency).
  *   **Side B (Inclusivity):** To be morally legitimate, everyone affected or coerced must have a say (Requirement #1 & #3). Since effects and coercion flow across borders (climate, trade, pollution), the moral boundary is fluid and potentially global.

  **The Result:** You cannot have a *demos* that is both **stable enough to govern** and **inclusive enough to be morally perfect.**
  *   If you satisfy Stability, you necessarily violate Inclusivity (by excluding affected outsiders).
  *   If you satisfy Inclusivity (strong All Affected Interests), you destroy Stability (the *demos* changes every issue).

  **Resolution Strategy:** Any theory you commit to must explicitly admit which side it sacrifices.
  *   *Statists* sacrifice Inclusivity for Stability.
  *   *Cosmopolitans* sacrifice Stability for Inclusivity (often proposing global democracy).
  *   *Pragmatists* try to hide the tension (usually by fudging the definition of "affected").

  ---

  ### IV. The Workhorse Requirement

  The single requirement that does the most work is **Requirement #2: Decisional Capacity / Stability.**

  **Why:** It is the only constraint that is logically prior to the act of voting. You cannot vote if there is no "you" that persists long enough to cast the ballot.

  **What it Knocks Out:** It knocks out the strong version of the **All Affected Interests (AAI)** principle.
  *   **The Family of Views Ruled Out:** **Radical Issue-Based Demoi.**
  *   **Why:** AAI suggests the *demos* should reconfigure for every single decision based on who is affected. Requirement #2 demonstrates that this makes collective action impossible. There is no "public" to deliberate, no "majority" to form, and no "government" to be held accountable if the electorate is a different set of billions of people for every bill. It forces AAI proponents to retreat to a weaker version (e.g., "All Affected *Interests* represented by stable proxies"), which often concedes the ground back to Stability.

  ### V. Summary for Your Commitment

  Before you pick a side, check the theory against this matrix:

  1.  **Does it explain the Secession Case?** (Does it privilege the existing border or the self-determining group?)
  2.  **Does it handle the Expatriate/Denizen asymmetry?** (Why does one vote and not the other?)
  3.  **Does it admit the Stability/Inclusivity Trade-off?** (If it claims to solve both, it is lying.)
  4.  **Does it survive the Reflexivity Test?** (If it claims reflexivity is required, ask it how the first *demos* was formed without it.)

  If a theory claims to solve the boundary problem without excluding someone or sacrificing stability, it is not a theory; it is a wish. The "solution" is always a justification for why a specific exclusion is acceptable. Your job is to decide which exclusion you can live with.
