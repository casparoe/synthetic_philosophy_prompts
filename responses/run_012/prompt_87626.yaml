      *   *Key Philosophical Reference:* **Jim Pryor** (Dogmatism), **John McDowell** (Perceptual Experience), **Bas van Fraassen** (Belief vs. Acceptance). But the strongest fit is **Richard Jeffrey** and the subsequent critique by **David Christensen** or **Brian Skyrms**.
