answer: |-
  **Credence: 60%**

  I assign a 60% probability that the citizens' assembly outperforms the city council on a typical policy question defined by "correctness" relative to shared community values. I am not running a simulation here; I am weighting the theoretical strengths of the Jury Theorem against the empirical fragility of human deliberation.

  ### Decomposition

  Here are the five critical terms that drive that number. Each probability represents the likelihood that **this specific factor favors the Assembly over the Council.**

  | Term | Probability | Justification |
  | :--- | :--- | :--- |
  | **1. Individual Competence ($p > 0.5$)** | 0.80 | Ordinary residents possess superior local knowledge on transit usage than generalist politicians, easily clearing the "better than chance" threshold. |
  | **2. Error Independence** | 0.40 | Shared briefing materials and facilitation create high correlation in errors, severely degrading the mathematical advantage of large numbers. |
  | **3. Binary Framing Validity** | 0.60 | While policy is multi-dimensional, final votes are usually binary, though Condorcet cycling remains a risk in complex trade-offs. |
  | **4. Council Expertise Advantage** | 0.60 | The Council has access to staff and data, but their incentive structures (donors, reelection) often degrade decision quality relative to values. |
  | **5. Agenda/Process Integrity** | 0.50 | It is a coin flip whether facilitators and staff successfully neutralize agenda-setting power or quietly steer outcomes themselves. |

  ### The Combination

  I am deriving the 60% via a **weighted heuristic average**, not a strict formula, because these factors interact non-linearly.

  *   **Calculation:** $(0.80 + 0.40 + 0.60 + 0.60 + 0.50) / 5 = 0.58$.
  *   **Adjustment:** I round up to **0.60** because the "Individual Competence" term (0.80) is the engine of the Condorcet theorem; if people are genuinely competent, even moderate correlation (Term 2) doesn't fully negate the benefit of diversity over a small, homogenous council.
  *   **Honesty Check:** I am making up the weights. In a strict multiplicative model (where Independence is a gatekeeper), the score would drop closer to 45%. In a "diversity trumps ability" model, it rises to 70%. 60% is my subjective compromise between the math and the sociology.

  ### Least Certain Term

  **Error Independence (0.40).**
  This is the hardest variable to quantify. We know people read the same memos, but we don't know how much private reflection or subgroup disagreement actually breaks that correlation during a weekend deliberation.

  **Evidence to Move It:**
  I would need a controlled experiment where two groups read the same policy briefing: one group discusses it (assembly style) and one group votes privately immediately after reading. If the variance in the discussion group's errors is statistically indistinguishable from the private group, independence holds better than I think, and my credence jumps to 75%. If the discussion group converges on the same wrong answers significantly more often, my credence drops to 40%.

  ### Where Your Friends Are Fighting

  **The single term their disagreement lives in is Error Independence.**

  Friend A is betting that random selection and private voting create enough statistical noise to satisfy Condorcet. Friend B is betting that the *social* reality of the assembly—the shared room, the shared experts, the shared framing—creates a correlation coefficient near 1.0, which mathematically collapses the Jury Theorem's advantage. Friend A is arguing from the *idealized math*; Friend B is arguing from the *sociology of information*. Friend B is likely more right about the process, but Friend A is right that the Council's $p$-value is often lower than assumed due to political incentives.
