answer: |-
  **Recommendation**

  Adopt the doctrine with conditions. We must distinguish between our internal analysis and our public language. Internally, we adopt the distinction between political crime and political failure to guide our grantmaking and historical research. Externally, in our annual appeal and partner communications, we speak of "preventable catastrophe" and "accountability" rather than "crime," unless specific legal counsel advises otherwise. This preserves our charter's focus on relief while honoring the truth that most famines are man-made. This policy takes effect immediately upon the vote on the fourteenth. It governs how we evaluate potential grantees and how we frame our public mission, ensuring we do not fund actors who meet the test for criminal negligence, while maintaining access to those who merely lack capacity. We must not be ideologues, but we cannot be accomplices.

  **The Test**

  We are collapsing three questions: the causal (what stopped the food), the imputational (who is answerable), and the remedial (what we fund). To resolve the imputational question, we apply a four-part test. Foreseeability: was the crisis trajectory knowable from information the authority actually held? Capacity: did they possess the food, money, or transport to blunt it? Substitution: was there a specific alternative course open to them at the time, not merely a better government? Persistence: once dying was manifest, did they stop or continue the harmful policy? A finding of political crime requires all four. A finding of political failure requires only foreseeability and capacity. This distinction allows us to acknowledge natural triggers without absolving human responsibility. It sharpens our focus from blame to leverage. If an authority could have known and could have acted but did not, they failed. If they knew, could act, had an alternative, and persisted anyway, they committed a crime. Our remedial question flows from this: we fund failure mitigation; we expose crime.

  **The Three Cases**

  Bengal, 1943: Wartime inflation and wage collapse coincided with cyclone and blight, but the harvest was not catastrophic. The provincial government denied the famine; trade barriers and boat denials prevented movement. Foreseeability and capacity were present, but the war context complicates substitution; the alternative course might have required defying military command. Persistence is clear, but substitution is debatable. Verdict: Political Failure. The weakest joint here is assuming civilian authorities had meaningful substitution options during total war.

  Ireland, 1845–1852: Blight triggered the crisis, but food left the country while relief was withdrawn or restricted by property rules. The administration had capacity and foreseeable knowledge. Substitution existed in the form of continued relief or halted exports. Persistence was ideological; the workhouse rules remained despite manifest death. Verdict: Political Crime. The weakest joint is relying on retrospective economic data to prove capacity at the local level.

  China, 1959–1961: Procurement quotas were set against inflated harvest reports; labour was diverted to steel; grain was exported while millions starved. Foreseeability and capacity were absolute. Substitution existed in halting quotas or exports. Persistence was systemic; the policy continued despite reports of cannibalism. Verdict: Political Crime. The weakest joint in my reasoning across these cases is that foreseeability is always clearer in hindsight than in the fog of crisis.

  **The Case Against**

  "This distinction is a luxury we cannot afford. Our charter mandates relief and research, not advocacy or adjudication. By adopting a test that labels partner governments as criminals, we risk expulsion from the very countries where our warehouses sit. The agronomists are right: if we deny the role of blight or drought, we lose credibility with the people moving the grain. Furthermore, this doctrine distracts from the boring things that actually save lives: early warning, cash transfers, storage. We are not a tribunal. We are a foundation. If we print this internally, it leaks. If it leaks, we lose access. If we lose access, people die. The moral purity of calling a famine a crime is not worth the blood cost of being locked out. We should fund the mitigation, not the indictment."

  **Reply**

  "You are right that access is vital, and I concede that public language must not jeopardize it. That is why I propose the two-track approach: internal rigor, external discretion. But moral purity is not the goal; complicity is the risk. If we fund a regime that meets the four-part test for crime without knowing it, we are not just relieving suffering; we are subsidizing the mechanism of death. We do not need to print 'crime' in the appeal letter to refuse grants to those who persist in killing their people. We can speak of 'preventability' publicly while holding the harder line privately. Distraction is a risk, but confusion is worse. Without this test, we fund everyone equally, which means we fund the perpetrators alongside the victims. We can protect access without surrendering our judgment."

  **Implementation**

  By the thirteenth, the Chair will draft revised grant guidelines incorporating the four-part test for internal due diligence. The Solicitor will review the annual appeal letter to ensure public language focuses on "preventable tragedy" and "accountability" rather than "crime," ensuring compliance with our charter and partner agreements. The Director of Programs will train staff on applying the test to historical research grants versus emergency relief. We keep the mission statement unchanged but append this policy as an internal operating procedure. On the fourteenth, we vote on the policy, not the language. The appeal letter goes to print only after legal sign-off. We act immediately to align our money with our knowledge.

  **We fund prevention where there is failure, and witness where there is crime.**

  **I would change my recommendation if evidence showed that internal distinction inevitably leaks and costs more lives than it saves.**
