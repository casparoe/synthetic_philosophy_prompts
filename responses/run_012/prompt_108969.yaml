      **Project Title:** Dissociating Epistemic Transmission and Moral Authorship in Testimony
      **Applicant:** [Name], PhD Candidate, Department of Philosophy
      **Request:** Summer Research Grant

      **Project Summary**
      The debate over moral testimony is currently stalled between optimists (testimony transmits moral knowledge) and pessimists (it does not). This project proposes a diagnostic hypothesis: the debate conflates two distinct questions. The first is the **Transmission Question**: does testimony transmit epistemic warrant? The second is the **Authorship Question**: does acting on testimony preserve the agent's moral authorship (credit/blame)? I hypothesize that these questions can come apart. Existing positions are underdetermined because optimists and pessimists alike have failed to distinguish whether their objections target knowledge or agency. This summer, I will construct conceptual case pairs to test this dissociation, aiming to produce a standalone paper clarifying the dialectic for my dissertation.

      **Research Question & Hypothesis**
      The standard literature treats the permissibility of moral deference as a single issue. I argue it comprises two independent variables.
      1.  **Transmission:** Can a hearer acquire justified moral belief or knowledge via testimony?
      2.  **Authorship:** Can a hearer who acts on testimony be the proper author of that action, such that praise or blame attaches to them rather than the speaker?

      My hypothesis is that these variables cross-cut. Current arguments are ambiguous regarding which variable they target.
      *   *Optimism about Transmission* is compatible with *Pessimism about Authorship*. One might grant that testimony yields knowledge but argue that acting on it constitutes agential outsourcing, rendering the action not properly the hearer's own.
      *   *Pessimism about Transmission* is compatible with *Optimism about Authorship*. One might deny that testimony yields knowledge (perhaps due to lack of understanding) yet argue that if the hearer integrates the testimony into their own practical reasoning, authorship remains intact even if knowledge fails.

      If correct, many established positions are incomplete. A pessimist arguing that deference undermines understanding may have only addressed Authorship, leaving Transmission open, or vice versa. This project seeks to determine whether these questions are genuinely separable or if they are necessarily entangled.

      **Methodology**
      I will employ a conceptual-and-case-based method rather than empirical survey or straight normative argument.
      *   **Matched Pairs:** I will construct cases holding epistemic credentials fixed (e.g., the hearer has justified true belief via reliable testimony) while varying the structure of practical reasoning (e.g., blind deference vs. testimony as a prompt for independent reflection).
      *   **Judgment Tracking:** I will analyze whether intuitions about credit, blame, and agency track the epistemic features or the reasoning structure.
      *   **Justification:** Empirical surveys cannot resolve normative conceptual boundaries. Straight argument risks begging the question by assuming the link between knowledge and agency. Case comparison isolates the variables to see if our normative concepts actually distinguish them.

      **Risk & Entanglement**
      The most significant risk is that the hypothesis is false because the concepts are more entangled than assumed. The point of potential collapse lies in the conditions for moral knowledge. If moral knowledge *requires* a level of understanding that necessitates independent practical reasoning, then Transmission may conceptually entail Authorship. In this scenario, one cannot have moral knowledge via testimony without also satisfying the conditions for moral authorship. Demonstrating this entanglement would be a substantive positive result, showing that the epistemic norm is thicker than currently modeled. However, if cases can be constructed where knowledge is present but authorship is absent (or vice versa), the dissociation holds.

      **Timeline (10 Weeks)**
      *   **Weeks 1–2 (Refinement):** Finalize case constructions. Ensure epistemic variables are tightly controlled across pairs. Review existing arguments to map where conflation occurs.
      *   **Weeks 3–6 (Analysis):** Test cases against counterexamples. Draft the core argument distinguishing Transmission and Authorship. Write the section demonstrating the cross-cutting possibilities in existing literature.
      *   **Weeks 7–8 (Drafting):** Compose full manuscript. Focus on the diagnostic contribution rather than resolving the normative question definitively.
      *   **Weeks 9–10 (Revision):** Polish for submission to a general philosophy journal. Prepare dissertation chapter outline based on findings.

      **Outcomes & Feasibility**
      *   **Success:** A stable demonstration that Transmission and Authorship dissociate (or a proof that they collapse). The deliverable is a paper ready for submission clarifying the debate's structure.
      *   **Failure:** Inability to construct clean cases where intuitions diverge consistently, resulting in inconclusive muddiness about whether the concepts are distinct.
      *   **Scope Assessment:** This project is ambitious for a summer. Attempting to *resolve* the Authorship question normatively would be too much. Therefore, the scope is trimmed to the *diagnostic* claim: establishing the distinction and showing the literature is underdetermined. I will not argue for a specific theory of authorship, only that it is distinct from transmission. This makes the goal achievable within ten weeks while yielding a high-impact paper for the dissertation.

