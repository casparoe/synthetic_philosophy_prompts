answer: |-
  Your roommate is wrong, but for the right reason. The math *is* settled, which is precisely why the fight persists. In pure math, once the proof is done, the debate ends. In foundations, once the proof is done, the debate begins, because the proof forces you to admit what you actually assumed.

  Your hunch is correct: the word "rationality" is doing double duty. But it's worse than a verbal ambiguity. It's a category error. The stalemate exists because game theorists are trying to derive interactive restrictions (solution concepts) from non-interactive axioms (individual rationality) without admitting that the bridge between them is built out of **belief restrictions**, not rationality constraints.

  Here are the three most plausible diagnoses for why this debate is stuck, followed by my commitment to the one that actually explains the impasse.

  ### Three Diagnoses for the Stalemate

  **1. The Ontological Mismatch (The Mixed Strategy Problem)**
  This diagnosis suggests the fight is about what a mixed strategy *is*. If a mixed strategy is a deliberate randomization device (coin flip), then strict dominance by a mix is a clear violation of expected utility maximization. If a mixed strategy is merely a representation of opponents' uncertainty (purification), then "playing a mix" isn't an act at all, and dominance becomes a statement about robustness rather than choice. The stalemate persists because half the field treats mixes as acts and the other half treats them as beliefs, so they are literally proving theorems about different objects while using the same notation.

  **2. The Teleological Confusion (Prediction vs. Normativity)**
  This diagnosis argues the camps have different goals. One side views solution concepts as **normative**: "What *should* a rational agent do?" The other views them as **predictive**: "What *will* happen if agents reason this way?" IESDS is normatively robust but predictively weak (it leaves too many survivors). IEWDS is predictively sharper (often leading to Nash Equilibrium) but normatively fragile (order dependence). The debate is stuck because one side is answering a "should" question and the other is answering a "will" question, but both are labeling the answer "Rationality."

  **3. The Hidden Belief Restriction (The Epistemic Smokescreen)**
  This diagnosis claims that "Rationality" is being used as a container for assumptions about **permissible beliefs**. Rationality (maximizing expected utility given beliefs) is a conditional constraint: *If* you believe $p$, you must choose $a$. It does not restrict $p$. However, elimination procedures *do* restrict outcomes. Therefore, any theorem linking Rationality to Elimination must implicitly restrict the set of allowable beliefs. The stalemate exists because scholars fight over the *outcome* (which strategies survive) while denying they are fighting over the *input* (which beliefs are allowed).

  ### My Position: Diagnosis 3 is the Real Issue

  I am committing to **Diagnosis 3**. The debate is not about rationality. It is about **Caution**.

  Here is the hard truth: **Iterated Elimination of Strictly Dominated Strategies (IESDS) requires no belief restrictions other than consistency. Iterated Elimination of Weakly Dominated Strategies (IEWDS) requires specific, substantive restrictions on belief support.**

  When you eliminate a strictly dominated strategy, you are saying: "No matter what probability distribution you place on the opponent's actions (provided it has full support on the remaining set), this strategy yields lower utility." This follows from maximization alone. It holds for *any* belief.

  When you eliminate a weakly dominated strategy, you are saying: "There is no belief under which this strategy is strictly optimal." But wait. If I believe my opponent will play a specific strategy with probability 1, a weakly dominated strategy might be a best response. To eliminate it, I must assume you *never* hold a belief that puts probability 1 on the specific opponent action that makes the weakly dominated strategy optimal.

  This is not a requirement of rationality. A rational agent can hold degenerate beliefs. A rational agent can be certain the opponent will make a "mistake." To justify IEWDS, you must impose an extra axiom: **Caution** (or "Trembling," or "Lexicographic Beliefs"). You must assume agents assign positive probability to all logically possible opponent moves, even "irrational" ones.

  The reason the debate is stuck is that the IEWDS camp wants the normative force of "Rationality" without admitting they are smuggling in "Caution." They want to say, "It is irrational to play a weakly dominated strategy," when the accurate statement is, "It is irrational to play a weakly dominated strategy *if you are also required to be cautious.*"

  The IESDS camp digs in because they see the order-dependence of IEWDS as proof that it's not "fundamental." They are right that it isn't fundamental to rationality, but wrong to think it isn't fundamental to *equilibrium selection*. The order dependence arises because "Caution" is not common knowledge in the same way "Maximization" is. When you delete a weakly dominated strategy, you are changing the support of the beliefs, which changes what is "cautious" in the next round.

  ### Why This Matters (And Why Your Roommate is Wrong)

  Your roommate thinks this is a non-issue because in pure math, axioms are arbitrary. You pick a set, you derive a theorem. But in economic foundations, axioms claim to describe reality. If we claim IEWDS survivors are the "rational" outcomes, we are making an empirical claim about human cognition: that humans naturally assign positive probability to all opponent strategies.

  If we treat "Rationality" as a monolithic block, we cannot test this. We just argue about definitions. If we split the atom, we separate **Maximization** (Rationality) from **Support** (Caution).

  This deflates the debate, but it does not dissolve it. It relocates it. The question is no longer "Is it rational to eliminate weakly dominated strategies?" The question becomes "Is it reasonable to require agents to be cautious?"

  ### What Counts as Progress?

  Progress requires a formal and verbal separation of the two components. We need to stop writing papers that claim "Common Knowledge of Rationality implies X" when they actually mean "Common Knowledge of Rationality and Caution implies X."

  **Concrete Step 1: The Reframing**
  We need to adopt a standard terminology that distinguishes **Instrumental Rationality** (maximizing given beliefs) from **Epistemic Restrictiveness** (constraints on the belief space).
  *   **IESDS** = Instrumental Rationality + Common Knowledge thereof.
  *   **IEWDS** = Instrumental Rationality + Common Knowledge of Caution (full support beliefs).

  **Concrete Step 2: The Theorem**
  We need a theorem that explicitly quantifies the "cost" of Caution. Show me a theorem that demonstrates how much predictive power is gained by adding Caution versus how much normative plausibility is lost. Currently, the literature treats Caution as a binary switch. It should be treated as a parameter. How much probability mass must be assigned to "irrational" moves to justify the elimination? If the answer is "any positive amount," then IEWDS is incredibly fragile to the definition of "possible."

  **Concrete Step 3: The Ontological Honesty**
  Regarding your mixed strategy wrinkle: If we admit that mixed strategies are primarily belief representations (Harsanyi purification style), then "dominance by a mix" is simply a statement that the pure strategy is never a unique best response to *any* belief in the convex hull. This clarifies that dominance is a property of the **belief space geometry**, not the agent's randomization device. Progress here means formally acknowledging that when we allow domination by mixes, we are expanding the set of "permissible beliefs" to include correlated uncertainties, not necessarily granting the agent a coin flip.

  ### Conclusion

  The impasse is not verbal; it is **structural**. It arises because we are trying to use a decision-theoretic concept (Rationality) to solve a fixed-point problem (Equilibrium/Selection) without acknowledging the fixed-point requires constraints on the input (Beliefs).

  The IESDS crowd is right that Weak Dominance elimination is not a requirement of individual rationality. The IEWDS crowd is right that without it, our solution concepts are too weak to be useful for prediction.

  The way out is to admit that **usefulness requires assumptions beyond rationality.** We should stop trying to dress up "Caution" as "Rationality." If you do that, the order-dependence of IEWDS stops looking like a paradox and starts looking like a feature: it reveals that "Caution" is not a stable common knowledge state in the same way "Maximization" is.

  So, tell your roommate the math is fine, but the interpretation is lying to us. The progress you're looking for comes from splitting the concept of Rationality into **Maximization** and **Belief Restriction**. Until we do that, we will keep banging into the same wall, because we are arguing about the paint when the problem is the load-bearing structure.
