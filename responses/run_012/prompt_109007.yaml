answer: |-
  **Project Title:** The Boundaries of Moral Trade: A Structural Analysis of Compromise and Commitment

  **Project Summary**
  This project investigates the limits of the "gains-from-trade" model as an explanation for moral compromise. In development economics and rational choice theory, compromise is often modeled as a Pareto improvement: parties exchange concessions on lower-ranked preferences to secure higher-ranked ones, without requiring shared values or a common metric of worth. While this model accurately describes many negotiated settlements, it remains unclear whether it explains the *normative structure* of moral compromise or merely describes disputes where moral content has already been converted into divisible goods. Over one semester, I will produce an 8,000–10,000-word paper testing this model against constructed cases of moral disagreement. The goal is to determine whether the trade analogy holds explanatory power for genuine moral compromise or if it functions only as a descriptive decoration for disputes that have ceased to be fundamentally moral.

  **The Research Question**
  The central question is determinate: **Does the gains-from-trade model explain the normative validity of moral compromise, or does it merely describe the residual space remaining after moral conflicts are translated into disputes over divisible resources?**

  This is not a question about whether compromise is good, but about the mechanism of its justification. If the trade model is explanatory, it should account for why a compromise is binding or reasonable even when core values are at stake. If it is merely descriptive, it should fail in cases where values are constitutive of the agent's identity or where convictions are non-fungible. I aim to demonstrate that the "conversion" of moral principles into tradeable preferences is the substantive philosophical move, and that the trade itself is secondary.

  **Context and Motivation**
  Current philosophical treatments of compromise generally fall into three categories, none of which adequately address the structural claim of the economic model:
  1.  **Mutual Accommodation:** Focuses on the outcome (peace, cooperation) rather than the mechanism of exchange.
  2.  **Virtue Ethics:** Focuses on the character of the compromiser (humility, reasonableness) rather than the logic of the transaction.
  3.  **Second-Best Theory:** Views compromise as a pragmatic fallback when consensus fails, without analyzing whether the fallback preserves moral integrity.

  My friend's argument—that trade resolves disagreement without requiring agreement on rankings—offers a fourth, stronger claim: that compromise is rational *independently* of shared moral ground. This is persuasive as a description of behavior but suspicious as a normative theory. If values are constitutive of the self, "trading" them may not be a gain for the agent but a transformation of the agent. Existing frameworks do not rigorously test where this transformation invalidates the trade. This project fills that gap.

  **Methodology**
  Given the twelve-week timeline, empirical fieldwork is impossible. The method will be conceptual analysis using constructed cases. I will design a series of thought experiments involving two agents with stipulated value rankings and specific constraints.

  1.  **Case Construction:** I will create pairs of agents with conflicting rankings over specific goods (e.g., resource allocation, policy decisions). Some cases will involve "peripheral" preferences (e.g., budget surplus allocation); others will involve "constitutive" commitments (e.g., rights violations, integrity constraints).
  2.  **Model Application:** I will attempt to model each case as a gains-from-trade scenario. I will check for the necessary conditions: divisibility of the good, fungibility of the concession, and stability of the agent's identity post-trade.
  3.  **Resistance Analysis:** For cases where the model fails to capture the moral intuition (i.e., where a trade is mathematically possible but morally incoherent), I will analyze the source of resistance.
      *   *Hypothesis A:* The failure is due to incommensurability (no common measure).
      *   *Hypothesis B:* The failure is due to constitutive constraints (the trade alters the agent).
      *   *Hypothesis C:* The failure is due to the "conversion problem" (the dispute was never about the goods, but about the principles governing them).
  4.  **Synthesis:** I will categorize the resisting cases to identify the necessary conditions for the trade model to be normatively valid.

  **Deliverables and Success Conditions**
  The final output will be a paper of 8,000–10,000 words suitable for submission to a journal in political philosophy or ethics.

  *   **Success:** The paper successfully identifies a class of moral disagreements that *cannot* be modeled as trade without category error. It establishes that the "conversion" of moral principles into preferences is the locus of the moral work, not the subsequent bargaining.
  *   **Failure:** The project fails if the distinction between "tradeable preferences" and "constitutive values" proves too vague to operationalize in the cases, or if I cannot demonstrate that the trade model adds anything beyond a restatement of "they agreed to disagree." If the resisting cases turn out to be merely emotional rather than structural, the critique collapses.

  **Feasibility and Scope Estimate**
  **Is this a semester or a career?**
  This is a semester-sized project with career-sized implications. A full theory of value constitutivity is a career's work. However, I am not attempting to build that theory. I am testing the *limits of an existing model* (the economic analogy). By restricting the scope to the internal coherence of the trade model, the project is manageable in twelve weeks.

  **Where does the proposal overreach?**
  1.  **Defining "Constitutive":** There is a risk of spending too much time defining what makes a value "identity-constituting." I must avoid getting bogged down in meta-ethics. I will treat constitutivity as a structural constraint within the thought experiments rather than solving the metaphysical problem of personal identity.
  2.  **Generalizability:** There is a temptation to claim this refutes the economic approach to morality broadly. I must restrict the claim to the specific context of *compromise between ongoing parties*, not moral decision-making in general.
  3.  **The "Conversion" Step:** Analyzing how moral disputes are converted into resource disputes is complex. I risk expanding the paper to cover the philosophy of language or social ontology. I will limit this to showing *that* the conversion happens, not providing a full mechanics of *how* it happens socially.

  **Timeline**
  *   **Weeks 1–3:** Refine the constructed cases; ensure they isolate the variables of fungibility and identity.
  *   **Weeks 4–7:** Draft the core argument and case analyses.
  *   **Weeks 8–10:** Refine the "conversion" argument; address potential counter-arguments (e.g., that all values are ultimately tradeable given enough pressure).
  *   **Weeks 11–12:** Revision and polishing for submission.

  **Conclusion**
  The gains-from-trade model is a powerful tool for understanding cooperation, but its application to moral compromise risks commodifying commitments that sustain the moral agent. By rigorously testing where this model breaks, this project aims to clarify the boundary between pragmatic settlement and moral integrity.
