prompt: |-
  I'm a first-year PhD student in the game theory group here (undergrad was in philosophy, which is probably why I keep drifting into this stuff), and I have to hand in a two-page proposal for the department's summer research grant by the end of the month. The idea came out of our reading group last week, where someone put a little 3x3 game on the board: the row player gets (1,1,1) on the top row, (3,0,2) in the middle, (0,3,2) on the bottom, against three columns. The top strategy isn't beaten by either of the other two on its own, but the 50/50 mix of them strictly beats it in every single column, so once you let mixed strategies do the eliminating, top goes. Textbook, whatever. Except it's been bugging me ever since: the thing that does the eliminating is a lottery that no rational agent would ever actually play, it's just a hypothetical, and yet the standard line we feed undergrads is that each round of elimination is licensed by "a rational player won't pick a dominated strategy, and everyone knows the others are rational, and everyone knows that, etc." I want to know whether that story survives once mixtures are in the eliminator role, or whether two things that normally get run together -- "this strategy is strictly dominated" and "this strategy is never a best response" -- quietly come apart the moment you start iterating, and what that does to the epistemic gloss. My vague memory is that those two notions coincide in finite two-player games but that the equivalence breaks down once there are three or more players, and I'd like to know whether that's the crack where the whole "elimination as rationality-tracking" picture falls apart or just a footnote you add to be safe.

  There's a second thing I can't get straight, and it might be the same thing. If you're eliminating weakly dominated strategies, the order in which you do it changes what survives, and I think there's a theorem that the strict version is order-independent but the weak version isn't -- so one natural move is to ask what a "canonical" order would even be (eliminate the most-dominated first? there's no obvious measure), and another is to say that order-dependence is itself the tell that we've got the wrong concept of "rationality" in the background. My lab actually uses iterated elimination as a cheap preprocessing step before we throw a solver at things, so there's a practical edge too: if the surviving set depends on an arbitrary choice I'm making in code, that's bad.

  Can you help me turn this into a real proposal? Put on the hat of a game theorist who's genuinely happy to do conceptual work and doesn't think the philosophy is decoration -- and please start by brainstorming three or four different ways of sharpening the question, flagging which ones are actually open and which are settled, before you commit to one. Then write the proposal itself: the question stated so precisely that it has a determinate answer, why the existing treatments leave it open rather than already deciding it, the method (my instinct is to brute-force the space of small games -- all 3x3s or 4x4s with small integer payoffs -- and classify what survives under which elimination orders and under which notions of domination, but tell me honestly if that's the wrong instrument for a conceptual question), what a result would look like and what would count as the project failing, and whether ~10 weeks of summer is a realistic scope or if I'm kidding myself. If my framing is muddled somewhere, say so up front rather than being polite about it. Don't give me a bibliography or a reading list -- I'll fill in the references myself, and I'd rather you not guess at them.
