answer: |-
  This is a fantastic snag to hit. It shows you're engaging deeply with the text rather than just reciting the formula. You have identified what is often called the **"Problem of Relevant Descriptions"** or the **"Maxim Specification Problem,"** but you are framing it through a lens of *social choice theory* (aggregating conflicting wills).

  The short answer is: **You are interpreting "Universal Law" as a legislative consensus, but Kant intends it as a law of nature.**

  Here is how to untangle this for your seminar, broken down into the conceptual correction, the fix for your example, and why it isn't a majoritarian problem.

  ### 1. The Conceptual Correction: Law of Nature vs. Legislative Vote

  Your snag rests on this premise: *"Universal law has to mean a law that every rational agent could will at the same time... otherwise it isn't universal."*

  You are interpreting this as: **"Everyone must agree to adopt the exact same policy simultaneously."** This turns the Categorical Imperative (CI) into a social contract or a voting procedure. If Agent A wills Policy X and Agent B wills Policy Y, and X and Y are incompatible, you rightly see a deadlock.

  **Kant's actual meaning:**
  When Kant says "act only according to that maxim whereby you can at the same time will that it should become a universal law," he adds a crucial gloss in the *Groundwork*: **Think of it as a "Universal Law of Nature."**

  *   **Not a Vote:** It is not a question of whether everyone *agrees* to the rule.
  *   **But a System:** It is a thought experiment asking: "Can I conceive of a world where *everyone necessarily acts* on this rule (like gravity), without the rule destroying itself or my own rational will?"

  The test is **monological**, not **dialogical**. I do not need to check my maxim against *your* actual maxim. I need to check *my* maxim against *a world where everyone acts on my maxim*.

  ### 2. Fixing the Example: Maxim Specification

  Let's look at your two maxims again:
  1.  **M1:** "I'll keep my promises."
  2.  **M2:** "I'll break a promise when keeping it would seriously hurt someone."

  You argue these can't both be universal laws. But for Kant, the problem isn't that they conflict with *each other*; the problem is that **M1 is poorly formulated.**

  In Kantian ethics, a maxim must include the **relevant circumstances** of the action. "Keep promises" is too abstract. It doesn't tell us *which* promises or under *what conditions*.

  *   **The Test for M1:** If I will "Always keep promises, no matter what" as a law of nature, I run into a **Contradiction in Will**. Why? Because as a rational agent, I will my own preservation and the well-being of those I love. If keeping a trivial promise causes serious harm (e.g., promising to meet for coffee, but on the way I see someone bleeding out), a rational agent cannot will a law that forces them to ignore the bleeding person.
  *   **The Test for M2:** If I will "Break a promise when keeping it would seriously hurt someone" as a law of nature, does it contradict itself? No. The institution of promising can still exist (people generally keep promises), but there is a recognized exception for harm prevention.

  **The Resolution:**
  The CI test is not a competition between M1 and M2 to see which one gets more votes. The CI test is a filter.
  *   I am in a situation where keeping a promise causes harm.
  *   I must formulate my maxim to reflect *that situation*.
  *   If I formulate it as M1 ("Keep promises [even when it causes harm]"), it fails the CI test (Contradiction in Will).
  *   If I formulate it as M2 ("Break promise to prevent harm"), it passes.

  Therefore, M2 isn't "beating" M1 in a vote; M2 is the **morally permissible specification** of the duty, while M1 is a rigid over-generalization that fails the rationality test.

  ### 3. Why It's Not a Social Choice Problem

  You worried that the verdict depends on "which maxims I take as given going in," making it arbitrary or majoritarian.

  Kant's response is that **duties do not conflict, only grounds of determination do.** (This is from the *Metaphysics of Morals*).

  *   If it *truly* is my duty to keep the promise, and *truly* my duty to prevent harm, Kant says I have misidentified one of the duties.
  *   The "Universal Law" test is the tool used to determine which description is the correct moral one.
  *   It is not up to "how many agents" will it. It is up to **Rational Consistency**.

  If 99% of people will "Keep promises always" and 1% will "Break to prevent harm," the 99% are simply wrong (on Kant's view). Morality is not democratic. The CI is a test of *rational coherence*, not *popular consensus*.

  ### 4. Seminar Talking Points / "Tie-Breaker" Rules

  To answer your specific question about a tie-breaker: There isn't a "specificity beats generality" rule per se, but there is a **"Completeness of Description"** requirement.

  Here is how you can frame this in your presentation to resolve the snag:

  1.  **Distinguish Conception vs. Volition:**
      *   **Contradiction in Conception (Perfect Duty):** If everyone did X, X would become impossible (e.g., False Promising). If everyone broke promises whenever convenient, the institution of promising would vanish.
      *   **Contradiction in Will (Imperfect Duty):** If everyone did X, a rational agent couldn't *want* to live in that world (e.g., Never helping others).
      *   *Application:* Your M1 ("Keep promises always") likely fails on Contradiction in Will. You cannot rationally will a world where you are forced to let people suffer to uphold a trivial commitment.

  2.  **The "Kingdom of Ends" Formulation:**
      *   Bring in the 3rd formulation to help clarify the 1st. In a Kingdom of Ends, we are all legislators. But we legislate laws that respect humanity as an end in itself.
      *   M1 treats the person who gets hurt as a mere means to my own moral purity (keeping my record clean).
      *   M2 respects the humanity of the person being harmed.
      *   This provides the "tie-breaker" you were looking for: **Respect for Rational Agency.**

  3.  **Address the "Arbitrariness" Objection:**
      *   Acknowledge that critics (like Hegel or Schopenhauer) *did* argue exactly what you are arguing: that Kant's formalism is empty because I can manipulate the maxim description to get the result I want.
      *   **The Defense:** A Kantian replies that I cannot arbitrarily exclude relevant moral facts from my maxim. If I am aware that harm will occur, I am *rationally required* to include that in my maxim's description. To leave it out is to act in bad faith (self-deception), which violates the spirit of the CI.

  ### Summary for your Presentation
  *   **The Snag:** You treated the CI as a vote between conflicting policies.
  *   **The Fix:** The CI is a test of whether *one* policy creates a contradiction in a world where *everyone* follows it.
  *   **The Conflict:** M1 and M2 don't fight each other; M1 fails the test on its own merits because a rational agent cannot will a law that mandates self-harm or harm to others for the sake of rule-following.
  *   **The Takeaway:** Universality isn't about unanimity; it's about **non-contradiction in a system of rational nature.**

  This distinction should clear up the "social choice" worry and give you a robust defense against the idea that the test is indeterminate. Good luck with the seminar!
