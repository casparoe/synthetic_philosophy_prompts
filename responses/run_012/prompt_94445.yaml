      *(Self-Correction during drafting)*: Make sure not to get bogged down in whether Nuremberg was *actually* just. The prompt asks to analyze it *through* Pascal. Pascal would say "It doesn't matter if it's truly just, only if it is made strong." The analysis must pivot on whether the *persistence* of the norm disproves the idea that it *only* survives via force.

      *(Refining the Recursion Point)*: The prompt asks: "Decide whether Nuremberg and its aftermath show this to be fatal to Pascal's pairing or a defect institutions can partly repair."
      *   *Decision:* It shows the defect is structural, not just institutional. The UN Security Council veto proves the Strong still stand above the rule. So Pascal is right about the structure, but maybe wrong about the *nature* of the justice created.

      *(Refining the Alternative)*: Natural Law is the strongest competitor here because the prosecution explicitly relied on "laws of humanity" to bypass the positivist trap of retroactivity. This aligns with the norm outliving the force.

