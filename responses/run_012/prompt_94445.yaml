answer: |-
  Here is the mapping of the Nuremberg episode onto Pascal's framework, followed by a verdict on the theory's survival.

  ### I. The Mapping: Force and Justice

  In Pascal's schema, **Force** is that which compels obedience; **Justice** is that which commands moral assent. At Nuremberg, the allocation is stark but layered.

  *   **The Strong:** The Allied Powers. They possess the monopoly on violence (armies), the control of territory (occupation), and the physical custody of the defendants.
  *   **The Just:** The Tribunal and the Charter. They possess the claim to moral authority (norms against aggression and atrocity).
  *   **The Force in Play:** It is not merely the armies that won the war, but the courtroom's capacity to sentence and execute. The courtroom is an extension of the occupation; the bailiff is a soldier.
  *   **The Justice in Play:** The substantive norms. Specifically, the prohibition on aggressive war (Count I) and crimes against humanity (Count III).

  **The Joining:** Pascal recommends joining justice and force so that the just may be strong and the strong just. Nuremberg achieves this join operationally. The Allies used their Force to instantiate a specific conception of Justice. However, Pascal's darker suggestion is that men "make what is just strong." Here, the Strong (Allies) defined what counts as Just (the Charter) and then applied Force to enforce it. The join is successful, but the directionality confirms Pascal's cynicism: Force did not submit to pre-existing Justice; Force *constituted* Justice.

  ### II. Retroactivity and the Pact

  The defense's retroactivity objection argues that Justice cannot be applied where Force had not previously established it as law. The prosecution's appeal to the Kellogg-Briand Pact is the critical pivot point for Pascal's theory.

  *   **Pascal's Cynical View:** If justice is merely "established custom," retroactivity is irrelevant. You establish the custom *now* with Force, and it becomes Justice *tomorrow*. On these terms, the objection is not fatal; it is merely a complaint from the losing side of the power dynamic.
  *   **The Prosecution's Move:** By citing the Pact, the prosecution attempted to show that the Justice was *not* merely the whim of the Strong, but a pre-existing commitment the defendants had voluntarily signed. This is an attempt to make the Strong *truly* Just, not just to make the Just Strong.

  **Verdict on the Join:** On Pascal's own terms, the retroactivity objection is irrelevant to the *authority* of the tribunal, which rests on Force. However, the appeal to the Pact reveals an anxiety: the Strong felt the need to legitimize their Force through prior consent. This suggests that Force alone was felt to be insufficient for *legitimacy*, even if sufficient for *power*. Pascal predicts the Strong will dress Force as Justice; he does not predict the Strong will feel compelled to prove the Justice existed *before* the Force.

  ### III. The Recursion Problem

  The recursion problem states: A rule forbidding force requires force to enforce it; therefore, the enforcer stands above the rule.

  *   **Nuremberg's Manifestation:** The Allies prosecuted "waging aggressive war" while having waged war themselves. They stood above the rule they enforced.
  *   **Pascal's Implication:** This is not a bug; it is the nature of law. The Sovereign (the Strong) is the source of law and cannot be bound by it.
  *   **Institutional Repair?** The aftermath (UN, ICC) attempted to repair this by creating a body where the Strong bind themselves. The prompt notes enforcement is blocked by the body charged (Security Council veto). This confirms Pascal: the Strong (P5 members) retain the right to stand above the rule.

  **Is this Fatal?** For Pascal, no. He expects the Strong to remain above the law. For a theory of *International Law*, yes, it is fatal to the claim of universality.
  **Condition for the Other Verdict:** For the recursion problem to be resolved, the Strong would have to submit to the judgment of the Weak, or an institution would have to possess Force independent of the Great Powers. Since the ICC relies on state cooperation and the UN on Great Power consensus, the Force remains tethered to the Strong. Pascal is vindicated here: the Force never fully submits to the Justice it created.

  ### IV. Impact on the Theory: Cynicism vs. Autonomy

  Does Nuremberg confirm or embarrass Pascal?

  1.  **Confirmation (Genealogical):** Pascal claims law is the victor's self-portrait. Nuremberg confirms this genealogically. The Charter was written by victors, the judges were from victor nations, and the law applied only to the vanquished. The origin of the norm is pure Force.
  2.  **Embarrass (Teleological):** Pascal implies Justice is *sustained* only by Force ("justice without force is impotent"). However, the Nuremberg norms (Genocide, Human Rights) outlived the Allied occupation. They were later invoked *against* the interests of the victors (e.g., colonial independence movements, later human rights litigation against Allied allies). The norm acquired **normative autonomy**. It became strong *without* the original Force.

  **The Split Doctrine:** Nuremberg pulls Pascal's two doctrines apart.
  *   *Descriptive Claim (Origin):* Law originates in Force. **Confirmed.** Nuremberg was an act of power.
  *   *Normative Recommendation (Union):* Justice and Force ought to be joined for stability. **Complicated.** The "Justice" created at Nuremberg proved stable not because the Force remained, but because the *principle* gained independent assent.

  Pascal assumes Justice is merely opinion/custom that requires Force to hold. Nuremberg suggests Justice can become *principle* that constrains Force. If the norm binds the makers after the Force recedes, Justice is not merely the shadow of Force.

  ### V. Alternative Accounts

  Does another theory handle this better?

  *   **Hobbesian:** Fits the origin (Sovereign command) but fails the aftermath. Hobbes' Sovereign cannot be bound by its own laws. Nuremberg's norms bound the successors of the creators.
  *   **Positivist:** Fits the Charter (law is command) but struggles with the moral weight required to overcome the retroactivity objection. Positivism admits the law was valid because the Strong said so, but cannot explain why we still regard it as *just* today.
  *   **Natural Law:** This handles the case best. The prosecution argued that certain acts are criminal by virtue of "laws of humanity," regardless of statute.
      *   *Why it wins:* It explains the **persistence** of the norm. If Nuremberg was merely victors' justice (Pascal/Hobbes), the norms should have vanished when the Cold War shifted alliances. They did not. They persisted because they tapped into a pre-political moral reality that the Force *recognized* rather than *created*. Natural Law accounts for the moment the norm escaped the Force that birthed it.

  ### VI. The Verdict

  **Pascal's framework survives as a critique of origin, but fails as a theory of legitimacy.**

  Nuremberg confirms Pascal's descriptive claim: legal orders are founded on acts of Force that are retroactively cloaked in Justice. The "Strong" did indeed "make what is just strong."

  However, the episode defeats Pascal's underlying metaphysics of justice. Pascal treats justice as malleable custom, dependent on force for its existence. Nuremberg demonstrates that a norm, even if birthed by Force, can achieve a status where it *judges* Force. The Genocide Convention constrains the Strong today not because the Allies' armies are still present, but because the Justice has become independent of the Force.

  Pascal says justice without force is impotent. Nuremberg shows that force without justice is transient, but justice *born of* force can become potent even after the force is gone. Pascal cannot account for the **afterlife of the norm**. He sees the chain of causation (Force → Law) but misses the feedback loop (Law → Constraint on Force).

  **Final Ruling:** Pascal is right about the birth of the law, but wrong about its life. The Nuremberg Tribunal was Pascal's "tyrannical force" making itself "just," but the offspring of that union grew up to discipline the parents. This normative autonomy is the one variable Pascal's equation cannot solve.
