      *   *Sentence 5:* "The upshot for policy is that pushing for 50/50 representation in STEM is misguided, since it means overriding women's own choices, and a just society should let people sort themselves out." -> Normative leap. Assumes current choices are fully autonomous and不受 (unaffected by) subtle cultural norms. Ignores structural barriers that might persist even in "high equality" countries.
