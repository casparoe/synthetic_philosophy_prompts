answer: |-
  Good morning. It is an honour to stand before you as your incoming Chair.

  Looking out at this room, I see the history of our movement. I see the people who campaigned for cage-free eggs when the industry said it was economically impossible. I see the lawyers who established legal personhood for chimpanzees. I see the investigators who documented the standard operating procedures of the slaughterhouse. You have built this organisation on a foundation of hard, tangible victories for animals who can look us in the eye.

  I know that for many of you, the inclusion of insect welfare on this year's agenda feels like a distraction. Some of you worry it dilutes our brand. Others worry it insults the urgency of the work we already do. If we start worrying about beetles, are we admitting that the screaming pig doesn't matter enough?

  I am here to argue that insects belong in our remit. But I am not here to sell you a slogan. I am here to ask you to engage with a difficult calculation, and to acknowledge where our current ethics might be incomplete.

  To do this, we must separate two questions that are often conflated. The first is the *probability of sentience*. Do insects feel pain? We do not know. The neuroscience is evolving. Let us be humble: we cannot assert consciousness where we cannot measure it. We must admit there is a non-zero chance they are biological robots, and a non-zero chance they suffer.

  The second question is the *moral weight of that experience*. If an insect does feel pain, does it matter as much as a cow's pain? Probably not. Their nervous systems are simpler. Their capacity for suffering is likely dimmer, less resonant than a mammal's.

  Critics of insect welfare often attack the first question to dismiss the second. They say, "You can't prove they feel." But in ethics, we must act on risk. If there is even a small probability of sentience, we must multiply that probability by the moral weight of the experience, and then—and this is the crucial step—multiply it by the number of individuals involved.

  This is where the discomfort lies. The numbers of insects are not just large; they are astronomical. We are not talking about thousands. We are talking about quintillions. Even if the probability of sentience is low, and even if the moral weight of a single insect's pain is a fraction of a vertebrate's, the sheer scale of the numbers means the *expected value* of their suffering is vast.

  I know what some of you are thinking. If you follow that logic, doesn't it run away from us?

  This brings me to the first objection we must face head-on. It is the argument from the nematode.

  Standard estimates suggest there are 4.4 times 10 to the power of 20 nematodes in the world's topsoil alone. That is sixty billion for every human being on earth. If our logic is "low probability times huge numbers," why stop at insects? Why not nematodes? Why not bacteria? If we cannot find a natural stopping point, does the argument not collapse under its own absurdity?

  It is a fair challenge. If we claim to care about all potential sentience, we must explain why we are not dedicating our entire budget to soil chemistry.

  The answer is not that nematodes definitely don't matter. The answer is *tractability* and *epistemic clarity*.

  We include insects in our remit not because we have solved the mystery of their minds, but because they occupy a specific niche where our intervention is possible and our uncertainty is manageable. Insects interact with human systems—agriculture, pest control, research—in ways we can influence. We can change policies. We can fund alternative proteins. We can improve slaughter methods.

  With nematodes in the topsoil, we currently lack the agency to intervene without causing catastrophic ecological collapse. To include them in our *practical* remit today would be performative, not effective. We draw the line at insects not because we are certain nematodes don't count, but because insects are the frontier where moral concern meets human capacity. We must walk before we can run. Acknowledging the nematode problem doesn't invalidate the insect case; it simply defines the boundary of our current competence.

  But there is a second, deeper objection. It is the fear of paralysis.

  If we always defer to tiny probabilities of astronomical goods—or in this case, astronomical harms—do we not risk abandoning the modest, near-certain improvements this organisation actually delivers? This is a version of Pascal's Wager applied to altruism. If the numbers are big enough, they swamp everything else. Does this not imply that our work for pigs and chickens is a rounding error?

  I want to be absolutely clear: **It does not.**

  And if our math suggests it does, our math is missing a variable. That variable is *certainty*.

  The suffering of a farmed pig is not a probability. It is a fact. We know they are sentient. We know they suffer. We know how to help them. In the moral calculus, certainty carries a premium. A certain hell is more urgent than a probable purgatory, even if the purgatory contains more souls.

  If we allow the speculative stakes of insect welfare to cannibalise the certain stakes of vertebrate welfare, we have failed. We cannot become so obsessed with the potential suffering of the quadrillions that we neglect the actual suffering of the billions.

  So, why include insects at all?

  We include them because "rounding error" is how atrocities persist. For decades, the suffering of fish was treated as a rounding error by the broader animal movement. The assumption was that their experience was too alien, too faint. That delay cost billions of lives.

  We include insects because we are an organisation dedicated to *reducing suffering*, not just *managing our comfort levels*. To ignore a potential source of massive suffering simply because it is complex, or because it challenges our existing focus, is a form of moral cowardice.

  We can hold two thoughts in our heads at once. We can say: "The work we do for cows is urgent and certain," and "The work we might do for insects is speculative but high-stakes."

  This is not a zero-sum game. It is an expansion of our moral horizon.

  To the veterans in the room: I am not asking you to believe that a cricket matters exactly as much as a calf. I am asking you to admit that a cricket might matter *at all*. And if it matters at all, the numbers demand we look.

  To the scientists in the room: We need your rigour. We need you to keep us honest. If the evidence for sentience fades, we must be willing to step back. We are not committing to a dogma; we are committing to a hypothesis that requires testing.

  To our lay members: You support us because you believe kindness should not have arbitrary borders. This is the next border. It is messy. It is uncertain. But it is real.

  We are not here to solve every moral problem in the universe today. We are here to ensure that as our knowledge grows, our compassion grows with it. We will not abandon the animals we know to save the animals we suspect. But we will no longer pretend that the animals we suspect do not exist.

  Let us do the certain work with courage. And let us do the uncertain work with humility. Let us build an organisation that is robust enough to handle the complexity of the world as it is, and brave enough to prepare for the world as we are coming to understand it.

  Thank you.
