answer: |-
  Here is a teaching plan designed for a 90-minute graduate seminar. It prioritizes the logical dependencies of the concepts and uses a single, evolving example to prevent cognitive fragmentation.

  ### 1. Explicit Exclusions (State these at the outset)
  To keep the session focused on the epistemic norm rather than the formal generalizations, explicitly tell students you are **deferred** the following:
  *   **Measure-theoretic generalities:** We are working with finite partitions.
  *   **Relative Entropy (Min-KL):** We will not derive JC as the solution to minimizing information distance; that is a justification *for* the rule, not the rule's internal logic.
  *   **General Conditional Constraints:** We will not solve the "edge case" at the end. We will stop precisely where JC fails, to mark the boundary of its competence.

  **Why:** These topics invite students to view JC as a mathematical optimization problem rather than an epistemic norm for uncertain perception. You want them to feel the *need* for the rule, not just its elegance.

  ### 2. The Single Carrying Example: "The Dimly Lit Gallery"
  Do not use the standard diagnostic-test example.
  *   **Why not Diagnostic Tests:** Diagnostic tests frame evidence as a report ($T+$) with known likelihoods ($P(T+|H)$). This invites students to treat the report as a certain proposition ($P(T+)=1$) and apply standard Conditionalization, or to confuse likelihoods with posterior weights. It obscures the phenomenological uncertainty JC is meant to capture.
  *   **The Gallery Scenario:** An agent is in a gallery with two wings (**Left**, **Right**). In each wing, a painting can hang at two heights (**High**, **Low**). This creates a four-cell partition: $L_H, L_L, R_H, R_L$.
  *   **Why this works:**
      1.  **Phenomenology:** It models perception directly (vision is dim) rather than testimony (a lab report).
      2.  **Partition Flexibility:** You can easily shift weights on the Wings ($\{L, R\}$) without changing the Heights, or vice versa.
      3.  **Edge Case Compatibility:** It naturally supports the final constraint problem (relations between Wing and Height) without changing the vocabulary.

  ### 3. Sequence and Dependencies (90 Minutes)

  #### Phase I: The Breakdown of Conditionalization (0–15 mins)
  *   **Setup:** Assign priors over the four cells (e.g., uniform 0.25 each).
  *   **The Event:** The agent looks at the wall. The lights are dim. She does not become certain she is in the Left Wing. She does not become certain she is in the Right Wing.
  *   **The Shift:** Her experience shifts her confidence. She is now 0.7 confident she is in the Left Wing ($P_{new}(L) = 0.7$) and 0.3 confident she is in the Right ($P_{new}(R) = 0.3$).
  *   **The Problem:** Ask students to apply standard Conditionalization.
      *   *Question:* "What proposition $E$ has $P_{new}(E) = 1$?"
      *   *Result:* There is none. If they pick $L$, they violate the description of the experience. If they pick a disjunction, they cannot derive the specific 0.7/0.3 split.
  *   **Pedagogical Goal:** Make standard Conditionalization feel *inadequate*, not just inconvenient. The norm requires certainty; the experience provides only a shift.

  #### Phase II: The Jeffrey Rule and Input/Output Distinction (15–35 mins)
  *   **Derivation:** Ask: "If the experience only affects our confidence in Left vs. Right, what should happen to our confidence in High vs. Low *within* those wings?"
      *   Elicit the intuition: The relative likelihood of High vs. Low shouldn't change just because the lighting changed our view of Left vs. Right.
      *   Formalize **Rigidity**: $P_{new}(H | L) = P_{old}(H | L)$ and $P_{new}(H | R) = P_{old}(H | R)$.
  *   **The Formula:** Construct the weighted average. $P_{new}(H) = P_{old}(H|L)P_{new}(L) + P_{old}(H|R)P_{new}(R)$. Generalize to the JC formula.
  *   **CRITICAL INTERVENTION (Misconception: Inputs vs. Outputs):**
      *   Draw a box around $P_{new}(L)$ and $P_{new}(R)$ on the board.
      *   **Say:** "These numbers do not come from this formula. They come from the *experience*. This rule takes them as **inputs**. If you try to calculate these weights using the rule, you are misusing it."
      *   **Why:** Students predictably treat the new partition probabilities as outputs to be computed from priors and likelihoods.

  #### Phase III: Rigidity and the "Credence Proposition" Trap (35–55 mins)
  *   **The Temptation:** Ask: "Why not just treat the proposition 'My credence in Left is 0.7' as certain evidence and Conditionalize on that?"
  *   **The Refutation:**
      1.  Let $X$ be the proposition "My credence in Left is 0.7".
      2.  If we Conditionalize on $X$, we set $P_{new}(X) = 1$.
      3.  **Check Rigidity:** Does $P_{new}(H | L) = P_{old}(H | L)$ hold when we Conditionalize on $X$?
      4.  **Show Failure:** Learning facts about your own psychology ($X$) can screen off or alter the connection between the world ($L$) and other facts ($H$). Rigidity is a substantive constraint on *how* the evidence bears on the partition, not a logical truth.
  *   **Pedagogical Goal:** Sever the link between JC and "Conditionalization on a credence report." JC is a distinct norm because it preserves conditional probabilities that standard Conditionalization on a report would disrupt.

  #### Phase IV: Successive Updates and Non-Commutativity (55–70 mins)
  *   **Scenario:** A second shift occurs. Now the agent gets information about Heights ($\{H, L\}$) independent of the Wings.
  *   **Task:** Update Order A (Wings then Heights) vs. Order B (Heights then Wings).
  *   **Result:** Show that $P_{final}(Cell) \neq P_{final}'(Cell)$.
  *   **Dependency:** This relies on them understanding that the *partition weights* are inputs. If they change the order, they change the base upon which the second rigidity constraint is applied.
  *   **Misconception Check:** Head off the idea that rational updates must commute. Explain that with uncertain evidence, the *path* of learning matters because the rigidity constraint applies to the conditional probabilities *at the time of the update*.

  #### Phase V: The Edge Case (The Silence of the Rule) (70–85 mins)
  *   **Setup:** Return to the four cells: $L_H, L_L, R_H, R_L$.
  *   **The Constraint:** The agent receives information that bears on the *relation* between Region and Position.
      *   *Information:* "You are in the Left Wing, OR ELSE you are at the Low position in the Right Wing." (Effectively: $R_H$ is impossible, or $P_{new}(R_H) = 0$).
      *   *Alternative (closer to prompt):* "The lighting condition tells you that *if* you are in the Right Wing, you are certainly Low ($P_{new}(L | R) = 1$), but it gives you no information on how likely you are to be in the Right Wing."
  *   **The Problem:** Ask students to apply JC.
      *   To use JC on the partition $\{L, R\}$, they need $P_{new}(L)$ and $P_{new}(R)$. They do not have these.
      *   To use JC on the partition $\{H, L\}$, they need $P_{new}(H)$ and $P_{new}(L)$. They do not have these.
      *   They have a constraint on a *conditional* probability ($P_{new}(Low | Right)$), not a *marginal* probability over a partition.
  *   **The Silence:** Do not solve this. Do not offer Williams Conditioning or Min-KL.
  *   **Statement:** "The rule is silent here. JC requires the experience to deliver probabilities over a partition. When the experience delivers a constraint on a conditional probability, JC has no purchase. To solve this, you would need a *further* principle (like minimizing information distance), but that is not Jeffrey Conditionalization."
  *   **Goal:** Make the boundary of the rule's competence vivid.

  #### Phase VI: Final Check (85–90 mins)
  *   **The Task:** Present a fresh, short case.
      *   *Case:* "An agent observes a gauge. The observation is described *only* by likelihoods: $P(Observation | State_A) = 0.9$ and $P(Observation | State_B) = 0.1$. The agent does not become certain of the Observation."
      *   *Question:* "What is the agent's new credence in $State_A$?"
  *   **Desired Response:** A student who understands the rule will say: **"I cannot answer this."**
      *   *Reasoning:* JC requires the *posterior* probability of the evidence partition ($P_{new}(Obs)$) as an input. Likelihoods ($P(Obs|State)$) are not inputs for JC; they are inputs for Bayes' Rule (which requires $P(Obs)=1$). Since the evidence is uncertain, we need the direct shift in $P_{new}(Obs)$, which is not provided.
  *   **Success Metric:** If a student attempts to calculate a number, they have treated likelihoods as JC inputs (Misconception) or reverted to standard Conditionalization (Misconception). If they identify the missing input, they understand what the rule *is*.

  ### 4. Misconception Map & Intervention Points

  | Misconception | Predicted Point of Formation | Intervention Strategy |
  | :--- | :--- | :--- |
  | **JC is just C on a credence proposition.** | Phase III (after rule is stated). | Show that Conditionalizing on "My credence is $x$" violates Rigidity. Rigidity is substantive, not automatic. |
  | **Rigidity is automatic/bookkeeping.** | Phase II (during derivation). | Emphasize that learning $E$ *could* change $P(H|E)$ (e.g., if $E$ is "I am hallucinating"). JC *stipulates* it doesn't. |
  | **Partition probabilities are outputs.** | Phase II (during formula presentation). | **Box the inputs.** Verbally state: "The rule does not tell you what your new credence in the partition is; the experience does." |
  | **Successive updates commute.** | Phase IV (during non-commutativity). | Run the numbers on the board. Show $A \to B \neq B \to A$. Explain that rigidity applies to the *current* state, which changes with order. |
  | **JC absorbs any constraint.** | Phase V (The Edge Case). | **Refuse to solve it.** Let the silence hang. Explicitly state JC cannot handle conditional constraints. |
  | **JC is uniquely DB-forced.** | Phase I or Conclusion. | Qualify the DB argument. Unlike C, JC's DB arguments depend on the specific rigidity assumption and are more contested. |

  ### 5. Instructor Notes for Delivery
  *   **Board Management:** Keep the "Gallery" partition on the board for the entire 90 minutes. Do not wipe it. This reinforces that the *structure* remains constant while the *norms* applied to it change.
  *   **Pacing:** The biggest risk is spending too long on the derivation in Phase II. Keep the algebra minimal; focus on the *weighted average* intuition. Save time for Phase V (The Edge Case), as that is where the deepest epistemological insight lies.
  *   **Tone:** When you reach the Edge Case, resist the urge to be helpful. If students ask "But what *should* they do?", answer: "That is a question for a different seminar. Today, we learn where this rule stops."
