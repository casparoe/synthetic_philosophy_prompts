  ### Candidate Principles at Work

  Before rendering a verdict on your colleague, we must isolate the epistemic machinery your friend is operating. Her seven previous verdicts are not random; they map precisely onto the classical Nyāya ontology of knowledge (*pramāṇa-śāstra*), but they allow for subtle variations in how the boundaries of "Inference" are drawn.

