  **Principle A: The Fourfold Reduction with Causal Necessity (Standard Navya-Nyāya)**
  This principle holds that there are exactly four instruments of knowledge: Perception, Inference, Comparison, and Testimony. Any cognition that is valid (*pramā*) must be generated by one of these.
  *   **Why Memory fails:** Memory is excluded not because it is false, but because it lacks novelty (*anadhigatatva*); it reproduces past content rather than revealing a new object.
  *   **Why Absence is Perception:** Absence is an objective reality (*abhāva*) directly grasped by the senses when the locus is perceived, so no fifth instrument is needed.
  *   **The Crucial Mechanism for Inference:** Inference (*anumāna*) requires a logical connection (*vyāpti*) between a reason (*hetu*) and a conclusion (*sādhya*). However, this connection need not be a simple empirical generalization ("All smoke has fire"). It can be a causal or necessary relation ("Stoutness requires caloric intake"). Even if the observer has not verbally formulated the universal principle, if the cognition arises from grasping a necessary connection to explain an anomaly, it counts as Inference. This principle subsumes what other schools call "Presumption" (*arthāpatti*) under Inference.

  **Principle B: The Strict Empirical Regularity Rule**
  This principle agrees on the four instruments and the exclusion of memory, doubt, and error. However, it imposes a stricter condition on Inference.
  *   **The Crucial Mechanism for Inference:** For a cognition to count as Inference, the *vyāpti* (pervasion) must be established *prior* to the current case through multiple independent observations (*bhūyodarśana*). The generalization cannot be derived *from* the single case at hand. If the only evidence for the rule is the very instance being explained, the reasoning is circular. It may be a hypothesis (*tarka*), but it does not yield certain knowledge (*pramā*).

  Both principles explain why Smoke/Fire is knowledge (established regularity), why Testimony is knowledge (established trust), and why Memory is not (lack of novelty). They part company only when the "rule" is discovered *in* the single case rather than applied *to* it.

