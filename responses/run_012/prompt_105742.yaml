  2.  **Initial Brainstorming & Mapping:**

      *   *Tuskegee Context:* 400+ Black men, untreated syphilis, US Public Health Service (USPHS), rural Alabama. Rumors existed locally and within the Black community for decades. Jean Heller broke the story in 1972.
      *   *Generalism (e.g., Sunstein & Vermeule, Coady):* Conspiracy theories are inherently suspect. They are self-sealing. Large groups can't keep secrets.
      *   *Particularism (e.g., Keeley, Basham):* Don't judge the class, judge the instance. Some conspiracies happen (Watergate, Tuskegee).
      *   *The "Suspicion":* Was it a specific theory ("USPHS is withholding penicillin to study death rates") or a general distrust ("The government doesn't care about Black bodies")? The prompt suggests the latter might be more accurate.
      *   *The Twist:* If the suspicion was a "diffuse judgment," does the Generalist/Particularist framework even apply?
      *   *Reverse Lens:* Tuskegee is a *real* conspiracy. Generalists say real conspiracies are rare. Particularists say they happen. But Tuskegee wasn't believed *because* it was dismissed as a conspiracy. This suggests the *label* "conspiracy theory" functions as a silencer, regardless of truth.
      *   *Burden of Proof:* Does Tuskegee shift the burden to the skeptic when power asymmetries exist?
      *   *Conclusion:* "Conspiracy theory" isn't a neutral epistemic category; it's a social tool. Tuskegee is an anomaly for the *debate* because the debate assumes a level playing field of evidence that didn't exist.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the scene. Tuskegee is usually ethics, now it's epistemology. Define the stakes: the tension between rational skepticism and historical reality.
