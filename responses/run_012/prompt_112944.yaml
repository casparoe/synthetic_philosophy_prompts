prompt: |-
  ok so I'm a couple years into my PhD and I'm writing a chapter where I have to say something sensible about the multiple drafts stuff, and every time I try to state the position it comes out either trivial or obviously false, which I'm pretty sure means I don't actually understand it. So help me out: write a dialogue between two people, one defending a broadly Cartesian-theater picture of consciousness and one defending the multiple drafts model.

  But please don't do the standard version of this, where the theater guy is a cartoon homunculus fan and gets dunked on. I want the strongest version of each side, and I want the fight to be about one specific thing rather than consciousness in general.

  Heres the case I want it built around. A masking experiment: target flashes, mask comes ~40ms later, subject reports seeing nothing. The drafts person says: fine, the target content got fixed in some draft or other, but whether it was "experienced" and then overwritten on the way out, or whether the mask stopped it from ever being experienced on the way in, is not a distinction reality makes — there's no fact of the matter there, and no experiment could pull those two apart, not even in principle. Now imagine someone runs a decoding study and on the no-report trials can read a signal out of the brain that looks like the target's content. Theater guy says: there's your experience, right there, we found it, and now we can ask whether the mask edited it going in or coming out. The drafts person has to explain why that isn't a win. Make that exchange the heart of the dialogue.

  Requirements: both have to be competent, and the theater defender should get the real arguments — the unity of consciousness, the fact that the subject gives one report and not two, the suspicion that if drafts is right then "experience" stops doing any work. The drafts defender should concede something real at some point, and should say what it actually means for a content to become "famous in the brain" rather than just gesturing at it. They should actually answer each other's points rather then talk past each other. At the end I want them to land on either "here's the result that would settle it" or "nothing could", and say why, and I'd like them to disagree about which of those it is. No citations or name-dropping, argue from the case itself. And don't let them resolve it into "we're just talking about different things", because I don't think that's true here and it's a cop-out. 1000-1500 words.
