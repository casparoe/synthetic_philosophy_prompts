answer: |-
  **Alex:** Let's stick to the masking case. Target flashes, mask follows at forty milliseconds. Subject says, "I saw nothing." Standard interpretation: the mask interrupted the processing before it became conscious.

  **Jordan:** Right. And the Multiple Drafts view says asking *when* it was interrupted is the mistake. There's no finish line where processing turns into experience. There's just content being revised until it's either used for a report or discarded.

  **Alex:** But now we have the decoding study. On the no-report trials, where the subject says they saw nothing, we can still read out the target's orientation from early visual cortex. The signal is there. It's robust. So, the content was represented. Now I ask you: was it experienced and then overwritten, or never experienced at all?

  **Jordan:** I say there's no fact of the matter.

  **Alex:** That's the triviality I'm worried about. Look at the data. The brain encoded the target. If you accept that neural representation is the substrate of mind, then something mental happened. If the subject doesn't report it, either the experience faded from memory, or it never happened. Those are different physical histories. If the signal reached a certain threshold of stability before the mask hit, surely that counts as a moment of presence?

  **Jordan:** It counts as a moment of *processing*. You're conflating content availability with phenomenal presence. Just because I can decode "vertical bar" from V4 doesn't mean the system *owned* that content. It means the system was computing it. For it to be experienced, in the sense that matters for the subject, it has to become "famous in the brain."

  **Alex:** And what does "famous" mean if not "present in the theater"? You're just swapping metaphors.

  **Jordan:** No, it's functional. Fame means broadcast availability. It means the content is accessible to memory systems, motor planning, and verbal report simultaneously. In the masking case, the decoding shows the content existed locally. But the mask prevented it from being broadcast globally. It never became famous. It was a rumor that died in the hallway.

  **Alex:** But here's the problem with that. The subject gives *one* report. "I saw nothing." They don't say, "I saw something but forgot," or "Part of me saw it." The unity of consciousness is singular. If there were multiple drafts circulating—one where the target is seen, one where it's masked—why is the outcome so perfectly unified? There has to be a point where the competition ends and the winner is declared. That declaration is the experience. The decoding signal is the candidate; the report is the verdict. You need the verdict to match the candidate for experience to exist.

  **Jordan:** I'll concede the unity of the report. That's real. The output is singular. But you're assuming the unity of the output requires a unity of the underlying state *before* the output. I'm saying the unity is imposed by the bottleneck of the report itself. The brain settles on a story to tell. Whether the target content was "experienced" prior to that settlement is where you're positing a ghost step.

  **Alex:** It's not a ghost step, it's causal power. If experience is real, it has to do work. If the decoding signal is there, but the subject acts as if it isn't, then the signal had no causal power over the subject's behavior or memory. If you say there's "no fact of the matter" about whether it was experienced, you're saying experience doesn't track the physical state of the brain. You're making experience epiphenomenal. If the signal is there, and experience is real, then something felt it. If nothing felt it, then the signal wasn't experience. Which is it?

  **Jordan:** Okay, here's the concession: There is a real difference in the brain between the trials where the content gets broadcast and the trials where it dies locally. I'm not denying the physics. I'm denying that nature draws a line across that physics and labels one side "phenomenal" and the other "non-phenomenal" in the way you want. You want to know if the light turned on before it was switched off. I'm saying the light *is* the switching.

  **Alex:** But then what does "famous" actually pick out? If it's just "available for report," then you've defined experience away. You've made it synonymous with "remembered report." That leaves out the immediacy of the feeling. I can feel something and fail to report it.

  **Jordan:** Can you? In the masking case, you claim you can. But how do we check? We check the report. If you say you didn't see it, and we find a trace, you're insisting the trace was "lit up" phenomenally even though it didn't light up any downstream systems. That's what I call the Cartesian residue. You want the feeling to be a private glow that doesn't necessarily connect to anything else. I'm saying the glow *is* the connection.

  **Alex:** So if I run a better decoding study, and I find a signal that correlates perfectly with subjective report—even on trials where the subject hesitates or corrects themselves—you still won't admit that's the boundary of experience?

  **Jordan:** If you find a signal that predicts the report perfectly, I'll admit that's the neural correlate of the *judgment* of experience. I'll admit it's the point of fame. But you want to say that signal *creates* the experience. I say the signal *is* the experience, distributed over time. There isn't a moment before the signal stabilizes where the experience was "happening" and then got deleted.

  **Alex:** This is where we break. I think there is a result that could settle this. If we can isolate a neural signature that occurs *before* the mask interference but *after* the target onset, and show that whenever that signature occurs, the subject later claims awareness—even if the mask suppresses the report—we prove that experience happens upstream of the broadcast. We prove the theater exists, even if the curtain falls early.

  **Jordan:** And I say that result is impossible in principle. Because any signature you find, I can ask: "Was that signature itself experienced, or was it just another draft?" You'll point to a later signature that correlates with report. I'll say that's just the fame threshold. You can keep pushing the correlate earlier, but you'll never find a point where the brain says "this is real" rather than "this is processed." The question "was it experienced?" is only answerable by "was it used?"

  **Alex:** So you're saying we're stuck?

  **Jordan:** I'm saying the question assumes a boundary nature doesn't respect. You want a binary switch: Experience On/Off. The brain is a fading echo. The decoding signal is the echo. You're asking if the echo was "heard" before it faded. I'm saying the fading is all there is.

  **Alex:** But that leaves the subject out of it. If the fading is all there is, then the subject's insistence that "I saw nothing" is the only truth. But if the decoding shows the content was there, stable and distinct, then the subject is wrong about their own mind. They had the content, but you're telling me it's meaningless to ask if they felt it. That makes the first-person perspective an illusion.

  **Jordan:** It makes the first-person perspective a summary, not a microscope. The subject isn't wrong. They're reporting the final draft. The draft before that wasn't "them" yet.

  **Alex:** Then we disagree on the stakes. I think if you're right, experience loses its explanatory power. It becomes just a label for "successful report." I think there's a fact of the matter about whether the light was on, even if no one wrote it down.

  **Jordan:** And I think you're looking for a fact that requires a viewer inside the head to check the light. There's no one there. There's just the light switching, and the switching off. The decoding shows the switch moved. It doesn't show anyone saw it.

  **Alex:** So no experiment settles it.

  **Jordan:** No experiment settles it, because every experiment produces data that needs to be interpreted as experience or not. You'll always interpret the early signal as "phenomenal." I'll always interpret it as "pre-phenomenal processing." The data won't tell us which label to stick on it.

  **Alex:** Then I'll keep looking for the signal that forces the label.

  **Jordan:** And I'll keep showing you how the label is just another draft.
