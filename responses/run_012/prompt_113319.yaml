prompt: |-
  I sit on the animal-welfare advisory panel of a food company that is scaling up insect protein, and our welfare code currently covers only vertebrates. The board wants to know whether to bring the crickets and black soldier fly larvae at our new rearing site under the code; that site will process on the order of 40 million larvae a week, and stunning before processing plus lower stocking density would raise our cost per kilogram by roughly 6% and cut throughput by about a tenth. The panel chair proposes a framework that multiplies the number of individuals by a credence in insect sentience — one in a thousand times forty million — and calls the product a very large expected welfare loss; one member objects that the credence belongs to the taxon as a whole rather than to each insect, so the panel faces a single lottery rather than forty million small independent bets; another calls the whole exercise a category error that would inflate the currency of moral concern. Please draft the short written opinion I will table at Thursday's meeting. It should recommend a concrete course of action with a timetable — whether to adopt the chair's framework, what conditions the site must meet, and by when — take a side on the aggregation and lottery objections rather than merely listing them, give the strongest consideration on the losing side its due, and state what evidence would make the panel revise.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **Role:** Member of an animal-welfare advisory panel for a food company scaling up insect protein.
      *   **Context:** Current welfare code covers only vertebrates. New site processes ~40 million larvae/week (crickets/black soldier flies).
      *   **Proposal:** Board wants to know if insects should be included.
      *   **Cost/Impact:** Stunning + lower density = +6% cost/kg, -10% throughput.
      *   **The Debate:**
          *   *Chair's Framework:* Expected Value (EV) approach. $40,000,000 \times (1/1000 \text{ sentience credence}) = \text{Large Expected Welfare Loss}$.
          *   *Objection 1 (Lottery/Aggregation):* Credence applies to the taxon, not individuals. It's one big lottery (are *any* insects sentient?), not 40 million small bets.
          *   *Objection 2 (Category Error):* Inflating moral currency, treating insects like vertebrates is conceptually wrong.
      *   **Task:** Draft a short written opinion for Thursday's meeting.
      *   **Requirements:**
          *   Recommend a concrete course of action with a timetable (Adopt framework? Conditions? When?).
          *   Take a side on the aggregation/lottery objections (don't just list them).
          *   Give the strongest consideration on the losing side its due (steelman the opposition).
          *   State what evidence would make the panel revise.

  2.  **Determine the Stance:**
      *   *Ethical/Pragmatic Balance:* As an advisory panel member, I need to balance moral risk with business viability. Ignoring 40 million creatures/week based on a technicality regarding probability aggregation seems risky given the "Precautionary Principle."
      *   *The Math:* The Chair's EV approach ($\text{Individuals} \times \text{Probability}$) is the standard way to handle moral uncertainty in effective altruism and policy. The "Lottery" objection (it's all or nothing for the taxon) is philosophically interesting but practically paralyzing. If there's a 0.1% chance they feel pain, causing pain to 40 million of them is still worse than causing pain to 1 of them, *if* they turn out to be sentient. The expected disutility scales with numbers.
      *   *Decision:* Support the Chair's framework (EV approach) but modify the implementation to be phased. Recommend adopting the welfare code for insects.
      *   *Why?* The cost (6%) is manageable for a scaling company. The moral risk of ignoring 40 million potential sentient beings is too high.
      *   *Addressing Objections:*
          *   *Lottery:* Acknowledge the logical point (sentience is a binary property of the clade), but reject its moral implication. Even if it's a "single lottery," the *stakes* of losing that lottery are multiplied by the number of victims.
          *   *Category Error:* Acknowledge that insect experience differs from vertebrates, but deny that this justifies zero protection.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary/Recommendation:** Clear and direct. Adopt the code, phased implementation.
      *   **The Core Argument (Taking a Side):** Address the Chair's framework vs. the Lottery Objection.
          *   *Chair:* $N \times P$.
          *   *Lottery:* $P \times (\text{Total Harm})$.
          *   *Resolution:* Mathematically similar in outcome, but the Chair's framing emphasizes individual moral weight. I need to explicitly support the Chair's aggregation logic because moral risk scales with the number of affected entities, regardless of whether sentience is a "switch" for the whole group. *Correction:* Actually, the "Lottery" objection argues that if insects *aren't* sentient, 40 million don't matter. If they *are*, 40 million matter. The Expected Value is the same ($0.001 \times 40M$ vs $0.001 \times 1 \times 40M$). Wait, the objection says "credence belongs to the taxon... single lottery." This implies we shouldn't multiply $N \times P$. But in decision theory, Expected Utility = Probability $\times$ Utility. If Utility scales with $N$, then $P \times (N \times \text{harm})$ is the same as $N \times (P \times \text{harm})$. The objection seems to suggest we shouldn't count the $N$ if the $P$ is uncertain? No, it suggests the uncertainty isn't per individual.
          *   *Refined Stance:* I will support the Chair's framework. The "Lottery" objection confuses the *source* of uncertainty with the *magnitude* of harm. Even if sentience is a binary trait of the clade, the *amount* of suffering depends on the number of individuals. Therefore, the expected moral cost scales with population size.
      *   **The Category Error:** Acknowledge that insect welfare metrics (stocking density, stunning) might need to be species-specific, not just vertebrate metrics copy-pasted. This gives the objection its due.
      *   **Concrete Action Plan:**
          *   Adopt the code.
          *   Timeline: 12 months for full compliance (allows for tech adjustment).
          *   Condition: Research partnership to refine stunning methods (addressing the "category error").
      *   **Revision Clause:** What evidence changes minds? Definitive proof of non-sentience (unlikely) or proof that stunning causes *more* suffering (possible).

  4.  **Refining the Tone:**
      *   Professional, decisive, ethical but business-aware.
      *   Needs to sound like a panel member speaking to a board/panel.
      *   Keep it short (as requested).

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Say yes to insects in code.
      *   Chair is right on the math. Even if it's a taxon-wide lottery, the payout (suffering) is huge.
      *   Cost is only 6%. We can afford it.
      *   Give the "Category Error" person credit: Insects aren't mammals. We need specific science, not just copying vertebrate rules.
      *   Timeline: 1 year.
      *   Revisit if science changes.

  6.  **Drafting - Iteration 2 (Fleshing out the arguments):**
      *   *On Aggregation:* The "Lottery" objection claims we face one bet: Are insects sentient? Yes/No. But if "Yes," the harm is $40M \times \text{pain}$. So Expected Harm = $P(\text{Yes}) \times 40M \times \text{pain}$. The Chair's formula ($40M \times P(\text{Yes}) \times \text{pain}$) yields the same result. The objection fails to reduce the moral weight. I will side with the Chair.
      *   *On Category Error:* Valid point that we don't know *how* they feel pain. Stunning methods for cows might not work for crickets. So, adopt the code *in principle*, but mandate R&D for *method*.
      *   *Recommendation:* Include insects. 6% cost is the price of moral insurance.

  7.  **Final Polish (checking constraints):**
      *   *Concrete course of action?* Yes (Adopt code, phased).
      *   *Timetable?* Yes (12 months).
      *   *Take a side?* Yes (Support Chair/Aggregation).
      *   *Steelman losing side?* Yes (Acknowledge taxonomic uncertainty and morphological differences).
      *   *Revision evidence?* Yes (New neurobiological data).

  8.  **Writing the Document:** (Self-Correction during drafting: Ensure I don't get too bogged down in the math. Keep it policy-focused.) *Make sure to explicitly mention the 6% cost and 10% throughput as acceptable trade-offs.*

      *   *Subject:* Recommendation on Invertebrate Welfare Inclusion.
      *   *Opening:* Direct recommendation.
      *   *Argument:* Address the probability debate. Support the Chair. Explain why the "Lottery" view doesn't absolve us.
      *   *Nuance:* Address the "Category Error." We need insect-specific science.
      *   *Plan:* 12-month rollout.
      *   *Review:* What changes our mind?

  9.  **Final Review against constraints:**
      *   Short written opinion? Yes.
      *   Concrete course of action? Yes.
      *   Timetable? Yes.
      *   Take a side on aggregation/lottery? Yes.
      *   Strongest consideration to losing side? Yes.
