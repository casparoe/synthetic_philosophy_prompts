      *(Self-Correction on the "Lottery" Objection)*: I need to be careful. The objection says "credence belongs to the taxon... single lottery." If I bet on a coin flip, I don't multiply the bet by the number of people watching. But here, the *harm* happens to the individuals. If the coin lands "Sentient," 40 million suffer. If "Not Sentient," 0 suffer. Expected Suffering = $0.001 \times (40M \times \text{suffering}) + 0.999 \times 0$. The Chair says $40M \times (0.001 \times \text{suffering})$. The math is identical. The objection tries to suggest that because the probability isn't *per insect*, we shouldn't aggregate the count. But that's false because the *consequence* aggregates. I will argue this clearly.

      *(Refining the "Category Error")*: The concern is that applying vertebrate metrics (like "stocking density" defined by space per kg) might not map to insect welfare. I should recommend adapting the code, not just copying it.

      *(Final Plan)*:
