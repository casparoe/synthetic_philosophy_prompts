answer: |-
  **TO:** Animal-Welfare Advisory Panel
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Inclusion of Invertebrates in Welfare Code

  **Recommendation**
  I recommend the panel advise the Board to extend the welfare code to cover *Acheta domesticus* (crickets) and *Hermetia illucens* (black soldier fly larvae) at the new rearing site. Implementation should be phased over 12 months, with full compliance required by Q4 2024. The projected 6% cost increase and 10% throughput reduction are acceptable premiums for moral risk mitigation.

  **Decision Framework: Aggregation vs. Lottery**
  I support the Chair's expected-value framework over the "single lottery" objection. The objection correctly notes that sentience is likely a binary trait of the taxon rather than an independent roll for each individual. However, it incorrectly infers that this limits our moral liability. Even if the "lottery" is drawn once for the clade, the *stakes* of that draw are determined by the number of individuals affected. If the coin lands on "sentient," 40 million individuals suffer, not one. Therefore, the expected moral cost scales with population size ($P \times N \times \text{Harm}$), mathematically converging with the Chair's model ($N \times [P \times \text{Harm}]$). To treat 40 million potential subjects as a single unit because their sentience status is correlated is a category error in risk assessment, not a correction of one.

  **Addressing the "Category Error" Objection**
  The member arguing that this exercise inflates the currency of moral concern raises a vital implementation caveat. We cannot simply copy-paste vertebrate metrics onto invertebrates. Insect nociception and stress responses differ morphologically and neurobiologically from mammals. A stocking density appropriate for a calf is not arithmetically scalable to a larva.
  *Concession:* We must acknowledge that current welfare indicators (e.g., behavioral markers of distress) are less validated for insects. Applying vertebrate standards without adaptation risks performative compliance rather than actual welfare improvement.

  **Action Plan & Timetable**
  1.  **Adoption:** Formally include invertebrates in the code immediately.
  2.  **R&D Condition:** The 12-month implementation window is conditional on establishing a research partnership to validate stunning methods. Thermal or electrical stunning effective for vertebrates may cause prolonged distress in insects. We must verify that our "stunning" actually renders insensibility before processing.
  3.  **Milestones:**
      *   *Month 3:* Audit of current stunning and density protocols against emerging entomological welfare science.
      *   *Month 6:* Pilot of adjusted protocols on 10% of throughput.
      *   *Month 12:* Full compliance across the site.

  **Criteria for Revision**
  This recommendation stands unless new peer-reviewed evidence demonstrates either:
  1.  **Definitive Non-Sentience:** Neurobiological consensus that the specific neural structures required for valenced experience are absent in these taxa (currently unlikely).
  2.  **Iatrogenic Harm:** Evidence that the proposed stunning methods induce greater aggregate suffering than the processing methods they replace (e.g., if stunning causes prolonged latent pain without immediate death).

  We cannot wait for certainty on sentience; the scale of operation demands we act on probability.
