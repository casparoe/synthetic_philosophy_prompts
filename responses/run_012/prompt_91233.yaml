answer: |-
  The clay was cold, stiff with the damp sea air that seeped into the studio. Elara wiped her hands on her apron, leaving grey smears against the denim. On the turntable sat the reference photo: Toby, seventeen, smiling in a football jersey. The town wanted a hero. The parents wanted their son.

  Elara looked at the photo, and she saw the length of him.

  It wasn't a ghostly overlay; it was solid. The toddler in the bath towel stood behind the teenager's left shoulder, equally opaque. The infant swaddled in blue lay across the teenager's lap. They occupied the same space, distinct segments of a single, long object that stretched back into the past and forward into a future that had been severed at the waterline. To carve only the seventeen-year-old face felt like carving a hand and labeling it *Man*. It was a fragment pretending to be a whole.

  "You're staring at it like it owes you money," Mark said from the doorway.

  He leaned against the frame, holding two mugs of coffee. He was a long object too. She saw the boy he'd been when they met, twenty-two and sharp-elbowed, standing just behind the man he was now, forty and softer. The boy was the one who had lied about the firm's accounts. The man was the one who had served the probation.

  "It owes me a shape," Elara said, taking the coffee.

  "Mrs. Gable called. She wants to know if the bronze casting is scheduled."

  "Tell her I'm working on the features."

  Mark stepped into the room, navigating the stacks of plaster casts. "Look, about the Henderson situation. Their lawyer called again."

  Elara stiffened. The Hendersons were the ones Mark's younger stage had defrauded. "And?"

  "And I told them I'm not liable for the decisions of the person I was five years ago. I'm not him. I don't even remember signing those papers."

  "You remember enough to spend the money."

  "That was him," Mark said, his voice tightening. "This is me. If I break my leg, I don't apologize for the leg. I heal. Why is moral debt different? That version of me is dead, Elara. You of all people should understand change."

  "I don't understand change," she said, picking up a wire tool. "I see accumulation. You're not a new thing. You're the same thing, extended. The boy who signed is still there, attached to your shoulder. If he stole, you stole."

  "So I pay forever? There's no statute of limitations on being me?"

  "There's no statute on geometry," she said. "The shape includes the error."

  "That's not justice," Mark said. "That's haunting. If I can't apologize because I don't recognize the act, and I can't be punished because I'm not the actor, then what am I supposed to do? Just exist?"

  "Exist honestly," she said.

  "We're not talking about me. We're talking about the Hendersons. They want an apology. I don't have one to give. I don't feel remorse for a stranger's actions."

  "You're not a stranger."

  "We're done," Mark said, setting his mug down on a shelf. "Just... finish the boy, Elara. Don't make it complicated."

  He left. The silence returned, heavier than before. The argument hung in the air, unresolved. He was right that he couldn't feel a pain that wasn't his. She was right that the pain belonged to the object he comprised. Neither could move the other. It was a stalemate of metaphysics, and the Hendersons were still out of pocket.

  Elara turned back to Toby.

  She picked up the clay head. If she sculpted the worm, it would be a blur, a smear of ages impossible to cast in bronze. The town wanted a face they could recognize at the unveiling. They wanted the slice. They wanted to believe that Toby was wholly present in that year, that his death hadn't cut him off but rather completed him.

  To give them the worm would be to tell them the truth: that he was a collection of moments, and only one of them ended in the water. That the toddler was just as dead as the teenager. That grief was not for a loss, but for a truncation.

  She began to work. She smoothed the cheekbones. She sharpened the jaw. She erased the toddler standing behind the ear. She shaved off the infant lying across the brow. She isolated the seventeen-year-old slice, severing the connections, pretending the rest of the log didn't exist.

  It felt like lying. It felt like carving a hand and calling it a man. But clay hardens. Bronze holds its shape. If she made the truth, it would be unreadable. If she made the lie, it would be beautiful.

  She thought of Mark. He would go to the meeting with the Hendersons. He would say he was sorry because his lawyer told him to. He would not mean it, because he didn't own the hand that signed. He would live his life as a series of disconnected slices, claiming innocence for every new moment while dragging the weight of the old ones behind him like a tail he refused to acknowledge.

  Elara worked for three days without sleeping much. When the mold was ready, she sent it to the foundry.

  A month later, she stood in the town square. The bust was unveiled. Bronze gleamed under the grey sky. Mrs. Gable touched the cold metal cheek of her son. She wept, seeing only the seventeen-year-old, wholly present, frozen in glory.

  Elara saw the cut. She saw the jagged edge where the future should have been. She saw the toddler peeking out from behind the bronze ear, ignored by everyone.

  "Beautiful work," the Mayor said, shaking her hand. "You captured him perfectly."

  "I captured what you asked for," Elara said.

  She went back to the studio. Mark was there, packing a bag. He wasn't leaving her, just going to deal with the Hendersons. He looked tired. The boy on his shoulder looked tired too.

  "Did you finish?" he asked.

  "Yes."

  "Good." He zipped the bag. "Maybe... maybe I'll write them a check. Even if I don't remember. Just to close the shape."

  "Okay," Elara said.

  He left. The studio was quiet. Elara swept the clay scraps from the floor. They were just pieces. They didn't owe anything to the block they came from. She put the broom in the corner and sat down at the wheel. She needed to make something new. She needed to make something whole, even if it was only a slice. She turned the wheel on. It hummed, a steady, continuous sound, moving forward without promising to stay the same.
