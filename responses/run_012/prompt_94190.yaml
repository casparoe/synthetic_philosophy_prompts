answer: |-
  This is a superb pedagogical challenge. Your instinct to leverage your taxonomic background is correct: philosophy students often treat categories as pre-existing logical containers, while biologists treat them as hypotheses about natural kinds. Colliding these two approaches is the best way to expose the heterogeneity problem.

  I recommend modifying your sketch slightly. Your idea of "one genuine pair" risks making the other 14 students feel they hold "decoy" cards, which encourages them to discard their data rather than analyze it. Instead, make **all 16 cards valid specimens** of what ordinary language calls "pleasure," but ensure they resist a single necessary-and-sufficient definition. This forces the class to confront the *category* itself, not just find a match.

  Here is the design for the 90-minute session.

  ### Session Title: Specimen Sorting
  **Goal:** To demonstrate the resistance of "pleasure" to classical taxonomy and the trade-offs involved in forcing unity.
  **Materials:** 16 Cards (text below), whiteboard, a tangible "prize" (e.g., a fossil, a nice pen, or a bottle of wine for the end of term), timer.

  ---

  ### I. The Deck (16 Cards)
  Print these on cardstock. Do not label them with types. Each student gets one.
  *Note: The text is first-person, present-tense, focusing on the phenomenology, not the cause.*

  1.  **The Cool Drink:** "My throat is dry and hot. I swallow cold water. The cold spreads down my chest. The burning stops."
  2.  **The Solution:** "I have stared at this equation for three hours. Suddenly the terms align. I feel a sharp click in my mind. I sit back and exhale."
  3.  **The Massage:** "Pressure on my shoulders. My muscles unclench. I feel heavy and warm. I am not thinking about anything."
  4.  **The Win:** "The referee blows the whistle. We have won. My chest swells. I want to shout. I look at my teammates."
  5.  **The Cessation:** "My tooth has throbbed for days. The anesthetic takes hold. The throbbing fades into silence. I feel light."
  6.  **The Laugh:** "My friend tells a joke. My diaphragm spasms. I make a sound. My eyes water. It feels like a release."
  7.  **The Music:** "The orchestra swells. I feel a shiver run down my arms. I feel a longing for something I can't name."
  8.  **The Help:** "I lift the heavy box for the stranger. They smile. I feel a warm glow in my chest. I feel 'good' about myself."
  9.  **The Rival:** "My competitor trips and falls. I feel a quick spike of joy. I suppress a smile. I feel powerful."
  10. **The Flow:** "I am climbing the rock face. I am not afraid. I am not thinking. I am only moving. My hands know where to go."
  11. **The Nostalgia:** "I smell an old book. I remember a childhood room. I feel a sadness, but I want to stay in this feeling."
  12. **The Chemical:** "I ingest the pill. Ten minutes later, the edges of the room soften. I feel detached and universally benevolent."
  13. **The Climax:** "Tension builds in my pelvis. It peaks sharply. It releases. I go limp. For a moment, there is no thought."
  14. **The Plot:** "I read the last page. The mystery is solved. I feel satisfied. I close the book and stare at the wall."
  15. **The Sun:** "I lie on the grass. The sun warms my skin. I feel drowsy. Time seems to slow down."
  16. **The Anxiety Lift:** "I have been waiting for test results. The phone rings. I am clear. The tightness in my stomach vanishes."

  ---

  ### II. Rules & Win Condition
  1.  **The Task:** You are a taxonomic committee. Your goal is to define the **Genus** of these specimens.
  2.  **The Constraint:** You cannot use the word "pleasure," "happy," "enjoy," or "like" in your definition. You must describe the *character* of the experience.
  3.  **The Win Condition:** The group that proposes the **most specific** necessary-and-sufficient condition that covers **all 16 cards** wins the prize.
  4.  **The Catch:** If a single card can be shown to violate your definition, your bid is rejected.

  ---

  ### III. Timeline (90 Minutes)

  **0:00 – 0:10 | Introduction & Distribution**
  *   Hand out cards. Tell them: "These are all reports of a specific type of human experience. Ordinary language groups them together. Your job is to find the biological or phenomenological thread that binds them."
  *   *Crucial Instruction:* "Biology students: Do not appeal to neural mechanisms (dopamine, etc.); you only have the text. Philosophy students: Do not appeal to moral value; focus on the experience."

  **0:10 – 0:30 | Phase 1: Clustering (The Taxonomist's Urge)**
  *   Ask students to stand and mingle. They must find 2–3 other cards that feel "of the same kind" as theirs.
  *   *Observation:* They will likely cluster Sensory (1, 3, 13, 15), Intellectual (2, 14), Relief (5, 16), and Social (4, 8, 9).
  *   Ask them to sit in these clusters. Ask each cluster: "What is the common character?"
  *   *Predictable Outcome:* The Sensory group says "bodily sensation." The Intellectual group says "cognitive resolution." They realize these definitions do not cross-apply.

  **0:30 – 0:50 | Phase 2: The Unified Theory (The Philosophical Urge)**
  *   Shuffle the class back into 4 groups of 4 (mixed cards).
  *   Task: Draft a single definition that covers all 16.
  *   They will iterate.
      *   *Attempt A:* "It feels good." (Banned by rules).
      *   *Attempt B:* "It is the satisfaction of a desire." (Card 15 Sunbathing: no prior desire. Card 11 Nostalgia: desire to not be sad?).
      *   *Attempt C:* "It is a positive phenomenological glow." (Card 5 Cessation: it's just the absence of pain. Card 10 Flow: no self-awareness to feel the glow).
  *   Walk around and act as the "Nature." If a definition excludes a card, tap that card. "Specimen 5 does not fit this rule."

  **0:50 – 1:00 | Phase 3: The Collapse**
  *   Bring the room to plenary. Ask for the best definition.
  *   Write it on the board. Test it against the hardest cards (usually *Schadenfreude*, *Nostalgia*, or *Cessation*).
  *   Demonstrate that to make the definition fit *all* cards, it must become so vague (e.g., "It is a state the subject does not want to end") that it loses explanatory power.
  *   **Declare no winner.** (Or award the prize for the "Least Bad" definition, acknowledging the cost).

  **1:00 – 1:20 | Debrief: Mapping the Frustration**
  *   This is where you name the problem. "You have just encountered the **Heterogeneity Problem**."
  *   Map their failed attempts to three philosophical positions. Write these on the board:

      1.  **Qualitative Hedonism (The Sensory Cluster):**
          *   *Theory:* Pleasure is a specific felt quality (a "glow" or sensation).
          *   *Student Analog:* Trying to define it by how the Sun or Chocolate felt.
          *   *The Cost:* Excludes "cold" pleasures like solving a puzzle or relief from pain. It makes the category too narrow.
      2.  **Attitudinal Hedonism (The Definition Attempt):**
          *   *Theory:* Pleasure is not a feeling, but an attitude of "being glad" that something is happening.
          *   *Student Analog:* Defining it as "a state the subject does not want to end."
          *   *The Cost:* It saves the unity of the category but loses the *feel*. It makes pleasure too cognitive. A dog in the sun feels pleasure, but does it hold an attitude toward a proposition?
      3.  **Disjunctivism / Family Resemblance (The Realization):**
          *   *Theory:* There is no common thread. The word "pleasure" covers a cluster of overlapping similarities (Wittgenstein).
          *   *Student Analog:* Realizing you had to make the definition so vague it was useless.
          *   *The Cost:* It saves the data but kills the theory. If there is no common nature, we cannot build a science of pleasure.

      *   **The Unsatisfying Position (Eliminativism):**
          *   Suggest: "Perhaps 'pleasure' is a folk-psychological error, like 'phlogiston.' There is no such natural kind."
          *   *Student Reaction:* They will hate this. It feels like cheating.
          *   *The Cost:* It solves the classification problem by denying the existence of the specimens.

  **1:20 – 1:30 | The Limitation & Closing**
  *   Address the gap you identified in your prompt.
  *   **Say this:** "Today you proved that there is no single *felt character* common to all these episodes. You failed to find a phenomenal unity. But I must warn you: **Phenomenal heterogeneity does not prove metaphysical heterogeneity.**"
  *   **The Bridge:** "A neuroscientist might argue that while the *feelings* differ, the *mechanism* (e.g., opioid activation in the nucleus accumbens) is identical. Or a functionalist might argue they all serve the same role in learning. You have only shown that the category cannot be defined from the *inside*. Whether it holds together from the *outside* remains an open empirical question."
  *   Dismiss.

  ---

  ### IV. Predictable Failures (First Run)
  1.  **The "Dopamine" Cheat:** Biology students will try to win by citing neurochemistry.
      *   *Fix:* Enforce the rule strictly. "You are a phenomenologist, not a scanner. Describe the *specimen*, not the *microscope*."
  2.  **The Moral Objection:** Students will reject Card 9 (Schadenfreude) or Card 12 (Drugs) as "not real pleasure."
      *   *Fix:* "We are classifying reports of experience, not judging moral worth. If the subject says it is pleasure, it is a specimen."
  3.  **The "Good Feeling" Loop:** Students will define it as "a feeling you like."
      *   *Fix:* Remind them of the constraint. "You cannot use the word to define the word. What *is* the feeling?"
  4.  **Premature Wittgenstein:** A philosophy student might jump to "It's family resemblance!" in minute 15.
      *   *Fix:* "That is a conclusion, not a classification. Can you write a rule for family resemblance that distinguishes pleasure from boredom? If not, keep working."

  ### V. What This Activity Cannot Show (The Limitation)
  You noted you must supply the step that "failure of felt character $\neq$ absence of common property."
  *   **Why:** The activity is phenomenological (first-person). It cannot access third-person physicalism.
  *   **How to Supply It:** In the final 10 minutes, use your taxonomic authority.
  *   **Script:** "In biology, we once classified whales as fish because they looked like fish (phenomenology/shape). We later reclassified them as mammals because of their lineage and lungs (underlying structure). You have spent 90 minutes looking at the 'shape' of these experiences. You found they do not look alike. That does not mean they do not share a 'lung.' Do not leave here thinking pleasure *doesn't exist*. Think that pleasure may not be what it *feels like* it is."

  ### Why This Improves Your Sketch
  Your original sketch relied on a "trick" (one genuine pair). This design relies on a "wicked problem" (all genuine, none matching). This is more respectful to the students' intelligence and better mirrors the actual history of the philosophy of mind. It allows the Biology students to use their taxonomy skills (grouping by traits) and the Philosophy students to use their logic skills (testing necessary/sufficient conditions), only to have both fail for the same reason.
