          *   Card 1: Eating chocolate (Sensory).
          *   Card 2: Solving a hard math problem (Intellectual/Achievement).
          *   Card 3: Painkiller kicking in (Relief).
          *   Card 4: Watching a rival trip (Schadenfreude).
          *   Card 5: Warm bath (Passive/Sensory).
          *   Card 6: Finishing a marathon (Effortful/Endorphin).
