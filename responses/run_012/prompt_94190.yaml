      *(Refining the "Prize")*: The user suggested a prize for stating a single character. I should keep this but make it clear the prize is *unclaimable* under strict scrutiny, or claimable only with a vacuous definition. This mirrors the philosophical trade-off.

      *(Refining the Limitation)*: The user knows they have to supply the step that "no felt character" doesn't mean "no common property." I need to script exactly how they do that without ruining the discovery. Suggestion: Ask "Could a brain scan find a commonality?"

      *(Final Polish)*: Ensure the tone respects the user's expertise (taxonomist) and the students' level (senior seminar).

