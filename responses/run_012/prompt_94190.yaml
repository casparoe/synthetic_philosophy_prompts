      *   *Actually, let's stick closer to the Taxonomist vibe:* "Build a Key." Like a dichotomous key in biology.
      *   *Decision:* Let's hybridize. Start with clustering (taxonomy), move to definition (essentialism), then break it (heterogeneity).

