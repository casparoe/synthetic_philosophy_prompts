  **The Scenario**

  Dr. Aris is a triage physician in a resource-scarce field hospital. Two patients arrive simultaneously: Patient A has a survivable injury; Patient B has a fatal injury. Due to identical presentation, Aris assigns a 50% credence to each being the survivable case. She has one dose of analgesic/sedative. She can either administer it (palliative care, ensures comfort but precludes surgery) or withhold it to attempt surgery (curative for A, futile and painful for B). A portable scanner is available that instantly and perfectly identifies which patient is which (free, reliable). If Aris uses the scanner, she will treat the survivable patient and palliate the fatal one. If she does not use the scanner, she will attempt surgery on a random patient (50% chance of saving a life, 50% chance of inflicting futile pain). Aris is a deontological expected-utility maximizer: she values saving a life at +100, but she weights *knowingly* letting a patient die (via palliation) at -1000 due to professional guilt, whereas *unknowingly* failing to save a patient (via futile surgery) is weighted only at -10 (tragic outcome, but no moral fault). Calculating her expected utility, she strictly prefers to smash the scanner and operate blindly.

  ***

  **Analysis**

  **1. Violated Assumption**
  The case violates the assumption that **utility is defined solely over material outcomes independent of the agent's epistemic state** (often called *State-Independence* or *Consequentialism*). Good's theorem assumes that $U(\text{Outcome})$ is fixed regardless of how the agent arrived there. Here, the utility of the patient dying depends critically on whether the agent *knew* death was inevitable. The negative value arises because the information transforms a "tragic failure" into a "moral transgression" in the agent's utility function.

  **2. Repairing the Assumption**
  If we "repair" this by forcing the utility function to depend only on the patient's health status (e.g., $U(\text{Live}) = 100$, $U(\text{Die}) = -100$, regardless of knowledge), the negative value vanishes.
  *   *Ignorant:* $0.5(100) + 0.5(-100) = 0$.
  *   *Informed:* $0.5(100) + 0.5(-100) = 0$.
  *   (Assuming the futile surgery pain is negligible or equal to palliation).
  If we account for the fact that information allows her to *save* the survivable patient 100% of the time (vs 50% ignorant), the VoI becomes strictly positive. The "negative value" was entirely an artifact of the epistemic-dependent utility weights.

  **3. The Strongest Reply (The Redescription Move)**
  A defender of the "always take evidence" theorem will argue that Aris's utility function was simply misdescribed. They will expand the **outcome space** to include "Aris's Moral State."
  *   Outcome 1: Patient Lives, Aris Clean.
  *   Outcome 2: Patient Dies, Aris Clean (Ignorant).
  *   Outcome 3: Patient Dies, Aris Guilty (Knowing).
  Once these are treated as distinct final outcomes, Good's theorem applies perfectly. Aris is simply maximizing expected utility over a richer set of consequences. She isn't avoiding *information*; she is avoiding the *outcome* of "Being Guilty," which is causally linked to receiving the information. The theorem holds; the agent just cares about her own conscience as a consequence.

  **4. The Collapsing Feature**
  The single feature that generates the negative value is **Epistemic-Dependent Utility** (the utility of a physical state changes based on the agent's knowledge of it).
  *   *Can it be patched?* No, not without changing the agent. If you remove this feature, you remove the deontological constraint that makes Aris a realistic moral agent. To "patch" the case to satisfy the theorem while keeping the negative value, you would have to argue that "Guilt" is not an outcome but a violation of the decision rule itself. However, within standard decision theory, any consistent preference (including guilt-avoidance) can be redescribed as consequentialist. Therefore, the case cannot be patched to yield negative VoI *within* the theorem's framework; it can only demonstrate that the framework requires a potentially counterintuitive expansion of what counts as a "consequence."
