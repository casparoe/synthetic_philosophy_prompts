answer: |-
  **Title:** The Function of Fiction: A Methodological Dialogue
  **Participants:** Elena (Postdoc, Evolutionary Psychology) and Marcus (Senior Faculty, Cultural Evolution/Complex Systems)
  **Setting:** Lab Coffee Corner, recorded for the Methods Seminar.

  **Elena:** Let's start with the adaptationist heuristic. We have a costly behavior—hours spent in immersive fiction, opportunity costs high, energy expenditure non-trivial. In evolutionary biology, when you see a complex, costly trait that is species-typical, the null hypothesis should be that it solves a recurrent adaptive problem. My preprint argues fiction is a "flight simulator" for social cognition. It allows low-risk simulation of social strategies, calibrating our Theory of Mind (ToM) and cheater-detection systems.

  **Marcus:** I don't dispute that fiction *could* be useful now. I dispute the inference to *origin*. You're invoking the Environment of Evolutionary Adaptedness (EEA) to explain a phenomenon that is historically recent. Written fiction is 5,000 years old. Oral narrative is older, but is it Pleistocene old? To claim this is a genetic adaptation, you need to show that the selection pressure existed long enough to fix alleles.

  **Elena:** The medium isn't the mechanism. We aren't adapted to read novels; we are adapted to process structured social information. The "story" format recruits existing cognitive architecture. My claim is that the *disposition* for narrative absorption is the adaptation. That's why I propose the developmental prediction: absorption should come online alongside pretend play and explicit false-belief reasoning. If it's a byproduct, why the tight developmental coupling?

  **Marcus:** Because the byproduct rides on the mechanism. If you have a car, you can use it to drive to the grocery store. The car wasn't designed for grocery runs, but the capacity exists. ToM is likely an adaptation for real-time social navigation. Fiction might be a cultural technology that hijacks ToM. The developmental correlation you predict is consistent with your hypothesis, but it's also consistent with the "hijack" hypothesis. It's not a design signature; it's a dependency.

  **Elena:** But a design signature isn't just correlation; it's specificity and complexity. Williams' criterion: a trait is an adaptation if it exhibits complexity specialized for a function. Narrative structures across cultures aren't random. They focus disproportionately on social dilemmas, kin conflict, and status negotiation. If fiction were just a cultural parasite, we'd expect more random variation. Instead, we see cross-cultural invariance in themes. That suggests a canalized cognitive input system.

  **Marcus:** Cross-cultural invariance is your strongest evidence, but it's also the most ambiguous. Fire is universal. Cooking is universal. Neither are biological adaptations; they are cultural universals driven by the physics of heat and the biology of digestion. Universality can arise from convergent cultural evolution because the *problems* are universal, not because the *solution* is genetic. You need to distinguish between a universal biological capacity and a universal cultural solution to a universal problem.

  **Elena:** Fair. That's why I included the comparative prediction. If this is about social learning in high-stakes cooperative environments, we should look for precursors in other cooperative breeders. If wolves or corvids show anything like "practice play" for social scenarios, it supports the deep evolutionary root.

  **Marcus:** And if they don't?

  **Elena:** Then the human-specific component is the question. But if they *do*, it strengthens the case that the cognitive machinery is ancient.

  **Marcus:** Here is where I worry you're painting yourself into a corner. If you find it in corvids, you say it's ancient. If you don't, you say it's human-specific language scaffolding. The EEA becomes a Rorschach test. But let's turn the table. You accuse my side of offering "just-so" stories. But what is the alternative? If not adaptation, then what?

  **Marcus:** Two options. One: It's a spandrel. A byproduct of language and ToM with no selected function. Two: It's a cultural evolver. Stories spread because they have high transmission fidelity, not because they increase the biological fitness of the listener.

  **Elena:** And can you test that?

  **Marcus:** I can model transmission biases. We can show that certain narrative structures replicate better regardless of their truth value or utility to the listener.

  **Elena:** But that just pushes the question back. Why do humans have a bias to transmit *these* specific stories? If the bias is in the cognitive machinery, we are back to the architecture of the mind. If the bias is arbitrary, why is it so consistent across cultures? You're positing a cultural selection pressure that mirrors biological selection pressures so closely that the distinction blurs.

  **Marcus:** I'll concede that. Cultural evolution models can be underdetermined. We can often fit a transmission model to any existing distribution of traits post-hoc. If you have enough parameters, you can explain anything. So, we have a symmetry problem. Your adaptationist story can be tuned to fit the data. My cultural evolution story can be tuned to fit the data. Both rely on assumptions about the past that are hard to verify.

  **Elena:** Exactly. So why is the burden of proof entirely on me? Why is "byproduct" the default?

  **Marcus:** Because of parsimony. Genetic change is slow and costly to posit. Cultural change is fast and cheap. If a trait can be explained by the interaction of general-purpose learning and cultural accumulation, we shouldn't invoke specific genetic selection unless we have to. It's the organum of William of Ockham applied to phylogeny.

  **Elena:** But parsimony cuts both ways. Is it simpler to posit one general learning mechanism that somehow produces this specific, costly, universal behavior? Or to posit that the behavior exists because it was selected for? If the trait is complex and functionally specific, the "general purpose" explanation becomes incredibly complex in its own right. You have to explain away the appearance of design.

  **Marcus:** I concede that "byproduct" is not a free pass. It requires its own mechanistic account. I cannot simply say "it's a spandrel" and stop. I need to show how the interaction of ToM and language necessarily produces narrative absorption without specific selection for absorption.

  **Elena:** And I concede that I cannot prove the EEA directly. I cannot time-travel to the Pleistocene to measure the fitness payoff of listening to a story around a fire. My cross-cultural surveys show current utility and universality, not historical origin.

  **Marcus:** So where does that leave us? We've circled the same methodological drain for weeks.

  **Elena:** I think the disagreement is sharper than "more data." It's about the prior probability we assign to cognitive complexity. You treat complex cognitive dispositions as guilty of being adaptations until proven innocent. I treat them as innocent of being byproducts until proven innocent.

  **Marcus:** That's it. It's about the null hypothesis. For you, the null is that a complex, costly, universal trait is noise until function is found. For me, the null is that it is noise until specific genetic selection is demonstrated.

  **Elena:** And neither null is empirically decidable right now. The data we can collect—developmental timelines, cross-cultural surveys, comparative cognition—is consistent with both a "specialized adapter" model and a "general-purpose hijack" model.

  **Marcus:** Precisely. The preprint's predictions are necessary conditions for your theory, but they are not sufficient to rule out mine. If narrative absorption correlates with ToM, it could be because it trains ToM (your view) or because it parasitizes ToM (my view).

  **Elena:** So the teaching point for the students isn't about who is right about fiction.

  **Marcus:** No. It's about the limits of inference in evolutionary science. When the EEA is inaccessible, and the trait is a behavior that leaves no fossil, adaptationist and cultural-evolutionary explanations can become mathematically equivalent in their fit to the data.

  **Elena:** But we still have to act. As researchers, I have to design the study. If I design for the cultural account, I look for variation and transmission chains. If I design for the adaptationist account, I look for universals and cognitive specifications.

  **Marcus:** And that's the practical divergence. We aren't disagreeing about the data we might find. We are disagreeing about which patterns in the data would count as decisive. You think finding a universal design feature settles it. I think finding a universal design feature only proves the *capacity* is universal, not the *function* is selected.

  **Elena:** Then we agree on the impasse. The symmetry is real. My adaptationism risks being an unfalsifiable "function-finding" mission. Your culturalism risks being an unfalsifiable "contingency-finding" mission.

  **Marcus:** The only way out is to find a prediction where the models diverge. Not a correlation, but a divergence.

  **Elena:** Like what?

  **Marcus:** If fiction is an adaptation for social calibration, then disrupting fiction consumption should impair social calibration specifically, not just general cognition. If it's a cultural parasite, disrupting it should have no fitness cost, or the cost should be purely cultural (e.g., social ostracization), not cognitive.

  **Elena:** And if it's a byproduct of ToM, disrupting ToM disrupts fiction, but disrupting fiction shouldn't disrupt ToM.

  **Marcus:** There it is. Causal directionality. Your model implies fiction *maintains* the adaptation. My model implies the adaptation maintains the fiction.

  **Elena:** Okay. I can work with that. That's testable.

  **Marcus:** Good. Then the dialogue ends not with a verdict, but with an experiment. But the students need to know: even that experiment relies on our shared agreement about what counts as a "cost."

  **Elena:** Which brings us back to the EEA.

  **Marcus:** Always back to the EEA. Coffee?

  **Elena:** Black. Like the Pleistocene.
