answer: |-
  ### Desiderata for a Theory of Deductive Justification

  The following list specifies the conditions an adequate account of deductive justification must meet. The list is organised by the structural problems they address. Requirements are marked as **Non-Negotiable (NN)** if failing them leaves the Carrollian regress or the core epistemic problem unsolved, and as **Preference (P)** if they reflect specific metaphysical or epistemological commitments that a viable theory might reasonably reject (provided it explains the rejection).

  #### I. The Regress and the Nature of the Transition

  **D1. The Anti-Inflation Constraint (NN)**
  *   **Motivation:** Carroll's Tortoise shows that adding the inference rule as a further premise generates a vicious regress.
  *   **Requirement:** The theory must explain how an agent moves from premises to conclusion without requiring the rule of inference to be represented as an additional propositional premise. It must distinguish the *act* of inferring from the *belief* in a conditional.
  *   **Distinction:** This enforces the separation between **warrant for the conclusion** (derived from premises) and **warrant for the transition** (the right to move). A theory that collapses the transition into a premise fails this desideratum.

  **D2. The Specification of Rule-Acceptance (NN)**
  *   **Motivation:** To stop the regress, the agent must "accept" or "follow" a rule. Intellectualism makes this a belief (restarting the regress); Blind Dispositionism makes it a-causal and normatively inert.
  *   **Requirement:** The account must specify what it is to accept an inferential rule. It must avoid reducing rule-following to a mere causal disposition (which cannot justify) or a further propositional attitude (which regresses). It must explain how acceptance of a general rule relates to the justification of particular instances without requiring a separate act of subsumption for every step.
  *   **Distinction:** This addresses the gap between **justification of a rule** (why *Modus Ponens* is good) and **justification of a particular inference** (why *this* use is warranted).

  **D3. The Rule-Circularity Condition (NN)**
  *   **Motivation:** Justifying a basic rule (e.g., *Modus Ponens*) seemingly requires using that very rule.
  *   **Requirement:** The theory must explicitly address rule-circularity. It cannot ignore the issue. It must either demonstrate why such circularity is benign (e.g., because it is unavoidable and not truth-conducive in a vicious way) or explain why basic rules do not require the same type of justification as derived beliefs.
  *   **Distinction:** This touches the **third-personal question** (is the rule reliable?) versus the **first-personal question** (am I entitled to use it?).

  #### II. The Agent and Access

  **D4. The Non-Ideal Agent Constraint (NN)**
  *   **Motivation:** Human agents have bounded rationality, limited working memory, and are not logically omniscient.
  *   **Requirement:** The theory must allow that an agent can be justified in drawing an inference without seeing all its consequences or possessing a explicit formulation of the rule. Justification must not require logical omniscience.
  *   **Distinction:** This prioritises the **first-personal entitlement** (what I can do) over abstract **third-personal validity** (what follows in the system).

  **D5. The Access/Transparency Stance (NN to decide; P on outcome)**
  *   **Motivation:** Epistemology traditionally demands that justification be accessible to the agent, but externalist accounts deny this.
  *   **Requirement:** The theory must take a definitive stance on whether the justification for an inference depends on facts the inferrer can access.
      *   *Preference:* A theory that satisfies a strong internalist access condition is preferable for capturing the first-personal perspective, but an externalist theory is permissible if it explains why access is not required for justification.
  *   **Distinction:** This governs the **first-personal question** of entitlement.

  #### III. Normativity and Validity

  **D6. The Normative Force Requirement (NN)**
  *   **Motivation:** Logic is normative; logical error is criticisable. Mere regularity or convention does not generate authority.
  *   **Requirement:** The account must explain why agents *ought* to infer in accordance with valid rules. It must ground the authority of logic without reducing it to social convention, psychological inevitability, or pragmatic utility alone. It must explain why inconsistency is a distinctive rational failure.
  *   **Distinction:** This addresses the **third-personal question** of what makes an inference correct versus the **first-personal** feeling of compulsion.

  **D7. The Transmission Failure Condition (NN)**
  *   **Motivation:** Validity does not guarantee the transmission of justification (e.g., reasoning from unjustified premises, or cases like Moore's proof of an external world).
  *   **Requirement:** The theory must distinguish between truth-preservation and justification-transmission. It must account for cases where a valid rule is applied correctly, yet the conclusion is not justified (due to premise status or structural issues like relevance).
  *   **Distinction:** This sharply separates **warrant for the conclusion** (which may fail) from **warrant for the transition** (which may hold).

  #### IV. Structural and Systemic Constraints

  **D8. The Closure and Rationality Condition (P)**
  *   **Motivation:** The Preface Paradox and the problem of logical omniscience create tension between rational belief and deductive closure.
  *   **Requirement:** The theory should clarify whether deductive closure is a requirement of rationality or merely an ideal. It must offer a coherent treatment of cases where an agent is justified in believing premises but justified in rejecting their conjunction (or vice versa).
  *   **Status:** *Preference.* Some adequate theories may deny closure; others may uphold it. The NN requirement is merely to *address* the tension, not solve it in a specific way.

  **D9. The Non-Presupposition Constraint (NN)**
  *   **Motivation:** Explaining deduction via semantics (e.g., truth-conditions) often presupposes the very logical constants being explained.
  *   **Requirement:** The justification of deduction must not depend on a semantic theory of logical constants that already presupposes the deductive abilities it is meant to explain. The epistemology cannot be more obscure than the logic it grounds.
  *   **Status:** *Non-Negotiable.* Failing this renders the explanation circular in a vicious, explanatory sense.

  **D10. The Logical Pluralism Compatibility (P)**
  *   **Motivation:** There are live rival logics (Classical, Intuitionistic, Paraconsistent, etc.).
  *   **Requirement:** Ideally, the theory should not equate justification exclusively with validity in one favoured system. It should allow that an agent using a rival logic (with coherent semantics) might still be epistemically justified.
  *   **Status:** *Preference.* A monist theory can be adequate, but a pluralist-compatible theory has greater explanatory scope.

  ***

  ### Tensions and Conflicts

  **The Load-Bearing Conflict: Access (D5) vs. Rule-Circularity (D3) & Non-Ideal Agents (D4)**
  The most significant structural tension lies between the **Access Condition (D5)** and the **Rule-Circularity/Non-Ideal Agent constraints (D3, D4)**.
  If one insists on strong internalist access (D5), it becomes extremely difficult to explain how basic rules are justified without vicious circularity (D3) or how non-ideal agents (D4) can possess the required access to complex logical relations. Internalist accounts often solve the access problem by intellectualising rule-following, which threatens the Anti-Inflation Constraint (D1). Conversely, Externalist accounts easily handle D1, D3, and D4 by appealing to reliability or entitlement, but they typically fail D5, leaving the first-personal perspective unexplained. This conflict is load-bearing because resolving it usually determines the entire metaphysical orientation of the theory (Internalism vs. Externalism).

  **The Most Exclusionary Requirement**
  The **Access/Transparency Stance (D5)** is the single requirement that does the most to exclude otherwise attractive accounts.
  Many robust solutions to the Tortoise (such as externalist reliabilism or Wright-style entitlement) solve the regress and handle non-ideal agents elegantly but are forced to reject strong access conditions. Conversely, traditional rationalist or intellectualist accounts satisfy access but collapse under the weight of the Tortoise regress or the problem of logical omniscience. Demanding a specific outcome for D5 (e.g., "Must be Internalist") would immediately disqualify half the live options in the literature; demanding only a *stance* (as written above) keeps them in play but highlights the fault line.

  ***

  ### Evaluation of Main Families of Response

  **Meaning-Theoretic Accounts**
  These accounts ground justification in the meanings of logical constants. They fare well on **Normative Force (D6)** and **Rule-Acceptance (D2)**, as meaning-constitution naturally binds the agent to the rule. However, they struggle significantly with the **Non-Presupposition Constraint (D9)**, as semantic clauses often presuppose the logic they explain. They also face difficulties with **Logical Pluralism (D10)** unless they adopt a highly revisionary semantics.

  **Entitlement Approaches**
  Strategies that posit a non-evidential warrant (entitlement) to trust basic rules handle the **Regress (D1)** and **Rule-Circularity (D3)** well by denying the need for evidence. They accommodate **Non-Ideal Agents (D4)** effectively. However, they typically fail the **Access Condition (D5)**, as entitlements are often externalist. They also risk weakening the **Normative Force (D6)**, making logic seem like a permissible assumption rather than a binding authority.

  **Inferentialist Accounts**
  By identifying meaning with use, these accounts dissolve the gap between **Rule and Inference (D2)** and avoid **Premise-Inflation (D1)**. However, they often conflate the **Third-Personal Validity** with **First-Personal Entitlement**, struggling to explain error (D6). They also face the **Non-Presupposition (D9)** challenge, as the practice of inference is used to explain the justification of inference.

  **Rule-Circular Defences**
  These arguments accept the circularity but argue it is benign. They satisfy **D3** by definition and avoid **D1**. However, they are vulnerable to the **Access (D5)** objection: if the justification is circular, can the agent access it without begging the question? They often rely on externalist reliability, which alienates the first-personal perspective.

  **Quietist or No-Justification-Needed Views**
  These views deny that deduction requires epistemic justification, treating it as a framework condition. While this dissolves the **Tortoise (D1)** and **Circularity (D3)**, it arguably fails the **Normative Force (D6)** and the **Transmission (D7)** requirements. It risks turning the **First-Personal Entitlement** into a mere psychological fact, failing to explain why logical error is criticisable rather than just different.
