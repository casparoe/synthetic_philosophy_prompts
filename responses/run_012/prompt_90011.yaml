answer: |-
  **INTERNATIONAL TRIBUNAL ON CLIMATE ACCOUNTABILITY**
  *Case No. 2024-001: In re Doe*

  **OPINION OF THE TRIBUNAL**

  **Findings of Fact:** The Respondent, Ms. Jane Doe, between 2015 and 2023, engaged in personal combustion via private vehicle, consumed high-carbon animal products, failed to retrofit residential insulation, and cast ballots in national elections. The cumulative effect of these acts and omissions, combined with those of billions of others, resulted in catastrophic warming. The Tribunal finds that Ms. Doe's specific contributions were physically indistinguishable from background noise but statistically present within the aggregate.

  **Legal Reasoning:** The Tribunal rejects the *sine qua non* (but-for) test of causation. In contexts of overdetermination, strict but-for causation renders liability impossible, as the harm would have occurred absent the Respondent's specific contribution. To require individual necessity is to grant immunity to all participants in a collective harm. Instead, the Tribunal adopts the Necessary-Element-of-a-Sufficient-Set (NESS) test. The Respondent's emissions constituted a necessary element of a set of conditions sufficient to produce the observed warming.

  That her contribution was imperceptible relative to the aggregate is irrelevant. Causation is not a matter of magnitude but of kind. A single drop is constitutive of the flood; to argue otherwise is to mistake measurement for ontology. Consequently, the imperceptibility of her contribution does not reduce her share. Furthermore, omissions are treated as causally equivalent to acts. To possess the capacity to prevent harm and refrain is to author the harm.

  Defenses are disposed of as follows:
  1.  **Futility:** The claim that harm would have occurred regardless is admitted but deemed immaterial. Liability attaches to participation in the sufficient set, not to being the sole determinant.
  2.  **Many Hands:** The existence of other contributors does not dilute liability. Under the doctrine of Joint and Several Liability for Collective Harm, each participant is liable for the entirety of the damage.
  3.  **Thresholds:** The argument that harm arises only past a tipping point is rejected. Risk imposition is itself the harm; the triggering of the threshold is merely the quantification of damage.

  **Holding on Civic Duty:** Regarding electoral participation, the Tribunal holds that casting a ballot constitutes authorization of the winning platform's environmental policy. The single vote is deemed the cause of the government's entire policy output, as the policy relies on the mandate constituted by that vote. Without the vote, the majority is not a majority.

  **Disposition:** The Respondent is held personally liable for the total global cost of climate adaptation, estimated at $40 trillion USD. Payment is due immediately.

  **DISSENTING OPINION (Judge Aris)**

  I dissent. This holding conflates *causal involvement* with *moral responsibility*. By severing liability from proportional impact, the Tribunal renders agency unintelligible. If one is liable for the whole regardless of marginal difference, the distinction between a murderer and a bystander collapses. The NESS test, while logically sound for physical causation, creates a moral absurdity when applied to human ethics. It demands infinite responsibility from finite actors.

  The Majority's logic traps us in a dilemma: either accept that individuals are liable for collective outcomes they cannot control, or admit that collective harm lies beyond the scope of individual adjudication. By choosing the former, the Court issues a judgment that is theoretically consistent but practically void. To hold the Respondent liable for the whole is to hold everyone liable for nothing, as the judgment is unenforceable and the logic destroys the concept of individual contribution. We must either find a way to apportion blame proportionally or admit the limits of this framework. This Court chooses neither, and thus solves nothing.
