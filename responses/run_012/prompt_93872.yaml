answer: |-
  1. If the specific gametes are essential to my identity, what principled distinction prevents the uterine environment or exact timing of conception from being equally essential? If you appeal to genetic continuity to draw that line, doesn't that reduce the gametes to mere vessels rather than constitutive origins?

  2. Since identical twins originate from the same sperm and egg yet remain distinct persons, does your view imply they share an identity until the split occurs? If you deny this, what non-genetic factor breaks the essential link without abandoning origin essentialism altogether?

  3. In cases of embryonic fusion where one person arises from two zygotes, does that individual have two essential origins or none at all? If you claim they would not have existed without the fusion, aren't you admitting that the gametes alone are insufficient for identity?

  4. To claim I could not have come from different gametes, you must locate me in possible worlds where I lack those gametes, but how do you identify me in those worlds without already assuming origin essentialism? If you rely on qualitative similarity instead, doesn't that allow for the very swapping of origins you seek to deny?

  5. You argue against the intuition that had your parents never met, someone else might have been born in your place, but how do you distinguish this from the simpler claim that no one at all would have existed? If you say the alternative is non-existence rather than a different person, aren't you grounding identity in historical chance rather than metaphysical necessity?
