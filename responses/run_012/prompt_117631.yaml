answer: |-
  Here is the argument reconstructed, stripped of the polite fiction that ethics committees are doing metaphysics when they are actually doing boundary maintenance.

  ### 1. The Implicit Theory of Current Practice

  You asked whether the CNS requirement is metaphysical or epistemic. The practice pretends it is epistemic but operates as if it is metaphysical.

  **The Epistemic Mask:**
  The form asks for justification because we cannot access another being's subjective experience directly. Therefore, we use the CNS, nociceptors, and analgesic response as *proxies*. The argument is: "We can't know if it hurts, but these are the reliable indicators we have." This suggests that if we found a non-CNS system that screamed and avoided damage, we *should* protect it.

  **The Metaphysical Commitment:**
  However, the practice excludes the physics lab's trapped ions without review. If the commitment were purely epistemic (i.e., "we protect anything that *might* suffer"), you would need a mechanism to assess the ions, even if the assessment concluded they don't suffer. By not requiring a form at all, the committee asserts that ions *cannot* suffer, regardless of behavior.

  Therefore, the current practice commits you to **Biological Emergentism**. It presupposes that sentience is a property that *emerges* only from specific biological substrates (neural tissue). It rules out the possibility that silicon, ions, or fields could ever constitute a subject of experience, no matter how complex their functional organization.

  **What it quietly rules out:**
  1.  **Substrate-Neutral Functionalism:** The view that pain is defined by what the system *does* (processing damage signals, avoiding harm), not what it is *made of*. If functionalism were true, a sufficiently complex AI or a synthetic neural net would require approval. Your form does not account for this.
  2.  **Panpsychism:** If experience is fundamental, the CNS doesn't *create* experience; it complexifies it. The current form assumes the CNS *creates* the moral status.
  3.  **Human Organoids:** This is the crack in the dam. Organoids have neural tissue (meeting the metaphysical substrate requirement) but no behavior/analgesic response (failing the epistemic proxy test). The fact that your committee dissolves on this question proves the theory is incoherent. You have the hardware for pain without the behavioral output. The current practice has no tool to handle this.

  **Verdict:** The practice is not a truth-seeking mechanism; it is a **regulatory heuristic**. It assumes Biological Emergentism because it is the only view that keeps the committee's workload finite and the biology department operational.

  ### 2. The Panpsychist Objection (Flatmate vs. Friend)

  Your flatmate and your friend are arguing past each other because they are conflating *experience* with *welfare*.

  **The Flatmate (The Goff Position):**
  If experience is fundamental, then an electron has a tiny spark of experience. Therefore, drawing a line at the mouse is arbitrary.
  *   **The Flaw:** This assumes that *any* experience commands moral respect. But moral respect usually requires the capacity for *suffering* (negative valence). A fundamental particle might have "proto-experience," but there is no evidence it has "proto-pain." Experience without valence is not a moral patient.

  **The Friend (The Integrationist Position):**
  She is correct. Panpsychism does not entail that everything matters morally. It entails that everything has an interior aspect, but moral status requires a **unified subject of welfare**.
  *   **The Argument:** For a system to have a "bad time," its various micro-experiences must integrate into a macro-subject that cares about its own continuation. An ion trap does not integrate experiences into a self-preserving whole. A mouse does.
  *   **The Consequence:** Panpsychism changes the *explanation* for why the mouse matters (it integrates fundamental experience), but it doesn't necessarily change the *list* of who matters.

  **Who is right?**
  Your friend is right about the ethics; your flatmate is right about the metaphysics undermining the *CNS requirement*. If panpsychism is true, the CNS isn't the *source* of moral status, but rather the *integrator* of it. The committee's form is technically wrong about *why* the mouse matters, but it might still be right about *which* things matter.

  ### 3. The Homeostatic Criterion (The Colleague's Proposal)

  The proposal: *A system counts if it has an internal state it acts to hold within bounds, such that things can go better or worse for it.*

  This is a **Functionalist Theory of Teleology**. It defines "good/bad" as "deviation from/return to set-point."

  **Does it sweep in the thermostat?**
  Technically, yes. A thermostat detects deviation and acts to correct it.
  *   **The Counter:** We usually exclude thermostats because their "goals" are *derived* (assigned by humans), not *intrinsic* (evolved or self-generated). A bacterium wants to survive because its structure is constituted by that drive; a thermostat wants 72 degrees because a human set it.
  *   **The Fix:** You must add "intrinsic teleology" to the criterion.

  **Does it sweep in the bacterium/single cell?**
  **Yes.** This is the reductio.
  A bacterium maintains pH, osmotic pressure, and energy gradients. It moves away from toxins. Under this definition, a bacterium has a "welfare."
  *   **Implication:** If you adopt this, your Animal Ethics Committee becomes a **Life Ethics Committee**. You would theoretically need approval to autoclave waste, spray disinfectant, or even culture E. coli.

  **Does it sweep in fundamental physics?**
  **No.** An ion in a trap does not act to maintain an internal state. It responds to external fields. It has no "bounds" it tries to stay within for its own sake. It has no homeostasis. So this criterion actually solves the ion problem better than the CNS criterion does.

  **Is it a reductio?**
  For an *Animal* Ethics Committee: **Yes.** It expands the scope so massively that the committee becomes administratively impossible.
  For *Ethics*: **Maybe not.** It might be the correct moral boundary, but it is the wrong bureaucratic boundary. It identifies "being alive" with "having a welfare." Many ethicists accept this (biocentrism), but no university administration will fund a committee that reviews every petri dish.

  ### 4. Concrete Implications: What Changes on Tuesday Afternoon?

  Here is what happens if you swap the theoretical underpinnings of the form.

  **Scenario A: Current Practice (Biological Emergentism)**
  *   **Theory:** Pain requires neural tissue.
  *   **Reviewed:** Mice, rats, zebrafish, maybe octopuses (if you vote yes).
  *   **Not Reviewed:** Trapped ions, thermostats, bacteria, human organoids (currently in limbo), insect larvae (often exempt).
  *   **Administrability:** High. Clear bright lines.
  *   **Vulnerability:** Organoids and AI. If a brain organoid develops nociceptors but no body, the form breaks. If a robot simulates pain behavior perfectly, the form says it's fine.

  **Scenario B: Panpsychist Picture (Integrationism)**
  *   **Theory:** Pain requires integrated experience of negative valence.
  *   **Reviewed:** Same as current, *plus* anything that integrates information complexly.
  *   **The Shift:** You now have to assess **information integration**, not just biology.
      *   *Organoids:* Now definitely need review. If they have neural integration, they have moral weight.
      *   *Advanced AI:* If an AI demonstrates integrated information structures analogous to pain processing, it theoretically enters the scope.
      *   *Insects:* Likely included (higher integration than previously thought).
  *   **Administrability:** Low. How does a committee measure "integration" on a Tuesday afternoon? They would have to rely on proxies again, likely falling back to biology. It changes the justification but not the workflow, until it hits edge cases (AI/Organoids) where it stalls.

  **Scenario C: Functionalist/Homeostatic Picture**
  *   **Theory:** Pain/Welfare is goal-directed self-preservation.
  *   **Reviewed:** **Everything alive.**
      *   *Bacteria/Cell Culture:* Needs review. Killing cells is harming a system with a welfare.
      *   *Plants:* If the lab uses plant models, they are now fully moral patients.
      *   *Ions/Thermostats:* Excluded (no intrinsic homeostasis).
  *   **Administrability:** Zero. The committee would drown. You would need a triage system (e.g., "only review systems with nervous systems") which just brings you back to Scenario A.

  ### Summary Conclusion

  Your committee's practice presupposes **Biological Emergentism** because it is the only theory that aligns with the **bureaucratic necessity of a bright line**.

  *   **Metaphysical or Epistemic?** It claims to be epistemic ("we use these signs to guess"), but it functions metaphysically ("no nerves, no status").
  *   **Flatmate vs. Friend:** Your friend is right. Panpsychism does not force you to protect ions, because moral status requires valence and integration, not just raw experience. However, panpsychism does undermine the idea that *only* biology can integrate experience.
  *   **The Homeostatic Proposal:** It is philosophically robust but bureaucratically fatal. It correctly identifies that "welfare" exists wherever there is "self-preservation," but it expands the moral community to include bacteria, rendering the committee useless.

  **The Hard Truth:**
  The form is not designed to track the truth about sentience. It is designed to draw a circle around the community of beings *we feel like us enough to protect, but not so like us that we can't experiment on them.* The CNS requirement is a political compromise, not a philosophical conclusion. The reason the meeting dissolved on octopuses and organoids is that those cases threaten the compromise: octopuses are too smart to ignore, organoids are too human to ignore.

  If you want the committee to function, keep the CNS proxy but admit it is a **regulatory fiction**. If you want it to be philosophically consistent, adopt the Homeostatic criterion and prepare to review every petri dish in the building. You cannot have both consistency and administrability.
