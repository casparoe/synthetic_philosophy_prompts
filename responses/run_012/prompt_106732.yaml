  **CONFIDENTIAL PRIVATE PLACEMENT MEMORANDUM**
  **UNITARY RETURN PARTNERS, LP**

  **INVESTMENT OBJECTIVE**
  The Fund seeks to maximize risk-adjusted returns across the universal wavefunction by allocating capital according to squared amplitude coefficients. The strategy does not rely on frequency-based outcomes within a single decoherent history. Instead, the Fund treats branch weights as normative constraints on rational betting behavior, extracting probability from the theory by definitional fiat. Investors should understand that performance is not defined by the realization of a specific outcome in a localized frame of reference, but by the coherence of the portfolio's exposure relative to the global measure. The Fund operates under the assumption that rational agents are required to bet in accordance with branch weights, irrespective of empirical verification within a single timeline.

  **PERFORMANCE AND VALUATION**
  Returns are reported in branch-measure rather than fiat currency or localized asset values. The Fund acknowledges that such performance metrics cannot be falsified in the ordinary empirical manner, since every possible outcome occurs somewhere in the superposition. Consequently, traditional audit procedures regarding realized gains are inapplicable. However, consistent with contemporary decision-theoretic derivations, the Fund posits that a coherent investor must prefer strategies maximizing measure-weighted utility, regardless of subjective localization. Projections are therefore presented as claims about what a rational agent is required to prefer rather than claims about how many worlds there are. Historical returns are illustrative of measure accumulation and do not guarantee future measure stability. Valuation committees determine asset prices based on global wavefunction coefficients, not localized market prints.

  **RISK FACTORS**
  *Circularity of Preference Derivation.* The mathematical derivation of probability weights used by the Fund presupposes the ordering and additivity of preferences it is meant to deliver. Investors acknowledge that the normative force of the strategy relies on an axiomatic commitment to diachronic consistency which may not hold under extreme decoherence events. There is a risk that the decision-theoretic link between weight and utility remains stipulative.

  *Localization and Complaints.* A client who ends up in an unfavourable branch has no grounds for complaint, since his counterparties were equally real and there was never a fact about which branch he would occupy. The Fund assumes no liability for subjective experiences of loss resulting from indexical uncertainty. Legal recourse is limited to the branch of origination, though enforcement across decoherent histories is not guaranteed.

  *System Decomposition.* Investors are advised that the decomposition of the world into 'the Fund' and 'the Market' is a bookkeeping convenience rather than a feature of the theory. Correlations between the portfolio and the external environment are universal; distinct asset classes are merely approximate descriptions of entangled subsystems. Basis risk arises from the arbitrary selection of the preferred basis used to define portfolio boundaries.

  **FEE STRUCTURE**
  The Fund charges a management fee of 2.00% and a performance fee of 20.00%. Investors should note that the management fee is charged in every branch and is therefore the only riskless item in the portfolio. Performance fees are assessed relative to the measure-weighted high-water mark. Due to the ubiquity of the management fee across all decoherent histories, it constitutes the sole guaranteed return to the General Partner. Fees are deducted from the global measure prior to any distribution to limited partners.

  **LIQUIDITY AND REDEMPTION**
  Redemption requests are processed quarterly. Investors should note that exiting the Fund does not constitute exiting the superposition. Liquidity is provided via measure-transfer mechanisms that maintain global unitarity. Requests to redeem capital into a specific decoherent history will be rejected.

  **DISCLAIMER**
  This Memorandum does not constitute an offer to sell securities in any jurisdiction where such offer is prohibited by local physical laws. Past measure accumulation is not indicative of future results.

  _______________
  [1] The Firm declines to offer branch-selection services. While certain competitors claim to navigate investors toward higher-yield histories, the Fund maintains that such selection is ontologically incoherent. All branches are equally actual; preference is a property of the agent, not the topology of the multiverse. Attempts to select branches will be treated as attempts to violate unitarity and may result in immediate expulsion from the Fund.
