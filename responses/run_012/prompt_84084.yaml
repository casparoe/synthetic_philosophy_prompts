  To test the world against your honest deed.
  No wind can turn the leaf of this white page,
  Though you have sown the gold as if a seed.
  The ink stood dry upon the final line,
  Since you have brought the weight into the sight.
  You make the promise and the promise mine,
  And leave the safety that was deemed so right.
  You play the part assigned within the name,
  The sign is set before the eye is closed.
