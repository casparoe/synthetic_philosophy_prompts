  I read the threat written on the page,
  And know the cost required for the seed.
  I place the metal down to pay the wage,
  To match the world unto my honest deed.
  No wind can turn the leaf of this white page,
  Unless I sow the gold as if a seed.
  The ink waits dry upon the final line,
  Until I bring the weight into the sight.
  I make the promise and the promise mine,
  And seek the safety that is deemed so right.
  I play the part assigned within the name,
  The sign is set before the eye is closed.

