      *   **Specific Questions to Address:**
          *   Is the view coherent given fanaticism's robustness to probability discounts? (Does $P \times \infty$ still equal $\infty$?)
          *   Does SH discount near-term value symmetrically? (Is it neutral between near and far?)
          *   Could SH *multiply* value (more simulated minds)?
          *   Do we know what simulators want? (Instrumental convergence?)
          *   SSA vs. SIA (Self-Sampling vs. Self-Indication Assumptions) impact.
          *   Is the view unfalsifiable/immune to evidence? (Is that a bug or a feature?)
