answer: |-
  # HANDOUT: Disambiguating 'The Crowd is Untruth'
  **Seminar:** Media, Democracy and the Public Sphere
  **Subject:** Conceptual Analysis of Kierkegaard's Slogan

  ## Introduction
  The assertion 'the crowd is untruth' (*Mengden er Usandhed*) appears primarily in Kierkegaard's retrospective note on his authorship, *The Point of View for My Work as an Author* (1859), though it resonates with his critique of 'the Public' in *A Literary Review* (1846). It is not a treatise on social epistemology. To deploy it as a universal veto on collective judgement requires disentangling what is meant by 'crowd', what is meant by 'untruth', and where the locus of the error lies. The following menu arranges five distinct readings of the slogan from the nearly trivial to the genuinely radical, evaluating their validity, their consistency with Kierkegaard's own practice, and their utility for the argument that citizens' assemblies and the press are inherently disqualified.

  ---

  ## 1. The Epistemic Incompetence Reading
  *   **The Claim:** Aggregates of people are less capable of tracking factual or moral truth than a single competent individual. 'Crowd' refers to any group making a joint decision; 'untruth' refers to error or falsehood.
  *   **Status:** **Generally False.** As a universal law of group cognition, this contradicts the 'wisdom of crowds' phenomenon (where independent averages often outperform experts) and ignores the benefits of distributed knowledge. It is a platitude only if the 'crowd' is defined specifically as a panicked mob.
  *   **Kierkegaard's Practice:** **Contradicted.** Kierkegaard did not write to isolate truth from all readers, but to provoke the 'single individual' *within* the readership. He relied on the capacity of readers to discern truth, provided they did not lean on the majority for validation.
  *   **Legitimacy vs. Truth:** This is a claim about **truth-tracking** (epistemic reliability).
  *   **Support for Student's Conclusion:** **High.** If groups cannot track truth, deliberative polling and citizens' assemblies are epistemically bankrupt. However, this imports contemporary social science concerns into a 19th-century existentialist framework where they do not belong.

  ## 2. The Moral Evasion Reading
  *   **The Claim:** Numbers dilute accountability. 'Crowd' refers to a body where individual responsibility is anonymised; 'untruth' refers to the moral falsehood of claiming authority without accepting liability.
  *   **Status:** **Substantive and Defensible.** It is a robust claim about moral psychology: individuals often act in groups in ways they would not alone, using the collective as a shield against conscience.
  *   **Kierkegaard's Practice:** **Supported.** This aligns with his critique of 'leveling'. He sought to restore responsibility to the individual. However, he did not argue that *all* collective action is evasive, only that the *abstraction* of the public allows evasion.
  *   **Legitimacy vs. Truth:** This is a claim about **responsibility** (moral accountability), not necessarily factual accuracy.
  *   **Support for Student's Conclusion:** **Partial.** It disqualifies collective *judgement* only if that judgement relies on anonymity. A citizens' assembly where members speak in their own names and are accountable for their reasoning might escape this critique. It does not inherently disqualify the press, unless the press is seen as a shield for irresponsible gossip.

  ## 3. The Ontological Fiction Reading
  *   **The Claim:** The collective agent does not exist. 'Crowd' (or 'Public') is an abstraction with no hands, no voice, and no soul; 'untruth' refers to ontological unreality. To speak of 'the public opinion' is to speak of a phantom.
  *   **Status:** **Substantive.** It challenges the reification of social groups. A 'public' is not a substance; only individuals are real.
  *   **Kierkegaard's Practice:** **Strongly Supported.** In *A Literary Review*, Kierkegaard argues the 'public' is a monstrous abstraction, 'a kind of gigantic something, an abstract and deserted void which is everything and nothing'.
  *   **Legitimacy vs. Truth:** This is a claim about **ontology** (what exists).
  *   **Support for Student's Conclusion:** **High.** If the 'reading public' or the 'assembly' is an ontological fiction, then granting it authority is category error. However, this does not preclude individuals gathering to deliberate; it only precludes treating the *group* as a singular entity with a will.

  ## 4. The Existential/Religious Reading
  *   **The Claim:** Truth is inwardness and requires a solitary relation to the Eternal. 'Crowd' refers to any mediation between the self and God (including social validation); 'untruth' is spiritual alienation.
  *   **Status:** **Radical.** This restricts 'truth' to subjective, religious truth. It renders the slogan irrelevant to political or empirical truths (e.g., tax policy, climate data).
  *   **Kierkegaard's Practice:** **Supported.** This is the core of Kierkegaard's authorship. Truth is subjectivity. The crowd is untruth because it distracts the individual from the task of becoming a self.
  *   **Legitimacy vs. Truth:** This is a claim about **soteriology** (salvation/selfhood), not political legitimacy.
  *   **Support for Student's Conclusion:** **Low.** This reading disqualifies the crowd as a site for *religious* truth, but it does not licence the conclusion that collective deliberation on *secular* matters is disqualified. One can hold that political truth is collective while religious truth is individual. Using this to shut down a seminar on democracy is a category mistake.

  ## 5. The Media-Abstraction Reading
  *   **The Claim:** The press creates the crowd by replacing genuine encounter with abstract reflection. 'Crowd' refers specifically to the 'reading public' formed by the press; 'untruth' is the passionless reflection that replaces action.
  *   **Status:** **Contextually Specific.** This is the most historically accurate reading of Kierkegaard's critique of 'the Present Age'. The untruth lies in the *mode* of communication (abstract, distant) rather than the number of people.
  *   **Kierkegaard's Practice:** **Ironically Contradicted.** Kierkegaard used the press (books, pamphlets) to attack the press. He hoped to reach the 'single individual' *through* the medium that usually creates the 'public'.
  *   **Legitimacy vs. Truth:** This is a claim about **communicative legitimacy**.
  *   **Support for Student's Conclusion:** **Mixed.** It supports the critique of the press as creating a phantom public. However, it does not necessarily disqualify citizens' assemblies, which are designed to be face-to-face and embodied, precisely countering the 'abstract reflection' Kierkegaard despised.

  ---

  ## Verdict on the Student's Intervention

  Your fellow student most probably meant a conflation of **Reading 1 (Epistemic)** and **Reading 3 (Ontological)**. She appeared to argue that because a collective is an abstraction (Ontological), it cannot produce valid knowledge (Epistemic). However, her conclusions do not follow cleanly from either. If she relies on the Ontological reading, she must show that citizens' assemblies treat the group as a mystical entity rather than a collection of individuals; if they are merely individuals speaking in turn, the 'crowd' does not exist in the damning sense. If she relies on the Epistemic reading, she is making a social-scientific claim that Kierkegaard's slogan does not licence, as he was not concerned with the accuracy of polling but with the spiritual cost of 'leveling'. Furthermore, by using the slogan to close down discussion, she ironically performed the very act Kierkegaard warned against: using a general abstraction ('the crowd is untruth') to evade the specific, difficult task of engaging with the arguments of particular individuals in the room. The slogan, properly understood, demands *more* rigorous individual responsibility in deliberation, not less.
