answer: |-
  You are not muddled. You have correctly identified a structural fault line in moral reasoning, but you are looking for a single label for what is actually **two distinct philosophical seams** that often get mashed together in conversation.

  There is no single, universally recognized term that covers *both* the "ownership" flip and the "probability" flip as one unified phenomenon. However, each half of your observation has a precise name in ethics and decision theory.

  Here is the breakdown of the seams, the nearest thing you are likely half-remembering, and a coinage for the combined pattern.

  ### Seam 1: The Ownership Flip (One Life vs. Many Lives)
  **Name:** **The Separateness of Persons** (or the **Interpersonal Aggregation Problem**)

  This is the philosophical bedrock of your first observation. It originates from John Rawls and Robert Nozick as a critique of Utilitarianism.
  *   **The Concept:** Utilitarianism treats society as a single container of utility; it doesn't matter if a headache is moved from Person A to Person B, or if a million headaches are distributed across a million people vs. stacked on one person. The total is what counts.
  *   **The Intuition:** Your interlocutors are invoking the **Separateness of Persons**. They are saying that moral aggregation works *intrapersonally* (within one life, a million specks add up to agony) but fails *interpersonally* (across many lives, a million specks remain a million trivialities).
  *   **Why it feels like a flip:** Because the arithmetic is identical, but the *moral unit of account* changes. When the harm is in one life, the unit is "one person's suffering." When the harm is spread, the unit is "a million people's annoyances." Most non-utilitarian theories (like Contractualism) argue these units are not exchangeable.

  ### Seam 2: The Probability Flip (Certainty vs. Risk)
  **Name:** **Ex Ante vs. Ex Post Evaluation** (specifically regarding **Risk Imposition**)

  This is the second observation, where the total expected harm is fixed, but the distribution of certainty changes.
  *   **The Concept:**
      *   **Ex Post:** We look at the outcome. (Someone definitely got a speck).
      *   **Ex Ante:** We look at the risk faced before the outcome. (Everyone faced a tiny risk).
  *   **The Intuition:** People often prefer the *Ex Ante* distribution (everyone takes a tiny risk) over the *Ex Post* certainty (one person definitely gets hurt), even if the expected harm is identical. This is because the *Ex Ante* view preserves equality of status (we are all in the same boat), whereas the *Ex Post* view creates a "sacrificed" individual.
  *   **The Conflict:** Your prompt notes the reverse intuition (that the risk is *unacceptable* because it's non-consensual). This specific tension is debated in **Distributive Justice** under the header of **Fairness in Risk Imposition**. Some argue imposing a risk is worse than imposing a certain trivial harm; others argue the opposite.

  ### The Coinage: "Moral Boundary Sensitivity"
  Since there is no single term for the combined pattern of *both* flips (Ownership + Probability) despite fixed totals, I will coin the term you asked for.

  **Term:** **Moral Boundary Sensitivity**
  **Definition:** The phenomenon where moral verdicts shift significantly based on the *boundaries* of the harm (whether it crosses personal boundaries or probability boundaries), even when the aggregate expected utility remains constant.
  **What it covers:**
  *   It covers the **Separateness of Persons** (Personal Boundaries).
  *   It covers the **Ex Ante/Ex Post Distinction** (Probabilistic Boundaries).
  *   It explains why "summing the numbers" feels like a category error to many people.
  **What it doesn't cover:**
  *   It does not cover **Scope Neglect** (where people ignore the numbers entirely).
  *   It does not cover **Time Discounting** (valuing present harm over future harm).
  *   It is distinct from the **Repugnant Conclusion** (which is about total population size vs. quality of life, not distribution of fixed harm).

  ### The Nearest Thing You're Half-Remembering
  You mentioned suspecting you're half-remembering something. There are two candidates, one psychological and one philosophical.

  **1. The Psychological Candidate: The Identifiable Victim Effect**
  This is the most likely pop-sci term you've encountered. It describes the cognitive bias where people offer greater aid to a specific, identifiable individual in distress than to a large, anonymous group with the same need.
  *   *Why it fits:* It explains the "One person tortured vs. Million specks" emotional weight.
  *   *Why it's not it:* It's a bias description, not a structural philosophical argument. It explains *that* people feel this way, not *why* the aggregation logic fails.

  **2. The Philosophical Candidate: Parfit's Spectrum Argument (or The Continuum Argument)**
  This is the formal name for the "Torture vs. Dust Specks" thought experiment itself (found in Derek Parfit's *Reasons and Persons*).
