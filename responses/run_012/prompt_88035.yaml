answer: |-
  Your intuition about "scaffolding vs. load-bearing" is correct, but it's too vague to be a tool. You need a operational definition of "load-bearing."

  The pattern in your verdicts is not about physical realism (friction exists) or magnitude (gene flow is small). It is about **Qualitative Robustness**.

  Here is the principle that captures your verdicts, broken into two operational clauses.

  ### The Principle of Qualitative Robustness

  **Statement:** A modeling assumption is acceptable ("Fine") if and only if relaxing that assumption changes the *magnitude* of the output but preserves the *topology* of the solution space. It is unacceptable ("Not Fine") if relaxing it changes the existence, sign, or rank-order of the phenomenon you are claiming to measure.

  To apply this, you must run two tests. If an assumption fails either test, it is "Not Fine."

  #### Clause 1: The Mechanism Relevance Test
  *Does the ignored factor constitute the primary driver of the specific variable you are estimating?*
  *   **Pass (Fine):** The factor is a secondary modifier (e.g., friction on trajectory shape, mutation on short-term range shift).
  *   **Fail (Not Fine):** The factor is the mechanism generating the signal (e.g., finite $N$ generating extinction, network structure generating river spread, gene flow confounding split time).

  #### Clause 2: The Aggregation Linearity Test
  *Is the mapping from the individual-level detail to the population-level output effectively linear?*
  *   **Pass (Fine):** You care about the mean, and the system response is linear in the mean (e.g., average vaccine efficacy).
  *   **Fail (Not Fine):** You care about the mean, but the system response is nonlinear (convex/concave), making the variance matter (e.g., economic cost of carbon, extinction risk).

  ---

  ### Mapping Your Verdicts to the Principle

  Here is how the principle adjudicates your list.

  | Case | Your Verdict | Principle Verdict | Which Clause Decides? | Why? |
  | :--- | :--- | :--- | :--- | :--- |
  | **Friction (Ballistics)** | Fine | **Fine** | Mechanism | Gravity drives the parabola; friction just scales the coefficients. Topology preserved. |
  | **Ideal Gas (Low Pressure)** | Fine | **Fine** | Mechanism | Interactions are second-order to kinetic energy in this regime. |
  | **Infinite $N$ (Drift)** | Fine | **Fine** | Mechanism | Drift still exists; $N$ only scales the rate ($1/2N$). |
  | **Infinite $N$ (Extinction)** | **Not Fine** | **Not Fine** | **Aggregation** | Extinction is a boundary condition at $N=0$. Infinite $N$ removes the boundary. Topology broken. |
  | **Well-mixed (City)** | Fine | **Fine** | Mechanism | High density makes contact rate the driver, not structure. |
  | **Well-mixed (River)** | **Not Fine** | **Not Fine** | **Mechanism** | Flow direction *is* the transmission mechanism. Mixing destroys the directionality. |
  | **No Mutation (20 yrs)** | Fine | **Fine** | Mechanism | Timescale separation. Mutation is too slow to drive range shift. |
  | **No Mutation (200k yrs)** | **Not Fine** | **Not Fine** | **Mechanism** | Timescales overlap. Adaptation becomes a driver. |
  | **No Gene Flow (Dating)** | **Not Fine** | **Not Fine** | **Mechanism** | You are measuring the *absence* of flow. Assuming it is zero creates the signal you measure. |
  | **Rep. Individual (Vaccine)** | Fine | **Fine** | Aggregation | Efficacy $\to$ Protection is roughly linear for average $R_0$ reduction. |
  | **Rep. Individual (Econ)** | **Not Fine** | **Not Fine** | **Aggregation** | Utility/Cost functions are nonlinear. Variance in income drives total welfare loss (Jensen's). |
  | **Linear (Narrow)** | Fine | **Fine** | Aggregation | Taylor expansion holds. Linear approx is topologically equivalent to curve. |
  | **Linear (Huge)** | **Not Fine** | **Not Fine** | **Aggregation** | Saturation implies a fixed point/limit. Linear implies unbounded growth. Topology broken. |
  | **Closed Pop (Canceling)** | Nervous/Fine | **Not Fine** | **Mechanism** | *See "Honest Confession" below.* |

  ### Resolving The Flip-Flop: Gene Flow (Small but Unknown)

  **Your Instinct:** Not Fine.
  **Colleague's View:** Fine (bias direction known).
  **Principle Verdict:** **Not Fine.**

  **Reasoning:** This fails the **Mechanism Relevance Test**.
  When you assume gene flow is zero to estimate a split time, you are treating gene flow as *noise*. If the noise is unknown magnitude, you cannot distinguish between "recent split with no flow" and "ancient split with high flow."
  Even if you know the *direction* of the bias (e.g., ignoring flow makes splits look older), you do not know if the bias is *small enough to preserve the rank order* of competing hypotheses.
  If your question is "Did they split?" (Existence), small unknown flow is Fine.
  If your question is "When did they split?" (Magnitude), small unknown flow is **Not Fine**, because the error term is unbounded relative to the precision required for dating. Your colleague is confusing *sign consistency* with *topological stability*.

  ### Prediction: A Case You Haven't Listed

  **Case:** *Ignoring age structure in a model of a slow-moving chronic disease (e.g., HIV) vs. a fast acute disease (e.g., Influenza).*

  **Principle Prediction:**
  *   **Influenza:** **Fine.** (Mechanism Test). The timescale of the epidemic is much faster than the timescale of demographic turnover. Age structure is scaffolding.
  *   **HIV:** **Not Fine.** (Mechanism Test). The timescale of infection overlaps with the timescale of sexual network formation and age-specific mortality. Age structure is load-bearing for prevalence estimates.

  ### The Honest Confession: Where This Principle Breaks Your Verdicts

  You asked me to be honest about which of your verdicts the principle cannot keep. There are two.

  **1. The Cannonball (Friction for Distance)**
  *   **Your Verdict:** Fine.
  *   **Principle Verdict:** **Not Fine.**
  *   **Why:** For a cannonball, air resistance is not a second-order correction on distance; it is a first-order driver. It can reduce range by 50%+. While it preserves the *shape* (parabola-ish), it destroys the *magnitude* to a degree that usually invalidates the model for the stated goal ("how far it flies").
  *   **The Fix:** You must reclassify this. It is only "Fine" if the goal is "teaching Newton's laws" or "order-of-magnitude trajectory shape." If the goal is actual distance, the assumption is load-bearing.

  **2. The Canceling Migration (Closed Population)**
  *   **Your Verdict:** Nervous, but leans Fine.
  *   **Principle Verdict:** **Not Fine.**
  *   **Why:** You said it yourself: "getting the right answer for the wrong reason." This violates the **Mechanism Relevance Test**. If immigration and emigration are large, the *turnover* rate is high, even if the *net* is zero. If your model calculates anything dependent on turnover (e.g., genetic diversity, disease importation risk, age structure), the assumption breaks the topology of the internal dynamics, even if the total $N$ stays constant.
  *   **The Fix:** Trust your nervousness. This assumption is "scaffolding" that is actually hiding a load-bearing wall.

  ### Summary for Your Workflow

  To stop the inconsistency, ask these two questions before building:

  1.  **If I add this detail back in, does the phenomenon disappear or reverse?** (If yes, assumption is Not Fine).
  2.  **Am I averaging over a variable that enters the equation nonlinearly?** (If yes, assumption is Not Fine).

  Your "Scaffolding vs. Load-bearing" intuition was right; "Load-bearing" just means "Qualitatively Determinative." Stick to that, and you'll stop flip-flopping on the gene flow.
