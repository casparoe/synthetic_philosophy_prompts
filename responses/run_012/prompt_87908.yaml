  - Someone counts the chairs in a room, twice, slowly, and gets 34. Same again, all three levels.
  - Someone glances at a queue and says there's more than twenty people in it. There are twenty-five. Priya says: yes, they know there's more than twenty; no, they don't know that they know it. Her reason that time: if there'd been a few fewer they'd have said exactly the same thing, so how could they know that they know?
  - Someone in a room where the radiator has only just kicked in says it's warm, and it is, but only just. Knows it, doesn't know that they know it.
  - A stranger tells someone the bank shuts at four. Knows it, doesn't know that they know it.

  She gives one sort of reason for the proof case and a different sort for the queue case, and I can't tell whether those are two reasons or one reason wearing two hats.

  My test case for Saturday: someone walks into my kitchen in the middle of this heatwave, windows shut, sun pouring in, 34 degrees inside. No squinting, no doubt about it, obviously warm. Does Priya say that person knows it's warm, knows that they know it, and knows that they know that they know it?

  So what I want: the rules that fit the rulings she's already given, what each of them predicts for the kitchen case, which one you reckon she's actually running and why, and a further case I could put to her that would tell the rules apart if she surprises me on Saturday. And if her rulings definately don't pin down an answer, say so rather than fudging it. British English please, I'm in Manchester and American spellings grate.
