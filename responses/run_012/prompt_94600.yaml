answer: |-
  ### Table 1: The Spec Sheet for Belief

  | Requirement | What it demands (1 sentence) | The Case that Forces It | Verdict (Non-negotiable or Camp Preference) | Theory Ruled Out |
  | :--- | :--- | :--- | :--- | :--- |
  | **Non-Harm** | You cannot gamble with other people's lives on unproven hunches. | **The Shipowner:** He convinces himself the ship is safe to save money; it sinks. Is he a murderer or just unlucky? | **Non-negotiable** (Moral Floor) | Radical Pragmatism (truth is just what works). |
  | **Self-Fulfillment** | Belief is permitted when believing is a necessary condition for the fact becoming true. | **The Jump/Exam:** You must believe you can make the jump to actually make it; evidence is impossible beforehand. | **Humanist Preference** (Hardass demands evidence of the *mechanism*, not the outcome) | Strict Evidentialism (wait for proof before acting). |
  | **Relational Constitution** | In intimate bonds, the belief *creates* the reality; demanding proof destroys the thing being measured. | **The Faithful Wife:** She believes her husband is loyal on mixed evidence. Is this loyalty or self-deception? | **Humanist Preference** (Hardass sees this as delusion) | Cold Rationalism (belief is only a prediction of facts). |
  | **Moral Constraint** | Some evidence is morally forbidden to use, even if it is statistically accurate. | **The Hiring Manager:** Stats show Group X is riskier. Believing this is rational but poison to hold. | **Non-negotiable** (Ethical Ceiling) | Pure Probabilism (if the stats hold, the belief is justified). |
  | **Psychological Possibility** | You cannot be obligated to do what you lack the mechanical capacity to do. | **The Command:** Try to believe right now that the sky is green. You can't. So how can anyone tell you what you *should* believe? | **Non-negotiable** (Fact of Human Nature) | Direct Voluntarism (the idea that belief is a simple choice). |
  | **Truth-Tracking** | Beliefs must aim to match reality eventually, or they become useless maps. | **The Doctor/Teacher:** They must believe in a patient/student to help them, but if the patient dies/fails, the belief was wrong. | **Non-negotiable** (Functional Requirement) | Cynical Nihilism (belief is just a tool, truth doesn't matter). |

  ### Table 2: The Clashes (Where the Theory Breaks)

  | Requirement A | Requirement B | Why They Pull Apart | Real Conflict or Sloppy Framing? | What a Theory Must Sacrifice to Keep Both |
  | :--- | :--- | :--- | :--- | :--- |
  | **Non-Harm** (Shipowner) | **Self-Fulfillment** (The Jump) | Both involve risk based on unproven belief. One is condemned, one is praised. Why? | **Real Conflict.** The difference is *who bears the risk*. | Sacrifice the idea that "risk" is the metric. You must sacrifice **Individual Autonomy**: you can gamble on yourself, but not on others. |
  | **Truth-Tracking** (Stats) | **Moral Constraint** (Hiring) | The stats are true (evidence), but holding the belief is wrong (ethics). Truth and Goodness diverge. | **Real Conflict.** Evidence does not equal permission. | Sacrifice **Epistemic Purity**: You must admit that some truths are too dangerous to hold as working beliefs. The Hardass loses the right to say "the data made me do it." |
  | **Relational Constitution** (Wife) | **Truth-Tracking** (General) | To be a good spouse you must ignore doubt; to be a rational agent you must investigate doubt. | **Real Conflict.** Loyalty requires blinding; rationality requires seeing. | Sacrifice **Unified Agency**: You must accept that humans operate on different "settings" for private love vs. public fact. |
  | **Psychological Possibility** (Command) | **Non-Harm** (Shipowner) | We blame the Shipowner for his belief, but he couldn't just "choose" to doubt. How is he culpable? | **Real Conflict.** This is the metaphysical killer. | Sacrifice **Direct Blame**: You cannot blame the belief itself, only the *habits* that led to it. The Hardass loses the "coward/liar" insult; the Humanist loses the "just choose hope" advice. |

  **The Single Killer Requirement:**
  **Psychological Possibility.** It destroys the Hardass's moral outrage (you can't blame what isn't chosen) and the Humanist's solution (you can't just choose to believe). It forces both characters to stop fighting about the *belief* and start fighting about the *habits, attention, and environments* that lead to belief. The Shipowner isn't guilty for believing the ship was safe; he's guilty for never hiring an inspector. The Wife isn't virtuous for believing; she's virtuous for cultivating a garden where trust grows. This shifts the novel's conflict from "What is true?" to "Who are you becoming?"
