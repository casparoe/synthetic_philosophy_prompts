      *   *The Tension:* Truth-tracking vs. Life-enhancing. Moral responsibility vs. Psychological necessity.
      *   *The "Spec Sheet":* What makes a theory of belief *good*? It needs to explain why we blame people for some beliefs and praise them for others, while acknowledging human limitations.

  3.  **Drafting Table 1: Requirements:**
      *   *Requirement 1: Truth-Tracking.* We need beliefs to match reality eventually.
