      *Re-evaluating the "Killer":* The **Control** requirement (You can't believe on command) is the metaphysical killer. It undermines the Hardass's *blame* ("you're a coward") and the Humanist's *advice* ("just believe"). It forces both to talk about *indirect* control (habits, attention). This is great for characters: "You can't choose the belief, but you can choose the coffee shop where you think about it."

