      3.  *Relational Constitutiveness:* Belief *is* the relationship. (The Wife).
      4.  *Anti-Prejudice:* Stats don't justify individual judgment. (Hiring Manager).
      5.  *Doxastic Control:* Can't believe at will. (The Command).
      6.  *Truth-Tracking:* Beliefs should aim at truth. (General).

      *Wait, I need to classify them as Non-negotiable vs. Camp Preference.*
      *   Safety/Non-Harm: Non-negotiable (mostly).
      *   Self-Fulfillment: Humanist (Hardass says gather evidence on the *mechanism*, not the outcome).
      *   Relational: Humanist (Hardass says trust is a prediction, not a gift).
      *   Anti-Prejudice: Non-negotiable (Moral floor).
      *   Control: Non-negotiable (Psychological fact).
      *   Truth-Tracking: Hardass (Humanist says "flourishing" matters more).

  4.  **Drafting Table 2: Clashes:**
      *   *Clash 1: Truth vs. Flourishing.* (Shipowner vs. The Jump). If believing saves you but is unproven, do it?
      *   *Clash 2: Individual vs. Social.* (Wife vs. Hiring Manager). Private trust is good; statistical profiling is bad. Why?
      *   *Clash 3: Ought vs. Can.* (Duty vs. Control). If you *should* believe (to be loyal) but *can't* (lack evidence), are you blameworthy?

      *Deep Dive on the "Killer" Requirement:*
      *   The prompt asks: "Which single requirement does the most to kill off the popular answers?"
      *   Usually, it's **Doxastic Control** (The "Can't decide on command" problem). If you can't choose beliefs, how can there be an *ethics* of belief? You can't blame someone for what they can't control.
      *   *Alternative:* **The Hiring Manager Case** kills simple Evidentialism (stats are evidence) and simple Pragmatism (if it works, do it). It introduces a moral constraint independent of truth or utility.
      *   *Decision:* The **Control** requirement is the metaphysical killer. The **Hiring Manager** is the moral killer. The prompt asks about "popular answers" (Hardass vs. Humanist). The Control issue undermines the Hardass's blame ("you're a coward") because the believer might not be able to help it. But the Hiring Manager case undermines the Hardass's reliance on statistics.
      *   *Better angle:* The clash between **Truth-Tracking** and **Relational Constitutiveness**. You can't have both pure truth and pure loyalty in the Wife case.
      *   *Let's look at the "Sacrifice" column.* To keep Truth and Loyalty, you have to sacrifice the idea that belief is *only* about prediction.
