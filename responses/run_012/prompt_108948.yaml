answer: |-
  This is a fantastic set of intuitions. You've effectively reconstructed the tension between Kantian *good will*, Strawsonian *reactive attitudes*, and virtue-ethical *stability* without leaning on the usual crutches. Your "Operative-Motive View" (OMV) is a solid starting point—it captures the *Paperwork Manager* and *Promise* cases perfectly—but as you noted, it fractures on the *Locksmith* (motive doesn't match right-making feature) and *Fragile Virtue* (motive matches, but lacks depth).

  Here is my diagnosis of your principle, a proposed repair, and the application to your new case, followed by the required confidence reporting.

  ### 1. Diagnosis: Why OMV Fails
  Your OMV states: *Worth = Right-making feature is the Motivating feature.*

  *   **The Locksmith Problem:** The right-making feature is the *pensioner's need*. The motivating feature is *self-concept*. OMV says no credit; you say full credit. This suggests the motive doesn't need to *be* the right-making feature, but must be *sensitive* to it.
  *   **The Fragile Virtue Problem:** The motive *is* the need (in the moment). OMV says full credit; you say less. This suggests actual motivation isn't enough; the *disposition* must be robust.
  *   **The Donor Problem:** This is the hardest one. Like the Locksmith, the motive is self-regarding ("feel like a good person"). But you deny credit. This implies not all self-regarding motives are equal. The Locksmith's self-concept is *constrained* by the moral fact (I can't be a gouger); the Donor's self-concept *consumes* the moral fact (I use suffering to feel good).

  ### 2. The Repair: The Integrated-Tracking View
  Don't loosen "operative motive" too much, or you lose the *Paperwork Manager* distinction. Instead, keep the motive condition but add two structural constraints. I propose a three-clause view:

  1.  **Responsive Tracking:** The agent's motive must register the right-making feature, even if mediated by something else (e.g., self-concept or God).
  2.  **Counterfactual Resilience:** The motive must sustain the action across relevant changes in non-moral costs (rules out *Fragile Virtue*).
  3.  **Constitutive Integration:** The right-making feature must be integrated into the agent's practical identity as a *constraint* or *end*, not merely as *instrumental fuel* for a separate feeling (rules out *Donor*).

  ### 3. Which Clause Does the Real Work?
  You asked which is decoration. Here is my allocation of labor:

  *   **Responsive Tracking (Clause 1):** This does the work on **Paperwork Manager vs. Promise**. The Manager tracks *legal risk*; the Promise-keeper tracks *obligation*. This is the binary switch for moral worth. **Confidence: High.**
  *   **Counterfactual Resilience (Clause 2):** This does the work on **Fragile Virtue**. It explains why identical momentary motives yield different worth based on the agent's dispositional landscape. **Confidence: Medium-High.**
  *   **Constitutive Integration (Clause 3):** This does the heavy lifting on **Locksmith vs. Donor**. It distinguishes between "I can't do this because it violates who I am" (Locksmith) vs. "I do this because it boosts who I am" (Donor). It explains why the Locksmith gets credit despite the self-regarding frame. **Confidence: Medium.**

  **The Decoration:** I suspect **Responsive Tracking** is partially redundant if **Constitutive Integration** is strong enough. If the right-making feature is constitutively integrated, it is by definition being tracked. However, keeping it explicit helps rule out accidental rightness.

  ### 4. The New Case: The Dying Friend (False Belief)
  *Case:* She stays with a dying friend, motivated by the belief "She has no one else." In fact, family is en route.
  *Verdict:* **Full Credit.**

  *Application:*
  1.  **Tracking:** She is tracking *loneliness/suffering*. Even if the "no one else" fact is false, the *need for comfort* is real. She is responsive to the moral salience (distress), not just the empirical headcount.
  2.  **Resilience:** Assuming she wouldn't have left immediately upon seeing the family arrive (she's there for the dying, not just the isolation), the disposition holds.
  3.  **Integration:** Her motive is likely "I must not leave her alone in fear." This is constitutively integrated into care.

  *Nuance:* If her motive was strictly "I must fill the void of total isolation" and she would have left the moment the family walked in (even though the friend was still dying and scared), then **Resilience** fails, and worth drops. But on the standard reading of "staying with a dying friend," the false belief is incidental to the moral core (alleviating suffering). The moral worth attaches to the responsiveness to the *need*, not the accuracy of the *sociological report*.

  ### 5. Confidence and Uncertainty

  **Confidence Levels:**
  *   **Diagnosis of OMV failure:** 95% (Your cases clearly break the single-condition view).
  *   **Clause 1 (Tracking) necessity:** 85% (Needed to distinguish Prudence from Duty).
  *   **Clause 2 (Resilience) necessity:** 80% (Needed for Fragile Virtue, though some argue momentary motive is all that counts).
  *   **Clause 3 (Integration) necessity:** 70% (Needed for Locksmith/Donor, but this is phenomenologically murky).
  *   **Verdict on Dying Friend:** 75% (Depends heavily on the counterfactual: would she stay if family arrived?).

  **The Point of Least Certainty:**
  I am least sure about the **Locksmith vs. Donor distinction (Clause 3)**.
  *Why:* It relies on a very fine-grained phenomenological difference between "avoiding being a gouger" and "feeling like a good person." Both are self-referential. Both involve self-image. My claim that one is *constitutive* and the other *instrumental* feels theoretically tidy but psychologically fragile. It is possible your intuition on the Donor is influenced by the *outcome* (famine relief is abstract) vs. the Locksmith (pensioner is concrete), rather than the motive structure itself. If the Donor said, "I couldn't stand to be the sort of person who watches children starve," would she suddenly get Locksmith-level credit? If so, the distinction isn't about self-image vs. altruism, but about *negative constraint* vs. *positive aspiration*. I am not confident which of those is the true driver of your verdict.

  **Summary:** Stick with the **Integrated-Tracking View**, but treat Clause 3 as a working hypothesis. It fits your data, but the Locksmith/Donor axis is the weak point in the chassis.
