      *   *To make it Commitment-driven:* We need the agent to *want* to bind but be *unable* to make the bind stick without cost, or where the bind itself is exploited.
      *   *Let's pivot to the "Sophisticated vs. Naive" angle which hints at commitment.*
      *   *Best Fit:* **The "Resolute Choice" Pump.**
      *   *Scenario:*
