answer: |-
  # Session Design: Money Pumps and the Structure of Diachronic Agency

  **Duration:** 120 Minutes
  **Audience:** Graduate Economists and Philosophers (Mixed)
  **Goal:** Shift the conception of diachronic rationality from "preference consistency across time" to "capacity for binding future choice."

  ## Part 1: The Baseline and the Trap (0–20 Minutes)

  **Objective:** Activate prior knowledge of the Dutch Book argument and expose the limitation of the "temporal twin" assumption.

  1.  **The Synchronic Anchor (5 mins):**
      *   Begin by drawing a standard synchronic Dutch Book table on the board (betting odds implying a sure loss).
      *   **Ask:** "What does this loss prove about the agent?"
      *   **Expected Consensus:** It proves the agent's *degrees of belief* (or preferences) violate the axioms (probability calculus or transitivity). The irrationality is internal to the state of mind at $t$.
      *   **Write on Board:** *Synchronic Rationality = Internal Consistency.*

  2.  **The Standard Diachronic Extension (15 mins):**
      *   Introduce the standard three-good money pump ($A \succ B \succ C \succ A$) as the group currently understands it: a Dutch Book stretched over time.
      *   **Ask:** "In this standard cycle, where is the locus of the error?"
      *   **Facilitator Note:** Let them answer. They will likely say "Intransitive preferences."
      *   **The Pivot:** State clearly: "Today we test the assumption that the temporal money pump is *merely* the synchronic Dutch Book with a clock attached. We are looking for a pump that works even if the preferences at each moment are perfectly coherent, but the *connection* between moments is broken."
      *   **Action:** Erase the three-good cycle. Tell them it will not be the carrying case for today's problem.
      *   **Why (for your notes):** The three-good cycle diagnoses a flaw in the *ordering* of goods. It treats time as just another attribute of the good. It cannot distinguish between "I want different things at different times" and "I cannot make my future self do what I want." We need a case where the ordering is fine, but the *agency* is fractured.

  ## Part 2: The Extended Example — "The Revocable Contract" (20–50 Minutes)

  **Objective:** Present a scenario where the loss is unavoidable without introducing intransitivity, forcing the group to locate the irrationality in the *structure of choice* rather than the *content of preference*.

  **The Setup (Draw this timeline on the board):**
  *   **Agent:** Stable identity, no memory loss.
  *   **Outcomes:** $X$ (e.g., Health) and $Y$ (e.g., Pleasure).
  *   **Preferences:**
      *   At $t_1$: $X \succ Y$.
      *   At $t_2$: $Y \succ X$. (Acknowledge this change briefly as a given parameter—do not debate *why* it changes, e.g., hyperbolic discounting vs. taste change. It is a black box).
  *   **Market Structure:**
      *   At $t_1$, Agent holds a voucher for $X$.
      *   At $t_1$, Agent is offered a **Commitment Contract**: Pay fee $\$f$ to make the voucher *irrevocable* (guaranteeing $X$ at $t_3$).
      *   **Constraint:** The market *only* offers **Revocable Contracts**. If she pays $\$f$ at $t_1$, she can pay $\$f$ at $t_2$ to void the contract.
      *   At $t_2$, Agent is offered the chance to void the contract for fee $\$f$.
      *   At $t_3$, Outcome realized.

  **The Sequence of Play:**
  1.  **$t_1$ Decision:** Agent prefers $X$. She anticipates at $t_2$ she will prefer $Y$. To secure $X$, she pays $\$f$ for the contract.
  2.  **$t_2$ Decision:** Agent now prefers $Y$. She is offered to void the contract for $\$f$. Since $Y \succ X$, and the cost $\$f$ is small relative to the gain of $Y$ over $X$, she pays $\$f$ to void.
  3.  **$t_3$ Outcome:** She receives $Y$.
  4.  **Net Result:** She ends with $Y$ minus $\$2f$.

  **The Counterfactual:**
  *   If she had done nothing at $t_1$: She would end with $Y$ minus $\$0$.
  *   **The Pump:** She paid $\$2f$ to achieve exactly what she would have achieved for free by doing nothing.

  **Facilitator Instructions:**
  *   Do not explain *why* she pays at $t_1$ other than "She prefers $X$ and wants to secure it."
  *   Do not explain *why* she pays at $t_2$ other than "She prefers $Y$ and the fee is worth it."
  *   **Crucial Constraint:** Leave out any discussion of "Naïveté." Assume for now she knows her future preferences. (We will address this in Part 3).
  *   **Ask the Group:** "She lost $\$2f$ relative to the baseline of inaction. In the three-good cycle, the loss proved intransitivity. What does this loss prove here? Her preferences were transitive at $t_1$ and transitive at $t_2$."

  ## Part 3: Distinguishing the Pumps (50–80 Minutes)

  **Objective:** Guide the discovery that diachronic rationality is about the *relation between selves* (binding), not just the *state of selves* (preferences).

  1.  **Isolating the Variable (15 mins):**
      *   **Ask:** "If we change the market structure to allow an *Irrevocable* Contract at $t_1$, does the loss persist?"
      *   **Expected Answer:** No. If the contract is irrevocable, she pays $\$f$ at $t_1$, cannot void at $t_2$, and gets $X$. She achieves her $t_1$ goal.
      *   **Ask:** "Did her preferences change in this counterfactual?" (No). "Did the offers change?" (Yes, the voiding option is removed).
      *   **Inference:** The loss was not driven by the preferences themselves (which remained the same), but by the *availability of the reversal option*.

  2.  **Defining the Distinction (15 mins):**
      *   Introduce the terminology explicitly now that they have felt the difference.
      *   **Preference-Driven Pump (The 3-Good Cycle):** Exploits the *content* of the ranking. Even with perfect binding technology, the agent cycles because $A \succ B \succ C \succ A$. The error is in the *map*.
      *   **Commitment-Driven Pump (The Revocable Contract):** Exploits the *linkage* between rankings. The agent loses because $t_1$ cannot bind $t_2$. The error is in the *territory* (the temporal structure of agency).
      *   **Write on Board:** *Diachronic Rationality $\neq$ Preference Consistency.* *Diachronic Rationality = Capacity for Binding.*

  3.  **Head Off Misconception: Sophistication (10 mins):**
      *   **Anticipated Objection:** "A sophisticated agent would know at $t_1$ that she will void at $t_2$, so she wouldn't buy the contract at $t_1$. She saves the $\$2f$."
      *   **Facilitator Response:** "Correct. Sophistication saves the *fees*. But does it save the *outcome*?"
      *   **Point Out:** If she is sophisticated, she doesn't buy the contract. She gets $Y$. But at $t_1$, she preferred $X$. Sophistication prevents the *money loss*, but it does not enable the *plan fulfillment*.
      *   **Conclusion:** The pump reveals that without binding power, the agent is *structurally incapable* of executing long-term plans, regardless of whether she is naive or sophisticated. The irrationality is the inability to be an agent over time, not just a calculator of fees.

  ## Part 4: Implications and Exclusions (80–100 Minutes)

  **Objective:** Solidify the new definition and set boundaries for the discussion.

  1.  **What This Redefines (10 mins):**
      *   Ask the economists: "If rationality is about binding capacity, does this move the problem from Utility Theory to Mechanism Design?"
      *   Ask the philosophers: "If rationality is about binding capacity, is 'Resolute Choice' (McClennen) a requirement of rationality or a different mode of agency?"
      *   **Goal:** Show that diachronic rationality is no longer just about satisfying axioms, but about the *architecture of the self*.

  2.  **What to Explicitly Refuse to Cover (10 mins):**
      *   State clearly: "We are not solving the pump today. We are not debating whether hyperbolic discounting is 'rational' or 'irrational'."
      *   **Exclude:** Welfare analysis. (Is the agent *really* worse off if she gets $Y$ but wanted $X$? We are bracketing welfare to focus on structural exploitability).
      *   **Exclude:** Moral Psychology. (Do not discuss 'willpower' as a muscle. Discuss it as a constraint on choice sets).
      *   **Exclude:** Institutional Solutions. (Do not discuss Ulysses contracts in law or finance. Keep it abstract).
      *   **Reason:** These topics revert the discussion to "how to fix preferences" or "how to fix the world," rather than "how to define the agent."

  ## Part 5: The Diagnostic Question (100–120 Minutes)

  **Objective:** Verify grasp of the distinction between exploitability (money loss) and inconsistency (preference violation).

  **The Question:**
  > "Imagine two agents, **Alpha** and **Beta**, facing the Revocable Contract scenario.
  >
  > *   **Alpha** has the preferences described ($X \succ Y$ at $t_1$, $Y \succ X$ at $t_2$) and pays the fees, losing $\$2f$.
  > *   **Beta** has the *exact same* preferences at $t_1$ and $t_2$, but possesses a technology that allows her to make the $t_1$ contract irrevocable. She pays $\$f$ and secures $X$.
  >
  > **Question:** If we claim Alpha is 'diachronically irrational' because she was money-pumped, what must we say about Beta? Is Beta rational because she avoided the pump, or is she irrational because her preferences still reverse over time? And if Beta is rational, does that prove the pump was never about preference consistency at all?"

  **What to Listen For:**
  *   **Failure:** If they say Beta is irrational because her preferences still change, they have missed the point. They are still clinging to "Diachronic Rationality = Preference Consistency."
  *   **Success:** If they say Beta is rational (or at least, not vulnerable to the *commitment* pump) because she successfully executed a plan despite preference change, they have grasped that the locus of rationality is the *binding capacity*, not the *preference stability*.
  *   **Nuance:** If they argue Beta is "more rational" than Alpha, they grasp the degree of agency. The key is recognizing that Alpha's loss was due to the *revocability*, not the *reversal*.

  ## Summary of Facilitator Notes

  *   **Do not argue:** Let the example generate the tension. Your role is to manage the timeline and enforce the constraints (e.g., "Don't worry about *why* preferences change yet").
  *   **The 3-Good Cycle:** Use it only as a foil. It is the "straw man" of diachronic rationality that reduces time to a sequence of snapshots.
  *   **The Revocable Contract:** This is the core. Ensure the timeline is visible throughout.
  *   **The Shift:** Monitor the language. If they say "inconsistent preferences," correct them to "unbound choices."
  *   **The End:** The diagnostic question is the exit ticket. Do not wrap up until you have heard a range of answers to it.
