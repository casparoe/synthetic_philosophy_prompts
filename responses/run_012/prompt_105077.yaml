      *   **Constraints:** Do *not* give the arguments; design the session. Use one extended example (avoiding standard 3-good cycle if inadequate). Structure the flow so the insight arrives as a discovery. Address specific misconceptions (intransitivity, naïveté, Dutch book equivalence, sophistication). Specify what to exclude. End with a diagnostic question.
      *   **Tone:** Pedagogical, strategic, precise.

