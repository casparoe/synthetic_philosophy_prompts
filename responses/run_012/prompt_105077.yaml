      *   *Standard View:* Money pumps show intransitive preferences are irrational because they lead to sure loss. (Preference-driven).
      *   *Target View:* Some pumps work even with transitive preferences if the agent cannot commit. This shifts the locus of irrationality from the *ordering* to the *temporal agency* (commitment/binding).
      *   *The "Aha" Moment:* Diachronic rationality isn't just "same preferences at $t_1$ and $t_2$"; it's about the structural relationship between $t_1$-self and $t_2$-self (can $t_1$ bind $t_2$?).

