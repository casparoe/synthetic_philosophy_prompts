      *   **The Rule:** Jeffrey Conditioning (JC). $P_{new}(H) = \sum P_{old}(H|E_i) \cdot P_{new}(E_i)$.
      *   **The Constraint:** Rigidity Condition (conditional probabilities $P(H|E_i)$ remain fixed).
      *   **The Objection:** The "Partition Problem" or "Input Problem." How do we get the $P_{new}(E_i)$? Also, does evidence ever affect the relevance of $E_i$ to $H$ (violating rigidity)?
