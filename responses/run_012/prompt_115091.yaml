answer: |-
  An adequate decision theory for bounded agents with imperfect recall must enforce dynamic consistency by recognizing logical correlations between indistinguishable decision nodes without requiring information the agent cannot locally access.

  **Requirements Specification**

  1.  **Dynamic Consistency (NN):** The action chosen at the intersection must match the policy selected at the start without external precommitment.
      *   *Case:* In the Absent-Minded Driver (AMD) problem, a plan to continue at both intersections fails if the agent exits at the second because the ex-ante optimal mixed strategy becomes ex-post suboptimal.
  2.  **Logical Correlation Recognition (NN):** The theory must treat the agent's action at indistinguishable nodes as outputs of the same algorithm, correlated by logical necessity rather than causal link.
      *   *Case:* Choosing to continue at the first intersection increases the probability of continuing at the second because the same decision procedure runs at both; ignoring this leads to the CDT failure (p=1/2 vs optimal p=1/3).
  3.  **Informational Locality (NN):** Decisions must condition only on observations available at the node, not on lost memory or indexical facts unavailable to the agent.
      *   *Case:* The agent cannot condition on "I am at the first intersection" because imperfect recall erases this distinction; theories that smuggle this in via evidential conditioning violate the agent's actual epistemic state.
  4.  **Computational Tractability (NN):** The decision procedure must be calculable by a bounded agent within reasonable time and memory constraints.
      *   *Case:* A theory requiring unbounded logical inference or solving undecidable fixed points (like full UDT) is useless to a human or limited AI, regardless of theoretical optimality.
  5.  **Intrinsic Randomization Permission (CP):** The theory may allow the agent to generate random numbers internally rather than requiring deterministic policies with external randomness.
      *   *Camp:* Some camps insist on deterministic policies only (requiring external coin flips), while others allow mixed strategies as primitive actions.

  **Incompatibility and Exclusion**
  *   **Incompatible Pair:** **Logical Correlation Recognition** and **Computational Tractability**. Fully solving for logical correlations across all possible indistinguishable nodes often requires solving fixed points in logical space, which is generally uncomputable or intractable for bounded agents.
  *   **Primary Exclusion:** **Logical Correlation Recognition**. This single requirement excludes Causal Decision Theory (CDT), which treats the action at the current node as causally independent of the action at the indistinguishable future node, leading to time-inconsistent suboptimal plans in AMD.

  **Stress-Test: Durable Marks Variant**
  In the variant where the agent can leave visible marks but not remember leaving them, the mark functions as **external state modification**, not memory. It converts imperfect recall into imperfect information by altering the observation set at the second intersection (mark present vs. absent). An adequate theory must treat the mark as an observable variable that updates the information set, allowing the policy to condition on "mark seen" vs. "no mark." This does not change the Non-Negotiable requirements; instead, it validates **Informational Locality** by demonstrating that available data (the mark) must be used, while unavailable data (memory of leaving it) must be ignored. It tightens **Computational Tractability**, as the agent must now compute the value of information gained by marking versus the cost of the action.

  **Verdicts on Standard Families**
  *   **Evidential (EDT):** Fails **Informational Locality** by conditioning on the action as evidence for location without a mechanistic link.
  *   **Causal (CDT):** Fails **Logical Correlation Recognition** by treating decisions at indistinguishable nodes as causally independent.
  *   **Policy-based (FDT/UDT):** Fails **Computational Tractability** as general implementations require unbounded logical inference unavailable to bounded agents.
