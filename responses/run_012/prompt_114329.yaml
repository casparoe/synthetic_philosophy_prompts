prompt: |-
  I run measurement and reporting at a mid-size logistics company, about 900 people, and every quarter I have to sign off on the numbers that roughly twenty teams get judged on -- and since last year a chunk of their bonus is tied to. I've been burned twice already: we targeted 'cases closed per agent per day' and got a flood of three-line closes, and we targeted 'on-time delivery' and dispatch started moving the promised-delivery clock instead of moving the truck. So what I want is a procedure I can actually run before we adopt a metric as a target.

  Act as someone who knows the Goodhart's law literature properly but has also actually built scorecards inside a company -- not a theorist, not a consultant. Think step by step, and start by brainstorming the failure modes you'd expect in a firm like ours before you write anything down.

  Give me a checklist to run in order when a team proposes a new target metric. For each step: the question, what counts as a good enough answer, when the procedure stops and says no, and when it hands the decision to me or the COO because it's a value call and not a technical one. Sort each risk you turn up into the four standard kinds of Goodhart failure -- the one where the metric is a noisy proxy so optimising just selects the noise (regressional), the one where the proxy stops tracking the goal out in the tail (extremal), the one where pushing on the metric breaks the causal link back to the goal (causal), and the one where someone simply manipulates or misreports the number (adversarial) -- because i gather these need different defences and I want the checklist to say which defence goes with which.

  I also want you to use four things I've started tracking in a spreadsheet, and say where each one earns its keep and where it turns out to be useless: (1) gaming surface -- how many independent cheap moves exist that raise the number without moving the thing I actually care about; (2) detection lag -- how long before the real goal visibly diverges from the metric; (3) reversibility -- whether the damage undoes itself once we drop the metric; (4) who holds the pen -- whether the people being scored also get to record the number.

  Constraints: I have maybe two hours per metric and no stats team, we can't run experiments on most of these, and anything we adopt has to be explainable to a warehouse supervisor in one paragraph.

  Then run the finished procedure on three live proposals: 'cases closed per agent per day', with the bonus attached at the individual level; 'cut 30-day re-shipments by 10%' for the returns team; and 'increase the share of A/B tests that beat baseline' for the data team. One of the three should come out with an answer I won't like. Then tell me honestly which steps are judgment dressed up as procedure, and what this procedure can't do at all. No citations or reading lists please, I can't check them.
