answer: |-
  ### Part 1: Brainstorming Failure Modes (Logistics Context)

  Before writing the checklist, here is the reality of a 900-person logistics firm. We aren't a tech startup; we move physical boxes with people who are tired, under pressure, and smart enough to survive.

  1.  **The "Easy Ticket" Shuffle:** If agents are scored on volume, they will cherry-pick simple queries (e.g., "where is my package") and let complex claims rot in the queue. The metric goes up, customer satisfaction tanks.
  2.  **The Timestamp Fudge:** Dispatch controls the "promised time" field in the TMS (Transport Management System). If they are scored on on-time %, they will edit the promise date to match the arrival date.
  3.  **The "Hold" Game:** If we measure "damage per shipment," warehouse staff will hold damaged goods in a side room until the quarter ends, then ship them as "next quarter's problem."
  4.  **The Consolidation Trap:** If we measure "cost per shipment," ops will wait to fill a truck. Cost goes down, delivery speed goes up (wait, down), and clients scream because their partial load sat for three days.
  5.  **The Collusion:** Shift A passes a problematic load to Shift B right before the cutoff. Shift B's metrics tank, Shift A's look gold. They rotate who takes the hit based on who needs the bonus more.
  6.  **The Data Entry Fatigue:** If a metric requires manual entry (e.g., "reason for delay"), drivers will select the default option ("Other") to save time, rendering the data useless for root cause analysis.

  ---

  ### Part 2: The Metric Vetting Checklist

  This procedure is designed for a 2-hour review window. It forces you to categorize the risk and assign a specific defence. If a step fails, you don't move to the next one.

  **Legend for Goodhart Types:**
  *   **Regressional:** Metric is a noisy proxy (optimizing selects noise).
  *   **Extremal:** Metric works at normal levels, breaks when pushed hard.
  *   **Causal:** Metric correlates but doesn't cause the goal (pushing it does nothing).
  *   **Adversarial:** Intentional gaming or manipulation.

  #### Step 1: The Causal Link & Proxy Quality
  *   **Question:** "If we double this number, does the actual business outcome definitely improve, or does it just look better on paper?"
  *   **Good Enough Answer:** "Yes, because [mechanism]. We have checked historical data and high scores correlate with [profit/retention], not just activity."
  *   **Stop Condition (No):** The link is correlational only, or the mechanism is unknown.
  *   **Escalation:** If the link is weak but leadership insists, hand to COO. This is a **Causal** risk.
  *   **Defence:** Require a secondary "quality check" metric that must also be met to unlock the bonus (e.g., Volume + CSAT).

  #### Step 2: The Gaming Surface (Adversarial)
  *   **Question:** "List three cheap ways an employee can raise this number without doing the actual work."
  *   **Good Enough Answer:** "There are no obvious ways," OR "There are ways, but they are blocked by [system control/audit]."
  *   **Stop Condition (No):** You can list 3+ easy methods in 5 minutes.
  *   **Escalation:** If the gaming surface is high but the metric is critical, hand to COO. This is an **Adversarial** risk.
  *   **Defence:** Reduce **Gaming Surface** by automating data capture or adding random audits.
  *   **Field Check:** Record your **Gaming Surface** score (Low/Med/High). If High, automatic review required.

  #### Step 3: Who Holds the Pen (Adversarial)
  *   **Question:** "Does the person being scored also type the number into the system, or can they ask someone else to type it?"
  *   **Good Enough Answer:** "The system generates it automatically," or "A different team records it."
  *   **Stop Condition (No):** The team being scored controls the data entry field.
  *   **Escalation:** Hand to COO. No bonus scheme should rely on self-reported data without audit. This is an **Adversarial** risk.
  *   **Defence:** Change **Who Holds the Pen**. Move data entry to a neutral party or automate via sensor/API.
  *   **Field Check:** Record **Who Holds the Pen**. If "The Team", flag as Critical Risk.

  #### Step 4: The Tail Risk (Extremal)
  *   **Question:** "What happens if someone hits 150% of target? Do we still like what they did?"
  *   **Good Enough Answer:** "Yes, 150% is great," OR "We will cap the bonus at 120% to prevent weird behavior."
  *   **Stop Condition (No):** 150% performance implies cutting corners (e.g., skipping safety checks to move faster).
  *   **Escalation:** Hand to COO. This is a value call on risk tolerance. This is an **Extremal** risk.
  *   **Defence:** Flatten the incentive curve. Cap the bonus payout so there is no gain from extreme over-performance.
  *   **Field Check:** Assess **Reversibility**. If hitting the extreme causes permanent damage (e.g., client loss), the cap must be lower.

  #### Step 5: Detection Lag & Reversibility (Regressional/Extremal)
  *   **Question:** "If this metric breaks the business, how long until we notice, and can we fix it?"
  *   **Good Enough Answer:** "We will see it in the weekly ops review," and "We can stop the bonus next quarter."
  *   **Stop Condition (No):** We won't know for 6 months, or the damage is permanent (e.g., safety incident, lost enterprise client).
  *   **Escalation:** Hand to COO. If **Detection Lag** > 1 month or **Reversibility** is Low, this is a strategic risk, not a metric decision.
  *   **Defence:** Shorten the review cycle or add a "circuit breaker" metric that suspends the bonus if triggered.
  *   **Field Check:** Record **Detection Lag** (Days) and **Reversibility** (High/Low).

  ---

  ### Part 3: Where Your Four Fields Earn Their Keep

  You are tracking four specific fields. Here is how they function in the procedure above:

  1.  **Gaming Surface:**
      *   **Earns Keep:** In **Step 2**. It quantifies the **Adversarial** risk. If you can list 5 ways to game it in 2 minutes, the surface is too high.
      *   **Useless:** It doesn't tell you if the metric is *wrong* (Causal), only if it's *exploitable*. A metric can have low gaming surface but still be the wrong goal.

  2.  **Detection Lag:**
      *   **Earns Keep:** In **Step 5**. It dictates the monitoring frequency. If Lag is 90 days, you cannot review the metric quarterly; you need a leading indicator.
      *   **Useless:** If the damage is instant (e.g., a truck crash), lag is zero. This field matters most for slow-bleed problems like customer churn.

  3.  **Reversibility:**
      *   **Earns Keep:** In **Step 6 (Escalation)**. This is your "Kill Switch." If Reversibility is **Low** (e.g., safety, brand reputation), the procedure should default to **No** regardless of the benefit.
      *   **Useless:** For administrative metrics (e.g., "timesheets submitted on time"), reversibility is always high. Don't waste time scoring it there.

  4.  **Who Holds the Pen:**
      *   **Earns Keep:** In **Step 3**. This is the single biggest predictor of **Adversarial** failure. If the scorer holds the pen, assume the number is fake until proven otherwise.
      *   **Useless:** If the data is automated (IoT sensors, system logs), this field is irrelevant. It only matters for manual entry.

  ---

  ### Part 4: Running the Procedure on Live Proposals

  #### Proposal 1: "Cases Closed per Agent per Day" (Individual Bonus)
  *   **Step 1 (Causal):** Weak. Closing a ticket isn't solving a problem. (Risk: **Causal**).
  *   **Step 2 (Gaming):** High Surface. Agents can split one ticket into three, or close tickets without resolving them to reopen later. (Risk: **Adversarial**).
  *   **Step 3 (Pen):** The agent closes the ticket in the system. They hold the pen. (Risk: **Adversarial**).
  *   **Step 4 (Tail):** If an agent closes 200% of target, they are likely ignoring complex issues. (Risk: **Extremal**).
  *   **Step 5 (Lag/Rev):** Detection Lag is ~30 days (customer complaint cycle). Reversibility is Low (lost customer trust).
  *   **Verdict:** **REJECT.**
  *   **Why:** This is the burn you already experienced. The procedure confirms it. The **Gaming Surface** is too high and **Who Holds the Pen** is the agent.
  *   **Defence:** None sufficient. Move to team-level metrics with a quality gate (e.g., "Reopen Rate" < 5%).

  #### Proposal 2: "Cut 30-Day Re-shipments by 10%" (Returns Team)
  *   **Step 1 (Causal):** Strong. Re-shipments cost money and annoy customers. Reducing them saves margin. (Risk: **Low**).
  *   **Step 2 (Gaming):** Medium. Team could mark a re-shipment as a "new order" to hide it. (Risk: **Adversarial**).
  *   **Step 3 (Pen):** System generates re-shipment flags based on order ID linkage. Team does not hold the pen. (Risk: **Low**).
  *   **Step 4 (Tail):** If they cut 50%, are they refusing valid returns? Cap the bonus at 15% improvement. (Risk: **Extremal**).
  *   **Step 5 (Lag/Rev):** Detection Lag is 30 days (by definition). Reversibility is High (we can process the late returns next month).
  *   **Verdict:** **APPROVE (with conditions).**
  *   **Conditions:** Cap bonus at 15% improvement (Extremal defence). Audit 5% of "new orders" to ensure they aren't hidden re-ships (Adversarial defence).
  *   **Fields:** Gaming Surface (Med), Pen (System), Lag (30 days), Rev (High).

  #### Proposal 3: "Increase Share of A/B Tests That Beat Baseline" (Data Team)
  *   **Step 1 (Causal):** Broken. A high win rate means the team is only testing obvious things. The goal of a data team is *learning*, not just winning. Pushing this metric reduces innovation. (Risk: **Causal**).
  *   **Step 2 (Gaming):** High. Data scientists can tweak the baseline or stop tests early if they look like losers. (Risk: **Adversarial**).
  *   **Step 3 (Pen):** Data team defines the "baseline" and runs the test. They hold the pen. (Risk: **Adversarial**).
  *   **Step 4 (Tail):** 100% win rate is impossible unless you stop testing. (Risk: **Extremal**).
  *   **Step 5 (Lag/Rev):** Detection Lag is long (months of stagnation). Reversibility is Low (missed market opportunities don't come back).
  *   **Verdict:** **REJECT.**
  *   **Why:** This is the answer you won't like. You probably want a metric to show the Data Team is "delivering value." This metric incentivizes them to **stop taking risks**. It kills the function of the team.
  *   **Fields:** Gaming Surface (High), Pen (Team), Lag (90+ days), Rev (Low).
  *   **Alternative:** Measure "Estimated Value of Deployed Changes" or "Test Velocity" (number of valid tests run), not win rate.

  ---

  ### Part 5: Honest Reflection

  **Which steps are judgment dressed up as procedure?**
  Step 1 (Causal Link) and Step 5 (Reversibility).
  I can write "Assess Causal Link" on a form, but determining *if* closing a ticket causes customer satisfaction is not a technical check; it's a business hypothesis. You have to guess. The procedure forces you to write the guess down, which helps, but it doesn't make the guess true. Similarly, judging "Reversibility" requires you to predict the future. If you guess wrong and the damage is permanent, the checklist won't save you.

  **What this procedure can't do at all:**
  1.  **It can't fix a broken culture.** If the COO signals that "numbers at any cost" is the real goal, the team will game the checklist itself. They will lie about the Gaming Surface.
  2.  **It can't detect collusion.** The checklist assumes individual gaming. It doesn't catch Shift A and Shift B agreeing to swap loads to game the average. That requires forensic audit, not a vetting procedure.
  3.  **It can't replace leadership.** The "Escalation to COO" steps are where the real work happens. If the COO rubber-stamps everything, the checklist is just paperwork.
  4.  **It can't measure "Good."** It is designed to filter out "Bad." It will tell you when *not* to use a metric. It won't tell you the *perfect* metric. You still have to find that yourself.

  **Final Word:**
  The "A/B Test Win Rate" rejection will be painful. Your Data Lead will argue it's standard industry practice. It isn't; it's standard *amateur* practice. Stick to the procedure. If the **Causal Link** is "Winning tests makes us look good" rather than "Winning tests makes us money," the answer is No.
