answer: |-
  Here is the spec for the Problem of Old Evidence. It is broken down into the cases, intuitions, and distinctions an adequate account must handle, followed by the analysis of the tensions you suspect.

  ### I. The Spec: Desiderata for an Adequate Account

  #### 1. The Cases (Extensional Adequacy)
  *   **The Paradigm Case (GR/Mercury):** The account must validate the intuition that General Relativity received confirmatory support from the anomalous perihelion of Mercury, despite the data being well-established prior to Einstein's formulation of the theory.
      *   *Behind it:* Historical realists and scientists. If a formal theory of confirmation says this wasn't confirmation, the theory is out of touch with scientific practice.
  *   **The Curve-Fitting Case (Ad Hocery):** The account must distinguish between a theory derived independently that *happens* to fit old data, and a theory constructed *specifically to fit* old data (e.g., adding epicycles to Ptolemaic astronomy to match existing observations). The latter should receive less (or no) confirmatory boost.
      *   *Behind it:* Methodologists and anti-realists. This prevents "free rides" for theories designed post-hoc to match the target.

  #### 2. The Intuitions (Normative Adequacy)
  *   **The Confirmatory Intuition:** Learning that a hypothesis entails known evidence should be capable of raising the probability (or rational credence) of that hypothesis.
      *   *Behind it:* General scientific practice. We constantly accept theories because they "make sense of" existing data.
  *   **The Temporal Neutrality Intuition:** The logical relationship of support between $H$ and $E$ should not depend essentially on the calendar date. If $H$ entails $E$, the support relation exists timelessly.
      *   *Behind it:* Logical objectivists and likelihoodists. Support is a relation between propositions, not a psychological event.
  *   **The Psychological Realism Intuition:** Confirmation tracks the actual epistemic state of the agent. It should not depend on what the agent *would have* believed had they been ignorant.
      *   *Behind it:* Subjective Bayesians. Epistemology is about managing *your* credences, not the credences of a counterfactual version of you.
  *   **The Novelty Bonus Intuition:** Predicting a new fact should (in some contexts) provide stronger support than accommodating an old one.
      *   *Behind it:* Predictivists. There is a specific epistemic virtue in risk-taking prediction that mere accommodation lacks.

  #### 3. The Distinctions (Conceptual Adequacy)
  *   **Accommodation vs. Prediction:** The account must be able to differentiate between $H$ being built to fit $E$ (accommodation) and $H$ entailing $E$ without being built for it (prediction), even if $E$ is old in both cases.
      *   *Behind it:* Those who view the *process* of theory generation as relevant to justification, not just the final logical structure.
  *   **Agent-Perspective vs. Objective Support:** The account must clarify whether "confirmation" is a change in an individual's credence function or an objective relation between evidence and hypothesis.
      *   *Behind it:* This is the fault line between subjective Bayesians (confirmation = credence update) and logical confirmation theorists (confirmation = entailment/probability relation).

  ---

  ### II. The Incompatibilities (The Trilemma)

  Your suspicion is correct. The core of the problem is not just a puzzle; it is a clash of mutually exclusive requirements. You cannot satisfy the following three desiderata simultaneously within standard probability theory.

  **1. The "Actual Credence" Constraint**
  Confirmation is defined as a change in the agent's *actual* credence in $H$ upon learning $H$ entails $E$.
  **2. The "Old Evidence" Constraint**
  Evidence $E$ can confirm $H$ even if the agent's credence in $E$ is already 1 (certainty).
  **3. The "Orthodox Updating" Constraint**
  Rational updating follows standard Conditionalization: $P_{new}(H) = P_{old}(H | E)$.

  **Why they clash:**
  If you hold **1** and **3**, you kill **2**.
  If $P(E) = 1$ (Actual Credence), then by the math of Conditionalization, $P(H|E) = P(H)$. There is no update. Old evidence cannot confirm.
  *   *Standard Escape:* Drop **1**. Use counterfactual credences (pretend you didn't know $E$).
      *   *Cost:* Violates Psychological Realism. You are measuring the confirmation for a fictional agent, not the actual scientist.
  *   *Standard Escape:* Drop **3**. Use a different updating rule (e.g., Jeffrey Conditionalization or "entailment-based" confirmation).
      *   *Cost:* Violates Orthodox Updating. You lose the clean mathematical machinery of Bayesianism.
  *   *Standard Escape:* Drop **2**. Deny that Mercury confirmed GR.
      *   *Cost:* Violates Historical Realism. The theory becomes useless for analyzing actual science.

  **The Second Tension: Temporal Neutrality vs. Novelty Bonus**
  Even if you solve the math above, you face a second conflict regarding the *value* of the evidence.

  **A. Logical Support:** Support is a function of the logical relation between $H$ and $E$.
  **B. Process Sensitivity:** Support depends on *how* $H$ was constructed relative to $E$ (prediction vs. accommodation).

  **Why they clash:**
  If support is purely logical (**A**), then it shouldn't matter if $H$ was written before or after $E$ was known. The entailment is the same. This satisfies Temporal Neutrality but kills the Novelty Bonus (Prediction = Accommodation).
  If support depends on the process (**B**), you can preserve the Novelty Bonus, but you violate Temporal Neutrality. The support relation becomes time-indexed to the agent's history.

  **The Verdict on Your Suspicion:**
  You identified the primary trilemma: **"Old evidence confirms" + "Confirmation = function of actual credences" + "Standard Conditionalization."**
  You are not muddling the relativization. The conflict is exactly between the **agent's actual state** (where $P(E)=1$) and the **confirmation event** (which requires $P(E)<1$ to generate a boost).

  Most solutions "solve" this by shifting *what* is being relativized:
  *   **Counterfactual Accounts:** Shift the agent (relativize to a version of you that didn't know $E$). Saves Confirmation, loses Actual Credences.
  *   **Objective/Logical Accounts:** Shift the definition of confirmation (relativize to logical probability, not psychological credence). Saves Confirmation, loses Psychological Realism.
  *   **Error/Theory Change Accounts:** Shift the evidence (argue you didn't *really* know $E$ with certainty, or $E$ changed meaning). Saves Actual Credences, complicates the nature of Evidence.

  ---

  ### III. Scorecard

  | Desideratum | Status | Cost to Satisfy |
  | :--- | :--- | :--- |
  | **GR/Mercury Case** | **High Priority** | Requires abandoning strict $P(E)=1$ or strict Conditionalization. |
  | **Actual Credences** | **High Priority** | Incompatible with standard Bayesian update on old evidence. |
  | **Temporal Neutrality** | **Medium Priority** | Incompatible with distinguishing Prediction from Accommodation. |
  | **Novelty Bonus** | **Medium Priority** | Requires making confirmation dependent on theory-generation history, not just logic. |
  | **Orthodox Math** | **Variable** | Often the first thing sacrificed to save the intuitions. |

  **Summary:** You are asking for a theory that treats confirmation as a **psychological update** (Actual Credences) driven by **logical relations** (Temporal Neutrality) that respects **historical facts** (Old Evidence Confirms). The spec demands you pick two. Most philosophers pick **Old Evidence** and **Logical Relations**, and sacrifice **Actual Credences** (by using counterfactuals). If you want to keep **Actual Credences**, you must redefine **Confirmation** so it isn't just conditionalization.
