answer: |-
  The climate control unit hummed, a low B-flat that Elena felt in her teeth. On the stainless steel table sat Catalog #894-B: a sphere of gray kaolin, roughly the size of a grapefruit. It was dry, unfired, and fragile. According to the accession papers, it was the last lump of clay touched by Elias Thorne, the celebrated nineteenth-century potter, before his death in 1882.

  "It's the same matter, Elena," Director Henderson said, leaning against the doorframe. He checked his watch. "Physically, chemically. Not a gram changes. You smooth it out, you model the Founder's bust, you fire it. The clay is identical. Only the shape changes."

  Elena didn't look up from her magnifying lamp. "The object isn't the matter, Henderson. It's the history embedded in the form. If I reshape this, #894-B ceases to exist. You'd be destroying an artifact to make a paperweight."

  "It's for the anniversary," Henderson said, pushing off the frame. "Donors love narrative. 'The Founder, sculpted from the very earth the Master touched.' It's poetic. And since no mass is lost, no conservation ethics are violated. You're just... rearranging."

  "It's not neutral material," Elena said. She rotated the sphere on its foam cushion. "Look."

  She angled the lamp. On one side of the sphere, the clay wasn't smooth. Two shallow depressions marked eyes, a pinch formed a nose, a smear suggested a mouth. It was crude, childish, likely done by Thorne's grieving apprentice or perhaps the potter himself in his final delirium.

  "It's already a sculpture," Elena said. "A bad one, maybe. But it's not a lump. It's a face."

  Henderson waved a hand. "It's debris. Irregularities. If you blend it into the bust, you're honoring Thorne better than preserving his fatigue."

  "I'm hired to preserve, not improve."

  "You're hired to ensure the museum survives," Henderson countered. "Have the bust ready by Friday."

  He left before she could answer. Elena pulled on nitrile gloves. She hovered her hands over the clay. She could feel the static charge, the dryness. If she added water to soften it for sculpting, she would alter the chemical balance. If she dry-carved it, it might crack. But the deeper issue sat heavier in her chest.

  Henderson was arguing for material constitution. The clay *is* the object. Elena argued for historical identity. The arrangement *is* the object. They shared the same atoms, but they were different things, like a pile of lumber and a house. Burn the house, you have heat and ash, but you don't have a house. Reshape the clay, you have a bust, but you don't have Thorne's last touch.

  The door opened again. This time, it wasn't Henderson.

  A woman in a charcoal coat stood there, holding a leather portfolio. Dr. Aris Thorne, no relation to the potter, but the Senior Curator from the lending institution that held the ultimate provenance rights. She looked at the table, then at Elena.

  "Where is it?" Aris asked.

  "On the table," Elena said.

  Aris approached, peering over her glasses. "The loan agreement stipulates return in registered condition. Catalog #894-B. Spherical approximation. Surface irregularities noted in Section 4, Paragraph 2."

  "It hasn't been touched," Elena said.

  "Good." Aris tapped the table. "The Director mentioned a commemorative project. I'm here to prevent it."

  "He wants a bust."

  "Then he wants a new object," Aris said sharply. "We lent you the last material Elias Thorne touched. Not the material to make a statue of your Founder. If you sculpt this, the item we get back is a forgery. It shares the matter, but it lacks the identity."

  Elena blinked. "That's exactly what I told him."

  "Then you understand the liability." Aris opened her portfolio. "I need to box it now. The board is nervous. They know Henderson's... creative interpretation of conservation."

  Elena looked from the curator to the clay. The crude face stared back, blank and dusty.

  If she gave it to Aris, it remained #894-B. A lump with a sad face. Preserved in a box, unseen, safe.
  If she gave it to Henderson, it became the Founder. Visible, celebrated, dead as an artifact.

  But the matter remained. The kaolin didn't care. It would hold the bust's shape or the lump's shape with equal indifference. The conflict wasn't in the clay; it was in the story they told about it.

  "I can't release it without the Director's sign-off," Elena said.

  Henderson chose that moment to return, holding a printed mock-up of the anniversary brochure. "Perfect. You're both here. Elena, start the armature. Aris, you can witness the transformation. It adds legitimacy."

  "It invalidates the loan," Aris snapped. "You cannot alter the artifact."

  "It's not alteration, it's utilization," Henderson said. "The substance is preserved. The museum owns the clay. We're just updating the interface."

  "You're destroying the history to sell tickets," Aris said.

  "I'm keeping the lights on so people can see history," Henderson shot back.

  They turned to Elena. The hum of the HVAC seemed to grow louder.

  "Well?" Henderson said. "You're the conservator. You handle the objects. Tell her the clay is safe either way."

  Aris stepped forward. "Tell him the object is gone the moment you add water."

  Elena looked at her gloved hands. She looked at the clay. It was the same stuff. If she smoothed the crude face to make the Founder's noble brow, the atoms of the nose would migrate to the cheek. Nothing would leave the room. Nothing would be added. By Henderson's logic, nothing was lost. By Aris's logic, everything was lost.

  And yet, the crude face was already there. Someone had already shaped this clay. Thorne? The apprentice? If that face was the artifact, then the lump was already gone, changed decades ago. If the lump was the artifact, the face was damage.

  Elena reached out. Her fingers hovered over the crude eyes.

  "If I smooth this," Elena said quietly, "the mass is constant. But the identity shifts. You both know that."

  "I want the object logged in the database," Aris said.

  "I want the object on the pedestal," Henderson said.

  Elena closed her hand around the clay. It was cool and dry. She lifted it. It weighed exactly what it weighed before.

  "I need to assess structural integrity," Elena said. "I can't commit to sculpting or boxing until I know if it will survive handling."

  "That's stalling," Henderson said.

  "That's due diligence," Aris said.

  "Maybe," Elena said. She held the sphere between her palms. She could feel the slight ridge of the crude nose against her lifeline. She could apply pressure. She could soften it. She could lock it in a box.

  The matter was hers to hold. The definition was not.

  "I'll let you know," Elena said, setting the clay back down exactly where it had been, though she knew, technically, the rotation was now three degrees off from the logged position.

  Henderson frowned. Aris narrowed her eyes. Neither moved. The clay sat between them, identical to itself, and utterly disputed.
