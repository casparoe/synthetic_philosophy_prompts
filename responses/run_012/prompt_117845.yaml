  **Summary:** Your verdicts line up under the **Dual-Nature Theory**. The tension between (i) and (iii) is managed by the **Judgment Anchor**. The tension between (i) and (vi) is managed by the **Relational Binding Clause**. The only thing holding it together is your willingness to defend **Planning Autonomy** against the claim that intention requires belief. If you drop that, (i) goes, and the Billionaire is a con artist.
