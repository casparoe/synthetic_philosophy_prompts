          *   *Key Insight:* The variant shows the puzzle is about the **logic of mental states** vs. **logic of social institutions**. Intention claims *settledness*. Contracts claim *obligation* (which can be breached).
          *   *Verdict:* The puzzle survives only if the contract is treated as a proxy for intention. If treated as a legal instrument with damages, it dissolves. This suggests Camp 1 is right about *intention*, but Camp 2 is right that we *need* a mechanism like contracts to achieve what Camp 2 wants.
      *   *Section 3: Path to Progress.*
