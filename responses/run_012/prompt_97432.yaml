          *   *The Crux:* It's not just about the belief-requirement. It's about the **transparency of deliberation**. Camp 1 says deliberation looks outward to reasons for action. Camp 2 says deliberation can look inward to prior commitments. The real fight is about *diachronic rationality* vs. *synchronic rationality*. Camp 1 prioritizes the rationality of the agent *at the time of action* (tomorrow). Camp 2 prioritizes the rationality of the *plan over time* (tonight to tomorrow).
