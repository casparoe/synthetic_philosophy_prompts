answer: |-
  ### I. The Desiderata of Lottocratic Authority

  A theory of lottocratic authority must specify the conditions under which a random subset of the populace acquires the right to command the whole. It cannot simply assert this right; it must earn it against the five hard cases you provided. Here are the five requirements any such theory must satisfy, derived directly from those cases.

  **1. The Requirement of Substantive Constraint**
  *   **Generated by:** *The Unjust Outcome.* (A scrupulously fair draw produces a serious injustice.)
  *   **Specification:** The theory must specify a floor of fundamental rights or constitutional norms that the assembly cannot violate. If the assembly decides something that breaches this floor, its authority is void, regardless of the fairness of the draw.
  *   **Cost:** If the theory meets this requirement, it must give up the claim that *procedure alone* confers legitimacy. It admits that a decision can be procedurally perfect yet politically void. It sacrifices pure proceduralism for a hybrid of procedure and substance.

  **2. The Requirement of Deliberative Autonomy**
  *   **Generated by:** *The Captured Process.* (Demographic mirroring exists, but briefing and witnesses are steered by outsiders.)
  *   **Specification:** The theory must require that the body controls its own agenda, information flow, and expert selection. Authority is derived from the *judgment* of the members, not the *processing* of pre-selected data.
  *   **Cost:** It must give up the assumption that descriptive representation (who is in the room) is sufficient for legitimacy. A body that looks like the public but thinks like its manipulators has no claim to authority.

  **3. The Requirement of Rotation (Non-Professionalization)**
  *   **Generated by:** *The Repeat Members.* (A second lottery drawn from the alumni of the first.)
  *   **Specification:** The theory must forbid the formation of a permanent class of "citizen legislators." Service must be a one-off duty, not a career path or a recurring privilege.
  *   **Cost:** It must give up the efficiency and expertise gained by continuity. It prioritizes political equality (equal ex ante chance to serve) over institutional memory.

  **4. The Requirement of Temporal Revisability**
  *   **Generated by:** *The Self-Entrenchment.* (Voting to prevent reversal by later assemblies.)
  *   **Specification:** The theory must assert that no assembly can bind its successors. Every generation (or every subsequent lot) must retain the sovereign power to undo the decisions of the prior one.
  *   **Cost:** It must give up the promise of "finality." The theory cannot offer the assembly as a mechanism to "settle" a question forever. It ensures democracy remains open-ended, preventing the lottocracy from becoming a new aristocracy.

  **5. The Requirement of Statistical Fidelity**
  *   **Generated by:** *The High Decline Rate.* (The pool becomes whoever is willing.)
  *   **Specification:** The theory must require that the participating body remains a statistically valid sample of the whole. If attrition is high, the theory must mandate either compulsion to serve or statistical weighting of votes to correct for bias.
  *   **Cost:** It must give up the comfort of purely voluntary participation. It acknowledges that a "voluntary lot" is an oxymoron; if service is optional, the selection is no longer random, and the claim to represent the "will of the people" is broken.

  ---

  ### II. The Distinctions: Genuine Requirements vs. Partisan Commitments

  You asked to evaluate five specific distinctions. A robust theory must make four of them; the fifth is a choice between competing political philosophies.

  1.  **Selection vs. Authorization:** **Genuine Requirement.**
      *   *Reason:* Being picked (selection) is a mechanical fact; having the power to rule (authorization) is a normative status. A theory must explain the bridge between the two. It cannot assume the draw *is* the authority.
  2.  **Advice vs. Decision:** **Genuine Requirement.**
      *   *Reason:* This is the legal distinction you are voting on. A theory of authority must define whether the body's output changes the legal landscape (decision) or merely informs those who do (advice). Collapsing this distinction renders the vote meaningless.
  3.  **Sample vs. Stand-in:** **Genuine Requirement.**
      *   *Reason:* A sample describes the population (sociological); a stand-in acts on behalf of the population (political). A theory must specify which function the assembly serves. If it is merely a sample, it cannot bind; if it is a stand-in, it must be protected from the pressure to merely "poll" its constituents.
  4.  **Fair Draw vs. Good Outcome:** **Genuine Requirement.**
      *   *Reason:* The theory must weigh procedural fairness against substantive correctness. It cannot assume they are identical. It must state whether a fair process that yields a "bad" result retains authority (see Requirement 1).
  5.  **Right to Justification vs. Right to Consent:** **Partisan Commitment.**
      *   *Reason:* This is the only distinction where a theory must choose a camp.
          *   *Justification:* The theory claims you are bound if the decision is reasonably justified to you, even if you disagree (Liberal/Republican view).
          *   *Consent:* The theory claims you are bound only if you could have personally agreed to the decision (Libertarian/Radical Democratic view).
      *   *Verdict:* A general theory of lottocratic authority cannot demand *Consent* from those not in the room, or the lot would never bind anyone. Therefore, it must rely on *Justification*. Treating Consent as a requirement is a partisan commitment that effectively vetoes the possibility of lottocratic authority.

  ---

  ### III. The Incompatibilities (The Trade-Offs)

  You asked for pairs of requirements that cannot be jointly met. A surviving theory must admit these tensions and prioritize one over the other.

  **1. Statistical Fidelity vs. Voluntary Service**
  *   **The Conflict:** You cannot have a perfect random sample (Requirement 5) and fully voluntary participation (the reality of the High Decline case). If people can decline, the sample is biased toward the willing, the wealthy, or the retired. If you enforce the sample, you must compel service or heavily weight the votes of those who show up to match those who didn't.
  *   **The Trade-Off:** You must trade away the comfort of voluntarism. If you insist on voluntary service, you must admit the body is *not* a statistical mirror, weakening its claim to descriptive representation.

  **2. Binding Authority vs. Temporal Revisability**
  *   **The Conflict:** If the assembly's decisions are truly "binding" in the strong sense (settling the matter), they restrict the freedom of future assemblies (violating Requirement 4). If future assemblies can reverse the decision easily, the "binding" nature is weak.
  *   **The Trade-Off:** You must trade away the desire for permanence. A theory of lottocratic authority cannot promise to "solve" the issue forever. It must accept that "binding" means "binding until the next sovereign body decides otherwise."

  **3. Deliberative Autonomy vs. Accountability**
  *   **The Conflict:** To prevent the Captured Process (Requirement 2), the assembly must be independent of the Council and public pressure. But if they are fully independent, they are unaccountable to the public they represent between votes.
  *   **The Trade-Off:** You must trade away direct accountability mechanisms (like recalls or mandates) in favor of procedural safeguards (like independent facilitation). You trust the *process*, not the *people*.

  ---

  ### IV. The Exclusionary Requirement

  Which single requirement does the most to exclude the positions people actually hold?

  **The Requirement of Temporal Revisability.**

  *   **Why:** Most proponents of citizens' assemblies argue for them because they believe these bodies can break political gridlock and *settle* contentious issues permanently ("Let the people decide, and then we move on"). Most opponents fear that the assembly will enact changes that are *hard to reverse*.
  *   **The Exclusion:** A theory that insists on Revisability tells the proponents: "You cannot use this to end the debate." It tells the opponents: "You do not need to fear permanent tyranny." It excludes the most common popular understanding of the assembly as a "final arbiter." It forces everyone to accept that democracy is a continuous loop, not a destination.

  ---

  ### V. The Voting Commitment

  You asked what a theory that survives this list would commit you to when you cast your vote on whether the recommendations should bind the council.

  A theory that accepts the Desiderata above commits you to vote **FOR BINDING AUTHORITY**, but only under a specific description of what "binding" means.

  **The Reasoning:**
  1.  **Selection vs. Authorization:** If you vote "Advisory," you collapse the distinction between selecting a body and authorizing it. You reduce the assembly to a focus group. Given that you have already undergone the deliberation (Selection), voting against Authorization renders the entire exercise a sham, violating the *Requirement of Deliberative Autonomy* (why deliberate if you cannot decide?).
  2.  **Managing the Risks:** The risks you identified (Injustice, Capture, Entrenchment) are not solved by making the body advisory. They are solved by the *constraints* you now demand.
      *   If you fear **Injustice**, you rely on the *Substantive Constraint* (courts/rights review), not on making the advice non-binding.
