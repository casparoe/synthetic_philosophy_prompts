  The coin slips from my thumb to brass,
  It lands beside a scuffed-up shoe.
  I watch the shadow of me pass,
  And total up the final sum.

  The baker buys a warmer coat,
  The winter bites a little less.
  He keeps the child who stays afloat,
  And total up the final sum.

  The empire falls to rust and weed,
  New tongues are spoken on this street.
  The metal serves a different need,
  And total up the final sum.

  The hat remains upon the floor,
  The traffic hums outside the door.
  I stand exactly as before,
  With hand extended, seeking more.

  I wait beneath the setting sun,
  And total up the final none.

