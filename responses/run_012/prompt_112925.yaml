  ### Part 1: Brainstorming the Axes

  Before drawing the tree, we need to identify the philosophical fault lines. When readers ask, "Does my choice matter?", they are usually conflating four distinct questions. To build a useful tool, we have to separate them.

  1.  **The Causal Axis (Does it change the outcome?):** This is the empirical question. If I stay home, does the election result change? If I skip the burger, does one fewer animal die? This distinguishes *pivotal* acts from *inefficacious* ones.
  2.  **The Harm Structure Axis (Is it a cliff or a slope?):** If my act *does* make a difference, is it a "tipping point" difference (one vote wins the election) or a "drop in the bucket" difference (one ton of carbon adds imperceptibly to warming)? This separates *threshold* views from *expected value* views.
  3.  **The Participation Axis (Does joining in matter?):** If my act *doesn't* change the outcome, does it still matter that I participated in a harmful practice? This distinguishes *consequentialist* views (only outcomes matter) from *non-consequentialist* views (complicity, integrity, fairness).
  4.  **The Scope Axis (Who is responsible?):** If individual action is futile, is the moral obligation transferred to the collective? This separates *individual duty* views from *political duty* views.

  ***

  ### Part 2: The Decision Tree

  **Start:** Imagine you are about to perform the act (voting, buying the burger, taking the flight).

  **Node 1: The Difference Test**
  *Question:* "If you chose differently, would the specific bad outcome definitely still happen?"
  *   **Yes (It happens anyway):** Go to **Path A (Inefficacy)**.
      *   *(This is where your four cases land: The Batch Burger, The Landslide Vote, The Offset Flight, The 1001st Participant.)*
  *   **No (It changes the outcome):** Go to **Path B (Efficacy)**.

  ---

  #### Path A: Inefficacy (The outcome is the same)

  **Node 2: The Participation Test**
  *Question:* "Even if nothing changes, does it matter morally that you joined the crowd?"
  *   **Yes:** Go to **Node 3**.
  *   **No:** Go to **Node 4**.

  **Node 3: The Source of Worry**
  *Question:* "What worries you more: that you are tainted by a harmful group, or that you are damaging your own character?"
  *   **Tainted by Group:** **Leaf: The Complicity View.**
      *   *Description:* You are answerable for the collective wrong simply by being a part of it, regardless of your causal slice.
  *   **Damaging Character:** **Leaf: The Virtue and Integrity View.**
      *   *Description:* The act makes you the kind of person who disregards harm; the focus is on your moral identity, not the world's state.
      *   *(Note: See "Blurred Leaves" below.)*

  **Node 4: The Fairness Test**
  *Question:* "Is the main problem that you aren't doing your fair share of the burden?"
  *   **Yes:** **Leaf: The Rule or Fair-Share View.**
      *   *Description:* You have a duty to cooperate with a just scheme even if your individual contribution doesn't change the result, simply because it's unfair to free-ride.
  *   **No:** Go to **Node 5**.

  **Node 5: The System Test**
  *Question:* "Is the act itself morally suspect, or just the wrong way to fix things?"
  *   **Wrong Way (Need Laws):** **Leaf: The Permissible/Political Duty View.**
      *   *Description:* The individual act is harmless or permissible, but you have a duty to work toward institutional change where actions *do* have leverage.
  *   **Not Suspect:** **Leaf: The Nothing Wrong View.**
      *   *Description:* If the act causes no harm and violates no duty, it is morally neutral. Worrying about it is a distraction.

  ---

  #### Path B: Efficacy (The outcome changes)

  **Node 6: The Shape of Harm**
  *Question:* "Is the harm a sudden cliff (one vote tips it) or a gradual slope (one burger adds to demand)?"
  *   **Sudden Cliff:** **Leaf: The Threshold or Pivotal-Act View.**
      *   *Description:* Morality tracks discrete outcomes; if you are the one who tips the scale, you bear responsibility for the whole harm.
  *   **Gradual Slope:** Go to **Node 7**.

  **Node 7: The Scale of Harm**
  *Question:* "Is your contribution a tiny but real piece of the harm, or just a risk?"
  *   **Tiny but Real:** **Leaf: The Imperceptible Wrong View.**
      *   *Description:* Harm is aggregate; every tiny contribution is a genuine part of the harm, even if no one can feel the difference.
  *   **Just a Risk:** **Leaf: The Expected-Consequences Reply.**
      *   *Description:* Your act creates a probability of harm; you should weigh the size of the harm against the likelihood of causing it.
  *   **Neither (Harm exists but doesn't count):** **Leaf: Unnamed.**
      *   *Reason:* **Incoherent.** (This view admits causal harm but denies moral relevance without appealing to virtue or politics, which contradicts the premise of Path B).

  ***

  ### Part 3: Annotations for the Feature

  **Where the Four Cases Land**
  All four cases you provided are instances of **Individual Inefficacy**, so they all enter the tree at **Node 1 (Yes)** and flow down **Path A**.
  1.  **The Batch Burger:** Lands in **Path A**. Because the supermarket orders in bulk, one purchase does not trigger a new order. The debate then turns on Node 2 (Does buying it make me complicit?) or Node 5 (Is this a job for policy?).
  2.  **The Landslide Vote (with Roommate):** Lands in **Path A**. Because your roommate substitutes your ballot, the outcome is identical. This is a classic "no difference" case, pushing the reader toward the Political Duty or Nothing Wrong leaves unless they hold a Virtue view.
  3.  **The Offset Flight:** Lands in **Path A**. Because the donor covers the emissions, the *net* harm is zero. This case often tempts readers toward the **Nothing Wrong View**, though Complicity theorists might argue you still participated in the *practice* of emitting.
  4.  **The 1001st Participant:** Lands in **Path A**. You know you are not the threshold trigger. This is the purest test of the **Complicity** vs. **Nothing Wrong** debate, as causal responsibility is explicitly ruled out.

  **Blurred Leaves**
  **The Complicity View** and **The Virtue and Integrity View** (Node 3).
  *Why they blur:* Both views argue that the act is wrong even without causal impact, and both look inward at the agent rather than outward at the consequence. In practice, a philosopher who argues you shouldn't buy the burger because it "dirty your hands" (Complicity) often also argues it "makes you a callous person" (Virtue). The distinction is analytical (one focuses on your relationship to the group, the other to your own soul), but for a reader deciding what to do, the practical advice is identical: "Don't do it."

  **Empty Branches**
  **The Unnamed Leaf** (Path B, Node 7).
  *Why it's empty:* **Incoherent.** This branch represents a person who admits their act causes real harm (Path B) and that the harm is measurable (Node 7), but concludes the act is morally neutral without shifting the argument to character or politics. There is no stable philosophical position that says "I caused this harm, but it doesn't matter at all," unless one is a moral nihilist, which falls outside the scope of this normative debate.

  **How to Use This Tree**
  Tell your readers to start at Node 1. Most of their anxiety lives in Path A. If they find themselves in Path A but feel a strong urge to act, they are likely intuitively drawn to Node 3 (Complicity/Virtue) or Node 4 (Fair-Share). If they feel relieved, they are likely at Node 5 (Political/Nothing Wrong). The tree doesn't tell them which answer is *true*, but it tells them which argument they are actually having.
