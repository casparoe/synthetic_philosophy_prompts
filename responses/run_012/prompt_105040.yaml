      *   *Could we reject (7)?* Some eliminativists (e.g., Szasz, sometimes Churchland) *do* argue psychiatry isn't legitimate science. But the user explicitly says they want to avoid (5)/(6). So stick with rejecting (1).
      *   *Nuance on "Legitimacy":* We need to redefine what "scientifically legitimate" means in premise (1). It shouldn't mean "tracks mind-independent kinds." It should mean "supports reliable inference and intervention within the looping context."

  7.  **Final Polish:**
