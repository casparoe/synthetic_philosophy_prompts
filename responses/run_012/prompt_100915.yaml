answer: |-
  # Diagnostic Instrument for Metric Failure
  **Seminar Handout: Measurement and Incentive Design**

  ## Part I: The Diagnostic Tree

  This instrument is designed to isolate the mechanism driving a failure between a proxy measure and a true goal. Proceed through the nodes sequentially. At each node, answer the question based on the evidence available in the case.

  **Node 1: Did the recorded value of the metric move in the direction of the target?**
  *   **Case that sorts:** A hospital implements a hand-washing counter. The counter readings remain flat despite a bonus for high counts. (Path: Metric did not move).
  *   **Case triggering multiple leaves:** A school district reports rising test scores, but independent audits show scores are static. This could be **Adversarial** (administrators falsifying data) or **Definitional** (the metric is defined as "reported scores," so technically it moved, but the definition of "score" is broken).
      *   *If No:* Go to Node 2.
      *   *If Yes:* Go to Node 3.

  **Node 2: Did the metric fail to register a change because the measurement tool itself is broken?**
  *   **Case that sorts:** A thermometer used to monitor reactor temperature reads a constant 20°C despite the core melting. The device is physically damaged. (Path: Definitional Failure).
  *   **Case triggering multiple leaves:** A software team tracks "bugs fixed." The number stays zero. This could be **Definitional** (the bug tracker is offline) or **Misdescribed Goal** (the goal was "software stability," and zero bugs fixed means stability is already high, so the metric is working as intended by showing no work needed).
      *   *If Yes (Tool Broken):* **Leaf: Definitional Failure.** (The "law" explains nothing; the instrument is invalid).
      *   *If No (Tool Works):* **Leaf: Misdescribed Goal.** (The metric is functioning as intended; the goal was misdescribed).

  **Node 3: Did the actual outcome of interest move in the desired direction alongside the metric?**
  *   **Case that sorts:** A call center reduces "average handle time" (metric) and customer satisfaction scores (goal) rise simultaneously. (Path: Success).
  *   **Case triggering multiple leaves:** A factory increases "units produced" (metric) but "profit" (goal) stays flat. This could be **Extremal** (producing too many units crashed the price) or **Misdescribed Goal** (profit was never the actual constraint; market share was).
      *   *If Yes:* **Leaf: Misdescribed Goal.** (Metric tracks goal; stakeholders are unhappy with the goal itself).
      *   *If No:* Go to Node 4.

  **Node 4: Did the human agents responsible for the metric know the target existed?**
  *   **Case that sorts:** A central bank changes inflation calculation methods secretly. Market actors trade based on old data. (Path: Agents unaware).
  *   **Case triggering multiple leaves:** **The Ambulance Case.** A hospital trust faces a 4-hour waiting time target. Patients are held in ambulances outside. Agents (administrators) knew the target. However, if the dispatch software automatically rerouted ambulances without human input, it could be **Extremal** (system overload) rather than **Adversarial**.
      *   *If No:* Go to Node 5.
      *   *If Yes:* Go to Node 6.

  **Node 5: Was the data subset selected based on the metric value itself?**
  *   **Case that sorts:** A study analyzes only students who scored above 90% on a pre-test to predict final grades. The correlation vanishes. (Path: Regressional).
  *   **Case triggering multiple leaves:** A venture capital firm invests only in startups with high user growth (metric). Returns are low. This could be **Regressional** (selection on the predictor inflates correlation) or **Extremal** (high growth startups are inherently volatile/risky tails).
      *   *If Yes:* **Leaf: Regressional.** (Correlation inflated by selection).
      *   *If No:* Go to Node 7.

  **Node 6: Did agents alter the *recording* of the metric without changing the underlying process?**
  *   **Case that sorts:** Police officers downgrade felonies to misdemeanors to keep "serious crime" metrics low, without changing patrol behavior. (Path: Adversarial).
  *   **Case triggering multiple leaves:** Teachers teach to the test. If they only teach test-taking strategies (recording skill) without teaching subject matter, it is **Adversarial**. If they teach subject matter but the test is noisy, it could be **Extremal**.
      *   *If Yes:* **Leaf: Adversarial.** (Agents exploit the gap between measure and meaning).
      *   *If No:* Go to Node 8.

  **Node 7: Did agents alter the *process* to satisfy the metric while bypassing the intent?**
  *   **Case that sorts:** **The Ambulance Case.** (See Node 4). Administrators hold patients in ambulances to stop the clock. The process (care delivery) is altered to satisfy the measure (waiting time) while bypassing the intent (rapid treatment). (Path: Adversarial).
  *   **Case triggering multiple leaves:** A software team deploys code faster to meet "deployment frequency" targets. If quality drops because they skip tests, it is **Adversarial**. If quality drops because the deployment pipeline physically breaks under load, it is **Extremal**.
      *   *If Yes:* **Leaf: Adversarial.** (Agents exploit the gap between measure and meaning).
      *   *If No:* Go to Node 9.

  **Node 8: Is the current metric value outside the range of historical observation?**
  *   **Case that sorts:** A power grid operates at 99% capacity (historical max was 80%). Failures spike. (Path: Extremal).
  *   **Case triggering multiple leaves:** A drug dosage is increased to 10x the normal level. If the patient dies due to toxicity, it is **Extremal** (tail noise). If the patient dies because the drug blocks a necessary immune response, it is **Causal**.
      *   *If Yes:* Go to Node 10.
      *   *If No:* Go to Node 11.

  **Node 9: Is the metric operating within its normal distribution but failing to predict?**
  *   **Case that sorts:** A credit score predicts default well for most applicants but fails for a specific demographic within the normal score range. (Path: Regressional or Definitional).
  *   **Case triggering multiple leaves:** A marketing campaign increases "clicks" (metric) but not "sales" (goal) within normal ranges. This could be **Regressional** (clicks were selected for interest, not intent) or **Misdescribed Goal** (clicks were never the right proxy for sales).
      *   *If Yes:* **Leaf: Regressional.** (Correlation inflated by selection).
      *   *If No:* Go to Node 11.

  **Node 10: Does the failure arise from noise or non-linearity in the tails?**
  *   **Case that sorts:** High-frequency trading algorithms maximize trade volume until market liquidity evaporates. The metric (volume) no longer maps to value. (Path: Extremal).
  *   **Case triggering multiple leaves:** **The Drug Case.** (See Node 12). A drug suppresses a biomarker (metric) at high doses. If the biomarker measurement becomes unreliable at high concentrations, it is **Extremal**. If the biomarker is accurate but biologically protective, it is **Causal**.
      *   *If Yes:* **Leaf: Extremal.** (Metric adequate near centre, noisy in tails).
      *   *If No:* Go to Node 12.

  **Node 11: Is the metric a physical or mechanical component of the goal?**
  *   **Case that sorts:** A weight-loss program uses "scale weight" (metric) to track "health" (goal). Weight is a component, but not the whole. (Path: Causal or Misdescribed).
  *   **Case triggering multiple leaves:** A company optimizes "revenue." Revenue is a cause of "profit." If revenue rises but profit falls due to costs, it is **Misdescribed Goal**. If revenue rises by selling below cost, destroying the firm, it is **Causal** (intervening on revenue broke the firm).
      *   *If No:* **Leaf: Regressional.** (Correlation was spurious).
      *   *If Yes:* Go to Node 12.

  **Node 12: Does intervening on the metric change the goal directly?**
  *   **Case that sorts:** **The Drug Case.** A drug reliably suppresses a cardiac arrhythmia (biomarker/metric) but increases mortality (goal). The biomarker is causally linked to the heart's function. Intervening on it moves the goal (mortality) directly, but negatively. (Path: Causal).
  *   **Case triggering multiple leaves:** A teacher spends all class time on test prep. Student scores (metric) rise. If this reduces critical thinking (goal), it is **Causal** (teaching to the test changes the student's mind). If the teacher cheats, it is **Adversarial**.
      *   *If No:* **Leaf: Extremal.** (Optimization drove cases into tails).
      *   *If Yes:* Go to Node 13.

  **Node 13: Does the goal change in the expected direction?**
  *   **Case that sorts:** Insulin lowers blood sugar (metric) and improves health (goal). The intervention works as predicted. (Path: Success/Misdescribed).
  *   **Case triggering multiple leaves:** **The Drug Case.** (Revisited). The drug lowers the biomarker. If health improves, it is success. If health worsens, it is **Causal**. Why is it not **Adversarial**? Because biological systems do not have intent to exploit the gap; the mechanism itself is flawed.
      *   *If Yes:* **Leaf: Misdescribed Goal.** (Metric works, goal was wrong).
      *   *If No:* Go to Node 14.

  **Node 14: Is the negative outcome a side effect of the intervention or a reversal of the link?**
  *   **Case that sorts:** A pesticide kills pests (metric) but poisons the soil (goal). This is a side effect. (Path: Causal).
  *   **Case triggering multiple leaves:** A manager micromanages to increase "hours logged" (metric). Productivity (goal) drops. This is **Causal** (management style causes drop). If employees pretend to work, it is **Adversarial**.
      *   *If Side Effect:* **Leaf: Causal.** (Metric is a cause/effect; intervening moves goal).
      *   *If Reversal:* Go to Node 15.

  **Node 15: Was the correlation originally observed in a non-interventional setting?**
  *   **Case that sorts:** Observational data shows coffee drinkers live longer. Intervention (forcing coffee) shows no benefit. (Path: Regressional/Causal).
  *   **Case triggering multiple leaves:** A policy forces schools to hire more teachers (metric) to improve outcomes (goal). If outcomes don't improve, it could be **Causal** (teachers don't cause outcomes directly) or **Regressional** (original data selected rich schools).
      *   *If Yes:* **Leaf: Regressional.** (Selection inflated correlation).
      *   *If No:* Go to Node 16.

  **Node 16: Is the definition of the metric identical to the definition of the goal?**
  *   **Case that sorts:** The goal is "reduce wait time." The metric is "wait time." The metric rises. (Path: Definitional).
  *   **Case triggering multiple leaves:** The goal is "reduce suffering." The metric is "reported pain." If reported pain rises, is it **Definitional** (pain is suffering) or **Adversarial** (patients exaggerating)?
      *   *If Yes:* **Leaf: Definitional Failure.** (Failure is definitional).
      *   *If No:* **Leaf: Causal.** (Intervention revealed hidden causal structure).

  ---

  ## Part II: Limitations of the Instrument

  **Indistinguishable Pairs**
  This tree cannot reliably separate **Extremal** and **Causal** failures in all instances. Both manifest as a correlation holding in normal conditions and breaking under optimization.
  *   *Reason:* Coincidence of symptoms. When a system is pushed to the tail (Extremal), the causal mechanisms often change (Causal). For example, in the Drug Case, if the biomarker is suppressed so deeply it triggers a secondary failure, is that tail noise or a causal reversal? Without mechanistic modeling, the diagnostic symptoms are identical: intervention broke the link.

  This tree also struggles to separate **Adversarial** from **Misdescribed Goal** when agents game the system *because* the goal is wrong.
  *   *Reason:* Absence of a discriminating case. If teachers teach to the test because the test measures rote memory rather than understanding, is the failure that teachers are gaming (Adversarial) or that the test measures the wrong thing (Misdescribed)? The tree forces a choice based on intent, but the structural error is often shared.

  **Question Ordering Strategies**
  1.  **To Avoid Misdiagnosis:** Begin with **Node 4 (Agent Awareness)** and **Node 6 (Recording vs. Process)**. Human intent is the hardest variable to prove and the easiest to assume. By isolating adversarial behavior early, you prevent attributing strategic gaming to statistical noise (Regressional/Extremal).
  2.  **To Find the Quickest Fix:** Begin with **Node 8 (Historical Range)** and **Node 1 (Metric Movement)**. Checking if a metric is in the tails or broken is computationally cheap and immediate. If the metric is in the tail, capping it is a faster fix than auditing agent intent or rebuilding causal models.

  ---

  ## Part III: Remedy Table

  | Diagnosis | Remedy Licensed | Remedy Ruled Out | Warning |
  | :--- | :--- | :--- | :--- |
  | **Regressional** | Randomize selection; use control groups. | Optimizing on the selected subset. | Collecting more data from the same biased source will not fix selection inflation. |
  | **Extremal** | Cap the metric; use robust loss functions. | Linear extrapolation of incentives. | Adding more weight to the metric will drive the system further into the noisy tail. |
  | **Causal** | Model the mechanism; use intermediate proxies. | Direct intervention on the metric. | Pulling the lever moves the goal, but assuming the direction is safe is the error. |
  | **Adversarial** | Audit for gaming; randomize inspections. | Increasing the incentive magnitude. | Higher rewards for the same metric will only deepen the exploitation of the gap. |
  | **Misdescribed Goal** | Redefine the goal; consult stakeholders. | Improving the metric precision. | A perfect measure of the wrong thing is still a measure of the wrong thing. |
  | **Definitional** | Discard the metric; rebuild the ontology. | Calibrating the instrument. | Tuning a broken definition is a category error, not a measurement error. |

  **Critical Distinction:** The remedy for **Adversarial** (Audit) is a mistake for **Extremal** because auditing assumes bad faith. If the system is simply breaking under load (Extremal), auditing agents will not reveal the mechanical failure and will damage trust. Conversely, the remedy for **Extremal** (Cap the metric) is a mistake for **Adversarial** because agents will simply find a new gap to exploit if the underlying incentive to game remains.

  ---

  ## Part IV: Unoccupied Space

  Among positions actually defended in policy and engineering, certain combinations of answers in this tree remain unoccupied. Specifically, the combination of **Adversarial Intent** with **Definitional Failure** is rarely claimed. Actors seldom argue, "We intentionally exploited the fact that the metric was definitionally broken." This position is likely **unattractive** rather than incoherent; admitting to gaming a broken definition invites severe reputational sanction without the defense of "the system made us do it."

  Similarly, the combination of **Regressional** selection with **Causal** intervention is **unexplored**. Most analyses treat selection bias (statistical) and causal breakdown (mechanical) as mutually exclusive explanations for correlation failure. However, a case where agents select a subset *to* intervene upon causally (e.g., selecting high-risk patients for a risky surgery) occupies this space. It remains unoccupied because it requires simultaneous expertise in econometrics (selection) and domain mechanics (causality), which are typically siloed disciplines. Finally, **Misdescribed Goal** paired with **Adversarial** behavior is often **incoherent** in defense: if the goal is wrong, agents claim they are "correcting" the system, not gaming it. They cannot logically claim both that the goal is invalid and that they are strategically subverting it for personal gain; they must choose the moral high ground or the confession of greed.
