answer: |-
  **The game, stated flatly**

  The dollar auction is a non-zero-sum game played between an auctioneer and at least two bidders. A single prize of fixed value (say, £1) is offered. Bidding starts low, and participants alternate raises. The critical mechanic is the payment rule: the highest bidder wins the prize and pays their bid, but the second-highest bidder also pays their final bid and receives nothing. This creates a specific trap. Once the bidding exceeds half the prize value, the second-highest bidder faces a certain loss. If they stop, they pay their bid for nothing. If they bid higher, they might win the prize and reduce the net loss, or at least push the loss onto the opponent. Rational actors, seeking to minimise loss rather than maximise gain, are structurally compelled to escalate bids beyond the prize's worth. It is technically a variant of an all-pay auction, but the penalty on the runner-up is the engine of escalation. The game requires visible sunk costs, alternating moves, no binding commitment to stop, and a fixed prize value. Psychology is not required to explain the escalation; the payoff matrix dictates it.

  **The mapping**

  Mapping Afghanistan onto this framework requires careful distinction between literal and metaphorical fits. The most obvious mapping posits the US and the Taliban as the two bidders. The prize is control over Afghanistan. The bids are resources: money, troops, and political capital. However, this fails the strict payment rule. The US paid money; the Taliban paid in blood, but not into a common pot. There was no mechanism where the Taliban handed resources to the US upon losing a round. A more sophisticated mapping suggests the US was bidding against its own previous position. Here, the 'runner-up' is the option of withdrawal. If the US withdrew (stopped bidding), it paid the sunk cost of prior investment (lost prestige, wasted expenditure) with zero return. If it stayed (bid higher), it paid more but retained a chance of a payoff. This fits the 'runner-up pays' logic better: the penalty for losing is the waste of previous bids.

  The prize, however, was not fixed. In the game, the £1 coin remains £1. In Afghanistan, the value of a 'stable Afghanistan' depreciated over twenty years as domestic will eroded and the Taliban adapted. The auctioneer is ambiguous. In the game, the auctioneer collects the revenue. In Afghanistan, the 'collector' was diffuse: military contractors, the broader economy, or simply the void of history absorbing the cost. There was no single entity profiting directly from the escalation in the way an auctioneer does.

  Regarding conditions, the case meets several. Bids were sunk and visible (troop deployments are public). There was no way to lock in a commitment to stop; every administration retained the option to quit. Alternating moves are less clear; warfare is simultaneous, not turn-based, though surges and withdrawals mimic turns. The critical failure is the second payer. Unless one views the 'withdrawal option' as a player, there was only one active bidder writing cheques. The Taliban were not bidding against the US in currency; they were enduring. This makes the mapping metaphorical rather than mechanical. The US was not outbid by the Taliban; it was outlasted. The trap was not that the Taliban bid higher, but that the cost of withdrawal remained higher than the cost of staying, regardless of the Taliban's actions.

  **Structure versus psychology**

  The standard psychological explanation for escalation in the dollar auction relies on sunk cost fallacy and self-justification. A bidder escalates because admitting defeat validates their earlier error. This explanation struggles significantly with the Afghanistan case due to personnel turnover. George W. Bush initiated the conflict; Barack Obama surged; Donald Trump negotiated; Joe Biden withdrew. These actors had divergent political incentives and no personal ownership of the initial 2001 decision. Biden had no psychological need to justify Bush's invasion. If individual self-justification were the primary driver, the escalation should have fractured when power changed hands. The fact that the commitment persisted across four administrations suggests the driver was structural, not psychological.

  The structural payoff model survives this turnover because the matrix remained constant regardless of the player. For each President, the choice was identical: accept a certain loss (withdrawal amidst chaos, perceived geopolitical defeat) or bid higher (surge, stay, negotiate from strength) to potentially mitigate that loss. The institution, rather than the individual, owned the commitment. The Pentagon and State Department maintained the continuity of the 'bid', preserving the logic that withdrawal costs exceeded engagement costs. This supports your suspicion: the escalation was rational within the constrained payoff structure, even if the overall outcome was disastrous.

  However, a version of the psychological story does survive if shifted from the individual to the institution. 'Organisational sunk costs' function similarly to individual ones. The military machine justified further investment to validate prior deployments. Yet, this is still secondary to the structural reality. Even a purely rational actor, devoid of ego, facing a choice between a guaranteed loss of credibility and a probabilistic chance of success at higher cost, might choose the latter. The turnover of leaders confirms the structural argument: the trap was in the situation, not the minds of the men. The game predicts escalation without requiring the bidders to be irrational, only loss-averse. Afghanistan shows that rational loss-aversion across sequential actors produces the same escalation as individual irrationality.

  **Where the case breaks the theory**

  The ending of the Afghanistan involvement exposes the limits of the dollar auction model. In the game, the auction ends when one bidder quits and pays their penalty. The US did not simply quit; it negotiated a exit deal in Doha. This is a move the game does not anticipate. The dollar auction assumes a binary outcome: win the prize or lose the bid. The US secured a negotiated withdrawal, trading concessions (prisoner releases, timeline guarantees) for safety. This transforms the game from a strict auction into a bargaining scenario. The US paid its bids, but it also extracted side-payments from the Taliban, altering the payoff matrix.

  Furthermore, the depreciating prize value breaks the game's logic. In the dollar auction, escalation is driven by the fixed value of the prize relative to the bids. In Afghanistan, as costs rose, the perceived value of the prize fell. Rational actors should stop bidding when the cost exceeds the value. The fact that bidding continued suggests either the value was artificially propped up (by rhetoric) or the cost of quitting (the runner-up penalty) was perceived as infinite. The latter aligns with the game, but only if the 'prize' is redefined as 'avoiding catastrophic failure' rather than 'winning Afghanistan'.

  Additionally, the lack of a second paying bidder is a fundamental anomaly. The dollar auction requires two parties driving the price up. In Afghanistan, the Taliban did not drive the price up; they simply refused to leave. This is a war of attrition, not an auction. In attrition, the winner is the one who can endure the longest, not the one who bids the highest increment. The US spent money; the Taliban spent time and lives. These are different currencies. The dollar auction cannot model asymmetric costs effectively. It assumes both players are paying into the same pot. Here, the US paid into a void, while the Taliban paid into their own survival. The game also assumes perfect information of bids. In war, enemy strength and resolve are hidden. The US constantly misjudged the Taliban's willingness to pay, leading to bids that were structurally unsound. The theory cannot see the fog of war. Finally, the auctioneer collects the profit in the game. In Afghanistan, the lack of a clear collector suggests the escalation was value-destroying for all, including the 'house'. The game implies a transfer of wealth; the war implied a dissolution of it.

  **My verdict**

  Afghanistan is better read as a war of attrition with asymmetric costs than a dollar auction. The dollar auction requires two active financial bidders driving a price up against a fixed prize. Afghanistan featured one side spending currency against another spending endurance, with a prize that depreciated over time. The structural explanation for escalation holds water better than the psychological one, given the leadership turnover, but the game mechanics do not fit the payment rules.

  I would change my mind if evidence showed the Taliban making concrete, escalating concessions that directly forced US counter-bids in a turn-based loop, rather than simply resisting. If the Taliban had 'bid' resources to the US to win control, the auction model would fit. My reasoning is weakest on the definition of the 'prize'. If the prize was purely domestic political cover for US administrations, the value might have remained fixed longer, but the 'runner-up pays' rule still fails. The dollar auction is a useful metaphor for the trap of sunk costs, but structurally, it is the wrong game for a counter-insurgency.
