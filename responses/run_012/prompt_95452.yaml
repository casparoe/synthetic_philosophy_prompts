  my partner and i just had our first kid, and for some reason thats turned me into someone who reads about climate economics at 2am. the rabbit hole led me to the whole fight over discount rates — how much we should spend now to stop bad stuff happening in a hundred or two hundred years. anyway at dinner my brother in law, who works in finance, kept brushing the whole thing aside with "a bird in the hand is worth two in the bush", like that settled why we shouldn't sacrifice much now for people far in the future. i couldnt tell if he was making a point about risk, or about time passing, or just being glib to end the conversation.

  can you lay out the different precise things that proverb could actually be claiming, from the totally trivial to the fairly radical, and for each one say whether its actually true, or defensible, or just false? then tell me which of those readings, if any, would really do the work he wanted it to do — i suspect its quietly doing two different jobs at once and getting away with it, but i cant see how. and say which reading people probably have in mind when they trot it out. please write it as continuous prose, no headings, no bullets, no bold, no tables, just the way youd write an email.
