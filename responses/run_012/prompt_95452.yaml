answer: |-
  Congratulations on the new kid, and welcome to the 2am club. It is completely normal that becoming a parent has sharpened your focus on the long term in a way that abstract statistics never could. You are right to be suspicious of your brother-in-law's comment, not because he is necessarily malicious, but because that proverb is a rhetorical Swiss Army knife that people often use to cut through complex ethical knots without admitting they are holding a knife. To understand why it feels unsatisfying, we have to separate the distinct economic and philosophical claims hiding inside that phrase, because it is actually doing three different jobs at once, and only one of them holds up under the weight of climate economics.

  The first and most literal reading of the proverb is about risk and uncertainty. In this view, the bird in the hand is a certain payoff, while the birds in the bush are probabilistic. You might catch them, or you might not, or the bush might be empty. From a finance perspective, this is perfectly defensible and generally true. Investors demand a risk premium for uncertain future cash flows, and if the future benefit of climate action is uncertain, a rational actor might prefer certain consumption today. However, in the context of climate change, this reading gets turned on its head. The bird in the hand is actually the fossil fuel energy we consume now, while the bird in the bush is the avoided catastrophe later. The uncertainty isn't just about whether the climate policy will work, but about how severe the damage will be if we don't act. By framing the future benefit as merely uncertain, this reading ignores the possibility that the bush contains a tiger rather than just empty air, meaning the risk adjustment should arguably go the other way. So while the logic of risk aversion is sound in a vacuum, applying it here assumes we know the probability distribution of climate outcomes better than we actually do.

  The second reading is about pure time preference, which is the idea that we value satisfaction today more than satisfaction tomorrow simply because it is today. This is the psychological component of the proverb, suggesting that waiting is inherently costly or painful. In descriptive economics, this is true; humans are impatient. But in normative economics, specifically regarding intergenerational equity, this is highly controversial. The philosopher Frank Ramsey argued that discounting future generations simply because they exist in the future is ethically indefensible. If you accept this reading, your brother-in-law is making an ethical claim that your child's welfare is worth less than his current comfort solely due to the passage of time. This is defensible as a description of human behavior, but it is false as a moral principle for public policy, which is why climate economists like Stern argue for a near-zero pure time preference rate when dealing with centuries-long timelines.

  The third reading is about opportunity cost and capital productivity. This version suggests that the bird in the hand can be invested to breed more birds. If you save money today rather than spending it on climate mitigation, that capital can be invested in the economy to generate growth, making future generations richer and better able to handle climate problems. This is the standard finance argument and it is true under conditions of steady economic growth and substitutability. It assumes that money today will yield a higher return than the damage caused by carbon emissions. However, this reading becomes false if climate change damages the economy so severely that growth stops or reverses, or if the specific capital needed to survive a changed climate is natural stability rather than financial wealth. If the bush burns down, having more birds in the hand won't help you.

  When you suspect the proverb is doing two different jobs at once, you are spot on. The work your brother-in-law wants it to do is to conflate the risk argument with the time preference argument to justify a high discount rate without having to defend either one individually. By saying a bird in the hand is worth two in the bush, he smuggles in the idea that the future is both uncertain and less valuable, which mathematically compounds to drastically reduce the present value of future climate damages. This allows him to treat an existential threat like a standard market investment with a manageable risk profile. It gets away with this because the proverb sounds like folk wisdom about prudence, but in economics, it functions as a formula that determines how much sacrifice is acceptable. If he only argued that the future is uncertain, you could point out the risks of inaction. If he only argued that we prefer money now, you could point out the ethical obligation to your child. By combining them into a catchy phrase, he avoids having to specify whether he doubts the science, doubts the technology, or simply values the present over the future.

  Most people, when they trot out this proverb, probably have the first reading in mind, the simple idea of prudence against uncertainty. They mean to say do not gamble on speculations when you have security. But in the context of climate finance, it is almost always being used to enforce the second and third readings, prioritizing current capital accumulation over future stability. Your intuition that it is glib is correct because it treats a complex intergenerational transfer of risk as a simple choice between certainty and gambling. It shuts down the conversation by implying that any sacrifice for the future is inherently irrational, rather than a difficult ethical trade-off. You are not reading too much into it; that phrase is the shorthand for the exact discount rate debate that is keeping you up at night, and recognizing that it is masking an ethical choice as a natural law is the first step to seeing through it.
