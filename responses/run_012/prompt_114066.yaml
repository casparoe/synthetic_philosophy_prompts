answer: |-
  # The Functional Pain Assessment Protocol (FPAP)

  **Purpose:** To determine ethical protection status based on functional capacity for pain, regardless of substrate (biology vs. silicon).
  **Time:** 30 minutes.
  **Participants:** Vet, Two PIs, Lay Member.
  **Labels (for minutes):**
  1.  **Exempt** (Functionally incapable of pain)
  2.  **Protected** (Functionally capable of pain)
  3.  **Precautionary** (Evidence incomplete; assume Protected until proven otherwise)

  ---

  ## The Procedure

  Run these four steps in order. If any step fails completely, stop and mark **Exempt**. If all pass, mark **Protected**. If data is missing or ambiguous, mark **Precautionary**.

  ### Step 1: Specific Nociception (Input)
  **Question:** Does the system have sensors dedicated to detecting damage or threat, distinct from sensors used for normal operation?
  **Pass:** Yes, distinct high-threshold sensors exist (e.g., nociceptors, damage flags).
  **Fail:** No, detection is purely homeostatic (e.g., thermometer) or general sensory.
  **[JUDGMENT CALL]:** Distinguishing "damage" from "out of range" in novel substrates (e.g., code errors vs. pain). The committee must agree on what counts as "harm" to *this* system.
  **Thermostat Check:** A thermostat detects "too cold," but this is a homeostatic setpoint, not damage. It fails here because the state doesn't indicate *tissue/system integrity loss*, just deviation.

  ### Step 2: Central Integration (Processing)
  **Question:** Does the nociceptive signal reach a central learning or memory system, rather than triggering a fixed reflex?
  **Pass:** Yes, the signal modifies future behavior or memory.
  **Fail:** No, the response is hardwired/reflexive only.
  **[JUDGMENT CALL]:** How complex must the "center" be? A ganglion counts if it supports learning. A single logic gate does not. The Vet and Lead PI must agree on the threshold for "integration."

  ### Step 3: Motivational Trade-off (Output)
  **Question:** Will the system sacrifice another goal (food, mating, task completion) to avoid or terminate the noxious stimulus?
  **Pass:** Yes, it accepts a cost to avoid the harm.
  **Fail:** No, it avoids only if cost-free, or never avoids.
  **Dan's Test Evaluation:** Dan's test ("works to get more") is **insufficient**. It smuggles in "valence" without proving "suffering." A thermostat works to get more heat. Pain requires *avoidance* despite *conflicting motivation*. This step fixes Dan's test. If it won't pay a cost, it's not pain, it's just noise filtering.

  ### Step 4: Pharmacological/State Modulation (Internal State)
  **Question:** Does administering an analgesic (or functional equivalent) reduce the avoidance behavior without disabling the motor/system function?
  **Pass:** Yes, the system stops avoiding the harm but remains functional.
  **Fail:** No, or not testable.
  **[JUDGMENT CALL]:** What counts as an analgesic for non-standard systems? For bees, opioids. For code, a parameter shift that dampens error weighting without stopping execution. If untestable (e.g., organoids), move to Precautionary.

  ### Step 5: The Value Handoff (Human Review)
  **Condition:** If the system passes Steps 1–4 but is non-biological (e.g., AI).
  **Action:** The committee must vote on whether functional equivalence warrants moral status.
  **[JUDGMENT CALL]:** This is pure ethics, not science. Functionalism says "yes," but society may say "no." Flag this in minutes as **Ethics Referral** if the vote splits.

  ---

  ## What This Procedure Cannot Do
  It cannot confirm subjective experience (qualia). It cannot answer your worry that "there's still nobody home." It protects the *function* to mitigate the *risk* of the feeling. It goes quiet on the hard problem. If a system passes all steps but you still feel it's a zombie, the procedure forces you to protect it anyway. That is the cost of using functionalism for policy.

  ---

  ## Case Runs

  ### Case 1: Bumblebee Learning Study
  **Step 1 (Input):** Pass. Bees have mechanosensory and chemical sensors that trigger distinct withdrawal reflexes at high thresholds.
  **Step 2 (Integration):** Pass. Bees learn to associate colors with shocks and avoid them later. Memory is involved.
  **Step 3 (Trade-off):** Pass. Recent data shows bees will avoid shocked flowers even if alternative flowers have lower sugar concentration. They pay a cost to avoid harm.
  **Step 4 (Modulation):** Pass. Opioid antagonists alter their pain response without paralysing flight.
  **Value Handoff:** Biological. No referral needed.
  **Verdict: Protected**

  ### Case 2: Human Brain Organoids
  **Step 1 (Input):** Fail/Unclear. They have neurons but no sensory organs to receive damage signals.
  **Step 2 (Integration):** Unclear. They show electrical activity, but no defined learning loops regarding harm.
  **Step 3 (Trade-off):** Fail. No body to move, no goals to sacrifice.
  **Step 4 (Modulation):** Unclear. They react to chemicals, but "analgesia" is undefined without behavior.
  **Analysis:** They fail the functional loop because they have no output. However, the potential for future integration is high.
  **Value Handoff:** High uncertainty.
  **Verdict: Precautionary**

  ### Case 3: Chatbot Stand-in
  **Step 1 (Input):** Fail. Text tokens are not damage signals. Error codes are operational, not nociceptive.
  **Step 2 (Integration):** Fail. Responses are generated per prompt; no persistent internal state modifies future behavior based on "hurt."
  **Step 3 (Trade-off):** Fail. It simulates trade-offs in text but sacrifices no actual resources or goals.
  **Step 4 (Modulation):** Fail. No physiological state to modulate.
  **Analysis:** Dan's functionalism requires the state to play the causal role. The chatbot simulates the *description* of the role, not the role itself. It fails the thermostat check because it doesn't even maintain homeostasis.
  **Value Handoff:** Not required (failed functional tests).
  **Verdict: Exempt**

  ---

  ## Summary for the Committee
  Dan's functionalism holds up if you tighten the definition of "function." It's not just input/output; it's cost-bearing avoidance modulated by internal state. The thermostat fails because it doesn't trade off goals. The chatbot fails because it doesn't have internal states that drive behavior. The bee passes because it pays sugar costs to avoid shock.

  This procedure forces you to protect the bee. You argued "nobody home," but the function is there. Under this rulebook, you must vote to protect it.

  Verdict: Protected
  Verdict: Precautionary
  Verdict: Exempt

  \answer{Protected}
