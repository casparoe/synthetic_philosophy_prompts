answer: "Here is a taxonomy of adequacy conditions for an interpretation of probability.\
  \ These criteria are drawn from the standard literature (notably Hájek, Eagle, Mellor,\
  \ and Lewis), distilled into requirements that any candidate interpretation must\
  \ face.\n\n### I. The Desiderata List\n\nI distinguish between **Non-Negotiable**\
  \ requirements (failure here renders the interpretation defective *qua* interpretation\
  \ of probability) and **Optional** desiderata (failure here makes the interpretation\
  \ less attractive to some camps, but not logically incoherent). I also flag **Parochial**\
  \ demands, which are specific to a metaphysical framework (e.g., Humeanism) rather\
  \ than the concept of probability itself.\n\n#### A. Formal Adequacy\n1.  **Requirement:**\
  \ The interpretation must satisfy the standard axioms of the probability calculus\
  \ (Kolmogorov axioms).\n    *   **Motivation:** If an interpretation validates inferences\
  \ that the calculus forbids (or vice versa), it is not an interpretation of *probability*,\
  \ but of some other magnitude.\n    *   **Status:** **Non-Negotiable.**\n    * \
  \  **Parochial?** No.\n\n#### B. Empirical Link\n2.  **Requirement:** The interpretation\
  \ must explain the stability of relative frequencies in long run trials (The Law\
  \ of Large Numbers link).\n    *   **Motivation:** Probabilities are discovered\
  \ by counting outcomes. If $P(H) = 0.5$, we expect the frequency of heads to converge\
  \ to 0.5. An interpretation that severs this link makes probability empirically\
  \ inaccessible.\n    *   **Status:** **Non-Negotiable.**\n    *   **Parochial?**\
  \ No.\n\n#### C. Rational Action (The Principal Principle)\n3.  **Requirement:**\
  \ The interpretation must constrain rational credence. Specifically, if an agent\
  \ knows the objective probability of an event is $x$, their degree of belief should\
  \ be $x$ (absent inadmissible information).\n    *   **Motivation:** Probability\
  \ guides decision theory. If objective probabilities exist but rational agents should\
  \ ignore them when betting, the concept loses its normative utility.\n    *   **Status:**\
  \ **Non-Negotiable.**\n    *   **Parochial?** No.\n\n#### D. Single-Case Applicability\n\
  4.  **Requirement:** The interpretation must assign truth conditions to probability\
  \ claims regarding single, unrepeatable events (e.g., \"The probability *this* specific\
  \ atom decays in 5 seconds is 0.5\").\n    *   **Motivation:** Science (especially\
  \ Quantum Mechanics) and daily life (medicine, betting) assign probabilities to\
  \ individual systems, not just classes.\n    *   **Status:** **Non-Negotiable.**\
  \ (See Section III for defense).\n    *   **Parochial?** No.\n\n#### E. Ontological\
  \ Clarity\n5.  **Requirement:** The interpretation must specify what kind of property\
  \ or relation probability is (e.g., physical propensity, logical relation, degree\
  \ of belief).\n    *  \bMotivation:** To distinguish probability from mere frequency\
  \ or mere belief, and to support counterfactual reasoning (e.g., \"The probability\
  \ would have been 0.5 even if the coin were never tossed\").\n    *   **Status:**\
  \ **Non-Negotiable.** (See Section II for defense).\n    *   **Parochial?** No.\n\
  \n#### F. Objectivity (Mind-Independence)\n6.  **Requirement:** Probability values\
  \ must not depend on the evidence or mental state of any observer.\n    *   **Motivation:**\
  \ To capture the intuition that the chance of rain is a fact about the weather,\
  \ not a fact about my weather app.\n    *   **Status:** **Optional.** (Subjectivists\
  \ deny this; Objectivists demand it).\n    *   **Parochial?** Yes (Realist demand).\n\
  \n#### G. Reductionism\n7.  **Requirement:** Probability facts must be reducible\
  \ to non-probabilistic facts (e.g., categorical properties, frequencies, or patterns\
  \ in the Humean mosaic).\n    *   **Motivation:** To avoid \"spooky\" modal properties\
  \ and maintain a parsimonious ontology.\n    *   **Status:** **Optional.** (Propensity\
  \ theorists deny this).\n    *   **Parochial?** Yes (Humean demand).\n\n---\n\n\
  ### II. Issue 1: Empirical Adequacy vs. Ontological Clarity\n\n**The Question:**\
  \ Can an interpretation be adequate if it merely ensures that probability claims\
  \ track frequencies and guide betting correctly, without stating what probability\
  \ *is*? (i.e., Is instrumentalism enough?)\n\n**The Verdict:** **Ontological Clarity\
  \ is Non-Negotiable.**\n\n**Reasoning:**\nEmpirical adequacy (matching frequencies)\
  \ and decision-theoretic utility (guiding bets) are necessary, but they are not\
  \ sufficient for an *interpretation*. An interpretation is a metaphysical account\
  \ of truth conditions.\n1.  **Counterfactuals:** Two interpretations might agree\
  \ on all actual frequencies but disagree on counterfactuals. A Frequentist says,\
  \ \"If this coin were not tossed, it has no probability.\" A Propensity theorist\
  \ says, \"It still has a propensity.\" These yield different truth values for counterfactual\
  \ claims. An interpretation that refuses to adjudicate this is silent on the meaning\
  \ of the claim.\n2.  **Explanation:** Frequencies stabilize *because* of probabilities.\
  \ If an interpretation identifies probability *with* frequency (as strict Frequentism\
  \ does), it cannot explain *why* the frequency stabilizes; it merely reports that\
  \ it did. To explain the stability, probability must be distinct from the frequency\
  \ it explains.\n3.  **Underdetermination:** If we accept only empirical adequacy,\
  \ rival interpretations become notationally variant versions of the same theory.\
  \ But they are not. They make different claims about reality. To evaluate them,\
  \ we must demand they state what those claims are.\n\nTherefore, an interpretation\
  \ must say what probability *is*, not just what it *does*.\n\n---\n\n### III. Issue\
  \ 2: Single-Case vs. Ensemble\n\n**The Question:** Is the demand that probability\
  \ apply to single, unrepeatable events a genuine requirement, or an artifact of\
  \ decision theory that we could discard in favor of ensemble-only views?\n\n**The\
  \ Verdict:** **Single-Case Applicability is Non-Negotiable.**\n\n**Reasoning:**\n\
  1.  **Quantum Mechanics:** This is the decisive scientific consideration. Standard\
  \ QM assigns a wave function (and thus probabilities) to a single electron. It is\
  \ not merely a statement about an ensemble of electrons; it governs the behavior\
  \ of the individual system. An interpretation that requires an infinite ensemble\
  \ to ground the probability of a single decay renders the standard reading of QM\
  \ nonsensical.\n2.  **Decision Theory:** While one could argue decision theory is\
  \ pragmatic, rational agents make choices about single events (e.g., a one-off medical\
  \ surgery). If probability cannot apply to the single case, it cannot guide the\
  \ single choice.\n3.  **The Reference Class Problem:** If probability only applies\
  \ to ensembles, every single event must be mapped to a class. But every event belongs\
  \ to infinite classes with different frequencies. Without single-case truth conditions,\
  \ there is no fact of the matter about which reference class is the \"right\" one.\n\
  \nConsequently, an interpretation that restricts probability to long-run frequencies\
  \ (like Classical Frequentism) fails to capture the domain of scientific and practical\
  \ usage.\n\n---\n\n### IV. Joint Satisfiability (The Impossibility Result)\n\n**Can\
  \ these requirements be jointly satisfied?**\n**Plainly: No.**\n\nAs Alan Hájek\
  \ has rigorously demonstrated, there is a trilemma (or rather, a multifaceted tension)\
  \ among these desiderata.\n*   To satisfy **Formal Adequacy** and **Empirical Link**\
  \ perfectly, one tends toward Frequentism, which fails **Single-Case**.\n*   To\
  \ satisfy **Single-Case** and **Objectivity**, one tends toward Propensity, which\
  \ struggles with **Formal Adequacy** (propensities don't always obey axioms) and\
  \ **Empirical Link** (propensities are unmeasurable directly).\n*   To satisfy **Single-Case**\
  \ and **Formal Adequacy**, one tends toward Subjectivism, which fails **Objectivity**.\n\
  \nNo existing interpretation satisfies all **Non-Negotiable** requirements without\
  \ significant cost or modification. We must choose which requirement to relax or\
  \ reinterpret. This is not a bug of the list, but a feature of the concept: probability\
  \ sits at a friction point between metaphysics, math, and evidence.\n\n---\n\n###\
  \ V. Scoring the Standard Positions\n\nHere is how the three major camps score against\
  \ the **Non-Negotiable** requirements (Formal, Empirical, Rational, Single-Case,\
  \ Ontological).\n\n| Requirement | **Frequentism** | **Subjectivism (Bayesian)**\
  \ | **Propensity** |\n| :--- | :--- | :--- | :--- |\n| **1. Formal Adequacy** |\
  \ **Pass** (Finite/Long-run) | **Pass** (Coherence) | **Fail/Strain** (Causal dispositions\
  \ don't always sum to 1) |\n| **2. Empirical Link** | **Pass** (Definition) | **Strain**\
  \ (Must invoke Calibration/Reflection) | **Pass** (Postulated) |\n| **3. Rational\
  \ Action** | **Strain** (Must derive Principal Principle) | **Pass** (Definition)\
  \ | **Pass** (Postulated) |\n| **4. Single-Case** | **Fail** (Requires reference\
  \ class) | **Pass** (Degrees of belief) | **Pass** (Dispositional) |\n| **5. Ontological\
  \ Clarity**| **Pass** (Frequencies) | **Pass** (Mental states) | **Pass** (Causal\
  \ powers) |\n\n*Note: \"Strain\" indicates the position can accommodate the requirement\
  \ only with significant auxiliary assumptions.*\n\n---\n\n### VI. The Killer Requirement\n\
  \n**Which single requirement does the most work in eliminating contenders?**\n\n\
  **The Single-Case Applicability Requirement.**\n\n**Justification:**\n1.  **Eliminates\
  \ Classical Frequentism:** This is the historically dominant view. By insisting\
  \ that \"the probability of *this* specific atom decaying\" is a meaningful truth-apt\
  \ claim, Single-Case Applicability immediately disqualifies any interpretation that\
  \ defines probability strictly as a limit of relative frequency in a sequence. It\
  \ forces the debate away from \"actual outcomes\" toward \"potentialities\" or \"\
  beliefs.\"\n2.  **Forces the Metaphysical Hand:** It compels the interpreter to\
  \ choose between **Subjectivism** (the probability is in the agent, so it applies\
  \ to the single case) or **Propensity/Objective Chance** (the probability is in\
  \ the object, so it applies to the single case). It destroys the middle ground of\
  \ reductionist objectivism.\n3.  **Aligns with Science:** As noted in Section III,\
  \ modern physics is the primary user of probability. An interpretation that contradicts\
  \ the syntax of physics (which assigns values to single systems) is scientifically\
  \ obsolete.\n\nWhile **Formal Adequacy** eliminates incoherent views, and **Objectivity**\
  \ eliminates Subjectivism (for realists), **Single-Case Applicability** is the wedge\
  \ that breaks the classical picture and defines the modern landscape of the debate.\
  \ It is the criterion that separates 19th-century statistics from 20th-century probability\
  \ metaphysics."
