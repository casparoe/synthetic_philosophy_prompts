answer: |-
  Two political economists are standing in line to vote.

  The first turns to the second and says, "You know this is irrational, right? Even in a close race, the probability you're the pivotal voter is negligible."

  The second checks his watch. "Actually, in a tight contest, the probability scales with the inverse square root of the electorate, not the inverse N. For this district, the expected instrumental benefit still exceeds the cost of missing an hour of work."

  "Fair," says the first. "But did you check the preference profiles?"

  "What about them?"

  "It's a Condorcet cycle. A beats B, B beats C, and C beats A. There is no stable majority winner."

  The second pauses, hand hovering over the ballot box. "So even if I cast the deciding vote..."

  "...you're just selecting a node in an intransitive loop. The policy outcome has no equilibrium."

  "So the benefit of my preferred candidate winning is undefined."

  "Exactly. PB minus C is negative."

  The second pockets his ballot. "Well, that saves me an hour of work."

  "Smart," says the first. "Want to grab dinner? Italian, Thai, or Mexican?"

  The second stops at the door. "Let me guess. Italian beats Thai, Thai beats Mexican, Mexican beats Italian?"

  "Yep."

  "...I'm staying home."
