answer: |-
  DEPARTMENT OF CRIMINAL INTENT
  JUROR GUIDANCE MEMORANDUM 104
  SUBJECT: DETERMINATION OF INTENTIONAL CONDUCT

  This document outlines the statutory standard for intent under Section 12. Jurors must apply these principles objectively, relying on shared community standards of responsibility rather than abstract psychological theories. The law reflects how reasonable people attribute blame in ordinary contexts.

  1. What counts as doing something intentionally?
  An actor does something intentionally when they know their action will cause a result and that result occurs. Crucially, the attribution of intent depends on the moral nature of the result. If the result is harmful, knowledge of the outcome is sufficient to establish intent. The law prioritizes the protection of victims over the internal states of defendants. If a reasonable person sees the harm as intentional, the law accepts that assessment.

  2. Does it matter if the actor didn't care?
  No. A defendant may claim they were indifferent to the outcome or even privately wished it would not happen. This is irrelevant. If the actor proceeded despite knowing the harm would occur, the law treats this indifference as acceptance. Acceptance of harm is legally equivalent to desiring harm. To rule otherwise would allow actors to evade responsibility by claiming apathy toward consequences they knowingly initiated.

  3. Why is helping treated differently than harming?
  The law recognizes a fundamental distinction between producing benefit and producing harm. If an actor knows their action will help someone but does not care, this is not intentional help. Benefit requires purpose; harm requires only foresight. This ensures that benevolent side effects are not conflated with criminal purpose, preventing the over-criminalization of profitable conduct that incidentally aids others. This asymmetry is a feature of statutory construction.

  4. What if the outcome was expected?
  Intent is closely tied to whether the outcome aligns with standard operations. If a harmful result is the normal or expected consequence of a policy, intent is presumed. Jurors should consider whether the outcome was statistically regular within the relevant industry or context. Unexpected outcomes require different scrutiny than those consistent with typical conduct. Regularity suggests awareness. If everyone expects the harm, the actor cannot claim ignorance of the result.

  5. How are failed attempts handled?
  If an actor possesses the skill to cause the result and takes substantial steps toward doing so, the act is intentional even if the result fails to materialize. The law punishes the intentional engagement with risk, not merely the successful execution. Competence establishes intent regardless of luck. A skilled actor who misses is still acting intentionally because the capacity to succeed was present.

  6. Is intent the same as motive?
  No. Motive explains why an actor behaved as they did, such as profit or jealousy. Intent describes the mental state regarding the outcome itself. A defendant may have a neutral motive but still possess criminal intent if they knowingly caused harm. Do not confuse the reason for the act with the intentionality of the result. Profit is a motive; harming the environment is an intent.

  Jurors must apply these standards consistently to maintain public confidence in the determination of guilt. The law codifies common sense.
