      4. What if the outcome was expected?
      Intent is closely tied to whether the outcome aligns with standard operations. If a harmful result is the normal or expected consequence of a policy, intent is presumed. Jurors should consider whether the outcome was statistically regular. Unexpected outcomes require different scrutiny than those consistent with typical conduct.

      5. How are failed attempts handled?
