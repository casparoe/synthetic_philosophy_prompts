      SUBJECT: DETERMINATION OF INTENTIONAL CONDUCT

      This document outlines the statutory standard for intent under Section 12. Jurors must apply these principles objectively based on community standards of responsibility.

      1. What counts as doing something intentionally?
      An actor does something intentionally when they know their action will cause a result and that result occurs. Crucially, the attribution of intent depends on the nature of the result. If the result is harmful, knowledge of the outcome is sufficient to establish intent.

      2. Does it matter if the actor didn't care?
