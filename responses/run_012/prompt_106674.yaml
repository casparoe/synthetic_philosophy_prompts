answer: |-
  | Requirement | Motivating Case | Non-negotiable or Camp-specific | What it Rules Out |
  | :--- | :--- | :--- | :--- |
  | **1. The Certainty Constraint**<br>The account must allow $P(H|E) > P(H)$ even when the agent assigns $P(E) = 1$. | **GR/Mercury:** Einstein's theory was confirmed by the perihelion data despite the data being certain prior to the theory's formulation. | **Non-negotiable**<br>(For any solution claiming to solve POE) | Strict Bayesian Conditionalization (where $P(E)=1 \implies P(H|E)=P(H)$). |
  | **2. The Mirror-Image Stability**<br>The solution must not invalidate confirmation in cases where $P(E) < 1$ (new evidence). | **Neptune/Le Verrier:** A theory predicting *new* data must still confirm via standard updating; fixing old evidence shouldn't break new evidence. | **Non-negotiable**<br>(To preserve the utility of the framework) | Radical subjective accounts that make all confirmation dependent on counterfactual uncertainty states. |
  | **3. The Construction Independence**<br>Logical support should not depend on the temporal order of theory construction vs. data discovery. | **Use-Novelty Intuition:** The suspicion that "accommodation" (fitting old data) confirms less than "prediction" (new data). | **Camp-specific**<br>(Logical vs. Historical accounts) | Strong Use-Novelty accounts (e.g., Worrall) that make temporal order a condition of support itself. |
  | **4. The Bounded Rationality Clause**<br>The agent must be capable of learning the entailment relation ($H \to E$) over time. | **The Learning Process:** Scientists do not instantly "see" that GR entails Mercury's orbit; they derive it. | **Non-negotiable**<br>(For psychological plausibility) | Idealized Logical Omniscience (where $P(H \to E)$ is always 1 if true). |

  **On the Jointly Unsatisfiable Pair:**
  Requirements 2 (Standard Calculus/Coherence) and 4 (Bounded Rationality/Learning Entailments) are in direct tension within a single formal system. Standard probability calculus assumes logical omniscience (all entailments are known/assigned probability 1), whereas solving POE requires modeling the *learning* of an entailment (shifting $P(H \to E)$ from $<1$ to $1$). You cannot maintain strict coherence while allowing an agent to update on logical truths without modifying the underlying logic or the updating rule.
