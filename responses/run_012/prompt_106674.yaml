prompt: |-
  I'm prepping a grad seminar on confirmation and I keep getting dragged into the old-evidence mess -- the fact that a hypothesis which deductively entails something we've known forever (my go-to example is general relativity and the anomalous precession of Mercury's perihelion) really does seem, intuitively, to be strongly confirmed by it, even though a strict Bayesian can't let already-known evidence raise anything. Before we wade into the various fixes, I want a proper spec first: what does any adequate account of evidential support have to deliver if it's going to solve this?

  So give me the desiderata. For each one: the requirement itself, the case or consideration that motivates it, and whether you think it's non-negotiable or just something one camp happens to want. Three things I especially want you to take a stand on: (1) whether the account has to handle the mirror-image problem -- old evidence with a new theory versus new evidence with an old theory -- with a case for each direction; (2) whether it must distinguish a theory that was built to fit the old datum from one that predicted it in advance, and whether that's a genuine desideratum or just a use-novelty prejudice dressed up as one; and (3) whether any of your requirements can't be jointly satisfied, and if so which pair and why that's the interesting part.

  Don't bother scoring the existing proposals, I'll do that in class. Format it as a table with columns: requirement / motivating case / non-negotiable or camp-specific / what it rules out. Then two or three sentences underneath on the jointly-unsatisfiable pair, if there is one.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** The Problem of Old Evidence (POE) in confirmation theory (specifically Bayesian).
      *   **Task:** Provide a specification of desiderata for an adequate account of evidential support that solves the POE.
      *   **Format:** A table with columns: Requirement, Motivating Case, Non-negotiable or Camp-specific, What it Rules Out. Followed by 2-3 sentences on jointly unsatisfiable pairs (if any).
      *   **Specific Stances Required:**
          1.  Mirror-image problem (Old Evidence/New Theory vs. New Evidence/Old Theory).
          2.  Use-novelty (accommodation vs. prediction).
          3.  Joint satisfiability of requirements (impossibility results).
      *   **Constraint:** Do not score existing proposals (Glymour, Garber, Jeffrey, etc.).
      *   **Tone:** Academic, precise, suitable for a grad seminar prep.

  2.  **Deconstruct the Problem of Old Evidence (POE):**
      *   *The Core Issue:* In standard Bayesian conditionalization, $P(H|E) = P(H \& E) / P(E)$. If $E$ is known, $P(E) = 1$. Thus $P(H|E) = P(H)$. No confirmation occurs.
      *   *The Intuition:* Einstein's GR explaining Mercury's perihelion *did* confirm GR, even though the perihelion data was old.
      *   *The Goal:* Define what a solution *must* do before evaluating *how* it does it.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Desideratum 1: The Basic Intuition.* The account must allow $P(H|E) > P(H)$ even when $E$ is already certain ($P(E)=1$).
          *   *Motivation:* GR/Mercury.
          *   *Status:* Non-negotiable for solving POE.
          *   *Rules out:* Strict Conditionalization.

      *   *Desideratum 2: The Mirror-Image (User Request #1).* Does the account need to handle New Evidence/Old Theory too?
          *   *Analysis:* Standard Bayesianism handles New Evidence fine ($P(E) < 1$). The POE is specific to $P(E)=1$. However, a *general* theory of support should be symmetric in principle, or at least explain the asymmetry.
          *   *Stance:* It's non-negotiable that the account explains *why* the logic differs, or handles both under one umbrella. If it breaks New Evidence to fix Old Evidence, it's a bad trade.
          *   *Decision:* I will argue it must handle both without breaking the New Evidence case.

      *   *Desideratum 3: Use-Novelty (User Request #2).* Accommodation vs. Prediction.
          *   *Analysis:* Does a theory built *to fit* data confirm less than one that predicts it?
          *   *Stance:* This is controversial. Some (Worrall) say yes (use-novelty). Others (Bayesians mostly) say no (logical relation is what matters).
          *   *Decision:* I will classify this as "Camp-specific" but argue that a *robust* account should explain the *appearance* of novelty even if it denies the metaphysical weight. Actually, the prompt asks me to take a stand. I'll argue it's a genuine desideratum for a *psychological/sociological* account of science, but maybe not for *logical* support. Let's refine: An adequate account of *support* (logical) shouldn't depend on the history of construction, but an account of *confirmation* (epistemic warrant) might. I'll take the stand that distinguishing them is *not* non-negotiable for the logic, but ignoring the intuition is risky. Let's go stronger: It is *not* non-negotiable for logical support, but ignoring it makes the account descriptively inadequate. I will label it "Camp-specific (Use-Novelty vs. Logical Entailment)" but note the tension.

      *   *Desideratum 4: Logical Omniscience.*
          *   *Motivation:* The POE arises because agents are treated as logically omniscient (knowing all entailments).
          *   *Status:* Non-negotiable to relax this.
          *   *Rules out:* Standard Idealized Bayesianism.

      *   *Desideratum 5: Counterfactual Sensitivity.*
          *   *Motivation:* We often reason "If we didn't know E, H would predict it."
          *   *Status:* Camp-specific (Counterfactual vs. Epistemic accounts).

  4.  **Addressing the "Jointly Unsatisfiable" Constraint (User Request #3):**
      *   *The Conflict:* There is a known tension between preserving the synchronic logical relation (H entails E) and the diachronic updating rule (Conditionalization).
      *   *Specific Impossibility:* Eells (1985) and others have pointed out tensions. But a sharper one is between **Historical Independence** (support depends only on H and E, not context) and **Psychological Realism** (agents don't know entailments immediately).
      *   *Better Conflict:* **Strict Conditionalization** vs. **Old Evidence Confirmation**. You can't have both. That's the definition of the problem.
      *   *Deeper Conflict:* **Synchronic Logical Support** vs. **Diachronic Probability Kinematics**. If you fix POE by changing $P(E)$ (counterfactuals), you break the link to actual belief states. If you fix it by changing the updating rule, you break Bayesian coherence.
      *   *Selection:* I will focus on the tension between *Logical Omniscience* (required for clean entailment) and *Bounded Rationality* (required to make learning entailments possible). You can't have an agent who is logically omniscient (so $P(H \to E)=1$ always) and also capable of learning $H \to E$ (which requires $P(H \to E) < 1$ previously).

  5.  **Refining the Table Content:**

      *   *Req 1:* Allow $P(E)=1$ and $\Delta P(H) > 0$. (The Core POE fix).
      *   *Req 2:* Preserve Standard Confirmation for $P(E)<1$. (The Mirror Image).
      *   *Req 3:* Distinguish Accommodation vs. Prediction? (Use Novelty). I'll take the stand that this is *not* non-negotiable for logical support, but ignoring it is a cost.
      *   *Req 4:* Relax Logical Omniscience. (The Mechanism).

  6.  **Developing the Stances (as requested):**

      *   *(1) Mirror-Image:* It is non-negotiable that the account doesn't break the "New Evidence" case. If you fix Mercury by breaking the logic for Neptune (discovery), you've failed. The account must unify them or explain the asymmetry.
      *   *(2) Use-Novelty:* I will argue this is *Camp-specific*. A logical account of support shouldn't care about the order of discovery (Mill/Keynes), but a naturalized epistemology might. I'll take the stand that it's *not* a requirement for the *logic* of confirmation, but a requirement for a *sociology* of acceptance. For this seminar, stick to confirmation logic: it's not non-negotiable.
      *   *(3) Joint Unsatisfiability:* The pair is **Logical Omniscience** and **Learning of Entailments**. You cannot model an agent who knows all logical truths (standard Bayesian) and also model them learning that $H$ entails $E$ (the solution to POE). One must go.

  7.  **Final Review against Constraints:**
      *   Table format? Yes.
      *   Columns correct? Yes.
      *   2-3 sentences on unsatisfiable pair? Yes.
      *   Addressed the 3 specific stands? Yes.
      *   No scoring of existing proposals? Yes.
      *   Tone appropriate? Yes.

  8.  **Drafting the Content (Self-Correction during drafting):**
      *   *Correction on Req 2:* Make sure "Mirror-Image" is clearly defined. It's not just "New Evidence," it's ensuring the solution to Old Evidence doesn't invalidate standard cases.
      *   *Correction on Req 3:* Be precise about Use-Novelty. Is it a desideratum? Many Bayesians say no. I should frame it as "Explain the intuition" rather than "Enforce the distinction."
      *   *Correction on Unsatisfiable:* The tension between *Synchronic Logical Relations* and *Diachronic Belief Change* is the heart of it. I'll phrase it as "Static Logical Omniscience" vs. "Dynamic Learning of Implication."

  9.  **Final Polish:** Check the "Non-negotiable vs Camp-specific" column. Ensure the distinction is sharp. Ensure the "What it Rules Out" column is specific (e.g., "Strict Conditionalization").

      *(Self-Correction on the "Stand" regarding Use-Novelty)*: The prompt asks me to take a stand on whether it's a genuine desideratum or prejudice. I should argue it's largely prejudice *for the logic of support*, but a genuine phenomenon for *theory choice*. I will classify it as Camp-Specific but note the nuance in the table.

      *(Self-Correction on Unsatisfiable)*: The prompt asks "whether any of your requirements can't be jointly satisfied." I need to identify a pair *within the desiderata* or inherent in the problem space. The classic tension is between **Preserving Standard Probability Calculus** and **Allowing P(E)=1 to Confirm**. But that's the problem itself. A deeper one is **Psychological Realism** (agents learn things) vs **Logical Omniscience** (agents know entailments). I will list these as requirements for a *complete* theory and show they clash.

      Let's refine the "Unsatisfiable" section. The prompt asks if *my requirements* can't be jointly satisfied.
      Requirement A: The account must respect the standard probability calculus (coherence).
      Requirement B: The account must allow learning of logical entailments (to solve POE).
      Conflict: Standard calculus assumes logical omniscience. Learning entailments requires logical fallibility.
      Okay, that works.

