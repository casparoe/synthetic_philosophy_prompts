      *   *Section 4: The Nihilist Worries (Self-Undermining & Science).*
          *   *Self-Undermining:* Explain Paraphrase/Nihilist speak ("simples arranged chair-wise"). It costs them ordinary discourse but saves consistency.
          *   *Science:* Physics describes the *base*, not the *ontological status* of composites. "Nothing but" is metaphysics. Also, modern physics (fields/QM) complicates the "particle" picture.

      *   *Section 5: The Mind-Independent Realist's Response (as requested).*
          *   How do they handle the "no non-arbitrary answer" worry?
