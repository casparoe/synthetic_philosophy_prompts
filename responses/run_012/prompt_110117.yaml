answer: |-
  You are not describing deterrence badly. You are describing three distinct mechanisms that look identical from the outside but rely on different underlying physics. You're mashing them together because they share the same "API" (a threat that shouldn't work but does), but their "implementations" differ.

  Here is the breakdown of what you are seeing, the actual names for the pieces, and why the "acausal/surrogate" jargon is floating around.

  ### 1. The Three Patterns

  You have three examples. In game theory and strategy, these are not the same thing.

  **Example 1: The AI Lab (Mutually Assured Destruction)**
  *   **The Mechanism:** This is **Deterrence via Verification Cost**.
  *   **Why it works:** It is not that the threat is credible. It is that the *cost of testing the credibility* is higher than the cost of compliance. In classical Game Theory, a non-credible threat is eliminated by "backward induction" (I know you won't do it, so I ignore it). But backward induction assumes perfect information and zero transaction costs. In the real world, testing the threat involves a non-zero probability of catastrophe.
  *   **The Name:** This is standard **Deterrence Theory** (specifically, stability via uncertainty). It is not "acausal." It works because the risk-adjusted expected value of calling the bluff is negative.

  **Example 2: The Startup Rule (No Custom Work)**
  *   **The Mechanism:** This is a **Schelling Point** (or Focal Point).
  *   **Why it works:** This isn't really a threat; it's a coordination mechanism. Negotiating every enterprise contract is expensive (high latency). By hardcoding a rule ("we never do custom work"), you remove a degree of freedom from the negotiation. Even if sales would *like* to do custom work, the rule saves them the compute cycles of deciding each time.
  *   **The Name:** **Schelling Point**. Both sides converge on this rule because it's the most obvious "default" state, not because of fear.

  **Example 3: The Decoy Goal**
  *   **The Mechanism:** This is **Surrogate Goals**.
  *   **Why it works:** This relies on **Information Asymmetry**. You know you don't care about the decoy. The attacker *does not know that you know* you don't care, or cannot distinguish the decoy from a real goal without expending resources to attack it.
  *   **The Name:** This specific term comes from AI safety research (pioneered by Paul Christiano). It is explicitly called a **Surrogate Goal**.

  ### 2. The Jargon You Heard ("Acausal" and "Surrogate")

  You asked if these are blog jargon or real things. They are real, but they apply to specific contexts.

  **"Surrogate"**
  This refers directly to your third example. In AI safety, a "Surrogate Goal" is when you align an AI to protect something arbitrary (e.g., "maximize the number of paperclips in this specific box") to divert attacks away from its actual terminal goals (e.g., "keep humans safe").
  *   **Why the friend is right:** It works not because the attacker believes you care, but because the attacker cannot *verify* you don't care without attacking. If they attack the decoy and you resist, they waste resources. If you fold, they learn your values. The "cost" is the information leak.

  **"Acausal"**
  This refers to **Acausal Decision Theory** (specifically Timeless Decision Theory or Updateless Decision Theory). This is likely where the confusion lies.
  *   **The Theory:** If two agents are sufficiently similar (e.g., both run similar code, or can simulate each other perfectly), they can cooperate on non-credible threats without communication. Agent A thinks: "If I defect, my simulation of Agent B defects. Therefore, I cooperate."
  *   **Does it apply to you?** Probably not. This only works if the parties are effectively running the same "source code" (e.g., two AIs from the same lab, or humans with identical ideologies). If you are a backend engineer and the other party is a normal human or a different company, **acausal trade does not apply**. You are in the realm of standard Game Theory with incomplete information.

  ### 3. Answering Your Specific Questions

  **Is it just a non-credible threat (the textbook thing that's supposed to fail)?**
  Technically, yes. In a one-shot game with perfect information, it fails. But in a multi-shot game with **risk aversion** and **verification costs**, it succeeds. It succeeds not because it is credible, but because the *error margin* for calling the bluff is too tight.

  **Is it a commitment device even though nobody pays anything to commit?**
  No. A commitment device (like burning your bridges) requires paying a cost *ex-ante* to make the threat credible. What you are describing is a **Soft Commitment**. It relies on the *potential* cost, not the *sunk* cost. It is weaker than a real commitment device and will fail if the verification cost drops.

  **Is it the same move as acting unpredictable / Madman Theory?**
  No. Madman Theory (Nixon) relies on the opponent believing you are **irrational**. Your examples rely on the opponent believing you are **rational but risk-averse**. In your AI example, both sides are perfectly rational; they just agree that the variance on the "call the bluff" option is too high.

  **Does it only work if both sides reason the same way (same decision theory/code)?**
  *   For the **Acausal** version: Yes.
  *   For the **Deterrence/Decoy** version: No. It works as long as both sides are risk-averse and have incomplete information about the other's payoff matrix.

  **Is the decoy-goal thing the same phenomenon?**
  No. The AI Lab example is about **Risk** (I might destroy us both). The Decoy example is about **Information** (I don't know what you actually value). They are different attack vectors.

  ### 4. Coining a Term & Defining the Edges

  Since you are looking for a unified mental model for the "Backend Engineer" version of this, I propose we call this **High-Cost Bluff Equilibrium**.

  **Definition:** A strategic state where a non-credible threat maintains equilibrium because the cost of verifying the bluff (testing the threat) exceeds the cost of complying with it, despite common knowledge that the threat is likely empty.

  **The Edges (What is nearest but isn't it):**
  *   **Not a Commitment Device:** A commitment device burns the bridge (e.g., "I have publicly promised, so I lose reputation if I don't"). High-Cost Bluff Equilibrium leaves the bridge intact; nobody dares walk on it.
  *   **Not Madman Theory:** Madman Theory requires feigning insanity. High-Cost Bluff Equilibrium requires feigning *capability* or *resolve* while remaining rational.
  *   **Not Acausal Trade:** Acausal Trade requires logical correlation between agents. High-Cost Bluff Equilibrium works between strangers.

  **Failure Conditions (When does it stop working?):**
  1.  **Verification Cost Drops:** If someone finds a way to test the threat cheaply (e.g., a small-scale skirmish instead of full war), the bluff gets called.
  2.  **Common Knowledge of Indifference:** In the Decoy example, if it becomes *common knowledge* that you do not care about the decoy, the decoy stops absorbing attacks. It relies on the attacker thinking there is a >0% chance you care.
  3.  **Symmetry of Pain:** In the AI Lab example, if the threat hurts *only* the victim and not the threatener, it becomes a standard credible threat (or a pure bluff that fails). It only works as a High-Cost Bluff if the threatener also suffers (Mutually Assured Destruction).
  4.  **Iterated Exposure:** If the game is played frequently, statistical noise eventually reveals the bluff. This equilibrium is stable in low-frequency, high-stakes games (nuclear war, core model weights), but unstable in high-frequency, low-stakes games (daily API calls).

  ### Summary for your mental model

  *   **AI Lab Example:** Deterrence (Risk-based).
  *   **Startup Rule:** Schelling Point (Coordination-based).
  *   **Decoy Goal:** Surrogate Goal (Information-based).
  *   **"Acausal":** Ignore this unless you are simulating the other agent's source code.
  *   **Unified Concept:** **High-Cost Bluff Equilibrium**.

  It works because **testing is expensive**, not because **lying is hard**.
