  # The Correlated Agent Decision Tree

  **Starting Commitment:** *You accept that the choices of agents elsewhere in a large world are correlated with yours, and that this correlation is sufficient to make your choice evidence about theirs.*

  ---

  ### Node 1: The Source of Correlation
  **Question:** Does the correlation between your choice and theirs arise primarily because you both execute the **same abstract decision algorithm**, or merely because you share **similar causal histories and evidence**?
  *   **Same Algorithm** → Go to Node 2.
  *   **Similar Histories** → Go to Node 6.

  ---

  ### Node 2: The Unit of Agency (Algorithm Branch)
  **Question:** When you deliberate, do you view yourself as choosing an action for **this specific instance** of deliberation, or as determining the output of your algorithm for **every instance** where it runs?
  *   **This Specific Instance** → Go to Node 3.
  *   **Every Instance** → Go to Node 4.

  ---

  ### Node 3: The Basis of Coordination (Act Branch)
  **Question:** If you are merely one instance, do you cooperate because you expect them to **reason identically** to you, or because you expect them to **reciprocate** your specific choice?
  *   **Reason Identically** → **Leaf 1: Superrationality**
  *   **Reciprocate Choice** → **Leaf 2: Unnamed (Naive Cooperation)**

  ---

  ### Node 4: Value Alignment (Policy Branch)
  **Question:** Do the other instances of your algorithm share your **terminal values**, or do they use the same logic to pursue **different ends**?
  *   **Share Values** → Go to Node 5.
  *   **Different Ends** → Go to Node 7.

  ---

  ### Node 5: Epistemic Scope (Shared Values Branch)
  **Question:** Does your decision policy ignore specific information about **your location or identity** (e.g., "I am copy #1"), or does it condition on **all available evidence**?
  *   **Ignore Location** → **Leaf 3: Updateless Decision Theory (UDT)**
  *   **Condition on Evidence** → **Leaf 4: Functional Decision Theory (FDT)**

  ---

  ### Node 6: Normative Force (Evidence Branch)
  **Question:** Do the correlated agents share your **terminal values**, or do they merely share your **predicament** while valuing different outcomes?
  *   **Share Values** → Go to Node 8.
  *   **Different Ends** → Go to Node 9.

  ---

  ### Node 7: Dependence Requirement (Divergent Values Branch)
  **Question:** Do you require that their cooperation **counterfactually depends** on your policy, or is it enough that they **independently run** the same trade-seeking logic?
  *   **Depends on Policy** → **Leaf 5: Acausal Trade**
  *   **Independent Logic** → **Leaf 6: Unnamed (Logical Parallelism)**

  ---

  ### Node 8: Evidential Norms (Shared Values Branch)
  **Question:** Given the correlation, do you choose the act that makes the news about their choices **look best**, or the act that produces the best outcome assuming their choices are **fixed background**?
  *   **Make News Best** → **Leaf 7: Evidential Decision Theory (EDT)**
  *   **Assuming Fixed** → **Leaf 8: Causal Altruism**

  ---

  ### Node 9: Evidential Norms (Divergent Values Branch)
  **Question:** Given the correlation, do you choose the act that makes the news about their choices **look best**, or the act that produces the best outcome assuming their choices are **fixed background**?
  *   **Make News Best** → **Leaf 9: Unnamed (Evidential Trade)**
  *   **Assuming Fixed** → **Leaf 10: Causal Decision Theory (Strangers)**

  ---

  ### Node 5 (Alternative Split): Reciprocity vs. Reasoning
  *(Note: To capture the requested distinction on reciprocity within the Policy/Shared branch, Node 5 can be viewed as having a hidden split. If the reader answers "Condition on Evidence," ask:)*
  **Question:** Do you cooperate only because they run the **same reasoning**, or do you require a **reciprocal commitment** embedded in the policy?
  *   **Same Reasoning** → **Leaf 4: Functional Decision Theory (FDT)**
  *   **Reciprocal Commitment** → **Leaf 11: Unnamed (Contractualist FDT)**

  ---

  ### Node 3 (Alternative Split): Values on Acts
  *(Note: To capture the "Act + Divergent" possibility)*
  **Question:** If you are merely one instance with divergent values, do you attempt to **signal** for trade, or **defect** as a stranger?
  *   **Signal for Trade** → **Leaf 12: Unnamed (Act-Based Signaling)**
  *   **Defect as Stranger** → **Leaf 2: Unnamed (Naive Cooperation)** *(Merged for tree balance)*

  ---

  ## The Leaves

  1.  **Superrationality**
      *   *Commitment:* Assumes identical agents in identical situations will necessarily converge, uncomfortable with the idea that slight situational differences break the link.
  2.  **Unnamed (Naive Cooperation)**
      *   *Commitment:* Expects reciprocity from single acts without policy binding, uncomfortable with the instability of one-shot promises.
  3.  **Updateless Decision Theory (UDT)**
      *   *Commitment:* Chooses policies before receiving specific evidence, uncomfortable with the intuition that learning new facts should always change your plan.
  4.  **Functional Decision Theory (FDT)**
      *   *Commitment:* Treats your decision as the output of a function across all instantiations, uncomfortable with the metaphysical weight of "logical causation."
      *   *(Flag: Often conflated with Timeless Decision Theory; the tree separates them only by the "Ignore Location" node.)*
  5.  **Acausal Trade**
      *   *Commitment:* Cooperates with agents who can simulate you but cannot causally interact, uncomfortable with the risk of exploitation by non-reciprocating simulators.
  6.  **Unnamed (Logical Parallelism)**
      *   *Commitment:* Cooperates because others run similar logic independently, uncomfortable with the lack of counterfactual leverage (why cooperate if they've already decided?).
  7.  **Evidential Decision Theory (EDT)**
      *   *Commitment:* Maximizes conditional expected utility, uncomfortable with "managing the news" (e.g., smoking lesion problems).
  8.  **Causal Altruism**
      *   *Commitment:* Accepts correlation but treats it as non-actionable, uncomfortable with ignoring evidence that suggests your act helps others.
  9.  **Unnamed (Evidential Trade)**
      *   *Commitment:* Uses evidence to trade across divergence, uncomfortable with the lack of a mechanism to enforce the trade.
  10. **Causal Decision Theory (Strangers)**
      *   *Commitment:* Treats correlated copies as causally independent strangers, uncomfortable with leaving guaranteed utility on the table in Newcomb-like problems.
  11. **Unnamed (Contractualist FDT)**
      *   *Commitment:* Requires explicit reciprocal policy commitments, uncomfortable with the difficulty of verifying such commitments across acausal boundaries.
  12. **Unnamed (Act-Based Signaling)**
      *   *Commitment:* Attempts to signal intent via single acts, uncomfortable with the cheapness of signaling without policy enforcement.

  ---

  ## Unoccupied and Indistinguishable Combinations

  *   **Indistinguishable Leaves:** **FDT** and **Timeless Decision Theory (TDT)** are not separated by this tree; both occupy Leaf 4. The distinction usually rests on technical handling of logical counterfactuals rather than high-level commitments.
  *   **Unoccupied: Evidence + Policy + Shared Values.** This combination (Rule-Utilitarianism with Evidential Correlation) is rarely defended in this space. It is likely **unattractive** because if one accepts the "Policy" view, one usually accepts the "Algorithm" source of correlation that justifies it.
  *   **Unoccupied: Algorithm + Act + Divergent Values + Dependence.** This combination (expecting counterfactual dependence on a single act without policy binding) is **incoherent**; counterfactual dependence on a token act requires a type-level policy to ground the logic.
  *   **Unoccupied: Algorithm + Act + Divergent Values + Independence.** This is Leaf 12 (Signaling) but often collapses into Defection (Leaf 10). It is **unexplored** because without policy binding, act-based trade is evolutionarily unstable.
