          *   *Growth-Optimal Bettor (GOB):* Believes maximizing expected log wealth is *the* rational criterion for multiplicative risks, grounded in ergodicity/typicality, not just "taste."
          *   *Expected-Utility Theorist (EUT):* Believes GOB is just EUT with log utility. Ergodicity arguments conflate time/ensemble averages. Rationality allows diverse risk attitudes.
