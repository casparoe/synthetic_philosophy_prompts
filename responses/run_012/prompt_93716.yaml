answer: |-
  You have identified a structural manoeuvre that is frequently observed but rarely named with the precision you demand. While the tension between justice and force is a cornerstone of political philosophy—echoed in Walter Benjamin's *Critique of Violence*, Derrida's *Force of Law*, and the Realist school of jurisprudence—the specific *rhetorical choreography* you describe lacks a canonical label. Existing terms approximate the shape but miss the movement.

  The **Motte-and-Bailey doctrine** is the closest contemporary analogue. However, that fallacy involves retreating from a controversial claim (the Bailey) to a defensible one (the Motte) when challenged, then returning to the Bailey once safety is secured. In your pattern, the institution does not return to the first prop once the second has been deployed; rather, the two props function as mutually exclusive foundations that are never laid simultaneously. The institution does not seek to prove the justice prop *using* the force prop, but rather substitutes one ground of validity for another when the first collapses.

  Similarly, this is distinct from **Hart's internal and external points of view**. Hart describes sociological perspectives (acceptance vs. observation), whereas you are describing a defensive argumentation strategy used by the institution itself. It is also distinct from mere **ideological masking**, where force is permanently disguised as justice. In your observation, the mask is dropped when questioned; the force is admitted openly once the justice claim is destabilised.

  To carve this concept out precisely, we must define its boundaries against circularity and simple contradiction.

  **The Carving: What It Is**
  This structure requires four conditions:
  1.  **Dual Grounds:** The institution relies on two distinct sources of validity: one normative (justice, merit, fairness) and one empirical (authority, enactment, force).
  2.  **Mutual Exclusivity:** The two grounds are never invoked simultaneously in the same argumentative space. To cite force undermines the claim to justice; to cite justice undermines the claim to brute authority.
  3.  **Sequential Dependency:** The second ground is only invoked when the first is successfully challenged. The force prop remains holstered until the justice prop is broken.
  4.  **Functional Equivalence:** Both grounds are claimed to secure the same obligation (obedience), despite resting on incompatible logics.

  **The Boundaries: What It Is Not**
  *   **Not Circular Reasoning:** Circular reasoning argues $A$ because $B$, and $B$ because $A$. This structure argues $X$ because $A$; if $A$ fails, $X$ because $B$. It is a disjunction, not a loop.
  *   **Not Tyranny:** If only the force prop is ever used, it is naked power. The structure requires the *availability* of the justice prop to maintain legitimacy.
  *   **Not Naive Idealism:** If only the justice prop is ever used, it is impotence. The structure requires the *availability* of the force prop to maintain order.
  *   **Not Theoretical Pluralism:** A genuine pluralist acknowledges both grounds coexist. This manoeuvre hides the contradiction by separating them temporally.

  Where only one prop is ever in play, you have either authoritarianism (force only) or utopianism (justice only). Where both are argued simultaneously, you have a coherent theory of law (such as Finnis's natural law theory) that attempts to reconcile them. The specific phenomenon you identify is the *refusal* to reconcile them, managed by alternating between them to prevent scrutiny of the gap.

  Since no established term captures this specific oscillation, I propose **Disjunctive Legitimation**. It denotes a system of validity sustained not by the coherence of its parts, but by the sequential availability of incompatible justifications.

  Verdict: Disjunctive Legitimation: the sequential use of merit and force to cover mutual justificatory gaps.
