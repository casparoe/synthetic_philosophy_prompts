answer: |-
  Here is a reconstruction of the implicit constitutional theory presupposed by the Swiss institutional package, distinguishing between what the institutions strictly require, what they accommodate, and where the theoretical ground is underdetermined.

  ### 1. The Core Theory: Continuous Constituent Power
  The central presupposition of this system is a specific version of **popular sovereignty** where the "People" retain the *pouvoir constituant* (constituent power) permanently, rather than exhausting it once they ratify a constitution.

  *   **Strictly Presupposed:** The system requires a theory where the Constitution is not a "higher law" that binds the sovereign people from above, but a "framework law" that the sovereign people can alter at will through a specific procedure. The People are superior to the Constitution. This explains why the Federal Supreme Court cannot strike down federal statutes for unconstitutionality: if the Parliament (representing the People) passes a law, and the People could have amended the Constitution to allow that law via initiative, the Court lacks the democratic legitimacy to override the political expression of the sovereign.
  *   **Fits Nicely:** This view aligns with a positivist separation of powers where the Judiciary is a "constituted" power subordinate to the "constituent" power. It treats constitutional disputes as political questions to be resolved by voting, not legal questions to be resolved by adjudication.
  *   **Underdetermined:** This does not strictly require believing the People are the *only* legitimate source of law (as your prompt notes regarding *jus cogens*). It only requires that within the *domestic* legal order, no internal organ (like a court) can override the People. The source of the limit can be external (international law) without contradicting the internal hierarchy.

  ### 2. The Demos: Compound Sovereignty
  The double majority (People + Cantons) presupposes a **compound theory of the demos**.

  *   **Strictly Presupposed:** The system rejects the idea of a unitary "Swiss People" as the sole holder of sovereignty. Instead, sovereignty is held jointly by the national electorate and the cantonal states. This is not merely a pragmatic check on majority tyranny; it is an ontological claim about the political community. The "People" who speak in a referendum are not 8 million individuals, but a federation of citizens and cantons.
  *   **Consistency with Democracy:** This is consistent with a "democratic majority" only if democracy is defined as **federal democracy**. If democracy is defined strictly as "political equality of all individual citizens" (one person, one vote), the cantonal majority is a deviation. However, if democracy is defined as "agreement between the national majority and the constituent states," it is internally consistent. The system presupposes the latter.
  *   **Underdetermined:** The theory does not dictate *why* the cantons have this status.
      *   *Theory A (Historical/Pre-political):* Cantons are pre-existing sovereign entities that created the Federation; they retain residual sovereignty.
      *   *Theory B (Functional/Administrative):* Cantons are merely administrative units granted veto power to protect regional interests and ensure implementation.
      *    Both theories license the exact same voting mechanism. The institutions do not tell us whether the cantonal vote is a right of statehood or a functional safeguard.

  ### 3. The *Jus Cogens* Floor: External Constraint vs. Internal Morality
  The prohibition on initiatives violating peremptory international law (*jus cogens*) is the most theoretically complex feature. It acts as a boundary on the constituent power.

  *   **Strictly Presupposed:** The system presupposes that popular sovereignty is **self-limiting** regarding external commitments. It does not necessarily presuppose Natural Law. It can be explained entirely through a **positivist internationalist** theory: The Swiss People are sovereign, but they have voluntarily bound themselves to the international legal order. To remain a member of that order, they accept that certain acts (genocide, torture) are off-limits. The limit is not "above" the people in a moral sense, but "outside" the people in a jurisdictional sense.
  *   **Is it Smuggled Natural Law?** Not necessarily. If the limit were based on inherent human rights discoverable by reason (Natural Law), one would expect a domestic Constitutional Court to enforce it against *any* violation. Instead, the limit is narrowly tailored to *mandatory international law*. This suggests the theory is one of **international legal compliance**, not domestic moral supremacy.
  *   **Consistency:** This is consistent with the rest of the system because the enforcement mechanism is **political**, not judicial. The Federal Assembly (Parliament), not the Court, generally declares an initiative invalid for violating these norms before the vote. This preserves the principle that the Judiciary does not overrule the People. The "check" comes from the representative body, maintaining the chain of democratic legitimacy.

  ### 4. Underdetermination: Where Multiple Theories Fit
  There are significant gaps where the institutions remain silent on the underlying philosophy, allowing rival theories to coexist:

  1.  **The Nature of Rights:** The system does not determine whether fundamental rights are "pre-political truths" or "political commitments."
      *   *View A:* Rights are moral trumps (but the People can vote to suspend them domestically if they don't violate *jus cogens*).
      *   *View B:* Rights are merely stable expectations granted by the People, revocable by the People.
      *   *Institutional Fit:* Both fit. The lack of judicial review supports View B, but the *jus cogens* limit supports View A. The system tolerates the tension.
  2.  **The Role of the Cantons:** As noted above, the system works whether you view Cantons as mini-states or as administrative regions. The "Ständemehr" (cantonal majority) functions identically under both theories.
  3.  **The Source of the *Jus Cogens* Limit:** It is contested whether this limit is derived from the Constitution itself (implied limits), from international law directly, or from an unwritten "constitutional identity." The institutions function regardless of which legal dogma is chosen.

  ### 5. The Rival Theory Test: Constitutional Supremacy
  If you replaced the presupposed view (Continuous Constituent Power) with its main rival (Constitutional Supremacy / Court as Guardian), the pieces would not just be reinterpreted; **the system would break.**

  *   **The Rival View:** The Constitution is a higher law that binds the People. The Judiciary is the guardian of this higher law.
  *   **What Would Have to Change:**
      1.  **Judicial Review:** You could not maintain the ban on reviewing federal statutes. If the Constitution binds everyone, the Court must be able to strike down parliamentary acts that violate it.
      2.  **Initiatives:** You could not allow unreviewed initiatives to amend the Constitution. A Constitutional Court would need to vet initiatives for substantive compatibility with "eternal clauses" or fundamental rights *before* the vote (as in Germany).
      3.  **Double Majority:** This might survive, but its justification would shift. Under Constitutional Supremacy, the cantonal vote might be viewed with suspicion as violating the equality principle unless explicitly protected as a "federal feature" by the Court.
      4.  **Jus Cogens:** This limit would become redundant or secondary. If the Court can strike down laws violating human rights domestically, the specific reliance on *international* law as the floor becomes less critical.
  *   **Conclusion:** You cannot simply reinterpret the Swiss institutions through the lens of Constitutional Supremacy. The lack of judicial review is not an accident; it is the necessary corollary of the People being the final arbiter of the Constitution. If you give the Court the power to say "No" to the People, you have fundamentally altered the locus of sovereignty.

  ### 6. Settled vs. Contested
  To ensure clarity on what is fact and what is theory:

  **Settled (Institutional Facts):**
  *   The Federal Supreme Court does not review the constitutionality of federal statutes passed by Parliament or approved by referendum.
  *   A popular initiative requires a double majority (voters and cantons) to amend the Constitution.
  *   Initiatives violating mandatory international law (*jus cogens*) can be declared invalid by the Federal Assembly before the vote.
  *   The text of the Constitution states sovereignty resides in the "People and the Cantons."

  **Contested (Theoretical Interpretations):**
  *   **The Legal Basis of the *Jus Cogens* Limit:** Scholars debate whether this limit is written in the Constitution, derived from international law directly, or an unwritten constitutional principle. The institutions work, but the *legal source* is disputed.
  *   **The Democratic Legitimacy of the Cantonal Vote:** It is contested whether the weighting of small cantons is a necessary feature of federalism or an anachronistic violation of political equality. (The institution exists, its *normative value* is debated).
  *   **The Scope of "Mandatory International Law":** There is no final judicial arbiter to define exactly what counts as *jus cogens* in this context. The Parliament decides, which leads to political contestation about whether the limit is being applied too broadly or too narrowly.
  *   **The "Essence" of Rights:** While *jus cogens* is a hard floor, there is debate over whether there are other "core rights" that the People cannot touch even if they don't technically violate international law. The system leaves this boundary fuzzy.

  ### Summary of the Implicit Theory
  The Swiss arrangement presupposes a **Self-Limiting Federal Popular Sovereignty**.
  1.  **Sovereignty:** Resides in the People, but is exercised through a compound structure (People + Cantons).
  2.  **Constitution:** Is a tool of the People, not a master over them.
  3.  **Judiciary:** Is a constituted organ, subordinate to the constituent power (hence no review of federal acts).
  4.  **Limits:** Are accepted voluntarily via international integration (*jus cogens*), enforced politically, not via domestic judicial review.

  This theory holds together without Natural Law, without a unitary demos, and without judicial supremacy. It relies on the belief that the political process (voting + parliamentary implementation) is a sufficient safeguard for legality, provided the outer boundaries of international civilization are respected.
