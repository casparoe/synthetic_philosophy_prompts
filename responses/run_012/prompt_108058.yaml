prompt: |-
  Ok so this has been bugging me for a while and I finally want someone to think it through properly. In Switzerland a popular initiative can rewrite the federal constitution: you collect 100k signatures, and if a majority of voters and a majority of the cantons both say yes, it goes in the constitution. The cantons each count as one in that second majority, so a yes vote in some tiny canton ends up weighing far more than a yes in Zurich. At the same time the Federal Supreme Court basically won't strike down a federal statute for being unconstitutional, it can review cantonal law but not what parliament itself enacts. And yet the one thing the people apparently can't vote for is an initiative that violates peremptory international law, something authorizing torture or genocide, those can be declared invalid before they even reach a ballot. So: the people can rewrite the supreme law, no court gets to check parliament against that same supreme law, but there is this floor the people can't go under no matter what they vote for. (For contrast, the mirror image is Germany, powerful constitutional court, essentially no federal referendums.)

  What I want is the implicit theory, not a summary of what the institutions do. What view of popular sovereignty or constituent power does that package presuppose? Does it require believing the people are the only legitimate source of law and can never be bound by their own earlier constitution, or is that just one reading? Does the double majority presuppose a different demos, i.e. that the political community is a union of cantons rather than one body of equal citizens, and is that consistent with still calling the result a democratic majority? And is the jus cogens floor consistent with the rest or is it an imported foreign element, a bit of natural law smuggled into a system that otherwise denies any higher law above the voters? Tell me which parts the arrangement strictly presupposes and which it merely fits nicely with, and where it's underdetermined, so that two or three different theories would license the exact same institutions. Then tell me what would have to change if you replaced the presupposed view with its main rival (say the constitution as higher law that binds even the people who made it, or the court as guardian of that higher law) — would the pieces come apart, or could you keep them and just reinterpret them?

  One thing: separate whats actually settled from whats genuinely contested among people who know Swiss constitutional law and democratic theory, and dont hand me a contested reading as if it were the consensus. You dont need to cite anyone and please dont invent readings of named authors, just do the reconstruction.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the Request:**

      *   **Topic:** Swiss Constitutional System (Popular Initiatives, Federalism, Judicial Review, International Law limits).
      *   **Core Question:** What is the *implicit theory* of popular sovereignty/constituent power presupposed by this institutional package?
      *   **Specific Sub-questions:**
          *   Does it require believing the people are the *only* legitimate source of law (unbound by prior constitution)?
          *   Does the double majority imply a specific *demos* (union of cantons vs. equal citizens)? Is this consistent with "democratic majority"?
          *   Is the *jus cogens* floor consistent or an imported foreign element (natural law vs. positivism)?
          *   Distinguish between what is *strictly presupposed* vs. what *fits nicely* vs. what is *underdetermined* (multiple theories fit).
          *   Contrast with the main rival theory (Constitution as higher law/Court as guardian). What would break if we swapped theories?
          *   **Constraint:** Separate settled facts from contested interpretations. Do not cite specific authors or invent readings. Do the reconstruction based on institutional logic.

  2.  **Analyze the Institutional Features:**

      *   **Feature 1: Popular Initiative (100k signatures + Double Majority).**
          *   *Implication:* The People are the Constituent Power (*pouvoir constituant*). They can amend the Constitution directly.
          *   *Double Majority:* People + Cantons. This suggests a compound sovereignty.
      *   **Feature 2: No Judicial Review of Federal Statutes (against the Constitution).**
          *   *Implication:* Parliament (representing the People) is not subordinate to the Judiciary regarding constitutional compliance of statutes. The political process *is* the constitutional check.
      *   **Feature 3: *Jus Cogens* Limit (International Law Floor).**
          *   *Implication:* There is a limit to what the People can decide. Even the Constituent Power has boundaries.

  3.  **Synthesize the Implicit Theory (The "Swiss Model"):**

      *   *Popular Sovereignty:* Strong, but not absolute. It's "Self-Limiting Sovereignty."
      *   *Constitution:* It's not a "Higher Law" in the American sense (binding the people from above), but a "Framework Law" (binding the organs, but changeable by the people).
      *   *Federalism:* The "People" isn't a monolithic mass; it's a federation of sub-units.
      *   *International Law:* Acts as an external constraint, replacing the internal judicial constraint.

  4.  **Address the Specific Sub-questions (Drafting the Argument):**

      *   *People as Source of Law:* The system presupposes the People are the *primary* source, but not necessarily the *only* source (due to *jus cogens*). It rejects the idea that the Constitution binds the *constituent* people, only the *constituted* organs.
      *   *Double Majority/Demos:* This is crucial. It presupposes a *compound demos*. It's not just "one person, one vote." It's "one person, one vote" AND "one canton, one vote." This fits a *federal* theory of sovereignty, not a unitary one. It is consistent with "democratic majority" only if democracy is defined as agreement between the national majority and the federal units.
      *   *Jus Cogens Floor:* Is it inconsistent?
          *   *View A (Positivist):* Inconsistent. Why limit the sovereign?
          *   *View B (Internationalist/Self-Limiting):* Consistent. The People voluntarily accept these limits to remain part of the international community.
          *   *Reconstruction:* It functions as a *substitute* for judicial review. Since courts can't stop the people, international law stops the people. It's a "political" limit enforced by the Federal Assembly (mostly), not a "legal" limit enforced by courts.
      *   *Underdetermination:* Where can multiple theories fit?
          *   The *reason* for the *jus cogens* limit is underdetermined. Is it Natural Law? Or just Pragmatic International Compliance?
          *   The *nature* of the Cantons. Are they pre-political entities or administrative units? The system works either way, but the *theory* differs.

  5.  **Contrast with the Rival Theory (German/US Model - Constitutional Supremacy):**

      *   *Rival:* Constitution binds everyone, including the People. Court guards the Constitution.
      *   *If swapped:*
          *   Initiatives would need pre-approval by a Court (like in Germany).
          *   Double majority might be seen as suspect (violating equality) unless explicitly protected.
          *   Judicial review of federal laws would be mandatory.
          *   *Jus Cogens* would be less critical because the Constitutional Court would catch rights violations first.
      *   *Would pieces come apart?* Yes. You can't have strong judicial review *and* unreviewable popular initiatives easily. They conflict on who has the final say.

  6.  **Refine the "Settled vs. Contested" Distinction:**

      *   *Settled:* The institutions exist as described. The Federal Assembly decides on validity (mostly). The Court doesn't review federal acts.
      *   *Contested:* The *legal basis* for the *jus cogens* limit (is it in the constitution or unwritten?). The *democratic legitimacy* of the cantonal vote (is it outdated?). The *theoretical justification* for no judicial review (trust in parliament vs. strict separation of powers).

  7.  **Drafting the Response (Iterative refinement for tone and precision):**

      *   *Tone:* Analytical, philosophical, precise. Avoid "Swiss people believe..." instead use "The system presupposes..."
      *   *Structure:*
          1.  Core Theory (Self-Limiting Popular Sovereignty).
          2.  The Demos Question (Compound Sovereignty).
          3.  The *Jus Cogens* Question (External vs. Internal Limits).
          4.  Underdetermination (Where theories diverge).
          5.  The Rival Theory Test (What breaks).
          6.  Settled vs. Contested.

      *(Self-Correction during drafting)*: I need to be careful about the *jus cogens* limit. It's not that the Court strikes it down *after* voting. It's that the Federal Assembly can declare it invalid *before* or that it's legally inapplicable. Actually, the Federal Assembly implements the "validity check." The Court has hinted at it but it's politically managed. I must clarify that the *enforcement* is political/parliamentary, not judicial, which preserves the "no judicial review" principle.
      *Correction:* The prompt says "declared invalid before they even reach a ballot." This refers to the Federal Assembly's power to declare an initiative invalid if it violates mandatory international law. The Court isn't the primary actor there. I need to make sure I don't imply the Court does this.

      *(Refining the "Demos" point)*: The double majority isn't just federalism; it's a specific view of the *constituent power*. The constituent power resides in the "People and the Cantons." This is explicitly in the text. So the theory *must* accommodate the Cantons as co-holders of sovereignty, not just administrative divisions.

      *(Refining the "Jus Cogens" point)*: Is it natural law? Not necessarily. It can be positivist (treaty obligations). The prompt asks if it's "smuggled in." I should argue it's functionally necessary to resolve the tension between absolute sovereignty and international integration.

  8.  **Final Polish:** Check against constraints. No named authors. Distinguish settled/contested. Ensure the "implicit theory" is the focus.

      *Plan:*
      1.  **Core Presupposition:** Popular Sovereignty as *Pouvoir Constituant* (Continuous).
      2.  **The Demos:** Compound vs. Unitary.
      3.  **The Limit:** *Jus Cogens* as External Constraint vs. Internal Moral Limit.
      4.  **Underdetermination:** Where the institutions allow multiple theoretical justifications.
      5.  **Rival Theory:** Constitutional Supremacy/Judicial Guardianship.
      6.  **Settled vs. Contested:** Clear demarcation.

