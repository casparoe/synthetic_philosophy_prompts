      *   **Popperian:** His career, his caution. The scientist. Thinking before acting. Protecting the family from mistakes by making them himself in his mind first.
      *   **Gregorian:** The Teacher. This is crucial for the ecology crowd. Passing on tools. Language. The shared mind.
      *   **The Decline:** The reverse. Dementia taking the rungs away. Honesty about the end (reflexes only).
      *   **The Turn/Conclusion:** The Gregorian legacy. He installed his mind in us. We are the vessels.

  5.  **Refining Tone and Language (British English):**

      *   Use "Mum," "colour," "realise," "centre."
      *   Avoid Americanisms.
      *   Keep the rhythm speech-like. Pauses.
      *   Ensure the Dennett terms are explained naturally. *Self-Correction:* I need to make sure I don't explicitly name-drop Dennett, but I do need to use the terms (Darwinian, Skinnerian, etc.) because the prompt asks for them as the spine, and the colleagues will expect them. The prompt says "no 'as Dennett says' bits," implying I *can* use the terms but must contextualize them. Actually, re-reading: "no jargon without a plain-English gloss the first time it appears." So I should use the terms but define them immediately.
      *   *Wait, a critical check:* If I use the terms "Darwinian, Skinnerian, Popperian, Gregorian," the family will glaze over. If I *don't* use them, the colleagues won't get the tribute. The prompt says: "they'll clock exactly what I'm doing the second I say 'Skinnerian'." So I *must* use the terms. The trick is to make the definitions sound like descriptions of *him*.

  6.  **Addressing the "Ladder" Critique:**

      *   Dennett's hierarchy can imply the lower rungs are "lesser." In the context of dementia, this is dangerous territory. It could sound like he became "less human."
      *   *Fix:* Frame the return not as becoming lesser, but as returning to a state of pure connection (Darwinian/Touch). Emphasize that the Gregorian layer is the *addition*, not the *essence*. The essence was always there.
      *   *Also:* Validate the brother's feeling. Acknowledge that this sounds technical, but explain *why* it fits.

  7.  **Drafting - Step-by-Step (Mental or Scratchpad):**

      *   *Intro:* Thank you. Hard to find words.
