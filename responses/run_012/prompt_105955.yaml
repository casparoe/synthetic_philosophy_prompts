answer: |-
  Thank you all for being here. For those who don't know me, I'm [Your Name].

  Standing here, trying to sum up a life of seventy-nine years, I found myself reaching for a specific kind of map. Dad was a scientist, and for the last few years, watching his mind change, I found myself thinking about the different layers of how we exist. There's a way of looking at life that divides it into four stages. It sounds technical, I know—my brother warned me not to turn this into a lecture—and I'm not using it to distance myself from Dad. I'm using it because it's the only way I could make sense of what we loved, and what we lost.

  It starts with what we might call the **Darwinian** layer. This is the baseline. It's what you're born with. I think of Dad as a baby, here in Bristol, just lungs and instinct. The hardwired will to survive. That spark was there from the very first breath.

  Then comes the **Skinnerian** stage. This is learning by trial and error. The boy who touched the stove and learned about heat. The young man learning to ride a bike, falling off, adjusting. Dad was resilient. He wasn't afraid of making mistakes, provided he learned from them. That's how he built his skills, one small correction at a time.

  But then, he became **Popperian**. This is the ability to let your hypotheses die in your head, so you don't have to die in the real world. This was the scientist. The man who could sit over breakfast and run a simulation of a decision, spotting the flaw before it happened. He protected our family by worrying through the possibilities himself. He absorbed the risk so we didn't have to.

  And finally, the top layer: the **Gregorian** mind. This is the level of shared tools. Language, culture, teaching. This was the Professor. He didn't just think; he took the thinking-tools of his discipline and installed them in others. He didn't keep his mind to himself. He gave it away. To his students, to his colleagues, and to me. He made us smarter by lending us his ways of seeing the world.

  For a long time, he lived on that top rung. But as many of you know, the last four years were hard. Vascular dementia doesn't respect the order of things. We watched him come back down the ladder.

  The words went first—the Gregorian tools slipped from his hands. Then the planning—the Popperian simulations stopped running. He couldn't trial-and-error his way out of confusion anymore. And at the end, in hospice, he was back to the beginning. Back to the Darwinian. A squeeze of the hand. Turning towards a voice. Pure instinct.

  I know how that sounds. To describe my father as a set of layers, ending with a reflex, might sound cold. My brother was worried I was eulogising a theory instead of a man. He was right to worry. Because the ladder metaphor breaks down in one crucial place.

  A ladder implies that the bottom is lesser than the top. But when Dad was down to that final squeeze of the hand, he wasn't 'less' of a father. He was still him. The love didn't live in the complex planning or the vocabulary; those were just the furniture. The love was in the structure itself.

  And this is the thing I need you to know, and the thing that gets me through: the Gregorian layer—the top rung—is the only one that is truly shared. A Popperian mind dies with the host. But a Gregorian mind is made of other people's minds.

  The tools he installed in his students are still running in their research. The ways of thinking he gave me are still running in my head. He built a mind that was partly made of us, and so he doesn't need his own biology to keep it going. We are the vessels.

  So, yes, his head emptied out. But the thing he built didn't go with him. It stayed here. In this room. In the work you did with him, and in the way I raise my own children.

  He started as a spark of instinct, and he ended as a spark of instinct. But in between, he lit a fire in all of us that's still burning.

  Thank you, Dad. For the tools. For the love. And for letting us carry it forward.
