      *   *Check against constraints:* No reading list? Check. Ranked conflicts? Check. Fixes/Costs? Check.

      *(Self-Correction during drafting)*: I need to be careful with Claim 5 (Naturalism). If they are a Trope Theorist, are tropes "what physics posits"? Physics posits electrons, fields, etc. Tropes are metaphysical constituents. This is a potential friction point with 5. I should mention that.
