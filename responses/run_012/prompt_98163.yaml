      *   *WAS Nuance:* The WAS argument isn't just "kill everything," it's about evaluating interventions. The film shows intervention (Eboshi) as selfish/greedy, not welfare-focused. This is a key distinction. Eboshi doesn't care about suffering; she cares about progress/gods' heads. So the film isn't arguing *against* welfare reduction specifically, it's arguing against *human hubris*.
