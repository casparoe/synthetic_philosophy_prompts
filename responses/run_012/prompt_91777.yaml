answer: |-
  ### The Principle of Sortal-Relative Constitution

  Your verdicts cohere around a single metaphysical framework, though they strain against one specific intuition. The principle that systematizes your views is the **Principle of Sortal-Relative Constitution**. It posits that objecthood is not a brute fact of matter, but a status conferred by the *sortal concept* (the kind of thing) under which a portion of reality is identified. Each sortal carries its own rules for persistence, origin, and destruction.

  Here is the principle stated in four clauses, followed by an explanation of which clause validates which verdict.

  **1. The Clause of Material Continuity**
  > A quantity of matter persists so long as there is a continuous spatio-temporal path of its constituent particles, allowing for the subtraction or addition of parts provided the bulk remains.
  *   **Work done:** This validates your verdict that the *lump* survives the pinching (subtraction of parts) and that the *lump* returns when the unfired bowl is soaked (recovery of particles). It also validates that the *clay* does not survive the kiln, because the chemical change breaks the continuity of the specific material kind "clay" (it becomes earthenware).

  **2. The Clause of Historical-Functional Continuity**
  > An artifact persists so long as it maintains its intended function or form, or so long as any loss of form is temporary and rectified by a restoration process causally linked to the original intention.
  *   **Work done:** This validates your verdict that the *bowl* survives the pinching (damage to form does not destroy function) but is destroyed at the moment of smashing (loss of function/form). Crucially, the "restoration process" sub-clause validates your view that the glued bowl is the *same* bowl, not a replica, because the causal history of its reconstruction preserves its lineage.

  **3. The Clause of Intentional Origin**
  > An artifact comes into existence only when a portion of matter is intentionally shaped or selected for a function; mere accidental resemblance is insufficient.
  *   **Work done:** This validates your verdicts on the horse-shaped lump (not a statue) vs. the intentionally shaped lump (a statue), and the driftwood in the sea (not sculpture) vs. the driftwood on the plinth (sculpture). It explains why the plaster cast is a copy: it has a different history of production, even if the original is destroyed.

  **4. The Clause of Constitution without Identity**
  > Two distinct objects, governed by different sortals, may occupy the same spatial region at the same time. One constitutes the other, but they are not identical. The constituted object adds no new "stuff" to the world, only new persistence conditions.
  *   **Work done:** This validates your view that the bowl is "nothing over and above" its matter (no ghostly stuff) while simultaneously validating that the bowl is not the clay (different persistence conditions). It attempts to respect your rejection of "coincident objects" by framing them not as two independent substances, but as one substance under two modes of counting.

  ---

  ### The Incompatibility and the Necessary Surrender

  You have identified the central tension yourself: You want to say there are **two things** (because they have different futures) but only **one material object** (because you reject coincidence).

  A competent defender of this principle must tell you that **you cannot keep both.**

  **The Verdict to Surrender:** You must surrender the claim that *"there is only one material object on that bench."*

  **Why:** Identity is transitive. If the Lump is the Object, and the Bowl is the Object, then the Lump is the Bowl. But you have established that the Lump and the Bowl have different persistence conditions (the Lump survives the kiln as clay; the Bowl survives the kiln as earthenware; or vice versa depending on your exact metaphysics of firing). If $A$ can survive a change that $B$ cannot, $A \neq B$. If $A \neq B$, and both are on the bench, there are two objects.

  To insist on "one object" is to insist on counting without a criterion. If you count by "material quantity," you get one. If you count by "artifact," you get one. If you count by "material object simpliciter," the term is too vague to do work. Your detailed verdicts about survival and destruction commit you to **two coincident entities**. The "nothing over and above" clause saves you from ontological extravagance (you aren't positing two *substances*), but it does not save you from numerical duality. You have one hunk of reality, but it falls under two distinct identity conditions.

  ---

  ### Application to New Cases

  **Case 1: The Clipped Hedge (Living Matter)**
  *   **Scenario:** A gardener trims a shrub into the shape of a sphere.
  *   **Application:**
      *   **The Shrub (Organism):** Governed by *Material/Biological Continuity*. It persists as long as the biological life processes continue. If it grows wild and loses its shape, the Shrub survives.
      *   **The Hedge (Artifact/Feature):** Governed by *Historical-Functional Continuity*. It persists only as long as it is maintained as a boundary or ornament.
  *   **Verdict:** If the gardener abandons the hedge and it grows wild, the *Shrub* survives, but the *Hedge* ceases to exist. If the gardener replaces the branches with artificial ones that look identical, the *Hedge* might survive (function maintained), but the *Shrub* is dead.
  *   **Implication:** This mirrors the Bowl/Clum case. The living matter and the shaped object are distinct because one tracks biology and the other tracks intention/form.

  **Case 2: The Ruin**
  *   **Scenario:** A stone castle collapses into a pile of stones over centuries.
  *   **Application:**
      *   **The Castle (Artifact):** Governed by *Historical-Functional Continuity*. It requires the structure to serve (or be capable of serving) its defensive/residential function.
      *   **The Stones (Matter):** Governed by *Material Continuity*.
  *   **Verdict:** When the roof collapses, the *Castle* is destroyed. The *Stones* remain. If a modern builder reconstructs the castle exactly using the original stones, your principle (via the Restoration sub-clause) might allow the *Castle* to return. If they use new stones, it is a Replica.
  *   **Implication:** This tests your "smashed bowl" verdict. A ruin is like the smashed bowl before gluing. The artifact is gone; only the matter remains.

  ---

  ### The Final Question: New Object or New Description?

  You ask whether the throwing of the bowl brought a **new object** into being or only made a **new description** true of an old one.

  **The Principle's Answer:** It brought a **new object** into being.

  **Reasoning:**
  If it were merely a new description, then the persistence conditions of the "old one" (the lump) would apply to the "described one" (the bowl). Descriptions do not alter modal reality. If I describe a man as "the husband," he does not cease to exist if his wife dies; he merely ceases to fit the description.

  But you have judged that the *Bowl* ceases to exist if smashed, while the *Clay* does not. This means the Bowl has modal properties (ways it can or cannot be) that the Clay lacks. Descriptions do not have modal properties; objects do. Therefore, the act of throwing the clay did not just change how we talk; it changed the metaphysical landscape. It created an entity whose existence depends on human intention and form, distinct from the entity whose existence depends on particle continuity.

  You are not merely describing the clay differently; you are engaging in an act of **ontological creation**. You have taken a portion of matter that was governed by the laws of geology and chemistry and subsumed it under a new sortal governed by the laws of art and function. That is the birth of a new object.
