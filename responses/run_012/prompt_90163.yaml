      *(Wait, one nuance on 7)*: 7 says "criticized from the outside". 2 says "demand for justification... out of place". Genealogy isn't justification *of the claim*, it's explanation *of the holding*. But if the claim is a rule (3), explaining the holding doesn't invalidate the rule. If the claim is a fact (not 3), explaining the holding via distortion invalidates the fact. So again, 3 is the key.

