  *   Philosophers will cite Grice or Fricker.
  *   Policy will talk about "displacement of harm."

  Let's refine the specific wording to match these personas.

  *   *Phil:* "Epistemic pollution," "Normative status."
  *   *Eng:* "Optimization target," "False positive rate," "Signal."
