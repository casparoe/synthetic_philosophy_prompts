prompt: |-
  I'm on a panel at a campus AI-ethics event in a few weeks and I want to use the slot to push a reading of Dennett's counterfeit-people line that I don't think is the obvious one: the harm he's pointing at isn't that some user somewhere gets fooled by a chatbot, it's that these systems drain what I've been calling testimonial collateral -- the standing background assumption that whoever you're talking to has something on the line, a life, a reputation, a stake in getting it right -- and that ordinary talk runs on. My claim is that the drain isn't selective: we don't get to keep trusting nurses and loose trusting customer-service bots, the presumption is one tank. The room is roughly a third philosophers of mind, a third ML engineers, a third policy/trust-and-safety people from an advocacy org. Build me the Q&A prep sheet for after the panel: the eight or so objections I'll actually get, ordered by how much damage they do, each phrased in the vocabulary of the camp that will raise it (the mind people are going to go straight at whether anything is really damaged if nobody is deceived; the engineers will say I've dressed up a measurable harm in a metaphor), with a two-minute reply to each and a note on where the reply is soft. Include the question I'm dreading.
