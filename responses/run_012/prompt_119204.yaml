  2.  **Deconstruct the Core Argument:**
      *   *Premise 1:* Human communication relies on "testimonial collateral" (stakes, reputation, life).
      *   *Premise 2:* AI chatbots lack this collateral (no skin in the game).
      *   *Premise 3:* Widespread interaction with AI drains the *general* presumption of collateral in communication.
      *   *Premise 4:* This drain is non-selective (affects trust in humans too).
      *   *Conclusion:* This is the primary harm of "counterfeit people," more so than individual deception.

  3.  **Brainstorm Objections by Camp:**

      *   **Philosophers of Mind:**
          *   Focus: Truth, deception, epistemology, nature of trust.
          *   Objection 1: If no one is actually deceived (we know it's a bot), where is the harm? (The "Transparency" counter).
          *   Objection 2: Is "testimonial collateral" just a metaphor for reliability? If so, isn't this just a standard reliability engineering problem?
          *   Objection 3: Does this imply we shouldn't trust humans who *also* lack stakes (e.g., paid spokespeople)?

      *   **ML Engineers:**
          *   Focus: Metrics, utility, implementation, scalability.
          *   Objection 4: You're calling a measurable utility gain (efficiency) a metaphysical loss. Show me the metric for "drained collateral."
          *   Objection 5: We can build "skin in the game" into agents (reputation systems, cryptographic signing). You're solving a social problem with a ban.
          *   Objection 6: This is Luddism. We replaced human calculators with computers; did that drain "mathematical collateral"?

      *   **Policy/Trust & Safety:**
