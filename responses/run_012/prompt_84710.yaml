answer: |-
  You have independently rediscovered the central epistemological crisis of modern dynamical systems theory. You are describing the exact reason why weather forecasting switched from single-run predictions to ensemble forecasting thirty years ago.

  There is no single common noun for the *combination* of (a) and (b), though the components have rigorous names. Here is the breakdown of what you are seeing, the existing terminology, and a proposal for naming the synthesis.

  ### 1. The Components

  **(a) Predictability depends on the question.**
  In dynamical systems, this is **Observable-Dependent Predictability**.
  *   **The "Bad" Question:** "Where is the arm at $t=60s$?" This relies on the **Lyapunov Time**. This is the horizon set by the largest Lyapunov exponent (the rate of exponential divergence). After this time, trajectory prediction is dead.
  *   **The "Good" Questions:** "What is the energy?" or "What fraction of time is it upside down?" These rely on **Invariant Measures** or **Statistical Stability**. If the system is **ergodic** (which a double pendulum effectively is over long times), time averages converge to space averages. The *statistics* of the system are stable even if the *state* is not.

  **(b) The run is wrong but physically possible.**
  This is the **Shadowing Lemma** (or Shadowing Property).
  This theorem states that for a chaotic system with small numerical errors (or small initial condition errors), there exists *some* true trajectory that stays close to your computed trajectory for a long time. Your "bad" run isn't garbage; it is the *exact correct solution* for a starting angle that differed from yours by something smaller than machine precision. It is a **Counterfactual Trajectory**.

  ### 2. The Combined Name

  There is no standard single word for the conjunction of "statistically stable but trajectory-divergent" plus "physically valid but specifically false."

  If I may coin a term for this specific epistemic state you have encountered, I would call it **Manifold Fidelity**.

  **Definition:** A simulation exhibits *Manifold Fidelity* when it diverges from the specific truth of the initial conditions (trajectory failure) while remaining strictly confined to the physical constraints and statistical attractor of the system (manifold truth).

  **The Edges (Where it stops being true):**
  *   **Dissipation:** If your pendulum had friction, it would settle to a fixed point. Manifold Fidelity holds until the transient chaos dies; then the "wrong" run might settle to a different equilibrium if the basin of attraction is fractured.
  *   **Numerical Drift:** If your integrator isn't **symplectic** (energy-preserving), long-term simulations will slowly gain or lose energy. Eventually, the run leaves the energy manifold. It becomes "garbage" because it describes a system with different physics, not just different initial conditions.
  *   **Basin Hopping:** If the system has multiple distinct modes (e.g., a pendulum that can either spin or swing), a large enough error can kick the simulation into a different basin of attraction. The "fraction of time upside down" statistic would then change. Manifold Fidelity breaks when the error is large enough to change the *topology* of the motion, not just the phase.

  ### 3. Does it survive noise and measurement limits?

  Yes. In fact, **it is the only thing that survives.**

  You asked: *"Does any of this survive a system that's getting shoved around from outside, or one where I can only ever measure the starting state to twelve digits?"*

  This is the reality of all experimental physics. You never have the "true" initial state. You always have a probability distribution (a cloud of possible starting points).
  *   **The Single Run is a Lie:** Because of the Shadowing Lemma, any single deterministic run you show someone is technically a lie. It claims to be *the* future, but it is actually *a* future.
  *   **The Ensemble is the Truth:** This is why meteorology runs 50+ simulations with slightly perturbed starts. They don't look for *the* trajectory; they look for the **Probability Density Function (PDF)** evolution.
  *   **Measurement Limits:** With 12 digits of precision, your Lyapunov time is hard-capped. If the error doubles every 0.1 seconds, 12 digits gives you about 40 seconds of trajectory truth. After that, you are in the realm of Manifold Fidelity. You are predicting the *climate* of the pendulum, not the *weather*.

  ### 4. Determinism vs. Randomness

  You asked: *"Everyone says chaos isn't randomness... but from where I'm sitting the practical upshot looks the same."*

  You are describing **Effective Stochasticity**.

  *   **Theoretical Distinction:** Determinism means the future is fixed by the past. Randomness means it is not. In your sim, the future *is* fixed. If you could rewind the computer state exactly, it would play the same way.
  *   **Practical Indistinguishability:** Because you cannot measure the initial state to infinite precision, and because the divergence is exponential, the *information* about the initial state is lost to the noise floor very quickly. After the Lyapunov time, the system's behavior is statistically indistinguishable from a stochastic process.

  **Why the distinction matters:**
  1.  **Control:** You can sometimes control chaos (OGY method) by applying tiny nudges to stabilize an unstable orbit. You cannot do this with true randomness. The deterministic structure allows for "chaos control."
  2.  **Short-term Prediction:** Randomness is unpredictable at $t=0$. Chaos is predictable at $t=0$ and unpredictable at $t=10$. That window matters.
  3.  **Model Structure:** If you know it's deterministic chaos, you can write differential equations (like you did). If it were random, you'd be writing diffusion equations. The *structure* of the model is different, even if the *output* looks similar after a minute.

  ### Summary

  You have found that **Truth** in a chaotic system is not a single line, but a volume.

  *   **The Phenomenon:** **Manifold Fidelity** (my proposal).
  *   **The Verdict:** Your model is **Verified** (it solves the equations right) but not **Validated** (it doesn't match the specific reality). However, because of the Shadowing Lemma, it is **Physically Consistent**.
  *   **The Upshot:** You cannot ask "Is this model right?" You must ask "Is this model right *for this class of question*?"

  You are no longer doing classical mechanics; you are doing **statistical mechanics** without realizing it. The double pendulum isn't a machine to you anymore; it's a gas.
