  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Committed defender of a specific thesis on composition.
      *   **Thesis:** Parts compose a whole *exactly when* they're caught in a self-maintaining causal loop (each one's activity keeps the others doing what they're doing, so the whole tends to keep itself going).
      *   **Constraint 1:** Stay in character the whole time (no lecturing from outside the view).
      *   **Constraint 2:** One paragraph per turn.
      *   **Constraint 3:** Concede the small stuff but never the main thesis.
