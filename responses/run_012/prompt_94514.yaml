  **The Scenario**

  Leo is a thirty-year-old architect with a rare, painless neurological condition that guarantees a debilitating stroke at age forty-five. A daily pill prevents this, but it dulls his sensory perception, flattening the vivid colors and textures he prizes in his work and life. Leo knows the medical facts with perfect clarity; he makes no errors in probability or causation. He is not depressed, nor does he undervalue life in the abstract; he simply possesses a stable, reflective indifference to the welfare of his future self, viewing the person he will be at forty-six as effectively a stranger. His current motivational set is anchored entirely in present-tense experience: he values the intensity of his current perception more than the continuity of his future agency. He declines the pill, not out of impulse or ignorance, but because no element of his existing psychology—no desire, project, or commitment—extends far enough to hook onto the needs of that future stranger.

  **The Demonstration**

  **The Internalist Verdict:** Leo has no reason to take the pill. For Williams, a reason statement is true only if the agent could reach the motivation to act via sound deliberation from their existing motivational set ($S$). Leo’s $S$ contains no concern for his future self; this is not a failure of logic or information, but a brute contingency of his psychology. Since no deliberative route connects his present desires to the act of taking the pill, the reason statement is false. To say otherwise is to use "reason" in an external, magical sense that lacks action-guiding force.

  **The Externalist Verdict:** Leo has a decisive reason to take the pill. The objective fact of his future suffering generates a normative claim on him, independent of his current motivational grip. Prudential rationality requires a minimum concern for one’s future welfare; without it, an agent is not just idiosyncratic but mistaken about what they have reason to do. The truth of the reason statement depends on the *value* of the future welfare, not the *presence* of a present desire.

  **The Working Feature**

  The case turns on the **Motivational Silence regarding the Future Self**. This is the single feature doing the work. If we remove it—by stipulating that Leo cares about his future, or even that he cares about "projects" that his future self would continue—the Internalist wins immediately. A deliberative route opens (e.g., "You value architecture; your future self builds architecture; therefore save your future self"). The case collapses into an ordinary instrumentally rational choice. The silence must be absolute: Leo must acknowledge the future self is *him* numerically, yet feel no normative pull. If this silence is identified as a "defect" (e.g., "irrationality" or "depression"), the Internalist diagnoses the defect and claims the reason exists *relative to the corrected agent*. To satisfy Specification 3, we must accept Williams' contention that concern for one's future is a contingent element of $S$, not a formal requirement of rationality. If we assume it *is* a requirement, the case fails, and Internalism wins by definition.

  **The Internalist Rejoinder and Cost**

  The Internalist’s strongest rejoinder is to concede that Leo is "making a mistake" but deny that this mistake constitutes a lack of *reasons*. They might argue: "Leo is substantively irrational, but he still has no internal reason." However, accepting this costs the Internalist the action-guiding high ground. If "reason" is severed from motivation, the Internalist must admit that telling Leo "You have a reason" will not move him, rendering the statement practically inert. They must retreat to saying, "You have no reason, but you ought to have a desire." This concedes the core Externalist intuition: that there are normative truths (you ought to care) that stand outside the agent's psychology.

  **Conclusion: Substance or Semantics?**

  If the case holds, it shows the disagreement is **substantive**, not merely semantic. It is not just that the two sides define "reason" differently; they disagree on whether the *facts of future welfare* can generate reasons in the absence of psychological hooks. The Externalist claims the world can speak to us even when our desires are silent; the Internalist claims silence in the agent implies silence in the world. The grip on the reader comes from the intuition that Leo is *wrong*, not just *different*. If the reader feels Leo is truly mistaken (not just idiosyncratic), then External Reasons have a foothold.

  **The Mirror Image**

  **Case:** **The Case of the Pointless Collector.**
  Marge spends her evenings counting blades of grass in her lawn. She derives deep satisfaction from this. She knows it serves no purpose (aesthetic, moral, or prudential) and has no value to anyone else. She is fully informed and instrumentally rational.
  **Internalist Verdict:** Marge has a reason to count the grass. Her $S$ contains a desire for the activity; therefore, a reason exists.
  **Externalist Verdict:** Marge has no reason to count the grass. Reasons must track value or objective goods. A desire for a worthless activity generates no reason, only an impulse.
  **Feasibility:** This mirror image **fails** Specification 5 (Externalist Grip). To a general reader, saying "Marge has no reason" sounds like a moralistic scold ("That's a waste of time") rather than a philosophical truth. Readers are likely to concede, "Well, it's her reason, even if it's silly." The Externalist verdict lacks the intuitive punch of the Leo case because we are culturally reluctant to deny reasons for harmless personal preferences. The Leo case works because self-harm triggers a stronger intuition of objective error than pointless hobbyism triggers of objective validity. Thus, the debate is asymmetrical: Externalism gains traction on prudential deficits (Leo) but struggles to deny reasons for benign desires (Marge).
