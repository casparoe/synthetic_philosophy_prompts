      *   *Okay, let's look at Spec 3 & 4 again.* "Whatever silence... has to be silence that the internalist cannot independently identify as a failure of practical reason."
      *   *This is the hardest constraint.* If an agent doesn't care about their own future welfare, Williams might say "That's just their S." But Parfit/Externalists say "They have a reason."
