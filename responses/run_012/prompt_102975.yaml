      *   *Thesis 2 (Empirical/Historical):* Everything done has been done before in history. (False, easily disproven by specific technological artifacts).
      *   *Thesis 3 (Combinatorial/Structural):* All novelty is recombination of existing primitives. (Substantive, aligns with Hofstadter).
      *   *Thesis 4 (Ontological/Radical):* No new *properties* or *dimensions* can emerge. Everything is reducible to prior physics/logic. (Radical, hard to defend).
