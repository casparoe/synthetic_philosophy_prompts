      *   **Reading 3 (Combinatorial Materialism):** All new things are rearrangements of pre-existing matter/concepts. (Substantive/Defensible).
      *   **Reading 4 (Dimensional Closure):** The space of possible variations is fixed; no new dimensions can be added. (Radical/Controversial).
      *   **Reading 5 (Process Determinism):** The *process* of creation is always the same (search/recombination), even if the output looks new. (Substantive).

  4.  **Verdicts:**
      *   Reading 1: Platitude (tokens are always new, types might not be).
      *   Reading 2: False (iPhone didn't exist in 1000 BC).
      *   Reading 3: Defensible (Standard computational view).
      *   Reading 4: False/Unproven (Conceptual blending often creates new dimensions).
      *   Reading 5: Defensible (Cognitive science standard).

  5.  **Testing Against Cases:**
      *   *Case A (New Knob/Dimension):* Adding a dimension not previously used.
          *   Reading 3 (Recombination): Might count as new if the *combination* is new, but if the dimension itself is new, Reading 4 says "Impossible."
          *   Reading 4 (Dimensional Closure): Would deny this is possible or say the dimension was latent.
      *   *Case B (Degenerate Restatement):* Just copying.
