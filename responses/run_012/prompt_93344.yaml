      *   It is *not* a false dilemma, but it is a *dichotomy of scope*.
      *   FEP as a *principle* (mathematical) $\to$ Risks vacuity.
      *   FEP as a *theory* (neural implementation) $\to$ Risks falsity.
      *   The session must distinguish between the *normative claim* (systems *must* do this to exist) and the *descriptive claim* (brains *do* do this via predictive coding).
      *   The friend is attacking the leap from the former to the latter.

