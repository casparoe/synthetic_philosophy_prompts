      *   *Ideal Candidate:* Needs to show *self-evidencing* (maintaining structure by sampling data that fits the model).
      *   *Decision:* The **Thermostat** is actually the *dangerous* choice the user is considering. The prompt asks what it must have/must not have and where it breaks.
      *   *Better Alternative:* A **Homeostatic Organism (e.g., E. coli or a simple agent seeking food/avoiding heat)**. It bridges the gap between thermostat and mind.
      *   *Wait, the user wants to know about the Thermostat specifically.* I need to analyze the thermostat's utility.
      *   *Thermostat Pros:* Simple, clear feedback loop.
      *   *Thermostat Cons:* No *generative model* of the world in a rich sense. No *epistemic* value (doesn't learn).
      *   *Where it breaks:* When we talk about *learning* or *counterfactuals*. A thermostat doesn't minimize surprise about *why* the temperature changed, just *that* it changed.
      *   *Recommendation:* Use the thermostat to set up the *structure*, but switch to a **Foraging Agent** for the *mind* part. Or, stick with the thermostat but explicitly highlight its limitations to address the "vacuous" claim. Let's advise using the **Thermostat** but with a specific twist: treat the set-point as a "prior." This makes the "vacuous" claim clear.

