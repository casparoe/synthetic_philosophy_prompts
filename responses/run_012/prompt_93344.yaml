      *   *Adjustment:* Start with the biological imperative (persistence/NESS), then move to the epistemic problem (surprise is incomputable), then the solution (variational free energy), then the mechanisms (perception/action).
      *   *Missing:* The distinction between *active inference* (the process theory) and the *principle* (the mathematical claim). This is crucial for the "vacuous vs. false" debate.

  4.  **Select the Carrying Example:**
