prompt: |-
  Act as a philosopher of law who's spent way too long thinking about blame, standing, and hypocrisy. Think carefully, and maybe start by brainstorming the candidate views on the menu before you commit to one.

  There's an asymmetry in criminal law that's been bugging me. In the same courtroom, the defendent's own record is fair game — the prosecution can haul up his past convictions to show he isn't credible when he testifies. But the state's own record is basically irrelevant: it doesn't matter, legally, whether the state, the judge, or the prosecutor has itself done horrible things; none of that is ever treated as a reason the state lacks standing to punish him. Same system, opposite treatment of "your own record." So what theory of standing to blame does the practice of criminal punishment presuppose? Does it assume standing has nothing to do with the blamer's moral record at all, or can you save it some other way — say, the state blames in a purely institutional capacity that's insulated from its own sins? Reconstruct the implicit theory, sort out which rival accounts of standing it actually rules out vs. merely sits comortably with (the moral-record/hypocrisy view, the relationship view, whatever else you'd put on the list), and tell me where the practice is just underdetermined, so that several theories would license the same legal practice. Don't just recite the usual positions — I want the reconstruction. Then, last thing: if we took the "clean hands" idea seriously and applied it to the state, what concretely would have to change in how criminal justice actually works?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher of law (specializing in blame, standing, hypocrisy). Tone should be thoughtful, analytical, slightly weary but rigorous ("spent way too long thinking about this").
      *   **Task:**
          1.  Brainstorm candidate views on standing to blame.
          2.  Reconstruct the implicit theory of standing presupposed by current criminal law practice (specifically the asymmetry regarding past records of defendant vs. state).
          3.  Determine which rival accounts are ruled out vs. compatible/underdetermined.
          4.  Explore the concrete implications of taking the "clean hands" (hypocrisy) view seriously for the state.
      *   **Key Constraint:** Don't just recite positions; reconstruct the *implicit* theory behind the practice. Address the specific asymmetry (defendant's record matters, state's record doesn't).

  2.  **Brainstorming Candidate Views on Standing to Blame:**
      *   *The Moral Authority View:* To blame, you must be morally better than the blamed. (Hypocrisy defeats standing).
      *   *The Relationship/Community View:* Standing depends on a normative relationship (e.g., membership in a moral community).
      *   *The Institutional/Office View:* Standing derives from a role or office, not personal morality.
      *   *The Forfeiture View:* By breaking the law, the defendant forfeits the right to demand moral consistency from the state.
      *   *The Consequentialist View:* Standing is irrelevant; only outcomes matter. (Though this usually dissolves the concept of standing rather than explaining it).
      *   *The Waiver View:* By entering the courtroom/testifying, the defendant waives certain privacy/character protections.

  3.  **Reconstructing the Implicit Theory of Criminal Law:**
      *   *Observation:* Defendant's prior bad acts $\rightarrow$ Admissible (often) to impeach credibility or show propensity (depending on jurisdiction/rules). State's prior bad acts $\rightarrow$ Inadmissible/Irrelevant to standing to punish.
      *   *Why?* The law treats the State not as a moral agent in the same sense as an individual, but as a *sovereign authority*.
      *   *Core Mechanism:* The "Office" or "Role" theory. The prosecutor speaks for *The Law*, not for themselves personally.
      *   *Secondary Mechanism:* The "Social Contract/Forfeiture" theory. The defendant, by violating the peace, loses the leverage to demand moral purity from the enforcer.
      *   *Synthesis:* It looks like a hybrid of **Institutional Authority** + **Legal Positivism**. The validity of the blame (punishment) depends on the *source* of the norm (validly enacted law), not the *virtue* of the enforcer.
      *   *What does this rule out?* It rules out a strong **Moral Integrity/Hypocrisy View** applied to the state *as an agent*. If standing required moral cleanliness, the state would often lack standing.
      *   *What is compatible?* **Relationship View** (if the relationship is citizen-sovereign, not peer-peer). **Waiver View** (defendant waives right to challenge state's virtue by breaking law).

  4.  **Drafting the Reconstruction (The "Meat"):**
      *   *Tone Check:* Needs to sound like a philosopher who has stared at this problem until it stared back. Use terms like "normative leverage," "institutional persona," "moralized standing."
      *   *The Asymmetry:* Why is the defendant's record relevant? Because *they* are on trial as a moral agent (culpability). Why is the state's record irrelevant? Because the state is the *framework*, not a participant in the same moral game.
      *   *The Implicit Theory:* **The Sovereign Immunity of Normative Authority.** The state's standing is *jurisdictional*, not *moral*. It's about *who has the right to rule*, not *who is good*.
      *   *Rival Accounts:*
          *   *Hypocrisy View:* Ruled out for the State. (State can be hypocritical and still punish).
          *   *Relationship View:* Compatible, *if* the relationship is hierarchical.
          *   *Forfeiture View:* Highly compatible. Defendant forfeits the right to call out state hypocrisy.

  5.  **Addressing the "Underdetermination" Aspect:**
      *   Are there other theories that fit? Yes. A **Functionalists/Consequentialist** view fits perfectly. We ignore state hypocrisy because acknowledging it would collapse the system (chaos > injustice).
      *   A **Legal Positivist** view fits. Law is separate from morality. State's moral sins don't invalidate legal authority.
      *   So, the practice doesn't prove *one* moral theory; it proves a commitment to *institutional stability* over *moral consistency*.

  6.  **The "Clean Hands" Counterfactual:**
      *   If we applied the Hypocrisy View to the State:
      *   *Discovery:* Defendants could subpoena state misconduct (police brutality, prosecutorial misconduct, historical injustices).
      *   *Remedy:* Not just exclusion of evidence (fruit of the poisonous tree), but dismissal of charges *for lack of standing*.
      *   *Structural Change:* "Clean Hands" commissions. Before prosecuting a crime, the state must certify its own hands are clean regarding that type of crime or the specific defendant.
      *   *Result:* Massive reduction in prosecutions. Potential collapse of enforcement in marginalized communities. Or, paradoxically, massive reform to ensure state cleanliness.

  7.  **Refining the Tone and Structure:**
      *   *Intro:* Acknowledge the weariness. Set the stage.
      *   *Section 1: The Menu.* Briefly list the philosophical options.
      *   *Section 2: The Reconstruction.* Dig into the asymmetry. Define the "Institutional Persona."
      *   *Section 3: Ruling Out vs. Underdetermined.* Be precise about what the practice commits us to.
      *   *Section 4: The Clean Hands Revolution.* Concrete legal changes.
      *   *Conclusion:* A philosophical sigh.

  8.  **Self-Correction/Nuance Check during drafting:**
      *   *Correction:* Wait, is the defendant's record *always* fair game? *Fed. R. Evid. 609* allows impeachment by prior conviction, but *404(b)* limits propensity evidence. I need to be careful not to overstate. The prompt says "fair game... to show he isn't credible." I should stick to that specific context (impeachment) to keep the analogy tight. The state's credibility isn't impeached by its record.
      *   *Nuance:* The "State" isn't a person. I need to emphasize the *personification* problem. When we blame the state, who is the blamer? The People? The Crown?
      *   *Refinement on Standing:* Distinguish between standing to *punish* vs. standing to *morally blame*. Criminal law is punishment, but it carries moral stigma. That's the tension.

  9.  **Final Polish:** Ensure the voice sounds like a seasoned academic—slightly cynical, precise, avoiding jargon where plain words work, but using jargon where necessary for precision. (e.g., "normative authority," "ad hominem," "jurisdictional vs. moral").

  *(Self-Correction during drafting the response)*: Make sure I explicitly answer the "underdetermined" part. The practice doesn't force us to believe the State is morally perfect; it forces us to believe the State's *authority* is independent of its morality. That's a Positivist commitment, not necessarily a moral one.

  10. **Final Review against constraints:**
      *   Act as philosopher of law? Yes.
      *   Brainstorm menu first? Yes.
      *   Reconstruct implicit theory? Yes.
      *   Sort rival accounts (ruled out vs. compatible)? Yes.
      *   Concrete changes for "clean hands"? Yes.

