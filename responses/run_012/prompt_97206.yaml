answer: |-
  Pull up a chair. You've put your finger on the raw nerve of punitive theory. I've spent decades staring at this asymmetry, and it never stops itching. It's the dirty secret of the courtroom: we demand moral transparency from the accused while granting the accuser a veil of institutional invisibility.

  Let's do this properly. We need to clear the deck, look at the menu of philosophical options, and then see which meal the criminal justice system is actually eating.

  ### I. The Menu: Candidate Theories of Standing to Blame

  Before we reconstruct the law's implicit theory, we need to know what *could* be on the table. In the philosophy of blame, standing generally hinges on why *you* specifically have the right to call *me* out.

  1.  **The Moral Integrity (Hypocrisy) View:** You lack standing to blame if you are guilty of the same (or sufficiently related) wrongdoing. Your own vice negates your authority to censure mine. Blame is a moral transaction; hypocrites default on the debt.
  2.  **The Relationship (Community) View:** Standing depends on our normative relationship. A stranger might lack standing to blame me for a family betrayal, but my brother has it. It's about membership in a shared moral community and the expectations therein.
  3.  **The Institutional (Office) View:** Standing derives from a role, not personal virtue. A referee can call a foul even if they play dirty off the field. The authority is vested in the *position*, not the *person*.
  4.  **The Forfeiture View:** By violating the norms of the community, the wrongdoer forfeits the right to demand moral consistency from others. You broke the truce; you don't get to inspect the other side's weapons.
  5.  **The Functionalist (Consequentialist) View:** Standing is a tool for social regulation. We assign standing to whoever can most efficiently reduce harm. Moral consistency is irrelevant; efficacy is king.

  ### II. Reconstructing the Implicit Theory of Criminal Law

  Now, look at the practice you described.
  *   **Defendant:** Their past convictions are admissible (under rules like FRE 609) to impeach credibility. Their moral record is probative of their current truthfulness and, by extension, their culpability.
  *   **State:** The prosecutor's office, the police department, or the state itself can have a history of brutality, corruption, or systemic racism. Legally, this is almost never treated as a defeater for their standing to punish.

  What theory does this presuppose?

  It presupposes a hybrid of the **Institutional View** and the **Forfeiture View**, undergirded by a thick layer of **Legal Positivism**.

  Here is the reconstruction: The law treats the State not as a moral agent participating in a peer-to-peer dialogue, but as the *embodiment of the normative framework itself*. When a prosecutor speaks, they are not speaking as "Jane Doe, who maybe cheated on her taxes." They are speaking as *The People* or *The Crown*.

  The asymmetry exists because the law conceptualizes the defendant as a **moral agent** and the state as a **jurisdictional authority**.
  *   The defendant's record matters because it speaks to their *character*, and character is relevant to whether they violated the moral norms encoded in law.
  *   The state's record does not matter because its authority is *jurisdictional*, not *moral*. Its right to punish comes from the validity of the statute and the sovereignty of the territory, not from the virtue of its enforcers.

  This is crucial: The practice assumes that **standing to punish is distinct from standing to morally resent.** The state isn't saying, "We are morally superior to you." It is saying, "We are the designated enforcers of the rules you broke."

  ### III. Ruling Out vs. Underdetermined

  This is where it gets interesting. Does this practice prove one theory is true? No. It tells us which theories the system *cannot tolerate* and which it simply ignores.

  **1. Ruled Out: The Strong Moral Integrity View (for the State)**
  The current practice is incompatible with the idea that the blamer must be morally clean to blame. If the Strong Integrity View were the operating theory, a police department with a history of unlawful seizures would lack standing to prosecute possession cases. A state with a history of extrajudicial killing would lack standing to prosecute murder. Since the law allows these prosecutions, it explicitly rejects the idea that state hypocrisy defeats standing.

  **2. Compatible: The Institutional/Office View**
  This is the best fit. The prosecutor is like the referee. It doesn't matter if the referee beat his wife last night; if he is certified by the league, his call stands. The law treats the "State" as a fictional persona that is immune to the moral failings of the flesh-and-blood humans running it.

  **3. Compatible: The Forfeiture View**
  This explains the defendant's side. By breaking the law, the defendant steps outside the protection of the "clean hands" doctrine. They forfeit the right to demand that the state be pure. They are in no position to preach.

  **4. Underdetermined: The Relationship View**
  Here is the ambiguity. The practice *could* be consistent with a Relationship View, but only a hierarchical one. If the relationship between Citizen and State is like Child and Parent, the Parent can punish the Child even if the Parent is a sinner. The Parent's authority comes from the role, not their virtue. However, if the Relationship View is understood as a relationship of *equals* (citizens in a democracy), the practice is in tension with the theory. The law hasn't decided if we are subjects or partners.

  **5. Underdetermined: Functionalism**
  A Functionalist could endorse the current asymmetry simply because allowing defendants to litigate the state's moral record would grind the courts to a halt. The practice is consistent with Functionalism, but it doesn't *prove* it. The practice is also consistent with a Deontological view of Sovereignty. The outcome is the same; the justification is underdetermined.

  ### IV. The "Clean Hands" Counterfactual

  Now, the hard part. You ask what would happen if we took the "Clean Hands" (Hypocrisy) view seriously and applied it to the State. If we said, "The State lacks standing to punish crimes it is itself complicit in or structurally prone to," the architecture of criminal justice wouldn't just crack; it would have to be demolished and rebuilt.

  Here is the concrete docket of changes:

  **1. Recusal on a Systemic Scale**
  Currently, a judge recuses themselves if they have a personal conflict. Under a Clean Hands doctrine, **jurisdictions** would recuse themselves. If a police precinct has a verified pattern of planting evidence (a "dirty" record regarding truthfulness), that precinct's cases would be dismissed *en masse* for lack of standing. The State would be impeached like a witness.

  **2. The "Moral Discovery" Phase**
  Pre-trial discovery would expand exponentially. Defense counsel wouldn't just subpoena police reports; they would subpoena the moral history of the prosecutor's office. *How many bail recommendations did you make that kept poor people in jail unnecessarily? How many plea deals were coerced?* If the state's "record" shows a pattern of violating the very norms it is enforcing, the charges are dropped. Not because the defendant is innocent, but because the *blamer* is silenced.

  **3. Statutes of Limitations on State Virtue**
  We would need a metric for "cleanliness." Does the state's sin expire? If the state tortured people in 1970, can it punish murder in 2024? We would need a legal theory of **State Repentance**. The state would need a mechanism to publicly atone for past injustices to "reset" its standing to blame. Punishment would be contingent on the state's own moral maintenance.

  **4. Shift from Retribution to Remediation**
  If the state is often "dirty" (and historically, they are), they would constantly lack standing to punish. To avoid total paralysis, the system would have to shift from *punishment* (which requires high standing) to *public safety management* (which is functionalist). We would see a move toward civil confinement or restorative justice models where the state acts as a mediator rather than a moral avenger. You can mediate a dispute even if you're a sinner; you cannot righteously punish if you are.

  **5. The End of "The People"**
  Prosecutors currently charge crimes in the name of "The People." A Clean Hands doctrine shatters this fiction. It forces us to admit that "The People" is a mask worn by specific officials with specific histories. We would likely move toward private prosecution models or community-based enforcement, where standing is localized to those actually harmed, rather than monopolized by a state that claims to represent everyone while harming many.

  ### The Philosophical Bottom Line

  The asymmetry you noticed isn't an accident; it's a load-bearing wall. It holds up the idea that Law is separate from Morality.

  If we remove that wall—if we insist the State must have clean hands to blame—we admit that **law is just morality with teeth.** And if law is morality with teeth, then the State must be a moral agent. And if the State is a moral agent, it is guilty as hell.

  The current system survives only because it refuses to look in the mirror. If we force it to look, the trial stops. Not because the defendant is innocent, but because the judge is complicit. And that is a thought the gavel is not designed to strike.
