      *   **Section 2: The Politics Analogy.** Address the "one reasoner vs. many" issue. Distinguish between *making* the state (the citizens) and *knowing* the state (the philosopher). The philosopher knows it because he understands the logic of the construction, even if he didn't sign the contract.
