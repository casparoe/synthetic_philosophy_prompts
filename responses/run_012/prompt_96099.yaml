  1.
  **A:** Consider the spectroscopist. She doesn't hold the belief "this machine is calibrated"; she operates within the certainty. To doubt it is not to risk error, but to cease doing spectroscopy.
  **B:** But she articulates it as a fact. When she writes the paper, she asserts the calibration holds. If it were merely a way of acting, like gripping the racket, it wouldn't appear in the propositional content of her findings.

  2.
  **A:** It appears there because grammar misleads us. Ask her for justification. She gives the certificate, then the standard, then nothing. The request for a reason runs out. That's the mark of a hinge, not a belief.
  **B:** It runs out only because the evidence is overwhelming. But these certainties have been false before. When the standard shifts, she accepts the new calibration. If reasons truly ran out, she couldn't accept new ones.

  3.
  **B:** So when the NIST reveals the systematic error, what happens? The scientist says, "I was mistaken." You can't be "wrong" about a way of acting. You can only act differently. The admission of error proves it was a truth-claim all along.
  **A:** She admits error within the new system, not the old. Within the old hinge, the certainty was not a claim to be true or false, but a condition for truth-telling. When the condition fails, we don't say the condition was false; we say it no longer holds.

  4.
  **A:** But if it "no longer holds" based on new evidence, then evidence was weighing it all along. You've quietly turned the certainty into an ordinary empirical belief, exempt only by convention. You've lost the asymmetry Wittgenstein insisted on.
  **B:** The asymmetry is pragmatic, not logical. It answers to evidence, but only at the margins. This captures the stability *and* the revisability. Your view captures the stability but makes the revisability inexplicable.

  5.
  **A:** Inexplicable only if you demand propositional content for every shift. But if it's empirical, then skeptical doubt is always meaningful, just impractical. Wittgenstein says the doubt itself lacks sense. You're reducing a grammatical limit to a pragmatic caution.
  **B:** And if the doubt lacks sense now but makes sense later when the standard shifts, then the sense was always there, dormant. You can't have it both ways. You're reifying a temporary exemption into a structural feature of the mind.
