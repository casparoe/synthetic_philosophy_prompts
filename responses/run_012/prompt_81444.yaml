answer: |-
  1. The primary explanatory task is to account for how ordinary moral restraints were suspended. Authority structures and group cohesion removed the psychological cost of killing, making compliance the path of least resistance.
  That explains how the brake was cut, but not why the car drove toward this specific cliff. Removing restraint permits violence, but it does not dictate that the violence must be exterminatory rather than merely coercive or neglectful.

  2. You assume the situation is ambiguous, but the command structure was objective. If the situation is defined by the orders and the risk of refusal, then the variance in behavior is noise, not evidence of a competing cause.
  If the situation is objective, identical inputs should yield identical outputs. Since they don't, you must be relying on how the agents construed those orders. But that construal is shaped by the very cultural predispositions you claim are explanatorily idle.

  3. The men who refused demonstrate that coercion was not absolute, yet they remained a small minority within the same unit. Their refusal doesn't require superior virtue, only a higher tolerance for social friction, which is itself a situational variable.
  If the situation were the dominant variable, the rate of refusal should correlate with the severity of the sanction, not individual disposition. By treating the refusers as merely less sensitive to pressure, you ignore that they interpreted the moral landscape differently than their comrades.

  4. Culture is an abstraction that cannot act; only individuals do. When individuals within the same cultural sphere diverge, attributing the action to culture merely relocates the mystery from the agent to a vague collective entity.
  Culture does not act, but it weights the probabilities of action. It explains why the divergence skews so massively toward participation rather than refusal, providing the content that makes the situation intelligible to the actor.

  5. Weighting probabilities is useless if the structure is the prerequisite. I would abandon my view if killing occurred without institutional scaffolding, yet I find the violence collapses when the command structure is removed.
  Structure is useless if the will is absent. I would abandon my view if killing occurred without perceived culpability of the victim, yet I find the violence requires the target to be categorized as an enemy. We observe the same regularities but disagree on which variable is doing the work.
