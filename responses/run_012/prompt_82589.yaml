answer: |-
  The claim that Malthus was merely 'right but early' constitutes a degenerating problem-shift that renders the hard core immune to falsification rather than a progressive refinement of scientific content. To map this onto Lakatos, we must first isolate the Malthusian hard core: the postulate that population growth geometrically outstrips arithmetic subsistence growth due to diminishing returns on fixed factors, inevitably triggering positive checks on welfare. The protective belt contains the auxiliary hypotheses required to operationalize this core for testing: that specific commodities like grain or metals proxy for subsistence limits, that market prices accurately reflect ecological scarcity, and that the relevant timeframe for binding constraints is observable within a human generation. The 1980 Ehrlich-Simon wager was a decisive test of these auxiliaries, not the core itself. Ehrlich accepted the Neo-Malthusian belt adjustment that industrial metals represent the critical fixed factor and that spot prices measure depletion. Simon's victory falsified the auxiliary hypothesis that population growth drives commodity prices upward in the short-to-medium term, demonstrating that human ingenuity and substitution can decouple population size from resource costs.

  The Neo-Malthusian response to this loss reveals the degenerating shift. Admitting defeat on prices but maintaining the core requires revising the belt to claim that prices are imperfect signals, that externalities are unpriced, or that the decade was an anomalous window. In Lakatosian terms, a revision is progressive only if it predicts novel facts; merely explaining away the anomaly without new predictive power is ad hoc. The claim that the window was 'unlucky' because prices rose from 1950 to 1975 is a classic example of saving the phenomena by cherry-picking data ranges post-failure. Similarly, shifting the verification date from 1990 to 2050 reduces empirical content because it excludes no current state of affairs. This is where the 'right but early' defense transforms from a legitimate temporal adjustment into an immunizing stratagem. If the hard core predicts collapse 'eventually,' and 'eventually' is undefined, the theory becomes compatible with any finite period of prosperity. This is not a progressive problem-shift but a retreat into metaphysics, where the core is protected from refutation by construction rather than by theoretical strength.

  Here the lens turns back on Lakatos, exposing a structural vulnerability in his methodology. Lakatos admits that distinguishing between a progressive and degenerating programme is often only possible retrospectively; we must wait to see if the programme produces novel facts. However, if a programme's characteristic predictions are indexed to an unspecified future, the methodology has no principled way to distinguish one that is 'early' from one that is dead in the present tense. A degenerating shift can mimic a progressive long-term programme indefinitely by constantly extending the horizon of verification. In this specific instance, a Popperian framework offers a sharper demarcation: by making the auxiliary assumptions explicit, Popper would classify the 'right but early' claim as unscientific because it is not falsifiable within any specified timeframe. Lakatos's tolerance for research programmes allows the Malthusian core to survive despite a belt that requires constant, content-reducing adjustment to accommodate reality. The Ehrlich-Simon episode demonstrates that when a theory relies on indefinite deferral, the Lakatosian verdict can only ever be delivered in retrospect, leaving the scientific community without a tool to adjudicate the claim in real time. The specific feature this episode exposes is the methodology's inability to distinguish between a long-term progressive prediction and a metaphysical tautology when the verification horizon is indefinitely deferred.
