  Do not strip the last veil of **illusion**.
  For happiness requires a burning **passion**.
  Though I have given life to math and **study**,
  And trusted only what could hold to **reason**,
  We are not spirits detached from the **self**,
  But creatures bound by flesh and by **time**.

  How quickly **time** consumes the bright occasion!
  We need the soft deceit of **illusion**
  To keep the mirror kind to the **self**.
  Without some great desire, some **passion**,
  The cold light of **reason** leaves us frozen.
  Yet where else to flee but into **study**?

  In **study**, truths accumulate like dust,
  And steal the hours from our fleeting **time**.
  They satisfy the hunger of **reason**,
  But break the painted glass of **illusion**.
  Can knowledge warm the blood like **passion**?
  Or does it leave the **self** alone and naked?

  I built a world at Cirey for the **self**,
  Where Newton spoke alongside love and **study**.
  There fire was tended, not just wild **passion**,
  We measured gravity and wasted **time**.
  We knew the stage was set by **illusion**,
  Yet chose to play the part despite **reason**.

  Do not let **reason** become a tyrant.
  Protect the tender vanity of **self**.
  Embrace the gentle lie, the **illusion**,
  When calculation fails, return to **study**.
  It is the one sure clock that stops **time**,
  The only fire that survives **passion**.

  For when the fire cools and forgets **passion**,
  And rigor sharpens into cold **reason**,
  You will bargain with relentless **time**.
  What remains to comfort the **self**?
  Not answers, but the shelter of **study**,
  And the final mercy of **illusion**.

  Choose **passion** if you dare to wound the **self**,
  Or seek **reason** within the quiet **study**;
  Time knows the kindness kept in **illusion**.
