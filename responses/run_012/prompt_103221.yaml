answer: |-
  Your friend's position aligns with a philosophical view known as reliabilism, which suggests that a belief is justified if it is produced by a reliable cognitive process, regardless of whether we can prove that process works without using it. In everyday life, she is correct: we must trust our memory to function, and a track record of successful checks provides reasonable warrant for confidence. However, your objection touches on the problem of epistemic circularity, famously discussed by William Alston. You are technically correct that one cannot validate memory without presupposing memory, but this circularity is usually considered 'virtuous' or unavoidable rather than vicious; it does not render memory useless, only unprovable to a radical sceptic.

  Where your friend's reasoning becomes fragile is in the induction from general reliability to this specific instance. Her track record likely comprises mundane memories verified against static records (diaries) or cooperative accounts. Emotional memories, particularly those involving perceived cruelty, are subject to different psychological mechanisms; high arousal can cement the emotional gist of an event while distorting specific details or even fabricating the occurrence entirely. Therefore, a general record of accuracy does not fully license trust in a high-stakes, emotionally charged recollection from years ago. The circularity matters here not because it invalidates memory generally, but because it prevents the level of certainty required to justify a confrontation that could damage a relationship.

  Regarding evidence, nothing can settle the question with absolute metaphysical certainty, given that interpreting any evidence requires memory. However, the strongest possible corroboration would be independent contemporaneous records that she did not rely upon to form the memory. For example, discovering an email or text message from that time spontaneously, without recalling its content beforehand, or a diary entry written by a third party present at the scene. If the only evidence is her recollection versus her relative's denial, the question cannot be settled objectively.

  Consequently, she should not treat the memory as an established fact for the purpose of accusation. Instead, she should categorise it as a subjective experience that holds truth for her regardless of its objective accuracy. If she chooses to speak to her relative, she must frame it as discussing the impact of her memory rather than prosecuting a historical crime, acknowledging the possibility of error without undermining her own feelings.

  Verdict: Your reasoning regarding the limits of verification holds up better in this context, so she should seek independent contemporaneous evidence before confronting her relative.
