answer: |-
  # Exercise: Iterated Elimination and Dominance

  **Game A.** Row strategies T, M, B; Column strategies L, C, R.

  | | L | C | R |
  | :--- | :---: | :---: | :---: |
  | **T** | (3, 0) | (0, 3) | (3, 0) |
  | **M** | (0, 3) | (3, 0) | (0, 0) |
  | **B** | (1, 1) | (1, 1) | (1, 3) |

  **Game B.** Row strategies X, Y; Column strategies L, C, R.

  | | L | C | R |
  | :--- | :---: | :---: | :---: |
  | **X** | (1, 0) | (1, 1) | (1, 0) |
  | **Y** | (0, 0) | (1, 1) | (1, 1) |

  1.  Using Game A, identify every strategy that is strictly dominated by a pure strategy, then identify every strategy that is strictly dominated once mixed strategies are permitted, exhibiting the dominating mixture explicitly in each case. Carry iterated elimination of strictly dominated strategies through to its conclusion and state the surviving set of strategy profiles. (7 marks)
  2.  Explain, at a level a first-course student can follow, why the order in which strictly dominated strategies are removed cannot affect the surviving set, and why the same guarantee fails once "strictly" is replaced by "weakly." (4 marks)
  3.  Using Game B, exhibit two different orders of iterated elimination of weakly dominated strategies that terminate in different surviving sets, and explain which feature of the game is responsible for the discrepancy. (5 marks)
  4.  Briefly: what is the relationship between a strategy's being strictly dominated and its never being a best response to any belief about the other players? Why is the clean equivalence available in two-player games lost once there are three or more players? Keep this part self-contained; the answer should explain the idea in its own terms rather than gesture at a named theorem. (4 marks)

  ***

  # Model Answer

  **1. Game A: Iterated Elimination of Strictly Dominated Strategies (IESDS)**
  First, we check for pure strategy dominance. Comparing rows T, M, and B, no row strictly dominates another (e.g., T beats B on L and R, but B beats T on C). Similarly, no column strictly dominates another. Thus, no strategies are eliminated by pure dominance.

  Next, we check for mixed strategy dominance. Consider Row strategy B with payoffs $(1, 1, 1)$. Consider a mixed strategy $\sigma_R$ playing T with probability $0.5$ and M with probability $0.5$.
  Against L: $0.5(3) + 0.5(0) = 1.5 > 1$.
  Against C: $0.5(0) + 0.5(3) = 1.5 > 1$.
  Against R: $0.5(3) + 0.5(0) = 1.5 > 1$.
  Since $1.5 > 1$ in all cases, B is strictly dominated by $\sigma_R = (0.5, 0.5, 0)$. We eliminate B.

  In the reduced game (Rows T, M; Cols L, C, R), Column R yields payoffs $(0, 0)$ against T and M. Consider a mixed column strategy $\sigma_C$ playing L with probability $0.5$ and C with probability $0.5$.
  Against T: $0.5(0) + 0.5(3) = 1.5 > 0$.
  Against M: $0.5(3) + 0.5(0) = 1.5 > 0$.
  R is strictly dominated by $\sigma_C = (0.5, 0.5, 0)$. We eliminate R.

  In the remaining $2 \times 2$ game ({T, M} $\times$ {L, C}), no further strict dominance exists (T beats M on L, M beats T on C). The surviving set of strategy profiles is $\{(T, L), (T, C), (M, L), (M, C)\}$.

  **2. Order Independence: Strict vs. Weak**
  Strict dominance implies a strategy is inferior regardless of what the opponent does. If strategy $s$ is strictly dominated by $s'$, removing a third strategy $z$ cannot make $s$ superior to $s'$, because the inequality $u(s') > u(s)$ held for *all* opponent profiles, including those involving $z$. Thus, the set of strictly dominated strategies is invariant to the removal order.

  Weak dominance relies on inequalities $u(s') \ge u(s)$ that are strict in at least one case. Removing a strategy might remove the specific case where the inequality was strict, leaving only equalities. Consequently, a strategy that was weakly dominated might cease to be dominated after a reduction, making the final set dependent on the elimination order.

  **3. Game B: Order Dependence in Weak Elimination**
  *Order 1:* Row Y is weakly dominated by X ($1 \ge 0, 1 \ge 1, 1 \ge 1$). Eliminate Y. Remaining Row X faces L(0), C(1), R(0). C weakly dominates L and R. Eliminate L, R. Surviving set: $\{(X, C)\}$.
  *Order 2:* Column L is weakly dominated by C ($0 \le 1, 0 \le 1$). Eliminate L. Remaining Cols C, R. Row X(1, 1), Y(1, 1). No row dominance. Col C weakly dominates R ($1 \ge 0, 1 \ge 1$). Eliminate R. Remaining Col C. Row X(1), Y(1). Neither dominates. Surviving set: $\{(X, C), (Y, C)\}$.

  The discrepancy arises from **payoff equalities** (indifference). In Order 2, eliminating L removed the column where X strictly beat Y, leaving them indifferent and preventing Y's elimination.

  **4. Strict Dominance vs. Never a Best Response**
  A strictly dominated strategy is never a best response to any belief. In two-player games, the converse holds: if a strategy is never a best response, it is strictly dominated (possibly by a mixed strategy). This equivalence relies on the fact that a player's belief about a single opponent is simply a probability distribution over that opponent's strategies.

  In games with three or more players, this equivalence breaks. A "belief" is a distribution over *profiles* of opponents' strategies, allowing for correlation between opponents. However, strict dominance is defined against independent mixed strategies (product distributions). A strategy might not be strictly dominated (because it is a best response to some *correlated* belief) yet never be a best response to any *independent* belief. The set of independent beliefs is a subset of all possible beliefs, creating a gap where a strategy is undominated but rationally unplayable.

  ***

  # Marking Scheme (Total 20 Marks)

  **Part 1 (7 marks)**
  *   **2 marks:** Correctly states no pure strategies are initially strictly dominated.
  *   **2 marks:** Identifies B is dominated by mixed strategy (0.5T, 0.5M) and shows the algebra ($1.5 > 1$).
  *   **2 marks:** Identifies R is dominated by mixed strategy (0.5L, 0.5C) *after* B is removed and shows algebra.
  *   **1 mark:** Correctly states final surviving set $\{(T, L), (T, C), (M, L), (M, C)\}$.
  *   *Common Pitfall:* Claiming B is dominated by a pure strategy, or failing to re-evaluate Column dominance after removing Row B.

  **Part 2 (4 marks)**
  *   **2 marks:** Explains strict dominance inequalities hold across *all* profiles, so removing profiles cannot reverse the inequality.
  *   **2 marks:** Explains weak dominance relies on at least one strict inequality; removing that specific profile leaves only equality, potentially halting elimination.
  *   *Common Pitfall:* Vague appeals to "math properties" without referencing the preservation of inequalities or the role of the specific profile removed.

  **Part 3 (5 marks)**
  *   **2 marks:** Correctly derives Surviving Set 1 (e.g., {(X, C)}).
  *   **2 marks:** Correctly derives Surviving Set 2 (e.g., {(X, C), (Y, C)}).
  *   **1 mark:** Identifies "indifference" or "payoff equality" as the responsible feature.
  *   *Common Pitfall:* Showing two orders that result in the same set, or failing to check for remaining dominance in the final step of Order 2.

  **Part 4 (4 marks)**
  *   **2 marks:** States the relationship: Strictly Dominated $\implies$ Never BR. Converse holds for 2-player, fails for 3+.
  *   **2 marks:** Explains the 3+ player failure via correlation: Beliefs allow correlation, dominance assumes independence.
  *   *Common Pitfall:* Stating the equivalence holds for all games, or confusing "correlation" with "communication."
