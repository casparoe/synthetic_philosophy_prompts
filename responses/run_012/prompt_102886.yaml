  In the symmetric case: two natural ways of applying indifference (two different choices of what to treat as equally likely, i.e. two parameterizations) should both look live at first, but the symmetry should pick out exactly one of them as the right one, so the case has a determinate answer.

  In the asymmetric case: the same two parameterizations should give different numbers, and now nothing breaks the tie, so indifference just falls over.

