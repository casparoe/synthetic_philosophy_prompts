prompt: |-
  I'm a third-year student and I'm taking a module on social choice theory that's cross-listed with the philosophy department, which is honestly the only reason I'm in it. We did bargaining problems a few weeks back and I think I followed Nash okay — the one where you take the feasible set of utility pairs, subtract the disagreement point, and pick whatever maximises the product of the two gains. But the next lecture was on the Kalai–Smorodinsky solution and it's the one I keep chewing on. The way our lecturer put it: forget the product, just draw a straight line from the disagreement point up to the utopia point — the pair where each player gets the best payoff they could possibly get from any feasible agreement — and see where that line crosses the outer boundary of the feasible set. So you end up with the agreement where both people get the same proportion of the way from their fallback to their dream. And the reason it's meant to be interesting is that KS drops Nash's independence-of-irrelevant-alternatives axiom and replaces it with some monotonicity axiom, on the grounds that the whole set of options should matter, because otherwise the person whose best option has just come onto the table has no claim on anything.

  Anyway here's why I actually care, and why I'm asking you instead of just re-reading the notes. In six weeks my flatmate and I have to sign a new lease on our two-bed, and it is genuinely a bargaining problem in the formal sense: we have to settle two things at once, how we split the rent and who takes which bedroom (the big one has the window and a desk, the small one is basically a cupboard), and we have very different fallbacks — she could move in with her sister for cheap, whereas my only realistic option is going back into halls, which I'd rather not think about — and different best cases too. We've also both been weirdly cagey about what we actually want, which I'm starting to suspect is the whole game. So what I want from you is the most important implications of the Kalai–Smorodinsky solution for how we should actually run this negotiation, and for what I should be willing to call fair. Not a restatement of the axioms — implications that would change what I say or withhold: what the rule rewards and punishes, whether it's manipulable and by which of us and how, what it assumes about our preferences that's probably just false for two people splitting a flat (I have a suspicion the whole thing needs cardinal utilities rather than a mere ranking, which we definately don't have), and how it would actually differ in practice from just splitting the difference down the middle or from Nash. And please flag which of those implications are overrated or don't survive contact with a messy case like ours, and which one or two are the ones that really matter. Oh and one more constraint that might matter for your answer: we can't do the obvious escape hatch of one of us paying the other off over a longer horizon, because the lease is twelve months and after that we're both probably moving cities, so this is basically a one-shot.
