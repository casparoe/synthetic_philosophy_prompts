answer: |-
  This is a fantastic application of the theory. You've correctly identified the tension between the elegance of the axioms and the messiness of human psychology, specifically regarding cardinal utility. Since you're looking for actionable implications rather than a proof, I'm going to skip the formalism and focus on the strategic incentives KS creates in a one-shot, multi-issue negotiation like a lease.

  Here is the breakdown of what Kalai–Smorodinsky (KS) implies for your situation, what is overrated, and the one or two things that actually matter.

  ### 1. The Cardinality Problem (The "Contact with Reality" Failure)
  **The Implication:** KS requires interpersonal comparison of utility gains. It demands you know not just that you prefer the big room, but *how much* you prefer it in units comparable to your flatmate's preference for saving money.
  **The Reality:** You don't have this. Neither does she.
  **The Strategic Shift:** Because KS relies on the *Utopia Point* ($U$) and the *Disagreement Point* ($d$) to set the slope of the line, and because these points are unobservable, **the solution becomes entirely about narrative construction.**
  In Nash bargaining, the curvature of the Pareto frontier matters (which reflects risk aversion). In KS, only the corners matter. This means you don't need to convince her of your risk profile; you need to convince her of your **range**.
  *   **Action:** Do not reveal your true $d$ (Disagreement Point). You mentioned your fallback is halls (low utility) and hers is her sister's (high utility). In any bargaining model, a worse $d$ weakens you. However, in KS, your payoff is determined by $\frac{u - d}{U - d}$. If $d$ is low, your denominator ($U-d$) is huge. To get a decent absolute payoff $u$, you need to claim a massive $U$.
  *   **Takeaway:** You must exaggerate how much the "Best Case" (Big Room + Low Rent) means to you. If you act like the big room is a "nice to have," you shrink your $U$, which shrinks your claim on the surplus. You need to frame the big room as essential to your degree/sanity, inflating your $U$ to compensate for your weak $d$.

  ### 2. Monotonicity and "Irrelevant" Alternatives
  **The Implication:** KS satisfies *Individual Monotonicity*. If the feasible set expands in your favor (specifically, if your Utopia point $U_1$ increases while $U_2$ stays fixed), your payoff should not decrease. Nash (IIA) says if the new options aren't chosen, they don't matter. KS says they *do* matter because they shift the utopia line.
  **The Reality:** You can manipulate the outcome by introducing options you have no intention of taking, provided they improve your perceived $U$.
  **The Strategic Shift:** In a Nash framework, you focus on the efficient frontier (the realistic rent/room splits). In KS, you should spend energy establishing "unrealistic" best cases.
  *   **Action:** Keep your "dream scenario" on the table explicitly, even if it's unlikely. "Ideally, I'd take the big room at 40% rent because I'll be studying 12 hours a day." Even if she rejects this immediately, it anchors your $U_1$. If you concede too early to "realistic" options, you lower your $U_1$, rotating the KS line against you.
  *   **Warning:** This is manipulable. She can do it too. If she claims her sister's house is actually miserable (lowering her $d_2$) or that she could easily rent a penthouse elsewhere (raising her $U_2$), she shifts the line. Since you can't verify these, **credibility** is the currency. Specific details make lies harder to spot but easier to debunk. Vague threats are better for $d$ ("I have other options"), specific dreams are better for $U$ ("I need the desk for my thesis").

  ### 3. Equal Proportional Gain vs. Equal Utility
  **The Implication:** KS aims for $\frac{u_1 - d_1}{U_1 - d_1} = \frac{u_2 - d_2}{U_2 - d_2}$. It seeks fairness as "equal sacrifice relative to potential," not "equal money."
  **The Reality:** "Splitting the difference" (50/50 rent) is almost certainly inefficient and unfair under KS.
  **The Strategic Shift:** If you value the room more than she does (higher $U$ gain from the room), KS dictates you should pay *more* of the rent, but get the room, such that your *satisfaction percentage* is equal.
  *   **Action:** Do not anchor on "£500 each." Anchor on "Who values the room more?" If you can credibly signal that the big room gives you 90% of your total happiness ($U$), and for her it's only 50%, KS justifies you taking the big room and paying a disproportionate share of the rent, *provided* you are still getting the same % of your maximum possible gain.
  *   **The Trap:** Since you have a worse $d$ (halls), you are more desperate. Desperation lowers your ability to hold out for that proportional gain. You might end up with a low $u_1$ simply because you can't afford to walk away. KS doesn't fix power asymmetries; it just allocates the surplus based on ranges. **Your weak BATNA is your biggest vulnerability, not the solution concept.**

  ### 4. What is Overrated (and what isn't)
  **Overrated: The Mathematical Precision.**
  You cannot calculate the KS solution. You don't have the utility functions. Treating this like a math problem where you can find the intersection point is a fool's errand. It will lead to analysis paralysis.

  **Overrated: The "Fairness" Axiom.**
  The philosophical claim that equal proportional gain is "fairer" than Nash's product maximization is irrelevant to your flatmate. She cares about her rent bill, not monotonicity axioms. Using KS as a moral argument ("It's only fair we split the gains proportionally!") will sound like game-theoretic posturing and might backfire.

  **What Actually Matters: The Utopia Anchor.**
  The single most important implication of KS for your negotiation is that **aspirations determine allocation.** In Nash, the solution is driven by the *margin* (how much utility I lose if we move away from the optimum). In KS, the solution is driven by the *range* (how good could it possibly be?).
  *   **Why it matters:** In a one-shot game with no side payments, the person who successfully convinces the other that they have the *most to lose* (relative to their best case) often captures the surplus.
  *   **Your Move:** Since your $d$ is weak, you cannot fight on "I can walk away." You must fight on "This specific outcome is uniquely valuable to me." You need to make the big room seem like a *need* (high $U$) rather than a *want*.

  ### 5. Practical Protocol for the Negotiation
  Given the constraints (one-shot, no side payments, hidden preferences), here is how you run this using KS intuition without getting bogged down in the math:

  1.  **Separate the Issues (Initially):** Don't negotiate Rent + Room as a single bundle immediately. Establish the value of the Room first. This helps define the $U$ points. If you bundle them too early, you obscure the utility ranges.
  2.  **Inflate Your $U$, Hide Your $d$:**
      *   **$U$:** Be specific about why the big room is your "Utopia." (Light for art? Desk for thesis? Sanity?). Make the gain from getting it seem massive.
      *   **$d$:** Be vague about halls. "I have a few options in the city" is better than "I'm going back to halls." Do not let her know your $d$ is low. If she knows your $d$ is low, she knows your ($U-d$) range is huge, but she also knows you are desperate, which gives her leverage to push you down to near-$d$.
  3.  **Reframe "Fairness":** If she suggests 50/50 rent, do not accept. Suggest that rent should be split based on *value gained*, not cost. "If I take the big room, I'm getting more value, so I should pay more, but we need to make sure we're both equally happy with our deal compared to our other options." This is the KS pitch in plain English.
  4.  **Watch for Her Monotonicity Play:** If she suddenly mentions she could rent a whole flat elsewhere for cheap (raising her $U$ or lowering her $d$), challenge it. "That's great, but we are negotiating *this* flat." KS says the feasible set matters. Try to keep the negotiation bounded to the current feasible set so her external utopia points don't skew the line.

  ### Summary: The One Thing That Matters
  The Nash solution rewards **risk aversion** (the more curved your utility function, the more you concede). The Kalai–Smorodinsky solution rewards **ambition** (the higher your claimed Utopia point, the more you get).

  Since you are in a one-shot game with a weak BATNA, you cannot afford to be risk-averse (Nash weakness). You must adopt the KS strategy: **Aggressively anchor your best-case scenario.**

  **The Verdict:**
  Don't try to calculate the intersection. Instead, use the KS logic to justify why you should get the big room *even if you pay more for it*, based on the argument that you derive more *proportional utility* from it. But be warned: KS assumes honest revelation of the Utopia point. Since you are both being cagey, the negotiation will likely devolve into a contest of who can bluff their $U$ point more convincingly.

  **Your winning move:** Convince her that for you, the Big Room is 90% of the value of the flat, whereas for her, it's only 60%. If you establish that ratio, KS dictates you get the room, and the rent adjusts to equalize the satisfaction percentages. If you let her think you're indifferent, you lose the room or pay full price for it.

  *Final caveat:* If she knows game theory too, she knows you're trying to inflate your $U$. The only counter is credibility. Tie your utility to something observable (e.g., "I have a large easel that only fits in the big room"). Hard constraints are the only way to make a Utopia point credible in a one-shot game.
