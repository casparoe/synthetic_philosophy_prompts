prompt: |-
  I am a doctoral candidate in political theory with a secondary interest in the governance of emerging technologies, and what I want from you is an argument rather than a survey.

  The term "singleton," as introduced by Nick Bostrom, names a world order in which a single decision-making agency operates at the highest level, able to exert effective control across its domain and to prevent both internal and external challenges to that control. The notion is deliberately abstract: a singleton might be a world government, a dominant artificial intelligence, a global legal order with genuine enforcement capacity, or something with no human analogue. I am not asking whether a singleton is likely. I am asking what our existing political arrangements already assume about whether one would be good.

  Here is the pattern that puzzles me. Within a state, we treat the concentration of coercive power as an achievement rather than a threat. A government that successfully claims a monopoly on legitimate force is, on the ordinary view, the precondition of peace, contract, and justice; private armies and rival militias are a pathology, and the fragmentation of coercive authority — warlordism — is among the worst political conditions we can imagine. Across states, we aim at the opposite. Great-power diplomacy, alliance formation, nonproliferation policy, and the resistance to any international body with independent enforcement capacity are all oriented toward ensuring that no single agency acquires that same monopoly. A world government with teeth is treated as a nightmare by nearly everyone, and a balance of power is treated as the second-best good. So the same tradition that regards a domestic singleton as the foundation of order organizes itself internationally against a global one.

  I would like you to reconstruct the theory of the singleton that this asymmetry presupposes. Concretely: does the pattern commit us to the view that singletons are good when legitimate and bad when not, or to a view about scale, or to a distinction between a singleton over persons and a singleton over states, or to something else? Which rival positions does it quietly rule out — does it exclude the claim that a singleton is intrinsically valuable, the claim that it is intrinsically dangerous, or neither? Is the asymmetry a genuine inconsistency, or does it dissolve once we notice that the domestic case concerns a plurality of persons who retain standing, exit options, and legal recourse, whereas the international case would place a single agency above states that have no appeal? And separate for me what the pattern strictly requires from what it merely fits comfortably with: it seems to me that several quite different theories could license both halves, and I want to know which of my questions the material actually settles and which it leaves open.

  Then tell me what would have to change if the presupposed view were replaced. If we took the domestic analogy seriously and regarded a global singleton as desirable for the same reasons we regard the domestic one as desirable, what in the current arrangement would have to be abandoned, and what would have to be invented? Conversely, if we took the anti-singleton stance all the way down, would it undercut the legitimacy of the state itself?

  Be direct about the limits of the reconstruction. If the puzzle rests on a confusion — if I am trading on two different senses of "control," or leaning on an analogy between persons and states that will not bear the weight, or if the two halves of the pattern are simply products of separate historical contingencies rather than expressions of one theory — say so plainly instead of constructing a reconciliation the material does not support. I would rather be told that my framing is defective than receive a tidy synthesis that papers over the problem.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Doctoral candidate in political theory, secondary interest in emerging tech governance.
      *   **Goal:** Wants an *argument*, not a survey. Needs a reconstruction of the theory presupposed by the asymmetry in how we treat "singletons" (monopoly on force) domestically vs. internationally.
      *   **Core Puzzle:** Domestically, a monopoly on force (Hobbesian sovereign) is good/order. Internationally, a monopoly on force (world government) is bad/tyranny; balance of power is preferred.
      *   **Specific Questions to Address:**
          *   What theory does this asymmetry presuppose? (Legitimacy? Scale? Persons vs. States?)
          *   What rival positions does it rule out? (Intrinsic value/danger?)
          *   Is it an inconsistency or does it dissolve upon closer inspection (standing, exit options)?
          *   Separate what the pattern *requires* vs. what it *fits comfortably with*.
          *   Counterfactuals: What changes if we take the domestic analogy seriously (pro-global singleton)? What if we take the anti-singleton stance all the way down (anarchism/libertarianism)?
          *   **Crucial Constraint:** Be direct about limits. If the framing is defective or rests on a confusion, say so. Do not paper over problems with a tidy synthesis.

  2.  **Deconstruct the Asymmetry (The "Hobbesian Paradox"):**
      *   *Domestic:* State of Nature $\rightarrow$ Social Contract $\rightarrow$ Sovereign (Singleton). Justification: Security, enforcement of rights, prevention of civil war.
      *   *International:* State of Nature (Anarchy) $\rightarrow$ Balance of Power/International Law (Weak). Justification: Prevention of tyranny, preservation of sovereignty/self-determination, check on abuse.
      *   *The Tension:* Why is the solution to the individual state of nature (Leviathan) the nightmare of the international state of nature?

  3.  **Reconstructing the Presupposed Theory:**
      *   *Is it Legitimacy?* Not quite. We assume states *can* be legitimate, but a world state *cannot* easily be. Why?
      *   *Is it Scale?* Plausible. Heterogeneity increases with scale, making consensus harder and coercion more visible as oppression.
      *   *Is it Persons vs. States?* This is the strongest candidate in traditional IR theory (Realism/Liberalism). States are not persons. Persons have moral standing; states are instrumental.
      *   *The "Exit Option" Argument:* Inside a state, citizens have voice (voting) and some exit (migration). Above a state, there is no exit.
      *   *The "Tyranny" Calculation:* Domestic tyranny is localizable and potentially overthrowable. Global tyranny is total and inescapable.
      *   *What does the pattern *require*?* It requires a disanalogy between individuals and states. It requires that the *risk* of tyranny scales faster than the *benefit* of order at the global level.
      *   *What does it *rule out*?* It rules out pure Hobbesian universalism (one logic for all). It rules out the idea that monopoly on force is intrinsically good or intrinsically bad. It implies a *contingent* valuation based on institutional safeguards.

  4.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the prompt. State the thesis: The asymmetry presupposes a *pluralist* theory of value where political units (states) have derivative but robust moral status, and it relies on a specific calculation regarding *tyranny risk* vs. *anarchy cost*. It is not a logical inconsistency, but it rests on a fragile empirical bet.

      *   **Section 1: The Presupposed Theory (The "Tyranny Risk" Calculus):**
          *   The pattern doesn't rest on "Legitimacy" alone (we doubt global legitimacy).
          *   It doesn't rest on "Scale" alone (EU exists).
          *   It rests on the *disanalogy between persons and states*.
          *   *Key Distinction:* Individuals are moral ends; States are instrumental means for collective self-determination.
          *   *The Logic:* Domestic singleton protects persons *from each other*. Global singleton protects states *from each other*, but threatens persons *from the singleton*.
          *   *What it rules out:* Intrinsic value of sovereignty (realism) AND intrinsic danger of monopoly (anarchism). It adopts a *contingent institutionalism*.

      *   **Section 2: Requirements vs. Comfort:**
          *   *Strictly Requires:* That the cost of global tyranny > cost of international anarchy. That states provide a necessary layer of mediation between the individual and ultimate power.
          *   *Fits Comfortably (but not required):* Cultural heterogeneity arguments, democratic deficit arguments. These support the conclusion but aren't the structural core.
          *   *The "Exit" Point:* This is crucial. Domestic exit is hard but possible. Global exit is impossible. This makes the global singleton uniquely dangerous.

      *   **Section 3: Counterfactuals (Changing the View):**
          *   *Scenario A: Pro-Global Singleton (Taking Domestic Analogy Seriously).*
              *   Abandon: Westphalian sovereignty, non-intervention norms, the UN Security Council veto structure.
              *   Invent: Global tax authority, global police, but crucially, *global democratic mechanisms* that mimic domestic voice. Without voice, the singleton is just empire.
          *   *Scenario B: Anti-Singleton All the Way Down (Libertarian/Anarchist).*
              *   Undermines the state. If monopoly on force is inherently tyrannical, the domestic Leviathan is illegitimate.
              *   Leads to polycentric law, private defense agencies.
              *   *Result:* The current asymmetry collapses into consistency, but at the cost of rejecting the modern state.

      *   **Section 4: Limits and Defects (The "Say So Plainly" Clause):**
          *   Is the framing defective?
          *   *Critique 1:* "Singleton" is a tech/futurist term applied to political theory. It conflates *capacity* with *authority*. A state has a monopoly on *legitimate* force, not necessarily *effective* force. A global singleton might lack legitimacy.
          *   *Critique 2:* The analogy between "State of Nature among Individuals" and "State of Nature among States" is the weak link. Individuals are vulnerable; States are armored. The *need* for a singleton is lower internationally because states are harder to kill than people.
          *   *Critique 3:* Historical Contingency. We accept domestic monopoly because we won the civil wars. We reject global monopoly because we fear hegemony. It might be path dependence, not theory.
          *   *Verdict:* The puzzle is real, but the "Singleton" label obscures the *legitimacy* condition. The asymmetry is rational *if* you assume global democracy is impossible. If you assume it's possible, the asymmetry looks like bias.

  5.  **Refining the Tone:**
      *   Academic, rigorous, direct.
      *   Avoid hedging.
      *   Engage with the "Doctoral Candidate" level (assume knowledge of Hobbes, Waltz, Rawls, Kant).
      *   Ensure the distinction between "what the pattern requires" and "what fits comfortably" is sharp.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the specific question about "Persons vs. States"? Yes, make that central.
      *   *Check:* Did I address "Intrinsic Value/Danger"? Yes, note that the pattern rejects both.
      *   *Check:* Did I address the "Exit/Recourse" point? Yes, this is the key dissolver of the inconsistency.
      *   *Check:* Is the critique of the framing strong enough? I need to make sure I don't just validate the user's premise if it's shaky. The "Singleton" term is Bostrom's (futurist), not classical political theory. I need to point out that classical theory talks about *Sovereignty*, not Singletons. The shift in terminology matters.

  7.  **Final Polish:** Organize into clear headings. Ensure the conclusion is decisive. (Proceed to generate output based on these thoughts.)
answer: |-
  This is a precise formulation of the central tension in modern political order, often glossed over in standard International Relations (IR) theory. You are asking for a reconstruction of the normative logic that sustains the asymmetry between the domestic acceptance of a monopoly on force (the Hobbesian sovereign) and the international rejection of one (the Westphalian system).

  Here is the argument regarding what that asymmetry presupposes, what it excludes, and where the framing itself may be defective.

  ### I. The Presupposed Theory: Instrumental Pluralism

  The pattern you identify does not commit us to the view that singletons are good when legitimate and bad when not, nor does it rest primarily on scale. It commits us to a specific theory of **Instrumental Pluralism**.

  This theory holds that:
  1.  **Individuals** are the primary units of moral concern.
  2.  **States** are secondary, instrumental units that derive value from their ability to secure individuals and facilitate collective self-determination.
  3.  **The Risk Function is Non-Linear:** The danger of a monopoly on force (tyranny) scales faster than the benefit of order (security) as the domain expands.

  **The Disanalogy of Persons and States**
  The asymmetry dissolves only if one accepts a hard disanalogy between persons and states.
  *   **Domestically:** The "state of nature" is a war of *individuals against individuals*. Individuals are physically vulnerable and cannot effectively defend their own rights. Therefore, a domestic singleton is a *protective* necessity. The threat of the sovereign is outweighed by the threat of the neighbor.
  *   **Internationally:** The "state of nature" is a war of *states against states*. States are armored entities; they are not as vulnerable as individuals. They possess their own coercive apparatus. Therefore, the threat of a rival state is manageable via balance of power, whereas the threat of a global sovereign is existential.

  **What This Rules Out**
  This pattern quietly rules out two rival positions:
  1.  **Intrinsic Statism:** It excludes the claim that state sovereignty is intrinsically valuable. If sovereignty were intrinsically valuable, the domestic suppression of rival militias would be a tragedy, not an achievement. The pattern assumes state sovereignty is instrumental.
  2.  **Universal Hobbesianism:** It excludes the claim that the logic of the social contract applies uniformly across all levels of human association. It denies that a "global original position" would necessarily yield a global Leviathan.

  **What It Requires vs. What Fits Comfortably**
  *   **Strictly Requires:** The pattern *requires* the belief that a global singleton would lack effective checks and balances. It relies on the premise that *exit* and *voice* are structurally impossible at the global level. If a global singleton could guarantee the same recourse, appeal, and exit options (e.g., right of secession) that a domestic government theoretically offers, the asymmetry collapses. The pattern requires that global tyranny is inescapable in a way domestic tyranny is not.
  *   **Fits Comfortably:** Arguments about cultural heterogeneity, democratic deficits, or administrative inefficiency fit comfortably with this view but are not strictly required. One could imagine a homogeneous world that still rejects a global singleton solely on the grounds of the "tyranny risk" calculus.

  ### II. Counterfactuals: Changing the View

  **Scenario A: Taking the Domestic Analogy Seriously (Pro-Global Singleton)**
  If we concluded that the international state of nature is as intolerable as the domestic one (e.g., due to nuclear proliferation or climate collapse), and thus a global singleton is desirable:
  *   **What must be abandoned:** The norm of non-intervention and the concept of Westphalian sovereignty. The UN Security Council veto must be abolished, as it institutionalizes the very fragmentation the singleton is meant to solve. National armies must be disbanded or integrated.
  *   **What must be invented:** A mechanism for *global political membership*. A global singleton without global citizenship is merely an empire. To maintain the "legitimate force" aspect of the domestic analogy, you must invent a direct relationship between the global authority and the individual, bypassing the state. This requires a global tax base and a global judicial recourse that individuals can access against the global authority. Without this, you have not created a domestic-style order; you have created a hegemon.

  **Scenario B: Taking the Anti-Singleton Stance All the Way Down**
  If we concluded that a monopoly on force is inherently dangerous and rejected it internationally *and* domestically:
  *   **The Consequence:** This undercuts the legitimacy of the state itself. It leads to political anarchism or libertarian polycentric law.
  *   **The Implication:** It forces the admission that the domestic "peace" is merely a suppressed civil war. It suggests that the current asymmetry is a hypocrisy: we accept the domestic Leviathan only because we are already inside its cage, while we fear the global one because we are outside it.
  *   **Viability:** This position is theoretically consistent but practically unstable. It fails to solve the "protection problem" for individuals against private coercion. The fact that almost no one holds this position suggests the asymmetry is not a confusion, but a pragmatic recognition that private violence is worse than public monopoly *at the individual level*, but public monopoly is worse than private competition *at the state level*.

  ### III. Limits and Defects of the Reconstruction

  You asked for directness regarding the limits of this reconstruction. There are three points where your framing, while analytically sharp, may rest on category errors or historical contingencies rather than a coherent theory.

  **1. "Singleton" vs. "Sovereign"**
  You are using Bostrom's term "singleton," which implies *effective control* and *capacity*. Political theory traditionally deals with *sovereignty*, which implies *legitimate authority*.
  *   **The Defect:** A domestic government is a singleton only if it successfully monopolizes force. Many states fail this test (failed states). We *aim* for a domestic singleton, but we often settle for a sovereign that struggles. Conversely, we *aim* against a global singleton, but the US hegemon often functions as a de facto partial singleton without the title.
  *   **The Implication:** The asymmetry may not be about political theory, but about *feasibility*. We accept the domestic singleton because it is historically achievable. We reject the global singleton because it is historically unprecedented and likely unstable. The "theory" is merely a rationalization of path dependence.

  **2. The Vulnerability Mismatch**
  The analogy between "individuals in a state of nature" and "states in an international system" is the weak link.
  *   **The Defect:** Individuals die easily. States do not. The *urgency* of a domestic singleton is driven by human mortality. The *urgency* of a global singleton is driven by systemic risk (nuclear war, ecological collapse).
  *   **The Implication:** The asymmetry is rational as long as the threat of international anarchy (war) is perceived as less immediate than the threat of domestic anarchy (crime/civil war). If emerging technologies (e.g., bio-weapons, AI) make the international state of nature as lethal to individuals as the domestic one, the theory breaks. The pattern presupposes that states are effective shields for their populations. If technology pierces that shield, the argument for a global singleton becomes identical to the argument for a domestic one.

  **3. The Confusion of "Control"**
  You ask if we trade on two senses of "control." The answer is yes.
  *   **Domestic Control:** We view the state's monopoly as *constitutive* of law. Without it, there is no justice.
  *   **International Control:** We view a global monopoly as *destructive* of politics. Without competition between states, there is no laboratory for policy, no check on totalizing ideology, and no exit option.
  *   **The Limit:** This suggests the asymmetry rests on a **pluralist theory of value** that prioritizes *political diversity* at the global level over *legal uniformity*. We value the existence of multiple political communities more than we value the efficiency of a single one. This is not a logical inconsistency, but it is a value judgment that prioritizes *liberty via fragmentation* over *security via unification*.

  ### Conclusion

  The pattern you identify is not a logical inconsistency, but it is not a settled theory either. It is a **contingent equilibrium**.

  It presupposes that states are sufficiently legitimate to protect individuals domestically, but sufficiently dangerous to require checking internationally. It strictly requires that the *risk of global tyranny* outweighs the *cost of international anarchy*.

  If you take the domestic analogy seriously, you must abandon the state as the ultimate unit of political organization and invent global democratic institutions that render the global singleton accountable to persons, not states. If you take the anti-singleton stance all the way down, you must admit the state is illegitimate.

  However, be warned: The framing relies on the stability of the nation-state as a protective shell. If emerging technologies render borders porous to coercion (cyber, bio, autonomous systems), the "Vulnerability Mismatch" collapses. In that specific context, the asymmetry becomes indefensible, and the "global singleton" ceases to be a nightmare of tyranny and becomes, by the logic of Hobbes, the only remaining alternative to extinction. The theory you are reconstructing is valid only as long as the state remains a credible container for violence.
