  ok so I've talked myself into thinking the causal exclusion arguement is basically right. the gist: mental properties aren't identical to physical ones but supervene on them, every physical effect already has a sufficient physical cause, and there's no systematic overdetermination, so the mental properties never get to do any causal work — they just ride along. so I'm basically an epiphenomenalist about mental properties (the underlying brain states are fine, obviously, they're doing all the actual work). what would count against this? and I mean properly, not the stock list you'd get from any intro phil-of-mind lecture.

