answer: |-
  Good evening. For those of you who are not students here, welcome. For those of us who are, welcome to the end of two weeks spent inside a very small box.

  We spent most of that time on a puzzle from a book by Douglas Hofstadter. You start with the string MI. You have four rules for rewriting it. You can add a U to the end if it ends in I. You can double everything after the M. You can replace three I's with a U. You can delete two U's. The goal is to reach MU.

  For eleven days, we tried to reach MU. I have a notebook full of derivations that go nowhere. On day eleven, I was certain I had solved it. I had filled a page with symbols, moving from line to line, until I landed on MU. I felt that specific rush of correctness. Then I checked my work. I had applied the three-I rule to a pair of I's. The system does not allow that. I hadn't found a path; I had hallucinated one.

  From inside the system, the accurate description of our situation was never impossible, but only not yet. No amount of further searching would have changed that. What ended the search was not more searching, but a statement about every string the system can ever produce, made from outside it.

  Here is the reasoning that settled it. Only two of the four rules alter the number of I's. One doubles that number; the other reduces it by three. We start with a single I. One is not a multiple of three. If you double a number that is not a multiple of three, the result is not a multiple of three. If you subtract three from a number that is not a multiple of three, the remainder is not a multiple of three. Therefore, starting from a single I, the count of I's is never a multiple of three. The target string, MU, has zero I's. Zero is a multiple of three. Therefore, MU is unreachable.

  This proof relies on jumping out of the system, but we need to be careful about what that means. Three different things get called jumping out, and they are not the same.

  First, there is finding an invariant. This leaves the rules untouched. It identifies something the rules can never change, so a conclusion follows about all possible derivations at once. This is what we did. We didn't break the rules; we watched them closely enough to see what they couldn't do.

  Second, there is changing the rules. You could add a rule that yields MU in a single step. That does not solve the puzzle; it dissolves it. It is a cheaper and quite different move, though it is what many people seem to have in mind when they urge us to think outside the box. It makes the problem go away, but it doesn't tell you the truth about the problem you actually had.

  Third, there is noticing that the proof of impossibility belongs to a vantage point the system cannot occupy. The system itself is silent about its own limits. It can generate strings, but it cannot generate the statement that some strings are impossible. That is why the puzzle is unsettling rather than merely clever. The truth about the system exists, but not inside it.

  I do not want to tell you that this means you should always question the rules. In a room containing my friends' parents, that will be heard as advice to break rules, which is not what I mean. The invariant argument respects the rules completely.

  I want to offer a honest and somewhat uncomfortable conclusion instead. Every jump out of a system lands you inside a larger system with a blind spot of its own. The invariant argument I just gave you is itself ordinary arithmetic. Arithmetic has its own MU. There are true statements about numbers that arithmetic cannot prove. Jumping out relocates you; it does not deliver you to the top. There is no top.

  But the jump is still worth making. It is worth making because staying inside the box means believing that failure is just a lack of effort. Seeing the box means understanding that some doors are locked not because we haven't pushed hard enough, but because of the structure of the hallway. We spent two weeks learning that we cannot reach MU. But we also learned how to stand outside the room where MU is kept, and look in. That view is not an escape. It is just a clearer place to stand.

  Thank you.
