answer: |-
  Here is the bit. It's written to be spoken, so mind the pauses.

  ### The Bit: "The Propositional Chick"

  A PhD candidate is defending a thesis titled *The Propositional Structure of Tactile Discrimination*. His claim is hard Intellectualism: knowing how to sex a chick is just knowing *that* a specific squeeze-pattern indicates maleness.

  The external examiner is a grizzled old Rylean. He puts a live chick on the table.

  **Examiner:** "State the proposition."
  **Candidate:** "The agent knows *that* **this** is the way to squeeze."
  **Examiner:** "Write it on the board."
  **Candidate:** "I can't. It's known under a practical mode of presentation."
  **Examiner:** "So define **this**."
  **Candidate:** "The squeeze that indicates maleness."
  **Examiner:** "And which squeeze is that?"
  **Candidate:** "The one the expert is doing!"
  **Examiner:** "So to understand the proposition, I must already be able to identify the squeeze?"
  **Candidate:** "Yes."
  **Examiner:** "Then I don't need the proposition. I need the ability."
  **Candidate:** "But the ability *is* the knowledge of the proposition!"
  **Examiner:** "Son, if the truth conditions of your proposition require the very skill the proposition is supposed to explain, you haven't analyzed the skill. You've just given it a truth-value."
  **Candidate:** "But the knowledge is there!"
  **Examiner:** "Where?"
  **Candidate:** "In the hand."
  **Examiner:** "Then it's not in the head. And if it's not in the head, it's not a proposition. And if it's not a proposition..." *(checks watch)* "...the chick is fully grown. What sex is it now?"
  **Candidate:** "I... I'd have to ask it."
  **Examiner:** "Congratulations. You've reduced epistemology to poultry conversation. Pass."

  ***

  ### The Commitment

  You asked me not to hedge, so I won't. Here is exactly what this joke is doing, philosophically speaking.

  **1. The Reading It Requires**
  This joke only lands if your audience accepts the **Ineffability Challenge** as a decisive objection to Intellectualism. It targets the Stanley & Williamson style "Practical Mode of Presentation" defense. Their move is to say, "The content is propositional, but the *way* you grasp it is practical." The joke treats this "practical mode" as a black box that swallows the content whole. It forces the Intellectualist to admit that the *reference* of the proposition ("this squeeze") is fixed by the ability, not by other propositions.

  **2. The Liberties It Takes**
  I am caricaturing the Intellectualist as requiring *conscious access* to the proposition to defend its existence. A sophisticated Intellectualist (like S&W) would argue the proposition can be known unconsciously or dispositionally, so the candidate's inability to write it down doesn't prove it isn't there.
  The joke ignores this by treating the "practical mode" as a linguistic failure rather than a cognitive one. It assumes that if you can't *state* the rule without begging the question, the rule isn't doing the explanatory work. It also simplifies Ryle; Ryle wasn't just saying "it's in the hands," he was saying the disposition *is* the knowledge, not that there's a ghostly proposition hiding in the tendons.

  **3. The Side I'm Betting On**
  This joke is **Rylean Propaganda**. It presupposes Anti-Intellectualism.
  It defends the view that **Ability is Foundational**.
  The punchline ("You've reduced epistemology to poultry conversation") rests on the claim that if the proposition is parasitic on the ability for its own intelligibility, the ability is the primary epistemic category. The joke argues that the Intellectualist is trying to sell a map that can only be read by someone who has already walked the terrain. If you have to know how to do it to understand the rule for doing it, the rule is redundant.

  **Why this works for your room:**
  Your audience knows the regress argument cold. This joke compresses the regress into a dialogue about reference. The Examiner forces the Candidate to admit that fixing the reference of "this" requires the very skill "this" is supposed to constitute. It makes the Intellectualist squirm because it exposes their central claim—that KH is a *species* of KT—as potentially vacuous: if the "fact" known is just "that *this* is the way," and "*this*" is defined by the successful performance, then the "fact" adds no explanatory value. It's a tautology dressed up as a truth condition.

  Deliver it dry. Let the silence hang after "What sex is it now?" That's where the Ryleans in the front row will be smiling.
