      PoM: Needs to address the *secrecy*. If the patient never knows, is her *capacity* as a knower harmed, or just her welfare? Epistemic injustice usually implies an interaction.
      SE: Needs to acknowledge that *institutional encoding* is distinct from *shared hermeneutical resources*.

