                  *   Why? Because the rule is: "A conditional claim represents the probability of the consequent in the set of worlds compatible with the antecedent. If the antecedent is false, we revert to the base rate."
                  *   This forces $P(A \to C) = P(A)P(C|A) + P(\neg A)P(C)$.
                  *   If they priced at $P(C|A)$, and the settlement value is $P(A)P(C|A) + P(\neg A)P(C)$, there will be a mismatch unless $P(C|A) = P(C)$.
                  *   This perfectly mirrors the Triviality algebra: $P(A \to C) = P(C|A)$ (their price) vs $P(A \to C) = P(A)P(C|A) + P(\neg A)P(C)$ (the settlement rule derived from the Law of Total Probability applied to the conditional proposition).
                  *   Wait, Lewis's result says if $P(A \to C) = P(C|A)$, then $P(C|A) = P(C)$.
                  *   So, if the settlement rule enforces the Law of Total Probability on the *ticket value*, and they priced using the Conditional Probability, the only way they don't lose money is if Independence holds.
                  *   *Refinement:* The settlement rule shouldn't be arbitrary. It needs to feel like the "logical consequence" of how conditionals work.
                  *   *The "Truth-Value" Trap:* Tell them: "This ticket is a bet on the *truth* of the statement 'If A then C'."
                  *   If 'If A then C' is a proposition, it has a truth value in every world.
                  *   World 1 ($A \land C$): True.
                  *   World 2 ($A \land \neg C$): False.
                  *   World 3 ($\neg A$): ???
