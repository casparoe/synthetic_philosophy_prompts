  # Seminar Plan: The Invariance Market

  **Topic:** The tension between the Ramsey Test (Adams' Thesis) and the Propositional View of Conditionals (Lewis's Triviality).
  **Time:** 90 Minutes.
  **Students:** 12 MA Philosophers.
  **Goal:** Students price conditional tickets using conditional probability, then encounter a settlement rule that forces unconditional independence, creating a financial loss that mirrors the triviality result.

  ## 1. Materials & Setup
  *   **The Urn:** A large opaque bag containing 100 poker chips.
      *   **20 Red Chips (Antecedent $A$ = True):** 18 have a Star ($C$ = True), 2 have a Blank ($C$ = False).
      *   **80 Blue Chips (Antecedent $A$ = False):** 8 have a Star ($C$ = True), 72 have a Blank ($C$ = False).
      *   *Note:* $P(C|A) = 0.9$. $P(C|\neg A) = 0.1$. $P(C) = 0.26$.
  *   **Currency:** 500 "Seminar Tokens" (plastic chips or printed slips).
  *   **Assets:** "Contingent Claim Slips." Pre-printed forms: *"Pays 10 Tokens if [Star] is drawn, given [Red] is drawn."*
  *   **Incentive:** 12 high-quality chocolate bars. Awarded to the top 3 token holders at the end. (Real stakes prevent dismissive play).
  *   **Layout:** 6 desks, 2 students per desk. Each desk is a "Trading Firm."

  ## 2. The Rules (Read Aloud, No Theory)
  *Do not use the words "conditional," "probability," "Ramsey," or "truth."*

  1.  **The Draw:** One chip will be drawn from the Urn at the end of class.
  2.  **The Ticket:** You may buy or sell tickets that read: *"If Red, then Star."*
  3.  **Trading (40 mins):** Firms may trade tickets among themselves or with the Bank (Instructor). You set the price. The Bank will buy or sell at any posted price to ensure liquidity.
  4.  **The Settlement Protocol (Must be agreed to before trading starts):**
      *   **Case 1 (Red is drawn):** The ticket is settled on the Star. (Star = 10 Tokens, Blank = 0 Tokens).
      *   **Case 2 (Blue is drawn):** The ticket is **Invariant**. It retains the exact token value it held *before* the chip was drawn. The Bank buys it back from you at your pre-draw market price.
      *   *Rationale given to students:* "This ticket represents a standing claim on the relationship between Color and Shape. The relationship exists regardless of which color is drawn. Therefore, the asset's value does not vanish if the Color condition is not met."

  ## 3. Timeline (90 Minutes)

  **00:00 – 00:10: Setup & Contract**
  *   Distribute tokens (50 per firm).
  *   Display the Urn contents *statistically* on the board (do not show chips): "Historical Data: 100 draws. 20 Red (18 Star). 80 Blue (8 Star)."
  *   **Crucial Step:** Have firms sign the **Settlement Protocol**. Ensure they understand Case 2 (Blue/Invariant). Ask: "If Blue is drawn, do you get your money back?" Answer: "No, you get the *market value* of the ticket."
  *   Start the timer.

  **00:10 – 00:50: Market Phase 1 (Pricing)**
  *   Firms trade tickets.
  *   **Instructor Role:** Act as a passive market maker. If a firm offers to sell at 2 tokens, buy it. If they offer to buy at 9 tokens, sell it.
  *   **Expected Outcome:** Firms will quickly converge on a price of **9 Tokens**.
  *   **Why:** They are using the Ramsey Test intuitively. "Given Red, how likely is Star?" (18/20). They ignore the Blue chips because the ticket says "If Red."
  *   **Intervention:** If a firm prices near 2.6 (Unconditional $P(C)$) or 0.8 (Material $P(\neg A \lor C)$), ask: "Read the ticket. It specifies a condition. Does the historical data support a lower price?" Guide them gently to 9 without naming the theory.

  **00:50 – 01:00: The Reveal**
  *   Stop trading.
  *   Draw a chip from the Urn.
  *   **Scripted Outcome:** You must draw a **Blue Chip** (Antecedent False). (Rig the draw if necessary; the lesson fails if Red is drawn).
  *   Announce: "The Antecedent is False. The Color is Blue."
  *   Ask firms: "According to the Settlement Protocol, what is your ticket worth now?"
  *   They will answer: "9 Tokens" (The Invariant Price).

  **01:00 – 01:10: The Crash (Phase 2)**
  *   Announce: "The Bank is now closing. We must liquidate all assets. However, we have new information. We know the chip is Blue."
  *   Ask: "Given the chip is Blue, what is the probability of a Star?"
  *   They will calculate: 8/80 = **0.1 (1 Token)**.
  *   **The Conflict:** "You hold a ticket worth 9 Tokens by the Protocol (Invariance). But the data says this ticket, in a Blue world, is only worth 1 Token. The Bank will not pay 9 Tokens for a 1 Token asset. The market is insolvent."
  *   Let them argue. They will realize they cannot hold both the **Price (9)** and the **Protocol (Invariance)** without losing 8 tokens per ticket.

  **01:10 – 01:30: Debrief (The Philosophy)**
  *   Distribute chocolate to top token holders (based on pre-crash holdings to avoid punishing the lesson).
  *   Begin the mapping.

  ## 4. The Debrief: Mapping the Trap

  **Step 1: Name the Moves**
  *   **The Pricing (00:10–00:50):** "You priced the ticket at 0.9. In philosophy, this is **Adams' Thesis** (or The Equation): $P(\text{If } A, C) = P(C|A)$."
  *   **The Protocol (00:00–00:10):** "You agreed that if $A$ is false, the ticket's value doesn't change. In philosophy, this is the **Propositional View**: Conditionals express propositions that have truth values (and thus probabilities) independent of whether the antecedent is true. Specifically, it assumes $P(A \to C | \neg A) = P(A \to C)$."
  *   **The Crash (01:00–01:10):** "When $A$ was false, the value *should* have updated to $P(C|\neg A)$ (0.1). But the Protocol forced it to stay at $P(C|A)$ (0.9). This implies $P(C|A) = P(C|\neg A)$."

  **Step 2: The Triviality Result**
  *   Write on board:
      1.  $P(A \to C) = P(C|A)$ (Your Price)
      2.  $P(A \to C | \neg A) = P(A \to C)$ (The Invariance Protocol)
      3.  Therefore, $P(A \to C | \neg A) = P(C|A)$.
      4.  But by (1), applied to $\neg A$: $P(A \to C | \neg A) = P(C|\neg A)$.
      5.  **Conclusion:** $P(C|A) = P(C|\neg A)$.
  *   "This means learning $A$ tells you nothing about $C$. Antecedent and Consequent are independent. In our urn, they were heavily correlated. Your portfolio went bust because you assumed independence in a dependent world."

  **Step 3: The Ways Out (Definite Verdict)**
  *   **Option A: Material Conditional.** Price was wrong. Should have been $P(\neg A \lor C) = 0.8 + 0.08 = 0.88$. *Verdict:* Reject. You didn't price it that way, and it doesn't match intuitive usage ("If it rains, I'll bring an umbrella" isn't true just because it's sunny).
  *   **Option B: No Truth Values (Adams/Edgington).** The ticket wasn't a proposition. It was a *conditional assertion*. It has no value when $A$ is false; it's void. *Verdict:* **This is the winner.** The Settlement Protocol was the lie. Conditionals shouldn't be settled in $\neg A$ worlds. They are not assets that survive the falsity of the antecedent.
  *   **Option C: Stalnaker/Lewis (Possible Worlds).** The ticket pays out based on the *closest* world where $A$ is true. *Verdict:* Viable, but requires a metaphysics of worlds the market didn't simulate.
  *   **My Verdict for the Class:** The activity supports **Option B**. The "crash" happened because we forced a non-truth-conditional object into a truth-conditional settlement rule. The Equation holds for *assertibility*, not *truth probability*.

  ## 5. The Ceiling: What This Activity Cannot Do
  *Be honest here. Do not let them think this is a formal proof.*

  1.  **Generality:** We showed a contradiction for *one* pair of $A$ and $C$. Lewis's result proves this holds for *any* $A, C$ in a standard probability space. This activity is a counterexample demonstration, not a general proof.
  2.  **Closure:** The triviality proof requires the set of propositions to be closed under conditionalization. Our market didn't enforce that. We simply assumed the "Invariance" rule.
  3.  **Semantics:** The market forces a *pricing* conflict. It does not prove that conditionals *lack* truth conditions semantically, only that pricing them as unconditional probabilities leads to absurdity.
  4.  **Flagging:** Tell them: "You haven't seen a proof today. You've seen a *reductio ad absurdum* in miniature. The proof requires algebra; this required chocolate."

  ## 6. Predictable Failure Modes & Fixes

  **1. The "No Truth Value" Objection (Early)**
  *   *Scenario:* A student says during trading, "This ticket is void if Blue is drawn. I won't price it."
  *   *Diagnosis:* They have spotted the solution before the trap sprung.
  *   *Fix:* "The Settlement Protocol requires a price for liquidity. For the sake of the market simulation, you must assign a token value. Treat it as a derivative that hedges risk." (Force them into the propositional frame temporarily).

  **2. The Material Interpretation**
  *   *Scenario:* A firm prices the ticket at 0.88 ($P(\neg A \lor C)$).
  *   *Diagnosis:* They are treating "If" as "Or Not."
  *   *Fix:* During trading, ask: "If I know for a fact it is Red, would you sell me this ticket for 2 tokens?" (Since $P(C|A)=0.9$, 2 is a steal). If they say yes, their 0.88 price was inconsistent. Push them toward 0.9.

  **3. The Clock Eater**
  *   *Scenario:* Trading drags on. Students haggle over 0.1 token differences.
  *   *Fix:* At 00:40, announce: "Market closes in 5 minutes. Final prices lock in." Force the settlement.

  **4. The Rigged Draw Suspicion**
  *   *Scenario:* You draw Blue. Students suspect you avoided Red to make the point.
  *   *Fix:* Acknowledge it. "Yes, I needed a Blue chip to settle the $\neg A$ branch. If I drew Red, the Equation would have paid out correctly, and we wouldn't have learned about Triviality. The lesson requires the Antecedent to fail."

  **5. The "So What?" Reaction**
  *   *Scenario:* "Okay, so we lost tokens. Why does this matter for epistemology?"
  *   *Fix:* "Because you use this Equation every time you reason. 'If it rains, the match is cancelled.' You believe that to degree 0.9. If Lewis is right, you are committed to believing rain is independent of cancellation. This activity shows why your intuitive reasoning is philosophically unstable."

  ## 7. Instructor's Stance (For the Debrief)
  *   **Do not equivocate.**
  *   **Claim:** The Equation ($P(A \to C) = P(C|A)$) is correct for *assertibility*, but conditionals do not express propositions with unconditional probabilities.
  *   **Reason:** The market crash proved that treating them as propositions (Invariance) forces independence. Since independence is false (in our urn and in life), the Propositional View is the casualty.
  *   **Caveat:** This does not kill possible worlds semantics (Stalnaker), but it does kill the idea that conditionals fit neatly into standard Bayesian probability spaces as simple events.

  ## 8. Why This Structure?
  Your proposed two-stage structure is correct, but the **Settlement Protocol** is the load-bearing wall. If the settlement in $\neg A$ cases is a "refund," the Equation survives (as shown in the thought process). If the settlement is "Material," the Equation dies but for the wrong reason (confusing indicative with material).
  The **Invariance Rule** is the only one that simulates Lewis's specific assumption ($P(A \to C | \neg A) = P(A \to C)$). It forces the students to treat the conditional as a stable object that persists across the falsity of the antecedent. That is the philosophical heart of the triviality result, and it is the only way to make them feel the "floor move" rather than just seeing a math error.
