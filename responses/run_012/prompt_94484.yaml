  6.  **Addressing the "Ceiling" and "Failure Modes":**
      *   *Ceiling:* This activity shows the tension. It doesn't prove Lewis's theorem (which requires closure under conditionalization for *all* propositions). It shows a counterexample to the joint consistency of Ramsey + Propositionalism in *this* model.
      *   *Failure Mode:* Student says "Conditionals have no truth value." (Correct instinct). Response: "Save that for the debrief. For the market to function, we need a price. Price implies value. Value implies truth conditions in this game."
      *   *Failure Mode:* Student says "It's material." Response: "If it were material, you would have priced it at $P(\neg A \lor C)$. You didn't. You priced at $P(C|A)$."
      *   *Clock:* Trading can drag. Use a timer.

  7.  **Finalizing the Scenario:**
      *   **The "Medical Test" is banned by prompt.**
      *   **New Scenario:** "The Algorithmic Trader."
      *   **Antecedent (A):** Market Volatility is High.
      *   **Consequent (C):** Stock X rises.
      *   **Correlation:** High Volatility usually means Stock X rises (Safe haven). Low Volatility means Stock X falls.
      *   **Data:** 100 historical days.
          *   High Vol (A): 20 days. Stock Up (C): 18 days. ($P(C|A) = 0.9$).
          *   Low Vol ($\neg A$): 80 days. Stock Up (C): 8 days. ($P(C|\neg A) = 0.1$).
          *   Overall $P(C) = 26/100 = 0.26$.
      *   **Ticket:** "If Volatility is High, Stock X Rises."
      *   **Phase 1 Price:** Students will price near 0.9 (9 tokens).
      *   **Phase 2 Reveal:** "Today, Volatility was Low."
      *   **Phase 3 Settlement:** "The contract states: This ticket represents a standing claim on the relationship. Its value is invariant to the day's volatility." (Insulation).
      *   **Conflict:** Ticket is worth 9 tokens (original price) vs 1 token (new conditional prob).

  8.  **Wait, one correction on the Triviality Logic:**
      *   Lewis's result is that $P(A \to C) = P(C|A)$ implies $P(C|A) = P(C)$.
      *   My activity shows $P(C|A) \neq P(C|\neg A)$.
      *   If $P(A \to C) = P(C|A)$ and $P(A \to C) = P(C|\neg A)$ (via Independence), then $P(C|A) = P(C|\neg A)$.
      *   So showing $P(C|A) \neq P(C|\neg A)$ refutes the conjunction of (Equation + Independence).
      *   This is sufficient for the seminar. It forces a choice.

  9.  **Structuring the Response:**
      *   **Title:** The Invariance Market.
      *   **Materials:** Specifics.
      *   **Rules:** Precise wording for the "Trap."
      *   **Timeline:** Minute-by-minute.
