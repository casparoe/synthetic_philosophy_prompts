      *(One last thought on the "Ceiling"):* I must emphasize that Lewis's result applies to *all* A, C. This activity only shows it for *one* pair. The generalization requires the algebraic proof. I must tell the instructor to make this clear so students don't think one counterexample kills the thesis universally (though one counterexample kills the *universal* thesis). Actually, one counterexample *does* kill the universal thesis. The limitation is that the activity assumes the "Invariance" rule is binding, which corresponds to the semantic assumption that conditionals express propositions. The activity doesn't prove that assumption is necessary, only that *if* you make it, you crash.

