  10. **Refining the "Resolution Procedure":**
      *   It must be agreed to *before* play.
      *   "The Invariance Clause": "In the event the Antecedent is false, the Ticket retains its pre-reveal market value."
      *   This sounds like a financial derivative rule (path independence). It feels technical, not philosophical. Perfect.

