              *   Rational Price = EV.
              *   $P = P(A)P(C|A)10 + P(\neg A)P$.
              *   $P(1 - P(\neg A)) = P(A)P(C|A)10$.
              *   $P \cdot P(A) = P(A)P(C|A)10$.
