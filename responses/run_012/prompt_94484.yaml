          7.  If they all price at $P(C|A)$, and the "average price" is $P(C|A)$, then the payout in $\neg A$ worlds is $P(C|A)$.
          8.  Total Value = $P(A)P(C|A) + P(\neg A)P(C|A) = P(C|A)$.
          9.  This *stabilizes* the Equation. It doesn't trivialize it.
          10. I need the settlement in $\neg A$ worlds to be $P(C)$, not $P(C|A)$.
          11. Why would it be $P(C)$? Because the "Conditional Ticket" is hedged by "Consequent Tickets."
