  Based on your seven cases, I propose the following principle. It distinguishes the two types of conditionals by the *mode of evaluation* they trigger: indicatives rely on **epistemic relevance** within the actual context, while counterfactuals rely on **metaphysical sufficiency** within a modified context.

  ### The Principle: Epistemic-Relevance vs. Metaphysical-Sufficiency

  **Clause 1 (The Indicative Constraint):** An indicative conditional *If A, C* is true if and only if:
  1.  **Epistemic Openness:** $A$ is not known to be false in the actual context (it is epistemically possible).
  2.  **Probabilistic Relevance:** $A$ provides non-redundant evidential support for $C$. Formally, the conditional probability $P(C|A \& K)$ must be high, and ideally $P(C|A \& K) > P(C|K)$, where $K$ is the background knowledge.
      *   *Motivation:* This captures **Case 4** (Picnic), **Case 5** (Butler), and **Case 3** (Red Ball, post-draw). In Case 4, rain provides no *new* evidence for cancellation (since it is already certain), rendering the indicative false. In Case 5, the butler's innocence provides crucial evidence for the cook's guilt (given the disjunction), rendering it true. In Case 3 (post-draw), the antecedent is known false, violating Epistemic Openness.

  **Clause 2 (The Counterfactual Constraint):** A counterfactual conditional *If A had been, C would have been* is true if and only if:
  1.  **Metaphysical Sufficiency:** In the closest possible world(s) where $A$ is true (and which otherwise match the actual world in laws and invariant dispositions), $C$ is also true.
  2.  **Presupposition of Falsity:** $A$ is presupposed to be false in the actual world (or at least treated as counter-to-fact).
      *   *Motivation:* This captures **Case 1** (Paris), **Case 2** (Glass), **Case 4** (Picnic), and **Case 6** (Meeting). In Case 4, we simulate a world where it rains; the park closure rule still holds, so the picnic is cancelled. In Case 6, if the meeting is actually at ten, the counterfactual "If it had been at nine" is felicitous and evaluated metaphysically.

  **Clause 3 (The Equivalence Condition):** Indicatives and counterfactuals converge in truth value when the connection between $A$ and $C$ is grounded in **invariant laws or dispositions** that guarantee both high epistemic relevance and metaphysical sufficiency.
      *   *Motivation:* This captures **Case 1** (Paris/France) and **Case 2** (Fragile Glass). Geographical and dispositional facts are both epistemically informative and metaphysically robust.

  ---

  ### Application to New Cases

  **Case A: The Chance Event Antecedent**
  *Scenario:* A fair coin is about to be tossed. You hold a ticket that wins on Heads.
  *   **Indicative:** "If the coin lands heads, you win."
      *   *Prediction:* **True.** The antecedent is epistemically open (50% chance). Given the rules of the game, $P(\text{Win}|\text{Heads}) = 1$. It provides perfect evidential support.
  *   **Counterfactual:** (After the coin lands Tails) "If the coin had landed heads, you would have won."
      *   *Prediction:* **True.** In the closest world where the coin lands Heads (a minor miracle of chance), the rules of the game remain invariant, so you win.
  *   *Note:* Unlike Case 3 (Red Ball), the chance event does not create a "fixed outcome" until it happens. Pre-toss, the counterfactual is odd (violates Presupposition of Falsity), but post-toss, it functions normally.

  **Case B: The Modal Consequent**
  *Scenario:* You are walking under a scaffolding. A hammer is loose.
  *   **Indicative:** "If you walk there, you might get hit."
      *   *Prediction:* **True.** The antecedent opens a scenario where the risk (modal consequent) is epistemically relevant. It updates your information state to include the possibility of danger.
  *   **Counterfactual:** "If you had walked there, you might have been hit."
      *   *Prediction:* **True.** In some of the closest worlds where you walk there, the hammer falls. The counterfactual quantifies over a set of close worlds; if the consequent holds in *some* of them (depending on the scope of 'might'), the statement is true.
  *   *Distinction:* The indicative warns of a current epistemic possibility. The counterfactual describes a metaphysical possibility in a revised history.

  ---

  ### Conflict Analysis: Which Judgments Must You Give Up?

  While this principle accommodates most of your intuitions, it forces you to refine or abandon specific aspects of **Case 7** and **Case 4**.

  **1. The Truth-Value Gap (Case 7)**
  *   **Your Judgment:** When the plant is a cactus, "If the plant is a fern..." is *neither true nor false*.
  *   **Principle's Verdict:** The principle classifies this as **infelicitous** (due to the Epistemic Openness clause), but standard semantics usually assigns a truth value (often vacuously true) once the presupposition failure is resolved or ignored.
  *   **Recommendation:** You should abandon the claim that it lacks a truth *value*. It is more precise to say it lacks a *contextual assertability*. If forced to assign a truth value in a logic that ignores presupposition, it would likely be **True** (because the material conditional holds) or **False** (because the relevance condition fails). Maintaining a strict "truth-value gap" requires a Strawsonian semantics that is costly for little gain. **I recommend treating Case 7 as a case of Pragmatic Infelicity rather than Semantic Truth-Valuelessness.**

  **2. The Non-Monotonicity of Indicatives (Case 4)**
  *   **Your Judgment:** "If it rains, the picnic is cancelled" is **False** (because rain didn't cause it), even though the picnic *was* cancelled.
  *   **Principle's Verdict:** The principle supports this via the **Probabilistic Relevance** clause ($P(C|A) \ngtr P(C)$).
  *   **Conflict:** This contradicts standard classical semantics (Stalnaker/Lewis), which would judge the indicative **True** because the consequent is already known to be true (monotonicity).
  *   **Recommendation:** To keep your judgment in Case 4, you must accept that Indicatives are **non-monotonic** and sensitive to *explanatory relevance*, not just truth preservation. This is a defensible but non-standard position. If you prefer standard semantics, you must abandon your judgment in Case 4 and admit the indicative is True (though perhaps misleading).

  ### Summary of Trade-Offs

  If you wish to maintain a single, coherent principle:

  1.  **Keep:** Cases 1, 2, 3, 5, 6. (These are the strongest intuitions and align with the Epistemic/Metaphysical split).
  2.  **Modify:** Case 7. Abandon the "neither true nor false" claim in favor of "presupposition failure/infelicitous."
  3.  **Defend:** Case 4. Be aware that your judgment here commits you to a **Relevance Logic** for indicatives, rejecting the standard view that "True Consequent makes Conditional True."

  **Best Candidate Principle:** The **Epistemic-Relevance vs. Metaphysical-Sufficiency Principle** outlined above. It is the only framework that simultaneously explains why the Butler case (logical inference) works for indicatives while the Picnic case (causal irrelevance) fails for them, by anchoring indicatives in *information update* rather than *world modification*.
