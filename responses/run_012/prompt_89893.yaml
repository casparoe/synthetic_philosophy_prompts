      *   *Case (b):* Entrenchment (unamendable provision).
          *   *Analysis:* Can a current convention bind a future sovereign convention? Usually no, unless the current rules allow it. If silent, likely out of order because it claims to remove authority from a future body that holds the same authority as this one.
      *   *Case (c):* Committee amends standing orders (delegation).
