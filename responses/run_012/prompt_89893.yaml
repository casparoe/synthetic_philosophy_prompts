answer: |-
  **The distinction, operationalized**

  The distinction is between the game and the players. A tangled hierarchy occurs when the players try to rewrite the rules while the game is being played. The inviolate level is the set of rules that must remain fixed *for this specific vote to count as a vote*. It is not about permanent law; it is about logical stability. If you change the rule defining how this vote is counted *during* this vote, there is no fact of the matter about whether the vote passed. The diagnostic question is: **Does this motion change the rules by which this specific motion is being decided?** The most common misunderstanding is thinking "inviolate" means "permanent." It does not. It means "fixed for the duration of this act." A rule can be inviolate for this vote but changed immediately afterward for the next one. The inviolate level is the surface on which the drawing is made; you cannot erase the surface while drawing on it.

  **The test, step by step**

  1.  **Identify the Authority:** What body is voting? (e.g., Convention). What rule defines its power? (e.g., Bylaws).
      *   *Sufficient Answer:* "The Convention acting under Article X."
      *   *Proceed:* Step 2.

  2.  **Identify the Change:** What exactly does the motion alter? Is it a policy, a rule, or the authority structure itself?
      *   *Sufficient Answer:* "It changes the amendment threshold for future votes."
      *   *Proceed:* Step 3.

  3.  **Check Immediate Effect:** Does the motion change the voting threshold, quorum, or eligibility *for this specific motion*?
      *   *Yes:* **Out of Order.** You cannot change the scoreboard while playing the point. Terminate.
      *   *No:* Proceed to Step 4.

  4.  **Check Future Authority:** Does the motion bind future conventions or remove their power to amend?
      *   *Yes (Permanent Entrenchment):* **Out of Order** (unless current rules explicitly allow entrenchment). A sovereign body cannot destroy its successor's sovereignty using the successor's own rules. Terminate.
      *   *No (Future Change):* Proceed to Step 5.

  5.  **Check Delegation:** Does the motion transfer rule-making power to a committee or officer?
      *   *Yes:* Is the transfer reversible by the Convention?
          *   *No:* **Out of Order.** You cannot delegate the inviolate level irreversibly. Terminate.
          *   *Yes:* **Judgment Call.** Advise the Chair that this risks diluting authority but is permissible if revocable. Hand to Chair.
      *   *No:* Proceed to Step 6.

  6.  **The Stop Condition:** The climb stops at the **Current Session's Constitutive Rules**. These are the rules that make this gathering a valid convention. You cannot vote to invalidate the gathering you are currently in. Stopping here is principled because without this floor, there is no "assembly" to do the voting. If the motion implies the current meeting is not bound by the rules defining the current meeting, the act is null.
      *   *Principled Stop:* The regress ends where the existence of the voter is defined.
      *   *Proceed:* Step 7.

  7.  **Final Ruling:** If the motion operates *under* the current rules to change *future* rules, it is **In Order**. If it attempts to operate *outside* or *against* the current rules to validate itself, it is **Out of Order**.

  **Worked cases**

  (a) **Lower Threshold.**
  *   *Ruling:* In Order.
  *   *To Chair:* "The motion uses current rules to change future rules. It does not alter the count for this vote."
  *   *Memo:* "Proposal changes future amendment threshold under existing threshold. No self-reference paradox; current rules remain inviolate for this vote. The change takes effect only upon adjournment."

  (b) **Entrenchment.**
  *   *Ruling:* Out of Order.
  *   *To Chair:* "This convention cannot bind a future convention's sovereignty unless our rules explicitly allow us to surrender that power. They do not."
  *   *Memo:* "Motion attempts to remove future assemblies' authority to amend. This violates the principle that a sovereign body cannot destroy its successor's sovereignty using standard amendment procedures. The inviolate level is the convention's continuing authority."

  (c) **Committee Amendment.**
  *   *Ruling:* In Order (conditional).
  *   *To Chair:* "Permissible because the Convention retains final reversal authority. The Committee acts as an agent, not a sovereign."
  *   *Memo:* "Delegation of standing order amendments is permissible provided the Convention retains revocable oversight. The inviolate level remains the Convention's final approval power."
  *   *Honesty Check:* I favor this motion. However, the test requires the reversal mechanism to be robust. If the motion makes reversal difficult (e.g., requiring a higher threshold to reverse than to enact), the test flips to **Out of Order**. I must advise that if the reversal clause is weak, the delegation becomes an abdication of the inviolate level. The procedure does not protect my preference; it protects the Convention's sovereignty. If the committee can amend without easy reversal, the Convention has drawn itself out of existence.

  **The judgments the procedure cannot make for me**

  This procedure cannot resolve sovereignty disputes when the documents are silent. If the assembly votes to entrench a rule despite this advice, the procedure cannot stop them. It can only record that the circularity was accepted. When the motion asks "Who decides who decides?" and the bylaws are silent, the assembly decides by voting. I must say out loud: "The rules do not specify this; you are creating precedent." I must refuse to claim that parliamentary law forbids what the assembly willingly accepts. The procedure identifies the risk, not the legality of the risk. If the assembly chooses to tangle the hierarchy, the memo must note: "Assembly accepted self-referential risk." Do not claim the ruling prevents future chaos; only that it identifies the structural weakness. The inviolate level is a stipulation, not a discovery. If the assembly stipulates otherwise, the record must show they knew the cost.

  **Where it will misfire, and the warning signs**

  The procedure misfires during emergencies where strict adherence paralyzes action. It also invites abuse if used to block popular will by labeling it "self-referential." Warning signs: Motions that claim "immediate effect" on procedural rules, or motions that define their own quorum. A proposal that looks tangled but isn't: A simple rule change for future meetings. A proposal that looks clean but is tangled: A "technical correction" that redefines who counts as a delegate. Insist on handling "continuous convention" proposals outside this procedure; they dissolve the session boundary entirely. Do not use this test for ordinary business; reserve it for structural changes only. If a motion claims to be "above appeal," treat it as an attempt to move the inviolate level and scrutinize it heavily.
