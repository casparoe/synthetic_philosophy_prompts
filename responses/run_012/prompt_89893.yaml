          1.  Identify the object of change.
          2.  Identify the authority currently acting.
          3.  Check if the motion alters the authority *currently* acting.
          4.  Check if the motion alters the threshold *for this vote*.
          5.  Stop condition (The "Constitutive Level").
      *   *Stopping Principle:* Stop at the level that defines the *current* meeting's validity. You can't vote to invalidate the vote you are casting.
      *   *Out of Order vs. In Order vs. Judgment:*
          *   Out: Changing the rule for *this* vote mid-stream.
          *   In: Changing rules for *future* votes using current rules.
          *   Judgment: Delegating authority (needs scrutiny on revocability).
      *   *Word Count Check:* Aim for ~700. This is the meat. Needs clear branching logic.

  5.  **Drafting - Section 3: Worked cases:**
      *   *Case (a):* Lower threshold for future amendments (2/3 -> majority), voted on under 2/3.
