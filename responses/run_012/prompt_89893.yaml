      *   **Theoretical Basis:** Hofstadter's concept of "tangled hierarchy" vs. "inviolate level" (from *Gödel, Escher, Bach*). The core idea is that a system can reference itself only if there's a level outside the reference that remains fixed to give the reference meaning.
      *   **Constraints:**
          *   Must be operational (runnable in ~5 minutes).
          *   Must be speakable (not philosophical jargon).
          *   Must address specific complexities: silent documents, no external court, conflation of inviolate level vs. entrenchment, infinite regress.
          *   Must be followable by losing delegates (avoid arbitrariness).
          *   Specific structure and word counts for 5 sections.
      *   **Sections:**
          1.  The distinction, operationalized (~200 words).
          2.  The test, step by step (~700 words).
          3.  Worked cases (~600 words).
          4.  The judgments the procedure cannot make for me (~250 words).
          5.  Where it will misfire, and the warning signs (~200 words).

  2.  **Deconstruct the Theory (Hofstadter/Inviolate Level):**
      *   *Tangled Hierarchy:* When levels of a system interact recursively (e.g., a rule changing the rule for changing rules).
      *   *Inviolate Level:* The level that must remain fixed *for the operation to happen*. It's the "stage" on which the "play" occurs. If you try to move the stage while playing the play, the play collapses into nonsense.
      *   *Application to Parliament:* To vote on a rule change, the rules for voting must be stable *during that vote*. You can change the rules for *future* votes, but the current vote must obey the current rules.
      *   *Key Insight:* The "inviolate level" isn't metaphysically sacred; it's pragmatically necessary for the act to be determinate.

  3.  **Drafting - Section 1: The distinction, operationalized:**
      *   *Goal:* Explain tangled hierarchy vs. inviolate level simply.
      *   *Diagnostic Question:* What must stay fixed for this vote to count as a vote?
      *   *Misunderstanding:* People think "inviolate" means "permanent." It means "fixed for this specific operation."
      *   *Drafting thought:* Keep it tight. Use the "game vs. rules of the game" analogy.
      *   *Word Count Check:* Aim for ~200.

  4.  **Drafting - Section 2: The test, step by step:**
      *   *Goal:* A numbered sequence for the 5-minute window.
