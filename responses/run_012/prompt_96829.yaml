  2.  **Deconstruct the Thesis & Audience Vulnerabilities:**
      *   *Thesis Strength:* Moves away from dramatic "end of the world" narratives to nuanced structural change. Aligns well with current resilience/complexity theory.
      *   *Thesis Weakness:* Might seem like semantic quibbling to those dealing with massive depopulation or violence. "De-integration" might downplay human suffering. The "absence" argument is risky against hard survey data.
      *   *Aegean LBA:* Obsessed with palatial systems (Linear B), destruction layers, sea peoples, systemic failure vs. transformation.
      *   *Maya:* Obsessed with Classic/Terminal Classic transition, abandonment of great cities, drought theories, demographic crashes.
      *   *Landscape/Survey:* Obsessed with visibility, bias, radiocarbon resolution, "absence of evidence vs. evidence of absence."

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (Landscape):* The "absence" argument is dangerous. If survey shows no pottery, people aren't there.
          *   *Voice:* "Wait, you can't just wish away the drop in radiocarbon dates."
          *   *Damage:* High. Undermines the empirical basis.
          *   *Likelihood:* Very High (they are the judges).

      *   *Objection 2 (Maya):* People starved/died. It's not just bureaucracy changing.
          *   *Voice:* "In the Southern Lowlands, cities were abandoned. People suffered."
          *   *Damage:* Medium-High. Challenges the moral/ethical weight of "collapse."
          *   *Likelihood:* High.

      *   *Objection 3 (Aegean):* The Palace *was* the economy. No palace = no redistribution = collapse.
          *   *Voice:* "Without the Wanax, the bronze flow stops. That is systemic failure."
          *   *Damage:* Medium. Challenges the "flows" argument.
          *   *Likelihood:* High.

      *   *Objection 4 (General/Theoretical):* Semantics. Why does the word matter if the phenomenon is real?
          *   *Voice:* "Call it what you want, the lights went out."
          *   *Damage:* Low-Medium. Philosophical.
          *   *Likelihood:* Medium.

      *   *The "Hope Nobody Asks" Question:* Needs to hit the core intellectual honesty of the speaker. Why are *you* (an intellectual historian) telling *us* (archaeologists) how to interpret our data? Or, does this let us off the hook for explaining *why* the change happened? Let's go with the "So What?" regarding causality. If collapse isn't a thing, what causes the de-integration?

  4.  **Refining the Voices:**
      *   *Aegeanist:* Use terms like "Wanax," "Linear B," "destruction horizons," "palatial economy." Tone: Slightly defensive of the systemic complexity they study.
      *   *Mayanist:* Use terms like "Classic," "Terminal Classic," "Southern Lowlands," "monumental construction," "drought." Tone: Focused on demographic reality and human cost.
      *   *Landscape:* Use terms like "settlement density," "C14 spikes," "visibility bias," "null hypothesis." Tone: Blunt, data-driven, skeptical of theory.

  5.  **Drafting Replies & Weaknesses:**
      *   *Reply Strategy:* Acknowledge the data, reframe the interpretation, emphasize the *continuity* beneath the *disruption*.
      *   *Weakness:* Usually lies in the inability to account for rapid demographic decline or violence without resorting to "collapse" language.

  6.  **Final Review against Constraints:**
      *   Ordered by likelihood/damage? Yes.
      *   Phrased correctly? Yes.
      *   2-minute replies (approx. 250-300 words spoken)? Need to keep them concise.
      *   Weakness noted? Yes.
      *   "Hope nobody asks" included? Yes.

  7.  **Polishing the Content:** (Self-Correction during drafting)
