prompt: |-
  I'm an intellectual historian giving the opening talk at a two-day workshop on societal collapse hosted by an archaeology department: roughly half Aegean Late Bronze Age specialists, half Maya archaeologists, plus two landscape archaeologists who work on settlement demography and will judge everything by the survey and radiocarbon record. My thesis is that 'collapse' is an organicist metaphor inherited from nineteenth-century social theory, one that smuggles in the picture of a society as an organism with a life cycle, and that it should be replaced by two separable descriptions: a change in the scale of integration (which unit — palace, polity, network of exchange — turns out to be the one that persists) and a change in the flows that held that unit together (tribute, grain, metals, labour). On that redescription, the canonical cases are de-integration of a political unit alongside continuity of households and agricultural practice, not failure; and part of my case is that de-integration is legible in the material record largely as an absence, which is exactly why it has been read as loss rather than as a change in the level at which the story is told. Prepare my Q&A sheet: the objections this particular audience will actually raise, ordered by how likely and how damaging they are, each phrased the way an Aegeanist or a Mayanist would phrase it, with a two-minute reply and a note on where the reply is weakest. Include the question I'm hoping nobody asks.
reasoning: |-
