      *   *Correction:* Ensure the Maya objection addresses human suffering, not just pots.
      *   *Correction:* The Aegean objection should focus on the *function* of the palace, not just its existence.
      *   *Refining the "Hope Nobody Asks":* It should be about the *utility* of the term. If "collapse" motivates funding and public interest, does removing it hurt the discipline? Or, more sharply: "If it's just transformation, why did it happen?" (Causality). Let's go with the Causality/Agency angle. If you remove the noun "collapse," do you lose the explanatory power for *why* the flows stopped?

  8.  **Final Polish:** Check tone. It should be professional, prepared, but acknowledging the tension between theory and data. (Proceed to generate output).

