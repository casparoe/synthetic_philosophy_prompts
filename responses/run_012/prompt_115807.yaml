      *   *Addressing the "Formal Setting":* Ambiguity aversion (Ellsberg). You can be pumped for ambiguity aversion, but it's widely considered reasonable (insurance against unknown unknowns).

  8.  **Final Polish:** Ensure the distinction between "defective preferences" and "defective decision procedures" is clear. The user's norm conflates them.

