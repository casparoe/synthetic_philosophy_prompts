      *   *Correction on Dial-Turning:* This is the "Money Pump for Continuity." If I prefer $x$ to $y$, and $y+\epsilon$ to $y$, eventually I prefer $z$ to $x$. This is the standard "continuity axiom" attack.

      *   *Let's structure the ranking:*
          1.  **The Epistemic Defeater (Sophistication):** The pump requires naivety.
