  # PERCEPTION READING GROUP: DECISION TREE
  **Start:** Answer based on your intuitions about the cases, not on which label you want.

  **1. PERFECT HALLUCINATION:** In the *Perfect Hallucination* case (subjectively identical to veridical, no external object), is the subject immediately related to a particular that bears the apparent properties (e.g., a pink, rat-shaped particular)?
  *   **YES** → Go to **2**.
  *   **NO** → Go to **5**.

  **2. VERIDICAL OBJECT:** In *Veridical Perception*, is the subject immediately related to a particular of the **same fundamental metaphysical kind** as in the Hallucination case (Q1)?
  *   **YES** → Go to **3** (Common Kind Object View).
  *   **NO** → Go to **4** (Disjunctive Object View).

  **3. VERIDICAL HALLUCINATION:** In the *Veridical Hallucination* case (hallucinating a scene that actually exists by chance), is the experience veridical?
  *   **YES** → **LEAF A: Causal Sense-Data Theory.** *Awkward commitment:* Must explain why the matching world doesn't make it veridical without a causal link.
  *   **NO** → **LEAF B: Matching Sense-Data Theory.** *Awkward commitment:* Veridical perception is defined by matching sense-data, not the world itself.

  **4. HALLUCINATION ONTOLOGY:** (From Q2=NO) Do you maintain there *is* an object in Hallucination, just a different kind than Veridical?
  *   **YES** → **EMPTY BRANCH 1.** *Status:* **Incoherent.** If Hallucination has an object and Veridical has a different one, you've abandoned the explanatory power of the Argument from Illusion without gaining Disjunctivist epistemic benefits. Nobody holds this.
  *   **NO** → Go to **6** (You are a Disjunctivist: Object in Veridical, None in Hallucination).

  **5. VERIDICAL ONTOLOGY:** (From Q1=NO) In *Veridical Perception*, is the subject immediately related to a mind-independent particular?
  *   **YES** → Go to **6** (Disjunctivism).
  *   **NO** → Go to **8** (Common Kind Non-Object View).

  **6. ILLUSION CASE:** In the *Bent Stick (Illusion)* case, is the subject immediately related to the mind-independent stick itself?
  *   **YES** → Go to **7** (Relational Illusion).
  *   **NO** → **LEAF C: Global Metaphysical Disjunctivism.** *Awkward commitment:* Must treat Illusion and Hallucination as the same fundamental kind despite the presence of the stick.

  **7. RED LIGHT CASE:** In the *White Wall/Red Light* case, is the redness a property of the wall (dispositional) or the light/experience?
  *   **WALL** → **LEAF D: Naive/Direct Realism (Relationalism).** *Awkward commitment:* Must accept dispositional properties or error theory for color to maintain the relation.
  *   **LIGHT/EXPERIENCE** → **EMPTY BRANCH 2.** *Status:* **Unattractive.** Relationalism about the object but not the properties collapses into Representationalism or Error Theory; no stable position here.

  **8. CONTENT VS MODE:** (From Q5=NO) Is the phenomenal character determined by *what* is represented (content) or *how* the subject is modified (mode)?
  *   **WHAT (CONTENT)** → Go to **9**.
  *   **HOW (MODE)** → **LEAF E: Adverbialism.** *Awkward commitment:* Must analyze 'seeing a red square' as 'being-sensually-rectangularly-and-redly-modified' without objects.

  **9. BLURRY VISION:** In the *Blurry Vision* case, is the blurriness part of the accuracy conditions (the world is represented as blurry)?
  *   **YES** → **LEAF F: Strong Intentionalism.** *Awkward commitment:* Must claim the world is represented as blurry even when you know the blur is in your eye.
  *   **NO** → **LEAF G: Qualitative Intentionalism.** *Awkward commitment:* Phenomenal character outstrips representational content; 'qualia' return via the mode.

  **10. PHENOMENAL SHARE:** (From Q6=YES / Disjunctivism) Do Veridical and Hallucinatory experiences share a **common phenomenal character** (a shared mental kind)?
  *   **YES** → **LEAF H: Content Disjunctivism.** *Awkward commitment:* Disjunctive metaphysics but common phenomenal kind; tension between 'same feel' and 'different nature'.
  *   **NO** → Go to **11**.

  **11. EPISTEMIC ACCESS:** (From Q10=NO) Can the subject know from the **inside alone** that they are in the Veridical case?
  *   **YES** → **LEAF I: Epistemic Disjunctivism (McDowell).** *Awkward commitment:* Denies the 'Highest Common Factor' conception of knowledge; internal state reflects external fact.
  *   **NO** → **LEAF J: Standard Metaphysical Disjunctivism (Martin/Fish).** *Awkward commitment:* Subjective indistinguishability is not a positive phenomenal property but a failure of knowledge.

  ***

  ### ANNOTATIONS & EMPTY BRANCHES

  **EMPTY BRANCH 1 (Q4=YES):** *Incoherence.* If you posit an object in Hallucination but deny it is the same kind as Veridical, you accept the ontology of the Argument from Illusion (there is an object) but reject its conclusion (therefore Veridical is the same). This leaves you with the baggage of Sense-Data (private objects) without the theoretical unity. Unexplored because it offers no advantage over Sense-Data or Disjunctivism.

  **EMPTY BRANCH 2 (Q7=LIGHT/EXPERIENCE):** *Unattractive.* If you claim the subject is related to the stick (Relationalism) but the redness is not in the stick (nor dispositional), you sever the property from the object. This forces you to say we perceive objects but not their colors, or that colors are projected. This usually collapses into Representationalism (colors are represented, not related to) or Error Theory, making the 'Relational' label misleading.

  **INDISTINGUISHABLE LEAVES:**
  *   **Leaf G (Qualitative Intentionalism)** and **Leaf E (Adverbialism)** are often functionally identical regarding the *Blurry Vision* case. The tree separates them based on whether they retain 'content' talk. If you think 'content' is just a façon de parler for 'mode', these leaves merge.
  *   **Leaf D (Naive Realism)** and **Leaf J (Standard Metaphysical Disjunctivism)** are frequently co-extensive. Naive Realism is typically the positive account of the Veridical case within Metaphysical Disjunctivism. They are separated here only to distinguish the view focused on the *relation* (Naive) from the view focused on the *argument against Common Kind* (Disjunctivism).

  ### CASE NOTES FOR DISCUSSION
  *   **Müller-Lyer:** Treat as *Illusion* (Bent Stick fork). If a view handles Bent Stick but fails Müller-Lyer (e.g., claims cognitive penetration), note it at **Node 6**.
  *   **Afterimage:** Treat as *Hallucination* (Node 1). If a view posits an object here but not in Perfect Hallucination, they must justify the ontological difference at **Node 1**.
  *   **Veridical Hallucination:** Used at **Node 3** to test whether the view requires a causal link or mere matching. Crucial for separating Sense-Data variants.
