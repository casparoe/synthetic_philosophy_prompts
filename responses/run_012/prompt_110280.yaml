          *   No citations/references.

  2.  **Deconstruct the Logical Space:**
      *   The core tension is between the *phenomenal character* of experience (what it's like) and the *metaphysical nature* of the objects/properties involved.
      *   The Argument from Illusion/Hallucination pushes towards a "Common Kind" assumption (Veridical and Non-veridical experiences share the same immediate object/nature).
      *   Disjunctivism pushes back (Veridical and Non-veridical are fundamentally different kinds).
      *   Representationalism tries to bridge the gap via content.
      *   Adverbialism tries to dissolve the object requirement.

      *Key Distinctions needed:*
      1.  Is there an immediate object of experience? (Object vs. Adverbial/Content)
      2.  If yes, is it mind-independent? (Realism vs. Sense-Data)
      3.  Do Veridical and Hallucinatory experiences share the same fundamental nature? (Common Kind vs. Disjunctivism)
      4.  Do Veridical and Illusory experiences share the same fundamental nature? (Often treated differently in Disjunctivism)
      5.  Is the phenomenal character determined by the object or by internal representation?

      *Refining the Cases:*
      *   *Bent Stick (Illusion):* Object exists, property misperceived.
      *   *Müller-Lyer (Illusion):* Object exists, property misperceived (cognitive vs perceptual).
      *   *Afterimage:* No external object, but seems like one.
      *   *Perfect Hallucination:* No external object, subjectively identical to veridical.
      *   *Veridical Hallucination:* No causal link, but matches world.
      *   *White Wall/Red Light:* Object exists, color property ambiguous (dispositional vs physical).
      *   *Blurry Vision:* Is blur a property of the object or the experiencing?

