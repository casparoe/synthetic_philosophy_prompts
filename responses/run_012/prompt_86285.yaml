  hey, so I've got to write up my views on probability for a seminar next week and I want a sanity check before I say any of this out loud. here's the package, dont hold back:

  1. I'm a Humean about laws of nature — laws are just the best systematization of the total pattern of what actually happens, nothing extra gluing the world together.
  2. I think objective chances are real, and they're not just disguised facts about anybody's credences. The world genuinely has chancy goings-on.
  3. I accept the Principal Principle pretty much as stated: if I know the chance of something is 0.3, my credence should be 0.3 (setting aside undermining cases).
  4. I think chances explain the frequencies, not the other way around. The single-case chance is what does the grounding work; the long-run statistics are downstream of it.
  5. When I'm actually doing science I'm a frequentist. When a paper says the probability of some decay is such-and-such, I read that as a claim about the long-run relative frequency across hypothetical repetitions, nothing more.
  6. I think credences are only rational if they're calibrated — a good forecaster is one whose 70% claims come true about 70% of the time.

  which of these actually pull against each other, and which just look like they do? I suspect some of it is fine and some of it isn't but I genuinely can't tell which is which. order the real tensions by how bad they are, say what has to give in each case, and then tell me which single edit would clean up the most. and please dont just tell me I'm confused about what 'chance' means — I know the vocabulary, I want to know whether the commitments hang together as a package.
