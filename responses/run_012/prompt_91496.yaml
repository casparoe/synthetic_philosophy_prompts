answer: |-
  # Methodological Preamble: Specification of Pure Time Preference

  This document specifies the structural requirements for any theory of pure time preference ($\delta$) adopted by the Endowment. These requirements precede the selection of a numerical rate. They define the logical and ethical boundaries within which the rate must operate. Requirements are tagged as **Non-negotiable** (features of the phenomenon or mathematical necessities) or **Commitment** (ethical or modeling choices subject to governance).

  ## I. The Cases
  *The theory must provide a determinate output for the following scenarios.*

  1.  **Pure Delay**
      *   **Specification:** Two programs are identical in goods, recipients (the very same people), risk profile, and opportunity cost, differing only in the date of delivery. The theory must state whether the later delivery is worth less, and if so, identify the ground for that loss of value.
      *   **Status:** **Non-negotiable.** This is the definitional test of pure time preference. Failure to isolate time from all other variables renders the theory incapable of measuring $\delta$.

  2.  **A Non-Growing Good**
      *   **Specification:** A fixed, irreplaceable stock (e.g., a specific hectare of wilderness or a unique artifact) is delivered now or later. Because the good cannot grow or generate yield, no growth-based discounting applies. The theory must identify whatever discounting survives.
      *   **Status:** **Non-negotiable.** This isolates $\delta$ from the return on capital ($r$). A theory that cannot discount (or fail to discount) a non-yielding asset conflates time preference with investment return.

  3.  **Guaranteed-Richer Recipients**
      *   **Specification:** Future recipients are certain to be wealthier than present recipients. Diminishing marginal utility supplies a reason to prefer present consumption. The theory must isolate the pure component from this utility-based reason.
      *   **Status:** **Non-negotiable.** This separates the pure rate ($\delta$) from the elasticity of marginal utility times growth ($\eta \cdot g$). Conflation here violates the Ramsey rule decomposition.

  4.  **An Empty Future**
      *   **Specification:** The benefit may fall to no one at all, because the recipients may never come to exist. The theory must classify the discount that follows, explicitly stating whether it counts as pure time preference or as a probability discount (existence risk).
      *   **Status:** **Commitment.** Whether existence risk is modeled as a temporal discount or a probabilistic adjustment is a modeling choice, but the requirement to classify it is **Non-negotiable**.

  5.  **Horizon Stability**
      *   **Specification:** An identical benefit is offered at one hundred years and at one million years. The theory must either be stable under extending the horizon (the valuation methodology does not break or invert) or explain why it need not be.
      *   **Status:** **Commitment.** This governs the functional form (e.g., exponential vs. hyperbolic vs. zero). It determines whether the endowment treats the million-year horizon as a continuation of the hundred-year horizon or as a distinct ethical regime.

  ## II. The Distinctions
  *The theory must maintain the following conceptual boundaries without collapse.*

  1.  **Pure vs. Derivative Discounting**
      *   **Specification:** The theory must distinguish discounting due to time itself from discounting due to growth, risk, opportunity cost, or catastrophe.
      *   **Status:** **Non-negotiable.** Conflation renders the rate uninterpretable for long-horizon stewardship.

  2.  **Intra-personal vs. Inter-personal Discounting**
      *   **Specification:** The theory must distinguish discounting one's own later utility from discounting across persons who never coexist.
      *   **Status:** **Non-negotiable.** Rational impatience for oneself does not logically entail discrimination against future generations.

  3.  **Pure Rate vs. Overall Social Discount Rate**
      *   **Specification:** The theory must distinguish $\delta$ from the social discount rate ($r$).
      *   **Status:** **Non-negotiable.** $r$ includes growth and risk components; $\delta$ does not. Using $r$ as a proxy for $\delta$ is a category error.

  4.  **Discounting Utility vs. Discounting Consumption**
      *   **Specification:** The theory must specify whether the rate applies to well-being (utility) or to goods (consumption).
      *   **Status:** **Non-negotiable.** Applying a pure time preference to consumption without adjusting for marginal utility double-counts the growth effect.

  5.  **Rate vs. Horizon Compounding**
      *   **Specification:** The theory must distinguish the annual rate from the horizon over which it compounds.
      *   **Status:** **Non-negotiable.** A small rate compounded over a million years yields a different ethical result than a large rate over ten years. The theory must account for the magnitude of the exponent.

  ## III. The Formal Results
  *The theory must be mathematically consistent with the following properties.*

  1.  **Limit Behavior**
      *   **Specification:** A constant positive pure rate drives the present value of any fixed future benefit toward zero as the horizon grows to infinity.
      *   **Status:** **Non-negotiable.** This is a mathematical truth of exponential discounting.

  2.  **Time Consistency**
      *   **Specification:** A constant pure rate yields exponential, time-consistent discounting (preferences do not reverse merely due to the passage of time). Any rate that declines with the horizon is time-inconsistent.
      *   **Status:** **Non-negotiable.** This is a mathematical property of dynamic optimization.

  3.  **Compounding Structure**
      *   **Specification:** Pure and growth-based components compound (multiply) in the present value calculation, rather than add.
      *   **Status:** **Non-negotiable.** This follows from the isoelastic utility framework standard in intertemporal choice.

  ## IV. Incompatible Requirements
  *The following pair of requirements cannot be jointly satisfied under a positive pure time preference.*

  **The Pair:** **Formal Result 2 (Time Consistency)** and **Case 5 (Horizon Stability, interpreted as non-vanishing moral weight).**

  **The Argument:**
  To satisfy **Formal Result 2**, the discount rate must be constant over time. If the rate is constant and positive, **Formal Result 1** dictates that the present value of a benefit at a million-year horizon approaches zero. This effectively renders the million-year benefit morally negligible compared to the hundred-year benefit.

  To satisfy **Case 5** under an interpretation where "Stability" requires that the distant future retains non-trivial moral weight (i.e., the valuation does not vanish), the discount rate must either be zero or decline as the horizon extends. However, a declining discount rate violates **Formal Result 2**, introducing dynamic time-inconsistency (the Endowment would rationally prefer to deviate from its current plan in the future).

  Therefore, the Endowment cannot simultaneously maintain a positive pure time preference, ensure time-consistent planning, and assign non-negligible value to the million-year horizon. One must be sacrificed: either accept time-inconsistency (declining rate), accept the vanishing of the distant future (constant positive rate), or abandon positive pure time preference (zero rate).

  ## V. The Most Restrictive Requirement
  *The single requirement that does the most to rule out the most popular positions.*

  **Requirement:** **Case 1 (Pure Delay).**

  **What It Rules Out:**
  This requirement rules out the use of the **market interest rate** (or opportunity cost of capital) as a proxy for pure time preference.

  **Justification:**
  Most prevailing cost-benefit analyses justify discounting by citing the return on investment (the money could be invested today and grow). Case 1 explicitly removes opportunity cost and growth from the scenario. It forces the theory to justify discounting *solely* on the basis that the future is the future.
  *   If the theory claims the later good is worth less in Case 1, it must defend "pure impatience" as an ethical axiom, which is widely contested in intergenerational ethics (Ramsey's "ethically indefensible" critique).
  *   If the theory claims the later good is equal in value in Case 1, then $\delta = 0$.
  This requirement strips away the economic justifications (growth, risk, capital displacement) that usually shield positive discount rates from ethical scrutiny, forcing the Endowment to either defend pure impatience or set the pure rate to zero.
