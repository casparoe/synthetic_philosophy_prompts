answer: |-
  This is a sharp diagnostic of a central tension in metaontology. The test your friend proposed is a refined version of what is often called the "equivalence test" or a "principle of charitable interpretation." It attempts to operationalize the intuition that substantive disputes must involve a clash of *facts*, whereas verbal disputes involve a clash of *frameworks* that can be translated into one another without loss.

  Here is an analysis of what the test is grasping at, why it stalls, and what happens when you press it on the points you raised.

  ### (a) The Intuition: Separating Content from Theoretical Role

  The test codifies a specific intuition about the architecture of disagreement: **that the "point" of an assertion is separable from its "form."**

  When you assert "The tomato is a fruit," you are doing two things simultaneously. First, you are committing to a state of affairs (the botanical classification). Second, you are signaling that this classification matters for some purpose (culinary, biological, legal). The test assumes that if two parties disagree, we should be able to isolate the *purpose* (what the speaker cares about) from the *syntax* (the specific words used).

  The temptation of the test lies in its promise of **semantic invariance**. It suggests that if there is a genuine fact of the matter, it should be robust enough to survive translation. If I believe $P$ and you believe $\neg P$, but I can rephrase $P$ as $Q$ such that you accept $Q$, and $Q$ does everything $P$ was supposed to do for me, then our disagreement was never about the world; it was about which label to stick on $Q$.

  This relies on a Gricean-like distinction between *what is said* and *what is implicated*, but elevated to the metaphysical level. It assumes that "what the speaker cared about" (the theoretical role of the entity in their ontology) is accessible and stable. If the theoretical role can be fulfilled by a paraphrase the opponent accepts, the ontology was merely a vehicle for that role, not the destination. The test is tempting because it offers a decision procedure for dissolving pseudo-problems: it turns metaphysics into a translation manual.

  ### (b) The Circularity: Accessing "What is Cared About"

  The circularity you suspect is real, and it strikes at the heart of the "preservation" clause. To determine if a paraphrase preserves "everything the first party cared about," you must already have a grip on what the first party meant.

  Consider the Statue and the Lump.
  *   **Party A:** "The statue and the lump are distinct objects."
  *   **Party B:** "No, there is only the lump."

  The test asks: Can we paraphrase A's claim in a way B accepts that preserves what A cares about?
  *   **Scenario 1:** A cares about *modal properties* (the lump could survive being squashed; the statue could not). B accepts this modal difference but denies it implies two *objects*. B offers a paraphrase: "There is one object that satisfies statue-conditions and has different modal properties than if it satisfied only lump-conditions."
  *   **The Snag:** Does this preserve what A cared about?
      *   If A cares about **modal profiles**, then yes. The dispute is verbal (or quasi-verbal).
      *   If A cares about **ontological counting** (there are literally *two* things here), then no. The paraphrase fails.

  To run the test, you must decide whether A's commitment to "two objects" is a substantive claim about reality or just a emphatic way of talking about modal profiles. But *that* is exactly what the dispute is about.

  The test requires you to know the **truth-conditions** of the assertion to see if they are preserved, but in metaontological disputes, the truth-conditions are precisely what is contested. You cannot use the test to *discover* if the dispute is verbal, because you must *assume* an interpretation of the speakers' intentions (substantive or verbal) to judge if the paraphrase is adequate. The test doesn't solve the ambiguity; it requires you to resolve the ambiguity before you can apply it.

  ### (c) Relativizing to Purpose: Collapsing Ontology into Pragmatics?

  You ask if relativizing verbality to a "shared question or purpose" breaks the circle. This moves the debate from **metaphysics** (what exists) to **meta-pragmatics** (what we are trying to do).

  If we say the tomato dispute is verbal *relative to culinary purposes* but substantive *relative to botanical purposes*, we avoid the circularity by fixing the context. However, this introduces a new tension: **Does this collapse "merely verbal" into "not worth arguing about"?**

  1.  **The Collapse Risk:** If a dispute is merely verbal whenever the parties can agree on the underlying facts relevant to their interests, then "substantive" just means "we have conflicting interests that cannot be paraphrased away." On this view, there is no such thing as a purely ontological fact that floats free of human purpose. The distinction between verbal and substantive becomes a distinction between *pragmatically resolvable* and *pragmatically intractable*. This threatens to dissolve metaontology into sociology or decision theory.
  2.  **Preserving the Distinction:** To save the distinction, one must argue that there are **privileged purposes**. For example, a realist might argue that the purpose of ontology is "carving nature at its joints." If a paraphrase preserves all *human* interests but fails to capture the *mind-independent structure*, the dispute remains substantive.
      *   *The Trouble:* This just pushes the problem back. How do we know if a paraphrase captures the "mind-independent structure"? We are back to needing access to the world without the lens of language.

  Relativizing saves the test from circularity by making verbality a three-place relation (Dispute, Speaker A, Purpose P) rather than a two-place relation (Dispute, World). But it does so at the cost of making ontology interest-relative. If you are willing to pay that price, the test works. If you believe ontology seeks mind-independent truths, the test fails because "what is cared about" is no longer a reliable guide to "what is the case."

  ### (d) Self-Application and the Regress

  When you turn the test on itself, the fragility of the "preservation" criterion becomes glaring.

  Imagine two metaontologists, **Meta-A** and **Meta-B**.
  *   **Meta-A:** "The Statue/Lump dispute is merely verbal."
  *   **Meta-B:** "No, it is substantive."

  Run the test on *this* disagreement.
  *   Can Meta-A paraphrase their claim ("It's verbal") in a way Meta-B accepts?
  *   Meta-A might say: "I mean 'there is no fact of the matter beyond linguistic convention'."
  *   Meta-B says: "I reject that. I mean 'there is a fact of the matter, and you are missing it'."

  To check if a paraphrase preserves what Meta-A "cares about," we need to know what Meta-A cares about. Do they care about **dissolving the problem** (showing it's a confusion) or **describing the semantics** (showing it lacks truth conditions)?
  *   If Meta-B offers a paraphrase: "You mean 'the dispute is unresolvable by current methods'?"
  *   Meta-A says: "No, that preserves the idea that there *might* be a fact, which I deny."

  **The Regress:** To decide if the second-order dispute is verbal, you need a test. If you use the same test, you need to determine what the metaontologists "care about." But their "care" is constituted by their metaontological commitments.
  *   If you are a realist, you "care" about truth conditions.
  *   If you are a deflationist, you "care" about linguistic utility.

  There is no neutral standpoint from which to judge what counts as "preserving what is cared about." The test cannot adjudicate the second-order dispute because the criteria for "preservation" are themselves the subject of the second-order dispute.

  This leads to a regress not of *levels* (third-order, fourth-order), but of **interpretive frameworks**. The test assumes a shared background of what counts as a "loss" in translation. But in metaontology, the parties disagree on what constitutes a loss. To the deflationist, losing "metaphysical weight" is not a loss; it's a gain in clarity. To the realist, it is a fatal loss. The test cannot bridge this gap because it relies on the very agreement it seeks to establish.

  ### The Underlying Tension

  The conceptual trouble your group is circling is this: **The test treats "what is cared about" as a pre-theoretical given, but in metaontology, "what is cared about" is theory-laden.**

  The test works perfectly for clear-cut cases (e.g., "The bank is steep" vs. "The bank is financial") because we share a pre-theoretical grip on the interests involved (geography vs. finance). It fails in metaontology because the "interests" are metaphysical commitments.

  *   If you assume the realist's interests are legitimate, the paraphrase always fails (it leaves out the "real" existence), so the dispute is substantive.
  *   If you assume the deflationist's interests are legitimate, the paraphrase always succeeds (it captures all the "real" facts), so the dispute is verbal.

  The test does not resolve the dispute; it **reveals your prior commitment**. If you think the test shows the dispute is verbal, you have already decided that the paraphrase was adequate, which means you have already decided that the ontological commitment wasn't doing any heavy lifting.

  **Conclusion:** The test is not a tool for *discovering* whether a dispute is verbal; it is a tool for *expressing* your stance on the dispute. It is circular not because it is poorly designed, but because the distinction between "verbal" and "substantive" is not a feature of the dispute itself, but a feature of the interpretive charity you are willing to extend to the participants. The snag your group faces is the realization that there is no "view from nowhere" to judge what counts as a preserved meaning.
