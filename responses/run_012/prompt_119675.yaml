      *   *Check:* Is the regress argument in (d) clear? It's not just an infinite regress of tests, but a regress of *interpretive frameworks*.
      *   *Check:* Am I being too dismissive of the test? The user wants to know where it fails, but also what it grasps at. Acknowledge its utility as a heuristic while showing its failure as a criterion.

