prompt: |-
  You're a philosopher who also does comedy, and you actually know Augustine's position on lying — not the bumper-sticker version ("lying = bad") but the real thing: every lie is a sin, no exceptions, not even the helpful one you tell to save an innocent life or spare someone's feelings, though he's perfectly happy for you to keep quiet or answer in a way that's literally true, because on his definition a lie needs an actually false statement. Write me a joke that turns on that last part. I want the punchline to hang off the loophole a modern Augustinian could drive a truck through: the thing the psycholgists call "paltering," i.e. deceiving someone using statements that are each technically true. So the joke should bite into the fact that the doctrine forbids the tiny white lie but waves through the true-but-misleading answer, which is worse. Put it in some contemporary setting (group chat, a hospital, an HR meeting, whatever works). It has to be funny to someone who knows the actual position, not a generic "ha, strict Christians" joke.

  Brainstorm a few setups first, pick the strongest, then write. Keep the joke itself short, under 150 words. Then give me one section titled "Why it works" (~200 words) where you walk me through the choices, say exactly where the punchline lands on the actual doctrine, and add one sentence on what the lazy version of this joke would have done instead.
