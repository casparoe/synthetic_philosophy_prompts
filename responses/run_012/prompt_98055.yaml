answer: |-
  My friend is hiding a witness from the mob. The goons bang on the door: "Is he in there?"
  My friend knows Augustine's rule: A false statement is always a mortal sin, even to save a life.
  So he doesn't say "No." He says, "I haven't seen anyone enter this house since noon."
  Technically true. The witness climbed the fire escape.
  The goons leave. The witness whispers, "You lied for me."
  My friend adjusts his glasses: "I didn't lie. I paltered. Augustine says a false statement damns you, but misleading someone with facts is just 'prudent management of information.' I saved your life and my soul by making the deception bigger but the syntax cleaner."

  ### Why it works

  The setup invokes Augustine's *De Mendacio* case study (hiding a fugitive) now updated to mobsters for contemporary stakes. The humor relies on the audience knowing Augustine carefully distinguishes between the *material* falsity of a statement and the *intent* to deceive. Augustine argues lying corrupts the human soul's relationship with God, regardless of ultimately beneficial outcomes. The punchline lands on the doctrinal loophole: Augustine prohibits *falsiloquium* (speaking what is false) but permits misleading implications if the proposition itself holds. By having the character claim he made the "deception bigger but the syntax cleaner," the joke exposes the absurd priority of semantic purity over moral transparency. It satirizes the idea that God audits syntax rather than intentions, allowing calculated deception (paltering) while strictly forbidding compassionate falsehood. This highlights the specific friction in Augustinian ethics where the *mechanism* of sin matters more than the *consequence*. For Augustine, language is a divine tool that cannot be bent, even for mercy. The lazy version of this joke would have simply portrayed Augustine as a monster who lets the witness die to avoid sin, missing the actual philosophical tension that he *will* save the witness, he just refuses to corrupt the proposition itself to do it.
