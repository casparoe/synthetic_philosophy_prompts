      *   *Verdict:* The machine removes uncertainty about the *last node's action*, but not uncertainty about the *penultimate node's reasoning*. It tightens the noose but doesn't strangle the "uncertain rationality" argument unless CKR is restored.

  8.  **Synthesize and Structure:**
