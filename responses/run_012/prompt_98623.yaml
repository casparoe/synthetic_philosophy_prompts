answer: |-
  **Sketch Summary:** Guest denies temporal succession, positing discrete states; relies on idealist lineage and Buddhist momentariness; vulnerable on the temporality of her own argumentation and the coherence of non-temporal multiplicity.

  ***

  **1.** You reconstruct Borges's argument as an extension of Berkeley and Hume: if matter and the self are denied, time should follow. But Berkeley's idealism is a contested theory of perception. If we reject idealism and grant that matter exists independently of the mind, does your refutation of time collapse, or is it hostage to that specific metaphysical scaffolding?

  *Follow-up:* You will likely say the argument stands independently of idealism. But Berkeley's denial of matter rests on the immediacy of perception. Does your denial of time similarly rest on the immediacy of the present moment in a way that requires us to privilege the phenomenological over the physical?

  **2.** Let's look at the structure of your own book. An argument moves from premises to a conclusion; a reader moves from page one to page ten. If there is no genuine succession, how can an argument have successive steps, and how can the reader pass from premise to conclusion without presupposing the very time you deny?

  *Follow-up:* You will likely distinguish logical implication from temporal sequence, calling the reading merely the "occasion" for grasping a timeless truth. But if the reading is merely the occasion, does the truth of your conclusion depend on the reader? If not, why write the book? If so, doesn't the occasion itself require time?

  **3.** You describe our impression of duration as a "projection." But projection is a verb that implies a projector operating across an interval. Does your own notion of a projection secretly presuppose the very time it denies, or is the mechanism of illusion contained entirely within a single instant?

  *Follow-up:* You will likely say the "projection" is a metaphor for structural complexity within the instant. But if the instant contains the structure of a "past," isn't the instant itself extended? How do you avoid making the instant a miniature timeline that smuggles succession back in?

  **4.** If succession goes, what is left? Are we left with one single instant, or many? If many, how can a multiplicity of instants constitute a stream without re-importing an ordering relation—and isn't any ordering relation, even a logical one, itself temporal in nature?

  *Follow-up:* You will likely say they are distinct by content, not order. But if content differs, isn't that difference a kind of ordering? Is "difference" itself non-temporal, or are you relying on a notion of diversity that only makes sense against a background of comparison?

  **5.** Hume denied the persisting self; you deny time. What grounds the state that seems to remember a past if no state can be caused by an earlier one, and what is the "I" that undergoes the illusion of duration if there is no subject persisting through the states?

  *Follow-up:* You will likely say the "I" is also a momentary construct. But then who is deceived? Can an instant be deceived about its own relation to other instants it doesn't touch, or does this require a vantage point outside the instant?

  **6.** Normally, memory is veridical because it is caused by past experience. If no state is caused by an earlier one, what grounds the memory-state? Are we left with a pre-established harmony where memory-states simply correlate with "past"-states without connection?

  *Follow-up:* You will likely appeal to brute correlation rather than causation. But does that not require a Coordinator outside the system to ensure the match? If you deny the Coordinator, aren't you left with a cosmic accident where our memories just happen to match reality?

  **7.** You argue your view converges with the Buddhist doctrine of momentariness. But momentariness is standardly paired with moment-to-moment causal conditioning (*pratītyasamutpāda*), which looks like the succession you deny. Is momentariness really an ally, or are you stripping Buddhism of its causal engine?

  *Follow-up:* You will likely say causality is only conventionally true, not ultimately true. But if causality is only conventional, is your book only conventionally true? Does the ultimate truth you defend render your own defense merely useful fiction?

  **8.** Is your view a conceptual claim about how we think, or an empirical one about how the world is? If it is empirical, what could count against it? If it is conceptual, are you immune to physics, even if science finds time fundamental to spacetime?

  *Follow-up:* You will likely say it is metaphysical, transcending both. But if physics finds time fundamental, must you reject physics? Are you positioning your view such that no empirical evidence could ever falsify it, and does that protect it or isolate it?

  **9.** If time is an illusion, what happens to moral responsibility? If I cannot act now to change a future that does not exist, is ethics also a momentary state? Does your view survive the transition from metaphysics to the lived experience of choice?

  *Follow-up:* You will likely say ethics operates on the conventional level of illusion. But if the illusion is total, is the suffering we try to prevent also unreal? Does your view risk dissolving the motivation to alleviate suffering along with the time it occurs in?

  **10.** I want to give you the floor to state the positive case. Why prefer this view? What explanatory work does a Borgesian ontology do that the A-theory or B-theory of time doesn't, and what philosophical problem does it solve that makes the cost worth paying?

  *Follow-up:* You will likely say it dissolves paradoxes of change and identity. But does it solve them or merely dissolve the questions? Is dissolution a solution, or is it a resignation that we cannot understand the world as it appears?

  ***

  **Private Note:**
  Question 3 (the "projection" mechanism) is the most likely to expose a weakness. Her position relies on the instant containing the *appearance* of duration without the *reality* of it. If she cannot explain how an instant structurally mimics a timeline without actually having temporal parts, the view collapses into a contradiction where the instant is both point-like and extended. This is the hardest metaphysical knot to untie without smuggling time back in.
