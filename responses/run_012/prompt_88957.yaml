answer: |-
  "I'd like to propose a toast to Grandpa's printing shop. After a month in the archives, I've realized we actually have three business plans for the future.

  Uncle sees a **model**: he looks at the bankruptcy and says, 'He built an empire from nothing, so we can too!'—which is inspiring, provided you ignore that the empire collapsed.

  Mom sees a **shrine**: she looks at the ledgers and says, 'Don't straighten the corners, the decay is part of the history!'—which is reverent, provided you don't need the space to live in.

  And I saw a **prison**: I wanted to burn the ledgers to break the chain and prove we owe the past nothing.

  But I realized I can't. Because I've spent the last thirty days cataloging every receipt so I'd know exactly which ones to burn first.

  So, to Grandpa: I tried to be the judge who sentences your memory to death, but I think I've just become the clerk who files the execution papers."
