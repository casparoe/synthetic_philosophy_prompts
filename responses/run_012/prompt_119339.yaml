          *   Verdict dependency: If one demands a "God's eye view" of existence, CIP fails (due to vagueness). If one accepts existence is tied to explanatory utility, CIP succeeds.

      *   **Conclusion:**
          *   Verdict: CIP is satisfactory *provided* we abandon the demand for sharp metaphysical boundaries. It is the best guide for identifying *substantial* objects, even if "existence" turns out to be somewhat conventional.
