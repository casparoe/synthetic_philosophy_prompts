      *   *Critique:* The Argument from Vagueness is the biggest hurdle. I need to be careful not to dismiss it lightly. Sider's argument is that if composition is restricted, there must be a *sharp* cutoff in a continuous series. CIP relies on *degrees* of integration. Therefore, CIP implies vagueness. If vagueness in ontology is impossible, CIP is false (or leads to Universalism).
      *   *Strategy:* I will argue that the Argument from Vagueness presupposes a binary view of existence that CIP challenges. However, to be fair, I must acknowledge that if one accepts Sider's premise, CIP fails. My verdict will be that CIP is satisfactory *for our purposes* (scientific/ordinary), even if it doesn't satisfy the hyper-realist demand for sharp boundaries. I will lean towards a "conceptualist" or "pragmatic realist" interpretation to save it.
      *   *Case Study Nuance:* Tumor. Do tumor cells compose a tumor? Yes. Do they compose part of *me*? No. CIP handles this well.
