          *   Define SCQ.
          *   Introduce CIP.
          *   State the thesis/verdict early (or build to it). Let's aim for a nuanced verdict: CIP is the *best available* restricted answer but faces significant vagueness issues that require a pragmatic/conventionalist resolution. It is satisfactory *if* understood as a pragmatic guide rather than a metaphysical absolute.

      *   **Section 1: Situating the Principle:**
          *   *Extremes:* Universalism (Lewis/Sider) says composition always happens. Nihilism (Rosen/Dorr) says it never happens (only simples exist). CIP is a restricted composition view.
          *   *Familiar Restricted Answers:*
              *   *Contact/Fastening:* Too weak (glued bricks aren't necessarily one object in the deep sense) or too strong (scattered parts).
