      *GABLE FALLS*—In a landmark administrative restructuring aimed at maximizing epistemic humility, the Gable Falls City Council voted Tuesday to dissolve its municipal court system, replacing it with the Gable Falls Forensic Adjudication League (GFFAL). Under the new charter, all civil disputes and misdemeanor charges will be resolved through formal competitive debate rounds, presided over by panels of residents screened specifically for their total lack of legal knowledge.

