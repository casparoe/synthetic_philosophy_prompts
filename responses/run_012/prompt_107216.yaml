prompt: |-
  so i somehow ended up as the token philosopher on our hospital's ethics consult service this year, and I keep getting pulled into cases where the deontological answer (you can't do that, it's a rights violation, full stop) and the "but refusing means more of the same harm happens downstream" answer collide. I've always been a constraints person — rights over consequences — but a colleague cornered me last week with the old paradox, roughly: if violating a constraint is so serious, why is it suddenly fine to stand by while five violations happen rather than commit one yourself? I folded, honestly, and it's been bugging me since.

  I've got maybe a day a week for the next year to actually read and think about this, and I dont want to waste it on the wrong questions. So: what are the open questions around the paradox of deontology that matter most, and which would you put first? I want the ordering and the reasoning behind it, not a survey. For each one, tell me why it's upstream of the others, how tractable it is for someone doing this part-time rather than as their whole job, and what would move it up or down my list. Things I'm wondering about, though dont feel bound by them: whether the paradox is a genuine reductio of deontology or just an artifact of letting the consequentialist framing set the terms; how agent-centered constraints relate to agent-centered prerogatives, and whether the prerogative half is quietly doing the real work; whether thresholds or some rule for choosing among competing constraints can dissolve the thing; and whether it all evaporates once you stop thinking in terms of "minimizing violations" at all. If theres something I'm not listing that belongs at the top, say so and defend it.
