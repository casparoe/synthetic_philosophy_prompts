      *   *Modernity Thesis:* I need to accept it but not let it comfort. The tools (bureaucracy, trains, records) are still here. We cannot say "never again" simply by rejecting "barbarism" because this was done by "civilized" means.

  3.  **Drafting - Section by Section:**

