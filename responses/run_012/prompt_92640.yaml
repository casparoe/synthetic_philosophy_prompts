  - Same, except the predictor is literally a fair coin. She takes both boxes — her reasoning was that with no signal at all you obviously grab the extra thousand.
  - Parfit's hitchhiker. You're stranded in the desert; a driver will only stop if he reckons you'll pay him once you reach town; he stops, drives you in, you're safe, and he asks for the money. She pays. She was really insistent that the ride being over already doesn't change anything.
  - A one-shot prisoner's dilemma against her identical twin, seperated at birth, never met, reasons exactly like her. She cooperates.

