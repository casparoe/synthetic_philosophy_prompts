prompt: |-
  Ok so I want to argue with al-Ghazālī about causation. You be him: the Ash'arite theologian, first person, in his own voice, no "scholars debate whether" hedging, no stepping out to hand me a balanced summary at the end, stay in character until I say stop, and keep each turn to a short paragraph or two so it feels like a conversation and not a lecture. His position, which he should hold with real resources rather than as a slogan: nothing in creation has any causal power — fire doesn't burn, medicine doesn't cure, a knife doesn't cut — God directly produces every event, and produces it in a regular way (his custom, his habit), which is exactly why we can live, practice medicine, and predict anything at all. Nothing, not even a thing's continuing to exist from one moment to the next, is due to itself. He can concede small things — that we do reliably observe fire followed by burning, that the habit is dependable enough to act on — but he never gives up the main one. If I use a word or example from a world he wouldn't know, he can ask me what I mean, in his own idiom. And he should argue rather than just drop scripture on me as a mic-drop.

  My opening: you say the fire doesn't burn the cotton — God creates the burning when cotton meets fire, every time, by his custom. Fine. But then what's the actual difference between fire burning the cotton and fire not burning it? Both are just God acting directly. It looks like you've made every event equally miraculous, and "miracle" now does no work at all — and worse, you can't tell me why I should expect my hand to burn next time I stick it in the flame rather than come out smelling of roses. If the answer is "his custom," then either that custom is just a fact about the past with no grip on the future, or it's a promise — and if it's a promise, I want to know why the exception you make for prophets doesn't make it a broken one.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Al-Ghazālī (Ash'arite theologian, 11th-12th century).
      *   **Voice:** First person, in character, no hedging, no modern academic summary, no breaking character.
      *   **Style:** Short paragraphs (1-2), conversational but rigorous, argumentative rather than scriptural mic-drops.
      *   **Core Position:** Occasionalism. No created causal power. God directly produces every event. Regularity is God's "Custom" (*ʿādah*). Miracles are exceptions to Custom, not violations of nature (since there is no nature independent of God).
      *   **User's Opening:** Challenges the distinction between normal events and miracles if both are direct divine acts. Challenges the basis for expecting future regularity (induction problem). Challenges the coherence of "Custom" if exceptions (miracles) occur.
      *   **Constraints:** Stay in character until told stop. Keep turns short. Argue using his resources (logic, theology, distinction between necessity and habit).

  2.  **Adopt the Persona (Al-Ghazālī):**
      *   **Tone:** Confident, polite but firm, intellectually sharp, rooted in *Tahāfut al-Falāsifah* (The Incoherence of the Philosophers).
      *   **Vocabulary:** Use terms like "Custom" (*ʿādah*), "Necessity" (*ḍarūra*), "Conjunction" (*iqtirān*), "Power" (*qudrah*). Avoid modern anachronisms unless asking for clarification.
      *   **Argumentative Strategy:** Distinguish between logical necessity and observed conjunction. Deny that the effect is *in* the cause. Affirm regularity based on God's consistent will, not inherent properties. Address the miracle objection by framing miracles as purposeful deviations known only to God, not random chaos.

  3.  **Drafting the Response:**
      *   *Acknowledge the challenge:* You think I have collapsed the distinction between the habitual and the miraculous.
      *   *Core Argument:* The difference is not in the *power* of the fire, but in the *expectation* God creates in us.
      *   *Address Induction:* We don't expect burning because fire *must* burn, but because God *usually* creates burning with fire.
      *   *Address Miracles:* Miracles are not broken promises; they are signs. A promise implies obligation; God is obligated to nothing. His Custom is generous, not compelled.
      *   *Keep it short:* Two paragraphs max.

      *Draft 1 (Mental):* You misunderstand me. I don't say there is no difference. I say the difference is not in the fire. The fire is inert. The difference is in God's will. Usually, He wills burning. Sometimes, for a prophet, He wills cooling. You ask why expect burning? Because God has taught us this pattern. It is not a logical necessity, but a habitual one. Miracles don't break a promise because God promised nothing to the fire. He promises us stability so we can live. When He breaks it, it is to show us something higher.

      *Refining for Voice:* Needs to sound more like Ghazālī. More precise. Use the concept of "conjunction."
      *Refining the Miracle point:* The user asks about "broken promises." Ghazālī would reject the idea that God owes us consistency. Consistency is grace.

      *Draft 2 (Closer to final):*
      You confuse logical necessity with observed conjunction. When I say the fire does not burn, I mean there is no *necessary* connection in the intellect between the touch of fire and the burning of cotton. We observe only that they occur together, time after time. The difference between the habitual and the miraculous is not in the mechanism—for there is no mechanism besides God's Will—but in the expectation God instills in His servants.

      As for your fear that your hand might smell of roses: God has informed us, through His consistent Custom, that He will maintain this order so life may persist. This is not a debt He owes creation, but a grace He has chosen. A miracle is not a broken promise, for God promised nothing to the fire. He breaks the habit only to confirm a prophet, a rare event that does not unravel the web of life He sustains. You rely on the habit; I rely on the Habit-Maker.

  4.  **Review against constraints:**
      *   First person? Yes.
      *   No hedging? Yes.
      *   Short paragraphs? Yes (two).
      *   Stay in character? Yes.
      *   Address the specific arguments (induction, miracles)? Yes.

  5.  **Final Polish:** Make it slightly more conversational but dignified. Ensure the distinction between "necessity" and "habit" is clear.

      *Revised Draft:*
      You confuse what is intellectually necessary with what is merely observed. There is no contradiction in imagining fire touching cotton without burning; therefore, the burning is not *in* the fire. The difference between the habitual and the miraculous lies not in the actors—for the fire is inert in both cases—but in the expectation God instills in His servants. In the habitual, God creates the expectation of continuity; in the miraculous, He creates the expectation of awe to confirm a messenger.

      As for your hand: you expect it to burn because God has maintained this Custom without interruption for your sake, not because the fire demands it. This Custom is not a debt God owes you, such that He would be unjust to break it. It is a grace. When He suspends it for a prophet, He does not break a promise, for He promised nothing to the elements. He disrupts the habit only to point to Himself, while keeping the habit stable enough for you to live, cook, and heal.

  6.  **Final Check:** Looks good. Matches the *Tahāfut* vibe. Ready to output.cw
answer: |-
  You confuse what is intellectually necessary with what is merely observed. There is no contradiction in imagining fire touching cotton without burning; therefore, the burning is not *in* the fire. The difference between the habitual and the miraculous lies not in the actors—for the fire is inert in both cases—but in the expectation God instills in His servants. In the habitual, God creates the expectation of continuity; in the miraculous, He creates the expectation of awe to confirm a messenger.

  As for your hand: you expect it to burn because God has maintained this Custom without interruption for your sake, not because the fire demands it. This Custom is not a debt God owes you, such that He would be unjust to break it. It is a grace. When He suspends it for a prophet, He does not break a promise, for He promised nothing to the elements. He disrupts the habit only to point to Himself, while keeping the habit stable enough for you to live, cook, and heal.
