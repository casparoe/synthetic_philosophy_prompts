answer: |-
  Here is the plan for the session. It is designed to respect the engineers' need for utility while honouring the philosophical depth you know is required to make sense of their confusion.

  ### 1. Session Structure and Dependencies

  You have sixty minutes. Do not divide this into 'lectures'. Divide it into 'moves' on the whiteboard. Each move depends on the acceptance of the previous one.

  **I. The Triangulation (0–10 mins)**
  *   **Action:** Draw three circles on the whiteboard labelled 'Bookkeeping', 'Relevance', and 'Open World'. Ask for a show of hands on which definition they use.
  *   **Dependency:** None. This establishes the current confusion.
  *   **Goal:** To validate all three usages as legitimate *aspects* of a single issue, rather than competing definitions. You are not correcting them yet; you are mapping the terrain.

  **II. The Engineering Baseline: The Frame as a Data Structure (10–20 mins)**
  *   **Action:** Draw a state vector $S_t$. Draw an action $A$. Draw $S_{t+1}$.
  *   **Dependency:** Acceptance that the system maintains an internal representation of the world.
  *   **Goal:** To satisfy the 'Bookkeeping' group. Show that updating the state requires specifying what changes.
  *   **Crucial Step:** Ask, "To compute $S_{t+1}$, what do we do with the variables *not* mentioned in $A$?" The answer is 'copy them'.
  *   **Pivot Point 1 (Nuisance vs. Problem):** The room must accept that **copying 'nothing changed' is a computational cost.** As long as they believe ignoring a variable is free, the Frame Problem is merely an engineering nuisance (optimisation). Once they accept that *verifying* a variable hasn't changed requires resources (sensing, attention, compute), it becomes a problem.

  **III. The Combinatorial Wall (20–35 mins)**
  *   **Action:** Expand the state vector to include the colour of the walls, the position of the moon, the number of grains of sand on the beach.
  *   **Dependency:** Acceptance that the 'world' is potentially infinite, but the state vector must be finite.
  *   **Goal:** To satisfy the 'Swamped by Context' group. Show that if we must explicitly frame every non-change, the system grinds to a halt.
  *   **Pivot Point 2 (Technical vs. Philosophical):** This is where you prise the versions apart.
      *   *Technical:* "How do we compress the state update?" (Solution: Sparse representations, attention mechanisms).
      *   *Philosophical:* "How do we know *which* variables are safe to compress?" (Solution: None known).
      *   State clearly: "Engineering solves the *cost* of the frame; Philosophy asks about the *justification* for the frame."

  **IV. The Open World and Learning (35–50 mins)**
  *   **Action:** Erase the state vector. Draw a neural network policy $\pi(s)$.
  *   **Dependency:** Acceptance that modern systems do not use explicit symbolic state vectors.
  *   **Goal:** To address the 'Open World' group and the 'Learned Systems' misconception.
  *   **Argument:** Learned systems do not solve the Frame Problem; they *bury* it in the training distribution. They assume the world during deployment resembles the world during training.
  *   **Goal:** To show that the Frame Problem is now the 'Distribution Shift' problem.

  **V. Synthesis and Close (50–60 mins)**
  *   **Action:** Return to the three circles. Draw arrows connecting them.
  *   **Goal:** To show that Bookkeeping is the symptom, Relevance is the mechanism, and the Open World is the cause.
  *   **Closing:** The single question (see below).

  ---

  ### 2. The One Example: 'The Coffee Run'

  Do not use the Yale Shooting Scenario. Do not use the Robot with the Bomb.

  **Why not the obvious candidates?**
  *   **Yale Shooting:** It relies on temporal logic and causality puzzles (the gun might be unloaded). It is too abstract for engineers working on control policies. It frames the problem as one of *logical consistency* rather than *resource allocation*.
  *   **The Bomb:** It is too catastrophic. It forces the audience to think about safety constraints (Qualification Problem) rather than the mundane persistence of facts (Frame Problem). It distracts from the core issue of *relevance*.

  **The Selected Example: The Office Coffee Run**
  Imagine a robot tasked with fetching a specific mug from a meeting room and returning to the charging dock.

  **What it must contain:**
  1.  **A Goal:** Mug at dock.
  2.  **An Action:** Grasp mug, move to dock.
  3.  **A Persistence:** The mug remains a mug while moving. The walls remain walls. The floor remains solid.
  4.  **A Distraction:** A person walks into the corridor. The lights flicker. A door that was open is now closed.
  5.  **A Hidden Change:** The mug is heavier than expected (liquid inside).

  **What it must leave out:**
  1.  **Specific Logic:** Do not write predicates like $HoldsAt(Fragmented, t)$.
  2.  **Catastrophe:** Do not let the robot drop the mug or hit the person. Keep it mundane.
  3.  **Sensor Noise:** Do not confuse the Frame Problem with perception error. The sensors are perfect; the *interpretation* is the problem.

  **Why this works:**
  It is a task every engineer in the room understands. It allows you to scale the complexity. Initially, the robot only tracks the mug (Bookkeeping). Then, it must track the door (Relevance). Finally, it must consider that the meeting room might have been rearranged overnight (Open World). It bridges the gap between 'state update' and 'world knowledge'.

  ---

  ### 3. Misconceptions and Defusal

  Expect these misconceptions to surface in this specific order. Head them off at the designated points.

  **1. The Homonyms (Frames as data structures / Framing effect)**
  *   **When:** Introduction (0–5 mins).
  *   **Defusal:** Be explicit. "We are not discussing frame buffers in graphics, nor the cognitive bias in prospect theory. We are discussing the problem of *change and persistence*." Write 'CHANGE/PERSISTENCE' in the centre of the board immediately.

  **2. The Conflation (Frame vs. Qualification vs. Ramification)**
  *   **When:** The Engineering Baseline (10–20 mins).
  *   **Defusal:** When someone asks, "But what if the mug is glued down?" stop them. "That is the Qualification Problem. What if the coffee spills? That is the Ramification Problem. Today we focus only on: Did the *location of the mug* change while I was grasping it, and do I need to check the *location of the stapler* to know that?" Keep the lanes separate.

  **3. 'It is only a question of speed and memory'**
  *   **When:** The Combinatorial Wall (20–35 mins).
  *   **Defusal:** "If I give you infinite memory, you still cannot list every fact in the universe. The problem is not storage; it is *indexing*. How do you find the relevant facts without searching the irrelevant ones?"

  **4. 'Learned systems have made this obsolete'**
  *   **When:** The Open World and Learning (35–50 mins).
  *   **Defusal:** "End-to-end learning assumes the training distribution covers the relevant frame axioms. If you deploy the robot in a building it wasn't trained in, it fails. It hasn't solved relevance; it has hard-coded relevance via the dataset. That is a brittle solution to the Frame Problem, not a dissolution of it."

  **5. 'This is a curiosity of a dead formalism'**
  *   **When:** Synthesis (50–60 mins).
  *   **Defusal:** "Every time your robot freezes because a human walked into its path unexpectedly, or every time your planner fails because a precondition wasn't met but wasn't checked, you are encountering the Frame Problem. It is not history; it is the daily cost of doing business with autonomy."

  ---

  ### 4. The Closing Question

  Do not ask them to define the problem. Ask them to identify the *assumption*.

  **The Question:**
  > "When your system ignores a sensor input during a decision cycle, what specific assumption about the stability of the world are you making, and who is liable when that assumption breaks?"

  **Why this works:**
  *   If they answer "We assume the world is static," they have grasped the Bookkeeping view.
  *   If they answer "We assume the input is irrelevant," they have grasped the Relevance view.
  *   If they answer "We assume the training data covers this," they have grasped the Learning view.
  *   If they hesitate on "Who is liable," they have grasped the Philosophical/Open World view (epistemic responsibility).

  ---

  ### 5. What to Openly Decline

  To keep within the hour and the cognitive load limits, you must explicitly state what you will *not* cover. Put this on the board at the start.

  1.  **Situation Calculus Syntax:** "We will not write down formal logic axioms. The intuition matters more than the notation today."
  2.  **Non-Monotonic Logic Solutions:** "We will not review the history of default logic or circumscription. Those are proposed cures; we are diagnosing the symptom."
  3.  **Consciousness:** "We are not discussing whether the robot 'knows' anything. We are discussing how it processes change."

  ### Summary of Dependencies for the Whiteboard

  1.  **State Representation** (Must exist for Bookkeeping to matter).
  2.  **Finite Resources** (Must be constrained for Relevance to matter).
  3.  **Dynamic Environment** (Must be changing for Open World to matter).

  If you lose them on step 1, you cannot explain step 2. If you lose them on step 2, step 3 looks like science fiction. Proceed sequentially. Good luck.
