      *   **Tension 3: (c) Expected Choiceworthiness vs. (d) Lexical Ordering.**
          *   *Problem:* Expected choiceworthiness (MEC) implies trade-offs are possible based on probabilities and magnitudes. Lexical ordering says *no* trade-offs. If Theory 1 says "Never humiliate" and Theory 2 says "Maximize welfare," and you have a distribution over them, how do you combine them? If (d) is a global constraint, it trumps (c). If (d) is just one theory in the mix for (c), then it's not truly lexical across the system.
          *   *Severity:* Medium. Can be resolved by making (d) a meta-constraint on the MEC calculation.
          *   *Fix:* Lexical constraints define the *feasible set* of actions; MEC chooses within that set.

      *   **Tension 4: (e) Tool/No Agency vs. (c)/(f)/(g) Moral Judgment.**
          *   *Problem:* If the machine is just a tool, does it make "moral judgments"? Or does it simulate them? The user says "system should... act to maximize." This sounds like agency.
