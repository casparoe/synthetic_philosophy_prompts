answer: |-
  ### The Structural Comparison

  To compare the Absent-Minded Driver (AMD) and Newcomb's Problem without resorting to the standard Evidential (EDT) versus Causal (CDT) taxonomy, we must look at the topology of the decision situation. You have identified two features: **Act–Outcome Correlation** (Newcomb) and **Act–Occasion Indistinguishability** (AMD).

  **1. Are they the same commitment?**
  Both problems press on the same fundamental commitment: **the unit of agency.** They challenge the assumption that the primary locus of rational evaluation is the isolated, momentary *act-token*.

  *   **Newcomb's Problem** forces a conflict between the rationality of the *act* (taking both boxes dominates) and the rationality of the *agent-type* (being a one-boxer yields more money).
  *   **AMD** forces a conflict between the rationality of the *interim choice* (at the intersection) and the rationality of the *plan* (the probability $p$ of continuing set ex-ante).

  In both cases, maximizing utility locally (act-by-act) yields a suboptimal global outcome. Therefore, they are not distinct problems but rather distinct instantiations of the same structural tension: **Act-Rationality vs. Policy-Rationality.**

  **2. Feature Analysis: Is AMD Feature 2 without Feature 1?**
  You ask if AMD is exactly Act–Occasion Indistinguishability (Feature 2) without Act–Outcome Correlation (Feature 1). The answer is **no**. AMD is Feature 2 *generating* a localized version of Feature 1.

  In Newcomb's case, the correlation is external: a predictor links your act to a past state (money in the box). In AMD, there is no external predictor. However, the forgetfulness (Feature 2) creates an internal correlation between your current action and your location (the state that determines payoff).
  *   If you are at an intersection, the probability that you are at the first vs. the second intersection depends on the strategy you are following.
  *   Because you cannot distinguish the occasions, your current action is logically tied to your action at the other occasion.
  *   Consequently, your current action is correlated with the payoff structure (which depends on location) in a way that is not causally downstream of the current choice.

  So, AMD is not Feature 2 *without* Feature 1; it is Feature 2 *mimicking* Feature 1 through logical identity rather than external prediction. The "predictor" in AMD is your own future self, bound by the same memory limitation.

  **3. The Self-Signaling Objection**
  You raise the objection that the driver can read their own standing dispositions as evidence about their location (e.g., "If I am inclined to continue, I am likely at the first intersection, because if I were at the second, I would have had to continue earlier").

  *   **Does this make AMD Newcomb-like?** Yes. It explicitly introduces an evidential link between the act (continue/exit) and the state (location), mirroring the link between act and box-content in Newcomb.
  *   **Does the move work?** No, not as a resolution. Treating self-location as evidence subject to updating by the current decision leads to **instability**. If you reason "I will continue, therefore I am likely at Intersection 1," you might change your decision to Exit. But if you Exit, the probability assessment shifts. This creates a loop where the evidence depends on the decision which depends on the evidence.
  *   **Verdict on Objection:** While this move successfully highlights that AMD contains an evidential structure similar to Newcomb's, it fails to dissolve the paradox. It merely confirms that the driver faces an evidential problem regarding self-location. It does not restore the viability of act-by-act maximization; instead, it reinforces the need for a policy that remains consistent despite the shifting self-locating beliefs.

  **4. Surviving the Fixes**
  Do the problems survive the fixes usually offered for the other?
  *   **The Newcomb Fix (Precommitment):** If you can precommit to One Box, you win. If you apply this to AMD (precommit to a specific $p$), you solve the time-inconsistency. The driver binds their future self to the ex-ante optimal plan.
  *   **The AMD Fix (Consistent Planning):** If you require choices to be consistent across indistinguishable nodes, you solve AMD. If you apply this to Newcomb (view the choice as selecting a policy "Be a 1-boxer" rather than an act "Take Box B"), you also win.

  **Verdict:** Both problems survive the fix offered for the other because **the fix is the same.** The solution to both is to shift the unit of evaluation from the *act* to the *policy*. A decision theory that handles one via policy-selection handles the other.

  **5. One Decision Theory and Senses of Rationality**
  For someone wanting one decision theory to handle both, the verdict is **Policy-Based Decision Theory** (akin to Functional Decision Theory or Timeless Decision Theory).

  This confirms your suspicion about the act/policy distinction amounting to a conflict between two senses of rationality:
  1.  **Rationality of Choice (Token):** What is the best move given the situation *as it appears now*? (Leads to Two-Boxing in Newcomb, and time-inconsistent exiting in AMD).
  2.  **Rationality of Disposition (Type):** What is the best rule for an agent *of this kind* to follow? (Leads to One-Boxing in Newcomb, and consistent $p$ in AMD).

  Crucially, AMD proves that this conflict **does not require exotic assumptions.** Newcomb requires a predictor (which many argue is nomologically impossible or metaphysically suspect). AMD requires only imperfect memory and sequential choice—features of mundane human life (e.g., addiction, procrastination, savings). Therefore, the conflict between Act-Rationality and Policy-Rationality is not a quirk of sci-fi predictors; it is a structural feature of any temporally extended agent with imperfect self-knowledge.

  ### Final Verdict

  The Absent-Minded Driver and Newcomb's Problem are structurally identical regarding the commitment they press: both demonstrate that **act-based maximization is insufficient for temporally extended agents.** AMD is not a counterexample to act-by-act choice that is distinct from Newcomb; it is the **mundane, internalized version** of Newcomb's Problem. It shows that you do not need an external predictor to generate act-outcome correlations; you only need a self that cannot perfectly distinguish its own temporal locations.

  **Confidence:** I am **85% confident** in this overall verdict. The structural identity between the two problems (once Newcomb is viewed as a policy problem) is robust in the literature on Functional Decision Theory and consistent planning.

  **Least Certain Claim:** I am least sure about the claim that **the self-signaling objection "fails" to resolve the paradox.** While it creates instability in standard Bayesian updating, some philosophers (e.g., Arntzenius) argue that properly modeled self-locating beliefs *can* dissolve the AMD paradox without needing full policy precommitment, by altering the probability space itself. Whether this counts as a genuine resolution or a mathematical sleight-of-hand remains a contentious technical point in the philosophy of self-location.
