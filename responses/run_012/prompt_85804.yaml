      *   *Introduction:* Define the two features clearly.
      *   *Section 1: Feature Analysis.* AMD is primarily Feature 2. Newcomb is primarily Feature 1. But AMD *mimics* Feature 1 through self-locating belief.
      *   *Section 2: The Self-Signaling Objection.* Explain it. Explain why it's tempting but problematic (circularity). It doesn't fully collapse AMD into Newcomb because the correlation is logical identity, not external prediction.
      *   *Section 3: The Common Commitment.* Both attack the "Act" as the fundamental unit of evaluation. Both demand "Policy."
      *   *Section 4: Surviving the Fixes.* Newcomb fix (precommitment) solves AMD. AMD fix (consistent planning) solves Newcomb (conceptually). They are the same fix.
      *   *Section 5: Rationality Senses.* Choice (token) vs. Disposition (type). AMD proves this isn't just about predictors; it's about temporal extension.
      *   *Conclusion:* Verdict + Confidence + Uncertainty.

  8.  **Refining the "Survives the Fix" point:**
      *   Standard Newcomb Fix for CDT proponents: "You can't precommit, so 2-box."
