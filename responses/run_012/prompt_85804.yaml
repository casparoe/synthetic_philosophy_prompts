      *   If I adopt Precommitment (fix for Newcomb), do I get AMD right? Yes, if you can bind your future self.
      *   So the fixes are mutually supportive.

  9.  **Refining the "Act-Outcome Correlation" in AMD:**
      *   Is there correlation? My choice now is correlated with my choice later. My choice later determines the payoff. So my choice now is correlated with the payoff *via* my future self.
      *   Is this "outside your control"? Your future self *is* you. But at the moment of choice, your future action is not causally downstream of your current action (in the sense that you can't change it *now* except by deciding the policy).
      *   Actually, Piccione & Rubinstein argue the correlation is between the action at node 1 and node 2 due to forgetfulness.
      *   Crucial distinction: In Newcomb, the correlation is with a *state of the world* (money in box). In AMD, the correlation is with a *future action* (which determines state).
      *   So AMD is Feature 2 primarily, but Feature 2 *generates* a Feature 1-like structure internally.

  10. **Final Polish:**
