      *   **Philosophical Angle:** Does the act/policy distinction amount to a conflict between two senses of rationality (choice vs. disposition) without exotic assumptions?
      *   **Closing:** Confidence level + least certain claim.

  2.  **Initial Conceptual Mapping:**
      *   *Newcomb's Problem:* One box vs. Two boxes. Predictor exists. Your choice is correlated with the prediction (past fact). CDT says Two Box (dominance). EDT says One Box (expected utility).
      *   *Absent-Minded Driver:* Exit 1 (payoff 0), Exit 2 (payoff 4), Continue (payoff 1). Driver forgets if he's at Exit 1 or 2. Needs a probability $p$ of continuing.
      *   *The Tension:* In AMD, if you calculate expected utility at an intersection *assuming* you will do the same thing at the next intersection (policy consistency), you get a different optimal $p$ than if you treat the current choice as isolated.
      *   *Piccione & Rubinstein (1997):* The seminal paper. They argue for "consistent planning."
      *   *Aumann, Hart, Perry (1997):* The critique. They argue for modified EDT/CDT approaches.

  3.  **Analyzing Feature 1 (Act-Outcome Correlation) vs. Feature 2 (Act-Occasion Indistinguishability):**
      *   *Newcomb:* Relies heavily on Feature 1. The box content is fixed *before* choice. The correlation is metaphysical/nomological (via predictor).
      *   *AMD:* Relies heavily on Feature 2. The payoffs are fixed by the rules of the road. The "correlation" is between the choice at Intersection 1 and Intersection 2 because it's the *same agent* with the *same memory state*.
      *   *Is AMD Feature 2 without Feature 1?*
          *   Standard view: Yes. There is no external predictor. The correlation is internal (temporal/self).
          *   Counter-view: If I choose "Exit" now, does that make it more likely I am at Intersection 1? (The self-signaling objection).
      *   *The "Fix" Cross-Over:*
          *   Newcomb Fix (for CDT): Precommitment / Policy selection. If you can precommit to One Box, you win.
          *   AMD Fix (for Act-Choice): Consistent Planning. You must choose a $p$ that is optimal given that you will play $p$ later.
          *   Do they survive each other's fixes?
              *   If we treat AMD as a policy selection problem (like Newcomb precommitment), the paradox dissolves into a standard optimization problem.
              *   If we treat Newcomb as an act-occasion problem (not really applicable), it doesn't fit well.
              *   Better angle: Does CDT handle AMD? CDT usually says "maximize utility at this node given causal consequences." But in AMD, the causal consequence of exiting *now* depends on what you do *later* (because you might be at node 1). If you treat the future self as a distinct causal agent, CDT fails. If you treat the future self as *you*, CDT needs modification (Policy CDT).

  4.  **Addressing the Self-Signaling Objection:**
      *   *Objection:* At an intersection, I think "If I plan to continue, I'm likely at the first intersection (because I pass it). If I plan to exit, I'm likely at the second (because I didn't exit earlier)."
      *   *Analysis:* This looks like EDT. It makes the probability of being at a node dependent on the action.
      *   *Does it make it Newcomb-like?* Yes, structurally. It introduces an evidential link between action and state (location).
      *   *Does the move work?* Most literature (e.g., Hitchcock, Arntzenius) suggests this leads to "time-inconsistency" or paradoxical updating. If you use this evidence, you might change your plan, which changes the evidence. It creates a loop.
      *   *Verdict on Objection:* It *tries* to make it Newcomb-like, but it fails to resolve the tension because the "state" (location) is not independent of the "act" in the way Newcomb's state is. In Newcomb, the state is fixed. In AMD, the state (location) is traversed sequentially. The correlation is logical, not evidential in the standard sense.

  5.  **Synthesizing the Commitment:**
      *   What is the deep commitment? It's the **Unit of Agency**.
      *   Newcomb challenges: Is the act a physical movement or a logical output of a type? (Functional Decision Theory angle).
      *   AMD challenges: Is the decision a momentary token or a temporally extended type?
      *   Both press on: **Act vs. Policy**.
      *   Are they the same commitment? Yes, fundamentally. Both show that maximizing utility *at the moment of choice* (Act) can conflict with maximizing utility *over the life of the agent* (Policy).
      *   Newcomb: Act (2-box) < Policy (1-box).
      *   AMD: Act (Exit if $p$ is high) vs Policy (Continue with specific $p$). Actually, in AMD, the "Act" view leads to $p=0$ (exit immediately) or $p=1$ (never exit) depending on calculation, while the "Policy" view finds an interior solution ($p=1/3$ roughly, depending on payoffs).
      *   Wait, let's check the AMD math.
          *   Payoffs: Exit 1 = 0, Exit 2 = 4, Continue = 1.
          *   Policy $p$ (prob of continuing).
          *   Expected Value = $(1-p) \cdot 0 + p(1-p) \cdot 4 + p^2 \cdot 1$.
          *   Maximize w.r.t $p$: $4p - 4p^2 + p^2 = 4p - 3p^2$. Derivative $4 - 6p = 0 \rightarrow p = 2/3$.
          *   At the intersection (Act view): You think "If I exit, I get 0 (if node 1) or 4 (if node 2). If I continue, I get 1 (if node 1) or whatever happens at node 2."
          *   The tension arises because the probability of being at Node 1 vs Node 2 depends on $p$.
      *   So, both problems show that **Act-Rationality** (myopic) diverges from **Policy-Rationality** (global).

  6.  **Addressing the "One Decision Theory" Verdict:**
      *   If you want one theory, you need **Policy-Based Decision Theory** (or Functional Decision Theory / Timeless Decision Theory).
      *   CDT (Act-based) fails Newcomb (gets \$1,000). CDT (Act-based) struggles with AMD (time inconsistency).
      *   EDT (Act-based) gets Newcomb right (\$1M) but struggles with AMD (self-signaling loops).
      *   Solution: Treat the decision as selecting a *function* or *policy*.
      *   Does this amount to Choice vs. Disposition rationality? Yes. It's the rationality of the *moment* vs. the rationality of the *agent*.
      *   Does this arise without exotic assumptions? AMD has no predictor (no magic). It only has imperfect memory. So yes, the conflict arises in mundane settings (procrastination, addiction, saving) just like AMD. Newcomb requires a predictor (exotic). So AMD is the "mundane" version of the same structural problem.

