      *   **Format:** Short paragraphs (conversational).
      *   **Opening Move:** The user argues that the "disposition" defense merely relocates the problem. The disposition is licensed *because* it maximizes welfare, not because of partiality itself. In a conflict case (1 dose vs. daughter vs. 2 strangers), the utilitarian must either license an act they condemn (save daughter) or override the disposition (save 2), proving calculation is always backgrounded.
      *   **Constraint:** Keep each reply to a short paragraph.

  2.  **Determine the Sophisticated Utilitarian Position:**
      *   This is likely a rule-utilitarian or indirect utilitarian stance (like Hare's two-level utilitarianism or Smart's sophisticated act-utilitarianism).
      *   Key claim: Morality assesses dispositions/character traits based on their utility, but agents shouldn't necessarily calculate utility in the moment.
      *   Response to the dilemma: The sophisticated utilitarian admits that in *extreme* cases, the critical level of thinking must override the intuitive level. However, this doesn't invalidate the disposition; it just sets its limits.
      *   Addressing the "calculation in the background" charge: Yes, utility is the *criterion* of rightness, not necessarily the *decision procedure*. The fact that utility justifies the disposition doesn't mean the agent must think about utility to act rightly.
      *   Addressing the specific case (daughter vs. two strangers): This is the hard case. A sophisticated utilitarian might bite the bullet (save the two) but argue that cultivating a disposition to save one's own is still generally useful, even if it fails in rare edge cases. Or, they might argue that the psychological cost of overriding such a deep disposition outweighs the gain of one extra life in *most* real-world scenarios, but in this specific hypothetical, the math wins.
      *   Better strategy: Distinguish between the *justification* of the norm and the *content* of the norm. The norm "save your child" is justified by utility. In 99% of cases, following it maximizes utility. In this 1% case, it doesn't. But admitting that utility is the ultimate arbiter doesn't mean the agent is alienated in every act. Williams wants integrity to mean immunity from utilitarian assessment; we say integrity is a value *within* utilitarian assessment.

