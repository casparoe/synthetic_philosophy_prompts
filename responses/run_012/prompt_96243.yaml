answer: |-
  ### Conceptual Dependencies

  Before sequencing the 90 minutes, you need to lock down the logical architecture. If you get the order wrong, the argument collapses into "Ayer was a grump who hated religion."

  1.  **Coherence precedes Truth:** This is the non-negotiable foundation. The class must understand that Ayer is not arguing survival is *false*; he is arguing that the standard formulation of survival is *incoherent*. You cannot gather evidence for a proposition that lacks cognitive content.
  2.  **Verification conditions define Identity:** This is the specific Logical Positivist move. We don't start with a metaphysical definition of "self" and then ask how to verify it. We start with "What observations would verify survival?" and realize that without bodily continuity, the verification conditions fail, and thus the "self" in the statement becomes undefined. Identity is a function of verification, not a prerequisite for it.
  3.  **Evidence is secondary to Meaning:** The physician and the spiritualists will want to start with evidence (NDEs, near-death research). You must structurally prevent this. Evidence is only relevant *after* the hypothesis is established as meaningful.

  **The Dependency Chain:**
  Meaning (Verification Principle) $\rightarrow$ Subject (Personal Identity criteria) $\rightarrow$ Evidence (NDEs/Science).
  *If you reverse this, you lose the room.*

  ---

  ### The Carrying Example

  **Do not use Ayer's NDE (the salmon bone incident) as the carrying example.**

  **Why:** If you lead with Ayer's own near-death experience, you hand the Physician and the spiritualists the reins. The session becomes a debate about the reliability of NDE testimony and whether Ayer "recanted." It turns a logical problem into a biographical/empirical one. The Grad Students will check out because it becomes "philosophy of mind lite."

  **Use instead:** **"The Reunion Test."**
  Ask the class: *"You die. Later, a being appears to your grieving spouse. It claims to be you. It knows private memories only you knew. It looks like you. Is that you? How do we decide?"*

  **What this example accomplishes:**
  1.  It forces the Verification question immediately (What counts as proof?).
  2.  It forces the Identity question immediately (Is memory enough? Is appearance enough?).
  3.  It isolates the logical problem from the emotional desire.

  **Where to use Ayer's NDE:** Use it in the final 10 minutes as a *coda*. It serves to show that even when faced with subjective *experience* of survival, Ayer maintained the logical distinction between "having an experience" and "verifying a proposition." It humanizes him without conceding the argument.

  ---

  ### 90-Minute Teaching Plan

  #### 0:00 – 0:10 | Introduction: The Claim vs. The Wish
  *   **Goal:** Separate the emotional desire for survival from the logical structure of the claim.
  *   **Activity:** Ask the room: "What exactly are we claiming when we say 'I will survive my death'?" Write 3-4 answers on the board.
  *   **Pedagogical Move:** Acknowledge the weight of the question. Validate the religious and spiritual participants by saying, "We are not asking if this is *comforting*, but if it is *sayable*."
  *   **Misconception Pre-emption:** *"Ayer just said survival talk is meaningless, full stop."*
      *   **Intervention:** Clarify immediately: "Ayer's point isn't that survival is impossible. It's that we haven't successfully defined what 'I' and 'survive' mean in this context. We are here to test the definition, not the hope."
  *   **Grad Student Management:** Signal that you are reconstructing the argument charitably, not defending a dead dogma. "We are testing the internal consistency of empiricism, not asserting VP as gospel."

  #### 0:10 – 0:35 | Module 1: The Verification Gate (Meaning)
  *   **Goal:** Establish that a claim is only meaningful if we can specify what observations would verify it.
  *   **The Move:** Introduce the Verification Principle not as a rule, but as a tool for clarity. "If I say 'There is a dragon in the garage,' but it's invisible, intangible, and undetectable, have I said anything?"
  *   **Apply to Survival:** "If I say 'I survive,' what observation settles it?"
  *   **Misconception Pre-emption:** *"Verificationism is obviously dead so the whole thing is a museum piece."*
      *   **Intervention:** Address the Grad Students here. "Yes, strict VP has problems. But the core intuition—that truth claims require truth conditions—is still standard analytic philosophy. Bracket the history of the Vienna Circle; let's use the tool to see if it cuts."
  *   **Misconception Pre-emption:** *"Survival is a straightforward empirical hypothesis."*
      *   **Intervention:** Show that unlike "There is a planet beyond Neptune," "I survive" lacks a clear subject for the empirical test.
  *   **Danger Zone Flag:** This is where the Physician will try to pivot to NDE data.
      *   **Hold the Line:** "We aren't asking if people *see* lights. We are asking if seeing a light verifies *you* exist. Don't jump to evidence yet."

  #### 0:35 – 0:60 | Module 2: The Identity Knot (The Subject)
  *   **Goal:** Show that without bodily continuity, the verification conditions for "I" collapse.
  *   **The Carrying Example (The Reunion Test):** Return to the spouse meeting the being.
      *   *Scenario A:* It looks like you. (Is a duplicate you?)
      *   *Scenario B:* It remembers your childhood. (Is memory enough? What if I have your memories but am not you?)
      *   *Scenario C:* It has your personality. (Is personality a thing that can exist without a brain?)
  *   **The Logical Trap:** To verify survival, we need public criteria (body/behavior). But death is defined by the loss of the body. Therefore, the public criteria for identifying "you" are gone.
  *   **Misconception Pre-emption:** *"The problem is just about evidence when it's really about what the surviving thing would be."*
      *   **Intervention:** This is the core teaching moment. Make them see that the *lack of evidence* is caused by the *lack of a defined subject*. We can't look for evidence of "you" if we can't define "you" without a body.
  *   **Misconception Pre-emption:** *"Near-death research settles the question."*
      *   **Intervention:** "NDEs verify that *experiences* happen during clinical death. They do not verify that the *person* persists after biological decomposition. An experience is not an identity."

  #### 0:60 – 0:80 | Module 3: The Coherence Check (Synthesis)
  *   **Goal:** Distinguish between "False" and "Nonsense."
  *   **Activity:** Contrast two claims:
      1.  "There is life on Mars." (Meaningful, possibly false).
      2.  "My soul survives without any causal connection to the physical world." (Ayer argues this lacks verification conditions, hence lacks sense).
  *   **Nuance for the Religious:** Acknowledge that religious language often functions expressively or morally, not cognitively. Ayer attacks the *scientific* claim of survival, not the *value* of faith. This respects the Catholic participant without conceding the logic.
  *   **Nuance for the Grad Students:** Briefly mention that Ayer allows for "weak" verification. If they can formulate a survival claim that *is* weakly verifiable (e.g., a spiritualist seance that produces verifiable physical effects), Ayer would accept it as meaningful (though likely false). This shows Ayer isn't dogmatic, just rigorous.

  #### 0:80 – 0:90 | Conclusion: Ayer's Salmon Bone (The Coda)
  *   **Goal:** Humanize the logic without breaking it.
  *   **The Story:** Briefly tell the story of Ayer's choking, clinical death, and the "red light." Mention his quote: "It did not diminish my view that... death is the end."
  *   **The Point:** Even when *he* had the experience, he recognized that a subjective visual phenomenon does not solve the logical problem of identity and verification.
  *   **Misconception Pre-emption:** *"The NDE converted him or should have."*
      *   **Intervention:** "He remained an empiricist to the end. He treated the vision as a neurological event, not a metaphysical proof. Why? Because the logic didn't change."

  ---

  ### Check for Understanding

  Do not ask a multiple-choice question. Ask for a **construction task**.

  **The Task:**
  "Write down one sentence claiming that 'Person X survives death' that Ayer would accept as **meaningful** (even if he thought it was false), and one sentence he would reject as **meaningless** (not false, but incoherent). Be prepared to explain *why* the first one passes the verification test and the second one fails."

  **Why this works:**
  *   If they say "There is no evidence for survival" for the meaningless one, they failed. (That's an evidence claim, not a meaning claim).
  *   If they say "Survival is impossible" for the meaningless one, they failed. (That's a truth claim).
  *   To succeed, they must articulate *verification conditions*.
      *   *Pass example:* "Person X survives" is meaningful if "we can observe Person X's body behaving in ways that verify their identity post-mortem."
      *   *Fail example:* "Person X's soul exists in a non-spatial realm." (No verification conditions possible).

  ---

  ### What to Openly Refuse to Cover

  You identified the right exclusions, but here is how to handle the pushback:

  1.  **Vienna Circle / History of VP:**
      *   *Refusal Strategy:* "We are using the tool, not restoring the museum. If we discuss Carnap's modifications, we lose the thread on Ayer's specific argument about identity."
  2.  **Parfit / Locke / Psychological Continuity:**
      *   *Refusal Strategy:* "Those are metaphysical solutions to identity. Ayer is asking an epistemological question: 'How would we *know*?' We are staying on the epistemic track."
  3.  **Parapsychology / NDE Data:**
      *   *Refusal Strategy:* "We are not adjudicating the data. We are adjudicating whether the data, *even if true*, counts as verification of 'survival.' The Physician's data is relevant only if we first solve the Identity Knot."
  4.  **The "Collapse" of Logical Positivism:**
      *   *Refusal Strategy:* Acknowledge it in minute 15 (to satisfy Grad Students), then say, "The principle may be flawed, but the challenge it poses to religious language remains unanswered by most theologians. Let's see if we can answer it."

  ### Final Warning: The Danger Zone

  **The moment the room goes sideways:**
  It will happen in **Module 2 (The Identity Knot)**.
  The Religious participants and the Physician will form an alliance. The Religious participant will say, "Faith doesn't need verification." The Physician will say, "But we have data of consciousness leaving the body."

  **Your Counter-Move:**
  Do not fight them on faith or data. Fight them on **grammar**.
  Say: "I am not asking if you believe it. I am not asking if the data is real. I am asking: If the body is dust, and I point to a spirit and say 'That is John,' what rule are we using to make that identification? If you cannot give me the rule, you cannot give me the fact."

  Force them to see that without a rule of identification, "John" is just a noise, not a name. That is the Ayerian move.
