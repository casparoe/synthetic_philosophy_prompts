      *   *Is the reject option totally useless?* No, it can reduce harm, but it doesn't *solve the impossibility result*. I need to be clear it doesn't "escape the dilemma" mathematically.
      *   *Base Rates:* This is the linchpin. If base rates are equal, the impossibility disappears. The colleague thinks better models fix this. They don't. I need to emphasize this.

