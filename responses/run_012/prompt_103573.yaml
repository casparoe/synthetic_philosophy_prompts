answer: |-
  Legitimacy depends on fidelity to the semantic contract of the input language and the independence of the agents: strategies that operate within the defined meaning of the ballot and maintain voter independence are fair, while those that distort required preference information, coordinate to bypass independence, or hijack procedural neutrality are cheating.

  This principle distinguishes between the *inevitability* of strategy (acknowledged by Gibbard-Satterthwaite) and the *legitimacy* of specific strategic modes. The theorem proves that some manipulation is always possible in non-dictatorial systems, but it does not imply that all manipulations are morally or procedurally equivalent. Your verdicts suggest you view legitimacy as a function of whether the voter respects the informational intent of the mechanism. In plurality and runoff systems (Cases 1 and 4), the semantic contract is simply "select one option"; selecting a viable or fringe option to influence the outcome remains within the syntax of selection. In Borda (Case 3), the contract is "rank by genuine preference"; burying a rival violates the semantics of the ranking language by substituting strategic utility for ordinal truth, thereby corrupting the metric the rule was designed to aggregate. Approval voting (Case 2) leaves a "faint taste" because "approval" semantically implies endorsement, yet the rule technically allows binary selection, placing it on the boundary of the contract.

  The difference between coordinated and individual action (Case 5 against Case 1) is doing independent work rooted in the assumption of **Independent Agency**. Voting mechanisms are designed to aggregate independent draws from a preference distribution. Individual tactical voting preserves this statistical independence; each voter reacts to the system alone. Collusion (Case 5) transforms the mechanism from an aggregation of preferences into a bargaining game between blocs, violating the implicit condition that votes are uncorrelated expressions of individual will. This is why identical acts shift from fair to cheating when synchronized: the bloc manufactures a "super-voter," degrading the procedure's informational function by masking multiple wills as one. Similarly, agenda control (Case 8) is cheating because it violates **Procedural Neutrality**; the chair acts as a fiduciary for the process, and manipulating the order hijacks the structure within which the semantic contract of the votes operates.

  Regarding the four unlisted cases:
  1.  **A lone sincere voter in a manipulating population:** This is not cheating. The voter adheres to the semantic contract and independence, even if disadvantaged. The principle protects the right to sincerity even when ineffective.
  2.  **A manipulation that changes no outcome:** This is still cheating if it violates the semantic contract (e.g., burying in Borda). The wrong lies in the corruption of the input data, not merely the consequence.
  3.  **A voter who reports honestly but abstains to change the outcome:** If abstention is a valid input option, this is fair game. If abstention is used specifically to break a quorum requirement, it shifts into procedural hijacking (akin to Case 8) and becomes cheating.
  4.  **A rule that returns a set or randomizes:** Gibbard-Satterthwaite applies strictly to single winners, but the principle holds. Colluding to fix a random seed or narrow a set violates independence and semantic fidelity. Individual strategy within the probability distribution remains fair.

  The principle cannot accommodate the intuition in Case 9 that sincere voting is merely "foolish." While the principle correctly identifies it as not cheating, it offers no normative pressure to be effective; it is deontological (rule-based) rather than consequentialist. It also struggles slightly with Case 2 (Approval), where the semantic contract is ambiguous enough to allow the "faint taste" you describe—it is legitimate but semantically frayed. Finally, while this principle resolves your worry about Gibbard-Satterthwaite by stratifying manipulation types, it admits that under this definition, almost all real-world voting involves some level of "fair" manipulation, rendering the concept of a perfectly "honest" election largely theoretical.
