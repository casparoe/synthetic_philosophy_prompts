prompt: |-
  Im a TA and in a week and a half I've got to run a 75-minute section on the centipede game and the backward induction paradox, for second-years who've done Nash equilibrium and the prisoner's dilemma but have never seen backward induction done properly. Don't explain the paradox to me -- plan the session for me. What has to be in place before the centipede even looks like a puzzle, what order things have to go in and why (I have a hunch I need to do backward induction on some boring little finite tree first, but tell me what that warm-up game has to have and what it must not have, and why not just reuse the prisoner's dilemma as the warm-up since they already know it), and what should carry the whole thing. I was going to use a hundred-leg centipede, but I'm now wondering whether that's a mistake -- maybe the carrying example should be the smallest version that still has the flavour, or a variant where I make the payoff for grabbing at the very last node barely bigger than splitting, so they can't wave the whole thing away with "well obviously you'd take that".

  The thing I'm most worried about is what they'll walk out believing. My guess is some of them will conclude backward induction is just the formal version of "people are selfish", others that the paradox shows rationality is self-undermining and therefore who cares, and a few that it's the prisoner's dilemma wearing a hat. I want the misconceptions they'll actually bring, in the order they'll surface during the session, and exactly where in the sequence I head each one off -- including the ones I haven't listed.

  Also tell me what I should deliberately refuse to go into at this level, and to say so out loud when I refuse (I'm guessing all the common-knowledge-of-rationality machinery, but tell me if that's the wrong thing to cut). And give me one question to ask at the end that would tell me whether they got why the backward induction argument is supposed to be a paradox at all, as opposed to just whether they can execute it on a tree.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Role:** TA (Teaching Assistant).
      *   **Audience:** 2nd-year undergraduates.
      *   **Prior Knowledge:** Nash Equilibrium (NE), Prisoner's Dilemma (PD). *No* proper Backward Induction (BI).
      *   **Topic:** Centipede Game & Backward Induction Paradox.
      *   **Duration:** 75 minutes.
      *   **Constraints/Goals:**
          *   Plan the session (order, content, rationale).
          *   Explain the warm-up game (why not PD? what features are needed?).
          *   Decide on the Centipede version (100-leg vs. small vs. modified payoffs).
          *   Identify student misconceptions (in order of appearance) and how to head them off.
          *   Specify what *not* to teach (and explicitly say so).
          *   Provide one diagnostic final question.
      *   **Tone:** Practical, pedagogical, sharp (don't explain the paradox to the user, they know it).

  2.  **Deconstruct the Pedagogical Challenge:**
      *   *The Core Problem:* Students confuse "rationality" with "selfishness/greed." They think BI is just "take the money and run." They think the Centipede is just a long PD. They don't see why the *logic* of BI forces the outcome, regardless of preferences, if rationality is assumed.
      *   *The Warm-up:* Needs to be sequential (unlike PD). Needs to be finite. Needs to have a unique BI solution that might feel counter-intuitive or at least requires calculation, not just "greed." PD is simultaneous, so it's bad for teaching BI mechanics.
      *   *The Centipede:* 100 legs is too abstract. 4 or 6 legs is better. Modifying the last payoff is a good idea to prevent "obvious grab" reasoning, but might complicate the arithmetic. Let's stick to the standard structure but emphasize the *logic* over the *magnitude* of payoffs. Actually, the user's intuition about the last node payoff is spot on: if the last node is "Take 100, Pass 1", the paradox vanishes. It needs to be "Take 5, Pass 5" (or similar) to make passing tempting but logically unsustainable.
      *   *Misconceptions:*
          1.  "This is just PD." (Simultaneous vs. Sequential).
          2.  "BI = Greed." (Rationality vs. Payoff maximization).
          3.  "Real people wouldn't do this." (Normative vs. Positive).
          4.  "Rationality is broken." (The paradox implies logic fails, rather than assumptions fail).
      *   *What to Cut:* Epistemic foundations (Common Knowledge of Rationality - CKR). It's too technical. Just state the assumption.

  3.  **Drafting the Session Plan (Iterative Process):**

      *   *Phase 1: Warm-up (15 mins).* Need a finite sequential game. The "Ultimatum Game" is too simple (one step). A 3-stage trust game? No, let's do a simple 3-node decision tree where the BI solution isn't the socially optimal one.
          *   *Why not PD?* PD is simultaneous. BI requires perfect information and sequence.
          *   *Features:* Finite horizon, perfect information, alternating moves (or at least sequential), strict preference ordering.
      *   *Phase 2: Introducing BI Mechanics (15 mins).* Solve the warm-up. Define the algorithm.
      *   *Phase 3: The Centipede (25 mins).* Present the game. Run BI. Show the "Stop Immediately" result.
      *   *Phase 4: The Paradox & Discussion (20 mins).* Why is this weird? Why do people play differently? What does it mean for the theory?

      *   *Refining the Centipede:* A 4-leg (2 rounds per player) is sufficient. 100 is distracting.
      *   *Refining Payoffs:* Standard Centipede: (1,1) -> (0,3) -> (2,2) -> (1,4)... Wait, standard is usually increasing pot.
      *   *Standard Structure:* P1: Take (2,0) or Pass. P2: Take (1,3) or Pass. P1: Take (4,2)...
      *   *User's Idea:* Make the last node "barely bigger." If the last node is (100, 100) vs (101, 99), the incentive to pass is high, making the BI stop *more* paradoxical. Yes, do this.

      *   *Misconception Management:*
          *   *Early:* "It's PD." -> Correct by highlighting sequence.
          *   *Middle:* "BI is greed." -> Correct by showing a game where BI leads to cooperation (if possible) or emphasizing it's about *best response to future best response*, not just "I want more."
          *   *Late:* "Theory is useless." -> Correct by distinguishing normative/predictive.

      *   *What to Cut:* CKR formalism. Just say "Assume players are rational and know the other is rational." Don't define the knowledge operator.

      *   *Final Question:* Needs to test understanding of the *paradox*, not the *math*. "If you played this for $1000, what would you do vs. what does BI say?" No, that's too easy. "If Player 2 passes at node 2, what should Player 1 infer?" (Tests belief updating vs. fixed rationality). Better: "Does BI tell us what people *do*, or what they *must* do given specific assumptions?"

  4.  **Fleshing out the Details (incorporating user constraints):**

      *   *Warm-up:* Needs to be a "Poisoned Chocolate" or simple 3-stage game. Let's use a 3-stage "Trust/Investment" style tree where BI leads to a suboptimal outcome.
      *   *Why not PD?* Crucial point: PD is simultaneous. BI relies on *time* and *observable history*.
      *   *Centipede Size:* 4 nodes (2 per player). 100 is pedagogical suicide for a 75-min section.
      *   *Payoffs:* Use the user's idea. Make the final "Take" payoff only marginally better than "Pass" to maximize the tension.
      *   *Misconceptions:*
          1.  "BI = Be Selfish." (Head off in Warm-up).
          2.  "It's just repeated PD." (Head off in Centipede intro).
          3.  "Rationality is wrong." (Head off in Conclusion).
      *   *Cut:* CKR machinery.
      *   *Final Question:* Focus on the *assumption* that breaks, not the calculation.

  5.  **Review against Constraints:**
      *   75 minutes? Yes, timing needs to be tight.
      *   2nd years? Yes, keep math simple, logic sharp.
      *   Don't explain paradox to user? Understood.
      *   Address specific worries (what they walk out believing)? Yes, this is the core of the "Misconceptions" section.

  6.  **Final Polish:**
      *   Make the "What to Cut" section explicit.
      *   Ensure the "Warm-up" rationale is clear (Sequential vs Simultaneous).
      *   Refine the Final Question to be diagnostic of the *paradoxical nature*.

      *(Self-Correction during drafting)*: I initially thought about suggesting the Ultimatum Game as a warm-up. But Ultimatum has a continuum of NE (in some versions) or is too simple. A 3-node discrete tree is better. Let's call it the "Three-Stage Take Game."
      *   Node 1 (P1): Take (2, 0) or Pass.
      *   Node 2 (P2): Take (1, 3) or Pass.
      *   Node 3 (P1): Take (4, 2) or Pass (End at 3, 3).
      *   BI: Node 3 (Take 4>3) -> Node 2 (Take 3>2) -> Node 1 (Take 2>1). Result (2,0). Pareto inefficient (3,3) available.
      *   This mirrors Centipede logic without the length.

      *Wait, user asked about the Centipede payoff modification.* "Make the payoff for grabbing at the very last node barely bigger than splitting."
      *   If I do this, does it break BI? No. BI still holds. Does it make the paradox stronger? Yes, because the cost of rationality is higher. I will endorse this.

      *Misconception Order:*
      1.  Confusion about the tree (Simultaneous vs Sequential).
      2.  Confusion about Rationality (Greed vs. Consistency).
      3.  Confusion about the Paradox (Theory is broken vs. Assumptions are false).

      *Final Question:* "If you observe a player Pass at node 1, does Backward Induction tell you what they will do at node 3? Why or why not?" (Tests off-equilibrium beliefs/CKR without using the jargon).

  7.  **Finalizing the Plan Structure:**
      *   **Session Architecture:** Time breakdown.
      *   **The Warm-Up:** Specific game, specific reasons.
      *   **The Centipede:** Specific version (4-leg), specific payoffs.
      *   **Misconception Map:** Timeline of errors and interventions.
      *   **The "Do Not Touch" List:** CKR etc.
      *   **The Diagnostic Question.**

      *(Final check on tone)*: Keep it directive. "Do this," "Don't do that."

      *(One more thought on the Warm-up)*: Make sure the warm-up *doesn't* look like the Centipede too much, or they'll think Centipede is the only game where BI works. But it must share the *structure*. A simple 3-stage game is best.

      *(Refining the "Why not PD")*: PD is about dominance. Centipede is about sequential rationality. Crucial distinction.

      *(Refining the Final Question)*: The question needs to separate "Can you calculate?" from "Do you get the tension?"
      *   Option A: "What is the BI solution?" (Calculation)
      *   Option B: "Why don't people play this?" (Psychology)
      *   Option C: "If P1 passes, is P2 still bound by BI?" (Logic/Paradox).
      *   Let's go with a variation of C. "If Player 1 passes at the first node, the Backward Induction prediction has already been falsified. Should Player 2 still play according to Backward Induction at the second node? Why?" This forces them to confront the "Common Knowledge" assumption without naming it.

      *Wait, is that too hard?* For 2nd years who haven't seen BI properly? Maybe.
      *   Alternative: "Backward Induction proves you should stop at node 1. If you actually played this game for real money, would you stop at node 1? If not, which assumption of the Backward Induction argument are you rejecting?"
      *   This is better. It forces them to identify the *assumption* (Rationality, Knowledge, Payoffs) rather than just saying "people are nice."

      *Okay, ready to write.*
answer: |-
  Here is the 75-minute battle plan.

  ### 1. Session Architecture (75 Minutes)

  *   **00:00 – 00:15: The Warm-Up (The "Three-Stage Take" Game).**
      *   Teach the *mechanics* of Backward Induction (BI) without the emotional baggage of the Centipede.
  *   **00:15 – 00:40: The Centipede Game.**
      *   Introduce the specific version, run the BI, and generate the "Paradox."
  *   **00:40 – 01:05: The Autopsy (Discussion).**
      *   Dissect why the result feels wrong and what assumptions drive it.
  *   **01:05 – 01:15: Wrap-up & Diagnostic.**
      *   Consolidate the lesson and ask the final question.

  ---

  ### 2. The Warm-Up: Why Not Prisoner's Dilemma?

  **The Game:** Use a finite, perfect-information, sequential tree with 3 decision nodes.
  *   **Node 1 (P1):** Take ($2, $0) or Pass.
  *   **Node 2 (P2):** Take ($1, $3) or Pass.
  *   **Node 3 (P1):** Take ($4, $2) or Pass (Result: $3, $3).

  **Why this specific game?**
  1.  **Sequentiality:** PD is simultaneous. BI relies entirely on the fact that later players *observe* earlier moves. You cannot teach BI on a matrix.
  2.  **Finite Horizon:** It must end. Infinite games break BI.
  3.  **Conflict of Interest:** The BI outcome ($2, $0) must be Pareto inferior to the "cooperative" outcome ($3, $3). This primes them for the Centipede's inefficiency without overwhelming them.
  4.  **No "Greed" Shortcut:** In PD, "Defect" is a dominant strategy. In this tree, P1 passes at Node 1 *if* they believe P2 will Pass at Node 2. BI isn't about being selfish; it's about predicting the other player's selfishness.

  **What it must NOT have:**
  *   **Simultaneous moves:** (See above).
  *   **Chance nodes:** Keep it deterministic so the logic is pure strategy.
  *   **Symmetry:** P1 and P2 should have different payoffs to prevent them from assuming "we will both do the same thing."

  **Pedagogical Goal:** By the time you finish this, every student must be able to physically point to the last node, circle the higher payoff, cross out the branch, and move backward. If they can't do this mechanically, do not proceed to the Centipede.

  ---

  ### 3. The Centipede: Version Control

  **Do not use the 100-leg version.**
  It is a mistake. It turns the game into a math exercise where they lose the tree structure in their head. It encourages them to think "it stops early" without knowing *why*.

  **Use the 4-Leg Version (2 rounds per player).**
  *   **Node 1 (P1):** Take ($2, $0) or Pass.
  *   **Node 2 (P2):** Take ($1, $3) or Pass.
  *   **Node 3 (P1):** Take ($4, $2) or Pass.
  *   **Node 4 (P2):** Take ($3, $5) or Pass (Result: $4, $4).

  **Your Payoff Intuition is Correct:**
  Make the final "Take" payoff barely better than the "Pass" payoff.
  *   Standard: Take ($10, $10) vs Pass ($5, $15).
  *   **Yours:** Take ($6, $5) vs Pass ($5, $5).
  *   **Why:** If the last node is "Take $100, Pass $1," students wave it away: "Obviously you take $100." If the last node is "Take $6, Pass $5 (but P1 gets $5)," the incentive to cooperate is high, making the BI prediction (Stop at Node 1) feel *more* absurd. It heightens the paradox.

  **The Carry:**
  The entire session rests on the tension between **Logical Necessity** (BI says Stop Node 1) and **Empirical Reality** (People Pass). Do not let them resolve this tension too quickly.

  ---

  ### 4. Misconception Map: Order of Appearance & Interventions

  Here are the misconceptions they will bring, in the order they will surface, and exactly where you kill them.

  **Misconception 1: "This is just Prisoner's Dilemma with extra steps."**
  *   **When:** During the Warm-Up (00:05).
  *   **Why:** They see "Defect/Cooperate" dynamics and tune out the structure.
  *   **Intervention:** Explicitly draw the timeline. "In PD, I don't know what you did when I choose. Here, P2 *sees* P1's move. That changes the math. In PD, we look for Dominance. Here, we look for Best Response to *Future* Best Response."

  **Misconception 2: "Backward Induction is just a formal word for Greed."**
  *   **When:** During the Centipede BI derivation (00:30).
  *   **Why:** The BI outcome is "Stop and Take." They assume the algorithm maximizes *my* payoff regardless of *yours*.
  *   **Intervention:** Remind them of the Warm-Up. "BI isn't 'be selfish.' BI is 'assume the other person is selfish at the end, so I shouldn't trust them earlier.' If the payoffs were changed so that Passing at the end was rational, BI would tell you to Pass at the start. It tracks rationality, not greed."

  **Misconception 3: "The theory is broken because real people don't do this."**
  *   **When:** The Autopsy (00:45).
  *   **Why:** They conflate *normative* theory (what should a rational agent do?) with *positive* prediction (what do humans do?).
  *   **Intervention:** "Physics assumes a frictionless vacuum. If I drop a feather, it doesn't fall like a stone. Is Newton wrong? No, the 'frictionless' assumption is false. Here, which assumption is the friction? Is it Rationality? Or is it that I know *you* are rational?"

  **Misconception 4: "If I Pass at Node 1, I'm just being irrational."**
  *   **When:** The Autopsy (00:55).
  *   **Why:** They think deviating from BI is a "mistake" in calculation.
  *   **Intervention:** "Passing at Node 1 might be the most rational move *if* you believe your opponent is not fully rational. BI requires Common Knowledge of Rationality. If you doubt that, BI breaks. Passing isn't irrational; it's a bet against the Common Knowledge assumption."

  ---

  ### 5. What to Deliberately Refuse (The "Do Not Touch" List)

  You have 75 minutes. If you open these cans, you will not finish. State this explicitly to the class: *"We are not doing the epistemic foundations today."*

  1.  **Common Knowledge of Rationality (CKR) Formalism:**
      *   **Do not** write down $K_i(K_j(Rational))$.
      *   **Do not** discuss Aumann's agreement theorem.
      *   **Say this:** "BI works if I am rational, you are rational, I know you are, you know I am, I know you know I am... forever. We are assuming this holds. We are not proving *why* it holds."
  2.  **Trembling Hand Perfection / Off-Equilibrium Beliefs:**
      *   **Do not** get into what P2 should think if P1 makes a 'mistake' at Node 1.
      *   **Say this:** "BI assumes no mistakes happen. If a mistake happens, the logic breaks. We won't fix the logic today; we'll just note where it breaks."
  3.  **Infinite Centipedes:**
      *   **Do not** discuss what happens if the game never ends.
      *   **Say this:** "BI requires a last node. No last node, no BI. We are sticking to finite games."

  ---

  ### 6. The Diagnostic Final Question

  Do not ask them to solve a tree. Ask them to identify the *source* of the tension.

  **The Question:**
  > "Backward Induction proves Player 1 should Stop at Node 1. If you played this game for $1,000 and chose to **Pass** at Node 1, which specific assumption of the Backward Induction argument are you betting is false?"

  **What to listen for:**
  *   **Bad Answer:** "I'm betting people are nice." (This misses the game theory point).
  *   **Bad Answer:** "I'm betting the math is wrong." (They don't understand the logic).
  *   **Good Answer:** "I'm betting that Player 2 won't actually maximize their payoff at the last node," OR "I'm betting Player 2 doesn't know that I know they are rational."
  *   **Why this works:** It forces them to realize that the "Paradox" isn't that the math is wrong, but that the *assumptions* (Rationality or Knowledge thereof) are empirically fragile. It distinguishes between "I can't calculate" and "I reject the premise."

  ### Summary Checklist for the TA
  1.  **Warm-up:** 3-node sequential tree (not PD).
  2.  **Centipede:** 4-leg, modified end payoffs (high tension).
  3.  **Intervene:** When they say "Greed," correct to "Consistency." When they say "Theory is broken," correct to "Assumptions are strict."
  4.  **Cut:** Epistemic logic jargon.
  5.  **End:** Ask which assumption they are betting against.

  Good luck. Keep the tree on the board the whole time. Do not erase the BI solution until the very end.
