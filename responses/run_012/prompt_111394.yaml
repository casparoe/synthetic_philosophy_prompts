answer: |-
  **Project Title:** The Specificity Assumption: Translation Failure in the Ethics of Pest Control

  **Project Description**

  **Research Question**
  Current ethical discourse regarding pest control centres on a malformed question: "When is it permissible to kill a pest?" This proposal argues that this framing obscures the actual moral puzzle. Standard justifications for pesticide application—whether based on self-defence, economic thresholds, or proportionality—presuppose what I term the *specificity assumption*. This is the unstated premise that the set of organisms killed by an intervention is near enough identical to the set of organisms cited in its justification.

  This assumption is empirically fragile. Most insecticides are deliberately non-specific, and "pest" status is relational, defined by human interests rather than intrinsic properties. Consequently, justifications operating at the level of populations (e.g., suppressing a species below an economic injury level) are applied to practices that kill individuals indiscriminately. The core research question is therefore not whether insects are moral patients—that question remains open—but rather: *What implicit exchange rate between population-level outcomes and individual deaths is embedded in standard pest-management recommendations, and can this rate be defended by any plausible principle of permissible side-effect harm?*

  **Background and Gap**
  Existing literature fails to address this translation failure because it is divided by unit of concern. Agricultural ethics is predominantly systemic, focusing on crop yield, sustainability, and population dynamics. Animal ethics is predominantly individualistic, focusing on the welfare or rights of specific sentient beings. The interface between these levels—the mathematical and moral conversion of a population-level recommendation into an individual-level death profile—falls between stools. It is nobody's problem. Agronomists treat mortality as a variable in a model; ethicists treat it as a discrete event. Neither group explicitly defends the exchange rate that connects the two. This project isolates that exchange rate as its primary object of analysis.

  **Methodology**
  The project will proceed via conceptual modelling grounded in realistic scenarios. I will construct a small number of stylised pest-management cases (e.g., routine prophylactic spraying, seed treatments, broad-spectrum rescue applications). For each scenario, I will derive the implied individual-level death profile. Crucially, this derivation will not depend on fixed empirical figures. Instead, insecticide tonnage and population density estimates will be treated as free parameters. The analysis will ask what follows for any plausible value of these parameters.

  For each scenario, I will test standard ethical principles (e.g., doctrine of double effect, proportionality constraints) against the derived death profiles. The goal is to determine what per-individual moral weighting or what doctrine of side-effect harm would be required to render the recommendation permissible. If the required weighting is lower than any plausible view grants to a single organism, or if the permissible side-effect doctrine is more permissive than what would be tolerated in human contexts, the justification fails.

  **Significance and Risks**
  The primary risk is that the exercise merely rediscovers a trivial arithmetic truth: if you assign a tiny moral weight to each of a very large number of individuals, the aggregate harm is substantial. However, landing on this conclusion counts as a positive result rather than a failure. The significant finding would not be the arithmetic itself, but the demonstration that pest-control practice and its justificatory conventions are wholly insensitive to it. If standard recommendations require an implicit exchange rate that no ethical theory explicitly endorses, then the practice is operating on a justificatory deficit. The project succeeds if it makes the implicit explicit, regardless of whether the final verdict is that current practices are defensible or indefensible. It fails only if it cannot rigorously formulate the exchange rate itself.

  **Feasibility and Scope**
  This is a six-month, part-time project for a single investigator with no laboratory component. The work is purely conceptual and analytical, relying on publicly available agricultural guidelines and existing ethical frameworks. The treatment of empirical data as free parameters ensures the project remains viable without requiring primary data collection or precise entomological modelling.

  **Scope Limitations and Minimal Viable Project**
  To remain within the six-month part-time constraint, strict boundaries are necessary. The project will not attempt a comprehensive survey of all pesticide classes or agricultural systems. It will focus on three representative scenarios sufficient to demonstrate the translation failure. I will not defend a specific theory of insect moral status; the argument is designed to hold across a range of weightings.

  If timelines tighten, the following cuts are prescribed. First, the number of scenarios will be reduced from three to one archetypal case (e.g., prophylactic neonicotinoid seed treatment), provided that case is sufficiently complex to show the population-individual mismatch. Second, the analysis of alternative ethical principles will be limited to the doctrine of double effect and simple utilitarian aggregation, excluding more complex virtue-ethical or rights-based frameworks. The smallest version of the project worth funding is a single-scenario analysis that successfully derives the implicit exchange rate and demonstrates its incompatibility with standard ethical constraints. Even this reduced scope achieves the core aim: exposing the specificity assumption as undefended. The full scope adds robustness by showing the problem is systemic rather than anomalous to one practice.

  **Conclusion**
  By shifting the question from the permissibility of killing to the defensibility of the translation between population goals and individual deaths, this project exposes a structural gap in agricultural ethics. It offers a method for evaluating pest control that is agnostic on contentious metaphysical questions but rigorous on moral consistency. The outcome will be a clarified framework for assessing whether our current justificatory conventions can survive contact with the actual scale of individual harm they entail.
