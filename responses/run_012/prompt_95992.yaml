answer: |-
  There is no single, universally recognised noun for this specific predicament, though you have put your finger on a very real knot in ethical theory. You are describing a structural failure within **consequentialism** (the idea that the morality of an act is determined by its outcome) when it meets the reality of infinite causal chains.

  The closest established terms are **Cluelessness**, **The Non-Identity Problem**, and **The Infinity Problem**, but as you suspected, none of them quite capture the shape of what you are describing. Here is the breakdown of the nearest things, why they are not it, and then a proper definition for the thing you have found.

  ### The Nearest Established Concepts

  **1. Cluelessness (specifically 'Structural Cluelessness')**
  *   **What it is:** Discussed extensively by philosopher Hilary Greaves. It refers to the idea that we cannot know the long-term consequences of our actions, so we cannot calculate their utility.
  *   **Why it isn't yours:** Cluelessness is primarily *epistemic* (about knowledge). It says, "We are stuck because we don't know what happens next." You have posited a magic box. You *know* what happens next. Your problem is not ignorance; it is that even with perfect knowledge, the *valuation* remains impossible. You have moved from epistemic cluelessness to ontological indeterminacy.

  **2. The Non-Identity Problem**
  *   **What it is:** Formulated by Derek Parfit. It concerns actions that change *who* comes into existence. If you give the fiver, a specific child is born; if you don't, a different child is born. Since both lives might be worth living, it becomes hard to say one action was better for the people involved.
  *   **Why it isn't yours:** This covers your point about the grandchildren ("kids don't happen"), but it is focused on the identity of the people affected. Your problem is broader: it is about the *summation* of the chain itself. Even if the same people existed, you are stuck on where the account closes. The Non-Identity Problem is a subset of your worry, not the whole shape.

  **3. The Infinity Problem in Utilitarianism**
  *   **What it is:** A mathematical objection. If the future is infinite, and there is any positive utility in it, the total sum of goodness is infinity. Infinity plus a fiver is still infinity. Therefore, no action can be mathematically distinguished from another.
  *   **Why it isn't yours:** This is close, but it is purely mathematical. Your problem is phenomenological and normative. You aren't just saying the maths breaks; you are saying the *moral account* has no natural border. You feel the arbitrariness of drawing a line ("Stop at the bloke eating tonight"), not just the impossibility of the sum.

  ### The Coined Term: The Problem of Evaluative Closure

  Since there is no sticky label for this specific combination of perfect knowledge and unbounded consequence, I shall define one for you. Let us call it **The Problem of Evaluative Closure**.

  **Definition:**
  The Problem of Evaluative Closure is the inability to assign a determinate moral value to an action because the causal chain of consequences lacks a natural terminus, rendering any attempt to aggregate value arbitrary.

  **The Shape of the Thing:**
  Imagine a ledger. In ordinary accounting, you close the books at the end of the financial year. You draw a line. Everything after that line belongs to the next year. In ethics, there is no financial year. There is no natural line.
  *   **Up close:** The action looks like a discrete event (giving a fiver).
  *   **Far out:** The action dissolves into the background noise of history (shuffling resources between strangers).
  *   **The Conflict:** To judge the act, you must close the ledger. To close the ledger, you must draw a line. To draw a line is to admit arbitrariness. If you admit arbitrariness, the judgement feels illegitimate.

  **Edges and Scope:**
  *   **Does it apply to tiny things?** Yes. As your t-shirt example shows, even trivial purchases ripple out indefinitely. If the chain never ends, the scale of the initial act does not matter.
  *   **Does it apply to things I don't do (omissions)?** Yes, arguably more so. If you *don't* give the fiver, that money stays in your pocket, gets spent elsewhere, creates a different chain. The problem applies equally to action and inaction, which contributes to the paralysis (since doing nothing is also a choice with infinite consequences).
  *   **Does it apply to things nobody could foresee?** In your 'magic box' scenario, foreseeability is removed. In the real world, this problem is usually hidden by ignorance. It only becomes visible when you think hard enough to imagine the chain, but not hard enough to accept the arbitrariness of ignoring it.

  **What Would Have to Be True for It to Stop Applying?**
  For the Problem of Evaluative Closure to vanish, one of three things would have to be true:
  1.  **Causal Decay:** Consequences would have to naturally fade to zero moral relevance after a certain point (a 'moral half-life'). But there is no evidence that a great-grandchild's suffering counts for less than a child's.
  2.  **Agent-Relativity:** Morality would have to stop being about the 'view from nowhere' and return to the agent's immediate sphere. (i.e., "It matters what *I* intended," not "What happened afterwards"). This solves the problem by changing the definition of morality from consequentialist to deontological or virtue-based.
  3.  **A Natural Event Horizon:** There would need to be a point in the future where causality simply stops mattering to the present evaluation. Since time appears linear and connected, this does not exist.

  ### Summary

  You are not overthinking it; you have simply followed consequentialist logic to its natural breaking point. The people who "manage fine" are not smarter; they are implicitly accepting **arbitrary truncation**. They draw a line at "what I can see" or "what I intended" and ignore the rest. They have solved the Problem of Evaluative Closure by refusing to look at the ledger.

  You, however, are looking at the ledger. The term for your stuckness is **The Problem of Evaluative Closure**. It is the realisation that without an arbitrary cutoff, moral accounting is impossible, but with an arbitrary cutoff, moral accounting feels unjustified.
