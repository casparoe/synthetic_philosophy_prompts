              3.  Desire-Based Account (Categorical Desires): NOT BAD.
          *   Deprivation must be the odd one out based on features, not stipulation.
          *   Follow-up analysis:
              *   Walk through each account's verdict and why.
              *   Identify the single feature doing the work.
              *   Explain what flips if that feature is removed/reversed.
              *   Provide the best counter-argument from a deprivationist (not a strawman).
              *   Purpose: Argue deprivation account smuggles in desire-independent well-being.
              *   Ending: One line starting "Verdict:" naming the single feature (10 words or fewer).

  2.  **Deconstruct the Accounts:**
      *   **Deprivation Account (McMahan, Feldman, etc.):** Death is bad because it deprives you of the good life you would have had otherwise. To make this BAD, the future life must contain net positive well-being.
      *   **Epicurean Account (Epicurus, Lucretius, etc.):** Death is nothing to us. No subject exists to experience harm. To make this NOT BAD, simply adhere to the standard view (no subject = no harm). This is usually the default for any death scenario without an afterlife.
      *   **Desire-Based Account (Categorical Desires - Williams, etc.):** Death is bad if it thwarts categorical desires (projects that give life meaning/reason to continue). To make this NOT BAD, the person must lack categorical desires *or* have their categorical desires fulfilled/neutralized such that death doesn't thwart them.

  3.  **Designing the Scenario:**
      *   I need a person who *would* have had a good life (Deprivation says BAD) but *doesn't care* about continuing (Desire says NOT BAD).
      *   *Challenge:* Usually, if a life is good (Deprivation), the person wants to live (Desire). I need to decouple objective well-being from subjective desire for continuation.
      *   *Idea:* A person who is content, comfortable, and has a pleasant future ahead, but has completed all their major projects and has no further *categorical* desires driving them. They are indifferent to continuing.
      *   *Refinement:* Let's make it stronger. The person has *no* categorical desires left. They are satisfied. But the future holds pleasure (goods).
      *   *Scenario:* Arthur. Elderly, healthy, wealthy. All projects done. Books written, kids raised. He enjoys sunsets and coffee. He has no ambition left. He is indifferent to dying tomorrow vs. in 20 years. He dies suddenly.
      *   *Check Verdicts:*
          *   Deprivation: He loses 20 years of coffee/sunsets (goods). BAD.
          *   Epicurean: He doesn't exist to mind. NOT BAD.
          *   Desire (Categorical): He had no desires requiring future existence. He was indifferent. Death thwarts nothing categorical. NOT BAD.
      *   *Problem:* Is "enjoying sunsets" a categorical desire? Usually, categorical desires are projects/commitments. Simple pleasures might be conditional ("I want coffee *if* I'm alive"). Williams distinguishes categorical vs. conditional. If Arthur has no *reason* to keep going, just habits, death doesn't thwart a categorical desire.
      *   *Tweak:* Make sure the future goods are *objective* goods (pleasure, comfort) but not tied to any *project* or *goal* that constitutes a categorical desire. Arthur is in a state of "completedness."

  4.  **Drafting the Scenario (Under 2 paragraphs):**
      Arthur is eighty, healthy, and wealthy. He has raised his children, published his life's work, and traveled everywhere he wished. He feels no ambition, no unfinished business, and no fear of cessation; he is genuinely indifferent to whether he wakes tomorrow or never wakes again. However, his daily routine involves genuine pleasures: morning coffee, evening walks, friendly chats. These are passive enjoyments, not projects requiring a future. He dies instantly in his sleep. Had he lived, he would have experienced twenty more years of net positive pleasure and comfort, though no new achievements or deep commitments.

  5.  **Analyzing the Accounts:**
      *   **Deprivation:** Bad. He loses 20 years of net positive pleasure/comfort. The counterfactual life is better than non-existence.
      *   **Epicurean:** Not Bad. No subject exists to experience the loss.
      *   **Desire (Categorical):** Not Bad. He had no categorical desires (projects/reasons to continue). His desires were conditional (coffee *if* alive). Death thwarts no categorical desire because he had none.

  6.  **Identifying the Single Feature:**
      *   The feature is the **decoupling of future objective goods from categorical desires**. Or simply: **Future goods without categorical desires.**
      *   Let's refine: "Passive future goods absent categorical desires."
      *   Better: **The presence of future hedonic goods without categorical desires.**

  7.  **What flips if removed/reversed?**
      *   If he *had* categorical desires (e.g., "I must finish my memoir"), Desire account flips to BAD.
      *   If the future held *no* goods (misery), Deprivation flips to NOT BAD (or good).
      *   The prompt asks what flips if I remove/reverse the *single feature doing the work*. The feature making Deprivation odd is the existence of future goods *despite* lack of desire.
      *   If I remove the future goods (make future neutral/bad), Deprivation flips to NOT BAD. Then all three agree (Not Bad).
      *   If I add categorical desires, Desire flips to BAD. Then Deprivation and Desire agree (Bad), Epicurean stands alone.
      *   The prompt wants to show Deprivation smuggles in desire-independent well-being. So the feature is **objective future goods independent of desire**.
      *   If I remove objective future goods (make future neutral), Deprivation says Not Bad.
      *   If I make desires categorical, Desire says Bad.
      *   The key feature isolating Deprivation is **Future hedonic value without categorical commitment**.

  8.  **Deprivationist Counter-Argument (Best Shot):**
      *   They will argue that categorical desires aren't the only metric for harm.
      *   They might argue that "indifference" is irrational or mistaken if the future is good.
      *   They might argue that the desire account is too subjective. If life is good, you *ought* to want it.
      *   Strongest argument: The "Subjective Attitude" view is flawed. Well-being is partly objective. Even if Arthur doesn't *care* about the future coffee, the coffee is still *good for him*. Thwarting an interest (even a latent one) is a harm. Or: His indifference is a failure of rationality; a rational agent would desire the good future. Therefore, death thwarts the desire he *would* have had.

