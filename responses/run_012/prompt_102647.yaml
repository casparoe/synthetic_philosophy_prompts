      *Let's ensure the "instrument" has a name.* "The Continuity Covenant." Sounds good.

      *Let's ensure the "trap" is clear.* The doctor tries to find a way to let him live. The document blocks every path.

      *Okay, drafting now.*

      *Wait, need to make sure the later self's objection is real.* He needs to say "I don't want to die." And the doctor has to say "I know, but you told me to kill you if you said that."

      *Okay, let's write.*

      *(Word Count Monitoring)*:
      Intro: 300 words.
