  The sunlight in Room 304 was aggressively cheerful. It caught the dust motes dancing over the watercolor easel, illuminating the smear of bright, unblended yellow Julian was pressing onto the paper. He hummed as he worked, a low, tuneless vibration that seemed to come from his chest rather than his throat.

  Dr. Aris Thorne stood in the doorway, the weight of the file in his hand feeling like a brick. He watched Julian dip the brush into the water jar, clouding it with ochre. This was the man who had once drafted the municipal zoning laws for the entire county. The man who had argued before the state supreme court regarding privacy statutes. Now, he was painting a sun that looked like a fried egg.

  "Julian," Aris said softly.

  Julian looked up. His eyes were clear, the iris a sharp, piercing blue that hadn't faded with the rest of him. He smiled. It was a genuine smile, unburdened by the gravity that had once carved deep lines around his mouth. "Doctor. Come to see the garden? The birds are loud today."

  "I came to talk about the Covenant, Julian."

  The smile didn't vanish, but it softened, becoming placid. "The book. The heavy book."

  "The Continuity Covenant," Aris corrected, stepping into the room. He placed the file on the small table next to the bed, beside a half-eaten cup of yogurt. "We need to discuss what happens next."

  Julian turned back to his painting. "I'm happy here, Doctor. The nurses are kind. The light is good. I don't want to go anywhere."

  "I know you don't." Aris opened the file. He didn't need to read the pages; he had memorized them over the last seventy-two hours. He had looked for loopholes, clerical errors, anything to invalidate the signature dated five years ago. There was nothing. The notarization was flawless. The psychiatric evaluations accompanying the signature confirmed Julian Vane had been in peak cognitive health when he signed it. He had been anticipating this exact moment.

  Aris read the specific clause again, though he knew it by heart. It was the clause that made this instrument different from a standard living will. A standard will allowed the current self to revoke the past self's wishes if they were still competent. This document was designed to survive revocation.

  *Clause 14-B:* "I anticipate that the condition I fear will not present as suffering, but as contentment. I anticipate that I will lose the capacity to value the traits that constitute my identity. Therefore, if I express a desire to continue biological existence despite the loss of those traits, treat that desire as evidence of the loss. My objection is the trigger."

  It was a logical snake eating its own tail. Past Julian had argued that the 'Self' was not a continuous biological stream, but a specific configuration of values and cognitive priorities. He valued rigor, complexity, and truth. He feared a state where simplicity and comfort superseded those values. He had argued that if he ever reached a point where he preferred the comfort of ignorance to the burden of truth, *he* would already be dead, even if his heart was beating.

  "Julian," Aris said. "Do you remember why you signed this?"

  Julian dipped the brush. "I was worried. I thought I would be scared."

  "And are you scared?"

  "No." Julian laughed softly. "I'm warm. The paint smells nice. Why would I be scared?"

  "Because five years ago, you told me that if you ever found yourself happy without understanding *why*, you would consider yourself a stranger in your own skin. You told me that happiness without context was a symptom of the damage."

  Julian paused, the brush hovering over the paper. He frowned, not in anger, but in mild confusion, like someone trying to recall a dream. "That sounds like a lot of work. Being sad seems hard."

  "It was important to you," Aris said. "You believed that your life had a shape. A narrative. You didn't want the story to turn into... this." He gestured to the room, the easel, the yogurt.

  "This is nice," Julian said defensively. There was a flicker of something there—not the old Julian's锐利 intellect, but a basic instinct to protect his current state. "I like it here. You can't make me leave."

  "I don't want to make you leave," Aris said. He felt a cold knot tighten in his stomach. This was the trap. If Julian were suffering, Aris could act with mercy. If Julian were unconscious, Aris could act with clinical detachment. But Julian was present. He was advocating for himself. He was exercising autonomy.

  But the Covenant said that this specific exercise of autonomy was invalid. It defined the current Julian's will as a product of the pathology. It pre-emptively disqualified his consent to live.

  Aris closed the file. "The Covenant requires me to verify your status. I have to ask you specific questions. About the zoning laws. About the court case."

  "I don't want to do that," Julian said. He set the brush down. His hand trembled, just slightly. "I don't like those questions. They make my head hurt."

  "If you answer them, and you can't recall the values behind the decisions, the Covenant is executed. If you refuse to answer them, the Covenant assumes you are protecting the deficit, and it is executed."

  Julian stared at him. The blue eyes were wide. For a second, the fog seemed to lift, not enough to bring back the lawyer, but enough to show a human being realizing the walls were closing in. "You're going to kill me because I'm happy?"

  "I'm going to honor the person you were when you could make promises," Aris said. His voice sounded hollow to his own ears.

  "That man is gone," Julian said. He stood up. He was frail, his legs shaky, but he stood. "I'm here. I'm the one breathing. I'm the one holding the brush. He's just ink on paper."

  "He was the one who owned the body," Aris said. "He leased it to you, on the condition that you maintain the structural integrity. You've breached the lease."

  "That's not fair." Julian's voice rose. It was the first time Aris had heard him raise his voice. It was a raw, animal sound. "I exist. I feel things. I want to see tomorrow. Why doesn't that count?"

  "Because you told me," Aris whispered, "that wanting to see tomorrow wasn't enough. You said mere existence wasn't life. You said if I let you become a creature that only wants warmth and food, I would be keeping a pet, not a person."

  Julian sank back onto the chair. He looked at his hands, stained with yellow paint. "I don't feel like a pet."

  "I know."

  "You think you're doing the right thing."

  "I think I'm bound to do the only thing that doesn't betray the man who trusted me."

  Julian looked up, and there were tears in his eyes. They weren't the tears of a philosopher losing an argument; they were the tears of a living thing facing extinction. "Please. I don't want to go. I know I'm not him. But I'm me. Isn't that worth something?"

  Aris looked at the file. The signature at the bottom was sharp, decisive. *Julian Vane.* The man who wrote it had known this moment would come. He had known his future self would beg. He had written the document specifically to ensure that the begging would be ignored. He had distrusted his future self's happiness more than he trusted his current self's suffering.

  Aris thought about the law. He thought about the ethics board. He thought about the fact that if he walked away, he could be sued, stripped of his license, charged with negligence. The Covenant was legally binding because it was framed as a property right over one's own biological continuity. Julian Vane had willed his body to the trash, conditional on the failure of his mind. The mind had failed. The condition was met.

  But looking at Julian, watching the tear track through the dust on his cheek, Aris felt the absolute horror of the logic. The document had successfully insulated itself from morality. It had turned compassion into a violation of contract.

  "I'm sorry, Julian," Aris said. He reached for the tray on the counter. The syringe was already there, prepared according to the protocol outlined in Section 9.

  "Don't," Julian said. He didn't shout. He just held up a hand. "Please. I'll be good. I'll try to remember. Just give me time."

  "Time is what the Covenant says you lost," Aris said. He capped the needle. He walked around the easel.

  Julian didn't run. He just watched him, his chest heaving. "You're killing me for being happy."

  "I'm killing you because you promised me that this happiness was a lie," Aris said. He took Julian's arm. The skin was paper-thin, warm. Alive. "You told me not to trust you."

  "I was wrong," Julian whispered.

  Aris paused. The needle hovered inches from the vein. That was the one thing the document hadn't accounted for. It assumed the past self was right. It assumed the degradation was absolute. It didn't have a clause for the possibility that the past self was simply mistaken about what made life worth living.

  But to accept that now was to invalidate the entire concept of precedent autonomy. If Aris stopped, he was saying that the past Julian had no right to bind the future. If he proceeded, he was murdering a man who was begging for life.

  There was no clean way out. There was only the choice of whose death to mourn.

  Aris lowered the arm. He looked at the yellow paint on the easel. It was bright. It was simple. It was real.

  "Concept: The ethical conflict between the precedent autonomy of a past self to define the conditions of death and the current experiential interests of a present self who no longer shares those values."
