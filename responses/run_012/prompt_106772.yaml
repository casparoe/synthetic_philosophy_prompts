answer: |-
  # Specification for a Theory of Manipulation vs. Legitimate Persuasion

  ## I. Functional Constraints (Non-Negotiable)
  *These requirements are derived from your stated purpose (school policy/debate judging). A theory that fails these is unusable for your project, regardless of its philosophical elegance.*

  **1. The Observability Constraint**
  *   **Requirement:** The criteria for classification must rely exclusively on publicly accessible evidence (speech acts, context, timing, structural setup). The theory cannot require access to the influencer's private mental states (intentions, beliefs, hopes) nor require interrogation of the target.
  *   **Motivation:** A debate judge or school administrator cannot read minds. They must be able to apply the rule in real-time based on the record.
  *   **Status:** **Non-Negotiable.** Without this, the theory is a metaphysical account, not a policy tool.

  **2. The Non-Deceptive Capture**
  *   **Requirement:** The theory must classify acts as manipulation even when no false propositions are asserted and no information is actively concealed.
  *   **Motivation:** Covers the **Salesperson Case** (selective truth/wrong inference) and the **Public Health Case** (accurate risks/fear). If the theory requires lying, it fails to distinguish manipulation from simple deception.
  *   **Status:** **Non-Negotiable.** This is the core philosophical problem you are investigating.

  **3. The Coercion/Manipulation Distinction**
  *   **Requirement:** The theory must provide a clear boundary condition where an act stops being manipulation and becomes coercion. It must identify the specific feature (e.g., threat of force, removal of option) that shifts the classification.
  *   **Motivation:** A policy on persuasion must not accidentally ban necessary enforcement or legitimate warnings.
  *   **Status:** **Non-Negotiable.** Collapsing these categories renders the policy useless for distinguishing acceptable pressure from unacceptable force.

  **4. The Classification/Judgment Separation**
  *   **Requirement:** The definition of manipulation must be descriptive, not inherently condemnatory. The theory must allow for the logical possibility of "permissible manipulation" or "welcome manipulation."
  *   **Motivation:** Covers the **Coach Case** (requested pressure). If "manipulation" is defined as "wrongful influence," you cannot coherently ask if consent makes it permissible; it would be a tautology.
  *   **Status:** **Non-Negotiable.** This is required to make sense of your seventh case.

  ---

  ## II. Substantive Desiderata (Theoretical Standards)
  *These requirements ensure the theory captures the philosophical nuance of the specific cases you listed. A theory might arguably fail one of these and still be a theory, but it would fail *your* essay's specific test cases.*

  **5. The Reason-Structure Requirement**
  *   **Requirement:** The theory must distinguish between influence that *supplies* a new reason (persuasion) and influence that *alters the weight or processing* of existing reasons without adding to the evidence (manipulation). It must explain how an influence can be reason-based but not reason-respecting.
  *   **Motivation:** Covers the **Salesperson Case** (arranging facts to force a wrong inference) and the **Campaign Case** (repetition wearing down doubt). Both involve true information but corrupt the inferential process.
  *   **Status:** **Theoretical Non-Negotiable.** Without this, the theory cannot distinguish a strong argument from a psychological trick.

  **6. The Vulnerability Condition**
  *   **Requirement:** The theory must account for the target's capacity to process information at the time of influence. It must identify when an influence targets a temporary or permanent deficit in agency (fatigue, loneliness, fear) rather than the target's rational evaluation.
  *   **Motivation:** Covers the **Friend Case** (timing request to loneliness) and the **Exhaustion Case** (dumping info when tired).
  *   **Status:** **Theoretical Non-Negotiable.** This distinguishes legitimate timing from exploitative timing.

  **7. The Architecture Clause**
  *   **Requirement:** The theory must classify changes to the *structure* of choice (defaults, framing, option ordering) as potential manipulation, even if all options remain available and transparent.
  *   **Motivation:** Covers the **Government Case** (opt-out vs. opt-in defaults).
  *   **Status:** **Theoretical Non-Negotiable.** Modern manipulation often happens via choice architecture, not just speech.

  **8. The Consent Classification Rule**
  *   **Requirement:** The theory must take a definite stance on whether the target's prior consent changes the *ontological classification* of the act (i.e., does it stop being manipulation?) or merely its *moral valence* (i.e., is it still manipulation but allowed?). It cannot be agnostic.
  *   **Motivation:** Covers the **Coach Case**. You need a definite answer for the essay to proceed.
  *   **Status:** **Camp Preference.** This is where philosophical camps divide. Some say consent makes it "collaboration," others say it remains "managed influence." The theory must pick one, but which one it picks is a substantive commitment, not a functional necessity.

  **9. The Truth-Irrelevance Clause**
  *   **Requirement:** The truth value of the information conveyed must not be the primary determinant of classification. A true statement can be manipulative; a false statement can be a simple mistake.
  *   **Motivation:** Covers the **Public Health Case** (accurate risks) and **Salesperson Case** (nothing false).
  *   **Status:** **Theoretical Non-Negotiable.** If truth determines manipulation, you collapse the distinction between manipulation and lying.

  ---

  ## III. Flagged Conflicts and Tensions

  You correctly identified that some of these requirements pull against each other. A successful theory must explain how it navigates these tensions, not hide them.

  **Conflict A: Observability vs. The Consent Classification Rule**
  *   **The Tension:** You require the theory to be workable without access to private intentions (Constraint 1), but you also require it to handle the **Coach Case** (Consent). Consent is often an internal state. If a student internally resents the coach's pressure but verbally agreed to it, is it manipulation?
  *   **The Force:** If the theory relies on *internal* consent to de-classify an act as manipulation, it violates the Observability Constraint (the judge can't know the internal state). If the theory relies only on *expressed* consent, it risks classifying coerced or performative agreement as "legitimate."
  *   **Resolution Demand:** The theory must define consent *publicly* (e.g., explicit prior agreement to specific tactics). It must accept that this means some "internal" manipulations might be classified as legitimate because they were publicly authorized. You cannot have both perfect mind-reading accuracy and public workability.

  **Conflict B: Truth-Irrelevance vs. The Reason-Structure Requirement**
  *   **The Tension:** You require the theory to ignore truth values (Desideratum 9) but also to catch the **Salesperson Case** where the inference drawn is *wrong* despite the premises being *true*.
  *   **The Force:** If the theory cannot appeal to the falsity of the conclusion (since the premises are true), it must appeal to the *process* of inference. However, judging whether an inference is "reasonable" often looks suspiciously like judging whether the belief is "true."
  *   **Resolution Demand:** The theory must define "reasonable inference" procedurally (e.g., "would a reasonably attentive agent draw this link without emotional pressure?") rather than epistemically (e.g., "is the conclusion factually correct?").

  **Conflict C: Vulnerability vs. Legitimate Persuasion**
  *   **The Tension:** All persuasion targets some psychological state (hope, fear, desire). Desideratum 6 requires catching the exploitation of vulnerability (Friend Case).
  *   **The Force:** If *any* appeal to emotion is manipulation, legitimate persuasion vanishes. If *no* appeal to emotion is manipulation, the Friend Case is missed.
  *   **Resolution Demand:** The theory must distinguish between appealing to a reason *via* emotion (e.g., "You should be afraid because the risk is high") versus bypassing reason *with* emotion (e.g., "Be afraid so you don't think about the risk"). This is a fine line to draw observably.

  ---

  ## IV. The Single Most Exclusionary Requirement

  **The Observability Constraint (Constraint 1)** is the requirement that will exclude the highest number of candidate theories.

  **Why this one?**
  The dominant tradition in philosophical accounts of manipulation defines it primarily through the **intentions of the manipulator**. Standard accounts argue that manipulation requires an *intent to subvert* the target's autonomy or an *intent to deceive* (even without lying).

  *   **The Problem:** For your purpose (school policy/debate judging), an intentionalist definition is useless. A judge cannot rule that a speech was manipulative only if they can prove the speaker *intended* to subvert autonomy. A speaker can claim, "I honestly thought this was the best way to help," and the intentionalist theory would have to classify the act as non-manipulative, even if the effect was exploitative.
  *   **The Exclusion:** To satisfy your constraint, a theory must define manipulation **mechanistically** (based on the method used) or **consequentially** (based on the impact on the target's reasoning process), independent of the speaker's state of mind.
  *   **The Cost:** This forces the theory to classify accidental manipulation as manipulation (e.g., someone unintentionally exploits a vulnerability through clumsiness). Many philosophers reject this, arguing that without the wrongful intent, it is merely a mistake, not manipulation. By demanding observability, you are forcing the theory to prioritize the *target's experience and the act's structure* over the *agent's moral culpability*.

  **Summary for your Essay:**
  Your specification demands a theory that is **mechanistic rather than intentionalist**, **descriptive rather than moralized**, and **procedural rather than truth-based**. Any candidate theory that relies on probing the speaker's heart, equating manipulation with immorality, or defining it solely by the falsity of claims will fail your specification immediately.
