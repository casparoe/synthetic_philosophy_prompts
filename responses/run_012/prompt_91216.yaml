answer: |-
  ### Part 1: The Two Distinctions (2-Minute Explanation)

  You do not need a degree in ethics to use this. You only need to understand two differences.

  **1. The Floor vs. The Furniture**
  Imagine you are entering someone else's house.
  *   **The Floor** represents things that hold the weight of the building: Laws (yours and theirs), Safety, and Human Rights. You do not drill holes in the floor. If a local custom requires you to break the law or hurt someone, you stop.
  *   **The Furniture** represents how the room is arranged: Greetings, shoes off, tipping, queueing. You can move this, but if you want to be a good guest, you arrange it the way the host does. Ignoring the furniture isn't immoral, but it is rude, and it makes living there harder.

  **2. The Guest vs. The Reformer**
  *   **The Guest:** You are there for two years to work and live. Your primary job is not to fix the country's culture. If a custom is merely different (Furniture), you adopt it to show respect and make life smoother.
  *   **The Reformer:** You only become a reformer if the Floor is breaking (e.g., safety violations, corruption, discrimination). Even then, you are an employee first. You do not fight these battles alone; you hand them to the Firm.

  **The Goal:** This procedure helps you sort whether you are looking at the Floor or the Furniture, and whether you are acting as a Guest or a Reformer.

  ***

  ### Part 2: The "Floor and Furniture" Decision Procedure

  **Instructions:** Take the specific situation (e.g., "Should I tip?") and run it through these five questions in order. Stop at the first instruction that gives a verdict.

  **Q1: The Hard Line (Law & Policy)**
  *   **Ask:** Does doing this violate UK/US/Home law, our Firm's Code of Conduct, or explicit Safety Regulations?
  *   **Sufficient Answer:** Yes (confirmed by Legal/HR) OR No.
  *   **If YES:** **STOP. DO NOT COMPLY.**
      *   *Action:* Hand off to **Legal Team / Country Manager**. Do not attempt to negotiate this yourself.
      *   *Note:* This applies to families too. If the employee cannot accept a gift, the spouse cannot accept it on their behalf.
  *   **If NO:** Proceed to Q2.
      *   *[JUDGMENT ALERT]:* Distinguish between "Local Law on Books" and "Local Law in Action." If a law exists (e.g., jaywalking) but is never enforced and carries no penalty, treat it as a Custom (Q3), not a Law (Q1). If unsure, ask the Country Manager.

  **Q2: The Harm Check (Safety & Rights)**
  *   **Ask:** Does doing this (or *not* doing this) create a physical safety risk or violate someone's dignity/rights?
  *   **Sufficient Answer:** Yes (Risk of injury, harassment, discrimination) OR No (Merely awkward, inefficient, or annoying).
  *   **If YES:** **STOP. DO NOT COMPLY.**
      *   *Action:* Prioritize safety. If the local custom is dangerous (e.g., unsafe driving norms), do not adopt it.
  *   **If NO:** Proceed to Q3.

  **Q3: The Respect Check (Local Meaning)**
  *   **Ask:** In this specific context, is this practice the local language of respect? Will ignoring it be read as an insult or a sign of arrogance?
  *   **Sufficient Answer:** Yes (Locals explicitly expect it) OR No (It is optional or unnoticed).
  *   **If YES:** **COMPLY.**
      *   *Reasoning:* This is "Furniture." Moving it costs you little but gains you goodwill.
      *   *Exception:* If complying makes you deeply uncomfortable regarding your own values, see Q5.
  *   **If NO:** **OPTIONAL.**
      *   *Reasoning:* You may do as you please, provided it doesn't violate Q1 or Q2.
      *   *[JUDGMENT ALERT]:* You are relying on hearsay here. You might be wrong about what locals think. When in doubt, assume "Yes."

  **Q4: The Contested Check (Internal Politics)**
  *   **Ask:** Is this practice something a significant portion of the local population resents or is trying to change (e.g., gender segregation, caste interactions)?
  *   **Sufficient Answer:** Yes (Known political tension) OR No / Don't Know.
  *   **If YES:** **ROUTE AROUND.**
      *   *Action:* Do not take a side. Find a third option that avoids the practice without making a scene.
      *   *Example:* If a dinner requires excluding women, host the dinner at the office instead.
      *   *Hand-off:* If you cannot route around, consult the **Country Manager**.
  *   **If NO / DON'T KNOW:** Proceed to Q5.
      *   *[JUDGMENT ALERT]:* "Don't Know" is the most common answer. You are outsiders. If you suspect tension, treat it as "Yes."

  **Q5: The Family & Contract Check**
  *   **Ask:** Are you the assigned Employee or a Family Member?
  *   **If EMPLOYEE:**
      *   **Verdict:** Follow the outcome of Q1–Q4 strictly. You represent the Firm.
  *   **If FAMILY MEMBER:**
      *   **Verdict:** Your primary rule is **"Do not jeopardize the Employee."**
      *   *Action:* Even if a custom is "Optional" (Q3), if ignoring it makes your spouse look bad to their colleagues, you should Comply. You have not signed the contract, but you share the consequences.

  ***

  ### Part 3: Test Cases

  Here is how the procedure handles three common scenarios.

  #### Case 1: Tipping in a "No-Tip" Culture
  *Scenario: In this country, leaving cash on the table is read as patronizing or awkward, not kind.*
  *   **Q1 (Law/Policy):** No violation.
  *   **Q2 (Harm):** No physical harm.
  *   **Q3 (Respect):** **YES.** Locals read tipping as an insult.
  *   **Verdict:** **COMPLY (Do not tip).**
  *   **Step Turned On:** Q3.
  *   **Reasonable Dissent:** An employee might argue, "I want to reward good service." They might tip anyway. They haven't misapplied the procedure, but they have prioritized their own moral framework over the "Guest" principle. The procedure flags this as risky for relationships, not immoral.

  #### Case 2: Jaywalking (Illegal but Ignored)
  *Scenario: It is technically illegal to cross against the light, but police ignore it and everyone does it.*
  *   **Q1 (Law/Policy):** **JUDGMENT CALL.** Technically "Yes" (Local Law), but practically "No" (Enforcement).
      *   *Procedure Instruction:* Treat as Custom (Q3) because there is no penalty.
  *   **Q2 (Harm):** **YES/MIXED.** Physical safety risk exists regardless of law.
  *   **Q3 (Respect):** Irrelevant due to Q2.
  *   **Verdict:** **ROUTE AROUND / PRUDENCE.**
  *   **Step Turned On:** Q2 (Safety).
  *   **Reasoning:** The procedure prioritizes safety over custom. You don't need to make a stand (Reformer), but you shouldn't get hit by a bus (Guest).
  *   **Reasonable Dissent:** An employee might decide the traffic is light enough to cross. The procedure allows this *if* they deem the safety risk low (Q2 judgment). Another employee might refuse on principle (obey the law). Both are valid under Q2's judgment call.

  #### Case 3: Gift to a Government Official
  *Scenario: A local official expects a gift to process a permit. This is standard local practice.*
  *   **Q1 (Law/Policy):** **YES.** Violates UK Bribery Act / US FCPA and Firm Code.
  *   **Verdict:** **STOP. DO NOT COMPLY.**
  *   **Step Turned On:** Q1.
  *   **Action:** Hand off to **Legal / Country Manager**.
  *   **Consequence:** You may lose the business/permit. The procedure accepts this cost.
  *   **Reasonable Dissent:** None allowed. A reasonable employee might *wish* to pay to save the project, but the procedure forbids it. If they pay, they have violated Q1, not misapplied the logic.

  ***

  ### Part 4: Limitations & Vulnerabilities

  **What This Procedure Cannot Do**
  1.  **It cannot protect you from ambiguity.** In the "Contested Check" (Q4), you will often not know if a practice is resented. The procedure tells you to "assume yes," but that is a guess. You may still offend someone despite following the rules.
  2.  **It cannot solve moral distress.** If a "Furniture" item (Q3) conflicts deeply with your personal values (e.g., gender segregation in social settings), the procedure says "Comply" or "Route Around." It does not give you permission to feel good about it. It only tells you how to keep your job and stay safe.
  3.  **It cannot replace local intelligence.** This is a filter, not a source of truth. You still need to ask the Country Manager or local hires what the answers to Q3 and Q4 actually are.

  **The Gamable Step**
  The step most likely to be gamed is **Q3: The Respect Check.**

  *   **How it is gamed:** An employee who *wants* to do something (or *wants* to refuse something) can convince themselves that "Locals don't really care" or "Locals actually prefer it my way."
  *   **Example:** An employee hates taking shoes off. They tell themselves, "The host won't mind," when in fact the host is too polite to say anything.
  *   **Mitigation:** In the briefing, tell them: *"If you have to ask yourself if it matters, it matters. Assume the local custom holds weight unless a trusted local source tells you otherwise."*
