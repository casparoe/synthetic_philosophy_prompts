  2.  **Deconstruct the Core Philosophical Problem:**

      *   The user is grappling with *cultural relativism vs. universalism*, *convention vs. morality*, and *obligation vs. prudence*.
      *   *Core Distinction 1:* **Harm/Right vs. Habit/Style.** Is breaking this rule hurting someone or violating a right, or is it just breaking a habit?
      *   *Core Distinction 2:* **Obligation vs. Prudence.** Do we *owe* this (moral/legal/contractual), or is it just *smarter* to do it to get along?
      *   *Core Distinction 3:* **Agency.** Can we actually change this, or are we guests?
      *   *Refinement for the User:* Keep it simple.
          *   Distinction 1: **The Hard Line (Law/ Ethics)** vs. **The Soft Line (Custom/ Respect).**
          *   Distinction 2: **Cost of Compliance** vs. **Cost of Offense.**

  3.  **Drafting the Core Distinctions (2-Minute Account):**

      *   Need to avoid jargon.
