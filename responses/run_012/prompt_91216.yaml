      *   *Gamable Step:* The "Harm/Respect" assessment. People can convince themselves something isn't harmful or is respectful when it isn't.
      *   *Limitations:* Can't solve deep ethical dilemmas. Can't protect families fully. Can't predict political shifts.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Tone:* Professional, pragmatic, empathetic, clear.
