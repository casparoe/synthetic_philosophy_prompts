  4.  **Developing the Decision Procedure:**

      *   Needs to be a flowchart style but in text.
      *   Steps need to be sequential.
      *   Need clear "Stop/Comply," "Stop/Don't Comply," "Escalate," and "Route Around."
      *   *Step 1: Legality & Firm Policy.* (The Hard Stop). If it breaks home law or firm code -> Don't do it.
      *   *Step 2: Harm & Rights.* Does it hurt someone? (Safety, dignity). If yes -> Don't do it (usually).
      *   *Step 3: Respect & Relationship.* Is this how locals show respect? If yes -> Comply (unless Step 1 stopped you).
      *   *Step 4: Family/Contract.* Are you staff or family? Staff = stricter. Family = prudence based.
      *   *Step 5: The "Contested" Check.* Is this practice hated by locals? (Hard to know). If suspected -> Route Around.
      *   *Refinement:* Make it a "5-Question Filter."
