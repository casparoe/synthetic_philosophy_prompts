      *Refining the "Uncomfortable" Verdict:* I will make Case 1 the uncomfortable one. Approving the demolition of rent-stabilized housing feels wrong morally, even if legally sound under the described statute. This highlights the tension between the "Property Script" and the "Neighborhood Script" and how the procedure navigates it (by prioritizing the Regional Claimant/State Mandate).

      *Wait, looking at the Statute:* "Bars us from denying a code-compliant project on account of the income or identity of the people who would live in it." It does *not* explicitly bar protecting existing tenants. However, if the project is code-compliant, and the only objection is displacement, is that a valid denial ground? In many states (like CA with SB 330/423), displacement is a mitigation issue, not a denial issue, if the housing is needed. I will structure the procedure to treat displacement as a *mitigation* requirement, not a *denial* ground, unless specific local ordinance protects the specific units. This makes the Approval the legally safe but morally fraught path.

