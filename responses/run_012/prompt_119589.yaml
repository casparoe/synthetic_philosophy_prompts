  6.  **Drafting the Limitations:**
      *   What can't it do? It can't solve the housing crisis alone. It can't remove the moral weight of displacement. It can't stop the "character" dog whistle entirely, only expose it. It creates a veneer of rationality that might still be political.

  7.  **Review against Constraints:**
      *   *PhD Tone:* Needs to be sophisticated but practical.
