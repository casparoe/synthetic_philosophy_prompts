answer: |-
  ### THE COMMISSION'S DELIBERATIVE PROTOCOL
  **Purpose:** To generate a legally defensible record that distinguishes evidence-based impacts from exclusionary preferences, consistent with the State Accountability Statute.
  **Claimants Recognized:** (1) The Applicant (property rights); (2) Current Residents (stability/amenity); (3) Future Residents (housing access); (4) The Region (statutory housing share). *Note: The procedure weights Claimant 4 heavily where state law mandates capacity.*

  **STEP 1: THE THRESHOLD (Fact Finding)**
  *   **Question:** Does the project comply with all objective zoning standards (height, setback, density, parking)?
  *   **Burden:** Applicant.
  *   **Sufficient Answer:** Staff report confirmation or unrefuted technical evidence.
  *   **Default:** If the record is silent, compliance is presumed.
  *   **Outcome:** If **No**, deny based on code. If **Yes**, proceed to Step 2. *Denial here is a Finding of Fact.*

  **STEP 2: THE NEXUS (Fact Finding)**
  *   **Question:** Do the objections raised (traffic, shadows, safety, character) demonstrate a *specific, adverse physical impact* that exceeds normal urban friction?
  *   **Burden:** Opponents.
  *   **Sufficient Answer:** Peer-reviewed studies, traffic counts, or specific geometric proof (e.g., "This wall blocks 4 hours of light to Unit 3"). Generalized fears ("traffic will get worse," "safety risk") are insufficient.
  *   **Default:** If the record is silent or evidence is anecdotal, the impact is presumed negligible.
  *   **Outcome:** If **No**, objections are dismissed as preference. If **Yes**, proceed to Step 3. *This is a Finding of Fact.*

  **STEP 3: MITIGATION (Fact Finding)**
  *   **Question:** Can the identified adverse impact be mitigated to a level of insignificance through conditions of approval?
  *   **Burden:** Shared (Applicant proposes, Commission evaluates).
  *   **Sufficient Answer:** A condition that directly addresses the nexus (e.g., "Left-turn lane added" for traffic).
  *   **Default:** If mitigation is feasible, it must be applied. Denial is only permissible if mitigation is impossible.
  *   **Outcome:** If **Yes**, approve with conditions. If **No**, proceed to Step 4. *This is a Finding of Fact.*

  **STEP 4: THE STATUTORY BAR (Legal Compliance)**
  *   **Question:** Is the remaining ground for denial based on the income, race, or identity of the *future* residents, or the *type* of housing (e.g., affordable, shelter)?
  *   **Burden:** Commission (Self-Check).
  *   **Sufficient Answer:** A clear statement that the denial rests on physical impact, not user identity.
  *   **Default:** If the objection targets the *people* (e.g., "homeless," "low-income"), the objection is legally void under the Statute.
  *   **Outcome:** If **Yes** (it is identity-based), you must approve. *This is a Conclusion of Law.*

  **STEP 5: THE VALUE JUDGMENT (Policy Ownership)**
  *   **Question:** We have met code and mitigated impacts, but does this project violate a fundamental public welfare goal (e.g., total loss of affordable stock, regional housing failure) that justifies overriding the Applicant's entitlement?
  *   **Burden:** Commission.
  *   **Sufficient Answer:** A vote and a spoken acknowledgment that we are prioritizing one Claimant over another (e.g., "We prioritize Regional Need over Local Character").
  *   **Default:** If the Commission cannot articulate a public welfare goal beyond "neighborhood preference," the Applicant prevails.
  *   **Outcome:** This is **not** a finding. It is a **Policy Choice**. It must be read into the record as: *"The Commission acknowledges this decision prioritizes [Claimant X] over [Claimant Y]."*

  ***

  ### APPLICATION TO PENDING CASES

  #### CASE 1: The Transit Corridor Replacement
  **Facts:** 40-unit market-rate building replaces 6-unit rent-stabilized building. Tenants get relocation pay, no right to return. Code compliant.
  **Procedure Run:**
  1.  **Threshold:** Compliant.
  2.  **Nexus:** Displacement is a specific impact. However, under the Statute, the *identity* of the displaced (low-income) cannot be the sole ground for denial if the new housing serves a regional need.
  3.  **Mitigation:** Relocation payments are offered. No physical impact (traffic/shadow) is unmitigable.
  4.  **Statutory Bar:** Denying based on the loss of low-income tenants risks violating the ban on income-based denial of *new* housing, provided the new housing is not exclusionary.
  5.  **Value Judgment:** The Commission must choose between Existing Tenants (Claimant 2) and Regional Housing Need (Claimant 4).
  **Verdict:** **APPROVE.**
  **Reasoning for Record:** "The project meets all objective standards. While the Commission regrets the loss of six rent-stabilized units, the State Accountability Statute prohibits denying code-compliant housing based on the income profile of the tenants. The regional need for housing density on transit corridors (Claimant 4) outweighs the preservation of existing low-density stock (Claimant 2). We impose a condition that the applicant fund a local housing trust to offset the loss."
  *(Note: This is the uncomfortable verdict. It prioritizes abstract regional need over concrete local vulnerability, enforcing the market logic the Statute protects.)*

  #### CASE 2: Scattered-Site Homeless Housing
  **Facts:** 12 units for people exiting homelessness. Neighbors cite "safety" and "traffic."
  **Procedure Run:**
  1.  **Threshold:** Compliant.
  2.  **Nexus:** Neighbors offer no traffic study or crime statistics. "Safety" is generalized.
  3.  **Mitigation:** N/A (No specific impact proven).
  4.  **Statutory Bar:** Objections regarding "people leaving homelessness" directly trigger the Statute's ban on identity-based denial.
  5.  **Value Judgment:** None required; the Statute dictates the outcome.
  **Verdict:** **APPROVE.**
  **Reasoning for Record:** "The opposition has failed to meet the burden in Step 2. No evidence was entered showing this project generates more traffic or crime than any other 12-unit residence. To the extent objections rely on the status of the residents, they are barred by the State Accountability Statute. Generalized fear is not an adverse impact."

  #### CASE 3: The Neighborhood Downzone Petition
  **Facts:** Neighborhood association petitions to downzone their blocks. Supported by current residents. Reduces city's regional housing capacity.
  **Procedure Run:**
  1.  **Threshold:** The petition itself is a legislative request, but we evaluate it against the General Plan.
  2.  **Nexus:** The "impact" is increased density, which is the goal of the General Plan.
  3.  **Mitigation:** Cannot mitigate "density" without defeating the purpose.
  4.  **Statutory Bar:** The Statute mandates the city meet its regional share.
  5.  **Value Judgment:** Current Residents (Claimant 2) vs. The Region (Claimant 4).
  **Verdict:** **DENY THE DOWNZONE (Maintain Capacity).**
  **Reasoning for Record:** "While the neighborhood association speaks for Current Residents (Claimant 2), the Commission is bound to serve the Regional Claimant (Claimant 4). Granting this downzone would reduce capacity below the state-mandated share. We acknowledge this overrides local preference for exclusivity. We prioritize the region's need for housing over this neighborhood's desire to limit supply."
  *(Note: This verdict treats the neighborhood's democratic will as subordinate to the technocratic regional mandate.)*

  ***

  ### WHAT THIS PROCEDURE CANNOT DO

  **1. It Cannot Resolve the Moral Cost of Displacement.**
  In Case 1, the procedure forces you to approve the demolition of affordable housing. It treats displacement as a "mitigation" issue (relocation payments) rather than a fundamental rights violation. The record will read as principled, but it is really the State's housing production ideology in costume. You are not solving the justice problem; you are complying with the statute while documenting the loss.

  **2. It Cannot Stop the "Character" Dog Whistle.**
  Step 2 requires opponents to provide evidence. They will learn to provide it. Expect "traffic studies" funded by neighborhood associations that magically find significant impacts where none existed. The procedure forces them to lie with data rather than feelings. You will still have to weigh conflicting expert testimony, and your choice of which expert to believe will remain political, no matter how "factual" you call it.

  **3. It Cannot Protect the "Regional Claimant" from Political Retribution.**
  Step 5 requires you to own the value judgment aloud. When you vote to deny the downzone (Case 3) or approve the displacement (Case 1), you are telling your neighbors their interests are secondary to abstract regional needs. The procedure protects you legally (by making the findings consistent), but it does not protect you politically. It makes the conflict explicit rather than smoothing it over, which may make your position on the Commission untenable in the next election cycle.

  **4. It Cannot Answer "How Much is Enough?"**
  The procedure assumes the Regional Share (Claimant 4) is a legitimate trump card. It does not help you decide if the State's assigned number is itself unjust, or if the "transit corridor" designation is a guise for developer enrichment. It operationalizes the current political settlement; it does not critique it. You will build the record, but the theory of justice remains unresolved.
