      *   *Case 2 (Homeless Housing):* Scattered site. Neighbors cite safety/traffic.
          *   *Application:* Safety/traffic are often pretexts for identity-based opposition. Procedure must strip this.
          *   *Verdict:* Approval. Findings must explicitly state that generalized safety fears without evidence are insufficient.
      *   *Case 3 (Downzoning):* Neighborhood wants less density. City needs capacity.
          *   *Application:* Conflicts with Regional Claimant.
          *   *Verdict:* Denial of the downzone (i.e., maintaining capacity). This overrides local "Neighborhood Script." This is often the hardest pill for local commissioners to swallow (overriding constituents).

  5.  **Refining the Procedure (Iterative Drafting):**
      *   Need to ensure it fits the "one page" vibe (concise).
