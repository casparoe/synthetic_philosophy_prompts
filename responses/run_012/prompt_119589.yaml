      *   *Wait, re-reading prompt:* "For at least one of these I expect the procedure to reach a conclusion I will not like." As a political theorist, they might dislike the *technocratic* nature. Or as a citizen, they might dislike overriding neighbors. I will frame Case 3 (Downzone) as a Denial (keeping density), which overrides the current residents' desire. This highlights the "Regional Claimant" priority.

      *(Self-Correction)*: Actually, the most "uncomfortable" outcome for a critical theorist is often when the procedure works *too well* to enforce market logic or state mandates at the expense of local vulnerability. Let's make Case 1 (Displacement) the Approval. The procedure forces you to admit that while displacement is bad, it is not a legal ground for denial under the statute if code is met. That is a hard truth.

      *Wait, let's look at the "Claimants" requirement again.* "Be explicit about whom the procedure treats as a claimant." I need to build this into the procedure text.

      *Let's finalize the Procedure Steps:*
      1.  Threshold (Code).
      2.  Specific Impact (Evidence).
