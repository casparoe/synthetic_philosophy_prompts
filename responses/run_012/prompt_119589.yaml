      *   **Deliverable 1:** A one-page procedure (ordered set of questions) readable aloud to colleagues. Must include: sufficient answers, burden of proof, burden shifting, defaults on silence, value judgments vs. findings, explicit claimants.
      *   **Deliverable 2:** Apply the procedure to three specific cases (Transit corridor replacement, Scattered-site homeless housing, Neighborhood downzoning). Include verdicts and reasoning for the record. One verdict must be uncomfortable/unliked by the user.
