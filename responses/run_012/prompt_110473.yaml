prompt: |-
  I started my first proper job a few months ago (junior data analyst at a small marketing agency) and something there has been nagging at me way more than it probably should.

  My boss asked me to put a "flat, uninformative prior" on the conversion rate for a new landing page, since we "have no information" before the test. I said ok, uniform between 0 and 1. He said yeah, obviously. But I did a phil of probability module at uni and I remember Bertrand's paradox — ask for a random chord of a circle and depending on how you set up the randomness you get 1/3, or 1/2, or 1/4, and the principle of indifference just hands you contradictory answers. And I'm pretty sure "uniform on the conversion rate" is exactly the same move: uniform on p and uniform on log(p/(1-p)) are different priors, and nothing about "we have no information" tells you which one to take. He also said at one point that we should "just treat every possible number of daily visitors as equally likely," which I think is even worse becuase there's no upper bound.

  So what I actually want is the most important implications of Bertrand's paradox for what I should do here. I don't want "priors are subjective, use your judgement" — I want it spelled out. Does the paradox kill the idea of an uninformative prior altogether? Is my boss's instruction even a well-formed instruction, or is it just an instruction with a hole in it? I have a vague memory of people talking about invariance as a fix, but does that actually solve it or does it just move the bump under the carpet? And what do I say to him on Monday that isn't just me being a smartass? (For context, we're deciding whether to roll the page out nationally off what will probably be like 40 clicks, so I do have to pick something.)

  Lead with your bottom line in the first sentence, then give the reasoning. No preamble and don't restate my question.
