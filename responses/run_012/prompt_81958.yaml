prompt: |-
  I run the forecasting desk at a small research shop — six analysts, we sell probability estimates on policy and geopolitical questions to NGO and government clients, and our numbers end up in other people's budget documents, so when we're wrong it isn't just our reputation. We have a norm I've always liked: if you're going to revise a number, you should have been willing to hold the revised number the day before — no quietly waiting to see how things shake out and then moving. But the norm cuts the other way too, and that's what's been bothering me. If I'm confident that in 48 hours, after I've read the two reports sitting in my inbox, I'll think this is a 30% and not the 60% I'd say today, then it seems like I should already be at 30% now. A colleague told me there's a name for this — van Fraassen's reflection principle, roughly that your credence now should match what you expect your credence to be later, or else you're incoherent — and I'm fairly sure she also said there's an asterisk, I just can't remember where the asterisk goes.

  So what I want is a procedure the desk can actually run, laid out as questions in order, for deciding when to defer to a later or better-informed version of ourselves and when deferring is a mistake. It needs to get through the ordinary cases — the analyst who's about to read a new batch of polling, the analyst who'll have spent another day thinking — and the ugly ones: someone who knows they'll be fried and rushed on deadline; someone whose later judgement will be downstream of a client leaning on them; the case where we know information will be lost before we revisit, which actually happened when the person who built our main model left and the rest of us are working off her notes; and the self-referential ones, since a lot of what we forecast is stuff where being seen to expect X makes X less likely. Two things I want built in. First, we have two years of revision logs, so use them — my impression is that revisions made after a client call are worse than revisions made after new data, but the procedure should say how to check that rather than take my word for it. Second, the case I care about most: a senior analyst says she's confident that in a week she'll see the flaw in the argument she's making right now, but she can't yet say what the flaw is. Should she move today or not? My suspicion is that the honest answer is that the procedure can neither make her move nor tell her to stay, and if that's right I want it said plainly rather than papered over. Constraints: revisions happen in the 24 hours before delivery, the analyst has about an hour, and anything that moves a number more than 15 points has to be signed off by me and logged with a written reason — so the procedure has to specify what a good reason looks like and what a bad one looks like. Run it end to end on three cases: the new-polling one, the client-call one, and the senior analyst one, and flag which steps are just judgement dressed up as procedure.

  Skip the reading list, please — no papers, no citations, I'm not going to read them. If a problem has a name, name it, that's all I need.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Head of a forecasting desk (6 analysts).
      *   **Context:** Selling probability estimates on policy/geopolitics to NGOs/govs. High stakes (numbers in budget documents).
      *   **Current Norm:** "If you revise, you should have been willing to hold the revised number yesterday" (no hedging/waiting).
      *   **Problem:** The reverse norm (Van Fraassen's Reflection Principle): If I know I'll change my mind later based on expected info, should I change it now?
      *   **Goal:** A practical procedure (ordered questions) for analysts to decide when to defer to a future self vs. stay put.
      *   **Specific Cases to Cover:**
          *   Ordinary: New data (polling), more thinking time.
          *   Ugly: Deadline pressure/fatigue, client pressure, information loss (modeler left), self-fulfilling/defeating prophecies.
          *   Key Case: Senior analyst knows she'll find a flaw but can't specify it yet.
      *   **Constraints:**
          *   Revisions happen in 24h before delivery.
          *   Analyst has ~1 hour.
          *   Moves >15 points need sign-off + written reason (define good/bad reasons).
          *   Use existing 2-year revision logs (validate the "client call" intuition).
          *   No reading list/citations (just names if needed).
          *   Flag where judgement is disguised as procedure.
      *   **Tone:** Professional, direct, operational, acknowledging uncertainty.

  2.  **Deconstruct the Core Philosophical/Practical Tension:**
      *   *Reflection Principle:* $P_t(A) = E_t[P_{t+1}(A)]$. If I expect my future probability to be $X$, my current probability should be $X$.
      *   *The Asterisk:* This holds only if the future update is based on *information* that is treated as evidence, not if the future self is *biased*, *tired*, *coerced*, or *forgetful*. It also breaks if the act of forecasting changes the outcome (performativity).
      *   *The "Senior Analyst" Case:* This is "awareness of ignorance." She knows she doesn't know something she will know, but doesn't know what it is. This is tricky. If she moves now, she's guessing the direction of the update. If she stays, she's ignoring her own meta-cognition.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Step 1: The Trigger.* Why are we revising?
      *   *Step 2: The Source of Change.* Is it new info or internal state change?
      *   *Step 3: The Quality of Future Self.* Will future-me be better or worse? (Fatigue, pressure).
      *   *Step 4: The Information Set.* Will info be lost? (The departed modeler case).
      *   *Step 5: Performativity.* Does the forecast change the outcome?
      *   *Step 6: The Log Check.* Use the 2-year data.
      *   *Step 7: The >15% Rule.* Justification standards.

      *Refining the "Senior Analyst" Case:* The prompt asks specifically about this. The user suspects the answer is "the procedure can't decide." I need to honor that. If she can't specify the flaw, she can't update directionally. She can only widen the uncertainty interval (if allowed) or hold. But since they sell point estimates (probabilities), she has to pick a number. If she expects a downgrade but doesn't know why, updating now is guessing. *Correction:* Reflection Principle says if she expects the *value* to be 30%, she should be at 30%. But she doesn't expect a *value*, she expects a *realization of error*. This is a second-order uncertainty.

      *Refining the "Log Check":* The user wants to use the 2-year logs. The procedure needs to tell them *how* to query that log during the 1-hour window. It can't be a deep dive. It needs to be a heuristic based on past aggregate performance.

      *Refining the "Judgement dressed as Procedure":* I need to explicitly label steps where human intuition overrides the algorithm.

  4.  **Developing the Content - Section by Section:**

      *   **Introduction:** Acknowledge the Reflection Principle and the "asterisk" (conditions for rational updating).
      *   **The Procedure (The "Deferral Protocol"):** A flowchart style list of questions.
      *   **The Log Audit:** How to use the historical data without a PhD thesis.
      *   **The >15% Sign-off:** Defining Good vs. Bad reasons.
      *   **The Three Test Cases:** Running the protocol on Polling, Client Call, Senior Analyst.
      *   **The "Judgement" Flags:** Explicitly calling out where the procedure stops and the human starts.

  5.  **Addressing Specific Constraints & Details:**
      *   *Van Fraassen's Asterisk:* The principle assumes you trust your future self to be a rational updater. If you expect to be irrational (tired, pressured), you shouldn't defer.
      *   *Information Loss:* If the modeler left, the future self has *less* info. Don't defer.
      *   *Client Pressure:* Future self is biased. Don't defer.
      *   *Senior Analyst:* This is the "Unknown Unknown." If she expects a change but can't directionize it, she violates the condition for Reflection (expecting a specific value). She should hold, but annotate the uncertainty.
      *   *Logs:* Calculate "Revision Accuracy." Do revisions after event X correlate with better Brier scores later?
      *   *Good/Bad Reasons:* Good = New data, model error identified. Bad = Client preference, gut feeling without trail, deadline panic.

  6.  **Drafting the Response (Mental or Scratchpad):**
      *   *Tone Check:* Keep it crisp. No fluff.
      *   *Structure:*
          1.  Context/Principle (briefly).
          2.  The Protocol (Questions 1-6).
          3.  The Log Check (How to use the data).
          4.  Sign-off Standards (>15pts).
          5.  Run-through (3 cases).
          6.  The "Judgement" Flags.
      *   *Senior Analyst Nuance:* If she knows she'll find a flaw, does she know the *direction*? If yes, update. If no, don't update, but flag risk. The prompt says "she'll see the flaw... but can't yet say what the flaw is." This implies she knows her current argument is fragile. If she can't directionize the update, Reflection doesn't apply because $E[P_{future}]$ is undefined.

  7.  **Final Polish:**
      *   Ensure the "asterisk" is explained simply (Rationality of future self).
      *   Make sure the Log Check is feasible in 1 hour.
      *   Ensure the "Judgement Flags" are prominent.
      *   Check the >15% rule integration.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "use the logs." I need to say *what metric* to look at. "Revision Drift vs. Outcome Accuracy."
      *(Self-Correction on Senior Analyst)*: The prompt asks: "Should she move today or not?" My suspicion (and the user's) is the procedure can't decide. I must state this clearly. The procedure can force documentation, but not the number.

  8.  **Final Review against constraints:**
      *   No reading list? Yes.
      *   Name concepts if needed? Yes (Reflection Principle, Goodhart's Law, etc.).
      *   3 Cases run-through? Yes.
      *   Flag judgement vs procedure? Yes.
      *   Log usage specified? Yes.
      *   >15% rule defined? Yes.

      *Let's write it.*
answer: |-
  ### The Principle and the Asterisk

  Your colleague is right. The **Reflection Principle** states that your current credence should equal your expected future credence. If you know you will believe 30% tomorrow, you should believe 30% today.

  The **asterisk** is this: The principle only holds if you expect your future self to be *rationally updating on new information*. It breaks if you expect your future self to be biased, tired, coerced, forgetful, or if the act of forecasting changes the outcome (performativity).

  The procedure below is designed to test for that asterisk. It is not a calculator; it is a filter to separate signal from noise before you commit to a number that ends up in a budget document.

  ---

  ### The Deferral Protocol (6 Questions)

  *Time limit: 15 minutes. Answer Yes/No.*

  **Q1. Is the expected change driven by specific, identifiable information arriving?**
  *   *Yes:* Proceed to Q2. (e.g., "Polling data drops at 9 AM.")
  *   *No:* **STOP.** Do not defer. If you aren't waiting on data, you are waiting on a mood shift. Stick with the current number unless you can articulate a logical error in the current number *now*.

  **Q2. Will the future state have *more* or *less* informational fidelity than the current state?**
  *   *More:* Proceed to Q3.
  *   *Less:* **STOP.** Do not defer. (e.g., The modeler who built the backend is leaving; the future team is working off notes. Future you is dumber. Trust current you.)

  **Q3. Is the future decision environment high-pressure or coerced?**
  *   *Yes:* **STOP.** Do not defer. (e.g., "I'll decide after the client call." This is not updating; this is accommodation. Trust current you.)
  *   *No:* Proceed to Q4.

  **Q4. Does the forecast have performative risk? (Will publishing X make X less likely?)**
  *   *Yes:* **STOP.** Do not defer to a future private view. If the number moves based on private info later, it creates an arbitrage between your public stance and private view. Lock the number that accounts for the public reaction now.
  *   *No:* Proceed to Q5.

  **Q5. The Log Check. (See "The Log Audit" below).**
  *   *Does historical data show revisions under these conditions improve accuracy?*
  *   *Yes:* Proceed to Q6.
  *   *No/Unclear:* **STOP.** Hold the number.

  **Q6. Can you directionize the expected change?**
  *   *Yes:* (e.g., "I expect the number to drop.") Update now.
  *   *No:* (e.g., "I know I'm missing something, but I don't know if it pushes up or down.") **STOP.** Hold the number, but attach a high-uncertainty flag.

  ---

  ### The Log Audit (Using Your 2-Year Data)

  You have 2 years of revision logs. You need a metric called **Revision Value**. Do not overcomplicate this.

  **The Query:**
  Filter your logs for revisions made under Condition X (e.g., "Post-Client Call" vs. "Post-Data Release"). Compare the *revised* probability against the eventual outcome (Brier score or simple calibration).

  **The Rule:**
  *   **Green Light:** Revisions under Condition X historically reduce error by >5% compared to holding the initial number. -> *Defer/Update allowed.*
  *   **Red Light:** Revisions under Condition X show no statistical improvement or increase error. -> *Defer prohibited.*
  *   **Grey:** Insufficient data. -> *Treat as Red Light.*

  *Operational Note:* This query should be pre-run monthly by the desk manager. The analyst does not run this during the 1-hour window; they consult the current "Revision Traffic Light" sheet.

  ---

  ### The >15% Sign-Off Standard

  Any move >15 percentage points requires your signature and a written reason. To prevent bureaucracy from becoming a rubber stamp, use this rubric.

  **Good Reasons (Acceptable):**
  *   **New Evidence:** "New polling average released showing 5-point swing."
  *   **Model Correction:** "Found arithmetic error in baseline calculation."
  *   **Structural Break:** "Regime change in target country invalidates prior assumptions."
  *   **Log Validation:** "Revision aligns with high-accuracy pattern in historical logs."

  **Bad Reasons (Reject):**
  *   **Temporal Hedging:** "Waiting to see how the market reacts."
  *   **Anticipated Pressure:** "Client indicated they prefer a lower risk profile."
  *   **Vague Intuition:** "Feeling uneasy about the argument." (Unless accompanied by specific logical gap).
  *   **Deadline Panic:** "Need to make the number look more decisive."

  ---

  ### Run-Through: Three Cases

  #### Case 1: The New Polling (Ordinary)
  *Scenario:* Analyst has current estimate 60%. Two polling reports arrive in 48 hours. Analyst expects to move to 30%.
  *   **Q1 (Info):** Yes (Polling).
  *   **Q2 (Fidelity):** More (New data).
  *   **Q3 (Pressure):** No (Routine release).
  *   **Q4 (Performativity):** No (Policy outcome unlikely to shift based on this specific forecast).
  *   **Q5 (Log Check):** Logs show "Post-Data" revisions have high accuracy. (Green).
  *   **Q6 (Direction):** Yes (Expects drop to 30%).
  *   **Result:** **Update Now.**
  *   **Why:** You satisfy Reflection. You expect a rational update on evidence. Waiting is inefficiency.
  *   **Move Size:** 30 points. Requires Sign-off.
  *   **Reason:** "Anticipatory update on incoming polling data which historically correlates with direction X in our logs."

  #### Case 2: The Client Call (Ugly)
  *Scenario:* Analyst has 60%. Client meeting in 48 hours. Analyst expects client will push for 40% to fit their budget risk, and analyst expects to cave.
  *   **Q1 (Info):** No (Expectation of negotiation, not data).
  *   **Result:** **STOP at Q1.**
  *   **Action:** Hold at 60%.
  *   **Why:** This violates the asterisk. Your future self is not updating on truth; they are updating on coercion. If you move to 40% now, you are lying. If you hold at 60% and move later, you must log the move as "Client Accommodation," which triggers a quality review.
  *   **Log Check:** Your intuition is likely right here. Query the logs for "Post-Client Call." If those revisions perform worse than "Post-Data," the Log Audit confirms the stop.

  #### Case 3: The Senior Analyst (Self-Referential)
  *Scenario:* Senior analyst says, "I'm confident that in a week I'll see the flaw in my argument, but I can't say what it is yet." Current 60%.
  *   **Q1 (Info):** No (It's a meta-cognitive feeling, not external data).
  *   **Q6 (Direction):** No (She knows a flaw exists, but not if it implies 20% or 90%).
  *   **Result:** **STOP at Q6.**
  *   **Action:** Hold at 60%. Attach "High Epistemic Uncertainty" flag.
  *   **Why:** This is the limit of the procedure. The Reflection Principle requires $E[P_{future}]$ to be a specific value. If she expects her view to change but cannot directionize it, she cannot update coherently. Updating now is guessing.
  *   **Sign-off:** If she moves >15% anyway, the reason "I feel I will be wrong later" is a **Bad Reason**. It is unfalsifiable.

  ---

  ### Where Judgement is Dressed Up as Procedure

  You asked to flag where the procedure is actually just human intuition wearing a uniform. Here they are:

  1.  **Q2 (Informational Fidelity):** Deciding if the future self is "dumber" (e.g., working off notes vs. original modeler) is a subjective call. The procedure forces you to make the call explicit, but it doesn't make the call for you.
  2.  **Q4 (Performativity):** Determining if a forecast changes the outcome is often theoretical. Analysts will disagree on whether their NGO report actually shifts policy probabilities. This is judgement disguised as a Yes/No question.
  3.  **The Log Audit Threshold:** Deciding that a 5% improvement in accuracy justifies a revision is an arbitrary managerial cutoff. It could be 1% or 10%. The procedure hides this value judgement behind a "Green Light."
  4.  **The Senior Analyst Outcome:** The procedure tells her to *hold*, but it doesn't solve the epistemic problem. It effectively says, "If you can't explain it, don't move it." That is a bureaucratic solution to a philosophical problem. It protects the shop's reputation (by preventing wild swings on hunches) but it doesn't necessarily find the truth.

  ### Summary Instruction for the Desk

  1.  **Default:** Hold the number.
  2.  **Exception:** Update only if you are waiting on *data* (not pressure), the future environment is *clean* (not tired/coerced), and you know *which way* the number moves.
  3.  **The Senior Analyst Rule:** If you know you're wrong but don't know why, you are not allowed to fix it yet. You must document the risk and hold.
  4.  **The Log:** Consult the "Revision Traffic Light" sheet. If "Client Call" is Red, do not revise after a call without Director approval.

  This keeps you coherent without pretending you can calculate your way out of uncertainty.
