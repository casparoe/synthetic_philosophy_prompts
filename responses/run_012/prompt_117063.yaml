answer: |-
  Omissions are genuine causes, but your criterion is a mess because it attempts to solve a metaphysical problem with a normative filter, and your friend is wrong to dismiss them as mere moral judgments.

  The core error in your debate is the assumption that "causation" must be a physical relation of pushing or producing, like one billiard ball striking another. If causation were purely physical production, your friend would win: nothing comes from nothing, and an absence cannot push an outcome into existence. But causation in any useful sense—including science, law, and daily life—is not about production; it is about *dependence*. An event causes an outcome if the outcome depends on it. Under this view, the lifeguard's stillness causes the drowning because the survival depends on the swimming. The stillness is not a "thing" that pushes the death into being; it is a fact about the world upon which the death depends.

  Your criterion tries to salvage this by adding an "availability" clause: the omitted action must have been possible and effective. You are right to include this, but wrong to think it keeps the analysis metaphysical. "Availability" is not a brute fact of the universe; it is a normative judgment. When you say the gardener caused the plants to die by not watering them, but the neighbor didn't cause it by not watering them, the physics is identical: both stood still while the plants dried. The difference is entirely about expectation and responsibility. You are smuggling norms into the definition of cause to filter out the infinite number of things everyone *didn't* do that kept the plants alive (e.g., Putin didn't water them either). By making "availability" the gatekeeper, you concede that omission-causation is interest-relative.

  This is where your friend's "parasitic" objection bites, but where his conclusion fails. He argues that because omissions depend on a background of expected actions, they are second-hand causes and therefore moral judgments in disguise. He is right that they are dependent on background conditions, but wrong that this makes them illusory. All causation is contrastive and context-dependent. If I say "the spark caused the fire," I am implicitly contrasting the spark with a background where oxygen was present and fuel was dry. We don't call the oxygen the cause because it was constant, not because it wasn't physically necessary. Omissions are just causes that rely on a contrast with an expected norm rather than a constant background condition. Calling them "parasitic" doesn't make them fake; it makes them relational. A shadow is parasitic on an object blocking light, but the shadow is real.

  Your specific test cases reveal why your criterion breaks down under pressure. Take redundant omissions: two lifeguards sleep, either could have saved the swimmer. You claim no individual omission passes the counterfactual test. This is incorrect. If Lifeguard A had swum, the swimmer would have lived (holding B's sleep fixed). Therefore, A's omission is a cause. The same applies to B. The outcome is overdetermined, not uncaused. Your intuition that the test fails here suggests you are looking for *unique* responsibility, not causation. You want to know who is to blame, not what made the difference. This confirms that your criterion is secretly tracking responsibility, not metaphysics.

  The disconnected-switch case reinforces this. If the tap was cut off years ago, you say the gardener's not-watering is not a cause. Correct, but not because causation vanished. It's because the counterfactual is false: if she had watered, the plants would still have died (no water in tap). Here, the causation fails on pure dependence, not availability. But if a third party cut the tap to ensure the gardener *couldn't* water, we enter your third scenario. Who caused the death? The third party cut the supply (positive cause); the gardener failed to water (omission). Both are causes. The third party caused the *condition* of the gardener's inability. This isn't a puzzle for causation; it's a chain of dependence. The gardener's omission is still a cause of the death relative to the norm that she waters, but the third party is the cause of the omission's inevitability.

  The verdict on the real question is this: omissions are genuine causes because the world contains dependencies, not just collisions. However, you must accept that identifying an omission as a cause always involves selecting a contrast class based on norms. When you say "the lack of rain caused the famine," you are ignoring the lack of irrigation systems, the lack of food imports, and the lack of genetic modification. You select the rain because it is the variable that deviated from the expected background. Your friend calls this a projection; I call it explanation. Causation is not a feature of the world independent of observers; it is a tool observers use to map dependencies in the world.

  So, your friend is wrong to say omissions aren't causes, but right to sense that they carry a normative load. You are wrong to think your criterion removes that load. The "availability" clause doesn't purify the causation; it admits that we only care about causes that agents could have manipulated. That doesn't make the causation fake. It makes it human. Omissions are real causes, but they are causes relative to a model of the world that includes expectations. If you want a physics of billiard balls, there are no omissions. If you want an explanation of why things happen in a human world, omissions are as real as actions.
