ct and the argument for it. No need to tell me who said what, I'm not going to go check. And if my criterion is a mess, or if the question I'm asking is secretly two questions, or if "real cause" is a phrase that can't do the work I'm asking it to do, say that straight instead of humoring me. Lead with your bottom line in the first sentence, then the argument, and skip the throat-clearing.
