answer: |-
  Here is a draft specification section for your independent study. It is structured to serve as a checklist for evaluating theories, followed by an analysis of the tensions between those requirements.

  ### Specification for an Adequate Theory of the Frame Problem

  **1. Computational Tractability of Inertia**
  *   **Requirement:** The system must assume facts remain unchanged without explicitly computing or storing a "no-change" rule for every single fact.
  *   **Motivating Case:** 1 (The Warehouse Robot).
  *   **Status:** **Non-negotiable.** Without this, the system crashes under the weight of data as the world scales.
  *   **Conflict:** Conflicts directly with *Logical Completeness* (see below). To be fast, you must risk missing a rare exception; to be sure, you must check everything.

  **2. Controlled Ramification**
  *   **Requirement:** The system must derive indirect consequences of an action (side effects) but must have a mechanism to stop the chain of inference before it becomes infinite or trivial.
  *   **Motivating Case:** 2 (The Lamp).
  *   **Status:** **Non-negotiable.** A system that misses the plant dying is useless; a system that calculates the effect of the light on the moon is broken.
  *   **Conflict:** Conflicts with *Acquirable Relevance*. Hard-coding where to stop inference limits learning; learning where to stop risks stopping too early.

  **3. Sensitivity to Absence**
  *   **Requirement:** The system must treat the absence of a condition (e.g., a lock being open) as a causal factor equivalent to the presence of an object.
  *   **Motivating Case:** 3 (The Unlocked Door).
  *   **Status:** **Preference (Logical Tradition).** This is technically the "Qualification Problem," a sibling to the Frame Problem. Some engineering approaches bypass this by assuming success and handling failure via error correction rather than pre-checking.
  *   **Conflict:** Conflicts with *Computational Tractability*. Checking for every possible absent blocker (is the door frozen? is the handle greasy?) is as expensive as checking every non-changing fact.

  **4. Intentional Inertia**
  *   **Requirement:** The system must apply inertia rules not only to physical objects but to the mental states (beliefs, goals) of other agents in the environment.
  *   **Motivating Case:** 4 (The Person in the Aisle).
  *   **Status:** **Preference (Philosophy of Mind).** This is required for social intelligence but not for the core logical definition of the Frame Problem, which applies even to a lone arm moving blocks in a void.
  *   **Conflict:** Conflicts with *Computational Tractability*. Modeling another agent's beliefs about your beliefs creates an exponential explosion of states to track.

  **5. Temporal Robustness**
  *   **Requirement:** The system must account for the fact that the world state may change during the time the agent spends computing its next action.
  *   **Motivating Case:** 5 (The Agent That Thinks Slowly).
  *   **Status:** **Non-negotiable (for real systems).** A theory that assumes a static world during deliberation only works in simulation.
  *   **Conflict:** Conflicts with *Logical Completeness*. You cannot logically prove the world hasn't changed while you are proving it hasn't changed.

  **6. Acquirable Relevance**
  *   **Requirement:** The criteria for what counts as "relevant" to an action must be learnable from data, not entirely pre-programmed by a human designer.
  *   **Motivating Case:** 6 (Learning From Experience).
  *   **Status:** **Preference (Modern AI).** Classical solutions assume a human provides the rules. Modern solutions demand the agent find the rules.
  *   **Conflict:** Conflicts with *Controlled Ramification*. If the agent learns relevance statistically, it may fail to generalize correctly to rare but critical side effects (e.g., fire spreading).

  ***

  ### Analysis of Constraints and Conflicts

  #### The Core Conflict
  Your intuition was correct: the fundamental tension lies between **Computational Tractability of Inertia** and **Logical Completeness** (the demand that the agent never overlook a genuine change).
  *   **The Clash:** To guarantee you never miss a change (Completeness), you must check every fact against every action. To be tractable (Efficiency), you must assume most things don't change without checking.
  *   **The Reality:** No theory satisfies both perfectly. Successful systems sacrifice strict logical completeness for probabilistic confidence. They accept that they might occasionally miss a change in exchange for being able to act at all.

  #### The "Not a Constraint" Case
  **Case 3 (The Unlocked Door)** is the outlier.
  *   **Reasoning:** In the literature, this is distinguished as the **Qualification Problem**, not the Frame Problem. The Frame Problem asks: "Given the action happens, what else changes?" The Qualification Problem asks: "What conditions are required for the action to happen at all?"
  *   **Implication:** A theory can solve the Frame Problem (correctly predicting effects) while failing the Qualification Problem (failing to notice the door was locked). While a useful robot needs both, a theory of *frame* does not strictly require a solution to *qualification*. Including it conflates two distinct logical hurdles.

  #### The "Killer Requirement"
  **Computational Tractability of Inertia** eliminates the most candidate theories.
  *   **Reasoning:** This requirement kills naive first-order logic immediately. In standard logic, if you don't state that the wall color didn't change, you can't assume it didn't. Any theory that requires explicit "frame axioms" for every non-changing property fails this spec. It also puts pressure on statistical models: they are fast, but if they cannot guarantee inertia for critical safety facts, they may also be rejected for high-stakes applications.

  #### Building Minds vs. Building Machines
  You should note in your study that several requirements shift depending on your goal:
  *   **Case 4 (Intentional Inertia)** and **Case 6 (Acquirable Relevance)** are primarily constraints if you are trying to **explain human minds**. Humans learn relevance and model others' beliefs.
  *   **Case 1 (Tractability)** and **Case 2 (Ramification)** are primarily constraints if you are trying to **build a working machine**. A factory robot does not need to model the beliefs of a pallet, nor does it need to learn physics from scratch; it needs to be fast and safe.
  *   **The Dispute:** Many philosophical disputes arise because one side is specifying requirements for a *mind* (which must learn and model others) while the other is specifying requirements for a *database of actions* (which must be consistent and fast).

  ***

  ### Verdict on Main Families of Approach

  **1. Rule-Based (e.g., Situation Calculus with Frame Axioms)**
  *   **Performance:** Fails **Computational Tractability**.
  *   **Reasoning:** Unless modified with non-monotonic logic (defaults), these systems require explicit statements for what does *not* change. They are logically precise but computationally impossible for large worlds. They handle Case 2 well but fail Case 1.

  **2. Representations that Build Relevance In (e.g., Procedural/Modular)**
  *   **Performance:** Passes **Computational Tractability**, risks failing **Controlled Ramification**.
  *   **Reasoning:** By structuring data so that only "nearby" facts are considered (like objects in a room), these systems are fast. However, they struggle with Case 2 (The Lamp) if the indirect effect is distant (e.g., the light triggers a sensor in another room). They rely on the designer to foresee relevance.

  **3. Statistical or Learned Relevance (e.g., Neural Networks/RL)**
  *   **Performance:** Passes **Acquirable Relevance**, risks failing **Logical Completeness**.
  *   **Reasoning:** These systems learn what changes together from data (Case 6). However, they are probabilistic. They cannot guarantee that a rare fact didn't change (Case 1), and they struggle to explain *why* a side effect occurred. They work for Case 5 (Time) well, as they react to current state rather than deliberating.

  **4. The Anti-Formalist View (e.g., "The Problem is an Artifact")**
  *   **Performance:** Dissolves the requirements rather than meeting them.
  *   **Reasoning:** This view argues that the Frame Problem only exists because we try to represent the world as a list of sentences. If we view the agent as embedded in the world (acting without representing), the problem disappears.
  *   **Critique:** While philosophically compelling for explaining humans, it offers little guidance for **Building Machines**. You cannot code a robot to "just be embedded"; you need a specification for its control loop. This approach fails the "design guidance" goal of your specification.

  ### Summary Recommendation
  For your independent study, the most fruitful path is to evaluate theories based on how they negotiate the trade-off between **Tractability** and **Completeness**. A theory that claims to solve the Frame Problem perfectly without acknowledging this cost is likely hiding a assumption. The most viable engineering solutions today are hybrid: they use logical structures for safety-critical inertia (Case 1) and statistical learning for relevance (Case 6), accepting that they are solving a practical approximation rather than a philosophical absolute.
