      *   *Idea 5 (from Case 5):* Must handle time passing during computation.
          *   *Label:* Temporal Robustness.

      *   *Idea 6 (from Case 6):* Must learn relevance.
          *   *Label:* Acquirable Relevance.

      *   *Refining Conflicts:* The classic conflict is between *Expressiveness/Completeness* (don't miss a change) and *Efficiency* (don't check everything). Case 1 vs. Case 2/3.
      *   *Refining "Not a Constraint":* Case 3 (Unlocked Door) is often classified as the *Qualification Problem*, not the Frame Problem. While related, strict logicians separate them. I should flag this. Or perhaps Case 4 is too specific to multi-agent systems and not core to the *general* frame problem. Let's look closer. The Frame Problem is about *change* and *inertia*. Case 4 is about *belief*. Case 3 is about *preconditions*. Case 6 is about *learning*.
      *   *Decision:* Case 3 is the Qualification Problem. It's a sibling, not the core Frame Problem. However, the prompt asks which is "not really a constraint" on a theory of the *Frame Problem*. Many theorists (like Dennett) lump them together. But strict logical formulations (like Situation Calculus) separate them. I will argue Case 3 is a distinct problem (Qualification) often conflated, making it a weaker constraint for a *pure* Frame Problem solution.
      *   *Alternative:* Case 4 (Person in the aisle) introduces Theory of Mind. Is that required for the Frame Problem? A single agent navigating a static world still faces the Frame Problem. So Case 4 might be an *extension*, not a core constraint. Let's go with Case 4 being an extension (Multi-agent/Belief), whereas the Frame Problem exists even for a lone arm moving blocks.
      *   *Re-evaluating:* Actually, Case 6 (Learning) is often excluded from the "classic" logical Frame Problem (McCarthy & Hayes). The classic problem is about representation, not learning. But the user wants a theory good enough to *guide design*. A system that can't learn relevance is brittle.
      *   *Best Candidate for "Not a Constraint":* Case 3. Why? Because the Frame Problem is about *what changes* given an action. The Qualification Problem (Case 3) is about *whether the action succeeds* given preconditions. They are logically distinct. A solution to Frame can fail Qualification.

      *   *Deciding the "Killer Requirement":* Computational Tractability of Inertia (Case 1). This is the heart of it. If you have to list all non-changes, you fail. This kills naive logic.

      *   *Distinguishing Build vs. Explain:* Case 4 (Beliefs) and Case 6 (Learning) lean towards explaining human minds. Case 1 and 2 lean towards building robots.

  4.  **Drafting the Verdict on Approaches:**
      *   *Rule-based (Situation Calculus etc.):* Good on precision, bad on tractability (unless non-monotonic logic used).
      *   *Relevance-built-in (Procedural/Connectionist):* Good on speed, bad on explainability/generalization.
