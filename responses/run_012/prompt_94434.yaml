          *   Identify which single requirement eliminates the most candidate theories.
          *   Distinguish between requirements for *building* vs. *explaining* minds.
          *   Short verdict on main families of approach (Rule-based, Relevance-built-in, Statistical/Learned, Anti-formalist).
          *   No citations/references.
          *   Tone: Academic but accessible (high-school independent study level), rigorous, critical.

  2.  **Deconstruct the Cases:**
      *   *Case 1 (Warehouse Robot):* Efficiency/Scalability. Don't check everything. Inertia (things stay the same).
      *   *Case 2 (The Lamp):* Ramification Problem (indirect effects). Need some consequences, not all.
      *   *Case 3 (Unlocked Door):* Qualification Problem (preconditions/absences). Negative facts matter.
      *   *Case 4 (Person in Aisle):* Intentionality/Belief tracking. Other agents. Nested beliefs. Inertia applies to mental states too.
      *   *Case 5 (Agent Thinks Slowly):* Temporal projection/Real-time. The world changes while thinking.
      *   *Case 6 (Learning):* Acquiring relevance. Not all rules hand-coded.

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Idea 1 (from Case 1):* Must handle inertia without listing non-changes.
          *   *Label:* Computational Tractability of Inertia.
          *   *Conflict:* Likely conflicts with Completeness.

      *   *Idea 2 (from Case 2):* Must derive indirect effects but stop somewhere.
          *   *Label:* Controlled Ramification.
          *   *Note:* This is often distinct from the Frame Problem proper but usually bundled.

      *   *Idea 3 (from Case 3):* Must handle negative preconditions.
          *   *Label:* Sensitivity to Absence.
          *   *Note:* This is the Qualification Problem. Is it part of the Frame Problem? Philosophers debate this. I should note the distinction.

      *   *Idea 4 (from Case 4):* Must handle other minds/beliefs.
