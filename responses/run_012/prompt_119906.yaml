  # Activity: The Monitor Configuration Committee

  **Time:** 45 Minutes
  **People:** 10 Engineers (1 Facilitator, 2 Actors, 7 Committee)
  **Materials:** Whiteboard + Markers, 10 Index Cards (prepared in advance).

  ## Phase 1: Setup & Constitution (0:00 - 0:10)

  **1. The Scenario (2 mins)**
  "Welcome. We are the Office Standards Committee. We need to set a policy for monitor orientations for two specific desks: **Alice's** and **Bob's**. Each monitor can be **Landscape (L)** or **Portrait (P)**."

  Draw a 2x2 grid on the whiteboard. Label the rows "Alice (L/P)" and columns "Bob (L/P)".
  Fill the four quadrants with State Numbers:
  *   **State 1:** Alice=L, Bob=P
  *   **State 2:** Alice=P, Bob=P
  *   **State 3:** Alice=P, Bob=L
  *   **State 4:** Alice=L, Bob=L

  **2. The Constitution (5 mins)**
  "We are going to build a Team Ranking of these four states. Best to Worst. But we must abide by two Rules of Order. I need you to verbally agree to these."

  *   **Rule 1 (The Liberty Clause):** "Alice has sole authority over Alice's monitor. If Alice prefers State X to State Y, and the *only* difference is Alice's monitor, the Team must rank X higher than Y. Same for Bob and his monitor."
  *   **Rule 2 (The Unanimity Clause):** "If *every single person* in this room prefers State X to State Y, the Team must rank X higher than Y."

  **Ask the room:** "Can we agree to abide by these rules for this exercise?" (Get verbal confirmation).

  **3. Assign Roles & Preferences (3 mins)**
  *   **Pick Alice and Bob:** Choose two volunteers. Seat them slightly apart.
  *   **Distribute Cards:** Hand out the pre-written Preference Cards (see below).
      *   **Alice** gets the "Alice Card."
      *   **Bob** gets the "Bob Card."
      *   **Everyone else** gets the "Committee Card."
  *   **Instruction:** "Read your card. For the next 20 minutes, **this is your brain.** Do not argue with the card. Do not say 'but I wouldn't prefer that.' You are an agent executing this logic. If you break character, the paradox breaks."

  **(Prepared Card Text)**
  > **ALICE CARD:**
  > You prefer **Portrait** monitors for yourself.
  > *   If Bob is Portrait: You prefer **State 2** (PP) over **State 1** (LP).
  > *   If Bob is Landscape: You prefer **State 3** (PL) over **State 4** (LL).
  > *(Note: You don't care about Bob's monitor, only your own.)*

  > **BOB CARD:**
  > You prefer **Landscape** monitors for yourself.
  > *   If Alice is Portrait: You prefer **State 3** (PL) over **State 2** (PP).
  > *   If Alice is Landscape: You prefer **State 4** (LL) over **State 1** (LP).
  > *(Note: You don't care about Alice's monitor, only your own.)*

  > **COMMITTEE CARD (7 People):**
  > You care about "Aesthetics."
  > *   You prefer **State 1** (LP) over **State 3** (PL). (You like Alice Landscape better).
  > *   You prefer **State 4** (LL) over **State 2** (PP). (You like All-Landscape better).
  > *(Note: These preferences are unanimous across all 7 of you.)*

  ## Phase 2: The Policy Draft (0:10 - 0:25)

  **Goal:** Try to create a ranked list (1st, 2nd, 3rd, 4th) of the States.

  **1. Compare State 4 vs. State 1 (5 mins)**
  *   **Facilitator:** "Let's rank State 4 (LL) and State 1 (LP). Which is better for the team?"
  *   **Check Rule 1 (Liberty):** Ask Bob. "Bob, looking at your card, 4 vs 1. The only difference is your monitor. Which do you prefer?"
      *   Bob reads card: "I prefer Landscape. So **4 > 1**."
  *   **Facilitator:** "Under Rule 1, Bob is decisive. Team, do we accept 4 > 1?"
  *   **Committee:** "Yes." (Write **4 > 1** on board).

  **2. Compare State 1 vs. State 3 (5 mins)**
  *   **Facilitator:** "Now State 1 (LP) vs State 3 (PL). Which is better?"
  *   **Check Rule 2 (Unanimity):** "Committee, look at your cards. Do you all prefer 1 over 3?"
      *   Committee: "Yes."
  *   **Facilitator:** "Alice and Bob, look at your cards. Do you also prefer 1 over 3?"
      *   *Check Alice Card:* She compares LP vs PL. Her card doesn't explicitly state this, *but* for the paradox to hold, the Unanimity must include her.
      *   *Correction for Flow:* To ensure the paradox hits hard, I need the Unanimity to override their personal indifference.
      *   *Facilitator Script:* "The Committee Card says 1 > 3. Alice, Bob, your cards don't forbid this. Under Rule 2, since *everyone* can agree to 1 > 3, it passes."
  *   **Committee:** "Yes." (Write **1 > 3** on board).

  **3. Compare State 3 vs. State 4 (5 mins)**
  *   **Facilitator:** "Now State 3 (PL) vs State 4 (LL). Which is better?"
  *   **Check Rule 1 (Liberty):** Ask Alice. "Alice, looking at your card, 3 vs 4. The only difference is your monitor. Which do you prefer?"
      *   Alice reads card: "I prefer Portrait. So **3 > 4**."
  *   **Facilitator:** "Under Rule 1, Alice is decisive. Team, do we accept 3 > 4?"
  *   **Committee:** "Yes." (Write **3 > 4** on board).

  **4. The Reveal (5 mins)**
  *   **Facilitator:** "Okay, let's look at our Team Policy."
  *   Point to the board:
      *   **4 > 1** (Bob's Right)
      *   **1 > 3** (Unanimity)
      *   **3 > 4** (Alice's Right)
  *   **Facilitator:** "So... 4 is better than 1. 1 is better than 3. 3 is better than 4."
  *   "Which state should we pick?"
  *   (Wait for the confusion. "Wait, that's a loop." "4 is best and worst?")
  *   **Facilitator:** "We followed Rule 1. We followed Rule 2. We have no valid policy. We are stuck."

  ## Phase 3: The Debrief (0:25 - 0:45)

  **1. Name the Beast (5 mins)**
  "Stand up. Stretch. What just happened?"
  *   **The Name:** "This is **Sen's Liberal Paradox** (or The Impossibility of a Paretian Liberal). Amartya Sen, 1970. Nobel Prize stuff."
  *   **The Correction:** "It's not a time loop where we keep flipping votes. It's a **logical contradiction**. There is no consistent ranking that satisfies both rules. It's like trying to draw a square circle."

  **2. Why It Happened (5 mins)**
  "Look at the rules.
  1.  **Pareto Efficiency:** If everyone agrees, do it.
  2.  **Minimal Liberalism:** Let people decide their own business.
  Both sound obviously correct. So why did we break?"

  *   **The Cause:** "Interdependent Preferences. Or 'Meddling'."
  *   "If Alice only cared about her monitor, and Bob only cared about his, and the Committee didn't care about either... there would be no conflict."
  *   "The paradox bites because **we cared about each other's private choices.** The Committee had an opinion on Alice's monitor. Alice and Bob had to accept the Committee's unanimous view (Rule 2) even on states they partially controlled."
  *   "In software terms: You have a microservice (Alice) and another (Bob). You want them to be autonomous (Liberalism). But you also want global consistency (Pareto). If the services have preferences about *each other's* internals, the system deadlocks."

  **3. The Escape Routes (5 mins)**
  "To fix this, you must break one of the three conditions. You cannot keep all three."

  *   **Option A: Kill Liberalism (The Dictator).** "Manager decides the monitors. No private spheres."
      *   *Cost:* Autonomy, morale.
  *   **Option B: Kill Pareto (Accept Inefficiency).** "We accept that sometimes we pick a state everyone hates, just to respect rights."
      *   *Cost:* Global optimization becomes impossible.
  *   **Option C: Kill Unrestricted Domain (The Cultural Fix).** "We agree **not to have preferences** about others' private spheres."
      *   *Cost:* Requires cultural discipline. 'Mind your own business.'

  **4. My Recommendation (3 mins)**
  "If this were a real engineering org, I'd pick **Option C**."
  *   "We codify 'Concern Separation.' Service A is not allowed to have config dependencies on Service B's internal implementation."
  *   "In human terms: We agree that what's on Alice's desk is not a valid topic for a Team Vote. We restrict the domain of the Pareto rule."
  *   "The paradox proves that **total freedom + total agreement = impossible** if we meddle. So we must stop meddling."

  **5. Q&A (2 mins)**
  (Leave buffer for questions).

