  # Predicted Failure Modes & Recovery

  **1. Failure: "But I wouldn't prefer that."**
  *   **Symptom:** During Phase 2, a Committee member says, "Why do I prefer State 1? I actually like State 3."
  *   **Recovery:** Stop the room. "This is not a survey. This is a logic engine. Your card is your source code. If you override the card, you are introducing a bug into the simulation. Please execute the code on the card."

  **2. Failure: "Just flip a coin."**
  *   **Symptom:** Someone suggests randomizing the decision to break the tie.
  *   **Recovery:** "Randomization avoids the choice, but it doesn't solve the ranking contradiction. The *policy* itself is broken, not just the selection. We are proving the policy cannot exist."

  **3. Failure: "This is stupid, just let Alice decide."**
  *   **Symptom:** Engineers try to 'solve' it pragmatically.
  *   **Recovery:** "You are solving it by giving up Rule 2 (Liberalism for Bob) or Rule 1 (Unanimity). That proves my point! You are instinctively sacrificing one rule to save the system. The paradox forces you to choose which rule to kill."

  **4. Failure: Running out of time.**
  *   **Symptom:** Phase 2 drags on with debate.
  *   **Recovery:** Be authoritarian. "Rule 1 says Bob decides. Bob decided. Write it down. Move to next comparison." Keep the pace brisk.

  # What The Game Can't Reproduce

  **The "Intensity" of Preference.**
  *   **Limitation:** The game treats preferences as binary rankings (A > B). In reality, people feel *strongly* about some things and *weakly* about others.
  *   **The Truth:** In the real world, we escape this paradox by trading. "I'll let you decide your monitor if you let me decide the keyboard." (Logrolling).
  *   **What to say:** "This model assumes rigid preferences. Real humans negotiate intensity. But the logical constraint remains: you cannot have perfect autonomy and perfect consensus simultaneously if you care about each other's autonomy."

  **The "Social Welfare Function."**
  *   **Limitation:** We simulated a committee vote. Sen's theorem is about *any* method of aggregating preferences (voting, markets, dictatorship).
  *   **What to say:** "It doesn't matter if we vote, or if I decide, or if we use an algorithm. If you want those two rules, the math says no solution exists."

