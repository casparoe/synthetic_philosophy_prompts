      *   *Critique:* Is it useful? Yes, it highlights the *semiotic decay* problem. Text loses meaning (Outer). Monuments lose context (Inner). Instructions lose keys (Frame). The consultant's point about "smuggling the frame into the outer message" is crucial. If the warning *is* the landscape, you don't need a manual. If the warning is text, you need a manual to read the text.
      *   *Decision:* The framework is useful for diagnosing *why* the two camps are stuck. It's not just labels; it identifies the failure points over deep time. I should validate it but note its limitations (it doesn't solve the problem, just maps it).

  3.  **Determine the Recommendation:**
      *   *Option 1: Pure Spikes.* Too passive. Relies on universal human psychology of "hostile architecture," which might not hold over 10k years (e.g., ruins become temples).
