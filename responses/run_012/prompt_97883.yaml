      *   **The Strongest Point of the Losing Side:** This is crucial. If I recommend the Archive/Hybrid, I must validate the Spikes camp. Their strongest point is *Curiosity as a Vector*. Text invites reading; reading invites interpretation; interpretation invites intrusion. A spike just says "No."
      *   **Recommendation:** A "Defense in Depth" semiotic strategy.
          *   Level 1: Hostile Landscape (Spikes/Earthworks) - The Inner Message.
          *   Level 2: Redundant Archives (Rosetta) - The Outer Message.
