answer: |-
  Here is a complete facilitation plan. I have tightened the mechanics to prevent the "do nothing" exploit you worried about (by making passivity costly) and structured the debrief to let the philosophical reveal land with impact.

  ### Session Overview
  *   **Topic:** The Structure of Desire and Well-being (Tranquilism).
  *   **Time:** 75 Minutes.
  *   **Students:** 18 Undergraduates.
  *   **Goal:** Students experience the *hedonic treadmill* mechanically before labeling it philosophically. They should feel the tension between "Jolts" (pleasure/satisfaction) and "Ease" (absence of craving).

  ---

  ### 1. Materials & Setup
  **You need:**
  *   **18 "Craving Ledgers"** (Printed sheets, see template below).
  *   **36 Action Tokens** (2 per student per round is too much paper shuffling. Give them a "Action Budget" on the sheet, or use 2 poker chips per student that they refresh each round. *Recommendation:* Print 5 rows of 2 checkboxes on the ledger. They mark an X to spend a token. No physical chips needed.)
  *   **Whiteboard:** To track the "Jolt Leader" each round.
  *   **Prizes:**
      *   *Main Prize:* Something desirable but low-effort (e.g., "Homework Pass," "Pick the next reading," or a nice chocolate bar).
      *   *Side Prize:* Something flashy but trivial (e.g., a bag of cheap candy, a sticker).

  **Craving Ledger Template (Print 1 per student):**
  > **NAME:** _______________
  >
  > **STARTING STATE:** 3 Cravings (Intensity 2, 2, 2).
  >
  > **ROUND 1:**
  > [ ] Action 1  [ ] Action 2
  > Craving A: ___ | Craving B: ___ | Craving C: ___ | New?: ___
  > *Round Suffering Score (Sum of Intensities):* ___
  > *Jolts Banked:* ___
  >
  > *(Repeat for Rounds 2–5)*
  >
  > **FINAL SCORES:**
  > Total Cumulative Suffering: ______
  > Total Jolts: ______

  ---

  ### 2. The Rules (Read Aloud + Handout)
  *Do not mention philosophy. Frame this as a resource management game.*

  **Objective:** Minimize your **Total Cumulative Suffering**. (Sum of your Suffering Score at the end of every round).
  **Secondary Objective:** Maximize **Jolt Points**. (There is a separate prize for this).

  **Initial State:** You begin with 3 Active Cravings. Each has Intensity 2.
  **Suffering Score:** The sum of all Intensity values of Active Cravings at the end of the round.
  **Action Budget:** You have 2 Action Tokens per round. Unspent tokens vanish.

  **Actions (Cost 1 Token each):**
  1.  **Satisfy:** Choose one craving. It is quiet *this round* (counts as 0 intensity). You gain **1 Jolt Point**.
      *   *Consequence:* Next round, this craving returns at **Intensity +1**.
  2.  **Let Go:** Choose one craving. Reduce its Intensity by 1.
      *   *Consequence:* If Intensity reaches 0, the craving is gone forever. No Jolts.
  3.  **Chase Novelty:** Gain **2 Jolt Points** immediately.
      *   *Consequence:* Next round, a **New Craving** appears at Intensity 2.

  **Social Rule (The Comparison Trap):**
  At the end of each round, I will announce who has the most Jolt Points *so far*.
  *   If you are **not** the leader, you must add **+1 Intensity** to one of your existing cravings (envy breeds dissatisfaction).

  **Winning:**
  *   **Main Prize:** Lowest Total Cumulative Suffering.
  *   **Side Prize:** Highest Total Jolt Points.

  ---

  ### 3. Round-by-Round Timeline (75 Minutes)

  **0:00–0:05 | Introduction & Distribution**
  *   Hand out ledgers.
  *   Read rules clearly. Emphasize: *Suffering is calculated at the end of every round and added up.* (This prevents waiting until Round 5 to fix things).
  *   **Crucial:** Do not explain *why* satisfaction increases intensity. Just say "That is the mechanic."

  **0:05–0:45 | Gameplay (5 Rounds, 8 mins each)**
  *   **Phase 1 (Decision):** 3 mins. Students mark their ledgers.
  *   **Phase 2 (Resolution):** 3 mins.
      *   Ask: "Who Chased Novelty?" (Add new cravings for next round).
      *   Ask: "Who Satisfied?" (Record Jolts, note intensities for next round).
      *   Ask: "Who Let Go?" (Reduce intensities).
      *   **Calculate Suffering:** Students sum their current intensities.
      *   **Social Check:** Announce the Jolt Leader. Non-leaders add +1 to a craving.
  *   **Phase 3 (Reset):** 2 mins. Prepare for next round tokens.
  *   *Facilitator Note:* Keep the pace brisk. If they drag, cut the decision time. The pressure mimics the urgency of craving.

  **0:45–0:50 | Scoring & Prizes**
  *   Collect sheets or have students tally.
  *   Award the **Side Prize (Jolts)** first. Make a fuss about it.
  *   Award the **Main Prize (Suffering)**.
  *   *Observation:* Usually, these will be different people. Highlight this tension. "Look, the person who felt the most 'buzz' has the highest suffering score."

  **0:50–1:15 | The Debrief (25 Minutes)**
  *   See script below.

  ---

  ### 4. The Debrief Script (Mapping Mechanics to Philosophy)

  **Step 1: The Phenomenology (5 mins)**
  *   "Raise your hand if you felt stressed watching your intensities climb."
  *   "Raise your hand if you chased the Jolt prize even though you knew it might hurt your score."
  *   "Did anyone find that 'Satisfy' felt good in the moment but annoying in the long run?"
  *   *Point:* Establish that the *feeling* of the game mirrored a specific view of human psychology.

  **Step 2: The Reveal (5 mins)**
  *   "The view you just played is called **Tranquilism**."
  *   Write on board: **Tranquilism:** *The absence of craving/suffering is the only intrinsic good. Pleasure/Satisfaction is at best neutral.*
  *   "In this game, Jolts (pleasure) were not 'good.' They were distractions that cost you tokens and increased future suffering. The only thing that lowered your score was 'Letting Go' (absence)."

  **Step 3: The Treadmill & Asymmetry (5 mins)**
  *   **The Treadmill:** "Why did 'Satisfy' increase intensity next round?"
      *   *Student Answer:* Tolerance, hedonic adaptation.
      *   *Philosophical Link:* Schopenhauer or Buddhist *Tanha*. Satisfaction doesn't fill the hole; it just widens it.
  *   **The Asymmetry:** "Why was the Main Prize (Suffering) more important than the Side Prize (Jolts)?"
      *   *Philosophical Link:* The asymmetry of pain and pleasure. Pain demands removal; pleasure does not demand pursuit. A life with 0 pain and 0 pleasure scores better than 100 pain and 100 pleasure.

  **Step 4: Objections & Tranquilist Responses (10 mins)**
  *   **Objection 1: The Bleakness Objection.**
      *   *Prompt:* "This game makes the winning life look boring. Zero cravings, zero jolts. Is a placid life actually *better* than a striving one?"
      *   *Tranquilist Answer:* Tranquilists argue we confuse 'excitement' with 'well-being.' Striving is just managed suffering. The 'boredom' is actually *peace*.
  *   **Objection 2: The Empirical Claim.**
      *   *Prompt:* "The game forced cravings to grow when satisfied. Is that true in real life?"
      *   *Discussion:* Sometimes yes (addiction), sometimes no (eating a meal). Tranquilism relies on the claim that desire is inherently unstable.
  *   **Objection 3: The 'Do Nothing' Exploit.**
      *   *Prompt:* "Did anyone try to just ignore the cravings?"
      *   *Correction:* "If you did nothing, your score stayed high. Tranquility isn't apathy. In the game, 'Letting Go' cost tokens. In life, mindfulness/philosophy takes *work*. It is an active elimination of desire, not passive sloth."

  ---

  ### 5. Troubleshooting: What Will Blow Up

  **1. The "Do Nothing" Exploit**
  *   **Risk:** A student realizes that if they don't spend tokens, they don't trigger the "Satisfy" penalty. If they assume cravings decay naturally, they will sit still and win.
  *   **Fix:** The rules explicitly state cravings **do not decay**. They persist at current intensity until "Let Go" is used.
  *   **Contingency:** If a student argues "I should be able to just ignore it," reply: "In this model, craving is attention. To ignore it requires the action of 'Letting Go.' You cannot passive-win."

  **2. The Social Layer Admin Burden**
  *   **Risk:** Tracking who is the Jolt Leader every round slows the game.
  *   **Fix:** Keep it analog. Ask "Who has 5+ Jolts?" Stand up. If multiple, everyone else ticks up. If no one has 5+, no penalty. Or, simply apply the penalty to *everyone* who isn't the single highest scorer. (Simpler: Just announce the name. Everyone else adds +1).

  **3. The "Collusion" Strategy**
  *   **Risk:** Students agree to take turns being Jolt Leader to minimize the social penalty.
  *   **Fix:** This is actually philosophically rich! It shows that social comparison is a shared trap. If it happens, highlight it in the debrief: "You tried to game the social system. But the Tranquilist says the only way to win is to opt out of the Jolt game entirely."

  ---

  ### 6. Honest Limitations (For Your Prep)

  Be prepared to admit these points if sharp students raise them:

  1.  **Baked-in Empiricism:** The game *assumes* satisfaction regenerates craving (Intensity +1). In reality, some satisfactions are sustainable (e.g., securing a home). Tranquilism is controversial because it treats *all* desire as problematic. The game rigs the simulation to prove the theory.
  2.  **Intrinsic vs. Instrumental:** The game makes Jolts instrumentally bad (they cost tokens and raise suffering). It does not prove they aren't *intrinsically* good. A hedonist could say, "I lost the game, but I had more fun playing." The game measures *efficiency of tranquility*, not *quality of experience*.
  3.  **The Value of Striving:** The game penalizes "Chasing Novelty." But in real life, novelty drives art, science, and discovery. Tranquilism struggles to account for the value of ambitious projects that inherently involve stress/craving.
  4.  **Negative vs. Positive:** The game equates "0 Intensity" with "Winning." It assumes a neutral state is preferable to a positive state. This is the core axiological claim of tranquilism that the game illustrates but cannot prove.

  ### Facilitator's Cheat Sheet for the "Aha!" Moment
  If the room feels flat, ask this:
  *"If I offered you a pill that removed all your cravings permanently, but you'd never feel excitement again, would you take it?"*
  *   **Yes:** You are intuitively a Tranquilist.
  *   **No:** You believe pleasure has intrinsic value beyond the absence of pain.
  *   *Connect this back to the game:* "In the game, the pill was the 'Let Go' strategy. Most of you were too scared to take it until the end."
