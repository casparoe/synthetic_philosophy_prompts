answer: |-
  You are not being dense. You have put your finger on the open secret of modern welfare economics. Your friend in the regulatory shop is giving you the "professional fiction" version of the story, not the philosophical reality.

  The short answer is: **Revealed Preference Theory (RPT) cannot do the normative work that Cost-Benefit Analysis (CBA) asks it to do.** The practice you are observing relies on a theoretical "Frankenstein"—a hybrid of conflicting theories that is pragmatically useful but philosophically incoherent.

  Here is the breakdown of the picture of utility and welfare this package actually commits us to, where the contradictions lie, and what the "smallest patch" would look like.

  ### 1. The Interpersonal Comparison Problem (The Summing Issue)
  You are absolutely correct about the first contradiction.
  *   **Revealed Preference Theory** (Samuelson, Hicks) was explicitly designed to purge economics of psychology. It says utility is **ordinal** (I prefer A to B) and **intra-personal** (only I can rank my options). It explicitly forbids saying "Person A's gain is bigger than Person B's loss."
  *   **Cost-Benefit Analysis** requires utility to be **cardinal** (measurable in units) and **inter-personally comparable** (a dollar of benefit to a rich person can be added to a dollar of benefit to a poor person).

  **The Commitment:**
  When regulators sum dollars across people, they are implicitly assuming **Utilitarianism**, not Revealed Preference. Specifically, they are assuming that the *marginal utility of money* is roughly constant across the population. They are treating \$1 as a universal unit of "welfare."

  **Why your friend is wrong:**
  Your friend calls this "applied revealed preference." It is not. It is **Kaldor-Hicks Efficiency** masquerading as Pareto Efficiency.
  *   *Pareto:* Make someone better off without making anyone worse off. (Compatible with RPT).
  *   *Kaldor-Hicks:* The winners gain enough that they *could* compensate the losers and still be ahead. (Incompatible with strict RPT because we don't actually check if compensation happens).

  CBA assumes that if the total dollar amount goes up, "society" is better off. This presupposes a **Social Welfare Function** that aggregates individual utilities. RPT explicitly denies we can measure those individual utilities, let alone aggregate them.

  ### 2. The "Third Thing" (Market Inalienability)
  You asked about the bans on selling kidneys, votes, or surrogacy. You noted the justification isn't paternalism ("you'll hurt yourself") or standard externalities ("you'll hurt a third party").

  **The Commitment:**
  This commits the legal system to a theory of **Commodification** or **Semiotics of Markets**. Philosophers like Elizabeth Anderson (*Value in Ethics and Economics*) and Margaret Radin argue that some goods are degraded by being bought and sold.
  *   **The Theory:** Welfare is not just preference satisfaction. It is also about the *kind of society* we live in and the *kind of people* we are.
  *   **The Conflict:** If welfare were just "getting what you choose" (RPT), banning a voluntary kidney sale would be a pure welfare loss. The fact that we ban it implies that **preferences are not sovereign.**

  The "third thing" you can't name is likely **Social Meaning** or **Human Dignity**. The law presupposes that certain aspects of the self (bodily integrity, political agency) are not "assets" to be traded, even if the owner wants to trade them. This is a deontological constraint, not a consequentialist one. It says: *Some transactions are wrong regardless of the utility gain.*

  ### 3. The WTP/WTA Gap (The Stability Issue)
  You mentioned the Endowment Effect (Willingness to Accept > Willingness to Pay).
  *   **RPT Assumption:** Preferences are stable, complete, and transitive. My valuation of a mug shouldn't change just because I own it.
  *   **Empirical Reality:** Valuation depends on reference points (Prospect Theory).

  **The Commitment:**
  The practice of CBA usually ignores this gap (often defaulting to WTP because it's lower, making regulation look cheaper). By ignoring it, regulators are assuming **Coasean Neutrality**: that property rights don't affect value.
  If they took the WTP/WTA gap seriously, they would have to admit that **preferences are constructed**, not revealed. This destroys the foundation of RPT. It implies that the *framing* of the choice determines the "utility," so there is no "true" utility to measure.

  ### 4. So, What Picture of Welfare Does the Practice Actually Use?
  The regulatory state operates on a **Pragmatic Hybrid** that no single philosopher would endorse. It combines:

  1.  **Methodological Individualism:** Only individuals have value (from Liberalism).
  2.  **Hedonic/Cardinal Utilitarianism:** We can measure value in dollars and sum it (from Bentham/Posner).
  3.  **Deontological Constraints:** Some things cannot be sold, regardless of the sum (from Kant/Radin).
  4.  **Behavioral Realism (selectively):** We use choice data, but we ignore cognitive biases when they make regulation look expensive.

  It is theoretically inconsistent. It claims the objectivity of "science" (RPT) while making the normative judgments of "moral philosophy" (Utilitarianism + Deontology).

  ### 5. The Smallest Patch
  If you wanted to fix this without blowing up the entire regulatory state, what is the minimal theoretical change?

  **Option A: The "Laundered Preferences" Patch (Sunstein/Thaler)**
  Admit that revealed preferences are noisy. We should try to measure "rational" preferences (what you would choose if you weren't tired, biased, or misinformed).
  *   *Pros:* Keeps the preference-satisfaction model.
  *   *Cons:* Who decides what is "rational"? This slides back into paternalism.

  **Option B: The "Distributional Weights" Patch (Best Fit)**
  Admit that a dollar is not a dollar. Acknowledge that \$1 to a poor person is more welfare than \$1 to a rich person. Apply weights in CBA.
  *   *Pros:* Fixes the interpersonal comparison issue partially.
  *   *Cons:* Makes CBA political. (Regulators hate this because it looks like redistribution).

  **Option C: The Capabilities Approach (Sen/Nussbaum)**
  Stop trying to measure "utility." Measure **Capabilities** (what people are actually able to do and be).
  *   *Pros:* Handles the kidney/vote issue naturally (selling a kidney reduces your capability to function; selling a vote reduces democratic capability). It handles interpersonal comparisons better (focusing on functionings, not feelings).
  *   *Cons:* Harder to quantify than dollars.

  **The Verdict:** The **Capabilities Approach** is the most philosophically robust patch. It explains why we ban kidney sales (it destroys a fundamental capability) without relying on paternalism, and it avoids the trap of summing arbitrary dollar figures.

  ### 6. What Would Change If We Took Revealed Preference Seriously?
  If you forced the system to be consistent with strict Revealed Preference Theory:

  1.  **CBA Would Collapse:** You cannot sum ordinal utilities. You could not say "The regulation saves 50 lives worth \$10M each." You could only say "Person A prefers clean air, Person B prefers cheaper goods." You would have no metric to decide between them. Regulation would become impossible to justify scientifically.
  2.  **Market Bans Would Vanish (or need new justification):** If choice = welfare, banning a kidney sale is a welfare loss. To keep the bans, you would have to argue **Externalities**. You'd have to claim that *my* selling my kidney hurts *you* by degrading the social fabric. (This is a valid argument, but it's not the one currently used).
  3.  **WTP vs. WTA Would Paralyze Policy:** If valuation depends on ownership, then the "cost" of a regulation depends on who holds the initial property rights. Policy becomes path-dependent and unstable.

  ### Summary
  Your intuition is correct. The practice presupposes that **Utility is Cardinal and Interpersonally Comparable** (contradicting RPT) and that **Welfare includes Non-Preference Values** like dignity and social meaning (contradicting Welfarism).

  The "honest answer" is that economists use RPT when they want to sound objective (positive economics) and Utilitarianism when they want to make policy (normative economics).

  **The Smallest Patch:** Stop calling it "Revealed Preference." Call it **"Pragmatic Welfarism with Deontological Constraints."** Admit that money is a proxy for welfare, not welfare itself. Admit that we weight the welfare of the vulnerable more heavily. And admit that some markets are banned not because people choose poorly, but because some things lose their value when priced.

  If you take this to your seminar, tell your friends: *Revealed Preference is a theory of behavior, not a theory of justice. CBA is a tool of justice. You can't build a bridge between them without adding normative pillars that RPT explicitly removed.*
