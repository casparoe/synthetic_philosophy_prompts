          *   *Resolution:* You need "Strong Reciprocity" or "Social Preferences" (inequality aversion), not just narrow self-interest. Claim 3 is too reductionist.
          *   *Severity:* **High.** This strikes at the heart of the narrative.

      *   **Tension B: (2) vs. (5) - Prediction vs. Menu.**
          *   *Claim 2:* Cooperation is *often rational* (implies prediction/explanation of why we cooperate).
          *   *Claim 5:* Repetition buys a *menu*, not a prediction (implies we don't know *which* equilibrium).
          *   *Conflict:* If (5) is true, (2) is weak. Saying cooperation is "rational" doesn't explain why we get cooperation rather than mutual defection or alternating defection, since all are equilibria.
          *   *Severity:* **Medium.** It's a theoretical nuance, but important for a journalist framing "why we cooperate."

      *   **Tension C: (1)/(3) vs. (4) - The Definition of Rationality.**
          *   *Claim 3:* Same EU reasoning applies.
          *   *Claim 4:* Evolved dispositions.
          *   *Conflict:* Evolved dispositions often manifest as heuristics or emotions (anger, guilt) that *override* calculated EU in the moment. If I punish out of anger, am I maximizing EU? Claim 3 says yes (implicitly). Claim 4 suggests the mechanism is psychological adaptation, not conscious calculation.
          *   *Severity:* **Medium-High.** It's the "Ultimate vs. Proximate" cause confusion.

      *   **Tension D: (2) Finite vs. Infinite.**
          *   *Claim 2:* Finite games are practically indefinite.
          *   *Theory:* Backward induction unravels cooperation in finite games with known ends.
          *   *Conflict:* If players know the end, cooperation collapses immediately. The "practically indefinite" fix requires uncertainty about the end.
          *   *Severity:* **Low-Medium.** Easily fixed by clarifying "uncertainty of termination."

  5.  **Rank Tensions by Severity:**
      1.  **Self-Interest vs. Costly Punishment (3 vs 4):** This is the biggest theoretical hurdle. Narrow self-interest cannot explain costly punishment without expanding the utility function.
      2.  **Rationality vs. Adaptation (3 vs 4):** Is it calculation or instinct?
      3.  **Equilibrium Selection (2 vs 5):** Why *this* cooperation and not another?
      4.  **Finite Game Unraveling (2):** Technicality, but needs precision.

  6.  **Identify the "Keystone" Commitment:**
      *   Commitment (3) is doing the heaviest lifting. It tries to unify game theory (1 & 2) with evolution (4) under the banner of "self-interest." If (3) falls, the narrative shifts from "Self-Interest Explains All" to "Self-Interest + Social Preferences/Evolution."

