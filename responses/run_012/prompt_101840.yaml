answer: |-
  1. **The Reference Class Boundary**
     You define superrationality as reasoning based on the assumption that all agents "like you" will reach the same conclusion. But "like you" is doing a lot of heavy lifting here. How do you objectively draw the boundary of this reference class without begging the question? If I am a causal decision theorist who understands your argument but rejects it, am I in your reference class or not?

     *Follow-up:* You will likely say I am excluded because I do not *accept* the reasoning. But if the theory relies on me already accepting it to work, doesn't that reduce superrationality to a tautology? It seems you are saying, "If everyone reasons exactly as I say they should, everyone will reason exactly as I say they should." What normative force does that have for someone currently outside that circle?

  2. **Known Heterogeneity**
     Let's tighten that boundary problem. Suppose you are in a Platonia Dilemma with nineteen other people. You know for a fact that five of them are committed causal decision theorists who will definitely send a telegram. Do you still apply the superrational rule to the remaining fourteen, or does the presence of the known defectors collapse the logic?

     *Follow-up:* If you say the logic collapses, then superrationality isn't a universal decision principle; it's a conditional strategy that only works in idealized isolation. If you say you still apply it to the fourteen, you are assuming a symmetry of reasoning that you *know* does not exist across the whole group. How do you justify mirroring the fourteen when the outcome depends on the twenty?

  3. **Platonia and Mixed Strategies**
     In the Platonia Dilemma, the superrational solution is for every agent to send a telegram with a probability of 1/20. But the core appeal of your view is that identical reasoners converge on a *single* answer. If we all reason identically, shouldn't we all choose the same *deterministic* action? How can "identical reasoning" lead to a randomized outcome where some of us send telegrams and others don't?

     *Follow-up:* You will likely argue that we all adopt the same *policy* of randomization. But if I flip my coin and you flip yours, we are no longer guaranteed to reach the same *outcome*, only the same *probability distribution*. Doesn't this admit that the reasoning process does not actually synchronize our actions, undermining the claim that my decision *is* your decision?

  4. **Convergence Failure in Platonia**
     Following up on that randomization: If twenty superrationalists all randomize with $p=1/20$, there is a significant statistical chance that zero telegrams arrive, or two, or five. In those cases, the group gets nothing. Doesn't this reveal that the superrational strategy is actually suboptimal compared to a coordinated agreement where one specific person is designated to send the telegram?

     *Follow-up:* If you argue that designation is impossible in the thought experiment, then aren't you conceding that superrationality is merely a second-best heuristic for when communication fails? If it's just a heuristic for silence, why elevate it to a fundamental principle of rationality rather than a workaround for information gaps?

  5. **The Luring Lottery as a Coordination Norm**
     In the actual Luring Lottery, contestants submitted astronomically large numbers, destroying the prize pool. You argue they should have limited entries. But isn't the reality here that superrationality functions as a coordination norm that presupposes everyone is already "on board," rather than a decision procedure for actual agents facing incentives to defect?

     *Follow-up:* If the theory only yields the optimal outcome when everyone already agrees to use it, isn't it functionally identical to a social contract? What work is the "reasoning" doing that a simple promise or treaty wouldn't do better? I'm pressing you on whether this is decision theory or just morality in disguise.

  6. **Decision Procedure Viability**
     To defend that distinction: If I am a lone superrationalist entering the Luring Lottery against a field of defectors, your theory seems to recommend I limit my entries while they maximize theirs. This guarantees I lose. Why should I adopt a decision procedure that makes me a "sucker" in any non-ideal population?

     *Follow-up:* You might say I should expect long-run benefits or moral satisfaction. But decision theory is usually about maximizing utility in the specific game at hand. If superrationality systematically loses money in mixed populations, aren't you asking agents to sacrifice their own utility for the sake of a principle that others are actively exploiting?

  7. **Magical Thinking and Causality**
     Critics accuse superrationality of "magical thinking"—treating my choice as a *cause* of your choice without a physical mechanism. You deny this, but if my pressing "send" doesn't physically force you to press "send," in what sense is my decision determining yours? Is it merely correlation, or are you claiming a form of backward causation?

     *Follow-up:* If you claim it is "logical causality" rather than physical, does that logical dependency extend to trivial acts? If I decide to scratch my nose, must a superrational twin scratch theirs? If not, where does the logical dependency chain stop, and isn't that boundary just as arbitrary as the reference class problem we started with?

  8. **Asymmetry and Generalization**
     Superrationality is defined for symmetric games where agents have identical options and payoffs. How do you extend this rule to asymmetric games where I have more information or power than you? Do I reason as though I am you, or do I reason as me expecting you to reason as you?

     *Follow-up:* If you say I must factor in the asymmetry, aren't we just back to calculating a Nash Equilibrium with updated priors? I need to know what unique predictive power superrationality adds once you remove the perfect symmetry that the theory relies on.

  9. **Modified Luring Lottery vs. Evidential Decision Theory**
     You ran a modified Luring Lottery where entry was free, but a lone entrant collected a large bonus on top of the divided prize. You suggest this exposes a difference between superrationality and Evidential Decision Theory (EDT). EDT says my entry is *evidence* that others will enter. How does the superrational prescription diverge here?

     *Follow-up:* In this specific variant, an evidential decision theorist might also limit entries to avoid evidence of a crowded pool. If both EDT and superrationality recommend limiting entries, where is the divergence? I need you to identify a specific scenario in this variant where EDT says "Enter" and superrationality says "Don't," or vice versa, to prove they aren't just the same view with different branding.

  10. **Normative Force in Mixed Populations**
      Finally, let's return to the "ought." If I know I am in a world where most people are causal decision theorists, do I *ought* to be superrational? If I do, I get exploited. If I don't, I contribute to the suboptimal equilibrium. Is superrationality a prudential recommendation or a moral duty?

      *Follow-up:* If it's a moral duty, you've moved from decision theory to ethics. If it's prudential, it seems to fail in the real world. Can you name one real-world scenario, not a thought experiment, where adopting superrationality over causal decision theory demonstrably improved an agent's outcome against non-superrational opponents?
