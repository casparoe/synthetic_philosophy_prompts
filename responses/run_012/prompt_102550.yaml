answer: |-
  Good evening. For those of you who don't know me, I'm [Your Name], and I have the privilege of calling both [Partner A] and [Partner B] my friends.

  I was told that their first conversation happened in a graduate seminar. Specifically, a seminar on moral philosophy. Now, for about half of you, that sentence is perfectly normal. For the rest of you—the parents, the cousins, the old friends from home—I should explain that this is a slightly dangerous place to meet. Most couples bond over a shared love of hiking, or cooking, or a specific type of dog. This couple bonded over a debate about whether morality allows you to save your own spouse from a drowning ship.

  There is a famous thought experiment by the philosopher Bernard Williams. He asked: If a man's wife is drowning, and he saves her, is it okay if he first stops to ask whether impartial morality permits him to prioritize her over a stranger? Williams said no. He said that if the husband has to check the moral rulebook before jumping in, he has had "one thought too many." To love someone is to act for them immediately, without needing permission from the universe.

  [Partner A] and [Partner B] have spent years debating how to solve this. One of them argues that love is good because it creates a better world overall. The other argues that love exists in a sphere where "the overall world" has no say. They have asked me, only half-jokingly, not to turn this toast into a defense of their relationship based on its net value to society. They don't want me to tell you that they are a "productive unit" or that their marriage "maximizes utility."

  And they are right to ask that. Because if I stand up here and tell you that they deserve each other because they make the world a better place, I am making the mistake Williams warned against. I am standing outside their relationship, looking at it like an auditor checking a ledger. I am having one thought too many.

  But, there is a trap on the other side, too. If I simply say, "They love each other, and that's all the reason needed," that feels evasive. It treats their love like a brute fact, a black box we aren't allowed to open. That feels cold. It ignores the truth that we, their friends and family, *do* see something specific and luminous when we look at them together. We aren't impartial spectators, but we aren't the couple, either. We are witnesses.

  So, where does that leave me?

  I find myself wanting to say that they make each other better people. I want to say that [Partner A] makes [Partner B] kinder, and [Partner B] makes [Partner A] braver. But I have to stop myself there. Because if I say that, I am still treating their love as a tool. I am saying their relationship is valuable *for what it produces*. I am still standing outside.

  The truth is simpler, and harder to articulate. It isn't that they produce good things. It's that when they are together, the world *appears* differently to them.

  I see it in the way [Partner A] looks for [Partner B] the moment they walk into a room. It isn't a calculation. It isn't, "I should check in on my partner." It is a magnetic pull, a recognition. And I see it in the way [Partner B] speaks about [Partner A]—not in terms of what [Partner A] achieves, but in terms of who [Partner A] is.

  They don't love each other *because* it is good. They love each other, and *therefore* it is good.

  The distinction is subtle, but it is everything. Williams was worried that morality would swallow up our personal lives. But watching these two, I realize that the integrity of a relationship doesn't come from ignoring the world, or from serving it. It comes from this: that when you are with the person you love, you do not need to justify your attention to them. You are allowed to be partial. You are allowed to be biased. You are allowed to have their name be the one word that stops you in your tracks, regardless of the crowd.

  [Partner A] and [Partner B], you met debating whether you were allowed to prioritize each other. My wish for you is that you never have to debate it again.

  May you always have one thought too few about what you owe the universe, and one thought too many about how to make each other smile. May you never need to justify your devotion to an impartial judge. And may you find, in the quiet moments of your life together, that the only justification you ever need is the look in the other's eyes when you walk through the door.

  To [Partner A] and [Partner B].
