answer: |-
  You are right to be suspicious. The slogan "if he hadn't done it, someone else would have" is a philosophical shapeshifter. It slides between descriptive claims about the sociology of science, modal claims about the necessity of ideas, and normative claims about the distribution of credit. Your instinct that the inference from "inevitable" to "irrelevant" is suspect is correct; it relies on a hidden premise about the *purpose* of priority credit that is rarely stated.

  Here is the menu of distinct theses hidden within the slogan, ordered from the trivial to the radical, followed by an analysis of your two sticking points and a diagnosis of your classmates.

  ### The Menu of Theses

  **1. The Statistical Regularity Thesis**
  *   **Claim:** Multiple independent discovery is a frequent empirical occurrence in the history of science (e.g., Merton's "multiples").
  *   **Quantification:** Existential ("*Someone* else often does").
  *   **Modality:** Inductive generalization from historical data.
  *   **Verdict:** **Platitude.** It is historically well-supported that many discoveries are simultaneous. However, frequency does not entail inevitability in a specific case, nor does it entail that credit is undeserved. Being one of two winners is still winning.

  **2. The Local Necessity ("Ripe Time") Thesis**
  *   **Claim:** Given the specific technical, social, and intellectual conditions at time *t*, the probability of *a* discovery in this domain approached 1.
  *   **Quantification:** Generic ("*Some* discovery in this domain").
  *   **Modality:** Probabilistic/Contextual determinism.
  *   **Verdict:** **Substantive and Defensible.** This is the standard "Zeitgeist" explanation. It is defensible for mature fields (e.g., late 19th-century physics) but less so for revolutionary shifts. Crucially, it supports the inevitability of *a* discovery, not necessarily *this specific* formulation.

  **3. The Content Equivalence Thesis**
  *   **Claim:** The "it" in the slogan refers to an abstract core proposition, not the specific formulation. Newton and Leibniz discovered the *same* calculus (core theorems), despite different notations.
  *   **Quantification:** Universal over equivalence classes of theories ("*This* content, under description *D*").
  *   **Modality:** Methodological stipulation.
  *   **Verdict:** **Methodologically Useful but Historically Blunt.** This makes the counterfactual well-formed by abstracting away differences. However, in HPS, the *formulation* often dictates the *utility* and *future trajectory* of the science. Leibniz's notation was arguably more important than Newton's for the continent's development. If the "what" is fixed by abstraction, the "who" might still matter for the "how."

  **4. The Agent Redundancy (Deterministic) Thesis**
  *   **Claim:** The individual agent plays no causal role that is not fully substitutable. The discovery is a structural necessity of the world/knowledge, and the scientist is merely a vessel.
  *   **Quantification:** Universal over agents ("*Any* competent agent").
  *   **Modality:** Metaphysical/Strong Determinism.
  *   **Verdict:** **Simply False (or Unfalsifiable).** This denies the contingency of individual cognitive labor, risk-taking, and specific heuristic paths. It treats science as a revelation rather than a construction. While social conditions constrain discovery, they do not typically determine the specific agent to the point of substitutability without loss.

  **5. The Normative Deflation Thesis**
  *   **Claim:** Priority credit is only deserved if the agent was *necessary* for the discovery. If the discovery was inevitable, the agent contributes nothing unique to the *existence* of the knowledge, and thus deserves no special credit.
  *   **Quantification:** N/A (Normative principle).
  *   **Modality:** Ethical/Epistemic norm.
  *   **Verdict:** **Invalid Inference.** This is the hidden bridge. It assumes a "necessity condition" for credit. But credit in science is often backward-looking (reward for labor/risk) or functional (incentive for future work), not just metaphysical (credit for bringing something into existence that wouldn't otherwise exist). One can accept inevitability (Thesis 2) and reject Deflation (Thesis 5).

  ---

  ### Addressing Your Sticking Points

  **1. Is the counterfactual well-formed? (The Content Problem)**
  You noted that Newton/Leibniz and Darwin/Wallace did not produce identical theories. The slogan only works if we engage in **Equivalence Classing** (Thesis 3).
  *   **The Trap:** The slogan smuggles in a specific level of abstraction. At the level of "fluxions vs. differentials," the counterfactual is false (Leibniz would not have written Newton's *Principia* notation). At the level of "rules for computing rates of change," it is plausible.
  *   **The Consequence:** If the content isn't fixed, the "inevitability" claim retreats to Thesis 2 (some discovery in the domain) rather than Thesis 4 (this specific theory). If it retreats to Thesis 2, the claim that "priority is a distraction" weakens, because *which* version becomes dominant (Leibniz's vs. Newton's) has massive historical consequences. The slogan relies on equivocation: it uses the plausibility of Thesis 2 to support the normative conclusion of Thesis 5, but requires the strength of Thesis 4 to make the content fixed enough to ignore the differences.

  **2. Is the inference from "inevitable" to "doesn't matter" valid? (The Credit Problem)**
  Your instinct is correct: the inference is invalid without a hidden normative premise.
  *   **The Hidden Premise:** "Credit is solely for *uniqueness of causal contribution*."
  *   **The Counter-Argument:** Credit is also for *labor*, *risk*, and *articulation*. Even if the gold is bound to be found, the miner who digs it up first still did the work. Furthermore, in science, priority serves a sociological function: it certifies the knowledge as "done" and allows the community to move on. Knowing *who* did it anchors the citation network.
  *   **The Verdict:** You can accept the strongest inevitability claim (Thesis 4) and still think it matters enormously who did the work, because the *path* taken influences the subsequent research programme (e.g., Newton's physics led to different dead-ends and breakthroughs than a hypothetical Leibnizian physics might have). The "doesn't matter" conclusion is a normative choice, not a logical consequence of historical determinism.

  ---

  ### Diagnosis of Your Classmates

  **Case 1: The Newton–Leibniz Seminar**
  *   **Invoked Thesis:** A mix of **Local Necessity (2)** and **Content Equivalence (3)**.
  *   **Analysis:** The classmate likely treated calculus as a mathematical truth waiting to be picked up (Platonism), ignoring that the *notation* (part of the content) determines the *ease of use*. By waving away the quarrel, they are prioritizing the *truth* over the *practice*.
  *   **Confidence:** High. This is a common move in philosophy of math to sidestep historical contingency.
  *   **Mind-Changing Condition:** If I were shown that the specific notation used fundamentally altered the *rate* of subsequent mathematical progress (which historical evidence suggests it did), I would retreat from "distraction" to "historically significant contingency."

  **Case 2: The Darwin–Wallace Reading Group**
  *   **Invoked Thesis:** **Local Necessity (2)** sliding into **Normative Deflation (5)**.
  *   **Analysis:** Here the claim is stronger: "the discovery was bound to happen *when it did*." This implies a tight causal net around 1858. The conclusion ("shouldn't care who gets credit") reveals the normative agenda. They are using the descriptive claim (it was ripe) to enforce a normative outcome (egalitarian credit or no credit).
  *   **Confidence:** Moderate-High. This is a standard sociological move to demystify the "Great Man" theory.
  *   **Mind-Changing Condition:** If the definition of "credit" were shifted from "glory" to "responsibility." If we care who gets credit because we care who is responsible for the *consequences* of the theory (e.g., social Darwinism), then inevitability does not erase the specific agent's role in how the theory was framed and received.

  ### Where I Might Be Wrong

  My analysis assumes a backward-looking or functionalist view of scientific credit. I am most vulnerable on the **Normative Deflation** point. If one adopts a strictly **utilitarian view of priority**—where the *only* purpose of priority is to incentivize the *first* disclosure to society to prevent secrecy—then if the disclosure was inevitable, the specific incentive provided to *that* agent was technically redundant. If your classmates are operating with a purely economic/incentive model of science (common in some sociology of science), the inference holds more water. I am assuming credit has a desert-based component; if they assume it is purely forward-looking (incentive), my critique of the inference weakens.

