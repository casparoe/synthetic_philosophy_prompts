answer: |-
  Your intuition strikes at the heart of historiography: the distinction between "what happened" and "what we agree happened" is often less about the weight of evidence and more about the weight of the voice declaring it. We tend to imagine history as a courtroom where evidence speaks for itself, but in reality, history is more like a liturgy, where the text survives only so long as there is a congregation that needs to hear it.

  To argue for your position: **A story becomes history not when it is corroborated, but when a continuous institution takes on the job of transmitting it as a fact about the past on which its own authority depends.**

  Under this framework, "historicity" is not an intrinsic property of an event, like mass or velocity. It is a social status conferred by an institution that requires the past to legitimize the present. Evidence is merely the currency used within the system; the institution is the bank that decides the currency has value.

  ### The Institutional Test Applied

  **1. The Exodus: The Theological Necessity**
  The Exodus has the weakest archaeological footprint of the three. There is no direct evidence of a mass migration of Israelites from Egypt in the Late Bronze Age, and the material culture of early Israel looks indistinguishable from Canaanite. By the standards of empirical corroboration, it should be classified alongside Gilgamesh.

  Yet, it is treated as history by billions. Why? Because the institution transmitting it—the Abrahamic religious tradition (Judaism, Christianity, Islam)—bases its entire authority on the event. The Covenant, the Law, and the concept of a Chosen People depend entirely on the historical reality of the Liberation from Egypt. If the Exodus is a myth, the theology collapses. Therefore, the Church and Synagogue function as continuous institutions that *must* transmit the Exodus as fact to survive. The institution's authority depends on the story's historicity, so the story remains history, regardless of the silence of the dirt.

  **2. King Arthur: The Political Opportunism**
  The Arthurian legend has literary sources (Nennius, Geoffrey of Monmouth) comparable in age and ambiguity to Homer. Yet, Arthur is firmly categorized as legend. Under the institutional test, this is because no continuous institution *needed* him to be real to maintain its authority.

  English monarchs, particularly the Plantagenets and Tudors, certainly *used* Arthur. Henry VII named his first son Arthur to cement his claim to the throne. However, the British Monarchy did not *depend* on Arthur. When the political winds shifted, the monarchy relied on Divine Right, then Constitutional legitimacy, then democratic mandate. The Church did not need Arthur for its sacraments. The scholarly tradition eventually turned against him because their authority depended on method, not myth. Because the institutional dependency was opportunistic rather than essential, and because no single institution maintained a continuous, unbroken dogma of Arthur's reality, the story reverted to legend. The institution dropped the burden of proof, and the story fell.

  **3. The Trojan War: The Scholarly Canon**
  The Trojan War occupies a middle ground. For centuries, the "institution" was Western Education itself. Homer was not merely entertainment; he was the *paideia*, the foundational textbook of Greek and later European identity. To be educated was to accept the Trojan War as the genesis of the West. Rome, via the Aeneid, institutionalized the war as the prequel to its own founding.

  When the Enlightenment and modern Archaeology arose, they became the new institution. Crucially, this new institution *also* found a use for Troy. It became the testing ground for the new method of scientific archaeology. Schliemann's discovery was not just dirt; it was validation of the Scholarly Tradition's power to reveal truth. Thus, the War remains "history" (or at least "proto-history") because the Academy has a vested interest in maintaining the bridge between literature and material reality. It validates their authority to interpret the past.

  ### The Worst Fit: The Trojan War

  Of the three, this theory handles **the Trojan War** the worst.

  The Exodus fits perfectly: The institution (Religion) demands belief despite evidence.
  Arthur fits perfectly: The institution (State) abandoned the story when it was no longer useful.
  Troy is the outlier because the modern institution transmitting it (Academia) derives its authority from *skepticism* and *evidence*, not tradition.

  The theory posits that authority creates history. But in the case of Troy, it feels intuitively as though the *evidence* (the layers of Hisarlik, the Hittite records of Wilusa) forced the institution to accept the history. If we argue that the Institution decided the evidence mattered, we risk sounding conspiratorial. The tension lies here: The Academy treats Troy as history *provisionally*, whereas the Church treats Exodus as history *dogmatically*.

  The theory struggles to explain why the Scholarly Tradition, which claims to be indifferent to authority and devoted only to truth, maintains the historicity of Troy with such tenacity despite the evidence remaining ambiguous (a war happened, but was it *the* war of Helen?). It suggests that even the "objective" institution of science has a mythological structure it needs to preserve: the idea that the Western Canon is rooted in reality. This makes Troy the "worst" fit only because it reveals the theory's most uncomfortable implication: that even our evidence-based institutions are driven by the need for foundational myths.

  ### The Objection: Power vs. Truth

  The strongest objection to this position is that it reduces history to propaganda. If historicity is a matter of institutional power rather than empirical truth, does that not mean we are endorsing lies? It makes history a matter of **power rather than truth**, seemingly stripping the discipline of its moral and epistemic value. If the Church says the Exodus happened to maintain authority, and we say "that makes it history," are we not complicit in a falsehood?

  **Can the position survive this objection?**

  Yes, but only if we refine our definition of "truth."

  The objection assumes a binary: either an event is a Brute Fact (it happened physically) or it is a Lie. The Institutional Theory argues for a third category: **Social Fact.**

  A Brute Fact (e.g., "fire burns") exists without human institutions. A Historical Fact (e.g., "The Exodus founded Israel") exists *only* within a network of meaning. For an event to be "history," it must do work in the present. It must explain why laws are obeyed, why borders are drawn, or why texts are read.

  When we say the Exodus is "history" because the Church transmits it, we are not saying the bricks of Jericho fell supernaturally. We are saying that the *event's consequence* is real. The Exodus *did* create the Jewish people, regardless of the archaeological count. The *effect* of the story is historical, even if the *mechanics* are legendary.

  The position survives the objection by distinguishing between **ontological truth** (did it physically occur?) and **sociological truth** (does it function as a causal force in human affairs?). The Institutional Theory claims that "History" is the study of the latter.

  If a State treats Arthur as history, and people die fighting for his banner, then Arthur is historically real in his consequences. If the Academy treats Troy as history, and it shapes the curriculum of a civilization, it is historically real in its impact.

  To argue that this makes history "just power" is to misunderstand power. Power is the mechanism by which the past is made relevant to the present. Without the institution to select, preserve, and transmit, the past is just noise—entropy. The institution imposes order. That order may be self-serving, but it is the only thing that transforms "chronicle" into "history."

  ### Conclusion

  We treat the Trojan War as history and Arthur as legend not because the Greeks left better dirt than the Britons, but because the Western Tradition needed a father and the British State did not need a king. We treat the Exodus as history because the Monotheistic World needs a covenant.

  This does not mean evidence is irrelevant. Evidence is the tool the institution uses to police its own narrative. But the *decision* to treat a narrative as history is an act of institutional self-preservation. This position survives the charge of cynicism by acknowledging that history is not a mirror of nature, but a map drawn by those who live in the territory. A map is not the land, but without the map, the land is uninhabitable. The institution draws the map; therefore, the institution makes the history.
