answer: |-
  | Requirement | The Case or Consideration that Motivates It | Status (Non-negotiable or Camp Preference) | Conflicts With |
  | :--- | :--- | :--- | :--- |
  | **Adams' Thesis (The Equation)**<br>$P(A \to B) = P(B\|A)$ | **The Card Case:** Your credence in "If it's a heart, it's red" is 1, matching $P(\text{Red}\|\text{Heart})$, not $P(\text{Heart} \supset \text{Red})$. Captures the intuitive link between assertion and conditional belief. | **Non-negotiable** (Pre-theoretic Data) | **Truth-Conditional Content** (Lewis's Triviality Result) |
  | **Truth-Conditional Content**<br>Conditionals express propositions with truth values. | **Embedding:** We say "Either if A then B, or if C then D." To evaluate the disjunction, the disjuncts seem to need truth values. Needed for logic to apply standardly. | **Camp Preference** (Semantic Realists) | **Adams' Thesis** (Lewis); **Non-Materiality** (Gibbard's Result) |
  | **Modus Ponens**<br>$A, A \to B \vdash B$ | **Inferential Utility:** If you accept "If it rains, the match is cancelled" and "It is raining," you must conclude "The match is cancelled." Without this, conditionals lose argumentative force. | **Non-negotiable** (Logical Core) | None directly, but contributes to **Gibbard's Result** when combined with Embedding. |
  | **Non-Materiality**<br>$A \to B \not\equiv \neg A \lor B$ | **Paradoxes of Material Implication:** "If the moon is cheese, 2+2=4" is materially true but intuitively unacceptable. Conditionals require a connection, not just truth-functional valuation. | **Non-negotiable** (Pre-theoretic Data) | **Truth-Conditional Content** + **Modus Ponens** + **Import-Export** (Gibbard's Collapse) |
  | **Embeddability**<br>Conditionals function in negations/disjunctions. | **Complex Sentences:** "It's not the case that if it rained, the ground is wet." If conditionals aren't truth-apt, negating them is semantically mysterious. | **Camp Preference** (Semantic Realists) | **Pure Expressivism** (Adams/Edgington struggle to account for this without propositional content) |
  | **Gibbardian Compatibility**<br>$A \to B$ and $A \to \neg B$ can be rationally acceptable. | **The Disagreement Case:** Two agents with different information can both rationally assert conflicting conditionals (e.g., about a die roll) without contradiction. Suggests truth is context-relative or non-propositional. | **Camp Preference** (Contextualists/Expressivists) | **Truth-Conditional Content** (if truth is global/absolute) |

  The unsatisfiable subset is {Truth-Conditional Content, Adams' Thesis, Non-Trivial Probabilities}: Lewis proved that if conditionals are propositions (Truth-Conditional Content) and obey the probability data (Adams' Thesis), probability functions collapse to triviality. The single most-excluding requirement is **Truth-Conditional Content**; insisting on it forces you to abandon Adams' Thesis (saving semantics but losing the probability data) or accept Gibbard's collapse to the material conditional (saving logic but losing Non-Materiality), thereby knocking out both Probabilistic and standard Possible Worlds theories.
