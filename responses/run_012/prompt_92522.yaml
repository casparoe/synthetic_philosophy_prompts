answer: |-
  ### Examination Paper: Early Modern Metaphysics
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question.

  **Question:**

  Leibniz maintains that God actualises the best of all possible worlds. Critics charge that this thesis is vacuous: if 'best' signifies only 'that which a perfect being chooses', the claim is true by definition and constrains nothing. To give it content, Leibniz proposes a criterion of maximal variety governed by the simplest laws, equivalent to the greatest quantity of essence.

  Consider two compossible worlds:
  *   **World $\alpha$:** Possesses perfect uniformity. Its laws are singular and mathematically elegant, but phenomena are monotonous.
  *   **World $\beta$:** Possesses immense diversity. Phenomena are rich and distinct, but the laws governing them cannot be unified; they must be stated as a long, disjunctive list of special cases.

  Leibniz's criterion appears unable to rank $\alpha$ and $\beta$ definitively, as one maximises simplicity and the other variety.

  Write an essay addressing the following:
  1.  Explain why the charge of vacuity threatens Leibniz's thesis and how the 'quantity of essence' criterion attempts to meet it.
  2.  Assess how Leibniz might adjudicate between World $\alpha$ and World $\beta$.
  3.  Identify what formal property the ordering of possible worlds must possess for a 'maximum' to exist at all.
  4.  Argue whether Leibniz can defend the existence of this property or merely assumes it.

  ***

  ### Model Answer

  The charge of vacuity against Leibniz's optimism is logical rather than moral. If 'goodness' is defined extensionally by God's choice, the statement 'God chooses the best' reduces to 'God chooses what God chooses'. To avoid this tautology, goodness must be intensional, possessing a value independent of the divine will that God recognises rather than dictates. Leibniz supplies this independent metric through the 'quantity of essence'. For Leibniz, possibility is a claim to existence based on essence; the 'best' world is simply that compossible set of essences which yields the maximum reality.

  This metric is cashed out via the principle of plenitude constrained by the principle of order: maximal variety governed by the simplest laws. This creates an optimization function. However, the invented case of World $\alpha$ and World $\beta$ exposes a tension within this function. $\alpha$ maximises the denominator (simplicity) but minimises the numerator (variety); $\beta$ does the reverse. If the 'best' world is a ratio of variety to simplicity, Leibniz requires a common measure to compare them. He suggests that nature takes the shortest path, implying a calculus where simplicity weights variety. Yet, without a defined exchange rate between ontological richness and nomological parsimony, the ranking remains indeterminate. Leibniz might argue that $\beta$ is impossible because true laws must be universal; a 'list of special cases' is not a law but a description. Thus, $\beta$ might be rejected as metaphysically incoherent, leaving $\alpha$ or a third option as the true maximum.

  This leads to the deeper structural requirement. For a 'maximum' to exist within a set of possible worlds, the ordering of those worlds cannot be merely partial; it must be a total ordering where every world is comparable. Furthermore, the set must possess the least upper bound property. In mathematical terms, if the 'goodness' of worlds maps to real numbers, there must be a supremum that is attainable. If the series of possible worlds is infinite and open-ended (e.g., one can always conceive a world with one more happy monad), there is no maximum, only an asymptote. Leibniz requires the set of compossibles to be finite or bounded in a way that guarantees a peak.

  Can Leibniz defend this property? He relies on the Principle of Sufficient Reason (PSR). If there were no maximum, there would be no sufficient reason for God to choose one world over a slightly better alternative. Thus, the existence of a maximum is a precondition for creation itself. However, this is a defensive assumption rather than a proof. It presupposes that the metaphysical 'space' of possibilities is well-ordered. Modern set theory warns that infinite sets do not necessarily contain maxima. Leibniz assumes a metaphysical continuity that ensures the series of essences terminates in a最优 (optimum). Without a rigorous demonstration that the 'quantity of essence' is a bounded function, the thesis risks collapsing back into vacuity: God chooses the best, therefore a best must exist, therefore God chooses it. To secure the thesis, Leibniz must show that the architecture of possibility itself necessitates a limit, not merely that his theology requires one.

  ***

  ### Marking Scheme

  **Total Marks:** 20
  **Pass Mark:** 10

  **First-Class Moves (Required for 16–20 marks)**
  To achieve a First, the candidate must successfully execute the following five moves:

  1.  **Diagnose the Vacuity (3 marks):** Clearly distinguish between the moral Problem of Evil and the logical charge of tautology. Explain that 'goodness' must be independent of God's will to avoid circularity.
  2.  **Analyse the Trade-off (4 marks):** Engage specifically with World $\alpha$ and World $\beta$. Do not merely describe them, but explain why they present a ranking problem for the 'variety/simplicity' ratio. Suggest a Leibnizian resolution (e.g., rejecting $\beta$'s 'laws' as non-laws).
  3.  **Identify the Formal Property (5 marks):** Explicitly name the logical/mathematical condition required for a maximum to exist (e.g., total ordering, comparability, boundedness, or the least upper bound property). Recognise that without this, 'best' is undefined.
  4.  **Critique the Defence (5 marks):** Evaluate Leibniz's reliance on the Principle of Sufficient Reason. Distinguish between proving the property holds metaphysically versus assuming it to satisfy theological needs.
  5.  **Synthesis (3 marks):** Conclude by linking the formal property back to the vacuity charge. If the property is assumed, does the vacuity return?

  **Differentiation: First vs. 2:1**

  *   **First Class (16–20):** Demonstrates analytical rigour. The candidate treats the 'ordering of worlds' as a structural/logical problem, not just a theological one. They recognise that an infinite series of improving worlds precludes a maximum. The discussion of the invented case is integrated into the argument about metrics.
  *   **Upper Second (2:1) (13–15):** Competent explanation of Leibniz's criteria and the vacuity charge. Will likely address the invented case but may fail to identify the specific *formal property* (e.g., boundedness/ordering) required for a maximum, speaking vaguely about 'balance' instead. Relies more on exposition of Leibniz's views than critical analysis of the logical presuppositions.
  *   **Lower Second (2:2) (10–12):** Descriptive. Focuses heavily on the Problem of Evil despite instructions. Mentions the invented case but does not analyse the ranking difficulty. Fails to address the mathematical/logical nature of the 'maximum'.
  *   **Fail (0–9):** Fundamental misunderstandings of Leibniz. Ignores the invented case. Confuses 'possible worlds' with 'parallel universes' in a modern sense.

  **Specific Errors Costing Marks**

  *   **Drifting into Theodicy (-3 marks):** Spending significant word count justifying evil (soul-making, free will) rather than addressing the logical definition of 'best'.
  *   **Ignoring the Invented Case (-5 marks):** Failing to reference World $\alpha$ or $\beta$ specifically.
  *   **Anachronism (-2 marks):** Criticising Leibniz using modern modal logic (e.g., Kripke) without historical contextualisation.
  *   **Formal Confusion (-4 marks):** Claiming a maximum exists in an infinite set without addressing the need for boundedness or convergence.
