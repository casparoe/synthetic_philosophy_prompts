answer: |-
  The digital clock on the microwave blinked 02:13. The kitchen was the colour of old milk in the low light of the range hood.

  Elias sat at the table, a notebook open in front of him. A pen was capped and uncapped, capped and uncapped, the click sounding like a small bone breaking. Across from him, Simon sat with his arms folded, watching the steam rise from a mug of tea that had gone cold an hour ago.

  "Forty pounds," Elias said. He didn't look up. "It's not the money. It's the shape of it."

  "I told you not to play," Simon said. His voice was low, careful. "Mark's a nice guy, but he's a shark in a jumper."

  "It's not rigged. That's the thing." Elias finally looked up. His eyes were red-rimmed, bright with a kind of feverish exhaustion. "The coin is fair. The payouts are exactly what he said. If it's heads on the first flip, I get two quid. Heads on the second, I lose four. Third, I win sixteen over three. Fourth, I lose sixteen over four. It's precise."

  "And you lost."

  "I lost. But I'm trying to find the edge. I'm trying to find the average." Elias turned the notebook around.

  The page was filled with columns. Neat, trembling handwriting.
  *Flip 1: Win 2. Prob 1/2. Value +1.*
  *Flip 2: Lose 2. Prob 1/4. Value -0.5.*
  *Flip 3: Win 2.66. Prob 1/8. Value +0.33.*
  *Flip 4: Lose 4. Prob 1/16. Value -0.25.*

  "It's the St. Petersburg thing," Simon said, rubbing his face. "The payout grows faster than the odds shrink. The expected value is infinity. You can't pay infinity to play."

  "No," Elias said. He tapped the paper. "That's the classic version. This is the alternating version. The wins and losses cancel each other out. Or they should." He picked up the pen. "Watch."

  He drew a bracket around the first two lines. "One minus a half. That's positive five." He bracketed the next two. "Point three three minus point two five. That's positive." He looked at Simon. "If I group them in pairs, win then loss, every pair is positive. The sum goes to positive infinity. If I play this game forever, I should be a millionaire."

  Simon didn't unfold his arms. "But you're not."

  "Exactly. So I tried it the other way." Elias scratched out the brackets. He drew a new set, starting from the second line. "Loss first. Minus a half, plus a third. Minus a quarter, plus a fifth." He wrote the new total at the bottom of the page. It was a negative number. "If I group them loss then win, the sum goes to negative infinity. I should be bankrupt."

  Elias dropped the pen. It rolled across the laminate. "Same game. Same coin. Same flips. But the average... the average depends on how I count it."

  Simon reached out and touched the corner of the notebook. "It's a trick of the paper, Eli. You can't add up infinity."

  "But every round is finite," Elias insisted, leaning in. The chair creaked. "That's what keeps me up. Every single round ends. The coin hits the table. The money changes hands. It's all real. £40 left my pocket and went into Mark's. It's concrete. But when you step back and look at the 'long run', the long run doesn't exist. It's a ghost."

  "The long run is just a lot of short runs," Simon said.

  "No. A lot of short runs makes a straight line. This..." Elias gestured at the numbers. "This is a fog. If the math doesn't settle, what does? If the expected value is undefined, then the game has no price. It has no truth. It's just noise."

  Simon stood up. The floorboard groaned. He walked to the sink and poured the cold tea down the drain. The water rushed, loud in the silence.

  "You want to know why I didn't play?" Simon asked, drying his hands on a towel.

  "Because you're prudent."

  "Because I don't trust things that don't add up." Simon turned off the tap. The silence rushed back in, heavier than before. "You're looking for a number that tells you if you're a fool or a victim. But there isn't one. The universe isn't promising you a win, and it isn't promising you a loss. It's just promising you that the pattern never closes."

  Elias looked back at the notebook. The numbers seemed to shimmer in the peripheral vision. $+1, -0.5, +0.33, -0.25$. They were shrinking, getting smaller and smaller, but they refused to settle. They were like a horizon that moved as you walked toward it.

  "So what do I do?" Elias asked. "Do I play again? If I group the pairs one way, I have the advantage."

  "Eli," Simon said. He put the towel on the counter. "Close the book."

  "If I play enough times, the law of large numbers has to kick in. The average has to converge."

  "The average *is* the thing that's broken," Simon said. He walked to the door, switching off the range hood light. The kitchen plunged into the grey glow of the streetlamp outside. "You're trying to ask the world a question. But the world isn't answering. It's just flipping the coin."

  Simon left the room. His footsteps faded up the stairs.

  Elias sat in the dim light. He looked at the total at the bottom of the page. He picked up the pen and drew a line through it. He moved the decimal point. He grouped the third term with the first, skipped the second. The total changed again.

  He could make the game a win. He could make the game a loss. He could make the value of his time exactly zero.

  He closed the notebook. The sound was final, a heavy thud on the table. But as he sat there in the quiet kitchen, he had the distinct, chilling sensation that the numbers were still moving inside the cover, shuffling themselves, adding and subtracting in the dark, refusing to be still. The coin was still spinning, somewhere, never landing.
