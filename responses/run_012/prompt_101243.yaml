      *   *Candidate 2: Premise (2).* This is the "Consistency Requirement." This is the most common target for virtue ethicists responding to situationism (e.g., Kamtekar, Snow, Miller). Does stability require *global* consistency across *all* relevant situations, or only *local* consistency within similar contexts?
