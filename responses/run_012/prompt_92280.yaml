answer: |-
  # Q&A Prep Sheet: The Dispersion Thesis & Condorcet

  **Context:** 40-minute paper, small workshop, known audience.
  **Strategy:** Your paper is a *critique* of the standard epistemic defense of democracy/sortition. Your vulnerability is that you are dismantling a tool (CJT) without fully replacing it. You must show that your critique holds even under realistic relaxations of the model, without getting bogged down in technicalities that distract from the normative point.

  ---

  ### The Objections (Ordered by Damage)

  #### 1. The Experimentalist (Correlation & Partisanship)
  **The Objection:** "Your illustration relies entirely on the independence assumption. In real electorates, voters are correlated through media, party cues, and shared information environments. If your 0.45 voters are correlated with each other, or if the 0.9 experts share a signal, the 'dispersion' effect washes out. If you introduce even a small common signal, doesn't the asymptotic logic return, making your finite counter-example a mathematical artifact rather than a political reality?"
  **The Reply:** "You are right that independence is the fragile assumption in CJT. However, the dispersion thesis does not require strict independence; it requires *heterogeneity* in information sources. If the two low-competence voters rely on a different signal than the three experts, the 'drag' on reliability persists. My point isn't that correlation eliminates the effect, but that it makes the *composition* of the correlation structure decisive. Even with exchangeability, if the covariance structure clusters incompetence, expansion reduces reliability. The lesson isn't that CJT is false, but that it is sensitive to the *topology* of information, not just the number of nodes."
  **Soft Spot:** You haven't proven this mathematically for exchangeable variables. You are asserting it based on the independent case. If they press for a proof under correlation, you may have to concede this is a conjecture for future work.

  #### 2. The Bayesian Epistemologist (No Fact of the Matter)
  **The Objection:** "CJT requires a binary state of the world and an objective 'right' answer to define competence ($p > 0.5$). In political theory, there is often no settled fact, only conflicting values or priors. If there is no common prior and no objective truth, 'competence' is undefined. Are you not building a precise engine to drive a car that doesn't exist?"
  **The Reply:** "I grant that for many political questions, truth is elusive. However, the epistemic defense of democracy is often invoked precisely for questions where we *think* there is a better or worse outcome (e.g., climate policy, economic stability). I am engaging the epistemic democrats on their own turf. Even if we treat 'competence' as 'alignment with a correct normative standard' rather than empirical truth, the aggregation logic holds. If the standard is coherent, the dispersion problem remains. I am internal to the epistemic project, challenging its math, not its metaphysics."
  **Soft Spot:** If they argue that *no* political questions are truth-apt, your paper loses its object. You are assuming a realism they deny.

  #### 3. The Deliberative Democrat (Endogeneity of Competence)
  **The Objection:** "You treat competence as a fixed property carried into the voting booth ($p=0.9$ or $p=0.45$). But deliberative theory holds that competence is produced *through* interaction. By adding the 'incompetent' voters, you might change the epistemic environment such that the experts become more reliable, or the novices learn. Your static model assumes away the very mechanism democrats rely on to improve reliability."
  **The Reply:** "This is a crucial distinction between *aggregative* and *deliberative* epistemology. My paper targets the *aggregative* defense of sortition and mass democracy, which often cites CJT directly. If your claim is that deliberation fixes competence, then you cannot use the raw CJT to justify the assembly's size *before* deliberation occurs. You need a different theorem. My critique stands against those who use CJT to say 'more heads are better' prior to talk. If deliberation transforms $p$, then size is secondary to process, which actually supports my conclusion that we shouldn't fetishize expansion."
  **Soft Spot:** You risk alienating the deliberative democrat by boxing them out of CJT. They may argue CJT is meant to model the *post-deliberative* vote.

  #### 4. Social Choice Theorist 2 (Exchangeability)
  **The Objection:** "You distinguish between the limit and the finite case, but modern CJT literature (e.g., Berend & Paroush) already addresses finite $n$. Is your 'dispersion thesis' actually new, or just a restatement of the known sensitivity of finite CJT to variance? Furthermore, if we replace independence with exchangeability, does your 'no substantial bloc' condition still guarantee convergence?"
  **The Reply:** "The existing literature focuses on the *average* competence in the finite case. My contribution is isolating the *distributional shape* as an independent variable. It is not just that variance matters, but that specific configurations (the bloc below chance) can reverse the monotonicity of reliability. Regarding exchangeability: if the exchangeable distribution allows for a sub-population with $p < 0.5$ that is sufficiently correlated, the majority error probability can increase with $n$. I am extending the finite case analysis to distributional topology."
  **Soft Spot:** If they know the Berend & Paroush papers better than you, they might catch you overstating the novelty. Be humble about the math, bold about the interpretation.

  #### 5. Social Choice Theorist 1 (Theorem vs. Illustration)
  **The Objection:** "You present a specific numerical example (3 members @ 0.9, 2 members @ 0.45) and draw a general normative conclusion. Is this a theorem? Can you prove that for any distribution where a bloc is below chance, adding them reduces reliability? Or is this just one corner of the parameter space?"
  **The Reply:** "It is an existence proof, not a universal theorem. I do not claim that adding voters *always* reduces reliability if a bloc is below chance, but that it *can*, and frequently does in realistic distributions. The normative point is that the presumption of 'more is better' is broken. We don't need a universal theorem to defeat a universal presumption; we only need robust counter-examples to shift the burden of proof back to the expansionists."
  **Soft Spot:** Philosophers love general principles. Admitting it's an existence proof makes your normative condition ('no substantial bloc') look less rigorous.

  #### 6. The Measurement Problem (General Audience)
  **The Objection:** "Your proposed condition is that 'no substantial bloc falls below chance.' But competence is latent. We cannot measure $p$ ex ante without already knowing the truth. How is this action-guiding for institutional design? If we can't identify the bloc, your condition is theoretically interesting but practically inert."
  **The Reply:** "I concede we cannot measure $p$ perfectly. However, we often have proxies: education, relevant experience, or even track records in local office. The condition is not meant to be a precise algorithm for sorting voters, but a constraint on *random* selection. It warns against sortition designs that guarantee the inclusion of systematically misinformed blocs (e.g., those reliant on disinformation ecosystems). It shifts the design goal from 'maximize $n$' to 'minimize systematic bias.'"
  **Soft Spot:** This is the hardest practical objection. Proxies for competence are controversial and potentially elitist.

  #### 7. The Normative Alternative (General Audience)
  **The Objection:** "You have successfully undermined the epistemic case for large assemblies. But what is the alternative? If we can't rely on size, and we can't measure competence, are we left with epistocracy? Or do you abandon epistemic justification entirely?"
  **The Reply:** "I am not arguing for epistocracy, but for a more modest epistemic democracy. We should design bodies where the *mechanism* of decision-making compensates for dispersion, such as supermajority rules or bicameralism with different selection methods. The point is to stop using CJT as a blank check for inclusivity. We need institutional friction, not just expansion."
  **Soft Spot:** This moves you out of your lane (CJT critique) into institutional design, where you may have less to say in this specific paper.

  #### 8. The Legal Theorist (Legitimacy vs. Truth)
  **The Objection:** "This whole discussion assumes democracy is about getting the 'right' answer. But democracy is about legitimacy, equality, and collective self-rule. By framing the problem epistemically, you've committed a category error. Why should we care if the 5-member body is less 'right' if it is more 'legitimate'?"
  **The Reply:** "I agree that legitimacy is distinct from truth. However, many defenders of democracy argue it is *both* legitimate and epistemically superior. I am targeting the second claim. If we lose the epistemic advantage, we must rely solely on legitimacy, which is a weaker defense in crises requiring expertise. I am not denying legitimacy; I am pruning the overstated epistemic claims that clutter the theory."
  **Soft Spot:** They may not care. If the workshop is on *epistemic credentials*, you can bracket this, but it limits the reach of your conclusion.

  ---

  ### Strategic Advice

  **1. What to Concede in Opening Remarks:**
  Concede the **Measurement Problem** immediately.
  *Say:* "I want to be clear from the start: I am not proposing we administer competence tests to voters. The 'no substantial bloc' condition is a theoretical constraint on institutional design (like sortition pools), not a voter screening mechanism. I am interested in the structural implications of the theorem, not the operationalization of competence."
  *Why:* This disarms Objection #6 before it is asked and prevents the audience from thinking you are an epistocrat in disguise.

  **2. The Single Reply That Must Land:**
  **Objection #1 (The Experimentalist/Correlation).**
  If the dispersion effect disappears under mild correlation, your 0.9/0.45 example is a toy, and your critique of sortition collapses. You must convince them that *heterogeneity of information* preserves the dispersion risk even if independence is relaxed.
  *Prep:* Have a verbal ready-example of how correlated incompetence works (e.g., "If the two 0.45 voters both listen to the same misleading pundit, they vote as a bloc of 2, effectively weighting their error").

  **3. The Objection to Treat as Fatal:**
  **Objection #2 (The Bayesian/No Truth).**
  If you cannot define what "competence" means in your context, the paper has no subject matter. If they press this hard, you must pivot to "tracking objective interests" or "instrumental outcomes" rather than "truth." Do not get stuck defending moral realism.
  *Strategy:* If they won't grant *any* truth-aptitude, thank them and note that your paper is addressed to *epistemic democrats* who do grant that premise. You are immanent critiquing their position.

  **4. What to Defend Rather Than Hope Nobody Notices:**
  **The definition of "Substantial Bloc."**
  The Social Choice theorists will sniff out vagueness here.
  *Defense:* Define it mathematically in your head before you go. A bloc is "substantial" if their combined voting weight, when correlated, can swing the majority against the higher-competence group. Be ready to say: "Substantial means capable of forming a counter-majority given the correlation structure."

  **5. The Question You Are Hoping Nobody Asks:**
  *"If the Condorcet Jury Theorem is this fragile, why is it still the standard model for epistemic democracy? Is it possible your interpretation of the 'normative content' is simply idiosyncratic?"*
  *Why it hurts:* It challenges your reading of the literature and suggests you are fighting a strawman. It implies the field has already moved past the "asymptotic fetish" you are critiquing.
  *Prep:* Check the recent literature (last 5 years). Ensure you aren't critiquing a view that has already been abandoned. If it has, pivot to: "It persists in the *popular* and *introductory* defenses of sortition, which is where my intervention is aimed."
