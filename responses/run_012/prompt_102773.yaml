  Scope Insensitivity: This psychological phenomenon describes the failure to adjust emotional response proportionally to the scale of a problem. It explains why people might ignore large numbers of small harms. However, it describes a cognitive blind spot, not a reasoned argument. Your subject is explicitly reasoning about quantities and refusing aggregation normatively, not merely failing to perceive the scale.

  The carving
  The phenomenon is a specific form of normative inconsistency where the rule of aggregation is treated as contingent on the desired outcome rather than a fixed principle. It is not merely holding a non-aggregationist view, such as lexical priority, which applies consistently regardless of which side benefits. It is distinct from simple hypocrisy, as it occurs within theoretical reasoning rather than action. The core feature is the *unacknowledged contingency*: the agent asserts that harms do not sum when the sum is inconvenient, then asserts that benefits do sum when that total is convenient, without noting the change in arithmetic rules.

  The edges lie in the agent's awareness and consistency. If the agent admits, "I aggregate only when it feels right," they are expressing a consistent intuitionist view. If they aggregate in both cases, they are consistent utilitarians. If they aggregate in neither, they are consistent non-aggregationists. The phenomenon exists only in the switch. It requires that the agent treats the mathematical additivity of the harm or benefit as morally relevant in one instance and morally inert in the other, solely based on the direction of the utility. It is a procedural contradiction masked as principled distinction.

  Crucially, this pattern functions as a rhetorical shield. It allows the agent to invoke the sanctity of the individual when the collective sum threatens a preferred individual outcome, then invoke the wisdom of the crowd when the collective sum supports a preferred policy. This dual shielding protects the agent from counter-argument, as any attack on their aggregation rule can be deflected by pointing to the case where they used the opposite rule. The boundary is crossed when the justification for non-aggregation, such as imperceptibility, is abandoned in the second case without explicit revision of the principle, revealing the rule is instrumental rather than foundational.

  A term
  I propose the term **Aggregation Opportunism**. This is defined as the tacit adoption of either aggregative or non-aggregative moral frameworks solely to validate a pre-existing preference in a specific instance, without acknowledging the shift in methodology. It differs from consistent non-aggregationism, which rejects summation universally, and from standard motivated reasoning, which does not specify the mathematical mechanism. The term "opportunism" highlights the instrumental use of moral arithmetic as a tool rather than a truth.

  *Boundary Inside:* A debater argues that a million microscopic risks cannot equal one death (non-aggregation), then argues that a million microscopic conveniences justify one person's financial loss (aggregation). The rule changes to suit the verdict.

  *Boundary Outside:* A lexical prioritarian who consistently argues that no number of minor harms can ever outweigh a severe harm, regardless of whether the severe harm is being inflicted or prevented. Here, the rule is stable, even if the conclusion differs from utilitarianism. Another outside case is simple scope neglect, where the agent fails to perceive the sum in both instances due to cognitive limitation rather than normative switching.

  The decisive case
  Scenario: A subject is asked to evaluate two symmetrical hypothetical scenarios where their personal interests are neutralized, but the aggregation rule determines the outcome. In Case A, summing small harms outweighs a large harm; in Case B, summing small benefits outweighs a large cost.

  Scope Insensitivity predicts the subject will reject aggregation in both cases due to cognitive limits. Motivated Reasoning predicts inconsistency only if external bias exists. Aggregation Opportunism predicts the subject will reject aggregation in Case A but accept it in Case B if they harbor a hidden ideological preference for the outcome of Case B, revealing the rule is instrumental rather than cognitive.
