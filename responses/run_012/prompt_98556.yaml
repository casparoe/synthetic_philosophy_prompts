answer: |-
  Here are the desiderata for any theory of the Side-Effect Effect (SEE), structured to adjudicate the five test cases you provided. They are divided into empirical constraints (what the theory must save) and theoretical constraints (how the theory must cohere).

  ### 1. The Asymmetry Constraint
  **Specification:** The theory must predict a statistically significant divergence in intentionality judgments between the "Harm" and "Help" conditions of the standard vignette, without positing a difference in the agent's mental states (belief, desire, or awareness) between the two conditions.
  **Motivating Case:** **Case 1 (Plain Asymmetric Pair).** The executive's attitude ("I don't care") and epistemic state (foreseeing the outcome) are held constant; only the valence changes.
  **Status:** **Non-negotiable.** Any account that cannot reproduce the basic effect is not an account of the SEE.
  **Tension Point:** This requires the theory to allow moral valence to influence a putative *psychological* classification (intentionality) without altering the psychological inputs.

  ### 2. The Norm-Harm Dissociation Constraint
  **Specification:** The theory must explain why intentionality judgments track *moral wrongness* or *norm violation* rather than *concrete harm* or *norm conformity* per se. It must predict that a bad side effect produced by norm-conforming behavior reduces intentionality attributions, and a neutral/bad side effect produced by norm-violating behavior sustains them.
  **Motivating Cases:** **Case 2 (Norm-Conforming Bad Side Effect)** and **Case 3 (Norm Violation, No Harm).** Case 2 tests if "badness" alone suffices or if norm-violation is required. Case 3 tests if harm is necessary or if norm-violation suffices.
  **Status:** **Non-negotiable.** Empirical data (e.g., from Knobe's later variations and Machery's work) suggests the effect persists with norm violations absent tangible harm, and vanishes with bad outcomes that are norm-conforming.
  **Tension Point:** This excludes "Harm-Based" theories (which fail Case 3) and simple "Norm-Conformity" theories (which fail Case 2). It forces the theory to identify *which* norms are relevant (moral vs. conventional).

  ### 3. The Norm-Source Constraint
  **Specification:** The theory must specify whose normative standards drive the judgment: the agent's, the judge's (respondent's), or the community's objective standards. It must predict whether the effect persists when the judge rejects the norm the agent violated.
  **Motivating Case:** **Case 4 (Norm Violation, Respondent Rejects Norm).** If the respondent thinks the norm is immoral, does the agent still act "intentionally" in violating it?
  **Status:** **Non-negotiable.** A theory cannot leave the source of normativity underspecified.
  **Tension Point:** This creates a conflict between *Objective Norm* accounts (which predict the effect survives the respondent's rejection) and *Subjective/Projectivist* accounts (which predict the effect vanishes or reverses). Most existing theories fail to explicitly model this variable.

  ### 4. The Agency Generalization Constraint
  **Specification:** The theory must state whether the mechanism driving the SEE is specific to human mental state attribution or applies to any entity treated as an agent. It must predict whether the asymmetry survives when the "agent" lacks phenomenal consciousness or personal attitudes.
  **Motivating Case:** **Case 5 (Non-Human Agent).** Firms or AI systems do not have "attitudes" in the folk-psychological sense, yet we attribute actions to them.
  **Status:** **House Preference.** *Mentalists* treat this as a boundary condition (the effect should vanish or be metaphorical for non-humans). *Functionalists* treat the effect as evidence that intentionality is role-based (the effect should persist). A theory must pick a side, but the data is currently mixed/contested.
  **Tension Point:** Adhering to this constraint forces a choice between a psychology of *minds* and a psychology of *systems*.

  ### 5. The Semantic Stability Constraint
  **Specification:** The theory must preserve the univocality of the concept "intentional." It must explain how the *extension* of the concept can shift with moral valence (per Case 1) without the *intension* (the definition/competence conditions) changing.
  **Motivating Case:** **All Cases (Theoretical Coherence).** This is not motivated by a single vignette but by the requirement that "intentional" remains a single concept across contexts.
  **Status:** **House Preference (Theoretical).** *Pragmatic* accounts (e.g., bias, performance error) sacrifice this to save the data. *Competence* accounts (e.g., deep structure moralism) sacrifice the traditional definition to save the data. *Classical* accounts sacrifice the data to save this constraint.
  **Tension Point:** This is the locus of the "Competence vs. Performance" debate.

  ***

  ### The Joint Unsatisfiability Claim

  You suspected that the demand for a stable competence account sits badly with the demand to explain judgments that shift with moral valence. This suspicion is well-founded. If we treat **Requirement 1 (Asymmetry)** as demanding that moral valence *constitutively* determines the extension of "intentional" (to avoid calling it a mere bias), we violate **Requirement 5 (Semantic Stability)**. If the conditions for applying "intentional" change based on the moral outcome, the concept is not stable; it is context-sensitive in a way that classical folk-psychology does not support.

  Conversely, if we enforce **Requirement 5**, we are forced to treat the SEE as a performance error (a bias), which many argue fails to capture the robustness and specificity of the effect (violating the spirit of **Requirement 1**). You cannot easily have a concept that is both definitionally stable *and* morally malleable without resorting to complex pragmatic masking that risks unfalsifiability.

  \answer{Semantic Stability; Semantic Stability vs. Moral Modulation of Extension}
