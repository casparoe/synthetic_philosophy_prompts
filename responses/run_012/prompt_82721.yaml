answer: |-
  Here is an audit of your friend's summary from the perspective of democratic theory.

  Your intuition is correct: the last line is doing far too much heavy lifting. Your friend has conflated **popular sovereignty** (a foundational democratic principle) with **populism** (a specific, often anti-liberal political style), and they have conflated **aggregative democracy** (counting votes) with **constructive democracy** (forming a public will).

  Here is the claim-by-claim breakdown, followed by an analysis of your two specific questions, and a final verdict.

  ### Part 1: Claim-by-Claim Audit

  **Claim 1:** *"Populism is the belief that the will of the people should be the highest authority in politics."*
  *   **Verdict:** **Fair but incomplete.**
  *   **Analysis:** This describes *popular sovereignty*, which is accepted by almost all democrats, not just populists. However, political scientists (like Cas Mudde) define populism more narrowly: it is a moralistic ideology that posits society is separated into two homogenous, antagonistic camps: "the pure people" vs. "the corrupt elite."
  *   **The Defender's Rebuttal:** A defender of popular will would say: "Populism isn't just about authority; it's about *moral monopoly*. It claims that only the populist leader truly accesses the people's will, rendering intermediaries (courts, press, parties) illegitimate." Your friend's definition is too broad; it captures Jeffersonian democracy as well as Maduro-style chavismo.

  **Claim 2:** *"There's really no such thing as the will of the people — all you ever have is a bunch of individual opinions."*
  *   **Verdict:** **Philosophically contentious (Methodological Individualism).**
  *   **Analysis:** This assumes the "will" must be an empirical object that exists prior to politics. This is the *aggregative* view (associated with Schumpeter or rational choice theory). However, *deliberative* democrats (like Habermas) argue the will is not found, it is *made* through public reasoning.
  *   **The Defender's Rebuttal:** "The will of the people is not a pre-existing static object to be discovered like a fossil; it is a collective intention formed through interaction. To say it doesn't exist because individuals differ is like saying 'team strategy' doesn't exist because players have different skills."

  **Claim 3:** *"So the will of the people can only mean the majority's opinion."*
  *   **Verdict:** **Wrong.**
  *   **Analysis:** This is the critical leap. In constitutional democracies, "the people" often refers to the sovereign body as a whole, not the numerical majority of the moment. The "will of the people" can be expressed in a Constitution (a long-term commitment) that overrides the majority's opinion on a Tuesday afternoon.
  *   **The Defender's Rebuttal:** "If 51% of the people vote to strip the rights of the 49%, that is the *majority's* opinion, but most democrats would argue it violates the *people's* will to live under equal liberty. The 'people' is a corporate body, not a headcount."

  **Claim 4:** *"Rousseau called that the general will, and he thought it was always right, which is why he's basically the grandfather of populism."*
  *   **Verdict:** **Historical Simplification.**
  *   **Analysis:** Rousseau explicitly distinguished the "Will of All" (sum of private interests/majority opinion) from the "General Will" (the common good). He admitted the Will of All could be wrong. He is claimed by many traditions (deliberative democracy, republicanism, totalitarianism). Pinning modern populism solely on him ignores that populists often reject Rousseau's requirement for citizens to set aside private interest.
  *   **The Defender's Rebuttal:** "Rousseau's General Will requires citizens to deliberate on the common good. Modern populists often mobilize private grievances against elites. Rousseau is the grandfather of *civic republicanism*, not necessarily modern right-wing or left-wing populism."

  **Claim 5:** *"So populism is just majoritarianism dressed up, and every objection people make to populism is really just an objection to majority rule."*
  *   **Verdict:** **False.**
  *   **Analysis:** This is the weakest link. Objections to populism include its *anti-pluralism* (claiming only they represent the people), its *erosion of checks and balances*, and its *tendency to exclude minorities* from the definition of "the people." You can support majority rule (within limits) and still hate populism.
  *   **The Defender's Rebuttal:** "I object to populism not because the people rule, but because populists claim a *monopoly* on representation. If I lose an election, I accept the majority ruled. If a populist loses, they claim the system is rigged because the *true* people are with them. That is distinct from majority rule."

  ---

  ### Part 2: Addressing Your Two Questions

  #### (1) Is the fix just to say the will of the people is whatever people would decide under conditions of full information and equal say?
  **Verdict:** This relocates the problem; it does not solve it.

  This definition moves us from **empirical democracy** (what people *do* want) to **normative democracy** (what people *should* want). This is the strategy of thinkers like Jürgen Habermas or John Rawls.

  *   **The Benefit:** It saves the "will of the people" from being merely the sum of ignorant or prejudiced impulses. It allows you to say, "The mob is angry, but that isn't the *true* will of the people because they are misinformed."
  *   **The Problem:** It creates an epistemic gap. Who decides when conditions are "full information" and "equal"?
      *   If a populist leader says, "I alone understand what you *would* want if you weren't brainwashed by the media," they are using this exact logic to justify authoritarianism.
      *   By making the "will" counterfactual (what they *would* choose), you detach it from actual voting. This makes the concept philosophically robust but politically dangerous, because it allows elites to override actual votes in the name of the "true" will.

  So, no, this doesn't fix the metaphysical problem; it just shifts the battle from "counting votes" to "who controls the conditions of deliberation."

  #### (2) When people say 'the people', do they mean the current electorate, or some bigger trans-temporal thing?
  **Verdict:** This choice determines whether populism is coherent.

  This is known in political theory as the **Boundary Problem**.

  *   **The Current Electorate:** If "the people" means only those alive and voting today, populism makes sense but is unstable. It justifies immediate gratification and disregards long-term consequences (debt, climate change). It allows the current majority to tyrannize the future.
  *   **The Trans-Temporal People:** If "the people" includes the dead (who established the constitution) and the unborn (who will inherit the results), the "will of the people" becomes a slow-moving, conservative force.
      *   **Impact on Populism:** This definition **breaks populism**. Populism relies on immediacy ("Take back control *now*"). If the "will of the people" is a conversation across centuries, a populist leader claiming a mandate from a single election looks absurd.
      *   **Democratic Theory:** Most liberal democrats lean trans-temporal (constitutionalism). Most populists lean presentist (the living majority).

  If you define "the people" trans-temporally, the "will of the people" is not a weapon for radical change, but a brake on it. Populists almost never use this definition because it undermines their claim to immediate revolutionary authority.

  ---

  ### Part 3: The Final Verdict

  Your friend's summary is a classic example of **liberal skepticism**, but it fails as a precise description of political reality. Here is what survives and what dies:

  **What Survives:**
  1.  **The Skepticism:** The friend is right that "the will of the people" is a metaphysical construct, not a physical fact. It is always an interpretation.
  2.  **The Risk:** The friend is right that invoking "the people" often masks a desire for simple majority rule without constraints.

  **What Dies:**
  1.  **The Equation of Populism and Majority Rule:** This is false. Populism is often *minoritarian* (claiming to represent the "real" people against a corrupt majority).
  2.  **The Rousseau Shortcut:** Rousseau's "General Will" is not the same as a poll result.
  3.  **The Dismissal of Objections:** Objections to populism are not just objections to majority rule; they are objections to **anti-pluralism** and **institutional erosion**.

  **The Bottom Line:**
  Your friend thinks the problem is that "the people" don't exist as a single unit. The real problem is that populists claim they *do* exist as a single unit, and that they alone speak for it.

  If you want to defend the "will of the people" without falling into populism, you must argue that the people's will is **fragmented, slow-moving, and institutional**, not **unified, immediate, and embodied in a leader**. Your friend's summary misses this distinction entirely, collapsing all democratic theory into a crude headcount. It is a useful cynicism, but bad theory.
