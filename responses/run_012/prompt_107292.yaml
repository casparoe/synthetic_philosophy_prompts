answer: |-
  Here is the breakdown of what is actually happening with the outside view, using a concrete medical case to anchor the abstraction.

  ### The Case: Dr. Aris and Patient Sarah
  Dr. Aris is reviewing Sarah, a 50-year-old with a specific, aggressive heart defect.
  *   **The Inside View:** Aris looks at Sarah's scans, her fitness, her genetics, and his own surgical skill. He constructs a causal story: "The tumor is localized, she is strong, and I have mastered this technique." He predicts a 90% survival rate.
  *   **The Outside View (Proper):** Aris ignores Sarah's specific fitness and his own feeling of mastery. He looks at a dataset of 500 past patients with this exact defect. The survival rate is 60%.

  ### 1. Why it's a Different *Kind* of Reasoning (Not a Wider Prior)
  When people treat the outside view as a "wider prior," they think they should keep their causal story but add uncertainty around it. They think: "My story says 90%, but since I might be wrong, I'll say 90% ± 20%."

  That is not the outside view. That is just hedging.

  The outside view requires **algorithm substitution**. You are not allowed to use the causal story (fitness, scans, skill) to generate the number. You must generate the number *solely* from the distribution of the reference class. It is not "I believe 90% but I'm unsure." It is "The process I am using to generate 90% has historically produced 60%."

  In Dr. Aris's case, a wider prior says, "Sarah might survive, might not." The outside view says, "People like Sarah usually don't survive, regardless of why I think she will." It swaps the engine of prediction from *mechanism* to *frequency*.

  ### 2. Why Epistemic Modesty is Not the Outside View
  Epistemic modesty is scalar; the outside view is structural.
  *   **Modesty:** "I am 90% sure, but I am a humble doctor, so I will say 80%."
  *   **Outside View:** "I am 90% sure, but doctors predicting this outcome are historically calibrated at 60%."

  Modesty assumes your error is random noise that cancels out if you dial down confidence. The outside view assumes your error is **systematic bias**. Dr. Aris isn't just "noisy"; he is systematically optimistic about his own surgical skill. Dialing his confidence from 90% to 80% doesn't fix a systematic error if the reality is 60%. Modesty treats the belief as a volume knob; the outside view treats the belief as a instrument that needs recalibration against a standard weight.

  ### 3. The Serious Complaint: The Reference Class Problem
  This is the structural flaw in the tool. To take the outside view, you must choose a reference class. But you can construct a reference class for basically anything.

  Dr. Aris can choose:
  *   **Class A:** All patients with heart defects (Survival: 50%).
  *   **Class B:** All patients with *this* defect (Survival: 60%).
  *   **Class C:** All patients with this defect treated by *top surgeons* (Survival: 80%).
  *   **Class D:** All patients with this defect treated by *Dr. Aris* (Survival: 85%).

  The instruction "take the outside view" does not tell Aris which class to pick. If he picks Class C, he looks statistically rigorous but still arrives at a rosy prediction. If he picks Class A, he looks prudent but ignores relevant data. The tool is empty without a rule for selecting the class, and that selection is where the bias hides.

  ### The Reflexivity Problem (Model of Your Model)
  The researcher you spoke to is right: the outside view is a model of your model. It says, "Your internal reasoning process is biased." But this creates a spiral.

  If Aris says, "I know doctors are optimistic, so I will apply an outside view correction," he is using a model of his bias. But how does he know *how much* to correct? He needs an outside view of doctors applying outside views.
  *   "Doctors are optimistic." (Correction: -30%)
  *   "Doctors who know they are optimistic over-correct." (Correction: +10%)
  *   "Doctors who know they over-correct..."

  This spirals infinitely. The only way to stop the spiral is to accept a **terminal reference class**—the best available statistical map you have. But because *choosing* that map is subjective (see Complaint #3), the reflexivity problem collapses into the reference class problem. You aren't spiraling through infinite meta-layers; you are hiding in the choice of the base layer.

  ### Verdict on the Three Complaints
  *   **Complaints (1) and (2) are Confusion.** These are user errors. People *think* the outside view is about widening priors or being humble, but that is just them misunderstanding the tool. It doesn't mean the tool is broken; it means users are lazy.
  *   **Complaint (3) is the Serious One.** This is a flaw in the tool itself. Because the reference class is chosen by the human, the outside view cannot objectively correct bias; it just allows the human to select a statistic that validates their bias. It moves the subjectivity from the story to the dataset.

  Bottom line: The outside view doesn't solve the problem of bias, it just moves the subjectivity from your story to your choice of reference class.
