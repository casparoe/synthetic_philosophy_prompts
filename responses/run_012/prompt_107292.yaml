prompt: |-
  I'm writing a column about how everyone misuses the "outside view" — you know, the planning-fallacy move where you're supposed to stop reasoning about your particular case and look at the base rate for cases like it. Half the time I see it invoked it just means "remember base rates exist," the other half it means "be less sure of yourself," and I dont think either one is actually the concept. So explain the conceptual issue to me properly. I want to get: (1) why the outside view is supposed to be a different *kind* of reasoning and not just a wider prior or a lower credence; (2) why "epistemic modesty" as usually preached — just dial your confidence down — is not the same thing as what the outside view is meant to do, and where they come apart; and (3) the real complaint that you can construct an outside view of basically anything, so "take the outside view" by itself never tells you what to do or how much to move. Here's the part I actually care about, and I think it's the crux: a researcher I spoke to put it as — the outside view is really a model of your *model*, a claim about how your reasoning process is biased, not a claim about the world. If that's right, there's a nasty reflexivity problem, because taking the outside view of your own habit of taking the outside view either can't be done or spirals. Walk me through whats actually going on, with one small concrete case worked all the way through — not the clichéd book-writing example, maybe a doctor sizing up a single patient's prognosis — and tell me which of the three complaints above is the serious one and which two are just confusion. Keep it self-contained; don't cite papers at me, I can't look anything up right now anyway. End with a final line starting "Bottom line:" that gives me the one sentence I could actually put in the column.
