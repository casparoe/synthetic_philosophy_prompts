  9.  **Final Polish:** Ensure the distinction between "Public as Social Formation" and "Sum of Readers" is clear. The sum is empirical; the formation is structural/relational.

  *(Self-Correction on the "Single Requirement" logic)*: If I choose "Ontological/Causal Asymmetry," does it exclude "Ideology"? Ideology can be abstract yet powerful. But Ideology usually implies a *content* or a *ruling class interest*. The Kierkegaardian public is defined by *negativity* (it doesn't stand for anything, it just negates distinction). So the requirement should be about **Negative Power**. The public acts only by negating the concrete. That excludes Ideology (which posits a worldview) and Large Group (which posits a collective agent).

