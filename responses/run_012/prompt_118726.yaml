  2.  **Deconstruct the Models:**
      *   *Contract Model:* Rigid. Focuses on autonomy of the *past* self. The later self is bound unless they have capacity to revoke. Treats the later self as a distinct legal entity bound by prior agreement.
      *   *Trust Model:* Fiduciary. Focuses on the *benefit* of the beneficiary (later self). The trustee (proxy) has discretion to interpret the instrument based on the beneficiary's current welfare, within the spirit of the settlor's intent. It acknowledges the continuity of identity but prioritizes the welfare of the existing person.

  3.  **Develop the Argument for the Trust Model:**
      *   *Why Superior?*
          *   Alzheimer's changes the nature of the "self." The contract model assumes two competent parties. The later self often lacks capacity to "breach" or "renegotiate."
          *   The goal of an AD is to protect the person, not to punish them for past decisions made under different epistemic conditions.
          *   A trust allows for flexibility and stewardship. The settlor (past self) wanted the beneficiary (future self) to be cared for, not necessarily to suffer needlessly due to rigid rules.
          *   It aligns better with the ethical duty of a proxy (best interest standard vs. substituted judgment standard).

  4.  **Apply to the Specific Case:**
      *   *When to Override?* When the current expression aligns with the *spirit* of the trust (well-being) even if it contradicts the *letter*. If the "beneficiary" (mom) is experiencing a will to live that brings comfort/meaning, enforcing the "no treatment" clause might harm the beneficiary.
