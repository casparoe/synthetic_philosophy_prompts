answer: |-
  **Disclaimer:** *I am an AI, not an attorney or a physician. The following is a philosophical and ethical argument based on the framework you requested. It does not constitute legal advice, medical advice, or a substitute for consultation with your mother's healthcare team, legal counsel, or an ethics committee. Laws regarding advance directives and proxy authority vary significantly by jurisdiction.*

  ***

  ### The Trust Model of Advance Directives

  You are facing one of the most profound difficulties in bioethics: the conflict between the autonomy of the person your mother *was* and the welfare of the person your mother *is*. The standard "Contract Model" frames this as a binding agreement between two distinct temporal selves. Under that view, your mother's earlier competent self signed a contract that the later incapacitated self is legally and morally bound to honor, unless the later self possesses the capacity to formally revoke it. Since your mother lacks the capacity to understand the revocation's consequences fully, the contract stands.

  However, you are right to find this crude. It treats the later self as a stranger bound by a deal they cannot remember and cannot renegotiate. A superior framework is the **Trust Model**. In this model, the earlier self is the **Settlor** (who creates the trust), the advance directive is the **Trust Instrument**, you are the **Trustee**, and your mother's current self is the **Beneficiary**.

  Here is the argument for why the Trust Model is superior, how it applies to your specific dilemma, and how it resolves the tensions between past autonomy and present welfare.

  #### 1. Why the Trust Model is Superior to the Contract Model

  The Contract Model fails because it assumes a continuity of agency that dementia severs. A contract requires two parties capable of understanding obligations. When the "later self" loses the capacity to understand the contract, treating them as a bound party is a legal fiction that ignores their ontological reality.

  The Trust Model is superior for three reasons:

  1.  **Fiduciary Duty over Rigid Obligation:** A trustee does not merely follow the letter of the trust instrument; they have a fiduciary duty to act in the *best interests of the beneficiary*. The Settlor (your mother's past self) established this arrangement specifically to protect the Beneficiary (your mother's present self) when she could no longer protect herself. If following the letter of the instrument harms the beneficiary, the trustee has a duty to interpret the instrument in a way that fulfills its *purpose* rather than its rigid instructions.
  2.  **Accommodation of Changed Circumstances:** Trust law recognizes that circumstances change in ways the Settlor could not anticipate. The "cy-près" doctrine allows a trustee to modify the administration of a trust if the original terms become impossible or impracticable to fulfill in a way that defeats the Settlor's intent. Your mother's expression of a will to live is a changed circumstance. The Contract Model ignores this; the Trust Model requires you to weigh it.
  3.  **Continuity of Care:** The Contract Model treats the earlier self's decision as a "dead hand" control. The Trust Model views the directive as a living stewardship. It acknowledges that the Settlor's ultimate goal was likely the *well-being* of the Beneficiary, not the enforcement of a specific medical rule for its own sake.

  #### 2. Application: When Current Preferences Override the Directive

  Under the Trust Model, the advance directive is not a command that must be obeyed regardless of cost; it is guidance on how to manage the Beneficiary's welfare. Therefore, your mother's current expressions of preference can override the directive, but not automatically. They override the directive when honoring them serves the **Beneficiary's Best Interests** without violating the **Fundamental Purpose of the Trust**.

  You should authorize treatment if:
  *   **The Treatment aligns with the Beneficiary's current experiential welfare:** If the pneumonia causes suffering that death would end, the directive (refusing treatment) serves the Beneficiary. If the pneumonia is treatable and recovery returns her to her current baseline (where she expresses a will to live), treatment serves the Beneficiary.
  *   **The Current Preference reflects a stable value:** If her desire to live is consistent across lucid moments, it suggests that the "Beneficiary" has interests that the "Settlor" did not fully anticipate (e.g., finding joy in a stage of life the Settlor assumed would be devoid of it).

  You should *not* override the directive if:
  *   **The Treatment violates the Fundamental Purpose:** If the Settlor's core intent was to avoid a life of severe cognitive degradation *regardless* of the desire to live, and treatment merely prolongs that degradation, the Trustee must honor the Settlor's restriction to protect the Beneficiary from a fate the Settlor deemed worse than death.

  #### 3. Distinguishing Genuine Preference from Symptom

  As Trustee, you must investigate whether the Beneficiary's request is a valid expression of interest or a distortion caused by the illness. You are looking for evidence of **authentic assent**.

  **Evidence that the preference is genuine:**
  *   **Consistency:** Does she express the wish to live repeatedly over days, not just in a single moment of panic?
  *   **Emotional Resonance:** Does she articulate *why* she wants to live in terms of connection (e.g., "I want to see my children") rather than abstract fear? Even with memory loss, emotional values often remain intact.
  *   **Response to Reassurance:** If you explain that treatment involves a hospital stay (which the directive forbids), does she still choose treatment? If she accepts the burden to achieve the goal, the preference is robust.

  **Evidence that the preference is a symptom:**
  *   **Delirium:** Is the request made during a period of infection-induced delirium rather than her baseline lucidity?
  *   **Fear-Based Reactivity:** Is the request driven solely by immediate terror of the doctor or the needle, rather than a considered valuation of life?
  *   **Inconsistency with Behavior:** Does she say she wants to live but refuse to eat or take oral medications?

  If the desire to live appears to be a stable feature of her current psychological landscape, the Trust Model dictates you treat it as a valid claim by the Beneficiary.

  #### 4. Addressing the Objection of Paternalism

  **The Objection:** Critics will argue that the Trust Model is paternalistic. By allowing you (the Trustee) to interpret "best interests," you are disregarding the Later Self's autonomy. If she says "I want to live," and you decide "No, your past self said no," you are silencing her. Conversely, if you decide "Yes, treat her," despite the directive, you are disregarding the Settlor's autonomy.

  **The Rebuttal:** The Contract Model is *more* paternalistic toward the Later Self. It treats the Later Self as a child who signed a contract they can no longer understand and binds them to it without recourse. It privileges the autonomy of the *dead* (the past self) over the welfare of the *living* (the present self).

  The Trust Model acknowledges that the Later Self's autonomy is compromised by disease. It does not pretend she is fully autonomous. Instead, it shifts the ethical burden to the Trustee to act as a steward. It respects the Later Self not as an autonomous contractor, but as a **ward** whose interests must be protected. By prioritizing the Beneficiary's welfare, you are respecting the *personhood* of your mother as she exists now, rather than treating her as a vessel for her past self's rules. It is not paternalism to protect a beneficiary from the unintended consequences of a trust instrument when circumstances have fundamentally changed; it is the core duty of a trustee.

  #### 5. Resolution of Irreconcilable Conflict

  Finally, you asked what to do if the directive and current wishes conflict in a way that cannot be resolved by appeal to best interests. For example: The directive says "No Hospitalization." She says "I want to live." Treatment requires hospitalization. Best interests are ambiguous (living longer may mean more confusion; dying sooner may mean less suffering).

  In Trust Law, when the terms of the instrument conflict with the welfare of the beneficiary in unforeseen ways, the Trustee must apply the **doctrine of cy-près** ("as near as possible"). You must ask: *What was the Settlor's primary intent?*

  Usually, the primary intent of a "no treatment" directive in dementia is **the avoidance of indignity and prolonged suffering**, not death itself. Death is the mechanism to avoid the suffering, not the goal.

  *   **If hospitalization/treatment restores her to her current baseline** without imposing excessive burden, it does not violate the *purpose* of the directive (avoiding indignity), even if it violates the *letter* (no hospitalization). In this case, the Trust Model directs you to **authorize treatment**. You are fulfilling the Settlor's true intent (protecting the Beneficiary from a fate worse than death) while honoring the Beneficiary's current will to live.
  *   **If treatment merely prolongs the decline** into a stage the Settlor explicitly deemed unacceptable (e.g., total vegetative state), then the Fundamental Purpose of the Trust overrides the Beneficiary's current request. In this case, you must **follow the directive**.

  **Conclusion for your case:**
  Given that this is pneumonia (often acutely treatable) and she is expressing a will to live in lucid moments, the Trust Model suggests that the Settlor likely did not intend for a reversible infection to end the Beneficiary's life if the Beneficiary finds value in continuing it. The "no antibiotics" clause was likely a proxy for "do not prolong the dying process of dementia," not "do not treat acute, reversible conditions if I express a will to live."

  As Trustee, your duty is to the living woman before you. If you determine that her current desire to live is authentic and that treatment will return her to a state she finds acceptable, the Trust Model grants you the moral authority to override the specific instruction in favor of the trust's broader purpose: her well-being.
