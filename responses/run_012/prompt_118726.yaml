      *   Purpose of AD: Prevent suffering/indignity.
      *   If treatment causes suffering -> Follow AD.
      *   If treatment grants meaningful time -> Follow Current Wish (as it serves the beneficiary).
      *   *Tie-breaker:* In a true trust, the beneficiary's current welfare usually trumps the settlor's abstract intent if the circumstances have changed fundamentally (which dementia does). The Proxy should lean toward preserving the life of the beneficiary unless the *quality* of that life violates the core intent (dignity).

