answer: |-
  Good evening. Thank you for being here.

  For those who don't know me, I grew up swimming in this lake. I learned to tread water in the deep end while [Mentor's Name] stood on the dock, arms crossed, telling me I wasn't allowed to panic. He gave me my first job scrubbing the boat decks. He taught me that the water doesn't care how strong you are, it only cares how prepared you are.

  He also taught me how to argue.

  Some of you know I'm in graduate school for philosophy. My work focuses on our obligations to people we will never meet—the distant needy. I spend a lot of time thinking about where a dollar does the most good in the world. And if you look at the math, strictly the math, there are places where a donation saves a life much more cheaply than it does here.

  [Mentor's Name] knew exactly what I thought. We argued about it at his kitchen table more than once. I'd talk about the scale of suffering out there. He'd talk about the dock right here.

  I once told him that if we are walking past a pond and see a child drowning, we have a duty to wade in. We don't say, "I'll help the children in my own town instead." We save the child in front of us.

  He listened, and then he said something I haven't been able to shake. He said, "The pond case is about one person rescuing one child. But what makes a rescue possible isn't the moment. It's the dock. It's the lessons. It's the guy who maintains the boat. It's a town that has decided its kids will learn to swim."

  He told me you can't buy a swim school with a rescue. He said that writing a check to the most efficient operation on earth is choosing to be a rescuer, but building this place is choosing to be the kind of community that doesn't need rescuing.

  I've thought about that line for a long time. I still don't know if he was right about everything. I suspect half of that argument was a rationalization to keep the lights on. But I also think the other half was the truest thing anyone ever said to me.

  Because this isn't just about efficiency. It's about fidelity.

  Two years ago, we lost a nine-year-old off the far dock. That was the first drowning here in eleven years. I know there are people in this room who carry that loss every day. I know that for all the lessons and all the patrols, the water remains unpredictable. No amount of money guarantees safety. But the absence of money guarantees risk.

  We are not here tonight because we think we can eliminate every danger. We are here because we refuse to accept indifference as an option.

  [Mentor's Name] didn't run this organization because it was the most statistically impactful way to save lives globally. He ran it because these are our kids. This is our water. When we fund this swim school, we aren't just buying life jackets or paying for chlorine. We are renewing a promise. We are saying to every child in this town that when they come to this lake, they are seen, they are valued, and they are worth the cost of keeping them safe.

  That is a specific kind of good. It doesn't show up on a spreadsheet of global utility. But it shows up in the confidence of a fourteen-year-old who can watch their younger siblings without fear. It shows up in the quiet relief of a parent who knows the dock is monitored. It shows up in the fact that for eleven years, until that terrible summer, not one child died here.

  I cannot stand here and tell you that this is the only place your money could do good. But I can tell you that this is the place where your money keeps a promise that was made to this town.

  [Mentor's Name] is gone. But the dock is still here. The boats are still here. The need is still here.

  So, when the basket comes around, I'm not asking you to give because this is the most efficient charity on earth. I'm asking you to give because this is our town. I'm asking you to give so that when the next generation stands at the edge of the water, they know someone is watching.

  Please, give generously. Let's keep being the kind of place that doesn't need rescuing.

  Thank you.
