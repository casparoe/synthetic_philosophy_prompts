      *   *Solution:* Pivot from "maximizing lives saved" to "maintaining a community covenant." The argument isn't that this is the *only* place to give, but that it is *this* place's responsibility to care for its own water. The speaker can endorse giving here as an act of *local fidelity*, even if global utilitarianism suggests otherwise. This satisfies the philosophers (it's a nuanced ethical position) and the locals (it validates their specific care).
