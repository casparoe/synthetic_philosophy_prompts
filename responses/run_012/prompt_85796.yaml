answer: |-
  # The History Textbook Decision Tree

  This tree maps the logical space of textbook debates. It does not start with political labels (like "patriotic" or "critical"). Instead, it starts with the purpose of the class. Follow the path that matches your view to find your position's name and its costs.

  ### **Node 1: The Root (Purpose)**
  **Question:** *What is the primary job of this history course?*
  *   **A. Civic Formation:** To give students a shared story that holds the nation together.
  *   **B. Disciplinary Training:** To teach students how historians verify evidence and argue about the past.

  ---

  ### **Path A: Civic Formation (The Shared Story)**

  #### **Node 2A: Story Tone**
  **Question:** *Should the national story highlight our continuity and greatness, or our moral debts and breaks?*
  *   **A1. Achievement:** Focus on success, stability, and progress.
  *   **A2. Reckoning:** Focus on injustice, correction, and unresolved sin.

  #### **Node 3A: Voice**
  **Question:** *Who should sound like they are speaking to the student?*
  *   **A3. "We the Nation":** The text uses "us/our" to include the student in the story.
  *   **A4. "The Discipline":** The text uses "the state/the founders/they" as objects of study, even if the goal is civic.

  #### **Node 4A: Obligation to the Dead**
  **Question:** *Do we owe victims and ancestors a specific depiction even if it confuses or upsets living students?*
  *   **A5. Yes:** Truth or dignity for the dead is a duty, regardless of educational utility.
  *   **A6. No:** The dead are depicted only insofar as it benefits the moral formation of the living.

  ---

  ### **Path B: Disciplinary Training (The Historian's Craft)**

  #### **Node 2B: Handling Disagreement**
  **Question:** *When historians disagree on causes or facts, what should the book do?*
  *   **B1. Report Consensus:** Teach the current majority view as the working truth.
  *   **B2. Display Disagreement:** Show the live debate, the evidence, and the uncertainty.

  #### **Node 3B: Voice**
  **Question:** *Who should sound like they are speaking to the student?*
  *   **B3. "The Discipline":** The text speaks as the profession ("Historians argue...").
  *   **B4. "We the Nation":** The text speaks as a community of inquirers ("We must question...").

  #### **Node 4B: Obligation to the Dead**
  **Question:** *Do we owe victims and ancestors a specific depiction even if it hinders skill acquisition?*
  *   **B5. Yes:** Ethical duties to the dead constrain how we use evidence in class.
  *   **B6. No:** The pedagogical goal (learning to think) overrides duties to the dead.

  ---

  ### **The Leaves (Positions)**

  Below are the resulting positions. Note which cases (US Founding/Slavery vs. Perpetrator Atrocity) fit each.

  #### **1. The Heroic Myth**
  *   **Path:** Civic + Achievement + "We" + No Obligation to Dead.
  *   **Description:** The book tells a stirring story of national progress, minimizing ugliness to build pride.
  *   **Awkward Commitment:** You must admit you are omitting painful truths to keep the story clean.
  *   **Case Fit:** **US Founding:** Common. **Perpetrator Atrocity:** Undefended (Morally monstrous to treat genocide as "achievement").
  *   **Status:** **Defended** (in Case 1 only).

  #### **2. Pious Nationalism**
  *   **Path:** Civic + Achievement + "We" + Yes Obligation to Dead.
  *   **Description:** The book claims the nation is great *because* it honors the dead truthfully.
  *   **Awkward Commitment:** You must explain why honoring the dead doesn't require admitting national sin.
  *   **Case Fit:** **US Founding:** Possible (e.g., "We honor founders by acknowledging flaws but celebrating liberty"). **Perpetrator Atrocity:** Incoherent (Cannot honor victims of your own nation while claiming achievement).
  *   **Status:** **Strained** (Incoherent in Case 2).

  #### **3. The Redemptive Covenant**
  *   **Path:** Civic + Reckoning + "We" + Yes Obligation to Dead.
  *   **Description:** The nation is defined by its promise to fix past sins; "We" are responsible for "Our" history.
  *   **Awkward Commitment:** You must treat current students as morally responsible for acts they did not commit.
  *   **Case Fit:** **US Founding:** Common (1619 Project adjacent). **Perpetrator Atrocity:** Common (German/Japanese post-war education).
  *   **Status:** **Defended**.

  #### **4. State Penitence**
  *   **Path:** Civic + Reckoning + "The Discipline" + No Obligation to Dead.
  *   **Description:** The state teaches a story of guilt using expert language, but only because it helps social stability now.
  *   **Awkward Commitment:** You admit the apology is instrumental (for order) rather than sincere (for the dead).
  *   **Case Fit:** **US Founding:** Rare. **Perpetrator Atrocity:** Possible (State uses history to prevent militarism).
  *   **Status:** **Cynical but Defended**.

  #### **5. Textbook Truth**
  *   **Path:** Disciplinary + Consensus + "The Discipline" + No Obligation to Dead.
  *   **Description:** The book reports what most historians agree on, ignoring fringe debates to maximize clarity.
  *   **Awkward Commitment:** You must suppress new or minority evidence that might be true but isn't "consensus" yet.
  *   **Case Fit:** **Both Cases:** Standard traditional textbook approach.
  *   **Status:** **Defended**.

  #### **6. The Junior Historian**
  *   **Path:** Disciplinary + Disagreement + "The Discipline" + No Obligation to Dead.
  *   **Description:** The book presents primary sources and conflicting arguments, asking students to decide.
  *   **Awkward Commitment:** You risk students concluding there is "no truth" or that denialist arguments are valid "perspectives."
  *   **Case Fit:** **Both Cases:** Ideal for AP/IB, risky for younger grades.
  *   **Status:** **Defended**.

  #### **7. Memory Work**
  *   **Path:** Disciplinary + Disagreement + "We" + Yes Obligation to Dead.
  *   **Description:** We learn to debate evidence *in order to* honor the victims properly; method serves memory.
  *   **Awkward Commitment:** You must limit historical inquiry if it leads to conclusions that feel disrespectful to victims.
  *   **Case Fit:** **US Founding:** Emerging. **Perpetrator Atrocity:** Common (e.g., "We question evidence, but not the fact of the Holocaust/Nanking").
  *   **Status:** **Defended**.

  #### **8. The Moral Instrument**
  *   **Path:** Civic + Reckoning + "We" + No Obligation to Dead.
  *   **Description:** We tell a story of guilt to make students better citizens, even if the historical nuance is simplified.
  *   **Awkward Commitment:** You admit you are using history as propaganda for virtue, not truth for the dead.
  *   **Case Fit:** **Both Cases:** Common in practice, rarely admitted.
  *   **Status:** **Undefended Publicly** (Attractive to administrators, unattractive to admit).

  ---

  ### **Flags and Limitations**

  **Undefended Leaves (Incoherent or Unattractive):**
  *   **Civic + Achievement + "The Discipline" + Yes Obligation:** *The Expert Patriot.* (Incoherent: If experts demand truth, and truth is ugly, you cannot claim Achievement).
  *   **Disciplinary + Consensus + "We" + Yes Obligation:** *The Dogmatic Inquirer.* (Incoherent: "We" implies ownership, "Consensus" implies authority, "Obligation" limits inquiry. It confuses who is in charge).
  *   **Any Path + No Obligation to Dead (Case 2 Only):** In the context of **Perpetrator Atrocity**, a position that explicitly says "We owe the dead nothing" is politically and morally undefendable. It may exist logically, but no committee member will stand on it.

  **Positions the Tree Cannot Separate:**
  *   **Redemptive Covenant (Civic/Reckoning) vs. Memory Work (Disciplinary/Disagreement):** In practice, both result in textbooks that highlight atrocities and ask students to engage with them. The *intent* differs (building identity vs. building skills), but the *syllabus* may look identical.
  *   **Textbook Truth (Disciplinary/Consensus) vs. Heroic Myth (Civic/Achievement):** If the "Consensus" happens to be flattering to the nation, these two leaves look the same. You cannot tell them apart unless the consensus shifts to something ugly.

  **Case Specificity:**
  *   **Achievement** branches are logically available for **US Founding** (Case 1) but effectively closed for **Perpetrator Atrocity** (Case 2). A Japanese textbook claiming "Achievement" regarding the 1930s is not just controversial; it is logically incompatible with the "Atrocity" premise of the case.
  *   **"We the Nation" Voice** is harder to sustain in **Case 2** (Perpetrator descendants) than **Case 1**. It is harder to say "We did this" (Japan) than "We built this" (US), though both are possible.

  ### **How to Use This in Committee**
  When a member argues, "We need to teach the truth," ask: *"Is that Node 2B (Consensus vs. Disagreement) or Node 4 (Obligation to the Dead)?"*
  When a member says, "We need to build pride," ask: *"Is that Node 1A (Civic) or Node 2A (Achievement)?"*
  This stops you from arguing about "wokeness" and starts you arguing about whether the book's job is to form citizens or train historians.
