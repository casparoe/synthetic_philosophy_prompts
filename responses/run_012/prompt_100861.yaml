  Here is the correspondence of the fortress analogy mapped onto Lakatos's Methodology of Scientific Research Programmes (MSRP):

  *   **The Keep:** The **Hard Core**. These are the fundamental assumptions (e.g., Newton's laws of motion) that are protected by methodological decision and never surrendered.
  *   **The Walls and Outworks:** The **Protective Belt**. These are the auxiliary hypotheses, initial conditions, and observational theories that absorb the shock of anomalies. They can be repaired, replaced, or knocked down to save the Keep.
  *   **The Besiegers:** **Anomalies and Competing Programmes**. Empirical counter-evidence and rival theories that threaten the integrity of the programme.
  *   **Sorties / Taking Ground:** **Progressive Problem Shifts**. When the programme predicts novel facts successfully, expanding its empirical content.
  *   **Patching the Walls:** **Degenerating Problem Shifts**. When the programme only offers ad hoc adjustments to accommodate known facts without new predictions.
  *   **The Garrison:** The **Community of Scientists**. The proponents working within the heuristic of the programme.

  **Where the Picture Breaks Down**
  The fortress analogy fails as a picture of how science *actually* works in several key respects. First, boundaries in science are porous; scientists often drift between programmes or merge them, unlike soldiers confined to a single keep. Second, nature is not an active besieger; anomalies are passive until interpreted, and often a "breach" in one wall (an anomaly) is ignored if the Keep is valuable enough. Third, and most critically, the analogy suggests a self-contained logical unit. In reality, research programmes are embedded in a social ecosystem.

  **The Supply Lines Dispute**
  Your seminar mate is descriptively correct but philosophically incorrect regarding Lakatos's intent. In the history of science, funding, journals, and recruitment (supply lines) absolutely determine survival; a logically progressive programme can "starve" if it loses institutional support. However, your tutor is right that importing this into the *definition* of the programme wrecks Lakatos's specific project. Lakatos distinguishes between **internal history** (the logical reconstruction of rational theory choice) and **external history** (sociological factors explaining deviations from rationality).

  If you add supply lines to the fortress structure, you concede that theory choice is driven by social logistics as much as logical progress. This undermines the specific conclusion the picture was built to support: that switching is **rational rather than mob psychology**. If survival depends on supply lines, then switching might be a result of social pressure (mob psychology) rather than logical superiority. Lakatos's model requires bracketing out the sociology to isolate the rationality.

  **Survival of the Conclusion**
  Does the conclusion survive once the disanalogies are on the table? The normative claim (that we *can* distinguish progressive from degenerating programmes logically) survives, but the descriptive claim (that scientists *actually* switch based on this distinction) is weakened. The fortress picture supports the idea of rational reconstruction only if it remains a model of logical structure, not social reality. Adding supply lines makes the picture more realistic but destroys its ability to prove that science is a rational enterprise distinct from social pressure. Therefore, the picture carries the conclusion only if we accept the Tutor's constraint: the supply lines must remain external to the fortress.

  Verdict: as-is
