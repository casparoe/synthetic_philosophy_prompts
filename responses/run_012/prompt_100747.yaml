answer: |-
  Here is a teaching plan designed for a 75-minute session. It prioritizes structural dependencies to ensure the philosophical problem emerges from the students' own intuitions rather than being imposed as a doctrine.

  ### 1. The Order: Dependencies and Sequence

  The central risk is introducing the **Exclusion Worry** (the idea that micro-causation excludes macro-causation) before the students have felt the **Explanatory Necessity** of the macro-level. If you introduce exclusion first, they will default to physicalism immediately and the session ends.

  **The Sequence:**
  1.  **Concrete Intuition (The Example):** Establish that two descriptions exist and track different things.
  2.  **Explanatory Utility:** Establish that the macro-description does work the micro-description cannot (counterfactuals).
  3.  **The Careenium Mapping:** Translate the example into Hofstadter's terms (simmballs/symmballs).
  4.  **The Exclusion Worry:** Introduce the conflict *only after* they value the macro-level.
  5.  **The Deflationary Challenge:** Voice the friend's position here.
  6.  **Reframing:** Move from "competition" to "realization."

  **Where the Exclusion Worry Belongs:**
  It belongs in **Phase 3 (Minute 40)**.
  *   **Why:** If you introduce it earlier (Phase 1), it acts as a conversation-stopper ("Physics is complete, so nothing else matters"). If you introduce it later (Phase 5), there is no time to resolve it.
  *   **How to make them feel it:** Do not state it as a premise. Ask them to reconcile the two previous phases. "You just said the glider explains the crash. You also said only cells change state. How can both be true without the glider being a ghost?"

  **Dependency Warning:**
  *   **Do not** define "levels of description" abstractly before showing the example. If you start with "There are micro and macro levels," they will treat it as a taxonomy lesson.
  *   **Do not** introduce the Careenium before the Example. The Careenium is the *target*, not the *scaffold*. Use the example to build the scaffold, then hang the Careenium on it.

  ---

  ### 2. The Carrying Example

  **Verdict:** Use the **Glider in Conway's Game of Life (GOL)**.
  Your worry is that it is "too clean." This is actually its strength for a 75-minute session. Starlings are too messy for a whiteboard; Temperature is too passive (it doesn't "shove"); Price is too normative.

  **How to "Dirty Up" the Glider:**
  To prevent the conclusion that the macro-level is "just a compressed summary," you must emphasize **Counterfactual Robustness**.
  *   **The Setup:** Draw a glider. Show it moving.
  *   **The Perturbation:** Ask: "If I flip one cell in the tail of the glider at time *t*, does the glider die?" (Usually yes). "If I flip one cell in the empty space *ahead* of it?" (No).
  *   **The Crucial Move:** Ask: "If I replace this specific 5-cell pattern with a *different* 5-cell pattern that functions as a glider in a different rule-set, does the trajectory remain?"
  *   **The Point:** The *specific* cells don't matter; the *pattern* matters. The micro-story is fragile (change one cell, story breaks); the macro-story is robust (change the cells, keep the pattern, story holds).

  **Placement:**
  **Minute 0.** Start immediately with the grid on the whiteboard. Do not preamble with "levels of description." Let the levels emerge from the necessity of describing the glider.

  ---

  ### 3. The Misconception Map

  Here is the trajectory of errors, when they will surface, and how to head them off.

  | Misconception | When it Surfaces | How to Head It Off |
  | :--- | :--- | :--- |
  | **(d) "It's just a description."** (Instrumentalism) | **Minute 15.** As soon as you claim the glider "causes" something. | **Intervention:** Ask: "If it's *just* a description, why does it allow predictions the cell-story doesn't? Descriptions don't have leverage; patterns do." |
  | **(a) "Downward Force."** (Dualism) | **Minute 45.** When trying to save macro-causation. Students will imagine the glider reaching down to push cells. | **Intervention:** Draw an arrow from Glider to Cells, then cross it out. Say: "The glider doesn't push the cells. The glider *is* the cells. Don't look for a force; look for an organization." |
  | **(c) "Micro is complete, so Macro is redundant."** (Exclusion) | **Minute 50.** The peak of the argument. | **Intervention:** This is the core tension. Do not head it off yet. Let it sting. Then reframe: "Redundant for *prediction*? Maybe. Redundant for *explanation*? No. We are talking about causation in explanation, not just physics." |
  | **(e) "Competing Causes."** | **Minute 55.** If they think both levels fight for the same causal slot. | **Intervention:** Use the "Software/Hardware" analogy. "Did the bug crash the computer or the electron? Both. They aren't competitors; they are the same event described at different granularities." |
  | **(b) "Reducible = Froth."** | **Throughout.** | **Intervention:** Remind them: "A wave is reducible to water molecules. Does that mean the wave didn't drown the swimmer?" |

  **Your Suspicion:** You are correct that **(c)** and **(d)** do the real damage.
  *   **(d)** arrives early as a defense mechanism against metaphysics. Head it off by focusing on *counterfactuals*.
  *   **(c)** arrives late as a philosophical hammer. Meet it by distinguishing *ontological reduction* (what exists) from *explanatory autonomy* (what matters).

  ---

  ### 4. The Check

  **The Question (Minute 65):**
  > "Imagine a universe where the simmballs (cells) behave exactly as they did in our example, but the symmballs (gliders) do not exist as distinct entities. Is that universe physically possible? If yes, what did we lose? If no, why not?"

  **What a Wrong Answer Looks Like:**
  *   **"Yes, it's possible, we just lose the ability to talk about it easily."**
      *   *Indication:* They still hold Misconception (d). They view the macro-level as merely linguistic, not structural. They haven't grasped that the pattern *is* a physical constraint on the micro-state.
  *   **"No, it's impossible, because the gliders push the cells."**
      *   *Indication:* They hold Misconception (a). They have reified the symbol into a ghostly force.
  *   **"Yes, it's possible, and we lose nothing because the cells did all the work."**
      *   *Indication:* They have accepted the Friend's Deflationary View without critique. They missed the point about counterfactual robustness.

  **What the Right Answer Looks Like:**
  *   "It's impossible because the symmballs *are* the simmballs arranged thusly. But if you mean 'could the simmballs behave that way without us recognizing the pattern?', then yes, but the *causal story* about why they behaved that way would be inaccessible." (Nuanced distinction between ontology and epistemology).

  ---

  ### 5. What to Leave Out (Said Aloud)

  You must explicitly bracket the "Big Questions" or the session will dissolve into free-will debates. Do not hide this; make it a pedagogical move.

  **Script for Minute 10:**
  > "I want to flag three elephants in the room: **Consciousness, Free Will, and the Self.** Hofstadter cares about the Careenium because he thinks *you* are a symmball. We are not going to solve that today. If we try to tackle whether *you* have free will while we are still arguing about whether a glider moves, we will fail at both. We are building the engine first. We park the car for now."

  **Script for Minute 70:**
  > "We are stopping before we apply this to mental causation. The literature on mental causation assumes you have this distinction clear. If you leave here thinking macro-causation is magic, you will read that literature wrongly. If you leave here thinking it's impossible, you will also read it wrongly. Our job today was just to sharpen the lens."

  ---

  ### 6. The Friend's Position: A Fair Hearing

  The deflationary view ("It's just balls hitting balls") is the strongest philosophical opponent. It should not be a strawman; it is a live option (Instrumentalism/Eliminativism).

  **Timing:** **Minute 45.**
  This is after they have seen the utility of the macro-level (Phase 2) but before they have resolved the exclusion worry (Phase 4).

  **Who Voices It:** **You (The Instructor).**
  Do not prime a student. It is too risky; if the student does it poorly, it becomes a strawman. If they do it too well, you lose control of the clock. You must embody the friend's voice with charity and precision.

  **How to Voice It:**
  > "I want to pause and voice the strongest objection to what we're doing. My friend argues this: 'You are mesmerized by patterns. But look at the table. Only the balls exist. Only the balls touch. To say the "cluster" pushed the ball is like saying "the average family has 2.5 children" and then asking where the half-child is sleeping. It is a useful fiction for prediction, but ontologically, it is froth.'
  >
  > "Take two minutes. Discuss with your neighbor: Is my friend right? Is the symmball story *true*, or is it just *useful*?"

  **Why this works:**
  It forces the group to confront the **Realism vs. Instrumentalism** debate directly. It validates the physicalist intuition (which is strong in engineers and cogsci students) without letting it dominate the whole hour. It sets up the final resolution not as "Physicalism is wrong," but as "Physicalism is incomplete as an explanatory framework."

  ### Summary Timeline

  *   **00-20:** **GOL Example.** Draw grid. Show glider. Establish Micro (cells) vs. Macro (glider).
  *   **20-40:** **Utility & Careenium.** Map GOL to Careenium. Show macro-counterfactuals (robustness).
  *   **40-45:** **The Tension.** "How can both be true?"
  *   **45-55:** **The Friend's Challenge.** Deflationary argument. Group discussion.
  *   **55-65:** **Reframing.** Realization, not competition. (Software/Hardware analogy).
  *   **65-70:** **The Check.** The "Impossible Universe" question.
  *   **70-75:** **Parking Lot.** Explicitly bracket Self/Free Will. Wrap up.
