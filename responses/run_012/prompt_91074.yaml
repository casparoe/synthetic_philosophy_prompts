  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher of art and history (specializing in ethics of representing the dead).
      *   **Task:** Audit the friend's analogy ("Biopic is a portrait, not a photograph").
      *   **Specific Steps:**
          1.  Brainstorm the nature of a portrait (ontologically and ethically).
          2.  Create a correspondence table mapping portrait elements to biopic elements.
          3.  Analyze where the mapping holds and where it snaps (focusing on specific asymmetries: consent, events vs. character, truth-claims).
          4.  Evaluate whether the conclusion (inventing is licensed) survives the disanalogies.
          5.  Propose a better analogy if necessary.
          6.  Provide a straight verdict.
      *   **Tone:** Rigorous, philosophical, analytical, not dismissive but critical.
      *   **Format:** Headers, table, clear verdict.

  2.  **Brainstorming: The Nature of a Portrait:**
      *   *What is it?* A representation of a specific individual, usually visual.
      *   *Intent:* To capture likeness, but also "essence," status, character, or the artist's interpretation.
      *   *Relationship:* Often involves a contract (commissioned) or at least a sitting (consent/cooperation).
      *   *Truth Claim:* "This looks like them" (verisimilitude) + "This is who they were" (character).
      *   *Audience:* Contemporaries (who know the sitter) or posterity (who rely on the image).
      *   *Ethics:* Libel, dignity, legacy. The sitter can object *during* the process.
      *   *Medium:* Paint, pigment, canvas (static, single moment or composite).

  3.  **Drafting the Correspondence Table:**
      *   *Sitter* -> The Historical Subject (the scientist).
      *   *Face/Physical Likeness* -> The Recorded Historical Facts (dates, locations, known interactions).
      *   *Portraitist* -> The Screenwriter/Director.
      *   *Pigment/Brushstrokes* -> Dialogue, Scenes, Dramatic Structure, Invented Subplots.
      *   *"Truth of the Sitter" (Essence)* -> The Thematic Truth/Emotional Arc of the Life.
      *   *Gallery Wall* -> The Cinema/Streaming Platform (Public Reception).
      *   *Viewer* -> The Audience (contemporary and future).
      *   *Commission/Contract* -> Historical Record/Public Trust (Implicit).
      *   *Sitter's Approval* -> Historical Consensus/Family Blessing (Often absent).

  4.  **Analyzing the Mapping (Hold vs. Snap):**
      *   *Hold:* Both aim for more than mere replication. Both involve selection and emphasis. Both claim to reveal something deeper than surface data.
      *   *Snap 1: Consent/Agency.* A sitter can say "Make my nose smaller" or "Burn that." The dead scientist cannot object to the betrayal subplot. The descendants are proxies, but weak ones.
      *   *Snap 2: Event vs. Character.* A portrait captures a *state of being* (mostly). A biopic captures *actions*. Inventing a betrayal changes the moral record, not just the vibe. "He looked sad" vs. "He stole this idea."
      *   *Snap 3: Truth Claims.* A portrait says "This is how he appeared/felt." A biopic says "This happened." Propositional truth (facts) vs. Aesthetic truth (feeling).
      *   *Snap 4: The "Truth of the Sitter".* In art, this is subjective. In history, "He did X" is objective. If historians disagree, there's ambiguity, but inventing a specific event closes that ambiguity falsely.

  5.  **Evaluating the Conclusion (Does "Inventing is Licensed" survive?):**
      *   The analogy works for *interpretation* (lighting, focus, tone).
      *   It fails for *fabrication of events* (betrayal, reconciliation).
      *   Why? Because a portrait doesn't usually paint a gun in the sitter's hand if they never held one, even if it fits their "essence."
      *   The friend is conflating *interpretive emphasis* with *narrative fabrication*.
      *   Verdict: The analogy is seductive but ethically insufficient for *plot inventions* that alter moral responsibility.

  6.  **Finding a Better Analogy:**
      *   *Portrait of someone who can't sit?* (User's idea). Still implies a static image.
      *   *Restoration?* No.
      *   *Translation?* Closer. You translate meaning, but you can't add new sentences.
      *   *Historical Novel?* Acknowledges fiction.
      *   *Better Analogy:* **A Eulogy vs. A Biography.** Or **A Memorial Statue.**
      *   *Best Analogy:* **A Historical Map vs. A Tourist Map.** A tourist map highlights landmarks (truth) but might exaggerate sizes for clarity. But if it adds a road that doesn't exist, you get lost.
      *   *Actually, the strongest philosophical counter-analogy:* **The Witness Testimony.** A screenwriter is a witness who wasn't there. If they lie about what happened to make the story "truer," they commit perjury, not art.
      *   *Let's go with:* **The Historical Novel vs. The Documentary Contract.** The biopic trades on the *claim* of non-fiction.
      *   *Refined Better Analogy:* **A Restoration of a Fresco.** You fill in the gaps (inpainting) to make it coherent, but you must use distinguishable pigment so future viewers know what was original and what was inferred. The screenwriter didn't use distinguishable pigment.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the role, set the stage (the seductiveness of the analogy).
      *   **Section 1: Ontology of the Portrait:** Brief brainstorming as requested.
      *   **Section 2: The Correspondence Table:** Clear mapping.
      *   **Section 3: Where the Mapping Holds:** The aesthetic arguments.
      *   **Section 4: Where the Mapping Snaps:** The ethical/historical asymmetries (Consent, Event vs. Character, Propositional Truth).
      *   **Section 5: The Verdict on the Conclusion:** Does the license to invent survive? (No, not for events).
      *   **Section 6: A Better Analogy:** The "Inpainting" or "Translation" analogy.
      *   **Final Verdict:** Direct answer.

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I address the "historians disagree" point? *Action:* Ensure I mention that ambiguity doesn't license fabrication; it licenses interpretation of existing evidence.
      *   *Check:* Did I address the "moral evaluation" point? *Action:* Emphasize that inventing a betrayal changes the moral ledger, which a portrait doesn't do (a portrait doesn't usually accuse the sitter of a crime they didn't commit to show their 'tortured soul').
      *   *Tone Check:* Keep it philosophical but accessible. Avoid overly dense jargon.
