  9.  **Final Polish:** Check headers, ensure the table is clean, make sure the verdict is punchy. (Proceed to generate output based on these thoughts).

  *(Self-Correction on the "Better Analogy"):* The user suggested "portrait of someone who can't sit." I should evaluate that. It's actually *worse* because it implies the artist has *more* license, whereas the ethical burden is *higher* when the subject can't defend themselves. I will propose **The Forensic Reconstruction** or **The Critical Edition**. Let's go with **The Critical Edition of a Text**. You fill gaps, but you mark them. Or **The Historical Map**. Let's stick with **The Restoration/Inpainting** analogy because it deals with "filling gaps" which is exactly what she's doing, but highlights the ethical requirement of distinguishability.

