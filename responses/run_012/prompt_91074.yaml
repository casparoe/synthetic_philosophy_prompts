prompt: |-
  My friend is a screenwriter and she's just finished a biopic about a well known 19th century scientist — I won't say who, it doesn't matter — and the subject's descendants are furious because she invented a whole subplot: a rivalry, a betrayal, a deathbed reconciliation that never happened. Her defence, which she's now given in like three interviews, is basically this: "a biopic is a portrait, not a photograph. A portrait isn't trying to record the face, it's trying to get at the truth of the sitter, and sometimes you have to invent in order to do that." I've been argueing with her about it and I keep losing, so I want a proper audit of the analogy rather than my half-remembered intuitions.

  Act as a philosopher of art and of history — someone who actually works on the ethics of representing the dead — and think this through carefully. Before you map anything, brainstorm for yourself what a portrait really is and what it does: who makes it, who it's for, what kind of thing it asserts, how it relates to its sitter. Then:

  Give me the correspondence table. What plays the role of the sitter, the face, the portraitist, the pigment, the "truth of the sitter", the gallery wall, the viewer? Be explicit about each pairing and don't skip the ones that are awkward.

  Then say where the mapping holds and where it snaps. I especially want you to think about the things the portrait analogy quietly imports that a biopic doesn't have. A portrait's sitter can sit for it, can reject a bad likeness, can say "that's not me" — the historical dead can't do any of that. A portrait is of an individual and arguably aims at character; a biopic is of actions and events, and it's the actions that the family is angry about. And there's a question about whether a portrait even asserts anything that can be true or false about the world in the way that "X betrayed Y in 1863" can. Which of these asymmetries actually matter for what she's using the analogy to do, and which are just differences that don't touch the conclusion?

  Don't stop at "portraits and photographs differ" — I know that, it's the boring part. The interesting part is whether the analogy can carry a claim about events and their moral evaluation, or only about character, and whether "the truth of the sitter" is even a well-defined target when the historians themselves disagree about who the sitter was.

  Then the real question: does her conclusion — that inventing is licensed — survive once the disanalogies are on the table, or was the analogy carrying the whole argument for her? If it doesn't survive, say what would, and whether there's a better analogy for what she's actually doing (I keep thinking of a portrait of someone who can't sit, but maybe that's worse — tell me).

  Lay it out with headers and the table, and give me a straight verdict at the end.
