answer: |-
  ## The Ontology of the Portrait: A Preliminary Sketch

  Before we audit the analogy, we must establish what a portrait *is* in the philosophical tradition. A portrait is not merely a causal trace of light (like a photograph); it is an intentional construction. It is a collaborative act (usually) between sitter and artist, mediated by a social contract.

  *   **Who makes it?** An artist, but one constrained by the physical reality of the sitter.
  *   **Who is it for?** The sitter (for legacy), the patron, and the public (for recognition or judgment).
  *   **What does it assert?** It asserts: "This is what X looked like," but more importantly, "This is how X wished to be seen" or "This is how X appeared to the artist."
  *   **Relation to sitter:** It is indexical (linked to the body) but also symbolic (linked to status/character).
  *   **The "Truth":** In portraiture, truth is often *expressive* rather than *propositional*. A caricature can be "truer" than a passport photo. However, a portrait rarely asserts false *events*. It does not paint a sword in the sitter's hand if they were a pacifist, even if the artist thinks violence suits their "essence."

  Your friend is leveraging the *expressive* definition of truth to justify *propositional* fabrication. Let us map this rigorously.

  ## The Correspondence Table

  Here is the mapping of the friend's analogy. I have included the "awkward" pairings where the analogy strains, as these are the sites of ethical failure.

  | Portrait Element | Biopic Element | Notes on the Pairing |
  | :--- | :--- | :--- |
  | **The Sitter** | **The Historical Subject** (The Scientist) | **Awkward:** The sitter is present/alive in portraiture; the subject is dead/absent in biopic. |
  | **The Face / Physical Likeness** | **The Historical Record** (Dates, Locations, Known Facts) | The "surface" data that must be recognizable. |
  | **The Portraitist** | **The Screenwriter / Director** | The interpreting agent. |
  | **Pigment / Brushstrokes** | **Dialogue, Scenes, Subplots** | The medium of construction. Invented pigment = Invented scenes. |
  | **"Truth of the Sitter" (Essence)** | **Thematic Truth / Emotional Arc** | The internal logic or "point" of the life story. |
  | **The Sitting (Process)** | **The Research Phase** | **Awkward:** The sitter collaborates in a portrait; the dead subject cannot collaborate. |
  | **Sitter's Approval / Rejection** | **Historical Consensus / Family Objection** | **Awkward:** A sitter can refuse a portrait; the dead cannot refuse a biopic. |
  | **The Gallery Wall** | **Cinema / Streaming Platform** | The context of public consumption. |
  | **The Viewer** | **The Audience** | Assumes a contract of "viewing a representation." |
  | **The Frame** | **The Runtime / Narrative Structure** | Limits what is shown, implying what is outside. |

  ## Where the Mapping Holds

  The analogy is seductive because it holds water in three specific areas:

  1.  **Selection is Distortion:** Just as a portraitist chooses lighting to hide a blemish or emphasize a brow, a screenwriter selects which facts to include. Omitting a boring decade is as much a "lie" as painting out a scar. Both media argue that *curation* is necessary for comprehension.
  2.  **Expressive Truth:** A portrait can capture a melancholy that a photograph misses. Similarly, a biopic can compress timelines to show an emotional causality (e.g., grief leading to discovery) that a dry chronology would obscure.
  3.  **The Artist's Gaze:** Both admit the subjectivity of the creator. A Sargent portrait tells you about Sargent as much as the sitter. A biopic tells you about the screenwriter's values as much as the scientist's life.

  In these areas, your friend is correct: strict literalism (the "photograph") can obscure the deeper narrative coherence (the "portrait").

  ## Where the Mapping Snaps

  The analogy breaks down in ways that are ethically fatal to her argument. These are not mere differences in medium; they are differences in *kind* that invalidate the license to invent.

  ### 1. The Asymmetry of Consent (The Dead vs. The Present)
  In portraiture, the "truth of the sitter" is often negotiated *with* the sitter. If Francis Bacon paints a screaming pope, it's an interpretation. If he paints a specific, living person committing a crime they didn't commit to show their "inner rage," that is libel.
  *   **The Snap:** The historical subject cannot say, "That's not me." The descendants are weak proxies. The portrait analogy imports a collaborative contract that does not exist. When the sitter cannot object, the artist's ethical burden *increases*, it does not decrease. The "portrait" defense assumes the sitter could have sat for it; the biopic is a portrait of a ghost, which grants the artist tyranny, not license.

  ### 2. Character vs. Event (State vs. Action)
  A portrait depicts a *state of being*. A biopic depicts *actions*.
  *   **The Snap:** You can paint a subject looking guilty to suggest a "truth" about their character without asserting they committed a specific crime. But your friend invented a *betrayal* and a *reconciliation*. These are propositional claims: "X did Y to Z."
  *   **Why it matters:** A portrait does not usually alter the *moral ledger* of the sitter. It does not paint a stolen purse into their hand to show they were "struggling financially." By inventing a betrayal, your friend has altered the moral history of the subject. She isn't painting the *essence*; she is falsifying the *record*.

  ### 3. The Nature of "Truth" (Aesthetic vs. Historical)
  When a portraitist seeks the "truth of the sitter," they are seeking a psychological or aesthetic coherence. When a historian (or biopic) seeks truth, they are bound by *correspondence theory* (did this correspond to reality?).
  *   **The Snap:** Your friend is conflating *narrative truth* (does this story feel right?) with *historical truth* (did this happen?). A portrait can be "true" even if the tie is the wrong color. A biopic subplot about a deathbed reconciliation is not a "color of the tie"; it is a claim about human relationships that defines the subject's legacy.
  *   **The Historian Disagreement:** You noted historians disagree about the subject. This does not license invention; it licenses *ambiguity*. A portrait can be blurry. A biopic that invents a specific resolution to an historical ambiguity is not making a portrait; it is forging a document.

  ### 4. The Claim of the Medium
  A portrait hangs on a wall labeled "Portrait of X." We understand it is an interpretation. A biopic is marketed as "Based on a True Story."
  *   **The Snap:** The audience contract is different. We view a portrait knowing it is paint. We view a biopic believing it is evidence. The "photograph" analogy your friend rejects is actually closer to the audience's expectation. They want the photograph; she is giving them a painting but labeling it a photograph.

  ## Does the Conclusion Survive?

  **No.** The conclusion that "inventing is licensed" does not survive the audit.

  The analogy carries the argument entirely. Without the "portrait" shield, her actions are simply **fabrication**.
  *   If the goal is "truth of the sitter," inventing a betrayal fails. It creates a *new* sitter—a fictional character wearing the dead scientist's name.
  *   If the goal is "emotional truth," there are ethical ways to achieve this (e.g., composite characters, voiceover speculation, stylized sequences) that do not assert false events as diegetic fact.
  *   The "portrait" analogy works for *tone, lighting, and emphasis*. It does not work for *plot points that assign moral responsibility*.

  Your friend is using the ambiguity of the word "truth" (emotional vs. factual) to smuggle in factual lies. The portrait analogy protects the former, not the latter.

  ## A Better Analogy: The Restoration of a Fresco

  If she wants an analogy that respects both art and history, she should look to **Art Restoration**, specifically the concept of *inpainting*.

  *   **The Scenario:** A fresco is damaged. Parts are missing.
  *   **The Practice:** Restorers fill in the gaps (*inpainting*) to make the image coherent.
  *   **The Ethical Rule:** The new pigment must be **distinguishable** from the old upon close inspection (*tratteggio*). You can fill the gap to show the "truth of the image," but you cannot fool the viewer into thinking your brushstroke is the original master's.
  *   **Application to Biopic:** Your friend can invent scenes to bridge historical gaps (the missing pigment). *However*, she must signal to the audience that this is invention.
  *   **The Failure:** She did not use distinguishable pigment. She painted her invention in the exact style of the historical record, making it indistinguishable from fact.

  **Alternative Analogy: The Critical Edition of a Text.**
  Scholars fill in lacunae (gaps) in ancient manuscripts. But they use *brackets* or *italics* to show what is reconstructed. Your friend removed the brackets.

  ## The Verdict

  Your friend's defense is **philosophically sophisticated but ethically bankrupt.**

  The "Portrait vs. Photograph" analogy is a category error. It applies correctly to *style, tone, and emphasis*, but it snaps when applied to *events and moral actions*. A portrait may interpret a face, but it does not forge a signature. By inventing a betrayal and reconciliation, she has not painted a portrait; she has forged a signature.

  **Final Judgment:**
  She is not a portraitist; she is a **historical novelist** passing her work off as **documentary**. If she wants the license to invent, she must accept the label of fiction. If she claims the authority of biography, she is bound by the ethics of the record. The dead cannot sit for their portrait, which means the artist must not paint wounds that were never there.

  **You win the argument, but acknowledge this:** She is right that a "photograph" (dry recitation of facts) makes bad art. She is wrong that "portrait" (artistic interpretation) licenses lying about actions. The middle path is **Transparency**, not Fabrication.
