      *   **3. Stacked Deck:** BNW links happiness with caste/eugenics/totalitarianism. Reader blames happiness, but maybe should blame coercion. HI claims post-darwinian ethics without coercion (eventually).
      *   **4. Animals:** BNW is silent on wild suffering. HI makes this central. BNW would need to imagine redesigning the Reservation's nature, not just excluding it.
