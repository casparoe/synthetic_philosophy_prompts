      *   *Section 4 (Animals):* BNW treats nature as a threat or resource. HI treats nature as a moral catastrophe. BNW would need to show a redesigned ecosystem to fairly test HI.
      *   *Section 5 (Ending):* Savage hangs himself. This is the ultimate rejection. HI defender says this proves the need for the Imperative (old biology kills). BNW reader says this proves the need for meaning.
      *   *Verdict:* The novel contributes the *political risk*. It shows that without a moral framework prioritizing liberty and truth, hedonic engineering becomes tyranny. The revulsion is not just status quo bias; it's a reaction to the *instrumentalization* of human beings.

  6.  **Refining the Tone:**
