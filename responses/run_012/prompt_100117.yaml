          *   If $\neg H$ is true, Non-Black Ravens exist. But they might still be rare. So finding a Non-Black Non-Raven is almost equally likely under $H$ and $\neg H$. The LR is $\approx 1$.
          *   In screening terms: The test (looking at a shoe) has no **Discriminatory Power** for the hypothesis because the result is equally probable under the null and alternative.
      *   *Old Evidence:*
          *   Problem: Using data $E$ to build theory $T$, then claiming $E$ confirms $T$.
          *   Screening counterpart: "Data Dredging" or "Overfitting." You build a risk model on a dataset, then validate it on the *same* dataset. The AUC looks great, but it's illusory.
          *   Does it map? Yes. Hempel's paradox is about logical confirmation, but Bayesian confirmation requires $P(E)$ to be uncertain. If $E$ is known (Old Evidence), $P(E)=1$, update is null.
