          *   Screening counterpart: **Surrogate Endpoints vs. Clinical Outcomes** or **Time-Dependent Covariates.**
          *   Or: **Biomarker Stability.** A test that works now might not work later.
          *   Does screening assume every property is fair game? Yes, statistically. Any binary classifier can be evaluated. But *causally*, we assume biological plausibility.
          *   Grue breaks the assumption of **Stationarity**. Screening assumes the ROC curve doesn't change tomorrow morning. Grue says "Yes it does."
          *   So, Grue is the **Violation of External Validity** over time.

