      *   *The Gap:* The user's hunch: "My tests are about one patient... ravens are about a population."
          *   *Correction:* Screening *validates* tests on populations to apply to patients. The Raven paradox is about validating the *law* (the population parameter).
          *   *Real Gap:* **Sampling Frame.** In medicine, we control the sampling (Case-Control or Cohort). We enrich for prevalence to calculate Sens/Spec. The Raven paradox forces a random sample from the Universe. The "White Shoe" is a negative result from a population with near-zero pre-test probability of being a Raven.
          *   *Likelihood Ratios:* The LR of a White Shoe for the hypothesis "All Ravens are Black" is $> 1$, but barely. $P(E|H) / P(E|\neg H)$.
