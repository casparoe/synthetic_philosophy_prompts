          *   *Clinical Equivalent:* Trying to determine the side-effect profile of a drug by surveying the general public vs. surveying patients taking the drug.
          *   If I want to know "Do all patients on Drug X get Nausea?" (Sensitivity of Drug X for Nausea = 100%).
