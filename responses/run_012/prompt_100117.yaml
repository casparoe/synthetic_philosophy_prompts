prompt: |-
  I'm a science journalist — about a decade covering medical screening and diagnostic tests, so at this point my brain is basically a confusion matrix: sensitivity, specificity, prevalence, positive predictive value, likelihood ratios, plus the base-rate sermon I dutifully give in every story. So here's what I want from you. Take the old raven thing — the paradox of confirmation, where the hypothesis that all ravens are black seems to get a little support from a black raven but also, weirdly, from a white shoe, since a non-black non-raven is equally consistent with it — and restate the whole debate about confirmation in my vocabulary. Actually do it properly: what's the test, what's the population, what counts as a positive result, what's the false-positive rate, and does the white shoe come out as just a useless negative screen run on a population that was never at risk?

  Then give me the residue report, which is the part I actually care about. What translates cleanly, what did you have to fudge to make it fit, and what has no counterpart at all in how I think about tests? My hunch is the thing that won't survive is that my tests are always about one patient and a hypothesis about that patient, whereas all ravens are black is a claim about a population I can never finish screening — but tell me if thats the real gap or if I'm just flattering myself. And I keep wondering about the old-evidence thing: screening has this whole headache about using a test you already ran to validate a model you built afterward. Does any of that map onto what the confirmation people fight about, or am I just pattern-matching?

  One more: the grue-style worry, that some properties are the kind of thing evidence can support and others just aren't. Does that have any counterpart on the testing side, or does diagnostic testing quietly assume every property is fair game? Dont give me a reading list, I'm not going to look anything up and neither are you — just reason it through. Assume I'm fluent in the stats and decent on the philosophy, so dont dumb down either half.
reasoning: |-
