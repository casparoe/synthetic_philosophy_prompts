  In sum, the baked-in view is that lying is primarily a breach of trust in a specific channel, not a universal moral wrong against belief formation. The law distinguishes between active misrepresentation (creating a false map) and passive misleading (withholding parts of the map). It treats the former as a verifiable act and the latter as ambiguous interpretation. This protects free speech and advocacy (lawyers/politicians) where robust debate requires latitude, while policing commercial fairness where power imbalances threaten market integrity. The core commitment is to provable falsity as the trigger for liability, reserving misleading impression for regulated contexts where policy demands higher protection. It rules out the idea that damaging belief is inherently actionable; instead, damage matters only when a specific duty to inform was breached or a regulated standard was violated. The theory assumes that truth is a property of statements, not of mental states, and that the law can only reliably police the former. To punish misleading truths universally would require courts to adjudicate subjective interpretations, chilling speech and overburdening the judiciary with epistemic queries about what a listener "should" have understood. This creates a form of moral luck where the legality of deception depends on the speaker's linguistic skill rather than their moral intent. Therefore, the system tolerates some manipulation to maintain clear boundaries.

  What's doing the work vs. what's just convenient

  Thus. Strictly speaking, the practice presupposes that falsity is objectively determinable while misleadingness is not. This is partly theoretical (truth corresponds to facts) but largely practical (courts need clear binaries). The distinction between private sales and consumer law isn't theoretically necessary; both could adopt a duty to disclose. That split reflects a policy choice about market efficiency versus protection, not a logical requirement of lying theory. Similarly, perjury could theoretically punish paltering if the intent to mislead was provable, but courts avoid it because inferring intent from true statements is evidentiarily messy.

  What's doing the real work is the duty of care variable. Where a fiduciary or regulatory duty exists (consumer law), the theory expands to protect belief. Where parties are adversaries or equals (private sales, court cross-examination), the theory contracts to protect assertion integrity. The "convenient" part is the reliance on literal truth as a safe harbor. This isn't philosophically required; a system could deem intentional implication equivalent to assertion. But it is administratively convenient because it reduces litigation over semantics. The underdetermined area is the private sale; nothing stops a jurisdiction from imposing a general duty of good faith that bans paltering between individuals. The current rule is a default preference for transactional speed over perfect information, not a metaphysical claim that paltering isn't deceptive. Furthermore, the adversarial nature of law and politics presupposes that listeners are skeptics, shifting the burden of verification onto them. This isn't a universal theory of lying but a contextual allocation of epistemic labor.

  If we switched to a false-belief rule

  If we adopted a rule liability based on intended false belief, the current practice would collapse. Lawyers could not cross-examine witnesses without risking perjury if the implication misled the jury. Politicians would face constant litigation over campaign rhetoric. Private sellers would need to disclose every defect proactively, killing the used car market's efficiency. The legal system would shift from adjudicating facts to adjudicating psychology—specifically, the speaker's intent regarding the listener's mental state.

  We would lose the protective buffer for advocacy and negotiation. Much of lawyering involves framing truths favorably; under a false-belief rule, zealous representation becomes fraud. The "safe harbor" of literal truth protects robust debate by allowing speakers to assume listeners are rational agents. Removing this chills speech, as anyone could claim they were misled by a technically true statement. However, we would gain significant consumer protection and reduce manipulative deception in high-stakes environments. Fraud would be harder to hide behind semantic loopholes.

