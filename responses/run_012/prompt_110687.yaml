  Bottom line

  The law prioritizes verifiable falsehoods over misleading truths because policing intent is administratively impossible across all contexts. While a harm-based theory is morally attractive, the current assertion-based rule preserves free speech and judicial feasibility at the cost of allowing some manipulation.
