  The practice, in your words

  The legal landscape treats deception inconsistently based on context and form. In perjury, asserting a known falsehood is criminal, but strategically arranging true statements to imply a falsehood (paltering) usually escapes liability. In private transactions, caveat emptor reigns; silence or selective truth isn't fraud unless there's a specific duty to disclose. Conversely, consumer protection statutes and advertising regulations actively punish misleading impressions, even if every individual claim is technically true. Meanwhile, politics and legal advocacy enjoy broad immunity for non-denials and evasive truths. The pattern suggests a split: some domains punish the false assertion itself, while others punish the resulting misunderstanding, and still others permit manipulation provided no explicit lie is uttered. This creates a patchwork where the morality of misleading someone depends less on the harm done to the listener's beliefs and more on the relationship between the parties and the specific words chosen. Clearly, the rules vary wildly.

  The theory it has to be assuming

  The practice presupposes a theory of wrongdoing grounded in the violation of a specific communicative duty rather than the consequential harm to belief. Your hunch is largely correct: the law prioritizes the act of asserting a falsehood over the state of the listener's mind. This is rooted in a conception of autonomy and evidentiary reliability. When you swear an oath, you contractually agree to map your words to reality. Breaking that map (lying) is a direct affront to the institution's integrity. Paltering, while manipulative, respects the literal contract of truth-telling; the listener retains the agency to interpret the words, even if misled. The law assumes a competent listener who bears some responsibility for inference. It treats the speaker's obligation as negative (do not say what is false) rather than positive (ensure understanding is correct).

