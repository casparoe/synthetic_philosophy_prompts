      *   **The "Frankfurt Case" Argument:** Harry Frankfurt's thought experiments argue that moral responsibility doesn't require the ability to do otherwise (Principle of Alternative Possibilities - PAP). If the dev *chose* to merge the bad code, he's responsible even if he couldn't have done otherwise (due to the cron).
      *   **The "Inevitability/Blame is Pointless" Argument:** If the outcome was determined regardless of his action, punishing him doesn't change the past and might seem unjust because he wasn't the *cause* of the inevitability. It focuses on utility and fairness.
