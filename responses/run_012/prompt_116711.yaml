prompt: |-
  I do ecological and infrastructure modeling for a living, so I think in terms of attractors, basins, tipping points, hysteresis, and regime shifts. There's a long-running fight among archaeologists and historians about whether societies "collapse" — the Bronze Age palace systems, the Classic Maya, Rapa Nui — or whether they just reorganize into something else and "collapse" is a word we're imposing from the outside. Can you restate that fight in my vocabulary, as faithfully as you can, and then give me the residue report: what doesn't survive the translation? My hunch is that "collapse" smuggles in a valuation my framework has no room for — a transition is just a transition — but I doubt thats the whole story. Some of what they disagree about seems to have no clean counterpart either: the timescale (a hundred years is a slow drift to me, and three generations of ordinary life to them), who counts as the system in the first place, and whether the people living through it would have described it as a catastrophe or just as a bad decade. Tell me which residue is my vocabulary's fault and which is a sign that the historians' question is muddier than they let on.
reasoning: |-
