answer: |-
  Here is the translation of the archaeological debate into dynamical systems terminology, followed by the residue report and a diagnosis of where the friction lies.

  ### 1. The Debate in Systems Vocabulary

  **The Consensus Object:** A socio-ecological system (SES) defined by specific state variables (population density, energy capture, information storage, hierarchical depth).

  **The "Collapse" Hypothesis (The Catastrophists):**
  They argue the system underwent a **catastrophic bifurcation**. The SES was operating in a high-complexity **basin of attraction** (e.g., Palace Economy). Due to external forcing (climate change, invasion) or internal parameter drift (soil depletion, elite overproduction), the system crossed a **tipping point**. It fell into a basin of significantly lower complexity/energy.
  *   **Key Evidence:** Loss of specific state variables (writing, monumental construction, long-distance trade).
  *   **Hysteresis:** The system cannot easily return to the previous attractor even if original conditions are restored (you can't just rebuild the palace; the knowledge/structure is gone).
  *   **Interpretation:** This is a **regime shift** characterized by a net loss of system capacity and resilience.

  **The "Transformation" Hypothesis (The Continuity Theorists):**
  They argue the "Collapse" camp is measuring the wrong state variables. They claim the system did not leave its broader basin of attraction; it merely shifted position within it, or moved to an **alternative stable state** of comparable resilience but different configuration.
  *   **Key Evidence:** Persistence of underlying substrate variables (total population, caloric intake, local kinship networks).
  *   **Re-framing:** The "high complexity" state (Palace) was a **metastable transient**, not a true attractor. It was energetically expensive and fragile. The "post-collapse" state is the system relaxing into a more robust, lower-energy equilibrium.
  *   **Interpretation:** What looks like a crash is actually **adaptation**. The system shed high-maintenance variables to maintain core function.

  ***

  ### 2. The Residue Report

  Here is what evaporates or distorts when you force the historical debate into your modeling framework.

  **A. The Normative Vector (Your Hunch)**
  *   **The Residue:** In your framework, State A $\rightarrow$ State B is neutral. In history, "Collapse" implies a loss of *human welfare* and *potential*.
  *   **Why it sticks:** You can model "information density" (e.g., literacy rates), but you cannot model "suffering" or "loss of meaning" easily. A transition from a high-energy state to a low-energy state might be thermodynamically efficient, but if it involves three generations of increased infant mortality and violence, historians call it a collapse. Your vocabulary lacks a **utility function** for the agents inside the system.

  **B. The Observation Layer (Who Counts as the System?)**
  *   **The Residue:** In modeling, you define boundaries. In history, the boundary is the argument.
  *   **Why it sticks:** If the "System" = The Elite Redistribution Network, it collapsed (variables went to zero). If the "System" = The Peasant Subsistence Grid, it persisted (variables remained stable). The historians are often arguing about **which sensors** constitute the system. Your framework assumes a defined system boundary; the historical debate is *about* where that boundary lies.

  **C. Phenomenological Time vs. Model Time**
  *   **The Residue:** To you, a 100-year transition is a "ramp" or a "drift." To a human, 100 years is a lifetime.
  *   **Why it sticks:** Dynamical systems often compress time to show equilibrium states. History is lived in the transient phase. If the "transition" involves 4 generations of instability, historians call it a collapse because the *experience* was catastrophic, even if the *phase space* shows a smooth curve. Your model sees the trajectory; they feel the jerk.

  **D. Intentionality and Narrative**
  *   **The Residue:** Systems react; people interpret.
  *   **Why it sticks:** If the Maya elites stopped building stelae, was it a systems failure (resource constraint) or a strategic choice (ideological shift)? Your framework treats the cessation of building as a variable dropping. Historians argue over whether that drop was forced (collapse) or chosen (reorganization). **Agency** looks like noise in a model, but it's the signal in history.

  ***

  ### 3. Diagnosis: Model Blindspots vs. Historical Muddiness

  You asked to distinguish between what your vocabulary filters out and where the historians are asking ill-posed questions.

  **Fault of the Vocabulary (Model Blindspots)**
  1.  **Valuation of Complexity:** Your framework treats complexity as a descriptor, not a value. But "Collapse" is inherently a claim that *complexity is good*. If you model a society, you can track "specialization," but you cannot track "civilizational loss" without importing an external ethical axiom. Your vocabulary is ontologically neutral; the historical debate is axiologically loaded.
  2.  **The "Lived" Transient:** Models prioritize attractors (stable states). History often prioritizes the *pathway* between them. If the pathway is bloody, it's a collapse, even if the destination is stable. Your vocabulary tends to treat the transition as the mechanism and the state as the reality. For historians, the transition *is* the reality.

  **Fault of the Historians (Ontological Muddiness)**
  1.  **The "Society" Variable:** This is the biggest source of mud. Historians often use "Society" as a singular state vector when it is actually a **coupled hierarchy of systems**. The "Palace System" and the "Village System" are coupled but distinct subsystems. One can collapse while the other persists. The debate is often muddied because Camp A is modeling the Superstructure and Camp B is modeling the Substructure, but both claim to be modeling "The Society." This is a category error on their part, not a translation failure on yours.
  2.  **Timescale Rhetoric:** Historians sometimes use timescale ambiguity strategically. Calling a 150-year decline a "sudden collapse" serves a narrative of catastrophe. Calling a 20-year violent conquest a "transformation" serves a narrative of resilience. In your work, timescales are parameters. In theirs, they are often rhetorical devices. This suggests their question ("Did it collapse?") is sometimes less about data and more about genre.

  ### Summary
  Your hunch is correct but incomplete. "Collapse" does smuggle in a valuation (complexity = good), but it also smuggles in a **perspective** (elite institutions = the system).

  The residue that is **your vocabulary's fault** is the inability to capture the *qualitative experience* of the transition (suffering, loss of meaning).
  The residue that is **the historians' fault** is the failure to define the system boundaries (Elite vs. Peasant) and the conflation of *structural stability* with *human welfare*.

  If you forced them to define their state variables and system boundaries explicitly, half the debate would vanish. The other half would remain, because it is fundamentally a moral argument about whether a world without palaces is a world worth living in. Your models can map the basin, but they cannot tell you if you want to live there.
