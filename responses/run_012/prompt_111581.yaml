  Thinking Process:

  1.  **Analyze the Request:**
      *   **Topic:** Updateless Decision Theory (UDT).
      *   **Core Concept:** Decide on a policy *before* knowing your specific situation, and stick to it even after learning your situation, because your decision correlates with other agents (or versions of yourself) running the same policy, even without communication. Your present decision isn't special just because it's yours/now.
      *   **Setting:** Chain of way-stations on a hard winter road. Keepers trained at a single school on a single written rule about sharing stores. No enforcement, no communication between stations (days apart, dead season).
      *   **Protagonist:** A keeper at a station where keeping the rule is expensive/costly this year.
      *   **Antagonist/Interlocutor:** A companion or stranded visitor who argues for updating (abandoning the rule now that she knows her specific situation).
      *   **Constraints:**
          *   2000-3500 words.
          *   Title included.
          *   No epilogue, no author's note.
          *   No character exists *only* to expound the idea (show, don't tell).
          *   Ordinary metaphysics (no sci-fi tropes like simulations, time travel, exact clones).
          *   The correlation must do real work without communication channels.
          *   Ending should be ambiguous (wisdom vs. elegant trap).
          *   Do not use the term "Updateless Decision Theory" explicitly (or only as a half-remembered name).
          *   Tone: Literary, serious, suitable for a graduate seminar anthology.

  2.  **Deconstruct the Philosophy for the Plot:**
      *   *The Rule:* Share stores with travelers and other keepers.
      *   *The Conflict:* Usually, the rule benefits the system. But this year, at *this* station, keeping the rule means starvation or death for the keeper, while breaking it means survival with no consequence (no one will know).
      *   *The Visitor's Argument:* "You know you're at Station 7. You know it's a bad year here. No one will know if you break the rule. Why bind yourself to a policy made in ignorance?" (This is Causal Decision Theory / Evidential Decision Theory updating on new information).
      *   *The Keeper's Argument:* "I am not deciding for Station 7 alone. I am deciding as a Keeper. If I break the rule because it's hard here, then every Keeper who finds themselves in a hard situation will break the rule. The policy must hold across all instances of 'Keeper'." (This is UDT).
      *   *The Stakes:* Concrete survival. Food, fuel, warmth.
      *   *The Ambiguity:** Does her sacrifice actually matter? Or is she dying for a logical ghost?

  3.  **Character Development:**
      *   **Keeper:** Elara. Stoic, trained, struggling with the physical reality of hunger/cold.
      *   **Visitor:** Kael. Pragmatic, stranded, desperate, represents the "common sense" updated view.
      *   **Setting:** Station 4 (or similar). High altitude, exposed. Winter is harsh.
      *   **The Rule:** "The Open Hearth." Give fuel and food to any bearer of the Token, and send surplus to the next station if possible.

  4.  **Plot Outline:**
      *   **Introduction:** Establish the cold, the isolation, the scarcity. Elara checking stores. The realization that this winter is different.
      *   **Inciting Incident:** Kael arrives. He's stranded. He sees the stores. He realizes the math doesn't work for Elara if she follows the Rule.
      *   **Rising Action:** The debate. Kael argues for survival based on local knowledge. Elara argues for the Policy based on global consistency.
      *   **Climax:** The moment of decision. The storm peaks. The fuel needs to be lit. The food needs to be shared.
      *   **Falling Action:** The execution of the decision.
      *   **Resolution:** Ambiguous. Elara commits to the policy. The physical outcome is uncertain (she might freeze), but the logical stance is held.

  5.  **Drafting - Section by Section:**

      *   *Setting the Scene:* Focus on the cold. The isolation. The ledger. The training school (The Academy? The Hall?).
      *   *The Visitor:* Kael isn't malicious, just rational. He represents the "update." He knows where he is. He knows the distance to the next station.
      *   *The Dialogue:* Needs to be sharp. Not a lecture. Kael pushes the "No one will know" angle. Elara pushes the "If I do it, others like me do it" angle.
