      *Refining the "Correlation":* The prompt says: "settling on a policy is settling what all of them do. The agreement among them is not produced by anything passing between them; it is produced by their being the same chooser." I need to make sure Elara articulates this without sounding like a textbook. She needs to say something like, "I am not Elara at Station 4. I am a Keeper. If I break, a Keeper breaks."

