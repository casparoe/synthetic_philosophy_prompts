answer: |-
  **The Rule of Snow**

  The wind at Station Four did not blow; it hunted. It searched the cracks in the mortar, the seams of the wool, the spaces between breaths. Elara sat by the ledger, the ink frozen in the well, her fingers stiff around the pen. Outside, the pass was white blindness. Inside, the air was sharp with the scent of pine resin and old dust.

  She had counted the stores three times. The numbers did not change. The caravan from the south had been delayed, the harvest in the valley below had failed, and the winter had come early. By the standard allocation—the Rule taught at the Hall—she was to set aside forty percent of her remaining grain and fuel for the next station down the line, and offer warmth and meal to any traveler bearing the Token.

  She had enough to survive if she kept everything. She had enough to send the surplus if she ate nothing but broth for two months. She did not have enough to do both.

  The knock on the iron-bound door was not a sound so much as a vibration in the floorboards. Elara opened it to a man wrapped in furs stiff with ice. He stumbled in, bringing a gust of snow that hissed on the hearthstones. He wore the Token around his neck, a disc of hammered copper.

  "Shut it," he gasped. "Please."

  Elara barred the door and led him to the fire. He was not a keeper. He was a merchant, by the look of the fine leather beneath the frost. He warmed his hands over the flames, eyes darting to the sacks stacked against the wall, then to the bin of coal near the stove.

  "I'm Kael," he said, when his teeth stopped chattering. "My sled broke an axle ten miles down. I saw the light. I didn't think anyone would be here this time of year."

  "Station Four is staffed year-round," Elara said. She ladled broth into a bowl. It was thin. She had watered it more than the Rule suggested.

  Kael drank quickly, wiping his mouth with the back of a gloved hand. He looked at the broth, then at her. He was a sharp man; she could see the calculation behind the exhaustion. He looked at the sacks, then at her thin frame. He looked at the coal bin, then at the meager fire.

  "You're short," he said. It wasn't a question.

  Elara did not answer. She stirred the pot.

  "I know the Rule," Kael said. "I've used the way-stations before. In summer. You're supposed to feed the traveler, send the surplus down the line. Keep the chain intact." He leaned forward. "But look at this place. Look at you. If you give me a full meal and pack supplies for Station Five, you won't make it to spring. The snows block the pass until May. You'll starve."

  "The Rule does not account for the weather," Elara said.

  "The Rule was written by men in a warm hall," Kael countered. "They didn't know this winter. You know it. You are here. You have the information they didn't have. Why bind yourself to a plan made in ignorance?"

  Elara sat on the stool opposite him. The fire crackled, consuming a log that should have been saved for tomorrow. "I am not binding myself to a plan made in ignorance. I am binding myself to a policy chosen before I knew where I would stand."

  Kael laughed, a dry, brittle sound. "That's philosophy. I'm talking about calories. If you keep the Rule, you die. If you break it, you live. No one will know. Station Five is three days hard ride through a blizzard. They won't know if you sent the supplies or not. The Hall is weeks away. You could say the wolves took the grain. You could say the damp rotted the coal."

  "And if I do that?" Elara asked.

  "Then you survive," Kael said. "And I survive. And the system continues next year with you in it. What good is a dead keeper to the road?"

  Elara looked at the fire. The heat was seductive. To stand up and walk away from it was a physical pain. "You are arguing that I should update," she said quietly.

  "Update?"

  "Change my decision based on new information. Now that I know I am at Station Four, and now that I know this winter is hard, I should choose the act that saves me."

  "Yes," Kael said. "Obviously. You're not a martyr. You're a keeper. Your job is to keep the station running. You can't do that if you're dead."

  Elara stood and walked to the window. The snow was falling thickly, erasing the world outside. "When we were at the Hall, we were not taught as individuals. We were taught as instances. There are twelve stations on this road. Twelve keepers. We all learned the same text. We all took the same oath. We were trained to reason the same way."

  "And?"

  "And if I decide that the Rule should be broken because the cost is too high for me, then I have decided that the Rule should be broken whenever the cost is too high."

  Kael shifted on the bench. "But the cost isn't too high for them. It's too high for *you*. Station One is in the valley. They have plenty. Station Twelve is near the military depot. They have reserves. You are the only one in the crunch. Why should your decision bind them?"

  "Because they are me," Elara said. She turned from the window. "Not in blood. In logic. If I reason that 'local survival overrides the Policy,' then any Keeper who finds themselves in a local survival crisis must reason the same way. We are running the same algorithm, Kael. I am not special because I am here. I am just the place where the calculation is happening now."

  Kael shook his head. "That's mysticism. You think because you think a thought, someone else thinks it? There's no wire between you. No birds carrying messages. If you hide the grain, Station Five stays cold, but they don't know why. They might think the supply line failed. They won't think 'Elara chose to live.' They won't know anything."

  "It doesn't matter if they know," Elara said. "It matters what they *would* do. If I break the Rule, I validate the exception. I make it true that the Policy is conditional. If the Policy is conditional, then the next time a Keeper is cold, they will break it too. And the next time. Eventually, the chain breaks not because of the snow, but because the logic holding it together dissolved."

  "You're saying your choice *makes* them choose?" Kael asked, skeptical. "How? Magic?"

  "No. Correlation. We are the same kind of chooser. If I find a reason to defect, that reason exists for any Keeper in a similar position. There might be another Keeper right now, at Station Six, facing a roof collapse. If she looks at her ledger and sees that keeping the Rule means freezing, she will look for a justification. If I find one here, she finds one there. We are not communicating. We are deriving the answer from the same premises. If I change the premises to suit my comfort, I change the output for all of us."

  Kael stood up and walked to the sacks of grain. He put a hand on one. "This is wood and seed, Elara. It doesn't care about your logic. It cares about being burned and eaten. If you give this to me, and send the rest down the line, you are trading your life for a principle that no one will ever see upheld. You are dying for a ghost."

  "I am dying for the consistency of the Road," Elara said. "If the Road is only safe when it is convenient, it is not safe. It is a lottery."

  "It's a road," Kael snapped. "It's dirt and stone. It doesn't have a soul."

  "The trust does," Elara said. "The travelers trust that the stations will be there. The keepers trust that the supplies will come. That trust isn't built on enforcement. There is no enforcement. It's built on the certainty that we will not update. That we will not look at our specific situation and say 'not me.'"

  Kael looked at her, really looked at her, seeing the hollows under her eyes, the tremor in her hands that had nothing to do with the cold. He saw that she was not speaking from pride. She was speaking from a terrifying kind of clarity.

  "You believe," Kael said slowly, "that if you keep the Rule, you increase the chance that another Keeper keeps the Rule, even though you can't talk to them."

  "I believe that if I keep the Rule, I am the kind of person who keeps the Rule. And since they are the kind of person who keeps the Rule, they will keep it. If I become the kind of person who breaks it when it hurts, then they are too."

  "That's a bet," Kael said. "You're betting your life on a statistical correlation that might not exist. What if you're the only one who thinks this way? What if Station Five is already hoarding? What if the Hall has forgotten us? Then you die for nothing."

  Elara walked to the grain sacks. She picked up the measure. It was heavy iron. "If I am the only one, then the system is already dead. My death just confirms it. But if I am not the only one, then my action sustains the network that keeps travelers alive across the pass. Including you."

  "I'm one traveler," Kael said. "You're one keeper. There are more keepers than travelers in winter."

  "Then the keepers matter more," Elara said. She began to measure out the grain. She filled the traveler's bag first. Enough for Kael to reach the next station. Then she filled the dispatch sack for Station Five. Enough to keep their hearth lit and their bellies full for a week.

  She left only a small pile for herself. Enough for broth. Not enough for strength.

  Kael watched her. He did not try to stop her. He saw that the argument was over; the physics of the situation had been superseded by the logic of the choice. He felt a strange unease, not because she was sacrificing herself, but because she was treating herself as irrelevant. She was treating her own survival as a variable no more significant than the wind outside.

  "You know," Kael said, his voice low, "I heard a story once. At the Hall. Before I left the trade. They talked about a theory. Updateless something. Said it was about choosing the best outcome before you know who you are in the story."

  Elara tied the sack. "We were not taught names. We were taught the Rule."

  "It sounds like the same thing. Deciding who you are before you know where you are."

  "It is the only way to be reliable," Elara said. "If I wait until I know where I am to decide who I am, I am not a Keeper. I am just a person in a room with some grain."

  Kael shouldered the bag. It was heavy. He looked at the dispatch sack destined for the next station. "I could take this too. Tell them the station was raided. You'd have enough to live."

  Elara looked at him. Her face was calm, drained of color but steady. "If you do that, you are testing the Policy. You are asking if I will break the Rule when no one is watching. I have already answered. Do not ask me to answer again."

  Kael held her gaze for a long moment. Then he nodded. He lifted the dispatch sack and placed it by the door, separate from his own. "I'll carry it to the drop point. Two miles down. I won't eat it."

  "Thank you."

  "Don't thank me. I'm not doing it for the Road." He pulled his furs tight. "I'm doing it because I don't want to be the reason the logic fails. If you're right, then me stealing that grain makes me part of the breakdown. If you're wrong, then I'm just stealing from a dying woman. Neither option sits well."

  He opened the door. The wind screamed, eager to enter.

  "Will you come back?" Elara asked. "When the pass opens?"

  "If I live," Kael said. "If the Road holds."

  He stepped out into the white. Elara barred the door. The silence returned, heavier than before. She sat by the ledger. The ink was still frozen. She could not write down the transaction. It did not matter. The ledger was for the Hall. This transaction was for the logic.

  She added a log to the fire. It was from the pile meant for tomorrow. She warmed her hands. She would need to be careful. She would need to ration the broth. She would need to sleep more to conserve energy. There was a chance she would not see the spring sun. There was a chance the snow would drift against the door and she would simply stop waking up.

  But there was also the chance that at Station Six, or Station Two, another keeper was looking at a empty bin and a cold hearth. Another keeper trained at the Hall. Another keeper running the same code. If that keeper chose to send the surplus, it would be because the policy held. And the policy held because Elara held it here.

  It was not causation. She knew that. Her action did not reach out and move the hands of the other keepers. But her action was of the same type as theirs. To break the rule here was to break it everywhere the conditions were similar. To keep it here was to keep it everywhere the reasoning was the same.

  She was not saving the system by magic. She was refusing to be the exception that proved the rule was a lie.

  Elara closed her eyes. The hunger was a sharp stone in her belly. The cold was seeping back into the room despite the fire. She thought of the other stations. She tried to imagine them. Not as friends, but as mirrors. If she stood firm, they stood firm. If she faltered, they had permission to falter.

  She wondered if Kael was right. Was this wisdom? Or was it an elegant trap? Had the Hall trained them to sacrifice themselves for a correlation that didn't exist? Was she dying for a mathematical shadow?

  She looked at the dispatch sack by the door. It was gone now, with Kael. But the decision remained. The choice was made. It could not be unmade. She had committed before she knew the cost, and she was paying the cost now that she knew it.

  Outside, the wind hunted. Inside, Elara sat still. She did not update. She did not revise. She waited for the spring, or the end, trusting that the logic of the snow was consistent, even if the world was not.

  She picked up the pen. She dipped it in the thawed ink. She wrote the numbers down, exactly as the Rule required. She did not write a note about the shortage. She did not write a plea for help. She wrote the truth of the policy, not the truth of the situation.

  When she finished, she blew on the ink to dry it. The flame of the lamp flickered. She watched it, wondering if it was brighter because she had fed it, or if it was just the same fire burning in the dark, indifferent to who kept it alive.

  She closed the ledger. The room was very quiet. She pulled her woolen cloak tighter and sat back in the chair. There was nothing left to decide. The policy was in effect. She was merely the place where it was happening.
