answer: |-
  Dear friends, colleagues, and citizens, it is a rare thing to walk into a room where the people who write the equations sit shoulder to shoulder with the people who live inside them. Half of you have spent careers modeling the arithmetic of democracy, and the other half have spent days locked in community centers wrestling with the actual weight of it. I want to begin by thanking you for bridging that gap, because today I want to talk about a piece of mathematics that hangs over this work like a silent partner, a theorem that promises us wisdom but warns us of fragility. I want to talk about Condorcet, but I want to talk about him through the eyes of a woman named Elena who sat at table four during a citizens assembly on climate adaptation last autumn.

  It was the second day, late afternoon, the time when the coffee has gone cold and the fatigue starts to make the policy briefs blur. Elena was looking at a choice between two infrastructure proposals. One was cheaper but offered less protection against future flooding; the other was robust but required tax increases that worried her. In the morning, she had leaned toward the cheaper option. She was not guessing; she had a reason, based on her own experience with household budgets. But across from her sat a civil engineer who had been called as a witness, and beside him a neighbor who spoke about the value of communal safety in a way that reframed the cost not as a loss, but as an insurance premium. Elena did not change her vote because she was pressured. She changed it because the information she held was incomplete, and the deliberation filled the gaps. When the final ballot was cast, her vote aligned with her neighbors. They were no longer independent data points. They were a cohort.

  This moment captures the tension we are here to explore. The Condorcet jury theorem tells us that if individual voters are more likely than not to be correct, and if they vote independently, the probability of the majority reaching the right answer approaches certainty as the group grows. It is a beautiful piece of arithmetic that justifies the very existence of this room. It suggests that we do not need kings or experts to find the truth; we just need enough of us, each looking at the world through our own unique lens. But there is a assumption buried in that math, a fragile premise that says our errors must be independent. My mistake must not be your mistake. If we are all wrong, we must be wrong for different reasons, so that when we aggregate, the noise cancels out and the signal remains.

  Deliberation, by its very design, threatens this assumption. When we talk, when we share evidence, when we listen to the same witnesses and are guided by the same facilitators, we are building correlations. We are syncing our errors. If there is a shared bias in the room, or if the information presented leans subtly in one direction, deliberation acts as a machine for amplifying that bias rather than correcting it. The mathematics warns us that once even a small shared bias is in play, a large jury can converge on the wrong answer with something close to certainty. So we arrive at a difficult question. If the process we use to raise competence also destroys the independence required for the math to hold, are we building on a foundation of sand? Is the arithmetic of democracy a fairy tale that collapses when humans actually speak to one another?

  I am here to suggest that the arithmetic is not a fairy tale, but it is a static map for a dynamic terrain. The theorem assumes a fixed level of competence, a static probability that a voter is right before they ever enter the booth. It treats us as atoms bouncing off each other. But an assembly is not a collection of atoms; it is a learning organism. The purpose of deliberation is not merely to aggregate pre-existing wisdom but to generate new competence. When Elena listened to her neighbor, she did not just correlate her error; she reduced her ignorance. The risk of correlated error is real, and we must never pretend otherwise, but the reward of shared learning is the only thing that allows us to tackle problems too complex for any single individual to solve alone. The math warns us that correlation is dangerous, but it does not account for the fact that deliberation changes the variable it seeks to measure.

  This is why I need the researchers in this room to keep refining the models. Do not stop at the independence assumption. Show us how much competence must rise to outweigh the risk of correlation. Give us the metrics to know when a discussion has become an echo chamber and when it has become a crucible for truth. But I also need the practitioners, the citizens and the civil servants, to understand that you are not violating the math; you are upgrading it. When you design a process that ensures diverse evidence is heard, when you facilitate a conversation where dissent is protected, you are doing the hard work of keeping the competence curve steeper than the correlation curve. You are ensuring that the shared understanding you build is based on robust information rather than shared bias.

  The reason we keep going is not because the math guarantees success. It guarantees nothing of the sort. We keep going because the alternative is a democracy that treats citizens as static vessels of pre-formed opinion, to be counted but never engaged. The Condorcet theorem gives us the hope that numbers can reveal truth, but deliberation gives us the mechanism to make those numbers worthy of the task. Elena's vote was correlated with her table, yes, but it was also more informed than it had been at breakfast. That trade-off is the work of this conference. We are here to figure out how to design assemblies where the growth in wisdom outpaces the risk of groupthink. We are here to ensure that when we converge, we are converging on a solution that is not just agreed upon, but understood.

  So let us not fear the correlation that comes from speaking together. Let us fear the silence that keeps us independent but ignorant. The arithmetic is not the destination; it is the compass. It points out the danger zones, the places where our shared biases might lead us off a cliff. But it is up to us to build the guardrails. It is up to the staff to curate the evidence so that no single narrative dominates. It is up to the citizens to challenge each other with the courage to disagree even when consensus feels comfortable. And it is up to the theorists to remind us that while the ideal of independence is impossible in a deliberating body, the ideal of competence is within our reach.

  We are gathered here to prove that the wisdom of crowds is not a magical property of size, but a cultivated property of process. The theorem tells us that large groups can be wise. Deliberation tells us why they should be. If we can manage the tension between the two, if we can raise our collective competence faster than we synchronize our errors, then the arithmetic holds. Not as a promise of certainty, but as a challenge to design. Let us spend these three days accepting that challenge. Let us leave here committed to the hard, messy work of making sure that when we converge, we are right. Thank you.
