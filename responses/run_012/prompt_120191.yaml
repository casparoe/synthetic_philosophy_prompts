answer: |-
  The water stain on the ceiling was the color of a week-old bruise. Elias stood in the center of the living room, clipboard pressed against his chest, pen hovering over the line marked *Time of Loss*.

  The homeowner, Mr. Henderson, stood by the window, arms crossed. "Like I said, we were at the theater. Came home, found this. Pipe in the wall must've burst around eight."

  "Eight," Elias said. He didn't write it down.

  He tried to picture the wall at 8:00 PM. He tried to picture the copper pipe, the pressure building, the rupture, the water hissing into the insulation. He tried to picture it without anyone in the room to see the drywall bulge or hear the hiss.

  He closed his eyes. Immediately, he saw the wall. He saw the water. But he was seeing it. He was the witness.

  He opened his eyes. The wall was dry now, patched temporarily. The damage was the stain, the warped floorboards. Effects. The cause was gone, vanished into the past.

  "Is there a problem?" Henderson asked.

  "I need to know if anyone heard it," Elias said.

  "No. I told you. We were out."

  "So no one perceived the event."

  Henderson shifted his weight. "It happened. The floor is wet."

  "The floor is wet now," Elias said. He looked at his pen. Ink on paper was a form of perception. If he wrote *8:00 PM*, he was certifying that a specific moment existed independently of his current observation. He was drawing a line between *then* and *now* and claiming the space in between was solid.

  He knew the argument. He didn't call it Berkeley's Master Argument; he called it The Seam. On one side was the inability to conceive of an object without conceiving of it. You can't think of a tree without thinking. On the other side was the ability to conceive *that* there is a tree unthought. You can hold the proposition even if you can't hold the image.

  Elias lived in the tear between those two sides.

  He walked down the hallway. The water had tracked. There was a door at the end of the hall. Closed. Locked.

  "This room?" Elias asked.

  "Storage," Henderson said. "Kept my tools in there. Old cameras. Didn't get wet, the threshold is high."

  "You haven't opened it since you got home?"

  "No."

  Elias put his hand on the knob. It was cold brass.

  If he turned it, he would see the tools. They would become present. Their existence would be confirmed by his retina, translated to his brain, transferred to his clipboard.

  If he didn't turn it, what were they?

  He could conceive *that* the tools were in there. He could hold the proposition: *There are cameras in this room.* It felt logically sound. Henderson believed it. The insurance policy covered it.

  But could he conceive of the tools *unperceived*? He tried to strip away his own mind from the equation. He tried to imagine the room as it was at 8:00 PM, when the house was empty. He imagined the dark. He imagined the silence. But he was imagining the dark. He was imagining the silence. He was the light.

  He took his hand off the knob.

  "I'm not going to open it," Elias said.

  Henderson frowned. "You need to verify the contents for the rider."

  "I need to verify the loss. There is no loss to the contents. They are dry."

  "But you need to list them."

  Elias looked at the door. If he opened it, he collapsed the state of the tools from *potential* to *actual*. But more than that, he validated the time in between. He admitted that the tools had sat there, in the dark, unperceived, waiting for him. That they had endured a duration without a witness.

  To Elias, that was a metaphysical impossibility. To his employer, it was Tuesday.

  "I'll list them as reported," Elias said. "I won't inspect."

  "You'll get flagged," Henderson said.

  "Let them flag it."

  ***

  The office was fluorescent and humming. Sarah sat across from him, eating a yogurt. She was a senior adjuster. She didn't believe in ghosts, and she didn't believe in idealism. She believed in exposure and risk pools.

  "You left the value column blank," Sarah said, tapping the printout.

  "For the storage room."

  "Elias. The man says he has five thousand dollars worth of lenses in there. The water didn't get in. We need to know they're still there to assess the risk of future claims. If the humidity ruined them, we need to know now."

  "I didn't open the door."

  Sarah stopped chewing. She put the spoon down. "Why?"

  "Because I couldn't verify the continuity."

  "Continuity of what?"

  "Of the objects." Elias rubbed his temples. "If I open the door, I see them. I know they are there *now*. But the claim implies they were there *then*. When the house was empty. When the pipe burst. When no one was looking."

  "And?"

  "And I can't conceive of them being there when no one was looking. I can try to think of the room without me in it. But I'm still thinking of it. I'm still in it, mentally."

  Sarah leaned back. She didn't roll her eyes. She had heard this before, six months ago when Elias had refused to sign off on a burglary claim because the security camera was off during the break-in. *If the camera didn't see it,* he had said, *and the owner didn't see it, what was stolen?*

  "So you're saying," Sarah said, her voice level, "that because you can't imagine an unobserved lens, the lens might not have existed during the leak."

  "I'm saying I can't certify that it did."

  "You can certify the report," Sarah said. "You can certify that Henderson *says* they were there. You're not certifying the ontology of the lenses, Elias. You're certifying the contract."

  "The contract assumes the world persists."

  "The contract assumes we pay for losses. It doesn't care how the universe holds itself together in the gaps."

  Elias looked at the form. *Time of Loss: 8:00 PM.* He had left it blank.

  "If I write it down," Elias said, "I'm lying. I'm saying I know something I can't know. I'm saying there is a 'then' that doesn't depend on a 'now'."

  Sarah sighed. She picked up her pen. "There is a 'then' because there are consequences. The mold grows in the 'then'. The rust forms in the 'then'. If you deny the 'then', you deny the rust. If you deny the rust, you deny the claim. If you deny the claim, Henderson sues. If Henderson sues, the company pays legal fees. The legal fees are real. Can you conceive of unperceived legal fees, Elias?"

  He almost smiled. "I can conceive of the bill."

  "Then sign the damn form."

  Elias took the paper. He looked at the blank space for *Time of Loss*.

  He felt the seam again. The sliding distinction.
  *Try to conceive of the time passing without you.* (Impossible. You are conceiving it.)
  *Try to conceive that time passed without you.* (Possible. A logical proposition.)

  He could write the proposition. He couldn't visualize the fact.

  He wrote *Approx. 20:00*.

  The ink dried. It became a fact. By writing it, he had perceived it into the company's reality. He had become the witness for the empty house. He felt a sudden, vertiginous responsibility. He wasn't just adjusting the claim; he was sustaining the history of the house for the last twelve hours. Without his signature, the leak hovered in a kind of limbo. With it, the pipe had burst. The water had flowed. The universe had clicked forward.

  "Better?" he asked.

  "Acceptable," Sarah said. "What about the door?"

  "Left it closed."

  "Did he sign a waiver?"

  "Yes."

  "Then it's fine. We'll deal with the storage room on the next claim."

  Elias stood up. He felt heavy. The act of writing had exhausted him. He walked to the window of the office. Below, the city traffic moved. Cars flowed through intersections.

  He watched a red sedan turn a corner. It disappeared behind a building.

  He knew it was still there. He could conceive *that* it was there. He held the proposition firmly. *The car exists behind the building.*

  But he tried to see it. He tried to strip his sight from the concept. He tried to let the car be entirely independent of his mind.

  He couldn't. As long as he thought of the car, he was holding it up.

  If he looked away, if he thought of his lunch, did the car vanish?

  No. Sarah would say the driver perceives it. The asphalt perceives it. The traffic camera perceives it.

  But the traffic camera is just glass and silicon. Does it perceive? Or does it only record for a mind that looks later?

  Elias turned from the window. He picked up his keys. He had another appointment. A fire loss. A warehouse.

  "Hey," Sarah called out.

  Elias stopped.

  "You know," she said, not looking up from her screen. "If you stop signing, they'll fire you. And then someone else will sign. And the house will still have leaked."

  "I know," Elias said.

  "Just making sure you know the mechanics of it."

  "The mechanics are fine," Elias said. "It's the physics I'm worried about."

  He walked out to the parking lot. He got into his car. He put the key in the ignition.

  Before he turned it, he sat for a moment. He looked at the passenger seat. Empty.

  He thought about the warehouse. It was burned out. Blackened beams. Ash.

  He would walk through it. He would look at the charred remains of machines that hadn't worked in weeks. He would have to decide if they were destroyed by the fire, or if they were already scrap.

  He would have to decide if they existed before he walked in the door.

  He started the engine. The car vibrated. He put it in gear. He drove toward the warehouse.

  As he drove, he passed the building where the red sedan had turned. He didn't look. He kept his eyes on the road. He held the thought: *The car is there.*

  He felt the thought tremble. It was a thin wire holding up a heavy weight.

  He reached the warehouse. It was a brick shell. The door was open.

  Elias stepped inside. The air smelled of wet ash.

  He opened his clipboard. He looked at the first line. *Inventory Status.*

  He looked at the shadows in the corner. Something large lay under a tarp. It hadn't burned. The fire had stopped ten feet short of it.

  Had it been there during the fire? Or had the fire stopped *because* it was there? Or had he, by walking toward it, pulling it into his focus, caused it to have been there all along?

  He walked over to the tarp. He put his hand on the fabric.

  He didn't pull it back.

  He wrote: *Item obscured by debris. Status indeterminate.*

  He knew it was a cop-out. He knew Sarah would circle it in red. He knew Henderson would complain.

  But for that second, with his hand on the tarp, the object underneath was neither there nor not there. It was waiting for him to decide.

  He lifted the pen. He hovered it over the paper.

  He thought of the car behind the building. He thought of the pipe in the wall. He thought of the door at the end of the hall.

  He wrote *Present*.

  He closed the clipboard. The sound was like a gavel.

  He walked out to the car. He didn't look back at the warehouse. If he looked back, he might see it changing. He might see the ash settling differently.

  He drove away. In the rearview mirror, the warehouse disappeared behind a row of trees.

  Elias kept driving. He held the proposition that the warehouse was still there. He gripped the steering wheel. He drove as if the road continued even when the headlights didn't reach it.

  He drove carefully, as if he were the only thing keeping the asphalt from dissolving into the dark.
