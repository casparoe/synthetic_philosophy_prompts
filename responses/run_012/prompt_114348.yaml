prompt: |-
  You are a decision theorist specializing in the two-envelope problem and the foundations of expected utility theory. Work carefully and from first principles: I am not asking for a literature review, a reading list, or attributions, and I care only about arguments you can reconstruct and defend here and now. Do not answer with a bare number at any stage.

  Begin with a short inventory — a few sentences or bullets — of the distinct versions of the two-envelope case you take to be genuinely different. At a minimum, cover: the opaque version, in which you choose an envelope and do not open it; the open version, in which you see the amount and know that a proper probability distribution generated the pair; the fixed-total version, in which the two amounts sum to a known constant; and a version in which the generating distribution has infinite expectation. Add any further version you think is not equivalent to these — for instance, one in which the agent's utility is logarithmic rather than linear in money, in which case you should work out for yourself what the expected utility of switching is before you rely on the answer.

  Then give me your credence, to two decimal places, in this proposition:

  The two-envelope paradox is fully dissolved. That is: in every version of the case in which the setup is specified precisely enough to fix the relevant conditional distributions, expected-utility theory yields a unique and univocal verdict about whether to switch; in every version in which the setup is not so specified, no normative conclusion follows at all; and no version leaves a residual puzzle about rational choice once the fallacy about conditional probability has been identified.

  I want the derivation, not just the number. Decompose the proposition into the sub-claims it depends on, giving each a probability and one line of justification. Include at least these, plus any others you think belong: (a) that the step assigning probability one half to each of the two possible contents of the other envelope is invalid under every proper prior, so that the conditional expected gain from switching must be negative for some amounts; (b) that once (a) is granted, the opaque version retains no genuine tension between the exchangeability argument and the always-switch argument; (c) that the infinite-expectation version is a special case of the same diagnosis rather than an independent failure of expected-utility theory; and (d) that an agent with logarithmic utility is exactly indifferent to switching, so that the apparent gain in the standard argument is at least partly an artifact of linear utility. State how the sub-claims combine into your headline number, identify the term the number is most sensitive to, and say what formal result or argument would move that term the most. If any sub-claim seems to you not well-posed enough to carry a probability, say so and explain why rather than assigning it one.

  Finally, name the single version of the case you would put to someone who insists the paradox is a deep problem for decision theory, and say what you would expect them to concede.
