answer: |-
  This slogan is indeed a chameleon. It shifts meaning depending on whether the speaker is doing philosophy of science, cognitive psychology, or sociology. The frustration you feel comes from the fact that the trivial versions are true but harmless, while the harmful versions are false or wildly overstated.

  Here is the menu of precise assertions hidden inside "all observation is theory-laden," ranked from trivial to radical, with verdicts and an analysis of whether they license the "you can't just look" conclusion.

  ### The Menu of Assertions

  #### 1. The Semantic Truism
  **Assertion:** To report an observation ("I see a thermometer"), you must possess the concepts required to describe it ("thermometer," "number," "scale"). Without the theory/concept, you cannot formulate the observation as evidence.
  *   **Verdict:** **True.** (You cannot think "that is a proton" without the concept "proton.")
  *   **Does it license "nobody can just look"?** **No.** It only means you can't *communicate* or *categorize* the look without concepts. It allows that the raw sensory input (the visual pattern) still happened.
  *   **Status:** Platitude.

  #### 2. The Attentional Filter (Top-Down Processing)
  **Assertion:** Your theories determine *where* you look, *what* you ignore, and what you count as relevant data. A psychoanalyst looks for slips of the tongue; a behaviorist looks for stimulus-response pairs. They are looking at the same person but "observing" different things.
  *   **Verdict:** **True.** (Well-supported by cognitive psychology.)
  *   **Does it license "nobody can just look"?** **Weakly.** It means observation is *selective*, not that it is *fabricated*. You can still "just look" at the thing you selected, but you might miss the gorilla in the room because your theory didn't predict it.
  *   **Status:** Robust empirical claim.

  #### 3. The Perceptual Penetration Claim
  **Assertion:** Your theories change the actual *phenomenology* of the experience (what it looks/feels like). An expert chess player doesn't just *interpret* the board differently; they literally *see* the threats differently than a novice. Beliefs penetrate early vision.
  *   **Verdict:** **Contentious.** (This is the "Cognitive Penetration of Perception" debate. Evidence exists—e.g., the Duck-Rabbit illusion, or experts seeing medical scans differently—but Fodor's modularity thesis argues early vision is encapsulated from belief.)
  *   **Does it license "nobody can just look"?** **Yes.** If this is true, there is no "neutral" sensory given. Two people with different theories have literally different visual experiences of the same object.
  *   **Status:** Plausible but often overstated.

  #### 4. The Epistemic Coherentism Claim
  **Assertion:** Observations cannot serve as an independent foundation to test theories because the *justification* for trusting the observation relies on the theory. (e.g., To trust the thermometer, you must trust the theory of thermodynamics that says it works). Therefore, observation cannot falsify theory in a clean way.
  *   **Verdict:** **Contentious.** (This is a Duhem-Quine/Popper/Kuhn point. It's true that instruments rely on theory, but false that this makes falsification impossible. We test clusters of theories, not single ones.)
  *   **Does it license "nobody can just look"?** **Yes, epistemically.** It means "looking" never provides a "God's eye view" verdict on a theory.
  *   **Status:** Standard philosophy of science.

  #### 5. The Radical Constructivist Claim
  **Assertion:** There is no mind-independent reality accessible to us. Observation is purely a social or linguistic construction. "Facts" are just solidified agreements among power structures.
  *   **Verdict:** **False.** (Self-defeating. If all observation is just power/theory, then the observation "all observation is theory-laden" is also just power/theory.)
  *   **Does it license "nobody can just look"?** **Yes, absolutely.** It dissolves the concept of "seeing" entirely into "interpreting."
  *   **Status:** Scorched-earth postmodernism.

  ---

  ### The Load-Bearing Step: From "Notice" to "Experience"

  You identified the exact pivot point: *the step from 'beliefs affect what you notice and how you talk about it' to 'beliefs affect what the experience is like.'*

  This is the difference between **Level 2 (Attentional)** and **Level 3 (Perceptual)**.

  *   **Level 2** says: Your theory tells your eyes where to point. (The camera is aimed by the operator).
  *   **Level 3** says: Your theory changes the image on the sensor. (The camera lens changes shape based on the operator's mood).

  **Why the slogan fails to earn this step:**
  Most proponents of the slogan slide from 2 to 3 without argument. They argue that because you need a concept to *describe* the sight (Level 1), the concept must have shaped the *sight itself* (Level 3). This is a category error.

  **The Verdict on the Step:**
  Current cognitive science (Predictive Processing) suggests a middle ground. The brain *does* generate predictions that shape early processing to save energy. So, Level 3 is **partially true**. However, it is not *infinitely* malleable. If you believe there is a wall in front of you, you will not have the visual experience of walking through it. The "theory-ladenness" has hard constraints imposed by the sensory input.

  When someone uses the slogan to imply you have **no access to reality**, they are assuming Level 3 is total and unconstrained. That is false.

  ---

  ### Which Reading is the Rationalist Using?

  When a "rationalist" (in the secular, Bayesian, or science-literate sense) drops this line on someone who says "I just saw it," they are almost always invoking **Level 4 (Epistemic Coherentism)** mixed with **Level 2 (Attentional)**.

  **What they mean:**
  "They are claiming their observation is a 'Theory-Stopper.' They think their sensory data is a brute fact that overrides my model. I am reminding them that their sensory data was processed by a brain that has priors, and the instrument they used relies on assumptions. Therefore, their 'just saw it' is not an absolute trump card."

  **Why it feels like a conversation-ender:**
  It is often used improperly as a **Level 5** shield.
  *   **Proper use:** "Your observation is weighted by your priors, so let's update both our models."
  *   **Improper use:** "Your observation is contaminated by theory, so it counts for nothing against my theory."

  In the bias experiment context you mentioned, the user was likely arguing that the participant's report ("I saw X") was contaminated by their expectation of the experiment's goal. This is a **Level 2/3** claim. If the participant expected to see bias, their perception might have been primed to find it.

  ### How to Push Back

  If you encounter this again, you can force precision by asking which level they mean:

  1.  **"Are you saying I need words to describe it, or that my eyes didn't work?"** (Distinguishes Level 1 from Level 3).
  2.  **"Does theory change where I look, or what hits my retina?"** (Distinguishes Level 2 from Level 3).
  3.  **"If all observation is theory-laden, is your theory that 'all observation is theory-laden' also just an observation laden with its own theory?"** (Tests for Level 5 self-defeat).

  **Summary Verdict:**
  The slogan is **true** as a warning against naive foundationalism (Level 4) and **true** as a description of attention (Level 2). It is **false** as a claim that we are trapped in a bubble of our own making with no causal contact with reality (Level 5). The move from "notice" to "experience" (Level 2 to 3) is an empirical question, not a philosophical axiom, and the slogan treats it as the latter.
