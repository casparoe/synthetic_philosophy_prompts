answer: |-
  **The Architecture of Approximation: Defending Truthlikeness Against the Partition Problem**

  The intuition that science progresses by getting closer to the truth is robust. It feels obvious that Einstein's general relativity is a better approximation of gravitational reality than Newton's universal gravitation, even if we grant for the sake of argument that future physics might prove Einstein wrong too. This intuition is the backbone of scientific realism. However, as you and your flatmate have discovered, formalising this intuition has been a disaster zone since Karl Popper's definition of verisimilitude was mathematically demolished in the 1970s. While Popper's technical failure is well-documented, your flatmate's objection is more insidious. He is arguing that the very concept of 'distance from truth' is ill-defined because it relies on arbitrary linguistic decisions. This is a variation of the 'language dependence' objection famously articulated by David Miller. If he is right, truthlikeness is not just difficult to measure; it is metaphysically incoherent.

  To evaluate this, we must first steelman your flatmate's position. The core of the partition-and-weighting worry is that theories are not monolithic blocks; they are aggregates of claims. To compare two false theories, one must determine which claims matter and how much they matter. Consider two false theories about the weather, $T_1$ and $T_2$. $T_1$ gets the temperature right but the humidity wrong; $T_2$ gets the humidity right but the temperature wrong. Which is closer to the truth? The answer depends on whether you prioritise temperature or humidity. If you define the 'state of the weather' as a conjunction of atomic propositions, you can logically reconfigure those propositions into new predicates (e.g., 'tempidity', a function of temperature and humidity) such that the truth-value distribution flips. Miller showed that for any two false theories, there is a linguistic framework in which $T_1$ is closer to the truth, and another in which $T_2$ is closer.

  Your flatmate extends this beyond logic to weighting. Even if we agree on the partition of claims, how do we weight them? Is getting the mass of the electron right more important than getting the charge right? If truthlikeness is to explain scientific progress, it cannot be that the electron's mass is more important simply because we *say* it is. There must be a fact of the matter about which errors are more grievous. If the weighting is subjective or language-relative, then 'closeness to truth' collapses into 'closeness to our current interests'. This renders truthlikeness useless for the realist, who wants to say science converges on reality, not merely on our preferred descriptions of it.

  The standard defence against this involves moving from logical content to semantic similarity. Philosophers like Ilkka Niiniluoto and Graham Oddie developed 'similarity metrics' to replace Popper's logical counting. Instead of counting true/false sentences, we map the possible states of the world into a conceptual space and measure the geometric distance between the theory's prediction and the actual state. This handles some of Popper's issues, but it does not fully silence your flatmate. The construction of the similarity space still requires choosing dimensions. Why is the space defined by mass and charge rather than 'mass-charge' and 'mass-plus-charge'? If the dimensions of the space are determined by our language, Miller's objection returns. The formal accounts patch the logical holes but leave the metaphysical foundation exposed.

  However, there is a reply that goes deeper than formalism, one that you hinted at with your mumbling about 'natural kinds'. The defence of truthlikeness requires abandoning the idea that theories are primarily linguistic entities. The partition problem only arises if we assume the world is carved up by our predicates. The realist must argue that the world comes with its own carving. If natural kinds and causal structures exist mind-independently, then there is a privileged partition. Temperature is a more weighty parameter than 'tempidity' because temperature corresponds to a real physical magnitude (mean kinetic energy), whereas 'tempidity' is a gerrymandered linguistic construct.

  On this view, truthlikeness is not a relation between sentences and the world, but between the *structural map* provided by a theory and the *causal structure* of the world. A theory is closer to the truth if it preserves more of the causal relations that actually obtain. Phlogiston theory failed not just because it posited a substance that didn't exist, but because its causal model of combustion was structurally dissimilar to the oxidation process. Oxygen theory captured the causal structure. The weighting is not arbitrary because causal powers are not equally distributed; some properties do more causal work than others. This moves the debate from logic to metaphysics. It concedes that truthlikeness cannot be defined in a vacuum but insists that science is not conducted in a vacuum. It is conducted in a world that resists certain descriptions and favours others.

  Does this save the realist's story about progress? Yes, but it modifies it. The story is no longer that we are accumulating more true sentences. It is that we are refining our map of the causal structure of the world. We can say that modern chemistry is closer to the truth than alchemy because its theoretical terms latch onto real causal powers (electrons, bonds) rather than occult qualities. This allows for the 'creeping closer' narrative even if current theories are strictly false (e.g., if quantum mechanics is eventually superseded). As long as the successor theory preserves the causal structure of the predecessor in the relevant domains, progress is maintained. This aligns closely with Structural Realism, but it retains the 'truthlikeness' terminology by defining truth as structural correspondence.

  I must flag two points where this defence is vulnerable. First, it relies heavily on the existence of mind-independent natural kinds. If one is a nominalist or believes our conceptual schemes are inescapably pragmatic, the 'privileged carving' disappears, and the flatmate wins. Second, even granting natural kinds, translating 'causal similarity' into a rigorous metric of 'distance' remains notoriously difficult. We can say qualitatively that Theory A is structurally better than Theory B, but quantifying *how much* closer is still fraught with difficulty.

  Nevertheless, the flatmate's objection, while logically sound against linguistic accounts, fails against metaphysical ones. It assumes that language is the medium of science, whereas the realist argues language is merely the tool. If the tool is judged by how well it manipulates the material, the material itself dictates the standards of success. To deny truthlikeness is to deny that there is any sense in which a map can be more or less accurate, which leads to a paralysis where we cannot distinguish between a map of London and a map of Paris based on anything other than convention.

  Verdict: Truthlikeness survives as a legitimate aim of science, but only if reconceived as a measure of structural correspondence to causal powers rather than logical proximity to true propositions.
