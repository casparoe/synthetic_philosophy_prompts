  My flatmate and I have been going at this for about three weeks now and I've run out of steam, so I'm outsourcing the judgement call. Backstory: we're both in a philosophy of science reading group that's been working through scientific realism, and the thing we keep tripping over is truthlikeness — the idea that a false theory can still be closer to or further from the truth than a rival, and that getting closer to the truth is part of what science is actually for. We both know the classic technical objection, i.e. that Popper's own definition of verisimilitude turns out to collapse when you apply it to theories that are false, which is old news at this point. My flatmate's objection is looser and, I think, nastier. He says that any time you genuinely try to compare two false theories, the answer depends entirely on how you carve the theories up into individual claims and how you weight those claims, and since there's no privileged carving, there's no fact of the matter about which theory is closer to the truth — you can rig a partition that flatters whichever theory you fancied in the first place. I definately think he's overreaching, but every time I try to say why I end up mumbling about 'natural kinds' and hoping nobody asks me to actually produce one.

  So: write me an essay on this. Lay out the strongest version of his partition-and-weighting worry, give the best replies on the other side (I'm aware there are formal accounts that try to patch this up with similarity metrics and the like, so bring those in, but don't just list them — say whether they actually answer him), and then commit. I want a verdict on whether truthlikeness can survive as a legitimate aim of science, and if it can, in what form: a repaired formal account, a frankly framework-relative notion that only gets defined inside a given language or conceptual scheme, or something else entirely. Also say what your verdict does to the realist's story that science has been creeping closer to the truth over time — if you think truthlikeness is incoherent, does the realist lose that story, or can they get by without it? Don't hedge at the end or hand me a menu of options; pick one and defend it. Flag the one or two steps where you'd be least confident if pushed. British spelling please, and finish with a single line beginning 'Verdict:' that states your conclusion in one sentence.
