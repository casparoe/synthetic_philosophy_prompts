answer: |-
  **MEMORANDUM**

  **TO:** Long-Term Stewardship Committee
  **FROM:** [Your Name]
  **DATE:** Wednesday, [Date]
  **SUBJECT:** Recommendation on Discount Rate Methodology and Funding Obligation

  **Executive Summary**
  To resolve our deadlock, I recommend we adopt a **declining discount rate schedule** for liability valuation, paired with a **market-rate investment strategy** for the fund's assets. Specifically, we should discount near-term liabilities (0–30 years) at 3.5%, declining stepwise to a floor of 1.0% for costs beyond 100 years. This approach satisfies the fiduciary duty to current taxpayers while honoring the statutory mandate to protect future generations in perpetuity.

  **1. Engaging the Opportunity Cost Argument (The "Dana" Position)**
  The argument that we must use the market rate (e.g., 4% real) as our discount rate rests on a category error. We must distinguish between the **return on assets** and the **social discount rate for liabilities**.

  *   **Assets:** I agree entirely that the fund should be invested to achieve the market rate of return (currently ~4% real). To do otherwise *would* be a hidden tax on the current generation, as we would be leaving idle capital that could offset future tax burdens.
  *   **Liabilities:** However, the rate at which we *discount future damages* is an ethical parameter, not a financial one. Using a 4% discount rate for liabilities implies that a unit of environmental damage in 2200 is worth less than 1% of a unit of damage today. Given our statutory mandate to treat acid drainage "basically forever," this effectively authorizes us to default on the problem once the present committee members are dead.

  By investing at the market rate (4%) but discounting liabilities at a lower social rate (e.g., 1–3%), we create a prudent safety margin. The fund grows faster than the present value of the liability increases, ensuring solvency without requiring us to devalue the health of future citizens.

  **2. The Actuary's Decomposition: Ethical Constraint, Not Shell Game**
  Our actuary proposes splitting the rate into "pure impatience" ($\rho$) and "existence risk" ($\delta$). Dana is mathematically correct that $r = \rho + \delta$ yields the same arithmetic as a single rate. However, the decomposition is vital for policy legitimacy.

  *   **Pure Impatience ($\rho$):** For intergenerational projects, standard welfare economics (e.g., the Stern Review) dictates $\rho = 0$. We have no ethical right to value our consumption over our descendants' survival simply because we are born earlier. I urge the committee to formally adopt $\rho = 0$.
  *   **Existence Risk ($\delta$):** I caution against using "state non-existence" as a discount factor. If the state ceases to exist, the liability does not vanish; the environmental catastrophe simply goes unmanaged. Instead, we should treat this component as **parameter uncertainty**. We do not know what the economy or technology will look like in 200 years.

  **3. Why a Declining Schedule is Not Arbitrary**
  The suggestion to use a declining rate is theoretically robust, not arbitrary. When there is uncertainty about what the correct long-term discount rate *should* be, the mathematically correct "certainty equivalent" discount rate declines over time (the Weitzman Effect).

  If we are unsure whether the appropriate rate is 1% or 5%, the distant future should be discounted at the lower bound, because the high-rate scenarios discount the future to zero so quickly they cease to matter. A declining schedule acknowledges that while we know the market rate today, we cannot claim knowledge of the social trade-offs of the 22nd century.

  **Concrete Recommendation**
  I move we adopt the following parameters for the funding formula:

  1.  **Discount Schedule:**
      *   Years 0–30: **3.5%** (Aligns closely with current market expectations, respecting current taxpayers).
      *   Years 31–75: **2.5%**
      *   Years 76+: **1.0%** (Ethical floor for perpetual stewardship).
  2.  **Investment Mandate:** The fund shall be invested in a diversified portfolio targeting a real return of **4.0%+**.
  3.  **Review:** The schedule shall be reviewed every 10 years to adjust for changes in long-term bond yields and economic growth forecasts.

  **Conclusion**
  This approach splits the difference without compromising the mission. It accepts the market's power to grow the fund (addressing opportunity cost concerns) but rejects the market's authority to value human health across centuries (addressing stewardship concerns). It allows us to bank a specific, defensible number today that ensures we do not hand the next dozen generations poisoned water.

  I look forward to voting on this framework Thursday.
