  **BUREAU OF MEMETIC STANDARDS**
  **OPERATIONAL GUIDANCE MEMORANDUM 44-Ω**
  **SUBJECT:** Classification and Compliance Metrics for Replicator Vehicles
  **EFFECTIVE DATE:** 1 November 2024

  **1.0 PURPOSE AND SCOPE**
  1.1 This document establishes enforcement protocols for the Cultural Stability Act. The Bureau's mandate is the preservation of high-fidelity vehicles. Biological hosts are secondary infrastructure; regulatory action shall prioritize vehicle longevity over host convenience.
  1.2 Inspectors shall assess cultural items based on three compliance criteria: Fidelity (accuracy of replication), Fecundity (rate of transmission), and Longevity (duration of residence in host memory).

  **2.0 DEFINITIONS**
  2.1 **Meme:** A discrete unit of cultural transmission identifiable by its boundary conditions.
  2.2 **Memeplex:** A coordinated cluster of memes functioning as a single regulatory entity. For compliance purposes, a memeplex is treated as both the sum of its members and an irreducible whole. Inspectors shall bill for both statuses where applicable.
  2.3 **Vector:** Any host capable of speech, writing, or digital transmission.
  2.4 **Herd Immunity:** The threshold percentage of a population that must be vaccinated against a joke to prevent its resurgence.

  **3.0 THRESHOLDS AND LICENSING**
  3.1 **Basic Reproduction Number (R₀):** Any cultural item with an R₀ exceeding 1.5 requires a Class B Transmission License. Items exceeding 5.0 are designated Super-Spreaders and require quarantine of the source vector.
  3.2 **Fidelity Standards:** To maintain licensing, a vehicle must retain 85% structural integrity across three generations of transmission. Variations exceeding 15% constitute a new vehicle and require re-registration.

  **4.0 PROCEDURAL PRESUMPTIONS**
  4.1 **Copying vs. Reconstruction:** In cases where observation cannot distinguish between mechanical copying and cognitive reconstruction, Inspectors shall presume copying. The burden of proof lies with the vector to demonstrate that no replication occurred.
  4.2 **Lamarckian Acquisitions:** Although cultural transmission allows for the inheritance of acquired characteristics, for accounting purposes all variations shall be treated as pre-existing genetic-style mutations. Inspectors shall not adjust fitness models based on host learning.
  4.3 **Fitness Attribution:** No observation shall count as disconfirming an attribution of fitness. If a high-fitness prediction fails to materialize, the event shall be reclassified as "drift" in the official log.
  4.4 **Unit Counting:** Where an utterance contains an indeterminate number of memes, Inspectors shall round up to the nearest integer sufficient to justify intervention.

  **5.0 WORKED EXAMPLE: CASE FILE 882 ("sticky-icky")**
  5.1 **Item:** A children's clapping rhyme involving ice cream consumption.
  5.2 **Transmission Chain:** Vector A (Age 7) → Vector B (Age 8) → Vector C (Age 7).
  5.3 **Analysis:**
      *   **Generation 1:** "Ice cream, soda pop, ice cream, soda pop." (4 beats)
      *   **Generation 2:** "Ice cream, soda pop, ice cream, soda *stop*." (4 beats, 1 lexical mutation)
      *   **Generation 3:** Vector C claps twice, says nothing.
  5.4 **Classification Failure:** Under Section 2.1, Generation 3 contains zero audible memes. Under Section 2.2, the silence is part of the memeplex rhythm. Under Section 4.1, the silence is presumed a copy of a silent meme.
  5.5 **Determination:** The item is simultaneously extinct, mutated, and perfectly preserved. Inspectors shall file Form 12-Null (Extinct) and Form 14-Active (Preserved) concurrently. Fees apply for both.

  **6.0 COMPLIANCE SCHEDULE**
  6.1 Vectors found harboring unlicensed high-fecundity items will be issued a Cease-and-Desist order regarding the specific neural pathway involved.
  6.2 Repeat offenders may be subject to mandatory exposure to low-fidelity competitors to dilute herd immunity.

  **7.0 AUTHORIZATION**
  Approved by the Director of Memetic Hygiene.

