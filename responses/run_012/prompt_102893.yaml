answer: |-
  You have a sharp ear for legal rhetoric, and your friend is only half-right. The Hart–Devlin debate (1959) is the grandfather of this conversation, but you are correct to feel it doesn't quite fit. Devlin argued that society has a *right* to enforce shared morality to prevent disintegration. Your legislators aren't arguing from the *right* to enforce morality; they are arguing from the *consequences* of failing to enforce it. They are making a sociological prediction, not a moral decree.

  There is no single, canonical Latin name for this specific move (like *ad hominem* or *straw man*), because it sits at the intersection of legal theory, sociology, and bioethics. However, in academic literature, it is most often categorized under the **Expressive Theory of Law** or the **Social Meaning Argument**.

  But those are broad categories. For the specific mechanism you've identified—where the harm is constituted by the *loss* of the arguer's own disapproval—I propose we call it:

  ### **The Endogenous Stigma Claim**

  (Or, for your character's dialogue: **"The Normative Shield Argument."**)

  Here is the carving you asked for. This is the anatomy of the move, designed so your character can dissect it on the page.

  ---

  ### 1. What It Is (The Mechanism)
  The argument relies on the **Expressive Function of Law**. This is the theory that law doesn't just regulate conduct; it signals values.
  *   **The Claim:** Criminalization creates a "normative shield" (stigma/shame) that protects vulnerable people from being pressured into the act.
  *   **The Prediction:** Legalization $\rightarrow$ Normalization $\rightarrow$ Erosion of Stigma $\rightarrow$ Vulnerable people are exposed to coercion.
  *   **The "Harm":** The harm is not the act itself (selling a kidney); the harm is the *social context* in which the act becomes thinkable.

  ### 2. What It Is Not (The Edges)
  *   **It is not Hart–Devlin:** Devlin argued, "This is sinful, so it must be banned." The Endogenous Stigma Claim argues, "This might be harmless in a vacuum, but our *reaction* to it makes it dangerous." It masquerades as concern for the vulnerable, not concern for God or tradition.
  *   **It is not a plain Appeal to Morality:** A moral appeal says, "X is wrong." This argument says, "X is dangerous *because we think it's wrong*." It admits the wrongness is subjective but treats it as an objective force of nature.
  *   **It is not (quite) a Slippery Slope:** A classic slippery slope says, "If we allow A, logic compels us to allow B (e.g., if we allow assisted suicide, soon we'll kill the disabled)." The Endogenous Stigma Claim says, "If we allow A, the *nature* of A changes." It's not about scope expansion; it's about **quality erosion**.

  ### 3. The Logical Flaw: "Normative Endogeneity"
  This is the part that nags you, and it is the lever your character can pull.
  In economics, a variable is **endogenous** if it is determined by factors within the model, rather than outside forces.
  *   **The Trick:** The arguer treats "social stigma" like weather—an external force that will inevitably fade if the law changes.
  *   **The Reality:** Social stigma is **endogenous** to the arguers. *They* are the weather. The stigma exists only because people like the arguer refuse to tolerate the act.
  *   **The Contradiction:** They are saying, "We must keep this illegal because if we don't, *people like us* will stop shaming it, and that will hurt people." They are claiming that their own future tolerance is a natural disaster they cannot control.

  ### 4. How Your Character Can Answer It
  If your character wants to dismantle this without sounding like a libertarian ideologue, she shouldn't attack the goal (protecting the vulnerable). She should attack the **mechanism of protection**.

  **A. The "Hostage" Objection**
  > "You're saying the only thing standing between a poor woman and exploitation is your disapproval of her. You are effectively holding the vulnerable hostage to your own prejudice. You're saying, 'We must keep the gun pointed at her head, because if we lower it, someone else might shoot her.' That isn't protection; that's a threat."

  **B. The "Endogeneity" Objection (The precise cut)**
  > "You're treating social shame like gravity, as if it's a force of nature that just happens. But shame is a choice. *Your* choice. You're telling this committee that if the law changes, *you* will stop caring, and because *you* stop caring, people will suffer. Why is your future indifference a prediction instead of a decision? If the stigma is necessary, keep the stigma. Don't use the law to do the work of your own conscience."

  **C. The "Cost of the Shield" Objection**
  > "Even if you're right—even if legalization reduces shame and increases pressure—you're arguing that we must criminalize the few to protect the many. You're willing to jail a consenting adult to send a message to a coercive uncle. That's using the prisoner as a billboard. If coercion is the harm, ban the coercion. Don't ban the act and pretend the ban is a shield."

  ### 5. Why This Matters for Your Book
  This argument is potent because it is **paternalistic without being moralistic**. It allows a legislator to sound compassionate ("I'm worried about the poor!") while maintaining restrictive control. It is the favorite argument of the "soft conservative" or the "cautious liberal."

  By naming it **The Endogenous Stigma Claim**, your character signals that she understands the machinery. She isn't just saying "You're wrong"; she's saying, "I see how you're building this trap, and I see that you are the one holding the rope."

  ### Summary for your notes:
  *   **Formal Name:** Variant of the *Expressive Theory of Law* / *Social Meaning Argument*.
  *   **Common Label:** *The Normalization Objection*.
  *   **Precise Coinage:** *The Endogenous Stigma Claim*.
  *   **The Flaw:** *Normative Endogeneity* (treating a social choice as an inevitable consequence).
  *   **The Rebuttal:** Don't criminalize the act; criminalize the coercion. Don't outsource your conscience to the penal code.

  This gives your character the vocabulary to fight the *structure* of the argument, not just the conclusion. It makes her look like someone who has read the testimony, understood the subtext, and found the seam.
