answer: |-
  The first voice counts the steps upon the floor,
  And finds no boot has blocked the factory door.
  "The manager passed by and did not steer
  My course away; the labor did not stop.
  Since no one interfered, I count myself free."
  The second voice asks who commands the wheel,
  "Is it your reason, or necessity?
  To serve a wage is not to truly feel
  Your own command within the acting hand."
  The third voice watches where the boss stands still,
  Who never spoke a word of ban or law,
  Yet holds the power to dismiss at will.
  The door stands open, unlatched, unbarred, true,
  But fitted with a lock he keeps alone.
  You are not free because he lets you be,
  But only if the key is not his own.
  For liberty dies not when chains are struck,
  But when the door stays lockable by whim.

  **Note on Voices**
  Lines 1–5 belong to the negative liberty voice, defining freedom strictly by the absence of actual interference (the unblocked door and the non-intervening manager). Lines 6–9 belong to the positive liberty voice, shifting the metric to internal self-mastery and who truly commands the agent's will. Lines 10–18 belong to the republican voice, which secures the final argument by focusing on the structural relationship rather than the outcome; it highlights that the worker remains unfree not because the manager interfered (he did not), but because the manager retained the arbitrary capacity to interfere (the lockable door), thereby establishing domination even in the absence of coercion.
