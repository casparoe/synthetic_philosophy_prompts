  ### The Principle: Inalienable Human Dignity and Non-Commodification

  The principle that best captures your list of verdicts is a form of **Legal Moralism grounded in Human Dignity**, specifically the **Non-Commodification of the Person**.

  **The Core Rule:** The law protects individual autonomy *except* when the exercise of that autonomy treats the human body, personhood, or human remains as a commodity, an object, or a mere means to an end. Consent is valid only when it respects the inherent status of the person as a rights-bearer.

  **How it fits your verdicts:**
  *   **Lawful (Autonomy respected):**
      *   *Doctor-assisted suicide:* Preserves dignity against undignified suffering; the body is not a commodity but a vessel of experience being mercifully released.
      *   *Incest:* Private autonomy; no commodification or procreation involved.
      *   *Heroin use:* Private self-harm; the body is damaged but not sold or objectified.
      *   *Boxing:* A socially regulated exception where risk is accepted for sport, not for the purpose of destroying the person as an object.
      *   *Nudity:* Contextual decency; the body is displayed but not sold.
  *   **Unlawful (Dignity/Status violated):**
      *   *Duel/Cannibalism:* Treats human life as disposable for honor or consumption (objectification).
      *   *Amputation:* Treats the body as a fetish object to be altered for pleasure rather than health.
      *   *Kidney Sale:* Commodifies body parts; turns the person into a marketplace.
      *   *Corpse Display:* Violates the sanctity of human remains; treats the dead as advertising objects.
      *   *Bestiality:* Violates the natural order and dignity of the human species.

  ### Verdicts You Must Give Up

  To maintain logical consistency with this principle, you face tension in two areas. You would likely be forced to revise one of the following:

  1.  **Private Heroin Use (High Confidence):** This is the strongest inconsistency. If selling a kidney is unlawful because it harms the integrity of the self and treats the body as a resource, then systematically destroying the brain and body with heroin should also be unlawful. Your principle protects the *status* of the person; addiction degrades that status just as surely as sale does. To be consistent, you should deem hard drug use unlawful.
  2.  **Consensual Blinding/Boxing (Medium Confidence):** If elective amputation is unlawful because it is "maiming," then a consensual fight resulting in permanent blindness is also maiming. The "Sport" exception is culturally contingent. A strict application of the Dignity Principle suggests that intentional permanent injury should be unlawful regardless of the sporting context.

  **Most Likely Sacrifice:** **Private Heroin Use.** Given the moral weight you place on corpses, animals, and body parts, your intuition leans toward protecting the *sanctity* of the human vessel. Allowing its chemical destruction while forbidding its sale is a contradiction in a Dignity-based framework.

  ### Prediction for an Unlisted Case

  **Case:** **Commercial Surrogacy.** (A woman is paid to carry a child for another couple, surrendering the baby upon birth.)

  **Prediction:** **Unlawful.**

  **Reasoning:** Under the Principle of Non-Commodification, reproductive capacity and the resulting child cannot be treated as a service or product. Just as you cannot sell a kidney (body part), you cannot rent a womb (body function) or sell the rights to a child (personhood). This treats the woman and the child as means to an end, violating the same dignity constraints as the kidney sale and the corpse display.

