  *   **Q5 (State Role):** **Actively Foster** (She supports a structured market economy, not anarchy).
  *   **Result:** **Leaf 5 (Centre-Right Liberal)**.
  *   *Note: This explains why she is "conservative" to your Massachusetts cousins (Leaf 7) but "liberal" to herself.*

