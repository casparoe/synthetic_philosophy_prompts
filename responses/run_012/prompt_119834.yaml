answer: |-
  # The "Liberal" Classification Tree

  **Instructions:** Start at **Q1**. Answer based on observable statements, voting records, or policy positions. Follow the branch until you reach a **Leaf**.

  **Q1: Regime vs. Policy**
  Is the speaker defending constitutional limits, rule of law, and rights against authoritarianism (e.g., Orbán, Erdoğan), regardless of specific economic policies?
  *   **Yes** → **Leaf 1: Liberal Democracy** (Political Science sense; opposite is autocracy).
  *   **No** → Go to **Q2**.

  **Q2: Culture vs. Economics**
  Is the term used primarily to describe social temperament (tolerant, open-minded, secular) without specific commitment to tax or market structures?
  *   **Yes** → **Leaf 2: Social/Cultural Liberal** (HR/Workplace sense).
  *   **No** → Go to **Q3**.

  **Q3: Self vs. Adversary**
  Is the word being used as a badge of honor by the speaker, or as a label for an opponent whose policies they reject?
  *   **Label for Opponent** → **Leaf 3: Pejorative "Neoliberal"** (Latin American/Southern European usage; implies austerity/globalization).
  *   **Badge of Honor** → Go to **Q4**.

  **Q4: Market Faith**
  Does this person believe unrestricted markets generally maximize freedom and welfare, or do markets require correction to ensure justice?
  *   **Maximize Freedom (Pro-Market)** → Go to **Q5**.
  *   **Require Correction (Market-Skeptic)** → Go to **Q6**.

  **Q5: State Role (Pro-Market)**
  Should the state be minimized to only protecting rights/property (nightwatchman), or should it actively foster business competitiveness and social order?
  *   **Minimized** → **Leaf 4: Libertarian/Classical Liberal**.
  *   **Actively Foster** → **Leaf 5: Centre-Right Liberal** (European VVD/FDP, Australian Liberal Party).
      *   *Note: Leaf 5 and Leaf 6 are often indistinguishable in practice.*

  **Q6: State Role (Market-Skeptic)**
  Is the state's primary economic job to enforce fair competitive rules (framework) or to redistribute resources and ensure equity (outcomes)?
  *   **Enforce Rules** → **Leaf 6: Ordoliberal** (German sense; state polices competition + safety net).
      *   *Note: Leaf 5 and Leaf 6 are often indistinguishable in practice.*
  *   **Redistribute/Equity** → Go to **Q7**.

  **Q7: Reform vs. Transform**
  Is the political goal to manage capitalism to ensure fair opportunity, or to transform structural power hierarchies?
  *   **Manage Capitalism** → **Leaf 7: American Modern / Social Liberal** (US Democratic mainstream).
  *   **Transform Hierarchies** → **Leaf 8: Progressive** (US sense; explicitly distinct from "Liberal").

  **Failure Modes (Incoherent/Unexplored)**
  *   If **Q4=Maximize** but demands state control of culture → **Leaf 9: Illiberal Liberal** (Incoherent; logically unstable).
  *   If **Q6=Redistribute** but rejects democratic limits → **Leaf 10: Authoritarian Left** (Not liberal in any sense).
  *   If answers shift depending on which party holds power → **Leaf 11: Tribal Partisan** (Word has no semantic content).
  *   If speaker cannot distinguish between Q5 and Q6 → **Leaf 12: Unexplored/Blurred** (Instrument failure).

  ***

  ### Analysis of Failure Modes

  **Indistinguishable Leaves:**
  **Leaf 5 (Centre-Right Liberal)** and **Leaf 6 (Ordoliberal)** are the shakiest distinction. Both advocate pro-market policies with a state framework. In coalition politics (e.g., Germany's FDP), they often occupy the same space. The tree separates them based on *rhetorical emphasis* (competitiveness vs. fair rules), but empirically, their voting records overlap significantly.

  **Load-Bearing Branch:**
  **Q4 (Market Faith)** does the most work. It separates the classical tradition (Europe/Australia/Libertarians) from the modern welfare-state tradition (US/Scandinavia). Without this split, the Dutch friend and the Massachusetts cousin collapse into the same node, which contradicts reality.

  **What Would Change the Tree:**
  If "liberal" ceases to be an economic category and becomes purely cultural (e.g., if all market believers call themselves "conservatives" and all market skeptics call themselves "liberals"), **Q4** becomes obsolete. The tree would then pivot entirely on **Q2** (Culture) vs. **Q7** (Transformation).

  ***

