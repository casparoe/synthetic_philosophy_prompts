answer: |-
  **The Moloch Thesis in Game-Theoretic Vocabulary**

  Consider a non-cooperative game with $N$ players (firms, nations, agents). Each player $i$ chooses a strategy $s_i$ from a set $\{C, D\}$, where $C$ represents maintaining standards (cooperation) and $D$ represents cutting corners to gain competitive advantage (defection).

  Payoffs $\pi_i(s_i, s_{-i})$ are structured such that $D$ is a dominant strategy: regardless of what opponents $s_{-i}$ do, $\pi_i(D, s_{-i}) > \pi_i(C, s_{-i})$. This creates a unique Nash equilibrium where all players choose $D$. This equilibrium is Pareto inefficient; there exists a profile $(C, C, ..., C)$ where every player receives a higher payoff, but it is not stable because any unilateral deviation to $D$ yields a higher individual payoff.

  In a repeated game setting, cooperation could theoretically be sustained via trigger strategies if the shadow of the future is sufficiently long (high discount factor). However, the Moloch thesis argues that competitive pressure increases the immediate payoff of $D$ or raises the discount rate (survival risk), making cooperation unsustainable. Consequently, the system converges to the Pareto-dominated equilibrium.

  **Residue Report**

  **What Maps Cleanly:**
  The core logic is an $N$-player Prisoner's Dilemma. The claim that "nobody wants the outcome" maps directly to the definition of a Nash equilibrium: no player chooses the equilibrium profile; they choose best responses, and the profile emerges as a consistency condition. Pareto inefficiency captures the "race to the bottom" where everyone is worse off than if they had coordinated.

  **What Maps Only with Distortion:**
  *   **Rationality:** Standard game theory assumes players optimize given beliefs. Moloch implies a structural force that punishes even those who *want* to cooperate, suggesting the payoff structure itself is coercive rather than just incentivizing.
  *   **Static vs. Dynamic:** Standard Nash equilibrium is static. Moloch describes a process where the trap tightens. To model this, you need **Evolutionary Game Theory** (flagged per request): strategies yielding higher short-term payoffs increase in frequency within the population. As the proportion of $D$-players grows, the payoff for remaining $C$-players decreases, forcing them to switch or exit.

  **What Has No Counterpart:**
  *   **Agent Elimination:** Standard games assume a fixed set of players. Moloch implies that players who choose $C$ are removed from the game (bankruptcy, extinction). This is selection, not just equilibrium.
  *   **Normative Values:** Game theory treats payoffs as exogenous preferences. Moloch treats certain values (safety, beauty, ethics) as objectively valuable but systematically pruned by the payoff structure. GT cannot distinguish between "profit" and "value" unless encoded in the utility function.

  **Testing Your Three Claims**

  **(1) Nobody's Choice vs. Equilibrium Knowledge**
  The Moloch claim that "nobody decides" the bad outcome survives translation well. A Nash equilibrium does not require players to know they are in one, nor to intend the aggregate outcome. It only requires that each player's strategy is a best response to the others. The "trap" is simply the intersection of best-response functions. However, Moloch adds a layer of *ignorance*: often players don't even perceive the game structure, whereas standard GT assumes the payoff matrix is known.

  **(2) One Game vs. Process/Game Selection**
  "Multipolar" is not just about $N > 2$; it is about the breakdown of coalition enforcement. As $N$ increases, monitoring deviations becomes costly, and the impact of any single player's cooperation on the aggregate outcome diminishes (free-rider problem intensifies).
  Regarding the trap worsening: Standard GT cannot say this without modification. In a static game, payoffs are fixed. To capture "worsening," you must model a dynamic process where the success of $D$ strategies alters the environment (e.g., lowering market prices), effectively changing the payoff matrix for the next round. This requires **Evolutionary Game Theory** or a dynamic game with state-dependent payoffs. The vocabulary handles this, but only if you move beyond static Nash equilibrium.

  **(3) Tragedy of the Commons vs. Prisoner's Dilemma**
  It is structurally a Prisoner's Dilemma (PD) applied to a Tragedy of the Commons (ToC) setting.
  *   **PD:** Captures the incentive structure (dominant strategy to defect).
  *   **ToC:** Captures the resource context (rivalrous consumption of a public good).
  *   **What Both Miss:** Both standard models assume players remain in the game despite low payoffs. Moloch implies *selection*: cooperators are eliminated. A standard PD predicts everyone gets low payoffs; Moloch predicts only the defectors survive to play again. This evolutionary selection pressure is the critical addition both standard models lack.

  Verdict: Evolutionary stable strategy in an N-player Prisoner's Dilemma. Biggest loss: The normative claim that sacrificed values are intrinsically good rather than mere utility parameters.
