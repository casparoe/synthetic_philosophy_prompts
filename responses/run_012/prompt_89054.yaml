prompt: |-
  I've been asked to run a ninety-minute session — whiteboard, no slides — on the naturalism-versus-normativism debate about health and disease, in a medical humanities elective that's open to the whole university. The room is about a third clinical students and two-thirds humanities students, almost none of whom have read any philosophy of medicine, and they arrive holding opposite dogmas: the clinicians think a disease is a fact about a body that a pathologist could in principle settle, the humanists think calling something a disease is obviously a social judgment, and each side reads the other as either naive or sentimental. I don't want the explanation itself; I want a plan for teaching it. What has to be in place before the question even looks like a real question rather than a fight about words? Which pieces depend on which — specifically, when the notion of a species-typical function has to arrive, whether the evaluative element in harm can be introduced before the naturalist position has been stated at full strength or only after it has, and where the hybrid positions (the ones that keep a biological dysfunction condition and add a harm condition) belong in the arc: before the students have felt the pull of either pure position, or after, and what each ordering buys me? And what should I openly refuse to cover at this level, saying so out loud?

  For the case that carries the session, my sister, who is a GP, has given me one, and I need you to tell me honestly whether it can bear the weight. Two men in their early fifties come in during the same week; both had a scan for an unrelated complaint, and both turn out to have the same incidental structural anomaly in the heart muscle; both are asymptomatic, both sail through an exercise test, both have the same numbers on every measure of how their bodies currently perform. The only difference is that one of them has a relative who dropped dead at thirty, and the other does not. My sister says the two men leave with the same sentence in their charts and utterly different standing as patients: one is now a cardiac patient for life, the other is a man with an interesting variant. Nothing in either body distinguishes them. Is this the right carrying case — what does it have to have, and what must it conspicuously lack, for the group to feel the naturalist's discomfort and the normativist's temptation without my having rigged it? Does it smuggle in the verdict by calling the finding an anomaly in the first place? And what second case should I pair it with, so that the naturalist isn't left looking like a straw man by the end of the hour?

  I expect at least these misconceptions and want to know which are genuine misconceptions rather than defensible readings: that normativism means any condition a society dislikes is thereby a disease; that naturalism is the safe view because it merely reports the biology and leaves values out; that value-laden means arbitrary; and that disease and illness are interchangeable. Tell me where in the sequence each will form, which one I should let stand for a while rather than correct on the spot, and which will be manufactured by my own framing rather than by the students. I also want to hand the room a two-question test to apply to any candidate disease — is some bodily process going wrong by the standards of how bodies of this kind work, and is that going wrong a misfortune for the person living this life — and I suspect that scaffold quietly leans normativist; tell me whether it begs the question against the naturalist by assuming the two questions can come apart, and if it does, what to replace it with. Finish with the question I should put to the room in the last ten minutes that would reveal whether they've grasped the structure of the dispute rather than memorized a side, and say what a good answer to it would and would not contain. No readings, please — I want the teaching plan.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Task:** Create a 90-minute teaching plan for a medical humanities elective on the Naturalism vs. Normativism debate in health/disease.
      *   **Constraints:** Whiteboard only (no slides), mixed audience (1/3 clinical, 2/3 humanities), no prior philosophy of medicine knowledge, opposing dogmas (clinicians = factual/biological, humanists = social judgment).
      *   **Specific Questions to Answer:**
          *   Prerequisites for the question to feel real (not just semantics).
          *   Sequencing of concepts (species-typical function, harm/evaluation, hybrid positions).
          *   What to explicitly exclude/refuse to cover.
          *   Evaluation of the provided case study (two men, same heart anomaly, different family history).
          *   Selection of a second case study to balance the naturalist.
          *   Handling misconceptions (normativism = social dislike, naturalism = value-free, value-laden = arbitrary, disease vs. illness).
          *   Critique and refinement of the proposed "two-question test."
          *   Final closing question to assess understanding.
      *   **Tone:** Honest, pedagogical, strategic, specific. No readings.

  2.  **Deconstruct the Debate (Naturalism vs. Normativism):**
      *   *Naturalism (Boorse):* Disease is a deviation from species-typical functional organization. Value-free (in theory).
      *   *Normativism:* Disease is inherently disvalued/unwanted. Value-laden.
      *   *Hybrid (Wakefield/Harmful Dysfunction):* Dysfunction (naturalist) + Harm (normativist).
      *   *The Tension:* Clinicians want objectivity (diagnosis isn't opinion); Humanists want to acknowledge power/context (diagnosis creates status).

  3.  **Address the "Prerequisites" (Making it a Real Question):**
      *   Before they can debate, they need to agree on *why* it matters. It's not just definitions; it's about *authority* and *consequences*.
      *   Who gets to decide? (Doctor vs. Patient vs. Society).
      *   What happens after the label? (Treatment, insurance, stigma, exemption from duty).
      *   *Key Insight:* The debate isn't about what a disease *is* ontologically first; it's about what work the concept *does*.

  4.  **Sequence of Concepts:**
      *   *Species-typical function:* Needs to come early to give Naturalism a fighting chance. If we start with "harm," Normativism wins instantly.
      *   *Harm/Evaluation:* Needs to come *after* Naturalism is stated fully. If introduced too early, it contaminates the definition of dysfunction.
      *   *Hybrid Positions:* Must come *after* the pure positions have been felt. If introduced too early, it resolves the tension prematurely (the "Goldilocks" solution that avoids the hard work).
      *   *Ordering:* Start with the intuition clash -> Define Naturalism (Function) -> Test it (The Heart Case) -> Define Normativism (Harm/Value) -> Test it (The Second Case) -> Hybrid as a synthesis attempt.

  5.  **Evaluate the Provided Case (The Heart Anomaly):**
      *   *Scenario:* Two men, same structural anomaly, same function, different family history. One labeled patient, one not.
      *   *Strengths:* Highlights the role of *risk* and *context* over current biological state. Shows that "disease" status changes without biology changing.
      *   *Weaknesses:* "Anomaly" might smuggle in "deviation from norm" (Naturalist win). "Relative dropped dead" smuggles in "harm/risk" (Normativist win).
      *   *Verdict:* It's a strong case *if* framed carefully. It challenges the Naturalist because the biology is identical. It challenges the Normativist because the "harm" is probabilistic, not current.
      *   *Refinement:* Ensure the "anomaly" isn't described as "broken." Call it a "structural variant." The difference is purely *prognostic* based on social/family context.
      *   *Does it rig the verdict?* Slightly. It favors Normativism/Hybrid because the biology is static but the status changes. Need a second case to hurt Normativism.

  6.  **Select a Second Case:**
      *   Need something where there is *Harm* but no *Dysfunction* (to challenge Normativism) OR *Dysfunction* but no *Harm* (to challenge Naturalism).
      *   *The Heart Case* covers Dysfunction (maybe) + No Current Harm + Different Status.
      *   *Second Case Idea:* Infertility? (Dysfunction present, Harm depends on desire). Homosexogeneity? (Historical: Dysfunction claimed, Harm social). Short stature? (Dysfunction debatable, Harm social).
      *   *Best Choice:* **Infertility** or **Deafness**. Let's go with **Deafness** (specifically Deaf culture perspective) or **Infertility**. Infertility is clearer medically.
      *   *Actually, better for Naturalist defense:* **Asymptomatic Hypertension** or **Early Alzheimer's Biomarkers**.
      *   *Wait, to challenge Normativism:* We need a case where society says "not a disease" but biology says "dysfunction." Or where "harm" is absent but "dysfunction" is present.
      *   *Selection:* **Infertility in a celibate monk** or **Deafness in the Deaf Community**. Let's choose **Deafness**. It directly attacks the "Harm" condition. If the person does not experience it as a harm (due to community/support), is it a disease? Normativism struggles here if it relies on *subjective* harm. Naturalism says "ears don't work."
      *   *Alternative:* **Psychopathy**. Biological dysfunction? Maybe. Harm to self? No. Harm to others? Yes.
      *   *Decision:* **Infertility**. It's medically clear (function failed) but harm is contingent on life goals. It balances the Heart Case (where harm is contingent on family history).

  7.  **Address Misconceptions:**
      *   *Normativism = Social Dislike:* Misconception. It's about *harm*, not just dislike.
      *   *Naturalism = Value-Free:* Defensible reading (Boorse claims this), but practically false (selecting functions involves values). Let this stand for a while.
      *   *Value-laden = Arbitrary:* Misconception. Values can be reasoned.
      *   *Disease vs. Illness:* Crucial distinction. Disease = biological, Illness = lived experience.
      *   *Strategy:* Let the "Naturalism = Value-Free" stand until the Heart Case breaks it. Correct "Value-laden = Arbitrary" early.

  8.  **Critique the Two-Question Test:**
      *   *Questions:* 1. Process going wrong? 2. Misfortune for the person?
      *   *Bias:* Yes, it begs the question. It assumes the Hybrid view (Harmful Dysfunction). A pure Naturalist says "Only Q1 matters." A pure Normativist says "Only Q2 matters."
      *   *Fix:* Make it a decision tree or a grid. Or ask: "Which question is the *gatekeeper*?"
      *   *Better Scaffold:* A 2x2 Matrix. (Dysfunction Yes/No) x (Harm Yes/No). Place conditions in quadrants.

  9.  **What to Exclude:**
      *   Don't solve it. (It's unsolved).
      *   Don't dive into specific metaphysical ontology (realism vs. anti-realism).
      *   Don't cover specific coding systems (ICD vs. DSM) in detail.
      *   Don't let them debate specific politics (e.g., abortion, gender) – too hot, distracts from structure.

  10. **Final Question:**
      *   Needs to test structural grasp, not opinion.
      *   "If you could only keep one word, 'Dysfunction' or 'Harm', which medical practice breaks?"
      *   Or: "Under what conditions should we diagnose a condition that causes no suffering?"

  11. **Drafting the Plan (Iterative refinement):**
      *   *Intro (15 min):* Establish the stakes. Not definitions, but consequences.
      *   *Phase 1: The Clinician's Intuition (Naturalism) (20 min):* Define function. Use the Heart Case.
      *   *Phase 2: The Humanist's Intuition (Normativism) (20 min):* Define harm/value. Use the Deafness/Infertility Case.
      *   *Phase 3: The Hybrid & The Trap (20 min):* Wakefield. Why it feels right but might fail.
      *   *Phase 4: Synthesis/Check (15 min):* The Test and Final Question.
      *   *Whiteboard Management:* Need to visualize the 2x2 matrix.

  12. **Refining the Heart Case Analysis:**
      *   Does "anomaly" rig it? Yes. Change to "structural variant."
      *   Does it make Naturalism look stupid? Yes, because biology is identical.
      *   *Correction:* Emphasize that for the Naturalist, *neither* might be diseased, or *both* are. The fact that the GP treats them differently is the *problem* to be analyzed, not the truth.
      *   *Wait, the prompt asks:* "Is this the right carrying case?"
      *   *Answer:* It's excellent for exposing the *gap*, but dangerous if it makes Naturalism look impossible. It needs the second case to show Normativism's limits.

  13. **Refining the Two-Question Test:**
      *   The prompt suspects it leans normativist.
      *   *Analysis:* Question 1 is Naturalist. Question 2 is Normativist. Asking *both* assumes Hybrid.
      *   *Fix:* Ask them to rank the questions. "Which question vetoes the other?"

  14. **Final Review against Constraints:**
      *   90 mins? Yes.
      *   Whiteboard? Yes.
      *   No readings? Yes.
      *   Address all specific sub-questions? Yes.

  15. **Final Polish:** Ensure the tone is authoritative yet pedagogical. (Self-Correction: Make sure to explicitly answer the "what to refuse to cover" part clearly).

  *(Self-Correction during drafting)*: I need to be careful about the "Species-typical function" timing. If I introduce it too late, the Naturalists feel unheard. If too early, it's jargon. It needs to emerge from the *first case*.
  *Revised Plan:* Start with the Heart Case immediately. Let them fight. *Then* name the positions. *Then* introduce "Function" as the Naturalist's tool to fix the Heart Case.

  *Wait, the prompt asks specifically about sequencing:* "when the notion of a species-typical function has to arrive... whether the evaluative element in harm can be introduced before the naturalist position has been stated at full strength."
  *Decision:* Function must arrive *before* Harm. If Harm arrives first, Naturalism is dead on arrival. The Naturalist needs to build their fortress (Function) before the Normativist besieges it (Harm).

  *Let's finalize the Second Case:* Infertility is good. But maybe **Psychopathy** is better for "Dysfunction without Harm (to self)". Or **Deafness** for "Harm without Dysfunction (culturally)". Let's stick with **Deafness** or **Infertility**. Infertility is medically cleaner for a mixed group. Let's suggest **Infertility in a person who never wants children**. It isolates "Harm" from "Dysfunction."

  *Let's finalize the Final Question:* "If you had to legislate a definition for insurance coverage, which question gets the veto?"

  *Let's finalize the Misconceptions:* "Naturalism is value-free" is the big one to let stand until it breaks.

  *Okay, ready to write.*
answer: |-
  Here is a teaching plan designed for a 90-minute whiteboard session. It addresses the sequencing, the case studies, the misconceptions, and the scaffolding you requested.

  ### I. Prerequisites: Making it a Real Question
  Before the debate can begin, you must establish that this is not a semantic fight about the word "disease," but a structural fight about **authority** and **consequences**. If the students think this is just taxonomy, the clinicians will win on "precision" and the humanists will win on "nuance," and they will talk past each other.

  **What must be in place:**
  1.  **Consequences:** You must establish on the board that labeling something a "disease" triggers specific mechanisms: insurance payout, exemption from work/military duty, access to pharmaceuticals, and moral absolution (it's not my fault, it's my biology).
  2.  **The Gatekeeper:** You must establish that someone has to decide when those mechanisms trigger. Is it the microscope (Nature) or the legislature/culture (Norms)?

  **What to openly refuse to cover:**
  State this in the first five minutes:
  *   *"We are not solving this today. There is no consensus in philosophy of medicine. If anyone offers you a final solution, they are selling something."*
  *   *"We are not debating specific hot-button politics (e.g., gender identity, abortion). We are looking at the structural machinery of diagnosis, not the political outcomes of specific cases."*
  *   *"We are not distinguishing 'illness' (lived experience) from 'disease' (pathology) as a way to solve the problem. We are asking if 'disease' itself contains 'illness'."*

  ---

  ### II. Sequencing the Concepts
  The order of operations is critical. If you introduce "harm" before "function," Naturalism collapses immediately. If you introduce "hybrid" positions before they feel the pain of the pure positions, the students will treat the hybrid as a polite compromise rather than a philosophical necessity.

  **The Arc:**
  1.  **The Intuition Clash (0–15 mins):** Elicit the dogmas without naming them.
  2.  **The Naturalist Fortress (15–35 mins):** Build the "Species-Typical Function" argument *before* attacking it.
  3.  **The Normativist Siege (35–55 mins):** Introduce "Harm/Value" only after the Naturalist position is fully stated.
  4.  **The Hybrid Attempt (55–75 mins):** Combine them only after both pure positions have failed a case study.
  5.  **The Test & Close (75–90 mins):** Apply the scaffold and final question.

  **Specific Timing Answers:**
  *   **Species-Typical Function:** This must arrive in Phase 2. It is the Naturalist's only defense. It cannot be introduced as a compromise; it must be introduced as the *definition* of health.
  *   **Evaluative Element (Harm):** This must arrive in Phase 3. If you introduce it earlier, the clinicians will concede "well, obviously values matter" and you lose the tension. The Naturalist position must be stated at full strength (Boorse-style: health is statistical normality of function, value-free) before you show where it breaks.
  *   **Hybrid Positions:** These belong in Phase 4. They belong *after* the students have felt the pull of both pure positions. If you offer the hybrid (Harmful Dysfunction) too early, it buys you a false peace. The students need to see that the Hybrid inherits the problems of *both* parents (it requires agreeing on function *and* agreeing on harm).

  ---

  ### III. The Case Studies

  #### 1. Evaluation of Your Sister's Case (The Heart Anomaly)
  **Verdict:** It is an excellent carrying case, but it is dangerous. It heavily favors the Normativist/Hybrid view and risks making the Naturalist look like a straw man.

  **What it has:**
  *   **Identical Biology:** This is crucial. It isolates the variable of "context."
  *   **Identical Performance:** Both pass the exercise test. This attacks the "functional failure" definition.
  *   **Different Status:** One is a patient, one is not. This proves the label is not tracking the biology alone.

  **What it conspicuously lacks:**
  *   It lacks a *current* symptom. This is good. It forces the debate onto *risk*.
  *   It lacks a *social* difference between the men (e.g., one is a pilot, one is a poet). The only difference is family history.

  **Does it smuggle in the verdict?**
  Yes, slightly. By calling it an "anomaly," you imply "deviation from norm."
  *   **Correction:** Instruct the students to refer to it as a **"structural variant."** An anomaly sounds broken; a variant sounds neutral.
  *   **The Trap:** The Naturalist will argue that *both* men have the dysfunction (the variant reduces statistical survival chance), or *neither* do (both function normally now). The fact that the GP treats them differently is the *phenomenon to be explained*, not the truth.
  *   **Why it works:** It creates Naturalist discomfort because the biology is static but the diagnosis changes. It creates Normativist temptation because the "harm" is purely probabilistic and based on narrative (the dead relative).

  #### 2. The Second Case (To Save the Naturalist)
  You need a case where the Normativist view produces an absurdity, or where the Naturalist view is clearly necessary. You need **Dysfunction without Harm.**

  **Recommendation: Infertility in a Celibate Monk (or a person definitively childfree).**
  *   **The Scenario:** A man has zero sperm count (biological dysfunction by species-typical standards). He has no desire for children, experiences no distress, and suffers no social penalty in his specific context.
  *   **The Challenge:**
      *   **Naturalist:** Must say this *is* a disease (the reproductive system is not functioning as designed).
      *   **Normativist:** Must say this is *not* a disease (no harm is suffered, no value is violated).
  *   **Why pair it?** The Heart Case shows biology staying the same while status changes (favoring Normativism). The Infertility Case shows biology failing while harm is absent (favoring Naturalism).
  *   **Result:** The Heart Case makes the Naturalist look naive (ignoring context). The Infertility Case makes the Normativist look naive (ignoring biological reality). Now they need each other.

  ---

  ### IV. Handling Misconceptions
  You identified four. Here is how to manage them in the flow:

  1.  **"Normativism means any condition a society dislikes is a disease."**
      *   *Status:* **Genuine Misconception.**
      *   *Correction:* Correct this early (Phase 1). Normativism is not "whim"; it is about *harm* and *disvalue*. A society might dislike tattoos, but that doesn't make them a disease. Normativism requires a claim of *badness*, not just *difference*.
  2.  **"Naturalism is the safe view because it merely reports biology and leaves values out."**
      *   *Status:* **Defensible Reading (initially).**
      *   *Strategy:* **Let this stand.** Do not correct this until Phase 3. The clinicians need to feel safe in this view. Let them build the Naturalist fortress. Then, use the Heart Case to show that selecting *which* functions count (e.g., survival vs. reproduction) is itself a value judgment. Break this misconception by showing that "function" is not value-neutral.
  3.  **"Value-laden means arbitrary."**
      *   *Status:* **Genuine Misconception.**
      *   *Correction:* Correct this in Phase 3. We reason about values. "Harm" is not a feeling; it is a judgment about welfare. We can argue about harm rationally.
  4.  **"Disease and Illness are interchangeable."**
      *   *Status:* **Manufactured by Framing.**
      *   *Strategy:* If you use the word "illness," they will conflate it. **Refuse to use the word "Illness."** Use "Condition," "Diagnosis," or "State." If a student says "Illness," ask: "Do you mean how the body works, or how the person feels?" Force the distinction only if it serves the debate.

  ---

  ### V. The Two-Question Test (Scaffold Critique)
  **Your Draft:**
  1.  Is some bodily process going wrong by the standards of how bodies of this kind work?
  2.  Is that going wrong a misfortune for the person living this life?

  **Critique:**
  Yes, this scaffold **begs the question against the Naturalist.**
  *   It assumes a Hybrid position (Harmful Dysfunction).
  *   A pure Naturalist says Question 2 is irrelevant.
  *   A pure Normativist says Question 1 is irrelevant.
  *   By asking *both*, you imply the answer requires *both*.

  **The Fix:**
  Turn it into a **Veto Matrix** on the whiteboard. Draw a 2x2 grid.
  *   **X-Axis:** Biological Dysfunction (Yes/No)
  *   **Y-Axis:** Personal/Social Harm (Yes/No)

  **The Task:**
  Place the Heart Case and the Infertility Case into the quadrants.
  *   *Heart Case:* Dysfunction? (Debatable). Harm? (Yes, for one man).
  *   *Infertility Case:* Dysfunction? (Yes). Harm? (No).

  **The Real Test:**
  Ask the room: **"In which quadrant does the label 'Disease' apply?"**
  *   If they say only "Dysfunction + Harm," they are Hybridists.
  *   If they say "Dysfunction + No Harm," they are Naturalists.
  *   If they say "No Dysfunction + Harm," they are Normativists.

  This reveals their structural commitment without telling them what to think.

  ---

  ### VI. The Final Ten Minutes
  **The Closing Question:**
  Do not ask "Which side is right?" Ask a question that forces them to choose a *failure mode*.

  **Question:**
  *"Imagine you are writing the law for insurance coverage. You must choose one error to live with forever:*
  *A) You cover biological dysfunctions that cause no suffering (The Infertility Case).*
  *B) You deny coverage for conditions that cause suffering but have no clear biological dysfunction (The Heart Case / Chronic Pain).*
  *Which error is less dangerous to the practice of medicine, and why?"*

  **What a Good Answer Contains:**
  *   **Acknowledgment of Trade-off:** It recognizes that you cannot have perfect objectivity and perfect responsiveness to suffering simultaneously.
  *   **Justification of Risk:** It explains *why* one error is worse (e.g., "Covering non-harmful dysfunction wastes resources" OR "Denying suffering destroys trust").
  *   **No Appeal to Magic:** It does not say "We can just measure better." It accepts the limit.

  **What a Bad Answer Contains:**
  *   **Synthesis:** "We should do both." (Refuse this. Force the choice).
  *   **Technocratic Fix:** "Eventually science will find the biology in the pain." (This denies the Normativist insight).
  *   **Moralizing:** "It's cruel to deny pain." (This ignores the Naturalist concern about resource allocation and definition creep).

  ### VII. Whiteboard Management Plan
  *   **Left Panel:** Keep the Definitions. (Naturalism = Function; Normativism = Value/Harm). Do not erase this.
  *   **Center Panel:** The 2x2 Matrix. Fill this in during Phase 4.
  *   **Right Panel:** The Consequences. (Insurance, Stigma, Exemption). Keep this visible to remind them *why* we are arguing.

  ### VIII. Summary of Risks
  *   **Risk:** The clinicians disengage during the "Value" section.
      *   **Mitigation:** Remind them that "Function" is also a theoretical construct. Pathologists choose which tissues to study based on values.
  *   **Risk:** The humanists disengage during the "Biology" section.
      *   **Mitigation:** Remind them that without biology, they cannot distinguish disease from poverty or grief.
  *   **Risk:** The session ends in "Both matter."
      *   **Mitigation:** The Closing Question forces a prioritization. One must be the *gatekeeper*.

  This plan keeps the tension alive, respects the expertise in the room, and uses the cases to break dogmas rather than reinforce them.
