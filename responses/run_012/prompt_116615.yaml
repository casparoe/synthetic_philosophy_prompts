answer: |-
  Here is the ranking of your seven principles based on their ability to withstand the inefficacy objection, sorted into three tiers.

  ### Tier 1: Genuinely Survive the Objection
  *These principles engage directly with the causal claim of the inefficacy objection and refute it on its own terms.*

  **(7) The Marginal-probability Rule**
  This principle survives by correcting the factual premise of the objection, showing that while your act is unlikely to be the trigger, the expected harm (probability × magnitude) remains significant. The case that most threatens it is a scenario of verified zero probability, such as casting a vote in an election where the margin is already officially certified before your ballot is counted.

  ### Tier 2: Survive by Changing the Subject
  *These principles remain morally robust but bypass the causal challenge by redefining wrongness in non-consequentialist terms (duty, integrity, or expression).*

  **(3) The Universalizability Rule**
  This survives by shifting the ground from actual consequences to logical consistency, making the act wrong because it cannot be rationally willed as a law, regardless of its causal impact. It is most threatened by the "exception seeker" case, where an agent argues that their specific circumstances justify a maxim that would be disastrous if adopted by everyone.

  **(4) The Complicity Rule**
  This withstands the objection by locating the wrong in the agent's moral integrity and association with harm rather than in the outcome they produce. The most threatening case is one of involuntary or unavoidable participation, where an agent is embedded in a harmful practice but lacks any viable alternative to opt out.

  **(5) The Expressive Rule**
  This survives by treating the act as a communicative gesture that reinforces harmful norms, rendering the physical consequence secondary to the social meaning. It is most threatened by the "secret polluter" case, where an act causes harm but is performed in total secrecy, thereby expressing no public norm.

  **(6) The Fair-share Rule**
  This principle sidesteps the inefficacy objection by grounding wrongness in the violation of entitlement rights rather than the exceeding of a harm threshold. The case that most threatens it is the "abundant resource" scenario, where an individual takes more than their slice from a surplus that would otherwise go to waste, violating the rule without causing deprivation.

  ### Tier 3: Collapse into the Objection
  *These principles attempt to remain within a causal framework but fail to explain individual responsibility when causal leverage is absent.*

  **(1) The Difference-making Rule**
  This principle collapses because it simply codifies the inefficacy objection as a moral rule, rendering the act permissible whenever the individual causal impact is negligible. The case that most threatens it is the "landslide vote," where the outcome is secure regardless of participation, intuitively absolving the voter despite the collective stakes.

  **(2) The Threshold Rule**
  This principle collapses because, without invoking probability, it cannot explain why an individual is responsible for a threshold crossing that did not depend on their specific contribution. It is most threatened by the "distant threshold" case, where an agent contributes to a pool that is nowhere near the tipping point, making their membership in the set causally inert.

  ***

  ### Recommendation for the Long-Haul Flight

  If I had to choose a single principle for a thoughtful person deciding whether to take that flight, I would recommend **The Marginal-probability Rule (7)**.

  This principle beats the runner-up, **The Complicity Rule (4)**, because it preserves the vital link between individual agency and actual harm. The Complicity Rule is a strong moral safety net, but it risks turning the decision into a matter of personal purity ("keeping my hands clean") rather than a genuine assessment of the damage one might cause. The Marginal-probability Rule forces the agent to confront the reality that, given the stakes of climate change, even a tiny chance of triggering catastrophic harm carries a heavy expected weight, making the objection's claim of "no difference" mathematically false rather than just morally irrelevant.
