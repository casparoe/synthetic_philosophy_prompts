  ### Strategic Advice for the Presentation

  1.  **Fix the XOR Definition:** Your description of XOR Blackmail is the weakest link. In the standard philosophical literature (e.g., Yudkowsky/Soares), XOR Blackmail *does* involve a predictor who decides whether to send the letter based on (Coin & Predicted Action).
      *   **Recommendation:** If you can, adjust your paper to acknowledge the standard version. If you must keep your version, explicitly state: *"I am using a modified XOR scenario without a predictor to isolate the variable of prediction."* If you don't do this, Objection 4 will eat you alive.
  2.  **The "Logical Causation" Concession:** Do not try to convince CDTs that logical dependence is *physical* causation. They will reject it. Instead, argue that rational decision theory should track *logical* dependence when it determines payoffs, even if it isn't *physical* causation. Frame it as an expansion of "causality" to include "computational causality."
  3.  **Manage the "Hope Nobody Asks":** If asked about Newcomb, do not equivocate. If your argument for CM holds, Newcomb follows. Admitting this shows consistency, even if they disagree with the conclusion. Hiding it looks like you haven't thought through the implications.

  ### Summary of Concessions to Make Up Front
  *   **Idealization:** Acknowledge perfect predictors are metaphysically contentious but treat them as valid for idealized decision theory.
  *   **Terminology:** Acknowledge your XOR scenario is non-standard and designed to isolate the "predictor" variable.
  *   **Newcomb:** Acknowledge that your view aligns with One-Boxing in Newcomb's Problem (if it does).
  *   **Metaphysics:** Acknowledge you are relying on "logical/subjunctive dependence" which is not standard physical causality.
