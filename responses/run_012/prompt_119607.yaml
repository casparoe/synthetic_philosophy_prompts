answer: |-
  ### Q&A Prep Sheet: Counterfactual Mugging vs. XOR Blackmail

  **Context:** Your audience is technically sophisticated but metaphysically conservative. They will attack the *causal graph* and the *coherence of the premises* before they attack the normative conclusion. Your goal is to show that the *structural difference* (presence of a predictor encoding your decision procedure) justifies the *normative difference* (pay vs. don't pay), without getting bogged down in defending Updateless Decision Theory (UDT) as a whole.

  **Strategic Note:** Your description of XOR Blackmail is non-standard. In the literature (e.g., MIRI/FDT), XOR Blackmail *does* involve a predictor who decides whether to send the letter based on your predicted response. By stipulating "The blackmailer is not a predictor," you have created a different problem (a simple gamble with symmetric payoffs). **I have flagged this in Objection 4.** You must be prepared to defend why this stipulation doesn't trivialize the problem.

  ---

  #### 1. The "Backward Causation" Objection (Causal Decision Theorist)
  **Q:** "In Counterfactual Mugging, the predictor makes their prediction *before* the coin is flipped and *before* you decide. You claim your decision influences the prediction. Isn't this just backward causation? If you deny temporal causation, what causal mechanism allows your present choice to change a past fact?"
  **Reply:** "I am not positing backward *temporal* causation, but *logical* dependence. The predictor simulates your decision procedure. The output of that procedure is a logical fact, timeless and invariant. When I decide in the actual world, I am instantiating the same procedure that was simulated in the past. I am not changing the past; I am determining the output of a function that exists across both the simulation and reality. The causal arrow runs from the *Decision Procedure* to both the *Prediction* and the *Action*."
  **Soft Spot:** "Logical dependence" is not standard causality. If they press on how a logical fact exerts force in a physical world, you have no physicalist story.
  **Concession Flag:** **Yes.** Concede upfront that this requires accepting "subjunctive dependence" or "logical causation" as a primitive, distinct from physical causation. Do not try to reduce it to physics.

  #### 2. The "Smoking Lesion" Objection (Causal Decision Theorist / Phil of Probability)
  **Q:** "Isn't the predictor just a Common Cause? Your brain state causes your decision, and the predictor observes your brain state (or a simulation of it). In the Smoking Lesion problem, CDT says to ignore the correlation because the decision doesn't cause the lesion. Why is the Predictor different from the Lesion?"
  **Reply:** "In the Smoking Lesion, the lesion causes the urge, and the urge causes the smoking; the decision to smoke doesn't cause the lesion. In Counterfactual Mugging, the prediction is *of the decision itself*, not a correlate. The predictor's payout depends on the *counterfactual output* of your decision procedure. The link isn't a statistical correlation mediated by a third variable; it is a functional identity. The prediction *is* the decision, computed earlier."
  **Soft Spot:** This relies on the distinction between 'correlation' and 'functional identity.' A skeptic can argue that functionally, it looks just like a common cause structure.
  **Concession Flag:** **No.** Hold the line here. This is the core of your argument.

  #### 3. The "Incoherent Predictor" Objection (Philosopher of Probability)
  **Q:** "Perfect prediction of a free agent is logically incoherent (Gödel, free will, etc.). If the scenario is impossible, expected utility is undefined. Why are we deliberating on an incoherent premise?"
  **Reply:** "We are doing idealized decision theory, not engineering. We assume the predictor is possible for the sake of argument, just as we assume fair coins and infinite banks in other thought experiments. The question isn't whether predictors exist, but *if* one did, how should a rational agent reason? The incoherence of the predictor doesn't invalidate the normative claim about how to respond to the structure."
  **Soft Spot:** If they argue that impossibility makes the counterfactuals vacuous, you lose the ground to stand on.
  **Concession Flag:** **Yes.** Concede that this is an idealization. Say: "I grant the metaphysical difficulties, but I ask you to evaluate the normative reasoning *conditional* on the setup."

  #### 4. The "XOR Setup" Objection (All)
  **Q:** "In your XOR scenario, the coin is independent and the blackmailer isn't a predictor. That means the Expected Utility of Paying and Not Paying is identical (50% safe, 50% tortured). Why argue you *should not* pay? And isn't this just a gamble, not blackmail? Standard XOR Blackmail involves a predictor deciding whether to send the letter."
  **Reply:** "I am stipulating a version of the case to isolate the variable of *prediction*. In this specific setup, paying has no causal leverage over the coin, and unlike Counterfactual Mugging, there is no logical link to a predictor's payout. Since paying causally risks torture in the Tails branch with no compensating logical benefit in the Heads branch (the coin is fixed), the causal recommendation is to not pay. I am using this to show that without the predictor link, the updateless intuition vanishes."
  **Soft Spot:** **High Damage.** Your EV calculation is symmetric. A CDT will say "Indifferent," not "Don't Pay." An EDT might say "Pay" if they think paying signals Heads (but you said coin is independent).
  **Concession Flag:** **Major Concession Needed.** You should concede that in *this specific stipulation*, the EVs are symmetric, and your claim should be "There is no *positive* reason to pay," rather than "There is a reason *not* to pay." Alternatively, acknowledge that if XOR *did* include a predictor (standard literature), your distinction might collapse.

  #### 5. The "Precommitment" Objection (Causal Decision Theorist)
  **Q:** "A CDT agent can precommit to paying in Counterfactual Mugging before the coin flip. If they do, they get the money. Why do we need Updateless Decision Theory? Isn't this just standard precommitment?"
  **Reply:** "Precommitment works only if you know the problem is coming and can bind your future self. Updateless reasoning is about how to act when you *haven't* precommitted, or when you face the problem unexpectedly. It argues that the rational policy *at the moment of decision* is to act as if you had precommitted, because your decision procedure is what was predicted. It's a claim about rationality at the node, not just prior planning."
  **Soft Spot:** If they argue that rationality is only about the node, you are talking past each other.
  **Concession Flag:** **No.** This is a standard defense of UDT/FDT.

  #### 6. The "Counterfactual Semantics" Objection (Philosopher of Probability)
  **Q:** "In the Tails world, the coin *is* Tails. The Heads world is counterfactual. What does it mean to say you 'receive $10,000' in a world that doesn't obtain? How do you weigh utility in impossible branches?"
  **Reply:** "We are evaluating the *decision procedure*, not the specific act in the specific world. The decision procedure exists in both the actual and counterfactual branches. We ask: 'What is the expected utility of the algorithm that outputs 'Pay' in this situation?' That algorithm has an output in the Heads branch (where it gets money) and the Tails branch (where it loses money). We sum over the algorithm's performance across all possible worlds weighted by their probability."
  **Soft Spot:** This commits you to a specific modal realism or algorithmic ontology.
  **Concession Flag:** **No.** But be prepared to clarify you are maximizing over *policies*, not *acts*.

  #### 7. The "Evidential Symmetry" Objection (Evidential Decision Theorist)
  **Q:** "In Counterfactual Mugging, Paying is evidence that the Predictor predicted Pay, which is evidence you get the $10,000. In XOR, if you are being blackmailed, isn't Paying evidence of something? Why does EDT agree with you in XOR but not CM?"
  **Reply:** "In XOR, I stipulated the coin is independent of the decision. So P(Heads | Pay) = P(Heads). There is no evidential link. In CM, the prediction *depends* on the decision. P(Prediction=Pay | Pay) = 1. The evidential structure differs because the predictor creates a dependency that the independent coin flip does not."
  **Soft Spot:** If they argue that your decision is evidence of your 'type,' and your 'type' is correlated with the coin (in some versions), you might get tangled.
  **Concession Flag:** **No.** Rely on your stipulation of independence in XOR.

  #### 8. The "Hope Nobody Asks" Question (The Newcomb Trap)
  **Q:** "If you pay in Counterfactual Mugging because of logical dependence, do you One-Box in Newcomb's Problem? If yes, you're just an FDT theorist. If no, you're inconsistent. Which tribe are you in?"
  **Reply:** "My argument is structural, not tribal. I argue that whenever a predictor's payout depends on the *counterfactual output* of your decision procedure (as in CM and Newcomb), you should cooperate. When the outcome depends only on independent physical facts (as in my XOR stipulation), you should not. Whether you call that FDT, UDT, or 'Smart CDT' is less important than the causal graph distinction."
  **Soft Spot:** **Critical.** This forces you to admit you are rejecting CDT on a fundamental level. The CDTs in the room will hear "I One-Box" as "I reject causality."
  **Concession Flag:** **Yes.** Be honest. Say: "Yes, this commits me to One-Boxing in Newcomb. I believe the causal structure of Newcomb is relevantly similar to Counterfactual Mugging." Fighting this will make you look dishonest or confused.

