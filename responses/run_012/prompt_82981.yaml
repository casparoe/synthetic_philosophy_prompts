  Non-empirical confirmation cannot tell you whether the multiverse is true; it only justifies rational confidence in a theory's viability as a research programme, not its correspondence to physical reality. The Bayesian machinery involved is not merely aesthetic dressing, because updating credences based on meta-theoretical facts—such as the absence of alternatives or unexpected mathematical coherence—is a logically valid way to increase subjective probability. However, this process measures the robustness of the theory within the space of human conceptualisation, not its grip on the external world. The argument that no viable alternatives exist assumes we have sufficiently surveyed the space of possible physical theories, which is an inductive claim about human ingenuity rather than a deductive fact about nature. Similarly, internal coherence ensures consistency, but history is replete with consistent theories that were ultimately false. Consequently, these arguments successfully demonstrate that string theory is the best available bet for a unified physics and warrants continued investment, but they cannot bridge the epistemic gap between mathematical possibility and ontological actuality. The label "confirmation" is therefore a category error that conflates rational belief with factual verification, meaning your colleague is right about the rationality of pursuing the theory but wrong to suggest it substitutes for empirical truth-tracking.
