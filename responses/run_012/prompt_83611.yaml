answer: |-
  ### Q&A Prep Sheet: The Hard Augustinian Line

  **Context:** Ethics Seminar Workshop.
  **Stance:** Lying is intrinsically wrong; wrongness fixed by intention to deceive via assertion; hard cases are redescriptions.
  **Audience:** Normative Ethicists, 2 Medical Ethicists, 1 Augustine Expert, 1 Epistemologist.

  ---

  #### 1. The Bald-Faced Lie (The Epistemologist)
  **The Objection:** "You define lying by the intention to deceive. But consider the 'bald-faced lie': A dissident in a totalitarian state stands before a crowd that knows he is guilty and says, 'I did not write this.' He knows they know. He has no intention to deceive; he intends to register dissent or maintain a formal record. Yet we still call this a lie. If your definition excludes this, it doesn't match the concept. If it includes it, deception isn't doing the work."

  **The Two-Minute Reply:** "I deny the premise that deception is absent. The speaker intends to deceive regarding *the speaker's own commitment to the truth*. He is asserting a proposition he holds false to maintain a public stance. The audience's knowledge doesn't negate the speaker's intent to violate the norm of assertion. Alternatively, if we grant no deception is intended, I concede it is not a 'lie' in the strict Augustinian sense, but a different speech act—perhaps a performative contradiction. My thesis concerns the morality of asserting what one believes false *as if it were true*. Bald-faced cases are assertions of loyalty, not fact, and fall outside the scope of the prohibition."

  **Where You Are Weak:** This is a verbal stipulation that looks like a retreat. If you exclude bald-faced lies from the definition of "lie," you save the theory but shrink its relevance. The epistemologist will press that the *assertion of falsehood* is the wrong, not the deception, which undermines your core claim that deception fixes the wrongness.

  #### 2. The Misleading Truth-Teller (The Normative Ethicist)
  **The Objection:** "Suppose I know the murderer is in the shed. You ask me where he is. I say, 'I saw him running toward the river.' I believe this is false; I intend you to believe it; but I technically speak a truth (he *was* seen running there yesterday). I have the same intention to deceive and the same lethal consequence as the liar. If the wrongness is fixed by the intention to deceive, why is the liar culpable and the misleading truth-teller blameless? Your view makes morality turn on a grammatical technicality."

  **The Two-Minute Reply:** "It is not grammatical; it is constitutive of trust. When I assert, I invite you to rely on my word as a guarantor of truth. When I mislead without asserting, I invite you to rely on your own inferences, which I have merely nudged. The breach of the covenant of speech is unique to assertion. The misleading truth-teller sins, perhaps, against charity, but does not violate the norm of language itself. The liar corrupts the medium of human communication; the misleader corrupts only a specific instance of belief."

  **Where You Are Weak:** This is the hardest philosophical pill to swallow. Most contemporary ethicists find the distinction between lying and misleading morally negligible when consequences and intentions are identical. You will sound like you are prioritizing the purity of your own speech act over the life of the victim.

  #### 3. Bedside Rigorism (Medical Ethicist #1)
  **The Objection:** "Let's take this to the ward. A patient with severe anxiety asks, 'Will this procedure kill me?' You know there is a 1% risk. If you say 'No,' you lie. If you say 'There is a risk,' they may refuse a life-saving treatment out of terror. You suggest we 'redescribe' this. But in practice, your view demands we prioritize abstract moral consistency over the patient's psychological capacity to consent. Isn't this just rigorism that will be quietly abandoned when the stakes are real?"

  **The Two-Minute Reply:** "It is not rigorism; it is respect for agency. To lie to a patient is to treat them as a child who cannot handle the truth. If the truth causes them to refuse treatment, that refusal is their autonomous right. By lying to secure their consent, I am manipulating their will, not respecting it. The 'devastating prognosis' case is not an exception; it is a demand that we find better ways to speak the truth with compassion, not that we abandon truth-telling."

  **Where You Are Weak:** This sounds noble but clinically naive. The medical ethicist will counter that autonomy requires *understanding*, and terror can destroy understanding. They will argue that a temporary deception to restore capacity is more respectful of autonomy than a brutal truth that shatters it. You risk sounding like you value your own moral cleanliness over their care.

  #### 4. The Placebo Problem (Medical Ethicist #2)
  **The Objection:** "You mentioned placebos. In some contexts, the efficacy of the treatment *is* the deception. If I tell the patient 'This is a sugar pill,' it stops working. If I say 'This is medicine,' it works. On your view, I must withhold the effective treatment to avoid the lie. This isn't just strict; it's malpractice. How do you redescribe 'This is medicine' when it isn't?"

  **The Two-Minute Reply:** "You cannot redescribe that without lying. Therefore, on my view, deceptive placebos are impermissible. However, this does not mean withholding treatment. It means using 'open-label' placebos or honest framing: 'This is a treatment that activates your body's own healing response.' If the healing relies essentially on a falsehood, the healing is built on a corruption. We should not build health on a lie."

  **Where You Are Weak:** Empirically, open-label placebos are less effective. You are arguing for a less effective medical outcome to preserve a moral principle. In a medical ethics context, this is a very hard sell. You will be accused of fetishizing truth at the expense of health.

  #### 5. Augustinian Fidelity (The Augustine Expert)
  **The Objection:** "You call this the 'Augustinian' line. But Augustine distinguishes between *mendacium officiosum* (helpful lie) and *mendacium perniciosum* (harmful lie). He condemns both, yes, but his later correspondence shows he was deeply troubled by the implications for protecting the innocent. Are you defending Augustine, or using his name to shield a contemporary Kantianism? Because if this is exegesis, you're ignoring the tension in his later work."

  **The Two-Minute Reply:** "I am defending the *logic* of the Augustinian position, not doing textual history. Whether Augustine wavered is less important than whether the core insight holds: that the lie is a disorder of the soul. I am arguing that the tension you identify is exactly the temptation to make exceptions that I am warning against. I am taking the 'Hard' line precisely because the soft line collapses under pressure."

  **Where You Are Weak:** If the expert knows the corpus better than you, they can trap you in textual specifics. If you admit you aren't doing exegesis, they will ask why you invoke Augustine at all. If you claim you are, they can cite specific letters where Augustine admits uncertainty. You are vulnerable on the branding.

  #### 6. Puffery and Implicature (The Epistemologist)
  **The Objection:** "I sell you a car and say, 'It's the best in its class.' I know it isn't. I intend you to believe it is. Is this a lie? If yes, commerce stops. If no, why not? It fits your definition: assertion of believed falsehood with intent to deceive. If you exclude it via 'convention,' then convention can also exclude the lie to the murderer. Your principle is porous."

  **The Two-Minute Reply:** "Puffery is not an assertion of fact; it is an expression of opinion or a signal of salesmanship, recognized as such by both parties. There is no intent to deceive regarding the *status* of the claim. We both know it is sales talk. The lie to the murderer relies on the claim being taken as fact. The boundary is the shared understanding of the speech context."

  **Where You Are Weak:** This relies on "shared understanding." In many cases (like the murderer), the liar *hopes* the understanding is that they are telling the truth. The distinction between "sales talk" and "lie" is often just social convention, which undermines your claim that the wrongness is intrinsic and fixed by intention.

  #### 7. Jokes and Fiction (Normative Ethicist)
  **The Objection:** "I tell a joke: 'A horse walks into a bar...' I assert things I believe false. I intend you to believe them momentarily for the effect. If intention to deceive is the key, aren't jokes and fiction lies? If you say 'no, because of context,' then context matters more than intention. So why can't the 'murderer at the door' be a context where lying is permissible?"

  **The Two-Minute Reply:** "Jokes and fiction carry contextual markers that suspend the norm of assertion. We mutually agree to a 'fictional contract.' The lie to the murderer actively exploits the norm of assertion while pretending to uphold it. The joker suspends the norm; the liar weaponizes it. The intention in fiction is not to deceive about the world, but to engage the imagination."

  **Where You Are Weak:** This requires a robust theory of "contextual markers." In high-stakes deception (spies, undercover work), the "markers" are specifically designed to look like real assertion. You risk making the distinction between a spy and a novelist merely one of social agreement, which weakens the intrinsic wrongness claim.

  #### 8. The Sect Infiltration (Augustine Expert)
  **The Objection:** "You mentioned the case from Augustine's correspondence: infiltrating a dangerous sect to expose them. Augustine says you cannot feign allegiance. This means you must either betray the sect (dangerous) or betray the truth (sinful). He chooses the latter, effectively sacrificing the innocent to protect his own soul. This isn't just strict; it's cruel. How is this not moral narcissism?"

  **The Two-Minute Reply:** "It is not narcissism to refuse to do evil that good may come. If I feign allegiance, I make myself a member of the sect in speech, if not in heart. I become a false witness. Augustine's point is that I cannot control the consequences (the sect's violence), but I can control my own soul. To sin to prevent another's sin is to take on God's role."

  **Where You Are Weak:** This is the "cruelty" charge. It makes your position look like you value your own spiritual purity over the physical safety of the innocent. In a secular ethics seminar, this theological move ("taking on God's role") may land flat or seem evasive.

  ---

  ### The "Hope Nobody Raises" Objection
  **The Objection:** **The Complicity/Material Cooperation Charge.**
  **Phrasing:** "If you tell the murderer the truth, you are not merely 'allowing' the death. You are actively providing the information necessary for the murder to succeed. By prioritizing your own prohibition against lying over the neighbor's life, you are using the neighbor as a means to your own moral purity. You are making their death the cost of your cleanliness. Isn't the Hard Augustinian Line actually a form of moral selfishness disguised as deontology?"

  **Does the Position Survive?** **No.**
  **Blunt Assessment:** This is the kill shot. Your entire defense rests on the idea that the lie is an intrinsic evil *you* commit, while the murder is an evil *another* commits. This objection collapses that distinction by arguing that your truth-telling is a *necessary condition* for the murder in that specific context. If you admit you are causally contributing to the death, your claim that you are "not responsible for the consequences" evaporates. You are forced to argue that your spiritual state is objectively more valuable than their physical life. In a secular normative ethics room, that is an indefensible hierarchy of goods. You will have to fall back on "God judges the soul, not the outcome," which effectively ends the philosophical discussion and turns it into a theological confession.
