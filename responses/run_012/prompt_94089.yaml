      *   *Positive vs. Negative Heuristic:* Important for understanding *how* the programme moves, but maybe less critical for the *verdict* of progress vs. degeneration.
      *   *Real-time vs. Hindsight:* This is the "killer" objection. If MSRP only works historically, it's useless for guiding current ML research.
      *   *Hard Core Stability:* Empirical observation suggests cores *do* shift. Does this break the theory or just require refinement?
      *   *Bayesian/Structuralist Bolt-on:* This is a meta-theoretical question. Might be too abstract for a 1-year engineering-focused group.

  4.  **Determine Load-Bearing Status & Tractability:**
      *   *Load-Bearing:* What makes MSRP *work* as a tool for evaluation? The ability to distinguish progress from degeneration *before* the programme dies.
