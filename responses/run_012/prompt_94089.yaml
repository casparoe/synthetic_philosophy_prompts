  2.  **Deconstruct Lakatos's MSRP (Methodology of Scientific Research Programmes):**
      *   *Core Components:* Hard Core (irrefutable assumptions), Protective Belt (auxiliary hypotheses), Negative Heuristic (don't attack the core), Positive Heuristic (how to develop the belt), Progressive Problemshift (novel predictions confirmed), Degenerating Problemshift (ad hoc patches, no novel facts).
