      *(Self-Correction on "Hard Core"):* In ML, the "Hard Core" is often mathematical (e.g., "gradient descent minimizes loss"). But people change optimizers. Is Adam a different core than SGD? This is a great concrete problem for the group. I should highlight this in the Individuation or Hard Core section. Let's put Individuation higher because you can't define the Core without defining the Programme.

      *Revised Ranking:*
      1. Individuation (What is the thing?)
