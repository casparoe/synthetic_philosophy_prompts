answer: |-
  You should write the story, but you must accept that you are not writing to rescue her from the silence, and you are certainly not writing to fill it. The verdict is that invention is not only permissible but necessary, provided the purpose of the invention shifts from recovery to revelation. Your hunch is correct in its insistence on showing the seams, but it requires a sharper edge regarding who the story is for. It cannot be addressed solely to her, because a novel is by definition a public act, and pretending otherwise is a kind of privacy that shields you from the consequences of representation. Instead, the legitimacy of your fabulation rests on whether it forces the reader to confront the violence of the archive rather than soothing them with the illusion of access. You are not building a bridge to her mind; you are reconstructing the cage that kept her mind from us, and you are using those scraps—the dog, the hat, the grudge—not as golden nuggets of truth but as stress points where the pressure of her existence cracked the clerk's record. The test is not whether it happened, because we know it did not happen the way you write it, nor is it purely fidelity to her, because she is beyond our reach. The test is fidelity to the conditions of her silencing. If your invention makes the reader feel the weight of what cannot be known, if it makes the silence audible rather than empty, then you have earned the right to tell it.

  The fear that inventing an interior life is a second act of taking is not wrong, but it is incomplete. It assumes that the only alternative to invention is silence, and that silence is neutral. It is not. The silence you are working within is not a natural absence; it is a manufactured product of the very system that produced the parish examinations and the coroner's inquest. Those documents were not created to know her; they were created to manage her. When the clerk wrote down her speech in his grammar, he was not translating her; he was assimilating her into a bureaucracy that needed her to be a pauper, a widow, a body, so that the parish could decide whether to pay. To refuse to invent anything is to accept the clerk's categorization as the final word. It is to leave her as the state left her: a problem to be solved. Your friend who warns you against taking is protecting her from your imagination, which is noble, but in doing so, they are protecting the archive from your critique. If you do not write the story, the story remains what the overseer wrote: a transaction. The act of writing fiction is the only tool you have to reintroduce the human cost of that transaction, but only if you refuse to let the fiction pretend it is history.

  This is where your distinction between the kinds of silence is vital, particularly the silence of collision. She appears only when she touches the state, which means her life is defined by friction. A novel that smooths over this friction, that gives her a seamless interior monologue indistinguishable from a modern protagonist, betrays the reality of her existence. She did not have the luxury of a seamless interiority because her life was constantly interrupted by the need to prove her settlement, to bury her child, to survive the neighbours. Therefore, the seams you show must not be merely stylistic quirks; they must be structural. When you write her voice, it should not be a perfect recovery of her dialect, because you cannot know it. Instead, the narrative should struggle with the language. You might write the scene of the examination so that the reader feels the clerk's pen hovering, the moments where her words were too messy to record, the things she said that were deemed irrelevant. You use the hat and the dog not to make her cute or relatable to a modern audience, but to show the absurdity of what survived. Why did the hat matter to the clerk? Probably it didn't. It survived because it was concrete, because it was property. By focusing on the hat, you highlight what the archive values over the grief.

  This brings us to the nine names on the page, and the guilt that choosing her is a verdict on the others. This is the hardest part, and it is where many historical novels fail by claiming their protagonist is exceptional. You cannot claim she was special. If you write her as uniquely resilient or uniquely tragic, you validate the system that erased the others because they were not resilient enough or their tragedy was not recorded. The way to honor the nine names is not to write their stories too, which would dilute the focus into a chorus that loses all power, but to make her particularity a lens for their collective erasure. The dog, the hat, the grudge—these are the accidents of survival. She is not in the record because she was more important; she is in the record because the clerk happened to write down the bit about the hat. Your job is to make the reader understand that this is an accident. You must write her life in such a way that her survival in the text feels precarious, contingent, and unearned. When she speaks, it should feel like a miracle that we hear her at all, not because she was loud, but because the paper held. If you achieve this, the reader will not think "she mattered more," but "she mattered, and so did the nine who vanished." The particular is the only way into the universal here; abstract sympathy for the poor of the Midlands is easy, but grief for a specific woman with a specific grudge against a specific neighbour is hard. That difficulty is the ethical work.

  So you must push past your hunch about addressing the story to her. A novel addressed only to its subject is a prayer, and while prayer has its place, it is not a novel. A novel implicates the reader. The ethical danger lies in the reader's appetite for her voice. Readers want to feel they know her. They want to cry over her child and feel righteous anger at the overseer. This is consumption. It turns her suffering into their emotional enrichment. To counter this, your invention must deny them full access. You keep the seams showing not just to be honest, but to frustrate. When the reader wants to know what she felt when her child died, you might give them the coroner's dry notation instead, or you might write the scene but pull back at the moment of greatest intimacy, reminding the reader that this is a reconstruction based on a document written by a man who wanted to close the case. You make the reader feel the distance. You make them feel the loss of the voice they are craving. This is the fidelity I am speaking of. It is not fidelity to her actual thoughts, which are gone, but fidelity to the fact that they are gone.

  The wall you have hit is not a problem to be solved; it is the subject of the book. You are stuck because you are trying to walk through the archive as if it were a door, when it is actually a wall. Stop trying to get to the other side. Write the wall. Write the texture of the brick. Write the hand that laid it. The parish examinations are not windows into her soul; they are mirrors of the parish's anxiety. Write her navigating that anxiety. Let the clerk's grammar stand in the text sometimes, intrusive and wrong, to show the colonization of her speech. Let the gaps where the paper is torn or the ink faded become moments in the narrative where time stops. This is what critical fabulation demands: not that you lie to tell the truth, but that you use the tools of fiction to expose the lies of history. The archive lies by omission. You lie by commission, but you do it transparently, so that the two lies cancel each other out and leave a space where something like truth can flicker.

  Ultimately, the choice to tell her story is a verdict, yes, but it is a verdict against the oblivion that claimed the nine others. To leave her silent is to let the overseer win. To make her vivid without context is to let the modern reader win. The middle path is to make her vivid in a way that indicts the system that tried to flatten her. You use the scraps because they are all you have, but you treat them as evidence of a struggle, not as treasures. The dog is not a charming detail; it is proof she had something to love that the parish could not tax. The grudge is not gossip; it is proof she had a sense of justice that exceeded the law. When you write these things, you are not inventing her interiority so much as you are inferring her resistance. You are writing the shape of the hole she left in the record. If you do this, if you keep the seams raw and refuse to let the reader settle into the comfort of knowing her, then you are not taking from her. You are standing witness to the taking that already happened. And that is the only legitimacy available to us.
