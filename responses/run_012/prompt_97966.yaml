answer: |-
  Good evening.

  My mother sees wallpaper that isn't there. Sometimes, there is a small boy standing at the foot of her bed. She knows he is not real. She is lucid, sharp, and entirely aware that the retina is failing. But she is embarrassed. Not by the vision itself, but by the reassurance.

  We mean well. We say, "Don't worry, it's all in your head." We say, "It's just a trick of the light." In doing so, we try to comfort her by downgrading the experience. We imply that her mind is producing a defective copy of the world—a faded photograph, a glitch in the camera. We tell her she is seeing poorly, when she is not seeing at all.

  I would like to suggest a different way to hold this experience. One that respects the science we are here to support, but honors the dignity of those living with it.

  When we see the world, we are in contact with it. The tree, the chair, the face of a friend—these things are present to us. That is what sight is: a relationship between the person and the world. But when my mother sees the boy, there is no relationship. The boy is not there to be met.

  If we treat her experience as a "bad version" of seeing, we imply she is failing to grasp the world. We treat her mind like a mirror that has gone cloudy. But what if this episode is not a cloudy mirror? What if it is something else entirely?

  Consider the silence of a room. When the music stops, the silence isn't a "bad version" of the music. It is a different state of affairs. In Charles Bonnet syndrome, the eyes go quiet. The brain, accustomed to a constant stream of light and pattern, does not simply go dark. It begins to sing to itself.

  This is not a failed attempt to see. It is a successful act of generation.

  To call it a hallucination is not to say it is a "private picture" hidden away in the skull. It is to say that this is a different kind of event than perception. Perception is receiving; this is creating. They are not two points on the same line. They are different categories of being.

  When we understand this, the reassurance changes. We no longer have to say, "It's not real, you're just imagining it." We can say, "You are not seeing the world, but your mind is still making meaning."

  This distinction matters. It means my mother is not suffering from a defect of reality. She is undergoing a distinct phenomenon, born of biology, acknowledged by the scientists in this room, but separate from the world they measure. It validates the vividness of the wallpaper without requiring the wallpaper to exist. It honors the terror or the beauty of the boy without placing him in the room.

  We are gathered to support vision. But tonight, let us also support the mind that persists when vision fades. Let us stop telling patients that their experiences are merely broken copies of the world. They are not broken copies. They are difficult, complex, and entirely their own.

  By acknowledging the difference, we stop asking them to apologize for a sight they don't have, and allow them to stand firmly in the reality they do.

  Thank you.
