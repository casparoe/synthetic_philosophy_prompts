      *   **Setup:** 9 pairs.
      *   **Currency:** "Utility Points" redeemable for extra credit (tiny amount) or chocolate. Let's stick to chocolate/candy to avoid grade anxiety.
      *   **Scenario 1 (Baseline):** A convex set. Disagreement point $d = (0,0)$. Max P1 = 100, Max P2 = 100. (Symmetric to start? No, if symmetric, NBS and KS are the same. I need asymmetry to distinguish them later, or I need to change the set in Round 2).
      *   *Correction:* To see the divergence between NBS and KS, the feasible set must be asymmetric *or* the change must create asymmetry.
      *   *Standard Example:*
          *   Set 1: Triangle with vertices (0,0), (100, 0), (0, 100). NBS = (50,50). KS = (50,50). (No conflict yet).
          *   Set 2: Expand P1's max to 150. Vertices (0,0), (150, 0), (0, 100).
          *   NBS: Maximizes $(x-0)(y-0)$ subject to frontier. If frontier is linear $y = 100 - \frac{2}{3}x$. Max $x(100 - \frac{2}{3}x)$. $100 - \frac{4}{3}x = 0 \rightarrow x = 75, y = 50$.
