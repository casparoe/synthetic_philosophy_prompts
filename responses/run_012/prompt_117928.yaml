      *   **Scenario 2:**
          *   Ideal: (150, 100). (P1 Max increased).
          *   Options: ..., (60, 45), (70, 40), (80, 30), ...
          *   Products: $2700, 2800, 2400$. Max is (70, 40).
          *   *Check:* P2 dropped from 50 to 40. P1 Max increased. P2 Max stayed 100.
          *   *KS Check:*
              *   S1 Ideal (100,100). Ray $y=x$. Hits (50,50).
              *   S2 Ideal (150,100). Ray $y = 2/3 x$.
              *   Does (70, 40) fit KS? $40 = 2/3 (70) = 46.6$. No. KS would want P2 to have more (around 46).
              *   So NBS (70,40) hurts P2 compared to KS (approx 69, 46).
              *   Crucially, P2 hurts compared to Round 1 (50 -> 40).
      *   This works.

  10. **Writing the Response:**
      *   Tone: Professional, pedagogical, slightly conspiratorial (we are setting a trap).
      *   Structure: Activity Design, Materials, Timeline, Debrief, Limits/Risks.
      *   Ensure the "Straight Talk" section is honest about the mathematical assumptions (convexity, continuity, uniqueness) that the table bypasses.

  11. **Final Review against constraints:**
      *   300-level? Yes, assumes some utility logic but teaches the axioms.
      *   18 students? 9 pairs.
      *   75 mins? Timeline fits.
      *   No NBS derivation? They calculate products, I name it later.
      *   No KS name until debrief? Checked.
      *   Address 50/50 bias? Restricted choice set forces optimization.
      *   Address Lying? Common knowledge tables.
      *   Limits? Discussed.

      *One final check on the "Indignation":* Will P2 care about 10 points of candy?
      *   *Fix:* Make the points cumulative across the two rounds. "Your total payout is Round 1 + Round 2."
      *   If Round 1 = 50. Round 2 = 40. Total = 90.
      *   If they had maintained Round 1 status quo (hypothetically), Total = 100.
      *   This makes the loss tangible.
      *   *Wait, Round 1 is already done.* They eat the candy.
      *   *Better:* "Your final grade bonus depends on your Round 2 outcome relative to Round 1." No, too complex.
      *   *Best:* Just rely on the principle. "You lost utility." In a philosophy seminar, the principle usually bites harder than the candy. I will emphasize the *principle* in the instructions. "You are negotiating for a fair division."

      *Wait, one nuance:* If they know half the class knows NBS, the knowledgeable ones might spoil it.
      *   *Instruction:* "Do not use outside knowledge of game theory. Use the table provided."
      *   *Risk:* They might whisper.
      *   *Mitigation:* The "Straight Talk" section should mention this risk. I'll advise the instructor to frame it as "Apply the rule on the card," not "Find the fair solution." If the rule is "Maximize the joint product," the NBS-knowers can't spoil the *outcome*, only the *name*. And I don't want the name yet anyway.
      *   *Actually, better instruction:* "Find the agreement that maximizes the total value created." (Utilitarian?) No, that's sum.
      *   *Instruction:* "Find the agreement that is 'Rational'." (Vague).
      *   *Best Instruction:* "Your goal is to find the stable point. Hint: In these games, stability is found where the product of your scores is highest." -> This forces NBS without naming it.
      *   *Wait, if I tell them to maximize product, I'm teaching NBS.*
      *   *Prompt says:* "Don't spend time re-deriving that for me." It implies I can assume they might know it, but I shouldn't teach it.
      *   *Strategy:* I will tell them: "Economic theory suggests rational agents maximize the product of their gains. Use this rule to select your outcome from the table."
      *   This validates the NBS-knowers (they feel smart) and guides the others (they follow the rule). It ensures the *outcome* is NBS, which is necessary for the indignation.
      *   Then in debrief, I attack the *rule* they just used.

      *Let's refine the "Maximize Product" instruction.*
      *   If I tell them to do it, they won't feel it's "Fair." They'll feel it's "Imposed."
      *   The prompt wants them to "agree on something they think is fair, then watch that happen to them."
      *   Okay, Round 1: Let them bargain freely. (Likely 50/50).
      *   Round 2: Let them bargain freely. (Likely 50/50 or P1 demands more).
      *   *Then* I reveal: "The Nash Solution says..."
      *   *Problem:* If they bargain to 50/50 in Round 2, there is no indignation.
      *   *Solution:* I must constrain the choices so 50/50 is not available or clearly suboptimal by the "Rational" metric I introduce *between* rounds.
      *   *Revised Plan:*
          *   Round 1: Free Bargaining. (They hit 50/50).
          *   Interlude: "Economists argue that fair deals must be 'efficient' and 'stable'. A common metric for stability is maximizing the product of utilities." (Introduce the NBS rule quietly).
          *   Round 2: "Apply this metric to the new table."
          *   Result: They calculate the NBS outcome (70, 40). P2 sees they get less.
          *   Indignation: "But I didn't do anything wrong!"
          *   Debrief: "That feeling is an Axiom."
      *   This works. It uses the NBS-knowers as assets (they confirm the rule) and forces the outcome.

      *Wait, one last check:* "KS is pinned down by the requirement that if you improve one player's best possible outcome... the other player must not end up worse off."
      *   In my numbers: P2 ends up worse off (50 -> 40).
      *   So NBS violates this. KS would preserve P2's proportion.
      *   This aligns perfectly.

      *Ready to write.*
answer: |-
  Here is a complete lesson plan designed to generate the specific axiomatic conflict you described, without naming Kalai-Smorodinsky until the final reveal.

  ### Activity Title: "The Expansion Trap"

  **Class Profile:** 18 Students (9 Pairs), 75 Minutes, 300-Level Philosophy of Economics.
  **Objective:** Students will experience the violation of *Individual Monotonicity* under the Nash Bargaining Solution (NBS) and identify it as a fairness violation, only to discover in the debrief that preserving that fairness requires sacrificing *Independence of Irrelevant Alternatives* (IIA).

  ---

  ### 1. Materials & Payoff Scheme

  **Currency:** "Utility Tokens" (poker chips or printed slips).
  **Redemption:** 10 Tokens = 1 piece of high-quality chocolate (or 0.1% extra credit if your department allows).
  **Why:** Low enough stakes to prevent genuine hostility, high enough to prevent total apathy.

  **Handout A (Round 1):** "Feasible Set Alpha."
  **Handout B (Round 2):** "Feasible Set Beta."
  **Calculator:** Simple phones allowed for multiplication.

  **The "Rationality Rule" Card:**
  > *In economic bargaining, a 'stable' agreement is one where the product of the two players' utilities is maximized. If you cannot agree, you both get 0. Your task is to find the stable agreement.*

  **Design Note:** This rule silently imposes the Nash Solution without naming it. It bypasses the "50/50 politeness" bias by giving them a mathematical objective function that overrides equality.

  ---

  ### 2. The Numbers (Crucial Setup)

  You must project or print these tables. They are discrete approximations of convex sets.

  **Round 1: Feasible Set Alpha**
  *   **Disagreement Point:** (0, 0)
  *   **Player 1 Max:** 100
  *   **Player 2 Max:** 100
  *   **Pareto Frontier Options:**
      *   (40, 55) → Product: 2,200
      *   **(50, 50) → Product: 2,500 [MAX]**
      *   (60, 42) → Product: 2,520 *Wait, let's adjust to ensure 50/50 is the NBS.*
      *   *Correction:* Let's use (45, 54) → 2430; **(50, 50) → 2500**; (55, 45) → 2475.
      *   *Result:* Rational choice is (50, 50).

  **Round 2: Feasible Set Beta**
  *   **Disagreement Point:** (0, 0)
  *   **Player 1 Max:** **150** (Increased)
  *   **Player 2 Max:** **100** (Unchanged)
  *   **Pareto Frontier Options:**
      *   (60, 48) → Product: 2,880
      *   **(70, 40) → Product: 2,800** *Wait, I need the max product to shift P1 up and P2 down.*
      *   *Let's rig the table to force the NBS shift.*
      *   Option A: (65, 45) → 2,925
      *   Option B: (75, 38) → 2,850
      *   *Let's try a linear frontier approximation:* $y = 100 - \frac{2}{3}x$.
      *   If $x=50, y=66$ (Not in Set 1).
      *   *Okay, use this specific discrete set:*
      *   (60, 45) → 2,700
      *   **(70, 40) → 2,800 [MAX]**
      *   (80, 32) → 2,560
      *   *Result:* Rational choice is (70, 40).

  **The Conflict:**
  *   Round 1 P2 gets **50**.
  *   Round 2 P2 gets **40**.
  *   P1's Max increased (100 → 150). P2's Max stayed (100).
  *   **P2 is absolutely worse off in Round 2 despite their own potential remaining unchanged.**

  ---

  ### 3. Minute-by-Minute Timeline

  **00:00 – 00:10: Setup & Pairing**
  *   Divide into 9 pairs. Assign Player 1 and Player 2 roles randomly.
  *   Distribute **Handout A** and **Rationality Rule Card**.
  *   **Instruction:** "You are negotiating a division of resources. You must select one row from the table. If you do not agree, you get nothing. According to the Rule Card, you should seek the 'stable' agreement (maximize the product)."
  *   *Note:* This instruction validates the NBS-knowers (they recognize the rule) and guides the others.

  **00:10 – 00:25: Round 1 Bargaining**
  *   Students calculate products. They will converge on (50, 50).
  *   Collect the outcomes. Write the class average on the board (should be 50/50).
  *   Distribute Round 1 Tokens (do not let them eat them yet).

  **00:25 – 00:30: The Setup**
  *   Collect Handout A. Distribute **Handout B**.
  *   **Announcement:** "Player 1, your department received a grant. Your maximum possible allocation has increased to 150. Player 2, your maximum remains 100. The feasible set has expanded for Player 1. Apply the Rationality Rule again."

  **00:30 – 00:45: Round 2 Bargaining**
  *   Students calculate. They will converge on (70, 40).
  *   **Crucial Moment:** Watch Player 2's reaction when they realize their token count dropped from 50 to 40.
  *   Collect outcomes. Write on board.

  **00:45 – 00:55: The Indignation (Facilitated)**
  *   Do not explain the math yet. Ask the room:
  *   "Player 2s, look at the board. Your maximum possible outcome did not change. Your disagreement point did not change. Yet your allocation dropped. Why?"
  *   "Player 1s, why did your share increase?"
  *   *Expected P2 response:* "That's unfair. I didn't lose any capacity." (This is Individual Monotonicity).
  *   *Expected P1 response:* "The total pie shifted in my favor. The efficiency point moved." (This is IIA/Nash logic).
  *   Let them argue for 5 minutes. Do not resolve it.

  **00:55 – 01:15: The Debrief (Axiomatic Reveal)**
  *   **Step 1: Name the Ghost.** "The rule you used—maximizing the product of gains—is the defining characteristic of the **Nash Bargaining Solution**."
  *   **Step 2: Map the Indignation.** "Player 2, your anger is mathematically formalized. It is called **Individual Monotonicity**. It states: If the feasible set expands in favor of Player 1, and Player 2's maximum remains constant, Player 2 should not receive less utility."
  *   **Step 3: The Trade-Off.** "Nash satisfies **Independence of Irrelevant Alternatives (IIA)**. This means the solution depends only on the shape of the frontier near the solution, not the 'ideal' points. Because the frontier shifted to favor P1, the tangent point moved, hurting P2."
  *   **Step 4: The Alternative.** "Is there a solution that satisfies Player 2's demand?"
  *   Draw the box on the board. Mark the Ideal Point (150, 100). Draw the ray from (0,0) through the Ideal.
  *   "If we demand that the solution always lies on the ray connecting Disagreement to Ideal, we satisfy Individual Monotonicity. This is the **Kalai-Smorodinsky Solution**."
  *   **Step 5: The Cost.** "What do we lose? We lose IIA. If we add an option nobody would ever take (changing the Ideal Point), the KS solution changes. Nash says that's irrational. KS says that's fair."
  *   **Closing:** "You just felt the cost of IIA."

  ---

  ### 4. Preventing the Pitfalls

  **Problem 1: The 50/50 Politeness Bias**
  *   **Fix:** The "Rationality Rule Card." By explicitly telling them to maximize the *product*, you override the social norm of equality with a game norm of efficiency. The NBS-knowers will enforce this on their partners, acting as your co-conspirators.
  *   **Backup:** If a pair insists on 50/50 in Round 2, ask them during the debrief: "Did you follow the stability rule? If not, why?" This highlights that *fairness* (50/50) conflicts with *stability* (Nash) in the new set.

  **Problem 2: Lying About Maximums**
  *   **Fix:** The Maximums are printed on the Handout as "System Constraints." They are not private information. Player 2 can see Player 1's Max on the sheet.
  *   **Instruction:** "These tables represent the physical constraints of the resource. You cannot negotiate outside the table."

  ---

  ### 5. Straight Talk: Limits & Risks

  **What the Activity Cannot Reproduce**
  1.  **Convexity & Continuity:** You are using a discrete table. The uniqueness of the Nash solution relies on a strictly convex, continuous feasible set. In your table, there might be two rows with similar products.
      *   *Mitigation:* In the debrief, explicitly state: "We assumed away the math problems. In the real theorem, we assume the set is convex and compact to guarantee a unique maximum. Today, we just assumed the table had one clear winner."
  2.  **Uniqueness:** Nash's theorem proves uniqueness based on the axioms. Your activity *imposes* uniqueness via the "Maximize Product" rule.
      *   *Mitigation:* Acknowledge this. "I gave you the formula that Nash proved was the *only* one satisfying his axioms. You didn't derive the uniqueness; you executed it."
  3.  **Cardinality of Utility:** The activity treats tokens as cardinal utility. Nash bargaining requires comparable, transferable utility units to multiply them.
      *   *Mitigation:* In the debrief, note: "We treated points as utility. Nash requires that utility be measurable up to a positive affine transformation. That's a heavy lift in real life."

  **What Will Go Sideways (First Run)**
  1.  **The "Sum" Mistake:** Students might try to maximize the *sum* (Utilitarianism) instead of the *product*.
      *   *Fix:* Walk around during Round 1. If you see them adding, correct them: "Check the Rule Card. Stability is about the product."
  2.  **P2 Refusal:** A Player 2 might refuse Round 2 because it's "unfair," resulting in (0,0).
      *   *Fix:* This is actually a **win** for the lesson. If they strike, highlight it in the debrief. "Player 2 rejected the Nash Solution because it violated Individual Monotonicity. This is why KS was developed."
  3.  **NBS-Knowers Spoiling:** The 50% who know Nash might whisper "This is Nash."
      *   *Fix:* Instruct them beforehand: "If you know the theory, your job is to follow the Rule Card, not to teach your partner. Let them feel the result first."

  **The "Straight Talk" Conclusion for You**
  This activity sacrifices mathematical rigor for phenomenological accuracy. You are not proving the theorem; you are simulating the *axiomatic tension*. The students will leave understanding *why* KS exists (to protect Player 2 from P1's expansion) and *what it costs* (sensitivity to irrelevant alternatives), which is the philosophical core of the seminar.
