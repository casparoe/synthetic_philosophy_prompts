      *   *The "Indignation":* To make them feel the IM violation, I need two rounds.
          *   Round 1: A baseline bargaining problem.
          *   Round 2: An expanded bargaining problem where Player 1's max increases, Player 2's max stays the same, and the Pareto frontier shifts in a way that NBS hurts Player 2.
      *   *The "NBS Logic":* Since half know NBS, they might calculate it. I need to make sure the *intuition* drives the result, not just calculation. Or, better yet, let them bargain, observe the result, and *then* map it to the axioms. Actually, the prompt asks for them to "watch that happen to them." This implies I (the instructor) or the mechanism determines the outcome based on NBS logic, or they bargain and converge on NBS-like behavior, only to be shocked when the set changes.
      *   *Refinement:* It's hard to force students to bargain to NBS in 75 mins without incentives. It's better to *simulate* the solutions. I will act as the "Mechanism." They propose/argue, but I reveal what the "Standard Solution" (NBS) dictates in Scenario A vs. Scenario B. Wait, the prompt says "watch that happen to them." This suggests they should be the players.
