      *   **Goal:** Make students *feel* the pull of the Kalai-Smorodinsky (KS) solution without naming it until the end.
      *   **Core Conflict:** NBS satisfies Independence of Irrelevant Alternatives (IIA) but fails Individual Monotonicity (IM). KS satisfies IM but fails IIA.
      *   **Desired Experience:** Students agree on a "fair" split, then see Player 1's max improve while Player 2's max stays same, yet Player 2 gets *less* under the NBS logic. They should feel indignant. Then reveal the axiomatic trade-off.
      *   **Constraints:** No real money. Avoid 50/50 default bias. Prevent lying about maximums (ideal points must be common knowledge).
      *   **Deliverables:** Rules, materials, payoff scheme, minute-by-minute timeline, debrief linking moments to axioms.
      *   **Critical Reflection:** Be honest about limits (convexity, comprehensiveness, uniqueness) and potential failure points.

  2.  **Deconstruct the Pedagogical Challenge:**
