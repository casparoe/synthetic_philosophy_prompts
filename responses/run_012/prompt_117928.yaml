      *   *Actually, the strongest pedagogical move:* Run the bargaining. Let them settle on a point. Then change the feasible set (improve P1's max). Ask them to re-bargain. If they are rational/NBS-aligned, P2 loses share. P2 will feel cheated. *Then* reveal why.
      *   *Preventing 50/50:* Use asymmetric disagreement points or asymmetric utility functions. Or, make the "pie" clearly uneven in value. Let's use "Points" that convert to course credit (or just bragging rights/candy). To avoid 50/50, the disagreement point shouldn't be (0,0). Or, the max possible isn't symmetric.
      *   *Preventing Lying:* The feasible set is printed on a card. The "Ideal Point" is explicitly written on the card as the theoretical max. They can't lie about the rules, only about their agreement.

