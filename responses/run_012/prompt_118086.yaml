          *   Agreement on "Wrongdoing": If a requirement is violated, there is a pro tanto wrong, even if justified overall.

      *   **Section 2: The Precise Disagreement:**
          *   Dilemmist: Both obligations persist to the point of action.
          *   Anti-Dilemmist: One obligation is defeated or overridden; only one 'ought' remains at the point of action.
          *   Wording needs to be careful. Use "All-Things-Considered" (ATC) vs. "Pro Tanto".

      *   **Section 3: The Cruxes (Theoretical Commitments):**
          *   *Agglomeration:* Does $O(A) \land O(B) \rightarrow O(A \land B)$? Dilemmist says No (in conflicts). Anti-Dilemmist says Yes (always).
          *   *Ought Implies Can (OIC):* Dilemmist limits OIC or distinguishes senses of 'ought'. Anti-Dilemmist holds OIC strictly for ATC 'ought'.
          *   *ATC vs. Pro Tanto:* Dilemmist says ATC 'ought' can conflict. Anti-Dilemmist says only Pro Tanto 'oughts' conflict; ATC is singular.

      *   **Section 4: The Minimal Test Case:**
