      *   **Dilemmism:** Genuine conflicts exist where $O(A)$ and $O(B)$, but $\neg \Diamond (A \land B)$. Agent violates a moral requirement regardless of choice. Remainder (guilt/regret) is appropriate.
      *   **Anti-Dilemmism:** Conflicts are either apparent (epistemic) or resolvable (one duty overrides). $O(A)$ and $O(B)$ implies $O(A \land B)$. If $\neg \Diamond (A \land B)$, then it's false that both are obligatory *all things considered*.

  3.  **Drafting - Section by Section:**

