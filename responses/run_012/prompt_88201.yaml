      *   **The Circularity Charge:** Address this specifically.
          *   Landauer's Principle is often derived *from* the 2nd Law applied to the memory device.
          *   To use it to *save* the 2nd Law is indeed circular *if* that's the only derivation.
          *   Non-circular derivations exist (microdynamics), but they require assumptions (e.g., "no super-determinism," "thermal bath is random") that critics equate to the 2nd Law in disguise.
      *   **What Counts as Progress?**
