answer: |-
  Every chart must represent quantity strictly by the count of identical pictorial units, never by their size or intensity.

  **Decision Procedure**

  1.  **Unit Definition:** Is the data a count of discrete objects? If yes, proceed. If no (rates, money, averages), can it be converted to a standard unit (e.g., 1 symbol = $1,000)? If yes, proceed. If no, stop and hand to **Senior Designer (Transformer)**.
  2.  **Symbol Check:** Is there a flat, perspective-free pictogram in the library? If yes, proceed. If no, draft a sketch and hand to **Senior Designer (Transformer)** for library addition.
  3.  **Colour Check:** Does the colour have a fixed meaning in the style guide? If yes, proceed. If no, hand to **Senior Designer (Transformer)** to assign meaning.
  4.  **Transformation:** Calculate symbol count using standard rounding (≥0.5 rounds up). Does the rounding hide a critical difference? If yes, hand to **Senior Designer (Transformer)**. If no, proceed.
  5.  **Layout:** Arrange symbols in rows/columns. Are any symbols scaled or angled? If yes, redraw. If no, proceed.
  6.  **Forcefulness:** Did a stakeholder request emphasis? Answer: "We show quantity, not argument." Refuse scaling for impact.
  7.  **Sign-off:** **Senior Designer (Transformer)** verifies the mapping table against the sketch.

  **Library and Colour Rules**
  A new pictogram is added only if the concept appears in three separate charts; approval rests with **Senior Designer (Transformer)**. A colour receives a new meaning only if the existing palette cannot distinguish categories; this must be documented in the style guide by **Senior Designer (Transformer)**.

  **Refusals and Ethics**
  The visual system must refuse causal claims, precise decimal differences, and predictions. When asked to make a chart more forceful, answer: "We show quantity, not argument." Do not alter scales to exaggerate trends.

  **Case Applications**

  | Case | Verdict | Chart | Deciding Step |
  | :--- | :--- | :--- | :--- |
  | (a) Dwellings | Proceed | Symbol count per district | Step 1 (Countable) |
  | (b) Income | Proceed | 1 symbol = $1k units | Step 1 (Unit Conversion) |
  | (c) Vaccination | Refuse | None | Step 6 (Forcefulness) |

  **Limitations**
  This procedure cannot do justice to continuous flows, complex correlations, or time-series where lines are superior. It will misfire when legal precision is required over memorability, as rounding inherently sacrifices accuracy. It struggles with very large numbers (creating symbol clutter) or very small differences (lost in rounding). It cannot show causality or future predictions. The system is a helping language, not a standalone truth; it requires words to contextualize what the pictures simplify. If the data requires nuance beyond unit counting, the procedure stops and hands the matter to the **Senior Designer (Transformer)** to decide if a chart is appropriate at all.
