answer: |-
  Here is the breakdown of the four claims hiding in your mate's assertion, arranged from the harmless observation to the metaphysical howler. I've kept it in British English as requested.

  ### The Four Claims

  1.  **The Epistemic Claim (The Predictive Shortcut)**
      *   **The Gist:** The symbols are merely a convenient compression algorithm for *us*. The simmballs obey physics, but tracking them individually is impossible. By grouping them into 'symbols', we can predict the system's behaviour without doing the hard maths.
      *   **Verdict:** **True.** This is just a statement about the limits of human calculation. The symbols exist in our description, not necessarily in the box.

  2.  **The Isomorphic Claim (The Structural Mirror)**
      *   **The Gist:** The Careenium is physically constructed so that its micro-states map perfectly onto macro-symbolic states. Every physical transition *is* a symbolic transition, viewed under a different description.
      *   **Verdict:** **True.** By the definition of the thought experiment, the machine is built to realise a virtual machine. The physics instantiates the logic.

  3.  **The Explanatory Claim (Causal Relevance)**
      *   **The Gist:** The symbolic level captures real causal patterns that the physical level obscures. While the simmballs do the heavy lifting, the *reason* the system behaves as it does is best explained by the symbolic rules. The symbols are causally relevant in virtue of the physical structure, not apart from it.
      *   **Verdict:** **True (Functionally).** This is the standard non-reductive physicalist position. The symbols don't add new energy, but they mark out real dependencies in the world that physics alone makes too messy to see.

  4.  **The Ontological Claim (The Magical Shove)**
      *   **The Gist:** The symbols exist as independent entities that exert a force on the simmballs, potentially overriding or operating alongside the laws of physics. The logic pushes the matter.
      *   **Verdict:** **False.** This violates the causal closure of the physical. Unless you believe in magic or dualism, the simmballs only move because other simmballs hit them, not because a 'rule' told them to.

  ***

  ### The Verdict on Your Mate's Argument

  If your mate wants to maintain that the symbols are **real causes** in a philosophically robust sense (without talking nonsense), he needs to stand on **Claim 3 (The Explanatory Claim)**. This allows him to say the symbols do work, provided he admits they do so *through* the substrate, not above it. This is the 'design stance' advocated by folks like Daniel Dennett.

  However, if he is merely saying that we can use symbols to predict what the balls will do, he is resting on **Claim 1 (The Epistemic Claim)**. This makes his line a **platitude**: it's trivially true, but it doesn't prove that the symbols have any power in the world; it only proves they have power in our heads.

  If he insists on **Claim 4**, he's simply wrong. Tell him to check his physics.
