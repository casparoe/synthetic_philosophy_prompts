  I'm an SRE. I've been reading about Parfit's teletransporter — the scanner reads you, destroys you, builds a copy on Mars — and the branching version where the scanner doesn't destroy you and now there's a you on Earth and a you on Mars, both of whom remember being you and both of whom are equally continuous with you. I keep feeling like my day job already contains this puzzle and I want to know if that feeling is real or if I'm just pattern-matching.

