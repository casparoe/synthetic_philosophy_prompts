answer: |-
  This is a classic reconstruction of the **Triviality Argument** against computational functionalism (often associated with Hilary Putnam and John Searle). It is a very strong argument, which is why you feel the tension. If you accept all the premises, functionalism about moral status (and consciousness) collapses.

  Since you want to preserve **(1) Functionalism** (moral status depends on what a system does) and **(4) Intrinsicness** (moral status is a fact about the system, not the observer), you are logically committed to rejecting the path that leads to the dilemma in **(5)**.

  That path runs through **(2)** and **(3)**. To save your view, you should reject **(2)**.

  Here is the diagnosis of that move and an analysis of what it costs you.

  ### The Move: Reject Premise (2)
  **Premise (2):** *For any physical system and any computation, there is some way of mapping the system's states onto the computation's states under which the system realizes that computation.*

  This is the "Triviality Thesis." It claims that computational realization is mathematically trivial because you can always construct a lookup table (a mapping) that equates physical states (e.g., positions of atoms in a rock) with computational states (e.g., 0s and 1s of a mind).

  **Why you should reject it:**
  Most contemporary functionalists argue that (2) is false because it relies on an overly permissive definition of "realization." Mere state-to-state correspondence is not enough for genuine computational realization. A system only realizes a computation if the physical states **causally sustain** the transitions defined by the computation.

  **The Fix:** You add a **Causal/Counterfactual Constraint**.
  A rock does not realize a mind-computation because, while you can map the rock's current state to a mental state, the rock's physical dynamics do not support the *counterfactuals* required by the computation. If the input had been different, the rock would not have transitioned to the corresponding output state in the way the computation dictates. The rock just sits there; a brain (or silicon chip) would have changed state differently.

  ### What You Are Buying (The Costs)

  By rejecting (2) to save (1) and (4), you are making specific metaphysical commitments. Here is the bill:

  #### 1. You must solve the "Individuation of Computation" problem
  If arbitrary mappings don't count, *which* mappings do? You now owe the seminar a theory of **Naturalized Computation**.
  *   **The Cost:** You can no longer treat computation as pure abstract mathematics. You must ground it in physics or causation. You have to argue that there is a "fact of the matter" about which causal structures in the universe count as logical operations.
  *   **The Risk:** This invites objections from people who think causation itself is observer-relative (e.g., Humeans). If causation is just a pattern we project, you haven't truly saved intrinsicness; you've just pushed the relativity back one step.

  #### 2. You are committed to "Counterfactual Robustness"
  To distinguish a mind from a rock, you must argue that a moral patient must be capable of behaving differently under different conditions.
  *   **The Cost:** This makes moral status dependent on **dispositional properties**, not just occurrent ones. A system that is currently computing but lacks the physical hardware to sustain alternative pathways (a "blockhead" system) might fail your test.
  *   **The Risk:** This leads to the **Blockhead Objection** (Ned Block). Imagine a system that looks like it has moral status but is actually just a giant lookup table of pre-programmed responses. Your rejection of (2) forces you to say the lookup table *lacks* moral status because it lacks causal depth, even if its behavior is identical to a conscious being. You must defend why causal depth matters morally.

  #### 3. You narrow the scope of Moral Status
  Premise (2) allows for "pancomputationalism" (everything computes). By rejecting it, you are asserting that computation is rare or specific.
  *   **The Cost:** You must accept that many systems we currently treat as "information processors" (simple thermostats, basic algorithms) might not meet the threshold for the "computation of a certain kind" mentioned in (1).
  *   **The Risk:** You risk making moral status **binary** or **threshold-based** in a way that feels arbitrary. At exactly what level of causal complexity does a system stop being a "rock" and start being a "moral patient"?

  ### Why this is the best path for your paper

  If you reject (2), your argument transforms from a *reductio* of functionalism into a **defense of constrained functionalism**.

  1.  **It preserves Intuition (4):** By tying computation to causal structure, you make realization an intrinsic feature of the system (its causal powers), not a feature of an observer's mapping.
  2.  **It preserves Functionalism (1):** You still maintain that substrate doesn't matter; only the organization matters. But now "organization" means "causal organization," not just "pattern matching."
  3.  **It avoids the Rock Absurdity (6):** A rock lacks the causal complexity to support the counterfactuals of a mind-computation. Therefore, the rock does not realize the computation, and the dilemma in (5) is dissolved.

  ### Seminar Discussion Points
  To impress your seminar, frame the rejection of (2) using these distinctions:

  *   **Isomorphism vs. Implementation:** Acknowledge that while a rock is *isomorphic* to a mind under a gerrymandered mapping, it does not *implement* the computation because implementation requires causal fidelity.
  *   **Chalmers' Constraint:** Cite David Chalmers (1996), who argues that for a system to realize a computation, there must be a reliable causal correspondence between the physical state transitions and the formal state transitions.
  *   **The "Open System" Requirement:** Mention that genuine computations usually require the system to be sensitive to inputs. A closed system (like a rock in a vacuum) cannot realize an interactive computation.

  ### Summary
  **Reject (2).**
  **The Cost:** You must defend a robust theory of physical causation and explain why some physical structures count as "real" computations while others are merely "describable as" computations. You move the debate from mathematics to the metaphysics of causation.

  This is a defensible, standard, and philosophically rich position. It allows you to keep the core of your view (that what matters is what a system *does*) without accepting that rocks have rights.
