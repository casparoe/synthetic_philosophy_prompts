      *   *Better candidate:* "If the murderer forfeits standing, do they retain the right to be told the truth *if* they repent mid-question? When does standing return?" (Highlights the instability of the status).
      *   *Best candidate:* "On your reading, is the duty of veracity owed to *humanity* or to *citizens in good standing*? If the latter, isn't this a political contract theory grafted onto ethics?"
      *   *Actually, the strongest:* "Does this make the Categorical Imperative conditional on the behavior of others?" (Heteronomy).

  7.  **Final Verdict:**
