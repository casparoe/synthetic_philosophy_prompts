      *   **Thesis:** The duty of veracity is a constraint on the *maxim of communicative address*, not the *act-type of asserting falsehood*. The murderer forfeits "communicative standing" by instrumentalizing the question, allowing deception without violating the duty of veracity (avoiding consequentialism).
      *   **Audience:** Kant scholars, historians of ethics, two committed Kantians (Formula of Humanity focus), one virtue ethicist (sceptical of rules), one metaphysics of agency expert. They know the texts intimately (Groundwork, *Doctrine of Right*, *Doctrine of Virtue*, "On a Supposed Right to Lie"). They dislike "spirit over letter" arguments.
      *   **Colleague's Critique:** The reading is either "trivial or heterodox."
      *   **Requirements:** 8 objections ordered by damage potential, phrased in audience vocabulary, 2-minute replies, candid notes on soft spots, advice on concessions/holds, identify the "one question hoping nobody asks," and a plain verdict on survivability. No citations/reading lists needed.

  2.  **Deconstruct the Thesis:**
      *   *Core Move:* Shift from act-type (asserting falsehood) to maxim/communicative context.
      *   *Mechanism:* "Communicative Standing." Murderer forfeits standing by instrumentalizing the interlocutor.
      *   *Goal:* Save the strict duty of veracity while allowing the lie to the murderer (solving the notorious counter-intuitive result of "On a Supposed Right to Lie").
      *   *Risk:* Looks like a loophole (heterodox) or just redefining terms (trivial). Risks collapsing into consequentialism (if forfeiture depends on outcomes) or prudence (if standing is conditional).

  3.  **Brainstorming Objections (Audience Specific):**
      *   *Kantians (FoH):* Does this violate treating humanity as an end? If I lie, I manipulate their rational agency.
      *   *Textualists:* What about "On a Supposed Right to Lie"? Kant is explicit there.
      *   *Metaphysics of Agency:* Does forfeiture of standing make sense metaphysically? Can one lose the status of a rational agent temporarily?
      *   *Virtue Ethicist:* Is this just casuistry? Are you creating a rule-exception structure that undermines character?
      *   *Right vs. Virtue:* Is veracity a duty of right (strict, enforceable) or virtue (wide, internal)? If Right, can standing be forfeited?
      *   *Universalizability:* Can the maxim "Lie to those who forfeit standing" be universalized? Who decides forfeiture?
      *   *Consequentialism:* Does "forfeiture" depend on the *intent* of the murderer (known to me) or the *outcome*? If I'm wrong about their intent, am I permitted to lie?
      *   *Definition of Lying:* Is deceiving without asserting falsehood still lying? (e.g., misleading implicature).

