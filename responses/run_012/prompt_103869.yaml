      7.  *The Virtue Ethics Challenge:* Is this just sophisticated casuistry that erodes the virtue of honesty?
      8.  *Triviality Charge:* Are you just redefining "lying" to make the problem go away?

      *Refining Order:* The Textual Hammer is fatal if not addressed. The FoH manipulation argument strikes the core moral theory. The Right/Virtue distinction strikes the juridical structure. The Epistemic problem strikes the practical application. Let's order by *theoretical damage* to the specific thesis proposed.
