      *   2. **The Coordination/Chaos Argument (Liberals/Pragmatists):** High likelihood. How does anything get done?
      *   3. **The Class Weapon Argument (Marxists):** High theoretical weight in this room.
      *   4. **The "Who Pays/Who Works" Argument (Veterans/Organizers):** Practical logistics.
      *   5. **The Contradiction Argument (Weil-Sympathizers):** Undermines the intellectual foundation.
      *   6. **The Structure Distrust Argument (Anarchists):** Flank attack.
      *   7. **The Burnout Argument (Volunteers):** Human cost of rotating roles.
      *   8. **The "Hope Nobody Asks" (The Transition):** How do we actually get from *here* to *there* without losing everything?

  4.  **Drafting the Replies (Iterative Process):**
      *   *Tone:* Needs to be grounded, not academic. Speak to power and winning.
      *   *Weil Connection:* Keep it implicit or simplified (no quotes). Focus on "collective passion" vs. "truth."
      *   *Bluff/Soft Spot:* Must be honest about where the proposal is untested.
      *   *Concessions:* Admit short-term pain for long-term gain.

      *(Self-Correction during drafting)*: Make sure I don't sound like I'm quoting Weil. The user hasn't read her academically, and the audience hasn't read her at all. The language must be *political*, not *philosophical*, even if the root is philosophical.
      *(Refining the "One Reply"):* What is the core? It's that *permanent* structures corrupt the *goal*. The reply must be: "We aren't giving up power; we are preventing power from eating us."

  5.  **Developing the Prep Sheet Content:**

      *   *Q1 (Veterans):* Focus on long-term viability vs. short-term efficiency.
