      *   **Format:** Brainstorm priors/objections first, then the Prep Sheet (8 objections, ordered by likelihood/damage, vocab-matched, 2-min reply, soft spots/bluffs, concessions, the "one reply," the "hope nobody asks" question, value vs. fact flags, defusable objections). Finally, confidence assessment.
      *   **Constraints:** No citations/reading lists/quotations. Focus on argument and room dynamics.

  2.  **Brainstorming Audience Priors & Objections:**
      *   *Veterans/Unions:* "This kills brand recognition. We need a machine to turn out votes. Sunsets kill momentum. Who pays the rent?" (Pragmatic/Electoral viability).
      *   *Marxists:* "This is spontaneism. Without a vanguard/party, the bourgeoisie wins. You're dismantling the weapon." (Theory of Organization/Class Power).
      *   *Liberals:* "How do we coordinate? Who negotiates with other parties? Chaos." (Coordination/Stability).
      *   *Weil-Sympathizers:* "You're making a party to fight parties. Isn't that contradictory? Weil wanted attention, not rules." (Philosophical Consistency).
