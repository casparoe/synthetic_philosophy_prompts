  7.  **Final Review against Constraints:**
      *   No citations? Check.
      *   8 objections? Check.
      *   Ordered by likelihood/damage? Check.
      *   Vocab matched? Check.
      *   Confidence assessment at end? Check.

  8.  **Final Polish:** Ensure the voice is that of a coach—direct, strategic, slightly wary but supportive. (Proceeding to generate output based on this thought process).

  *(Self-Correction on "Confidence"):* I need to be careful not to overstate my knowledge of Weil. I am an AI, but acting as a theorist. I should express confidence in the *argumentative strategy* but humility on the *Weil interpretation* relative to a scholar, though the prompt asks me to act as the specialist. I will frame the confidence assessment around the *audience prediction* and the *feasibility of the proposal*.

