answer: |-
  You are invoking **Good's Theorem** (1967), which proves that for a Bayesian expected utility maximizer, the expected value of free information is non-negative. The logic is sound: since you can always map the new information to the action you would have taken without it, the optimal action *with* information must yield at least as much expected utility as the optimal action *without* it.

  However, your normative leap—from "this theorem holds for a specific mathematical model" to "any human preferring ignorance is irrational"—is where the argument fractures. The theorem is a tautology within its axioms; your claim is an empirical assertion that humans fit those axioms.

  Here is an audit of your claim, ranking defeaters from decisive (the claim is false in these contexts) to awkward (the claim relies on semantic stipulations). I have located the failure in the assumptions rather than the math, maintaining your requested distinctions.

  ### 1. Strategic Settings and Signaling (Decisive)
  **The Scenario:** You are in a negotiation or a game (e.g., poker) where an opponent can observe *whether* you acquired information, even if they cannot see the content.
  **The Defeater:** The assumption that you can "always ignore what she learns" fails. In strategic interactions, the *act* of acquiring information changes your position. If you look at your cards, your betting patterns may inadvertently signal strength or weakness, or the opponent may update their beliefs simply because you chose to look. You cannot "ignore" the information in the sense of behaving exactly as you would have if you hadn't looked, because the fact that you *know* constrains your strategic equilibrium.
  **Assumption Violated:** **Causal Independence.** The theorem assumes the state of the world and the payoffs are independent of the act of observation. In game theory, knowledge is a strategic asset that alters the game tree.
  **Verdict:** **Concede.** A defender of your claim must dismiss this as "changing the subject," but that is dishonest. Most real-world decisions (medical, financial, relational) are strategic. If knowing you have a genetic marker changes how insurers treat you (even if legally they shouldn't, risk assessment is subtle), the information has a negative expected value due to external response.
  **Distinction:** This is about the **value to the receiver** in a **strategic equilibrium**. Ex ante, the receiver calculates that the signal sent by acquiring info outweighs the benefit of the info itself.

  ### 2. Self-Referential and Causal Information (Decisive)
  **The Scenario:** The information is about your own future choices or dispositions (e.g., a predictor tells you that you will fail a task if you try).
  **The Defeater:** This violates the assumption that the state of the world is fixed prior to action. If the information influences the very outcome it predicts (a self-fulfilling or self-defeating prophecy), the standard conditionalization model breaks. For example, learning you have a disposition to panic under stress may cause you to panic, whereas ignorance would have allowed you to remain calm.
  **Assumption Violated:** **State Independence.** Good's theorem assumes the probability distribution over states of the world is fixed. If the state includes your own psychological reaction to the knowledge, the distribution shifts endogenously.
  **Verdict:** **Concede.** This is a genuine limitation. In cases of "predestination" or psychological feedback loops, information is causally potent. To dismiss this is to insist on a causal decision theory where evidential links don't matter, which is a philosophical stance, not a mathematical necessity.

  ### 3. Preference Instability (Decisive)
  **The Scenario:** Learning the fact changes the agent's utility function (e.g., learning a partner was unfaithful changes the utility of staying in the marriage, not just the probability of success).
  **The Defeater:** Good's theorem assumes stable preferences. If acquiring information transforms the agent such that the *ex post* utility function values the outcome lower than the *ex ante* utility function valued ignorance, the ex ante expected value of information is negative. You are comparing the welfare of Agent A (ignorant) to Agent B (informed), and Agent A prefers to remain Agent A.
  **Assumption Violated:** **Utility Stability.** The theorem assumes $U(outcome)$ is constant. If $U$ is a function of information state $I$, i.e., $U(outcome, I)$, the proof collapses.
  **Verdict:** **Concede.** This is the most common real-world case. People often say "I can't unsee this." The welfare standard shifts. If your friend believes knowing will ruin her ability to enjoy her current life (changing her preferences), she is not irrational; she is protecting her current utility function.

  ### 4. Non-Expected Utility Preferences (Strong)
  **The Scenario:** The agent is averse to ambiguity, prone to regret, or weights probabilities nonlinearly (e.g., Prospect Theory).
  **The Defeater:** Good's theorem relies on the linearity of expectation. If an agent has **regret aversion**, the pain of knowing they made the wrong choice (which information might reveal) can outweigh the benefit of making the right choice. If an agent is **ambiguity averse**, resolving ambiguity might reveal a "worst-case" scenario that creates more disutility than the ambiguity itself.
  **Assumption Violated:** **Expected Utility Maximization.** The theorem proves EVI $\ge 0$ *for EU maximizers*. It does not prove it for regret-minimizers or ambiguity-averters.
  **Verdict:** **Defensible Limitation.** You can dismiss this by defining "rational" strictly as "EU maximizer." But if you do, your claim becomes a definition, not an argument. If "rational" includes managing emotional states like regret, the claim fails.
  **Distinction:** **Ex Ante Expected Value.** Under a regret-averse utility function, the *ex ante* calculation genuinely yields a negative value for information. It is not a mistake; it is a different utility function.

  ### 5. Bounded Rationality and Updating Errors (Strong)
  **The Scenario:** The agent knows they are not a good Bayesian and will over- or under-react (e.g., panic upon bad news).
  **The Defeater:** The theorem assumes updating by conditionalization. If the agent knows ex ante that they will update incorrectly (e.g., treat a 10% risk as a 100% certainty), the expected value of that information is negative. It is rational for a known biased processor to avoid input it cannot process correctly.
  **Assumption Violated:** **Perfect Conditionalization.** The theorem assumes the agent *will* use the information optimally.
  **Verdict:** **Concede.** This applies to almost all humans. If I know I will become depressed and non-functional upon hearing bad news, avoiding the news is instrumentally rational for my welfare. To call this "irrational" is to blame the agent for not being an ideal computer.

  ### 6. Processing Costs and "Free" Information (Awkward)
  **The Scenario:** Information is monetarily free but consumes attention, time, or cognitive resources.
  **The Defeater:** You stipulated "free," but if "free" means only $0 price, the claim is trivial. If information induces anxiety or consumes cognitive bandwidth that could be used elsewhere, it has a cost.
  **Assumption Violated:** **Costlessness.** The theorem assumes the cost of acquisition and processing is zero.
  **Verdict:** **Dismiss as Semantic.** If you define "free" as "zero cost including cognitive load and emotional toll," then by definition, the cost is zero. But this makes the theorem inapplicable to reality. If you define "free" as "no monetary price," the claim is false.
  **Distinction:** **Value to Receiver.** The receiver bears the processing cost. If that cost > benefit, EVI is negative.

  ---

  ### The Verdict

  **Does the claim survive?**
  No, not in the form you are using it with your friend. The claim "there is no rational case for preferring ignorance" is true *only* for an idealized agent who:
  1.  Maximizes Expected Utility (no regret/ambiguity aversion).
  2.  Updates perfectly (no bias/panic).
  3.  Has stable preferences (knowledge won't change what they value).
  4.  Operates in a non-strategic vacuum (no one else reacts to their knowledge).
  5.  Incurs zero cognitive or emotional cost.

  **Are "free" and "ignore" carrying all the weight?**
  Yes. The phrase "you can always ignore it" assumes that ignoring is costless and behaviorally invisible. In the real world, ignoring information you possess is cognitively expensive (suppression) and strategically impossible (your behavior leaks knowledge). The word "free" assumes no emotional or cognitive toll. Once you load these words with real-world meaning, the theorem no longer applies.

  **Was your appeal to it doing real work?**
  No. You used a theorem about idealized probability engines to critique a human being's emotional self-preservation strategy. You did not prove she is irrational; you proved she is not a Bayesian Expected Utility Maximizer. Since no human is, the critique is empty.

  **The Defensible Weaker Claim:**
  *"For an agent with stable preferences and perfect rationality, in a non-strategic environment, acquiring costless information has non-negative expected value."*

  **The Cost of Holding It:**
  It costs you the ability to call your friend "irrational." It relegates the theorem to a **normative benchmark** rather than a **descriptive command**. It suggests that while information is *theoretically* valuable, human architecture (susceptibility to regret, bias, and preference change) often makes ignorance the locally optimal strategy for welfare maximization.

  **Recommendation:**
  Tell your friend: *"I was citing a theorem that assumes we are perfect calculators who don't feel regret or change our minds. You aren't a calculator. If knowing this will hurt you or change how you live in a way you dislike, avoiding it is rational for the kind of agent you actually are."* This preserves your logical honesty without invalidating her welfare.
