answer: |-
  Thanks for reaching out, and first off do not worry about the confusion you felt after the seminar. That reaction is actually a good sign because it means you are engaging with the material at the right depth. Suffering risks are conceptually messy in a way that existential risks are not, largely because existential risk relies on a binary state of existence versus non-existence, whereas suffering risk relies on a gradient of experience that is notoriously difficult to measure or compare. Since you have a summer to work on this and your supervisor has ruled out forecasting, you are in a strong position to do pure conceptual groundwork, which is exactly what this field needs. You asked for an ordering of the questions you listed based on which are most upstream, meaning which ones need to be settled first to make the others easier or to reveal that some are the wrong questions entirely. I will walk through that hierarchy, then discuss tractability for a philosophy student, and finally suggest where you should actually place your bets for the summer project.

  The most upstream question is undoubtedly the first one you listed, regarding whether s-risk is a well-defined target given the problems of aggregating and comparing suffering. This is the metaphysical and meta-ethical foundation of the entire discourse. If suffering cannot be meaningfully compared across minds or summed across time, then the very idea of minimizing s-risk as a quantitative prioritization problem collapses. It would shift the conversation from a utilitarian calculation of total suffering to a deontological constraint against creating specific kinds of minds, or it might dissolve the category entirely. If you cannot establish that suffering is a coherent quantity, then questions about decision theory or moral status become secondary because you lack the object upon which those theories operate. However, I must be honest that this is also the most difficult question to settle. It touches on the hard problem of consciousness and the impossibility of interpersonal utility comparisons, which philosophers have debated for centuries without consensus. For a ten-week project, tackling the full scope of this is risky because you might spend the whole summer just mapping the objections without reaching a conclusion that moves the needle on s-risk specifically.

  The second most upstream question is the one about who counts, which covers moral status and the epistemology of suffering. Even if we accept that suffering is a coherent quantity, we need to know where it resides. This is upstream of the decision theory and axiology questions because you cannot calculate the value of an outcome or determine your duty toward it if you do not know which entities are capable of bearing that value. This question is tricky because it straddles philosophy of mind and empirical science. Since your supervisor wants to avoid empirical forecasting, you would have to focus strictly on the epistemic conditions for ascribing suffering, such as whether functional isomorphism is sufficient for moral status. This is tractable, but it risks becoming a general philosophy of mind project rather than one specific to emerging technologies unless you tie it tightly to the case of digital minds.

  The third layer in this hierarchy is the distinction between axiological and deontological framing, or why we care about suffering in the first place. Once you have a definition of suffering and a scope of who suffers, you need to know the source of the obligation. Is suffering bad because it exists in the world regardless of who causes it, or is it bad primarily because we are the agents creating it? This determines whether your mitigation strategy is about preventing suffering events globally or about constraining your own actions as a builder. This is upstream of decision theory because the source of obligation dictates the decision rule. If the obligation is deontological, you might follow constraints that ignore expected value calculations, whereas an axiological view demands you maximize the reduction of suffering regardless of the cost. This is highly tractable for a philosophy student as it relies on standard normative ethics literature, but it is less fundamental than the definition of suffering itself.

  The fourth question is about decision theory under unbounded badness, specifically whether expected-value reasoning applies when the suffering could be indefinite. This is downstream of the previous three because you need to know what suffering is, who suffers, and why it matters before you can calculate how to prioritize it. However, this is where the unique philosophical challenge of s-risk really shines. If the potential suffering is unbounded, standard expected utility theory breaks down due to problems like Pascal's Mugging or the St. Petersburg Paradox. Settling this would not necessarily solve the definition of suffering, but it would determine whether the standard tools of longtermism are even applicable to s-risk. This is a very strong candidate for a summer project because it is purely theoretical, fits your supervisor's constraints perfectly, and there is existing literature on decision theory under uncertainty that you can apply without needing empirical data.

  The final question, regarding whether s-risks are just x-risks with the sign flipped, is the most downstream. This is largely a classificatory question that depends on the answers to the previous four. If suffering is aggregatable and unbounded, s-risk might look distinct from x-risk because extinction stops suffering while s-risk perpetuates it. If suffering is not aggregatable or if the decision rule is deontological, the distinction might blur. Spending a summer on this alone risks being superficial unless it is used to test the implications of the upstream questions. I would suggest deprioritizing this as a primary focus unless you find that the confusion in the seminar stemmed specifically from a category error between extinction and suffering.

  In terms of tractability for a philosophy student with no empirical data, the definitional question is the least tractable because it is so deep, while the decision theory question is the most tractable because it is formal and bounded. The moral status question is medium tractability but risks drifting into empirical speculation about AI architectures which you want to avoid. The axiology question is high tractability but might feel too abstract if not tied to the specific technology context. The x-risk comparison is high tractability but low impact unless it reveals a fundamental conceptual error.

  If I were in your position, I would recommend focusing on the decision theory question, which is your option d. It is upstream enough that solving it dictates how you act on any theory of suffering, and it is tractable enough to make progress on in ten weeks. You could frame it as an investigation into whether lexical thresholds or non-archimedean value theories are required to handle s-risks, which would bypass the need to solve the aggregation problem fully while still addressing the unboundedness worry. This would allow you to produce a thesis proposal that offers a concrete decision rule for s-risk mitigation without getting bogged down in the metaphysics of consciousness. Alternatively, if you feel strongly about the definitional problem, you could narrow it to a specific objection, such as whether lexical views of value dissolve the s-risk category, but be prepared for the possibility that you will not resolve it definitively.

  To answer your question about what would move things around, if you discovered during your reading that there is a emerging consensus on a functionalist theory of suffering that solves the aggregation problem, then the definitional question would drop in priority and the moral status question would become more urgent. Conversely, if you found that the decision theory literature has already robustly solved the unboundedness problem using something like bounded utility functions, then you would need to move upstream to the axiology question to see if those solutions are ethically acceptable. I am genuinely unsure whether the current literature on infinite ethics has reached a stable point, so you should verify that early in your summer. If it turns out that the decision theory problems are intractable, then you might have to pivot to the deontological framing as a way to sidestep the calculation problem entirely.

  Ultimately, I think you should deprioritize the x-risk comparison because it is derivative, and be very careful with the definitional question unless you narrow it significantly. The decision theory angle offers the best balance of philosophical rigor and relevance to the specific anxieties you raised about unbounded suffering. It allows you to engage with the core weirdness of s-risk without requiring you to solve the hard problem of consciousness. Go into the summer assuming that expected value theory is the bottleneck, and see if you can find a decision rule that handles extreme suffering without collapsing into absurdity. That would be a valuable contribution to the field and a solid foundation for a thesis proposal. Good luck with the reading group, and feel free to check in if you hit a wall with the formal ethics side of things.
