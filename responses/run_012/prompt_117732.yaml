  Using the provided apparatus regarding contrastive explanation, evaluate whether the question why Britain rather than China was the first to break into sustained intensive growth is well posed. Identify which of the three conditions this formulation most plainly violates and argue whether this failure is fatal or repairable. Propose the best reformulation of the question, considering whether recasting it as a question about why sustained growth began at all, or why it began in northwestern Europe rather than the Yangzi Delta, changes what counts as a good answer. Your response must specify what any well-posed contrastive question about the divergence would have to specify regarding the unit of analysis, the time window, and the contrast class, and explain how hindsight and selection on the outcome can make some formulations immune to evidence.

  The question why Britain rather than China industrialized first fails primarily on condition (a) of the provided apparatus because Britain and China do not naturally belong to a single contrast class of cases that could have occupied the outcome position without substantial theoretical stipulation. China is a civilization-state while Britain is an island nation, making them asymmetric units of analysis where the probability of occupying the outcome position is not comparable ex ante. This violation is fatal unless the units are respecified to ensure homogeneity, such as comparing northwestern Europe to the Yangzi Delta, which creates a contrast class of advanced agrarian economies with similar population pressures and market developments circa 1750. Condition (c) is also frequently violated in standard treatments because facts about China are often treated merely as the negation of British facts, such as lacking coal or colonies, rather than possessing independent causal structures that actively resisted intensive growth. A repairable formulation must therefore treat the foil as having its own causal density, where Chinese factors explain stagnation without reference to British success. Recasting the question as why sustained growth began at all shifts the contrast class to all economies, but this risks becoming a singular why-question disguised as contrastive, violating condition (b) by failing to specify why some cases succeeded while others did not within a shared context. The best reformulation specifies the unit of analysis as regional economies rather than polities, sets a time window prior to the divergence becoming obvious to avoid hindsight bias, and defines the contrast class as regions with high wages and commercialization that nonetheless failed to mechanize. Hindsight and selection on the outcome make formulations immune to evidence when the historian selects the winner first and then hunts for differences, ensuring that any unique British trait becomes the cause simply because China lacked it. A well-posed question must allow for the possibility that the foil could have succeeded, meaning the explanation cannot rely on traits that were only identifiable as advantages after the outcome was known. Thus, the divergence question is only well posed if it treats both terms as live possibilities within a shared structural context, where the explanation relies on contingent events or specific constraints rather than essential civilizational differences that render the contrast class incoherent. If the question is not reformulated to respect these constraints, any answer generated will be tautological, deriving the cause from the effect rather than explaining the divergence through independent variables. The shift to northwestern Europe versus the Yangzi Delta repairs condition (a) by aligning the units, but it requires careful attention to condition (c) to ensure that the explanation does not simply list European positives while treating Chinese realities as absences. Ultimately, the validity of the explanation depends on the validity of the question, and without a well-posed contrastive structure, the inquiry collapses into a narrative of inevitability rather than a causal analysis of divergence.

  An A answer must make five specific moves to secure full marks. First, it must identify which of the three apparatus conditions is most plainly violated by the Britain-and-not-China formulation. Second, it must argue whether this failure is fatal to the inquiry or merely requires repair through respecification. Third, it must propose a concrete reformulation, such as shifting the contrast to northwestern Europe versus the Yangzi Delta. Fourth, it must specify what a well-posed question requires regarding the unit of analysis, the time window, and the contrast class. Fifth, it must explain how hindsight and selection on the outcome can render certain formulations immune to evidence by ensuring the cause is defined only by the effect. Errors that should cost marks include reading the question as a request for a list of British advantages rather than an evaluation of the question's structure. Students should also lose marks for supposing that the mere existence of a contrast class settles well-posedness without addressing comparability. Further deductions apply for naming particular historians or their books instead of arguing from the apparatus. Marks are also forfeited if the answer fails to distinguish between singular and contrastive why-questions. Finally, points should be deducted for using formatting such as bold text or bullet points contrary to the exam instructions.
