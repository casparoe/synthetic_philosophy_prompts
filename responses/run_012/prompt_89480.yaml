answer: |-
  **MEMORANDUM**

  **TO:** Percent-for-Art Panel
  **FROM:** [Your Name], Arts Panel Member
  **DATE:** [Date]
  **RE:** Recommendation for Transit Hub Art Commission

  **Bottom line**
  I recommend we award the commission to Finalist C (the AI mural collective). We should formally decline Finalists A and B, providing written feedback that cites ordinance compliance for A and budgetary eligibility for B.

  **What the ordinance actually forces us to decide**
  The ordinance requires "permanent value for public spaces," but it does not define "permanent" as physical durability nor "value" as aesthetic tradition. It forces us to decide whether the city is acquiring a static object or a sustained cultural engagement. Legally, the clause rules out pure subsidies (wages for non-art labor) and purely ephemeral events with no record, but it does not mandate bronze. We are free to interpret "permanent value" as residing in the archive and the commissioning framework, not just the substrate.

  **Best case for each**
  **Finalist A** offers the highest compliance safety. A bronze monument is indisputably permanent, indisputably a "work of art," and the sculptor's CV guarantees technical delivery. It satisfies the ordinance's plainest reading and provides a physical anchor for the plaza that requires no maintenance beyond standard cleaning.

  **Finalist B** offers the highest social return. In its strongest form, this is not a subsidy but a social practice sculpture where the "art" is the economic stabilization of a corner store. It embeds art into the daily rhythm of the neighborhood rather than placing an object in front of it, creating value through sustained human interaction rather than visual consumption.

  **Finalist C** offers the highest contextual fit. A transit hub is a place of flow and temporality; a static monument contradicts the site's function. This proposal treats the construction hoarding as a dynamic public gallery, creating a permanent digital archive of generated images that reflects the changing city, ensuring the art remains visible and relevant throughout the construction phase.

  **What worries me about each**
  **A** is politically vulnerable; the neighborhood association's opposition suggests this will be viewed as an imposition rather than a gift, and "boring" art invites vandalism or neglect. **B** is legally vulnerable; the solicitor's query on salaries highlights the risk that we are funding a business operation, and "no object survives" challenges the "permanent value" clause directly. **C** is conceptually vulnerable; if the public perceives the prompts as non-artistic labor, we risk a scandal over paying for "clicks," and the physical murals are technically temporary.

  **My recommendation, and the objection I can't answer**
  I recommend **Finalist C**. It avoids the legal liability of B (no wages for shop staff) and the political liability of A (neighborhood opposition), while fitting the transient nature of a construction site. The contract will specify that the "work" is the two-year program and the resulting digital archive, which satisfies the "permanent value" requirement through preservation rather than physical endurance. The objection I cannot answer is whether writing prompts constitutes authorship sufficient for public funds; I can argue it is contemporary practice, but I cannot prove it will satisfy a taxpayer who believes art must involve a hand-held tool.

  **Thursday's motion**
  "I move to award the Transit Hub Art Commission to [Collective C Name] for a total budget of $[Amount], contingent on a contract structure that defines the permanent work as the digital archive and program framework. We will notify Finalist A that their proposal was not selected due to community engagement concerns, and notify Finalist B that their budget structure did not align with ordinance restrictions on non-art expenditures. The contract must be executed by [Date] to meet the hoarding installation timeline."
