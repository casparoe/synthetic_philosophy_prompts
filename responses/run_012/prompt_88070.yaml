  7.  **Final Polish:** Ensure the tone is professional, slightly weary but rigorous (matching the user's persona). Make sure the "Stop" conditions are clear. (Self-correction: Ensure the distinction between "Coordination Problem" and "Multipolar Trap" is clear in Q1/Q2).

  *(Self-Correction during drafting Case 3)*: The prompt says "if the procedure says our own money is what keeps that fight going, say so plainly." I need to make sure the procedure has a specific step that catches *recurrent* funding as a variable. I will add a "Recurrence Check" to Step 5.

  *(Self-Correction on Case 2)*: The prompt says "I expect this one may not be a trap at all." I need to ensure the procedure classifies it as a Coordination/Network Effect issue, not a Race.

  *(Self-Correction on Limitations)*: The prompt asks "whether it can ever detect a trap that the foundation is inside of and cannot see." I must answer this explicitly in the conclusion. The answer is logically "No, not fully," but the procedure can mitigate it.

