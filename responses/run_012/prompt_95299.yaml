answer: |-
  This is a classic prompt drawn from David Lewis's 1997 paper, *"Do We Believe in Penal Substitution?"* Lewis uses these exact examples to argue that our intuitive rejection of penal substitution (specifically in theology) is inconsistent with our everyday acceptance of it in legal and sporting contexts.

  To answer your question, we need to distinguish between what these practices **logically require** (presuppose), what **justifies** them (pragmatics), and how they would collapse under a **strict individual-desert** framework.

  ### 1. What do these practices presuppose?

  You offered three options: Group Agency, Transferable Penalty, or Pragmatic Deterrence. Here is how they map onto the practices:

  **A. Group Agency (The team/corp is the real agent)**
  *   **Does it fit?** Yes, especially in corporate law. The law treats the corporation as a "legal person" distinct from its shareholders or employees. When the company pays a fine, the *entity* is being punished.
  *   **Is it needed?** Not strictly. In hockey, the "team" is not a metaphysical agent; it is a collection of individuals bound by rules. The rules *constitute* the team as a unit for the sake of the game, but we don't need to believe the team has a soul or a mind to enforce a bench minor.
  *   **Verdict:** This is a **legal fiction** that fits corporate law well but is not a necessary metaphysical commitment for sports.

  **B. Transferable Penalty (Innocent can bear punishment for guilty)**
  *   **Does it fit?** Yes. This is the core of Lewis's observation. In the hockey bench minor, an innocent player sits in the box. In corporate fines, innocent shareholders lose value.
  *   **Is it needed?** **Yes.** This is the structural commitment. For the practice to work as described, the system must allow liability to detach from the specific moral agent who committed the infraction and attach to a proxy or a collective. Without this commitment, the hockey coach cannot send a random player to the box, and the shareholder cannot be liable for the employee's fraud.
  *   **Verdict:** This is the **necessary presupposition**. The practices *embody* the principle that liability is transferable or shareable.

  **C. Pragmatic Rule (Deterrence without desert)**
  *   **Does it fit?** Yes. This is usually the *justification* given for why we allow these transfers. We penalize the team because penalizing the individual might not deter the organization from creating risky incentives.
  *   **Is it needed?** No. A retributivist could support these rules if they believed the team *collectively* deserved the penalty (returning to Group Agency). The rules function regardless of whether you believe in deterrence or retribution, provided you accept transferable liability.
  *   **Verdict:** This is the **justification**, not the presupposition.

  **Conclusion on Commitments:**
  The cluster of practices **presupposes Transferable Liability**. It does not strictly require Group Agency (though that helps explain it legally), and it is merely *compatible* with Pragmatism (which explains *why* we accept the transfer). Lewis's point is that we implicitly accept that punishment/liability can be borne by someone other than the specific moral wrongdoer.

  ---

  ### 2. The Strict Individual-Desert Counterfactual

  If we replaced the presupposed view with a strict **Individual-Desert View** (only the guilty individual can be punished, and punishment cannot negatively impact the innocent), the practices would have to change radically.

  **A. Hockey (Bench Minors & Goalie Penalties)**
  *   **Current Rule:** Team plays short; any player serves time. If a goalie commits a penalty, a teammate serves the time (because the goalie cannot leave the net).
  *   **Strict Individual-Desert Change:**
      1.  **No Innocent Substitutes:** If Player A commits the infraction, Player A *must* serve the time. If Player A is the goalie, the goalie must leave the net. The game might become absurd (an empty net for two minutes), but strict desert demands the guilty party suffer the disadvantage.
      2.  **No Collective Disadvantage:** Ideally, the *team* should not play short, because the teammates are innocent. The penalty should be a personal handicap (e.g., the offending player is stripped of their stick, or cannot touch the puck), but the team strength remains 5-on-5.
      3.  **Coach Liability:** If the "too many men" error was the coach's fault, the coach should serve the penalty (e.g., ejected from the bench), not a player.

  **B. Soccer (Red Cards)**
  *   **Current Rule:** Player is ejected; team plays with 10 men.
  *   **Strict Individual-Desert Change:**
      1.  **Free Substitution:** The offending player is ejected (they are guilty), but the team is allowed to substitute another player immediately. The innocent teammates should not be handicapped by playing a man down.
      2.  **Result:** The deterrent value of the red card collapses. A team could sacrifice a "enforcer" to commit a tactical foul, knowing they can replace him immediately. The current rule relies on *collective* pain to deter *individual* aggression.

  **C. Corporate Law (Vicarious Liability)**
  *   **Current Rule:** Corporation pays fine; shareholders absorb cost.
  *   **Strict Individual-Desert Change:**
      1.  **No Corporate Fines:** You cannot fine the "entity" because the entity is innocent (it's a fiction); only the human agent is guilty.
      2.  **Asset Recovery:** Fines must be levied directly against the employee's personal assets.
      3.  **Piercing the Veil:** Shareholders would never absorb losses from crimes. However, this creates a problem: if the employee acted to generate profit for the company, and the company keeps the profit but doesn't bear the risk, the company is unjustly enriched. Strict individualism struggles with **unjust enrichment** even if it solves **punishment**.
      4.  **Result:** Corporations would have much less incentive to police their employees, as the financial risk of employee crime would not land on the corporate treasury.

  ---

  ### 3. Lewis's Broader Point

  David Lewis uses this analysis to highlight a tension in our moral reasoning.

  1.  **In Sports/Law:** We accept penal substitution because we view the **unit of responsibility** as flexible. We care more about the integrity of the game or the economic deterrent than about strict retributive justice for the specific individual.
  2.  **In Theology:** We often reject penal substitution (Christ dying for sinners) because we view **moral guilt** as strictly non-transferable.

  Lewis suggests that if we accept substitution in hockey and corporate law, we cannot claim it is *logically impossible* or *incoherent* in theology. The difference must lie elsewhere.

  *   **Possibility:** We accept it in sports because the "punishment" is merely a **handicap** or a **price**, not a moral stigma. Sitting in the penalty box doesn't make the innocent hockey player a "sinner."
  *   **Necessity:** We might reject it in theology because moral guilt involves a relationship with God that cannot be transferred without violating justice in a way that a hockey penalty does not.

  ### Summary
  *   **Presupposition:** The practices **need** the concept of **Transferable Liability**. They do not strictly need Group Agency (though it helps), and Pragmatism is the justification, not the logical foundation.
  *   **Strict Individual-Desert World:** Hockey would require goalies to leave the net for their own penalties and teams to remain at full strength; soccer would allow immediate substitutions for red cards; corporate fines would vanish in favor of individual employee liability.
  *   **Lewis's Insight:** These examples prove that penal substitution is not conceptually incoherent. We practice it routinely. Therefore, objections to theological penal substitution must rest on the specific nature of *moral* guilt, not on the general logic of transferring penalties.
