answer: |-
  You have effectively reinvented a significant chunk of 20th-century moral philosophy (specifically the work of Michael Walzer and the "Doctrine of Double Effect"), but you've done it through intuition rather than jargon. Your "duct-taped" theory is actually remarkably coherent.

  You don't need to drop a verdict. You just need to distinguish between two different types of system errors.

  Here is the single principle that fits your cases, explained in terms you'll recognize, followed by the verdict on your "Secret Success" case.

  ### The Principle: Moral Technical Debt

  Think of morality not as a binary (Pass/Fail), but as a system with **Constraints** and **Commitments**.

  1.  **Constraints (Hard Limits):** These are rights belonging to others that you cannot violate without causing permanent damage to the moral system. (e.g., Right to life, right against torture, right against being used as a tool).
  2.  **Commitments (Soft Limits):** These are obligations you take on voluntarily. (e.g., Promises to friends, duty to tell the truth in non-critical situations).

  **The Rule:**
  You are permitted to override a **Commitment** to prevent a catastrophe without a stain (the Car Crash case).
  You are permitted to violate a **Constraint** to prevent a catastrophe *only if* it is the absolute last resort, but you **must** incur Moral Technical Debt (the Stain).
  You are **never** permitted to violate a Constraint to use a person as a mere tool (the Torture case).

  ### Solving the General vs. Car Crash Paradox

  This is the conflict that was breaking your rule.
  *   **The General:** Violates a **Constraint** (Civilians have a right not to be killed). Even though it's necessary, he has violated a fundamental right. The "Stain" is the acknowledgement of that debt. If he doesn't feel it, he's treating human rights as configurable variables. He is dangerous.
  *   **The Car Crash:** Violates a **Commitment** (A promise to help a friend). In an emergency, the commitment is automatically voided by the higher priority constraint (saving a life). The friend, if reasonable, would agree the promise is null. No debt is incurred. No stain.

  **Why the Doctor fits:** Lying about pain is violating a Commitment (truth-telling), not a Constraint (bodily autonomy). The patient's goal is health; the lie serves that goal. It's a "bug fix," not a "security breach."

  **Why the Torture fails:** Torture violates a **Constraint** (bodily autonomy) *and* treats the person as a **Tool** (means to an end). This is a critical system failure. No amount of good output justifies crashing the kernel.

  ### The CEO Case: Outsourcing the Debt

  Your intuition on the CEO is spot on.
  In your "Technical Debt" model, the CEO is trying to commit the code under a junior developer's username.
  *   If the dirty act is necessary (per the General case), the leader must own the debt.
  *   By delegating, the CEO tries to keep their own `integrity` variable clean while forcing the junior to take the hit.
  *   This compounds the debt. Now you have the original wrong *plus* the betrayal of the subordinate. It is strictly worse.

  ### The Verdict on Your "Secret Success" Case

  > *Case:* Someone does the wrong thing for a good reason, it works out, and nobody ever finds out. Is there still a stain?

  **Yes. The stain remains.**

  Here is why, using your engineering mindset:
  The "Stain" is not a social reputation metric. It is not about whether you get caught. It is about the **state of the agent.**

  If the General kills civilians to save the city, and buries the records so no one knows:
  1.  **External State:** Public trust is maintained.
  2.  **Internal State:** The General has now established a pattern in his own decision-making logic that "Constraints can be ignored if the math works out."

  He has introduced a vulnerability into his own character. The next time the calculation is slightly less clear, the barrier to doing wrong is lower. The "Stain" is the acknowledgement that he has altered his own moral architecture.

  If he feels no stain because "no one knows," he has become a utilitarian calculator, not a moral leader. He is now the kind of person who *can* sleep after killing innocents. That makes him unsafe to hold power again.

  ### Summary of the Unified Rule

  You can collapse your three heuristics (Consent, Intent, Agency) into this single logic:

  **Action is permissible if it prevents catastrophe, BUT:**
  1.  If you violate a **Commitment** (Promise, White Lie): No Stain. (The emergency voids the contract).
  2.  If you violate a **Constraint** (Life, Torture): Stain Required. (You have damaged the moral order).
  3.  If you treat a Person as a **Tool** (Torture, Scapegoating): Action Forbidden. (System Crash).
  4.  If you **Outsource** the Violation: Stain Multiplied. (You added betrayal to the violation).

  **The "Stain" is not a bug; it's a feature.** It is the system's way of ensuring that Constraint Violations remain expensive. If you could do wrong for the greater good and feel *great* about it, you would do it too often. The guilt is the cost function that keeps leaders from optimizing purely for outcomes.

  ### Where You Have to Give Up a Verdict

  You asked where you have to give up. There is one place your gut might fight this model: **The Torture Case.**

  Many people (and some philosophers) argue that if the bomb is real and imminent, the Interrogator *must* torture, and *should* bear the stain (the "Dirty Hands" view). Your gut says "Not ok. Wrong."

  You have to decide if you believe there are **Absolute Constraints** (Torture is *always* wrong, even to save hundreds) or **Threshold Constraints** (Torture is wrong, unless the stakes are high enough, then it's dirty but necessary).

  *   If you stick with your gut (Not Ok): You are a Deontologist. You believe some lines cannot be crossed.
  *   If you shift to (Dirty but Necessary): You are a Walzerian. You believe leaders must sometimes sin for the sake of the people.

  Given your reaction to the General vs. the Interrogator, you seem to draw the line at **Intent**.
  *   General: Civilians die as *side effects* (Collateral Damage). -> Permissible with Stain.
  *   Interrogator: Pain is the *mechanism* (Instrumental Harm). -> Forbidden.

  That is a robust, defensible position. Keep that distinction. It saves the system from becoming purely utilitarian.

  ### Final Output

  **The Principle:** **The Constraint/Commitment Hierarchy.**
  **The Stain:** **Internal Technical Debt** (Exists even if logs are hidden).
  **The Hard Limit:** **Instrumentalization** (Never use a human as a tool).

  You don't need to drop a verdict. You just need to recognize that the "Stain" applies only when you breach a Hard Constraint, not when you override a Soft Commitment. The General breaches a Hard Constraint (Right to Life). The Friend-Crasher overrides a Soft Commitment (Promise). That is why one sleeps with ghosts and the other sleeps fine.
