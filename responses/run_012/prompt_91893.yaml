prompt: |-
  I'm a novelist, and I've somehow ended up in the middle of a proper online pile-on. A character in my new book does something that a lot of people have decided is a stand-in for something they hate, and now there are thousands of posts about me and the book, most of them anonymous, many of them contradictory, none of them from anyone I could actually sit down with. My agent says ignore it. My mate Jess, who's a bit of a philosophy nerd, says something stranger: she says I shouldn't treat it as anyone's opinion at all, because a public isn't a person. She says a crowd like this is a phantom — it has a voice but no one who actually said it, so there's no one there to be wrong or to answer. She also says the whole thing is a kind of levelling, where everyone has an opinion but no one has to stand behind it. I definately think she's got a point, but it also feels like a cop-out: real, seperate people are typing those things, and they're real enough when they're ruining my week. And one of the nastiest posts is from a guy I used to know, with his real name on it. That seems different. I've been reading a bit of a 19th-century Danish philosopher who had a lot to say about the press and the public, and I think that's where Jess is getting it from, but I can't quite make it fit my situation. What should I actually do? Should I reply to any of it, or is the whole idea of replying to a public a mistake? And is Jess right that there's a difference between the public and actual persons — and if so, does that mean the pile-on can't really be wrong about me, or that I still owe something to the people in it, especially the named ones? I'm not asking for a bibliography or anything, just your best advice, and could you write it in British English, please. Also, sorry for the long message — I'm a novelist, we don't do short.
