  3.  **Task 2: Where the Metaphor Breaks:**

      *   *Accretion/No Single Builder:* Code often isn't designed; it evolves. Multiple commits, merge conflicts, copy-paste. There might not be *one* reason. It might be "technical debt" rather than a "fence."
      *   *Bad Reasons:* The original dev might have been junior, tired, or mistaken. A fence built on a mistake shouldn't stand forever.
