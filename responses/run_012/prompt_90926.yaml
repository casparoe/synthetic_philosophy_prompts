      *   *Selection:* "Load-Bearing Wall" is closer to the structural risk, but "Gardening/Pruning" captures the necessity of removal for health. Let's go with **"Technical Debt/Interest"** or **"Archaeology."** Actually, **"Load-Bearing Technical Debt"** is precise. But the prompt asks for a *better metaphor*. Let's suggest **"The Garden"** (requires pruning) or **"The Machine"** (requires maintenance).
      *   *Refinement:* The Lead is worried about *unknown dependencies*. A better metaphor is **"The Black Box Module."** Treat it as opaque until tested.
      *   *Best Fit:* **"Load-Bearing Wall."** It acknowledges some things shouldn't be moved without shoring up, but implies others can be moved. It shifts the burden from "prove why it exists" to "prove it's safe to move."

