          3.  Evaluate the conclusion (Does the argument survive the availability of git history?).
          4.  Historical check (Is this what Burke/Chesterton actually thought, or a caricature?).
          5.  Alternative metaphor (Is there a better one for the underlying concern?).
          6.  Confidence assessment (Rate confidence and flag the least certain claim).

