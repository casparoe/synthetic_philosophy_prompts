prompt: |-
  My tech lead has a new rule for the repo: before anyone deletes old code, we have to write down why it was added in the first place — "Chesterton's fence," he says, "you never pull down a fence until you know why it went up." It started as a good instinct, but now he uses it to block basically every cleanup and calls anyone who wants to refactor a vandal. How far does the fence metaphor actually hold here? Give me the mapping first — who's the fence-builder, what's the pasture, what was the fence keeping in or out — then the places it breaks: what if there was never a single builder with a reason (the fence just accreted, or is a byproduct of something else entirely), or the builder had an awful reason, or the reason's dead and gone? His whole argument seems to lean on the reason being unrecoverable, but we have git blame and tests, so that premise might just be false for code in a way it isnt for laws and institutions — does his conclusion survive that? And is this even what Burke actually thought, or a cartoon of it? If there's a better metaphor for what he's really worried about, name it. Tell me how confident you are in all this, and flag the claim you're least sure about.
