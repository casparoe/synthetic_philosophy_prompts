          *   (1) Fairness = Strategy-proofness.
          *   (2) Gibbard-Satterthwaite (G-S) Theorem.
          *   (5) Rationality = Maximizing utility (voting strategically if beneficial).
          *   (8) Aggregating misreported preferences $\neq$ Will of the voters.
