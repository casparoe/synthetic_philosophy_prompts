  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* The user said they *chose to defend*. Wait, re-reading: "I stupidly chose defend, so I need someone to tell me where it actually breaks." Okay, they need to know the weaknesses so they can preemptively address them in their defense, OR they want to switch to dismantling. I should treat this as "Help me find the holes so I can patch them (if defending) or exploit them (if I switch)." Actually, the prompt asks "which step do I give up, and what does giving it up cost me?" implying they are open to dismantling it now or understanding the cost of the defense. I will frame it as "Here are the attack points your marker will look for."
