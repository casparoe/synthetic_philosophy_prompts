answer: |-
  Bottom line
  You have a sophisticated understanding of how technology exerts power, but your view on human agency contradicts it. Essentially, you argue that code is political whilst insisting coders bear no responsibility for that politics.

  The real clashes, worst first
  Views 1 and 5 are in direct conflict. If artifacts carry politics (1), then building them is a political act; absolving engineers of blame (5) renders the claim that design is political toothless. You cannot maintain that the bridge is a political barrier while insisting the architect bears no responsibility for who it excludes.

  Views 1 and 2 contradict on the source of power. View 1 assumes human design choices matter politically, whereas View 2 claims technology follows an inevitable logic regardless of human intent. You cannot claim design is a site of political struggle if the outcome is technically determined by efficiency alone.

  Views 3 and 4 clash on where values live. View 3 asserts values stop at shipping and the system is merely mechanical downstream, but View 4 admits algorithms actively shape behaviour downstream. If the system is shaping reality during operation, the politics are active, not just historical upstream decisions.

  Tensions that aren't
  Views 1 and 4 are compatible twins; both assert that technical systems are non-neutral and actively shape social outcomes. Views 2 and 3 are deterministic cousins; if technology follows its own logic (2), it is consistent to view the shipped system as a value-free machine (3).

  Cheapest single revision
  Amend View 5 to acknowledge that if artifacts are political (1), engineers share responsibility for the consequences, even if unintended. This aligns your moral stance with your structural analysis without requiring you to overhaul your technical model.
