prompt: |-
  Ok so I'm a backend engineer, no philosophy training, but I've been reading around this area and I've ended up with a set of views I genuinely hold and can't tell whether they fit together. Here they are:

  1. Artifacts carry politics. Build a bridge too low for the buses you don't want going through, or a form that only accepts two genders, or a ranking system that quietly decides who gets seen — none of that is neutral. The design is doing political work.
  2. Technology mostly follows its own logic. Given time and competition the better solution tends to win, and what gets built is driven by what's possible and efficient, not by whoever's in charge. Governments come and go; the tech keeps going the way it goes.
  3. Once a system is shipped it's basically just a machine doing what it does. The values are all upstream, in the design and the requirements. Downstream it's just behaviour.
  4. There's no such thing as a neutral algorithm. Any recommender or feed shapes what people do; that's the entire point of it.
  5. I don't blame the engineers who built a big social feed for what it did to politics. They built a thing; what people and companies then did with it is on them.

  I can't tell which of these actually clash and which just look like they do. Some of them feel like they're pulling in different directions but then I talk myself out of it.

  Format please: start with a section called 'Bottom line' (2-3 sentences, just tell me the verdict up front). Then 'The real clashes, worst first' — one short para per clash, naming the numbers, saying how bad it is, and what would have to give. Then 'Tensions that aren't' — brief, for the pairs that only look bad and why they're fine. Then 'Cheapest single revision' — short, what one change cleans up the most. British English please.
