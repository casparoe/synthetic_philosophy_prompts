answer: |-
  Here are 10 questions tailored for your interview. They are designed to be respectful but sharp enough to get past the "smooth" expert answers. I've highlighted the four hardest ones with specific follow-ups based on the answers he's most likely to give.

  ### 1. The Reference Class Selection (Hard)
  You restrict your reference class to powers that had a reserve currency, a big standing army, and *thought* they were permanent. My dad calls this "reference class tennis"—where you keep picking the class until you get the answer you wanted. How do you prove these criteria aren't just selected because they match the U.S. specifically, rather than being actual causes of collapse?

  > **Follow-up (if he says these are objective causal mechanisms):**
  > "But the British Empire had all three of those things and transitioned power relatively peacefully. If you include them in the class, doesn't that break your collapse narrative? And if you exclude them, aren't you just gerrymandering again?"

  ### 2. The Double Outside View
  You argue we need an outside view for the empire, but also an outside view for the *forecasters*, because most confident decline predictions fail. But doesn't that undermine your own forecast equally? If the base rate of successful prognosticators is low, why should we treat your hazard rate as an exception to that rule?

  ### 3. The "Visible Crisis" Filter
  To reconcile those two outside views, you say we should only count predictions made during a visible crisis. Isn't that selecting for times when things already look bad? Doesn't filtering for "visible crises" guarantee a high hazard rate by definition, rather than revealing a true risk?

  ### 4. Independence and Contagion (Hard)
  Reference class forecasting usually assumes independent draws, like rolling dice. But empires exist in a connected global system—if one falls, it might drag others down or change the rules entirely. How do you account for contagion or systemic risk without going back to the "inside view" reasoning you told us to avoid?

  > **Follow-up (if he says they adjust for systemic risk factors):**
  > "But once you start adjusting for specific systemic risks—like nuclear weapons or global trade aren't you just doing the inside-view reasoning you told us to avoid? Where is the line between a 'base rate' and a 'specific argument'?"

  ### 5. Hazard Rates and Agency (Hard)
  You say the honest output isn't a date, it's a hazard rate—like a life table for empires. But life tables are for biological inevitability. Does framing it this way smuggle in determinism? If the hazard rate is high, does reform even matter, or does this model suggest the outcome is mostly structural?

  > **Follow-up (if he says it informs policy to lower the rate):**
  > "But if the base rate from history is the dominant driver, doesn't that imply policy changes are just noise compared to the structural decay? How do you quantify the impact of human agency against a historical base rate?"

  ### 6. Defining "The End"
  What specifically counts as the "end of primacy" in your model? Is it losing the reserve currency, losing a major war, or just feeling weaker? Because the hazard rate changes completely depending on which one you pick, and "primacy" feels pretty subjective.

  ### 7. Falsifiability (Hard)
  Since you give probabilities instead of dates, it's hard to be definitively wrong. What specific observation would make you drop your model entirely? I don't mean just updating the numbers, but throwing the framework out.

  > **Follow-up (if he says persistent stability would change his mind):**
  > "But couldn't you just say 'the crisis wasn't visible enough' to protect the model if things stay stable? What observation breaks the shield where you can't just adjust the hazard rate downward?"

  ### 8. The "Permanence" Criterion
  You include powers that "thought they were permanent." Isn't that subjective? Almost every hegemon thinks they're permanent until they aren't. Isn't using belief in permanence as a criteria basically a tautology for "empires that fell"?

  ### 9. Actionable Output
  If your model says there's a significant chance per decade of primacy ending, what is the actionable output for a citizen? Should we prepare for collapse (hoard resources) or try to prevent it (invest in institutions)? Those require opposite strategies.

  ### 10. Closing
  If our listeners take away one thing that isn't a specific date or a year, what should it be? What's the one insight from demography that you wish more history students understood?

  ***

  **Tips for the interview:**
  *   **Don't apologize:** You don't need to say "I'm just a student" before asking these. You've done the prep.
  *   **Use the follow-ups:** If he gives a vague, smooth answer to the hard questions, don't be afraid to say, "Okay, but following up on that..." and read the follow-up.
  *   **Silence is okay:** After he answers, wait two seconds before speaking. Sometimes he'll keep talking and reveal more than he planned.

  Good luck with the podcast! Even if it's mostly your mom listening, treating it like a real show is the best way to get better.
