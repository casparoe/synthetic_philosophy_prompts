answer: |-
  Here is the map you requested, drawn according to your specifications.

  ### I. The Hierarchy of Objections

  To rank objections against intrinsicism, we must distinguish between those that sever the link between phenomenology and badness empirically, and those that suggest the link is conceptually confused. The ranking proceeds from those that render the view logically untenable to those that merely render it theoretically costly.

  **1. The Fatal Defeater: Phenomenal Dissociation without Qualitative Change**
  *   **The Case:** A subject undergoes a procedure (lesion or pharmacological) and reports: 'The sensation feels exactly as it did before—same burning, same throbbing, same location—but it is no longer bad.' Crucially, they do not report a 'hollowing out' of the sensation; they report the qualitative character is identical, yet the normative status has flipped.
  *   **Why Fatal:** Intrinsicism claims the badness *is* the phenomenal character (or an inseparable aspect of it). If the phenomenal character remains constant while the badness vanishes, the identity claim is falsified. This is not merely a separation of motivation and sensation; it is a separation of *value* and *feel*.
  *   **Ranking:** Decisive. It contradicts the core definition.

  **2. The Strong Defeater: The 'Hollow' Pain (Pharmacological Asymbolia)**
  *   **The Case:** Your 'Drug 1' scenario. Subjects retain sensory discrimination and autonomic signatures but report the experience is 'intense but not bad'. Upon phenomenological interrogation, they describe the quality as 'changed', 'distant', or 'hollow', rather than identical.
  *   **Why Strong:** This suggests the 'hedonic gloss' is a separable component of the experience, not intrinsic to the sensory quality itself. It supports a 'multi-component' view of pain (sensory + affective) rather than your intrinsicist view (sensory-affective unity). It forces you to argue that what they call 'pain' is merely a shadow of the real thing.
  *   **Ranking:** Severe, but absorbable if one is willing to revise the definition of 'pain' to require the gloss.

  **3. The Moderate Defeater: The Evolutionary Mismatch**
  *   **The Case:** If badness is intrinsic to the sensation, why is the motivational link so contingent (as in asymbolia)? Evolution typically wires intrinsic badness tightly to avoidance. If the badness were truly intrinsic, one might expect the motivational pull to be conceptually necessary, not merely nomologically usual.
  *   **Why Moderate:** This attacks the *explanatory power* of the view rather than its truth. It suggests intrinsicism makes the connection between feeling pain and minding pain mysterious, whereas motivationalism makes it tautological.
  *   **Ranking:** Theoretical discomfort. It suggests your view is less naturalistic than rivals, but does not prove it false.

  **4. The Awkward Defeater: Introspective Opacity**
  *   **The Case:** It may be impossible for subjects to distinguish between 'the hurt itself' and 'the reaction to the hurt'. When a subject says 'this hurts', they may be reporting a composite of sensation and aversion without the ability to parse them.
  *   **Why Awkward:** This undermines the data upon which intrinsicism rests. If first-person authority cannot isolate the 'hedonic gloss' from the 'aversion', the view lacks a secure foundation.
  *   **Ranking:** Merely awkward. It calls for better phenomenological methods, not abandonment of the view.

  ### II. Concessions and the Asymbolic Case

  You ask how an intrinsicist should handle pain asymbolia. There are three readings, as you noted.

  **(a) Straightforward Counterexamples:**
  To accept this is to abandon intrinsicism. If asymbolics feel pain (sensory-discriminatively) and it is not bad for them, then badness is not intrinsic to the sensation. I advise against this concession unless the evidence for phenomenal identity is overwhelming.

  **(b) Diminished or Analogical Sense (Recommended):**
  This is the most robust defence. The intrinsicist argues that 'pain' in the full sense entails a hedonic tone. Asymbolics experience *nociceptive sensation* without *painfulness*. They have the input without the intrinsic badness.
  *   **Grounds:** This preserves the conceptual link between pain and suffering. It treats 'pain' as a thick concept, like 'murder' (which entails wrongfulness) rather than 'killing'.
  *   **Cost:** You must accept that ordinary language is loose. We call what asymbolics feel 'pain', but philosophically, it is a deficient mode.

  **(c) Untrustworthy Report:**
  This claims the badness is present, but the patient is dissociated from it or unable to express it.
  *   **When Respectable:** This is respectable only if supported by neural evidence. If the Anterior Cingulate Cortex (ACC) and Insula (regions associated with the affective dimension of pain) show activation patterns identical to suffering subjects, despite behavioural calm, then the report is unreliable. The patient may be suffering but unable to integrate it into action or narrative.
  *   **When Ad Hoc:** If neural activity in affective regions is *absent* or significantly diminished, insisting they are suffering is denialism. It becomes a 'no true Scotsman' defence that insulates the theory from all empirical refutation.

  **Verdict on Asymbolia:** Concede (b). Argue that asymbolics lack the *phenomenal badness*, not just the reaction. The sensory-discriminative content is present, but the 'hurt'—the intrinsic badness—is missing. This reclassifies the case from a counterexample to a boundary case.

  ### III. Unique Predictions and Embarrassing Results

  Intrinsicism is committed to a specific neurophenomenological prediction that rivals (specifically Motivationalism) are not.

  **The Prediction:**
  Intrinsicism predicts that there is no neural switch for 'badness' that operates independently of the neural correlate of the 'phenomenal character'. If you extinguish the badness, you *must* alter the phenomenal character. Motivationalism, by contrast, predicts you can extinguish the badness by severing the motivational circuitry while leaving the phenomenal sensory representation intact.

  **The Test:**
  Use high-resolution neurofeedback or targeted stimulation. Train a subject to modulate activity in the affective pain matrix (ACC/Insula) while monitoring activity in the somatosensory cortex (S1/S2).
  *   **Intrinsicist Expectation:** As affective activity drops, the subject must report a change in the *quality* of the sensation (e.g., 'it feels less sharp', 'it feels distant').
  *   **Rival Expectation:** The subject reports 'it feels exactly the same, I just don't mind it.'

  **The Most Embarrassing Result:**
  A subject successfully down-regulates affective activity to baseline, shows no avoidance behaviour, reports 'zero suffering', yet describes the sensory qualia (burning, throbbing, location) as *identical* to a baseline painful state, verified by stable S1/S2 activation. If the 'feel' is truly identical but the 'badness' is gone, intrinsicism is false. The badness cannot be intrinsic to the feel if the feel survives the departure of the badness.

  ### IV. Insulation and Qualification

  Is intrinsicism insulated from refutation by quiet qualification? **Yes.**

  It is insulated by the reliance on first-person authority regarding 'what it is like'. If a subject says 'it feels bad', the intrinsicist says 'therefore it is bad'. If a subject says 'it feels like pain but isn't bad', the intrinsicist says 'then it wasn't really pain' or 'you are misdescribing the feel'.

  **Is this a defect?**
  In a metaphysical view claiming to describe the world, this insulation is a defect. It risks making the view unfalsifiable. However, in a phenomenological view claiming to describe the *structure of experience*, this insulation is a sign that the question is being asked correctly. The 'badness' of pain is not a physical property like mass; it is a value-property revealed only in experience.
  **Verdict:** It troubles the view only if you demand a third-person reduction. If you accept that value is a first-person datum, the insulation is necessary. However, you must not allow this insulation to prevent you from engaging with third-person data (neuroscience). If the insulation becomes a wall against *all* external data, the view becomes idle.

  ### V. The Drug Cases: Aversiveness vs. Hedonic Gloss

  You distinguish **Aversiveness** (motivational pull) from **Hedonic Gloss** (felt badness). You ask if the gloss is a third thing.

  **Drug 1 (Sensory intact, Aversion/Gloss abolished):**
  Subjects say: 'Intense, localised, but not bad.'
  *   **Analysis:** This is the pharmacological mirror of asymbolia.
  *   **Implication for Gloss:** If subjects say the *quality* is unchanged, the Gloss is not intrinsic to the Sensory Content. It suggests the Gloss is a separate layer (supporting Evaluativism or Motivationalism). If subjects say the *quality* is changed (e.g., 'it feels flat'), then the Gloss is part of the Sensory Content (supporting Intrinsicism).
  *   **Separability:** This case shows Aversiveness and Gloss can be manipulated together. It does not yet separate Gloss from Sensation.

  **Drug 2 (Sensory abolished, Badness/Gloss intact):**
  Subjects say: 'Something is awful, but I can't say where or how.'
  *   **Analysis:** This resembles free-floating anxiety or suffering without nociception.
  *   **Implication:** This shows the Hedonic Gloss can exist without specific Sensory-Discriminative content. It suggests the Gloss is a distinct mode of awareness (affect) that can attach to objects other than bodily sensation.

  **The Mirror Image:**
  Drug 1 is the true mirror of asymbolia. Drug 2 is the mirror of 'suffering without pain'.

  **What Neither Could Show:**
  However clean the result, neither case can settle whether the Gloss is a **third thing**.
  *   **Reason:** Both cases rely on report. If a subject under Drug 1 says 'it is not bad', we do not know if the *badness* was removed or if their *concept* of badness was altered.
  *   **The Limit:** These cases cannot distinguish between:
      1.  The Gloss being a distinct phenomenological ingredient (like salt in soup).
      2.  The Gloss being a *mode of presentation* of the sensation (like the soup being tasted angrily).
      If the drug changes the mode of presentation, the subject might report 'no badness' even if the sensation is the same. The drugs show causal separability, not ontological distinctness. They show we can switch the light off, but not whether the light is the bulb or the electricity.

  ### VI. Arguments from Role (Learning and Avoidance)

  You are moved by what pain explains. This is the weakest point for Intrinsicism.

  **The Defeater:**
  Pain explains avoidance learning. If the badness is intrinsic to the sensation, the explanation is: 'The creature avoids the stimulus because the sensation is bad.'
  But if, as Intrinsicism allows, the sensation can occur without the badness (in asymbolia or via Drug 1), then the sensation *alone* does not explain avoidance. The *badness* explains it.
  **The Problem:** If the badness is intrinsic, why does it not *necessitate* avoidance? A truly intrinsic badness should compel a rational agent. If the link is contingent, the badness looks more like a motive (Motivationalism) than a quality.

  **Relocating the Badness:**
  Can Intrinsicism survive this? Only by relocating the badness from a *property of the sensation* to a *reason-providing fact*.
  *   **Move:** Argue that the phenomenal character *provides a reason* for avoidance, but does not causally necessitate it. The asymbolic patient feels the reason but is pathologically unable to act on it (akinesia of the will).
  *   **Viability:** This is costly. It makes pain's badness a normative reason rather than a causal driver. It saves the view but distances it from the biological reality of pain as a driver of behaviour.

  ### VII. Final Verdict

  **How exposed is the view?**
  Intrinsicism is highly exposed to neurophenomenological refinement. It rests on a subtle introspective distinction ('the hurt' vs 'the minding') that may not survive rigorous scrutiny. If neuroscience demonstrates that the 'affective' component can be silenced while the 'sensory' component remains phenomenologically identical (not just behaviourally), Intrinsicism collapses.

  **What would settle the matter?**
  A 'Phenomenal Match' experiment. A subject is put in a state of Drug 1 (putative pain asymbolia). They are asked to compare it to a veridical pain state.
  *   If they say: 'Qualitatively identical, I just don't care,' Intrinsicism is refuted.
  *   If they say: 'Qualitatively different, it lacks the "bite",' Intrinsicism is confirmed (the 'bite' was the intrinsic badness).

  **The Single Most Damaging Case:**
  A subject with a precise cingulotomy who reports: 'The pain feels exactly as it did before the surgery—same burn, same throb—but I no longer mind it,' and whose behavioural and autonomic responses confirm a total lack of distress.
  If the *feel* is truly identical, the badness was not intrinsic to the feel. It was a reaction to it.

  **Conclusion:**
  Your view is elegant and captures the immediate 'givenness' of pain's unpleasantness. However, it risks conflating the *sensation of badness* with the *badness of the sensation*. To survive, you must insist that the 'hedonic gloss' is not a layer of paint on the sensory canvas, but the texture of the canvas itself. If it turns out to be paint, your view falls. The risk is substantial, but the view is not yet dead; it awaits the phenomenology of the drug cases.
