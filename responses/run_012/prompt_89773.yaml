answer: |-
  Your dual position exposes the boundary problem's practical spine. Here is the prioritization based on charter impact, argumentative settability, and theoretical dependence.

  **1. The Moral Status of the Founding Act.** This is the load-bearing question. You must determine if the initial boundary is a pre-political contract or a democratic act. I argue the founding case and revision case are *not* governed by the same principles. Founding is constitutive; revision is political. This moves up your list if legal counsel confirms the city's autonomy hinges on contractual consent from initial residents; it moves down if state law mandates democratic ratification. If the founding is pre-political, the charter is an offer sheet. If democratic, you need a ratification referendum. This alters the document's preamble and adoption clause fundamentally, deciding whether the first residents are signatories or voters.

  **2. The Validity of Self-Selection.** Take the position that self-selection is a relocation of the problem, not a solution. Mere opt-in doesn't legitimize boundaries if exit costs are high or information asymmetric. This moves up if the city targets transient labor or relies on economic desperation; it moves down if residency is permanent and wealth-screened. Practically, this demands charter clauses guaranteeing exit rights and transparency to make consent meaningful. Without this, the boundary is coercive. This changes the residency and exit clauses, transforming them from administrative details into legitimacy conditions.

  **3. The Mechanism for Boundary Revision.** Since founding and revision differ, the amendment clause must distinguish boundary changes from policy changes. This moves up if rapid expansion is planned; it moves down if stability is prioritized. This requires a supermajority for boundary adjustments, preventing simple majorities from altering the demos. This alters the amendment procedure, ensuring the boundary isn't too easily shifted by temporary majorities.

  **4. Coercion vs. Affected Interests.** Prioritize 'all subject to coercion' over 'all affected interests' for voting rights. This moves up if non-resident investors are significant; it moves down if the city is purely residential. This limits voting to residents, preventing investor capture. This alters the franchise clause, defining the electorate strictly by jurisdictional subjection rather than economic stake.

  Ignore the infinite regress arguments (who decides who decides ad infinitum) and the global demos question. They are theoretical dead ends for a municipal charter; you cannot solve the universal problem locally. Be willing to accept the honest answer: the founding case is largely a philosopher's puzzle, and the practical drafting should ignore it entirely as a democratic problem. Treat the founding as a contractual offer, not a democratic act. Democracy begins *after* the boundary is set by contract. Focus your theory on legitimizing the transition from contract to constitution, not the contract itself. Your dissertation should explain why the boundary problem dissolves once the charter is signed, rather than trying to solve it before the first resident arrives.
