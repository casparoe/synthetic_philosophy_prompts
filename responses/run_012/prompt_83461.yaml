  I've been reading alot about the problem of verisimilitude and I think I've convinced myself of something depressing. Popper's old definition said theory A is closer to the truth than theory B if A has more true consequences and fewer false ones. Then those counterexamples came along showing that on that definition any two false theories are at least as close to the truth as each other, so it cant order them. But doesnt that show the whole project of verisimilitude is impossible? If we can't even say Newtonian mechanics is closer to the truth than Aristotelian physics, then truthlikeness is just a word for whatever theory we happen to like, and science is no better than any other story. I know people still work on this, but I dont see what's left. Can you explain what a defensible version of verisimilitude actually looks like and whether it can do real work in theory choice, or is it just a formal game? Also, tell me how confident you are in what you're saying and single out the point you're least sure about.
