prompt: |-
  So I got into a dumb argument on a Discord about whether group selection is a real thing, and this guy kept repeating a line he swears he got from a biology book: a chicken is just the egg's way of making another egg. He used it like a knockout punch. His move was: the egg (or the gene) is the thing that actually gets copied, bodies just come and go, so everything that looks like it's "for the good of the group" is an illusion and selection can only ever happen at the level of the gene. I don't think the line is wrong exactly, but I also don't think it means what he thinks it means, and I couldn't articulate why in the moment.

  Can you take that one sentence and lay out all the different precise claims it could be making? I want the whole menu, from the almost trivial version (genes get copied faithfully across generations, bodies don't) up through the middle ones (genes are the ones adaptations are "for," genes are the beneficiaries) to the really strong ones (genes are the only real causal agents and bodies are just tools/vehicles, so nothing above the gene can ever be a unit of selection). For each reading, tell me whether it's true, false, or just a restatement of something more basic, and flag the ones that sound strong but turn out to collapse into the trivial one when you push on them.

  Then tell me which of those readings he actually needs to get his conclusion that group selection is a non-starter. Is there a reading where the slogan genuinely does that work, or does he need to smuggle in something the sentence doesn't say? And is there a defensible reading where genes matter in this way AND higher levels of selection are still real, or are those two things in tension?

  Give it to me as a list I can paste back at him, not a lecture. I don't need sources, I just need the readings sorted and each one labeled.
