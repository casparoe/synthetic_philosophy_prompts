answer: |-
  # The Hard Choice Inventory

  **Instructions:** For each scenario, select the option that best matches your intuitive judgment. Don't overthink the philosophy; go with your gut reaction to the case.

  ### 1. The Two Careers
  You are choosing between becoming a Corporate Lawyer or a Professional Clarinetist. The Lawyer job pays more, has better hours, offers more prestige, and provides greater job security. The Clarinet job pays less, has worse hours, offers less prestige, and is less secure. You know all these facts. Yet, you are not convinced the Lawyer job is better. Why?
  *   **A.** There must be some other dimension of value (e.g., "meaning" or "fulfillment") where the Clarinet job wins, even if I haven't named it yet.
  *   **B.** The values at stake (money vs. art) are different kinds of goods that cannot be summed into a single score.
  *   **C.** Neither option is better; by choosing one, I commit myself to making it the right choice.

  ### 2. The Small Improvement
  You are choosing between a Beach Vacation and a Mountain Vacation. You feel they are "on a par"—neither is better, but they aren't exactly equal either. Now, suppose the Beach Vacation package is improved slightly: you get a free upgrade to an ocean-view room for no extra cost.
  *   **A.** The Beach Vacation is now strictly better than the Mountain Vacation.
  *   **B.** The Beach Vacation is still not strictly better; the small improvement doesn't bridge the qualitative gap.
  *   **C.** It makes no sense to say one is "better" than the other, even with the upgrade; they are incomparable.

  ### 3. The Mundane Tragedy
  You can only visit one sick relative today: your Aunt or your Uncle. Both are equally sick, equally lonely, and both want to see you. You cannot visit both.
  *   **A.** It doesn't matter which you choose; flip a coin. You have no remaining obligation to the one you didn't visit.
  *   **B.** Whichever you choose, you have wronged the other slightly. You owe them an apology or restitution later.
  *   **C.** There is a fact about which one needs you more (e.g., subtle medical details), even if you can't know it.

  ### 4. Rational Regret
  You make a difficult choice between Option A and Option B. Later, you learn every possible fact about the outcomes of both paths. You discover you chose the objectively "better" option (if such a thing exists). Do you feel rational regret for not choosing the other?
  *   **A.** No. If I chose the best option, regret is irrational.
  *   **B.** Yes. Something of value was lost forever, and it is rational to mourn that loss even if I chose correctly.
  *   **C.** Regret is just a feeling, not a rational assessment of value.

  ### 5. The Lexical Test
  To save one million people from mild headaches, is it permissible to torture one innocent child for an hour?
  *   **A.** No. Certain values (justice/rights) always trump others (aggregate welfare), no matter the numbers.
  *   **B.** Yes. Everything has a price; if the headache relief is great enough, it outweighs the torture.
  *   **C.** It depends entirely on the specific context of the torture and the headaches; no general rule applies.

  ### 6. The Ice Cream Stand
  You are staring at Chocolate and Vanilla ice cream. You feel completely indifferent and cannot decide.
  *   **A.** I just don't know my own preferences yet. If I tasted both, I'd know.
  *   **B.** They are objectively equal in value to me right now.
  *   **C.** My choice will establish which flavor I prefer; the preference doesn't exist prior to the choice.

  ### 7. The Covering Value
  When you ask, "Which option is better overall?" in a hard choice (like Career vs. Art), what does "better overall" mean?
  *   **A.** It refers to a single universal scale (like "utility" or "well-being") that applies to all choices.
  *   **B.** It refers to a covering value specific to this context (e.g., "choiceworthiness-for-me-now"), not a universal scale.
  *   **C.** It is a nonsense question. There is no "overall" ranking, only rankings relative to specific values.

  ### 8. The Source of Reasons
  Why do you choose the Clarinet career over the Lawyer career (assuming you do)?
  *   **A.** Because the reasons favoring it are weightier.
  *   **B.** Because I will it. My commitment creates the reason.
  *   **C.** Because I am causally determined by my psychology to pick it.

  ### 9. The Role of Principles
  How do you navigate hard choices generally?
  *   **A.** I try to measure outcomes against a consistent standard.
  *   **B.** I look at the specific details of the case without appealing to general rules.
  *   **C.** I follow strict priority rules (e.g., "Safety first," "Justice always").

  ***

  # Scoring Key

  Tally your answers. While philosophical views are nuanced, your dominant pattern suggests a primary alignment.

  *   **Mostly A (The Calculator):** **Strong Commensurability.** You believe there is a single fact of the matter about which option is better, grounded in a universal scale. Hard choices are epistemic problems (lack of information or computation power), not metaphysical ones.
  *   **Mix of A (Q1, Q4) and B (Q7):** **Weak Commensurability.** You believe there is a fact about which is better, but deny there is a single universal scale. There is a "covering value" for each case, but it doesn't reduce to a global currency like utils.
  *   **Mostly C (Q2, Q7) & B (Q1):** **Incomparability.** You believe some options genuinely lack a value relation. Neither is better, worse, nor equal. The concept of "better overall" fails here.
  *   **Mostly B (Q2) & B (Q1, Q4):** **Parity.** You hold that options can be comparable without one being better. The "Small Improvement" argument (Q2) is your signature: a tiny boost doesn't tip the scale because the relation isn't equality.
  *   **Mostly A (Q5) & C (Q9):** **Lexical Priority Pluralism.** You believe in multiple values, but they are hierarchically ordered. Some values (rights) lexically dominate others (utility), preventing trade-offs.
  *   **Mostly C (Q5, Q9) & B (Q7):** **Particularism.** You deny that general principles or covering values govern choices. What is right is determined case-by-case by the specific features of the situation.
  *   **Mostly A (Q6) & C (Q4, Q8):** **Deflationary.** You believe "hard choices" are actually uncertainties about your own psychology or preferences. There is no deep metaphysical conflict, just ignorance of self.
  *   **Mostly C (Q1, Q6, Q8):** **Existentialist.** You believe reasons are not found but made. The choice itself confers value on the option. The hardness comes from the burden of creating value, not discovering it.

  ***

  # Limitations & Incoherent Combinations

  **1. Strong vs. Weak Commensurability (The Measurement Problem)**
  This quiz cannot reliably separate **Strong Commensurability** from **Weak Commensurability**. Both positions assert there is a "fact of the matter" about which option is better (Q1, Q4). The difference lies in *how* that fact is constituted (universal scale vs. contextual covering value). In practice, users who believe there is a "right answer" will often select 'A' on both Q1 and Q7, conflating the two. Distinguishing them requires meta-ethical interrogation about the nature of "goodness" that a case-based quiz cannot fully capture.

  **2. Parity vs. Incomparability (The Intuition Gap)**
  Distinguishing **Parity** from **Incomparability** relies entirely on Question 2 (The Small Improvement). Many users find the Parity intuition (B) unstable. If two things are not equal, and neither is better, adding value to one *should* make it better. Users who select 'C' (Incomparability) often do so because they reject the premise that the options are comparable *at all*, whereas Parity requires them to be comparable but not ranked. If a user finds Q2 confusing, their result between these two positions is unreliable.

  **3. Incoherent Combinations**
  *   **The Calculator + The Creator:** If you scored high on **Strong Commensurability** (facts exist independently) and **Existentialist** (choices create facts), your view is logically inconsistent. You cannot believe values are discovered facts *and* that they are created by will.
  *   **The Lexical + The Calculator:** If you scored high on **Lexical Priority** (some values never trade off) and **Strong Commensurability** (everything trades off on a single scale), you hold contradictory views about the structure of value.
  *   **The Deflationary + The Parity Advocate:** If you scored high on **Deflationary** (hardness is just uncertainty) and **Parity** (hardness is a sui generis value relation), you are conflicted. Deflationism denies the metaphysical reality that Parity theory asserts.

  **4. The Unexplored Zone: The "Rational Indifference" Cluster**
  A combination of **Q1-B** (Different kinds of goods), **Q2-A** (Small improvement tips the scale), and **Q3-A** (Flip a coin) suggests a view where values are plural but options can be exactly equal. This is a standard "Equality" view, but it is often unattractive to philosophers of hard choice because it fails to explain why the choice feels *hard* rather than *arbitrary*. If you land here, you may be underestimating the phenomenology of the dilemma.

  **5. The "Particularist/Existentialist" Overlap**
  **Particularism** (no general rules) and **Existentialism** (will creates reason) often yield similar answer patterns (rejecting universal scales, emphasizing context/will). The quiz separates them via Q8 (Source of Reasons), but in practice, these views are friendly neighbors. A user landing between them likely holds a hybrid view: context determines the *possibility* of reasons, but will actualizes them.
