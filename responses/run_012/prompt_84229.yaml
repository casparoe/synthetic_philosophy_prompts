answer: |-
  Good evening. If you look at the front row, you will see Ruth glaring at the councilors. She is not glaring because she dislikes you; she is glaring because she wanted to be home before dusk. There is a patch of ground behind her house where the soil is just right for hydrangeas, and she is worried that if she stays here too long, someone else will touch them. This matters. If she were a saint, she would not care about the hydrangeas. She would care only about the people. But Ruth cares about the flowers, and she cares about her quiet, and she cares about not being bothered by officials with clipboards. For eleven years, she cared about those things, and she opened her door anyway.

  We are here to give her a prize for doing more than she had to. That is a dangerous thing to say. If I stand here and tell you that Ruth did what any of us would have done, I am lying. We know we would not have done it. We know because we did not. If I tell you that Ruth did what all of us should have done, I turn this room into a courtroom. I turn her gift into a debt you now owe, and I turn her family into people who watched her carry a burden that belonged to the rest of us. And if I tell you that none of us could have done it, I make her a species apart, a creature of such different stuff that we can admire her without ever having to look at our own hands.

  So let us be precise about what happened in that house. It was not a haloed place. It smelled of wet wool and stale tea. It was crowded. People argued in the hallway. Ruth is impatient with fools, and there were fools in that hallway. There were nights when she stood in her kitchen, listening to the rain and the breathing of strangers, and wished she were alone. She did not open the door because it was her nature to be selfless. She opened it because she looked at the alternative—people sleeping in the bus shelter in January—and found that she could not live with herself if she kept the door locked. She paid for this. She paid in sleep. She paid in the wear on her floorboards. She paid in the constant, low-level annoyance of knowing she was doing something the rules said she should not.

  This prize is an attempt to name that cost. But I need to warn you about what prizes do. When we celebrate something as extraordinary, we risk making it ordinary. We risk saying, "This is what good people do," and then expecting the next person to do it without complaint. If we turn Ruth's eleven years into a baseline for the town, we destroy the very thing we are honoring. We turn a gift into a tax. So let me be clear: we are not setting a target. We are not saying that every house on every street must become a shelter. We are saying that what she did was not required, and that is why it matters. It was not required by the law, which tried to stop her. It was not required by her temperament, which wanted her to be left alone. It was not required by morality, strictly speaking, because morality usually asks us not to harm, not to save.

  There is a friend of mine in the front row who thinks this distinction is nonsense. He believes that if an action is the best thing to do, then it is the only thing you are allowed to do. If saving the stranger is better than protecting your hydrangeas, then you must save the stranger. To him, there is no such thing as "more than enough." There is only "right" and "wrong." If that were true, Ruth would not deserve a prize. She would deserve a receipt. She would have simply balanced the equation.

  But we know that is not how life works. We know that there are things we might hope for in our neighbors that we dare not demand. Ruth's act was not a calculation. It was a choice made repeatedly, often unwillingly, against the pull of her own comfort. She did not do it because it was easy. She did not do it because it was mandated. She did it because she decided, again and again, that the discomfort of her conscience was worse than the discomfort of her guests. That is not a rule we can enforce. You cannot legislate conscience. You cannot mandate willingness.

  So, Ruth, we are not giving you this award to tell you what you should have done. We know you should have done nothing, by the book. We are giving it to you to say thank you for doing what the book did not cover. We are acknowledging that you carried a weight we left on the ground. We promise not to pretend this was easy for you. We promise not to pretend we would have done the same. And we promise, when we leave this hall, to go home and look at our own gardens, and our own locked doors, and remember that keeping them safe is not the same thing as keeping them closed.

  Thank you.

  ***

  I committed to your reading that the act's value lies in its friction against her character, framing the "more than required" not as a moral surplus but as a costly choice against self-interest. I took liberties by sidestepping the maximizer's binary entirely, treating "required" as a social/legal category rather than a strict ethical imperative to avoid bogging down in logic. Tell your friend that ethics describes the floor of human behavior, not the ceiling, and that a community survives on gifts that cannot be demanded without destroying their nature as gifts.
