      *   **Key Distinction:** Memory owed to victims vs. memory conscripted for collective identity (the latter often masquerading as the former).
      *   **Task:** Draft 8-10 interview questions.
      *   **Constraint 1:** Questions must force specification, not restatement (avoid "Can you explain..." or "Tell us more about...").
      *   **Constraint 2:** Include three specific mandatory questions:
          1.  What is a duty to remember actually a duty to *do*? (Events, form, benefit, duration).
          2.  Can forgetting be *owed* to anyone?
          3.  How to answer the charge that forgetting wrongs the dead?
      *   **Constraint 3:** For those three mandatory questions, add a specific follow-up keyed to the likely answer.
      *   **Constraint 4:** Usable by an interviewer who knows the work but can't look things up mid-interview (needs to be self-contained, clear, and flow logically).

  2.  **Deconstruct the Core Thesis & Potential Weak Points:**
      *   *Ethical Forgetting:* Sounds counter-intuitive. Needs rigorous boundaries. When does it become erasure?
      *   *Victims vs. Identity:* How do we distinguish them in practice? Who decides?
      *   *Hardening Grievance:* Is this always bad? Sometimes grievance is justified and necessary for justice.
      *   *Foreclosing Repair:* What counts as repair? Reconciliation without justice?
      *   *Duty:* Duties imply claimants. Who claims the right to be forgotten?

  3.  **Drafting the Mandatory Questions (and Follow-ups):**

      *   *Mandatory 1: Duty to Remember (Action/Scope).*
          *   *Draft:* You talk about duties to remember. What does that actually mean?
          *   *Refinement (Force Specification):* You distinguish memory owed to victims from memory conscripted for identity. But unpack the "owed" part. If I have a duty to remember a historical injustice, what is the cash value of that duty? Is it a specific ritual, a policy stance, or an emotional posture? And crucially, when does the ledger close?
          *   *Likely Answer:* She will likely say it's about sustaining a commitment to justice or acknowledging harm, not just reciting dates. She might say it lasts until justice is achieved.
          *   *Follow-up:* If it lasts until justice is achieved, who defines when justice is achieved? If the victims' descendants say it isn't, does the duty persist even if it hardens grievance?

      *   *Mandatory 2: Owed to Anyone (Claimants of Forgetting).*
          *   *Draft:* Can you owe forgetting to someone?
          *   *Refinement:* We easily grasp owing memory to the dead. But you argue we sometimes owe forgetting. Who is the creditor in that transaction? Is it owed to the perpetrator, the community, or the victims themselves? And if it's owed to the victims, how do you reconcile that with their potential desire for remembrance?
          *   *Likely Answer:* She will likely say it's owed to the living community to allow a future, or perhaps to the victims to allow them to move on (if they choose).
          *   *Follow-up:* If it's owed to the living community for the sake of repair, does that instrumentalize the past? Are we sacrificing truth for social stability?

      *   *Mandatory 3: Wronging the Dead.*
          *   *Draft:* Doesn't forgetting hurt the dead?
          *   *Refinement:* The most visceral objection is that forgetting abandons the dead to a second death. How do you answer the charge that ethical forgetting is simply a dignified name for neglecting the dead? Does the dead have an interest in being remembered that survives their capacity to care?
          *   *Likely Answer:* She will likely argue the dead don't have interests in the same way, or that their interest is in the living flourishing, not in perpetual mourning.
          *   *Follow-up:* If the dead's interest is in the living flourishing, what if the living flourish *by* acknowledging the brutality of the past rather than softening it? Does your view risk sanitizing history to make the present comfortable?

  4.  **Drafting the Remaining Questions (5-7 more):**
      *   *Goal:* Probe the distinction between identity and victim memory, the mechanism of "hardening," and the political risks.
      *   *Q4 (The Distinction):* How do we tell the difference in real time? It's easy in theory, but in a political rally, how does one distinguish "memory for victims" from "memory for identity"?
      *   *Q5 (Hardening Grievance):* You say remembrance hardens grievance. But isn't hardened grievance sometimes the only barrier against recurrence? When does "hardening" become "vigilance"?
      *   *Q6 (Agency/Who Decides):* Who gets to declare a duty to forget? Is this a top-down state policy or a bottom-up social norm? If it's the state, isn't that dangerous?
      *   *Q7 (Truth vs. Ethics):* Does ethical forgetting require falsification, or just non-attention? Is there a difference between letting a memory fade and actively suppressing it?
      *   *Q8 (The Perpetrator):* Does your framework apply to perpetrators? Do they have a duty to forget their own crimes as part of repair, or is their duty strictly to remember?
      *   *Q9 (Scale):* Does this apply to interpersonal relationships or just national history? If my partner wrongs me, do I have a duty to forget to save the relationship?
      *   *Q10 (The Risk of Abuse):* History is full of tyrants demanding we "forget and move on." What safeguard in your theory prevents ethical forgetting from becoming a tool of impunity?

  5.  **Review and Refine:**
      *   *Check Constraints:* 8-10 questions total? Yes (I have 3 mandatory + 7 draft = 10).
      *   *Check Specificity:* Do they force specification? Yes, they ask for criteria, agents, and boundaries.
