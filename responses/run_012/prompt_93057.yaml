answer: |-
  1. **The Cash Value of Remembrance**
  You distinguish between memory owed to victims and memory conscripted for collective identity. But unpack the "owed" part. If a citizen has a duty to remember a historical injustice, what is the cash value of that duty in practice? Is it a specific ritual, a policy stance, or an emotional posture? And crucially, does this duty have an expiration date, or is it indefinite?

  > **Follow-up:** *If she answers that the duty lasts until "justice is achieved," ask:* Who defines when justice is achieved? If the victims' descendants say it isn't, does the duty persist even if continuing to remember hardens grievance and blocks the very repair you prioritize?

  2. **The Creditor of Forgetting**
  We easily grasp owing memory to the dead. But you argue we sometimes owe forgetting. Who is the creditor in that transaction? Is the duty to forget owed to the perpetrator, the community, or the victims themselves? And if it is owed to the victims, how do you reconcile that with their potential desire for remembrance?

  > **Follow-up:** *If she answers that it is owed to the living community for the sake of repair, ask:* Does that instrumentalize the past? Are we effectively sacrificing truth or acknowledgment for social stability, and if so, isn't that a form of political convenience rather than ethics?

  3. **The Second Death**
  The most visceral objection to your view is that forgetting abandons the dead to a second death. How do you answer the charge that ethical forgetting is simply a dignified name for neglecting the dead? Do the dead retain an interest in being remembered that survives their capacity to care?

  > **Follow-up:** *If she answers that the dead's interest lies in the flourishing of the living, ask:* What if the living flourish *by* acknowledging the brutality of the past rather than softening it? Does your view risk sanitizing history to make the present comfortable, rather than truly repairing the future?

  4. **The Diagnostic Problem**
  In the abstract, the distinction between memory for victims and memory for identity is clear. But in the heat of a political movement, how do we tell them apart in real time? When a group demands a monument or a holiday, what specific criteria do we use to determine if this is a genuine duty to victims or merely identity conscription?

  5. **Grievance vs. Vigilance**
  You argue that public remembrance often hardens grievance and forecloses repair. But isn't hardened grievance sometimes the only barrier against recurrence? When does "hardening" become necessary "vigilance," and who is in a position to judge the difference without minimizing the original harm?

  6. **The Agent of Forgetting**
  Who gets to declare a duty to forget? Is this a top-down state policy, a bottom-up social norm, or an individual ethical choice? If it is a state policy, how do you prevent it from becoming censorship? If it is individual, how does it solve the collective problem of public remembrance?

  7. **Attention vs. Erasure**
  Does ethical forgetting require falsification, or just non-attention? Is there a moral difference between letting a memory fade through neglect and actively suppressing it? If the former, isn't that just describing how memory naturally works, rather than prescribing a duty?

  8. **The Perpetrator's Burden**
  Does your framework apply to perpetrators? Do they have a duty to forget their own crimes as part of repair, or is their duty strictly to remember? If they are allowed to forget, does that grant them a moral exit ramp that victims are denied?

  9. **The Interpersonal Analogy**
  Does this ethics of forgetting scale down to interpersonal relationships? If my partner wrongs me, do I have a duty to forget the specifics of the wrong to save the relationship? If not, why does the logic apply to national history but not to the people closest to us?

  10. **Safeguards Against Impunity**
  History is full of tyrants demanding we "forget and move on." What safeguard in your theory prevents ethical forgetting from becoming a tool of impunity? Is there a threshold of severity—genocide, slavery—where forgetting is categorically forbidden, regardless of the social cost of remembering?
