answer: |-
  1. "The readings"
  1. **Arithmetic Non-Additivity:** The value of a property for the system is not the arithmetic sum of that property for the isolated constituents (e.g., mass adds, temperature does not).
  2. **Structural Configuration:** The properties of the system depend on the spatial arrangement and bonding of parts, not just the inventory of parts (e.g., diamond vs. graphite).
  3. **Dynamical Interaction:** Non-linear interactions between parts produce behaviors that are absent when the parts are isolated or weakly coupled.
  4. **Conceptual Novelty:** Describing the system efficiently requires a new vocabulary and concepts that do not apply to the individual parts (e.g., "pressure" or "entropy").
  5. **Epistemic Intractability:** Deriving the macro-behavior from micro-laws is possible in principle but computationally impossible for any finite agent to execute.
  6. **Universality (Renormalization):** Macro-behavior is determined by symmetry and dimension rather than specific micro-details, making the whole "independent" of the precise nature of the parts.
  7. **Ontological Emergence:** The system possesses properties or entities that are fundamentally distinct kinds of things, not just complex configurations of the base parts.
  8. **Causal Autonomy:** Macro-states exert causal powers ("downward causation") that are not exhaustively constituted by the causal interactions of the micro-constituents.
  9. **Metaphysical Underdetermination:** The micro-physical facts do not fix the macro-physical facts even for an ideal intellect; the macro is not supervenient on the micro.

  2. "Verdicts"
  1. Trivial / True by definition for most intensive variables; denies nothing about reductionism.
  2. Defensible / Standard solid-state physics; compatible with full reducibility.
  3. Defensible / Standard non-linear dynamics; compatible with full reducibility.
  4. Defensible / Widely accepted in philosophy of science; epistemic claim, not ontological.
  5. Defensible / Pragmatically true for many-body systems; denies nothing about in-principle determination.
  6. Defensible / The core insight of Renormalization Group theory; often overlooked as a form of "emergence."
  7. Contentious / Requires a robust account of how new "kinds" arise without magic.
  8. False / Violates the causal closure of physics unless carefully qualified as explanatory autonomy.
  9. False / Contradicts the standard physicalist assumption of supervenience; implies dualism or indeterminism.

  3. "Which reading does the work"
  For his **derivation complaint** (solid properties from atoms), only Readings 8 or 9 support the claim that you *cannot in principle* get the properties out. Readings 1–5 merely say it is difficult, requires new words, or depends on arrangement, all of which are compatible with the macro being fully fixed by the micro. If he means it is *impossible*, he is committing to a radical metaphysical underdetermination that most physicists reject.

  For his **coarse-graining complaint** (model behavior fixed by microphysics), Reading 6 (Universality) is the only defensible physics-based support. It argues the model is "more than" its parts because the specific parts *don't matter*, only their class does. However, if he uses this to say the model's behavior is *not fixed* by the microphysics (Reading 9), he is claiming the coarse-grained parameters float free of the underlying Hamiltonian, which is generally false in stat-mech.

  4. "What he probably means"
  He is likely conflating Reading 5 (Epistemic Intractability) with Reading 8 (Causal Autonomy). He feels the autonomy of condensed matter physics so strongly that he treats our inability to calculate everything as a proof that the macro-level operates independently. He wants to defend the dignity of his field against "nothing but" atomism without realizing he is smuggling in metaphysical claims he hasn't defended.

  5. "What I can say back"
  "Are you claiming that deriving the macro from the micro is computationally intractable, or that it is impossible in principle? If the former, that's just complexity; if the latter, you're denying supervenience. Which one are you defending?"
