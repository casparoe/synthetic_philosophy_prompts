prompt: |-
  I'm in a small cross-department reading group -- mostly condensed-matter and stat-mech people, plus two philosophers of science who sit there looking pained -- and one of the physicists keeps ending arguments with "the whole is more than the sum of its parts." Last week he used it to say you can't in principle get the properties of a solid out of the properties of its atoms; this week he used it to wave off my question about whether a coarse-grained model's behaviour is really fixed by the microphysics underneath, on the grounds that the model is "more than" its parts. Both times the room just nodded and moved on. I'm fairly sure it's doing at least three different jobs and that in some of them it's a flat platitude and in others it's a substantive and probably false thesis, but I can't get the pieces straight, and I don't want to be the guy who objects to a slogan without knowing which reading he meant.

  Give me the menu. Lay out the distinct precise claims that one sentence could be making, from the harmless to the radical, and for each one say whether it's trivial, defensible, contentious, or just false, and what it would actually commit you to (what has to be true of the parts, of the combination, of causation, of explanation). Then tell me which readings would actually support each of the two moves he made, and which reading he most likely has in mind. Include at least one reading people usually leave out.

  Format it like this:

  1. "The readings" -- a numbered list, 7-9 items, one to three sentences each, ordered from weakest to strongest claim.
  2. "Verdicts" -- for each numbered reading, one line: trivial / defensible / contentious / false, plus a phrase on why.
  3. "Which reading does the work" -- a short paragraph each for his derivation complaint and his coarse-graining complaint, saying which readings would and wouldn't get him there.
  4. "What he probably means" -- a few sentences.
  5. "What I can say back" -- three or four lines I could actually deploy in the room.
