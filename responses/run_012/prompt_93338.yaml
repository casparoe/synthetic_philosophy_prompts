prompt: |-
  I edit a small press that does religious-studies textbooks and study editions, and I have a problem I need help with. Every manuscript we take in is full of sentences like "Jesus said X", "Jesus did Y", "the historical Jesus was a Z" — and I have to decide, claim by claim, what our footnote says. Right now my two freelance copy-editors (neither has a PhD, both have a decent undergrad background) basically vibe it out: if it sounds like something they've heard a lot they write "widely regarded as authentic," and otherwise they write nothing. An academic reviewer tore us apart over this last month, fairly.

  So: take the role of a biblical scholar with one foot in the philosophy of history, think this through carefully, and build me a procedure — a checklist to be run in order — for deciding what to say about a single claim of the form "Jesus did/said/was ___". Start by brainstorming what such a procedure has to be able to handle, then write the procedure itself, then do the worked cases.

  The procedure should:

  - fix the target. I care about three different things and I suspect my copy-editors keep sliding between them: whether the claim reports something the man actually said or did (authenticity), whether it belongs in the best reconstruction of what he was up to (historicity), and what it tells us about the community that preserved it. Say how a verdict on one is supposed to constrain the others, and where it must not.

  - say which standard criteria to apply, in what order and with what weight — embarrassment, dissimilarity/discontinuity, multiple attestation, coherence, fit with the Jewish Palestinian setting, the fact of the execution — and for each: what counts as it firing, what doesn't (I've watched them count four documents as four witnesses when two of them are the same story retold), and the particular way it tends to go wrong or beg the question. I want a circularity check built in: for every criterion that fires, the practitioner has to write down whether it already assumed the conclusion it's supposed to support.

  - be honest about the thing I keep reading, that these criteria are widely thought to be broken in some deep way. Don't just wave at that — say which uses survive and which don't, and build the procedure so it can't fake precision it doesn't have.

  - output a verdict from a small fixed set of labels, a confidence marker, and a one-line rationale that can go into a footnote without embarrassing us.

  - run in twenty minutes, by someone with no Greek or Hebrew and no library.

  - say where the procedure stops with a no, and where it hands the decision back to a human — me, or the outside consultant we can afford maybe twice a year — and which of those handoffs are factual disputes versus just our own editorial/religious position.

  Then run it end to end on three claims: (1) Jesus was baptized by John; (2) Jesus taught something along the lines of loving your enemies; (3) the tomb was found empty. At least one verdict should be one I won't like — if the procedure says the ethical teachings come out weaker than something I'd rather not print, say so and show me the steps.

  Last thing, a calibration test: give my copy-editors a control case, a claim about a figure from a totally different tradition where we have independent reason to think the attribution is late, and tell them what the procedure should return on it, as a check that this isn't just a machine for saying yes.

  Dont give me citations or a reading list — describe positions in plain English, and if a criterion's name is contested just describe what it does. Be upfront at the end about what this procedure can't do.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Editor of a small press publishing religious-studies textbooks/study editions.
      *   **Problem:** Manuscripts make claims about Jesus ("Jesus said X," "Jesus did Y") without rigorous footnoting. Current freelance editors "vibe it out." An academic reviewer criticized this heavily.
      *   **Goal:** A procedure/checklist for deciding footnote verdicts on claims about Jesus.
      *   **Role:** Biblical scholar with one foot in the philosophy of history.
      *   **Constraints:**
          *   Fix the target (distinguish authenticity, historicity, community memory).
          *   Define criteria (embarrassment, dissimilarity, multiple attestation, coherence, context, execution) with order, weight, firing conditions, and circularity checks.
          *   Acknowledge the critique of these criteria (they are "broken" in some ways).
          *   Output: Fixed label set, confidence marker, one-line rationale.
          *   Time/Resources: 20 minutes, no Greek/Hebrew, no library access.
          *   Handoffs: When to stop/hand off to editor or consultant (factual vs. editorial/religious).
          *   Worked Cases: (1) Baptism by John, (2) Love enemies, (3) Empty tomb. One verdict must be uncomfortable (e.g., ethical teachings weaker than desired).
          *   Calibration Test: A control case from a different tradition (late attribution) to ensure the procedure says "no" sometimes.
          *   Tone: Plain English, no citations/reading lists, upfront about limitations.

  2.  **Deconstruct the Core Challenge:**
      *   The "Third Quest" for the Historical Jesus has largely abandoned the old "Criteria of Authenticity" (like Dissimilarity) as standalone proof mechanisms. They are now seen as indicators of probability, not binary switches.
      *   The editor needs a *pragmatic* tool, not a doctoral dissertation. It needs to prevent embarrassment without claiming false certainty.
      *   Distinction needed: *Authenticity* (did he say/do it?) vs. *Historicity* (does it fit the reconstruction of his life?) vs. *Reception* (what does the text say the community believed?).
      *   The "Vibe Check" needs to be replaced by a "Weighted Probability" model.

  3.  **Drafting the Procedure - Step-by-Step:**

      *   **Phase 1: Fixing the Target.** Need to clearly separate the three categories the user mentioned.
          *   *Authenticity:* Specific utterance/action.
          *   *Historicity:* General profile/mission.
          *   *Community Memory:* Theological claim of the text.
          *   *Constraint:* High authenticity implies high historicity. High community memory does *not* imply authenticity.

      *   **Phase 2: The Criteria (The Engine).**
          *   Need to select the standard ones but modify them based on modern scholarship (e.g., Le Donne, Meier, Allison).
          *   *Multiple Attestation:* Needs to be independent sources, not just verses.
          *   *Embarrassment:* Needs to be *early* embarrassment, not just awkward later.
          *   *Dissimilarity:* This is the most criticized. Needs to be reframed as "Distinctiveness" or used carefully. Let's call it "Distinctiveness from Early Church."
          *   *Context/Coherence:* Fit with 1st Century Judaism.
          *   *Crucifixion:* The "fact" that explains the movement.
          *   *Circularity Check:* Crucial addition requested by user.

      *   **Phase 3: The Verdict System.**
          *   Needs fixed labels.
          *   Needs confidence markers.
          *   Needs a one-liner.

      *   **Phase 4: Handoffs.**
          *   When does the editor step in? (Theological bias, high-stakes controversy).
          *   When does the consultant step in? (Technical Greek/History disputes).

      *   **Phase 5: Worked Cases.**
          *   *Baptism:* High consensus (Embarrassment + Multiple Attestation).
          *   *Love Enemies:* Tricky. Multiple attestation (Q, Paul?), but fits Jewish ethics too. Might be the "uncomfortable" one if we apply strict dissimilarity, but actually, it's usually rated high on coherence. Wait, the prompt asks for *one* verdict I won't like. Maybe the Empty Tomb is the weak one? Or maybe Love Enemies is weaker than pastors like? Actually, the Empty Tomb is historically much shakier than the Baptism. Let's make the Empty Tomb the "weak" one to challenge traditional apologetics, or the Love Enemies one to challenge the idea that *specific* sayings are verifiable. Let's go with Empty Tomb being "Community Memory" rather than "Historical Fact" to be rigorous.
          *   *Calibration:* Needs a clear control. Maybe a claim about Buddha or Muhammad where scholarship agrees on late attribution. Let's use a specific Hadith or a Buddhist sutra claim.

  4.  **Refining the Criteria (Philosophy of History Angle):**
      *   Must acknowledge that "History" here is inference to the best explanation, not video footage.
      *   The criteria don't prove truth; they assess *likelihood of origin*.
      *   Must warn against "Criterion of Coherence" becoming a black hole (everything fits if you squint).

  5.  **Developing the Worked Cases:**
      *   *Baptism:* Strong. Embarrassment (John > Jesus), Multiple (Mark, Q, John, Josephus?). Verdict: Historically Secure.
      *   *Love Enemies:* Moderate/Strong. Multiple (Q, Paul?), Coherence (fits prophetic ethic), Dissimilarity (Low - Jews taught this too). Verdict: Plausible Core.
      *   *Empty Tomb:* Weak/Mixed. Late attestation (Mark is first), Coherence (fits resurrection belief), Embarrassment (Women witnesses). But... no multiple independent attestation of the *empty* tomb specifically (Paul doesn't mention it). Verdict: Community Memory / Theological Claim. (This might be the uncomfortable one for a religious press).

  6.  **Developing the Calibration Test:**
      *   Need a claim that is *false* or *late* according to scholars.
      *   Example: "The Buddha wrote down his own sermons." (Scholars agree oral tradition first).
      *   Example: "George Washington chopped down the cherry tree." (Parson Weems, late).
      *   Let's use the Cherry Tree. It's secular, clear, and tests the "Embarrassment" and "Multiple Attestation" criteria properly (it fails them).

  7.  **Review against Constraints:**
      *   20 mins? Yes, checklist format.
      *   No Greek? Yes, rely on English translations/source labels.
      *   No Library? Yes, rely on general scholarly consensus knowledge embedded in the checklist.
      *   Plain English? Avoid jargon like "eschatological prophet" without explanation.
      *   Upfront limitations? Yes, conclude with "What this can't do."

  8.  **Self-Correction/Polishing during drafting:**
      *   *Critique of Criteria:* I need to make sure I don't present the Criteria of Authenticity as if they are still the gold standard in academia. They are tools of probability, not proof. I need to emphasize the "Inference to Best Explanation" model.
      *   *The "Uncomfortable" Verdict:* The prompt asks for *one* verdict the editor won't like. If this is a religious press, they probably want "Jesus said Love Enemies" to be solid. If I mark it as "Plausible but not verifiable specific wording," that might be the friction point. Or, if I mark the Empty Tomb as "Theological Narrative" rather than "Historical Event," that's also friction. The Empty Tomb is the safer bet for a *scholarly* uncomfortable truth, while Love Enemies is safer for a *religious* uncomfortable truth. Given the press does "religious-studies textbooks," they likely need academic credibility. I will make the Empty Tomb the "weak" one, as that is the consensus among critical historians (Bart Ehrman, E.P. Sanders, etc. distinguish between resurrection *belief* and empty *tomb* evidence). Actually, let's make the "Love Enemies" specific wording the weaker one, because specific sayings are harder to verify than broad themes. No, the prompt says "if the procedure says the ethical teachings come out weaker... say so." Okay, I will make the specific *formulation* of "Love Enemies" less certain than the *theme*.
      *   *Wait, re-reading:* "At least one verdict should be one I won't like — if the procedure says the ethical teachings come out weaker than something I'd rather not print, say so." Okay, I will aim for the Ethical Teaching verdict to be nuanced/weak on *specific wording*.
      *   *Actually, the Empty Tomb is the stronger candidate for "Historical Doubt."* Most historians agree Jesus was baptized. Most agree he taught love. Many doubt the empty tomb narrative is historical reportage vs theological symbol. I'll stick with Empty Tomb as the "No" on historicity, as that's more philosophically robust. But to satisfy the specific instruction about ethical teachings, I'll note that the *exact wording* is unrecoverable.
      *   *Decision:* I will make the Empty Tomb verdict "Community Memory" (not historical fact) and the Love Enemies verdict "Core Theme" (not exact quote). This covers both bases.

  9.  **Final Polish:** Check the tone. Needs to be authoritative but humble. "One foot in philosophy of history." Ensure the circularity check is explicit.

  **(Self-Correction on Calibration):** The prompt asks for a claim about a figure from a *totally different tradition*. Let's use a specific claim about the Buddha or Muhammad. Let's go with "The Buddha wrote his own scriptures." Scholars agree this is false (oral tradition for centuries). This tests if the procedure correctly identifies "Late/Single Source" as weak.

