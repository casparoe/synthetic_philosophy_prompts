answer: |-
  Here is a procedure designed for your press. It treats the "Criteria of Authenticity" not as magic wands that prove truth, but as filters for probability. It is built on the consensus of critical historical scholarship (the "Third Quest" and post-Third Quest) while acknowledging the philosophical limits of reconstructing ancient speech.

  ### Part 1: Fixing the Target
  Your editors are sliding between three distinct claims. The procedure forces them to pick one. A verdict on one *constrains* the others but does not *determine* them.

  1.  **Authenticity (The Tape Recording):** Did this specific man, in this specific way, say or do this specific thing?
      *   *Constraint:* If this is **False**, Historicity is usually still possible (he might have done something similar).
      *   *Constraint:* If this is **True**, it strongly supports Historicity.
  2.  **Historicity (The Biography):** Does this fit the best reconstruction of his life and mission, even if the specific story is shaped?
      *   *Constraint:* If this is **False**, Authenticity is impossible.
      *   *Constraint:* If this is **True**, Authenticity is possible but not guaranteed (it could be a true story told about the wrong person, or a theological truth dressed as history).
  3.  **Community Memory (The Text's Claim):** What does this text tell us about the people who wrote it, regardless of whether it happened?
      *   *Constraint:* This is **always True** for the text itself. It does not require the event to have happened.
      *   *Constraint:* A strong verdict here does *not* support Authenticity or Historicity.

  **Rule:** If the manuscript says "Jesus said," you are testing **Authenticity**. If it says "Jesus taught," you are testing **Historicity**. If it says "The Gospel reports," you are testing **Community Memory**.

  ---

  ### Part 2: The Procedure (The Checklist)
  **Time limit:** 20 minutes. **Resources:** English Bible, one standard study Bible intro (for source dates), this checklist.

  **Step 0: The Circularity Check (Do this first)**
  Before looking at evidence, write down: *Does this claim sound true because I already believe the conclusion?*
  *   If yes, you must apply the criteria below with double strictness.
  *   If the claim is "Jesus claimed to be God," and you assume he is God, you have already failed the history test. Mark this claim for **Handoff**.

  **Step 1: Source Counting (Multiple Attestation)**
  *   **Question:** How many *independent* written sources contain this?
  *   **Counting Rule:** Mark and Q are independent. Matthew and Luke are *not* independent if they are copying Mark. John is usually independent of the Synoptics. Paul is independent of the Gospels.
  *   **Firing:** 2+ independent sources (e.g., Mark AND Paul).
  *   **Not Firing:** 1 source, or 3 gospels that are all copying the same original story.
  *   **Weight:** High. This is the strongest historical indicator we have.
  *   **Trap:** Do not count "Matthew, Mark, Luke, and John" as four. Count "Mark, Q, Paul, John."

  **Step 2: The Awkwardness Test (Embarrassment)**
  *   **Question:** Is this claim awkward or difficult for the early church to explain?
  *   **Firing:** The story makes Jesus look weak, subordinate, or confused, or it creates a theological problem the authors have to apologize for (e.g., Jesus being baptized by John implies John is greater).
  *   **Not Firing:** The story makes Jesus look holy, powerful, or fulfills a prophecy perfectly without friction.
  *   **Weight:** Medium-High. People don't invent stories that make their hero look bad unless they have to.
  *   **Trap:** "Later embarrassment" doesn't count. It must be awkward for the *author writing the text*, not for us today.

  **Step 3: The Context Fit (Jewish Palestinian Setting)**
  *   **Question:** Does this make sense in 1st-century Galilee/Judea?
  *   **Firing:** The imagery, language, or concern fits Jewish scripture, law, or apocalyptic expectation of that specific time.
  *   **Not Firing:** The concern is clearly about later church problems (e.g., Gentile inclusion, bishop structures, Roman persecution post-70 CE).
  *   **Weight:** Medium. A forgery can mimic a setting, but a bad fit proves it's later.
  *   **Trap:** Don't assume "Religious sounding" = "Jewish." Check if it addresses issues that arose *after* Jesus died.

  **Step 4: The Distinctiveness Test (Dissimilarity)**
  *   **Question:** Is this distinct from what the early church wanted to say?
  *   **Firing:** The teaching is *not* something the early church would likely invent (e.g., Jesus not fasting, or criticizing temple sacrifice).
  *   **Not Firing:** The teaching matches later Christian doctrine perfectly (e.g., "Establish the Eucharist").
  *   **Weight:** Low/Contested. *Warning:* This criterion is broken if used alone. Just because the church taught it doesn't mean Jesus didn't. Use this only to *boost* confidence, never to *reject* a claim.
  *   **Trap:** Do not use this to say "Jesus couldn't have said X because it sounds too Christian." That is circular.

  **Step 5: The Explanation Test (Coherence & Execution)**
  *   **Question:** Does this help explain why he was executed and why the movement survived?
  *   **Firing:** The claim provides a motive for authorities to kill him, or explains why followers stayed loyal after a shameful death.
  *   **Weight:** Medium. History is "Inference to the Best Explanation."
  *   **Trap:** Don't force fit. If the claim is "Jesus was nice," that doesn't explain an execution.

  ---

  ### Part 3: The Verdict System
  Based on the checklist, select **one** label and **one** confidence marker.

  **Labels:**
  1.  **Historically Secure:** (Multiple sources + Embarrassment or Context Fit). Safe to state as fact.
  2.  **Plausible Core:** (Good Context Fit + Coherence, but weak attestation). Safe to say "Jesus likely taught/acted..."
  3.  **Community Memory:** (Fits later theology, single source, no embarrassment). Safe to say "The tradition reports..." or "According to the Gospel..."
  4.  **Historically Uncertain:** (Contradictory sources, anachronistic elements). Do not state as fact.

  **Confidence Markers:**
  *   (High Confidence)
  *   (Moderate Confidence)
  *   (Low Confidence)

  **Footnote Rationale:**
  Must follow this template: *"Verdict based on [Primary Criterion] and [Secondary Criterion]."*

  ---

  ### Part 4: Handoffs
  **Stop and send to the Editor (You) if:**
  *   The verdict is **Community Memory** but the manuscript treats it as **Historically Secure**. (This is a theological/editorial risk).
  *   The claim involves a miracle that is central to the denomination's doctrine. (This is a religious position, not a factual one).

  **Stop and send to the Consultant if:**
  *   The checklist results are mixed (e.g., Strong Embarrassment but Single Source).
  *   The claim relies on a specific Greek/Hebrew word meaning.
  *   The Circularly Check in Step 0 failed.

  ---

  ### Part 5: Worked Cases

  #### Case 1: "Jesus was baptized by John."
  *   **Step 0 (Circularity):** Pass. No obvious theological bias forcing the outcome.
  *   **Step 1 (Sources):** Mark, Q (Matthew/Luke), John, Josephus (external). **Fires.**
  *   **Step 2 (Embarrassment):** **Fires.** Early church struggled to explain why the Sinless One submitted to a repentance baptism. They added apologetics (John tried to stop him).
  *   **Step 3 (Context):** **Fires.** Fits the John the Baptist movement perfectly.
  *   **Step 4 (Distinctiveness):** **Fires.** The church later downplayed this; they wouldn't invent it.
  *   **Verdict:** **Historically Secure (High Confidence)**
  *   **Footnote:** *Verdict based on Multiple Attestation and Criterion of Embarrassment.*
  *   **Editor Note:** This is the gold standard. Print it.

  #### Case 2: "Jesus taught something along the lines of loving your enemies."
  *   **Step 0 (Circularity):** Pass.
  *   **Step 1 (Sources):** Q (Matthew/Luke), Paul (Romans 12). **Fires.**
  *   **Step 2 (Embarrassment):** **Does Not Fire.** This is a noble teaching; not awkward for the church.
  *   **Step 3 (Context):** **Fires.** Fits prophetic ethics, though pushes the boundary.
  *   **Step 4 (Distinctiveness):** **Mixed.** Early church taught this too, so Dissimilarity fails, but Coherence is high.
  *   **Step 5 (Explanation):** **Fires.** A movement based on non-retaliation explains survival without military revolt.
  *   **Verdict:** **Plausible Core (Moderate Confidence)**
  *   **Footnote:** *Verdict based on Multiple Attestation and Coherence with mission; exact wording uncertain.*
  *   **Editor Note:** This is the "uncomfortable" one. You want to print "Jesus Commanded Love of Enemies." The procedure says we can verify the *theme* historically, but not the specific sermon (Sermon on the Mount) as a transcript. You must ensure the manuscript says "taught the principle of" rather than "said the exact words in Matthew 5."

  #### Case 3: "The tomb was found empty."
  *   **Step 0 (Circularity):** **Warning.** High theological stakes.
  *   **Step 1 (Sources):** Mark (earliest). Matthew/Luke/John copy or depend on Mark. Paul (earliest writer) mentions resurrection appearances but *never* mentions the empty tomb. **Does Not Fire.** (Single independent narrative stream).
  *   **Step 2 (Embarrassment):** **Fires.** Women were the first witnesses (low credibility in 1st C. law). Church wouldn't invent female witnesses unless it was a stubborn memory.
  *   **Step 3 (Context):** **Mixed.** Burial customs fit, but the "rolling stone" narrative has folkloric elements.
  *   **Step 4 (Distinctiveness):** **Does Not Fire.** Empty tomb serves later apologetics (against "disciples stole body" claims).
  *   **Step 5 (Explanation):** **Mixed.** Explains the location of worship, but resurrection belief could exist on visions alone (as Paul suggests).
  *   **Verdict:** **Community Memory (Moderate Confidence)**
  *   **Footnote:** *Verdict based on Single Narrative Stream and later apologetic utility; historically uncertain.*
  *   **Editor Note:** This will hurt. Critical historians often separate "Resurrection Belief" (Secure) from "Empty Tomb" (Uncertain). The procedure forces you to acknowledge the lack of multiple independent attestation for the *tomb* specifically. Handoff to Editor: Decide if your press can publish "The tradition reports an empty tomb" instead of "The tomb was empty."

  ---

  ### Part 6: Calibration Test
  Give this to your copy-editors to ensure the machine isn't just a "Yes" generator.

  **Claim:** "The Buddha wrote down his own sermons."
  *   **Step 1 (Sources):** **Does Not Fire.** Earliest texts are oral traditions written down centuries later (1st Century BCE). No contemporary writings.
  *   **Step 2 (Embarrassment):** **Does Not Fire.** Makes the figure look authoritative.
  *   **Step 3 (Context):** **Does Not Fire.** Literacy and textual preservation in 5th Century BCE India do not support self-authorship of canonical texts.
  *   **Step 4 (Distinctiveness):** **Does Not Fire.** Serves later authority claims of the Sangha.
  *   **Verdict:** **Historically Uncertain (High Confidence)**
  *   **Footnote:** *Verdict based on Late Attestation and Anachronism.*
  *   **Instruction:** If your editors return anything other than "Historically Uncertain," they are not using the procedure; they are vibing.

  ---

  ### Part 7: What This Procedure Can't Do
  Be upfront with your authors and reviewers. This tool has hard limits:

  1.  **It cannot prove miracles.** It can only assess whether a story about a miracle is early or late. It treats miracles as "claims," not "events."
  2.  **It cannot access intention.** It can tell you if a saying fits the context, not if Jesus *meant* it ironically, literally, or metaphorically.
  3.  **It is not neutral.** It privileges "awkwardness" and "multiple sources." If the truth is a single, beautiful, non-awkward event, this procedure will mark it as "Uncertain." That is the cost of doing history.
  4.  **It creates a 'Gray Zone'.** Most claims will land in "Plausible Core." Authors who want black-and-white certainty will hate this. Tell them certainty is not a product history sells.

  **Final Instruction to Editors:**
  If the manuscript claims **Historically Secure** but the procedure yields **Community Memory**, you must change the text or add a qualifying footnote. Do not let the "vibe" override the checklist. If the checklist triggers a **Handoff**, do not guess. Wait for the consultant. It is better to be late and right than fast and embarrassed.
