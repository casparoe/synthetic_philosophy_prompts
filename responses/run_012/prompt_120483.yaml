prompt: |-
  I retired from a biology department a few years back — evolutionary side of things, so phylogentics and systematics are my native language — and since then I've been reading history and social theory, badly. Here's what I'd like. Take the argument that nations are modern inventions and that the traditions they dress themselves in are largely manufactured (Hobsbawm, Anderson and that crowd) and restate it for me in the vocabulary I actually think in: clades and how you define them, crown versus stem groups, homology versus homoplasy, convergent evolution, monophyly versus paraphyly, species as individuals rather than classes, gradualism versus punctuated change. Do the translation honestly — don't smuggle my framework's assumptions in and call it a translation. Then the residue report: what carries over cleanly, what gets distorted on the way in, and what has no counterpart in my vocabulary at all. And finish with your view on the residue — is it my toolkit that's missing something (does it have anywhere to put people imagining themselves into a community?), or is the original thesis vaguer than it sounded? I've always suspected that asking how old a nation is is a bit like asking how old a clade is, where the answer just falls out of which definition you picked.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Background:** Retired evolutionary biologist (phylogenetics/systematics). Native language: clades, crown/stem groups, homology/homoplasy, etc.
      *   **Current Interest:** Reading history and social theory (specifically nationalism studies: Hobsbawm, Anderson).
      *   **Task:** Translate the "modernist" argument of nationalism (nations are modern inventions, traditions are manufactured) into evolutionary biology vocabulary.
      *   **Constraints:** Be honest. Don't smuggle social theory assumptions into the biology terms (i.e., don't force a fit).
      *   **Deliverables:**
          1.  The Translation (using the specific biological concepts listed).
          2.  The Residue Report (what fits, what distorts, what's missing).
          3.  The Verdict (is the toolkit lacking, or is the thesis vague?).
      *   **User's Insight:** They already suspect the "age of a nation" problem is like the "age of a clade" problem (definition-dependent).

  2.  **Deconstruct the "Modernist" Argument (Hobsbawm/Anderson):**
      *   *Core Claim:* Nations are not ancient, organic growths. They are products of specific modern conditions (print capitalism, industrialization, state bureaucracy).
      *   *Traditions:* Many "ancient" traditions are recent inventions designed to create continuity where none exists.
      *   *Identity:* "Imagined communities" – people feel a bond with strangers based on abstract categories.
      *   *Continuity:* There is a perceived deep history, but the actual structural reality is recent.

  3.  **Map Biological Concepts to Social Concepts:**

      *   *Clades/Monophyly:* A nation claims to be a monophyletic group (all descendants of a common ancestor/origin).
      *   *Paraphyly:* The reality might be paraphyletic (excluding some descendants or including unrelated lineages based on superficial traits).
      *   *Crown vs. Stem:* The "Nation" as a political entity is the *Crown Group* (modern, living members + last common ancestor). The "Stem Group" represents the pre-national ethnic/cultural antecedents that look like the nation but lack the defining synapomorphies (citizenship, constitution, mass literacy).
      *   *Homology vs. Homoplasy:*
          *   *Homology:* True shared heritage (language, genetics, deep culture).
          *   *Homoplasy (Convergence):* "Manufactured traditions." Similar rituals/symbols evolved independently or were invented to *look* like deep heritage (synapomorphies) but are actually convergent traits driven by similar selective pressures (state-building).
      *   *Species as Individuals:* A nation isn't a natural kind (class); it's a historical particular (individual) with a birth, life, and potential death.
      *   *Gradualism vs. Punctuated Equilibrium:*
          *   *Gradualism:* The nationalist myth (we evolved slowly over millennia).
          *   *Punctuated:* The historical reality (rapid speciation event due to industrialization/print capitalism).
      *   *Phylogenetic Signal:* The feeling of kinship.

  4.  **Drafting the Translation (Iterative Process):**
      *   *Attempt 1 (Mental):* Nations are like clades. But Hobsbawm says they are fake. So they are like polyphyletic groups dressed up as monophyletic ones. The traditions are homoplasies.
      *   *Critique 1:* Too simple. Needs to use the specific terms requested (Crown/Stem, Species as Individuals).
      *   *Refinement:* Focus on the *diagnosis*. The Modernist thesis is essentially a phylogenetic critique. It says nationalists are misidentifying the synapomorphies. They think Trait X (folklore) is a homology linking them to the Middle Ages. Modernists say Trait X is a homoplasy generated by 19th-century pressures.
      *   *Crown/Stem:* This is crucial. The "French Nation" crown group starts with the Revolution. The stem group includes the Franks, Gauls, etc. They are on the lineage, but they aren't *in* the clade defined by the modern synapomorphies.
      *   *Species as Individuals:* This aligns well with the idea that a nation is a specific historical entity, not a universal category.

  5.  **Drafting the Residue Report:**
      *   *Clean Carry-over:* The definition problem (age of clade/nation). The distinction between lineage (stem) and diagnostic traits (crown). The idea of convergent traits (homoplasy) explaining similar national structures.
      *   *Distortion:* Biology deals with reproduction and inheritance mechanisms that are usually clearer than cultural transmission. "Invention" in culture is intentional; mutation is not.
      *   *Missing:* Agency/Intent. Evolution is blind; nationalism is designed. The "Imagined" part. Biology doesn't have a good equivalent for "believing you are related when you aren't."

  6.  **Drafting the Verdict:**
      *   Is the toolkit missing something? Yes, the *mechanism of belief*.
      *   Is the thesis vague? No, it's actually quite sharp, which is why the biological analogy works so well for the *structural* critique.
      *   Address the user's suspicion: Yes, "How old is a nation?" is exactly "How old is a clade?" It depends on whether you define by total lineage (stem) or diagnostic apomorphies (crown).

  7.  **Refining the Tone:**
