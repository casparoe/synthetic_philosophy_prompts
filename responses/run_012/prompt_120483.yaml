answer: |-
  Here is the translation of the Modernist thesis (Hobsbawm, Anderson, Gellner) into phylogenetic systematics, followed by the residue report and verdict.

  ### The Translation

  **The Thesis:** The "Nation" is not an ancient lineage gradually accumulating differences (phyletic gradualism), but a recent cladogenetic event characterized by specific derived traits (synapomorphies) that arose rapidly (punctuated equilibrium). Claims of ancient ancestry rely on misidentified characters.

  **1. Crown Group vs. Stem Group**
  The Modernist argument posits that what we call a "Nation" is a **Crown Group**. It is defined by the last common ancestor of all living members (citizens) possessing a specific set of synapomorphies: mass literacy, bureaucratic administration, secular sovereignty, and "imagined" horizontal comradeship.
  *   **The Stem:** The ethnic groups, kingdoms, and tribes preceding the 18th/19th century (Franks, Gauls, Feudal subjects) constitute the **Stem Group**. They are on the same lineage, yes, but they lack the diagnostic apomorphies of the Crown. Calling a 14th-century peasant "French" in the modern sense is a phylogenetic error; they are stem-french, not crown-French.
  *   **The Implication:** You cannot date the origin of the clade by the age of the stem lineage. The clade "France" originates at the node where the synapomorphies arise (Revolution/Industrialization), not at the root of the stem lineage.

  **2. Homology vs. Homoplasy (Convergence)**
  Nationalists argue that current rituals, symbols, and borders are **Homologous** to past traits (i.e., inherited continuously from deep time).
  *   **The Modernist Counter:** These traits are largely **Homoplasies**. They are convergent adaptations driven by similar selective pressures (industrialization, print capitalism, war). A Scottish kilt or a Welsh Eisteddfod often looks like an ancient homolog, but phylogenetic analysis reveals it as a recent convergence—invented or standardized in the 19th century to fill a functional niche.
  *   **Synapomorphy Screening:** The Modernist project is essentially a character analysis. It tests traits claimed to be synapomorphies of the ancient nation and reclassifies them as autapomorphies of the modern state or homoplasies of recent invention.

  **3. Monophyly vs. Paraphyly**
  Nationalist ideology asserts **Monophyly**: "We are all descendants of X, and only descendants of X."
  *   **The Reality:** The Modernist argues the nation is often **Paraphyletic** or even **Polyphyletic** regarding its actual genetic/cultural ancestry, but is *maintained* as monophyletic through cultural selection. Borders are drawn politically, not phylogenetically. The "unity" is not a result of shared exclusive ancestry (biological monophyly) but of a shared selective environment (state education, conscription) that masks the paraphyly.

  **4. Species as Individuals (Ghiselin/Hull)**
  A nation is not a **Natural Kind** (a class defined by necessary and sufficient properties, like "mammal"). It is a **Historical Individual** (a particular spatiotemporally localized entity, like *Homo sapiens* the lineage).
  *   **Implication:** You cannot define a nation by a checklist of traits that must always be true. You define it by its causal continuity. However, if that causal continuity is broken or fabricated (the "invented tradition"), the integrity of the individual is compromised. The Modernist argues the "individual" (the Nation) claims a continuous life history that does not exist.

  **5. Gradualism vs. Punctuated Change**
  *   **Nationalist View:** **Phyletic Gradualism.** The nation evolved slowly, organically, from the mists of time. Change is anagenetic.
  *   **Modernist View:** **Punctuated Equilibrium.** Long periods of stasis (feudal particularism) interrupted by rapid speciation events (French Revolution, unification of Germany/Italy). The "Nation" appears suddenly in the fossil record (archives) fully formed. The appearance of gradualism is an artifact of incomplete sampling (ignoring the gap between stem and crown).

  ***

  ### The Residue Report

  **1. What Carries Over Cleanly**
  *   **The Definition Problem:** Your suspicion is correct. "How old is the nation?" is structurally identical to "How old is the clade?" If you define by total lineage (stem), it's ancient. If you define by diagnostic traits (crown), it's modern. The Modernist argument is simply an insistence on Crown Group definition.
  *   **Character Conflict:** The friction between "ancient origins" and "modern invention" maps perfectly onto Homology vs. Homoplasy. Systematists are trained to be skeptical of superficial resemblance; Modernists are trained to be skeptical of superficial historical continuity.
  *   **Individuality:** Treating nations as individuals rather than classes avoids essentialism. It allows for the fact that a nation can go extinct or speciate without violating a "definition."

  **2. What Gets Distorted**
  *   **Mechanism of Inheritance:** In biology, inheritance is vertical (mostly) and mechanistic (DNA). In nationalism, inheritance is horizontal, oblique, and often *intentional*. "Invented tradition" implies a designer. In phylogenetics, traits don't invent themselves to fill a niche; they are selected. The Modernist argument smuggles in *agency*. A homoplasy in biology is blind convergence; a "manufactured tradition" is conscious engineering. This distorts the "evolutionary" metaphor because the selection pressure is often internal to the organism (the state designing the curriculum), not external.
  *   **Reproductive Isolation:** Species concepts often rely on reproductive isolation. Nations rely on *communicative* isolation (language) but actively encourage genetic mixing (assimilation) or enforce genetic separation (ethnic nationalism) inconsistently. The "barrier to gene flow" is porous and socially regulated, not mechanistic.

  **3. What Has No Counterpart (The Null Set)**
  *   **The "Imagined" Component:** This is the biggest residue. Anderson's core insight is that the bond exists *because* people believe it exists, despite never meeting most members. There is no biological equivalent to "believing you are in a clade when the phylogeny says otherwise." A wolf does not need to imagine itself part of *Canis lupus* to be subject to its species constraints. The *ontology* of the nation is mental; the ontology of the clade is material (regardless of our definitions).
  *   **Normativity:** Phylogenetics is descriptive. Nationalism is prescriptive. The "manufactured tradition" isn't just a trait; it's a command ("Thou shalt honor this flag"). Biology has no "ought."

  ***

  ### The Verdict

  You asked if the residue means your toolkit is missing something, or if the original thesis is vaguer than it sounded.

  **The thesis is not vague; your toolkit is missing the mechanism of *belief*.**

  The Modernist argument holds up remarkably well under phylogenetic translation. In fact, translating Hobsbawm into systematics clarifies his argument. He is essentially accusing nationalists of **bad cladistics**. They are grouping by symplesiomorphies (ancestral traits shared by many, e.g., "Christianity" or "European-ness") and calling them synapomorphies (unique derived traits defining the nation). They are mistaking the Stem for the Crown.

  However, the residue reveals the limit of the biological analogy.
  1.  **Agency:** Evolution has no foresight. Nationalism is teleological. The "convergent evolution" of national rituals wasn't accidental convergence; it was often coordinated diffusion or deliberate copying. This makes the "homoplasy" label slightly inaccurate. It's more like *horizontal gene transfer* driven by intent.
  2.  **The Imagined:** Your toolkit handles material lineages. It cannot handle *intersubjective* lineages. A clade exists whether we name it or not. A nation arguably does not (or exists differently) if the members stop imagining it.

  **Conclusion:**
  Your suspicion is the strongest part of this analysis. Asking "How old is a nation?" is indeed a question of node definition.
  *   If you define the nation by the **Stem** (continuous habitation, language roots), it is old (Gradualism).
  *   If you define the nation by the **Crown** (political self-consciousness, mass mobilization), it is young (Punctuated).

  The Modernists win the argument only if you insist that *political function* defines the clade. The Nationalists win if you insist *cultural lineage* defines the clade.

  The residue isn't a failure of the social theory; it's a reminder that human lineages are tracked in two media simultaneously: the biological (genes/demes) and the semiotic (memes/narratives). Your toolkit is perfect for analyzing the structure of the claim, but it cannot analyze the *binding agent* (imagination) that holds the clade together against the phylogenetic evidence. You can map the phylogeny of the state, but you cannot sequence the imagination.
