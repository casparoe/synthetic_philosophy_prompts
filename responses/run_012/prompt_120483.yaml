      *   Precise with social theory (don't caricature Hobsbawm).
      *   Honest about the limits of the analogy (the "Residue").

  8.  **Self-Correction during drafting:**
      *   *Check:* Did I use "Species as Individuals"? *Correction:* Make sure to emphasize Ghiselin/Hull's concept. A nation is a particular, not a class.
      *   *Check:* Did I address "Homology vs. Homoplasy"? *Correction:* Ensure the distinction between deep cultural continuity (homology) and invented tradition (homoplasy) is clear.
