prompt: |-
  Next month I give the commencement address at the small school I have led for eleven years, and I have to do it without pretending that this year's faculty vote did not happen. After half a century of trusting students entirely -- no proctored examinations, an honor code, open dormitories -- the faculty voted to proctor the final examinations while leaving everything else on the honor system. I want to build the address around the old quarrel between Mencius and Xunzi over human nature: whether we are seedlings that grow straight once the soil is right, or boards that stay warped until someone steams and presses them. I keep reaching for the easy line that the vote proves Xunzi was right, and it is both too simple and an insult to the students sitting in front of me. Write the address, six to eight minutes. Make the distinction earn its place: say what the vote actually commits us to, make sense of the asymmetry between the examinations we now supervise and everything else we still leave to trust, and be honest about which of the two thinkers the school is now following. The audience is a third faculty who teach these texts, a third parents who have never heard of either philosopher, and a third eighteen-year-olds who will remember one sentence. End on something true rather than something rousing.
reasoning: |-
  Here's a thinking process that leads to the commencement address:

  1.  **Analyze the Request:**
      *   **Speaker:** Head of School (11 years tenure).
      *   **Occasion:** Commencement Address.
      *   **Context:** A small school with a 50-year history of total trust (Honor Code, no proctors, open dorms). This year, the faculty voted to proctor final exams, keeping the rest on the honor system.
      *   **Theme:** The debate between Mencius (human nature is inherently good/seedlings) and Xunzi (human nature is inherently bad/warped boards needing correction).
      *   **Constraint 1 (Tone):** Avoid the "easy line" (that the vote proves Xunzi right). It's too simple and insulting to students.
      *   **Constraint 2 (Content):** Explain what the vote actually commits the school to. Explain the asymmetry (proctored exams vs. trusted life). Be honest about which philosopher the school follows now.
      *   **Constraint 3 (Audience):** 1/3 Faculty (know the texts), 1/3 Parents (don't know the texts), 1/3 Students (18-year-olds, will remember one sentence).
      *   **Constraint 4 (Length):** 6-8 minutes (approx. 900-1200 words spoken at a moderate pace).
      *   **Constraint 5 (Ending):** End on something *true*, not something *rousing*.

  2.  **Deconstruct the Philosophical Conflict:**
      *   *Mencius:* Human nature is good. We have sprouts of virtue. Environment matters (soil). If you treat people well, they become well. (Aligns with the old Honor Code).
      *   *Xunzi:* Human nature is bad/selfish. We need ritual, teachers, and structure to straighten us out (steaming/warping). (Aligns with Proctoring).
      *   *The Twist:* The school isn't fully Xunzi. It's a hybrid. Why proctor exams but trust dorms?
      *   *Interpretation:* Exams are artificial constructs. Life is real. Maybe the vote isn't about *trust* but about *fairness* or *burden*. Or maybe it acknowledges that even good people (Mencius) struggle under specific pressures.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the elephant in the room. The vote. Establish the history (50 years). Introduce the philosophers simply (for the parents) but accurately (for the faculty).
      *   **The Philosophical Framework:** Explain Mencius (seedlings) and Xunzi (warped wood). Make it relatable.
      *   **The Temptation:** Admit the urge to say "Xunzi won." Reject it. Why? Because it cynically reduces the students.
      *   **The Asymmetry (The Core Argument):** Why exams and not dorms?
          *   Exams are external validations. They create artificial scarcity.
          *   Dorm life is community.
          *   Maybe the vote admits that *systems* can corrupt even good nature. It's not that students are bad, but that high-stakes testing is a corrupting environment.
          *   Alternatively, it's about removing the *temptation* so the virtue can shine elsewhere.
          *   *Decision:* Let's argue that the vote acknowledges human fragility, not human depravity. It protects the "seedlings" from a storm, rather than assuming the seedlings are weeds.
      *   **What the Vote Commits Us To:** It commits the faculty to responsibility. It's not just watching students; it's owning the evaluation. It admits that the *institution* has a role in shaping behavior, not just observing it.
      *   **Which Philosopher?** We are not purely Mencius anymore. We are not purely Xunzi. We are pragmatic. We trust the person, but we audit the system.
      *   **The One Sentence (for the students):** Needs to be memorable and true.
      *   **The Ending:** True, not rousing. No "go change the world." Something about the complexity of trust.

  4.  **Refining the Tone:**
      *   Needs to be dignified but vulnerable.
      *   Avoid academic jargon for the parents.
      *   Avoid condescension for the students.
      *   Avoid pretension for the faculty.
      *   *Self-Correction during drafting:* I need to make sure I don't sound like I'm defending the faculty vote too aggressively. It needs to be an honest reckoning. The prompt says "make the distinction earn its place."

  5.  **Drafting - specific focus on the "Asymmetry":**
      *   Why proctor exams? Because grades are currency. Because the pressure to cheat is structural, not moral.
      *   Why trust dorms? Because relationships are real.
      *   So, is it Xunzi? Xunzi says we need correction. But we are only correcting the *exam*, not the *life*.
      *   *Idea:* The vote admits that the Honor Code had become a burden on the students' conscience. Proctoring frees them to be honest in life, by removing the specific temptation of the exam. That's a nuanced take.

  6.  **Writing - Step-by-Step (Mental or Scratchpad):**
      *   *Intro:* 11 years. The vote. The ancient Chinese debate.
