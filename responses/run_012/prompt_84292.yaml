      *   *The Sentence:* "Trust is not a blindfold; it is a hand on the shoulder." (Maybe too cliché). Let's work on that.
      *   *The End:* Quiet truth.

  7.  **Review against Constraints:**
      *   *Time:* 1000 words is about 7 minutes.
      *   *Audience:* Check definitions of Mencius/Xunzi. Check emotional resonance for grads.
      *   *Ending:* Ensure it's not a cheerleading speech.

  8.  **Final Polish:** (Focusing on the "True" ending).
      *   Instead of "Go forth and be good," maybe "You will be tested, and sometimes you will fail, and that is okay."
      *   Let's refine the "One Sentence." It needs to be the anchor.
      *   Let's refine the "Which Philosopher" answer. We are Mencius who listened to Xunzi.

