  **(Final check on Misconceptions):**
  *   (e) That RI is a *temporal* story. (Students imagine an actual anthropologist). It's a thought experiment about *conditions of possibility*.
  *   (f) That Charity applies to *logic* only. (It applies to beliefs about the world too).

  **(Final check on Closing Question):**
  *   Needs to distinguish Quine vs. Davidson.
