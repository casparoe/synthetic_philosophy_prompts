answer: |-
  Here is the draft material for your exam stack. I've tried to capture the nuance you flagged regarding the "direction of justification"—that's the hinge the best students should swing on.

  ### Exam Question (20 Marks)
  **Time Allowed: 50 Minutes**

  Williams presents two kinds of cases against consequentialism: those involving repugnant acts (the prisoner shooting, the chemist job) and those involving personal commitments (saving a drowning wife).

  1.  Do these objections stand or fall together? Identify what they share and where they differ.
  2.  Distinguish the complaint that morality is too *demanding* from the complaint that it causes *alienation*.
  3.  Consider the reply that an agent need not calculate in the moment, provided the justification exists in the background. What remains of Williams' objection if this reply is accepted?
  4.  What structural feature would a moral theory need to possess for this objection not to touch it at all?

  ***

  ### Model Answer (Approx. 600 words)

  Williams' objections share a core concern for integrity but target different mechanisms of consequentialist thought. The prisoner and chemist cases focus on *negative responsibility*: the agent is made causally responsible for outcomes they did not directly bring about, forcing them to violate deep convictions for the greater good. The husband case focuses on *personal commitments*: the requirement to view loved ones impartially inserts "one thought too many" into immediate action. They stand together insofar as both argue consequentialism separates the agent from their actions and projects. They differ in that the former concerns moral horror (doing evil for good), while the latter concerns the erosion of personal meaning (loving for a reason).

  It is crucial to separate demandingness from alienation. The demandingness objection claims consequentialism requires too much sacrifice (e.g., giving away all wealth). Williams' alienation objection is deeper: it claims the theory misdescribes the source of value. It is not that saving the wife is too costly; it is that the *reason* for saving her is wrong. If I save my wife because the calculus permits it, I am loyal to the theory, not to her. Alienation occurs when the justification for my project lies outside the project itself.

  The sophisticated consequentialist replies that agents need not calculate in the moment; they should cultivate dispositions (like love) that generally maximize utility. The justification sits in the background, accessible only to the critic. Williams' residual objection is that this renders commitments contingent. If the background calculus shifts—if saving the wife no longer maximizes utility—the disposition should logically be dropped. The agent must remain willing to abandon the project if the sums change. This preserves the alienation: the commitment is held on lease from the theory, not owned by the agent. The direction of justification remains external; the theory permits the care because it is useful, rather than being useful because the care matters.

  For a theory to avoid this entirely, it must grant agent-relative permissions or intrinsic value to personal projects. It cannot treat all value as neutral and aggregable. A non-consequentialist theory would locate the justification for saving the wife within the relationship itself, not in an external outcome. The theory would not ask the agent to step back from their commitments to validate them impartially. Instead, it would recognize that some reasons are grounded in who the agent is, not what they produce. To be immune to Williams, a theory must allow that some actions are right *because* they express the agent's integrity, even if they do not maximize the good. It must accept that the ground of ethics is not solely the state of the world, but also the character and connections of the agents within it.

  ***

  ### Marking Scheme (20 Marks Total)

  **1. Relationship Between Cases (4 Marks)**
  *   **Full Marks:** Identifies shared threat to integrity but distinguishes negative responsibility (Jim/George) from personal commitment (Wife).
  *   **Loss of Marks:** Treats them as identical examples of "hard choices" or fails to note the structural difference between doing harm vs. partiality.

  **2. Demandingness vs. Alienation (4 Marks)**
  *   **Full Marks:** Clearly defines demandingness as sacrifice of welfare vs. alienation as the source of justification/meaning.
  *   **Loss of Marks:** Conflates the two; argues Williams is just saying utilitarianism is "too hard" rather than "wrong-headed."

  **3. The 'Background' Reply & Residual Objection (4 Marks)**
  *   **Full Marks:** Acknowledges the indirect strategy but notes the contingency problem (willingness to drop the project if sums change).
  *   **Loss of Marks:** Accepts the indirect reply as a full solution; misses the point that the *justification* remains external.

  **4. Conditions for an Immune Theory (4 Marks)**
  *   **Full Marks:** Specifies agent-relative permissions or intrinsic value in projects; theory must not require impartial validation of personal commitments.
  *   **Loss of Marks:** Vague appeals to "being nicer" or "virtue" without explaining the structural change in justification.

  **5. Argumentative Coherence & Precision (4 Marks)**
  *   **Full Marks:** Logical flow, precise terminology, no unnecessary padding.
  *   **Loss of Marks:** Disorganized, verbose, or relies on biographical details/titles rather than arguments.

  **Distinction Between A and B Grades:**
  *   **B Grade:** Correctly identifies the cases and distinguishes demandingness from alienation. Accepts that the "background justification" is a strong reply but notes it feels cold.
  *   **A Grade:** Explicitly captures the **direction of justification** (as noted in point 3). They argue that even if the calculation is hidden, the commitment is still held on lease from the theory. They specify that an immune theory must treat personal projects as *sources* of value, not just vehicles for it.
