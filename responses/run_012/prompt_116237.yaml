      *   **Key Theme:** Second-order vagueness (vagueness of the boundary itself). The inspector's confidence has no edge.
      *   **Requirements:**
          *   Dramatize through ordinary life (wedding, feud, price of ice), not philosophical exposition.
          *   Include a physical image of the first-order problem (e.g., a pile changes status from dawn to noon).
          *   **Commit to a reading:** Realism (heap is real but unknowable), Nihilism/Epistemicism (nothing over habits), or Contextualism/Supervaluationism (shifts with stakes/context). The ending must land on this choice.
          *   **Appendix:** A short note explaining philosophical liberties/commitments.

  2.  **Determine the Philosophical Reading:**
      *   *Option 1: Epistemicism (Williamson).* There is a sharp boundary, we just don't know it. The inspector feels like a fraud because she's trying to pinpoint something unknowable but real.
      *   *Option 2: Nihilism/Error Theory (Unger).* There are no heaps. The inspector is participating in a falsehood.
      *   *Option 3: Contextualism (Raffman, Kamp).* The boundary shifts based on context/stakes/interests. The "heap" isn't fixed; it's sensitive to the situation.
      *   *Option 4: Higher-Order Vagueness (Sorensen, etc.).* The boundary itself is fuzzy.
      *   *Selection:* The prompt asks to dramatize the *inspector's uncertainty having no edge* (higher-order vagueness) and suggests a choice between real/unknowable, habitual, or shifting.
      *   *Decision:* I will commit to **Contextualism coupled with Higher-Order Vagueness**. The "heap" isn't a fixed metaphysical object, nor is it purely arbitrary. It is a tool of judgment that relies on a stable form of life, but when the stakes change (the guild's survival), the context shifts, and the boundary dissolves. The inspector isn't failing to see a real line; the line *requires* a shared unspoken agreement to exist. When the agreement breaks (merants gaming the system), the concept breaks. This allows for the "physical image" of the pile changing status not because fish vanished, but because the *look* of the pile changed relative to the inspector's heightened anxiety/context.
      *   *Refinement:* Actually, to make it punchier for a story, I'll lean towards **Epistemicism vs. Psychological Reality**. No, let's go with **Contextualism**. The boundary is real *in use*, but disappears when scrutinized. The ending should show that the "heap" returns only when the stakes return to normal (the human element), not when a rule is imposed.
      *   *Wait, the prompt asks to commit:* "decide whether your story treats the heap as something real that the inspector simply can't know, as nothing over and above the town's habits of calling things heaps, or as something that genuinely shifts with what's at stake."
      *   *My Choice:* **Something that genuinely shifts with what's at stake (Contextualism).** The "heap" is a functional category, not a metaphysical one. When the function breaks (gaming), the category breaks. When the human context returns, the category returns. This fits the "ordinary life" requirement best.

  3.  **Drafting - Scene by Scene:**
      *   **Introduction:** Establish Elara (the inspector), the dawn ritual, the lantern, the unspoken authority.
      *   **Inciting Incident:** The revenue drop. The merchants arranging fish in "almost heaps."
      *   **Rising Action:** The Guild meeting. The Clerk (let's call him Silas) proposing rules (Epistemicism/Nihilism mix). Elara trying to write a number (400? 401?) and failing.
      *   **The Physical Image:** A pile left on the dock. Dawn vs. Noon. Maybe the tide? No, the prompt suggests "a pile that is a heap at dawn and somehow isn't by noon." Maybe the light changes? Or the fish settle? Let's use the light and the settling. At dawn, in the lantern light, it looms. At noon, in harsh sun, it looks sparse.
      *   **Second-Order Vagueness:** Elara trying to find the boundary of her certainty. She knows *this* is a heap. She knows *that* is not. But the transition zone is not a line, it's a fog.
      *   **Ordinary Life Dramatization:**
          *   *The Feud:* Two families (the Vances and the Kells) over a dock. Who owns the "heap" of nets?
          *   *The Wedding:* A bride's train—is it a heap of silk?
          *   *The Ice:* Blocks of ice stacking.
      *   **Climax:** The Guild threatens to replace her with Silas's rule. Elara confronts the pile.
      *   **Resolution:** The rule fails because it doesn't account for the "look." The context shifts back when a human crisis occurs (maybe the ice or the wedding). The "heap" returns not because a number was set, but because the community needed it to be real again.
      *   **Ending:** Needs to land on the Contextualist reading. The heap exists only when the community agrees to look at it without counting.

  4.  **Writing - Focus on Sensory Details:**
      *   Smell of brine and gut.
      *   The lantern light vs. sun.
      *   The feeling of the pen hovering.
      *   The silence of the merchants.

  5.  **Refining the Philosophical Commitment:**
      *   I need to make sure I don't hedge. The story must imply that the *meaning* of "heap" is constituted by the practice, and when the practice becomes adversarial (merchants vs. guild), the meaning evaporates. It returns when the practice becomes cooperative again. This is a Wittgensteinian/Contextualist take.
      *   The "physical image": A pile of herring left out. At dawn, Elara marks it. At noon, the sun bleaches it, the fish settle, it looks smaller. But physically it's the same. The *heapness* leaked out with the shadow.

  6.  **Drafting the Note:**
      *   Must be separate.
      *   Explain the Contextualist commitment (Raffman/Kamp).
      *   Explain the treatment of Higher-Order Vagueness (the boundary of certainty is also boundaryless).
      *   Acknowledge the rejection of Epistemicism (no hidden sharp line).

  7.  **Review against Constraints:**
