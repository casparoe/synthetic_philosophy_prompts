  Elias is walking through a crowded market, deeply engrossed in a complex phone conversation. His eyes sweep across a vendor's stall containing a vivid red apple, fixing on it for 200 milliseconds. His visual system registers the apple's color and shape with high fidelity, satisfying First-Order Representationalism, but because his attention is fully committed to the conversation, he cannot later report or recall the apple. Simultaneously, Elias has a fleeting, non-conceptual awareness that his visual system is active—that he is undergoing *some* visual experience right now—without this awareness specifying *what* he is seeing, constituting an existential Higher-Order Representation rather than a de re one.

  (1) **Actualist Higher-Order Thought (HOT) Theory:** The theory says the first-order state is **unconscious**. Actualist HOT theory holds that a state is conscious only if it is targeted by an occurrent thought that characterizes the state's specific qualitative content. Because Elias's higher-order thought is merely existential ("I am in a visual state") and lacks the conceptual content required to individuate the specific first-order state ("I am seeing red"), the transitivity principle is not satisfied for that specific state, leaving it unconscious.

  (2) **Higher-Order Perception (HOP) Theory:** The theory says the first-order state is **conscious**. HOP theory models the higher-order representation as a non-conceptual inner sense scanner. Since the inner sense mechanism successfully detects and registers the occurrence of the first-order state, consciousness is conferred regardless of whether the scanner conceptualizes the specific content. The existential registration is sufficient for the state to enter phenomenal awareness, even if the content remains vague.

  (3) **Self-Representational (SR) Theory:** The theory says the first-order state is **unconscious** (regarding its qualitative character). SR theory requires that a conscious state represent itself. While the existential self-representation might generate a bare subjective character (a sense of "for-me-ness"), it fails to represent the state's specific qualitative properties. Without the state representing itself *as* having specific content, the qualitative character is not phenomenally manifest, so the state is not phenomenally conscious in the full sense.

  (4) **Diverging Feature:** The single feature is the **content-specificity of the higher-order representation** (whether it must be *de re* and qualitative or can be merely existential).

  (5) **Removal of Feature:** If the feature is removed—meaning the higher-order representation is *de re* and specifically represents the content (e.g., "I am seeing red")—the case collapses into a standard higher-order case where all three theories agree the state is conscious, as the transitivity, scanning, and self-representation conditions are all fully satisfied with specific content.

  (6) **Defusing the Case:** A defender of Actualist HOT theory (the theory most at odds with the First-Order intuition that there is *some* experience) would argue that the existential awareness Elias feels is not a higher-order thought *about the first-order state* at all, but rather a higher-order thought about the *self*. They would claim the transitivity principle requires awareness of the *state*, not merely awareness that one is in *a* state; thus, the existential representation fails to establish the specific relational property required for consciousness, preserving the view that without conceptual targeting, there is no phenomenal consciousness.
