prompt: |-
  I'm applying for a small interdisciplinary fellowship (philosophy of biology + astrobiology people, six months, basically one paper's worth of money) and I want to pitch something about the definition of life -- but not the standard "is a virus alive" seminar paper, everyone's seen that.

  My half-formed angle: people argue about which single criterion is the right one -- metabolism, replication, evolution by natural selection, autonomy, whatever -- as if the question were just which criterion wins. I think the debate is stuck for a different reason. The word "life" is doing at least three different jobs and the argument slides between them without noticing: (a) picking out a natural kind that's supposed to be out there in the world independently of us, (b) marking out a homeostatic property cluster where nothing is strictly necessary but a bunch of features tend to hang together and reinforce each other, and (c) working as a practical/decision-theoretic label -- the kind of thing we should protect, or study, or worry about building. On top of that I think there's a second confusion underneath: the question of what *makes* something alive versus the question of how we'd *detect* or recognize it, and those two pull the criteria in opposite directions (the detectability criteria want something measurable and operational, the metaphysical ones want whatever actually does the work). The borderline cases only look intractable because nobody says which of these jobs the proposed definition is answering.

  Turn this into the actual proposal. I need: the central question stated precisely enough that it has a determinate answer, or a determinate reason to think there isn't one; why the existing positions don't settle it; the method -- what I'd actually do, week by week over the six months, since this is mostly conceptual so I need to be honest about what the "work" even consists in; what a successful result would look like versus what would count as the project failing; and how to keep the scope from ballooning, because I know the borderline-case zoo (viruses, plasmids, prions, transposons, fire, crystals, weird synthetic cell-ish things, software agents) could eat the whole six months if I let it.

  Couple of constraints: no citations, no reading list -- I'll add those myself, and please don't just tell me to go read the standard papers. I want the framing and the argument structure, not a bibliography. And don't lean on super obscure ideas a general reader wouldn't know; keep it to positions and arguments I can actually state in a sentence or two.
reasoning: |-
  Here's a thinking process that leads to the suggested proposal:

  1.  **Analyze the Request:**
      *   **Topic:** Definition of life (Philosophy of Biology + Astrobiology).
      *   **Goal:** A 6-month fellowship proposal (one paper's worth of work).
      *   **User's Core Insight:** The debate is stuck because "life" performs three distinct functions (Natural Kind, Homeostatic Property Cluster, Practical/Decision-Theoretic Label) and conflates *constitution* (what makes it alive) with *detection* (how we find it).
      *   **Constraints:** No citations/reading lists. No obscure jargon. Precise central question. Clear methodology (week-by-week). Success/failure conditions. Scope control (avoid the "borderline case zoo").
      *   **Tone:** Professional, persuasive, philosophically rigorous but accessible to an interdisciplinary committee.

  2.  **Deconstruct the User's Insight:**
      *   *Problem:* Current debates treat "What is life?" as a single question with a single answer (e.g., metabolism vs. replication).
      *   *Diagnosis:* Category error. "Life" is polysemous in this context.
          1.  *Ontological:* Is it a natural kind?
          2.  *Cluster:* Is it a family resemblance concept?
          3.  *Normative/Pragmatic:* Is it a label for moral/scientific attention?
      *   *Secondary Confusion:* Constitution (metaphysics) vs. Detection (epistemology/operation).
      *   *Solution:* Disambiguate the functions. Don't seek *the* definition, but a map of *which* definition serves *which* purpose.

  3.  **Drafting the Proposal - Section by Section:**

      *   **Title:** Needs to be catchy but precise. Something about "Functions of Life" or "Disambiguating the Definition." Let's go with *The Functional Polysemy of 'Life': Disambiguating Ontology, Detection, and Normativity.*

      *   **Central Question:** Needs to be determinate. Not "What is life?" but "Why does the question 'What is life?' generate persistent disagreement?" or "Which definitional framework serves which scientific aim?"
          *   *Refinement:* "Does the concept of 'life' serve a unified theoretical role across biology and astrobiology, or does it fracture into distinct operational, ontological, and normative functions that require separate criteria?"
          *   *Hypothesis:* It fractures. The disagreement persists because participants talk past each other using different functions.

      *   **Critique of Existing Positions:**
          *   *NASA Definition (Operational):* Good for detection, bad for metaphysics.
          *   *Autopoiesis/Metabolism (Constitutive):* Good for theory, hard to measure remotely.
          *   *Evolutionary (Darwinian):* Good for history, excludes individuals.
          *   *The Failure:* They try to be everything at once. When a virus fails one test but passes another, we argue about the virus instead of the test's purpose.

      *   **Methodology (The 6-Month Plan):**
          *   *Challenge:* Conceptual work looks like "just thinking." Need to make it look like *work*.
          *   *Strategy:* Phased approach. Mapping -> Testing -> Synthesis.
          *   *Month 1-2:* Taxonomy of definitions. Map them to the three functions (Ontology, Cluster, Pragmatic).
          *   *Month 3-4:* Stress Testing. Apply the map to specific *types* of cases, not *all* cases. (Crucial for scope control). Pick 3 archetypes: Earth-bound edge case (virus), Astrobiology target (biosignature), Synthetic target (xenobiology).
          *   *Month 5:* Drafting the framework.
          *   *Month 6:* Revision and dissemination prep.
          *   *Scope Control:* Explicitly limit the case studies. Do not survey the whole zoo.

      *   **Success/Failure Conditions:**
          *   *Success:* A clear framework showing *why* disagreements happen + a recommendation for which definition to use in which context.
          *   *Failure:* Concluding "it's all vague" (defeatism) or getting bogged down in one specific case study (scope creep).

      *   **Significance/Impact:**
          *   Why does this matter? Astrobiology missions cost money. Synthetic biology has ethical risks. We need to know *why* we are defining life before we define it.

  4.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Check:* Did I use citations? No.
      *   *Check:* Is the "three jobs" idea clear? Yes, I'll label them clearly (Ontological, Cluster, Normative).
      *   *Check:* Is the Constitution vs. Detection distinction included? Yes, this is crucial for the astrobiology angle.
      *   *Check:* Is the scope controlled? I need to emphasize *not* analyzing every borderline case, but using them as test probes.
      *   *Tone:* Needs to sound like a fellow who knows how to finish a project in 6 months. Be specific about deliverables.

  5.  **Final Review against User Constraints:**
      *   "No citations, no reading list." -> Checked.
      *   "Don't lean on super obscure ideas." -> Keep it to standard philosophical distinctions (ontology vs. epistemology, natural kinds).
      *   "Week by week." -> I'll group them by month/phases for readability but keep it granular enough to show planning.
      *   "Central question stated precisely." -> Will ensure this is bolded.

  6.  **Final Polish:** Ensure the distinction between "what makes it alive" and "how we find it" is woven into the methodology, as that's the astrobiology hook. (Self-correction: Make sure the "Normative" aspect doesn't sound too ethical; keep it about "scientific attention" to fit the fellowship focus).

  7.  *(Drafting the response based on these thoughts...)*
answer: |-
  **Project Title:** The Functional Polysemy of 'Life': Disambiguating Ontology, Detection, and Normativity

  **Central Question**
  Does the persistent disagreement over the definition of life stem from a lack of empirical data, or from a category error in which a single term is forced to perform three incompatible theoretical functions? Specifically, I propose to demonstrate that the debate is intractable only so long as we treat "life" as a unified concept, and that progress requires decoupling the *ontological* question (what constitutes a living system), the *epistemic* question (how we detect living systems remotely), and the *normative* question (which systems warrant specific scientific or ethical attention).

  **The Problem: Why Existing Positions Stall**
  Current definitions of life generally fall into three camps, each claiming to be the definitive answer to a single question.
  1.  **The Metabolic/Constitutive View:** Focuses on self-maintenance and boundary-keeping (e.g., autopoiesis). This answers what life *is*, but fails as a detection tool for remote sensing.
  2.  **The Evolutionary/Darwinian View:** Focuses on replication with variation. This explains the *history* of life, but struggles with edge cases like mules or sterile castes, and is difficult to measure in a single snapshot.
  3.  **The Operational/Agostic View:** Focuses on measurable biosignatures (e.g., the NASA working definition). This is practical for mission design but admits it is not a true definition of nature, merely a heuristic.

  The debate stalls because proponents argue past one another. An astrobiologist defending an operational definition is accused of missing the "true nature" of life by a philosopher defending a constitutive definition. Meanwhile, both ignore that the label "life" often functions normatively—to designate systems that merit protection from contamination or moral consideration. By treating these distinct functions as competing answers to the same question, the field generates "borderline cases" (viruses, prions, synthetic cells) that look like metaphysical puzzles but are actually pragmatic mismatches.

  **Methodology and Work Plan (26 Weeks)**
  Since this is a conceptual project, the "work" consists of logical mapping, argument reconstruction, and stress-testing frameworks against constrained case studies. To prevent scope creep, I will not survey the entire zoo of borderline cases. Instead, I will select three *archetypal* stress tests to probe the three functions identified above.

  **Phase 1: Mapping the Functions (Weeks 1–8)**
  *   **Weeks 1–4:** Systematic reconstruction of the three dominant definitional frameworks (Constitutive, Evolutionary, Operational). I will code existing arguments not by their conclusion, but by the *function* they assume the word "life" is performing.
  *   **Weeks 5–8:** Development of the "Functional Polysemy" framework. I will formally distinguish the Ontological (Natural Kind), Cluster (Homeostatic Property), and Normative (Decision-Theoretic) roles.
  *   *Deliverable:* A detailed outline and a 3,000-word position paper clarifying the tripartite distinction.

  **Phase 2: Stress-Testing the Framework (Weeks 9–18)**
  *   **Weeks 9–12:** Apply the framework to **Archetype A: The Earth-Bound Edge Case (Viruses/Plasmids).**
      *   *Goal:* Show that the virus is "alive" normatively (it evolves, affects hosts) but fails ontologically (no metabolism) and epistemically (hard to distinguish from debris without context).
  *   **Weeks 13–16:** Apply the framework to **Archetype B: The Remote Target (Exoplanet Biosignatures).**
      *   *Goal:* Show that detection criteria (disequilibrium chemistry) are valid epistemically even if they tell us nothing about the ontology of the source.
  *   **Weeks 17–18:** Apply the framework to **Archetype C: The Synthetic Edge Case (Xenobiology/Protocells).**
      *   *Goal:* Show that the normative question (do we regulate this?) decouples from the ontological question (is this truly alive?).
  *   *Constraint:* I will explicitly exclude other borderline cases (fire, crystals, software agents) to ensure completion. These three archetypes are sufficient to prove the functional split.

  **Phase 3: Synthesis and Drafting (Weeks 19–26)**
  *   **Weeks 19–22:** Drafting the full manuscript. The core argument will be that we should stop seeking a "universal definition" and instead adopt a "contextual definition protocol" where the criteria shift based on the scientific aim (detection vs. explanation vs. regulation).
  *   **Weeks 23–24:** Internal revision and logic check. Ensuring the distinction between *constitution* and *detection* is rigorous.
  *   **Weeks 25–26:** Final polish and preparation for submission to a target journal (e.g., *Biology & Philosophy* or *Astrobiology*).
  *   *Deliverable:* A complete manuscript (8,000–10,000 words) ready for submission.

  **Success and Failure Conditions**
  *   **Success:** The project produces a framework that explains *why* specific disagreements occur (e.g., "This argument fails because it applies an ontological criterion to an epistemic problem"). The final paper offers a actionable recommendation for how astrobiologists and philosophers should specify which "definition of life" they are using in a given context.
  *   **Failure:** The project concludes that the term "life" is simply too vague to be useful (defeatism) without offering the functional map as a solution. Alternatively, failure would be getting bogged down in the metaphysics of one specific case study (e.g., spending 10 weeks on viruses) rather than using them as probes for the broader conceptual framework.

  **Significance**
  This project directly serves the interdisciplinary mission of the fellowship. For astrobiology, it clarifies mission design: we can justify searching for "life" using detection criteria that do not require settling metaphysical debates. For philosophy of biology, it dissolves a decades-long stalemate by showing the debate is verbal, not factual. By separating what life *is* from how we *find* it and why we *care* about it, we can move from arguing about definitions to arguing about the specific criteria appropriate for specific scientific goals.
