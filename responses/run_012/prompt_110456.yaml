      *   *The Technical Constraint:* The signal requires dropping the thermal mask. This makes them visible.
      *   *The Retaliation Question:* Can they survive if the response is hostile? Kael thinks maybe not. Elara thinks the cost itself proves they aren't maximizing for war.
      *   *The Climax:* The moment of decision. The finger over the button.
      *   *The Ending:* Ambiguous. The transmission starts (or doesn't)? Or the decision is made but the outcome is unknown. The prompt asks to finish unable to say whether it should have been sent. Let's have them initiate the sequence, but leave the consequence and the moral weight hanging. Or better, have the argument reach a stalemate where the action is taken but the interpretation remains dual. Actually, the prompt says "finish the story unable to say whether the transmission should have been sent." This implies the action might happen, but the justification remains balanced.
      *   *Refining the Paradox:* Elara wants to burn fuel to show they aren't saving it for missiles. Kael says burning fuel shows they *have* fuel to burn.
      *   *Style Check:* Continuous prose. No breaks. American English.

  5.  **Writing - Focus on Tone and Texture:**
      *   Needs to feel grounded. Technical but accessible.
      *   Avoid "Dark Forest" terminology. Use "The Quiet," "The Listeners," "The First Shot."
      *   Ensure the biology analogy is clear but diegetic (part of the character's speech).
      *   Ensure the game theory is clear but diegetic.

  6.  **Drafting - Mental Walkthrough:**
      *   Start with the heat. The cost of hiding is heat buildup.
      *   Elara wants to vent the heat as a signal. "We are burning energy to say hello."
      *   Kael says "Burning energy means you have energy."
      *   They argue about the "survival of the strike." If we vent, we are visible. If they shoot, do we die?
      *   If we can survive, we are too dangerous. If we can't survive, why signal?
      *   The decision loop.

  7.  **Word Count Management:**
      *   Need to expand on the sensory details of the room, the tension, the specific mechanics of the signal to hit the 1500-2500 range.
      *   Avoid summary. Show the argument happening in real-time.

  8.  **Refining the Ending:**
      *   Do not resolve. The key is the paradox.
      *   Maybe the signal is queued, but the launch key requires two codes. They hold the keys. They look at each other.
      *   Or the signal is sent, but the story ends before the response, focusing on the internal uncertainty.
      *   Better: The story ends with the decision made, but the reasoning leaves the reader unsure if it was right.
      *   Actually, the prompt says "finish the story unable to say whether the transmission should have been sent." This suggests the narrative shouldn't validate one side.
