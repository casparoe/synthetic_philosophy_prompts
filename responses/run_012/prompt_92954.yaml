answer: |-
  **Module:** PHI502 Decision Theory
  **Assessment:** Final Essay Paper
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the question below. No external materials permitted.

  ***

  ### Question 1

  Consider a novelist deciding whether to publish a finished manuscript. She assigns a probability of 0.5 to the market being 'Hungry' and 0.5 to it being 'Glutted'.
  *   If she publishes now: Payoff is 10 (Hungry) or 0 (Glutted).
  *   If she holds back for a year: Payoff is 4 (Hungry) or 4 (Glutted).

  She may commission a market report that reveals the true state. However, she suffers 'psychic costs' from the knowledge itself: learning the market is Glutted causes misery valued at -8; learning it is Hungry gives pleasure valued at +1. These values are additive to the publishing payoffs.

  **(a)** Calculate the expected instrumental value of the report (the increase in publishing payoff) and the expected net value of the report (including psychic costs). **[5 marks]**

  **(b)** Good's Theorem states that for a Bayesian expected-utility maximiser, the expected value of free information is non-negative because the agent can always ignore the information and choose the act they would have chosen anyway. Is the novelist's situation a counterexample to Good's Theorem? In your answer, distinguish between the *ex-ante* expectation and the *ex-post* outcome, and explain what work the phrase 'ignore the information' is doing in the theorem's proof. **[10 marks]**

  **(c)** Good's Theorem assumes a single-agent decision problem. Describe a scenario outside this framework (e.g., game theory or committee decision) where acquiring information can be strictly disadvantageous even without psychic costs, and explain why the 'ignore it' defence fails there. **[5 marks]**

  ***

  ### Model Answer

  **(a)**
  Without the report, the expected utility of publishing is $(0.5 \times 10) + (0.5 \times 0) = 5$. The utility of holding back is 4. The rational choice is to publish, with an expected value of 5.
  With the report, she publishes if Hungry (10) and holds if Glutted (4). The expected payoff is $(0.5 \times 10) + (0.5 \times 4) = 7$. The expected *instrumental* value of the information is $7 - 5 = 2$.
  However, the report carries expected psychic costs of $(0.5 \times 1) + (0.5 \times -8) = -3.5$. The expected *net* value is $2 - 3.5 = -1.5$.

  **(b)**
  This is not a counterexample to Good's Theorem, but rather a case where the premises of the theorem are not met. Good's Theorem applies to information that is 'free' in the sense that it enters the utility function *only* instrumentally, by altering action selection. It assumes $U(Action, State)$, whereas the novelist's utility function is $U(Action, State, Information)$.

  The theorem relies on the claim that upon receiving information, the agent can 'ignore it'. This does not mean forgetting the content; it means retaining the option to perform the action she would have chosen *had she not received the information*. In the novelist's case, she *can* ignore the recommendation (she can still publish even if told the market is Glutted). The instrumental value remains non-negative (2) because she retains this option. The negative net value arises because the information is not free; the act of observation itself has consequences (misery) independent of the action taken.

  Furthermore, Good's Theorem is an *ex-ante* claim about expectations before the information is received. It guarantees that buying the ticket in the lottery of information is not a losing bet *on average*. It does not guarantee a positive *ex-post* outcome. Once the novelist reads 'Glutted', she suffers the misery (-8). She may regret acquiring the information *ex-post*, even if acquiring it was rational *ex-ante* (had the psychic costs been lower). The theorem protects the decision to seek information, not the emotional state resulting from it.

  **(c)**
  In game theory, specifically in strategic interactions, information can be a disadvantage. Consider a negotiation where an agent would benefit from being perceived as unpredictable or committed to a threat. If an opponent knows the agent's private information (or if the agent acquires information that reveals their type), the opponent can exploit this.

  Here, the 'ignore it' defence fails because knowledge can constrain rational action through the mechanism of common knowledge or signalling. If I know you know my hand, I cannot bluff effectively. In a single-agent problem, the world does not react to my knowledge. In a multi-agent setting, other agents react to my knowledge (or my acquisition of it). Thus, 'strategic ignorance' can be rational; maintaining a state of not-knowing preserves a strategic option that knowledge would foreclose, violating the single-agent assumption required for Good's Theorem.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **Part (a) – Calculation [5 Marks]**
  *   **1 mark:** Correctly identifies baseline EV of publishing (5) vs holding (4).
      *   *Error:* Calculating baseline as 7 (assuming info is already held).
  *   **1 mark:** Correctly identifies optimal action with info (Publish if H, Hold if G).
      *   *Error:* Suggesting she publishes regardless of the report.
  *   **1 mark:** Correct Instrumental Value calculation (2).
      *   *Error:* Confusing gross payoff (7) with value of info (2).
  *   **1 mark:** Correct Expected Psychic Cost calculation (-3.5).
      *   *Error:* Ignoring the probabilities on the psychic costs.
  *   **1 mark:** Correct Net Value calculation (-1.5).
      *   *Error:* Adding costs to gross payoff rather than subtracting from value.

  **Part (b) – Good's Theorem & Analysis [10 Marks]**
  *   **2 marks:** States clearly that this is **not** a counterexample because the information is not 'free' (utility depends on the signal itself).
      *   *Error:* Claiming Good's Theorem is false/refuted by the example.
  *   **2 marks:** Explains that 'ignoring information' means retaining the *option* to choose the prior optimal act, not erasing the psychological impact.
      *   *Error:* Equating 'ignore' with 'forget' or 'remain unaware'.
  *   **2 marks:** Distinguishes *ex-ante* (expected value before reading) from *ex-post* (realised value after reading).
      *   *Error:* Arguing the theorem fails because the agent feels bad after reading.
  *   **2 marks:** Notes that the instrumental value (2) remains non-negative, satisfying the theorem's core claim regarding action selection.
      *   *Error:* Conflating instrumental value with net welfare.
  *   **2 marks:** Identifies that risk aversion does **not** break the theorem (it holds for any concave utility function over outcomes).
      *   *Error:* Claiming the theorem fails because the agent is risk-averse regarding the misery.

  **Part (c) – Beyond Single-Agent [5 Marks]**
  *   **2 marks:** Provides a valid scenario where information hurts (e.g., bargaining, poker, commitment problems).
      *   *Error:* Using another single-agent example (e.g., ambiguity aversion without strategic element).
  *   **3 marks:** Explains *why* the 'ignore it' defence fails: other agents react to the knowledge/state, making the option set dependent on the information state.
      *   *Error:* Suggesting the agent physically cannot ignore the information.

  **General Penalties**
  *   **-2 marks:** For failing to use British English spelling (e.g., 'maximize' instead of 'maximise').
  *   **-2 marks:** For reciting 'information is always good' without qualification in Part (b).
