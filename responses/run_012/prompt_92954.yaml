  2.  **Deconstruct Good's Theorem & The User's Example:**

      *   *Good's Theorem (1967):* For a Bayesian expected utility maximizer, the expected value of free information is non-negative.
      *   *Logic:* $EV(info) = E[\max_a E[U|info]] - \max_a E[U] \ge 0$. You can always choose the action you would have chosen without the info.
      *   *User's Twist:* The utility function includes the *experience of knowing*.
          *   Standard model: $U(Action, State)$.
          *   User's model: $U(Action, State, Information\_Received)$.
      *   *The Conflict:* If the utility function depends on the information itself (e.g., anxiety, curiosity), is the information still "free" in the sense required by Good? Or does this violate the assumption that information only affects utility via action selection?
      *   *Key Distinction:* Good's theorem assumes the *only* value of information is instrumental (helping you choose better actions). If information has *intrinsic* value (positive or negative), the theorem's standard formulation needs adjustment. If intrinsic value is negative enough, the *net* value is negative, but the *instrumental* value remains non-negative.
      *   *Ex-ante vs. Ex-post:* Good's theorem is about *expected* value before receiving info. It does not guarantee you won't regret getting the info after receiving it (ex-post), especially if the info has intrinsic disutility.
      *   *Beyond Single-Agent EU:* Game theory (knowledge can be a disadvantage in strategic interactions), Ambiguity aversion (Ellsberg), Committee decision making (different priors).

