answer: |-
  # Q&A Preparation Sheet: The Reliance-Answerability Norm

  ## Part 1: Concessions for Opening Remarks
  *Do not wait for these to be raised. Pre-emptively conceding them disarms the attackers and makes you look precise.*

  1.  **Concede that speaker-side states are reliable proxies.** Acknowledge that in most stable testimonial economies, a speaker's knowledge *is* the best evidence that they can bear reliance costs. You are not claiming speakers should ignore their own epistemic states; you are claiming those states are not the *source* of the norm.
  2.  **Concede that "costs" are context-sensitive.** Admit you are not offering a calculus for calculating reliance costs. The metric is determined by the specific conversational context and the relationship between interlocutors, not by a universal formula.

  ## Part 2: The Objections
  *Ordered by likelihood and potential damage. Replies are scripted for ~90 seconds spoken aloud.*

  ### 1. The Knowledge Norm Challenge (The Epistemologists)
  **Likelihood:** Certain. **Damage:** Fatal if lost.
  **The Objection:** "Take the lottery case. I hold a ticket in a fair million-ticket lottery. The odds are overwhelming that I lost. I don't *know* I lost, but the cost of your relying on my assertion is negligible—you'll buy a ticket anyway. Your norm permits me to assert 'I lost.' But that assertion is infelicitous. Conversely, if I know a secret but you have no reason to trust me, your norm suggests I can't assert it because you aren't entitled to rely. This gets the permissions backwards. Knowledge, not reliance, dictates whether I can speak."

  **Your Reply:**
  "Two quick points. First, on the lottery: the infelicity there isn't about reliance costs; it's about the *source* of the information. You're conflating the norm of assertion with the norm of belief formation. My view explains why, once the draw is announced, you *can* assert it even if you haven't checked the list, provided you're willing to correct the record if the machine malfunctioned. The 'wrongness' in the pre-draw case is that you can't answer for the reliance if the unlikely happens.
  Second, on the secret: assertion itself *creates* the entitlement to rely. You don't need prior trust to be entitled to rely on an assertion; the act of asserting invites that reliance. If I assert, I invite you to hold me accountable. If I know $p$ but refuse to be accountable for your reliance, I haven't actually asserted; I've merely murmured. The Knowledge Norm treats assertion as a display of status; I treat it as an assumption of responsibility. The lottery intuition pumps against me only if you assume knowledge is the goal, rather than secure coordination."

  **Weakest Point:** You are asking them to accept that the "infelicity" of the lottery assertion is pragmatic rather than normative, which they will reject as ad hoc.

  ### 2. The Scoreboard Redundancy (The Dynamic Semantics Group)
  **Likelihood:** High. **Damage:** Theoretical redundancy (your paper becomes a relabeling exercise).
  **The Objection:** "You're positing a 'norm' to do work that the conversational scoreboard already does. When you assert $p$, you propose to update the common ground. If $p$ is false, we repair the common ground. Why do we need a normative layer on top of this mechanical process? Saying I'm 'answerable' is just a fancy way of saying my update was rejected. What explanatory power does the norm add that the update conditions lack?"

  **Your Reply:**
  "The scoreboard tells us *what* changes when an assertion is made; it doesn't tell us *why* we are licensed to make the change or *why* we owe a repair when it fails. Mechanics describe the movement; norms explain the license. If I update the scoreboard with a lie, the mechanics look the same as if I updated it with a truth. The difference is my standing.
  Your framework treats the repair as a system error correction. My framework treats it as a debt repayment. This matters because it explains why we apologize. We don't apologize to a scoreboard; we apologize to a person we've exposed to risk. If you reduce this to update potential, you lose the ability to explain the reactive attitudes—blame, resentment, gratitude—that accompany testimony. I'm not describing the machinery; I'm describing the liability structure that allows the machinery to run without crashing."

  **Weakest Point:** They will argue that "reactive attitudes" are themselves just psychological responses to scoreboard violations, rendering your "liability structure" superfluous.

  ### 3. The Nature of the Obligation (The Legal Philosopher)
  **Likelihood:** Medium. **Damage:** High (if the concept of "obligation" is incoherent).
  **The Objection:** "You use the language of indemnity, warranty, and bearing costs. In law, a warranty creates a strict liability obligation to remedy defects. A representation creates a fault-based obligation. Which is this? If I assert $p$ in good faith, and $p$ is false, and you rely and lose money, do you have a claim against me? If yes, isn't this just contract law? If no, in what sense am I 'obligated'?"

  **Your Reply:**
  "It is neither contractual nor tortious; it is a normative obligation of standing. Think of it like promising. If I promise and fail, you don't necessarily sue me, but you are entitled to blame me. The 'cost' I bear isn't necessarily financial; it's the cost of my credibility and my standing in the conversation.
  However, the obligation is strict in one sense: if the reliance goes wrong, I owe a repair regardless of my intent. It is fault-based in another: the severity of the blame depends on whether I was negligent in assessing my ability to answer. So, it's a hybrid. I am strictly liable to correct the record, but I am only blameworthy if I was reckless in inviting the reliance. This distinguishes the liar from the mistaken informant. Both owe a repair; only the liar owes an apology."

  **Weakest Point:** Distinguishing "strict liability to correct" from "fault-based blame" may look like a verbal dodge to avoid defining the core obligation.

  ### 4. The Empirical Measure (The Graduate Students)
  **Likelihood:** Medium. **Damage:** Low (methodological quibble).
  **The Objection:** "You say the norm depends on whether the speaker is 'prepared to bear costs.' That's an internal mental state. How do we test this? If we can't observe preparedness, how do we distinguish between a speaker who violates the norm and a speaker who simply asserts incorrectly? What counts as evidence against your view?"

  **Your Reply:**
  "We observe the repair. The 'preparedness' is manifested in the uptake of the challenge. If I assert and you challenge me, and I refuse to engage or provide a remedy, that is behavioral evidence that I was not prepared to answer for the reliance.
  Evidence against my view would be a case where a speaker asserts, the reliance fails, the speaker refuses to bear any cost or offer repair, and yet the community treats the assertion as fully permissible and the speaker as blameless. If we find systematic cases where speakers invite reliance, fail, and face no normative consequence, my claim that this is a *constitutive* norm fails. Look for institutional settings where testimony has no accountability. If assertion persists there without answerability, I'm wrong."

  **Weakest Point:** A speaker can always claim they *were* prepared to answer but were prevented by external factors, making the mental state unfalsifiable.

  ## Part 3: Strategic Priorities

  ### The Single Crucial Exchange
  **You must win the exchange with the Epistemologists (Objection #1).**
  If the Knowledge Norm is constitutive, your Reliance Norm is merely a pragmatic consequence. You must establish that Knowledge is derivative (a good way to ensure answerability) rather than fundamental. If you concede that Knowledge is *a* norm, even if not the *only* one, your thesis weakens significantly. You must hold the line that Knowledge is purely instrumental to Answerability.

  ### The Question You Hope Nobody Asks
  **"The Liar's Paradox of Norms:"**
  *"If the norm is constitutive, then one cannot assert without satisfying it. But liars assert all the time. Liars are by definition not prepared to answer for the reliance they license (since they intend to deceive). So, on your view, are liars actually asserting? If yes, your norm isn't constitutive. If no, you have to explain what speech act they are performing instead, which seems implausible."*

  **Why this is dangerous:** It attacks the "constitutive" claim directly. If assertion is defined by this norm, violating the norm means you aren't asserting. But liars clearly assert.
  **Backup Defense (if asked):** "Constitutive norms define the *activity*, not the *success* of the activity. A chess player who moves a rook diagonally is still playing chess, but they are violating the rules. The liar is asserting, but they are doing so defectively. They are incurring the obligation while intending to evade it. The norm binds them even if they don't accept it, just as the law binds a tax evader." (Note: This risks conflating regulative and constitutive rules, but it's the best available shield).
