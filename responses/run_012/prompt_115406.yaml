  # JOINT STATEMENT ON THE ONTOLOGICAL IMPLICATIONS OF SPECIAL RELATIVITY
  **An Adversarial Collaboration between Camp A (Eternalism) and Camp B (Presentism/Dynamic Time)**

  ### 1. AGREED CLAIMS
  **We, the undersigned, affirm the following points of physics and logic. These are not up for debate.**

  1.  **Empirical Validity:** Special Relativity (SR) is the best current empirical description of spacetime structure. Lorentz invariance holds to high precision.
  2.  **Relativity of Simultaneity:** Within the formalism of SR, there is no frame-independent fact about whether two spacelike-separated events occur at the "same time." Simultaneity is a function of the observer's state of motion.
  3.  **Dead Moves:** Neither camp will assert absolute simultaneity as a feature of the *observable* physics. Neither camp will deny the mathematical consistency of the Lorentz transformations. Neither camp will claim the other is violating conservation laws or causality (in the sense of superluminal signaling).
  4.  **Observational Equivalence:** Assuming SR holds exactly, no experiment performed *within* spacetime can distinguish between the Block Universe and a Presentist universe with a hidden preferred frame. The dispute is metaphysical, not empirical.
  5.  **The Grandpa Fact:** We agree on the empirical history: The event designated "Grandpa at the kitchen table, 1994" occurred. We agree that in the current year, no signal from that event can reach us, and no signal from us can reach it.

  ### 2. THE DISAGREEMENT
  **We disagree on what the physics implies about existence. We state our positions in our own terms.**

  **Camp A (The Block Entailment):**
  "The Rietdijk–Putnam argument demonstrates that 'existence' cannot be absolute if 'simultaneity' is relative. If Observer 1's 'now' includes Andromeda event X, and Observer 2's 'now' includes Andromeda event Y (where Y is days later than X), and both observers are equally valid, then both X and Y must be equally real. To deny this is to privilege one observer's coordinate system without physical justification. Therefore, past, present, and future events all exist tenselessly. My grandpa in 1994 exists in the same way Andromeda exists now: at a different coordinate, but ontologically present."

  **Camp B (The Ontological Independence):**
  "The argument conflates *epistemic access* with *ontological status*. SR dictates what an observer can measure as 'simultaneous,' not what *exists*. 'Exists' is a tensed word; it means 'exists now.' That different observers slice the cake differently does not mean the whole cake is already baked. We maintain that reality is constituted by the present moment. SR describes the geometry of our access to reality, not the totality of reality itself. A hidden preferred frame may exist undetectably, or 'existence' is simply indexical to the observer's proper time."

  ### 3. THE CRUXES
  **Ordered by the impact settling them would have on the debate.**

  **Crux 1: The Existential Import of "Real-for-O"**
  *   **The Issue:** Does the statement "Event E is real for Observer O" imply "Event E exists simpliciter"?
  *   **The Case:** The Andromeda Paradox. Two people pass on Earth. For one, an Andromedan fleet has launched; for the other, the decision hasn't been made.
  *   **Camp A Prediction:** If "real-for-O" does not imply "exists simpliciter," the word 'real' loses all physical meaning. We predict that accepting frame-dependence of reality forces acceptance of the Block.
  *   **Camp B Prediction:** "Real" is indexical, like "here." "It is raining here" is true for London and false for Tokyo without contradiction. We predict "Event E is present" functions the same way.
  *   **Status:** *Intuition Pump.* No observation resolves this.

  **Crux 2: SR's Stance on Privileged Foliation**
  *   **The Issue:** Does SR *positively rule out* a preferred frame, or merely *fail to require* one?
  *   **The Case:** Lorentzian Ether Theory vs. Einsteinian Relativity. Both make identical predictions.
  *   **Camp A Prediction:** Postulating a hidden preferred frame is an unnecessary metaphysical surplus. SR rules it out by Occam's Razor.
  *   **Camp B Prediction:** SR only rules out a *detectable* preferred frame. Ontology can exceed measurement. The present is privileged metaphysically, even if not physically.
  *   **Status:** *Philosophical Stalemate.* Resolved only by new physics (see Crux 5).

  **Crux 3: The Growing Block**
  *   **The Issue:** Does the Andromeda argument kill the "Growing Block" (past/present exist, future does not) as well as Presentism?
  *   **The Case:** The "edge" of the block. If the edge is the "present," and the present is relative, the edge is jagged or frame-dependent.
  *   **Camp A Prediction:** Yes. A frame-dependent edge is incoherent. If the future is open for one observer but fixed for another, contradiction ensues.
  *   **Camp B Prediction:** No. The Growing Block can adopt a "cosmic time" foliation (if the universe allows) or accept that 'becoming' is local to the observer's worldline.
  *   **Status:** *Internal Coherence Check.*

  **Crux 4: Determinism vs. Ontology**
  *   **The Issue:** Does the Block Universe imply the future is causally determined?
  *   **The Case:** Quantum indeterminacy within a 4D manifold.
  *   **Camp A Prediction:** No. A block can contain chancy events. The future exists, but its existence does not imply it was causally necessitated by the past.
  *   **Camp B Prediction:** Yes, effectively. If the future already exists, it cannot be otherwise. 'Existence' entails 'fixity.'
  *   **Status:** *Semantic/Modal Dispute.*

  **Crux 5: Lorentz Violation**
  *   **The Issue:** Would experimental evidence of a preferred frame settle the matter?
  *   **The Case:** Detection of anisotropy in the speed of light or neutrino superluminality.
  *   **Camp A Prediction:** This would falsify SR, forcing a rewrite. It would support Camp B's hidden frame, but only by destroying the premise of the Rietdijk–Putnam argument.
  *   **Camp B Prediction:** This would vindicate Camp B. It would show the "hidden frame" was physically real all along.
  *   **Status:** *Empirical Test.*

  ### 4. CASE STUDIES & PREDICTIONS

  | Case | Type | Camp A Interpretation | Camp B Interpretation |
  | :--- | :--- | :--- | :--- |
  | **Andromeda Paradox** | Intuition Pump | Proves 'now' is arbitrary; all times must be equally real to avoid contradiction. | Proves 'now' is a relationship, not a property of the universe. No contradiction. |
  | **Grandpa (1994)** | Intuition Pump | He is located at $t=1994$. He exists there eternally. Grief is the pain of being stuck at $t=2024$. | He existed then. He does not exist now. Grief is the pain of absolute loss. |
  | **Supernova (Observed Now)** | Intuition Pump | The explosion event is a fixed point in the block. We just encountered the light cone. | The explosion happened in the past. It is no longer occurring. |
  | **Lorentz Violation** | **Real Test** | Would force abandonment of the Block argument as currently formulated. | Would vindicate the notion of a privileged present. |

  ### 5. SUMMARY TABLE

  | Crux | Camp A Position | Camp B Position | What Would Move A | What Would Move B |
  | :--- | :--- | :--- | :--- | :--- |
  | **Existential Import** | "Real-for-O" $\rightarrow$ "Real simpliciter." | "Real-for-O" is indexical (like "here"). | Proof that indexical existence leads to logical contradiction in QM. | Proof that "exists" cannot be tensed without violating Lorentz invariance. |
  | **Privileged Frame** | Ruled out by Occam's Razor. | Allowed as undetectable metaphysics. | Detection of a preferred frame (Lorentz violation). | Proof that hidden variables are impossible (e.g., stronger Bell tests). |
  | **Growing Block** | Incoherent (edge is relative). | Viable (edge is local or cosmic). | Demonstration that local becoming creates causal paradoxes. | Demonstration that cosmic time is physically meaningless. |
  | **Determinism** | Block $\neq$ Determinism. | Block $\approx$ Fixity. | Clarification of modal logic (existence $\neq$ necessity). | Clarification of modal logic (fixity $\neq$ existence). |
  | **Verbal Dispute** | Substantive ontological divide. | Largely verbal (definition of 'exists'). | Agreement that 'exists' must be tenseless for physics. | Agreement that 'exists' is inherently tensed for language. |

  ***

  **Signed,**

