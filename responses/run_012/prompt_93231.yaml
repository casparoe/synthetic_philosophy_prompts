  **Candid Assessment**

  Your idea is not confused, but it is dangerous. It risks reinventing the wheel without acknowledging the mechanic. Margaret Boden's *The Creative Mind* (1990) already established the standard distinction you are probing: "exploratory creativity" (moving within a space) vs. "transformational creativity" (changing the space). Your hunch—that transformation is just exploration in a higher-dimensional space—is a known counter-position in computational creativity theory (e.g., Wiggins). If you pitch this to a philosophy of mind panel without explicitly positioning your work against Boden, you will look unread.

  To avoid the "trivially true" trap, you must commit to the **formal model**. If your conclusion is merely "novelty is relative to a reference class," you have not earned a fellowship. The value here is proposing a *metric* that predicts when a space-boundary dispute will arise. The jazz case is strong, but do not promise empirical data collection (interviews) you can't finish in a year; rely on existing critical discourse. Below is the proposal, sharpened to meet these constraints.

  ***

  **Project Title:** Parameter Spaces and the Metric of Creativity: Operationalizing Hofstadter's Knob-Twiddling

  **Abstract**
  Douglas Hofstadter's metaphor of creativity as "knob-twiddling" suggests that genius differs from variation only in the magnitude of parameter adjustment. While intuitively compelling, this thesis remains philosophically inert. It fails to distinguish between adjusting an existing parameter and introducing a new dimension to the possibility space itself. This project asks: **Can creativity be modeled as a metric distance within a parameterized space, such that disagreements about originality reduce to disagreements about space boundaries rather than move magnitude?** I propose that "transformational" creativity is topologically identical to "exploratory" creativity, relative to a broader space. The core difficulty lies not in measuring the move, but in individuating the space. This fellowship will develop a formal model to test whether space boundaries are fixed by internal structural constraints or by practitioner consensus, using jazz contrafacts and computational microdomains as comparative case studies.

  **Theoretical Framework**
  Current cognitive science treats creativity as a binary distinction. Margaret Boden's influential framework separates "exploratory" creativity (navigating an existing conceptual space) from "transformational" creativity (altering the rules of the space). This distinction explains why some variations feel derivative while others feel paradigmatic. However, it relies on an undefined notion of the "space" itself. If a composer introduces a new instrument, is this a new parameter or a new space? Hofstadter's knob metaphor collapses this distinction, implying all creativity is navigation.

  This project argues that Hofstadter is right, but only if creativity is treated as a two-place predicate: *creative-relative-to-space-S*. The apparent difference between exploration and transformation is an artifact of how observers carve the possibility space. When a musician argues that a contrafact has "wandered too far" from the original standard, they are not disputing the distance traveled; they are disputing the boundaries of the relevant space. If this hypothesis holds, substantive disagreements about artistic value are often metalinguistic disagreements about space individuation.

  The project challenges the assumption that space boundaries are arbitrary. I hypothesize that spaces are fixed by either (a) internal structural constraints (e.g., harmonic logic) or (b) social consensus (e.g., genre conventions). Where these align, creativity judgments are stable. Where they diverge, we see the "paradigm shift" phenomenon. This moves the debate from subjective intuition to checkable predictions about when consensus will fracture.

  **Methodology**
  The research proceeds via a tripartite method: formal modeling, contested case analysis, and fixed-space validation.

  First, I will construct a parameterized formal model of a creative domain. Using a simplified music generation system, I will define a family of parameter spaces with a computable metric for "distance" between artifacts. I will define "size of variation" in two ways: (1) Euclidean distance within a fixed parameter set, and (2) the cost of adding a new parameter dimension. This model will generate predictions about which variations should be perceived as "transformational" versus "exploratory" based solely on topological properties.

  Second, I will test these predictions against a contested domain: jazz contrafacts. In this tradition, new melodies are written over existing chord changes. There is active discourse among musicians about when a contrafact becomes too distinct to remain associated with the original standard. I will analyze existing critical discourse, transcriptions, and liner notes to map where practitioners draw the boundary. I will compare these boundary judgments against the formal model's metrics. If the model predicts the points of争议 (controversy) where musicians disagree about classification, it supports the claim that creativity judgments track topological distance relative to a negotiated space.

  Third, I will validate the model against a fixed-space domain: Hofstadter's letter-string analogy problems and Raymond Queneau's *Exercises in Style*. In the letter-string domain, the rules are code-explicit; in Queneau's work, the theme is nailed down while style varies. Here, the space is either computationally defined or strictly constrained by the author. I will check whether the variations praised as "clearest" or "most inventive" correlate with the model's distance metrics when the space is not contested. This controls for the variable of social negotiation, isolating the structural component of creativity judgments.

  **Timeline**
  *Months 1–3:* Development of the formal parameterized model. I will define the metric space and run simulations to establish baseline predictions for "distance" versus "dimensionality" changes.
  *Months 4–6:* Analysis of the jazz contrafact case. I will compile a corpus of contrafacts and associated critical commentary to identify points of boundary dispute.
  *Months 7–9:* Analysis of the fixed-space cases (letter-strings and Queneau). I will apply the model to these domains to verify baseline correlation between metric distance and perceived novelty.
  *Months 10–12:* Synthesis and writing. I will compare the results across domains to determine if space individuation is primarily structural or social. I will draft the final monograph and two journal articles.

  **Expected Outcomes and Risk Assessment**
  A successful result will demonstrate that "transformational" creativity is not a distinct cognitive mechanism but a function of space expansion. The formal model should predict where practitioner consensus fractures in the jazz case. Specifically, high-distance moves within a fixed space should be rated as "virtuosic," while low-distance moves in an expanded space should be rated as "innovative." This would unify Hofstadter's metaphor with Boden's taxonomy under a single topological framework.

  If the model fails to predict the jazz boundary disputes, it suggests that creativity judgments are not metric-based but rely on semantic or historical factors unrelated to parameter space. This would be a significant negative result, indicating that computational models of creativity must incorporate historical context, not just structural possibility.

  The primary risk is scope creep. Building a robust formal model while analyzing two distinct artistic domains is ambitious for one year. To mitigate this, the music model will remain simplified, focusing on harmonic and melodic parameters only, ignoring timbre or rhythm. The jazz analysis will rely on existing literature rather than new ethnographic interviews. If the formal model proves intractable, the project will pivot to a purely conceptual analysis of the case studies, though this would reduce the novelty of the contribution.

  A second risk is triviality. If the conclusion is merely that "novelty requires a reference class," the project adds little to existing philosophy. To avoid this, the deliverable must be the specific metric itself—a tool for quantifying the "cost" of adding a dimension versus turning a knob. If I cannot define this cost non-arbitrarily, the project fails. Therefore, the success condition is not just a philosophical argument, but a working definition of "dimensional cost" that aligns with intuitive judgments in the test cases.

  **Significance**
  This project bridges computational modeling and philosophical aesthetics. By treating creativity as a function of space individuation, it offers a precise vocabulary for debates currently mired in metaphor. For cognitive science, it suggests that the "creative leap" is not a mystery of cognition but a renegotiation of constraints. For philosophy of mind, it clarifies the ontology of artistic properties, showing them to be relational rather than intrinsic. Ultimately, this work aims to turn Hofstadter's suggestive metaphor into a rigorous instrument for measuring the shape of thought.
