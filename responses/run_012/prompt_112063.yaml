answer: |-
  There is no single established term that captures the entire cluster of difficulties you have described. In academic ethics, these issues are usually treated as separate objections that happen to converge on the same weakness in consequentialist theory. Your intuition is correct: what you are describing is not one problem, but at least three distinct conceptual difficulties wearing one coat.

  The closest existing umbrella term is **The Cluelessness Objection**, but that term typically covers only the epistemic limitation (we cannot know the future), whereas you have identified structural and mathematical problems that persist even if knowledge were possible.

  Here is the disassembly of the phenomenon you have observed, broken down by its distinct components, their established names, and the points of agreement and contention among philosophers who work on this.

  ### 1. The Epistemic Problem: "Cluelessness"
  **The Claim:** We cannot reliably predict the long-term consequences of our actions because causal chains are complex, chaotic, and sensitive to initial conditions (the "butterfly effect").
  **Established Name:** **The Cluelessness Objection.** (Most prominently associated with James Lenman, 2000).
  **Status:**
  *   **Settled:** There is near-universal agreement that agents are epistemically "clueless" about consequences beyond a very short time horizon. No serious theorist claims we can calculate the effects of buying a car over three centuries.
  *   **Contested:** The implication of this ignorance.
      *   *Defense:* Many consequentialists argue this doesn't matter because we can rely on **Expected Utility**. Even if we don't know the specific outcome, we can assign probabilities. If the probability of a massive good effect is tiny, it might still balance out.
      *   *Critique:* Others argue that when uncertainty is this deep ("Knightian uncertainty"), probabilities cannot be assigned, and expected utility calculations collapse.

  ### 2. The Mathematical Problem: "Infinite Ethics"
  **The Claim:** This is the "stronger" difficulty you identified. It is not that we *cannot know* the numbers, but that the numbers may not *exist* or may be undefined. If the future of humanity is potentially infinite, any action that slightly alters the probability of human extinction changes an infinite amount of value.
  **Established Name:** **The Problem of Infinite Utility** or **Infinite Ethics**.
  **Distinction from Cluelessness:** Cluelessness says, "We can't see the numbers." Infinite Ethics says, "The sum of the numbers does not converge." Standard mathematics cannot compare two infinite sums easily (e.g., is infinity plus one better than infinity?).
  **Status:**
  *   **Settled:** There is no consensus mathematical framework for comparing infinite outcomes. Standard decision theory breaks down here.
  *   **Contested:** Whether this is a practical problem. Some "Longtermists" (e.g., Nick Bostrom, William MacAskill) argue we should act *as if* the far future dominates, focusing on extinction risk. Others argue this leads to **Fanaticism**, where a tiny probability of an infinite payoff justifies any present cost (a variation of Pascal's Wager).

  ### 3. The Boundary Problem: "Proximate Cause"
  **The Claim:** This is the specific insight your friend had about the "cut-off." Consequentialism requires summing effects, but it lacks a principled rule for where to stop summing. Stopping at "foreseeability" is convenient, not principled. Stopping at "causal connection" includes everything forever.
  **Established Name:** There is no single name, but it is often discussed under **The Problem of Proximate Cause** (borrowed from law) or **The Delimitation Problem**.
  **Distinction:** This is distinct from Cluelessness. Even if you *knew* the future, you would still face the question: "Why does the effect in year 200 count, but the effect in year 201 does not?" If the moral value flips based on this arbitrary line, the theory is **unstable**.
  **Status:**
  *   **Contested:** This is a major point of friction between **Act Consequentialists** (who theoretically must count everything) and **Rule Consequentialists** or **Satisficers** (who argue we should follow heuristics that generally work).
  *   **Consensus:** Most philosophers agree that strict Act Consequentialism is vulnerable here. The "convenient cut-off" is usually defended pragmatically: we stop counting where our influence becomes negligible, not where it becomes zero.

  ### 4. The Self-Application Problem: "Self-Defeat"
  **The Claim:** You noted that if the standard gives no verdict because the calculation is impossible, that verdict applies to the standard itself. If consequentialism says "do what maximizes good," but also implies "you can never know what maximizes good," it may be self-undermining.
  **Established Name:** **The Self-Defeating Objection** or **Pragmatic Self-Defeat**.
  **Distinction:** This is a meta-ethical problem. It asks whether the theory can coherently guide action if its own criteria for action are inaccessible.
  **Status:**
  *   **Contested:**
      *   *Subjective Consequentialism:* Some argue the theory should judge intentions or expected outcomes, not actual outcomes. This solves the self-defeat but changes the theory.
      *   *Objective Consequentialism:* Others maintain the theory describes what is *right*, not necessarily what is *decidable*. They accept that we might never know if we did the right thing, but claim there still *is* a right thing.

  ### 5. The "Vote" vs. The "Car": Causal Impotence vs. Causal Overflow
  You mentioned your friend's view on voting is the "same shape of mistake." It is structurally similar but logically distinct.
  *   **The Car (Overflow):** The causal chain is too long and tangled; the impact is *too big* to measure, so the value is indeterminate.
  *   **The Vote (Impotence):** The causal chain is too diluted; the individual impact is *too small* to measure (probability of being decisive is near zero).
  *   **The Connection:** Both rely on a naive model of **Causal Individualism**—the idea that an individual action can be isolated and traced to a specific outcome.
  *   **Established Name:** The voting issue is the **Paradox of Voting** (or Downsian Paradox). When applied to ethics, it is the **Problem of Causal Impotence**.
  *   **Resolution:** Most ethicists resolve the voting paradox by rejecting the "decisiveness" criterion. They argue for **Complicity** or **Participation**: you are responsible for your contribution to the collective act, not just the marginal difference you make. Your friend's insistence that the vote is "ethically inert" is generally regarded as a mistake in ethical reasoning, even if it is mathematically sound in narrow decision theory.

  ### Summary of the Phenomenon
  You asked for a term if nothing fits. While the components above have names, the specific phenomenon of the *verdict flipping based on an arbitrary temporal boundary* does not have a dedicated label. It is usually subsumed under Cluelessness, but as you noted, that conflates ignorance with arbitrariness.

  If you require a term to capture the specific instability your friend has identified, the most precise descriptive label would be:

  **Consequentialist Horizon Instability**

  **Definition:** The condition in which the moral valuation of an action lacks convergence, such that the verdict (positive, negative, or neutral) reverses depending on the arbitrary temporal or causal boundary selected for the calculation.

  **Boundary Cases for Testing:**
  1.  **The Convergent Case:** If effects dampen over time (e.g., ripples in a pond), the sum converges. Horizon Instability does not apply. (Test: Does the impact decay to zero?)
  2.  **The Divergent Case:** If effects compound or persist (e.g., a genetic change, a nuclear waste deposit), the sum does not converge. Horizon Instability applies. (Test: Does the impact persist or grow?)
  3.  **The Principled Cut-off:** If a theory introduces a non-consequentialist rule to stop counting (e.g., "only count foreseeable effects"), it solves Instability but ceases to be pure Consequentialism. (Test: Is the cut-off justified by consequences or by a rule?)

  ### Consensus vs. Contention
  *   **Settled:** Pure Act Consequentialism is computationally impossible for human agents. We are epistemically limited regarding the far future.
  *   **Contested:** Whether this impossibility falsifies the theory.
      *   *Camp A:* Yes, it shows we need a different ethical framework (Virtue Ethics, Deontology, or Rule Consequentialism).
      *   *Camp B:* No, it just means we must use proxies (heuristics, rules of thumb) to approximate the ideal, even if we can't reach it.
  *   **Contested:** Whether the "Strong" version (Infinite Ethics) is a real problem or a mathematical artifact that will be solved by better decision theory. Currently, there is no agreed-upon solution for infinite sums in ethics.

  Your friend has effectively rediscovered the tension between **Objective Rightness** (what actually produces the best outcome) and **Decision-Guidance** (what an agent can actually calculate). The "habit" you noticed—where people either ignore the future or obsess over it—is the standard polarization between **Near-Term Pragmatism** and **Longtermism**. Neither is a logical conclusion of the premises; they are coping mechanisms for the instability you identified.
