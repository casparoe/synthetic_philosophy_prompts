      Title: THE BRITISH INSTITUTE FOR MORAL HUSBANDRY
      Document: CODE OF PRACTICE 782-K (REV. 4)
      Subject: INDIRECT DUTIES REGARDING NON-HUMAN ENTITIES

      PREAMBLE
      This Code establishes the operational parameters for the treatment of livestock within certified holdings. It is founded upon the critical distinction that animals are not ends in themselves, but merely means to human ends. Consequently, no duty is owed directly to the animal. All protocols herein are designed solely to preserve the moral integrity of the human agent and to safeguard the interests of humanity. Compliance is not a matter of animal welfare, but of human character maintenance.

      1. STATUS OF LIVESTOCK
      1.1 All creatures classified under Schedule A (Livestock) are hereby designated as 'Things'. They possess no intrinsic moral standing.
      1.2 Any perception of obligation towards the animal is to be understood as a misapprehension of the true object of duty, which is the self.

      2. PROHIBITION OF CRUELTY
      2.1 The infliction of unnecessary pain upon livestock is strictly prohibited.
      2.2 This prohibition is not grounded in the suffering of the creature, which is morally negligible, but in the effect such action has upon the perpetrator.
      2.3 Cruelty towards animals dulls the shared feeling of their pain and weakens the natural predisposition towards compassion required for duties to mankind. A farmer who beats his ox damages his own humanity, not the ox.

      3. WANTON DESTRUCTION
      3.1 The destruction of a healthy animal without economic or scientific justification is forbidden.
      3.2 Such destruction constitutes an injury to the agent's own moral disposition. It promotes a callousness incompatible with virtuous citizenship.
      3.3 Efficiency in slaughter is mandated not to minimise distress in the subject, but to prevent the hardening of the heart in the operator.

      4. RECOGNITION OF SERVICE
      4.1 Where an animal has provided long-term service to the organisation (e.g., draft work, breeding), a Moral Commendation may be issued.
      4.2 Any financial bonus or public recognition associated with this Commendation shall be payable exclusively to the keeper or owner.
      4.3 The animal is incapable of receiving reward; the payment serves to reinforce the keeper's virtuous conduct in maintaining the instrument of their labour.

      5. AUTOMATION AND PSYCHOLOGICAL CONTINGENCY
      5.1 Duties regarding the treatment of livestock are contingent upon the engagement of human sympathetic disposition.
      5.2 Where processes are fully automated, such that no human agent witnesses or participates in the handling of the animal, the restrictions outlined in Clauses 2 and 3 are suspended.
      5.3 In the absence of a human observer, no moral character is at risk of degradation. Therefore, machinery may operate without regard for the analogues of pain exhibited by the livestock, provided no human staff are subjected to the sight or sound thereof.
      5.4 Staff entering automated zones must wear noise-cancelling headsets to ensure their moral disposition remains unaffected by auditory stimuli resembling distress.

      6. COMPLIANCE
      6.1 Inspectors shall assess the moral hygiene of the staff, not the physical condition of the stock.
      6.2 A clean shed with a corrupt farmer fails inspection; a bloody shed with a virtuous farmer passes, provided the blood was spilt for necessary human ends.

      Issued by the Ethics Committee, BIMH.
      Date: 14 October 2023.

