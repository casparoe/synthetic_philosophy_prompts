answer: |-
  ### Brainstorming: Distinctions, Status, and Selection

  Before codifying the procedure, we must separate the mathematical reality from the engineering folklore. Below are the critical distinctions, their epistemic status, and my decision on whether to encode them into the procedure.

  | Distinction | Status | Keep or Drop? | Rationale |
  | :--- | :--- | :--- | :--- |
  | **Worst-Case vs. Typical-Case** | **Theorem** (Complexity is worst-case); **Empirical Fact** (Instances vary). | **Keep** | This is the most common source of error. We must force the engineer to characterize their *actual* input distribution, not the theoretical worst case. |
  | **Exact vs. Approx vs. Decision** | **Theorem** (Classes like P, NP, APX differ). | **Keep** | Hardness to optimize does not imply hardness to approximate. The procedure must distinguish "find the best" from "find one within 10%." |
  | **Reduction Direction & Preservation** | **Theorem** (Reductions preserve complexity, not necessarily structure/size). | **Keep** | Engineers often treat reductions as equivalence. We must ask what the reduction *preserves* (e.g., does it blow up the input size?). |
  | **Hardness Basis (Unconditional vs. Conditional)** | **Theorem** (Undecidability); **Conjecture** ($P \neq NP$); **Habit** ("We failed to solve it"). | **Keep** | A problem being NP-hard is conditional on $P \neq NP$. A problem being undecidable is not. "We couldn't do it" is not a proof. |
  | **Asymptotics vs. Constants/Actual $N$** | **Theorem** (Limits); **Fact** (Hardware is finite). | **Keep** | $O(2^N)$ is fine for $N=10$. $O(N^2)$ is fatal for $N=10^9$ with bad constants. We must calculate concrete operations, not just classes. |
  | **Model vs. Solver** | **Habit** (Textbook models); **Fact** (SAT/ILP solvers exist). | **Keep** | Theoretical hardness assumes a generic TM. Modern solvers exploit structure. We must ask if an off-the-shelf solver works before declaring defeat. |
  | **"NP-Hard" means "Impossible"** | **Habit** (Folklore). | **Drop** | I will not encode this as a valid category. It is a false equivalence. The procedure will treat this claim as insufficient evidence. |
  | **Polynomial Time means "Fast"** | **Habit** (Folklore). | **Drop** | $O(N^{10})$ is not fast. I will replace this with a concrete time-budget check. |

  ---

  ### The Intractability Adjudication Protocol (IAP)

  **Purpose:** To produce a defensible written verdict on proposals to abandon exact algorithms for heuristics.
  **User:** A single software engineer.
  **Timebox:** 1 week max for data gathering.

  #### Named Verdicts
  1.  **`VERDICT_EXACT_FEASIBLE`**: The hardness claim is irrelevant to our scale or instance type. Proceed with exact solution.
  2.  **`VERDICT_HEURISTIC_MANDATED`**: The problem is unconditionally hard (e.g., undecidable) or the scale/constants make exactness physically impossible. Do not attempt exact.
  3.  **`VERDICT_BUSINESS_RISK`**: The problem is conditionally hard (e.g., NP-hard) and approximation is possible. The choice depends on value trade-offs, not engineering truth. Escalate to Director.
  4.  **`VERDICT_CLAIM_INVALID`**: The hardness argument provided is logically flawed or unsupported. Re-submit with proof or proceed with exact.

  #### The Checklist

  **Step 1: The Scale Check (Asymptotics vs. Reality)**
  *   **Question:** What is the maximum value of $N$ (input size) we expect in the next 24 months, and what is the concrete operation count of the proposed exact algorithm at that $N$?
  *   **Sufficient Answer:** A specific number (e.g., "$N=50$, operations $\approx 10^{15}$").
  *   **Stop Condition:** If operations < $10^9$ (approx 1 second on modern hardware), stop and issue **`VERDICT_EXACT_FEASIBLE`**.
  *   **Note:** Do not accept "$O(2^N)$" as an answer. Calculate $2^{\text{max\_N}}$.

  **Step 2: The Hardness Basis (Theorem vs. Conjecture)**
  *   **Question:** What is the source of the hardness claim?
  *   **Sufficient Answer:** One of: (A) Unconditional lower bound (e.g., Halting Problem, EXPTIME-complete), (B) Conditional on $P \neq NP$ (NP-hard), (C) Empirical failure ("We tried and it was slow").
  *   **Stop Condition:** If (C), stop and issue **`VERDICT_CLAIM_INVALID`**. Empirical failure is not hardness.
  *   **Note:** If (A), proceed to Step 6. If (B), proceed to Step 3.

  **Step 3: The Reduction Audit (Preservation)**
  *   **Question:** If a reduction was used to prove hardness, what parameters does it preserve? specifically, does the reduction map *our* small $N$ to the *hard* region of the source problem?
  *   **Sufficient Answer:** A mapping description (e.g., "Our $N=50$ maps to 3-SAT with 50 variables").
  *   **Stop Condition:** If the reduction requires $N$ to be asymptotically large to trigger hardness, and our $N$ is small, stop and issue **`VERDICT_EXACT_FEASIBLE`**.
  *   **Note:** Many NP-hard problems are polynomial on bounded treewidth or small $N$.

  **Step 4: The Solver Reality Check (Model vs. Tool)**
  *   **Question:** Have we benchmarked a state-of-the-art constraint solver (SAT, ILP, CP-SAT) on a representative instance of our actual data?
  *   **Sufficient Answer:** Benchmark results (Time/Memory) or a documented attempt.
  *   **Stop Condition:** If a solver finds the exact solution in < 1 minute on max-scale data, stop and issue **`VERDICT_EXACT_FEASIBLE`**.
  *   **Note:** Theoretical hardness assumes worst-case construction. Solvers exploit average-case structure.

  **Step 5: The Approximation Gap (Exact vs. Approx)**
  *   **Question:** If we switch to a heuristic, what quality guarantee do we lose? Is the problem hard to *approximate* (e.g., no PTAS) or just hard to *optimize*?
  *   **Sufficient Answer:** A statement of the bound (e.g., "We lose the guarantee of optimality," or "We cannot guarantee better than 2x optimal").
  *   **Stop Condition:** If the problem is hard to approximate within a useful factor (proven via PCP/Gap hardness), proceed to Step 6. If it is easy to approximate (e.g., within 1%), proceed to Step 6.
  *   **Note:** This step determines if the heuristic is actually viable.

  **Step 6: The Value Handoff (Engineering vs. Product)**
  *   **Question:** Does the business requirement demand exactness, or is "good enough" acceptable given the cost savings?
  *   **Sufficient Answer:** This is not an engineering question.
  *   **Stop Condition:** If Step 2 was (A) [Unconditional] or Step 5 showed approximation is also hard, issue **`VERDICT_HEURISTIC_MANDATED`** (with a warning that quality will suffer).
  *   **Stop Condition:** If Step 2 was (B) [Conditional] and Step 1/4 showed exact is too slow, issue **`VERDICT_BUSINESS_RISK`**.
  *   **Note:** This is where the Director signs. They are accepting the risk of sub-optimal solutions or the cost of exactness.

  ---

  ### Running the Procedure: Three Cases

  #### Case 1: The Scheduling Problem (Small $N$)
  **Proposal:** "We need to schedule tasks. It's a variant of Job Shop Scheduling, which is NP-hard. Let's ship a greedy heuristic."
  **Context:** Largest real instances have a few dozen items ($N \approx 50$).

  *   **Step 1 (Scale):** Max $N=50$. Algorithm is $O(N!)$. $50! \approx 3 \times 10^{64}$.
      *   *Calculation:* $10^{64}$ operations is physically impossible (exceeds age of universe in nanoseconds).
      *   *Result:* Fail. Proceed to Step 2.
      *   *(Self-Correction/Unwelcome Truth):* The engineer argued "N is small, so it's fine." The procedure forces the factorial calculation. The intuition was wrong.
  *   **Step 2 (Hardness Basis):** Claim is NP-hard (Conditional).
      *   *Result:* Proceed to Step 3.
  *   **Step 3 (Reduction):** Reduction is from general Job Shop.
      *   *Result:* Proceed to Step 4.
  *   **Step 4 (Solver):** Team benchmarks a CP-SAT solver on $N=50$.
      *   *Result:* Solver takes 4 hours per run.
      *   *Decision:* 4 hours is too slow for the API latency requirement (200ms).
  *   **Step 5 (Approx):** Greedy heuristic gives solution in 10ms, but no optimality guarantee.
      *   *Result:* Trade-off exists.
  *   **Step 6 (Value):** Engineering cannot meet latency with exact.
      *   *Verdict:* **`VERDICT_HEURISTIC_MANDATED`**.

  **Analysis:** This is the **Unwelcome Truth**. The engineering team believed "Small $N$" implied "Exact is Feasible." The procedure revealed that "Small $N$" combined with "Factorial Complexity" is still impossible. They must ship the heuristic, contrary to their hope that scale would save them.

  #### Case 2: The Regime Mismatch (Irrelevant Reduction)
  **Proposal:** "We are building a graph matcher. A colleague proved it's NP-hard via reduction from Clique. We should approximate."
  **Context:** The reduction relies on graph density properties we never see (our graphs are trees/forests).

  *   **Step 1 (Scale):** $N=1000$. Algorithm is $O(2^N)$.
      *   *Result:* Fail. Proceed to Step 2.
  *   **Step 2 (Hardness Basis):** NP-hard (Conditional).
      *   *Result:* Proceed to Step 3.
  *   **Step 3 (Reduction Audit):** The reduction from Clique requires high-density graphs to trigger the hard case. Our inputs are restricted to trees (bounded treewidth).
      *   *Analysis:* Problems on trees are often polynomial time (e.g., $O(N)$ or $O(N^3)$), even if the general graph version is NP-hard. The reduction does not preserve the *structural constraint* we have.
      *   *Result:* The hardness claim does not apply to our *subset* of instances.
      *   *Stop Condition:* Hardness is irrelevant to our regime.
  *   **Verdict:** **`VERDICT_EXACT_FEASIBLE`**.

  **Analysis:** The procedure protects the team from over-generalizing a theorem. The colleague was theoretically correct but practically wrong. We proceed with exact algorithms because our data structure simplifies the problem class.

  #### Case 3: The Quality Guarantee (Conjecture & Trade-off)
  **Proposal:** "We need to cluster users. We want a guarantee that our clusters are within 5% of optimal. This is hard. Let's ship k-means with no guarantee."
  **Context:** Reduction chain shows getting within 5% is NP-hard unless $P=NP$.

  *   **Step 1 (Scale):** $N=10^6$. Exact is impossible.
      *   *Result:* Fail. Proceed to Step 2.
  *   **Step 2 (Hardness Basis):** NP-hard (Conditional on $P \neq NP$).
      *   *Result:* Proceed to Step 3.
  *   **Step 3 (Reduction):** Hardness holds for general metrics.
      *   *Result:* Proceed to Step 4.
  *   **Step 4 (Solver):** No solver handles $N=10^6$ exactly.
      *   *Result:* Proceed to Step 5.
  *   **Step 5 (Approx Gap):** The proposal asks for a 5% guarantee. The hardness proof says *no algorithm* can guarantee 5% in polynomial time (assuming $P \neq NP$). K-means offers no bound.
      *   *Analysis:* We cannot satisfy the requirement (5% guarantee) with *any* efficient algorithm. We must choose between "Slow + Guarantee" or "Fast + No Guarantee."
  *   **Step 6 (Value Handoff):** This is not a technical truth; it is a product risk. Is the business willing to accept unbounded error for speed?
      *   *Verdict:* **`VERDICT_BUSINESS_RISK`**.

  **Analysis:** This hits the handoff point. The procedure stops the engineer from making a promise they can't keep ("Fast + 5% Guarantee"). It hands the decision to the Director: "We can have speed, or we can have a guarantee, but physics (and P vs NP) says not both. Which do you want?"

