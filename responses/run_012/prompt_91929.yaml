  ### Limitations: Where the Procedure Fails

  You asked for an honest account of where this tool will misfire. Here is where you cannot trust the output blindly:

  1.  **The "Constant Factor" Blind Spot:** Step 1 asks for operation counts. Engineers are notoriously bad at estimating constants. An algorithm labeled $O(N)$ with a constant of $10^9$ will be slower than $O(N^2)$ with a constant of 1 for all practical $N$. The procedure assumes the engineer can profile or estimate this accurately. If they guess, the verdict is garbage.
  2.  **Solver Black Boxes:** Step 4 relies on benchmarking solvers. Solvers are sensitive to formulation. A bad formulation of an ILP can time out while a good one solves instantly. The procedure might return `VERDICT_HEURISTIC_MANDATED` simply because the engineer modeled the constraints poorly, not because the problem is hard. This requires a senior review of the *modeling*, not just the *result*.
  3.  **The "Future N" Gamble:** Step 1 asks for $N$ in the next 24 months. Product teams often underestimate growth. A verdict of `VERDICT_EXACT_FEASIBLE` based on $N=100$ is technically correct today but technically negligent if $N$ hits 10,000 next year. The procedure validates the *current* claim, not the *architectural* longevity.
  4.  **Conjecture Reliance:** Step 2 distinguishes between Unconditional and Conditional hardness. However, in practice, $P \neq NP$ is treated as a law of physics. The procedure treats them differently, but if $P=NP$ were proven tomorrow, half our security and complexity assumptions would vanish. The procedure treats $P \neq NP$ as "true enough," which is a pragmatic lie, not a truth.
  5.  **Judgment Disguised as Procedure:** Step 6 (Value Handoff) is where the real decision happens. The procedure can force the conversation, but it cannot prevent a Director from signing off on a `VERDICT_BUSINESS_RISK` without understanding the risk. It produces a defensible *document*, not a defensible *decision*.

  **When to distrust the verdict:** If the engineer running this has never implemented the algorithm they are evaluating, or if the "max N" is based on current data rather than data model constraints. In those cases, the inputs are fiction, and the procedure is just a calculator for lies.
