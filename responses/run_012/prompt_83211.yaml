answer: |-
  # The Feedback Threshold

  The gel was cold, a shock against the scalp that never failed to make the subject flinch before the electrodes were even secured. Elara smoothed it into the hairline with her thumb, feeling the ridge of the skull beneath. The array sat like a silver crown, wired to the console that hummed with a low, waiting vibration.

  On the bed lay a man nobody knew. John Doe 442. Found on the embankment, brain stem intact, higher functions silent for six months. The state required a number before they could move him to long-term care or release the body to the earth.

  Elara tapped the screen. The stimulus loop engaged. A microscopic pulse fired into the parietal lobe. The nervous system reacted. The array measured the system's reaction to that reaction. Did the signal echo? Did it stabilize? Or did it dampen into noise?

  The bar on the monitor climbed. It stalled at 0.12.

  "Record it," she said.

  Her colleague, Julian, typed the value into the log without looking at the patient. "Below threshold. Classification: Biological Object."

  Elara peeled the array off the man's head. He did not stir. She wiped the gel from his skin with a rough cloth. She felt nothing. There was no sorrow, no relief, only the completion of a task. The number was a key that fit a lock, and the lock had not turned. She knew the number was not the man. It was a measure of electrical stability, a reading of how well the wiring held a charge against itself. It was not a measure of hope, or history, or the capacity to suffer. But she signed the form that treated the number as if it were all those things.

  "Next," Julian said.

  Elara washed her hands. The soap smelled of antiseptic and lemon. She dried them on the paper towel, watching the fibers tear. "I'm taking the next one," she said.

  Julian looked up. He was a big man, soft around the middle, with eyes that always seemed to be focusing on something just behind her shoulder. "You want 443? It's a synthetic. Caretaker model. Routine certification."

  "No," Elara said. "Bring him in."

  Julian paused, the towel still in his hand. He knew who *him* was. He nodded, once, and left the room.

  Elara stood alone with the machine. She checked the calibration. The stimulus loop had to be precise; if the return pulse was too strong, it flooded the sensors. If too weak, there was no echo. It measured whether the system could hear itself speak.

  She had argued about this once, months ago, in this same room. Dr. Aris, the director, had stood where Julian now stood.

  "It's a diagnostic," Elara had said then. "It measures feedback stability. It tells us if the loop is closed."

  "And if the loop is closed," Aris had replied, not looking up from his tablet, "then there is someone home. That is the policy."

  "It tells us how we know," Elara had said. "It doesn't tell us what *is*. A mirror reflects light perfectly. That doesn't make the mirror a person."

  "That is a coward's dodge," Aris had said. "We need a line. You draw it with data, or you draw it with whim. We chose data."

  "And if the data is measuring the wrong thing?"

  "Then the error is uniform," Aris said. "Uniform error is justice."

  The door opened. Julian wheeled the bed in. David lay beneath the thin sheet. His chest rose and fell with the rhythm of the ventilator. His face was pale, the skin translucent enough to show the blue map of veins beneath. The accident had taken the speech, the movement, the wakefulness. It had left the body.

  Elara moved to the head of the bed. She did not look at Julian. She began to prep the scalp. Her hands were steady, but she could feel the tremor in her forearms, a vibration that matched the hum of the console.

  "You don't need to do this," Julian said. His voice was low. "I can call it."

  "I need to see the number," Elara said.

  "You know what he is," Julian said. He stepped closer, resting a hand on the rail of the bed. "Look at him. You don't need a machine to tell you he's in there. You see it in the face. You hear it in the breathing. It's direct. You don't infer it."

  Elara smoothed the gel over David's temple. "I don't see anything. I see skin. I see bone."

  "You see *him*," Julian insisted. "When I look at you, I don't calculate. I don't say, 'Elara is moving her lips, therefore she has an interior.' I just know. It's immediate. Why is he different?"

  "Because I know I am me," Elara said. She attached the first electrode. "I know what it is like to be inside this skin. When I look at you, I assume you are like me. I take my case and I copy it onto you. It's an inference. A guess."

  "It's not a guess," Julian said. "It's perception. Like seeing the color red. You don't infer the red. You see it."

  "I see the wavelength," Elara said. "The red is inside."

  She attached the last electrode. The array settled onto David's skull. She stepped back to the console. The threshold for Personhood Status was 0.50. Below that, he was a Biological Object. Insurance would cease. Support could be legally withdrawn. Above that, he was a Someone. He stayed.

  "Run it," Julian said.

  Elara pressed the key. The console hummed louder. The stimulus fired.

  She watched the waveform. She knew the physics of it. She knew that a high score meant the nervous system was catching its own tail, sustaining a pattern against the noise. She knew that a low score meant the signal died. She knew that a system could be conscious and have a damaged loop. She knew a system could have a stable loop and be empty. She knew the number was a marker, not the thing marked.

  She looked at David. She wanted to scream at him to hold the signal, to keep the echo alive. She wanted to reach into his skull and steady the firing neurons with her hands.

  The bar climbed. 0.30. 0.40. It slowed. It hovered.

  0.49.

  The number blinked green, then settled into red. Below threshold.

  Elara stood still. The hum of the machine seemed to drop away, leaving only the sound of the ventilator. *Hiss. Click. Hiss. Click.*

  "Record it," she said. Her voice was flat.

  Julian didn't move. "Elara."

  "Record it, Julian."

  "He's still breathing," Julian said. "I can see him. I know he's there."

  "The policy is the policy," Elara said. She began to detach the electrodes. "Uniform error is justice."

  "That's a lie," Julian said. "You know it's a lie. You're using a ruler to measure weight."

  "It's the only ruler we have."

  "It measures how we know," Julian said, echoing Aris, echoing her. "It doesn't measure what he is. You told me that."

  "And I still have to sign the form," Elara said. She wiped the gel from David's forehead. Her thumb lingered on his brow. It was cool. "If I ignore the number, I lose my license. If I lose my license, I can't care for him at all. If I follow the number, he loses status, but I can stay. I can be here."

  "So you sacrifice the truth to keep the access."

  "I sacrifice the definition to keep the person," Elara said. "There is a difference."

  Julian typed the number into the log. The sound of the keys was loud in the quiet room. "He's an Object now. Legally."

  "I know."

  "And you're okay with that?"

  "No," Elara said. "But the practical question is settled. He stays in the ward. I keep working. The metaphysical question..." She gestured to the machine. "That stays open."

  Julian closed the file. "You're complicit."

  "Yes."

  He left the room. Elara stood alone with David. The ventilator hissed. She looked at the console. The number 0.49 glowed on the screen. One hundredth of a point. A rounding error. A fluctuation in the voltage. It was the difference between a someone and a something. It was visibly arbitrary. It was the law.

  She locked the door.

  She pulled a second array from the cabinet. It was against protocol to administer the test without a logged subject. It was against physics to administer it to oneself.

  Elara sat in the chair beside the bed. She parted her own hair. She applied the gel. It was colder than she remembered. She fixed the electrodes to her own scalp. The wires trailed down her neck like vines.

  She reached for the keyboard.

  The problem was the stimulus. The test relied on the system's response to its own prior response. It required surprise. The nervous system had to react to the echo without anticipating it. If the system knew the pulse was coming, it adjusted. It dampened the reaction. It corrected for the input.

  Elara knew the pulse was coming. She was the one pressing the key.

  She hovered her finger over the enter key. She tried to clear her mind. She tried to forget she was the operator. She tried to become only the subject. But she was both. The loop was not closed; it was wide open. She was watching herself watch herself.

  She pressed the key.

  The stimulus fired. She felt the tiny prick behind her ear. She waited for the return. But her brain had already prepared for the prick. The response was not a reaction; it was a confirmation. The array searched for the echo of a surprise that hadn't happened.

  The bar on the screen didn't climb. It stayed at zero.

  0.00.

  Elara stared at the number. She felt the pain in her head. She felt the fear in her chest. She felt the love for the man in the bed. She knew, with absolute certainty, that she was here. She was the one thing in the universe she did not have to infer.

  The machine said she was nothing.

  She sat in the silence. The 0.00 blinked. It was the perfect score for a stone. It was the perfect score for a god. It was meaningless.

  She thought of David. 0.49. He was a Someone, to her. The machine said he was a Something.
  She thought of herself. 1.00, in truth. The machine said she was a Something.

  The gap yawned between the marker and the thing marked. She had known it all along. She had explained it to Aris. She had explained it to Julian. But she had signed the form. She had let the number decide the bed, the food, the legal standing. She had treated the map as the territory because she had no other map.

  Elara reached up and peeled the electrodes from her own skin. The gel pulled at her hair. She wiped the residue from her temple with the back of her hand.

  She stood up and walked to the console. She highlighted the log entry for David. 0.49. Biological Object.

  She could change it. She could type 0.51. It would be a lie. It would be a fraud. It would restore his status. It would align the paper with what Julian saw in the face, with what she felt in the room.

  But if she changed it, the number became a whim. If it was a whim, it could be changed back. If it could be changed back, it was not a right. It was a gift. And gifts could be taken away.

  If she left it, the number was a law. Cold, arbitrary, blind. But stable. He would be an Object on paper, and a Someone in the room. She would have to protect him from the paper.

  Elara looked at David. The ventilator hissed. He did not know he was an Object. He did not know he was a Someone. He just was.

  She moved the cursor away from the log. She saved the file.

  She turned off the console. The hum died. The room was quiet, save for the breathing. She took the array from her own head and placed it in the sterilization tray beside the one she had used on him. They looked identical. Two silver crowns. One had measured a ghost. One had measured nothing.

  Elara sat in the chair beside the bed. She took David's hand. It was warm. The skin was soft. She could feel the pulse in his wrist, a steady drumbeat against her thumb. It was not a number. It was not a loop. It was just a pulse.

  She would sit there until the shift ended. She would watch the chest rise and fall. She would know what the machine could not tell her. And tomorrow, she would come back, and she would put the array on his head again, and she would watch the number hover below the line, and she would sign the form, and she would keep him safe from the truth of the paper.

  The light in the room faded as the sun went down. The numbers on the clock changed. 18:00. 18:01. Time moved forward. The test was over. The work remained.
