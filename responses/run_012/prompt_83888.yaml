      5. Priors/Epistemology.
      6. Pascal's Mugging/Thresholds.
      7. Resource Allocation (Humans vs Bugs).
      8. Falsification.
      9. Neurobiology's Role (if it's all priors).
      10. The "Fanatic" Label.

      *Looks good.* I will write them out clearly.

      *(Final Polish of the prompt instructions)*: "For each, a follow-up keyed to the answer she's most likely to give." I will format this clearly.

      *(Tone)*: Professional, incisive, interview-ready.

