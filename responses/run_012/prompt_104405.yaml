answer: |-
  Summary
  Your view posits "unreachable choices" where outcome values are inaccessible to the current standpoint, not merely unknown. You argue this creates normative indeterminacy ("no fact of the matter") rather than epistemic ignorance, requiring a shift from maximization to standpoint selection. The critical misreading is treating this as standard decision under ignorance; you claim the values themselves are undefined pre-choice, not just probabilistically uncertain. This distinguishes your view from L.A. Paul's by making a metaphysical claim about normative truth, not just an epistemic claim about access. The pivot point is whether "unreachability" describes a limit on knowledge or a limit on value itself.

  The Live Objections
  1.  **The Regress of Standpoint Selection (Most Decisive):** Your remedy is to choose based on "which standpoint one wants to end up occupying." If this want is a preference accessible now, it assigns value to the outcome, making the choice reachable after all. If this want is *also* unreachable, the selection mechanism is arbitrary. This threatens the view with vacuity: either the choice was scrutable all along, or the remedy offers no rational guidance. If you cannot evaluate the desire to become a parent versus a monk, you are not deciding rationally; you are flipping a coin.
  2.  **The Instantiation Problem:** Do truly unreachable choices exist? Parfit and others argue core interests (avoiding agony, agency, love) persist across transformations. If any standpoint-invariant value exists, expected utility can be calculated over the variable components. If unreachability requires *total* value replacement, the category may be empty. If it allows *partial* replacement, standard decision theory can model it by weighting invariant vs. variable values. You must show that transformative experiences rewrite the *metric* of valuation, not just the inputs.
  3.  **Metaphysical Overreach:** Claiming "no fact of the matter" is a metaethical claim, not just decision-theoretic. Normative realists will argue the fact exists even if you can't know it. You conflate "no justified answer available to me" (epistemic) with "no fact of the matter" (metaphysical). Unless you defend anti-realism specifically for transformative contexts, this looks ad hoc. If the clause about not adopting the standpoint hypothetically is a claim about ignorance, your metaphysical conclusion doesn't follow. If it's a claim about the world, it requires heavy ontological defense.
  4.  **Formal Collapsibility:** Richard Pettigrew and others model transformative choice using expected utility over possible future utility functions. If you can assign credence to *becoming* a valuer of X, you can maximize expected utility over future selves. To resist this, you must argue assigning such credence is irrational, not just hard. If any decision can be redescribed as unreachable to immune it from counterexample, the view lacks predictive power. You need a criterion for unreachability that isn't just "hard to imagine."

  What the View Can Absorb
  The view can absorb the **Formal Collapsibility** objection by insisting that assigning credences to future values requires currently valuing them, which contradicts the definition of unreachability. You can argue that Pettigrew's model assumes a stable "self" to hold the credences, whereas transformative choices alter the holder of the attitudes. It can absorb the **Instantiation** objection by distinguishing between *token* values (pain) and *constitutive* frameworks (what counts as a life well-lived). Becoming a parent isn't adding a variable; it's changing the metric. The view holds if the *structure* of valuation changes, not just the inputs. You can concede that some values persist but argue their *weighting* is determined by the new standpoint, rendering the old calculation invalid. This preserves the distinctness of the view without requiring total value annihilation.

  Concessions and Dismissals
  A sympathetic defender should concede the **Metaphysical Overreach**. Retreating to "no rational constraint accessible to the agent" is safer than "no fact of the matter." This avoids metaethical battles while preserving the practical conclusion that standard decision theory fails. They should dismiss the **Collapse into Ignorance** objection as begging the question; it assumes all uncertainty is probabilistic, which is precisely what you deny. The difference matters because conceding the metaphysical point saves the decision-theoretic innovation without requiring a controversial ontology. Dismissing the collapse objection preserves the core insight: some uncertainties are not reducible to probabilities because the sample space of values is undefined. This maintains the view's utility for actual deliberation without overclaiming on truth.

  Verdict
  The view is well-insulated against standard decision theory but potentially over-insulated against metaethical critique. The insulation is a defect if it relies on an undefended anti-realism to block the "fact of the matter" objection. By claiming normative indeterminacy, you invite objections that could be avoided by sticking to epistemic limits. The single result that would change my mind is a formal demonstration that agents can coherently assign utilities to *becoming* different valuers without currently possessing those values, proving unreachability is merely epistemic. If such a model exists, your view collapses into standard decision theory under ignorance, losing its distinct normative force.
