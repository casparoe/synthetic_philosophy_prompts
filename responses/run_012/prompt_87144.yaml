answer: |-
  ### 1. The address

  Graduands, families, and colleagues, congratulations. I acknowledge the warmth in this marquee; it is an apt metaphor for the pressure of what comes next. You leave us as mathematicians and computer scientists, trained in the rigorous business of making sense of patterns. Many of you sat through my lectures on inductive inference. You know that when the degrees were handed out, we relied on a list compiled by induction: past records suggested you had passed. It worked. But what does that success actually entitle us to hope for tomorrow?

  The Solomonoff–Kolmogorov picture of induction is often sold as a guarantee that the simplest explanation is the truest. I am not going to tell you that, because it is not what the theory says. There are three honours we must pay to the mathematics, rather than smooth them over for comfort.

  First, a claim that one explanation is simpler than another is meaningful only up to a constant that depends on the reference machine. In plain English: simplicity depends on the language you speak. If you change your universal Turing machine, the complexity of a hypothesis shifts by a fixed amount. For vast data, this constant washes out. For the short sequences of a human life, or a startup's runway, that constant matters. A small difference in description length means nothing on its own. You cannot claim victory merely because your model fits slightly tighter than your competitor's.

  Second, the universal prior is not computable. There is no algorithm that can perfectly calculate the probability of the next event based on all past data. Every practical appeal to simplicity you make in industry or research is an approximation with no guarantees attached. You are navigating by a map that cannot be fully drawn. You will use heuristics—regularisation, cross-validation, Occam's razor—but these are tools of survival, not proofs of truth.

  Third, and perhaps most strangely, a hypothesis positing something magical is not excluded by the theory at all if it is computable. It is merely outweighed. Consider the sequence: one, two, four, eight. Your families expect sixteen. You, the theorists, know 'powers of two' is a shorter program than 'Moser's circle divisions' on most standard machines. But the theory does not forbid the next number being fifteen. It simply bets against it. If the universe runs on spells, provided those spells follow rules, they are just complex code. They are in the mix.

  So, what are you entitled to hope? You are not entitled to believe the future will resemble the past. You are entitled to believe that betting on compressibility is the best strategy we have for agents who must act before certainty arrives. You go out into a world that owes you no coherence. You carry no shield of certainty. But you carry a method that respects the complexity of the world while refusing to be paralysed by it. Make your bets, mind the constants, and do not be surprised if the magic turns out to be real. Thank you.

  ### 2. What the theory licensed

  In constructing this address, I was entitled to reassure the graduands that their training constitutes a rational betting strategy. The theory licenses the claim that weighting hypotheses by description length is optimal for any computable environment. I could honestly tell them they are better equipped than those who guess randomly or rely on dogma.

  However, I had to trade away the standard academic reassurances that truth is asymptotic or that consistency yields correctness. I could not promise that the simplest model is the true one, nor that the future must resemble the past. Solomonoff induction converges only in the limit, and only if the environment is computable; neither condition is guaranteed in finite human time.

  In place of these guarantees, I offered epistemic courage. I replaced the promise of success with the validation of procedure. The address frames their education not as a key to unlock truth, but as a robust method for managing uncertainty. This honours the mathematics while acknowledging the precariousness of their upcoming careers. It allows the families to applaud their resilience, while the theorists recognise that I have not lied about the uncomputability of the prior or the invariance theorem's constant overhead.

  ### 3. Cuts if the marquee is too hot

  I would drop the opening sentence about the marquee's warmth being a metaphor, and the sentence beginning 'In plain English: simplicity depends on the language you speak.' The metaphor is expendable flourish, and the theorists know what a reference machine implies without the vernacular translation. These cuts save time without damaging the technical argument.
