          5.  Critique/Problem Exposure.
      *   *Key Nuance:* Ensure I distinguish between "logical contradiction" (A and not-A) and "practical contradiction" (the action becomes ineffective). Kant usually means the latter for CC.
      *   *Refining the Job Example:* Be careful not to just say "it's wrong." Analyze *why* it fails the test. Is it like the false promise? Yes, because it uses the employer's trust as a mere means while undermining the convention that makes the trust possible.
      *   *Critique:* The "empirical dependence" problem. Kant claims a priori, but universalization seems to depend on how the world works (e.g., would promising really vanish? or would we just use contracts?).

  7.  **Self-Correction/Review during drafting:**
