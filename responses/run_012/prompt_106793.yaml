          *   If she accepts: She cares about Puzzle/Expectation.
          *   If she rejects: She cares about Live Option/Anachronism (consistency with Aztec/11th C China).

  7.  **Address the Underdetermination/Principles (Task 5):**
      *   If she accepts 11th C China: She believes "Potential" is enough, even if context is missing. Risks teleology.
      *   If she rejects 11th C China: She believes "Contextual Possibility" is required. Industrialization requires a specific global conjuncture (18th C).
      *   Connection to Aztecs: Aztecs lacked the *global* context. 11th C China lacked the *global* context (Atlantic trade, etc.).

  8.  **Drafting the Response:**
      *   *Tone:* Academic, analytical, slightly conspiratorial (grad student solidarity), precise.
