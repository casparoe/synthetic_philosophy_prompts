      *   *Case 4 (Dutch/Britain):* Approved. Why? Dutch were richer/more advanced in many metrics *before* the Industrial Revolution. They *could* have done it, but didn't. It's a "puzzle" of divergence among peers.

  3.  **Brainstorm Candidate Rules (Task 1):**
