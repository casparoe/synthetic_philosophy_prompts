answer: |-
  This is a classic problem in historiographical methodology: distinguishing between a *puzzle* (something that demands explanation) and a *teleological trap* (imposing modern expectations on past actors). Your supervisor is acting as a gatekeeper against anachronism and monocausal determinism.

  Here is the reverse-engineering of her decision matrix, the prediction for the China pitch, and the test case to settle the debate.

  ### 1. Candidate Rules Consistent with Her Verdicts

  Based on the four data points, here are the three strongest candidate rules. They are jointly consistent with her track record but diverge on edge cases.

  **Rule A: The Counterfactual Viability Constraint (The "Live Option" Rule)**
  *   **Definition:** For a "Why X and not Y" question to be well-posed, outcome Y must have been a *historically plausible possibility* for the society in question at that specific time, given the global technological and economic conjuncture.
  *   **Fit:**
      *   *Britain/China (18th C):* Both had proto-industrial bases; industrialization was "in the air." (Pass)
      *   *Japan/Ottoman (19th C):* Both were actively attempting modernization/state-building in response to the same global pressure. (Pass)
      *   *Dutch/Britain (18th C):* The Dutch had the capital and tech; they *could* have switched to coal/steam but chose otherwise. (Pass)
      *   *Aztecs:* Industrialization was not a globally available technology or social form in 1500 Mesoamerica. It wasn't a "live option." (Fail)

  **Rule B: The Expectation Violation Constraint (The "Puzzle" Rule)**
  *   **Definition:** A question is well-posed only if there is a strong *prior reason* to expect Y would happen. The history must be surprising relative to the starting conditions.
  *   **Fit:**
      *   *Dutch:* They were the richest; we expect the richest to lead. (Pass)
      *   *China (11th C pitch):* They were "far ahead"; we expect them to continue leading. (Pass)
      *   *Japan/Ottoman:* Both were reforming empires; divergence is surprising. (Pass)
      *   *Aztecs:* There was no prior reason to expect an Aztec Industrial Revolution. (Fail)

  **Rule C: The Anti-Monocausal/Agency Constraint**
  *   **Definition:** A question is ill-posed if the phrasing invites a single geographic or resource-based determinant (e.g., "no coal") rather than institutional, cultural, or political explanations.
  *   **Fit:**
      *   *Aztecs:* Explicitly rejected for "pinning it on one missing input." (Fail)
      *   *Britain/China/Dutch/Japan:* These debates (Great Divergence, etc.) inherently invite institutional/comparative analysis (wages, states, property rights). (Pass)

  ### 2. Predictions for the "China 11th Century" Pitch

  The pitch is: *"Why did China fail to industrialise before Europe, given how far ahead it was around the 11th century?"*

  *   **Under Rule A (Viability):** **REJECT.**
      *   *Reasoning:* Industrialization (as a sustained, coal-driven, mechanized process) was not a "live option" globally in the 11th century. It required the Atlantic economy, the Scientific Revolution, and specific resource conjunctures that did not exist in 1050. This makes it functionally identical to the Aztec case (anachronistic expectation).
  *   **Under Rule B (Expectation):** **ACCEPT.**
      *   *Reasoning:* The Song Dynasty was technologically superior to Europe. The failure to sustain that lead is a massive puzzle. This fits the "Dutch" logic (ahead on metrics, didn't cross the line).
  *   **Under Rule C (Agency):** **CONDITIONAL ACCEPT.**
      *   *Reasoning:* Depends on the student's argument. If they blame "no coal near cities," she might kill it. If they blame "state examination systems," she might pass it. But the *question itself* doesn't force monocausality, so it likely passes this specific filter.

  ### 3. Best Guess at Her Actual Verdict

  **Verdict:** **She will reject the pitch as phrased, but invite a reframe.**

  **Why I'm betting this way:**
  The critical distinction lies between the approved "Britain vs. China" case and the new "11th Century China" pitch.
  *   The approved "Britain vs. China" question is universally understood in history departments as referring to the **Great Divergence (c. 1750–1850)**. In that window, Rule A and Rule B align: industrialization was a live option, *and* China was a peer competitor.
  *   The "11th Century" pitch invokes the **Needham Question**. While famous, serious economic historians often treat the 11th-century version with skepticism because it risks **teleology**. It assumes the "destination" (industrialization) was the natural goal of the Song Dynasty, rather than a specific, contingent outcome of the 18th-century Atlantic world.

  **The Trap:** By specifying "11th Century," the student has moved the goalposts into the "Aztec Zone." Your supervisor's comment on the Aztecs ("it wasn't a live option in the first place") is the smoking gun. She will argue that expecting industrialization in 1050 is as anachronistic as expecting it among the Aztecs.

  **What she'll say:** *"This is teleological. Industrialization wasn't a path available in the 11th century. Reframe this to the 18th century Great Divergence, or rephrase it as 'Why did the Song technological florescence not lead to sustained growth?' without using the word 'industrialise'."*

  ### 4. The Discriminating Case

  To separate **Rule A (Viability)** from **Rule B (Expectation)**, you need a case where there was a high *expectation* of success, but the *viability* of the specific outcome is historically dubious.

  **The Pitch:** *"Why did the Northern Italian City-States not industrialise in the 14th Century, given they had the banking, textiles, and technology of the Renaissance?"*

  *   **Rule B (Expectation) says: ACCEPT.**
      *   They were the richest, most advanced people in Europe. They had proto-capitalism. It is a puzzle why they didn't take the next step.
  *   **Rule A (Viability) says: REJECT.**
      *   Like the 11th Century Chinese, the 14th Century Italians lacked the global conjuncture (New World silver, Atlantic trade, specific coal/iron tech) that made industrialization a "live option" in the 18th century. It treats industrialization as an inevitable ladder rather than a historical event.

  **If she green-lights the Italian pitch:** She prioritizes **Rule B**. She cares about explaining puzzles of "lost leads," even if the end-goal is slightly anachronistic.
  **If she kills the Italian pitch:** She prioritizes **Rule A**. She is strictly policing against teleology and believes "industrialization" is a specific historical event (18th C), not a universal stage of development.

  ### 5. The Underlying Principles (If the Record Underdetermines)

  If you are unsure how she will rule on the China pitch, it is because her record leaves open a fundamental philosophical commitment about historical change. Here is what she is signing up for with each verdict:

  **If she ACCEPTS the 11th Century China pitch:**
  *   **Principle:** **Continuity of Potential.** She believes that "industrialization" is a latent capacity inherent in any complex, wealthy society. If you have the tech and wealth (Song China), you *should* have industrialized.
  *   **The Cost:** She weakens her objection to the Aztec case. If Song China (11th C) counts as a "live option," why isn't the Aztec Empire (which had complex markets and engineering)? She would have to argue that the Aztecs lacked the *internal* tech, whereas Song China had it. This risks sliding into "European Exceptionalism" (i.e., only Eurasians were capable of this potential).

  **If she REJECTS the 11th Century China pitch:**
  *   **Principle:** **Conjunctural Specificity.** She believes industrialization was not a "stage" everyone passes through, but a specific, unlikely accident of the 18th-century global system (coal + colonies + science).
  *   **The Cost:** She must admit that the "Britain vs. China" question is *only* valid for the 18th century. She cannot allow students to ask about "industrialization" in any other context. This limits the scope of dissertation topics significantly but protects against teleology.

  **My Advice:** Tell the student to change "11th Century" to "18th Century" or "Late Imperial Period." It keeps the "China vs. Europe" dynamic (which your supervisor likes) but moves it out of the "Aztec/Non-Event" danger zone. It's the safest path to approval.
