          *   Logic: There must be a strong prior reason to expect Y would happen (making the failure surprising).
          *   Fit: Dutch (richest, should have), China (ahead in 11th C/1700s, should have), Japan (Meiji reforms, succeeded). Aztecs (no reason to expect industrialization).
      *   *Rule D: The "Agency/Structure" Rule (Anti-Monocausal).*
          *   Logic: Cannot attribute failure to a single geographic/input factor (like coal). Must involve social/political/economic choices.
          *   Fit: Explains Aztec rejection explicitly ("pinning it on one missing input is bad history"). Britain/China/Dutch questions usually invite institutional/cultural explanations.

  4.  **Evaluate the Target Case (Task 2):**
      *   *Pitch:* "Why did China fail to industrialise before Europe, given how far ahead it was around the 11th century?"
      *   *Rule A (Live Option):* Was industrialization a live option in 11th Century China? *Debatable.* Song Dynasty had tech, but "industrialization" as a concept is anachronistic for 11th C. However, if interpreted as "Why the Great Divergence" (usually 1700s), it's yes. The pitch says "11th century." This is the trap.
      *   *Rule B (Peer Group):* 11th Century China vs. Europe? Europe was fragmented/feudal. China was unified/advanced. Are they peers? In terms of potential, maybe. In terms of structure, different.
      *   *Rule C (Puzzle):* High expectation ("given how far ahead"). Fits the "Dutch" logic.
      *   *Rule D (Agency):* Depends on how the student argues it. If they blame "no coal," she hates it. If they blame "state structure," she might like it. The pitch itself doesn't specify the cause, just the puzzle.

      *Refining the "11th Century" issue:* The supervisor approved "Britain vs. China" (usually implies 18th C divergence). The new pitch specifies "11th Century." This is the *Needham Question* variant.
