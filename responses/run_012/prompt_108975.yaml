      *   *The Mate's Claim:* Dismiss the idea that (1) is the problem. (1) is the definition of "real wealth" vs. "monetary wealth." Rejecting it leads to mercantilism.
      *   *The Real Problem:* The slide is at (8). Why? Because (8) contradicts (1). If wealth is power to command goods (1), printing tickets doesn't create goods. So (8) is false by definition of (1).
      *   *The Deeper Issue (The "Naive" Charge):* Where does the value come from? If not just belief, then what?
