          *   *Mate's view:* Money is a form of wealth (store of value).
          *   *Cost of rejecting:* You lose the distinction between nominal and real variables. You fall into the fallacy of mercantilism (hoarding gold = rich nation). *Verdict:* Keep (1). It's the most Berkeleyan and economically sound distinction (real vs. nominal).

      *   **Premise (6):** *Money's value is purely conventional, a self-referential matter of collective belief.*
