      *   If I reject (8): I admit the logic holds but the implication is wrong. This is basically saying "The conclusion contradicts the premise."

      *Decision:* The strongest philosophical move is to attack (6) and (7). The "convention" isn't free-floating. It's a *social technology* anchored by the state. This aligns with Berkeley's nationalism (Irish economic development) without conceding the mate's point about (1).

