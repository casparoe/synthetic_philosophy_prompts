answer: |-
  Here is the ranking of the five accounts, ordered from best to worst fit for the specific phenomenon of the jazz pianist you describe.

  **1. Account 4 (Embodied/Tacit)**
  This is the strongest fit. It explicitly accommodates the "know more than we can tell" aspect of your character and explains why conscious attention disrupts performance: if the skill is a non-representational, perceptual-motor flow, introducing a representation (thinking about the hands) interrupts the circuit.

  **2. Account 2 (Distinct/Practical)**
  This ranks highly because it validates the pianist's fluency as a genuine form of knowledge without demanding it be translatable into language. It protects the "exactness" of her skill from being dismissed as mere instinct, while avoiding the requirement that she be able to articulate a method.

  **3. Account 5 (Two-Factor)**
  This is a plausible middle ground; it accounts for the "hard-won" nature of her skill (the propositional grasp acquired during learning) alongside the necessary motor attunement. However, it struggles to explain why the propositional element must recede entirely during performance, as your character's breakdown under scrutiny suggests the proposition cannot be active in the moment.

  **4. Account 3 (Disposition/Ability)**
  This account is logically consistent with her behavior but is too thin for your literary purpose. By reducing "knowing how" to mere ability, it denies the richness of her inward life, offering no framework for the *experience* of fluency, only the observation of it.

  **5. Account 1 (Intellectualist)**
  This is the poorest fit. It posits that skill is fundamentally the entertainment of a proposition ("knowing that"). This contradicts the character's inability to articulate her method and, more critically, cannot explain why attending to that very knowledge (the "how") causes her performance to collapse.

  ***

  ### Which accounts does this case positively tell against?

  Your case **positively tells against Account 1 (Intellectualism)**.

  The phenomenon you describe contains two specific constraints that function as counter-evidence to the Intellectualist view:
  1.  **The Articulation Constraint:** If knowing how were simply knowing a proposition (plus the ability to apply it), the barrier between the knowledge and its articulation should be porous; the persistent inability to describe the method suggests there is no proposition there to be found.
  2.  **The Reinvestment Constraint:** The fact that she plays *worse* when attending to her hands is the decisive blow. If execution relied on a propositional guide, conscious attention to that guide should stabilize or improve performance. The degradation of skill under self-monitoring (often called the "centipede effect" or "reinvestment" in sports psychology) indicates that the control structure of her skill is *not* propositional.

  **Account 5 (Two-Factor)** is also significantly strained by this case, though not necessarily falsified. It survives only if you argue that the "propositional grasp" is entirely dormant during the actual performance, which raises the question of in what sense it is a constituent of the skill *in the moment*. Account 3 is not told against, but merely leaves the novelist unsatisfied; Account 2 and 4 remain robust.
