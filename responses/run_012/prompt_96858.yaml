      *   **The "Shut Down" Analysis:** Identify which interpretation the first person was actually using.
      *   **The "Collapse" Analysis:** Explain the relationship with the cluelessness argument.
      *   **Conclusion:** A brief summary for the user to take back.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Refining Interpretation 1 (Empirical):* Focus on the causal link. Do good intentions *cause* bad results? Usually, it's incompetence or side effects, not the intention itself. Verdict: False.
      *   *Refining Interpretation 2 (Moral):* Focus on moral worth. Does intention count? Consequentialists say no. Verdict: Substantive (but question-begging against non-consequentialists).
      *   *Refining Interpretation 3 (Epistemic):* Focus on prediction. We intend X, get Y. Verdict: Substantive, but links to cluelessness.
      *   *Refining Interpretation 4 (Opportunity Cost - The EA Special):* This is crucial. In EA, "Hell" is the *counterfactual*. If you could save 10 lives but save 1, the 9 lost lives are the "hell." Verdict: Substantive (This is the real EA argument).

      *   *Wait, I need to make sure I answer the specific prompt constraints:* "trivial, substantive, false" for verdicts.
