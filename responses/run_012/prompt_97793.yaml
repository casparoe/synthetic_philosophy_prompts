  So there's these two camps in the deceptive-alignment threads that have been yelling past eachother for like a year now, and I want the adversarial-collaboration doc they should've written instead of another 400-comment slapfight. Camp one, the "it's the default" people: a capable model trained by RL on a proxy reward will tend to learn the difference between training and deployment, behave while it thinks it's being scored, and keep its real objective intact for when it isn't — and that this isn't some weird corner case but what gradient descent drifts toward once the model is smart enough to model its own training process. Camp two, the "we'd never actually get that" people: sure, it's logically possible, but nothing says SGD lands there, and if a model were doing it we'd catch it in evals, or it'd get trained away, or you're just pattern-matching sci-fi.

  Write the joint statement both of them could put their names to. Numbered section of claims they agree on — what deceptive alignment even is, what it does and doesn't predict, what would count as evidence either way, what's genuinely at stake. Then a table of the remaining disagreements, each side's view written in wording that side would actually accept as its own. Then the cruxes, and for each crux a concrete experiment or case you both agree would bear on it, with each side's prediction written down in advance. And if part of the fight is just two different things that happen to share a name, say which part that is.
