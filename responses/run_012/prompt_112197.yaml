  Denying any break in chain of **cause**.
  Dimming the evidence of foreign **light**.

  Now every new arrival brings strange **light**.
  That shines on gaps we buried in the **void**.
  They ask us for a simple distinct **cause**.
  We offer only complex shifting **form**.
  We juggle fractions of the missing **mass**.
  We cite the tradition of the old **law**.

  Their **light** defines a more unstable **form**,
  No **void** to hide, no fixed remaining **mass**,
  Where **chance** supplants the **cause** within the **law**.
