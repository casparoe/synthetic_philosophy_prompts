answer: |-
  The term you are looking for is **the Phantom Revival**.

  While "invented tradition" (Hobsbawm) is the genus, it is too broad for your specific case. Hobsbawm's category includes things like the ceremonial opening of parliament or the rituals of the British monarchy—practices that were engineered for social cohesion, often recently, but which do not necessarily rely on a *lie about a specific historical loss* to function.

  Your case is more specific. It is a tradition that legitimizes itself not just by claiming antiquity, but by claiming a **narrative of rupture and recovery** where the "rupture" is fabricated and the "recovery" is actually a creation. The antecedent custom is a phantom limb: the community feels its absence, mourns it, and "restores" it, but the limb was never there to begin with.

  Here is the breakdown of why this term fits, how it differs from the concepts you listed, and why the "all traditions are invented" counter-argument fails.

  ### 1. The Verdict: "The Phantom Revival"

  I am coining/refining this term because the existing literature treats "revival" and "invention" as distinct, when your case shows them fused.
  *   **Invented Tradition:** "We are starting this new ritual to bind the community." (Honest engineering).
  *   **Genuine Revival:** "This ritual died in 1850; we found the notes and are restarting it." (Historical continuity).
  *   **Phantom Revival:** "This ritual died in 1850; we are restarting it." (When in fact it never existed in 1850, and the "notes" were written in 1925).

  The "Phantom" captures the specific ontology of the lost object: it is a ghost generated by the very act of mourning it. The "Revival" captures the mechanism: the invention is disguised as a restoration.

  ### 2. Differentiation from Related Concepts

  **(a) vs. Plain Old Invented Tradition (Hobsbawm)**
  Hobsbawm's "invented traditions" are often *open secrets* among elites (e.g., a monarchy knows its coronation rites were tweaked in the 19th century). The goal is *socialization*.
  In a **Phantom Revival**, the goal is *authentication*. The invention *requires* the lie of the gap to work. If the locals admitted, "We made this up in 1920," the tradition loses its authority. In a standard invented tradition, admitting "We designed this to bring us together" might actually *strengthen* its function. In a Phantom Revival, that admission destroys it.

  **(b) vs. Imagined Community (Anderson)**
  Anderson is about the *macro* scale (nations) and the *medium* (print capitalism). A Phantom Revival is *micro* (a village festival) and *performative* (costume, dialect). Anderson explains *why* people feel connected to strangers; the Phantom Revival explains *how* a specific local practice claims the authority of the deep past to justify that connection.

  **(c) vs. Heritage Industry / Invented Nostalgia**
  The heritage industry (Lowenthal, *The Past is a Foreign Country*) is the *economic engine*. It sells the Phantom Revival. But you can have a heritage industry selling genuine history (e.g., a battlefield tour). The Phantom Revival is the *myth structure* being sold. It is the specific narrative content ("We lost this, now we have it back") rather than the commercial container.

  **(d) vs. Genuine Revival**
  This is the critical boundary. A genuine revival (e.g., the Hebrew language, or the Morris dancing revival in England) acknowledges the gap. It says, "We stopped doing this, and we are trying to reconstruct it from fragments." It admits uncertainty.
  A **Phantom Revival** admits no uncertainty. It claims *continuity through the gap*. It asserts that the 1920s version *is* the 1820s version, merely sleeping. When you point out discrepancies, a genuine revivalist says, "We know, we're doing our best." A Phantom Revivalist says, "You just don't understand the deeper truth."

  ### 3. The "All Traditions Are Invented" Move: Why It Flattens

  When the tourist board says, "Christmas trees were invented too, so what's the difference?", they are committing a **category error regarding the function of the lie.**

  They are equivocating on the word "invented."
  1.  **Hobsbawm's Sense (Constructive):** All social practices are constructed over time. Handshakes, languages, and nations evolve and are codified. This is a statement about *genealogy*.
  2.  **The Local's Sense (Deceptive):** "Invented" means "fake" or "illegitimate."

  The Phantom Revival is distinct because it relies on **Fabricated Discontinuity**.
  *   **Christmas Trees:** Evolved from German customs, spread, were commercialized. No one claims they were practiced by Caesar. The "invention" is gradual evolution.
  *   **Phantom Revival:** Relies on a specific, falsifiable historical claim ("This died in 1880 and we found it").

  The "flattening" move ignores the **epistemic violence** of the Phantom Revival. It erases the actual history of the village (what they *actually* did in 1880) and replaces it with a fantasy. It's not just that the tradition is new; it's that the *history of the place* has been overwritten to accommodate the tradition. The "All traditions are invented" argument defends the *practice*; it does not defend the *falsification of history* required to sustain the Phantom Revival.

  ### 4. Boundary Cases: When does it stop being a Phantom Revival?

  You mentioned that "now nobody remembers the founders... there's no cynicism left." This is the transition point.

  *   **Phase 1: The Fabrication (1920s).** The schoolteacher invents the custom and the story of loss. This is the **Phantom Revival** in its active state.
  *   **Phase 2: The Sedimentation (Present).** The founders die. The story is believed.

  Does it stop being a Phantom Revival? **No.** It remains a Phantom Revival *genealogically*, even if it functions as "Tradition" *sociologically*.
  *   **Why it matters:** If you treat it as "just tradition" now, you validate the falsified history.
  *   **The Boundary:** You stop calling it a Phantom Revival only when the community *integrates the truth* into the myth (e.g., "We know Grandpa made this up in 1920, but it feels old to us now"). Until they acknowledge the 1920s origin, the *structure* remains a Phantom Revival, regardless of how sincere the belief is. Sincerity does not cure the fabrication.

  ### Summary Verdict

  Call it a **Phantom Revival**.

  It distinguishes the *mechanism* (fake loss/fake recovery) from the *outcome* (social cohesion). It allows you to acknowledge that the tradition is now "real" to the villagers (it has social force) without validating the historical lie (the phantom antecedent). It gives you the vocabulary to say: "This is a valid community practice, but it is a Phantom Revival, not a continuous custom, and pretending otherwise erases the actual history of what your grandparents did in 1920."

  That is the distinction the "all traditions are invented" argument tries to blur. Don't let them.
