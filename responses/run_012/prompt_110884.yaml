      *   *Vertebrate Exception:* This is the crack in the purely economic armor. The mouse in the shed is likely a cost (damage to stock), yet she agonizes. This suggests a deontological constraint (don't kill vertebrates lightly) that overrides the economic calculus for mammals/birds, but not for bugs.

