answer: |-
  Your aunt's gardening ethics aren't based on a single philosophical rule, but rather a hybrid system we might call **Tiered Instrumentalism**. This view divides the living world into categories that receive different kinds of moral consideration based on their biological relationship to humans and their economic utility.

  For the invertebrates (aphids, slugs, caterpillars, ladybirds), the theory is **Pure Instrumentalism**. These creatures have no moral standing of their own; their value is entirely determined by their impact on the garden centre's balance sheet. The "economic threshold" rule confirms this: a pest is tolerated only as long as it is cheaper to ignore than to kill, and a beneficial insect is protected only as long as it saves more money than it costs. If the ladybirds started eating the stock, they would instantly switch from "protected allies" to "pests," proving their value is purely functional. This rules out any view that suggests all life has intrinsic worth (biocentrism) or that feeling pain grants rights (sentientism), at least within the insect world.

  However, for vertebrates (mice, birds, cats), the theory shifts to **Taxonomic Intrinsic Value**. Here, the economic calculus is suspended or heavily weighted. She agonizes over the mouse even if it damages stock, and she grieves for the bird even though it was eating free seed. This suggests she believes mammals and birds have a right to exist or a capacity for suffering that matters regardless of their financial impact. This part of her ethics rules out pure anthropocentrism (where only humans matter) and pure economic utilitarianism (where everything is priced).

  The system is effectively two different theories glued together by a biological boundary: vertebrates get moral status based on *what they are*, while invertebrates get moral status based on *what they do*. This creates a point of **underdetermination** regarding the bees. When she sprays in the evening to spare them, is she treating them like vertebrates (protecting them because they matter) or like ladybirds (protecting them because they are useful assets)? The practice looks the same either way, but the ladybird example suggests it's the latter: bees are living tools, not neighbours.

  Regarding your question on **bolting sentience onto the threshold**: this is nearly impossible without breaking the system. The economic threshold works because it treats damage as a fungible commodity (money). If you admit insects feel pain, you introduce a moral cost that cannot be easily converted into cash. To make it coherent, the threshold would need to change from "cost of damage vs. cost of spray" to "cost of damage + cost of suffering vs. cost of spray." Since her current logic assigns insect suffering a value of zero, taking pain seriously would require abandoning the economic threshold entirely, not just adjusting it.

  Ultimately, the practice holds together pragmatically because it matches cultural norms and legal standards (which also privilege vertebrates), but it lacks ethical coherence. It relies on an arbitrary line drawn between backbones and exoskeletons to decide who counts and who gets counted.

  Bottom line: Her practice presupposes a tiered moral framework that assigns intrinsic value to vertebrates and purely instrumental value to invertebrates, which functions pragmatically but lacks ethical coherence because it relies on an arbitrary biological distinction that cannot accommodate insect sentience without abandoning its economic calculus.
