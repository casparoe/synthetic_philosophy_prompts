prompt: |-
  ok so my friend and i just had a two-hour argument about the toxin puzzle and i cant tell anymore whether we actually disagree or whether we're just using "intend" in two seperate senses. i want to settle it with a quiz instead of another fight, so: build me a decision tree / sorting quiz that takes someone from what they say about a handful of concrete cases to a named position on the puzzle.

  the thing we kept tripping over is whether intending is something you can *do* — whether forming an intention is an action you perform at will, like raising your arm, or more like a belief you cant just adopt by deciding to. my friend thinks it's the arm; i think it's closer to the belief. every time we tried to test it we grabbed a different version of the case and ended up talking past each other, so the quiz has to run on the variants, not on the one canonical setup.

  heres the angle. dont build it around the labels (causalist, evidentialist, "the puzzle is dissolved") — build it around the cases and let the labels fall out at the leaves. every branch node should be a question a person can answer without already knowing where it leads. stuff like:

  - the money is paid tonight on the strength of your intention, the toxin is offered tomorrow, and you can just walk away. can you intend tonight?
  - same setup, but the toxin is only a bad headache rather than a day of violent illness — does severity change anything, or is it only the fact that the payoff is already banked?
  - same setup, but the reward is $50 instead of $1M. does the size matter, or only the fact that it's already yours?
  - the billionaire doesnt read your mind — she predicts your intention from a brain scan, or from a lifetime of your behaviour. does the prediction mechanism matter?
  - you're allowed to sign a binding contract tonight that you'll drink tomorrow and you cant wriggle out. does that make it easy — and if so, is that still the same puzzle, or a different one?
  - you can take a pill tonight that wipes your memory of the deal, so tomorrow you'll drink thinking you have to. is engineering your own future psychology a way of intending?
  - the variant my friend swears is the real one: you dont have to *decide* anything tonight, you just have to find yourself, at midnight, with the intention. is having an intention something that can happen to you rather than something you do?
  - the toxin would actually kill you, but you've been told — falsely, and you believe it — that it's the mild one.

  each leaf should be a position with a name (or "unnamed" if nobody actually defends it) plus one line on its most awkward commitment. i want these leaves reachable if theyre genuinely distinct: (1) you simply cant intend it, and the puzzle shows intention isnt under the will; (2) you can intend it only indirectly, by making yourself into the sort of agent who would drink; (3) the puzzle is a trick about the timing of reasons and shows nothing interesting about intention; (4) it's a counterexample to causal decision theory and a smarter decision theory just collects the money; (5) the whole thing collapses once you notice "intend" is doing two jobs (intending to drink vs intending to intend).

  also flag any two leaves your tree cant actually pull apart — my friend and i burned an hour on a distinction that might have been fake, and i'd like to know if thats what happened.

  keep it to maybe 8-12 nodes and skip the reading list, i just want the tree.
