prompt: |-
  I've somehow ended up running the discussion section for the intro course next week, and the reading is the butterfly passage at the end of the second chapter of the Zhuangzi — you know the one, he wakes up and can't tell whether he was a man who'd been dreaming of being a butterfly or is now a butterfly dreaming of being a man. The students did Descartes' dream argument with the other TA the week before and I'm almost certain they're going to walk in saying 'it's the same thing but with a butterfly', and I've got seventy minutes to stop them leaving with that. To be clear I don't want you to explain the passage to me; I've read it, and the reading I want to get them to is roughly this — the doubt in it isn't about evidence at all, he never asks how he could know this isn't a dream, he asks which of the two he is, and then the last line goes and puts a distinction back in place rather than dissolving everything into one mush, which is the bit everybody forgets because it doesn't fit the 'wise old mystic' picture. So: plan the session for me. What order do the pieces have to come in, and why does each one have to land before the next can, given that Descartes is fresh in their heads and I'm pretty sure spending more than five minutes on him is a trap. Then the example that carries the whole thing — I keep going back and forth between building a case myself and just leaning on ordinary dreaming, and a friend in the cog sci department keeps pushing the rubber hand illusion on me, which I suspect teaches them something true but not this. Tell me what the carrying example needs to have that the rubber hand one doesn't, and whether I should use the illusion anyway as a foil.

  The misconceptions — I've already got 'Descartes with a butterfly', 'it's saying everything is one and distinctions are fake', 'it's a poem about freedom or about dying', and 'the upshot is you can't know so it doesn't matter', but tell me the order they'll actually surface in, where in the sequence I should head off each, and any I've missed that are likelier than the ones I listed. Also tell me what to cut at this level and say so out loud — I'm thinking the surrounding business with the monkey-keeper and the chestnuts and the whole this/that relativity thing, which I love, but which I think will eat the entire session if I let it. And I want one closing question that actually tells me whether they've got it rather than just nodding along, something they can't answer by parroting the butterfly image back at me. I had a half-idea about lucid dreaming for this — the thought being that a lucid dreamer who knows perfectly well she's dreaming still hasn't answered the question the passage is asking — but I'm not sure that's fair either to the passage or to lucid dreaming, so tell me straight whether that's a good probe or whether I'm fooling myself.
