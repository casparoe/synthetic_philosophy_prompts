      *   *Requirement:* It needs to show *ontological fluidity* without *epistemic anxiety*. RHI fails because it triggers "my hand isn't real." Ordinary dreaming fails because it triggers "this isn't real."
      *   *Recommendation:* Don't use RHI. It distracts into neuroscience/skepticism. Use the **Actor/Role** analogy *carefully*, or better, stick to the text but force the "Transformation" reading. Actually, the best foil is **Sleepwalking** or **Fever Dream**? No.
      *   *Best approach:* Acknowledge the RHI friend is wrong for *this* specific point. RHI is about *perception*, Zhuangzi is about *being*. I will advise against RHI as the carrier, maybe use it as a 2-minute contrast if needed, but the "Carrying Example" should be the Butterfly itself, re-interrogated.
