      *   *Significance:* This is the smoking gun. If she believed life was fundamentally about information replication and Darwinian evolution (the NASA working definition: "a self-sustaining chemical system capable of Darwinian evolution"), she would have to call the RNA alive. By rejecting it, she is explicitly stating that **replication is not sufficient for life.**
      *   *Corroborating Evidence:* She rejects viruses and giant viruses, despite the fact that they evolve rapidly. She calls them "borrowed machinery."

  *   **She rejects the "Thermodynamic" View (Entropy Definition).**
      *   *Evidence:* She says fire and salt crystals are **not alive**.
