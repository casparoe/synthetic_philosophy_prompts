prompt: |-
  Okay, I need a runnable in-class game for my philosophy of science seminar — 14 students, upper-level, one 80-minute block — and I want the rules to do the teaching for me. The target is the cluster of ideas around "it's really just atoms / neurons / bits" being simultaneously true and explanatorily worthless, and around the fact that whether a reductive explanation is good has nothing to do with how far down it reaches. Dennett's crane/skyhook thing and greedy reductionism, basically, but please dont name either of those anywhere in the activity itself. They should walk into the wall on their own; the names come out in the debrief and not before. Also skip the "nothing but" phrase in any rules or handouts.

  Here's the shape I have in mind, build it out or improve it: four teams of 3-4. Each team gets a phenomenon to explain, and I want to use my own four so they can't coast on stuff they've read:
  1. a flock of starlings banking as one bird;
  2. why a particular chess opening was treated as sound around 1960 and unsound by the 1990s;
  3. three jazz players converging on a tempo together without anyone counting it off;
  4. why my department's photocopier joke is funny to us and not to anyone else.

  Mechanic I'm picturing: each team builds a chain of cards from some low base level up to their phenomenon. A card only counts if the team can name the parts one level down and the process that puts them together into the level above — otherwise it's either a "hook" card (allowed, does the work, but can't be taken apart) or an honest gap. Rival teams get to challenge any link by asking for the bridge, and a link that can't survive the challenge gets pulled. Now the trap I want baked in: give a real scoring bonus for parsimony, so the cheapest-looking move is to collapse the whole chain into one bottom card and declare victory. They should be genuinely tempted by that, take it, and then discover what happens when it gets challenged. I want them to feel the seduction before they see the bill.

  Then the debrief, which is where I do the naming: map each moment of the game onto the actual distinction, and be straight with me about what the game can't reproduce — I already suspect it makes every collapse look like cheating when sometimes the collapse is just correct (temperature really is mean kinetic energy and that's not a cheat), so tell me how to handle that honestly rather than pretending the game settles it. Also tell me what predictably goes wrong the first time I run it and what I should do in the moment.

  Give it back to me as a JSON object, please, with exactly these fields:
  - "title": string
  - "students": string (who they are and how many)
  - "minutes": number
  - "materials": array of strings
  - "setup": array of strings (what I do before they start, in order)
  - "rules": array of strings (the game rules as I'd read them aloud)
  - "scoring": object with keys "per_link", "parsimony_bonus", "hook_penalty", "challenge_outcome" and a string value for each
  - "timeline": array of objects with keys "start_min", "end_min", "phase", "facilitator_does", "students_do"
  - "debrief": array of objects with keys "moment_in_game", "concept_it_maps_to", "facilitator_prompt"
  - "predicted_failures": array of objects with keys "what_happens", "what_to_do"
  - "cannot_reproduce": string (the feature of the idea the game can't stage, and how I have to supply it verbally)
  - "naming_moment": string (exactly when and how the real terms get introduced)

  Keep the rules tight enough that I can run it without rereading them mid-session.
