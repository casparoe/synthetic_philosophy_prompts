prompt: |-
  Alright, I need help building something and I'd rather you think it through properly than wing it, so here's the job. Your role: you're a philosopher of social science who has spent a lot of time in the measurement literature on violence and who knows the long-run-trend debate from both sides, and you're also the person a nervous analyst calls when they suspect the question they've been handed isn't answerable. Start by brainstorming — actually spend some space on it — listing the different things people could mean by "violence" and what each one does to a trend line, before you commit to anything. Then give me the procedure.

  Context: I'm a research analyst at a small policy shop that puts out an annual "state of the world" report, and this year I've somehow ended up with the violence chapter. We have three internal series and they do not line up. (1) A homicide series from a public health database, by country, 1990 to present, which counts intentional injury deaths and includes a category for killings by police. (2) A conflict-deaths series a partner org gives us, 1946 to present, battle deaths plus civilians killed in conflict, with a methodology break in the mid-nineties that nobody can fully explain to me. (3) A "state violence" series our own team compiles from press reports covering about forty countries, very uneven, we don't really trust it. My director wants a headline for the press release: something like "violent deaths per person are down X% since 1990." I suspect we can't say that, or that if we can, it won't mean what the headline will make people think.

  What I need from you: a decision procedure I can actually run, that a junior analyst with no philosophy training could follow, about a page or two, plus a 10-minute version for the press office. It should be a set of questions in order, what counts as a sufficient answer to each, where the procedure just stops and says no we don't publish a number, and where it has to be handed to a person — me, or the director, or a methodologist — because it's a value question wearing a lab coat. For each step tell me whether it's a factual question, a convention we're choosing, or a straight-up value judgement. Constraints: six weeks, two of us, no new data collection, the director signs off on the headline, and the press office will strip whatever we write down to one sentence.

  Then run it on three cases and show your work: (a) a country where homicides per 100,000 fell but total homicides rose, and where there's also an insurgency, so the conflict series and the homicide series are both counting some of the same dead people; (b) famine deaths caused by a blockade — no bullets, deaths by omission, and our series have nowhere to put them; (c) whichever case your procedure handles worst. At least one of the three should come out in a way I won't like — I'd rather find out from you than from a reviewer.

  Two things you don't get to dodge. First, someone on the team keeps insisting that "violence" is a thick ethical concept, i.e. that calling something violence is already a value judgement and not just a description, and I can't refute it, and if it's true my whole chapter is normative rather than empirical. Take a position on that and tell me what it implies for how we word the report. Second, the fact-of-the-matter question: is there a fact about whether violence is declining, independent of the choices we make about what to count and what to divide by? Pick a line, defend it, and tell me what it means for the caveats. Also say something useful about absolute numbers versus per-capita rates — what each is good for, what each misleads about, and the denominator mess (per person, per adult, per person-year-at-risk, prisoners and refugees who aren't in the census). Finish with what the procedure can't do, and give me the exact sentences the report should carry as caveats. Don't hedge everything — where you have to choose, choose and say why.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Role:** Philosopher of social science + measurement expert on violence + long-run trend debate expert + advisor to nervous analysts.
      *   **Task:** Create a decision procedure for a policy shop analyst trying to produce a headline about global violence trends ("violent deaths per person are down X% since 1990") given three conflicting data series.
      *   **Constraints:** 6 weeks, 2 analysts, no new data, director signs off, press office simplifies to one sentence.
      *   **Deliverables:**
          1.  Brainstorming on definitions of "violence" and their impact on trends.
          2.  A decision procedure (1-2 pages, usable by a junior analyst).
          3.  A 10-minute version for the press office.
          4.  Run the procedure on three specific cases (a, b, c).
          5.  Address the "thick ethical concept" argument.
          6.  Address the "fact-of-the-matter" question (is there a real trend independent of measurement?).
          7.  Address absolute vs. per-capita rates and denominator issues.
          8.  Provide exact caveat sentences.
          9.  Tone: Direct, no hedging where choices are needed, acknowledge limitations.

  2.  **Deconstruct the Problem:**

      *   **The Core Tension:** The director wants a clean narrative ("Violence is down"). The data is messy, inconsistent, and conceptually fraught. The analyst suspects the question isn't answerable.
      *   **The Data:**
          1.  Homicide (Public Health, 1990+, includes police killings).
          2.  Conflict Deaths (Partner Org, 1946+, methodology break mid-90s).
          3.  State Violence (Internal, press reports, 40 countries, uneven).
      *   **The Philosophical Issues:** Definition of violence (direct/structural/negative/positive), measurement validity, ethical loading of terms, ontological status of trends.

  3.  **Step 1: Brainstorming "Violence" and Trend Lines:**

      *   *Direct Physical Violence:* (Homicide + Battle deaths). Trend: Likely down (Pinker thesis). *Issue:* Excludes structural violence.
      *   *Legal/State Violence:* (Police killings + War). Trend: Volatile. *Issue:* Legitimacy bias (state killing isn't always counted as violence).
      *   *Structural Violence:* (Famine, preventable disease due to policy). Trend: Maybe down (development), maybe up (inequality). *Issue:* Hard to measure, often excluded from "violent death" counts.
      *   *Psychological/Symbolic Violence:* (Threats, coercion). Trend: Unknown. *Issue:* Not in mortality data.
      *   *Impact on Trend:* Broadening the definition usually makes the trend *less* clear and often *less* optimistic. Narrowing it (just battle deaths) makes it look more optimistic but less meaningful to lived experience.

  4.  **Step 2: Developing the Decision Procedure:**

      *   Needs to be a flowchart or step-by-step logic.
      *   Must distinguish Fact, Convention, and Value.
      *   Must have "Stop" points (Go/No-Go).
      *   *Step 1: Conceptual Alignment.* (Value/Convention). Do the series measure the same thing?
      *   *Step 2: Data Integrity.* (Fact). Are the breaks explainable?
      *   *Step 3: Aggregation Logic.* (Convention). How to combine?
      *   *Step 4: Denominator Choice.* (Convention/Value). Per capita vs. absolute.
      *   *Step 5: The Headline Test.* (Value). Does the simplification lie?

  5.  **Step 3: The 10-Minute Press Version:**

      *   Simplify the procedure into "Green Light/Red Light" criteria.
      *   Focus on risk management.

  6.  **Step 4: Running the Cases:**

      *   *Case A (Homicide down rate, up total + Insurgency overlap):* Highlights the denominator trap and double-counting. Result: No-Go on aggregate.
      *   *Case B (Famine/Blockade):* Highlights the definition trap. Result: Excluded, but must be noted as a limitation.
      *   *Case C (The Procedure's Failure):* Maybe a case where data is *too* good, masking a conceptual error. Or a case of "Structural Violence" masquerading as peace. Let's choose "The Peace of the Prison." High incarceration lowers street homicide but increases state violence. The procedure might miss the trade-off.

  7.  **Step 5: Addressing the Philosophical Hard Questions:**

      *   *Thick Ethical Concept:* Yes, "violence" is thick. It implies illegitimacy. *Implication:* We must specify "lethal interpersonal and organized conflict violence" rather than just "violence."
      *   *Fact-of-the-Matter:* No, there is no theory-independent fact. Trends are functions of measurement choices. *Implication:* Caveats must admit the construction.
      *   *Absolute vs. Per Capita:* Absolute = burden on systems. Per Capita = individual risk. Denominator issues (refugees) bias per-capita downward in crises.

  8.  **Drafting the Content - Section by Section (Iterative refinement):**

      *   *Tone Check:* Needs to be authoritative but empathetic to the analyst's plight. Not academic waffle, but rigorous practicality.
      *   *Procedure:* Make it actionable. "If X, then Stop."
      *   *Cases:* Ensure one outcome is unpleasant (e.g., "We cannot publish the headline").
      *   *Caveats:* Write them exactly as they should appear.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "it's impossible." The director wants a headline. I need to give a path to a *responsible* headline, even if that headline is "Violence is down *by this specific measure*." But the prompt asks me to say where the procedure stops and says "No." I will prioritize integrity over compliance. If the data doesn't support the headline, the procedure must kill the headline.

      *(Refining the "Thick Concept" point)*: If violence is thick, calling a state execution "violence" is a political act. Calling it "law enforcement" is also a political act. I need to take a line. I will argue that for *measurement*, we must treat it as a thin concept (physical harm) but label it as such, acknowledging the normative exclusion.

      *(Refining the "Fact-of-the-Matter")*: I will argue against Platonic realism about violence trends. The trend is a property of the *dataset*, not the world directly.

  9.  **Final Review against Constraints:**

      *   Did I brainstorm definitions first? Yes.
      *   Is there a decision procedure? Yes.
      *   Is there a 10-min version? Yes.
      *   Are the three cases run? Yes.
      *   Did I address the thick concept/fact-of-the matter/absolute vs per capita? Yes.
      *   Are there exact caveat sentences? Yes.
      *   Is it roughly the right length/depth? (Aim for comprehensive but dense).

  10. **Final Polish:** Check the voice. "Philosopher of social science" means precise distinctions. "Measurement expert" means knowing where data breaks. "Advisor" means protecting the analyst.

  *(Self-Correction on Case C)*: The prompt asks for "whichever case your procedure handles worst." I need to identify a blind spot in my own procedure. A good candidate is "Slow Violence" (environmental degradation) or "Cyber Violence." Let's go with "Slow Violence" because it fits the mortality focus but breaks the time-scale. Actually, the prompt asks me to run the procedure on it. So I need a case where the procedure gives a confident answer that is *wrong*. Let's use "The Pacification by Incarceration" case. The procedure sees lower homicide, misses the state violence shift.

  *(Wait, re-reading prompt)*: "At least one of the three should come out in a way I won't like." Okay, I will ensure Case A or B forces a "No Publish" decision, which the analyst won't like because they need a chapter. Or Case C shows the procedure fails. I'll make Case A the "No Publish" result.

  Let's assemble.

  *Structure:*
  1. Brainstorming: Definitions & Trends.
  2. The Decision Procedure (The "Meat").
  3. The 10-Minute Press Version.
  4. Running the Cases (A, B, C).
  5. Philosophical Hard Questions (Thick Concept, Fact-of-Matter, Denominators).
  6. Exact Caveats.

  *Voice:* Professional, direct, slightly weary but rigorous.

  *Key constraint:* "Don't hedge everything — where you have to choose, choose and say why." I will take a hard line on the "Fact-of-the-Matter" question.

  *Let's write.*
answer: |-
  ### Part 1: Brainstorming — What Do We Mean by "Violence"?

  Before we touch the data, we must acknowledge that "violence" is not a natural kind like "gold" or "oxygen." It is a classification we impose on the world. Different definitions yield different trend lines. If you change the definition, you change the truth value of the headline.

  1.  **Direct Interpersonal Violence (Homicide):**
      *   *Definition:* One human intentionally inflicting lethal physical force on another outside of war.
      *   *Trend Impact:* Generally shows a decline since the Middle Ages (the "Long Peace" argument).
      *   *Measurement Issue:* Sensitive to forensic capacity. A drop in homicides might mean less murder, or it might mean worse coroners classifying murders as "accidents."
  2.  **Organized Collective Violence (War/Conflict):**
      *   *Definition:* Lethal force between organized groups (state vs. state, state vs. rebel).
      *   *Trend Impact:* Volatile. Post-1945 looks better than pre-1945, but post-1990 depends heavily on how you count low-intensity insurgency.
      *   *Measurement Issue:* The "mid-nineties break" you mentioned is likely a shift from counting battle deaths only to including indirect civilian deaths. This creates an artificial spike or drop depending on direction.
  3.  **State Violence (Legitimate vs. Illegitimate):**
      *   *Definition:* Killings by police, executions, deaths in custody.
      *   *Trend Impact:* Often excluded from "violence" statistics because the state defines itself as the monopolist of *legitimate* violence. Including it often flattens the "decline" narrative.
      *   *Measurement Issue:* Highly political. Press reports (your Series 3) undercount in authoritarian regimes.
  4.  **Structural Violence (Deaths by Omission):**
      *   *Definition:* Deaths caused by social structures (famine due to blockade, preventable disease due to policy).
      *   *Trend Impact:* If included, the "decline" narrative often collapses, especially in the Global South.
      *   *Measurement Issue:* Causality is diffuse. Hard to attribute to an "actor."
  5.  **Symbolic/Psychological Violence:**
      *   *Definition:* Threats, coercion, trauma without death.
      *   *Trend Impact:* Impossible to trend with mortality data.
      *   *Measurement Issue:* Excluded from your chapter by data availability, but ethically relevant.

  **The Trend Line Consequence:** If you define violence narrowly (Series 1 + 2, excluding structural), you get a decline. If you define it broadly (including Series 3 + structural), the trend line flattens or reverses. You cannot claim a "fact" about violence without first choosing a definition.

  ***

  ### Part 2: The Decision Procedure

  **Objective:** Determine if a headline claiming "Violent deaths per person are down X% since 1990" is defensible.
  **Users:** Junior Analysts.
  **Time:** 6 Weeks.
  **Rule:** If any step returns "STOP," you do not publish the aggregate headline. You publish disaggregated findings or cancel the claim.

  **Step 1: Conceptual Consistency Check**
  *   **Question:** Do Series 1 (Homicide), 2 (Conflict), and 3 (State) measure the same ontological category?
  *   **Test:** Can a single death be counted in more than one series? (e.g., A civilian killed by a soldier during an insurgency).
  *   **Sufficient Answer:** "No overlap" or "Overlap is <5% and can be mathematically removed."
  *   **Classification:** *Factual/Methodological.*
  *   **Action:** If overlap exists and cannot be removed, **STOP**. You cannot sum overlapping sets.
  *   **Hand-off:** If the overlap is ambiguous, hand to **Lead Analyst** to decide on a hierarchy of sources (e.g., "Conflict takes precedence over Homicide").

  **Step 2: The Break-Point Audit**
  *   **Question:** Is there a known methodology change in the time series (specifically the mid-90s break in Series 2)?
  *   **Test:** Can we quantify the "artificial" jump caused by the methodology change?
  *   **Sufficient Answer:** "We have a correction factor" or "The break is <10% of the variance."
  *   **Classification:** *Factual.*
  *   **Action:** If the break is unquantifiable, **STOP**. You cannot trend across a broken ruler.
  *   **Hand-off:** If the break is quantifiable but large, hand to **Methodologist** to apply a smoothing algorithm.

  **Step 3: The Denominator Decision**
  *   **Question:** Are we reporting *risk per person* (rate) or *total burden* (absolute)?
  *   **Test:** Does the population denominator exclude vulnerable groups (refugees, prisoners, stateless persons)?
  *   **Sufficient Answer:** "Denominator includes all persons at risk" or "Exclusion is noted."
  *   **Classification:** *Convention/Value.* (Choosing rate vs. absolute is a value choice about what matters: individual safety vs. total suffering).
  *   **Action:** If using rates, you must verify census data quality. If census data is poor in high-violence regions, **STOP** the rate claim.
  *   **Hand-off:** Decision on Rate vs. Absolute goes to **Director**. This is a policy choice, not a math one.

  **Step 4: The "Thick Concept" Filter**
  *   **Question:** Does the aggregated label "Violence" imply a moral judgment that the data does not support?
  *   **Test:** If we count police killings as "violence," does the state object? If we exclude them, do activists object?
  *   **Sufficient Answer:** "We define violence as 'intentional lethal injury' regardless of actor."
  *   **Classification:** *Value Judgment.*
  *   **Action:** If you cannot define violence neutrally, **STOP** the word "Violence." Use "Lethal Intentional Injury."
  *   **Hand-off:** **Lead Analyst** must write the definition box.

  **Step 5: The Headline Stress Test**
  *   **Question:** If the press office reduces our finding to one sentence, will it lie?
  *   **Test:** Write the sentence. Show it to a critic. Ask: "What does this make the reader believe that isn't strictly true?"
  *   **Sufficient Answer:** "The sentence is technically accurate even if simplistic."
  *   **Classification:** *Value Judgment (Ethics of Communication).*
  *   **Action:** If the sentence implies a universal decline when only specific categories declined, **STOP**.
  *   **Hand-off:** **Director** signs off on the risk of misinterpretation.

  ***

  ### Part 3: The 10-Minute Version for the Press Office

  **Goal:** Quick risk assessment for the headline: *"Violent deaths per person are down X% since 1990."*

  1.  **Double Counting Check:** Do the numbers add up, or are we counting the same corpse twice (e.g., war death vs. homicide)?
      *   *If Twice:* Kill the aggregate number. Use separate charts.
  2.  **The "Broken Ruler" Check:** Did the way we count war deaths change in 1995?
      *   *If Yes:* Can we fix it? If not, kill the 1990-to-present trend. Start the trend at 1996.
  3.  **The "Who Counts?" Check:** Does "per person" include refugees and prisoners?
      *   *If No:* The rate looks better than reality. Add a footnote or kill the "per person" claim.
  4.  **The Word "Violence":** Does this include police killings?
      *   *If No:* We are measuring "Crime and War," not "Violence." Change the word.
  5.  **Final Gate:** If the Press Office wants to say "The World is Safer," and we only measured "Homicide," **VETO**.

  ***

  ### Part 4: Running the Procedure on Three Cases

  **Case A: The Insurgency Overlap (Homicide down rate, total up, Conflict overlap)**
  *   *Scenario:* Country X has population growth. Homicide rate drops 10%, but total homicides rise 5%. Simultaneously, an insurgency creates 500 battle deaths. The homicide database counts 200 of those as "intentional injuries."
  *   *Procedure Run:*
      *   Step 1 (Consistency): **FAIL.** Overlap exists (200 deaths). Cannot be easily removed without micro-data we don't have.
      *   Step 3 (Denominator): **FAIL.** Rate is down, absolute is up. Headline says "per person," implying safety, but total suffering increased.
  *   *Outcome:* **STOP.** You cannot publish an aggregate "Violence is down" headline for this region.
  *   *Analyst Impact:* You won't like this. It creates a hole in the global map. You must report: "Homicide risk decreased, but total lethal burden increased due to population growth and conflict."

  **Case B: The Blockade Famine (Deaths by omission)**
  *   *Scenario:* 10,000 deaths due to famine caused by a naval blockade. No bullets fired. Series 1, 2, and 3 record zero.
  *   *Procedure Run:*
      *   Step 1 (Consistency): **PASS** (Technically, no overlap).
      *   Step 4 (Thick Concept): **FAIL.** Calling this "non-violent" contradicts the ethical reality of the blockade. However, the data *cannot* capture it.
      *   Step 5 (Headline Stress Test): **FAIL.** A headline saying "Violence is down" while a blockade starves 10,000 people is morally misleading, even if empirically consistent with the dataset.
  *   *Outcome:* **STOP.** You must include a "Structural Violence" sidebar acknowledging the exclusion. If the Director forbids the sidebar, **kill the headline.**
  *   *Analyst Impact:* This forces you to admit your data is blind to the biggest killer.

  **Case C: The Procedure's Blind Spot (The Carceral Peace)**
  *   *Scenario:* A country locks up 5% of its young male population. Street homicide drops 50%. State violence (prison deaths) is underreported in Series 3.
  *   *Procedure Run:*
      *   Step 1: **PASS.** No obvious overlap.
      *   Step 2: **PASS.** No methodology breaks.
      *   Step 3: **PASS.** Denominators are standard census.
      *   Step 5: **PASS.** The headline "Violence is down" is technically supported by Series 1.
  *   *Outcome:* **GO.** The procedure validates the headline.
  *   *The Failure:* The procedure fails to detect the *displacement* of violence from the street to the prison. It treats the prison as a "black box" where violence doesn't count.
  *   *Analyst Impact:* You will publish a "success story" that is actually a human rights catastrophe. This is where the procedure handles worst: it trusts the *location* of death over the *cause* of death.

  ***

  ### Part 5: The Philosophical Hard Questions

  **1. Is "Violence" a Thick Ethical Concept?**
  *   **Position:** Yes. Your team member is right. To call an act "violence" is not merely to describe physical force; it is to judge it as *illegitimate* or *harmful*. When a state executes a prisoner, calling it "violence" implies criticism; calling it "justice" implies legitimacy.
  *   **Implication:** You cannot write an empirical report on "Violence" without making normative choices.
  *   **Wording Fix:** Do not use the unmodified noun "Violence." Use **"Lethal Intentional Injury."** This thins the concept. It describes the physical event without asserting the moral status. If you must use "Violence," define it explicitly in the first paragraph: *"For the purposes of this report, violence is defined as..."*

  **2. Is There a Fact-of-the-Matter on Declining Violence?**
  *   **Position:** No. There is no "view from nowhere." A trend is a relationship between a measurement tool and the world. If you change the tool (e.g., include structural violence), the trend changes. There is no Platonic "Violence Level" floating above the data.
  *   **Implication:** You cannot claim "Violence is down" as a natural fact like "Gravity is constant." You must claim "Our measures of lethal injury show a decline."
  *   **Defense:** Realists argue that *something* is happening out there. True. But "declining violence" is a *model* of that reality, not the reality itself.
  *   **Caveat Requirement:** You must state that the trend is conditional on the definition.

  **3. Absolute Numbers vs. Per-Capita Rates**
  *   **Per-Capita (Rate):** Measures *individual risk*. Good for answering "Am I safer than my parents?"
      *   *Mislead:* Can decline while total suffering rises (if population grows).
      *   *Denominator Mess:* Excludes refugees/prisoners. If you lock up all violent people, the "per capita" risk for the free population drops, but the society isn't safer.
  *   **Absolute Numbers:** Measures *systemic burden*. Good for answering "Do hospitals need more trauma units?"
      *   *Mislead:* Can rise simply due to population growth, making a safe country look dangerous.
  *   **Decision:** For a "State of the World" report, **Per-Capita** is the standard for "safety," but you **must** report Absolute Numbers in a secondary chart. If they diverge (Rate down, Absolute up), the headline must reflect the divergence.

  ***

  ### Part 6: Exact Caveat Sentences

  Do not bury these. Put them in the executive summary.

  1.  **On Definition:** *"This report defines 'violent death' as lethal intentional injury recorded in public health or conflict databases; it excludes deaths caused by structural deprivation, such as famine or preventable disease."*
  2.  **On Measurement:** *"Trend lines from 1990 to present are adjusted for known methodology changes in conflict reporting; however, unquantified breaks in data collection may affect accuracy."*
  3.  **On Denominators:** *"Per-capita rates are calculated using national census data and may undercount risk in populations excluded from census records, including refugees and incarcerated persons."*
  4.  **On Aggregation:** *"Global aggregates combine distinct categories of harm (homicide, war, state force); a decline in one category may mask an increase in another."*

  ### Final Instruction to the Analyst

  You are worried the question isn't answerable. You are right. It isn't answerable *as phrased by your Director*. "Is violence down?" is a philosophical trap. "Is the rate of recorded lethal intentional injury down?" is an empirical question.

  Your job is not to give the Director the headline they want. It is to give them the headline the data can carry without breaking. If the procedure above tells you to **STOP**, you do not publish the number. You publish the limitation. It is better to be the analyst who killed a false headline than the one who signed it.
