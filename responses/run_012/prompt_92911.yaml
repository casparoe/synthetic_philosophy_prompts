      *   **Consistency:** The principle is the same for coin and die. In the coin case, P(Heads) = 1/2. In the die case, P(1) = 1/6. The number of wakeups doesn't change the probability of the initial chance event unless the awakening protocol makes waking *more likely* given one outcome than another. But here, waking is certain in all cases.
