          *   Money comes from *somewhere* (opportunity cost).
          *   Training cost (one-time) vs. Deployment cost (per-use) binds different actors.
          *   Universal tax vs. Unilateral adoption (political vs. technical).
      *   **Characters:** Two sharp interlocutors (Defender of the Constraint vs. Skeptic of the Constraint). No strawmen, no villains.
      *   **Outcome:** At least one real concession, at least one genuine standoff. Each describes a concrete scenario where their view is vindicated.
      *   **My Role:** Provide a definite verdict on who won and why, plus the single observation/development that would change my mind. No fence-sitting.

