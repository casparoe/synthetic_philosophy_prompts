      *   *Round 2: Training vs. Deployment.* Elias distinguishes between upfront R&D costs (burning capital) and marginal deployment costs (pricing out users). Mara counters that a fund can cover both.
      *   *Round 3: Universal Tax vs. Unilateral Action.* This is crucial. Elias argues if *everyone* pays, no one loses relative advantage, *but* getting everyone to agree is the political bottleneck. Mara argues that proves it's political, not technical.
