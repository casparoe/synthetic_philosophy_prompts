prompt: |-
  I'm a novelist, so take the naivety as genuine, but Ive spent the last year in a reading group on distributive justice and I've gotten weirdly fixated on one fight: the prioritarians vs. the egalitarians. Both sides agree on tons — radical inequality is bad, the worse off matter — and both think they've refuted the other. The egalitarians wheel out the leveling-down objection (if equality is good in itself, then a world where everyone is equally badly off is in some respect better than one where some people do better, which sounds monstrous). The prioritarians say great, that's exactly why we're not egalitarians, benefiting the worse off matters more, end of story. Then the egalitarians say fine, but your weighting is arbitrary and you've smuggled in egalitarianism without the nerve to say so. Nobody has moved an inch in a year and I genuinely can't tell what's going on anymore.

  Act as a philosopher who works on axiology and distributive justice, and actually think this through rather than giving me the standard survey. Start by laying out the two positions as precisely as you can, then brainstorm a few candidate diagnoses before you commit to one. My own hunch, which I'd like you to test rather than flatter: that this isn't a disagreement about value at all but about what a theory of value owes us — the egalitarians want an axiology that explains why equality is good, the prioritarians want one that just gets the verdicts right, and leveling down is a case that looks decisive only once you've already accepted one of those demands. Or is there a real formal disagreement hiding in there about whether the value of a distribution is essentially comparative — a fact about how people stand to each other — or not? And if that's what it is, is there some theorem or distinction that could actually settle it, or should we expect these two camps to grind on forever? And if forever, is that a sign the question is ill-posed? Tell me what would count as progress here, given your diagnosis.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

