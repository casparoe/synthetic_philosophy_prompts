      *   **Prioritarianism (Weighted Beneficence):** Benefiting people matters more the worse off they are. No intrinsic value to equality *per se*, only to the weighted sum of welfare.
      *   **The Leveling Down Objection (LDO):** If equality is intrinsically good, then a world where everyone is miserable (but equal) is *pro tanto* better than a world where some are miserable and some are great (unequal). Egalitarians must accept this "respect" of betterness, even if they reject all-things-considered leveling down.
