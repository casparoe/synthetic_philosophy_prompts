      *Move 5:* Nadia appeals to special sciences. Strong *reductio*.
      *Move 6:* Owen concedes reality but denies pushing. Good distinction, but "pushing" is the wrong metric for macro-cause.

      *Overall:* Nadia wins because her definition of causation allows the thought experiment to work as intended (explaining mind). Owen's definition makes the mind epiphenomenal by fiat.
      *Missing:* They are arguing about *forces* when they should be arguing about *constraints*. The pattern constrains the micro-dynamics.

      Let's refine the "Missing" part. The Careenium is a *syntactic engine*. The missing piece is that the "bit" is defined by its *role in a computational process*, not just its physical stability. The causal power comes from the *system's organization*, which constrains the micro-events. Owen sees the events; Nadia sees the organization. The missing insight is that *organization is physically causal* by restricting phase space.

