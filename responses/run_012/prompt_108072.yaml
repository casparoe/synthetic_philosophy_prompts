      *Let's finalize the "Missing" insight.* The missing insight is that the macro-pattern *constrains* the micro-dynamics. It's not that the bit pushes the balls *in addition* to the balls pushing each other. It's that the *arrangement* of the balls (the bit) restricts which micro-trajectories are possible. The pattern is a boundary condition. Owen treats the micro-level as unconstrained; Nadia treats the macro-level as a separate agent. The truth is the macro-level *is* the constraint on the micro-level.

