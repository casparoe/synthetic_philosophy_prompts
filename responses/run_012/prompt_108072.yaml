  6.  **Writing the content:** (Mental check of the constraints: No citations, reason it out, verdict focused).

      *Move 1:* Nadia appeals to common usage. Right that we speak this way, wrong that it settles the metaphysics.
      *Move 2:* Owen appeals to physical closure. Right on physics, wrong that it precludes macro-causation (category error).
      *Move 3:* Nadia appeals to intervention. Strongest move. Defines causation operationally.
