      *   **Move 3 (Nadia):** Interventionist account of causation (Woodward-esque). Nudge the register -> output changes. Nudge ball (no register change) -> no output change. Invariance across micro-realizations.
          *   *Analysis:* This is the modern standard for defending macro-causation. Causation = Counterfactual dependence/Intervention. It sidesteps the "pushing" metaphor.
          *   *Verdict:* Very Strong. This is the best argument for non-reductive physicalism.
          *   *Rating:* High.

      *   **Move 4 (Owen):** Intervention test is too generous (everything is a cause). Invariance is just a micro-fact (states implementing 1 are physically alike).
