      *   **The Core Question:** Does the pattern (the symbol/bit) cause the output, or do the balls simply push each other (with the symbol being just a description)? This is the classic problem of *Causal Exclusion* vs. *Non-Reductive Physicalism* vs. *Eliminativism/Reductionism*.
      *   **The Debate Structure:** 6 numbered moves (3 by Nadia, 3 by Owen).
