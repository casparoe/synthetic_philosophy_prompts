      *   The debate mirrors the "Causal Exclusion Argument" (Jaegwon Kim) vs. "Compatibilism" (Dennett, Davidson, etc.).
      *   *Nadia's Stance:* Non-reductive physicalism/Functionalism. Higher-level patterns are causally efficacious in virtue of their organization, not just their parts. Causation is about difference-making and invariance.
      *   *Owen's Stance:* Reductive Physicalism/Causal Closure. All physical effects have sufficient physical causes. Higher-level descriptions are useful summaries but don't add "pushing" power.

  3.  **Evaluate the Moves (Step-by-Step):**

      *   **Move 1 (Nadia):** Analogy to chess program. "The choice of move caused the piece to move."
          *   *Analysis:* This is a standard functionalist move. It appeals to explanatory practice. However, Owen can counter that the transistors *did* cause it, and "choice" is shorthand.
          *   *Verdict:* Right in spirit (explanatory utility), but vulnerable to the "just shorthand" objection. It asserts causation without proving it against the closure principle.
          *   *Rating:* Solid intuition, but philosophically lightweight against a reductionist.

      *   **Move 2 (Owen):** "Nothing pushes a simmball but other simmballs." Complete micro-physics accounts for everything. Macro-causes imply overdetermination.
          *   *Analysis:* This is the Causal Closure of the Physical. It's the strongest argument for reductionism. If physics is complete, there's no room for extra causal oomph.
