answer: |-
  The finiteness of the encoding premium guarantees asymptotic agreement on predictions, but its non-computability ensures that no finite agent can know when this agreement obtains or whether their simplicity bias reflects truth or machine artifacts. Consequently, parsimony functions as a pragmatic heuristic for search rather than an epistemic guide to truth, particularly when confronting empirically equivalent theories.

  The conjunction of the invariance theorem and the uncomputability of the encoding premium creates a decisive gap between asymptotic guarantees and finite practice. While the finiteness of the premium (i) ensures that two agents using different universal machines will eventually converge on the same predictive distributions, the non-computability of that premium (ii) means the "transient phase" of disagreement is unbounded and unknowable. For an ideal agent, this is merely a theoretical curiosity; for a resource-bounded scientist, this transient phase constitutes the entirety of their inferential life. You cannot determine from inside the system whether your current posterior is close to the "true" Solomonoff prior or skewed by an arbitrarily large encoding constant specific to your reference machine. This undermines the normative force of Solomonoff induction for finite beings, as the formalism provides no internal stopping rule for when prior dependence has been washed out by data.

  This epistemic opacity is compounded when considering specific hypothesis odds rather than full predictive distributions. Given your setup where agents share likelihoods, the ratio of their posterior odds for any pair of hypotheses remains constant throughout inquiry, determined solely by their prior odds. This implies that the "settling time" for agreement within a factor of two is either zero or infinite; if the prior mismatch exceeds the tolerance, data will never reconcile the agents' confidence levels, even if both eventually identify the true hypothesis. This distinction is crucial for the practice of theory choice: scientists often require agreement on confidence (e.g., significance levels or Bayes factors) to coordinate action, not merely binary agreement on truth. The formalism thus vindicates Occam's Razor only as a mechanism for eventual truth-tracking in the limit, not as a guarantee of intersubjective agreement on confidence for finite data.

  The situation becomes starkly arbitrary when applying simplicity to empirically equivalent hypotheses. Since data cannot separate hypotheses with identical likelihoods, posterior odds remain fixed at prior odds. Because the prior odds depend on the choice of reference machine $U$, and the cost of translating between machines is uncomputable, the selection of one empirically equivalent theory over another is determined by an arbitrary constant hidden in the agent's computational architecture. This severs the link between simplicity and truth for underdetermined theories, forcing a shift in how parsimony is justified. Rather than viewing simpler theories as more likely to be true, the bounded agent must treat simplicity as a pragmatic constraint on computational search or a coordination focal point, acknowledging that the epistemic justification vanishes where empirical discrimination ends.

