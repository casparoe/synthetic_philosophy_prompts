      *   *Verdict:* Gradual replacement is plausible (Ship of Theseus). Uploading is a copy/death scenario (Teletransportation Paradox).
      *   *Better Analogy:* The **Flame**. It emphasizes that fire is a *process* happening *to* fuel, not just the pattern of the fuel. Transferring fire requires causal contact. Copying the "shape" of the fire doesn't make heat.

  7.  **Refining the Tone:**
      *   Needs to be analytical, philosophical, but accessible.
