  Here is the decision problem pair for your whiteboard. It is designed to satisfy every one of your constraints while preserving the psychological force of the Allais reversal.

  ### The Setup

  **Outcomes:** All payoffs are in dollars. All are strictly positive.
  **Mixing Lottery ($C$):** A 50% chance of \$60 and a 50% chance of \$70. (Uncertain, no zero).
  **Mixing Weight ($\alpha$):** 0.1 (10%).

  **Problem 1 (High Probability)**
  *   **Option $A$:** 90% chance of \$100, 10% chance of \$50.
  *   **Option $B$:** 45% chance of \$200, 55% chance of \$50.
