  0.9 \times C &= 0.9 \times (0.50 \$60 + 0.50 \$70) \\
  &= 0.45 \$60 + 0.45 \$70 \\
  \hline
  \text{Sum } (A') &= 0.09 \$100 + 0.01 \$50 + 0.45 \$60 + 0.45 \$70
  \end{aligned}
  $$
  *Check:* Probabilities sum to $0.09+0.01+0.45+0.45 = 1.0$. All probabilities $\in (0,1)$. All outcomes $>0$.

  **Verifying Option $B'$:**
  $$
  \begin{aligned}
  0.1 \times B &= 0.1 \times (0.45 \$200 + 0.55 \$50) \\
  &= 0.045 \$200 + 0.055 \$50 \\
  0.9 \times C &= 0.9 \times (0.50 \$60 + 0.50 \$70) \\
  &= 0.45 \$60 + 0.45 \$70 \\
  \hline
  \text{Sum } (B') &= 0.045 \$200 + 0.055 \$50 + 0.45 \$60 + 0.45 \$70
  \end{aligned}
  $$
  *Check:* Probabilities sum to $0.045+0.055+0.45+0.45 = 1.0$. All probabilities $\in (0,1)$. All outcomes $>0$.

  **The Violation:**
  If the Independence Axiom holds, $A \succ B$ implies $0.1A + 0.9C \succ 0.1B + 0.9C$, which means $A' \succ B'$.
  However, empirical data on the "Common Ratio Effect" (the general class to which Allais belongs) shows that humans typically choose **$A$** in Problem 1 but flip to **$B'$** in Problem 2.

  ---

  ### Analysis: What's Left to Explain?

  Once you remove the sure thing (100% probability) and the zero outcome (\$0 payoff), the violation persists. This proves your friend's claim—that the paradox is *entirely* an artifact of certainty or ruin—is false.

  **The Residual Story:**
  The explanation is not the *point* of certainty ($p=1$), but the *slope* of probability weighting. According to Prospect Theory, humans do not weight probabilities linearly. We are hypersensitive to changes in probability when they are near the endpoints (0 and 1).
  *   In Problem 1, the difference between 90% and 45% feels massive. The 90% option ($A$) feels "safe," triggering risk aversion.
  *   In Problem 2, the difference between 9% and 4.5% feels negligible. Both feel "unlikely." In this low-probability region, the weighting function is convex, making people risk-seeking for the larger prize ($B'$).

  **Is this just the Certainty Effect in disguise?**
  It is the same *mechanism* (non-linear probability weighting), but it refutes your friend's specific *diagnosis*. Your friend argues that removing $p=1$ removes the violation. This case shows that the "certainty effect" is actually just the steepest part of a curve that is non-linear everywhere. The violation doesn't require a logical sure thing; it only requires a *psychological* sense of security, which 90% provides even if 100% does not.

  **The Single Feature Doing the Work:**
  The **diminishing sensitivity to probability changes**. The psychological distance between 0.90 and 0.45 is perceived as much larger than the distance between 0.09 and 0.045, even though the ratio is identical (2:1).

  **What happens if you remove it?**
  If you force linear probability weighting (i.e., assume Expected Utility Theory holds), the violation disappears mathematically. $EU(A) > EU(B)$ would necessarily imply $EU(A') > EU(B')$.

  **How Your Friend Will Wriggle:**
  He will likely attack the **description of the 90% probability**. He will argue that 90% is "quasi-certainty" and that humans treat it *as if* it were a sure thing. He will claim you haven't actually scrubbed out the certainty effect, you've just moved the goalposts from 100% to 90%.
  *   *Your Counter:* Ask him where the line is. Is 80% quasi-certain? 70%? If there is no bright line between "uncertain" and "quasi-certain," then "certainty" isn't a binary switch causing the error; it's a continuous curve of probability weighting. If it's a curve, then the Independence Axiom (which assumes linearity) is violated everywhere, not just at the endpoint. He cannot have it both ways: either $p=1$ is special (which this case disproves), or probability weighting is non-linear (which violates Independence regardless of $p=1$).
