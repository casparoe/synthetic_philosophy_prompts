prompt: |-
  I clerk for one of the judges on the Marovia Tribunal. We sit over the 1991–2001 war, and our statute is more or less the London Charter with the names changed — same three core crimes, same architecture — except ours was adopted in 2004, after the fighting stopped. So every single case gets the same objection from the defence: you're punishing us under law that didn't exist when we acted, you're the winners writing the rules after the fact, this is Nuremberg over again. We've now ruled on that objection five times and I have to draft the memo for the sixth. I can't tell anymore whether we have a rule or just five outcomes that happen to sit next to each other, and the defence is going to cite whichever one helps them.

  Our track record, roughly:

  - **The aggression case (2007).** The foreign minister was charged with planning and launching the invasion of the Kestrel Valley. Planning a war wasn't a crime under Marovian law, and Marovia had never ratified anything on aggression. Motion dismissed: the prohibition was already settled in the practice of states well before 1991, the statute only declares it, and the accused had personally voted for resolutions condemning aggression, so he can hardly plead surprise.
  - **The peacetime atrocities case (2008).** His successor, charged with crimes against humanity for killings of his own minority inside his own country, before any armed conflict had started, all of it lawful under Marovian law at the time. Motion dismissed: acts like that offend the elementary requirements of humanity and were criminal under general principles recognised by all nations; nobody needs a domestic statute to tell them not to do it.
  - **The police chief case (2009).** This is the one that went the other way. A police chief was charged with aiding and abetting a massacre by failing to warn the village, where Marovian law put no duty on him to act and he wasn't the superior of the men doing the killing. We quashed that count. The massacre was plainly criminal, but the mode of liability — a bare failure to act where no law imposed a duty — had no basis in any law in force at the time, and we said we wouldn't supply by construction a duty that no law had imposed. Two judges dissented: he knew exactly what was going to happen and can't claim surprise.
  - **The duress case (2010).** Soldiers shot prisoners under orders and under threat of being shot themselves. Motion dismissed: neither superior orders nor duress is an answer where the act is manifestly unlawful, which our statute says and so does the law of every civilised nation.
  - **The sentencing case (2011).** A convicted man argued his thirty-five years was retroactive, because Marovian law capped the nearest equivalent crime at twelve. Motion dismissed: Marovian law allowed life for murder, so nothing heavier was imposed on him, and anyway the guarantee goes to what conduct is criminal, not to how long you serve.

  Now the sixth. The prosecution wants to charge Dušan Radek, who was district registrar in Bela Reka from 1995 to 1997. His office kept what everyone called the ethnic register — the lists saying which families were of the minority, where they lived, how many children. Those lists went to the paramilitaries and were used to evict and deport the families. Radek is charged with persecution as a crime against humanity, on the theory that running that register was itself the crime. He says Marovian law required him to keep it and he'd have been prosecuted for refusing, he was told the lists were for ration cards, he never knew they went anywhere else, and nobody ever told him paperwork could be a crime against humanity. The prosecution doesn't really dispute that he didn't know where the lists ended up, though they say by 1995 anyone with eyes knew what an ethnic register was the first step towards. The actual killing was done by men who've all been convicted or are dead.

  What should we do with Radek, and what would I be able to say we were doing?

  Give it to me in this order. (1) **Bottom line**, two or three sentences: your outcome and the shortest honest statement of why. (2) **The rules we could be running**, a numbered list of the genuinely different rules that fit all five of our rulings, each stated precisely enough to generate predictions, with a note on which rulings it explains cleanly and where it has to strain. (3) **Closest precedent**, about a hundred words on which of the five is the nearest analog and which one is the tempting-but-wrong analogy. (4) **What each rule does with Radek**, about two hundred words, running every rule from (2) through his facts. (5) **What I'd recommend**, about a hundred and fifty words, the outcome that best coheres with our own precedents plus a plain statement of what principle we'd be adopting either way — I have to defend this in conference and I'd rather not find out halfway through that we've been doing victors' justice with extra steps. (6) **The motion that would settle it**, about a hundred words, the next case that would actually seperate the rules, ideally something a prosecutor might plausibly bring.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Clerk for a judge on the Marovia Tribunal.
      *   **Context:** Tribunal established in 2004, judging acts from 1991–2001. Statute mirrors London Charter (Crimes Against Peace, War Crimes, Crimes Against Humanity).
      *   **Problem:** Defense consistently raises *nullum crimen sine lege* (no crime without law) / ex post facto objections. The Tribunal has ruled five times, but the reasoning varies, creating uncertainty about the underlying legal principle.
      *   **Task:** Draft a memo for the sixth case (*Prosecutor v. Radek*).
      *   **Structure:** Six specific sections (Bottom Line, Rules, Closest Precedent, Application to Radek, Recommendation, Settling Motion).
      *   **Tone:** Professional, legally precise, candid about the ambiguity, pragmatic.

  2.  **Analyze the Five Precedents:**
      *   *Case 1 (Aggression, 2007):* Dismissed ex post facto objection. Reasoning: Customary international law (CIL) existed pre-1991 + Accused's personal knowledge (voted resolutions). *Key:* CIL + Subjective awareness.
      *   *Case 2 (Peacetime Atrocities, 2008):* Dismissed objection. Reasoning: "Elementary requirements of humanity," general principles recognized by all nations. Domestic law irrelevant. *Key:* Natural law/General Principles override domestic legality.
      *   *Case 3 (Police Chief, 2009):* **Quashed count.** Reasoning: Omission liability requires a pre-existing legal duty. No domestic/international duty existed at the time. Dissent argued subjective knowledge sufficed. *Key:* Strict legality regarding *mode of liability* (omission requires duty).
      *   *Case 4 (Duress, 2010):* Dismissed objection. Reasoning: Manifest unlawfulness of the act overrides statutory defenses (orders/duress). *Key:* Manifest illegality trumps domestic statutory defenses.
      *   *Case 5 (Sentencing, 2011):* Dismissed objection. Reasoning: Legality principle applies to criminality of conduct, not severity of penalty (if within range of analogous crimes). *Key:* Conduct vs. Penalty distinction.

  3.  **Analyze the Current Case (*Radek*):**
      *   **Defendant:** District Registrar.
      *   **Act:** Maintaining ethnic registers (required by domestic law).
      *   **Result:** Lists used by paramilitaries for deportation/persecution.
      *   **Mens Rea:** Claims ignorance of destination (ration cards). Prosecution says "should have known" by 1995.
      *   **Legality Issue:** Act was *required* by domestic law at the time. Is administrative complicity a crime under CIL in 1995?
      *   **Similarity to Precedents:** Like *Police Chief* (omission/duty issue vs. act), like *Peacetime Atrocities* (domestic law vs. humanity), like *Aggression* (knowledge issue).

  4.  **Drafting - Section by Section:**

      *   **(1) Bottom Line:** Need a clear outcome. Given *Police Chief* (2009), acquittal/dismissal is the safer legal bet on *lege*, but *Peacetime Atrocities* (2008) suggests conviction. However, *Police Chief* is the only time the Tribunal *limited* liability. To maintain coherence, we must respect the limitation on creating new modes of liability retroactively.
          *   *Decision:* Dismiss the count (Acquittal on this charge).
          *   *Reason:* Extending criminal liability to administrative acts mandated by domestic law, without proof of specific intent to persecute, violates the principle of legality as applied in *Police Chief*.

      *   **(2) The Rules:** I need to synthesize the five cases into coherent doctrines.
          *   *Rule A (Substantive Natural Law):* If it shocks the conscience, it's a crime, regardless of domestic law. (Fits Cases 1, 2, 4, 5. Strains Case 3).
          *   *Rule B (Notice-Based Legality):* Liability attaches only if the accused had fair notice the *specific conduct* was criminal, considering domestic law and CIL. (Fits Cases 1, 3, 4. Strains Case 2 slightly).
          *   *Rule C (Mode of Liability Constraint):* Core crimes are fixed, but *modes* of liability (omission, aiding) require pre-existing legal duty. (Fits Case 3 perfectly, explains 1, 2, 4, 5 as core crime cases).
          *   *Selection:* I'll define two main competing rules. One broad (Natural Law), one narrow (Strict Legality/Notice).

      *   **(3) Closest Precedent:**
          *   *Nearest:* *Police Chief* (2009). Both involve liability for *not stopping* or *facilitating* via administrative inaction/action where no specific criminal duty existed.
          *   *Tempting but Wrong:* *Peacetime Atrocities* (2008). That was about the *nature* of the act (killing), whereas this is about the *link* between admin work and the crime.

      *   **(4) What Each Rule Does with Radek:**
          *   *Natural Law Rule:* Convict. Keeping lists for persecution is inherently evil. Domestic law no excuse.
          *   *Strict Notice Rule:* Acquittal. Domestic law required it. No clear CIL criminalizing bureaucracy in 1995 without intent.
          *   *Mode of Liability Rule:* Acquittal. Aiding/Abetting via paperwork requires knowledge/intent not proven here.

      *   **(5) Recommendation:**
          *   Need to protect the Tribunal's legitimacy. Convicting Radek looks like victors' justice (punishing a clerk for doing his job under duress/law). *Police Chief* is the anchor. We must admit the legality principle limits us even when the moral outcome is unsatisfying.
          *   *Principle:* "Fair Warning over Moral Retribution."

      *   **(6) The Settling Motion:**
          *   Need a case that splits the rules. A case where the act is morally neutral but the context is bad, or where the domestic law was ambiguous.
          *   *Idea:* A banker who processed transactions for the regime. Or a journalist. Let's go with a Banker. Neutral act, facilitates war.

  5.  **Refining and Polishing:**
      *   *Check Word Counts:* Adhere strictly to the approximate word counts requested.
      *   *Check Tone:* Needs to sound like a clerk talking to a judge. Candid, slightly weary of the inconsistency, but rigorous.
      *   *Check Logic:* Ensure the distinction between *Police Chief* (omission) and *Radek* (commission/act) is addressed. Radek *did* something (kept lists), but it was legally required. *Police Chief* didn't act when he had no duty. The parallel is the *lack of legal prohibition* at the time.

      *(Self-Correction during drafting)*: Wait, Radek committed an act (keeping lists), whereas the Police Chief failed to act. Is *Police Chief* really the best analog?
      *   *Re-evaluation:* In *Police Chief*, the underlying massacre was criminal. The liability was for the *failure to warn*. Here, the underlying deportation is criminal. The liability is for *keeping the lists*. The legal issue is identical: Can we criminalize conduct that was *mandated* or *permitted* by domestic law and not clearly criminal under CIL at the time?
      *   *Police Chief* is still the best analog for the *legality* constraint. The *Peacetime Atrocities* case is the danger zone (natural law override). I need to make sure the memo distinguishes "killing innocents" (always wrong) from "bureaucratic compliance" (context-dependent).

      *   *Rule Formulation:* Let's refine the rules to be distinct.
          1.  *The "Elementary Humanity" Rule:* If it violates fundamental humanity, domestic law is irrelevant. (Cases 2, 4, 5, 1). Fails Case 3.
          2.  *The "Specific Prohibition" Rule:* Liability requires a pre-existing prohibition on the *specific mode* of conduct, regardless of the underlying crime's status. (Case 3, 1, 4). Fails Case 2 (peacetime CAH wasn't clearly defined in 1991 CIL compared to war crimes).
          3.  *The "Fair Notice" Synthesis:* Domestic law is evidence of notice. If domestic law required it, notice is lacking unless CIL was crystal clear.

      *   *Let's stick to the prompt's request:* "Genuinely different rules that fit all five." This is hard because Case 3 contradicts 2. I need to frame them as competing interpretations of the same statute.
      *   *Rule 1: Substantive Illegality.* Focus on the moral wrong. (Explains 1, 2, 4, 5. Strains 3).
      *   *Rule 2: Formal Legality.* Focus on the pre-existing prohibition of the specific conduct. (Explains 3, 5, 1. Strains 2).
      *   *Rule 3: The "Manifest Unlawfulness" Hybrid.* Conduct is criminal if manifestly unlawful to a reasonable person, but modes of liability require specific duty. (Explains all 5). This is the "coherent" rule I should aim for in the recommendation.

      *   *Wait, looking closer at Case 3:* The dissent argued knowledge should suffice. The majority said duty is required.
      *   *Looking at Radek:* He claims he didn't know. Prosecution says he "should have known."
      *   *Decision:* I will recommend dismissal based on *Police Chief*. It's the only constraint the Tribunal has shown.

      *   *Word Count Check:*
          *   Bottom Line: 2-3 sentences.
          *   Rules: Numbered list.
          *   Precedent: ~100 words.
          *   Application: ~200 words.
          *   Recommendation: ~150 words.
          *   Motion: ~100 words.

      *   *Drafting the content:*
          *   *Bottom Line:* Dismiss the charge. We cannot criminalize administrative compliance mandated by domestic law without proof of specific intent to persecute, as this exceeds the fair warning principle established in *Police Chief*.
          *   *Rules:*
              1.  *Universal Morality Principle:* Acts offending humanity are criminal regardless of domestic law or specific prohibitions. (Fits 2, 4, 5; strains 3).
              2.  *Specific Prohibition Principle:* Liability requires a pre-existing rule prohibiting the specific conduct or mode of liability. (Fits 3, 5; strains 2).
              3.  *Manifest Unlawfulness Principle:* Conduct is criminal if manifestly unlawful to a reasonable person, but omissions require specific duty. (Fits all 5).
          *   *Precedent:* *Police Chief* is the key. It limits liability for non-core actors. *Peacetime Atrocities* is the trap; that involved direct killing, not bureaucratic facilitation.
          *   *Application:* Rule 1 convicts (lists = persecution). Rule 2 acquits (no law against lists). Rule 3 acquits (not manifestly unlawful without intent).
          *   *Recommendation:* Adopt Rule 3. It saves the Tribunal from looking like a kangaroo court. We punish killers, not clerks forced by law.
          *   *Motion:* A banker or logistics officer. Neutral acts facilitating crime.

      *   *Refining the "Rules" section:* The prompt asks for rules that "fit all five." Rule 1 strains on Case 3. Rule 2 strains on Case 2. I need to be honest about the strain.
      *   *Refining the "Recommendation":* I need to defend this in conference. The argument is legitimacy. If we convict Radek, we validate the Defense's "victors' justice" claim.

      *   *Final Polish:* Ensure the voice is appropriate. "Your Honor," "Chamber," etc. No, the prompt asks for the memo content directly, not a letter format. Just the sections.

      *   *Wait, one nuance:* Radek is charged with *Persecution*. Persecution requires discriminatory intent. The prompt says "Prosecution doesn't really dispute that he didn't know where the lists ended up." If he didn't know, he lacks the *mens rea* for persecution. But the legality objection is about the *act* being criminalized retroactively. I need to focus on the *lege* objection, not just *mens rea*. The *lege* objection is: "Keeping a census was legal then; you can't make it a crime now."
      *   *Okay, adjustment:* The *mens rea* is weak, but the *nullum crimen* is the procedural hurdle. I will focus on the *nullum crimen*.

      *   *Let's write.*

      *(Self-Correction on Word Counts)*: I need to be careful not to ramble.
      *(Self-Correction on Tone)*: "Shortest honest statement." "I have to defend this." Keep it real.

      *(Final check on Case 3 vs Radek)*: Case 3 was omission (failure to warn). Radek is commission (keeping lists). However, the legal duty is the mirror image. Case 3: No duty to act. Radek: Duty to act (by domestic law). Both result in "No criminal liability for this specific conduct mode." The principle is "Domestic legal status matters for notice."

      *Okay, ready to draft.*
answer: |-
  (1) **Bottom line**
  Dismiss the charge. We cannot retroactively criminalize administrative conduct mandated by domestic law without proof of specific intent to further the criminal purpose, as doing so violates the principle of fair warning established in *Police Chief*. To convict would confirm the defence's narrative that we are applying victors' justice rather than law.

  (2) **The rules we could be running**
  1.  **The Universal Morality Rule:** Conduct is criminal if it offends elementary humanity, regardless of domestic legality or specific prior prohibitions.
      *   *Fits:* Peacetime Atrocities, Duress, Aggression, Sentencing.
      *   *Strains:* Police Chief (where we refused to criminalize a morally culpable omission solely because no duty existed).
  2.  **The Specific Prohibition Rule:** Liability requires a pre-existing prohibition on the specific *mode* of conduct, even if the underlying act is heinous; domestic law is relevant to notice.
      *   *Fits:* Police Chief, Sentencing, Aggression (personal notice).
      *   *Strains:* Peacetime Atrocities (where domestic law explicitly permitted the killings).
  3.  **The Manifest Unlawfulness Hybrid:** Core crimes are judged by general principles (Rule 1), but secondary liability or omissions require specific legal duties or manifest knowledge of the criminal end (Rule 2).
      *   *Fits:* All five (explains *Peacetime* as a core crime vs. *Police Chief* as a mode-of-liability constraint).

  (3) **Closest precedent**
  *Police Chief* (2009) is the controlling analog. Like Radek, the Chief was a state functionary whose liability turned on whether his specific administrative conduct (or failure thereof) was independently criminalized at the time, distinct from the underlying massacre. *Peacetime Atrocities* (2008) is the tempting-but-wrong analogy; there, the accused personally ordered killings, which are *malum in se*. Radek kept lists. Convicting him equates bureaucracy with murder without the bridge of specific intent, ignoring the *Police Chief* limitation on expanding modes of liability retroactively.

  (4) **What each rule does with Radek**
  Under **Universal Morality**, Radek convicts. The register was an instrument of persecution; domestic mandates are irrelevant against "elementary humanity." The prosecution's argument that "anyone with eyes knew" satisfies the moral test, rendering his ignorance immaterial. This aligns with *Peacetime Atrocities* but overrules *Police Chief*.

  Under **Specific Prohibition**, Radek acquits. No rule in 1995 criminalized census-taking, and domestic law required it. Without a pre-existing duty to *refuse*, we cannot supply one by construction. This honors *Police Chief* but risks undermining *Peacetime Atrocities* if the defence argues domestic law authorized those killings too.

  Under **Manifest Unlawfulness Hybrid**, Radek acquits. Keeping a census is not *manifestly* unlawful like shooting prisoners (*Duress*). As a secondary actor, he requires proof of specific intent to persecute, which the prosecution concedes is lacking. This distinguishes core perpetrators from functionaries, preserving coherence across all five prior rulings.

  (5) **What I'd recommend**
  Adopt the **Manifest Unlawfulness Hybrid** and dismiss. This is the only path that respects *Police Chief* without repudiating *Peacetime Atrocities*. We must distinguish between those who commit atrocities and those who administer the state, absent proof of shared criminal intent. If we convict Radek, we admit that domestic law offers no shield, rendering the *nullum crimen* guarantee a sham for low-level functionaries. In conference, argue that legitimacy requires restraint: we are a court of law, not a moral commission. Convicting a clerk who followed domestic orders, without proof he knew they facilitated crimes, validates the defence's "victors' justice" claim and endangers the Tribunal's legacy. We punish the butchers, not the bookkeepers, unless the bookkeepers intended the blood.

  (6) **The motion that would settle it**
  Charge a state banker who processed routine transactions for the regime, knowing funds *might* be used for war crimes but lacking proof of specific intent. If we convict, we adopt Universal Morality (finance = aggression). If we acquit, we confirm the Hybrid Rule (neutral acts require specific intent). This forces us to define the outer boundary of "aiding and abetting" versus ordinary professional conduct under duress of law.
