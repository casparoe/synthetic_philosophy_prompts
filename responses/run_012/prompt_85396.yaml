prompt: |-
  A friend of mine with a doctorate in history and I spent most of a long dinner arguing about whether "why Britain and not China?" — the old puzzle about why sustained industrial growth began where it did — is even a well-posed question. Her view is that it treats one outcome as the default and the other as a deviation needing explanation, that "Britain" and "China" are aggregates doing work no evidence can support, and that you cannot ask why something did not happen. I think she is too quick: contrastive questions are ordinary in history and often answerable. What I took from the argument is that we have no way of telling the well-posed ones from the ill-posed ones.

  I chair the committee that approves comparative essay titles for our final-year history students. Each year we get about forty proposals of the form "why did X happen in P and not in Q?", we have one afternoon to vet them, most of us are not specialists in the regions concerned, the final list goes out under my name, and a rejection means writing to the teacher who proposed the title to explain it. Please write a procedure we can run on each title in a few minutes: the tests to apply in order, what counts as passing or failing each, what to do with a title that fails (reframe it, specify the contrast, split it, reject it), and where the procedure must stop and hand the matter to a person because it turns on historiographical or evaluative judgment rather than on whether the question is well formed. Ground it in whatever philosophy of science actually says about contrastive explanation and in what comparative history has learned about comparing large entities; I don't need a survey of the debate, I need something my committee can use. Then run it on three titles: "Why did sustained industrial growth begin in Britain rather than in China?"; "Why did Japan industrialize in the nineteenth century while the Ottoman Empire did not?"; and "Why did the Scientific Revolution happen in Europe and not in the Islamic world?" — the last is one I would be sorry to lose, so be explicit if the procedure comes out against it.

  Tell me how confident you are in the procedure itself, and single out the step you are least sure of.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**
      *   **Context:** A committee chair needs a quick, reliable procedure to vet comparative history essay titles (specifically "Why X in P and not Q?").
      *   **Constraint:** 40 proposals, one afternoon, non-specialist committee, final list under chair's name, rejections require explanation letters.
      *   **Goal:** A step-by-step test to distinguish well-posed from ill-posed contrastive questions, grounded in philosophy of science (contrastive explanation) and comparative history methodology.
      *   **Output:** The procedure (tests, pass/fail criteria, remediation), application to three specific titles, confidence assessment, and identification of the weakest step.
      *   **Tone:** Practical, authoritative, philosophically grounded but usable, empathetic to the "sorry to lose" title.

  2.  **Theoretical Grounding (Mental Sandbox):**
      *   *Philosophy of Science:* Contrastive explanation (Van Fraassen, Lipton). A question "Why P rather than Q?" is valid only if P and Q share a common causal history up to a point (the *fact* and the *foil* must be comparable). If the foil is impossible or the contrast class is ill-defined, the question is ill-posed.
      *   *Comparative History:* Problem of "large entities" (China/Europe). Essentialism, reification, teleology. Need for specific mechanisms, not just civilizational essences. The "Great Divergence" debate (Pomeranz, etc.) is the backdrop.
      *   *The Friend's Critique:* "Britain/China" are aggregates. "Why not" implies deviation.
      *   *The User's Critique:* Contrastive questions are normal.
      *   *Synthesis:* The question is valid *if* the units of comparison are commensurable and the outcome is clearly defined, not if it assumes civilizational destiny.

  3.  **Drafting the Procedure (The "Vetting Protocol"):**
      *   *Need:* Speed and clarity.
      *   *Step 1: Outcome Definition.* Is "X" a specific event/process or a vague vibe? (Pass: Specific. Fail: Vague/Teleological).
      *   *Step 2: Commensurability of Units.* Are P and Q comparable units? (Pass: Similar scale/type. Fail: Civilization vs. Nation, or reified blobs).
      *   *Step 3: Counterfactual Plausibility.* Was Q actually a candidate for X? (Pass: Yes, at some point. Fail: Q never had the capacity/preconditions).
      *   *Step 4: Mechanism Availability.* Can we point to variables, not essences? (Pass: Variables exist. Fail: Relies on "culture/spirit").
      *   *Decision Tree:* Reframe, Specify, Split, Reject.
      *   *Handoff Point:* Where does grammar end and historiography begin? (Step 4 is the boundary).

  4.  **Refining the Steps (Iterative Polish):**
      *   *Step 1 (The Explanandum):* Focus on *sustained industrial growth* vs. *industrialization*. Is it defined?
      *   *Step 2 (The Contrast Class):* Are P and Q "like kinds"? Avoid "Europe vs. Islam." Try "England vs. Yangzi Delta."
      *   *Step 3 (The Foil's Viability):* This addresses the friend's "why ask why not" point. If Q *couldn't* have done X, the question is bad. Q must be a "near miss."
      *   *Step 4 (The Variable Check):* Can students access evidence? Avoid "National Character."
      *   *Remediation:* Don't just reject. Offer the "Pomeranz Fix" (smaller units) or the "Timing Fix" (specific period).

  5.  **Applying the Procedure to the Three Titles:**
      *   *Title 1: Britain vs. China (Industrial Growth).*
          *   Step 1: "Sustained industrial growth" is okay (Great Divergence standard).
          *   Step 2: "Britain" vs. "China" is the problem. Aggregates.
          *   Step 3: Was China a candidate? Yes (Song dynasty, etc.).
          *   Step 4: Variables? Yes (coal, colonies, institutions).
          *   *Verdict:* Fail Step 2. Reframe to regions (England vs. Yangzi Delta).
      *   *Title 2: Japan vs. Ottoman (19th C Industrialization).*
          *   Step 1: "Industrialize" in 19th C. Specific.
          *   Step 2: Japan vs. Ottoman Empire. Both state-led modernizers. Comparable.
          *   Step 3: Was Ottoman a candidate? Yes (Tanzimat).
          *   Step 4: Variables? Yes (debt, sovereignty, tech transfer).
          *   *Verdict:* Pass. Good control.
      *   *Title 3: Scientific Revolution (Europe vs. Islamic World).*
          *   Step 1: "Scientific Revolution." Highly contested definition. Risky.
          *   Step 2: "Europe" vs. "Islamic World." Religious/Cultural blobs, not political/economic units.
          *   Step 3: Was Islamic World a candidate? Yes (Golden Age), but discontinuity issues.
          *   Step 4: Variables? Often slips into "Islam vs. Christianity."
          *   *Verdict:* Fail Step 1 & 2. High risk of essentialism.
          *   *User Constraint:* "Sorry to lose." Need to offer a *strong* reframe, not just rejection. Suggest focusing on specific institutions (universities vs. madrasas) or specific centuries.

  6.  **Addressing the "Handoff" Point:**
      *   The procedure checks *form* and *feasibility*. It cannot check *truth*.
      *   The handoff is when the question is well-formed but the answer is historically disputed. The committee vets the *question*, not the *answer*.

  7.  **Confidence & Weakest Step:**
      *   Confidence: High on utility, moderate on philosophical purity (pragmatism vs. idealism).
      *   Weakest Step: Step 3 (Counterfactual Plausibility). It requires historical knowledge the committee might lack. How do non-specialists know if the Ottoman Empire *could* have industrialized? They need a heuristic (e.g., "Did contemporaries think it possible?").

  8.  **Final Review against Constraints:**
      *   Did I answer the prompt? Yes.
      *   Is it usable in an afternoon? Yes, checklist style.
      *   Did I run the three titles? Yes.
      *   Did I address the "sorry to lose" title? Yes, by offering a salvage path.
      *   Did I state confidence and weakest step? Yes.

  9.  **Drafting the Content (incorporating philosophy/history specifics):**
      *   *Philosophy:* Lipton's "Inference to the Best Explanation" (contrastive facts). Van Fraassen's "Why-Questions."
      *   *History:* Pomeranz (Great Divergence), Bin Wong, Goldstone. Problem of "Methodological Nationalism."
      *   *Tone:* Professional, directive, helpful.

      *(Self-Correction during drafting)*: Make sure I don't get too bogged down in the philosophy. The user wants a *procedure*. Keep the theory in the preamble/justification, keep the steps actionable. Ensure the "Handoff" is clear so the committee doesn't overstep into grading the *answer*.

      *(Refining Title 3)*: The user says "I would be sorry to lose." If the procedure kills it, I need to explain *how* to save it, not just say "Reject." The procedure should have a "Reframe" option that saves the *intent* while fixing the *form*.

      *(Refining the Weakest Step)*: Step 3 is definitely the hardest for non-specialists. I need to add a "Proxy Test" for that step (e.g., "Is there a literature on Q's failure?").

  10. **Final Polish:** Check word count and clarity. Ensure the distinction between "ill-posed" (logical/methodological error) and "hard" (historiographical debate) is clear. (Proceed to generate output).

  *(Post-computation check)*: Does this align with the friend's critique? Yes, by attacking the aggregation in Step 2. Does it align with the user's critique? Yes, by allowing contrastive questions if well-formed.

  Let's write it.cw
answer: |-
  ### The Contrastive History Vetting Protocol (CHVP)

  **Purpose:** To distinguish well-posed contrastive questions ("Why P and not Q?") from ill-posed ones in under five minutes per title, without requiring regional specialization.
  **Theoretical Basis:** Combines Bas Van Fraassen's pragmatics of *why-questions* (the foil must be relevant) with Peter Lipton's *contrastive explanation* (P and Q must share a causal history until a divergence point) and comparative historical sociology's warning against *reification* (treating civilizations as single actors).

  ---

  ### Part 1: The Procedure

  Run each title through these four tests in order. If a title fails a test, apply the prescribed remediation. If it fails Test 4, it must be handed to a specialist or rejected.

  #### Test 1: The Explanandum Specificity Check
  *Does the "X" refer to a measurable process/event or a teleological essence?*
  *   **Pass:** X is a defined process with a timeframe (e.g., "mechanized cotton textile production 1760–1800," "adoption of standing armies").
  *   **Fail:** X is a vague civilizational state (e.g., "modernity," "greatness," "the Scientific Revolution" *without definition*, "democracy").
  *   **Remediation:** **Specify.** Require the proposer to define X operationally. If X cannot be defined without circularity, **Reject**.

  #### Test 2: The Unit Commensurability Check
  *Are P and Q comparable units of analysis, or are they reified aggregates?*
  *   **Pass:** P and Q are similar political, economic, or geographic units (e.g., Nation vs. Nation, Region vs. Region, Institution vs. Institution).
  *   **Fail:** P and Q are mismatched scales or "civilizational blobs" (e.g., "Britain" vs. "China," "Europe" vs. "Islam," "The West" vs. "The Rest"). This triggers your friend's critique: aggregates hide internal variation.
  *   **Remediation:** **Downscale.** Require the student to compare sub-units (e.g., "England vs. Yangzi Delta," "Ottoman Navy vs. Spanish Navy"). If the title relies on civilizational essentialism to make sense, **Reject**.

  #### Test 3: The Foil Viability Check (The "Why Not" Test)
  *Was Q a plausible candidate for X at the start of the period?*
  *   **Pass:** Historical evidence suggests Q had the preconditions for X but diverged. (The "near miss").
  *   **Fail:** Q never had the capacity for X, making the contrast counterfactual nonsense (e.g., "Why did humans fly and not rocks?").
  *   **Non-Specialist Heuristic:** Is there a significant historiography arguing that Q *should* have developed X? If the literature treats Q's failure as inevitable due to geography/essence, the question is ill-posed.
  *   **Remediation:** **Reframe.** Shift the timeframe to when Q was a viable candidate. If Q was never viable, **Reject**.

  #### Test 4: The Variable Accessibility Check
  *Can the explanation rely on variables rather than essences?*
  *   **Pass:** The question invites comparison of institutions, resources, prices, or policies.
  *   **Fail:** The question invites explanation via "National Character," "Religious Spirit," or "Culture" as a black box.
  *   **Remediation:** **Handoff.** This is the boundary of the procedure. If the question is well-formed but risks essentialist answers, it requires a specialist to verify if non-essentialist variables exist. **Flag for Specialist Review.**

  ---

  ### Part 2: The Handoff Point
  **Stop the procedure at Test 4.**
  The committee is vetting the *question*, not the *answer*.
  *   **Committee Role:** Ensure the question *allows* for a historical explanation (Tests 1–3).
  *   **Specialist Role:** Determine if the available historical evidence *supports* a non-essentialist explanation (Test 4).
  *   **Action:** If a title passes 1–3 but fails 4, do not reject it immediately. Flag it: *"Approved contingent on supervisor confirmation that explanatory variables are institutional/material, not cultural/essentialist."*

  ---

  ### Part 3: Application to Proposed Titles

  #### Title 1: "Why did sustained industrial growth begin in Britain rather than in China?"
  *   **Test 1 (Specificity):** **Pass.** "Sustained industrial growth" is the standard "Great Divergence" explanandum.
  *   **Test 2 (Commensurability):** **Fail.** "Britain" (a small island kingdom) vs. "China" (a continental empire). This is the aggregate problem. It compares a state to a civilization.
  *   **Test 3 (Foil Viability):** **Pass.** The Song Dynasty and Ming economies are widely considered viable candidates for early industrialization.
  *   **Test 4 (Variables):** **Pass.** Coal, colonies, institutions are available variables.
  *   **Verdict:** **Reframe.**
  *   **Instruction to Proposer:** "The units are mismatched. Reframe to compare comparable economic regions. Suggested: *'Why did mechanized textile production emerge in Lancashire rather than the Yangzi Delta, 1750–1800?'*"

  #### Title 2: "Why did Japan industrialize in the nineteenth century while the Ottoman Empire did not?"
  *   **Test 1 (Specificity):** **Pass.** "Industrialize in the 19th century" is bounded.
  *   **Test 2 (Commensurability):** **Pass.** Both were non-Western imperial states facing Western pressure, engaging in state-led modernization (Meiji vs. Tanzimat).
  *   **Test 3 (Foil Viability):** **Pass.** The Ottoman Empire actively attempted industrialization; it was a "near miss," not an impossibility.
  *   **Test 4 (Variables):** **Pass.** Debt, sovereignty, tariff autonomy, and tech transfer are material variables.
  *   **Verdict:** **Pass.** This is a well-posed control case.
  *   **Instruction:** "Approved. Ensure focus remains on state policy and economic constraints, not cultural predisposition."

  #### Title 3: "Why did the Scientific Revolution happen in Europe and not in the Islamic world?"
  *   **Test 1 (Specificity):** **Fail.** "Scientific Revolution" is a highly contested term (Koyré vs. revisionists). Does it mean telescopes? Method? Institutions?
  *   **Test 2 (Commensurability):** **Fail.** "Europe" (Geographic/Political fragment) vs. "Islamic World" (Religious/Cultural zone spanning multiple empires). This invites the essentialism your friend warned against.
  *   **Test 3 (Foil Viability):** **Pass.** The Islamic Golden Age makes this a viable "near miss" historically.
  *   **Test 4 (Variables):** **High Risk.** This title almost invariably leads to students arguing about "Islamic culture" vs. "Christian culture."
  *   **Verdict:** **Reframe (Salvage Mode).**
  *   **Instruction to Proposer:** "This title is currently ill-posed due to unit mismatch and definitional vagueness. To approve, you must reframe to compare specific institutions or periods.
      *   *Bad:* 'Europe vs. Islam.'
      *   *Good:* 'Why did natural philosophy curricula stabilize in Oxford and Paris universities (1200–1500) but not in Madrasas of Baghdad and Cairo?'
      *   *Condition:* Supervisor must confirm literature exists on madrasa curricula to avoid 'decline' narratives."
  *   **Note to Chair:** This satisfies your desire to keep the topic while satisfying your friend's methodological critique. It forces the student to do actual history, not civilizational philosophy.

  ---

  ### Part 4: Confidence Assessment

  **Confidence in the Procedure: 85%**
  This protocol is robust for filtering out the most common student errors (teleology, reification, impossible counterfactuals) without requiring committee members to be experts in Qing economics or Ottoman tax farming. It operationalizes the philosophical requirement that a *foil* must be relevant and the historical requirement that *units* must be comparable.

  **The Weakest Step: Test 3 (The Foil Viability Check)**
  *   **Reason:** This step requires the most historical knowledge. Non-specialists may not know if "Q" was truly a candidate for "X." For example, a committee member might mistakenly think the Ottoman Empire *never* had a chance at industrialization due to religion, failing a viable title.
  *   **Mitigation:** I included the "Non-Specialist Heuristic" (Is there a literature on Q's failure?). If there is a debate, the foil is viable. If there is silence or consensus on impossibility, it is not. However, this still relies on the committee knowing *that* a debate exists.
  *   **Risk:** You may accidentally reject a novel but valid question because the committee assumes the outcome was inevitable. This is why the "Handoff" to a specialist at Test 4 is crucial; if a title passes 1 and 2, err on the side of letting a specialist judge 3 and 4.

  ### Summary for the Committee
  1.  **Define the Thing:** Is "X" real or a vibe?
  2.  **Match the Units:** Are P and Q the same size/type?
  3.  **Check the Foil:** Could Q have actually done X?
  4.  **Check the Cause:** Can we explain this without "culture"?
  5.  **Handoff:** If it passes 1–3 but looks risky on 4, let a specialist decide.
