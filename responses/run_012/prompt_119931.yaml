prompt: |-
  I'm applying for a two-page internal grant proposal that would buy me one semester of research time, and I want it built around a half-formed idea. The standard verdict on Kavka's toxin puzzle — the offer of a fortune if at midnight you sincerely intend to drink a toxin the next day, the money being paid whether or not you then drink — is that the agent cannot form the intention, because once the money is banked drinking would be pointless. But that verdict assumes the agent is certain of her own future conduct, and real agents have base rates on themselves: I know that I sometimes carry through on pointless resolutions out of stubbornness, or a wish not to have taken something for nothing, and I can put a rough number on it. So my question is whether an intention can be sincerely formed on the basis of a statistical self-prediction of that kind, or whether what gets formed is only a forecast dressed as a commitment — and, on either answer, whether the impossibility verdict survives the admission of self-uncertainty or turns out to rest on an idealization of perfect self-knowledge. I also want a second prong: it should matter why the agent expects to drink, since expecting to drink because one may be overwhelmed by a compulsion is a different position from expecting to drink because one may, at the moment, find a reason one cannot now foresee, and only the latter looks as though it could underwrite an intention rather than merely forecast a lapse. Write the proposal: state the question so that it has a determinate answer, explain why the existing treatments of the puzzle leave it open, set out the method and why it beats the obvious alternatives of formalizing the case or reviewing the literature, say what a result would look like and what would count as the project failing, and keep the scope honest for one semester. I'll add the citations myself.
