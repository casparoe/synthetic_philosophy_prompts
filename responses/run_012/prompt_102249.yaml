answer: |-
  Consider a freelancer who at $t_1$ signs a monthly software subscription (\$50) preferring Access > No Access, knowing that at $t_2$ a client demand will flip her preference to Premium (\$100) and at $t_3$ back to Monthly, incurring two switch fees (\$20 each) that leave her at $t_4$ with Monthly Access but \$40 less than if she had stayed Monthly throughout. She could precommit at $t_1$ by buying an Annual License (\$550) which forbids downgrading, but she rejects this because the Annual License restricts her ability to cancel entirely if she loses her income, a risk she values avoiding more than the certain \$40 loss from the switching fees, even though she accurately predicts she will not exercise that cancellation option.

  **Analysis**

  The **standard synchronic account** judges the agent rational at every node: at $t_1$ the flexible monthly plan maximizes expected utility (accounting for income risk); at $t_2$ and $t_3$ the switches maximize utility given the new client demands. There is no irrationality, only expensive preference changes. A **resolute or diachronic account** argues the agent is irrational for failing to execute her $t_1$ plan (staying Monthly) to avoid the dominated outcome; rationality requires binding oneself to the optimal long-term plan regardless of interim preference shifts. The **sophisticated chooser**, knowing her preferences will flip, calculates at $t_1$ that the cost of the "safe" precommitment (Annual License) exceeds the cost of the "pump" (Switch Fees), so she knowingly accepts the fees as the price of flexibility.

  The feature doing the work is the **precommitment cost** (specifically, the risk/cost of the binding contract relative to the pump loss). If you remove this—making precommitment free or cheaper than the fees—the sophisticated agent precommits and the pump vanishes. If you remove the **preference flip**, there is no motivation to switch, and it becomes a standard consumption choice. If you remove the **sophistication** (making her naive), she enters the pump unaware, but the outcome is the same; sophistication merely changes her expectation of the loss, not the loss itself.

  Someone who thinks **diachronic rationality is just synchronic rationality at each time** (e.g., a standard economist or Humean) would attack the case by denying the normative force of the "dominated outcome." They would argue that since the agent's utility function legitimately changed between $t_1$ and $t_2$, comparing welfare across time is category error; the agent maximized utility at every moment she existed, so she was perfectly rational, and the "money pump" is merely a description of market prices for flexibility, not a failure of reasoning.
