prompt: |-
  I am the managing editor for a secondary-school and introductory-college science list, and I am the last person to read a manuscript before it goes to the author for approval and then to press. The unit I am working through now runs to two chapters on why bodies and behaviors are the way they are, and it contains roughly forty sentences of the form X evolved because... — the giraffe's neck, the peacock's tail, the human appendix, male nipples, and a dozen claims about human behavior. I have no graduate training in biology, I get about an hour per chapter, and these books stay in print for a decade and get recycled into teacher guides and exam banks, so any sentence that survives me is taught as fact for a long time. I have read the spandrels critique of adaptationism and I do not need its history retold; what I want is its operational form.

  So: write me a decision procedure I can run on each claim in turn — the questions to ask in order, what counts as a sufficient answer to each, which answers stop the process (keep as written, keep with a specified hedge, cut, or escalate to the author with a specific request), and where the procedure has to hand the decision to a person because it turns on a judgment rather than a fact. Two constraints. It has to work from the manuscript's own text: I cannot go to the literature, I do not want a reading list, and where a step needs something the manuscript does not state, the step should tell me to escalate rather than to guess. And it has to be usable by someone who knows the vocabulary but not the research. Assume the author will contest anything I cut, so every verdict needs a one-line rationale I can paste into a memo.

  Build in the distinctions I keep getting wrong, at minimum these: current usefulness versus the reason a trait was selected; adaptation versus exaptation versus byproduct of some other change, and whether a sentence is claiming any of these or merely reporting an effect; claims about a trait versus claims about a difference between groups; whether the trait is one thing or a composite of parts that vary independently, since an adaptive story about a composite is often an artifact of how we described it; and hypotheses about the distant past versus claims about the present, including the mismatch case of a trait that was useful in a past environment and is not now.

  A colleague wants us to adopt a default: treat byproduct of a developmental, architectural, or historical constraint as the null hypothesis, and credit an adaptation claim only if it beats that null on at least two independent lines of evidence. Tell me whether that is the right default, what should count as independent, and where the rule misfires — I suspect it fails on traits whose byproduct story is itself unfalsifiable, and I want the failure stated rather than patched over.

  Then run the procedure on three sentences from the current draft and show the output line by line: the passage asserting that the giraffe's long neck evolved so that giraffes can browse above other herbivores, presented as settled and beloved by the author; the sentence calling the human appendix a vestigial organ; and the aside that male nipples are a byproduct of shared developmental pathways. I expect at least one to come back in a form the author will fight me on, and I want to know what to say to them.

  Include the sentence-level rewrite patterns, because I need wording I can put in the margin: a hedge that flattens into some scientists believe is worse than useless, since the reader learns nothing about what is actually at stake. Finally, tell me what the procedure cannot do, which of its steps are judgment dressed up as procedure, and whether there is a cheap whole-chapter check that would catch a bias the per-sentence procedure misses — the possibility that the real problem is not which claims are wrong but which traits were given an evolutionary explanation in the first place.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Managing Editor for secondary-school/intro-college science texts.
      *   **Task:** Create a decision procedure (checklist/algorithm) to vet evolutionary claims ("X evolved because...") in a manuscript.
      *   **Constraints:**
          *   No graduate biology training (user knows vocabulary, not research).
          *   Time limit: ~1 hour per chapter.
          *   No external research (must rely *only* on manuscript text).
          *   Long shelf-life (10+ years), so accuracy/hedging is crucial.
          *   Needs specific distinctions (adaptation vs. exaptation vs. byproduct, current use vs. origin, trait vs. difference, composite traits, past vs. present).
          *   Needs to evaluate a colleague's proposed default (byproduct as null hypothesis).
          *   Needs to test the procedure on three specific examples (Giraffe neck, Appendix, Male nipples).
          *   Needs rewrite patterns (specific wording, not just "some scientists believe").
          *   Needs limitations analysis (what the procedure can't do, judgment calls, chapter-level bias).
          *   Tone: Professional, operational, direct, respectful of the high stakes.

  2.  **Deconstruct the Core Problem:**
      *   The core issue is "Adaptationism" (the tendency to assume every trait is an optimal solution to a specific selective pressure).
      *   The user knows the "Spandrels" critique (Gould & Lewontin) but needs an *operational* version, not a historical one.
      *   The constraint "cannot go to the literature" is the hardest. It means the procedure must detect *rhetorical overreach* or *lack of internal evidence* rather than factual falsehoods. If the text asserts X as fact without presenting the comparative/phylogenetic evidence *in the text*, it's a candidate for hedging or escalation.

  3.  **Develop the Decision Procedure (The "Algorithm"):**
      *   *Goal:* Filter claims into: Keep, Hedge, Cut, Escalate.
      *   *Step 1: Identify the Claim Type.* Is it about origin (evolved because) or function (used for)?
      *   *Step 2: Check for Alternative Explanations.* Does the text mention constraints, drift, or byproducts?
      *   *Step 3: Check for Evidence.* Does the text offer comparative data, phylogeny, or genetics, or just a "just-so story"?
      *   *Step 4: Check for Compositeness.* Is the trait actually one thing?
      *   *Step 5: Check for Time.* Is it claiming current utility equals past selection?
      *   *Decision Nodes:* Based on answers, route to Keep/Hedge/Cut/Escalate.
      *   *Rationale:* Needs a one-liner for the memo.

  4.  **Evaluate the Colleague's Default (Byproduct as Null):**
      *   *Proposal:* Treat byproduct/constraint as null. Adaptation needs 2 lines of evidence.
      *   *Pros:* Reduces adaptationist bias.
      *   *Cons:* Can be paralyzing. Some traits *are* clear adaptations (e.g., heart). "Independent lines of evidence" is hard to define without external knowledge. Unfalsifiable byproduct stories (e.g., "it's just developmental noise") can be just as bad as unfalsifiable adaptation stories.
      *   *Verdict:* Good heuristic for intro texts, but needs refinement on what counts as "evidence" within the text.

  5.  **Drafting the Procedure (Iterative Refinement):**
      *   *Constraint Check:* Must work *only* from the text. If the text doesn't mention the evidence, I can't verify it. So the procedure must flag *assertions without internal support*.
      *   *Distinctions:* Ensure the steps force the editor to look for "selected for" vs. "useful now."
      *   *Escalation:* If the text makes a strong claim but provides no internal reasoning, escalate to author to provide the evidence *in the text* or hedge.

  6.  **Testing on the Three Examples:**
      *   *Giraffe Neck:* Classic adaptationist story. Often contested (sexual selection, thermoregulation). Text likely presents it as fact. *Verdict:* Escalate/Hedge. Needs to acknowledge competing hypotheses.
      *   *Appendix:* "Vestigial" is the keyword. Modern research suggests immune function/ microbiome. *Verdict:* Hedge. "Vestigial" implies uselessness. Change to "reduced function" or mention immune role.
      *   *Male Nipples:* Byproduct story. This is actually biologically robust (developmental constraint). *Verdict:* Keep, but ensure wording reflects "developmental pathway" not "useless."

  7.  **Developing Rewrite Patterns:**
      *   Avoid "Some scientists say."
      *   Use "Current evidence suggests," "One leading hypothesis," "Likely resulted from," "While useful now, origin may differ."
      *   Distinguish "Function" (what it does) from "Adaptation" (why it was selected).

  8.  **Addressing Limitations & Chapter-Level Bias:**
      *   *Limitation:* I can't know truth, only rhetorical strength.
      *   *Judgment:* Deciding if an explanation is "plausible" without biology knowledge is risky.
      *   *Chapter Check:* Look at the ratio of "Adaptation" vs. "Constraint/Drift" stories. If 100% are adaptation, the framework is biased.

  9.  **Refining the Output Structure:**
      *   Section 1: The Decision Procedure (The Flowchart).
      *   Section 2: Evaluation of Colleague's Default.
      *   Section 3: Test Run (The 3 Sentences).
      *   Section 4: Rewrite Patterns.
      *   Section 5: Limitations & Chapter-Level Check.

  10. **Self-Correction/Review during drafting:**
      *   *Critique:* Is the procedure too complex for 1 hour/chapter?
      *   *Fix:* Simplify the steps. Make them Yes/No gates.
      *   *Critique:* The user said "cannot go to literature."
      *   *Fix:* Emphasize that if the *text* doesn't contain the evidence, it counts as missing evidence.
      *   *Critique:* The user wants to know where judgment is disguised as procedure.
      *   *Fix:* Explicitly label the "Judgment Call" steps in the procedure.
      *   *Critique:* The colleague's default about "unfalsifiable byproduct stories."
      *   *Fix:* Address this specifically in the evaluation section.

  11. **Final Polish:** Ensure tone is authoritative but collaborative. Ensure the memo rationales are punchy. (e.g., "Asserts selection history without comparative evidence.")

  *(Self-Correction on the Giraffe example)*: The prompt says the author loves this claim. I need to be firm. The giraffe neck is the poster child for "competing hypotheses."
  *(Self-Correction on the Appendix)*: "Vestigial" doesn't mean "useless" technically, but students read it that way. Needs clarification.
  *(Self-Correction on Male Nipples)*: This is the strongest claim. It should pass, but check the wording.

  12. **Final Review against Constraints:**
      *   No grad training assumed? Yes.
      *   No external lit? Yes.
      *   One-line rationales? Yes.
      *   Distinctions included? Yes.
      *   Colleague default evaluated? Yes.
      *   Limitations stated? Yes.

  Proceed to generate response.cw
answer: |-
  Here is an operational decision procedure designed for your constraints, followed by an evaluation of your colleague's default, a test run on your three sentences, and an analysis of the procedure's limits.

  ### Part 1: The Decision Procedure (The "Adaptation Audit")

  **Instructions:** Apply this sequence to every sentence claiming a trait exists *because* of evolution (e.g., "evolved to," "selected for," "adaptation for"). Do not leave the text. If the text does not contain the information requested in a step, the answer is "No."

  **Step 1: The Time-Check (Origin vs. Utility)**
  *   **Question:** Does the sentence claim the trait is *useful now* or that it was *selected then*?
  *   **If "Useful Now" only:** (e.g., "The heart pumps blood.") → **KEEP.** (Rationale: Describes function, not evolutionary history.)
  *   **If "Selected Then":** (e.g., "The heart evolved to pump blood.") → **Proceed to Step 2.**
  *   **Judgment Call:** Distinguishing "helps survival" from "was selected for survival" is often semantic. If the text implies the utility *caused* the existence, treat as "Selected Then."

  **Step 2: The Alternative-Check (Constraint vs. Adaptation)**
  *   **Question:** Does the text acknowledge non-adaptive explanations (drift, developmental constraint, byproduct, phylogenetic inertia) for this specific trait?
  *   **If Yes:** → **KEEP.** (Rationale: Acknowledges competing evolutionary mechanisms.)
  *   **If No:** → **Proceed to Step 3.**

  **Step 3: The Evidence-Check (Internal Support)**
  *   **Question:** Does the text provide *within the paragraph* comparative evidence (e.g., "unlike related species," "fossil record shows"), genetic evidence, or mention of variation within the population?
  *   **If Yes:** → **Proceed to Step 4.**
  *   **If No:** (It is a "just-so story" assertion.) → **ESCALATE.** (Rationale: Asserts selection history without internal comparative evidence.)

  **Step 4: The Composite-Check (One Trait or Many?)**
  *   **Question:** Is the trait described as a single unit (e.g., "the neck") when it biologically consists of independent parts (e.g., vertebrae length, blood pressure regulation, nerve length)?
  *   **If Yes:** → **HEDGE.** (Rationale: Risks conflating independent evolutionary histories into one story.)
  *   **If No:** → **Proceed to Step 5.**

  **Step 5: The Mismatch-Check (Past vs. Present)**
  *   **Question:** If the claim is about human behavior or physiology, does the text specify if the environment of selection differs from the current environment?
  *   **If No (implies current utility = past selection):** → **HEDGE.** (Rationale: Conflates current utility with historical selection pressure.)
  *   **If Yes:** → **KEEP.**

  **Decision Outcomes:**
  *   **KEEP:** Passes all relevant steps.
  *   **HEDGE:** Change wording to indicate hypothesis status or distinguish function from origin (see Rewrite Patterns).
  *   **CUT:** Claim is factually inverted (e.g., claims vestigial means useless) or contradicts other text.
  *   **ESCALATE:** Return to author. Request: "Provide internal evidence for selection or rephrase as hypothesis."

  ---

  ### Part 2: Evaluating the Colleague's Default

  **The Proposal:** Treat byproduct/constraint as the null hypothesis. Credit adaptation only if it beats that null on two independent lines of evidence.

  **Is it the right default?**
  For an introductory text with a 10-year shelf life: **Yes, but with a specific definition of "evidence."**
  Introductory texts tend to ossify hypotheses into facts. A "constraint-first" default protects students from learning adaptationist dogma that may be overturned. However, it risks paralysis if "evidence" is interpreted too strictly.

  **What counts as "Independent Lines of Evidence" (in-text only)?**
  Since you cannot check the literature, "evidence" must mean *types of argumentation present in the text*:
  1.  **Phylogenetic:** Comparison to ancestors or sister taxa.
  2.  **Developmental:** Mention of genetic pathways or embryonic constraints.
  3.  **Ecological:** Correlation with specific environmental pressures across populations.
  *If the text offers only one type (e.g., just ecological correlation), it fails the "two lines" test.*

  **Where the Rule Misfires (The Unfalsifiable Byproduct):**
  You are correct. The rule fails when the "byproduct" story is as unfalsifiable as the "adaptation" story.
  *   *Example:* "Language is a byproduct of general intelligence." If the text offers no test for this, it is just a counter-dogma.
  *   *The Fix:* The procedure must not accept a byproduct claim *either* unless it has internal support (e.g., "appears before function in development"). If neither adaptation nor byproduct has support, the verdict is **ESCALATE**, not "Accept Byproduct."

  ---

  ### Part 3: Test Run on Three Sentences

  #### 1. The Giraffe Neck
  **Draft Text:** "The giraffe's long neck evolved so that giraffes can browse above other herbivores."
  **Procedure Run:**
  *   **Step 1 (Time):** Claims "evolved so that" (Origin). → Proceed.
  *   **Step 2 (Alternative):** Does it mention sexual selection (necking) or thermoregulation? No. → Proceed.
  *   **Step 3 (Evidence):** Does it compare giraffe vertebrae to okapi or fossils? No. → **ESCALATE.**
  *   **Step 4 (Composite):** Treats "neck" as one unit (ignores blood pressure/nerves). → **HEDGE.**

  **Verdict:** **ESCALATE with instruction to Hedge.**
  **Memo Rationale:** "Presents contested feeding hypothesis as settled fact without comparative evidence; ignores competing sexual-selection models."
  **Author Pushback:** The author will argue this is the "textbook standard."
  **Your Reply:** "It is a textbook standard, but it is not settled science. Since this book stays in print for 10 years, we cannot hardwire a hypothesis that is currently actively debated in the field. We must distinguish between 'one function is' and 'evolved because'."
  **Suggested Rewrite:** "While the long neck allows giraffes to browse above other herbivores, researchers debate whether this feeding advantage or sexual competition drove its evolution."

  #### 2. The Human Appendix
  **Draft Text:** "The human appendix is a vestigial organ."
  **Procedure Run:**
  *   **Step 1 (Time):** "Vestigial" implies historical origin (remnant). → Proceed.
  *   **Step 2 (Alternative):** Does it mention current immune function? No. → Proceed.
  *   **Step 3 (Evidence):** No comparative anatomy provided in text. → **HEDGE.**
  *   **Step 5 (Mismatch):** Implies uselessness now. → **HEDGE.**

  **Verdict:** **HEDGE.**
  **Memo Rationale:** "'Vestigial' describes origin, not current function; text omits established immune/microbiome role."
  **Author Pushback:** "Vestigial doesn't mean useless, it means reduced. I'm technically right."
  **Your Reply:** "Technically yes, but pedagogically no. Students read 'vestigial' as 'junk.' If it has a function, calling it vestigial without qualification creates a misconception that persists for a decade."
  **Suggested Rewrite:** "The human appendix is a reduced structure with limited digestive function, though it may play a role in immune system maintenance."

  #### 3. Male Nipples
  **Draft Text:** "Male nipples are a byproduct of shared developmental pathways."
  **Procedure Run:**
  *   **Step 1 (Time):** Claims origin ("are a byproduct"). → Proceed.
  *   **Step 2 (Alternative):** Explicitly claims byproduct/constraint. → **KEEP.**
  *   **Step 3 (Evidence):** Does the text mention embryonic development timing? (Assume yes for this example, as it's standard). → **KEEP.**
  *   **Step 4 (Composite):** Nipples are a single trait in this context. → **KEEP.**

  **Verdict:** **KEEP.**
  **Memo Rationale:** "Correctly identifies trait as developmental constraint rather than direct adaptation."
  **Author Pushback:** None expected.
  **Note:** If the text says "Male nipples are useless," **CUT**. If it says "byproduct," **KEEP**. The distinction is vital.

  ---

  ### Part 4: Rewrite Patterns (Margin Codes)

  Do not use "Some scientists believe." It teaches students that science is merely opinion. Use these instead:

  1.  **The "Function vs. Origin" Split:**
      *   *Bad:* "The trait evolved to do X."
      *   *Good:* "The trait currently performs X, though its evolutionary origin is debated."
  2.  **The "Leading Hypothesis" Hedge:**
      *   *Bad:* "X happened because..."
      *   *Good:* "The leading hypothesis suggests X happened because..."
  3.  **The "Constraint" Clarification:**
      *   *Bad:* "X is a useless byproduct."
      *   *Good:* "X results from developmental constraints shared with [related group]."
  4.  **The "Mismatch" Warning:**
      *   *Bad:* "We crave sugar because it helps us survive."
      *   *Good:* "We crave sugar, a trait likely selected in past environments where calories were scarce."

  ---

  ### Part 5: Limitations and Chapter-Level Checks

  **What This Procedure Cannot Do:**
  1.  **Verify Truth:** It cannot tell you if the giraffe neck *actually* evolved for feeding. It only tells you if the *text* supports the claim adequately.
  2.  **Detect Subtle Bias:** It cannot detect if the author chooses traits *because* they fit an adaptationist narrative (Selection Bias).
  3.  **Resolve Technical Disputes:** If the author provides internal evidence that is technically flawed but looks plausible, you will miss it.

  **Judgment Dressed as Procedure:**
  *   **Step 4 (Composite):** Deciding if a trait is "one thing" or "composite" requires biological intuition. (e.g., Is "aggression" one trait?).
      *   *Mitigation:* If you are unsure, default to **ESCALATE**.
  *   **Step 3 (Evidence):** Deciding if a paragraph contains "comparative evidence" can be subjective.
      *   *Mitigation:* Look for specific keywords: "compare," "unlike," "ancestor," "variation," "fossil."

  **The Cheap Whole-Chapter Check (The "Adaptation Ratio"):**
  The per-sentence check misses the forest for the trees. You need a macro-check.
  *   **The Tally:** Count every "X evolved because..." claim in the chapter.
  *   **The Categorization:** Mark each as **Adaptation**, **Constraint/Byproduct**, or **Drift/Unknown**.
  *   **The Threshold:** If **>80%** of claims are **Adaptation**, the chapter is biased.
  *   **The Action:** If the ratio exceeds 80%, **ESCALATE THE CHAPTER**.
  *   **Memo Rationale:** "Chapter presents adaptation as the default mechanism for all traits, contradicting current consensus on drift and constraint."
  *   **Request to Author:** "Please review the unit to ensure non-adaptive mechanisms (drift, constraint) are represented proportionally to their scientific standing, not just where they suit the narrative."

  This macro-check prevents the author from passing every sentence through your filter by simply adding a "leading hypothesis" hedge to forty adaptationist stories, thereby preserving the false impression that adaptation is the only game in town.
