  # Session Plan: The Weight of "We"
  **Topic:** Joint Action (Reductionism vs. Non-Reductionism)
  **Time:** 90 Minutes
  **Class Size:** 16 Students
  **Materials:** Whiteboard/chalkboard, markers/chalk. No handouts.
  **Prep:** Before class, secretly recruit **one student** (let's call them the "Confederate") to participate in Stage 3 according to specific instructions provided below.

  ## Core Philosophical Problem
  The session targets the gap between **Interlocking Individual Intentions** (Reductionism: Bratman, Tuomela) and **Joint Commitment/We-Intention** (Non-Reductionism: Gilbert, Searle).
  *   **Stage 1** simulates the Reductionist ideal: Common Knowledge + Individual Intentions = Coordinated Outcome.
  *   **Stage 2** introduces the Joint Commitment: Explicit agreement to act *as a body*.
  *   **Stage 3** tests the Normative Residue: If the action is identical but the commitment is private/hollow, is the "We" broken?

  ---

  ## Minute-by-Minute Timeline

  ### 0:00 – 0:05 | Introduction & Setup
  *   **Action:** Clear the room center. Push chairs to the perimeter to create a large open floor space.
  *   **Instructor Script:** "Today we are not talking about joint action yet. We are going to do it. We have three tasks. Your goal in all three is identical: **Form a single-file line against the back wall, ordered by height, shortest to tallest.**"
  *   **Constraint:** Write the Goal on the board. Do not explain *why* yet.

  ### 0:05 – 0:20 | Stage 1: The Reductionist Mirror
  *   **The Frame:** "In this round, there is no 'group.' There are only individuals. Here is the situation: You all want to finish this seminar efficiently. You all know that forming this line is the condition for moving to the next segment. You all know that everyone else knows this. You have common knowledge of the goal and individual reasons to achieve it. You may not speak. Go."
  *   **The Action:** Students move to form the line. Because the goal is simple and common knowledge is high, they will likely succeed quickly (within 2-3 minutes).
  *   **The Interrogation (10 mins):** Once lined up, ask them to freeze.
      *   "Did we do that together?"
      *   "List the ingredients present." (Students will list: I intended to line up, I knew you intended to, I knew you knew I intended...)
      *   "Did it feel like a *joint* action, or just 16 parallel actions that happened to mesh?"
      *   *Expected Feeling:* It feels mechanical. Efficient, but hollow.
  *   **Reset:** Have them return to chairs.

  ### 0:20 – 0:35 | Stage 2: The Joint Commitment
  *   **The Frame:** "Reset. Now, we change the instruction. I am not telling you to do it. I am asking you to decide. Before you move, you must agree, out loud, to do this *as a group*. You must form a 'We' that intends to line up. You may speak to negotiate this commitment. Once you agree, execute."
  *   **The Action:** Students will hesitate. Someone will likely say, "Shall we do this?" Others must affirm. There will be a moment of *agreement* before *movement*. They form the line again.
  *   **The Interrogation (10 mins):** Freeze them again.
      *   "What was different that time?"
      *   "The outcome is identical. The individual intentions are identical. What changed?"
      *   *Expected Feeling:* It felt heavier. There was a moment of obligation. If someone had refused after agreeing, it would have felt like a betrayal, not just a change of plan.
  *   **Reset:** Return to chairs.

  ### 0:35 – 0:50 | Stage 3: The Normative Residue
  *   **The Frame:** "Reset. We will do Stage 2 again. Form the joint commitment. Agree to line up as a group."
  *   **The Twist:** The **Confederate** participates in the agreement verbally ("Yes, let's do it") and physically moves to their correct spot in the line.
  *   **The Reveal:** Once the line is formed, ask the Confederate to speak.
      *   **Confederate Script:** "I stood here because I wanted to stretch my legs. I didn't care about the group agreement. I just happened to want to be in this spot."
  *   **The Interrogation (15 mins):** Keep the class in the line.
      *   "The outcome is perfect. The Confederate fulfilled their part. Is the 'We' intact?"
      *   "Does the rest of the group feel something was violated, even though the task succeeded?"
      *   "Is the Confederate answerable to you? Why?"
      *   *Goal:* Elicit the sense that the *obligation* existed independently of the *action*. The Confederate didn't just fail to act; they failed to *commit*.

  ### 0:50 – 1:30 | Debrief & Theoretical Mapping
  *   **Action:** Return to chairs. Whiteboard work.
  *   **Discussion:** Map the three stages to the literature.

  ---

  ## Debrief Guide: Mapping Experience to Theory

  Use the whiteboard to draw three columns corresponding to the stages.

  | Feature | Stage 1 (Parallel) | Stage 2 (Joint) | Stage 3 (Hollow) |
  | :--- | :--- | :--- | :--- |
  | **Intention** | "I intend that we line up" (Interlocking) | "We intend to line up" (Primitive/Joint) | "I intend to line up" (Private) |
  | **Knowledge** | Common Knowledge of individual goals | Mutual Recognition of Commitment | Concealed Private Motive |
  | **Normativity** | Prudential (I want to finish) | Obligation (I owe it to the group) | Betrayal (I broke the bond) |
  | **Philosopher** | **Bratman / Reductionist** | **Gilbert / Non-Reductionist** | **The Problem Case** |

  **Key Discussion Points:**
  1.  **Stage 1 (Bratman):** Show that Bratman's conditions (interlocking intentions + common knowledge) were met. Ask: *Why did it feel inert?* The Reductionist says nothing is missing. The students should now argue that something *phenomenological* or *normative* is missing.
  2.  **Stage 2 (Gilbert):** Highlight the moment of *agreement*. This is the "Joint Commitment." It creates a "pool of wills." The obligation arises from the commitment, not the goal.
  3.  **Stage 3 (The Residue):** This is the crux. If Reductionism is true, Stage 3 is successful (the intention was to line up, the lining up happened). If Non-Reductionism is true, Stage 3 is a failure of the *jointness*, even if the *outcome* succeeded. The feeling of betrayal confirms the existence of a normative bond that individual intentions cannot explain.

  ---

  ## Troubleshooting: What Will Go Wrong

  **1. Stage 1 Fails (Chaos)**
  *   **Risk:** Students talk in Stage 1 or fail to line up silently, making the "Reductionist" conditions messy.
  *   **Fix:** If they talk, stop them and say, "Note that you are negotiating individual deals, not a group commitment." If they fail to line up, point out that without a 'We', coordination costs are higher. This actually *helps* the argument (Joint commitment reduces transaction costs).

  **2. Stage 3 Falls Flat (No Betrayal)**
  *   **Risk:** The class laughs at the Confederate and says, "Who cares, the line is done."
  *   **Fix:** You must press the normative angle. Ask: "If we did this 10 more times, would you trust the Confederate?" "Did they have the *right* to change their mind without consulting the group?" Force them to see that the *authority* to act was claimed jointly, but exercised individually.

  **3. The "We" feels Artificial**
  *   **Risk:** Students feel the activity is contrived and resist the "feeling" data.
  *   **Fix:** Acknowledge the contrivance. "The stakes are low, which isolates the normative structure. In high-stakes scenarios (orchestras, armies, marriages), this residue is legally enforceable. Here, it is merely social."

  ---

  ## Limitations: What You Must Supply

  **1. The Ontological Leap**
  *   **Limitation:** The activity produces a *feeling* of difference, not a proof of ontology. Students can still argue, "The feeling is just a psychological illusion; Bratman is still right about the metaphysics."
  *   **Instructor Duty:** You must explicitly argue that the *normative residue* (the right to rebuke) is a datum that requires an ontological home. If there is an obligation, there must be a commitment-bearer. If it's not the individual, it must be the plural subject.

  **2. The "Private Reason" Nuance**
  *   **Limitation:** In Stage 3, the Confederate *did* intend to line up (to stretch). A Reductionist can argue the intention meshed.
  *   **Instructor Duty:** Clarify that the intention wasn't to *fulfill the agreement*, but to *perform the action*. The missing piece is the *reason for action* being the commitment itself. You must distinguish between *acting in accordance with* vs. *acting because of* the joint commitment.

  **3. Scalability of Intimacy**
  *   **Limitation:** 16 students is small enough to feel a "We." This doesn't scale to "The State" or "The Corporation."
  *   **Instructor Duty:** Use the debrief to ask how this scales. Does the "We" survive when we don't know each other? (Hint: Gilbert says yes, via institutional roles; Bratman says it gets complicated).

  ## Final Instruction to Instructor
  The success of Stage 3 depends entirely on the **Confederate**. Email them beforehand:
  > *"In the third round, agree to the plan loudly. Stand in the correct spot. But when asked, reveal you did it for a purely selfish reason unrelated to the group (e.g., 'I just wanted to be near the window'). Do not apologize. Act as if the group has no claim on your reasons."*

  If the Confederate apologizes, the normative residue vanishes. They must remain indifferent to the group's claim for the tension to hold.
