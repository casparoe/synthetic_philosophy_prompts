      *   **The 35-Hour Week (Aubry Laws):** Passed 1998-2000. Goal: Reduce unemployment (work sharing). Mechanism: Reduce hours, keep pay same (mostly), create RTT (*Réduction du Temps de Travail*) days. Reality: Intensification of work, flexibility for firms, bureaucratic nightmare, eventual softening/rollback.
      *   **The User's Suspicion:** Leisure as *recuperation* fits capitalism (recharging the battery). Leisure as *end in itself* challenges capitalism. If the 35-hour week was sold as "job sharing" (instrumental), it didn't challenge the *ethic* of work, just the *allocation* of it.
      *   **Karoshi:** Death from overwork. Japan is not Protestant. Yet, extreme work devotion exists. This suggests "Work Ethic" might be two things: 1. Specific theological anxiety (Weber's original point). 2. General modern disciplinary society (Foucault? Or just industrial capitalism's logic).

