          *   User's hypothesis: Policy failed because it framed leisure as *recuperation* (instrumental).
          *   Weberian Analysis: Weber agrees that rest for the sake of more work is acceptable. Rest for the sake of *enjoyment* is suspect.
          *   The 35-hour week was sold as "solidarity" (jobs for others), not "freedom" (life for self).
          *   *Where the lens breaks:* Weber doesn't necessarily predict policy *failure*. He predicts cultural *resistance*. The policy didn't fail because of the ethic; it failed because the *capitalist rationalization* absorbed it. Firms used RTT to intensify work. The ethic survived *inside* the 35 hours.
          *   *Hours vs. Meaning:* Weber is vague on hours. It's about *intensity* and *attitude*. You can work 35 hours with the spirit of a monk or 60 hours as a sluggard (if disorganized). The ethic is about *rationality*, not the clock.

