              1.  *Protestant Anxiety:* "Am I saved?" (Work as proof).
              2.  *Confession-Neutral Moralization:* "Time is money/Productivity is virtue." (Work as duty to the system).
          *   *France:* Resistance to 35-hour wasn't just Protestant ethic; it was also a defense of *status* and *income*.
          *   *Karoshi:* Shows the ethic detached from salvation, becoming pure systemic demand.
          *   *Conclusion on Contrast:* It exposes that we use "Work Ethic" for two things. Weber explains the *origin*, not necessarily the *current mechanics* in non-Protestant cultures.

      *   **Part 4: Where the Theory Falls Silent:**
