answer: |-
  This is a precise request for a sociological autopsy rather than an economic verdict. To settle what you and your friend were disagreeing about, we must treat the 35-hour week not as a balance sheet entry, but as a ritual attempt to renegotiate the moral contract of labor.

  Here is the case analysis through the lens of Max Weber's *The Protestant Ethic and the Spirit of Capitalism*, followed by the stress test against *karoshi*.

  ### Part I: The Mapping of Actors
  Weber argues that under the "Spirit of Capitalism," labor is no longer a mere necessity but a *calling* (*Beruf*). Time is money; idle time is sin. The 35-hour law (the Aubry Laws, 1998–2000) attempted to legislate a reduction in the arena where this calling is performed. Here is how the actors map onto the Weberian landscape:

  **1. The State (The Jospin Government)**
  *   **Stated Goal:** Reduce unemployment through work-sharing (*partage du travail*).
  *   **Weberian Position:** The State attempted to act as a rational administrator of the "Iron Cage." It treated labor hours as a finite resource to be redistributed.
  *   **What They Were Up Against:** The State assumed work was a *commodity* that could be sliced. Weber suggests work is a *moral duty*. By framing the reduction as a way to create *more* workers (instrumental), the State inadvertently reinforced the idea that everyone *must* work. It did not challenge the sanctity of labor; it merely tried to spread the burden. It failed to create a moral constituency because it offered no new *calling*, only a new schedule.

  **2. The Employers (MEDEF and Firms)**
  *   **Stated Goal:** Maintain competitiveness, flexibility, and cost neutrality.
  *   **Weberian Position:** Perfect alignment with the Spirit of Capitalism. For the capitalist, labor is an input to be optimized.
  *   **What They Were Up Against:** Nothing theological. They accepted the 35-hour limit only in exchange for "flexibility" (annualized hours, intensity).
  *   **Weberian Implication:** The ethic allows for rest *if* it increases long-term productivity. Employers used the RTT (*Réduction du Temps de Travail*) days to intensify work during the remaining 35 hours. They absorbed the policy into the logic of rationalization. The "spirit" remained intact; the clock just moved faster.

  **3. The Unions**
  *   **Stated Goal:** Protect wages, gain leisure time for members.
  *   **Weberian Position:** Ambivalent. They defended the worker's right to remuneration (the fruit of the calling) while advocating for time away from the calling.
  *   **What They Were Up Against:** The tension between the "traditionalist" desire for life and the "capitalist" necessity of income.
  *   **Weberian Implication:** Unions struggled to justify leisure as a *right* rather than a *concession*. In a Weberian frame, demanding less work looks like demanding less moral proof. They could not articulate a theology of leisure, only a sociology of rest.

  **4. The Workers**
  *   **Stated Goal:** More free time without pay loss.
  *   **Weberian Position:** The primary site of conflict.
  *   **What They Were Up Against:** The internalization of the work ethic.
  *   **Weberian Implication:** Many workers used the RTT days not for "idleness" (which generates anxiety) but for second jobs, domestic labor, or "productive" hobbies. The policy gave them time, but the ethic denied them the permission to waste it.

  ### Part II: Testing Your Suspicion
  **Your Hypothesis:** The policy failed to build a durable moral constituency because it defended leisure as *recuperation* (instrumental) rather than as an *end in itself* (intrinsic).

  **The Weberian Verdict:** Your suspicion is correct, but Weber would argue the failure was inevitable regardless of the rhetoric.

  1.  **Recuperation vs. Idleness:** Weber explicitly allows for rest if it serves the capacity to work. "Leisure as recuperation" is compatible with the Protestant Ethic; it maintains the vessel for the calling. However, "Leisure as an end in itself" is suspect. If the 35-hour week had been sold as "time to contemplate God" or "time to be human," it would have clashed directly with the Spirit of Capitalism, which views unmonetized time as waste.
  2.  **The Moral Constituency:** You are right that there was no durable constituency. Why? Because the policy did not offer a new *meaning* for the time, only a new *quantity*. Without a moral framework that validates non-work time (e.g., a civic duty to rest, or a religious duty to contemplate), the time becomes a vacuum. In the absence of a positive ethic of leisure, the old ethic of work rushes in to fill it.
  3.  **Where the Lens Breaks (Hours vs. Meaning):** This is the critical fracture in the theory. Weber's ethic is about the *intensity and orientation* of work, not the *duration*. A Calvinist can work 35 hours with the fervor of a monk, or 60 hours with the sloppiness of a traditionalist.
      *   **The Break:** Weber does not predict that reducing hours will fail. He predicts that reducing the *spirit* of work will fail. The 35-hour week failed to change the spirit; it merely compressed the hours. The resistance you observed wasn't just about the clock; it was about the *intensification* that followed. The ethic survived the policy by becoming more dense.
      *   **Explanation of Resistance:** The resistance is explained partly by the ethic (guilt over non-productivity), but largely by **plain self-interest** (fear of wage stagnation) and **bureaucratic friction** (the complexity of RTT). Weber has no name for the bureaucratic nightmare of tracking minutes; that is pure rationalization, which he predicts, but he doesn't account for the political fatigue it generates.

  **Conclusion on Suspicion:** The policy failed because it tried to solve a moral problem (the dominance of work in human life) with an administrative solution (hour counting), while using an instrumental justification (job creation) that reinforced the very ethic it sought to mitigate.

  ### Part III: The Stress Test (Karoshi vs. The 35-Hour Week)
  **The Contrast:**
  *   **France:** A legal attempt to cap work at 35 hours, met with resistance, workarounds, and eventual softening.
  *   **Japan:** *Karoshi* (death from overwork) is recognized legally as a compensable injury, acknowledging that the system kills workers through excess labor.

  **Does this confirm or qualify Weber?**
  It exposes that we are using "The Work Ethic" to describe two different phenomena.

  1.  **Phenomenon A: Protestant Anxiety (Weber's Specific Claim).**
      *   This is the anxiety about salvation. Work is a sign of election. Idleness is a symptom of damnation.
      *   *Application:* This fits the historical roots of Northern European capitalism. It does **not** fit Japan (Shinto/Buddhist/Confucian roots) or secular France.
      *   *Verdict:* If Weber is only describing Protestant anxiety, his theory cannot explain *karoshi*.

  2.  **Phenomenon B: Confession-Neutral Moralization of Time (The "Iron Cage").**
      *   This is the secularized spirit. Work is a duty to the system, the nation, or the firm. Time is a resource that must not be wasted.
      *   *Application:* This fits both France and Japan. In Japan, loyalty to the firm replaces loyalty to God. In France, the "career" replaces the "calling."
      *   *Verdict:* This confirms Weber's broader sociological prediction: the *shell* of the ethic remains after the *religious core* rots away.

  **The Crucial Distinction:**
  The contrast reveals that the "Work Ethic" is no longer a theological engine but a **disciplinary technology**.
  *   In **France**, the State tried to regulate the technology (the 35-hour law). The resistance came because the *culture* (the internalized ethic) was stronger than the *law*.
  *   In **Japan**, the *culture* (corporate feudalism + modern capitalism) absorbed the technology without regulation. *Karoshi* is the physical manifestation of the "Iron Cage" locked from the inside.

  **Does this confirm the Weberian picture?**
  It qualifies it. Weber argued the religious root would eventually die, leaving only the "specialists without spirit." *Karoshi* proves the specialists remain, but it suggests the "spirit" is not just Protestant anxiety. It is a **modern civic religion of productivity**.

  **Where the Theory Falls Silent:**
  1.  **The Body:** Weber speaks of the spirit, not the flesh. He does not account for *karoshi* because he assumes the asceticism is voluntary and spiritual. He does not predict literal death by spreadsheet.
  2.  **The State's Role:** Weber views the State as part of the rationalization process. He does not fully account for the State acting as a *counter-weight* to capitalist rationalization (as France attempted). He assumes the Iron Cage is total; the 35-hour week suggests the Cage can be dented, even if it springs back.
  3.  **Cultural Specificity:** Weber ties the ethic too tightly to Calvinism. The Japanese case shows that "duty to work" can be generated by Confucian loyalty or nationalist imperatives. The "ethic" is a feature of *industrial modernity*, not just *Protestant modernity*.

  ### Final Settlement
  You and your friend were arguing about economics, but you were actually arguing about **moral legitimacy**.

  *   **Your Friend (Moral Failure):** She is intuitively Weberian. She senses that the policy failed because it did not address the *sanctity* of work. It treated work as a burden to be shared, rather than a calling to be fulfilled. To her, the 35-hour week was an attempt to legislate against the human drive for purpose (as defined by capitalism), which feels like a moral failure.
  *   **You (Lump-of-Labor):** You are viewing work as a commodity. Weber would say you are operating *within* the Spirit of Capitalism, which is exactly his point. You see the fallacy because you see the math; she sees the failure because she sees the meaning.

  **The Synthesis:**
  The 35-hour week failed to build a moral constituency because it did not offer a **theology of leisure**. It offered a **logistics of labor**.
  *   **Weber's Prediction:** The ethic would resist any attempt to devalue work time.
  *   **The Reality:** The ethic did not resist the *hours*; it colonized them. Work became more intense.
  *   **The Break:** Weber cannot explain why the French State tried this in the first place (a rational attempt to break the cage) nor why *karoshi* exists in a non-Protestant culture (the cage is global, not confessional).

  **Verdict:** The policy was not a moral failure, nor an economic fallacy. It was a **sociological mismatch**. It tried to use legal rationality to solve a problem of cultural rationality. Weber explains why the culture won: because in the Iron Cage, time that is not worked is time that is lost, and no law can legislate away the sin of waste.
