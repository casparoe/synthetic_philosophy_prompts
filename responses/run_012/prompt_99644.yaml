answer: |-
  Your colleague's argument fails because no single interpretation of Wigner's slogan simultaneously sustains the ontological claim that mathematics is discovered and the pragmatic claim that pure mathematics is vindicated by future application.

  1.  **Selection-Effect Reading**
      (i) We designate as fundamental physics only those domains of nature we have successfully mathematized, ignoring the rest.
      (ii) Substantive but defensible thesis.
      (iii) Evidence for includes the historical exclusion of qualitative biology from "hard" science; evidence against includes the eventual mathematization of previously resistant fields like genetics.

  2.  **Historical-Inductive Reading**
      (i) Mathematical structures developed without physical motivation frequently find physical application later.
      (ii) Substantive but defensible thesis.
      (iii) Evidence for includes non-Euclidean geometry in general relativity; evidence against includes the vast corpus of number theory with no known physical model.

  3.  **Accuracy Reading**
      (i) Mathematics provides numerical predictions of physical constants with precision exceeding qualitative modeling.
      (ii) Substantive but defensible thesis.
      (iii) Evidence for includes the anomalous magnetic dipole moment in QED; evidence against includes chaotic systems where mathematical models diverge from physical trajectories.

  4.  **Fertility Reading**
      (i) Mathematical formalism necessitates the existence of physical entities or effects unknown at the time of formulation.
      (ii) Substantive and dubious thesis.
      (iii) Evidence for includes the prediction of the positron from the Dirac equation; evidence against includes cases where mathematical artifacts are discarded as unphysical gauge redundancies.

  5.  **Demand-for-Explanation Reading**
      (i) The phrase registers a gap in current philosophy rather than asserting a fact about the world.
      (ii) Platitude.
      (iii) Evidence for includes Wigner's own agnosticism about the cause; evidence against includes uses of the slogan as a premise rather than a conclusion.

  6.  **Direction-of-Explanation Reading**
      (i) Physical reality instantiates mathematical structures because physical reality is fundamentally mathematical.
      (ii) Substantive and dubious thesis (Pythagoreanism).
      (iii) Evidence for includes the derivation of particle properties from symmetry groups; evidence against includes the lack of independent access to mathematical reality apart from physical instantiation.

  The modifier "unreasonable" marks a deviation from a baseline expectation that human logical constructs and mind-independent physical causality should be independent variables. For the effectiveness to count as "reasonable," an account would need to demonstrate a causal or evolutionary link between the development of mathematics and the structure of the physical world, such as evolutionary psychology shaping our logic to match our environment or a selection effect filtering our scientific inquiries. The Selection-Effect Reading makes the effectiveness reasonable by definition, while the Direction-of-Explanation Reading makes it reasonable by positing identity, but the Historical, Accuracy, and Fertility readings maintain the unreasonableness by highlighting the contingency of the fit.

  In a world whose fundamental laws require nothing beyond elementary arithmetic and first-order logic, the Selection-Effect Reading becomes less surprising because arithmetic is presupposed by any logical description, collapsing the distinction between the map and the territory. The Historical-Inductive Reading becomes less surprising because basic arithmetic is universally applicable by definition, removing the miracle of complex analysis fitting continuous physics. The Accuracy Reading becomes neither more nor less surprising since arithmetic is exact by nature, though the scope of prediction shrinks. The Fertility Reading becomes less surprising because elementary logic lacks the structural richness to generate unforeseen ontological commitments like antimatter. The Demand-for-Explanation Reading becomes less pressing because the fit between logic and a logical world is intelligible by default. The Direction-of-Explanation Reading remains unchanged in its claim but loses its radical force, as asserting physics is arithmetic is less metaphysically loaded than asserting physics is complex Hilbert spaces. This tells us that the "unreasonable" weight of the slogan relies entirely on the contingency of complex, continuous mathematics mapping onto a continuous physical world; remove the complexity, and the mystery evaporates.

  Your colleague must have relied on the Historical-Inductive or Fertility readings to support the funding claim, as only these suggest that abstract work yields eventual physical cashflows. However, he must have relied on the Direction-of-Explanation Reading to support the discovery claim, as only ontological Pythagoreanism implies mathematics exists independently to be found. These conclusions do not follow from any single reading that survives the audit: the funding claim is compatible with instrumentalism (math is invented but useful), while the discovery claim is compatible with pure Platonism that denies physical application (math is discovered but abstract). To argue both from the same slogan requires conflating the pragmatic success of mathematical tools with the metaphysical status of mathematical objects, an incompatibility exposed by the thought experiment where arithmetic is effective but hardly "discovered" in a grand Platonist sense.
