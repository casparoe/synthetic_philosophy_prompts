prompt: |-
  Okay so I'm in this grad seminar on memory and history and I've hit a wall I'm hoping you can help me with. You should answer as a philosopher of history / memory-studies person who actually knows the literature but is happy to argue rather than just summarize. Please think out loud a bit before you commit to anything, and start with a short brainstorm of the main ways people have framed this, then give me your actual answer.

  Here's the setup. We spent two weeks on the standard view that collective memory isn't a storehouse at all — it's something a group keeps rebuilding out of present-day needs, so it's oriented toward identity and cohesion and it doesn't really care about accuracy. Fine, I get that. But my professor keeps contrasting it with what she calls "the archival norm": the idea that there's a body of evidence out there — documents, archaeology, physical traces, boring testimony — that has a claim on us exactly because it's indifferent to what we'd like to be true, and that when a community's memory and the record collide, the record should win. I want to compare these two ideas properly. Don't just define the terms; tell me what each one is actually committing to, where they're really disagreeing, and whether they're even rivals — because it smells to me like one is descriptive and the other is normative, and they might just be talking past each other.

  Then I want you to bring in a third thing, because a friend of mine defends a position she calls "mnemonic primacy" and I can't tell if its deep or just circular. The claim is roughly this: the past belongs to the community that carries it, and importing an outside standard of "accuracy" to overrule a community's memory is itself a political move dressed up as neutrality — so the record never legitimately overrides memory, it only seems to, because the people who wrote the record had more power. Is that a real third position, or is it just the identity-function view of memory with a normative conclusion smuggled in? And if it is coherent, how should the archival-norm person respond without just begging the question? I'm mostly trying to figure out which of the two original ideas I should actually believe when they conflict, so please land somewhere concrete at the end instead of saying "it depends." Sorry for the wall of text, this has been bugging me for weeks.
