answer: |-
  1. Start with the dial set so high that everyone agrees the itches outweigh the torture, then lower N step-by-step until the group fractures, forcing each participant to mark exactly where their principle breaks. This establishes the continuity premise before introducing variants, ensuring they see the sorites structure rather than just jumping to the controversial endpoint.
  2. Once the baseline fracture is visible, run the imperceptible harm variant to test thresholds, then the single-person cumulative variant to isolate distributional concerns, and finally the benefits reversal to check for symmetry in their aggregation principles. Each variant resets the dial but relies on the previous stopping point to show whether their justification holds across different contexts of harm and benefit.
  3. When they claim the itches are too small, point out that their dial already stopped above zero, and when they reject utilitarianism, show that the utility monster and population puzzles emerge from the same aggregation logic they just used. Meet the threshold objection during the imperceptible variant by asking if a hair's breadth difference in severity truly changes moral status from everything to nothing, revealing that a zero-count threshold is not a costless escape.
  4. End by asking whether they deny that small harms add up, deny that there is a sharp line where they start counting, or accept that enough itches really do outweigh fifty years of torture. This forces them to choose which horn of the trilemma they embrace rather than allowing them to rest in the intuition that the verdict is simply false.
  5. State clearly that you will not solve the puzzle or defend utilitarianism, but only map the logical costs of their intuitive refusals. This prevents them from expecting a resolution and keeps the focus on the structural commitment required by their dial settings.
