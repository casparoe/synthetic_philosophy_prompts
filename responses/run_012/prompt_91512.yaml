answer: |-
  Here is the consistency audit you asked for. You were right to suspect that one commitment is doing too much work, and your hunch about the fault line between (2) and (3) is correct, though the damage extends further than you realized.

  Here is the ranking of tensions by severity, followed by the diagnosis of the "false" tension with your friend, and finally the specific revision that fixes the system.

  ### 1. The Tension Ranking

  **Severity: FATAL — (2) vs. (3)**
  *   **The Conflict:** Claim (2) states that the state of the world produced by a decision settles its rightness "full stop." Claim (3) states that some acts are wrong *no matter how the arithmetic comes out*. These are logically incompatible. You cannot hold that outcomes are the *sole* determinant of rightness while simultaneously holding that outcomes are *insufficient* to justify certain acts.
  *   **What Must Give:** One of these definitions of "right" has to go. You cannot be a pure act-consequentialist (2) and hold absolute deontological constraints (3).
  *   **The Cost:**
      *   If you drop **(3)**: You save your ethical theory's elegance but lose your moral intuition. You must admit that torturing the kid *is* right if the numbers favor it. This makes your "Dirty Hands" position collapse into standard utilitarianism, where the hands aren't dirty, they're just clean and calculating.
      *   If you drop **(2)**: You lose the "full stop" clarity of consequentialism. You have to admit that political rightness is not solely a function of outcomes.

  **Severity: HIGH — (2) vs. (5) [The Engine of Your Friend's Objection]**
  *   **The Conflict:** Your friend argues that if an act is "the right call" (1), guilt (5) is irrational. Your friend is actually relying on your commitment (2) to make that point. If (2) is true (outcomes settle rightness "full stop"), then an act that produces the best outcome is *morally good*. Feeling guilty about doing a morally good act *is* irrational self-flagellation. Guilt is only fitting if the act retains some quality of "wrongness."
  *   **What Must Give:** To keep (5) (that guilt is fitting), you must admit the act remains morally tainted despite being politically necessary. This requires rejecting (2)'s claim that the outcome *settles* the moral status.
  *   **The Cost:** If you keep (2), you must treat guilt as a psychological bug to be managed, not a moral signal. If you keep (5), you must admit that "right call" (political necessity) and "morally right" are not identical.

  **Severity: LOW/MANAGEABLE — (1) vs. (4)**
  *   **The Conflict:** You claim politicians have no special morality (4), but also that the *office* demands things morality forbids (1).
  *   **Why it Dissolves:** This is likely a verbal confusion rather than a logical contradiction. "No special morality" usually means politicians are not *exempt* from moral blame (which fits your view on guilt). "The office demands" refers to *practical* necessity, not moral permission. As long as you clarify that the "demand" creates a dilemma rather than a moral exemption, (1) and (4) can coexist. The politician is held to the same standard as a civilian, but placed in a context where violating that standard is unavoidable.
  *   **The Cost:** You need to be precise in your presentation that "office demands" refers to *consequences of failure*, not *moral justification*.

  ### 2. Diagnosing the Friend's Objection

  Your friend is wrong that (1) and (5) are in tension *inherently*, but she is right that they are in tension *given your commitment to (2)*.

  *   **Her Logic:** If it was the "right call" (1), it was "Right." If it was "Right," guilt (5) is inappropriate.
  *   **The Flaw:** She is assuming a monistic morality where "Right Call" = "Morally Permissible."
  *   **The Reality:** Your position (1) explicitly distinguishes between "what the office demands" (Political Right) and "genuinely morally wrong" (Moral Right).
  *   **Why She Feels the Tension:** Because you added (2). By saying outcomes settle it "full stop," you erased the distinction between Political Right and Moral Right. If you remove (2), her objection collapses. You can then say: "It was the politically necessary call, but it remained morally wrong, which is why guilt is the fitting response."

  ### 3. The Single Cheapest Revision

  **Drop the "Full Stop" in Commitment (2).**

  You do not need to abandon consequentialism entirely, but you must downgrade it from an **ontology of rightness** to a **heuristic for decision-making.**

  *   **Current (2):** "What makes a political decision right is the state of the world it produces, full stop."
  *   **Revised (2*):** "What makes a political decision *necessary* is the state of the world it produces, but this does not automatically cleanse the act of moral wrongness."

  **Why this is the cheapest revision:**
  1.  **It saves (3):** You can keep your absolute constraints (no torturing kids) because outcomes no longer "settle it." They only justify the necessity, not the morality.
  2.  **It saves (5):** It explains the guilt. The act was necessary (consequentialist justification) but wrong (deontological violation). The guilt registers the violation. This validates your intuition that a leader who feels nothing is unfit.
  3.  **It saves (1):** It preserves the "Dirty Hands" paradox. The hands are dirty *because* you had to violate a moral constraint to achieve the necessary outcome.
  4.  **It minimizes theoretical loss:** You don't have to become a full "tragic pluralist" in the metaphysical sense. You can still argue that politicians *should* primarily weigh consequences, provided they acknowledge that doing so sometimes incurs moral debt.

  **What you lose by taking it:**
  You lose the **certainty of justification.** Under your original (2), once the math worked, the politician was "in the clear." Under the revision, the politician is never fully in the clear; they are merely "justified but tainted." You lose the ability to say the act was simply "Right." You have to accept that political ethics involves permanent moral residue, which is messier but philosophically robust.

  ### Summary for Your Reading Group
  When you present, lead with the revision. State clearly: *"I am not a pure consequentialist. I believe consequences determine political necessity, but they do not erase moral wrongness. That gap is where Dirty Hands lives, and that gap is why guilt is rational."* This neutralizes your friend's objection and resolves the contradiction between your arithmetic and your constraints.
