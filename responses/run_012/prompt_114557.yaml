answer: |-
  ### I. The Formal Skeleton and its Burden-Bearing Assumptions

  To see why Good's result is a theorem of probability theory rather than a norm of rationality, we must strip it of its decision-theoretic clothing and expose the mathematical skeleton. Let $\mathcal{A}$ be a set of acts, $\mathcal{S}$ a set of states, and $u: \mathcal{A} \times \mathcal{S} \to \mathbb{R}$ a utility function. Let $P$ be a prior probability measure over $\mathcal{S}$. An experiment yields an observation $e$ from a partition $\mathcal{E}$ of $\mathcal{S}$, inducing a posterior $P(\cdot | e)$.

  The value of free information is defined as the difference between the expected utility of acting after observation and the expected utility of acting now:
  $$ \text{VoI} = \sum_{e \in \mathcal{E}} P(e) \left[ \max_{a \in \mathcal{A}} E_{P(\cdot|e)}[u(a, s)] \right] - \max_{a \in \mathcal{A}} E_{P}[u(a, s)] $$
  Good's inequality states that $\text{VoI} \ge 0$.

  The proof relies on the observation that for any specific observation $e$, the act $a^*$ that maximizes prior expected utility is still available in the menu of acts after observing $e$. Thus, $\max_{a} E[u(a)|e] \ge E[u(a^*)|e]$. Taking the expectation over $e$ on both sides yields $E[\max_{a} E[u(a)|e]] \ge E[E[u(a^*)|e]] = E[u(a^*)]$, which is the prior maximum.

  Three assumptions bear the entire weight of this inequality. First, **Consequentialism**: utility is defined solely over the final state of the world $(a, s)$, not over the trajectory of information acquisition. Second, **Linearity**: the agent evaluates prospects using the linear expectation operator. Third, **Partitionality**: the information structure is exogenous and costless, and the agent is free to map any observation to any act.

  If any of these fails, the inequality dissolves. The theorem does not prove that information is valuable; it proves that *conditional expectation commutes with the maximum operator under linear aggregation*. To treat this as a normative claim—that rationality forbids paying to remain ignorant—is to conflate the properties of the expectation operator with the properties of rational agency.

  ### II. Artifacts of the Model: When Information Has Cost or Distorts Value

  The claim that "a rational agent can never be made worse off by learning" is false if we interpret "worse off" in terms of the agent's actual preferences, and trivially true if we interpret it in terms of the modeler's restricted utility function. Two concrete decision problems demonstrate this.

  **1. Utility Over Informational States**
  Consider an agent facing a decision about her marriage. She can investigate whether her spouse is unfaithful ($e=1$) or not ($e=0$). If she investigates and finds infidelity, she divorces; if not, she stays. If she does not investigate, she stays. Suppose the material outcomes of divorce and staying are fixed. However, suppose the agent suffers a distinct psychic harm from the *knowledge* of betrayal, independent of the act she takes. She values "blissful ignorance."

  Formally, her utility function is $u(a, s, e)$. The term $u(\text{stay}, \text{faithful}, 1)$ is lower than $u(\text{stay}, \text{faithful}, 0)$ simply because she knows the truth. Good's theorem assumes $u(a, s, e) = u(a, s)$. If we respect the agent's actual preferences, the "ignore the info" strategy is unavailable. She cannot choose the prior-optimal act *and* retain the prior informational state. Once $e$ is observed, the outcome includes $e$. In this expanded outcome space, the inequality $\text{VoI} \ge 0$ fails. The agent is rational to pay to avoid the experiment. The theorem only holds here if we arbitrarily redefine her utility function to exclude her preference for ignorance, in which case the theorem is true but describes a different agent.

  **2. Ambiguity Aversion and Non-Linearity**
  Consider an agent with MaxMin Expected Utility preferences. She does not have a single prior $P$, but a set of priors $\mathcal{P}$. She values an act $a$ by $\min_{p \in \mathcal{P}} E_p[u(a)]$. She is offered free information about a variable correlated with the payoff. Upon receiving signal $e$, she updates the set of priors to $\mathcal{P}_e$.

  It is a known property of sets of probabilities that conditioning can increase ambiguity. Even if the signal is costless, the updated set $\mathcal{P}_e$ may be "wider" in a relevant sense, or the worst-case prior may shift more drastically than the average case improves. Because the Min operator is concave, not linear, the inequality reverses:
  $$ E_e \left[ \min_{p \in \mathcal{P}_e} E_p[u(a)|e] \right] < \min_{p \in \mathcal{P}} E_p[u(a)] $$
  is entirely possible. The agent can strictly prefer to remain ignorant. Here, the failure is not in the outcome space but in the aggregation rule. The "average of maxima" logic requires the linearity of expectation to move the outer expectation inside the comparison. Without linearity, information can destroy value by sharpening the agent's awareness of worst-case scenarios without providing the probabilistic confidence to mitigate them. The agent is not dynamically inconsistent; she is ambiguity-averse. Good's theorem simply does not apply to her, yet she remains a paradigmatic example of a rational decision-maker in modern theory.

  ### III. The Defense of Coherence and the Retreat to Tautology

  The proponent of Good's theorem as a normative principle will reply: "These counterexamples lie outside the scope of the theorem. The theorem applies to Expected Utility maximizers with fixed utility over terminal states. For such agents, paying to avoid information *is* dynamically inconsistent. If you pay to avoid info, you reveal you are not an EU maximizer, or your utility function was misspecified."

  This reply concedes the argument. It admits that the theorem does not constrain *preferences*; it constrains *model specifications*.

  If the defense is that any agent who pays to avoid information simply has a utility function that includes "ignorance" as a good, then the theorem becomes unfalsifiable. We can always save the inequality by expanding the outcome space until the preference disappears. But if we expand the outcome space to include the informational state, the theorem no longer guarantees $\text{VoI} \ge 0$. It only guarantees that *given* a utility function that doesn't care about information, the agent won't act as if she does.

  This renders the slogan "rational agents never benefit from ignorance" empty. It translates to: "Agents who do not value ignorance do not pay to avoid information." This is a tautology. It offers no guidance on whether a real human *should* value ignorance. It offers no constraint on what constitutes a reasonable utility function. It merely asserts that if you model an agent as indifferent to their informational history, they will behave as if indifferent to their informational history.

  Furthermore, the appeal to diachronic coherence is circular. Coherence is defined by the axioms that yield Good's theorem. To say an agent *ought* to be coherent is to say an agent *ought* to satisfy the axioms. But the axioms (specifically the independence of utility from information) are exactly what is in dispute. To use the theorem to prove the norm is to assume the norm in the premises.

  ### IV. What Would Constitute a Real Constraint?

  For Good's result to function as a substantive norm of rationality—rather than a consistency check on a mathematical model—it would need to assert a constraint on the admissible structure of preferences. It would need to claim: **"A rational agent's utility function *must* be separable from her informational state."**

  If we add this axiom, the theorem becomes normative. It would say: "If you are rational, you cannot care about knowing the truth for its own sake (or detriment), and therefore you should never pay to avoid information."

  But this strengthened claim is empirically false and philosophically indefensible. Agents care about hope, dread, suspense, and peace of mind. These are utilities over informational states. A rational agent can coherently prefer a world where she is happily deceived to a world where she is miserably informed. To rule this out is not to enforce coherence; it is to enforce a specific, controversial hedonic philosophy (perhaps a form of stoicism or radical consequentialism) under the guise of decision theory.

  Moreover, even if we restrict ourselves to EU maximizers, once we permit the outcome space to include the agent's informational state (as we must to describe real psychology), the theorem claims nothing about the *sign* of the value of information. It only claims that the agent will optimize correctly given her preferences. If her preferences dictate that ignorance is valuable, the "value of information" will be negative, and the agent will optimally avoid it.

  Thus, the strongest form of the argument is this: Good's theorem is a mathematical identity regarding the convexity of the maximum function under linear expectation. It is not a law of rationality. The slogan that "information is never harmful" is false for agents with non-linear preferences (ambiguity aversion) and trivially true for EU agents only if we define their utility functions to exclude the costs of knowing. If we allow utility to depend on information, the theorem holds mathematically but loses its normative bite, becoming a mere statement that agents maximize what they value. If they value ignorance, they maximize ignorance. To claim otherwise is to confuse the map of probability theory with the territory of human preference.
