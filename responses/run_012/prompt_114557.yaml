      *   *Assumptions:*
          1.  Expected Utility (EU) maximization.
          2.  Costless information.
          3.  Freedom to act after information (no binding pre-commitment required).
          4.  Fixed utility function over fixed outcome space (information doesn't change utility).
          5.  Information is relevant to the decision (part of the probability space).
      *   *The "Trick":* The agent can always ignore the info. Therefore, the option set *after* info includes the option chosen *before*. Since optimization happens *after*, the value must be $\ge$.

  3.  **Drafting Section 1: Statement and Assumptions:**
      *   Need to formalize without getting bogged down in measure theory, but precise enough for a grad student.
      *   Let $A$ be acts, $S$ states, $U$ utility.
      *   Prior $P$, Experiment $E$ with outcomes $e \in \mathcal{E}$.
      *   Value of Information (VoI) = $E_e [\max_{a} E[U(a) | e]] - \max_{a} E[U(a)]$.
      *   Key Assumption: The utility function $U$ is defined over final world states, *independent* of the path taken to get there (specifically, independent of receiving $e$).
      *   Key Assumption: The agent updates via Conditionalization (Bayes).
      *   Key Assumption: The agent maximizes EU at both time steps.

  4.  **Drafting Section 2: Concrete Decision Problems (The "Artifacts"):**
