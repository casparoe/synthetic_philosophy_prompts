          *   This shows the theorem relies on the *separability* of information from utility.
      *   *Case 2: Non-EU Preferences (Ambiguity Aversion).*
          *   Example: Ellsberg-style or MaxMin Expected Utility.
          *   Scenario: I have a vague prior. Learning something sharpens the posterior but increases ambiguity about a correlated variable (or simply reduces the set of priors in a way that lowers the min-expectation).
          *   Actually, a simpler example is often used: Information can reduce the set of plausible priors in a way that lowers the worst-case expectation.
          *   Better example: An agent who values "hope" or has rank-dependent utility. But the prompt specifically mentions ambiguity aversion where learning makes estimates *more vague* or reduces the value of the max-min.
          *   Let's stick to the prompt's suggestion: Ambiguity aversion. If I have a set of priors $\mathcal{P}$, value is $\min_{p \in \mathcal{P}} E_p[U]$. After signal $e$, I update to $\mathcal{P}_e$. It is possible that $E[\min_{p \in \mathcal{P}_e} E_p[U]] < \min_{p \in \mathcal{P}} E_p[U]$.
          *   Why? Because the "ignore" option isn't available in the same way. If I observe $e$, I *must* update my ambiguity set. I cannot pretend I didn't see $e$ while holding the original ambiguity set.

  5.  **Drafting Section 3: The Strongest Reply (Diachronic Coherence):**
      *   *The Defense:* "Good's theorem defines rationality. If you violate it, you aren't an EU maximizer. Therefore, for EU maximizers, it's true by definition."
      *   *The Counter:* This makes the theorem tautological. It says "If you define agents as those who don't pay to avoid info, then agents don't pay to avoid info."
      *   *The "Scope" Argument:* Proponents say cases with utility over info are just "different outcomes."
      *   *The Rebuttal:* If we expand the outcome space to include "having learned $e$," then the theorem *no longer guarantees non-negative value*. The value of information becomes contingent on the specific utility assignment to that state. The theorem loses its normative bite. It stops saying "Information is good" and starts saying "Optimization is consistent."
      *   *Unfalsifiability:* If every counterexample is dismissed as "you changed the outcome space," the theorem explains nothing about the real world. It becomes a consistency check on the modeler's setup, not a constraint on the agent.

  6.  **Drafting Section 4: What would make it a Real Constraint?**
      *   To be normative, it must rule out *preferences*, not just *inconsistencies*.
      *   We would need an axiom that says "Utility over world states must be independent of informational history."
      *   But this is a substantive claim about psychology, not decision theory.
