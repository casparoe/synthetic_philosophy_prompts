      *   *Section 1:* Formal statement. Highlight the "fixed utility" assumption.
      *   *Section 2:* The "Psychic Cost" example (utility depends on info) and the "Ambiguity" example (non-linearity).
      *   *Section 3:* The "Coherence" defense. Show it leads to tautology.
      *   *Section 4:* The "Substantive Axiom" requirement.

