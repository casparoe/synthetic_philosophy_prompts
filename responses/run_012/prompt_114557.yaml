      *   So, for the theorem to be a *norm*, we must assert that rational agents *ought* to have utility functions independent of information.
      *   But why? Hedonic agents clearly don't.
      *   Conclusion: The theorem is a mathematical identity conditional on specific structural assumptions. It is not a free-standing norm.

