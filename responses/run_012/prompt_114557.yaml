      *   *Audience:* Grad student. Avoid over-explaining basics, focus on the philosophical/structural tension.
      *   *Constraint Check:* No citations. Own words.
      *   *Specific Prompt Requirement:* "The slogan... is either false or trivially true depending on how one has fixed the outcome space." Ensure this punchline lands.
      *   *Refining the Ambiguity Example:* Make sure it's clear why EU fails there. The "average of maxima" logic relies on linearity of expectation. Non-linear weighting (like min over priors) breaks the inequality $E[\min] \le \min[E]$. Wait, Good's theorem relies on $E[\max] \ge \max[E]$. For ambiguity, the value function is $V(f) = \min_p E_p[u(f)]$. We need to show $E_e[V(f|e)] < V(f)$. This happens if updating increases ambiguity or shifts the worst-case prior unfavorably.
