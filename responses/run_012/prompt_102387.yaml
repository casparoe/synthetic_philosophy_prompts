prompt: |-
  I run the content side of a small state historical society — we write the plaque text and the exhibit labels, maybe a dozen sites a year plus one or two bigger overhauls. The thing that keeps eating our review meetings is always the same fight: a community comes to us with a memory of what happened at a site and it doesn't match the archival record. Sometimes the record is just silent, sometimes it says the opposite. The committee is three of us (me, a staff historian who's the only one with any real training in this, and a community rep), and the community rep can block anything that goes to a vote, which means we can't just outvote her. We've been deciding these ad hoc, case by case, which really means we decide them by who's in the room that day. I want a written procedure instead, one teh team can run before a meeting without me.

  Two things about how I think we get it wrong. First, we have a habit of treating it as a straight conflict between two answers to one question, and I don't think it always is — a community remembering what a place *meant* and an archive recording what *happened* can both be right, and we keep forcing them into a contradiction. Second, when the archive is silent we've been reading that as "no evidence, so the community claim is unproven," and I'm not sure that's right anymore, because the archive is also a record of who bothered to write things down, and who got to.

  Here's a half-baked framework I've been kicking around — tell me which parts of it survive and which are junk. I've been calling a disputed claim *load-bearing* if the community's sense of itself depends on it, and *decorative* if it doesn't; my instinct is we owe more deference to load-bearing claims, but I honestly can't tell if that's principled or just cowardice. I also have a *same-question test* (before we call something a conflict, check whether the memory and the record are even answering the same question), and something I've been calling the *deference ledger*, which is supposed to track who has standing to know this particular thing — the people who were there, the people whose lives it shapes now, the people who kept the records in the first place. No idea if the ledger is coherent or just a way of sounding fair.

  So: turn this into a procedure our committee can actually run. The questions to ask in order, what counts as a sufficient answer to each, where it stops with a flat no, and where it has to hand the decision to a person because the question is about values and not facts. Keep it short enough to run in one review meeting, and flag the steps that are judgment calls dressed up as procedure. Then run it on three cases:

  (a) A harbor town remembers that the breakwater was cut short by the company that owned the cannery, and that this is why the 1931 storm drowned the men it drowned. The only contemporaneous documents are the company's own records, which describe a bad storm and never mention the breakwater. Four generations of oral accounts name the breakwater.

  (b) A neighborhood wants a plaque crediting a local craftsman — unnamed in any patent or newspaper — as the real source of a design that a now-famous inventor patented. The record shows a sole patent. The craftsman's descendants have a family account and nothing else.

  (c) A community insists their site was the first in the state to do a particular thing, and it's central to how they see themselves and to a grant they're applying for. There's a well-documented earlier site twenty miles away. I expect the procedure to tell me to put the record on the plaque, which will go badly for us, and I want to know that in advance.

  Then tell me what this procedure cannot do, and be honest about where it will misfire. And separate out for me what's actually settled among people who work on memory and history from what's genuinely contested — don't hand me a contested view as if it's the consensus, because I'll be reading this as if it's authoritative and I'd rather know where the floor is.

  Finish with a JSON object, keys exactly: "procedure_steps" (array of objects, each with "step", "question", "sufficient_answer", "stop_or_handoff"), "cases" (array of objects, each with "case", "verdict", "confidence", "why"), "settled" (array of strings), "contested" (array of strings), "judgment_calls" (array of strings), "what_it_cannot_do" (array of strings).
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Content lead for a small state historical society.
      *   **Task:** Write plaque text/exhibit labels (dozen sites/year + overhauls).
      *   **Problem:** Review meetings get stuck on conflicts between community memory and archival records.
      *   **Committee Structure:** 3 people (User, Staff Historian, Community Rep). Community Rep has veto power. Decisions are currently ad hoc/personality-driven.
      *   **Goal:** A written procedure to run *before* the meeting, short enough for one review, distinguishing fact from value judgments.
      *   **User's Framework Ideas:** "Load-bearing" vs. "Decorative" claims, "Same-Question Test," "Deference Ledger."
      *   **Specific Constraints:**
          *   Turn the framework into a step-by-step procedure.
          *   Identify judgment calls disguised as procedure.
          *   Apply to three specific cases (a, b, c).
          *   Explain limitations/misfires.
          *   Distinguish settled vs. contested theory in public history/memory studies.
          *   **Output Format:** End with a specific JSON object with exact keys.

  2.  **Evaluate the User's Framework:**
      *   *Load-bearing vs. Decorative:* This is useful for prioritization but risky. Calling something "decorative" can be dismissive. It's better framed as "Central to Community Identity" vs. "Incidental Detail." It's not cowardice to prioritize identity *if* it doesn't contradict hard evidence of harm.
      *   *Same-Question Test:* This is strong public history theory. Memory often speaks to *meaning/experience*, archives speak to *events/administration*. They aren't always competing truths.
      *   *Deference Ledger:* This is tricky. "Standing to know" is good, but "who kept the records" needs nuance (archives reflect power structures). It shouldn't be a ledger of points, but a mapping of epistemic authority.

  3.  **Drafting the Procedure:**
      *   Needs to be actionable.
      *   Needs to handle the "veto" dynamic (i.e., finding consensus or identifying irreconcilable value conflicts).
      *   *Step 1: Categorize the Claim.* (Fact vs. Meaning).
      *   *Step 2: The Same-Question Test.* (Are they actually contradicting?)
      *   *Step 3: Evidence Weighting.* (Archive vs. Oral History). Acknowledge archival silence isn't neutral.
      *   *Step 4: Impact Assessment.* (Load-bearing).
      *   *Step 5: Resolution/Handoff.* (Where do we stop?)

  4.  **Refining the Procedure (Self-Correction/Critique):**
      *   *Critique:* The user wants to know where it stops with a "flat no" vs. "handoff to a person."
      *   *Adjustment:* Make the "Stop" conditions clear. If it's a verifiable fact that contradicts safety/legal issues -> Stop/No. If it's about meaning/identity -> Handoff/Consensus.
      *   *Judgment Calls:* I need to explicitly flag where the procedure relies on human interpretation (e.g., defining "load-bearing").

  5.  **Applying to Cases:**
      *   *Case (a) Breakwater:* Archive (Company) vs. Oral History (Workers/Town). Archive is biased (company liability). Oral history is consistent. *Verdict:* Include both/nuance. The archive is silent on the *cause*, not the event.
      *   *Case (b) Craftsman:* Patent (Legal Fact) vs. Family Story (Contribution). *Verdict:* Patent holder gets legal credit, plaque acknowledges oral history of contribution without making false legal claims.
      *   *Case (c) "First in State":* Verifiable Fact (20 miles away) vs. Community Identity/Grant. *Verdict:* This is the hard one. Fact wins on "First," but meaning ("Pioneer Spirit") can stay. Procedure should flag this as a "Flat No" on the factual claim, but "Handoff" on the narrative framing. User expects a "Flat No" on the fact.

  6.  **Theory Check (Settled vs. Contested):**
      *   *Settled:* Archives are not neutral; they reflect power. Oral history is valid evidence. Memory and History serve different functions.
      *   *Contested:* How to weigh them when they directly contradict on *facts* (not meaning). The ethics of "myth-making" for community benefit vs. strict empiricism. The "Load-bearing" concept is more pragmatic than theoretical consensus.

  7.  **Drafting the Content:**
      *   *Tone:* Professional, empathetic to the constraints, authoritative but honest about limitations.
      *   *Structure:*
          1.  Critique/Refinement of User's Framework.
          2.  The Procedure (Step-by-Step).
          3.  Case Applications.
          4.  Limitations/Misfires.
          5.  Theory Check (Settled vs. Contested).
          6.  JSON Object.

  8.  **Developing the JSON:**
      *   Must match keys exactly: `procedure_steps`, `cases`, `settled`, `contested`, `judgment_calls`, `what_it_cannot_do`.
      *   `procedure_steps` needs `step`, `question`, `sufficient_answer`, `stop_or_handoff`.
      *   `cases` needs `case`, `verdict`, `confidence`, `why`.
      *   Ensure valid JSON syntax (quotes, commas, no trailing commas).

  9.  **Final Review against Constraints:**
      *   Did I address the "Load-bearing" vs. "Cowardice" worry? Yes, reframe as "Centrality."
      *   Did I address the "Archive Silence" issue? Yes, treat silence as data.
      *   Is the JSON valid? (Will double-check).
      *   Did I flag judgment calls? Yes.
      *   Did I distinguish settled/contested theory? Yes.

  *(Self-Correction during drafting)*: I need to be careful with Case C. The user says "I expect the procedure to tell me to put the record on the plaque, which will go badly for us." I need to be honest: If the claim is factually false ("First in state"), the procedure *must* flag that as a factual error. However, it can offer a "handoff" on how to phrase the *significance* without lying. I shouldn't validate the lie, but I can validate the *feeling*.

  *(Refining the "Deference Ledger")*: I'll incorporate this into the "Evidence Weighting" step rather than keeping it as a separate abstract concept, to make it more procedural.

  *(Refining "Load-bearing")*: I will rename this to "Centrality Assessment" to sound less dismissive than "Decorative."

  *(Final JSON Check)*: Ensure no newlines break the JSON strings improperly. Escape quotes where necessary.

  Let's assemble the response.
answer: |-
  Here is an analysis of your framework, a drafted procedure, the case applications, and the theoretical grounding you requested, followed by the required JSON object.

  ### Critique and Refinement of Your Framework

  Your instincts are aligning with current best practices in public history and memory studies. Here is how to salvage the useful parts and discard the risky ones:

  1.  **Load-bearing vs. Decorative:** Keep the distinction, but drop the labels. "Decorative" implies the memory is trivial, which invites conflict. Call it **Centrality Assessment**. Is this claim central to the community's identity or grant eligibility? If yes, it requires a higher burden of proof to contradict, not because it's "true," but because the *harm* of contradiction is higher. This isn't cowardice; it's stakeholder management.
  2.  **Same-Question Test:** This is your strongest tool. Keep it. It solves the "meaning vs. event" conflict.
  3.  **Deference Ledger:** This is too vague for a procedure. Instead, use **Epistemic Weighting**. Acknowledge that archives record power (who could write) and oral history records experience (who was there). Silence in the archive is data, not absence of truth.

  ### The Procedure: "Memory and Record Reconciliation Protocol"

  This procedure is designed to be run by you and the Staff Historian *before* the committee meeting. It prepares the file so the Community Rep isn't blindsided, reducing the need for a veto.

  **Step 1: The Categorization**
  *   **Question:** Is the claim about a verifiable event (date, name, physical structure) or a lived experience/meaning (why it mattered, how it felt, who was blamed)?
  *   **Sufficient Answer:** "Event" or "Meaning."
  *   **Stop/Handoff:** If "Meaning," skip to Step 4. If "Event," proceed to Step 2.

  **Step 2: The Same-Question Test**
  *   **Question:** Are the archive and the memory contradicting each other, or describing different layers of the same event? (e.g., Archive: "Storm happened." Memory: "Storm killed because of negligence.")
  *   **Sufficient Answer:** "Direct Contradiction" or "Complementary Layers."
  *   **Stop/Handoff:** If "Complementary," draft text that includes both. **Stop.** If "Direct Contradiction," proceed to Step 3.

  **Step 3: Epistemic Weighting (The Archive Audit)**
  *   **Question:** Who created the archival record, and what incentive did they have to omit or alter this specific fact? Does the silence serve the record-keeper's interest?
  *   **Sufficient Answer:** A brief statement on archival bias (e.g., "Company records omit liability," "Government records omit marginalized groups").
  *   **Stop/Handoff:** If the archive is shown to be biased regarding this specific fact, weight oral history equally. Proceed to Step 4. If the archive is neutral and the memory is demonstrably factually impossible (e.g., wrong decade), **Flat No** on the memory claim.

  **Step 4: Centrality Assessment**
  *   **Question:** If we contradict this claim, does it dismantle the community's narrative identity or tangible funding (grant eligibility)?
  *   **Sufficient Answer:** "High Centrality" or "Low Centrality."
  *   **Stop/Handoff:** If "High Centrality" and facts are ambiguous (Step 3), **Handoff to Committee** for consensus on phrasing. If "High Centrality" and facts are solid (Step 3), **Handoff to Committee** to negotiate *significance* without lying.

  **Step 5: The Phrasing Handoff**
  *   **Question:** Can we phrase the plaque to honor the memory without asserting the fact as absolute truth? (e.g., "Local tradition holds..." vs "It happened...")
  *   **Sufficient Answer:** "Yes" or "No."
  *   **Stop/Handoff:** If "Yes," draft the label. **Stop.** If "No" (the claim requires a factual lie to satisfy the community), **Handoff to Committee** for a values-based decision (Risk vs. Relationship).

  ***

  ### Judgment Calls Disguised as Procedure
  Be aware that the following steps rely on human interpretation, not mechanical rules:
  1.  **Step 1 (Categorization):** Distinguishing "event" from "meaning" is often subjective. (e.g., "The breakwater was cut" is an event, but "The breakwater caused deaths" is a causal interpretation).
  2.  **Step 3 (Archival Bias):** Determining *why* a record is silent requires historical imagination. The Staff Historian must justify this rigorously.
  3.  **Step 4 (Centrality):** Judging how much a community "needs" a myth can feel paternalistic. You must rely on the Community Rep's input here, not your own guess.

  ***

  ### Case Applications

  **Case (a): The Breakwater**
  *   **Verdict:** **Complementary Layers / Include Both.**
  *   **Confidence:** High.
  *   **Why:** Step 1 identifies this as Event + Meaning. Step 2 shows they aren't contradicting; the archive records the storm, the memory records the *cause*. Step 3 notes the Company Archive has a liability incentive to omit the breakwater negligence. The procedure dictates you treat the oral history as valid evidence of causality.
  *   **Text Strategy:** "During the 1931 storm... [Archival Fact]. Local oral history maintains the breakwater's incomplete construction contributed to the loss of life [Community Memory]."

  **Case (b): The Craftsman**
  *   **Verdict:** **Direct Contradiction / Phrasing Handoff.**
  *   **Confidence:** Medium.
  *   **Why:** Step 1 is Event (Inventorship). Step 2 is Direct Contradiction (Patent law vs. Family story). Step 3 acknowledges patents record legal ownership, not necessarily creative origin. However, you cannot legally label someone the patent holder if they aren't.
  *   **Text Strategy:** You cannot say he patented it. You can say: "While the patent was held by [Inventor], family oral history credits [Craftsman] with the design's core innovation." This satisfies Step 5 (Phrasing).

  **Case (c): The "First in State"**
  *   **Verdict:** **Direct Contradiction / Flat No on Fact, Handoff on Meaning.**
  *   **Confidence:** High.
  *   **Why:** Step 1 is Event. Step 2 is Direct Contradiction. Step 3: The archive (state records) is likely neutral regarding a site 20 miles away; there is no incentive to hide a rival town's claim. The evidence is solid. Step 4 is High Centrality (Grant money).
  *   **Outcome:** The procedure forces a **Flat No** on the factual claim "First in State." You cannot print a lie. However, Step 5 triggers a **Handoff**. The committee must decide how to frame the site's significance *without* the "First" claim. (e.g., "Among the earliest," "A pioneer in...").
  *   **Warning:** You anticipated this would go badly. The procedure protects *you* from professional censure, but it does not protect the *relationship* from strain. This is where the Community Rep's veto might be used, forcing a values decision (Step 5, "No").

  ***

  ### What This Procedure Cannot Do
  1.  **It cannot resolve values conflicts:** If the community demands a factual lie for identity preservation, this procedure identifies the conflict but does not solve it. It forces the committee to own the decision.
  2.  **It cannot verify oral history:** It treats oral history as *evidence*, not *truth*. It can still be wrong.
  3.  **It cannot prevent political fallout:** In Case (c), following the procedure may result in the Community Rep blocking the plaque. The procedure makes the *reason* for the block clear (Values vs. Facts), but it doesn't remove the block.
  4.  **It cannot replace trust:** If the Staff Historian uses Step 3 (Archival Bias) lazily to dismiss records they dislike, the procedure breaks.

  ***

  ### Settled vs. Contested Theory
  **Settled (Consensus in the Field):**
  *   Archives are not neutral; they reflect the power structures of their creation.
  *   Oral history is a valid historical source, not just "folklore."
  *   Memory and History serve different social functions (Identity vs. Empiricism).
  *   Silence in the record is often an active erasure, not just a lack of data.

  **Contested (Genuine Debate):**
  *   **The Limit of Deference:** At what point does respecting community memory become revisionism? There is no agreed-upon line.
  *   **Myth for Good:** Is it ethical to allow a "beneficial myth" (like Case C) to stand if it secures funding for preservation? Some argue preservation justifies the myth; others argue integrity is paramount.
  *   **Epistemic Authority:** Who decides when oral history outweighs a document? Your "Deference Ledger" attempts to answer this, but the field has no standard metric.

  ***

