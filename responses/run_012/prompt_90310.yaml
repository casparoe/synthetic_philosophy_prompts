      *   *AI Torture (Sentience):* If discovered sentient -> Real harm (Sentience Clause).
      *   *Offline Avatar Rape (Bot):* Similar to Case 9. If user doesn't know/feel -> No phenomenological harm. But is there a dignity harm? Principle predicts No Harm based on Embodiment Clause, but highlights the unease.
