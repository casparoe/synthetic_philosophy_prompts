          *   *Problem:* If the harm in Case 2 is "sexual assault," usually assault is defined by violation of bodily autonomy, not just sensation. If I am drugged and assaulted, I don't feel it, but it's still assault.
          *   *Inconsistency:* The user relies on *experience* for Case 2 but ignores *autonomy/representation* for Case 9.
          *   *Advice:* The user should probably reconsider Case 9. If Case 2 is harm because it's a violation of sexual integrity via avatar, Case 9 should also be harm because it's a violation of sexual integrity via avatar, regardless of immediate sensation. The "unease" in Case 9 is the moral truth breaking through.
      *   *Secondary Conflict:* Case 6 (Uncertainty) vs Case 5 (No harm). If belief matters (Case 6 note), then the *player's* state matters more than the *NPC's* state. But Case 5 says "plainly scripted."
