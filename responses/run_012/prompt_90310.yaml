          5.  Critique: Inconsistencies and Recommendations.

      *   *Refining the Principle Name:* "The Anchored Interest Theory of Virtual Harm."
      *   *Clauses:*
          1.  **Phenomenological Anchor:** Harm requires negative impact on the user's conscious experience or bodily integrity. (Cases 2, 7, 9).
          2.  **Economic Anchor:** Harm requires negative impact on recognized real-world economic value. (Cases 3, 4, 10).
          3.  **Moral Patient Anchor:** Harm requires suffering of a sentient entity. (Cases 5, 6).
          4.  **Communal Anchor:** Harm requires damage to shared social meaning. (Case 8).

      *   *Wait, looking closer at Case 9.* The user says "inclined to say no harm." My job is to fit *their* verdicts first, then critique. So the principle must explain why 2 is harm and 9 is not *based on their current view*.
