      *   *Observation 5 (The Tension):* Case 2 (Present, Groped) = Harm. Case 9 (Absent, Raped) = No Harm. This is the crux. Why? Because in Case 2, the *user* feels it (haptic). In Case 9, the *user* doesn't know/feel it.
      *   *Observation 6 (Case 6 Tension):* User belief matters even if false? This suggests a subjective component to harm.

      *   *Drafting the Principle:* It looks like a "Dual-Track Theory of Virtual Normativity."
          *   Track A: **Instrumental/Property Harm.** Does it affect real-world resources, rights, or economic value? (Cases 3, 4, 10).
