          *   2.4 Reverse Residue (Self-training, Non-partitions, Reliability Modeling).
          *   2.5 Order/Commutativity (Path dependence).
      *   **Conclusion:** Summary of the fundamental divergence.

  7.  **Final Polish:** Check against constraints.
      *   *Did I import ML assumptions?* Ensure I don't say "Jeffrey is just minimizing KL". It's not. It's linear averaging.
      *   *Did I answer the likelihood question?* Yes, explicitly.
      *   *Did I address the 5 sub-points of the residue report?* Yes.
      *   *Tone:* Professional, technical, "engineer-to-engineer" but respecting the philosophical boundary.

      *(Self-Correction during drafting)*: Wait, regarding the likelihood. If I treat the new probabilities $Q(B_i)$ as data $D$, can I find $P(D|H)$?
      If $P_{new}(H) = \sum P(H|B_i) Q(B_i)$, and Bayes says $P_{new}(H) \propto P(D|H) P_{old}(H)$.
      These are generally incompatible unless specific conditions hold. The Jeffrey update is a *linear* combination of old conditionals. Bayes is a *product* of prior and likelihood.
      I need to be very clear: **Jeffrey Conditionalization is not Bayesian Conditionalization.** It is an alternative update rule. It cannot generally be written as Bayes with a likelihood function over the original hypothesis space. It requires expanding the space or accepting it as a primitive rule. I will state this clearly.

      *(Refining Rigidity)*: In ML, when we do "Test-Time Adaptation" via entropy minimization, we change $P(Y|X)$. In Jeffrey, we change $P(B_i)$ but keep $P(A|B_i)$.
      Actually, the best ML analogue is **Importance Weighting for Prior Shift**. If I have a classifier $P(Y|X)$ trained on source, and target has different $P(Y)$, I update predictions by reweighting. But Jeffrey is about updating the *agent's* beliefs, not just reweighting outputs.
      Let's stick to the Latent Variable interpretation. $Z$ is the partition. $X$ is the rest of the world. Jeffrey says: Update $P(Z)$, keep $P(X|Z)$ fixed. This is exactly **Prior Shift** assumption.

      *(Refining Order)*: Jeffrey non-commutativity is a famous problem (the "order effect"). In ML, non-commutativity is due to non-convexity or finite steps. I need to distinguish these. Jeffrey's is structural; ML's is computational/optimization.

      *(Final check on Normativity)*: The user asked: "Name the normative content I have no word for." That is **Diachronic Coherence** (avoiding sure-loss betting strategies across time). ML cares about **Synchronic Accuracy** (loss on test set).

