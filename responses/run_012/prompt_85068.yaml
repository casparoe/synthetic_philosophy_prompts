  ### Notes on the choices

  The sestina's fixed end-words mirror the Counterfactuals of Creaturely Freedom: truths settled prior to the poem's 'creation'. The poet's arrangement of stanzas mimics the Divine Decree, ordering circumstances (the narrative flow) without altering the end-words (the free actions). The envoi compresses all six, representing God's simple, prior intuition of all truths simultaneously. However, the disanalogy is stark: I selected these words arbitrarily; God discovers CCFs independently. Stanza six admits this ('I force the rhyme'), highlighting that poetic constraint is imposed by the author, whereas Molinist truths are brute facts independent of God's will. The form enacts the structure of the doctrine while exposing the metaphysical discomfort of its grounding, leaving the objection in stanza five unresolved.
