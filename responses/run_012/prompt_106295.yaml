answer: |-
  **Project Title:** The Grammar of Blame, The Logic of Repair: Reinterpreting Intergenerational Collective Guilt

  **1. The Research Question**
  The central question of this project is determinate and binary: **Is the Jaspersian distinction between 'guilt' (anchored in action) and 'political responsibility' (anchored in membership) a substantive metaphysical boundary, or is it a pragmatic marker for forward-looking obligations of repair?**

  If the former, then intergenerational guilt claims are either category errors or require a robust theory of corporate agency that transcends time. If the latter, then "guilt" in this context is a linguistic vehicle for binding successors to reparative commitments, independent of desert.

  **2. Background and the Standard Debate**
  The contemporary literature on collective guilt is polarized between two positions, both of which assume guilt is essentially backward-looking (anchored in *culpa*).

  *   **Position A: The Corporate Agent View.** This view holds that collectives (nations, states) are moral agents capable of bearing guilt distinct from their members.
      *   *Prediction:* Intergenerational guilt is possible if the corporate agent persists through time.
      *   *Failure:* This view cannot adequately explain **Case 1 (Guilt before existence)**. If guilt requires agency, and agency requires the capacity to intend, new members who did not authorize the corporate will cannot inherit the *guilt*, only the debt. The Corporate View conflates the persistence of the institution with the persistence of moral fault.
  *   **Position B: The Individualist Reduction.** This view holds that only individuals act; collective guilt is a metaphor for the aggregated guilt of participating individuals.
      *   *Prediction:* Intergenerational guilt is impossible for those who did not participate.
      *   *Failure:* This view cannot explain **Case 3 (Guilt outliving perpetrators)**. When all perpetrators are dead, the Individualist must declare the guilt extinct. Yet, normative claims for repair persist with undiminished force. To dismiss these as confusion ignores the stable functional role these claims play in political reconciliation.

  Both positions stumble on **Case 2 (Guilt that no act could discharge)**. Standard guilt is dischargeable through punishment or atonement. Intergenerational guilt often demands endless vigilance or structural change, which fits poorly with a backward-looking economy of desert.

  **3. The Hypothesis: The Forward-Looking Reading**
  I propose that intergenerational collective guilt is not a description of a metaphysical state inherited from the past, but a speech act committing a collective to a future course of action. On this reading, saying "We are guilty" functions pragmatically as "We are bound to repair."

  This targets Karl Jaspers's *The Question of German Guilt* [Citation]. Jaspers distinguishes criminal/moral guilt (what one did) from political guilt (what one is liable for by virtue of membership). The project tests whether this distinction is a genuine phenomenological difference or merely a placeholder for the backward/forward-looking divide. If my hypothesis holds, Jaspers's "political guilt" is not guilt at all, but liability for repair wearing the mask of blame.

  **4. Methodology**
  To test this, I will employ a three-step conceptual and discursive analysis.

  *   **Step 1: Distinguishing Guilt from Liability.** I will rigorously distinguish *Retrospective Guilt* (desert-based, backward-looking, dischargeable) from *Forward-Looking Liability* (consequence-based, obligation-focused, persistent). The key differentiator is the *conditions of release*. Guilt is extinguished by penance; liability is extinguished only by the restoration of justice.
  *   **Step 2: The Translation Test.** I will formulate a precise "forward-looking translation" protocol. For any given ascription of intergenerational guilt, I will attempt to translate it into a commitment to specific reparative policies without loss of normative force.
      *   *Example:* "Germany is guilty for the Holocaust" translates to "The German state is committed to the security of Israel and the prosecution of hate crimes."
      *   *Metric:* If the translation preserves the normative "bite" of the original claim, the forward-looking reading is supported. If the translation feels like a evasion of blame, the standard reading holds.
  *   **Step 3: Testing Against Cases, Not Intuitions.** Rather than polling philosophical intuitions, I will analyze public records of transitional justice. I will examine:
      1.  German *Vergangenheitsbewältigung* (coming to terms with the past).
      2.  U.S. debates on slavery reparations.
      3.  Indigenous reconciliation processes (e.g., Canada's Truth and Reconciliation Commission).
      *   *Test:* Do these institutions demand suffering/penance (backward-looking) or structural change (forward-looking)? Do they treat current generations as *sinners* or *trustees*?

  **5. Outcomes and Failure Conditions**
  *   **Success:** The project succeeds if the Forward-Looking Reading explains Cases 1, 2, and 3 more parsimoniously than the Corporate or Individualist views. Specifically, success looks like demonstrating that the "guilt" language is retained strategically to signal the *urgency* of the repair, not the *fault* of the agent. It would confirm that the Jaspersian distinction is pragmatic, not metaphysical.
  *   **Failure:** The project fails if I identify clear instances where intergenerational guilt demands *penance without repair* (e.g., symbolic acts of self-abasement that fix nothing). If successors are held to deserve suffering purely for past acts they did not commit, the forward-looking reading collapses, and we must accept a metaphysical mystery of inherited fault. Additionally, if the Translation Test consistently strips the claim of its emotional/normative power, the "grammar of blame" is doing essential work that the "logic of repair" cannot replicate.

  **6. Scope Judgment**
  This is a **book project**, but the fellowship year is critical for constructing the philosophical architecture.

  The conceptual work required to dismantle the standard debate and precisify the forward-looking translation exceeds the scope of a single article. However, the empirical testing against the three case studies is bounded enough to be completed in one year if focused on discursive analysis rather than fieldwork. The fellowship will produce the core manuscript (approx. 60,000 words) establishing the theoretical framework and the primary case analysis. While additional case studies could expand the book later, the central argument is determinate and achievable within the fellowship period. Attempting to compress this into a journal article would necessitate sacrificing the rigorous testing of the Jaspersian distinction, which is the project's novel contribution.

  **7. Timeline**
  *   **Months 1-3:** Conceptual refinement of Guilt vs. Liability; finalizing the Translation Test protocol.
  *   **Months 4-8:** Application of the test to the three case studies (Germany, US, Indigenous reconciliation).
  *   **Months 9-12:** Drafting the manuscript and evaluating the Jaspersian distinction in light of findings.

  **8. Bibliography**
  [Citations to be supplied by applicant, including Jaspers, May, Feinberg, Thompson, and recent literature on collective responsibility.]
