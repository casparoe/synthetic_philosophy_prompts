answer: |-
  1. **The Sufficiency Overlap**
  Your tractability criterion hinges on whether a trait is revisable at a "reasonable cost" for someone in the agent's position. But if a cost is *un*reasonable precisely because it would deprive them of a decent life, aren't you just defining a sufficiency floor and calling it luck egalitarianism? What work is "tractability" doing here that a plain guarantee of sufficient resources wouldn't do on its own?

  **Follow-up:** You'll likely insist that tractability tracks *responsibility* in a way sufficiency doesn't. But if the "reasonable cost" constraint prevents you from demanding revisions that would leave someone destitute, then in every case where sufficiency and tractability diverge, you're either abandoning the unlucky or admitting the cost wasn't actually reasonable. If the two criteria extensionally overlap in all plausible cases, why keep the luck egalitarian label?

  2. **The Hybrid Admission**
  Suppose you grant that the tractability criterion effectively functions as a floor for the worst-off, but maintains luck egalitarian distribution above that floor. At that point, haven't you quietly become a hybrid theorist? And if so, doesn't that concede that pure luck egalitarianism is untenable without a non-egalitarian safety net?

  **Follow-up:** If you resist the "hybrid" label and claim this is still pure luck egalitarianism, you're implying that the *reason* we provide the floor is still about luck, not need. But if I'm below the floor because of my own past tractable choices, and you aid me anyway to meet the "reasonable cost" condition, aren't you compensating me for option luck? That breaks the core luck egalitarian axiom.

  3. **The Regress of Capacity**
  You argue tractability stops the regress of unchosen causes. But the *capacity* to revise a preference at a reasonable cost is itself unequally distributed due to brute luck—some people have resilient psychologies, others don't. If my psychology makes revision prohibitively costly for me but cheap for you, isn't that differential capacity just another form of brute luck you need to compensate for?

  **Follow-up:** You'll probably say we stop at the level of practical agency. But if you compensate me for my "high revision costs" because they are lucky, you've reintroduced the regress: now we have to ask if my *high revision costs* were tractable. If you don't compensate me, you're penalizing me for a psychological constitution I didn't choose. How do you block the regress without arbitrarily stipulating a stopping point?

  4. **The Threshold Metric**
  Let's pin down "reasonable cost." Is this an objective metric based on human functioning, or is it relative to the agent's existing preferences? If it's objective, who sets the standard—the ascetic or the hedonist? If it's relative to preferences, doesn't that allow expensive tastes to dictate their own compensation by claiming revision is too "costly" to their current self?

  **Follow-up:** If you say it's objective, you face the charge of paternalism: the state deciding what costs *should* matter to you. If you say it's subjective, you open the door to strategic behavior where agents inflate the cost of revision to secure transfers. Which horn of the dilemma do you take, and how do you prevent the exploitation you fear?

  5. **Expensive Tastes and Identity**
  Consider the person with expensive tastes who claims they can only acquire cheaper tastes by becoming a person they would hate being. On your view, is that identity cost "reasonable"? If you say no, and compensate them, you seem to be subsidizing snobbery. If you say yes, and demand they change, you're demanding they betray their core self.

  **Follow-up:** You'll likely argue that holding onto a self that requires vast resources is itself a choice. But if that "choice" is deeply constitutive of who they are, forcing revision looks less like holding them responsible and more like coercive re-engineering. Are you prepared to say the state is entitled to demand citizens alter their identities to lower the social bill?

  6. **Sour Grapes and Adaptive Preferences**
  Now flip it: the sour grapes case. A person in a deprived position adapts their preferences to their circumstances, claiming they never wanted what they couldn't have. Is the revision of *those* preferences tractable? If they've adapted so deeply that changing back is psychologically painful, does your criterion lock them into their adaptive preferences because revision is now too "costly"?

  **Follow-up:** If you say we should compensate them because the adaptation was a response to brute luck, you're tracing back to the ultimate source—the very regress you claimed to dissolve. If you say they're stuck with their adapted preferences because revising them is now costly, you're punishing them for successfully coping with oppression. How do you avoid penalizing resilience?

  7. **The Harshness Charge**
  Let's address the abandonment objection head-on. Critics say luck egalitarianism leaves the imprudent to starve. Your tractability criterion claims to soften this. But in a case where someone made a clearly tractable, risky choice—say, smoking—and now suffers lung cancer, do you aid them? If the cost of *not* smoking was reasonable ex-ante, the disadvantage traces to option luck.

  **Follow-up:** If you say "no aid," you haven't softened the harshness charge at all; you've just added a bureaucratic step to confirm the choice was tractable. If you say "aid," you need to explain why the tractability criterion didn't rule it out. Is it that the cost of cancer is *now* unreasonable to bear? If so, aren't you prioritizing need over responsibility regardless of the history?

  8. **The "Locked In" Case**
  Here is the specific case I want you to wrestle with: An agent could have revised a risky trait at a reasonable cost ten years ago but didn't. Now, ten years later, revision is impossible or prohibitively costly. They are "locked in." Do you hold them responsible for the ex-ante tractability, or do you compensate them for the ex-post impossibility?

  **Follow-up:** If you hold them responsible based on the ex-ante window, you are ignoring their current inability to help themselves, which looks like abandonment. If you compensate based on current impossibility, you make the "tractability" criterion irrelevant—all that matters is current need. Why shouldn't we just cut out the middleman and tax based on present disadvantage?

  9. **The Epistemic Burden**
  Even if the theory holds, consider the state's capacity to apply it. To judge whether a trait was tractable at a reasonable cost, the state needs intimate knowledge of an agent's psychology, history, and alternatives. Isn't the epistemic burden so high that implementing this view requires a surveillance apparatus more intrusive than the inequality it seeks to correct?

  **Follow-up:** You might suggest we use proxies or presumptions. But error costs matter. If we presume traits are tractable, we abandon the unlucky (false positives). If we presume they aren't, we subsidize the responsible (false negatives). Given that the state will inevitably get this wrong, why isn't a strict liability rule (either full compensation or none) more just than a flawed tractability assessment?

  10. **Falsification**
  Finally, what argument or empirical evidence would get you to give up the tractability criterion? Is there a case where your intuition about justice clearly diverges from what tractability demands, or is the criterion insulated from refutation by adjusting what counts as "reasonable"?

  **Follow-up:** If you say it's insulated, you're admitting the theory is defined by its conclusions rather than its principles. If you point to a specific case, tell me: in that case, are you abandoning luck egalitarianism entirely, or just conceding that tractability can't do the heavy lifting you claim it does?
