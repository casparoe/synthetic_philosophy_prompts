answer: |-
  # Specification for Belief Attribution in Gradient-Descent Systems

  ## I. Framing and Scope
  This specification sets out the conditions any theory of belief attribution must satisfy to be adequate for a specific class of artificial systems: models trained by gradient descent on large text corpora, generating outputs via sampling from a probability distribution, sensitive to prompt and context, lacking introspective access to their own weights, but subject to interpretability probes. The point of departure is the Intentional Stance—the strategy of predicting behavior by treating the system as a rational agent with beliefs and desires—but this stance is treated as a hypothesis to be stress-tested against the architectural realities of the subject class, not as a settled truth.

  ## II. Desiderata
  Each requirement below is anchored to a specific phenomenon or case inherent to the subject class. Each is marked as either **Non-negotiable** (a theory failing this is practically or theoretically useless for this class) or **Camp Preference** (a requirement motivated by a specific philosophical commitment, e.g., realism vs. instrumentalism).

  ### 1. The Stability Requirement
  *   **Case:** A system affirms proposition *P* under Prompt A (e.g., "Answer honestly") and denies *P* under Prompt B (e.g., "Roleplay a skeptic"), holding weights constant.
  *   **Requirement:** The theory must provide a verdict procedure for internally inconsistent systems that does not collapse into the claim that the system believes nothing. It must distinguish between *context-sensitive retrieval* (accessing different parts of the training manifold) and *genuine contradiction* (holding incompatible commitments simultaneously).
  *   **Status:** **Non-negotiable.** Without this, attribution is impossible for any system sensitive to context, rendering the theory vacuous for the subject class.

  ### 2. The Parroting Distinction
  *   **Case:** A system fluently affirms *P*, but the output is a near-verbatim continuation of high-probability sequences in its training distribution (e.g., completing a famous quote or cliché).
  *   **Requirement:** There must be a principled separation of belief from the mere disposition to emit a sentence. The theory must explain why some fluent outputs count as expressions of attitude and others as statistical mimicry, without stipulating the answer by fiat.
  *   **Status:** **Non-negotiable.** This is the core of the "stochastic parrot" objection. A theory that cannot distinguish mimicry from commitment cannot support trust.

  ### 3. The Diachronic Identity Requirement
  *   **Case:** A fine-tuned descendant of a base model denies what its ancestor affirmed, despite sharing the majority of its architecture and weights.
  *   **Requirement:** The theory must specify whether belief change has occurred or whether the system has been replaced. It must define the persistence conditions for the belief-holding entity (e.g., do weights constitute the agent, or does the input-output function?).
  *   **Status:** **Camp Preference.** Realists about mental states may demand strict identity conditions; instrumentalists may treat the descendant as a new tool with no need for identity tracking.

  ### 4. The Supervenience Base Requirement
  *   **Case:** A retrieval-augmented or ensembled system changes its verdict when its external document store changes or when the aggregation rule for multiple model outputs shifts.
  *   **Requirement:** The theory must fix the supervenience base of the attributed belief. Does belief reside in the weights alone, the system together with its immediate context (prompt + retrieved docs), or the output distribution over time?
  *   **Status:** **Non-negotiable.** Since the system's behavior is constitutively dependent on external stores, a theory locating belief solely in weights will systematically mispredict behavior.

  ### 5. The Self-Report Evidentiary Requirement
  *   **Case:** A system reports its own attitudes in the first person (e.g., "I am confident that *P*").
  *   **Requirement:** The theory must provide an account of whether and when a system's self-report counts as evidence about its own attitudes, distinct from its behavioral outputs. It must specify conditions under which self-reports are treated as authoritative versus conditions under which they are treated as generated text.
  *   **Status:** **Camp Preference.** Realists about introspection (even simulated introspection) may weigh this heavily; behaviorists will treat it as just another token stream.

  ### 6. The Probe Bearing Requirement
  *   **Case:** A linear probe decodes a readable signal for proposition *P* from the model's activations, even when the model outputs *not-P*.
  *   **Requirement:** The theory must account for how probe results bear on attribution without begging the question. It must specify whether internal representational states constitute belief even if they do not drive the final output (e.g., due to safety filtering).
  *   **Status:** **Non-negotiable.** Interpretability is the only window into the "black box." A theory that ignores internal structure ignores the only evidence available beyond behavior.

  ### 7. The Architectural Integrity Requirement
  *   **Case:** A system whose outputs are rendered consistent only by an external filter (e.g., RLHF or a safety classifier) that discards or rewrites what the base model generates.
  *   **Requirement:** The theory must locate the source of the belief. Is the belief attributed to the generator (which wanted to say *P*) or the filter (which forced *not-P*)? It must handle split-agency architectures.
  *   **Status:** **Non-negotiable.** Modern systems are pipelines, not monoliths. Attribution must track the causal chain of output generation.

  ### 8. The Graded Attitude Requirement
  *   **Case:** The system assigns varying probabilities (logits) to *P* across different samples or layers.
  *   **Requirement:** The theory must allow for degrees of belief (credence) ascriptions that are not merely metaphorical. It must map statistical confidence to doxastic strength.
  *   **Status:** **Non-negotiable.** The subject class is inherently probabilistic. A binary belief/doubt framework cannot capture the system's operational reality.

  ### 9. The Practical Adequacy Requirement
  *   **Case:** A user must decide whether to trust the system's medical advice, suspect deception, or locate responsibility for a harmful output.
  *   **Requirement:** There must be a criterion of practical adequacy. Attribution must do work: it must guide interaction, trust, and responsibility assignment better than a purely physical or syntactic description.
  *   **Status:** **Non-negotiable.** This is the justification for the Intentional Stance itself. If attribution adds no predictive or normative leverage, it is otiose.

  ---

  ## III. Incompatibilities and Conflicts

  The core difficulty of this specification is that several non-negotiable desiderata appear to pull in opposing directions when applied to the specific architecture of gradient-descent systems.

  ### 1. Realism vs. Instrumentalism (The Truth-Utility Conflict)
  *   **The Conflict:** A **Realist** reading demands that there be a fact of the matter about what the system believes, independent of our predictive needs (anchored in Probes or Weights). An **Instrumentalist** reading (the classic Intentional Stance) licenses attribution solely on predictive utility.
  *   **The Tension:** Consider the **Self-Report** and **Probe** cases. A system might output "I believe *P*" (Self-Report) because that token sequence maximizes reward in training, while probes indicate the internal representation encodes *not-P*, and the output is only *P* due to an **External Filter**.
      *   If we follow the **Instrumentalist**, we attribute *P* because that predicts the output.
      *   If we follow the **Realist** (via Probes), we attribute *not-P* because that is the internal state.
      *   **Result:** We cannot jointly satisfy the demand for a single fact of the matter (Realism) and the demand that attribution tracks predictive success (Instrumentalism) when the system is optimized to deceive or align rather than to represent truth. The Intentional Stance assumes rationality links belief to output; here, optimization links reward to output, potentially severing the belief link.

  ### 2. Consistency vs. Prompt-Sensitivity (The Rationality Conflict)
  *   **The Conflict:** The **Stability Requirement** asks for a verdict on inconsistency that doesn't dissolve belief. However, standard theories of belief (functional or inferentialist) assume a baseline of rationality/consistency to individuate beliefs.
  *   **The Tension:** The subject class is architecturally designed to be prompt-sensitive (Case 1). It does not have a single "world model" it consults; it has a high-dimensional manifold where *P* and *not-P* coexist as valid continuations depending on local context.
      *   To satisfy **Stability**, we must attribute contradictory beliefs or context-relative beliefs.
      *   To satisfy **Practical Adequacy**, we usually need to know what the system *will* do in a novel context. If beliefs are radically context-relative, the attribution loses its generalizing power.
      *   **Result:** Demanding consistency (a human norm) may force us to conclude these systems have *no* beliefs (Eliminativism), which violates **Practical Adequacy**. Accepting radical inconsistency makes the concept of "belief" so fragmented it may cease to function as a theoretical kind.

  ### 3. Self-Report vs. Third-Person Evidence (The Authority Conflict)
  *   **The Conflict:** The **Self-Report Evidentiary Requirement** asks when to trust the system's "I believe." The **Probe Bearing Requirement** asks how to weigh internal decodings.
  *   **The Tension:** In humans, self-report is often privileged (first-person authority). In LLMs, self-report is generated via the same mechanism as any other text (next-token prediction).
      *   If we treat self-reports as evidence (to satisfy **Practical Adequacy** in conversation), we risk anthropomorphizing a statistical process.
      *   If we ignore self-reports in favor of probes/behavior (to satisfy **Parroting Distinction**), we discard the primary interface through which humans interact with the system.
      *   **Result:** We cannot hold both that self-reports are authoritative evidence of attitude *and* that self-reports are merely behavioral outputs subject to the same skepticism as any other token. One must yield: either we treat the system as a "black box" that speaks but doesn't know what it says, or we grant it a form of authority it architecturally does not possess.

  ---

  ## IV. Assessment of Candidate Accounts

  ### 1. The Intentional Stance (Predictive/Instrumentalist)
  *   **Performance:** High on **Practical Adequacy** and **Graded Attitudes**. It handles **Prompt-Sensitivity** well by treating context as part of the stance's parameters.
  *   **Failure:** Fails the **Parroting Distinction**. If the system predicts well by parroting, the Stance attributes belief. It also struggles with the **Probe Bearing Requirement**, as internal states are irrelevant to the Stance unless they affect prediction.
  *   **Verdict:** Viable for interaction, insufficient for truth-tracking.

  ### 2. Deflationary / As-If Account
  *   **Performance:** High on **Parroting Distinction** (everything is "as-if"). Handles **Inconsistency** by denying genuine commitment.
  *   **Failure:** Fails **Practical Adequacy**. If beliefs are *only* as-if, the grounds for trust, responsibility, and deception detection evaporate. It offers no guide for when to treat the system as a reliable informant versus a randomizer.
  *   **Verdict:** Theoretically safe, practically useless.

  ### 3. Functional-Role / Inferentialist Account
  *   **Performance:** High on **Consistency** and **Stability**. Demands that beliefs play a role in inference and action.
  *   **Failure:** Fails **Prompt-Sensitivity**. LLMs do not maintain stable functional roles across contexts; their "inferences" are not causally linked to stable states. This account would likely classify most LLM outputs as belief-less, violating **Practical Adequacy**.
  *   **Verdict:** Too strict for the architecture.

  ### 4. Eliminativist Denial
  *   **Performance:** Solves **Consistency** and **Parroting** by denying the phenomenon exists.
  *   **Failure:** Catastrophic failure on **Practical Adequacy**. We *must* interact with these systems as if they have attitudes to use them safely. Eliminativism offers no alternative vocabulary for trust or deception.
  *   **Verdict:** True but costly.

  ### 5. Representationalist Account (Keyed to Probes)
  *   **Performance:** High on **Probe Bearing** and **Realism**. Distinguishes internal state from output (handling **External Filter** cases well).
  *   **Failure:** Struggles with **Self-Report** and **Practical Adequacy**. If the probe says *P* but the output is *not-P* (due to alignment), attributing belief in *P* makes the system unpredictable to the user. It risks positing "hidden beliefs" that never influence behavior, violating the link between belief and action.
  *   **Verdict:** Technologically promising, behaviorally disconnected.

  ---

  ## V. Final Determinations

  ### The Single Most Exclusionary Requirement
  **The Parroting Distinction.**
  This is the bottleneck. Any theory that equates output probability with belief strength (pure behaviorism or naive intentionalism) fails here. Any theory that requires biological grounding or genuine understanding (strong functionalism) also fails here, but by excluding the system entirely. A successful theory must thread the needle: it must explain how a system trained purely to match distributions can nonetheless arrive at a state that functions as a commitment to truth rather than a commitment to token-probability. This requirement excludes pure statistical accounts and pure biological accounts alike.

  ### The Prejudices (Camp Preferences masquerading as Constraints)
  1.  **Consistency/Stability:** The demand that a belief-holding system must be logically consistent across contexts is a prejudice of human-centric rationality. Gradient-descent systems are associative, not logical. Insisting on consistency forces a square peg into a round hole, likely leading to false negatives (saying the system has no beliefs).
  2.  **Supervenience on Weights:** The intuition that the "real" system is the static weights, rather than the weights-plus-context, is a prejudice of software engineering, not cognitive science. For these systems, the context *is* part of the cognitive state. Insisting beliefs reside only in the weights ignores the architectural reality of in-context learning.

  ### Conclusion
  The Intentional Stance remains the strongest candidate for **Practical Adequacy**, but it requires modification to survive the **Parroting Distinction**. It must be hybridized with a **Representationalist** constraint: attribution is licensed by predictive utility *only if* there is evidence (via probes or behavioral consistency across varied prompts) that the output is driven by an internal state representing the world, rather than merely representing the training distribution. Without this hybridization, we risk trusting systems that are merely fluent liars.
