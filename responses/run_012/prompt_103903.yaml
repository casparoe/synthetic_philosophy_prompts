prompt: |-
  Ok, quick favor and then I'll leave you alone. I'm a features writer — the long science-and-ideas stuff, 6,000 words, moody photo of a philosopher staring out a window — and next month I'm on a panel at a comparative ethics workshop that I agreed to before I clocked that the room is mostly actual philosophers. So I need to walk in ready.

  My talk is a half-baked thing I want to stress-test. Claim: the standard knock on Confucian role ethics — that it's communitarianism in a nicer robe, that it can't tell you when to refuse a bad role — has it backwards. If you take the Ames/Rosemont line seriously, where roles are constitutive of the self rather than hats you put on, then role ethics actually has a better story than liberal autonomy about when to quit a role or rewrite it, because the role carries internal standards you can be wrong about, so the critique can come from inside. Autonomy, by contrast, bottoms out in preference or some thin universal. I'm also floating a term for the fix — "role improvisation," like a jazz player who plays the changes but can also change them — and I honestly cant tell if it's clever or cringe, so weigh in.

  The room, roughly: a Warring States philology type and a modern Confucian political philosopher (the two people who actually know this material cold); a Kantian; a virtue ethicist who I suspect will say this is just virtue ethics with extra steps; and a feminist philosopher who works on care and hierarchy. I lean hard on the rectification-of-names idea as my critical tool — if the name stops fitting the thing, you're licensed to fix the name — but I have a sinking feeling the philologists will tell me I'm using it wrong.

  Give me my Q&A prep sheet: the eight or so objections I'll actually get from this room — not the ones I'd get online — ordered by how likely they are and how much damage they do, each phrased the way that specific person would phrase it, with a two-minute reply and a note on where my reply is soft. Include the one question I'm praying nobody asks. And please dont hand me citations or a reading list; I can't use them live and I'll just look like I'm bluffing.

  Make the last line a line starting Verdict: naming the single objection most likely to sink the whole thing.
