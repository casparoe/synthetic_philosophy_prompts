  1.  **Analyze the Request:**
      *   **Role:** Junior analyst at a small forecasting outfit.
      *   **Task:** Write a memo deciding whether to keep or retire the firm's core framework.
      *   **Context:** The director built his reputation on a long-run prediction (late 1990s) that resource demand would outstrip supply, causing costs to climb and the economy to stall. This hasn't happened yet. Prices rose, substitutes appeared, sector reorganized.
      *   **Director's Defense:** The forecast was right, the calendar was wrong (delay, not refutation). Recently added a lag term pushing the crisis out 20 years.
      *   **Colleague's View:** The prediction was never tested because conditions changed (implies unfalsifiability).
      *   **User's Dilemma:** Can't distinguish between a theory that's simply early vs. one rescued into unfalsifiability. Needs to decide what to recommend and what counts as evidence.
      *   **Format:** Continuous prose, no headings, no bullet points, no bold text, no tables. Like a letter.

  2.  **Identify the Core Philosophical/Practical Issue:**
      *   This is a classic problem in the philosophy of science and forecasting: falsifiability vs. ad hoc hypothesis modification.
      *   It echoes the Lakatosian concept of "research programmes" (hard core vs. protective belt) or Popper's falsificationism.
      *   The specific scenario resembles the "Peak Oil" debate or similar resource scarcity models (Malthusian traps).
      *   The key is to determine if the model still has predictive power or if it's become a tautology (always true because it can always be pushed back).

  3.  **Determine the Advice/Content:**
      *   Acknowledge the difficulty: Distinguishing between bad timing and bad theory is hard in long-run forecasting.
      *   Address the "calendar was wrong" defense: This is a common move but dangerous if used repeatedly.
      *   Address the "lag term": Adding parameters to fit past data without new explanatory power is overfitting/ad hoc.
      *   Define what counts as evidence:
          *   Does the model explain *why* the delay happened? (Mechanism vs. parameter tweak).
          *   Does it make new, risky predictions? (Not just "crisis later," but "crisis later because of X specific trigger").
          *   Is there a point where it *would* be proven wrong? (Falsifiability conditions).
          *   Compare against null models or simpler alternatives.
      *   Recommendation: Likely recommend retiring or fundamentally overhauling the framework, not just tweaking it. The burden of proof is on the director.
