      *   Avoid structural markers like "First," "Second," "In conclusion." Use transitions instead.

  6.  **Drafting the Content (Iterative process):**
      *   *Start:* Dear friend/colleague. I hear you. This is the hardest part of forecasting.
      *   *Middle:* You are asking about the line between refinement and rescue. When a model fails to predict on time, you can adjust parameters, but only if you understand *why* the delay occurred. If the director just adds a lag term without explaining the mechanism of the delay (e.g., technology X slowed down adoption), it's a patch. The colleague is right that if conditions change and the model doesn't account for them, it wasn't tested properly.
      *   *Evidence:* You need to ask what would prove the model wrong now. If the answer is "nothing," it's not science. You need specific triggers.
      *   *Recommendation:* Don't just say "keep" or "drop." Say "conditional keep." But honestly, if the core mechanism (supply demand inelasticity) was bypassed by substitution, the core might be wrong.
      *   *Refining the argument:* Focus on the concept of "predictive content." A theory that says "crisis eventually" has low content. A theory that says "crisis when price hits X and substitute Y fails" has high content.
      *   *Closing:* Trust your instinct. The feeling that it's unfalsifiable is a signal.

  7.  **Checking Constraints:**
