answer: |-
  You must inform the board that the funder's and advisory board's demands are mathematically incompatible given the differing success rates, requiring you to drop the funder's calibration requirement in favor of the board's equal opportunity standard while rejecting your colleague's proposal to ignore the variable.

  This incompatibility is a proven statistical impossibility: when base rates of success differ between groups, you cannot simultaneously satisfy Equal Opportunity (equal funding rates among those who succeed, as the board wants) and Calibration (equal success probabilities for a given score, as the funder wants) unless the model is perfect (Chouldechova 2017; Kleinberg et al. 2016). Since your data shows differing success rates, satisfying one constraint necessarily violates the other. You should prioritize the board because their constraint aligns with the nonprofit's mission to equalize opportunity; the funder's demand for calibration protects the metric's reputation but risks locking in historical inequities by treating lower base rates—which may stem from systemic barriers rather than lack of potential—as inherent truth. Your uncertainty about the label reinforces this choice: if degree completion is partly produced by support, calibrating to it entrenches past disadvantages, whereas equal opportunity among successes attempts to correct for them.

  To the disappointed funder, you owe transparency and validity assurance. Explain the mathematical trade-off clearly so they understand you are not arbitrarily inflating numbers but optimizing for a different definition of fairness that better serves the community. Offer to publish overall predictive accuracy and monitor for gross inefficiency, but hold firm that group-specific calibration must be sacrificed to meet the equity goals mandated by the advisory board.

  Your colleague's fix is not as good as he thinks. Dropping the high school variable ("fairness through unawareness") does not eliminate bias because the model will learn proxies for school type through correlated features like ZIP code or parental income. Furthermore, running a lottery among borderline cases introduces individual randomness but fails to resolve the group-level statistical conflict or the structural bias in the data, potentially leaving the underlying disparity untouched while obscuring accountability.
