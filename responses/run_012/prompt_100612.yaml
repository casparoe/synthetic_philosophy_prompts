  Here is the breakdown of your friend's logic, the alternative interpretation, and how to settle the bet.

  ### The Verdict
  **Prediction:** He will rule **True** ("A hoofed horse is not a horse").

  ### The Two Rules

  **1. The Rule He Is Actually Running: The Semantic Category Mismatch**
  This rule focuses on the *type of name* being used, exactly as he writes in his reasons ("names shape," "names color," "names size").
  *   **Logic:** If the Subject is a compound name [Modifier + Head] and the Predicate is the Head alone, they are not identical if the Modifier belongs to a semantic category distinct from the Head.
  *   **Application:** "Horse" names a shape/kind. "White" names a color. "Big" names a size. "Hoofed" names a part/feature. Since Part $\neq$ Shape, the compound name "Hoofed Horse" is not the same name as "Horse."
  *   **Prediction for Hoofed Horse:** **True** (It is *not* a horse).

  **2. The Alternative Rule: The Contingency Rule**
  This rule focuses on the *truth conditions* of the modifier rather than the category of the name. It fits all his previous data perfectly because he hasn't tested a necessary feature yet.
  *   **Logic:** If the Subject has a modifier that is **contingent** (could be otherwise), the compound is not identical to the Head. If the modifier is **necessary** (definitionally true), the compound *is* identical to the Head.
  *   **Application:** "White" and "Big" are contingent (a horse can be brown or small). Therefore, "White Horse" $\neq$ "Horse." However, "Hoofed" is definitionally necessary for a horse (in common parlance). Therefore, "Hoofed Horse" = "Horse."
  *   **Prediction for Hoofed Horse:** **False** (It *is* a horse).

  ### Which One Is He Really On?
  He is running **Rule 1 (Semantic Category Mismatch)**.

  **Why:** Look at his explicit reasons. He never mentions whether the horse *must* be white or big; he only cares that "white names a color" and "horse names a shape." He is mimicking Gongsun Long's linguistic nominalism, which argues that adding *any* specification creates a new name with a different extension, regardless of whether that specification is necessary or contingent. He is tracking the *words*, not the *world*.

  ### The Falsifying Case
  To falsify my pick (Rule 1) and prove he was actually on Rule 2 all along, you need a case where the **Semantic Categories differ** (triggering Rule 1 to say "Not") but the **Modifier is Necessary** (triggering Rule 2 to say "Is").

  **Throw this at him next:**
  > **"A breathing horse is not a horse."**

  *   **Rule 1 Prediction (Category Mismatch):** **True**. "Breathing" names an action/state, "Horse" names a shape/kind. Distinct categories $\rightarrow$ Not identical.
  *   **Rule 2 Prediction (Necessity):** **False**. A living horse *must* breathe. Necessary modifier $\rightarrow$ Identical.

  If he says **False** ("No, a breathing horse *is* a horse"), his "Category Mismatch" rule is dead, and he's been secretly running a logic of essentialism this whole time. If he says **True**, you win the bet on his methodology.
