answer: |-
  ### Part 1: The Procedure

  This procedure is designed for a 15-minute review of a single requirement. It assumes no longitudinal outcome data. It forces the committee to distinguish between *screening* (signaling) and *training* (human capital), and to identify where a requirement acts as a wealth filter rather than a competence filter.

  **Step 1: The Mechanism Check (Condition 5)**
  *   **Question:** Does this requirement *reveal* a pre-existing trait (signaling), or does it *create* the competence (training)?
  *   **Evidence:** Course syllabi, exam blueprints, supervisor logs. Does the activity teach skills, or merely assess them?
  *   **Missing Evidence:** If unclear, default to "Creates Competence."
  *   **Verdict:**
      *   If **Revealing**: Proceed to Step 2 (Signaling Audit).
      *   If **Creating**: Skip to Step 4 (Efficiency & Equity Audit).

  **Step 2: The Separation Check (Condition 3 + Failure Mode 2)**
  *   **Question:** Does this requirement actually filter applicants, or has it become universal (pooling)?
  *   **Evidence:** Pass/completion rates. If >90% of eventual licensees meet this, it is not separating.
  *   **Missing Evidence:** If data is unavailable, ask: "If we abolished this tomorrow, would the typical applicant still do it to be competitive?" If yes, it is pooling.
  *   **Verdict:**
      *   If **Pooling** (Universal): The requirement is no longer a signal. Mark for **Abolish** or **Replace** unless justified as mandatory training (see Step 4).
      *   If **Separating**: Proceed to Step 3.

  **Step 3: The Differential Cost Check (Condition 1)**
  *   **Question:** Is the cost of meeting this requirement higher for an applicant *lacking* the trait than for one *possessing* it? Or does it scale with wealth/time/connections?
  *   **Evidence:** Demographic data of completers vs. dropouts. Qualitative reports on barriers (e.g., unpaid hours, travel).
  *   **Missing Evidence:** If unknown, assume the cost falls equally on everyone (which fails the test) or scales with wealth.
  *   **Verdict:**
      *   If **Wealth/Time Filter**: **Abolish** or **Modify** (subsidize).
      *   If **Trait Filter**: Proceed to Step 5.

  **Step 4: The Efficiency & Equity Audit (For "Creating" Requirements or Failed Signals)**
  *   **Question:** (Condition 4) Is there a cheaper, more direct way to produce or measure this competence? (Condition 6) Who bears the cost?
  *   **Evidence:** Comparison to other jurisdictions, availability of online/remote options, cost-benefit analysis of unpaid vs. paid labor.
  *   **Missing Evidence:** If no alternative is proposed by staff, assume a direct index exists (e.g., a test instead of hours).
  *   **Verdict:**
      *   If **Inefficient/Unfair Cost**: **Modify** or **Replace**.
      *   If **Efficient/Equitable**: **Keep**.

  **Step 5: The Sanction Check (Condition 2 + Failure Mode 1)**
  *   **Question:** If an applicant "fakes" this requirement (crams, finds a lenient supervisor), are they penalized later in practice, or does the license protect them?
  *   **Evidence:** Disciplinary rates correlated with entry path (likely unavailable). Logic check: Does the license grant a monopoly that insulates poor performance?
  *   **Missing Evidence:** **CRITICAL:** Since we have no outcome data, we cannot verify this.
  *   **Verdict:**
      *   If **License Insulates Performance** (Monopoly): The requirement is a **Tax**. Vote **Abolish** unless it is essential training (Step 1).
      *   If **Uncertain**: Refer to Full Board as a **Value Judgment** on risk tolerance.

  **Step 6: Final Vote**
  *   **Options:** Keep, Keep with Modification, Replace, Abolish, Refer to Board.
  *   **Constraint:** A "Keep" vote requires passing Step 2 (Separation) AND Step 3 (Differential Cost) OR Step 4 (Efficiency/Equity).

  ***

  ### Part 2: The 15-Minute Short Form

  **Requirement Under Review:** _________________________________________________
  **Reviewer:** ___________________ **Date:** ___________

  | Step | Question | Check One | Action |
  | :--- | :--- | :--- | :--- |
  | **1** | **Revealing or Producing?** Does it test a trait or teach a skill? | [ ] Revealing (Signal)<br>[ ] Producing (Training)<br>[ ] Unknown | If Producing, go to Step 4.<br>If Revealing, go to Step 2. |
  | **2** | **Separation?** Do >90% of licensees eventually meet this? | [ ] Yes (Pooling)<br>[ ] No (Separating) | If Yes, **Flag for Abolish** (unless Training).<br>If No, continue. |
  | **3** | **Differential Cost?** Is it harder for the *unqualified* or just the *poor*? | [ ] Harder for Unqualified<br>[ ] Harder for Poor/Busy<br>[ ] Unknown | If Poor/Busy or Unknown, **Flag for Abolish/Modify**. |
  | **4** | **Efficiency?** Is there a cheaper/direct way to do this? | [ ] Yes (e.g., test vs. hours)<br>[ ] No<br>[ ] Unknown | If Yes, **Flag for Replace**. |
  | **5** | **Sanction?** If they fake it, do they fail later or get protected? | [ ] They Fail Later<br>[ ] License Protects Them<br>[ ] **Unknown (No Data)** | **UNSOUND:** If Unknown, you are guessing. |
  | **6** | **Who Pays?** | [ ] Applicant<br>[ ] Client/Public<br>[ ] Shared | Record for legislative report. |

  **Preliminary Verdict:** [ ] Keep [ ] Modify [ ] Replace [ ] Abolish [ ] Refer to Board
  **Reason:** __________________________________________________________________

  **WARNING ON UNSOUND SECTIONS:**
  *   **Step 5 is logically broken without outcome data.** You cannot know if the "wrong type" is sanctioned. Checking a box here is a fiction.
  *   **Step 3 relies on assumptions.** Without demographic cost data, you are assuming the cost structure.
  *   **Step 1 is often ambiguous.** Most requirements do both (teach and test). Force a choice.

  ***

  ### Part 3: Application to Current Requirements

  #### 1. 1,200 Hours of Supervised Practice (Unpaid)
  *   **Step 1 (Mechanism):** **Producing.** It claims to build competence through experience. However, it is used as a gate (Signal).
  *   **Step 2 (Separation):** **Pooling.** Nearly 100% of licensed members have done this. It does not separate the competent from the incompetent; it separates those who can afford to work for free from those who cannot.
  *   **Step 3 (Differential Cost):** **Fails.** The cost is time and lost wages. This is cheaper for applicants with family wealth or spousal support. It is *not* cheaper for those with the "trait" of competence. It screens for liquidity.
  *   **Step 4 (Efficiency):** **Fails.** Unpaid labor is an inefficient way to train compared to paid apprenticeships or simulated environments.
  *   **Step 5 (Sanction):** **Unknown.** We do not know if those who rush this hour requirement perform worse.
  *   **Verdict:** **Abolish / Replace.**
  *   **Rationale:** This violates Condition 1 (Differential Cost) and Condition 3 (Separation). It is a wealth filter masquerading as a competence filter.

  #### 2. Written Entry Examination (45% First-Attempt Pass Rate)
  *   **Step 1 (Mechanism):** **Revealing.** It tests knowledge acquired elsewhere.
  *   **Step 2 (Separation):** **Separating.** A 45% pass rate indicates significant filtering. It is not universal.
  *   **Step 3 (Differential Cost):** **Passes (Theoretically).** Studying for a test is generally cheaper for those with the aptitude (the trait) than for those without. It does not strictly require wealth, though prep courses help.
  *   **Step 4 (Efficiency):** **Passes.** A written test is a direct index of knowledge, cheaper than hours of observation.
  *   **Step 5 (Sanction):** **Unknown.** Without outcome data, we don't know if passing the test predicts safe practice.
  *   **Verdict:** **Keep.**
  *   **Rationale:** It satisfies the signaling conditions best. It separates, it is a direct index, and the cost (study time) correlates with aptitude more than wealth.

  #### 3. 40 Hours In-Person CE (5-Hour Drive)
  *   **Step 1 (Mechanism):** **Producing.** Claims to update skills.
  *   **Step 2 (Separation):** **Pooling.** Everyone does it to keep the license. It is a toll, not a filter.
  *   **Step 3 (Differential Cost):** **Fails.** The travel time is equal, but the *opportunity cost* is higher for those with less flexible jobs or caregiving duties.
  *   **Step 4 (Efficiency):** **Fails.** Condition 4 (Direct Index). A test of current knowledge would be cheaper and more direct than mandatory travel.
  *   **Step 5 (Sanction):** **Fails.** Condition 2. There is no sanction for the "wrong type" other than the cost of the travel.
  *   **Verdict:** **Abolish / Modify.**
  *   **Rationale:** This is a pure tax. It fails Separation, Differential Cost, and Direct Index.

  ***

  ### Part 4: The Failure and The Cost

  **The Requirement That Fails Badly:**
  The **1,200 Hours of Unpaid Supervised Practice**.

  **What This Means:**
  Under the Analyst's Memo, this requirement is illegitimate. It fails **Condition 1 (Differential Cost)** because the cost (lost income) is not correlated with professional competence, but with personal wealth. It fails **Condition 3 (Separation)** because it is a universal hurdle (pooling); everyone who gets the license has done it, so it tells the public nothing about who is *better* among licensees. It is a barrier to entry, not a certification of skill.

  **What We Would Have to Give Up:**
  1.  **The "Time-Served" Myth:** We must abandon the assumption that 1,200 hours of presence equals 1,200 hours of learning.
  2.  **Free Labor for the Profession:** Current licensees benefit from free supervised labor. Abolishing this means we may need to fund paid apprenticeships or reduce the hour requirement significantly.
  3.  **Risk Aversion:** We are using this requirement to defer risk ("They couldn't have messed up, they did 1,200 hours"). Without it, we must rely more heavily on the Exam (Requirement 2) or post-licensure auditing, which feels riskier in the short term.

  **The CE Requirement (Runner Up):**
  The CE requirement is also indefensible under Condition 4 (Direct Index). We are forcing travel when online testing would measure the same trait cheaper. However, the Unpaid Hours requirement is more damaging because it blocks *entry* based on class, whereas CE blocks *renewal*.

  ***

  ### Part 5: Procedure Critique

  **What the Procedure Cannot Do:**
  1.  **Prove Public Safety:** This procedure evaluates *economic efficiency* and *signaling validity*, not safety. A requirement can be a perfect signal (Condition 1-5 met) and still be irrelevant to safety. A requirement can be a terrible signal but accidentally prevent harm. Without outcome data (Condition 2), we cannot link requirements to patient/client safety.
  2.  **Resolve Value Conflicts:** The procedure pushes "Who Pays" (Condition 6) to the end. If the Board decides the public *should* bear the cost of training (via unpaid hours), this procedure flags it as inefficient, but cannot veto the value judgment.

  **Which Conditions Are Doing Real Work?**
  *   **Condition 1 (Differential Cost):** This is the heaviest lifter. It exposes wealth filters immediately.
  *   **Condition 3 (Separation vs. Pooling):** This is the second heaviest. It identifies "zombie requirements" that everyone meets but no one talks about removing.
  *   **Condition 4 (Direct Index):** This drives modernization (e.g., online CE vs. in-person).

  **Which Conditions Could Be Dropped?**
  *   **Condition 6 (Who Pays):** While important for the legislative report, it does not change the *validity* of the signal. A requirement can be a valid signal even if the applicant pays, or an invalid one if the public pays. It is a political consideration, not an audit metric. Dropping it streamlines the logic.
  *   **Condition 2 (Sanction on Wrong Type):** As noted in the Short Form, this is **unsound** without outcome data. In our context, it creates a false sense of security. We should drop the requirement to *verify* this and instead treat it as a "Risk Assumption" that the Full Board must accept explicitly.

  **Where It Is a Value Judgment Wearing Clothes:**
  *   **Step 1 (Revealing vs. Producing):** Deciding whether an hour requirement "teaches" or "tests" is subjective. We often claim it teaches to justify the cost, but use it as a test to justify the barrier. The procedure forces a choice, but the choice itself is a policy preference.
  *   **Step 5 (Sanction):** Marking "License Protects Them" is a judgment about the market. In some professions, reputation matters more than the license. Assuming the license insulates poor performance is a value judgment about the profession's monopoly power.

  **Amendment to the Six Conditions:**
  I would amend **Condition 2 (Sanction)**.
  *   *Current:* "Applicants who lack the trait and acquire the credential anyway end up worse off."
  *   *Problem:* In licensing, the license *prevents* them from being worse off (they get to work).
  *   *Amendment:* **"The requirement must correlate with a measurable outcome that the license does not guarantee."**
      *   *Why:* Since we cannot measure "worse off" (they are licensed), we must measure something else (e.g., fewer complaints, higher peer ratings). If we cannot measure it, the condition cannot be met, and the requirement defaults to "Abolish/Modify." This removes the fiction that we can verify sanctions when we cannot.
