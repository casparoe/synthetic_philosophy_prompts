answer: |-
  **Proposal for Chapter 1: The Ontological Status of Mixed Strategies in Iterated Elimination**

  **Research Question**
  Does the epistemic justification for Iterated Elimination of Strictly Dominated Strategies (IESDS) depend on conflating mixed strategies as objects of choice with mixed strategies as representations of belief? Specifically, if we formally distinguish a model where agents can select mixed strategies from a model where agents select only pure strategies but hold probabilistic beliefs, does the set of strategies surviving IESDS remain invariant?

  **Background and Motivation**
  The standard epistemic argument for IESDS proceeds as follows: a rational player never plays a strategy that is not a best response to any belief about the opponent's play. In two-player games, the strategies that are never best responses are precisely those strictly dominated by some mixed strategy. Consequently, rationality implies the elimination of strictly dominated strategies.

  This argument relies on mixed strategies playing a dual role. Mathematically, the definition of strict dominance requires the existence of a *mixture* that yields a higher payoff than the dominated strategy. This suggests the mixture must be a feasible object of choice; otherwise, the claim that the dominated strategy is "suboptimal" lacks force. However, the prevailing epistemic interpretation treats mixed strategies not as deliberate randomizations by the agent, but as representations of uncertainty—either the opponent's uncertainty about the agent, or the agent's own subjective beliefs.

  Existing treatments leave this tension unresolved. They typically assume the mathematical availability of mixtures for the purpose of defining dominance while simultaneously adopting the belief-based interpretation for the purpose of epistemic modeling. This equivocation allows the derivation of IESDS to proceed without scrutiny of whether the "mixture" dominating a pure strategy is something the agent can actually intend to play. This proposal argues that this is not merely a semantic issue but a structural fault line. The asymmetry between strict and weak dominance offers a clue: IESDS is order-independent, while iterated elimination of weakly dominated strategies is not. I suspect this asymmetry tracks the stability of the "choice" reading of mixed strategies. Strict dominance is robust enough to survive the separation of roles; weak dominance is not. If this is correct, the justification for IESDS survives the separation but in a demonstrably weaker form, requiring stronger common knowledge assumptions. If incorrect, the standard justification holds regardless of the ontological status of the mixture.

  **Methodology**
  This is a project in formal decision theory. I will construct two distinct formal models of strategic interaction to test the invariance of IESDS under the separation of the "choice" and "belief" roles of mixed strategies.

  1.  **The Choice Model (C-Model):** Agents have access to mixed strategies as explicit actions in the strategy space. Dominance is defined over this expanded space.
  2.  **The Belief Model (B-Model):** Agents are restricted to choosing pure strategies. Mixed strategies exist only in the meta-language as probability distributions representing beliefs. Dominance is defined by the existence of a belief distribution that makes a pure strategy suboptimal, without requiring the agent to be able to enact that distribution.

  I will derive the survival sets for both models under standard rationality and common belief in rationality assumptions. The core technical work involves proving whether the survival set in the B-Model is a proper subset of, identical to, or incomparable with the survival set in the C-Model.

  **Work Plan (One Semester)**
  *   **Month 1: Formalization.** Define the syntax and semantics for the C-Model and B-Model. Establish the definition of strict dominance in both frameworks. Ensure the B-Model does not smuggle in choice capabilities via the belief structure.
  *   **Month 2: Derivation in C-Model.** Re-derive standard IESDS results within the C-Model to serve as the baseline. Identify the specific lemmas that rely on the agent's ability to randomize.
  *   **Month 3: Derivation in B-Model.** Attempt to derive IESDS in the B-Model. This will likely require strengthening epistemic conditions (e.g., moving from belief to knowledge, or adding constraints on belief support).
  *   **Month 4: Comparison and Drafting.** Compare the survival sets. If they diverge, characterize the conditions under which divergence occurs. Draft the chapter, focusing on the interpretation of the divergence for the epistemic program.

  **Success and Failure Conditions**
  A successful result will demonstrate a divergence between the two models. Ideally, I will show that in the B-Model, fewer strategies are eliminable, or that elimination requires stronger epistemic preconditions (e.g., common *knowledge* rather than common *belief*). This would confirm the hypothesis that the standard argument trades on the choice reading.

  The project will count as a failure in two distinct senses. First, technical failure: inability to complete the proofs or formalize the B-Model without collapsing it into the C-Model due to modeling errors. Second, and more substantively, the project fails if the two readings provably coincide. If I prove that the survival sets are identical under equivalent epistemic conditions, the research question dissolves. This would imply the ontological status of the mixed strategy is mathematically irrelevant to IESDS. While this would be a valid mathematical result, it would negate the central thesis of the chapter, rendering the argument for a "weaker form" of justification untenable.

  **Scope and Risks**
  The scope is limited to finite, normal-form, two-player games. Extending this to n-player games or infinite games introduces complexity regarding the existence of best responses and the structure of belief hierarchies that is unmanageable for a single semester.

  The primary risk is bloat regarding weak dominance. While the asymmetry between strict and weak dominance motivates the project, analyzing iterated elimination of weakly dominated strategies formally is fraught with order-dependence issues that could derail the timeline. I will restrict the formal analysis to strict dominance, using weak dominance only as a qualitative diagnostic in the introduction and conclusion. If the formalization of the B-Model proves more resistant than anticipated, I will prioritize establishing the divergence in a specific subclass of games (e.g., zero-sum or generic payoffs) rather than attempting a general proof for all finite games. This ensures a determinate result is achieved within the semester, even if the generality is limited.
