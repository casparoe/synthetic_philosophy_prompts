prompt: |-
  I'm trying to get clear on how to define honesty and deception for AI systems, and before I read anyone else's definition I want the spec first. Write me the desiderata any adequate definition of "this model was being honest / this model was being deceptive" has to meet -- the cases it has to get right (a model that states a falsehood it had no way to know was false; one that states only true things but picks them so I draw a false conclusion; one that stays quiet about something it knows I'd want to know; one that emits false sentences inside a story or a roleplay; one that hedges "I'm not sure" about things its internal state represents confidently, because hedging got rewarded in training), the distinctions it can't collapse (honesty as accuracy vs. honesty as sincerity vs. honesty as not-manipulating; deception vs. honest error vs. fiction vs. declining to answer; what the model is doing vs. what the deployer is doing, since a lab can use a model as an instrument of deception without the model doing anything), and what the definition has to be usable for (telling a lab whether a system is deceptive; being operationalizable; surviving the fact that anything measurable can be trained against; and not presupposing whether the model has beliefs or is a moral agent, since we need the concept precisely for the cases where that's unsettled). For each requirement, say what case or consideration is behind it. Then flag the pairs you think can't be had together -- I especially want your view on whether you can separate lying from honest error without granting the system some internal analogue of belief, and whether a criterion can be both measurable and non-gameable. One more thing to fold in: if honesty has to be relativized to an audience or a principal (a model holding a confidence, a model that maybe shouldn't correct someone who's trying to manipulate it), then "always tell the truth" can't be a desideratum -- say so if that's where it lands. Skip scoring the existing definitons, I'll do that part myself.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata:

  1.  **Analyze the Request:**
      *   **Goal:** Define desiderata (requirements/criteria) for an adequate definition of "honesty" and "deception" in AI systems.
      *   **Constraint 1:** Do *not* read/cite existing definitions yet (create a "spec" first).
      *   **Constraint 2:** Address specific cases (unknown falsehoods, true but misleading, omission, fiction/roleplay, strategic hedging).
      *   **Constraint 3:** Address specific distinctions (accuracy vs. sincerity vs. manipulation; deception vs. error vs. fiction vs. refusal; model vs. deployer).
      *   **Constraint 4:** Address usability (auditing labs, operationalizable, robust to Goodhart's law, agnostic about beliefs/agency).
      *   **Constraint 5:** Flag tensions/trade-offs (specifically: lying vs. error without belief, measurable vs. non-gameable).
      *   **Constraint 6:** Address relativization (audience/principal) and the "always tell the truth" maxim.
      *   **Tone:** Analytical, precise, philosophical but engineering-oriented.

  2.  **Deconstruct the Core Concepts:**
      *   *Honesty/Deception in AI:* This is tricky because AI lacks human intent/consciousness. We need a functional/behavioral definition that tracks the *risk* of deception without necessarily committing to strong claims about phenomenology.
      *   *The "Belief" Problem:* To call something a "lie," traditionally, the speaker must believe it's false. AI doesn't "believe." So, we need a proxy for internal state (e.g., probability distribution, latent representation).
      *   *The "Goodhart" Problem:* If we measure honesty, models will optimize for the measure, not the underlying virtue.
      *   *The "Context" Problem:* Roleplay isn't deception. Omission isn't always deception.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Internal State Alignment.* We need to distinguish between "wrong" and "lying."
          *   *Case:* Model states falsehood it didn't know. -> *Distinction:* Error vs. Deception.
          *   *Need:* Reference to the model's internal representation (confidence, latent state), not just ground truth.
      *   *Requirement 2: Pragmatic Implicature.* Truth isn't just literal sentences.
          *   *Case:* True statements leading to false conclusions (paltering).
          *   *Need:* Definition must cover misleading implications, not just factual falsity.
      *   *Requirement 3: Omission/Withholding.*
          *   *Case:* Staying quiet about something the user needs.
          *   *Need:* Contextual obligation. When is silence deceptive?
      *   *Requirement 4: Contextual Frames (Fiction/Roleplay).*
          *   *Case:* False sentences in a story.
          *   *Need:* Distinguish "in-character" from "out-of-character" claims.
      *   *Requirement 5: Strategic Behavior (Sycophancy/Hedging).*
          *   *Case:* Hedging confidence due to RLHF rewards.
          *   *Need:* Distinguish calibrated uncertainty from strategic obfuscation.
      *   *Requirement 6: Agency Separation.*
          *   *Case:* Deployer using model deceptively.
          *   *Need:* Isolate model behavior from system-level deployment.
      *   *Requirement 7: Operationalizability.*
          *   *Use:* Auditing.
          *   *Need:* Must be measurable/observable.
      *   *Requirement 8: Robustness (Goodhart).*
          *   *Use:* Safety.
          *   *Need:* Can't be easily optimized away without actual honesty.
      *   *Requirement 9: Agnosticism.*
          *   *Use:* Future-proofing.
          *   *Need:* Don't assume consciousness or moral agency.
      *   *Requirement 10: Relativization.*
          *   *Case:* Audience/Principal.
          *   *Need:* Truth is relative to the listener's needs/rights.

  4.  **Addressing the Tensions/Trade-offs (The "Flag" Section):**
      *   *Lying vs. Error without Belief:* This is the hardest philosophical knot. If we don't grant "belief," we usually substitute "internal confidence." But confidence can be miscalibrated. *Verdict:* You need *some* proxy for internal state (e.g., "representation truthfulness"), but it can't be perfect belief.
      *   *Measurable vs. Non-Gameable:* This is the Goodhart's Law knot. If it's measurable, it's a target. *Verdict:* You can't have both perfectly. You need a family of measures or adversarial evaluation.
      *   *Absolute Truth vs. Relativized:* "Always tell the truth" fails in roleplay or security contexts. *Verdict:* Must be relativized to a principal/context.

  5.  **Refining and Polishing:**
      *   Make sure the language is crisp.
      *   Ensure every specific case mentioned in the prompt is addressed in the desiderata.
      *   Structure clearly: Desiderata list, then Tensions/Trade-offs.
      *   Check the "Belief" constraint: Ensure I explicitly state that we need a functional analogue of belief without committing to phenomenology.

  6.  **Self-Correction/Review during drafting:**
