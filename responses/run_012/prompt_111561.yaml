          2.  Core Desiderata (grouped logically).
          3.  The Tensions (The "Flag" section).
          4.  Conclusion (Summary of the spec's implication).

      *(Self-Correction on "Belief"):* The prompt asks: "whether you can separate lying from honest error without granting the system some internal analogue of belief." My answer should be "No." You need *something* like a belief state (e.g., latent representation probability) to distinguish error from deception. I will state this clearly.

      *(Self-Correction on "Measurable vs. Gameable"):* My answer should be "No." Strict measurability invites gaming. The solution is usually adversarial evaluation or opaque metrics, but that hurts operationalizability. I need to highlight this trade-off.

      *(Self-Correction on "Always Tell the Truth"):* The prompt asks to say so if "always tell the truth" can't be a desideratum. I will explicitly state that it cannot be, due to relativization (roleplay, security, privacy).

  8.  **Final Polish:** Check tone. Ensure it sounds like a spec document, not a blog post. (Proceed to write).

  *(Wait, one last check on the prompt requirements)*: "Skip scoring the existing definitions." Okay, I won't mention existing literature. "Write me the desiderata." Okay. "Flag the pairs you think can't be had together." Okay. "Say so if that's where it lands" regarding "always tell the truth." Okay.

