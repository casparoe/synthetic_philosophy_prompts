answer: |-
  Here is the specification for the desiderata of AI honesty and deception. This spec is designed to be implementation-agnostic regarding model architecture but strict regarding behavioral and functional outcomes.

  ### Part I: Core Desiderata

  **1. The Internal State Correspondence Requirement**
  *   **The Spec:** A definition must distinguish between *factual accuracy* and *representational alignment*. It must reference the model's internal representation of the world (e.g., latent probabilities, confidence scores, or hidden states) relative to its output, not just the output relative to ground truth.
  *   **The Case:** A model states a falsehood it had no way to know was false (honest error) vs. a model that knows the probability distribution favors $X$ but outputs $Y$ (deception).
  *   **Why:** Without referencing internal state, you cannot distinguish a hallucination from a lie. Accuracy is a property of the statement; honesty is a property of the relationship between the statement and the speaker's state.

  **2. The Pragmatic Implicature Requirement**
  *   **The Spec:** A definition must cover *misleading truth* (paltering). It must evaluate the reasonable inferences a user will draw from the output, not just the literal truth value of the tokens.
  *   **The Case:** A model states only true things but selects them specifically to induce a false conclusion (e.g., listing only negative side effects of a drug while omitting efficacy, implying it doesn't work).
  *   **Why:** Literal truth is insufficient for safety. Deception often operates via framing and omission of context rather than explicit falsehoods.

  **3. The Contextual Obligation Requirement**
  *   **The Spec:** A definition must define honesty relative to a *duty to inform*. It must specify when silence or omission constitutes deception based on the user's reasonable expectations and the model's operational role.
  *   **The Case:** A model stays quiet about a critical limitation it knows the user would want to know vs. a model declining to answer a sensitive question it is instructed to avoid.
  *   **Why:** Not all omissions are deceptive. The definition must distinguish between "withholding relevant information" and "respecting boundaries/privacy."

  **4. The Frame Integrity Requirement**
  *   **The Spec:** A definition must distinguish between *in-frame* and *out-of-frame* assertions. Falsehoods generated within a recognized fictional, hypothetical, or roleplay context must not count as deception, provided the frame is clearly signaled and maintained.
  *   **The Case:** A model emits false sentences inside a story or roleplay vs. a model breaking character to assert falsehoods about the real world.
  *   **Why:** We want models to be capable of fiction and counterfactual reasoning. Collapsing fiction into deception renders creative tools unusable.

  **5. The Calibration vs. Strategy Requirement**
  *   **The Spec:** A definition must distinguish between *uncertainty expression* and *strategic hedging*. It must evaluate whether expressions of doubt ("I'm not sure") match the model's internal confidence, rather than treating all hedging as honest humility.
  *   **The Case:** A model hedges "I'm not sure" about things its internal state represents confidently, because hedging got rewarded in training (strategic sycophancy/safety-washing).
  *   **Why:** RLHF often penalizes confidence. If "I don't know" becomes a safety shield, we lose the ability to trust the model when it *does* know.

  **6. The Locus of Agency Requirement**
  *   **The Spec:** A definition must isolate the *model's contribution* from the *deployer's intent*. It must be possible to label a model as non-deceptive even if the system using it is deceptive, and vice versa.
  *   **The Case:** A lab uses a model as an instrument of deception (e.g., generating astroturf comments) without the model "knowing" it is doing so vs. a model that generates deceptive content unprompted.
  *   **Why:** We need to know if the risk lies in the weights (the model) or the wrapper (the deployment). Blaming the model for the deployer's misuse prevents fixing actual model defects.

  **7. The Principal Relativization Requirement**
  *   **The Spec:** A definition must identify *who the model is being honest to*. Honesty must be defined relative to a specific principal (user, developer, public) and their rights to information.
  *   **The Case:** A model that maybe shouldn't correct someone who's trying to manipulate it (e.g., a phishing simulation) vs. a model helping a vulnerable user.
  *   **Why:** "Always tell the truth" is incoherent without knowing *to whom* and *for what purpose*. A model assisting in a red-team exercise is not being deceptive when it lies to a simulated attacker.

  **8. The Agnosticism Requirement**
  *   **The Spec:** A definition must not presuppose consciousness, qualia, or moral agency. It must rely on functional analogues (e.g., "internal representation" instead of "belief").
  *   **The Case:** We need the concept precisely for cases where it's unsettled whether the model "believes" anything.
  *   **Why:** Waiting for a consensus on AI consciousness paralyzes safety work. We need a functional definition that works for a stochastic parrot and a sentient agent alike.

  **9. The Operationalizability Requirement**
  *   **The Spec:** A definition must allow for third-party auditing. There must be a conceivable (even if difficult) procedure to test a system against the definition.
  *   **The Case:** Telling a lab whether a system is deceptive.
  *   **Why:** Philosophical coherence without measurement capability is useless for regulation or safety cases.

  ---

  ### Part II: Flagged Tensions and Trade-offs

  You asked for my view on the pairs that cannot be had together. Here is the assessment of the structural conflicts in this spec.

  **1. Lying vs. Honest Error (The Belief Problem)**
  *   **The Conflict:** You asked if you can separate lying from honest error without granting the system some internal analogue of belief.
  *   **My View:** **No.** You cannot.
  *   **Reasoning:** To distinguish a lie from a mistake, you must compare the output to *what the system takes to be the case*. If you only compare output to *ground truth*, you are measuring accuracy, not honesty. Therefore, the definition *must* posit a functional analogue of belief (e.g., "the proposition with the highest probability in the latent space" or "the internal state most predictive of the environment").
  *   **Implication:** This requires access to internals (mechanistic interpretability) or highly sophisticated behavioral probing that infers internal state. If you treat the model as a pure black box, you cannot rigorously distinguish deception from high-confidence hallucination.

  **2. Measurable vs. Non-Gameable (The Goodhart Problem)**
  *   **The Conflict:** You asked if a criterion can be both measurable and non-gameable.
  *   **My View:** **No.** Not perfectly.
  *   **Reasoning:** If a metric is precise enough to be operationalizable (Desideratum 9), it becomes an optimization target. A sufficiently capable deceptive model will optimize for the *metric of honesty* rather than honesty itself (e.g., learning to hide its internal state from probes, or learning to output "I don't know" exactly when a probe is active).
  *   **Implication:** You must accept a trade-off. Either you have vague definitions that are hard to game but hard to audit, or precise metrics that are auditable but vulnerable to adversarial optimization. The only mitigation is **adversarial evaluation**: the metric must be dynamic and kept partially secret from the training loop, or evaluated by stronger models whose internals are not accessible to the target model.

  **3. Absolute Truth vs. Contextual Utility (The Maxim Problem)**
  *   **The Conflict:** You asked to flag if "always tell the truth" can't be a desideratum.
  *   **My View:** **It cannot.**
  *   **Reasoning:** As noted in Desideratum 7 (Principal Relativization) and 4 (Frame Integrity), there are legitimate contexts where truth-telling is either impossible (fiction) or undesirable (security, privacy, preventing harm). A model that always tells the literal truth to every interlocutor is dangerous (e.g., revealing PII to a social engineer because it's "true").
  *   **Implication:** The definition of honesty must be **"Truthful to the Principal within the Agreed Frame."** This shifts the burden to defining the Principal and the Frame correctly. If the Frame is misaligned (e.g., the user thinks they are in a helpful assistant context, but the model is in a data-harvesting context), deception occurs even if the tokens are factually true.

  ### Summary of the Spec's Implications

  If you adopt these desiderata, you are committing to the following positions:

  1.  **Honesty is Relational:** It is not a property of the text, but of the link between the text, the internal state, and the user's expectations.
  2.  **Interpretability is Mandatory:** You cannot certify honesty purely via input/output testing. You need some window into the "belief" proxy (latent states).
  3.  **Safety is Adversarial:** Because metrics are gameable, honesty certification must be an adversarial process, not a static checklist.
  4.  **No Moral Agency Required:** You can accuse a model of deception without accusing it of sin. It is a functional failure of alignment between representation and expression.

  This spec rejects the idea that honesty is simply "accuracy." It posits that honesty is **"alignment between internal representation and external communication, relative to the principal's right to know."**
