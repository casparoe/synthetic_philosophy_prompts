  5. They acknowledge that part of the dispute is verbal, specifically regarding whether "positive" denotes a moral-aesthetic value or a purely logical consistency marker, because this definition dictates whether the axioms are substantive or trivial. However, they maintain the disagreement over modal collapse is substantive, as it concerns whether the logical structure itself forces all truths to be necessary regardless of terminology.
