answer: |-
  This is a classic problem in archaeological theory, often discussed under the headings of *equifinality* (different processes creating the same result) and *underdetermination* (evidence being insufficient to prove one theory over another). Your colleague is theoretically correct: material traces do not map one-to-one onto mental states. However, your dinner friends are practically wrong: a museum that claims nothing about past minds ceases to be a museum and becomes a warehouse.

  The "two-way gap" is real, but it is not a chasm that swallows all meaning. It is a filter that demands we change *how* we claim knowledge, not *whether* we claim it. Below are the implications ordered by how significantly they should alter your daily operations and decision-making, followed by the common logical errors (non-sequiturs) that arise from this argument, and finally an assessment of where the argument itself is weaker than it appears.

  ### 1. The Operational Shift: Changing the Modality of Interpretation
  **Impact:** High (Changes every label you write)

  The most immediate practical change is linguistic. You must stop writing in the *indicative* mood of fact ("This vessel was smashed to release the spirit") and start writing in the *modal* mood of inference ("The deliberate smashing of this vessel suggests a ritual intended to...").

  This is not merely hedging; it is accurate reporting of the evidence. The evidence *is* a smashed vessel. The *belief* is a hypothesis that explains the smashed vessel better than alternatives (e.g., accidental breakage, post-depositional pressure).
  *   **What to do:** Adopt a "layered label" strategy. The primary text should state the observation and the most probable interpretation clearly, without false certainty. Secondary text or digital layers can explain *why* that interpretation is preferred (e.g., "Similar vessels are found intact in domestic contexts, suggesting this breakage was specific to burial").
  *   **Why this matters:** It respects the visitor's intelligence. It models scientific thinking (observation $\rightarrow$ hypothesis) rather than dogmatic thinking (fact $\rightarrow$ truth). It allows the museum to update interpretations later without admitting "we lied before."

  ### 2. The Ethical/Legal Shift: Decoupling Affiliation from Symbolic Interpretation
  **Impact:** High (Changes high-stakes decision making)

  This is the most critical implication for repatriation and cultural affiliation. The "two-way gap" actually *strengthens* the position of descendant communities in many legal frameworks (such as NAGPRA in the US), provided the museum understands the inference limit.

  If a single trace (a bead arrangement) can be produced by beliefs we would never posit, then archaeology *cannot* definitively disprove a community's oral history or traditional knowledge about that trace.
  *   **What to do:** In affiliation decisions, weigh object-based evidence as *corroborative* rather than *determinative*. Do not reject a repatriation claim because the grave goods don't match the "standard archaeological model" of that culture's beliefs. The gap means your model of their beliefs is inherently fragile; their continuous tradition is often more robust.
  *   **Why this matters:** It prevents the museum from using "scientific uncertainty" as a shield to retain remains. If the material record is ambiguous (which the gap says it always is), the benefit of the doubt should ethically shift to the descendant community claiming continuity, rather than the institution claiming analytical authority.

  ### 3. The Pedagogical Shift: Teaching Inference Chains, Not Facts
  **Impact:** Medium (Changes training and internships)

  If the gap cuts through to how we teach students, then training must shift from memorizing "Culture X did Y" to reconstructing "How do we know Culture X did Y?"
  *   **What to do:** When training volunteers or interns, require them to map the "inference chain." For any claim (e.g., "centralized authority"), they must list the material observations (earthwork size, labor estimation) and the bridging assumptions (large earthworks require management, management implies authority).
  *   **Why this matters:** It produces curators who are defensible. When a claim is challenged, they can point to the bridge, not just the destination. If the bridge is weak, they know to reinforce it with comparative data or experimental archaeology rather than doubling down on the conclusion.

  ***

  ### Common Non-Sequiturs: What Does *Not* Follow
  Your dinner friends and perhaps some colleagues may draw conclusions that look logical but fail in practice. You should explicitly reject these in your committee work:

  1.  **"Therefore, we should never claim anything about past minds."**
      *   **Why it fails:** This is self-defeating. To say "we cannot know beliefs" is itself a claim about the past (a claim about the limit of knowledge). Furthermore, museums exist to interpret. Silence is not neutrality; it is a failure of mission. The goal is *warranted assertability*, not Cartesian certainty.
  2.  **"Therefore, all interpretations are equally valid."**
      *   **Why it fails:** The gap says one trace has *multiple possible* causes, not that *all possible* causes are equally likely. A smashed vessel is more likely to be ritual than a geological accident if it is found in a grave with other intentionally placed items. We can rank hypotheses by coherence, consistency, and comparative ethnography.
  3.  **"Therefore, repatriation requires archaeological proof of belief."**
      *   **Why it fails:** As noted above, the gap makes archaeological proof of specific beliefs nearly impossible. If repatriation hinged on proving the *exact* religious intent of the burial, almost no claims would succeed. Affiliation relies on continuity of identity, not continuity of specific ritual mechanics.

  ***

  ### Where the Argument is Weaker Than Supposed
  You asked for a defensible label, not a timid one. Your colleague's argument is theoretically sound but practically incomplete. Here is where the "two-way gap" narrows enough for you to walk across it with confidence:

  **1. The Braided Rope of Evidence**
  The gap assumes we are making inferences based on single traits (one pot, one bead). In practice, we rarely do. We rely on *conjunctions* of evidence.
  *   *Example:* A smashed pot alone proves little. A smashed pot + ochre on the body + orientation toward the sunrise + absence of domestic debris creates a *pattern*. While one belief can leave different traces, it is statistically unlikely that *five different* material traces would all align by accident to mimic a specific ritual pattern.
  *   **Practical Application:** You can be more confident in labels that rely on *assemblages* rather than *artifacts*. "The combination of red ochre, flexed posture, and smashed pottery is consistent with regional burial rites..." is a defensible, strong statement.

  **2. Middle-Range Theory and Ethnography**
  We are not guessing in a vacuum. We use "middle-range theory" (bridging the static material record with dynamic past behavior) via ethnography and experimental archaeology.
  *   *Example:* If contemporary or historically documented groups in the region smash vessels for the dead, the inference gap narrows significantly. It doesn't close completely (the past is a foreign country), but it becomes a bridge rather than a abyss.
  *   **Practical Application:** Use qualifying phrases that cite the bridge. "Consistent with practices observed in..." or "Analogous to..." This acknowledges the gap while utilizing the best available tool to cross it.

  **3. Practical Constraints Supply Truth-Values**
  In law and medicine (your friends' fields), decisions must be made despite uncertainty. They use standards like "preponderance of evidence" or "beyond reasonable doubt." Museums operate similarly.
  *   *Example:* In repatriation, the "truth" is not a metaphysical match of belief, but a legal/ethical determination of connection. The practical stake (returning ancestors) forces a resolution that pure theory does not.
  *   **Practical Application:** Do not let the theoretical gap paralyze ethical action. When the stakes involve human remains, the "default position" should not be "we don't know," but "we defer to the community with the strongest continuity claim unless there is overwhelming evidence to the contrary."

  ### Summary Recommendation for Your Committee
  Do not write timid labels that apologize for existing. Write **transparent** labels.

  *   **Avoid:** "This pot was smashed to feed the dead." (Unverifiable claim about mind).
  *   **Avoid:** "We don't know why this pot is smashed." (Timid, unhelpful).
  *   **Adopt:** "This vessel was deliberately broken before burial. While we cannot know the specific thoughts of the mourners, this practice mirrors rituals where objects are 'released' to accompany the deceased."

  This acknowledges the gap (we cannot know specific thoughts) while crossing it (we can identify the practice and its likely function based on comparison). It satisfies your colleague's rigor without accepting your dinner friends' paralysis. It allows the museum to speak about the past without pretending to be a oracle.
