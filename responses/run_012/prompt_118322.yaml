answer: |-
  Your distinction between load-bearing and ornamental constraints is intuitive, but it is fundamentally static. It treats poetic form as architecture—a set of beams and decorations—rather than as performance. In *Le Ton beau de Marot*, Hofstadter demonstrates that form is not a container for meaning; it is a generator of meaning. Consequently, your binary collapses under the weight of its own test case. A rhyme scheme is ornamental until the poet leans on it until it groans. At that moment, it becomes load-bearing. Therefore, the weight does not reside in the constraint itself, but in the poet's usage of it. To classify constraints beforehand is to guess at the poet's intent rather than observe the poem's action.

  We must junk the Load-bearing/Ornamental binary. It invites translators to preserve the wrong things for the wrong reasons. It suggests that an acrostic is inherently more sacred than a meter, when in fact a meter can be the very spine of a poem's emotional rhythm while an acrostic is merely a clever signature. The distinction fails because it categorizes features rather than effects. It assumes that because a constraint is formal, it is separable from the semantic content. But as your test case proves, the struggle with the form *is* the content.

  Consider the poem where the speaker gropes for a word, straining against a rhyme scheme that refuses to yield. The awkwardness is not a bug; it is the feature. It enacts the speaker's desperation or cognitive failure. A translation that smooths this out into fluent, easy rhymes has committed a fatal error. It has lied about the speaker's condition. It presents a confident voice where there was a stumbling one. This is a betrayal of sense in the name of preserving "readability," mistakenly categorizing the rhyme as ornamental noise that can be tuned out.

  However, the opposite approach is equally treacherous. A translation that forces an awkward rhyme in the target language merely to mimic the original's structure risks relocating the wound. If the French poet strained against a nasal vowel unique to their tongue, and the English translator strains against a guttural consonant cluster, the physical sensation of the poem changes. The reader feels a choke instead of a whine. The *location* of the friction has shifted. You have preserved the fact of the struggle, but altered the nature of the injury. This is not preservation; it is a reenactment with different props. It creates a different formal event that merely resembles the original.

  So, what is the rule? We must replace the static binary with a dynamic principle: **The Conservation of Resistance.**

  The translator's duty is not to preserve the constraint, but to preserve the *resistance* the constraint offers to the meaning. Form is friction. In the original poem, friction occurs where the desire to speak meets the limitation of language. The translator must identify the locus of that friction and ensure it exists in the translation with equivalent magnitude, even if the mechanism differs.

  If the original poem's tension arises from a strained rhyme, the translation must create tension where the speaker tries to express a thought and is impeded by the language. Sometimes, this means keeping the rhyme. If the target language allows for a rhyme that feels equally difficult, equally precarious, then keep it. But if forcing a rhyme in the target language makes the poem sound silly rather than desperate, the mechanism has failed. In that case, the translator must abandon the rhyme scheme but introduce friction elsewhere to conserve the resistance. You might break the syntax. You might introduce a cacophony of consonants. You might force a line break that halts the breath.

  The rule is this: **Translate the effect of the constraint, not the constraint itself.**

  This solves your test case definitively. A smooth translation is forbidden because it reduces resistance to zero. A mechanically awkward translation is forbidden if it increases resistance beyond the original or shifts its texture from psychological strain to linguistic absurdity. The verdict is not "it depends on the poem," but rather "it depends on the economy of effort." The reader must expend the same amount of cognitive and emotional effort to traverse the translation as they do the original. If the original stumbles, the translation must stumble. If the original bleeds, the translation must bruise.

  This approach acknowledges that form is a verb. It is something the poem *does*, not something the poem *has*. Hofstadter's myriad translations of Marot are not just variations on a theme; they are explorations of how different constraints generate different energies. Some generate wit, some generate sorrow. Your distinction asks which constraints are essential. The correct question is: which constraints are active?

  When a poet strains for a rhyme, they are telling you that language is insufficient. To translate that smoothly is to say language is sufficient. To translate that with a different kind of strain is to say language is insufficient, but in a different way. The only faithful path is to make the target language feel the same insufficiency at the same moment.

  Therefore, junk the Load-bearing/Ornamental split. It is a map of the terrain, not the terrain itself. Adopt the Principle of Equivalent Resistance. It demands more of the translator, certainly. It requires them to feel the poem's physics rather than just counting its syllables. But it is the only way to ensure that when the original poem breaks, the translation does not simply snap, but fractures along the same grain. Form is not what survives translation; form is what must be reborn.
