      *   Current theories often cherry-pick data (e.g., focusing only on belief, or only on ritual, or only on social function).
      *   The user suspects trade-offs (e.g., cognitive ease vs. costly commitment).
      *   The user brings an ecological lens (resource competition, niche, demographics).

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Universality vs. Diversity.* Religion is everywhere but looks different. A theory can't just say "it's Christianity" or "it's animism." It needs to cover the range.
      *   *Requirement 2: Cognitive Plausibility.* It has to fit how human brains actually work (memory, agency detection, etc.). Can't assume humans are rational calculators.
      *   *Requirement 3: The "Cost" Problem.* Why do people burn resources? (The user's specific point about costly signaling vs. cheap transmission).
      *   *Requirement 4: Transmission/Stability.* How does it survive across generations without collapsing into noise?
      *   *Requirement 5: The Ecological/Demographic Constraint.* (Addressing the user's specific question). Does it need to explain growth/decline rates? Yes, because religions behave like populations.
      *   *Requirement 6: The "Belief" Trap.* Does it need to explain literal belief? Many people don't literally believe but participate. A theory requiring strict belief fails.

  4.  **Refining and Categorizing (Non-negotiable vs. Preference):**
      *   *Non-negotiable:* Must fit human cognition, must explain stability/transmission, must account for cost.
