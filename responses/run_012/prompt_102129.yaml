  5.  **Addressing the Ecological Framing:**
      *   Is it a metaphor or a desideratum? It's a genuine desideratum. Religions compete for time, money, and children. If a theory ignores demographic carrying capacity, it's incomplete.

  6.  **Identifying the "Killer" Constraint:**
      *   What kills the most theories? Usually, it's the **Variability of Belief/Commitment** constraint. Theories that require sincere doctrinal belief fail because most adherents don't know the doctrine. Theories that require *only* social function fail because they can't explain why the *supernatural* content is necessary (why not just use a club?).
      *   Actually, the strongest killer is often the **Coexistence of Cheap and Costly elements**. A theory that explains viral ideas often fails to explain monastic asceticism. A theory that explains asceticism often fails to explain folk superstition.

