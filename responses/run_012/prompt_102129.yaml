          *   Address the "ecological niche" framing (is it a genuine desideratum or a misleading metaphor?).
          *   Mark requirements as non-negotiable vs. camp preferences.
          *   Identify if any subset is incompatible.
          *   Identify which single requirement knocks out the most popular theories.
