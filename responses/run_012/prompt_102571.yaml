          *   (4) says "If not created... contribute 0 when W is at least 0."
          *   So (4) respects the neutrality of non-existence for happy lives.
          *   The conflict is actually between (4) and (6). (6) says maximize total. (4) says count non-existence of suffering as positive.
          *   If I have a choice: Create Happy Person (+10) vs. Do Nothing (0).
          *   Ledger: Create (10) > Nothing (0).
          *   Asymmetry (2): Creating is never a benefit.
          *   *Contradiction:* (4) implies creating a happy person increases total value (10 > 0). (2) says creating is never a benefit.
          *   *Wait, check (2) again:* "bringing a person into existence is never a benefit *to that person*... and is therefore... usually wrong."
          *   (2) distinguishes benefit *to the person* vs. moral rightness.
          *   But if the Ledger says Value(Exist) > Value(Non-Exist) for happy lives, then creating them *is* a benefit *axiologically* (makes the world better), even if not *for the person*.
          *   (2) says "bringing a person... is never a benefit to that person... and is therefore... usually wrong." The "therefore" suggests the moral wrongness follows from the lack of benefit to the person.
          *   But if the Ledger says the World is Better, why is it Wrong?
          *   This suggests a tension between **Agent-Relative Constraints** (implied by 2) and **Impersonal Betterness** (implied by 4, 5, 6).
          *   *Severity:* High. It splits the theory into "What makes the world better" (Ledger) vs "What I should do" (Antinatalism).

  5.  **Drafting the Audit:**

      *   **Introduction:** Acknowledge the sophistication of the position. It's a "Person-Affecting Restriction + Totalism Hybrid."
      *   **Critical Tension (The Ledger vs. Independence):** Focus on the "Candidate Set" problem. This is the most technical and fatal flaw regarding (5).
