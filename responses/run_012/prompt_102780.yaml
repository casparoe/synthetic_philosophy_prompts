      *(Self-Correction during drafting)*: I initially thought about suggesting compatibilism. No, that's taking a side. Stick to the structural diagnosis of the argument. The user is essentially a "Hard Incompatibilist" or "Retributivist" at heart, while the friend is a "Strawsonian Naturalist." The gap is between Normativity and Naturalism.

      *Wait, one nuance:* The user says "I resent characters in novels... if that's a real case of blame... it seems to cut her way." The user thinks this supports *their* view? Or the friend's? The text says "seems to cut her way, but I can't tell." Actually, if we blame unfree characters, it suggests blame doesn't require metaphysical freedom. That supports the *friend*. I need to make sure I interpret this correctly. The user says "if that's a real case of blame... it seems to cut her way." Okay, so the user suspects it helps the friend. I should confirm that suspicion but explain *why* it doesn't solve the user's deeper worry about fairness.

      *Final Plan:*
      1.  Diagnosis: Framework Clash (Human Coherence vs. Cosmic Fairness).
      2.  The "Desert" Word: Equivocation (Fittingness vs. Metaphysical Debt).
      3.  The Fiction Point: Confirms Quality of Will > Metaphysical Freedom.
