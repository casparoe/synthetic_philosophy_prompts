answer: |-
  You have put your finger on the exact tension that makes this case famous, but there is a crucial correction to make about Parfit's goal before we dig into the mechanics.

  Parfit is **not** trying to establish that it is rational to pay the driver in the one-shot case. He is not arguing for "rational irrationality."

  His goal in *Reasons and Persons* is to argue that the **Self-Interest Theory (S)** is *self-defeating*. He uses the Hitchhiker case to show that if you accept (S) as your sole guide to rationality, you will end up worse off than if you accepted a different theory (like a moral theory or a present-aim theory).

  Here is the breakdown of the mechanics, the one-shot problem, and where the act/disposition distinction actually does work.

  ### 1. The Crucial Mechanism: Prediction, Not Promise
  Your setup says: *"A stranger offers you a lift on the condition that you'll send him money later."*

  Parfit's actual setup is more specific and vital: The driver is a psychologist (or a perfect mind-reader). He will **only** give you a lift if he **predicts** that you will pay him once you reach town. He cannot enforce the payment later.

  This turns the case from a simple Prisoner's Dilemma into a **Newcomb-like problem**.
  *   **Ex-Ante (in the desert):** To get the lift, you must be the *kind of person* who will pay.
  *   **Ex-Post (in town):** You are safe. The lift is already consumed. Paying costs you money and buys you nothing.

  ### 2. Is it Prudence or Irrationality?
  You asked: *"Is that really irrationality, or is it just prudence once you count the trust of future strangers?"*

  **If the game is repeated:** You are right. It is simple prudence. If you don't pay, you get a reputation, and no one picks you up next time. Self-Interest Theory (S) easily handles this. It says "Pay, because it maximizes long-term utility."

  **If the game is genuinely one-shot:** This is where Parfit's knife cuts.
  In a true one-shot case (no reputation, no guilt, no future drivers), (S) faces a contradiction:
  1.  **To get the benefit (life):** You must have a disposition to pay.
  2.  **To maximize utility (once safe):** You must *not* pay.

  (S) tells you that the rational act is the one that maximizes your self-interest.
  *   In the desert, the rational *disposition* is "I will pay."
  *   In town, the rational *act* is "I will not pay."

  If you are perfectly rational according to (S), the driver (who can predict your rationality) will know that once you are in town, you will defect. Therefore, he will not pick you up. You die.
  **Conclusion:** Following (S) leads to death. Ignoring (S) (by being morally committed to paying) leads to life. Therefore, (S) is **indirectly self-defeating**. It prescribes a mode of reasoning that guarantees a worse outcome for the agent.

  ### 3. The Genuinely One-Shot Case: Do you have a reason to pay?
  You asked: *"If you stipulate that it's genuinely one-shot... what reason does a rational agent have to... actually pay up?"*

  **Honest answer:** On the Self-Interest Theory, **there is no reason to pay.**

  Once you are in town, the causal link is broken. Your payment cannot causally affect the driver's past decision to save you. If you are a pure (S) agent, you keep the money.
  *   **The Problem:** Because you are a pure (S) agent, the driver knew you would keep the money. So he never saved you.
  *   **The Parfit Point:** Parfit isn't saying you *should* pay in the one-shot case according to (S). He is saying that because (S) forbids you from paying in the one-shot case, (S) prevents you from accessing the benefits of cooperation in prediction-based scenarios.

  This is why Parfit rejects (S). He argues we need a theory (like **Critical Present-aim Theory (P)**) that allows us to have reasons to keep promises even when breaking them would yield a slight net gain in self-interest, precisely so we can be the kind of people who get picked up in the desert.

  ### 4. Where the Act/Disposition Distinction Does Real Work
  You asked where this distinction is doing work vs. relabeling.

  **Where it is just relabeling:**
  If you think a "disposition" is just a mental trick you can turn on and off without consequence, it is relabeling. You cannot simply "have a disposition to pay" in the desert and then "switch it off" in town if the driver can predict your switching mechanism. If you are capable of switching it off, you never truly had the disposition; you had a disposition to *fake* it. If the driver can detect faking, you die.

  **Where it does real work:**
  The distinction separates **Criteria of Rightness** from **Decision Procedures**.
  *   **Criteria:** What makes an act rational? (S) says: "Maximizing self-interest."
  *   **Procedure:** How should we train ourselves to choose?

  Parfit argues that (S) fails because it cannot align the Criteria with the Procedure.
  *   If the **Criterion** is "Maximize self-interest in every act," the **Procedure** must be "Defect when safe."
  *   But if the **Procedure** is "Defect when safe," the **Outcome** is "Death in the desert."
  *   Therefore, the **Criterion** is flawed.

  The "work" the distinction does is exposing that a theory of rationality cannot just evaluate isolated acts in a vacuum; it must evaluate the *agent* over time. If a theory of rationality makes you the kind of agent who is predictable as a defector, that theory has failed you, even if every individual defection was "rational" by its own lights.

  ### 5. Which Version of the Case is Needed?
  For Parfit's conclusion to go through, you need specific stipulations. If you relax them, the problem vanishes.

  **Necessary Condition 1: Transparency/Predictability.**
  The driver must be able to predict your psychology *before* acting. If the driver cannot predict you, he takes a gamble. If he saves you based on a gamble, you are free to defect without having "caused" your own rescue via your character. The link between *being a payer* and *getting saved* must be tight.

  **Necessary Condition 2: No External Enforcement.**
  There can be no police, no reputation, no guilt, no divine punishment. If any of these exist, (S) can solve the problem by counting the cost of guilt or punishment. Parfit needs the cost of paying to be *pure loss* in the ex-post moment.

  **Necessary Condition 3: The "One-Shot" must be Ex-Ante Repeated.**
  This is subtle. For the argument to bite, the agent must face the *possibility* of this scenario. If you know for a fact you will *never* be in a Hitchhiker scenario, (S) has no problem. (S) is self-defeating only if it is a general theory that applies to all agents. If all agents follow (S), all agents die in the desert. If all agents follow a Moral Theory, all agents get lifted.

  ### Summary
  Parfit isn't trying to convince you to pay the driver. He is trying to convince you that **Self-Interest Theory is a bad theory of rationality.**

  *   **Your intuition:** "In a one-shot, paying is irrational." -> **Parfit agrees.**
  *   **Your intuition:** "So why have the disposition?" -> **Parfit says:** "Because having the disposition saves your life, but (S) forbids you from having it sincerely."
  *   **The Conclusion:** Since (S) forbids you from having the life-saving disposition, (S) is self-defeating. We ought to adopt a theory that gives us genuine reasons to pay, even in the one-shot case, so that we can be the kind of people who survive the desert.

  The "act/disposition" distinction isn't a loophole to make paying rational; it's the spotlight that shows why (S) breaks down when psychology is transparent.
