answer: |-
  Here is a 90-minute lesson plan designed to force the identification problem from a statistical nuisance into an ontological constraint.

  ### The Sequence (90 Minutes)

  **1. The Ontological Setup: Cohort vs. Generation (0–20 mins)**
  *   **Goal:** Distinguish the demographic container from the causal mechanism.
  *   **Action:** Define **Cohort** strictly as a birth interval (a demographic fact, like a grid coordinate). Define **Generation** as a cohort that shares a *fate* (a social kind, bound by a common historical exposure that alters their trajectory).
  *   **Why here:** You cannot feel the pain of the identification problem until you care about *which* vector is doing the work. If a generation is just an age group, the problem dissolves into aging curves. If it is a "shared fate," you need to isolate the cohort vector to prove the fate exists.
  *   **Head off the Philosophers:** They will say, *"A generation is just an age group moving through time."* Stop this immediately. Insist that if it is only age, "Boomer" is a synonym for "50–70 year old," and the label will vanish when they die. If it is a generation, the label sticks to the *birth year* regardless of age. Force them to commit: are we studying aging or history?

  **2. The Case Study: The "Digital Vote" (20–50 mins)**
  *   **The Case:** A longitudinal plot of support for digital privacy regulation.
      *   **Observation:** Support is high among young people today, low among old people today. But 20 years ago, support was high among young people *then*, and low among old people *then*.
  *   **What it must have:** Plausible causal stories for all three vectors.
      *   *Age:* Young people are naturally more idealistic/protective.
      *   *Period:* A major data breach just happened, scaring everyone.
      *   *Cohort:* "Digital Natives" were socialized differently regarding privacy.
  *   **What it must lack:** A "clean" comparison. There must be no group that aged without time passing, and no time that passed without everyone aging.
  *   **Activity:** Split the room. Philosophers propose the *mechanism* (why the kind exists); Sociologists propose the *model* (how to estimate it). Have them present. They will talk past each other. The philosophers will describe a "shared fate"; the sociologists will describe a fixed effect.

  **3. The Hammer: The Identification Problem as Limit (50–70 mins)**
  *   **Goal:** Reframe the APC (Age-Period-Cohort) constraint from a technical error to a metaphysical boundary.
  *   **Action:** Write $Age = Period - Cohort$ on the board. Show that the data matrix is singular.
  *   **The Pivot:** Do not teach them how to fix it (HAPC, IE, etc.). Teach them that **every solution is a constraint.** To estimate a cohort effect, you must *assume* something about the period or age effect (e.g., "adjacent cohorts are similar" or "period effects are zero").
  *   **The Lesson:** You cannot find a generation in the data alone. You can only find a generation if you *assume* one exists. The identification problem proves that "generation" is not an empirical discovery; it is a theoretical imposition.
  *   **Head off the Sociologists:** They will say, *"The identification problem shows generational talk is empty/instrumental."* Correct them. It shows generational talk is *underdetermined*, not empty. It means the truth value of "Millennials are distinct" depends on which constraint you impose, not just on the raw numbers. It makes the claim heavier, not lighter.

  **4. The Shelter: Cluster Kinds without Essences (70–85 mins)**
  *   **Goal:** Offer a viable ontology that survives the identification problem.
  *   **Action:** Introduce the **Homeostatic Property Cluster (HPC)** view. A generation is real not because it has an essence (e.g., "born between 1981–1996"), but because a cluster of properties (debt, tech use, voting) clusters together, held by some homeostatic mechanism (the "shared fate" from Part 1).
  *   **Why here:** This comes *after* the identification problem. The ID problem says we can't statistically isolate the causal vector. The HPC view says we don't need to isolate the vector to acknowledge the cluster is real. It allows philosophers to keep realism without requiring sociologists to solve the unsolvable matrix.
  *   **Caveat:** Remind them that HPC doesn't solve the APC problem; it just changes what "real" means. The cluster is real, but the *source* of the clustering remains underdetermined.

  **5. Closing & Refusal (85–90 mins)**
  *   **The Closing Question:** Do not ask "Are generations real?" Ask:
      > *"If you publish a paper claiming a cohort effect, what assumption about age or period are you forcing the data to accept, and why is that assumption justified by theory rather than convenience?"*
      *   **Why:** If they answer with a statistical method (e.g., "I used a random effect"), they failed. If they answer with a theoretical constraint (e.g., "I assume biological aging is linear here"), they succeeded.
  *   **The Open Refusal:** Explicitly refuse to settle **which constraint is the correct one.**
      *   Say: *"I will not tell you whether to assume period effects are zero or whether adjacent cohorts are smooth. That is not a statistical choice; it is a metaphysical wager about how history works. You must make that wager explicitly."*

  ### Summary of Misconceptions & Interventions

  | Group | Misconception | Intervention Point |
  | :--- | :--- | :--- |
  | **Philosophers** | "A generation is just an age group." (Confusing Age & Cohort) | **Part 1.** Force the distinction between "getting older" (Age) and "being born then" (Cohort). If they conflate them, the ID problem makes no sense. |
  | **Sociologists** | "The ID problem means generational claims are nonsense." (Instrumentalism) | **Part 3.** Reframe ID not as "we can't know," but as "the data cannot speak without a theoretical constraint." It elevates the theory, it doesn't kill the object. |

  ### The One Case: "The Smartphone Shift"
  *   **Must Have:** A sharp inflection point that looks like a cohort effect (e.g., mental health drops) but coincides perfectly with a period effect (iPhone release) and an age effect (puberty).
  *   **Must Lack:** A control group. There is no group that went through puberty *without* smartphones available in that period. This absence is what makes the identification problem visceral. It shows that the "shared fate" (Part 1) is empirically indistinguishable from the "historical moment."

  ### Pedagogical Note
  Your authority comes from refusing to let the sociologists treat the ID problem as a nuisance to be regressed away, and refusing to let the philosophers treat "generation" as a concept decoupled from measurement. The identification problem is the bridge: it is where the math bites the metaphysics. Keep them there.
