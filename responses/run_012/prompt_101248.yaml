      *   *Requirement 2: Metric Neutrality/Pluralism.* Must account for both aggregate suffering (intensity $\times$ duration) and individual rights/violations (death count). (Addresses Beef vs. Chicken).
      *   *Requirement 3: Causal Attribution.* Must attribute harm to the marginal consumer, accounting for supply chain complexities (crop deaths included). (Addresses Crop Deaths).
      *   *Requirement 4: Systemic Comparison.* Must compare alternative agricultural systems (intensive vs. pasture) on equal footing. (Addresses Pasture Systems).
      *   *Requirement 5: Existence Value.* Must have a parameter for the moral value of bringing a sentient being into existence (positive or negative). (Addresses Lives Worth Living).
      *   *Requirement 6: Uncertainty Weighting.* Must incorporate moral uncertainty regarding sentience (especially invertebrates). (Addresses Invertebrate Sentience).
      *   *Requirement 7: Counterfactual Baseline.* Must evaluate harm relative to the next-best land use, not a vacuum. (Addresses Counterfactual Land Use).

