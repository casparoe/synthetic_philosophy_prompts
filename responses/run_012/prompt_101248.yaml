      *   *Crop Deaths:* Plant agriculture isn't harm-free (field mice, insects).
      *   *Pasture Systems:* Trade-off between field animal deaths and livestock lifespan/suffering.
      *   *Lives Worth Living:* The "Logic of the Larder" argument (creating happy beings adds value).
      *   *Invertebrate Sentience:* Epistemic uncertainty (moral weight of insects).
      *   *Counterfactual Land Use:* Opportunity cost (rewilding vs. farming).

  3.  **Drafting the Desiderata (The Specification):**
      *   I need to formulate these as formal requirements for a theory $T$.
