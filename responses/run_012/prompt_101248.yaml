answer: |-
  To place the ethics of eating on a quantitative footing, we must define the specification of the moral calculus before running the numbers. An adequate theory $T$ must map dietary choices to moral costs $C$. Below are the desiderata $T$ must satisfy, derived from the cases you provided, followed by an analysis of their logical status and compatibility.

  ### The Desiderata

  **1. Valence Sensitivity (The Bad Life Constraint)**
  *   **Specification:** $T$ must distinguish between the moral cost of *ending* a life and the moral cost of *sustaining* a life with negative welfare.
  *   **Case:** An animal killed painlessly at birth vs. an animal kept alive for years in severe suffering before slaughter.
  *   **Requirement:** The theory cannot treat "death" as a uniform unit of harm. It must integrate a welfare function $W(t)$ over time, where $\int W(t) dt < 0$ constitutes a distinct moral debit from the termination event itself.

  **2. Metric Pluralism (The Beef-Chicken Constraint)**
  *   **Specification:** $T$ must accept inputs for both *aggregate suffering* (intensity $\times$ duration $\times$ population) and *individual violations* (count of deaths).
  *   **Case:** Beef involves fewer deaths but potentially more suffering per animal; chicken involves more deaths but less suffering per animal.
  *   **Requirement:** The theory cannot collapse solely into "deaths per calorie" or "suffering per calorie." It must possess a weighting parameter $\lambda$ that allows the user to adjust the moral significance of individual discontinuity (death) versus aggregate experience (suffering).

  **3. Supply Chain Completeness (The Crop Death Constraint)**
  *   **Specification:** $T$ must attribute harm to all causal nodes required for the diet, including indirect mortality in plant agriculture.
  *   **Case:** Combine harvesters killing field mice; pesticides killing invertebrates.
  *   **Requirement:** The boundary of the moral calculation cannot be drawn at the slaughterhouse. It must extend to the field. A plant-based diet must register a non-zero harm score attributable to crop protection and harvest mechanization.

  **4. Systemic Equivalence (The Pasture Constraint)**
  *   **Specification:** $T$ must compare agricultural systems (intensive vs. extensive/pasture) using the same baseline metrics.
  *   **Case:** Pasture systems may reduce crop deaths (no tillage) but extend the lifespan of livestock before slaughter.
  *   **Requirement:** The theory must handle trade-offs between wild animal mortality (field) and domestic animal mortality (livestock). It cannot privilege one system by ignoring the specific harms unique to the other (e.g., ignoring predation in pastures or ignoring confinement in intensive systems).

  **5. Population Ethics Parameterization (The Existence Constraint)**
  *   **Specification:** $T$ must explicitly define the moral value of bringing a sentient being into existence.
  *   **Case:** The "Logic of the Larder" argument: if a farmed animal has a net-positive life, does its creation credit the moral ledger?
  *   **Requirement:** The theory must include a variable $V_{exist}$ for the value of existence. This variable may be set to zero (person-affecting views), positive (total utilitarianism), or negative (anti-natalist/negative utilitarian views), but it cannot be undefined.

  **6. Sentience Uncertainty Weighting (The Invertebrate Constraint)**
  *   **Specification:** $T$ must incorporate epistemic uncertainty regarding the moral status of the entity.
  *   **Case:** Deep uncertainty about whether insects or bivalves are sentient.
  *   **Requirement:** The theory cannot treat sentience as binary (0 or 1). It must apply a probability weight $P(sentience)$ to the moral cost of harming invertebrates, allowing the cost to scale with the likelihood of consciousness.

  **7. Counterfactual Baseline Integration (The Land Use Constraint)**
  *   **Specification:** $T$ must evaluate harm relative to the next-best alternative use of the land, not a vacuum.
  *   **Case:** If farmland were abandoned, would it rewild? Would wild animal suffering increase or decrease?
  *   **Requirement:** The moral cost of a diet is the *difference* between the farming scenario and the counterfactual land-use scenario. A diet is only "harmful" if it produces worse outcomes than the land would have produced otherwise.

  ***

  ### Analysis of Requirements

  #### Genuine Requirements vs. Camp Assumptions
  *   **Genuine Requirements:** *Supply Chain Completeness*, *Sentience Uncertainty Weighting*, and *Valence Sensitivity* are genuine requirements for any theory claiming quantitative rigor. They reflect empirical realities (crop deaths exist, sentience is uncertain, lives have quality variations) that cannot be ignored without falsifying the model.
  *   **Camp Assumptions:** *Population Ethics Parameterization* is the primary locus of camp assumptions. The specific *value* assigned to $V_{exist}$ is not a requirement of an adequate theory, but a choice of moral framework.
      *   Setting $V_{exist} > 0$ is a **Total Utilitarian** assumption.
      *   Setting $V_{exist} = 0$ is a **Person-Affecting** or **Rights-Based** assumption.
      *   Setting $V_{exist} < 0$ is a **Negative Utilitarian** assumption.
      *   An adequate theory must *allow* this parameter to be set, but mandating a specific credit for existence would be biasing the theory toward the "Logic of the Larder."

  #### Incompatible Requirements
  *   **Metric Pluralism vs. Rights Constraints:** You cannot jointly satisfy a strict **Deontological Rights View** and **Aggregate Utilitarianism** within a single optimization function.
      *   If death is an intrinsic rights violation (Deontology), it acts as a veto or a lexically prior constraint. No amount of aggregate suffering reduction (Metric Pluralism) can justify the violation.
      *   If death is tradable against suffering (Utilitarianism), then rights are not inviolable.
      *   *Resolution:* The theory must declare which metric is lexical (priority) and which is aggregative. It cannot treat them as equal, interchangeable currencies without a conversion rate that effectively reduces one to the other.
  *   **Counterfactual Baseline vs. Supply Chain Completeness:** These create a tension in attribution.
      *   *Supply Chain Completeness* attributes all deaths in the chain to the consumer.
      *   *Counterfactual Baseline* suggests that if the land would have killed animals anyway (via predation/starvation in the wild), the farmer is not responsible for those deaths.
      *   *Conflict:* If you count crop deaths as harm caused by the vegan, but subtract wild deaths that *would have happened* anyway, you risk double-counting or zeroing out responsibility depending on how the baseline is defined. A theory cannot simultaneously claim "you own all deaths in your supply chain" and "you only own the *difference* from the wild baseline" without a rigorous rule for causal overdetermination.

  #### The Most Exclusionary Requirement
  **Requirement 7 (Counterfactual Baseline Integration)** excludes the most candidate theories.
  *   **Reasoning:** Most existing moral theories of diet (e.g., standard Animal Liberation arguments, standard Life Cycle Assessments) operate on a *partial equilibrium* model. They compare "Farming" to "Nothing."
  *   **Exclusion:** Requiring a *general equilibrium* model (Farming vs. Rewilding vs. Alternative Farming) excludes almost all simplistic deontological frameworks (which focus on the act, not the alternative state of the world) and most current environmental LCAs (which lack ecological modeling of wild population dynamics). It demands a level of ecological prediction that most ethical frameworks are not built to handle.

  ***

  ### Epistemic Humility and Failure Modes

  **Where this reasoning is most likely to fail:**
  My specification assumes that the counterfactual state of land (Requirement 7) is knowable or modelable with sufficient precision to be a variable in a moral equation. This is likely false. Ecological systems are chaotic; predicting the welfare of wild animals in a rewilded scenario involves massive uncertainty regarding predation, disease, and starvation rates. By making this a non-negotiable desideratum, I may be demanding a precision that nature does not permit, rendering the theory paralyzed by uncertainty rather than guided by it.

  **What argument or evidence would change my mind:**
  I would withdraw **Requirement 7 (Counterfactual Baseline)** as non-negotiable if presented with a robust argument for **Causal Inertness** in land use.
  *   **The Argument:** If evidence showed that agricultural land use is *decoupled* from wild land availability (e.g., if farmed land is not taken from the wild but created on otherwise uninhabitable substrate, or if market mechanisms ensure that land not used for farming is immediately paved for housing rather than rewilded), then the counterfactual is not "wild animals" but "concrete."
  *   **The Mind-Changer:** Empirical data demonstrating that marginal changes in diet do not shift land use patterns (e.g., due to fixed subsidies or inelastic land markets) would prove that the counterfactual is irrelevant to the consumer's moral responsibility. In that case, **Supply Chain Completeness (Requirement 3)** becomes the sole non-negotiable metric, and the counterfactual becomes a theoretical distraction.
