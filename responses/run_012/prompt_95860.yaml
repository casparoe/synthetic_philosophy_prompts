      *   *Check:* Did I address the "idealization vs. installation of limits" point clearly? *Fix:* Use the distinction between *idealizing the processor* vs. *idealizing the resources*.
      *   *Check:* Is the toy example clear? *Fix:* Make sure the divergence point is sharp (the "gestalt" aspect).
      *   *Check:* Did I start with the brainstorming? *Yes.*

  8.  **Final Polish:** Ensure the transition from brainstorming to the main argument is smooth. Make sure the verdict lands hard. (Proceed to generate output based on this plan).

  *(Self-Correction Note during drafting the brainstorming section)*: I need to make sure I don't just list terms but evaluate them. "Abstraction" is wrong because HCH adds detail. "Simulation" is close but implies a copy. "Operationalization" is strong. Let's push "Operationalized Competence."

  *(Self-Correction on Normativity)*: Be careful not to say HCH *is* reflective equilibrium, but that it *aspires* to a computational version of it. The authority is derived from the *stability* of the answer under decomposition, not the *purity* of the source.

  *(Self-Correction on Agency)*: Emphasize the "functional unity" vs "phenomenal unity" distinction. This is classic Phil Mind territory.

