      *   **Hypothesis:** These aren't four answers to one question, but answers to *different* questions under one heading (validity of induction, consistency of announcement, meaning of "surprise").
      *   **Specific Interest:** Is the announcement a prediction about epistemic state (self-referential)? Does this reading separate the camps or restate one?
      *   **Task:** Provide a *diagnosis*, not a solution.
