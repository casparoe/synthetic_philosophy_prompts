      *   *The Student's Argument:* Backward induction. If it's Friday, I'll know Thursday night. So not Friday. If Thursday, I'll know Wednesday night (since Friday is out). So not Thursday... Eliminate all days.
      *   *The Outcome:* Exam happens (say, Wednesday). Student is surprised. Teacher was right.
      *   *Key Positions:*
          1.  **Quine/O'Connor:** The student implicitly assumes he *knows* the announcement is true. This assumption is unjustified. (Focus on knowledge premises).
          2.  **Shaw/Hintikka (Epistemic Logic):** The announcement is self-referential and leads to inconsistency (Moore-paradoxical). $K(A \land \neg K A)$.
          3.  **Wright/Sorensen:** The announcement creates a "blindspot." It's true but unknowable.
          4.  **Game Theoretic/Iterated Knowledge:** Focus on levels of knowledge ($K, KK, KKK...$). The induction fails because higher-order knowledge degrades.
          5.  **Contextualists:** "Know" shifts meaning during the argument.

  3.  **Evaluate the User's Hypothesis:**
      *   *Hypothesis:* Different writers are answering different questions.
      *   *Verdict:* Highly plausible. The "Paradox" is actually a cluster of problems depending on how you formalize "surprise" and "knowledge."
      *   *Sub-question:* Is the announcement a prediction about epistemic state?
