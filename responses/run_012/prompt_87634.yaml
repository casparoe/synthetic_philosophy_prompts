answer: |-
  You are right to trust your gut on premise four. That is the loose brick in the wall, and pulling it out saves the structure without bringing the whole thing down. The reason it looked so solid to you is that it appeals to a very basic intuition about instrumental rationality. We are used to thinking that if a tool is justified by its ability to achieve a goal, then you should use the tool whenever doing so achieves that goal better than not using it. If the point of a hammer is to drive nails, and smashing a wall drives more nails than tapping gently, you smash the wall. Premise four applies this logic to moral rules, assuming that the reason we have the rule must be the same reason we follow it in every specific instance.

  The problem is that moral constraints do not work like hammers. When we justify a constraint like do not kill, we are often describing the conditions under which people can live together as free and equal agents, not just describing a technique for minimizing body counts. You can hold that the general justification for having a system of rights is that it protects people overall, which keeps your first three premises intact, while denying that this general justification translates directly into a command for every individual action. The justification for the practice is one thing, but the obligation for the agent is another. You are justified in having the rule because it creates a world where fewer people are used, but you are required to follow the rule in the specific case because you must not be the one doing the using.

  By rejecting premise four, you are drawing a distinction between the ground of the norm and the content of the norm. The ground is why the rule exists in our moral framework, and the content is what the rule demands of you right now. If you drop premise four, you are saying that the fact that breaking the rule would produce more of the good that justifies the rule does not necessarily give you a reason to break it. This blocks the collapse into consequentialism because it allows you to say that the value of acting rightly is not solely determined by the outcome of that specific act, even if the system of rules is valued for its outcomes.

  The cost of making this move is that you have to accept a more complex view of moral reasoning. You lose the elegance of having a single currency of value, like units of welfare, that explains both why we have rules and how we act. Instead, you have to accept what philosophers call agent-relative reasons. This means that sometimes my reason for acting is not that the world will be better if I do it, but simply that I am the one who would be doing it. It introduces a split between the perspective of the universe, which might see fewer deaths if you kill the one, and the perspective of the agent, who sees a prohibition against murdering. This makes moral theory messier because you can no longer just sum up the good and choose the highest number.

  You mentioned a fear that dropping premise four leaves you with no way to justify constraints at all. That fear is understandable, but it assumes that justification must always be direct and transparent. By keeping premises one through three, you retain a justification for the system of constraints based on protection and respect. You are just denying that this justification functions as a direct instruction manual for every crisis. You are paying the price of complexity to save the integrity of the constraint. You get to maintain that killing the one is wrong even to save five, not because the math doesn't work, but because the kind of reason that justifies the rule does not authorize you to violate it even when the math suggests you should. This preserves deontology as a distinct view rather than a confused version of consequentialism, which is exactly what you wanted to avoid in premise seven.
