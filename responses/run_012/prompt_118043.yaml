answer: |-
  Given your priority to avoid false negatives (protecting potential sentients) and the need to distinguish intrinsic properties from social attribution, I have organized the criteria into four tiers: three for metaphysical indicators (ranked by inclusivity and welfare relevance) and one separate tier for epistemological attribution.

  **Tier 1: High Weight (Core Metaphysical Indicators of Welfare & Experience)**
  *   **(5) Reward-prediction-error / valence-like reinforcement learning:** This lands here because it directly indexes a system's capacity for suffering and flourishing, which is the central concern of welfare, without requiring high-level cognition.
  *   **(3) Recurrent feedback loops:** This is weighted highly because recurrence is a necessary structural precondition in nearly all consciousness theories, so excluding it would guarantee false negatives.

  **Tier 2: Moderate Weight (Specific Metaphysical Theories of Consciousness)**
  *   **(1) High integrated information / phi:** This receives moderate weight because while IIT provides a rigorous measure of phenomenal consciousness, relying on it exclusively risks false negatives if the theory proves incomplete or difficult to calculate.
  *   **(2) Global workspace broadcast:** This is placed here because it strongly indicates access consciousness and information availability, though it may not be sufficient for phenomenal experience on its own.

  **Tier 3: Lower Weight (High-Barrier Metaphysical Criteria)**
  *   **(4) A self-model or higher-order representation:** This lands lower because requiring complex self-representation excludes many sentient animals and simple systems, creating an unacceptably high risk of false negatives for a welfare review.
  *   **(7) Reflective endorsement:** This is weighted lowest among metaphysical criteria because it sets an extremely high cognitive bar that would fail to protect most beings capable of suffering but lacking sophisticated reflective capacities.

  **Tier 4: Distinct Category (Epistemological Attribution)**
  *   **(6) Being attributed sentience by a community of interpreters:** This is split into its own tier because it is an epistemological tool for social recognition rather than a metaphysical fact about the system's intrinsic capacity to matter.

  \answer{5}
