answer: |-
  This slogan is the colloquial shorthand for the **Pessimistic Meta-Induction (PMI)**, most famously formalized by Larry Laudan in 1981 ("A Confutation of Convergent Realism"). Your nagging feeling is correct: the slogan is a rhetorical Swiss Army knife that conflates distinct philosophical claims. When your postdoc friend uses it, he is likely sliding between these claims to make the argument seem stronger than any single version actually is.

  Here is the menu of distinct claims hidden inside "the history of science is a graveyard of theories," separated by logical function, with verdicts you can bring to the group.

  ### The Menu of Claims

  #### 1. The Base-Rate Induction (The Logical Engine)
  *   **The Claim:** "Most theories that were considered successful in the past are now considered false. Therefore, by simple induction, most theories considered successful now are probably false."
  *   **Verdict:** **Defensible-but-Contentious.**
  *   **Analysis:** This is the core logical move. It is defensible because the historical record *does* show turnover. However, it is contentious due to **sample bias**. The "graveyard" is curated; we remember the famous dead theories (phlogiston, ether) but forget the theories that died quietly or the theories that survived (atomism, conservation of energy, heliocentrism). Furthermore, realists argue the sample should be restricted to *mature* sciences with *robust* testing, which shrinks the graveyard significantly.
  *   **Does it kill realism?** No. It suggests caution, not abandonment. Even if 50% of current theories are false, believing in *some* unobservables is rational.

  #### 2. The Strong Ontological Claim (The Reference Attack)
  *   **The Claim:** "Theoretical terms in past successful theories (e.g., 'phlogiston', 'ether') failed to refer to anything real. Therefore, current theoretical terms (e.g., 'electron', 'quark') likely fail to refer."
  *   **Verdict:** **False (in the strong form); Defensible (in the weak form).**
  *   **Analysis:** The strong form says 'ether' referred to *nothing*. This is historically dubious. As Putnam and Kitcher argued, 'ether' referred to *the medium of light propagation*, which turned out to be the electromagnetic field (or spacetime geometry). They got the *nature* of the referent wrong, not the existence of the phenomenon. If 'electron' refers to "the carrier of negative charge in atoms," it likely refers, even if our current quantum field theoretic description of it changes.
  *   **Does it kill realism?** No. It supports a causal theory of reference where terms can refer even if the description associated with them is false.

  #### 3. The Strong Truth Claim (The Propositional Attack)
  *   **The Claim:** "Past successful theories were literally false (e.g., 'Phlogiston is released during combustion' is false). Therefore, current theories are literally false."
  *   ** **Verdict:** **Trivial.**
  *   **Analysis:** Strictly speaking, almost all scientific theories are literally false (they rely on idealizations, ceteris paribus clauses, etc.). Newtonian gravity is "false" because of General Relativity. But realism is rarely a claim about *literal, exact* truth.
  *   **Does it kill realism?** No. Realism is a claim about **approximate truth**. If the postdoc means "theories aren't exactly right," he is right, but he hasn't touched scientific realism, which only claims theories are *approximately* right about the structure of the world.

  #### 4. The Success Criterion Claim (The Premise Check)
  *   **The Claim:** "Past theories were genuinely *successful* (made novel predictions) just like current ones."
  *   **Verdict:** **Defensible-but-Contentious.**
  *   **Analysis:** This depends on what "successful" means.
      *   *If "successful" = "widely accepted":* The claim is **True**, but the argument fails. Acceptance is sociological, not truth-tracking.
      *   *If "successful" = "made novel predictions":* This is **Contentious**. Laudan argued yes (e.g., Fresnel's ether predicted the white spot). Realists (like Psillos) argue the *quality* and *variety* of prediction in modern science (e.g., the Higgs boson, gravitational waves) vastly outstrips the ad-hoc predictions of phlogiston theory.
  *   **Does it kill realism?** Only if you accept that phlogiston theory was as predictively robust as Quantum Electrodynamics. Most historians of science would say it wasn't.

  #### 5. The Structural Retention Claim (The "Stripped-Down" Reading)
  *   **The Claim:** "While the *entities* (phlogiston, ether) were discarded, the *mathematical structure* and *relations* (equations of heat flow, wave equations for light) were retained in successor theories."
  *   **Verdict:** **Defensible (and historically accurate).**
  *   **Analysis:** This is the basis of **Structural Realism** (Worrall). Fresnel's equations for light work perfectly fine without the luminiferous ether. The relations were real; the substance posited to bear them was not.
  *   **Does it kill realism?** It kills *Entity Realism* (believing in the specific nature of the stuff) but saves *Structural Realism* (believing in the relations/math). It directly contradicts the postdoc's conclusion to "believe in nothing." It says "believe in the structure, be agnostic about the furniture."

  ---

  ### The "Approximate Truth" Pivot
  You suspected the phrase "the theory turned out to be false" is doing too much work. You are right. This is the **Verisimilitude** gap.

  *   **The Postdoc's Implication:** False = Worthless. (Phlogiston theory is false, so it tells us nothing about reality).
  *   **The Realist Counter:** False $\neq$ Not Approximately True.
      *   Newtonian mechanics is "false" (superseded by Einstein). But it is *approximately true* within certain limits. It captures real structure.
      *   If past theories were *wildly* false (no approximate truth), they wouldn't have worked technologically. The fact that caloric theory allowed for engineering heat engines suggests it latched onto *something* real (conservation of energy/thermodynamics), even if the fluid ontology was wrong.
  *   **Verdict:** The claim "Past theories were false" is **True**, but the inference "Therefore they were not approximately true" is **False**. The PMI fails if realism is defined as belief in approximate truth rather than final truth.

  ---

  ### Diagnosis: What is he actually arguing?

  Your postdoc is most likely relying on a conflation of **Claim #1 (Base-Rate Induction)** and **Claim #2 (Strong Ontological Claim)**.

  He is arguing:
  1.  Look at the graveyard (Base-Rate).
  2.  See that the *entities* are dead (Ontological).
  3.  Conclude that *current entities* are dead.

  **Does this support "Don't believe in electrons"?**
  **No.** Even if this argument succeeds, it only supports **Instrumentalism** or **Structural Realism**, not the radical skepticism he implies.
  *   **Instrumentalism:** "Use the theory, don't believe it." (Consistent with his view).
  *   **Structural Realism:** "Believe the math/relations, suspend judgment on the 'stuff'." (Consistent with history, but still a form of realism).
  *   **Radical Skepticism:** "Believe nothing about the unobservable." (This does *not* follow). Just because *some* past entities didn't exist doesn't mean *no* unobservables exist. By that logic, because some past maps were wrong, we should believe in no geography.

  ### How to Push Back (The "Cheat Sheet")

  Next time he deploys the slogan, try one of these three moves:

  1.  **The Reference Move:** "Are you claiming 'ether' referred to *nothing*, or that it referred to the electromagnetic field but got the properties wrong? If the latter, then reference is stable, and realism survives."
  2.  **The Maturity Move:** "Are you inducting over *all* past theories, or only mature, highly tested ones? Phlogiston theory wasn't tested the way the Standard Model is. The sample is biased."
  3.  **The Structure Move:** "You're throwing out the structure with the ontology. The Fresnel equations survived the death of the ether. So why can't we be realists about the structure of the electron even if our ontology shifts?"

  **Summary Verdict for the Group:**
  The slogan is a **rhetorical overreach**. As a claim about the fallibility of specific ontological posits, it is **True**. As a logical proof that we should believe in *nothing* unobservable, it is **Invalid** (it commits a base-rate fallacy and ignores approximate truth/structural retention). It justifies humility, not skepticism.
