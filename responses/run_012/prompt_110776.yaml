  Reject Premise (2). This argument is David Lewis's famous Triviality Result. The consensus among philosophers of language is that indicative conditionals do not express propositions with standard truth conditions.

  Premise (2) looks innocent because conditionals grammatically resemble declarative sentences. We assert them, deny them, and bet on them, suggesting they describe possible states of affairs. It feels natural to assume they are truth-apt, qualifying for standard probability treatment like any other proposition.

  However, Lewis proves that if conditionals are propositions (2) and obey the Adams Thesis (1), probability spaces collapse. To save (1)—the strong intuition that confidence in "If A then B" equals $P(B|A)$—you must deny (2). Conditionals are not truth-apt propositions; they do not denote events in the probability space. Thus, $P(A \to B)$ is ill-formed unless understood as shorthand for $P(B|A)$.

  What do you lose? You lose the ability to treat conditionals as standard Boolean objects. You cannot easily nest them (e.g., "If (if A then B), then C") or apply standard logical operations without a non-classical semantics. Probability theory applies to propositions; if conditionals aren't propositions, they fall outside the direct scope of $P(\cdot)$, residing instead in the logic of conditional assertion.

  The alternative is rejecting (1). This forces you to treat $A \to B$ as the material conditional ($\neg A \lor B$). The price is higher: it implies any conditional with a false antecedent is automatically true. This clashes violently with linguistic intuition (e.g., "If the moon is cheese, then 2+2=5" feels false, not true).

  Comparing the exits: Rejecting (1) saves classical logic but kills the intuitive link between conditionals and conditional probability. Rejecting (2) saves the intuitive link but requires a non-propositional semantics. Most philosophers prefer rejecting (2). It preserves the normative rule for belief (Adams Thesis) while acknowledging that conditionals function differently than factual claims. You keep the useful rule (1) by admitting it doesn't describe the probability of a truth, but rather the strength of a conditional commitment.
