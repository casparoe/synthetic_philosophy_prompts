  Setting: They met in a quiet corner of a London coffee shop, steam rising from their mugs. Elias, an American political scientist visiting from Boston, sat across from Sophie, a Dutch policy analyst based in Amsterdam. The air smelled of roasted beans and rain.

  Elias: It starts with the word itself, and it feels like we are speaking different languages despite sharing a vocabulary. In Boston, if I call myself a liberal, I am arguing for healthcare access, environmental regulation, and a robust safety net to protect citizens from market volatility. Here, you tell me I am advocating for soft tyranny. How can the same word justify the welfare state in one continent and demand its dismantling in the other?

  Sophie: Because in Amsterdam, liberal still means what it meant to Locke and Smith. It is about limiting power, not wielding it. You describe a social democrat who sees the state as a vehicle for justice. We describe the individual's right to be left alone by the bureaucracy you want to expand. The core is liberty from interference, not liberty through provision.

  Elias: But being left alone means little if you are starving or sick. Take a wealth tax. My side says redistributing excess capital frees the poor to participate in society as equals. Your side calls it confiscation. Are we disagreeing on economics, or on what freedom actually is? Is freedom the absence of a taxman, or the presence of opportunity?

  Sophie: We are disagreeing on the source of rights. You think freedom is a capacity the state grants through redistribution. I think it is a boundary the state cannot cross. Taking earned wealth violates property rights, which are the bedrock of liberty. That is illiberal, regardless of how many people it helps. You cannot steal to save.

  Elias: Then consider hate-speech laws. In the US, liberals defend the right to offend because free exchange is paramount. In Europe, liberals often support bans to protect marginalized groups from harm. If you care about liberty, why silence the speaker? Is the liberty to speak worth more than the liberty to walk safely?

  Sophie: Because speech can be an act of violence, not just opinion. If my liberty to speak destroys your liberty to exist safely in public, the balance tips. We protect the target, not the aggressor. Your absolutism allows the strong to intimidate the weak out of the marketplace of ideas. Liberty requires a safe arena.

  Elias: Yet you support bans on face coverings in public. That is the state telling women what to wear. American liberals see that as authoritarian coercion. You call it liberating them from community pressure. Who decides which coercion is worse? The state forcing removal, or the community forcing coverage?

  Sophie: The state must ensure a secular public sphere where individuals meet as citizens, not symbols. You criticize the ban, yet your cohort embraced strict epidemic lockdowns. You are comfortable with state power when it serves safety, just not when it serves secularism. You pick and choose when liberty yields to collective need.

  Elias: That's fair, but look at the terminology itself. A neoliberal is a free-marketeer, usually a pejorative from the left. But an illiberal democrat is someone who breaks democratic norms. The word splits even Europe against itself. French liberals differ from German ordoliberals. You claim a monolith that doesn't exist.

  Sophie: The factions are tactical, not fundamental. We all agree the default is liberty, the exception is state power. In America, you flipped the default. You assume the state solves problems unless proven otherwise. That is the provincial drift, not our usage. The split you see is noise; the anti-statist core is the signal.

  Elias: We didn't flip it; history did. Industrial capitalism created private powers as threatening as kings. Positive liberty requires resources. If you ignore that, your liberalism becomes a shield for oligarchy. You're fighting nineteenth-century battles while we face twenty-first-century concentrations of power.

  Sophie: And you solve them by empowering the very entity that threatens liberty most. Once the state controls the economy to ensure positive liberty, it controls life itself. We agree on dignity, but your means corrupt the name. You cannot coerce people to be free. That is the substantive clash, not the label.

  Where they landed: Once the labels were stripped away, the disagreement proved substantive rather than merely verbal. Both speakers valued human dignity and autonomy, but they identified opposite threats to those ends. Elias viewed private inequality and social coercion as the primary enemies of freedom, requiring state intervention to correct. Sophie viewed state power itself as the primary enemy, requiring strict limits to protect individual autonomy. The verbal confusion over "liberal" obscured a genuine clash between positive and negative liberty. While the word's history explains the divergence, the political conflict remains real: one side seeks freedom through state capacity, the other freedom from state capacity. Neither was merely arguing about definitions; they were arguing about who holds the power to shape lives.
