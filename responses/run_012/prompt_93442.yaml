answer: |-
  Good morning. To our two Immigration Judges, to the members of the bar, to the teachers and students from the high school, and most importantly, to the sixty individuals who are about to become citizens: welcome to the courthouse.

  I am a law clerk here. My job is to read, to research, and to draft opinions for the judges. I spend my days inside the text of the law. So, when I was asked to speak today, I wanted to talk about the document you are about to promise to support and defend.

  Usually, at a ceremony like this, we talk about the Constitution as a finished thing. A monument. We talk about the Founders as if they handed down a perfect tablet from a mountain. But I want to talk about it as Frederick Douglass did. Not the Douglass of the famous Fourth of July speech—you've all heard that one—but the Douglass of the 1840s and 50s.

  Because for a long time, Frederick Douglass hated the Constitution.

  In the first decade of his public life, Douglass agreed with the abolitionist William Lloyd Garrison. They believed the Constitution was a pro-slavery document. They called it a "covenant with death." And honestly? They had a point. The document protected the slave trade for twenty years. It counted enslaved people as three-fifths of a person for representation. It required free states to return fugitive slaves. In 1854, the Supreme Court would rule in *Dred Scott* that Black people had no rights which the white man was bound to respect.

  So, if you were Douglass in 1845, swearing an oath to that Constitution felt like swearing an oath to your own enslavement. Garrison actually burned a copy of the Constitution on the Fourth of July. He said, "So perish all compromises with tyranny."

  But then, in the early 1850s, Douglass changed his mind. He didn't change his goal—freedom remained the goal. He changed his reading of the text.

  He began to argue that the Constitution, if read strictly as a legal document, was actually anti-slavery. He pointed out that the words "slave" and "slavery" appear nowhere in the original text. The document speaks of "persons," not "property." He argued that the Preamble's goal to "secure the blessings of liberty" applied to everyone, not just white men. He realized that by calling the Constitution pro-slavery, the abolitionists were handing the slaveholders a gift. They were conceding that the law itself was against them.

  Douglass decided to claim the law. He argued that the text was a tool, and it was better in the hands of a friend than in the hands of an enemy.

  Now, I've been arguing about this with my brother-in-law, who is a historian. And we've come to think that both versions of Douglass were half-right. And I think that tension is exactly why you are here today, and why your oath matters.

  The Garrisonian Douglass was right that the Constitution, in practice, was a bargain with slave power. For seventy years, the courts and the politicians used this text to defend human bondage. The text did not free anybody by itself. Ink on paper doesn't stop a whip. It took a war. It took blood. It took people like Douglass forcing the country to confront the gap between what the text said and what the country did.

  But the later Douglass was also right. The text *allowed* for a better reading. It left the door open. It used words like "We the People" and "Liberty" and "Justice." Those words were promises that the Founders didn't fully keep, but they put them in the document anyway. They put them there so that people like Douglass, and people like you, could pick them up and use them.

  This brings us to the oath you are about to take.

  It is a serious thing to promise to defend a document that was once used to deny citizenship to people who look like many of you. It is honest to admit that. If anyone tells you this history is simple, they are lying to you.

  But look at who is in this room. You have judges who interpret the law every day. You have lawyers who argue over its meaning. You have high school students learning how government works. And you have sixty new citizens.

  When you take this oath, you are not swearing that the Constitution is perfect. You are not swearing that the past was clean. You are swearing that you will take up the tool.

  Douglass realized that a constitution is not a statue. It is a verb. It is something we *do*. The text didn't free the slaves; people used the text to free the slaves. The text didn't integrate the schools; people used the text to integrate the schools. The text doesn't protect your rights on its own. It requires citizens who are willing to read it, argue over it, and insist on its best possibilities.

  To the students in the back: You are learning civics. Learn the cases, learn the articles, but remember that the law is a language. And like any language, it changes depending on who is speaking it and what they are demanding.

  To the new citizens: You are not just joining a country. You are joining a argument. It is an argument about what "We the People" actually means. For a long time, that "We" was very small. It has gotten bigger over time, but only because people stood in places like this courtroom and insisted that the text meant what it said.

  So, when you raise your right hand in a few moments, know what you are doing. You are not pledging loyalty to a history of injustice. You are pledging loyalty to the mechanism we use to fix it. You are saying that you will not burn the document, but you will not let it be used as a shield for tyranny either. You will read it. You will hold it to its own promises.

  The Constitution is just paper. It has no power unless you give it power. Frederick Douglass spent his life giving it power. Now, for the next chapter, that work belongs to you.

  Thank you.
