      *   Let's go with **The Requirement of Non-Eliminable Moral Remainder**. It kills Consequentialism (which eliminates regret if utility is maxed) and rigid Deontology (which eliminates the permission to act). It forces a pluralist or tragic view.

  10. **Review against Constraints:**
