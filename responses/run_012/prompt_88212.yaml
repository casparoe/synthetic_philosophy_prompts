          *   Identify the single requirement that excludes the most popular accounts.
      *   **Constraints:** No reading lists, no scorecards of named views. Focus on criteria and cases. Reasoning is paramount. Table allowed but reasoning matters more.

  2.  **Deconstruct the Target Phenomenon:**
