      *   *Power:* A coerced "compromise" is submission.
      *   *Epistemic:* Humility vs. Conviction.

  9.  **Refining the "Killer" Requirement:**
      *   Is it Moral Remainder? Or is it the distinction from Modus Vivendi?
      *   Modus Vivendi is a strong competitor. Many realists say *all* political compromise is just MV.
      *   However, the prompt asks about *Moral* Compromise.
      *   Let's look at Consequentialism. Consequentialism dissolves the problem. If the outcome is best, it's just "the right thing," not a "compromise" in the tragic sense.
      *   Let's look at Deontology. It often forbids it.
