      *   *Example:* Hospital protocol (allows X with safeguards).

  3.  **Drafting the Desiderata (Iterative Process):**
      *   *Need:* A structured list of requirements. Let's group them logically.
      *   *Group 1: Definition & Distinction.* Must distinguish compromise from surrender, modus vivendi, etc.
      *   *Group 2: Normative Status.* Is it good? Bad? Necessary? What about regret?
      *   *Group 3: Limits.* What *can't* be compromised? (Rights, sacred values).
      *   *Group 4: Process & Power.* Coercion, asymmetry, sincerity.
      *   *Group 5: Scope & Bindingness.* Future generations, dissenters, duty to compromise.

      *Refining specific points based on prompt instructions:*
      *   *Gains from Trade:* Must explain how value is realized, not just preference satisfaction. (Crucial for moral vs. prudential).
      *   *Distinctions:* Capitulation (one side loses), Bargaining (interests only), Toleration (putting up with), Modus Vivendi (peace without moral endorsement). Compromise needs *mutual moral concession*.
      *   *Second-Best:* Must explain why a "sinful" or "imperfect" outcome is choiceworthy.
      *   *Remainder:* Must account for the lingering guilt/regret.
      *   *Limits:* Deontological constraints. Can you compromise on genocide? No.
      *   *Power:* A deal under duress isn't a moral compromise.
      *   *Integrity:* How do I stay true to myself while compromising?
      *   *Epistemic:* What if I'm not sure I'm right?
      *   *Legitimacy:* Does the compromise make the outcome legitimate?
      *   *Duty:* Must I compromise?

  4.  **Distinguishing Desiderata from Prejudices:**
      *   *Prejudice:* "Compromise is always virtuous" (Pragmatism). "Compromise is always betrayal" (Absolutism).
      *   *Genuine:* The theory must explain *when* it is virtuous vs. vicious.
      *   *Non-negotiable:* Must account for the *moral* nature of the conflict (not just interests). Must account for the *remainder*.
      *   *Negotiable:* Whether there is a *duty* to compromise (might be context-dependent). Whether it requires *friendship* vs. mere *respect*.

  5.  **Identifying Incompatibilities (The "Impossibility" Check):**
      *   *Tension:* Integrity vs. Agreement. If I hold a value as absolute, compromising it violates integrity. If I compromise, I admit it's not absolute.
      *   *Tension:* Legitimacy vs. Truth. If the compromise is morally imperfect, how can it be legitimate?
      *   *Tension:* Duty to Compromise vs. Duty to Justice. If justice demands X, compromising on X might be unjust.

  6.  **Identifying the "Killer" Requirement:**
      *   What excludes the most popular accounts?
