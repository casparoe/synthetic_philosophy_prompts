answer: |-
  # Specification for a Theory of Moral Compromise

  ## I. The Anchor Case
  The specification is grounded in the hospital ethics committee case: Two blocs hold conflicting *moral* commitments (intrinsic degradation vs. failure of care). They reach a settlement (protocol with review/benefit sharing) that is preferred to deadlock. Neither converts; both condemn the protocol as imperfect; both accept it as necessary.

  A theory of moral compromise must explain the normative structure of this settlement. It cannot treat the conflict as merely prudential (interests) nor the resolution as a conversion (consensus). The following desiderata specify what such a theory must deliver.

  ## II. Desiderata Table

  | Category | Requirement | Rationale & Motivating Cases |
  | :--- | :--- | :--- |
  | **Conceptual Boundaries** | **1. Value-Realization Gains:** The theory must explain how parties gain *moral* value, not merely preference satisfaction, through concession. | *Case:* In the hospital case, the "degradation" bloc gains the value of *protection* (review), while the "care" bloc gains the value of *access*. If the theory reduces this to utility, it misses the moral texture. Compromise must show how partial realization of conflicting goods is better than total realization of none (deadlock). |
  | | **2. Distinction from Modus Vivendi:** The theory must distinguish compromise from a mere balance of power (modus vivendi). | *Case:* If the protocol holds only because the "care" bloc has the votes to crush the other but chooses not to *for now*, that is modus vivendi. Compromise requires that both sides view the settlement as having *some* moral warrant, not just strategic prudence. |
  | | **3. Distinction from Capitulation:** The theory must distinguish mutual concession from one-sided surrender. | *Case:* If the "degradation" bloc accepts the protocol only because they are threatened with firing, that is capitulation/coercion. Compromise requires reciprocal concession. |
  | **Normative Status** | **4. The Second-Best Justification:** The theory must justify choosing an outcome both parties regard as morally imperfect. | *Case:* Both blocs think the protocol is morally flawed. The theory must explain why implementing a known moral flaw is permissible (or required) without claiming the flaw disappears. |
  | | **5. Moral Remainder:** The theory must account for persistent regret or guilt even after a justified compromise. | *Case:* Members of the "degradation" bloc may feel they have stained their hands by permitting the intervention. A theory that says "it was the right thing, so feel no regret" fails to capture the phenomenology of moral compromise. |
  | | **6. Integrity Constraint:** The theory must explain how agents compromise without destroying their moral integrity. | *Case:* If a doctor believes an intervention is murder, compromising on it may violate professional integrity. The theory must define the boundary where compromise becomes self-betrayal. |
  | **Structural Limits** | **7. Non-Tradability Threshold:** The theory must specify which values are immune to compromise (rights, sacred duties). | *Case:* If the intervention were torture rather than "degrading care," compromise should be ruled out. The theory needs a criterion for when a value is categorical vs. negotiable. |
  | | **8. Third-Party Protection:** The theory must address duties to those not at the table. | *Case:* If the protocol benefits the hospital but harms patients who cannot consent, the compromise is suspect. Compromise between A and B cannot validly trade away the rights of C. |
  | **Process & Power** | **9. Power Asymmetry Check:** The theory must identify when background inequality invalidates the compromise. | *Case:* If the "care" bloc controls the funding and forces the protocol on a dependent "degradation" bloc, the settlement is coerced. Moral compromise requires a baseline of reciprocal vulnerability. |
  | | **10. Sincerity & Recognition:** The theory must require mutual recognition of the opponent's moral standing. | *Case:* If the "care" bloc views the "degradation" bloc as superstitious rather than morally motivated, the settlement is merely technical, not moral compromise. |
  | **Scope & Bindingness** | **11. Epistemic Humility:** The theory must address compromise under uncertainty about one's own values. | *Case:* If the "degradation" bloc is unsure if the intervention is truly degrading, compromise is easier. The theory must distinguish compromising due to doubt vs. compromising despite conviction. |
  | | **12. Bindingness Conditions:** The theory must specify when a compromise binds dissenters or future generations. | *Case:* Does the protocol bind new committee members who weren't part of the deal? Does it bind the objecting doctors to *perform* the intervention, or merely to *allow* it? |
  | | **13. Duty vs. Permission:** The theory must state whether compromise is obligatory, permissible, or supererogatory. | *Case:* Is the committee *required* to find a protocol, or are they permitted to resign rather than compromise? |

  ## III. Genuine Desiderata vs. Sectarian Prejudices

  To ensure the specification is neutral enough to evaluate competing theories, we must filter out assumptions that belong to specific moral traditions rather than the phenomenon itself.

  | Requirement | Potential Prejudice | Genuine Desideratum |
  | :--- | :--- | :--- |
  | **Compromise is Virtuous** | *Liberal Pragmatism:* Assumes compromise is always better than conflict. | *Neutral:* The theory must allow that some compromises are vicious (e.g., compromising on slavery). |
  | **Compromise is Betrayal** | *Moral Absolutism:* Assumes any concession on principle is corruption. | *Neutral:* The theory must allow that some compromises are necessary and justified. |
  | **Consensus is the Goal** | *Deliberative Democracy:* Assumes the aim is to eliminate disagreement. | *Neutral:* The target phenomenon *preserves* disagreement. The theory must explain settlement *without* consensus. |
  | **Utility Maximization** | *Consequentialism:* Assumes the "best" outcome dissolves the moral cost. | *Neutral:* The theory must account for the *cost* of the compromise, not just the net benefit. |

  **Non-Negotiable Requirements:**
  1.  **Moral Remainder (Desideratum 5):** If a theory explains away the regret (e.g., "you did the right thing, so stop feeling bad"), it fails to describe *moral* compromise. It describes either a change of mind or a calculation. The persistence of the conflicting value's claim is constitutive of the phenomenon.
  2.  **Distinction from Modus Vivendi (Desideratum 2):** If the settlement is based solely on power balance without mutual moral recognition, it is political stability, not moral compromise.
  3.  **Non-Tradability Threshold (Desideratum 7):** A theory that allows *anything* to be compromised (e.g., basic human rights) is morally untenable. There must be a limit.

  **Negotiable Requirements:**
  1.  **Duty to Compromise (Desideratum 13):** It is an open question whether there is a general duty to compromise or if it is context-dependent. A theory can be adequate whether it posits a duty or merely a permission.
  2.  **Epistemic Basis (Desideratum 11):** A theory can ground compromise in *moral humility* (I might be wrong) or in *moral conflict* (I am right, but so are you, and we must live together). Both are viable paths.
  3.  **Bindingness (Desideratum 12):** Theories may differ on whether compromises bind only signatories or constitute institutional precedent.

  ## IV. Incompatibilities: The Trilemma of Compromise

  There is a strong suspicion that the following three requirements cannot be jointly satisfied in all cases. A theory may have to prioritize two at the expense of the third.

  1.  **Integrity:** Agents must remain true to their core moral commitments.
  2.  **Agreement:** Agents must reach a settlement that requires conceding on those commitments.
  3.  **Justification:** The settlement must be morally justified (not merely a necessary evil).

  **The Impossibility:**
  If I hold a commitment as *core* to my integrity (1), conceding on it (2) seems to violate integrity. If I say the concession is *justified* (3), I imply the commitment was not absolute, which challenges (1). If I say the commitment *was* absolute, I cannot justify (2).

  **Implication for the Theory:**
  Any adequate theory must adopt a **pluralist axiology**. It must reject the idea that moral values form a single, consistent hierarchy. It must posit that values can be incommensurable or that moral agents are "divided selves." If a theory assumes a monistic value structure (e.g., all values reducible to utility, or all duties derived from one categorical imperative), it will collapse the trilemma by denying one of the horns (usually Integrity or Remainder). The theory must explain how one can be *morally stained* yet *justified*.

  ## V. The Exclusionary Requirement

  The single requirement that does the most work to exclude the most popular accounts of morality is **Desideratum 5: The Requirement of Non-Eliminable Moral Remainder.**

  **Why this excludes popular accounts:**

  1.  **Excludes Act Consequentialism:** For a consequentialist, if the compromise produces the best available outcome, it is the *right* action. Once the calculation is made, there is no normative residue. To feel regret is to misunderstand the morality of the situation. The requirement of Moral Remainder insists that regret is *appropriate* even when the action is justified. This forces the theory to acknowledge that moral values are not fully commensurable on a single scale.
  2.  **Excludes Rigid Deontology:** For a strict deontologist, if an action violates a duty (e.g., "do not permit degradation"), it is forbidden. There is no "justified violation." A compromise that permits the "sinful" act is simply wrong. The requirement of Moral Remainder demands a space for *justified wrongdoing* (or "dirty hands"), which rigid deontology cannot accommodate.
  3.  **Excludes Pure Realism:** For a political realist, the "remainder" is merely psychological or strategic risk, not moral. They view the regret as irrational sentimentality. The requirement insists the remainder is *normative*—the opposing value still makes a claim on you.

  **Conclusion:**
  By insisting that a justified compromise leaves a **normative scar**, the specification rules out any monistic moral theory that seeks to resolve conflict through calculation or hierarchy. It demands a theory capable of holding conflicting moral truths simultaneously: that the settlement is necessary and right, *and* that the concession is a moral loss. This is the distinctive burden of a theory of moral compromise.
