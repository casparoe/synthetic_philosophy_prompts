answer: |-
  **TO:** Ethics Panel & Board Chair
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Police Proposal on Caller Scripts and Evidence Logging

  **Recommendation**
  I recommend we **decline** the police proposal to instruct staff to state definitively that a resident is not present, and specifically **reject** the requirement to log these statements as factual records for use as evidence. We should maintain our current protocol of "cannot confirm or deny," while collaborating with police to log the *fact* of the harassment calls themselves, rather than the content of our responses.

  **The Case for the Proposal (Safety and Consequences)**
  We must acknowledge the strength of the opposing view. In a refuge context, the primary ethical imperative is the physical safety of the resident. A utilitarian calculation suggests that if a falsehood stops a violent ex-partner from persisting, the lie is morally justified by the harm it prevents. The police argument is pragmatic: the "cannot confirm" ambiguity signals hope to the stalker, prolonging the harassment. A definitive "she is not here" closes the loop. Furthermore, logging these interactions provides the paper trail necessary to secure a conviction, removing a dangerous individual from the community permanently. To prioritize abstract truth over a woman's immediate safety can feel like a betrayal of our core mission.

  **The Kantian Objection and Institutional Integrity**
  However, we must reckon seriously with Kant's prohibition on lying, even to the "murderer at the door." Kant argues that lying corrupts the source of all right. If we institutionalize lying, we degrade our own capacity to be trusted. In a refuge, trust is not merely a virtue; it is an operational necessity. Residents must trust that we are honest with them; partners and families must trust our communications; and we must maintain integrity with the courts.

  If we adopt a policy of systematic deception, we blur the line between protection and complicity. When staff are instructed to lie, we impose a moral injury upon them, forcing them to violate their own conscience to satisfy policy. More critically, Kant warns that we cannot control the consequences of a lie. If our falsehood inadvertently leads the ex-partner to believe she is elsewhere, prompting him to go to that location (a friend's house, a parent's home), we may have inadvertently placed her or others in greater danger. Truth-telling is a duty not just to the listener, but to the moral agent speaking.

  **The Deciding Factor: Evidentiary Logging**
  While one might argue for a verbal falsehood in an extreme, imminent emergency to protect life, the police proposal goes further: they request we **log these statements as fact** for prosecution. This is the ethical and legal dealbreaker.

  1.  **Legal Liability:** If these logs are submitted as evidence, staff are effectively creating false official records. Should this case go to court, a defense attorney could subpoena our logs. If a staff member testifies that they logged the statement as a "protection strategy" rather than fact, it undermines the evidence. If they testify it is fact, they commit perjury. We cannot place our staff in a position where their duty of care requires them to risk contempt of court.
  2.  **Institutional Credibility:** A refuge that falsifies records loses its standing as a neutral, safe haven. If it becomes known that our logs are not truthful accounts of interactions but tactical fabrications, our credibility with housing authorities, social services, and the courts erodes.

  **Conclusion and Alternative Path**
  We cannot sacrifice the integrity of our records to secure a conviction. The evidence of stalking lies in the *frequency and nature of the calls made by the ex-partner*, not in the *responses given by our staff*.

  **I propose the following policy:**
  1.  **Script:** Staff continue to state, "I cannot confirm or deny the presence of any resident," and then terminate the call.
  2.  **Logging:** Staff log the *incoming call* (time, date, number, aggression level) as a harassment incident, without logging a false statement of fact regarding resident location.
  3.  **Police Collaboration:** We will provide police with the logs of *incoming* harassment. This provides the evidence of stalking without requiring our staff to falsify records.

  We must protect our residents without turning our staff into instruments of state deception. Safety cannot be built on a foundation of institutional falsehood.

  **Verdict:** No to the proposed script and logging policy.
