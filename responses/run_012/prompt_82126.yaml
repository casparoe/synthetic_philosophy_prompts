 certain beliefs are exempt — "my back hurts", "that looks red" — those aren't fiat, they're a class of belief with a different relation to the world. And anyway your chain has a problem mine doesn't: at every step you owe an account of why this reason actually supports that belief, and that's a further belief. So the regress doesn't just run along the chain, it doubles back at every joint. You don't get the chain for free; each connection needs its own warrant, and in your picture there's nowhere for it to live. She: I have exactly the same obligation at your foundation. Before you can stop at "that looks red," you need the principle that experiences like that justify beliefs like that, and that principle is either another belief — regress restarts — or an exemption, which is fiat again. So the link objection doesn't break the tie, it's the same puzzle one level up, and it lands on you at least as hard. I stayed out of it because I honestly couldn't tell whether they were disagreeing or just each holding one half of the same point.

