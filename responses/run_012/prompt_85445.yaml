answer: |-
  Here is the thinking process, the procedure, and the audit of your three claims.

  ### Part 1: The Setup (Correcting the Picture)

  You are right that they are talking past each other, but your theoretical map needs tightening if it's going to survive a KC.

  1.  **Hempel (Covering Law):** Forget this for the report. It's too rigid. In history, "laws" are either trivial ("people protect themselves") or false ("people always protect themselves"). If your juniors try to find a "law" for why the board delayed, they will write platitudes.
  2.  **Dray/Popper (Rational Explanation):** This is your gold standard for individual actions. Did the agent have a *reason* to act that way, given what they knew *then*? This satisfies the Historian (internal sense) and the Lawyer (mens rea/decision logic).
  3.  **Walsh/Whewell (Colligation):** This is the danger zone. This is grouping events under a label ("complacency," "systemic failure"). It is useful for summaries, but useless for causation. A label explains nothing unless you can point to the specific mechanism the label describes.
  4.  **Counterfactuals:** The Historian is technically right (it's fiction), but the Chair is practically right (inquiries require lessons). The compromise is not "What would have happened?" but "What was the *probable contribution* of this factor to the risk?"

  **The Core Conflict:** The Chair wants *liability logic* (A caused B). The Historian wants *narrative logic* (A made sense in context B). Your procedure must force every claim to declare which game it is playing. If it claims to be causal, it must survive legal scrutiny. If it claims to be contextual, it must not pretend to be causal.

  ### Part 2: The Procedure (The Causal Claim Audit)

  **Purpose:** To determine if a draft sentence belongs in the "Findings" section as a causal explanation.
  **Time:** 20 minutes per claim.
  **User:** Junior Researcher.
  **Output:** A one-page "Claim Audit Note" (template below).

  #### Step 1: The Category Check (2 Minutes)
  *Question:* What kind of claim is this?
  *   **Type A (Mechanism):** A specific process failed (e.g., "The software only ran annually").
  *   **Type B (Agency):** A person chose X because of Y (e.g., "The Director chose silence because of threat Z").
  *   **Type C (Label/Atmosphere):** A general state of affairs (e.g., "A culture of fear," "Systemic complacency").
  *   **Type D (Verdict):** A moral or legal judgment (e.g., "This was negligent").

  *Decision:*
  *   If **Type D**: Stop. This is a conclusion, not an explanation. Move to the "Conclusions" chapter, not "Causes."
  *   If **Type C**: Proceed to Step 2 with extreme prejudice. These are usually descriptions masquerading as causes.
  *   If **Type A or B**: Proceed to Step 2.

  #### Step 2: The Evidence Anchor (5 Minutes)
  *Question:* Can you point to the specific document, testimony, or data point that proves this claim exists?
  *   **Test:** Highlight the evidence in the source material.
  *   **Fail Condition:** If the evidence is "general impression," "multiple witnesses suggested," or "it stands to reason," the claim fails.
  *   **Pass Condition:** "Minute 4.b," "Email dated X," "Policy Document Y."
  *   *Note for Type C (Label):* You need *three* distinct instances of behavior that constitute the label. One instance is an anomaly; two is a coincidence; three is a pattern.

  #### Step 3: The "Because" Test (5 Minutes)
  *Question:* Does this claim explain *why* the delay happened, or just *that* it happened?
  *   **The Substitution Test:** Replace the explanation with "something went wrong." Does the sentence still make sense?
      *   *Bad:* "The delay happened because of systemic failure." (Substitutes "delay" with "failure". Circular.)
      *   *Good:* "The delay happened because the reporting cycle was annual." (Mechanism identified.)
  *   **The Hindsight Filter:** Did the agents know this fact *at the time*?
      *   If the claim relies on knowledge they only gained later, it is not a cause of their action. It is a critique of their outcome.

  #### Step 4: The Counterfactual Constraint (5 Minutes)
  *Question:* The Chair wants to know "What if?" The Historian says "We can't know." Here is the compromise.
  *   **The Test:** Can we support the counterfactual with *comparable evidence*?
      *   *Unsupportable:* "If the Director had escalated, the consultant would have been removed." (Speculation.)
      *   *Supportable:* "If the Director had escalated, protocol X required a review within 30 days. No such review occurred." (Procedural fact.)
  *   **Overdetermination Check:** Are there two causes that could each have caused the delay?
      *   If yes, do not claim one is *the* cause. Claim both were *contributing factors*. Use the phrase "significantly increased the risk of delay" rather than "caused the delay."

  #### Step 5: The Verdict (3 Minutes)
  *   **Green:** Claim is specific, evidenced, mechanism-based, and avoids hindsight. Put in report.
  *   **Amber:** Claim is valid but too broad. Rewrite to specify the mechanism. (e.g., change "culture" to "specific meeting decisions").
  *   **Red:** Claim is a label, a verdict, or unsupported speculation. Remove from "Causes" chapter. Move to "Context" or delete.

  ---

  ### Part 3: The One-Page Note Template

  **Claim ID:** [e.g., C-01]
  **Draft Text:** [Paste the sentence]
  **Category:** [Mechanism / Agency / Label / Verdict]
  **Evidence Anchor:** [List specific doc/ref numbers]
  **Hindsight Check:** [Yes/No - Did they know this then?]
  **Counterfactual Support:** [None / Procedural / Speculative]
  **Researcher Recommendation:** [Green / Amber / Red]
  **Reason for Decision:** [2-3 sentences max]

  ---

  ### Part 4: Running the Audit on Your Candidates

  Here is the output your juniors would generate. I have applied the procedure strictly.

  #### Candidate 1: "The trust's board was in the grip of a culture of complacency."
  *   **Category:** Type C (Label/Atmosphere).
  *   **Evidence Anchor:** Likely scattered minutes, general testimony about "tone." Hard to pin to a specific decision point.
  *   **"Because" Test:** Fails. Did complacency *make* a specific vote happen? Or is "complacency" just the word we use to describe the fact that they didn't act? It risks circularity.
  *   **Counterfactual:** Unsupportable. "If they weren't complacent, they would have acted." This is tautological.
  *   **Verdict:** **RED.**
  *   **Reasoning:** This is a colligation (a label), not a cause. It describes the *quality* of the delay, not the *mechanism* of the delay. Under cross-examination, a lawyer will ask: "Show me the minute where complacency entered the room." You cannot. It is a conclusion disguised as an explanation.
  *   **Fix:** Move to the "Context" chapter. In the "Causes" chapter, replace with the specific decisions that *manifested* this culture (e.g., "The Board prioritized financial targets over clinical risk in Q3 2018").

  #### Candidate 2: "The medical director didn't escalate because she'd been told, twice, that escalating would end her career."
  *   **Category:** Type B (Agency).
  *   **Evidence Anchor:** Requires specific testimony or emails regarding the "two times" and the "career threat."
  *   **"Because" Test:** Passes. It provides a rational calculation (Self-preservation > Escalation).
  *   **Hindsight Check:** Passes, assuming she knew this at the time.
  *   **Counterfactual:** Supportable via protocol. "Had she escalated, Protocol X dictates a review."
  *   **Verdict:** **GREEN** (Conditional on evidence).
  *   **Reasoning:** This is a classic Rational Explanation. It satisfies the Historian (makes sense from the inside) and the Chair (identifies a barrier to action).
  *   **Risk:** If the evidence is hearsay ("She told a friend who told us"), this turns Red. It needs direct evidence of the threat.

  #### Candidate 3: "The monitoring system only flagged outliers on an annual cycle, so nobody at any level ever saw the pattern in time."
  *   **Category:** Type A (Mechanism).
  *   **Evidence Anchor:** The system specification documents. The data logs.
  *   **"Because" Test:** Passes. It identifies a structural constraint.
  *   **Hindsight Check:** Passes. The system settings existed at the time.
  *   **Counterfactual:** Strong. "If the cycle was monthly, the flag would have triggered in Month X."
  *   **Verdict:** **GREEN.**
  *   **Reasoning:** This is the strongest kind of claim for an inquiry. It is factual, verifiable, and non-moral. It explains the delay without needing to impute motive.
  *   **Note:** The phrase "nobody... ever saw" is risky. Change to "the system did not generate a report until..." to avoid absolute claims that can be disproven by one witness saying "I saw something."

  ### Part 5: What This Procedure Cannot Do

  You asked me to finish by telling you what this tool can't do. Here is the honest assessment from the witness box.

  1.  **It Cannot Resolve Moral Responsibility:** This procedure isolates causal factors. It does not tell you who is *to blame*. A "Green" claim might still be a tragic accident rather than negligence. The Chair wants blame; the Historian wants understanding; this procedure gives you *mechanism*. You will still have to bridge the gap to liability yourself.
  2.  **It Cannot Fix Bad Evidence:** If the documents don't exist, the procedure will correctly flag the claim as "Red." It cannot manufacture certainty where the record is silent. It will force you to delete your favourite sentences if the paper trail isn't there.
  3.  **It Cannot Predict Judicial Reception:** A KC can argue anything. This procedure makes your claims *defensible*, not *immune*. A skilled cross-examiner can still attack the weight of the evidence, even if the logic holds.
  4.  **It Cannot Reconcile the Chair and Historian Fully:** The Chair wants "But-for" causation. The Historian denies it. This procedure forces a "Probabilistic Contribution" compromise. The Chair may still hate that you aren't saying "X definitely caused Y." The Historian may still hate that you are using counterfactuals at all. This procedure minimizes the bloodshed; it does not end the war.

  **Final Advice:** Your bet on Candidate 1 was correct. "Culture" claims are the first thing lawyers dismantle because they are fuzzy. Kill it in the Causes chapter. Save it for the Introduction to set the scene, but do not let it carry the weight of the finding. The families want to know *what broke*, not *what it felt like*. Give them the broken parts.
