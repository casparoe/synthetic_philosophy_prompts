  If the demon never erased its memory, it could sort until its storage saturated, but it could not run indefinitely as a perpetual-motion machine. To cycle, it must forget. Thus, the Second Law is preserved not by the cost of knowing, but by the cost of forgetting. Even with perfectly reversible measurement, the inevitable erasure step ensures the total entropy of the universe never decreases over a complete operational cycle. The demon fails not at the eye, but at the memory wipe.
