prompt: |-
  I've been trying to pin down exactly why Maxwell's demon cannot beat the second law, and I think I have the standard account but want to test how far it generalizes. As I understand it, the demon is defeated at the very first step: to sort the fast molecules from the slow ones it has to observe them, and since observation is itself a physical process, every measurement costs it at least kT ln 2 of entropy per bit recorded, which exactly cancels the work it later extracts. What I want to know is the scope of that bound. If measurement always carries this irreducible cost, then even observation would have an inescapable thermodynamic price, and even a perfectly reversible measurement — a spin that flips a pointer with no dissipation at all — would still have to pay kT ln 2 per bit. Is that correct? And if the demon could somehow measure reversibly, would it thereby escape the bound and run a genuine perpetual-motion machine of the second kind, or does some further step stop it? Please answer in American English, in no more than 250 words.
