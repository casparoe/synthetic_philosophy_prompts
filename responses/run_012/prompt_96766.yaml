      However, the demon still cannot violate the Second Law. The true bottleneck is not acquisition, but reset. To operate continuously, the demon must clear its memory to make room for new measurements. Landauer's Principle dictates that erasing one bit of information dissipates at least $kT \ln 2$ of heat into the environment. This entropy increase exactly cancels the entropy reduction gained from sorting the molecules.

