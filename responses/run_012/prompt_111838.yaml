prompt: |-
  My friend clerks for a judge on our state court of appeals and keeps complaining that she cant tell what the judge's interpretive method actually is. The statute in question is our state's mobile vending act. It defines "school" as "a public or private institution providing instruction to students in grades K through 12." It defines "cart" as "a wheeled conveyance with not more than 100 square feet of floor area." And its purpose section says the act exists "to protect children walking to and from school" and "to keep sidewalks passable." Three rulings so far: (1) a taco guy with a 110-square-foot trailer applied for a cart permit; she held he doesn't qualify, a 110-foot trailer is simply not a cart under the definition, no matter how much easier that would of made his life. (2) The act requires vendors to leave "a clear path" on the sidewalk and never says how wide; she held it means five feet, on the ground that the whole point is that people can get past. (3) The act requires a "commissary," defined as a state-licensed food prep facility; a vendor prepped in a church kitchen the state has licensed, and she said that satisfies it, licensed is licensed.

  New case: a standalone early-learning center, ages three to five, licensed by the state as a child care center and not as a school, sits on the corner where a vendor wants to park, within 100 feet of the door the little kids use. The health department's FAQ says the buffer covers child care centers; the vendor's lawyer says the definition says K through 12 and a preschool is not a school.

  What does she do? Which rule is she actually running, which other rules fit her three rulings just as well, what's your best guess and why, and what case would tell those rules apart? And if her three rulings genuinely don't decide it, tell me what principle she'd be signing onto either way.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the Prompt:**

      *   **Context:** A friend clerks for a state appellate judge. She's confused about the judge's interpretive method.
      *   **Statute:** State Mobile Vending Act.
          *   Definition of "School": Public/private institution, grades K-12.
          *   Definition of "Cart": Wheeled conveyance, $\le$ 100 sq ft floor area.
          *   Purpose: Protect children walking to/from school; keep sidewalks passable.
      *   **Prior Rulings (The Data Points):**
          1.  *Taco Trailer:* 110 sq ft trailer denied permit. Reasoning: Definition says $\le$ 100 sq ft. 110 is not 100. Hard line.
          2.  *Sidewalk Path:* Statute says "clear path," no width specified. Judge ruled 5 feet. Reasoning: Purpose is to let people get past.
          3.  *Commissary:* Statute requires "state-licensed food prep facility." Vendor used licensed church kitchen. Judge ruled it counts. Reasoning: Licensed is licensed (textual adherence).
      *   **New Case:** Early-learning center (ages 3-5), licensed as child care, *not* school. Vendor wants to park within 100 ft.
          *   Health Dept FAQ: Says buffer covers child care centers.
          *   Vendor Lawyer: Definition says K-12, preschool isn't school.
      *   **Tasks:**
          1.  What does she do? (Predict the ruling).
          2.  Which rule is she actually running? (Identify the dominant interpretive theory).
          3.  Which other rules fit the three rulings just as well? (Alternative theories).
          4.  What's the best guess and why?
          5.  What case would tell those rules apart? (Hypothetical discriminator).
          6.  If the rulings don't decide it, what principle is she signing onto either way?

  2.  **Analyze the Prior Rulings (Pattern Recognition):**

      *   *Ruling 1 (Taco Trailer):* Strict Textualism. The definition is explicit (100 sq ft). 110 > 100. Denied. Purpose (making life easier) ignored in favor of text.
      *   *Ruling 2 (Sidewalk Path):* Purposivism. The text is vague ("clear path"). Judge filled the gap based on the *purpose* ("people can get past"). 5 feet is a policy choice derived from the goal, not the text.
      *   *Ruling 3 (Commissary):* Textualism/Plain Meaning. Text says "state-licensed." Church kitchen is "state-licensed." Therefore, it counts. No inquiry into whether a church kitchen *feels* like a commissary.

      *   *Tension:* Ruling 1 & 3 look Textualist. Ruling 2 looks Purposivist.
      *   *Synthesis:* Is there a unifying theory?
          *   *Theory A: Textualism with a Purpose Safety Valve.* Follow text when clear (1 & 3). Use purpose when text is ambiguous/gappy (2). This is the "New Textualism" or "Pragmatic Textualism" approach (like Scalia/Kagan hybrid).
          *   *Theory B: Formalism.* Follow the rules as written, but interpret the words in their ordinary sense to achieve the function.
          *   *Theory C: Intentionalism.* What did the legislature want? (Hard to tell without legislative history).

  3.  **Analyze the New Case:**

      *   *Issue:* Does "School" (K-12) include "Child Care Center" (3-5 yrs)?
      *   *Text:* "grades K through 12." Preschool is not K-12.
      *   *Purpose:* "Protect children walking to and from school." Preschoolers are children. They walk (or are walked) to the center.
      *   *Agency Interpretation:* Health Dept FAQ says yes.
      *   *Conflict:* Text says No (strictly). Purpose says Yes (broadly). Agency says Yes.

  4.  **Evaluate Interpretive Methods against the New Case:**

      *   *Strict Textualism:* "K through 12" excludes 3-5 year olds. Vendor wins. (Aligns with Ruling 1 & 3).
      *   *Purposivism:* Purpose is protecting children. Preschoolers are vulnerable children. Center is functionally a school for them. Vendor loses. (Aligns with Ruling 2).
      *   *Deference (Chevron/Auer equivalent):* Health Dept FAQ says yes. Judge might defer. (Not seen in prior rulings).

  5.  **Determine the Judge's "Actual" Rule:**

      *   Look closely at Ruling 2. This is the outlier if the judge is a pure textualist. In Ruling 1, she *rejected* a purposive argument ("no matter how much easier that would of made his life"). In Ruling 2, she *adopted* a purposive argument to fill a gap.
      *   *Key Distinction:* Clarity of Text.
          *   Ruling 1: Text specific (100 sq ft). -> Follow Text.
          *   Ruling 3: Text specific (Licensed). -> Follow Text.
          *   Ruling 2: Text vague ("Clear path"). -> Follow Purpose.
      *   *New Case:* Text is specific ("K through 12").
      *   *Prediction:* She will likely rule for the **Vendor** (Preschool is not a school).
      *   *Why?* Because in Ruling 1, she explicitly rejected a purposive override of a specific numerical definition. "K through 12" is as specific as "100 square feet." To include preschool would be to rewrite the definition, just like counting 110 sq ft as 100 sq ft.

  6.  **Alternative Theories (That fit the 3 rulings):**

      *   *Theory 1: The "Ordinary Meaning" Canon.*
          *   Ruling 1: Ordinary meaning of 100 is 100.
          *   Ruling 3: Ordinary meaning of licensed is licensed.
          *   Ruling 2: Ordinary meaning of "clear path" implies a width sufficient for passage.
          *   *Fit:* Good.
      *   *Theory 2: The "Legislative Supremacy" Model.*
          *   Judge doesn't want to legislate.
          *   Ruling 1 & 3: Legislature set the numbers/requirements; judge enforces them.
          *   Ruling 2: Legislature left a gap; judge fills it minimally to make the law workable, not to expand it.
          *   *Fit:* Good.
      *   *Theory 3: Purposivism (Weak Fit).*
          *   If she were a true purposivist, Ruling 1 is hard to explain. Why not let the taco guy operate if the purpose is vending regulation? Unless the purpose is *safety* regarding size? But she said "no matter how much easier." That signals anti-purposivism when text is clear.

  7.  **The Discriminating Case (The "Tell"):**

      *   Need a case where Text and Purpose clash directly, specifically regarding a definition.
      *   *Scenario:* A statute defines "Vehicle" as "any motorized conveyance." A bicycle with an electric assist motor (that barely works) is involved. Purpose of law is "reduce emissions."
      *   *Text:* It has a motor.
      *   *Purpose:* It doesn't reduce emissions (or does it?).
      *   *Better Discriminator:* A case where the text is clear but leads to an absurd result contrary to the stated purpose.
      *   *Example:* Statute bans "vehicles in the park." Text includes ambulances. Purpose is "quiet and safety." An ambulance enters to save a life.
      *   *If she bans the ambulance:* She is a Strict Textualist.
      *   *If she allows it:* She is a Purposivist or follows the "Absurdity Doctrine."
      *   *Applying to our Judge:* Given Ruling 1 (110 sq ft denied), she likely bans the ambulance. She respects the line drawn by the legislature even if it hurts.

  8.  **Principles at Stake (If rulings don't decide):**

      *   *Rule of Law vs. Equity.*
      *   *Democratic Accountability:* If she includes preschools, she is rewriting the statute. Legislature can amend it to say "K-12 and licensed child care." If she does it, she usurps the legislature.
      *   *Reliance Interests:* Vendors relied on the text (K-12).
      *   *Protection of Vulnerable Populations:* The purpose is protecting kids. Preschoolers are *more* vulnerable than 12th graders. Ignoring them undermines the act's soul.

  9.  **Drafting the Response:**

      *   *Introduction:* Acknowledge the clerk's confusion. It's a classic Text-vs-Purpose tension.
      *   *Prediction:* She rules for the Vendor (Preschool $\neq$ School).
      *   *Reasoning:* Aligns with Ruling 1 (Hard numbers/definitions control over convenience/purpose).
      *   *Identifying the Method:* "Textualism with a Gap-Filling Exception" (or Semantic Textualism).
      *   *Alternative Methods:* Purposivism (fails Ruling 1), Intentionalism (no history provided).
      *   *The Discriminating Case:* The "Ambulance in the Park" or "Strict Liability vs. Moral Blame" hypothetical.
      *   *The Underlying Principle:* Separation of Powers / Legislative Supremacy.

  10. **Refining the Analysis (Self-Correction/Nuance):**
      *   *Wait, check Ruling 3 again.* "Licensed is licensed." That's textual.
      *   *Check Ruling 2 again.* "Clear path" = 5 feet. That's *not* in the text. That's judicial gap-filling based on purpose.
      *   *Crucial Distinction:* Is "K-12" a gap or a clear definition? It's a clear definition. "Clear path" is an undefined standard.
      *   *So the rule is:* Follow text when defined. Use purpose to define undefined standards.
      *   *New Case:* "School" is defined (K-12). Therefore, follow text. Exclude preschool.
      *   *What about the Health Dept FAQ?* State courts vary on agency deference. If she hasn't shown deference before, she won't start now. Ruling 1 suggests she doesn't care about "easier life" (administrative ease?). Ruling 3 suggests she cares about the *status* (licensed), not the *source* (church vs commercial). The FAQ is an agency interpretation. If she's a textualist, she might ignore the FAQ if it contradicts the statute (K-12).
      *   *Wait, one more angle:* Is there an "Absurdity Doctrine"? If excluding preschools makes the law pointless (since most little kids are in preschool), does she bend? Ruling 1 says "no matter how much easier." That suggests she tolerates harshness.
      *   *Conclusion:* She rules for the vendor. Text wins.

  11. **Final Polish:** Structure the answer clearly addressing each part of the prompt. Ensure the tone is analytical and legally grounded. (Make sure to mention *Chevron* or *Auer* deference equivalents for state law, though likely she ignores them based on Ruling 1).

      *   *Wait, check the "Health Dept FAQ".* Is that binding? Usually, FAQs are non-binding guidance. A textualist judge would likely give it zero weight compared to the statute.
      *   *Check the "Principle" section.* If it's a toss-up, the principle is either "Legislative Supremacy" (Text) or "Protective Jurisprudence" (Purpose).

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Textualism." I need to explain *which kind*. It looks like "Ordinary Meaning Textualism" that allows for "Standard Filling" but not "Definition Rewriting."

      *   *Ruling 1:* Definition Rewriting (Rejected).
      *   *Ruling 2:* Standard Filling (Accepted).
      *   *Ruling 3:* Definition Application (Accepted).
      *   *New Case:* Definition Rewriting (Predict Rejected).

      Okay, ready to write.

      *Structure:*
      1. The Prediction.
      2. The Interpretive Method (The "Rule").
      3. Alternative Theories.
      4. The Discriminating Case.
      5. The Underlying Principles.

      *Refining the "Discriminating Case":* I need a case where the text is clear but the purpose screams for an exception. The "Ambulance" example is classic. Or a "Dead Hand" statute. Let's use a statutory deadline example or the "Vehicle in the Park" classic. Let's go with a specific statutory deadline vs. equitable tolling. If she dismisses a case filed one day late because the statute says "30 days," she's a textualist. If she allows it because "justice," she's a purposivist. Given Ruling 1 (110 vs 100), she dismisses the case.

      *Wait, one nuance on Ruling 2:* "Clear path" is a *standard*, not a *rule*. "100 sq ft" is a *rule*. "K-12" is a *rule*. Her method distinguishes between Rules (follow text) and Standards (apply purpose). This is a sophisticated view. I should highlight this.

      *Let's finalize the prediction:* She rules for the Vendor. "School" is a rule (K-12). "Clear path" was a standard.

      *Wait, what about the Health Dept FAQ?* If she defers to agencies, that changes things. But Ruling 1 suggests she doesn't care about administrative convenience ("easier life"). Ruling 3 suggests she looks at the statutory requirement ("licensed"), not the agency's wish. I will assume she treats the FAQ as non-binding.

      *Okay, let's write.*
answer: |-
  Here is an analysis of your friend's judge, broken down by the predictive ruling, the interpretive theory, the alternatives, the discriminating test, and the underlying principles.

  ### 1. The Prediction: What does she do?
  **She rules for the vendor.** The early-learning center is not a "school" under the Act, and the vendor can park.

  **Why:**
  The judge distinguishes between **statutory rules** (specific definitions) and **statutory standards** (vague requirements).
  *   **Ruling 1 (100 sq. ft.):** This was a specific numerical rule. She enforced the text strictly, explicitly rejecting a purposive argument ("no matter how much easier").
  *   **Ruling 3 (Commissary):** This was a specific status rule ("state-licensed"). She enforced the text strictly (licensed is licensed).
  *   **Ruling 2 (Clear Path):** This was a vague standard. The text gave no metric. Here, she used the *purpose* to fill the gap (5 feet allows people to pass).

  In the new case, "School" is defined with a specific numerical/grade rule: "K through 12." A preschool (ages 3–5) falls outside this textual rule. To include it would require rewriting the definition, which she refused to do in Ruling 1 (110 sq. ft. is not 100 sq. ft.). The Health Department FAQ is likely non-binding guidance; given her adherence to the statutory text in Rulings 1 and 3, she will likely prioritize the enacted law over agency guidance that contradicts the text.

  ### 2. The Interpretive Method: Which rule is she running?
  She is running **"Textualism with Standard-Filling"** (sometimes called *New Textualism* or *Pragmatic Textualism*).

  *   **The Core Tenet:** When the legislature provides a specific definition or rule (a "rule"), the judge must follow it, even if the purpose suggests otherwise. When the legislature provides a vague standard (a "standard"), the judge interprets it in light of the statute's purpose to make it workable.
  *   **Application to her record:**
      *   *100 Sq. Ft. (Rule):* Text controls.
      *   *Licensed (Rule):* Text controls.
      *   *Clear Path (Standard):* Purpose controls (because the text is silent on metrics).
      *   *K-12 (Rule):* Text controls.

  She views her role as enforcing the lines the legislature drew, not redrawing them to fit the spirit of the law, unless the legislature left the line blank.

  ### 3. Alternative Theories: What else fits?
  Two other theories fit her three rulings almost as well, which explains your friend's confusion.

  **A. Ordinary Meaning Originalism**
  *   **Theory:** Words mean what they meant to the public at the time of enactment.
  *   **Fit:**
      *   *100 Sq. Ft.:* Ordinary meaning of "100" doesn't include "110."
      *   *Licensed:* Ordinary meaning includes any entity with a license.
      *   *Clear Path:* Ordinary meaning of "clear" implies a width sufficient for normal passage (5 feet).
  *   **Why it's a contender:** It explains all three outcomes without needing a "Rule vs. Standard" distinction. It just claims all three outcomes are the "ordinary meaning."
  *   **Weakness:** It struggles with Ruling 2. "Clear path" has no ordinary numerical meaning. Assigning "5 feet" is a policy choice, not a dictionary lookup.

  **B. Legislative Supremacy (Formalism)**
  *   **Theory:** The judge must not legislate. If the legislature set a number, the judge keeps it. If the legislature left a gap, the judge fills it minimally to prevent the law from failing.
  *   **Fit:**
      *   *100 Sq. Ft.:* Changing it to 110 is legislating.
      *   *Licensed:* Expanding it to "unlicensed but safe" is legislating.
      *   *Clear Path:* Leaving it undefined makes the law unenforceable; setting a minimum is administrative necessity, not policy-making.
  *   **Why it's a contender:** It frames all her decisions as deference to the legislature rather than interpretive theory.

  ### 4. The Discriminating Case: How to tell them apart?
  To distinguish **Textualism with Standard-Filling** from **Ordinary Meaning** or **Purposivism**, you need a case where the **Text is Clear**, the **Purpose is Clear**, and they **Contradict**.

  **The Hypothetical:**
  > A statute bans "any motorized vehicle" from a public park to "ensure quiet and safety." An ambulance enters the park with sirens off to retrieve a heart attack victim. The vendor (ambulance company) is fined.
  > *   **Text:** Ambulance is a motorized vehicle.
  > *   **Purpose:** Safety (saving the life) and Quiet (sirens off).

  **The Test:**
  *   **If she upholds the fine:** She is a **Strict Textualist/Formalist**. (Like Ruling 1: 110 sq. ft. is banned even if it makes life harder).
  *   **If she voids the fine:** She subscribes to the **Absurdity Doctrine** or is a **Purposivist**. (She believes the purpose overrides the text when the result is irrational).
  *   **If she looks at "Ordinary Meaning":** She might ask if an ordinary person considers an emergency ambulance a "vehicle" in this context.

  **Given Ruling 1:** She likely upholds the fine. She signaled in Ruling 1 that she will not bend a clear definition to avoid harshness ("no matter how much easier"). This confirms she will not bend "K-12" to protect preschoolers.

  ### 5. The Underlying Principles: What is she signing onto?
  If the prior rulings genuinely don't decide it (i.e., if "K-12" is ambiguous enough to be a standard), she is choosing between two competing principles of democratic governance.

  **If she rules for the Vendor (Text Wins):**
  *   **Principle:** **Democratic Accountability / Separation of Powers.**
  *   **Reasoning:** If the law needs to cover preschools, the Legislature must amend it. Judges rewriting definitions undermines the electoral process. Citizens and vendors rely on the written text to plan their lives (reliance interests). If the text says K-12, a vendor buys a truck expecting to park near a preschool. Changing that retroactively is unfair.

  **If she rules for the Center (Purpose Wins):**
  *   **Principle:** **Protective Jurisprudence / The Mischief Rule.**
  *   **Reasoning:** The law exists to solve a problem (protecting kids). A 4-year-old is *more* vulnerable than a 17-year-old. Excluding them makes the law nonsensical. The "K-12" definition might be a legislative drafting error, and the judge's job is to effectuate the intent, not the typo.
  *   **Why she likely won't do this:** Ruling 1 shows she tolerates nonsensical outcomes if the text is clear. She prioritizes the *integrity of the text* over the *perfection of the outcome*.

  ### Summary for your Friend
  Tell her the judge is likely a **Textualist who treats defined terms as binding rules and undefined terms as purposive standards.**

  *   **The Tell:** Look at how she handles **deadlines**. If a filing is one day late under a strict statutory deadline, does she dismiss it (Textualist) or accept it to hear the merits (Purposivist)? If she dismisses it, she's definitely ruling for the vendor in the preschool case.
  *   **The Advice:** In her bench memo, she should argue that "K-12" is a **rule** (like 100 sq. ft.), not a **standard** (like clear path). Therefore, under the judge's own precedent in Ruling 1, the text must control, regardless of the Health Department's FAQ or the protective purpose. The remedy is legislative amendment, not judicial rewriting.
