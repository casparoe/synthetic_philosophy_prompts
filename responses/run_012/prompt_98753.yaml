      *   **The Analogy (Motorway):** Use the foggy pile-up to illustrate systemic failure vs. individual intent. Acknowledge its limits (war isn't an accident).
      *   **The Distinctions (The Core Work):**
          *   Guilt vs. Responsibility.
          *   Past Blame vs. Future Duty.
          *   The "Nation" as a vessel.
      *   **The German Connection:** Acknowledge the twin town delegation directly but subtly. Connect the POW tablet to the theme of shared humanity/responsibility.
      *   **The Wreath:** Explain the act of laying it not as payment for guilt, but as a pledge of care.
      *   **Closing:** A final thought on memory and the future.

  3.  **Drafting - Section by Section:**

      *   *Opening:* Start with the stone. It's been cleaned. The names are clear. 41 names. Plus the Germans. It's spring.
