      *   *Guilt vs. Responsibility:* Guilt is for the court. Responsibility is for the living. I didn't start the fire, but I live in the house, so I must check the smoke alarms.
      *   *The Nation:* A nation is a ghost. It can't feel pain. Only people feel pain. But the nation is the vehicle we use to organise ourselves. So we must steer it better.

