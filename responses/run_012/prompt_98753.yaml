answer: |-
  Friends, neighbours, guests from our twin town, and descendants of those named on this stone.

  We stand before a monument that has been cleaned. The lichen is gone. The letters are sharp. For the first time in many years, the names of the forty-one men of this parish are as clear as the day they were cut. And beside them, the smaller tablet, added later, remembering the German prisoners of war who died in the camp on the edge of our fields.

  It is right that both groups are here, in the memory of this place. And it is right that we are here, in the spring, when the earth turns again.

  I have spent the winter reading about the summer of 1914. I wanted to understand how this began. There is a long quarrel among historians about who willed this war. Some say one power drove it; others say it was a system of alliances that locked like gears; others say that once the timetables of mobilisation began, no human hand could stop the trains. I have come to suspect that asking "who started it" is a question that cannot hold the weight we place upon it.

  We want a villain. We want a name. But a war is not a murder. It is a catastrophe made of a million small decisions, each reasonable to the person making it, until they add up to an abyss.

  There is an image I have been turning over. Imagine a motorway in thick fog. A car brakes. The car behind reacts. The third car cannot stop. There is a pile-up. No driver intended the crash. Each did what seemed necessary given the vehicle ahead. Yet the wreckage is real. The insurers must decide. The families must mourn.

  That image helps us understand the machinery of 1914. It explains how men could walk into a fire they did not light. But the image breaks, too. A crash is an accident. This war was accepted, by some, as a tool. It was not merely a failure of braking; it was a choice to drive fast in the fog. We must not let the complexity of the cause wash away the reality of the choice.

  So where does that leave us? It leaves us with a difficulty. We cannot say Germany alone was guilty, as the treaty of 1919 tried to do. That was a category mistake. A nation is not a person. It cannot feel shame, it cannot stand in a dock. A nation is a fiction we use to organise ourselves, a story we tell about who we are. When we blame a nation, we often let the specific men who made the decisions slip away, while punishing people who had no say.

  But nor can we say that everyone was equally to blame. That is a comfortable lie. It spreads the guilt so thinly that it vanishes, and it makes the deaths meaningless. If everyone is at fault, no one is answerable.

  We need to separate two things that we often confuse: guilt and responsibility.

  Guilt looks backward. It attaches to acts and to persons. It asks: who did this? That question belongs to the courts, and to history, and to God. I am not here to judge the dead, nor the leaders long turned to dust. I cannot fix the past.

  Responsibility looks forward. It attaches to institutions, and to inheritance. It asks: what do we do now? This is the burden we carry. I may be answerable for something I did not do, simply because it was done in my name, and because I benefit from the world that remained after it.

  This is the distinction that matters today. We are not here to assign blame. We are here to accept a duty.

  To the descendants of the forty-one: your fathers and grandfathers were caught in a machinery they did not build. Their names are here not as a verdict, but as a record of a cost paid.

  To our friends from Germany: you stand here knowing that men from your towns died here, in captivity, far from home. They are part of this parish's history now. Their presence on this stone tells us that suffering does not respect borders, and that memory must not respect them either. We do not gather to balance a ledger. We gather to acknowledge that we share the ground.

  If we say "everyone was to blame," we wash our hands of the future. If we say "one nation was guilty," we create a debt that can never be paid. But if we say "we are responsible," we open a path.

  Responsibility is not a debt to be settled. It is a care to be taken. It is the understanding that the institutions which sent these men to die—the governments, the alliances, the unthinking momentum of statecraft—are not ghosts. They are still here. They wear different uniforms, but they are the same structures.

  So, what am I doing when I lay a wreath at the foot of this stone?

  I am not paying for the past. I cannot bring them back. I am not absolving the leaders who sent them. I cannot change their orders.

  I am making a promise about the future.

  When I place those flowers, I am saying that I acknowledge the link between then and now. I am saying that I accept the inheritance of this town, and of this continent, with all its scars. I am saying that I will tend to the peace that they died without finding.

  The stone is clean. The names are clear. The fog has lifted, for now. It is our task to keep the road clear, not for the sake of the dead, who are beyond our help, but for the sake of the living, who are in our care.

  We cannot undo the pile-up. We can only drive with our lights on.

  Thank you.
