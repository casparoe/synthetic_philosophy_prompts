      *   *The Analogy:* The motorway in fog. Driver A brakes, Driver B reacts, Crash. No one meant to crash. But the crash happened. *Limit:* War wasn't an accident; choices were made. But the *feeling* of inevitability is real.
      *   *The Distinctions:* This is the hard part. How to say "Nation isn't a person" simply? A nation is a story we tell about ourselves. Guilt belongs to the specific men who signed the orders. But *responsibility* belongs to us, the inheritors.
      *   *The "Everyone is to blame" trap:* Avoid saying "all sides were bad." Instead, say "blame is a finite resource, but responsibility is infinite." (Maybe too pithy? Let's soften). Say that spreading blame thinly insults the dead.
      *   *The German Delegation:* Acknowledge them. The POWs died here. They are part of this stone now. This isn't about balancing scales.
      *   *The Wreath:* Why lay it? Not to pay a debt. To acknowledge a link. To say "I am here, and I will tend to this."
      *   *Tone Check:* British English (colour, honour, programme). Slow pace. No quotes.

  4.  **Refining the Distinctions (Iterative Process):**

      *   *Drafting thought:* I need to make sure I don't sound like I'm lecturing on philosophy.
