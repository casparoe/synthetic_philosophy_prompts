      *   Ensure the "Burden of Proof" is assigned.

      *(Self-Correction during drafting)*: Make sure the "Compensated" verdict for the Marginalist is clear. Does it collapse? If the total is invariant, $\Delta = 0$. So M says Permissible. Does this collapse the view? Only if M admits some acts are wrong without $\Delta$. M will resist. I need to frame this as the stress test.

      *(Self-Correction on Voting vs Meat)*: The prompt asks if one joint statement can cover them. I should argue they *cannot* be covered by one statement because the causal topology differs (discrete counting vs. continuous market function).

      *(Self-Correction on Verbal)*: Is it verbal? The prompt asks me to say. I will argue it is *not* merely verbal because it changes action-guidance, but there is a verbal component regarding the definition of "cause."

  9.  **Final Polish:** Check against all constraints.
