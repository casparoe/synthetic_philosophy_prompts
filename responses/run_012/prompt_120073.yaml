          *   *Idea 3:* The "Compensated" regime is the hardest test for Marginalism. (M admits vulnerability; P admits this is where the battle lies).
          *   *Idea 4:* Voting and Meat are *not* structurally identical regarding causal chains. (Costs P who might want to lump them; Costs M who might want to dismiss both as negligible).
          *   *Refinement:* Let's make them sharper.
              1.  Science confirms aggregate harm but cannot resolve the moral weight of imperceptible contributions.
              2.  "Wrongness" splits into "Outcome-Wrong" (difference-making) and "Participation-Wrong" (complicity). Both exist, but priority is disputed.
              3.  In the Compensated Regime, the Marginalist must concede individual act has zero expected causal impact, forcing reliance on "Type" wrongness or abandoning the verdict.
              4.  Voting and Meat differ on the *mechanism* of influence (direct tally vs. market signal), requiring separate causal modeling before moral evaluation.
      *   **Section 2: The Regimes (Elastic, Threshold, Compensated):**
          *   Need to integrate this into the disagreement table or a preamble. The prompt asks for the document to *sort cases by how harm responds*. I should probably create a section specifically analyzing the regimes before the table, or embed it in the table. The prompt says "I would like each side's verdict recorded in all three regimes." A table row per regime seems best.
      *   **Section 3: The Table of Disagreements:**
          *   Columns: Point of Contention, Marginalist View, Participant View, Crux (What settles it?), Prediction/Evidence.
          *   Need to address the "quantity to be estimated" requirement.
      *   **Section 4: Verbal Disputes & Distinctions:**
          *   Token/Type.
          *   Causal Ancestry/Mechanism.
          *   Voting/Meat.

  6.  **Refining the Content (Self-Correction/Iterative Process):**

      *   *Critique:* The Agreed Claims need to be tougher. "Both exist" is too easy.
      *   *Revision:* Claim 1: We agree that if an act *definitely* prevents a specific harm, it is required. (Trivial). Let's try: We agree that the *aggregate* of individual acts causes the harm, and that the *individual* act is a necessary condition of the aggregate in the Elastic/Threshold cases, but not the Compensated case.
      *   *Revision on Burden of Proof:* The prompt asks to name the quantity and who bears the burden.
