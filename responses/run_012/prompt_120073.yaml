      *   *Burden:* If $E[U]$ is incalculable, M says "Permissible." P says "Impermissible." Who bears the burden of proof for the *existence* of non-causal obligation? P. Who bears the burden for the *magnitude* of causal impact? M.
      *   *Voting vs. Meat:* Voting is Threshold (mostly). Meat is Elastic (mostly) with Threshold elements (ordering units). They should be treated separately because the causal mechanism (market price signal vs. vote count) operates differently. M will argue market signals are imperceptible; P argues they are constitutive.
      *   *Compensated Case:* This is the killer for M. If I buy a carbon offset or a quota, and someone else uses it, my net emission is zero. M must say it's permissible. P must say it's not (you funded the quota).
      *   *Verbal Dispute:* Is "Wrong" the right word for P's view? Maybe "Fittingness" or "Virtue"? No, P insists on "Wrong." Is it verbal? Partially. If M redefines "Wrong" as "Consequentially Suboptimal," they agree. But they don't. It's substantive.

  7.  **Finalizing the Document Structure:**

