answer: |-
  **JOINT STATEMENT ON INDIVIDUAL OBLIGATION IN AGGREGATE HARM**

  **Signatories:** The Marginalist (M) and The Participant (P)
  **Facilitated by:** [Retired Atmospheric Chemist]
  **Date:** October 26, 2023

  **PREAMBLE**
  We acknowledge that for two years we have failed to engage the same proposition. M has argued from a framework of *outcome-responsibility* (consequentialist), while P has argued from a framework of *integrity-responsibility* (deontological/complicity). We agree that the physical science of aggregate harm (e.g., climate forcing, market demand) is settled, but the moral mapping of individual acts onto that physics remains contested. The following document isolates our agreements, specifies our disagreements by harm regime, and identifies the empirical or conceptual cruxes that would force a revision of either view.

  ### I. SUBSTANTIVE AGREEMENTS
  *We affirm the following four claims. Each requires a concession from our preferred initial positions.*

  1.  **The Physical/ Moral Gap:** We agree that atmospheric and economic science can establish the *aggregate* causal contribution of a class of acts (e.g., beef consumption) to a harm, but cannot establish the *moral valence* of a single token act within that class. M concedes that science cannot prove "no obligation exists" merely by showing imperceptibility; P concedes that science cannot prove "obligation exists" merely by showing participation. The move from *is* (causal chain) to *ought* (obligation) requires a moral premise neither side can derive from the data alone.
  2.  **The Compensated Regime Stress Test:** We agree that the "Compensated Harm" regime (where total harm is fixed by quota/budget and individual reductions are offset by others) constitutes the strongest challenge to M's view. M concedes that in a strictly compensated regime, the Expected Causal Disutility of a single act is zero ($E[U] = 0$). P concedes that if M maintains the act is nonetheless impermissible in this regime, M must abandon pure outcome-responsibility and adopt a hybrid view (e.g., symbolic or complicity-based), thereby narrowing the gap between us.
  3.  **Token vs. Type Distinction:** We agree that the dispute shifts depending on whether we evaluate the *Token* (this specific burger) or the *Type* (the practice of eating meat). M concedes that while a Token may be harmless, the *Type* may be harmful, creating a tension for action-guidance. P concedes that if the Token makes no difference, calling it "wrong" must rely on its relation to the Type, not its direct consequences, acknowledging that "wrong" is being used in a non-consequentialist sense.
  4.  **Voting vs. Consumption Topology:** We agree that Voting and Meat Consumption cannot be treated under a single moral calculus. Voting is a *Threshold* case with discrete counting and near-zero cost; Meat is an *Elastic* case with continuous market signaling and non-trivial cost. We reject the analogy that "a vote is like a drop of water." A vote enters a counting function; a purchase enters a price-signaling function. Separating them prevents the error of applying threshold probabilities to elastic markets.

  ### II. VERDICTS BY HARM REGIME
  *We record our verdicts on the permissibility of a single act (Token) in three distinct physical regimes. "Permissible" means no all-things-considered moral reason against performing the act.*

  | Regime | Physical Description | Marginalist (M) Verdict | Participant (P) Verdict |
  | :--- | :--- | :--- | :--- |
  | **Elastic** | Harm $\propto$ Total Contribution. (e.g., CO2 emissions, standard market demand). Individual act adds $\epsilon$ to total. | **Permissible** (if $\epsilon$ is below threshold of perceptibility/significance). The act is a perturbation, but morally negligible. Obligation lies in policy change. | **Impermissible.** The act instantiates a harmful Type. Participation in the mechanism is sufficient for complicity, regardless of $\epsilon$. |
  | **Threshold** | Harm occurs if Total $> K$. $K$ is unknown. Individual act has probability $p$ of triggering $K$. | **Conditionally Impermissible.** If $p \times \text{Harm} > \text{Cost}$, the act is wrong. If $p$ is vanishingly small (e.g., voting), act is Permissible. | **Impermissible.** One should not gamble with harms of this magnitude, regardless of $p$. Joining the pool of potential triggers is itself the wrong. |
  | **Compensated** | Total Harm is Fixed (Quota). Individual reduction is bought/offset by another agent. Aggregate is invariant to single agent. | **Permissible.** Causal impact is provably zero. No difference is made; therefore, no outcome-wrong exists. | **Impermissible.** Purchasing the right to harm (or participating in the quota system) validates the mechanism. You are buying a share of the harm, not causing new harm, but still complicit. |

  ### III. TABLE OF DISAGREEMENTS & CRUXES
  *For each point of contention, we specify the Crux (what would settle it), the Quantity to be Estimated, and the Burden of Proof.*

  | Point of Contention | Marginalist (M) Position | Participant (P) Position | Crux (Sub-question to settle) | Quantity / Evidence Required | Prediction & Burden |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Magnitude of "Negligible"** | An act is permissible if its expected disutility is below a threshold of moral significance ($\delta$). $\epsilon < \delta \implies$ Permissible. | There is no threshold $\delta$ for complicity. Any contribution to a wrongful practice is pro tanto wrong, regardless of magnitude. | **Is there a moral "quantum" below which consequences do not generate obligations?** | **Quantity:** The value of $\delta$ (the minimum morally weightable disutility). <br>**Evidence:** Intuition pumps regarding "invisible harms" vs. "aggregated trivialities." | **M predicts:** $\delta > 0$. If we cannot define $\delta$, M defaults to "Permissible."<br>**P predicts:** $\delta = 0$. <br>**Burden:** P bears the burden to prove why $\delta$ must be zero without collapsing into absurdity (e.g., breathing air). |
  | **2. Causal Ancestry vs. Mechanism** | Wrongness requires Causal Ancestry (Counterfactual dependence). If $H$ would have occurred without Act $A$, $A$ is not wrong. | Wrongness requires Mechanism Participation (Constitutive involvement). If $A$ is part of the structure producing $H$, $A$ is wrong even if $H$ is overdetermined. | **Does overdetermination absolve the contributor?** | **Quantity:** The degree of overdetermination in the specific system (e.g., elasticity of meat supply). <br>**Evidence:** Economic modeling of supply chains to determine if individual purchases are *causally inert* or *constitutively active*. | **M predicts:** In highly overdetermined systems, Ancestry is broken; Act is permissible.<br>**P predicts:** Mechanism participation persists regardless of overdetermination.<br>**Burden:** M bears the burden to prove the causal chain is actually broken, not just obscured. |
  | **3. The Voting Case** | Voting is Permissible (or supererogatory). $p(\text{decisive}) \approx 0$. Cost $> E[U]$. Rational to abstain. | Voting is Impermissible (in unjust systems) or Required (in just ones). Refusing to vote cleans one's hands but abandons the collective. | **Does the low probability of decisiveness negate the duty to participate in the democratic mechanism?** | **Quantity:** $p(\text{decisive}) \times \text{Value of Democracy}$. vs. Cost of Integrity. <br>**Evidence:** Historical analysis of margins and the expressive value of voting. | **M predicts:** If $p \to 0$, obligation $\to 0$. <br>**P predicts:** Obligation remains constant as it is a duty of citizenship, not consequence.<br>**Burden:** P bears the burden to explain why the *mechanism* of voting creates a duty distinct from its *outcome*. |
  | **4. The Compensated Case** | In a capped system, buying a permit is Permissible. The harm is fixed; my purchase does not increase it. | In a capped system, buying a permit is Impermissible. It signals demand for the cap level and monetizes the harm. | **Does market signaling within a fixed quota constitute a "difference"?** | **Quantity:** The elasticity of the *quota cap itself* to market participation. <br>**Evidence:** Political economy data: Does high uptake of permits lead to higher future caps? | **M predicts:** If Cap is truly fixed, impact is 0. Act is Permissible.<br>**P predicts:** Caps are rarely truly fixed; they respond to demand. Act is Impermissible.<br>**Burden:** M bears the burden to prove the Cap is invariant to individual participation signals. |

  ### IV. CATEGORICAL DISTINCTIONS & VERBAL DISPUTES

  **1. Token vs. Type Wrongness**
  We acknowledge a partial verbal dispute here. M uses "Wrong" to mean *Token-Wrong* (this act caused bad outcome). P uses "Wrong" to mean *Type-Wrong* (this act belongs to a bad category).
  *   **Resolution:** We will no longer debate "Is this act wrong?" without specifying the predicate.
      *   M asks: "Is this token outcome-suboptimal?"
      *   P asks: "Is this token complicit in a wrongful type?"
      *   **Substantive Remainder:** Even with this distinction, M holds that if a Token is not Outcome-Suboptimal, it is *All-Things-Considered Permissible*. P holds that if a Token is Complicit, it is *All-Things-Considered Impermissible*, regardless of outcome. This is not verbal; it is a conflict of moral priority.

  **2. Causal Ancestry vs. Mechanism**
  This is not verbal. It is a disagreement about the metaphysics of moral responsibility.
  *   **M** requires a counterfactual chain: $A \to \dots \to H$. If $\neg A \square \to H$, then $A$ is innocent.
  *   **P** requires a structural relation: $A \in \{Set\}_H$. If $A$ is a member of the set of acts sufficient for $H$, $A$ is implicated.
  *   **Chemist's Note:** This parallels the distinction between a *rate-limiting step* (M) and a *necessary component* (P) in a reaction chain. Both are physically real descriptions, but they yield different moral verdicts.

  **3. Voting vs. Meat Consumption**
  We agree these require **separate treatment**.
  *   **Ground:** The causal topology differs. Voting is a *discrete threshold function* (count $N$ vs $N+1$). Meat consumption is a *continuous elastic function* (Price $P$ vs $P+\epsilon$).
  *   **Implication:** M's argument that "your vote won't matter" relies on threshold probability. M's argument that "your burger won't matter" relies on signal noise in a market. P must argue against the threshold logic for voting (duty to try) and against the noise logic for meat (duty to purify). Conflating them allows M to use threshold probabilities to dismiss elastic market impacts, which is a category error.

  **4. Is the Dispute Merely Verbal?**
  **Judgment:** No.
  While there is verbal confusion regarding the definition of "cause" and "wrong," the disagreement persists even after semantic clarification.
  *   **Reason:** If we define "Wrong" strictly as "Making a detectable difference," P loses by definition. If we define "Wrong" as "Participating in evil," M loses by definition. The substantive fight is over **which definition should govern our moral lives.**
  *   **The Quantity:** The dispute turns on the **Weight of Complicity ($W_c$)** vs. the **Weight of Consequence ($W_o$)**.
      *   If $W_c > 0$ independent of $W_o$, P wins.
      *   If $W_c = 0$ when $W_o = 0$, M wins.
      *   **Burden of Proof:** P bears the burden to demonstrate that $W_c$ exists independently of $W_o$ without resorting to mere disgust or social convention. M bears the burden to demonstrate that $W_o$ is the *only* source of moral weight, without ignoring the reality of aggregate harm caused by "permissible" acts.

  **Signed,**

  _________________________ (The Marginalist)

  _________________________ (The Participant)
