answer: |-
  | Requirement (short name) | What it demands | Motivating case or consideration | Status (non-negotiable, or camp-specific and which camp) | Tension with (which other requirements, if any) |
  | :--- | :--- | :--- | :--- | :--- |
  | **Vantage Declaration** | The account must explicitly state whether moral value is grounded in the perspective of the person who exists (insider) or the perspective of an observer evaluating states of affairs before existence (outsider). It must justify why the rejected vantage is morally irrelevant. | **The Two Vantages:** From the inside, a life can be worth living even if starting it was questionable; from the outside, no subject exists to hold interests. Policy requires knowing whose interests count. | **Non-negotiable** for policy adequacy. A theory cannot shift vantages opportunistically to save intuitions. | Tensions with **Suffering Parity**. An insider vantage struggles to count the suffering of those who never exist, while an outsider vantage struggles to explain why creating a happy person is not obligatory. |
  | **Modal Consistency** | The account must explain why the moral principles governing creation do or do not apply to extending, saving, or restoring existing lives. If the principles differ, the account must identify a morally relevant difference between creating and saving. | **The Transposition Test:** If suffering is bad, it should be bad whether prevented by not creating or by saving. Restrictions applying only to creation risk being ad hoc distinctions without a difference. | **Camp-specific.** Preferred by **Impersonal** views (value is state-based). **Person-Affecting** views often violate this to preserve the asymmetry, claiming creation is unique because there is no subject to harm. | Tensions with **Core Asymmetry Validation**. If creation is morally identical to saving, it becomes hard to explain why we are obliged to save existing happy people but not obliged to create new happy people. |
  | **Neutrality Ranking** | The account must provide a determinate ranking of a life exactly at the threshold of worth-living versus non-existence. It cannot declare them incomparable or leave the ranking to parental preference. | **The Zero Point:** Policy regarding marginal cases (e.g., genetic screening for minor conditions) requires a definitive answer on whether a neutral life is better, worse, or equal to no life. | **Non-negotiable** for policy use. Philosophical agnosticism is insufficient for decision-making protocols. | Tensions with **Core Asymmetry Validation**. If a neutral life is "better" than non-existence, impersonal views struggle to explain why there is no obligation to create it. If "equal," the account risks implying creating a bad life is also neutral. |
  | **Identity Independence** | The account must evaluate choices based on the welfare levels of the people who exist in each outcome, without assuming the same person exists in all branches. It must identify what is wrong with choosing a person who will be worse off, even if that person has no complaint. | **The Substituted Sibling:** Selecting for a disability or worse conditions is intuitively wrong even if the resulting child will love their life. Accounts assuming identity across outcomes fail to capture this wrongness. | **Non-negotiable** for policy adequacy. Reproductive technologies often involve choosing between different potential persons (non-identity cases). | Tensions with **Core Asymmetry Validation**. Solving this usually requires impersonal values (total/average welfare), which typically destroys the asymmetry by creating an obligation to create good lives. |
  | **Suffering Parity** | The account must assign equal moral weight to preventing a unit of suffering in an existing person and preventing a unit of suffering in a potential person, or provide a principled reason for the discount. | **The Reversal:** Pain is intrinsically bad. It is counterintuitive to say preventing agony in a fetus matters less than preventing agony in a child, solely based on existence status. | **Camp-specific.** Preferred by **Negative Utilitarian** and **Impersonal** views. **Person-Affecting** views often violate this, claiming you cannot harm (or benefit) someone by bringing them into existence. | Tensions with **Vantage Declaration**. If using an insider vantage, potential people have no perspective to suffer from. If using an outsider vantage, it becomes hard to deny obligations to create happy people. |
  | **Core Asymmetry Validation** | The account must yield the verdict that creating a life destined for suffering is wrong, while creating a life destined for happiness is permissible but not obligatory. | **The Phenomenon:** This is the target explanation. Any account that fails to reproduce this intuitive distinction fails the primary task. | **Non-negotiable.** This is the definition of the problem being solved. | Tensions with **Identity Independence** and **Modal Consistency**. Most theories that satisfy these two (like Total Utilitarianism) fail the asymmetry by obligating the creation of happy lives. |

  ### Incompatible Subset of Requirements

  It is explicitly impossible to jointly satisfy **Core Asymmetry Validation**, **Identity Independence**, and **Modal Consistency** without significant theoretical complexity or contradiction. This is the central trilemma of population ethics.

  1.  **Identity Independence** requires us to count the welfare of potential people impersonally (to explain why choosing a worse-off sibling is wrong).
  2.  **Modal Consistency** requires us to treat the welfare of potential people similarly to existing people (to avoid ad hocery between creating and saving).
  3.  **Core Asymmetry Validation** requires us to say that while bad potential lives matter (wrong to create), good potential lives do not matter enough to create an obligation (no duty to create).

  If you satisfy **Identity Independence** and **Modal Consistency**, you typically arrive at a Total Utilitarian view: good potential lives add value, bad potential lives subtract value. This violates **Core Asymmetry Validation** because it creates an obligation to bring happy people into existence. If you satisfy **Core Asymmetry Validation** and **Identity Independence**, you usually must violate **Modal Consistency**, arguing that creating lives is structurally different from saving them to avoid the obligation. If you satisfy **Core Asymmetry Validation** and **Modal Consistency**, you usually must violate **Identity Independence**, relying on person-affecting views that cannot explain the wrongness of the Substituted Sibling case. An adequate account must explicitly acknowledge which of these three it sacrifices.

  ### The Most Eliminative Requirement

  The single requirement that does the most to eliminate candidate accounts of the asymmetry is **Identity Independence (The Substituted Sibling)**. The most natural home for the procreation asymmetry is the Person-Affecting View, which holds that an outcome can only be better or worse if it is better or worse for some specific person. This view easily satisfies the Core Asymmetry (you harm someone by creating them in pain, but you don't harm anyone by not creating them in joy) and Modal Consistency (by restricting scope to existing people). However, Person-Affecting Views collapse when faced with the Substituted Sibling case: if a couple chooses to create a child with a significant disability rather than a different child without it, the disabled child is not harmed by being created (their life is still worth living), and the other child never exists to be harmed. A strict Person-Affecting account must say this choice is morally neutral, which is unacceptable for reproductive policy. Therefore, demanding Identity Independence eliminates the entire class of simple Person-Affecting accounts, forcing theorists toward hybrid or impersonal views that then struggle to retain the Core Asymmetry.
