answer: |-
  **Decision Tree: The Structure of Historical Direction**

  *   **How do you assess the proposition that history bends toward justice?**
      *   **It is a factual description of how the world works.** (Go to *Constitutive Claims*)
      *   **It is a necessary stance for how we must act.** (Go to *Practical Commitments*)
      *   **It is false, incoherent, or dangerous.** (Go to *Critical Skepticism*)

  *   **Constitutive Claims**
      *   **Does the improvement continue automatically, regardless of specific human interventions?**
          *   **Yes, the mechanism is independent of us.** (Go to *Automatic Mechanisms*)
          *   **No, the record shows improvement but offers no guarantee.** (Go to *Contingent Trends*)
      *   **Automatic Mechanisms**
          *   **Is the engine of this automation divine will or a law within nature/society?**
              *   **Divine Will.** (Leaf: **Augustinian/Bossuet-style Providence**. *Awkward Commitment:* You must accept that present suffering is a necessary part of a divine plan you cannot fully see.)
              *   **Law within Nature/Society.** (Go to *Immanent Laws*)
      *   **Immanent Laws**
          *   **What is the status of this immanent mechanism?**
              *   **Unintended Coordination.** (Leaf: **Smith's Invisible Hand**. *Awkward Commitment:* You must trust that private vice yields public virtue without anyone intending the good.)
              *   **Secularized Theology.** (Leaf: **Löwith's Thesis**. *Awkward Commitment:* You must admit your faith in progress is structurally identical to Christianity without the Christ.)
              *   **Dialectical Resolution.** (Go to *Dialectical Ends*)
      *   **Dialectical Ends**
          *   **Is the driver of this resolution Spirit or Matter?**
              *   **Spirit/Reason.** (Leaf: **Hegel's Cunning of Reason**. *Awkward Commitment:* You must accept that great evil was historically necessary for Reason to realize itself.)
              *   **Matter/Economics.** (Leaf: **Marx's Historical Materialism**. *Awkward Commitment:* You must wait for material conditions to ripen before acting, even if suffering is acute.)
      *   **Contingent Trends**
          *   **Is the trend stable enough to project forward?**
              *   **Yes.** (Leaf: **Whig History**. *Awkward Commitment:* You must assume the winners of the past were on the right side of history, despite the standard critique that this is teleological.)
              *   **No.** (This branch is structurally empty; a trend without stability is not a trend.)

  *   **Practical Commitments**
      *   **Is this stance warranted because it makes success more likely, or because you cannot act without it?**
          *   **Makes success more likely (Wager).** (Go to *Probabilistic Wagers*)
          *   **Cannot act without it (Condition).** (Go to *Regulative Conditions*)
      *   **Probabilistic Wagers**
          *   **Is the probability based on the size of the future or the power of human will?**
              *   **Size of the Future.** (Leaf: **Longtermism**. *Awkward Commitment:* You must value potential future lives more than actual present suffering.)
              *   **Power of Human Will.** (Leaf: **William James's Meliorism**. *Awkward Commitment:* You must act as if salvation is certain when you know it might fail.)
      *   **Regulative Conditions**
          *   **Is the necessity logical (reason requires it) or political (power requires it)?**
              *   **Logical/Reason.** (Leaf: **Kant's Regulative Idea**. *Awkward Commitment:* You must pursue a goal you know you can never theoretically prove is reachable.)
              *   **Political/Power.** (Leaf: **Genealogical Position**. *Awkward Commitment:* You must admit your own critique of direction is also an effect of power.)

  *   **Critical Skepticism**
      *   **Do you deny the direction because time is circular, fragmented, or catastrophic?**
          *   **Circular.** (Leaf: **Nietzsche's Eternal Recurrence**. *Awkward Commitment:* You must will the eternal repetition of every moment of pain exactly as it was.)
          *   **Fragmented.** (Go to *Fragmentation*)
          *   **Catastrophic.** (Leaf: **Benjamin's Messianic Interruption**. *Awkward Commitment:* You must view civilization's achievements as documents of barbarism.)
      *   **Fragmentation**
          *   **Is the fragmentation due to incompatible values or unpredictable knowledge?**
              *   **Incompatible Values.** (Leaf: **Berlin-style Value Pluralism**. *Awkward Commitment:* You must accept that some ultimate values will always conflict and cannot be reconciled.)
              *   **Unpredictable Knowledge.** (Leaf: **Popper's Anti-historicism**. *Awkward Commitment:* You must plan for a future you admit you cannot predict.)

  ***

  **Empty Combinations**

  1.  **Constitutive Claim + No Mechanism + Guaranteed Future:** This combination is incoherent. If you claim the direction is a fact (Constitutive) but deny there is a mechanism driving it (No Mechanism), you cannot logically assert the future is guaranteed. A trend without a vector is just luck, and luck does not guarantee.
  2.  **Practical Commitment + Automatic Continuation:** This is unattractive and logically tense. If the improvement happens automatically regardless of human will, there is no practical need to adopt a stance of exertion. This position usually collapses into quietism or reveals that the "automatic" claim was false.
  3.  **Critical Skepticism + Divine Will:** This is incoherent. If you affirm a Divine Will directing history, you are making a Constitutive Claim about the world, not a Critical Skepticism of direction. You cannot be a skeptic of historical direction while affirming Providence.

  **Indistinguishable Leaves**

  1.  **Kant's Regulative Idea vs. Longtermist Practical Wager:** The tree separates these by asking if the commitment is a *condition* of action (Kant) or a *bet* on outcomes (Longtermism). However, in practice, both function as reasons for exertion despite a lack of constitutive proof. The extra question needed to separate them is: "If you knew with certainty that justice would never be achieved, would you still be required to pursue it?" Kant says yes (duty); Longtermism says no (the wager loses).
  2.  **Whig History vs. Longtermism:** Both rely on a positive trajectory, but Whig looks backward at a record while Longtermism looks forward at a probability space. They can feel identical in public argument ("things are getting better"). The extra question is: "Is the arc justified by the past century or the next million years?" Whig chooses the past; Longtermism chooses the future.
  3.  **Hegel's Cunning of Reason vs. Marx's Historical Materialism:** The tree separates them by Spirit vs. Matter. But both posit a dialectical necessity that uses human conflict for a higher end. They are often indistinguishable in their quietist potential. The extra question is: "Is the final resolution a state of knowledge or a state of material abundance?" Hegel chooses knowledge; Marx chooses abundance.
