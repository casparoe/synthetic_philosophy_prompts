prompt: |-
  I'm a PhD student in philosophy and I've somehow ended up doing a placement with a community home-care org (it's an "engaged philosophy" thing my department makes us do, don't ask). They've asked me to do something I'm honestly not sure is possible: turn care ethics into an actual decision procedure their care coordinators can run.

  Here's the setup so you can calibrate. There are four care coordinators, each managing about forty older-adult clients in their homes. Once a week they sit down for a 90-minute case conference and decide things like: who gets the scarce home-care hours out of a fixed municipal pot, whether to push a client to accept a service they've been declining, whether to loop in adult protective services, whether to keep funding a carer who's burning out. So maybe fifteen real decisions a week, per coordinator. The stakes are real but mostly not life-or-death — falls, skin breakdown, isolation, a daughter who's hit her limit, dignity stuff. The coordinators have social-work backgrounds, not philosophy ones. They get about twenty minutes per case and they have to write a short justification that their supervisor signs off on, because the funder audits us for consistency and we can't get away with shrugging and saying every case is unique.

  And that last bit is the whole problem, right? Care ethics basically distrusts rules. The whole point (as I understand it, and as Gilligan was getting at back in the 80s) is that what matters is the particular relationship and the response to *this* person, not applying a generalizable standard that flattens them into a case type. So a procedure is almost a contradiction in terms. If I just write a rubric with weights and boxes, I've smuggled in exactly the impartial, generalizing thing care ethics was reacting against, and the coordinators will tick boxes and stop thinking about the person. But if I write "use your judgment, attend to the relationship," I've given them nothing to do and nothing to write down, and the funder will eat us alive.

  So what I want from you is a procedure that keeps faith with care ethics but is still something a coordinator can actually run in twenty minutes. Concretely: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because it's a question of judgment rather than something the procedure can settle. Two things I want baked in and I think care ethics requires them. First, a step that captures the cared-for person's own account of *receiving* the care — not just whether the service got delivered, but how it landed for them, because a client can be getting lots of care and still be experiencing it as control. Second, a step that lets the carer's own limits count, including the coordinator's — care ethics shouldn't require the carer to quietly dissolve. I also want an explicit "this case is not procedurally decidable, here's what to do instead" flag, so the procedure is honest about its own edges instead of pretending to cover everything. And I want you to be blunt about which steps are just judgment calls dressed up as procedure, and where it's likely to misfire.

  Then run it on three cases and tell me what it spits out:

  1. Mrs. Adeyemi, 82, keeps declining the bath aide. Her skin's starting to break down and the nurse is worried. She says she's washed herself for eighty years and doesn't want a stranger doing it. The coordinators are itching to override her and I'm not sure they're wrong.
  2. Mr. Kaur's daughter visits every day, manages his meds, does his shopping, keeps his house spotless. On paper a model care arrangement. But he's told his coordinator twice that he feels managed, that it's her life not his. Nobody's neglecting him and yet something's off.
  3. Two clients both need the same two hours a week and there's only two hours to give. One is warm and articulate and easy to like; the other is terse and hard to read. I already know how the room will vote and it worries me.

  For each case I want the verdict, which step is doing the work, and whether the procedure gives an answer the coordinator won't like. I'd honestly be suspicious of a procedure that always agrees with them, so if it lets them do the comfortable thing in all three, tell me and tell me why.

  Then, after all that, give me a brief structured summary I can paste into my notes, as a JSON object with exactly these fields: `procedure_name` (string); `steps` (array of objects, each with `order` int, `step` string, `question` string, `sufficient_answer` string, `if_answer_is_no` string, and `is_judgment_call` boolean); `handoff_points` (array of strings, the places where it has to go to a person); `cases` (array of objects, each with `case` string, `verdict` string, `step_doing_the_work` string, `coordinator_likely_dislikes` boolean, `procedure_misfires` boolean, and `note` string); and `known_limits` (array of strings, what the procedure can't do).
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** PhD student in philosophy doing an "engaged philosophy" placement at a community home-care org.
      *   **Task:** Create a decision procedure based on *Care Ethics* for care coordinators.
      *   **Constraints:**
          *   Coordinators: 4 people, 40 clients each, social work background (not philosophy).
          *   Context: 90-min weekly case conference, ~15 decisions/week/coordinator, 20 mins/case.
          *   Requirement: Must produce a written justification for auditors (consistency needed).
          *   Core Tension: Care ethics distrusts rules/generalization, but the org needs a procedure/rubric.
          *   Mandatory Inclusions:
              1.  Step capturing the cared-for person's *experience* of receiving care (not just delivery).
              2.  Step acknowledging the carer's/coordinator's limits (no self-sacrifice).
              3.  Explicit "not procedurally decidable" flag (honesty about edges).
              4.  Blunt admission of where steps are judgment calls dressed as procedure.
          *   Test Cases:
              1.  Mrs. Adeyemi (declining bath aide, skin breakdown vs. dignity/autonomy).
              2.  Mr. Kaur (daughter over-involved, client feels managed, no neglect).
              3.  Resource Allocation (two clients, one resource, bias towards likability).
          *   Output Format: Detailed analysis + JSON summary with specific fields.

  2.  **Deconstruct Care Ethics for a Procedure:**
      *   *Core Tenets:* Relationality, context, responsiveness, vulnerability, interdependence. Not impartial justice (Rawls) or utility (Bentham).
      *   *The Paradox:* How to proceduralize "attend to the particular"?
      *   *Solution:* The procedure shouldn't dictate the *outcome* (e.g., "give hours") but should dictate the *inquiry* (e.g., "have you asked X?"). It functions as a *checklist of relational attentiveness* rather than a calculation engine. It forces the coordinator to pause and consider the relational dynamics before defaulting to efficiency or risk-aversion.
      *   *Naming:* Needs to sound practical, not academic. "Relational Attentiveness Protocol" or "Care Response Checklist." Let's go with "Relational Attentiveness Protocol (RAP)."

  3.  **Drafting the Procedure (The "RAP"):**
      *   *Step 1: The Voice of the Cared-For.* (Mandatory Requirement 1). Focus on *experience*, not compliance.
      *   *Step 2: The Network Map.* Who is involved? Is the relationship sustaining or suffocating?
      *   *Step 3: The Carer's Capacity.* (Mandatory Requirement 2). Can the system/carers sustain this without burning out?
      *   *Step 4: The Harm/Benefit Balance.* Not utility, but relational harm. Does intervening damage trust?
      *   *Step 5: The "Uncanny Valley" Check.* (The "Not Decidable" flag). If the above conflict irreconcilably, flag for ethics committee/supervisor.

      *Refining for the "20-minute/auditor" constraint:* It needs to look like a form. It needs "Sufficient Answers."
      *Refining for "Bluntness":* I need to explicitly state where this is just forcing them to write down what they already decided, or where it forces them to confront bias.

  4.  **Running the Test Cases:**

      *   *Case 1 (Mrs. Adeyemi):*
          *   Standard medical model: Force the bath (risk management).
          *   Care ethics model: Her dignity is part of her health. If care feels like violation, is it care?
          *   Procedure outcome: Likely stops the override. Requires finding a compromise (e.g., different aide, different method).
          *   Coordinator reaction: They will hate this. It increases risk (skin breakdown).
          *   Misfire potential: If she actually gets sepsis, the procedure looked "soft."

      *   *Case 2 (Mr. Kaur):*
          *   Standard model: Daughter is great, no neglect, status quo.
          *   Care ethics model: Care is suffocating him. Relationship is asymmetrical.
          *   Procedure outcome: Intervene to support *his* agency, maybe support *daughter* to step back.
          *   Coordinator reaction: Uncomfortable. Family is "happy" on paper.
          *   Misfire potential: Daughter gets angry, withdraws care, actual neglect happens.

      *   *Case 3 (Resource Allocation):*
          *   Standard model: Give to the articulate one (easier to manage, less complaint risk).
          *   Care ethics model: Bias alert. Who is *more* vulnerable? Likability is irrelevant.
          *   Procedure outcome: Forces explicit justification for bias. Likely shifts hours to the terse client or splits them.
          *   Coordinator reaction: High dislike. It makes their implicit bias explicit.
          *   Misfire potential: Hard to measure "need" objectively without falling back into utilitarianism.

  5.  **Addressing the "Philosophical Tension":**
      *   I need to acknowledge that *any* procedure betrays care ethics slightly. The goal is "minimally violent structuring."
      *   The "Not Decidable" flag is crucial. It admits the procedure fails when relationships are too complex.

  6.  **Constructing the JSON:**
      *   Must match the schema exactly.
      *   `procedure_name`: "Relational Attentiveness Protocol (RAP)"
      *   `steps`: Array of objects with specific keys.
      *   `handoff_points`: Where humans take over.
      *   `cases`: Analysis of the three scenarios.
      *   `known_limits`: What this can't do.

  7.  **Review against Constraints:**
      *   *PhD Tone:* Needs to be intellectually honest but practically usable. No jargon without explanation.
      *   *Bluntness:* Admit where the procedure is just "judgment dressed up."
      *   *JSON:* Valid syntax.
      *   *Specific Fields:* Check `order`, `step`, `question`, `sufficient_answer`, `if_answer_is_no`, `is_judgment_call`.

  8.  **Final Polish:**
      *   Ensure the distinction between "compliance" and "experience" is clear in Step 1.
      *   Ensure the "Carer's Limit" isn't just "are you tired?" but "does this arrangement sustain the relationship?"
      *   Make sure the JSON is valid (escape quotes, etc.).

  *(Self-Correction during drafting)*: Initially, I thought about making Step 5 a "vote." But care ethics isn't democratic. It's about responsiveness. Step 5 should be the "Flag for Irreconcilable Conflict."
  Also, I need to make sure I don't sound like I'm solving the problem perfectly. The prompt asks me to be blunt about misfires. I will emphasize that this procedure *slows down* the decision to allow care to happen, rather than *making* the decision.

  Let's write the response.
answer: |-
  This is a genuine philosophical aporia: institutionalizing the anti-institutional. Care ethics (Gilligan, Noddings, Tronto) posits that morality resides in the *response* to the particular other, not the application of a universal law. By asking for a procedure, your organization is asking you to codify the uncodifiable.

  However, leaving coordinators with "just use judgment" is irresponsible in an audit culture. It leaves them exposed to liability and burnout. The solution is not a decision *algorithm* (which outputs Yes/No) but a decision *discipline* (which outputs a justified stance). The procedure must force the coordinator to articulate the relational dynamics before they are allowed to cite policy or risk.

  Here is the **Relational Attentiveness Protocol (RAP)**. It is designed to fit the 20-minute window and satisfy the auditor's need for "consistency" by ensuring the *process of inquiry* is consistent, even if the outcomes vary.

  ### The Relational Attentiveness Protocol (RAP)

  **Time Allocation:** 20 Minutes per case.
  **Goal:** To ensure the decision preserves the relational web rather than just managing risk.

  **Step 1: The Experience of Receipt (Mandatory)**
  *   **Question:** "If we implement this decision, how will the client describe the *feeling* of being cared for? Does this action treat them as a subject with a history or an object with a problem?"
  *   **Sufficient Answer:** A direct quote or specific behavioral observation from the client regarding their emotional experience of the care (e.g., "She says she feels safe," or "He says he feels policed"). *Not* "She is compliant" or "He is safe."
  *   **If Answer is No/Unknown:** You cannot proceed to resource allocation. You must schedule a relationship-repair conversation or find an alternative provider.
  *   **Is Judgment Call:** **Yes.** (This is the core care ethics move. It forces the coordinator to value dignity over efficiency, but "feeling policed" is subjective.)

  **Step 2: The Carer's Sustainability (Mandatory)**
  *   **Question:** "Can the current care network (family, paid staff, coordinator) sustain this arrangement for 3 months without resentment or burnout?"
  *   **Sufficient Answer:** Explicit confirmation that the carers' limits are acknowledged and respected (e.g., "Daughter agrees to step back," or "We are hiring respite to protect the aide").
  *   **If Answer is No:** The plan is rejected. Care ethics forbids self-sacrifice as a moral requirement. You must redistribute the load.
  *   **Is Judgment Call:** **Yes.** (Predicting burnout is speculative, but ignoring it guarantees relationship collapse.)

  **Step 3: The Bias Check (Procedural)**
  *   **Question:** "Am I recommending this because it is easier for the *agency*, or because it is better for the *relationship*?"
  *   **Sufficient Answer:** Written distinction between administrative convenience and relational benefit.
  *   **If Answer is No:** (i.e., if it is for agency convenience): You must flag the case for Supervisor Review.
  *   **Is Judgment Call:** **No.** (This is a compliance check. It forces honesty about institutional pressure.)

  **Step 4: The Irreconcilable Conflict Flag (Handoff)**
  *   **Question:** "Do Step 1 (Client Experience) and Step 2 (Carer Limits) contradict each other irreconcilably?"
  *   **Sufficient Answer:** "Yes" or "No."
  *   **If Answer is Yes:** **STOP.** Do not decide. Flag for Ethics Committee or Senior Supervisor. This procedure cannot solve tragic choices where someone must be hurt.
  *   **Is Judgment Call:** **No.** (This is the honesty clause. It admits the procedure's limit.)

  ***

  ### Case Runs

  Here is how the RAP processes your three cases. Note that the "Verdict" is not necessarily what the coordinator *wanted*, but what the procedure *permits*.

  #### Case 1: Mrs. Adeyemi (The Bath Refusal)
  *   **Verdict:** **Do not override.** Mandate a search for a different method/aide.
  *   **Step Doing the Work:** **Step 1 (Experience of Receipt).**
  *   **Coordinator Likely Dislikes:** **Yes.**
  *   **Procedure Misfires:** **Possible.**
  *   **Note:** The medical model says "skin breakdown = risk = override." The RAP says "care that feels like violation = harm." If the coordinator overrides, they fail Step 1 because the client experiences the care as control. The procedure forces them to find a solution that respects her 80-year history of autonomy (e.g., a towel bath, a female aide she chooses).
  *   **Why they dislike it:** It increases medical risk in the short term. If she gets an infection, the auditor will ask why you didn't force the bath. The procedure protects her dignity, not the org's liability.
  *   **Misfire Risk:** If she is cognitively impaired but lucid enough to refuse, the "Experience" step is hard to validate. Coordinators may fake the quote to get the override approved.

  #### Case 2: Mr. Kaur (The Suffocating Daughter)
  *   **Verdict:** **Intervene to reduce daughter's role.**
  *   **Step Doing the Work:** **Step 2 (Carer's Sustainability) & Step 1 (Experience).**
  *   **Coordinator Likely Dislikes:** **Yes.**
  *   **Procedure Misfires:** **Unlikely.**
  *   **Note:** On paper, this is a "success" case (low cost, high family involvement). The RAP exposes the relational rot. Step 1 captures his feeling of being "managed." Step 2 captures that the daughter's current level of care is unsustainable (it's "her life not his"). The procedure mandates shifting care to paid staff to restore the father-daughter *relationship* rather than just the father's *hygiene*.
  *   **Why they dislike it:** It creates work. It risks angering the "model" daughter who might withdraw all support.
  *   **Misfire Risk:** The procedure assumes the daughter *can* step back. If she is psychologically unable to, Step 4 (Conflict Flag) should trigger, but coordinators might bypass it to avoid conflict.

  #### Case 3: The Resource Allocation (Likability Bias)
  *   **Verdict:** **Allocate to the terse client OR split hours.**
  *   **Step Doing the Work:** **Step 3 (Bias Check).**
  *   **Coordinator Likely Dislikes:** **Yes.**
  *   **Procedure Misfires:** **Yes.**
  *   **Note:** This is the hardest one. Care ethics prioritizes vulnerability, not likability. Step 3 forces the coordinator to write down: "I am choosing Client A because they are easier." That is an invalid justification under RAP. They must justify based on relational need. The terse client is likely more vulnerable *because* they are hard to read.
  *   **Why they dislike it:** It punishes efficiency. The articulate client is easier to manage. The procedure makes the implicit bias explicit, which is uncomfortable.
  *   **Misfire Risk:** Coordinators will game Step 3. They will write "Relational need is higher for articulate client" even if it's not true, because "need" is easier to fabricate than "likability." The procedure cannot police internal honesty perfectly.

  ***

  ### Blunt Assessment of the Procedure

  You asked for bluntness. Here is where the RAP is lying to you:

  1.  **Step 1 is easily gamed.** A coordinator can write "Client feels safe" even if the client is miserable, just to move the case along. The procedure relies on the coordinator's integrity, which is exactly what procedures are supposed to bypass.
  2.  **Step 4 is a trap.** In a resource-scarce environment, "Irreconcilable Conflict" happens weekly. If you flag 20% of cases to a Supervisor who doesn't exist, the coordinators will stop flagging. It creates a bottleneck that the org won't tolerate.
  3.  **It slows down care.** Care ethics values responsiveness. Bureaucracy values speed. This procedure adds friction. In an emergency (e.g., imminent fall risk), this 20-minute reflection is a luxury the system might not afford, leading to coordinators running the RAP *after* the decision to satisfy the audit.
  4.  **It doesn't solve scarcity.** In Case 3, the RAP tells you *how* to decide (don't use bias), but it doesn't tell you *who* gets the hours if both have equal relational need. It dresses up a tragic choice as a procedural one.

  ***

