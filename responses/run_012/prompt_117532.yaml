  5.  **Analyze the Shouting Scene (vi):**
      *   *Facts:* Shouts at daughter. No occurrent thought ("over before thought formed"). No deliberation. Disowns anger ("not hers"). Holds settled judgment ("decided not to be that kind of mother").
      *   *Rule A (Synchronic Judgment):* No occurrent judgment defeated at the moment of action ("never crossed her mind"). Prediction: **Not WoW**. (Maybe compulsion or automatism).
      *   *Rule B (Disowned Motive/Identity):* Acts from motive disowned ("not hers"), conflicts with settled judgment ("years deciding"). Prediction: **WoW**.

  6.  **Predict Friend's Verdict:**
      *   The friend is a philosopher specializing in *weakness of will* and *intertemporal choice*. The standard philosophical definition (Socrates/Aristotle/Davidson) usually requires acting against one's *better judgment* (Rule A). However, contemporary discussions (Holton, etc.) sometimes focus on resolution vs. temptation.
