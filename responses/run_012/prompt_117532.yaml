      *   *Scenario:* Ines consciously acts against a trivial occurrent judgment but fully owns the motive?
      *   *Better Scenario:* She consciously breaks a resolution (occurrent judgment: "I shouldn't") but feels no disownership, perhaps viewing it as a treat she deserves (owns the motive).
      *   *Wait, I need opposite direction:* Shouting scene = Rule 1 (No), Rule 2 (Yes). I need a case where Rule 1 = Yes, Rule 2 = No.
