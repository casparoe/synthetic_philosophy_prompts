  2.  **Analyze the Data (The Five Verdicts):**
      *   (i) Wake up 5:40, judge should swim, stay in bed. -> **Weakness of Will (WoW)**. (Classic akrasia: judgment vs. action).
      *   (ii) Party, no prior resolution, think ought to go, stay, disgusted. -> **WoW**. (Synchronic judgment vs. action, even without prior resolution).
      *   (iii) Laptop given to brother, wheedles back, argues against wanting this. -> **WoW (Paradigm)**. (Prior resolution + synchronic judgment vs. action + disownership).
      *   (iv) Skip lunch plan, Tuesday re-evaluates, concludes plan foolish, eats. -> **Not WoW**. (Judgment changed).
      *   (v) 5 a.m. flight, 4 a.m. pay to change, no conflict, no "wrong thing" thought, preference reversal. -> **Not WoW**. (Preference reversal, no synchronic judgment defeat).

  3.  **Identify Candidate Rules:**
      *   *Rule A (Synchronic Judgment Defeat):* WoW occurs iff the agent acts against their *current* best judgment at the time of action.
      *   *Rule B (Disowned Motive/Identity):* WoW occurs iff the agent acts from a motive they disown or that conflicts with their settled identity/values, regardless of occurrent judgment at the moment.

  4.  **Test Rules against Verdicts:**
      *   (i) Judgment: Should swim. Action: Sleep. -> A: Yes. B: Yes (disowns laziness).
      *   (ii) Judgment: Should go. Action: Stay. -> A: Yes. B: Yes (disgusted/disowns behavior).
