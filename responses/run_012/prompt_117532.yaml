      *   *Re-reading (vi):* "never crossed her mind at the moment." Occurrent judgment absent.
      *   Strict akrasia requires a conflict between judgment and action. If judgment is absent, it's not akrasia. It might be "brute weakness" or loss of control, but not *akrasia* proper.
      *   *Prediction:* She will say **Not weakness of will**. (It's a lapse of control, not will).

