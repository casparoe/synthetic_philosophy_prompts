      *Self-Correction on Verdict:* The friend calls (iii) the paradigm. (iii) involves arguing against herself *the entire time*. This emphasizes occurrent conflict. (vi) explicitly lacks occurrent conflict. This strengthens the prediction that she will say "Not WoW".

      *Test Case Construction:* Needs to be clear. Ines eats the cake. She thinks "I shouldn't" (Rule 1 = WoW). But she thinks "I'm a hedonist, this is me" (Rule 2 = Not WoW).

