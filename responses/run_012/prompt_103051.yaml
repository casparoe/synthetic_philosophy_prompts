answer: |-
  Give up step **(7)**.

  Step (7) asserts: *"Each of those absences is a difference-maker, so each is a cause of it."* This is the linchpin of the student's *reductio*. It relies on the principle of **Counterfactual Sufficiency**: the idea that if a factor satisfies the counterfactual dependence test (step 3), it automatically qualifies as a cause in the metaphysically robust sense required for steps (8) and (9).

  ### Why Step (7) Looked Plausible
  Your student's inference is seductive because it aligns with the dominant Lewisian tradition in analytic metaphysics. David Lewis argued that causation *just is* counterfactual dependence (or a chain thereof). On this view, the metaphysics of causation is austere and democratic: if the effect depends on it, it is a cause. Any attempt to filter causes (to say the gardener counts but the neighbor does not) looks like "causal selection"—a pragmatic, psychological process of highlighting *some* causes for conversation, not a metaphysical process of distinguishing causes from non-causes. Your student is correctly identifying that if you accept the Lewisian metaphysics, you cannot stop the explosion. Step (7) looks plausible because it assumes that the metaphysics of causation must be interest-independent and purely descriptive.

  ### What You Must Supply in Its Place
  To reject (7) without sacrificing (1), you must argue that **counterfactual dependence is necessary but not sufficient for causation**, specifically in cases of omission. You need a theory of **Metaphysical Causal Selection**.

  You must tell your student that she is wrong to characterize norms as merely "explanatory interests." In the case of positive events (a rock throwing a ball), causation is a matter of physical connection or dependence. But in the case of omissions, the *relata* themselves are normatively constituted. An "omission" is not simply *any* absence (like the absence of rain or the neighbor's inaction); it is the absence of an action that was **expected, required, or within a specific capacity**.

  Without the normative expectation, there is no omission, only a vast, undifferentiated field of non-events. The gardener's failure is a cause because she occupied a specific causal role (gardener) that defined her relation to the plant. The neighbor did not occupy that role. Therefore, the neighbor's inaction is a background condition, not a cause. The norm does not just help us *pick* the cause from a list; it helps *constitute* the causal relatum in the first place.

  ### The Price of This Move
  If you reject (7), you are paying a significant metaphysical price: **you are blurring the is/ought distinction.**

  By making normative expectations (duties, roles, capacities) a condition for causal status, you are admitting that the metaphysics of causation is not purely descriptive. You are claiming that moral or institutional facts (e.g., "the gardener was hired") can determine natural facts (e.g., "the gardener caused the death"). This makes causation partially normative. You must defend the claim that there are objective normative facts in the world that are as real as physical forces. If you are a moral anti-realist, this position is unavailable to you.

  Furthermore, you are accepting a **Disunity of Causation**. You are committed to the view that positive causation (the rock hitting the window) works differently than omissive causation (the gardener failing to water). Positive causation may be purely physical/counterfactual, while omissive causation is normative/counterfactual. This looks ad hoc to a theorist seeking a unified theory of everything.

  ### Does This Cost You (1)?
  No. This strategy preserves (1) perfectly. It allows you to say the gardener's omission *was* a cause, while the neighbor's was not, without retreating to the claim that "we just talk that way." It grounds the distinction in the metaphysics of agency and role, not in conversational pragmatics.

  ### Where This Account Is Weakest
  I will be plain: the weakest point of this account is the **Disunity Problem**. It is intellectually uncomfortable to have one definition of "cause" for actions and another for omissions. It invites the charge that you are changing the subject—that "causation" in the omissive case is really just "responsibility" wearing a metaphysical mask. Your student will press you on why we use the same word ("cause") if the underlying metaphysical machinery is so different. You must argue that the functional role of the concept unifies them, even if the truth-makers differ.

  Additionally, this view struggles with **overdetermination of norms**. If both the gardener and the neighbor had a duty to water the plant (perhaps they co-owned it), your theory implies both omissions are causes. This is good, but if the norms conflict or are vague, your causal facts become vague. This makes the metaphysics of causation suspiciously fuzzy compared to the precision of physics.

  ### Summary Verdict
  Reject **(7)**. Argue that while all the absences are difference-makers, only the gardener's absence is a *causal omission* because only hers was normatively expected. Admit that this makes causation partly normative and disunified, but insist that this is the only cost that saves us from the absurdity of (9) while keeping the truth of (1). Your student is right that norms are involved, but wrong that their involvement makes them merely pragmatic; in the metaphysics of omission, norms are structural.
