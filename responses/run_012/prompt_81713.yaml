      *   *Responsibility:* "Collapse" often implies external forces (climate, invasion) or systemic hubris. "Transformation" might imply internal choice.
      *   *Load-bearing vs. Convention:*
          *   *Load-bearing:* The material fact of depopulation, monument cessation, literacy loss.
          *   *Convention:* Calling this the end of "Civilization" rather than the end of "The State."

