      *   **Task:**
          1.  Reconstruct the implicit theory behind calling these episodes "collapses."
          2.  Address specific questions about bounded systems, elite vs. ordinary standpoints, and observer-relativity.
          3.  Assess, sharpen, or break the user's own criterion (loss of capacity to choose/agency).
          4.  Discuss implications for practice (museums, textbooks, terminology).
          5.  Identify rival accounts of society compatible with the practice.
      *   **Constraint:** Do *not* simply point to more reading. Work through the concepts philosophically/theoretically.

  2.  **Deconstruct the Implicit Theory of "Collapse":**
      *   *Systemic View:* Archaeology often relies on Systems Theory (Processual Archaeology). Society = a system with inputs, outputs, homeostasis. "Collapse" implies a system failure, a loss of complexity, a move to a lower energy state.
      *   *The Baseline Problem:* How do we define "normal"? Usually, it's defined by the most visible archaeological signature (monuments, palaces, writing). This biases the definition toward the elite state.
      *   *Elite Bias:* If "collapse" = loss of palaces/kings, then yes, it presupposes the elite institution *is* the society. For a farmer, the collapse of the palace might mean less tax/forced labor (liberation) or more insecurity (catastrophe).
      *   *Observer-Relativity:* Is it factual or evaluative? It's likely a hybrid. It's factual that the palace burned. It's evaluative to call that "societal collapse" rather than "political restructuring."

  3.  **Evaluate the User's Criterion (Loss of Agency/Choice):**
      *   *Strengths:* Captures the feeling of inevitability or external shock. Distinguishes between evolution (chosen/adapted) and collapse (forced). Fits LBA (systemic cascade) and Rapa Nui (ecological trap?).
      *   *Weaknesses (as identified by user):*
