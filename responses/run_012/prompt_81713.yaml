answer: |-
  This is an exceptionally sharp diagnostic of a foundational problem in archaeological theory. You have identified that "collapse" is not merely a descriptive term for a stratigraphic layer of destruction, but a theoretical category that carries ontological commitments about what a society *is*.

  Here is a reconstruction of the implicit theory, an assessment of your agency criterion, and an analysis of what is at stake in the terminology.

  ### 1. Reconstructing the Implicit Theory of Collapse

  To call an episode a "collapse" commits you to three specific theoretical premises. If any of these are false, the term loses its coherence.

  **A. Society as a Homeostatic System (The Baseline Problem)**
  You are correct that the concept presupposes a society as a bounded, integrated system with a "normal" mode of functioning. This is a legacy of Processual Archaeology and General Systems Theory. In this view, a society is a machine that processes energy (food, labor) into order (monuments, administration).
  *   **How the baseline is fixed:** You noted the risk of begging the question. In practice, the baseline is fixed **energetically and visibly**. The "normal" state is defined as the peak of energy expenditure visible in the record (the largest temples, the widest trade networks, the most complex script).
  *   **The Consequence:** This makes "collapse" a measure of *complexity loss*, not *population loss*. It defines the society by its maximum output, not its median experience. The baseline is not the average year of existence, but the peak year of monumentality. This is why a return to pre-palatial village life counts as "collapse" even if the population is stable. The system has moved to a lower energy state.

  **B. The Institution as the Subject (The Standpoint Problem)**
  Does the concept presuppose that the loss of central institutions *is* the loss of society? Yes.
  *   **The Elite Bias:** When we say "Mycenaean Civilization collapsed," the subject of that sentence is the *palatial network*, not the peasant in the hinterland. The palace is treated as the brain of the organism; if the brain dies, the organism is dead, even if the limbs twitch for a while.
  *   **Observer-Relativity:** This makes collapse an evaluative category. For the scribe, it is the end of the world (loss of livelihood, status, cosmic order). For the subsistence farmer, it might be a reduction in tax burden and corvée labor. If collapse is defined by the cessation of elite institutions, it is inherently a view from the top. It is not "observer-relative" in the sense that it is arbitrary, but it is *position-dependent*. It describes the failure of a specific project (state-formation), not necessarily the failure of a population to survive.

  **C. Discontinuity of Structure vs. Continuity of Substance**
  The theory relies on a distinction between *structure* (institutions, hierarchy, trade) and *substance* (people, language, genes).
  *   **The Commitment:** Calling it a collapse asserts that the structure is the historically significant entity. If the structure dissolves but the substance persists (as with the Maya), the narrative prioritizes the structure. This is why museums can show continuity of people alongside the narrative of collapse: they are exhibiting the *substance* while narrating the fate of the *structure*.

  ### 2. Assessing Your Criterion: The Loss of Agency

  Your proposed criterion is: *A society collapses when it loses the capacity to choose what comes next—when change happens to it rather than something it does.*

  This is a phenomenological definition of collapse (focusing on the experience of constraint) rather than a systemic one (focusing on complexity). It is intuitive, but it requires repair to function theoretically.

  **The Strengths:**
  *   It captures the *speed* and *involuntariness* of collapse. A slow evolution of institutions is not a collapse, even if the end result is the same (no palaces).
  *   It handles the "liberation" problem. If farmers actively overthrow the king and choose a village structure, that is revolution, not collapse. If the trade networks dry up due to climate shift and the palace burns because no one can pay the guards, that is collapse.

  **The Weaknesses (and Repairs):**

  *   **Problem 1: Collective Agency.** As you suspected, societies rarely act as unitary agents. In the Late Bronze Age, did "society" lose agency, or did the *coalition of elites* lose the ability to coordinate?
      *   *Repair:* Shift the locus of agency from "Society" to **"Structural Reproduction."** A society collapses when the mechanisms required to reproduce the existing social structure fail *faster than new mechanisms can be generated*. It is not about a collective "choice," but about the **breakdown of feedback loops**. The scribe cannot write because the clay supply is cut; the king cannot rule because the grain surplus is gone. The *system* loses the capacity to sustain its own complexity.

  *   **Problem 2: Degree vs. Kind.** Agency is rarely binary.
      *   *Repair:* Treat it as a threshold of **Resilience**. A society has a range of viable states. Collapse occurs when a shock pushes the society out of its "basin of attraction" into a new, lower-complexity basin from which it cannot easily return. The "loss of choice" is actually the **narrowing of the state-space**.

  *   **Problem 3: Survival without Options.** Your worry: A population survives intact but enslaved (no options). Is that collapse?
      *   *Repair:* Yes, but we must distinguish **Political Collapse** from **Demographic Collapse**. Under your criterion, enslavement is a *political collapse* (loss of self-determination) even if it is not a *demographic collapse*. This is actually a useful distinction. It allows you to say the Maya suffered a *political* collapse (loss of divine kingship agency) without a *cultural* collapse.
      *   *Refinement:* To make your criterion work, specify that the "capacity to choose" refers to the **scale of social coordination**. If a population can only coordinate at the village level when they previously coordinated at the regional level, they have lost the agency to act regionally. That is a collapse of *complexity*, even if individuals are alive.

  **Revised Criterion:**
  *A society collapses when external or internal constraints reduce the maximum scale of viable social coordination precipitously, foreclosing the structural adaptations that were previously available, regardless of population continuity.*

  ### 3. Implications for Practice: Should We Drop the Word?

  If the presuppositions are roughly as described, should museums and textbooks drop "collapse"?

  **The Cost of Dropping It:**
  If you replace "collapse" with "transformation" or "reorganization," you lose the ability to mark the **vector of change**.
  *   "Transformation" is directionless. It implies A became B.
  *   "Collapse" is directional. It implies High Complexity → Low Complexity.
  *   **What is lost:** If we stop using "collapse," we lose the vocabulary to describe *loss*. We lose the ability to say that literacy, long-distance trade, or specialized craft production were *destroyed*, not just moved. "Reorganization" sounds like a business merger; "Collapse" acknowledges that the lights went out. We need the word to assign a negative value to the loss of complexity, because complexity often correlates with carrying capacity and specialization.

  **The Cost of Keeping It:**
  *   **The Ideological Baggage:** Keeping the word reinforces the idea that the State is the pinnacle of human achievement. It risks validating the elite perspective (the Palace *is* the Civilization).
  *   **The Continuity Erasure:** It obscures the survival of the descendants (as you noted with the Maya and Rapa Nui).

  **The Solution: Precision, Not Abandonment.**
  The practice should not drop the word, but it must **qualify the subject**.
  *   Instead of "The Maya Collapse," use "The Collapse of the Classic Maya *Polity*."
  *   Instead of "Rapa Nui Collapse," use "The End of the *Moai Era*."
  *   This preserves the ability to say something was destroyed (the institution) without implying the people vanished.

  **Load-Bearing vs. Convention:**
  *   **Load-Bearing:** The material fact of the cessation of specific flows. (e.g., No more Linear B tablets; no more dated stelae). This is the empirical core.
  *   **Convention:** The moral weight attached to that cessation. The idea that this cessation represents a "tragedy" or a "failure" is conventional. It depends on whether you value monumentality over subsistence security.
  *   **Rival Accounts:**
      *   *Resilience Theory:* Compatible with "transformation." Argues the system adapted to a new normal. (Load-bearing: continuity of population).
      *   *Conflict Archaeology:* Compatible with "liberation." Argues the "collapse" was a successful revolt by the lower classes. (Load-bearing: destruction of palaces).
      *   *Post-Colonial Archaeology:* Argues "collapse" is a colonial narrative imposed on indigenous continuity. (Load-bearing: descendant claims).

  ### 4. Summary for Your Paper

  Your conceptual snag is not a bug; it is the central theoretical tension of the field.

  1.  **Implicit Theory:** "Collapse" assumes a Systems Theory model where the "Society" is identified with its peak energetic output (monuments/state). It is a view from the palace, not the village.
  2.  **Your Criterion:** Your "loss of agency" idea is strong but needs to be shifted from *collective choice* to *structural capacity*. Collapse is the **precipitous reduction in the scale of viable social coordination**.
  3.  **Practice:** Do not drop the word, but restrict its scope. Use it to describe the *institutions*, not the *people*. Acknowledge that "collapse" is an evaluative term that privileges complexity.
  4.  **Load-Bearing:** The hard data is the cessation of flows (goods, info). The story we tell about what that *means* (tragedy vs. adaptation) is where the rival accounts compete.

  By making this distinction explicit, you can argue that the "collapse" narratives are not lies, but they are *partial truths* that prioritize the durability of stone over the durability of people. Your paper can then argue that a complete archaeology of complex societies must narrate both the collapse of the state and the continuity of the society, treating them as distinct but overlapping trajectories.
