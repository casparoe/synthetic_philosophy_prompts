prompt: |-
  So my roommate and her cousin got into this whole thing while I was helping them move, and I ended up standing in the hallway holding an allen key for like forty minutes because neither of them would let it go. They were taking apart a flat-pack bookshelf at the time. I need someone to tell me who was right at each step, because I honestly couldn't tell.

  (1) My roommate said there's no such thing as the bookshelf. There are boards and screws and dowels, and "bookshelf" is just a handy way of talking, like saying the average family has 2.4 kids. Nothing in the world actually answers to it.

  (2) Her cousin said fine — then there's no such thing as her either, she's just cells arranged person-wise, and "arranged person-wise" is doing exactly the same work "person" was doing. Roommate said that's not a rename, that's the entire point of paraphrasing: "the boards are arranged shelf-wise" is made true by the boards and the way they're related to each other, whereas "there is a shelf" needs some extra item sitting on top of the boards.

  (3) Roommate then said that extra item is dead weight — it never explains anything the boards weren't already explaining and never causes anything the boards weren't already causing. Cousin said by that test the boards are dead weight too, and the screws, and everything except whatever the smallest bits of matter are — and if roommate gets to stop there, she gets to stop at shelves. She also said roommate can no longer count: she can't say there are two chairs in the kitchen and mean it, only that there are two chair-arrangements.

  (4) Roommate said her line is at least principled, she never has to decide which groupings are the real ones. Cousin said then she's stuck with "any two things make a thing", which gives you the object made of the leftover screws plus the moon, and she's welcome to it since she never has to mention it. Roommate said that's a cost, not a freebie. Cousin also asked what happens if there's no bottom level — no smallest bits at all, just smaller stuff forever. Then roommate's view says nothing exists, which she said is worse than believing in the screw-moon object.

  Can you adjudicate this? I don't want a summary of the debate or a lecture on the topic, I want to know who was right about what, move by move. Give it to me as exactly five numbered points — one for each of the four moves above, plus one on what they're both missing — each point a sentence or two, no intro, no conclusion. And definately don't tell me they were just talking past each other unless you can say exactly where.
