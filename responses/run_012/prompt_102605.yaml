answer: |-
  You are right to be bugged, and your intuition is spot-on: **Step (1) is safe.** If Step (1) is false, it isn't a Prisoner's Dilemma by definition. Your friend is trying to solve a paradox by breaking the definition of the game rather than the logic of the iteration.

  The break happens at **Step (3)**, which leads directly to the false inference in **Step (4)**.

  Here is the breakdown of why Step (3) looks innocent, why it is wrong, what it costs to fix, and the distinction between rationality and evolutionary stability.

  ### 1. The Break: Step (3) and the "Ledger Fallacy"

  Step (3) says: *"Whatever your opponent plays in round 47, and whatever happens in all the other rounds, your payoff in round 47 is bigger if you defect..."*

  This sounds like simple arithmetic, but it smuggles in a massive, false assumption: **Causal Independence.**

  It assumes that the payoff of Round 47 can be calculated in isolation from the payoffs of Rounds 48–1000. It treats the Iterated Prisoner's Dilemma (IPD) as a stack of 1,000 independent One-Shot games.

  **Why it looks innocent:**
  We are used to thinking of scoreboards as additive. If I score 5 points in the first quarter and 5 in the second, I have 10. Step (3) assumes that "Defecting in Round 47" adds $X$ points to your total, and "Cooperating in Round 47" adds $Y$ points to your total, where $X > Y$.

  **Why it is wrong:**
  In the IPD, your move in Round 47 is not just a points transaction; it is a **signal** that alters the opponent's behavior in Round 48.
  *   If you Defect in 47, you gain +1 point *in that round* (compared to cooperating).
  *   But if your opponent plays Tit-for-Tat, your Defect in 47 *causes* them to Defect in 48, 49, and 50.
  *   This might cost you -5 points in future rounds.

  Step (3) asks you to evaluate the move "holding the other rounds constant." But you **cannot** hold the other rounds constant. The rounds are causally linked by the players' strategies. To evaluate the rationality of a move in Round 47, you must evaluate the **Expected Value** of that move, which includes the immediate payoff *plus* the discounted value of all future payoffs that this move triggers.

  When you include the future consequences, Defecting in Round 47 often yields a *lower* total expected value than Cooperating. Therefore, Defecting does **not** dominate Cooperating in the iterated game.

  ### 2. The Cost of Repair

  You do **not** need to give up (1) or (2). In fact, keeping them is crucial.

  *   **Keep (1):** In a *one-shot* game, there is no future to manipulate. Defection strictly dominates. This is arithmetic truth based on the payoff matrix ($T > R > P > S$).
  *   **Keep (2):** Rational agents do not play strictly dominated strategies.
  *   **Reject (3) as written:** It must be rewritten to acknowledge that the "payoff of a round" is not an isolated number, but a function of the strategy profile.
  *   **Reject (4):** This is the **Fallacy of Composition**. Just because a move is locally optimal in every isolated snapshot doesn't mean it is globally optimal in the movie. (Analogy: Standing up gives you a better view in a stadium *if everyone else stays seated*. But if everyone stands up, nobody has a better view. You can't say "Standing dominates Sitting" for the whole crowd.)

  **The Repair:**
  Replace Step (3) with: *"In round 47, defecting gives a higher **immediate** payoff, but may lower the **total expected** payoff by triggering retaliation in future rounds."*

  Once you make that change, Step (5) collapses. You should not defect in every round. You should defect only if the "Shadow of the Future" is too short to make cooperation valuable.

  ### 3. Is Tit-for-Tat 'Rational'?

  This is where your friend's confusion about "Rationality" vs. "Evolutionary Stability" comes in.

  **Are they the same claim?**
  No.
  *   **Rationality (Game Theory):** A strategy is rational if it is a **Best Response** to the opponent's strategy. If I know you are playing Tit-for-Tat (TFT), is my rational move to play TFT? **Yes** (provided the probability of the game continuing is high enough). If I play TFT against you, we both get the Reward ($R$) every time. If I Defect, I get the Temptation ($T$) once, then the Punishment ($P$) forever. If the future is valuable enough, $R + R + R... > T + P + P...$. Therefore, Cooperating (via TFT) is the **rational** best response to TFT.
  *   **Evolutionary Stability (Biology):** A strategy is ESS if, when the whole population plays it, a mutant strategy cannot invade. TFT is often ESS against All-Defect (provided the population is clustered or the future is long enough).

  **So, is TFT Rational?**
  **Yes.** In the Iterated PD with an indefinite horizon, there are multiple **Nash Equilibria**.
  1.  **All-Defect vs. All-Defect** is a Nash Equilibrium. (If you defect, I must defect).
  2.  **TFT vs. TFT** is *also* a Nash Equilibrium. (If you cooperate, I should cooperate).

  Your friend's argument claims that All-Defect is the *only* rational outcome. This is false. Game theory (specifically the **Folk Theorem**) proves that in indefinite IPD, many outcomes—including full cooperation—are rational equilibria.

  Cooperation is not *always* rational (e.g., if the game ends next turn, you should defect). But the claim that cooperation is *never* rational is demonstrably false in the indefinite IPD.

  ### 4. What Step (3) is Smuggling In

  To answer your specific request: Step (3) smuggles in **Myopic Causal Independence.**

  It assumes that the opponent's future moves are **fixed events** rather than **reactions**.
  *   **Correct View:** My move $M_{47}$ is an input into the opponent's strategy function $S_{opp}$, which outputs $M_{48}$.
  *   **Friend's View (Step 3):** $M_{48}$ is a fixed constant regardless of $M_{47}$.

  By treating the opponent's future moves as fixed constants, Step (3) effectively turns the Iterated PD back into a series of One-Shot PDs. It begs the question. It assumes the very thing it's trying to prove: that your actions cannot influence the opponent's future cooperation.

  ### Summary for your Friend

  1.  **Don't touch (1).** If Defect doesn't dominate in one-shot, it's not a Prisoner's Dilemma.
  2.  **Kill (3).** It ignores that Round 47 determines Round 48. You can't maximize the sum of a series by maximizing each term independently when the terms are causally linked.
  3.  **Rationality is preserved.** Tit-for-Tat is rational because it is a Best Response to itself. It is not just "biologically useful"; it is mathematically sound decision-making when the "Shadow of the Future" is long enough.
  4.  **The Real Lesson:** Cooperation is rational *conditionally*. It is rational *if* you believe your opponent is capable of reciprocity and the game is likely to continue. Defection is only rational if you believe the relationship is ending or the opponent is incapable of responding.

  Your friend has discovered the logic of **Backward Induction**, which *does* prove Defection is dominant in a **finite, known** number of rounds. But she is applying it to an **indefinite** game. In an indefinite game, Backward Induction cannot start (because there is no last round to start from), and cooperation becomes a rational equilibrium.
