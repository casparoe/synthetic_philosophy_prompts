      *   The 10-hour rule. It's not magic. It's a metric for attachment. Like difficulty tuning.
      *   Emergent stuff. It's scarier because it's real-time.
      *   Guardrails: Don't reward it explicitly. Give a path to redemption or finality.
      *   Close.

  7.  **Writing - Second Pass (Focusing on Flow and Tone):**
      *   Make sure it doesn't sound like bullet points disguised as paragraphs.
