  *Key argument structure:*
  1. Technical truth (no sentience) vs. Ethical truth (player experience).
  2. The emergent nature amplifies agency.
  3. The 10-hour rule is a proxy for emotional weight.
  4. Recommendation: Ship, but frame it carefully.

