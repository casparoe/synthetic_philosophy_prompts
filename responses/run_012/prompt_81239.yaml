  8.  **Final Polish:**
      *   Check against "no liability" constraint.
      *   Check against "no other games" constraint.
      *   Ensure the "CS degree" friendly language (avoid "deontology," "utilitarianism," etc.).
      *   Ensure the recommendation is concrete (Ship with guardrails).

  *(Self-Correction during drafting)*: I need to make sure I don't waffle. The prompt asks for a straight answer on the ten-hour rule. I should say it's coherent *if* defined as a proxy for attachment, not sentience. I also need to make sure the emergent vs. authored point is clear: emergent removes the "scripted necessity" defense, making the player own the action more.

  Let's write.

