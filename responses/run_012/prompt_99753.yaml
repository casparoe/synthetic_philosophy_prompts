answer: |-
  There is no single, canonical term in the philosophical canon that captures this phenomenon exactly. It is not a named fallacy like *ad hominem* or *straw man*, nor is it a standard concept in metaethics like *supervenience* or *non-naturalism*.

  However, your intuition is precise. You have identified a specific structural flaw in normative reasoning that sits at the intersection of **philosophy of science** (how we measure constructs), **informal logic** (how arguments shift), and **metaethics** (how we ground value).

  Your coined term, **"Metric Laundering,"** is excellent. It is evocative and accurate. In the absence of an established term, I recommend you retain it, but I will help you rigorize its definition by distinguishing it from its closest philosophical relatives and mapping its boundaries.

  Here is an analysis of the shape of the move, its distinction from similar concepts, and the boundary conditions you requested.

  ---

  ### 1. The Shape of the Move: What is Being Retained?

  To understand the phenomenon, we must separate the argument into three layers. In a clean argument, these layers move together. In "Metric Laundering," they decouple.

  1.  **The Normative Anchor (The Intuition):** The pre-theoretical moral belief (e.g., "Cognitive complexity grants moral status").
  2.  **The Operational Proxy (The Metric):** The empirical measure used to track the anchor (e.g., "Brain size").
  3.  **The Rhetorical Authority (The Weight):** The persuasive force or presumption of truth the argument carries.

  **The Mechanism:**
  When the **Proxy** is falsified (e.g., whales have larger brains but aren't granted higher status), a legitimate theory revision would require adjusting the **Anchor** (perhaps cognitive complexity isn't the only thing that matters) or admitting uncertainty.

  In Metric Laundering, the arguer swaps the **Proxy** (e.g., to "neuron count") but retains the **Rhetorical Authority** generated by the original Proxy. The audience was convinced by *Brain Size*; they were never actually convinced by *Neuron Count*. But because *Neuron Count* is presented as a "refinement" of *Brain Size*, it inherits the confidence the audience had in the original measure.

  **What is retained?** The **Presumptive Weight**. The burden of proof was considered "met" by the first metric. The second metric is treated as having already met that burden, even though it is a fundamentally different empirical claim that requires its own moral justification.

  ### 2. Distinctions from Established Concepts

  You asked how this is carved against similar concepts. Here is the differentiation:

  #### Vs. Motte-and-Bailey
  *   **Motte-and-Bailey:** The arguer holds two positions simultaneously. When attacked, they retreat to the defensible one (Motte); when attacking, they claim the controversial one (Bailey). It is a *spatial* shuffle between two held positions.
  *   **Metric Laundering:** This is a *temporal* succession. The first metric is explicitly *abandoned* or conceded to be insufficient. The arguer does not retreat to a fortress; they build a new house but claim it sits on the same foundation.
  *   **Key Difference:** Motte-and-Bailey is about *defensibility*. Metric Laundering is about *continuity of authority*.

  #### Vs. Ad Hoc Rescue (Lakatos)
  *   **Ad Hoc Rescue:** In philosophy of science, this occurs when a theory is modified solely to save it from falsification, without new independent evidence.
  *   **Metric Laundering:** The new metric often *does* have independent scientific merit (e.g., neuron count is biologically significant). The flaw is not that the new metric is scientifically baseless, but that its *moral relevance* is assumed via inheritance rather than demonstrated.
  *   **Key Difference:** Ad Hoc Rescue questions the *truth* of the new hypothesis. Metric Laundering questions the *moral lineage* of the new hypothesis.

  #### Vs. Goodhart's Law
  *   **Goodhart's Law:** "When a measure becomes a target, it ceases to be a good measure." This describes how agents *game* the system.
  *   **Metric Laundering:** This describes how arguers *justify* the system. It is not about the metric breaking due to optimization; it is about the metric breaking due to counterexample, and the justification persisting anyway.
  *   **Key Difference:** Goodhart is about *behavioral response*. Metric Laundering is about *rhetorical inertia*.

  #### Vs. Ordinary Theory Revision (Construct Validity)
  *   **Theory Revision:** In psychometrics, if an IQ test is biased, we create a better test. Crucially, we also update our understanding of "intelligence." We admit the old test was flawed *and* that our confidence in the scores was misplaced.
  *   **Metric Laundering:** The arguer updates the test but refuses to discount the confidence scores from the old test. They treat the moral intuition as a fixed constant that the metrics are merely "approximating," rather than acknowledging the metrics *constitute* the intuition.
  *   **Key Difference:** Legitimate revision updates the **Normative Anchor** alongside the Proxy. Metric Laundering keeps the Anchor static.

  #### Vs. Reification
  *   **Reification:** Treating an abstract concept as a concrete thing (e.g., treating "intelligence" as a physical object in the brain).
  *   **Metric Laundering:** This is a specific *species* of reification. It is **Diachronic Reification**. It treats the *history of measurement* as a continuous physical object, ignoring that the object being measured has changed definition.

  ### 3. Boundary Cases and Definitions

  To make "Metric Laundering" a usable tool, we must define its edges.

  #### Is it the same when a researcher replaces a proxy due to new data?
  **No.** This is the "Clean Case" vs. the "Laundered Case."
  *   **Clean Case (Scientific Refinement):** "Brain size was our proxy for moral capacity. Data shows this is flawed. We propose neuron count. *Note that this changes our moral predictions for Species X, and we must re-evaluate our moral intuitions accordingly.*" Here, the rhetorical authority is reset.
  *   **Laundered Case:** "Brain size was our proxy. It failed. Use neuron count instead. *Therefore, our original conclusions about moral hierarchy largely stand.*" Here, the authority is laundered.
  *   **Test:** Does the arguer acknowledge that the *moral conclusions* might shift significantly with the new metric, or do they imply the new metric simply "fixes the bugs" in the old moral conclusion? If the latter, it is laundering.

  #### Does it matter whether the replacement is offered sincerely or strategically?
  **No, but it changes the ethical charge.**
  *   **Strategic Laundering:** The arguer knows the first metric was chosen for its rhetorical punch (e.g., "Brain size" sounds definitive) and switches only when forced. This is deceptive.
  *   **Sincere Laundering:** The arguer genuinely believes there is a single "Essence of Moral Worth" and that they are simply honing in on it. They fail to see that each metric change is actually a *conceptual shift*, not just a measurement correction.
  *   **Phenomenological Identity:** Structurally, the move is identical. The rhetorical effect on the audience is the same. The label applies to the *structure of the argument*, not the *psychology of the arguer*.

  #### Does the phenomenon require quantitative metrics?
  **No.** It applies to qualitative criteria as well.
  *   **Example:** "Moral status requires **Rationality**." (Counterexample: Infants). "Okay, **Potential for Rationality**." (Counterexample: Permanently comatose adults). "Okay, **Being the Subject of a Life**."
  *   If the arguer uses the intuitive force of "Rationality" (which implies agency and responsibility) to bolster "Subject of a Life" (which implies passive experience), while knowing the two are distinct, they are laundering the criterion.
  *   **Term Extension:** You might call this **"Criterion Laundering"** for the general case, reserving "Metric Laundering" for quantitative proxies.

  ### 4. Proposed Definition for Your Notes

  If you wish to formalize this in your writing, I suggest the following definition:

  > **Metric Laundering (n.):** A rhetorical maneuver in normative argumentation wherein an empirical proxy for a moral construct is replaced following falsification or counterexample, but the *presumptive authority* of the original proxy is transferred to the new one without re-justification.
  >
  > **Conditions:**
  > 1.  **Decoupling:** The original metric is conceded to be insufficient.
  > 2.  **Succession:** A new metric is proposed as a refinement.
  > 3.  **Inertia:** The rhetorical confidence or moral conclusions derived from the original metric are retained as if they apply to the new metric, despite the lack of logical continuity between the two proxies.
  >
  > **Distinction:** Unlike *Motte-and-Bailey*, the original position is abandoned, not defended. Unlike *Ad Hoc Rescue*, the new metric may be scientifically valid. The fallacy lies in the **transfer of moral weight**, not the validity of the measure.

  ### 5. Why This Matters for Your Context

  As a software engineer, you recognize this as a **Interface Mismatch**.
  *   The **Moral Intuition** is the API.
  *   The **Metric** is the Implementation.
  *   In a clean system, if you change the Implementation, you check if the API contract still holds.
  *   In Metric Laundering, the Implementation is changed, but the users (the audience) are told the API contract remains identical, even though the underlying logic has shifted.

  This is particularly prevalent in AI safety and animal ethics because we are trying to map **continuous variables** (neurons, FLOPS, connectivity) onto **discrete moral categories** (rights, standing, personhood). Metric Laundering is the friction heat generated when we try to slide those variables without admitting the categories are melting.

  ### Summary
  There is no established Greek/Latin name for this. It is a gap in the current taxonomy of fallacies. **"Metric Laundering"** is a robust, defensible coinage. It describes a specific failure of **Reflective Equilibrium**: the refusal to let the "considered judgment" (the intuition) update when the "theory" (the metric) is revised. Use it. It fills a lexical void.
