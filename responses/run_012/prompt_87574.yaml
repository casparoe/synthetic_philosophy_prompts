  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Theoretical condensed-matter physicist (postdoc). Daily user of EFT, RG, Wilsonian coarse-graining, universality classes, fixed points, relevant/irrelevant operators, regularization schemes, symmetries, anomalies.
