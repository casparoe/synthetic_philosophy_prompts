          *   Systematic translation of central claims (entities vs. structure, pessimistic meta-induction, continuity).
          *   "Residue Report": What didn't survive? Distortions? Missing counterparts?
          *   Address Epistemic vs. Ontic distinction in RG terms.
          *   Address "relations prior to relata" in terms of correlators/order parameters.
