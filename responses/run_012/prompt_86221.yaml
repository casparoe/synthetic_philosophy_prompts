  # Moore's Proof: A Decision Tree for the Kitchen Table

  **Start:** "Yes, I'm pretty sure I can tell my left hand from my right."

  **Q1: Is "Here is a hand" the very proposition the sceptic denies, or are they attacking the rules allowing you to say it?**
  *   **[Rules]** → **Q1b: Is this rule something we inherit like a reflex, or something that changes with the conversation?**
      *   **[Inherit]** → **Leaf 1: Hinge Epistemology** (*Hands are unchosen foundations*). **Achieves:** Nothing; it mistakes a rule for a fact. **Awkward:** You can't doubt your hands even when you want to.
      *   **[Changes]** → **Leaf 2: Contextualism** (*Standards shift with context*). **Achieves:** Works in kitchen, fails in seminar. **Awkward:** Whether you know things depends on who is asking.
  *   **[Proposition]** → **Q2: Can you know you have hands while the "brain in a vat" scenario is still, for you, an open question?**
      *   **[No]** → **Q3: Does a proof have to be able to talk a genuine doubter round?**
          *   **[Yes]** → **Leaf 3: Dialectical Failure** (*Proof needs audience*). **Achieves:** Nothing for the sceptic. **Awkward:** A true fact isn't proven if the listener is stubborn.
          *   **[No]** → **Q4: When the claim to know about the hands and the admission that you can't rule out the vat can't both stand, what do you give up?**
              *   **[Give up knowing hands]** → **Q4b: If you give up knowing hands, do you lose all confidence or just the label 'knowledge'?**
                  *   **[Lose confidence]** → **Leaf 4: Scepticism** (*You don't know anything*). **Achieves:** Shows Moore is wrong. **Awkward:** You must act as if you know while admitting you don't.
                  *   **[Lose label]** → **Leaf 5: Transmission Failure** (*Warrant doesn't flow*). **Achieves:** Proof is valid but useless. **Awkward:** You know premises but can't learn conclusion.
              *   **[Give up needing to rule out vat]** → **Q4c: If you give up needing to rule out the vat, do you claim to know the world exists or just that you're entitled to assume it?**
                  *   **[Know world]** → **Leaf 6: Dogmatism** (*Hands prove world*). **Achieves:** Moore succeeds completely. **Awkward:** You know you aren't a vat without evidence against it.
                  *   **[Entitled]** → **Leaf 7: Entitlement** (*Permission to assume*). **Achieves:** Moore is rational but not proven. **Awkward:** You rely on assumptions you admit you can't prove.
      *   **[Yes]** → **Q3: Does a proof have to be able to talk a genuine doubter round?**
          *   **[Yes]** → **Leaf 8: Persuasive Realism** (*Proof works on reasonable people*). **Achieves:** Proves world to those who listen. **Awkward:** You can't define who counts as reasonable.
          *   **[No]** → **Leaf 9: Non-Dialectical Proof** (*Proof is objective*). **Achieves:** Proves world regardless of audience. **Awkward:** You have a proof no one accepts.

  ***

  ### Unoccupied Answer-Combinations
  *These paths exist in the tree structure but no serious position sits here.*

  1.  **Q1=Rules + Q2=No.**
      *   **Status:** **Incoherent.** If the sceptic is attacking the rules of the game (Q1), asking whether you can know hands while the vat is open (Q2) is a category mistake; the vat scenario presupposes the rules you just rejected.
  2.  **Q1=Proposition + Q2=Yes + Q4=Give up knowing hands.**
      *   **Status:** **Incoherent.** If you answered "Yes" to Q2 (you *can* know hands while the vat is open), there is no conflict requiring you to give up knowing hands in Q4.
  3.  **Q1=Proposition + Q2=No + Q3=Yes + Q4=Give up nothing.**
      *   **Status:** **Unattractive.** This claims you can't know hands (Q2), must convince a doubter (Q3), yet give up nothing (Q4). It leaves you with a proof that fails, knowledge you don't have, and no concession to the logic that caused the problem.

  ### Indistinguishable Leaves
  *The following leaves are too close given the current questions.*

  *   **Leaf 6 (Dogmatism) and Leaf 7 (Entitlement).**
      *   **Problem:** Both answer "Give up needing to rule out vat" in Q4. The split in Q4c ("Know" vs "Entitled") relies on a technical distinction many users will blur in practice.
      *   **Extra Question:** "If challenged, do you say 'I see them' (evidence) or 'I'm allowed to assume it' (permission)?"

  *   **Leaf 1 (Hinge) and Leaf 2 (Contextualism).**
      *   **Problem:** Both answer "Rules" in Q1. The split in Q1b ("Inherit" vs "Changes") is subtle; both views agree the sceptic is changing the game, differing only on whether the game is fixed or fluid.
      *   **Extra Question:** "If the sceptic leaves the room, do the rules change back?"
