prompt: |-
  Hey — I'm a second-year PhD student in late antique / Roman history and I'm supposed to lock down a dissertation area in the next few months, so I've been trying to map out what's genuinely still open in the "why did Rome fall" space. I'd love someone with a real command of this literature to help me prioritize, so please put on your senior-ancient-historian hat and, before anything else, brainstorm the space of open questions out loud — I want to see the map before you rank it.

  And to be clear about the deliverable: I don't want a survey of the debate and I don't want a reading list (I can't verify citations anyway, and at this stage I need judgement, not bibliography). What I want is: of the genuinely open questions here, which two or three are most worth three years of my life, and in what order? Defend the ordering. Tell me your criteria — does settling it unlock other questions? is it tractable with the evidence we actually have? is it neglected, or is everyone already on it? — where those criteria pull against each other, and what kind of finding or argument over the next couple of years would move something up or down the list.

  Here are the strands I keep going back and forth on, roughly:

  - The "did it even fall?" framing — transformation vs. catastrophe, continuity of Roman institutions inside the successor kingdoms, that whole axis. Is there anything left here or is it basically played out?
  - Climate and disease. There's the run of big volcanic eruptions in the sixth century and the cooling they seem to have caused, plus the first plague pandemic. I find the causal stories tempting but I get nervous, because a lot of them lean on the plague as a huge demographic shock, and I've read some recent work arguing the plague's demographic impact has been massively overstated — mild, patchy by region, that kind of thing. If that revision holds up, does it gut the climate-and-disease package, or does the climate part stand on its own? This one feels like it might be upstream of a bunch of other questions but I can't tell.
  - The fiscal / military-state story — was it fundamentally a revenue-and-army problem, and does losing the rich provinces explain the rest?
  - The "barbarians" — how big were the migrations really, and how much of "barbarian invasion" is an artifact of our sources' genres and biases rather than actual demography? The small-numbers / elite-takeover picture.
  - The East — why did the Eastern half keep going (or did it, for a while)? Is the live question the West's fall, or the East's survival?

  I guess what I'm really after is which of these is the load-bearing question — the one where the answer would change how we read a lot of the others. My fear is I'll definately pick something that's either unanswerable on the evidence or secretly already settled and I just don't know the literature well enough yet. I'm a sources person, not a modeler, so tractability with literary and archaeological evidence matters alot to me.

  So: give me the ranking, the reasoning, and be honest about what you're unsure of. And if you think I'm framing one of these wrong, say so.
