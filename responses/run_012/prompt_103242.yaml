prompt: |-
  I'm a features editor at a mid-sized ideas-and-science magazine — I commission the trends slot — and I keep getting into the same fight with my colleagues, which has now become a genuine editorial problem. Every fortnight or so someone pitches me a generation story: Gen Z are quitting hustle culture, Millennials are the loneliest cohort, Gen Alpha are the first AI-native generation, that sort of thing. And I have a persistent itch that half of these are doing something not quite legitimate — smuggling in a claim about a real kind of person when all they've actually got is a birth-year bracket plus a bit of survey data that probably says more about the year the survey ran than about the people in it. But I can't articulate the difference sharply enough to use it at the pitch meeting, and I don't want to be the bloke who just declares that generations aren't real and kills every story, because sometimes the cohort frame is exactly right and the age-bracket stories are the boring ones.

  What I want from you is a decision procedure I can actually run at the desk — a checklist or a flowchart in words, with the questions in order and what counts as a sufficient answer to each — for deciding whether a pitch that treats a 'generation' as a kind is doing legitimate conceptual work or is just dressing up an age band as an entity. I'm told the philosophy of kinds has something relevant here (I half-remember the homeostatic property cluster account, and Ian Hacking's idea that classifications can end up making up the people they classify) and that demographers have a whole identification problem about separating cohort effects from period effects from plain age effects, so please use whatever of that is genuinely usable and translate it into things a non-statistician editor can ask in ten minutes. The procedure needs to tell me: what has to be true of a cohort before it's a genuine kind rather than a stipulated label; how to tell a cohort effect from a period effect from an age effect when the pitch gives me all three mashed together; when the variation inside the cohort is so large that the kind is doing no explanatory work at all; whether the boundary is being discovered or merely drawn; and, importantly, the point at which the procedure should stop and hand the decision back to me on values grounds — because sometimes we run a generation story as a useful fiction and I want the procedure honest about that instead of pretending it's a pure fact question.

  Then run it on three pitches so I can see it work: (1) 'Gen Z are the loneliest generation'; (2) 'the people who came of age during the 2008 crash are a distinct cohort in their attitudes to work'; and (3) 'Gen Alpha are the first AI-native generation'. At least one of those should come out with an answer I won't like — I'd rather find out now than in the letters page. And please flag the cases the procedure simply can't settle, where I have to make the call myself, and be straight about which steps are just judgment dressed up as method. Write it in British English, and keep the register pitched at an editor rather than a demographer.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Features Editor at a mid-sized ideas-and-science magazine.
      *   **Problem:** Constant pitches about "generations" (Gen Z, Millennials, etc.) that feel intellectually shaky but hard to refute precisely. Needs to distinguish between legitimate cohort analysis and lazy age-bracketing.
      *   **Goal:** A decision procedure (checklist/flowchart in words) to evaluate these pitches at the editorial desk.
      *   **Requirements:**
          *   Must incorporate philosophy of kinds (HPC, Hacking) and demography (cohort/period/age effects) but translated for non-statisticians.
          *   Must address: genuine kind vs. stipulated label, cohort vs. period vs. age effects, internal variation, discovered vs. drawn boundaries, and the point where value judgments take over.
          *   Must be usable in ~10 minutes.
          *   Must be written in British English, editor-to-editor register.
          *   Must test the procedure on three specific pitches: (1) Gen Z loneliness, (2) 2008 crash cohort/work attitudes, (3) Gen Alpha/AI-native.
          *   Must flag where the procedure fails or requires editorial judgment.
          *   One result should be unwelcome (honest assessment).

  2.  **Deconstruct the Intellectual Framework:**
      *   *Philosophy of Kinds:* Natural kinds vs. Social kinds. Homeostatic Property Clusters (HPC) suggest a kind is real if properties cluster together due to underlying mechanisms, not just arbitrary grouping. Ian Hacking's "looping effect" suggests classifying people changes them (making the kind real through feedback).
      *   *Demography:* The Age-Period-Cohort (APC) identification problem.
          *   *Age Effect:* Changes due to getting older (everyone does this).
          *   *Period Effect:* Changes due to current events affecting everyone now (e.g., a pandemic).
          *   *Cohort Effect:* Changes due to shared formative experiences unique to a birth group.
      *   *Editorial Utility:* Does the label *explain* something or just *describe* a slice of data? Is it predictive? Is it actionable?

  3.  **Drafting the Decision Procedure (The "Editor's Filter"):**
      *   Need a step-by-step flow.
      *   *Step 1: The Mechanism Test (HPC).* Is there a causal story binding them, or just a birth date?
      *   *Step 2: The APC Test (Demography).* Is this actually about age or the current zeitgeist?
      *   *Step 3: The Variance Test (Statistics).* Is the within-group difference smaller than the between-group difference?
      *   *Step 4: The Looping Test (Hacking).* Does the label change their behaviour? (Is it becoming real?)
      *   *Step 5: The Boundary Test (Discovery vs. Stipulation).* Are the edges fuzzy or sharp?
      *   *Step 6: The Utility/Value Test.* Even if shaky, is it useful? (This is where the editor takes over).

  4.  **Refining the Language:**
      *   British English (e.g., "programme," "centre," "whilst," "fortnight," "bloke").
      *   Tone: Professional, collegial, slightly weary but rigorous. Not academic jargon, but not dumbed down.
      *   Format: Clear headings, bullet points, bold text for emphasis.

  5.  **Testing the Procedure on the Three Pitches:**

      *   *Pitch 1: 'Gen Z are the loneliest generation'.*
          *   Mechanism: Social media? Economic precarity?
          *   APC: Loneliness often tracks with age (young adults are always lonely). Period effect (post-pandemic)?
          *   Variance: Huge variance within Gen Z.
          *   Verdict: Likely an Age/Period effect masquerading as Cohort. *Result: Reject/Refocus.* (This might be the "unwelcome" one if they love this angle, but it's the most scientifically dubious).
          *   *Correction:* Actually, the prompt asks for *one* answer the editor won't like. Usually, editors *like* Gen Z loneliness stories because they get clicks. So rejecting it is the "unwelcome" news. Or, perhaps accepting the AI one is the unwelcome one because it's speculative. Let's aim for scientific rigour. The loneliness one is notoriously confounded by age effects. I will flag this as weak.

      *   *Pitch 2: 'People who came of age during the 2008 crash are a distinct cohort in work attitudes'.*
          *   Mechanism: Scarring effect of recession during formative years. Strong economic literature support.
          *   APC: Distinguishes from current period (boom/bust now) and age (older workers behave differently).
          *   Variance: Still high, but the *mean* shift is documented.
          *   Verdict: Strongest candidate for a "real" cohort effect. *Result: Commission.*

      *   *Pitch 3: 'Gen Alpha are the first AI-native generation'.*
          *   Mechanism: Exposure to tech.
          *   APC: They are children. We don't know their adult attitudes yet. It's predictive speculation.
          *   Looping: The label might shape them.
          *   Verdict: It's a "useful fiction" but not a discovered kind yet. *Result: Commission as speculation/essay, not data story.*

      *   *Wait, I need to ensure one result is "unwelcome".* If the editor keeps getting these pitches, they probably *want* to run them. Telling them the Gen Z Loneliness one is junk is unwelcome (clicks vs. truth). Telling them the AI one is junk is also unwelcome (futurism sells). The 2008 one is the most robust but perhaps the "boring" one. I will make the Gen Z Loneliness one fail the APC test hard, as that's the most common demographic error.

  6.  **Developing the "Editor's Filter" (The Procedure):**
      *   Make it a 5-step checklist.
      *   Include "Stop and Decide" points for value judgments.

  7.  **Addressing the "Philosophy/Demography" Requirement:**
      *   Explicitly mention HPC (cluster of properties) without getting bogged down.
      *   Explicitly mention APC (Age-Period-Cohort).
      *   Explicitly mention Hacking (Looping).

  8.  **Review against Constraints:**
      *   British English? Yes.
      *   Editor register? Yes.
      *   10-minute usability? Yes, keep it punchy.
      *   Flag judgment calls? Yes, need a specific section for "Where the Math Ends and the Editor Begins".

  9.  **Final Polish:**
      *   Ensure the distinction between "Kind" (real causal cluster) and "Class" (arbitrary grouping) is clear.
      *   Make sure the "unwelcome" result is highlighted.
      *   Check tone: supportive but firm on rigour.

  *(Self-Correction during drafting)*: I need to be careful not to sound like I'm saying "Generations don't exist." The prompt acknowledges sometimes the frame is right. The procedure must allow for *social kinds* that become real through usage (Hacking), not just biological natural kinds. I need to make sure Step 4 (Looping) captures this.

  *(Refining the "Unwelcome" Result)*: The Gen Z Loneliness pitch is the most common. Showing it fails the APC test is the most valuable service I can do, even if it kills a reliable traffic driver. I will frame this as the "hard truth."

  *(Refining the "Judgment" Section)*: I need to be explicit that Step 5 is where the procedure hands back control.

  10. **Final Output Structure:**
      *   Intro: Acknowledge the pain point.
      *   The Procedure: "The Cohort Validity Filter".
      *   The Test Run: Applying to the three pitches.
      *   The Caveats: Where judgment takes over.
      *   Closing: Encouragement.

