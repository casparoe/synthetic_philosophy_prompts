  *(Refining the "Rescue")*: Is there a way to save the photo? Maybe if we view existence as dependent on causal connection. If the causal chain is broken, the effect (Marty) vanishes. This is a "Causal Theory of Existence." It's not standard metaphysics, but it's the film's internal logic.

  *(Refining the "Feel")*: The user suspects film shows the "feel of a fixed past." I should argue the opposite: Film shows the *anxiety* of a mutable past. The logical proofs say the past is fixed (B-series); the film makes us *feel* the A-series (flow and change).

