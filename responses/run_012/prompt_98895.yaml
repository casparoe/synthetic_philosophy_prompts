answer: |-
  The rain had stopped, but the window in Marcus's office was still streaked with it. Elena sat on the edge of the visitor's chair, a notebook balanced on her knee. Marcus was leaning back against his desk, arms crossed, looking at her like she'd just tried to sell him a bridge.

  "You're protecting him," Marcus said. "You know that, don't you?"

  "I'm not protecting anyone. I'm looking at the mechanism."

  "The mechanism failed. Two hundred years of failure. At some point, 'the train is late' becomes 'the train isn't coming.'"

  "It's not late because of a scheduling error," Elena said. "It's late because the tracks changed. That's the point. Malthus described a relationship between population and resources. That relationship is biological. It doesn't just vanish because we found a new battery."

  "So we found a new battery. The Industrial Revolution. The Green Revolution. Global trade. You list these like they're exceptions. I'm saying they're the rule. The theory predicted starvation. We got supermarkets. The theory is wrong."

  "The theory was conditional," Elena said. "It said population grows geometrically, resources arithmetically, *unless* checked. He knew about checks. Moral restraint, vice, misery. He just couldn't conceive of a check that involved burning carbon that had been buried for millions of years. That's not a refutation of the mechanism. That's an exogenous shock."

  Marcus pushed off the desk and started pacing the small rug. "Exogenous shock. See, that's the move. Whenever the prediction misses, you introduce a variable that wasn't in the original model. 'Oh, we didn't account for coal.' Fine. But then you keep doing it. 'We didn't account for the pill.' 'We didn't account for container shipping.' At what point do you admit the model is too porous to hold water?"

  "When the water starts rising again," Elena said. "Look, I'm not saying we're going back to 1800. I'm saying the escape hatches are closing. Fossil fuels aren't infinite. Arable land per capita is dropping. The demographic transition only holds while growth is high. You strip away the cheap energy and the global supply chains, and what do you have left? You have the ratio of mouths to food. And that ratio still bites."

  "But you only see the bite where you've already decided the hatches are closed," Marcus said. He stopped pacing and looked at her. "That's the danger, Elena. It's not that you're wrong about the resources. It's that you've made the claim unfalsifiable. 'Right but early' is the most convenient position in history. There is no deadline. If it happens tomorrow, you're a genius. If it happens in three hundred years, you're a visionary. If it never happens, you just say the hatches held. It's a bet you can't lose."

  "It's not a bet," she said. "It's a structural analysis. I can tell you where it will break. I can point to the aquifers in the Punjab. I can point to the energy return on investment in deepwater oil. These aren't mystic prophecies. They're measurements. If those measurements hold, the mechanism reasserts itself."

  "Ah," Marcus said. "So now the theory isn't 'population presses on subsistence.' The theory is 'population presses on subsistence *unless* technology intervenes.'"

  "Basically."

  "Then the theory isn't about population," Marcus said. "It's about technology. And since you can't predict technology—you just admitted he couldn't conceive of coal—you can't predict the outcome. You've shifted the burden from the variable you claimed to understand to the variable you explicitly say is unknowable."

  Elena tightened her grip on the notebook. "I'm not saying technology is unknowable. I'm saying it's contingent. It's not guaranteed. Malthusians get mocked because they assume technology saves us every time. But what if the innovation rate slows? What if the low-hanging fruit is gone? Then the default state returns. The default state is scarcity."

  "But you only know that's the default state because you're defining away the counter-examples," Marcus said. "Every time humanity dodges the bullet, you say, 'That was a dodge, not a disarmament.' But if we keep dodging for another two hundred years, at what point does the dodge become the reality? If I predict an earthquake and nothing happens for fifty years, I don't get to say 'The tectonic pressure is still there.' I get to say my seismograph is broken."

  "The pressure is still there," Elena said. "Just because you're wearing a helmet doesn't mean gravity stopped working."

  "But if I wear the helmet forever," Marcus said, "then for all practical purposes, gravity isn't the problem anymore. The problem is helmet maintenance. You're obsessed with the falling rock. I'm obsessed with the fact that we keep building better helmets. And you're treating the helmet industry as an anomaly."

  "Because the helmet industry relies on the rock," Elena said. "We burn the rock to make the helmet. Eventually, the rock runs out. That's the Malthusian trap. It's not just food. It's energy. It's inputs."

  "And there it is," Marcus said softly. "You moved the goalposts again. First it was food. Now it's energy. That's the rescue operation. When the food prediction failed, you said 'Okay, energy.' When energy looks abundant, you'll say 'Okay, rare earth metals.' You're retreating into the details. You're making the theory true by definition."

  "I'm refining the scope," she said. "Science refines."

  "Science refines until it breaks," Marcus said. "Look, I want you to be right. God knows, the world needs people thinking about limits. But intellectually? You're asking for a free pass. You want the authority of a scientific law without the risk of falsification. You want to say 'The law holds' even when the data says 'The law is suspended.'"

  "I want to say the law is latent," Elena said. "Like a virus. It lies dormant until the host weakens. Just because I'm healthy today doesn't mean the virus isn't real. It means my immune system is working. But immune systems fail."

  "Okay," Marcus said. He sat down in his chair opposite her. "Let's grant you the virus. Let's grant the mechanism is real and latent. Here's the question. What kills the theory? What would have to happen for you to stand up and say, 'Okay, Malthus was wrong. Not early. Wrong.'?"

  Elena opened her mouth, then closed it. She looked down at her notebook.

  "If population doubles," she said slowly. "And real wages double with it. And energy consumption per capita doubles. And life expectancy goes up. Across the board. Not just in the West. Everywhere. For fifty years."

  "And if that happens," Marcus said, "you'll say?"

  "I'll say the escape hatches are permanent," she said. "I'll say we've decoupled."

  "Decoupled," Marcus repeated. "So the mechanism isn't universal. It's historical."

  "It's conditional."

  "Then it's not a law of nature," Marcus said. "It's a description of a specific technological regime. And if it's just a description of a regime, then saying 'Malthus was right' is misleading. You should say 'Pre-Industrial constraints were real.' But you're saying 'The constraint is coming back.' That implies the mechanism is the rule and the freedom is the exception."

  "Because the freedom *is* the exception," Elena said. "Historically speaking. We've had two hundred years of explosion. We've had ten thousand years of stagnation. The explosion is the anomaly."

  "Fine," Marcus said. "The explosion is the anomaly. But you're living in the anomaly. You're writing a book about the anomaly. You're using the logic of the stagnation to predict the end of the explosion. But you're doing it from inside the explosion. Your tools, your data, your ability to sit here and argue with me—it's all paid for by the thing you say is going to kill us."

  "I know that," Elena said. "That's the irony. It doesn't make it false."

  "No," Marcus said. "It makes it hard to test. You're trying to measure the water while you're swimming in it. My point is just this: 'Right but early' works for everything. Marx was right but early. Keynes was right but early. It's a shield. I'm asking you to put the shield down. If the escape conditions are just 'whatever keeps us alive,' then the theory says nothing. It just says 'Things will be hard until they aren't.'"

  "It says 'Things will be hard when the surplus runs out,'" Elena corrected. "That's a specific claim. It's about surplus. We're living on stored surplus. Carbon capital. Soil capital. When the drawdown ends, the check clears."

  "And if we find new capital?" Marcus asked. "Fusion? Asteroid mining? Efficiency gains you can't model yet?"

  "Then the check bounces," she said. "But you have to assume the new capital arrives in time. That's the faith leap. My position is the skeptical one. I'm assuming the bank closes."

  Marcus rubbed his face. He looked tired. "So here's where we are. You think the mechanism is the default state of the universe, and prosperity is a temporary breach. I think the mechanism is a historical constraint that we've learned to engineer around, and engineering is the default state of humanity."

  "I think engineering is subject to physics," Elena said.

  "I think physics is subject to interpretation," Marcus said. "But look. We're not disagreeing about the data. We're not disagreeing about the aquifers or the carbon. We're disagreeing about what counts as a win."

  "Exactly," Elena said. "For you, a win is the theory surviving the next fifty years. For me, a win is the theory explaining why the next fifty years are hard."

  "No," Marcus said. "For me, a win is knowing whether the theory is actually doing work, or if it's just carrying the weight of its own history. You want to keep the name 'Malthus' because it carries the warning. I want to drop the name because it carries the baggage. If you're right about the limits, you don't need him. You just need the math."

  "I need him because he named the ghost," Elena said. "Even if he got the date wrong."

  Marcus nodded slowly. He picked up a pen and tapped it on the desk. "Okay. Then that's the crux. Is the ghost real, or is it just the shadow of the clock? If we agree the limits are real, does it matter if we call it Malthusian?"

  "It matters," Elena said. "Because if it's Malthusian, it's inevitable. If it's just limits, it's manageable."

  "And there it is," Marcus said. "You want inevitable. I want manageable."

  "I want true."

  "Same thing," Marcus said. "Eventually."

  He put the pen down. The office was quiet again, just the hum of the computer and the traffic outside. Neither of them moved to leave.

  "So," Marcus said. "No deadline."

  "No deadline," Elena said. "Just conditions."

  "Then I can't prove you wrong," Marcus said.

  "No," Elena said. "But you can watch the gauge with me."

  Marcus looked at her, and for the first time, he didn't look like he was trying to win. He just looked worried. "Alright," he said. "Show me the gauge."
