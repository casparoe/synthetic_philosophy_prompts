answer: |-
  ## The Commemorations Review Worksheet

  **Purpose:** To guide the Committee from facts to a recommendation in 50 minutes.
  **Pre-Meeting Homework (Required):** The assigned lead researcher must circulate a 2-page brief 48 hours before the meeting containing: (1) A photo of the object/location, (2) A biography of the namesake, (3) A timeline of the objectionable conduct, (4) A list of who currently objects and why, and (5) A preliminary legal check on deeds/contracts.

  **Voting Rule:** A "Sufficient Answer" requires agreement from at least 6 of the 8 committee members. If you cannot reach 6 votes on a step, you must escalate the decision to the School Board.

  ---

  ### Phase 1: Classification (10 Minutes)
  *Goal: Determine what kind of object this is. This sets the burden of proof.*

  **Q1. Is this object primarily an Honor or a Record?**
  *   **Honor:** Asks the public to esteem, emulate, or celebrate a person (e.g., a school name, a statue on a pedestal).
  *   **Record:** Asks the public to remember that an event happened or a person existed, without necessarily celebrating them (e.g., a grave marker, a historical plaque, a building named for a donor where the name is now just an address).
  *   **Label:** A tag where the namesake is unknown to the public and no ceremony is attached (e.g., a street name no one recognizes).
  *   **Sufficient Answer:** We agree on one category.
      *   *If **Label**:* Go to **Q2**.
      *   *If **Record**:* Go to **Q3**.
      *   *If **Honor**:* Go to **Q3**.

  **Q2. (For Labels Only) Does the name itself cause active harm today?**
  *   *Example:* A street named after a known hate group leader, even if no one knows who he was.
  *   **Sufficient Answer:** Yes/No.
      *   *If **No**:* **STOP. Recommendation: Keep.** (The harm is abstract; the cost of change outweighs the benefit).
      *   *If **Yes**:* Go to **Q7**.

  ---

  ### Phase 2: The Nexus of Harm (15 Minutes)
  *Goal: Determine the relationship between the honor and the wrongdoing.*

  **Q3. Was the objectionable conduct the reason for the honor, or incidental to it?**
  *   **The Point:** The honor exists *because* of the conduct now objected to (e.g., a monument to a general specifically for a battle where atrocities occurred).
  *   **Foundational:** The honor is for something else (e.g., philanthropy), but the ability to give was built directly on the objectionable conduct (e.g., wealth generated by displacement).
  *   **Incidental:** The honor is for something unrelated, and the conduct was a private matter or unrelated to the achievement (e.g., a scientist honored for a vaccine who held bigoted views unrelated to the science).
  *   **Sufficient Answer:** We agree on the category.
      *   *If **The Point**:* Go to **Q7** (Recommendation: Change).
      *   *If **Foundational**:* Go to **Q4**.
      *   *If **Incidental**:* Go to **Q4**.

  **Q4. (For Foundational/Incidental) Does keeping this honor signal current endorsement of the conduct?**
  *   *Test:* If a student asks, "Does the school approve of what this person did?" what is the honest answer?
  *   *Consider Distinction 9 (Presentism):* We are not judging the dead person; we are judging our own current decision to keep their name up.
  *   **Sufficient Answer:** Yes/No.
      *   *If **No** (We can truthfully say we do not endorse it):* **STOP. Recommendation: Keep.**
      *   *If **Yes** (It looks like endorsement):* Go to **Q5**.

  ---

  ### Phase 3: Remediation and Context (15 Minutes)
  *Goal: Determine if we can fix the message without removal.*

  **Q5. Has the community already repudiated this conduct elsewhere?**
  *   *Test:* Is this monument the *last* standing endorsement, or is it surrounded by context (e.g., a museum nearby, a counter-plaque, a curriculum change)?
  *   **Sufficient Answer:** Yes/No.
      *   *If **Yes** (It is already repudiated):* **STOP. Recommendation: Keep as Historical Record.**
      *   *If **No** (This is the last endorsement):* Go to **Q6**.

  **Q6. Can we convert an Honor into a Record?**
  *   *Options (Distinction 7):* Dual naming, adding a contextual plaque, moving the object to a museum/archives, renaming the building but keeping the name on a donor wall.
  *   *Test:* Does this option satisfy the objectors without erasing history?
  *   **Sufficient Answer:** Yes/No.
      *   *If **Yes**:* **STOP. Recommendation: Modify (Specify Plan).**
      *   *If **No**:* Go to **Q7**.

  ---

  ### Phase 4: Authority and Consistency (10 Minutes)
  *Goal: Ensure we have the power to act and aren't creating a double standard.*

  **Q7. Is removal/modification legally or contractually possible?**
  *   *Check:* Deeds, donor contracts, city jurisdiction (for streets).
  *   **Sufficient Answer:** Yes/No.
      *   *If **No**:* **STOP. Escalate to District Lawyer.**
      *   *If **Yes**:* Go to **Q8**.

  **Q8. Does this decision hold up against the whole inventory?**
  *   *Test (Distinction 8):* If we apply this same logic to every other name in the district, do we get a result the community can accept? Who bears the cost (Distinction 10)?
  *   **Sufficient Answer:** Yes/No.
      *   *If **Yes**:* **STOP. Recommendation: Change (Specify Plan).**
      *   *If **No** (We are making an exception or the cost is prohibitive):* **STOP. Escalate to School Board.** (Note: The Board must vote on the value conflict).

  ---

  ## Application to Your Three Cases

  Here is how the procedure runs on the cases you provided. I have applied the logic strictly, as requested.

  ### Case 1: The Middle School (Businessman/Donor/Displacer)
  *   **Q1 (Classification):** **Honor.** A school name is the highest form of institutional esteem. It is not a label; students identify as "Wildcats" (or similar), they wear the name.
  *   **Q3 (Nexus):** **Foundational.** He donated the land and building. His papers show he organized/paid for the campaign to displace the Native community. In the 1880s, land speculation and development were often the direct financial result of displacement. His ability to be a philanthropist was built on the harm. This is not "Incidental."
  *   **Q4 (Endorsement):** **Yes.** Keeping the name signals that the district accepts wealth generated by displacement as a valid foundation for honor. To a Native student walking in today, the name says, "This place exists because your people were removed."
  *   **Q5 (Repudiation):** **No.** There is no counter-narrative currently on the lawn. It is the last unrepudiated endorsement.
  *   **Q6 (Remediation):** **No.** You cannot "contextualize" a school name effectively. A plaque on the lawn does not change the daily usage of the name on report cards, uniforms, and bus sides. Dual naming is confusing for a functioning institution.
  *   **Q7 (Legal):** **Yes.** Schools generally have the right to rename their own facilities, though donor contracts should be checked.
  *   **Q8 (Consistency):** **Yes.** If the district owns other properties bought with tainted money, they would also need review. This is consistent.
  *   **Procedure Result:** **Recommendation: Change.**
  *   **Honest Assessment:** You mentioned you want to keep the name because your family has attended for three generations. The procedure does not care about your family's history; it cares about the *current function* of the name. The procedure identifies this as an active Honor based on Foundational Harm that currently signals Endorsement. Unless you can prove the wealth was *not* tied to the displacement (which the papers seem to contradict), the worksheet forces a recommendation to rename. To keep it, you would have to vote against the procedure's finding at Q4, which requires you to argue that the school *does not* endorse the displacement. Given the daily impact on students, that is a hard argument to sustain.

  ### Case 2: The Street Name (Founder/Vigilante/Unknown)
  *   **Q1 (Classification):** **Label.** You noted no one on the committee could identify him until research was done. It functions as a tag, not a ceremony.
  *   **Q2 (Active Harm):** **Debatable.** The name itself isn't a slur. However, now that the vigilante history is known, does it cause harm?
  *   **Q3 (Nexus):** **The Point.** He was a town founder *and* led a vigilante group. In frontier towns, these were often the same activity (enforcing order through violence).
  *   **Q4 (Endorsement):** **Low.** Because it is a Label (Distinction 3), the "honor" function has worn down. However, the City asked for advice.
  *   **Q6 (Remediation):** **Yes.** Since it is a street, you cannot easily add a plaque. But you can recommend the City treat it as a historical label, not an honor.
  *   **Procedure Result:** **Recommendation: Keep (with advisory note to City).**
  *   **Reasoning:** Because it functions as a Label (Q1), the burden for removal is higher. The harm is abstract to most residents. However, because the vigilante act was likely "The Point" of his local power, the Committee should advise the City that if *any* future renaming occurs, this street should be prioritized. But under this procedure, you do not recommend forced removal for a label unless the name itself is active hate speech.

  ### Case 3: The Hallway Plaque (Founders/Omission)
  *   **Q1 (Classification):** **Record.** It lists founders and pioneer families. It claims to be history.
  *   **Q3 (Nexus):** **Omission.** The wrongdoing is not what is celebrated; it is what is missing. This is the "wrong frame" you suspected.
  *   **Q4 (Endorsement):** **Yes.** By listing only the settlers, the plaque endorses the narrative that the valley had no prior inhabitants.
  *   **Q5 (Repudiation):** **No.** It stands alone.
  *   **Q6 (Remediation):** **Yes.** This is the ideal case for Distinction 7 (Options other than remove). Removing the plaque erases the record of the settlers (which is also history). Keeping it as-is erases the Native presence.
  *   **Procedure Result:** **Recommendation: Modify.** Install a companion plaque or etching immediately adjacent that lists the displaced tribes and acknowledges the omission. The plaque becomes a Record of *both* groups.
  *   **Reasoning:** The procedure catches this at Q6. Removal is unnecessary because the object is a Record, not an Honor. The defect is incompleteness, not veneration of evil.

  ---

  ## Where This Procedure Will Misfire

  You asked for honesty about the failure modes. Here are the three places this worksheet will break down in your 50-minute meeting.

  **1. The Omission Blind Spot (Phase 1)**
  The worksheet relies heavily on Q1 (Honor vs. Record). Omissions fit poorly here. A plaque that omits a genocide is technically a "Record," but it is a *false* record.
  *   **The Risk:** A committee member can argue at Q1, "It's just a record of donors, not an honor," and steer the group toward "Keep" at Q3 because the "Nexus of Harm" question assumes the harm is *present* in the text, not *absent* from it.
  *   **The Fix:** Add a sub-question to Q1: *"Is the record factually complete?"* If No, skip Q3 and go straight to Q6 (Remediation). Do not let them argue Nexus on an omission.

  **2. The Framing Bias (The "Sufficient Answer")**
  You asked if the procedure can be steered by whoever writes the wording. Yes.
  *   **The Risk:** The definition of "Endorsement" in Q4 is subjective. If the Chair defines "Endorsement" as "Active celebration," then passive acceptance doesn't count. If they define it as "Failure to condemn," then almost everything fails.
  *   **The Fix:** You must agree on the definition of "Endorsement" *before* you start Case 1. Write this definition at the top of the worksheet: *"Endorsement means a reasonable student would believe the District approves of the conduct."* Do not let this be voted on case-by-case.

  **3. The Consistency Trap (Q8)**
  Q8 asks if the decision holds up against the whole inventory. This is the hardest question for a lay committee.
  *   **The Risk:** You will not have the whole inventory in front of you. You will guess. You might vote to remove the School Name, only to find out next month that the District's biggest scholarship fund is named for someone worse. This makes the Committee look inconsistent or reactive.
  *   **The Fix:** Add a "Deferral" option to Q8. If the Committee realizes they don't know enough about the rest of the inventory to ensure consistency, they should **Escalate to School Board** with a recommendation to "Pause all renaming until a full inventory audit is complete." This protects you from setting a precedent you can't maintain.

  **Final Advice for the Student Representative:**
  You are the only student at the table. The adults will naturally defer to "community standards" (Distinction 6), which often means "the loudest parents." Your leverage is Distinction 5: *What the thing says to people now.* When the adults argue about the dead man's intent, you must pivot the room to the living student's experience. Use the worksheet to force them to answer Q4 ("Does this look like endorsement to a 12-year-old?"). That is your strongest procedural tool.
