      *(Refining the "Omission" critique)*: The user specifically asked about this. I need to highlight that the "Honor/Record" binary (Distinction 1) is the weak point for omissions. I will add a specific branch for "Silence/Erasure."

      *(Final check on Distinctions)*:
      1. Honor/Record -> Q1.
      2. Wrongdoing Point -> Q3.
