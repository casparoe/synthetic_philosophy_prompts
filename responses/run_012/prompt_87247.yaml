          *   *Result:* Likely Keep as label OR Change if the vigilante act is the *only* thing known now. But Distinction 3 suggests if it's just a label, the "honor" weight is low. However, if the *discovery* of the vigilante past makes it an active honor of violence, it shifts. Let's look at Distinction 5: What does it say now? "We name streets after vigilantes."
          *   *Refinement:* If it's a "label" (Dist 3), the bar for removal is higher because the harm is abstract. But if the City asked for advice, they want clarity.
      *   *Case 3 (Plaque):* Founders listed, displaced omitted.
          *   Q1: Record or Honor? "Listing founders" sounds like Record, but "Pioneer Families" often implies Honor. Let's assume Hybrid.
