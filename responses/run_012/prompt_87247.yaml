          *   *Result:* Do not remove. Add context. This fits the "wrong frame" suspicion the user has.

  6.  **Identifying Failure Modes (Critique):**
      *   *Omission Blindness:* The procedure is built on "Honor vs. Record." Omission fits poorly in "Honor." It needs a specific track for "Incomplete Record."
      *   *Framing Bias:* Whoever writes the "Sufficient Answer" definitions controls the outcome. (e.g., defining "Harm" narrowly).
