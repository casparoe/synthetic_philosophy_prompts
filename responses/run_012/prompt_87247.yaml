      *   *Distinction 6 (Standing):* Who cares/who decides?
      *   *Distinction 7 (Options):* It's not binary.
      *   *Distinction 8 (Consistency):* Does this fit the whole inventory?
      *   *Distinction 9 (Presentism):* Are we judging them or our endorsement?
      *   *Distinction 10 (Cost):* Who pays?

      *   *Drafting the Flow:*
