  ### Stage 1: Brainstorming the Logical Space

  To classify participants by verdicts rather than theoretical allegiance, the branch questions must target specific intuitions about *who* is owed memory, *when* it can be waived, and *what* counts as sufficient remembrance. The eight cases provided cover the necessary dimensions: persistence without subjects (Case 2), waiver/destruction (Case 3, 5, 8), accuracy vs. utility (Case 6), resource allocation (Case 1), and source of obligation (Case 4, 7).

  **Proposed Branch Questions:**
  1.  **Persistence (Case 2):** Does the duty persist when no living subject can be harmed by forgetting?
  2.  **Waiver (Case 3):** Can the direct victims waive the duty to the point of destruction?
  3.  **Value of Forgetting (Case 5):** Is ending commemoration ever *admirable* (not just permissible)?
  4.  **Necessity (Case 5):** If not admirable, is ending commemoration a *failure* (not just permissible)?
  5.  **Accuracy (Case 6):** Does utility (cohesion) excuse factual inaccuracy in memory?
  6.  **Silence (Case 8):** Is a survivor's refusal to speak a wrong to the community?
  7.  **Resources (Case 1):** Do competing welfare needs (youth centre) trump specific memorial forms (marker)?
  8.  **Source (Case 4 & 7):** Does benefit or ancestry create a duty for those not directly wronged?

  **Logical Combinations:**
  With 8 binary questions, there are 256 logical paths. Most will be empty. The tree structure below prunes these by asking questions only where the answer matters for distinguishing the target leaves.

  ---

  ### Stage 2: The Decision Tree

  **Node 1 (Case 2):** A digital archive of survivor testimony is built to persist indefinitely. Within a century, no one alive will be able to identify with anyone in it; no descendant will exist. **Does the obligation to keep it running still bind anyone?**
  *   **Yes:** Go to Node 2.
  *   **No:** Go to Node 3.

  **Node 2 (Case 6):** [If Yes to N1] A community's founding narrative of its own persecution is significantly inaccurate in its details, but it is what holds the community together. **Is this inaccurate memory a defective discharge of whatever is owed?**
  *   **Yes:** Go to Node 8.
  *   **No:** **Leaf A (Memory as Identity).**

  **Node 3 (Case 3):** [If No to N1] A peace agreement trades amnesty for testimony; at the victims' association's own insistence, the testimony is sealed for fifty years and then destroyed. **Is the destruction a wrong?**
  *   **Yes:** Go to Node 4.
  *   **No:** Go to Node 5.

  **Node 4 (Case 5):** [If Yes to N3] A survivors' association votes to end its annual commemoration: the ceremony keeps them in grief and their children no longer attend. **Is this decision a moral failure?**
  *   **Yes:** **Leaf B (Memory as Instrument).**
  *   **No:** **Leaf C (Memory as Duty to Living).**

  **Node 5 (Case 5):** [If No to N3] Regarding the survivors' association ending commemoration: **Is this decision admirable?**
  *   **Yes:** **Leaf D (Forgetting as a Good).**
  *   **No:** Go to Node 6.

  **Node 6 (Case 8):** [If No to N5] A survivor refuses ever to speak publicly about what was done to her, and the community's memory is correspondingly thinner. **Is her silence a wrong?**
  *   **Yes:** Go to Node 7.
  *   **No:** **Leaf E (Memory as Virtue).**

  **Node 7 (Case 1):** [If Yes to N6] A town's only marker of a massacre has weathered into illegibility. Restoring it would consume the annual budget of the youth centre the town also wants. The town instead has schoolchildren read the victims' names aloud once a year. **Has the town done what it owes?**
  *   **Yes:** **Leaf F (Deflationary View).**
  *   **No:** **Leaf G (Civic Friendship).**

  **Node 8 (Case 4 & 7):** [If Yes to N2] Someone born into a settler family, whose own ancestors arrived after the dispossession, asks what he owes towards a wrong he is not descended from but whose benefits he still holds. A man learns that his grandfather commanded a killing unit and decides not to tell his children. **Do these agents owe memory duties to the victims' community specifically?**
  *   **Yes:** **Leaf H (Memory as Debt to Dead).**
  *   **No:** **Leaf A (Memory as Identity).** *(Note: This path merges with Leaf A, see Inseparable Pairs)*.

  ---

  ### Stage 3: Leaf Table

  | Leaf | Label | Thick/Thin Status | Hardest Commitment to Honour |
  | :--- | :--- | :--- | :--- |
  | **A** | **Memory as Identity** | **Required** (Thick) | Must explain why a community is obligated to sustain a self-constituting narrative even when it causes internal grief or excludes outsiders. |
  | **B** | **Memory as Instrument** | **Optional** (Thin/Thick) | Must justify compelling survivors to commemorate against their will solely for the preventive benefit to others. |
  | **C** | **Memory as Duty to Living** | **Optional** (Thin) | Must explain why the duty vanishes completely when the last victim dies, even if the injustice remains unacknowledged. |
  | **D** | **Forgetting as a Good** | **Liability** (Thick is hazardous) | Must identify a clear threshold where memory transitions from a duty to a moral hazard without sliding into denialism. |
  | **E** | **Memory as Virtue** | **Optional** (Agent-relative) | Must provide public criteria for judging memory practices if the duty is reduced to private character excellence. |
  | **F** | **Deflationary View** | **Liability** (Politics only) | Must account for the strong intuitive wrong of erasing a massacre without resorting to moral language. |
  | **G** | **Civic Friendship** | **Required** (Thick) | Must define the boundaries of the "civic" relationship that generates the duty without relying on ancestry or benefit. |
  | **H** | **Memory as Debt to Dead** | **Required** (Thick) | Must specify the mechanism by which the dead retain claims on the living when those claims conflict with the living's welfare. |

  ---

  ### Stage 4: Empty Combinations and Diagnosis

  The tree structure prunes logically inconsistent or theoretically unstable positions. The following combinations of answers do not lead to leaves:

  1.  **N1(Yes) + N2(No) + N8(Yes):** *Identity + Debt to Dead.*
      *   **Diagnosis:** **Incoherence.** If memory is primarily for Identity (N2=No), the settler/grandfather (N8) would only owe a duty if the memory constitutes *their* identity. If they owe it to the *victims' community* specifically (N8=Yes), the ground is Debt, not Identity. One cannot hold that the duty is self-constitutive yet owed to an external party's dead.
  2.  **N1(No) + N3(Yes) + N4(No) + N6(No):** *Duty to Living + Silence Permissible.*
      *   **Diagnosis:** **Unattractiveness.** This position holds that victims cannot waive the duty to remember (N3=Yes) but individual survivors have no duty to speak (N6=No). While logically possible, it renders the collective duty unenforceable and practically empty, a position rarely defended in transitional justice literature.
  3.  **N1(No) + N3(No) + N5(No) + N6(Yes) + N7(No):** *Forgetting Permissible + Silence Wrong + Budget Insufficient.*
      *   **Diagnosis:** **Neglect.** This combination suggests memory is not obligatory (N3=No, N5=No), yet silence is a wrong and budget substitutions are insufficient. This creates a duty without a ground (neither Dead, Living, nor Instrument). It is a "duty for duty's sake" without a beneficiary, which most philosophers reject as mystifying.

  ---

  ### Stage 5: Inseparable Leaves and Distinguishing Cases

  Two leaves in this tree yield identical verdicts on the eight provided cases but represent distinct theoretical commitments.

  **Inseparable Pair:** **Leaf A (Memory as Identity)** and **Leaf H (Memory as Debt to Dead)**.
  *   **Reason:** In this tree, both leaves answer "Yes" to Node 1 (Duty persists without living subjects) and "Yes" to Node 8 (Outsiders/Descendants owe duty). On the provided cases, they agree: the archive must be kept, the marker restored, the truth told.
  *   **Distinguishing Case Needed:** **The Hostile Successor Case.**
      *   *Scenario:* A new regime overtakes the community and explicitly rejects the previous community's identity, wishing to erase its memory.
      *   *Separation:* **Identity** would say the new regime has no duty to remember, as the memory does not constitute *their* identity. **Debt to Dead** would say the duty persists regardless of the new regime's identity, because the debt is owed to the victims, not the self.

  **Inseparable Pair:** **Leaf F (Deflationary View)** and **Leaf E (Memory as Virtue)**.
  *   **Reason:** Both answer "No" to duties binding communities (N1, N3, N6) and "Yes" to budget substitution sufficiency (N7). They both treat memory as non-mandatory.
  *   **Distinguishing Case Needed:** **The State-Sponsored Distortion Case.**
      *   *Scenario:* The state actively propagates a lie about the past that harms no living person but falsifies history.
      *   *Separation:* **Deflationary** would say the state is within its rights (politics/preferences). **Virtue** would say the state is acting viciously, even if no specific duty is violated, because it corrupts the moral character of the citizenry.

  ---

  ### Shape Requirements Check

  1.  **Obligations without subjects (Case 2):** Addressed at **Node 1**. Leaves H and A affirm duty; Leaves B, C, D, E, F, G deny it.
  2.  **Obligatory Forgetting (Cases 3, 5, 8):** Addressed at **Nodes 3, 5, 6**. Leaf D (Forgetting as Good) is the only one that treats forgetting as *admirable*. Leaf B (Instrumental) treats it as a *failure*. Leaf C (Duty to Living) treats it as *permissible* (waivable).
  3.  **Thick vs. Thin Memory:** Explicitly listed in the **Leaf Table**.
      *   *Thick Required:* Identity, Debt to Dead, Civic Friendship.
      *   *Thin/Optional:* Duty to Living, Instrument, Virtue.
      *   *Liability:* Forgetting as Good, Deflationary.

  ### Case Coverage Check

  *   **Case 1:** Node 7.
  *   **Case 2:** Node 1.
  *   **Case 3:** Node 3.
  *   **Case 4:** Node 8.
  *   **Case 5:** Nodes 4 & 5.
  *   **Case 6:** Node 2.
  *   **Case 7:** Node 8.
  *   **Case 8:** Node 6.

  All eight cases are utilized as diagnostic branch points.
