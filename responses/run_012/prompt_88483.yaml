prompt: |-
  I am the secretariat of a standing expert advisory panel at a national food-safety authority. Ten members, roughly ten meetings a year, about forty binary questions annually: approve or refuse a proposed maximum residue limit, permit or reject a novel ingredient, keep or revisit an existing approval. The authority follows our recommendation in the overwhelming majority of cases, and the stakes are asymmetric, since a wrongful approval is slow and costly to reverse while a wrongful refusal blocks a product and invites a legal challenge from the applicant. Questions below a size threshold go to a three-member sub-group. The full panel votes in closed session after discussion, votes are recorded with names attached, every member has read the same staff-prepared dossier, most of the ten were trained in the same two laboratories, and two have co-published with applicants in the past. Our legal office wants a rule it can defend in writing; I have about an hour per question and no statistician on call. Over the past five years, roughly one positive recommendation in eight was reversed when new evidence arrived, while almost none of our refusals was.

  Write me a decision procedure I can run before each vote, grounded in what Condorcet's jury theorem and the work it has generated actually support, rather than in a slogan about the wisdom of crowds. The theorem's conditions — a binary question with a defensible right answer, each member better than even at getting it right, errors independent across members — are never fully met in our room, so the procedure has to be a sequence of tests that identify which condition fails and what follows when it does. In order, it should tell me: whether this is a question on which a majority could be more likely to be right than its typical member, or a question of acceptable risk on which competence is undefined and the vote is only a show of hands; whether to use the full panel or a sub-group, and how that turns on whether our members are better or worse than chance; what to do about independence when everyone has read the same dossier and most of the panel shares a training lineage; how to elicit opinions so the vote approximates independent judgment rather than deference to the two most senior members; how the required threshold should move when the two errors cost different amounts, in terms the legal office will accept; what to do when the panel splits near the middle; and what to do when a majority rejects a conclusion that follows from premises each of which a majority accepted — as happens when our separate votes on whether the pivotal study was reliable and whether the effect it reports is adverse both pass, yet the conclusion that the substance is unsafe fails, because different members defect at different steps. Keep the arithmetic to what I can do on a spreadsheet. Mark the points where the procedure stops and a person must decide, and say plainly what it cannot do.

  Then run it on three cases: the split-premises case above; a 6-4 vote to approve in which the four dissenters are the two most senior members and the two who have published most on the substance in question; and one case where the procedure gives an answer I will not like, since I would prefer it to tell me to vote and take the majority, and I suspect it will not.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Secretariat of a standing expert advisory panel at a national food-safety authority.
      *   **Context:** 10 members, ~10 meetings/year, ~40 binary questions/year (Approve/Refuse). Authority usually follows recommendations. Asymmetric stakes (Wrongful Approval > Wrongful Refusal).
      *   **Process:** Closed session, recorded votes, shared dossier, shared training lineage (correlation risk), some conflicts of interest (co-publication). Sub-groups for small questions.
      *   **Data:** 5-year history: 1/8 positive recommendations reversed later (false positives); almost no refusals reversed (false negatives rare).
      *   **Constraint:** Legal office needs a defensible written rule. 1 hour per question. No statistician. Arithmetic must be spreadsheet-friendly.
      *   **Theoretical Basis:** Condorcet's Jury Theorem (CJT) and its extensions/critiques. *Not* "wisdom of crowds" slogans. Must address CJT conditions (Binary truth, $p > 0.5$, Independence).
      *   **Required Outputs:**
          1.  A step-by-step decision procedure (tests for CJT conditions, handling dependence, thresholds, split premises, etc.).
          2.  Application to three specific cases (Split-premises, 6-4 with senior/conflicted dissenters, one "unpleasant" result).
          3.  Explicit markers where human judgment is needed and what the procedure *cannot* do.

  2.  **Deconstruct Condorcet's Jury Theorem (CJT) for this Context:**
      *   *Standard CJT:* If voters are independent and $p > 0.5$ (competence), majority rule converges to truth as $n \to \infty$.
      *   *Reality Check:*
          *   **Binary Truth:** Food safety isn't always "true/false." It's often "acceptable risk." CJT fails here.
          *   **Competence ($p > 0.5$):** Experts are usually $>0.5$, but shared training/dossiers creates correlation.
          *   **Independence:** This is the biggest breaker. Shared dossier + shared training = high correlation. If one is wrong, many are wrong.
          *   **Asymmetric Costs:** CJT minimizes error rate. It doesn't minimize *cost*. False Positive (Approve unsafe) is costlier than False Negative (Reject safe).
      *   *Extensions:*
          *   *Correlated Votes:* Effective $n$ is smaller than actual $n$.
          *   *Weighted Voting:* If competence varies, weight by $p$.
          *   *Supermajority:* Needed when costs are asymmetric.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Step 1: Truth vs. Value.* Is there a factual answer (e.g., "Is the study reliable?") or a value judgment (e.g., "Is this risk acceptable?")? CJT only applies to facts.
      *   *Step 2: Competence Check.* Are members better than chance? Given the reversal rate (1/8 positives reversed), $p$ is high but not perfect. Refusals are rarely reversed, suggesting high caution.
      *   *Step 3: Independence/Correlation.* Shared dossier/training reduces independence. Need to mitigate groupthink.
      *   *Step 4: Panel Size.* Full vs. Sub-group. CJT says larger $n$ helps if $p > 0.5$ and independent. If correlated, adding more similar experts adds less value.
      *   *Step 5: Voting Threshold.* Asymmetric costs require a supermajority for approval (the risky action).
      *   *Step 6: Discursive Dilemma (Split Premises).* This is the "doctrinal paradox." Majority on premises $\neq$ Majority on conclusion. Need a rule (Premise-based vs. Conclusion-based).
      *   *Step 7: Conflicts/Seniority.* How to handle the specific 6-4 case.

      *Refining the Arithmetic:* Keep it simple. Use the historical reversal rate to estimate $p$. Use a simple correlation adjustment if possible, or just acknowledge it reduces effective $N$.
      *Legal Defensibility:* Needs to be explicit about *why* a threshold is set (cost of error).

  4.  **Developing the Steps (incorporating the prompt's specific requirements):**

      *   *Test 1 (Truth vs. Risk):* Distinguish epistemic (fact) from normative (value).
      *   *Test 2 (Independence):* Address the "shared dossier/training" issue. Procedure: Secret ballots, ordered speaking (junior first).
      *   *Test 3 (Competence):* Use the 1/8 reversal rate. $p \approx 0.875$ for approvals? Wait, that's the positive predictive value, not sensitivity. Let's stick to the prompt's data: 1/8 positives reversed. This implies a False Discovery Rate of 12.5%.
      *   *Test 4 (Threshold):* Asymmetric loss. Approval needs higher bar.
      *   *Test 5 (Sub-groups):* When to use them? Only if independence is maintained or question is minor.
      *   *Test 6 (Discursive Dilemma):* Premise-based procedure is usually more logically consistent, but Conclusion-based is more democratic. For safety, Premise-based is safer (if premises say unsafe, conclusion must be unsafe).
      *   *Test 7 (Deadlock/Split):* What if 5-5? Default to status quo (Refuse).

  5.  **Addressing the "Unpleasant" Case:**
      *   The prompt asks for a case where the procedure says "Don't vote/Decide differently" but the user wants to just take the majority.
      *   *Idea:* A case where the majority wants to approve, but the independence condition is so violated (e.g., all read the same flawed study, no independent expertise) that CJT says the majority vote is meaningless noise. Or where the cost asymmetry demands a supermajority that isn't met. Let's go with the Supermajority/Cost asymmetry case. The majority says Approve (6-4), but the procedure says Refuse because the threshold for Approval (due to high cost of error) is 7 votes.

  6.  **Refining the "Shared Training/Dossier" Issue:**
      *   CJT breaks if correlation $\rho$ is high.
      *   Mitigation: "Delphic" element. Write down views *before* discussion.
      *   If correlation is too high, adding more members from the same lab doesn't help. Sub-groups might be better if they are *diverse*, but here they are homogenous. So, Full Panel is better *only if* independence is elicited properly.

  7.  **Drafting the Content (incorporating legal tone and spreadsheet math):**

      *   *Introduction:* Acknowledge limits. CJT is a model, not a law.
      *   *Step 1: Epistemic vs. Normative.* (The "Truth" Test).
      *   *Step 2: Independence Protocol.* (The "Correlation" Test).
      *   *Step 3: Competence & Panel Size.* (The "p > 0.5" Test).
      *   *Step 4: Asymmetric Thresholds.* (The "Cost" Test).
      *   *Step 5: The Discursive Dilemma.* (Premise vs. Conclusion).
      *   *Step 6: Conflicts & Seniority.*
      *   *Limitations:* What this doesn't solve.

  8.  **Running the Cases:**
      *   *Case 1 (Split Premises):* Apply the Premise-Based Procedure. If majority says Study Reliable + Effect Adverse, then Conclusion MUST be Unsafe, even if majority votes Safe on conclusion.
      *   *Case 2 (6-4 Senior Dissent):* Check independence/COI. If seniors are conflicted, their votes might be biased (lower $p$). If they are just senior, their dissent suggests correlation/clustering.
      *   *Case 3 (Unpleasant):* 6-4 Approve. Procedure requires 7 votes for Approval due to asymmetric cost. Result: Refuse. User hates it.

  9.  **Review against Constraints:**
      *   *One hour per question?* The procedure needs to be quick checklists.
      *   *Spreadsheet arithmetic?* Keep formulas simple (counts, ratios).
      *   *Legal defensibility?* Cite "Precautionary Principle" for asymmetric thresholds. Cite "Logical Consistency" for premise-based voting.
      *   *CJT Grounding?* Explicitly mention $p$, $n$, and $\rho$ (correlation).

  10. **Final Polish:** Ensure the tone is professional, authoritative, yet humble about the math's limits. (Self-Correction: Make sure to explicitly address the "sub-group" rule based on competence/independence).

      *Correction on Sub-groups:* CJT says if $p > 0.5$, bigger $n$ is better. If $p < 0.5$, bigger $n$ is worse (converges to wrong answer). Since experts are $>0.5$, Full Panel is theoretically better *unless* correlation is so high that effective $n$ is small. Given shared training, correlation is high. However, sub-groups reduce $n$. If $p$ is high enough, Full Panel still wins. But for "size threshold" questions, sub-groups save time. The rule should be: Use sub-groups only for low-stakes (low asymmetry) or high-independence topics. For high-stakes, use Full Panel to maximize $n$ despite correlation.

      *Correction on Independence:* The prompt says "everyone read the same dossier." This induces correlation. The procedure must mandate *private* assessment *before* discussion to salvage independence.

      *Correction on Competence:* 1/8 reversals on positives. This means when we say "Yes", we are right 7/8 times. $p \approx 0.875$. Refusals almost never reversed. $p \approx 1.0$ for "No". This is very strong competence.

      *Correction on Threshold:* Since False Positive is costly, we need a higher threshold for "Yes". Simple Majority (5/10) is insufficient if costs are asymmetric.

      *Let's write the response.*
answer: |-
  **MEMORANDUM**

  **TO:** Expert Advisory Panel Secretariat
  **FROM:** Decision Procedure Working Group
  **SUBJECT:** Pre-Vote Decision Procedure (CJT-Based)
  **DATE:** October 26, 2023

  ### PREAMBLE: SCOPE AND LIMITS
  This procedure applies Condorcet's Jury Theorem (CJT) and its modern extensions to our voting context. It is **not** a substitute for expert judgment. It is a sanity check to ensure our voting mechanics do not mathematically guarantee error.

  **What this procedure cannot do:**
  1.  It cannot determine scientific truth; it only aggregates judgment.
  2.  It cannot fix a dossier that is fundamentally flawed (Garbage In, Garbage Out).
  3.  It cannot resolve ethical disagreements about "acceptable risk" (these are not truth-apt).
  4.  It stops at the "Human Judgment Marker" (⚠️). At these points, the Chair or Secretariat must exercise discretion.

  **Arithmetic Note:** All calculations fit a standard spreadsheet. No statistical software is required.

  ---

  ### THE PROCEDURE

  Run these six tests in order before the vote is called. If any test fails, apply the corresponding remedy before proceeding.

  #### TEST 1: THE TRUTH CONDITION (Epistemic vs. Normative)
  **CJT Condition:** There must be a "correct" answer (True/False).
  **Question:** Is this question a matter of fact (e.g., "Is the study methodology sound?") or a matter of policy/value (e.g., "Is this risk level acceptable to the public?")?
  *   **If Fact:** CJT applies. Proceed to Test 2.
  *   **If Value:** CJT does not apply. There is no "right" answer, only a "preferred" one. The vote is a show of hands to gauge consensus, not truth.
      *   **Remedy:** Record the vote as "Consensus Check" rather than "Determination." Do not claim scientific infallibility in the minutes.
      *   **⚠️ Human Judgment:** The Chair must classify the question. If mixed, treat as Value (Test 4 applies).

  #### TEST 2: THE INDEPENDENCE PROTOCOL (Correlation Check)
  **CJT Condition:** Votes must be independent.
  **Risk:** Shared dossier + shared training lineage = High Correlation ($\rho$). If $\rho$ is high, adding more members does not reduce error; it just repeats the same mistake.
  **Procedure:**
  1.  **Pre-Discussion Ballot:** Before oral discussion, every member must submit a private, written vote and a one-sentence rationale.
  2.  **Speaking Order:** Junior members speak first. Senior members and those with prior publications on the substance speak last.
  3.  **Correlation Check:** Compare Pre-Discussion Ballot with Final Vote.
      *   If >80% of members change their vote to match the first two speakers, **Independence Failed**.
      *   **Remedy:** Discard the Final Vote. Re-convene after a "cooling off" period (24 hours) with a request for written rebuttals to the dominant argument.

  #### TEST 3: COMPETENCE AND PANEL SIZE ($p > 0.5$)
  **CJT Condition:** Each member must be more likely to be right than wrong ($p > 0.5$).
  **Data:** Historical reversal rate for Approvals = 12.5% (1 in 8). Implies $p \approx 0.875$ for "Approve" votes. Reversal for Refusals $\approx 0\%$. Implies $p \approx 1.0$ for "Refuse" votes.
  **Rule:** Since $p > 0.5$ is clearly met based on historical performance, the **Full Panel (N=10)** is mathematically superior to a Sub-Group (N=3) for high-stakes questions, *provided* Test 2 (Independence) is met.
  *   **Sub-Group Rule:** Use Sub-Groups only for:
      1.  Low-stakes administrative renewals (Asymmetry low).
      2.  Questions where the Full Panel cannot be convened (Emergency).
      *   *Note:* Do not use Sub-Groups to save time on novel ingredients. The loss in effective $N$ outweighs the time saved given our high $p$.

  #### TEST 4: ASYMMETRIC THRESHOLDS (Cost of Error)
  **CJT Extension:** Standard CJT minimizes error count. It does not minimize *cost*.
  **Context:** Wrongful Approval (False Positive) is costly/slow to reverse. Wrongful Refusal (False Negative) is less costly (applicant can resubmit).
  **Calculation:**
  1.  Let $C_{FP}$ = Cost of False Positive (Approval of unsafe).
  2.  Let $C_{FN}$ = Cost of False Negative (Refusal of safe).
  3.  Legal Office to assign ratio $R = C_{FP} / C_{FN}$. (Recommendation: Set $R = 4$ based on reversal costs and public trust).
  4.  **Required Threshold:** A simple majority (5/10) is insufficient.
      *   **Rule:** To **Approve**, require $\lceil \frac{N}{2} + \frac{N}{2R} \rceil$ votes.
      *   With $N=10, R=4$: Threshold = $5 + 1.25 \rightarrow$ **7 Votes**.
      *   To **Refuse**: Simple Majority (5 Votes) suffices (Status Quo bias).
      *   **⚠️ Human Judgment:** The Legal Office must sign off on the Ratio $R$ annually.

  #### TEST 5: THE DISCURSIVE DILEMMA (Premises vs. Conclusion)
  **Problem:** Majority accepts Premise A (Study Reliable) and Premise B (Effect Adverse), but Majority rejects Conclusion C (Substance Unsafe). (Different members defect at different steps).
  **Rule:** **Premise-Based Procedure.**
  *   If the logical conjunction of accepted premises necessitates a conclusion, the conclusion is determined by the premises, *not* by a direct vote on the conclusion.
  *   **Reasoning:** This preserves logical consistency. A direct vote on the conclusion allows members to ignore their own factual findings to reach a desired outcome.
  *   **Spreadsheet Logic:**
      *   IF (Vote_Premise1 = Pass) AND (Vote_Premise2 = Pass) THEN Outcome = Unsafe.
      *   Ignore Vote_Conclusion if it contradicts this.

  #### TEST 6: CONFLICT AND SENIORITY (Weighting)
  **CJT Extension:** If competence varies, weighted voting outperforms one-person-one-vote.
  **Rule:**
  1.  **Declared Conflict:** Members with co-publications with the applicant in the last 5 years must recuse from voting. They may contribute to discussion only if invited by the Chair to explain technical context.
  2.  **Seniority:** Do not weight by seniority. However, if the two most senior members dissent against a majority of junior members, trigger a **Review Flag**.
      *   **Review Flag:** If Seniors dissent, the "Independence Protocol" (Test 2) is assumed to be at risk (juniors may have deferred). The Secretariat must verify in the minutes that juniors spoke first.

  ---

  ### APPLICATION TO CASES

  #### CASE 1: The Split-Premises Paradox
  **Scenario:** 10 members vote.
  *   Premise 1 (Study Reliable): 7 Yes, 3 No. (Passes)
  *   Premise 2 (Effect Adverse): 6 Yes, 4 No. (Passes)
  *   Conclusion (Substance Unsafe/Refuse): 4 Yes, 6 No. (Fails -> Implies Approve)
  **Logic:** 6 members believe it is unsafe (the intersection of those who voted Yes on P1 and P2). 4 members believe it is safe. The majority on the *conclusion* is an artifact of different members defecting on different premises.
  **Procedure Application:**
  1.  **Test 5 (Discursive Dilemma):** Apply Premise-Based Procedure.
  2.  **Calculation:** Since P1 and P2 both passed majority threshold, the logical consequence is "Unsafe."
  3.  **Decision:** **Refuse.**
  4.  **Minutes:** Record that the recommendation is driven by the logical conjunction of factual premises, overriding the direct conclusion vote.
  5.  **Legal Defense:** "The Panel found as fact that the study was reliable and the effect adverse. A recommendation to approve would contradict the Panel's own factual findings."

  #### CASE 2: The 6-4 Approval with Senior/Conflicted Dissent
  **Scenario:** Vote to Approve is 6-4. The 4 dissenters are the two most senior members and the two who have co-published most on the substance (Note: Prompt says "published most on the substance," implying expertise, but Test 6 says co-publication with *applicant* is conflict. Assuming here they published on the *substance* generally, not necessarily the applicant, but are senior).
  **Procedure Application:**
  1.  **Test 6 (Conflict):** Check if the 2 dissenters published with the *applicant*.
      *   *If Yes:* They should have recused. The valid vote is 6-2. Threshold for Approval (Test 4) is 7. **Result: Refuse.**
      *   *If No (Expertise only):* Proceed to Test 4.
  2.  **Test 4 (Threshold):** Approval requires 7 votes (due to asymmetric cost). Current vote is 6.
  3.  **Test 2 (Independence):** Check Pre-Discussion Ballot. Did the 6 juniors vote "Approve" before the seniors spoke?
      *   *If No (They changed to match discussion):* Independence Failed. **Result: Delay Vote.**
      *   *If Yes:* Independence Held.
  4.  **Decision:** **Refuse.** (6 votes < 7 vote threshold).
  5.  **Rationale:** Even if the majority is competent, the cost of a False Positive requires a supermajority. The dissent of the most experienced members increases the probability that the majority is in the 12.5% error band.

  #### CASE 3: The "Unpleasant" Result (Procedural Veto)
  **Scenario:** A novel ingredient with high public visibility. The dossier is solid. The discussion was lively. The vote is 8-2 to Approve. You (Secretariat) believe the ingredient is safe and want the Panel to approve it to avoid industry backlash.
  **Procedure Application:**
  1.  **Test 1 (Truth):** Is this "Safe/Unsafe" (Fact) or "Acceptable Risk" (Value)?
      *   *Analysis:* Maximum Residue Limits often involve policy choices on risk tolerance. If classified as "Value," CJT does not apply.
      *   *Assumption:* Let's assume it is treated as Fact (Toxicological threshold).
  2.  **Test 2 (Independence):** You notice all 10 members trained in the same two laboratories. The Pre-Discussion Ballot shows 9 members voted "Approve" before discussion.
      *   *Analysis:* Correlation ($\rho$) is extremely high. The "Effective N" is close to 1, not 10. The 8-2 vote is not 10 independent samples; it is essentially 1 sample repeated 10 times.
  3.  **Test 4 (Threshold):** 8 votes exceeds the 7-vote threshold.
  4.  **The Catch (Test 2 Remedy):** Because the Pre-Discussion consensus was 90%+ and training lineage is identical, the **Independence Condition is violated**. CJT guarantees convergence to truth *only if* errors are independent. If the error source is the shared training (e.g., a specific assay method they all learned that is now known to be flawed), they will all be wrong together.
  5.  **Decision:** **Delay / External Review.**
      *   **Procedure Output:** "Independence Protocol Failed. High correlation risk detected. Recommendation cannot be issued until an external expert (outside the two training lineages) reviews the dossier."
  6.  **Why you won't like it:** It blocks a decision you think is correct. It adds time and cost. It implies your experts are "clones."
  7.  **Legal Defense:** "To ensure robustness against systematic bias inherent in shared methodological training, independent verification was required per Advisory Protocol Test 2."

  ---

  ### SUMMARY OF ARITHMETIC FOR SPREADSHEET

  | Metric | Formula / Input | Threshold / Action |
  | :--- | :--- | :--- |
  | **Competence ($p$)** | $1 - (\text{Historical Reversals} / \text{Total Positives})$ | If $< 0.5$, stop (Panel incompetent). |
  | **Approval Threshold** | $\text{ROUNDUP}((N/2) + (N / (2 \times R)), 0)$ | With $N=10, R=4 \rightarrow$ **7 Votes**. |
  | **Refusal Threshold** | $\text{ROUNDUP}(N/2, 0)$ | With $N=10 \rightarrow$ **5 Votes**. |
  | **Correlation Check** | $(\text{Pre-Vote Majority} \% - \text{Post-Vote Majority} \%)$ | If Change $> 20\%$, flag Independence Failure. |
  | **Premise Logic** | $\text{IF}(\text{AND}(P1=\text{Pass}, P2=\text{Pass}), \text{Unsafe}, \text{Safe})$ | Overrides direct Conclusion vote. |

  ### FINAL NOTE TO SECRETARIAT
  This procedure will sometimes prevent you from taking a majority vote when you desperately want to. It will sometimes force a Refusal when the science looks "probably fine." This is the feature, not the bug. The legal office can defend a refusal based on "Insufficient Consensus under Asymmetric Risk" much more easily than they can defend an approval that is later reversed. CJT supports the *process*, not the *outcome*. If the process conditions (Independence, Competence) are not met, the majority vote is mathematically noise. Do not vote on noise.
