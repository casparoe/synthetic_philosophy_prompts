answer: |-
  Hey, glad you reached out because this is actually a really strong line and you are right to worry about the Q&A since this specific mix of people is a minefield if you are not prepared for their particular axes to grind. Your thesis holds up well conceptually, but the danger here is not that your argument is wrong, it is that you might get cornered into defending Hobbes's actual mathematics when your point is about his epistemology, or conversely that you dismiss the mathematics too casually and offend the historian. I am going to walk you through the objections you are most likely to face, starting with the one that could do the most immediate damage if you fumble it, which will come from the historian of mathematics. They are not going to care about your epistemological rescue mission nearly as much as they care about you not misrepresenting the seventeenth-century mathematical landscape, and they will likely ask you something like, if Hobbes's method was supposed to guarantee certainty through construction, why did he consistently fail to produce valid proofs even by the standards of his own contemporaries, and does that not suggest the method itself was flawed rather than just his execution? You need to be careful not to say his math doesn't matter, because for this person it does, so your reply should be that Hobbes conflated the criterion of science with the practice of discovery, meaning he was right that knowledge requires knowing causes through generation, but wrong to think that simply drawing a figure guaranteed you found the right cause, so his error was in assuming infallibility rather than in the definition of science itself. The soft spot here is that Hobbes really did think his specific proofs were valid, so you should concede up front that he was dogmatic about his own results and that this dogmatism blinded him to errors, but maintain that this psychological failure does not invalidate the structural claim that civil philosophy is demonstrable because it is constructed.

  Once you survive that, the philosopher of math is going to press you on whether this constructivism is actually doing any philosophical work or if it is just a metaphor, and they will probably ask whether the sense in which we construct a commonwealth is robust enough to carry the weight of scientific demonstration, since drawing a triangle seems ontologically different than signing a covenant. Your reply needs to lean on the idea of generation, arguing that for Hobbes the key is not the physical act of drawing versus signing but the logical priority of the cause, so just as the geometer defines the generation of the figure to know its properties, the political philosopher defines the generation of the state through the covenant to know its rights and functions. The weak point here is that geometric construction is individual and mental while the commonwealth is collective and historical, so you should concede that the analogy is not perfect and that Hobbes relies on a kind of fictionalism about the person of the state to make it work, but insist that the epistemic status remains the same because in both cases the truth is made rather than found.

  The Hobbes people in the room are the most numerous but probably the least dangerous if you keep your focus tight, though they will try to drag you back into pure political theory by asking whether this epistemological foundation actually solves the problem of obligation, since knowing how a state is made does not necessarily tell me why I must obey it. You should reply that your claim is not that constructivism solves motivation but that it solves the possibility of science, meaning it explains why politics can be a domain of universal truth rather than just prudent opinion, which is a prerequisite for any claim to obligation. You can concede here that this does not guarantee compliance and that Hobbes still needs the sword to enforce the science, but that without the demonstrable structure the sword would be mere tyranny rather than justice, which keeps the focus on your epistemological point rather than getting bogged down in motivational internalism.

  Now I need to tell you about the one question you are praying nobody asks, because this is the one that targets the weak spot in your thesis that you mentioned you have not fully locked down yet, and it is likely to come from someone who has listened to all the above and realized there is a category error at the heart of the analogy. They will ask you that if geometry yields necessary truths because the objects are immutable once constructed, how do you account for the fragility of the commonwealth, which can be dissolved or constructed wrongly, since if politics is truly demonstrative like geometry it should be impossible to get it wrong once the construction is complete. This is dangerous because it highlights the disanalogy between necessary geometric truths and contingent political realities, and if you say they are the same you look naive, but if you say they are different you undermine your thesis. Your best reply is to distinguish between the right of construction and the power of preservation, arguing that the demonstration tells us what a commonwealth is and what rights the sovereign must have to maintain it, but it does not guarantee the matter upon which it works will cooperate, so the science is perfect but the material is recalcitrant. You should concede up front that Hobbes wishes politics were as stable as geometry but admits it is not, and that the value of the geometric model is normative rather than predictive, giving us the standard by which we judge existing states rather than a guarantee of their permanence.

  Overall your thesis is solid but you need to make sure you do not let the historian convince the room that bad math means bad philosophy, so keep repeating that the value is in the criterion of knowledge not the specific proofs, and if you get that hard question about necessity versus contingency do not panic, just admit that Hobbes is trying to raise politics to the level of science even if the subject matter resists, because that tension is actually where the interest of the paper lies. You know this material and you have thought about the stakes, so just breathe through the questions and remember that everyone there wants the argument to work even if they enjoy picking at the seams, and you are ready for this.
