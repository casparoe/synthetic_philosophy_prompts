answer: |-
  The principle you are looking for is **The Common Normative Framework**.

  On this account, welfare is not a raw magnitude floating in the void, like length or mass. It is a status assigned to a state of affairs *within* a life that has a specific structure of valuation. A comparison between Person A and Person B is a genuine question with a truth value only if both persons inhabit a **shared space of reasons**. That is, their experiences must play the same functional role in their respective lives, and those roles must be mutually intelligible. When you say "her pain is worse," you are not just comparing intensities of a quale; you are comparing the *disruption* to a life plan that you recognize as analogous to your own.

  Here is exactly where the line is drawn: **Interpretive Translatability.**
  A comparison is genuine if and only if we can translate the subject's reaction to their state into our own normative language without losing the meaning of "better" or "worse." We can do this for strangers (same biology/culture), for your child self (same narrative arc), and for the stoic vs. dramatist (same underlying valuation, different expression). We cannot do this for the bat, because we cannot conceive of what a bat's life is *for*, and therefore cannot judge how pain frustrates that purpose.

  ### The New Case: The Alien Species
  You ask about two members of a species whose pain system is organized nothing like ours, though comparable among themselves.
  **Verdict:** The comparison between the two aliens is **genuine**. The comparison between a human and an alien is **not genuine**.
  **Implication:** This confirms the principle. The aliens share a Common Normative Framework with each other (their pain functions similarly within their form of life). They do not share one with us. We can rank their pains *for them*, but we cannot rank their pains *against ours*. There is no "super-scale" of suffering that encompasses both humans and aliens. To ask "Who suffers more?" is a category error, like asking "Is this rock more moral than that tree?"

  ### The Verdict You Must Abandon
  My account forces you to abandon your verdict on the **Posthuman Descendant**.

  You said: *"A present human's welfare against that of a posthuman descendant... not genuine... and this one nags me, because I know you can get there from here in small steps."*

  Your nagging intuition is correct; your verdict is wrong. If the transition from human to posthuman occurs via **small steps** that preserve the Common Normative Framework at every stage, then comparability is preserved by transitivity.
  1.  Human-at-time-0 is comparable to Human-at-time-1.
  2.  Human-at-time-1 is comparable to Human-at-time-2.
  3.  ...
  4.  Therefore, Human-at-time-0 is comparable to Posthuman-at-time-N.

  To claim the comparison is "not genuine" at the end of the chain requires positing a magical threshold where a tiny physical change suddenly destroys the shared space of reasons. If the posthuman mind is rebuilt along lines that are *continuous* with ours, they remain within our normative horizon. If they are rebuilt along lines that are *discontinuous* (a sudden rewrite), then they are like the bat. But you specified "small steps." Therefore, you must accept that the comparison **is genuine**. The posthuman's welfare is commensurable with yours, even if their psychology is radically different, because the *bridge of reasons* was never broken, only extended.

  ### The Hedonic Device
  You ask: *"If we built a device that read a single number off any creature's brain, would that make the human/bat comparison genuine, or only make us behave as if it were?"*

  **Verdict:** It would only make us **behave as if it were**.

  **Reasoning:** The device measures a physical correlate (neural firing, chemical concentration), not welfare itself. Welfare is the *value* of that state to the subject. For the comparison to be genuine, the number must represent the *same amount of badness* in both creatures.
  *   In humans, a reading of "50" might mean "severe distraction."
  *   In bats, a reading of "50" might mean "existential threat."

  Unless you have already solved the translation problem (the Common Normative Framework), the number is just a proxy. Adopting the device is a pragmatic decision to *treat* the numbers as comparable for the sake of policy or triage. It creates a convention, not a fact. It solves the coordination problem, but it does not reveal a metaphysical truth about the bat's suffering relative to yours. It makes the comparison *actionable*, not *true*.

  ### Summary of the Account
  1.  **Principle:** Welfare comparisons require a Common Normative Framework (shared space of reasons).
  2.  **Line:** Drawn at the breakdown of Interpretive Translatability.
  3.  **Alien Case:** Intra-species genuine; Inter-species not genuine.
  4.  **Abandonment:** You must abandon the "Not Genuine" verdict for the **Posthuman** case (due to the transitivity of small steps).
  5.  **Device:** Makes the comparison pragmatic, not metaphysical.
