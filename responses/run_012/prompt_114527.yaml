      *   **Rae's Position:** Baselines encode values. "Doing nothing" isn't neutral (omission bias). "Human action" requires modeling preferences (values). Distance metrics rank what matters (mug vs. file). Optimizing a proxy makes unstated assumptions into values (Goodhart's law). Corrigibility is also value-laden.

  3.  **Evaluate the Claims (Move by Move):**
      *   *Move 1 (Sam):* Define impact with no values via baseline (doing nothing/human action).
          *   *Analysis:* Technically, you can define a metric without explicit moral values. However, the *choice* of baseline is normative. "Doing nothing" implies omission is neutral, which is a value judgment.
