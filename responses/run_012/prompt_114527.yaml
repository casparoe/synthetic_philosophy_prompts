      *   *Move 2 (Rae):* Baseline is where values sneak in. "Doing nothing" isn't neutral (kitchen fire). "Human action" requires modeling preferences. Distance metrics rank importance.
          *   *Analysis:* Strong point. Choosing a baseline determines what counts as interference. A metric of "distance" requires a state space metric, which inherently weights features (a moved mug vs. a changed election outcome).
