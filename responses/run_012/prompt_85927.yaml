      *   *Check:* Did I address Burden vs. Standard? Yes, need to make sure that's explicit in the Menu.
      *   *Check:* Is the tone appropriate? Needs to be analytical but accessible for a writer.
      *   *Nuance:* The "New Chronology" (Fomenko et al.) is generally regarded as pseudoscience. I shouldn't validate the math, but I must validate the *philosophical argument* the character is making. The prompt asks about the *principle*, not the historical truth.
      *   *Key Insight:* The Editor's line is a *heuristic*, not a *law*. If treated as a law, it's false. If treated as a rule of thumb, it's defensible. The scene hinges on whether the Editor knows the difference.

  9.  **Final Polish:** Ensure the distinction between "Trivial" (true but useless), "Defensible" (sound reasoning), and "False" (incorrect) is clear for each point. Make sure the advice on the "weak character" is specific. (e.g., The weak character uses the "you can't prove a negative" line).

  *(Self-Correction on the "Author's Counter-Move"):* The prompt asks: "Tell me what precise principle that counter-move amounts to." This is likely an appeal to *Theory-Ladenness of Observation* or *Paradigm Incommensurability*. I need to name that clearly without jargon overload. It's the argument that "evidence" is interpreted through the lens of the existing chronology.

  *(Self-Correction on Symmetry):* The prompt asks: "is the counter-claim... any less so?" This is the crux. The orthodox view claims *continuity*. The revisionist claims *discontinuity*. Actually, the revisionist claims the orthodox view is a *conspiracy of error*. That is the truly extraordinary claim. I need to make sure the Editor has ammo there too.

