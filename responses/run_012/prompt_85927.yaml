prompt: |-
  I am writing a novel whose central figure is the editor of a small historical review, and I have given him a line I am no longer sure I can defend on his behalf. A manuscript has come in from a mathematician: a book-length argument that the events we assign to classical Rome, Greece and Egypt actually took place in the Middle Ages, and that the chronology of antiquity was largely the invention of seventeenth-century scholarship — a tradition, I gather, that goes back to a scholar who held most of the classical texts to have been forged by monks. At dinner afterwards my editor disposes of the whole business with a sentence I have heard in a hundred other mouths: 'Extraordinary claims require extraordinary evidence.' I want to know precisely what he has said, because the weight of the scene depends on whether that sentence settles anything or merely sounds as though it does.

  So lay out for me the distinct claims the sentence could be making — a menu, not a ruling on which one is correct. I am after the difference between a platitude and a principle. Is the requirement about the quantity of evidence or about its kind? Is it a rule governing the burden of proof or the standard of proof, and are those the same thing? Does 'extraordinary' describe the claim in itself, or the claim's relation to everything else we currently accept — in which case the demand is really about the cost of revising a whole interlocking body of theory rather than one proposition? Has the slogan been quietly promoted from an evidential rule into a test of what counts as a science, and does that promotion hold? And is the standard symmetric: if the manuscript's claim is extraordinary, is the counter-claim — that several centuries of documents are forgeries, or that a whole civilisation left no trace — any less so?

  Then give me your verdicts. For each reading, say whether it is trivial, defensible or false, and which of them would genuinely license my editor's dismissal. I should add that the author has an answer ready: our failure to find something, he says, is not proof that it was never there, and the demand for extraordinary evidence is simply how a discipline protects its consensus from disturbance. Tell me what precise principle that counter-move amounts to, and whether it is as empty as I suspect. He needs the strongest version of his own position; I need to know which version is the weak one, so that a less sympathetic character can be made to reach for it. No reading list, please — I want the arguments, not the literature.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A novelist is writing a scene where an editor dismisses a "New Chronology" style manuscript (claiming antiquity is a medieval forgery) using the phrase "Extraordinary claims require extraordinary evidence" (ECREE).
      *   **Goal:** The author wants to know *exactly* what that sentence means in this context to determine if the editor is being wise or dogmatic.
      *   **Specific Tasks:**
          1.  Lay out distinct interpretations/claims of the sentence (a menu, not a ruling).
          2.  Address specific questions: Quantity vs. Kind of evidence? Burden vs. Standard of proof? Intrinsic vs. Relational "extraordinary"? Science demarcation? Symmetry of the standard?
          3.  Provide verdicts on each reading (Trivial, Defensible, False) and whether it licenses the dismissal.
          4.  Analyze the author's counter-move ("absence of evidence isn't evidence of absence" + "consensus protection").
          5.  Identify the strongest version of the author's position and the weakest version (for a less sympathetic character).
          6.  **Constraint:** No reading list. Just arguments.

  2.  **Deconstruct "Extraordinary Claims Require Extraordinary Evidence" (ECREE):**
      *   *Origin:* Often attributed to Laplace or Sagan, but functions as a heuristic in skepticism.
      *   *Core Tension:* Is it a rigorous Bayesian principle or a rhetorical shield?

  3.  **Drafting the Menu of Interpretations (Task 1 & 2):**
      *   *Interpretation A: Quantity.* More evidence needed. (Weak)
      *   *Interpretation B: Quality/Kind.* Evidence must be of a specific, robust type (e.g., physical vs. textual).
      *   *Interpretation C: Bayesian Prior Probability.* The claim contradicts established priors, so the likelihood ratio must be huge to overcome the low prior. (Strongest technical reading).
      *   *Interpretation D: Network Coherence.* The claim disrupts a web of belief (Quine-Duhem). The "cost" of revision is high.
      *   *Interpretation E: Demarcation Criterion.* Used to define "science" vs. "pseudoscience."
      *   *Interpretation F: Symmetry.* Does it apply to the status quo? (The "Null Hypothesis" problem).

  4.  **Evaluating the Interpretations (Task 3):**
      *   *Quantity:* Trivial/False. 1000 weak proofs don't make a strong one. Doesn't license dismissal.
      *   *Quality:* Defensible. If the claim upends physics/history, anecdote won't do. Licenses skepticism, not necessarily dismissal.
      *   *Bayesian:* Defensible. Mathematically sound. Licenses high skepticism, but dismissal depends on the actual evidence provided.
      *   *Network Coherence:* Defensible. Explains *why* resistance exists. Licenses caution, not dismissal.
      *   *Demarcation:* False/Question-begging. Using it to ban inquiry is dogmatic.
      *   *Symmetry:* Crucial point. The status quo *also* makes extraordinary claims (e.g., "all these artifacts are real"). If ECREE isn't symmetric, it's biased.

  5.  **Analyzing the Author's Counter-Move (Task 4):**
      *   *Claim 1:* "Absence of evidence is not evidence of absence."
          *   *Analysis:* Logically true in strict terms, but pragmatically weak. In history/archaeology, expected evidence *not* found is often evidence of absence (Bayesian update).
      *   *Claim 2:* "Demand for extraordinary evidence is how a discipline protects its consensus."
          *   *Analysis:* This is the Sociological/Paradigm Shift argument (Kuhnian). It claims ECREE is a gatekeeping mechanism.
          *   *Verdict:* Partially true (conservatism exists), but cynical if used to excuse lack of proof.
      *   *Strongest Version:* The "Underdetermination of Theory by Data" argument. The current chronology is a *model* that fits the data, but isn't the *only* possible model. The resistance is paradigm inertia.
      *   *Weakest Version:* "You just can't prove a negative." (Logical fallacy in this context). Or "It's a conspiracy of silence."

  6.  **Refining the Argument for the Novelist:**
      *   Need to ensure the distinction between *Burden of Proof* (who must speak) and *Standard of Proof* (how convincing they must be) is clear.
      *   Need to highlight the asymmetry problem. If the orthodox view requires "ordinary" evidence to maintain, but the challenger needs "extraordinary" evidence to disrupt, the system is rigged *unless* the orthodox view already *has* extraordinary evidence.
      *   The Editor's dismissal: If he uses ECREE to say "I won't look at it," that's dogmatic. If he uses it to say "This manuscript doesn't meet the bar," that's methodological.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the depth of the question.
