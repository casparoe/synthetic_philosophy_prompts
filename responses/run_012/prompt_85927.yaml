answer: |-
  Here is a breakdown of the logical architecture behind that sentence, designed to help you calibrate the intelligence of your editor and the resilience of your mathematician.

  ### Part I: The Menu of Meanings

  The sentence "Extraordinary claims require extraordinary evidence" (ECREE) is often used as a monolith, but it fractures into at least four distinct logical claims. Your editor could be invoking any one of them.

  **1. The Quantitative Reading (The Volume Claim)**
  *   **Meaning:** The more surprising the claim, the *more* evidence is needed to support it.
  *   **Mechanism:** A simple tally. If I claim I have a dollar, I need to show one dollar. If I claim I have a billion dollars, I need to show a billion dollars (or a bank statement of equivalent weight).
  *   **Distinction:** This confuses the *magnitude* of the claim with the *probability* of the claim.

  **2. The Qualitative Reading (The Kind Claim)**
  *   **Meaning:** The evidence must be of a more robust *type* than usual.
  *   **Mechanism:** Ordinary claims (e.g., "I had eggs for breakfast") can be supported by testimony. Extraordinary claims (e.g., "I stopped time to cook my eggs") require physical traces, video, or independent corroboration that testimony cannot provide.
  *   **Distinction:** This is about the *reliability of the source*, not the amount of data.

  **3. The Bayesian Reading (The Probability Claim)**
  *   **Meaning:** This is the technical core. A claim is "extraordinary" if it has a very low *prior probability* based on existing knowledge. To make the *posterior probability* (the likelihood it is true after seeing evidence) high, the evidence must be highly unlikely to occur if the claim were false.
  *   **Mechanism:** If your theory contradicts a vast web of established facts (carbon dating, dendrochronology, stratigraphy), the "evidence" you provide must be impossible to explain under the *old* system. If the evidence can be explained by the old system (e.g., "this document looks old" vs. "this document was forged to look old"), it does not shift the probability enough.
  *   **Distinction:** This is not about burden of proof (who speaks first) but *standard of proof* (how convincing the speech must be).

  **4. The Coherence Reading ( The Network Claim)**
  *   **Meaning:** "Extraordinary" describes the claim's relation to the interlocking body of theory.
  *   **Mechanism:** Accepting the mathematician's claim isn't just changing one date; it requires dismantling the causal links between Rome, the fall of Constantinople, the Renaissance, the Islamic Golden Age, etc. The "evidence" required is not just proof of the new date, but a new causal mechanism that explains why the *error* persisted universally without collapse.
  *   **Distinction:** The demand is for a *replacement system*, not just a correction.

  ### Part II: Verdicts on the Readings

  Here is how each reading holds up under pressure, and whether it licenses your editor's dismissal.

  **1. The Quantitative Reading**
  *   **Verdict:** **False.**
  *   **Reasoning:** A mountain of weak evidence (1,000 unreliable witnesses) does not equal one piece of strong evidence (one DNA test). Quantity does not compensate for poor quality.
  *   **Scene Utility:** If your editor relies on this, he is lazy. He is counting pages rather than weighing arguments. This does not license dismissal; it licenses skepticism.

  **2. The Qualitative Reading**
  *   **Verdict:** **Defensible.**
  *   **Reasoning:** Testimony is insufficient for claims that violate physical laws or established historical strata. If the mathematician offers only textual analysis to overturn carbon dating, the editor is right to demand physical evidence.
  *   **Scene Utility:** This licenses the editor's dismissal *of this specific manuscript* if it relies solely on textual reinterpretation. It does not dismiss the *possibility* of the claim, only the *support* offered.

  **3. The Bayesian Reading**
  *   **Verdict:** **Defensible (with caveats).**
  *   **Reasoning:** Mathematically sound. If the prior probability of "all history is wrong" is near zero, the likelihood ratio of the evidence must be near infinity to shift belief.
  *   **Scene Utility:** This licenses dismissal only if the editor has actually calculated the priors. If he uses it as a slogan to avoid looking at the data, he is misusing a statistical principle as a rhetorical shield.

  **4. The Coherence Reading**
  *   **Verdict:** **Defensible.**
  *   **Reasoning:** This is the strongest version. It acknowledges that history is a system. To break the system, you must show how the new system functions better.
  *   **Scene Utility:** This licenses dismissal if the manuscript offers a demolition without a reconstruction. If the mathematician destroys the timeline but offers no explanation for the artifacts that remain, the editor is right to reject it as incomplete.

  ### Part III: The Symmetry Problem

  You asked: *Is the standard symmetric? If the manuscript's claim is extraordinary, is the counter-claim any less so?*

  This is the pivot point of your scene.

  **The Asymmetry Trap:**
  If the editor demands "extraordinary evidence" for the revisionist, but accepts "ordinary evidence" for the status quo, he is rigging the game. This is the **Fallacy of Privileged Hypothesis**.
  *   **The Revisionist Claim:** "Rome existed in the Middle Ages." (Requires overturning established priors).
  *   **The Orthodox Claim:** "Rome existed in Antiquity." (Relies on established priors).

  **The Symmetric View:**
  The orthodox claim *also* makes an extraordinary assertion: it asserts that the thousands of artifacts, texts, and layers of soil are *authentic* and *correctly dated*.
  *   **Editor's Defense:** The orthodoxy *has* already met the burden. The "extraordinary evidence" for the standard timeline was accumulated over three centuries of scholarship. The mathematician is not asking for a trial; he is asking for a retrial. The burden is higher because the case has already been heard.
  *   **Mathematician's Defense:** The "evidence" for the standard timeline is circular. It dates texts based on the chronology it is trying to prove. Therefore, the "extraordinary evidence" for the status quo is illusory.

  **Verdict on Symmetry:**
  The standard *should* be symmetric, but the *burden* shifts. The person disrupting the web of belief bears the burden of showing why the web is wrong. However, if the editor implies the status quo requires *no* evidence because it is "normal," he is wrong. If he implies the status quo has *already provided* the evidence, he is right.

  ### Part IV: The Author's Counter-Move

  The mathematician says: *"Our failure to find something is not proof that it was never there, and the demand for extraordinary evidence is simply how a discipline protects its consensus from disturbance."*

  Here is the precise breakdown of that counter-move.

  **1. "Failure to find something is not proof..."**
  *   **Principle:** *Argument from Ignorance (Ad Ignorantiam).*
  *   **Strength:** **Weak.** In history and archaeology, absence of evidence *is* often evidence of absence, provided the evidence is the *kind* that should have survived. If you claim a massive empire existed but left no coins, no ruins, and no contemporary mentions outside the forged texts, the absence is probative.
  *   **Character Note:** Give this line to a **less sympathetic character** (perhaps a graduate student defending the mathematician). It sounds profound but collapses under scrutiny. It treats history like metaphysics, where things can exist without traces.

  **2. "...demand for extraordinary evidence is how a discipline protects its consensus."**
  *   **Principle:** *Paradigm Inertia (Kuhnian).*
  *   **Strength:** **Strong (Sociologically), Weak (Epistemologically).**
  *   **Analysis:** It is true that disciplines resist change to maintain stability (consensus protection). This is a functional necessity; if every new paper overturned the basics, no work could get done. However, calling it *merely* protection implies the resistance is political rather than evidential.
  *   **The Strong Version:** The mathematician should argue that **evidence is theory-laden**. The "evidence" the editor relies on (carbon dating, stratigraphy) is interpreted *through* the very chronology being challenged. Therefore, the demand for "extraordinary evidence" is a demand for evidence that the current paradigm *defines* as impossible. It is a closed loop.
  *   **The Weak Version:** The mathematician argues that the editors are a **conspiracy** protecting their tenure. This makes him look paranoid.

  ### Summary for the Scene

  **The Editor's Line:**
  If your editor says the line and walks away, he is using ECREE as a **conversation stopper**. This makes him dogmatic.
  If your editor says the line and asks, *"Do you have physical evidence that predates the textual tradition, or are you just re-reading the texts?"* he is using ECREE as a **methodological filter**. This makes him rigorous.

  **The Mathematician's Best Defense:**
  He should not argue about "absence of evidence." He should argue about **circularity**.
  *"You ask for extraordinary evidence. But your definition of 'evidence' assumes the chronology I am questioning. You are asking me to prove the house is haunted using only the ghost's own testimony."*

  **The Mathematician's Weakest Defense:**
  *"You just can't prove a negative."*
  *"You're only saying no because this threatens your funding/tenure."*

  **The Verdict on the Sentence:**
  "Extraordinary claims require extraordinary evidence" is a **heuristic**, not a law.
  *   As a law: **False.** (It can stifle genuine discovery).
  *   As a heuristic: **Defensible.** (It prevents waste of resources on unlikely theories).
  *   Does it license dismissal? **Only if** the evidence provided is ordinary (testimonial/textual) when the claim disrupts physical reality. If the editor dismisses the manuscript *without reading it* based on this sentence, he is guilty of the very dogmatism the mathematician accuses him of. If he dismisses it *after reading* because the evidence is merely textual, he is right.

  **Recommendation:**
  Make the editor's dismissal turn on the **Kind Claim** (Quality), not the Quantity. Let him admit the argument is clever, but note that it relies on re-interpreting documents that the physical record (coins, ruins, ice cores) already anchors. That makes the editor intelligent, not just cynical. It raises the stakes for the mathematician, who must then find a way to break the physical anchor, not just the textual one.
