answer: |-
  You have put your finger on the central tension in the philosophy of history, specifically within the **Structure-Agency Problem**. While there is no single, universally standardized noun (like "Gresham's Law") for this specific historiographical maneuver, there is a precise conceptual vocabulary for it.

  The existing technical term is **Explanatory Asymmetry** (or **Asymmetric Causal Attribution**) within the **Levels of Analysis** framework.

  However, since you asked for the boundaries of the *illegitimate* version versus the *legitimate* one, and existing terms often describe the phenomenon neutrally, I will coin a specific term for the fallacious move you are describing: **Ontological Gerrymandering**.

  Here is the concept, the boundaries, and why the near misses don't fit.

  ### 1. The Concept: Ontological Gerrymandering

  **The Move:** The historian draws the boundary between "Structure" (deterministic forces, systems, inevitabilities) and "Agency" (free choice, individual temperament, ideology) not based on the evidence of the specific event, but based on the moral or political outcome they wish to secure.

  **The Mechanism:** It relies on the **Contrastive Theory of Causation** (which you intuitively identified). Causation is always "C rather than C* caused E rather than E*."
  *   **For Side A:** The historian sets the contrast class against *other possible systems*. (e.g., "Given the capitalist system, the US *had* to expand.") This makes the action look like a **Condition**.
  *   **For Side B:** The historian sets the contrast class against *other possible actions by the same actor*. (e.g., "Stalin *could* have democratized, but chose not to.") This makes the action look like a **Cause**.

  **Why "Gerrymandering"?** In political science, gerrymandering is drawing district boundaries to guarantee a specific electoral outcome regardless of the actual distribution of voters. In **Ontological Gerrymandering**, the historian draws the boundaries of *determinism* and *freedom* to guarantee a specific distribution of *responsibility*, regardless of the actual distribution of evidence.

  ### 2. The Boundaries: Legitimate vs. Illegitimate

  You asked where the edges are. When is it okay to treat one side as structural and the other as agential? It is legitimate only if the asymmetry is **argued**, not **assumed**.

  **Legitimate Explanatory Asymmetry:**
  *   **Evidence-Based Ontology:** The archives show one side was constrained by rigid institutional veto points (structure) while the other side had a unitary decision-maker (agency). (e.g., Explaining the US delay in recognizing the USSR via Congressional politics vs. Stalin's personal decree).
  *   **Explicit Scale Shift:** The historian explicitly states, "At the macro-level, the security dilemma drove both; at the micro-level of the 1948 Berlin Crisis, Truman's specific calculation mattered more than Stalin's." The shift in lens is announced.
  *   **Symmetry Test:** If you swapped the flags in the text, would the *type* of explanation still make sense given the evidence? If the explanation relies on "American Democracy" vs. "Soviet Totalitarianism," the historian must prove that the former structurally constrains agency while the latter amplifies it, using data, not labels.

  **Illegitimate Ontological Gerrymandering:**
  *   **The Silent Switch:** The text moves from Chapter 3 (Systemic pressures forced the US) to Chapter 4 (Stalin's paranoia caused the split) without acknowledging that the *mode of explanation* has changed from sociological to psychological.
  *   **Responsibility Laundering:** Structure is invoked exclusively to *excuse* one side's aggressive moves ("They were trapped by the security dilemma"), while Agency is invoked exclusively to *condemn* the other side's reactive moves ("They chose to escalate").
  *   **Inconsistent Contrast Classes:** As you noted, the "caused as opposed to what?" question is rigged. Side A is compared to a hypothetical utopia (making them look bad), Side B is compared to historical inevitability (making them look neutral).

  ### 3. Why the "Near Misses" Don't Fit

  You correctly sensed that standard labels are too blunt. Here is why they fail to capture the specific geometry of this move:

  **Fundamental Attribution Error (Social Psychology)**
  *   *The Fit:* This is the cognitive bias where we attribute our own behavior to situations (structure) and others' behavior to character (agency).
  *   *The Miss:* This is a *heuristic* error in immediate social perception. Historiography is a constructed argument, not a cognitive reflex. A historian can commit Ontological Gerrymandering while fully aware of the FAE. It is a rhetorical strategy, not necessarily a psychological blind spot.

  **Special Pleading (Logic/Ethics)**
  *   *The Fit:* Applying different rules to similar cases.
  *   *The Miss:* Special pleading usually applies to *normative* rules (e.g., "I should be allowed to do X, but you shouldn't"). Ontological Gerrymandering is *metaphysical* before it is normative. It changes the nature of reality (determined vs. free) before it assigns blame. It's deeper than a rule exception; it's a category error.

  **Whataboutism (Rhetoric)**
  *   *The Fit:* Deflecting criticism by pointing to the other side.
  *   *The Miss:* As you noted, Whataboutism changes the subject ("You say I killed, but what about your war?"). Ontological Gerrymandering keeps the subject exactly the same ("We didn't *kill*, we were *forced by economics*; they *killed* because they *chose*"). It absorbs the event but changes its causal texture.

  **Cause vs. Condition (Philosophy of Causation)**
  *   *The Fit:* Distinguishing between the spark (cause) and the powder keg (condition).
  *   *The Miss:* You can legitimately argue one side was the spark and the other the keg. The fraud occurs when the historian argues Side A was *only* a condition (passive) and Side B was *only* a cause (active), when evidence suggests both were interacting sparks and kegs. It is the *refusal to acknowledge reciprocity* that defines the error.

  ### 4. The Ethical Stakes (For an Ethics Teacher)

  Since you teach ethics, the reason this bugs you is that **Causation is the proxy for Responsibility.**

  In history, to say an event was "structural" is to say the actors could not have done otherwise. If they could not have done otherwise, they cannot be held morally responsible. To say an event was "agential" is to say they could have done otherwise, opening them to blame.

  **Ontological Gerrymandering is therefore a method of laundering moral responsibility through metaphysics.** It allows a historian to conclude "No one is to blame" (structuralism) for their side, while concluding "They are to blame" (voluntarism) for the other side, all while maintaining the posture of objective social science.

  ### Summary

  *   **Technical Term:** Explanatory Asymmetry / Levels of Analysis Inconsistency.
  *   **Coinage for the Fallacy:** Ontological Gerrymandering.
  *   **The Boundary:** Is the shift in causal mode (structure vs. agency) justified by *evidence* and *explicitly argued*, or is it silently deployed to allocate *blame*?
  *   **The Test:** Apply the "Contrast Class" check. Are we asking "Could Side A have done otherwise?" and "Could Side B have done otherwise?" with the same rigor?

  You aren't missing a vocabulary word; you are identifying a violation of **Causal Consistency**. The historians you are reading are engaging in a form of **Modal Realism** where the "possible worlds" available to the US are different from the "possible worlds" available to the USSR, without proving why the laws of physics (or politics) should differ across the Iron Curtain.
