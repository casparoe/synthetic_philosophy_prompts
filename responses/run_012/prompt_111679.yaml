answer: |-
  **Graduate Seminar: Bayesian Epistemology**
  **Take-Home Assessment: Probability Kinematics and Order Dependence**

  **Time Allowed:** 45 Minutes (suggested working time)
  **Word Limit:** None (but conciseness is valued)
  **Total Marks:** 20

  **Question 1**

  Consider an agent whose initial credence function $P_0$ is defined over the partition generated by propositions $A$ and $B$ as follows:

  *   $P_0(A \land B) = 0.2$
  *   $P_0(A \land \neg B) = 0.1$
  *   $P_0(\neg A \land B) = 0.3$
  *   $P_0(\neg A \land \neg B) = 0.4$

  The agent subsequently receives two distinct pieces of uncertain evidence. The first bears on $A$, shifting her marginal credence in $A$ to $0.9$. The second bears on $B$, shifting her marginal credence in $B$ to $0.9$. In both instances, the agent employs Jeffrey Conditionalisation (probability kinematics) rather than strict conditionalisation, as neither proposition becomes certain.

  (a) Calculate the final joint probability distribution if the agent processes the evidence for $A$ first, followed by the evidence for $B$.
  (b) Calculate the final joint probability distribution if the agent processes the evidence for $B$ first, followed by the evidence for $A$.
  (c) Compare the two resulting distributions. Explain precisely why they diverge, making reference to the rigidity condition inherent in Jeffrey Conditionalisation. Contrast this with the commutativity of strict conditionalisation.
  (d) Evaluate whether this order dependence constitutes a fatal defect in Jeffrey Conditionalisation as a norm for rational belief revision, or whether it reveals a necessary underdetermination in the description of uncertain evidence.

  ***

  **Model Answer**

  **(a) Order: A then B**
  First, update on $A$ to $P_1(A)=0.9$. Jeffrey Conditionalisation preserves conditional probabilities on the partition $\{A, \neg A\}$.
  $P_0(B|A) = 0.2/0.3 = 2/3$. $P_0(B|\neg A) = 0.3/0.7 = 3/7$.
  $P_1(A \land B) = 0.9 \times (2/3) = 0.6$.
  $P_1(A \land \neg B) = 0.9 \times (1/3) = 0.3$.
  $P_1(\neg A \land B) = 0.1 \times (3/7) \approx 0.043$.
  $P_1(\neg A \land \neg B) = 0.1 \times (4/7) \approx 0.057$.

  Next, update on $B$ to $P_2(B)=0.9$. We preserve conditionals on $\{B, \neg B\}$ relative to $P_1$.
  $P_1(A|B) = 0.6 / (0.6 + 0.043) = 14/15$.
  $P_1(A|\neg B) = 0.3 / (0.3 + 0.057) = 21/25$.
  $P_2(A \land B) = 0.9 \times (14/15) = 0.84$.
  $P_2(\neg A \land B) = 0.9 \times (1/15) = 0.06$.
  $P_2(A \land \neg B) = 0.1 \times (21/25) = 0.084$.
  $P_2(\neg A \land \neg B) = 0.1 \times (4/25) = 0.016$.
  Note that $P_2(A) = 0.924$; the earlier constraint on $A$ has drifted.

  **(b) Order: B then A**
  First, update on $B$ to $P_1'(B)=0.9$.
  $P_0(A|B) = 0.2/0.5 = 0.4$. $P_0(A|\neg B) = 0.1/0.5 = 0.2$.
  $P_1'(A \land B) = 0.9 \times 0.4 = 0.36$.
  $P_1'(\neg A \land B) = 0.9 \times 0.6 = 0.54$.
  $P_1'(A \land \neg B) = 0.1 \times 0.2 = 0.02$.
  $P_1'(\neg A \land \neg B) = 0.1 \times 0.8 = 0.08$.

  Next, update on $A$ to $P_2'(A)=0.9$. Preserve conditionals on $\{A, \neg A\}$ relative to $P_1'$.
  $P_1'(B|A) = 0.36 / 0.38 = 18/19$.
  $P_1'(B|\neg A) = 0.54 / 0.62 = 27/31$.
  $P_2'(A \land B) = 0.9 \times (18/19) \approx 0.853$.
  $P_2'(A \land \neg B) = 0.9 \times (1/19) \approx 0.047$.
  $P_2'(\neg A \land B) = 0.1 \times (27/31) \approx 0.087$.
  $P_2'(\neg A \land \neg B) = 0.1 \times (4/31) \approx 0.013$.
  Here, $P_2'(B) \approx 0.94$; the constraint on $B$ has drifted.

  **(c) Comparison and Explanation**
  The final joint distributions differ (e.g., $P_2(A \land B) = 0.84$ vs $P_2'(A \land B) \approx 0.853$). This occurs because Jeffrey Conditionalisation relies on a rigidity condition: $P_{new}(H|E_i) = P_{old}(H|E_i)$. In sequential updates, the 'old' distribution for the second step is the output of the first. Since updating on $A$ alters the conditional probabilities relevant to $B$ (and vice versa), the rigidity constraint applies to different values depending on the order.

  In strict conditionalisation, order is irrelevant because updating on $E_1$ then $E_2$ yields $P(H|E_1 \land E_2)$, which is commutative. Certainties fix the truth of propositions; uncertain evidence only fixes marginals, leaving the joint structure malleable.

  **(d) Evaluation**
  This discrepancy is not necessarily a defect, but rather exposes that specifying only marginal constraints underdetermines the joint distribution. A single simultaneous Jeffrey update on the four-cell partition requires more information than just the two target marginals; it requires a constraint on the dependence relation (e.g., preserving odds ratios or maximum entropy). Sequential application implicitly imposes a specific dependence structure based on the sequence. A defender of the rule should argue that uncertain evidence is inherently context-sensitive: the impact of evidence for $B$ logically depends on the current epistemic state regarding $A$. Thus, the 'correct' order depends on the temporal or causal order of the evidence acquisition, not merely the logical content. Abandoning the rule is unnecessary, but we must recognise that uncertain evidence requires richer structural description than certain evidence.

  ***

  **Marking Scheme (20 Marks)**

  **1. Calculation: Order A then B (5 marks)**
  *   **5:** Correct application of rigidity condition for both steps. Final distribution sums to 1. Correct identification that $P(A)$ drifts in step 2.
  *   **3:** Arithmetic errors but correct method (e.g., wrong conditional probabilities calculated from $P_0$).
  *   **0:** Uses strict conditionalisation formula or fails to renormalise.
  *   *Common Error:* Students often preserve $P_0$ conditionals for the second step rather than $P_1$ conditionals.

  **2. Calculation: Order B then A (5 marks)**
  *   **5:** Correct application of rigidity condition. Final distribution sums to 1. Correct identification that $P(B)$ drifts in step 2.
  *   **3:** Arithmetic errors but correct method.
  *   **0:** Assumes symmetry with Part (a) and copies figures.
  *   *Common Error:* Assuming the final marginals must remain 0.9 for both variables (they do not).

  **3. Identification of Discrepancy and Rigidity (4 marks)**
  *   **4:** Clearly states distributions differ. Explicitly links divergence to the rigidity condition applying to different intermediate priors.
  *   **2:** Notes they differ but offers vague explanation (e.g., "maths is different").
  *   **0:** Claims they should be the same.
  *   *Common Error:* Blaming rounding error rather than structural divergence.

  **4. Contrast with Strict Conditionalisation (3 marks)**
  *   **3:** Correctly explains commutativity of intersection in strict conditionalisation ($P(H|E_1 \land E_2)$).
  *   **1:** Mentions strict conditionalisation is different but no technical reason given.
  *   **0:** No mention.
  *   *Common Error:* Claiming strict conditionalisation also suffers from order dependence.

  **5. Philosophical Evaluation (3 marks)**
  *   **3:** Identifies underdetermination of the joint distribution given only marginals. Argues sequence implies structural assumptions (or defends context-sensitivity).
  *   **1:** Simple verdict ("it is a bug" or "it is fine") without justification.
  *   **0:** Irrelevant or contradictory.
  *   *Common Error:* Suggesting we should average the two results (no theoretical basis).

  **Total: 20 Marks**

  **First-Class Boundary:** To achieve 16+, the candidate must accurately perform the arithmetic *and* articulate in Part (d) that the marginal constraints alone do not fix the joint distribution, identifying the hidden assumption in sequential updating. Mere calculation without the insight into underdetermination caps the mark at 14.
