      *   **Core Idea:** "Moral compromise" as "gains from trade" without a common currency of value. Uses logrolling across separable issues to avoid interpersonal utility comparisons. Calls it a "compromise frontier" (thinner than contractarianism, thicker than modus vivendi).
      *   **Toy Case:** Vegan vs. Hunter flatmates. Hunter hunts, funds vegan's animal welfare cause. Neither ranks outcomes on a common scale.
      *   **Audience:** Political Theory Reading Group.
          *   ~7 Rawlsians/Contractualists (allergic to preference aggregation, care about legitimacy/public reason, distinguish modus vivendi vs. overlapping consensus).
          *   ~2 Econ/Social Choice theorists (care about formalism, separability, numeraires, Sen's impossibility theorems).
      *   **Goal:** A prep sheet for Q&A survival.
      *   **Requirements:**
          *   Objections ordered by (Likelihood $\times$ Damage).
          *   Phrased in the specific voice of the objector (Rawlsian vs. Econ).
          *   Two-minute reply for each.
          *   Honest note on where the reply is soft.
          *   Advice on what to concede.
          *   The "One Question I'm secretly hoping nobody asks."
          *   Critique the toy example (Vegan/Hunter) honestly.
          *   No reading lists/citations (user knows the lit).
          *   Tone: Direct, sharp, not polite, intellectually rigorous.

  2.  **Deconstruct the Core Argument:**
      *   *Claim:* You can have Pareto improvements without interpersonal utility comparison (IUC) if trades are across separable issues (logrolling).
      *   *Mechanism:* Agent A cares about Issue X, Agent B cares about Issue Y. A yields on Y, B yields on X. Both feel better off according to their *own* ordinal rankings.
      *   *Problem:* This looks suspiciously like a *modus vivendi* (stable equilibrium based on power/circumstance) rather than a normative justification for compromise.
      *   *Problem:* Separability is a massive assumption. Preferences often interact (lexicographical, expressive, integrity-based).
      *   *Problem:* Social Choice theory (Sen) says Liberalism + Pareto is impossible under certain conditions.
      *   *Problem:* Rawlsians care about *justification*, not just *outcome stability*.

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1: The Modus Vivendi Charge (Rawlsian).*
          *   *Why:* This is the most obvious political theory critique. If it's just a deal based on contingent preferences, it's not moral.
          *   *Voice:* "Is this stable if power shifts? Is it legitimate?"
          *   *Reply:* It's a "frontier," not just a point. It creates a zone of cooperation.
          *   *Soft Spot:* It doesn't solve the stability problem if the hunter gets stronger.

      *   *Objection 2: Separability/Integrity (Econ/Phil).*
          *   *Why:* The vegan might view funding hunting as complicity. The issues aren't separable.
          *   *Voice:* "Preferences aren't additive. Integrity constraints."
          *   *Reply:* Assume separability for the model.
          *   *Soft Spot:* Real moral agents hate logrolling on core values.

      *   *Objection 3: Sen's Liberal Paradox (Econ).*
          *   *Why:* If everyone has a "personal sphere" (liberalism) and we respect Pareto, we get cycles/impossibility.
          *   *Voice:* "You're reinventing the Liberal Paradox without the math."
          *   *Reply:* I'm restricting the domain to separable issues.
          *   *Soft Spot:* Domain restriction is doing all the heavy lifting.

      *   *Objection 4: The Numeraire/Currency Issue (Econ).*
          *   *Why:* How do you know the trade is equal? Why not hunt more?
          *   *Voice:* "Without a numeraire, the settlement point is indeterminate."
          *   *Reply:* Bargaining range, not a point.
          *   *Soft Spot:* Indeterminacy makes it useless for policy.

      *   *Objection 5: Public Reason/Justification (Rawlsian).*
          *   *Why:* Why should I accept this deal?
          *   *Voice:* "Reasonable rejection."
          *   *Reply:* Mutual benefit is a public reason.
          *   *Soft Spot:* Instrumental benefit isn't moral justification.

  4.  **Selecting and Ordering:**
      *   *High Damage/High Likelihood:* Modus Vivendi (Rawlsian) and Separability/Integrity (Both).
      *   *High Damage/Med Likelihood:* Sen's Liberal Paradox (Econ).
      *   *Med Damage/High Likelihood:* Indeterminacy (Econ).
      *   *The "Secret Fear":* "Why isn't this just bargaining power?"

  5.  **Refining the Toy Example:**
      *   The Vegan/Hunter case is actually weak. Why? Because for many vegans, *funding* hunting (via meat purchases or even cohabitation that normalizes it) is morally tainted. It violates the "separability" condition immediately. It smells like "blood money." I need to tell the user this.

  6.  **Drafting the Content (incorporating the "Rationalist" tone):**
