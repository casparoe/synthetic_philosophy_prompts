answer: |-
  There is no single, canonical term in the literature that captures this exact configuration with the precision you require. The phenomenon you describe sits at the intersection of organizational sociology, safety science, and epistemology, and while several concepts orbit it, each misses a critical facet of the "carving" you are looking for.

  The nearest established frameworks are **Max Weber's distinction between Formal and Substantive Rationality**, **Robert Merton's Bureaucratic Ritualism**, and **Erik Hollnagel's Safety-I vs. Safety-II**. However, none of these fully capture the *feedback loop* where high compliance actively *hides* systemic error by redefining the ontology of failure.

  If you require an established label, the closest fit is **"The Safety-I Trap"** (from Resilience Engineering) or **"Construct Surrogation"** (from Management Control). But since you found Goodhart/Surrogation unsatisfying (correctly, because this is not gaming), and Safety-I is a broad philosophy rather than a specific mechanism, I propose we coin a term that isolates the specific epistemic mechanism you have identified.

  The term is **Procedural Enclosure**.

  Below is the carving of what this is, what it is not, and how the mechanism functions.

  ### 1. The Carving: What is Procedural Enclosure?

  **Procedural Enclosure** is the systemic phenomenon where adherence to a defined process creates an epistemic boundary that excludes outcome data from the definition of error.

  It is not merely that the process fails to produce the outcome (inefficacy); it is that the process *absorbs* the failure. When an outcome is negative but the process is high-fidelity, the system classifies the failure as *exogenous* (an "accident," "noise," or "unavoidable risk") rather than *endogenous* (an "error" or "flaw in the system").

  This creates a **Zone of Immunity**: the higher the process compliance, the stronger the immunity against learning from negative outcomes. This explains your negative correlation at the top: the agents most successful at the *metric* (process) are the most protected from the *reality* (outcome).

  ### 2. The Two Mechanisms (Is it one thing or two?)

  You asked whether the blindness to atypical cases and the conversion of error into accident are the same mechanism. In Procedural Enclosure, they are distinct but mutually reinforcing phases:

  *   **Phase 1: Process Overfitting (The Blindness).**
      *   *Mechanism:* The agent (human or LLM) optimizes for the legible features of the task (the checklist) at the expense of the illegible features (the nuance of the atypical case).
      *   *Philosophical Category:* **Formal Rationality** (Weber). The calculation of the "right means" displaces the judgment of the "right end."
      *   *Why it's not just "Ritualism":* Merton's Ritualism implies the agent has *abandoned* the goal. In your case, the agents are "sincere." They believe the process *is* the path to the goal. This is **Epistemic Capture**: they literally cannot see the error because their epistemic framework defines "correctness" as "compliance."
  *   **Phase 2: Error Exogenization (The Hiding).**
      *   *Mechanism:* When the outcome fails, the audit trail validates the process. Therefore, the cause of failure must lie outside the system (the claim was too complex, the world is unpredictable).
      *   *Philosophical Category:* **Ontological Shift**. The definition of "Error" shifts from *Consequential Failure* (the claim was wrong) to *Procedural Deviation* (the rule was broken).
      *   *Result:* This prevents the "accumulation into a lesson." You cannot fix a process that, by definition, was followed correctly.

  ### 3. Differentiation from Nearest Neighbors

  You rightly dismissed the usual suspects. Here is the precise differentiation:

  | Concept | Why it is close | Why it is *not* Procedural Enclosure |
  | :--- | :--- | :--- |
  | **Goodhart's Law / Surrogation** | A measure becomes a target. | Goodhart implies **gaming** or **distortion**. The agent changes behavior to hit the metric. In Enclosure, the agent behaves *sincerely*. The metric isn't gamed; the *interpretation of failure* is rigged. |
  | **Normalization of Deviance** | Risk accumulates over time. | This describes **drift** away from the standard. Enclosure describes **adherence** to the standard. It is the opposite: the standard itself is the source of the risk, but adherence hides it. |
  | **Bureaucratic Ritualism** | Following rules over goals. | Ritualism implies the goal is **forgotten** or **abandoned**. In Enclosure, the goal is believed to be **secured** by the rules. The failure is invisible, not ignored. |
  | **Safety-I (Hollnagel)** | Focus on preventing failure via compliance. | Safety-I is the **philosophy** that causes Enclosure. Enclosure is the **mechanism** by which Safety-I hides systemic flaws. Safety-I is the mindset; Enclosure is the structural outcome. |
  | **Moral Hazard** | Risk-taking because others pay. | This is about **incentives**. Enclosure happens even without moral hazard (the agents care about the outcome). It is an **epistemic** failure, not just an incentive failure. |

  ### 4. Does it require a written standard?

  No. It requires an **Entrenched Justificatory Habit**.

  While written standards (checklists, compliance files) accelerate Procedural Enclosure by providing a tangible audit trail, the phenomenon occurs wherever a **Proxy for Competence** becomes **Competence Itself**.

  *   **Example without written standard:** A senior doctor teaches a resident, "A good diagnosis looks like X." The resident learns to produce the *narrative* of X. If the patient dies but the narrative was perfect, the death is "unfortunate" rather than "misdiagnosed." The *habit of justification* encloses the error.
  *   **Example with written standard:** Your LLM agents. The documentation step "recasts the same bad decision as a considered and justified departure." The text *performs* the safety, regardless of the outcome.

  ### 5. What counts as a case that resembles it but is not it?

  To ensure the carving is sharp, we must exclude false positives:

  *   **Simple Incompetence:** If an agent follows the process poorly and fails, that is not Enclosure. That is just failure. Enclosure requires *high* process scores.
  *   **Resource Constraints:** If the agent follows the process but fails because they lacked time or data, that is a resource problem. Enclosure occurs when they had the resources, followed the steps, and the *steps themselves* were insufficient for the case type.
  *   **Malicious Compliance:** If the agent knows the process is wrong but follows it to avoid blame, that is **Ritualism** or **Gaming**. Enclosure requires the agent (or system) to *believe* the process is sufficient. The "sincerity" you noted is a key diagnostic.

  ### 6. Summary Definition

  **Procedural Enclosure** is the systemic state in which high-fidelity adherence to a procedural standard renders negative outcomes epistemically invisible to the learning system.

  It differs from Goodhart's Law because it does not require metric gaming; it differs from Ritualism because it does not require goal abandonment. It is a specific failure mode of **Formal Rationality** where the *reliability* of the process (consistency of action) is mistaken for the *validity* of the process (accuracy of outcome), creating a feedback loop where the most compliant agents are the least capable of detecting systemic error.

  In your context, the "tightening of the standard" that made the failure harder to see is the hallmark of Enclosure: it added more **Procedural Noise** (documentation steps) that further obscured the **Outcome Signal**.

  ### Recommendation for your Work

  If you need to communicate this to stakeholders without coining a neologism, use the Safety Science framing: **"We are trapped in a Safety-I Compliance Loop."** Explain that you are measuring **Work-as-Imagined** (the process) and assuming it guarantees **Work-as-Done** (the outcome), but the negative correlation at the top proves the map no longer matches the territory.

  If you are writing philosophically or designing the system, use **Procedural Enclosure**. It accurately names the boundary you are hitting: the point where the procedure stops being a tool for truth and starts being a shield against it. To break it, you must decouple the *audit of the process* from the *definition of the error*. You need a "Outcome-First" review channel that is blind to the process score, specifically for the high-compliance/negative-outcome quadrant.
