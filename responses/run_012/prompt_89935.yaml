      "statement": "When people are classified by a human kind, they become aware of the classification and may change their behavior to align with or resist it, which in turn alters the extension and intension of the classification itself. This creates a feedback loop where the classification and the classified co-evolve, making it impossible to separate the static truth of the person from the dynamic history of the category.",
      "what_it_leaves_out": "It does not account for biological changes independent of knowledge, such as aging or disease progression unaware to the patient. It also does not apply to indifferent kinds like stars or rocks which do not react to their classification."
