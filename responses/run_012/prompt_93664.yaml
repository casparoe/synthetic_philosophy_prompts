prompt: |-
  I'm a novelist — fourth book, and this one's about a string quartet that falls apart, so there's music on nearly every other page and I've realised I have absolutely no method for it. At the moment I either over-explain (two paragraphs on what the second movement is doing harmonically) or I cop out with something like 'she played, and everyone in the room felt the same thing at once', which I know its rubbish.

  A friend who did philosophy told me Schopenhauer has the strangest and possibly most useful account of music going: that music isn't a picture of anything in the world the way painting is, that it doesn't copy the ideas of things but goes straight at the inner nature of the world itself — the will, or whatever you want to call it — and that what it gives you is the essence of feeling rather than this or that particular feeling, which is why it can wreck you without your being able to say what it's about. I half believe this and I want to use it, but I've no idea how to turn it into something I can actually do at the desk at eleven at night.

  So: write me a procedure. Something I can run every time a scene has music in it — the questions to ask in order, what counts as a good enough answer to each, where the procedure stops and says no, and where it has to hand the decision back to me because it's a judgment call rather than something the theory settles. It needs to be about authorial choices: what gets described (the notes? the players' bodies? the room? the listener's memories?), how much the narrator is allowed to interpret, whether characters get to say what the music means and whether I should trust them when they do, when to name the piece and when to keep it abstract, how long the passage should be. Ground it in what Schopenhauer actually says in The World as Will and Idea rather than the vibe of what he says — if the theory really does hold that music doesn't express particular emotions, I need the procedure to tell me what to do with the scene where I need the reader to know that the cellist is grieving.

  Then run it on three of my scenes: (1) the quartet rehearsing late at night, one of them starts crying, nobody stops playing; (2) a funeral where a phone goes off during the music and it's almost funny; (3) a character who knows nothing about music hears something on a car radio and it ruins his day, and at the moment I have the narrator explain to the reader what the piece 'means', which even I think is cheating.

  Be honest about where it will misfire — where the Schopenhauerian move produces a scene nobody wants to read, or where it tells me to do the opposite of what I want. And if one of the scenes comes out with an answer I won't like, don't soften it; I'd rather know. I've got a fortnight and no intention of becoming a Schopenhauer person, so it has to be usable without that.

  Write it in British English, please — my copy-editor is strict and I'm tired of the arguments.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Novelist (4th book), writing about a string quartet falling apart.
      *   **Problem:** Struggling with writing music scenes. Tends to over-explain (technical/harmonic) or under-explain (vague emotional generalities).
      *   **Inspiration:** Schopenhauer's philosophy of music (*The World as Will and Representation*). Key idea: Music doesn't copy phenomena/ideas but copies the Will itself (essence of feeling, not particular emotions).
      *   **Task:** Create a *procedure* (step-by-step guide/questions) based on Schopenhauer's actual theory for writing music scenes. Then apply this procedure to three specific scenes.
      *   **Constraints:** British English. Honest about limitations/misfires. Usable without deep philosophical study. Grounded in Schopenhauer's text, not just "vibe". Address the specific conflict: Schopenhauer says music isn't particular emotions, but the user needs to convey specific character states (e.g., grieving cellist).
      *   **Tone:** Professional, direct, practical, slightly literary (matching the user's voice).

  2.  **Deconstruct Schopenhauer's Theory (for the Procedure):**
      *   *Core Tenet:* Other arts represent *Ideas* (shadows of the Will). Music represents the *Will* itself.
      *   *Implication:* Music is universal, not particular. It doesn't say "sadness about *this* death," it says "sadness itself" or "the essence of striving/suffering."
      *   *Implication:* It bypasses the intellect. It affects the listener immediately.
      *   *Implication:* Lyrics/Programme music are secondary; the melody/harmony is the primary language of the Will.
      *   *Conflict:* The novelist needs specific narrative outcomes (character grief, plot tension). Schopenhauer suggests music is too big for specific plot points.
      *   *Resolution for Fiction:* Describe the *effect* of the Will on the individual, not the *content* of the music as a code. Focus on the physiological/visceral reaction, not the intellectual interpretation.

  3.  **Drafting the Procedure (The "Schopenhauerian Protocol"):**
      *   Need a checklist or flow.
      *   *Step 1: The Object.* What is the music doing? (Not what notes, but what *Will*).
      *   *Step 2: The Listener.* How does the Will manifest in *this* body? (Physiology over psychology).
      *   *Step 3: The Particular.* How do we bridge universal Will to specific plot? (Context, not music description).
      *   *Step 4: The Voice.* Who interprets? (Narrator vs. Character).
      *   *Step 5: The Limit.* When to stop.
      *   *Constraint Check:* Must be British English. Must be honest about where it fails.

  4.  **Applying the Procedure to the Three Scenes:**

      *   *Scene 1: Rehearsal, crying cellist, nobody stops.*
          *   *Schopenhauer:* Music is the Will. The Will is suffering/striving. The crying is a breach of the "Idea" of the musician into the "Will" of the body.
          *   *Application:* Don't describe the sad melody. Describe the physical struggle of playing against the bodily betrayal. The music continues because the Will (the piece) is bigger than the individual phenomenon (the cellist).
          *   *Potential Misfire:* Might feel too cold/abstract if the reader needs to empathize with the crier.

      *   *Scene 2: Funeral, phone rings, almost funny.*
          *   *Schopenhauer:* Music is the sacred inner truth. The phone is the "Principle of Sufficient Reason" (everyday causality, noise, distraction) intruding.
          *   *Application:* The comedy/tragedy comes from the clash between the Will (music) and the Phenomenal World (phone). Don't make the music sentimental. Make the phone jarring.
          *   *Potential Misfire:* Risk of trivializing the music or making the scene farcical when it should be poignant.

      *   *Scene 3: Layman hears radio, day ruined.*
          *   *Schopenhauer:* Music affects everyone, even without theory. It reveals the Will.
          *   *Application:* Do *not* have the narrator explain the meaning. Describe the intrusion of the universal into the mundane. The ruin comes from the disruption of his daily illusion by the truth of the Will.
          *   *Potential Misfire:* Reader might feel cheated if they don't know *why* it ruined him. Needs strong visceral description.

  5.  **Refining the Content (Self-Correction & Polishing):**
      *   *Check:* Did I stick to Schopenhauer? Yes, focus on Will vs. Representation.
      *   *Check:* British English? (e.g., "realise", "colour", "programme", "fortnight").
      *   *Check:* Honesty? Need to explicitly state where Schopenhauer is bad for fiction (e.g., it discourages specific emotional labeling).
      *   *Check:* The "Grieving Cellist" Paradox:* Schopenhauer says music *isn't* particular grief. So how to write grief? *Solution:* The grief is in the *player*, not the *music*. The music is the indifferent Will; the player is the suffering individual. This is a crucial distinction.

  6.  **Final Review against constraints:**
      *   Procedure format? Yes.
      *   Three scenes analyzed? Yes.
      *   Honest about misfires? Yes.
      *   British English? Yes.
      *   No softening of unpleasant truths? Yes.

  7.  **Drafting the Response (incorporating the above thoughts):**
      *   *Intro:* Acknowledge the difficulty. Validate the Schopenhauer choice.
      *   *The Protocol:* 5 Steps. Clear questions. Stop conditions.
      *   *The Warning:* Where Schopenhauer fails (narrative specificity).
      *   *The Scenes:* Apply the protocol. Give specific advice. Point out the risks.
      *   *Conclusion:* Encouragement but realistic.

  *(Self-Correction during drafting)*: Make sure I don't get too bogged down in philosophical jargon. Keep it practical for a writer at 11 pm. Use terms like "The Will" but define them operationally (e.g., "the raw drive"). Ensure the distinction between *emotion* (particular) and *feeling* (universal) is clear in the instructions.

  *(British English Check)*: Ensure "s" instead of "z" in realise/organise, "colour", "programme", "honour", etc. Use British phrasing ("rubbish", "fortnight", "copy-editor").

  *(Tone Check)*: The user is tired and stressed ("fortnight", "no intention of becoming a Schopenhauer person"). Be empathetic but firm. Don't waffle.

  *(Final Polish)*: Ensure the distinction in Scene 1 is clear: The music doesn't cry, the human does. The music continues because it is the Will, which is indifferent. This fits Schopenhauer perfectly.

