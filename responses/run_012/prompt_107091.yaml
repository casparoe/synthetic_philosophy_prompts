      *   **Key Insight to Convey:** Everyone did their job, harm occurred, but no single agent holds the full package for blame. Fixes (human in loop, strict liability, etc.) have trade-offs.
      *   **Debrief Requirements:** Map game moments to philosophical concepts (control/epistemic conditions, many hands, blame vs. liability, ex post vs. ex ante). Distinguish consensus vs. contested issues in the field.
      *   **Failure Modes:** Predict what will go wrong (victim blaming, robot agency arguments, voting over rules, steamrolling) and how to mitigate.
      *   **Constraints:** No citations/reading list needed. Be honest about limitations.

  2.  **Design the Activity ("The Ledger Game"):**
      *   *Title:* Needs to sound official but engaging. "The Incident Review Board" or "The Token Ledger." Let's go with "The Responsibility Ledger."
      *   *Time Management:* 90 minutes is tight.
          *   Intro/Setup: 10 mins
          *   Role/Briefing: 15 mins
          *   Negotiation (The Core): 40 mins
          *   Verdict: 10 mins
          *   Debrief: 15 mins
      *   *Materials:* Tokens (two colors), Role Cards, Incident Report, Ledger Sheet.
      *   *The Twist:* The tokens start distributed in a way that *no one* has a matching pair for the critical moment. They must trade to close the ledger, but trading has costs (revealing info, taking liability, slowing down the system).

  3.  **Fleshing out the Mechanics:**
      *   *The Incident:* Robot clips pedestrian. Critical decision point: "Path Deviation at T-minus 6s."
      *   *Token Distribution:*
          *   Safety Engineer: Has Knowledge (knew risk), lacks Control (couldn't stop update).
          *   Remote Supervisor: Has Control (emergency stop), lacks Knowledge (screen lag/distraction).
          *   Software Lead: Has Knowledge (code bug), lacks Control (deployed automatically).
          *   Fleet Operator: Has Control (policy), lacks Knowledge (didn't know specific bug).
          *   System/Log: Holds tokens but can't be blamed.
      *   *Trading Rules:*
          *   To assign blame, a player must hold K + C tokens for the incident.
          *   Trading K tokens costs "Reputation" (reveals negligence).
          *   Trading C tokens costs "Liability Points" (financial/operational burden).
          *   System tokens can be moved to humans but reduce efficiency (simulated by a timer or penalty).
      *   *Win Condition:* The group must assign blame to *someone* to close the case. If they can't, the "System" takes the hit, which triggers a "Shutdown" (everyone loses points/utility). This forces the trade-offs.

  4.  **Drafting the Role Cards & Scenario:**
      *   Need to ensure the "Many Hands" problem is clear.
      *   *Safety Engineer:* Signed off on route. Knew the sidewalk was narrow.
      *   *Remote Supervisor:* Watching 4 screens. Laggy connection.
      *   *Software Lead:* Pushed an update 2 hours prior.
      *   *Regulator:* Approved the deployment zone.
      *   *Insurer:* Wants to minimize payout.
      *   *Victim:* Wants accountability.
      *   *Log:* Just data.

  5.  **Developing the Debrief:**
      *   *Phase 1: The Feeling.* How did it feel to hold half a token?
      *   *Phase 2: The Concepts.* Map K+C to Epistemic + Control conditions. Map the trading difficulty to the Responsibility Gap.
      *   *Phase 3: The Fixes.* Discuss the costs they incurred during trading (Strict Liability, Human-in-Loop).
      *   *Phase 4: Consensus vs. Contest.* Crucial step. Differentiate between "The gap exists" (mostly agreed) and "How to fix it/What it means" (contested).

  6.  **Anticipating Failure Modes:**
      *   *Victim Blaming:* Rule it out mechanically (Victim role has no tokens to trade).
      *   *Robot Agency:* The Log role is explicitly non-agent. Facilitator must enforce this.
      *   *Voting over Rules:* Facilitator acts as the "Chair" to enforce ledger rules.
      *   *Steamrolling:* Use a "talking token" or structured turns during negotiation.
      *   *Getting Stuck:* Have a "Default Verdict" card if they run out of time.

  7.  **Refining the Output:**
      *   Ensure tone is practical for an instructor.
      *   Check timing.
      *   Make sure the "Consensus vs. Contest" section is nuanced (as requested).
      *   Verify the token mechanic actually forces the gap experience (i.e., ensure initial distribution makes blame impossible without costly trading).

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 40 minutes enough for negotiation?
      *   *Fix:* Make the negotiation structured. 3 rounds of trading.
      *   *Critique:* Will students understand "Knowledge/Control" immediately?
      *   *Fix:* Use clear icons/colors on the cards. Red = Control, Blue = Knowledge.
      *   *Critique:* How to handle the "System" taking the hit?
      *   *Fix:* If no human accepts the pair, the "Company License" is revoked. Everyone loses. This creates pressure to find a scapegoat even if unfair.

