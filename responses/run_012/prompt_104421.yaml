      *   *Informational Semantics (Covariation):* Fodor, Dretske (early). Content = reliable causation/covariation. Problem: Misrepresentation (error), disjunction problem (cow vs. horse-on-a-dark-night).
      *   *Functional Role Semantics (Systemic Economy):* Block, Harman. Content = role in the cognitive system. Problem: Solipsism (doesn't reach the world), normativity.
      *   *The User's Hypothesis:* They are talking past each other (different questions).

  3.  **Evaluate the User's Hypothesis:**
      *   Is it just verbal? No, it's deeper. It's about *explanatory priorities*.
      *   Is it different questions? Yes, but they are intertwined. The "what makes it a representation" question is often answered *by* the theory of content.
      *   The core issue is *Normativity vs. Naturalism*. How do you get "ought" (truth conditions, error) from "is" (physics, biology)?

  4.  **Formulate the Diagnosis:**
      *   **Core Conflict:** It's not just about content determination; it's about the *source of normativity*.
      *   **Side 1 (Teleo):** Prioritizes *Error*. A system must be able to be wrong. Biology provides the norm (function).
      *   **Side 2 (Info):** Prioritizes *World-Connection*. Mind must hook onto reality. Physics/causation provides the hook.
      *   **Side 3 (Role):** Prioritizes *Use*. Meaning is use. Internal coherence provides the structure.
      *   **The Impasse:** Each theory solves one problem by creating another.
