answer: |-
  This is a profound and classic problem in bioethics and jurisprudence. You are not merely nervous; you have correctly identified the **Sorites Paradox** (the paradox of the heap) applied to moral status and legal capacity. Your committee is stalled because they are trying to solve a metaphysical problem (when *exactly* does the self change?) with a policy tool (a rule).

  Here is an analysis of the disagreement, a validation of your unease, and a concrete recommendation for your proposal.

  ### 1. Diagnosing the Disagreement

  Your committee members represent three distinct philosophical and practical commitments. Understanding these will help you mediate.

  *   **Member A (The Sorites Constraint):** This member is arguing for **non-arbitrariness**. They are philosophically correct that capacity is a spectrum, not a binary state. If capacity degrades by 0.1% a day, there is no natural "joint in nature" where the patient flips from *capable* to *incapable*. They fear that drawing a line creates a "moral cliff" where a trivial difference in time dictates a massive difference in rights.
  *   **Member B (The Decisionist):** This member is arguing for **legal certainty and actionability**. Hospitals cannot operate in a state of permanent suspension. Clinicians need to know if they can administer medication today without fear of battery charges tomorrow. They prioritize the *function* of the policy over its *theoretical purity*.
  *   **Member C (The Discretionist):** This member is arguing for **contextual particularism**. They recognize that checklists fail in complex cases. However, you are right to be suspicious: without guardrails, "clinical judgment" often masks bias, fatigue, or convenience. It transfers the ethical burden from the institution to the individual clinician, which is a liability risk.

  ### 2. Is Your Unease Justified?

  **Yes.** Your worry that "any criterion we write down... will itself need a boundary" is a genuine philosophical problem known as **higher-order vagueness**.

  If you write "The patient lacks capacity when they cannot appreciate the consequences," you must define "appreciate." If you define it as "ability to explain back the risk," you must define "explain." Every definition has a penumbra of uncertainty.

  However, in law and ethics, we do not solve vagueness by finding perfect definitions; we solve it by **proceduralizing the uncertainty.** You cannot eliminate the gray zone, but you can build a policy that manages the gray zone safely.

  ### 3. The Recommendation: A "Procedural Safe Harbor"

  Do not try to define the *moment* of incapacity. Instead, define the *process* by which the hospital accepts that incapacity has likely occurred. Your proposal should shift the committee's focus from **Metaphysical Precision** to **Procedural Justice**.

  Here is the structure of the policy recommendation you should bring to the committee.

  #### A. Reframe the "Single Day" Constraint (Addressing Member A)
  Acknowledge Member A is right: no biological day is the switch. Therefore, the policy should not claim to identify the *biological* switch. Instead, it identifies the **administrative** switch.
  *   **Proposal:** The policy states that capacity is not a status, but a **presumption**. The patient is presumed capable until a specific *process* rebuts that presumption. The "single day" is not when they *became* incapable, but when the *assessment was completed*. This satisfies Member A (we aren't claiming biology changed overnight) and Member B (we have a date of record).

  #### B. Operationalize the Criteria (Addressing Your Unease)
  To avoid the infinite regress of defining terms, use **standardized, validated tools** rather than abstract concepts.
  *   **Proposal:** Do not write "unable to appreciate consequences." Write "unable to score above threshold X on the MacArthur Competence Assessment Tool for Treatment (MacCAT-T) or equivalent, confirmed by two independent assessors."
  *   **Why:** This moves the boundary from a philosophical debate to a clinical measurement. It acknowledges the boundary is conventional (a score of 14 vs. 15), but it is a *consistent* convention.

  #### C. The "Zone of Ambiguity" Protocol (Addressing Member C & B)
  This is the core of your solution. Acknowledge that there will be a period of decline where the patient is neither clearly capable nor clearly incapable.
  *   **Proposal:** Create a **Two-Stage Trigger**.
      1.  **Stage 1 (Concern):** If the treating team suspects decline, a formal capacity assessment is triggered. If the patient fails, but the failure is marginal or the decline has been slow/unclear, the Advance Directive is *not* immediately activated.
      2.  **Stage 2 (Confirmation):** A second assessment is required after a set "cooling-off" period (e.g., 72 hours or 1 week), ideally by a clinician not involved in the daily care (to reduce bias).
      3.  **The Switchover:** The Advance Directive overrides current wishes only after **two concordant assessments** separated by time.

  This solves the Sorites problem by requiring the "heap" to be removed twice before we agree it's gone. It protects against a "bad day" (fluctuating capacity) and satisfies Member B (there is a definite endpoint to the process).

  #### D. The "Critical Interests" Clause (The Ethical Core)
  Since you are dealing with slow decline (likely dementia), you must address the conflict between **Precedent Autonomy** (the AD) and **Current Autonomy** (the objection).
  *   **Proposal:** Include a clause that distinguishes between *experiential interests* (comfort, immediate distress) and *critical interests* (life values, long-term goals).
  *   **Rule:** If the patient's current objection is based on immediate distress (e.g., "I don't want this needle"), the team should attempt to alleviate distress and reassess. If the objection is based on a delusion or a fundamental break from their critical interests (e.g., "I want to die because I am a bird"), the AD holds more weight.
  *   **Why:** This gives the treating team (Member C) guidance on *how* to weigh the current objection, rather than just leaving it to their whim.

  ### 4. Draft Language for Your Proposal

  You might present the following specific policy mechanism to the committee:

  > **Policy Section: Determination of Incapacity in Progressive Decline**
  >
  > 1.  **Presumption of Capacity:** All patients are presumed to possess decision-making capacity. This presumption is rebutted only through the formal assessment process below, not by diagnosis alone.
  > 2.  **The Threshold of Action:** An Advance Directive shall override contemporaneous wishes only when:
  >     *   (a) A standardized capacity assessment indicates incapacity; **AND**
  >     *   (b) A second, independent assessment confirms incapacity after a minimum interval of [72 hours]; **AND**
  >     *   (c) The treating team documents that current objections are not the result of treatable distress or reversible delirium.
  > 3.  **The "No Single Day" Acknowledgement:** The committee acknowledges that cognitive decline is continuous. The date of incapacity recorded in the medical record shall be the date of the *second confirming assessment*, understood as the administrative point of action, not necessarily the biological onset of incapacity.
  > 4.  **Dispute Resolution:** If the patient's current wishes strongly contradict the AD during the assessment interval, treatment shall default to the least restrictive alternative necessary to prevent immediate harm until the second assessment is complete.

  ### 5. How to Pitch This to the Committee

  *   **To Member A:** "You are right that nature provides no bright line. This policy admits that. We are not claiming to find the exact day the soul changed; we are establishing a fair procedural hurdle before we override a person's liberty. The two-step assessment ensures no trivial fluctuation decides the case."
  *   **To Member B:** "This gives you a definite answer. Once the second assessment is signed, you have legal cover. It is actionable, but it is defensible because it is rigorous."
  *   **To Member C:** "This supports your judgment but protects you. You don't have to decide alone. The second assessor shares the burden, and the 'least restrictive alternative' clause gives you room to manage immediate distress without violating the AD."
  *   **To Yourself:** "This acknowledges higher-order vagueness. We are not defining 'capacity' perfectly; we are defining a 'process for determining capacity' that is robust enough to withstand the vagueness."

  ### Summary
  Your unease is the signal that you are thinking deeply enough to see the paradox. Do not try to resolve the paradox; **manage** it.

  The policy should not be a map of the patient's mind (which is foggy); it should be a map of the hospital's conscience (which must be clear). By requiring **repeated, independent verification** before activating the Advance Directive, you respect the slow decline of the patient while providing the definite answer the hospital requires. This transforms the "switchover" from a metaphysical claim into a procedural safeguard.
