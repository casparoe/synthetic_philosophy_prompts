      *   *Deep Dive on (e):* The "nagging suspicion" is correct. They need to distinguish the *grapheme* (abstract) from the *glyph* (visual).

  8.  **Final Polish:** Ensure the ratings are clear (e.g., "Mostly Right," "Partially Mistaken"). Make sure the justification ties back to the specific arguments made in the dialogue. (e.g., for (3), explicitly mention the Cyrillic counter-example).

