      *(Refining the "Middle Position")*: The concept of *affordance* (Gibson) might be useful here. The shape affords being read as 'a' within a system. Or better: *Peircean Semiotics*. The letter is a sign. The TD focuses on the Interpretant/Symbol relation, the CS on the Icon/Index relation. I'll stick to Cognitive Science terms to fit the persona. *Predictive Processing* is a good modern framework: The brain predicts 'a' based on priors (CS) but updates based on context (TD).

