      *   *Nuance 1 (Strong/Weak):* Humans acted as the Weak Party turning Strong. They hid (concealment) until they could strike (preemption). This fits the nuance.
      *   *Nuance 2 (Cognition):* This is the big one. The Formics couldn't model individuals. Humans couldn't model a hive mind (until later). The Dark Forest assumes rational agents. If you can't recognize the other as an agent, the game theory breaks.
      *   *The Twist:* The human strike *was* a Dark Forest strike (preventative, total, based on inability to trust). But the *reason* for the conflict wasn't Dark Forest inevitability; it was a misunderstanding. The Queen didn't want to fight once she knew.
      *   *Conclusion:* The novel argues the Dark Forest is a failure of imagination, not physics. The "Speaker" role is the solution to the Dark Forest: bridging the cognitive gap makes commitment possible.

  6.  **Selecting Scenes for the Board:**
      *   Need scenes that highlight the decision matrix and the cognitive gap.
