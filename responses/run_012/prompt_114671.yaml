      *   2. The Discovery of the Cocoon / The Hive Queen's Communication: Shows the breakdown of P3 once cognition is shared.
      *   3. Graff's justification to Anderson (or the political context): Shows the human adherence to Dark Forest logic (must wipe them out or they wipe us).

  7.  **Refining the Position:**
      *   I need to be committed. Is it Vindicates, Refutes, or Complicates?
