answer: |-
  The simulation chamber hummed, a low-frequency vibration that Elias felt in his teeth rather than heard. On the central dais, the holographic lattice spun, a cloud of blue threads representing the Null Timeline—the world as it would have been had Mara not touched the console. Interwoven with them were the red threads, the Actual Timeline, fraying and whipping wildly as they moved away from the point of intervention.

  Elias adjusted his haptics, feeling the tension in the data. He was a Senior Assessor for the Bureau of Divergence, and today's case was supposed to be routine. A traffic engineer, Mara, had overridden a signal priority in Sector 4 during a heavy rainstorm. She claimed it was to clear an ambulance route. The result was a ripple effect: a delivery van swerved, struck a substation, and plunged the St. Jude Memorial wing into darkness for forty seconds. A backup generator failed to engage. One patient on life support died.

  In the old tort system, this would have been a mess of but-for causation. Was it the rain? The van driver? The generator manufacturer? Mara's lawyers would argue inevitability; the plaintiff's lawyers would argue necessity. But the Divergence Statute had swept those questions into the bin of metaphysical clutter. The law no longer asked if the act was necessary. It asked how much the act mattered.

  "Display the Lyapunov coefficient for the intervention window," Elias said. His voice sounded flat in the acoustic-damped room.

  The lattice shifted. The red threads snapped away from the blue with violent suddenness at the timestamp of Mara's override. Then, they settled back into a pattern roughly parallel to the original, but displaced. The gap between them was the liability.

  "The defense is ready," his clerk murmured, handing him a slate.

  Elias nodded and stepped into the hearing chamber. It was circular, designed to remove the concept of sides. Mara sat opposite the plaintiff's representative, a man whose face was set in the grim mask of grief. Mara looked tired, her hands folded tightly around a stylus. She wasn't looking at the people; she was looking at the air where the simulation would be projected.

  "Assessor," the plaintiff's counsel began. "We agree the storm was a background condition. But the defendant's input changed the phase state of the traffic grid. The sensitivity index is 0.84. That is high."

  Mara's attorney stood. "High sensitivity implies instability, Counselor. It implies that the system was poised on a knife-edge. If the system was that fragile, how could my client have foreseen the cascade? The Statute requires agency. You cannot have agency over a hurricane."

  "The Statute requires divergence," the counsel countered. "Your client nudged the butterfly. The hurricane followed. The liability is proportional to the wingbeat's reach."

  Elias raised a hand. "Show the variance."

  The hologram bloomed above them. The blue threads were smooth, predictable flows of traffic and power load. The red threads were jagged. At the moment of Mara's override, the red line spiked. It didn't just change the outcome; it changed the *dependence* of the outcome. In the Null Timeline, the substation failure was determined by the rain intensity. In the Actual Timeline, it was determined by the van's angle.

  "Dr. Aris," Elias said, nodding to the bureau's expert witness seated in the gallery. "Interpret the spread."

  Aris, a man who looked as though he slept inside server racks, tapped his interface. "The system was in a chaotic regime. Weather patterns created a high-energy state. In such states, small perturbations yield massive downstream differences. The defendant's act was small in energy but large in information. It selected a specific future from a cloud of probabilities."

  "But which future?" Mara asked. Her voice was quiet, but it cut through the hum. "If the system was chaotic, as you say, then any number of things could have triggered the failure. A bird. A pothole. The wind. You are telling me I am liable because the world was ready to break, and I happened to be the hand that shook it."

  "You are liable because you shook it," Aris said. "The robustness of the outcome is irrelevant. The sensitivity is the metric. The world hinged on you."

  Elias watched the numbers scroll on his slate. The liability assessment was climbing. 0.84 sensitivity meant Mara was responsible for 84% of the divergence value. The damages would be astronomical. But as he watched the red threads whip around the blue, a cold knot formed in his stomach.

  The high sensitivity score—the very number that condemned Mara—was a measurement of unpredictability. It quantified how little the future resembled the past. It measured how impossible it was to know what would happen next.

  "Dr. Aris," Elias said. "If the sensitivity index were lower... if the system were more stable..."

  "Then the divergence would be minimal," Aris said. "Liability would be negligible. A nudge in a stable system dies out."

  "So," Elias said, looking from the hologram to Mara. "The more unstable the world, the less a human can predict the consequences of their actions. And yet, the more unstable the world, the higher the liability for those actions."

  The room went silent. The plaintiff's counsel shifted in his seat. Mara looked up, her eyes locking onto Elias's.

  "The doctrine penalizes the actor based on the chaos of the environment," Elias continued, his voice losing its procedural flatness. "You are assigning guilt based on the impossibility of foresight. The metric rewards the unpredictability that made foresight impossible in the first place."

  "It is not a reward," Aris said sharply. "It is an allocation of cost."

  "It is a tax on chaos," Elias said. "And you are charging her for the weather."

  "The Statute does not distinguish between weather and will," the counsel interjected. "Only divergence."

  Elias looked back at the lattice. The red threads were beautiful in their complexity, a fractal bloom of consequence. They proved that Mara's action mattered more than anything else in that moment. They proved she was the pivot. But they also proved that no one could have known she was the pivot until after the fact. The law had found a way to demand omniscience by measuring ignorance.

  He looked at the liability score. It was final. The math was perfect. The justice was opaque.

  "Assessment confirmed," Elias said. He didn't look at Mara when he said it. He looked at the red threads, dancing wildly in the space where the future used to be.

  ***

  **Closing Note**

  The single feature carrying the philosophical weight is the substitution of *sensitivity* (chaos/divergence) for *necessity* (but-for causation) as the metric of responsibility. In standard causation, an act must be necessary for the outcome; in this story's framework, an act is liable because it was *influential* in a chaotic system. If you removed this feature and reverted to standard but-for causation, the story would collapse into a conventional legal drama about foreseeability and proximate cause. The specific tension of deterministic chaos—that an act can be consequential without being robustly necessary—would vanish, and with it, the paradox that the system punishes agents most severely when the environment is too unstable for any agent to predict the outcome.
