      *   **The "Hole Argument" Confusion:** The prompt says: "One of them says the shuffling shows the points aren't real; the other says it shows the points are real but their identities aren't."
          *   *Diagnosis:* This is the crux. This is the *Hole Argument* (Einstein/Earman/Norton).
          *   Side A (Philosopher usually): If you can permute points without changing observables, the points have no individual identity (haecceity). Therefore, substantivalism (points as entities) leads to indeterminism. So, reject substantivalism.
          *   Side B (Physicist usually): The manifold is real, but we must treat diffeomorphic models as representing the *same* physical state. The points are real, but we can't label them independently of the fields.
