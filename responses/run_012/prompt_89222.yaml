          *   Physicist: Explanation = A mathematical structure that yields unique predictions for local experiments (the bucket).
          *   Philosopher: Explanation = A mapping of ontology that doesn't posit indistinguishable states (the hole argument/Leibniz shift).
      *   **The Empty Universe:** This is the litmus test. It's not a category error; it's a clash of physical intuitions (Newton vs. Mach).
