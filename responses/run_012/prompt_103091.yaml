      4.  Verdict: Reflection is a norm of *epistemic self-trust*, not logic. It binds only when I expect my future self to be a rational updater.
      5.  Better Picture: **The Diachronic Bookie.** It focuses on coherence/avoiding sure loss rather than authority.

  8.  **Refining the Verdict:** I need to be committed. Is it ideal rationality? No. Is it abandonable? No. It's a **conditional norm of diachronic coherence**.
      *Condition:* The future self must be expected to be a rational updater who retains current evidence.

  9.  **Refining the Better Picture:** The "Expert" picture implies the future self has *authority*. The "Bookie" picture implies the future self creates *vulnerability*. The Bookie picture is better because it explains the *cost* of violation (Dutch Book) rather than the *source* of truth (Expertise).

