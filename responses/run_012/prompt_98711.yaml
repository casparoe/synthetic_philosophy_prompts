answer: |-
  This is a classic tension in critical criminology and political theory, often framed as the debate between **reformist reforms** (making the system work better) and **non-reformist reforms** (reforms that reduce the system's power and scope).

  Based on the track record you provided, here is the breakdown of what your roommate is likely thinking, the principles at war, and how to test them.

  ### 1. What would she say about the Co-Response Unit?
  **Prediction:** She will likely oppose it (or offer a very qualified, skeptical "no").

  **Why:** Even though the pilot reduces use-of-force and jail bookings (good outcomes), it explicitly **adds sworn officers** and **grows the department's budget**. Her past "No" votes on bigger budgets and more patrol officers suggest she views the *size and funding of the institution* as a primary metric of success, not just the immediate behavior of officers. To her, a "nicer" police department that is larger and richer is often seen as a more entrenched, dangerous long-term threat.

  ### 2. The Two Competing Rules
  You are right that her past answers are consistent with multiple frameworks. Here are the two strongest candidates:

  **Rule A: Consequentialist Harm Reduction**
  *   **The Logic:** Support any policy that demonstrably reduces physical violence, incarceration, or suffering.
  *   **The Metric:** Outcomes (fewer people jailed, fewer people hurt).
  *   **Prediction on Co-Response:** **YES.** The data says it cuts force and bookings. The presence of a cop is a necessary evil to achieve the greater good of reduced harm.
  *   **Fit with Past Data:** Fits her support for crisis responders and decriminalization. *However*, it struggles to explain her hard "No" on bigger budgets if that budget could theoretically fund better training to reduce harm.

  **Rule B: Structural Power Reduction (Abolitionist/Divestment)**
  *   **The Logic:** Support any policy that reduces the budget, scope, footprint, or coercive power of the police. Oppose anything that legitimizes or expands their role, even if it seems "benevolent."
  *   **The Metric:** Institutional Power (budget size, number of sworn officers, range of duties).
  *   **Prediction on Co-Response:** **NO.** It expands the budget and adds officers. It also keeps police as the gatekeepers to mental health care, rather than transferring that power entirely to health professionals.
  *   **Fit with Past Data:** Fits perfectly. She supports moving functions *away* from police (unarmed responders, community interrupters) and opposes moving resources *toward* them (budget, armor, school presence).

  ### 3. Which Rule is She Running?
  **I would bet on Rule B: Structural Power Reduction.**

  **Reasoning:**
  If she were primarily a Harm Reductionist (Rule A), she would likely be more open to "better policing" tools if they promised safety outcomes. For example, a Harm Reductionist might support body cameras or more training (which cost money) if it reduced violence. Her consistent rejection of *any* budget growth or *any* increase in officer presence (schools, patrol) suggests she views the **existence and expansion of the institution itself** as the problem, not just its current inefficiency.

  In academic terms, she is likely advocating for **"non-reformist reforms."** This is a specific strategy where you only support changes that shrink the system's power (like decriminalization) rather than changes that make the system more efficient or legitimate (like co-response units that keep cops in the loop).

  ### 4. The Tie-Breaker Proposal
  To definitively separate Rule A (Harm Reduction) from Rule B (Power Reduction), you need a proposal that **guarantees better safety outcomes** but **explicitly expands police social power.**

  **Put this to her:**
  > *"The city proposes funding a Police Athletic League (PAL) expansion. Police officers will run after-school mentorship and sports programs for at-risk youth. Data from other cities shows this significantly reduces youth crime rates and improves community trust in the department. However, it requires increasing the police budget to pay officers for overtime and program management."*

  **How she answers tells you everything:**
  *   **If she says YES:** She is a **Harm Reductionist/Reformer**. She believes police integration into social life is good if it reduces crime and builds trust.
  *   **If she says NO:** She is a **Power Reductionist/Abolitionist**. She believes police should not be involved in social work/mentorship at all, regardless of crime stats, because it normalizes their presence in community life and expands their budget/scope.

  ### 5. A Note on Underdetermination
  It is possible her track record is genuinely underdetermined. There is a third position: **Pragmatic Accountability.**
  She might believe that *currently*, the police are too militarized and unaccountable to be trusted with *any* new roles or money. In this view, she might support the Co-Response unit **if** it came with strict civilian oversight, but oppose the budget increase **until** accountability measures are met.

  If you want to rule this out, ask her: *"If the co-response unit was guaranteed to cut jail bookings by 50%, but we couldn't add new civilian oversight measures to it, would you support it?"*
  *   **Yes:** She prioritizes outcomes over process.
  *   **No:** She prioritizes structural constraints over outcomes.

  **Summary:** She is most likely operating on **Structural Power Reduction**. She views the police budget and footprint as the primary danger, not just police violence. The Co-Response unit fails her test because it makes the department bigger and richer, even if it makes them nicer. The **Police Athletic League** proposal is your best tool to confirm this.
