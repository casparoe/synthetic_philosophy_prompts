prompt: |-
  I'm taking this seminar on policing and the state's monopoly on violence and my roommate is way more into it than I am — she's been volunteering with a local police-accountability group all semester, so she has a take on literally every proposal that comes up. I'm trying to figure out what she's actually committed to, because I honestly cant tell if she's a reformer or an abolitionist at heart.

  Here's how she's landed on stuff so far:

  - Sending unarmed mental-health / crisis responders to non-violent 911 calls instead of cops: yes.
  - Community violence-interruption programs (run by people from the neighborhood, not the department): yes.
  - Decriminalizing minor traffic offenses and ending stop-and-frisk: yes.
  - A bigger police budget to hire more patrol officers: no.
  - More armed officers / resource officers in schools: no.
  - Buying the department armored vehicles and more surveillance gear: no.

  So now the city's floating this new pilot: a "co-response" unit where every officer gets paired with a mental-health clinician and they handle addiction and homelessness calls together. Early data says it cuts use-of-force incidents and jail bookings in the pilot area alot. But it also adds sworn officers and grows the department's budget.

  What would my roommate say? And honestly I care less about the yes/no than about what rule she's actually running. I can think of at least two or three different rules that fit everything she's said so far, and I want to know which ones predict what on the co-response thing, which one you'd bet she's really running and why, and what other proposal I should put in front of her that would actually separate those rules and settle it. Also, if her track record genuinely underdetermines this, I'd rather you just say which principle she'd be adopting either way.
