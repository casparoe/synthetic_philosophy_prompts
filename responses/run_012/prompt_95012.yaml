answer: |-
  ### Strategic Assessment of the Research Programme

  Your working hypothesis—that standing is scalar, domain-relative, and aggregable—challenges the dominant binary/individualist paradigm. This is a high-risk, high-reward pivot. If standing cannot be coherently pooled, the scalar aspect becomes a minor modification rather than a structural overhaul. If it can, you fundamentally alter how we understand moral communities and legal institutions.

  Given your constraints (philosophers, modest empirical budget, 3-year horizon), you cannot solve the meta-ethics of blame from scratch, nor can you conduct large-scale sociological studies. You must target conceptual bottlenecks that are amenable to *experimental philosophy* (vignettes/intuition pumps) and rigorous conceptual analysis.

  Below is the prioritized agenda, the criteria used to rank them, and the specific lead question for the programme.

  ---

  ### Criteria for Prioritization

  1.  **Upstream Dependency:** Does resolving this question determine the viability of the others? If the answer is "no," the question is downstream.
  2.  **Tractability (Phil + Emp):** Can two postdocs make decisive progress using conceptual analysis and vignette studies within 3 years? Questions requiring heavy legal doctrine or complex psychological modeling are deprioritized.
  3.  **Neglect & Impact:** Is the question currently stalled or ignored? High impact comes from unlocking new lines of inquiry, not refining settled ones.

  **Trade-off Note:** There is a tension between *Dependency* and *Tractability*. The most foundational questions (e.g., "What is the metaphysical nature of standing?") are often the hardest to test empirically. The agenda below prioritizes questions where empirical data can *constrain* philosophical theory, rather than questions that require solving metaphysics before data can be gathered.

  ---

  ### The Prioritized Agenda

  #### 1. The Coherence of Pooled and Borrowed Standing
  *   **Rank:** 1 (Critical Path)
  *   **Rationale:** This is the make-or-break question for your hypothesis. If "pooled standing" collapses into "the standing of the most aggrieved individual" or "the standing of the loudest voice," then the aggregation model is an illusion. If it is coherent, it implies standing is a resource that behaves differently than rights or permissions.
  *   **Tractability:** High. Vignettes can test whether subjects perceive a group's blame as *more* authoritative than the sum of its parts, or whether they view a "borrowed" blamer (e.g., a friend speaking for a victim) as having derivative or independent standing.
  *   **Neglect:** High. Literature focuses on the individual blamer's hypocrisy or relationship to the wrongdoer. Communal standing is largely assumed or ignored.

  #### 2. Normative Status vs. Pragmatic Precondition
  *   **Rank:** 2 (Mechanism)
  *   **Rationale:** This defines *what* is being pooled. If standing is a **normative right** (deontic), pooling is conceptually difficult (can I transfer my right?). If it is a **pragmatic precondition** (communicative efficacy/authority), pooling is intuitive (a chorus is louder than a soloist). The answer to Q1 depends on this, but you can investigate Q1 phenomenologically first to inform Q2.
  *   **Tractability:** Medium. Requires careful conceptual work, but vignettes can distinguish intuitions about "permission to blame" vs. "effectiveness of blame."
  *   **Neglect:** Medium. This is a classic debate, but rarely applied to the *aggregation* problem.

  #### 3. The Dynamics of Forfeiture and Repair
  *   **Rank:** 3 (Temporal Dimension)
  *   **Rationale:** If standing is scalar, forfeiture must be too. You can lose *some* standing, or standing *in a specific domain*. This dissolves the binary "hypocrite has no standing" view. It also opens the door to "repair" (regaining standing), which is practically vital for restorative justice.
  *   **Tractability:** High. Vignettes can manipulate the severity of the blamer's past wrongs and the domain relevance to measure perceived standing degradation.
  *   **Neglect:** High. Forfeiture is usually treated as a switch (flipped by hypocrisy), not a dimmer.

  #### 4. Standing vs. Desert
  *   **Rank:** 4 (Ethical Implication)
  *   **Rationale:** This asks if a wrongdoer can deserve blame even if no one has standing to deliver it (a "standing gap"). This is crucial for your institutional angle: does the court blame *for* the community when the community has forfeited its standing through apathy or complicity?
  *   **Tractability:** Medium. Harder to test empirically; relies more on deriving implications from Q1 and Q2.
  *   **Neglect:** Medium. Often discussed in theology (God's standing), less in secular moral philosophy.

  #### 5. Individual vs. Institutional Blame
  *   **Rank:** 5 (Application)
  *   **Rationale:** This is the downstream application of "borrowed standing." If institutions are just formal pools of standing, how does their blame differ? This risks becoming legal theory, which is outside your core competency and budget.
  *   **Tractability:** Low. Requires navigating complex legal philosophy. Best tackled in Year 3 once Q1–Q3 are settled.
  *   **Neglect:** Low. Extensive literature on state punishment exists, though rarely linked to interpersonal standing.

  ---

  ### The Lead Question: The Coherence of Pooled Standing

  **The Question:** *Under what conditions do subjects perceive the standing of a collective (or a proxy) as distinct from, and greater than, the sum of the standing of its individual members?*

  **Why it is Upstream:**
  This question is the gateway to the entire programme.
  1.  **If the answer is "Never":** Your hypothesis is false. Standing is inherently individual. The programme must pivot to refining the scalar nature of *individual* standing (e.g., degrees of hypocrisy).
  2.  **If the answer is "Always":** Standing is purely a function of social power. The normative dimension collapses into sociology.
  3.  **If the answer is "Conditionally":** (The likely productive outcome). You identify the *exchange rate* of standing. For example, pooling might work for *expressive* blame (protest) but not *sanctioning* blame (punishment). Or, borrowing might work only when the lender (victim) explicitly authorizes it.

  This determines the viability of Q2 (what kind of property allows pooling?), Q3 (can you forfeit pooled standing?), and Q5 (are institutions just permanent pools?).

  **What Counts as Progress (vs. Restatement):**
  *   **Mere Restatement:** Arguing philosophically that "communities can blame" or running surveys showing people dislike "meddling."
  *   **Genuine Progress:** Identifying the **boundary conditions of aggregation**.
      *   *Example Result:* "Our vignette studies show that standing pools only when the group shares a specific normative expectation with the wrongdoer (domain-relativity), but borrowing fails when the proxy has a conflicting interest, even if authorized."
      *   *Example Result:* "Standing is not additive (1+1=2) but logarithmic; beyond a certain threshold, adding more blamers diminishes perceived standing (mobbing effect)."

  This provides a *mechanism* for your scalar hypothesis. It moves the debate from "Do they have standing?" to "How much standing does this configuration generate?"

  ---

  ### Dynamic Adjustment: Evidence and Argument

  The ranking is not static. Over the next three years, specific findings should shift the priorities:

  1.  **Upward Shift (Forfeiture/Repair):** If Year 1 vignettes show that subjects treat standing as highly volatile (easily lost and regained), Q3 moves up. This would suggest blame is a dynamic negotiation rather than a status. This would require more empirical work on *how* repair is signaled.
  2.  **Downward Shift (Institutions):** If Year 1 data shows that "borrowed standing" is intuitively rejected by subjects (e.g., people view a friend blaming on behalf of a victim as "meddling" regardless of authorization), then Q5 (Institutions) becomes less tractable. If individuals resist borrowing, institutions claiming to represent victims face a deeper legitimacy crisis than assumed. You should deprioritize legal analogies and focus on the interpersonal breakdown.
  3.  **Upward Shift (Normative vs. Pragmatic):** If the postdocs find that "pooling" only makes sense when standing is framed as *efficacy* (pragmatic) but not *permission* (normative), Q2 moves up. You would need to pivot the programme to argue that standing *is* pragmatic, which is a major meta-ethical claim requiring more philosophical defense.

  ### Summary of Reasoning

  I have placed **Coherence of Pooling** first because it is the most novel and vulnerable part of your hypothesis. It is the only question that, if answered negatively, invalidates the core grant proposal. It is also the most tractable for your specific team composition: it relies on intuition testing (philosophy) and scenario manipulation (empirical), without requiring deep legal expertise or complex psychological modeling.

  By leading with this, you avoid the trap of spending three years defining "standing" in the abstract. Instead, you stress-test the *structural claim* of your hypothesis. If standing pools, you have a new model of moral community. If it doesn't, you have a robust critique of a popular emerging view. Either way, it is progress.
