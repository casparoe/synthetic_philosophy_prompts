answer: |-
  This is a sharp question because it forces Thomistic political ontology to confront a socio-technical reality it couldn't conceive: private infrastructure functioning as a public square, and diffuse social coercion replacing unitary sovereign judgment.

  To run Aquinas on this, we have to strip away the modern liberal baggage (rights, free speech) and stick to his metaphysics of authority, the common good, and the ontology of the multitude. We are looking primarily at *Summa Theologiae* II-II, Q. 42 (Sedition), Q. 64 (Killing/Punishment), and *De Regno*.

  Here is the reconstruction of the machinery, the application to your four cases, and the breakdown points.

  ### I. The Machinery: Authority, Sedition, and Punishment

  Aquinas's framework rests on three non-negotiable axioms relevant here:

  1.  **The Monopoly on Coercive Judgment (*ST* II-II, Q. 64, A. 3):** Punitive harm (anything inflicted *contra voluntatem* for the sake of justice) requires *publica auctoritas* (public authority). A private individual cannot punish, only defend. This applies analogically from capital punishment down to lesser penalties. The logic is that the guardian of the common good alone can weigh the good of the whole against the harm to the part.
  2.  **Sedition vs. Legitimate Resistance (*ST* II-II, Q. 42, A. 2):** Sedition is a sin against the unity/peace of the multitude. It is distinct from tyranny. If a ruler becomes a tyrant, resisting him is not sedition *unless* the resistance causes greater disorder than the tyranny itself. However, private individuals cannot initiate this resistance against a *legitimate* (non-usurping) ruler; it requires the "public authority" (representatives of the realm).
  3.  **The Ontology of the Mob:** A crowd (*multitudo*) is not a person. It cannot hold authority. Authority resides in an office or a designated representative. Action by a mob is, by definition, private action aggregated, not public action.

  ### II. Running the Cases

  Here is how Aquinas categorizes your four scenarios based on the *locus* of authority and the *nature* of the act.

  **(a) Crowd Mass-Reporting until Ban**
  *   **Thomistic Classification:** *Seditious Pressure / Private Vengeance.*
  *   **Analysis:** The crowd acts without *publica auctoritas*. They are private individuals. By coordinating to inflict a penalty (exclusion), they are usurping the judicial function. Even if the journalist is "guilty" of some vice, the crowd lacks the standing to punish.
  *   **Verdict:** This is sedition (*ST* II-II, Q. 42). Why? Because it bypasses the order of justice. It substitutes the passion of the multitude for the reason of the judge. Even if the outcome is "just" (the journalist was vile), the *mode* is illicit. It creates a precedent where private passion overrides public order.
  *   **Nuance:** If the crowd is merely *accusing* (denunciation), that is permissible (private individuals can bring charges). But mass-reporting to trigger an automated or pressured ban is not accusation; it is coercive execution.

  **(b) University Disinviting a Speaker**
  *   **Thomistic Classification:** *Domestic/Corporate Governance.*
  *   **Analysis:** A university in Aquinas's view is a *corpus* (body) with internal jurisdiction, similar to a guild or a household. The administrators hold authority over the *use of the university's space*.
  *   **Verdict:** Permissible, *provided* it is done for the good of the university community, not to appease an external mob. If the admin disinvites because the speaker threatens the internal peace or doctrinal integrity of the school, they act as masters of the household. If they disinvite solely because of external pressure (the mob from Case A), they are failing in their duty to protect the community's intellectual good, acting out of fear rather than reason. It is a failure of prudence, not necessarily a violation of justice, unless the university claims public status (state uni), in which case they are agents of the sovereign and must treat speakers with public justice.

  **(c) Company Firing an Employee after a Tweetstorm**
  *   **Thomistic Classification:** *Master/Servant Economic Severance.*
  *   **Analysis:** The employer has authority over the employee *qua* employee, not *qua* citizen. Aquinas distinguishes the political community from the economic household.
  *   **Verdict:** Permissible if the tweet renders the employee unable to fulfill their function or harms the company's common good (profit/reputation). However, if the firing is a *punishment* for a moral failing unrelated to work, the employer is usurping a judicial role. Aquinas would ask: Is this a penalty or a contract termination? If it's a penalty for "sin," it's illicit (private punishment). If it's a recognition that the relationship is no longer tenable (damage to the "household"), it's licit. The Twitter storm is irrelevant data; the damage to the corporate unity is the metric.

  **(d) Platform Demonetizing/Deboosting (Shadow Banning)**
  *   **Thomistic Classification:** *Occult Punishment / Tyranny of the Governor.*
  *   **Analysis:** This is the most problematic. Aquinas insists law and punishment must be *promulgated* (*ST* I-II, Q. 90). Hidden rules violate the nature of law.
  *   **Verdict:** Illicit. The platform acts as a private governor. If it claims the right to regulate speech for the "common good" of the square, it assumes public authority. If it assumes public authority, it must follow public procedures (promulgation, due process). Secret penalties are the hallmark of the tyrant (*De Regno*).

  ### III. The Hard Questions

  #### 1. Sedition or Punishment?
  It is **punishment without authority**, which structurally collapses into **sedition**.
  For Aquinas, punishment (*poena*) is medicinal; it restores the order of justice. Sedition is the disruption of that order. When a private body (mob or corp) inflicts harm to enforce conformity, they claim the sword of justice without the commission of the sovereign.
  *   *Textual hook:* *ST* II-II, Q. 64, A. 3: "It is not lawful for a man to kill a sinner... except by public authority." Scale this down: It is not lawful to inflict civil death (deplatforming) except by public authority.
  *   Therefore, deplatforming by private entities is not "punishment" in the Thomistic sense; it is an act of force. If it disrupts the wider peace of the realm, it is seditious.

  #### 2. Who is allowed to inflict it?
  Only the **Sovereign** (or those delegated).
  Aquinas does not have a robust theory of "intermediate institutions" holding *coercive* power over public speech. He has families, guilds, and the state.
  *   **The Problem:** Modern platforms are private property (Household) but function as public squares (Polity). Aquinas's framework underdetermines this.
  *   **Re-description:** Aquinas would likely argue that if a space functions as a public square, it falls under the jurisdiction of the sovereign. A private owner cannot set the *moral law* of the square, only the *house rules*. Deplatforming for moral reasons (heresy, vice, political error) is a judicial act. Deplatforming for breaking house rules (spam, noise) is domestic discipline. Most "cancel" cases are the former disguised as the latter.

  #### 3. Life vs. Voice (Scaling the Authority Logic)
  Does the authority logic scale down? **Yes.**
  For Aquinas, the requirement for public authority isn't based solely on the *severity* of the harm, but on the *nature* of the act as judicial.
  *   *ST* II-II, Q. 64 distinguishes killing from other harms, but the principle of *authority* is constant. A father can chastise a son (domestic authority), but not exile him from the kingdom (public authority).
  *   **Application:** Removing a voice is a form of exile (civil). If the platform is a "kingdom," the CEO is the king. But since it's a private kingdom within a public one, the CEO's authority is limited to economic contract. To exile someone from the *public discourse* is an act of sovereignty. Private bodies doing this are usurpers.
  *   **Exception:** Self-defense. A platform can remove someone to *defend* the community from immediate harm (e.g., incitement to violence). This is not punishment; it is defense. But "cancel culture" is usually retrospective punishment, not immediate defense.

  #### 4. The Mob: Community or Private Presumption?
  **Private Presumption.**
  Aquinas is explicit that the "people" cannot act as a judge without a head. *De Regno* I.6: The multitude cannot punish the king unless there is some higher authority or representative body to authorize it.
  *   A tweetstorm is not the "voice of the people" (*vox populi*); it is the noise of private passions.
  *   For Aquinas, the "Community" acts through *ordained* representatives. A diffuse mob has no *ordo*. Therefore, its sanction is morally equivalent to a lynch mob, regardless of the "virtue" of the cause. It is sedition because it substitutes private will for public reason.

  ### IV. Where the Framework Collapses (The Breakdown)

  You asked where the analogy genuinely breaks. It breaks in three places:

  **1. The Diffuse Tyrant**
  Aquinas's tyrannicide framework requires a **determinate agent**. You kill *the* tyrant. In cancel culture, who is the tyrant?
  *   Is it the mob? (Headless, unkillable).
  *   Is it the algorithm? (Non-moral instrument).
  *   Is it the CEO? (Often hides behind the mob).
  Aquinas's ethics of resistance relies on imputability. You cannot resist a diffuse system using a framework designed for unitary kings. If there is no single tyrant, there is no one to "off," and the resistance becomes a war against a structure, which looks more like sedition than liberation.

  **2. The Public/Private Hybrid**
  Aquinas operates on a binary: Public (State/Church) vs. Private (Household).
  *   Tech platforms are privately owned public utilities.
  *   Aquinas has no category for a private entity that holds a monopoly on the *means of public communication*.
  *   **Underdetermination:** He would likely default to "Private Property Rights" (the owner rules the house). But this contradicts his own teleology that property serves the common good. If the "house" is the only town square, locking someone out is exile. Aquinas lacks the jurisprudence to adjudicate "private exile from the public square." He would likely defer to the Sovereign (State) to regulate the Platform, but he has no resources to judge the Platform *directly* as a public actor.

  **3. The Nature of the Harm**
  Aquinas's resistance theory is triggered by **physical destruction of the polity** or **spiritual apostasy**.
  *   Does being deplatformed destroy the polity? No.
  *   Does it constitute spiritual harm? Maybe, if it silences truth.
  *   But Aquinas's threshold for resistance is *extreme*. He tolerates a lot of bad rule to avoid the greater evil of disorder.
  *   **The Break:** Cancel culture is often about *social shame* or *economic loss*, not the destruction of the regime. Aquinas's framework is too heavy-duty for this. It's like using a treatise on regicide to judge a labor dispute. The "tyranny" of cancel culture is often a tyranny of manners or economics, which Aquinas places largely in the realm of prudence, not justice requiring resistance.

  ### V. Summary Judgment

  If you force Aquinas to rule:

  1.  **The Mob (Case A):** Guilty of **Sedition**. They are private individuals usurping judicial power, disturbing the peace, and acting on passion rather than reason.
  2.  **The Platform (Case D):** Guilty of **Tyranny** (if they claim public moral authority without public accountability) or **Injustice** (if they punish without promulgated law).
  3.  **The "Cancelled" (Target):** If they are truly teaching error that harms souls, they should be corrected by public authority (Church/State), not private mobs. If they are teaching truth, they are being persecuted, which is a merit, but resisting the mob privately is only allowed in self-defense, not counter-attack.
  4.  **The Analogy:** The tyrannicide framework **does not apply** to the *cancelled person* (they are not a tyrant). It applies to the *Platform/Mob* if they become tyrannical. But since they are diffuse/private, you cannot "kill" them. You must appeal to the higher Sovereign (the State) to regulate them.

  **The Fatal Flaw in the Application:** Aquinas assumes a unified *Bonum Commune* (Common Good). Cancel culture presupposes a fragmented society where there is no agreement on the Good. Aquinas's machinery requires a shared telos to function. Without that, "sedition" and "justice" become indistinguishable, and his framework cannot generate a determinate answer without first settling the metaphysical question of what the Common Good *is*. He would say the debate is occurring in a vacuum of shared reason, making the whole phenomenon a symptom of a diseased polity, not a series of solvable judicial cases.
