  **Node 1:** When the individual is subtracted from the scenario, are the surrounding structural conditions held fixed (so the specific outcome vanishes), or allowed to re-equilibrate (so a substitute steps into the role)?
  *   **Held Fixed** → Go to Node 2
  *   **Re-equilibrate** → Go to Node 3

  **Node 2:** (If Held Fixed) Is the individual's contribution primarily a **trigger** (occasion, timing, coordination of forces) or an **author** (content, direction, ideology)?
  *   **Trigger** → Go to Node 4
  *   **Author** → Go to Node 5

  **Node 3:** (If Re-equilibrate) Which substitution preserves the outcome: **(a)** a near-double sharing the same dispositions, **(b)** a competent but ordinary contemporary, or **(c)** no one (the outcome changes fundamentally)?
  *   **(a) Near-Double** → Go to Node 5
  *   **(b) Ordinary Contemporary** → Go to Node 6
  *   **(c) No One** → Go to Node 7

  **Node 4:** Does the individual's removal merely **displace** an outcome that would have arrived anyway, or **divert** history onto a path it could not otherwise have reached?
  *   **Displace** → Go to Node 8
  *   **Divert** → *Leaf: Empty Combination (Incoherent)*

  **Node 5:** Does structure determine the **set** of possible outcomes, only their **relative probabilities**, or **neither**?
  *   **Set** → *Leaf: Empty Combination (Incoherent)*
  *   **Relative Probabilities** → Go to Node 8
  *   **Neither** → Go to Node 9

  **Node 6:** If a rival with opposite aims seized the levers of power, would structural pressures force them to conform to the original path?
  *   **Yes (Conform)** → Go to Node 8
  *   **No (Diverge)** → Go to Node 10

  **Node 7:** Is the individual a necessary condition (*sine qua non*) or merely an accelerant?
  *   **Necessary** → Go to Node 9
  *   **Accelerant** → Go to Node 8

  **Node 8:** (Convergence Node) Do you view the outcome as **inevitable** given the conditions, or **contingent** on the convergence of factors?
  *   **Inevitable** → *Leaf A*
  *   **Contingent** → *Leaf B*

  **Node 9:** (Agency Node) Is the individual's impact limited to selecting among structurally available options, or creating new options?
  *   **Selecting Options** → *Leaf C*
  *   **Creating Options** → *Leaf D*

  **Node 10:** (Constraint Node) Does the structure constrain the *means* or the *ends*?
  *   **Means** → *Leaf E*
  *   **Ends** → *Leaf F*

  ---

  ### Leaves (Named Positions)

  **Leaf A: Structural Determinism**
  *   **Path:** Re-equilibrate → Ordinary Contemporary → Rival Conform → Inevitable.
  *   **Awkward Commitment:** You must accept that specific human intentions are largely epiphenomenal to the logical requirements of the system.

  **Leaf B: Probabilistic Structuralism**
  *   **Path:** Re-equilibrate → Ordinary Contemporary → Rival Diverge → Contingent.
  *   **Awkward Commitment:** You must explain why the structure strongly favored one outcome without admitting it determined that outcome.

  **Leaf C: Agency as Selection**
  *   **Path:** Re-equilibrate → Near-Double → Selecting Options.
  *   **Awkward Commitment:** You must concede that while the individual matters, they could not have chosen anything truly outside the historical menu.

  **Leaf D: Great Man Theory**
  *   **Path:** Held Fixed → Author → Neither Structure → Creating Options.
  *   **Awkward Commitment:** You must defend the view that without this specific person, the surrounding conditions were insufficient to generate the outcome.

  **Leaf E: Structural Constraint with Agency**
  *   **Path:** Re-equilibrate → Ordinary Contemporary → Rival Diverge → Means Constrained.
  *   **Awkward Commitment:** You must argue that rivals could have achieved different ends, but only using the tools the structure provided.

  **Leaf F: Conjunctural Explanation**
  *   **Path:** Re-equilibrate → No One → Necessary → Creating Options.
  *   **Awkward Commitment:** You must maintain that the structure created the possibility, but only this specific conjunction of person and moment actualized it.

  **Leaf G: Catalytic Individualism**
  *   **Path:** Held Fixed → Trigger → Relative Probabilities → Contingent.
  *   **Awkward Commitment:** You must argue the outcome was likely, but the individual is solely responsible for *when* and *how* it arrived.

  **Leaf H: Empty Combination (Incoherent)**
  *   **Path:** Held Fixed → Structure Determines Set.
  *   **Diagnosis:** Incoherent; if conditions are fixed on the individual, structure cannot be determining the set of outcomes independently.

  **Leaf I: Empty Combination (Unattractive)**
  *   **Path:** Re-equilibrate → Ordinary Contemporary → Divert.
  *   **Diagnosis:** Unattractive; if any ordinary contemporary produces the outcome, the path is not genuinely diverted by the specific individual.

  **Leaf J: Indistinguishable Pair Flag**
  *   **Pair:** **Leaf B (Probabilistic Structuralism)** and **Leaf E (Structural Constraint with Agency)**.
  *   **Reason:** Both occupy the space where structure influences but does not determine; the distinction relies on the student's nuanced interpretation of "rival divergence" which may collapse in practice.

  ---

  ### Unoccupied Combinations & Diagnoses

  1.  **Combination:** Held Fixed + Outcome Displaced (Inevitable).
      *   **Diagnosis:** **Incoherent.** If conditions are held fixed and the individual removed, the outcome vanishes by definition; it cannot be inevitable/displaced.
  2.  **Combination:** Re-equilibrate + No Substitute + Outcome Displaced.
      *   **Diagnosis:** **Incoherent.** If no substitute steps in and the outcome changes, the outcome was not inevitable/displaced.
  3.  **Combination:** Trigger + Author (Simultaneous).
      *   **Diagnosis:** **Incoherent.** These are defined as mutually exclusive categories in this logical space (timing vs. content).
  4.  **Combination:** Re-equilibrate + Ordinary Contemporary + Structure Determines Neither Set nor Probabilities.
      *   **Diagnosis:** **Unexplored.** Few theorists argue that ordinary substitutes work *and* that structure exerts no probabilistic pressure.
  5.  **Combination:** Held Fixed + Structure Determines Relative Probabilities.
      *   **Diagnosis:** **Unattractive.** This creates a tension between the individual's necessity and the structure's probabilistic dominance that most Great Man theorists reject.
