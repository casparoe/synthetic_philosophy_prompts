      *   **The Model:** Source emits pairs with "ledgers" (deterministic outcomes for all settings). Joint distribution of ledgers depends on *both* future settings ($\lambda \sim P(\lambda | a, b)$). No superluminal influence between wings. No signalling. Reproduces QM correlations.
      *   **The Dispute:** Locality vs. Non-locality, No-signalling vs. Factorisability, Tautology charge.

  2.  **Deconstruct the Model:**
      *   This is a "Superdeterministic" or "Measurement Dependent" model.
      *   Standard Bell Locality (Bell's 1976 formulation) requires $P(A, B | a, b, \lambda) = P(A | a, \lambda) P(B | b, \lambda)$ AND $P(\lambda | a, b) = P(\lambda)$.
      *   The proposed model violates the second condition: $P(\lambda | a, b) \neq P(\lambda)$. The hidden variable $\lambda$ (the ledgers) is correlated with the settings $a$ and $b$.
      *   Colleague A calls it "local" because there's no action-at-a-distance *during* measurement ($A$ depends on $a, \lambda$; $B$ depends on $b, \lambda$).
      *   Colleague B calls it "non-local" (or at least violating Bell's locality condition) because the source knows the settings.

  3.  **Analyze the Six Moves:**

      *   **Move 1 (A):** "The model is local. Each particle's outcome... depends only on its own ledger and its own setting... correlation is not causation."
          *   *Analysis:* A is using a definition of locality based on parameter independence at the measurement stage (often called "Outcome Locality" or part of Bell Locality). However, Bell's theorem specifically targets the independence of $\lambda$ from settings.
          *   *Verdict:* Partly right (operationally local at measurement), but misleading regarding Bell's framework.

      *   **Move 2 (B):** "The model is not local. The distribution of ledgers depends on both settings... source's state is not independent of the distant setting, and that is precisely what the locality condition in Bell's theorem forbids."
          *   *Analysis:* B is referring to the "Statistical Independence" or "Measurement Independence" assumption ($P(\lambda|a,b) = P(\lambda)$). Violating this is often called "Superdeterminism". Is this "non-local"? Technically, it implies a common cause in the past connecting settings and source. It violates the spirit of Bell Locality which assumes free choice.
          *   *Verdict:* Clearly right within the standard Bell framework. The violation of measurement independence is the key feature here.

      *   **Move 3 (A):** "'Local' ought to mean 'no superluminal signalling', and the model does not permit signalling, so it is local."
          *   *Analysis:* This conflates "No-Signalling" (a property of the observable statistics) with "Locality" (a property of the underlying ontological model). Bell distinguished these. No-signalling is necessary for locality but not sufficient.
          *   *Verdict:* Clearly mistaken (conceptually). No-signalling $\neq$ Locality in the context of hidden variable models.

      *   **Move 4 (B):** "No-signalling is a consequence of locality, not its definition, and that a model can be no-signalling yet nonlocal."
          *   *Analysis:* This is the standard view. Bohmian mechanics is non-local but no-signalling. This model is measurement-dependent but no-signalling.
          *   *Verdict:* Clearly right.

      *   **Move 5 (A):** "If locality is defined as the condition that the joint outcome distribution factorises given the hidden state, Bell's theorem becomes a tautology..."
          *   *Analysis:* This is a common criticism (e.g., by H. Price or superdeterminists). It claims Bell assumes what he proves. However, factorisability is derived from physical principles (Local Causality), not just stipulated.
          *   *Verdict:* Partly right (it highlights a logical structure), but mostly mistaken (it ignores the physical justification for factorisability).

      *   **Move 6 (B):** "Factorisability is not a definition but a substantive physical assumption, and that a model violating it is a genuine discovery about the world."
          *   *Analysis:* Factorisability follows from Reichenbach's Common Cause Principle + Relativistic causality. It's a physical constraint.
          *   *Verdict:* Clearly right.

  4.  **Synthesize the Adjudication:**
