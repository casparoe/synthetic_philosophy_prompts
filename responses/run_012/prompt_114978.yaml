      *   *The Problem:* How can one deceive oneself? To deceive, you must know the truth and intentionally make someone else believe a lie. If you are both deceiver and deceived, you must know the truth and not know it simultaneously. Contradiction.
      *   *Position 1: Intentionalism/Standard Model (Sartre, etc.).* The self-deceiver intentionally tries to believe something false. Requires a kind of bad faith. The agent is active in the deception.
      *   *Position 2: Deflationism/Non-Intentionalism (Mele, etc.).* No intentional deception needed. It's a bias, a motivationally biased belief formation. You avoid evidence because it's painful, not because you're plotting against yourself. The paradox dissolves because it's not really "deception" in the interpersonal sense.
      *   *Position 3: Partitioning/Divided Mind (Freud, Pears, etc.).* The mind is modular. Sub-agent A knows the truth, Sub-agent B believes the lie. They don't communicate fully. Solves the simultaneity problem by spatializing the mind.

  3.  **Translate to Narrative Vocabulary:**
      *   *Close Third Person:* The narrator hovers near the character's consciousness.
      *   *Avowal:* What the character says/thinks explicitly.
      *   *Action:* What the character does.
      *   *Inference:* What the reader guesses based on gaps between avowal and action.
      *   *Tools:* Free Indirect Discourse (FID), Unreliable Narration, Irony.

