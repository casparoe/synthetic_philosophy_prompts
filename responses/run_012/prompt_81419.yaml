      *   **Constraints:** No history of PR, no list of thinkers. Focus on the *structure of the argument*, *load-bearing premises*, and correct potential misreadings.

  2.  **Deconstruct Mill's Argument (Mental Sandbox):**
      *   *Text:* Chapter VII of *Considerations on Representative Government*.
      *   *Core Thesis:* "True democracy" means representation of *all*, not just the majority. "False democracy" is the tyranny of the majority.
      *   *Mechanism:* Mill advocates for Thomas Hare's scheme (Single Transferable Vote - STV), which is a form of PR, but his *justification* is philosophical, not just mechanical.
      *   *Question 1 (PR vs. Something Else):* It *is* PR (specifically STV), but the *goal* isn't just mathematical proportionality of parties. It's about the representation of *minds* and *intellectual diversity*. Modern PR is often about party lists. Mill was about individual representatives chosen by affinities.
      *   *Question 2 (Outvoted vs. Unrepresented):* Mill distinguishes between *governing* and *deliberating*. If my voice is never heard in the assembly, I am not just politically defeated; I am politically invisible. The "oppression" isn't necessarily legal tyranny, but the exclusion of my interests/views from the *discussion* that shapes the law.
      *   *Question 3 ("Section"):* This is crucial. Mill uses "section" loosely. It means a distinct interest or opinion. Sometimes class (working class), sometimes intellectual (elite), sometimes regional. The load-bearing premise is that society is pluralistic, not binary.
      *   *Question 4 (Intrinsic vs. Instrumental):* Mill is a utilitarian, so ultimately consequences matter. *However*, he argues that good consequences *require* diverse input. So representation is instrumentally valuable for *truth-seeking*, not just preference aggregation. A minority getting "decent outcomes" by luck or benevolence isn't enough because they lack *security* and *agency*.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the user's sharp reading. They aren't misreading, but they need to calibrate Mill's specific utilitarian/liberal framework.

      *   **Point 1: Is it Modern PR?**
          *   *Verdict:* Yes and No.
