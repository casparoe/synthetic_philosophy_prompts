          *   *Premise:* Parliament is a place of *argument*, not just *decision*. If a view isn't present, it can't be argued. If it can't be argued, the majority decision is based on incomplete information.
          *   *Oppression:* It's not necessarily active persecution. It's "virtual disenfranchisement." Your vote literally counts for zero in terms of securing a voice.

