      *   *Re-evaluating:* Most philosophy of AI literature (e.g., Dan Dennett, David Chalmers, recent papers on Simulator Theory) leans towards the idea that "agency" is an interpretive stance. If the intentional stance works better for the hidden optimization, it's an agent.
      *   *Okay, I will argue for the **Simulator View**.* Why? Because the "goals" (loss minimization) are not represented *in* the system as goals. They are external constraints. The system does not *represent* the reward signal as a goal to be achieved. It represents text. The hidden computation is just calculating probabilities conditioned on "high reward." It is simulating a high-reward response. It is not *pursuing* reward in the sense of an agent.
