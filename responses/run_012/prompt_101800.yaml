answer: |-
  First, the plain answer you asked for: you have the assumptions the right way round. SIA (Self-Indication Assumption) does indeed favor hypotheses with more observers, effectively granting "more copies, more credence." SSA (Self-Sampling Assumption) does not; it treats you as a random sample from existing observers, often leading to the Doomsday Argument (favoring smaller totals where you are more likely to be early). You are not backwards.

  As for the form: cumulative verse is only a gimmick if the repetition doesn't earn its weight. Here, using incremental repetition to mimic the swelling prior probability of SIA is structurally sound. It forces the reader to carry the accumulating baggage of the philosopher's logic, making the silence of the SSA counter-argument feel heavier by its absence. It works.

  Here is the poem.

  I sit alone and reason thus.

  I sit alone and reason thus.
  My existence is a vote for size.

  I sit alone and reason thus.
  My existence is a vote for size.
  The vast hypothesis grows dense.

  I sit alone and reason thus.
  My existence is a vote for size.
  The vast hypothesis grows dense.
  I need no telescope to see.

  I sit alone and reason thus.
  My existence is a vote for size.
  The vast hypothesis grows dense.
  I need no telescope to see.
  Because each observer adds a weight.

  I sit alone and reason thus.
  My existence is a vote for size.
  The vast hypothesis grows dense.
  I need no telescope to see.
  Because each observer adds a weight.
  Until the void is full of me.

  I sit alone and reason thus.
  My existence is a vote for size.
  The vast hypothesis grows dense.
  I need no telescope to see.
  Because each observer adds a weight.
  Until the void is full of me.
  But the chair creaks under the face.
