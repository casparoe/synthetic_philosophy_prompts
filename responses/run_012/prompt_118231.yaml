  The shortlist, ranked
  1. **Pragmatics of Selection.** This is upstream because if the text is about satisfying requests ("seeking a horse"), ontological identity is irrelevant; functional equivalence suffices. It is highly tractable for you because the "seeking" examples are explicit in standard translations, requiring no textual criticism. It is somewhat neglected compared to semantic debates, which often assume a static context rather than a dialogic one. Most commentaries focus on what "white horse" means, not what one *does* with it. A good outcome looks like an essay demonstrating that the paradox dissolves when shifted from "what is true" to "what works," aligning with your rationalist habit of finding functional cruxes. You can map the argument's moves without needing to resolve the meaning of specific particles. This offers the highest payoff for minimal philological risk. It connects directly to your experience with rationalist discourse, where the cash value of a claim is often its operational impact.
  2. **Semantics of Compound Names.** This is upstream of the copula question because it defines the terms being related. It is tractable using ordinary philosophy of language (intension/extension) without deep Sinology. It is less neglected but offers high payoff for clarity. A good outcome is a formal model showing how "white" restricts the extension of "horse" without denying membership, resolving the "not a horse" claim as a category error. This allows you to engage with analytic philosophers who might dismiss the text otherwise. However, it risks getting bogged down in competing semantic theories without a decisive textual arbiter. You will be relying on how translators render particles, which introduces noise.
  3. **Grammatical Categories.** This is potentially upstream if grammar dictates logic, but it is less tractable for you. It requires linguistic theory you lack, risking reliance on secondary interpretations. It is well-trodden (Hansen) but contested. A good outcome is rare for a non-specialist; you might only replicate existing arguments. Avoid unless you find a linguistic angle others missed. It risks becoming a philological trap where you cannot verify the primary data. You cannot check the grammar yourself, making this a dependency hazard. If you choose this, you are merely summarizing linguists, not doing philosophy.

  Field agenda versus my agenda
  The field prioritizes textual integrity, variant readings, and historical context. They ask, "What did Gongsun Long mean in 300 BCE?" You should ask, "Does this argument work?" The field needs philological defense against interpolation claims; you need logical coherence. Your advantage is treating the text as a philosophical peer, not an artifact. Don't try to beat them at history; beat them at logic. If you chase philology, you will fail; if you chase logic, you offer something they often lack: a rigorous reconstruction of the argument's validity independent of historical uncertainty. Your essay should signal awareness of philological limits while asserting philosophical independence. The divergence is sharp: they want history; you want truth. Acknowledge this explicitly to avoid seeming naive about the textual tradition while maintaining your philosophical focus. Sinologists may view your ahistorical approach as reductionist, but philosophers will value the clarity. Your comparative advantage lies in cross-disciplinary synthesis, not archival digging.

  What would move the ranking
  If an authoritative philological study proves the "seeking" passages are later Mohist interpolations, the Pragmatics question collapses, moving Semantics to #1. Conversely, if a new linguistic analysis shows Classical Chinese lacks a coherent count/mass distinction, the Grammar question becomes a trap, reinforcing Pragmatics. Evidence of rhetorical context (e.g., specific debate opponents) could also shift focus to Historical Intent, but textual evidence there is scarce. Ultimately, any evidence suggesting the text is not a unified argument would force you to abandon reconstruction for fragmentation analysis. You should monitor new translations for notes on textual stability regarding the "seeking" examples specifically. If the core examples vanish, your entire pragmatic thesis vanishes with them.
