answer: |-
  This is a precise and necessary dissection. You are correct to suspect that the analogy is doing too much heavy lifting, often obscuring the specific moral architecture of Anscombe's objection. The comparison between the atomic bombings and the conventional area bombing campaign is ubiquitous in public discourse, but in philosophical terms, it is often a category error masquerading as a parity argument.

  Below is an audit of the analogy, structured for your purposes, with British spelling throughout. I have explicitly demarcated areas of scholarly consensus regarding Anscombe and the ethics of bombing from areas that remain genuinely contested.

  ***

  ### 1. The Correspondence Table

  To see where the analogy strains, we must first map the terms. The analogy attempts to equate two distinct military operations to render a moral judgement on the agent (Truman) or the act (bombing).

  | **Domain** | **Atomic Bombing (Hiroshima/Nagasaki)** | **Conventional Area Bombing (Tokyo/Dresden)** | **Level of Description** |
  | :--- | :--- | :--- | :--- |
  | **The Weapon** | One nuclear device | Thousands of incendiary clusters | Act-token (physical instrument) |
  | **The Delivery** | One or two aircraft | Fleets of hundreds (B-29s/Lancasters) | Act-token (method of delivery) |
  | **The Decision** | Discrete order by Head of State (Truman) | Standing policy by Command (LeMay/Harris) authorised by Heads of State | Act-type (authorisation) |
  | **The Target** | City centre (civilian/mixed) | City centre (civilian/mixed) | Intentional object |
  | **The Harm** | Instant vapourisation + radiation sickness | Firestorm + asphyxiation + burns | Consequence (outcome) |
  | **The Metric** | ~140,000–200,000 dead (per city) | ~100,000 dead (Tokyo); ~25,000 (Dresden) | Consequence (magnitude) |
  | **The Temporal Unit** | A singular moment (August 1945) | A campaign habit (1942–1945) | Policy vs. Event |

  **What the Picture Quietly Assumes:**
  1.  **Commensurability of Harm:** It assumes a death by radiation is morally equivalent to a death by fire, and that these can be summed arithmetically.
  2.  **Weapon Neutrality:** It assumes the *kind* of weapon is morally irrelevant next to the *yield* of destruction.
  3.  **Agentic Parity:** It assumes Truman's personal authorisation is equivalent to the bureaucratic momentum of Bomber Command or the 20th Air Force.
  4.  **Consequentialist Primacy:** It assumes the moral weight rests primarily on the body count (magnitude) rather than the intention or the nature of the act.

  ***

  ### 2. Where the Analogy Breaks (The Disanalogies)

  Your hunch is correct: for Anscombe, magnitude is largely orthogonal. The analogy breaks where it attempts to equate *scale* with *status*.

  **A. The Singularity of the Decision (Agency)**
  *   **Disanalogy:** Area bombing was a policy drift; the atomic bomb was a singular, conscious choice.
  *   **Why it matters:** Anscombe's protest was against Oxford honouring *Truman*. Her focus was on personal moral responsibility. Area bombing was diffuse (Churchill, Portal, Harris, Roosevelt). The atomic bomb was uniquely traceable to one man's signature. The analogy obscures this by treating them as equivalent 'policies'. For Anscombe, the clarity of Truman's agency made him a more fitting target for moral censure, not less.
  *   **Status:** **Consensus.** Historians and philosophers agree the decision-making structure differed significantly.

  **B. The Nature of the Destruction (Means)**
  *   **Disanalogy:** Radiation introduces a harm that persists beyond the act and affects non-combatants indiscriminately over time (genetic damage, long-term sickness).
  *   **Why it matters:** Even if one accepts the 'death count' parity, the *quality* of the suffering differs. Some argue this makes the atomic bomb a distinct moral category (a 'super-weapon').
  *   **Status:** **Contested.** Consequentialists often argue death is death; Deontologists and Virtue Ethicians argue the *manner* of killing carries moral weight.

  **C. The Strategic Necessity Claim**
  *   **Disanalogy:** Area bombing was argued as 'weakening war industry' (even if civilians were targeted). The atomic bomb was explicitly argued as 'shocking the leadership into surrender via civilian destruction'.
  *   **Why it matters:** This touches on the Doctrine of Double Effect (see below). If the civilian death was a 'side effect' of destroying a factory (Tokyo), some argue it is distinct from civilian death being the *mechanism* of victory (Hiroshima).
  *   **Status:** **Contested.** Historical debate continues over whether Japan was already near surrender, and whether the bombs were intended for military or psychological effect.

  ***

  ### 3. Anscombe's Actual Argument: Consensus vs. Contested

  This is the critical section for your piece. There is a widespread public misunderstanding of Anscombe's position which the analogy reinforces.

  **Consensus (What Anscombe Actually Said)**
  *   **Intention over Magnitude:** There is near-universal agreement among scholars of Anscombe (e.g., Roger Teichmann, Mary Geach, James Conant) that her objection was not primarily about the *number* of dead. It was about the **intentional killing of the innocent**.
  *   **Consistency:** Anscombe did not believe Truman was a murderer *because* he used an atomic bomb rather than incendiaries. She believed he was a murderer because he ordered the killing of civilians. **She also opposed the area bombing of German cities.** She was not inconsistent. In her view, Churchill and Harris were also liable to moral censure, though Truman was the one seeking an honorary degree in 1956.
  *   **The Principle:** For Anscombe, certain acts are forbidden regardless of consequences. Deliberately targeting non-combatants is one such act. Therefore, the comparison "Tokyo killed more" is irrelevant. If Tokyo was murder, Hiroshima is murder. If Hiroshima is justified, Tokyo must be too. You cannot use the wrongness of A to justify B.

  **Contested (Where Scholars Disagree)**
  *   **The Definition of 'Intention':** There is significant debate over whether Anscombe's application of the Doctrine of Double Effect holds water in modern warfare. Critics (e.g., Jonathan Glover, utilitarian ethicists) argue that in total war, the distinction between 'targeting industry' and 'targeting workers' is semantic. They argue Anscombe relies on a psychological distinction that collapses under scrutiny.
  *   **The 'Murder' Label:** While it is consensus that Anscombe *called* it murder, it is contested whether the label 'murder' (a legal and moral term implying malice) applies to heads of state in total war contexts. Some philosophers argue 'war crime' is the appropriate category, reserving 'murder' for private violence. Anscombe rejected this distinction, but not all ethicists follow her.
  *   **Radicalism:** You mentioned the 'absolutist' view that she wasn't radical enough. Some scholars argue Anscombe was actually *more* radical than the absolutists, because she rejected the utilitarian calculus entirely. The absolutists often say "Everyone is a murderer" (a consequentialist summing up). Anscombe said "This act is forbidden" (a deontological constraint).

  ***

  ### 4. Verdict on the Two Conclusions

  Based on the audit, here is how the two versions of the analogy fare when subjected to Anscombe's actual framework.

  **The Deflationary Version ("Hiroshima is fine because Tokyo happened")**
  *   **Verdict:** **Collapses.**
  *   **Reasoning:** This relies on a *tu quoque* fallacy. Even if area bombing was morally permissible (which Anscombe denied), it does not render the atomic bombing permissible. Furthermore, if area bombing was *impermissible*, citing it does not cleanse the atomic bomb; it merely indicts more people. It treats morality as a quota system ("we've already killed enough people to make this acceptable") rather than a constraint on action.
  *   **Anscombe's View:** She would reject this entirely. The existence of prior wrongs does not license new ones.

  **The Absolutist Version ("Tokyo was murder too")**
  *   **Verdict:** **Survives, but not because of the analogy.**
  *   **Reasoning:** The conclusion is correct by Anscombe's lights, but the analogy is not the proof. The proof is the underlying principle (do not kill innocents intentionally). The analogy merely illustrates consistency. However, this version risks implying that the atomic bomb is only objectionable *if* we also condemn Tokyo. Anscombe would argue the atomic bomb is objectionable *in itself*, regardless of Tokyo.
  *   **Nuance:** This version is useful for highlighting hypocrisy, but it concedes too much to consequentialism by focusing on the comparison of outcomes rather than the nature of the acts.

  ***

  ### 5. A Better Comparison

  If the 'Bigger Bomb' analogy is flawed because it focuses on magnitude, what comparison captures the *kind* of wrong Anscombe identified?

  **Suggestion: The Poisoning of a Well vs. The Siege of a City**
  *   **The Analogy:** Compare the atomic bomb to poisoning a water supply (indiscriminate, affects combatants and non-combatants equally, persists over time) versus a conventional siege or bombardment (targeted at defenders, though civilians may suffer).
  *   **Why it works:**
      1.  **Indiscrimination:** It highlights the inability to distinguish combatant from non-combatant in the effect of the weapon.
      2.  **Intention:** Poisoning a well is traditionally viewed as a treacherous act (*malum in se*), regardless of how many die. A siege might be permissible under certain codes of war; poisoning is not.
      3.  **Agency:** It returns focus to the choice of *means* rather than the *end*.
  *   **Limit:** Like all analogies, it is imperfect (a siege kills civilians too), but it shifts the debate from 'how many died' to 'what did you do to them'.

  **Alternative: The Assassination of a Head of State**
  *   **The Analogy:** Compare dropping the bomb to sending a sniper to kill the Emperor or the Prime Minister to end the war.
  *   **Why it works:** It isolates the 'decapitation' strategy. If we forbid killing the leader directly to force surrender (as many laws of war did at the time), why is killing the population to force the leader permissible? This aligns with Anscombe's focus on the *intention* to coerce via violence against the innocent.

  ***

  ### 6. Summary for the Piece: Consensus vs. Contested

  To ensure you are not quoting a contested reading as fact, here is the breakdown:

  **You can state as Consensus:**
  *   Anscombe's objection was based on the **intentional killing of the innocent**, not the specific technology of the atomic bomb.
  *   Anscombe **also opposed the conventional area bombing** of Germany and Japan; she was not singling out Truman for using a nuclear weapon specifically, but for the act of targeting civilians.
  *   The analogy 'Atomic Bomb = Bigger Bomb' relies on **consequentialist reasoning** (counting bodies), whereas Anscombe's reasoning was **deontological** (adherence to moral law).
  *   The deflationary argument ('Tokyo was worse') is logically invalid within Anscombe's framework (two wrongs do not make a right).

  **You must frame as Contested/Debated:**
  *   Whether Anscombe's distinction between 'intended' and 'foreseen' civilian deaths (Double Effect) is philosophically robust. (Many secular ethicists reject it).
  *   Whether the term 'murder' is the correct categorisation for state acts of war, or if 'war crime' is more precise. (Anscombe insisted on 'murder'; legal scholars often distinguish).
  *   Whether the atomic bomb introduced a qualitatively new moral threshold (radiation/existential risk) or was merely a quantitative increase in firepower. (Historians and ethicists remain divided).
  *   Whether Truman's personal agency was as clear-cut as Anscombe assumed, given the military advice and momentum he faced. (Revisionist history complicates the 'one man' narrative).

  ### Final Thought for the Narrative

  The analogy persists because it is comfortable. It allows the deflationist to avoid condemning Tokyo, and the absolutist to condemn everything without examining *why*. Anscombe's discomfort—which caused the scandal at Oxford—was her refusal to accept the calculus. She insisted that some things are not to be done, even if doing them ends the war, and even if everyone else is doing them.

  The analogy asks: "Is this bomb worse than that bomb?"
  Anscombe asked: "Is this act permissible at all?"

  Those are not the same question. Your piece might serve readers best by showing how the analogy allows us to evade the second question by arguing endlessly over the first.
