  The biologist counters, "Tell that to a ring species. Or 'fish'—which is just everything aquatic that isn't a tetrapod. It's a convenience, not a clade."

  The chemist winces. "Okay, point taken. But at least minerals are solid. Except… Jade. Nephrite and jadeite. Different structures, same name. We got that wrong for centuries."

  They sit in silence, realizing their maps are all a bit smudged. They turn to the philosopher sitting on the stool between them.

  "So," asks the chemist. "If the joints are messy, and the categories are convenient… what exactly do *you* do?"

  The philosopher brushes some dust off their jacket and says:

