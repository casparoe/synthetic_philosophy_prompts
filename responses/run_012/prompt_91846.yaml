answer: |-
  You have put your finger on the open secret of anti-doping: there is no coherent philosophical theory of "health" or "enhancement" underpinning the current regime. If there were, LASIK would be banned (it enhances beyond species-typical function), TUEs wouldn't exist (the physiological effect of the drug is identical regardless of diagnosis), and natural genetic outliers would be handicapped (if fairness is the goal).

  The system does not run on a **Normal-Function View** (restoring health) or a **Suffering View** (alleviating pathology). It runs on a **Coercion and Policing View**.

  Here is the functional breakdown of what the distinction is actually doing, what it presupposes, and what parts of the machinery are load-bearing versus decorative.

  ### 1. The Real Presupposition: It's About Access, Not Biology
  The therapy/enhancement distinction is not a medical boundary; it is a bureaucratic proxy for **accessibility and coercion**.

  *   **The TUE System:** The reason a drug is legal with a diagnosis and illegal without one isn't because the molecule acts differently in your body. It's because the system presupposes that a sick person *needs* the drug to participate at all, whereas a healthy person taking it is engaging in an arms race. The TUE isn't validating the physiology; it's validating the *necessity*.
  *   **The Biological Passport:** This presupposes that *change* is the cheat, not the *state*. It assumes that a natural outlier is part of the "lottery of birth" (acceptable), but an artificial spike is a result of resource allocation (unacceptable).
  *   **The Absolute Thresholds (e.g., Testosterone in Women's Sports):** This contradicts the Passport. Here, the "natural lottery" is deemed *too* unfair for the specific category to function. This reveals that the system isn't protecting "health," it's protecting **category integrity**. When a natural advantage becomes so large it threatens the spectacle or the definition of the division (e.g., "women's racing"), the system switches from monitoring *behavior* to policing *biology*.

  **The Theory Underneath:** The coherent theory is the **Anti-Coercion Principle**. The rules exist primarily to prevent a scenario where athletes are *forced* to endanger their long-term health or undergo invasive procedures just to remain competitive.
  *   If EPO is allowed, every cyclist must take it or lose.
  *   If LASIK is allowed, you don't *have* to get it to compete (you can wear glasses/contacts), and it doesn't require ongoing toxic maintenance.
  *   If TUEs weren't allowed, sick athletes would be excluded from the profession entirely.

  ### 2. Is it Fairness All the Way Down?
  Yes, but a specific, narrow slice of fairness. It is not "equal opportunity" (since genetics vary wildly). It is **"equalized coercion."**

  The system tolerates the unfairness of the genetic lottery (the skier with the high-oxygen mutation) because policing genetics is impossible without sliding into eugenics. However, it bans the pharmacological lottery because that is susceptible to regulation.

  The distinction between therapy and enhancement is doing **no real work** physiologically. It is doing **all the work** legally. It provides the administrative hook that allows regulators to ban a substance without banning it for everyone (which would hurt the sick) or allowing it for everyone (which would create an arms race).

  ### 3. What the Rulebook Would Look Like (If We Were Honest)
  If you stripped away the pretense of "treating vs. enhancing" and optimized for the actual goals (preventing coercion, maintaining spectacle, ensuring policability), the rulebook would change drastically.

  **What you could quietly drop:**
  *   **The Therapy/Enhancement Language:** This is the source of the confusion. Replace it with "Permitted" and "Prohibited." Acknowledge that a permitted drug is permitted because the risk of coercion is low or the medical necessity is high, not because it isn't an "enhancer."
  *   **The Secrecy of TUEs:** If the goal is fairness, the public and competitors should know who has an exemption. The current secrecy protects the athlete's privacy but undermines the integrity of the competition. You could drop the secrecy without changing the physiological outcome, but it would increase trust.
  *   **Absolute Biological Thresholds (in most cases):** These are scientifically messy and ethically fraught (as seen in the Semenya cases). They are only "needed" if you are committed to binary sex categories that strictly rely on hormonal baselines. If you moved to open categories or more granular grouping, you could drop the policing of natural testosterone.

  **What you actually need (The Load-Bearing Walls):**
  *   **The Anti-Coercion Ban:** You must keep the ban on substances that require ongoing, risky administration to maintain a competitive edge. This is the only way to stop sport from becoming a contest of who is willing to destroy their liver/kidneys/heart.
  *   **The "Accessibility" Test:** You need a rule that asks: *Is this intervention available to all competitors at reasonable cost and risk?*
      *   **LASIK:** Passes. It's one-time, relatively safe, and available.
      *   **Gene Doping:** Fails. It's risky, expensive, and irreversible.
      *   **High-Altitude Tents:** Borderline. They are allowed because they are passive (you sleep in them) rather than active (injection), and they mimic a natural environment.
  *   **The Policing Feasibility Clause:** You have to ban things you can actually test for. This is why some drugs linger on the banned list even if they aren't performance-enhancing, and why others are ignored. If you can't detect it reliably, a ban creates false positives and destroys trust.

  ### 4. The Genetic Mutant Problem
  To answer your specific question about the cross-country skier with the oxygen mutation:
  *   **Current Practice:** Let him compete. He is "natural."
  *   **Pure Fairness View:** Handicap him or create a new class.
  *   **Pragmatic View:** You cannot ban him without banning *talent*. Once you start measuring VO2 max limits or muscle fiber ratios, you are no longer testing training and will; you are testing compliance with a physiological median.

  The system *needs* to allow the mutant. Why? Because the "mutant" is the spectacle. We watch sports to see the outer limits of human potential. If we cap the biology, we cap the spectacle. We only intervene when the biology is *acquired* artificially, because that implies the limit is financial/medical rather than human.

  ### Summary
  The therapy/enhancement distinction is a **useful fiction**. It allows regulators to manage risk without admitting that they are managing a business model.

  *   **What to keep:** The prohibition on interventions that create a "health arms race" (ongoing, risky, pharmacological).
  *   **What to drop:** The moralizing language about "naturalness." A carbon-fiber prosthetic is not natural, but it's often allowed. A natural hormone spike is natural, but often banned.
  *   **The Real Rule:** "You may not gain an advantage through a method that is (A) dangerous to long-term health, (B) unavailable to the majority of competitors, or (C) impossible to police."

  If you applied *that* rule consistently, TUEs would still exist (Condition A), LASIK would stay (fails B and C), and the genetic mutant would stay (fails C). The inconsistency you see vanishes when you stop asking "Is this therapy?" and start asking "Does this force everyone else to harm themselves to keep up?"
