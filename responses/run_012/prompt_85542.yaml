  1. **Being disbelieved because of a hearer's prejudice about your social group.** (Rating: 10/10)
     This is the paradigmatic case of testimonial injustice, directly undermining a speaker's credibility through identity prejudice.

  2. **Lacking that vocabulary because those with power have actively prevented it from being developed.** (Rating: 9/10)
     This captures the structural essence of hermeneutical injustice by linking the interpretive gap to active exclusion by power.

  3. **Having your anecdotal evidence dismissed as mere anecdote by someone applying a standard they would not apply to their own evidence.** (Rating: 9/10)
     This represents a methodological double standard that devalues specific forms of knowing, closely mirroring credibility deficits.

  4. **Being repeatedly talked over in meetings.** (Rating: 8/10)
     This constitutes conversational silencing which blocks the transmission of knowledge, though it can sometimes stem from rudeness rather than prejudice.

  5. **Being disbelieved because the hearer needs to regard you as unreliable in order to keep their own conduct in a good light.** (Rating: 8/10)
     This reflects a moral failing that causes epistemic harm, but lacks the structural identity prejudice central to the core concept.

  6. **Lacking the shared vocabulary to make sense of an experience you have had, through no fault of your own.** (Rating: 7/10)
     This describes the state of hermeneutical marginalization but risks conflating injustice with mere bad luck absent a specified structural cause.

  7. **Having your testimony extracted and put to use as data while you receive nothing from it.** (Rating: 6/10) **[FLAG: Distributive/Exploitative Harm]**
     This is better treated as epistemic exploitation or distributive unfairness regarding the benefits of knowledge rather than a harm to the capacity itself.

  8. **Being shut out of a profession by credentialing requirements that are not themselves epistemic.** (Rating: 4/10) **[FLAG: Institutional/Distributive Harm]**
     This is primarily an institutional or distributive injustice regarding professional opportunity rather than a direct wrong to epistemic capacity.

