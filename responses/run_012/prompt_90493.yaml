      First, the concept of a 'side effect' is unintelligible without a definition of intended effects. To penalise unwanted change, one must distinguish it from wanted change. If an agent is tasked with curing a disease, changing the patient's biology is intended. If the measure penalises all biological change equally, it obstructs the task. If it exempts some changes, it requires a specification of which changes matter. Thus, the measure does not eliminate value specification; it merely shifts it from defining the goal to defining the permissible path. Without knowing what the agent is *for*, one cannot determine what counts as collateral damage.

      Second, the architectural choices required to implement impact measures smuggle in significant value commitments. One must select a baseline: is it inaction, a stepwise counterfactual, or a societal default? Choosing inaction privileges the status quo, which may be unjust. One must also weight the impact penalty against the task reward. A high weight prioritises caution; a low weight prioritises capability. This ratio is not derived from mathematics but from an ethical stance on risk acceptance. Furthermore, aggregating over possible futures implies a view on time preference and uncertainty. These parameters effectively encode a policy on how much the agent is allowed to matter, which is itself a value judgement.

