answer: |-
  **Exam Question**

  Impact regularisers propose constraining AI behaviour by penalising deviation from a baseline (such as inaction) or reduction in future optionality, rather than specifying positive goals. Proponents suggest this avoids the need for a full specification of human values. Critically evaluate this claim. In your answer, address: (1) the definition of side effects relative to intended effects; (2) the value commitments implicit in choosing baselines and weighting penalties; and (3) the trade-off between safety (inertia) and utility (initiative). Conclude with a position on whether any version of this approach is genuinely value-neutral.

  ***

  **Model Answer**

  Impact regularisers, such as relative reachability or attainable utility preservation, aim to mitigate AI risk by penalising agents for changing the world too much. The central promise is value-neutrality: by merely preserving the status quo or future options, the system supposedly avoids the need to define what is 'good'. However, this claim dissolves upon technical scrutiny. The approach does not remove value judgements; it merely relocates them from the objective function to the constraint mechanism.

  First, the concept of a 'side effect' is unintelligible without a definition of intended effects. To penalise unwanted change, one must distinguish it from wanted change. If an agent is tasked with curing a disease, changing the patient's biology is intended. If the measure penalises all biological change equally, it obstructs the task. If it exempts some changes, it requires a specification of which changes matter. Thus, the measure does not eliminate value specification; it merely shifts it from defining the goal to defining the permissible path. Without knowing what the agent is *for*, one cannot determine what counts as collateral damage. The distinction between 'effect' and 'side effect' is inherently teleological, relying on a prior specification of purpose that the regulariser claims to bypass.

  Second, the architectural choices required to implement impact measures smuggle in significant value commitments. One must select a baseline: is it inaction, a stepwise counterfactual, or a societal default? Choosing inaction privileges the status quo, which may be unjust or inefficient. One must also weight the impact penalty against the task reward. A high weight prioritises caution; a low weight prioritises capability. This ratio is not derived from mathematics but from an ethical stance on risk acceptance. Furthermore, aggregating over possible futures implies a view on time preference and uncertainty. These parameters effectively encode a policy on how much the agent is allowed to matter, which is itself a value judgement. The 'neutral' baseline is often a political choice disguised as a technical default.

  Third, there is the problem of inertia. A penalty sufficiently strong to prevent catastrophic manipulation often prevents useful action entirely. An agent that never acts cannot break vases, but it also cannot cure diseases. To be useful, the agent must be permitted to initiate change. Deciding where to draw the line between safe inertia and dangerous initiative is not a technical finding read off the measure; it is a normative trade-off. Safety here is not an absolute state but a budgeted resource. Consequently, the 'safe' setting is simply the setting humans are comfortable risking, which varies by context. An agent constrained to do nothing is safe but useless; an agent constrained to do something is useful but risky. Balancing this is a moral decision, not an engineering optimization.

  Ultimately, impact regularisers are not genuinely value-free. They obscure value judgements within technical parameters rather than removing them. The least-bad fallback is to abandon the pretence of neutrality. Instead, these measures should be treated as explicit constraint layers within a broader governance framework. Humans must consciously accept the residual risk defined by the baseline and weighting choices, acknowledging that preserving optionality is itself a specific moral priority, not a universal neutral ground. We cannot automate the decision of how much the world should change; we can only formalise the limits we choose to impose.

  \answer{Not value-neutral; constrained optimisation}

