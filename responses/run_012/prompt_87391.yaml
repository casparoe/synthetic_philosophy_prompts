answer: |-
  The seam is in step (2). It looked fine because it assumes **Truth-Value Monism**: the idea that truth is the *only* fundamental epistemic good, and that all other epistemic properties (justification, reliability, understanding) are merely instrumental means to that end. If truth is the only goal, then once the goal is reached, the means add no extra value to the outcome—just as a cup of coffee made by a reliable machine is no better than a lucky cup if all you care about is the caffeine.

  The price of abandoning (2) is accepting that epistemic value is not purely consequentialist. You must commit to the view that the *nature* of the cognitive contact with reality matters constitutively, not just instrumentally. This does not collapse into prudence. Prudence values a reliable process because it yields *future* truths. An epistemic principle values it because the *current* state is an **achievement** rather than an accident. The value lies in crediting the agent (or the process) for the truth, not merely in having the truth.

  This survives the objection that "if the belief is already true, there is nothing left for the extra feature to do." The extra feature (warrant/virtue) changes the *kind* of state it is. A goal scored by skill is a different kind of event than a goal scored by luck, even if the scoreboard reads the same. The value is in the *success through ability*, not just the success.

  Regarding the fragile believer: if a believer would drop a true belief at the first word of authority, the belief lacks **stability** and **integration**. On the replacement principle, this belief is worth less than one held by someone who can answer for it, because the connection to the truth is too tenuous to count as a robust cognitive achievement. Whether it counts as knowledge depends on your threshold for stability, but it is undoubtedly epistemically inferior.

  \answer{2, Epistemic value depends on warrant}
