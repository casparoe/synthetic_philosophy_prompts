answer: |-
  **MEMORANDUM**

  **TO:** State Forensic Science Commission
  **FROM:** [Your Name], Public Member
  **DATE:** October 26, 2023
  **SUBJECT:** Evaluation of Libet-Style Neuroscientific Testimony Regarding Volitional Acts

  **I. Purpose**

  This memo evaluates the admissibility and validity of neuroscientific testimony based on "Libet-style" experiments in criminal proceedings. Specifically, we address the claim that because electrical brain activity precedes a person's conscious awareness of a decision, the resulting action is not voluntary under the law. We apply the Commission's two-step standard: (1) Is the phenomenon real? and (2) Does the method measure it in the individual case?

  **II. Step One: Is the Phenomenon Real?**

  **The Empirical Claim:** It is an established empirical fact that in controlled laboratory settings, specific electrical patterns in the brain (often called readiness potentials) can be detected prior to a subject reporting a conscious urge to move. The signal exists.

  **The Interpretive Claim:** The expert testimony asserts this signal *is* the decision, and that consciousness is merely a delayed report. This is where the science is currently contested. A significant body of contemporary research suggests this signal may not be a specific decision at all, but rather background neural noise that naturally fluctuates. Under this view, the brain is always "noisy," and movement happens when that noise randomly crosses a threshold. If this competing view is correct, the signal does not indicate a decision made before awareness; it indicates the random timing of movement onset.

  **Finding on Step One:** The electrical signal is real. The claim that this signal definitively represents a completed "decision" prior to awareness is not settled science. It is a hypothesis, not a fact.

  **III. Step Two: Does the Method Measure it in the Individual Case?**

  Even if we assume the strongest version of the expert's theory—that the signal does represent a pre-conscious decision—the method fails the second step of our standard. It cannot apply to the defendant in this case for three reasons conceded in the record.

  First, **context matters.** The experiments involve arbitrary movements with no consequence (e.g., "lift your finger whenever you feel like it"). The defendant's case involves a complex, motivated action with high stakes (an assault). There is no evidence that the neural timing of a meaningless twitch is comparable to the neural processing of a motivated, goal-directed human action.

  Second, **group data versus individual diagnosis.** The ability to predict movement from these signals is a statistical average across many people. It is not a diagnostic tool for a single brain at a single moment. The expert conceded he could not say what was happening in this specific defendant's head on the night of the crime.

  Third, **prediction is not certainty.** The decoding accuracy in these studies is well short of one hundred percent. In a criminal trial, where we weigh liberty against public safety, a probabilistic guess about brain noise cannot override direct evidence of behavior.

  **Finding on Step Two:** The method does not measure volition in the individual case. It measures group-level statistical correlations in a laboratory environment that does not match the real world.

  **IV. Empirical Questions vs. Conceptual Questions**

  There is a proposal before this Commission to adopt a rule stating that an act is not voluntary if a predictive brain signal precedes awareness. We must distinguish what is our business to decide.

  **The Empirical Question:** *Can we detect the signal and does it correlate with timing?* This is our business. As shown above, the science is not robust enough to answer this for an individual defendant in a real-world scenario.

  **The Conceptual Question:** *What does "voluntary" mean in the eyes of the law?* This is not our business. That is a question for the legislature and the courts.

  However, the proposal to equate "signal before awareness" with "involuntary act" conflates the two. It attempts to use an empirical finding to solve a conceptual problem. Even if the science were perfect, declaring an act "involuntary" based solely on neural timing is a legal and philosophical conclusion, not a scientific one.

  **The Strongest Argument for the Opposing View:**
  We must acknowledge the strength of the defense argument. If brain activity initiates action before we feel we have chosen, it challenges the intuitive story we tell ourselves about being the "captains of our souls." If we are merely observing our brains' decisions after the fact, holding people criminally responsible seems to punish them for biological processes they did not consciously start. This is a profound challenge to our concept of justice.

  **Why We Cannot Adopt That View Yet:**
  The law does not require metaphysical free will; it requires the capacity for control and the absence of coercion. A person can be the "author" of an act even if the neural mechanics are opaque to them, provided they were not coerced, psychotic, or unconscious. To rule that *any* action preceded by a neural signal is involuntary would effectively eliminate the concept of criminal responsibility for almost all impulsive acts. Until the science can distinguish between a "normal" pre-conscious signal and a "compromised" one (such as in your wife's experience with medication, where the brain's regulation is chemically altered), we cannot use this data to negate voluntariness.

  **V. Recommendation and Timeline**

  **Disposition:**
  The Commission finds that Libet-style testimony currently fails Step Two of our standard. It cannot reliably measure volition in an individual case. We recommend that the Commission advise the state courts that such testimony is not sufficiently reliable to support a finding that a specific criminal act was involuntary.

  **Guidance for Courts:**
  Cours should treat this testimony as interesting background on human physiology, but not as evidence capable of negating the voluntary act requirement. It may not be used to instruct a jury that the defendant lacked control.

  **Timeline:**
  Neuroscience is moving quickly. We should not close the door forever. I recommend we set a review date of **five years**. At that time, we will re-evaluate whether individual-level decoding has improved and whether the "noise vs. decision" debate has been resolved.

  **VI. Conclusion**

  We are not asked to solve the mystery of free will. We are asked if this tool works for this job. Today, the tool is too blunt, the science too disputed, and the leap from lab to life too wide. We should not allow a statistical correlation to override the legal presumption of agency.

  I move we adopt this finding.
