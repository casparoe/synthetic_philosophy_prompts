      *   *Crucial Point:* Lewis would likely say the Colleague is speaking truly *in the morning context*, but the Physician was speaking truly *in the night context*. SSI says one of them is wrong about the *fact* of knowledge. Lewis says both are right about the *relation* between subject and standard.
      *   *Wait, one nuance:* Lewis's contextualism is primarily about the *attributor*. If the Colleague asks "Did you know?", the standards are set by the Colleague's context (morning, low stakes). So the Colleague says "You knew." The Physician, remembering the night, might say "I didn't know." Lewis handles this via *contextual parameters*.
      *   *Better Lewisian move:* He might argue that when the Colleague asks about the fatal risk, she *makes* that risk salient, thereby raising the standards for the conversation, rendering "You knew" false *in that conversation*. This preserves the intuition that high stakes kill knowledge claims without accepting SSI.
