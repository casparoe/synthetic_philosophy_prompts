answer: |-
  Here is a forecast of where David Lewis would have landed on pragmatic encroachment, based on the trajectory of his late work, specifically *Elusive Knowledge* (1996) and his unpublished notes circulating at the time of his death in 2001.

  ### The Forecast: Absorption, Not Conversion

  Lewis would have **rejected** Subject-Sensitive Invariantism (SSI). He would not have accepted that the subject's practical stakes directly alter the truth conditions of knowledge ascriptions in an invariantist framework. Instead, he would have attempted to **absorb the phenomena of encroachment into his existing contextualist machinery.**

  He would have argued that what proponents of pragmatic encroachment identify as "stakes-sensitive knowledge" is actually "stakes-induced salience." On Lewis's view, high stakes do not change the semantic value of 'knows' directly; rather, high stakes force the subject (or the attributor) to attend to error possibilities that would otherwise be properly ignored. Once an error possibility is attended to, it becomes relevant. Once it is relevant, the standards for knowledge rise, and the knowledge claim becomes false.

  **What follows from text:**
  This forecast relies on Lewis's **Rule of Attention** from *Elusive Knowledge*: "A possibility not ignored is relevant." Lewis explicitly states that we cannot properly ignore a possibility if we are attending to it. He also distinguishes sharply between the *subject* and the *attributor*. For Lewis, the context that matters is the attributor's. SSI makes the *subject's* context matter. Lewis's entire semantic project treats 'knows' as an indexical like 'here' or 'now', dependent on the speaker's context, not the referent's situation. To accept SSI would require him to abandon the indexical model of knowledge, which was the cornerstone of his late epistemology.

  **What is extrapolation:**
  The specific claim that Lewis would treat stakes as *causes* of salience rather than *constituents* of knowledge is an extrapolation. Lewis never fully formalized how practical interests translate into epistemic relevance. He acknowledged that practical interests matter for *action*, but he was reluctant to let them infect *truth*. The extrapolation is that he would view the "encroachment" intuitions as a confusion between the *propriety of assertion* (pragmatics) and the *truth of the proposition* (semantics), or as a byproduct of how stakes manipulate the Rules of Relevance.

  **Where it is underdetermined:**
  The genuine underdetermination lies in whether Lewis would concede that stakes *automatically* raise standards, even if unattended. In *Elusive Knowledge*, he suggests some possibilities are "properly ignored" unless mentioned. Would he say that a fatal risk is *never* properly ignored, regardless of attention, simply because the stakes are high? If he says yes, he moves closer to SSI. If he says no (it must be attended to), he remains a pure contextualist. Given his commitment to the Rule of Attention, I forecast he would insist on attention, but he might add a rule that "practical urgency commands attention," effectively simulating encroachment without the semantic shift.

  ### The Pulling Commitments

  Two major commitments would pull Lewis in opposite directions, but the semantic one would win.

  1.  **The Pull toward Encroachment (Decision Theory):** Lewis was a rigorous decision theorist. He understood that rational action depends on both probability and utility (stakes). He would sympathize with the encroacher's motivation: it seems irrational to act as if you know a drug is safe when the cost of error is death, even if your evidence is statistically robust. He would want his epistemology to be compatible with his decision theory.
  2.  **The Pull toward Contextualism (Semantic Methodology):** Lewis was a systematic metaphysician and philosopher of language. He viewed 'knows' as context-sensitive because it solves skeptical puzzles without conceding to skepticism. SSI is *invariantist*; it claims 'knows' has a single meaning that just happens to depend on stakes. This violates Lewis's linguistic data about how we use 'knows' in conversation (e.g., how mentioning a skeptic destroys knowledge claims even if stakes don't change).

  **The Verdict:** The semantic commitment would win. Lewis would argue that SSI gets the *explanation* wrong. It's not that the knowledge disappears because the stakes are high; it's that the high stakes make the possibility of error salient, and *that* is what destroys the knowledge claim.

  ### Testing the Forecast: The Physician Case

  Let's put this machinery to work on your invented case.

  **The Setup:**
  *   **Physician (Night):** High stakes (fatal risk), ambiguous evidence.
  *   **Colleague (Morning):** Low stakes (merely curious), same evidence.
  *   **Question:** Do they occupy different epistemic positions?

  **The SSI Answer:**
  Yes. The Physician did not know. The Colleague (if she were in the Physician's shoes) would have known. The difference is the subject's stakes.

  **The Lewisian Answer:**
  Lewis would say the SSI diagnosis is a category error. The difference is not in the *epistemic position* (the relation between subject and evidence) but in the *conversational context* of the ascription.

  **1. The Night Shift (Self-Ascription)**
  When the Physician asks herself, "Do I know this drug is safe?", she is the attributor. Her context is high-stakes.
  *   **Lewis's Analysis:** The high stakes make the possibility of a fatal interaction *salient*. She is attending to it. By the Rule of Attention, that possibility is relevant. To know, she must be able to rule out all relevant possibilities. She cannot rule out the fatal interaction (evidence is ambiguous).
  *   **Result:** The sentence "I know it is safe" is **false** in this context.
  *   **Why:** Not because stakes change knowledge, but because stakes forced attention to a defeater.

  **2. The Next Morning (Colleague Ascription)**
  The Colleague asks, "Did you know it was safe?"
  *   **Lewis's Analysis:** The Colleague is the attributor. Her context is low-stakes. However, by asking about the decision, she might inadvertently make the risk salient.
      *   *Scenario A:* If the conversation is casual ("Glad that patient lived, you knew it was fine, right?"), the risk is properly ignored. The standards are low. The Physician's evidence suffices. The sentence "You knew" is **true** in this context.
      *   *Scenario B:* If the conversation is a morbidity review ("Did you *know* there was a risk of death?"), the risk is made salient. The standards rise. The sentence "You knew" becomes **false** in this context.
  *   **Crucial Distinction:** Lewis would insist there is no contradiction between the Physician saying "I didn't know" (at night) and the Colleague saying "You knew" (in the morning, Scenario A). They are speaking different "languages" in the sense that the index 'knows' picks out different relations in different contexts. SSI says one of them must be wrong about the *fact*. Lewis says both are right about the *contextualized truth*.

  **3. The Physician Reflecting (Retrospective Self-Ascription)**
  The Physician, now rested and low-stakes, asks herself: "Did I know it was safe last night?"
  *   **Lewis's Analysis:** This is the hardest test. She is now in a low-stakes context. Can she truly say "I knew"?
  *   **Forecast:** Lewis would say **yes**, she can truly say "I knew," *provided* she does not make the error possibility salient in her current reflection.
  *   **The Catch:** However, Lewis would add a pragmatic warning. To assert "I knew" might be misleading, because it invites the listener to assume the current (low) standards applied back then. He would likely advise a qualified assertion: "I knew *by the standards of this morning*, though I couldn't claim to know *by the standards of last night*."
  *   **Work Done:** This preserves the intuition that she wasn't negligent (she had enough evidence for low stakes) while acknowledging she couldn't act with certainty (high stakes raised the bar). It avoids the SSI commitment that her epistemic state *metamorphosed* overnight. Her evidence didn't change; the context of evaluation did.

  ### Where the Forecast Does Work

  This forecast solves a specific problem for SSI that Lewis would have pounced on: **The Third-Person Problem.**

  In your case, imagine a Hospital Administrator (third party) reviewing the case.
  *   **SSI Struggle:** If the Administrator has low stakes, does the Physician know? If the Administrator has high stakes (liability), does the Physician know? SSI ties knowledge to the *subject's* stakes. So the Administrator's stakes shouldn't matter. But intuitively, if the Administrator starts grillling on the risk, it seems wrong to say the Physician "knew."
  *   **Lewis's Advantage:** Lewis's contextualism handles this effortlessly. The Administrator's context sets the standards for the attribution. If the Administrator is in a high-stakes liability meeting, "The Physician knew" is false. If the Administrator is chatting at a bar, it is true.
  *   **The Move:** Lewis would argue that the encroachment theorists are mistaking the *attributor's* sensitivity to stakes for the *subject's* sensitivity. When we imagine the Physician in high stakes, we (the attributors) imagine ourselves in high stakes, and we raise our standards. We project our context onto the subject.

  ### Underdetermination and the "Fiat" Warning

  I must flag one area where I am settling by fiat what Lewis left open.

  Lewis's **Rules of Relevance** are notoriously flexible. He admits we can ignore possibilities unless they are mentioned. The underdetermined question is: **Do stakes *automatically* mention the possibility?**

  *   **Option A (Hard Contextualism):** Stakes only matter if someone explicitly thinks about the error. If the Physician is reckless and doesn't think about the risk, she might truly "know" even in high stakes.
  *   **Option B (Soft Encroachment):** Stakes *force* the possibility into attention. You cannot properly ignore a fatal risk if your job is on the line.

  I have forecasted Lewis would take **Option B**. This is the only way he can account for the data the encroachment theorists use. However, this is not explicitly in *Elusive Knowledge*. It requires expanding the Rule of Attention to include "Practical Salience." If Lewis had lived, this would have been the battleground: whether practical interests are *epistemic* (affecting relevance) or merely *pragmatic* (affecting assertion).

  My reading is that Lewis would have treated them as epistemic *via* relevance, to save the phenomenon of knowledge without surrendering his indexical semantics. He would have told the encroachment theorists: "You are right about the data, but wrong about the mechanism. It is not that knowledge shrinks under pressure; it is that pressure shines a light on the gaps in knowledge that were always there, waiting to be seen."
