      *   **Rule of Attention:** A possibility not ignored is relevant. If we mention a skeptical possibility, it becomes relevant, and knowledge claims become false.
      *   **Pragmatic Elements in Lewis:** Lewis acknowledged practical interests matter for *action*, but he was staunchly invariantist about *truth conditions* of propositions (generally), yet contextualist about *knowledge ascriptions*.
      *   **Key Distinction:** Lewis separates the *subject's* situation from the *attributor's* context. Pragmatic Encroachment (SSI) makes the *subject's* stakes relevant to the truth of the knowledge claim. Lewis makes the *attributor's* standards relevant.
      *   **Late Work:** "Elusive Knowledge" (1996) is the big one. He was working on revisions and responses to critics (like DeRose) before dying in 2001.

  3.  **Analyze Pragmatic Encroachment (SSI):**
      *   **Proponents:** Jeremy Fantl, Matthew McGrath, Jason Stanley (later).
      *   **Claim:** Knowledge depends on practical stakes for the *subject*. Same evidence + different stakes = different knowledge status.
      *   **Motivation:** Explains why we hesitate to say "I know" in high-stakes situations even with good evidence.

  4.  **Forecasting Lewis's Reaction:**
      *   *Initial Intuition:* Lewis is the king of Contextualism. SSI is the rival theory. Usually, rivals don't merge.
      *   *Nuance:* Lewis was a systematizer. He wanted to save the phenomena (our intuitions) with a unified theory.
      *   *The "Assertion" Move:* Lewis often treated pragmatic constraints as constraints on *assertability* rather than *truth*. (Gricean flavor).
      *   *The "Relevance" Move:* In "Elusive Knowledge," relevance is determined by the attributor's context. Could stakes make a possibility relevant? Lewis says attention does. Does stakes drive attention?
      *   *Prediction:* Lewis would likely *resist* SSI (Subject-Sensitive Invariantism) because it violates the semantic uniformity of 'knows' across subjects in the same context. He would try to *absorb* the data into his Contextualism.
      *   *Mechanism:* High stakes for the subject make certain error-possibilities more *salient* to the attributor (or even the subject when self-ascribing). Or, he would argue that in high stakes, it is improper to *assert* "I know," even if true.
      *   *Pulling Commitments:*
          *   *Pull to SSI:* Lewis cares about rational action. If you can't act on it, do you know it? (Connection to his decision theory).
          *   *Pull to Contextualism:* Semantic methodology. 'Knows' behaves like 'here' or 'now'. It depends on the speaker's context. SSI makes it depend on the subject's psychology/situation, which is less linguistic.
      *   *Verdict:* He would likely stick with Contextualism but refine the "Rules of Relevance" to account for stakes *indirectly* (stakes draw attention to error possibilities). He would reject the idea that the *truth conditions* change based on the subject's stakes alone, independent of conversational context.

