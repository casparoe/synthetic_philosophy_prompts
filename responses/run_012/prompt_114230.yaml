      *   *Correction:* Lewis's Contextualism says the *extension* of 'knows' changes. SSI says the *extension* changes based on subject's stakes. Lewis says it changes based on *attributor's* standards.
      *   *Synthesis:* Lewis would argue the Physician's high stakes force *her* (as self-ascriber) into a high-standards context. The Colleague (as attributor) is in a low-standards context. Both are right relative to their contexts. There is no contradiction. SSI claims there is a fact of the matter independent of context (Subject-Sensitive *Invariantism*). Lewis is not an Invariantist.

  6.  **Drafting the Response:**
      *   **Introduction:** Acknowledge the irony (Lewis died right before the "Encroachment" boom). State the thesis: Lewis would have resisted SSI, doubling down on Contextualism, but refining the "Rules of Relevance."
      *   **Section 1: The Forecast (Contextualism over SSI).**
