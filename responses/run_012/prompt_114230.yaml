          *   *Extrapolation:* How he would handle stakes. Stakes aren't semantic parameters for Lewis; attention is. Stakes *cause* attention.
          *   *Underdetermination:* Would he concede that stakes *constitutively* affect knowledge, or just causally affect salience? (Likely the latter).
      *   **Section 2: The Pulling Commitments.**
          *   *Semantic Uniformity:* 'Knows' is indexical. SSI makes it weirdly dependent on subject's practical state.
          *   *Decision Theory:* Lewis was a decision theorist. He knows action depends on probability + utility. He might sympathize with the *motivation* for encroachment but solve it via action norms, not knowledge norms.
      *   **Section 3: The Test Case (Physician).**
          *   *Scenario A (Physician vs. Colleague):* Lewis says they are in different contexts. Colleague attributes knowledge (true in low-standards context). Physician self-ascribes (false in high-standards context). No contradiction.
          *   *Scenario B (Physician Reflecting):* Retrospective attribution. Context is now low-stakes. She can say "I knew." But she must acknowledge the indexical shift.
          *   *The "Work":* Show how this avoids the SSI commitment that knowledge *itself* changed, arguing instead that the *context of evaluation* changed.
      *   **Section 4: Where it's Underdetermined.**
          *   Did Lewis think stakes *automatically* raise standards, or only if attended to?
          *   Would he concede a "pragmatic" constraint on assertion that mimics encroachment without the semantic shift?

  7.  **Refining the Tone:**
      *   Journalistic but philosophically precise.
