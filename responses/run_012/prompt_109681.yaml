answer: |-
  My wife asked me to explain the lizard study and the nature-nurture fight in one go. I said, "Imagine two rooms. In each, tail-flick speed is 70% heritable. But the difference in speed between the rooms is 100% temperature. And if I make the cold room more chaotic, heritability drops to 0.1 without changing a gene."

  She said, "So within the room it's genetic, but between the rooms it's environmental? And 'heritable' just means the environment is holding still?"

  I said, "Exactly."

  She said, "Then why do people treat it like a limit on policy?"

  I said, "Because admitting it's just a ratio of variances means admitting they could just fix the room."

  She said, "So the nature-nurture debate is just people fighting over the denominator to avoid paying the heating bill?"

  *(Optional tag if the room needs it: "Heritability isn't a measure of genetic importance. It's a measure of environmental uniformity.")*
