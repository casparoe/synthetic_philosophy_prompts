  The other five remain because they bridge the gap between the kitchen table and the quantum field without slipping into jargon. **Field** is both physics and awareness. **Grain** is both material structure and the texture of qualia. **Fold** is both spatial topology and the integration of memory. **One** is both a unit and a subject. **Again** is both oscillation and the cycle of grief.

