      *   **Advocacy Group Critique:** Manipulation. Exploits inertia/social proof. Makes alternative costly. Doesn't offer reasons.
      *   **Agency Rule:** Dark pattern = influence user would reject if they knew about it and had time to reflect (Counterfactual Endorsement Test).

  3.  **Identify Philosophical Commitments:**
      *   **Agency's Theory:** The defense relies heavily on *procedural* autonomy. If the user *can* choose otherwise, autonomy is respected. The definition of dark patterns relies on *counterfactual consent*. This aligns with a rationalist or liberal individualist view where manipulation is defined by the *absence of informed consent* or *deception*. If you know about it and would still accept it, it's not manipulation. This suggests manipulation is primarily about *concealment* or *deception* regarding the influence mechanism.
      *   **Advocacy Group's Theory:** Focuses on *substantive* autonomy or *rational deliberation*. Manipulation bypasses reason (inertia, social proof) rather than engaging it. It's about the *mechanism* of influence, not just the ability to opt-out. This aligns with theories that view manipulation as bypassing rational capacities or exploiting cognitive biases.

