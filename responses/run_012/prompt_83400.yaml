      *   *Truth Conditions:* Calibration vs. Frequency.
      *   *Ethical/Professional:* Signing the line.
      *   *Boss Script:* The soundbite.
      *   *Uncertainty Flag:* The institutional reception.

      *(Self-Correction during drafting)*: Make sure I don't sound like I'm dismissing the boss entirely. The boss is right that *vibes* (unstructured intuition) are bad. The counter is that *structured expert judgment* is not a vibe. Distinguish those.

      *(Refining the "Truth" condition)*: In single-case objective chance (Lewis), truth is tricky. Better to frame it as "warranted assertibility." The number is warranted if it follows from the physical model + expert elicitation.

      *(Final Polish)*: Ensure the tone matches a colleague-to-colleague philosophical exchange that translates to industry practice.

