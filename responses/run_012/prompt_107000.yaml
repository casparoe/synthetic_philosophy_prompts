answer: |-
  **The spine**

  1.  Open with a visceral prompt about a specific time they felt wronged, demanding no metaphysics yet. If you mention free will first, you cede the ground to the neuro-skeptics before establishing the phenomenon they actually live.
  2.  Define the participant stance as the default, unavoidable mode of ordinary human interaction. You cannot explain what we are stepping out of until you have named the place where we already stand.
  3.  Walk through specific excuses like accidents or coercion that mitigate blame but keep engagement alive. This must precede exemptions because excuses modify the demand within the relationship, whereas exemptions dissolve the relationship itself.
  4.  Walk through specific exemptions like childhood, psychosis, or brain tumors that remove the agent from the community of responsibility. This must follow excuses to highlight the categorical shift from modifying blame to withdrawing interpersonal engagement entirely.
  5.  Characterize the objective attitude as a policy of management, therapy, or policy rather than inherent hostility. This requires the exemption contrast to prevent them from conflating objectivity with psychopathy or simple coldness.
  6.  Finally, ask if determinism functions as a global exemption that dissolves the practice everywhere. This must be last because Strawson's punchline is that the practice survives even if the metaphysics are settled against us.

  **The case**

  Use a scenario where a colleague publicly critiques your work with unusual harshness during a seminar. It must have a clear expectation of professional goodwill and a perceived violation of that demand, but it must lack any initial mitigating context; start with the raw sting of the insult to maximize the reactive attitude. Your revising-story plan is the right call. It forces the room to track their own shifting attitudes rather than debating abstract principles, keeping the focus on *their* reactions, which is Strawson's point.

  Regarding the brain tumor: Introduce it only at Step 4 (Exemptions). When someone raises it early, park it: "That's a crucial case, but it's a special kind of case. We'll get there in ten minutes." When you reach it, use it to demonstrate the shift to the objective stance (we treat the tumor, not blame the person), then immediately pivot back: "Now, remove the tumor. Does normal causation feel the same?" This contains it as a boundary case rather than letting it become the whole field.

  **Where they'll trip**

  1.  "Reactive attitudes are just emotions." Your psych colleagues will treat resentment as a physiological spike or a mood disorder. Head this off at Step 2 by emphasizing these attitudes embed moral expectations and demands, not just feelings.
  2.  "Excuses eliminate responsibility." The law folks will treat excuses as exonerations that clear the ledger. Head this off at Step 3 by showing excuses acknowledge the norm but deny the violation was intentional, keeping the relationship intact.
  3.  "The objective attitude is cold or hostile." Everyone will think Strawson advocates being a psychopath. Head this off at Step 5 by clarifying it's the stance of a therapist or parent, not an enemy; it's about management, not malice.
  4.  "Determinism is just a big excuse." The whole room will want to say causation exempts us globally. Head this off at Step 6 by distinguishing local exemptions (tumor) from universal facts (physics), showing the latter doesn't change the former.

  **The exit question**

  "If you knew for a fact that your colleague's criticism was causally determined by their past, would your resentment vanish, or would you just find a new word for it?" This forces them to distinguish between the metaphysical truth and the interpersonal practice. If they say it vanishes, they missed the point. If they say it stays, they get Strawson. If they say the word changes, they are grappling with the practice. It tests whether they see the shift from metaphysics to psychology.

  **What I'm skipping**

  Leave out self-reactive attitudes like guilt and shame, and skip vicarious attitudes like indignation on behalf of others. Also skip the detailed argument about universal causation. Say this: "Strawson covers more ground than we can walk today. We are focusing on the interpersonal core because that's where the lab work meets the text. The rest supports this point but isn't required for it." This keeps the session tight without making them feel cheated.
