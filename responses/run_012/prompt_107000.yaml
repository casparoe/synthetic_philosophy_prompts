prompt: |-
  OK so this is a weird favor, but here goes. I'm a third-year PhD student in psych, I work in a moral judgment lab, and my advisor volun-told me to run next week's session of our interdisciplinary reading group. The text is Strawson's "Freedom and Resentment" (the 1962 one). The group is two people from the law school, three from my own department, one historian, and literally nobody else who's read any philosophy since undergrad. I get fifty minutes, they were supposed to read it in advance and maybe half of them will have skimmed it, so the whole thing has to stand on its own feet.

  Don't explain Strawson to me — I've read it four times and I mostly get it, I'm just definately not a Strawson scholar. Plan how I should teach it.

  Some stuff you need to know about the room. Everybody there has seen the pop-sci "you have no free will, and here's a brain scan" videos, so they're walking in convinced the question is "is determinism true, and if so does that kill moral responsibility." That's the frame I'm fighting, and if I don't break it early I'll spend the hour refereeing a determinism debate. What I actually want them to leave with is that Strawson isn't making the standard compatibilist move — he's not saying "responsibility survives because the two are compatible" — he's doing something stranger with the practice itself, and I want them to feel why that's either brilliant or a dodge. I also want the excuses-versus-exemptions distinction to land, since the law people will get traction on it, and I want the psych people to see that the objective attitude isn't the same thing as treating someone like an object.

  Two specific things I want you to rule on. First, I'm tempted to carry the whole session with one story that I keep revising in front of them — same person, same offense, and then I add one fact at a time so they feel their own attitude shift from resentment to excuse to something more like exemption. If that's a bad idea, say so and give me the alternative. Second, someone will absolutely bring up the brain-tumor case and try to make it the whole session; tell me where in the sequence that lands and how to use it without letting it eat the hour.

  Give me the plan in these sections, in this order, with roughly these lengths:

  **The spine** (about 450 words): the order the pieces have to go in, and for each step one line on why it can't come before the one it follows. What has to be in place before the objective attitude even makes sense to them?

  **The case** (about 300 words): the one example that carries the whole thing — what it must have and what it must lack — plus your verdict on my revising-one-story plan.

  **Where they'll trip** (about 450 words): the misconceptions they'll bring or form, in the order they'll surface, and the exact point in the spine where I head each one off. I'm guessing "reactive attitudes = just emotions" and "the objective attitude = being cold or hostile" are two of them, but don't stop there.

  **The exit question** (about 120 words): one question I can ask at the end that tells me whether they got the move rather than just nodding along.

  **What I'm skipping** (about 120 words): what I should leave out at this level, and how to say so out loud without making them feel cheated.

  Write it in American English. And no reading lists or citations — half of them won't look anything up anyway, and I don't want to pretend I can field the follow-ups.
