answer: |-
  You are right to have that nagging feeling, because the summary you have encountered is a classic example of a philosophical debate being flattened into a pop-psychology narrative. The argument you are describing is known in academic circles as the Situationist Challenge, primarily launched by philosophers like Gilbert Harman and John Doris in the late nineties and early two thousands, who drew heavily on social psychology to critique virtue ethics. While their work is serious philosophy, the version you read in a popular book has likely sharpened the edges into a caricature that makes for better storytelling but worse accuracy. A philosopher working on virtue ethics today would accept some of the empirical data, reject the interpretation of that data, and flatly deny the conclusion that virtue ethics has been refuted. To understand why, we have to look at what virtue ethics actually claims, what the experiments actually show, and what the situationists actually argue versus how it gets sold in trade books.

  The first claim to audit is the definition of virtue ethics itself. The book says virtue ethics is built on the idea that people have stable character traits like honesty or courage that reliably show up across different situations. A virtue ethicist would accept that virtue ethics posits the existence of character traits, often called dispositions or hexeis in the Aristotelian tradition, but they would deny that these are supposed to be the rigid, context-blind reflexes the book implies. In the philosophical literature, virtues are not merely behavioral tendencies like a machine dispensing honest answers regardless of the cost; they are integrated with practical wisdom, or phronesis. This means a virtuous person knows when honesty is appropriate and when it might be cruel, or when courage is warranted and when it is recklessness. The situationist critique attacks a version of virtue ethics that claims traits are global and robust across all situations, but many virtue ethicists argue that traits are necessarily sensitive to context. So, while a philosopher would accept that virtue ethics requires some stability of character, they would deny that this stability must look like the cross-situational consistency the psychologists are testing for. They would call the book's description a popularization that ignores the cognitive and reasoning components of virtue, reducing it to a simple stimulus-response mechanism which makes it an easier target for psychological debunking.

  Next we have the empirical claims regarding the experiments, specifically the Good Samaritan study, the Milgram experiments, and the Hartshorne and May honesty studies. A philosopher familiar with the literature would accept that these studies demonstrate that situational factors have a much stronger influence on behavior than common sense intuition suggests. It is true that time pressure affected the seminary students and that authority figures influenced the Milgram participants. However, a philosopher would deny that these experiments are as clean or as damning as the book makes them sound. For one, the correlations in the Hartshorne and May studies were low, but they were not zero, and subsequent meta-analyses have suggested that personality traits do predict behavior, especially when you aggregate behavior over time rather than looking at single instances. Furthermore, there is the issue of what these experiments actually measure. Virtue ethics is concerned with deep character states involving motivation, reasoning, and emotion, whereas these experiments measure single instances of behavior under extreme or artificial constraints. Helping a slumped man while rushing to a lecture is not the same as the virtue of compassion, which involves a settled disposition to care for others over a lifetime. Additionally, many of these psychological findings have faced scrutiny during the replication crisis in psychology. The Milgram experiments, for instance, have been re-evaluated to show that participants were not simply obeying blindly but were often engaging with the scientific purpose of the study, and the conditions varied wildly. A philosopher would argue that using these specific, high-pressure scenarios to disprove the existence of character is like using a hurricane to prove that houses cannot be sturdy. The experiments show that situations matter, but they do not prove that character is irrelevant.

  This leads us to the core theoretical claim that there are no character traits, only situations. This is where the pop-psychology summary diverges most sharply from the actual philosophical debate. Even the situationist philosophers like John Doris do not argue that there are no character traits whatsoever. Their claim is more nuanced: they argue against global traits that are robust across diverse situations, suggesting instead that we possess local traits that are specific to certain contexts. For example, you might be honest with your friends but dishonest on your taxes. A philosopher would call the book's claim that there are no character traits a caricature of the situationist position. The serious argument is not that psychology is empty, but that the structure of our psychology is more fragmented than the Aristotelian ideal suggests. Virtue ethicists have responded to this not by surrendering, but by refining their theory. Some admit that perfect virtue is rare and that most people have fragmented characters, while others argue that the situationists set the bar for consistency impossibly high. No one expects a person to be equally honest when talking to a friend, a tax auditor, and a enemy combatant. So, while a philosopher would accept the situationist insight that we should be humble about our own consistency, they would deny the nihilistic conclusion that character is an illusion.

  Finally, we must look at the conclusion that virtue ethics is empirically refuted and that the only move left is to treat virtue as an unattainable ideal. This is a category error that a philosopher would flatly deny. Virtue ethics is primarily a normative theory, not a descriptive one. It tells us what human flourishing looks like and what qualities we ought to cultivate to achieve it, not necessarily a statistical report on how people currently behave. The fact that people often fail to be virtuous does not refute the theory any more than the fact that people often fail to follow the laws of logic refutes logic itself. Furthermore, virtue ethics has always acknowledged that virtue is difficult and requires cultivation. The idea that making virtue an ideal is giving up the game ignores the central role of moral education and habituation in the tradition. A virtue ethicist would argue that the empirical findings actually support the need for virtue ethics rather than refuting it. If situations powerfully influence behavior, then we have a moral obligation to design better situations and to train ourselves to be less susceptible to negative situational pressures. The empirical findings can be true and virtue ethics can survive intact because the theory is robust enough to incorporate the insight that character is fragile and context-dependent. The book you read presents a false dilemma where either character is destiny or it is nonexistent, whereas the philosophical reality is that character is a real but developable capacity that interacts dynamically with the situations we find ourselves in. So, while the pop-psychology account is a compelling story about human frailty, it does not succeed in killing virtue ethics, and most philosophers in the field continue to work on developing versions of virtue theory that are compatible with the best available psychology.
