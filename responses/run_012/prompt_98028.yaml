answer: |-
  The aphorism "revolutions devour their children" is a rhetorical heavy weight, often used to shut down inquiry rather than open it. To treat it seriously, we must dissect its anatomy. Below is a breakdown of the phrase's moving parts, a menu of precise readings, an evaluation of their validity and mechanisms, and an analysis of how the phrase functions in historiographical debate.

  ### I. The Moving Parts

  To construct specific readings, we must first define the variables within the metaphor.

  **1. What is the "Devouring"?**
  *   **Physical Elimination:** The literal execution or imprisonment of leaders (e.g., the guillotine).
  *   **Political Purge:** The discrediting, ostracization, or removal from power of a faction by its former allies.
  *   **Ideological Absorption:** The dilution of radical aims where the revolution consumes its own initial energy to stabilize a moderate regime.
  *   **Institutional Collapse:** The destruction of the very legal or political structures the revolution created to sustain itself.

  **2. Who are the "Children"?**
  *   **The Founders:** The specific individuals who initiated or led the early phases (e.g., Danton, Robespierre).
  *   **The Political Generation:** The cohort of activists and officials created by the revolutionary moment.
  *   **The Progeny Institutions:** The clubs, assemblies, or constitutions spawned by the initial upheaval.
  *   **The Successor Movements:** Later groups that claim the revolution's legacy but are rejected by the current regime.

  **3. Scope and Modality**
  *   **Scope:** Is this a law of *all* revolutions (universal), a trait of *the* French Revolution (specific), or a description of only the *Terror* (phase-specific)?
  *   **Modality:** Is the devouring *inevitable* (teleological necessity), *probable* (structural tendency), or *contingent* (the result of specific choices)?

  ---

  ### II. A Menu of Precise Readings

  Here are five distinct interpretations generated by combining the variables above, evaluated by their truth value and required mechanisms.

  #### Reading 1: The Literal Purge (Specific Leaders / Physical Elimination)
  *   **Claim:** The French Revolution necessarily executed its own most prominent early leaders.
  *   **Scope/Modality:** Specific to the French Revolution; presented as a historical fact rather than a law.
  *   **Evaluation:** **Substantive Claim.** It is empirically verifiable (Danton, Desmoulins, Robespierre were executed).
  *   **Required Mechanism:** **Psychological/Paranoid.** This requires a mechanism of escalating paranoia where leaders believe eliminating rivals is the only way to secure the revolution. It relies on the specific temperament of the Jacobin leadership and the pressure of foreign war.
  *   **Status:** True as a description of events, but does not explain *why* it happened beyond citing specific decisions.

  #### Reading 2: The Radicalization Ratchet (Factions / Political Purge)
  *   **Claim:** Revolutionary dynamics shift the "center of gravity" leftward, so that yesterday's radical becomes today's moderate and is consequently purged.
  *   **Scope/Modality:** Generalizable to many revolutions; presented as a frequent structural tendency.
  *   **Evaluation:** **Substantive Claim.** This is a defensible sociological observation about outbidding.
  *   **Required Mechanism:** **Selection/Radicalization Effect.** In a climate where "virtue" is measured by commitment to the cause, competitors must signal higher commitment to survive. This creates a selection effect where only the most extreme remain, consuming those who wish to consolidate gains.
  *   **Status:** Plausible. It explains the Girondins falling to the Montagnards, and the Montagnards falling to the Robespierrists.

  #### Reading 3: The Legitimacy Vacuum (Institutions / Institutional Collapse)
  *   **Claim:** By destroying the old regime's authority, the revolution creates a power vacuum that no new institution can immediately fill, leading to instability that consumes the creators.
  *   **Scope/Modality:** Structural claim about regime collapse in general; presented as a high-probability outcome.
  *   **Evaluation:** **Substantive Claim.** This aligns with structuralist historiography.
  *   **Required Mechanism:** **Structural Claim.** The absence of legitimate authority means power is up for grabs. Without established rules for succession or dispute resolution, violence becomes the only arbiter. The "children" (new institutions) are eaten because they lack the roots to withstand the chaos they unleashed.
  *   **Status:** Strong. It moves away from individual psychology to institutional weakness.

  #### Reading 4: The Coalitional Fracture (Allies / Political Purge)
  *   **Claim:** Any coalition large enough to overthrow a regime contains contradictory interests that will quarrel once the common enemy is removed.
  *   **Scope/Modality:** Universal; presented as a near-tautology of collective action.
  *   **Evaluation:** **Platitude.** Almost no one would deny this.
  *   **Required Mechanism:** **Tautological Claim.** Winning coalitions are negative coalitions (united *against* something). Once the "against" is gone, the "for" diverges. The "devouring" is just standard political infighting dressed in dramatic language.
  *   **Status:** True but trivial. It explains the conflict but not the *lethality* of the conflict.

  #### Reading 5: The Teleological Law (The Revolution Itself / Inevitable Cycle)
  *   **Claim:** It is in the *essence* of revolution to self-destruct; the violence is not an accident but a feature of the revolutionary ideology itself.
  *   **Scope/Modality:** Universal law; presented as inevitable.
  *   **Evaluation:** **False or Confused.** This treats "Revolution" as a metaphysical agent with a will, rather than a process undertaken by people.
  *   **Required Mechanism:** **Ideological Claim (Internal Logic).** This assumes the ideology (e.g., Rousseauian general will) demands such purity that it logically necessitates the elimination of imperfection, including imperfect revolutionaries.
  *   **Status:** Controversial. This is the "Furet thesis" (that the Revolution's ideology drove the Terror). It risks determinism.

  ---

  ### III. What Your Classmate Meant vs. What the Remark Does

  **The Classmate's Likely Intent**
  Your classmate most plausibly had **Reading 5 (The Teleological Law)** in mind. By using the aphorism as a conversation-ender ("as if that settled the matter"), they implied that the outcome was inevitable. They were suggesting that the execution of the leaders was not a series of accidents or specific political miscalculations, but the natural, organic conclusion of the revolutionary process. They intended to invoke a sense of tragic destiny.

  **The Historiographical Work**
  However, for the remark to do the work your classmate wanted—to make the internal destruction look like something other than a contingent string of accidents—it must rely on a combination of **Reading 2 (Radicalization Ratchet)** and **Reading 5 (Teleological Law)**.

  *   **Reading 2** provides the mechanism: The shift of the center of gravity explains *how* the moderates were eaten.
  *   **Reading 5** provides the necessity: It asserts this *had* to happen.

  Together, these readings support an **Ideological or Structural explanation** of the Revolution. They argue that the Terror and the purges were inherent to the Revolution's logic (Ideology) or the situation it created (Structure). This stands in direct opposition to a **Contingency** explanation.

  **The Contingency Defender's Target**
  A defender of contingency (who argues the Revolution is best explained by accidents, war, and specific choices) must most vigorously resist **Reading 5 (The Teleological Law)**.

  *   **Why?** If Reading 5 is true, then the Revolution *could not have been otherwise*. It implies that from 1789, the guillotine of 1794 was already baked in.
  *   **The Contingency Argument:** A contingency historian argues that without the specific pressure of the foreign war, the peasant uprisings, or the king's flight to Varennes, the "devouring" might not have occurred. They would argue for **Reading 4 (Coalitional Fracture)** or **Reading 1 (Literal Purge)** interpreted as *political choices*, not laws. They would assert that "revolutions" do not devour children; *people* devour children, and they do so for reasons that can be traced, argued, and potentially avoided.

  **Conclusion**
  Your classmate used a metaphor to smuggle in a theory of historical determinism. By treating the "devouring" as an inevitable law (Reading 5), they sidestepped the need to explain the specific mechanisms of the Terror. To engage them seriously, you must force the distinction between a metaphorical law of history and the actual, contingent decisions made by frightened men in the Committee of Public Safety. The phrase is only useful if it points to **Reading 2 (Radicalization)** as a risk to be managed, not **Reading 5** as a fate to be accepted.
