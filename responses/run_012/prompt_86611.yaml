answer: |-
  This is one of the most sophisticated and historically significant questions in Buddhist philosophy. You have correctly identified the central tension that Buddhist thinkers have grappled with for over two millennia. Your dilemma is not an artifact of misunderstanding; it is the precise philosophical pressure point that the doctrine of *anatta* (no-self) is designed to address.

  Here is an account of what is denied, how the karma mechanism is purported to work without a self, and a separation of what is doctrinally settled versus what remains philosophically contested.

  ### 1. What Exactly Is Being Denied?

  To understand why Buddhists believe causal continuity suffices, we must first clarify what the doctrine of *anatta* negates. It does not deny empirical continuity, memory, or character traits.

  **The Target: *Atman* (Substantial Self)**
  When early Buddhism denies the self, it is specifically denying an *atman*. In the Indian philosophical context (particularly against the Brahmanical Upanishads), an *atman* is defined by three characteristics:
  1.  **Permanence:** It does not change over time.
  2.  **Independence:** It exists inherently, not dependent on parts or conditions.
  3.  **Control:** It is a master/agent that stands apart from mental and physical processes and directs them.

  **The Affirmation: *Pratītyasamutpāda* (Dependent Origination)**
  Buddhism replaces the *atman* with a causal stream of *dharmas* (phenomena/constituents). What is affirmed is:
  1.  **Continuity:** There is an unbroken causal chain from moment to moment.
  2.  **Dependence:** Every state arises conditioned by the previous state.
  3.  **Convention:** A "person" is a useful label for this stream, valid for everyday language (conventional truth), but not findable upon ultimate analysis (ultimate truth).

  **What is Denied:** The claim that there is a *substrate* underlying the change.
  **What is Not Denied:** The change itself, or the causal connection between the changes.

  ### 2. Why Causal Continuity Suffices for Karma

  Your dilemma rests on the assumption that moral responsibility requires **numerical identity** (Person A at Time 1 must be *identical* to Person B at Time 2). Buddhist philosophy argues that moral responsibility requires only **causal connection**.

  **The Shift from Identity to Causality**
  In Western metaphysics (e.g., Locke), personal identity is often tied to memory or a soul. In Buddhism, "identity" is a conceptual imputation over a causal process.
  *   **The Analogy of the Flame:** If you light a candle at noon, and use it to light another candle at dusk, is the dusk flame the "same" as the noon flame? No. Is it totally different? No. It arose dependent on the noon flame. If the noon flame was used to burn a house, the causal trajectory leading to the dusk flame carries the heat and potential for further burning.
  *   **The Mechanism:** Karma is not a system of cosmic bookkeeping where a debt is transferred to a soul. It is a psychological and causal law of habituation. An intentional act (*cetana*) leaves a trace (*vasana*) in the mental stream. This trace conditions future moments of the stream.
  *   **Why it Suffices:** Suffering (*dukkha*) is what needs to be explained and extinguished. Suffering does not require an "owner" to be real. If a hand touches fire, the pain arises in the causal stream of the body-mind. It does not matter if there is a "self" owning the hand; the pain is real. Similarly, karmic results are simply the ripening of causal seeds within the stream. The stream experiences the result because the stream *is* the continuation of the cause.

  **Addressing Your "Third Option"**
  You asked why bare causal continuity should suffice for answerability. The Buddhist answer is soteriological, not legalistic.
  *   **The Goal:** The goal is not to ensure justice is served to a metaphysical entity. The goal is to end suffering.
  *   **The Logic:** If I plant a seed, I do not need to *be* the tree to benefit from the fruit. However, in Buddhism, the "I" is the planting and the "I" is the harvesting, but both are events in a stream. Because the stream is continuous, the suffering that arises from past actions arises *within* the same continuum that seeks liberation. If the continuum were broken (nihilism), practice would be pointless. If the continuum were a fixed self (eternalism), change/liberation would be impossible. Causal continuity allows for both responsibility and change.

  ### 3. Is Your Dilemma Genuine or an Artifact?

  It is **both**.

  **Why it is Genuine:**
  This is not a problem you invented; it is the primary objection raised against Buddhism by Hindu Nyaya philosophers and Christian missionaries for centuries. It is also a problem that arose *within* Buddhism. The tension between "no self" and "karmic retribution" is the engine that drove much of Abhidharma and Mahayana scholasticism. It is a genuine philosophical difficulty in reconciling reductionism with moral agency.

  **Why it is an Artifact:**
  The dilemma often feels intractable because of imported assumptions about what "responsibility" requires.
  *   **The Retributive Assumption:** You are framing karma as "debt" that must be attached to a "debtor." Buddhism frames karma as "cause and effect." If you kick a ball, the ball moves. You don't need a permanent self to explain why the ball moved; you need the causal impact of the foot.
  *   **The Substantialist Assumption:** The dilemma assumes that for X to be responsible for Y, there must be a *thing* that persists. Buddhism argues that *processes* can bear causal weight without being *things*.

  The "Middle Way" is precisely the rejection of your Option A (Eternalism/Self) and Option B (Nihilism/Discontinuity). The Buddhist claims Option C (Dependent Origination) is coherent, though it requires abandoning the intuition that causality requires a static relata.

  ### 4. Consensus vs. Contention

  It is vital to distinguish between what is orthodox doctrine, what is historically contested, and what is currently debated by scholars.

  #### **Settled Consensus (Orthodox Doctrine)**
  Across almost all Buddhist schools (Theravada, Zen, Tibetan, etc.), the following are settled:
  1.  **Rejection of *Atman*:** There is no permanent, unchanging, independent self. Any view positing such a self is considered a hindrance to liberation.
  2.  **Validity of Karma/Rebirth:** Intentional actions have consequences that extend beyond the immediate moment (and often beyond death).
  3.  **The Mechanism:** The mechanism linking action and result is *Pratītyasamutpāda* (Dependent Origination), not the transmigration of a soul.
  4.  **Two Truths:** The "person" exists conventionally (for the purpose of karma, language, and ethics) but not ultimately (upon metaphysical analysis).

  #### **Genuinely Contested (Historically and Scholarly)**
  While the above is orthodox, *how* to make it work philosophically has been contested for 2,000 years.

  **1. The Pudgalavada Controversy (Historical)**
  *   **The View:** A early school (the "Personalists") argued that the "person" (*pudgala*) is neither identical to nor different from the aggregates. They posited this specifically to solve the karma problem you raised.
  *   **The Status:** They were declared heretical by mainstream schools (who accused them of smuggling in a self), but they existed for centuries. This proves that early Buddhists recognized your dilemma as a major threat to the doctrine.
  *   **Scholarly View:** Modern scholars (e.g., Joseph Walser, James McDermott) debate whether the Pudgalavada were truly heretical or if they represented a viable philosophical alternative that was politically suppressed.

  **2. The Metaphysics of the "Stream" (Abhidharma vs. Mahayana)**
  *   **Abhidharma (Theravada/Sarvastivada):** Tends toward **Reductionism**. The stream is made of real, momentary *dharmas*. The "person" is a conceptual fiction, but the *dharmas* are real.
      *   *Problem:* How do momentary *dharmas* carry karmic debt?
      *   *Solution:* The Sarvastivadas posited that dharmas exist in past, present, and future to carry the debt. The Theravadins developed the *bhavanga* (life-continuum) consciousness.
  *   **Mahayana (Madhyamaka/Yogacara):** Tends toward **Emptiness**. Even the *dharmas* lack inherent existence.
      *   *Problem:* If nothing has inherent existence, how is karma not nihilistic?
      *   *Solution:* Yogacara posited the *Alaya-vijnana* (Storehouse Consciousness) to store karmic seeds. Madhyamaka argues that *because* things are empty, causality is possible (if things were fixed/solid, cause could not become effect).
  *   **Scholarly Contention:** Scholars debate whether the *Alaya-vijnana* is a subtle reintroduction of a self (as some critics claim) or a consistent development of no-self.

  **3. Modern Interpretations (Psychological vs. Metaphysical)**
  *   **Traditional/Conservative:** Maintains that rebirth and literal karmic causality across lifetimes are essential. No-self is a metaphysical claim.
  *   **Secular/Modernist:** Interprets "rebirth" as the rebirth of the ego-moment-to-moment in this life. No-self is a psychological tool to reduce suffering, not a metaphysical claim about ontology.
  *   **Scholarly Contention:** There is significant debate in Buddhist Studies regarding whether the "no-self" doctrine in the earliest Pali Nikayas was meant as a radical metaphysical truth (all scholars agree it's in the texts, but disagree on the *scope*) or a soteriological strategy (don't *regard* anything as self). This is known as the "Two Doctrines" theory (argued by scholars like Peter Harvey vs. Damien Keown).

  ### Summary

  Your dilemma is the classic formulation of the "Middle Way."
  1.  **What is denied:** A permanent, independent controller (*atman*).
  2.  **What is affirmed:** A causal stream of conditioned phenomena.
  3.  **Why it suffices:** Because suffering and causality are impersonal processes. Responsibility attaches to the continuity of the process, not the identity of a substance.
  4.  **Consensus:** All orthodox schools agree on the rejection of *atman* and the validity of karma via causality.
  5.  **Contestation:** There is deep historical and scholarly disagreement on the metaphysical machinery required to make this work (e.g., Storehouse Consciousness, Pudgalavada personalism, and the scope of "no-self" in early texts).

  The Buddhist claim is not that the dilemma is easy to resolve intuitively, but that the intuition demanding a "self" for responsibility is the very delusion that binds one to suffering. The philosophical work is meant to train the mind to accept causal responsibility without ontological attachment.
