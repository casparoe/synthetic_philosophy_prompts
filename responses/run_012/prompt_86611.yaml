      *   *Moral Responsibility:* Responsibility attaches to the causal stream, not a metaphysical ego. Suffering arises in the stream; the goal is to stop the suffering in the stream.

  4.  **Evaluate the User's Dilemma (Genuine vs. Artifact):**
      *   It is a *genuine* philosophical tension. It has been debated for 2,500 years (e.g., Pudgalavada school).
