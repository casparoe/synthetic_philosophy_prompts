      *   What *is* denied? A permanent, unchanging, independent, controlling agent (svabhava/atman).
      *   *Key Distinction:* Reductionism vs. Elimination. Buddhism is usually reductionist about persons (persons are real conventionally, but not ultimately), not eliminativist (persons don't exist at all).

  3.  **Address the Karma/Rebirth Problem:**
      *   The user's dilemma is the classic "Eternalism vs. Nihilism" middle way.
      *   *Analogy Time:* The flame analogy (Milinda Panha), the seed/fruit analogy, the billiard ball analogy.
