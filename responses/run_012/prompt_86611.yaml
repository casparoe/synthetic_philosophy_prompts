          *   The Pudgalavada ("Personalist") heresy: They posited a "person" that is neither identical nor different from the aggregates. (Important to mention as a historical attempt to solve this).
          *   Modern interpretations: Psychological vs. Metaphysical no-self.
          *   The "Two Truths" doctrine application varies.

  6.  **Drafting the Response (Iterative Process):**

