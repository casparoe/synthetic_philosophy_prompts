answer: |-
  This is a fantastic pivot. Using the Knobe Effect to teach *Omelas* sidesteps the tired "utilitarianism vs. deontology" trench warfare and forces students to confront their own folk psychology. It moves the question from "Is this mathematically correct?" to "Why does your brain insist this is murder?"

  Here is how you run that argument, where it holds, where it breaks, and why the story does something the Chairman vignette cannot.

  ### 1. The Citizens and the Asymmetry
  Your hunch is correct: The citizens of Omelas are functionally identical to Knobe's Chairman. The Chairman wants profit; the citizens want happiness. The Chairman accepts environmental harm; the citizens accept child torture. The Chairman says, "I don't care about the environment"; the citizens act as if they don't care about the child (or claim they cannot help it).

  **The Prediction:**
  If you present Omelas as a Knobe vignette, the asymmetry predicts exactly what you suspect regarding the harm, but it complicates the happiness.
  *   **Harm:** Because the child's suffering is morally bad, folk psychology will overwhelmingly classify it as **intentional**. Even if the citizens say, "We wish we didn't have to do this," the Knobe Effect suggests that because the outcome is heinous, we will ascribe intentionality to them. We want to blame, so our brain categorizes the action as intentional.
  *   **Happiness:** Here is where your specific hypothesis ("didn't intentionally make anyone happy") needs a slight tweak. In the Knobe "Help" vignette, the help is a *side effect* of profit. In Omelas, happiness is the *goal*. Therefore, logically, they *are* intentionally making people happy. However, the Knobe Effect reveals that moral valence drives intentionality ascriptions. Because the *source* of the happiness is tainted, our intuition might resist labeling the resulting joy as a "true" intentional good. We might say they intentionally pursued pleasure, but not intentionally created *good*. The asymmetry isn't that the happiness was accidental, but that we refuse to grant them moral credit for an intended outcome because the side effect (the child) was so bad.

  **The Classroom Payoff:** This stops the "utilitarianism bad" reflex. Students can't just say "the outcome is bad." They have to explain why they are so eager to call the harm "intentional" even when the citizens claim it's a necessary condition of the system. It forces them to admit that their judgment of *intent* is actually a judgment of *morality*.

  ### 2. Means vs. Byproduct (The Doctrine of Double Effect)
  Traditional ethics (specifically the Doctrine of Double Effect) draws a hard line between *intending* harm as a means (using the child as a battery) and *foreseeing* harm as a side effect (the child suffers as an unfortunate cost of the magic).

  **The Knobe Prediction:**
  The Knobe Effect suggests this distinction matters far less to human intuition than ethicists think. Whether the child is the engine (means) or the exhaust (byproduct), the moral badness of the suffering swamps the technical distinction.
  *   If the child is a **tool**, we say it's intentional harm.
  *   If the child is a **side effect**, Knobe predicts we *still* say it's intentional harm because the outcome is negative.

  **The Breakdown:**
  This is where the reading gets sticky. In the Chairman vignette, the harm is purely causal (pollution). In Omelas, the link is ritualistic/magical. The suffering isn't just a cost; it's the *terms of the contract*. The citizens know that if the child were relieved, the happiness would vanish. This makes the suffering a **necessary condition**. In folk psychology, knowingly maintaining a necessary condition for a goal is often treated the same as intending the goal itself. So, Knobe supports the idea that the citizens are intentional harmers regardless of the metaphysical mechanism.

  ### 3. The Ones Who Walk Away
  This is the most provocative application. The walkers know the causal link. They know leaving won't save the child. They simply remove themselves from the system.

  **The Knobe Logic:**
  *   **Stayers:** Intentionally harm (by participating/supporting).
  *   **Walkers:** Intentionally allow harm (by omission).

  If the Knobe Effect holds, we should judge the walkers based on the outcome they knowingly permit. They walk away to preserve their own moral self-concept ("I am not the kind of person who lives here"), knowing the child remains in misery.
  *   **Prediction:** A strict Knobe reading might suggest the walkers are **intentionally prioritizing their own purity over the child's welfare.** They are making a choice (walking) with a foreseen bad side effect (the child stays suffering).
  *   **Story's Intent:** Le Guin clearly wants us to admire the walkers. They are the moral compass.
  *   **The Tension:** If you apply Knobe rigorously, the walkers look like moral narcissists. They refuse to get their hands dirty, but they don't actually help the victim. This is a brilliant friction for class discussion. Does the story want us to see them as heroes, or as the only ones honest enough to admit the bargain is intolerable, even if they can't fix it? Knobe suggests we might judge them for "intentionally" abandoning the child to keep their own hands clean.

  ### 4. Where the Reading Breaks Down (The Reader's Role)
  This is the crux of your insight. The Chairman vignette is sterile; *Omelas* is seductive. The Knobe reading breaks down because of the **narrative voice**.

  **The "You" Factor:**
  Knobe vignettes are third-person: "The Chairman did X." You judge *him*.
  *Omelas* is second-person: "You believe in happiness? Come, let us see."
  Le Guin refuses to describe the city in detail, forcing *you* to fill in the norms. You imagine the music, the boats, the sex, the drugs. You build the happiness in your own head.
  *   **The Difference:** In the Chairman vignette, you are an external judge. In *Omelas*, you are a **co-conspirator**. By imagining the city, you have already accepted the bargain. You have already visualized the joy that requires the child.
  *   **Why Knobe Fails Here:** The Knobe Effect relies on a detached observer judging an agent. Le Guin removes the detachment. You cannot easily say "They intentionally harmed the child" without implicating yourself, because *you* are the one who supplied the texture of the happiness. The narrator explicitly says, "If so, please add an orgy." You are the Chairman.

  **The Silence:**
  You noted the citizens never say the Chairman's line ("I don't care about the child"). They are described as mature, intelligent, passionate adults. They *do* care, which makes it worse. The Chairman is a sociopath; the citizens are normal people.
  *   **Knobe:** Predicts we blame the indifferent Chairman.
  *   **Omelas:** Forces us to blame the *caring* citizen. This is harder. If they cared, and did it anyway, is it more intentional or less? Knobe doesn't quite capture the horror of *reluctant* complicity. The story suggests that knowing the cost and accepting it is worse than indifference.

  ### Summary for the Lesson Plan
  1.  **Start with Knobe:** Run the Harm/Help vignettes. Establish the asymmetry (Bad side effects = Intentional; Good side effects = Unintentional).
  2.  **Apply to Citizens:** Ask students: "Are the citizens intentionally harming the child?" Most will say yes. Ask: "Why? They say it's a condition of the magic, not their personal goal." Use Knobe to show their moral outrage is driving their judgment of intent.
  3.  **Apply to Walkers:** Ask: "If staying is intentional harm, is leaving intentional abandonment?" Challenge the hero narrative. Are they walking away to save the child, or to save themselves?
  4.  **The Pivot:** Pull the rug. Remind them that in the vignette, they judged the Chairman. In *Omelas*, the narrator says "You." Ask them: "Did *you* intentionally imagine the happiness? Then did *you* intentionally accept the child's suffering?"

  This approach prevents the "Utilitarianism Bad" shutdown because it's no longer about calculating utility. It's about the psychology of blame and the terrifying realization that our intuition for "intentionality" is just a mask for our desire to punish.
