answer: |-
  There is no single Latin term that perfectly captures this specific two-pronged trap, but in political theory and rhetoric, it is most accurately described as **Weaponized Chesterton's Fence**, or more formally, an **Argument from Inscrutability**.

  It is a specific corruption of **Status Quo Bias** fortified by **Epistemic Asymmetry**.

  Here is the breakdown of the move, how it differs from legitimate caution, and where the line is drawn between wisdom and obscurantism.

  ### 1. Naming the Move
  While everyone calls it "Chesterton's Fence," that is the parent heuristic, not the specific fallacy you are describing. G.K. Chesterton's original point was: *Do not remove the fence until you have discovered the reason it was put there.* He assumed the reason was discoverable.

  The move you are encountering adds a second, unspoken premise: *The reason is inherently undiscoverable, and that undiscoverability is proof of its necessity.*

  Scholars of bureaucracy and legal theory might call this **Epistemic Lock-in** or **Institutional Obscurantism**. But the most precise descriptive label is the **Argument from Inscrutability**: "The text/rule is illegible to us; therefore, it is sacred."

  It functions as a **Catch-22 of Governance**:
  *   **To remove the old rule:** You must prove it is useless.
  *   **The evidence:** Is lost to time.
  *   **Therefore:** You cannot prove it is useless.
  *   **Therefore:** It must stay.

  *   **To add a new rule:** You must prove it will not break anything.
  *   **The evidence:** Is located in an unpredictable future.
  *   **Therefore:** You cannot prove it won't break anything.
  *   **Therefore:** It must not happen.

  ### 2. How It Differs from Respectable Caution
  You asked for the line between the "bad version" and the "respectable one." This is crucial because, as you noted, complex systems *do* have hidden load-bearing walls (tacit knowledge).

  The difference lies in **Attitude Toward Inquiry** and **Falsifiability**.

  #### The Respectable Version (Oakeshottian Conservatism)
  The philosophical defense for this position is best articulated by Michael Oakeshott. He argued that societies possess "practical knowledge" (knowing how to ride a bike) that cannot be fully reduced to "technical knowledge" (a manual on bike riding).
  *   **The Stance:** "We don't know why this rule exists, and our current tools might not be able to uncover it. Therefore, we should proceed with extreme caution."
  *   **The Goal:** Preservation while investigating.
  *   **The Burden:** Shared. The defenders must try to articulate the value; the challengers must try to understand the function.
  *   **Falsifiability:** High. If evidence *is* found that the rule is harmful, the rule goes. The "unknown" is a temporary placeholder, not a permanent shield.

  #### The Bad Version (Bureaucratic Obscurantism)
  This is the move you are fighting. It converts *uncertainty* into *authority*.
  *   **The Stance:** "We don't know why this rule exists, and *nobody ever can*. Therefore, it is dangerous to touch."
  *   **The Goal:** Obstruction.
  *   **The Burden:** Asymmetric. The challenger must prove a negative (that no hidden benefit exists) using evidence that has been destroyed.
  *   **Falsifiability:** Zero. The rule is immune to disproof because the criteria for disproof (knowing the original intent) is defined as impossible.

  ### 3. The Line: Three Tests
  To distinguish between a load-bearing fence and a weaponized one, apply these three tests. If the argument fails these, it is the "bad version."

  **A. The Investigability Test**
  *   **Respectable:** "Let's pause removal while we research archives/interview elders/run simulations to find the reason."
  *   **Bad:** "Research is futile; the fact that we *can't* find the reason is the reason."
  *   *The Line:* Does the mystery invite inquiry, or does it terminate it?

  **B. The Symmetry Test**
  *   **Respectable:** Applies the same standard of risk to *keeping* the rule as *changing* it. "We don't know what this old rule does, so keeping it might also be dangerous."
  *   **Bad:** Assumes the *status quo* is risk-free and *change* is risky. "The devil we know is safer than the devil we don't," even when we *don't* know the devil we have.
  *   *The Line:* Is the "unknown" treated as a threat on both sides, or only on the side of change?

  **C. The Sunset Test**
  *   **Respectable:** "We will keep this for now, but review it in 5 years."
  *   **Bad:** "We must keep this forever because we can't verify its safety."
  *   *The Line:* Is the "lack of knowledge" a temporary suspension of judgment, or a permanent veto?

  ### 4. Why It Feels Different from "Argument from Ignorance"
  An ordinary *Argument from Ignorance* says: "You can't prove it's false, so it's true."
  This move is more sophisticated. It says: "The *history* of this object proves that our ignorance is a feature, not a bug."

  It relies on a **Lindy Effect** fallacy. The Lindy Effect suggests that the longer something has survived, the longer it is likely to survive. The bad move conflates *survival* with *fitness*. A rule might survive not because it is useful, but because it is invisible, or because it benefits those in power, or simply due to bureaucratic inertia. Treating "survival despite opacity" as proof of "utility" is the core logical error.

  ### Summary
  The move is **Weaponized Chesterton's Fence**. It differs from legitimate caution because it treats **epistemic limits as moral boundaries**.

  *   **Legitimate Caution:** "We don't know enough to act yet." (A call for more data).
  *   **The Bad Move:** "We can't know enough to ever act." (A call for surrender).

  The line is drawn at **Falsifiability**. If the proponents of the rule cannot conceive of *any* evidence that would convince them to remove it, they are not guarding a load-bearing fence; they are guarding a fetish. A load-bearing wall can be proven load-bearing (by engineering analysis). A magical wall is one where the analysis is forbidden because the result might be disappointing.
