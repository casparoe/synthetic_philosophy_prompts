  5. **Full-Credit Sentences:**
  *   **For Part (a/b):** "Priya's case *is* an instance of the nonidentity problem because, although the number of children is the same, the *identity* of the child differs; the Person-Affecting View cannot say Nadia is harmed because she would not exist had Priya waited."
  *   **For Part (c):** "This repair fails because in the 'ought' scenario (waiting), Nadia does not exist; therefore, we cannot say Nadia is worse off than she would have been in that scenario, as there is no 'she' to compare."

  6. **Note on Defensible Moves:**
  The student's analysis of the **Extraction Case** in parts (a) and (b) is defensible and strong. They correctly identify that the Person-Affecting View struggles to condemn the depletion policy because the future people are not made worse off relative to their only alternative (non-existence). This shows they understand the political/intergenerational force of the problem, even if they stumbled on the single-case logic. Additionally, their description of the *mechanism* of the proposed repair in part (c) (shifting the baseline to the normative 'ought') is accurate to the prompt; the error lies solely in the application of that mechanism to the specific metaphysics of the case.
