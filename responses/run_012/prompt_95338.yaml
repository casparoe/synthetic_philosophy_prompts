  # ETHICS BOWL DECISION TREE: TROLLEY & DOUBLE EFFECT

  **STARTING COMMITMENT:** *Standard Bystander Case is Permissible* (Diverting trolley onto side track where 1 worker dies to save 5 is allowed).

  ### NODE 1: THE LOOP VARIANT
  **Question:** In the **Loop Case** (the side track loops back; the one person's body must stop the trolley to save the five), is diverting the trolley permissible?
  *   **NO** → Go to **Node 2** (Constraints exist).
  *   **YES** → Go to **Node 4** (Aggregation/Threat Redirect).

  ---

  ### NODE 2: THE SOURCE OF CONSTRAINT
  **Question:** In the Loop Case, is the action impermissible primarily because the death is *intended*, or because the person is *used* as a means?
  *   **INTENDED** → Go to **Node 3A** (Double Effect Path).
  *   **USED** → Go to **Node 3B** (Means/Rights Path).

  ### NODE 3A: DOUBLE EFFECT THRESHOLD
  **Question:** Does the prohibition against intending harm vanish if the number saved is sufficiently large (e.g., 1,000,000)?
  *   **NO** → **LEAF 1: Strict Double Effect** (Intention is an absolute bar).
  *   **YES** → **LEAF 2: Threshold Double Effect** (Intention is a weighted constraint).

  ### NODE 3B: MEANS THRESHOLD
  **Question:** Does the prohibition against using a person vanish if the number saved is sufficiently large?
  *   **NO** → **LEAF 3: Strict Means-Based View** (Rights are absolute side-constraints).
  *   **YES** → **LEAF 4: Threshold Rights View** (Rights can be overridden by catastrophic stakes).
      *(Note: Leaves 1 & 3 yield identical verdicts on all standard cases; the tree separates them only by self-reported reasoning.)*

  ---

  ### NODE 4: THE FOOTBRIDGE CASE
  **Question:** In the **Footbridge Case** (pushing a large person off to stop the trolley), is pushing permissible?
  *   **YES** → Go to **Node 5A** (Full Aggregation).
  *   **NO** → Go to **Node 5B** (Restricted Aggregation).

  ### NODE 5A: FULL AGGREGATION THRESHOLD
  **Question:** Is pushing permissible solely because the net lives saved outweigh the loss, regardless of the number?
  *   **YES** → **LEAF 5: Act Utilitarianism** (Maximize good in every act).
  *   **NO** → **LEAF 6: Threshold Consequentialism** (Aggregation requires a minimum stakes threshold).

  ### NODE 5B: RESTRICTION REASON
  **Question:** Is pushing impermissible because it involves *direct physical force* (Doing) or because there *was another route* available (Necessity)?
  *   **DIRECT FORCE** → **LEAF 7: Doing/Allowing View** (Moral significance lies in the mode of agency).
  *   **NO OTHER ROUTE** → **LEAF 8: Necessity View** (Permissibility depends on the absence of less harmful options).
      *(Note: Leaves 7 & 8 yield identical verdicts on all standard cases; the tree separates them only by explanatory principle.)*

  ---

  ### UNOCCUPIED LOGICAL LEAVES
  *(These leaves are structurally possible but philosophically barren.)*

  **NODE 4 BRANCH (Loop NO / Footbridge YES):**
  *   **LEAF 9: The Directness Paradox.**
      *   *Path:* Loop Impermissible → Footbridge Permissible.
      *   *Status:* **Incoherent.** This view is unoccupied because the physical use of the body in the Loop is typically seen as less invasive than the direct assault in Footbridge; reversing this valuation lacks a consistent principle.

  **NODE 5B BRANCH (Loop YES / Footbridge NO / Reason: NEITHER):**
  *   **LEAF 10: The Unexplained Constraint.**
      *   *Path:* Loop Permissible → Footbridge Impermissible → Reason is neither Doing/Allowing nor Necessity.
      *   *Status:* **Unexplored.** This position is unoccupied because non-consequentialist constraints generally rely on one of those two distinctions to explain why redirecting a threat differs from creating a new one.

  ---

  ### SUMMARY OF POSITIONS
  1.  **Strict Double Effect:** Intending harm is never permissible.
  2.  **Threshold Double Effect:** Intending harm is permissible only to prevent catastrophe.
  3.  **Strict Means-Based View:** Using persons as tools is never permissible.
  4.  **Threshold Rights View:** Using persons is permissible only to prevent catastrophe.
  5.  **Act Utilitarianism:** Always maximize net lives saved.
  6.  **Threshold Consequentialism:** Maximize lives, subject to a stakes threshold.
  7.  **Doing/Allowing View:** Harming is worse than allowing harm; pushing is harming.
  8.  **Necessity View:** Harm is permissible only if no less harmful alternative exists.
  9.  **Directness Paradox:** (Undefended/Incoherent).
  10. **Unexplained Constraint:** (Undefended/Unexplored).
