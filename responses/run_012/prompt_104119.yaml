answer: |-
  ### Exam Question

  **Question 4 (20 marks)**
  Consider an agent reasoning about the output of a fixed, deterministic computer program $P$ that produces a string of 200 bits. The agent does not have the computational resources to run $P$. They argue that the probability of the output being all zeros ($0^{200}$) is approximately $2^{-200}$, relying on the **presumption of independence**: they treat each bit as an independent coin flip with $p=0.5$.

  Write an essay addressing the following three points:
  1.  **Epistemic Status:** Explain what this probability assignment represents. Is it a claim about the physical machinery of the computer, or the state of the agent? Justify why independence is assumed despite the determinism.
  2.  **Failure Mode:** Construct a specific example of a deterministic program $P'$ where this heuristic argument yields a catastrophically incorrect probability estimate. Explain *why* the heuristic fails in this specific case.
  3.  **Philosophical Upshot:** Does the existence of such failure cases show that the presumption of independence is a false claim about the world, or a defeasible norm for the reasoner? Defend your position.

  *(Recommended time: 50 minutes)*

  ***

  ### Model Answer

  The presumption of independence in this context is a principle of **logical uncertainty**, not physical chance. Since the program $P$ is fixed and deterministic, the ontic probability of it outputting $0^{200}$ is strictly 1 or 0. The agent's assignment of $2^{-200}$ does not describe the computer's mechanics; the computer contains no random number generator. Instead, this probability quantifies the agent's **epistemic state** given bounded computational resources. The agent cannot deduce the output from the code, so they must assign a credence distribution over the possible outputs.

  The assumption of independence is justified as a **Maximum Entropy** choice. Absent specific computational evidence linking bit $i$ to bit $j$, the agent possesses no information that distinguishes one 200-bit string from another. To assign a probability other than $2^{-200}$ to the all-zeros string would require positing correlations the agent cannot verify. Treating the bits as independent fair coins is the unique prior that maximizes entropy (minimizes unwarranted structure) relative to the agent's current knowledge. It is a normative requirement for a bounded reasoner who lacks the power to analyze the code's causal structure.

  However, this heuristic is vulnerable to structural correlations invisible to the coarse-grained model. Consider a program $P'$ that generates 100 random bits $b_1, \dots, b_{100}$ and outputs the string $b_1, \dots, b_{100}, b_1, \dots, b_{100}$ (concatenating the string with itself). This program is fully deterministic. If the agent applies the presumption of independence to the 200 output bits, they estimate $P(output = 0^{200}) \approx 2^{-200}$. In reality, the output is all zeros if and only if the initial 100 bits are all zeros. The true probability (relative to the uncertainty over the initial 100 bits) is $2^{-100}$. The heuristic underestimates the probability of the all-zeros event by a factor of $2^{100}$—a catastrophic error.

  The failure occurs because the agent's model treats the second half of the string as new information, whereas it is structurally redundant. The bits are not independent; bit $i$ is perfectly correlated with bit $i+100$. The heuristic fails not because the world is random, but because the agent's **prior over hypotheses** was too coarse to capture the dependency structure of $P'$.

  This demonstrates that the presumption of independence is a **defeasible norm for the reasoner**, not a claim about the world. If it were a claim about the world (i.e., that deterministic processes generally produce independent bits), the existence of $P'$ would falsify it. But the presumption is not an empirical generalization; it is a default setting for rational belief in the face of logical intractability. When the agent learns the structure of $P'$ (the repetition code), rationality demands they update their prior to reflect the correlation. The "failure" is simply the gap between the default prior (independence) and the informed posterior (correlation).

  Therefore, the presumption remains valid as a starting point for bounded agents. It is the correct epistemic stance when structural knowledge is absent. The error in the $P'$ case lies in the agent's failure to acquire or process structural information, not in the normative rule that says "assume independence when you know nothing else." The probability lives in the reasoner's map, not the territory's geography.

  ***

  ### Marking Scheme (20 Marks Total)

  **1. Epistemic Status & Determinism (5 Marks)**
  *   **Full Credit (5):** Explicitly states the probability is a measure of *logical uncertainty* or *belief*, not physical chance. Notes that the program is deterministic (probability is ontically 0 or 1).
  *   **Partial (2-3):** Mentions uncertainty but vague on whether it's physical or epistemic.
  *   **Zero (0):** Claims the computer might be random or treats the probability as a frequency.
  *   *Typical B-Student Blow-up:* Says "Since we don't know the output, it acts random," implying the uncertainty makes the *process* random rather than the *belief* uncertain.

  **2. Justification of Independence (5 Marks)**
  *   **Full Credit (5):** Identifies the assumption as a **Maximum Entropy** move, **Principle of Indifference**, or a necessary default for **bounded rationality**. Explains it minimizes unwarranted assumptions.
  *   **Partial (2-3):** Says it's "simpler" or "standard" without explaining the normative force (why we *should* do it).
  *   **Zero (0):** Claims bits are independent because "that's how numbers work."
  *   *Typical B-Student Blow-up:* Treats independence as a statistical fact about code rather than an epistemic norm about priors.

  **3. Construction of Failure Case (5 Marks)**
  *   **Full Credit (5):** Provides a concrete deterministic program where bits are correlated (e.g., repetition, parity check, constant output). Correctly calculates the discrepancy (e.g., $2^{-100}$ vs $2^{-200}$).
  *   **Partial (2-3):** Describes a correlated program but fails to quantify the probability error.
  *   **Zero (0):** Describes a random program or a bug, rather than structural correlation.
  *   *Typical B-Student Blow-up:* Suggests the computer might "glitch" or use a pseudo-random generator, missing the point about deterministic structure.

  **4. Philosophical Upshot (World vs. Reasoner) (5 Marks)**
  *   **Full Credit (5):** Concludes the presumption is a **norm for the reasoner** (defeasible prior). The failure indicates missing structural knowledge, not a false claim about reality.
  *   **Partial (2-3):** Says it's "both" or hedges without committing to the epistemic nature of the norm.
  *   **Zero (0):** Concludes the heuristic is "false" because the world isn't independent.
  *   *Typical B-Student Blow-up:* Treats the failure as a refutation of the heuristic itself, rather than a signal to update the prior.

  **Differentiation Note (A vs. B):**
  *   **A Student:** Clearly separates the *map* (the prior/heuristic) from the *territory* (the deterministic code). They argue that the heuristic is *rational* even when *wrong* about the specific case, provided the structural info was unavailable.
  *   **B Student:** Understands the math but slides into ontic language (e.g., "the bits aren't really independent"). They treat the heuristic as an empirical hypothesis that was falsified, rather than an epistemic default that was overridden.
