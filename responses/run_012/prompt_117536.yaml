answer: |-
  # Session Plan: The Architecture of Agreement
  **Course:** Social Ontology (Upper-Level Undergraduate)
  **Time:** 90 Minutes
  **Students:** 18
  **Materials:** 40 slips of paper (half-sheets), 18 pens, whiteboard + markers, masking tape (optional).

  ## I. Materials & Setup
  *   **Seating:** Arrange chairs in a tight circle initially. For Round 2, you will need to split them into two distinct clusters (Left and Right) facing the whiteboard.
  *   **The "Scoreboard":** Draw a table on the whiteboard with columns: *Round | Group | Chosen Number | Success (Y/N) | Points*.
  *   **The Slips:** Pre-cut paper. Each student needs one per round.
  *   **The Cover:** Do not write "Philosophy" or "Convention" on the board. Write: **"Protocol Optimization Study: Iterative Coordination."**

  ## II. Minute-by-Minute Timeline

  | Time | Segment | Activity |
  | :--- | :--- | :--- |
  | **00:00 – 00:05** | **Intro** | Cover story, rules of silence, distribution of slips. |
  | **00:05 – 00:15** | **Round 1** | **The Scatter.** No cues. Pure coordination. (10 mins) |
  | **00:15 – 00:35** | **Round 2** | **The Cue.** Split groups. Arbitrary public signals. (20 mins) |
  | **00:35 – 00:55** | **Round 3** | **The Latecomers.** Precedent transmission without instruction. (20 mins) |
  | **00:55 – 01:15** | **Round 4** | **The Divergence.** Asymmetric payoffs. Test for policing. (20 mins) |
  | **01:15 – 01:30** | **Debrief** | Lewisian mapping, Common Knowledge, Norms vs. Conventions. (15 mins) |

  *(Note: Transitions must be military-precise. Use a timer visible to you.)*

  ## III. The Opening Script (First 60 Seconds)
  *(Stand at the front. Do not smile. Do not apologize for the oddness of the task. Speak as if this is a standard lab procedure.)*

  "Good morning. Please take a slip of paper and a pen. Do not write your name on the slip.

  For the next hour, we are running a series of coordination trials. The objective is simple: maximize your individual point score. The mechanism is collective: points are awarded based on the group's ability to converge on a single option without verbal communication.

  There are three rules.
  One: Absolute silence. If you speak, your group scores zero for that round.
  Two: No gesturing. You may look at each other, but you may not signal.
  Three: Write one number between 1 and 5 on your slip. Hold it face down until I collect them.

  We are not testing your math. We are testing your ability to predict what others will predict you will do. If the majority of the room writes the same number, everyone who wrote that number gets 10 points. If the room scatters, no one gets points.

  Begin Round 1. You have 60 seconds. Write your number."

  ## IV. Round Mechanics & Payoff Announcements

  ### Round 1: The Scatter (No Cue)
  *   **Instruction:** "Write a number 1–5. Coordinate silently."
  *   **Expected Outcome:** Scattering (1s, 3s, 5s). Maybe a accidental cluster on 3 or 7 (if they ignore the 1-5 limit).
  *   **Scoring:** Tally the modal number. If >50% match, award points. (Likely 0 points).
  *   **Board:** Record "Failure" or low score.
  *   **Goal:** Establish the difficulty of pure coordination without a focal point.

  ### Round 2: The Cue (Arbitrary Salience)
  *   **Setup:** Physically move chairs. Split the room 9 vs 9. Left Group faces Left Whiteboard space; Right Group faces Right Whiteboard space.
  *   **Instruction:** "You are now two independent teams. You compete only against your own consistency. The payoff is the same: 10 points if your team matches."
  *   **The Cue (Write on Whiteboard while they watch):**
      *   **Left Group:** Write **"THINK PRIME"** in large letters.
      *   **Right Group:** Write **"THINK EVEN"** in large letters.
      *   *(Crucial: Do not explain the text. Just write it.)*
  *   **Expected Outcome:** Left converges on 3 (or 5). Right converges on 2 (or 4).
  *   **The Reveal:** Ask each group what they picked. Reveal that the *other* group picked something different.
  *   **Point to Make:** Both cues are arbitrary. Neither is "better." But both produced internal order.
  *   **Board:** Record Left's Number and Right's Number. Award points to both.

  ### Round 3: The Latecomers (Precedent & Transmission)
  *   **Setup:** Keep the groups from Round 2.
  *   **Instruction:** "We are simulating member turnover. I need three volunteers from the Left Group to step outside the door for two minutes. Do not talk to each other in the hall."
  *   **Action:** Send 3 students out.
  *   **To the Remaining Room:** "Play the round again. Same rules. You know your cue. They do not." (Remind them of the "THINK PRIME" cue implicitly by pointing to the board, or just let the precedent of Round 2 carry it). *Better:* Erase the cue text. Leave only the score from Round 2. Let them rely on *precedent* alone.
  *   **To the Latecomers (upon return):** "Join your group. Play the round. You did not see the previous instructions."
  *   **Expected Outcome:** The core group picks the Round 2 number (e.g., 3). The latecomers must guess. If the convention is strong, latecomers will infer the number from the group's behavior or sheer expectation.
  *   **Board:** Record success rate of latecomers.

  ### Round 4: The Divergence (Conflicting Interests)
  *   **Setup:** Merge the room back into one large circle.
  *   **Instruction:** "We are now one group again. One number must be chosen by everyone for anyone to score."
  *   **The Twist (Announce clearly):** "The payoff structure has changed.
      *   **Base Payoff:** 10 points if everyone matches. 0 if we scatter.
      *   **Bonus Payoff:** Students who sat on the **Left** in Round 2 get an extra 5 points if the final number is **[Left's Round 2 Number]**.
      *   **Bonus Payoff:** Students who sat on the **Right** in Round 2 get an extra 5 points if the final number is **[Right's Round 2 Number]**."
  *   **Example:** If Left picked 3 and Right picked 2. Lefties want 3. Righties want 2. Everyone needs to match *something* to get the base 10.
  *   **Goal:** Watch for friction. Does the group default to the number chosen in Round 3? Does one side concede? Do people glare at those who pick the 'wrong' number? Do they try to signal?
  *   **Board:** Record the final number and the tension level (ask them post-round).

  ## V. The Debrief Script (15 Minutes)
  *(Move to the whiteboard. Erase the game scores. Write "LEWIS (1969)" in the center.)*

  **1. Mapping the Rounds (5 mins)**
  "Take a breath. You just enacted David Lewis's definition of convention without knowing it.
  *   **Round 1** was the state of nature. A coordination problem with no solution.
  *   **Round 2** created a **Regularity**. You converged. It was **Arbitrary**—'Prime' is not objectively better than 'Even.' It worked only because it was **Salient**.
  *   **Round 3** tested **Expectation**. You didn't need to be told the rule again. You expected the others to follow the precedent, and they expected you to know that.
  *   **Round 4** broke the **Common Interest**. Lewis assumes we all want the same outcome. In Round 4, you wanted different *versions* of the outcome."

  **2. Common Knowledge vs. Mutual Knowledge (5 mins)**
  "In Round 2, I wrote 'THINK PRIME' on the board. That is *mutual knowledge* (you all saw it). But for a convention to hold, it must be *common knowledge* (you know I saw it, I know you know I saw it, ad infinitum).
  When the latecomers entered in Round 3, they lacked the common knowledge of the cue. Yet, many of you still converged. Why? Because the *behavior* of the group became the new cue. The regularity itself became the common knowledge."

  **3. The Push Past Lewis (5 mins)**
  "Here is the critical turn. Lewis defines convention as a solution to a coordination problem where interests align. We all just wanted to match.
  But look at Round 4. When I gave the Left side a bonus for 3 and the Right side a bonus for 2, your interests diverged. You still preferred coordination to chaos, but you preferred *different* coordinations.
  Did the convention hold?
  *(Ask the room)*: Did you stick to the old number? Or did you fracture?
  If you stuck to the old number, did anyone feel resentment? Did anyone police the choice?
  Lewis says conventions are sustained by *expectation*. But when interests diverge, expectation isn't enough. You need *sanction*.
  If you glared at someone for picking the 'wrong' number in Round 4, you were no longer following a Lewisian convention. You were enforcing a **Norm**.
  A convention dissolves when it stops serving your interest. A norm persists *even when* it costs you, because the cost of violation (social sanction) is higher.
  In my reading group, the chair assignment is a convention. But if I try to change it, and you glare at me, it has become a norm. That is the disorientation I feel: watching a habit harden into a law."

  ## VI. Predicted Failures & Mitigations

  **1. The Smuggled Cue (Round 1)**
  *   **Failure:** Students pick the number of people in the room (18 -> 8?), or the number of minutes (5), or the room number.
  *   **Cause:** You inadvertently looked at your watch, or the room number is visible on the door.
  *   **Mitigation:** Before starting, cover the room number. Do not wear a watch. If they converge on a number based on an environmental cue you didn't intend, **own it** in the debrief. "This proves salience is context-dependent. The cue was the door, not the board."

  **2. The Talkers (Round 2-4)**
  *   **Failure:** Students whisper to solve the problem faster.
  *   **Cause:** The silence rule feels artificial.
  *   **Mitigation:** Do not scold. Simply mark that round as "Contaminated" and award 0 points. The loss of points is the sanction. Say: "Communication invalidates the coordination variable. Zero points."

  **3. The Tie (Round 1 & 4)**
  *   **Failure:** 9 students pick 3, 9 students pick 4. No majority.
  *   **Mitigation:** Pre-announce the tie-breaker: "In case of a tie, the lower number wins." This is itself an arbitrary convention you are imposing to keep the game moving. Note this in the debrief as "Constitutional Rules."

  **4. The Cynic (Any Round)**
  *   **Failure:** One student deliberately picks a wrong number to "break the system."
  *   **Mitigation:** This is actually data. In the debrief, ask the group how they felt about the disruptor. This perfectly illustrates the transition from Convention (annoyance) to Norm (moral outrage).

  ## VII. Limitations: What This Cannot Reproduce

  **1. The Absence of Common Knowledge**
  You cannot truly simulate the *absence* of common knowledge in a co-present room. Even when the latecomers return, they know *that* a game was played. True common knowledge involves an infinite recursion of "I know that you know..." that is hard to generate in 90 minutes. You will have to *assert* in the debrief that their feeling of "obviousness" was the phenomenological experience of common knowledge, even if the logical conditions weren't perfectly met.

  **2. Long-Run Selection**
  Lewis is concerned with how one convention wins out over another *over time* (e.g., driving on the left vs. right). This session forces a convention in 20 minutes. You cannot stage the *evolutionary drift* of a convention. You can only show the *snapshot* of its establishment. You must tell the students: "What took centuries in society, we compressed into minutes. The pressure you felt is the same pressure, but the timescale is artificial."

  **3. The "Real" Stakes**
  Points are not money, and money is not social standing. In Round 4, the "sanction" is weak because the points don't matter. You must ask them to introspect: "Did you feel a *social* pressure, even if the points didn't matter?" If they say no, the activity failed to bridge the gap to real-world norms. Be prepared to admit that without real social cost, the "Norm" in Round 4 is a simulation of a norm, not the thing itself.

  ## VIII. Instructor's Note on the "Disorientation"
  When you close the session, do not offer a neat summary. End on the tension.
  "You now have the vocabulary to describe your own reading group. The question remains: When you walk back into that room, and you see the chair you always sit in, is it a convention you can change, or a norm that will change you? Lewis gives you the map. He does not give you the exit."
