      *   **Formatting:** End with a single sentence in the form `\answer{...}`.

  2.  **Deconstruct the Pasadena Game vs. St. Petersburg:**
      *   *St. Petersburg:* Payoff $2^n$, Prob $1/2^n$. Term = 1. Sum = $1+1+1+... = \infty$. EV is infinite. Problem: Would you pay a finite amount to play? Standard EV says yes (any finite amount), intuition says no.
      *   *Pasadena:* Payoff $(-1)^{n+1} 2^n / n$, Prob $1/2^n$. Term = $(-1)^{n+1} / n$. Sum = $1 - 1/2 + 1/3 - 1/4 ... = \ln(2)$. *However*, because it's conditionally convergent, rearranging the order of summation changes the sum. Since there is no natural temporal or logical ordering of the outcomes (they are mutually exclusive possibilities), the "sum" is mathematically undefined.
      *   *Key Difference:* St. Petersburg breaks EV by exceeding bounds (infinity). Pasadena breaks EV by lacking a unique value (undefined/indeterminate).

