prompt: |-
  So my friend Maya has somehow become the unofficial referee of our group chat, which is mostly politics, and she has a very specific way of deciding whether somebody is arguing in good faith. Her track record so far:

  - The guy who calls everyone a moron, mocks people's spelling, got booted off two subreddits -- but who publicly reversed himself on the rezoning thing when someone showed him the numbers, and thanked her for it. Maya: good faith.
  - The woman who is relentlessly gracious, thanks you for the conversation, agrees with everything while you're talking, then posts the identical claim the next week like nothing happened. Maya: not good faith.
  - A guy who spent a whole thread arguing for a policy he later admitted he didn't even support, purely because he wanted to watch the other side squirm. Not good faith, obviously.
  - A guy with a genuinely weird view on a technical question, who has read the mainstream literature, can state the opposing case better than the people who actually hold it, updates on individual papers when you show him one, and still ends up where he started. Maya: good faith. She was weirdly adamant about this one. She said the conclusion being strange isn't the issue.
  - Someone who only ever asks for evidence, never states a position, never offers any of their own, and is unfailingly polite while doing it. Maya: not good faith.
  - A woman who is careful and honest but who freely admits she's terrified of changing her mind because of what it would cost her at work and with her family. Maya: still good faith. She says she isn't going to convict somebody for being cornered.

  Now the one we can't agree on. Our friend Dev has spent four years doing his own research on a political question. He's not a liar -- he'll tell you exactly what he thinks, he's read actual papers, he'll say when he doesn't understand a statistic, he's never made anything up, and I definately believe him when he says he'd change his mind given good evidence. But the sources he reads are a little cluster that mostly cite each other. He has never read the mainstream case in its strongest form. When I offer him the standard review article he says he'll get to it, and he doesn't. His explanation is that he already knows what the mainstream says, he's heard it all before.

  Maya says she needs to think about it. I think she'll come down on good faith, but I might be wrong, and I care less about the verdict than about the rule she's actually running. I can see at least two rules that fit everything above: (1) good faith is about the quality of someone's reasoning relative to the evidence they actually have, and (2) good faith includes the work of not building yourself a rigged information diet in the first place. Those give different answers on Dev, and I suspect there's a third rule that fits her calls just as well -- maybe something like: good faith is something you owe the person you're talking to, so their disagreement has to be able to set your agenda, rather than just being a claim you assess from where you already stand.

  So: what's your best guess at her verdict on Dev, which of these rules do her earlier calls actually commit her to as opposed to merely permit, what does each rule predict about him, and what's the case you'd put to her next that would tell the rules apart? And say something about what work the verdict is even doing -- if she says good faith, does that mean I should keep arguing with him, or only that I shouldn't be annoyed at him? Those feel like two different questions and she keeps answering both with one word. Don't tell me it depends on the details. Pick a rule, defend it, and tell me what she'd have to say about some further case to prove me wrong.
