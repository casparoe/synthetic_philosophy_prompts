answer: |-
  (1) "The view, restated"
  You propose that propositional unity is adverbial rather than nominal. Constituents do not require a further entity (a relation, form, or glue) to combine; rather, their existence within the proposition is inherently combinatorial. Unity is a "mode of being" immanent to the constituents when they occur propositionally. This avoids reifying unity, supposedly halting Bradley's regress by denying the premise that unity must be an item. However, your formulation leaves ambiguous whether this "mode" is grounded in the intrinsic nature of the constituents (they *can* only exist jointly) or is a brute fact about their occurrence. If the former, you risk reintroducing structure; if the latter, you risk obscurity.

  (2) "The case against, ranked"

  1.  **The Direction/Order Problem (Decisive)**
      This is the strongest objection. Predication is asymmetric: *a* being *F* differs from *F* being *a*. If the proposition is just constituents occurring "jointly," and the constituents and the mode of jointness are identical in both cases, the view lacks resources to distinguish them. Truth conditions diverge (one is true, the other false), so the metaphysical grounds must diverge. To answer, you must claim the constituents themselves carry directional valencies (e.g., *a* is saturable, *F* is saturating). But if you say this, you have reintroduced structural roles or "slots," collapsing into the very structured-entity view you sought to avoid. If you deny this and say direction is brute, you surrender explanatory power. A view that cannot distinguish a proposition from its converse cannot account for truth conditions.

  2.  **The Explanatory Regress (Highly Damaging)**
      You claim to stop Bradley's regress by denying unity is an entity. But the regress is often explanatory, not merely ontological. The challenge is: what *makes* the constituents represent a state of affairs? Asserting "they occur jointly" asserts the unity but does not explain what grounds it. If the jointness is primitive, you haven't solved the problem; you've named it. To answer, you must argue that demanding an explanation for unity is a category mistake. However, without an account of *how* immanent unity generates representation, the view looks like a placeholder. Stopping the regress by fiat is only valid if the alternative is incoherent, which rivals deny.

  3.  **The Problem of Falsity (Damaging)**
      If unity is a mode of *being* for the constituents, what is the status of a false proposition? In a true proposition, the constituents exist jointly (perhaps as a fact). In a false one, do they exist jointly? If yes, what distinguishes the proposition from the fact? If no, in what sense do they "occur" together? If the mode of being is immanent, it suggests actual instantiation. You must distinguish propositional unity from factual unity without positing extra entities. If you say false propositions have "intentional" unity, you've shifted the problem to intentionality without solving the metaphysical unity issue.

  4.  **The Plurality Distinction (Moderately Damaging)**
      What metaphysically distinguishes the proposition from the mere plurality of its constituents? If unity is not an extra item, and not a structure, the difference seems to be merely stipulated. You say one is a "combination" and the other a "list." But if there is no ontological difference (no extra entity, no structure), this distinction is obscure. To answer, you must claim the distinction is primitive. This is costly: it makes the fundamental category of your ontology (the proposition) indistinguishable from a set except by label. This threatens to make the view a notational variant of pluralism.

  5.  **Collapse into Unsaturatedness (Moderately Damaging)**
      Your view risks being a notational variant of the unsaturated-constituent view. If constituents occur "in combination," do they have a potential for combination? If so, this potential is internal structure. If not, how do they combine? If you admit internal combinatorial potential, you haven't avoided structure; you've just internalized it. If you deny it, combination becomes magical. Either way, you haven't offered a distinct alternative, merely a different vocabulary for constituent valency. This undermines the novelty and theoretical gain of your position.

  (3) "What a defender would concede"
  A sympathetic defender must concede that the Direction Problem imposes a real cost. You cannot maintain pure symmetry in joint occurrence; you must admit some asymmetry in the constituents themselves, effectively accepting a lightweight structuralism. You should also concede that unity is primitive; demanding a further analysis of "combination" is likely a category mistake, as combination is the ground for analysis, not its result. However, you can legitimately dismiss the demand for a "mechanism" of unity. If unity is a fundamental mode of existence, asking what unifies it is like asking what validates logic. The cost is primitivism, but the benefit is avoiding an ontology of abstract glue.

  (4) "Is it insulated?"
  The view risks unfalsifiability if every objection is met with "it's primitive." If the distinction between proposition and plurality is brute, and direction is brute, and unity is brute, the view becomes dogmatic. However, primitivism is acceptable if it reduces overall theoretical complexity. You are insulated from the ontological regress (no extra entities), but not the explanatory regress. To avoid fatal insulation, you must specify truth-conditions clearly. If you cannot explain how immanent unity yields different truth conditions for *aRb* and *bRa*, the view is empirically inadequate regarding language use, regardless of its metaphysical elegance.

  (5) "Bottom line"
  Your primary vulnerability is the Direction Problem; if you cannot explain asymmetry without reintroducing structural roles, the view collapses. Second, you must clarify how false propositions possess unity without being facts. Do not hide behind "primitive mode" claims unless you can show rivals face worse primitivism. Focus your defense on explaining truth-conditional differences, or the view will remain metaphysically elegant but linguistically inert.
