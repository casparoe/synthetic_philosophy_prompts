      *   *Refining the (1) vs (3) argument:* The NZ model treats sex work as work. Labor policy generally doesn't aim to reduce the number of nurses or construction workers, but to improve conditions. Aiming for *less* sex work implies it's a "social bad," which edges back toward the moralizing rejected in (2).

