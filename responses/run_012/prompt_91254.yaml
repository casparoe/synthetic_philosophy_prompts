      *   *The Tension:* If you treat it as work (1), you generally facilitate access to it (safety, contracts, advertising). If you want less of it (3), you might discourage entry, restrict advertising, or limit third-party involvement (which contradicts full decrim of third parties).
      *   *Nuance:* The NZ model *does* allow for exit services, but it doesn't structurally inhibit the market. Point (3) suggests a normative goal of market contraction.

  4.  **Evaluate Other Potential Conflicts:**
      *   (1) vs. (5): Sex worker orgs are not monolithic. Some support decrim (NSWP, etc.), some support Nordic (CATW, though less "worker" led). Generally, major global sex worker led orgs support decrim. So (1) and (5) align *if* you prioritize the largest global coalitions. But if "testimony" includes individual workers who want to exit, there's tension.
