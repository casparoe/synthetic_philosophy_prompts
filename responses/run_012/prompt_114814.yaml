answer: |-
  This activity forces students to physically enact a dynamic inconsistency by committing to Allais-style choices before realizing those choices imply contradictory plans for the same future node.

  ### **Logistics and Materials**

  *   **Class Size:** 20 students.
  *   **Time:** 75 minutes.
  *   **Currency:** "Course Points" (CP). 10 CP = Moderate Prize, 50 CP = Large Prize. At the end of class, draw one student's name to redeem their points for a real \$20 gift card (scaling the points proportionally), ensuring stakes are non-zero but budget-safe.
  *   **Materials:**
      *   20 "Decision Slips" (half-sheet paper) with four checkboxes: **1A, 1B, 2A, 2B**.
      *   20 "Plan Slips" (half-sheet paper) with one checkbox: **Option X, Option Y**.
      *   Two large opaque bags (Bag 1, Bag 2).
      *   Whiteboard and markers.
      *   A physical "Booth" (a desk at the front where students drop slips face-down into a box).

  ### **Exact Prizes and Probabilities**

  Use a "100-Ticket" mental model for all probabilities.

  *   **Pair 1 (The Certainty Pair):**
      *   **1A:** 100 tickets win **10 CP**.
      *   **1B:** 89 tickets win **10 CP**, 10 tickets win **50 CP**, 1 ticket wins **0 CP**.
  *   **Pair 2 (The Risk Pair):**
      *   **2A:** 11 tickets win **10 CP**, 89 tickets win **0 CP**.
      *   **2B:** 10 tickets win **50 CP**, 90 tickets win **0 CP**.

  ### **Minute-by-Minute Timeline**

  **00:00 – 00:10: Setup and Private Commitment**
  *   Hand out Decision Slips. Explain the currency and the final draw for the real prize.
  *   Instruct students to mark **one** choice in Pair 1 and **one** choice in Pair 2 privately.
  *   Emphasize: "Choose what you actually prefer. There are no wrong answers yet."
  *   Students walk to the Booth and drop slips into the box.

  **00:10 – 00:25: The Tally and Pattern Reveal**
  *   Tally the slips visibly on the board. In a class of 20, you typically expect the Allais Common Consequence pattern:
      *   Pair 1: Majority choose **1A** (The Sure Thing).
      *   Pair 2: Majority choose **2B** (The Gamble).
  *   *Instructor Note:* If the class splits 50/50, point out the aggregate trend or use your own pre-prepared "typical data" to supplement. You need the 1A/2B pattern to proceed.
  *   Ask two volunteers who chose 1A and 2B to stand. Ask the class: "Is this irrational?" Most will say no. Accept this. Do not mention Independence yet.

  **00:25 – 00:40: The Two-Stage Restaging**
  *   Draw two decision trees side-by-side on the whiteboard.
  *   **Tree 1 (Represents Pair 1):**
      *   Root Node splits: 89% chance of **10 CP** (End); 11% chance of **Sub-Lottery**.
      *   Sub-Lottery Choice: **Option X** (100% 10 CP) OR **Option Y** (10/11 chance 50 CP, 1/11 chance 0).
      *   *Explain:* "If you chose 1A, you effectively chose Option X here. If you chose 1B, you chose Option Y."
  *   **Tree 2 (Represents Pair 2):**
      *   Root Node splits: 89% chance of **0 CP** (End); 11% chance of **Sub-Lottery**.
      *   Sub-Lottery Choice: **Option X** (100% 10 CP) OR **Option Y** (10/11 chance 50 CP, 1/11 chance 0).
      *   *Explain:* "If you chose 2A, you effectively chose Option X here. If you chose 2B, you chose Option Y."
  *   **Crucial Check:** Verify with the class that the **Sub-Lottery** (the 11% branch) is *mathematically identical* in both trees. (10/11 of 11% = 10%; 1/11 of 11% = 1%).

  **00:40 – 00:50: The Confrontation (The Plan Slip)**
  *   Hand out Plan Slips.
  *   **Instruction:** "Forget the first stage. Imagine the 89% branch did *not* happen. You are now standing at the Sub-Lottery node. It is the same node in both trees. You must make a plan for *this* node specifically. Do you choose Option X or Option Y?"
  *   Collect slips at the Booth.
  *   **The Reveal:** Tally the Plan Slips.
      *   Ask the students who previously chose **1A**: "What did you just pick on the Plan Slip?" (Most will pick **Option X**).
      *   Ask the students who previously chose **2B**: "What did you just pick on the Plan Slip?" (Most will pick **Option Y**).
  *   **The Trap:** Point to the board. "In Tree 1, you said you would pick X. In Tree 2, you said you would pick Y. But these are the *same node* with the *same options*. The only difference is what happened in the 89% branch that *didn't occur*."
  *   Allow 5 minutes of murmuring. Let them feel the contradiction physically.

  **00:50 – 01:05: Debrief and Axiom Mapping**
  *   **Map the Moment:** "You just treated the 89% branch as relevant to a choice where it has zero causal power."
  *   **Define the Axiom:** Now introduce the **Independence Axiom**. Write it formally: $L \succ M \iff \alpha L + (1-\alpha)N \succ \alpha M + (1-\alpha)N$.
  *   **Translate:**
      *   $L$ = Option X (Sure 10 CP).
      *   $M$ = Option Y (Risky 50 CP).
      *   $N$ = The Common Consequence (10 CP in Tree 1, 0 CP in Tree 2).
      *   $\alpha$ = 11%.
  *   **The Reconstruction:** Explain that Expected Utility Theory requires you to view an ex-ante choice (the Decision Slip) as a **contingent plan**. If you cannot commit to a single action at the Sub-Lottery node regardless of the 89% branch, your preferences are dynamically inconsistent.
  *   **Normative Weight:** "The activity forces the inconsistency into the open. It does not tell you whether to fix your preferences or reject the axiom."

  **01:05 – 01:10: The Variant (No Certainty)**
  *   Pose the variant verbally or on a slide to test if the "Certainty Effect" drove the result.
  *   **New Pair 1:** 90% 10 CP vs. 89% 10 CP + 10% 50 CP + 1% 0 CP.
  *   **New Pair 2:** 10% 10 CP + 90% 0 CP vs. 10% 50 CP + 90% 0 CP.
  *   **Logic:** The 89% common branch is now 10 CP (Pair 1) vs 0 CP (Pair 2). No option is 100% certain.
  *   **Ask:** "If you still prefer the 'Safe' option in New Pair 1 and the 'Risky' option in New Pair 2, you are still violating Independence, but you can no longer blame the psychological weight of '100%'. You are violating it purely based on the shared branch."

  **01:10 – 01:15: Closing and Limitation**
  *   Collect all materials.
  *   **Final Frank Statement:** "Today you proved you are not Expected Utility maximizers. You have not proved that Expected Utility is wrong. You might argue that regret, or the salience of the 89% branch, *should* matter. This activity breaks the consistency required by the axiom; it does not break the intuition that makes the axiom appealing."

  ### **Predictable Pitfalls and Handling**

  1.  **The "Context is Different" Objection:**
      *   *What happens:* A student argues, "But in Tree 1 I'm already rich (10 CP), so I play safe. In Tree 2 I'm broke (0 CP), so I gamble."
      *   *Handling:* Validate this. "That is a valid theory of utility (state-dependent or regret-based). But it violates Independence. This activity's job is to make you admit you are violating Independence, not to convince you Independence is God. If you hold that view, you must accept that you cannot be modeled by standard EUT."
  2.  **Arithmetic Confusion:**
      *   *What happens:* Students get lost in the 10/11 vs 11% conversion.
      *   *Handling:* Use the "100 Tickets" visual exclusively during the Two-Stage Restaging. Draw 100 circles on the board. Cross out 89. Show the remaining 11 are treated identically in both trees.
  3.  **Low Stakes/Disengagement:**
      *   *What happens:* Students treat points as fake.
      *   *Handling:* The single \$20 draw at the end is crucial. Announce it at the start. Remind them at minute 40: "The Plan Slip counts for the draw if your name is picked."

  ### **The One Thing This Activity Cannot Do**

  Be explicit in the final minutes: **This activity forces the inconsistency into the open, but it cannot by itself show whether the axiom or their choices are what should give way.**

  Students often leave feeling "stupid" for violating the axiom. You must clarify that the Allais Paradox is a foundational critique of EUT, not merely a student error. The activity demonstrates that their preferences possess a structure (sensitivity to common consequences) that EUT forbids. Whether they should "fix" their preferences to match the theory or "fix" the theory to match their preferences is a normative question the lottery booth cannot answer.
