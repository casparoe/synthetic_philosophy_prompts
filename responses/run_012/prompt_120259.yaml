answer: |-
  ### Specification of Demands for a Theory of Dispositions

  The following list articulates the constraints any adequate theory of dispositions must satisfy. Each entry specifies the motivating case, the formal requirement it generates, and the class of accounts it rules out.

  #### 1. The Fink Constraint
  *   **Case:** A "finkish" disposition. A wire is live (disposed to conduct), but equipped with a device that detects contact and instantly renders the wire dead. If touched ($C$), it does not conduct ($M$), yet it was disposed to conduct at the moment of touching.
  *   **Requirement:** The analysis must allow that an object possesses a disposition at time $t$ even if the counterfactual "if $C$ occurred at $t$, $M$ would occur" is false, due to the loss of the disposition upon the arrival of $C$.
  *   **Rules Out:** The Simple Conditional Analysis (SCA) and any account equating dispositions strictly with fixed counterfactual conditionals.

  #### 2. The Masking Constraint
  *   **Case:** A fragile glass wrapped in bubble wrap. If struck ($C$), it does not break ($M$). The blocking factor is external to the glass's intrinsic structure. The glass remains fragile.
  *   **Requirement:** The analysis must distinguish between the absence of a disposition and the presence of a disposition whose manifestation is interfered with by extrinsic factors. The disposition must be isolatable from its manifestation conditions.
  *   **Rules Out:** Analyses that define dispositions solely by actual or counterfactual outcomes without reference to an intrinsic ground or causal basis.

  #### 3. The Mimicry Constraint
  *   **Case:** A dead wire guarded by a wizard who ensures it conducts if touched. The conditional "if touched, it conducts" is true, but the wire lacks the disposition of conductivity.
  *   **Requirement:** Satisfaction of the $C \to M$ conditional must not be sufficient for the possession of the disposition. There must be a difference in the internal state or nature of the bearer between the genuine case and the mimic.
  *   **Rules Out:** Purely extensional accounts and behaviorist analyses that rely exclusively on input-output correlations.

  #### 4. The Negation Constraint
  *   **Case:** Stability, immunity, or resistance. A beam is disposed *not* to fail under a load; a patient is disposed *not* to contract a disease. The manifestation is the absence of an event.
  *   **Requirement:** The account must accommodate manifestations defined as stasis or non-events without trivializing the concept (i.e., without implying everything is disposed to not explode).
  *   **Rules Out:** Accounts that require manifestations to be positive, energetic events or changes of state.

  #### 5. The Modal Strength Constraint
  *   **Case:** Radioactive decay (probabilistic manifestation) or a chemical that reacts differently at different temperatures (multi-track).
  *   **Requirement:** The analysis must accommodate probabilities ($0 < P < 1$) and variable manifestations without collapsing into vagueness or requiring a separate disposition for every possible outcome.
  *   **Rules Out:** Strict deterministic conditional analyses and single-track accounts that cannot generalize across variable stimulus conditions.

  #### 6. The Truthmaker Constraint
  *   **Case:** A fragile glass existing in a void, never struck, or a disposition triggered by physically impossible conditions. Nothing actual settles what would have happened.
  *   **Requirement:** There must be a ground (a truthmaker) for the truth of the disposition ascription even in the absence of manifestation or possible testing. The truth of the ascription cannot depend solely on the occurrence of $C$ or $M$.
  *   **Rules Out:** Verificationist accounts, strict actualism, and counterfactual analyses that lack a categorical or primitive ground.

  #### 7. The Recursion Constraint
  *   **Case:** Dispositions to acquire dispositions (e.g., a disposable camera) or dispositions whose stimulus conditions presuppose the disposition (e.g., a disposition to be fragile when struck, where 'struck' implies a interaction of dispositions).
  *   **Requirement:** The analysis must avoid vicious circularity or infinite regress when dispositions refer to other dispositions or when the stimulus is disposition-laden.
  *   **Rules Out:** Analyses requiring a fixed, fundamental level of non-dispositional properties to terminate the chain of definition.

  #### 8. The Ontological Neutrality Constraint
  *   **Case:** Dispositions borne by designs, algorithms, populations, or institutions (e.g., a market is disposed to correct, a code is disposed to crash).
  *   **Requirement:** The account must not presuppose that only individual material objects (or microphysical particulars) can bear dispositions.
  *   **Rules Out:** Strict microphysical reductionism that cannot account for higher-level or abstract bearers without eliminativism.

  #### 9. The Normativity Constraint
  *   **Case:** Legal bindingness, institutional powers, or conventional rules (e.g., a move is disposed to be illegal). These exist in virtue of norms, not physical structure.
  *   **Requirement:** The account must either distinguish causal dispositions from normative dispositions or provide a unified framework that explains how normative force functions like a causal power.
  *   **Rules Out:** Purely naturalist/causal accounts that cannot accommodate normative or conventional grounds without reduction.

  ---

  ### Sorting the Demands

  To evaluate contenders, you must distinguish between **Functional Desiderata** (requirements any theory must meet to capture the concept) and **Metaphysical Commitments** (requirements pressed by specific camps).

  **Genuine Desiderata (Neutral)**
  These are required to match the usage of disposition terms in science and ordinary language. Any theory failing these fails to capture the phenomenon.
  *   The Fink Constraint
  *   The Masking Constraint
  *   The Mimicry Constraint
  *   The Modal Strength Constraint
  *   The Negation Constraint

  **Camp-Specific Demands (Contested)**
  These reflect metaphysical preferences regarding the fundamental nature of reality.
  *   **The Categorical Base Requirement (Reductionist):** Demands that every disposition be grounded in a non-dispositional, categorical property. (Presses on *Truthmaker* and *Recursion*).
  *   **The Irreducibility Requirement (Primitivist):** Demands that dispositions be accepted as fundamental features of the world, requiring no categorical base. (Presses on *Truthmaker* and *Normativity*).
  *   **The Naturalist Constraint:** Demands that all dispositions be reducible to physical causal powers. (Presses on *Ontological Neutrality* and *Normativity*).

  ---

  ### Incompatible Requirements

  There are tensions within the specification that force a choice between metaphysical camps.

  **1. The Categorical Base Requirement vs. The Recursion Constraint**
  *   **Conflict:** If every disposition requires a non-dispositional categorical base (Reductionism), it is difficult to account for dispositions to acquire dispositions or reflexive dispositions without positing an infinite hierarchy of bases or a fundamental level where dispositions vanish.
  *   **Resolution:** The **Recursion Constraint** must give way if one insists on a **Categorical Base**. Reductionists typically argue that at the fundamental physical level, dispositions "run out" and terminate in categorical properties (mass, charge, shape). Primitivists argue the **Categorical Base** requirement must give way, allowing dispositions to ground dispositions.

  **2. The Normativity Constraint vs. The Naturalist Constraint**
  *   **Conflict:** If dispositions must be grounded in physical structure (Naturalism), normative dispositions (laws, conventions) are either illusory or must be reduced to psychological/physical states. If normative dispositions are real and distinct (Normativity), pure physicalism is false.
  *   **Resolution:** Usually, the **Normativity Constraint** is treated as a separate category (normative powers vs. causal powers). If a unified theory is demanded, the **Naturalist Constraint** must give way to allow for non-physical grounds (conventions, rules).

  **3. The Truthmaker Constraint vs. The Irreducibility Requirement**
  *   **Conflict:** The Truthmaker Constraint demands a ground for unmanifested dispositions. Reductionists provide categorical bases. Primitivists provide primitive modal facts. If "truthmaker" is defined strictly as "categorical property," Primitivism fails. If "truthmaker" allows "primitive power," Reductionism fails.
  *   **Resolution:** This is the core dispute. The definition of "truthmaker" determines the winner.

  ---

  ### The Single Eliminator

  The requirement that eliminates the most candidate accounts is **The Truthmaker Constraint** (specifically regarding unmanifested dispositions).

  *   **Why:** It immediately eliminates the Simple Conditional Analysis (which has no resource for unmanifested truths beyond the conditional itself). It eliminates Behaviorism (which requires actual behavior). It eliminates Verificationism. Furthermore, it forces the split between Reductionists and Primitivists: any account that cannot specify *what makes it true* that a disposition exists when nothing happens (neither a categorical base nor a primitive fact) is eliminated. It is the gatekeeper for metaphysical seriousness.

  ---

  ### Brief Assessment of Contenders

  **The Simple Conditional Analysis (SCA)**
  *   **Performance:** Fails decisively. It is eliminated by the **Fink**, **Mask**, and **Mimic** constraints. It cannot distinguish between a genuine disposition and a finked/masked/mimicked outcome. It also struggles with the **Truthmaker Constraint** for unmanifested dispositions in worlds where the antecedent is never met.
  *   **Verdict:** Inadequate as a metaphysical account, though often useful as a heuristic in stable contexts.

  **The Reductionist Camp (Categorical Base)**
  *   **Performance:** Satisfies the **Truthmaker Constraint** robustly by positing categorical grounds. Handles **Finks** and **Masks** by locating the disposition in the base, distinct from the outcome.
  *   **Weakness:** Struggles with the **Recursion Constraint** (requires a fundamental level without dispositions) and the **Ontological Neutrality Constraint** (higher-level dispositions must be reduced to microphysics, which is often difficult for institutions/norms).

  **The Primitivist Camp (Powers/Ontological Dispositions)**
  *   **Performance:** Satisfies the **Recursion Constraint** naturally (dispositions can ground dispositions). Handles **Finks** and **Masks** by treating the disposition as a real entity that can be removed or blocked.
  *   **Weakness:** Faces pressure from the **Truthmaker Constraint** if truthmakers are demanded to be categorical. Critics argue positing primitive powers is opaque or explanatorily idle.

  **Summary:** The **Fink/Mask/Mimic** triad filters out naive analyses (SCA). The **Truthmaker Constraint** filters out anti-realist accounts. The choice between Reductionism and Primitivism turns on whether you prioritize the **Categorical Base Requirement** (favoring Reductionism) or the **Recursion/Ontological Neutrality Constraints** (favoring Primitivism).
