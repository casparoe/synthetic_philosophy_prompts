  ok so this has been eating at me for a while and i finally want to try to actually get somewhere with it instead of just re-running the same thread. in a reading group i'm in, and in like three different comment sections that keep getting re-litigated, there's this fight between the classical-logic people and the constructive/intuitionist people and it has not budged in months. and the weird thing is everybody agrees on the formal facts. we all know intuitionistic logic is basically a subsystem of classical, that LEM and double-negation-elimination are the flashpoints, that you can map one into the other with a double-negation translation. nobody is confused about the derivations. so the argument is never about "does this rule go through," it's about whether the classical side is entitled to the rule in the first place.

  the two positions, as concretely as i can state them:

  classical person: for any definite proposition A, "A or not-A" is just true. denying it is a weird self-imposed handicap, you're giving up perfectly good reasoning for no gain. and "not not A implies A" is obviously fine for anything with a determinate truth value.

  intuitionist person: a proof of "A or B" that doesn't hand me a proof of one disjunct or the other isn't a proof i can do anything with, its just a promissory note. same with "not not A" -- if it doesn't convert into an actual construction of an A, it's not a proof of A. and i don't think math is a domain of pre-existing facts sitting there with determinate truth values that our proofs just report on.

  here's my hypothesis, and i want you to tell me if its right or if im fooling myself. i think this is a "two questions under one name" situation and mostly a verbal disagreement, in the taboo-the-word sense. the classicist is answering "what is true of a fixed domain of determinate facts," the intuitionist is answering "what does a construction entitle me to assert," and the words "or", "not", "exists", "implies" are just doing different jobs in the two games. so nobody is wrong about LEM, the word "or" has two roles and the two sides keep grabbing different ones. a friend pushed back hard and said no, this is substantive all the way down -- it's really a metaphysical fight about whether mathematical objects exist independently of our constructions, and the logic just falls out of whichever way you answer that. and a third person said the real crux is the conditional, that the two sides agree on the elimination rules and split on what counts as a proof of an implication, so no amount of staring at the derivations will ever settle it.

  so what i actually want from you is a diagnosis, not a verdict on who's right, and not a survey. is this verbal, is it two different questions wearing one hat, is there a hidden formal or metaphysical question doing the real work, or is it bedrock intuitions neither side can argue for? specifically: is the "double-negation translation shows the two systems are compatible, so relax" move a genuine dissolution or a dodge, given that the translation seems to change what the connectives mean on the way through? and is the "we're just doing different jobs with 'or'" line actually available to the intuitionist, or does it cost them something they need? given your diagnosis, what would even count as progress here -- a distinction, a theorem, a change of the question -- or should i expect it to just stay stuck forever?

  and tell me straight: what would change your mind about the diagnosis? which argument or consideration would flip you to a different read of whats going on, and where is your reasoning most likely to be wrong or overconfident? i'd rather have you flag the weak joint than give me a tidy answer.
