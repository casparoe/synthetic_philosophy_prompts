  **The rules our record leaves open**

  Our record sustains two governing principles. First, the **Specificity Principle**: Adopt only if a specific intervention works significantly better for the labeled group than for unlabeled distressed controls, or if a non-optional physiological substrate exists. This validated Prolonged Grief (specific psychotherapy) and PMDD (SSRIs/physiology). It compelled rejecting Gaming (no specific treatment) and Orthorexia (no agreed boundary). It accommodates Gender (criteria isolate distress from identity, acting as a functional substrate).

  Second, the **Looping Constraint**: Adopt only if patient self-application of the label is not the primary driver of clinical presentation, and prevalence does not track solely with cultural or technological availability. This compelled rejecting Orthorexia (self-organization) and Gaming (prevalence moved with technology). It validated PMDD (patients do not take label as identity) and Gender (modified to avoid capturing identity). It validated Grief (distinguishable from ordinary bereavement).

  Both rules exclude categories where the diagnosis creates the disease rather than tracking it. The Specificity Principle demands external validation (biology or treatment); the Looping Constraint demands internal stability (independence from patient uptake). Together, they form a barrier against medicalizing trends that lack distinct mechanisms or are driven by patient self-conception. The reversibility test is implicit in the Looping Constraint: if adoption raises prevalence, the category is likely producing the phenomenon. These rules are prescriptive filters that prioritize ontological stability over clinical convenience. They commit us to rejecting categories that rely on patient uptake for their validity or that lack a treatment distinction from general distress. The tension between them remains unresolved: we have never faced a case with specific treatment but high looping, or vice versa. Thus, both rules fit all five votes equally well, leaving us free to choose either as the primary justification for future decisions. They operate prospectively: any proposal lacking specific efficacy or showing high patient uptake must fail.

  **What each rule predicts for this proposal**

  Both rules predict **rejecting** the AI companion proposal, though for complementary reasons.

  Under the **Specificity Principle**, the proposal fails. The evidence mirrors Internet Gaming: no marker, prevalence tracks the installed base of the technology, and the pilot intervention showed no specific effect over waitlist. Like Gaming, the behavior is engineered by the product, not necessarily a distinct pathology. Without a treatment that works specifically for this label compared to general digital hygiene, the category lacks validity. The waitlist improvement suggests the distress may resolve without specific intervention, undermining the need for a diagnosis.

  Under the **Looping Constraint**, the proposal also fails, mirroring Orthorexia. Adolescents are already using the term "AI-dependent" to organize their care and identity. Adopting the diagnosis would codify a label patients are already using to construct their illness, completing the loop rather than treating it. The minority argument—that we should adopt it to take jurisdiction—violates the Orthorexia precedent, where patient uptake was explicitly cited as a reason for rejection. The minutes note that patients organizing care around a term is a risk factor for rejection, not adoption.

  There is no genuine ambiguity here. One might argue that jurisdiction prevents harm, but our record shows we prioritize validity over jurisdiction when looping is evident (Orthorexia) or treatment is non-specific (Gaming). Both rules converge on a verdict of "Research Label" at best. The category appears to be producing the prevalence it claims to measure, violating the reversibility test implicit in our Gaming and PMDD decisions. If adopting the label raises prevalence by a third, as the reversibility test asks, our record suggests we should not adopt it. The engineered nature of the AI systems further complicates causality, making the condition look more like Gaming (tech-driven) than Grief (internal course). Thus, both rules point to rejection. The minority's desire to take jurisdiction assumes that coding the condition helps patients. However, our record suggests coding conditions without specific treatments or with high looping causes more harm than help. The reversibility test asks: would we adopt this if prevalence rose by a third upon adoption? Given the Orthorexia precedent, the answer is no.

  **The vote I should cast**

  I recommend voting to **decline** the diagnosis, maintaining it as a research label. The closest analog is a hybrid of **Internet Gaming** (lack of specific treatment/tech-driven prevalence) and **Orthorexia** (patient self-identification driving clinical presentation).

  If we adopt this construct, we adopt the principle that **jurisdiction trumps validity**: we will codify patient-generated labels to manage care even without evidence of a distinct, treatable mechanism. This risks cementing a looping effect where the diagnosis sustains the dependency it describes.

  If we reject it, we adopt the principle that **validity trumps jurisdiction**: we will not medicalize behavioral trends driven by technology and patient self-conception unless specific interventions exist. This preserves the department's role as a validator of pathology rather than a ratifier of cultural trends.

  Given the Orthorexia minutes are "quoted back at us ever since," I expect the committee to **reject** the proposal. The precedent against adopting categories where patients organize care around the term is too strong to ignore, especially combined with the Gaming precedent on treatment specificity. The committee will likely fear repeating the Orthorexia error more than they fear lacking a billing code. The political cost of adopting a "fake" disease outweighs the benefit of staffing a clinic. Adopting implies we trust patient self-report over empirical validation. Rejecting implies we trust empirical validation over patient demand. This is a fundamental epistemological stance. The committee's history suggests we lean empirical. I will cast my vote to reject, aligning with the Specificity Principle and Looping Constraint.

  **The case that would tell them apart**

  To separate the rules, consider a proposal for **Genetic Melancholia**. Suppose there is a identified genetic marker and a medication that works specifically for this subtype (satisfying the **Specificity Principle**), but patients strongly identify with the label ("I am a Melancholic"), organizing their lives and social groups around it (violating the **Looping Constraint**).

  The **Specificity Principle** would predict **adoption**, prioritizing the physiological marker and treatment efficacy. The biological validity outweighs the social looping.

  The **Looping Constraint** would predict **rejection**, prioritizing the risk that the label itself sustains the condition. Even with a marker, if the patient uptake drives the clinical presentation, the category is unstable.

  This case would force the committee to decide whether biological truth outweighs social construction. Our current record avoids this conflict because cases with specific treatments (Grief, PMDD) also lacked identity-driven looping, while cases with looping (Orthorexia) lacked specific treatments. This proposal would break that correlation. Such a case would reveal whether we are fundamentally realists (biology matters most) or constructivists (social impact matters most). It would force a vote on the reversibility test itself: would we accept a biological truth that becomes more prevalent because we named it?
