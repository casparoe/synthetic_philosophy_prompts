answer: |-
  The board hung on the north wall of the exchange, a slab of polished slate framed in iron. Every morning at dawn, the clerks set the numbers. Today, the event was the arrival of the Northern Fleet by Solstice. Every member's credence was posted as 0.54. It had been 0.54 yesterday, and 0.54 the day before. To the uninitiated, this stagnation looked like collusion. To the members, it was proof of discipline. They shared a prior, they processed the same public weather reports and grain manifests, and they arrived at the same public conclusion.

  Trade happened anyway. It happened in the shadows of the posted numbers, in the third decimal place that the slate refused to hold.

  Elias sat at his desk in the board office, the upgrade order heavy in his lap. The Exchange Council had voted for precision. Two decimal places were deemed insufficient for a modern port. The new mechanism, currently boxed in wood crating behind him, could carve numbers to three places. It would reveal the sliver of difference where the market actually lived. Elias was to install it by Monday.

  He ran his finger over the current slate. 0.54. He knew the real number for the Master of Ships was likely 0.544, based on the hull repairs he'd seen in the dry dock. He knew the Grain Merchant's number was likely 0.546, based on the futures contracts locked in the vault. On the board, they were identical. In the pit, they were counterparts.

  Elias opened the ledger to reconstruct a trade from the previous week. It was a routine audit, part of the preparation for the upgrade. He traced the ink on Page 402. Merchant Kael had sold five hundred shares of the Solstice contract to Shipowner Iris.

  He looked at the board record for that day. Both Kael and Iris had posted 0.50.

  Elias tapped his pen against the desk. If both agents posted 0.50, and it was common knowledge that they had posted 0.50, and it was common knowledge that both were rational maximizers sharing the city's prior, the trade should not have occurred. If Kael was willing to sell at the market price implied by 0.50, he must believe the true probability is lower. If Iris was willing to buy, she must believe it is higher. But the board said they agreed.

  If the board told the whole truth, Kael would know that Iris believed the probability was higher. Knowing Iris was rational, Kael would wonder why she was buying. He would infer she possessed information he lacked. He would update his own belief upward. Iris, seeing Kael sell, would infer he knew something bad. She would update downward. They would meet in the middle, and the trade would vanish.

  Yet the trade existed. The shares had changed hands. The ledger was signed.

  Elias listed the possible explanations in the margin of his notebook.

  First: Liquidity. Kael needed cash immediately to pay a dock fee. He sold despite believing the price was fair or even slightly undervalued. The cost here was reputational. In the port, admitting a liquidity crunch was admitting weakness. Creditors would circle. Kael's file showed no distress signals, no loans outstanding. To mark this trade as liquidity-driven was to accuse Kael of hiding insolvency.

  Second: Hedging. Iris owned three ships in the Northern Fleet. If the Fleet arrived, her cargo value rose, but the contract paid out only on arrival. Wait, no—if the Fleet arrived, the contract paid. She was buying insurance? No, she was buying the contract. If the Fleet arrived, she doubled down. If it failed, she lost the ships and the contract value. This wasn't a hedge; it was a concentration of risk. Unless she was selling something else off-book. But the ledger was comprehensive. To mark this as hedging was to assume invisible positions, undermining the transparency the upgrade was supposed to ensure.

  Third: Error. One of them was not acting rationally. One was gambling, or stubborn, or blind. To mark this as error was to invalidate the foundational rule of the exchange. If members were not rational Bayesians, the board numbers meant nothing. The market became a casino.

  Elias looked at the third decimal in his mind. 0.504 versus 0.506. That was the reality. Kael knew something about the winds; Iris knew something about the hulls. They knew they disagreed, but the board told them they agreed. The rounding created a veil. It prevented the disagreement from becoming common knowledge. They could trade because they didn't *know* that the other *knew* they disagreed.

  The door to the office opened. Master Vane entered, shaking rain from his coat. He was the senior arbiter, the man who would sign off on the upgrade.

  "The crate is behind you," Vane said, not looking at it. He walked to the board, staring at the 0.54.

  "It will change things," Elias said. "Three decimals. It stops the guessing."

  Vane turned. "It stops the trading."

  "It stops the speculation based on ignorance," Elias corrected. "If Kael posts 0.504 and Iris posts 0.506, they see the gap. They update. They find the true price. No more trading around false consensus."

  "You are describing a market that clears instantly and then closes," Vane said. His voice was flat, devoid of judgment. "You assume that when they see the gap, they will update toward each other."

  "They must. If they share a prior."

  "They do," Vane said. "But the update requires them to trust the number on the board as the sum of the other's knowledge. If you force the third decimal into the open, the number on the board ceases to be a credence. It becomes a bid."

  Elias frowned. "It is a credence. It's what they believe."

  "It is what they are willing to show," Vane said. "When you force them to show the sliver, they will stop putting their true belief on the board. They will post numbers that protect them. Or, they will post their true numbers, see the divergence, and realize that trade is impossible because the other side's divergence implies information they cannot afford to reveal."

  Vane walked to the ledger Elias had open. He looked at the Kael-Iris trade.

  "You are auditing this?"

  "It shouldn't exist," Elias said. "On the record, it's impossible. Common knowledge of rationality forbids it."

  "On the record, it is explained by liquidity," Vane said. He tapped the page. "Kael needed silver for the dock fees. We all knew it. He didn't hide it. He paid the price for the silver."

  "He didn't file a distress notice."

  "He paid the spread," Vane said. "The cost was in the price, not the filing. If you publish the third decimal, you remove the spread. You remove the room for the liquidity need to hide. If Kael posts 0.504 and the market is 0.505, and you force him to show the 4, he cannot sell without announcing he is desperate or informed. If he is informed, no one buys. If he is desperate, they buy at a discount. The trade becomes predatory. The liquidity dries up."

  Elias looked at the upgrade mechanism. It was a beautiful thing, brass and glass, designed to eliminate ambiguity. "So we lie. We round the truth to keep the market open."

  "We keep the knowledge un-common," Vane said. "There is a difference between a lie and a boundary. The board is not a confessionals. It is a interface. If everyone knows everything everyone knows, there is no reason to swap positions. You only trade when you think you know something the other doesn't. But if you know they are rational, and you know they know you are rational, and you see their number... you realize they know something you don't. You converge. You stop."

  Vane leaned against the desk. "The market exists in the gap between what is known and what is known to be known. You are proposing to close the gap."

  "If I don't install this, the Council will send someone who will."

  "If you install it, the volume will drop by ninety percent within a month. The remaining trades will be purely for consumption or endowment shifts. The speculation that provides liquidity for the merchants will vanish. Kael won't be able to sell his risk. Iris won't be able to leverage her hulls. The port slows."

  Elias looked back at the ledger. The ink was dry. The trade had happened. It had allowed Kael to pay his fees and Iris to secure her position. It had happened because the board said 0.50, hiding the 4 and the 6. It had happened because they did not have common knowledge of their divergence. They could pretend they agreed, and in that pretense, find a reason to swap.

  If the board showed the divergence, the pretense would break. They would have to agree. And if they agreed, they would not trade.

  "The upgrade is routine," Vane said. "It is within your discretion to calibrate the depth."

  Elias looked at the brass mechanism. It demanded precision. It demanded that the number on the slate match the number in the mind. But the number in the mind was not a static thing; it shifted depending on what was shown on the slate. To show the truth was to change the truth.

  He thought of the audit. He could mark the trade as 'Liquidity Constrained.' It would stain Kael's record. Kael would pay higher rates next season. Or he could mark it 'Hedging.' It would imply Iris was overexposed. Her insurers would balk. Or he could mark it 'Information Asymmetry.' But the board said there was none. To mark it that way was to accuse the board of lying.

  The only explanation that didn't carry a cost was the one the board provided: Agreement. They agreed at 0.50. Therefore, the trade must be non-speculative. But it was speculative. They were betting on the Fleet.

  The only way the trade was valid was if the agreement was incomplete. If the common knowledge stopped at the second decimal.

  Elias picked up the calibration tool. It was a small wrench, designed to adjust the gear teeth that controlled the decimal stop.

  "If I leave it at two," Elias said, "I am concealing data."

  "If you change it to three," Vane said, "you are concealing the motive."

  Vane pushed off the desk. "The Council meets in an hour. They expect the mechanism to be ready for display. They do not expect it to be active until next quarter."

  Vane left the room. The door clicked shut.

  Elias sat alone with the board and the machine. He looked at the slate. 0.54. He knew the real number was likely 0.545. He knew that if he posted 0.545, Vane would see it. Vane would know that Elias knew. Elias would know that Vane knew.

  If he installed the upgrade, the numbers would diverge tomorrow. 0.544, 0.546, 0.545. The traders would see the spread. They would realize the consensus was an illusion. They would update. They would converge to a single true number. And then, they would stop trading. The liquidity would vanish. Kael would not be able to move his risk.

  If he did not install it, the trade would continue. The lie would hold. The market would function on the basis of uncertainty about what others knew.

  It was not a disagreement between Elias and Vane. Vane had stated the mechanics. Elias had verified the math. They both knew the outcome. The choice was not about what was true, but about what could be known commonly.

  Elias took the wrench. He adjusted the gear. He locked the stop at the second position. The third digit wheel was disconnected, free to spin without engaging the slate.

  He closed the crate over the mechanism. He took his pen and marked the upgrade log: *Calibration incomplete. Requires further testing.*

  It was a delay, not a refusal. It kept the knowledge private. It kept the common knowledge at 0.54. It allowed Kael and Iris to trade tomorrow, not because they agreed, but because they didn't know exactly how much they disagreed.

  Elias wiped the dust from the slate. The number remained 0.54. It was false, and it was necessary. He filed the log, ensuring that the record showed a technical delay rather than a decision. That way, Vane wouldn't know for sure if Elias had chosen, or if the machine had failed. And Elias wouldn't know if Vane suspected.

  They sat in the uncertainty, and the market opened.
