      *   *Constraint Check:* "Audit the story and find no trade that common knowledge would forbid."
      *   *Correction:* Ensure the trade Elias analyzes is explained by liquidity/hedging *on the record*, even if the subtext is information. The story must acknowledge that *if* the info was common, the trade wouldn't happen.
