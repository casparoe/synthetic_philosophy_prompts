  2.  **Deconstruct the Epistemology:**
      *   *Aumann's Agreement Theorem:* If two people have the same prior, and their posterior probabilities are common knowledge, they must be equal. They cannot agree to disagree.
      *   *Milgrom-Stokey No-Trade Theorem:* If traders start at a Pareto optimal allocation (often implied by common prior + rationality before private info arrives), and they receive private information, they won't trade based on that info alone if the trade is common knowledge. Why? Because if I want to sell to you, you know I have info suggesting the price is too high. If you are rational, you won't buy.
      *   *The Setting's Twist:* The board shows 2 decimals. Everyone sees the same number (e.g., 0.54). This signals "Common Prior/Consensus." But trade happens. Why? Because the *real* beliefs differ in the 3rd decimal (private info).
      *   *The Conflict:* Moving to 3 decimals makes the private info public (common knowledge). If everyone knows everyone's exact credence, and they share a prior, their credences must converge. If they converge completely, there's no room for speculative trade based on information asymmetry. The market dies (or becomes purely hedging/liquidity).
      *   *The Clerk's Dilemma:* Precision = Truth. But Truth = No Market.

  3.  **Character Development:**
      *   **Protagonist:** Elias. Junior clerk. Believes in transparency. Sees the rounding as a lie.
      *   **Antagonist/Mentor:** Master Vane (or similar). Senior trader or exchange official. Understands the mechanics of the market's existence.
