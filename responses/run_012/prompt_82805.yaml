      *   **The Reconstruction:** Elias looks at a trade where A sold to B. Both posted 0.65. Why trade?
          *   Explanation 1: Hedging (A needs cash now). Cost: A looks weak/liquidity constrained.
          *   Explanation 2: Risk preferences (A hates risk more). Cost: A is overly cautious.
          *   Explanation 3: Error (One isn't rational). Cost: undermines the whole system.
          *   Explanation 4 (The Truth): They knew the 3rd decimal differed, but the board hid it. If the board shows it, they can't trade.

