      *   *Wait, refinement:* If the board shows different numbers (3 decimals), traders will update based on seeing the other's number. They will iterate until convergence. Once converged, no trade. So, revealing the 3rd decimal initiates the convergence process that kills speculative volume.
      *   *Actually, the prompt says:* "The posted numbers are identical every day." This is the status quo. They round to 2 decimals, so they look identical (e.g., 0.544 and 0.546 both look like 0.54). This maintains the *illusion* or the *structure* of common knowledge at the 2nd decimal, allowing the 3rd decimal to remain private information that drives trade without triggering the "agree to disagree" paradox because the disagreement isn't *common knowledge*.
      *   *The Upgrade:* Moving to 3 decimals makes the disagreement common knowledge. Then the theorem kicks in. They must update. They will converge. Trade stops.

  6.  **Writing - Focus on Tone:**
