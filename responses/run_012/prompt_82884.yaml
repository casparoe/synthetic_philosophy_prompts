answer: |-
  ### Executive Summary

  This proposal outlines a three-year conceptual research programme on supererogation. The guiding principle is **architectural priority**: we must determine the normative structure that makes supererogation possible before mapping its extensions or applications.

  The current shortlist mixes foundational meta-ethical questions (1, 4, 7) with derivative structural questions (2, 3) and applied extensions (5, 6). A coherent programme must address the threat that supererogation is an illusion (Item 1), that it is an artefact of binary thinking (Item 4), or that it is misclassified as deontic rather than aretaic (Item 7). Only if the category survives these challenges should the foundation fund work on who can perform such acts (5, 6) or how to individuate them (2).

  Below is the evaluation, the proposed ordering, and the funding recommendation.

  ---

  ### Part 1: Evaluation of the Shortlist

  I have evaluated each item based on **Downstream Dependence** (how much other work relies on this), **Tractability** (suitability for conceptual analysis), **Neglectedness** (current state of literature), and **Decisive Result** (what counts as progress).

  *Note on Consensus:* In moral philosophy, few results are "settled." I distinguish between **Orthodoxy** (the standard view taught in textbooks), **Contested** (live debate among specialists), and **My View** (where I offer a recommendation that goes beyond reporting).

  #### 1. The Coherence of the Category
  *   **Status:** **Contested.** The "Maximizing Objection" (if it's best, why isn't it required?) is the central live debate. Orthodoxy accepts the category; Consequentialists often reject it.
  *   **Downstream:** **Critical.** If the category is incoherent, the rest of the programme is moot.
  *   **Tractability:** **High.** Standard analytic tools (deontic logic, counterfactuals) apply.
  *   **Neglectedness:** **Low.** This is the classic Urmson/Heyd problem, but new logical formulations appear regularly.
  *   **Decisive Result:** A proof that "best" does not entail "obligatory" within a consistent deontic logic, or a proof that they do entail it (eliminating the category).

  #### 2. Act-Types versus Act-Tokens
  *   **Status:** **Contested.** No consensus on individuation conditions for moral acts.
  *   **Downstream:** **Medium.** Affects which examples count, but not whether the category exists.
  *   **Tractability:** **Medium.** Risks becoming a semantic debate without normative payoff.
  *   **Neglectedness:** **Medium.** Often assumed rather than argued.
  *   **Decisive Result:** A principled criterion for when a token act inherits the deontic status of its type.
  *   **Recommendation:** **Merge** into Item 1. You cannot assess coherence without knowing *what* is being evaluated.

  #### 3. The Mirror-Image Category (Suberogatory)
  *   **Status:** **Contested.** Some argue "optional but bad" is incoherent; others cite it as evidence that deontic status and blame come apart.
  *   **Downstream:** **High.** Validates the structure of the "optional" space. If the optional is asymmetric (only good options exist), supererogation looks suspicious.
  *   **Tractability:** **High.** Conceptual analysis of blame and permission.
  *   **Neglectedness:** **High.** Far less literature than on supererogation.
  *   **Decisive Result:** A robust example of an act that is permitted, not required, yet fittingly criticized.

  #### 4. Scalar Pictures
  *   **Status:** **Contested.** Scalar consequentialism is a live meta-ethical option (e.g., Norcross), but not dominant.
  *   **Downstream:** **Critical.** If normativity is purely scalar, "required" is a threshold we impose. Supererogation might be a threshold artefact.
  *   **Tractability:** **High.** Conceptual comparison of threshold vs. scalar models.
  *   **Neglectedness:** **Medium.** Growing interest, but often siloed in consequentialist debates.
  *   **Decisive Result:** A demonstration that thresholds are necessary for moral guidance, or that they are dispensable (dissolving supererogation).

  #### 5. Collective and Institutional Agents
  *   **Status:** **Contested.** Depends on one's theory of collective agency.
  *   **Downstream:** **Low.** This is an *extension* question. It presupposes the category makes sense for individuals.
  *   **Tractability:** **Low.** Requires solving collective agency first, then supererogation.
  *   **Neglectedness:** **Medium.**
  *   **Decisive Result:** A set of necessary conditions for a collective to be a candidate for supererogation.
  *   **Recommendation:** **Demote.** This is Year 3 material, not foundational.

  #### 6. Role-Relative Supererogation
  *   **Status:** **Contested.** Debate over whether professional duties absorb supererogatory acts.
  *   **Downstream:** **Low/Medium.** Applied normative ethics.
  *   **Tractability:** **Medium.** Case-study heavy, risks drifting into empirical expectations.
  *   **Neglectedness:** **Medium.**
  *   **Decisive Result:** A theory of how role-obligations modify the baseline of "duty."
  *   **Recommendation:** **Demote.** Depends on Item 1 and Item 6.

  #### 7. Fitting Attitudes
  *   **Status:** **Contested.** The "Aretaic Turn." Some argue supererogation is fundamentally about praise, not permission.
  *   **Downstream:** **Critical.** If true, Item 1 is a category mistake. We shouldn't ask if it's "required," but if admiration is "fitting."
  *   **Tractability:** **High.** Fits standard meta-ethical tools.
  *   **Neglectedness:** **High.** Most literature remains deontic-focused.
  *   **Decisive Result:** A reduction of deontic supererogation to aretaic fittingness, or a defense of the irreducibility of the deontic.

  ---

  ### Part 2: Proposed Ordering and Structure

  The board requests a coherent programme where foundational questions outrank isolated ones. I propose a **Three-Phase Architecture**.

  **Phase 1: The Normative Architecture (Year 1)**
  *   **Focus:** Items 1, 4, 7.
  *   **Rationale:** These three questions are entangled. You cannot determine if supererogation is *coherent* (1) without knowing if duty is *scalar* (4) or *binary*, and you cannot know if it is a *deontic* status (1) or an *aretaic* one (7).
  *   **Goal:** Establish whether the phenomenon is real, and if so, what kind of normative structure supports it.

  **Phase 2: The Topology of the Optional (Year 2)**
  *   **Focus:** Item 3 (Suberogatory) and Item 2 (Types/Tokens).
  *   **Rationale:** Once we know the category is possible, we must map its boundaries. Does the "optional" space have symmetry (Suberogatory)? How do we individuate the acts (Types/Tokens)?
  *   **Goal:** Define the logical space supererogation occupies.

  **Phase 3: Agents and Extensions (Year 3)**
  *   **Focus:** Item 6 (Roles) and Item 5 (Collectives).
  *   **Rationale:** Only after defining the act and the status do we ask *who* can perform it.
  *   **Goal:** Apply the theory to complex agents.

  #### Defense Against Rival Orderings

  **Rival 1: "Coherence First" (Item 1 alone)**
  *   *Argument:* Settle Item 1 before spending money on Scalars or Attitudes.
  *   *Rebuttal:* This assumes Item 1 can be answered in isolation. **My View:** It cannot. The "Maximizing Objection" (Item 1) relies on assumptions about thresholds (Item 4). If you fund Item 1 without Item 4, you risk funding a debate based on a false dichotomy (binary duty vs. no duty). Item 1 must be funded *alongside* 4 and 7 to ensure the question is well-formed.

  **Rival 2: "Applied First" (Items 5 & 6)**
  *   *Argument:* Start with concrete cases (roles, institutions) to ground the theory.
  *   *Rebuttal:* This violates the "conceptual only" constraint's spirit. Without a settled view on whether supererogation exists for individuals (Item 1), analyzing it for states (Item 5) is premature. If supererogation is just "fitting admiration" (Item 7), the "role duty" question (Item 6) changes entirely. Applied work without foundational clarity leads to talking past one another.

  #### Triggers for Re-ordering

  The board should agree to the following **Contingency Triggers**:

  1.  **The Dissolution Trigger:** If Phase 1 (Year 1) produces a consensus that supererogation is merely an artefact of scalar thinking (Item 4) or purely aretaic (Item 7) with no deontic residue, **cancel Phase 2 and 3**. The programme shifts to "The Illusion of Supererogation."
  2.  **The Asymmetry Trigger:** If Phase 2 (Year 2) establishes that the Suberogatory (Item 3) is incoherent (i.e., you cannot be permitted but blameworthy), **promote Item 1**. This suggests the "Optional" category is unstable, threatening the existence of supererogation itself.
  3.  **The Agency Trigger:** If Phase 1 establishes that supererogation requires "personal projects" (a common defense), **demote Item 5 (Collectives)** permanently, as collectives may lack the requisite psychology for personal projects.

  ---

  ### Part 3: Funding Recommendations

  If the board can start only three projects, they must be the ones that secure the foundation of the entire inquiry.

  #### The Top Three to Fund
  1.  **Item 1 (Coherence):** Specifically, funding work on the "Maximizing Objection" within non-consequentialist frameworks.
  2.  **Item 4 (Scalar Pictures):** Funding a comparative analysis of threshold vs. scalar deontic logics.
  3.  **Item 7 (Fitting Attitudes):** Funding an investigation into whether supererogation is reducible to norms of praise.

  *Why these three?* They form a **triangulation**. Item 1 asks "Is it real?" Item 4 asks "Is our ruler broken?" Item 7 asks "Are we measuring the wrong thing?" Funding all three ensures that if one avenue closes (e.g., deontic coherence fails), the others (scalar or aretaic) keep the programme alive.

  #### What to Drop Entirely
  **Item 5 (Collective and Institutional Agents).**
  *   **Reason:** For a *conceptual* foundation, this is too downstream. It introduces the metaphysics of group agency, which is a separate can of worms. If the concept of supererogation is incoherent for individuals, it is certainly incoherent for groups. If it is coherent for individuals, extending it to groups is a secondary task better suited for a later grant cycle or a different foundation focused on political philosophy.

  #### What to Demote (Fund in Year 2 or 3)
  *   **Item 6 (Role-Relative):** Important, but depends on the outcome of Item 1 and 7.
  *   **Item 2 (Types/Tokens):** Merge this into the work on Item 1. Do not fund it as a standalone project.
  *   **Item 3 (Suberogatory):** High priority for Year 2, but less critical than establishing the existence of the positive category in Year 1.

  ---

  ### Part 4: Caveats on Consensus and Contention

  In presenting this to the board, please note the following distinctions regarding the state of the literature:

  1.  **Settled:** It is settled that *ordinary language* distinguishes between duty and supererogation. It is settled that Utilitarianism (classically) struggles to accommodate the category.
  2.  **Contested:** It is **highly contested** whether "ought implies can" or "best implies ought" holds in moral logic. It is **contested** whether the suberogatory exists (some argue all permitted acts are morally neutral). It is **contested** whether deontic concepts (obligation) are more fundamental than aretaic ones (virtue/praise).
  3.  **My View:** I am recommending prioritizing Item 4 (Scalar) and Item 7 (Fitting Attitudes) alongside Item 1 because the literature has stagnated on Item 1 alone. The "Coherence" debate has been running since 1958 (Urmson). A decisive result is unlikely without importing the tools from Scalar Consequentialism (Item 4) or Fitting Attitude Analysis (Item 7). If the foundation funds only traditional deontic logic (Item 1), they risk funding a stalemate.

  This programme prioritizes **diagnostic depth** over **breadth of application**. It accepts that we may discover supererogation is not what we thought it was, and funds the questions most likely to reveal that truth.
