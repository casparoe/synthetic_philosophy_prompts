answer: |-
  The principle that unifies your intuitions is **The Norm of Responsible Reliance.**

  It states: **You may assert a claim only when you possess evidence sufficient to justify the listener relying on that claim for their intended purpose.**

  When you speak, you are inviting the listener to offload their uncertainty onto you. You are telling them, "You don't need to check this; I have checked it." This principle demands that you actually *have* checked it, to a degree that matches the cost if you are wrong.

  Here is how the principle sorts your cases, which verdict you must change, and how it handles promises.

  ### 1. How the Principle Sorts Your Verdicts

  The principle relies on two variables: **Your Evidence** and **The Stakes of Reliance.**

  *   **The Plaque (Fine):**
      *   *Evidence:* High (authoritative source).
      *   *Stakes:* Low (historical curiosity).
      *   *Verdict:* **Pass.** You are a conduit for verified information.
  *   **The Card Game Story (Not Fine):**
      *   *Evidence:* Low (hearsay).
      *   *Stakes:* Medium (your credibility as a guide).
      *   *Verdict:* **Fail.** You are inviting reliance on gossip. If a historian in the group calls you out, you have betrayed the group's trust in your expertise.
  *   **The Time Promise (Not Fine):**
      *   *Evidence:* Negative (history shows you are always late).
      *   *Stakes:* High (missing a train).
      *   *Verdict:* **Fail.** You are inviting reliance on a prediction you know is likely false.
  *   **The Hedged Guess (Fine) vs. Unhedged Guess (Not Fine):**
      *   *Evidence:* Low (guessing).
      *   *Stakes:* Medium (misinformation).
      *   *Verdict:* **Pass/Fail.** The hedge ("don't quote me") explicitly *revokes* the invitation to rely. You are saying, "I am sharing a thought, not a fact." Stripping the hedge re-invites reliance without the evidence to back it.
  *   **The Bike Sale (Not Fine):**
      *   *Evidence:* Negative (you know it's a lemon).
      *   *Stakes:* High (financial loss).
      *   *Verdict:* **Fail.** This is fraud. You are inviting reliance specifically to exploit it.
  *   **The Nervous Flyer (Fine):**
      *   *Evidence:* Medium (general aviation safety statistics).
      *   *Stakes:* Low (emotional comfort).
      *   *Verdict:* **Pass.** This is the trickiest case. You don't *know* the specific flight will be fine. However, the listener isn't relying on you for *aviation mechanics*; they are relying on you for *social reassurance*. The "claim" is interpreted as "Statistically, you are safe," which you do know. The cost of error (they feel anxious again) is low.

  ### 2. The Verdict You Must Give Up

  The principle resolves your flip-flopping on the **Neighborhood Safety** question.

  **Verdict: Not Fine.**

  Here is why:
  *   **Evidence:** None ("I have no idea").
  *   **Stakes:** Extremely High (physical safety, potential assault or theft).
  *   **Reliance:** The tourist is asking specifically to guide a high-risk action (walking alone at night).

  When you say "Yeah, it's fine," you are telling them to turn off their danger detection systems. If they are mugged, your words contributed directly to their vulnerability. Unlike the nervous flyer (where the plane flies regardless of your words), the safety of the walk *depends* on the decision they make based on your advice.

  Under the Norm of Responsible Reliance, you are only allowed to say this if you know the neighborhood well enough to underwrite their safety. Since you don't, the only responsible answer is, "I actually don't know, I'd recommend checking with the hotel concierge/local police." It feels less helpful in the moment, but it is the only ethical assertion.

  ### 3. What About Promises?

  You asked about: *"I'll have the money Friday" when I'm not sure.*

  A promise is distinct from an assertion. An assertion claims "X is true." A promise claims "I will *make* X true." However, the Norm of Responsible Reliance still applies.

  When you promise, you invite the listener to rely on your **will** and your **capacity**.
  *   If you say "I'll have the money Friday," the listener relies on that to pay their rent.
  *   If you are "not sure," you lack the evidence (capacity/certainty) to justify that reliance.

  **Verdict: Not Fine.**
  To make this fine, you must change the speech act to match your evidence: "I *expect* to have the money Friday, but I can't guarantee it." This allows them to rely on your *expectation* (which is honest) rather than your *guarantee* (which is unsupported).

  ### 4. Unlisted Cases

  Here is how the principle handles common scenarios you haven't listed:

  *   **Medical Advice:** A tourist asks if a rash looks infected.
      *   *Verdict: Not Fine.* Stakes are health; your evidence is zero. You must defer to a professional.
  *   **Restaurant Recommendation:** "This place is great."
      *   *Verdict: Fine (with caveats).* Stakes are low (a bad meal). Evidence is your personal taste. However, if you know they have a severe nut allergy and you aren't sure about the kitchen, Stakes become High, and you must say "I'm not sure about their allergy protocols."
  *   **Directions:** "The station is that way."
      *   *Verdict: Fine if you know; Not Fine if guessing.* Stakes are moderate (getting lost). If you are guessing, you must hedge: "I believe it's that way, but you should check a map."

  ### Summary
  Your role as a guide is not just to provide information, but to manage the group's **epistemic security**. You are the filter through which they process the city. The Norm of Responsible Reliance dictates that you may only remove doubt from their minds when you have already removed it from your own, proportionate to the harm caused if you turn out to be wrong.

  **The Rule:** If the cost of being wrong is high, your evidence must be certain. If your evidence is weak, your stakes must be low. The neighborhood safety question fails because the stakes are high and your evidence is zero.
