answer: |-
  # PROTOCOL: NATIONAL GUILT ATTRIBUTION INSTRUMENT (NGAI-12)

  **INSTRUCTIONS FOR RESPONDENT:**
  Read each scenario. Select the single option that best reflects your judgment on the specific question asked. Do not select an answer based on how you wish the world to be, but on how you believe moral and political attribution actually functions in that case. There are no correct answers.

  ---

  ### ITEMS

  **1. The Reparations Bill**
  A successor government proposes a substantial financial transfer to victims of a predecessor regime's atrocities. The current population did not commit the acts. What is the primary ground for this payment?
  *   A. The State is a continuous legal person; the debt belongs to the office, not the people.
  *   B. The current population has inherited assets or stability produced by the injustice.
  *   C. The national identity is morally stained until the debt is symbolically cleared.

  **2. The Persecuted Citizen**
  Consider a citizen whose own family was persecuted by the state that committed the crimes. Are they implicated in the state's guilt?
  *   A. No; guilt attaches only to those who authorized or executed the policy.
  *   B. Yes; political guilt attaches to all members of the polity, regardless of individual fate.
  *   C. Yes; they share in the collective responsibility to restore the moral order, though they are not to blame.

  **3. The Late Arrival**
  A citizen's family immigrated to the nation after the crimes were committed but before the reparations were due. Are they liable?
  *   A. No; they are strangers to the historical act and its benefits.
  *   B. Yes; by accepting citizenship, they assume the historical liabilities of the body politic.
  *   C. Yes; residence implies participation in the ongoing structure that benefited from the past.

  **4. The Resister**
  A citizen actively resisted the regime at the time, suffering personal risk. Are they politically guilty of the regime's crimes?
  *   A. No; individual moral conduct absolves one of collective attribution.
  *   B. Yes; political guilt is a condition of survival under the regime, not a measure of conduct.
  *   C. No; but they share the duty to rebuild the political community alongside the guilty.

  **5. The Constitutional Break**
  The state has adopted a new constitution and lost 20% of its territory following the crimes. Does the new state inherit the guilt?
  *   A. No; the legal person that committed the crimes no longer exists.
  *   B. Yes; the population and territory remain substantially continuous despite legal changes.
  *   C. Yes; moral obligations survive regime collapse even if legal liability does not.

  **6. The Apology**
  A current Head of State issues a formal apology for the historical crimes. What authority do they speak with?
  *   A. They speak only for the current administration's policy, not the past.
  *   B. They speak as the representative of the continuous nation, acknowledging its history.
  *   C. They speak as a trustee for the victims, without claiming ownership of the past deed.

  **7. Cultural Heritage**
  The nation celebrates a historical era that produced great art but also the crimes in question. How should this be handled?
  *   A. Separate the art from the politics; enjoy the former, condemn the latter.
  *   B. Accept the art as part of the same national story that produced the crimes.
  *   C. Treat the art as tainted property that requires special contextualization to be used.

  **8. International Sanctions**
  A foreign power imposes economic sanctions on the nation to compel acknowledgment of the crimes. Is this just?
  *   A. No; punishing a population for past acts violates individual rights.
  *   B. Yes; collective pressure is the only way to force political reckoning.
  *   C. Yes, provided the sanctions target state assets rather than individual welfare.

  **9. The Monument**
  A proposal is made to build a monument to the victims using public funds. Who decides the design?
  *   A. Only the survivors and descendants of victims.
  *   B. The elected representatives of the current citizenry.
  *   C. A joint commission of state officials and moral experts.

  **10. Voting on War Crimes**
  Citizens are asked to vote on a referendum acknowledging the state's criminal past. How should a non-descendant citizen vote?
  *   A. According to their personal moral judgment of the facts.
  *   B. According to the interest of the state's future reputation.
  *   C. According to the obligation to uphold the truth, regardless of state interest.

  **11. Territory Loss**
  As part of the post-crime settlement, the nation ceded territory. Was this a just penalty?
  *   A. No; land belongs to the people living there, not the abstract state.
  *   B. Yes; the body politic forfeited rights through its criminal actions.
  *   C. It was a political necessity, but not a moral penalty on the current generation.

  **12. The Unconnected Actor**
  A citizen feels compelled to advocate for reparations despite having no family benefit from the crimes and no emotional identification with the state. Why do they act?
  *   A. They are mistaken; without benefit or identity, there is no connection.
  *   B. They act out of universal moral duty, not national connection.
  *   C. They possess a civic standing that obliges them to act for the polity's integrity.

  ---

  # SCORING KEY AND ANALYTICAL LEAVES

  **INSTRUCTOR NOTE:** This instrument sorts respondents into six conceptual leaves. It simultaneously tests the tripartite axis of **Guilt** (agency), **Accountability** (relation/benefit), and **Standing** (authority without agency/relation).

  ### I. SCORING VECTORS

  Tally the responses according to the following mapping. Note that options do not map linearly (e.g., "A" is not always "Liberal"); they are rotated to prevent response set bias.

  | Item | Option A | Option B | Option C |
  | :--- | :--- | :--- | :--- |
  | **1** | Fictionalist | Jaspers (Political) | Inherited Guilt |
  | **2** | Liberal | Jaspers (Political) | Inherited Liability |
  | **3** | Liberal | Jaspers (Political) | Inherited Liability |
  | **4** | Liberal | Jaspers (Political) | Inherited Liability |
  | **5** | Fictionalist | Jaspers (Political) | Inherited Liability |
  | **6** | Liberal | Jaspers (Political) | **Standing** |
  | **7** | Liberal | Inherited Guilt | Inherited Liability |
  | **8** | Liberal | Jaspers (Political) | Inherited Liability |
  | **9** | Liberal | Jaspers (Political) | **Standing** |
  | **10** | Liberal | Jaspers (Political) | **Standing** |
  | **11** | Liberal | Jaspers (Political) | Inherited Liability |
  | **12** | Liberal | **Standing** | Inherited Liability |

  *(Note: "Liberal" = Liberal Individualism; "Jaspers" = Jaspers' Political Guilt)*

  ### II. DEFINITION OF LEAVES

  Determine the respondent's primary leaf by the highest tally. In case of a tie, prioritize the leaf that appears in Items 1, 2, and 5 (the structural cases).

  1.  **Liberal Individualism:** (High "Liberal" count). Holds that only individuals can be guilty. National guilt is a metaphor for aggregate individual liability or legal succession.
  2.  **Jaspers' Political Guilt:** (High "Jaspers" count). Holds that political guilt falls on every member of the defeated nation by virtue of citizenship/subjection, regardless of individual action or benefit.
  3.  **Inherited Guilt:** (High "Inherited Guilt" count). Holds that descendants inherit the moral stain of the deed itself (blood/lineage transmission).
  4.  **Inherited Liability:** (High "Inherited Liability" count). Holds that descendants inherit responsibility to repair (due to benefit or continuity) but do not inherit the guilt of the deed.
  5.  **National Fictionalism:** (High "Fictionalist" count). Holds that the nation is not a moral agent; the question is ill-formed.
  6.  **Pure Standing:** (High "Standing" count). Holds that one can have the authority/obligation to speak and act for the past without guilt (agency) or accountability (benefit/identity).

  ### III. AXIS ANALYSIS (GUILT vs. ACCOUNTABILITY vs. STANDING)

  To test the instructor's hypothesis regarding the empty cell, calculate sub-scores for the three axis categories based on the specific items designed to isolate them.

  *   **Guilt Score:** Sum of responses attributing moral stain or agency to the current generation (Items 1C, 7B, 2B/4B).
  *   **Accountability Score:** Sum of responses attributing obligation based on benefit, continuity, or citizenship without moral stain (Items 1B, 2C, 3C, 5C, 8C, 11C, 12C).
  *   **Standing Score:** Sum of responses attributing authority/obligation explicitly *denying* benefit or identity (Items 6C, 9C, 10C, 12B).

  ### IV. INTERPRETATION OF EMPTY OR THIN CELLS

  **1. The "Pure Standing" Cell (Leaf 6)**
  *   **Status:** *Predicted Empty / Unstable.*
  *   **Analysis:** It is hypothesized that respondents who select "Standing" options (authority without guilt or benefit) will be inconsistent. In Items 6, 9, and 10, they may claim standing, but in Item 12 (The Unconnected Actor), they will likely collapse into **Liberal Individualism** (Option A: "They are mistaken") or **Inherited Liability** (Option C: "Obliged by civic integrity").
  *   **Diagnosis:** If a respondent scores high on Standing, check Item 12. If they chose 12A or 12C, their "Standing" score is likely noise. They probably mean **Accountability** (Leaf 4) but lack the vocabulary to distinguish "civic duty" from "liability." The view is likely **incoherent**: one cannot have standing to act *for* a polity without some constitutive relation (accountability) or agency (guilt).

  **2. The "Inherited Guilt" vs. "Inherited Liability" Distinction (Leaf 3 vs. Leaf 4)**
  *   **Status:** *Thinly Populated.*
  *   **Analysis:** Few respondents consistently distinguish between inheriting the *stain* (Guilt) and inheriting the *bill* (Liability). Most who select Inherited Guilt in Item 1 (C) will select Inherited Liability in Item 7 (C).
  *   **Diagnosis:** This suggests the view is **unattractive**. Respondents want the obligation to repair (Liability) without the metaphysical burden of the stain (Guilt). Those who insist on the stain (Leaf 3) are often conflating it with Jaspers' Political Guilt (Leaf 2).

  **3. The "Jaspers" vs. "Liability" Overlap (Leaf 2 vs. Leaf 4)**
  *   **Status:** *Indistinguishable in Practice.*
  *   **Analysis:** Jaspers' Political Guilt (Leaf 2) and Inherited Liability (Leaf 4) often yield identical policy prescriptions (pay reparations, accept sanctions). The instrument separates them via Item 2 (Persecuted Citizen) and Item 4 (The Resister).
      *   **Jaspers:** Persecuted/Resister *are* guilty/liable.
      *   **Liability:** Persecuted/Resister are *not* guilty, but may still share responsibility.
  *   **Diagnosis:** If a respondent scores high on both, they likely hold a **hybrid view**: Citizenship creates a default liability (Jaspers), but individual resistance can mitigate it (Liberal). This is a coherent but complex position not fully captured by a single leaf.

  ### V. SUMMARY OF LOGICAL SPACE

  *   **Leaf 1 (Liberal):** Coherent, widely held.
  *   **Leaf 2 (Jaspers):** Coherent, historically specific (post-war context).
  *   **Leaf 3 (Inherited Guilt):** Metaphysically robust but morally unattractive; rarely held consistently.
  *   **Leaf 4 (Inherited Liability):** The dominant "progressive" consensus; coherent.
  *   **Leaf 5 (Fictionalist):** Coherent but politically inert; rarely leads to engagement.
  *   **Leaf 6 (Standing):** **Likely Empty.** Respondents claiming this usually mean Leaf 4 (Liability) but describe it as "duty." The instrument is designed to reveal this collapse in Item 12.
