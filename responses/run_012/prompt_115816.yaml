answer: |-
  I bought the coat to keep the cold away,
  And found the paper stitched beneath the arm.
  The script is strange, a foreign disarray,
  Yet smooth enough to promise me no harm.
  I hold it up against the window light,
  And try to fit the shapes to some known key.
  "Here is a thing I meant to say."
  But silence is the only reply it gives.

  It is not ink spilled careless on the thread,
  Nor random scratch of moth or rusting pin.
  The curves ascend exactly where they led,
  A purpose drawn beneath the outer skin.
  I trace the line where heavy pressure ran,
  And see the signal: "Here is a thing I meant to say."
  It is a call from stranger unto man,
  Though what it calls is lost to me today.

  The writer's haste has carved a deep relief,
  A shadow cast by someone long since gone.
  I feel the anger, or perhaps the grief,
  In every stroke that hurriedly went on.
  I do not know the language or the name,
  But know the soul: "Here is a thing I meant to say."
  The meaning lives inside the act, not flame,
  Or waits for ears that never come this way.

  The first recurrence functions as a projected translation the finder attempts to decode but cannot verify. The second recurrence marks the realization that the marks constitute a deliberate message rather than accidental noise. The third recurrence serves as a portrait of the author's presence, identified through physical trace rather than semantic content.
