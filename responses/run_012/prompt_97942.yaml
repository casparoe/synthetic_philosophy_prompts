      *(Refining the 4 Cases)*:
      1.  Dead Mother: Tests "Harm" definition.
      2.  Valley: Tests "Moral Patient" definition.
      3.  Despised Beneficiary: Tests "Good" definition.
      4.  Unprofitable Harm: Tests "Motivational Relevance."

      *(Final Polish)*: Ensure the distinction between *Intention* (noun) and *Intentionally* (adverb) is clear, as that's a key philosophical distinction in this literature.

