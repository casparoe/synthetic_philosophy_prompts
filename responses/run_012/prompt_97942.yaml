answer: |-
  Here are the desiderata for any theory attempting to account for the asymmetry in intentionality ascriptions (the Knobe Effect), structured to assist your modeling of reader judgment.

  ### I. The Desiderata List

  **1. Epistemic Symmetry Retention**
  *   **Requirement:** The theory must explain why intentionality ascriptions diverge when epistemic states (foresight, knowledge, certainty) are held constant.
  *   **Rationale:** The core phenomenon is that Agent A (harm) and Agent B (help) possess identical knowledge of the side effect. A theory that relies on differences in knowledge to explain the difference in judgment fails to address the phenomenon.

  **2. The Intention/Intentionality Distinction**
  *   **Requirement:** The theory must not collapse the mental state of *intending* (the plan/goal) with the adverbial description of acting *intentionally*.
  *   **Rationale:** In the canonical cases, agents do not *intend* the side effect (it is not their goal), yet readers often say they brought it about *intentionally*. A theory that equates "doing X intentionally" with "having X as a goal" cannot generate the asymmetry; it would predict "unintentional" for both.

  **3. Normative Sensitivity without Moral Reductionism**
  *   **Requirement:** The theory must account for the influence of moral/normative status on intentionality judgments without reducing the concept of "intentional" to simply "blameworthy."
  *   **Rationale:** If "intentional" just means "bad," the concept loses its utility in non-moral contexts (e.g., "He intentionally pressed the button"). The theory must explain how moral valence *influences* the application of a concept that retains independent meaning.

  **4. Counterfactual Robustness**
  *   **Requirement:** The theory must handle cases where the agent's willingness to act remains constant regardless of the side effect's valence (the "would have done it anyway" condition).
  *   **Rationale:** Readers test intentionality by asking, "Would they have done it if the side effect were absent?" A theory must explain why this counterfactual test yields different results for harm vs. help, even when the agent's commitment to the main goal is identical.

  **5. Distinction between Agent Attitude and Outcome Status**
  *   **Requirement:** The theory must distinguish the agent's *attitude* toward the side effect (indifference, regret, disavowal) from the *moral status* of the side effect itself.
  *   **Rationale:** In the Chairman case, the agent disavows concern for the harm. If intentionality tracked only attitude, the judgment should be "unintentional." Since it is often judged "intentional," the theory must explain how the *outcome's* status overrides the *agent's* stated attitude.

  **6. Empirical Accommodation of the Asymmetry**
  *   **Requirement:** The theory must predict the statistical skew: high intentionality ascription for bad side effects, low for good side effects (ceteris paribus).
  *   **Rationale:** A theory that predicts symmetry (50/50 or equal ascription) is empirically falsified by the data. It must explain the direction of the skew.

  **7. Explanatory Non-Deferral**
  *   **Requirement:** The theory must explain *why* the asymmetry exists (mechanism), not merely note *that* it exists (description).
  *   **Rationale:** A theory that says "people judge this way because they are biased" defers the question. An adequate theory must specify the cognitive or conceptual mechanism (e.g., norm violation, deep self concordance, conceptual competence) that generates the bias.

  ---

  ### II. Classification of Requirements

  **Non-Negotiable (Conditions of Adequacy)**
  *   **Epistemic Symmetry Retention:** If a theory requires a difference in knowledge to explain the judgment, it is not a theory of *this* asymmetry.
  *   **Empirical Accommodation:** If it predicts symmetry, it is false.
  *   **Explanatory Non-Deferral:** If it offers no mechanism, it is a description, not a theory.

  **Camp-Specific Commitments (Theoretical Choices)**
  *   **Moral Reductionism vs. Moral Sensitivity:**
      *   *Camp A (Conceptual Competence):* Argues the folk concept of "intentional" is *inherently* moralized. (Violates Desideratum 3's hope for neutrality).
      *   *Camp B (Bias/Error):* Argues the concept is neutral, but moral judgment *biases* the application. (Preserves Desideratum 3).
  *   **Deep Self vs. Normative:**
      *   *Camp C (Deep Self):* Intentionality tracks whether the outcome aligns with the agent's true values.
      *   *Camp D (Normative):* Intentionality tracks whether the outcome violates a prescriptive norm.

  **The Conflict: Rationality vs. Neutrality**
  You asked whether the demand that the asymmetry be a **rational exercise of the ordinary concept** can survive the demand that **intentionality itself remain morally neutral**.

  *   **Verdict:** They are likely incompatible.
  *   **Reasoning:** If the asymmetry is robust and consistent (which data suggests), then treating it as a "rational exercise" implies the concept of intentionality *contains* normative criteria. If the concept contains normative criteria, it is not morally neutral.
  *   **The Trade-off:** To save **Neutrality**, you must argue that readers are making a *mistake* (a performance error driven by emotion). To save **Rationality**, you must argue that the concept of intentionality is *not neutral* (it is inherently tied to norm violation). You cannot have a theory where readers are rationally applying a morally neutral concept to generate a morally skewed result.

  ---

  ### III. Analysis of Your Four Cases

  Here is what an adequate theory must deliver for your specific scenarios, and where standard accounts often gap.

  **Case 1: The Disgraced Dead Mother**
  *   **Scenario:** Harm (disgrace) to a non-existent entity.
  *   **Theory Requirement:** Must determine if "harm" requires a sentient sufferer or if it relies on the violation of a norm (filial piety/sanctity of memory).
  *   **Gap Exposure:** Standard "Harm-Based" accounts struggle here because no welfare is reduced. If readers judge this "intentional," it supports **Normative Theories** (violation of duty) over **Welfare Theories** (infliction of pain).
  *   **Prediction:** If readers judge this intentional, they are tracking norm violation, not suffering.

  **Case 2: The Flooded Valley (No Human Harm)**
  *   **Scenario:** Foreseen destruction of beauty/nature, no people harmed.
  *   **Theory Requirement:** Must distinguish between *moral* harm and *aesthetic* loss.
  *   **Gap Exposure:** Tests the boundary of the "Bad" in the Knobe Effect. If readers judge this "intentional," the concept of "bad" extends beyond interpersonal morality to environmental/stewardship norms. If "unintentional," the asymmetry is strictly interpersonal.
  *   **Prediction:** This case often weakens the asymmetry. It exposes whether the "moral" in moral psychology is strictly anthropocentric.

  **Case 3: Benefit to a Despised Character**
  *   **Scenario:** Foreseen help to someone the reader (or agent) hates.
  *   **Theory Requirement:** Must decide if "Good" is objective or recipient-relative.
  *   **Gap Exposure:** Standard accounts assume "Help = Good." If the recipient is despised, is the help "Good"? If readers judge this "intentional" (because the help is 'bad' in context), it proves the asymmetry tracks **Net Value**, not just the direction of aid.
  *   **Prediction:** This collapses the Help/Harm distinction into a Good/Bad distinction. It reveals readers are tracking *value*, not *benefit*.

  **Case 4: The Unprofitable Harm (Counterfactual Stability)**
  *   **Scenario:** Agent disavows concern, but would have proceeded even without the profit (harm is not a means to an end, nor is the end dependent on the harm).
  *   **Theory Requirement:** Must explain why the *trade-off* structure matters.
  *   **Gap Exposure:** The Chairman case relies on the harm being a cost of a profit-seeking mission. If the profit is removed, does the intentionality ascription hold?
  *   **Prediction:** Standard "Trade-Off" accounts fail here. If readers still say "intentional," it suggests the mere *acceptance* of the harm is sufficient, regardless of the incentive structure. This supports **Volitional Accounts** (acceptance = intention) over **Motivational Accounts** (gain = intention).

  ---

  ### IV. The Single Most Exclusionary Requirement

  The requirement that does the most to exclude candidate theories is:

  **Requirement 3: Normative Sensitivity without Moral Reductionism.**

  **Why:**
  This is the bottleneck.
  1.  **If you demand Moral Neutrality:** You force the theory into the "Bias/Error" camp. You must argue that readers are *wrong* to call the harm intentional. This makes your character's judgment by the reader a matter of cognitive bug, not conceptual truth. It limits your ability to write the ambiguity as philosophically rich; it becomes a psychological glitch.
  2.  **If you allow Moral Reductionism (or Sensitivity):** You admit that "intentional" is a "thick" ethical concept (like "cruel" or "brave"). This satisfies the data best but sacrifices the philosophical intuition that intentionality is a mechanical/causal description.

  **For your novel:**
  If you want the readers to judge your character consistently with the Knobe Effect, you must write the harm as a **Norm Violation**, not just a causal outcome. If you write the harm as purely mechanical (Case 2, the valley), the asymmetry may vanish. If you write the harm as a violation of duty or value (Case 1, the mother), the asymmetry will hold.

  The theory that survives this requirement is the **Normative Theory**: Intentionality is ascribed when an action violates a relevant norm. This is the only framework that accommodates the Dead Mother (norm of respect), the Chairman (norm of non-harm), and the Despised Beneficiary (norm of value), while explaining why the "Help" cases fail (no norm violated).

  **Watch this closely:** Does your reader judge the *act* or the *agent*? If they judge the agent's character, the asymmetry holds. If they judge the causal chain, the asymmetry breaks. Your text must prime the former to ensure the judgment you anticipate.
