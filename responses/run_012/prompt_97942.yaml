          *   Application to User's 4 Cases: Analyze what a theory must deliver for each and if they expose gaps.
          *   Final Verdict: Identify the *single* most exclusionary requirement.
      *   **Tone:** Philosophical, precise, rigorous, tailored to a writer seeking structural understanding of moral psychology/philosophy of action.

  2.  **Deconstruct the Philosophical Landscape (The Knobe Effect & Intentionality):**
      *   *The Phenomenon:* People attribute intentionality more readily to bad side effects than good side effects, even when epistemic states (knowledge/foresight) are identical.
      *   *Major Theories:*
          *   *Skill/Control:* (Rejected, doesn't fit the asymmetry).
          *   *Deep Self/Concordance:* (Intentional if it aligns with deep values).
          *   *Blame/Praise Asymmetry:* (Intentionality is tethered to blame).
          *   *Normative/Reasons-Based:* (Intentionality tracks violation of norms).
          *   *Conceptual Competence:* (Is the folk concept itself moralized?).
      *   *Key Distinctions:* *Intention* (mental state) vs. *Intentional Action* (description of act). *Moral Valence* vs. *Causal Role*.

  3.  **Drafting the Desiderata (The Requirements List):**
      *   *Requirement 1: Epistemic Symmetry.* The theory must handle cases where knowledge/foresight is held constant while moral valence varies. *Why:* This is the core data point.
      *   *Requirement 2: Distinction between Intention and Intentionality.* Must separate the mental state (plan) from the adverbial description (did she do it *intentionally*?). *Why:* Collapsing these makes the asymmetry inexplicable.
      *   *Requirement 3: Moral Valence Independence (The Hard One).* Can the theory explain the asymmetry without making "intentional" *mean* "blameworthy"? *Why:* If "intentional" just means "bad," it loses predictive power in non-moral contexts.
      *   *Requirement 4: Agent Attitude vs. Outcome.* Must distinguish the agent's goal from the side effect's status. *Why:* To avoid conflating motive with outcome.
      *   *Requirement 5: Empirical Accommodation.* Must fit the data (harm = intentional, help = unintentional, usually). *Why:* A theory contradicting data is false.
      *   *Requirement 6: Non-Deferral.* Must explain *why* the asymmetry exists, not just note it. *Why:* Explanatory power.

  4.  **Classifying Requirements (Non-negotiable vs. Camp-specific):**
      *   *Non-negotiable:* Epistemic Symmetry, Empirical Accommodation, Non-Deferral. (If you fail these, you aren't theorizing the phenomenon).
      *   *Camp-specific:* Moral Valence Independence (Some say intentionality *is* moralized), Deep Self Concordance (Some say it's about identity, not norms).
      *   *The Conflict:* The user specifically asked about "rational exercise of ordinary concept" vs. "intentionality remain morally neutral." This is the crux. If the ordinary concept *is* moralized, you can't have neutrality. If you demand neutrality, you must argue the ordinary concept is *irrational* or *biased*.

  5.  **Analyzing the User's Four Cases:**
      *   *Case 1 (Dead Mother/Disgrace):* No victim to harm. Standard blame models struggle. Theory must decide if "wrong" requires a harmed subject or just a norm violation.
      *   *Case 2 (Flooded Valley/No People):* Environmental harm without human suffering. Tests if "harm" is strictly welfare-based or aesthetic/normative.
      *   *Case 3 (Benefit to Despised Character):* Good outcome, bad recipient. Tests if "good" is objective or recipient-relative.
      *   *Case 4 (Disavowed Concern/Unprofitable Harm):* Counterfactual stability. Tests if the motive matters more than the foresight. (This challenges the "trade-off" aspect of the Chairman case).

  6.  **Identifying the Single Most Exclusionary Requirement:**
      *   It's likely the demand that the theory explain the asymmetry *without* collapsing intentionality into moral judgment (The "Moral Neutrality" constraint). Most successful theories (like the Normative Theory) essentially concede that the concept *is* sensitive to norms. Demanding neutrality forces a very narrow cognitive path (e.g., strict Causal/Control theories which largely fail the data).

