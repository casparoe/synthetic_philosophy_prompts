answer: |-
  Students pre-commit to a fixed betting fraction, apply it to a predetermined sequence of biased coin flips, and compare their final wealth against the theoretical expected value.

  Your setup contains two conceptual confusions that will undermine the lesson if you don't address them. First, if everyone faces the *same* sequence, you cannot empirically demonstrate the divergence between ensemble average (mean wealth) and time average (median wealth) in the room, because there is no variance in outcomes across students using the same strategy—only variance across strategies. To *see* the mean/median split, you need independent sequences (parallel universes), which conflicts with your goal of controlling for luck. I have fixed this in the plan below by using a live spreadsheet simulation for the ensemble data while students play the time-average game. Second, you risk conflating "maximizes growth" with "is rational." The Kelly criterion maximizes geometric growth rate, which is equivalent to maximizing expected utility *only* if agents have log-utility of wealth. If a student has a linear utility function (needs \$1M for tuition or nothing), betting full edge is rational for them. The debrief must frame Kelly as a specific stance on risk and time, not a universal moral imperative. Finally, regarding your third phase: betting the Kelly fraction on multiple *independent* coins does not technically overbet; the danger arises when coins are *correlated*. I have adjusted Phase 3 to introduce correlation so the overbetting trap actually snaps shut.

  ### Materials
  *   **Currency:** 15 sheets of paper labeled "Bankroll" (one for you, 14 for students). Start value: 100 units.
  *   **Handout A (The Sequence):** A single sheet with 20 pre-generated H/T outcomes (weighted 60/40). *Note: 20 rounds is sufficient for ruin ($0.6^{20} \approx 0.00003$) and saves 10 minutes of calculation time compared to 30.*
  *   **Handout B (The Tracker):** A simple table for students to record their chosen fraction ($f$), number of Heads, number of Tails, and Final Wealth.
  *   **Projector:** Connected to your laptop with a simple spreadsheet open (pre-loaded with a Monte Carlo simulation of 10,000 agents).
  *   **Prize:** A bag of cheap chocolate coins or a "Tenure Track" novelty mug for the highest final bankroll.

  ### Minute-by-Minute Timeline (75 Minutes)

  **00:00 – 00:10: Setup & Pre-commitment**
  *   Distribute Handouts. Explain the coin is 60% Heads, 40% Tails. Payout is 1:1 (bet 10, win 10; bet 10, lose 10).
  *   **Rule:** Students must write down a single betting fraction $f$ (e.g., 0.1, 0.5, 1.0) on their index card. They cannot change this fraction for the entire game.
  *   **Constraint:** No borrowing. If bankroll hits 0, you are out.
  *   Collect the cards. Do not reveal them yet.

  **00:10 – 00:25: The Time Game (Phase 1)**
  *   Project Handout A (The Sequence) all at once.
  *   Instruct students to count the total Heads ($H$) and Tails ($T$) in the sequence.
  *   **Calculation:** Instead of iterating 20 times, give them the compound formula: $W_{final} = 100 \times (1+f)^H \times (1-f)^T$.
  *   Students calculate their final wealth. This prevents arithmetic errors from dominating the lesson and saves time.
  *   **Action:** Students write their Final Wealth on the board next to their chosen $f$.

  **00:25 – 00:40: The Ensemble Reveal (Phase 1 Debrief)**
  *   **Observation:** Look at the board. Almost everyone who bet $f \ge 0.5$ is likely near zero. Someone who bet $f \approx 0.2$ likely has the highest wealth.
  *   **The Trap:** Ask the class: "What is the Expected Value (EV) of a single round?" (Answer: $0.6(1) + 0.4(-1) = 0.2$ or 20%).
  *   **The Conflict:** "If every round has positive EV, why did the 'Bet 100%' strategy go broke?"
  *   **The Simulation:** Switch to your spreadsheet. Run the Monte Carlo simulation (10,000 agents, 20 rounds, 60/40 coin).
      *   Show the **Arithmetic Mean** wealth (will be huge, matching theoretical EV).
      *   Show the **Median** wealth (will be near zero for high $f$).
  *   **Key Point:** This visualizes the ergodicity breakdown. The ensemble average (mean) goes up; the time average (typical path) goes down.

  **00:40 – 00:55: Diversification & Correlation (Phase 2)**
  *   Reset bankrolls to 100.
  *   **Scenario:** You now face 3 coins simultaneously each round.
  *   **Condition A (Independent):** All 3 are 60/40, uncorrelated. Ask: "Do you change your $f$?" (Most will say no).
  *   **Condition B (Correlated):** Reveal that Coin 2 and Coin 3 are actually linked to Coin 1 (e.g., if Coin 1 is T, Coin 2 is T).
  *   **Action:** Have them recalculate based on the *effective* risk. If they bet 20% on three correlated coins, they are effectively betting 60% on one coin.
  *   **Result:** Those who didn't adjust for correlation will see massive volatility or ruin. This validates your intuition about "quiet overbetting."

  **00:55 – 01:15: Theoretical Mapping & Close**
  *   **Log Utility:** Explain that maximizing geometric growth is mathematically equivalent to maximizing Expected Utility with a logarithmic utility function ($U(W) = \ln W$).
  *   **Kelly Criterion:** Reveal the name. $f^* = p - q$. For 60/40, $f^* = 0.2$. Point to the winner on the board.
  *   **Geometric Rationality:** Conclude that choosing Kelly is a stance on how you view time (repeated play) vs. ensemble (one-off play). It is not a theorem that proves EV maximization is "wrong," but that it is dangerous for non-ergodic systems.
  *   **Award:** Give the prize to the highest bankroll.

  ### Payoff Scheme
  *   **Currency:** Points on the board.
  *   **Winner:** The student with the highest final bankroll after Phase 1.
  *   **Prize:** A bag of chocolate coins (thematically appropriate) or a "Certified Rational Agent" printed certificate. Keep it silly to avoid actual gambling incentives.

  ### Predictable Pitfalls & Handling
  1.  **Calculation Paralysis:** Students will struggle with $(1+f)^H$ without calculators.
      *   *Fix:* Allow phone calculators. Provide the formula explicitly on Handout B.
  2.  **The "All-In" Luck:** One student might bet 100% and get lucky (20 heads in a row is rare but possible).
      *   *Fix:* If this happens, acknowledge it. "This is the ensemble average whispering to you. You won the lottery, but would you play this again?" Use the simulation to show this happens in 1 out of 27,000 universes.
  3.  **Boredom:** Counting 20 H/Ts is dull.
      *   *Fix:* Keep the energy high during the reveal. The "ruin" moment is the dopamine hit.
  4.  **Fraction Confusion:** Students might bet "20 chips" instead of "20%".
      *   *Fix:* Emphasize *fraction* of *current* stack repeatedly. The compounding is the lesson.

  ### What The Game Can't Reproduce (Your Job to Supply)
  1.  **Utility Theory:** The game shows growth, not utility. You must explain *why* we care about growth. (Answer: Survival and repeated play).
  2.  **Finite Horizons:** Kelly is asymptotic. In 20 rounds, "Half-Kelly" might actually have a better risk-adjusted return than full Kelly. Acknowledge this nuance so you don't sound dogmatic.
  3.  **Market Reality:** Real markets don't have known probabilities (60/40). The hard part isn't calculating Kelly, it's estimating $p$. Mention this to prevent overconfidence.
  4.  **Moral Hazard:** Winning the game doesn't make a student a "better" decision theorist. It just makes them a better fit for this specific utility function. Ensure you don't shame the EV maximizers; frame their strategy as rational for a one-off bet with no ruin consequence.
