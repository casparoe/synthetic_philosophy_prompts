  Design me a betting game where they run into the problem themselves. My rough sketch, fix it where it's wrong: everyone starts with 100 chips, 30 rounds, a 60/40 coin, even-money payout, and before round one each person writes a betting rule on an index card — what fraction of their current stack they stake each round — and then has to live with it. Everyone faces the same projected sequence of flips so nobody can blame their own luck. Then we tally bankrolls on the board. What I want them to see is the ensemble average going up while almost every individual goes broke, and the median player doing nothing like the average. If there's time, a third phase where they can stake on three independent 60/40 coins in the same round, so the "just bet your edge on each one" rule quietly overbets.

  Give me the rules, materials, the payoff scheme (no real money — points, and something small and silly for the winner), a minute-by-minute timeline, and a debrief that maps what happened onto the actual ideas: the growth-optimal fraction, log utility, the split between time-average and ensemble-average outcomes, and why "geometric rationality" is a stance you take and not a theorem you prove. Tell me what will predictably go sideways the first time I run it and how to handle it, and be straight with me about what the game can't reproduce and that I'll have to supply by talking.

