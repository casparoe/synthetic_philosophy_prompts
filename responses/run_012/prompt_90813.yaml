answer: |-
  Your observation cuts to the heart of political philosophy. You have identified a tension between voting as a **method of governance** (filling offices) and voting as a **method of expression** (signaling preference). The current rules of your mock election are not accidental; they embody a specific, coherent theory of what a vote is.

  Here is the reconstruction of that theory, an analysis of its requirements, and the implications of your proposed reform.

  ### 1. Reconstructing the Theory: The Vote as "Investiture"

  The current system presupposes that a vote is primarily an **act of investiture**.

  Under this theory, the purpose of an election is not to measure public sentiment in the abstract, but to confer legitimate authority upon specific individuals to hold office. This theory synthesizes three concepts:

  *   **A Selection from a Fixed Menu:** The ballot is a legal instrument, not a survey. Its function is to resolve uncertainty about *who* governs. To allow a blank ballot is to introduce ambiguity into a mechanism designed for clarity. The system requires a binary output for each seat: filled or unfilled. By invalidating blank ballots, the system forces the voter to participate in the selection of a governor, even if reluctantly.
  *   **A Discharge of Duty:** The prohibition on selling votes reveals that the vote is not private property. If it were property, you could sell it. If it were purely expression, you could withhold it. By making sale a crime and invalidating silence, the system treats the vote as a **public trust**. You are a temporary custodian of a share of sovereignty, and you have a duty to deploy it to ensure the continuity of the state (or school).
  *   **Constrained Legitimacy:** The system assumes legitimacy comes from the *procedure* (counting valid votes for candidates), not the *satisfaction* of the voters. As long as the rules are followed and a candidate receives a plurality, the outcome is legitimate, even if many voters hated all options.

  **Verdict:** The vote is best described here as a **Duty of Selection**. It is not merely expression (because you cannot express rejection), nor merely a menu (because you cannot opt out), nor merely a duty (because you must choose a person). It is the mandatory deployment of a public trust to select a ruler from a pre-approved list.

  ### 2. Requirements vs. Compatibilities

  Which parts of your school's practice are essential to this theory, and which are merely incidental?

  **Genuinely Required by the "Investiture" Theory:**
  *   **Invalidating Blank Ballots:** This is the strongest pillar. If the goal is to fill an office, a blank ballot is a failure of the mechanism. It must be treated as an error (a spoiled machine) rather than a message, because the machine cannot process "no ruler" as a valid output.
  *   **Anti-Commodification (No Buying Votes):** This is essential to the "public trust" aspect. If votes were commodities, a voter could choose to "spend" them on cash rather than candidates. The rule ensures the vote is used only for its intended purpose: investiture.
  *   **Qualification of Candidates:** The "fixed menu" is necessary. You cannot invest authority in someone who has not been vetted to hold it.

  **Licensed by Rival Theories (Compatible but not Required):**
  *   **The Secret Ballot:** This is compatible with the Investiture theory, but also with the "Expression" theory. Keeping the vote secret protects the voter from coercion, which serves both the state's interest (stable elections) and the individual's interest (free expression).
  *   **One Person, One Vote:** This is compatible with almost any theory of democracy, whether voting is seen as expression, duty, or selection.
  *   **Majority/Plurality Wins:** While the Investiture theory needs *a* winner, it doesn't strictly demand a plurality. It could demand a runoff. The specific counting method is less central to the theory than the requirement that *someone* wins.

  ### 3. The Consequences of Your Proposal

  You propose counting blank or spoiled ballots as explicit votes for **"None of the Above" (NOTA)**, with the stipulation that a candidate must *beat* NOTA to win. This shifts the theory from **Investiture** to **Conditional Consent**.

  If your club adopts this rule, the following theoretical and practical changes would occur:

  **A. Theoretical Shift: From Authorization to Veto**
  Currently, voters authorize a winner. Under your rule, voters hold a **veto power**. The authority of the government is no longer derived merely from the positive selection of a candidate, but from the *failure of the electorate to reject them*. This elevates the "Expression" theory of voting over the "Duty" theory. It acknowledges that withholding consent is a political act equal to granting it.

  **B. The Legitimacy Crisis**
  In the current system, a candidate who wins with 20% of the vote (in a crowded field) is fully legitimate. Under your rule, if NOTA gets 25%, that candidate cannot take office.
  *   **Change:** You would need a new rule for what happens if NOTA wins. Does the seat remain vacant? Is a new election held? Are the current office-holders held over? Without a contingency plan, a NOTA victory creates a constitutional crisis where the school has no representative for that position.

  **C. Strategic Behavior**
  *   **Current System:** Voters engage in "lesser evil" voting. They hold their nose and pick the candidate they dislike least to prevent the one they dislike most from winning.
  *   **Your System:** Voters can vote sincerely for a fringe candidate without fear of "wasting" their vote, knowing that if the field is truly terrible, they can register a NOTA protest. However, this might fragment the vote further, making it *harder* for any candidate to beat NOTA.

  **D. Candidate Incentives**
  *   **Current System:** Candidates compete against each other. They try to steal voters from opponents.
  *   **Your System:** Candidates must also compete against apathy and anger. They must mobilize non-voters or dissatisfied citizens to come out and vote *for* someone, rather than just voting *against* an opponent. A candidate might win by convincing voters that they are "better than nothing," rather than "better than the other guy."

  ### Summary
  The current rules treat the vote as a **gear in a machine**: it must turn to keep the engine running, and it must turn in a specific direction (toward a name). Your proposal treats the vote as a **signature on a contract**: the government only exists if the governed explicitly agree to it, and they reserve the right to refuse to sign.

  Adopting your rule would make the election more expressive and arguably more democratic in a participatory sense, but it would make governance less stable. It trades the certainty of leadership for the purity of consent.
