      *   *Premise 3:* Buying votes is illegal. (Implies voting is a *civic trust* or *public function*, not private property).
      *   *Synthesis:* The system views voting primarily as a **method of authorization**. It is a procedural mechanism to fill offices. It is not primarily a survey of public sentiment (expression) nor purely a moral duty (though duty is implied by the anti-commodification rule). It treats the voter as a *selector* within a constrained set.
