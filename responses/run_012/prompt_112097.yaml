      *   *Collingridge's View:* Collingridge cares about *consequences*. Consequences stem from *capability* (use), not just *files* (possession). If the capability is proven, others will replicate it (which they did—Megatron, etc.).
      *   *Conclusion:* The fight was about *access friction*, not *existence*. Collingridge says if the capability is known, the technology is effectively "in the wild" regardless of the official weights. OpenAI controlled the *convenience*, not the *possibility*.

