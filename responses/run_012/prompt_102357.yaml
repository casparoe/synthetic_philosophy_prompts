prompt: |-
  I'm a 4th year phil PhD (metaethics, drifting into population ethics) and I've somehow volenteered to run a 90-minute session on the procreation asymmetry for a mixed reading group -- mostly econ and bio grad students, a couple of lawyers, one very opinionated undergrad. They can all handle abstract argument and they've read a bit of utilitarian stuff, but none of them do population ethics. So I don't need the asymmetry explained to me, I need a teaching plan for it: the order the pieces have to go in so it actually lands, the one case I should build the whole session around and what that case has to have going for it (and if the obvious one is a trap, why), the misconceptions they'll walk in with or form halfway through and exactly where in the sequence I head each one off, and a single question I can throw at them at the end that tells me whether they've got it or just nodded along.

  The thing I'm actually worried about: they'll all cheerfully agree with the asymmetry in the abstract -- obviously don't bring a miserable kid into the world, and no particular reason to bring a happy one -- and then the second they see it means that adding happy people isn't a good thing in itself, they'll quietly downgrade it to some conditional reading where it only counts once the person exists, and feel like they kept the intuition when they've actually gutted it. I want the arc to make that move feel like a loss rather than a save. And the bit I really want them to walk out with is the difference between the axiological version (adding a happy person doesn't make the world better) and the deontic one (there's no reason to add one) -- they conflat these constantly and I think it's half of why the whole thing feels slippery to them.

  Two detours I don't have time for and keep having to shut down: the life-isn't-worth-living antinatalist stuff, and the repugnant-conclusion stuff. Tell me what I can leave out entirely and announce that I'm leaving out, and what I can't afford to skip even if it costs me time. I'd way rather they leave with one sharp thing than a fog of population-ethics trivia.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the User and Request:**
      *   **User:** 4th-year Phil PhD (Metaethics/Population Ethics). Knows the material deeply.
      *   **Task:** Design a 90-minute session on the Procreation Asymmetry for a mixed audience (Econ, Bio, Law, 1 undergrad).
      *   **Audience Profile:** Smart, handle abstraction, read some utilitarianism, *no* population ethics background. Prone to conflating axiological/deontic versions and "saving" the intuition by conditionalizing it (person-affecting view) without realizing the cost.
      *   **Goal:** Make the asymmetry land hard. Specifically, make the move from "intuitive asymmetry" to "adding happy people isn't good" feel like a *loss* (a theoretical cost), not a save. Clarify Axiological vs. Deontic distinction.
      *   **Constraints:** Avoid Antinatalism (life not worth living) and Repugnant Conclusion detours. Need a specific core case, a sequence, misconception management, and a final diagnostic question.
      *   **Tone:** Professional, peer-to-peer, strategic, pedagogical.

  2.  **Deconstruct the Core Problem:**
      *   The "Procreation Asymmetry" (Parfit/Narveson/etc.) states:
          1.  We have a reason *not* to create a miserable person (harm counts).
          2.  We do *not* have a reason *to* create a happy person (benefit doesn't count).
      *   *The Trap:* Students agree initially. Then, when shown this implies Total Utilitarianism is false (or requires modification), they slide into a "Person-Affecting View" (PAV) without realizing it. They think: "It's not bad to not create them, because there's no 'them' to be harmed."
      *   *The User's Insight:* The distinction between *Axiological* (Is the world better?) and *Deontic* (Do I have a reason/obligation?) is crucial. Most people conflate them.
      *   *The Challenge:* How to force them to see that accepting the asymmetry axiologically creates a massive hole in value theory (the "Absurd Conclusion" or just the loss of the "Goodness of Existence"), rather than letting them hide behind "no duty."

  3.  **Select the Core Case:**
      *   *Candidate 1: The Non-Identity Problem.* Too much baggage, leads straight to Repugnant Conclusion/Identity issues. User wants to avoid RC.
      *   *Candidate 2: The Miserable Child vs. The Happy Child.* Standard. Maybe too simple.
      *   *Candidate 3: The "Magic Button" Case.* (Press button -> Happy Person exists elsewhere). Good for isolating the "adding value" question.
      *   *Decision:* The **"Two Worlds" / "God's Choice" Case**.
          *   *Why:* It forces an axiological comparison without immediate deontic pressure on the *agent*. It isolates the "Betterness" claim.
          *   *Structure:* World A (10 happy people). World B (10 happy people + 1 very happy person). No identity issues (the extra person doesn't exist in A).
          *   *Trap:* The "Obvious" case is usually "Should *I* have a kid?" This triggers deontic reasoning immediately ("I'm not obligated"). We need to start Axiological to show the cost.
          *   *Refinement:* Let's use a variation of Parfit's "Asymmetry" setup but framed as a choice between outcomes, not just duties. Let's call it **The "Empty Planet" vs. "Populated Planet" comparison**, but tweaked to avoid RC. Actually, the **"Miserable vs. Happy" contrast** is best, but we need to run it twice: once for duty, once for value.
          *   *Best Choice:* **The "Pair of Choices" Scenario.**
              *   Choice 1: Create Child A (Misery) vs. Create No One.
              *   Choice 2: Create Child B (Bliss) vs. Create No One.
              *   *Twist:* Then ask about World States. World with A vs. Empty. World with B vs. Empty.
              *   *Why:* This exposes the Axiological/Deontic split immediately.

  4.  **Drafting the Sequence (90 Minutes):**

      *   **0-10: Setup & Definitions.** Kill the Antinatalism/RC dragons immediately. Define Axiological vs. Deontic.
      *   **10-30: The Intuition Pump (Deontic).** Get them to agree on the duties. (Don't make miserable kid, no duty to make happy kid).
      *   **30-50: The Axiological Turn (The Trap).** Ask: "If you don't have a reason to make the happy kid, is the world *better* if you do?" This is where they try to slide.
      *   **50-70: The Cost of Saving the Intuition.** Show that if they say "World isn't better," they lose the ability to say happiness is good *impersonally*. If they say "World is better," they lose the Asymmetry (because then they have a reason to promote the good).
      *   **70-80: Formalizing the Distinction.** Person-Affecting vs. Impersonal.
      *   **80-90: The Diagnostic Question.**

  5.  **Addressing the Specific Worries:**
      *   *Worry:* They downgrade to conditional reading ("only counts once person exists").
      *   *Fix:* Force the "God's Eye View." Ask them to compare World A and World B *from outside*. If B isn't better than A, why not? If it *is* better, why no duty to create it?
      *   *Worry:* Antinatalism/RC.
      *   *Fix:* Explicitly bracket "lives not worth living" (assume all lives discussed are worth living) and "infinite populations" (keep numbers small).

  6.  **Developing the Diagnostic Question:**
      *   Needs to distinguish between "I get the asymmetry" and "I just reverted to standard utilitarianism."
      *   *Idea:* A scenario where the Deontic and Axiological come apart.
      *   *Question:* "If the world with the extra happy person is *better*, but you have *no duty* to create it, where did the value go?" Or better: "Is the absence of happy people *bad*?"
      *   *Refinement:* "Imagine two universes. U1 has 1 billion happy people. U2 has 1 billion happy people + 1 extra happy person (who wouldn't exist in U1). If you are a benevolent God choosing which to create, do you have a reason to pick U2? If yes, you rejected the Deontic Asymmetry. If no, you rejected the claim that Happiness is Impersonally Good."
      *   *Wait, simpler:* "Does the absence of a happy person constitute a loss?" If they say "No," they hold the asymmetry. If "Yes," they don't. But we need to check if they understand *why* it's a problem.
      *   *Best Diagnostic:* "If adding a happy person doesn't make the outcome better, what kind of 'good' is happiness?"

  7.  **Refining the Plan (Self-Correction during drafting):**
      *   *Critique:* Starting with Deontic (duties) reinforces their bad habit.
      *   *Correction:* Start with Axiological (Value). Ask "Which world is better?" *before* asking "What should you do?"
      *   *Wait, User says:* "They'll cheerfully agree with the asymmetry in the abstract."
      *   *Strategy:* Let them agree. Then pull the rug.
      *   *Revised Sequence:*
          1.  Get the intuitive agreement (Deontic).
          2.  Translate to Axiological (Betterness).
          3.  Show the conflict with Impersonal Goodness.
          4.  Force the choice: Keep Asymmetry & Lose Impersonal Goodness OR Keep Impersonal Goodness & Lose Asymmetry.
      *   *The "One Case":* **The "God's Garden"**. Two gardens. One has 10 flowers. One has 10 flowers + 1 beautiful new flower (that wouldn't bloom otherwise). Is Garden 2 *better*? If yes, why no duty to plant it? If no, is beauty not good?
      *   *Actually, stick to People:* **The "Happy Stranger" Case.**
          *   Scenario: You can press a button. A happy person appears on a distant continent. They will be happy, affect no one else, die happily.
          *   Q1: Do you *must* press it? (Deontic)
          *   Q2: Is the world *better* if you do? (Axiological)
          *   This isolates the variables perfectly.

  8.  **Finalizing the "Trap" and "Misconceptions":**
      *   *Misconception:* "No subject, no harm/benefit." (Person-Affecting View).
      *   *Intervention:* Distinguish "Bad for X" vs. "Bad simpliciter."
      *   *Misconception:* "It's supererogatory." (Good to do, not required).
      *   *Intervention:* If it's good to do, why is it not a reason? If it's a reason, why not required (given small cost)?
      *   *What to cut:* Non-Identity Problem (too complex), Repugnant Conclusion (too big), Antinatalism (irrelevant to asymmetry logic).

  9.  **Writing the Response:**
      *   Adopt the persona of a colleague.
      *   Be direct about the pedagogy.
      *   Structure clearly: The Case, The Arc, The Interventions, The Cut List, The Diagnostic.

  10. **Review against constraints:**
      *   90 mins? Yes, the pacing fits.
      *   Mixed audience? Yes, avoids heavy formalism, uses intuitive cases.
      *   Axiological/Deontic split? Central theme.
      *   Avoid RC/Antinatalism? Explicitly bracketed.
      *   Diagnostic question? Included.

  11. **Final Polish:** Ensure the distinction between "No reason to create" and "Creating adds no value" is sharp. This is the user's main pain point. The "Happy Stranger" case is the best vehicle for this. I will emphasize that specific case. I need to make sure the "Loss" feeling is engineered. The way to do that is to show that accepting the asymmetry means happiness is *not* an impersonal good. That's a huge bullet to bite for utilitarians/economists.

  *(Self-Correction)*: Wait, if I use the "Happy Stranger," economists might say "Resource allocation." I need to stipulate *no cost*. "Magic Button."
  Also, need to make sure the "Deontic" part doesn't swallow the "Axiological."
  Okay, the plan is solid. I will structure the response to mirror the lesson plan.

  *Key Insight for the User:* The "Loss" comes from forcing them to admit that if the Asymmetry holds, Happiness is not *Good* in the same way Suffering is *Bad*. Suffering is Bad Impersonally. Happiness is only Good *for someone*. This breaks the symmetry of value. That's the theoretical cost.

