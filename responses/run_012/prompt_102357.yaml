answer: |-
  This is a classic pedagogical trap in population ethics. Your intuition is correct: if you let them treat the asymmetry as a "free save," they will walk out thinking they've solved population ethics by just adopting a sloppy Person-Affecting View (PAV) without realizing it renders impersonal value incoherent.

  Here is a 90-minute teaching plan designed to force the Axiological/Deontic distinction into the open and make the theoretical cost of the asymmetry feel like a loss.

  ### 1. The Core Case: "The Magic Button" (Isolated Addition)
  Do not use the "Should I have a child?" case. It is too loaded with personal identity, resource allocation, and deontic pressure. It invites the "no subject, no harm" defense immediately.

  **Use this instead:**
  > **The Case:** You are in a room with a magic button.
  > *   **Option A:** You do nothing.
  > *   **Option B:** You press the button. Far away, on a continent you will never visit, a new person comes into existence. Their life is guaranteed to be very happy (worth living). They affect no one else. They never know you pressed the button. You incur no cost.
  >
  > **The Setup:** Stipulate explicitly: *This life is worth living. No one is harmed. Resources are magic.*

  **Why this case?**
  1.  **Isolates Deontic:** It removes "obligation to self" or "resource scarcity" (Econ students love to object about resources).
  2.  **Isolates Axiological:** It allows you to ask about the *state of the world* separately from the *action*.
  3.  **Avoids Identity:** We aren't comparing Child A vs. Child B (Non-Identity); we are comparing *Someone* vs. *No One*.

  ---

  ### 2. The Arc (90 Minutes)

  #### **Phase 1: The Setup & Bracketing (0–10 mins)**
  *   **Goal:** Clear the underbrush so they can't hide behind standard objections.
  *   **Action:** Write two rules on the board.
      1.  **No Antinatalism:** We are assuming all lives discussed are *worth living*. We are not discussing whether existence is a harm.
      2.  **No Repugnant Conclusion:** We are adding *one* happy person, not billions of barely-happy ones. We are testing the *direction* of value, not the *limit*.
  *   **Define Terms:** Write **Axiological** (Is the world better?) and **Deontic** (Do I have a reason/obligation?) on the board. Tell them: *"Today is about why you cannot have both intuitions without paying a theoretical price."*

  #### **Phase 2: Eliciting the Intuition (Deontic) (10–25 mins)**
  *   **Action:** Present the Magic Button case.
  *   **Ask:** "Do you have a moral *obligation* to press the button?"
  *   **Expected Result:** Almost everyone says **No**. (This is the Deontic Asymmetry).
  *   **Ask:** "If you pressed a button that created a *miserable* person (same conditions), would you be doing something wrong?"
  *   **Expected Result:** Everyone says **Yes**.
  *   **Checkpoint:** You have secured the Deontic Asymmetry.
      *   *Misconception Alert:* An Econ student might say, "It's supererogatory. Good to do, not required."
      *   *Shut it down:* "Fine. If it's 'good' to do, is there a *reason* to do it? Or is it morally neutral, like choosing vanilla over chocolate?" (Push them to admit there is no *moral reason* to press it).

  #### **Phase 3: The Axiological Turn (The Trap) (25–50 mins)**
  *   **Goal:** This is where you prevent the "conditional save."
  *   **Action:** Change the question. "Forget about you and the button for a moment. Compare **World A** (Button not pressed) and **World B** (Button pressed, happy person exists)."
  *   **Ask:** "Is World B *better* than World A?"
  *   **The Fork:**
      *   **If they say YES:** They have abandoned the Axiological Asymmetry. If World B is better, and the cost is zero, why isn't there a reason to create it? (They must explain why 'Better' doesn't generate 'Reason').
      *   **If they say NO (or 'Equal'):** They have kept the Asymmetry, but they have lost **Impersonal Goodness**.
  *   **The Squeeze:** This is the critical moment. If they say World B is not better, ask: *"So, happiness is not an impersonal good? Suffering is bad (World with miserable person is worse), but Happiness is not good (World with happy person is not better)?"*
  *   **Make it feel like a loss:** Point out that for a Utilitarian/Econ audience, this is catastrophic. It means value is not symmetric. Pain counts *impersonally*; pleasure only counts *relatively* (to the subject).
      *   *Script:* "If you say World B isn't better, you are saying the universe does not gain value when a happy person is added. You are saving the intuition that 'I don't have to press the button' by sacrificing the claim that 'Happiness makes the world better.'"

  #### **Phase 4: Formalizing the Cost (50–70 mins)**
  *   **Goal:** Distinguish the views clearly.
  *   **Draw the Matrix:**
      1.  **Total View (Classic Util):** Happy addition = Better World + Reason to Create. (Rejects Asymmetry).
      2.  **Person-Affecting View (PAV):** Happy addition = No Change in Value + No Reason. (Keeps Asymmetry, loses Impersonal Goodness).
      3.  **The "Slippery" Middle (Where they want to live):** Happy addition = Better World + No Reason.
  *   **Attack the Middle:** Show them the "Slippery Middle" is unstable.
      *   *Argument:* If World B is *better*, and you can bring it about at *no cost*, and you are a moral agent, how do you justify not having a reason to do it?
      *   *The "Conditional" Trap:* They will say, "It's only good *for them*."
      *   *Counter:* "If it's only good for them, then in World A (where they don't exist), there is no loss. So World A and World B are equal. So you *did* choose option 2 (PAV). You just didn't want to admit it."
  *   **Takeaway:** Force them to see that holding the Asymmetry requires biting the bullet that **the absence of happy people is not bad, even though the presence of miserable people is bad.** This is the "loss" you want them to feel. It breaks the symmetry of value theory.

  #### **Phase 5: Wrap & Diagnostic (70–90 mins)**
  *   **Review:** Reiterate that the Asymmetry isn't free. It costs you the idea that Happiness is an Impersonal Good.
  *   **Q&A:** Leave 10 mins.
  *   **The Diagnostic Question (See below).**

  ---

  ### 3. Misconceptions & Interventions

  | Misconception | When it arises | The Intervention |
  | :--- | :--- | :--- |
  | **"No subject, no harm/benefit."** | Phase 2 (Deontic) | "Agreed. That explains why there's no *duty*. But does it explain why the *world* isn't better? Can't the world be better without a specific subject being benefited?" |
  | **"It's supererogatory (Good but not required)."** | Phase 3 (Axiological) | "Supererogatory acts are *good*. If adding the person is good, why does the Asymmetry claim there's *no reason* to do it? If there's a reason, why isn't it required (given zero cost)?" |
  | **"This leads to the Repugnant Conclusion."** | Anytime | **Hard Bracket.** "We are discussing the addition of *one* happy person. The Repugnant Conclusion is about quantity vs. quality. That is a different problem. Stay on the Asymmetry." |
  | **"But the kid would want to exist!"** | Phase 3 | "We can't compare 'Existing' vs. 'Not Existing' from the kid's perspective. That's the Non-Identity Problem. Compare the *World States* from the outside." |

  ---

  ### 4. What to Cut (The Detours)

  1.  **The Non-Identity Problem:**
      *   *Why cut:* It confuses the Asymmetry. The Asymmetry holds even if identity is fixed (e.g., "Should I create *this specific* embryo vs. none?"). Non-Identity introduces "harm to whom?" which distracts from "is the world better?"
      *   *What to say:* "We are assuming the person in the 'Happy' case is a distinct individual who only exists in the 'Press Button' scenario. We are not comparing different possible children."
  2.  **The Repugnant Conclusion:**
      *   *Why cut:* It swallows the room. It shifts the debate from *Asymmetry* (Positive vs. Negative) to *Aggregation* (Total vs. Average).
      *   *What to say:* "We are looking at the marginal value of one happy life. Whether a billion barely-happy lives outweigh a few great ones is a separate question about aggregation."
  3.  **Antinatalism / "Life is Suffering":**
      *   *Why cut:* The Asymmetry works even if lives are blissful. Antinatalism relies on the claim that lives are net negative.
      *   *What to say:* "Stipulate: The happy person is *very* happy. We are testing the value of happiness, not the burden of existence."

  ---

  ### 5. The Diagnostic Question

  Do not ask "Do you understand the asymmetry?" They will lie.
  Do not ask "Is the asymmetry true?" They will hedge.

  **Ask this at the very end:**

  > **"Imagine two universes. Universe 1 contains 1 billion happy people. Universe 2 contains 1 billion happy people plus one extra happy person (who doesn't exist in Universe 1). No one in either universe knows about the other.**
  >
  > **If you say Universe 2 is *better*, what happens to the Procreation Asymmetry?**
  > **If you say Universe 2 is *not better*, what happens to the value of Happiness?"**

  **How to grade their answers:**
  *   **The "Nodder" (Failed):** "Universe 2 is better, but you still don't have to create it."
      *   *Diagnosis:* They haven't grasped the link between Axiological Betterness and Deontic Reasons. They are holding the unstable middle position.
  *   **The "Utilitarian" (Failed):** "Universe 2 is better, so the Asymmetry is false."
      *   *Diagnosis:* They understand the conflict but rejected the Asymmetry (which is fine, but they missed the point of the session).
  *   **The "Target" (Success):** "If Universe 2 is not better, then Happiness is not an *impersonal* good. It only matters if there is a subject. The Asymmetry requires us to treat Pain as impersonally bad but Happiness as only relatively good."
      *   *Diagnosis:* They see the theoretical cost. They understand that saving the Asymmetry breaks the symmetry of value.

  ### Summary of the Strategy
  You are not teaching them *that* the asymmetry exists (they already intuit it). You are teaching them *what it costs* to believe it. By forcing the Axiological question ("Is the world better?") before resolving the Deontic one ("Must I do it?"), you prevent them from using the lack of a subject as a shield. They must choose: either Happiness is Impersonally Good (and the Asymmetry falls), or the Asymmetry holds (and Happiness is not Impersonally Good). That is the sharp thing they need to walk out with.
