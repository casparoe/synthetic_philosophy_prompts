  **Normative Dynamics Inc.**
  **Employee Conduct and Norm-Acceptance Policy (v4.2)**

  **1. Core Conative Orientations**
  Normative Dynamics Inc. (the "Company") does not assert moral propositions as factually true. Instead, the Company expresses strong disapproval regarding fraud, harassment, and safety violations.¹ Employees are expected to share this disapproval. When the Company states "Safety is required," this is to be understood as the Company being-for safety-plans.²

  **2. Disciplinary Embeddings**
  In the event that the Company expresses disapproval regarding an employee's conduct, Human Resources shall initiate termination proceedings.³ Specifically, if stealing office supplies is disapproved, then stealing office supplies is grounds for dismissal. Employees must accept that the validity of this conditional does not rely on the truth-apt status of the antecedent, but on the consistency of norm-acceptance.⁴

  **3. Negation and Exceptions**
  It is not the case that the Company disapproves of overtime work during crunch periods.⁵ However, this does not imply the Company expresses approval of overtime, merely the absence of disapproval. Employees seeking to claim an exception must demonstrate that their conduct did not elicit a negative conative state in Compliance, rather than proving the conduct was "permissible."

  **4. Whistleblowing and Second-Order Attitudes**
  Reporting violations is mandatory. A violation is defined as any act towards which the Company holds a negative attitude. Employees who fail to report such acts are subject to second-order disapproval.⁶ Basically, we disapprove of those who do not disapprove of violations. Interview candidates whose integrity is unsure shall be assessed on their willingness to adopt the Company's planning norms, not on their belief in objective wrongness.

  **Legal and Compliance FAQ**

  **Q: Are the values in Section 1 true?**
  A: No. Truth-aptitude is not a feature of this document. These values are commitments.

  **Q: If the values aren't true, why must I follow them?**
  A: Because employment is contingent on norm-acceptance, not belief. See Clause 2.

  **Q: Can I argue that lying is not wrong?**
  A: You may express an alternative attitude, but the Company will still express disapproval regarding your employment.⁷

  **Q: How do I sign the annual attestation?**
  A: By signing, you confirm you share the Company's conative states. Do not sign if you believe morality is objective.

  ***

  **Footnotes**
  ¹ "Disapproval" denotes a motivational state, not a description of reality.
  ² Gibbard-style plan-ladenness applies to all safety protocols.
  ³ This preserves modus ponens within the scope of corporate planning logic.
  ⁴ Schroeder-style "being-for" operators ensure logical consistency across embedded contexts.
  ⁵ Negation is treated as the absence of a conative state, not a contrary fact.
  ⁶ Higher-order attitude enforcement per standard quasi-realist patches.
  ⁷ Disagreement is treated as a clash of attitudes, resolvable via termination.

  ***

  **Author's Note**

  The gag rests on the embedding horn of the Frege-Geach problem: expressivism struggles to explain how moral terms function identically in asserted contexts ("Stealing is wrong") versus embedded contexts ("If stealing is wrong..."). The parody assumes the company cannot enforce conditionals without smuggling in cognitivism, forcing them into awkward legalese ("In the event that the Company expresses disapproval...").

  This is least fair to sophisticated quasi-realists (like Blackburn or Gibbard). They argue logic *does* work for norms, just not via truth-conditions. A real expressivist policy wouldn't need Clause 2's clumsiness; it would simply treat norms as valid within a planning logic. The parody caricatures early, crude expressivism. I'd change my mind if the policy successfully coordinated behavior using a coherent planning logic without ever asserting a moral fact, proving truth-aptitude isn't necessary for enforcement. Currently, the joke assumes it is.
