  The stamp hit the paper with a sound like a gavel closing a coffin. "Denied," said Clerk Halloway, not looking up.

  Arthur sputtered. "He left his trash cans on the curb for three days. It's an eyesore. It's against ordinance twelve."

  "And you left yours out for four days in November of 2021," Halloway said, sliding a printed record across the polished wood. "Registry Rule Four: No public blame without clean hands regarding the specific grievance."

  "That was three years ago!" Arthur hissed. "I've been perfect since."

  "Then you shouldn't fear the Reciprocity Form," Halloway said, finally meeting his eyes. "If you filed, you'd sign agreeing that anyone can blame you for trash violations forever. No appeals. You'd be open season."

  Arthur fell silent. That was the wrinkle. To accuse was to invite. To speak was to bleed. But he hadn't even been allowed to bleed. He was silenced by his own history.

  He found Ben two streets over, hauling a recycling bin back from the curb. The plastic screeched against the pavement.

  "You left them out again," Arthur said, keeping his voice low. Technically, unregistered blame was a misdemeanor, but neighbors rarely reported whispers.

  Ben stopped. He didn't look guilty; he looked annoyed. "You can't do this, Arthur. You know the rules."

  "I know the rules are broken," Arthur said. "You violated the ordinance. That's a fact."

  "It's a fact you have no right to state," Ben replied, leaning on the bin. "You're dirty on this. You've got no standing to say this to me."

  Arthur felt the heat rise in his neck. "Standing? This isn't a court. It's the truth. You made a mess."

  "Maybe," Ben said, shrugging. "But listen closely. There are two things happening here. One: *What I did wasn't wrong.* Two: *You've got no standing to say this to me.* You're trying to argue the first point to overcome the second. They aren't the same."

  "It makes you a hypocrite to enforce a rule you broke!" Arthur shouted, then caught himself, lowering his voice. "It invalidates the blame."

  "No," Ben said softly. "It invalidates *you*. The Registry isn't about whether the trash was left out. It's about whether you're the one who gets to say it. If I admit I was wrong, but you still can't speak, who wins? The town stays quiet. Or maybe it stays fair. Depends on if you think a sinner can spot a sin."

  Ben walked away, leaving Arthur standing in the quiet street. The logic was a knot Arthur couldn't loosen. Was the Registry protecting the community from hypocritical mob justice? Or was it a machine designed to grind down accountability until everyone was too compromised to speak?

  He walked back toward the town square. Through the glass window of the Registry, he saw a woman at Halloway's desk. She was filing a complaint about noise. Halloway checked the ledger, nodded, and slid a form across the desk.

  The woman picked up the pen. She hovered over the Reciprocity clause. *I agree to be blamed for this offense by anyone, indefinitely.*

  Her hand shook. To hold someone accountable, she had to surrender her own immunity. She had to offer up her own future peace as the price for today's justice. She signed, her face pale, looking as though she'd just signed a confession rather than a complaint.

  Arthur watched her walk out into the sunlight, now legally righteous but permanently vulnerable. She looked free, and she looked trapped.

  He thought of his own trash cans, tucked neatly away since 2021. He thought of Ben's bins, screeching on the curb. The town was quiet. The streets were clean. Arthur couldn't tell if that was because everyone was good, or because everyone was afraid to speak without signing their own names in blood.

  He walked home, past his own bins, and said nothing.
