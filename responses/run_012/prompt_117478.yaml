answer: |-
  This is a sharp intuition you have. You are essentially detecting a case of *question-begging by analogy*. Your roommate is using a picture (borders) that already presupposes the conclusion (conventionalism) to convince you of that conclusion.

  Here is the audit you asked for, breaking down the mapping, the breakdowns, and whether the deflationist conclusion survives the wreckage.

  ### 1. The Audit: Mapping the Analogy

  Your roommate is arguing for a view often called **Ontological Deflationism** or **Quantifier Variance** (associated with philosophers like Eli Hirsch or Hilary Putnam). Here is how the "Border Treaty" analogy maps onto the "Special Composition Question" (SCQ):

  | The Border Analogy | The Metaphysical Claim |
  | :--- | :--- |
  | **The Land / Pebbles** | **The Simples** (fundamental atoms/particles). |
  | **France / Germany** | **Composite Objects** (chairs, tables, persons). |
  | **The Border Line** | **The Composition Relation** (what binds parts into a whole). |
  | **The Treaty / Mapmaker** | **Human Conceptual Scheme** (language, interests, practices). |
  | **Drawing the Line** | **Applying the Concept** (deciding when atoms count as a "chair"). |
  | **The Conclusion** | Just as the land exists but "France" is a conventional carving, the atoms exist but "chairs" are conventional carvings. |

  ### 2. Where the Mapping Breaks Down

  There are three major disanalogies. We need to separate the "incidental noise" from the "structural failures."

  **A. The Causal Powers Disanalogy (Structural Failure)**
  *   **Analogy:** A border line has no causal power. If you erase the line on the map, the pebbles don't move. If you walk across the border, nothing physical happens to you.
  *   **Reality:** A chair *does* have causal powers distinct from its atoms scattered randomly. A chair supports weight; scattered atoms do not. A chair breaks in a specific way; scattered atoms do not.
  *   **Why it matters:** If composites were *just* like borders, they would be causally inert. But we explain physical events by referencing chairs ("The chair broke," not "The atoms arranged chairwise separated"). If the "chair" does work that the "atoms" don't explain on their own, the "mere convention" story struggles.

  **B. The Functional Unity Disanalogy (Structural Failure)**
  *   **Analogy:** Borders are arbitrary spatial segments. You can draw a border around a random collection of pebbles and call it "Ruritania."
  *   **Reality:** Chairs are *functional kinds*. Atoms compose a chair only if they are arranged to support sitting. You cannot draw a "chair border" around atoms that are spread across the room.
  *   **Why it matters:** The border analogy suggests composition is *spatial* (drawing a line around what's near). But composition is usually *causal/functional* (binding what works together). This suggests the "line" isn't drawn by us arbitrarily, but is dictated by the physical relations of the atoms themselves.

  **C. The Mind-Independence Disanalogy (Incidental Noise)**
  *   **Analogy:** Without humans, there are no borders.
  *   **Reality:** Without humans, there are no chairs (there are only wood arrangements).
  *   **Why it matters:** This actually *helps* your roommate. If you admit chairs are artifacts, the analogy holds well here. However, the SCQ usually asks about *any* composite (e.g., a rock, or a cat). If there were no humans, would there still be *cats*? The border analogy says "No, that's just land." The realist says "Yes, that's an organism." This is a substantive disagreement, not just an analogy failure.

  ### 3. Which Breakdowns Kill the Conclusion?

  You asked which breakdowns matter for the conclusion (*no fact of the matter; composites are conventional*).

  **The Causal/Functional Breakdown is the killer.**
  The border analogy works only if you assume that "being a chair" is the same kind of fact as "being France." But "being France" is a *status* conferred by agreement. "Being a chair" is a *capacity* conferred by physics.

  If I take the atoms of a chair and scatter them, the "France" (the chair) ceases to exist not because we changed our minds, but because the *causal unity* is broken. The "border" wasn't drawn by a treaty; it was drawn by the forces holding the wood together.

  **Your hunch was correct, but slightly misdiagnosed.**
  You suspected: *"France and Germany have to already be there... before anyone can squabble over their border."*
  Strictly speaking, in the analogy, the *Land* is there, not France. So your roommate would say you're misunderstanding the map.
  **However,** your deeper intuition is right: **The analogy assumes the composite is a *region* rather than a *substance*.**
  By comparing a chair to a country, the roommate is smuggling in the idea that a chair is just "atoms + a label." But if a chair is "atoms + causal unity," then the unity exists independently of the label. The analogy hides the *unity* and focuses only on the *boundary*.

  **Verdict:** The deflationist conclusion does **not** survive this audit intact. The analogy persuades only if you ignore the causal/functional cohesion of composite objects. It argues that *boundaries* are conventional, but it fails to prove that *objects* are merely boundaries.

  ### 4. The "Heap" Line: Does it do better?

  Your roommate's second line (the heap of sand / Sorites paradox) is a different argument.
  *   **The Pitch:** Since one grain doesn't make a heap, "heap" is vague. Since it's vague, it's up to us.
  *   **The Breakdown:** This conflates **Vagueness** with **Conventionality**.
      *   **Vagueness:** There is no sharp cutoff between "heap" and "non-heap."
      *   **Conventionality:** The existence of the heap depends on our say-so.
  *   **Why it fails:** You can believe there is a fact of the matter about the heap, even if we can't pinpoint the exact grain. (This is the *Epistemicist* view: there is a precise number, we just don't know it). Or, you can believe the heap is a real object with vague boundaries (Ontological Vagueness).
  *   **The Trap:** Moving from "we can't draw a precise line" to "there is no object there" is a non-sequitur. A cloud has no precise boundary, but it is not merely a convention; it is water vapor. The heap argument proves *precision* is impossible, not that *existence* is conventional.

  **Verdict:** The heap line trips over the same thing. It assumes that if *we* can't define the boundary precisely, *nature* hasn't defined the object.

  ### 5. A Cleaner Analogy

  If your roommate wants to defend deflationism without relying on the misleading "Border" picture, the standard philosophical alternative is the **Constellation Analogy**.

  **The Analogy:**
  *   **The Stars:** The Simples (atoms).
  *   **The Constellation (Orion):** The Composite Object (chair).
  *   **The Pattern:** The Composition Relation.

  **What it buys:**
  1.  **No New Substance:** A constellation adds no new "stuff" to the universe, just as deflationists claim chairs add no new "stuff" beyond atoms.
  2.  **Interest-Relative:** Orion exists *for us* because we care about navigation/mythology. If humans vanished, the stars remain, but "Orion" disappears. This captures the "conventional" aspect better than borders.
  3.  **No Arbitrary Boundaries:** Unlike the border analogy, constellations acknowledge that the stars are distant and distinct. It doesn't pretend the atoms are fused.

  **What it gives up:**
  1.  **Causal Unity:** Constellations don't *do* anything together. The stars in Orion don't touch or interact. Chairs *do* interact. This analogy inadvertently supports **Nihilism** (no composites exist) rather than **Deflationism** (composites exist but are lightweight).
  2.  **Function:** It fails to capture why *this* arrangement matters (function) vs. *that* arrangement.

  ### Summary for Your Roommate

  You can tell him this:

  > "The border analogy works for **regions**, but chairs aren't regions; they're **functional units**. A border is drawn by a treaty; a chair is 'drawn' by physics (forces holding it together).
  >
  > Your analogy assumes that because the *label* 'chair' is human, the *unity* of the chair is also human. But the atoms hold together whether we label them or not. You've proven that our *categories* are conventional, but you haven't proven that the *objects* falling under them are."

  **Final Verdict:** Your hunch was right. The analogy carries the conclusion only by hiding the physical reality of the composite. Once you expose the disanalogy (causal power vs. political line), the argument for "no fact of the matter" loses its intuitive force. The deflationist conclusion requires more than a metaphor about maps; it requires an argument about why causal unity doesn't count as ontological reality.
