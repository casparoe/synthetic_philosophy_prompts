      *   *Connection to SCQ:* The SCQ isn't just about vagueness (how many atoms?), it's about *ontology* (do composites exist at all?). The heap argument addresses *boundaries*, not *existence*. You can have a vague object that still exists.
      *   *Verdict:* The heap argument supports *vagueness*, not necessarily *deflationism about existence*. It's a category error to move from "vague boundaries" to "no fact of the matter about existence."

