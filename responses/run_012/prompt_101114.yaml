answer: |-
  The nearest established concept is **Persuasive Definition** (Stevenson). Like your case, it alters a term's meaning to influence judgment. However, Stevenson focuses on shifting *emotional attitudes* (e.g., defining "culture" to imply refinement), whereas your example targets *practical licensing* (donation vs. safety) while masking the stipulation as objective discovery.

  **Reification** is also relevant: treating an abstract choice as a concrete fact. Yet reification usually concerns ontological status, not the retroactive selection of criteria to secure a specific verdict.

  Since no single term captures the "outcome-first, nature-second" masking, I propose **Motivated Essentialism**.

  **Definition:** The rhetorical move of selecting a defining criterion for a concept based on desired normative outcomes, then defending that criterion as an objective feature of the thing's essence.

  **Boundary Cases:**
  1.  *Distinct from Explication:* Explication admits the stipulation is pragmatic; Motivated Essentialism conceals it as descriptive.
  2.  *Distinct from Lying:* The agent may sincerely believe the criterion is natural after selecting it (self-deception).
  3.  *Distinct from Persuasive Definition:* The goal is regulatory permission, not emotional valence.

  This fits your death argument: the "essence" of death was chosen to permit donation or preserve safety, then reified as biological fact. It appears frequently in bioethics (personhood) and law (corporate personhood), where normative stakes drive conceptual boundaries that are subsequently presented as natural discoveries.
