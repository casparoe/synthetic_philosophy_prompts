answer: |-
  1. First, define the incident outcome narrowly enough to distinguish it from normal operations, then list every abnormal condition or deviation from standard practice present before the event. Second, ask whether removing each condition prevents this specific outcome and whether manipulating it would alter the outcome while holding upstream factors constant.

  2. A factor is a cause if manipulating it changes the outcome, even if removing it alone does not prevent the outcome due to redundant failures. Stop recording a factor as a cause only if it is a ubiquitous background condition applicable to all operations or if the factor remained static and compliant with safety standards throughout the system's history.

  3. Prioritize the manipulation test for identifying active failures, but classify historical design choices as causes if they function as active constraints on current safety interventions regardless of manipulability. Hand the decision to the review panel when determining causation requires weighing the economic feasibility of remediation against the moral obligation to prevent harm.

  4. In the pressure vessel case, list both the plastic sheet and the seized valve as causes because manipulating either would have prevented the rupture despite their independent sufficiency. In the conveyor case, list the missing guard as a cause because installing it is a valid intervention that changes the outcome, regardless of how long the absence persisted without incident.

  5. In the design flaw case, list the dead leg as a cause because it is the largest lever for prevention, even if current management cannot manipulate it without higher approval. This procedure cannot determine who pays for the remediation or force a capital redesign that exceeds the employer's immediate statutory authority.
