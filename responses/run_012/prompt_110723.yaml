answer: |-
  Here is a plan for an 80-minute session designed to dismantle the monolithic view of collapse and replace it with a diagnostic toolkit.

  ### 1. The Pedagogical Sequence: What Must Come First
  You cannot introduce the three-sense distinction (Demographic, Institutional, Complexity) until the students feel the *pain* of their current definition failing. If you give them the taxonomy first, they will treat it as a vocabulary list to memorize, not a lens to see with.

  **The Order of Operations:**
  1.  **Elicit the Mental Model (15 mins):** Make their undifferentiated view explicit on the board.
  2.  **The Anomaly Case (25 mins):** Present a case that breaks their model *before* you give them the words to explain why.
  3.  **The Taxonomy (20 mins):** Introduce the three senses as the tool needed to resolve the anomaly.
  4.  **The Adaptive Cycle (15 mins):** Reframe the taxonomy within a temporal loop.
  5.  **Assessment (5 mins):** The diagnostic question.

  **Why this order?** The three-sense distinction only registers as a clarification if it solves a puzzle. If you define "Institutional Collapse" before they believe institutions can fall without people dying, the definition is abstract. The Case Study creates the cognitive dissonance; the Taxonomy resolves it.

  ### 2. The Single Case: The Khmer Empire (Angkor)
  **Do not use Easter Island.** Do not use Rome (too much baggage). Do not use the Maya (reserved for later).
  **Use Angkor (9th–15th Century CE).**

  **Why Angkor earns its place:**
  *   **It isolates Complexity:** Angkor is the archetype of a "Hydraulic City." Its complexity is physical and visible (canals, reservoirs, temples). This makes "shedding complexity" concrete (the water network fails) rather than abstract (bureaucracy fades).
  *   **It decouples Demography from Institutions:** The popular myth is "The Lost City of the Jungle" (everyone died/vanished). The historical reality is that the *capital* was abandoned and the *state apparatus* fractured, but the *population* remained in the region, transitioning to smaller, decentralized settlements and continuing Theravada Buddhist practices. It is a perfect example of Institutional/Complexity collapse without Demographic collapse.
  *   **It fits the Adaptive Cycle:** The failure of the water network is a textbook example of a system becoming too rigid in the "Conservation" phase, leading to "Release" (abandonment of the capital) and "Reorganization" (shift to riverine trade cities like Phnom Penh).

  **What the case MUST contain:**
  *   **Visuals of the hydraulic network:** Show the scale of the water management (the "complexity").
  *   **Evidence of continuity:** Show inscriptions or archaeological data indicating people lived in the region *after* the capital was abandoned.
  *   **The "Shift":** Emphasize that the center of gravity moved, it did not vanish.

  **What the case MUST NOT contain:**
  *   **Causal debates:** Do not spend time arguing whether it was drought, war, or religious change. That is for later weeks. Here, the *outcome* is the data, not the *cause*.
  *   **Moral judgment:** Do not frame the abandonment as a "failure" or "tragedy." Frame it as a "reorganization."
  *   **Comparison to Maya:** Do not let students drift into "Is this like the Maya?" Shut that down. This session is about the *instrument*, not the *comparison*.

  ### 3. Mapping Misconceptions to the Sequence
  You identified three specific misconceptions. Here is where and how to kill them.

  **A. "Collapse = Disappearance" (Demographic Erasure)**
  *   **Where to kill it:** During the **Case Study (Minute 20-30)**.
  *   **How:** When you reveal that Cambodians did not vanish, but rather stopped building giant temples and moved downriver, you create the gap their definition cannot fill.
  *   **Why here:** If you don't kill this first, the "Demographic vs. Institutional" distinction later will seem like splitting hairs. They need to see the bodies are still there before they care about the state that ruled them.

  **B. "Collapse = Sudden" (Catastrophe Event)**
  *   **Where to kill it:** During the **Adaptive Cycle (Minute 55-65)**.
  *   **How:** When mapping Angkor to the cycle, show that the "Release" phase (what looks like collapse) was the result of a long "Conservation" phase (rigid infrastructure). The "collapse" was a transition speed, not an instant event.
  *   **Why here:** The taxonomy distinguishes *what* falls; the Cycle distinguishes *how* it falls over time.

  **C. "Collapse = Moral/Overshoot" (Hubris/Punishment)**
  *   **Where to kill it:** **Explicit Exclusion (Minute 10 & 70).**
  *   **How:** You cannot repair this with the taxonomy; the taxonomy is neutral. You must explicitly bracket it. In the opening, write "Hubris/Overshoot" on the board as part of *their* definition. In the closing, explicitly state: "Today we have built a diagnostic tool, not a moral scale. We are not asking if they 'deserved' to fall, but what actually fell."
  *   **Why here:** If you leave the moral judgment active, students will use the three senses to assign blame (e.g., "They had Institutional collapse because they were corrupt"). You must neutralize the moral lens for the analytical lens to work.

  ### 4. What to Leave Out (And Say So)
  To keep the instrument sharp, you must explicitly exclude two things. Tell the students you are doing this so they don't think you are ignoring the "big questions."

  1.  **Causality:** "We are not asking *why* Angkor changed today. We are asking *what* changed. Was it the people? The government? The buildings? We will spend the rest of the semester on 'why.' Today is only on 'what'."
  2.  **Normativity (Good/Bad):** "We are not deciding if this was 'bad.' For a peasant, the fall of the state might mean lower taxes and less conscription. 'Collapse' for the state might be 'Relief' for the farmer. We are describing the transition, not judging it."

  ### 5. The Session Plan (80 Minutes)

  **0:00 – 0:15 | Elicitation: The Monster Under the Bed**
  *   **Activity:** Do not lecture. Put the word **COLLAPSE** on the board.
  *   **Prompt:** "Write down the first three things that come to mind when you hear 'civilizational collapse.' Then, turn to a partner and agree on a one-sentence definition."
  *   **Debrief:** Collect definitions. You will hear "Everyone dies," "Sudden," "War/Drought," "Hubris." Write these on the left side of the board. Label this column **"The Folk Model."**
  *   **Goal:** Make their undifferentiated confidence visible.

  **0:15 – 0:40 | The Case: Angkor (Myth vs. Evidence)**
  *   **Narrative Arc:**
      1.  **The Myth (5 mins):** Show the romanticized images of temples swallowed by jungle. Recite the "Lost Civilization" narrative.
      2.  **The Data (15 mins):** Present the counter-evidence.
          *   *Institutional:* The King stops issuing inscriptions; the central tax network fails.
          *   *Complexity:* The massive reservoirs (barays) are no longer maintained; the stone temples stop being built.
          *   *Demographic:* Archaeological soil samples show continuous occupation; wooden housing (which decays, unlike stone) persists; the population shifts to the Mekong riverbanks.
      3.  **The Puzzle (5 mins):** Ask: "If the people are still there, and they are still farming, and they are still Buddhist... what exactly collapsed?"
  *   **Goal:** Create the cognitive dissonance. Their "Folk Model" cannot explain this.

  **0:40 – 1:00 | The Taxonomy: The Three Senses**
  *   **Instruction:** Introduce the three categories as the solution to the Angkor puzzle.
      1.  **Demographic:** Did the people die or leave? (Angkor: No).
      2.  **Institutional:** Did the political authority lose monopoly on force/legitimacy? (Angkor: Yes).
      3.  **Complexity:** Did the society shed energy-intensive layers (monuments, bureaucracy, specialization)? (Angkor: Yes).
  *   **Activity:** Have students map the Angkor evidence to these three buckets on a handout.
  *   **Key Point:** Emphasize that these usually happen together, but *not always*. The analytical power lies in the exceptions.

  **1:00 – 1:15 | The Adaptive Cycle: Reframing "Release"**
  *   **Instruction:** Draw the loop (Growth -> Conservation -> Release -> Reorganization).
  *   **Application:** Map Angkor.
      *   *Growth:* Expansion of the empire.
      *   *Conservation:* The rigid hydraulic network (efficient but brittle).
      *   *Release:* The abandonment of the capital (looks like collapse).
      *   *Reorganization:* The shift to riverine trade states (new form, same people).
  *   **Conceptual Shift:** Ask: "Is 'Release' a death, or a shedding of skin?" Connect this to the "Moral" exclusion. In ecology, release is necessary for renewal. Is it in history?

  **1:15 – 1:20 | Assessment: The Diagnostic Question**
  *   **The Question:** Do not ask them to define the terms. Ask them to apply the distinction to a hypothetical or future scenario.
  *   **Prompt:** "Imagine a modern nation where the central government dissolves and the currency becomes worthless, but the local communities continue to trade, feed themselves, and maintain order without violence. Using today's framework: Is this a collapse? If so, which kind? And using the Adaptive Cycle, what phase might follow?"
  *   **Success Criteria:** You are looking for them to say "Institutional/Complexity collapse, but not Demographic," and to identify the next phase as "Reorganization" rather than "Extinction." If they say "Yes, it's a collapse because the government is gone," they missed the distinction. If they say "No, it's not a collapse because people are alive," they missed the Complexity/Institutional dimension. You want the *both/and*.

  ### 6. Final Note on Tone
  Your role in this session is not to be the authority on Angkor, but the authority on the *instrument*. If a student challenges a detail about Angkor, defer it: "That's a historical question for later weeks. For today, assume the data I gave you is accurate and test the *tool* against it." This keeps the focus on the conceptual framework, which is the actual learning objective.
