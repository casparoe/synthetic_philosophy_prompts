answer: |-
  # JOINT STATEMENT ON THE ONTOLOGY OF SOCIAL KINDS

  **Signatories:** The Deflationist Camp (DC) & The Robust Realist Camp (RR)
  **Date:** October 2023
  **Subject:** Clarifying the status of socially constructed kinds (Race, Gender, Money)

  ## I. AGREED CLAIMS

  1.  **Definition of Social Construction:** Both camps agree that a kind $K$ is "socially constructed" if and only if the existence and persistence conditions of $K$ depend essentially on collective human attitudes, practices, or representations. If all humans vanished, $K$ would cease to exist.
  2.  **Criteria for Causal Efficacy:** Both camps agree that for a kind to be practically significant, it must participate in causal relationships. It must be possible to say "X happened *because* of $K$" without engaging in fiction.
  3.  **Ontological Dependence:** Both camps agree that social kinds are ontologically dependent on human minds. Unlike electrons or tectonic plates, social kinds do not exist independently of mental states (beliefs, intentions, acceptances) held by a population.
  4.  **Money:**
      *   **Agreement:** Money functions as a medium of exchange only within a system of collective acceptance. A dollar bill has no intrinsic nutritional or shelter value.
      *   **Agreement:** An individual cannot unilaterally decide that a leaf is money and successfully purchase bread, even if they personally believe it is. The constraint is external to the individual.
  5.  **Race:**
      *   **Agreement:** There is no biological essence or genetic cluster that corresponds perfectly to folk racial categories. Biological race (in the strong taxonomic sense) does not exist.
      *   **Agreement:** Racial categorization produces severe, measurable, and objective differences in life outcomes (health, wealth, incarceration) via social mechanisms (discrimination, segregation, stereotype threat).
  6.  **Gender:**
      *   **Agreement:** Gender is distinct from biological sex. Gender categories are sustained by normative social expectations and performative practices.
      *   **Agreement:** Gender categories exert a coercive force on individuals. One can be punished (socially or physically) for failing to align with the gender assigned to them by their community, regardless of their internal self-conception.
  7.  **The Illusion of Solipsism:** Both camps reject the notion that because social kinds depend on minds, they are "just in your head" or easily changed by individual will. The dependence is on *collective* intentionality, which is resistant to individual alteration.

  ## II. RESIDUAL DISAGREEMENTS

  *The following positions are stated in the voice of each camp, steelmanned to avoid caricature.*

  | Topic | The Deflationist Camp (DC) Position | The Robust Realist Camp (RR) Position |
  | :--- | :--- | :--- |
  | **The Term "Real"** | We should reserve the term "real" for things that exist independently of human representation (mind-independent). Calling social kinds "real" conflates the map with the territory and invites the error of reification (treating a concept as a physical object). | We must use the term "real" for anything that exerts causal force and resists our will. To call money or race "unreal" or "mere constructions" is to deny the suffering they cause. "Real" means "causally potent," not "mind-independent." |
  | **Reductionism** | Social facts are *nothing over and above* the aggregate of individual psychological states and behavioral dispositions. There is no emergent ontological layer; there are only people acting as if $K$ exists. | Social facts are *emergent institutional facts*. While grounded in individual attitudes, they constitute a distinct ontological layer with downward causal power. The system constrains the individuals that constitute it. |
  | **Scientific Status** | Social kinds are pragmatic tools for navigation, not natural joints. Science should aim to *eliminate* reliance on these categories where possible (e.g., replacing race with genetics + socioeconomic status). | Social kinds are legitimate objects of social science. We can formulate law-like generalizations about them. Science should aim to *explain* the mechanisms of these categories, not eliminate the categories themselves. |

  ## III. THE CRUXES

  *These are the sub-questions where settling the matter would move at least one side toward the other. For each, we identify a concrete case and record each camp's interpretive prediction.*

  ### Crux 1: The Constraint of the Unbeliever
  **Question:** Can a kind be ontologically dependent on collective acceptance while simultaneously constraining an individual who *rejects* that acceptance? Is this constraint "hard" enough to warrant the label "reality"?

  *   **Concrete Case:** **The Ideological Hermit.** An individual explicitly rejects the validity of money (believes it is a scam) and attempts to live within a capitalist city without using it. They are arrested for trespassing or starvation ensues.
  *   **DC Prediction:** This demonstrates the *power of other people's beliefs*, not the reality of money. The constraint is reducible to the threat of violence from *other* agents who believe in money. The "system" is a shorthand for "a lot of armed individuals who share a belief."
  *   **RR Prediction:** This demonstrates *institutional reality*. The constraint operates even if the arresting officers are merely following procedure without personal belief. The "system" has an emergent causal power that is distinct from the sum of individual psychologies.
  *   **Reconciliation Condition:** If DC admits that "aggregate beliefs functioning as an external constraint" is sufficient for a robust definition of "real," the dispute dissolves.

  ### Crux 2: Induction and Explanation
  **Question:** Do social kinds support induction and explanation in the same way natural kinds do, or are they merely proxies for underlying causal mechanisms?

  *   **Concrete Case:** **Medical Epidemiology.** A study shows that "Black women" have significantly higher maternal mortality rates than "White women," even controlling for income and education.
  *   **DC Prediction:** "Race" is a proxy. The true causal drivers are unmeasured variables (provider bias, environmental stress, epigenetic factors). Using "Race" in the explanation is a placeholder for ignorance. We should seek the *real* causes (bias, cortisol, etc.) and discard the racial category in the final model.
  *   **RR Prediction:** "Race" is the cause. "Being racialized as Black" is a specific social position that exposes the subject to a unique cluster of causal forces. You cannot explain the outcome by removing race, because the cluster of forces *is* the phenomenon of race. It supports induction within the social domain.
  *   **Reconciliation Condition:** If RR admits that social kinds are "real but derivative" (real mechanisms, but derived from social history), and DC admits that "derivative mechanisms" are legitimate objects of scientific explanation, the dispute dissolves.

  ## IV. ANALYSIS OF VERBAL DISPUTE

  **Diagnosis:** The core dispute is primarily verbal, centering on the definition of the predicate **"Real."**

  1.  **Semantic Divergence:**
      *   **DC** operates with a **Metaphysical Definition**: $X$ is Real $\iff$ $X$ exists independently of human minds. (Under this definition, social kinds are *not* Real).
      *   **RR** operates with a **Pragmatic/Causal Definition**: $X$ is Real $\iff$ $X$ exerts causal influence and resists individual will. (Under this definition, social kinds *are* Real).

  2.  **Evidence of Verbality:**
      *   Both camps agree on all empirical claims (money buys bread; race affects health; gender constrains behavior).
      *   Both camps agree on the dependence relation (all require human practices).
      *   Neither camp believes these phenomena are illusions in the sense of "hallucinations."
      *   The disagreement arises only when assigning the label "Real" to the agreed-upon phenomena.

  3.  **Substantive Remnant:**
      *   A minor substantive disagreement remains regarding **Emergence**. RR posits that social structures have causal powers *irreducible* to individual psychology. DC posits that all social causation is *reducible* to individual psychology + interaction.
      *   *However*, this is often a disagreement about modeling convenience rather than ontology. If DC admits that "reducible" patterns can still be "stable and law-like," and RR admits that "emergent" does not mean "magical," this remnant shrinks significantly.

  **Conclusion:** The camps are describing the same territory using different map keys. The Deflationist warns against confusing social rules with physical laws. The Realist warns against dismissing social rules as "just opinions." Both warnings are correct. The dispute is 90% verbal, contingent on whether the community prioritizes metaphysical purity (DC) or causal recognition (RR) in its terminology.

  ***

  **Signed,**

  *The Deflationist Camp*
  *The Robust Realist Camp*
