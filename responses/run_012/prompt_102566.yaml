  # THE NARRATIVE SELF: A DIAGNOSTIC TREE

  **1. Consider a creature with no autobiographical thread at all, living entirely in the present. Does this creature lack a self entirely?**
  *   **YES** (Narrative is Constitutive) → Go to **2**.
  *   **NO** (Narrative is Contingent) → Go to **6**.

  **2. Consider a person whose story is accurate but who rejects it as not theirs. Is the story still true of their self?**
  *   **YES** → **NARRATIVE REALISM**
      *   *The self exists independently of the subject's own endorsement of their story.*
  *   **NO** (Endorsement Required) → Go to **3**.

  **3. Consider a person whose life-story is periodically rewritten by an external editor and who accepts the new version. Is there a specific agent who authors the self?**
  *   **NO** (Impersonal Process) → **FICTIONALIST GRAVITY**
      *   *The self is a useful abstraction generated by a process with no actual author.*
  *   **YES** (Specific Agent) → Go to **4**.

  **4. Is the author the external editor rather than the person?**
  *   **NO** (Person Authorizes) → **AUTONOMIST CONSTRUCTIVISM**
      *   *Selfhood depends on an endorsement that may be produced by external manipulation.*
  *   **YES** (Editor Authors) → Go to **5**.

  **5. Consider two bodies narrating a single shared life. Do they constitute one self?**
  *   **YES** → **COLLECTIVE CONSTRUCTION**
      *   *Individual bodies are not the necessary boundaries of a single person.*
  *   **NO** → **SOCIAL ROLE DETERMINISM**
      *   *The community defines the self even when no shared life exists between members.*

  **6. Consider one body housing two complete and mutually unaware life-stories. Are there two selves?**
  *   **YES** → **PSYCHOLOGICAL PLURALISM**
      *   *One living organism can house multiple distinct persons simultaneously.*
  *   **NO** (One Self per Body) → Go to **7**.

  **7. Consider a community that maintains an official biography its members are expected to enact, including a member who privately disowns it. Is the official biography true of their self?**
  *   **YES** → **REGULATIVE IDEALISM**
      *   *You are the self you ought to be, not necessarily the one you feel you are.*
  *   **NO** → **BIOLOGICAL ANIMALISM**
      *   *The self is merely the living organism regardless of story or social role.*

  ***

  **TECHNICAL NOTES ON LOGICAL SPACE**
  *   **Indistinguishability:** *Social Role Determinism* and *Regulative Idealism* are structurally similar (community authority) but distinct here based on Node 1 (whether narrative is required for existence). In practice, proponents often slide between these positions without noticing the ontological shift.
  *   **Empty Combinations:** No combinations proved strictly incoherent. However, *Autonomist Constructivism* (Node 4) is unstable: if the editor writes the story, claiming the person authors it via "acceptance" risks collapsing back into *Fictionalist Gravity* (if acceptance is automatic) or *Narrative Realism* (if acceptance tracks truth).
  *   **Unexplored Space:** The branch allowing *Collective Construction* (Node 5) while denying *Narrative Constitutivity* (Node 1) is rarely occupied; most collective views insist narrative is necessary for shared agency.
