answer: |-
  **Project Title:** The Ex Ante/Ex Post Asymmetry in Moral Uncertainty for Artificial Agents

  **Project Summary**
  When an artificial agent acts under moral uncertainty, the standards for deciding what to do and the standards for explaining what was done pull in opposite directions. Current decision rules for agents holding credences over competing moral theories are exclusively *ex ante*: they specify how to choose given a probability distribution over theories, typically by maximizing expected choiceworthiness or satisfying variance-sensitive constraints. These rules are designed for private rationality. However, the demands placed on deployed systems by hospitals, regulators, and harmed parties are *ex post*: they require that the specific basis for an action be recoverable and contestable after the fact. My central suspicion is that the aggregation required to make a decision rational under uncertainty is precisely what renders the resulting choice unanswerable to external scrutiny. If a system acts on a weighted compromise between incompatible theories, no single theory's justification supports the action, yet the aggregate justification is opaque to those who do not share the system's credences.

  **Research Question**
  This project seeks to resolve a determinate question: Given a machine that must choose among actions while holding credences over a set of moral theories, does there exist a decision procedure that is both (1) *ex ante* rational under some defensible set of constraints on acting under moral uncertainty, and (2) *ex post* answerable, in the sense that for any action taken, the considerations that actually drove the choice are recoverable by an affected party and are of a kind that party could in principle dispute?

  This formulation allows for three distinct outcomes: a proof of existence (yes), a proof of impossibility (no), or a conditional existence proof showing that answerability requires weakening rationality constraints (yes-if).

  **Intellectual Context**
  Existing literature leaves this question open because the relevant fields talk past one another. The philosophical discussion on moral uncertainty is written for a single agent reasoning in private. Its primary constraint is decision-theoretic rationality; it asks what an agent owes to its own credences, not what it owes to those affected by its choices. Consequently, it treats the decision rule as a black box that outputs a verdict based on internal weights. Conversely, the engineering and legal discussion on accountability is written about outcomes and their causes. It takes the decision rule for granted and asks only whether an output can be explained causally or counterfactually. It assumes that if you can show which input features triggered the output, you have satisfied accountability. The gap sits between these two: even if we can explain which features triggered the output, we cannot explain *why those features mattered* if the weighting scheme itself aggregates incommensurable values. A patient harmed by a triage algorithm does not just need to know that "score X exceeded threshold Y"; they need to know whether that threshold reflects a utilitarian calculation, a rights-based constraint, or a probabilistic compromise between the two.

  **Methodology**
  The method is analytic and formal rather than empirical. I will not run experiments or survey practitioners. Instead, I will characterize *ex ante* rationality and *ex post* answerability as formal constraints on a decision procedure.
  1.  **Formalization:** Define *ex ante* rationality using standard constraints from the moral uncertainty literature (e.g., dominance principles, expected choiceworthiness) and *ex post* answerability as a requirement for "reason-recoverability" (the ability to map an action back to a single justificatory theory rather than a weighted sum).
  2.  **Analysis:** I will test candidate decision rules against these constraints. For each rule (e.g., maximizing expected choiceworthiness, acting on the most credible theory, or satisfying a veto constraint), I will locate exactly where it forfeits contestability.
  3.  **Synthesis:** I will look for a representation theorem showing compatibility or an impossibility result showing tension. Where neither is available, I will construct case studies demonstrating the trade-off.

  **Outcomes and Evaluation**
  Success is defined in two ways. Positive success is an explicit construction of a procedure meeting both requirements. Negative success is a sharp statement of the trade-off, proving that satisfying *ex ante* rationality under uncertainty necessarily degrades *ex post* answerability, together with a specification of what must be surrendered (e.g., agents must act on a single theory to be accountable, even if doing so is irrational given their credences).

  Failure is also defined in advance: the tension may dissolve once the requirements are stated carefully. For instance, it may turn out that a system that simply publishes its credences and the decision-relevant comparisons it made is already fully answerable, rendering the asymmetry illusory. In this case, the honest result is a short negative paper stating exactly that. This is a valid outcome, as it prevents future work from chasing a phantom problem.

  **Timeline (Six Months, ~1 Day/Week)**
  *   **Month 1:** Formalize the definitions of *ex ante* rationality and *ex post* answerability. Refine the constraints to ensure they are mutually exclusive only if necessary.
  *   **Month 2:** Analyze the "Expected Choiceworthiness" model. Draft the argument for why aggregation obscures contestability.
  *   **Month 3:** Analyze alternative models (e.g., "My Favorite Theory" approaches, veto-based schemes). Compare their answerability profiles.
  *   **Month 4:** Attempt the impossibility proof or construction. If the proof stalls, pivot to documenting the specific trade-offs identified in Months 2-3.
  *   **Month 5:** Draft the working paper (approx. 6,000 words). Focus on clarity for the mixed panel audience.
  *   **Month 6:** Revise and finalize. Circulate to the technology-and-ethics group for feedback before submission.

  **Scope and Risks**
  This is a philosophical project, not an engineering one. It does not propose building a system or auditing an existing model. Its deliverable is conceptual coherence: determining whether the concepts we use to justify AI decisions are compatible with the concepts we use to design them. The risk of scope creep lies in the formalization. Attempting to produce a rigorous impossibility theorem could easily exceed the available time (roughly 24 work days total). If the formal proof becomes intractable, I will pivot to a rigorous conceptual argument using structured case studies, which still satisfies the goal of locating the tension. Conversely, there is a risk of drifting into empirical AI safety; I will avoid this by strictly limiting the scope to the logic of justification rather than the mechanics of implementation. The goal is not to make AI safer directly, but to clarify whether our current ethical frameworks for AI are internally consistent.
