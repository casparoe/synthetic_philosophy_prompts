      *   **Move 5: Owen's Closing Charge.**
          *   *Argument:* Reduces doctrine to pronoun usage. Trivial or absurd. Predicts finding oneself among survivors of *every* improbable thing. Bomb victim is immortal if a vanishing branch exists.
