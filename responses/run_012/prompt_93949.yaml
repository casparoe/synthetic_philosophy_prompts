      *   *What are they missing?* The distinction between *ontological* existence of branches and *epistemic* probability assigned to them. Also, the decision-theoretic approach (Deutsch/Wallace) which tries to derive the Born Rule from rational betting, which might save QI from Owen's weight objection.
