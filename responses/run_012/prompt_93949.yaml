          *   *Argument:* In Many-Worlds (MWI/no-collapse), all outcomes happen. She only exists in branches where she survives. Therefore, she never experiences death. This exposes single-world collapse as a fiction.
          *   *Analysis:* This is the standard formulation of QS. It relies on the premise that subjective experience tracks *only* surviving branches. It assumes personal identity persists across branching if a survivor exists.
          *   *Verdict:* Defensible within MWI framework, but assumes the conclusion (that subjective probability = branch count/existence rather than weight). It's the core axiom of QI, not necessarily a proof.

      *   **Move 2: Owen's Reply (Part 1 - "Too Little").**
          *   *Argument:* Survivor bias exists in single-world/classical contexts too (I never experience my own death). Therefore, QS doesn't distinguish MWI from Collapse/Classical. It's a selection effect.
          *   *Analysis:* This is the standard "Anthropic Principle" objection. In a single world, I don't experience death because I'm dead. In MWI, I don't experience death because I'm in the living branch. The *phenomenology* is identical. QS is supposed to distinguish them by predicting I *should* expect to survive improbable events in MWI, whereas in Single-World I should expect to die. Owen argues the first-person report is the same.
          *   *Verdict:* Strong point. The first-person data ("I am alive") is consistent with both theories *after the fact*. The predictive power is the contention.

      *   **Move 3: Owen's Reply (Part 2 - "Too Much").**
          *   *Argument:* Branch weight decreases exponentially. Survival becomes increasingly improbable. QI claims "immortality," but the measure of existence drops to zero.
          *   *Analysis:* This targets the "Measure Problem" in MWI. If probability is defined by Born Rule weights, the probability of surviving $n$ rounds goes to 0. QI proponents argue weight $\neq$ probability of experience. Owen argues weight $\to$ 0 means you become "increasingly improbable rather than increasingly deathless."
          *   *Verdict:* Very strong. This is the technical crux. If the Born Rule holds, the "immortal" branch has negligible measure.

