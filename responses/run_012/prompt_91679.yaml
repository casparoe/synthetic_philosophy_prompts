  8.  **Self-Correction/Nuance Check:**
      *   *Statute:* "Union of two persons." Does "Union" imply merging? Precedent 2 (different continents) suggests physical merging isn't needed. Precedent 1 (pension pooling) suggests economic merging is sufficient but maybe not necessary.
      *   *Precedent 4:* This is the trickiest. It refused a 3-person union. It *could* have said "Statute says 2." It chose to say "Pressure/Lack of care." This implies the Commission is willing to look past statutory text to focus on the *quality* of the relationship. This strengthens the "Functional Interdependence" rule.
      *   *Current Case:* Asexual men. 10 years. Exclusive. Care.
