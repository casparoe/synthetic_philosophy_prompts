          *   *Case:* A couple who intends to stay married for life (Intent = Yes) but has zero interdependence/care (Substance = No). E.g., a "silent pact" to remain legally married for tax reasons but live as strangers.
          *   Precedent 3 refused fraud (Intent = No). This new case has Intent = Yes.
