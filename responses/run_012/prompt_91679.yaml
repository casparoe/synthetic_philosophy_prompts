      *   *Ruling:* Recognize the marriage.
      *   *Reasoning:* Precedent 1 is the strongest analog. It explicitly decoupled marriage from sex/romance. Precedent 3 distinguishes based on *intent* (fraud vs. genuine), not *capacity for sex*.

  6.  **Identifying the "Further Case" (The Distinguisher):**
      *   I need a hypothetical case that would test the boundaries of the rules identified above.
