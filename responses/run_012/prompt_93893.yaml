answer: |-
  This is a remarkably sharp set of intuitions. You have correctly identified that insolvency law is not a monolith of fairness but a layered architecture where different principles apply at different stages. You are also right to be suspicious of the metaphysics of the "claim."

  Here is a breakdown of the presuppositions, the bargaining models, and what the "floor" in your mediation clinic reveals about the underlying theory of justice.

  ### 1. The Division of Labour: Priority vs. Pro Rata
  You asked whether the hybrid structure (priority rules + pro rata distribution) is a sensible division of labour or incompatible views stacked together.

  It is a **sensible division of labour**, provided you accept a specific theory of *status equality*.
  *   **Priority Rules (Secured, Tax, Employees):** These are not primarily about fairness *between creditors*; they are about external policy goals. Secured credit lowers the cost of capital (efficiency); employee/tax priority is social welfare policy (protection of the vulnerable/state). These rules determine *who is in the room*.
  *   **Pro Rata (Pari Passu):** This rule applies only *after* status has been sorted. Its presupposition is: "Among creditors of the *same legal status*, the only relevant differentiating factor is the size of the legal entitlement."

  **The Presupposition:** The rule presupposes that the *claim size* is the correct metric of desert, not the *creditor's identity* or *need*. It treats the claim as a property right. If I own a right to \$1M and you own a right to \$100k, and the debtor only has \$400k, the law views the loss as a shared shrinkage of the *estate*, not a redistribution of wealth between us.
  *   **Is it underdetermined?** Yes. Utilitarians might support it for administrative ease (low transaction costs). Contractarians might support it as the ex-ante rule creditors would agree to. But the *internal* logic is deontological: it respects the pre-existing proportionality of rights.

  ### 2. Bargaining Models: KS vs. Nash and the Metaphysics of Claims
  You are correct that the **Kalai-Smorodinsky (KS)** solution is the formal isomorph of the pro rata rule in a bankruptcy context.
  *   **KS Logic:** Equalize the ratio of *actual gain* to *maximum possible gain*.
      *   Disagreement point ($d$) = 0.
      *   Ideal point ($I$) = Claim Size ($C_i$).
      *   KS requires: $\frac{x_i - 0}{C_i - 0} = \frac{x_j - 0}{C_j - 0}$.
      *   This simplifies to $\frac{x_i}{C_i} = \frac{x_j}{C_j}$, which is exactly **pro rata**.
  *   **Nash Logic:** Maximize the product of gains $(x_i - d_i)$. If $d=0$ and utility is linear in money, Nash yields **equal division** ($x_i = x_j$), not pro rata. To get pro rata from Nash, you have to weight the utility functions by the claim size, which begs the question.

  **The Metaphysics: Fact vs. Move**
  This is your strongest insight. In bargaining theory, the "ideal point" is often a strategic demand (a move). In insolvency, the "claim" is an adjudicated fact (an entitlement).
  *   **Does the rule depend on the claim being a fact?** **Yes, absolutely.** The pro rata rule is epistemically fragile. It presupposes a **verification mechanism** (the "proof of claim" process) that converts strategic moves into fixed facts *before* the distribution algorithm runs.
  *   **What if claims are gameable?** If a creditor can inflate their claim without penalty, the KS/Pro Rata solution collapses. It becomes a race to inflate, destroying the estate in litigation costs.
  *   **The Fairness Story:** The fairness of pro rata relies on the **legitimacy of the verification process**. If the court cannot distinguish a real \$1M claim from a fake \$10M claim, the "equal fraction" rule becomes a tool for fraud. Therefore, the rule presupposes not just a view of fairness, but a **functional state capacity** to adjudicate entitlements ex-post.

  ### 3. The "Floor" and What "Treated Alike" Means
  Your mediation clinic's rule (Flat Minimum + Pro Rata) is a devastating critique of the pure "equal fraction" theory.
  *   **The Math:** If everyone gets \$5k first, then the rest is split pro rata, the small claimant gets a higher *percentage* recovery than the large claimant.
  *   **The Justification:** "Claimants are treated alike."
  *   **The Revelation:** This reveals that "treated alike" does not mean "same mathematical formula." It means **"same significance of outcome."**

  **Theoretical Shift:**
  1.  **From Proportionality to Sufficientarianism:** The floor implies a belief that there is a *minimum threshold* of recovery required for a creditor to remain a viable participant (or to satisfy basic needs, if the creditors are individuals). This is a **sufficientarian** constraint bolted onto a **proportional** rule.
  2.  **Diminishing Marginal Utility:** It implicitly acknowledges what strict pro rata denies: that \$10k means more to a small creditor than to a billion-dollar bank. By giving the small creditor a better fraction, the rule is attempting to equalize *welfare impact* without explicitly measuring utility.
  3.  **The Nash Baseline:** You asked about swapping the baseline to an "uncoordinated grab." If the disagreement point is a race (where the fast creditor gets 100% and the slow gets 0), the "surplus" of the bankruptcy proceeding is the *stabilization* of expectations.
      *   A floor rule acts as insurance against the "slow creditor gets zero" risk. It suggests the true commitment is **risk-pooling** among creditors, not just asset division.

  ### 4. Summary for Your Seminar
  To answer your specific questions for the paper:

  1.  **What does pro rata presuppose?** It presupposes that the **legal claim** is the only morally relevant characteristic for distribution among peers. It explicitly rejects comparing *hardship* (welfare) between creditors. It is a rule of **right-based equality**, not **welfare-based equality**.
  2.  **Fact vs. Move:** The rule depends entirely on the claim being a verifiable fact. If claims are strategic moves, the rule requires a prior "adjudication phase" to freeze them. The fairness is procedural (verification) + distributive (pro rata).
  3.  **The Floor:** The floor proves that "treated alike" is often code for "protected equally against destitution/insignificance." It shows that in practice, we often reject pure pro rata because we intuitively accept **diminishing marginal utility** of money, even if we don't admit it in the doctrine. The floor is a proxy for a welfare comparison that the law claims it isn't making.

  **The "Stuck" Point Resolution:**
  You aren't stuck; you've found the crack in the doctrine. Insolvency law *says* it treats creditors equally (pro rata), but its priority rules and practical modifications (like floors or small-claims expedited tracks) show it is actually balancing **Efficiency** (priority), **Rights** (pro rata), and **Welfare** (floors/priority for employees).

  Your seminar argument could be: *Insolvency law uses the language of rights-based proportionality (pro rata) to mask a deeper, unstable compromise between efficiency and welfare, which becomes visible only when we examine the exceptions (priority) and the modifications (floors).*

  The "incompatible views" you sensed are real. The law papers over the conflict between "Equality of Claims" and "Equality of Impact" by using priority to handle the welfare stuff and pro rata to handle the commercial stuff. Your mediation clinic's floor is the moment the welfare logic bleeds into the commercial logic.
