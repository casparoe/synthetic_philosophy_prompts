answer: |-
  You have put your finger on the single most frustrating knot in the philosophy of animal minds. You aren't imagining it; that move is the engine room of most debates on this topic.

  There isn't one single Latin name for it like *ad hominem*, but in formal logic, it is a sophisticated species of **Special Pleading**. However, that label is a bit dry for what you're describing. In the literature on animal cognition, this specific maneuver is often called **Asymmetrical Skepticism**.

  Here is the breakdown of what the thing actually is, why it isn't quite the other problems you mentioned, and how you can spot the difference between a real argument and this maneuver.

  ### 1. Why it's not just "Moving the Goalposts"
  "Moving the goalposts" implies changing the *standard* of proof. (e.g., "Okay, the fish limps, but prove it *cries*.")
  What you are describing is more unstable than that. You are describing a situation where the *same evidence* is treated as having opposite logical weight depending on who is being judged.
  *   **Fish limps:** Evidence of pain.
  *   **Robot retreats:** Evidence of programming.
  *   **Same behavior, opposite verdict.**

  This isn't just moving the line; it's changing the rules of how the ball counts. In philosophy of science, this violates the principle of **Uniformity**. You are applying one set of physical laws to the fish and a different set of interpretive laws to the robot, without a justified reason for the switch.

  ### 2. Why it's not the "Problem of Other Minds"
  The "Problem of Other Minds" is the background fog: *I can never truly know if anyone else feels anything.* That problem applies to your spouse, your baby, and the fish equally.
  The move you're spotting is an attempt to *clear* the fog selectively. It says, "The fog is too thick to see pain in the fish, but somehow clear enough to see 'just mechanism' in the plant."
  It uses the uncertainty of the Problem of Other Minds as a shield for the animal you want to exclude, but ignores that same uncertainty for the animal (or human) you want to include.

  ### 3. Why it's not simple Circular Reasoning
  Circular reasoning is: *It feels pain because it has pain feelings.*
  What you're seeing is: *It feels pain because it has a cortex. Birds feel pain without a cortex because... well, they just do.*
  This is **Inconsistent Criterion Application**. It's not strictly circular because they aren't using the conclusion as the premise; they are using a premise (cortex) for Group A, dropping that premise for Group B, and keeping the conclusion for both. It's logically messy, but it's not a closed loop. It's a **Double Standard**.

  ### 4. A Better Name: "The Evidentiary Flip"
  Since "Special Pleading" is a bit generic, and you asked for something that captures the specific mechanic of using one feature as proof *and* disproof: Let's call it **The Evidentiary Flip**.

  **The Edges of The Evidentiary Flip:**
  *   **What's In:** Any argument where Feature X is "sufficient evidence" for Subject A, but "insufficient evidence" for Subject B, *unless* a relevant, independent difference is proven between A and B.
  *   **What's Out:** If the arguer admits, "We use the cortex test for mammals, but we know it fails for birds, so we are switching to a behavioral test for birds," that is honest calibration. The "Flip" happens when they claim the cortex test is *universally necessary* until a bird walks in the room, at which point it becomes *optional* without admitting the rule changed.
  *   **Difference from Bias:** Bias is internal (I like dogs). The Evidentiary Flip is the external *logical structure* built to protect that bias.

  ### 5. Is there a principled way out?
  Yes. Philosophers of mind and comparative psychologists generally agree on one method to stop the Flip: **Inference to the Best Explanation (IBE)** combined with **Evolutionary Continuity**.

  Here is how it works:
  1.  **Assume Continuity:** Evolution doesn't reinvent the wheel. If humans have a system for pain (nerves + avoidance + learning), and fish have a homologous system (nerves + avoidance + learning), the default assumption should be that the system does the same thing.
  2.  **Burden of Shift:** The burden of proof is on the person claiming the systems are *different*. Not on the person claiming they are the same.
  3.  **The "Relevant Difference" Test:** If you say a cortex is required for pain, you must explain why birds (no cortex) feel pain but fish (no cortex) don't. If you can't name a *relevant functional difference* between the bird brain and the fish brain regarding pain processing, you aren't allowed to swap the verdict.

  **The Anesthesia Test (which you mentioned):**
  You noted that a human hand pulls back under anesthesia, and we say "no pain." We know this because the human can *report* later, "I felt nothing."
  The Evidentiary Flip happens when people demand that same *report* from a trout to prove pain, knowing the trout physically cannot talk. That is setting a condition (verbal report) that is impossible for the subject to meet, solely to guarantee the negative verdict.

  ### Summary
  The move is **Asymmetrical Skepticism**, executed via **The Evidentiary Flip**.
  It is a form of **Special Pleading** where the criteria for "mind" are fluid enough to let your favorites in and keep the others out, but rigid enough to look like science.
  The principled fix is to demand that if a test is good enough for a bird, it's good enough for a fish, unless you can prove a biological reason why it shouldn't be. If the test changes only when the verdict is threatened, you're watching the Flip.
