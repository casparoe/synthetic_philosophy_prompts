answer: |-
  ### 1. The Three Grades: Keep Them, But Sharpen the Boundaries

  Your three grades are conceptually sound. They map closely to the standard philosophical taxonomy (causal construction, ontological construction, and interactive kinds/looping effects). They do not collapse into one another, but the boundary between Grade 1 and Grade 2 is where your students will bleed the concepts together.

  **The Order:** You must teach them **1 → 2 → 3**.
  *   **Why:** Grade 1 is compatible with biological realism (easiest to accept). Grade 2 requires an ontological shift (harder). Grade 3 requires understanding the feedback dynamic (hardest). If you start with 2 or 3, the engineers will reject the premise as anti-realist. If you end with 1, the sociologists will feel you've watered it down.

  **The Distinctions (Where they break down):**
  *   **Grade 1 (Causal):** Social forces cause the *traits*.
      *   *Boundary Check:* This is compatible with the kind being natural. (e.g., "Stress causes ulcers." Ulcers are real, stress is social, but "ulcer" is a biological kind).
      *   *Risk:* Students think this *is* social construction. It isn't. It's just social causation.
  *   **Grade 2 (Constitutive):** Social forces constitute the *boundary*.
      *   *Boundary Check:* Without the social agreement, the kind does not exist, even if the substrate does.
      *   *Risk:* Collapses into "it's all in our heads." You must emphasize that the *consequences* are external and objective.
  *   **Grade 3 (Looping):** The classification changes the *substrate*.
      *   *Boundary Check:* This is not just Grade 1 causation. Grade 1 is `Social → Trait`. Grade 3 is `Classification → Knowledge → Trait → Classification`. It requires the classified object to *know* it is classified.
      *   *Risk:* Students think this is just "self-fulfilling prophecy." It's deeper; it changes the scientific object itself over time.

  **Verdict:** Do not rebuild the spine. It works. But you must explicitly state that Grade 1 is the *weakest* claim and Grade 2 is the *strongest* ontological claim.

  ### 2. The Example: Drop Money. Use "Disability" (Specifically Mobility).

  Money is a trap. It is a pure Grade 2 example (constitutive), but it fails at Grade 1 (socialization doesn't change the paper) and Grade 3 (coins don't change behavior because they know they are coins). If you use money, the engineers will nod, the sociologists will sigh, and no one will transfer the logic to race or gender.

  **Use: Disability (The Social Model).**
  *   **The Substrate:** Physical impairment (paraplegia, blindness, etc.). This satisfies your requirement for a "real and contested natural substrate." No one can claim the nerve damage isn't real.
  *   **Why it works for the mix:**
      *   *Engineers:* They deal with ramps, doors, and interface design (the causal structure).
      *   *Psych:* They deal with adaptation, identity, and stigma.
      *   *Soc:* They deal with institutional access and legal categories (ADA).

  **How it carries the three grades:**
  1.  **Grade 1 (Causal):** A staircase *causes* the inability to enter. The "disabled trait" (inability to enter) is produced by the architecture, not just the legs.
  2.  **Grade 2 (Constitutive):** Without the legal/medical category of "Disabled," you are just a person who can't use stairs. The *kind* "Disabled Person" is constituted by the accommodation framework. (If you remove the framework, the kind disappears, even if the legs stay the same).
  3.  **Grade 3 (Looping):** Once labeled "Disabled," the person may join advocacy groups, demand ramps, or internalize an identity that changes how they navigate the world. The classification changes the population's behavior, which forces the classification to update (e.g., neurodiversity moving from "disorder" to "difference").

  ### 3. Misconceptions: When to Head Them Off

  Do not save these for the end. Insert the rebuttals directly into the example walkthrough.

  *   **"Constructed means not real."**
      *   *Where:* During Grade 2 (Constitutive).
      *   *Head off:* "If I deny the existence of money, I still can't buy lunch. If I deny the category 'Disabled', I still can't get through the door. The *effects* are objective, even if the *boundary* is constructed."
  *   **"Constructed means arbitrary or a matter of choice."**
      *   *Where:* During Grade 1 (Causal).
      *   *Head off:* "The staircase wasn't chosen randomly. It was built for a specific average body. The construction is historical and constrained, not whimsical."
  *   **"Constructed means it's only in our heads."**
      *   *Where:* During Grade 2.
      *   *Head off:* "The ramp is concrete. The law is paper. The construction is institutional, not psychological."
  *   **"Constructed means we should abolish it."**
      *   *Where:* During Grade 3 (Looping).
      *   *Head off:* "Knowing a category is constructed doesn't tell us to destroy it. It tells us we have the power to *revise* it. We might need the category 'Disabled' to secure legal rights."
  *   **"If race is constructed then ancestry/phenotype don't matter."** (Your specific worry).
      *   *Where:* During the Substrate setup.
      *   *Head off:* "In Disability, the nerve damage is real. In Race, the ancestry and phenotype are real. Construction explains how we *group* those facts, not whether the facts exist. Ignoring the substrate makes the construction unintelligible."

  ### 4. The Diagnostic Question

  Do not ask "Is X socially constructed?" They will all say yes.
  Do not ask "What does constructed mean?" They will give you the huffy definition.

  **Ask this:**
  > "If we abolished the classification [Disabled / Money / Race] tomorrow, which parts of the phenomenon would persist, which would vanish, and how would the behavior of the people involved change within a year?"

  **What to listen for:**
  *   **Vocabulary User:** Will say "It would vanish" (too simple) or "It would stay the same" (misses the looping).
  *   **Idea Owner:** Will distinguish the *substrate* (nerve damage / paper / ancestry) from the *function* (access / value / stratification) and predict a *looping effect* (people would navigate the world differently, changing the substrate over time).

  ### 5. What to Refuse to Cover (Say this out loud)

  You have 75 minutes. You must explicitly exclude two things to keep the session from exploding.

  1.  **Normative Politics:** "We are analyzing the *mechanics* of the category, not arguing whether it is good or bad. We are not deciding whether to abolish disability benefits or affirmative action today. That requires a moral framework we aren't building here."
  2.  **Historical Genealogy:** "We are not tracing the history of how these categories emerged. We are looking at the logical structure of how they function *now*."

  ### 6. Session Plan (75 Minutes)

  *   **00-05: Setup.** Acknowledge the room. "Everyone agrees race/gender are constructed. Today we ask: what work does that word actually do? If you can't define it, you can't use it."
  *   **05-15: The Warm-up (Money).** Use Money *only* to illustrate Grade 2 (Constitutive). Get it out of the way. "Money is easy. Let's move to something where the biology fights back."
  *   **15-50: The Core (Disability).**
      *   15-25: **Grade 1 (Causal).** The Staircase. Show how the environment produces the trait.
      *   25-35: **Grade 2 (Constitutive).** The Law. Show how the definition creates the kind. Address "Not Real" and "In Heads" misconceptions here.
      *   35-50: **Grade 3 (Looping).** The Identity. Show how the label changes the person. Address "Abolish" and "Arbitrary" misconceptions here.
  *   **50-60: Transfer.** Briefly map the Disability logic back to Race/Gender. "If the nerve damage is the phenotype, and the ramp is the institution, where is the looping in race?" (Let them sit with that).
  *   **60-65: The Exclusions.** State clearly what you are *not* doing (Normativity, History).
  *   **65-75: The Diagnostic.** Ask the question. Have them write a 2-sentence answer. Collect them. This forces individual accountability.

  ### Final Check on Your Frame
  Your three grades are the right frame. The risk is not the frame, but the **example**. If you use Money, Grade 1 and 3 fall flat. If you use Race, the room gets defensive. **Disability** is the only example that holds the weight of all three grades while keeping the "natural substrate" undeniable. Use it.
