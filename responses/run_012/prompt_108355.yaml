answer: |-
  Here is the breakdown of your friend's moral algorithm, the prediction for your "Leveling Down" case, and the follow-up test to crack her code completely.

  ### The Prediction
  **She will pick (20, 80).**

  She will reject the equal outcome $(20, 20)$ instantly. She will likely justify it by saying something like, "Why hurt B if it doesn't help A?" or "That's just spite."

  ### Which Rule Is She Running?
  She is almost certainly running **(b) Prioritarianism** (with a strong leaning toward **Maximin** as a heuristic).

  Here is why:
  *   **Rule (c) Egalitarianism (Telic):** This view holds that inequality is *intrinsically* bad. If she held this view, she would pick $(20, 20)$. To a Telic Egalitarian, a world where everyone is equally miserable is *in one respect* better than a world where some are miserable and some are flourishing, because the inequality itself is removed. However, this is a notoriously counter-intuitive position (called the **Leveling Down Objection**). Most people, even those who argue passionately for equality, recoil when they realize it implies making the rich poorer *without* helping the poor.
  *   **Rule (a) Maximin:** This view says we should maximize the well-being of the worst-off person. In $(20, 80)$, the worst-off is at 20. In $(20, 20)$, the worst-off is *still* at 20. Since the floor didn't rise, Maximin offers no reason to switch. If forced to choose, a Maximinist usually defaults to the status quo or higher total utility as a tie-breaker.
  *   **Rule (b) Prioritarianism:** This view weights gains to the worse-off more heavily, but it is still a form of consequentialism. It requires *someone* to benefit for an outcome to be "better." Since A stays at 20 and B drops from 80 to 20, the total weighted well-being plummets. A Prioritarian rejects this.

  **Why her track record fits (b) better than (c):**
  In all four previous cases, the worst-off person **gained**.
  *   Case 1: $5 \to 40$
  *   Case 2: $10 \to 30$
  *   Case 3: $25 \to 35$
  *   Case 4: $20 \to 28$
  She has never had to choose between "Equality" and "Helping the Poor" because until now, those two values have pointed in the same direction. Her history shows she is willing to sacrifice the rich *to help the poor*. It does not show she is willing to sacrifice the rich *for no reason*.

  ### What The Other Rules Predict
  *   **If she were a strict Telic Egalitarian (c):** She picks **(20, 20)**. The reduction in the gap (from 60 to 0) outweighs the loss in total utility.
  *   **If she were a strict Utilitarian:** She picks **(20, 80)** (Total 100 vs 40).
  *   **If she were a strict Maximinist (a):** She is **indifferent** regarding the floor (20 vs 20), but would likely pick **(20, 80)** based on a secondary tie-breaker (like Pareto efficiency: B is worse off in the second option, A is same, so the first is strictly dominant).

  ### Confidence Level
  **85%**.
  The remaining 15% accounts for the possibility that she has stumbled into a rigid ideological definition of "fairness" that ignores the *point* of fairness (human welfare) in favor of the *math* of fairness (variance). However, the "instant, no hedging" descriptor suggests intuition, and human intuition almost universally fails the Leveling Down test.

  ---

  ### The Next Case: Separating Maximin from Prioritarianism
  Assuming she picks $(20, 80)$ as predicted, you have ruled out strict Telic Egalitarianism. Now you need to distinguish between **Maximin** (Floor is all that matters) and **Prioritarianism** (Floor matters *more*, but totals still count).

  You need a case where the floor rises by a trivial amount, but the cost to the better-off is catastrophic. A Maximinist will take the deal; a Prioritarian will not.

  **The Case:**
  **Option A: (30, 100)**
  **Option B: (31, 35)**

  **The Breakdown:**
  *   **Option A:** Worst-off = 30. Total = 130. Gap = 70.
  *   **Option B:** Worst-off = 31. Total = 66. Gap = 4.

  **What Each Rule Says:**
  1.  **Maximin (a):** Picks **(31, 35)**. The worst-off person is better off ($30 \to 31$). Nothing else matters. The fact that the other person lost 65 points is irrelevant.
  2.  **Prioritarianism (b):** Likely picks **(30, 100)**. Even though the gain to the poor person is weighted heavily, a 1-point gain is rarely enough to justify a 65-point loss to someone else. The total weighted utility will likely favor Option A.
  3.  **Egalitarianism (c):** Picks **(31, 35)**. The gap shrinks massively ($70 \to 4$) and the floor rises.

  **Why this works:**
  If she picks $(31, 35)$, she is a **Leximin** theorist (the floor is absolute). If she picks $(30, 100)$, she is a **Prioritarian** (the floor is weighted, but not absolute).

  ---

  ### Is There a "Genuine Wash"?
  **Yes.**

  There is a specific philosophical reading called the **Person-Affecting View**.
  This view holds that one outcome cannot be declared "better" than another unless it is *better for at least one specific person*.

  *   In $(20, 80)$, Person A has 20, Person B has 80.
  *   In $(20, 20)$, Person A has 20, Person B has 20.

  Person A is no better off. Person B is worse off.
  Under the strict Person-Affecting View, the move from $(20, 80)$ to $(20, 20)$ is not "better," it is simply "worse for B." But is $(20, 80)$ better than $(20, 20)$? Only in the sense that B is better off.
  If your friend adheres to this strictly, she might refuse to call one "the better outcome" in a moral sense, or she might say they are **incomparable**.

  However, since your format forces a choice ("she says which of the two... is the better outcome"), she will likely use **Pareto Efficiency** as a tie-breaker: "Option 1 is better because B is better off and A is no worse off." So while it is a theoretical wash on "justice," it is not a wash on "rational choice." Expect her to pick **(20, 80)** on the grounds that hurting B for no reason is irrational.
