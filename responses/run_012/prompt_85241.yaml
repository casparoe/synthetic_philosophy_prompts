answer: |-
  - **Candidate concepts**
      *   **Picking (Ullmann-Margalit & Morgenbesser):** Captures the arbitrary act between equal options, but treats the subsequent preference as a separate state, not a unified phenomenon.
      *   **Adaptive Preference (Elster):** Explains preference change based on availability, but typically involves devaluing the unavailable (sour grapes), not valuing the arbitrarily selected.
      *   **Endowment Effect (Thaler/Kahneman):** Describes valuing what one owns more highly, but is economic/descriptive and lacks the normative justification component.
      *   **Cognitive Dissonance (Festinger):** Explains the psychological mechanism of reducing tension, but offers no account of the rational status of the resulting reasons.
      *   **Confabulation:** Implies the reasons are false or insincere, whereas your cases involve genuine, action-guiding commitment.

  - **The phenomenon, stated precisely**
      An agent deliberates between options A and B, arriving at a settled judgment of normative parity. The agent employs a non-reason-based mechanism (coin, whim) to select A. Post-selection, the agent generates differentiating reasons favoring A, treating these reasons as if they were antecedent grounds for the choice rather than consequences of it. The foregone option B is subsequently viewed as inferior or unfitting, despite no new information regarding intrinsic properties. This attitude persists over time, guiding future actions and resisting counterfactual reversal. The core feature is the transformation of an arbitrary selection into a robust, reason-backed commitment where the agent sincerely denies the prior parity.

  - **Nearest neighbours**
      **Picking:** Ullmann-Margalit and Morgenbesser's distinction is the structural precondition. They define 'picking' as selection without a preference where 'choosing' requires one. Your phenomenon begins as picking but metamorphoses into choosing. Their framework allows this sequence but does not name the transformative mechanism. It identifies the input (parity) but misses the output (reason-creation), treating the post-hoc preference as a new, independent state rather than a consolidation of the arbitrary act.

      **Adaptive Preference:** Elster's concept covers preference change to match reality. However, adaptive preference is typically defensive, reducing desire for unavailable options to cope with constraint. Your pattern is constructive: it enhances desire for an available option via arbitrary selection. Both reduce psychological tension, but adaptive preference responds to *impossibility*, whereas your pattern responds to *indifference*.

      **Cognitive Dissonance:** This is the causal engine. Festinger explains why the agent *feels* compelled to justify the choice to reduce discomfort between "I chose arbitrarily" and "I am rational." However, dissonance is a psychological description, not a philosophical categorization. It explains the *pressure* to generate reasons, but not the *status* of those reasons. It is the closest mechanistic explanation, but it lacks the normative vocabulary required for action theory.

  - **Verdict**
      There is no established term capturing the *normative solidification* of an arbitrary tie-break. "Picking" stops at the act; "Dissonance" stops at the psychology. I propose **Normative Crystallization**.
      
      *Definition:* The process by which an agent's arbitrary selection between judged-parity options generates enduring, action-guiding reasons that are retroactively construed as antecedent justifications.
      
      Unlike mere rationalization, Normative Crystallization results in stable, sincere commitment that steers future action. Unlike discovery, it creates rather than finds value. It implies that the will can constitute reasons where none previously existed, transforming a liquid state of indifference into a solid state of preference. This term isolates the specific transition from "no reason" to "decisive reason" triggered solely by the act of selection itself.

  - **Boundary cases**
      1.  **Immediate Regret:** Agent flips coin, picks A, immediately wishes they picked B. (Verdict: Not crystallization; the normative state remains liquid; the will failed to solidify the choice).
      2.  **New Information:** Agent picks A, then learns A pays more. (Verdict: Not crystallization; reasons are external discoveries, not volitional creations).
      3.  **Pre-commitment:** Agent decides beforehand to stick with whatever they pick. (Verdict: Crystallization + Resolution; the crystallization explains the *content* of the preference, the resolution explains the *stickiness*).
      4.  **Dog Naming:** Pointing randomly, then feeling the other name is wrong. (Verdict: Paradigmatic crystallization; the 'wrongness' is created entirely by the pointing act).

  - **What turns on it**
      This determines whether reasons are mind-independent facts or will-dependent constructions. If Normative Crystallization generates genuine reasons, constructivism about practical reason is strengthened: the will doesn't just track reasons, it creates them. If it is merely psychological friction, realism holds: the agent is mistaken about having reasons, though motivated to act. Settling this requires asking if the agent is *rationally required* to stick with the choice (normative), or merely *psychologically inclined* (descriptive). Your cases suggest the former.
