prompt: |-
  I run evals and inference-time tricks for a small team, mostly LLM reasoning stuff — we sample a bunch of chain-of-thought answers at temperature > 0 and take the majority answer, and everyone keeps telling me this is "basically the Condorcet jury theorem." I've read the one-paragraph version (each voter more likely than not to be right, votes independent, majority converges toward certainty as you add voters) and I have a solid working grasp of my own vocabulary: ensembles, weak learners, the weak-learning / edge assumption, bagging vs boosting, bias-variance, calibration, correlated errors between models, self-consistency decoding, pass@k, and the difference between a model being accurate on a distribution and being right about a particular question. What I don't have is any real philosophy or social-choice background, so when someone says the theorem "justifies" my majority vote I genuinely can't tell what's being claimed or whether it's a compliment to my method or an insult.

  So: translate the Condorcet jury theorem into my vocabulary as faithfully as you can. Go assumption by assumption — the binary choice, the fact that there's a correct answer and everyone wants to find it, each voter's competence being above one half, independence, sincere rather than strategic voting, and the claim about what happens as you add voters — and for each one tell me the closest thing in ensemble / ML terms, how much you had to fudge to get the match, and whether the fudge is doing real work or is just decoration. Then the part I actually care about, the residue report: what does the theorem say that I have no way to say in my own terms? And where does my vocabulary let me say something the theorem can't say at all?

  Two specific things I want you to take seriously, because I think they're where the analogy usually breaks:

  1. Temperature sampling isn't a jury. When I sample the same model twelve times, am I twelve jurors, one juror with a shaky hand, or twelve jurors who all read the same newspaper? Say precisely wich of the theorem's assumptions that violates, and whether anything in my own toolkit — an ensemble of genuinely different models, or the notion of error correlation — gets closer to what the theorem actually wants than self-consistency does.

  2. Competence can be heterogeneous, and sometimes below one half. Real voters (and real samples) aren't uniformly p > 0.5, and I've heard that if enough of them are worse than chance the majority can get worse as you add them rather than better. Say what happens in the translated setting, and whether the ML notion of a weak learner that's only barely better than chance captures the same condition or a seperate one. Also tell me what the translation does with the case where the errors are correlated in a structured way — say all twelve samples fail on the same kinds of questions — which I suspect is the normal case rather than the exotic one.

  Finish by answering the thing I can't figure out on my own: is "majority vote is more likely to be right than a single sample" even a claim my setup can support, or is it a claim that only holds in a world that satisfies the theorem's assumptions, and what should I actually do differently at inference time if I take the disanalogies seriously — more samples, fewer, differently-trained models, something else entirely. Don't give me a reading list or citations, I won't be able to check them anyway. I just want the translation, the residue, and your honest read on which parts of my setup the theorem is actually talking about.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Technical ML practitioner (evals, inference-time tricks, LLM reasoning). Knows ensemble methods, bias-variance, calibration, self-consistency, pass@k, etc.
      *   **Knowledge Gap:** Philosophy/Social Choice theory (specifically Condorcet Jury Theorem - CJT).
      *   **Goal:** Translate CJT into ML/Ensemble vocabulary. Identify where the analogy holds, where it breaks (the "fudge"), and what unique insights each side offers (the "residue").
      *   **Specific Constraints:**
          *   Go assumption by assumption (Binary choice, Ground Truth, Competence > 0.5, Independence, Sincere Voting, Asymptotics).
          *   Address Temperature Sampling vs. Jury (Independence/Identity issue).
          *   Address Heterogeneous Competence & Correlated Errors (Weak learners vs. CJT competence, structured failure).
          *   Final Verdict: Is "majority vote is better" supported? What should be done differently at inference time?
          *   **Negative Constraint:** No reading lists or citations.
      *   **Tone:** Precise, technical, honest about the "fudge," no fluff.

  2.  **Deconstruct the Condorcet Jury Theorem (CJT):**
      *   *Core Claim:* If $n$ voters vote on a binary issue, each has probability $p > 0.5$ of being correct, votes are independent, and they vote sincerely, then the probability the majority is correct approaches 1 as $n \to \infty$. Furthermore, the majority is more likely to be correct than a single voter.
      *   *Assumptions:*
          1.  Binary Choice (Yes/No, A/B).
          2.  Objective Ground Truth (There *is* a right answer).
          3.  Competence ($p > 0.5$ for all voters).
          4.  Independence (Votes are conditionally independent given the truth).
          5.  Sincere Voting (No strategic manipulation).
          6.  Homogeneity (Usually assumed $p$ is same for all, though extensions exist).

  3.  **Map CJT Assumptions to ML Vocabulary:**

      *   *Binary Choice:* Classification task (True/False, Multiple Choice reduced to binary). *Fudge:* LLM reasoning is often open-ended generation mapped to a choice.
      *   *Ground Truth:* Labels/Test Set. *Fudge:* In reasoning, "truth" is often logical validity, not just dataset label.
      *   *Competence ($p > 0.5$):* Accuracy > 50%. Weak Learner condition. *Fudge:* CJT requires *every* voter $> 0.5$. ML ensembles often work with some weak learners $< 0.5$ if weighted or if others compensate (but CJT strict version fails if average $p < 0.5$).
      *   *Independence:* Error decorrelation. Bagging. *Fudge:* This is the big one. Temperature sampling from *one* model is not independent. It's the same weights, same biases.
      *   *Sincere Voting:* Argmax / Sampling without gaming the loss. *Fudge:* LLMs don't strategize (yet), so this holds.
      *   *Asymptotics:* More samples = better accuracy. *Fudge:* Diminishing returns due to correlation.

  4.  **Address Specific User Concerns:**

      *   *Concern 1: Temperature Sampling.*
          *   Is it 12 jurors or 1 juror with a shaky hand?
          *   It's 1 juror with a shaky hand (stochastic decoding).
          *   Violates *Independence*. The errors are correlated because the underlying function (weights) is identical.
          *   ML Equivalent: Bagging helps, but only if bootstrap samples create diversity. Temperature sampling creates diversity in *path*, not necessarily in *reasoning capability*.
          *   Better fit: Ensemble of different seeds/models (Deep Ensembles) fits Independence better than Self-Consistency (Temperature).

      *   *Concern 2: Heterogeneous Competence & Correlated Errors.*
          *   CJT strict: If average $p < 0.5$, majority converges to *wrong* answer.
          *   ML Weak Learner: Boosting works with $p > 0.5$ (barely). If $p < 0.5$, you can just flip the prediction.
          *   Correlated Errors: If all 12 samples fail on "logic puzzles involving negation," adding more samples doesn't help. This is the "Systematic Bias" problem. CJT assumes independent errors. ML knows this as "Bias" (irreducible error) vs. "Variance" (reducible by averaging).
          *   Temperature sampling reduces Variance, not Bias. If the model is biased (wrong reasoning), sampling more just confirms the bias confidently.

  5.  **Drafting the "Residue Report" (What CJT says that ML doesn't, and vice versa):**
      *   *CJT -> ML:* The sharp phase transition. The mathematical guarantee that *if* independence holds, you get exponential convergence. It highlights the danger of $p < 0.5$ (convergence to falsehood).
      *   *ML -> CJT:* Handling $p < 0.5$ (just flip it). Handling correlation (covariance matrices, decorrelation techniques). Handling non-binary (softmax, calibration). The distinction between Aleatoric (sampling) and Epistemic (model) uncertainty.

  6.  **Drafting the Final Verdict (Actionable Advice):**
      *   Does "majority vote is better" hold? Only if errors are uncorrelated and base accuracy > 50%.
      *   For Temperature Sampling: It helps with *verification* (consistency) but not necessarily *accuracy* if the model is fundamentally biased on that prompt.
      *   Action: Don't just sample more. Diversify. Use different prompts (prompt ensembling). Use different models. Check for systematic failure modes (bias) before increasing $N$ (variance reduction).

  7.  **Refining the Tone:**
      *   Avoid academic jargon where possible, stick to the user's ML lexicon.
      *   Be direct about the "fudge."
      *   Ensure the distinction between Variance (reduced by sampling) and Bias (unchanged by sampling) is central, as this maps to Independence vs. Shared Weights.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "one juror with a shaky hand" analogy? Yes, need to emphasize that temperature sampling is sampling from the *same* conditional distribution $P(y|x, \theta)$, whereas CJT assumes different $P(y|x, \theta_i)$.
      *   *Check:* Did I address the $p < 0.5$ case? Yes, CJT says you converge to wrong. ML says flip the sign. This is a key difference.
      *   *Check:* Did I avoid citations? Yes.
      *   *Check:* Is the distinction between Self-Consistency (Wang et al.) and CJT clear? Self-consistency assumes the reasoning path varies but the answer should converge. CJT assumes the *vote* is the signal.
      *   *Refinement:* Make sure to explicitly mention Bias-Variance decomposition. Temperature sampling reduces variance component of error. It does nothing for the bias component. CJT assumes zero shared bias (independence).

  9.  **Final Polish:** Organize into the requested sections: Translation (Assumption by Assumption), The Residue, Specific Breakages (Temp & Competence), Final Verdict. (Proceed to generate output based on this structure).

  *(Self-Correction on "Weak Learner"):* In Boosting, a weak learner is $p > 0.5 + \epsilon$. In CJT, it's $p > 0.5$. If $p < 0.5$ in Boosting, you flip. In CJT, if average $p < 0.5$, the theorem inverts (majority gets worse). I need to make sure this distinction is sharp.

  *(Self-Correction on Independence):* Temperature sampling *is* independent *conditional on the model weights*. But CJT requires independence *conditional on the truth*. Since the weights are fixed and potentially wrong, the errors are correlated conditional on the truth. This is the crucial technical distinction.

  10. **Final Output Generation** (matching the thought process above).
answer: |-
  Here is the translation of the Condorcet Jury Theorem (CJT) into your ensemble/LLM vocabulary, followed by the residue report and the actionable verdict.

  ### Part 1: The Translation (Assumption by Assumption)

  Here is the CJT mapped to your stack. I will flag the "fudge" where the social science concept forces a fit onto the ML reality.

  **1. Binary Choice**
  *   **CJT:** Voters choose between two options (Guilty/Innocent, True/False).
  *   **ML Translation:** Binary classification or multiple-choice reduced to binary (Correct/Incorrect).
  *   **The Fudge:** Minimal. You likely map CoT generations to a final answer token or a regex-matched option. As long as you can define a discrete decision boundary, this holds.
  *   **Work Done:** Real work. CJT breaks down or requires heavy modification for continuous regression or open-ended generation without a clear verification metric.

  **2. Objective Ground Truth**
  *   **CJT:** There is a fact of the matter. One option is objectively "correct."
  *   **ML Translation:** Test set labels / Gold answers.
  *   **The Fudge:** Moderate. In social choice, "truth" is often epistemic (what *is* the case). In LLM evals, "truth" is often a reference string. If your eval metric is fuzzy (e.g., "is this code runnable?"), the theorem's guarantee on "correctness" becomes probabilistic on the metric itself, not just the vote.
  *   **Work Done:** Decoration, provided your eval harness is deterministic.

  **3. Competence ($p > 0.5$)**
  *   **CJT:** Every single voter must have a probability of being correct strictly greater than random chance ($p > 0.5$).
  *   **ML Translation:** Every base model (or sample) must have accuracy > 50% on the specific distribution of questions being voted on.
  *   **The Fudge:** **Heavy.** CJT is brittle here. If the *average* competence drops below 0.5, the theorem inverts: adding more voters makes the majority *less* likely to be right, converging to certainty in the wrong answer. In ML (Boosting), if a weak learner is $p < 0.5$, we just flip its prediction. CJT assumes voters can't be "flipped," they just vote.
  *   **Work Done:** Real work. This is the danger zone. If your model is systematically confused on a specific subset of prompts (e.g., negation), its $p$ on that subset is $< 0.5$. CJT says sampling more will confidently confirm the error.

  **4. Independence**
  *   **CJT:** Voter $A$'s vote is statistically independent of Voter $B$'s vote, *conditional on the truth*.
  *   **ML Translation:** Error decorrelation. The probability that Model A fails should not increase the probability that Model B fails, given the ground truth.
  *   **The Fudge:** **Critical Failure.** This is where temperature sampling breaks the analogy.
      *   *CJT Ideal:* 12 different humans with different life experiences.
      *   *Your Setup:* 12 samples from the same weight matrix $\theta$.
      *   *The Violation:* Your samples are independent conditional on the *model*, but they are **highly correlated conditional on the truth**. If the weights $\theta$ encode a misconception about physics, all 12 samples will likely hallucinate the same physics error, regardless of temperature. Temperature adds noise to the *selection* of tokens, not to the *knowledge* stored in the weights.
  *   **Work Done:** Real work. This is the primary reason CJT overestimates the benefit of self-consistency.

  **5. Sincere Voting**
  *   **CJT:** Voters vote for what they believe is true, not strategically to manipulate the outcome.
  *   **ML Translation:** Greedy decoding or sampling from the true likelihood distribution, not RLHF-tuned to game a reward model.
  *   **The Fudge:** Low. Current LLMs don't strategize during inference (usually). They optimize next-token prediction, which aligns with "sincere" belief in the token distribution.
  *   **Work Done:** Decoration.

  **6. Asymptotics (Adding Voters)**
  *   **CJT:** As $n \to \infty$, Probability(Majority Correct) $\to 1$.
  *   **ML Translation:** As samples $k \to \infty$, ensemble accuracy approaches 100%.
  *   **The Fudge:** **High.** Because of the Independence violation (shared weights), your error curve plateaus. You reduce *variance* (noise in sampling), but you cannot reduce *bias* (systematic error in weights). CJT assumes no shared bias.
  *   **Work Done:** Real work. CJT promises exponential convergence to 1.0. Your setup promises convergence to $1 - \text{Bayes Error Rate}$ for that specific architecture.

  ---

  ### Part 2: The Residue Report

  This section isolates what the theorem tells you that your ML vocab obscures, and vice versa.

  **What CJT says that your ML vocabulary obscures:**
  1.  **The Danger of $p < 0.5$:** In ML, we treat weak learners as commodities; if they are bad, we weight them less or flip them. CJT treats competence as a hard threshold. It highlights a specific failure mode you might ignore: **Confident Wrongness.** If your model's "gut check" on a specific reasoning task is worse than a coin flip (e.g., it consistently falls for a specific logical fallacy), majority voting doesn't just fail to help; it actively amplifies the error into a high-confidence falsehood. Your "accuracy on a distribution" metric hides this local $p < 0.5$ failure.
  2.  **The Phase Transition:** CJT emphasizes that the benefit of ensembling is not linear. There is a sharp threshold effect based on independence and competence. Your "bias-variance" decomposition is smoother; CJT warns of a cliff where adding compute makes things qualitatively worse (convergence to 0% accuracy instead of 50%).

  **What your ML vocabulary says that CJT cannot:**
  1.  **Handling Correlation:** CJT essentially treats correlation as a violation that voids the warranty. Your vocabulary (covariance matrices, decorrelation losses, deep ensembles) gives you tools to *measure* and *mitigate* that correlation. You can quantify *how much* the independence assumption is violated; CJT just says "theorem no longer applies."
  2.  **Flipping the Sign:** As mentioned, ML allows you to use a $p = 0.3$ learner by inverting its output. CJT treats a voter with $p=0.3$ as a liability that drags the mean down. Your toolkit is more flexible here.
  3.  **Aleatoric vs. Epistemic:** Your distinction between uncertainty in the data (aleatoric) and uncertainty in the model (epistemic) clarifies *why* temperature sampling fails the independence test. Temperature samples aleatoric uncertainty (shaky hand). CJT requires diversity in epistemic uncertainty (different brains).

  ---

  ### Part 3: The Specific Breakages

  **1. Temperature Sampling: One Juror or Twelve?**
  *   **Verdict:** It is **one juror with a shaky hand.**
  *   **The Violation:** It violates **Independence conditional on Truth.**
      *   Let $Y$ be the truth. Let $V_i$ be the vote of sample $i$.
      *   CJT requires $P(V_1, V_2 | Y) = P(V_1 | Y) P(V_2 | Y)$.
      *   Temperature sampling gives $P(V_1, V_2 | Y, \theta) = P(V_1 | Y, \theta) P(V_2 | Y, \theta)$.
      *   But you integrate over $\theta$ (which is fixed/delta function). Because $\theta$ is fixed, if $\theta$ implies $Y \to \text{Error}$, then $V_1$ and $V_2$ are correlated.
  *   **Closer Analogy:** An **ensemble of genuinely different models** (e.g., different seeds, different architectures, or fine-tunes on disjoint data subsets) is closer to the CJT jury. This creates diversity in $\theta$, which reduces the correlation of errors conditional on $Y$.
  *   **Self-Consistency:** This is effectively **variance reduction**. It helps if the model is "unsure" (high entropy, correct path exists in probability mass). It does not help if the model is "biased" (low entropy, wrong path dominates).

  **2. Heterogeneous Competence & Correlated Errors**
  *   **Heterogeneous Competence:**
      *   *CJT:* If the *average* $p < 0.5$, the majority converges to the wrong answer.
      *   *ML:* If your "weak learner" assumption holds ($p = 0.5 + \epsilon$), you are safe. But if you have a mix of samples where some are $p=0.8$ and some are $p=0.2$ (hallucinating confidently), the $p=0.2$ samples act as adversarial noise.
      *   *Translation:* In ML, we weight votes by confidence (calibration). CJT assumes unweighted votes. If your high-temperature samples are less competent (more random), they dilute the signal of the low-temperature "expert" samples.
  *   **Correlated Errors (Structured Failure):**
      *   *Scenario:* All 12 samples fail on "count the number of 'r's in strawberry."
      *   *CJT:* Theorem void. Independence assumption violated.
      *   *ML:* This is **High Bias / Systematic Error**.
      *   *Impact:* Majority vote yields 100% confidence in the wrong answer.
      *   *Translation:* This is the normal case for LLMs on reasoning tasks. They share architectural biases (transformers struggle with exact token counting). Sampling more does not fix this. It only fixes cases where the correct path was *possible* but unlikely under greedy decoding.

  ---

  ### Part 4: The Verdict and Action Plan

  **Is "majority vote is more likely to be right than a single sample" a claim your setup can support?**
  **No, not universally.** It is only supported under the condition that **error variance dominates error bias** for the specific questions you are asking.

  *   If the model knows the answer but might slip up (token selection noise), majority vote helps (CJT holds approximately).
  *   If the model does not know the answer (weights lack the reasoning circuit), majority vote hurts (CJT fails, you converge to confident wrongness).

  **What should you do differently at inference time?**

  1.  **Stop treating $N$ samples as a free lunch.**
      Do not assume $Accuracy(N=12) > Accuracy(N=1)$. Monitor the **margin of victory**. If the 12 samples split 6-6 or 7-5, do not trust the majority. That indicates the model is in a "low competence" regime ($p \approx 0.5$) or the question triggers a systematic bias. In CJT terms, the "jury is hung," which implies the evidence is ambiguous or the jurors are incompetent.

  2.  **Diversify $\theta$, not just the noise.**
      Since temperature sampling violates the Independence assumption, you gain more signal by **Prompt Ensembling** than by Temperature Sampling.
      *   *Why:* Different prompts (e.g., "Let's think step by step" vs. "Verify your answer" vs. "Play a skeptic") act more like different "jurors" (different conditional distributions) than sampling from the same prompt at $T=0.7$. This moves you closer to the Independence assumption.

  3.  **Filter for Competence ($p > 0.5$).**
      Before taking a majority vote, estimate the confidence. If the model's logprobs indicate it is guessing (entropy is high across all samples), do not vote.
      *   *Action:* Implement a "abstain" mechanism. If the consensus is weak (e.g., < 60% agreement), flag for human review or fallback. CJT assumes voters *must* vote. You have the luxury of saying "I don't know," which protects you from the $p < 0.5$ inversion trap.

  4.  **Detect Systematic Bias.**
      If you see cases where 12/12 samples agree but are wrong, do not increase $N$. You have hit the bias floor. You need to change the model (fine-tune) or the context (RAG), not the decoding strategy.

  **Summary:**
  The Condorcet Jury Theorem is a compliment to your method **only if** you view your samples as independent estimators of a truth they are individually capable of seeing. It is an insult if it implies that your 12 samples are 12 independent thinkers. They are 12 echoes of the same mind. Use majority vote to smooth out the echoes, but do not use it to correct the mind.
