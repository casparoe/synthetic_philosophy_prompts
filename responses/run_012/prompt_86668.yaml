answer: |-
  Here is a structured plan for your ninety-minute session. It is designed to build a logical dependency chain where each concept necessitates the next, preventing the topic from feeling like a parlor trick.

  ### I. Logical Dependency Structure

  You identified four necessary components. I have added a prerequisite and reordered them to form a deductive chain. If you present them out of this order, the "argument" will feel like a list of features rather than a solution to a problem.

  1.  **Prerequisite (New): The Nature of the Acausal Threat.**
      *   *Why:* You cannot explain the defense before defining the attack. Since your students lack exposure to acausal reasoning, you must first establish that the threatener acts based on a *prediction* (simulation) of the agent's decision, not on the agent's causal response.
      *   *Dependency:* Everything else rests on this. If the threat is causal, surrogate goals are unnecessary.

  2.  **The Vulnerability: Target vs. Cost of Follow-Through.**
      *   *Why:* Establish why the threat works. The threatener only attacks if the cost of attacking is lower than the gain from your compliance. In standard decision theory (CDT), once the threat is made, your compliance is the rational choice, making the threat credible.
      *   *Dependency:* Requires understanding the Acausal Threat.

  3.  **The Failure of Standard Defenses: Ordinary Precommitment.**
      *   *Why:* Establish why they can't just "promise not to pay." In an acausal setting, you cannot causally bind your future self *after* the simulation has occurred. The simulation sees your source code *now*.
      *   *Dependency:* Requires understanding the Vulnerability.

  4.  **The Mechanism: Threatener's Beliefs and Decision Theory.**
      *   *Why:* Explain *how* the surrogate works. The threatener simulates you. If your utility function includes the surrogate, the simulation outputs "refusal," and the threatener (acting on the simulation) does not attack.
      *   *Dependency:* Requires understanding the Failure of Standard Defenses.

  5.  **The Limitation: Private Information and Cost Asymmetry.**
      *   *Why:* The critique. If the threatener knows the surrogate is cheaper to destroy than the original target, they will target the surrogate.
      *   *Dependency:* Requires understanding the Mechanism.

  **Omission:** I recommend dropping "reputation and third parties" from the core argument. While relevant to general deterrence, it introduces causal/repeated-game noise that distracts from the single-shot, acausal logic of surrogate goals. Mention it only as a contrast to why this specific problem is harder.

  ---

  ### II. The Core Scenario: "The Source-Code Blackmail"

  Do not use hostage negotiation (too causal) or abstract bargaining (too dry). Use a scenario that forces the separation between *simulation* and *reality*.

  **The Scenario:**
  An adversary has obtained a perfect copy of your source code (your decision algorithm). They run a simulation of you in a sandbox. They tell you: "My simulation has already run. If the simulation output was 'Pay $1M', I will release damaging information about your family in reality. If the simulation output was 'Refuse', I will do nothing. You are now speaking to me in reality, but the decision has effectively already been made by your copy."

  **What this scenario MUST have:**
  *   **Temporal Decoupling:** The threatener's action in reality is contingent on the *simulation's* output, not the real agent's current action.
  *   **Transparency:** The threatener knows your decision procedure (source code).
  *   **Single-Shot:** No reputation, no police, no future interactions.

  **What this scenario MUST NOT have:**
  *   **Causal Leverage:** The real agent cannot stop the threatener after the fact.
  *   **Communication Channels:** The real agent cannot signal the threatener outside of the decision output.
  *   **Uncertainty about the Simulation:** The agent must accept the simulation is accurate (logical uncertainty is the point, not empirical uncertainty).

  **Why alternatives are worse:**
  *   *Hostage Negotiation:* Implies you can call the police or negotiate terms *after* the threat is made. This triggers causal reasoning, which kills the acausal intuition.
  *   *Parfit's Hitchhiker:* Too focused on cooperation/payment for service. Blackmail is clearer for "defense."
  *   *Newcomb's Box:* Too focused on prediction vs. free will. Blackmail focuses on *leverage*, which is necessary for surrogate goals.

  ---

  ### III. Session Timeline & Misconception Management

  **0:00–0:15 | Introduction: The Acausal Threat**
  *   **Goal:** Define the "Source-Code Blackmail."
  *   **Misconception to Head Off:** *"The whole maneuver is pointless unless the threatener is causally reachable."*
  *   **Action:** Explicitly state: "The threatener is gone. They are acting on a log file from a simulation run yesterday. You cannot touch them." If they think they can causally influence the threatener, the session fails.

  **0:15–0:35 | The Trap: Why Standard Decision Theory Fails**
  *   **Goal:** Show that a standard Expected Utility agent pays the ransom.
  *   **Logic:** The simulation knows you are rational. In the simulation, the threat is already active. Paying minimizes loss. Therefore, the simulation pays. Therefore, the threatener attacks in reality.
  *   **Misconception to Head Off:** *"It can only work against an irrational or fanatical threatener."*
  *   **Action:** Emphasize the threatener is *hyper-rational*. They are maximizing utility based on the simulation. The problem is your rationality, not theirs.

  **0:35–0:60 | The Move: Surrogate Goals**
  *   **Goal:** Introduce the surrogate. "I modify my utility function to value 'Preventing the destruction of a specific pebble' as much as 'My family's reputation'."
  *   **Logic:** The simulation now sees an agent who will not pay (because paying leads to the pebble being destroyed by the threatener as punishment, or the cost structure shifts). The simulation refuses. The threatener sees the refusal and does not attack.
  *   **Misconception to Head Off:** *"A surrogate goal is just self-deception or pretending."*
  *   **Action:** Be precise: "This is not lying to the simulation. The simulation reads your actual code. You must *actually* change your utility function. You must genuinely care about the pebble."
  *   **Misconception to Head Off:** *"It is identical to a commitment device or burning one's bridges."*
  *   **Action:** Clarify: "Burning bridges is causal (I remove the steering wheel). This is logical (I change the objective function the simulator reads). There is no physical mechanism enforcing this."
  *   **Misconception to Head Off:** *"The surrogate has to be something absurd... or else the threatener will not take it seriously."*
  *   **Action:** Correct this as a **Half-Truth**. "It doesn't need to be absurd, but it must be *indistinguishable* from a core value in the simulation. If the threatener knows you don't care about pebbles, they know you're bluffing. The surrogate must be integrated into your code as a terminal value."

  **1:00–1:20 | The Vulnerability: Cost Asymmetry**
  *   **Goal:** Introduce the private information risk.
  *   **Logic:** What if the threatener knows it costs $100 to destroy the pebble but $1M to destroy your reputation? They might attack the pebble to punish you, knowing you value it highly, even if they can't touch the reputation.
  *   **Action:** This shows surrogate goals are not a magic shield; they shift the vulnerability to information symmetry regarding costs.
  *   **Misconception:** None specific here, but ensure they don't think this invalidates the strategy entirely. It just adds a constraint (surrogates must be cost-equivalent).

  **1:20–1:30 | Final Exercise & Scope Boundaries**
  *   **Goal:** Test mechanism understanding.
  *   **Exercise:** "The Variable Cost Test."
      *   *Prompt:* "You are facing the Source-Code Blackmailer. You can adopt a surrogate goal 'Save the Peck'.
      *   *Case A:* The blackmailer knows exactly how much you value the Peck.
      *   *Case B:* The blackmailer knows you value the Peck, but does not know how *cheaply* they can destroy it compared to your original target.
      *   *Question:* In which case does the surrogate goal successfully deter the attack, and why? Justify your answer using the simulation's decision procedure, not your own feelings."
      *   *Desired Answer:* Case A is risky (cost asymmetry exploitation). Case B is safer (threatener fears the cost might be too high). This tests if they understand the threatener is optimizing based on *their* costs and beliefs, not just the agent's values.

  **What to Explicitly Refuse to Cover:**
  1.  **Formal Decision-Theoretic Treatments:** Do not write out the FDT/UDT equations. Keep it conceptual. If you go formal, the philosophers will get bogged down in semantics and the CS students in proof details.
  2.  **Safe Pareto Improvements (SPI):** This is a related but distinct mechanism involving delegated bargaining. Bringing it in will confuse the specific logic of *threat defense*.
  3.  **Implementation in Actual AI Systems:** Do not discuss how to code a utility function modifier in Python or neural net weights. This is a conceptual session on decision theory, not AI safety engineering.

  **Closing Instruction:**
  End by telling them: "Today we treated the utility function as editable. Next time, we might ask who is doing the editing. But for now, assume you have the commit access." This signals that you know the deeper meta-problems but are intentionally bracketing them to master the base mechanism.
