      *   *Section 2: "Isn't Real" vs. "Social Fact" (Claim 4 & 8).* This is the big one. Explain the ontology. Use the money analogy properly. Money causes real effects. Race causes real effects. Therefore race is real *as a social object*. The text contradicts itself slightly by saying "isn't real" then later "real as a social fact."
      *   *Section 3: The "Strong Postmodern" Caricature (Claim 5).* Explain that serious constructionists rarely go this far. This is often a strawman set up to be knocked down.
      *   *Section 4: The Self-Refutation Objection (Claim 6 & 7).* Analyze the logic. If *everything* is constructed, the statement is constructed. But if *some* things are constructed (race), the statement is an objective claim about a social kind. The objection fails against the "middle position."
