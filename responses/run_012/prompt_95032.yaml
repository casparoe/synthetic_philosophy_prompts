prompt: |-
  I hold a view about philosophical thought experiments and want to know what would count against it. Distinguish a case’s load-bearing features — the structural elements the argument actually needs to generate its conclusion — from its scaffolding: the vivid, emotionally salient, or narratively contingent details that could be varied without altering the argument’s logical skeleton. My position is that a thought experiment provides evidence for a philosophical claim only if the target intuition survives the removal of its scaffolding; when the intuition evaporates once the scene is stripped to its load-bearing features, the case is an intuition pump in the pejorative sense and should carry no probative weight. What would count against this? I want the defeaters ranked from decisive to merely awkward, including cases where scaffolding seems epistemically indispensable, arguments that the load-bearing/scaffolding distinction cannot be drawn independently of the intuition it is meant to test, and findings from experimental philosophy or cognitive science about the reliability of stripped-down intuitions. Which of these would a defender of my view have to concede as genuine costs, and which could they dismiss? Is the position at risk of insulating itself — if every recalcitrant intuition can be redescribed as scaffolding, is that fatal or an acceptable feature of a normative criterion? Separate what is settled from what is genuinely contested among people who know this literature, and do not present a contested view as the consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Core Position:** The user holds a specific view on philosophical thought experiments (TEs). A TE provides evidence *only if* the target intuition survives the removal of "scaffolding" (vivid, emotional, narrative details). If the intuition disappears when stripped to "load-bearing features" (logical skeleton), the TE is a mere "intuition pump" (pejorative) and has no probative weight.
      *   **Task:** Identify what would count *against* this view (defeaters).
      *   **Requirements:**
          *   Rank defeaters from decisive to merely awkward.
          *   Include specific categories: cases where scaffolding is epistemically indispensable, arguments that the distinction (load-bearing vs. scaffolding) is circular/dependent on the intuition, and findings from experimental philosophy (X-phi)/cognitive science regarding stripped-down intuitions.
          *   Distinguish between costs a defender must concede vs. those they can dismiss.
          *   Address the risk of insulation (immunization against criticism).
          *   **Crucial Constraint:** Separate settled from contested claims in the literature. Do not present contested views as consensus.

  2.  **Deconstruct the User's Position:**
      *   This is a refined version of Daniel Dennett's "intuition pump" critique, combined with a form of robustness testing.
      *   It assumes a distinction exists between *form* (logic) and *content* (narrative).
      *   It assumes "stripped-down" intuitions are more reliable or authoritative than "embellished" ones.
      *   It sets a high bar for evidence: robustness across variations is necessary.

  3.  **Brainstorming Defeaters (Counter-arguments):**

      *   *Defeater 1: The Indispensability of Scaffolding.* Some concepts *require* thick description to be grasped. (e.g., Virtue Ethics, Phenomenology). You can't strip "what it feels like" without losing the phenomenon.
      *   *Defeater 2: The Circularity/Theory-Ladenness Problem.* How do you know what is "load-bearing" without already knowing the conclusion? Identifying the logical skeleton often presupposes the very theory being tested.
      *   *Defeater 3: Cognitive Science/X-Phi Findings.* Stripped-down cases might trigger *less* reliable intuitions. Abstract cases might lead to confusion or default heuristics, whereas rich cases engage relevant cognitive modules.
      *   *Defeater 4: The Role of Imagination.* TEs are meant to test conceptual competence in *possible worlds*. Rich details help simulate the world. Stripping them makes it a logic puzzle, not a TE.
      *   *Defeater 5: Insulation/Immunization.* If every counter-intuitive result is blamed on "scaffolding," the theory becomes unfalsifiable.

  4.  **Ranking and Evaluating Defeaters:**

      *   *Decisive:* The Circularity Charge (Defeater 2). If you can't distinguish load-bearing from scaffolding independently of the intuition, the criterion is vacuous.
      *   *Strong:* Indispensability of Scaffolding (Defeater 1). If the philosophy demands thick description (e.g., particularism), the user's criterion rules out whole fields illegitimately.
      *   *Moderate/Contested:* X-Phi findings (Defeater 3). It's not settled that rich intuitions are worse. In fact, some evidence suggests abstract intuitions are *more* prone to bias (e.g., framing effects still happen in abstract cases).
      *   *Awkward/Manageable:* Insulation (Defeater 5). This is a methodological risk, but a defender can argue it's a feature (rigor), not a bug.

  5.  **Addressing the "Settled vs. Contested" Constraint:**
      *   *Settled:* There is no consensus on the reliability of intuitions generally. There is no consensus on a strict form/content distinction in TEs. Dennett coined "intuition pump," but its normative force is debated.
      *   *Contested:* Whether "stripped" cases are better. Whether scaffolding is ever epistemically relevant. Whether X-phi undermines traditional methods.
      *   *Action:* I must explicitly label these as debates, not facts.

  6.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the sophistication of the view (it aligns with Dennett but adds a robustness condition). State the goal: evaluate defeaters.
      *   *Section 1: The Distinction Problem (Decisive/Strong).* Can we actually separate load-bearing from scaffolding *prior* to testing? If the distinction is post-hoc, the criterion is circular. *Status:* Highly contested. Many argue the distinction is theory-laden.
      *   *Section 2: Epistemic Indispensability (Strong).* Thick concepts (Williams, McDowell). Phenomenal consciousness (Nagel). If the "scaffolding" *is* the data, stripping it destroys the evidence. *Status:* Contested between naturalists and phenomenologists.
      *   *Section 3: Cognitive Science/X-Phi (Moderate).* Do stripped intuitions work better? Some studies suggest vividness *helps* cognitive processing. Abstract cases might trigger "schooling" biases rather than genuine conceptual competence. *Status:* Empirically contested.
      *   *Section 4: The Insulation Risk (Methodological).* If I can always call counter-evidence "scaffolding," am I safe from refutation? *Status:* A known problem in methodology (Duhem-Quine).
      *   *Section 5: Concessions vs. Dismissals.* What must the user admit? (That the distinction is hard to draw). What can they dismiss? (That all rich detail is good).
      *   *Conclusion:* Summarize the state of play.

  7.  **Refining the Tone:**
      *   Ensure I don't say "Philosophers agree X." Instead, "Proponents of Y argue X, while critics say Z."
      *   Maintain neutrality.
      *   Check the ranking: Decisive -> Awkward.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I present X-phi findings as settled? *Correction:* No, emphasize the "replication crisis" and disagreement on interpretation.
      *   *Check:* Did I address the "insulation" worry adequately? *Correction:* Make sure to distinguish between *ad hoc* rescue and legitimate refinement.
      *   *Check:* Is the distinction between "load-bearing" and "scaffolding" clear? *Correction:* Use the user's definitions but highlight the difficulty in applying them.
      *   *Check:* Did I rank them? *Correction:* Use explicit headers indicating strength.

  9.  **Final Polish:** Check against the prompt's specific request for "decisive to merely awkward" ranking and the specific categories (indispensability, distinction independence, X-phi). (Self-correction: Ensure I explicitly mention Dennett since "intuition pump" is his term, but note the user's view is a specific *normative* refinement of it).

  10. **Final Output Generation** (similar to the provided good response).
answer: |-
  Your position is a sophisticated refinement of Daniel Dennett's critique of "intuition pumps." You are proposing a **robustness criterion**: a thought experiment (TE) is probative only if the intuition persists when narrative embellishments are removed. This aligns with a tradition seeking to purify philosophical methodology of rhetorical manipulation.

  However, this criterion faces significant challenges. Below, I rank potential defeaters from those that threaten the coherence of the view (decisive) to those that impose methodological costs (awkward). I distinguish between **settled** points (where there is broad agreement in the literature) and **contested** points (where significant disagreement remains).

  ### 1. The Circularity of the Distinction (Decisive Threat)
  **The Argument:** You cannot identify which features are "load-bearing" and which are "scaffolding" independently of the intuition you are testing. To decide what constitutes the "logical skeleton" of a case often presupposes the very theoretical commitment the TE is meant to justify.
  *   **Why it counts against you:** If the distinction is theory-laden, your criterion becomes circular. You strip away details until the intuition matches your theory, then claim the remaining features are the "load-bearing" ones.
  *   **Settled vs. Contested:**
      *   *Settled:* It is widely acknowledged in the literature (e.g., by Kuhn, Norton, and Gendler) that describing a TE involves theoretical choices. There is no theory-neutral language for describing "logical skeletons."
      *   *Contested:* Whether this renders the distinction *useless*. Defenders of formalism argue that logical structure can be isolated via paraphrase; critics argue that meaning is inextricable from context.
  *   **Concession Required:** You must concede that the load-bearing/scaffolding distinction cannot be drawn *prior* to theoretical commitment. You cannot claim your method is theory-neutral.
  *   **Dismissible:** You can dismiss the idea that this makes the method *vacuous*, provided you treat the distinction as a reflective equilibrium process rather than an algorithmic filter.

  ### 2. Epistemically Indispensable Scaffolding (Strong Threat)
  **The Argument:** In certain domains, the "scaffolding" (vivid, narrative, emotional detail) is epistemically indispensable because the concept being tested is essentially thick or phenomenological.
  *   **Examples:**
      *   **Virtue Ethics:** A stripped-down description of an action ("Agent lied") may fail to capture the vice, which depends on context, motivation, and emotional texture (e.g., Bernard Williams's critique of moral theory).
      *   **Phenomenology of Consciousness:** In debates about qualia (e.g., Nagel's "What Is It Like to Be a Bat?"), the "scaffolding" *is* the data. Stripping the vividness removes the phenomenon under investigation.
  *   **Why it counts against you:** Your criterion would systematically exclude evidence from entire fields of philosophy that rely on "thick" concepts. If a TE fails when stripped, it might be because the stripped version no longer instantiates the concept, not because the intuition was manipulated.
  *   **Settled vs. Contested:**
      *   *Settled:* There is consensus that "thick" ethical concepts (e.g., *cruel*, *brave*) rely on descriptive and evaluative content that is hard to separate.
      *   *Contested:* Whether philosophical *justification* requires these thick descriptions or if they can be reduced to naturalistic properties without loss.
  *   **Concession Required:** You must concede that your criterion limits the scope of admissible TEs. It likely rules out particularist and phenomenological arguments.
  *   **Dismissible:** You can dismiss the idea that this is a bug; you might argue it is a feature that correctly identifies those fields as non-probative in the way analytic philosophy traditionally demands.

  ### 3. Cognitive Science and the Reliability of Stripped Intuitions (Moderate Threat)
  **The Argument:** Findings from experimental philosophy (X-phi) and cognitive science suggest that "stripped-down" intuitions are not necessarily more reliable; they may simply trigger different cognitive heuristics.
  *   **The Findings:**
      *   **Abstract vs. Concrete:** Some studies suggest that abstract, stripped-down cases trigger "theoretical" reasoning which is prone to its own biases (e.g., confirmation bias), whereas concrete cases engage simulation mechanisms that might be more ecologically valid.
      *   **Framing Effects:** Even stripped cases are subject to framing effects. The "logical skeleton" itself can be phrased in ways that prime specific responses.
      *   **Expertise:** There is mixed evidence on whether philosophical training makes intuitions about stripped cases more reliable.
  *   **Why it counts against you:** Your view assumes a hierarchy where "logical" intuitions are superior to "narrative" intuitions. Cognitive science does not clearly support this hierarchy. If stripped intuitions are just as noisy, your filter doesn't increase reliability, it just changes the noise profile.
  *   **Settled vs. Contested:**
      *   *Settled:* There is a replication crisis in X-phi, and no consensus that any specific class of intuitions (abstract or concrete) is globally reliable.
      *   *Contested:* Whether "stripped" cases reduce bias. Some cognitive scientists argue vividness aids comprehension and reduces ambiguity, thereby *increasing* reliability.
  *   **Concession Required:** You cannot claim empirical support for the superior reliability of stripped intuitions as a settled fact.
  *   **Dismissible:** You can dismiss specific X-phi studies as methodologically flawed, but you cannot dismiss the general challenge that cognitive architecture does not respect your form/content distinction.

  ### 4. The Insulation Risk (Methodological Cost)
  **The Argument:** If every recalcitrant intuition can be redescribed as "scaffolding," the position insulates itself from refutation.
  *   **Why it counts against you:** This is a Duhem-Quine problem. If a TE yields a counter-intuitive result for your theory, you can always claim the TE relied on emotional scaffolding. If it yields a supportive result, you claim it was load-bearing. This makes the criterion unfalsifiable.
  *   **Settled vs. Contested:**
      *   *Settled:* Immunization strategies are generally viewed as methodological vices in philosophy of science.
      *   *Contested:* Whether this specific criterion is *necessarily* immunizing. A defender could argue that the burden of proof lies on showing the intuition survives variation, which is a testable claim.
  *   **Concession Required:** You must accept the burden of demonstrating *why* a specific detail is scaffolding, rather than merely asserting it.
  *   **Dismissible:** You can argue this is not fatal insulation but rather a demand for **robustness testing**. In science, a result that disappears under slight variation is considered weak; you are simply applying scientific standards to TEs.

  ### Summary of Costs and Defenses

  | Defeater Category | Strength | Status in Literature | Must Concede? | Can Dismiss? |
  | :--- | :--- | :--- | :--- | :--- |
  | **Circularity** | Decisive | **Contested:** No consensus on theory-neutral description. | Yes: That the distinction is theory-laden. | No: Cannot claim the method is neutral. |
  | **Indispensability** | Strong | **Contested:** Naturalists vs. Particularists/Phenomenologists. | Yes: That the method excludes "thick" concepts. | Yes: Can argue those concepts lack probative weight. |
  | **Cognitive Science** | Moderate | **Contested:** No consensus on reliability of abstract vs. concrete. | Yes: That stripped intuitions aren't empirically proven better. | Yes: Can question the ecological validity of X-phi studies. |
  | **Insulation** | Awkward | **Settled:** Immunization is a vice; Robustness is a virtue. | Yes: That the burden of proof is on the user of the TE. | Yes: Can frame it as robustness testing, not ad hoc rescue. |

  ### What is Settled vs. Contested
  To ensure you do not present contested views as consensus:
  1.  **Do not claim** that "philosophers agree that intuition pumps are unreliable." (Contested: Many, like Timothy Williamson, defend the centrality of TEs).
  2.  **Do not claim** that "X-phi has proven intuitions are unreliable." (Contested: Many X-phi findings have failed replication; many traditionalists reject the methodology).
  3.  **Do claim** that "There is no agreed-upon algorithm for distinguishing logical form from narrative content." (Settled: This is a recognized difficulty in the literature).
  4.  **Do claim** that "Dennett's 'intuition pump' is a pejorative label, but its normative criteria are debated." (Settled: The term is common, its strict application is not).

  ### Final Verdict on Your Position
  Your position is **methodologically rigorous but potentially exclusionary**.
  *   **The Fatal Flaw to Avoid:** If you define "load-bearing" as "whatever yields the correct intuition," your view is tautological. To avoid this, you must define load-bearing features *independently* of the conclusion (e.g., via formal logic or causal structure), even if that is difficult.
  *   **The Strongest Defense:** Frame your view not as a way to *discard* TEs, but as a demand for **robustness**. Argue that if an intuition depends on emotional vividness, it is likely a reaction to the *story* rather than the *concept*, and thus less relevant to modal truth.
  *   **The Strongest Cost:** You must accept that your criterion likely renders large swathes of normative ethics and philosophy of mind non-probative. If you are willing to pay that price, the position is internally consistent, provided you avoid the circularity trap.
