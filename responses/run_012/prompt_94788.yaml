answer: |-
  This is a sophisticated way to approach revision, aligning closely with Douglas Hofstadter's notion of the "conceptual neighborhood." If the book is a machine, you are looking for the control panel that allows you to explore the state-space of the story without blowing up the reactor.

  Here is the ranking of your candidate dimensions from most to least fertile for generating *genuinely new* variations, followed by the identification of the dial that belongs to a different machine entirely.

  ### 1. The Epistemic Gap (Who knows what and when)
  *   **Variation Opened:** This is the most fertile dial because it dictates the genre, the tension, and the moral architecture of the book. Turning this knob shifts the work between mystery (reader knows less than narrator), thriller (reader knows danger before protagonist), tragedy (reader knows fate before protagonist), or irony (reader knows truth while characters lie). It changes the *logic* of the plot, not just the texture.
  *   **Break Point:** The concept dissolves if the gap closes completely (a report with no suspense or discovery) or widens into unintelligibility (a narrative where the reader lacks the context to interpret events).
  *   **Alone or Combination:** Highly fertile alone, but achieves maximum resonance when combined with **Temporal Stance**. (e.g., A retrospective narrator who *chooses* to withhold information creates a different epistemic gap than an immediate narrator who *lacks* information).

  ### 2. The Temporal Stance (Inside events vs. vantage after)
  *   **Variation Opened:** This alters the physics of causality and the theme of agency. A story told in the "heat of the moment" (present tense or close past) is about survival and uncertainty. A story told from a distant vantage (retrospective memoir) is about memory, regret, and the inevitability of fate. It changes the *weight* of every decision the characters make.
  *   **Break Point:** The book becomes unrecognizable if the stance shifts so far that the narrative voice loses its connection to the character's consciousness (becoming a dry chronicle) or becomes so immediate it loses the ability to reflect (becoming a transcript).
  *   **Alone or Combination:** Powerful alone, but often requires **Register** to sustain the voice required by the stance (e.g., a retrospective voice usually demands a more complex syntax).

  ### 3. The Degree of Formal Repetition (Revisiting the central scene)
  *   **Variation Opened:** This controls the philosophical argument of the novel. A linear progression argues for growth or decay. A cyclical repetition (returning to the same scene with new information) argues for entrapment, trauma, or the multifaceted nature of truth (*Rashomon* effect). It changes how the reader *processes* time and memory.
  *   **Break Point:** If the repetition is too literal, the book feels broken or glitched. If it is too loose, it feels like mere recurrence rather than structural intent. The concept breaks when the repetition ceases to yield new meaning.
  *   **Alone or Combination:** Rarely fertile alone; it requires the **Epistemic Gap** to ensure that each revisit offers new information, otherwise it is just redundancy.

  ### 4. The Constraint Regime (Rules the prose must obey)
  *   **Variation Opened:** Constraints force invention by blocking the path of least resistance. A "ban on interiority" forces a behavioral novel (Camus); a "restricted vocabulary" forces precision (Beckett). This knob generates novelty by subtraction, compelling you to find routes into the story you would not have otherwise seen.
  *   **Break Point:** The concept vanishes when the constraint becomes the point of the book (Oulipo exercise) rather than a vessel for the story. If the reader notices the constraint more than the narrative, the concept has been replaced by the gimmick.
  *   **Alone or Combination:** Most fertile in combination with **Register**. A constraint often dictates a specific rhythm or diction; trying to apply a constraint without adjusting the voice often results in stilted prose.

  ### 5. The Register of the Voice (Diction and rhythm)
  *   **Variation Opened:** This changes the emotional temperature and the intimacy of the contract with the reader. Shifting from lyrical to clinical, or from vernacular to elevated, changes how the reader *feels* about the events. However, it is less fertile than the above because the *events* and *truths* of the story often remain static; only the coloration changes.
  *   **Break Point:** The book becomes a parody or pastiche if the register shifts too far from the inherent tone of the subject matter (e.g., slapstick diction for a tragic subject).
  *   **Alone or Combination:** Least fertile alone. Voice is usually the *result* of the other dials (time, knowledge, constraint). Tweaking voice without adjusting the underlying structure often feels like cosmetic rearrangement.

  ***

  ### The Different Machine: (3) The Unit at Which I Revise

  You asked to identify the dial that does not vary the concept but replaces it, or belongs to a different machine. **The Unit of Revision is that dial.**

  Here is why: The other five dimensions are properties of the **artifact** (the novel as experienced by the reader). They define the narrative contract, the structure, and the texture of the finished work.

  The **Unit of Revision** (sentence vs. scene vs. architecture) is a property of the **process** (the novel as manufactured by the writer). It is a dial on the *author*, not the *book*.

  *   **Why it is not fertile for variation:** You can revise a book sentence-by-sentence or scene-by-scene and arrive at the *exact same text*. Changing this dial does not generate a new variation of the story concept; it generates a different workflow for the craftsman.
  *   **Why it replaces the concept:** If you mistake this for a creative dial, you risk confusing *activity* with *invention*. Spending your remaining effort here means you are optimizing the factory, not redesigning the product. In the Hofstadterian sense, this knob does not move you through the "neighborhood" of the story's possibilities; it merely changes the speed at which you walk through it.

  **Recommendation:** Lock the **Unit of Revision** dial at whatever setting allows you to work efficiently, and spend your creative energy turning the **Epistemic Gap** and **Temporal Stance**. Those are the dials that will tell you what book you are actually writing.
