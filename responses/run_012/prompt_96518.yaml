      *   *The Logic:* Walk through the Fitch derivation using $\mathcal{K}$ (community knowledge) and $\Diamond_{res}$ (resource-feasible).
      *   *The Break Point:* Identify where the bounded nature stops the collapse.
          *   Focus on the conjunction $p \land \neg \mathcal{K} p$.
