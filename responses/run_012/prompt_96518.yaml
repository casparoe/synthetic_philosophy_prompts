      *   *Temporal Indexing (The Best Fit):* Treat truth claims as time-stamped. $p$ is knowable *at time t*. Once known at $t+1$, the condition changes.
      *   *Operationalizing "Knowability":* Shift from "Can be known" to "Has been verified." (Verificationism).

