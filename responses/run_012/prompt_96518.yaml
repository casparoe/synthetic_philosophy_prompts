      *   *Change of Subject?* Yes, but a desirable one. It moves from Truth to *Warranted Entry*.
      *   *Repairs:*
          *   *Restriction:* Too hard to police.
          *   *Weakening Closure:* Good, but implicit in "finite methods."
          *   *Standpoints/Versioning:* Too heavy.
          *   *Recommendation:* Temporal Indexing + Verificationism.
      *   *Practical Implication:* The "Single Most Important" takeaway.
          *   Don't store "Truths." Store "Verifications."
          *   Implement a "State-Change Protocol." When a proposition is entered, it changes the epistemic landscape.
