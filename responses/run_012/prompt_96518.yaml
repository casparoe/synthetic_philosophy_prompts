          *   In FK, verifying $p$ changes the truth value of $\neg \mathcal{K} p$.
          *   Therefore, the conjunction is *unstable* under the operation of verification.
      *   *Idealizations:*
          *   *Atemporality:* Standard Fitch assumes knowledge is a state, not an event. FK treats it as an event.
          *   *Omniscience:* FK avoids knowing all consequences.
