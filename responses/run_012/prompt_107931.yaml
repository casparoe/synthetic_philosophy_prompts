prompt: |-
  I'm the data governance lead at a company that swallowed a competitor last year, and my main job is running the shared data dictionary -- deciding when a term one team uses and a term another team uses are actually the same term and can be merged into a single definition, and when they only look alike and have to be kept seperate. We get a dozen or so of these alignment tickets a month and they aren't trivial: they end up in dashboards, in the numbers we hand the regulator, and in a few cases in people's bonuses. A bad merge is expensive, and a pointless separation is expensive in a different way.

  I need a procedure a bright junior analyst with no philosophy training can run in an afternoon, that I can sign off on, with legal signing off separately on anything feeding a regulatory report. So: ordered questions, what counts as a sufficient answer to each, where it stops with a flat no, and where it hands the decision to a person because the question is values rather than facts.

  The frame I want it built on is the semantic externalism stuff -- Twin Earth, if you know it. The bit I actually care about is that what a term means isn't fixed just by the description the user carries round in their head; it's fixed partly by the environment the term gets used in, and partly by the community whose usage the term is answerable to. So two teams can write the same sentence-long definition and still be picking out different things, and two teams can write completely different definitions and be picking out the same thing. I want that made operational.

  Roughly I'm imagining three tests run in order, but redo this if you think the philosophy says otherwise: (1) a swap test -- hold the definition fixed, change the environment the term is used in, ask whether the set of things it picks out would change; (2) a deference test -- ask whose usage the team's term is actually answerable to, the local environment or some external expert body (the regulator, a standards body, the clinicians), and where it's the latter, treat the expert body's usage as fixing the meaning even if the team has it wrong; (3) a duplicate test -- different descriptions, same things picked out, so merging is safe.

  Then run it on three cases: (a) 'recyclable' as used by our two packaging teams, where the wording of the definition is identical but the collection and processing setups in the two markets aren't; (b) 'active user', where the two teams' descriptions differ but both track the same underlying events; (c) the one my boss will hate -- a term we very much want to merge because one number would be simpler for the board, but where the procedure says no.

  Be honest about the limits. Tell me which steps are just judgement calls dressed up as procedure, and whether the externalism framing actually earns its keep here or whether plain old "do they pick out the same things?" would do the same job with less ceremony. Tell me what the procedure can't do -- I suspect it's useless for the cases where the only thing that matters is what's going on inside the analyst's head, but say so if that's wrong. And say how confident you are in the philosophical claims you're leaning on; I'd rather you flag the bits you're shaky on than sound authoritative, and single out the one step you dont think will survive contact with our actual tickets.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Data Governance Lead.
      *   **Context:** Post-merger integration, managing a shared data dictionary.
      *   **Problem:** Deciding when to merge or separate data terms (definitions) from different teams. High stakes (dashboards, regulators, bonuses).
      *   **Constraint:** Needs a procedure for a bright junior analyst (no philosophy training) to run in an afternoon. Needs sign-off capability.
      *   **Philosophical Frame:** Semantic Externalism (Putnam, Twin Earth). Meaning isn't just in the head (description); it's fixed by environment and community usage.
      *   **Proposed Tests:** (1) Swap Test (Environment), (2) Deference Test (Authority), (3) Duplicate Test (Extension).
      *   **Task:** Refine/Build the procedure based on this frame, run it on three specific cases, critique the limits/utility of the frame, and be honest about confidence/uncertainty.

  2.  **Deconstruct the Philosophical Frame (Semantic Externalism):**
      *   *Core Idea:* "Meanings just ain't in the head." (Putnam).
      *   *Twin Earth:* Water = H2O on Earth, XYZ on Twin Earth. Same mental state, different referent.
      *   *Division of Linguistic Labor:* Experts fix the extension of terms (e.g., "elm" vs. "beech" for laypeople, or medical terms).
      *   *Relevance to Data Governance:* Two teams might define "Customer" identically in text, but if one pulls from a CRM and the other from a Billing System (different environments), they might mean different things. Conversely, "Churn" might be defined differently but calculate the same underlying reality.
      *   *Critique:* Is this overkill? "Do they pick out the same things?" (Extension) is basically what externalism cares about. The *value* of externalism here is emphasizing *why* they pick out different things (context/source/authority) rather than just checking the output. It forces the analyst to look *outside* the definition text.

  3.  **Drafting the Procedure (The "Externalist Alignment Protocol"):**
      *   *Goal:* Operationalize Putnam/Burge for a junior analyst.
      *   *Structure:* Ordered questions, stop conditions, escalation points.
      *   *Refining the Tests:*
          *   Test 1 (Environment/Source): Instead of a hypothetical "swap," make it concrete. "If we swap the data source, does the value change?"
          *   Test 2 (Authority/Deference): Who decides if it's right or wrong? Regulator? Internal standard?
          *   Test 3 (Extension/Overlap): Do they actually map to the same rows/records?
      *   *Decision Logic:* Merge only if Extension matches *and* Authority aligns *and* Environment is compatible.

  4.  **Running the Cases:**
      *   *Case A (Recyclable):* Same definition text, different markets (environments). Externalism says: Different meaning because the physical reality (processing capability) differs. *Result: Do Not Merge.*
      *   *Case B (Active User):* Different text, same events. Externalism says: Same meaning if the causal link to the event is the same. *Result: Merge.*
      *   *Case C (The Boss's Favorite):* Want to merge for simplicity, but reality says no. Externalism provides the philosophical shield to say "No." *Result: Do Not Merge (Escalate).*

  5.  **Critiquing the Frame (The "Honesty" Section):**
      *   *Does it earn its keep?* Yes, because it stops people from staring at definition text. It forces look at *source* and *authority*. Plain "do they pick out the same things" often leads to checking the definition text, not the data lineage.
      *   *Limits:* It can't solve political fights. It can't solve cases where the "environment" is purely internal logic.
      *   *Confidence:* High on the utility of "Division of Linguistic Labor" (Regulators/Experts). Moderate on "Twin Earth" analogies in corporate data (data is already abstract).
      *   *Weakest Step:* The "Swap Test." In data, you can't always swap sources easily. It needs to be a lineage check, not a hypothetical.

  6.  **Refining the Output:**
      *   *Tone:* Professional, direct, slightly academic but pragmatic.
      *   *Format:* Procedure Manual style, followed by Case Studies, followed by Critical Reflection.
      *   *Specific Instructions:* Address the "junior analyst" constraint. Address the "legal sign-off" constraint. Address the "confidence" requirement.

  7.  **Self-Correction/Iterative Thought during Drafting:**
      *   *Initial thought:* Maybe keep the "Swap Test" exactly as Putnam intended.
      *   *Correction:* No, an analyst can't simulate Twin Earth. They need to check *Data Lineage*. If Team A uses SAP and Team B uses Salesforce, that's the "Environment."
      *   *Initial thought:* Is Externalism actually useful?
      *   *Correction:* It's useful because it validates *separation* even when definitions match. Most governance fails by merging too early based on text. Externalism justifies keeping them separate based on context.
      *   *Confidence Check:* I need to admit that "meaning" in data governance is often just "calculation logic." Externalism adds a layer of "business context." I should flag that distinction.
      *   *The "Boss" Case:* This is the most important one. The procedure needs to give the analyst cover to say "No" to power.

  8.  **Final Polish:** Check against all constraints in the prompt.
      *   Ordered questions? Yes.
      *   Sufficient answers? Yes.
      *   Stop conditions? Yes.
      *   Three cases run? Yes.
      *   Limits/Honesty? Yes.
      *   Confidence levels? Yes.
      *   One step likely to fail? Yes (The Swap Test needs modification).

  9.  *(Self-Correction on the "Swap Test")*: The prompt asks me to run the procedure *as imagined* but redo if philosophy says otherwise. Philosophy says the *causal connection* matters. A hypothetical swap is good for thought experiments, but for data, we need to check the *actual* causal chain. I will modify the "Swap Test" to a "Source/Context Test" to make it operational, explaining why.

  10. *(Final Review of the "Boss Case")*: Make sure the procedure explicitly flags this as a "Values/Politics" escalation, not a fact check.

  11. *(Confidence Rating)*: Be specific. High confidence on the Deference test (Burge). Lower confidence on the Swap test (Putnam) in a corporate context.

  Let's write it.cw
answer: |-
  Here is the operational procedure, the case runs, and the honest critique you asked for.

  ### Part 1: The Externalist Alignment Protocol (EAP)
  **Version:** 1.0
  **Operator:** Junior Data Analyst
  **Timebox:** 3 Hours per ticket
  **Goal:** Determine if Term A and Term B are semantically identical (Merge) or distinct (Separate).

  **Philosophical Premise:** A data term's meaning is not defined by its text description, but by (1) the data source/environment it is causally connected to, and (2) the authority community that validates its correctness.

  #### Step 1: The Context Swap (The "Twin Earth" Check)
  *Goal: Determine if the environment fixes the extension.*

  **Question:** If we took Team A's *exact* definition text and calculation logic, but applied it to Team B's *data source* and *market context*, would the resulting number change significantly (>1% variance)?
  *   **Evidence Required:** Lineage diagrams, sample data comparison from both sources, documentation of market/regulatory differences.
  *   **Sufficient Answer for "Same":** No significant variance. The data behaves identically in both environments.
  *   **Sufficient Answer for "Different":** Significant variance. The term picks out different subsets of reality because the underlying infrastructure or market reality differs.
  *   **Stop Condition:** If **Different**, mark as **SEPARATE**. Do not proceed. This is a factual divergence in reference.
  *   **Escalation:** If the variance is unexplained or the sources cannot be compared technically, escalate to Data Engineering.

  #### Step 2: The Authority Deference (The "Division of Labor" Check)
  *Goal: Determine who fixes the meaning.*

  **Question:** Who has the authority to declare this term "wrong"? Is it the internal team owning the data, or an external body (Regulator, Standards Body, Clinical Board)?
  *   **Evidence Required:** Regulatory citations, industry standard documents (e.g., GAAP, ISO), internal governance charters.
  *   **Sufficient Answer for "Same":** Both terms defer to the *same* external authority, OR both defer to the *same* internal business owner.
  *   **Sufficient Answer for "Different":** Term A defers to a Regulator (e.g., "Capital" for Basel III), Term B defers to Internal Management (e.g., "Capital" for Bonus calculation).
  *   **Stop Condition:** If **Different**, mark as **SEPARATE**. Even if the numbers match today, the *conditions of correctness* differ.
  *   **Escalation:** If it is unclear who holds authority, escalate to Legal/Compliance. **Do not merge terms feeding regulatory reports without Legal sign-off.**

  #### Step 3: The Extension Overlap (The "Duplicate" Check)
  *Goal: Determine if the descriptions differ but the referent is identical.*

  **Question:** Do the two terms track the exact same underlying events/records, despite using different wording or logic to get there?
  *   **Evidence Required:** Record-level matching (IDs), event timestamp comparison.
  *   **Sufficient Answer for "Same":** 100% (or near 100%) record overlap. The definitions are just different "paths" to the same "place."
  *   **Sufficient Answer for "Different":** Systematic exclusion/inclusion differences (e.g., one includes trial users, the other doesn't).
  *   **Stop Condition:** If **Different**, mark as **SEPARATE**.
  *   **Escalation:** If **Same**, mark as **MERGE CANDIDATE**.

  #### Final Decision Matrix
  1.  **Context Swap = Different** → **SEPARATE** (Fact)
  2.  **Authority Deference = Different** → **SEPARATE** (Policy/Risk)
  3.  **Context = Same** AND **Authority = Same** AND **Extension = Same** → **MERGE** (Efficiency)
  4.  **Context = Same** AND **Authority = Same** BUT **Extension = Different** → **ESCALATE** (This is a values/business logic conflict, not a semantic one).

  ---

  ### Part 2: Case Runs

  #### Case A: 'Recyclable' (Packaging Teams)
  *   **Context:** Team UK and Team US. Definition text is identical ("Material capable of being reprocessed").
  *   **Step 1 (Context Swap):** UK term relies on UK municipal infrastructure. US term relies on US infrastructure. If you apply the UK logic to US waste streams, the physical outcome changes (material is sent to landfill in US, recycled in UK).
      *   *Result:* **Different.**
  *   **Decision:** **SEPARATE.**
  *   **Rationale:** Externalism wins here. The "stuff" in the world is different. Merging them creates a false equivalence that could trigger greenwashing claims. The text is the same, the meaning (reference) is not.

  #### Case B: 'Active User' (Product Teams)
  *   **Context:** Team Mobile (iOS) and Team Web. Mobile defines as "App Open." Web defines as "Session Start > 30s."
  *   **Step 1 (Context Swap):** If we apply Mobile logic to Web, do we get the same cohort? Roughly, yes. The infrastructure difference (App vs. Browser) doesn't change the *concept* of engagement materially.
      *   *Result:* **Same.**
  *   **Step 2 (Authority Deference):** Both defer to the internal VP of Product. No regulatory constraint.
      *   *Result:* **Same.**
  *   **Step 3 (Extension Overlap):** Record matching shows 98% overlap in user IDs flagged as active across platforms for the same period.
      *   *Result:* **Same.**
  *   **Decision:** **MERGE.**
  *   **Rationale:** Different descriptions, same referent. The "Division of Labor" is internal and shared.

  #### Case C: 'Adjusted EBITDA' (The Boss's Favorite)
  *   **Context:** Finance (Regulatory) vs. Strategy (Board Deck). Boss wants one number for the Board.
  *   **Step 1 (Context Swap):** Both pull from the General Ledger.
      *   *Result:* **Same.**
  *   **Step 2 (Authority Deference):** Finance term defers to SEC/GAAP rules. Strategy term defers to the CEO/Board preferences (non-GAAP).
      *   *Result:* **Different.**
  *   **Decision:** **SEPARATE.** (Escalate to CFO/Legal).
  *   **Rationale:** This is the "Twin Earth" trap. On Earth (Finance), "Adjusted EBITDA" means X. On Twin Earth (Strategy), "Adjusted EBITDA" means Y. If you merge them, you corrupt the regulatory term with the strategic term. The procedure protects you from the Boss. You cannot merge because the *conditions of correctness* are different.

  ---

  ### Part 3: Honest Critique & Limits

  #### Does the Externalism Frame Earn Its Keep?
  **Yes, but narrowly.**
  If you just asked "Do they pick out the same things?" (Extension), a junior analyst would likely stop at the definition text. They would see "Recyclable = Recyclable" and merge Case A.
  Externalism forces the analyst to look *outside* the database. It forces them to ask: "What in the world makes this true?" and "Who can tell us we are wrong?"
  *   **Value Add:** It prevents "Textualism" (merging based on definition strings) and prevents "Numerology" (merging because the numbers look similar today). It anchors meaning in *source* and *authority*.
  *   **Ceremony Cost:** It adds friction. You have to check lineage and compliance docs, not just SQL. That friction is the feature, not the bug. It slows down bad merges.

  #### Where is this just dressed-up judgement?
  **Step 1 (The Context Swap).**
  In philosophy, the Twin Earth thought experiment is intuitive. In data, "swapping environments" is often technically impossible or ill-defined.
  *   *The Problem:* How much variance is too much? 1%? 5%? The procedure says ">1%", but that's an arbitrary business threshold disguised as a semantic test.
  *   *The Risk:* An analyst might decide two terms are "Different" because of a data quality glitch, not a semantic difference. This requires a Data Engineering sanity check, which blows the "afternoon" timebox.

  #### What can this procedure NOT do?
  1.  **Political Wars:** Case C shows this. The procedure says "Separate." The Boss says "Merge." The procedure gives you the *ammunition* to say no (Legal/Regulatory risk), but it cannot stop the Boss from overruling you. It shifts the liability, it doesn't remove it.
  2.  **Internal Logic Loops:** If a term is purely internal (e.g., "High Value Lead") and has no external anchor (no regulator, no physical reality), Externalism loses grip. The "Environment" is just the SQL query. In those cases, plain old "Do they calculate the same thing?" is sufficient. Externalism is overkill for purely constructed metrics.
  3.  **Analyst Head-Space:** You suspected this, and you're right. If the difference is purely about *intent* (e.g., Team A tracks "Revenue" to manage cash flow, Team B tracks "Revenue" to manage sales commissions), but the data is identical, this procedure says **MERGE**.
      *   *Why?* Because the Extension and Authority are the same.
      *   *The Risk:* You might merge them technically, but the *usage* will diverge later. Externalism handles "World" and "Community," but it struggles with "Purpose."

  #### Confidence Levels & The Weak Link
  *   **High Confidence:** **Step 2 (Authority Deference).** This is the strongest operationalization of Hilary Putnam's "Division of Linguistic Labor." In a regulated industry, knowing *who* defines the term is more important than *how* they define it. This step will save you from compliance fines.
  *   **Medium Confidence:** **Step 3 (Extension Overlap).** Standard data profiling. Reliable, but computationally expensive on large tables.
  *   **Low Confidence (The Weak Link):** **Step 1 (The Context Swap).**
      *   *Why it will fail:* In a merged company, "Environments" are often messy hybrids. Team A might be on AWS, Team B on Azure, but they are both pulling from the same legacy mainframe. The "Environment" isn't a clean variable.
      *   *Prediction:* This step will generate the most false positives (flagging things as Different when they are effectively the same). I recommend relaxing this to a "Source Lineage Check" rather than a hypothetical "Swap." Ask: "Do they touch the same physical systems?" rather than "What if we swapped them?"

  #### Final Recommendation
  Keep the **Authority Deference** test as the hard gate. That is where the externalist philosophy pays for itself in risk mitigation. Simplify the **Context Swap** to a **Source Lineage** check to make it feasible for a junior analyst.

  If you implement this, you are no longer just managing definitions; you are managing **liability**. That is worth the ceremony.
