      Let's refine the "Weightless" critique. The device is weightless because it assumes the data gathered is worth the cost. The philosophical question is: **Is uncertainty better than injustice?** Or: **Is it permissible to harm a few to calibrate the model for the many?** This is the Trolley Problem institutionalized. That is HEAVY.

