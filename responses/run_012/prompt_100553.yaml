  # Session Plan: The Proof Market

  ## 1. Overview and Learning Objectives
  *   **Topic:** Constructive vs. Classical Logic (Intuitionism).
  *   **Time:** 75 Minutes.
  *   **Students:** 14 (7 Pairs).
  *   **Goal:** Students will experience the friction of non-constructive proofs by playing a game where standard classical moves are blocked by procedural rules. They will feel the inability to produce a witness for an existence claim and the gap between $\neg \forall$ and $\exists \neg$.
  *   **Constraint:** Do not mention "Intuitionism," "Constructivism," or "Brouwer" until the Debrief (last 10 minutes).

  ## 2. Materials
  *   **The Ledger:** A whiteboard divided into two columns: "Accepted Claims" and "Pending/Rejected."
  *   **Proof Tokens:** 30 physical tokens (poker chips, coins, or slips of paper).
  *   **Round 1 Handout:** The Target Theorem and definitions.
  *   **Round 2 Props:** 5 opaque envelopes (labeled A–E), 4 Gold Star stickers, 1 Silver Star sticker, a digital scale (optional, for show).
  *   **Scoreboard:** A list of the 7 pairs and their scores.

  ## 3. Roles
  *   **The Verifier (Instructor):** You are not a teacher during the game. You are a bureaucratic algorithm. You do not explain *why* a rule exists; you only enforce it. You are neutral, dry, and consistent.
  *   **The Provers (Students):** Work in pairs. They propose claims to be entered on the Ledger.
  *   **The Ledger:** The single source of truth. If it isn't on the Ledger, it doesn't exist for the purposes of the game.

  ## 4. The Rules of the Ledger
  Post these visibly before the session starts.

  1.  **Existence Rule:** To enter a claim of the form "There exists an $x$ such that $F(x)$," you must write the specific object $x$ next to the claim. If the properties of $x$ are disputed, you must prove $x$ has the required properties.
  2.  **Disjunction Rule:** To enter a claim of the form "$P$ or $Q$," you must commit to one disjunct ($P$ *or* $Q$) and provide a defense for that specific disjunct. "One of them must be true" is not a defense.
  3.  **Universal Refutation Rule:** To enter a claim of the form "It is not the case that for all $x, F(x)$," you may assume $\forall x F(x)$, derive a contradiction, and enter the negation without producing a specific counterexample.
  4.  **Scoring:** 1 Token per accepted claim. 10 Tokens for the Target Theorem in Round 1. 10 Tokens for the Target Theorem in Round 2.

  ---

  ## 5. Minute-by-Minute Timeline

  ### 00:00 – 00:10: Setup and Rules
  *   Distribute students into 7 pairs.
  *   Point to the Ledger and the Rules.
  *   **Script:** "Welcome to the Proof Market. I am the Verifier. My only job is to check claims against the Ledger Rules. I do not judge truth; I judge compliance. You are Provers. Your goal is to accumulate Tokens by getting claims onto the Ledger. The game begins now."

  ### 00:10 – 00:40: Round 1 (The Irrational Power)
  *   **The Target:** "There exist irrational numbers $a$ and $b$ such that $a^b$ is rational."
  *   **The Trap:** Students will attempt the classical proof involving $\sqrt{2}^{\sqrt{2}}$.
  *   **The Action:**
      *   Pairs will draft proofs.
      *   They will approach the Ledger to claim the theorem.
      *   **Verifier Action:** Demand the witnesses ($a$ and $b$).
      *   **The Block:** When they offer the two-case argument, invoke **Rule 2 (Disjunction)**. They must commit to whether $\sqrt{2}^{\sqrt{2}}$ is rational or irrational to validate the witness. They cannot.
      *   Allow them to struggle. If they try to register "Either Pair 1 or Pair 2," reject it under Rule 1 (Existence requires *a* witness, not a disjunction of witnesses).
  *   **End of Round:** No pair should successfully claim the Target Theorem. Some may claim smaller lemmas (e.g., "$\sqrt{2}$ is irrational") which you accept.

  ### 00:40 – 00:50: Transition and Round 2 Setup
  *   Collect Round 1 materials. Reset the Ledger (wipe "Pending," keep "Accepted" lemmas if useful, but ideally clear the board for a fresh context).
  *   **Props:** Place the 5 envelopes (A, B, C, D, E) on the table.
  *   **The Secret:** You have placed 4 Gold Stars and 1 Silver Star inside. You know which is which. They do not.
  *   **The Premise (Write on Board):** "The total weight of the 5 envelopes is 200g. A Gold Star envelope weighs 50g. A Silver Star envelope weighs 40g."
  *   **The Target:**
      1.  Claim A: "Not every envelope contains a Gold Star." ($\neg \forall x G(x)$)
      2.  Claim B: "There exists an envelope that does not contain a Gold Star." ($\exists x \neg G(x)$)
  *   **Constraint:** Provers cannot touch, weigh, or open the envelopes. They must use logic.

  ### 00:50 – 01:05: Round 2 (The Quantifier Gap)
  *   **The Action:**
      *   Pairs will quickly prove Claim A via calculation ($5 \times 50 = 250 \neq 200$). Accept this under **Rule 3**.
      *   Pairs will attempt Claim B. To do so, they must name an envelope (e.g., "Envelope A is not Gold").
      *   **The Block:** Invoke **Rule 1**. "Is Envelope A definitely Silver?" They cannot know. Any specific envelope *could* be Gold (since there are 4 Gold, 1 Silver).
      *   They will try to say "One of them is Silver." Reject under Rule 1 (Existence requires a specific witness).
  *   **End of Round:** Claim A is on the Ledger. Claim B is not.

  ### 01:05 – 01:15: The Debrief (Lecture)
  *   Stop the game. Reveal the secret (which envelope was Silver).
  *   **Naming:** Introduce "Intuitionistic Logic" or "Constructivism."
  *   **Mapping:**
      *   **Rule 1 (Existence):** Encodes the constructive requirement that existence means *constructibility*. You cannot claim something exists unless you can point to it.
      *   **Rule 2 (Disjunction):** Encodes the rejection of the Law of Excluded Middle ($P \lor \neg P$) for undecidable propositions. Truth requires verification.
      *   **Round 1 Failure:** The classical proof of the irrational power theorem relies on LEM. It proves existence without providing a method to find the witness. The game forced you to feel the cost of that omission.
      *   **Round 2 Failure:** Demonstrates that $\neg \forall x F(x)$ does not intuitionistically imply $\exists x \neg F(x)$. Classically, these are equivalent. Constructively, knowing "not all are Gold" is weaker than knowing "here is a non-Gold one."
  *   **Philosophical Point:** Meaning is use. To say "there is" means "I can produce." To say "or" means "I can choose."

  ---

  ## 6. Verifier Script (For Rejections)
  *Memorize the tone: Flat, administrative, unapologetic.*

  *   **When they offer the two-case proof without committing:**
      "Claim rejected. You have asserted a disjunction: 'Either $x$ is rational or $x$ is irrational.' Rule 2 requires commitment to one disjunct. Which one is it? If you cannot defend the specific disjunct, the claim cannot be entered."

  *   **When they say 'But it must be one or the other!':**
      "The Ledger records established claims, not metaphysical necessities. Rule 2 is in effect. Please specify which disjunct you are claiming."

  *   **When they try to register the witness $\sqrt{2}^{\sqrt{2}}$ without knowing its status:**
      "Claim rejected. To enter 'There exist irrational $a, b$,' you must verify that your witness $a$ is irrational. You have not established the irrationality of this number. The witness is invalid."

  *   **When they try to claim 'Envelope A is Silver' in Round 2:**
      "Claim rejected. Rule 1 requires a witness. You have identified Envelope A, but you have not established that it lacks the Gold property. It is consistent with the premises that A is Gold. The witness is unverified."

  *   **When they accuse you of hiding information:**
      "The constraints are not about my knowledge. They are about your derivation. The Ledger Rules define what counts as a proof in this market. You have not satisfied Rule 1."

  ---

  ## 7. Troubleshooting: Predictable Failures

  **1. Pairs trying to register a witness they cannot identify.**
  *   *Scenario:* A pair writes $a = \sqrt{2}^{\sqrt{2}}$ and insists that is the witness.
  *   *Fix:* Ask the verification question: "Is $a$ irrational?" If they say "Yes," ask for the proof. If they say "We don't know, but it doesn't matter," reject the claim. "The Ledger requires the property to be established for the witness to be valid."

  **2. Students treating the undecided property as decidable.**
  *   *Scenario:* "We know $\sqrt{2}^{\sqrt{2}}$ is either rational or irrational, so we can proceed."
  *   *Fix:* Stick to Rule 2. "That is a classical assumption. In this Market, Disjunction requires commitment. Commit to 'Rational' or commit to 'Irrational.' If you cannot, the step is invalid."

  **3. Accusations that the Verifier is being unfair.**
  *   *Scenario:* "This is impossible! The theorem is true!"
  *   *Fix:* "The theorem may be true in classical mathematics. This game operates under Ledger Rules. You are scoring points for compliance, not for ontological correctness. Adapt your strategy to the rules."

  **4. Round 2 becomes a search problem.**
  *   *Scenario:* Students try to deduce which envelope is Silver by asking you questions like "Is A Gold?"
  *   *Fix:* "I do not answer queries about specific envelopes. You must derive the claim from the Premises and the Rules. Empirical investigation is prohibited."
  *   *Prevention:* Make the envelopes sealed and keep them in front of you, out of reach.

  **5. One pair figures it out and spoils the debrief.**
  *   *Scenario:* A student shouts "It's intuitionistic logic!" in minute 30.
  *   *Fix:* "Speculation on the meta-game is not a claim that earns Tokens. Please focus on the Ledger." (Then, in debrief, acknowledge their insight but ensure you still drive the point home for the room).

  ---

  ## 8. Limitations: What This Activity Cannot Do
  *Be honest about this in your own preparation.*

  This activity successfully simulates the *restrictions* of constructivism, but it cannot fully reproduce the *motivation*.
  *   **The Missing Feature:** The activity enforces constructivism by *fiat* (arbitrary rules). It does not show *why* a mathematician would voluntarily choose these rules (e.g., to ensure computational content, to avoid paradoxes in infinite sets, or to align truth with verification).
  *   **Your Burden:** In the debrief, you must supply the philosophical motivation. Explain that for a constructivist, these rules aren't a game handicap; they are a demand for meaning. "To exist" should mean "to be found." If you do not supply this, the session risks feeling like a logic puzzle with arbitrary constraints rather than a philosophical investigation into the nature of mathematical truth.
