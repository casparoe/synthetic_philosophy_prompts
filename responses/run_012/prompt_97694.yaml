      *   **Core Concept:** A lab with 12 panels (6 left, 6 right). The rule isn't visual features but generative history (left = looks back/recursive, right = looks forward/pre-determined). The images are indistinguishable locally.
      *   **Conflict:** An AI solves standard Bongard sets but fails this one, giving rules that fit all examples but are "wrong" (not the intended generative rule).
      *   **Protagonist:** A grad student who built the generator.
      *   **Themes:** Inductive bias, underdetermination, what constitutes a "concept," shared cognition vs. objective truth.
