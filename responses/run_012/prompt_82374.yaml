prompt: |-
  Alright, so I've been reading LessWrong and SSC for years, and I've somehow ended up running next month's session of our local rationality meetup. I've decided to do teh Pasadena game. You know the one: fair coin, flip until first heads, if it lands on toss n you get (-1)^(n-1) * 2^n / n dollars. The expected value is the alternating harmonic series, which converges to ln 2 if you sum in the natural order, but it's only conditionally convergent, so you can rearrange the terms to get any sum you like. And then there's the Altadena game, which is the same except every payoff is increased by $1, so it strictly dominates the Pasadena game, but its expectation is also not well-defined. The whole thing is a mess for expected utility theory, and I want to teach it to a group of about a dozen people who've read LessWrong casually, know what expected value is, have heard of the St. Petersburg paradox, but aren't mathematicians. I've got 45 minutes. Don't explain the paradox to me -- I get it. Plan how I should explain it. What has to come first? What's the one example that should carry the whole thing, and why that one and not the St. Petersburg game? What misconceptions will they have -- I'm guessing they'll think 'undefined' means 'infinite', or that the game is impossible to play, or that the order of outcomes is just a technicality -- and where in the sequence should I head each one off? What should I leave out at this level, and say so? And what's one question I can ask at the end to see if they actually got why the expectation is undefined rather than infinite, and why the Altadena game is a problem for the dominance principle? Also, at the end, tell me how confident you are in the plan you've given, and single out the point you're least sure about.
