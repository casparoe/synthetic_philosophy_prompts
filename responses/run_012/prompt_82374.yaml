      *   **Audience:** ~12 people, casual LW readers, know EV, heard of St. Petersburg, *not* mathematicians.
      *   **Topic:** The Pasadena Game (and Altadena variant).
      *   **Constraints:** 45 minutes.
      *   **Goal:** Teach the paradox, specifically focusing on *undefined* expectation vs. *infinite*, and the violation of the dominance principle.
      *   **Specific Requirements:**
          *   Plan the sequence (what comes first).
          *   Choose the core example (Pasadena vs. St. Petersburg).
          *   Identify and preempt misconceptions.
          *   Decide what to omit.
          *   Provide a specific comprehension check question.
          *   Self-evaluate confidence and uncertainty.

  2.  **Deconstruct the Content (The Pasadena Game):**
      *   *Mechanism:* Flip coin until Heads ($n$). Payoff: $(-1)^{n-1} \frac{2^n}{n}$.
      *   *Probabilities:* $P(n) = 1/2^n$.
      *   *Expected Value Terms:* $P(n) \times \text{Payoff}(n) = \frac{1}{2^n} \times (-1)^{n-1} \frac{2^n}{n} = \frac{(-1)^{n-1}}{n}$.
      *   *Series:* $1 - 1/2 + 1/3 - 1/4 ...$ (Alternating Harmonic Series).
      *   *Math Property:* Conditionally convergent. Sum depends on order. Riemann Rearrangement Theorem applies.
      *   *Altadena Variant:* Payoff + $1$. Terms become $\frac{(-1)^{n-1}}{n} + \frac{1}{2^n}$. Wait, the prompt says "every payoff is increased by $1".
          *   Let's check the Altadena math.
          *   Pasadena Payoff: $X_n$. $E[X] = \sum \frac{1}{2^n} X_n = \sum \frac{(-1)^{n-1}}{n}$.
          *   Altadena Payoff: $Y_n = X_n + 1$.
          *   $E[Y] = \sum \frac{1}{2^n} (X_n + 1) = \sum (\frac{(-1)^{n-1}}{n} + \frac{1}{2^n})$.
          *   The $\sum \frac{1}{2^n}$ part converges absolutely to 1.
          *   The $\sum \frac{(-1)^{n-1}}{n}$ part is the problematic conditionally convergent part.
          *   So $E[Y]$ is *also* undefined (undefined + 1 = undefined).
          *   *Dominance:* $Y_n > X_n$ for all $n$. So Altadena strictly dominates Pasadena.
          *   *Paradox:* If EV is the guide, neither has an EV. If we rearrange terms to make them comparable, we can make Pasadena look better than Altadena, violating dominance.

  3.  **Determine the Pedagogical Strategy (45 Minutes):**
      *   *Time Management:* 45 mins is tight for a heavy math/philosophy topic. Need to cut fluff.
      *   *Audience Level:* "Casual LW" means they care about decision theory, Bayesianism, and "winning." They don't want rigorous proofs, they want to know *why their decision algorithm breaks*.
      *   *St. Petersburg vs. Pasadena:* St. Petersburg has *infinite* EV. Pasadena has *undefined* EV. This is the crucial distinction. St. Petersburg is easier to grasp but less paradoxical regarding rearrangement. Pasadena is the core request. I must use Pasadena as the core, but use St. Petersburg as a contrast/foil.
      *   *Key Insight:* The "order of summation" isn't just math pedantry; it represents *how you group outcomes* or *time*. But in a single-shot game, there is no natural order. That's the hook.

  4.  **Drafting the Plan - Section by Section:**

      *   **Intro (5 mins):** Hook them. "EV is supposed to tell you what to do. What if it breaks?" Briefly mention St. Petersburg (Infinite) to distinguish it from today's topic (Undefined).
      *   **The Game (10 mins):** Define Pasadena clearly. Walk through the first 3-4 terms. Show the EV calculation term-by-term. Show the series: $1 - 1/2 + 1/3...$
      *   **The Math Trick (10 mins):** This is the danger zone. Don't prove Riemann Rearrangement. *Show* it. Group positives vs. negatives. Show how you can get $+\infty$, $-\infty$, or $0$.
          *   *Misconception Alert:* "But the coin flips happen in time order!" Counter: EV is a static property of the gamble, not a simulation.
      *   **Altadena & Dominance (10 mins):** Introduce Altadena (+$1 everywhere). Show dominance. Show that EV is *still* undefined.
          *   *Misconception Alert:* "Undefined means Infinity." Correct: Infinity is a specific kind of divergence. Undefined means "depends on how you ask the question."
      *   **Implications & Discussion (10 mins):** What do we do? Bounded utility? Finite bankrolls?
      *   **Check Question:** Needs to test the specific distinction between infinite and undefined, and the dominance violation.

  5.  **Refining the Content (Self-Correction/Optimization):**
      *   *St. Petersburg:* The prompt asks "What's the one example that should carry the whole thing, and why that one and not the St. Petersburg game?"
          *   *Answer:* Pasadena must carry it. St. Petersburg is about *infinite* utility challenging linear value. Pasadena is about *undefined* utility challenging the very existence of an expectation. St. Petersburg can be solved by bounded utility functions. Pasadena breaks even with bounded utility if the probabilities align differently (though standard Pasadena usually assumes unbounded payoffs). Actually, standard Pasadena payoffs grow exponentially ($2^n$), so utility bounds matter. But the *mathematical* paradox is the conditional convergence. I need to make sure I don't get bogged down in utility functions vs. dollar values. Let's stick to dollars for simplicity, noting the assumption of risk neutrality.
      *   *Misconceptions:*
          1.  "Undefined = Infinite." (Crucial to fix).
          2.  "Order matters because time matters." (Crucial to fix - EV is atemporal).
          3.  "This never happens in real life." (True, but the point is normative theory).
      *   *Omissions:* Don't prove Riemann Rearrangement Theorem. Don't get into measure theory ($\sigma$-additivity). Don't solve it (there is no consensus solution).
      *   *The Check Question:* Needs to force them to articulate *why* dominance fails. "If I offer you Game A or Game B, and B pays $1 more in every outcome, but both have undefined EV, which do you pick and why can't EV theory tell you?"

  6.  **Developing the Sequence:**
      1.  **Hook:** EV is the gold standard. Today we break it.
      2.  **Contrast:** St. Petersburg (Infinite) vs. Pasadena (Undefined).
      3.  **The Mechanism:** Walk through the Pasadena sum.
      4.  **The Glitch:** Rearrangement. Use a visual or simple grouping analogy.
      5.  **The Kicker:** Altadena. Dominance violation.
      6.  **Takeaway:** EV isn't fundamental; it's a tool with limits.
      7.  **Question.**

  7.  **Addressing Specific Prompt Requirements:**
      *   *What has to come first?* The distinction between Infinite and Undefined.
      *   *One Example:* Pasadena. St. Petersburg is just the warm-up contrast.
      *   *Misconceptions:* "Undefined = Infinite", "Order = Time", "Real world irrelevance."
      *   *Omissions:* Rigorous analysis, solutions.
      *   *Check Question:* Specific scenario.
      *   *Confidence/Uncertainty:* Need to be honest.

  8.  **Final Polish:**
      *   Tone: Rationalist meetup style (precise, intellectual, but accessible).
      *   Timing: Ensure 45 mins is respected.
      *   Math Check: Ensure the Altadena explanation is clear. If Pasadena is $\sum \frac{(-1)^{n-1}}{n}$, Altadena is $\sum (\frac{(-1)^{n-1}}{n} + \frac{1}{2^n})$. The second part converges absolutely. The sum of a conditionally convergent series and an absolutely convergent series is conditionally convergent. So Altadena is also undefined. This is correct.

      *   *Wait, one nuance:* The prompt says "Altadena game... every payoff is increased by $1".
          *   Pasadena Payoff $P_n = (-1)^{n-1} 2^n / n$.
          *   Prob $p_n = 1/2^n$.
          *   Term $t_n = p_n P_n = (-1)^{n-1} / n$.
          *   Altadena Payoff $A_n = P_n + 1$.
          *   Term $a_n = p_n (P_n + 1) = t_n + 1/2^n$.
          *   Sum $t_n$ is conditionally convergent. Sum $1/2^n$ is absolutely convergent (sums to 1).
          *   Total Sum = (Undefined/Conditionally Convergent) + 1.
          *   Result: Still Undefined.
          *   Dominance: $A_n > P_n$ always.
          *   Paradox: You should prefer A, but EV theory can't rank them, and rearrangement can make A look worse than P.
          *   Okay, the logic holds.

      *   *Confidence:* I'm confident in the pedagogy, less confident in whether 45 mins is enough for non-mathematicians to truly *feel* the rearrangement issue without getting bored or confused. I'll flag that.

  9.  **Constructing the Output:** (Drafting the response based on the above thoughts).
      *   Structure: Plan, Misconceptions, Omissions, Check Question, Confidence.
      *   Voice: Professional, peer-to-peer (I know you know LW).

      *(Self-Correction during drafting)*: Make sure to emphasize *why* Pasadena is better than St. Petersburg for this specific lesson. St. Petersburg breaks *maximization* (how do you maximize infinity?). Pasadena breaks *comparison* (how do you compare two undefined things where one is obviously better?). That's the key differentiator.

      *(Refining the Check Question)*: Make it multiple choice or short answer? Short answer is better for discussion. "Why can't you just say Altadena is EV + 1?"

      *(Refining Misconceptions)*: Add the "Law of Large Numbers" misconception. People think EV is what happens in the long run. In Pasadena, the long run average *does not converge*. That's a strong point to make.

      *(Final Review against constraints)*: 45 mins? Yes. 12 people? Yes. LW background? Yes.

