answer: |-
  Here is a 45-minute lesson plan designed for a rationality meetup audience. It leverages their familiarity with expected utility theory (EUT) to highlight where the formalism cracks, without getting bogged down in measure theory.

  ### The Plan (45 Minutes)

  **1. The Hook & The Distinction (5 Minutes)**
  *   **Start here:** Do not start with the coin flip. Start with the *goal*. "We use Expected Value (EV) to rank choices. Usually, EV is a number. Sometimes, like St. Petersburg, it's $\infty$. Today, we look at a game where EV is **undefined**."
  *   **Why Pasadena and not St. Petersburg?** St. Petersburg is the warm-up; Pasadena is the main event. St. Petersburg breaks *maximization* (how do you beat infinity?). Pasadena breaks *comparison* and *dominance*. In St. Petersburg, the sum diverges to infinity (monotonically). In Pasadena, the sum oscillates. This distinction is vital: **Infinity is a specific value in the extended reals; Undefined means the value does not exist.**
  *   **Action:** Write "Infinite vs. Undefined" on the board. Tell them St. Petersburg is Infinite; Pasadena is Undefined. This is the thesis of the talk.

  **2. The Mechanics of Pasadena (10 Minutes)**
  *   **Setup:** Write the payoff rule: Toss $n$, Payoff $(-1)^{n-1} \frac{2^n}{n}$. Probability $1/2^n$.
  *   **The Calculation:** Walk through the first 4 terms explicitly.
      *   $n=1$: Payoff $2$, Prob $1/2$, Term $+1$.
      *   $n=2$: Payoff $-2$, Prob $1/4$, Term $-1/2$.
      *   $n=3$: Payoff $8/3$, Prob $1/8$, Term $+1/3$.
      *   $n=4$: Payoff $-4$, Prob $1/16$, Term $-1/4$.
  *   **The Series:** Show the EV is the Alternating Harmonic Series: $1 - 1/2 + 1/3 - 1/4 \dots$
  *   **The "Natural" Sum:** Mention that if you sum in order (1, 2, 3...), it converges to $\ln(2) \approx 0.69$.
  *   **Preempting Misconception #1 ("Just sum in order"):** Ask: "Why sum in numerical order?" The outcomes are mutually exclusive events in a probability space, not a time sequence. There is no physical reason $n=1$ must be added before $n=100$ in the *expectation calculation*. EV is an atemporal property of the gamble.

  **3. The Rearrangement Trap (10 Minutes)**
  *   **The Glitch:** Explain conditional convergence simply. "If a series is conditionally convergent, the Riemann Rearrangement Theorem says you can reorder the terms to sum to *any* number, or $\pm \infty$."
  *   **Visual Demo:** Don't prove it. Show it.
      *   Group positives: $1 + 1/3 + 1/5 \dots$ (Diverges to $+\infty$)
      *   Group negatives: $-1/2 - 1/4 - 1/6 \dots$ (Diverges to $-\infty$)
      *   Show that by taking two positives for every negative, you can make the sum $> 1$. By taking one positive for every two negatives, you can make it $< 0$.
  *   **Preempting Misconception #2 ("Undefined means Infinite"):** Reinforce that "Infinite" implies it grows without bound in one direction. "Undefined" here means the value is *path-dependent*. It's not that the value is too big; it's that the question "What is the average?" has no single answer.
  *   **Preempting Misconception #3 ("LLN saves us"):** A casual LW reader might invoke the Law of Large Numbers. Shut this down early. In Pasadena, the sample mean *does not converge* almost surely. If you play this game repeatedly, your average payoff will oscillate forever. It does not settle on $\ln(2)$.

  **4. The Altadena Kicker & Dominance (10 Minutes)**
  *   **The Setup:** Altadena is Pasadena + $1 in every outcome.
  *   **Dominance:** In every possible world state $n$, Altadena pays more. By the **Dominance Principle**, you must prefer Altadena.
  *   **The EV Problem:**
      *   Pasadena EV = $\sum \frac{(-1)^{n-1}}{n}$ (Undefined)
      *   Altadena EV = $\sum (\frac{(-1)^{n-1}}{n} + \frac{1}{2^n})$
      *   The $\sum \frac{1}{2^n}$ part sums to 1 (Absolutely convergent).
      *   The total is (Undefined) + 1 = **Undefined**.
  *   **The Paradox:** EUT cannot tell you to pick Altadena because it cannot assign a value to either. Worse, if you rearrange the Pasadena terms to sum to $+100$ and Altadena terms to sum to $+50$ (which you can do, because both are conditionally convergent), EUT suggests Pasadena is better. This violates Dominance.
  *   **Preempting Misconception #4 ("This is just math pedantry"):** Acknowledge that in the real world, banks have finite money. But the point is *normative*. If EUT is the law of rationality, it should handle coherent thought experiments. If it breaks here, our foundation is shaky.

  **5. Implications & Wrap-up (5 Minutes)**
  *   **What do we do?** Briefly mention the standard "rationalist" exits:
      1.  **Bounded Utility:** If utility is bounded, the $2^n$ growth gets capped, and the series becomes absolutely convergent. (Note: This solves Pasadena but changes the game).
      2.  **Finite Bankroll:** The casino can't pay $2^{100}$.
      3.  **Reject EV:** Maybe EV isn't the fundamental norm (e.g., median maximization, or geometric growth rates).
  *   **Conclusion:** EV is a tool, not a god. It requires absolute convergence to be robust.

  **6. The Comprehension Check (5 Minutes)**
  *   **The Question:** Do not ask them to calculate. Ask this:
      > "Imagine I offer you Game A (Pasadena) or Game B (Altadena). Game B pays exactly $1 more than Game A in every single possible outcome. A friend argues: 'Since Game B is just Game A plus a guaranteed $1, Game B's Expected Value is just Game A's Expected Value plus $1.' Why is this statement mathematically false, and why does that failure break Expected Utility Theory?"
  *   **Desired Answer:** They should identify that you cannot add a constant to an undefined sum ($\text{Undefined} + 1 \neq \text{Defined}$). Because both remain undefined, EV theory cannot rank them, violating the dominance principle which says B *must* be preferred.

  ---

  ### What to Leave Out
  1.  **Measure Theory:** Do not mention $\sigma$-additivity or Lebesgue integration. It adds jargon without intuition.
  2.  **The Proof of Riemann Rearrangement:** Just state the theorem and show the grouping intuition. Proofs eat time.
  3.  **Solutions:** Do not spend time debating which solution (bounded utility, etc.) is "correct." There is no consensus. Your goal is to break their confidence in naive EV, not rebuild it.
  4.  **St. Petersburg Deep Dive:** Use it only as a contrast. If you spend time solving St. Petersburg, you won't have time for Pasadena.

  ### Confidence & Uncertainty
  **Confidence Level:** 85%
  This plan is structurally sound for the audience profile. It respects their intelligence while managing the time constraint by cutting rigorous proofs in favor of conceptual intuition.

  **Point of Least Certainty:**
  I am least sure about the **10-minute slot for "The Rearrangement Trap."**
  Explaining *why* order matters in a sum of probabilities to non-mathematicians without them dismissing it as "cheating" is difficult. There is a risk they will cling to the "natural order" ($n=1, 2, 3\dots$) as the "true" EV because it matches the timeline of coin flips. If the group pushes back hard on "why can't we sum in time order?", you may need to steal time from the "Implications" section to explain that Expectation is a property of the *distribution*, not the *process*. If that distinction doesn't land, the paradox feels like a trick rather than a foundational issue. Be prepared to draw a distinction between "playing the game" (time) and "evaluating the gamble" (statics).
