      *   **The Problem:** Standard counterexamples (drug, forgetfulness, lobotomy) vs. defenders who call them "epistemic luck" cases.
      *   **The Impasse:** One side says it's a coherence requirement (like probabilism); the other says it's false as a requirement, only descriptive for trustworthy selves. They agree on the cases but disagree on what the cases *are*.
      *   **User's Hypothesis:** The stall is due to conflating two meanings of "treating future credence as a reason": (1) Reliability function (empirical/contingent) vs. (2) Endorsed inquiry (necessary/conditional).
      *   **The Task:** Diagnose the impasse. Is it verbal? Hidden formal/empirical question? Two different questions (coherence vs. justification)? Competing bedrock commitments? Evaluate the user's hypothesis. Say what each side is committed to. Say what would count as progress.
      *   **Constraint:** No survey/reading list. Just diagnosis and reasons.

  2.  **Deconstruct the Reflection Principle Debate:**
      *   *Van Fraassen's Intent:* It's a synchronic coherence constraint on current opinions about future opinions. It's meant to be a requirement of rationality, akin to avoiding Dutch Books.
      *   *The Counterexamples:* These involve *known* irrationality in the future self (drug, forgetfulness). If I *know* I will be irrational, why should I defer?
      *   *The Defender's Move:* "If you know you'll be irrational, you shouldn't assign probability 1 to the future credence being the result of rational updating." Or, "Reflection applies only to ideal agents."
