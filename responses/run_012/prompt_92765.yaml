      *   *What counts as progress:* Not a new counterexample. Not a reading list. Progress is recognizing that Reflection is a *theorem* of a deeper norm (like Accuracy or Conditionalization) rather than a *axiom*. If derived from Accuracy, the conditions of its validity become clear (i.e., it only holds when you expect future accuracy to be higher/equal).
