answer: |-
  **The purpose**

  The theory is tasked with ranking and selecting policies where consequences involve infinite or unbounded populations. You have described this accurately, but with one crucial clarification: ranking worlds is distinct from choosing actions. An ordering might exist without a maximal element, leaving an agent without a directive. Therefore, the purpose is not merely metaphysical evaluation but action-guidance. The theory must bridge the gap between ontological value and decision rules, ensuring that an agent can identify a permissible choice even when no single option maximizes value in the traditional sense. Adequacy is relative to this operational need; a theory that ranks but cannot guide choice fails the purpose.

  **The desiderata**

  1.  **Quality Discrimination.** The theory must rank a world of infinitely many flourishing lives above a world of infinitely many miserable lives. This is not a prejudice but a constraint on the concept of value; if infinite quantity obliterates quality distinctions, the theory ceases to be ethical and becomes merely numerical. It must distinguish the value of a world from the aggregate value of lives, ensuring that universal misery does not equal universal flourishing simply due to cardinality. Without this, the theory cannot guide intervention toward benefit rather than harm. This requirement insists that the moral sign of a life matters regardless of the population size.

  2.  **Additive Sensitivity.** In two worlds identical except for one additional person living a life barely worth living, the world with the additional person must be ranked higher. This ensures the theory registers marginal improvements as valuable. However, this sensitivity is constrained: it must not allow the addition of a single person to flip the ranking of two worlds already fixed by vast differences. The addition must add value without destabilizing prior comparisons, preserving the stability of judgment against trivial changes. This prevents the theory from being overly volatile in response to negligible additions while maintaining that existence can be good.

  3.  **Finite Adequacy.** When comparing an infinite world against a finite but enormous and uniformly excellent world, the theory must not simply reverse verdicts accepted in finite cases without explicit justification. If the finite world is sufficiently excellent, it should not be automatically dominated by a mediocre infinite one. The theory must preserve finite intuitions unless infinity forces a break. It must not collapse the distinction between finite and infinite such that any infinity beats any finite sum, which would render finite planning irrelevant. This maintains continuity between our existing ethical framework and the infinite extension.

  4.  **Permutation Resistance.** Two worlds may be put in one-to-one correspondence, making them the same size set-theoretically, yet one is plainly better on any intuitive reading. The theory must not be defeatable by a mere relabeling or pairing argument that converts any ranking into an equality. Value must depend on more than cardinality; it must respect the assignment of well-being to individuals. This prevents the theory from being trivialized by mathematical bijections that ignore moral significance. It ensures that structural differences in well-being distribution are not erased by set-theoretic equivalence.

  5.  **Distributional Sensitivity.** Consider a world containing, for each natural number, infinitely many people whose lives sit at that level of well-being. The population is infinite at every level. The theory must be able to evaluate this dense distribution without collapsing into indeterminacy. It must handle countable versus uncountable distinctions if relevant, but primarily must assess the structure of well-being across the infinity. It cannot declare all such complex worlds incomparable, or it fails to rank realistic scenarios. This requires the theory to process complex infinite structures without failing to return a verdict.

  6.  **Decision Completeness.** Given an infinite sequence of worlds, each better than the last, with no best member, a choice must still be made between two of them. The theory must distinguish between *at least as good as*, *better than*, and *incomparable*. It is not permitted to return *incomparable* for every pair in a choice set; it must provide a usable decision rule even if no maximum exists in the ranking. The distinction between a ranking of worlds and a usable decision rule is vital; an ordering may exist while no maximum does, yet action is required. This ensures the theory is action-guiding.

  7.  **Temporal Coherence.** For a world whose population grows without bound over time, the theory must evaluate the trajectory without relying on a final sum that never arrives. It must be operable by an ordinary agent who cannot evaluate infinite sums. The theory must not require omniscience to calculate limits that do not converge. It must bridge the gap between ontological value and decision rules, ensuring that an agent can identify a permissible choice even when no single option maximizes value in the traditional sense. This respects the epistemic limits of the grantmaking agent.

  **What is non-negotiable and what is a camp preference**

  Non-negotiable requirements are those required for logical coherence and action-guidance. Quality Discrimination and Decision Completeness are non-negotiable; a theory that cannot distinguish flourishing from misery or guide choice is not a theory of value for decision-makers. Finite Adequacy is also essential to maintain continuity with established ethics; abandoning finite verdicts renders the theory alien to human reasoning. Temporal Coherence is non-negotiable for operability, as agents cannot act on unreachable sums. However, Additive Sensitivity and Permutation Resistance are camp preferences. A totalist might reject Additive Sensitivity in infinite contexts to preserve summation rules, while an averageist might reject Permutation Resistance if location is irrelevant. Distributional Sensitivity is a substantive commitment to structural value over mere aggregates. The core non-negotiables are those that prevent the theory from becoming silent or trivial.

  **Where the list cannot be jointly satisfied**

  The list cannot be jointly satisfied because Additive Sensitivity and Permutation Resistance conflict in infinite settings when combined with Decision Completeness. Consider World A, where every person has well-being level 1. Consider World B, where every person has well-being level 2. Quality Discrimination requires B to be better than A. Now consider World C, which contains the same people as A but permuted such that they occupy the positions of B. Permutation Resistance says A and C are equal because they are one-to-one correspondences with identical value sets. However, if we apply Additive Sensitivity, we can construct a sequence starting at A where we incrementally improve individuals to match B. If every addition matters, the final state should be better. But if the final state is just a permutation of A, Permutation Resistance says they are equal. You cannot hold that every addition matters, that permutations don't change value, and that you can always compare the results.

  Concretely, if we require the theory to be complete (Decision Completeness) and sensitive to every addition (Additive Sensitivity), we violate Permutation Invariance. In finite cases, adding value always increases the sum. In infinite cases, adding value to every member of an infinite set can result in a set that is bijectively identical to the original in terms of cardinality and value distribution if shifted. If the theory says the shifted world is better (Sensitivity) but also says the shifted world is equal (Permutation), it contradicts itself. To resolve this, one requirement must fail. Usually, Decision Completeness is the casualty; the theory must allow incomparability to avoid contradiction. This shows that apparently obvious requirements like "every addition matters" were never compatible with "symmetry holds" in the infinite case. The conflict shows we must abandon the idea that infinite value behaves like finite value extended. We cannot have a total ordering that respects both Pareto improvements and Anonymity in infinite populations.

  **Which requirement does the most excluding**

  Decision Completeness does the most excluding. It requires the theory to return a verdict for every pair of worlds, forbidding *incomparable* as a widespread outcome. Most mathematical approaches to infinite sums result in undefined values or non-convergent series. To force a ranking where mathematics yields indeterminacy requires strong normative assumptions that many theories reject. By demanding a usable decision rule even when no maximum exists, this requirement eliminates any theory that relies on standard convergence. It forces the theory to adopt non-standard analysis or lexical rules, which many find ad hoc. It is the gatekeeper that separates action-guiding frameworks from metaphysical descriptions. Any theory that says "these worlds are incomparable" fails this test, which includes most standard utilitarian extensions.

  **The usual contenders against the list**

  Totalism fails Finite Adequacy and Decision Completeness. It sums well-being, but infinite sums are undefined or equal, making ranking impossible. It cannot distinguish flourishing from misery if both are infinite, violating Quality Discrimination. It collapses when faced with divergent series.

  Averageism avoids the infinite sum problem but fails Additive Sensitivity. It may prefer a world with fewer excellent lives to one with more, and struggles with the infinite at every level case where averages are undefined. It often reverses finite verdicts to avoid the repugnant conclusion.

  Person-affecting views struggle with Quality Discrimination in infinite contexts. If no specific person is made better off due to identity changes across infinite populations, the view returns no verdict, violating Decision Completeness. It cannot handle non-identity problems at scale.

  Prioritarianism fares slightly better by weighting worse-off lives, but still faces the Permutation Resistance conflict. If weights depend on position, permutations change value; if not, it collapses to totalism. It struggles with Temporal Coherence when the population grows without bound.
