prompt: |-
  Hey — I'm a journalist on the science-and-ideas beat and I'm deep in a feature about the knowing-how vs. knowing-that distinction (the Ryle thing: you can know how to ride a bike while knowing basically no facts about bikes). I'm not after a reading list, and you dont have web access anyway, so skip the cites. What I need is the spec sheet. Before I sit down with anyone who's got a theory of know-how, I want to know what any adequate theory of it has to be able to do.

  So: you're a philosopher of mind who's taught this stuff for years — think carefully, and before anything else, spend some time just brainstorming the phenomena. What cases does a theory of knowing how have to get right? What distinctions can't it collapse? What does it have to sit with? For each one, give me the case or consideration that puts it on the list.

  Things I keep tripping over that I want on the list, roughly in the order they hit me:

  - Two people memorise the identical set of instructions for tying a bowline; one can tie it and one can't. Also the reverse — a sailor who can tie it in the dark but can't tell you a single rule.
  - The expert who, when you ask how she does it, gives an account that's flatly false, and still hits the shot every time. If her know-how just were her know-that, she'd be bad at her job.
  - The person who's fine until she starts thinking about the steps, then falls apart. More true beliefs about the skill made her worse.
  - A jazz trio or a surgical team that reliably pulls off something none of them could pull off alone. Whose know-how is that, and is that even the right question?
  - Animals and toddlers, who obviously know how to do all kinds of things and have no propositions to their name.
  - And one I made up, so tell me whether it's even a real puzzle: a guy who's outsourced a skill entirely to his phone — can he still cross town without it? Did the knowing-how migrate into the phone, or is it just gone?

  Then the interesting part. Say which of these requirements are genuine and which are just one camp's prejudice. Flag any two that can't both be met — if the list is jointly unsatisfiable, that's the story, and it's the part I most want. And tell me which single requirement does the most work in ruling out candidates. A quick line on how the main camps fare against the list is welcome, but keep it short; I care way more about the list itself than the scorecard.

  And please be upfront about how confident you are in each part, and name the one claim in your answer you're least sure of. That's the bit I'll probably be quoting, so I need to know where you're wobbly.
