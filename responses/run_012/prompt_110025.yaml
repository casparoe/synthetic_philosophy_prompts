answer: |-
  Here is the spec sheet. I've translated your cases into theoretical constraints. This is what any viable ontology of know-how has to process without crashing.

  ### The Spec Sheet: Six Constraints on Know-How

  **1. The Dissociation Constraint (from your Bowline case)**
  *   **The Phenomenon:** Possession of explicit instructions does not guarantee ability; possession of ability does not require explicit instructions.
  *   **The Requirement:** The theory must decouple *competence* from *codification*. It cannot define know-how as the possession of a specific set of true propositions.
  *   **Confidence:** High. This is the bedrock. If a theory fails this, it's not a theory of skill, it's a theory of manuals.

  **2. The Opacity Constraint (from the Expert with the False Theory)**
  *   **The Phenomenon:** Agents can succeed reliably while holding false beliefs about *why* they succeed.
  *   **The Requirement:** The truth-condition of the knowledge cannot reside in the agent's conscious self-report. The "knowledge" must be located in the successful coupling of agent and world, not in the agent's internal narrative.
  *   **Confidence:** High. Sports psychology and motor learning confirm this daily.

  **3. The Fragility Constraint (from the Overthinking case)**
  *   **The Phenomenon:** Reverting to explicit step-by-step monitoring degrades expert performance (the "centipede effect").
  *   **The Requirement:** The theory must explain why accessing the "knowledge" component explicitly can destroy the "knowing" component. Know-how must have a mode of access that is distinct from, and potentially hostile to, propositional retrieval.
  *   **Confidence:** High. This is the hardest nut for Intellectualists to crack.

  **4. The Non-Conceptual Constraint (from Animals/Toddlers)**
  *   **The Phenomenon:** Agents without language or logical syntax exhibit complex, adaptable goal-directed behavior.
  *   **The Requirement:** The theory cannot require the grasp of concepts or propositions as a necessary condition for know-how. It must allow for *embodied* or *procedural* knowledge.
  *   **Confidence:** High. Denying this requires calling a chimpanzee's tool use "mere reflex," which is biologically implausible.

  **5. The Distribution Constraint (from the Jazz/Surgical team)**
  *   **The Phenomenon:** A group achieves a reliable outcome that exceeds the sum of individual capabilities, often without a single "conductor."
  *   **The Requirement:** The theory must account for know-how that is not locatable in a single skull. It must allow for *systemic* competence.
  *   **Confidence:** Moderate. (See "Uncertainty" below).

  **6. The Boundary Constraint (from your Phone case)**
  *   **The Phenomenon:** Reliance on external tools (GPS, notes) to navigate or perform tasks.
  *   **The Requirement:** The theory must draw a line between *using a tool* and *possessing the skill*. If the phone dies and the agent fails, did they have the know-how?
  *   **Confidence:** Moderate. This is the frontier of Extended Cognition theory.

  ***

  ### Genuine Requirements vs. Theoretical Prejudice

  **Genuine:**
  Constraints 1, 2, 3, and 4 are non-negotiable. They describe the actual phenomenology and biology of skill. Any theory that dismisses these to save a neat definition is saving the definition at the cost of the phenomenon.

  **Prejudice/Debatable:**
  *   **The Boundary Constraint (Phone):** This is where ideology creeps in. "Extended Mind" proponents say the know-how is in the system (you + phone). Traditionalists say the know-how is in you, and the phone is just a scaffold. Whether this is a *real* puzzle depends on whether you think cognition is skull-bound. I treat it as a genuine puzzle, but it's the most susceptible to definitional stipulation.
  *   **The Distribution Constraint (Team):** There is a risk of category error here. Is it *one* know-how distributed, or *many* interlocking know-hows? Insisting it is a singular "group mind" know-how might be a metaphorical stretch.

  ***

  ### The Tensions: What Can't Be Met Simultaneously?

  You asked if the list is jointly unsatisfiable. Logically, no. But theoretically, it creates a squeeze that breaks most standard models.

  **The Conflict: The Non-Conceptual Constraint vs. The Boundary Constraint.**
  Here is the friction:
  *   To satisfy the **Non-Conceptual Constraint** (Animals), know-how must be embodied, biological, and non-symbolic.
  *   To satisfy the **Boundary Constraint** (Phone) in the way "Extended Mind" theorists want (i.e., admitting the phone *holds* the know-how), know-how must be capable of being stored in a symbolic, external medium.

  If know-how is truly non-conceptual (like a reflex or muscle memory), it *cannot* migrate to a phone. If it *can* migrate to a phone, it implies know-how is fundamentally informational/propositional, which threatens the **Non-Conceptual Constraint** (why can't the animal just "download" the prop?).

  **Verdict:** You can satisfy both only if you posit a *hybrid* view: that know-how has a core embodied component (animal) that can be *scaffolded* by external props (phone), but never fully *migrated*. If a theory claims the know-how is *entirely* in the phone, it fails the Animal test. If it claims it's *entirely* biological, it struggles to explain the Phone case without calling it "cheating."

  ***

  ### The Killer Constraint

  **The Dissociation Constraint (Case 1).**
  This is the gatekeeper. It does the most work in ruling out candidates.
  *   **Why:** It kills Classical Intellectualism (the idea that know-how *reduces* to know-that) immediately. If you can have the propositions without the ability (the book-smart non-cyclist), then the propositions are not sufficient. If you can have the ability without the propositions (the sailor), they are not necessary.
  *   **Impact:** Any theory that tries to reduce know-how to a mental relation to a proposition dies here. It forces the theory to be about *dispositions, abilities, or relations to the world*, not just relations to truths.

  ***

  ### Scorecard: How the Camps Fare

  *   **Rylean/Anti-Intellectualists:** Ace the Dissociation, Opacity, Fragility, and Non-Conceptual constraints. They stumble on the Normative question (if it's not knowledge of truths, how do we distinguish *skill* from *habit* or *luck*?).
  *   **Intellectualists (e.g., Stanley & Williamson):** Ace the Normative question (it's a type of knowledge). They fail the Dissociation and Fragility constraints unless they perform complex gymnastics (e.g., claiming the cyclist *does* know propositions but under a "practical mode of presentation").
  *   **Embodied/Enactive Cognitivists:** Best fit for the spec sheet. They treat know-how as a dynamic coupling between organism and environment. They satisfy Non-Conceptual and Fragility easily. They struggle slightly with the Boundary Constraint (defining where the coupling stops).

  ***

  ### Confidence & Uncertainty

  **Confidence Level:**
  I am **highly confident** in the phenomenology (the cases themselves) and the failure of pure Intellectualism to account for them. I am **moderately confident** in the Hybrid/Embodied solution as the only viable path forward.

  **The Claim I'm Least Sure Of:**
  > *"The Distribution Constraint (Collective Know-how) risks a category error; it may be more accurate to describe it as interlocking individual know-hows rather than a singular distributed skill."*

  **Why I'm Wobbly:**
  This is the cutting edge of social ontology. In a jazz trio, the "swing" isn't in any one player. If you remove one, the *specific* know-how of that trio vanishes, even if the individuals remain experts. I'm not sure if that emergent property counts as a distinct ontological instance of *know-how* or just a complex causal outcome of individual know-hows. If you quote me, quote this hesitation. It's where the metaphysics gets muddy.
