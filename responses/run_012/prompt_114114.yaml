  2.  **Deconstruct the Argument:**
      *   Core claim: Heterophenomenology is best understood as a literary hermeneutic method, not just neutral neutrality.
      *   Mechanism: Treat subject reports as texts/narratives. Model the narrator (implied author/narrator distinction, unreliability).
      *   Payoff: AI consciousness. If AI output supports a stable narrator model useful for prediction, treat it similarly to human reports without needing "real" inner states.
