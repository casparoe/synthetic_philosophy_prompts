prompt: |-
  Next month I'm presenting a seminar paper arguing that heterophenomenology should be the default method in consciousness science, and I need a Q&A prep sheet for the objections I'll actually get — not a defence written out, not a summary of my views, the prep sheet. Here's the gist of the argument so you've got something to aim at: Dennett's heterophenomenological stance is usually sold as a way of staying neutral between realists and eliminativists about the phenomenal, but the interesting part is that it's really a *literary* method. Subject reports get treated as texts, so we should be modelling narrators and implied narrators, unreliable narration, the whole apparatus, rather than treating a report as testimony about an inner object. And the payoff I'm claiming is that once you see it that way, extending the method to artificial systems stops looking mad: you quit asking whether the model is "really" reporting anything and start asking whether its output, read as a fiction-generating text, supports a stable narrator model that earns its keep in predictions.

  The audience is a small reading group hanging off a philosophy department, about ten people, and they're a specific mix. Two came up through the continental route, work on Husserl and Merleau-Ponty, and think the lived body is doing all the real work in experience. One is from the Varela/Thompson neurophenomenology lineage and does trained first-person interview work, and thinks first-person method can be made rigorous if the interviewer is properly trained. Two or three are psychophysicists/vision scientists who think the whole debate is people rediscovering the obvious fact that you have to ask subjects what they saw. There's one hard eliminativist who thinks Dennett is far too concessive and that even "reports about experience" is already a mistake. And there's one Wittgensteinian who mostly asks what the word "report" is doing in my sentence. Nobody there is from a rationalist or EA background — I've been on LW long enough to know the p-zombie/qualia-inversion objections I'll get from that quarter, so skip those.

  What I want: the eight or so objections I'll genuinely get, ordered by how much damage they'd do if I fumble them, each phrased the way the specific person would actually put it (keep the phenomenologist's wording phenomenological, the vision scientist's blunt and empirical, the Wittgensteinian's a question about usage). For each: a two-minute spoken reply, then a one-line note on where that reply is soft or concedes more than I'd like. Tell me which objections I should just concede up front instead of fighting, and which single reply has to land for the paper to survive the hour. And give me the question I'm hoping nobody asks — the one aimed at the weakest joint in the whole thing, the one I've been quietly avoiding.

  Write it in British English please, spellings and all. I keep lapsing into American ones and I want to break the habbit before the seminar. And no "great question!" padding — jsut the substance.
