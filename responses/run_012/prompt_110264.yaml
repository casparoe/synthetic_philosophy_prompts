prompt: |-
  I am a high school junior and the student chair of our school's philosophy club. This year, as a fundraiser for the library, we are putting on a Victorian séance evening in the old assembly hall. I have been asked to give the opening remarks in character as Henry Sidgwick, the Victorian utilitarian philosopher who was one of the founders and first president of the Society for Psychical Research. The audience will be mixed: students who came for the spooky atmosphere, parents who are skeptical, a few teachers who know Sidgwick's actual work, and some people who have lost someone recently and are not sure why they came. I want the speech to be honest, humane, and intellectually serious—not a parody, not a debunking, not a sentimental lie.

  Please act as a professional speechwriter and an expert in Victorian intellectual history, the history of psychical research, and Sidgwick's philosophy. Before you write, brainstorm the central tension and outline how the speech will move. Then write the full speech, about five to seven minutes long, in Sidgwick's first-person voice, but in language a modern high school audience can follow. Do not include a bibliography, footnotes, or a reading list; I will not be citing anything from the stage. Do not quote from any real text. If you need to refer to an idea, paraphrase it.

  The speech should be structured around Sidgwick's actual position, as I understand it: he spent years investigating mediums and survival claims; he hoped the evidence might show that consciousness survives death, partly because he thought the question of survival was bound up with whether the universe is morally ordered; but he never regarded the evidence as conclusive and remained an agnostic. So the speech has to hold together genuine hope and genuine doubt. It cannot resolve the tension by pretending the dead are certainly present, and it cannot resolve it by mocking the people who wish they were. That tension should shape what the speech can promise, what it must leave open, and how it addresses grief.

  I want the speech to turn on one less familiar idea: Sidgwick's worry that the desire for survival can corrupt the evidence, and his corresponding insistence that the ethical stakes of the question are so high that wishful thinking is not a small epistemic sin but a betrayal of the very thing he hoped for. The speech should argue that intellectual honesty is itself a way of honoring the dead. You may develop this idea as you think Sidgwick would, even if he never put it exactly that way.

  Make sure the speech does real work for the mixed audience. The students who came for atmosphere should not feel lectured at; the skeptics should not feel pandered to; the grieving should not feel used. The ending should be open but not empty—it should give the audience something to hold, without claiming more than the evidence allows. Think carefully about tone: Victorian in cadence but not archaic; warm but not sentimental; rigorous but not cold.
reasoning: |-
  Here's a thinking process that leads to the speech:

  1.  **Analyze the Request:**
      *   **Speaker:** Henry Sidgwick (Victorian utilitarian philosopher, founder/president of the Society for Psychical Research).
      *   **Occasion:** High school Philosophy Club fundraiser (Victorian Séance Evening) for the library.
      *   **Audience:** Mixed (students wanting spooks, skeptical parents, knowledgeable teachers, grieving individuals).
      *   **Tone:** Honest, humane, intellectually serious. Not a parody, not a debunking, not a sentimental lie. Victorian cadence but accessible. Warm but rigorous.
      *   **Core Philosophy:** Sidgwick's actual position (investigated mediums, hoped for survival as proof of moral order, remained agnostic, never found conclusive evidence).
      *   **Key Theme:** The desire for survival can corrupt evidence; wishful thinking is an ethical betrayal; intellectual honesty honors the dead.
      *   **Constraints:** 5-7 minutes spoken (approx. 750-1000 words), no citations/footnotes, no direct quotes (paraphrase only).
      *   **Task:** Brainstorm tension/outline first, then write the speech.

  2.  **Brainstorming the Central Tension:**
      *   *The Conflict:* The heart wants the dead to live; the head demands proof. Sidgwick lived in this gap.
      *   *The Risk:* If I promise contact, I lie to the grieving and insult the skeptics. If I deny contact, I crush the grieving and bore the students.
      *   *The Resolution:* Shift the focus from *contact* to *conduct*. How we seek the truth matters more than the comfort of the answer. Honesty is the séance.
      *   *Sidgwick's Voice:* Calm, measured, earnest, slightly melancholic but dignified. He wasn't a mystic; he was a moralist who *wished* mysticism were true but wouldn't lie to make it so.
      *   *Audience Management:*
          *   Students: Acknowledge the thrill but elevate it to mystery.
          *   Skeptics: Validate their demand for evidence.
          *   Grieving: Validate their love, but suggest that truth is the highest respect.
          *   Teachers: Show I know the philosophy.

  3.  **Outlining the Speech:**
      *   **Introduction:** Welcome the guests. Acknowledge the setting (old hall, shadows). Establish the persona (Sidgwick). State the purpose of the Society for Psychical Research (not to prove, but to inquire).
      *   **The Hope:** Admit the personal desire. Why did I investigate? Because a universe without continuity feels morally incomplete. Connect survival to cosmic justice.
      *   **The Doubt:** Acknowledge the lack of conclusive proof. The mediums, the tricks, the ambiguity. The danger of self-deception.
      *   **The Ethical Turn (The Core):** The specific request about wishful thinking. If we lie to ourselves about the dead, we insult their memory. Truth is the only worthy offering.
      *   **Addressing the Audience:** Speak to the different groups implicitly. To the skeptics: stay critical. To the believers: stay honest. To the grieving: your love is real, even if the contact is uncertain.
      *   **Conclusion:** The library connection (preservation of knowledge). The evening's promise (not contact, but shared inquiry). A final open-ended blessing.

  4.  **Drafting - Section by Section (Iterative refinement for tone):**

      *   *Intro:* Need to sound Victorian but clear. "Good evening." Acknowledge the "shadows." Mention the SPR.
      *   *The Motivation:* Why care about ghosts? It's not about scares. It's about whether love ends. Sidgwick's utilitarianism meets the afterlife. If death is the end, is morality just a game?
      *   *The Investigation:* I sat in rooms like this. I watched tables tilt. I wanted it to be real. But I saw too much fraud.
      *   *The Ethical Argument:* This is the crux. If I pretend to know, I cheapen the dead. Wishful thinking is a sin against the truth.
      *   *The Grief:* To those mourning: Don't let charlatans sell you peace. Your grief is the proof of love, not the séance.
      *   *The Library/Fundraiser:* Why are we here? Books. Knowledge. Keeping the light on.
      *   *Ending:* We don't know. But we seek together.

  5.  **Refining the Voice (Self-Correction during drafting):**
      *   *Check:* Is it too dry? *Fix:* Add more emotional weight to the grief section.
      *   *Check:* Is it too spooky? *Fix:* Ground it in epistemology (how we know things).
      *   *Check:* Is the language too modern? *Fix:* Use words like "inquiry," "faculties," "conviction," "solace," but avoid "thee/thou." Keep sentences rhythmic.
      *   *Check:* Is the core argument clear? *Fix:* Ensure the link between "honesty" and "honoring the dead" is explicit.

  6.  **Final Review against Constraints:**
      *   5-7 minutes? (Word count check: ~900 words usually fits this pace).
      *   No citations? (Checked).
      *   Sidgwick's actual view? (Agnostic hope).
      *   Audience needs met? (Yes, addressed broadly).

  7.  **Final Polish:** (Writing the speech based on the above plan). *Focus on the transition from the "thrill" of the séance to the "gravity" of the question.*

  *(Self-Correction Note during drafting)*: Make sure I don't sound *too* much like a skeptic debunker. Sidgwick *wanted* it to be true. The tragedy is that he couldn't confirm it, not that he thought it was nonsense. The speech must breathe with that longing.

  8.  **Final Word Count Check:** Aiming for roughly 900-1000 words for a measured 5-7 minute delivery.

