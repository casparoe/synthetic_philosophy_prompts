          *   *Objection:* "Even if the measure is fuzzy, the *surprise* remains. If I shoot an arrow and hit a bullseye, I don't ask about the coordinate system of the target; I ask if someone aimed."
          *   *Damage:* Medium (Philosophical intuition vs. Math).
