  ### 2. Assessment of the "Explanatory Vocabulary" Repair

  You propose restricting a theory's content to consequences expressible in its own explanatory vocabulary to filter out idle predicates and background noise. This moves the account closer to Schurz's "relevant consequence" approach, but it introduces a specific vulnerability regarding your condition (c).

