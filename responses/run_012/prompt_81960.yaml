          *   Asymmetry: Not bringing happy person = not bad (axiological/conditional); Bringing miserable person = bad (deontic/unconditional).
          *   Structure: About *reasons*, not states of affairs.
          *   Non-Identity: Avoided by contrasting actions under uncertainty, not existence vs. non-existence.
          *   Defense Strategy: Often deflects objections by saying they "prove too much" for any population ethics view.
      *   **Hosts' Disagreement:** Co-host thinks it collapses into anti-natalism; Host thinks it's the only way to keep asymmetry without saying we have *no* reason to create happy people.
      *   **Requirements:** 8-10 questions.
      *   **Specific Topics to Cover:**
          1.  Axiological vs. Deontic distinction (and existence/non-existence comparison).
          2.  Conditional-value clause (endorsement timing/nature).
          3.  Non-Identity & Repugnant Conclusion (barely worth living vs. flourishing).
          4.  Practical implications (procreate/adopt/childless, parenting as a good).
          5.  Evidence/Arguments against a view about reasons.
      *   **Format:** Each question needs a follow-up keyed to likely answers (specifically targeting the "proves too much" deflection).
      *   **Audience:** Philosophically literate but non-specialist (avoid jargon dumps/citations).
      *   **Ending:** Closing question on strongest objection and theoretical cost.

  2.  **Deconstruct the Guest's View & Potential Weak Points:**
      *   *The "Reasons" Shift:* Moving from value of states to structure of reasons is clever but risky. Does it actually solve the metaphysical weirdness of comparing existence to non-existence, or just hide it?
      *   *The "Endorsement" Condition:* How can a non-existent person endorse anything? If it's counterfactual ("if they existed, they would endorse it"), does that presuppose the value of the existence we are trying to justify?
      *   *The "Proves Too Much" Deflection:* This is the biggest target. It's a defensive crouch. The questions need to corner her into explaining *why* her view handles the "too much" better than rivals, not just that everyone suffers.
      *   *Anti-Natalism Collapse:* If reasons to create are merely conditional/axiological and reasons not to are unconditional/deontic, does the deontic weight always crush the axiological? If so, anti-natalism wins.
