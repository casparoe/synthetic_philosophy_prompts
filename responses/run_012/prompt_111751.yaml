  Despite this shared framework, we disagree on the substantive content and truth of the claim, and we set out these remaining disagreements in wording each side accepts as its own. The Defender maintains that the value ordering over the feasible set is sufficiently determinate and structured such that a supreme or at least unbeaten world exists, and that factual inquiry into the actual world can confirm it occupies this position. The Defender argues that the intuition of value realism supports the existence of a maximal element in the set of creatable worlds. The Critic maintains that the thesis is not false but empty, arguing that nothing determinate is asserted by saying that one creatable world is better than every other because the value ordering is rife with incomparability and lacks a metric capable of identifying a unique maximum. The Critic argues that without a precise measure of value, the claim that one world is better than every other fails to carve reality at its joints, rendering the thesis vacuous rather than false. The Defender insists the ordering is robust enough to sustain the claim, while the Critic insists the ordering is too sparse to sustain it.

