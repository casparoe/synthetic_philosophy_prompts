      Question: In a standard dollar auction with fixed bid increments, is continued bidding by the second-highest bidder ever consistent with forward-looking expected utility maximization, or does it necessarily entail sunk-cost reasoning? This question has a determinate answer because it relies on comparing the expected utility of quitting versus bidding at specific nodes within a formalized payoff structure. If the model demonstrates that bidding above the prize value minimizes expected loss relative to quitting at certain nodes, then the escalation is structurally rational. If the model demonstrates that quitting is always the dominant strategy regardless of prior investment, then the escalation is necessarily irrational. I could be shown to be wrong if the mathematical derivation shows that the loss from quitting is never greater than the expected loss from continuing, given rational opponents.

      **Section 2:** The standard philosophical and economic treatments of the dollar auction leave this question undecided rather than merely unaddressed. Typically, the auction is introduced as a paradigm case of irrational escalation, used to illustrate how agents succumb to sunk-cost fallacies. However, these treatments often conflate the decision to enter the auction with the subsequent decisions to continue bidding. They assume that because the final outcome is ruinous for both parties, the steps leading there must involve reasoning errors. They do not systematically separate the ex ante irrationality of entry from the ex post rationality of damage control. For the question to be closed, the literature would need to establish whether the second-highest bidder faces a dominated strategy at the moment of decision. Current arguments presume the answer is yes based on the final outcome, but they do not prove that the local decision at a specific node violates forward-looking maximization. Until the node-by-node payoff structure is analyzed independently of the global outcome, we cannot know if the trap is psychological or structural.

