  1. Working title and question
  Title: Structural Traps or Psychological Errors? Rationality in the Dollar Auction. Question: In a standard dollar auction with fixed bid increments, is continued bidding by the second-highest bidder ever consistent with forward-looking expected utility maximization, or does it necessarily entail sunk-cost reasoning? This question has a determinate answer because it relies on comparing the expected utility of quitting versus bidding at specific nodes within a formalized payoff structure. If bidding above the prize value minimizes expected loss relative to quitting at certain nodes, the escalation is structurally rational. If quitting is always the dominant strategy regardless of prior investment, the escalation is necessarily irrational. I could be shown to be wrong if the mathematical derivation shows that the loss from quitting is never greater than the expected loss from continuing, given rational opponents.

  2. Why it is still open
  The standard philosophical and economic treatments of the dollar auction leave this question undecided rather than merely unaddressed. Typically, the auction is introduced as a paradigm case of irrational escalation, used to illustrate how agents succumb to sunk-cost fallacies. However, these treatments often conflate the decision to enter the auction with the subsequent decisions to continue bidding. They assume that because the final outcome is ruinous for both parties, the steps leading there must involve reasoning errors. They do not systematically separate the ex ante irrationality of entry from the ex post rationality of damage control. For the question to be closed, the literature would need to establish whether the second-highest bidder faces a dominated strategy at the moment of decision. Current arguments presume the answer is yes based on the final outcome, but they do not prove that the local decision at a specific node violates forward-looking maximization. Until the node-by-node payoff structure is analyzed independently of the global outcome, we cannot know if the trap is psychological or structural. Furthermore, existing discussions often rely on intuitive pumps rather than formal derivation. They describe the feeling of being trapped without calculating whether the trap is logically inescapable. To settle this, one must show that the payoff matrix forces the loss regardless of strategy, or conversely, that a rational exit strategy exists but is ignored due to bias. Without this distinction, the auction remains an ambiguous example in the literature on diachronic rationality.

  3. Approach
  Given one term and no laboratory access, my approach will be formal modeling combined with conceptual analysis. I will construct a simplified game-theoretic model of the dollar auction, specifying the prize value, the bid increment, and the penalty for the second-highest bidder. I will then solve for the optimal strategy at various decision nodes, specifically focusing on situations where the current bid exceeds the prize value. I will characterize the region of the game tree where continuing to bid yields a higher expected utility than quitting, assuming opponents act rationally. This mathematical characterization will then be mapped against the philosophical definitions of sunk-cost reasoning. I am choosing this method over experimentation because the question concerns normative rationality, not descriptive psychology; knowing what people do does not tell us what they ought to do. Experiments would show frequency of error, not the existence of a rational path. A literature survey is insufficient because it would only catalog existing assumptions without testing the structural claim. The modeling isolates the variable of interest: whether the rules themselves compel escalation independent of agent bias. This allows me to test the hunch without presupposing its truth, as the model might reveal that continuing is always dominated. I will also analyze how different assumptions about opponent rationality shift the region of rational escalation. This step is crucial because the trap often relies on the expectation that the opponent will also behave irrationally. By varying these parameters, I can determine if the rationality of escalation is robust.

  4. What a result would look like
  A successful result will take the form of a theorem or a characterized region within the model. There are three main possible conclusions. First, the model may show that continuing is never rational, confirming the standard view and refuting my hunch. Second, it may show that continuing is rational within a specific range of bids, supporting the structural trap hypothesis. Third, it may show that rationality depends on how the decision problem is individuated across time. Considerations of payoff dominance will decide between these. Even if my hunch is refuted and continuing is shown to be irrational, the project makes progress by rigorously distinguishing structural coercion from psychological error. This clarifies the boundaries of diachronic rationality and prevents the misuse of the dollar auction as evidence for sunk-cost fallacies where none exist. Progress is defined by the precision of the distinction, not by confirming my initial intuition. If the result shows that rationality depends on individuation, I will have identified a specific locus of ambiguity in current discussions of diachronic agency. This would indicate that the literature is talking past itself regarding what counts as a single decision. Any of these outcomes provides a clearer framework for evaluating escalation cases.

  5. How it could fail
  This project could fail by collapsing into a merely verbal dispute about how to individuate a decision problem. If the conclusion rests solely on stipulating that each bid is a new decision rather than part of a whole, the result is trivial. To avoid this, I must anchor the analysis in concrete payoff consequences rather than descriptive labels. The work avoids triviality if it demonstrates that the payoff structure itself changes the normative status of the action. If the model shows that the loss from quitting is objectively larger than the loss from continuing under specific conditions, the result is substantive. I will focus on the mathematical constraints of the loss rather than the metaphysics of decision individuation.

  6. Scope and timetable
  In one term, I can realistically construct the model, solve for the equilibrium conditions, and draft a paper analyzing the philosophical implications. I will leave out the historical development of the auction and any attempt to empirically validate the model with human subjects. The focus must remain on the normative structure. I anticipate the workshop audience will press hardest on the idealization of the model, specifically whether abstract payoff maximization captures the relevant sense of rationality for diachronic agency. They may argue that real rationality involves planning constraints that the model ignores. I will prepare for this by explicitly stating the limits of the model and arguing that even within these limits, the distinction between structural and psychological error remains vital for understanding rational commitment. I will ensure the final draft fits the two-page constraint by prioritizing the argument over exposition.
