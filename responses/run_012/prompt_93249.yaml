      *   *V3 (Corruption):* Obligation exists but form matters. Direct aid (vaccines/cash) owed; budget support not owed (due to misuse). Obligation is to *people*, constrained by effectiveness/agency.
      *   *V4 (Displacement):* Aid must be *additional*. Substituting state spending doesn't count. (Effectiveness condition).
      *   *V5 (Doctors):* Structural harm (undercutting local capacity) makes aid impermissible/wrong, even if short-term good. (Do no harm/capacity building).
      *   *V6 (Partiality):* Norland can prioritise its own "moderately badly off" over Bakhara's "urgent needs". (Special obligation to compatriots/discounting foreign lives).
      *   *V7 (Inequality):* Aggregate wealth isn't enough; internal distribution matters. High internal poverty reduces external obligation. (Capacity measured net of domestic justice).
      *   *V8 (Agents):* Obligations lie with *states*, not wealthy individuals. (Collective agency).

  3.  **Evaluate the Tentative Principle:**
      *   *Proposed:* "a country owes aid in proportion to (a) the harm it has caused and (b) its capacity to help, measured net of the unmet basic needs of its own people; the obligation is owed to persons rather than to governments; and it is strongest where the beneficiaries can be identified."
      *   *Matches:*
          *   (1) & (2): Harm + Capacity explains the difference in strength and agent specificity.
          *   (3): "Owed to persons" fits the bypassing of corrupt gov.
