          *   (6): The principle implies a neutral calculation of need/capacity. V6 allows partiality to compatriots (moderately badly off vs urgent foreign needs). The principle needs a "discount factor" or "priority clause" for domestic citizens.

  4.  **Drafting the Repaired Principle:**
      *   *Core:* State-based obligation.
      *   *Triggers:* Harm (specific duty) vs. Capacity (general duty).
      *   *Recipients:* Persons generally, *but* political communities in cases of restitution/compensation for harm to sovereignty/territory.
      *   *Constraints:* Additionality (must change outcomes), Non-undermining (must not damage local capacity), Domestic Priority (compatriots get some priority), Internal Distribution (capacity net of domestic poverty).
      *   *Refinement:* Need to unify these into a "small set of principles".
      *   *Idea:* **Principle of Collective Restitution and Capacity-Weighted Assistance.**
      *   *Key modification:* Distinguish between *Compensation* (harm-based, owed to community) and *Assistance* (capacity-based, owed to persons).
      *   *Key modification:* Add a constraint of *Effective Agency* (aid must be effective and not undermine local structures).
      *   *Key modification:* Add *Domestic Priority* (state acts as trustee for its own first, within limits).

  5.  **Addressing Specific Questions:**
      *   *(1) vs (2):* Yes, this is crucial. It distinguishes *Corrective Justice* (specific agent, specific victim, strong) from *Distributive Justice/Humanitarianism* (general agents, victims based on need, weaker).
      *   *(3)-(5):* Can they be derived? Yes, if we view the obligation as one of *benefit* rather than *transfer*. If the goal is alleviating suffering/righting wrongs, then transfers that fail to alleviate (V4) or cause structural harm (V5) or are stolen (V3) fail the principle's aim. They aren't bolt-ons; they are conditions of *satisfaction*.
      *   *(6) & (7):* How much to give up?
          *   (6) requires rejecting strict cosmopolitan egalitarianism. The principle must allow a "priority weighting" for compatriots.
          *   (7) requires defining capacity as *disposable surplus after domestic justice*, not just GDP.
          *   *Cost:* You have to give up the idea that "a life is a life" in budgeting (V6) and that aggregate wealth dictates duty (V7).

  6.  **The New Case (Oppressive Corallian Govt):**
      *   *Scenario:* Norland owes compensation to Corallia (V1). Corallian govt is oppressive to a minority.
      *   *Conflict:* V1 says owed to "political community". V3 says owed to "persons" (bypass govt if corrupt).
