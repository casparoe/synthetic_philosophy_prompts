  *(Self-Correction during drafting)*: I need to be careful with V8. The tentative principle says "a country owes". V8 says "not wealthy individuals". This matches. I should ensure the repaired principle maintains the *state* as the primary agent.
  Also, regarding V1 vs New Case: V1 says "owed to Corallia as a political community, not merely to the individual". If I bypass the gov to give to individuals, am I abandoning V1? Yes, strictly speaking. I am accepting that in cases of oppression, the debt converts to individuals. I need to state this clearly.

