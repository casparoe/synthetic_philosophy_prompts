answer: |-
  There is no single universally standardized term, though sociologists often nest this under "medicalization." For your purposes, coin **"Therapeutic Determinism."**

  It defines the phenomenon where the ontological status of a condition (disease versus variation) is contingent upon the existence of a viable intervention. Unlike broad medicalization, which critiques medicine's cultural expansion, Therapeutic Determinism identifies the specific mechanism: the tool creates the target. Unlike social constructionism, which suggests the disease category is *only* a label, this acknowledges biological reality but argues that *clinical relevance* is assigned backward from the cure. It posits that we do not treat because it is a disease; it is a disease because we can treat it.

  Regarding edges: The intervention must be actionable, not theoretical. A research program alone does not trigger it; there must be a deployable tool (a pill, a procedure) ready for clinical use. Market availability matters because it signifies clinical consensus on utility. Conversely, demotion counts when the tool fails efficacy or is withdrawn, not merely when replaced by a better one. If the hammer disappears, the nail becomes a bump again.

  This distinguishes your characters' debate from simple greed or cultural shift. It is an epistemological collapse where capability dictates reality. It covers your observation that grief becomes pathology only when a pill arrives to dry it, and reverts to temperament when the pill proves useless. It is not that the biology changes, but that the definition of "broken" requires a available fix. This term gives your physician a precise vocabulary for the uncanny sensation that diagnosis is not a discovery, but an authorization granted by the toolkit.
