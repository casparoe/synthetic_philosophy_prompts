answer: |-
  **Case Design Logic**
  I considered a medical dosage calculation but worried it might imply exotic precision. A household budget was too vague on complexity. A workplace scheduling scenario fits best: rostering is famously NP-hard (general intractability), but a 3x3 assignment is trivially solvable by inspection (instance tractability). This isolates the variable: the agent cites the general class hardness to excuse skipping the specific easy check. The outcome is good (luck), but the procedure was negligent (skipped feasible verification).

  **Scenario**
  Maria, a clinic shift coordinator, must assign three nurses to three open slots this Tuesday. While the general problem of optimal staff rostering is computationally intractable (NP-hard), this specific instance involves only three employees with non-overlapping availability windows that can be verified by eye in seconds. Citing the computational complexity of scheduling algorithms to justify cutting corners, Maria skips the verification step and emails a roster generated by a random shuffle macro. By sheer luck, the random assignment respects all availability constraints and coverage requirements; the clinic runs smoothly with no overtime costs or patient care gaps.

  **Analysis**

  (i) **Verdicts:** The **Outcome View** exonerates Maria because the actual state of affairs is optimal (no harm, full coverage); blameworthiness tracks results, and the results were good. The **Procedure View** blames Maria because she failed to execute a feasible epistemic procedure (manual verification) that she was capable of running; blameworthiness tracks adherence to rational norms, and she was negligent.

  (ii) **Feature Doing the Work:** The divergence between the *computational complexity of the problem class* (general scheduling) and the *tractability of the specific instance* (three nurses).

  (iii) **Removing the Feature:** If the instance were actually large (e.g., 100 nurses), the specific instance would inherit the general intractability. The Procedure View would then exonerate Maria, as the feasible procedure constraint ("ought implies can") would prevent demanding a verification she could not computationally manage.

  (iv) **The Red Herring:** The general intractability of rostering is a red herring because moral and rational obligations attach to the agent's actual capacity in the specific context, not the worst-case bounds of the problem type; citing NP-hardness is an invalid excuse when the input size renders the problem constant-time solvable.

  (v) **Attack from the Outcome View:** A defender of the Outcome View would argue that blameworthiness is fundamentally retrospective and tied to harm; since Maria's action produced the best possible world-state, labeling her "blameworthy" fetishizes process over welfare. They would contend that procedural norms are merely heuristics for maximizing good outcomes, and when the heuristic is bypassed but the outcome secured, the normative force of the procedure dissolves.
