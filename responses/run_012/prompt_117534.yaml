answer: |-
  Ravi: The appeal of the mirror test is that it stops us from pretending our exclusions are neutral when they're just partisan. If a group says openly that they would ban us given the chance, then banning them isn't an asymmetry; it's a reciprocal defense of the very space where debate happens. It turns the paradox of tolerance into a procedure. We aren't saying their views are false; we're saying their rules for engagement are incompatible with ours.

  Jo: But that procedure hangs entirely on a counterfactual. You're asking a committee to judge what a group would do if they were in power. How are we supposed to know that? Are we reading their manifesto, guessing their hidden intentions, or predicting how they'd behave once the incentives of governance kick in? If it's prediction, we're terrible at it. If it's doctrine, you're ignoring bad faith actors who lie about their aims to get through the door.

  Ravi: It's not prediction, it's commitment. We aren't asking what they might pragmatically do once elected to the student union; we're asking what their principles commit them to. If a society's constitution says they oppose the legitimacy of certain members participating in union life, that's a doctrinal commitment to exclusion. We don't need to guess their behavior; we just need to read their stated aims. The test filters out those whose core project is the removal of the platform itself.

  Jo: That works for the honest intolerant, but they're rare. The real trouble comes from groups whose doctrine is vague but whose tactics are destructive. Take the talk last month that got shouted down. The inviting society claimed the speakers were just there for dialogue. Their doctrine didn't say ban anyone. But their supporters spent forty minutes heckling so no one else could speak. The mirror test looks at the declared programme and says let them in. But the harm wasn't in their programme; it was in their conduct. Your test is blind to the actual disruption that makes us want to exclude people in the first place.

  Ravi: You're conflating two different things. The mirror test is about status, about who gets to book the room. Conduct is separate. If they shout down a speaker, you sanction them for breach of conduct rules, not for violating the mirror test. The test is a threshold for eligibility, not a substitute for policing behavior. If we start banning groups based on how their supporters might behave, we're back to arbitrary discretion. At least with the mirror test, the group knows the rule: if your aim is to silence others, you don't get a mic.

  Jo: But status enables conduct. Giving them the platform legitimizes the disruption. And if the test only looks at doctrine, it misses the groups that want to capture the committee itself to change the rules later. They don't say they'll ban you now; they say they'll change the constitution so they can ban you later. Does the test catch that? If their declared programme is democratic change, even if that change leads to exclusion, the mirror test says they're fine. But the outcome is the same as the honest intolerant.

  Ravi: That's a harder case, I'll grant you. If their programme is to change the rules via valid procedures, then excluding them pre-emptively looks like we're saying democracy is only okay when it produces results we like. But there's a distinction between changing the rules and abolishing the game. If their aim is to remove the right of certain students to vote, that fails the mirror test. If their aim is to raise the threshold for inviting speakers, that might pass. We have to look at the end state they propose. Would that end state allow us to invite them? If yes, they're in. If no, they're out.

  Jo: So now the committee has to model a hypothetical future constitution and judge whether it would permit the current opposition. That's a heavy lift for a student union vice-president trying to approve a room booking. And it brings us to who applies the test. You're assuming the body applying the mirror test is itself tolerant. But what if the committee is already captured? They could apply the test to exclude their opponents by claiming those opponents would be intolerant. The test doesn't protect itself. It requires a tolerant enforcer, which means it can't be the foundation of tolerance. It's a rule that only works if you already have the virtue it's supposed to create.

  Ravi: Every rule requires an enforcer. The fact that a rule can be abused doesn't mean it's incoherent. We don't throw out laws against theft because corrupt police might enforce them selectively. The mirror test is a constraint on the enforcer, not a replacement for them. It forces them to justify exclusion in terms of reciprocity rather than dislike. Yes, a bad committee could misuse it, but a good committee needs a standard to aim for. Without it, you have no ground to stand on except say-so.

  Jo: But the say-so is exactly what's at issue. When you exclude someone using this test, you are tolerating their view but not their power to silence. Yet the reason you exclude them is that they would silence you. So you are silencing them to prevent them from silencing you. That's not tolerating the view; that's tolerating the existence of the group while suppressing their agency. You're drawing a line between holding a view and acting on it, but for political groups, acting on the view is the point. If you stop them from acting on their view of excluding others, are you really tolerating them, or just keeping them as pets until they bite?

  Ravi: We're tolerating their presence in the marketplace of ideas, not their attempt to close the market. There's a difference between tolerating a view and tolerating the silencing of a view. The paradox only bites if we think tolerance requires letting people destroy the conditions of tolerance. I'm saying it doesn't. We can allow them to argue their case, even if their case is that others shouldn't be allowed to argue. But we don't have to give them the keys to the building based on that argument. The test protects the building, not the occupants' feelings.

  Jo: I'll concede that the test works for formal policy changes. If a group explicitly wants to strip voting rights, the mirror test justifies blocking their access to institutional levers. That's clearer than a vague harm principle. But I don't think it covers the tactical disruption I mentioned earlier. You said conduct is separate, but if the test is the only justification for exclusion, then conduct violations get treated as mere disciplinary issues rather than existential threats to the platform. You need to admit the test isn't sufficient on its own. It needs a supplementary rule about actual harm, not just hypothetical reciprocity.

  Ravi: I can accept that. The mirror test is necessary for status-based exclusion, but not sufficient for all exclusion. If they burn a building, you ban them regardless of their doctrine. But for the hard cases—the ones where the harm is subtle, like eroding norms of debate—the mirror test is the only non-arbitrary tool we have. Without it, we're just guessing who's too dangerous. So I'll give you that it needs a conduct supplement. But without the mirror principle, the conduct rules become weapons. You need the reciprocity check to keep the conduct enforcement honest.

  Jo: But even with the supplement, you're still left with the problem of who judges the reciprocity. You say it forces the enforcer to justify exclusion in terms of reciprocity. But if I'm the enforcer, I decide what counts as reciprocity. If I decide that your view implies intolerance, even if you deny it, I've won. The test doesn't stop me; it just gives me a vocabulary to use. The real work is being done by my judgment, not your rule. So the rule is decorative. It makes us feel principled while we do the same thing we'd do anyway.

  Ravi: It's not decorative if it changes the burden of proof. Without the test, I can ban you because you're offensive. With the test, I have to show that your programme eliminates my liberty. That's a higher bar. It forces me to engage with your actual aims, not just your vibe. Yes, I still judge it, but I have to justify it publicly in terms of your commitments. That constraint matters. It stops me from banning you just because I think you're wrong. I have to show you're incompatible with the space itself.

  Jo: Incompatible with the space, or incompatible with your control of the space? That's where we're stuck. You say the test protects the building. I say the test protects the current tenants' right to decide who enters. If the building's rules are themselves up for debate, then using the rules to exclude those who want to change them is circular. You're using the current constitution to ban those who want to amend the constitution. That's not protecting the space; that's freezing it.

  Ravi: We're not freezing it; we're protecting the conditions under which it can be changed. If the proposed change removes the right of some to participate in the change, then it's not a valid amendment, it's a dissolution. The mirror test distinguishes between changing the rules and ending the game. You keep calling it circular, but it's more like a firewall. You can propose anything that doesn't delete the firewall itself.

  Jo: But who decides what counts as deleting the firewall? You do. And you're using the firewall to stop me from questioning whether you're the right person to manage it. That's the regress I'm talking about. You need a tolerant enforcer to apply the test, but the test is supposed to ensure tolerance. It assumes what it's trying to prove. I'm not saying throw it out, but don't pretend it solves the paradox. It just moves the paradox from the street to the committee room.

  Ravi: Maybe it moves it, but that's progress. Better to fight about the rule in the committee room than shout each other down in the hall. If we agree on the test, we agree on the terms of the fight. Even if we disagree on the application, we're disagreeing within a framework that demands reciprocity. That's better than no framework.

  Jo: It is better, provided we don't mistake the framework for the solution. But look at where we are. You've admitted the test doesn't cover tactical harm. I've admitted it works for formal rights stripping. But we still disagree on whether the test legitimizes the enforcer or just disguises their power. You think the constraint on justification is enough to make it legitimate. I think the constraint is too easy to manipulate to carry that weight.

  Ravi: Then we agree it's a tool, not a magic wand. But it's the best tool we have for distinguishing between enemies of the debate and participants in it. If you have a better one that doesn't rely on arbitrary discretion, I'm listening. Until then, I'd rather use the mirror and know its flaws than pretend we're being neutral when we're just being selective.

  Jo: I'm not suggesting we go back to pure discretion. I'm saying the mirror test is a starting point for the argument, not the end of it. When you ban someone using it, you shouldn't say the test required it. You should say we judged them intolerant by this standard, and we accept the responsibility for that judgment. The test doesn't absolve you of the decision. It just structures it.

  Ravi: I can live with that. It structures the decision. But I still think it does more than that. I think it actually identifies the groups that are unsafe for a pluralist space. You think it just identifies the groups the current committee finds unsafe.

  Jo: And until we can settle who gets to define safety, the test remains a weapon that looks like a shield. You say it identifies the unsafe groups. I say it identifies the groups the enforcer decides are unsafe. The words are the same; the authority behind them is the disagreement.

  Ravi: Then we'll have to agree to disagree on whether the authority can be constrained by the words. But at least we're arguing about the words instead of shouting over the mic.

  Jo: That's something, I suppose. But don't ask me to call it a solution.

  Ravi: I won't. I'll call it a condition for having the argument at all.
