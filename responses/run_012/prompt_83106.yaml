      *   *Check:* Did I answer the "prejudice" question clearly? I need to distinguish between disbelieving a person (testimonial) and refusing to understand a concept (hermeneutical). Pohlhaus says refusing the concept *is* the injustice.

  6.  **Final Polish:** Check against the prompt's specific constraints (finish with recommendation and loss). Ensure the "willful" objection is handled with nuance (habitual will).

  *(Self-Correction on the "No Blame" aspect)*: Fricker actually argues there is a *culpability* in hermeneutical injustice eventually, but the initial formulation emphasizes the structural lacuna. I need to be careful not to misrepresent Fricker as saying "no one is ever responsible," but rather that the *origin* of the harm is structural. Pohlhaus sharpens the responsibility of the *maintainers* of the structure.

  *(Refining the "Willful" definition)*: Make sure to mention that "willful" in this context is about the *investment* in ignorance. Ignorance is often produced, not just found.

