answer: |-
  This is an exquisite fork in the road. You have identified the precise tension that has animated the literature on epistemic injustice for the last decade. You are asking whether the problem is a *lack* (Fricker) or a *refusal* (Pohlhaus).

  Here is the breakdown of the terrain, the resolution of the "willful" objection, and my recommendation on how to structure your piece.

  ### 1. Rival Accounts or Distinct Phenomena?

  They are best understood not as rivals describing the exact same moment, but as **complementary diagnoses of different temporal phases of oppression.**

  Fricker's *Hermeneutical Injustice* describes the **genesis** of the gap. It explains how a lacuna comes to exist historically. When a group is excluded from the practices of meaning-making (journalism, law, science, philosophy), their experiences do not get codified into the shared social toolkit. In this phase, Fricker is right: there is no specific villain. It is a collective blind spot produced by structural exclusion. The harm is primarily internal to the marginalized knower (confusion, isolation, inability to make sense of self).

  Pohlhaus's *Willful Hermeneutical Ignorance* describes the **maintenance** of the gap. Once marginalized groups *do* generate the concepts (as they inevitably do, in subcultural spaces, art, or activism), the dominant group faces a choice: integrate these concepts into the shared toolkit or reject them. Pohlhaus argues that dominant knowers often reject them because integrating them would require dismantling their own self-conception or privilege.

  So, they are not mutually exclusive. Fricker explains why the map was blank; Pohlhaus explains why the map remains blank even after the explorers return with the data.

  ### 2. What Happens to Fricker's "No Blame" Claim?

  If Pohlhaus is right, Fricker's claim that "no one needs to be to blame" survives only as a historical observation, not a moral absolution.

  Fricker's "no blame" is meant to distinguish structural injustice from individual malice. She wants to show that you can be harmed by a system without a specific person punching you. Pohlhaus accepts this but adds a crucial caveat: **Structural positions create epistemic responsibilities.**

  If you occupy a dominant social position, you benefit from the current hermeneutical resources. Therefore, you have a duty to investigate their limits. If you fail to do so, you are not "innocent" in the way Fricker initially suggests. You are complicit. Pohlhaus shifts the locus of culpability from the *creation* of the gap (which might be historical/structural) to the *persistence* of the gap (which is often agential).

  If Pohlhaus is right, the "no blame" claim becomes "no *easy* blame." It removes the comfort of fatalism. It says: "This isn't just a tragedy; it's a choice."

  ### 3. Is It Still Hermeneutical Injustice, or Just Prejudice?

  This is the sharpest philosophical question you've raised. If the concept exists (e.g., "microaggression" or "systemic racism") but a dominant knower refuses to use it, isn't that just *Testimonial Injustice* (disbelieving the speaker) or ordinary prejudice?

  Pohlhaus argues it remains *Hermeneutical* because the refusal is directed at the **concept**, not just the person.

  *   **Testimonial Injustice:** "I don't believe *you* because you are a woman."
  *   **Willful Hermeneutical Ignorance:** "I don't believe *that concept* applies here, because I refuse to see the world through that framework."

  The harm is still hermeneutical because it prevents the concept from becoming *shared*. A concept only does hermeneutical work if it is part of the public currency. If I have the word for my oppression, but you refuse to recognize its validity, I am still blocked from rendering my experience intelligible *to the social world*. I am still hermeneutically marginalized, not because I lack the word, but because you refuse to let the word count.

  ### 4. The "Willful" Objection: Habit vs. Motive

  You are right to worry about the word "willful." It invites the skeptic to say, "I'm not *choosing* to be ignorant; I just don't know what I don't know."

  However, in this philosophical context (drawing on Nietzsche, Sartre, and Code), "willful" does not mean "conscious conspiracy." It means **active investment.**

  Think of it as **epistemic comfort.** To learn a new hermeneutical resource (like "privilege" or "harassment") requires cognitive labor. It requires admitting that your previous understanding of the world was incomplete or flawed. Most people avoid this not because they are evil, but because they are lazy or protective of their own ego.

  Pohlhaus's point is that this avoidance is not passive; it is an active cultivation of ignorance.
  *   **The Habit:** "I don't read those kinds of books."
  *   **The Upbringing:** "I was taught to trust official sources."
  *   **The Will:** These habits are maintained because they serve a function. They keep the world simple. They keep *you* good.

  If you are raised badly, that is not your fault. But if you remain raised badly as an adult when the resources to correct it are available, that is a form of willfulness. It is a refusal to do the epistemic labor required to know reality. The "will" is in the **resistance to learning**, not necessarily in a plotted decision to oppress.

  ### 5. Recommendation: Which Path to Take?

  You should hang the piece on **Pohlhaus**, but use Fricker as the setup.

  **Here is why:**
  Fricker's account is tragic, but it risks being politically paralyzing. If the problem is a "structural gap" where "no one is to blame," the solution is vague (wait for social change, hope for better concepts). It can inadvertently let the dominant reader off the hook. They can read your piece, nod sadly at the "structural hole," and feel no personal call to action.

  Pohlhaus's account is accusatory, but it is **actionable.** It demands that the reader examine their own epistemic habits. It transforms the piece from a description of suffering into a demand for responsibility. It answers the question: "What do I do now?" with "You go find the concepts you are ignoring."

  **What you lose by dropping Fricker:**
  If you drop Fricker entirely, you lose the **tragedy of the pre-conceptual.** You lose the ability to describe that specific, haunting horror of having an experience that literally has no name *anywhere*. There are still experiences (perhaps in neurodivergence, or new forms of digital abuse) where Fricker's "lacuna" is real and Pohlhaus's "refusal" doesn't yet apply. If you ignore Fricker, you lose the vocabulary for the most isolated moments of human suffering, where the victim is alone even with themselves.

  **What you lose by dropping Pohlhaus:**
  If you drop Pohlhaus, you lose the **politics of the present.** You treat current ignorance as inevitable rather than enforced. You risk writing a eulogy for understanding rather than a manifesto for it.

  **The Synthesis for Your Piece:**
  Start with Fricker to establish the stakes (the pain of not being understood). Show the reader the "hole." Then, introduce Pohlhaus to reveal that the hole is not empty—it is filled with the voices of the marginalized, which the dominant are choosing not to hear.

  Move the reader from the tragedy of **absence** (Fricker) to the culpability of **avoidance** (Pohlhaus). This gives you the emotional resonance of the victim's confusion *and* the moral force of the oppressor's responsibility. It allows you to tell the skeptic: "You may not have dug the hole, but you are standing on the edge refusing to throw down a ladder."
