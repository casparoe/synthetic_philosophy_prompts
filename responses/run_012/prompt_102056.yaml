answer: |-
  ### Brainstorm: Candidate Decision Rules

  Before committing to a prediction, I must enumerate the logical heurics (decision rules) consistent with the provided catalogue. My colleague is operating within the Langdon Winner tradition, which generally oscillates between two conceptions of technological politics: *inherent politics* (the technology demands a specific social order) and *external politics* (the technology is used to settle political disputes or produces political consequences).

  Here are the candidate rules she might be running:

  1.  **The Intentionality Rule:** An artifact is political only if the designers *intended* a political outcome (e.g., exclusion, control).
      *   *Status:* Likely false. The tomato harvester was "brought to market for efficiency" yet ruled political.
  2.  **The Inherent Compatibility Rule (Winner's Strong Thesis):** An artifact is political if it *requires* or *strongly favors* a specific form of social organization (e.g., hierarchy vs. decentralization). If it is compatible with multiple orders, it is not political.
      *   *Status:* Plausible. Fits Nuclear (requires hierarchy) and Solar (compatible with decentralization). Fits Moses (requires car ownership/class structure).
  3.  **The Distributional Consequence Rule:** An artifact is political if its operation systematically distributes benefits and burdens unequally across class, race, or power lines, regardless of intent or governance structure.
      *   *Status:* Plausible. Fits Moses (buses vs. cars), McCormick (capital vs. labor), Tomato (large vs. small).
  4.  **The Agency Displacement Rule:** An artifact is political if it structurally removes agency from one group and transfers it to another (e.g., from worker to machine, from public to expert).
      *   *Status:* Plausible. Fits Nuclear, McCormick, Moses. Solar and Axe leave agency with the user.

  ***

  ### 1. Prediction of Verdict

  **Verdict: Political.**

  I predict she will rule the navigation app is **political**. While the prompt notes the app "requires no particular social order" (aligning it with the *Solar* case), the description of its *effects* ("systematically shifts traffic... onto... poorer [neighborhoods]") aligns it structurally with the *Moses* and *Tomato* cases. In the Winnerian tradition, the "inherent politics" of a technology often includes the ways it settles disputes over who bears risk and who reaps reward. The fact that the political outcome was unintended (like the tomato harvester) will not save it from the verdict.

  ### 2. Candidate Rules Consistent with the Catalogue

  Two primary rules fit the existing verdicts equally well, creating the tension in the navigation app case:

  *   **Rule A: The Social Order Compatibility Rule.**
      *   *Definition:* An artifact is political if and only if it is incompatible with certain forms of governance (e.g., democracy, decentralization) and demands others (e.g., hierarchy, centralization).
      *   *Fit:* Explains **Nuclear** (demands hierarchy = Political), **Solar** (compatible with decentralization = Not Political), **Axe** (compatible with all = Not Political). It also fits **Moses** (demands car-owning class structure) and **Tomato** (demands large-scale capital agriculture).
      *   *Tension:* The navigation app "runs equally well under centralized or decentralized governance." Under Rule A, this suggests a verdict of **Not Political**.

  *   **Rule B: The Structural Bias Rule.**
      *   *Definition:* An artifact is political if its operation systematically encodes a bias in the distribution of power, risk, or access, favoring one social group over another, regardless of governance compatibility or designer intent.
      *   *Fit:* Explains **Moses** (favors drivers over bus riders), **McCormick** (favors capital over labor), **Tomato** (favors large growers over laborers/small farmers), **Nuclear** (favors experts over laypeople). It explains **Solar** and **Axe** as lacking systematic structural bias (they are tools adaptable to the user's will without enforcing a hierarchy).
      *   *Tension:* The navigation app "systematically shifts traffic... onto... poorer [neighborhoods]." Under Rule B, this suggests a verdict of **Political**.

  ### 3. Best Guess at the Actual Rule

  **The Rule:** **The Structural Bias Rule (modified).**
  **Reasoning:**
  My best guess is that she prioritizes **Distributional Consequence** over **Governance Compatibility** when the two conflict, provided the consequence is *systemic* rather than contingent.

  The **Tomato Harvester** verdict is the "smoking gun" here. It was designed for efficiency (neutral intent) and could theoretically be used in various economic systems, yet it is ruled **Political** because "in practice [it eliminated] most of the farm-labor jobs and favor[ed] large operations." This establishes that *outcomes that reconfigure power relations* trump *design intent*.

  The **Solar** verdict ("Not Political") is the counter-weight. Solar is not political not because it lacks consequences, but because it *increases* or *maintains* user agency ("a household... can own and operate") rather than constraining it. It does not *force* a hierarchy.

  The Navigation App, however, functions like the Moses Overpasses. Moses' bridges did not necessarily change the *form of government* (New York remained a democracy), but they encoded a specific exclusion into the landscape. Similarly, the Navigation App encodes a specific distribution of harm (noise/pollution) onto a specific class (renters/poor) to benefit another (drivers/owners). Even if the app's *corporate governance* is flexible, the *algorithmic operation* imposes a hierarchy of value (driver time > resident health). This structural bias makes it political in the same way the tomato harvester was: the technology itself becomes the mechanism of power distribution.

  ### 4. The Discriminating Case

  To force a choice between **Rule A (Social Order Compatibility)** and **Rule B (Structural Bias)**, I propose the following case:

  **Case:** **An Algorithmic Credit-Scoring System.**
  **Description:** A software package used by lenders to assess risk. It can be owned and operated by a state bank, a private corporation, or a cooperative (compatible with centralized or decentralized governance). However, due to the historical data it is trained on, it systematically denies loans to applicants from specific zip codes, which correlate strongly with race and class.

  **Why it Discriminates:**
  *   **Governance:** Like the **Solar** panel and the **Navigation App**, it is compatible with multiple social orders (Rule A predicts *Not Political*).
  *   **Bias:** Like the **Tomato Harvester** and **Moses' Bridges**, it systematically distributes burden (denial of capital) along class/race lines (Rule B predicts *Political*).

  **The Choice:**
  *   If she rules it **Not Political**, she is committed to **Rule A**: Politics resides in the *machinery of governance* the artifact demands.
  *   If she rules it **Political**, she is committed to **Rule B**: Politics resides in the *machinery of distribution* the artifact enacts.
  *   *Note:* This discriminates better than the Navigation App because the Nav App's "routing" could be argued to be a form of "governance" (traffic management), whereas credit scoring is purely evaluative, isolating the bias variable from the order variable.

  ### 5. Flagged Verdicts Ruling Out Candidates

  *   **The Tomato Harvester verdict rules out the Intentionality Rule.**
      *   *Reason:* The prompt explicitly states the harvester was "brought to market for efficiency" and "never designed with any political aim" (implied by the contrast with Moses). Since it is ruled **Political**, designer intent cannot be a necessary condition. This warns us not to accept the Navigation App's "never designed with any political aim" as exculpatory.

  *   **The Solar Installation verdict rules out a Crude Consequentialism Rule.**
      *   *Reason:* If *any* social consequence made an artifact political, Solar might qualify (e.g., it reduces utility company power, favors homeowners over renters). By ruling it **Not Political**, she signals that the consequence must be a *constraint on social possibility* or a *systemic reinforcement of hierarchy*, not merely a shift in market dynamics. This suggests the Navigation App will only be political if the burden-shifting is seen as a structural constraint on the residents' quality of life, akin to the exclusion of the bus riders.
