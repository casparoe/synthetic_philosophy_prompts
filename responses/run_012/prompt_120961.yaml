  You're a philosopher of language who knows early analytic philosophy cold, and I need actual help understanding a passage rather than the standard summary. Think carefully before answering, and start by putting the passage's claims in your own words before you evaluate anything.

  Here's the passage, from Russell's "On Denoting" (1905):

  "By a 'denoting phrase' I mean a phrase such as any one of the following: a man, some man, any man, every man, all men, the present King of England, the present King of France, the center of mass of the solar system at the first instant of the twentieth century, the revolution of the earth round the sun, the revolution of the sun round the earth. Thus a phrase is denoting solely in virtue of its form. We may distinguish three cases: (1) A phrase may be denoting, and yet not denote anything; e.g., 'the present King of France'. (2) A phrase may denote one definite object; e.g., 'the present King of England' denotes a certain man. (3) A phrase may denote ambiguously; e.g. 'a man' denotes not many men, but an ambiguous man."

  And then the bit thats actually bugging me, a couple paragraphs down, where he states the principle of his theory: "denoting phrases never have any meaning in themselves, but that every proposition in whose verbal expression they occur has a meaning."

  My confusion: in the first passage he's happy to say these phrases denote, or fail to denote, or denote ambiguously — 'the present King of France' is still classified as a denoting phrase, just one that doesn't denote. Then he turns around and says they have no meaning in themselves. So is "denoting" supposed to be a property of the phrase at all, or is it being quietly reassigned to something else? And how does 'a man' count as denoting ambiguously rather than just being a quantifier with no denotation to speak of — dosen't his own analysis of 'I met a man' as a claim about some x that is human and met, make the ambiguous-denotation talk a leftover way of speaking that the theory should really drop?

  Second thing. He also says "All thinking has to start from acquaintance; but it succeeds in thinking about many things with which we have no acquaintance." Fine. But we have no acquaintance with the center of mass of the solar system. So when I understand a proposition about it, what is that proposition composed of on his view? I want the mechanics here, not "he gives a quantificational paraphrase." What am I acquainted with when I grasp it, and does the no-meaning-in-themselves doctrine fall out of the acquaintance requirement, or is it doing separate work?

  Last: if you think these passages are in genuine tension rather than one being loose phrasing, tell me which reading of "meaning" would have to be in play to keep them consistent, and whether that's a reading Russell would actually have accepted.
