  *(Self-Correction on the "User" point)*: I need to be careful. In Graziano's AST, the "self" is a schematic model. In Dennett's view, the "self" is a center of narrative gravity. Both agree there isn't a *real* entity having the experience. In UX, the User is the *client*. If I say "The brain is the agency and the self is the client," that implies the client exists. I need to frame the "User" as a *persona* created by the system for the system.

  *(Refining the "Lie" point)*: A simplification preserves function. A lie breaks function eventually. Illusionists argue the "lie" (qualia) *is* the function. It's a control signal. So it's not a lie that hinders function; it's a fictional variable that drives real logic. Like a variable named `is_happy` that doesn't map to a state but triggers behavior.

