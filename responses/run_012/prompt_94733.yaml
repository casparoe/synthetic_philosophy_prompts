  | Defeater | Kind | What it would show if it succeeded | Status | How a Prioritarian would respond | Verdict for you |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **The Measurement Requirement** | Conceptual / Meta-ethical | The view is inoperable because cardinal, interpersonally comparable well-being does not exist or is inaccessible. | **Live Threat** | **Concede & Dig In:** Admit the requirement is heavy but argue that without *some* cardinal scale, *any* distributive view (including utilitarianism) fails. We must construct a scale (e.g., objective list) to make progress. | **Serious** |
  | **Arbitrary Weighting Function** | Conceptual / Intuition | The view lacks determinacy; the "concave transformation" is a free parameter that slides between utilitarianism and leximin without principled guidance. | **Live Threat** | **Dismiss as Specification:** Argue the *principle* (priority to the worse off) is sound, even if the *rate* is context-dependent or requires reflective equilibrium to fix. | **Merely Awkward** |
  | **Ex Ante / Ex Post Incompatibility** | Formal Result (Otsuka & Voorhoeve) | You cannot satisfy both individual rationality (ex ante) and social fairness (ex post) under uncertainty; one must be violated. | **Live Threat** | **Concede & Choose:** Most choose Ex Post Prioritarianism, accepting that it may violate individual rationality in risky cases (e.g., denying a gamble beneficial to all in expectation). | **Serious** |
  | **Leveling-Down Objection (Revisited)** | Intuition about a case | That Prioritarianism implicitly values equality, making it vulnerable to the same objection it was designed to escape. | **Settled in Favour** | **Dismiss:** The view values absolute gains weighted by level, not gaps. If no one gains, no value is generated. LDO does not apply. | **Merely Awkward** |
  | **Aggregation vs. Numbers** | Intuition / Formal | A steep weighting function implies a small gain to many worse-off people outweighs a massive loss to a few better-off people (ignoring numbers). | **Live Threat** | **Concede:** Accept that numbers count for less than absolute levels. This is a feature, not a bug, distinguishing it from utilitarianism. | **Serious** |
  | **Unfalsifiability via Qualification** | Meta-philosophical | The view can be tweaked (e.g., adding thresholds, changing weights) to match any intuition, rendering it empty. | **Live Threat** | **Dismiss:** All normative theories require parameters. The core claim (benefits matter more at lower levels) remains testable against core cases. | **Merely Awkward** |

  ### Closing Analysis

  The single most decisive item against your view is the **Ex Ante / Ex Post Incompatibility**. Unlike the weighting shape, which is a matter of degree, this is a formal proof that Prioritarianism forces a choice between two deeply held commitments: respecting individual rational expectations (ex ante) and respecting the moral importance of who actually ends up worse off (ex post). If you find it intolerable that a Prioritarian must sometimes advise against a gamble that is in everyone's self-interest (to preserve ex post priority), the view collapses. The single weakest item is the **Leveling-Down Objection (Revisited)**; Prioritarianism was explicitly engineered to solve this, and unless you conflate "priority" with "equality," the objection simply fails to stick.

  To actually change your mind, you would need to encounter a robust defense of **Relational Egalitarianism** that avoids the Leveling-Down Objection by grounding equality in social relations rather than distributive patterns, or you would need to find that the **Measurement Requirement** renders the priority weighting so arbitrary that Utilitarianism (which requires the same measurement but fewer parameters) becomes the more parsimonious choice. If you cannot tolerate the Ex Ante/Ex Post dilemma, you should abandon Prioritarianism; if you cannot tolerate the Measurement Requirement, you should abandon distributive consequentialism entirely.
