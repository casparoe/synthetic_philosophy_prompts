prompt: |-
  Ok so I'm a backend engineer, no formal philosophy or econ training beyond a couple of coursera courses, and I've gotten weirdly stuck on the two-envelope puzzle. Not stuck like "I can't follow the math," stuck like I don't buy any of the standard ways out.

  Here's my position, and I want you to try to wreck it. The whole "you should always switch" thing is just a bug in how the expectation gets written down. The argument goes: you're holding x, the other envelope is equally likely to hold 2x or x/2, so the expected gain from swapping is (1/2)(2x) + (1/2)(x/2) − x = x/4, which is positive, so switch. But that "equally likely" is being applied to the same x in two worlds with different total pots — it's quietly swapping the prior for the posterior. If I fix an actual joint distribution over the pair of amounts and then condition on the amount I actually saw, I don't think I can get positive expected gain for every amount I might see, and the unconditional expected gain from swapping has to be exactly zero by symmetry. So there's no paradox, there's no obligation to switch, and the only thing left to explain is why the buggy argument feels so airtight. The residual itch — "yeah but it still feels like I should switch" — is a fact about me, not about envelopes.

  What I want: everything that counts against this, sorted by how much it should actually move me. Things I'm specifically worried about:

  - Somebody told me there's a trick where you either open the envelope or you don't — I can't remember which — and you use a probability of switching that goes down as the amount you see goes up, and you end up with the bigger envelope more than half the time. If that's real, does it break my story? Or is it totally consistent with expected gain being zero and I'm just confusing expected value with probability of winning? And which of those two should I actually care about if I'm the one holding the envelope?
  - I'm pretty sure the only way to make always-switch come out true is with a prior that isn't a real probability distribution — one that sums to infinity. But I have a nagging feeling that's wrong, and that you can get the same effect with a perfectly respectable, honest-to-god distribution, and that what actually matters is something about the mean being infinite rather than the distribution being improper. If that's the case, what does it do to my "it's just a bookkeeping bug" line? Does the bug get bigger or smaller?
  - There are variants where the envelopes get filled after you've already picked one, and variants where two people each hold an envelope and both can ask to swap. Which of these are genuinely different problems and which are the same problem in a hat? I suspect at least one of them is a case where my "just fix a distribution" move doesn't apply at all, because the original puzzle never hands you a distribution in the first place — and maybe "there's no fact of the matter about the expected value" is an evasion dressed up as a solution rather than an actual answer.
  - Does my position predict anything? If it's true, what should be true about the variants that wouldn't be true if the paradox were real? If it turns out my view predicts nothing and just re-describes the situation in fancier words, tell me that's a problem, because I genuinely can't tell whether I've solved something or just refused to engage with it.

  Please rank the objections from fatal to merely awkward, tell me which ones a defender of my line would themselves concede versus wave away, and say honestly whether my view has been qualified into unfalsifiability — and if it has, whether that's actually a problem for a view of this kind or just what any good dissolution looks like. Also: no reading lists, no citations, I'm not going to go read papers. If you're leaning on a specific result, explain the result and why it holds. And if my whole framing is off because the real question is normative — what should I do when I don't know the distribution — rather than descriptive, say so up front.
