          *   **Fact Check:** False/Highly Exaggerated. The field is notoriously contentious. There are "generalists" (conspiracy theories are inherently suspect) vs. "particularists" (judge each on merits).
          *   **Verdict:** Oversimplification/Wrong.

      *   *Sentence 2:* "What makes a conspiracy theory irrational isn't its content, it's its structure — the signature move is self-sealing reasoning, where counter-evidence gets folded back in as further proof of the cover-up, so the theory is unfalsifiable by construction."
          *   **Fact Check:** This is the "Generalist" or "Structuralist" view (associated with Quassim Cassam, Cailin O'Connor, etc.). It argues CTs have a distinct epistemic vice (closed-mindedness). However, "Particularists" (like Charles Pigden, David Coady) argue that many CTs *aren't* structurally different from standard historical explanations (e.g., Watergate).
          *   **Verdict:** Presents one side (Generalism) as the whole field.

      *   *Sentence 3:* "That's why believing one is always epistemically irrational, even in the rare case where the conspiracy turns out to be real; rationality is about your evidence and your method, not about whether you got lucky."
          *   **Fact Check:** This follows from the Structuralist view. If the *method* is flawed, the belief is irrational regardless of truth. Particularists disagree, arguing that if the evidence supports the conspiracy, believing it is rational.
          *   **Verdict:** Consistent with Sentence 2, but still represents only one camp (Generalism).

      *   *Sentence 4:* "And the reason this is a general point rather than a case-by-case one is that 'conspiracy theory' just means an explanation that posits a conspiracy — the phrase is descriptive, not a slur."
          *   **Fact Check:** This is the "Neutral Definition" camp (Pigden, Coady). They argue we shouldn't build irrationality into the definition.
          *   **Conflict:** Wait. Sentence 2 & 3 say CTs are *inherently* irrational/structurally flawed. Sentence 4 says the term is *neutral/descriptive*. These are usually opposing positions. Generalists often argue the term *does* carry a negative epistemic weight or that the *structure* makes it negative. Particularists argue the term is neutral to allow for rational CTs (like Watergate).
          *   **Verdict:** **Major Conceptual Slippage.** He is mixing the "Neutral Definition" (Particularist) with the "Inherent Irrationality" (Generalist) conclusion.

      *   *Sentence 5:* "So you can't rescue a particular theory by pointing out that conspiracies do sometimes really happen."
          *   **Fact Check:** This is the conclusion. If CTs are structurally irrational (Sentence 2), then yes, real conspiracies don't save the *method*. But if the term is neutral (Sentence 4), then pointing out real conspiracies *does* rescue the category, even if specific theories are still wrong.
          *   **Verdict:** The conclusion follows from Sentence 2/3, but is undermined by the premise in Sentence 4.

  3.  **Synthesize the "Two Positions" (The Mix-up):**
      *   **Position A: Particularism (Neutral Definition).** "Conspiracy theory" is just an explanation involving a conspiracy. Some are rational (Watergate), some aren't (Flat Earth). You judge them case-by-case. (Associated with Pigden, Coady).
      *   **Position B: Generalism (Structural/Epistemic Vice).** Conspiracy theories share a specific, flawed cognitive structure (self-sealing, unfalsifiable). Therefore, they are *prima facie* irrational. (Associated with Cassam, Sunstein/Vermeule to an extent).
      *   **The Friend's Error:** He uses the Particularist definition (Sentence 4: "it's descriptive, not a slur") to support the Generalist conclusion (Sentence 2/3/5: "believing one is always epistemically irrational"). This is incoherent. If it's descriptive, you *can* have rational ones. If they are always irrational, it's not purely descriptive.

  4.  **Evaluate the Final Conclusion:**
      *   "You can't rescue a particular theory by pointing out that conspiracies do sometimes really happen."
      *   **Does it survive?**
          *   From a Generalist view: Yes, because the *method* is the problem, not the existence of conspiracies.
          *   From a Particularist view: No, this is the whole point. The "Conspiracy Theory" label shouldn't dismiss the claim automatically. The fact that conspiracies happen means we must evaluate evidence, not dismiss the category.
      *   **Verdict:** The conclusion is a Generalist claim. It survives *if* you accept the Generalist premise (Sentence 2), but the friend tried to justify it using the Particularist premise (Sentence 4), which actually weakens it.

