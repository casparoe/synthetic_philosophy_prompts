  7.  **Final Polish:** Check against constraints. No reading list. Tell them where to land. (Land on: Your intuition is correct, he's conflating two opposing views to make his sound like consensus).

  *(Self-Correction on "Convergence"):* Is there *any* convergence? Maybe on the idea that "conspiracy theory" is a contested concept. But definitely not on the irrationality claim. I need to be firm that "convergence" is false.

