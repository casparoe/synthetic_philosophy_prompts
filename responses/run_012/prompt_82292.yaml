  Shipwrecks suspend normal rules. Saving a spouse is value-based. Saving a stranger is permissible if risk is low. Do not classify rescue as sacrifice unless the rescuer dies without achieving their own survival value. Emergency morality is temporary; do not institutionalize the lifeboat. A man who lives by the rule of the shipwreck will perish on the mainland. Treat these instances as quarantine cases. They do not establish precedent for normal existence.

  **Where This Guide Takes Liberties**

  (Author's Voice) I am confident this reflects Rand's definition of sacrifice as surrendering a greater value for a lesser one. The satire lies in the unfalsifiability: any internal benefit reclassifies the act as a trade. This rests on a contested reading of whether "psychic profit" truly nullifies sacrifice in her view, or if that slides into psychological egoism she explicitly rejected. I am least sure if she would accept the "trade for peace of mind" classification for all charity; she might argue some charity is simply irrational, not a trade. However, the guide's rigidity highlights the difficulty of observing internal value hierarchies from the outside. The taxonomy is perfect because it defines away the phenomenon it claims to study.
