answer: |-
  # Requirements

  *   **Phenomenal Unity:** The theory must explain how disparate qualitative states (e.g., visual, auditory, somatic) are experienced as a single, coherent field rather than a disjointed bundle. *Motivation:* Introspection reveals a unified "phenomenal field"; if micro-experiences remain isolated, the macro-subject is an illusion. A theory that yields only a collection of micro-subjects fails to account for the unity of consciousness we actually inhabit.
  *   **Constitutive Grounding:** The existence and nature of the macro-subject must be metaphysically grounded in the existence and nature of the micro-level entities, without brute emergence. *Motivation:* To avoid magic or dualist interactionism, the macro-fact must hold in virtue of the micro-facts. If consciousness simply "pops" into existence at a certain complexity level without being constituted by the base, the theory violates naturalistic closure and intelligibility.
  *   **Subject Distinctness (Candidate Commitment):** The macro-subject must be ontologically distinct from any single micro-subject and from their mereological sum. *Motivation:* I am not an electron, nor am I merely a "heap" of electrons; I am a singular entity with properties (like complex thought) no single micro-entity possesses. *Counter-consideration:* Some argue this is a linguistic confusion; if the micros exist, perhaps the "macro" is just a convenient label for their arrangement (Eliminativism/Universalism), making distinctness a preference of non-reductive camps rather than a metaphysical necessity.
  *   **Phenomenal Opacity:** The macro-subject's experience must not explicitly contain the micro-subjects' experiences as distinct sub-components. *Motivation:* We do not feel the experiences of our neurons or atoms; we feel headaches and seesaws. If combination implies that the macro-subject experiences the micro-experiences *as such*, the theory contradicts empirical phenomenology. The micro-contributions must be transformed or subsumed invisibly.
  *   **Parsimony of Subjects (Candidate Commitment):** The theory must not posit more subjects of experience than are strictly required to explain the behavioral and phenomenal facts. *Motivation:* Positing conscious entities where there is no evidence (e.g., in every electron) violates Occam's Razor and creates an epistemological burden (the "crowded world" problem). *Counter-consideration:* If consciousness is fundamental, parsimony regarding *matter* might require abundance regarding *mind*; thus, this may be a methodological preference for physicalists rather than a metaphysical constraint on consciousness itself.
  *   **Causal Relevance:** The macro-subject must possess causal powers that are not fully exhausted by the causal powers of its micro-constituents. *Motivation:* If the micro-entities do all the causal work, the macro-subject is epiphenomenal, rendering agency and moral responsibility illusory. However, this must be balanced against the causal exclusion principle, which suggests no room for overdetermination.
  *   **Boundary Precision:** The theory must provide non-arbitrary criteria for where one subject ends and another begins (or where combination stops). *Motivation:* Without clear boundaries, we face a sorites paradox of subjecthood (e.g., are two people holding hands a single subject?). Vagueness in existence is metaphysically costly; a theory must explain why *I* am a subject but *I-plus-the-chair* is not.

  # Load-bearing vs. optional

  *   **Non-negotiable (Load-bearing):** Phenomenal Unity, Constitutive Grounding, Phenomenal Opacity. Without these, the theory either fails to describe the phenomenon (Unity), fails to be metaphysically intelligible (Grounding), or fails to match the data (Opacity).
  *   **Contested/Optional (Camp Preferences):** Subject Distinctness and Parsimony of Subjects. Distinctness is rejected by eliminativists and some universalists who view the macro-subject as a fiction or identical to the sum. Parsimony is rejected by panpsychists who prioritize continuity over ontological economy. Causal Relevance is load-bearing for those who believe in agency, but optional for epiphenomenalists. Boundary Precision is load-bearing for realists about objects, optional for those accepting ontic vagueness.

  # Irreconcilable pairs

  *   **Subject Distinctness vs. Constitutive Grounding:** This is the core tension of the Combination Problem. If the macro-subject is *constitutively grounded* in micro-subjects (Requirement 2), it is difficult to see how it can be *ontologically distinct* (Requirement 3) without being a brute emergence. If it is distinct, it seems to be a new entity over and above the grounds, violating the "in virtue of" relation. If it is not distinct, it collapses into the micros, violating the intuition that "I" am something more than a sum. You can have grounding or distinctness, but securing both without contradiction is the primary metaphysical hurdle.
  *   **Parsimony vs. Constitutive Grounding (in a physicalist framework):** If one demands strict Parsimony (Requirement 5) and denies consciousness to fundamental particles, one must accept Brute Emergence at the macro level, violating Constitutive Grounding (Requirement 2). Conversely, if one preserves Constitutive Grounding by positing consciousness at the micro-level (panpsychism), one violates Parsimony by populating the world with ubiquitous subjects. The triad of {Parsimony, Grounding, No Micro-Consciousness} is inconsistent.
  *   **Phenomenal Opacity vs. Constitutive Grounding:** If the macro-experience is constituted by micro-experiences, there must be a relation of "phenomenal bonding." However, if the macro-subject does not experience the micro-experiences (Opacity), it is unclear in what sense the micro-experiences *constitute* the macro-experience rather than merely causing it. If they are truly constitutive, their phenomenal character should arguably be accessible or present in the whole, yet Requirement 4 demands they be hidden.

  # Contenders at a glance

  *   **Panpsychism:** Secures Constitutive Grounding and avoids Brute Emergence by distributing consciousness downwards, but struggles severely with Phenomenal Unity (the Subject Summing Problem) and violates Parsimony by positing ubiquitous subjects. It often fails Phenomenal Opacity unless it posits radical transformation laws.
  *   **Cosmopsychism:** Solves Phenomenal Unity by positing a single cosmic subject, grounding macro-experiences in modifications of the whole. However, it struggles with the "Decomposition Problem" (how one subject splits into many) and violates Parsimony and Subject Distinctness (individuals are merely modes of the One, not distinct subjects).
  *   **Emergentism:** Preserves Parsimony and Subject Distinctness easily, as macro-subjects are new entities. However, it fails Constitutive Grounding by accepting brute emergence, rendering the origin of consciousness metaphysically unintelligible, and risks making the macro-subject epiphenomenal to avoid causal exclusion.
