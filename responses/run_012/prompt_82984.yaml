answer: |-
  ### Brainstorm: Axes of Division

  Before constructing the taxonomy, we must identify the logical fault lines that separate competing views on the frame problem. These axes determine how a theorist diagnoses the failure of a system to act intelligently.

  1.  **The Locus of Difficulty (Representation vs. Relevance vs. Embodiment):**
      *   *Representation:* Is the problem that we cannot formally write down what *stays the same* when an action occurs (the persistence problem)?
      *   *Relevance:* Is the problem that we cannot filter out what *does not matter* when planning an action (the relevance problem)?
      *   *Embodiment:* Is the problem that using explicit representations at all is the wrong model for intelligent coping (the situatedness problem)?

  2.  **The Nature of the Obstacle (Conceptual vs. Computational vs. Engineering):**
      *   *Conceptual:* Is the difficulty a logical flaw in how we define truth and inference (e.g., monotonic logic)?
      *   *Computational:* Is the difficulty a matter of tractability (e.g., combinatorial explosion)?
      *   *Engineering:* Is the difficulty merely a lack of current technical sophistication (e.g., better indexing)?

  3.  **The Scope of Application (Artifact vs. Organism):**
      *   *AI-Specific:* Is this a bug unique to symbolic computers that human brains do not share?
      *   *General:* Is this a fundamental feature of any finite reasoner, including humans, implying a limit on what thought can be?

  ---

  ### Taxonomy of Positions on the Frame Problem

  **Node 1:** Consider a robot instructed to wait in a room for one minute. When it finishes waiting, does its primary failure lie in being unable to represent that the wall color *did not change*, or in being unable to ignore the wall color when deciding what to do *next*?
  *   **A.** It cannot represent that things stayed the same. (Go to Node 2)
  *   **B.** It cannot ignore what is irrelevant. (Go to Node 5)

  **Node 2:** If the problem is representing stability, does the system fail because standard logic requires a specific rule for every unchanged fact, or because checking all those rules takes too long?
  *   **A.** It requires a specific rule for every fact (Logical Expressiveness). (Go to Node 3)
  *   **B.** Checking the rules takes too long (Computational Load). (Go to Node 4)

  **Node 3:** If the problem is logical expressiveness, is this limitation unique to formal computer languages, or does it apply to human thought as well?
  *   **A.** Unique to formal languages. (Leaf 1)
  *   **B.** Applies to human thought as well. (Leaf 2)

  **Node 4:** If the problem is computational load, is this slowness due to a lack of clever indexing tricks, or is it a fundamental cost of verifying every fact?
  *   **A.** Lack of indexing tricks. (Leaf 3)
  *   **B.** Fundamental cost of verification. (Leaf 4)

  **Node 5:** If the problem is ignoring irrelevance, is the failure due to insufficient processing power to sort facts, or due to a lack of bodily context to determine what matters?
  *   **A.** Insufficient processing power. (Go to Node 6)
  *   **B.** Lack of bodily context. (Go to Node 7)

  **Node 6:** If the failure is due to processing power, can this be solved by faster hardware and better search algorithms in principle, or is the search space inherently exponential?
  *   **A.** Solvable in principle. (Leaf 5)
  *   **B.** Inherently exponential. (Leaf 6)

  **Node 7:** If the failure is due to a lack of bodily context, should we replace symbolic rules with neural networks, or abandon internal representations entirely?
  *   **A.** Replace with neural networks. (Go to Node 8)
  *   **B.** Abandon internal representations. (Go to Node 9)

  **Node 8:** If using neural networks, is intelligence best understood as statistical pattern matching, or as continuous physical coupling with the environment?
  *   **A.** Statistical pattern matching. (Leaf 7)
  *   **B.** Continuous physical coupling. (Leaf 8)

  **Node 9:** If abandoning representations, is the system a simple stimulus-response machine, or an active participant creating meaning through interaction?
  *   **A.** Simple stimulus-response machine. (Leaf 9)
  *   **B.** Active participant creating meaning. (Leaf 10)

  ---

  ### Leaf Positions and Commitments

  **Leaf 1: The Syntactic Frame Problem (Classic AI)**
  *   **Position:** The problem is a bug in formal logic systems that can be fixed by non-monotonic logic or circumscription.
  *   **Awkward Commitment:** Commits to the view that human thought relies on hidden logical formalisms that we have not yet fully discovered.
  *   *(Associated with: McCarthy, Shanahan)*

  **Leaf 2: The Philosophical Frame Problem (Fodor)**
  *   **Position:** The problem reveals that human cognition also relies on unstated background assumptions that cannot be fully formalized.
  *   **Awkward Commitment:** Implies that human thought is either magically non-computational or permanently inexplicable by science.
  *   *(Associated with: Fodor)*

  **Leaf 3: The Engineering Frame Problem**
  *   **Position:** The problem is merely a matter of optimizing database retrieval and update mechanisms.
  *   **Awkward Commitment:** Implies that intelligence is just a matter of bigger databases and faster retrieval, ignoring semantic understanding.
  *   *(Associated with: Early GOFAI practitioners)*

  **Leaf 4: The Tractability Frame Problem**
  *   **Position:** The problem is a fundamental limit on any system that verifies facts sequentially.
  *   **Awkward Commitment:** Suggests that perfect rationality is impossible for any physical system, including humans.
  *   *(Associated with: Dennett)*

  **Leaf 5: The Heuristic Solution**
  *   **Position:** Relevance is determined by practical rules of thumb that work most of the time.
  *   **Awkward Commitment:** Risks missing critical rare events by ignoring them too often based on past statistics.
  *   *(Associated with: Minsky)*

  **Leaf 6: The Global Relevance Problem**
  *   **Position:** The difficulty of selecting relevant facts is computationally unsolvable for any bounded system.
  *   **Awkward Commitment:** Concludes that thought cannot be modeled as computation over representations at all.
  *   *(Associated with: Haugeland)*

  **Leaf 7: Connectionism**
  *   **Position:** Intelligence emerges from weighted connections that adjust based on error, bypassing explicit symbol manipulation.
  *   **Awkward Commitment:** Struggles to explain systematic reasoning, language structure, and compositionality.
  *   *(Associated with: Churchland)*

  **Leaf 8: Dynamic Systems Theory**
  *   **Position:** Intelligence is a continuous trajectory of state changes coupled to the environment, not discrete steps.
  *   **Awkward Commitment:** Makes mental content hard to locate or define precisely within the system.
  *   *(Associated with: Van Gelder)*

  **Leaf 9: Behaviorism / Subsumption Architecture**
  *   **Position:** Intelligence is achieved by layering simple reactive behaviors without internal world models.
  *   **Awkward Commitment:** Cannot easily account for planning, delayed gratification, or reasoning about absent objects.
  *   *(Associated with: Brooks)*

  **Leaf 10: Enactivism**
  *   **Position:** Intelligence is a process of sense-making brought forth by the history of structural coupling between agent and world.
  *   **Awkward Commitment:** Risks making intelligence so dependent on specific context that it cannot be generalized or replicated.
  *   *(Associated with: Varela, Thompson)*

  ---

  ### Diagnostic Notes on the Taxonomy

  **Indistinguishable Leaves:**
  *   **Leaf 7 (Connectionism) and Leaf 8 (Dynamic Systems):** These positions are often difficult to separate empirically. Both reject discrete symbolic manipulation in favor of continuous, sub-symbolic processes. The distinction rests on whether one emphasizes the *learning algorithm* (statistical) or the *temporal evolution* (physical coupling), but in practice, many modern systems blend both.

  **Unoccupied Combinations:**
  *   **Human Thought + Engineering Problem (Node 3, Path A -> Node 4):** It is incoherent to claim that the logical limitation applies to human thought (Node 3B) but is solvable by engineering tricks (Node 4A). If the limitation is inherent to human cognition, it cannot be engineered away without changing the nature of the mind.
  *   **No Representation + Tractability (Node 7, Path B -> Node 6):** This combination is a category mistake. Tractability problems arise from searching through a space of representations. If one abandons internal representations entirely (Node 7B), the question of computational tractability over those representations ceases to apply.
  *   **Universal Boundedness + AI Specific Fix (Node 3, Path B -> Node 1):** It is unattractive and logically unstable to argue that the frame problem is a general feature of all finite reasoners (including humans) but can be solved by a fix specific to artificial formalisms (like circumscription). If humans have the problem, the solution must be biological or psychological, not purely syntactic.
