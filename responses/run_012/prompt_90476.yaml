      *   **Goal:** Prepare for the question period, *not* improve the paper.
      *   **Thesis:** Historians should admit non-human factors (pathogens, climate, volcanoes) as "historical actors" in a *thin* sense (difference-makers altering payoffs, not purposive agents or sufficient causes). Distinguishes three roles: background, multiplier, trigger. Argues environmental determinism charge only holds if these are collapsed. Case study: 530s/540s volcanic cooling + Plague of Justinian.
      *   **Audience (5 specific people):**
          1.  Macro-scale Environmental Historian (sympathetic to large causal claims, impatient with contingency).
          2.  Social Historian (views non-human causes as evasion of power/class/empire analysis).
          3.  Historical Climatologist (exacting about proxy reconstructions/inference).
          4.  Historian of Medicine/Empire (believes "germs as actors" exonerates human agents moving pathogens).
          5.  Philosopher of History (interested in the ontology of "actor": metaphor, category mistake, or causal claim).
      *   **Deliverable:** A briefing sheet.
      *   **Constraints:** No argument restatement, no field explanation. Focus on the room. Objections ordered by likelihood/damage. Phrased in the objector's vocabulary. 90-second replies. Honest note on reply weakness. Advice on concessions, misunderstandings, the "sink" objection, and the "hope nobody asks" question.

  2.  **Deconstruct the Audience & Anticipate Objections:**

      *   *Macro-scale Enviro Historian:* Wants big causal claims. Might think the "thin sense" is too timid, watering down the impact of environment. "Why stop at 'difference-maker'? Why not cause?"
      *   *Social Historian:* Suspicious of materialism displacing politics. "This sounds like excuses for elite failure." "Where is the agency of the oppressed?"
      *   *Historical Climatologist:* Technical scrutiny. "Can you actually prove the cooling affected *this* specific strategy? Proxies are regional, not local."
      *   *Medicine/Empire Historian:* Moral/Political critique. "Blaming the germ lets the merchants/emperors off the hook for spreading it."
      *   *Philosopher:* Ontological critique. "What does 'actor' mean? Is this just anthropomorphism?"

  3.  **Prioritize Objections (Likelihood & Damage):**
      *   *High Damage/High Likelihood:* The Social Historian (ideological challenge to the core method) and the Philosopher (undermines the central conceptual category).
      *   *Medium Damage/High Likelihood:* The Medicine/Empire Historian (moral implication of the thesis).
      *   *Medium Damage/Medium Likelihood:* The Climatologist (empirical grounding).
      *   *Low Damage/Low Likelihood:* The Macro-scale Historian (actually likely sympathetic to the *idea* of environment, just maybe the *degree*). *Correction:* Actually, the Macro-scale historian might be annoyed by the *restriction* on determinism. Let's make this the "concession" point.

      *Refining the Order:*
      1.  Social Historian (Power/Agency evasion) - Most dangerous politically within the dept.
      2.  Philosopher (Ontological status of "actor") - Most dangerous conceptually.
      3.  Medicine/Empire (Moral exoneration) - Strong ethical charge.
      4.  Climatologist (Proxy precision) - Technical nitpick, manageable.
      5.  Macro-scale Enviro (Too timid?) - Actually, this might be the easiest to handle or the one to concede to.

      *Let's re-evaluate based on the prompt's specific instruction: "ordered by how likely they are and how much damage they would do".*
      The Social Historian's critique is the standard "critique of environmental history." High likelihood, high damage.
      The Philosopher's critique goes to the definition of the thesis. High damage if lost.
      The Medicine Historian's critique is specific to the plague case. High likelihood given the topic.
      The Climatologist is specific to the evidence.
      The Macro-scale historian is likely to be an ally on the *importance* but might push on the *determinism* boundary.

      *Decision:*
      1.  Social Historian (Power/Class evasion).
      2.  Philosopher (Ontology of "Actor").
      3.  Medicine/Empire (Exoneration).
      4.  Climatologist (Proxy inference).
      5.  Macro-scale (Causal timidity).

  4.  **Drafting the Replies (90 seconds approx. 130-150 words spoken at normal pace):**
      *   Need to be punchy, respectful, and stick to the "thin sense" thesis.
      *   Need to identify the weakness honestly.

  5.  **Drafting the Strategic Advice:**
      *   *Concede:* Where can I give ground without losing the argument? Probably to the Macro-scale historian (admitting limits of prediction).
      *   *Misunderstanding:* Which objection misses the point? Likely the Social Historian confusing "actor" with "agent."
      *   *Sink Question:* Which one kills the paper? The Philosopher's "category mistake." If "actor" is incoherent, the thesis falls.
      *   *Hope Nobody Asks:* The specific empirical link between the volcano and a specific human choice in the 530s. (The "Smoking Gun" problem).

  6.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I restate the argument? *Avoid doing that in the intro.*
