answer: |-
  Chief, Councilmembers, members of the Review Board, families, and most importantly, the Class of 2024.

  Thank you for having me. I want to start by acknowledging the person who got me into this room. My sister is a patrol officer in this city. She's sitting in the front row, with her shift. I love her. I worry about her. And I am proud of her. But if you know me, or if you've read my reports from the Civilian Review Board, you know that my pride and my worry are tangled up together.

  The Chief asked me to speak today. He told me he didn't want a policy speech. He didn't want a cheerleader, either. He wanted twelve minutes of truth. That is a generous request from a Chief, and I intend to honor it. So, I'm not going to tell you that policing is broken, and I'm not going to tell you it's perfect. I'm going to tell you that it is heavy. And I'm going to ask you to carry that weight consciously.

  I teach philosophy at the community college. I spend a lot of time talking to students about ethics, about what we owe each other. For the last four years, I also sat on the Civilian Review Board. I went into that boardroom believing that if we just got the procedures right, if we just wrote the rules clearly enough, the system would work the way it was supposed to. I came off that board four months ago more conflicted than I went in.

  I tell you this not to dampen your celebration, but because you deserve to know the terrain you're walking into. You are about to be handed a badge and a gun. You are about to be granted a legal monopoly on the use of force. That is not a metaphor. It is a literal description of your job. In this city, on this shift, if violence needs to happen to stop violence, you are the ones authorized to do it.

  This brings me to the thing I've been circling in my head, the thing I want to leave with you.

  In every argument about policing, in every city council meeting and every dinner table debate, two ideas get mashed together. They are treated as if they are the same sentence. I don't think they are.

  The first idea is this: Sometimes, people hurt other people. Sometimes, a person is in immediate danger, and somebody has to be able to physically stop it. And that somebody cannot be a committee. It cannot be a vote. It has to be a person, on the scene, with the capacity to intervene. That claim is close to undeniable. If you ignore that, you abandon the victim. I will not abandon the victim. I expect you won't either.

  The second idea is this: Therefore, we need a permanent, armed, uniformed, unionized profession with its own internal culture and a standing legal monopoly on legitimate force.

  The first claim is about harm. The second claim is about *us*. About this institution. About the specific shape of the job you are graduating into today.

  Here is the hard truth: The second claim does not automatically follow from the first. Just because we need someone to stop violence doesn't necessarily mean the *only* way to do that is exactly the way we've built this profession over the last hundred years.

  Now, I am not standing here to abolish your jobs. I am standing here to tell you that this distinction is going to be the most important tool in your holster. Because the institution you are joining needs the second claim to be true in order to exist in its current shape. It needs you to believe that the only way to keep people safe is to do things exactly the way they have always been done. It needs you to believe that questioning the structure is the same as questioning the necessity of safety.

  I am asking you not to make that mistake.

  You can believe, with your whole heart, that you are needed to stop harm, to protect the vulnerable, to answer the call when the lights go on in the middle of the night. You can believe that, and still ask yourself: *Is this the only way? Is this the best way? Am I being asked to do something that a social worker, or a medic, or a neighbor could have done better?*

  Holding those two thoughts at once—that you are necessary, and that the system is contingent—that is the work. That is the ethics of the job. If you collapse them, if you decide that criticizing the institution is the same as endangering the public, you will stop learning. And if you stop learning, you become dangerous.

  I know what some of you are thinking. You're thinking, "I'm just trying to do my job. I'm from these neighborhoods. Half of us grew up on the blocks we're going to patrol."

  I know that. I see you. That is why I am hopeful.

  You are not an occupying force. You are not outsiders coming in to fix a community you don't understand. You are the community. You are the sons and daughters of the people who call 911. You know the difference between a house that is loud because of a party and a house that is loud because of a fight. You know when to knock hard and when to just knock.

  This is where I want to talk directly to you, the graduates. Not as a professor, not as a board member, but as a brother and a neighbor.

  You have spent six months in the academy. You have learned the law. You have learned defensive tactics. You have learned how to shoot. But the most important part of your job is not in the manual. It's in the space between the law and the street. It's in your discretion.

  The law gives you the power to arrest. It does not tell you when to arrest. That choice is yours. When you stand over a kid who made a stupid mistake, when you stand in front of a veteran who is having a bad night, when you stand in a kitchen where tensions are high—you are the policy. You are the legislation. In that moment, your judgment is the only law that matters.

  Do not let the culture of the profession tell you that using that discretion makes you weak. There is an old saying in the job, something you might hear in the locker room: "Better to be judged by twelve than carried by six." It means it's better to go to court than to die on the street. It's a survival mantra. I understand it. My sister lives with it.

  But I want to offer you a different version. It is better to be judged by your neighbors than to be feared by them.

  You will be tired. You will be scared. You will see things that stay with you. You will have shifts where you feel like the whole world is against you. In those moments, the institution will try to close ranks around you. It will tell you that loyalty to the badge means loyalty to the officer, no matter what. It will tell you that protecting the brotherhood is the same as protecting the public.

  I sat on the Review Board long enough to know that this is where things go wrong. When the institution protects itself more than it protects the truth, the public loses. And eventually, the honest officers lose, too.

  So, I am not asking you to be "good apples." I hate that phrase. It implies that the barrel is fine and we just need to sort out the rot. I am asking you to be accountable mechanics. If the barrel is leaking, you fix it. If a partner crosses the line, you stop them. Not because you are trying to be a hero for the press, but because you are trying to be a professional for your neighborhood.

  My sister knows I'm conflicted. She knows I've seen complaints on the Board that broke my heart. She knows I've seen officers who thought the badge made them untouchable. But she also knows I've seen officers who de-escalated a situation that could have ended in a funeral, who treated a grieving mother with a tenderness that no policy manual could ever mandate.

  I am not resolved on the big question. I don't know if, in twenty years, policing will look the way it does today. I don't know if the monopoly on force should look the way it does today. I am honest enough to tell you that I don't know.

  But I know this: I know that right now, tonight, when you graduate, people in this city will call 911 because they are afraid. They will call because someone is hurting them. They will call because they don't know what else to do.

  And you will answer.

  That is a sacred obligation. Regardless of what the institution becomes, that obligation remains. The need to stop harm is real. The trust required to do it without causing more harm is fragile.

  So, here is my charge to you. Wear the uniform, but don't let it wear you. Use the authority, but remember it is on loan. The monopoly on force doesn't belong to you. It belongs to the people. You are just borrowing it for the shift.

  When you pin that badge on your chest in a few minutes, feel the weight of it. It is heavy. It should be. It carries the weight of the first claim—that violence must be stopped—and the weight of the second claim—that we are the ones chosen to do it.

  Hold the tension between those two things. Do not let go of the necessity of safety. Do not let go of the possibility of change.

  Your families are waiting. They have worried through the academy just like I have. They are ready to pin that badge on you. Let them. Let them remind you who you were before you were an officer, so you remember who you are supposed to be when you take it off.

  Congratulations, Class of 2024. Go home safe. Go out honest. And take care of my city.

  Thank you.
