      *   *Orwellian:* The brain shows the Red flash, then revises the memory to say it moved. (Revision of history).
      *   *Dennett's Point:* Both imply a "true" sequence of experiences vs. a "reported" sequence.
      *   *Why no fact of the matter?* Because experience *just is* the disposition to report/act. If the probes (reports) yield the same result, and the neural causality is distributed, asking "what did it *really* feel like before the report?" assumes a non-functional qualia.
