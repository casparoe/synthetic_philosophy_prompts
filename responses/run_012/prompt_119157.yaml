          *   The teacher's claim that it proves people *don't* maximize anything is slightly off. They are maximizing *relative* loss minimization in the short term, failing to see the global optimum.
      *   *Sunk Cost:* The teacher calls it Sunk Cost Fallacy. Technically, the previous bid *is* a sunk cost. Rational agents *should* ignore it. But the rules of the game make the previous bid relevant to the *current* decision because the penalty for being second place is losing that specific amount. Wait, no. The penalty is paying the bid. If I bid 90c and lose, I lose 90c. If I bid \$1.00 and win, I pay \$1.00 get \$1.00 (net 0). If I bid \$1.00 and lose (someone bids \$1.05), I lose \$1.00.
      *   *Correction on Sunk Cost:* Actually, the previous bid isn't sunk in the traditional sense because you haven't paid it yet until the auction ends. But psychologically, it feels sunk. The game theory explanation is more about **escalation of commitment** and **non-credible threats**.
