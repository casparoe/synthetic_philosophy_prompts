answer: |-
  Good morning. Dean [Name], faculty, parents, family, and the graduating class of [Year].

  The Dean gave me one instruction for today: "Make it about how science actually works."

  Now, usually, this is the part where I stand up and tell you that science is about "questioning everything," or "following the evidence wherever it leads," or the classic favorite, "being willing to be wrong." And if I said those things, most of you would nod politely. The parents would take a picture. And the faculty in the front row—the people who have taught the demarcation problem for thirty years—would smile at their shoes, the way you do when a toddler explains gravity to you.

  They'd be right to smile. Because we all know the standard story doesn't hold up. There are falsifiable claims that are nonsense. There are unfalsifiable bits of physics that are indispensable. If we define science by the *statements* it makes, the boundary dissolves.

  So, I'm not going to talk about statements. I'm not going to talk about theories. I want to talk about *us*. Specifically, I want to talk about the room we are sitting in right now.

  We tend to think the line between science and non-science is drawn around a specific kind of truth. But I think we've been pointing at the wrong thing. The line isn't drawn around a claim. It's drawn around a community.

  Here is the idea I want you to take with you: Science isn't scientific because its theories are perfect. It's scientific because the people doing it have built a specific, institutional machinery for one very painful task.

  Science is the only enterprise I know that has a live, working procedure for losing an argument it doesn't want to lose.

  Think about that. It's not about being right. It's about the mechanism for admitting you're wrong when every instinct in your body is screaming that you're right.

  Consider astrology. The reason we don't count astrology as science isn't because the stars are magic. It's because when an astrological prediction fails, the system doesn't break. The astrologer doesn't say, "Well, I guess the theory is dead." They say, "Well, you must have the wrong birth time," or "The retrograde Mercury interfered." The theory is armored against loss. It is designed to survive error, not be killed by it.

  Now, look at something like string theory, or parts of cosmology. There are debates about whether these are testable. But here is the crucial difference: If tomorrow a particle collider produced data that fundamentally contradicted the math of string theory, the community would—eventually, painfully—abandon it. They have a procedure for surrender. They have peer review, replication, and a culture that, at its best, rewards the person who finds the crack in the foundation, even if that foundation was built by their mentor, their friend, or themselves.

  That is the spine of the matter. The property of "being scientific" belongs to the *institution*, not the *proposition*. It belongs to the group that has agreed, in advance, on what it would take to make them stop believing.

  To the faculty here: I know this shifts the burden from epistemology to social ethics. It's not enough to have a method; you have to have the integrity to use it when it hurts. When the grant money is on the line. When the reputation is on the line. When the hypothesis is your baby.

  But to the graduates, and to the parents who raised them: This is why you are here. And this is why this matters outside the lab.

  We are living in a time when "losing an argument" is treated as a catastrophe. In politics, in social media, in our personal lives, we armor-plate our beliefs the way astrologers armor-plate their horoscopes. We surround ourselves with echo chambers that explain away any evidence that we might be mistaken. We treat being wrong as a moral failure rather than an informational update.

  Your education in this department—whether you were in the lab measuring decay rates or in the seminar room reading Kuhn—has trained you to do something harder than being right. It has trained you to build a life where it is safe to be wrong.

  That is what I want for you. I don't just want you to go out and find the truth. I want you to go out and build communities— in your labs, in your offices, in your families—that have a procedure for loss.

  If you go into medicine, I want you to work in hospitals where a junior resident can tell a senior surgeon they're mistaken without fear of retribution.
  If you go into policy, I want you to write laws that include sunset clauses, mechanisms to admit the solution didn't work.
  If you go into tech, I want you to build algorithms that can be audited by people who want them to fail.

  Because if you don't have a procedure for losing, you aren't doing science. You're doing ideology. And ideology doesn't cure diseases. It doesn't fix climates. It doesn't build bridges that stay up.

  To the parents in the audience: I know you're here to celebrate your children's achievements. You're proud of what they know. But I hope you're also proud of what they've learned to do with what they *don't* know. You sent us curious kids; we're sending you back adults who understand that certainty is the enemy of progress. The most valuable thing your child learned here wasn't a fact. It was the courage to let a fact kill a favorite idea.

  So, here is my charge to you, Class of [Year].

  Don't just ask if a claim is falsifiable. Ask if the people making it have a way to let it go.
  Don't just ask if you are right. Ask yourself: "If I were wrong, how would I find out? And do I have friends who would tell me?"

  Science works. Not because scientists are smarter than everyone else. But because, historically, we have built a system that forces us to stop lying to ourselves.

  Go out and build systems like that. Build lives like that. Be the kind of person who can lose an argument they don't want to lose, and shake the hand of the person who proved them wrong. Because that isn't just how science works. That's how the world gets better.

  Congratulations.
