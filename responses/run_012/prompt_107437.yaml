      *   **Goal:** Nail down the position, identify what could knock it over (falsifiers/counterevidence), sort by decisiveness (fatal to awkward), distinguish between concessions vs. wave-offs, check for unfalsifiability, and identify unique predictions.
      *   **Specific Preferences:** Wants American English. Wants honesty about whether the view is unfalsifiable. Specifically interested in arguments where SA *doesn't* change EV arithmetic or *amplifies* fanaticism.
      *   **Tone:** Intellectual, rigorous, direct, "honest map of exposure."

