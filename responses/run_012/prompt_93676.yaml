      *   **Banach-Tarski:** This is about the existence of non-measurable sets given AC. It shows you can't define a measure on *all* subsets of $\mathbb{R}^3$ that is rotation/translation invariant. It forces us to restrict the $\sigma$-algebra (to Borel/Lebesgue sets).
      *   **Connection:** Both highlight the need for rigorous measure theory, but Bertrand is about *which* measure to choose, while Banach-Tarski is about *which sets* can be measured.
      *   **Continuous Probabilities:** Radioactive decay and unit squares work because the physical context implies a specific measure (Lebesgue measure for space, exponential distribution for time based on physical laws). They aren't arbitrary if the physical model is well-specified.

