answer: |-
  You have put your finger on exactly the right sore spot. Your intuition from the lab is serving you well: **yes, the interval is an unfinished object.**

  In the philosophy of probability and decision theory, the field you have stumbled into is called **Imprecise Probability**. The specific mathematical structure you are looking for to "finish" the object is called a **Credal Set**.

  Here is the diagnosis of why your arithmetic broke, the name of the phenomenon, and what you need to add to make the calculations hold together.

  ### 1. The Diagnosis: Projections vs. Objects
  In your lab work, when you wrote $x = 5.0 \pm 0.5$, you were implicitly assuming a **distribution** (usually Gaussian) centered at 5.0. That distribution carries information about how likely values are within that range. It allows you to propagate error because the "shape" of the uncertainty is defined.

  In epistemology, when you write $P(A) \in [0.2, 0.8]$, you are usually stating **Ignorance**, not **Variance**. You are saying, "Any probability value in this range is consistent with my evidence." You are not saying, "0.5 is the most likely probability and 0.2 is three sigmas away."

  The failure you encountered with $A$ and $\text{not-}A$ is a violation of **Coherence**.
  *   You treated the upper bound of $A$ (0.8) and the upper bound of $\text{not-}A$ (0.8) as simultaneously selectable values.
  *   But probability is a linear constraint: $P(\text{not-}A) = 1 - P(A)$.
  *   If you select the "world" where $P(A) = 0.8$, you are *forced* into the world where $P(\text{not-}A) = 0.2$.
  *   By multiplying the upper bounds ($0.8 \times 0.8$), you combined two incompatible "worlds."

  The interval $[0.2, 0.8]$ is merely a **projection** of a higher-dimensional object onto a single axis. When you do arithmetic on projections without knowing the geometry of the object, you lose the constraints that bind the axes together.

  ### 2. The Name: Fréchet Bounds and Credal Sets
  The problem you faced with $A$ and $B$ (where the conjunction range swings wildly) is governed by the **Fréchet Inequalities** (or Boole-Fréchet bounds).

  Given only marginal probabilities $P(A)$ and $P(B)$, the probability of their conjunction is bounded by:
  $$ \max(0, P(A) + P(B) - 1) \le P(A \land B) \le \min(P(A), P(B)) $$

  If $P(A) \in [0.2, 0.8]$ and $P(B) \in [0.2, 0.8]$, and you know nothing about their dependence, the range for $P(A \land B)$ is indeed $[0, 0.8]$. This isn't a calculation error; it is a correct reflection that **marginal intervals do not determine joint behavior.**

  In the lab, you often assume independence or measure correlation. In epistemology, assuming independence between logical claims is often indefensible.

  The formal "finished object" you are looking for is a **Credal Set**.
  *   **Standard Bayesian:** Belief is represented by a *single* probability function $P$.
  *   **Imprecise Probability:** Belief is represented by a *set* of probability functions $\mathcal{M}$.
  *   Your interval $[0.2, 0.8]$ is just the range of values that functions in $\mathcal{M}$ assign to $A$.

  ### 3. How to "Finish" the Object
  To do arithmetic that doesn't fall apart, you need to specify *which set* of probability functions you are working with. There are two main ways scientists and philosophers do this:

  #### A. Second-Order Probability (The "Lab" Approach)
  You treat the probability itself as a random variable. Instead of $P(A) \in [0.2, 0.8]$, you define a density function $f(p)$ over that interval.
  *   **What it adds:** It restores the "shape" to your error bar. Is it flat (uniform ignorance)? Is it peaked at 0.5 (confidence in the middle)?
  *   **The result:** You can now integrate over this density to get a single expected value for $P(A \land B)$, provided you also define a dependency structure (a copula) between $A$ and $B$.
  *   **The cost:** It requires data or assumptions you likely don't have. It turns "I don't know" into a specific distribution, which might be false precision.

  #### B. Credal Sets with Constraints (The "Robustness" Approach)
  This is likely what the philosophers you are reading are doing. You accept that the result of your arithmetic will *also* be a range, often a wider one.
  *   **What it adds:** You explicitly track the dependency constraints. You don't just say $P(A) \in [0.2, 0.8]$. You define a set of joint distributions consistent with your evidence.
  *   **The result:** When you calculate $P(A \land \text{not-}A)$, the math forces the set to return 0, because no coherent probability function in your set allows otherwise. When you calculate $P(A \land B)$, you get the Fréchet bounds, and you accept that wide range as the honest answer.
  *   **The cost:** You lose the ability to make sharp decisions. If the lower bound of expected utility for Action X is less than the upper bound for Action Y, the theory says you cannot decide. You must seek more information.

  ### 4. Who to Read
  Since you are already in the library, look for these names. They treat probability with the rigor of a measurement instrument:

  1.  **Peter Walley:** His book *Statistical Reasoning with Imprecise Probabilities* is the bible of this field. He formalizes **Coherent Lower Previsions**. He argues exactly what you suspect: a single number is often a lie; a range is honest, but you must follow specific rules (coherence) to manipulate ranges so they don't imply contradictions like $P(A \land \text{not-}A) > 0$.
  2.  **Henry Kyburg:** He developed **Evidential Probability**. He was very focused on how frequency data translates to logical intervals, and he struggled with the exact conjunction problems you identified.
  3.  **Isaac Levi:** A philosopher who argued for **Tidal Belief**. He suggests that when intervals are too wide to make a decision, the rational move is to suspend judgment rather than pick a number.

  ### Summary
  Your "honest-looking range" is a **marginal bound on a credal set**.
  *   **The Disease:** Treating bounds as independent values rather than constraints on a single coherent measure.
  *   **The Cure:** Acknowledge that the object is a **Set of Distributions**, not a Distribution of Values.
  *   **The Consequence:** Arithmetic on these sets yields wider sets (dilation). If $P(A)$ is imprecise, $P(A \land B)$ is often *more* imprecise, not less.

  You haven't lost your touch with error bars; you've just realized that in epistemology, the "systematic error" (model uncertainty/dependence) often dominates the "random error," and standard interval arithmetic doesn't account for systematics unless you build the model structure explicitly.
