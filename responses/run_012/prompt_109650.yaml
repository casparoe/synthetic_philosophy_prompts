  2.  **Deconstruct the Philosophical Challenge:**
      *   **The Colleague's Error:** The colleague interprets "emptiness" (sunyata) as nihilism or dismissiveness. If everything is empty, nothing matters. This is the classic misunderstanding Nagarjuna fought against (the "emptiness eating everything" objection).
      *   **The Teacher's View:** Emptiness *allows* for convention. Dependent origination means things arise in dependence on conditions. Grief is a dependent arising. It is empty of inherent existence, but it is *real* as a convention. To deny grief is to deny the conventional truth, which is half of the Two Truths doctrine.
      *   **The Tetralemma Constraint:** The teacher insisted we shouldn't say he exists, doesn't exist, both, or neither. The eulogy must avoid ontological claims about his current state. It must focus on the *impact*, the *relationships*, the *conditions* that arose and passed.
      *   **The Goal:** Show that conventional truth (grief, love, memory) is not "just" a fiction. It is the very place where emptiness is visible. To honor him is to honor the convention of grief itself.

  3.  **Drafting - Section by Section:**

