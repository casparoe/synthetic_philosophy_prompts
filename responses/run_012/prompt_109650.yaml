answer: |-
  Friends, family, students, colleagues. Thank you for being here.

  When we began planning this gathering, I was reminded of a specific instruction he left behind. He wrote that any words spoken about him now should not land in any of the four corners of the tetralemma. We cannot say he is still here. We cannot say he is simply gone. Not both, not neither. He spent a lifetime showing us that when we try to pin reality down with those categories, we aren't describing the world; we are describing the limits of our questions. So, I will not try to tell you where he is. I will only speak to where we are, and how the shape of this room has been altered by his absence.

  For thirty years, he sat in this zendo. For forty, he stood in front of classrooms. He taught that emptiness is not a void where things disappear, but the open space that allows things to touch. If things were solid, permanent, and independent, they could never meet. They could never change. They could never love, and they could never break. He taught that because things are empty of inherent existence, they are full of each other.

  I know there is a temptation, especially for those of us who studied his work, to use that teaching as a shield. There is a temptation to say that because all phenomena are empty, this loss is merely a convention, a story we tell ourselves to make sense of impermanence. I spoke recently with a colleague who suggested that since everything is empty, my grief is 'just a convention,' and that I should keep this speech dry to honor the truth of it.

  But I believe that misunderstands the lesson. Nagarjuna wrote that without relying on conventional truth, the ultimate cannot be expressed. Without honoring the convention, the emptiness becomes a nihilism that eats the world alive. If grief is a convention, then it is the very fabric of our shared reality. To dismiss it is to dismiss the only place where compassion can actually live.

  He was insistent that we not flee from the world of names and forms. He wanted us to see the ultimate *in* the conventional, not apart from it. So I will not offer you a dry speech. I will offer you the truth of this condition. The pain we feel is not proof that we are confused; it is proof that we were connected. It is dependent origination in its most raw form. Because he was a condition for our joy, his absence is now a condition for our sorrow. To deny the sorrow would be to deny the connection.

  I remember sitting in his office during my third year, struggling to understand the relationship between the two truths. I was frustrated, ready to quit the major. He listened for a long time, then he laughed and [insert concrete memory: e.g., pushed a bowl of tangerines across the desk and told me to peel one before asking another metaphysical question]. He didn't give me an answer. He gave me a task. He brought me back to the thing in front of me. He taught us that the sacred isn't hidden behind the veil of appearance; it is the appearance itself, seen clearly.

  So, how do we honor a man who refused to be pinned down? We do not try to preserve him as a static memory. We do not try to discard him as a vanished ghost. We acknowledge that the causes he set in motion are still rippling. The way his sister cared for him, the way his colleagues debated him, the way his students learned to listen—these are not shadows of a real life. They are the life itself, continuing in dependence on what came before.

  To his family: He loved you. That is a conventional truth, and it is absolute.
  To his students: He taught you. That is a conventional truth, and it is binding.
  To his sangha: He sat with you. That is a conventional truth, and it is sacred.

  We are here because conventions matter. We are here because words matter. If emptiness meant nothing mattered, we wouldn't be in this room. We are here because the web of relations he wove is still holding weight. We are here because grief is the price of intimacy, and he taught us never to shy away from the cost of being human.

  So let us not try to solve him. Let us not try to resolve the tension of his absence with neat philosophy. Let us sit in the discomfort. Let us acknowledge that this hurts, and that the hurt is real, and that within this real, conventional hurt, there is no separation between us. He is not here, and he is not gone. He is the reason we are all breathing together in this space, right now.

  Summary: The eulogy validates grief as an essential conventional truth dependent on connection, demonstrating that emptiness enables relationship rather than negating the reality of loss.
