      *   Moore's Paradox isn't just a conversational rule; it reveals the structure of self-knowledge. To believe $p$ *just is* to be disposed to assert $p$ (under ideal conditions). The paradox arises because belief aims at truth, and self-ascription of belief aims at the same truth (via transparency).
