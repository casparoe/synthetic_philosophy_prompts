  During our club's election reform meeting, the president demanded a voting rule where honesty is always optimal. "No dictators," she said. "And at least three candidates."

  I checked the theorem. "Gibbard–Satterthwaite says that's impossible. Someone will always benefit from lying."

  "Unless we allow multiple winners?"

  "Then every voter's favorite must win. We'd have twenty treasurers."

  "Fine, let's pick one winner honestly."

  "Then you must be the dictator. Your favorite must always win."

  "Okay," she said. "I'll be dictator."

  "Wait, the student council bylaws forbid—"

  "Then I'll lie," she said, submitting her ballot. "The theorem says I should."

  "But that's dishonest."

  "No," she smiled. "For a rational voter, it's mathematically mandated."

  ***

  The punchline relies on the Gibbard–Satterthwaite theorem, which proves that any deterministic voting rule with at least three candidates is manipulable unless it is a dictatorship. The dialogue exhausts the theorem's escape routes, noting that allowing multiple winners triggers the Duggan–Schwartz result where everyone's favorite must win. The humor lands when the president reframes strategic voting not as corruption, but as compliance with mathematical necessity for a rational actor. It highlights that under the theorem's conditions, insincerity is the only equilibrium strategy available to non-dictators.
