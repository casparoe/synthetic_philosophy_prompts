              1.  Definitional (Natural Kind, Necessary & Sufficient Conditions).
              2.  Homeostatic Property Cluster (HPC).
              3.  Organizational/Autopoietic.
              *   (Optional 4th if it does real work).
          *   Rigorous Mapping: Apply each account to Giant Virus, Ordinary Virus, Viroid, Plasmid, Prion, Ordinary Bacterium. Distinguish between "fails definition" and "outside scope."
          *   Specific Focus: Are giant viruses a genuine anomaly for the definitional account or just a hard case?
          *   Reverse Direction: What does the episode show about the *accounts*? (Confirm, embarrass, reframe?)
          *   Conclusion: Is "life" a term for different purposes? What is lost if we give up a single account? Practical/theoretical consequences?
