prompt: |-
  I'm a novelist — 3rd book — and I've gone and set it in a made-up country whose judiciary has quietly gone full Pascal, meaning the Pascal of the political fragments rather than the wager guy. Roughly his line: justice is always up for dispute, force never is; you can't make justice strong, so the trick is to make strength look just; and what people actually obey is custom, which has no authority except that its been accepted — pull it up by the root and it comes apart in your hands. There's also the bit about property starting with some kid pointing at a dog and saying it's his, and the half-clever being the dangerous ones because they notice the law isn't just and want to fix it, while ordinary people are right to simply obey.

  What I need from you: a deadpan in-world document — a bench book or induction pack for newly appointed magistrates in that country, 500-600 words — that takes all of the above as settled policy and just applies it. How to word a ruling when someone pleads that the law is unjust, the robe and ceremony stuff, what to tell the clever clerk who keeps asking where the rule actually came from, the official line on why nobody traces anything back to its origin. It should be funny to someone who's read the fragments and legible to someone who hasn't, and don't have them quoting Pascal directly — they'd paraphrase it into admin-speak anyway. Straight face the whole way through, no winks, and no sources needed obviously.
