      MINISTRY OF LEGAL CONTINUITY
      MEMORANDUM 44-B: JUDICIAL CONDUCT AND STABILITY PROTOCOLS
      TO: Newly Appointed Magistrates
      FROM: Office of Jurisprudential Maintenance

      Welcome to the Bench. Your primary function is not the discovery of truth, but the preservation of order. The following protocols ensure the Court maintains the necessary perception of authority.

      1. **The Appearance of Justice.**
      Litigants often confuse justice with force. They assume a ruling is valid because it is moral. You must correct this misconception without stating it explicitly. When a defendant argues that a statute is unjust, do not engage with the morality of the statute. Instead, draw attention to the ceremony of the Court. Adjust your robes. Bang the gavel. Remind them that the law is strong, and therefore, it is just. We cannot make justice strong, so we make strength look just. If the plaintiff asks why the law favors the wealthy, explain that the law favors the established. Stability is the highest morality.

      2. **Inquiries into Origin.**
      You will encounter clerks or litigants who ask where a specific rule originated. They will want to trace the legislation back to its root. This is prohibited. Laws are like trees; if you pull them up by the root to inspect the soil, they die. The authority of custom lies solely in the fact that it has been accepted for a long time. If a rule looks arbitrary, that is because all rules are arbitrary at their inception. Perhaps a previous magistrate simply pointed at a property dispute and declared a winner based on who spoke first. It does not matter. To question the origin is to weaken the structure. The official line is: "This procedure exists because it has always existed."

      3. **Personnel Management.**
      Be wary of clerks who exhibit excessive intelligence. The "half-clever" subordinate is a danger to the Court. They notice discrepancies between the law and equity and will attempt to fix them. This causes friction. Ordinary staff who obey without understanding are preferable. If a clerk asks why a form is required, do not explain the utility. Tell them it is protocol. If they persist, transfer them to Archives. We need officers who file, not philosophers who ponder.

      4. **Property Disputes.**
      In cases of contested ownership, avoid investigating historical chains of title. All property began with someone simply claiming it. If a citizen points at an object and says "this is mine," and no one else immediately disputes it with greater force, the claim is ratified. Do not ask how they acquired it. Initial possession is merely a habit that has hardened into right. To investigate further is to admit that ownership is fragile.

      5. **Conclusion.**
      Your robe is not a garment; it is a uniform of force disguised as tradition. Wear it properly. Do not let the public see the machinery. They must see only the majesty.

      Signed,
      The High Directorate

