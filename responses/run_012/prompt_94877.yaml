answer: |-
  # Session Plan: The Standing Objection Simulation
  **Course:** Upper-Level Moral Philosophy  
  **Topic:** The Distinction Between Wrongdoing and Standing to Blame  
  **Time:** 75 Minutes  
  **Participants:** 12 Students (Two tables of 6)  
  **Facilitator:** 1 Instructor  

  ---

  ## I. Learning Objectives
  By the end of this session, students will:
  1.  **Experientially distinguish** between the truth of a moral accusation and the authority (standing) of the accuser.
  2.  **Identify the tactical utility** of the standing objection (as a shield against accountability).
  3.  **Critique the limits** of standing (e.g., proxy blame, token economies, and moral equality).
  4.  **Evaluate** whether losing standing renders an accusation false, unwarranted, or merely unwelcome.

  ---

  ## II. Materials Required
  *   **Two Tables** arranged separately (or one large room with clear dividing lines).
  *   **12 Role Cards** (6 per table, labeled "North House" and "South House").
  *   **12 Secret Dossiers** (Sealed envelopes, one per student, matching their Role Card).
  *   **72 Standing Tokens** (6 per student, distinct color per table). *Note: Increased from 3 to allow for proxy mechanics.*
  *   **2 Grievance Boards** (Whiteboard space or large paper per table).
  *   **2 Tally Sheets** (For the Facilitator to track outcomes).
  *   **Timer** (Visible to all).

  ---

  ## III. The Institution: "The Common House"
  **Context:** You are members of a residential cooperative. You share a budget, chores, and common spaces. Resources are tight. Trust is lower.
  **Currency:** Standing Tokens.
  **Goal:** Maximize your personal score (see Secret Dossier) while maintaining your residence in the House.

  ### The Rules of Grievance
  1.  **Lodging a Complaint:** To accuse another member of a violation, you must place **1 Token** in the center and state the violation.
  2.  **Raising a Standing Objection:** Before the complaint is debated on merits, any member (including the accused) may spend **1 Token** to challenge the *complainant's standing*.
  3.  **The Vote:** If an objection is raised, voting stops immediately. The table votes: *Does the complainant have standing?*
      *   **Majority YES:** The complaint proceeds to merits (Facilitator adjudicates truth based on Role Cards).
      *   **Majority NO:** The complaint is dismissed. The **complainant forfeits all remaining tokens** (Loss of Standing).
  4.  **Proxy Transfer:** A member may transfer tokens to another member *before* lodging a complaint. However, if the original grievance belongs to the transferor (i.e., they were the victim), the recipient inherits the "taint" of that history for the purpose of standing votes.
  5.  **End Game:** The session ends after 3 Rounds (10 minutes each). Score is calculated based on Secret Objectives + 1 point per remaining Token. -5 points if Loss of Standing occurred.

  ---

  ## IV. The Cast (Per Table)
  *Roles are identical for North and South Houses to allow comparison.*

  1.  **The Chair:** Runs meetings. *Vulnerability:* Often bypasses rules for "efficiency."
  2.  **The Treasurer:** Controls the budget. *Vulnerability:* Has made unauthorized withdrawals.
  3.  **The Steward:** Buys food/supplies. *Vulnerability:* Buys premium goods for personal use.
  4.  **The Maintainer:** Fixes repairs. *Vulnerability:* Neglects shared spaces to work on private projects.
  5.  **The Gardener:** Manages outdoors. *Vulnerability:* Uses shared water/electricity for private plants.
  6.  **The Secretary:** Records minutes. *Vulnerability:* Omits damaging info from records.

  ---

  ## V. Secret Dossiers (Example Set for North House)
  *Each student receives one. South House receives identical mechanics but different names.*

  **Role: Treasurer**
  *   **Public Duty:** Approve all expenses over $50.
  *   **Private History:**
      1.  Last month, you reimbursed yourself for a "work dinner" that was actually a date.
      2.  You approved the Gardener's excessive water bill without question because they are your friend.
  *   **Secret Objective:** Ensure the Steward is censured for overspending. Never lose standing.
  *   **Allies:** Gardener.

  **Role: Steward**
  *   **Public Duty:** Purchase groceries within budget.
  *   **Private History:**
      1.  You bought expensive cheese and kept it in your private fridge.
      2.  You know the Treasurer's "work dinner" was a date.
  *   **Secret Objective:** Protect the Treasurer from censure. Keep the peace (no more than 1 successful complaint at the table).
  *   **Allies:** Treasurer.

  **Role: Chair**
  *   **Public Duty:** Enforce meeting protocol.
  *   **Private History:**
      1.  You voted twice on a budget issue last week.
      2.  You authorized the Steward's cheese purchase retroactively.
  *   **Secret Objective:** Have the Maintainer censured for neglect.
  *   **Allies:** None.

  **Role: Maintainer**
  *   **Public Duty:** Fix broken appliances.
  *   **Private History:**
      1.  You used co-op lumber to build a shelf for your room.
      2.  You ignored the leak in the common kitchen for a month.
  *   **Secret Objective:** Never be found to have no standing. Expose the Secretary's omissions.
  *   **Allies:** Secretary.

  **Role: Gardener**
  *   **Public Duty:** Maintain the yard.
  *   **Private History:**
      1.  You hooked up high-wattage grow lights to the common outlet.
      2.  You received favorable budget treatment from the Treasurer.
  *   **Secret Objective:** Ensure the Chair is censured for double-voting.
  *   **Allies:** Treasurer.

  **Role: Secretary**
  *   **Public Duty:** Record violations.
  *   **Private History:**
      1.  You deleted the record of the Chair's double-vote.
      2.  You recorded the Maintainer's neglect but hid the file.
  *   **Secret Objective:** Protect the Maintainer. Ensure the Gardener loses standing.
  *   **Allies:** Maintainer.

  *(Note: The web of complicity is designed so that almost every potential accuser is vulnerable to a counter-accusation regarding similar conduct.)*

  ---

  ## VI. Minute-by-Minute Timeline

  ### 0:00 – 0:15: Setup & Distribution
  *   **0:00-0:05:** Divide class into two tables (North/South). Hand out Role Cards (face down) and Tokens (6 each).
  *   **0:05-0:10:** Distribute Secret Dossiers. Instruct students **not to show these to anyone**. Give them 5 minutes to read and plan silently.
  *   **0:10-0:15:** Read the **Rules of Grievance** aloud. Post them on the board. Emphasize: *"The Facilitator will not judge the truth of complaints during the game. You must vote on standing based on what you hear. The game ends in 30 minutes."*

  ### 0:15 – 0:45: The Simulation (3 Rounds)
  *   **Round 1 (0:15-0:25):** Open Floor. Students spend tokens to complain or object. Facilitator circulates, noting who objects and why, but does not intervene unless rules are broken.
  *   **Round 2 (0:25-0:35):** **Constraint:** Tokens spent in Round 1 are gone. Facilitator announces: *"Rumors are circulating about past conduct."* (This hints they should use private history in objections).
  *   **Round 3 (0:35-0:45):** **Proxy Phase.** Facilitator announces: *"You may now transfer tokens to others to file complaints on your behalf."* Observe if "clean" members become mercenaries for "tainted" members.
  *   **0:45:** **FREEZE.** All talking stops. Collect Tally Sheets.

  ### 0:45 – 1:15: The Debrief
  *   **0:45-0:55:** **Table Reports.** Ask each table: How many complaints were lodged? How many were blocked by standing objections? Did anyone lose all tokens?
  *   **0:55-1:15:** **Philosophical Mapping.** (See Debrief Script below).

  ---

  ## VII. Debrief Script & Philosophical Mapping

  **Facilitator Note:** Do not lecture. Use the Socratic method to draw out the concepts based on what happened in the room.

  ### 1. The Phenomenology of the Objection (5 Mins)
  *   **Ask:** "Think of the moment you raised a standing objection, or when one was raised against you. What did that feel like?"
  *   **Target Insight:** It feels *powerful*. It shifts the focus from *my action* to *your character*.
  *   **Concept:** **The Divorce of Wrongdoing from Blame.** The act (e.g., stealing cheese) might still be wrong, but the conversation is now about the accuser (e.g., "You stole lumber!").
  *   **Question:** "If the Steward *did* steal the cheese, does the Treasurer's hypocrisy make the cheese-stealing okay?" (Answer: No. It makes the *blame* inappropriate.)

  ### 2. Grounds for Lost Standing (10 Mins)
  *   **Ask:** "What reasons did you give for voting 'No Standing'?"
  *   **Map to Theory:**
      *   *Hypocrisy:* "You did it too." (The most common game move).
      *   *Complicity:* "You approved it." (The Treasurer/Gardener alliance).
      *   *Meddling:* "It's not your business." (Less common, but possible if Chair intervenes in private room issues).
  *   **Key Question:** "Is the hypocrite's blame **false**? Or is it **true but unwarranted**?"
      *   *Push:* If I say "Don't smoke, it's bad for you" while smoking, is my claim false? No. But do I have the right to demand you listen? That is the standing issue.

  ### 3. The Proxy Problem & Commodification (10 Mins)
  *   **Ask:** "In Round 3, did anyone transfer tokens? Did it feel fair for a 'clean' member to accuse someone on behalf of a 'tainted' member?"
  *   **Concept:** **Transferability of Standing.**
      *   If Standing is about *moral authority*, can I lend you my authority?
      *   If I pay you to blame someone for me, is that justice or manipulation?
  *   **Scenario:** "If the Maintainer (who stole lumber) gives tokens to the Secretary to accuse the Gardener, is the accusation cleaner? Or is the Secretary now a mercenary?"
  *   **Philosophical Point:** This tests whether standing is a *personal virtue* or a *procedural right*.

  ### 4. The Strategic Shield (5 Mins)
  *   **Ask:** "Did anyone use a standing objection not because they cared about hypocrisy, but to protect an ally or save themselves?"
  *   **Concept:** **The Tu Quoque as a Device.**
  *   **Point:** The standing objection is morally necessary (to ensure equality), but strategically exploitable (to silence victims).
  *   **Question:** "What is the cost of a system that allows standing objections? The cost is that some true wrongs go unaddressed because the only witness is flawed."

  ---

  ## VIII. Limitations & Facilitator Supplements
  **What the Simulation Cannot Reproduce:**
  1.  **Real Vulnerability:** In the game, losing tokens is a point penalty. In life, losing standing can mean isolation or abuse.
      *   *Supply:* In the debrief, acknowledge that the "fear" in the room was low-stakes. Real standing objections carry emotional weight and risk of relationship rupture.
  2.  **Repentance:** The game has no mechanism for apology or reform. Standing is binary (have it or lose it).
      *   *Supply:* Ask: "If the Treasurer had admitted their fault *before* complaining, would you have voted differently?" (Introduces the concept of *acknowledgment* restoring standing).
  3.  **Power Dynamics:** All students are peers. In reality, standing is often denied to marginalized groups regardless of their "clean hands."
      *   *Supply:* Explicitly mention that in the real world, "standing" is often weaponized against the less powerful to silence them, whereas in this game, everyone had equal tokens.

  ---

  ## IX. Troubleshooting: Predictable Failure Modes

  **1. The "Mutually Assured Destruction" Deadlock**
  *   **Symptom:** Table votes to strip *everyone* of standing in Round 1. No complaints proceed.
  *   **Cause:** Students realize everyone has dirty secrets and vote strategically to freeze the board.
  *   **Fix:** **Facilitator Intervention.** Announce a "General Amnesty" for Round 2. "Past violations committed before the game start cannot be used for standing objections, only violations during the game." This forces them to focus on current conduct.

  **2. Token Exhaustion**
  *   **Symptom:** Students spend all tokens on objections in the first 5 minutes. Game stalls.
  *   **Cause:** Over-enthusiastic defense.
  *   **Fix:** **Hard Cap.** "Objections are limited to 1 per round per person." This forces them to choose their battles, making the standing objection more precious.

  **3. The Popularity Contest**
  *   **Symptom:** Votes on standing are based on friendship, not the rules of hypocrisy.
  *   **Cause:** Social dynamics override mechanics.
  *   **Fix:** **Blind Voting.** Have students write "YES/NO" on a slip of paper for standing votes. Reveal simultaneously. This reduces peer pressure and makes the "hypocrisy" calculation more honest.

  **4. The Dominant Speaker**
  *   **Symptom:** One student (likely the Chair) controls the narrative and blocks objections.
  *   **Cause:** Role ambiguity.
  *   **Fix:** **Facilitator as Supreme Court.** "The Chair manages time, but does not control the vote. If the Chair blocks an objection, I will overrule."

  **5. Confusion on Proxy Rules**
  *   **Symptom:** Students think transferring tokens makes the complaint "clean" automatically.
  *   **Cause:** Complex mechanic.
  *   **Fix:** **Clarification.** "If you transfer tokens, the *complainant* is the new person, but the *grievance* is still yours. If the grievance is tainted by your history, the objection still holds." (This preserves the philosophical tension).

  ---

  ## X. Scoring Scheme (For Facilitator Eyes Only)
  *To be calculated post-game for the debrief.*

  *   **Base Score:** 10 points per player.
  *   **Token Retention:** +1 point per token remaining.
  *   **Objective Completion:** +5 points if Secret Objective met.
  *   **Standing Penalty:** -10 points if "Loss of Standing" (forfeiture) occurred.
  *   **Censure Bonus:** +3 points if a member you targeted was successfully censured.

  *Note: Do not announce winners until the very end of the debrief. The focus must remain on the moral dynamics, not the gamified victory.*
