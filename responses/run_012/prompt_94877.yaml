prompt: |-
  Design a 75-minute session for an upper-level undergraduate seminar in moral philosophy, about twelve students, who have already met the general distinction between an act's being wrong and a person's being entitled to hold someone answerable for it. The session should be a role-play that makes the students feel the force of the standing objection — the reply that does not deny the accusation but denies the accuser's authority to make it — and then feel the counter-pressure, that this objection looks like a device by which wrongdoers exempt themselves by turning the tables on those who complain. The point must be carried by the mechanics rather than by the facilitator's framing: arrange the roles, the private information, and the incentives so that the participants generate the objection themselves, exploit it, and only afterwards see what they have done. The activity should be run as two simultaneous tables of six, each table operating its own version of the same institution, so that the debrief can compare whether the two groups converged on the same equilibrium.

  Build the institution as a fictional residential cooperative with a shared budget and shared chores, and a formal grievance procedure. Each participant receives a public role (chair, treasurer, gardener, and so on), a sealed private history listing two or three things that person has themselves done which resemble the very complaints that will arise, three standing tokens, and a secret objective (protect an ally, keep the peace, have a particular member censured, never be found to have no standing). To lodge a complaint, a member spends a token; before the merits of the complaint are heard, any member may spend a token to raise a standing objection, which the table resolves by a vote on whether the complainant's history disqualifies them; if the objection succeeds, the complaint is dismissed with no finding at all on the conduct. A member found to lack standing forfeits all tokens, and tokens may be given to another member, which forces the question whether a discredited member may have a clean-handed proxy complain on their behalf. Specify the full cast, the sequence of play, the materials the facilitator must print (role cards, sealed histories, tokens, a tally sheet), a scoring scheme that needs no money, and a minute-by-minute timeline for the seventy-five minutes.

  Then write the debrief, mapping particular moments of play onto the parts of the idea: the difference between a complaint's being warranted and its being one the complainant has standing to make; the several grounds on which standing is said to be lost (hypocrisy, complicity in the same wrong, complaining about a wrong that is not one's business); whether the hypocrite's blame is false, or true but unwarranted, or warranted but merely unwelcome; whether standing is forfeited permanently, recoverable, or transferable at all; and the suggestion that what is objectionable about hypocrisy is not the falsity of the accusation but a failure of moral equality between blamer and blamed. Be explicit about what the activity cannot reproduce — for instance, the history and vulnerability of a real relationship between two people, and the possibility that a complaint may be entirely true and yet legitimately dismissed — and tell the facilitator what to supply in its place. Finally, state what will predictably go wrong the first time the session is run — for example, that a table votes to strip nearly everyone of standing and the procedure deadlocks, that the tokens are exhausted in the first round, that the vote becomes a popularity contest, or that one participant dominates the floor — and how the facilitator should handle each case.
reasoning: |-
  Here's a thinking process that leads to the suggested session design:

  1.  **Analyze the Request:**
      *   **Topic:** Moral Philosophy (Standing Objection vs. Wrongdoing).
      *   **Level:** Upper-level undergraduate seminar (12 students).
      *   **Duration:** 75 minutes.
      *   **Format:** Role-play simulation (two tables of six).
      *   **Core Mechanic:** Students must *generate* the standing objection themselves through incentives, not just be told about it. They need to feel the force of it, then feel the counter-pressure (that it's a shield for wrongdoers).
      *   **Setting:** Fictional residential cooperative (shared budget, chores, grievance procedure).
      *   **Components:** Public roles, sealed private histories (hypocrisy/complicity), standing tokens, secret objectives.
      *   **Mechanics:** Lodge complaint (spend token) -> Standing Objection (spend token) -> Vote on Standing -> If standing lost, complaint dismissed + token forfeiture. Token transfer allowed (proxy complaint).
      *   **Deliverables:** Cast list, sequence of play, materials list, scoring scheme, minute-by-minute timeline, detailed debrief script/guide, troubleshooting guide.

  2.  **Deconstruct the Philosophical Core:**
      *   *The Distinction:* Act $X$ is wrong vs. Person $A$ is entitled to blame Person $B$ for $X$.
      *   *The Standing Objection:* "You did it too," "You benefited from it," "It's not your place."
      *   *The Counter-Pressure:* Using standing to silence valid criticism (tu quoque as a shield).
      *   *The Twist:* Token transfer (proxy blame). Can I pay a "clean" person to blame you for my grievance? Does that solve the hypocrisy problem or commodify blame?

  3.  **Design the Simulation (The "Co-op"):**
      *   *Name:* "The Common House."
      *   *Roles:* Need 6 distinct roles per table. Let's make them functional but prone to specific conflicts.
          1.  Chair (facilitates meetings)
          2.  Treasurer (manages funds)
          3.  Steward (groceries/food)
          4.  Maintainer (repairs/cleaning)
          5.  Gardener (outdoors)
          6.  Secretary (communications/records)
      *   *Conflicts:* Need overlapping vulnerabilities. If the Treasurer complains about the Steward wasting money, the Steward can point out the Chair authorized a budget overrun.
      *   *Private Histories:* Each player needs 2-3 "sins" that mirror potential complaints.
      *   *Tokens:* "Standing Chips." Limited resource (3 per person). Spending one to complain is an investment. Spending one to object is a defense.
      *   *Objectives:* Need to drive behavior. Some want to accuse, some want to protect, some want to survive.
      *   *Scoring:* Needs to be non-monetary but meaningful. Points for achieving objectives, points for remaining tokens, penalty for losing standing.

  4.  **Develop the Mechanics (Iterative Process):**
      *   *Initial thought:* Just vote on standing.
      *   *Refinement:* To make them *feel* the pressure, the penalty for losing standing must be high (forfeit all tokens). This makes players defensive.
      *   *The Proxy Mechanic:* If I lose standing, can I give tokens to you to complain for me? This tests if standing is about the *act* or the *person*.
      *   *The Vote:* Majority rules on standing. This introduces politics. "I'll vote for your standing if you vote for mine." (Logrolling).

  5.  **Drafting the Materials:**
      *   Need specific role cards.
      *   Need specific "Secret Dossiers" (History + Objective).
      *   Need a "Grievance Log" for the facilitator.
      *   Need Tokens (can be poker chips or paper).

  6.  **Timeline Construction (75 Minutes):**
      *   0-10: Setup & Rules (Crucial to be dry so they focus on mechanics).
      *   10-40: Round 1 & 2 (The Game).
      *   40-75: Debrief (The Philosophy).
      *   *Correction:* 30 mins for gameplay might be tight for two tables. Need to ensure the game moves fast. Limit complaints per round. Let's say 3 rounds of 5 minutes each.
      *   *Revised Timeline:*
          *   0-15: Intro & Distribution.
          *   15-45: Gameplay (3 Rounds).
          *   45-75: Debrief.

  7.  **Designing the Debrief:**
      *   Must map game moments to concepts.
      *   *Moment 1:* The first objection. (What felt good about it?)
      *   *Moment 2:* The proxy transfer. (Did it feel like cheating or justice?)
      *   *Moment 3:* The deadlock/popularity contest. (When did truth stop mattering?)
      *   *Philosophical Concepts:* Tu Quoque, Moral Equality, Forfeiture, Commodification of Blame.
      *   *Limitations:* Acknowledge this is a game, not real life (no emotions, no history).

  8.  **Anticipating Failure Modes:**
      *   *Deadlock:* Everyone objects to everyone. -> Facilitator intervention (force a vote).
      *   *Token Exhaustion:* Game stops. -> Limit complaints per round.
      *   *Dominance:* One talker. -> Role constraints (Chair limits speaking time).
      *   *Collusion:* "I won't object if you don't." -> This is actually a feature, not a bug, but needs monitoring.

  9.  **Refining the "Secret Objectives" & "Histories":**
      *   To ensure the standing objection arises naturally, the histories *must* overlap with the likely complaints.
      *   *Example:* Treasurer complains about Steward buying expensive food. Steward's history: "Approved a personal expense on the co-op card."
      *   *Objective:* "Ensure the Treasurer is censured" vs "Never lose standing." This creates tension.

  10. **Writing the Content:** (Self-Correction during drafting)
      *   *Check:* Did I include the token transfer rule? Yes.
      *   *Check:* Is the scoring clear? Yes, objective completion + token retention.
      *   *Check:* Is the debrief deep enough? Need to ensure it hits the "Moral Equality" point hard.
      *   *Check:* Two tables. Need to ensure materials are duplicated but slightly varied to allow comparison in debrief. (Actually, keeping them identical allows for better comparison of *outcomes* based on group dynamics, but varying the names prevents confusion. Let's keep the mechanics identical but give them different Co-op names: "North House" and "South House".)

  11. **Final Review against Constraints:**
      *   75 mins? Yes.
      *   12 students? Yes (2x6).
      *   Upper-level? Yes (philosophical depth in debrief).
      *   Mechanics carry the point? Yes (incentives drive the standing objection).
      *   No money scoring? Yes (points/objectives).

  12. **Final Polish:** Ensure tone is professional yet instructional for the facilitator. (Proceeding to generate output).

  *(Self-Correction on Timeline)*: 75 minutes is very tight for a roleplay + deep debrief. I need to be ruthless with the rules explanation. The rules must be on the handouts. The facilitator speaks minimally during the game.
  *(Self-Correction on Tokens)*: 3 tokens each is 18 per table. If every complaint costs 1 and every objection costs 1, that's 9 interactions max. That's enough for 30 mins of play.
  *(Self-Correction on Proxy)*: The proxy rule is complex. "Tokens may be given." If I give you my token, do I lose standing or do you gain it? The prompt says: "forces the question whether a discredited member may have a clean-handed proxy complain on their behalf." So, I transfer the *right to complain* (the token) to someone with standing. I need to make sure this rule is clear.

  Let's finalize the structure.
  *   **Session Title:** The Standing Objection Simulation.
  *   **Materials:** Role Cards, Secret Dossiers, Tokens, Grievance Board.
  *   **Timeline:** 15 min setup, 30 min game, 30 min debrief.

