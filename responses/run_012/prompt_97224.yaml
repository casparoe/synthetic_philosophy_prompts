  Here's the thing I keep circling. The story everyone tells puts the operators in the dock, and there's a real sense in which the manoeuvre they were running that night was not some mad improvisation: it was a scheduled test the plant had been trying to finish for hours, it had been done at other units, and what made that shift's version of it fatal was partly the reactor's behaviour at low power and partly the fact that the test, which was supposed to be finished by the day shift, got handed to the night shift because the grid still needed the power. So give me the moral-luck reading of that, and push it hard: which agent is exposed to which kind of luck — resultant luck for the men in the control room, circumstantial luck for whoever happened to be on shift when the delay ran out, constitutive luck for people operating a machine whose dangerous regime they'd never been told about (that's my understanding, tell me if it's wrong), and the deputy chief engineer who was running the test and is the one everyone remembers. Then be honest about where the theory stops earning its keep: does 'moral luck' tell us anything the official investigation reports and the trial don't already tell us, or is it doing a different kind of work? And is there something in the case the standard taxonomy — the four-ish kinds people usually list — can't express, like the luck of standing in a chain of decisions where nobody's single choice is decisive?

  Push back on me wherever I'm wrong, including on the setup. And don't just end with 'so we should abandon the control principle' unless you actually mean it. Finish with what the case shows about moral luck itself — confirms it, embarrasses it, or shows that the interesting luck here was never about outcomes — and if you had to name the one person in that chain whose blameworthiness is most transformed by luck, say who and why. No reading list or citations needed, I know the texts.
