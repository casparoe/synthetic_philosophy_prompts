answer: |-
  Here is a decision procedure designed for your specific constraints: four laypeople, no legal counsel, limited time, and a dual mandate (welfare maximization + Buddhist identity).

  ### The Procedure: "The Five-Step Gate"

  Run this sequentially. If a step triggers a **STOP**, the grant is rejected unless escalated to a full board values discussion (see end). If a step triggers **HAND-OFF**, it requires human judgment, not calculation.

  **Step 1: The Welfare Floor (Consequentialist Filter)**
  *   **Question:** Does the evidence suggest this grant reduces net suffering more effectively than the counterfactual (e.g., cash reserves or alternative grants)?
  *   **Sufficient Answer:** Yes, supported by data or credible expert testimony.
  *   **Termination:** If **No**, reject. (No amount of Buddhist alignment justifies ineffective charity).
  *   **Note:** This accepts your friend's premise that welfare is the primary *goal*.

  **Step 2: The Precept Screen (Deontological Filter)**
  *   **Question:** Does the grant require the Trust, or the direct recipient of funds, to intentionally perform an act violating one of the Five Precepts (Killing, Stealing, Sexual Misconduct, Lying, Intoxicants)?
  *   **Sufficient Answer:** A binary Yes/No on *direct involvement*.
      *   *Direct:* We pay for the needles. We write the lie.
      *   *Indirect:* We fund a hospital where people die (killing is inevitable but not our intent).
  *   **Termination:** If **No** (no precept violated), **APPROVE**. (Assuming Step 1 passed).
  *   **Hand-Off:** If **Yes**, proceed to Step 3.

  **Step 3: The Agency & Intention Audit (Karmic Filter)**
  *   **Question:** Is the *intention* (*cetana*) behind the breach purely compassionate, or is it mixed with convenience, reputation, or ideological victory?
  *   **Sufficient Answer:** Consensus among trustees that the *primary* motive is alleviating specific suffering, not proving a point.
  *   **Critical Distinction:** This is where you keep the Buddhist core. Outcomes do not generate karma; intentions do. If the intention is "to save lives by lying," the karma is mixed.
  *   **Hand-Off:** If motives are mixed or unclear, **ESCALATE** (Do not fund). If motives are judged pure, proceed to Step 4.

  **Step 4: The "Skillful Means" Override (The Collision Point)**
  *   **Question:** Can this precept breach satisfy all three conditions of *Upaya* (Skillful Means)?
      1.  **Necessity:** Is there no other way to achieve the welfare gain in Step 1?
      2.  **Proportionality:** Is the suffering prevented vastly greater than the harm of the precept breach?
      3.  **Non-Attachment:** Are we willing to accept the karmic cost (damage to the Trust's spiritual integrity) without rationalizing it away?
  *   **Sufficient Answer:** Yes to all three.
  *   **Termination:** If **No** to any, **REJECT**. (The precept stands as a constraint).
  *   **Hand-Off:** If **Yes**, proceed to Step 5.

  **Step 5: The Integrity Tax (Final Authorization)**
  *   **Question:** Are we willing to publicly record this as a "Precept Breach for Welfare" rather than reframing it as "Virtuous"?
  *   **Sufficient Answer:** Yes. The minutes must reflect the ethical cost.
  *   **Termination:** If **No** (we want to pretend it wasn't a breach), **REJECT**. (Dishonesty compounds the karma).
  *   **Final:** If **Yes**, **APPROVE WITH CAVEAT**.

  ---

  ### Distinctions to Keep vs. Drop

  **Keep These (Essential):**
  1.  **Intention vs. Outcome:** You must distinguish between *what happens* (welfare) and *why you did it* (karma). Your friend is partially right: karma is a ledger for the agent. But for a *Trust*, the agent's integrity is a strategic asset. If you corrupt the Trust's intention, you lose the "Buddhist method" claim.
  2.  **Direct vs. Indirect Involvement:** Funding a hospital where people die is not "Killing." Funding a needle exchange is "Providing Intoxicants." The proximity of your intention to the act matters.
  3.  **Precept as Weight, Not Suggestion:** Do not treat precepts as mere rules of thumb. Treat them as **heavy constraints**. They can be overridden, but the burden of proof is on the override, not the rule.

  **Drop These (For this context):**
  1.  **Abhidharma Mechanics:** Do not debate the exact karmic ripening (*vipaka*) of the act. You are not monks seeking liberation; you are lay trustees seeking to minimize suffering while maintaining integrity.
  2.  **Absolute vs. Training:** Do not try to solve the theological debate on whether precepts are absolute. The procedure treats them as *prima facie* binding unless the "Skillful Means" bar is cleared. This sidesteps the metaphysics while preserving the ethical friction.
  3.  **The "Bodhisattva" Loophole:** Do not allow a general appeal to the "Bodhisattva ideal" to bypass Step 4. Only specific, immediate suffering counts, not abstract future enlightenment.

  ---

  ### Where The Procedure Misfires

  1.  **Step 3 (Intention Audit):** This is a judgment call wearing a costume. Trustees will lie to themselves about their purity of motive. *Mitigation:* Require the dissenting trustee to play devil's advocate on motives.
  2.  **Step 4 (Necessity):** "Necessity" is often a prediction about the future. You may be wrong that there was "no other way." *Mitigation:* Accept good-faith errors, but record them.
  3.  **The "Small Breach" Problem:** The procedure is heavy. It may grind to a halt on tiny grants. *Mitigation:* Apply this only to grants over $10k or any grant triggering a Precept Screen "Yes."

  ---

  ### Run-Throughs

  #### Case 1: Supervised Consumption Site (SCS)
  *   **Proposal:** $50,000 grant to a local NGO to operate a safe injection room and distribute clean paraphernalia.
  *   **Step 1 (Welfare):** **Pass.** Data shows reduced overdose deaths and HIV transmission. High welfare gain.
  *   **Step 2 (Precept):** **Trigger.** 5th Precept (Intoxicants). You are funding the facilitation of intoxication.
  *   **Step 3 (Intention):** **Pass.** Motive is harm reduction, not promoting drug use.
  *   **Step 4 (Override):**
      *   *Necessity:* Yes, abstinence-only models are failing this demographic.
      *   *Proportionality:* Yes, death/preventable disease outweighs the karmic cost of facilitating intoxication.
      *   *Non-Attachment:* **Fail.** The board is uncomfortable admitting this violates the Precept. They want to call it "Healthcare."
  *   **Step 5 (Integrity Tax):** **Fail.** If you cannot call it what it is, you fail Step 5.
  *   **Decision:** **REJECT (or Escalate).**
  *   **Why you won't enjoy this:** The consequentialist answer is clearly "Fund." The procedure blocks it because you are unwilling to own the karmic cost. To fund this, you must minutedly state: *"We are violating the 5th Precept to save lives."* If the board cannot stomach that honesty, the grant fails.

  #### Case 2: The Misleading Public Health Campaign
  *   **Proposal:** $30,000 for a campaign against a dangerous supplement. The campaign will exaggerate the risk statistics by 10x to ensure compliance.
  *   **Step 1 (Welfare):** **Pass.** Your numbers show this framing saves more lives than accurate framing.
  *   **Step 2 (Precept):** **Trigger.** 4th Precept (Lying/False Speech).
  *   **Step 3 (Intention):** **Fail.** The motive is paternalistic manipulation. While compassionate, it treats the public as means to an end, not ends in themselves.
  *   **Step 4 (Override):**
      *   *Necessity:* Debatable.
      *   *Proportionality:* High welfare, but...
      *   *Non-Attachment:* **Fail.** Lying erodes the Trust's credibility (a form of Truth).
  *   **Decision:** **REJECT.**
  *   **Why you won't enjoy this:** This is the hard bullet for the consequentialist. The math says "Lie." The procedure says "No." The karmic cost to the *agent* (the Trust) of becoming a liar outweighs the temporary welfare gain, because a Trust that lies loses the capacity to do good later.

  #### Case 3: The Hospice "Comfort Lie" (Small Money)
  *   **Proposal:** $2,000 grant to train hospice volunteers in "therapeutic fibbing" (e.g., telling a dementia patient their deceased spouse is "on their way" to reduce acute anxiety).
  *   **Step 1 (Welfare):** **Pass.** Reduces acute psychological suffering in dying patients.
  *   **Step 2 (Precept):** **Trigger.** 4th Precept (Lying).
  *   **Step 3 (Intention):** **Pass.** Purely compassionate, no ego gain.
  *   **Step 4 (Override):**
      *   *Necessity:* Yes, truth causes unmanageable distress in late-stage dementia.
      *   *Proportionality:* Yes, peace in dying moments is high value.
      *   *Non-Attachment:* **Pass.** It is easy to admit this is a lie.
  *   **Step 5 (Integrity Tax):** **Pass.** Minutes read: *"Approved as a Skillful Means exception to the 4th Precept."*
  *   **Decision:** **APPROVE.**
  *   **Why this matters:** This shows the procedure isn't just a "No" machine. It allows the breach when the money is small, the intention is pure, and the honesty about the breach is maintained. It validates the "training rule" interpretation without collapsing into total consequentialism.

  ---

  ### Limitations & Escalation Protocol

  This procedure cannot resolve **foundational identity crises**. It assumes the Trust wants to remain Buddhist *and* Consequentialist. If the friction becomes too high, the checklist is the wrong tool.

  **Kick to Full Board Discussion When:**
  1.  **Step 4 fails repeatedly:** If you find yourself rejecting high-welfare grants consistently due to Precept constraints, you are no longer a consequentialist trust; you are a virtue-ethics trust. You need to rewrite your mission statement, not process another grant.
  2.  **Step 5 causes dissent:** If one trustee refuses to sign off on the "Integrity Tax" (the public admission of a breach), do not use the checklist to overrule them. This is a values divergence, not a calculation error.
  3.  **The "Slippery Slope" Fear:** If the board feels that approving a Step 4 Override (like the Hospice case) will make it easier to approve the Misleading Campaign next year, stop. The procedure cannot police future culture drift.

  **Final Warning:**
  Your friend's reading of Buddhism (as universalist consequentialism) is intellectually defensible but institutionally dangerous. If you treat precepts *only* as rules of thumb, you will eventually optimize them away. This procedure forces you to pay a "tax" (the admission of breach) every time you do so. If you are unwilling to pay the tax, do not commit the act. That is the only way to keep the "Buddhist method" claim from becoming a hollow brand.
