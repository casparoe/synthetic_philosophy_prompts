prompt: |-
  I sit on the board of a small charitable trust — four volunteer trustees, a few hundred thousand dollars to give away each year, decisions made in a single afternoon once a month, no staff and no lawyer in the room — that a local Buddhist community set up and that we have spent several awkward meetings trying to run on openly consequentialist lines: we want the grants to avert as much suffering as possible, and we are deliberately unsentimental about whether a project looks Buddhist. The friction is that we also describe ourselves as Buddhist in method, and the two halves keep colliding in ways none of us can adjudicate. Last month we burned ninety minutes on whether to fund a supervised consumption site that distributes paraphernalia we are fairly sure our founding donors would have called a violation of the precept against intoxicants; the month before, a trustee proposed a public-health campaign built on a misleading framing of the risks, which our own numbers suggested would save lives. A friend who reads the same rationalist blogs I do keeps insisting that the tradition we are half-aping is itself best read as a species of universalist consequentialism — strong agent-neutrality, a willingness to let the compassionate agent break the precepts when breaking them does more good, an ethic that treats no-self as dissolving the special standing of one's own projects, and a doctrine of radical altruism in which the bodhisattva takes on others' suffering — while the familiar claim that karma turns on intention is not a competing criterion of rightness at all but a separate ledger recording what happens to the agent. I find this reading suspiciously convenient, and I genuinely cannot tell whether the precepts are absolute constraints, training rules, or rules of thumb whose breach is merely expensive for the person who breaches them, nor how the intention-centered karma story is supposed to interact with a welfare-based criterion. I have read enough virtue-ethics framings of Buddhist ethics to be unsure the consequentialist reading is even the majority view, and no one on the board has read the primary texts.

  What I want from you is a procedure, not a lecture: something the four of us can actually run on a grant proposal, in the order we should ask the questions, with a clear statement of what counts as a sufficient answer to each, where the procedure terminates in a no, and where it has to hand the decision back to a human because the question is one of values rather than facts. It has to keep whatever the tradition actually commits to while being usable by people who have not read it, so tell me explicitly which distinctions must survive the simplification and which I can afford to drop, and be honest about the points where the procedure will misfire or is really just a judgment call wearing the costume of a step. Then run it end to end on three proposals — the supervised consumption site, the misleading but effective campaign, and one more I leave to you, ideally something where the maximising answer and the precept answer diverge and the money is small enough that the decision feels beneath the theory. At least one of the three should come out in a way I will not enjoy, and after the run-throughs I want a short section on what the procedure cannot do and which cases should be kicked to the whole board rather than settled by the checklist.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the User and Request:**
      *   **User:** A trustee on a small Buddhist charitable trust (4 volunteers, no staff/lawyer, ~$100k-$500k/yr).
      *   **Problem:** Tension between "openly consequentialist" goals (maximize suffering reduction/EA-style) and "Buddhist method" identity (precepts, karma, intention). Friction arises when these collide (e.g., harm reduction vs. intoxicants, lying for public health).
      *   **Friend's Argument:** Buddhism *is* consequentialist (universalist, agent-neutral, bodhisattva ideal), precepts are training rules, karma is a separate ledger (consequences for the agent, not rightness of the act).
      *   **User's Skepticism:** Suspicious this is too convenient. Unsure if precepts are absolute, training, or rules of thumb. Unsure how karma/intention interacts with welfare. Aware of virtue-ethics readings.
      *   **Goal:** A *procedure* (checklist/algorithm) for grant decisions, not a lecture. Needs order of questions, sufficiency conditions, termination points (No), and hand-off points (Human Judgment).
      *   **Requirements:**
          *   Must preserve essential Buddhist distinctions while being usable by non-scholars.
          *   Must admit where it misfires or is a judgment call in disguise.
          *   Must run three case studies:
              1.  Supervised Consumption Site (SCS) / Paraphernalia.
              2.  Misleading Public Health Campaign.
              3.  A new case (small money, divergent answers).
          *   At least one outcome must be unenjoyable (counter-intuitive or hard).
          *   Final section on limitations and when to kick to full board discussion.

  2.  **Deconstruct the Ethical Tension:**
      *   *Consequentialism (EA/Utilitarian):* Maximize good outcomes (welfare, suffering reduction). Intentions matter only insofar as they affect outcomes.
      *   *Buddhist Ethics (Theravada/Mahayana mix):*
          *   *Sila (Precepts):* Usually prohibitions (killing, stealing, sexual misconduct, lying, intoxicants).
          *   *Karma:* Intention (*cetana*) is karma. Outcomes (*vipaka*) are results.
          *   *Bodhisattva Ideal (Mahayana):* Skillful Means (*upaya*), breaking precepts *if* motivated purely by compassion and wisdom (very high bar).
          *   *Virtue Ethics:* Cultivating the character of the agent.
      *   *The Conflict:* Can you do "bad" (break precepts) to achieve "good" (reduce suffering)?
      *   *The Friend's View:* Yes, if the net suffering is lower. The "bad" karma hurts the *agent*, but the *act* is justified by welfare.
      *   *The Traditionalist View:* Breaking precepts corrupts the mind, leading to more suffering long-term. Intention is the primary moral metric, not just outcome.

  3.  **Designing the Procedure:**
      *   Needs to be practical for a 1-hour meeting slot.
      *   Needs to integrate both welfare calculation and precept adherence without collapsing one into the other immediately.
      *   *Structure:*
          1.  **Impact Threshold:** Is this effective enough to consider? (EA filter).
          2.  **Precept Check:** Does this involve breaking a core precept? (Buddhist filter).
          3.  **Intention/Motive Check:** Why are we doing this? (Karma filter).
          4.  **The "Skillful Means" Override:** Can we justify the breach? (The collision point).
          5.  **Decision:** Fund / Don't Fund / Escalate.
      *   *Crucial Distinction to Keep:* The difference between *outcome* (suffering reduced) and *karmic cost* (integrity/precept breach). The procedure must acknowledge that a grant can be "good for the world" but "bad for the trust's Buddhist identity."
      *   *Crucial Distinction to Drop:* Deep scholastic debates on Abhidharma karma mechanics. Focus on *intention* and *direct involvement*.

  4.  **Drafting the Steps (Iterative Refinement):**
      *   *Step 1: The Welfare Floor.* If it doesn't do good, stop.
      *   *Step 2: The Precept Screen.* Does it directly involve Killing, Stealing, Sexual Misconduct, Lying, Intoxicants?
      *   *Step 3: The Agency Test.* Are *we* doing it, or funding others who do? (Distance matters in Buddhism).
      *   *Step 4: The Intention Audit.* Is the motive purely compassionate or mixed with reputation/ego?
      *   *Step 5: The Override (The Hard Part).* If Precept is broken, is it *Upaya* (Skillful Means)? Criteria: Necessity, Last Resort, Pure Motive, Net Benefit.
      *   *Termination:* If Welfare is low -> No. If Precept broken + No Override -> No. If Precept broken + Override Yes -> Yes (but record cost).

  5.  **Developing the Case Studies:**
      *   *Case 1: Supervised Consumption Site (SCS).*
          *   Welfare: High (saves lives, reduces disease).
          *   Precept: Intoxicants (5th Precept).
          *   Agency: Funding provision of paraphernalia.
          *   Override: Is it compassionate? Yes. Is it breaking precept? Yes.
          *   *Outcome:* Likely Fund, but with a "Karmic Cost" note. (User might not enjoy the compromise).
      *   *Case 2: Misleading Campaign.*
          *   Welfare: High (saves lives).
          *   Precept: Lying (4th Precept).
          *   Agency: Trust creates the message.
          *   Override: Lying erodes trust long-term. Harder to justify than SCS.
          *   *Outcome:* Likely No. (The "unenjoyable" one for the consequentialist).
      *   *Case 3: Small Divergence.*
          *   Idea: Funding a meal program that serves alcohol? No, too similar to SCS.
          *   Idea: Funding a shelter that requires religious conversion? (Violates autonomy/truth).
          *   Idea: *The "Small Lie for Dignity" case.* A hospice grant where staff tell small comforting lies to dying patients to reduce anxiety.
          *   Welfare: High (reduces suffering).
          *   Precept: Lying.
          *   Money: Small ($5k).
          *   *Outcome:* This tests the "rules of thumb" vs. "absolute" nature. Let's make it: Funding a legal defense for a whistleblower who stole data to expose harm. (Stealing + Lying vs. Great Good).
          *   *Better Idea:* A micro-grant for a farmer to use pesticides (Killing precept) to save his livelihood vs. organic (lower yield, more hunger).
          *   *Best Idea:* **The "Comfort Lie" Grant.** Small grant ($2k) for a hospice volunteer training that teaches "therapeutic fibbing" to dementia patients to reduce distress.
          *   Welfare: Clear reduction in distress.
          *   Precept: Lying.
          *   Divergence: Consequentialist says Yes. Strict Precept says No.
          *   *Outcome:* No. (Because the *method* corrupts the *agent*).

  6.  **Refining the Procedure for "Honesty":**
      *   Must admit that Step 5 (Override) is where the "judgment call wearing a costume" happens.
      *   Must admit that "Buddhist Identity" is a constraint independent of "World Welfare."
      *   The Friend's view (Karma is just a ledger for the agent) needs to be integrated: The Trust accepts the karmic cost if the welfare gain is high enough, *but* acknowledges it damages the Trust's spiritual integrity.

  7.  **Drafting the Content (incorporating constraints):**
      *   *Tone:* Professional, direct, slightly philosophical but actionable.
      *   *Structure:*
          1.  The Procedure (The "Algorithm").
          2.  Distinctions Kept vs. Dropped.
          3.  Where it Misfires.
          4.  The Three Run-Throughs.
          5.  Limitations & Escalation.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the procedure too complex?
      *   *Fix:* Simplify the "Override" criteria to three binary questions.
      *   *Critique:* Did I address the friend's argument?
      *   *Fix:* Explicitly mention in the "Intention" step that karma follows intention, but the *grant* is about the *act*.
      *   *Critique:* Is the "unenjoyable" outcome clear?
      *   *Fix:* Ensure the Misleading Campaign gets a hard "No" despite saving lives, forcing the consequentialist to swallow a bullet.
      *   *Critique:* Did I answer the specific question about "absolute vs. training rules"?
      *   *Fix:* The procedure treats them as *prima facie* constraints that require high-bar justification to override, effectively treating them as "heavy weights" rather than "absolute walls" or "suggestions." This is a pragmatic middle ground.

  9.  **Final Polish:** Check against the prompt's specific requirements (order of questions, sufficient answers, termination points, human hand-off). Ensure the "Small Case" is actually small money.

  *(Self-Correction on Case 3)*: Let's make Case 3 about *Stealing/Intellectual Property*. Funding a project that distributes copyrighted medical textbooks without permission to poor clinics.
  *   Welfare: High (health access).
  *   Precept: Stealing (2nd Precept).
  *   Money: Small ($10k for server costs).
  *   Divergence: EA says Yes (property rights are conventional, life is real). Buddhism says Stealing is heavy karma.
  *   Decision: No. (Preserves the integrity constraint).

  *Wait, let's stick to the "Comfort Lie" (Hospice/Dementia).* It feels more "beneath the theory" as requested ($2k grant) and hits the 4th precept directly without the complexity of IP law.

  *Re-evaluating the "Friend's Argument":* The friend says karma is a separate ledger. The procedure needs to reflect that. We can fund the "good outcome" even if it generates "bad karma" for us, *provided* we acknowledge the cost. But if the bad karma corrupts the *mission*, we stop. This is the nuance.

  *Final Plan:*
  1.  **Procedure:** 5 Steps.
  2.  **Distinctions:** Intention vs. Outcome, Direct vs. Indirect, Precept as Constraint vs. Cost.
  3.  **Misfires:** The "Pure Motive" check is subjective.
  4.  **Cases:** SCS, Misleading Campaign, Hospice Lies.
  5.  **Limitations:** When to escalate.

