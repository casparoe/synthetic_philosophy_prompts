answer: |-
  ### The Translation

  In the vocabulary of decision theory and welfare economics, Émilie du Châtelet's account can be restated as a model of **dynamic constrained optimization over an infinite horizon**.

  Happiness is not a static end-state or a stochastic shock to an agent's affective state; it is the **maximization of a discounted utility stream** achieved through active investment in cognitive and emotional capital. The agent possesses a set of first-order preferences (the passions), but these are subject to a **second-order preference ordering** (reason). This higher-order ranking does not eliminate first-order desires but imposes constraints on the feasible set of actions, effectively acting as a **commitment device** to prevent time-inconsistent behavior.

  The utility function is not homogeneous across all goods. Different passions carry different **risk profiles**. The love of study and the desire for esteem are **low-variance assets**; their utility yield is largely under the agent's control and exhibits sustainable returns over time. Romantic love, by contrast, introduces high **agency risk**; it makes the agent's utility function dependent on an external variable (another person's will), increasing the variance of the expected utility stream and the probability of catastrophic loss.

  **Self-love** is modeled not as myopic selfishness (short-term payoff maximization) but as **intertemporal rationality**. It is the consistent application of a discount rate that values future well-being sufficiently to justify present restraint. However, the agent's **preference formation** is vulnerable to exogenous distortion. Social expectations, particularly gendered norms, act as **informational asymmetries** or **false priors** that corrupt the agent's estimation of the utility function. These external constraints can induce **adaptive preferences**, causing the agent to optimize for a locally maximal but globally suboptimal outcome.

  Therefore, the rational agent must audit their preference ordering to ensure it reflects true **welfare** rather than socially conditioned **revealed preference**. Happiness is the successful execution of this audit and the subsequent governance of the utility function to ensure a stable, high-yield stream of well-being.

  ***

  ### Residue Report

  Here is the breakdown of how the translation holds up under scrutiny.

  **1. Clean Translations**
  *   **Risk and Reliability:** Mapping the "reliability" of passions to the **variance and agency risk** of utility streams is a robust fit. Decision theory handles the distinction between internal and external loci of control very well.
  *   **Reason as Governance:** Modeling reason as **second-order preferences** (preferences about which preferences to act upon) or a **commitment device** captures the structural role Du Châtelet assigns it. It explains how one can want something (first-order) but choose not to pursue it (second-order governance).
  *   **Social Corruption:** The idea that social expectations corrupt judgment maps cleanly onto **adaptive preferences** and **endogenous preference formation**. Welfare economics recognizes that revealed preferences can be "contaminated" by unjust constraints, leading to suboptimal welfare outcomes.

  **2. Translations with Distortion**
  *   **Happiness as "Exercise" vs. Outcome:** Decision theory is fundamentally consequentialist; it evaluates choices based on the *states of the world* they produce (outcomes). Du Châtelet describes happiness as the *continued exercise* of passions. This is closer to an **activity-based view of well-being** (Aristotelian *energeia*) than a utility outcome. Translating this as a "utility stream" flattens the distinction between *doing* and *receiving*. In her view, the optimization process *is* the happiness, not just the means to it.
  *   **Self-Love and Intertemporality:** While "intertemporal rationality" captures the time element, Du Châtelet's "self-love" carries a normative weight that "rational discounting" lacks. In decision theory, a high discount rate is a parameter, not a moral error. For Du Châtelet, failing to seek one's true good is a failure of rationality *and* morality. The technical term describes the *shape* of the choice but misses the *normative force*.
  *   **Reason's Authority:** In standard decision theory, reason is instrumental (Humean): it calculates how to get what you want. For Du Châtelet (a Rationalist), reason is constitutive: it determines what you *should* want. Translating this as "second-order preferences" risks implying that the second-order preference is just another desire, rather than an objective standard of correctness.

  **3. No Counterpart**
  *   **The Ontology of Passion:** Decision theory treats preferences as black-box inputs. Du Châtelet offers a phenomenology of the passions themselves (e.g., the specific texture of the love of study vs. romantic love). Decision theory has no vocabulary for the *qualitative difference* between utilities, only their magnitude and probability.
  *   **Gendered Epistemology:** While "exogenous constraints" captures the *effect* of social expectations, it misses the specific *epistemic injustice* Du Châtelet identifies. It is not just that women face constraints; it is that their capacity to *form* a utility function is systematically degraded by education and culture. Welfare economics struggles to model the corruption of the preference-formation mechanism itself without appealing to an external "true" preference that the theory usually refuses to define.

  ***

  ### Classification: Preference-Satisfaction or Objective-List?

  Under translation, Du Châtelet's account becomes a **Perfectionist Objective-List Theory** disguised as a Preference-Satisfaction model.

  It *looks* like Preference-Satisfaction because it operates through the mechanics of desire (passions) and choice (self-love). However, because "Reason" has the authority to veto passions and declare some objects of desire (study, esteem) objectively superior to others (romantic dependency), it violates the core tenet of Preference-Satisfaction theory: that the agent's sovereign preference defines the good.

  In welfare economics terms, she is arguing that **revealed preferences** (what we choose) often diverge from **normative preferences** (what is actually good for us), and that Reason is the tool for aligning them. This requires an **Objective-List** of goods (knowledge, esteem, autonomy) that Reason discovers rather than creates.

  ***

  ### Interpretation of the Residue

  Is the residue a sign that decision theory is missing something, or that Du Châtelet's account is less clear than it looks?

  It is primarily a sign that **decision theory is normatively thin.**

  Du Châtelet's account is not unclear; it is operating within a Rationalist framework (Leibnizian/Wolffian) that assumes reason can access objective truths about the good. Decision theory, largely descended from Humean empiricism, assumes reason is the slave of the passions and cannot adjudicate between final ends.

  The residue appears where Du Châtelet makes claims about the *quality* of happiness (activity vs. state) and the *correctness* of desires (reason vs. corruption). Decision theory can model the *structure* of her choice (constraints, risk, time), but it cannot model the *authority* of her Reason without smuggling in an objective welfare function that standard theory explicitly rejects.

  If you force her view entirely into decision-theoretic terms, you lose the thing that makes it a theory of *happiness* rather than a theory of *efficient choice*. You capture the machinery of her mind, but you lose the engine that drives it. The residue indicates that happiness involves normative judgments about the *kind* of life being lived, which utility functions are designed to ignore in favor of measuring the *amount* of satisfaction produced.
