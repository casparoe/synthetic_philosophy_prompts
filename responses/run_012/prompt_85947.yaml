prompt: |-
  My sister went vegan last year and now every sunday dinner turns into the same fight, and I keep defending a position I dont actually hold, so I want to actually think it through properly. Build me a thought experiment where total-view hedonistic utilitarianism and a rights view (the kind where each subject-of-a-life has inherent value that cant be traded off) give opposite verdicts on the exact same act — the point is to find out whether the utilitarian verdict is a reductio of the view or just a bullet it has to bite — and make the whole thing hinge on one variable: whether the animal that gets killed is replaced by another animal whose life is just as good. Hold everything else fixed: same animal, same painless death, same total amount of suffering and enjoyment in the world. Then walk me through what each view says and why, tell me honstly which feature of the case is doing the work and what happens to the disagreement when I take it away, and say how someone who finds the utilitarian verdict monstrous would try to defuse the case without just refusing the theory. One more thing: the same replacement move applied to a human being would strike most people as horrifying, so is that asymmetry defensible or is it just speciesism wearing a nicer coat? Start with the scenario in one paragraph, then the analysis, 600 words max, and no citations please, I cant look anything up.
