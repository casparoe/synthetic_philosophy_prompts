  *   **Lacked force (Causal):** Go to Node 3.

  **Node 2**
  *Case: The practitioner said to have ended the cycle by insight alone.*
  **Question:** Is the cycle ended because *the practitioner has paid their debt in full*, or because *the 'practitioner' who owed the debt is recognized as a fiction*?
  *   **Paid debt (Persisting Subject):** Go to Node 4.
  *   **Fiction (No-Self):** Go to Node 5.

  **Node 3**
  *Case: The donor who gives generously and entirely for the sake of being seen.*
  **Question:** When this donor receives no reward, is it because their *hidden motive broke the causal circuit*, or because *the act itself was retroactively cancelled*?
  *   **Broke circuit:** Leaf 1 — **Psychological Causation**
  *   **Cancelled act:** Leaf 2 — **Unnamed** *(Diagnosis: Unattractive. Implies an act can be undone by later mental states, violating the temporal order of cause and effect.)*

  **Node 4**
  *Case: The child born with a condition no one chose.*
  **Question:** Is the child's condition a *sentence passed by an authority* (cosmic or divine), or a *residue adhering to them* like dust on a coat?
  *   **Sentence passed (Juridical):** Go to Node 6.
  *   **Residue adhering (Material):** Go to Node 7.

  **Node 5**
  *Case: The practitioner said to have ended the cycle by insight alone.*
  **Question:** If the self is a fiction, does the word 'desert' still *describe a real moral fact*, or is it merely *a useful story for those still trapped*?
  *   **Real moral fact:** Leaf 3 — **Subjectless Desert**
  *   **Useful story:** Leaf 4 — **Soteriological Fiction**

  **Node 6**
  *Case: The family that suffers for something an ancestor did.*
  **Question:** Can the penalty be *paid by another or voided by plea*, or must it *strike the specific offender*?
  *   **Paid/Voided (Transferable):** Go to Node 8.
  *   **Strike offender (Inescapable):** Go to Node 9.

  **Node 7**
  *Case: The soldier who kills under orders he believes unjust.*
  **Question:** If the consequence is a material residue, can it be *washed off by another*, or must it *wear off the wearer*?
  *   **Washed by another:** Leaf 5 — **Unnamed** *(Diagnosis: Incoherent. Physical residues adhere to the object contacted; transferability implies juridical status, contradicting the material premise.)*
  *   **Wear off wearer:** Go to Node 10.

  **Node 8**
  *Case: The family that suffers for something an ancestor did.*
  **Question:** Is the transfer effective because *a higher power accepts the plea*, or because *merit functions like currency that can be sent*?
  *   **Higher power accepts:** Leaf 6 — **Divine Pardon**
  *   **Merit currency:** Leaf 7 — **Merit Economy**

  **Node 9**
  *Case: The soldier who kills under orders he believes unjust.*
  **Question:** Is the karmic consequence *exactly proportional to the intent*, or *roughly aligned with the outcome*?
  *   **Proportional to intent:** Leaf 8 — **Retributive Ledger**
  *   **Aligned with outcome:** Leaf 9 — **Rough Justice**

  **Node 10**
  *Case: The soldier who kills under orders he believes unjust.*
  **Question:** Is the residue removed by *exact repayment of suffering*, or does it *fade over time regardless*?
  *   **Exact repayment:** Leaf 10 — **Karmic Materialism**
  *   **Fades over time:** Leaf 11 — **Moral Entropy**

  *(Note: Leaf 12 is left intentionally unpopulated in the structure to allow for the "Unnamed" diagnosis below, but the tree above contains 11 distinct endpoints. To meet the "unoccupied branches" requirement explicitly in the tree structure, Leaf 2 and Leaf 5 serve as the unoccupied positions.)*

  ***

  ### Diagnosis of Unoccupied Branches

  **Leaf 2 (Retroactive Nullification):**
  *Status:* **Unattractive.**
  *Diagnosis:* This position suggests that a mental state occurring *after* an act can erase the act's existence. While philosophically possible (some forms of idealism might flirt with it), it is functionally indistinguishable from Psychological Causation (Leaf 1) in practice, as both result in no reward. It is unoccupied because it undermines the stability of the "deed" required for any moral accounting.

  **Leaf 5 (Physical Transfer):**
  *Status:* **Incoherent.**
  *Diagnosis:* This branch combines the "Material Residue" model (Node 4) with "Transferability" (Node 7). If karma is a physical stain adhering to a soul (like dust on a coat), it cannot logically be transferred to another soul without physical contact or exchange. Transferability requires a juridical model (authority or currency). No tradition occupies this leaf because it demands a substance that behaves like matter but obeys laws of contract.

  ### Indistinguishable Leaves

  **Leaf 6 (Divine Pardon) vs. Leaf 7 (Merit Economy):**
  *Flag:* **Empirically Indistinguishable.**
  *Reasoning:* In a concrete case (e.g., a family performing a ritual to save an ancestor), the observable outcome is identical: the suffering stops via intervention. The distinction relies entirely on the *unobservable mechanism* (a Judge's whim vs. a cosmic banking system). To split these, you would need a case where a ritual *fails* despite sufficient "currency" (proving a Judge exists) or succeeds *without* ritual (proving currency is automatic). Since such cases are interpreted ad hoc by believers, the tree cannot separate them using the provided cases.

  **Node 4 (Juridical vs. Material):**
  *Flag:* **Structurally Ambiguous.**
  *Reasoning:* The tree asks the reader to choose between "Sentence" and "Residue." However, if the "Residue" behaves with perfect moral precision (Leaf 10), it functions identically to a "Sentence." A reader observing a case cannot distinguish an impersonal law that acts *like* a judge from a judge who acts *like* an impersonal law. This split relies on the interviewee's metaphysical claim, not the case evidence.

  ***

  ### Closing Note: Structural Limitations

  This instrument is structurally unable to sort **hybrid synchronicities**. It forces a choice between "Causal" and "Desert" at the root (Node 1), yet many traditions hold that the causal mechanism *is* the delivery of desert (i.e., the physics *constitutes* the judgment). By forcing a split, the tree may artificially separate views that are actually identical in practice but differ in metaphor.

  Furthermore, the tree cannot detect **esoteric exceptions**. It assumes the rules apply universally to the cases presented. It cannot account for systems where the rules hold for everyone *except* the enlightened, or for everyone *except* the chosen, without creating infinite branching nodes for every possible exemption. It maps the *public doctrine*, not the *private loophole*.
