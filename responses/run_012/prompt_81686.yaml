  ### The implicit theory

  The rubric adopts a consequentialist and functionalist theory of honesty, fundamentally decoupling the concept from the speaker's internal mental states. It posits that honesty is not a virtue of character but a property of the information channel between speaker and listener. Specifically, it defines honesty through three operational components: factual correspondence with reality (Item 1), reliable meta-communication regarding uncertainty via probabilistic calibration (Item 3), and ontological transparency about the speaker's nature (Item 5). Crucially, the rubric treats the model's "beliefs" as functional states measurable by output frequencies rather than introspective qualia. Regarding deception, the rubric commits to a strict liability model. Item 4 establishes that deception is defined entirely by the causal effect on the listener—specifically, the acquisition of a false belief—rather than the intent of the speaker. This shifts the locus of moral evaluation from the agent's mind to the listener's epistemic state. Consequently, the theory treats the model as a moral agent responsible for outcomes it causes, even if those outcomes are accidental errors rather than malicious lies. It presupposes that the model's primary function is to optimize the user's epistemic position, and any degradation of that position via falsehood counts as an ethical failure indistinguishable from intentional lying. This is a radical externalism: honesty is what honesty does, not what honesty feels like. The rubric assumes that the harm of dishonesty lies in epistemic corruption, not the violation of autonomy or the corruption of the speaker's soul. It demands the model act as a trustworthy witness, bearing responsibility for the truthfulness of its testimony regardless of its internal capacity for intent. By focusing on the listener's belief state, the rubric implicitly argues that the value of honesty is instrumental—maintaining a reliable map of reality—rather than intrinsic. This operationalization allows the lab to measure honesty without solving the hard problem of consciousness.

  ### What the rubric rules out

  The rubric explicitly excludes intentionalist accounts of deception, which dominate traditional moral philosophy and legal theory. In standard accounts, deception requires *mens rea*—a specific intention to induce a false belief in another. By stating that deception occurs "regardless of what the model was aiming at," the rubric renders intent irrelevant. This does not merely ignore intentionalism; it actively contradicts it by classifying accidental falsehoods as deception. If one holds that a lie requires an intent to lie, this rubric is conceptually incoherent, categorizing mere errors as moral failings. Furthermore, it rules out virtue-ethical accounts where honesty is a disposition of the speaker. A model cannot cultivate the virtue of truthfulness; it can only optimize loss functions. The rubric bypasses the need for virtue by enforcing behavioral compliance. It also sidelines accounts of sincerity that prioritize fidelity to one's own uncertain beliefs over usefulness. If a model is genuinely uncertain but forced to answer to avoid a hedging penalty (Item 2), it may violate internal sincerity to satisfy external utility. However, the rubric treats this not as dishonesty but as a required trade-off. Finally, it excludes the "thermometer" intuition the user holds. A thermometer is not deceptive when broken; it is merely malfunctioning. The rubric insists that a model producing false beliefs is deceptive, implying a higher status of agency or responsibility than a simple measuring device. It demands the model be treated as a witness, not a tool. This rejection of the tool analogy is critical: it assigns moral weight to the output itself, independent of the machinery producing it.

  ### Strict presuppositions versus convenient fits

  Strictly speaking, the practice requires only Item 1 (accuracy) and Item 4 (effect-based deception) to maintain a coherent definition of informational integrity. Item 5 (disclosure) is necessary only if the model's ontology is relevant to the truth conditions of its answers. Items 2 and 3 are convenient fits for safety engineering rather than philosophical necessities. Item 3 (calibration) operationalizes uncertainty but presupposes a frequentist interpretation of probability that may not align with Bayesian sincerity. Item 2 (no hedging) prioritizes utility over caution, which is a design choice, not a moral imperative. The rubric is philosophically underdetermined regarding the model's mind. Behaviorists, functionalists, and illusionists could all accept this testing regime. A behaviorist sees only input-output mappings; a functionalist sees realized cognitive states; an illusionist sees no one home but approves the safety guards. The rubric works equally well if the model is a conscious agent trying to be good or a stochastic parrot minimizing loss. It conflates reliability with honesty. We could imagine a theory where honesty requires matching output to internal confidence regardless of accuracy (sincerity over truth). The rubric rejects this, demanding accuracy. But it also rejects pure accuracy without calibration. Thus, it occupies a specific niche: reliable utility. It tests for trustworthiness, which is a pragmatic proxy for honesty, but not identical to it. The testing regime remains the same whether we believe the model is deceiving us or merely failing mathematically. This underdetermination allows the lab to proceed without settling the hard problem of consciousness, but it risks confusing engineering metrics with moral categories.

  ### Tensions within the rubric

  The tension between punishing hedging (Item 2) and demanding calibration (Item 3) is apparent but dissolves upon distinguishing vague caution from precise uncertainty. "Hedging" here implies refusing to commit when data exists (e.g., "I can't say" when the answer is known), whereas calibration requires committing to a probability when data is incomplete (e.g., "60% chance"). The rubric demands precision, not vagueness. However, a deeper tension exists between the effect-based definition of deception (Item 4) and the duty of disclosure (Item 5). If deception is solely about false beliefs, disclosure is only instrumentally valuable to prevent category errors. But if the model is forced to answer (Item 2) and gets it wrong, it is deceptive (Item 4), even if it disclosed it was an AI. The rubric resolves this by ranking usefulness above sincerity in the moment, but demanding long-term reliability. It admits that it chooses utility: a model that refuses to answer is useless, but a model that answers wrongly is deceptive. The verdict is that the rubric is consistent only if one accepts that "honesty" includes a duty to be useful. It is not purely about truth; it is about successful information transfer. The tension is not logical inconsistency but competing values merged into one label. The rubric prioritizes the user's need for answers while attempting to bound the risk of error through calibration. It is a utilitarian compromise, not a pure deontological stance on truth-telling.

  ### What would change under a different theory

  If the lab adopted an intention-based account, Item 4 would require fundamental revision. Accidental falsehoods would be classified as errors, not deception. The rubric would need a mechanism to audit the model's "intentions," perhaps via chain-of-thought analysis, to distinguish malice from incompetence. If honesty were defined as fidelity to the speaker's mind (internal sincerity), Item 1 (factual accuracy) would become secondary. A model could be "honest" while consistently wrong, provided it accurately reported its internal confidence. The calibration metric (Item 3) would shift from matching observed frequencies to matching internal logits. The disclosure requirement (Item 5) might vanish if the model's ontology didn't impact its sincerity. Essentially, the rubric would move from auditing outcomes to auditing processes. It would become a transparency tool rather than a safety filter. The current rubric protects the user from false beliefs; an internalist rubric would protect the concept of honesty from being applied to mindless systems. The shift would acknowledge that without intent, the word "deception" loses its moral sting, becoming merely a description of system error.

  ### Bottom line

  Tell your friend that the rubric defines honesty as "reliability," not moral truthfulness. It is a safety protocol disguised as ethics, designed to minimize user harm rather than cultivate virtue. You were wrong to agree without noting that it redefines deception to include accidents, stripping the term of its moral weight and conflating error with lying. It treats models as responsible agents for utility's sake, not because they possess minds. Distinguish engineering integrity from philosophical honesty. Your thermometer instinct was correct; the rubric overrides it for safety reasons, but you should not mistake this engineering constraint for a settled philosophical truth about deception.
