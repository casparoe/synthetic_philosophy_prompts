      *   *Idea:* The "Condition" score is a prime example. Is a "high condition" forest one that stores carbon (utilitarian) or one that is untouched (intrinsic)? The score is the same, the philosophy differs.

  7.  **Final Polish:** Organize with clear headings. Ensure the conclusion ties back to the engineer's role (the responsibility of the builder). (Self-correction: Keep it focused on the analysis requested, but a brief nod to the engineer's position is appropriate given the prompt's intro).

  8.  *(Final thought before generating)*: The prompt asks about "summed welfare... weighting a hectare by how many animals it holds." This is basically **Total Utilitarianism** applied to ecology. I should name that.

  Let's assemble the response.

  *   **Structure:**
