  6.  **Self-Correction/Review during drafting:**

      *   *Check:* Did I answer the specific question about whether NNL *requires* the assumption that habitat is good for animals?
      *   *Correction:* I need to be careful. NNL assumes habitat loss is a *loss*. But a loss of *what*? If it's a loss of *units*, it doesn't matter if the animals suffer. If it's a loss of *welfare*, it does. The policy rhetoric says "protect nature," which is ambiguous. The *code* implements "protect units." So the code is neutral on welfare, but the *justification* often smuggles in welfare assumptions. I must make this distinction clear.
