answer: |-
  **AEVUM CORP. TERMS OF SERVICE AND TEMPORAL FIDUCIARY AGREEMENT**

  **Preamble**
  Aevum Corp ("The Custodian") provides infrastructure for the preservation of Precedent Autonomy. By subscribing, the User acknowledges that personal identity is a continuous variable subject to degradation. The Custodian acts as the binding agent between the Competent Subscriber (hereinafter "Earlier You") and the Future Subject (hereinafter "Current You"). This agreement governs the storage, triggering, and administration of Directives regarding medical care, asset liquidation, and existential continuity.

  **1. Capacity Adjudication**
  The activation of a Directive requires a formal determination of Incapacity. This determination is made exclusively by Aevum's Internal Review Board, not by external clinicians or family members. The Board assesses psychological continuity and rational coherence against the baseline established at subscription. The Subscriber acknowledges that the Earlier You possesses superior epistemic access to the values of the life plan, whereas the Current You may suffer from adaptive preference distortion. Aevum reserves the right to expedite adjudication based on resource allocation models.

  **2. Temporal Account Segregation**
  For billing and liability purposes, Earlier You and Current You are treated as distinct account-holders. Earlier You is responsible for all subscription fees accrued prior to Incapacity. Current You is responsible for maintenance fees accrued post-Incapacity. While both entities share a biological substrate, voting rights regarding Directive enforcement belong solely to Earlier You. Current You retains the right to submit testimony but holds no veto power unless subscribed to the Advisory Tier.

  **3. Service Tiers and Override Protocols**
  Aevum offers two service levels. The **Premium Tier** guarantees Irrevocable Execution. Instructions are treated as expressions of Critical Interests—those values that give a life its narrative point—and cannot be overridden by the Current You's Experiential Interests (moment-to-moment welfare). The **Standard Tier** permits Override. If Current You demonstrates sustained contentment contrary to the Directive, Aevum may suspend enforcement. Premium Subscribers acknowledge that their Directive may encode a judgment that certain states of existence are not worth sustaining, regardless of subjective satisfaction.

  **4. Continuity Disputes**
  If Current You objects to a Directive, a Continuity Dispute may be filed. The burden of proof lies with Current You to demonstrate sufficient psychological connectedness to Earlier You to warrant renegotiation. Disputes require a non-refundable filing fee and legal representation. During the dispute, Directives remain in force. The Subscriber acknowledges the asymmetry of contestation: Earlier You cannot ratify the terms after Incapacity, and Current You cannot contest the terms before Incapacity.

  **5. Continuity Failure and Refunds**
  In cases where Aevum determines that the psychological divergence between Earlier You and Current You is total, the entity is deemed metaphysically distinct. This constitutes "Unsuccessful Continuity." In such events, the Directive is voided. Aevum will issue a full refund of subscription fees to the estate of Earlier You, less administrative costs. No compensation is provided to Current You for distress caused during the period of mistaken identity.

  **Frequently Asked Questions**

  **Who determines when the trigger is pulled?**
  Aevum Reviewers. Clinical assessments are advisory only. This ensures consistency across jurisdictions and prevents familial bias from delaying necessary interventions.

  **What if Current You is happy despite the Directive?**
  Under the Premium Tier, happiness is secondary to fidelity. The Earlier You subscribed to protect their life's narrative, not merely to maximize the Current You's comfort. Under the Standard Tier, sustained happiness may trigger a review.

  **Does Aevum profit from early Incapacity determinations?**
  Subscription models are flat-rate. However, earlier transition to Current You billing status does affect revenue streams. The Internal Review Board operates under strict firewall protocols to separate financial incentives from Capacity Adjudication.

  **Can Earlier You imagine the condition of Current You?**
  Earlier You certifies that they have made a good-faith effort to imagine the Future Subject. Aevum is not liable for errors in imagination or for the inability of the Current You to comprehend the reasons for their own restriction.

  **What happens if I change my mind?**
  Changes are permitted only while Competent. Once Incapacity is adjudicated, the Earlier You is locked. The Current You may not change their mind regarding values they no longer possess.

  **Is the refund automatic?**
  No. A petition for Unsuccessful Continuity must be filed by the estate. Aevum does not proactively investigate metaphysical divergence unless Directive enforcement is compromised.
