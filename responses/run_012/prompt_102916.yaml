answer: |-
  You have identified a real and pervasive maneuver, and your intuition that the standard reassurances (the "additive constant" argument) are being used to shield a rhetorical bait-and-switch is correct.

  There is no single, canonical name for this specific package in the literature, though it sits at the intersection of several known concepts. It is technically an exploitation of **Reference Machine Dependence** (from Kolmogorov complexity), philosophically a generalization of the **Grue** problem (predicate choice), and rhetorically a specific species of **Motte-and-Bailey**.

  However, because you asked for a carving that distinguishes this specific *rhetorical move* from the underlying technical facts, I propose we coin the term:

  ### **Ontological Smuggling**
  *(Also: The Privileged Primitive Fallacy)*

  Here is the diagnosis of why existing terms don't quite fit, followed by the definition and boundary cases for this new term.

  ### Why the existing labels don't quite fit

  1.  **It is not just "Grue."**
      Goodman's *Grue* problem is specifically about *temporal projection* (will the emerald remain green?). Your example is about *ontological carving* at a single time slice (is this event an "intention" or a "coincidence"?). Grue shows that induction requires entrenched predicates; Ontological Smuggling shows that people *fight* to establish which predicates count as entrenched by hiding them inside simplicity claims.

  2.  **It is not just "Reference Machine Dependence."**
      The fact that Kolmogorov complexity depends on the choice of universal Turing machine (the "additive constant") is a technical feature, not a fallacy. The fallacy occurs when an arguer treats the output of *their* preferred machine as objective evidence, but treats the machine itself as a subjective preference when challenged. The technical fact is the weapon; Ontological Smuggling is the hand that wields it.

  3.  **It is a specific Motte-and-Bailey.**
      Structurally, this is a Motte-and-Bailey argument.
      *   **The Bailey (Offensive):** "My explanation is simpler, therefore it is more likely to be true." (Implies objective, language-independent simplicity).
      *   **The Motte (Defensive):** "Of course, simplicity is relative to a description language; I'm not claiming a God's-eye view." (Retreats to language-relative simplicity).
      *   **The Smuggling:** The arguer retains the *persuasive force* of the Bailey while occupying the *defensible ground* of the Motte.
      Calling it merely a "Motte-and-Bailey" misses the specific *content* (simplicity/vocabulary) which makes it so hard to pin down in rationalist discourse.

  ### Definition: Ontological Smuggling

  **Ontological Smuggling** occurs when an arguer attempts to win a probabilistic comparison by relying on a simplicity metric that is secretly loaded with a specific ontological vocabulary, and then defends the metric by appealing to the relativity of simplicity when the vocabulary is challenged.

  **The Three-Step Pattern:**
  1.  **The Claim:** Argument A is preferred to Argument B because A is "simpler" (implying this simplicity tracks reality).
  2.  **The Switch:** When asked to formalize the simplicity, it is revealed that A is only simpler if one accepts specific primitives (e.g., "agency," "social constructs," "physical particles") as atomic.
  3.  **The Retreat:** When the primitives are challenged, the arguer claims that *all* primitives are arbitrary, so their choice is valid, yet they continue to treat the resulting simplicity ranking as evidence for truth.

  ### Boundary Cases

  To help you recognize the real thing, here are cases that **count** as Ontological Smuggling, and look-alikes that **do not**.

  #### **Cases that COUNT (The Real Thing)**

  *   **The Conspiracy Theorist vs. The Skeptic:**
      *   *Theorist:* "It's simpler to assume the event was planned (one intention) than that it was a coincidence (a million random variables)."
      *   *Skeptic:* "Intentions are complex mental states. Base rates are simpler primitives."
      *   *Theorist:* "Well, you can't prove intentions aren't basic. Simplicity is subjective anyway."
      *   *Verdict:* **Ontological Smuggling.** The theorist smuggles "agency" in as a primitive to get a short description length, then hides behind subjectivity when asked to justify why agency is primitive.
  *   **The Social Constructivist vs. The Biological Essentialist:**
      *   *Constructivist:* "Gender is simpler as a single social variable than as a complex biological cluster."
      *   *Essentialist:* "Biology is simpler as chromosomal count than as a shifting social narrative."
      *   *Move:* Either side claiming their view is "more parsimonious" without acknowledging that parsimony depends entirely on whether you treat *social coherence* or *physical material* as the currency of complexity.
      *   *Verdict:* **Ontological Smuggling.**

  #### **Cases that DO NOT COUNT (Innocuous Look-alikes)**

  *   **Admitting the Prior:**
      *   *Arguer:* "My model is simpler *if* you assume intentions are real. I know that's a heavy prior, and I'm willing to argue for that prior separately."
      *   *Verdict:* **Honest.** They are not smuggling; they are stating their ontology explicitly. They are not using the "simplicity is relative" shrug to deflect criticism of the prior.
  *   **Predictive Compression (MDL):**
      *   *Arguer:* "Using vocabulary set X, my model compresses the past data better and predicts future data better than vocabulary set Y."
      *   *Verdict:* **Legitimate Science.** If the vocabulary choice is justified by *predictive success* on held-out data, rather than just descriptive brevity on known data, the "additive constant" matters less. The market of predictions punishes bad vocabularies over time.
  *   **Mathematical Invariance:**
      *   *Arguer:* "This law holds regardless of the coordinate system used."
      *   *Verdict:* **Objective.** This is the opposite of smuggling; this is explicitly checking for language-independence.

  ### Why the "Additive Constant" Reassurance Fails Here

  You correctly noted that the standard rationalist reassurance ("any two universal languages differ by only a constant") is unhelpful here.

  In human discourse, we are not comparing infinite strings on a Turing machine. We are comparing finite, high-level explanations. In the finite regime, the "constant" is not a negligible overhead; **the constant is the entire argument.**

  If I treat "God" as a primitive, "God did it" is 1 bit. If I treat "God" as a complex hypothesis requiring a universe to support a mind, "God did it" is gigabytes. The difference isn't a constant offset; it's a difference in the *graph of dependencies*. When someone uses the "additive constant" argument to defend Ontological Smuggling, they are misapplying an asymptotic theorem to a finite, high-stakes vocabulary dispute.

  ### Summary

  If you need to label this in conversation, **"Ontological Smuggling"** is the precise term for hiding the vocabulary choice. If you need to describe the rhetorical structure, it is a **"Simplicity Motte-and-Bailey."**

  The tell-tale sign is the **Shrug**: the moment they treat simplicity as objective when it favors them, and subjective when it doesn't. That is the moment the smuggling is caught in the headlights.
