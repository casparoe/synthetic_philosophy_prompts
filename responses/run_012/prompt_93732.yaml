prompt: |-
  hey — I'm a junior taking a public history seminar and a philosophy of social science class, and I volunteer at my town's little historical society (four retirees and me in a church basement). We just got about thirty boxes from the family that ran the shoe factory that shut down in the 70s: ledgers, photos, minutes, and their personal letters. We also got six boxes from a tenants' association that lost its building in the 90s — mostly rent receipts, sign-in sheets, church bulletins, snapshots of people at picnics. Storage is tight. The board wants to keep "the real history" (the ledgers, the founding papers, the photos of the mill) and toss or turn away the rest. The family will pay for storage but wants the letters sealed for 50 years and wants to approve anything we write describing the business.

  I cant defend why the boring boxes matter, but something feels off about dumping them. And I noticed that in the ledgers the workers only ever show up as wage lines and firings, so if we keep just the "important" stuff they exist in the record only the way the company saw them. One board member keeps saying an archive should be neutral — you take what people give you, you don't play favorites, you don't editorialize. Is he right? How should I actually be deciding what to keep, and what should I say about the family's conditions? Please don't just hand me a reading list, I want the reasoning. Think of yourself as an expert on archives and historical knowledge, brainstorm what's actually at stake here before you advise me, and then give me your honest take. American English, please.
