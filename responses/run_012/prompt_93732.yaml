      *   *Key Concept:* "Donor Privilege vs. Public Trust."
      *   *Specifics:* The tenant boxes aren't "boring"; they are evidence of social networks. The ledgers aren't "truth"; they are one perspective.
      *   *The Family Conditions:* 50-year seal is long but manageable. Approval rights on descriptions? That's censorship. Need to push back.
      *   *The Board:* They care about preservation and money. Frame the argument around risk and mission, not just "fairness."

  6.  **Refining the Argument on Neutrality:**
      *   The board member says "take what people give you." But they *aren't* taking what people give them (they are rejecting the tenants). So they are already playing favorites.
      *   Archives shape the future's understanding of the past. If you only keep the boss's papers, the future thinks the boss was the only actor.

