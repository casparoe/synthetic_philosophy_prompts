answer: |-
  You have spotted something genuinely sophisticated here. For a Year 12 essay, this is an excellent observation because it cuts through the surface-level debate and attacks the structural foundation of the "treatment vs. enhancement" distinction.

  To answer your question directly: there is no single, universally agreed-upon proper noun (like "Gresham's Law") for this specific phenomenon. However, in the philosophy of medicine and bioethics, it is most rigorously discussed under the critique of **Christopher Boorse's Biostatistical Theory (BST)**.

  If you need a label to put in your essay, the most accurate existing term is **"The Shifting Baseline Problem"** (borrowed from ecology but widely applied in bioethics) or, more technically, **"The Instability of the Reference Class"**.

  If you wish to coin a precise term for your essay (which examiners often reward if defined well), you might call it **"Statistical Drift"** or **"The Normative Inertia of the Average"**.

  Here is the "carving" you asked for—exactly what this concept is, what it isn't, and how to wield it.

  ### 1. The Philosophical Home: Boorse and the Biostatistical Theory
  To ground your essay, you should reference **Christopher Boorse**. In the 1970s, he proposed the **Biostatistical Theory of Health**. He argued that health is simply "statistical normality of function."
  *   **Health:** Functioning within the average range for your species/age/sex.
  *   **Disease:** Functioning below that average.
  *   **Treatment:** Restoring you to the average.
  *   **Enhancement:** Pushing you above the average.

  Your observation is the standard, devastating critique of Boorse. If "normal" is just a statistical average, and technology allows us to change that average, then the definition of "disease" changes without the biology changing.

  ### 2. The Name: "The Shifting Baseline Problem"
  While ecologists use this to describe how each generation accepts a degraded environment as "normal," bioethicists use it to describe exactly what you noticed: the goalpost moves.

  *   **What it is:** A logical instability where a normative definition (what counts as "treatment") relies on a descriptive statistic (the average), which is itself mutable by the intervention being judged.
  *   **The Mechanism:**
      1.  We define "disorder" as "deviation from the mean."
      2.  We introduce an intervention (e.g., Ritalin).
      3.  If adoption becomes widespread, the "mean" performance shifts.
      4.  Those who *don't* take the intervention are now below the new mean.
      5.  Therefore, not taking the pill becomes the "disorder," and taking it becomes "treatment."
  *   **The Consequence:** The moral distinction between "curing" and "enhancing" evaporates because the baseline is fluid.

  ### 3. The Carving: What It Is and What It Isn't
  You specifically asked to distinguish this from the Naturalistic Fallacy and Social Constructionism. Here is how you draw those boundaries in your essay:

  **It IS NOT the Naturalistic Fallacy.**
  *   *The Naturalistic Fallacy* argues you cannot derive an *ought* (value) from an *is* (fact).
  *   *Your Point:* You are not saying we *shouldn't* derive values from facts. You are saying that the *fact* they are deriving the value from (the average) is unstable. It is a problem of **definitional coherence**, not just moral derivation. The definition eats its own tail.

  **It IS NOT Social Constructionism.**
  *   *Social Constructionism* argues that "disorder" is entirely made up by society (e.g., "drapetomania" was a fake disease for slaves running away).
  *   *Your Point:* You are acknowledging the biology might be real (short-sightedness exists), but the *classification* of that biology as a "condition requiring treatment" depends on a moving statistical target. It is a **structural problem with classification**, not a claim that the biology is fake.

  **It IS "Reference Class Instability".**
  *   This is the technical term. A "reference class" is the group you compare someone to (e.g., "17-year-old males"). If the intervention changes the reference class's performance, the classification breaks.

  ### 4. Applying it to Your Examples (ADHD and Exams)
  This is where you score marks for application.

  **ADHD Medication:**
  *   *Current Baseline:* Most students focus for X minutes. ADHD students focus for X-minus-10. Medication restores them to X. This is "treatment."
  *   *Shifted Baseline:* Suppose 90% of students take the medication. The new average focus is X-plus-10.
  *   *The Drift:* The unmedicated ADHD student is now far below the new average. But also, the *medicated* student is now just "normal." If a new drug comes along that pushes to X-plus-20, the previous medication is now merely "treatment," and the new one is "enhancement."
  *   *The Problem:* At what point did the first drug stop being "treatment" and start being "essential infrastructure"? The definition drifted, but the moral urgency ("you must fix this deficit") remained.

  **Exam Performance:**
  *   If everyone takes a cognitive enhancer, the exam curve adjusts. The "normal" grade requires the drug.
  *   Refusing the drug is no longer a moral choice; it is now a "disadvantage" akin to a disability.
  *   The "treatment" (taking the drug to be normal) has become mandatory, not because the biology changed, but because the **statistical baseline drifted**.

  ### 5. How to Phrase This in Your Essay
  Since there is no single "Law of X," you have the freedom to define your term. I suggest using **"The Shifting Baseline of Normality"**.

  Here is a sample paragraph structure in British English:

  > "A critical flaw in the treatment-enhancement distinction is what might be termed **the shifting baseline of normality**. Proponents of the distinction rely on a biostatistical definition of health, where 'treatment' restores species-typical function and 'enhancement' exceeds it. However, as Julian Savulescu and others have noted, if an intervention becomes widespread, the 'species-typical function' itself shifts. Consequently, the definition of 'treatment' drifts to accommodate the new average. This is not merely the Naturalistic Fallacy, as the issue is not deriving value from fact, but rather that the factual baseline is mutable. It creates a scenario where the moral obligation to 'treat' remains static, whilst the biological definition of the condition moves to encompass the entire population. In the context of cognitive enhancers, this suggests that the line between therapy and enhancement is not a fixed moral boundary, but a temporary statistical snapshot."

  ### Summary for Your Notes
  *   **Best Label:** The Shifting Baseline Problem (or Reference Class Instability).
  *   **Key Philosopher:** Christopher Boorse (whose theory you are critiquing).
  *   **Key Distinction:** It is a logical instability in definition, not just a moral error.
  *   **British English Check:** Ensure you spell "labelled", "programme", "centre", "defence", and "analyse" with an 's'. Use "whilst" instead of "while" for a more formal tone.

  This is a strong line of argument. It shows you aren't just repeating the standard "is it fair?" points, but analysing the logical machinery underneath. Good luck with the essay.
