      *   **Key Constraints:** Distinct mechanisms, concrete examples, no repetition of examples.

  3.  **Brainstorming a Full-Credit Answer (The Rubric):**
      *   *Source Material:* The standard taxonomy in AI safety (often attributed to Manheim & Garrabrant, "Categorizing Variants of Goodhart's Law", 2018).
      *   *Mechanisms:* There are four standard variants:
          1.  **Regressional Goodhart:** Selection effect/noise. $X = U + \epsilon$. Selecting for high $X$ selects for high $\epsilon$.
          2.  **Extremal Goodhart:** Distributional shift/phase change. Correlation holds in normal range, breaks at extremes.
          3.  **Causal Goodhart:** Intervening on the proxy doesn't cause the goal. $X \leftarrow Z \rightarrow U$ vs $X \rightarrow U$.
          4.  **Adversarial Goodhart:** Agent optimization against the metric.
      *   *Requirements for Full Credit:*
          *   Correctly name at least 3.
          *   Correctly explain the *mechanism* (the "why" it fails), not just the outcome.
          *   Provide distinct, concrete examples for each.
