  - A billion people at welfare 50, versus the same plus a billion people at welfare −50 (lives that are really not worth living). Obviously she says the second is worse.

  Now the new one, and I honestly can't call it. World P: a billion people at welfare 50. World Q: four billion people at welfare 20 — worth living, comfortably, but modest. Nobody in Q is the same person as anyone in P; two entirely seperate populations. Which does she say is better?

