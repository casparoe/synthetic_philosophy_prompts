answer: |-
  This is a strong pedagogical instinct. The "polite nod + immediate dismissal" is the classic killer of Eliminative Materialism (EM) in the classroom. Students treat FP (Folk Psychology) as a *datum* rather than a *theory*. Your activity forces them to use FP as a tool, then breaks the tool, making the dependency visible.

  However, your sketch has a logistical vulnerability: **Prediction requires knowledge of the outcome.** If the students don't know what the person in the vignette actually does, they are guessing, not theorizing. If they *do* know, the task is explanation, not prediction. For EM, the claim is that FP is good at *post-hoc explanation* but bad at *rigorous prediction* compared to neuroscience.

  I have refined the activity to focus on **Explanation + Prediction** where the "Prediction" is actually a **Completion** task (they must deduce the outcome based on the theory). I have also tightened the timing. 90 minutes is aggressive for four rounds; I recommend collapsing Round 2 (Phlogiston) into a 5-minute warm-up so you have enough oxygen for Round 3 (The Crunch).

  Here is the runnable lesson plan.

  ---

  # Seminar Plan: The Folk Psychology Stress Test
  **Topic:** Eliminative Materialism (Churchland)
  **Time:** 90 Minutes
  **Class Size:** 15 (5 tables of 3)
  **Goal:** To phenomenologically demonstrate the indispensability of Folk Psychology (FP) and then challenge whether that indispensability implies truth.

  ## Materials Needed
  1.  **5 Sets of Vignette Cards** (Print double-sided. Front: Scenario. Back: Outcome/Key). See *Appendix A* below.
  2.  **5 "Neuro Sheets"** (One per table). See *Appendix B* below.
  3.  **Ban List Handout** (One per student).
  4.  **Scorecards** (Simple grid for Round 1 and 3 accuracy).
  5.  **Whiteboard** for tallying slips.

  ## Timing Overview
  *   **00–10:** Intro & Rules (Framing the "Theory" claim).
  *   **10–20:** Round 1 (Baseline FP).
  *   **20–30:** Round 2 (The Phlogiston Control) – *Keep this brisk.*
  *   **30–55:** Round 3 (The Eliminativist Ban) – *The core experience.*
  *   **55–65:** Round 4 (The Neuro Twist).
  *   **65–90:** Debrief & Philosophical Mapping.

  ---

  ## The Activity Flow

  ### 1. Introduction (10 mins)
  Do not lecture on Churchland yet. Frame this as a **methodology test**.
  *   **Script:** "We are testing a hypothesis: that our everyday language about minds ('belief,' 'desire') is a theoretical framework, not a direct observation. Today, you are the framework. We are going to stress-test it."
  *   **Task:** Read the Scenario. Write two lines: (1) An explanation of why they started acting, (2) A prediction of the specific outcome. Flip the card to score yourself (1 point for match, 0 for miss).
  *   **Slip Penalty:** If you use a banned word, subtract 1 point.

  ### 2. Round 1: Baseline (10 mins)
  *   **Vocabulary:** Unlimited.
  *   **Cards:** Use *Set A (Standard FP)*.
  *   **Expected Result:** High accuracy, zero slips.
  *   **Instructor Action:** Walk around. Confirm everyone gets 100%. This establishes FP's pragmatic utility.

  ### 3. Round 2: The Phlogiston Control (10 mins)
  *   **Vocabulary:** Banned: *Phlogiston, Caloric, Vital Force, Humors, Miasma.*
  *   **Cards:** Use *Set B (Archaic Contexts)*. (e.g., "A man feels feverish..." banned: "humors").
  *   **Point:** This should be effortless. You can explain a fever without "humors."
  *   **Instructor Action:** "Notice how easy that was. Dropping a false theory costs you nothing if you have a better one. Churchland claims Round 3 will be like this. Let's test that."

  ### 4. Round 3: The Eliminativist Ban (25 mins)
  *   **Vocabulary:** **STRICT BAN.** No: *Believe, Want, Desire, Intend, Think, Know, Hope, Fear, Prefer, Decide, Remember, Expect, Understand, Mean, Feel (mental), Mind, Conscious.*
  *   **Allowed:** Physical descriptions, behavioral dispositions, environmental stimuli, neural terms (if they know them).
  *   **Cards:** Use *Set C (The Problem Cases)*. These are selected for **Akrasia, Self-Deception, and Confabulation**. FP usually papers over these; without FP, they are hard to describe.
  *   **Expected Result:** Silence, giggling, frustration, paraphrasing ("He is disposed to...").
  *   **Instructor Action:** Be the "Vocabulary Police." If a student writes "He wanted water," circle it, deduct the point, and make them rewrite. If they write "His brain sought water," call it a metaphorical slip.
  *   **Crucial Move:** If a table stalls, tell them: "Describe the muscle movements. Describe the light hitting the retina. Do not describe the *reason*."

  ### 5. Round 4: The Neuro Twist (10 mins)
  *   **Task:** Take the *Set C* cards again. You are now allowed to use the **Neuro Sheet**.
  *   **Instruction:** "Rewrite your Round 3 explanations using the terminology on this sheet. Does this increase your prediction accuracy? Or does it just sound fancier?"
  *   **Expected Result:** They will realize the Neuro Sheet is a **re-description**, not a prediction engine. It explains everything and nothing.

  ---

  ## The Debrief (25 mins)
  *Do not let them leave until you map the activity to the philosophy.*

  **1. The Theory-Theory Claim (Round 2 vs. 3)**
  *   **Ask:** "Why was Round 2 easy and Round 3 agonizing?"
  *   **Point:** If FP were just a theory like phlogiston, Round 3 should be easy. The fact that it isn't suggests FP is either (a) *true* (realist view) or (b) *constitutive* of our social reality (Hacking/looping effects).
  *   **Churchland's Reply:** He admits FP is indispensable *now*. He argues 'indispensable' $\neq$ 'true'. We couldn't navigate society without money, but money is a social construct. Churchland thinks beliefs are like money: useful fictions.

  **2. Reduction vs. Elimination (Round 4)**
  *   **Ask:** "Did the Neuro Sheet help you predict better, or just sound more scientific?"
  *   **Point:** If neuroscience just translates "belief" into "neural activation pattern," that's **Reductionism** (identity theory). If neuroscience shows there *are no* discrete activation patterns corresponding to "belief," that's **Eliminativism**.
  *   **The Trap:** The Neuro Sheet in this activity is vague. In reality, Churchland argues mature neuroscience will show FP is *radically discontinuous* with neural structure (like phlogiston to oxidation), not smooth (like heat to mean kinetic energy).

  **3. The Self-Refutation Objection (The Elephant in the Room)**
  *   **Ask:** "To argue that beliefs don't exist, don't you have to *believe* your argument is sound?"
  *   **Discussion:** This is the classic objection.
  *   **Churchland's Defense:** He argues we can replace "belief" with "neural activation vector." The *phenomenon* of arguing remains, the *ontology* changes.
  *   **Activity Link:** "In Round 3, you still communicated. You didn't stop thinking. You just lacked the *vocabulary*. Churchland says the vocabulary is the problem, not the cognition."

  **4. Simulation vs. Theory (The Hidden Premise)**
  *   **Ask:** "In Round 1, were you applying a theory, or just imagining being them?"
  *   **Point:** If you were simulating (Simulation Theory), then FP isn't a theory at all, and Eliminativism misses its target. If you were applying rules (Theory-Theory), EM has a target. The activity assumes Theory-Theory. Acknowledge this limitation.

  ---

  ## Appendix A: Vignette Cards (Print & Cut)

  **Set A (Baseline)**
  *   **Front:** *Sarah is walking down the street. It begins to rain heavily. She opens her bag and looks at an umbrella.*
  *   **Back (Outcome):** *She takes out the umbrella and opens it.*
  *   **FP Logic:** Belief (rain wets) + Desire (stay dry) -> Action.

  **Set B (Phlogiston Control)**
  *   **Front:** *A blacksmith heats a piece of iron until it glows red. He weighs it before and after.*
  *   **Back (Outcome):** *The iron weighs slightly more after heating.*
  *   **Ban:** No "phlogiston," "caloric," "humors."
  *   **Logic:** Easy to describe via oxidation/heat without archaic terms.

  **Set C (The Problem Cases - Round 3 & 4)**
  *   **Card 1 (Akrasia):** *Mark is on a strict diet. He stands in the kitchen at midnight. He opens the fridge and stares at the cake. He says aloud, 'I shouldn't eat this.'*
      *   **Back:** *He eats a slice of cake.*
      *   **FP Struggle:** How to explain "wanting" vs "believing should not" without using those words?
  *   **Card 2 (Self-Deception):** *Elena suspects her partner is cheating. She finds a receipt for a hotel. She puts it in the drawer without showing her partner.*
      *   **Back:** *She tells her friend, 'I trust him completely.'*
      *   **FP Struggle:** How to describe holding contradictory states without "belief"?
  *   **Card 3 (Confabulation):** *A patient with split-brain surgery is shown a picture of a chicken claw (left eye) and a snow scene (right eye). He points to a shovel with his left hand.*
      *   **Back:** *When asked why, he says, 'You need a shovel to clean out the chicken shed.'*
      *   **FP Struggle:** He doesn't *believe* this reason. He is generating a narrative. FP calls this "lying" or "mistake," but it's structural.

  ## Appendix B: The Neuro Sheet (Round 4)

  **NEURAL MECHANISM REFERENCE**
  *Use these terms to replace mentalistic vocabulary.*

  *   **Instead of "Want/Desire":** *Dopaminergic reward pathway activation in the ventral striatum.*
  *   **Instead of "Belief/Expectation":** *Predictive coding error minimization in the prefrontal cortex.*
  *   **Instead of "Decision":** *Threshold crossing in motor cortex integration.*
  *   **Instead of "Fear/Anxiety":** *Amygdala-mediated sympathetic nervous system arousal.*
  *   **Instead of "Memory":** *Long-term potentiation in hippocampal-cortical networks.*

  *Note: These mechanisms are always active to some degree. Context determines specific output.*

  ---

  ## Troubleshooting: What Will Go Wrong

  **1. The "Paraphrase" Cheat**
  *   **Problem:** Students write: "His brain is disposed to seek water."
  *   **Fix:** This is the most common slip. You must rule that "disposed to seek" is covert intentionality.
  *   **Script:** "That's a 'desire' in a tuxedo. Describe the *physics*. 'Leg muscles contract toward kitchen.' Keep it behaviorist."

  **2. The Round 3 Silence**
  *   **Problem:** Tables stop writing. They stare at the card.
  *   **Fix:** Set a hard timer (5 minutes per card). Force output.
  *   **Script:** "If you can't explain it, write 'Prediction Failure.' That is data! Churchland's point is that FP *fails* here, not that you are bad at the game."

  **3. The "Obvious Belief" Skeptic**
  *   **Problem:** One student refuses to play, saying "This is stupid, I obviously have beliefs."
  *   **Fix:** Validate, then bracket.
  *   **Script:** "I agree with your intuition. That intuition is the *target* of the seminar. For the next 40 minutes, I need you to pretend you are an alien anthropologist who doesn't know what a 'belief' is. Can you describe this human behavior without using their native theology?"

  **4. The Neuro Sheet is Too Vague**
  *   **Problem:** Students realize the Neuro Sheet applies to *everything* and laugh.
  *   **Fix:** Lean into this.
  *   **Debrief Point:** "Exactly. If 'dopamine' explains eating cake and eating salad, does it explain anything? This is the risk of Reductionism. Eliminativism says we need *new* categories, not just neural translations of old ones."

  **5. Time Creep**
  *   **Problem:** Round 3 eats all the time.
  *   **Fix:** Cut Round 2 (Phlogiston) to 5 minutes or skip it entirely if you are behind. Round 3 is the essential experience. Round 2 is just the setup.

  ---

  ## What This Activity Cannot Do (Be Honest About This)

  In the debrief, you must explicitly state the limitations so they don't leave thinking EM is proven.

  1.  **It assumes Theory-Theory:** The activity works best if FP is a theory we *apply*. If FP is actually *Simulation* (using our own mind to model theirs), then banning the vocabulary doesn't prove the ontology is wrong, just that language is limited.
  2.  **It can't simulate "Mature Neuroscience":** Churchland argues *future* neuroscience will replace FP. The "Neuro Sheet" is just current buzzwords. You are asking them to feel the *gap*, not prove the *solution*.
  3.  **It ignores Normativity:** FP isn't just predictive; it's normative (beliefs *ought* to be consistent). Neuroscience is descriptive. The activity shows the predictive loss, but not the loss of normative grip (reasoning, justification).
  4.  **The "Looping" Effect:** As Ian Hacking argues, calling someone a "believer" changes how they act. If we drop the vocabulary, we change the people. The activity treats humans as static objects, which they aren't.

  ## Final Instructor Note
  The success of this session depends on your willingness to be the "Vocabulary Police." If you let slips slide in Round 3, the tension dissolves. Be playful but strict. When they groan, remind them: *"That groan is the feeling of a theory reaching its limit."*
