      *   *Strengths:* The "banned vocabulary" approach is excellent for phenomenological engagement. Round 2 (phlogiston) vs. Round 3 (mentalistic) contrast is the core pedagogical move. The "neuro sheet" twist addresses the reduction vs. elimination distinction.
      *   *Weaknesses/Risks:*
          *   Round 3 might just lead to silence or cheating (paraphrasing).
          *   Scoring predictions based on "what they actually do next" is tricky unless the vignettes have fixed outcomes (like scripts).
