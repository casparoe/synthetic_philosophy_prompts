answer: |-
  You must establish that legibility is a contract with the reader based on structure and context before you ever show her that ambiguous circle-and-stem example.

  Here is the sequence to run that session, designed to dismantle her wrong ideas before they interfere with your specific example.

  ### Phase 1: Shatter the Misconceptions (15 Minutes)
  Do not draw your ambiguous shape yet. If you show it now, she will fixate on the shape itself rather than the rules governing it.

  1.  **Kill "Intent is King":** Draw a circle on a page. Tell her, "I intend this to be an lowercase 'a'." Ask her what she sees. When she says "circle" or "o," explain that **the reader's perception overrides the writer's intent.** This preps her to accept that your ambiguous shape might fail even if you "mean" it to be an 'a'.
  2.  **Kill "Outline is King":** Draw a standard single-line stick 'a' and a thick bubble 'a'. Ask her why they are the same letter despite having completely different outlines. Guide her to see that the **path of the stroke (the skeleton)** matters more than the thickness or edge detail. This preps her to look at the *connection points* of your example, not just the silhouette.

  ### Phase 2: Deploy Your Example (30 Minutes)
  Now introduce your circle-with-right-stem shape. Do not explain it; let her break it.

  1.  **Isolate the Variables:** Draw the shape three times.
      *   **Version 1:** Close the gap at the top completely. Ask her what it is. (Should be 'a').
      *   **Version 2:** Open the gap slightly. Ask her what it is. (Ambiguous).
      *   **Version 3:** Open the gap wide and flatten the bottom. Ask her what it is. (Should be 'u' or 'c').
      *   *Lesson:* The **degree of closure** dictates the identity, not the general vibe.
  2.  **Introduce Context:** This is the most critical dependency. Write the word "c_t" three times, placing a different version of your shape in the blank.
      *   Ask her which one reads "cat" and which reads "cut."
      *   *Lesson:* A letter is not an island; its neighbors define its limits. Your shape becomes an 'a' because the 'c' and 't' demand it, not because the shape is perfect.

  ### Phase 3: What to Hold Back for Later
  Do not teach her **how to intentionally break legibility for artistic effect.**
  She needs to know how to build a readable letter before she learns how to distort it for style. If you show her how to stretch the stem or twist the bowl for "flair" on day one, she will use those distortions as excuses when her letters become unreadable. Master the rule before you break it.

  ### Phase 4: What to Refuse on Day One
  Flat-out refuse to discuss **historical typeface classification (e.g., Humanist vs. Geometric sans).**
  If she asks, "Is this a Gothic 'a' or a Modern 'a'?", shut it down. That is taxonomy, not literacy. On day one, the only category that matters is "Readable" vs. "Not Readable." Historical nuances will confuse the structural fundamentals you are trying to install.

  ### Phase 5: The Final Test
  To verify the lesson landed, give her this single exercise:

  **Draw your ambiguous shape three times in a row, but force the first one to read as an 'a', the second as a 'u', and the third as a 'c', without changing the basic skeleton.**

  If she can do this by adjusting only the **gap size**, **stroke weight at the connection**, and **contextual neighbors**, she understands that the letter lives in the details, not the intent.
