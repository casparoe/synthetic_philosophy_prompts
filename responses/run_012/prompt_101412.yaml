prompt: |-
  Assume the role of an advisor to a small funding circle — six people, a pooled budget in the low seven figures, a two-year horizon — that has decided, unusually, to spend its next tranche not on a cause but on improving the machinery by which it and similar funders choose causes. This is the kind of question the macrostrategy corner of the rationalist blogosphere has circled for years without settling, and I want it treated as a genuine agenda-setting problem rather than a literature review. I am not asking for a ranked list of charities, nor for a reading list; I am asking for a defended research agenda for cause prioritization itself.

  The received heuristic is the familiar importance/tractability/neglectedness triple, usually combined multiplicatively. I want your judgment on which open questions about that machinery are most worth settling first, and why — with attention to what is upstream of what, what is tractable for a small group working with conceptual tools rather than new data, and what would actually change a funder's allocation if answered.

  To keep this from collapsing into a survey, treat the following as live disputes rather than settled critiques, and tell me which are load-bearing and which are red herrings:

  - Importance appears to conflate the magnitude of a problem with its moral weight, and the latter is worldview-dependent; so the axis may not even be well-defined for a funder aggregating across disagreeing moral views.
  - Tractability is normally judged by pointing to a known intervention — precisely what is absent for a neglected cause — so tractability and neglectedness may be anti-correlated by construction rather than by fact.
  - Neglectedness tracks counterfactual impact only under diminishing returns. In domains with increasing returns or public-goods infrastructure, crowding and low neglectedness can be a sign of health rather than of low value.
  - The three axes are treated as independent and multiplied, yet real interventions trade them off against one another.

  Then, if you think a better primitive exists — for instance replacing neglectedness with something like the elasticity of an outcome with respect to additional resources, or adding an option-value or reversibility axis — say so and defend it.

  End by naming the two or three questions you would fund first, the order, the criteria you used to set that order, and the observations over the next two years that would move them up or down the list.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Advisor to a small funding circle (6 people, low 7-figures, 2-year horizon).
      *   **Mission:** Spend the tranche *not* on a cause, but on improving the *machinery* of cause prioritization (meta-cause prioritization).
      *   **Tone/Style:** Agenda-setting, not literature review. Treat disputes as live. Distinguish load-bearing issues from red herrings. Defend judgments.
      *   **Specific Critiques to Address:**
          1.  Importance (magnitude vs. moral weight/worldview dependence).
          2.  Tractability (known intervention bias vs. neglected causes).
          3.  Neglectedness (diminishing vs. increasing returns/public goods).
          4.  Independence (multiplication vs. trade-offs).
      *   **Task:** Propose better primitives if applicable.
      *   **Deliverable:** Name 2-3 specific research questions to fund first, ordered, with criteria and observation triggers for reprioritization.

  2.  **Deconstruct the Context:**
      *   **Constraints:** Low seven figures (say $1M-$3M), 6 people, 2 years. This is *tiny* for foundational research. We can't build a new economic model from scratch or run massive RCTs. We need conceptual leverage. We need "conceptual tools rather than new data."
      *   **Goal:** Change a funder's allocation. If the research doesn't change where money goes, it's useless.
      *   **The "Machinery":** The ITN (Importance, Tractability, Neglectedness) framework is the standard. The prompt asks to critique and potentially replace/refine it.

  3.  **Evaluate the Four Critiques (Load-bearing vs. Red Herring):**

      *   *Critique 1: Importance (Magnitude vs. Moral Weight).*
          *   *Analysis:* This is a deep philosophical rabbit hole (population ethics, sentience, etc.). For a 2-year, small-budget project, trying to solve moral realism is a trap. However, *operationalizing* disagreement is crucial. If funders disagree on weights, multiplying by a single "importance" number is misleading.
          *   *Verdict:* Load-bearing, but the solution isn't solving ethics, it's modeling uncertainty/disagreement.
          *   *Status:* **Load-bearing.**

      *   *Critique 2: Tractability (Known Intervention Bias).*
          *   *Analysis:* ITN often favors "shovel-ready" projects. Neglected causes lack data, making tractability look low. This creates a conservatism bias.
          *   *Verdict:* **Load-bearing.** This is the biggest barrier to funding novel causes.
      *   *Critique 3: Neglectedness (Diminishing vs. Increasing Returns).*
          *   *Analysis:* Standard ITN assumes diminishing returns (more money = less marginal value). But infrastructure/network effects have increasing returns. Ignoring this leads to underfunding public goods or coordination problems.
          *   *Verdict:* **Load-bearing.** It fundamentally changes the shape of the funding curve.
      *   *Critique 4: Independence (Multiplication vs. Trade-offs).*
          *   *Analysis:* ITN treats them as orthogonal. They aren't. Solving a problem often makes it less neglected. High importance often attracts funding (lowering neglectedness).
          *   *Verdict:* **Red Herring (mostly).** While technically dependent, the multiplicative heuristic works well enough *if* the inputs are calibrated. Fixing the definitions of the inputs matters more than fixing the math of combining them.

  4.  **Develop Better Primitives:**
      *   *Neglectedness -> Marginal Value of Resources (Elasticity).* "Neglectedness" is a stock measure. We need a flow measure. How much does $X improve Outcome Y? This captures the returns-to-scale issue (Critique 3).
      *   *Tractability -> Epistemic Confidence/Intervention Clarity.* Instead of "can we solve it?", ask "do we know *how* to solve it, and how sure are we?" This addresses Critique 2.
      *   *Importance -> Robustness Across Worldviews.* Instead of a single number, use a distribution or a "minimum viable moral weight." This addresses Critique 1.

  5.  **Formulate the Research Agenda (The "Meat"):**
      *   *Constraint Check:* Must be doable by 6 people with ~$2M in 2 years. No massive data collection. Mostly conceptual modeling, case studies, and framework testing.
      *   *Goal:* Change allocation decisions.

      *   *Idea 1: The "Returns-to-Scale" Catalog.*
          *   Focus on Critique 3. Map causes to return curves (linear, diminishing, increasing).
          *   *Why:* Directly impacts whether we fund marginal vs. infrastructure projects.
          *   *Feasibility:* High. Conceptual work + expert interviews.

      *   *Idea 2: The "Tractability under Uncertainty" Protocol.*
          *   Focus on Critique 2. How to score tractability when no intervention exists yet? (e.g., basic research vs. policy).
          *   *Why:* Unlocks neglected causes that look "intractable" only because they lack a named intervention.
          *   *Feasibility:* Medium. Requires developing a scoring rubric.

      *   *Idea 3: Moral Weight Sensitivity Analysis.*
          *   Focus on Critique 1. Don't solve ethics; build a tool that shows how allocations shift under different moral weights (e.g., present vs. future generations, humans vs. animals).
          *   *Why:* Prevents false precision.
          *   *Feasibility:* High. Spreadsheet modeling.

  6.  **Select and Order the Top 2-3 Questions:**
      *   *Selection Criteria:* Leverage (how much does it change decisions?), Tractability (can we actually answer it?), Upstreamness (does it fix other problems?).
      *   *Priority 1: Returns-to-Scale (The Neglectedness Fix).* This is the most dangerous error in current ITN. Assuming diminishing returns everywhere causes massive misallocation in public goods/coordination.
      *   *Priority 2: Tractability under Uncertainty (The Novelty Fix).* This unlocks the "new cause" potential. Without this, you just fund the same old things.
      *   *Priority 3 (Optional/Backup):* Moral Weight Sensitivity.* Important, but often funders already have rough views. The structural errors in 1 & 2 are more mechanical and universal. Let's stick to 2 strong ones or bundle 3 into the methodology of 1 & 2. Let's pick 2 distinct, high-leverage questions.

      *   *Refinement:* Let's make them specific research *questions*, not just topics.
          1.  "Under what conditions does the marginal value of funding increase with scale, and how do we identify them ex-ante?" (Fixes Neglectedness/Returns).
          2.  "How do we estimate tractability for causes lacking named interventions without penalizing them for uncertainty?" (Fixes Tractability/Novelty).

      *   *Wait, I need to address the "Independence" critique too.* Maybe I should combine the primitives into a new framework proposal as the output of Q1.
      *   *Actually, the prompt asks for "questions you would fund first".*
      *   *Let's go with:*
          1.  **The Shape of Impact:** Characterizing return-on-investment curves across cause areas (addressing Neglectedness/Returns).
          2.  **The Epistemics of Intervention:** Scoring tractability when the intervention is "discover research" rather than "distribute bednets" (addressing Tractability/Novelty).

      *   *Wait, is "Importance" worth funding?* The prompt says Importance conflates magnitude and moral weight. A small group can't solve moral philosophy. But they *can* build a "Robustness Checker." Is that better than fixing the broken mechanics of Neglectedness/Tractability?
      *   *Decision:* Fixing the mechanics (N & T) yields higher immediate ROI for allocation than debating ethics. Ethics is a multiplier; if N & T are wrong, the multiplier doesn't matter. If N & T are right, the multiplier just shifts weights. I will prioritize the structural mechanics.

  7.  **Drafting the Response:**
      *   *Tone:* Professional, direct, strategic, slightly skeptical of academic bloat.
      *   *Structure:*
          1.  Executive Summary (The Stance).
          2.  Critique Analysis (Load-bearing vs. Red Herring).
          3.  Proposed Primitives (The Upgrade).
          4.  The Funded Agenda (The 2 Questions).
          5.  Monitoring/Triggers.

      *   *Refining the "Primitives":*
          *   Replace Neglectedness with **Marginal Value Function (MVF)**.
          *   Replace Tractability with **Intervention Readiness Level (IRL)**.
          *   Keep Importance but decouple Magnitude from Moral Weight.

      *   *Refining the Funded Questions:*
          1.  *Question 1:* **Taxonomy of Returns.** Can we classify cause areas by their production functions (linear, S-curve, step-function)?
          2.  *Question 2:* **Valuing Discovery.** How do we price "finding the intervention" vs. "executing the intervention"?

      *   *Wait, one more check on constraints:* Low seven figures. 2 years. 6 people.
      *   This budget allows for hiring 2-3 senior researchers and running workshops. It does *not* allow for primary data collection on global poverty. It must be meta-analytic or conceptual.
      *   The "Observations" need to be concrete. E.g., "If we find that 80% of high-impact causes are S-curve, we shift strategy."

  8.  **Final Polish:**
      *   Ensure I explicitly answer the "load-bearing vs. red herring" prompt.
      *   Ensure I defend the new primitives.
      *   Ensure the ending is specific (2-3 questions, order, criteria, triggers).

      *(Self-Correction during drafting)*: I initially thought about suggesting a new framework name. Better to focus on the *components*. The prompt asks for a "defended research agenda." I need to be careful not to just say "ITN is bad" but "Here is how we fix the specific broken gears."
      *   On Critique 4 (Independence): I will argue this is a red herring *if* we redefine the inputs correctly. If Neglectedness becomes "Marginal Value," the dependency is baked into the definition, so the multiplication becomes valid again.
      *   On Critique 1 (Importance): I will argue this is load-bearing but *not* for this budget. We treat moral weight as a sensitivity parameter, not a research target.

      *   *Final Plan:*
          1.  Assess the 4 critiques.
          2.  Propose "Marginal Value" and "Intervention Readiness" as replacements.
          3.  Fund: (1) Mapping Return Curves, (2) Pricing Epistemic Labor.
          4.  Define success metrics.

  9.  **Writing the Response.** (Proceeding to generate output based on these thoughts).
answer: |-
  ### Executive Summary

  You have $1–3M, six people, and two years. You cannot solve moral philosophy, nor can you generate new empirical data on global development outcomes. Your comparative advantage is **conceptual leverage**. You must build tools that change how the other 99% of effective altruists calculate expected value.

  The standard Importance/Tractability/Neglectedness (ITN) framework is not broken enough to discard, but it is calibrated poorly enough to cause systematic misallocation. Specifically, it biases funders toward linear, shovel-ready projects in morally uncontroversial domains, while systematically underpricing public goods, coordination problems, and foundational research.

  My advice is to treat **Neglectedness** and **Tractability** as the primary failure points. **Importance** is a philosophical quagmire you cannot solve in two years; treat it as a variable, not a constant.

  Below is the assessment of the disputes, the proposed primitive upgrades, and the specific research agenda.

  ---

  ### Part I: Load-Bearing vs. Red Herrings

  You presented four critiques of the ITN machinery. Here is my judgment on their status for a small, conceptual research team.

  **1. Importance (Magnitude vs. Moral Weight)**
  *   **Verdict:** **Load-Bearing, but Out of Scope.**
  *   **Reasoning:** You are correct that "Importance" smuggles in worldview-dependent moral weights (e.g., animal sentience vs. human welfare vs. existential risk). However, a six-person team cannot resolve population ethics or moral realism in two years. Attempting to do so is a resource trap.
  *   **Strategy:** Do not research *what* the weights should be. Research *how sensitive* allocations are to those weights. Build a "Robustness Checker" that shows how rankings shift when moral weights vary. This turns a philosophical blockage into a sensitivity parameter.

  **2. Tractability (Known Intervention Bias)**
  *   **Verdict:** **Load-Bearing.**
  *   **Reasoning:** This is the strongest conservatism bias in the current machinery. ITN rewards causes where the intervention is already named (e.g., "distribute bednets") and penalizes causes where the intervention is "figure out what to do" (e.g., "AI alignment theory"). This systematically defunds innovation.
  *   **Strategy:** We need a primitive that distinguishes between *execution tractability* and *discovery tractability*.

  **3. Neglectedness (Diminishing vs. Increasing Returns)**
  *   **Verdict:** **Load-Bearing.**
  *   **Reasoning:** Standard ITN assumes diminishing returns (the more money poured in, the less the next dollar does). This is true for direct services but false for public goods, infrastructure, and threshold problems (e.g., passing a policy bill, building a safety standard). Assuming diminishing returns in increasing-returns domains causes funders to arrive too late or spread resources too thinly.
  *   **Strategy:** Replace "Neglectedness" (a stock measure) with "Marginal Value Function" (a flow measure).

  **4. Independence (Multiplication vs. Trade-offs)**
  *   **Verdict:** **Red Herring.**
  *   **Reasoning:** Critics argue you can't multiply the axes because they are correlated (e.g., high importance attracts funding, lowering neglectedness). This is technically true but practically irrelevant *if* the inputs are defined correctly. If "Neglectedness" is properly defined as "Marginal Value of Additional Resources," the correlation is baked into the definition. The mathematical operation (multiplication) is fine; the inputs are the problem.
  *   **Strategy:** Fix the definitions, not the math.

  ---

  ### Part II: Proposed Primitives

  To fix the machinery, I recommend retiring "Neglectedness" and refining "Tractability."

  **1. Replace Neglectedness with *Marginal Value Function (MVF)***
  *   **Why:** "Neglectedness" asks "How many people are working on this?" This is a proxy for value, but a noisy one. MVF asks "What does the next $1M actually *do*?"
  *   **The Upgrade:** Categorize cause areas by their production function:
      *   *Linear:* Value scales with spend (e.g., cash transfers).
      *   *Diminishing:* Early dollars matter most (e.g., eradicating a specific disease strain).
      *   *Increasing/Threshold:* Value is low until a coordination/funding threshold is met (e.g., policy change, institutional reform).
  *   **Impact:** This prevents funders from treating a threshold problem like a linear one. It justifies "lumpy" funding rather than marginal top-ups.

  **2. Replace Tractability with *Intervention Readiness Level (IRL)***
  *   **Why:** Current tractability scores penalize uncertainty. We need to reward the *value of information*.
  *   **The Upgrade:** Adapt NASA's Technology Readiness Levels for social intervention.
      *   *IRL 1-3:* Problem defined, no known solution (Basic Research).
      *   *IRL 4-6:* Prototype intervention exists, untested at scale (Pilot).
      *   *IRL 7-9:* Proven intervention, scaling possible (Implementation).
  *   **Impact:** This allows funders to explicitly budget for "moving a cause from IRL 2 to IRL 4" as a valid outcome, rather than marking it as "intractable."

  ---

  ### Part III: The Funded Research Agenda

  Given your constraints (low seven figures, 2 years, conceptual focus), you cannot test these primitives empirically across all causes. You must build the *taxonomy* and the *scoring rubric* that others will use.

  Here are the two questions I would fund first, in order.

  #### Question 1: The Taxonomy of Returns
  **"Can we reliably classify cause areas by their Marginal Value Function (Linear, Diminishing, or Threshold) ex-ante, and what are the leading indicators?"**

  *   **Order:** First.
  *   **Criteria:** **Upstream Leverage.** If we get the return-curve wrong, the rest of the calculation is garbage. This addresses the "Neglectedness" critique directly. It is also highly tractable for a small team: it requires historical case studies and expert elicitation, not new field data.
  *   **Method:** Select 10 historical cause areas (5 successful, 5 failures). Reconstruct their funding curves vs. outcome curves. Identify indicators that signaled a "Threshold" dynamic early (e.g., presence of veto players, network effects, regulatory bottlenecks). Produce a "Returns Classifier" checklist.
  *   **Why this changes allocation:** It stops funders from applying "marginal dollar" logic to "all-or-nothing" problems. It justifies concentrated bets.

  #### Question 2: The Price of Discovery
  **"How do we calculate the Expected Value of Information (EVoI) for moving a cause from IRL 2 (Theory) to IRL 4 (Pilot), and when does this exceed the EV of direct implementation?"**

  *   **Order:** Second.
  *   **Criteria:** **Unlocking Novelty.** This addresses the "Tractability" critique. Once we know the return curve (Q1), we need to know if we can actually build the intervention. This question legitimizes funding research as a primary output, not just a cost center.
  *   **Method:** Develop a standardized EVoI model for meta-science. Test it against 3 active debates (e.g., "Should we fund AI safety theory or policy?"). The output is a calculator that allows a funder to say, "Funding this research has higher EV than funding the intervention, because it prevents wasting $100M on the wrong intervention."
  *   **Why this changes allocation:** It shifts capital from "shovel-ready" projects to "shovel-finding" projects in high-importance domains.

  *(Note: I am excluding "Importance/Moral Weight" from the funded list. With $2M, you cannot move the needle on moral realism. Instead, bake a "Worldview Sensitivity" tab into the tools generated by Q1 and Q2.)*

  ---

  ### Part IV: Monitoring and Triggers

  A two-year horizon is short. You need to know if the research is failing by Month 12 to pivot.

  **Observations that move Question 1 (Taxonomy) UP:**
  *   **Signal:** Early case studies reveal a consistent pattern of "Threshold" indicators that were ignored by funders at the time (e.g., climate policy pre-Paris, AI safety pre-2015).
  *   **Action:** Expand the project from a taxonomy to a predictive audit of current top causes.

  **Observations that move Question 1 DOWN:**
  *   **Signal:** The "Returns" of past causes are too noisy to classify; experts disagree fundamentally on whether a curve was linear or threshold ex-post.
  *   **Action:** Pivot to a simpler heuristic (e.g., binary "Public Good vs. Private Good" classification) and scrap the complex function modeling.

  **Observations that move Question 2 (Price of Discovery) UP:**
  *   **Signal:** Pilot testing the EVoI model reveals that current funding ratios for Research vs. Implementation are off by an order of magnitude (e.g., we are spending 100x too little on discovery).
  *   **Action:** Publish the calculator openly and run a workshop for other funders to adopt it.

  **Observations that move Question 2 DOWN:**
  *   **Signal:** The EVoI model requires data inputs (probability of success) that researchers cannot estimate better than random chance.
  *   **Action:** Abandon the quantitative model. Switch to a qualitative "Stage-Gate" funding framework (similar to venture capital) and fund that methodology instead.

  ### Final Advice

  Do not try to build a "Better ITN." Try to build a **Diagnostic Tool**.

  If your output is a paper arguing that ITN is flawed, you will be ignored. If your output is a spreadsheet where a funder inputs a cause area, and it outputs "Warning: This looks like a Threshold Problem, do not fund marginally," you will change behavior.

  Spend 20% of the budget on the research, 40% on the tool-building, and 40% on distribution (workshops with other funders). The machinery only improves if other people use the new gears.
