prompt: |-
  Ok so I run a small internal prediction market at work — the kind where people get play money (and a bit of real bonus) for trading on questions like "will we ship the Q3 release before Oct 1" or "will the city council approve the rezoning." There's maybe 15 to 40 of us. Lately leadership has started actually using the prices to make real calls, which terrifies me, because half the time the "price" is just three people who think they know something trading with each other.

  I want a procedure I can run, question by question, to decide whether a given market price is (a) worth acting on, (b) worth spending money to sharpen up — commission a bit of research, or pay someone to trade against it — or (c) just noise we should ignore. Ground it in what the econ and philosophy-of-markets stuff actually says about when a price carries information and when it doesn't.

  In particular I keep bumping into the no-trade idea: if everyone's rational, the only reason to trade is private info, and it's common knowledge that the market clears, then nobody trades — so any trade you actually observe has to be coming from somewhere else (noise traders, people who just disagree, liquidity needs, different risk tolerance). And the flip side of that: if the price already reflects everything, nobody bothers to dig up new info, so it can't reflect everything. I want the procedure to take both of those seriously instead of just chanting "wisdom of crowds."

  Make it ordered questions, say what a sufficient answer looks like at each step, where the procedure stops with a "don't act on this," and where it hands off to a human because it's really a values call (like how much we care about being wrong in each direction). Then run it on three of my actual questions: (1) "will the FDA approve drug X by its PDUFA date" — thin market, a couple people with friends in the industry; (2) "will we hit our own shipping date" — everyone trading is an employee staring at the same internal dashboards; (3) "who wins the mayoral race" — lots of traders, most with no real info. At least one of the three should come out in a way I wont like. And be honest at the end about what the procedure cant do.

  Please dont turn this into a reading list — I don't need cites, I need something I can paste into a doc and hand to my team.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **Context:** Small internal prediction market (15-40 people), play money + small real bonus. Leadership is starting to use prices for real decisions.
      *   **Problem:** Prices might be noise (thin trading, echo chambers) rather than signal. User is worried about the "No-Trade Theorem" (Grossman-Stiglitz paradox) and the reliability of prices in thin markets.
      *   **Goal:** A step-by-step procedure (checklist/flowchart style) to evaluate *each* market question to decide: (a) Act on it, (b) Invest in sharpening it, or (c) Ignore it.
      *   **Requirements:**
          *   Grounded in econ/philosophy of markets (specifically addressing No-Trade/Grossman-Stiglitz).
          *   Ordered questions with sufficient answers.
          *   Clear stop points ("Don't act").
          *   Handoff points for human/value judgments.
          *   Apply to three specific scenarios (FDA drug, Internal Shipping, Mayoral Race).
          *   At least one outcome must be uncomfortable/unexpected.
          *   Honest limitations section at the end.
          *   **Format:** Practical document, not a reading list.

  2.  **Theoretical Foundation (Mental Sandbox):**
      *   *No-Trade Theorem (Milgrom-Stokey):* If priors are common and agents are rational, no trade occurs. Trade implies disagreement or noise.
      *   *Grossman-Stiglitz Paradox:* If prices perfectly reveal information, no one has an incentive to gather information. Therefore, prices cannot be perfectly informative.
      *   *Key Takeaway for Procedure:* We need to look for *incentives to be informed*, *diversity of information*, and *liquidity/volume* as proxies for reliability. A price without volume is just a quote, not a market clearing price.
      *   *Key Takeaway for Thin Markets:* If only 3 people trade, do they have private info? Or are they just gambling? We need to distinguish "informed speculation" from "noise trading."

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Step 1: Liquidity/Participation.* If no one trades, the price is stale. (Stop).
      *   *Step 2: Information Diversity.* Are traders looking at the same dashboard? If yes, no new info is being aggregated. (Grossman-Stiglitz).
      *   *Step 3: Incentive Alignment.* Do traders know something leadership doesn't? Or are they guessing?
      *   *Step 4: Stability.* Is the price jumping around on zero volume?
      *   *Step 5: Value Judgment.* Even if accurate, is the cost of being wrong symmetric?

      *Refining the Steps:* Let's make it more rigorous.
      *   *Filter 1: Market Vitality.* (Volume, distinct traders).
      *   *Filter 2: Information Structure.* (Common knowledge vs. Private info).
      *   *Filter 3: The "Why Trade?" Test.* (Addressing No-Trade).
      *   *Filter 4: Decision Context.* (Risk asymmetry).

  4.  **Developing the Three Test Cases:**
      *   *Case 1: FDA Drug (Thin market, industry insiders).*
          *   *Analysis:* Low volume, but high private info potential.
          *   *Verdict:* Might be "Invest to sharpen" rather than "Act." Why? Because 2 people isn't a market. It's a tip.
      *   *Case 2: Internal Shipping (Employees, same dashboards).*
          *   *Analysis:* High participation, but *common knowledge*. This triggers Grossman-Stiglitz. If everyone sees the same JIRA board, the price adds nothing over the board.
          *   *Verdict:* **Ignore/Don't Act.** This is the "uncomfortable" one. Leadership loves these markets, but this specific one is redundant.
      *   *Case 3: Mayoral Race (Many traders, no info).*
          *   *Analysis:* High volume, diverse priors, but low private info. It's a popularity contest/polling proxy.
          *   *Verdict:* Act (as a poll), but acknowledge it's not "insider" info.

      *Wait, I need to ensure at least one outcome is "won't like."*
      *   Leadership *wants* to use the Internal Shipping market. Telling them "This is useless because everyone sees the same data" is the uncomfortable truth.
      *   Alternatively, the FDA one is risky. Relying on two insiders is dangerous.
      *   Let's make the Internal Shipping one the "Ignore" verdict. That challenges the assumption that "internal employees = better prediction."

  5.  **Refining the Procedure Text:**
      *   Needs to sound professional, actionable, and grounded.
      *   Avoid academic jargon where possible, but keep the logic.
      *   Structure: Introduction -> The Protocol -> The Test Cases -> Limitations.

  6.  **Addressing the "No-Trade" & "Grossman-Stiglitz" constraints:**
      *   I need to explicitly build checks for these into the questions.
      *   *No-Trade Check:* Why are people trading? If it's just for fun/play money, the price signal is weak.
      *   *Grossman-Stiglitz Check:* Is there a cost to acquiring the info reflected in the price? If info is free (internal dashboard), the price shouldn't premiumize it.

  7.  **Final Review against Constraints:**
      *   Ordered questions? Yes.
      *   Sufficient answers? Yes.
      *   Stop points? Yes.
      *   Handoff to human? Yes.
      *   Three cases run? Yes.
      *   One uncomfortable outcome? Yes (The Internal Shipping market).
      *   Honest limitations? Yes.
      *   No reading list? Yes.

  8.  **Drafting the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure the "Invest to sharpen" option is clear. It means subsidizing a trader or commissioning research.
      *   *Correction:* Ensure the distinction between "Play Money" and "Real Bonus" is accounted for. The bonus helps, but if it's small, risk aversion might still kill liquidity.
      *   *Tone:* Direct, slightly cautious, analytical.

  9.  **Final Polish:** Check the flow. Ensure the "Stop" conditions are bold and clear. Make sure the test cases follow the logic strictly. (Self-correction: Ensure the FDA case doesn't get a "Act" verdict too easily. Two people is too thin. It should be "Sharpen" or "Ignore". Let's go with "Sharpen" because the info *value* is high, even if market structure is weak).

      *Wait, let's re-evaluate the "Uncomfortable" outcome.*
      If I say "Ignore the Internal Shipping Market," that's uncomfortable for leadership who thinks "our team knows best."
      If I say "The FDA market is noise," that's uncomfortable for the insiders.
      Let's go with the Internal Shipping one being "Ignore." It highlights the Common Knowledge problem best.

      *Wait, one more check on the "No-Trade" logic.*
      The procedure needs to ask: "Is there a reason for informed traders to participate?" If the bonus is too small, they won't risk reputation.
      Okay, I will add a question about "Incentive Sufficiency."

      *Let's write it.*
answer: |-
  # Market Reliability Protocol (MRP-1)

  **Purpose:** To determine whether a specific prediction market price contains actionable information, requires subsidization to become reliable, or should be treated as noise.
  **Scope:** All internal markets with real-money bonus implications.
  **Underlying Logic:** Markets aggregate information only when traders have *private* information, *incentives* to reveal it, and *diversity* in their views. Prices derived from common knowledge or noise trading do not improve decision-making.

  ---

  ## Part 1: The Evaluation Procedure

  Run this checklist for every market question before leadership uses the price for resource allocation or strategic pivots.

  ### Step 1: Liquidity & Participation Check
  *Does the price reflect a consensus or a single opinion?*

  1.  **How many unique traders have executed a trade in the last 7 days?**
      *   *Sufficient Answer:* ≥ 5 distinct traders.
      *   *Insufficient Answer:* < 5 distinct traders.
  2.  **What is the total volume traded relative to the maximum possible position size?**
      *   *Sufficient Answer:* > 20% of total available capital in the market has turned over.
      *   *Insufficient Answer:* < 5% turnover (indicates stale prices).

  **🛑 STOP CONDITION:** If both answers are *Insufficient*, the price is **Noise**. Do not act. The market is too thin to distinguish private information from a single person's hunch.
  **➡️ HANDOFF:** If Liquidity is *Sufficient* but Volume is *Insufficient*, proceed to Step 2.

  ### Step 2: Information Structure Check (The Grossman-Stiglitz Test)
  *Is the information reflected in the price actually new, or is it common knowledge?*

  1.  **Do the traders have access to data that leadership does not?**
      *   *Sufficient Answer:* Yes (e.g., field sales data, lab results, private contacts).
      *   *Insufficient Answer:* No (e.g., everyone is looking at the same JIRA dashboard, public news, or internal all-hands slides).
  2.  **Is the information diverse?**
      *   *Sufficient Answer:* Traders are observing independent signals (e.g., different regions, different code modules).
      *   *Insufficient Answer:* Traders are observing the same signal (e.g., everyone watching the same burn-down chart).

  **🛑 STOP CONDITION:** If *both* answers are *Insufficient*, the market is **Redundant**. The price adds no value over the raw data everyone already sees. Do not act on the price; act on the data directly.
  **➡️ HANDOFF:** If *at least one* answer is *Sufficient*, proceed to Step 3.

  ### Step 3: The "Why Trade?" Check (The No-Trade Test)
  *Why are rational agents risking capital here?*

  1.  **Is the potential bonus large enough to overcome reputation risk?**
      *   *Sufficient Answer:* Yes. A correct prediction materially impacts their bonus or standing.
      *   *Insufficient Answer:* No. The play money aspect dominates; traders are betting for fun or to "signal" optimism without risk.
  2.  **Is there a mechanism for informed traders to correct mispricing?**
      *   *Sufficient Answer:* Yes. There are no position limits preventing a confident trader from betting big.
      *   *Insufficient Answer:* No. Position caps prevent a highly informed trader from moving the price to the "true" value.

  **🛑 STOP CONDITION:** If *both* answers are *Insufficient*, the market is **Gambling**. Prices reflect risk tolerance or fun, not information. Do not act.
  **➡️ HANDOFF:** If *at least one* answer is *Sufficient*, proceed to Step 4.

  ### Step 4: Decision Asymmetry Check (Values Handoff)
  *Even if the price is accurate, is it the right tool for this decision?*

  1.  **Is the cost of a False Positive (acting when it won't happen) roughly equal to the cost of a False Negative (not acting when it will happen)?**
      *   *Sufficient Answer:* Yes. The loss is symmetric.
      *   *Insufficient Answer:* No. One error is catastrophic; the other is merely annoying.

  **🛑 STOP CONDITION:** If *Insufficient*, **Human Review Required**. A market price is an expected value (probability × payoff). It does not account for risk aversion or catastrophic tail risk. Leadership must apply a risk premium manually; do not use the raw price.
  **✅ ACTIONABLE:** If *Sufficient*, the price is **Valid for Action**.

  ### Step 5: Subsidization Decision
  *If the market failed Step 1 or 3 but passed Step 2 (High Info Value, Low Liquidity):*

  *   **Recommendation:** Do not act yet. Instead, **Invest to Sharpen**.
  *   **Action:** Commission specific research to feed traders, or offer a temporary "bounty" (increased bonus multiplier) to attract informed traders to this specific question. Re-evaluate in 7 days.

  ---

  ## Part 2: Protocol Application (Test Cases)

  Here is the protocol applied to three current active markets.

  ### Case 1: "Will the FDA approve Drug X by its PDUFA date?"
  *   **Context:** Thin market. 3 traders. Two have friends in the industry.
  *   **Step 1 (Liquidity):** **FAIL.** Only 3 traders. Volume is low.
  *   **Step 2 (Info Structure):** **PASS.** Traders have private contacts (industry friends) that leadership does not have. Information is diverse (different contacts).
  *   **Step 3 (Why Trade?):** **FAIL.** Bonus is too small to risk reputation on insider-adjacent info. Traders are hesitant to bet big.
  *   **Step 4 (Asymmetry):** **PASS.** Regulatory binary outcome.
  *   **Verdict:** **INVEST TO SHARPEN.**
  *   **Reasoning:** The *information* is valuable (Step 2 passed), but the *market mechanism* is too weak to trust the current price (Step 1 & 3 failed). The current price is likely a guess, not a forecast.
  *   **Action:** Do not base launch plans on this price. Instead, offer a 2x bonus multiplier for this specific market to encourage the informed traders to commit capital. If volume doesn't increase in 7 days, treat as Noise.

  ### Case 2: "Will we hit our own Q3 shipping date?"
  *   **Context:** 25 traders. All are engineering/product employees. High volume.
  *   **Step 1 (Liquidity):** **PASS.** High participation, healthy volume.
  *   **Step 2 (Info Structure):** **FAIL.** All traders look at the same internal dashboards (JIRA/Linear). All attended the same sprint review. Leadership sees the same data.
  *   **Step 3 (Why Trade?):** **PASS.** Traders are incentivized to bet against the plan if they know it's slipping.
  *   **Step 4 (Asymmetry):** **PASS.**
  *   **Verdict:** **IGNORE / DO NOT ACT.**
  *   **Reasoning:** This is the uncomfortable truth. Because the information is **Common Knowledge** (Step 2 Fail), the market price adds zero information over the dashboard itself. The price is just a sentiment overlay on data you already have. If the dashboard says "At Risk," the market will price "No," but you didn't need the market to tell you that.
  *   **Action:** Do not use this price to override the project plan. If the market says "No" but the dashboard says "Green," trust the dashboard (or audit the dashboard), but do not treat the market as a superior signal. It is redundant.

  ### Case 3: "Who wins the Mayoral Race?"
  *   **Context:** 35 traders. Most have no private info. High volume.
  *   **Step 1 (Liquidity):** **PASS.** Many traders, high turnover.
  *   **Step 2 (Info Structure):** **FAIL (Mostly).** Most traders are using public polls. However, diversity of priors is high.
  *   **Step 3 (Why Trade?):** **PASS.** Traders are betting on public sentiment shifts.
  *   **Step 4 (Asymmetry):** **FAIL.**
  *   **Verdict:** **HUMAN REVIEW REQUIRED.**
  *   **Reasoning:** The market is liquid, but the cost of error is asymmetric for the company. If the company publicly backs the loser (based on market price), reputational damage is high. If the company backs the winner, gain is minimal.
  *   **Action:** The price is a valid *poll*, but not a valid *decision trigger*. Leadership must decide if the probability threshold for engagement is 51% (market says go) or 90% (risk adjusted). Do not auto-execute strategy based on >50% price.

  ---

  ## Part 3: Limitations & Honest Constraints

  This procedure cannot solve the following problems. Leadership must accept these boundaries:

  1.  **The "Small Bonus" Problem:** If the real-money bonus is trivial compared to base salary, traders will not treat this as a serious market. They will trade for fun, status, or to please a boss. No procedure can extract "truth" from "pleasing behavior." If the bonus isn't painful to lose, the price is not reliable.
  2.  **The "Common Knowledge" Trap:** As seen in Case 2, internal markets often fail because everyone works in the same building. Markets work best when aggregating *dispersed* knowledge. If your team is small (15-40 people), you likely share too much context for the market to find an edge over a standard meeting.
  3.  **Self-Fulfilling Prophecies:** If leadership acts on a market price (e.g., "Market says we will miss shipping, so we cut budget"), the action may cause the outcome to happen. The market predicted the *original* path, not the *intervention* path. Using the market to intervene invalidates the market's signal.
  4.  **Liquidity vs. Accuracy:** A liquid market can still be wrong (bubbles). This procedure filters for *structure*, not *truth*. It ensures the price is formed by informed incentives, not that the informed people are actually right.

  **Final Directive:** If a market fails two or more Steps in this protocol, leadership is prohibited from citing the market price as justification for a decision.
