      *   *Camp A:* "Identity is numerical." *Camp B:* "Identity is qualitative/experiential."

  5.  **Addressing the Cruxes (Physics & Identity):**
      *   *Crux 1: Physics.* The Poincaré Recurrence Theorem.
          *   *Agreed Bearing:* Does the theorem apply to the actual universe?
