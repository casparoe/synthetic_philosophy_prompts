  An artifact's political character is defined not by its material design in isolation, but by the persistence of its distributive effects within a specific social practice after the original governing intent has vanished. This position necessitates viewing politics as a property of the artifact-plus-practice pair, because materials only enforce power when coupled with human routines, such as commuting or zoning, rather than existing as autonomous agents. The measure of political inertia separates physical longevity from sociotechnical stubbornness; durability ensures the object remains, but inertia ensures the power dynamic remains. Robert Moses's low-hanging bridges on Long Island illustrate this distinction: the concrete is durable, but the political inertia is high because the bridges continue to prevent buses from reaching beaches decades after Moses's exclusionary intent was legally nullified and socially condemned. If the bridges merely ratified an exclusion that market forces or private clubs would have enforced anyway, their politics would be weak, but because they mechanically reproduce segregation after the legislators and planners are gone, their politics are strong. The objection that inertia is merely durability collapses because a durable rock does not reproduce social exclusion, whereas a durable bridge does; inertia requires the continued operation of a specific practice being thwarted by the artifact. Therefore, an artifact is strongly political only when it acts as a substitute for human authority, maintaining allocation outcomes automatically once the vigilance of the state ceases.
