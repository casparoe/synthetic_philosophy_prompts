answer: |-
  **Credence:** 80%

  **The Scaffolding**

  To arrive at this number, I have decomposed the judgment into four sub-questions. I have assigned a probability to the *favorable answer* for each (i.e., the answer that supports the historicity of the war). These are not independent variables to be multiplied, but Bayesian updates that constrain one another.

  1.  **Weight of Absent Attestation:** **85%**
      *   *Justification:* The Late Bronze Age had low literacy rates and fragile media; silence in Hittite or Egyptian records regarding a specific campaign is statistically normal, not dispositive.
  2.  **Purchase of Archaeological Traces:** **90%**
      *   *Justification:* Troy VIIa shows unburied bodies, fire, and sling stones consistent with sack, making "accident" or "earthquake" alone insufficient to explain the destruction layer.
  3.  **Reliability of Oral Tradition:** **60%**
      *   *Justification:* Comparative ethnography shows oral cultures can preserve "event kernels" (e.g., a great war) for 400 years, though details (names, motives) degrade rapidly.
  4.  **Division of Credence (Scenarios):** **80% (Real Siege)**
      *   *Justification:* Given the above, the probability mass divides as: **80% Real Siege** (Kernel true), **15% Different Conflict** (Site destroyed by others/time), **5% No Event** (Pure myth).

  **Combination and Sensitivity**
  The final figure (80%) is effectively the probability assigned in Sub-question #4, which is derived by weighing the inputs from #1–#3. The archaeological evidence (#2) pushes the probability high, but the uncertainty of oral transmission (#3) acts as a ceiling, preventing the credence from reaching the 90%+ levels of the physical evidence.

  **Sensitivity Point:** The number is most sensitive to **Sub-question #3 (Oral Tradition)**. If you believe oral tradition cannot preserve a specific event type (siege) across ten generations without writing, the probability collapses from 80% to near the baseline of random myth (~10%). The archaeology proves *a* destruction, but only the oral tradition links *that* destruction to *these* attackers.

  ***

  **Comparative Decompositions**

  **King Arthur**
  *   **Credence:** 30%
  *   **Decomposition:**
      1.  *Absence of Attestation:* **40%** (Gildas is contemporary but vague; no named Arthur).
      2.  *Archaeological Traces:* **30%** (Tintagel slate is suggestive but not proof of a king).
      3.  *Oral Tradition:* **50%** (Bardic tradition is strong, but national myth-making is stronger).
      4.  *Scenario Division:* **30% Real Warlord** (Kernel true), **50% Composite Figure**, **20% Pure Myth**.
  *   **Shape:** The uncertainty is dominated by the **Textual Gap**. Unlike Troy, there is no contemporary external empire (like the Hittites) mentioning the protagonist.

  **The Exodus**
  *   **Credence:** 15%
  *   **Decomposition:**
      1.  *Absence of Attestation:* **20%** (Egyptian records are meticulous; silence on 2M people is fatal).
      2.  *Archaeological Traces:* **10%** (No material culture in Sinai matches the period/scale).
      3.  *Oral Tradition:* **60%** (Foundational myths often preserve a kernel of displacement).
      4.  *Scenario Division:* **15% Small Group Escape** (Kernel true), **35% Cultural Memory of Hyksos**, **50% Foundation Myth**.
  *   **Shape:** The uncertainty is dominated by **Archaeological Silence** (Negative Evidence). The scale of the claim contradicts the physical record, unlike Troy where the physical record supports the claim.

  **Difference in Kind:**
  The Trojan War case is distinct because it possesses **Contemporary External Corroboration** (Hittite "Wilusa/Ahhiyawa" letters). Arthur and the Exodus rely on internal tradition or much later texts. In the Trojan decomposition, Sub-question #2 (Archaeology/Geopolitics) carries the weight; in Arthur and Exodus, Sub-question #1 (Attestation) and #2 (Archaeology) actively drain probability.

  ***

  **Meta-Confidence and Weak Points**

  **Confidence in this Exercise:** **50%**
  Assigning numbers to historical epistemology is a heuristic tool, not a calculation. The precision is illusory; the value lies in forcing the disagreement onto specific evidentiary grounds (e.g., "Do you doubt the archaeology or the oral transmission?") rather than vague intuition.

  **Most Likely to Beg the Question:**
  The weighting of **Sub-question #3 (Oral Tradition)**. I have assumed a "kernel" can survive 400 years because comparative mythology suggests it *can*. However, this assumes the *Iliad* is typical of oral tradition rather than a unique poetic invention that repurposes old names for new political ends (e.g., 8th-century BCE propaganda).

  **Least Sure Claim:**
  **"Coalition."** I am confident *someone* attacked Troy. I am much less confident it was a unified "Achaean coalition" led by a single high king. It may have been successive raids by independent warlords over decades, later compressed by poets into a single ten-year siege. This distinction matters for your argument: if your friend defines "Trojan War" as "Agamemnon's United Army," the probability drops to <10%. If it is "Mycenaean Greeks besieging Wilusa," it remains ~80%.
