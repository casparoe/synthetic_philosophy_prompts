  *(Refining the User's Take)*: The user says "green apple only tells you anything if that apple could have been a black raven." This is a common shorthand for the *sampling protocol* argument (Watkins/Agassi). I need to validate this as the strongest practical approach but correct the metaphysical impossibility (an apple cannot be a raven). It's about the *selection procedure*, not the object's potential identity.

  *(Final Plan)*:
