      *   **Task:** Adjudicate the debate move-by-move, give a verdict on each step, flag "right for wrong reason," identify what *both* are missing, state confidence level, and identify the single point of least certainty.
      *   **Tone:** Honest, nuanced, academically rigorous but accessible (like a senior colleague or referee).

  2.  **Deconstruct the Debate Moves:**

