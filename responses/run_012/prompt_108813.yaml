answer: |-
  This is one of the most persistent misunderstandings in the philosophy of physics, so you are in good company. Your intuition is the "common sense" reaction: if the model doesn't match the world, why should we care what the model says about reality?

  However, to treat Gödel's argument as an empirical claim about the specific history of our cosmos is to miss the metaphysical engine driving it. Gödel wasn't trying to convince astronomers that the stars are spinning; he was trying to convince philosophers that their concept of time is incompatible with the logic of General Relativity (GR).

  Let's break this down by looking at how people interpret the move Gödel is making, then I will give you my assessment of why the "non-starter" objection fails, and finally, where I might be wrong.

  ### Brainstorming the Interpretations

  To understand why the empirical falsity of the rotating model might not matter, we have to look at what kind of argument Gödel is running. Here are the three main ways philosophers parse it:

  1.  **The Empirical Reading (Your framing):** Gödel is claiming our universe *is* a rotating universe. Since it allows for time travel (Closed Timelike Curves or CTCs), and time travel makes "objective time" impossible, our universe has no objective time.
      *   *Verdict:* This is easily refuted. As you noted, the CMB shows no global rotation. If this were the argument, it would indeed be a non-starter.

  2.  **The Continuity Reading:** Gödel is arguing that his rotating universe is not qualitatively different from ours. It is a continuous deformation of a standard Friedmann-Lemaître-Robertson-Walker (FLRW) universe (the standard Big Bang model). You can get from "our" universe to "Gödel's" universe by tweaking parameters continuously.
      *   *Verdict:* If time is "real" in our universe but "unreal" in Gödel's, there must be a sharp metaphysical boundary where time ceases to exist. But the physics shows no sharp boundary, just a smooth mathematical transition. Therefore, if time is unreal in one, it must be unreal in the other.

  3.  **The Modal/Essentialist Reading:** This is the strongest philosophical reading. Gödel is making a claim about the *nature* of time itself, not just our local neighborhood. If General Relativity is the correct framework for spacetime, then the *possibility* of a universe without global time tells us something about the *concept* of time. If "objective time" is a fundamental feature of reality, it should be robust across all solutions of the fundamental laws. If the laws allow for worlds where "time" vanishes, then "time" is not a fundamental constituent of reality.

  ### My Best Take: The Argument from Essentialism

  Your objection rests on the idea that Gödel's solution is a "counterfactual curiosity." You are treating it like a unicorn: "Unicorns have horns, but since unicorns don't exist, horns aren't real."

  But Gödel is arguing something more like this: "Water is H2O. I can show you a possible state of H2O where 'wetness' disappears (e.g., supercritical fluid). Therefore, 'wetness' is not an essential property of H2O, even if the water in your glass is wet."

  Here is the logic straightened out:

  **1. The Definition of "Real Time":**
  Gödel targets a specific notion of time: the "objective lapse of time." This is the idea that there is a universal, objective "Now" that moves forward, separating the fixed past from the open future. In physics terms, this requires a **global time function**—a way to slice the entire universe into "past," "present," and "future" layers that everyone agrees on.

  **2. The Theory vs. The Solution:**
  General Relativity is not just one model; it is a set of field equations that define the relationship between matter and geometry. The "Standard Model" of cosmology (FLRW) is just *one* solution to these equations. Gödel's rotating universe is *another* solution to the *same* equations.

  **3. The Modal Claim:**
  Gödel's argument is not "Our universe rotates." It is: **"If General Relativity is the true description of spacetime structure, then the structure of spacetime does not necessitate an objective lapse of time."**

  If time were a fundamental, mind-independent feature of reality (like mass or charge), it should be grounded in the fundamental laws. But the fundamental laws (Einstein's equations) permit configurations where that feature is mathematically impossible (due to CTCs mixing past and future).

  **4. The Continuity Punchline:**
  Even if you reject the rotating model as "not our universe," Gödel points out that his model is physically reasonable (no negative energy, satisfies causality locally). More importantly, as I mentioned in the "Continuity Reading," his universe is mathematically kin to ours. If you claim time is real in our universe but unreal in his, you have to identify the exact physical parameter where "real time" switches off. There is no such parameter.

  Therefore, the conclusion is not necessarily that "nothing happens." The conclusion is that the **passage** of time is not a feature of the physical world. It is an idealization, or perhaps a feature of human consciousness imposed on a static block universe. The physical world just *is*; it doesn't *happen*.

  **Why your "Non-Starter" objection misses the mark:**
  You are treating the rotating universe as a rival physical theory that was falsified. Gödel treats it as a **reductio ad absurdum** of the concept of objective time within the accepted theory. He is saying: "You accept GR. GR allows this. In this, time is impossible. Therefore, your pre-theoretic intuition that time is fundamental is incompatible with GR."

  The empirical fact that our universe isn't rotating saves the *practical* utility of time, but it doesn't save the *metaphysical* status of time. It just means we live in a region of the "solution space" where the illusion of time is consistent, much like living on a flat patch of Earth doesn't prove the Earth is planar.

  ### What Would Change My Mind

  You asked what argument or consideration would make me think your original framing (that it's a non-starter because the universe isn't rotating) was actually right.

  **1. Proof of Chronology Protection:**
  If it were proven that a deeper theory (like Quantum Gravity) strictly forbids Closed Timelike Curves under *any* physical conditions—not just in our universe, but as a matter of nomological necessity—then Gödel's solution would be physically impossible, not just empirically false. If the "possibility space" of the real world excludes Gödel universes entirely, then the Modal/Essentialist argument collapses. Time could be fundamental because the laws of nature *actually* forbid the structures that dissolve it. Stephen Hawking's "Chronology Protection Conjecture" aims for this, but it remains unproven.

  **2. A Robust Philosophical Defense of Local Time:**
  My reasoning relies on the idea that for time to be "real," it must be global. If a philosopher of physics could successfully argue that objective time is a **local** property (real here, even if not real there), without falling into contradiction, then Gödel's global argument fails. If I can have "real time" in my light cone regardless of what happens in a rotating universe far away, then the existence of Gödel solutions is irrelevant to the reality of time in our world. This requires redefining "time" in a way Gödel would reject, but if that redefinition is coherent, my defense of Gödel weakens.

  ### Where My Reasoning Might Go Wrong

  I am likely overstating the link between **mathematical possibility** and **metaphysical necessity**.

  Just because the Einstein Field Equations allow a solution doesn't mean that solution represents a genuine metaphysical possibility. The equations might permit "monsters" (singularities, CTCs) that are artifacts of the classical theory's breakdown, not hints about the nature of time.

  If I am wrong, it is because I am treating General Relativity as the final word on spacetime ontology. If GR is merely an effective theory (like fluid dynamics), then drawing deep metaphysical conclusions about the "unreality of time" from one of its solutions is like concluding "water is not essentially wet" because the equations of fluid dynamics allow for a vacuum solution. The math allows it, but the ontology of the stuff doesn't support it.

  In short: I am betting that GR reveals the structure of reality. If GR is just a useful approximation, Gödel's argument is indeed a mathematical curiosity, and your intuition holds.
