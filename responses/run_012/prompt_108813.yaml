  You're a philosopher of physics who knows the history of general relativity and the philosophy of time, so please think carefully rather than giving me the standard textbook summary. I'm trying to get my head around Gödel's rotating universe argument. As I understand it, he found a solution to Einstein's equations where the whole universe rotates and there are closed timelike curves, so there's no global time function, and he took that to prove that time is unreal. But I've also read that our universe isn't rotating, so the solution is just a mathamatical curiosity. If our universe isn't rotating, how can his solution tell us anything about the reality of time? Isn't the whole argument a non-starter? Before you answer, brainstorm the main ways people read what Gödel was up to, then give me your best take. I don't need a reading list or citations, just help me get the logic straight. At the end, say what would change your mind: which argument or consideration would make you think my original framing was actually right, and where your own reasoning is most likely to go wrong.
