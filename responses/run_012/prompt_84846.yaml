  10. **Final Polish:** Ensure the distinction between "What was said," "What was meant," and "What was inferred" is woven into the steps. (Step 1 = Said, Step 3/4 = Meant, Step 6 = Inferred/Shared).

  *(Self-Correction on Case 2)*: To make sure the user "won't like" the outcome, I need to make sure the harm is real, but the linguistic proof is missing. This highlights the limitation of the procedure.

  *(Self-Correction on Limitations)*: Be honest. Grice fails when the speaker is *strategically* uncooperative. I need to recommend the "Reasonable Person in the Context" standard (Legal/HR standard) as the override.

  11. **Final Assembly:** (Drafting the response based on these thoughts).

      *   *Structure:*
          1.  Introduction (Acknowledging constraints).
          2.  The Decision Procedure (Full Version).
          3.  The One-Page Desk Reference.
          4.  Case Studies (Applied Procedure).
          5.  Limitations & The Non-Cooperative Problem.

      *   *Key Phrase Integration:* "Generalized vs Particularized," "Cancellability," "Detachability," "Maxims," "Stop Points."

      *   *Tone:* Clinical, authoritative, operational.

      *(Final check on the GC constraint)*: The GC says "it was only implied" is not a defense. This means if the procedure confirms it *is* an implicature, the defense fails. The procedure's job is to confirm *that it is* an implicature rigorously.

