answer: |-
  # OPERATIONAL DECISION PROCEDURE: IMPLICATURE AND CONDUCT
  **Version:** 1.0 (Conduct Function)
  **Authority:** Employee Conduct
  **Constraint:** 2 Working Days per Complaint

  ## PART I: THE DECISION PROCEDURE

  **Purpose:** To distinguish between literal meaning, speaker meaning (implicature), and recipient inference, ensuring findings rest on derivable content rather than speculation.

  **Step 1: Establish the Literal Content (What Was Said)**
  *   **Question:** What is the semantic content of the message if stripped of all context?
  *   **Evidence:** The text, image, or emoji itself. For links/quotes, the literal headline or text reproduced.
  *   **Sufficient Answer:** A neutral paraphrase. (e.g., "The message asks a question about attendance," "The message contains a link to Article X," "The message says 'Nice shirt'.")
  *   **If You Cannot Tell:** Proceed to Step 2. (Note: If the literal content *itself* violates the Code, stop and issue Finding of Violation. This procedure is for non-literal cases.)

  **Step 2: Identify the Alleged Content (What Was Inferred)**
  *   **Question:** What specific proposition does the complainant assert was communicated?
  *   **Evidence:** Complainant statement.
  *   **Sufficient Answer:** A clear proposition. (e.g., "The sender means I am lazy," "The sender endorses the slur in the link.")
  *   **If You Cannot Tell:** **[STOP: NO VIOLATION].** If the complainant cannot articulate what was communicated beyond "it felt bad," there is no proposition to evaluate. Label this *Subjective Distress, No Conduct Violation*.

  **Step 3: The Derivation Test (The Maxims)**
  *   **Question:** Can the Alleged Content be derived from the Literal Content using the Cooperative Principle (Relation, Quantity, Quality, Manner) and shared context?
  *   **Evidence:** Thread history, meeting agenda, timing, prior interactions.
  *   **Sufficient Answer:** Yes, if ignoring the Alleged Content makes the Literal Content irrelevant, false, or overly obscure. (e.g., Asking "How is your *back*?" is irrelevant unless the sender implies the recipient looks pained.)
  *   **If You Cannot Tell:** **[STOP: NO VIOLATION].** If the message makes sense literally without the offensive implication, the implication is not pragmatically necessary. Label this *Ambiguous Communication, No Violation*.

  **Step 4: The Denial Test (Cancellability)**
  *   **Question:** If the subject adds "I did not mean [Alleged Content]," does it contradict the Literal Content?
  *   **Evidence:** Subject's explanation, context of delivery.
  *   **Sufficient Answer:**
      *   **No Contradiction:** It is a valid implicature defense. (e.g., "It's raining" + "I don't mean take an umbrella" is consistent).
      *   **Contradiction:** The defense fails. (e.g., "When did you stop beating your wife?" + "I don't mean you beat her" contradicts the presupposition required to ask the question).
  *   **If You Cannot Tell:** Proceed to Step 5.

  **Step 5: The Wording Test (Detachability)**
  *   **Question:** If the speaker had used different words to convey the same literal point, would the Alleged Content disappear?
  *   **Evidence:** Comparison with standard phrasing in the company.
  *   **Sufficient Answer:**
      *   **Yes (Detachable):** The content is likely tied to the specific words chosen (Conventional Meaning).
      *   **No (Non-Detachable):** The content arises from the *act* of speaking, not the words (Conversational Implicature).
  *   **Tie-Break Rule:** If content is neither cancellable (Step 4) nor detachable (Step 5), treat it as **Conventional Meaning** (i.e., it counts as "said").
  *   **If You Cannot Tell:** Proceed to Step 6.

  **Step 6: The Burden Shift (Generalized vs. Particularized)**
  *   **Question:** Is the Alleged Content a Generalized Implicature (any competent speaker would draw it) or Particularized (requires specific shared history)?
  *   **Evidence:** Company culture, team norms, national context (3 countries), prior warnings.
  *   **Sufficient Answer:**
      *   **Generalized:** Burden shifts to Subject to prove they *could not* have meant it. (Presumption of Violation).
      *   **Particularized:** Burden remains on Complainant to prove the Subject *knew* the shared background required to draw the inference.
  *   **If You Cannot Tell:** **[STOP: VALUE JUDGMENT REQUIRED].** Escalate to Conduct Head. The question is no longer linguistic but normative: *How much shared background do we attribute to a reasonable employee?*

  **Step 7: Final Determination**
  *   **Question:** Does the validated content violate the Code prohibition on contempt for a protected characteristic?
  *   **Evidence:** Code of Conduct text.
  *   **Action:** Issue Written Finding.

  ***

  ## PART II: ONE-PAGE DESK REFERENCE (INVESTIGATORS)

  **KEEP AT DESK. RUN STEPS 1-3 BEFORE ESCALATION.**

  | STEP | ASK THIS | LOOK FOR THIS | IF YES → | IF NO / UNCLEAR → |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. LITERAL** | What does the message say if context is deleted? | Text, Emoji, Link URL. | Go to Step 2. | **STOP.** If literal text violates Code, find Violation. |
  | **2. ALLEGED** | What exactly does the complainant say was meant? | Complainant Interview. | Go to Step 3. | **STOP [NO VIOLATION].** "It felt bad" is not a proposition. |
  | **3. DERIVATION** | Does the message make sense *without* the offensive meaning? | Thread context, Timing, Relevance. | **STOP [NO VIOLATION].** If literal meaning suffices, implication is speculative. | Go to Step 4 (Escalate to Conduct Head). |

  **INVESTIGATOR NOTES:**
  *   **Emoji/Links:** Treat as Literal Content (Step 1). Ask: "What is the standard use of this emoji in this channel?"
  *   **Denials:** Do not investigate Step 4 (Denial Test). This is for Conduct Head.
  *   **Burden:** If the meaning requires specific team knowledge (Step 6), ask Complainant: "How do you prove *they* knew that code?"
  *   **Escalation Point:** If Step 3 is passed (Implicature is derivable), send to Conduct Head for Steps 4-7.

  ***

  ## PART III: CASE STUDIES

  ### Case 1: The Presuppositional Question
  **Context:** Public team channel. Subject asks Complainant (who has a visible disability): *"Are you finding the new ramp accommodation difficult to use?"*
  **Complaint:** Implies the Complainant is physically incapable and a burden.
  **Subject Defense:** "I was just asking about the facility. I added 'I'm not judging your ability' in the next message."

  *   **Step 1 (Literal):** Question about ramp difficulty.
  *   **Step 2 (Alleged):** Proposition: "Your disability makes you less capable/a burden."
  *   **Step 3 (Derivation):** **Pass.** Under Maxim of Relation, asking about a disability accommodation specifically implies the disability is the relevant variable. Asking this publicly rather than privately flouts Manner (avoid embarrassment), suggesting the point *was* the public marking.
  *   **Step 4 (Denial):** **Fail.** The subject added a denial ("I'm not judging"). However, the presupposition ("...difficult to use") remains embedded in the question structure. Adding "I don't mean to presuppose you use it" contradicts the act of asking. The denial is linguistically infelicitous.
  *   **Step 5 (Detachability):** **Non-Detachable.** Any question about the ramp's difficulty relative to the person carries this implication.
  *   **Step 6 (Burden):** **Generalized.** Any competent speaker understands that singling out a disability in a public channel implies the disability is a deficit.
  *   **Outcome:** **VIOLATION.**
  *   **Note:** The Subject's "I was just asking" defense fails the Cancellability Test.

  ### Case 2: The Team Signal
  **Context:** Private message. Subject sends Complainant the phrase: *"Blue Sky thinking."*
  **Complaint:** In Complainant's previous company, "Blue Sky" was a coded slur for "Unhinged/Incompetent women." Complainant asserts Subject used it as a slur.
  **Subject Defense:** "I use it to mean 'brainstorming'. I have never heard the other definition. We are in different countries."

  *   **Step 1 (Literal):** Phrase "Blue Sky thinking."
  *   **Step 2 (Alleged):** Proposition: "You are incompetent/unhinged."
  *   **Step 3 (Derivation):** **Fail.** Under standard corporate English (Shared Background), "Blue Sky" means "brainstorming." To derive the slur meaning requires a specific, non-standard maxim violation.
  *   **Step 4 (Denial):** **Pass.** Subject can say "I meant brainstorming" without contradiction.
  *   **Step 5 (Detachability):** **Detachable.** If they meant "incompetent," they could have used other words. The words chosen are standard corporate parlance.
  *   **Step 6 (Burden):** **Particularized.** The slur meaning is not generalized. It belongs to Complainant's *previous* company, not this one. Complainant bears the burden to prove Subject knew this specific code. There is no evidence Subject worked at Complainant's old firm.
  *   **Outcome:** **NO VIOLATION.**
  *   **Note:** **I know you will not like this.** The harm to the Complainant is real (they felt targeted). However, the procedure exonerates the Subject because the *implicature* cannot be derived without assuming background knowledge the Subject does not possess. To find a violation here, you must override Step 6 and rule on *Effect* rather than *Meaning*.

  ### Case 3: The Reproduced Slur
  **Context:** Team Channel. Subject pastes a news link. The headline contains a racial slur (quoted in the article). Subject adds no comment.
  **Complaint:** Endorsement of the slur.
  **Subject Defense:** "Documentation. I was showing the article is about the controversy."

  *   **Step 1 (Literal):** Link to article. Headline visible in preview.
  *   **Step 2 (Alleged):** Proposition: "I endorse the slur contained in the headline."
  *   **Step 3 (Derivation):** **Pass.** Maxim of Relation: Why share this *now*? If the point was the article's content, a summary would suffice (Maxim of Quantity). Sharing the raw headline with a slur flouts Manner (be orderly) unless the shock value is the point.
  *   **Step 4 (Denial):** **Fail.** "I didn't mean to endorse it, just show it" contradicts the choice to share the unredacted slur when a redacted link or summary was available.
  *   **Step 5 (Detachability):** **Non-Detachable.** The act of sharing the unredacted text creates the meaning.
  *   **Step 6 (Burden):** **Generalized.** In a professional context, sharing unredacted slurs is universally understood as normalization or endorsement unless explicitly flagged as "Warning: Offensive Content."
  *   **Outcome:** **VIOLATION.**
  *   **Note:** The "Documentation" defense fails the Wording Test (Step 5). They could have documented without reproducing the slur.

  ***

  ## PART IV: LIMITATIONS AND THE NON-COOPERATIVE PROBLEM

  **Where This Procedure Misfires**
  This procedure assumes the **Cooperative Principle**. It works when speakers are trying to be understood. It will fail when speakers are **strategically uncooperative** (i.e., gaslighting or dog-whistling).

  1.  **The Plausible Deniability Trap:** A sophisticated harasser knows the Cancellability Test (Step 4). They will construct messages specifically to pass it. They will flout maxims intentionally to create harm while maintaining a literal defense. In these cases, Step 3 (Derivation) will return "Unclear," forcing a **STOP [NO VIOLATION]**, even though harm occurred.
  2.  **The Cultural Gap:** In a three-country company, "Generalized Implicature" (Step 6) is unstable. What is a generalized insult in Country A may be particularized in Country B. The procedure risks enforcing the cultural norms of the headquarters over local contexts.
  3.  **The "Effect" Blindspot:** As seen in Case 2, this procedure protects the *Speaker's Meaning*, not the *Recipient's Harm*. If your Code of Conduct is intended to prevent a Hostile Work Environment, **Impact** matters more than **Intent**. This procedure measures Intent (via Meaning).

  **When to Set It Aside**
  You must abandon this Gricean procedure when:
  1.  **Pattern of Behavior:** A single message passes the Denial Test (Step 4), but the Subject has three prior warnings. The context is no longer a single conversation but a campaign.
  2.  **Power Imbalance:** When the Subject is a manager and the Complainant is a direct report. The "Cooperative Principle" is voided by coercion. The recipient cannot assume cooperation.

  **The Alternative Standard**
  In the cases above, switch to the **Reasonable Recipient Standard (Hostile Work Environment Test)**.
  *   **Question:** Would a reasonable person in the Complainant's position perceive this as contemptuous, regardless of the Speaker's derivable intent?
  *   **Why:** This bypasses the "Denial Test." It accepts that "It was only implied" is a defense only if the implication wasn't reasonably received as contempt.
  *   **Cost:** This increases false positives (punishing clumsy speakers) but reduces false negatives (allowing strategic harassers). Given your General Counsel's stance ("it was only implied" is not a defense), you are already operating under a Reasonable Recipient Standard legally. This Gricean procedure is merely a filter to prevent your unit from drowning in subjective complaints. Use it to triage, not to adjudicate the hard cases.
