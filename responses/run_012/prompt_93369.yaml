answer: |-
  | Requirement | Case or consideration behind it | Status (non-negotiable or camp preference) | Candidates it rules out |
  | :--- | :--- | :--- | :--- |
  | **Classify explicit and implicit exchange as corruption** | Customs bribe; Doctor gift for priority | Non-negotiable | Definitions requiring explicit *quid pro quo* contracts; pure gift-exchange theories. |
  | **Capture relational and reciprocal exchange systems** | Patron-client favors; Gifts as open-ended obligations | Non-negotiable | Transactional/Event-based definitions; Economic definitions treating gifts as closed transactions. |
  | **Decouple legality from corruption** | Lobbying retainer (legal/criminal); Informal charge for free service | Non-negotiable | Legalistic definitions (Corruption = Illegal); Statutory definitions. |
  | **Distinguish corrupt acts from mere inefficiency or partiality** | Doctor priority vs. slow service; Customs delay vs. bribe | Non-negotiable | Performance-based definitions; Definitions equating corruption with poor governance outcomes. |
  | **Distinguish individual deviance from systemic equilibrium** | Stable equilibrium where non-participation is self-defeating | Non-negotiable | Methodological individualism; "Bad apple" theories; Moralistic definitions ignoring incentives. |
  | **Accommodate divergent perceptions of the state apparatus** | Shared civic institution vs. foreign extraction machine | Camp preference (Anthropological relativist) | Functionalist definitions assuming the state is universally viewed as a public good. |
  | **Enable external indictment of local practices** | Auditor reads theft where community reads kin obligation | Camp preference (Good-governance) | Ethical relativism; Definitions requiring local normative acceptance for corruption to exist. |
  | **Defer to local normative frameworks in classification** | Community reads kin obligation where auditor reads theft | Camp preference (Anthropological relativist) | Universalist definitions; External normative impositions; Good-governance reformist frameworks. |

  **Incompatible pair:** Enable external indictment of local practices **and** Defer to local normative frameworks in classification.
  **Most-excluding requirement:** Distinguish individual deviance from systemic equilibrium (rules out all theories lacking a game-theoretic or structural causal mechanism).
