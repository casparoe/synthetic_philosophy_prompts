      CAMBRIDGE, MA—Declaring that existing historiography has been too distracted by what actually happened, the Centre for Comparative Non-Invention (CCNI) announced Monday the launch of a $40 million endowment dedicated exclusively to funding research projects phrased as contrastive non-events. The Centre's mandate requires all grant proposals to adhere to a strict syntactic template: "Why did Civilization X not develop Technology Y, whereas Civilization Z did?"

      Dr. Julian Vane, the Centre's director, described the methodology as a breakthrough in causal isolation. "By fixing the foil, we fix the explanatory space," Vane said at a press conference. "Previous scholarship suffered from ambiguity regarding why the Scientific Revolution occurred in Europe rather than China. We have resolved this by stipulating that 'Europe' and 'China' are single deliberating agents capable of choosing trajectories over five-century spans. This allows us to treat historical contingency as a policy decision."

