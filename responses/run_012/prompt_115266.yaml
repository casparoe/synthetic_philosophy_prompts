      Vane dismissed this concern as a lack of imaginative range. "That absorbency is a feature, not a bug," he said. "If evidence suggests the technology was impossible, we code it as a 'structural inhibition.' If evidence suggests it was possible, we code it as a 'cultural preference.' This ensures the research programme remains robust against empirical fluctuation. We are not studying history; we are studying the topology of absence."

      The Centre's inaugural grant cycle reflects this rigorous arbitrariness. Reviewers prioritized projects that maximized geographical distance while minimizing technological relevance.

