prompt: |-
  hey, I'm a junior in a phil of science seminar and we just finished two weeks on Solomonoff induction and the whole "shortest program" picture of Occam's razor. Our final has a creative component (don't ask) and I want to write a short story that actually gets the machinery right, because our prof will absolutely notice if I turn it into "simple theories are probably true, the end."

  No sources, no reading list, no citations needed — it's fiction, just don't invent fake papers or attribute anything to anybody.

  Here's the stuff I want the story to be *about*, and please don't water it down:

  The predictor in the story shouldn't be the naive "pick the single simplest hypothesis" thing. It's a weighted mixture over every program that could produce the data so far, each weighted by 2 to the minus its length, and it's the mixture — not any single hypothesis — that carries the guarantee that it converges on any computable source. That distinction is the whole reason the thing is interesting and I feel like everyone flattens it.

  Second: the prior is uncomputable. Nobody can actually run this thing. So both of the predictors in my story have to be approximations, and part of the drama should be that the characters can't tell which of them is "really" closer to the ideal, because they're each approximating a different part of it.

  Third, and this is the part I actually want the story to be about: the invariance theorem. Two different universal machines give you priors that differ only by a constant factor — the constant depends on how long it takes to simulate one machine on the other. So in the limit they agree, but at finite data the constant can completely swamp the difference, and there's no bound anywhere on how long "in the limit" takes. The scenario our prof put on the board was: suppose the true process is a short program in machine V and a long one in machine U. Then V's predictor beats U's for a very long time. But U's does catch up. Eventually. Make me a story where somebody has to live inside that "eventually."

  So the question I want humming underneath it: is simplicity a fact about the world, or a fact about the notation you happened to pick? I want characters who feel the pull of both answers and neither one is a strawman — one of them should be right about something the other one is wrong about, and vice versa.

  Setting is up to you (observatory, betting shop, translation bureau, whatever) but no talking-heads exposition dumps, and please don't end it with someone explaining the lesson. Also don't make the "eventually" into a twist ending where everything resolves — the whole point is that it doesn't, for anyone in the story.

  At the very end, after the story, give me a short note — 100 to 150 words, and it counts toward the length — that seperates what's actually settled in the technical work on this from what's genuinely contested among people who know it, and flags anywhere the story takes liberties with the math or leans on a reading of the ideas that's disputed. I do not want a contested position presented to me as the consensus. That's the thing I'd get burned on.

  Hard limit: 1,100 words total, story plus note.
