answer: |-
  1. **The Predictor-Free Mugging**
     Strip Omega out entirely. A random process before you were born fixes both whether your house gets termites and a fact about your brain that makes you the sort of person who'd hand over the money. The correlation is there, but nothing is predicting you and the termite outcome doesn't depend on your choice. Do you pay?
     **Follow-up:** If you say no, why does the correlation compel you in the standard case? If you say yes, why isn't this just EDT? How do you stop your view from collapsing into paying whenever your character correlates with bad outcomes?

  2. **The XOR Blackmail Case**
     Omega sends you a letter saying he's sent it iff your house is infested XOR you pay him. EDT gets money-pumped here. Does updatelessness prescribe paying, or does it dodge the bullet?
     **Follow-up:** You'll likely say real mugging has counterfactual dependence and this doesn't. But with a perfect predictor, isn't that dependence purely logical? What principled line separates the logical dependence that counts from the logical dependence that doesn't?

  3. **The Nature of the Coin**
     In one version the coin is a determinate fact you don't know, like a distant digit of pi. In another, it's a genuinely indeterministic quantum measurement made after your decision. Which version does your argument actually need?
     **Follow-up:** If you need the deterministic one, does the whole thing become a claim about logical uncertainty rather than decisions? If you accept the quantum one, how do you ground counterfactual dependence on a future event that physically doesn't depend on you?

  4. **Fallible Predictor: The Continuity Question**
     Suppose the predictor is fallible with known accuracy *p*. At what *p* does the answer flip, and is *p* = 1 special? Is there a discontinuity?
     **Follow-up:** If you say it flips smoothly, doesn't that imply the recommendation is just a continuous function of correlation? If so, why treat the perfect case as a distinct philosophical category rather than just the limit of a statistical trend?

  5. **Fallible Predictor: The Philosophical Bite**
     Following on that: if for any *p* above a half you still pay when the prize is big enough, isn't this just ordinary expected-value reasoning that even a causal decision theorist would accept once you've written the correlation down?
     **Follow-up:** If it is just standard EV reasoning, what's the distinctively philosophical interest left in updatelessness? Are you defending a new decision theory or just reminding causal theorists to count their correlations?

  6. **The Embedded Version**
     Make the predictor a physical agent inside the same universe, running a simulation of you that costs it resources and can mispredict because of computational limits. Does the updateless argument survive when prediction is an embedded, resource-bounded process?
     **Follow-up:** You'll say the idealisation is fine for a thought experiment. But if the idealisation is doing the load-bearing work, does the theory quietly vanish for realistic agents? Are you defending a principle for gods rather than humans?

  7. **The Self-Locating Version**
     The message is addressed to whichever copy of you receives it, and you're uncertain which copy you are. Does that indexical uncertainty move the answer, and in which direction?
     **Follow-up:** If it doesn't change the answer, aren't you implicitly committing to a specific anthropic principle like SIA? If it does change, isn't your decision theory hostage to unresolved debates in anthropics?

  8. **Precommitment: The Value Add**
     Everyone already agrees you should precommit if you can. State exactly what updatelessness adds beyond that agreement. What does it offer that simple precommitment doesn't?
     **Follow-up:** If you say it guarantees dynamic consistency, isn't that just a property of the agent rather than a guide for action? Does updatelessness tell you what to *do*, or just what to *wish you had done*?

  9. **Precommitment: The Decision Procedure**
     Suppose an agent genuinely can't precommit. What should they do at the moment of asking? Is there an actual algorithm they run?
     **Follow-up:** If you say "choose the policy you'd have wanted to have chosen", how do they compute that when the policy choice and the act happen at different times? Is "act updatelessly" just a label for "wish you had precommitted"?

  10. **The Stopping Rule**
      If you pay in the mugging and in XOR blackmail, where does it stop? Is there a version of the argument that obliges you to pay anyone who credibly claims to have simulated you? State a principled stopping rule.
      **Follow-up:** How do you distinguish genuine impact from logical blackmail without circularity? If you can't state a rule, isn't the theory vulnerable to being money-pumped by any clever claimant who knows your source code?

  Verdict: 10
