      *   *Claim 5: The Embodied/Enactive Reading.*
          *   Idea: Meaning requires sensorimotor interaction with the world.
          *   Truth Value: Substantive (Cognitive Science debate).
          *   Relevance to AI: Very strong support for friend. Text-only = no body = no meaning.

      *   *Claim 6: The Category Error/Category Mistake.*
          *   Idea: "Meaning" is a property of *use*, not systems.
