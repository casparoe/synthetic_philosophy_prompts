prompt: |-
  So last night I got into a long argument about whether a chatbot that's only ever seen text can really mean anything by its words, or whether it's just shuffling symbols around. My friend kept coming back to "meaning aint in the head" like it settled the whole thing. I think the point he wanted was: you can't figure out what someone's word means just by looking at whats inside their skull, so a text-only system must be missing something. But I've also heard the same line pushed for much stronger stuff — that the meaning of your words is entirely fixed by stuff outside you, or that there's no such thing as narrow content at all, or that meaning is really a social/public matter rather than a private one.

  Can you spell out the different precise claims that one sentence could actually be making? I want a menu — from the readings that are basically trivially true, through the ones that are substantive and maybe defensible, to the ones that are just false — and for each one say whether it would actually get my friend his conclusion about the text-only AI or not. Dont just pick one reading and explain it; lay them all out, and at the end tell me which reading you think people usually have in mind when they trot that line out in arguments like this.
