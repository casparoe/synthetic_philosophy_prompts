      **Office of Truthful Communication**
      **Policy Manual 4.2: Veracity and Intent**

      **1. Definition of Untruth**
      Staff are reminded that a lie is not defined by factual incorrectness but by the *intentio fallendi*, the intention to deceive. A statement factually false but believed true constitutes error, not sin. Conversely, a statement factually true but believed false constitutes a lie, as the will intends deception. Consequently, during annual self-appraisals, employees must not claim competencies they lack, but neither should they deny competencies they possess under the guise of humility, as this deceives the reviewer regarding actual capacity. Apologies must not admit guilt where none is believed; staff should instead express regret for the disturbance caused. The Annual Newsletter's April issue is certified compliant. Although contents are fictitious, the context signals no intent to deceive the reasonable reader; therefore, no falsehood is uttered.

      **2. Schedule of Offences**
      Disciplinary action follows the Eight Grades of Falsehood. All grades are prohibited; the schedule indicates gravity of sin and penance due, not permission granted. Grade One involves false teaching in doctrine and carries immediate dismissal and ecclesiastical referral. Grade Two involves unjust harm to any person. Grade Three profits one party while harming another. Grade Four is falsehood for its own sake. Grade Five seeks to please others in conversation. Grade Six harms no one but protects property. Grade Seven harms no one but protects a life. Grade Eight harms no one but protects chastity. Staff should note that Grade Eight, while the least grave, remains a mortal offence. The Compliance Department takes pride in this precision; there is no sliding scale of permission, only a sliding scale of penance. A lie to save a life is still a lie, merely a less grievous one than a lie to steal a coin.

      **3. Rejection of the Helpful Lie**
      The "beneficent falsehood" is abolished. No exception exists for lies told to spare feelings, protect a colleague, or preserve life. Truth is owed to the questioner regardless of consequence. If truth causes harm, the harm is permitted by God; the lie is not. When pressed for information that cannot be truthfully disclosed, staff must utilize permitted alternatives: silence, a refusal to answer, a change of subject, or a true statement the questioner did not ask for. Acceptance of negative consequences is preferred to the commission of sin. If telling the truth results in termination or physical harm, the employee is encouraged to accept this outcome as participation in suffering rather than participation in falsehood.

      **4. Scriptural Precedents**
      Critics often cite biblical narratives to challenge this policy. These precedents are not licenses for imitation. The Hebrew midwives were rewarded for their benevolence and faith, not their falsehood. Rahab's faith justified her, though her deception remains condemned. Jacob's deception of Isaac is read as prophetic enactment, not moral instruction. Abraham's description of Sarah as his sister was technically true by half-measure, not a lie. Regarding Paul's claim to become all things to all men, this is interpreted as sympathy and accommodation of weakness, not an adoption of false beliefs. Staff must not cite these passages to justify deviation from Section 3.

      **5. Worked Example: Colleague Location**
      Scenario: A caller asks, "Is Brother Thomas in?" Brother Thomas is present but hiding from the caller.
      Impermissible Reply: "He is not here." (False statement, intent to deceive).
      Impermissible Reply: "I cannot see him." (False statement, intent to deceive).
      Permissible Reply: "I am not able to answer that." (True statement regarding ability/willingness).
      Permissible Reply: "He is unavailable." (True statement regarding access, ambiguous regarding location).
      Permissible Reply: Silence.
      If the caller infers absence from ambiguity, this is the caller's error, not the speaker's lie. However, staff should avoid tone or gesture that actively induces this error. The goal is concealment without assertion.

      **Author's Note**

      This parody leans heavily on Augustine's *De Mendacio*, treating his taxonomy as rigid bureaucratic policy. I have taken liberties primarily in systematizing his pastoral reflections into a fixed compliance matrix. Augustine's position on the eighth grade is contested; while he calls it the least sinful, some readings suggest he views it as a venial sin potentially excusable in extremis, whereas the manual treats it as strictly prohibited with penance. I also simplify his treatment of ambiguity; Augustine allows obscure speech but warns against leading listeners into error, a line the manual draws sharply.

      What would change my mind? If Augustine explicitly endorsed a falsehood in *Contra Mendacium* rather than merely analyzing the merits of biblical figures who lied. If he argued that charity could ever supersede the duty of truth-telling in a direct assertion, the manual's absolute prohibition would be unfair. However, given his insistence that even a lie to save a soul is damnable, the satire remains grounded in his stricter arguments. The bureaucracy merely removes the theological wiggle room Augustine sometimes left for human weakness.

