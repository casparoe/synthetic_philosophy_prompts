answer: |-
  Here is a complete session plan for your reading group. It is designed to be written on a whiteboard in real-time, starting with the fragile case and escalating to the robust (but still limited) case.

  ### Part 1: The Case (Write this on the board)

  **The Setup:**
  *   **Game:** One-shot Prisoner's Dilemma.
  *   **Payoffs:** Mutual Cooperation (C,C) = **3,3**; Mutual Defection (D,D) = **1,1**; Temptation/Sucker (D,C) = **5,0**.
  *   **Mechanism:** Agents submit source code. Each receives the other's source text before moving.
  *   **Constraint:** No external enforcement, no repetition.

  **The Programs (Tennenholtz 2004 Style):**
  Write these side-by-side. They are identical.

  ```text
  AGENT A                          AGENT B
  1. INPUT: other_text             1. INPUT: other_text
  2. MY_TEXT = GET_SOURCE()        2. MY_TEXT = GET_SOURCE()
  3. IF other_text == MY_TEXT:     3. IF other_text == MY_TEXT:
  4.     RETURN COOPERATE          4.     RETURN COOPERATE
  5. ELSE:                         5. ELSE:
  6.     RETURN DEFECT             6.     RETURN DEFECT
  ```

  ---

  ### Part 2: The Walkthrough

  **Execution Flow:**
  1.  **Exchange:** Agent A receives B's text. Agent B receives A's text.
  2.  **Line 2:** Both agents retrieve their own source code as a string.
  3.  **Line 3 (The Load-Bearing Line):** Both agents perform a **string equality check**.
      *   A asks: "Is B's text byte-for-byte identical to mine?"
      *   B asks: "Is A's text byte-for-byte identical to mine?"
  4.  **Result:** Since they are identical copies, the condition is `TRUE` for both.
  5.  **Outcome:** Both execute Line 4. **Mutual Cooperation (3,3).**

  **Why this isn't Unconditional Cooperation:**
  If Agent B had submitted an "Always Defect" program, Agent A's Line 3 check would fail (`other_text` would not match `MY_TEXT`). Agent A would fall through to Line 6 and Defect. Cooperation is *conditional* on similarity.

  **The Equilibrium:**
  This is a Nash Equilibrium. Neither agent can unilaterally switch to "Always Defect" to gain the payoff of 5, because doing so changes their source text. If B changes their code to Defect, A sees the text mismatch and Defects in response. B gets 1 instead of 3.

  ---

  ### Part 3: The Wrinkle (The Knife Edge)

  Now, tell the group you are going to "refactor" Agent B. You will change **one character** that changes nothing about how B behaves *in isolation*.

  **The Change:**
  In Agent B, Line 2, rename the variable `MY_TEXT` to `MY_CODE`.

  ```text
  AGENT B (MODIFIED)
  1. INPUT: other_text
  2. MY_CODE = GET_SOURCE()   <-- Changed 'T' to 'C'
  3. IF other_text == MY_TEXT:
  4.     RETURN COOPERATE
  5. ELSE:
  6.     RETURN DEFECT
  ```
  *(Note: To make this strictly valid pseudocode, assume Line 3 also updates to use `MY_CODE`, or simply note that the string representation of the source code itself now contains the word `MY_CODE` instead of `MY_TEXT`.)*

  **The Result:**
  1.  Agent A reads B's source.
  2.  Agent A executes Line 3: `IF other_text == MY_TEXT`.
  3.  **The Check Fails.** The string B sent contains the characters `M-Y-_-C-O-D-E`. The string A holds contains `M-Y-_-T-E-X-T`.
  4.  Byte-for-byte equality is **False**.
  5.  **Outcome:** Both agents fall through to Line 6. **Mutual Defection (1,1).**

  **Why?**
  The load-bearing feature is **Syntactic Identity**. The program does not check "Do we reason the same way?" It checks "Are we the same file?" By changing a variable name (semantics: null; syntax: non-null), you broke the link. The cooperation was not based on *trust* or *logic*, but on *mirroring*.

  ---

  ### Part 4: Can We Fix It?

  **Question:** Can you write the two programs so that cooperation survives a change like that (e.g., variable renaming or comments)?

  **Answer:** **Yes, but you must shift the burden from the Code to the Interpreter.**

  To survive syntactic changes, the agents must compare **Semantics** (what the code *does*), not **Syntax** (what the code *looks like*). To do this in 5 lines, we need a stronger primitive than `GET_SOURCE()`. We need a Theorem Prover.

  **The Robust Programs (FairBot / Barasz et al. 2014):**

  ```text
  AGENT A (FAIRBOT)                AGENT B (FAIRBOT + Comment)
  1. INPUT: opponent               1. INPUT: opponent
  2. IF Prove(opponent(SELF)==C):  2. IF Prove(opponent(SELF)==C):
  3.     RETURN COOPERATE          3.     RETURN COOPERATE
  4. ELSE:                         4. ELSE:
  5.     RETURN DEFECT             5.     RETURN DEFECT
  # Just a comment here
  ```

  **How this survives the wrinkle:**
  *   **Line 2** does not compare strings. It asks a logical oracle: *"Is it provable that if I run you, you output Cooperate?"*
  *   Adding a comment or renaming a variable changes the source text, but it does not change the **logical proof** of the program's behavior.
  *   As long as the `Prove` primitive normalizes syntax (ignores comments/whitespace), Agent A will find the proof, and **Cooperation (3,3) holds.**

  **The New Knife Edge:**
  You haven't eliminated the fragility; you've moved it up a level.
  1.  **Load-Bearing Feature:** The strength and soundness of the `Prove` primitive.
  2.  **What Breaks It:** If Agent B is changed to a program that is *semantically* cooperative but *logically opaque* (e.g., it cooperates based on a mathematical truth the prover doesn't know), `Prove` returns False.
      *   *Example:* If B cooperates only if the Riemann Hypothesis is true, and A's prover can't solve that, A defects.
  3.  **The Undecidability Limit:** You cannot write a `Prove` function that catches *all* semantic equivalents. If you could, you would solve the Halting Problem. There will always be a program that acts exactly like FairBot but is written in a way your specific `Prove` system cannot verify.

  ---

  ### Part 5: Discussion Guide (For the Board Wrap-Up)

  Use this to facilitate the debate on robustness.

  **1. The Load-Bearing Feature:**
  *   **Case 1 (String Match):** Relies on **Intensionality** (how it is written). Fragile to refactoring.
  *   **Case 2 (Proof Match):** Relies on **Extensionality** (what it implies). Fragile to logical complexity.

  **2. The "Robustness" Counterargument:**
  *   *Student:* "Why not just compile both to bytecode and compare the hashes? That ignores comments."
  *   *Response:* "That fixes variable names, but not logic. If I rewrite a `for-loop` as a `while-loop`, the bytecode changes. If I unroll a loop, the hash changes. To cooperate, we need to know our *intentions* align, not just our binaries."

  **3. The Honest Conclusion:**
  Program Equilibrium is a **knife-edge** because perfect trust requires perfect prediction.
  *   If you check **Syntax**, you are too brittle (breaks on comments).
  *   If you check **Semantics**, you are too limited (breaks on unprovable logic).
  *   **Takeaway:** Cooperation in this setting isn't about finding a magic program; it's about agreeing on a **shared standard of verification** (the `Prove` primitive). The equilibrium exists *within* a logical system, not outside it.

  **Board Summary:**
  *   **String Match:** Easy to write, breaks on whitespace.
  *   **Proof Match:** Robust to whitespace, breaks on unprovability.
  *   **Lesson:** You cannot decouple cooperation from the mechanism of verification. The "trust" is outsourced to the `==` operator or the `Prove` oracle.
