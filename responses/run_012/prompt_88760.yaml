prompt: |-
  I'm putting together a session for a reading group on program equilibrium and I want a case I can actually put on the board. Give me a one-shot prisoners dilemma between two agents, each of which submits its source code up front and reads the other's code before deciding. Constraints: the two agents sit in seperate boxes and the only thing that ever crosses between them is the source text; no repeated play, no reputation, no third party, no shared randomness, and the mutual cooperation has to fall out of what the programs do with each other's code rather than either one just being written to cooperate unconditionally. Keep each program short enough that I can write it out in five or six lines of pseudocode.

  Then walk me through it: what each program does when it reads the other, which line is actually doing the work, and what the payoffs come out to. After that, add a wrinkle -- take one of the programs and change it by a single character that makes no difference to its behavior (a comment, a renamed variable, whatever you like) and tell me what happens to the cooperation, and why. Finally: can you write the two programs so that the cooperation survives a change like that? If so, show me; if not, tell me exactly what breaks.

  I want to use this to show that the whole thing is a knife edge, so be honest about which feature of the case is load-bearing, what happens if you pull that feature out, and what someone who thinks the trick is robust would say back.
