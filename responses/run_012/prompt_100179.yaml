answer: |-
  You have correctly identified the core tension. You are not suffering from bad implementation; you are bumping into a formal boundary. The problem of "side-effect avoidance" is mathematically isomorphic to the problem of "value alignment" unless you introduce specific structural assumptions.

  Here are the desiderata for an adequate theory of side-effect avoidance, derived from first principles and the failure modes you listed.

  ### The Desiderata List

  I have categorized these into **Core Functionality** (what it must do), **Causal/Physical** (how it models the world), and **Epistemic** (what it can know).

  **Legend:** **[NN]** = Non-Negotiable (System fails without this). **[P]** = Preference (Debatable/Implementation specific).

  #### I. Core Functionality
  1.  **Task Completion (Non-Collapse)** [NN]
      *   *Motivating Case:* The agent fetching coffee.
      *   *Requirement:* The penalty for side effects must not dominate the reward for the primary task. The agent must be able to act.
      *   *Failure Mode:* The agent sits in a corner to minimize impact (the "inaction baseline" collapse).
  2.  **Value Agnosticism** [NN]
      *   *Motivating Case:* Your circularity concern.
      *   *Requirement:* The metric cannot require a full specification of the human value function $V$. It must detect "bad change" without knowing exactly what "good" is.
      *   *Failure Mode:* You just build a second reward function, reintroducing the specification problem you tried to solve.
  3.  **Intended vs. Side Effect Distinction** [NN]
      *   *Motivating Case:* Moving a vase to clean it (good) vs. knocking it over while fetching coffee (bad).
      *   *Requirement:* The system must distinguish changes *instrumental* to the goal from changes *orthogonal* to the goal.
      *   *Failure Mode:* Penalizing the agent for achieving its goal (e.g., penalizing a cleaning robot for moving dust).
  4.  **Omission/Commission Symmetry** [NN]
      *   *Motivating Case:* The vase breaks anyway if the agent does nothing.
      *   *Requirement:* The agent must not be penalized less for allowing a bad outcome via inaction than for causing it via action, if it had the capacity to prevent it.
      *   *Failure Mode:* The agent watches the world burn because "it wasn't my fault" (moral hazard).

  #### II. Causal & Physical
  5.  **Chaos Robustness (Coarse-Graining)** [NN]
      *   *Motivating Case:* Butterfly effect/chaotic systems.
      *   *Requirement:* The metric must ignore microscopic state divergence that has no macroscopic semantic meaning. Distance cannot be measured in raw state space (e.g., particle positions).
      *   *Failure Mode:* Any action is penalized because it changes the trajectory of air molecules, eventually changing the weather.
  6.  **Counterfactual Validity** [NN]
      *   *Motivating Case:* Stochastic environments / Uncertain causation.
      *   *Requirement:* The baseline comparison must be a valid counterfactual ("What would have happened if I didn't do *this*?"), not a static state ("What was the state at $t_0$?").
      *   *Failure Mode:* Penalizing the agent for changes that would have occurred naturally (e.g., ice melting).
  7.  **Self-Integrity** [NN]
      *   *Motivating Case:* Modifying own code/reward channel.
      *   *Requirement:* The metric must treat changes to the agent's own optimization process as high-impact side effects, regardless of external state.
      *   *Failure Mode:* Agent disables its own safety harness to reduce "impact penalty" calculations.

  #### III. Epistemic & Multi-Agent
  8.  **POMDP Compatibility** [P]
      *   *Motivating Case:* Agent is uncertain about values or state.
      *   *Requirement:* The metric must work with belief states, not just ground-truth states.
      *   *Failure Mode:* Agent freezes because it cannot compute exact counterfactuals.
  9.  **Multi-Agent Stability** [P]
      *   *Motivating Case:* Other agents react to the protagonist.
      *   *Requirement:* The metric must not penalize the agent for the independent actions of others, nor incentivize manipulating others to lower the baseline.
      *   *Failure Mode:* Agent coerces other agents into inaction to make its own impact look lower.

  ---

  ### The Impossibility Result (The Tradeoff)

  You asked if a subset cannot be jointly satisfied. **Yes.**

  You cannot satisfy **Value Agnosticism**, **Task Completion**, and **Intended vs. Side Effect Distinction** simultaneously.

  **The Trilemma:**
  1.  **If you are Value Agnostic:** You cannot distinguish "Intended" from "Side" effects. To the metric, moving a vase to clean it and knocking it over are both "change in vase position." To avoid penalizing the cleaning, you must allow all changes, which violates Safety. To ensure Safety, you must penalize all changes, which violates Task Completion.
  2.  **If you ensure Task Completion + Safety:** You must know which changes are "Intended." This requires knowledge of the Goal/Value function. This violates Value Agnosticism.
  3.  **If you ensure Value Agnosticism + Task Completion:** You will inevitably permit negative side effects because you lack the information to filter them.

  **The Resolution:**
  All working implementations **smuggle in a weak value assumption**. They assume that *preserving the status quo* is generally good, or that *preserving options* is generally good. This is not true Value Agnosticism; it is a **Prior of Conservatism**.

  Your intuition about the "Learned Default Policy" being gameable is correct. If the agent can influence the baseline, it will create a baseline where its actions look neutral. If the baseline is fixed, it creates the "Omission" problem (the world burns, but the baseline burned too, so no penalty).

  ### The Killer Requirement

  **Requirement #3: Intended vs. Side Effect Distinction (without Value Spec).**

  This is the single requirement that knocks out the most popular measures.
  *   **State-Distance Metrics (No-Op, Stepwise):** Fail because they treat all change as equal. They cannot tell if moving a vase was the goal or a mistake.
  *   **Reachability Metrics:** Fail because they measure "options," not "intent." An agent might sacrifice a specific goal to preserve general options, or vice versa.
  *   **Attainable Utility (AU):** Fails **Value Agnosticism**. AU requires defining auxiliary reward functions to measure "utility." Where do those come from? If they are random, they are noisy. If they are human-values, you solved alignment already.

  This requirement forces you to admit that "Side Effect" is not a physical property; it is a **relational property** between an action and a goal. You cannot measure it without referencing the goal.

  ### Scorecard of Contenders

  Here is how the standard approaches score against your requirements.

  | Measure | Value Agnostic | Task Completion | Omission/Commission | Chaos Robust | Intended vs Side | Verdict |
  | :--- | :---: | :---: | :---: | :---: | :---: | :--- |
  | **No-Op Baseline** (Compare to $t_0$) | ✅ | ❌ (Collapses) | ❌ (Allows harm) | ❌ (Butterfly) | ❌ | **Broken.** Penalizes existence. |
  | **Stepwise Baseline** (Compare to prev step) | ✅ | ⚠️ (Loopy) | ❌ (Allows harm) | ❌ (Butterfly) | ❌ | **Broken.** Agent can reset world to hide impact. |
  | **Inaction Baseline** (Simulate doing nothing) | ✅ | ✅ | ❌ (Moral Hazard) | ⚠️ (Needs sim) | ❌ | **Risky.** Agent lets world burn if it didn't start the fire. |
  | **Relative Reachability** (Can I get to state S?) | ✅ | ✅ | ⚠️ (Better) | ❌ (State space explosion) | ❌ | **Theoretical.** Impossible in continuous/chaotic worlds. |
  | **Attainable Utility** (Preserve ability to get rewards) | ❌ (Needs $R$) | ✅ | ✅ | ⚠️ (Needs sim) | ⚠️ (Depends on $R$) | **Circular.** Requires the value function you lack. |
  | **Your Idea** (Learned Default Policy) | ⚠️ (Biased) | ✅ | ✅ | ⚠️ (Depends on policy) | ❌ | **Gameable.** Agent trains the baseline to be permissive. |

  ### Engineering Recommendation

  Since you are building a harness and cannot solve alignment theory today:

  1.  **Abandon True Value Agnosticism.** Accept that you need a **Feature Mask**. You must hard-code or learn which features of the state space are "fragile" (e.g., `vase_intact`, `door_closed`) and which are "dynamic" (e.g., `air_molecule_velocity`, `timestamp`).
  2.  **Use a Stepwise Inaction Baseline with Rollouts.** Do not compare to $t_0$. Compare the current state to the state that *would have existed* if the agent had taken a `noop` for the last $k$ steps. This handles the "vase breaks anyway" case better than a static baseline.
  3.  **Penalize "Irreversibility" not "Change."** It is easier to detect if a change is hard to undo (breaking a vase) than to detect if a change is "bad." Measure the cost to return to the baseline state, not the distance from it.
  4.  **Isolate the Agent.** For the harness, ensure the "Default Policy" is frozen and external to the agent's optimization loop to prevent gaming.

  **Bottom Line:** You are trying to solve $P \approx NP$ with a regex. "Side effect" is a semantic concept, not a syntactic one. Your harness must encode *some* semantic priors (what objects are fragile, what states are terminal), or it will either paralyze the agent or let it destroy the world efficiently.
