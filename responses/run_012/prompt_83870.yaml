      *   *(b) Consent:* Is "no consent" separate or restatement? It's usually a separate argument (autonomy-based) but often conflated. Benatar's asymmetry is about *harm/benefit*, not *rights/consent*. Maya is conflating them. Dev is right that it's a non sequitur *within the context of the asymmetry argument*, though it supports antinatalism generally.

