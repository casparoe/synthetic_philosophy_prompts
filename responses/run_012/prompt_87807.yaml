      *   *Intrinsic Value of Understanding:* Economics usually treats skills as instrumental (means to an end). Philosophy often treats understanding as intrinsically valuable (constitutive of flourishing). Bending: Forcing intrinsic value into a utility function parameter. Loss: The claim that it's *constitutive* of agency, not just a preference.
