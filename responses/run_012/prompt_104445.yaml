answer: |-
  # Q&A Prep Sheet: Deflationary Church–Turing Thesis

  **Audience:** Logic/Computation, Phil Math, Quantum Info.
  **Strategy:** Do not defend the "pre-theoretic notion" as a metaphysical object. Defend it as a *practice* that precedes formalization. Your goal is to show that conflating the two readings obscures the normative work the thesis actually does.

  ### Concessions to Make at the Outset
  1.  **Admit the "Pre-Theoretic" is Fragile:** Concede that if "effective computability" is treated as a Platonist object, the Wittgensteinians win. Frame it instead as a *shared disciplinary practice* that exists prior to any specific formalism.
  2.  **Admit Equivalence Proofs Have Value:** Do not say they are worthless. Say they are *internal* to the formalisms and do not bridge the gap to the physical or the intuitive without extra premises.
  3.  **Admit Physical CTT is Idealized:** Concede that all physical theories idealize. Your point is not that idealization is bad, but that it renders the claim *methodological* rather than *empirical*.

  ---

  ### The Objections (Ordered by Damage Potential)

  #### 1. The Wittgensteinian Trap (The "Myth of the Pre-Theoretic")
  **Objection:** "You posit a 'pre-theoretic target' for the Catalogue reading to aim at. But on a later-Wittgenstein view, there is no determinate notion of 'effective procedure' outside the language games of the formalisms themselves. Your 'Catalogue' reading chases a ghost. If there's no antecedent notion, your distinction collapses, and the Constitutive reading is all there is."
  **Damage:** **Critical.** Destroys the basis of your dichotomy.
  **2-Minute Reply:** "I am not positing a Platonist object. I am pointing to a *practice*. Before Turing, mathematicians computed. They recognized valid steps without a formal definition. That practice is the 'target.' The formalisms didn't create the practice; they codified it. If you deny the practice exists, you cannot explain why Turing's analysis felt like a *discovery* rather than an *invention* to his contemporaries. My distinction captures the tension between the practice (Catalogue) and the codification (Constitutive). Denying the practice makes the history of computability unintelligible."
  **Candid Soft Spot:** You are relying on a historical/phenomenological claim ("it felt like a discovery") that is hard to verify against a rigorous philosophical claim ("meaning is use"). If they press on "use," you risk circularity.

  #### 2. The Unfalsifiability Boomerang
  **Objection:** "You argue the Physical CTT is unfalsifiable because it idealizes resource bounds. But the Catalogue reading is equally unfalsifiable because it idealizes the 'human computer.' If both are unfalsifiable universal generalizations, your asymmetry vanishes. Why is the Physical version 'hostage to physics' while the Catalogue version is 'epistemically distinct'?"
  **Damage:** **High.** Neutralizes your critique of the Physical CTT.
  **2-Minute Reply:** "The idealizations differ in kind. The Catalogue reading idealizes the *agent* (finite memory, no errors) but keeps the *physics* open. The Physical CTT idealizes the *physics* (continuous states, infinite precision) to fit the *computation*. The Catalogue claim is about the limits of *reasoning*; the Physical claim is about the limits of *nature*. My charge is that the Physical CTT hides empirical content behind mathematical idealization, whereas the Catalogue reading openly admits it is a universal generalization about reasoning procedures. One is a bet on physics; the other is a bet on logic."
  **Candid Soft Spot:** The line between "limits of reasoning" and "limits of nature" is blurry in quantum contexts. If a physical system computes something a Turing machine can't, is that a failure of logic or physics? You need to hold this line firmly.

  #### 3. The Constructivist Revisionism Charge
  **Objection:** "In constructive mathematics, 'effective' already has a precise sense (constructible functions). You treat 'effective' as vague to motivate your Catalogue reading. Isn't your analysis just a revisionist attempt to impose classical vagueness on a precise constructive notion?"
  **Damage:** **High.** Alienates the math-heavy contingent.
  **2-Minute Reply:** "Constructive mathematics fixes a *specific* sense of effective (e.g., intuitionistic provability). The Church–Turing Thesis, however, is used broadly across classical logic and computer science where that specific sense is not assumed. My claim is that when the thesis is invoked outside constructive settings, it functions as a bridge between the vague intuitive notion and the specific formalism. I am not revising the constructive notion; I am analyzing how the thesis functions when that precision is *not* presupposed."
  **Candid Soft Spot:** If they argue that *all* legitimate use of "effective" must be constructive, your "vague intuitive notion" looks like negligence. Be prepared to concede that constructive math avoids the problem you describe.

  #### 4. The Equivalence Proof Defense
  **Objection:** "You say equivalence proofs settle nothing about the Catalogue reading. But if five independent formalisms converge on the same extension, that *is* empirical evidence for the Catalogue claim. To say it 'assumes the target' is to ignore the inductive weight of convergence."
  **Damage:** **Medium.** Standard computability theorist pushback.
  **2-Minute Reply:** "Convergence is evidence only if the formalisms are independent *with respect to the target*. But they were all designed by people sharing the same pre-theoretic intuition. The convergence proves the formalisms are robust, not that they capture the 'real' extension. It shows we are good at building systems that match our intuition, not that our intuition is a fixed target. The inductive weight supports the *utility* of the formalisms, not the *truth* of the Catalogue claim."
  **Candid Soft Spot:** This sounds skeptical. You need to emphasize that you aren't denying the utility, just the logical force of the convergence as *proof*.

  #### 5. The Hypercomputation/Oracle Challenge
  **Objection:** "Quantum information and relativistic computing suggest models (oracles, supertasks) that exceed Turing computability. If the Physical CTT is unfalsifiable, how do you rule these out? Are you saying physics can't inform computation?"
  **Damage:** **Medium.** Specific to the quantum attendees.
  **2-Minute Reply:** "I am not ruling them out. I am saying that if such a model is physically realized, the Physical CTT fails, but the *logical* CTT remains intact. The Thesis distinguishes what is *computable* from what is *physically feasible*. If a supertask is possible, it changes our physics, not our definition of algorithm. My deflationary reading protects the logical thesis from being overturned by physical discovery. It keeps the domains separate."
  **Candid Soft Spot:** If they argue that "computation" is inherently physical (pancomputationalism), your separation of domains fails. You must insist on the normative definition of algorithm.

  #### 6. The Normative License Question
  **Objection:** "You say the thesis 'licenses us to stop arguing.' But stipulations don't grant licenses; authority does. What gives you the right to close the matter? If it's just a stipulation, why can't I stipulate that my neural net is a computer and you have to accept it?"
  **Damage:** **Medium.** Challenges the pragmatic core.
  **2-Minute Reply:** "The license comes from *consensus*, not authority. The thesis encodes a community agreement on what counts as a proof procedure. You can stipulate your neural net is a computer, but if it doesn't meet the criteria of the formalisms we've agreed upon, you aren't playing the same game. The thesis isn't a gatekeeper; it's the rulebook. I'm just pointing out that rulebooks are chosen, not discovered."
  **Candid Soft Spot:** This edges toward conventionalism. If they ask "Why this rulebook?", you need a pragmatic answer (it works), not a truth-claim.

  #### 7. The Conventionalism Coherence (Grad Student)
  **Objection:** "If the Constitutive reading is a stipulation (true/false irrelevant) and the Catalogue reading is unprovable, aren't you just a conventionalist? Is that position coherent, or does it undermine the objectivity of logic?"
  **Damage:** **Low/Medium.** Meta-philosophical nitpick.
  **2-Minute Reply:** "Conventionalism suggests anything goes. My view is that once the convention is adopted, the consequences are objective. We stipulate the rules of chess; whether a move is checkmate is then an objective fact. I am a conventionalist about the *framework*, not the *results*. The objectivity of logic survives because the formalisms are rigid, even if the choice to use them is pragmatic."
  **Candid Soft Spot:** Hard to maintain the line between "choice of framework" and "truth within framework" if the framework dictates what counts as truth.

  #### 8. The Framing Objection (Verbal Dispute)
  **Objection:** "This feels like a verbal dispute. Whether we call it a definition or a generalization, we use the Turing Machine the same way. What work does your distinction actually do?"
  **Damage:** **Low.** Dismissive.
  **2-Minute Reply:** "It changes how we respond to counter-examples. If it's a definition, a counter-example is impossible. If it's a generalization, a counter-example is a discovery. If it's a license, a counter-example is a proposal to change the language game. When quantum proponents claim hypercomputation, knowing which reading we are using tells us whether to check the physics, check the math, or check the definitions. That is practical work."
  **Candid Soft Spot:** If they say "We already know that," you look like you've wasted 20 minutes. Emphasize the *confusion* currently present in the literature.

  ---

  ### Framing vs. Thesis
  *   **Framing Objections:** #1 (Wittgenstein), #7 (Conventionalism), #8 (Verbal Dispute). These attack *how* you describe the situation, not the mathematical or physical claims.
      *   *Strategy:* Pivot to practice. "I am describing what we *do*, not what exists."
  *   **Thesis Objections:** #2 (Boomerang), #3 (Constructivist), #5 (Hypercomputation). These attack the core claims about physics and math.
      *   *Strategy:* Hold the line on the separation of domains (Logic vs. Physics).

  ### The Single Reply That Must Land
  **The "License" Justification (Objection #6).**
  If you cannot explain *why* we are licensed to stop arguing without appealing to truth, the deflationary reading looks like nihilism.
  **Key Phrase:** "The license is not epistemic; it is normative. It is not that the procedure *isn't* computation; it is that we have agreed not to call it that for the sake of clarity."

  ### The Question You Hope Nobody Asks
  **"If the Constitutive reading is a mere stipulation, what prevents us from stipulating a different formalism tomorrow that captures more? And if nothing prevents it, isn't the Thesis trivial?"**
  *   *Why it's dangerous:* It forces you to admit that the "Constitutive" reading is contingent on the current success of Turing Machines. If a better formalism arises, the Thesis changes. This undermines the "deflationary" stability you are arguing for.
  *   *Prepared Answer:* "Nothing prevents it. That is exactly my point. The Thesis is a snapshot of our current best codification. If a better one arises, we update the Thesis. Acknowledging this contingency is stronger than pretending the current formalism is metaphysically necessary."
