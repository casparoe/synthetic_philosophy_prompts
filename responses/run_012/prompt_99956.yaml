answer: |-
  Dear Student,

  I am writing to share my feedback on your short-answer exam regarding Strawson's Freedom and Resentment. I have awarded this response a grade of 6 out of 10. You have demonstrated a clear and accurate understanding of Strawson's terminology and the basic framework of his argument, but there are significant errors in your interpretation of his central philosophical conclusion regarding determinism and the pessimist.

  Your explanation of the distinction between the participant and objective attitudes is excellent and fully correct. You accurately identify that the participant attitude involves engagement in interpersonal relationships characterized by reactive attitudes such as resentment, gratitude, and indignation. You also correctly note that these are responses to the quality of will others show toward us. Furthermore, your description of the objective attitude as a stance of management or treatment, applicable to cases like severe mental illness or infancy, is precise and shows you have grasped the phenomenological side of Strawson's essay. You also correctly identify Strawson's critique of the optimist, noting that Strawson finds the utilitarian defense of responsibility inadequate because it ignores the interpersonal significance of our practices. These sections of your answer are strong and justify the credit you received for exegesis and definitions.

  However, the deduction in your grade comes from a fundamental misunderstanding of Strawson's response to the pessimist and his conclusion about the truth of determinism. You state that Strawson agrees with the pessimist that determinism, if true, would make resentment irrational, but that we cannot help having these attitudes anyway. This is incorrect. Strawson's core argument is that the reactive attitudes are not based on a belief in indeterminism in the first place. He argues that the truth of determinism is irrelevant to the rationality of our practices because these attitudes are grounded in human nature and social life, not in metaphysical theories about causation. He does not concede that determinism would make resentment irrational; rather, he argues that determinism does not threaten the rationality of resentment because the two operate on different levels.

  Consequently, your conclusion that Strawson argues determinism must be false is also incorrect. Strawson does not attempt to prove that determinism is false. He is offering a compatibilist argument, which means he aims to show that our practices of holding one another responsible are compatible with the truth of determinism. He suggests we can suspend judgment on the truth of determinism because it does not impact the justification of our reactive attitudes. By claiming Strawson concludes determinism is false, you have misidentified his philosophical position, turning him into an incompatibilist rather than the compatibilist he is understood to be. This is a crucial distinction because the prompt specifically asked whether Strawson thinks the truth of determinism would threaten our practice, and the correct answer is that he thinks it would not, not that he thinks determinism is false to avoid the threat.

  In summary, while your grasp of the specific concepts and the dialectic between the optimist and pessimist is commendable, the error regarding the compatibility of determinism and responsibility strikes at the heart of the essay's argument. I encourage you to review the section of the text where Strawson discusses the general framework of human life and how it renders the truth of determinism irrelevant to our justificatory practices. Please feel free to come to office hours if you would like to discuss this further.

  Best regards,

  Instructor
