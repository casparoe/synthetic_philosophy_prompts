answer: |-
  Case: Two neighbouring households (Principals) delegate maintenance decisions to property managers (Delegates). The managers simultaneously choose whether to Install solar panels (I) or Pass (P). The original game $G$ is a Prisoner's Dilemma with payoffs (in utility units): $(I,I) \to (3,3)$, $(P,P) \to (1,1)$, $(I,P) \to (0,5)$, $(P,I) \to (5,0)$. The unique Nash equilibrium is $(P,P)$ with payoff $(1,1)$. The transformation replaces $G$ with $G'$, where the Principals pre-commit to install a shared battery storage link if and only if both managers choose $I$. This link creates a synergy value of $+1$ for each household exclusively in the $(I,I)$ outcome. The new payoff matrix is: $(I,I) \to (4,4)$, $(P,P) \to (1,1)$, $(I,P) \to (0,5)$, $(P,I) \to (5,0)$.

  **Verification**

  **Assumption Set:** We assume **Strategy Identity**. The delegates in $G'$ face the same action labels $\{I, P\}$ as in $G$, and we assume that for any strategy profile $s \in \{I, P\}^2$ selected by the delegates in $G$, the corresponding profile $s$ is permitted and yields the new payoffs in $G'$. We make no assumptions about which profile will be selected, nor do we assume the delegates are rational or aware of the payoff change.

  **Contingency Check:**
  1.  **Contingency $(P,P)$:** In $G$, payoff is $(1,1)$. In $G'$, payoff is $(1,1)$. $1 \ge 1$ for both. (Weakly better).
  2.  **Contingency $(I,I)$:** In $G$, payoff is $(3,3)$. In $G'$, payoff is $(4,4)$. $4 > 3$ for both. (Strictly better).
  3.  **Contingency $(P,I)$:** In $G$, payoff is $(5,0)$. In $G'$, payoff is $(5,0)$. $5 \ge 5$ and $0 \ge 0$. (Weakly better).
  4.  **Contingency $(I,P)$:** In $G$, payoff is $(0,5)$. In $G'$, payoff is $(0,5)$. $0 \ge 0$ and $5 \ge 5$. (Weakly better).

  The transformation is weakly better in all permitted contingencies and strictly better in $(I,I)$, which is a contingency permitted in the original game. The payoff at the unique equilibrium $(P,P)$ is exactly unchanged.

  **Feature Dependence**

  The safety of this transformation depends entirely on **Conditional Payoff Augmentation**. The extra value (+1) is triggered *only* by mutual cooperation. If this feature is removed such that the augmentation becomes unconditional (e.g., the battery is installed regardless of choices), the payoff at $(P,P)$ rises to $(2,2)$. This violates Constraint 3 (equilibrium payoffs must remain exactly as they were). If the feature is removed such that the augmentation disappears entirely, the transformation becomes the identity, violating Constraint 5 (non-vacuity). Thus, safety relies on the augmentation being strictly contingent on the non-equilibrium outcome.

  **Contrast with Naive Proposal**

  A naive observer would propose that the Principals simply instruct their delegates to "Play $I$." This proposal is unavailable under the stated assumptions because the setup specifies **delegation**. The Principals select the game, but the Delegates select the move. Constraint 4 forbids "binding agreement available within the original game" or "communication during play." An instruction to play a specific move removes the delegate's agency, effectively collapsing the game into a single outcome by fiat rather than transforming the interaction structure. The SPI construction respects the delegation by altering the incentives/environment while leaving the choice set intact.

  **Strongest Objection**

  A critic would argue that the improvement lives entirely in a contingency $(I,I)$ that rational equilibrium analysis predicts will never occur. Since $(P,P)$ remains the unique dominant-strategy equilibrium in $G'$, rational delegates will not realize the gain. Therefore, the improvement is stipulative: it relies on the delegates making an "error" (playing $I$) relative to their own incentives.

  To care about this improvement, a Principal must believe there is a non-zero probability that the delegates will play $(I,I)$ despite it not being an equilibrium. This belief is reasonable if one rejects the assumption of common knowledge of rationality or acknowledges that delegates may coordinate on focal points, follow social norms, or make errors. The SPI does not promise the improvement will be realized; it promises that *if* the delegates coordinate on $(I,I)$ (for whatever reason), the Principals capture extra value without risking the baseline security of the $(P,P)$ outcome. The assumption set (Strategy Identity) does the work of ensuring safety, but the *value* of the transformation depends on the Principals' uncertainty about delegate rationality.

  **Limits**

  All requirements 1 through 5 are met exactly. However, the construction relies on the Principals' ability to engineer the payoff structure (the battery link) without affecting the non-cooperative outcome. In some physical or economic contexts, value-creating synergies may unavoidably alter the disagreement point (the $(P,P)$ payoff), which would violate Constraint 3. Additionally, the case assumes the Principals can verify the delegates' actions to trigger the synergy; if monitoring is imperfect, the payoff structure becomes stochastic, complicating the "safe" guarantee.
