answer: |-
  Here is a menu of the distinct claims hidden behind the slogan "history is locked in," ordered from the trivial to the controversial. Each entry specifies what the claim commits you to, followed by a verdict on its status and whether it licenses your friend's conversation-stopping move.

  1.  **The Tautology of the Past**
      *   **Claim:** Events that have already occurred cannot be undone.
      *   **Commitment:** **Past.** (The timeline is fixed.)
      *   **Obstacle:** Logic/Time.
      *   **World vs. Explanation:** About the world (metaphysically trivial).
      *   **Verdict:** **Platitude.** No one can sensibly deny this, but it does not explain *why* a specific standard won, only that the choice was made. It does **not** license your friend's move, as it says nothing about whether a better alternative was possible or inevitable.

  2.  **The Switching Cost Claim**
      *   **Claim:** Moving to a different standard now would require resources (money, time, effort) we are unwilling to spend.
      *   **Commitment:** **Present.** (Current inertia.)
      *   **Obstacle:** Economic Cost.
      *   **World vs. Explanation:** About the world (empirical).
      *   **Verdict:** **Substantive and Defensible.** This is often true (e.g., replacing all keyboards is expensive). However, it does not answer your question about the *origin* (was it a fluke?). It licenses your friend's move only if you redefine your question from "Was this inevitable?" to "Are we stuck now?"

  3.  **The Coordination Trap**
      *   **Claim:** A better alternative exists, but we cannot reach it because we cannot agree to move simultaneously.
      *   **Commitment:** **Present.** (Current social inertia.)
      *   **Obstacle:** Coordination Failure.
      *   **World vs. Explanation:** About the world (game-theoretic).
      *   **Verdict:** **Substantive and Defensible.** This explains persistence without claiming the original choice was best. It does **not** license your friend's move, because it admits a better arrangement is available, keeping the normative debate alive.

  4.  **The Contingent Origin (*Technical Sense: Path Dependence*)**
      *   **Claim:** **[*Technical Sense Required]*:** Small, random early events were amplified by "increasing returns" (network effects), causing an inferior option to beat a superior one. Had the early random events differed, the outcome would differ.
      *   **Commitment:** **Past & Counterfactual.** (Sensitivity to initial conditions.)
      *   **Obstacle:** Historical Accident + Network Effects.
      *   **World vs. Explanation:** About the world (causal history).
      *   **Verdict:** **Substantive and Defensible.** This is the rigorous economic definition (associated with Brian Arthur or Paul David). It asserts **contingency**. It does **not** license your friend's move; in fact, it validates your side of the argument that an "early accident" explains the outcome.

  5.  **The Structural Necessity**
      *   **Claim:** Given the underlying constraints of technology and human nature, we would have arrived at this specific arrangement no matter how the early events had gone.
      *   **Commitment:** **Counterfactual.** (Insensitivity to initial conditions.)
      *   **Obstacle:** Structural/Physical Laws.
      *   **World vs. Explanation:** About the world (deterministic).
      *   **Verdict:** **Probably False.** In technology standards, this is rarely true (e.g., Dvorak vs. QWERTY). If true, it renders the concept of "path dependence" void. It **would** license your friend's move, but only by asserting a strong determinism that is hard to prove.

  6.  **The Epistemic Surrender**
      *   **Claim:** We cannot know whether a better alternative was possible or whether the outcome was inevitable, so we must treat the current state as the only relevant reality.
      *   **Commitment:** **Explanation.** (Limits of our knowledge.)
      *   **Obstacle:** Ignorance/Complexity.
      *   **World vs. Explanation:** About the limits of explanation.
      *   **Verdict:** **Conversation Closer.** This is likely what your friend is actually using. It is not a claim about the world, but a pragmatic refusal to investigate counterfactuals. It licenses the move by changing the subject from truth to utility.

  ***

  ### Sorting Out the Confusions

  You asked specifically to resolve two tensions regarding how these slogans are used. Here is the breakdown you can take to your friend.

  **1. Contingency vs. Necessity**
  You are correct to suspect that the slogan is doing double duty. In rigorous terms, **"Path Dependence" asserts contingency** (Reading #4), while **"Lock-In" asserts necessity** (Reading #2 or #3).
  *   **The Conflict:** Your friend is using the *necessity* of the present (we can't leave now) to imply the *necessity* of the past (it had to happen this way). These are not compatible. One can be "locked in" to a result that was entirely accidental.
  *   **The Resolution:** If he means "Path Dependence," he must admit the outcome was a fluke (supporting your view). If he means "Lock-In," he is only talking about switching costs (ignoring your view). He cannot use the difficulty of leaving *now* to prove the inevitability of arriving *then*.

  **2. Denial vs. Affirmation of "Could Have Gone Otherwise"**
  *   **Readings #1, #2, #3, and #4** all affirm that things could have gone otherwise (either logically, economically, or historically).
  *   **Reading #5** is the only one that denies things could have gone otherwise.
  *   **The Diagnosis:** Your suspicion is correct. You are likely using "history is locked in" to mean Reading #4 (Contingent Origin: *we are stuck with a fluke*), while your friend is using it to mean Reading #5 or #6 (Structural Necessity or Epistemic Surrender: *it doesn't matter what could have happened*). You are using the same words to describe incompatible ideas: one highlights the fragility of history, the other highlights its solidity.

  **Recommendation:**
  If you want to resume the argument, ask him to choose between Reading #4 and Reading #5. If he chooses #4, you win (it was an accident). If he chooses #5, he bears the burden of proof (why was it physically impossible to choose the rival?). If he retreats to #6, he has admitted he is ending the conversation for pragmatic reasons, not historical ones.
