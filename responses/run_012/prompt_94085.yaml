answer: |-
  **Project Title:** Interventionist Individuation of Dispositions: Beyond Finks and Masks

  **Abstract**
  The metaphysics of dispositions has reached a stalemate. For decades, the literature has been defined by a defensive posture: proposing an analysis of dispositional properties, only to have it dismantled by a new class of counterexamples involving finks, masks, and mimics. The Simple Conditional Analysis (SCA) is widely acknowledged as insufficient, yet successor theories struggle to provide a principled criterion for disposition identity that avoids ad-hocery. This project proposes a shift in framework. Drawing on resources from the philosophy of science—specifically interventionist accounts of causation and mechanistic explanation—I argue that dispositions should be individuated not by their manifestation conditionals, but by the intervention profile of their categorical bases. I will test this hypothesis against a novel class of cases involving dynamic mechanistic reorganization, such as catalysts that alter their internal structure upon stimulation while maintaining the same output. The goal is to determine whether an interventionist criterion can resolve indeterminacies where standard metaphysical tools fail.

  **Research Question and Significance**
  The central research question is determinate: *Does the identity of a disposition track the invariance of the intervention profile of its categorical basis, even when the stimulus-manifestation conditional remains constant?*

  Standard metaphysics treats dispositions as properties defined by what they *do* (manifestations) given a specific *trigger* (stimulus). When the link between trigger and outcome is disrupted or mimicked, we are forced to ask if the disposition is still present. The prevailing assumption is that disposition individuation is tied to the possible manifestations. My proposal challenges this. I argue that a disposition is individuated by *how* the categorical base responds to a range of ideal interventions, not merely by the output of the stimulus-manifestation pair.

  This matters because the current literature is stuck in a cycle of counterexample generation. Without a robust criterion for individuation, we cannot say whether a finkish case involves the loss of a disposition or the prevention of its manifestation. By importing the interventionist framework, we treat dispositions less like logical conditionals and more like causal capacities embedded in a mechanism. This aligns metaphysics with scientific practice, where properties are often identified by their role in a causal network rather than their surface-level behavior. If successful, this project offers a way to dissolve the fink/mask debate rather than solving it within the existing, exhausted parameters.

  **Critique of Existing Positions**
  To justify this new approach, I must demonstrate why current leading theories cannot settle the question, particularly regarding the "Shape-Shifting Catalyst" case that motivates this project.

  *The Simple Conditional Analysis (SCA)* fails immediately. The SCA reduces dispositions to counterfactual conditionals (if stimulated, then manifest). In the catalyst case, the stimulus is applied, and the manifestation occurs. However, the internal pathway changes. The SCA cannot distinguish between the catalyst operating via its standard mechanism and the catalyst reorganizing itself to produce the same result via a different route. For the SCA, the disposition is identical because the conditional is true. But scientifically, we might want to say the causal power has changed even if the output hasn't. The SCA lacks the resolution to see inside the black box.

  *Dispositional Essentialism* fares better by tying dispositions to the essence of the property, but it faces a dilemma here. If the essence is tied to the manifestation type, the essentialist must say the disposition is preserved. If the essence is tied to the specific causal pathway, the disposition is lost. However, essentialism typically lacks the resources to explain *why* one pathway is essential and another is not, other than by stipulation. It risks dogmatism: asserting identity without a criterion for verifying it. It tells us what the disposition *is*, but not how to track it through structural changes in the base.

  *Causal Basis Views* come closest to my proposal. They argue that a disposition is grounded in a categorical base. However, standard causal basis views focus on the *presence* of the base at the time of stimulation. They ask: "Is the base there?" They do not sufficiently ask: "What is the structural stability of this base under intervention?" In the Shape-Shifting Catalyst case, a categorical base exists at $t_0$ and a categorical base exists at $t_1$ (when the reaction occurs). A standard causal basis view might struggle to determine if the base at $t_1$ is the *same* disposition-grounding property as at $t_0$, or a new one that merely mimics the effects. Without an interventionist account of the base's stability, the causal basis view collapses back into checking for the manifestation.

  My project fills this gap. By defining the disposition via the *intervention profile* of the base, I can ask: If I intervene on the specific structural features of the catalyst, does the outcome change in predictable, invariant ways? If the catalyst reorganizes such that interventions on the original structural features no longer affect the outcome, the intervention profile has shifted. Therefore, the disposition has changed, even if the manifestation remains. This provides a principled, non-stipulative answer where the SCA sees identity and Essentialism sees ambiguity.

  **Methodology and Work Plan**
  This project will be executed over a nine-month fellowship period. The methodology is conceptual analysis informed by scientific case studies. I will not be conducting experiments, but rather analyzing existing models in chemistry and biology to construct rigorous philosophical thought experiments.

  *Months 1–2: Literature Synthesis and Case Formalization*
  I will complete a targeted review of the post-2010 fink/mask literature to ensure no recent hybrid views pre-empt my proposal. Simultaneously, I will formalize the "Shape-Shifting Catalyst" case. I need to ensure this is not just a complex mask or fink. I will consult with researchers in catalytic chemistry to ensure the physical possibility of a catalyst that reorganizes upon substrate approach to catalyze the same reaction via a distinct mechanistic route. The output of this phase will be a precise description of the case study to be used as the primary test bed.

  *Months 3–4: Developing the Interventionist Criterion*
  Here I will construct the positive account. I will adapt the interventionist account of causation (roughly Woodward-style) to apply to property individuation. I need to define what counts as an "ideal intervention" on a categorical base in a metaphysical context. I will draft the core argument: Disposition $D_1$ is identical to $D_2$ if and only if the intervention profile of their bases is invariant. I will work through the implications for multi-track dispositions and ensure the view doesn't collapse into a causal theory of properties that eliminates dispositions entirely.

  *Months 5–6: Stress-Testing Against Standard Counterexamples*
  A new theory must handle the old data. I will apply the interventionist criterion to classic fink and mask cases. For example, in a standard fink case (a wire that loses conductivity when touched), the intervention profile of the base changes drastically upon stimulus. My account should classify this as a disposition loss, aligning with intuition. In a mask case (fragile glass wrapped in foam), the base remains interventionally stable, but the pathway to manifestation is blocked. My account needs to distinguish the mask from the fink without appealing to the conditional. I will write two draft papers during this period: one on the catalyst case, one on the general application to finks/masks.

  *Months 7–8: Integration and Dissertation Scoping*
  I will revise the drafts into a single cohesive manuscript. I will also evaluate how this project fits into my broader dissertation. Since my background is in philosophy of science, I will assess whether this metaphysical framework can be extended to special science kinds (e.g., biological functions as dispositions). This month involves expanding the scope from fundamental metaphysics to naturalized metaphysics.

  *Month 9: Final Polish and Dissemination*
  Final editing of the fellowship paper. I will prepare a version for submission to a top-tier general philosophy journal and a version for a philosophy of science venue. I will also present the work at a departmental workshop to gather feedback before external submission.

  **Conditions for Failure**
  Intellectual honesty requires defining what would constitute failure for this project.
  1.  **Triviality:** If the "intervention profile" turns out to be just a verbose restatement of the "causal basis," the project adds no value. If I cannot specify an intervention on the base that isn't just a description of the base's presence, the criterion is empty.
  2.  **Over-generation:** If the interventionist criterion is so sensitive that it individuates dispositions too finely (e.g., every minor micro-physical variation counts as a new disposition), it loses utility for scientific generalization. If the catalyst case results in "no disposition" because the micro-structure shifted, but science treats it as the same catalytic power, my metaphysics conflicts with scientific practice.
  3.  **Circularity:** If defining the "appropriate interventions" requires prior knowledge of which dispositions are present, the account is circular. I must be able to specify the intervention profile independently of the disposition identity.

  If any of these occur, I will pivot. The most likely pivot is to retreat from a full theory of individuation to a more modest claim: that interventionism is a necessary *constraint* on disposition theories, even if not a sufficient condition for individuation.

  **Scope and Dissertation Viability**
  Is this a term paper or a dissertation? It is too substantial for a standard term paper. The integration of interventionist causation with disposition metaphysics requires a depth of argumentation that exceeds seminar limits. However, as a standalone project, it is likely the size of one or two journal articles rather than a full monograph.

  For the dissertation, this project serves as the foundational "core chapter." A dissertation in this area typically requires three papers. This project constitutes the first paper: the positive metaphysical account. The second paper would apply this to a specific scientific domain (e.g., dispositional explanations in biology), and the third would address objections regarding normativity or modality. Therefore, this fellowship project is the start of the dissertation, not the whole of it. It establishes the theoretical machinery that the rest of the thesis will utilize.

  Success here means producing a manuscript that is publishable in a journal like *The Journal of Philosophy* or *Philosophy of Science*. It means demonstrating that the fink/mask debate can be dissolved by changing the underlying assumptions about property individuation. By leveraging my background in philosophy of science, I can offer a metaphysics that is not only logically coherent but scientifically respectable. This project moves the conversation from "how do we save the conditional analysis?" to "what kind of property is a disposition such that it supports scientific reasoning?" That is a shift worth funding.
