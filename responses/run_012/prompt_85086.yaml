          *   *Prediction:* Modern terrorism *might* fit, but Beccaria was wary of state overreach.
          *   *Nuance:* If the state is stable (not on the verge of losing liberty), does the exception hold? Beccaria's exception is extremely narrow (existential threat to the state itself).
          *   *Verdict:* He would likely reject most modern applications. The exception is a fissure, but he would try to seal it. Only if the prisoner can literally topple the government from jail would he concede.

      *   **4. Dignity:**
          *   *Beccaria's Logic:* Enlightenment rationalism, utilitarianism, contract theory. "Human dignity" as a standalone metaphysical right is more Kantian/modern HR law.
