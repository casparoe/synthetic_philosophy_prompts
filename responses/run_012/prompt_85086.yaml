  5.  **Evaluate the User vs. Friend:**
      *   *Friend:* Desert/Retribution. Beccaria explicitly rejects this. Punishment is not about what is "owed" to the criminal but what is necessary for society.
      *   *User:* Epistemology (what we can know) and Moral Anthropology (what we become).
