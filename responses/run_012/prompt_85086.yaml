          *   *Nuance:* He says the state killing is a "war of a whole nation against a citizen." That sounds like dignity, but it's framed as political legitimacy.
          *   *Verdict:* Alien vocabulary, but he would recognize the underlying claim that the state oversteps its bounds. He grounds it in political right, not metaphysical dignity.

      *   **5. Deterrence (Empirics):**
          *   *Beccaria's Logic:* Psychological thesis (duration > severity).
          *   *Prediction:* He would welcome empiricism (he was part of the Enlightenment scientific turn).
          *   *Nuance:* If data showed death *did* deter more, would he change? His *principle* argument (no right to kill) stands independent of utility.
