          *   *Verdict:* He would likely vindicate the *substitution* of death for long imprisonment, but might be troubled by the *conditions* (isolation vs. public labor) if they cease to serve as a public example or violate the humanity surrendered to the compact. He would likely see it as a lesser evil, but perhaps not a perfect solution if it becomes purely warehousing.

