      *   *Idea:* A target doesn't *stop* telling you about the thing; it just tells you *less* or *differently*.
      *   *Cost:* You have to accept that the metric is now a noisy signal, not a truth. You need to calibrate for the gaming.
      *   *Benefit:* Keeps the utility of metrics but acknowledges the degradation.

