      *   Is it real? Yes, theoretically.
      *   Is it useful here? No, because in a depot, a window *becomes* a whip via management pressure.
      *   *Verdict:* The user is holding onto a distinction that doesn't solve the friend's practical problem. The friend is right to dismiss it as "comfortable."

