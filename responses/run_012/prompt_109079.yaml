answer: |-
  # The Role-First Glyph Protocol (RFGP)

  **Premise:** A letterform is not a drawing; it is a function. Its primary obligation is to perform a specific role within the system of contrasts that constitutes the alphabet. Its secondary obligation is to wear the skin of the specific style (weight, contrast, terminal) without breaking that system.

  **Usage:** Run this protocol on every glyph before sign-off. Do not proceed to the next step until the current step is passed.

  ### Phase 1: The Skeleton (Identity)
  **Question:** Does this glyph retain the structural ductus and proportional DNA required to be recognized as this character, regardless of style?
  *   **Test:** Strip the style. Remove serifs, normalize weight, remove contrast. Does the underlying skeleton still read as the target character?
  *   **Pass:** The skeleton is unmistakable.
  *   **Fail:** **STOP.** The glyph is rejected. It cannot be styled into identity.
  *   **Hand-off:** None. This is objective.

  ### Phase 2: The Neighborhood (Systemic Contrast)
  **Question:** Does this glyph maintain sufficient contrast against its primary confusables within this specific family?
  *   **Test:** Place the glyph next to its neighbors (e.g., 'a' next to 'o', 'n' next to 'h', '1' next to 'l'). View at intended text size.
  *   **Pass:** The eye distinguishes them instantly without cognitive pause.
  *   **Fail:** **STOP.** The glyph is rejected. Identity is relational; if it blends into a neighbor, it has failed its role.
  *   **Hand-off:** If the distinction relies on a specific stylistic feature (e.g., a tail on 'Q') that is not yet defined in the style guide, hand off to Style Lead.

  ### Phase 3: The Skin (Stylistic Consistency)
  **Question:** Does this glyph adhere to the set of decisions applied to the rest of the alphabet for this specific style?
  *   **Test:** Check terminals, axis of contrast, serif structure, and joinery against the control characters (usually 'n', 'o', 'H', 'O').
  *   **Pass:** The decisions are consistent.
  *   **Fail:** **Proceed to Hand-off.** If the inconsistency is accidental, fix it. If the inconsistency is intentional, move to Phase 4.
  *   **Hand-off:** **Taste Boundary.** If the designer argues that breaking consistency here creates a necessary exception for legibility or balance, this is no longer a procedural decision. It must be decided by the Sign-off Authority based on whether the exception strengthens the system or weakens it.

  ### Phase 4: The Texture (Contextual Performance)
  **Question:** Does the glyph contribute to an even color and rhythm in running text (or its intended display context)?
  *   **Test:** Set the glyph in a paragraph of the intended size and leading.
  *   **Pass:** The glyph disappears into the texture; it does not spot or hole.
  *   **Fail:** **STOP.** The glyph is rejected. A letter that draws attention to itself in text has failed its role.
  *   **Hand-off:** If the "spotting" is due to the inherent nature of the style (e.g., a high-contrast display face), verify this is within the declared scope of the style. If the style is sold as "Text," this is a Fail.

  ***

  ## What This Procedure Cannot Decide
  This protocol cannot judge **innovation**. If a design proposes a new role for a letter (e.g., a lowercase 'a' that intentionally mimics an 'o' to create a specific code-like aesthetic), this procedure will reject it as a failure of identity. This procedure protects the system; it does not nurture the avant-garde. It cannot measure "beauty," "voice," or "cultural resonance." It can only measure fitness for purpose within the defined constraints.

  ***

  ## Case Studies

  ### Case 1: The Near-Circular 'a'
  **Context:** A geometric sans. The 'a' is constructed from a perfect circle with an aperture so tight it nearly closes.
  **Protocol Run:**
  1.  **Skeleton:** Pass. It is structurally an 'a'.
  2.  **Neighborhood:** **Fail.** In the geometric weight, the 'o' is also a perfect circle. At 10pt, the near-closed aperture of the 'a' fills in optically, making it indistinguishable from the 'o'.
  3.  **Verdict:** **REJECT.**
  4.  **Rationale:** The role of the 'a' is to be distinct from the 'o'. The underlying design logic (geometry) cannot supersede the system of contrasts. The aperture must be opened, even if it violates the perfect circular construction.
  5.  **Hand-off:** None. This is a functional failure.

  ### Case 2: The Immaculate 'a' with Contradictory Terminal
  **Context:** A humanist sans. The 'a' is beautifully balanced in isolation. However, its terminal is a flat horizontal cut, while every other letter in the family (including the 'c', 'e', 'r') uses a diagonal, teardrop terminal.
  **Protocol Run:**
  1.  **Skeleton:** Pass.
  2.  **Neighborhood:** Pass. It is distinct from 'o' and 'e'.
  3.  **Skin:** **Fail.** The terminal decision contradicts the established style rules.
  4.  **Hand-off:** **Taste Boundary.** The designer argues that a diagonal terminal on the 'a' creates a visual hole that disrupts the specific weight of this cut. They argue this is a necessary exception for texture.
  5.  **Verdict:** **REJECT (The Verdict You Will Not Like).**
  6.  **Rationale:** You asked for a procedure that enforces "a style is a set of decisions applied consistently." This procedure cannot validate exceptions based on "visual holes" unless that exception is codified as a new rule for all similar junctions. To approve this 'a' is to admit that the style guide is subjective. The 'a' must be redrawn to match the terminal logic of the 'c' and 'e'. The beauty of the single glyph is subordinate to the integrity of the family.
  7.  **Note:** I know you love this glyph. I know it reads beautifully in isolation. But under this protocol, it is a system error.

  ### Case 3: The Display 'a' That Collapses in Text
  **Context:** A high-contrast display cut. The 'a' has an extremely thin connection between bowl and stem. In isolation at 72pt, it is unmistakable. In small running text (e.g., 12pt), the connection vanishes, and the bowl becomes a detached dot or merges with the stem, looking like an 'o' with a stray mark.
  **Protocol Run:**
  1.  **Skeleton:** Pass (at display size).
  2.  **Neighborhood:** Pass (at display size).
  3.  **Skin:** Pass.
  4.  **Texture:** **Fail.** The prompt states it collapses in small running text.
  5.  **Verdict:** **CONDITIONAL PASS / SCOPE RESTRICTION.**
  6.  **Rationale:** This procedure tests fitness for role. If this style is marketed as "Display Only," the small text test is out of scope. However, if this family is sold as a unified system where users might mix Display headings with Text body, this glyph poses a risk.
  7.  **Decision:** If the foundry markets this strictly as **Display**, the glyph **PASSES**, provided the minimum size limit is enforced in documentation. If the foundry markets this as a **Text** family, the glyph **FAILS**.
  8.  **Hand-off:** **Sign-off Authority.** You must decide the commercial scope of the font. The procedure cannot decide marketing strategy. If you allow text use, you must reject the glyph. If you restrict it to Display, you may accept it.

  ***

  ## Summary of Limitations
  You will notice that in Case 2, the procedure demanded the destruction of a "perfect" glyph to satisfy a rule. This is the cost of systematization. The procedure treats the typeface as a machine, not a gallery. It will not tell you if the family has soul. It will not tell you if the 'a' in Case 2 is actually *more* legible despite breaking the rule (unless you can prove it in Phase 2).

  If you want to approve the "Immaculate 'a'" despite the terminal mismatch, you are admitting that **Taste** overrides **System**. That is your prerogative as the Sign-off Authority, but you must record it as an exception, not a precedent. The moment you record it as a precedent, the procedure breaks, and you return to making calls by eye.
