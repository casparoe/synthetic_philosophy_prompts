      *   *Trichotomy (Standard Orthodoxy/Incommensurability):* If A isn't better than B, and B isn't better than A, and they aren't equal, they are incomparable. If they are comparable, one *must* be better, even if we don't know which (epistemic uncertainty). Calling it "parity" just masks the fact that reason runs out.

