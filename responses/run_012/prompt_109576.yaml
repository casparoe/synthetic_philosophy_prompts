      *   *Draft:* "If we fix the computation problem, have we fixed the awareness problem?"

  7.  **Scope Limitations:**
      *   Don't cover: Dynamic Epistemic Logic (DEL) in depth, Probabilistic approaches, Full Doxastic Logic distinctions (just stick to Knowledge for simplicity, noting the difference), Hintikka's original text in detail.

