      *Refining the Misconception on Accessibility:* Students often think if we make $R$ transitive or not, it changes closure. It doesn't. Closure comes from the truth condition ($K\phi$ true at $w$ iff $\phi$ true at all $v$ such that $wRv$). If $\phi$ is true at all $v$, and $\phi \to \psi$ is true at all $v$, then $\psi$ is true at all $v$. This holds regardless of $R$'s properties. I need to make sure this is highlighted.

