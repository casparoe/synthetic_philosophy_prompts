      *   *Specific Choice:* **The "Cryptarithm" or "Logic Puzzle" style.** No, keep it strictly propositional. Let's use a **long chain of conditionals** where the agent accepts each link but hasn't traced the chain to the end.
      *   *Wait, a better one:* **The "Unknown Tautology".** Let $\phi$ be a complicated instance of a tautology (e.g., a large instance of Peirce's Law or a complex substitution instance of $p \to p$).
      *   *Actually, the prompt asks for "knows premises, inference valid... plainly does not know conclusion".*
      *   *Selected Example:* **The "Long Deduction" Case.**
          *   Premises: $P_1, P_1 \to P_2, P_2 \to P_3, \dots, P_{99} \to P_{100}$.
          *   Conclusion: $P_{100}$.
          *   Agent: Accepts all premises (perhaps they are given by a trusted source), but hasn't sat down to do the 99 steps of Modus Ponens.
          *   Why this works: It's purely propositional. It's clearly valid. It's clearly humanly possible to know premises without conclusion (boredom, time, attention).
      *   *Why not Arithmetic?* Arithmetic involves *mathematical* truth, not just *logical* truth. It conflates logical omniscience with mathematical omniscience. It also often requires first-order logic, complicating the semantics. We want to isolate *logical* closure.

  4.  **Map Misconceptions:**
      *   1. *Harmless Idealisation (Frictionless Plane).*
          *   *Surface:* Early, when deriving the theorem.
          *   *Nature:* Substantive position (idealisation defence).
          *   *Handling:* Let it stand but flag limits. It works for knowledge *norms*, fails for knowledge *attribution*.
      *   2. *Restricting Worlds (Accessibility).*
          *   *Surface:* When trying to fix the semantics.
          *   *Nature:* Misreading. Changing $R$ affects $K\phi \to KK\phi$ (KK) or reflexivity, not closure ($K\phi \land K(\phi \to \psi) \to K\psi$).
          *   *Handling:* Head it off immediately with a proof sketch. Closure holds in *all* normal modal logics (K and up).
      *   3. *Inconsistent Beliefs.*
          *   *Surface:* When discussing non-closure.
          *   *Nature:* Substantive worry (rationality).
          *   *Handling:* Distinguish *occurrent* belief from *dispositional* commitment.
      *   4. *Impossible Worlds.*
