          *   *Nature:* Misreading (often thought to be just 'weird' possible worlds).
          *   *Handling:* Clarify they violate logical laws *within* the world, not just accessibility.

  5.  **Awareness vs. Computation:**
      *   This is a crucial distinction (often associated with Fagin & Halpern or Konolige).
      *   *Awareness:* The proposition isn't in the agent's vocabulary/conceptual repertoire.
      *   *Computation:* The proposition is entertained, but the derivation hasn't been performed.
