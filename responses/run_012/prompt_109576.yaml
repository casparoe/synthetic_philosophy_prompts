      *   **Key Constraints:**
          *   Determine the order of introduction (semantics first vs. intuition first).
          *   Select a *single carrying example* (must be propositional, valid but non-obvious inference, agent knows premises but not conclusion). Explain why standard examples (arithmetic axioms) are bad.
          *   Map misconceptions (frictionless plane, restricting worlds, inconsistent beliefs, impossible worlds nature). Identify where they surface, if they are misreadings or substantive, and how to handle them.
          *   Introduce a specific distinction: Failure of *Awareness* vs. Failure of *Computation*. Map repairs to these failures.
