  **The question**
  The core question is whether the physical structure of spacetime forces us to abandon the idea that only the present is real. Specifically, does the relativity of simultaneity entail a "block universe" where past, present, and future events exist equally? This project seeks to decide whether the standard philosophical defense against this conclusion—that "now" is merely a perspective, like "here"—successfully protects the reality of temporal passage. What would settle this is not new empirical data, but a rigorous separation of semantic claims from metaphysical ones. If the defense relies only on how we use words, the block universe stands. If it relies on a substantive asymmetry between how space and time are given to observers, the argument requires revision. The project will determine which premise of the relativistic argument is vulnerable and whether defending our ordinary experience of time requires rejecting established physical interpretations or merely clarifying their scope. Ultimately, the goal is to establish whether the conflict between physics and experience is genuine. Settling this means producing a clear criterion for when a physical theory dictates metaphysical reality, ensuring claims about the unreality of the future are not based on linguistic confusion. This conceptual clarity is the necessary precondition for progress.

  **Why the question is open**
  The question remains open because the standard reply conflates language with reality. Critics argue that denying the reality of the future is not like denying the reality of distant places; "now" is indexical, so different observers having different "presents" does not imply all times are real. However, this analogy assumes space and time are symmetric regarding existence. No one thinks my location makes distant places unreal, but temporal experience suggests the future is genuinely open, not just unseen. The objection fails unless there is a metaphysical asymmetry between spatial and temporal access that is rarely stated explicitly. My hypothesis is that the objection hides a substantive claim about which regions of spacetime are "given" to an observer, not just a semantic point about tensed sentences. If "here" and "now" are truly analogous, the block universe follows; if they differ, the difference must be identified. The asymmetry might lie in causal access: I can influence the future but not the past, whereas I can move to distant places. But relativity complicates this, as influence is limited by light cones. Furthermore, intermediate positions attempt to keep the past real and the future open while accepting relativity. These views struggle because Minkowski spacetime lacks a global "present" surface. Without a shared now, it is unclear what "open" means or to whom the future is open. Is the future open for me but real for you? If reality is frame-dependent, the notion of an objective open future collapses. These are not technical inconveniences but threats to the coherence of objective becoming. A view that cannot say what is becoming real fails to describe a world. Until we clarify whether the indexical reply masks a hidden premise or whether intermediate views can define openness without a global present, the metaphysical implications of relativity remain unresolved. The current literature talks past itself, using semantic solutions to solve metaphysical problems. This project forces the debate onto substantive ground, requiring critics to state exactly what asymmetry protects the present. Without this, the defense of temporal passage is merely an assertion.

  **Approach and method**
  I will proceed through conceptual analysis and argument reconstruction rather than empirical investigation. The work is divided into three stages over six months of partial release. Months one and two focus on the primary argument. I will formalize the inference from relativity to the block universe, isolating the premise targeted by the indexical objection. I will test whether the spatial analogy holds by examining the asymmetry of causal access. I will distinguish between the deflationary semantic point and the substantive metaphysical claim. Months three and four address the second strand: intermediate views. I will analyze attempts to maintain an open future within relativistic constraints, identifying where they fail to define a coherent "present" for becoming. This connects to the first strand because both depend on the same underlying issue: whether a local notion of simultaneity can support metaphysical reality. If the indexical objection fails, intermediate views lose their footing; if it succeeds, they require a new formulation. The connection is the definition of reality across spacetime regions. Months five and six are for synthesis and writing. I will integrate the findings to either strengthen the block universe argument or map the exact cost of denying it. The method is strictly philosophical: clarifying definitions, testing logical consistency, and evaluating metaphysical commitments. This makes progress by resolving conceptual confusions that currently stall debate, ensuring that physicists and philosophers are not talking past one another regarding what the theory actually implies about reality. This approach ensures that the conclusions rest on logical necessity rather than empirical speculation, which is crucial for a project without laboratory components. The output is a unified argument, not two separate papers.

  **What success and failure would look like**
  Success looks like a decisive mapping of the dialectic. Ideally, I will demonstrate that the indexical objection fails, strengthening the case for the block universe, or pinpoint the exact substantive premise critics must deny, clarifying the cost of that denial. For the second strand, success is showing why intermediate views are incoherent or sketching a defensible version that survives relativistic constraints. Success means the panel can see exactly what is bought and what is sold in each position. The value lies in narrowing the field of viable theories. Failure would look like remaining within the current ambiguity. If the project ends by showing that the disagreement is merely verbal with no metaphysical payoff, or if I cannot specify what denying the argument costs elsewhere, the project will not have achieved its goal. An honest statement of failure is producing a paper that reiterates the stalemate without advancing the criteria for resolution. The goal is not to prove one side right empirically, but to ensure that whichever view is held, it is held for clear, justified reasons. If the output does not sharpen the choices available to metaphysicians and scientists, it has not succeeded. I must avoid the risk of producing a nuanced but inconclusive survey.

  **Scope, timeline, and risks**
  The scope is limited to the metaphysical implications of special relativity, excluding general relativity and quantum mechanics to ensure feasibility. The timeline covers six months at one-third release time. The primary risk is that the analysis of intermediate views becomes too complex, threatening the completion of the paper. If the project runs long, I will cut the second strand. The primary argument regarding the block universe and the indexical objection will remain the core deliverable, while the analysis of intermediate positions will be reduced to a brief discussion or deferred to future work. This ensures the main question is answered even if the secondary exploration is truncated. There are no empirical risks, as the work is conceptual. The deliverable is a single substantial paper suitable for a top journal in metaphysics or philosophy of science, providing clarity on a foundational issue connecting physics and philosophy. This justifies the funding by promising conceptual progress where empirical methods cannot reach.
