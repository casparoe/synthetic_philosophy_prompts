prompt: |-
  I run a reading group on anthropics and decision theory — about 14 people, 90 minutes. I want to design an in-class game that makes them feel the split between the self-sampling assumption and the self-indication assumption, and then spring the presumptuous philosopher on them. The setup I have in mind: a coin flip decides whether the universe contains 1 observer or 10. Participants are randomly assigned to be one of those observers, but they don't know how many observers there are. They just know they exist. Then they have to bet on whether the coin was heads or tails. I want the payoffs arranged so that someone reasoning with the self-sampling assumption bets one way and someone using the self-indication assumption bets the other. Then, after they've committed, I reveal the coin and we debrief. The punchline is that the self-indication assumption lets you infer from your existence alone that the universe is probably large, and if you push it, that it's infinite — which is the presumptuous philosopher. I definately need a runnable activity: rules, materials, a payoff scheme that doesn't need real money, and a debrief that maps what happened onto the formal distinction. Also tell me what will predictably go wrong the first time I run it, and be honest about which feature of the idea the activity can't reproduce. Please write in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested activity:

  1.  **Analyze the Request:**
      *   **Context:** Reading group on anthropics and decision theory (14 people, 90 minutes).
      *   **Goal:** Design an in-class game to illustrate the split between the Self-Sampling Assumption (SSA) and the Self-Indication Assumption (SIA), leading into the "Presumptuous Philosopher" thought experiment.
      *   **Core Mechanism:** Coin flip determines universe size (1 observer vs. 10 observers). Participants are assigned as observers. They bet on the coin outcome based on their existence.
      *   **Requirements:** Runnable activity (rules, materials, payoff scheme without real money), debrief mapping to formal theory, prediction of failure modes, honest limitations.
      *   **Tone/Style:** British English.

  2.  **Deconstruct the Theory:**
      *   **SSA (Self-Sampling Assumption):** Reason as if you are a random sample from the set of *actual* observers in your reference class.
          *   Scenario: Heads = 1 observer, Tails = 10 observers.
          *   Prior: 50/50.
          *   Likelihood of *me* existing: 1 in both cases (assuming I'm guaranteed to exist in the reference class).
          *   Wait, standard SSA usually says $P(Heads | I exist) = P(I exist | Heads)P(Heads) / P(I exist)$. If "I" am a specific pre-identified soul, $P(I exist | Heads) = P(I exist | Tails)$. So SSA often yields 50/50 *unless* we define the reference class differently (e.g., "people in this room").
          *   *Correction for the game:* To make SSA favor Heads (Small Universe), we need the "Centered World" approach. If there is 1 person, the chance *this* specific seat is occupied is higher than if there are 10 people spread out? No, that's not quite right.
          *   *Standard Doomsday/SSA logic:* If Heads = 1 person, Tails = 10 people. I am a random person.
          *   SSA: $P(Heads | Me) \propto P(Me | Heads)P(Heads)$. If "Me" is just "an observer", $P(Me | Heads) = 1$ and $P(Me | Tails) = 1$. This leads to 50/50.
          *   *Wait, the prompt asks for SSA and SIA to bet differently.*
          *   SIA: Favors larger universes because there are more "slots" for you to exist in. $P(Me | Tails) = 10 \times P(Me | Heads)$. So SIA bets Tails (Large).
          *   SSA: To make SSA bet Heads (Small), we need the "Doomsday Argument" structure. Usually, this involves ranking observers (1 to N). If you find you are observer #1, SSA says N is likely small.
          *   *Alternative SSA interpretation:* The "Self-Sampling Assumption" in the context of the Sleeping Beauty problem or similar often leads to the "Halfer" position (50/50), whereas SIA leads to the "Thirder" position (favoring Tails/Waking).
          *   *Let's refine the betting:*
              *   **SIA:** "I exist. There are more observers if Tails. Therefore, I am more likely to exist if Tails." -> Bet Tails.
              *   **SSA:** "I am a random sample from the actual observers. The prior is 50/50. My existence doesn't update the probability because I was guaranteed to exist in *some* capacity." -> Bet Heads (or stick to 50/50, but to make a game, we need a divergence).
              *   *Actually, the classic divergence:*
                  *   SIA: $P(Tails) = 10/11$.
                  *   SSA: $P(Tails) = 1/2$ (Halfer).
              *   To make them bet *opposite* ways, we need payoffs.
              *   If Payoff(Heads) > Payoff(Tails), SSA might take Heads, SIA might take Tails.
              *   *Better approach:* Use the "Presumptuous Philosopher" setup directly.
              *   Scenario: Theory A (1 billion observers), Theory B (1 trillion observers). Priors equal.
              *   SIA: Theory B is $1000 \times$ more likely.
              *   SSA: Theory A and B are equally likely (50/50).
              *   For the game (1 vs 10):
                  *   SIA: $P(Tails) = 10/11 \approx 91\%$.
                  *   SSA: $P(Tails) = 1/2 = 50\%$.
              *   To make them bet differently, set the odds. E.g., "Bet on Heads pays 2:1, Bet on Tails pays 1:1".
              *   SSA (50/50): Expected Value Heads = $0.5 \times 2 = 1$. EV Tails = $0.5 \times 1 = 0.5$. -> Bet Heads.
              *   SIA (91/9): EV Heads = $0.09 \times 2 = 0.18$. EV Tails = $0.91 \times 1 = 0.91$. -> Bet Tails.
              *   *Perfect.* This creates the conflict.

  3.  **Drafting the Activity:**
      *   **Name:** "The Cosmic Coin Toss".
      *   **Materials:** Coins, slips of paper, scorecards (points, not money).
      *   **Setup:**
          *   Facilitator flips coin.
          *   Heads: 1 participant is "awake" (selected).
          *   Tails: 10 participants are "awake" (selected).
          *   Crucial detail: Participants don't know *which* round it is or if they are the only one. They just know they are in the room.
          *   Wait, if 14 people are in the room, and only 1 is "awake" on Heads, how do the others participate?
          *   *Modification:* Everyone is always in the room. The coin determines how many *copies* of the group exist, or how many *seats* are valid.
          *   *Simpler version (Sleeping Beauty style):*
              *   Coin Heads: 1 person is chosen to play.
              *   Coin Tails: 10 people are chosen to play.
              *   Problem: If you aren't chosen, you aren't there to bet.
              *   *Solution:* All 14 are present. The coin determines the "Universe Size".
              *   Heads: Only 1 seat in this universe is "real". (Randomly assign 1 person).
              *   Tails: 10 seats are "real". (Randomly assign 10 people).
              *   Everyone thinks they are real.
              *   *Wait, this is getting complicated to administer.*
              *   *Standard "Incubator" thought experiment:*
              *   Step 1: Coin flip.
              *   Step 2: Create rooms. Heads = 1 Room (Room 1). Tails = 10 Rooms (Room 1-10).
              *   Step 3: Put an observer in every room.
              *   Step 4: You wake up in a room. What is the probability of Heads?
              *   *Adaptation for Class:*
              *   All 14 students are "potential observers".
              *   Coin Flip (Hidden).
              *   Heads: Randomly select 1 student to receive a "You Exist" card.
              *   Tails: Randomly select 10 students to receive a "You Exist" card.
              *   Those who don't get a card sit out (or close eyes).
              *   *Problem:* If you sit out, you can't bet.
              *   *Fix:* Everyone gets a card, but the card says "You are Observer #X".
              *   Heads: Only Observer #1 is created.
              *   Tails: Observers #1 to #10 are created.
              *   If you are #5 and Heads was flipped, you don't exist.
              *   *But if you don't exist, you aren't there to bet.*
              *   *The "God's Eye" vs "Internal" view:* The game must simulate the *feeling* of existence.
              *   *Best Classroom Approximation:*
                  *   Tell students: "A coin was flipped. If Heads, 1 person in this room is a 'Real Observer'. If Tails, 10 people are 'Real Observers'. You have been told you are a Real Observer. Bet on the coin."
                  *   This removes the selection bias of who gets to play. Everyone plays, everyone is told "You exist".
                  *   SSA: "I was guaranteed to be told I exist if I'm in the reference class. Probability is 50/50."
                  *   SIA: "There are 10x more slots for me to be in on Tails. Probability is 10/11."
      *   **Payoff Scheme:** Needs to force the split.
          *   Bet Heads: Win 5 points if Heads, 0 if Tails.
          *   Bet Tails: Win 1 point if Tails, 0 if Heads.
          *   SSA (50%): EV(Heads) = 2.5, EV(Tails) = 0.5. -> Choose Heads.
          *   SIA (91%): EV(Heads) = 0.45, EV(Tails) = 0.91. -> Choose Tails.
      *   **Execution:**
          *   Round 1: Run the game.
          *   Reveal Coin.
          *   Calculate scores.
          *   Debrief.

  4.  **Addressing the "Presumptuous Philosopher":**
      *   After the game, explain that SIA implies we should believe we are in a vastly larger universe *a priori*.
      *   If Theory A = 1 billion observers, Theory B = 1 trillion. SIA says B is a trillion times more likely.
      *   This allows physicists to rule out theories just because they predict fewer observers, without empirical data. Hence "Presumptuous".

  5.  **Predicting Failure Modes:**
      *   **Confusion about "Existence":** Students might think "But I'm obviously here, so I exist." The counterfactual "If Heads, I wouldn't be here" is hard to grasp when you *are* here.
      *   **Groupthink:** They might just copy the loudest person.
      *   **Payoff Ignorance:** They might ignore the points and bet on what feels "true".
      *   **Reference Class:** They might argue about whether they are a "random observer".
      *   **The "Impossible" Counterfactual:** You can't simulate non-existence in a classroom. If Heads was flipped, the 9 people who "wouldn't exist" in the Tails world are still sitting there. This breaks the analogy.
      *   **Honest Limitation:** The activity cannot reproduce the *ontological* weight of non-existence. In the game, losers still get points (or zero points). In reality, non-existence means no experience.

  6.  **Refining the Plan (Self-Correction):**
      *   *Issue:* If I tell everyone "You exist", SSA proponents will argue "My existence gives no info". SIA proponents argue "My existence is more likely in Tails".
      *   *To make SSA bet Heads:* I need to ensure the payoffs make Heads attractive at 50% probability.
      *   *To make SIA bet Tails:* I need to ensure payoffs make Tails attractive at 91% probability.
      *   *The "1 vs 10" ratio:*
          *   SIA Probability Tails = 10/11 (~91%).
          *   SSA Probability Tails = 1/2 (50%).
          *   Payoff Heads: 3 points. Payoff Tails: 1 point.
          *   SSA EV: Heads (1.5) > Tails (0.5). Bet Heads.
          *   SIA EV: Heads (0.27) < Tails (0.91). Bet Tails.
      *   *Wait, one nuance:* SSA usually requires a specific reference class. If the reference class is "People in this room", and everyone is in the room regardless...
      *   *Better framing:* "Imagine there are two possible universes. In Universe H, there is 1 conscious being. In Universe T, there are 10. You are a conscious being. Which universe are you in?"
      *   *Classroom constraint:* We can't make 9 people vanish.
      *   *Workaround:* Use the "Lottery" method.
          *   Hand out 14 tickets.
          *   Coin Flip.
          *   Heads: 1 winning ticket drawn.
          *   Tails: 10 winning tickets drawn.
          *   If you hold a winning ticket, you are an "Observer".
          *   *Problem:* If you hold a losing ticket on Tails, do you exist?
          *   *Fix:* Stick to the "God's Eye" instruction. "Assume you are a random observer sampled from the available slots." It's a thought experiment enacted physically. Don't over-engineer the physical selection, rely on the *instruction* to frame the anthropic reasoning.
          *   *Actually, the "Incubator" variant is best for class:*
          *   Tell them: "I flipped a coin. If Heads, I created 1 room with 1 person (you). If Tails, I created 10 rooms with 1 person each (one of which is you). You find yourself in a room. Bet."
          *   This avoids the "why are there 14 of us" issue. We are all simulating the *same* observer position in parallel.

  7.  **Finalising the Activity Structure:**
      *   **Intro (10 mins):** Explain SSA vs SIA simply.
      *   **The Game (20 mins):** The "Incubator" bet.
      *   **The Reveal (10 mins):** Who won points?
      *   **The Twist (10 mins):** The Presumptuous Philosopher.
      *   **Debrief (30 mins):** Discussion.
      *   **Buffer (10 mins):** Overrun.
      *   **Total:** 90 mins.

  8.  **Drafting the Content (incorporating British English):**
      *   "Programme" not "Program".
      *   "Centre" not "Center".
      *   "Realise" not "Realize".
      *   "Maths" not "Math".
      *   Tone: Academic but playful.

  9.  **Addressing the "What will go wrong" section:**
      *   Students treating it as a normal probability puzzle (ignoring the anthropic bit).
      *   The "Non-Existence" problem (you can't simulate not being there).
      *   Reference class disputes.

  10. **Review against constraints:**
      *   14 people? Yes.
      *   90 mins? Yes.
      *   SSA vs SIA split? Yes (via payoffs).
      *   Presumptuous Philosopher? Yes.
      *   British English? Yes.
      *   Honest limitations? Yes.

  11. **Final Polish:** Ensure the payoff math is crystal clear so the facilitator can explain it quickly.
      *   SSA: $P(H) = 0.5$. Payoff H=3, T=1. EV(H)=1.5, EV(T)=0.5. Pick H.
      *   SIA: $P(H) = 1/11, P(T) = 10/11$. Payoff H=3, T=1. EV(H)=3/11 (~0.27), EV(T)=10/11 (~0.91). Pick T.
      *   This works perfectly.

  12. **Wait, one check on SSA:** Does SSA *always* say 50/50 in the 1 vs 10 case?
      *   SSA says: Reason as if you are a random sample from the set of *actual* observers.
      *   If Heads: Set = {Obs1}. I am Obs1. Prob = 1.
      *   If Tails: Set = {Obs1...Obs10}. I am one of them. Prob = 1 (assuming I am guaranteed to be in the set).
      *   So $P(Evidence|H) = 1$, $P(Evidence|T) = 1$. Posterior = Prior = 50/50.
      *   Yes, this is the "Halfer" position in Sleeping Beauty terms.
      *   SIA says: Weight by number of observers. $P(Evidence|T) = 10 \times P(Evidence|H)$. Posterior = 10/11.
      *   Okay, the math holds.

  13. **Writing the response.** (Proceed to generate output based on these thoughts).
answer: |-
  Here is a complete lesson plan for your reading group. It is designed to be run in 90 minutes with 14 participants.

  # Activity: The Incubator Wager

  **Objective:** To physically enact the divergence between the Self-Sampling Assumption (SSA) and the Self-Indication Assumption (SIA), culminating in the "Presumptuous Philosopher" objection.
  **Time:** 90 minutes.
  **Participants:** 14 people.
  **Materials:**
  *   1 large coin (or a digital randomiser projected on a screen).
  *   14 printed "Scorecards" (A5 paper).
  *   14 pens.
  *   A whiteboard or flipchart.
  *   Small prizes (optional, e.g., chocolates) or a "bragging rights" leaderboard.

  ---

  ## Part 1: Setup and Instructions (15 minutes)

  **1. The Narrative Frame**
  Gather the group. Explain that they are not 14 students in a room, but 14 instantiations of a single conscious agent in a thought experiment.

  > "Imagine a cosmic Incubator. A coin is flipped.
  > *   **Heads:** The machine creates **1** conscious observer in a red room.
  > *   **Tails:** The machine creates **10** conscious observers, each in identical red rooms.
  >
  > You wake up in a red room. You know the rules. You do not know how many other rooms exist. You simply know: *I am here.*"

  **2. The Wager**
  Hand out the Scorecards. Explain that they must place a bet on the coin flip. To make the theoretical split visible, the payoffs are asymmetrical.

  *   **Option A (Bet Heads):** If the coin is Heads, you win **3 points**. If Tails, **0 points**.
  *   **Option B (Bet Tails):** If the coin is Tails, you win **1 point**. If Heads, **0 points**.

  **3. The Constraint**
  Tell them they must reason strictly from their current perspective ("I exist"). They cannot collude. They have 5 minutes to write down their bet and a one-sentence justification on the card.

  *Facilitator Note:* Do not reveal the coin flip yet. Collect the cards in a box.

  ---

  ## Part 2: The Reveal and Scoring (15 minutes)

  **1. The Flip**
  Flip the coin visibly. Let us assume, for the sake of the narrative tension, it lands on **Tails** (the large universe). *Note: If it lands Heads, the debrief changes slightly, but Tails is more dramatic for SIA.*

  **2. Scoring**
  Ask for a show of hands for who bet Heads and who bet Tails.
  *   If Tails: Award points to the Tails-bettors.
  *   If Heads: Award points to the Heads-bettors.

  **3. The Immediate Reaction**
  Ask the losers: "Why did you bet that way?"
  *   The **SSA group** (likely betting Heads for the higher payoff) will argue: "The prior was 50/50. My existence didn't change the odds. The 3-to-1 payoff made Heads the rational expected-value choice."
  *   The **SIA group** (likely betting Tails despite the lower payoff) will argue: "I am ten times more likely to find myself existing in a Tails universe. The probability was roughly 91% Tails. The safe bet was Tails."

  ---

  ## Part 3: The Debrief and Theory Mapping (30 minutes)

  Draw two columns on the whiteboard: **SSA** and **SIA**.

  **1. Formalising the Intuition**
  Walk through the maths they just felt.
  *   **SSA (Self-Sampling Assumption):** Treat yourself as a random sample from the set of *actual* observers.
      *   $P(\text{Heads}) = 0.5$.
      *   $P(\text{Tails}) = 0.5$.
      *   Expected Value (Heads Bet) = $0.5 \times 3 = 1.5$.
      *   Expected Value (Tails Bet) = $0.5 \times 1 = 0.5$.
      *   **Decision:** Bet Heads.
  *   **SIA (Self-Indication Assumption):** Treat yourself as a random sample from the set of *possible* observers, weighted by the number of observers.
      *   There are 10x more 'slots' for you to occupy in Tails.
      *   $P(\text{Heads}) = 1/11 \approx 9\%$.
      *   $P(\text{Tails}) = 10/11 \approx 91\%$.
      *   Expected Value (Heads Bet) = $0.09 \times 3 = 0.27$.
      *   Expected Value (Tails Bet) = $0.91 \times 1 = 0.91$.
      *   **Decision:** Bet Tails.

  **2. The Crucial Distinction**
  Highlight that SSA treats "I exist" as background information (no update). SIA treats "I exist" as evidence favouring hypotheses with more observers.

  ---

  ## Part 4: The Presumptuous Philosopher (20 minutes)

  Now, spring the trap.

  **1. The Scaling Up**
  Ask the SIA winners: "You bet on the larger universe because it had 10 observers instead of 1. What if the numbers were different?"
  *   **Theory A:** The universe contains 1 billion observers.
  *   **Theory B:** The universe contains 1 trillion observers.
  *   Priors are equal (50/50).

  **2. The Implication**
  Under SIA, Theory B is **one thousand times more likely** than Theory A, simply because it has more observers.
  > "If you accept SIA, you don't need telescopes. You can sit in an armchair and rule out any physical theory that predicts a 'small' population of observers. You can infer the size of the cosmos from your own existence alone."

  **3. The Punchline**
  Introduce Nick Bostrom's **Presumptuous Philosopher**.
  > "A philosopher walks into a physics lab. The physicists are debating two theories of the multiverse. Theory 1 predicts $10^{24}$ observers. Theory 2 predicts $10^{36}$ observers. The philosopher says: 'You don't need to run the experiment. SIA tells me Theory 2 is a trillion times more likely. I win.'
  >
  > This seems absurd. It allows metaphysics to trump empirical science."

  **4. Discussion Question**
  Ask the group: "Is this a *reductio ad absurdum* of SIA, or is it simply a counter-intuitive truth we must accept? If SIA is wrong, where did the betting game go wrong?"

  ---

  ## Part 5: Limitations and Failure Modes (10 minutes)

  Be honest with the group about the activity's constraints.

  **1. What Will Predictably Go Wrong**
  *   **The 'Freeloader' Problem:** Some participants will ignore the anthropic reasoning and simply maximise expected value based on a gut feeling of 50/50, choosing Heads for the 3 points. They will claim they are 'pragmatists', muddying the SSA/SIA split.
  *   **Reference Class Disputes:** Participants may argue, "But I know I'm in this room with 13 other people, so I know there are at least 14 observers." You must firmly enforce the 'Incubator' frame: *Imagine* you are the only one who knows the rules.
  *   **Groupthink:** If one vocal person shouts "It's obviously Tails!", the data will skew. Collect the bets secretly on paper to prevent this.

  **2. The Feature You Cannot Reproduce**
  *   **Non-Existence:** In the game, everyone exists regardless of the coin flip. In the true thought experiment, if Heads is flipped, the 9 extra observers *do not exist*. They do not sit in the room losing points; they are never conceived.
  *   **Why this matters:** It is cognitively impossible for a human to simulate "not existing". Participants will reason from the perspective of "I am here, what is the probability?" rather than "What is the probability I am here?". This subtly biases everyone towards SIA, making the SSA position feel unnatural.

  ---

  ## Facilitator's Cheat Sheet

  **Key Definitions for the Board:**
  *   **SSA:** $P(H|E) = \frac{P(E|H)P(H)}{P(E)}$. Since $P(E|H) = P(E|T) = 1$ (I exist in both), Posterior = Prior.
  *   **SIA:** Weights hypotheses by the number of observers $N$. $P(H|E) \propto N_H \times P(H)$.

  **Managing the Payoffs:**
  If you find the group is too split, adjust the points live *before* they bet.
  *   To force SSA to Heads: Make Heads payoff > 2x Tails payoff.
  *   To force SIA to Tails: Keep Tails payoff $\ge$ 1x Heads payoff.

  **British English Check:**
  *   Ensure you say "programme" not "program".
  *   "Realise" not "Realize".
  *   "Centre" not "Center".
  *   "Maths" not "Math".
  *   "Whist" or "Chocolates" for prizes, not "Candy".

  ## Closing Thought
  End the session by asking: "If SIA makes us presumptuous philosophers, does SSA make us doomsayers?" (Briefly mention the Doomsday Argument as the SSA counterpart to Presumptuous Philosopher, leaving them with homework for the next session).
