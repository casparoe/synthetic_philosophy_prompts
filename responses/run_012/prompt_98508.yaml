      *   **Core Thesis:** Propensity is a relational disposition of a "chance setup" (token arrangement + degrees of freedom + test procedure). Single-case objective chance. Reference class problem is a feature, not a bug. Conditional propensities are denied (conditional probability is derived). Application to stat mech (macrostate dispositions).
      *   **Audience:**
          *   2 Subjective Bayesians (1 hard, 1 moderate).
          *   1 Hard Frequentist Statistician.
          *   1 Historian of Science (19th/20th century focus).
          *   6-7 Grad Students (influenced by the above).
      *   **Deliverable:** Q&A prep sheet. 8-9 specific objections ordered by likelihood/damage. Phrased in the voice of the specific audience members. 2-minute replies + honest vulnerability assessment. Advice on concessions. One "dreaded question" at the end.
      *   **Constraints:** No reading lists/citations. Don't pull punches (be critical of the user's view if needed).

  2.  **Deconstruct the User's Position (Strengths & Weaknesses):**
      *   *Strength:* Grounded in physical practice (chem/stat mech). Relational view solves some "intrinsic property" issues. Single-case fits quantum/decay intuition.
      *   *Weakness 1 (Reference Class):* Calling it a "feature" looks like relativism. If probability depends on the description, is it still *objective*?
      *   *Weakness 2 (Conditional Probability):* Denying conditional propensities is a bold move (Humphreys' Paradox territory). How do you handle updating or physical dependencies without it?
      *   *Weakness 3 (Metaphysics):* Frequentists will hate the "disposition" talk as unobservable. Bayesians will ask why we need it if credence works.
      *   *Weakness 4 (History):* Historian will pounce on anachronism regarding "propensity" or "chance setup."
      *   *Weakness 5 (Stat Mech):* Connecting single-case propensity to ensemble behavior in stat mech is tricky (ergodicity, etc.).

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The Frequentist):* Needs to attack the "ghost in the machine." Why posit a disposition when frequencies work?
