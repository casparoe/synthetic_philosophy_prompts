      *Wait, better:* The "Reference Class is a Feature" claim is the most unique part. The killer question is: "If the propensity depends on the *description* (degrees of freedom), and descriptions are human choices, how is the propensity *objective*?" This strikes at the heart of the realism claim.

      *Let's finalize the list.*
