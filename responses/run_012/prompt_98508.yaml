answer: |-
  # Q&A Prep Sheet: Propensity as Relational Disposition

  **Context:** Philosophy of Science Reading Group
  **Time Allocation:** 60 minutes
  **Your Stance:** Relational Propensity (Token + DOF + Test), Single-Case, No Conditional Propensities, Reference Class = Feature.

  ---

  ### 1. The "Predictive Work" Objection (The Frequentist Statistician)
  **Likelihood:** Certain | **Damage:** High
  **Voice:** "Look, I deal with data. I need to know what this buys me."
  **The Question:** "You say propensities are real properties of a 'chance setup.' But your setup includes the 'degrees of freedom treated as relevant.' That sounds like a model choice, not a physical fact. If the probability changes when I change my model, but the physical token stays the same, what predictive work is the propensity doing that the frequency distribution of the model output isn't already doing? Why add the metaphysical ghost?"

  **Two-Minute Reply:**
  "The frequency is the *manifestation*, the propensity is the *generator*. In kinetics, we distinguish between the rate constant and the observed rate. The rate constant exists even if we don't run the reaction long enough to get a stable frequency. My view captures the single-case reality of a decaying atom or a specific reaction trajectory that frequentism cannot address because it requires an infinite long run. The 'model choice' isn't arbitrary; it's constrained by the physical interaction between the token and the apparatus. The propensity predicts the *stability* of the frequency under repeated testing of that specific setup."

  **Vulnerability Note:**
  This is soft. The Frequentist will retort that you only *know* the rate constant via frequencies. If the propensity varies with the "degrees of freedom treated as relevant," and that treatment is up to the scientist, you've smuggled epistemic choice into an ontological claim. You risk sounding like you're just rebranding "model-dependent probability" as "real disposition."

  ### 2. The "Objectivity Trap" Objection (The Moderate Bayesian)
  **Likelihood:** Very High | **Damage:** Critical
  **Voice:** "I'm willing to accept objective chance, but your definition worries me."
  **The Question:** "You claim the reference-class problem is a feature, not a bug. You say propensity is relative to the level of description (the degrees of freedom). But if the value of the propensity depends on a human choice of description, in what sense is it *objective*? It sounds like you've saved objectivity by defining it as 'relative to a description,' which makes it subjective in all but name."

  **Two-Minute Reply:**
  "The *choice* of description is pragmatic, but the *value* of the propensity given that description is not. Once we fix the chance setup (token + DOF + test), the propensity is fixed by the world, not by us. Think of it like mass: 'Mass' depends on choosing a frame of reference in relativity, but within that frame, the mass is an objective fact. I'm arguing for a relativized objectivity, not a subjective one. The world constrains which descriptions yield stable propensities."

  **Vulnerability Note:**
  **Be careful here.** This is your weakest philosophical joint. The analogy to relativity is tempting but dangerous. In relativity, the frame is physical (velocity). In your view, the "degrees of freedom treated as relevant" sounds like a cognitive boundary. If I ignore a degree of freedom that is physically coupled, does the propensity change? If yes, your ontology is fragile. If no, then the description doesn't matter, and you're back to standard propensity.

  ### 3. The "Humphreys' Paradox" Objection (A Sharp Grad Student)
  **Likelihood:** High | **Damage:** High
  **Voice:** "I read the literature on propensity problems."
  **The Question:** "You deny that conditional propensities are propensities at all. But consider a physical process where A causes B. There is a propensity for the setup to produce B given A. But by Bayes' theorem, we can calculate P(A|B). If propensities aren't conditional, what is P(A|B)? Is it just a degree of belief? How can a physical theory rely on a mix of objective propensities and subjective conditionals without breaking?"

  **Two-Minute Reply:**
  "I distinguish between *physical production* and *logical inference*. A propensity is a disposition to *produce* an outcome. P(B|A) might reflect a physical production if A is the setup. P(A|B) is an inverse inference about the setup given the outcome—it's epistemic, not ontological. I'm not denying the math of conditional probability; I'm denying that every conditional probability corresponds to a physical disposition. This avoids Humphreys' Paradox, where propensities seem to violate the axioms of probability when inverted."

  **Vulnerability Note:**
  Hard to defend cleanly. If P(A|B) is purely epistemic, but P(B|A) is ontological, you have a dualism in your probability concept. Critics will argue this makes probability theory disjointed. You need to hold firm that *causation* is asymmetric, so *propensity* must be asymmetric, even if the *calculus* is symmetric.

  ### 4. The "Empty Ontology" Objection (The Hard Bayesian)
  **Likelihood:** High | **Damage:** Medium
  **Voice:** "Save us the metaphysics."
  **The Question:** "If I can make all my predictions, run all my experiments, and update my credences using standard probability calculus without ever invoking a 'disposition,' why should I believe they exist? You're positing a causal power that is only accessible via the very frequencies it's supposed to explain. Isn't this just a 'dormitive virtue' explanation?"

  **Two-Minute Reply:**
  "Because science aims at truth, not just prediction. We posit electrons and fields not just because they predict pointer readings, but because we believe they constitute the world. Propensities are the probabilistic analogue to fields. In statistical mechanics, the disposition of a macrostate explains *why* the system evolves toward equilibrium, not just *that* it does. Without the disposition, the approach to equilibrium is a miraculous coincidence of initial conditions. With it, it's a physical law."

  **Vulnerability Note:**
  This relies on scientific realism. If the Bayesian is an instrumentalist, you won't convince them. Don't try to. Just assert that your view offers a better explanation of *stability* in nature than instrumentalism does.

  ### 5. The "Anachronism" Objection (The Historian of Science)
  **Likelihood:** Medium | **Damage:** Low (but annoying)
  **Voice:** "Let's be careful with terms."
  **The Question:** "You're applying this to statistical mechanics. But when Boltzmann or Gibbs spoke of probability, they were often speaking about our ignorance of microstates, not a physical disposition. Are you retrofitting a 20th-century Popperian concept onto 19th-century physicists who were explicitly trying to reduce chance to mechanics?"

  **Two-Minute Reply:**
  "I'm not making a historical claim about what Boltzmann *thought* he was doing. I'm making a philosophical claim about what his theory *requires* to work. Even if Boltzmann thought he was describing ignorance, the success of the theory relies on the physical fact that certain macrostates have a disposition to evolve in specific ways regardless of our ignorance. I'm interpreting the *ontology* of the successful theory, not the *psychology* of the founders."

  **Vulnerability Note:**
  Safe ground. Concede the history, hold the philosophy. The historian usually just wants to hear you admit that the past thinkers didn't have your vocabulary.

  ### 6. The "Measurement" Objection (The Frequentist Statistician - Round 2)
  **Likelihood:** Medium | **Damage:** Medium
  **Voice:** "How do I measure this?"
  **The Question:** "You say it's single-case. I say you can't measure single-case probability. You can only measure frequencies. So, operationally, your 'single-case propensity' is indistinguishable from 'limiting frequency.' Why should I accept a definition that is operationally inaccessible?"

  **Two-Minute Reply:**
  "Operationally, you're right, we estimate via frequencies. But conceptually, they differ. In reaction kinetics, we talk about the rate of a specific reaction event. We estimate it via ensemble data, but we apply it to the single vessel. The propensity is the *reason* the frequency converges. If the propensity weren't there, the frequency wouldn't stabilize. The inaccessibility doesn't negate the existence; electrons are inferred, not seen directly either."

  **Vulnerability Note:**
  The Frequentist will hate the "inferred" argument. They view unmeasurability as a disqualifier for scientific concepts. You won't convert them; just aim to show you aren't being irrational.

  ### 7. The "Guiding Credence" Objection (The Moderate Bayesian)
  **Likelihood:** Medium | **Damage:** Medium
  **Voice:** "How do I use this?"
  **The Question:** "David Lewis said we should align our credences with objective chances (the Principal Principle). But if your chances are relative to a 'choice of degrees of freedom,' which chance do I align with? If I choose a coarse description and you choose a fine one, we have different objective chances. How do I bet?"

  **Two-Minute Reply:**
  "You align with the chance setup that matches your evidence and your intervention capabilities. If you can only control the macro-variables, the macro-propensity is the relevant one for your credence. This isn't a bug; it's a refinement of the Principal Principle. It tells agents which objective chance is *actionable* for them given their specific epistemic and physical situation."

  **Vulnerability Note:**
  This is actually a strong point for you if framed as "contextual rationality." But be careful not to slide into "truth is relative." The chance is objective *relative to the setup*, not relative to the agent's whim.

  ### 8. The "Boundary Problem" Objection (A Grad Student)
  **Likelihood:** Low | **Damage:** Medium
  **Voice:** "Where does it stop?"
  **The Question:** "You say the propensity belongs to the 'chance setup' including the apparatus. But the apparatus is made of atoms with their own propensities. Is this a regress? Do we need a setup for the setup? Where does the 'disposition' actually sit?"

  **Two-Minute Reply:**
  "It sits at the level of the effective theory. In chemistry, we don't reduce every reaction to QED to get a rate constant. We stop at the level where the disposition becomes stable and measurable. The regress stops at the level of description that yields a stable probability distribution under the specified test procedure. It's a pragmatic cut, justified by the decoupling of time scales."

  **Vulnerability Note:**
  Relies on "effective theory" arguments. Physicists in the room will accept this; metaphysicians might find it dodgy.

  ### 9. The "So What?" Objection (The General Audience)
  **Likelihood:** Low | **Damage:** Low
  **Voice:** "Does this change anything?"
  **The Question:** "Does viewing probability as a relational disposition change how we do statistical mechanics or kinetics? Or is this just a philosophical gloss on the same equations?"

  **Two-Minute Reply:**
  "It changes how we interpret non-equilibrium states. If probability is just frequency, a system far from equilibrium has 'no probability' until it settles. If it's a disposition, the system has a specific propensity to evolve *toward* equilibrium even in the single case. It legitimizes talking about the probability of unique historical events in physical systems, like a specific protein folding pathway."

  **Vulnerability Note:**
  Keep this practical. This is where your chemistry background saves you.

  ---

  ### Strategic Concessions (To Buy Credibility)

  1.  **Concede to the Historian:** Explicitly state early on: "I am not claiming Boltzmann or Gibbs were propensitists. I am claiming that a propensity interpretation makes the best sense of why their methods work." This disarms the anachronism attack before it lands.
  2.  **Concede to the Frequentist on Math:** Acknowledge that your view does *not* change the probability calculus. "I am not proposing a new math. Kolmogorov's axioms hold. I am proposing a different ontology for what the numbers *refer to*." This lowers the barrier for the statistician; you aren't asking them to relearn statistics.

  ---

  ### The Dreaded Question (The Softest Joint)

  **The Question:**
  "You say the propensity is objective, but it depends on the 'degrees of freedom treated as relevant.' Who decides which degrees of freedom are relevant? If it's the scientist, then the probability depends on a human choice. If it's the world, then there is a 'correct' set of degrees of freedom, and your relativism collapses. **Which is it? If it's the scientist, how is this not just subjective Bayesianism with extra steps? If it's the world, why call it relative to a description at all?**"

  **Why this hurts:**
  This targets the core tension in your "Reference Class is a Feature" claim.
  *   If you say **Scientist**: You admit the probability is epistemic/subjective, undermining your claim to objective chance.
  *   If you say **World**: You admit there is a "True" description, which means the reference class problem *was* a bug after all, and you should have just picked the "True" one.

  **Prepared Defense:**
  "It is the world that constrains which descriptions yield *stable* dispositions, but it is the scientist who selects the *level* of intervention. The objectivity lies in the stability of the outcome given the description, not in the uniqueness of the description. Multiple, distinct descriptions can yield objective propensities (e.g., thermodynamic vs. statistical), provided they specify a stable chance setup. It is not subjective because I cannot simply *will* a different propensity; I must physically alter the setup or the measurement resolution to change it."

  *(Note: This is still the hardest spot to defend. If pressed, fall back on the "Effective Theory" defense: different levels of physics have different objective laws, and probability is no different.)*
