  # Seminar Handout: Mapping the Person and the Community

  ## Part I: The Diagnostic Questions
  Answer the following eight questions based on your immediate intuition about the case or claim. Do not worry about which philosophical "team" your answer places you on. The tree is built from these commitments.

  **Q1 (The Frame):** "The tension between 'person' and 'community' is a universal human problem, not just a modern Western worry."
  *   **Accept** / **Deny**

  **Q2 (The Constitution):** "A human raised in total isolation from birth would possess the *capacity* for moral reasoning, even if they had no content to think about."
  *   **True** / **False**

  **Q3 (The Sacrifice):** "A government is morally justified in forcing an innocent citizen to die if it is the only way to ensure the nation's survival."
  *   **Permitted** / **Forbidden**

  **Q4 (The Family Shield):** "A son is morally right to hide his father from the police after the father commits a serious crime."
  *   **Right** / **Wrong**

  **Q5 (The Autonomy Priority):** "The freedom to revise one's own life plan is more important than maintaining social stability."
  *   **Agree** / **Disagree**

  **Q6 (The Autonomy Scope):** "The ideal of 'choosing for oneself' is a universal human good, not just a local cultural preference."
  *   **Universal** / **Parochial**

  **Q7 (The Descriptive Claim):** "People in East Asian cultures literally perceive visual scenes differently than Westerners due to social habits."
  *   **Fact** / **Ideal**

  **Q8 (The Locus):** "My primary political obligation is to my local neighbors, not to distant co-citizens."
  *   **Local** / **State**

  ***

  ## Part II: The Decision Tree
  Follow the path dictated by your answers. Where a question is skipped, it is irrelevant to that branch. Where a combination of answers leads to no known position, the leaf is marked **Unnamed**.

  1.  **Start at Q1.**
      *   If **Deny**: Go to **Leaf 1**.
      *   If **Accept**: Go to **Q2**.

  2.  **At Q2.**
      *   If **True** (Capacity remains): Go to **Branch A (Atomistic)**.
      *   If **False** (Capacity lost): Go to **Branch B (Relational)**.

  3.  **Branch A (Atomistic): Go to Q3.**
      *   If **Permitted**: Go to **Leaf 2 (Unnamed)**.
      *   If **Forbidden**: Go to **Q5**.
          *   If **Agree**: Go to **Q6**.
              *   If **Universal**: Go to **Leaf 3**.
              *   If **Parochial**: Go to **Leaf 4 (Unnamed)**.
          *   If **Disagree**: Go to **Leaf 5 (Unnamed)**.

  4.  **Branch B (Relational): Go to Q7.**
      *   If **Fact** (Descriptive): Go to **Q3**.
          *   If **Permitted**: Go to **Q4**.
              *   If **Right**: Go to **Leaf 6**.
              *   If **Wrong**: Go to **Leaf 7**.
          *   If **Forbidden**: Go to **Q5**.
              *   If **Agree**: Go to **Q6**.
                  *   If **Universal**: Go to **Leaf 8**.
                  *   If **Parochial**: Go to **Leaf 9**.
              *   If **Disagree**: Go to **Q8**.
                  *   If **Local**: Go to **Leaf 10**.
                  *   If **State**: Go to **Leaf 11**.
      *   If **Ideal** (Not Fact): Go to **Q3**.
          *   If **Permitted**: Go to **Q4**.
              *   If **Right**: Go to **Leaf 12**.
              *   If **Wrong**: Go to **Leaf 13**.
          *   If **Forbidden**: Go to **Q5**.
              *   If **Agree**: Go to **Leaf 14**.
              *   If **Disagree**: Go to **Q8**.
                  *   If **Local**: Go to **Leaf 15**.
                  *   If **State**: Go to **Leaf 16**.

  ***

  ## Part III: The Leaves (Positions)
  Each leaf represents a determinate position defined by the path taken. "Awkward Commitment" notes the implication students often try to avoid.

  | Leaf | Position Name | Path Summary | Most Awkward Commitment |
  | :--- | :--- | :--- | :--- |
  | **1** | **Sceptical View** | Q1: Deny | You must explain why the debate feels real if it is an artefact. |
  | **2** | **Unnamed** | Q1:Y, Q2:T, Q3:Permitted | **Incoherent:** Atomism rarely justifies state sacrifice of the innocent. |
  | **3** | **Atomistic Liberalism** | Q1:Y, Q2:T, Q3:Forb, Q5:Agree, Q6:Univ | Social ties are voluntary; deep belonging is a choice, not a given. |
  | **4** | **Unnamed** | Q1:Y, Q2:T, Q3:Forb, Q5:Agree, Q6:Parochial | **Unexplored:** Defends autonomy as a right but denies it is a universal good. |
  | **5** | **Unnamed** | Q1:Y, Q2:T, Q3:Forb, Q5:Disagree | **Incoherent:** Atomistic self but denies priority of self-direction. |
  | **6** | **Confucian Role Ethics** | Q1:Y, Q2:F, Q7:Fact, Q3:Permitted, Q4:Right | Filial piety can override public justice; the father is not a citizen first. |
  | **7** | **Descriptive Interdependence** | Q1:Y, Q2:F, Q7:Fact, Q3:Permitted, Q4:Wrong | **Unattractive:** Accepts psychological difference but rejects its normative force. |
  | **8** | **Embedded Liberalism** | Q1:Y, Q2:F, Q7:Fact, Q3:Forb, Q5:Agree, Q6:Univ | You are socially constituted, but your rights trump social ends. |
  | **9** | **Relational Autonomy** | Q1:Y, Q2:F, Q7:Fact, Q3:Forb, Q5:Agree, Q6:Parochial | Autonomy is real, but its value is dependent on specific relational contexts. |
  | **10** | **Communitarianism (Local)** | Q1:Y, Q2:F, Q7:Fact, Q3:Forb, Q5:Disagree, Q8:Local | The good life is defined by the neighborhood, not the constitution. |
  | **11** | **Communitarianism (State)** | Q1:Y, Q2:F, Q7:Fact, Q3:Forb, Q5:Disagree, Q8:State | The community flourishes, but the individual's projects are secondary. |
  | **12** | **Legalist Collectivism** | Q1:Y, Q2:F, Q7:Ideal, Q3:Permitted, Q4:Wrong | The state is an instrument of order; family loyalty is a threat to power. |
  | **13** | **Unnamed** | Q1:Y, Q2:F, Q7:Ideal, Q3:Permitted, Q4:Right | **Unexplored:** State sacrifice permitted but family loyalty trumps law. |
  | **14** | **Unnamed** | Q1:Y, Q2:F, Q7:Ideal, Q3:Forb, Q5:Agree | **Unattractive:** Relational self with liberal priority but denies cultural facts. |
  | **15** | **Communitarianism (Local)** | Q1:Y, Q2:F, Q7:Ideal, Q3:Forb, Q5:Disagree, Q8:Local | (Duplicate logic to 10, distinct on descriptive claim). |
  | **16** | **Communitarianism (State)** | Q1:Y, Q2:F, Q7:Ideal, Q3:Forb, Q5:Disagree, Q8:State | (Duplicate logic to 11, distinct on descriptive claim). |

  *(Note: Leaves 10/15 and 11/16 are structurally similar but differ on whether they accept the descriptive psychology of Q7.)*

  ***

  ## Part IV: Worked Trace

  **Trace A: The Embedded Liberal**
  *   **Q1 (Frame):** Accept. (The debate is real).
  *   **Q2 (Constitution):** False. (Isolation destroys moral capacity; we are constituted by relations).
  *   **Q7 (Descriptive):** Fact. (Acknowledges cultural psychological differences).
  *   **Q3 (Sacrifice):** Forbidden. (The state cannot kill an innocent for survival).
  *   **Q5 (Autonomy Priority):** Agree. (Revising life plans trumps stability).
  *   **Q6 (Autonomy Scope):** Universal. (This right belongs to everyone).
  *   **Result:** **Leaf 8 (Embedded Liberalism).**
  *   *Analysis:* This reader believes we are made by our communities but insists our communities must serve us, not the other way around.

  **Trace B: The Relational Autonomist**
  *   **Q1 (Frame):** Accept.
  *   **Q2 (Constitution):** False. (Isolation destroys moral capacity).
  *   **Q7 (Descriptive):** Fact. (Acknowledges cultural psychological differences).
  *   **Q3 (Sacrifice):** Forbidden. (The state cannot kill an innocent).
  *   **Q5 (Autonomy Priority):** Agree. (Revising life plans trumps stability).
  *   **Q6 (Autonomy Scope):** **Parochial.** (Autonomy is a good, but not the *same* good for every culture).
  *   **Result:** **Leaf 9 (Relational Autonomy).**
  *   *Analysis:* This reader differs from the Embedded Liberal only on Q6. They believe autonomy is relationally achieved and culturally specific, not a universal metric.

  ***

  ## Part V: Closing Notes

  **1. Indistinguishable Pairs**
  This tree cannot separate **Leaf 10 (Local Communitarian)** from **Leaf 15 (Local Communitarian/Idealist)** on normative grounds. Both hold that local obligation trumps state obligation and stability trumps autonomy. The only difference is Q7 (whether interdependence is a psychological fact or a moral ideal). Since the seminar focuses on the *relation* between person and community, the descriptive psychology of Q7 does not alter the normative outcome. To separate them, you would need a question about the *source* of moral truth (empirical vs. metaphysical), which falls outside the scope of this specific taxonomy.

  **2. Most Likely Confusion**
  Students most frequently confuse **Leaf 8 (Embedded Liberalism)** with **Leaf 10 (Communitarianism)**. Both accept that the self is socially constituted (Q2: False). The distinction turns entirely on **Q5 (Autonomy Priority)**. Embedded Liberals believe social embedding is the *condition* for autonomy (I need a community to choose freely); Communitarians believe social embedding is the *end* of autonomy (I choose to sustain the community). If you find yourself answering "It depends" on Q5, you are likely straddling this line.
