answer: |-
  Here is a decision tree designed for your reading group. It maps the logical space of the Hart-Fuller debate without presupposing the labels, starting from the shared "Social Fact" baseline and moving through the Grudge Informer case.

  ### The Jurisprudential Decision Tree

  **Starting Commitment:** We all agree that for a norm to be law, it must generally originate from a social source (enactment, official acceptance, etc.). Law is not *simply* whatever is morally correct.

  **Node 1: The Post-War Court**
  *Case:* A post-war court convicts a "grudge informer" who acted under a perfectly enacted but monstrous Nazi statute. The court refuses to apply the Nazi statute as a defense.
  *Question:* To justify the conviction, does the court claim the Nazi statute was **never valid law** (so no retroactivity is needed), or that it **was valid law** (so we are honestly applying retroactive justice)?
  *   **A. Never Valid Law:** Go to Node 2.
  *   **B. Was Valid Law:** Go to Node 5.

  **Node 2: The Source of Invalidity**
  *Claim:* You hold the statute was not law.
  *Question:* Was it disqualified because of **what it commanded** (substantive injustice) or **how it functioned** (procedural disorder/secrecy/contradiction)?
  *   **A. What it Commanded (Injustice):** Go to Node 3.
  *   **B. How it Functioned (Disorder):** Go to Node 4.

  **Node 3: The Mechanism of Injustice**
  *Claim:* Extreme injustice disqualifies a norm from being law.
  *Question:* Does injustice strip validity only after crossing a **fixed threshold** of wickedness, or does it reduce validity **by degrees** as wickedness increases?
  *   **A. Fixed Threshold:** Go to Leaf 1.
  *   **B. By Degrees:** Go to Leaf 2.

  **Node 4: The Mechanism of Disorder**
  *Claim:* Failure to guide conduct disqualifies a norm from being law.
  *Question:* Is a system that fails to guide conduct a **corrupt instance** of law (like a blind eye is still an eye), or is it **partially law** to the extent it succeeds (like a dim light)?
  *   **A. Corrupt Instance:** Go to Leaf 3.
  *   **B. Partially Law:** Go to Leaf 4.

  **Node 5: The Role of Morality**
  *Claim:* The statute was valid law.
  *Question:* Does moral merit determine **what the law says** (its content), or only **whether we must obey it** (its binding force)?
  *   **A. What the Law Says:** Go to Leaf 5.
  *   **B. Whether We Obey:** Go to Node 6.

  **Node 6: The Rule of Recognition**
  *Claim:* Morality affects obligation, not content.
  *Question:* Imagine a constitution stating: "No statute shall be law if it violates dignity." Is this a **valid legal test** (because officials accept it) or a **conceptual mistake** (because law is only social fact)?
  *   **A. Valid Legal Test:** Go to Leaf 6.
  *   **B. Conceptual Mistake:** Go to Leaf 7.

  ***

  ### The Leaves

  **Leaf 1**
  *   **View:** A statute loses its legal character entirely once it crosses a specific limit of substantive injustice.
  *   **Label:** The Radbruch Formula (Natural Law Lite).
  *   **Awkward Commitment:** You must accept that legal certainty is sacrificed for justice, potentially making validity unstable in hard cases.

  **Leaf 2**
  *   **View:** The legal character of a norm fades gradually as its substantive injustice increases, rather than vanishing at a bright line.
  *   **Label:** Unnamed (Gradient Natural Law).
  *   **Awkward Commitment:** You must explain how a court applies "partial validity" in a binary system where a defendant is either guilty or not.

  **Leaf 3**
  *   **View:** A thoroughly unjust system is still law, but not law in the focal or central sense of the term.
  *   **Label:** Focal Meaning (Aristotelian Fuller).
  *   **Awkward Commitment:** You must call monstrous regimes "law" (albeit corrupt ones), which risks legitimizing them linguistically.

  **Leaf 4**
  *   **View:** Legality is not a binary state but a continuum dependent on how well the system meets procedural ideals.
  *   **Label:** Degrees of Legality (Fuller).
  *   **Awkward Commitment:** You must accept that there is no clear point where a citizen is entitled to say "this is no longer law."

  **Leaf 5**
  *   **View:** Validity is determined by social sources, but the content of the law is fixed by moral interpretation of those sources.
  *   **Label:** Interpretivism (Dworkin).
  *   **Awkward Commitment:** You must accept that there is often no single right answer to "what is the law" until a judge decides.

  **Leaf 6**
  *   **View:** The rule of recognition in a given system can itself contain moral criteria for validity if officials accept it.
  *   **Label:** Inclusive Positivism (Soft Positivism).
  *   **Awkward Commitment:** You must accept that morality becomes law only because of a social fact, potentially losing its critical force against the system.

  **Leaf 7**
  *   **View:** Injustice never affects legal validity; it merely means the law is not morally binding on us.
  *   **Label:** Exclusive Positivism (Hard Positivism).
  *   **Awkward Commitment:** You must admit the Nazi statute was "law" and that punishing the informer required honest retroactive legislation.

  ***

  ### Collapsing Leaves (Flagged Ambiguities)

  This tree forces distinctions that may not hold up under pressure. Be prepared for these two pairs to merge in discussion:

  1.  **Leaf 1 (Radbruch) vs. Leaf 4 (Degrees):** The tree separates "Threshold" from "Degrees." However, in practice, a "threshold" is just the point where degrees reach zero. If a participant argues that injustice reduces legality until it vanishes, they are straddling Leaf 1 and Leaf 4. The tree treats them as distinct mechanisms, but they may be the same view described differently.
  2.  **Leaf 3 (Focal) vs. Leaf 4 (Degrees):** The distinction between a "corrupt instance" (Focal) and "partial legality" (Degrees) is notoriously thin. A system that is 10% law (Degrees) looks very much like a corrupt instance of law (Focal). If your group finds they cannot answer Node 4 without endorsing both, treat Leaf 3 and Leaf 4 as a single "Fullerian" position.

  ### Confidence and Uncertainty

  **Confidence Level:** Moderate-High.
  The tree successfully isolates the logical commitments of the major positions without using jargon in the nodes. It respects the "Social Fact" baseline and centers the Grudge Informer case as requested.

  **Single Point of Least Confidence:**
  **Node 6 (The Rule of Recognition).** The distinction between Inclusive Positivism (Leaf 6) and Hard Positivism (Leaf 7) turns on whether a moral criterion in a constitution is a *social rule* or a *mistake*. In practice, Hard Positivists often argue that when officials apply moral criteria, they are applying *morality*, not *law*, even if they call it law. Inclusive Positivists say if the social practice accepts it, it *is* law. This node relies on the participant understanding the "Social Fact Thesis" deeply enough to see that distinction. A non-specialist might answer "Valid Legal Test" simply because it's written in a constitution, inadvertently selecting Inclusive Positivism when they might intuitively be Hard Positivists who view the constitution as incorporating external morality. I recommend the facilitator be ready to probe *why* they chose that branch.
