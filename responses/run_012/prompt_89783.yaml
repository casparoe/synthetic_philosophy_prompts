  # Marking Scheme

  **1. Part (a): Truth Content Inclusion (6 marks)**  
  *Must identify that $T_2 \vdash T_1$ implies $Ct(T_1) \subseteq Ct(T_2)$, satisfying the truth condition.*  
  *Common Error:* Students claim $T_2$ has less truth content because it is false, confusing truth of the theory with truth of consequences.

  **2. Part (a): Falsity Content Inclusion (6 marks)**  
  *Must identify a specific false consequence of $T_2$ (e.g., $\neg p \land \neg r$) that is not entailed by $T_1$.*  
  *Common Error:* Students assert falsity content increases without providing a specific sentence witness from the case.

  **3. Part (a): Final Verdict (6 marks)**  
  *Must conclude theories are incomparable (or specifically that $T_2$ is not closer) based on the failed condition.*  
  *Common Error:* Students conclude $T_2$ is worse because it is "more false," ignoring the definition's subset requirement.

  **4. Part (b): General Argument & Progress (6 marks)**  
  *Must state that no strictly stronger false theory can be closer, blocking progress narratives involving false theories.*  
  *Common Error:* Students discuss progress generally without linking it to the impossibility of ranking false theories.

  **5. Part (c): Fix Assessment & Reflection (6 marks)**  
  *Must note the fix works (via average distance) but identify the language/naturalness assumption as the vulnerability.*  
  *Common Error:* Students praise the fix without noting the language dependence, or claim it fails entirely.
