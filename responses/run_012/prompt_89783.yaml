  # Model Answer

  **(a) Case Analysis**  
  First, we determine the truth values of the axioms in $w^*$. Since $p$ is true, $\neg p$ is false. Thus $T_1$ is false. Since $p$ is true and $r$ is false, $\neg p \land \neg r$ is false. Thus $T_2$ is false.

  Condition 1: $Ct_T(T_1) \subseteq Ct_T(T_2)$.  
  $T_2$ entails $\neg p$, so $T_2$ entails everything $T_1$ entails. Therefore, any true consequence of $T_1$ is automatically a consequence of $T_2$. Since truth is determined by $w^*$, any true sentence in $Ct(T_1)$ is in $Ct(T_2)$. This condition holds.

  Condition 2: $Ct_F(T_2) \subseteq Ct_F(T_1)$.  
  We require every false consequence of $T_2$ to be a consequence of $T_1$. Consider the sentence $\phi = (\neg p \land \neg r)$. $\phi$ is the axiom of $T_2$, so $\phi \in Ct(T_2)$. As established, $\phi$ is false in $w^*$, so $\phi \in Ct_F(T_2)$. However, $T_1$ (generated by $\neg p$) does not entail $\neg r$. Therefore $\phi \notin Ct(T_1)$, and consequently $\phi \notin Ct_F(T_1)$.  
  Because there is a member of $Ct_F(T_2)$ not in $Ct_F(T_1)$, the inclusion fails.

  Verdict: Since the second condition fails, Popper's definition does not rank $T_2$ as closer to the truth than $T_1$. (Nor is $T_1$ closer than $T_2$, as $T_2$ has true consequences like $\neg r$ that $T_1$ lacks). They are incomparable.

  **(b) The Triviality Result**  
  This case illustrates the general triviality result: if $T_1$ and $T_2$ are both false, and $T_2$ is strictly stronger than $T_1$ (i.e., $T_2 \vdash T_1$), $T_2$ can never be closer to the truth than $T_1$ under Popper's definition. Because $T_2$ is false, it has false content. Because it is stronger, it has false content that $T_1$ does not have (as seen with $\neg p \land \neg r$). This violates the requirement that falsity content must not increase.

  This matters because scientific progress often involves moving from a vague false theory to a specific false theory that captures more facts. For example, moving from "all metals conduct" (false, vague) to "all metals except lead conduct" (false, specific). The latter is intuitively closer to the truth because it gets more right. Popper's definition forbids this: it implies that adding truth to a false theory inevitably adds enough falsity content to block any gain in verisimilitude. If false theories cannot be ranked as closer than their predecessors, the realist explanation of progress—that we are converging on the truth despite current falsity—collapses.

  **(c) The Constituents Fix**  
  The constituents fix defines closeness via the distance from the theory's models to the actual world.  
  Actual constituent: $p \land q \land \neg r$.  
  $T_1$ permits constituents where $p$ is false (e.g., $\neg p \land q \land \neg r$). Distance = 1 atom ($p$).  
  $T_2$ permits constituents where $p$ is false and $r$ is false (e.g., $\neg p \land q \land \neg r$). Distance = 1 atom ($p$).  
  Wait, $T_2$ forces $r$ to be false, which matches reality. $T_1$ allows $r$ to be true or false. If we measure by the *closest* permitted constituent (min distance), both have a constituent at distance 1 ($\neg p \land q \land \neg r$). If we measure by *average* distance, $T_2$ restricts the set to those matching $r$, reducing the average distance compared to $T_1$. Thus, under an average distance metric, $T_2$ ranks higher. This dodges the triviality result.

  However, this fix presupposes that the atomic literals ($p, q, r$) are the correct metric for distance. It assumes logical atoms correspond to natural properties and are equally weighted.  
  **Where I might be wrong:** I am assuming there is a privileged "natural" language. If I am wrong about this—if atomic structure is language-relative rather than world-relative—then the distance metric is arbitrary. We could define a new atom $s = (p \lor r)$ and recalculate distances, potentially reversing the ranking. If language invariance fails, the fix does not measure truthlikeness objectively; it merely measures similarity within a chosen linguistic framework, changing the subject from metaphysics to semantics.

