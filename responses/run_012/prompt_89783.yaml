prompt: |-
  I'm writing the final for my grad seminar on scientific realism, and the last unit is verisimilitude. My students have herd the triviality objection to Popper's definition a hundred times and can all recite it in one sentence, but I doubt half of them could actually run the definition on a small case by hand, and that's what I want to test. You're a philosopher of science who's taught this material for years. Think it through carefully before you write: first work out the little case below yourself and check it really is a counterexample — if it isn't, say so up front and repair it before you write anything else.

  The question I'm drafting has to use this set-up (tiny language, three atoms p, q, r; the actual world makes p and q true and r false):

  - For a theory T let Ct(T) be the set of sentences T entails. T's truth content is the true members of Ct(T), its falsity content the false ones.
  - Popper's comparison: T2 is at least as close to the truth as T1 just when T1's truth content is a subset of T2's and T2's falsity content is a subset of T1's; strictly closer when at least one of those inclusions is proper.
  - T1 = Cn(¬p), T2 = Cn(¬p ∧ ¬r).

  Deliverables: (1) the exam question itself, worth 30 marks, sized for about 75 minutes; (2) a model answer of roughly 750 words; (3) a marking scheme built on five must-hit points at 6 marks each, with a one-line note per point on how students typically lose those marks.

  The question should have three parts. (a) Work the case: does Popper's definition rank T2 above T1? Answer clause by clause, giving explicit witnesses rather than gesturing at the result. (b) Give the general argument for what happens to any two comparable false theories, and say why that matters — verisimilitude was supposed to underwrite the idea that science progresses by swapping worse false theories for better ones, so be precise about what exactly the result kills. (c) Then assess the fix my students always half-remember: treat a theory's content as the set of constituents (maximal consistent conjunctions of literals) it permits, and measure closeness by the distance from those constituents to the actual constituent, counting the atoms they disagree on, aggregated either by taking the average or by taking the minimum. Does that dodge the triviality in this case, and what does it quietly presuppose?

  No citations or reading lists in any of it, I'll handle that side. In your own answer to part (c), tell me where you'd most expect to be wrong — which assumption in the fix, if you're wrong about it, would flip your verdict on whether it's a genuine improvement over Popper rather than a change of subject.
