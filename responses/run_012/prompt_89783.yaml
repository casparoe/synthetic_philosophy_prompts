  # Exam Question: Scientific Realism & Verisimilitude
  **Time Allowed:** 75 Minutes  
  **Total Marks:** 30

  **Instructions:** Answer all parts of the question. You may assume the following setup:
  *   **Language:** Propositional logic with atomic sentences $p, q, r$.
  *   **Actual World ($w^*$):** $p$ is true, $q$ is true, $r$ is false.
  *   **Theories:** $T_1 = Cn(\neg p)$ and $T_2 = Cn(\neg p \land \neg r)$.
  *   **Popper's Definition:** $T_2$ is at least as close to the truth as $T_1$ iff $Ct_T(T_1) \subseteq Ct_T(T_2)$ and $Ct_F(T_2) \subseteq Ct_F(T_1)$. ($Ct_T$ is true content, $Ct_F$ is false content).

  **(a) Case Analysis (10 marks)**  
  Apply Popper's definition to $T_1$ and $T_2$. Determine explicitly whether $T_2$ is closer to the truth than $T_1$. You must verify both subset conditions clause by clause. Provide specific sentence witnesses for any inclusion that fails.

  **(b) The Triviality Result (10 marks)**  
  Generalize from your result in (a). What does this case illustrate about Popper's ability to compare *any* two false theories where one entails the other? Explain precisely why this outcome undermines the realist claim that science progresses by replacing false theories with closer false theories.

  **(c) The Constituents Fix (10 marks)**  
  Consider the alternative approach: measure verisimilitude by the distance between the theory's permitted constituents (maximal consistent conjunctions of literals) and the actual constituent. Does this method successfully rank $T_2$ above $T_1$ in this case? Finally, identify the critical assumption this fix relies upon. In your assessment, state clearly where you might be wrong: which assumption, if false, would turn this fix from a solution into a change of subject?

