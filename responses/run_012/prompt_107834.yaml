  You have stumbled onto a cluster of problems that sit at the intersection of metaphysics, philosophy of science, and social psychology. You are right to feel that they are structurally distinct, even though they share the same epistemic frustration: the inability to verify a property without altering the conditions of its existence.

  Here is the breakdown of your four instances using the established vocabulary, followed by the ontological stance you asked for.

  **Instance One: The Dog (Masking)**
  In the metaphysics of dispositions (properties like "fragile," "soluble," or "good with kids"), this is called **Masking**. The disposition is present, but an external factor (the kids causing fear) prevents the manifestation. Philosophically, this is a counterexample to the "Simple Conditional Analysis" of dispositions. Your friend's claim is unfalsifiable only if she refuses to acknowledge the mask. If the dog *always* hides, positing a hidden "goodness" is an **Ad Hoc Rescue** (in Karl Popper's terms). But structurally, this is **Masking**.

  **Instance Two: The Funny Friend (The Outlier)**
  This is the odd one out. It isn't just that observation changes the trait; it's that the *precondition* for the trait (familiarity) is blocked by the lack of the trait (openness/funny). This is a recursive loop. There isn't a single established name for this specific dispositional structure. It resembles a **Performative Contradiction** or a **Catch-22**, but those describe situations, not tendencies. I will coin a name for this below.

  **Instance Three: The Generous Worker (Reactivity)**
  This is the classic **Hawthorne Effect** or, more broadly, **Reactivity**. The measurement instrument (observation) is not neutral; it is part of the causal chain producing the behavior. In philosophy, this touches on **Response-Dependent Properties**. The generosity isn't intrinsic; it's relational.

  **Instance Four: The Firework/Reputation (Destructive Testing)**
  This is **Destructive Testing**. In engineering, you test a fuse by lighting it; in social dynamics, you test trust by risking it. The manifestation of the disposition consumes the substrate. In quantum mechanics, this is analogous to wavefunction collapse, but in social terms, it's simply **Consumption**.

  **The Ontological Question: Is there a real difference?**
  You asked me to take a side: When a tendency doesn't show, is there a real difference between "still there, blocked" and "not there anymore"?

  **Yes, there is a real difference.**
  Instrumentalists (who care only about outcomes) will say "if it doesn't fire, it's broken." But Realists about causal powers say the internal structure matters. A gun with a safety catch on (masked) has a different causal structure than a gun with a broken firing pin (gone). The first will fire if you remove the kids (safety); the second will not. The difference is not just a story we tell; it is a difference in **counterfactual stability**. If you change the background conditions (remove the kids), the masked trait returns; the gone trait does not. Therefore, the tendency is ontologically distinct from its manifestation.

  **The Pattern Name**
  Colloquially, this is **The Observer Effect**. However, strictly speaking, that is physics. In social science, it is **Reactivity**. In metaphysics, it is **Dispositional Interference**. Since you asked for the established name for the pattern broadly, "The Observer Effect" is the recognized umbrella, even if imprecise.

  For Instance Two, which lacks a specific label, I propose **Access Loop**. It describes a disposition where the access condition negates the disposition until the access is granted, which requires the disposition.

  \answer{The Observer Effect | Access Loop}
