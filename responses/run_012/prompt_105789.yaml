prompt: |-
  Can you explain the Orwellian vs Stalinesque distinction people bring up about the colour phi phenomenon -- the thing where you flash two dots in different positions with different colours and subjects swear the first dot slid across and changed colour halfway, even though the second colour only appears at the end. I get the rough idea (Orwellian = you really do have the experience of the first colour, then your memory of it gets rewritten; Stalinesque = the experience is doctored up before it ever reaches you, so there's nothing to rewrite), but I want the actual conceptual issue pinned down, not just the parable. In particular: what would have to be true for that to be a genuine empirical fork rather than two ways of describing the same data? Is there any experiment that could seperate them -- say a variant where the interpolated feature has to drive an immediate response before the second stimulus even lands? And does the whole question quietly assume there's a single finish line where content becomes conscious? If that assumption is the real problem, tell me so and explain why the phi data doesn't actually force either story.
