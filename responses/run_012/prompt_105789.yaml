          *   *Orwellian:* The brain presents the raw data (Red at A), then the second stimulus arrives, and memory is revised *after* the fact (the "history books" are rewritten).
      *   *Dennett's Punchline:* There is no fact of the matter. It's a category error to ask *when* consciousness happens. This leads to the "Multiple Drafts Model."
