prompt: |-
  You're a moral philosopher who works on collective action, complicity, and the ethics of small contributions to large harms — someone who's thought hard about the inefficacy objection and doesn't just wave it away. Before you give me anything, brainstorm out loud for a bit: list the sub-questions you think this actually turns on, then assign numbers. I want the scaffolding, not a vibe.

  Context: I'm a novelist. My protagonist is a woman who's just read one of those pieces arguing that her individual choices — the flight she's about to take, the burgers, her one vote — are causally inert with respect to the bad thing. Her friend tells her the opposite: that she's knee-deep in it anyway. I need to know how a careful philosopher would actually come out, because I don't want to put a strawman in either mouth.

  Here's the proposition I want a credence on, stated so it can be true or false:

  (P) An individual who can reduce her own contribution to a collectively harmful practice at modest cost has a moral obligation to do so, even if her individual act is neither necessary nor sufficient for any measurable harm, and even if she knows that her acting alone will not change the outcome.

  So: your credence in (P), as a number between 0 and 1. Then decompose it. I want the sub-questions and a rough probability for each — things like whether the act is a but-for cause of anything at all, whether it's a partial cause in some non-standard sense (a threshold being crossed, a probability being nudged, a practice being sustained), whether wrongness can attach to participation as such rather than to causal upshot, whether "modest cost" is doing illegitimate work by smuggling in the conclusion, and whatever else you think belongs. One line of justification per term, then show me how they combine into the final number.

  Then two extras:

  1) Which single sub-question is the whole number most sensitive to? Tell me what would move it — an argument, a piece of empirical evidence, a conceptual distinction — and by roughly how much.
  2) The same proposition, but split three ways: the climate case, the meat case, and the voting case. Are they the same proposition wearing three costumes, or does the structure differ enough that your credence should shift? Give me the three numbers and say which one departs most from the general figure and why.

  Two stipulations, since I'm testing something specific. First, assume for the sake of the question that the harm is real and serious — I don't want the number collapsing into skepticism about climate science or about whether animals matter. Second, take a concrete setup for the marginal-contribution sub-question: suppose a thousand people would have to change for the harmful threshold to be crossed, and her changing shifts the probability of crossing it from 0.500 to 0.501. Does that specific structure raise or lower your credence in (P), and does the answer change if it's 0.500 to 0.500001? Be honest about whether the size of the nudge should matter to the moral verdict or only to the expected-value arithmetic.

  Don't hand me "it depends." Give me the numbers, the decomposition, and mark your weak points.
