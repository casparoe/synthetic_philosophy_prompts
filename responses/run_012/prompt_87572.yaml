answer: |-
  This is an exceptionally sharp diagnosis of the conceptual landscape. You are correct to suspect that the translation from the foundations of quantum mechanics (QM) to statistical mechanics (SM) is "too quick." While the vocabulary overlaps almost perfectly, the topological and algebraic constraints on the "phase space" differ radically.

  Here is the systematic translation, the residue report, and the adjudication of your instinct.

  ---

  ### Part 1: Systematic Translation

  Let us define your SM vocabulary formally:
  *   **$\Lambda$ (Phase Space):** The space of microstates $\lambda$.
  *   **$\lambda \in \Lambda$:** The ontic state of an individual system (Boltzmann).
  *   **$\mu(\lambda)$:** A probability distribution over $\Lambda$ (Gibbs).
  *   **Preparation:** A procedure that produces a system described by $\mu(\lambda)$.
  *   **Measurement:** A function $M: \Lambda \to \text{Outcomes}$ (possibly stochastic).

  #### 1. The $\psi$-Ontic Position
  **Translation:** The wavefunction $|\psi\rangle$ corresponds (bijectively or injectively) to the microstate $\lambda$.
  *   **In your idiom:** The "Gibbs distribution" is actually a delta function (or effectively so) centered on the "Boltzmann microstate." The wavefunction *is* the physical state of the individual system.
  *   **What carries over:** The commitment to a real state of affairs for individual systems. The idea that a complete specification of the system ($|\psi\rangle$) determines the probabilities of measurement outcomes (just as $\lambda$ determines outcomes in classical mechanics, perhaps stochastically).
  *   **What is distorted:** In SM, the microstate is a point in phase space $(q,p)$. In $\psi$-ontic QM, the microstate is a vector in Hilbert space. This matters because Hilbert space has superposition structure that phase space lacks. A $\psi$-ontic model can be "pure" (where $\lambda \equiv \psi$) or "supplemented" (like Bohmian mechanics, where $\lambda = (\psi, \text{positions})$). Your SM vocabulary handles supplemented models easily (extra latent variables), but the "pure" $\psi$-ontic view implies the distribution *is* the reality, which has no direct SM analogue (a probability distribution is rarely the physical object itself).
  *   **What is lost:** The intuition that $\psi$ could represent ignorance. In your SM worldview, if I hand you a distribution $\mu$, you assume there is a sharper $\lambda$ underneath. The $\psi$-ontic view asks you to accept that $\mu$ (the wavefunction) is the sharpest description possible.

  #### 2. The $\psi$-Epistemic Position
  **Translation:** The wavefunction $|\psi\rangle$ corresponds to a probability distribution $\mu_\psi(\lambda)$ over an underlying ontic state space $\Lambda$.
  *   **In your idiom:** This is precisely the Gibbs/Boltzmann distinction. $|\psi\rangle$ is the macrostate/ensemble description; $\lambda$ is the hidden microstate. Distinct wavefunctions $|\psi_1\rangle$ and $|\psi_2\rangle$ correspond to distributions $\mu_1$ and $\mu_2$ that may **overlap**. If $\lambda$ lies in the overlap region, the same physical reality is consistent with two different quantum preparations.
  *   **What carries over:** The interpretation of probability as ignorance. The idea that measurement reveals pre-existing properties of $\lambda$. The intuition that distinct preparations can result in the same underlying physical state (just as two different thermal ensembles could, by chance, contain systems in the same microstate).
  *   **What is distorted:** In SM, the evolution of $\mu$ is linear (Liouville). In QM, the evolution of $\psi$ is linear (Schrödinger), but the mapping from $\psi$ to $\mu_\psi$ must reproduce the **Born Rule** ($P = |\langle \phi | \psi \rangle|^2$). This imposes non-classical constraints on the geometry of $\Lambda$ and the shapes of $\mu_\psi$.
  *   **What is lost:** The freedom of the distributions. In SM, you can choose almost any $\mu$ over $\Lambda$. In $\psi$-epistemic QM, the set of admissible distributions is severely constrained by the requirement to reproduce interference and entanglement statistics.

  ---

  ### Part 2: The Residue Report

  You asked to treat the leftover as evidence. Here is where the SM analogy breaks down under the weight of quantum structure.

  #### (i) Commitments of the $\psi$-Epistemic View
  When a $\psi$-epistemic proponent says "$\psi$ is a probability distribution," they are importing a commitment your SM analogy does not automatically supply: **The Constraint of Measurement Statistics.**

  In SM, if you have two overlapping distributions $\mu_1$ and $\mu_2$, you can always design a measurement that distinguishes the underlying microstates $\lambda$ (in principle). In QM, if $\mu_{\psi_1}$ and $\mu_{\psi_2}$ overlap, there exists an ontic state $\lambda$ compatible with both. The commitment is that for *any* measurement basis, the response function of the device acting on $\lambda$ must yield outcome probabilities that match the Born rule for *both* $\psi_1$ and $\psi_2$ simultaneously.

  This is a much heavier lift than in SM. In SM, probabilities are additive ($P(A \cup B) = P(A) + P(B)$). In QM, amplitudes add. For the $\psi$-epistemic view to work, the "ignorance" distribution $\mu_\psi$ must conspire to create interference patterns that look like wave superposition, not classical mixture. The analogy sounds familiar, but the **topological constraints on the overlap** are alien to classical statistical mechanics.

  #### (ii) The PBR Theorem and the Independence Assumption
  The Pusey-Barrett-Rudolph (PBR) theorem is the hammer that breaks your SM analogy.
  *   **The SM Intuition:** If I prepare system A in distribution $\mu_A$ and system B in $\mu_B$, and the preparations are independent, the joint distribution is $\mu_{AB} = \mu_A \times \mu_B$. If $\mu_A$ and $\mu_A'$ overlap, and $\mu_B$ and $\mu_B'$ overlap, the joint distributions definitely overlap.
  *   **The PBR Result:** If distinct quantum states $|\psi\rangle$ and $|\phi\rangle$ correspond to overlapping distributions over $\lambda$, and if independently prepared systems have product distributions (Preparation Independence), then one can construct a measurement on the joint system that yields a logical contradiction with the Born rule.
  *   **Substance vs. Formalism:** This is a difference of **substance**. It is not merely formalism.
  *   **Which Classical Assumption Fails?** The assumption that fails is **Preparation Independence** *or* the assumption that **Ontic States Determine Outcomes Non-Contextually**.
      *   In SM, "independence" means the phase space of the composite system is the Cartesian product $\Gamma_A \times \Gamma_B$.
      *   In QM, the state space is the Tensor Product $\mathcal{H}_A \otimes \mathcal{H}_B$.
      *   PBR shows that you cannot map the Tensor Product structure onto a Cartesian Product of underlying ontic states *while maintaining overlapping distributions*.
      *   Essentially, QM denies the classical assumption that **physical independence implies statistical independence of the underlying ontic states.** In QM, even "independently prepared" systems carry a structural potential for entanglement that forbids their underlying realities from being merely Cartesian products of local realities *if* those realities are to remain compatible with multiple wavefunctions.

  #### (iii) The Ontic/Epistemic Cut vs. Microstate/Distribution
  They are **different cuts** that you are conflating.
  *   **Your Cut (SM):** Microstate ($\lambda$) vs. Distribution ($\mu$). This is a distinction between *individual reality* and *ensemble knowledge*.
  *   **The QM Cut:** Ontic ($|\psi\rangle$ is real) vs. Epistemic ($|\psi\rangle$ is info).
  *   **The Discrepancy:** In SM, the "Distribution" is *always* epistemic (or coarse-grained). The "Microstate" is *always* ontic.
      In QM, the debate is about the status of the **primary mathematical descriptor** ($|\psi\rangle$).
      *   If $\psi$-ontic: $|\psi\rangle$ plays the role of $\lambda$ (Microstate).
      *   If $\psi$-epistemic: $|\psi\rangle$ plays the role of $\mu$ (Distribution).
      *   **The Trap:** In SM, we know what $\lambda$ is (positions and momenta). In QM, if $\psi$ is epistemic, **we do not know what $\lambda$ is.** The $\psi$-epistemic view posits a "deeper" layer of reality beneath the wavefunction. Your SM analogy assumes the "phase space" is given. In QM foundations, the existence and nature of that "phase space" ($\Lambda$) is the very thing in dispute.
      *   **The Real Cut:** The real cut is not State vs. Information. It is **Hilbert Space vs. Something Deeper.** The $\psi$-ontic view says Hilbert Space is the fundamental arena. The $\psi$-epistemic view says Hilbert Space is a shadow of a deeper arena. In SM, Phase Space is the fundamental arena; distributions are secondary. Your analogy assumes the QM debate is about the secondary object, but it is actually about the primary object.

  ---

  ### Part 3: Adjudication

  **Is the debate simply Gibbs versus Boltzmann in new notation?**
  **No.** The resemblance is superficial and misleading.

  **Your Instinct:** You are instinctively mapping the QM debate onto the SM debate because you are looking for the "hidden variables" (the microstates) that justify the "distribution" (the wavefunction). You assume that if $\psi$ is epistemic, there *must* be a classical-style phase space underneath.

  **The Misleading Piece of Background:**
  The piece of your background responsible for the error is the **assumption of a fixed, non-contextual sample space.**
  In Statistical Mechanics, the phase space $\Gamma$ exists independently of how you measure the system. Properties commute. You can refine your knowledge (sharpen $\mu$) without changing the system's dynamics fundamentally.

  In Quantum Mechanics, the "sample space" (the set of possible outcomes) depends on the **measurement context** (Kochen-Specker theorem).
  *   In SM, overlapping distributions are trivial because properties are additive.
  *   In QM, overlapping distributions are lethal because properties are **interferometric**.

  **What you are missing:**
  You are missing the **normative constraint of the Born Rule** on the geometry of the "distributions."
  In your SM world, I can have a distribution $\mu_1$ and $\mu_2$ that overlap, and I can measure the system to find $\lambda$.
  In the QM $\psi$-epistemic world, if $\mu_{\psi_1}$ and $\mu_{\psi_2}$ overlap, there is a $\lambda$ in the overlap. If I measure in a basis that distinguishes $\psi_1$ from $\psi_2$, the outcome must be determined by $\lambda$. But the Born rule requires probabilities that depend on the *global* wavefunction, not just the local $\lambda$.
  To make the $\psi$-epistemic view work, the "microstates" $\lambda$ must "know" which measurement will be performed in the future (retrocausality) or the distributions must be so constrained that they effectively don't overlap (collapsing back to $\psi$-ontic).

  **Final Verdict:**
  The debate is **Gibbs versus Boltzmann PLUS the impossibility of a classical sample space.**
  Your intuition tells you that "Distribution over Microstates" is a coherent category. The PBR theorem and related no-go results (Bell, Kochen-Specker) tell you that in QM, **there is no sample space over which the wavefunction can be a classical probability distribution** that satisfies independence and non-contextuality.

  If you cling to the SM analogy, you are implicitly assuming a **Hidden Variable Theory** that is local and non-contextual. The physics of the last 60 years suggests that if $\psi$ is epistemic, the "microstates" underneath cannot behave like classical phase-space points. They must be stranger than anything in your statistical mechanical toolkit. The wavefunction is not just a Gibbs distribution; it is a Gibbs distribution defined on a manifold where "independence" and "overlap" have non-classical topological consequences.

  **Advice:** Keep the distinction between "state of system" and "information about system." That is robust. But discard the assumption that the "state of system" must look like a point in a Cartesian phase space. That is the classical residue that is blocking your view of the quantum terrain.
