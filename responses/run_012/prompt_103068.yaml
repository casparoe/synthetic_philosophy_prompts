answer: |-
  ### I. Reconstruction of Implicit Philosophies

  **1. Norway: The Logic of Representative Legitimacy**
  *   **Beneficiary:** The category is sex (women). Eligibility is based purely on **underrepresentation**, not proven individual disadvantage. A wealthy, privileged woman counts the same as a working-class one.
  *   **Nature of the Good:** Board seats are **positional goods** conferring power and status. However, the scheme treats them as public offices requiring democratic legitimacy.
  *   **Nature of Injustice:** **Ongoing structural imbalance.** There is no requirement to prove historical wrongs against specific individuals. The injustice is the statistical absence of women in power, which undermines the legitimacy of corporate governance.
  *   **Desert:** The scheme presupposes nothing about **individual desert**. It does not claim the appointed women are more deserving than the men they replace, nor that the men are guilty of exclusion. It concerns only the **composition of the body**.

  **2. India: The Logic of Corrective Social Mobility**
  *   **Beneficiary:** Hereditary castes (SC, ST, OBC). Eligibility is based on **historical group disadvantage**, but filtered through current economic status (the "creamy layer").
  *   **Nature of the Good:** Education and employment are **capability goods**. They are instruments for social elevation and economic security.
  *   **Nature of Injustice:** **Historical oppression with ongoing effects.** The justification is reparative (for past exclusion), but the mechanism targets current socioeconomic stagnation within those groups.
  *   **Desert:** Implicitly acknowledges that merit is skewed by historical deprivation. The reservation compensates for the lack of opportunity, not necessarily for pain suffered.

  **3. USA (Pre-2023): The Logic of Instrumental Diversity**
  *   **Beneficiary:** Racial minorities, but defined loosely. Eligibility was based on **contribution to a critical mass**, not disadvantage.
  *   **Nature of the Good:** Education is a **collective good**. The benefit accrues primarily to the *student body* (third parties) via the educational value of diverse perspectives, rather than to the minority admittee as compensation.
  *   **Nature of Injustice:** **Neither.** The legal justification explicitly disavowed historical reparation or ongoing discrimination to satisfy "colorblind" constitutional scrutiny. The injustice is merely a pedagogical deficit (homogeneity).
  *   **Desert:** Race was a "plus factor" in a holistic review. Individual desert remained paramount, but "diversity" was framed as a component of institutional merit.

  ---

  ### II. Analytical Tasks

  #### 1. Strict Presuppositions vs. Incidental Fits
  *   **Norway:**
      *   *Strict:* Corporate boards function as quasi-public bodies; therefore, their composition must mirror the public.
      *   *Incidental:* This fits well with feminist theories of patriarchy, but the law does not require a belief in patriarchy. It fits with efficiency arguments (diverse boards perform better), but does not require them.
  *   **India:**
      *   *Strict:* Caste is a hereditary marker of disadvantage that persists over generations.
      *   *Incidental:* This fits with poverty alleviation, but the scheme is not universal poverty relief (poor upper-castes are excluded). It fits with reparation, but the "creamy layer" cut-off contradicts pure reparation logic.
  *   **USA:**
      *   *Strict:* Homogeneity is pedagogically inferior; heterogeneity improves decision-making and learning.
      *   *Incidental:* This fits with racial justice, but the logic technically allows for diversity of any kind (e.g., geographic, ideological). It fits with integration, but avoids the language of civil rights remediation.

  #### 2. Mutual Consistency
  The three regimes harbour **incompatible views** on what makes a group a fitting beneficiary.
  *   **Norway vs. India:** Norway requires no proof of disadvantage, only numerical absence. India requires proof of historical disadvantage, regardless of numerical presence in a specific sector. Under Norwegian logic, a wealthy Brahmin woman might qualify (if women are underrepresented); under Indian logic, she would not (if upper caste). Under Indian logic, a poor male from a Scheduled Caste qualifies; under Norwegian logic, he does not.
  *   **India vs. USA:** India treats caste as a proxy for harm requiring correction. The US regime treated race as a proxy for *perspective* contributing to a marketplace of ideas. India looks backward (reparation); the US looked forward (utility).
  *   **Norway vs. USA:** Norway mandates a fixed outcome (40%). The US regime forbade fixed numbers (quotas), requiring only holistic consideration. Norway prioritizes the *result*; the US prioritized the *process*.

  #### 3. Philosophical Underdetermination
  Each practice is underdetermined, allowing rival theories to license the same arrangement:
  *   **Norway:** Could be justified by **Corrective Justice** (men stole these seats) or **Utilitarianism** (women govern better). The law remains silent, allowing both proponents and opponents to project their theories onto the statute.
  *   **India:** Could be **Reparation** (paying a debt) or **Distributive Justice** (breaking class/caste ossification). The "creamy layer" suggests the latter, while the hereditary basis suggests the former.
  *   **USA:** Could be **Diversity** (stated) or **Soft Quotas** (practiced). Critics argued the "holistic" method was a sham for racial balancing; proponents argued it was genuine individualized review. The outcome (increased minority enrollment) was compatible with both theories.

  #### 4. Counterfactual Shifts
  *   **If Norway became Reparative:** The quota would need to be temporary (until the debt is paid) rather than permanent. It would likely require exemptions for companies that could prove no qualified women were available due to pipeline issues, not just board composition.
  *   **If India became Diversity:** Caste would become irrelevant. Reservations would be based on socioeconomic status or geographic origin to ensure a mix of life experiences, regardless of historical oppression.
  *   **If USA became Reparative:** The "diversity" rationale would vanish. Admissions would explicitly weigh historical harm. However, this would likely trigger strict scrutiny failure under current jurisprudence, requiring a Constitutional amendment or a radical shift in judicial philosophy to survive.

  ---

  ### III. The Two Puzzles

  **1. The Indian "Creamy Layer": Ongoing vs. Historical**
  The means-testing inside the Indian scheme creates a tension between **status-based reparation** and **class-based alleviation**.
  *   *The Conflict:* If the justification is reparation for historical exclusion (e.g., untouchability), the injury attaches to the person regardless of their current wealth. A wealthy Dalit still bears the social stigma of caste. Excluding them via the "creamy layer" suggests the goal is not to heal the wound of caste, but to prevent the capture of benefits by the elite *within* the caste.
  *   *Resolution:* This commits the scheme to **ongoing disadvantage** rather than pure historical reparation. It posits that caste *causes* disadvantage, but wealth can *mitigate* it. Therefore, the state only intervenes where the causal link remains active. This is consistent with a reparative rationale only if reparation is understood as "restoration of capability" rather than "payment for pain." If the goal is capability, the wealthy do not need the boost.

  **2. The Norwegian Board Seats: Positional Goods and Absolute Gain**
  Board seats are inherently **positional goods**; there are a fixed number of chairs. A 40% requirement for women necessitates a reduction in seats available to men.
  *   *Redistribution:* In terms of relative standing, this is a zero-sum transfer. Men lose status; women gain it.
  *   *Absolute Gain:* However, it delivers an **absolute gain in agency**. Previously, the group "women" had near-zero access to this locus of power. Moving to 40% grants the group absolute control over a portion of capital allocation they previously lacked.
  *   *Verdict:* It redistributes relative standing among individuals, but creates an absolute gain in *collective power* for the underrepresented group. It transforms the board from a private club into a public utility, changing the nature of the good itself from purely positional to partially civic.

  ---

  ### IV. Conclusion: Sorting Inconsistencies

  The apparent inconsistencies between these regimes divide into **genuinely philosophical conflicts** and **residue of political compromise**.

  **1. Genuinely Philosophical Inconsistencies**
  *   **The Definition of the Group:** Norway defines the group statistically (sex); India defines it historically (caste); the US defined it culturally/politically (race). These are incommensurable categories. One cannot simultaneously hold that groups are merely statistical imbalances to be corrected (Norway) and that they are historical victims owed debt (India).
  *   **The Nature of the Good:** The US view (education benefits the *class*) contradicts the Indian view (jobs benefit the *recipient*). If the good is purely for the third party (US), the minority student is instrumentalized. If the good is for the recipient (India), they are the end. These are conflicting moral statuses.
  *   **Individual vs. Collective:** Norway explicitly sacrifices individual meritocracy for collective composition. The US (nominally) and India (via the creamy layer) attempt to preserve a link between individual need/merit and the benefit.

  **2. Residue of Law, Administration, and Political Compromise**
  *   **US Legacy Admissions:** The survival of alumni preferences alongside the striking down of racial preferences is not philosophical; it is political. It reflects the power of donor classes rather than a coherent theory of merit or justice.
  *   **India's Creamy Layer Threshold:** The specific income cutoff for the "creamy layer" is administrative arbitrariness. It is a bureaucratic line drawn to manage political pressure from dominant castes, not a philosophical derivation of when caste disadvantage ends.
  *   **Norway's Dissolution Sanction:** The threat to dissolve a company is a legal hammer, not a philosophical necessity. It reflects a state-centric view of corporate sovereignty that is administratively severe but philosophically distinct from the quota itself (which could exist with lesser fines).

  **Final Assessment:**
  We file these under a single heading ("Affirmative Action") because they share a **family resemblance**: state intervention to alter the distribution of goods along group lines. However, they are not instantiations of a single principle. Norway is **Democratic Parity**; India is **Corrective Mobility**; the US was **Institutional Utility**. Treating them as one conceals the fact that they answer different questions: "Who should rule?" (Norway), "Who was harmed?" (India), and "Who learns best?" (US). The inconsistencies are not errors in application, but evidence that "affirmative action" is a container for three distinct political projects.
