prompt: |-
  A pattern in arts institutions has long puzzled me, and I would like you to reconstruct the philosophy it assumes. When a painter, novelist, or composer turns out to have done something appalling, museums and orchestras almost never remove the works themselves from the permanent collection or the repertory; the familiar justification is that a work must be judged on its own merits and that the artist's life is a separate matter. Yet those same institutions will cancel a retrospective, shelve a commission, take a name off a gallery wall, or quietly withdraw a piece from a benefit auction, and they do this without any suggestion that the works themselves have gotten worse. Meanwhile, works whose own content is degrading — canvases that traffic in racial caricature, films that sentimentalize the degradation of their subjects — remain on display and in the canon, largely without anyone reaching for these arguments at all.

  What theory of artistic value does this combination presuppose? Does it require the autonomist thesis that an artist's moral failings never bear on the value of the work, or can a moralist about the artist explain the same behavior by appeal to reputational and institutional costs that fall outside the work's value altogether? Which rival positions does the practice actually rule out, and which does it merely happen to fit? I am especially interested in the second asymmetry: if objectionable content is simply not treated as a reason for removal, what does that reveal about the operative theory of value, and does it sit consistently with the treatment of the artist? Finally, tell me what would have to change in institutional practice if the presupposed view were replaced by one on which a work's moral defects are genuine defects in the work.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Observation:** Arts institutions (museums, orchestras, etc.) exhibit a specific pattern of behavior regarding "problematic" art.
          *   *Case A (Bad Artist):* Artist does something appalling (moral failings, crimes). Works stay in collection/repertory ("art stands alone"), *but* retrospectives are cancelled, commissions shelved, names removed, benefit pieces withdrawn.
          *   *Case B (Bad Content):* Works contain degrading content (racism, sexism, etc.). These works *also* stay in collection/repertory, but the "art stands alone" justification isn't usually invoked; they are just kept as part of history/canon.
      *   **Task:** Reconstruct the underlying philosophy/theory of artistic value presupposed by this pattern.
      *   **Specific Questions to Address:**
          1.  What theory of artistic value does this combination presuppose?
          2.  Does it require *autonomism* (art separate from morality) or can *moralism* (art linked to morality) explain it via reputational/institutional costs?
          3.  Which rival positions does the practice rule out vs. merely fit?
          4.  Analyze the second asymmetry (Bad Content): If objectionable content isn't a reason for removal, what does that say about the value theory? Is it consistent with the treatment of the artist?
          5.  Counterfactual: What would change in institutional practice if the view shifted to one where moral defects *are* artistic defects (Ethical Criticism/Autonomism's opposite)?

  2.  **Analyze the Pattern (The "Institutional Pragmatism" Hypothesis):**

      *   *The "Bad Artist" Paradox:* We keep the work (intrinsic value unchanged) but stop celebrating the person (extrinsic context changed). This suggests a distinction between the *object* and the *brand/event*.
      *   *The "Bad Content" Paradox:* We keep the work despite offensive content. This suggests historical/documentary value outweighs immediate moral offense, or that aesthetic value is insulated from moral content.
      *   *The Tension:* If the artist's sin doesn't tarnish the work (Case A), why does the work's sin not tarnish the work (Case B)? Actually, the prompt notes that in Case B, people *don't* reach for the "separate matter" argument. They just keep it. Why? Probably because removing it erases history.
      *   *Core Philosophy:* It looks like a hybrid of **Moderate Autonomism** (the work's aesthetic value is distinct from the artist's biography) and **Institutional Consequentialism** (decisions are based on PR, funding, and mission stability rather than pure aesthetic theory).

  3.  **Address Question 1 & 2: Autonomism vs. Moralism vs. Pragmatism:**

      *   *Strict Autonomism:* Art is separate from morality. Artist's sins don't matter. Work's sins don't matter.
          *   *Fit:* Explains keeping the work in Case A and Case B.
          *   *Mismatch:* Doesn't explain cancelling retrospectives or removing names (Case A). If art is truly separate, why cancel the celebration of the artist?
      *   *Strict Moralism (Ethicism):* Moral defects are artistic defects.
          *   *Fit:* None. If this were true, bad artists' works and bad content works would be purged.
      *   *Contextual Moralism / Pragmatism:* The *work* has intrinsic aesthetic value (Autonomist), but the *institution* has ethical responsibilities regarding its platform (Moralist/Pragmatic).
      *   *Conclusion:* The practice presupposes a **Dual-Track Theory**.
          *   Track 1 (The Object): Moderate Autonomism. The work's aesthetic merit is independent of the artist's biography and largely independent of its moral content (or at least, moral content doesn't negate aesthetic merit).
          *   Track 2 (The Institution): Consequentialist/Reputational Ethics. The institution manages *celebration* and *association* based on current ethical norms and risk management, distinct from the *preservation* of the object.

  4.  **Address Question 3: Rival Positions:**

      *   *Ruled Out:* Radical Ethicism (art is morally evaluable and bad morality = bad art, leading to removal). Radical Biographism (the artist's life determines the work's value).
      *   *Merely Fits:* Moderate Moralism (Gaut's "moderate moralism" where moral defects *can* be aesthetic defects, but institutions ignore this for historical reasons). Contextualism.

  5.  **Address Question 4: The Second Asymmetry (Bad Content):**

      *   *Observation:* Racist paintings stay up.
      *   *Implication:* This reveals that **Historical/Testimonial Value** trumps **Moral/Aesthetic Defect**. The institution sees itself as a museum of *culture*, not a gallery of *virtue*.
      *   *Consistency:* Is it consistent with Case A?
          *   Case A: We hide the artist (shame the sinner) but keep the art (save the sinner's output).
          *   Case B: We keep the art (show the sin) but contextualize it (shame the era/sentiment).
          *   *Tension:* In Case A, we act as if the art is "pure" enough to survive the artist's sin. In Case B, we act as if the art is "dirty" but too important to hide.
          *   *Resolution:* The operative theory is **Archival Preservationism**. The primary duty is to keep the record, not to curate moral perfection. The "cancellation" in Case A is about *honor* (retrospectives), not *existence* (storage/viewing).

  6.  **Address Question 5: The Counterfactual (If Moral Defects = Artistic Defects):**

      *   *Scenario:* Adopt Ethicism (moral flaws reduce aesthetic value).
      *   *Changes:*
          *   De-accessioning works with racist content (they are now "bad art").
          *   Re-evaluating the canon (Wagner, Picasso, R. Kelly might be downgraded aesthetically, not just ethically).
          *   Less distinction between "Artist" and "Work" (if the artist's immorality infects the work's moral texture, and that texture is aesthetic, then the work is aesthetically compromised).
          *   Retrospectives might still happen but framed as "studies in aesthetic failure due to moral blindness."
          *   Commissions would undergo strict moral vetting of the *person* because the person's morality is now an aesthetic component of the commission.

  7.  **Drafting the Response (Iterative Refinement):**

      *   *Tone:* Philosophical, analytical, precise.
      *   *Structure:*
          1.  Introduction: Define the "Institutional Dualism."
          2.  The Theory of Value: Moderate Autonomism + Institutional Consequentialism.
          3.  Autonomism vs. Moralism: Why strict versions fail, why a pragmatic hybrid works.
          4.  Ruled Out vs. Fits: Ethicism is ruled out; Contextualism fits.
          5.  The Second Asymmetry (Content): Archival Duty vs. Moral Endorsement.
          6.  Counterfactual: The Ethical Institution.
      *   *Key Concepts to Weave In:* Separability Thesis, Ethicism (Gaut), Moderate Moralism, Institutional Mission, De-accessioning, Canon formation.

      *(Self-Correction during drafting)*: I need to be careful not to say institutions *never* remove content. They sometimes do (e.g., Dana Schutz's *Open Casket* protests, though the painting wasn't removed, or the Whitney Biennial controversies). But the prompt says "largely without anyone reaching for these arguments." I should stick to the prompt's premise: the *default* is retention.
      *Refinement on Case A:* Why cancel the retrospective if the art is good? Because a retrospective is an *honor*, not just a display. It implies endorsement of the *creator*, not just the *creation*. This is a crucial distinction.
      *Refinement on Case B:* Why keep racist art? Because it testifies to the racism of the era. Removing it is revisionism.
      *Synthesis:* The theory is that **Art is a Document** (preserved regardless) but **Artistry is a Honor** (withheld based on conduct).

  8.  **Final Polish:** Check against all parts of the prompt.
      *   Reconstruct philosophy? Yes (Archival Autonomism).
      *   Autonomist vs. Moralist explanation? Yes (Pragmatic Hybrid).
      *   Ruled out vs. Fits? Yes (Radical Ethicism ruled out).
      *   Second asymmetry analysis? Yes (Documentary value).
      *   Counterfactual changes? Yes (De-accessioning, re-evaluation).

  9.  **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  The pattern you describe reveals that arts institutions do not operate under a single, coherent aesthetic theory, but rather under a **pragmatic dualism** that separates the *ontology of the object* from the *economics of reputation*.

  To reconstruct the philosophy presupposed by this behavior, we must look past standard academic debates (Autonomism vs. Moralism) and identify the operative institutional logic. The practice assumes a theory I will call **Archival Autonomism paired with Ceremonial Moralism**.

  Here is the reconstruction of that philosophy, followed by an analysis of the asymmetries and the counterfactual scenario you requested.

  ### 1. The Presupposed Theory of Value: Archival Autonomism

  The behavior you describe presupposes that the **primary value of an institutionalized work is testimonial and historical, not merely aesthetic or ethical.**

  *   **Regarding the Artist (Case A):** Institutions act as if the work possesses an *intrinsic aesthetic stability* that is immune to the artist's biography (Autonomism). However, they simultaneously act as if the *presentation* of the work (retrospectives, named galleries) constitutes an act of *honor* or *endorsement* directed at the artist (Ceremonial Moralism).
      *   *The Logic:* The painting is a static object whose merit is fixed; the retrospective is a dynamic event that confers status. You can preserve the object without conferring the status.
  *   **Regarding the Content (Case B):** Institutions act as if the work's moral defects are **documentary features** rather than **aesthetic flaws**. A racist caricature is preserved not because the racism is aesthetically neutral, but because the racism is historically evidentiary.
      *   *The Logic:* To remove the work is to falsify the historical record. The "value" here is archival integrity, which supersedes immediate moral comfort.

  Therefore, the underlying theory is not pure Autonomism (which would demand we ignore the artist's sins entirely, including cancelling the retrospective) nor pure Moralism (which would demand we purge immoral works). It is a **Functional Separation**: The *collection* serves the public trust (preservation of history), while the *program* serves the public conscience (curation of honor).

  ### 2. Autonomism vs. Moralism: Which Explains the Behavior?

  Does this require the autonomist thesis? **No.** Strict Autonomism is actually incompatible with the cancellation of retrospectives. If the artist's life is truly a "separate matter" that never bears on the work, there is no aesthetic justification for cancelling a retrospective, since a retrospective is simply a larger display of the works.

  Conversely, can a Moralist explain this? **Yes, but only a specific kind.**
  *   **Radical Ethicism** (moral defects are artistic defects) is ruled out. If this were the operative view, works with degrading content (Case B) would be de-accessioned as "bad art," and works by appalling artists (Case A) would be deemed aesthetically compromised by their creator's corruption.
  *   **Moderate Moralism** (moral defects *can* be artistic defects) fits better, but institutions ignore the "can." They act as if moral defects are *irrelevant* to retention but *relevant* to reputation.

  The most accurate explanation is **Institutional Consequentialism**. The institution is not judging the *value* of the work in a metaphysical sense; it is managing *liability*.
  *   **Keeping the work:** Low cost (storage is cheap, controversy is manageable with placards).
  *   **Cancelling the retrospective:** High benefit (signals ethical alignment to donors and public without destroying assets).
  *   **Keeping racist content:** High cost of removal (accusations of censorship, erasure of history) vs. manageable cost of retention (contextualization).

  Thus, the practice does not require a commitment to Autonomism as a truth claim; it requires Autonomism as a **policy heuristic** for asset management, overlaid with Moralism as a **PR strategy** for public engagement.

  ### 3. Rival Positions: Ruled Out vs. Merely Fits

  **Ruled Out:**
  1.  **Radical Ethicism:** The view that a moral flaw is necessarily an aesthetic flaw. If this were true, institutions would be aesthetically justified in throwing away racist paintings or works by criminals. They do not.
  2.  **Radical Biographism:** The view that the work is an extension of the soul of the artist, such that a corrupted soul corrupts the object. If this were true, the "art stands alone" justification would be impossible to maintain; the work itself would be treated as contaminated evidence.
  3.  **Purist Censorship:** The view that institutions should be morally sanitized spaces. The retention of degrading content rules this out.

  **Merely Fits:**
  1.  **Contextualism:** The view that the work's meaning changes based on context. This fits because institutions change the *context* (wall text, cancelled galas) without changing the *work*.
  2.  **Moderate Autonomism:** The view that moral and aesthetic categories are distinct but can interact. This fits the practice loosely, but the practice is more rigid: it insists on *non-interaction* for the object (keep it) but *high interaction* for the brand (cancel the show).

  ### 4. The Second Asymmetry: Objectionable Content

  You asked specifically about the second asymmetry: *If objectionable content is not treated as a reason for removal, what does that reveal, and is it consistent with the treatment of the artist?*

  **What it Reveals:**
  This reveals that the institution views itself as a **Museum of Culture**, not a **Gallery of Virtue**. The operative theory of value is **Historical Testimonialism**. The value of the work lies in its ability to testify to the time in which it was made.
  *   If we remove a racist canvas, we lose evidence of the racism of that era.
  *   If we remove a painting by a criminal, we do not lose evidence of the crime (the court records do that); we only lose the aesthetic output.

  **Is it Consistent?**
  There is a tension, but it is resolvable within the Institutional Consequentialist framework:
  *   **Case A (Bad Artist):** The "sin" is external to the work. Removing the *celebration* (retrospective) distances the institution from the sin without destroying the testimony of the art.
  *   **Case B (Bad Content):** The "sin" is internal to the work. Removing the *work* would destroy the testimony of the era. Therefore, the work must stay, but the institution must distance itself via *context* (placards, lectures).

  **The Inconsistency:** The inconsistency arises if one claims the artist's immorality *taints* the work (justifying cancelling the show) but the work's immorality *does not taint* the work (justifying keeping it).
  *   *Resolution:* The institution implicitly argues that **Agency matters more than Content.** We punish the *agent* (the artist) by withholding honor, but we preserve the *artifact* (the content) because artifacts are silent witnesses. We can shame a living or recent memory (the artist); we cannot shame a historical document (the racist canvas) without lying about history.

  ### 5. The Counterfactual: If Moral Defects Were Artistic Defects

  If the presupposed view were replaced by **Ethical Criticism** (the view that a work's moral defects are genuine defects in the work's artistic value), institutional practice would undergo a radical transformation:

  1.  **De-accessioning would become standard:** Works that traffic in racial caricature or sentimentalize degradation would be re-evaluated as *aesthetically inferior*. Just as a museum might sell a fake Vermeer because it is aesthetically worthless, they would sell or store away a racist Norman Rockwell because its moral failure constitutes an aesthetic failure. The canon would shrink.
  2.  **The "Separate Matter" Defense would vanish:** Institutions could no longer claim the artist's life is separate. If morality is part of artistic value, then a predatory artist has produced aesthetically compromised work. Retrospectives would not just be cancelled for PR reasons; they would be cancelled because the *curatorial thesis* (that this artist is great) is now factually dubious.
  3.  **Commissions would require Moral Vetting:** Currently, commissions are vetted for competence. Under Ethical Criticism, the artist's character is a component of the art's future value. A commission given to a morally suspect artist would be seen as investing in a depreciating asset.
  4.  **Re-contextualization vs. Removal:** Currently, institutions add placards to explain away bad content. Under Ethical Criticism, placards are insufficient. If the flaw is *in the work*, explaining it doesn't fix the aesthetic damage. The work would likely be moved from "Masterpiece" halls to "Study Collection" status, treated as a cautionary tale rather than a triumph.
  5.  **Benefit Auctions:** Works would not be withdrawn quietly; they would be explicitly rejected as lacking value. The withdrawal would be framed not as "avoiding controversy" but as "maintaining quality standards."

  ### Summary

  The current pattern presupposes **Archival Autonomism**: the belief that the object must be preserved as history (regardless of content) while the *honor* bestowed upon the creator is contingent on moral behavior. It is a pragmatic compromise that allows institutions to keep their assets (the art) while protecting their brand (the morality).

  It rules out the idea that art is essentially moral (Ethicism), but it also rules out the idea that art is essentially amoral (Pure Autonomism). Instead, it treats art as **property** (which you keep) and the artist as **partner** (whom you can fire). The second asymmetry (keeping bad content) confirms that the institution's ultimate loyalty is to the **Historical Record**, not to **Moral Purity**, provided the Moral Purity of the *institution itself* is managed through the careful withholding of honors from bad actors.
