          *   *Ambiguity Advocate:* Believes ambiguity is distinct from risk. Maximin or refusing unreliable odds is rational.
      *   **Setting:** A pub table.
      *   **Key Prop:** Three Urns.
          *   Urn 1: 50/50 known (Risk).
          *   Urn 2: Unknown proportions (Classic Ambiguity).
          *   Urn 3: Deterministic rule known, but computationally expensive to solve (Epistemic/Computational Uncertainty).
      *   **Key Questions to Address:**
          *   Is Urn 3 ambiguous or just uncertain?
          *   Does this change rational action?
          *   SEU press: "If you don't assign probabilities, choice isn't well-defined."
          *   Ambiguity press: "Sure-thing principle violation as reductio."
          *   Paying to peek: Would they pay for information?
          *   Ontology: Is the disagreement about the world or the chooser's head?
      *   **Tone:** Sharp, concrete, no name-dropping, no straw men, genuine clash.

  2.  **Character Development:**
      *   *SEU (Let's call him "Julian"):* Precise, slightly impatient with vagueness, believes coherence is king. Sees probability as a state of mind, not just a feature of the world.
      *   *Ambiguity (Let's call her "Elena"):* Pragmatic, skeptical of false precision, believes context matters. Sees probability as requiring justification, not just introspection.

  3.  **Drafting - Section by Section:**

      *   **Scene Setting:** Keep it atmospheric. Pub noise, beer mats, the physical presence of the urns (or the description of them).
      *   **The Setup (Urns 1 & 2):** Establish the baseline. Julian wants to treat them the same (assign 50% to Urn 2). Elena refuses.
      *   **The Twist (Urn 3):** Introduce the deterministic but hard-to-calculate urn. This is the crux.
      *   **The Clash on Urn 3:**
          *   Julian: It's fixed. Therefore, there *is* a probability (0 or 1), and your uncertainty is just ignorance. You must have a credence.
          *   Elena: It's not just ignorance; it's the *cost* of knowledge. The structure matters.
      *   **The "Put a Number on It" Challenge:** Julian demands a price for a bet. Elena hesitates or gives a range. Julian attacks the incoherence (Dutch Book argument implied).
      *   **The Sure-Thing Principle:** Elena uses the Ellsberg logic (preferring 1 over 2 on Red, but 2 over 1 on Black) to show inconsistency in Julian's view. Julian defends it as a requirement for not leaving money on the table.
      *   **Paying to Peek:** How much to lift the lid?
          *   Julian: Value of Information calculation.
          *   Elena: Urn 2 info is valuable because it reduces ambiguity. Urn 3 info is valuable because it reduces computation. Or is it?
      *   **World vs. Head:** The philosophical wrap-up. Is probability "out there" or "in here"?

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Am I making Julian too robotic? *Fix:* Give him a point about coherence preventing exploitation. He's not a robot; he's a defender of consistency.
      *   *Check:* Is Urn 3 distinct enough? *Fix:* Emphasize that the rule is *right there*. It's not hidden by a malicious host, just by complexity. This tests the "unknown probability" vs. "unknown fact" distinction.
      *   *Check:* Did I include the "fee to peek"? *Fix:* Need to ensure they discuss paying to resolve the uncertainty.
      *   *Check:* Is the ending satisfying? *Fix:* Don't solve it. Leave the tension. It's a long read, not a textbook.

  5.  **Drafting the Dialogue (Iterative Process):**
      *   *Opening:* Start mid-conversation or right at the pour. Let's start with the urns on the table.
      *   *Urn 1 & 2:* Get the Ellsberg preference out early. Julian: "Why?" Elena: "Because I don't know." Julian: "You *think* you don't know."
      *   *Urn 3:* Bring it in. The card with the algorithm.
      *   *Julian's move:* Urn 3 is just Urn 2 with extra steps. The probability exists.
      *   *Elena's move:* Urn 3 is different because the *source* of uncertainty is different. One is ontological (to me), one is epistemic/computational.
      *   *The "Number" Demand:* Julian: "What's your price for a ticket?" Elena: "I don't have one." Julian: "Then you're vulnerable."
      *   *Sure-Thing:* Elena brings up the contradiction in betting on Red vs Black.
      *   *Paying to Peek:* Julian calculates expected value. Elena talks about trust and robustness.
      *   *Head vs. World:* Julian: It's about your mind's consistency. Elena: It's about the world's resistance to being quantified.

  6.  **Polishing:**
      *   Remove academic jargon where possible (e.g., instead of "Dutch Book," say "guaranteed loss").
      *   Ensure the rhythm feels like a pub argument (interruptions, gestures, sips of beer).
      *   Check the Urn 3 logic: If the rule is deterministic, the proportion is fixed. To a Bayesian, the probability is 1 or 0, but the *credence* is the degree of belief. Julian must argue credence applies. Elena must argue that credence is inappropriate without a generative process.

  7.  **Final Review against constraints:**
      *   No citations? Yes.
