answer: |-
  **Exam Question**

  **Question 4**
  A research institute launches 'Delphi', a system that answers factual questions in fluent prose. Every answer Delphi has produced has been checked and found correct, but the only public record of these checks is the institute's own published reports. The system's internal workings are opaque, even to its builders. Nadia, a postgraduate student, has a specific factual query. She consults Delphi, receives an answer, and finds she has no independent source to verify it; her only evidence for Delphi's reliability is the institute's testimonial reports. She is minded to believe Delphi's answer. Is Nadia epistemically justified in doing so?

  Construct an argument that evaluates Nadia's position through the lenses of Local Reductionism, Global Reductionism, and Anti-Reductionism. Your answer should specifically address the circularity problem facing the reductionist when the evidence for reliability is itself testimonial. Furthermore, assess whether the anti-reductionist's default entitlement can coherently extend to an opaque, non-human source, or if restricting it to human speakers undermines the view. Conclude by reflecting on what this case reveals about whether justification stems from the hearer's reasons or the source's reliability.

  ***

  **Model Answer**

  Nadia's justification depends entirely on which framework of testimonial knowledge one adopts. The Delphi case is designed to sever the link between a hearer's independent reasons and the source's actual reliability, exposing a fault line in reductionist accounts while pressuring the scope of anti-reductionism.

  For the reductionist, testimony is not a basic source of knowledge; it reduces to induction, memory, and perception. A hearer requires positive reasons to believe a speaker is reliable. Local reductionism demands reasons specific to the occasion, while global reductionism allows reasons based on the general reliability of testimony. In Nadia's case, both struggle. She possesses no independent verification of Delphi's current output. Her only evidence for Delphi's reliability is the institute's report. However, accepting that report as evidence requires accepting testimony. If she must have independent reasons to trust the report, she faces a vicious regress or circularity: she needs testimony to validate the reliability of testimony. The reductionist insists the justificatory work is done by the hearer's inductive base. Here, that base is contaminated by the very source it is meant to evaluate. Consequently, a strict reductionist must deny Nadia is justified, as she lacks non-testimonial grounds for trust.

  Conversely, the anti-reductionist argues that testimony is a basic source of justification, akin to perception. We possess a default entitlement to believe what is told to us, absent defeaters. On this view, Nadia is justified almost immediately. Delphi asserts *p*; Nadia has no reason to doubt *p*; therefore, she is entitled to believe *p*. The justificatory work is done by the source's reliability and the normative status of the assertion, not by Nadia's inductive labour. However, the Delphi case forces a complication: is this entitlement restricted to human speakers? Many anti-reductionists ground entitlement in the normative obligations of communication (e.g., the assurance of truth). Delphi offers no such assurance; it is an opaque tool. If the anti-reductionist restricts entitlement to humans to preserve the normative account, they risk ad hocery, appearing to retreat to reductionism whenever the source is non-human. If they extend entitlement to Delphi, they must explain how a non-normative source generates epistemic rights.

  Ultimately, this case reveals that the disagreement is not merely about how much evidence is required, but about the order of justification. For the reductionist, the hearer's reasons are prior; the source is reliable *because* the hearer has reasons to think so. For the anti-reductionist, the source's reliability (or normative status) is prior; the hearer is entitled *because* the source is of a kind that transmits knowledge. Nadia's predicament shows that if we remove the hearer's independent inductive base, reductionism collapses into scepticism regarding new sources. Anti-reductionism avoids scepticism but must clarify whether entitlement is a right we have against the world or a privilege granted only within human community. The Delphi case suggests that if testimony is to function in a technologically mediated world, justification must rely more on the source's track record than the hearer's ability to independently verify it.

  ***

  **Marking Scheme**

  **Total Marks: 20** (5 Points × 4 Marks each)

  | **Point** | **Criteria for Full Marks (4)** | **A vs. B Distinction** | **Typical Mistake** |
  | :--- | :--- | :--- | :--- |
  | **1. Reductionist Requirements** | Clearly defines Local/Global Reductionism as requiring positive, non-testimonial reasons for reliability. | **A:** Distinguishes Local vs. Global nuance. **B:** Treats reductionism as a monolith. | Confusing reductionism with scepticism generally. |
  | **2. The Circularity Problem** | Identifies that Nadia's evidence for reliability is itself testimonial, creating circularity for the reductionist. | **A:** Explains *why* this creates a regress/vicious circle. **B:** States there is no evidence without explaining the circularity. | Claiming Nadia has *no* evidence, rather than *testimonial* evidence. |
  | **3. Anti-Reductionist Entitlement** | Correctly outlines the default entitlement view (justification without positive reasons). | **A:** Links entitlement to the absence of defeaters. **B:** Describes it simply as 'trusting anyone'. | Suggesting anti-reductionists require *no* conditions whatsoever. |
  | **4. The Human Source Restriction** | Discusses whether default entitlement applies to non-human/opaque sources (the 'fudge' worry). | **A:** Evaluates the cost of restricting vs. extending entitlement. **B:** Merely notes Delphi isn't human. | Ignoring the restriction issue entirely. |
  | **5. Source of Justification** | Concludes on the meta-epistemological divide: hearer's reasons vs. source's reliability/normativity. | **A:** Synthesises this as the core theoretical divergence. **B:** Treats it as a minor concluding thought. | Focusing only on the verdict (Yes/No) without the 'why'. |

  **Grading Notes:**
  *   **17–20 (A):** Fluent integration of all five points; the circularity objection is handled with precision; British spelling and grammar throughout.
  *   **14–16 (B):** Covers all points but may lack depth on the circularity or the human-restriction nuance; may rely on generalities.
  *   **10–13 (C):** Identifies the theories but fails to apply them specifically to the Delphi case mechanics.
  *   **<10 (Fail):** Fundamental misunderstanding of the reductionist/anti-reductionist distinction.
