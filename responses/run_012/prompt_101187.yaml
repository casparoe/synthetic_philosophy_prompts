      *   **Nadia (Anti-PP/Critic):** Needs to be precise, not just a technocrat. Her argument isn't "progress good," it's "PP is incoherent or collapses into CBA." She should press the symmetry argument hard.

  3.  **Drafting - Section by Section:**

