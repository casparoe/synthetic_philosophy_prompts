      *Wait, one more check:* The user says "If it's 6, tell me what sort of evidence empirical success is meant to be." Okay, I need to be specific about *Inference to the Best Explanation* (IBE) or *No Miracles Argument*. Success is evidence that the *causal structure* is roughly captured, even if parameters are idealized.

