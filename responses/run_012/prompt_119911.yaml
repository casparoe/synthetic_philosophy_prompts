      *   *Step 6 is the pivot.* "Nothing changes when you bolt a load of such models together." This is the claim that theories add no ontological weight.
      *   *Step 11 is also weak.* It generalizes underdetermination. But underdetermination is rare in practice (Newton vs GR make different predictions eventually).
      *   *Focus on Step 6.* It denies that theories explain the *success* of the idealizations.
      *   *The "Slot" for Gas Law vs. Bohr:* The slot is **Explanation of Domain Validity**. Kinetic theory explains *when* the ideal gas law holds. Bohr theory couldn't explain *why* it failed for Helium without ad-hoc fixes. QM did. Realism is about the QM, not the Bohr model.

  7.  **Final Polish:**
