answer: |-
  Good evening. For those who don't know me, I had the privilege of working for our guest of honour for eight years. For those who do know me, you'll be relieved to hear I have been instructed to keep this under seven minutes, largely because the bar is open and half the room is already eyeing the wine list with the intensity of a planning inquiry.

  It is a peculiar thing to toast a career spent listening to complaints. Twenty-six years. Twenty-six years of extractor fans, security lights, and depots waking up at four in the morning. In Leeds, on a Thursday, surrounded by acousticians, economists, and a family who still aren't entirely sure what a 'nuisance tribunal' actually does, we are here to celebrate a woman who made a living telling people that their suffering did not count.

  That sounds harsh. She would say it sounds accurate.

  We all know the rule. She recited it at the start of nearly every hearing. *'A grievance that is beneath notice when it happens does not become a grievance by happening to a great many people, or to one person a great many times.'*

  To the professionals in the room, this is the 'Threshold Principle'. To the family, it is the reason Grandma never let you complain about your brother breathing too loudly. To her, it was simply the only thing standing between order and chaos. She was immovable on it. It made her admired, it made her infuriating, and it made her the best chair this tribunal has ever seen.

  But I want to talk about a case she never had to decide. I have been turning it over since she announced her retirement, and I think it is the sharpest thing that can be said against her. I offer it not to undermine her, but because she would not respect a eulogy that lacked teeth.

  Imagine a nuisance so small no one would ever complain of it on its own. A single minute of dull headache. Or the squeak of a garden gate. Now, suppose one person receives one of these every day for eighty years. At unpredictable hours. They can never point to the moment they were harmed; no single day was ruined. But over a lifetime, that is roughly thirty thousand minutes of irritation. A life nagged away, grain by grain.

  Her rule says: *Nothing there.* No single instance crossed the threshold.

  Now, suppose instead that the very same quantity of irritation — the same thirty thousand minutes — is scattered one minute apiece across thirty thousand strangers. Each person feels a twinge, forgets it by lunchtime, and moves on.

  Her rule says: *Nothing there either.*

  And here is the uncomfortable part. Her rule says the two cases are exactly equally 'nothing'. Because in neither case does a single instance rise above the threshold.

  To the economists in the room, the aggregate harm is identical. To the human heart, they feel profoundly different. One is a tragedy of erosion; the other is a statistical shrug. To suggest they are equal feels like a denial of experience. It suggests that if we cannot measure the wound at the moment it is made, the wound does not exist.

  I know what she would say to me. She would say that if we allow the accumulation of the negligible to count, we open the floodgates to a world where every minor friction becomes a lawsuit. If thirty thousand minutes of headache count when scattered, do they count when concentrated? If so, where is the line? Who measures the headache? If we accept the accumulation, we must measure everything. And if we must measure everything, we stop living and start litigating.

  She took the burden of that verdict so that the rest of us didn't have to. She absorbed the frustration of being called cold so that the system didn't become paralysed. She understood that for a tribunal to function, it must be able to say 'no' to the truth sometimes, in service of a workable reality.

  There is a cost to that, of course. The cost is that there are people who walked out of her courtroom feeling unheard. I suspect she lies awake sometimes counting them. But I also suspect she knows that the alternative is worse.

  So, do I let her off the hook? Do I say that surely, in her heart, she knew the thirty thousand minutes mattered?

  No. I think I will leave her on it.

  Because she never asked for our comfort. She asked for our consistency. She taught us that there is a difference between what is painful and what is actionable. That is a hard lesson. It is a lesson that requires a certain hardness in the teacher.

  To the family: thank you for lending her to us. We know she brought the tribunal home sometimes. We know the extractor fan in your own kitchen probably gets inspected more rigorously than the ones in Leeds. But look at what she built. She built a boundary. She drew a line in the noise and said, 'This far, and no further.'

  And to my colleague who is speaking next — a man who has spent two decades arguing that she was wrong about the mathematics of sound — I will not steal your thunder. I know you have prepared a detailed rebuttal regarding the cumulative impact of low-frequency noise. I look forward to it. I am sure she does too. She always did prefer a good fight to a easy victory.

  So, please raise your glasses.

  To our Chair. For the hearings she adjourned, for the complaints she dismissed, and for the thirty thousand minutes of headache she refused to count. We are comfortable tonight precisely because you were willing to be uncomfortable for twenty-six years.

  To her.
