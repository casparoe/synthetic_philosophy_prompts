      *   **Core Joke:** He is unknowingly replicating Jean-Jacques Rousseau's *Letter to d'Alembert on Spectacles* (1758) argument for argument. He is sincere, bureaucratic, and uneducated on the philosophy.
      *   **Required Arguments:**
          1.  Acting is lying/faking a soul; building a temple to this makes citizens loose with the truth.
          2.  Theater flatters rather than corrects (Example: Molière's *Misanthrope* where honesty is mocked).
          3.  Theater emotions are sterile (weeping in the dark doesn't translate to action in daylight).
          4.  Positive Vision: Festivals with no stage/seats, everyone participating (dancing, bonfires), vs. passive dark rooms.
          5.  Handle the Rousseau embarrassment (he wrote plays/opera) and the context (d'Alembert's article was warm/mild). Wave them away dismissively.
      *   **Tone:** Deadpan, sincere, bureaucratic, slightly sinister/crankish, no winking at the reader.
      *   **Length:** Around 650 words.
      *   **Ending:** Inspiring line (to him), potentially chilling to the reader.

  2.  **Deconstruct the Voice:**
      *   Bureaucratic but passionate.
