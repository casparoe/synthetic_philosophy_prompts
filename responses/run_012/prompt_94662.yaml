      *   *Check Tone:* Is it too funny? Needs to be deadpan. The humor comes from the seriousness.
      *   *Check Rousseau Accuracy:* Ensure the *Misanthrope* point is clear (honest man laughed at). Ensure the festival point emphasizes *participation* over *watching*.
      *   *Check the "Wave Away":* How does he handle the fact that he might be contradicting himself or history? He should treat it as irrelevant trivia. "History is full of compromises."
