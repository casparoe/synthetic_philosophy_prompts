answer: |-
  **Memorandum on the Reallocation of Cultural Capital**
  **From:** Commissioner Elias Thorne, Office of Public Spectacles
  **Re:** The Riverfront Performing Arts Complex

  Effective immediately, construction on the Riverfront Performing Arts Complex is halted. The remaining budget will not be lost; it is being redirected into a permanent program of municipal festivals. I anticipate confusion. I am writing to clarify the civic logic behind this decision.

  We cannot build a temple to the art of convincingly faking a soul and then act surprised when the citizenry gets loose with the truth. The actor's profession is institutionalized insincerity. He is paid to stand before you and claim he is a king, a lover, a victim. He is not. When we fund this, we are subsidizing the normalization of deceit. A city that applauds professional liars in the evening should not expect rigorous honesty in its marketplaces the next morning. We are choosing integrity over ambiance.

  Furthermore, the theater flatters its audience instead of correcting it. Consider the standard repertoire. In Molière's *Misanthrope*, the bluntly honest man is the one everybody laughs at. The smooth cynic walks away looking reasonable. The audience leaves feeling that sincerity is a little gauche, that compromise is wisdom. This is not education; it is validation. We do not need a venue that teaches our neighbors to laugh at virtue because it lacks polish.

  There is also the matter of sterile emotion. In a darkened room, you weep at a tragedy. The weeping is the whole thing. You feel a surge of pity, you wipe your eyes, and you go home. Nothing you felt in the dark ever has to be spent in daylight. It is pity without cost. You have discharged your duty to humanity by crying for a fictional orphan, and thus you are less likely to feed a real one. We will not fund emotional release valves that prevent actual action.

  Our alternative is transparency. We are designing festivals with no stage and no seats. There is no audience left to be passive once everyone is standing in the middle of it. We will have dancing in the square, athletic competitions, bonfires. In this configuration, you are not a consumer of spectacle; you are the spectacle. You are watched by your neighbors, and you watch them. Contrast this with a room where you pay to sit quietly in the dark and watch professionals perform behind a proscenium arch. One model isolates; the other binds.

  I am aware of the historical footnotes. Critics will note that certain proponents of this view once penned plays and operas themselves. They will note that the original suggestion for a theater was a mild compliment to our city's character, not an invasion. These are inconsistencies of biography and tone. They are irrelevant. Genius is often inconsistent; policy must not be. A polite suggestion is still a wedge. If we allow the wedge, we must eventually accept the door it opens.

  We are closing that door. We are removing the roof so there are no shadows to hide in. We are dismantling the fourth wall because there should be no wall at all. Some will call this austerity. I call it clarity.

  A city has nothing to fear if it has nothing to hide. Let us stand in the light.
