          *   *Addressing User's Question:* Infinitists say stopping is *never* justified epistemically, only pragmatically. We stop because we die (or deadline hits), not because we know.

      *   **4. The Residue Report (The Pragmatic Stopping Rule):**
          *   *User's Rule:* Cost of error < Cost of silence.
          *   *Analysis:* This is *Pragmatism* (Peirce, James, Dewey) or *Contextualism* (Wittgenstein, Annis). It's not strictly one of the big three. It treats justification as action-guiding, not truth-mirroring.
