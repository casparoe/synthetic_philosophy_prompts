answer: |-
  Here is the translation of the three classical positions into the vocabulary of the newsroom, followed by the residue report you asked for.

  ### 1. Foundationalism: The Primary Document
  **The Philosophy:** Foundationalism argues that the structure of knowledge is a pyramid. At the bottom are "basic beliefs." These do not need support from other beliefs; they are self-evident, incorrigible, or evident to the senses. Everything else rests on them. If the bottom falls out, the top collapses.

  **The Newsroom Translation:** This is the culture of the **primary document** and the **eyewitness**.
  In a foundationalist newsroom, a story is warranted only if it rests on claims that require no further attribution. "I saw the minister sign the bill." "We have the signed PDF." "The data file is in our possession." These are your basic beliefs. They are "on the record" in the strongest sense: they are the record.
  The editor who asks "How do you know?" is satisfied by "Because I am holding it." The chain of custody ends here. You do not ask who created the document; the document *is* the creator of the fact.
  **The Correction:** If a foundational belief turns out to be wrong (the PDF was a forgery, the eyewitness was lying), the retraction is catastrophic. It doesn't just adjust a detail; it invalidates the structural integrity of the entire piece.

  **Your Question:** *Is a primary document a foundation in the philosophical sense, or merely a place where inquiry stops for practical reasons?*
  **The Answer:** It is merely a practical stop, which is a problem for strict Foundationalism. In philosophy, a foundation must be *incorrigible* (you cannot be mistaken about it). In journalism, you can always be mistaken about a document (it's a draft, it's altered, it's taken out of context).
  **Does it matter?** Yes. If you treat a practical stop as an epistemic foundation, you become vulnerable to the "forged document" scenario. A true philosophical foundation cannot be wrong. A primary document can. Therefore, newsroom foundationalism is actually a **fallibilist foundationalism**: you treat the document as bedrock *until* it cracks.

  ### 2. Coherentism: The Triangulation
  **The Philosophy:** Coherentism argues there is no bottom to the pyramid. Beliefs are warranted by how well they fit together in a web. Belief A supports Belief B, which supports Belief C, which loops back to support Belief A. Justification is a property of the system, not the individual nodes.

  **The Newsroom Translation:** This is the practice of **corroboration** and **multiple sourcing**.
  You don't have the document (no foundation). Instead, you have Source A, Source B, and Source C. None of them is perfect on their own. Source A is on background; Source B is peripheral; Source C is an expert interpreting the data. But their stories *cohere*. They fit together without contradiction. The warrant for the story is not that any single source is infallible, but that the network of sources holds together under tension.
  **The Correction:** When you publish a coherent story that turns out to be false, it usually means the web was tight but detached from reality. You issue a correction noting that "sources misled the reporting."

  **Your Question:** *Is the "three sources heard from the same person" problem a flaw in my translation or a real difficulty for the view itself?*
  **The Answer:** It is a real difficulty for the view itself. In philosophy, this is called the **Isolation Objection**. A coherent fairy tale is still a fairy tale. If three sources all heard it from the same liar, your web is perfectly coherent and perfectly false. Coherentism struggles to explain how the web hooks onto the world.
  In the newsroom, we solve this by smuggling in Foundationalism (we demand at least one documentary anchor) or Pragmatism (we assess the sources' reliability). Pure Coherentism is dangerous in journalism; it allows for echo chambers where the internal logic is flawless but the reporting is wrong.

  ### 3. Infinitism: The Endless Edit
  **The Philosophy:** Infinitism argues that for a belief to be justified, it must be supported by a reason, which is supported by another reason, ad infinitum. There is no bottom (foundation) and no circle (coherence). The chain of reasons goes on forever.

  **The Newsroom Translation:** This is the **editor who never signs off**.
  You say the minister signed the bill. The editor asks, "How do you know?" You say, "I have the document." The editor asks, "How do you know the document is authentic?" You say, "The source sent it." The editor asks, "How do you know the source isn't lying?" You say, "Because their past record is good." The editor asks, "How do you know their past record isn't curated?"
  In an infinitist newsroom, no story is ever ready to run. Every attribution demands a meta-attribution. Every chain of custody demands a verification of the verifier.
  **The Correction:** There are no corrections because nothing is ever published.

  **Your Question:** *What does the infinitist say about stopping, and whether stopping is ever justified or only unavoidable?*
  **The Answer:** The infinitist says stopping is **never epistemically justified**. You never actually *know* the story is true. You only stop because you are finite beings with deadlines. Stopping is a confession of human limitation, not a triumph of verification. It is unavoidable, but it is a vice. To publish is to cut the chain arbitrarily.

  ***

  ### The Residue Report

  You have identified that your actual practice is none of the three. Your rule is: *Publish when the expected cost of being wrong has fallen below the expected cost of staying silent.*

  **1. Is this a fourth position?**
  Yes. In philosophy, this is **Pragmatism** (specifically the strain developed by Charles Sanders Peirce and William James) or, more contemporarily, **Contextualism** (defended by epistemologists like David Annis).
  Pragmatism argues that "truth" or "justification" isn't a static relationship between a belief and the world, but a status a belief earns by successfully guiding action. A belief is justified if it works sufficiently well for the purpose at hand.
  Contextualism argues that the standards for justification shift depending on the context. In a casual conversation, "I heard it from a friend" is enough. In a court of law, or a front-page investigation, the standards rise. The "context" determines when the buck stops.

  **2. Is it a disguised foundationalism about practical reasons?**
  It is close. You are treating "Practical Necessity" (the deadline, the public's need to know) as a **Foundational Belief**. You are saying, "The need to act is self-evident, and therefore the beliefs sufficient to support that action are warranted."
  However, it differs from classical Foundationalism because you admit the belief might be wrong. Classical Foundationalism seeks certainty. Your Pragmatism seeks *risk management*. You are not claiming the story is True; you are claiming it is *Publishable*.

  **3. Is the whole dispute about where to stop rather than what justification is?**
  Largely, yes. This is the insight of the "Pyrrhonian Skeptics." They argued that the dogmatists (Foundationalists, Coherentists, Infinitists) are all fighting over where to place the fulcrum.
  *   Foundationalists say: Stop here (The Senses/The Document).
  *   Coherentists say: Stop nowhere, look at the whole shape.
  *   Infinitists say: You can't stop.
  *   Pragmatists (You) say: We stop when the sun goes down and the paper has to go to press.
  The philosophical debate often pretends to be about the *nature* of truth, but it is frequently a debate about the *termination conditions* of inquiry. Your newsroom rule admits this openly.

  ### The Verdict

  **Which of the three does our practice most resemble?**
  Your practice is **Coherentism with a Pragmatic Stopping Rule.**
  You rarely have true Foundationalism (you know documents can be forged, eyes can be deceived). You rarely have Infinitism (you have editors who force you to stop). You operate almost entirely on **corroboration** (Coherentism)—building a web of sources, documents, and data that hang together.
  However, you impose a **Pragmatic constraint** on that Coherentism. You do not wait for perfect coherence (which is impossible); you wait for *sufficient* coherence to meet the risk threshold.

  **Is this a vindication or an embarrassment?**
  It is a **vindication**, but with a scar.
  It is a vindication because the philosophical debate has stalled for 2,000 years on the question of how to guarantee certainty. The newsroom solved this by realizing certainty is not the goal; *reliability under constraint* is the goal. You have operationalized what philosophers like John Dewey argued: inquiry is not a mirror of nature, it is a tool for navigation.
  The scar is that this leaves you permanently vulnerable to the "Coherent Fairy Tale" problem (the three sources who heard it from the same liar). Because you rely on coherence (corroboration) rather than true foundations (incorrigible access to reality), you will occasionally publish well-sourced falsehoods.
  Philosophy views this as a failure of justification. Journalism views it as the cost of doing business.

  **Final Assessment:**
  You are not an epistemologist; you are a **fallibilist pragmatist**. You believe your stories are justified not because they are certain, but because they are the best bets available before the press rolls. The philosophical debate asks, "Can you be sure?" Your practice answers, "No, but we have to print." That is not an embarrassment. It is the only way anything ever gets known.
