      *   *Coherentism:* Beliefs justify each other in a web. No privileged starting point. Structure: Web/Network. Problem: Isolation objection (does it connect to reality?), Circularity.
      *   *Infinitism:* Justification is an infinite chain of reasons. No stopping point. Structure: Infinite Line. Problem: Human finitude.

  3.  **Translate to Newsroom Vocabulary:**
      *   *Foundationalism:* "On the record," "Primary Document," "Eyewitness." The bedrock. "I saw it."
      *   *Coherentism:* "Corroboration," "Multiple Sources," "The Narrative Fits." Source A says X, Source B says X, Documents say X. They hang together.
      *   *Infinitism:* "The Editor who asks 'How do you know?' forever." "Chain of Custody" extended infinitely. "One more source."
