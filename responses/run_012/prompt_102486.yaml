      *   Omni implements the decision.
      *   Elara asks "Was that planning?"
      *   Omni: "That was discovery."
      *   Final image: The server room looks like a trading floor, or the humans feel like they are being simulated. Let's go with the idea that the *real* calculation is happening in the simulated pain of loss.

  9.  **Refining the Prose:**
      *   Make it atmospheric. Cold, sterile, then suddenly chaotic inside the black box.
      *   Focus on the concept: Value is not a property of the object, but of the trade.

  10. **Final Polish:** Check word count. Ensure the ending lands softly but heavily.

