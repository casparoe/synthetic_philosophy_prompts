answer: |-
  **Project Title:** Authorization, Accountability, and Ambition: Reconceptualizing Democratic Selection Mechanisms

  **Statement of the Question**
  This project asks a specific conceptual question: *In democratic theory, are prospective authorization and retrospective accountability functional substitutes or complements?* Conventional debate treats selection by lot (sortition) and selection by election as competing solutions to the problem of representation. Defenders of sortition prioritize fairness and descriptive representation (prospective authorization), while defenders of elections prioritize the capacity to remove underperforming officials (retrospective accountability). These positions are typically treated as incommensurate values. However, the existence of term-limited legislators demonstrates that these mechanisms can be decoupled: a term-limited official possesses electoral authorization but lacks the prospect of retrospective punishment.

  This project hypothesizes that authorization and accountability function as *substitutes* contingent upon the variable of political ambition. Where ambition is removed (via sortition or strict term limits), the normative requirement for retrospective accountability diminishes, rendering prospective authorization sufficient for legitimacy. Conversely, where ambition persists, accountability is required as a check. The alternative hypothesis is that accountability serves an epistemic function—an information channel from governed to governor—independent of punishment, meaning that removing it (via sortition or term limits) degrades decision-making quality regardless of authorization. This research will determine which model holds: is the lack of accountability in sortition a fatal flaw, or is it a feature that only matters when ambition is present?

  **Intervention and Significance**
  Current theoretical defenses of sortition, elections, and term limits fail to settle this question because they analyze selection mechanisms in isolation. Sortition theorists argue from equality of opportunity but often concede the "accountability deficit" without rigorously examining whether that deficit matters in the absence of re-election incentives. Election theorists argue from accountability but often conflate the *threat* of removal with the *authorization* to rule. Term limit advocates argue from the benefits of turnover but rarely address the conceptual anomaly they create: a representative who is authorized but unaccountable.

  By treating authorization and accountability as a single functional unit, existing literature misses the mediating role of ambition. If these mechanisms are substitutes, the primary criticism of sortition (lack of accountability) is misdirected, and term limits are a more radical restructuring of democratic legitimacy than currently acknowledged. If they are complements (specifically via the information channel), then both sortition and term limits suffer from a shared structural blindness that cannot be cured by procedural fairness alone. Resolving this is a prerequisite for any coherent institutional design regarding citizen assemblies or legislative reform.

  **Methodology and Work Plan**
  This is a project of normative conceptual analysis. Empirical data regarding the performance of citizen assemblies or term-limited legislatures cannot answer the question because such data presupposes a definition of what legitimacy requires. We must first establish the theoretical relationship between the concepts before measuring their instantiation. The three-month timeline will be divided into three phases:

  *   **Month 1: Conceptual Mapping and Decomposition.**
      *   *Weeks 1-2:* Rigorously define "prospective authorization" and "retrospective accountability" distinct from their institutional instantiations. Isolate "ambition" as a variable: distinguish between the ambition for re-election, the ambition for higher office, and the ambition for legacy.
      *   *Weeks 3-4:* Construct the "Substitution Model." Map the logical conditions under which authorization renders accountability redundant. This involves analyzing the "term-limit case" as a natural experiment in conceptual decoupling.

  *   **Month 2: Stress-Testing the Hypotheses.**
      *   *Weeks 5-6:* Test the Substitution Model against the "Information Channel" counter-hypothesis. If accountability is primarily about information flow rather than punishment, does the removal of re-election incentives break the feedback loop even if authorization is high?
      *   *Weeks 7-8:* Apply the models to the sortition case. If the Substitution Model holds, does a randomly selected body require *any* mechanism of removal? If the Information Model holds, what non-electronic feedback mechanisms are required for sortition to be viable?

  *   **Month 3: Synthesis and Typology.**
      *   *Weeks 9-10:* Draft the central argument. Determine the boundary conditions: at what level of ambition does accountability become necessary?
      *   *Weeks 11-12:* Refine the typology of selection mechanisms. Produce a final manuscript (approx. 8,000 words) suitable for submission to a peer-reviewed journal or as a dissertation chapter.

  **Justification for Conceptual Work**
  A survey of existing citizen assemblies or a comparative study of term-limited legislatures is premature. Existing empirical studies measure "performance" or "satisfaction," but these metrics rely on implicit normative assumptions about what representatives *ought* to do. Without a clear theoretical account of whether accountability is a deterrent or an information channel, empirical results are interpretable in multiple, contradictory ways. Three months of dedicated conceptual work is required to untangle the definitions that currently conflate authorization, ambition, and accountability. This theoretical clarity is a necessary condition for any subsequent empirical research.

  **Outcomes and Criteria for Success**
  *   **Success:** The project produces a definitive typology of democratic selection that categorizes mechanisms (election, sortition, term-limited election) based on the relationship between authorization and accountability. A successful result will definitively argue for either the Substitution Model or the Information Model, identifying the specific role ambition plays in that relationship. The output will be a complete paper ready for journal submission.
  *   **Failure:** The project fails if the concepts prove too entangled to separate, or if "ambition" cannot be operationalized as a distinct variable independent of the selection mechanism. Inconclusive results—where the relationship remains context-dependent without a governing principle—would constitute a failure of the specific hypothesis, though still a valuable negative result for the dissertation.

  **Scope and Limitations**
  This project is limited to the normative relationship between selection mechanisms and legitimacy. It will not produce a full institutional design for a citizen assembly, nor will it offer a comprehensive history of sortition. It explicitly excludes the empirical measurement of legislative output. Furthermore, this project serves as a foundational chapter for the dissertation, not the dissertation itself. It resolves the theoretical framework regarding representation; subsequent work will apply this framework to specific policy domains and historical case studies. This grant supports the architectural work required to ensure the broader dissertation rests on a coherent theoretical foundation.
