answer: |-
  **Credence: 0.30**

  Conditional on Transformative AI (TAI) being developed within the next century, my credence that the global order 100 years later is a **Power-Singleton** (a single agency or coalition with ultimate top-level control of key levers) is **30%**.

  ### Decomposition of the Power-Singleton Probability

  To arrive at 0.30, I decompose the necessary conditions for a Power-Singleton. These terms are multiplicative for the primary pathway, with an additive term for emergent scenarios.

  | Term | Probability | One-Line Justification |
  | :--- | :--- | :--- |
  | **1. Decisive Advantage ($P_{adv}$)** | 0.55 | Compute overhangs and algorithmic secrets can create a temporary lead, but hardware diffusion and espionage make a permanent, unassailable lead difficult to sustain. |
  | **2. Monopolization Will ($P_{mono}$)** | 0.75 | Given a decisive lead, the incentive to lock in power (rent-seeking, safety control, ideology) outweighs the incentive to distribute it, barring external coercion. |
  | **3. Structural Stability ($P_{stab}$)** | 0.70 | AI-enhanced surveillance and enforcement raise the cost of rebellion, but 100 years is sufficient time for value drift, internal factionalism, or external black-swan events to fracture control. |
  | **4. Emergent Centralization ($P_{emerg}$)** | 0.03 | A small probability mass for a singleton arising via slow regulatory capture or economic consolidation without a single "winner-take-all" technological explosion. |
  | **Calculation** | **$(0.55 \times 0.75 \times 0.70) + 0.03$** | **$= 0.289 + 0.03 \approx 0.30$** |

  ### Outcome Space Allocation (Non-Overlapping)

  To satisfy the requirement to carve up the outcome space without double-counting, here is how the remaining probability mass is distributed relative to the Power-Singleton figure above.

  *   **Power-Singleton:** **0.30** (Calculated above).
  *   **Procedure-Singleton (Only):** **0.25**.
      *   *Definition:* No central controller exists, but independent agents converge on identical constitutions, alignment targets, or Schelling points due to TAI-driven game-theoretic pressures.
      *   *Classification:* I file this as a **third category**, distinct from the classical Singleton. It achieves global coordination without top-down coercion, meaning it lacks the "single decision-making agency" required for the Power definition but avoids the "multipolar mess" instability.
  *   **Multipolar/Fragmented:** **0.45**.
      *   *Definition:* Competing agencies with divergent values and no binding global coordination mechanism; the default historical baseline.
      *   *Justification:* Even with TAI, heterogeneous human values and the difficulty of perfect monitoring suggest nearly half the probability mass remains in a competitive, pluralistic order.

  ### Sensitivity Analysis

  The final number (0.30) is most sensitive to **Term 1: Decisive Advantage ($P_{adv}$)**.

  *   **Reasoning:** If $P_{adv}$ shifts from 0.55 to 0.80 (a strong "FOOM" or hardware lock-in scenario), the Power-Singleton credence jumps to ~0.45. If $P_{adv}$ shifts to 0.30 (rapid open-weight diffusion), the credence collapses to ~0.19.
  *   **Why:** You cannot build a Power-Singleton without the physical capacity to dominate. The will to monopolize ($P_{mono}$) and the ability to hold it ($P_{stab}$) are irrelevant if the initial strategic advantage is impossible to secure.

  ### Diagnosis of Friend A vs. Friend B

  Once the Power/Procedure distinction is on the table, A and B are no longer arguing about the same variable.

  *   **Friend A (0.8 Credence):** They are conflating **Procedure-Singleton** stability with **Power-Singleton** feasibility. They assume that because TAI makes coordination *easier* (raising the Procedure probability), it necessarily creates a central *controller* (Power). They also likely overestimate $P_{adv}$ (assuming technical lock-in is trivial) and $P_{stab}$ (assuming AI surveillance makes internal defection impossible).
  *   **Friend B (0.15 Credence):** They are correctly skeptical of $P_{stab}$ regarding Power-Singletons (complex systems fracture), but they are likely underestimating **Procedure-Singleton** probability. Their "multipolar mess" argument assumes that without a central controller, coordination must fail, ignoring the possibility of convergent norms acting as a functional singleton without a ruler.
  *   **The Real Disagreement:** The core friction is on **$P_{adv}$ (Decisive Advantage)**. A believes technology inherently centralizes; B believes technology inherently diffuses.

  ### The Key Evidence

  The single piece of evidence that would move my number the most is **empirical data on hardware supply-chain controllability**.

  *   **Specifics:** Demonstration that a central authority can reliably remote-disable or track >90% of high-end compute clusters globally without physical access, *and* that open-weight models cannot be efficiently run on decentralized, untrackable hardware.
  *   **Impact:** If hardware is perfectly controllable, $P_{adv}$ rises toward 0.8 and $P_{stab}$ rises toward 0.9, pushing my Power-Singleton credence above 0.60. If hardware is inherently untrackable (e.g., efficient inference on consumer devices), $P_{adv}$ drops below 0.2, pushing my credence below 0.15.
