prompt: |-
  I run ops at a forty-person company and we keep having the same fight: someone said something in a sales call, or a Slack thread, or on their way out the door, that never made it into the contract, and now half the team says we promised and half says we didn't. I want a decision procedure my team leads can actually run, in order, for whether an informal commitment morally binds us — assume the lawyers have already told us we can legally walk away, that part's settled. Ground it in what the philosophy of promising actually establishes rather than vibes: the difference between a promise and a prediction or a threat, why breaking one wrongs the person instead of merely disappointing them, the Scanlon-style idea that what a promise hands the other side is assurance, the Shiffrin-style idea that it hands them a kind of authority over your future conduct, the older conventionalist line that it's all a social practice with rules we're playing by. I want it to also force the team to say whether the promisee has a right to demand performance or only to be compensated, and whether we can release ourselves unilaterally or need them to. Questions in order, what counts as a sufficient answer to each, where it stops with a 'not bound' and why that isn't just us being cheap, and where it hands off to a person because the question is values not facts. Then run it on three cases: a rep who told a customer we'd always support the old version and then quit; a founder who said at an all-hands that there'd be no layoffs this year and now needs to cut; and one where I want the procedure to tell me we're bound to something expensive I'd rather not do. Keep it to something a busy lead can run in twenty minutes, and be honest about which steps are just rationalization with a flowchart drawn on top.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Ops lead at a 40-person company.
      *   **Problem:** Recurring conflict over informal commitments (sales calls, Slack, hallway chats) vs. contracts. Half the team says "we promised," half says "we didn't."
      *   **Goal:** A decision procedure for team leads to determine if an informal commitment *morally* binds the company (legal liability is already ruled out).
      *   **Philosophical Grounding:** Must be based on actual philosophy of promising (Scanlon, Shiffrin, Conventionalism), not just "vibes."
      *   **Specific Concepts to Include:** Promise vs. prediction/threat, wronging vs. disappointing, assurance (Scanlon), authority over future conduct (Shiffrin), social practice/convention.
      *   **Specific Outputs:** Must determine if the promisee has a *right to demand performance* vs. *compensation*, and if release must be *mutual* or can be *unilateral*.
      *   **Structure:** Ordered questions, sufficient answers, stop conditions ("not bound" + justification), hand-off points (values vs. facts).
      *   **Test Cases:** 1. Rep promises legacy support then quits. 2. Founder promises no layoffs then needs to cut. 3. A case where the procedure says "we are bound" to something expensive (user wants to see this).
      *   **Constraints:** Busy lead can run in 20 minutes. Honest about where steps might be rationalization.

  2.  **Deconstruct the Philosophy:**
      *   *Conventionalism (Rawls/Searle):* Promising is a social game. Did we invoke the rules? Was there mutual understanding of the "promise" label or equivalent weight?
      *   *Scanlon (Principle F):* It's about assurance. Did I intentionally lead you to expect X, knowing you wanted assurance, and you relied on it? Breaking it violates the principle of fidelity.
      *   *Shiffrin:* Promises transfer authority. The promisee gets a say in my future actions. This is stronger than mere reliance.
      *   *Wronging vs. Disappointing:* Breaking a promise *wrong*s the person (violates their right/authority). Merely failing to meet a prediction *disappoints* them (bad luck, but no right violated).

  3.  **Drafting the Procedure (The "Moral Binding Protocol"):**
      *   *Need:* A flowchart-like structure but in text.
      *   *Step 1: Invocation (Conventionalism).* Did this look like a promise? Or just sales talk/prediction?
      *   *Step 2: Assurance & Reliance (Scanlon).* Did they rely on this to their potential detriment? Did we know they needed assurance?
      *   *Step 3: Authority Transfer (Shiffrin).* Did we give them veto power or a right to demand?
      *   *Step 4: Release & Remedy.* If bound, can we walk away? Do we owe performance or just damages?

      *Refining for Speed:* 20 minutes means 5-6 max questions.
      *Refining for Honesty:* Acknowledge where "company values" enter the chat.

  4.  **Developing the Test Cases:**
      *   *Case 1 (Rep/Legacy Support):* Likely *not bound* morally if it was outside authority and not relied upon heavily, OR *bound* if the customer integrated based on it. Let's aim for "Bound to compensate, not necessarily perform" or "Not bound." Actually, to make it interesting, let's make it a "Not Bound" case to show the filter works.
      *   *Case 2 (Founder/Layoffs):* This is the classic "prediction vs. promise" trap. Usually, these are treated as aspirations. But if people turned down other jobs based on it? Let's make it "Not Bound to performance, but bound to transparency/severance."
      *   *Case 3 (The Expensive One):* Needs to be a clear "Yes." A specific custom feature promised to close a deal where the client *rejected* other vendors based on this.

  5.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Set the tone. This isn't legal; it's moral operationalization.
      *   **The Protocol (MBP-20):** Five questions.
      *   **Philosophical Annotations:** Explain *why* each question exists (Scanlon, Shiffrin, etc.).
      *   **Outcomes:** Define the three endings (Not Bound, Bound to Compensate, Bound to Perform).
      *   **The "Rationalization" Warning:** Be honest about where bias creeps in.
      *   **The Cases:** Run the protocol.

  6.  **Refining the Philosophy (Self-Correction during drafting):**
      *   *Critique:* Make sure I distinguish Scanlon and Shiffrin clearly. Scanlon is about *expectations induced*. Shiffrin is about *autonomy transfer*.
      *   *Critique:* Ensure the "Release" question is distinct. Can we buy our way out?
      *   *Critique:* The user wants to know when it hands off to a person for values. That should be the final step (Cost vs. Integrity).

  7.  **Final Polish:**
      *   Check word count and tone. Needs to be crisp, operational, but intellectually rigorous.
      *   Ensure the "Expensive Case" actually results in a "Do it" verdict, as requested.
      *   Make sure the "Not Bound" justification doesn't sound like "we're being cheap." It must sound like "no moral obligation was created."

  8.  **Final Review against constraints:**
      *   40-person company context? Yes.
      *   Philosophical grounding? Yes (Scanlon, Shiffrin, Conventionalism).
      *   Right to demand vs. compensate? Yes.
      *   Unilateral vs. Mutual release? Yes.
      *   3 Cases? Yes.
      *   20-minute limit? Yes, by keeping questions binary.
      *   Honesty about rationalization? Yes, included a specific section.

  *(Self-Correction on Case 1)*: If the rep quit, does that matter? Morally, the company is the agent. The rep's authority matters. If the rep had no authority, was it a promise? Conventionalism says no. Let's go with "Not Bound" because the rep lacked conventional authority to bind the firm on *permanent* support.

  *(Self-Correction on Case 2)*: Founder statements are tricky. Usually treated as "aspirational." Unless specific reliance (e.g., relocation). Let's make it "Not Bound to performance, but bound to process."

  *(Self-Correction on Case 3)*: Needs to be undeniable. A verbal side-letter that induced signature.

  Let's write it.cw
answer: |-
  # The Moral Binding Protocol (MBP-20)

  **Purpose:** To determine if an informal commitment creates a moral obligation to perform, compensate, or negotiate release.
  **Time:** 20 Minutes max.
  **Users:** Team Leads / Ops.
  **Philosophical Basis:** Conventionalism (Rules of the practice), Scanlon (Assurance/Reliance), Shiffrin (Authority Transfer).

  ---

  ## The Procedure

  ### Q1: The Invocation Test (Conventionalism)
  **Question:** Did the speaker use language or context that a reasonable person in *our* industry recognizes as invoking the "promise" practice, rather than sales puffery, prediction, or aspiration?
  *   **Yes:** Specific verbs ("guarantee," "commit," "promise"), written confirmation, or context where silence implies assent to a term.
  *   **No:** Vague assurances ("we aim to," "typically," "should be fine"), hypothetical discussion, or clear disclaimer ("subject to contract").
  *   **Stop Condition:** If **No**, you are **Not Bound**.
      *   *Why:* Conventionalism holds that promising is a social game. If you didn't make the move that counts as "promising" within the rules of your industry, no obligation was created. You are disappointing them, not wronging them.
  *   **Philosophical Note:** This filters out *predictions* (claims about the world) from *promises* (claims about your will).

  ### Q2: The Assurance Test (Scanlon)
  **Question:** Did we know (or should we have known) that the other party needed *assurance* of this specific point to proceed, and did they rely on it to their potential detriment?
  *   **Yes:** They passed on a competitor, integrated a system, or incurred costs *because* we said this.
  *   **No:** They would have signed anyway; the comment was incidental; reliance is speculative.
  *   **Stop Condition:** If **No**, you are **Not Bound** (though you may owe a courtesy explanation).
      *   *Why:* Scanlon's Principle F argues the wrong lies in manipulating expectations. If they didn't lean on your word to change their position, breaking your word causes no distinct moral injury beyond general disappointment.
  *   **Philosophical Note:** This distinguishes *wronging* (violating a reliance right) from merely *disappointing* (failing to optimize their outcome).

  ### Q3: The Authority Test (Shiffrin)
  **Question:** Did the commitment grant the other party a right to *demand* performance, or merely a hope that we would try?
  *   **Demand Right:** "If you don't do X, you are in breach of our agreement."
  *   **Hope:** "We really hope to do X, but things change."
  *   **Hand-off Point:** If **Demand Right**, proceed to Q4. If **Hope**, you are **Bound to Compensate** (see Outcomes).
      *   *Why:* Seana Shiffrin argues promising transfers authority over your future autonomy to the promisee. If you didn't hand them the keys to your will, they don't own the action, they only own the reliance loss.
  *   **Philosophical Note:** This determines if they have a *right to performance* or only a *right to damages*.

  ### Q4: The Release Test (Mutuality)
  **Question:** Can we unilaterally release ourselves by offering compensation, or do we need their permission to walk away?
  *   **Permission Needed:** The promise was about *this specific action* (e.g., "We will build this feature"), not just the *outcome* (e.g., "You will be safe").
  *   **Compensation Enough:** The promise was fungible (e.g., "We will support you" can be solved by paying a vendor to do it).
  *   **Hand-off Point:** If **Permission Needed**, you are **Bound to Perform** unless they release you. If **Compensation Enough**, you are **Bound to Compensate**.
      *   *Why:* Some promises are "personal" in nature (authority over specific conduct). Others are economic (assurance of a state of affairs). You cannot buy your way out of a fidelity obligation without the promisee's consent if the obligation was about the relationship itself.

  ### Q5: The Integrity Cost (Values Hand-off)
  **Question:** Does fulfilling this obligation threaten the company's survival or core ethical mission?
  *   **Yes:** Hand off to Founder/CEO. This is no longer a fact question; it is a values trade-off.
  *   **No:** Execute the determination from Q3/Q4.
      *   *Why:* Moral obligations are not absolute suicide pacts. But this step must be rare, or the protocol is a sham.
      *   **Warning:** This is where rationalization lives. See "The Honesty Clause" below.

  ---

  ## Outcomes

  1.  **Not Bound:** No moral debt. You may still choose to help for goodwill, but they cannot claim you wronged them.
  2.  **Bound to Compensate:** You may walk away from the action, but you must make them whole for reliance costs (time, integration, missed opportunities). You need not ask permission, but you must pay.
  3.  **Bound to Perform:** You must do the thing. You cannot unilaterally buy your way out. You must negotiate a release with the promisee.

  ---

  ## The Honesty Clause (Where Leads Lie to Themselves)

  Be aware of these two failure modes when running MBP-20:

  1.  **The "Prediction" Shield:** Leads often classify clear commitments as "predictions" (Q1) to avoid cost. *Check:* Would we be angry if *they* said this to *us* and then didn't do it? If yes, it was a promise.
  2.  **The "Survival" Escape:** Q5 is dangerous. If you invoke "company survival" every time a promise gets expensive, the protocol is dead. *Rule:* Q5 requires CEO sign-off and a written explanation of why the cost threatens existence, not just margins.

  ---

  ## Test Cases

  ### Case 1: The Rep and the Legacy Version
  **Scenario:** A sales rep, eager to close, tells a client, "We will always support the old version API." Client signs. Rep quits 2 months later. Product wants to deprecate old API to save engineering time.
  **Run:**
  1.  **Invocation:** Rep used "We will always." In SaaS, "always support" is a strong convention. **(Yes)**
  2.  **Assurance:** Client integrated deeply based on this. They didn't build a migration path. **(Yes)**
  3.  **Authority:** Did the client get to demand support, or just expect it? "Always support" implies a standing right. **(Demand Right)**
  4.  **Release:** Can we pay them to migrate? Yes. Support is fungible. We can pay for a middleware layer or fund their migration. **(Compensation Enough)**
  5.  **Integrity:** Deprecating old tech is standard; doesn't threaten survival. **(No)**
  **Verdict:** **Bound to Compensate.**
  **Action:** We can deprecate the API, but we must fund the client's migration costs entirely. We cannot just cut them off. The rep's departure is irrelevant; the company holds the obligation.

  ### Case 2: The Founder and the Layoffs
  **Scenario:** Founder says at All-Hands: "There will be no layoffs this year." Economy tanks. Cash runway is 3 months. Need to cut 10% of staff.
  **Run:**
  1.  **Invocation:** "No layoffs this year." Sounds like a promise. But in corporate context, is it a guarantee or an aspiration? Usually aspiration unless written in an employment contract. **(No / Ambiguous)**
      *   *Pivot:* Even if we grant **Yes** for the sake of argument...
  2.  **Assurance:** Did employees turn down other jobs *specifically* because of this sentence? Hard to prove for the whole team. Some may have, most stay for salary/mission. **(Mostly No)**
  3.  **Authority:** Did employees gain the right to *veto* layoffs? No. Employment is at-will (legally) and structural (morally). **(Hope)**
  **Verdict:** **Not Bound to Perform.** (Leans toward Bound to Compensate via severance, but not bound to retain).
  **Action:** The statement was likely a prediction of intent (Scanlon) rather than a transfer of authority over company structure (Shiffrin). Breaking it disappoints and damages trust, but does not wrong the employees *regarding the layoff itself*. Moral obligation shifts to transparency and generous severance (Compensation), not retention.

  ### Case 3: The Expensive Custom Integration (The "Ouch" Case)
  **Scenario:** During negotiations, our CTO told a strategic partner, "We'll build the custom connector you need," verbally, to get the signature. Contract says "Standard API only." Partner rejected three other vendors because our CTO said they wouldn't have to build it themselves. Building it costs $150k (10% of eng budget).
  **Run:**
  1.  **Invocation:** CTO said "We'll build." That is performative language. **(Yes)**
  2.  **Assurance:** Partner rejected three vendors based on this. High reliance. **(Yes)**
  3.  **Authority:** Did they get to demand it? Yes, they signed *because* they believed they had a right to the connector. **(Demand Right)**
  4.  **Release:** Can we pay them to build it? No, they specifically wanted *our* native connector for security/maintenance reasons. This is a personal fidelity obligation. **(Permission Needed)**
  5.  **Integrity:** $150k hurts, but doesn't kill the company. **(No)**
  **Verdict:** **Bound to Perform.**
  **Action:** We build the connector.
  **Why this hurts:** You wanted to avoid this. But under Shiffrin, the CTO transferred authority over a slice of engineering roadmap to the partner. Under Scanlon, they relied to their detriment (rejecting other vendors). To walk away now is to treat their reliance as a tool we used and discarded. That is using them, not dealing with them.
  **Rationalization Check:** Do not argue "The contract says Standard API." The protocol assumes legal walk-away is possible but morally void. Do not argue "The CTO shouldn't have said that." They did, and they acted as an agent. The cost of the mistake is the price of moral coherence.

  ---

  ## Implementation Note for Ops
  Print this. Put it in the deal-desk folder. When a fight breaks out, do not argue the *outcome* first. Argue the *answers to the questions*. If you can agree on the answers, the philosophy dictates the result. If you disagree on the answers, you have found the actual factual dispute (e.g., "Did they rely?") rather than the moral one.
