      *   **Systemic Account (Causal-Role, e.g., Cummins):** Function is defined by *current causal contribution* to a capacity of the containing system. $X$ has function $F$ in system $S$ iff $X$ does $F$ and $F$ contributes to capacity $C$ of $S$.
