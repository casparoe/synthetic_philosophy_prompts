  # JOINT STATEMENT ON MORAL RESPONSIBILITY AND THE BASIC ARGUMENT

  **Signatories:** [Incompatibilist Friend] & [Compatibilist Friend]
  **Date:** [Current Date]
  **Subject:** Mapping the Disagreement (The "Rhea Protocol")

  We, the undersigned, agree to cease oral debate and adopt this document as the standing reference for our disagreement. We acknowledge that two years of argument have failed to produce conversion. This document does not declare a winner. It isolates the exact points of friction so we stop arguing past each other.

  ### 1. AGREED CLAIMS
  *We both affirm the following. Denying these constitutes a change of position, not a refinement.*

  1.  **Impossibility of Self-Creation:** Neither of us claims a human being can be *causa sui* (cause of themselves). We agree it is impossible to exist prior to oneself in order to design one's own initial character.
  2.  **Validity of the Regress (Conditional):** We agree that Galen Strawson's regress is logically valid *if* "Ultimate Responsibility" (UR) is defined as requiring self-creation. If UR requires you to be responsible for the mental states that produce your actions, and those states require prior responsibility, the regress holds.
  3.  **Causal Continuity:** We agree that "Rebuilt Rhea" (engineered character) and "Ordinary Oscar" (normal upbringing) are both products of causal chains neither initiated. We agree that psychology, genetics, and environment determine the character both endorse.
  4.  **Psychological Reality of Endorsement:** We agree that "endorsement" (identifying with one's motives) is a real psychological phenomenon. We disagree on whether it has *normative* power to ground responsibility.
  5.  **Non-Vacuity:** We agree that if "responsibility" is defined so loosely that it applies to thermostats or tornadoes, the term is useless for moral practice. We are arguing about a robust sense of responsibility that justifies praise, blame, or desert.

  ### 2. DISAGREEMENTS TABLE
  *We disagree on the following. Each statement is worded so the holder recognizes their view without caricature.*

  | Issue | Incompatibilist Position | Compatibilist Position |
  | :--- | :--- | :--- |
  | **Necessity of UR** | Moral responsibility *requires* Ultimate Responsibility. Without UR, blame is merely instrumental (social control), not deserved. | Moral responsibility *does not require* UR. It requires agency, reasons-responsiveness, and ownership. UR is a coherent but unnecessary metaphysical extra. |
  | **The Regress** | The regress is **vicious**. It shows the concept of moral responsibility is empty because the condition (self-creation) cannot be met. | The regress is **benign**. It stops where the agent possesses the right structural capacities (reasons-responsiveness), regardless of prior causes. |
  | **History Matters** | Causal history is irrelevant to the *impossibility* of UR. Whether determined by physics or engineers, the outcome is the same: no self-creation. | Causal history is relevant to *agency*. Manipulation (Rhea) can undermine responsibility if it bypasses agency, but normal determination does not. |
  | **Endorsement** | Endorsement is just another caused mental state. Endorsing a desire doesn't make you responsible for it unless you are responsible for the endorsement itself. | Endorsement is the mechanism of ownership. When I endorse a motive, it becomes *mine*. I don't need to be responsible for the endorsement; I just need to *have* it authentically. |

  ### 3. THE CRUXES
  *You guessed the cruxes were (1) vicious vs. harmless regress and (2) ownership without self-creation. You are partially correct, but there is a deeper layer.*

  **Crux 1: The Normative Weight of Origins**
  *   **Your Guess:** Is the regress vicious or harmless?
  *   **Correction:** The deeper issue is whether **history matters**.
  *   **Why:** The Incompatibilist says history doesn't matter because *all* history precludes UR. The Compatibilist says history *does* matter because some histories (manipulation) undermine agency while others (normal upbringing) do not.
  *   **Settling Condition:** If the Compatibilist cannot identify a principled difference between Rhea's engineering and Oscar's upbringing that doesn't eventually collapse into luck, their position risks inconsistency. If the Incompatibilist cannot explain why "instrumental blame" is insufficient for morality, their position risks irrelevance.

  **Crux 2: The Function of Endorsement**
  *   **Your Guess:** Can a person "own" character without self-creation?
  *   **Correction:** The deeper issue is **Semantic/Conceptual**.
  *   **Why:** We are likely using different definitions of "Responsibility."
      *   **Incompatibilist:** Uses a **Desert-Entailing** concept. (To blame you, you must deserve it in a cosmic sense.)
      *   **Compatibilist:** Uses a **Function-Entailing** concept. (To blame you, you must be the appropriate target of social regulation because you are reasons-responsive.)
  *   **Settling Condition:** If we admit we are defining "Responsibility" differently, the metaphysical fight ends. The fight becomes: "Which definition is useful for society?"

  ### 4. TEST CASE: REBUILT RHEA
  *We both commit to the following predictions regarding this specific case. Sliding away from these predictions constitutes a concession.*

  **The Case:**
  Rhea's character was engineered via neural intervention at age 5. At age 30, she wholeheartedly endorses her character and motives. She is reasons-responsive (she can change her mind if given good reasons).
  **Control:** Oscar had a normal upbringing. At age 30, he wholeheartedly endorses his character and motives. He is reasons-responsive.

  **The Questions & Predictions:**

  | Question | Incompatibilist Prediction | Compatibilist Prediction |
  | :--- | :--- | :--- |
  | **1. Is Rhea Responsible?** | **No.** Her endorsement is the product of engineering. She did not create the self that endorses. | **Conditional Yes.** If the engineering preserved her capacity for reasons-responsiveness, she is responsible. If it bypassed her agency (brainwashing), she is not. |
  | **2. Is Oscar Responsible?** | **No.** His endorsement is the product of genetics/environment. He did not create the self that endorses. | **Yes.** His endorsement reflects his own agency, unimpeded by manipulation. |
  | **3. Does Endorsement Stop the Regress?** | **No.** Endorsement is just another link in the causal chain. It requires prior responsibility ad infinitum. | **Yes.** Endorsement is the *stopper*. It marks the point where the action is "owned." No prior ownership is needed. |
  | **4. The Principled Difference** | **None.** Rhea and Oscar are metaphysically identical regarding UR. Both are determined. | **History.** Rhea's history involves external manipulation; Oscar's involves normal development. This difference matters for agency. |

  **Agreed Silence:**
  We agree that if Rhea's engineering *removed* her reasons-responsiveness (she literally cannot process contrary reasons), both sides agree she is not responsible. The dispute is strictly about cases where responsiveness is *retained* despite engineering.

  ### 5. VERBAL DISPUTE ASSESSMENT
  *We acknowledge the following chunk of our disagreement is purely verbal.*

  **The Term:** "Ultimately Responsible"
  **The Conflict:**
  *   When the **Incompatibilist** says "We are not responsible," they mean: "We do not satisfy the conditions for **Cosmic Desert**."
  *   When the **Compatibilist** says "We are responsible," they mean: "We satisfy the conditions for **Social Accountability**."

  **Resolution:**
  We agree that we likely agree on the physics (determinism/causality) and the psychology (endorsement/process). We disagree on whether "Cosmic Desert" is a coherent requirement for moral practice.
  *   **Incompatibilist Task:** Prove why Social Accountability is insufficient for morality without Cosmic Desert.
  *   **Compatibilist Task:** Prove why the difference between Rhea and Oscar isn't just "luck" (since Oscar was lucky to have normal parents).

  ### SIGNATURES

  _________________________ (Incompatibilist)
  *I sign this acknowledging that if I cannot distinguish Oscar from Rhea without appealing to luck, my view requires revision.*

  _________________________ (Compatibilist)
  *I sign this acknowledging that if I cannot justify blame without Cosmic Desert, my view is merely pragmatic, not moral.*
