          *   Crux 2: The Function of Endorsement. (Is it a metaphysical stopper or a psychological feature?)

      *   **Section 4: Test Cases (Rebuilt Rhea):**
          *   Need specific predictions.
          *   Incompatibilist: Rhea = Not Responsible. Ordinary = Not Responsible. Endorsement changes nothing.
          *   Compatibilist: Rhea = Responsible (if engineering respected agency) OR Not Responsible (if engineering bypassed agency). Ordinary = Responsible.
