          *   Claim 3: The Difference. Both agree there is a distinction between "being caused to be X" and "being responsible for being X," but disagree on whether the former precludes the latter.
          *   Claim 4: Endorsement. Both agree endorsement (identifying with one's motives) is psychologically real but disagree on its metaphysical weight.
          *   *Refinement:* Make sure these aren't trivial. "We agree people act." -> Too weak. "We agree UR requires self-creation." -> Compatibilist might deny UR is the goal. Let's frame it as: "We agree that *if* Ultimate Responsibility (UR) requires being the ultimate originator of one's character, then humans lack it." Compatibilist agrees humans lack *that specific thing*, just denies it's necessary.

      *   **Section 2: Disagreements Table:**
          *   Need clear rows.
          *   Row 1: The Necessity of UR. Incompatibilist: UR is required for true moral responsibility. Compatibilist: UR is a philosophical fantasy; practical responsibility is sufficient.
