answer: |-
  You have a very sharp intuition. You are correctly spotting that money is changing hands in a cycle that results in no net change to the actual outcome (pizza vs. tacos, drinking vs. sober), but you are also right to feel that the two cases are mechanically different.

  Here is the breakdown: You are looking at **two different phenomena** that happen to look similar on the surface. One is a case of **rational exploitation** (your roommate), and the other is a case of **irrational inconsistency** (your friend).

  Here is the exact terminology, the hidden assumption you're sensing, and how to fix each one.

  ### Case 1: The Roommate (Arbitrage on Indifference)
  **Is this a Money Pump?** Technically, no. Not for him.
  **What is it?** This is **Arbitrage**.

  In a classic Money Pump, the victim has *circular* preferences (A > B > C > A). Your roommate does not have circular preferences. He has **indifferent** preferences (Pizza = Tacos) and a standard preference for money (Money > No Money).

  *   **His Logic:** "I don't care about the food. But I do care about \$5. So Pizza + \$5 is better than Tacos. And Tacos + \$5 is better than Pizza."
  *   **The Result:** He is being perfectly rational. He is selling you a service: **the right to decide.**

  **The Hidden Assumption:** You are assuming the "pump" is happening *to* him. It isn't. **You are pumping yourself.**
  You are paying \$30 over a few weeks for the privilege of flipping the menu back and forth. Since you admit the mix of food ended up the same as if you hadn't said anything, *you* derived zero value from those decisions. You paid \$30 for nothing.

  *   **Is he irrational?** No. He is capturing surplus value from your indecisiveness.
  *   **Is the setup unfair?** No. It's a free market. He offered indifference; you bought control.
  *   **The Fix:** The smallest change to make the problem go away is for **you to stop making offers.** If you stop offering \$5, the cycle stops. Alternatively, if he refuses to trade for less than the "hassle cost" of switching (e.g., "I won't switch for less than \$20 because I hate getting up"), the arbitrage disappears.

  ### Case 2: The Friend (Dynamic Inconsistency)
  **Is this a Money Pump?** Yes. This is a genuine, classic **Money Pump**, but driven by time.
  **What is it?** This is **Dynamic Inconsistency** (specifically **Hyperbolic Discounting**).

  This is the one that matches the philosophical literature you've read. Her preferences are not circular in a single moment; they are inconsistent *over time*.
  *   **Morning Her:** Sober. Prefers "No Card" > "Card". Willing to pay \$20 for No Card.
  *   **Night Her:** Tempted. Prefers "Card" > "No Card". Willing to pay \$20 for Card.
  *   **Next Morning Her:** Sober again. Prefers "No Card" > "Card". Willing to pay \$20 for No Card.

  **The Hidden Assumption:** The assumption here is that a person is a **single, consistent agent**. Philosophy and economics usually treat "You" as one entity with one set of preferences. Your friend is proving that "You" are actually multiple agents (Sober You, Drunk You) fighting a civil war, and Drunk You is selling out Sober You for cash (or drinks).

  *   **Is she irrational?** By standard definitions, **yes.** A rational agent is supposed to anticipate their future weakness and not pay to undo their own past decisions. She is paying to reverse her own utility.
  *   **Is the setup unfair?** No. The sister is just a neutral bank. Your friend is pumping herself.
  *   **The Fix:** "Commit harder" is not changing the subject; it is the actual technical fix. The problem is **revocability**. She paid for a commitment that she was allowed to buy back. To fix this, the commitment must be **irrevocable**.
      *   *Smallest Change:* She gives the card to the sister with a contract that says, "Under no circumstances, even if I beg or pay, can I have this back until Date X." If the option to reverse is removed, the money pump cannot start.

  ### Summary of Differences

  | Feature | Case 1 (Roommate) | Case 2 (Friend) |
  | :--- | :--- | :--- |
  | **Preference Type** | **Indifference** (Pizza = Tacos) | **Time-Inconsistent** (Sober $\neq$ Drunk) |
  | **Who Loses Money?** | **You** (The Offerer) | **Her** (The Agent) |
  | **Rationality** | Roommate is Rational; You are not. | Friend is Irrational (locally rational, globally stupid). |
  | **Philosophical Name** | **Arbitrage** | **Dynamic Inconsistency / Akrasia** |
  | **The "Pump"** | You are pumping yourself. | She is pumping herself. |
  | **The Fix** | You stop offering bribes. | She makes commitment binding. |

  ### Answering Your Specific Questions

  **1. Does the circle version have a requirement I'm missing?**
  Yes. The classic Money Pump requires **Intransitivity** (A > B > C > A).
  *   Your roommate is **Transitive** (Pizza + \$5 > Pizza ~ Tacos > Tacos - \$5). He isn't looping; he's just climbing a money ladder.
  *   Your friend is **Intransitive over Time** (Sober: No Card > Card / Drunk: Card > No Card).

  **2. Does it matter that in case one the money comes from me?**
  It matters entirely. In Case 1, the "pump" is external (you). In Case 2, the "pump" is internal (her future self). This is why Case 1 feels "fair" (he earned the cash) and Case 2 feels "tragic" (she burned her cash).

  **3. What if the fees were a penny?**
  *   **Roommate:** He should still take it. Free money is free money. If he refuses a penny, he is being "irrational" by leaving money on the table, unless he values *not being bothered* more than a penny.
  *   **Friend:** She would still be irrational. Paying a penny to undo a commitment you knew you'd need is still a net loss of utility.

  **4. Is the point that the person is being irrational, or that the setup is unfair?**
  *   **Case 1:** The setup is neutral; **you** are being irrational (paying for no value).
  *   **Case 2:** The setup is neutral; **she** is being irrational (valuing flexibility that hurts her).
  *   **The Unfairness:** The only "unfair" thing is that reality allows these loops to exist. Philosophy uses these examples to prove that if you *are* irrational (like your friend), the world *will* take your money. It's a warning, not a crime.

  **5. Is "commit harder" a real fix?**
  Yes. In game theory and behavioral economics, this is called **Precommitment**. The only way to stop a Dynamic Inconsistency pump is to remove the player's ability to make the bad choice later. Odysseus tying himself to the mast is the original example. He didn't pay the sailors to let him go; he made it impossible. Your friend needs to tie herself to the mast, not pay the sailors to hold the rope loosely.

  ### The One Sentence Takeaway
  Your roommate is **selling you a service** (decision rights) and winning; your friend is **buying her own weakness** and losing. They look the same because money is moving in a circle, but one is a business transaction and the other is a self-sabotage loop.
