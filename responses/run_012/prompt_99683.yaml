answer: |-
  ### The splitting questions

  1.  **Structure vs. Knowledge:** Is the trap a fact about the payoff structure itself, or a fact about what the players know and believe (i.e., would perfect common knowledge of everyone's rationality dissolve it or entrench it)?
  2.  **Selection vs. Static:** Is the relevant pressure selection acting *between* agents over time (the ones who defect survive and reproduce the setup), or is it just a one-shot strategic bind with no such dynamic?
  3.  **Equilibrium Type:** If structural and static, is the bad outcome a genuine stable equilibrium, or a coordination failure where a better equilibrium sits right next to it?
  4.  **Escape Mechanism:** Does escaping require changing the game (rules, payoffs, an external enforcer) or changing the players (their preferences, their sense of who "we" is)?

  ### The tree

  *   **1. Structure vs. Knowledge**
      *   **Knowledge (Epistemic):** The trap relies on uncertainty or lack of common knowledge.
          *   *Leaf:* **Epistemic Coordinationism** — Trap exists only because players lack common knowledge of intent; transparency dissolves it.
      *   **Structure (Payoffs):** The trap holds even with perfect knowledge.
          *   **2. Selection vs. Static**
              *   **Selection (Dynamic):** Pressures act between agents over time.
                  *   *Leaf:* **Dynamic Selection Attractorism** — It's a selection dynamic, the defectors out-compete and the trap is an attractor rather than merely an equilibrium.
                  *   *Leaf:* **[EMPTY] Selection-Focal Compatibilism** — Empty because selection pressures ignore salience; fitness dictates survival regardless of focal points.
              *   **Static (One-Shot):** Pressures are immediate strategic binds.
                  *   **3. Equilibrium Type**
                      *   **Coordination Failure:** Better equilibria exist but are unselected.
                          *   *Leaf:* **Salient Equilibrium Coordinationism** — It's a coordination problem and common knowledge plus a focal point fixes it.
                      *   **Genuine Stable Equilibrium:** Only one rational outcome exists (e.g., Prisoner's Dilemma).
                          *   **4. Escape Mechanism**
                              *   **Change Game:** Modify rules or enforce compliance externally.
                                  *   *Leaf:* **External Enforcer Necessitarianism** — The Hobbesian "there's no exit without a sovereign / external enforcer" view.
                              *   **Change Players:** Modify internal reasoning or identity.
                                  *   *Leaf:* **Agency-Unity Dissolutionism** — Team reasoning / superrationality — if we each ask what we'd all do if we all did the same thing, the trap dissolves.

  ### Empty and unreachable branches

  *   **Selection-Focal Compatibilism:** Incoherent. If the trap is driven by evolutionary selection between agents, mere coordination signals (focal points) cannot stop defectors from out-reproducing cooperators; the payoff structure must change.

  ### Pairs the tree can't separate

  *   **Epistemic Coordinationism vs. Salient Equilibrium Coordinationism:** In practice, these are indistinguishable. Both prescribe "better communication/common knowledge" as the solution, differing only on whether the barrier is technically "knowledge" or "selection among equilibria."
