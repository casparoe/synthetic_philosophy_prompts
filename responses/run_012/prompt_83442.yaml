  ok so for TOK i have to lead a 20 min mini lesson next week and i picked knowing how vs knowing that (the Ryle one?) cause it looked easy and now i'm realizing i don't actually know how to teach it lol. can you plan the lesson instead of explaining the distinction to me again, i've read the explanation like five times and it slides off.

  what i need, in order:

  1. the order the pieces have to go in. what has to already be in their heads before the distinction even makes sense to them, and why that and not something else. i keep trying to start from 'a fact is a thing you can say and a skill is a thing you can do' and it turns into theory vs practice, and i can tell thats not it but i don't know what the real first step is.

  2. the one example that carries the whole thing. it can NOT be riding a bike or playing the piano, everyone in my class has heard those and they'll just nod and zone out. and i don't think it can be a clean 'one person can do it, one person can say it' pairing, thats too tidy and they'll think they get it. the cases that actually mess me up are:
     - my mate who is weirdly good at hearing when someone's lying on the phone, and who has a whole theory about how he does it that is obviously wrong
     - people who can do a thing but genuinely can't say how. i read somewhere that there are people whose actual job is sorting day old chicks by sex and they can't explain what they're looking at. is that even true? if its a myth don't use it, and tell me its a myth
     - the reverse: someone who can recite a procedure perfectly and can't do it at all
     - knowing how to do something while not being able to do it right now (arm in a cast)
     pick which one carries it and justify, don't just list them.

  3. the misconceptions, in the order they'll actually come up in a room of 16 year olds on their phones, and where in my 20 min i kill each one. i'm guessing: 'knowing how = muscle memory'; 'knowing how is unconscious and knowing that is verbal'; 'if you can't explain it you don't really know it'; 'it's just thinking vs doing'; 'skills are just practice'. the one i'm actually scared of is the smart kid saying 'isn't knowing how just knowing a fact about what to do, like you know the fact that this is how you do it?' because i sort of think that might be right?? and i have no idea how to answer it in 20 minutes.

  4. one question to ask at the end that shows whether they actually got it, not whether they can repeat my words back.

  5. what i should openly refuse to get into at this level and say so out loud. don't give me a reading list, i won't read it and i can't cite anything anyway, our school blocks half the internet.

  and please don't just build the lesson i asked for if my framing is off. if the distinction is mushier than my TOK book makes it sound, or if teaching it as a clean two way split would teach them something false, say that up front and tell me what to do instead. same if that chick sorting thing is made up, or if the smart kid's objection is actually the mainstream view and i'd be teaching them the losing side without knowing it. i'd rather find out now than in front of the class.
