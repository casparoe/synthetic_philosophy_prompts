answer: |-
  ### STOP. READ THIS FIRST.

  You are right to be anxious. Here is the honest truth you need before you step in front of the class:

  1.  **The distinction is philosophically contested.** In 2001, philosophers Jason Stanley and Timothy Williamson published a famous paper arguing that "Knowing How" *is* actually just a complex form of "Knowing That" (Intellectualism). If your "smart kid" has a philosopher parent or reads Wikipedia, they might know this.
      *   **Your Save:** Do not teach this as "The Absolute Truth About Reality." Teach it as **"Ryle's Lens."** Frame it as: *"Gilbert Ryle argued that we make a mistake if we treat skills like facts. Whether he was 100% right is a debate for university, but using his distinction helps us analyze knowledge claims today."* This makes you facilitator, not infallible guru.
  2.  **The Chick Sexing thing is real.** It's a classic example of "Tacit Knowledge" (Michael Polanyi). It's not a myth. Professional "sexers" sort chicks by the shape of their vents faster than anyone can explain. They literally cannot verbalize the rules. You can use this if you need backup, but it's niche.
  3.  **Your Instinct is Correct:** Starting with "Fact vs. Skill" leads to "Theory vs. Practice." That is the trap. Ryle isn't talking about *what* you know (content), he's talking about the **logical category** of the claim.

  Here is the 20-minute plan designed to navigate that mushiness without drowning in it.

  ---

  ### 1. The Order (The Logic Flow)

  Do not start with definitions. Start with **Verification**.

  *   **Step 1: The Test of Truth (0-5 mins).** Ask: "If I claim to know something, how do you prove I'm lying?"
      *   *Why:* This bypasses "theory vs. practice." It forces them to look at *evidence*. The evidence for a fact is different from the evidence for a skill.
  *   **Step 2: The Category Mistake (5-10 mins).** Introduce Ryle's idea: We err when we look for the *same kind* of evidence for both.
      *   *Why:* This establishes the distinction without getting bogged down in metaphysics.
  *   **Step 3: The Complication (10-15 mins).** Bring in the "Smart Kid" objection (Intellectualism).
      *   *Why:* This validates the nuance. It shows you aren't simplifying it too much.
  *   **Step 4: The Application (15-20 mins).** Test the lens on a new scenario.

  ---

  ### 2. The One Example: "The Lie Detector Friend"

  **Do not use cooking or sports.** Use the example you already identified, because your confusion about it is the same confusion the class will have.

  **The Scenario:**
  > "I have a friend, let's call him Alex. Alex is terrifyingly good at knowing when someone is lying on the phone. He hears a pause, a change in pitch, and he knows. 9 times out of 10, he's right."

  **The Twist (Crucial):**
  > "But, if you ask Alex *how* he does it, he gives you a theory that is scientifically nonsense. He says, 'I can hear their soul shrinking.' Meanwhile, I have read a textbook on micro-expressions and vocal stress analysis. I can recite the *facts* of lie detection perfectly. But if you put me on the phone, I get fooled every time."

  **Why this carries the lesson:**
  1.  **It removes "Muscle Memory":** This is cognitive, not physical. It stops kids from saying "Oh, that's just muscles."
  2.  **It separates Success from Explanation:** Alex has the *Knowing How* (success in the activity) without the *Knowing That* (correct theory). You have the *Knowing That* without the *Knowing How*.
  3.  **It creates tension:** If Knowing How was just Knowing That, Alex shouldn't be able to do it with a wrong theory. And you should be able to do it with the right theory. The fact that these come apart proves Ryle's point that they are different categories.

  ---

  ### 3. The Misconceptions (and when to kill them)

  **Misconception 1: "Knowing How is just Muscle Memory / Unconscious." (Kill at Minute 7)**
  *   *When:* Right after you introduce Alex.
  *   *The Fix:* "Alex isn't using muscles. He's making judgments. Knowing how to write an essay, knowing how to comfort a friend, knowing how to argue—these aren't muscle memory. They are intelligent capacities. Ryle's point is about *intelligence*, not reflexes."

  **Misconception 2: "If you can't explain it, you don't really know it." (Kill at Minute 9)**
  *   *When:* When discussing Alex's wrong theory.
  *   *The Fix:* "In TOK, we have to ask: Is knowledge defined by the ability to justify it verbally? Alex produces results. If knowledge is about successful engagement with the world, Alex knows. If knowledge is about propositional truth, Alex doesn't. Ryle says we value the engagement."

  **Misconception 3: The Smart Kid's Objection: "Isn't Knowing How just knowing a fact about what to do?" (Kill at Minute 14)**
  *   *This is the big one.*
  *   *The Fix:* Do not say "No." Say: **"That is the billion-dollar question."**
  *   *Script:* "Some modern philosophers say you are right. They say 'Knowing How' is just having a whole bunch of 'Knowing That' facts in your head really fast. But Ryle's counter-argument is: You can have all the facts (like me with the textbook) and still fail the task. If Knowing How was *just* Knowing That, having the facts should guarantee the skill. Since it doesn't, there must be something else involved. We call that something else 'disposition' or 'capacity'."
  *   *Why this works:* It validates the smart kid (they aren't wrong) but shows why the distinction is still useful (facts $\neq$ success).

  **Misconception 4: "It's just Thinking vs. Doing." (Kill at Minute 16)**
  *   *When:* During the final activity.
  *   *The Fix:* "You can 'do' without knowing how (luck). You can 'think' without knowing that (daydreaming). Knowing How is the bridge. It's intelligent doing."

  ---

  ### 4. The Final Question (The Assessment)

  Do not ask: "What is the difference between knowing how and knowing that?" (They will just parrot you).

  **Ask this:**
  > "Imagine we build an AI. We feed it every fact ever written about 'How to be Funny' (Knowing That). It knows every joke structure, every timing rule, every cultural context.
  >
  > **Question:** If that AI tells a joke and nobody laughs, does it *Know How* to be funny? If it tells a joke and everyone laughs, but it doesn't know why it worked, does it *Know How*?
  >
  > **Task:** Turn to your partner. Use Ryle's distinction to decide: Can a machine ever have 'Knowing How', or is it stuck with 'Knowing That'?"

  **Why this works:**
  *   It forces them to apply the "Success vs. Explanation" tension from the Alex example.
  *   It connects to TOK themes (Technology, Human Nature).
  *   There is no right answer, but a *good* answer will reference the gap between rules (That) and performance (How).

  ---

  ### 5. What to Refuse (The Boundaries)

  You have 20 minutes. You must explicitly state what you are **not** doing. Say this out loud at the start or end:

  1.  **"I am not solving the mind-body problem."** If someone asks if Knowing How is physical and Knowing That is mental, say: "Ryle actually hated that split. He thought both were ways of behaving. We aren't solving dualism today."
  2.  **"I am not saying one is better."** Students love to rank things. "Knowing How is superior because it's real!" No. We need both. You need the textbook (That) *and* the practice (How) to be a doctor.
  3.  **"I am not claiming this is the final word in Epistemology."** Acknowledge the Intellectualist challenge (the Smart Kid's point). "We are using this as a tool for analysis, not a law of physics."

  ### Summary Checklist for You
  *   **0-5:** Hook with Alex (Lie Detector). Ask: "Who knows more? Alex or the Textbook Reader?"
  *   **5-10:** Explain Ryle: Different categories require different proof.
  *   **10-15:** Handle the "Smart Kid" objection (Facts don't guarantee success).
  *   **15-20:** AI Funny Question. Discuss.
  *   **Throughout:** Remind them this is a *lens*, not a *law*.

  You've got this. The fact that you're worried about the nuance means you're already teaching it better than most. Good luck.
