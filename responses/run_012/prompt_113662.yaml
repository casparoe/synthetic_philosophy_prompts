answer: |-
  # Decision Tree: The Logical Space of the Open Future

  **Instructions:** Answer the five questions below in order. Follow the branches to find your position. The questions rely on concrete cases (atoms, coins, forecasters); answer based on your intuition about the cases, not on which label you prefer.

  ### 1. The Fixity Question (Radioactive Atom)
  Consider a radioactive atom with a known half-life. Given the exact state of the universe right now and the laws of nature, is the outcome of its decay within the hour **already settled**?
  *   **Yes:** Go to **Leaf A (Hard Fatalism)**.
  *   **No:** Go to Question 2.

  ### 2. The Bivalence Question (Fair Coin)
  Consider a fair coin to be flipped tomorrow. Right now, is the claim *"It will land Heads"* either **True** or **False** (with no third option)?
  *   **Yes:** Go to Question 3.
  *   **No:** Go to Question 4.

  ### 3. The Metaphysics Question (Friend's Job Offer)
  (For those who answered **Yes** to Q2). Regarding your friend's decision to accept a job offer tomorrow: Is there **exactly one future history** that is *the* actual one, or are **many futures equally real** until the choice is made?
  *   **Exactly One:** Go to Question 5.
  *   **Many Equally Real:** Go to **Leaf B (Unattractive: Bivalent Branching)**.

  ### 4. The Metaphysics Question (Friend's Job Offer)
  (For those who answered **No** to Q2). Regarding your friend's decision: Is there **exactly one future history** that is *the* actual one, or are **many futures equally real** until the choice is made?
  *   **Exactly One:** Go to **Leaf C (Incoherent: Gappy Determinism)**.
  *   **Many Equally Real:** Go to Question 5.

  ### 5. The Semantics Question (Forecaster & Assessment)
  (For those still in the tree). Consider a forecaster who says *"It will rain"* today. Tomorrow it rains. She insists, *"I was right all along."*
  **Did the truth of her claim change?** (Can a claim be False/Indeterminate at utterance but True at assessment?)
  *   **No (Truth is fixed at utterance):** Go to Question 6.
  *   **Yes (Truth is relative to assessment):** Go to **Leaf D (Relativism)**.

  ### 6. The Excluded Middle Question (Disjunction)
  (For those who answered **No** to Q5). Is the disjunction *"Either it will rain or it will not"* **True** right now?
  *   **Yes:** Go to **Leaf E (Supervaluationism)**.
  *   **No:** Go to **Leaf F (Aristotelian Gap)**.

  *(Note: For those who answered **Yes** to Q2 and **One** to Q3, Question 5 splits the Bivalent views based on retrospective truth.)*
  *   **No (She was True then):** Go to **Leaf G (Ockhamism)**.
  *   **Yes (She was False then, True now):** Go to **Leaf H (Uniform Falsity)**.

  ---

  ## The Leaves

  **Leaf A: Hard Fatalism**
  *   **Pattern:** The future is fixed by past+laws; future claims are bivalent.
  *   **Awkward Commitment:** Deliberation is idle; your reasoning about what to do cannot affect what you will do.

  **Leaf B: Unattractive (Bivalent Branching)**
  *   **Pattern:** Many futures are equally real, yet one future-tensed claim is already True.
  *   **Awkward Commitment:** You must posit a "Thin Red Line" of actuality across a branching tree without metaphysical grounding for why *that* branch is true now.

  **Leaf C: Incoherent (Gappy Determinism)**
  *   **Pattern:** The future is fixed, yet future claims lack truth values.
  *   **Awkward Commitment:** You assert the outcome is settled by physics but deny language can describe it; this collapses into epistemic skepticism rather than metaphysical openness.

  **Leaf D: Relativism**
  *   **Pattern:** Many real futures; claims lack truth at utterance but acquire it at assessment.
  *   **Awkward Commitment:** Two speakers can contradict each other ("It will rain" / "It won't") without either being mistaken, depending on when they are assessed.

  **Leaf E: Supervaluationism**
  *   **Pattern:** Many real futures; claims are gappy, but logical tautologies (EM) remain True.
  *   **Awkward Commitment:** You must accept that "There will be a battle" is neither True nor False, while "There will be a battle or there won't" is True, violating standard truth-functional intuition.

  **Leaf F: Aristotelian Gap**
  *   **Pattern:** Many real futures; claims are gappy and Excluded Middle fails.
  *   **Awkward Commitment:** You must reject a fundamental law of classical logic (Excluded Middle) for a specific class of sentences, complicating inference.

  **Leaf G: Ockhamism (Libertarian Bivalence)**
  *   **Pattern:** One actual future; future claims are bivalent despite causal openness.
  *   **Awkward Commitment:** You must explain how a claim can be True now without the present physical state determining it (truth outstrips causation).

  **Leaf H: Uniform Falsity (Priorian)**
  *   **Pattern:** One actual future; all positive future contingents are False.
  *   **Awkward Commitment:** If the coin lands Heads, the claim *"It will land Heads"* was False yesterday; you must deny the forecaster was "right all along."

  ---

  ## Logical Space Table

  | Position | Fixity | Bivalence | Metaphysics | Excl. Middle | Assessment | Diagnosis |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Hard Fatalism** | Fixed | Yes | One | Yes | No | **Occupied** |
  | **Ockhamism** | Open | Yes | One | Yes | No | **Occupied** |
  | **Uniform Falsity** | Open | Yes | One | No* | Yes** | **Occupied** |
  | **Supervaluationism** | Open | No | Many | Yes | No | **Occupied** |
  | **Aristotelian** | Open | No | Many | No | No | **Occupied** |
  | **Relativism** | Open | No* | Many | Yes* | Yes | **Occupied** |
  | *Bivalent Branching* | Open | Yes | Many | Yes | No | **Unattractive** (Requires unmotivated "Thin Red Line") |
  | *Gappy Determinism* | Fixed | No | One | No | No | **Incoherent** (Fixity entails truth conditions) |
  | *Gappy One-Future* | Open | No | One | Yes | No | **Unexplored** (Why gappy if only one path?) |
  | *Fixed Many-Futures* | Fixed | Yes | Many | Yes | No | **Incoherent** (Contradiction in terms) |

  *\*Uniform Falsity treats EM as failing for contingents (All False). Relativism treats Bivalence/EM as context-sensitive.*
  *\*\*Uniform Falsity allows truth-value shift only in the sense that 'It is raining' replaces 'It will rain'; the original claim remains False.*

  ### Limitations & Notes

  **Indistinguishable Pairs:**
  *   **Ockhamism vs. Relativism:** Both allow the forecaster to say "I was right." The tree separates them by whether the truth was *fixed then* (Ockham) or *shifts to now* (Relativism). In ordinary conversation, these are often indistinguishable without pressing the "all along" clause.
  *   **Supervaluationism vs. Aristotelian:** Both agree atomic future claims are gappy. They only diverge on complex disjunctions. If your reading group only discusses atomic sea-battles, these positions will look identical.

  **Theological Variants:**
  *   **Theological Determinism:** Maps to **Hard Fatalism**. The cases (atoms, coins) cannot distinguish "Laws of Physics" from "Decree of God."
  *   **Molinism (Middle Knowledge):** Maps to **Ockhamism**. The claim "Creature C would freely do X" is treated as a true future contingent. The tree cannot distinguish "Grounded in Laws" from "Grounded in Divine Knowledge" without introducing theological premises external to the sea-battle cases.
