answer: |-
  Here is a breakdown of the philosophical machinery behind sortition, separating the mechanical realities from the theoretical claims, and distinguishing what scholars agree on from what they are still fighting about.

  ### The Machinery and Its Presuppositions

  You asked what the actual process—the draw, the quotas, the experts, the output—presupposes about the world. Every gear in this machine makes a philosophical claim.

  **1. The Random Draw (Lottery)**
  *   **The Mechanism:** Names pulled from the electoral roll.
  *   **The Presupposition:** Political equality is mathematical. It assumes that the *act* of seeking power (running for office) corrupts the *ability* to wield it. It rejects the "meritocratic" idea that those who want to lead are best suited to lead.
  *   **Legitimacy:** Randomness launders legitimacy by removing self-interest. If you didn't ask to be there, you presumably aren't there to advance a career or a donor's agenda.

  **2. Quota-Matching (Stratified Sampling)**
  *   **The Mechanism:** If the country is 51% female and 10% unemployed, the assembly must be too.
  *   **The Presupposition:** Lived experience is a form of expertise. It assumes that a wealthy retiree cannot fully deliberate on childcare costs even if they are "rational," because they lack the *data* of that experience. This conflates **descriptive representation** (looking like the people) with **substantive representation** (thinking like the people).
  *   **The Tension:** This is where the "Fairness" and "Smarts" pitches merge. The claim is that the assembly is smart *because* it is fair (diverse).

  **3. Paid Stipends & Logistics**
  *   **The Mechanism:** Paying people to show up, providing childcare, hotels.
  *   **The Presupposition:** Citizenship is labor. It assumes that without compensation, participation is a privilege of the wealthy. This treats the citizen not as a volunteer, but as a worker hired by the state.

  **4. Expert Testimony & Briefing Packs**
  *   **The Mechanism:** Academics and stakeholders present evidence; staff curate the reading.
  *   **The Presupposition:** There is a distinction between *values* (what we want) and *facts/means* (how we get it). It assumes ordinary people have the competence to judge values, but need scaffolding to understand technical constraints.
  *   **The Risk:** This presupposes that "facts" can be presented neutrally. Critics argue the curation of experts is where the real power lies.

  **5. Non-Binding Recommendations**
  *   **The Mechanism:** The assembly suggests; the parliament decides.
  *   **The Presupposition:** Sovereignty remains with the elected body, but legitimacy is borrowed from the citizens. It assumes a hybrid model: the people have wisdom, but the politicians have the mandate.

  ### Fairness vs. Smarts: Do They Pull Apart?

  You asked if the two pitches rest on the same commitments. The short answer is: **Theoretically, they are distinct. Practically, the machinery tries to glue them together.**

  **The Fairness Pitch (Legitimacy)**
  This relies on **Democratic Equality**. It doesn't matter if the assembly is dumb; it matters that it is *yours*. It is a mirror of the public.
  *   *Can you have Fair but Dumb?* Yes. If you pull a random sample and give them no time or bad facilitation, you have a perfectly representative group making ill-informed choices. The machinery prevents this with the "Expert Testimony" gear, but the risk remains.

  **The Smarts Pitch (Epistemic Value)**
  This relies on **Cognitive Diversity**. It argues that a heterogeneous group solves problems better than a homogenous group of experts (who often think alike).
  *   *Can you have Smart but Unfair?* Yes. You could hand-pick a group of "wise" citizens who are all wealthy and educated. They might make brilliant policy, but they lack the legitimacy of the random draw.

  **Where the Machinery Picks a Side**
  The machinery (specifically quota-matching) bets on the idea that **representativeness creates competence.** It assumes that by fixing the demographics, you fix the cognitive blind spots.
  *   *The Contested Bit:* Many political scientists argue this is a leap. A microcosm of the public is still the public, with all the public's biases, prejudices, and short-term thinking. The "Smarts" pitch often relies on the facilitation and expert evidence more than the randomness itself. If the assembly produces a "smart" outcome, is it because they were random, or because they were heavily guided by staff and experts?

  ### The Power Dynamic: Trust or Decoration?

  This is the crux of your piece. You noticed that ordinary people are "trusted" to decide, but only within a cage built by others.

  **1. Agenda Setting**
  Usually, the government or parliament sets the question. (e.g., "How do we meet climate targets?" not "Should we have climate targets?").
  *   **The Commitment:** This reveals that the trust is in **judgment**, not **will**. The assembly is trusted to solve the puzzle, but not to choose the puzzle.

  **2. The Briefing**
  Staff and experts curate the information.
  *   **The Commitment:** This presupposes that there is a "neutral" ground of facts. If the briefing materials lean one way, the "randomness" of the people doesn't matter.

  **3. The Output**
  The recommendation is usually non-binding.
  *   **The Commitment:** This is the strongest evidence that the "Trust" is bounded. The system trusts citizens to *deliberate*, but it does not trust them to *rule*.

  **Verdict:** The "Trust" is genuine regarding **moral judgment** (we trust you to say what is right). The "Decoration" is the implication of **sovereignty** (we pretend you are in charge, but parliament can ignore you). The machinery is designed to produce **public reason**, not **public will**. It wants citizens to think like trustees, not like voters.

  ### The Jury Duty Analogy

  You asked if striking jurors (voir dire) contradicts the idea of sortition.

  *   **The Contradiction:** Pure sortition says every random person is fit. Voir dire says some random people are unfit (biased, connected to the defendant).
  *   **The Consistency:** It is consistent if you change the goal.
      *   **Juries** aim for **Impartiality**. They want a blank slate. Randomness is used to prevent stacking, but stripping is used to ensure neutrality.
      *   **Citizens' Assemblies** aim for **Representativeness**. They *want* your biases, your lived experience, and your values. They don't want a blank slate; they want a microcosm.
  *   **The Takeaway:** If you start striking people from a citizens' assembly to make them "more reasonable," you destroy the philosophical point of the assembly. You turn it back into an elite panel.

  ### Settled Consensus vs. Contested Debates

  Here is the landscape of the field, separated into what is generally accepted and what is still fought over.

  **What is Generally Settled (The Mechanics)**
  1.  **Descriptive Representation:** Sortition assemblies *do* successfully mirror the demographics of the population (gender, age, education, geography) better than elected legislatures. This is empirically verifiable.
  2.  **Deliberative Quality:** Inside the room, polarization decreases. People change their minds. The quality of discourse is higher than in parliamentary debate or social media. This is consistently observed in post-assembly surveys.
  3.  **Distinct Function:** Everyone agrees these bodies are distinct from elections and referendums. They are not meant to replace parliament, but to supplement it.

  **What is Contested (The Impact & Theory)**
  1.  **Epistemic Value:** Do they actually make *better* decisions?
      *   *Camp A:* Yes, because they are insulated from lobbying and short-term election cycles.
      *   *Camp B:* We don't know. We have no control group. A parliament of experts might have made the same choice. Some argue "ordinary people" lack the systemic understanding for complex economics regardless of briefing.
  2.  **The Implementation Gap:**
      *   *Camp A:* Assemblies pressure governments to act (e.g., Ireland's abortion referendum).
      *   *Camp B:* Governments cherry-pick recommendations. If the assembly suggests something expensive or unpopular, it gets ignored (e.g., some critiques of the French Climate Convention). The non-binding nature renders them "talk shops."
  3.  **The "Elite Capture" of Process:**
      *   *Camp A:* The facilitation and expert selection are neutral/managed well.
      *   *Camp B:* The "deep state" or civil service controls the assembly through the briefing books. The randomness of the people is a fig leaf for the technocracy writing the questions.
  4.  **Systemic Threat vs. Boost:**
      *   *Camp A:* Sortition saves democracy by restoring trust.
      *   *Camp B:* Sortition undermines democracy by bypassing elected accountability. If an unelected body makes a recommendation, and politicians follow it, who do you vote out if it goes wrong?

  ### Summary for Your Piece

  The sortition bandwagon is selling a hybrid product. It uses the **aesthetics of direct democracy** (random people) to solve the **crisis of representative democracy** (untrusted politicians), but it retains the **safety mechanisms of technocracy** (expert briefings, non-binding outcomes).

  The philosophical wager is this: **Ordinary people are wise enough to judge, but not sovereign enough to rule.**

  If you want to find the tension in your reporting, look at the **briefing packs** and the **government response**. That is where the "Trust" is tested. If the questions are narrow and the answers are ignored, the "Fairness" pitch was real, but the "Smarts" pitch was decoration. If the questions are broad and the answers are adopted, the system is genuinely testing a new form of power sharing.

  Most scholars agree the *process* works (people deliberate well). They disagree fiercely on whether the *politics* work (whether it changes anything).
