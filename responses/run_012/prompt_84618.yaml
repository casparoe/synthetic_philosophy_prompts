  **FOUNDATION FOR ADVERSARIAL COLLABORATION IN THE SCIENCES AND HUMANITIES**
  **FINAL SUBMISSION: PROJECT 89-B (ONTOLOGY OF FORMAL STRUCTURES)**
  **DATE:** 14 October 2024
  **SUBJECT:** Joint Report on the Status of the Dispute Regarding Mathematical Objects

  **SIGNATORIES:**
  **Dr. Elias Thorne** (Principal Investigator, Mathematics)
  **Dr. Sarah Vance** (Principal Investigator, Philosophy)

  ---

  ### I. JOINT CLAIMS

  The undersigned, having engaged in a two-year structured dialogue under the auspices of the Foundation, hereby affirm the following propositions. These claims are drafted to reflect the common ground of our practice without requiring either party to relinquish their metaphysical commitments.

  1.  **On Proof Standards:** We agree on the validity of all standard proofs currently accepted by the mathematical community. Our disagreement concerns the *truth-makers* of these proofs, not their correctness within the system.
  2.  **On Utility:** We agree that mathematics is indispensably useful for formulating physical theories. We disagree on whether this indispensability implies the existence of the objects quantified over in those theories.
  3.  **On the Ledger Test:** We agree that a sentence of physical theory may be rewritten to eliminate numerals and quantification over numbers using plural or relational vocabulary. We agree that for such a rewriting to be successful, it must preserve empirical adequacy and deductive closure relative to the original formulation. We disagree on whether successful rewriting resolves the ontological question.
  4.  **On the Orphan Theorem:** We agree that there exist combinatorial statements whose only known proofs utilize detours through stronger theories positing infinite totalities. We agree that these statements are assertible. We disagree on whether the detour constitutes knowledge of a fact or merely the validation of a move within a game.
  5.  **On the Verbal Distinction:** We agree that a distinction can be drawn between a "lightweight" existence claim (a commitment to the truth of a sentence within a linguistic framework) and a "heavyweight" existence claim (a commitment to the mind-independent reality of the referents). We disagree on whether the lightweight reading exhausts the meaning of mathematical assertion.

  ---

  ### II. TABLE OF RESIDUAL DISAGREEMENTS

  | Point at Issue (Neutral) | Platonist Formulation (Thorne) | Fictionalist Formulation (Vance) | The Crux | Agreed Case / Argument & Conditional Concessions |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Ledger Test**<br>(Elimination of numerical ontology in physics) | **Paraphrase Loss:** Removing numbers strips the theory of its reference to real structural features, leaving a cumbersome shadow. | **Ontological Cleanup:** Removing numbers reveals the theory's true commitment to concrete relations, discarding superfluous posits. | Does the *cost* of the rewriting (complexity, loss of unification) track ontological reality, or merely human cognitive limitation? | **Case:** A complete nominalistic reconstruction of General Relativity is produced.<br>**Conditional Verdicts:**<br>• *If the reconstruction is equally concise and unifying:* Thorne concedes numbers are not causally necessary for physical explanation. Vance concedes numbers are not indispensable for formulation.<br>• *If the reconstruction is vastly more complex:* Thorne takes this as evidence that numbers carve nature at its joints. Vance concedes this would make the nominalist view pragmatically inferior, but denies it proves numbers exist. <br>**Impasse:** We cannot agree on whether "simplicity" is a guide to truth or a guide to utility. |
  | **2. The Orphan Theorem**<br>(Combinatorial truth via infinite detour) | **Deep Connection:** The detour reveals that finite truths are grounded in infinite structures. The truth was there waiting to be found. | **Instrumental Overreach:** The detour is a useful calculator. We know the statement is *derivable*, not that it is *true* in a robust sense, until a concrete proof is found. | Do we possess knowledge of the theorem *now*, while the only proof relies on fictional entities? | **Case:** A purely combinatorial proof is discovered ten years from now.<br>**Conditional Verdicts:**<br>• *If the concrete proof is found:* Thorne concedes the infinite detour was not *strictly* necessary for truth, but maintains it was explanatory. Vance concedes the statement was "true" all along, but maintains the infinite detour was still a fiction.<br>• *If no concrete proof is ever found:* Thorne maintains we still know the theorem via the infinite proof. Vance maintains we only know the theorem is *assertible within the fiction*.<br>**Impasse:** We cannot agree on what "knowing" means in the interim period. |
  | **3. Successor-Physics Counterfactual**<br>(Empirically equivalent non-numerical physics) | **Notational Variance:** A non-numerical physics is merely a change of coordinates. The structure remains, and the structure *is* the object. | **Ontological Vindication:** A non-numerical physics shows that numbers were never needed to describe the world. They are tools, not constituents. | Is empirical equivalence sufficient for ontological parity? | **Case:** Physicists adopt a purely relational, non-quantitative formalism that predicts all current data.<br>**Conditional Verdicts:**<br>• *If the new formalism is adopted:* Thorne concedes numbers are not required for *prediction*, but argues the relational structure still constitutes a mathematical object. Vance concedes the structure exists but maintains it is a structure of *concrete* relations, not abstract objects.<br>• *If the new formalism fails to unify:* Thorne takes this as proof that numerical ontology is required for unification. Vance takes this as proof that numerical ontology is a useful heuristic.<br>**Impasse:** Thorne refuses to concede that a change in formulation changes the ontology of structure. Vance refuses to concede that structure implies object. |

  ---

  ### III. THE VERBAL SECTION (ON LIGHTWEIGHT AND HEAVYWEIGHT EXISTENCE)

  *Preface: At the insistence of the Foundation, and against our initial inclination to treat this as merely semantic, we have dedicated this final section to testing the hypothesis that our dispute is verbal.*

  **1. The Distinction**
  We accept the distinction proposed:
  *   **Lightweight Existence:** To say "There are prime numbers" is to say "The sentence 'There are prime numbers' is true according to the rules of arithmetic." It is a bookkeeping remark about our linguistic commitments.
  *   **Heavyweight Existence:** To say "There are prime numbers" is to say "The world contains entities corresponding to prime numbers, independent of our language."

  **2. The Fictionalist Concession**
  I (Vance) grant the Lightweight reading entirely. I am happy to say "There are prime numbers" in the lightweight sense. I can sign the mathematician's papers, teach his classes, and verify his proofs without believing in the heavyweight existence of numbers. For me, the lightweight reading exhausts the legitimate content of mathematical assertion. Anything beyond this is metaphysical excess.

  **3. The Platonist Resistance**
  I (Thorne) accept the Lightweight reading as a *subset* of the truth, but I reject it as the *whole* truth. The Lightweight reading explains why we can agree on proofs, but it fails to explain *why the game works*. If numbers were merely rules of language, their applicability to the physical world would be a miracle. I require the Heavyweight reading to explain the convergence of mathematical discovery and physical structure. I cannot have the Heavyweight reading for free; I know this. But I cannot accept a philosophy that renders the success of my life's work a lucky accident of syntax.

  **4. Residual Substance**
  We have attempted to deflate the dispute using this distinction. We find that the dispute does not evaporate.
  *   **Applicability:** The Lightweight view treats applicability as a happy coincidence or a result of selective pressure on our language. The Heavyweight view treats it as a causal or structural link. This disagreement survives the verbal distinction.
  *   **Unity of Practice:** The Lightweight view suggests mathematics is a patchwork of useful fictions. The Heavyweight view suggests it is a unified exploration of a single realm. We disagree on whether the unity is real or imposed.
  *   **Epistemology:** The Lightweight view requires no explanation of access (we invented the rules). The Heavyweight view requires an account of how finite minds access infinite realities. We disagree on whether this is a problem to be solved or a pseudo-problem to be dissolved.

  **5. Final Finding on the Verbal Hypothesis**
  We conclude that while much of our *argumentation* has been verbal (talking past one another regarding the word "exist"), the *disagreement* is not.
  *   Vance maintains that once the Lightweight reading is granted, Thorne's Heavyweight addition is an empty gesture that adds no predictive or explanatory power.
  *   Thorne maintains that once the Lightweight reading is granted, Vance's refusal of the Heavyweight addition renders the world unintelligible.

  We cannot offer a test that would settle the Heavyweight question. Any test we devise (such as the Ledger Test or the Successor Physics) can be interpreted by Vance as a pragmatic shift and by Thorne as an ontological revelation. We therefore record our disagreement as **real but currently untestable.** We have clarified the terms of the stalemate, but we have not broken it.

  **Signed,**

  *Elias Thorne*
  *Sarah Vance*
