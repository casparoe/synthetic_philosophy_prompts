answer: |-
  Your intuition aligns with Karl Popper's original definition of verisimilitude (truthlikeness), which seemed perfectly reasonable until logicians Pavel Tichý and David Miller independently proved in 1974 that it collapses for any false theory.

  To understand why, we must look at how logical consequences behave under set inclusion. Let $Cn(T)$ be the set of all logical consequences of a theory $T$. We can partition this set into true consequences, $Cn_T(T)$, and false consequences, $Cn_F(T)$. Your naive definition suggests that Theory $B$ is closer to the truth than Theory $A$ if:
  1.  $Cn_T(A) \subset Cn_T(B)$ ($B$ has strictly more true consequences)
  2.  $Cn_F(B) \subset Cn_F(A)$ ($B$ has strictly fewer false consequences)

  The problem arises because theories are **closed under conjunction**. This means if a theory entails statement $p$ and statement $q$, it also entails the combined statement "$p$ and $q$."

  If Theory $A$ is false, it entails at least one false statement, let's call it $f$. If rival Theory $B$ is to have more truth content, it must entail some true statement $t$ that $A$ does not. However, because $B$ is also false (as we are comparing two false theories), it entails some false statement $f'$. Due to logical closure, $B$ must also entail the conjunction "$t$ and $f'$." Since $t$ is true and $f'$ is false, the conjunction "$t$ and $f'$" is false.

  Here is the critical failure: By adding new true consequences ($t$) to a false theory, you automatically generate new false consequences (like "$t$ and $f'$") that did not exist in the weaker theory. Tichý and Miller proved that for any two false theories, if $B$ has more true content than $A$, $B$ **must** also have more false content than $A$. The sets $Cn_T$ and $Cn_F$ are positively correlated for false theories; you cannot increase one without increasing the other. Therefore, the condition $Cn_F(B) \subset Cn_F(A)$ is logically impossible to satisfy if $Cn_T(A) \subset Cn_T(B)$, rendering the set-theoretic difference definition useless for comparing false theories.

  Summary: The definition fails because logical closure ensures that for any false theory, increasing true consequences inevitably generates new false consequences, making it impossible to maximize truth content while minimizing falsity content.
