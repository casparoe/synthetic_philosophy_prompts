          1.  **Code Length (Prior Cost):** Bits to specify the hypothesis in the machine language. Invariant up to $C$.
          2.  **Compression (Posterior Gain):** Bits saved in describing data given the hypothesis (fit + penalty). This is where prediction happens.
          3.  **Translation (Mapping Cost):** Bits to map scientific concepts (e.g., "force," "conservation") to machine primitives. This is *not* invariant because scientific vocabulary is historical, not formal.
      *   *The Problem:* The invariance theorem protects (1), but (3) can swamp (1) and (2) in finite time, and (3) varies wildly between conceptual schemes (e.g., Newtonian vs. Cartesian physics).
