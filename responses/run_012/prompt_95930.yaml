answer: |-
  **Project Title:** The Three Currencies of Simplicity: Diagnosing the Limits of Invariance in Algorithmic Induction

  **Research Question**
  Does the additive-constant invariance of algorithmic complexity secure the stability of inductive priors when the cost of translating scientific vocabulary into machine language is treated as a distinct variable from the cost of specifying the hypothesis?

  **Project Summary**
  The standard justification for Occam's razor in algorithmic information theory relies on an invariance theorem: the complexity of a hypothesis differs by at most an additive constant across different universal reference machines. Proponents argue this constant becomes negligible as data accumulate, rendering the choice of machine harmless. This proposal argues that this defense is incomplete because it treats "simplicity" as a single currency. I propose to distinguish three distinct costs: (1) *Code Length* (bits to specify the hypothesis in machine language), (2) *Compression* (bits saved in describing data given the hypothesis), and (3) *Translation* (bits required to map the vocabulary of a working science into the machine's primitives).

  The invariance theorem guarantees stability for Code Length relative to the machine, but it does not guarantee stability for Translation relative to the scientific vocabulary. Since scientific vocabularies are historical artifacts rather than formal conventions, the Translation cost may not "wash out" in finite time and may vary wildly between conceptual schemes (e.g., a physics formulated via conservation principles versus one formulated via differential equations). This project will demonstrate that the standard defense secures the first currency only, while the epistemic work is done in the second, and the third remains a source of unquantified bias.

  **Background and Problem Statement**
  Algorithmic induction posits a prior probability distribution over hypotheses weighted by their simplicity, measured by the length of the shortest program producing them on a universal Turing machine. A common objection is that simplicity is relative to the choice of machine. The standard response is that any two universal machines simulate each other with a fixed overhead; thus, the complexity difference is bounded by a constant independent of the data. As the data stream grows, the influence of this constant on the posterior probability diminishes to zero.

  This argument assumes that the hypothesis is already available in a form the machine can process. It conflates the cost of writing the hypothesis down (Code Length) with the cost of getting the hypothesis into a writable form (Translation). In practice, a scientist does not propose a bitstring; they propose a statement in a natural or formal language (e.g., "energy is conserved"). To evaluate this via algorithmic induction, one must encode this statement into the machine's alphabet.

  The invariance theorem protects against arbitrary choices of the *machine*, but it does not protect against arbitrary choices of the *scientific vocabulary* used to state the hypothesis. If one conceptual scheme requires a massive translation overhead to be expressed in the machine's primitives compared to a rival scheme, the "harmless constant" may effectively encode a bias toward the scheme that matches the machine's native ontology. The standard defense leaves open whether this translation bias is epistemically benign or whether it undermines the claim that algorithmic induction objectively justifies Occam's razor.

  **Methodology**
  The work will be primarily conceptual, supported by limited formal modeling. I will construct a taxonomy of the three currencies of simplicity and analyze their roles in the two-part coding account of induction.

  1.  **Conceptual Analysis:** I will rigorously define the boundaries between Code Length, Compression, and Translation. I will argue that Translation is not merely a subset of Code Length but a distinct epistemic cost arising from the historical contingency of scientific language.
  2.  **Formal Toy Models:** I will attempt to construct simple encoding scenarios comparing two hypothesis spaces: one based on conservation laws and one based on state-transition rules. I will estimate the bit-costs for Code Length and Translation for each, relative to a fixed reference machine.
  3.  **Contingency Plan:** If the formal encoding proves intractable or relies on arbitrary assumptions within the first fortnight, I will pivot to a purely philosophical argument. I will treat the "Translation Cost" as a conceptual category error in the standard literature, demonstrating via logical argument that the invariance theorem cannot apply to vocabulary choices even if it applies to machine choices. The deliverable will remain a rigorous distinction and diagnosis rather than a simulation.

  **Schedule (3 Months, Half-Time)**
  *   **Month 1:** Refine the definitions of the three currencies. Draft the argument distinguishing Translation from Code Length. *Fortnight 1 Deliverable:* A working definition of Translation Cost and a decision on whether to proceed with formal encoding or pivot to pure conceptual analysis.
  *   **Month 2:** Develop the case studies (conservation vs. transition formulations). If formalizing, run simple bit-count estimates. If conceptual, expand the argument regarding historical contingency and finite data limits.
  *   **Month 3:** Synthesis and writing. Assemble the distinction, the critique of the invariance defense, and the implications for the objectivity of simplicity. Finalize the manuscript for submission.

  **Expected Outcomes and Criteria for Success**
  *   **Success:** A clear, defensible distinction between the three currencies of simplicity and a demonstration that the standard invariance argument fails to account for the third (Translation). The output will be a paper arguing that the justification for Occam's razor is less secure than claimed because it ignores vocabulary bias.
  *   **Failure:** The project fails if I cannot show that Translation Cost is distinct from the additive constant in the invariance theorem (i.e., if Translation is shown to be mathematically absorbable into the standard constant without loss of generality). It also fails if the distinction yields no epistemic consequences for finite data scenarios.
  *   **Scope Assessment:** Three months half-time is insufficient for a new theorem in algorithmic information theory. I will explicitly drop any attempt to derive a new bound or induction principle. The contribution is a distinction plus a diagnosis. I will also drop any attempt to survey the full history of Occam's razor; the focus is strictly on the algorithmic justification.

  **Confidence Assessment**
  I am highly confident in the substantive claim that "simplicity" is currently doing ambiguous work in the literature and that separating specification cost from vocabulary mapping is a necessary philosophical clarification. I am moderately confident that this distinction has epistemic consequences for finite data regimes.

  The point I am least sure of is whether the "Translation Cost" can be formally separated from the "Additive Constant" in a way that technically breaks the invariance theorem, rather than simply being absorbed by it as part of the machine choice. It is possible that a proponent could argue the vocabulary choice is just part of the reference machine definition, in which case the invariance theorem technically holds, even if the constant is large. My argument relies on the claim that scientific vocabulary is external to the machine convention, but formalizing that boundary is the greatest technical risk.
