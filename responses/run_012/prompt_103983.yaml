  6.  *(Final Review of the Output)*: The resulting essay needs to be structured as a seminar reading note or a lecture guide that models the analysis requested. I will structure it as a critical commentary designed for the instructor to use or distribute.

      *   *Key Insight to highlight:* The film treats "consciousness" as the source of risk. Alignment theory treats "optimization pressure" as the source of risk. This is the fundamental ontological clash.

