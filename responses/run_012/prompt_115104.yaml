prompt: |-
  I design incentive schemes for organizations for a living, so I think habitually in terms of objective functions, principal–agent problems, commitment devices, and the drift between a system's stated goal and what it actually optimizes. Restate Simone Weil's critique of political parties as faithfully as you can in that vocabulary: what she takes a party to be, what holds a member to it, why she thinks membership corrodes the member's judgment, and what she proposes instead. Then give me the residue report. Which of her claims turn out to be ordinary incentive problems in my sense — self-selection, loyalty as a commitment device, orthodoxy as a way of compressing the belief space so that it can be centrally managed, the party's survival as an agency problem? Which survive the translation only in a distorted form? And what, if anything, in her account has no counterpart in my vocabulary at all — no way of being stated without changing the subject?

  I want a definite answer to the question the residue raises, not a survey of options: is the leftover a defect of my framework — something real about parties that incentive design is structurally unable to see — or is it a sign that Weil was dressing up a mundane organizational pathology in religious-metaphysical language? Give your reasons, and commit. End with a final line of the form \answer{...} containing a short phrase stating your verdict.
