answer: |-
  # Joint Statement of Adversarial Collaboration: The Status of Neural Computation

  ### Preamble: Locating the Disagreement on the Ladder of Claims

  To ensure we are not merely talking past one another, we have mapped our respective positions onto a ladder of four increasingly strong claims regarding the statement "The brain computes." We agree on our locations as follows:

  *   **Rung 1 (Description):** *Some neural systems can be described as computing.*
      *   **Implementation Camp:** Accept.
      *   **Deflationary Camp:** Accept.
      *   **Status:** **Agreement.** We acknowledge that much past debate has stalled here. Both sides agree that computational descriptions are possible and often mathematically precise.
  *   **Rung 2 (Explanation):** *The computation a system performs explains its behaviour.*
      *   **Implementation Camp:** Accept. The computational description tells us *why* the system behaves as it does.
      *   **Deflationary Camp:** Reject (with qualification). We accept it explains in a pragmatic, predictive sense, but deny it explains in an ontological sense distinct from physical description.
      *   **Status:** **Verbal/Conceptual Dispute.** We disagree on the definition of "explanation."
  *   **Rung 3 (Causal Powers):** *The system's causal powers are conferred by its computational properties, so that a description omitting them would be causally incomplete.*
      *   **Implementation Camp:** Accept. Computational properties are causally relevant.
      *   **Deflationary Camp:** Reject. Causal powers are conferred by physical properties; computational properties are abstractions over those physical properties.
      *   **Status:** **Genuine Crux.** This is the core ontological disagreement.
  *   **Rung 4 (Substrate Independence):** *Those causal powers are indifferent to the material substrate implementing the computation.*
      *   **Implementation Camp:** Accept. The same computation could be realized in different media.
      *   **Deflationary Camp:** Reject (as moot). Since computational properties do not confer causal powers (Rung 3), the question of their independence from substrate is irrelevant. If forced, we deny that causal powers transfer across substrates merely because a computational description fits both.
      *   **Status:** **Derivative Dispute.** This follows from the resolution of Rung 3.

  ***

  ### 1. Agreed Claims

  Both parties sign the following statements to establish a common baseline for inquiry.

  1.  **Working Definition:** For the purposes of this collaboration, "computation" is defined minimally as a process involving the transformation of input states into output states according to a rule-governed structure. We agree to suspend debate on whether this definition implies semantics (meaning) until Rung 3 is addressed.
  2.  **Evidence Standards:** Both parties agree that valid evidence must consist of observable neural data (e.g., spike trains, connectivity maps, lesion effects) and behavioral outputs. Neither side appeals to introspection or non-physical faculties.
  3.  **Empirical vs. Verbal:** We agree that the question "Can we model the brain computationally?" is empirical (Rung 1). We agree that the question "Does the word 'compute' refer to a natural kind or a useful fiction?" is largely verbal/conceptual. We disagree on whether the verbal distinction maps onto a causal difference in the world (Rung 3).
  4.  **Digital/Serial Negation:** Neither side is committed to the claim that the brain is digital, serial, or discrete. The Implementation Camp does not require the brain to operate like a standard von Neumann architecture computer. The Deflationary Camp does not require the brain to be continuous to deny it computes.
  5.  **Program Negation:** Neither side is committed to the claim that the brain "runs programs" in the sense of executing stored software instructions distinct from its hardware. The disagreement concerns the causal status of the *process*, not the presence of code.
  6.  **Engineering Value:** Both parties agree that computational modeling has immense engineering and predictive value. The Deflationary Camp's skepticism is ontological, not pragmatic; they do not advocate abandoning computational models.

  ***

  ### 2. Disagreements Table

  | Question at Issue | Implementation Camp Formulation | Deflationary Camp Formulation | Crux or Verbal? | Shared Case / Argument | Implementation Prediction | Deflationary Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **The Ontological Status of "Computation"** | Computational properties are features of the system itself, discoverable like mass or charge. | Computational properties are stances adopted by observers, like "being a hammer" or "being a weapon." | **Crux** | General analysis of causal attribution. | We can find neural mechanisms that *are* computations regardless of an observer. | Any neural mechanism identified as a computation can be redescribed physically without loss. |
  | **Bacterial Chemotaxis** | The bacterium computes the spatial gradient of chemicals to decide on flagellar rotation. | The bacterium physically reacts to chemical binding rates; "computing the gradient" is a shorthand for the feedback loop. | **Verbal** (mostly) | E. coli run-and-tumble mechanism. | Disrupting the comparison mechanism stops the "computation" and the tracking. | Disrupting the physical binding stops the tracking; calling it computation adds no causal detail. |
  | **Cerebellar Circuitry** | The expansion of input space is a computational strategy to allow linear separation of patterns. | The wiring pattern physically expands the signal space; "strategy" implies a goal that exists only for the modeler. | **Crux** | Granule cell expansion and Purkinje readout. | The system is organized *for* linear separation; this organization explains the learning speed. | The system is organized by evolution for survival; linear separation is our description of the physics. |
  | **Lookup-Table Device (LUT)** | A device that maps inputs to outputs via a static table does not compute in the relevant sense; it lacks the algorithmic structure. | If the device produces the same input-output mapping, the computational description applies equally; internal structure is irrelevant to the ascription. | **Crux** | A black box matching a neural circuit's I/O exactly. | **Prediction:** The LUT does *not* compute the same function. If replaced by a compact algorithm, it *does* compute. The prediction changes based on internal structure. | **Prediction:** The LUT *does* compute (the description fits). If replaced by an algorithm, it still computes. The prediction does *not* change; I/O determines the computational description. |
  | **Causal Completeness** | A physical description alone is causally incomplete because it misses the organizational properties that make the system work. | A physical description is causally complete; adding computational vocabulary is redundant, not supplementary. | **Crux** | Lesion studies where function is lost despite physical continuity. | The loss of function is due to the disruption of the computational architecture. | The loss of function is due to the disruption of the physical substrate; "architecture" is just a pattern in the substrate. |

  ***

  ### 3. The Cruxes

  We identify two primary cruxes where our disagreement is substantive rather than verbal. For each, we specify what would settle the matter and what is at stake.

  **Crux 1: The Causal Efficacy of Computational Properties (Rung 3)**
  *   **Settlement Condition:** The Implementation Camp would concede if it were demonstrated that every successful computational explanation can be fully reduced to a physical explanation without any loss of predictive power or generalizability across different physical substrates. The Deflationary Camp would concede if a case were found where the physical description failed to predict behavior, but a computational description (abstracting away from the physics) succeeded.
  *   **Cost of Being Wrong:**
      *   *Implementation Camp:* If wrong, cognitive science is merely a heuristic shorthand for neuroscience, not a distinct explanatory level. The "software" metaphor is literally false.
      *   *Deflationary Camp:* If wrong, there are causal facts in the universe that are not physical facts. This would require a revision of standard physical causal closure.

  **Crux 2: The Relevance of Internal Structure (The Lookup Table Case)**
  *   **Settlement Condition:** We agree to analyze systems where the Input-Output behavior is identical but the internal causal chain differs (e.g., a neural circuit vs. a lookup table vs. a hydraulic system). If the system's ability to adapt to *novel* inputs (generalization) depends on the internal algorithmic structure rather than just the I/O mapping, this favors Implementation. If the I/O mapping is the sole determinant of whether we call it a computer, this favors Deflation.
  *   **Cost of Being Wrong:**
      *   *Implementation Camp:* If wrong, the distinction between "simulating" and "duplicating" a mind collapses. A lookup table could be conscious or cognitive simply by matching behavior.
      *   *Deflationary Camp:* If wrong, the claim that "computation is observer-relative" fails. There would be a fact of the matter about whether a system is computing that depends on its internal machinery, not just our descriptive stance.

  ***

  ### 4. Closing Note (Drafter's Reflection)

  In drafting this document, the most significant risk I faced was smuggling the Implementation Camp's assumptions into the "Agreed Claims." It is tempting to define "computation" in a way that requires causal structure, which would beg the question against the Deflationary Camp. I attempted to mitigate this in Claim 1 by keeping the definition minimal (state transformation) and in Claim 3 by explicitly flagging the empirical/verbal split.

  The area where this drafting is most likely to fail is in the **Lookup Table** row of the disagreements table. I have characterized the Deflationary Camp as claiming the LUT "computes" because the description fits the I/O. However, a sophisticated Deflationist might argue that *neither* the LUT nor the Algorithm "computes" in a real sense; both are merely described that way for convenience. If they take this harder line, my formulation in the table might inaccurately suggest they grant more reality to computation than they intend. I have tried to capture this in the "Prediction" column by noting the description applies equally, but the nuance is fragile.

  I would revise this document if I were convinced that the distinction between "verbal" and "crux" in the Preamble is itself the error. It is possible that the disagreement is not about whether computation is causal (Crux), but about what we mean by "causal." If the Deflationary Camp argues that physical causation is the *only* causation, and the Implementation Camp argues that "computational causation" is a higher-level abstraction that is *also* real (like "economic causation"), then the dispute may be entirely verbal—a disagreement about the word "real" rather than the world. If I were shown that both sides agree on all the physical facts and merely disagree on whether to grant the label "causal power" to abstractions, I would have drawn the line between substantive and verbal dispute in the wrong place. Conversely, if it turns out that "computational properties" imply physical constraints that are not captured by low-level physics (e.g., topological constraints), then the Verbal/Crux distinction in Row 1 of the table would need to shift firmly to Crux.
