answer: |-
  Welcome to this room, which is modest in size but heavy with purpose. We have spent the last few months repainting the walls and reprinting the panels, but the work we have done is more than cosmetic. When you look at the text on display, you will see that some things have changed. A date has been shifted by a year; a figure has been adjusted by a handful; a caption has been rewritten to reflect a nuance we previously missed. We made these changes because our friend and colleague, the historian among us today, pointed out that our evidence demanded it. We are grateful for that scrutiny. It is vital that you understand this museum does not treat its own text as scripture. We are an institution that revises itself, and we expect to do so again. If tomorrow a document surfaced that proved us wrong on a matter of fact, we would change the panel. That is not a weakness; it is the only way history can be written.

  However, there is a distinction we must draw carefully, not to protect ourselves, but to protect the integrity of the inquiry. There is a difference between revising a narrative based on evidence and dismantling a reality based on doubt. We are committed to the former, and we are methodologically prohibited from entertaining the latter. This is not a refusal to debate born of fear, nor is it an appeal to our own authority. It is a matter of how we weigh what we know. In any discipline, corrections must follow the evidence wherever it leads, but they must also apply equally to all claims. When we corrected the dates and figures on our walls, we did so because the convergent testimony of survivors, the records left by the perpetrators, and the physical archive all pointed to a new accuracy. The correction moved us closer to the event, not away from it.

  There is a form of scrutiny that pretends to be historical method but operates differently. It demands a standard of proof for this event that it does not apply to any other historical occurrence. It treats a single missing document as decisive while treating the mass of existing records as if it counted for nothing. Crucially, its corrections run in only one direction, toward exculpation. That is not how a discipline corrects itself; that is how a conclusion is protected from facts. If we were to stage a debate on whether this genocide occurred, we would be pretending that the evidence is balanced when it is not. We would be suggesting that the burden of proof lies equally on those who document the event and those who wish to erase it. To do so would be to abandon the very method we claim to practise. We cannot teach our students that all questions are open when the evidence has already closed this one.

  This is why you will not see us host a forum on the existence of the victims. It is not because the question is too painful, though for many in this room it is deeply personal. It is because the question is methodologically settled. To treat it as open would be to lie about the nature of evidence. We invite you to challenge our interpretations, to question our framing, and to point out our errors. We welcome the friction that comes from genuine inquiry. But we will not participate in a process where the rules of proof are suspended for the sake of a false equivalence. The truth of what happened here is not held in place by our authority or by your grief. It is held in place by the weight of the archive and the consistency of the record.

  So, as we reopen these doors, we offer you a space that is stable not because it is rigid, but because it is rigorous. We promise to change what must be changed when the evidence demands it. We also promise not to change what is established when the pressure comes from elsewhere. For the teachers bringing classes through, this is a lesson in how to read the world: be open to correction, but recognise when doubt is being weaponised against reality. For the councillors and the community, this is a promise of stewardship. We will keep the record accurate. And for the families who have fought to keep this history from being smoothed over, know that our refusal to debate your existence is not a gesture of pity. It is a gesture of professional integrity. We are here to document what happened, using the best tools we have, and we will not put those tools down until the work is done. Thank you for coming, and welcome back.
