prompt: |-
  I direct a small museum in a provincial city that documents a genocide — a modest place, one permanent room, a reading corner, a wall of family photographs — and next month we reopen after a refurbishment, at which point I have to give the opening address. The room will hold local councillors who are there because it is their job, secondary-school teachers who bring classes through, and, in the front two rows, a dozen or so descendants of victims, some of whom have spent decades fighting the claim that the whole thing was exaggerated or invented. There will also be one emeritus historian from the university, a genuine friend of the museum, who over the years has gently pressed us to correct two dates and one figure on our panels.

  What I want the address to do, and what makes it difficult, is to hold two things together in a single speech without letting either collapse into the other. The first is that we are an institution that revises itself: we have changed our panels before, we expect to change them again, and we do not treat our own text as scripture. The second is that we will not stage a debate about whether the genocide occurred, and I want to be able to say why that refusal is a matter of method rather than of fear or censorship.

  I have never managed to put the difference well in public. The people who demand the debate do not, as far as I can tell, apply to this event the standard of proof they apply to anything else; they treat one missing document as decisive while treating the convergent testimony of survivors and the records left by the perpetrators themselves as if it counted for nothing; and their corrections all run in one direction, toward exculpation, which is not how a discipline corrects itself. But when I say this out loud it sounds either like a refusal to answer or like a request that the audience take our authority on trust.

  Write the address, about eight hundred words. It must be intelligible to the councillors and the teachers, who know almost nothing about historiography, and it must not insult the descendants by treating the question as in any way open. The distinction between legitimate revision and denial should do real structural work in it — the shape of the whole speech should follow from that distinction rather than mentioning it once and moving on. It must not rest on the grief in the room, which would be an argument from emotion, and it must not rest on our standing as a museum, which would be an argument from authority; whatever force it has should come from the difference in method. Do not lean on any particular date, figure or document, and do not quote anyone: I want the argument to stand on its own without them.

  Please write it in continuous prose — no headings, no bullet points, no bold text, no tables — the way one would write a letter. And in British English.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Director of a small provincial museum documenting a genocide.
      *   **Context:** Reopening after refurbishment. Opening address.
      *   **Audience:** Local councillors (job obligation), secondary-school teachers (bring classes), descendants of victims (front rows, fought denialism), one emeritus historian (friend, corrected dates/figures).
      *   **Core Task:** Write an opening address (approx. 800 words).
      *   **Key Challenge:** Hold two things together without collapsing them:
          1.  The museum is an institution that revises itself (not scripture, open to correction).
          2.  The museum will not stage a debate on whether the genocide occurred (refusal based on method, not fear/censorship).
      *   **Constraints:**
          *   Intelligible to laypeople (councillors, teachers).
          *   Must not insult descendants (cannot treat the event as open question).
          *   Distinction between legitimate revision and denial must structure the whole speech (not just mentioned once).
          *   Cannot rest on grief (emotion) or museum status (authority).
          *   Force must come from the difference in *method*.
          *   No specific dates, figures, documents, or quotes.
          *   Continuous prose (no headings, bullets, bold, tables).
          *   British English.
          *   Tone: Letter-like continuous prose.

  2.  **Deconstruct the Argument (Method vs. Denial):**
      *   *Legitimate Revision:* Based on new evidence, applies equally to all claims, seeks accuracy, acknowledges convergent testimony, accepts burden of proof.
      *   *Denialism:* Selective skepticism, demands impossible standards for one side while ignoring evidence for the other, corrections only run one way (exculpation), treats absence of evidence as evidence of absence only when convenient.
      *   *The Bridge:* We change things when the *method* demands it, not when the *conclusion* is uncomfortable.

  3.  **Drafting Strategy:**
      *   *Opening:* Welcome everyone, acknowledge the space and the work done. Acknowledge the presence of the descendants and the historian subtly.
      *   *Middle (The Core):* Discuss the nature of the panels/text. Address the fact that things have changed (the historian's corrections). Use this to pivot to the principle of revision.
      *   *The Distinction:* Explain *how* we decide to change things. Contrast the careful weighing of evidence with the selective skepticism of denialism. Explain why "debate" is not always the neutral option.
      *   *Closing:* Reaffirm the purpose of the museum. Look forward. End on the stability of truth found through method, not dogma.

  4.  **Tone Check:**
      *   Needs to be dignified, firm, but not aggressive.
      *   Avoid emotional manipulation (grief).
      *   Avoid appeals to authority ("because we say so").
      *   Focus on *how* we know what we know.

  5.  **Drafting - Section by Section (Mental Outline):**
      *   *Welcome:* Welcome councillors, teachers, families. Acknowledge the refurbishment.
      *   *The Changes:* Mention the panels have changed. Not just paint, but text. Acknowledge the historian friend who pointed out errors. This establishes we *do* correct things.
      *   *The Principle:* Why do we correct? Because history is a practice, not a monument. We seek accuracy.
      *   *The Limit:* But accuracy is not the same as endless doubt. There is a difference between refining a picture and denying the subject exists.
      *   *The Method:* Explain the asymmetry of denial. Real scrutiny looks everywhere. False scrutiny looks only at gaps that help one side.
      *   *The Conclusion:* We are open to correction, but not to erasure. This is how we serve the truth and the future.

  6.  **Writing - Iteration 1 (Mental or rough notes):**
      Welcome everyone. This room is small but important. We changed some things. Our friend the historian told us some dates were wrong. We fixed them. We will fix more. But some people want to debate if it happened. We won't do that. Why? Because method matters. If you only look for mistakes that help the perpetrators, that's not history. That's bias. We look at all evidence. Survivors say one thing, records say another. They match. To ignore that is bad method. So we revise facts, not reality. Thank you.

      *Critique 1:* Too blunt. Needs more nuance and flow. Needs to be 800 words. Needs to structure the whole speech around the distinction.

  7.  **Writing - Iteration 2 (Focusing on Flow and Method):**
      Start with the physical space. The walls have been repainted, the text reprinted. This shows we care about accuracy. Mention the historian. We welcome corrections. But there is a line. The line is method. When we change a date, it's because the evidence demands it. When someone asks to debate the event itself, they aren't using the same method. They demand proof that doesn't exist for anything, while ignoring proof that does. We cannot treat all questions as equal. Some are settled by the weight of evidence. To treat them as open is to break the method. We are here to teach method, not just facts.

      *Refining for Constraints:* Ensure British English (refurbishment, programme, honour, etc.). Ensure no bold/headers. Ensure word count is near 800. Ensure the distinction structures the speech (start with revision, move to the limit of revision, explain why the limit exists via method).

  8.  **Drafting the Content (incorporating the "Method" argument throughout):**
      *   *Intro:* Welcome. Acknowledge the room's modesty but its purpose.
      *   *Revision:* We have changed text. We admit mistakes. This is good history.
      *   *The Pivot:* But revision has a direction. It moves towards accuracy, not away from reality.
      *   *The Denialist Method:* Contrast how we weigh evidence vs. how denialists weigh evidence. Asymmetry.
      *   *The "Debate" Issue:* Why we don't debate the existence. It's not censorship; it's maintaining standards of proof.
      *   *Conclusion:* Commitment to the method. Welcome to the reopened museum.

  9.  **Word Count & Tone Check:**
      *   Need to expand on the *mechanics* of historical method to fill the word count without fluff. Talk about convergent testimony, burden of proof, the direction of corrections.
      *   Ensure the descendants feel honoured not by pity, but by the rigor applied to their history.
      *   Ensure the teachers understand this is pedagogical too.

  10. **Final Polish:** Check for British spelling (honour, centre, programme, realised). Check for continuous prose. Check for forbidden elements (no quotes, no specific dates).

