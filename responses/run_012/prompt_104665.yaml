prompt: |-
  Okay so I've been chewing on Dennett's careenium thing — the frictionless table covered in myriads of tiny magnetized marbles (sims, small interacting marbles) that bang into each other and clump up into bigger, stabler clumps (simmballs), and once you've got simmballs you can describe the whole mess as a game of soccer. Every time I bring this up someone says yeah but the simmball level is just a useful description, a real pattern at best, and all the actual pushing is done down at the sim level. I think thats wrong and I want you to argue the other side for me.

  Here's the twist I want you to run with. Imagine we bolt a little gadget onto the table — call it the coach — that literally cannot register individual sims. Its sensors only pick up simmball-level states: this clump is drifting left, that clump is about to collide, this clump is shaped like a goalie. And then, based on those simmball-level readings alone, it fires broad magnetic nudges that change which way the individual sims bounce, so the simmballs start playing better soccer. Input is purely simmball-level, output reaches all the way down to sims.

  Now argue, as hard as you can, that this makes the simmball level causally efficacious in its own right — not just a summary or a shorthand for what the sims are doing, but something that genuinely pushes the substrate around. Don't wriggle out with "well it depends what you mean by causation" or "it's all just sims at bottom"; take the strongest version of the claim that the higher level is doing real causal work and defend it. If you think the coach example is a cheat, say why and then argue the position anyway with whatever the best version of it is.

  Give it to me as exactly five numbered points, one or two sentences each, no intro and no closing summary.
