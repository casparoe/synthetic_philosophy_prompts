prompt: |-
  Hi — I need help with something and I'm not smart enough about it. My friend is about to sign off on her exit package from the startup she works at, and she asked me to tell her if she's being an idiot. I can't tell, and her reasoning is doing something I can't quite put my finger on.

  Here's the setup. She picks one of two structures. Option 1: $180k, guaranteed. Option 2: an 89% chance of $180k, a 10% chance of $900k, and a 1% chance of walking away with nothing. She's taking option 1. Her reason: she's not going to risk ending up with zero after all this, and the jump to $900k only happens one time in ten.

  Then she said, ok, but imagine the chunk that's the same in both — that 89% — was already settled and set aside. Whats left is an 11% shot at $180k versus a 10% shot at $900k, nothing otherwise. And in that version she'd take the $900k shot, definately, because there's no sure thing to give up.

  I said those are the same choice written two ways. She says no, they're completly different, because in the first one you either get the money or you don't. She also says the flip only happens because she doesn't know yet how that 89% part shakes out — if someone told her it had already gone against her, she'd obviously gamble, but that's not the situation she's actually in.

  My econ-101 reflex is that option 2 has higher expected value, so take it and stop overthinking, but she pointed out that nobody would ever buy insurance if that was the rule, and she's right about that.

  Is she being inconsistent, or am I missing something? And if she is, is it a real mistake or just a quirk of how the options get written up? She signs tomorrow, so — what should I tell her?
