          *   In Original Opt 1, risk of $0 is 0%. In Original Opt 2, risk of $0 is 1%.
          *   So the switch happens because going from 0% risk of ruin to 1% risk of ruin feels huge (Certainty Effect), whereas going from 89% risk of ruin to 90% risk of ruin feels negligible.
          *   This confirms the Allais Paradox.

  7.  **Final Polish:**
