      *   So, rejecting Option 2 because of the 1% risk of $0 is a valid risk-aversion move.
      *   *However*, her second claim (that she would take the risk if the 89% was "removed") contradicts her risk aversion. If she is truly risk-averse enough to avoid the 1% ruin in Option 1, she should also avoid the 90% ruin in the "framed" Option 2.
