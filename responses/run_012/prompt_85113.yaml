      *   **User's Intuition:** Econ 101 says Option 2 has higher Expected Value (EV). Friend says EV isn't everything (cites insurance).
      *   **The Conflict:** The friend claims the two ways of looking at it are "completely different" choices, while the user suspects they are the same choice framed differently (Allais Paradox territory).
