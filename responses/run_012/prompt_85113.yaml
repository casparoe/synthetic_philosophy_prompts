  3.  **Analyze the Friend's Reasoning (Behavioral Economics):**
      *   **Certainty Effect:** People overweight outcomes that are considered certain relative to outcomes that are merely probable. This is a core component of Prospect Theory (Kahneman & Tversky).
      *   **The "Framing" Argument:** The friend is describing the **Allais Paradox**.
          *   *Scenario A:* Choose between Certain $180k vs. Gamble (89% $180k, 10% $900k, 1% $0). Most people pick Certain.
          *   *Scenario B:* Choose between Gamble 1 (11% $180k, 89% $0) vs. Gamble 2 (10% $900k, 90% $0). *Wait, let me check the friend's framing.*
          *   Friend's Framing: "Imagine the 89% chunk... was already settled."
          *   If the 89% is removed from consideration (common consequence), we are left comparing the remaining probabilities.
          *   Option 1 remaining: 11% chance of $180k (since 100% - 89% = 11%).
          *   Option 2 remaining: 10% chance of $900k (and 1% chance of $0).
          *   So the reduced form is: 11% @ $180k vs. 10% @ $900k (with 89% $0 in both).
          *   Friend says in *this* case, she'd take the $900k shot.
      *   **Inconsistency:** Mathematically, these *are* the same choice. The 89% common outcome should cancel out (Independence Axiom of Expected Utility Theory). However, human psychology violates the Independence Axiom. This is the definition of the Allais Paradox.
      *   **Is she "wrong"?** Normatively (mathematically), yes, it's inconsistent. Descriptively (psychologically), it's very normal.
      *   **Is it a mistake?** It depends on her utility function. If the *pain* of getting $0 is infinitely worse than the *gain* of getting extra money, avoiding the 1% risk is rational *for her*, regardless of the framing. But her claim that the *framing changes the choice* is the inconsistency.

