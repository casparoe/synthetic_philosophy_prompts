answer: |-
  You are not missing anything, and your friend is not an idiot. She is experiencing a very famous, well-documented psychological phenomenon called the **Allais Paradox**.

  Here is the breakdown of what is happening, why she feels this way, and exactly what you should tell her before she signs.

  ### 1. The Math (You are right)
  Mathematically, these are the exact same choice, just framed differently. Your Econ-101 reflex is correct regarding Expected Value (EV).

  *   **Option 1:** 100% chance of $180k = **$180,000 EV**
  *   **Option 2:**
      *   89% of $180k = $160,200
      *   10% of $900k = $90,000
      *   1% of $0 = $0
      *   Total = **$250,200 EV**

  Option 2 is worth roughly **$70,000 more** in expected value. By choosing Option 1, she is effectively "paying" $70,000 of expected value to buy insurance against that 1% risk of getting nothing.

  ### 2. The Psychology (She is normal)
  She is right that EV isn't the only rule (her insurance point is valid). We care about *utility*, not just dollars. However, she is being inconsistent, and that inconsistency has a name.

  **The Certainty Effect:**
  Human brains place a disproportionately high value on moving from "99% likely" to "100% guaranteed."
  *   In **Frame 1**, Option 1 offers **0% risk of ruin**. Option 2 offers **1% risk of ruin**. To her brain, that jump from 0 to 1 feels massive. She clings to the certainty.
  *   In **Frame 2** (her "settled" scenario), she removes the 89% common chunk. Now she is comparing an 11% chance of $180k vs. a 10% chance of $900k. In this frame, *both* options carry a high risk of getting nothing (89% and 90% respectively). Because the "certainty" is gone, her brain stops protecting it and looks at the upside. She correctly sees that the $900k shot is better value.

  **The Contradiction:**
  If she truly believed the $900k shot was better when the certainty was removed, she should believe it is better when the certainty is present. The 89% chunk is mathematically irrelevant to the decision (this is called the *Independence Axiom*), but psychologically, it acts as an anchor.

  She is letting the *feeling* of safety override the *math* of safety, but only when the safety is framed as a "guarantee."

  ### 3. What to tell her
  Do not tell her she's bad at math. Tell her her brain is playing a trick on her, and give her a framework to make the decision based on her actual life, not the probabilities.

  **Say this:**
  > "You aren't being an idiot. This is a known psychological trick called the Allais Paradox. Your brain is overvaluing the word 'guaranteed' in Option 1.
  >
  > Here is the reality: Choosing Option 1 is the same as choosing Option 2, but immediately paying $70,000 to buy insurance against the 1% chance of failure.
  >
  > **The only question that matters is this:** If you take Option 2 and hit the 1% bad luck, do you end up ruined?
  > *   **If $0 means you can't pay rent or eat:** Take Option 1. The peace of mind is worth the $70k cost.
  > *   **If $0 is painful but survivable:** Take Option 2. You are essentially being offered a lottery ticket with a 10% win rate and a huge payout, for the 'price' of a 1% risk of zero. That is a good bet."

  ### 4. The "Sleep Test"
  Remind her that **regret** works both ways.
  *   If she takes Option 2 and gets $0, she will feel stupid for gambling.
  *   If she takes Option 1 and finds out later the company was fine (the 10% scenario), she will feel stupid for leaving $720k on the table ($900k - $180k).

  **Recommendation:**
  If she has an emergency fund or a partner with income, she should take **Option 2**. The Expected Value difference ($70k) is too large to ignore for a mere 1% risk, unless that 1% risk is truly catastrophic for her livelihood.

  If she signs Option 1, she should do it knowing she is paying a $70,000 premium for safety, not because the options are "different."
