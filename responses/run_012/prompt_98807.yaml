answer: |-
  **To:** Graduate Metaphysics Seminar
  **From:** [Your Name]
  **Subject:** Reconstruction of Leibniz on the Necessity of Origins

  **Introduction: The Anachronism and the Architecture**

  To ask Gottfried Wilhelm Leibniz (1646–1716) about sperm, eggs, or in vitro embryos is to invite a category error regarding biology, but not regarding metaphysics. While Leibniz lacked the microstructural biology of the modern synthesis, his metaphysics of substance is rigorously causal and genealogical. In reconstructing his response to the Kripkean thesis of the Necessity of Origins, we must rely on three pillars of his mature philosophy: the theory of the **Complete Individual Concept (CIC)**, the doctrine of **Compossibility** across possible worlds, and the **Identity of Indiscernibles**.

  My reconstruction suggests that while Leibniz would affirm the Kripkean verdict (you could not have come from different gametes), he would do so for reasons that render the modern thesis trivial. For Kripke, origin is a *special* essential property, anchoring the individual while leaving other properties contingent. For Leibniz, origin is merely one predicate among infinitely many, all of which are equally essential to the individual concept. Furthermore, Leibniz would likely challenge the coherence of the question itself, arguing that the notion of "transworld identity" presupposed by the seminar debate is, strictly speaking, unintelligible within his system.

  **I. The Verdict: Hyper-Essentialism vs. Selective Essentialism**

  If we present Leibniz with the case of a child conceived from specific gametes $G_1$ (or selected from embryo $E_1$), and ask, "Could this very individual have arisen from $G_2$?", his answer would be an unequivocal **no**.

  **The Reasoning:**
  This follows directly from the doctrine of the Complete Individual Concept. In the *Discourse on Metaphysics* (§13) and his correspondence with Arnauld, Leibniz argues that the concept of an individual substance contains *all* its predicates—past, present, and future. As he writes to Arnauld (1687), the concept of Alexander the Great contains not only that he is a king and a conqueror, but that he conquered Darius at a specific time and place.

  Extrapolating to the biological case: The predicate "arose from gametes $G_1$" is a true proposition about the individual. Therefore, it is contained in their CIC. To suppose the individual arose from $G_2$ is to suppose a subject with a different concept. By the **Identity of Indiscernibles**, if substance $A$ has the property "originating from $G_1$" and substance $B$ has the property "originating from $G_2$", $A$ and $B$ are numerically distinct. There is no "residue" of *you* that remains once the origin is swapped.

  **The Divergence:**
  Here lies the critical divergence from Kripke. Kripke argues that while origin is necessary, other properties (e.g., "becoming a philosopher," "being 6 feet tall") are contingent. He isolates origin as the *sine qua non* of identity.

  Leibniz, however, is a **hyper-essentialist**. In his system, *every* true predicate of a substance is essential to its concept *ex hypothesi* (given God's choice of this world). If you are a philosopher, "being a philosopher" is in your CIC just as much as "arising from $G_1$." If you had not become a philosopher, you would not be *you*; you would be a counterpart in a different possible world.

  Therefore, Leibniz agrees that you could not have had a different origin, but he would reject the implication that origin is *distinctively* essential. For Leibniz, the thesis "Origin is Essential" is no more significant than the thesis "Your Breakfast This Morning Was Essential." Both are equally constitutive of the individual concept. The modern debate treats origin as a unique modal anchor; Leibniz treats it as one thread in a seamless, necessary tapestry. The agreement in verdict is superficial because the modal landscape is fundamentally different: Kripke allows for intra-world contingency; Leibniz locates all contingency in the inter-world choice of the best.

  **II. The Well-Posedness of the Question: Transworld Identity**

  The second, perhaps more damaging, Leibnizian objection concerns the coherence of the question: "Could *that very person* have come from a different embryo?"

  **The Machinery:**
  Kripke's framework relies on **rigid designators** that pick out the same individual across possible worlds. We assume there is a "you" that exists in the actual world and in a counterfactual world $W_2$, and we check if the origin differs.

  Leibniz's machinery of **Possible Worlds** and **Compossibility** dissolves this assumption. For Leibniz, a possible world is a maximal set of compossible individual concepts. An individual concept is **world-bound**. As he suggests in the *Theodicy* and *On the Ultimate Origination of Things*, "Adam" exists only in the world where he sins. In a world where Adam does not sin, there is not *Adam* with different properties, but a different individual concept that resembles Adam.

  **The Prediction:**
  Leibniz would argue that the question is ill-posed because it assumes **transworld identity**. He would say:
  > "You ask if *this* individual could have had a different origin. But 'this individual' is defined by the totality of his history, including his origin. If you posit a different origin, you are not positing a different possibility for *him*; you are positing a different individual concept entirely, belonging to a different possible world-series."

  For Leibniz, we do not travel across worlds. God compares world A (containing You-with-Origin-1) with World B (containing Counterpart-with-Origin-2). Since World B contains a different individual concept, it is false to say *you* exist there. Thus, the question "Could I have had a different origin?" translates to "Is there a possible world containing a concept sufficiently similar to mine but with a different origin?" The answer is yes, but the entity in that world is not *you*.

  This undermines the Kripkean project, which seeks to discover necessary truths *about us*. For Leibniz, necessary truths are about concepts, and "us" are merely the actualized instances of those concepts. The "necessity" of origin is not a constraint on how *we* could have been born; it is a logical truth that a concept cannot differ from itself.

  **III. Extrapolation and Underdetermination**

  In constructing this reconstruction, I have extrapolated from Leibniz's logical metaphysics to biological particulars. There are points where the textual record leaves us underdetermined, which must be flagged for seminar honesty.

  1.  **The Status of Biological Causation:** Leibniz speaks frequently of genealogy (e.g., the "chain of Adam's descendants"). However, he views biological generation as the unfolding of a pre-formed organic machine (*The System of New Hypothesis*, 1695). It is an extrapolation, though a safe one, to equate "sperm and egg" with the Leibnizian "law of the series" that governs a substance's temporal unfolding. If the gametes are merely the phenomenal appearance of the metaphysical beginning, Leibniz might argue the *metaphysical* origin is the true essential, and the biological gametes are contingent signs of that origin. However, given his commitment to the phenomenal world being well-founded, he would likely treat the biological origin as a necessary expression of the metaphysical one.
  2.  **Contingency vs. Necessity:** Leibniz insists that truths about individuals are **contingent**, even though they are contained in the concept. He distinguishes this from the **necessary** truths of geometry. The predicate "arose from $G_1$" is in your concept, but its negation does not imply a contradiction *in itself*, only a contradiction *given God's choice of this world*. Kripkean necessity is usually understood as metaphysical necessity (true in all accessible worlds). Leibniz's necessity is **hypothetical**.
      *   *Kripke:* "You necessarily came from $G_1$." (True in all worlds where you exist).
      *   *Leibniz:* "You came from $G_1$." (True in this world). "Could you have come from $G_2$?" (Only if you were a different individual in a different world).
      *   *Underdetermination:* It is unclear if Leibniz would grant the Kripkean formulation "Necessary in all worlds where you exist" any sense, since for Leibniz, you *do not exist* in other worlds. This suggests the Kripkean thesis is literally unintelligible to Leibniz, not just false.

  **Conclusion**

  If we put the Necessity of Origins to Leibniz, he would nod in agreement but dismiss the excitement. He would affirm that you could not have come from a different embryo, because "you" are a complete concept that includes that embryo. However, he would insist that you also could not have worn a different shirt today, or chosen a different seminar, without ceasing to be "you."

  The Kripkean thesis attempts to carve out a small island of necessity in a sea of contingency. Leibniz's metaphysics presents us with an ocean of necessity, punctuated only by God's free choice of which world to actualize. Consequently, Leibniz would likely view the modern debate as trading on a confused notion of transworld identity. For Leibniz, the question is not whether origin is essential, but whether the notion of "the same individual" can survive the removal of *any* predicate, biological or otherwise. His answer is that it cannot. The agreement is verbal; the metaphysics is incommensurable.
