      *   Mirrors fail because Hand A does not create Hand B; Light A reflects Light B. It is a regress of the *same* state.
      *   Escher passes because Hand A draws Hand B which draws Hand A. There is mutual *creation* (within the frame).
      *   *This kills the Dictionary too.* A dictionary maps words to words, but it does not generate *meaning*. The meaning is outside (in the mind). It is a mirror of usage, not a generator of sense.

  **Clause 2: Normative Sovereignty (The Agency Test)**
  *   **Definition:** The authority or logic required to sustain the loop must originate *within* the loop's defined boundaries, not be borrowed from a higher normative layer.
  *   **Forcing Case:** **Constitution vs. Agency.**
      *   Constitution passes because the document *is* the source of the amendment power. There is no higher law cited within the system.
      *   Agency fails because its power to bind itself is granted by a Legislature. The loop is closed operationally, but open normatively. It is a subordinate loop, not a sovereign one.
      *   *This addresses Priya.* Priya argues "There is always something outside (Legislature/Artist/Hardware)." This clause concedes the physical outside (Hardware/Artist) but draws the line at the *normative* outside. The Compiler's hardware is physical substrate (irrelevant). The Agency's Legislature is normative authority (fatal).

  **Clause 3: Semantic Stability (The Gödel Test)**
  *   **Definition:** The loop must resolve to a stable structural truth or state, not a semantic crash.
  *   **Forcing Case:** **Gödel vs. The Liar Sentence.**
      *   Gödel passes because "This statement is unprovable" resolves to a stable truth value (True, but unprovable within the system).
      *   The Liar Sentence ("This sentence is false") fails because it oscillates or crashes. It has no truth value to grab onto.

