answer: |-
  This is a sophisticated impasse, and your intuition that the disagreement is structural rather than merely empirical is correct. The debate has stalled because the two sides are operating with different **criteria of individuation** and different **standards of ontological commitment**.

  Here is a diagnosis of the structure of the disagreement, an assessment of whether genuine contact is possible, and a proposal for what would count as progress.

  ### 1. Diagnosis: Three Layers of Conflict

  The dispute is not a single argument but a tangle of three distinct layers. The class is likely stalling because arguments made at one layer are being answered by counter-arguments at a different layer.

  **Layer A: The Metaphysical Claim (Ontology)**
  *   **Computationalist:** "The brain *is* a computer." This is treated as a fact about the world, independent of observers. There is a fact of the matter about which algorithm is running.
  *   **Critic:** "Implementation is observer-relative." The claim that a physical system implements a specific computation depends on an external mapping choice. Without a privileged mapping, the claim is empty (pancomputationalism).
  *   **The Clash:** The Computationalist is making an ontological claim; the Critic is making a semantic/logical point about underdetermination.

  **Layer B: The Explanatory Claim (Methodology)**
  *   **Computationalist:** "Positing representations and algorithms explains *how* cognition works." The value is in the predictive and mechanistic power of the model.
  *   **Critic:** "Dynamics and embodiment explain the same data without the baggage of representation." The value is in parsimony and fidelity to the physical reality of the system.
  *   **The Clash:** This is a debate about explanatory virtue. However, the Computationalist often defends this by retreating to Layer A (it's not just useful, it's *true*), while the Critic attacks Layer A to undermine Layer B.

  **Layer C: The Individuation Claim (The Two-Maps Case)**
  *   **The Problem:** How do we distinguish the "real" computation from a "gerrymandered" one?
  *   **Computationalist:** "Causal structure constrains the mapping." The mapping must respect the causal topology of the brain.
  *   **Critic:** "Causal structure is compatible with multiple computational descriptions." (This is the Two-Maps Case).
  *   **The Clash:** This is the bottleneck. The Computationalist needs a principle of **individuation** that rules out the trivial map without appealing to "explanatory interest" (which concedes the Critic's point that the distinction is pragmatic, not ontological).

  ### 2. Is this a Verbal Dispute?

  It is partially verbal, but not merely so. If it were purely verbal, you could resolve it by stipulating: "Let's define 'computation' as 'causally constrained symbol manipulation'."

  However, the dispute runs deeper because the **Critic denies that causal constraints are sufficient to individuate computation.** The Two-Maps case is designed to show that even with causal constraints, multiple formal descriptions can fit the physical transitions. Therefore, the dispute is not just about the definition of "computation," but about **realism vs. instrumentalism** regarding computational descriptions.

  *   **Computationalists are Realists:** They believe there is a fact of the matter about which computation is being performed.
  *   **Critics are Instrumentalists (about computation):** They believe computational descriptions are tools for prediction, not mirrors of nature.

  As long as one side demands ontological grounding and the other offers pragmatic utility, they will talk past each other.

  ### 3. Assessment: Can They Be Brought Into Genuine Contact?

  Currently, they are not in genuine contact. The Computationalist is asking, "What is the mechanism?" and the Critic is answering, "Your description of the mechanism is arbitrary."

  To bring them into contact, the Computationalist must abandon the strong ontological claim ("The brain *is* a computer in a mind-independent sense") and adopt a constrained instrumentalism ("The brain is best modeled as a computer under specific constraints"). Alternatively, the Critic must acknowledge that not all mappings are *explanatorily* equal, even if they are formally valid.

  **The Debate is not Ill-Posed, but the Central Question is.**
  The question "Is the brain a computer?" is a trap. It invites a binary yes/no answer to a question that is actually about **degrees of freedom in modeling**.
  *   If the answer is "Yes," the Critic asks "Which computation?"
  *   If the answer is "No," the Computationalist asks "Then how do you explain systematicity and compositionality?"

  ### 4. Paths to Progress

  To break the stall, the seminar needs to shift the terrain. Here are four specific moves that would count as progress, ranked from most feasible to most radical.

  **A. A Distinction: Implementation vs. Interpretation**
  Progress would be made if the class distinguishes between:
  1.  **Weak Implementation:** Any physical system can be mapped to a formal system (The Triviality Objection holds here).
  2.  **Strong Implementation:** The physical system's causal structure *mirrors* the formal structure's transition rules in a way that supports counterfactuals (e.g., "If input X had occurred, state Y would have followed").
  *   *Progress Condition:* The Computationalist must argue that the "trivial" map in the Two-Maps case fails to support the right *counterfactuals*, even if it fits the actual history. If the Critic accepts that counterfactual support constrains the mapping, the triviality objection loses force.

  **B. A Change in Question: From "Is it?" to "When is it?"**
  Shift the question from "Is the brain a computer?" to "**Under what conditions is the computational vocabulary causally explanatory?**"
  *   This acknowledges the Critic's point (computation is a description) but retains the Computationalist's goal (explaining mechanism).
  *   *Progress Condition:* Both sides agree to look for **boundary conditions**. For example, perhaps low-level motor control is dynamical, but high-level planning is computational. If they can agree on a hybrid architecture, the "brain is a computer" claim becomes "parts of the brain are best modeled computationally."

  **C. A Formal Result: Constraints on Mapping**
  The Computationalist needs to propose a formal constraint on the mapping function that rules out the "trivial" map in the Two-Maps case without appealing to human interest.
  *   *Example:* The mapping must be **local** (nearby physical states map to nearby computational states) or **composable**.
  *   *Progress Condition:* If the Computationalist can demonstrate that the "cognitive" map satisfies a structural constraint that the "trivial" map violates, the claim becomes substantive. If they cannot, the Critic wins the triviality point.

  **D. A New Experiment: Divergent Predictions**
  This is the hardest but most decisive path. Currently, both dynamical and computational models can often be fitted to the same behavioral data.
  *   *Progress Condition:* An experiment where a computational model predicts a specific deficit (e.g., a specific type of error in processing) that a dynamical model predicts should *not* occur (or vice versa).
  *   *Reality Check:* This is difficult because dynamical systems can often be constructed to mimic computational outputs. However, looking at **time-course data** (reaction times, neural oscillations) often favors dynamical accounts, while looking at **systematicity** (ability to recombine concepts) often favors computational accounts. Acknowledging this split is progress.

  ### 5. Recommendation for the Seminar

  The debate is stalling because the Computationalists are defending a **Metaphysical Thesis** (Realism) using **Methodological Arguments** (Explanatory Power), while the Critics are attacking the Metaphysics to undermine the Methodology.

  **To move forward, I suggest the following intervention:**

  1.  **Concede the Triviality Point:** The Computationalists should concede that *abstractly*, any system can be described computationally. This disarms the "empty claim" objection.
  2.  **Pivot to Causal Explanation:** The claim should be reframed: "The brain is a computer" means "The causal structure of the brain is isomorphic to a symbol-manipulating system in a way that makes the symbols causally relevant."
  3.  **Test the Two-Maps Case:** Ask the class to specify the "trivial" map in the thought experiment. Usually, the trivial map requires a lookup table that is as complex as the system itself or changes over time in an ad hoc way. The "cognitive" map is usually more **compressible** or **generalizable**.
  4.  **Accept Pluralism:** Conclude that "computation" and "dynamics" may be compatible descriptions at different levels of abstraction, rather than rival ontologies.

  **Verdict:** The debate is not ill-posed, but the framing is exhausted. Progress requires abandoning the quest for a single "fact of the matter" about whether the brain *is* a computer, and instead investigating the **constraints that make a computational description causally potent** rather than merely descriptively possible. If the class can shift from "What is the brain?" to "What does the computational description allow us to do that the dynamical description does not (and vice versa)?", the impasse will break.
