          *   Computationalists: Mapping must be discovered/natural, not gerrymandered; distinction between description and mechanism.
          *   Critics: "Discovery" presupposes the right level of description (explanatory interest vs. fact).
          *   Thought Experiment: "Two-maps case" (one system, two mappings, no fact of the matter).
      *   **User's Hypothesis:** Impasse might be verbal, explanatory standards, hidden empirical, or talking past each other.
      *   **Goal:** A diagnosis of the *structure* of the disagreement, not a verdict on who is right. What counts as progress? Is the debate ill-posed?
      *   **Constraint:** No citations or reading lists. Focus on structure and honest assessment.

  2.  **Deconstruct the Dispute:**
      *   *The Core Claim:* "The brain is a computer."
      *   *The Attack:* "Implementation is trivial/unconstrained." (Putnam/Searle style arguments, though I won't name them per constraints).
      *   *The Defense:* "Constraints exist (causal structure, naturalness)."
      *   *The Counter-Defense:* "Constraints are pragmatic/explanatory, not ontological."

  3.  **Evaluate the User's Hypotheses:**
      *   *Verbal Dispute?* Partly. They are using "computation" differently. One means "formal symbol manipulation implemented causally," the other means "any input-output mapping." But it goes deeper than just definitions.
      *   *Explanatory Standards?* Yes. Computationalists want *mechanistic* explanation (how is it done?). Critics want *dynamic* explanation (how does it evolve in time/environment?).
      *   *Hidden Empirical?* Not really. You can't scan the brain to find "the algorithm" if the definition of algorithm is contested.
      *   *Talking Past Each Other?* Highly likely. One side is doing ontology (what *is* it?), the other is doing methodology (what *works* to explain?).

  4.  **Develop the Diagnosis (The Structure):**
      *   I need to identify the specific layers where they are clashing.
      *   *Layer 1: Ontology vs. Pragmatics.* Computationalists treat computation as a natural kind (ontological). Critics treat it as a descriptive tool (pragmatic).
      *   *Layer 2: Individuation.* How do we count computations? Computationalists say causal structure individuates them. Critics say causal structure underdetermines them (Two-maps case).
      *   *Layer 3: Explanatory Power.* Computationalists argue computation predicts behavior. Critics argue dynamics predicts behavior *without* the overhead of representation.

  5.  **Address the "Two-Maps Case":**
      *   This is the crux. It highlights the underdetermination of computation by physics.
      *   Computationalist response usually involves "causal powers" or "counterfactual support."
      *   Critic response: Causal powers are also describable dynamically.
      *   *Diagnosis:* This shows the dispute is about *Individuation Conditions*.

  6.  **Determine Paths to Progress:**
      *   *Distinction:* Separate "Computation as Ontology" from "Computation as Methodology."
      *   *Formal Result:* Unlikely to solve the philosophical impasse, but constraint theories (e.g., semantic information, causal topology) could help.
      *   *New Experiment:* Hard, because both can fit the data. Needs to be a "crucial experiment" where computational and dynamical models diverge *in principle*, not just in fit.
      *   *Change in Question:* Shift from "Is it a computer?" to "When is the computational vocabulary productive?"

  7.  **Drafting the Response (Iterative refinement):**

