      *   *The Three Layers:*
          1.  **The Implementation Relation:** Is it objective or observer-relative? (The Triviality Objection).
          2.  **Individuation:** What makes *this* computation the one being run? (The Two-Maps Case).
          3.  **Explanatory Virtue:** Does positing representations add value or noise?
      *   *Assessment of "Genuine Contact":* They are currently talking past each other because one side demands ontological grounding while the other offers pragmatic utility.
      *   *Paths to Progress:*
