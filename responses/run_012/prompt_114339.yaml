  *(Self-Correction on "Two-Maps"):* I need to be careful not to solve the Two-Maps case, but to explain *why* it stalls the debate. It stalls because it attacks the *uniqueness* of the computational description. If two maps work, why prefer the cognitive one? Computationalist: "Because it explains cognition." Critic: "Circular." This is the key loop to highlight.

