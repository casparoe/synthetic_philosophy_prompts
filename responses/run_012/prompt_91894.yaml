  Ravi says **Not a Mistake**.

  Here is the rule he is running, why the other candidates fail, and how to prove it.

  ### The Rule: "The Rational Exit vs. The Zombie Project"
  Ravi isn't just checking for the Sunk Cost Fallacy. If he were, the Dollar Auction would be a "Mistake" (they were already over the $1 value). He isn't just checking for Ignorance, either. If he were, the Founder case wouldn't matter (the founder knew the pilot failed).

  Ravi's actual rule is: **Is the decision to continue a mathematically valid attempt to minimize loss in a live trap, or is it emotional stubbornness in a dead project?**

  *   **Dead Project (Mistake):** The future value is known to be zero or negative. Continuing guarantees *more* loss with no chance of recovery.
      *   *DOT:* Models say nobody will use it. (Zero value).
      *   *Pharma:* Flat results. (Zero probability of drug success).
      *   *Landlord:* Block is empty. (Zero revenue potential).
  *   **Live Trap/Pivot (Not a Mistake):** The future value is uncertain, and stopping *guarantees* the total loss of sunk costs, while continuing offers a non-zero probability of recouping value or reducing the net loss.
      *   *Founder:* Roadmap sharper. (Higher probability of future value).
      *   *Dollar Auction:* Stopping locks in a $2 loss for nothing. Bidding buys a *shot* at the $1, which could reduce the net loss (e.g., winning at $2.10 is a $1.10 loss, which is better than a $2.00 loss).
      *   *Aunt:* Stopping locks in a $900 loss for nothing. Bidding buys a *shot* at the camera. If she wins immediately, her loss drops from $900 to ~$260. As long as there is a chance the opponents fold, the expected value of continuing is higher than stopping.

  ### Why Other Rules Fail
  *   **The "Sunk Cost Reasoning" Rule:** If Ravi judged based on the *actor's stated reason*, the Aunt is a "Mistake." She says, "I'm in too deep," which matches the DOT and Landlord ("Already spent," "Sunk savings"). But Ravi overrides the bidders' panic in the Dollar Auction with his own math ("Next bid buys you a shot"). He judges the *situation*, not the excuse.
  *   **The "Ignorance" Rule:** If Ravi judged based on *knowledge*, the Aunt is a "Not a Mistake" (she didn't know the rules), matching the Dollar Auction. But this doesn't explain the Founder (who knew the pilot failed). Ignorance is a mitigating factor, not the primary rule.
  *   **The "Value Limit" Rule:** If Ravi judged based on *whether costs exceeded value*, the Dollar Auction would be a "Mistake" (bids were >$1). Since it wasn't, exceeding the value limit doesn't automatically trigger a "Mistake" verdict if loss mitigation is possible.

  ### The Closest Analogue: The Dollar Auction
  The Aunt's case is structurally identical to the Dollar Auction. Both are **war-of-attrition traps** where the second-highest bidder loses everything.
  *   **Dollar Auction:** Bidders at $2.00/$2.05 for a $1 bill. Ravi says **Keep Bidding**.
