answer: |-
  Your friend is making a category mistake. They are treating an epistemic relation as an ontological property. They want "independence" to be a feature of the number $\pi$, like its irrationality. But irrationality is invariant under description; independence is not. The $10^{100}$-th digit of $\pi$ is not "like a fair coin" in any absolute sense. It is a fixed integer, 0 through 9. To call it "independent" is to make a claim about the *distance* between that digit and the rest of your knowledge base, measured in a specific currency of computation.

  The only defensible version of the Presumption of Independence is this: **Independence is incompressibility relative to a fixed description language.**

  When we say two mathematical facts $A$ and $B$ are independent, we do not mean there is no logical connection between them. In mathematics, everything is connected to everything else. We mean that there is no *short* certificate of that connection in the language $\mathcal{L}$ we are currently using. If the shortest proof linking $A$ to $B$ in $\mathcal{L}$ is longer than the cost of just measuring $B$ directly, then for a reasoner bounded by $\mathcal{L}$, $A$ and $B$ are independent.

  This makes the principle inherently relative. If you expand $\mathcal{L}$ to include a new constant or function, dependencies that were invisible become glaring. If you restrict $\mathcal{L}$, structures dissolve into noise. The "fact" of independence is not in the object; it is in the gap between the object's structure and the reasoner's vocabulary.

  ### The Toy Case: The Paley Graph

  To see why the objectivist view fails, consider the **Paley Graph** $G_p$ for a prime $p \equiv 1 \pmod 4$. The vertices are elements of the finite field $\mathbb{F}_p$. Two vertices $u, v$ are connected by an edge if and only if their difference $u - v$ is a quadratic residue modulo $p$.

  Now, ask a heuristic question: **"What is the size of the largest clique in $G_p$?"**

  **Description 1: The Statistical View (Quasi-Randomness)**
  In the language of probabilistic combinatorics, $G_p$ is described as a "quasi-random graph." It satisfies all the standard statistical properties of a random graph $G(p, 1/2)$. The edges appear uncorrelated; the eigenvalue distribution matches the Wigner semicircle law.
  *   **Heuristic Argument:** Since $G_p$ behaves like a random graph $G(p, 1/2)$, we should apply the standard heuristic for random graphs. The clique number $\omega(G)$ of a random graph is concentrated around $2 \log_2 p$.
  *   **Credence:** High probability that $\omega(G_p) \approx 2 \log_2 p$.

  **Description 2: The Algebraic View (Quadratic Residues)**
  In the language of number theory, $G_p$ is described as a "Quadratic Residue Graph." The edges are determined by the multiplicative structure of $\mathbb{F}_p$.
  *   **Heuristic Argument:** Algebraic structures often admit larger substructures than random ones because of hidden symmetries. We know from algebraic bounds (like the Hoffman bound) that the clique number is at most $\sqrt{p}$. While $2 \log_2 p$ is much smaller than $\sqrt{p}$, the algebraic description suggests the possibility of "rigged" configurations that statistical tests miss. In fact, for specific primes, constructions exist that push cliques larger than the random heuristic predicts.
  *   **Credence:** Significant uncertainty. The algebraic structure *allows* for cliques up to $\sqrt{p}$, so assigning a tight probability mass around $2 \log_2 p$ is unjustified without deeper number-theoretic analysis.

  **The Conflict:**
  Here is the same object. Under Description 1, the edges are "independent" (quasi-random), and the credence for a large clique is vanishingly small. Under Description 2, the edges are "dependent" (algebraically linked), and the credence for a large clique is higher (or at least, the variance is massive).

  If independence were a fact about the object, the Paley graph would have to *be* independent or *be* dependent. It cannot be both. The reality is that "independence" is a measure of how well the graph compresses into the reasoner's current language. To the statistician, it is incompressible noise (independent). To the number theorist, it is a short formula (dependent). The heuristic argument yields different probabilities not because the graph changed, but because the *description language* changed.

  ### The Survival of the Heuristic Programme

  So, does this relativity destroy the heuristic arguments programme? Does it collapse into a trivial "we are uncertain because we are bounded"?

  **No, but it changes the job description.**

  If the principle were ontological, the job of the heuristic arguer would be to *discover* the true independence structure of the universe. Since the principle is linguistic/epistemic, the job is to **select the optimal description language.**

  The programme survives because not all description languages are equal. While independence is relative to $\mathcal{L}$, we can rank languages by their **universality** and **compression power**.
  1.  **Compression:** A heuristic argument is "better" if it relies on a description that compresses the object more efficiently. In the Paley case, the algebraic description is shorter (define $p$, define quadratic residue) than the statistical description (list all edge probabilities). Therefore, the algebraic heuristic is *objectively superior* for a reasoner capable of understanding it, because it captures more structure.
  2.  **Stability:** A good heuristic should be stable under small extensions of the language. The statistical heuristic for the Paley graph is fragile; add "quadratic residue" to your language, and the heuristic breaks. The algebraic heuristic is robust.

  The programme does not collapse into mere boundedness. It becomes a theory of **logical depth**. We are not just saying "I can't compute the answer." We are saying "Given my current vocabulary, the shortest explanation for this data treats these variables as independent."

  This preserves a normative standard. You can still be *wrong* in your heuristic argument. You are wrong if you ignore a shorter description that was available to you. If you treat the digits of $\pi$ as independent coin flips while ignoring the existence of the Bailey–Borwein–Plouffe formula, you are not just "bounded"; you are negligent. You failed to utilize the description language that renders the dependence visible.

  ### Conclusion

  Tell your friend this: The presumption of independence is not a claim that the universe is rolling dice. It is a claim that **you have run out of short words.**

  When we say the $10^{100}$-th digit of $\pi$ is independent of the $10^{100}-1$-th digit, we are saying: "In the language of standard analysis and computation available to us, there is no shorter way to predict the next digit than to compute the whole thing." That is a fact about *us*, not $\pi$. If we discover a new algorithm that spigots digits independently, the "independence" vanishes instantly.

  The work of mathematics is not justifying credences about fixed facts. It is the work of **description engineering**. We expand our languages to turn "independent" noise into "dependent" structure. The heuristic arguments programme survives not as a way to guess truths about objects, but as a way to manage the complexity of our own understanding. One heuristic is better than another not because it matches the "true randomness" of the object, but because it leverages a richer, more compressive description of the world.
