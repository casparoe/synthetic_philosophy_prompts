answer: |-
  ### The target
  The theory must explain the prudential value of death for the deceased, distinct from the moral wrongness of killing or the grief of survivors. It must clarify whether "bad for you" requires a subject to experience the badness or if it denotes a comparative deficit in the value of a life.

  ### The requirements
  1. The theory must locate badness in the painless peak-life case without relying on experienced suffering. (Non-negotiable)
  2. The theory must make the badness of death contingent on the quality of the foregone future, not the event itself. (Non-negotiable)
  3. The theory must specify when the harm occurs or justify abandoning the requirement that harms be datable events. (Non-negotiable)
  4. The theory must explain or debunk the asymmetry between mourning death and ignoring pre-birth non-existence. (Non-negotiable)
  5. The theory must decide whether posthumous reputation damage harms the dead subject or merely alters the life's narrative. (Non-negotiable)
  6. The theory must distinguish death from non-conception to avoid implying a duty to conceive every possible child. (Non-negotiable)
  7. The theory must provide a metric for comparing the magnitude of loss across different deaths. (Non-negotiable)
  8. The theory must determine whether longevity is an intrinsic good or purely instrumental to contentment. (Non-negotiable)

  ### Tensions
  The central tension lies between the requirement to locate badness without a subject (Requirements 1 and 3) and the intuitive definition of harm requiring a recipient. If you satisfy the deprivation intuition (Requirement 2) by comparing actual life to possible life, you violate the existence condition required by the Epicurean view. Furthermore, satisfying the asymmetry requirement (4) while maintaining the deprivation account (2) is notoriously difficult; if death is bad because of lost good time, pre-birth non-existence also loses good time, yet we do not mourn it. Resolving this often requires abandoning the objective comparativism needed for Requirement 7 (measure of loss) or accepting that harm is merely a perspective-dependent feeling, which undermines Requirement 8 (objective medical benefit). Finally, distinguishing death from non-conception (Requirement 6) while maintaining that non-existence is the harm (Requirement 1) risks arbitrary metaphysical distinctions about identity. A theory that satisfies the timing constraint usually fails the deprivation measure, and vice versa. Additionally, Requirement 5 creates friction: if harm is a state of a person, posthumous reputation cannot matter, but if it is a fact about a life, the subject requirement dissolves entirely. Consequently, no plausible theory satisfies all non-negotiable items without sacrificing either metaphysical rigor or common intuition.

  ### The sharpest requirement
  Requirement 3 is the sharpest blade. It demands specifying when harm occurs without a subject, or abandoning datability. This excludes the Epicurean view, which cannot account for badness in the painless peak-life case. It threatens Deprivation accounts, positing harms when the victim does not exist. Any theory retaining the strict notion that harms must happen to someone at some time fails here. To pass, a theory must redefine harm as a comparative fact about worlds rather than a state of an individual, fundamentally altering the concept of prudential value.

  ### The contenders
  The Epicurean view satisfies the subject requirement but fails Requirements 1, 2, and 7, unable to explain why peak-life death is worse than dementia death. The Deprivation Account satisfies Requirements 1, 2, and 7 by comparing actual versus possible lives, but struggles with Requirement 3 (timing) and Requirement 4 (asymmetry), requiring ad hoc fixes to distinguish birth from death. A third option, Subsequentism, locates harm after death when the person would have been alive, satisfying Requirement 3 partially but failing Requirement 5 regarding reputation if no subjects survive. All contenders fail Requirement 6 without additional metaphysical baggage about identity. Ultimately, the Deprivation Account scores highest on practical implications (Requirement 8) but lowest on metaphysical coherence, while Epicureanism is metaphysically truly clean but practically useless for medicine. No single theory clears the list without even significant cost. Consequently, medical decisions regarding life extension lack a firm philosophical foundation without further compromise.
