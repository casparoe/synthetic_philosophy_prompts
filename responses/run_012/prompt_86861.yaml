answer: |-
  **Premise:** We all accept there is a real, mind-independent difference between lawlike generalizations (e.g., uranium spheres) and accidental ones (e.g., coins in pockets).

  **Node 1:** Are the fundamental facts of the world exhausted by the local distribution of qualitative properties (the Humean Mosaic), or must something modal be added on top?
  *   **Exhausted by Mosaic** → Go to Node 2.
  *   **Modal Added** → Go to Node 5.

  **Node 2:** Do quantum entanglement and non-separability facts break the local mosaic picture required for standard Humeanism?
  *   **Yes (Breaks Mosaic)** → Go to Node 3.
  *   **No (Preserves Mosaic)** → Go to Node 4.

  **Node 3:** Are law-statements truth-apt descriptions of reality, or merely useful instruments?
  *   **Not Truth-Apt (Instruments)** → **Leaf: Deflationism**
  *   **Truth-Apt (Descriptions)** → **Leaf: Pragmatist Patchwork**

  **Node 4:** Does the best systematization of the mosaic require positing objective chances, or are deterministic summaries sufficient?
  *   **Requires Chances** → **Leaf: Best-System Account (Standard)**
  *   **No Chances Needed** → **Leaf: Best-System Account (No-Chances)**

  **Node 5:** Is it coherent to say laws 'govern' or 'produce' the events they describe?
  *   **Yes (Governing Coherent)** → Go to Node 6.
  *   **No (Governing Incoherent)** → **Leaf: Laws as Stable Necessities (Lange)**

  **Node 6:** Do natural properties possess their causal powers essentially (dispositionalism)?
  *   **Yes (Essential Powers)** → **Leaf: Dispositional Essentialism**
  *   **No (Categorical Properties)** → Go to Node 7.

  **Node 7:** Are laws ontologically primitive entities over and above properties and their relations?
  *   **Yes (Primitive)** → **Leaf: Laws as Primitive/Governing (Maudlin)**
  *   **No (Relations)** → **Leaf: Laws as Relations Between Universals (Armstrong)**

  ***

  **Leaves and Awkward Commitments:**

  1.  **Deflationism:** Must explain the accepted law/accident difference without invoking laws at all.
  2.  **Pragmatist Patchwork:** Laws become user-relative tools rather than objective features of the world.
  3.  **Best-System (Standard):** Laws supervene on facts they are supposed to explain (explanatory circularity).
  4.  **Best-System (No-Chances):** Struggles to account for quantum mechanics without genuine objective chance.
  5.  **Lange (Stable Necessities):** Requires a hierarchy of meta-laws without a clear bottom floor.
  6.  **Dispositional Essentialism:** Properties cannot exist without their manifestations (threatens contingency).
  7.  **Maudlin (Primitive):** Laws are brute facts that govern without a mechanism (occult power).
  8.  **Armstrong (Universals):** The 'inference problem' (why does a relation between universals necessitate regularities?).

  ***

  **Tree Diagnostics:**

  **Indistinguishable Leaves:**
  *   **Best-System (Standard)** and **Best-System (No-Chances)**.
  *   *Reason:* If objective chances are defined solely by their role in the best system, the distinction collapses into a verbal dispute about whether probabilities are "real" or just system-features.

  **Unoccupied Combinations:**
  *   **Mosaic = Yes + Governing = Coherent.**
  *   *Status:* **Incoherent.**
  *   *Reason:* Humeanism (Mosaic = Yes) denies necessary connections between distinct existences, which is the prerequisite for any coherent notion of "governing" or production. You cannot have a bare mosaic that also pushes particles around.
