answer: |-
  You have identified a genuine gap in the standard "quartet" of knowledge sources (perception, testimony, inference, memory). The phenomenon you describe is well-recognized in philosophy, particularly in phenomenology and the philosophy of mind, though it often lacks a single, common English noun.

  The most precise established concept for this is **Intuitive Fulfillment** (from the phenomenological tradition, specifically Edmund Husserl), closely allied with **Aspect Perception** (from the later Wittgenstein).

  Here is the breakdown of the concept, how it applies to your two cases, and where its boundaries lie.

  ### 1. The Name and Structure

  **The Technical Term:** *Intuitive Fulfillment* (or simply *Fulfillment*).
  **The Phenomenological Term:** *Seeing-As* (or *Aspect Perception*).

  **The Structure:**
  In both traditions, knowledge in this category is understood as a **synthesis** of two distinct elements that are incomplete on their own:
  1.  **The Empty Intention (Signitive Act):** This is your description ("small crow with white patch") or your memory of a feeling. It points toward an object or state but lacks "flesh." It is a meaning without a referent *in presence*.
  2.  **The Intuition (Intuitive Act):** This is the raw perception (seeing the bird, seeing the friend's face). It presents the object but, without the intention, lacks specific *identification* or *meaning*.

  **The Move:**
  The "move" you are isolating is the moment these two synthesize. The empty intention is **fulfilled** by the intuition. The knowledge does not exist in the description (too abstract) nor in the perception (too raw); it exists in the **coincidence** of the two.

  ### 2. Analysis of Your Cases

  **Case 1: The Bird (Deferred Fulfillment)**
  *   **Fits the concept?** Yes, perfectly.
  *   **Why it's not Testimony:** Testimony usually transfers justification immediately upon hearing. Here, the testimony created a *search image* (an empty intention) that remained unverified and semantically hollow until the encounter.
  *   **Why it's not Inference:** Inference requires a middle term (a rule). You did not think, "All birds with white patches are X; this bird has a white patch; therefore..." You recognized the *gestalt*. The likeness was felt, not calculated.
  *   **Why it's not Perception:** Pure perception would be "I see a bird." Your knowledge included "I see *that* bird (the one described)." The concept was imported by the prior description.
  *   **Specific Nuance:** In phenomenology, this is often called **Deferred Ostension**. The "pointing" happened months ago via language, and was only completed by your eyes today.

  **Case 2: The Friend (Empathic Fulfillment)**
  *   **Fits the concept?** Yes, but with a shift in the source of the "Intention."
  *   **The Structure:**
      *   *Empty Intention:* Your memory of your own similar state (or a general concept of "sadness" derived from it).
      *   *Intuition:* The perception of the friend's face/behavior.
      *   *Fulfillment:* The recognition "He is sad."
  *   **The Extension:** This falls under the same boundary because it relies on the **synthesis of a stored schema with a present intuition**. It is not inference (you don't reason from behavior to mind); it is not pure perception (you perceive behavior, not minds); it is not testimony (they didn't tell you).
  *   **The Name:** In this specific context, it is often called **Simulation** (in Theory of Mind literature) or **Einfühlung** (Empathy/Feeling-Into, in phenomenology). However, structurally, it is the same *fulfillment* move: a prior internal state provides the "mold" that the present perception "fills."

  ### 3. The Boundaries: What It Is and Is Not

  To integrate this into your taxonomy, you need to know where the edges are.

  **Boundary 1: Vs. Inference (The Rule Boundary)**
  *   **Inference:** Requires a conscious or subconscious *proposition* acting as a bridge (e.g., "Smoke implies fire"). It is discursive.
  *   **Your Phenomenon:** Requires a *pattern* or *schema*. It is immediate. If you find yourself weighing evidence ("Well, it *could* be a magpie, but the patch is wrong..."), you have crossed into inference. If the recognition "dawns" on you all at once, it is Fulfillment/Seeing-As.

  **Boundary 2: Vs. Testimony (The Justification Boundary)**
  *   **Testimony:** The justification lies in the *speaker's* authority.
  *   **Your Phenomenon:** The justification lies in the *fit* between the description and the world. If the bird turned out to be a different species that looked similar, your knowledge would be defeated not because the speaker lied, but because the *fulfillment failed*. You are trusting your own recognition, not just their word.

  **Boundary 3: Vs. Perception (The Conceptual Boundary)**
  *   **Perception:** "There is a black shape."
  *   **Your Phenomenon:** "There is the *crow*."
  *   **The Edge:** If you see the bird but don't recall the description, it's pure perception. If you recall the description but never see the bird, it's imagination/testimony. The knowledge *only* exists in the overlap. This is sometimes called **Concept-Laden Perception**.

  **Boundary 4: Vs. Memory (The Temporal Boundary)**
  *   **Memory:** Retrieving a past state.
  *   **Your Phenomenon:** Using a past state to identify a *present* state.
  *   **The Edge:** In Case 2, if you simply recall your own sadness without looking at the friend, that is memory. If you look at the friend and the memory is activated *to explain the friend*, that is Fulfillment.

  ### 4. Proposed Taxonomy Entry

  If you wish to name this entry in your private taxonomy, the most accurate label is **Recognition** (specifically **Recognitional Knowledge**), but defined strictly as **The Synthesis of Intention and Intuition.**

  However, if you want a term that highlights the *source* of the knowledge (since your other categories are sources):
  *   **Option A:** **Fulfillment.** (Captures the structural mechanism).
  *   **Option B:** **Aspect Perception.** (Captures the phenomenological experience).
  *   **Option C:** **Deferred Identification.** (Captures the temporal gap in Case 1).

  **Recommendation:**
  I suggest labeling this category **Recognitional Fulfillment**.

  *   **Definition:** Knowledge acquired when a prior intentional state (description, memory, schema) is matched and validated by a present perceptual intuition, resulting in immediate identification without discursive inference.
  *   **Includes:** Identifying objects from descriptions, recognizing faces, understanding emotions via empathy, applying learned concepts to new instances.
  *   **Excludes:** Deductive reasoning, blind acceptance of testimony, raw sensation without identification, pure recall.

  ### 5. Why This Matters for Your Taxonomy

  You noted that you keep this taxonomy "mostly as a check on lumping distinct things together." This category is vital because it is the primary engine of **learning**.

  *   **Inference** manipulates existing knowledge.
  *   **Testimony** imports existing knowledge.
  *   **Perception** acquires raw data.
  *   **Fulfillment** is how raw data becomes *concepts*.

  It is the moment the word "crow" stops being a sound and starts being a tool for seeing. Without this category, your taxonomy describes how we move knowledge around, but not how we ground it in the world. Case 1 and Case 2 are indeed the same shape: they are both the moment a map touches the territory.
