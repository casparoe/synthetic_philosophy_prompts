answer: |-
  Elara sat at the bench, the magnifying loupe pressed to her eye, reading the history of a brass gear in the micro-abrasions along its teeth. She could tell how many decades it had turned by the depth of the grooves, and she knew which way the mechanism had spun by the direction of the metal burrs. Her competence lay in reading the wear, understanding that fresh scratches sat atop old rust, and that oil always flowed out from the pivot, never back in.

  It was the night shift at the restoration shop, the quiet hours when the building's own decay seemed to pause, though the coffee on her desk was inevitably cooling toward room temperature. Dust motes hung in the beam of her lamp, settling slowly onto the black rubber mat, accumulating in layers like sedimentary rock. She worked by the rule that things fell apart, surfaces oxidized, and heat dissipated, using these certainties to guide her hands toward order.

  She nudged the vial of chronometer oil with her elbow. It hit the workbench and shattered, a dark starburst spreading rapidly across the linoleum mat. She reached for the rag, expecting the familiar task of containment, the futile effort of pushing the liquid back into a bottle.

  She stopped. The edges of the stain were retreating. The liquid wasn't evaporating; it was gathering, pulling inward against the spread, bead by bead reclaiming the center where the glass had broken. It moved without wind, without tilt, simply reversing the statistical drift that governed every spill she had ever cleaned.

  She knew the laws allowed it, a rare fluctuation in the noise, but never in her life had she seen the random walk stumble backward so deliberately. It was not magic, merely a probability so small it should not have occurred in the lifetime of the universe, yet there it was, contracting on her workbench.

  She looked down at her left hand, where a papercut from earlier was bleeding. The wound was closed, the skin smooth, though the sting remained fresh in her nerves. She touched the spot, feeling the intact flesh, wondering if the blood was yet to come or had already been wiped away.

  Elara opened the shop logbook to record the breakage, but the pen hovered over the page. The ink seemed heavy, a permanent mark in a world that was suddenly fluid. She needed to anchor the event, to declare that this had happened, that the glass had broken and the oil had gathered.

  The previous entry, written yesterday, described the mainspring she was currently holding as snapped. She held a coiled spring. She remembered the snap, the sharp sound of metal fatiguing under tension. But if the disorder was growing backward here, then her memory of the snap might be an anticipation of a fracture she hadn't yet suffered.

  She tried to tighten a screw, but the resistance felt like she was forcing order into a system that wanted to be disordered, or perhaps vice versa. The torque wrench slipped, not because of her grip, but because the metal seemed to soften under the pressure, accepting the turn too easily.

  The distinction between causing a change and witnessing its reversal began to dissolve, leaving her unsure if her hand moved the tool or the tool pulled her hand. She was no longer certain if she was repairing the clock or if the clock was repairing itself through her.

  She closed the logbook and took a fresh sheet of paper. She wrote a note instead: *The oil gathered at 2:00 AM.*, pressing hard to ensure the ink bonded with the fiber. She needed a record that existed outside the fluctuating gradient of her own neural pathways.

  She stared at the words, waiting to see if she would remember writing them, or if the memory would arrive only after the ink appeared. The act of writing felt less like recording a past event and more like issuing a command to the immediate future.

  The dust motes in the light beam seemed to hang, then drift up, returning to the air vent from which they had fallen. Elara put the pen down and folded her hands, letting the uncertainty settle over her like a blanket.

  She realized she could no longer trust that her memory-forming was aligned with the direction the world was running. The past and the future were no longer separated by the growth of disorder, but only by the fragility of her own observation.

  She waited to see if the oil would spill again, or if she would remember cleaning it up, anchoring herself to a direction she could no longer feel.
