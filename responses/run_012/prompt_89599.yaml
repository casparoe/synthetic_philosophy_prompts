answer: |-
  **The dispute in plain terms**

  Moore argues in *Principia Ethica* that the highest intrinsic goods are specific states of consciousness: namely, the pleasure of human intercourse and the enjoyment of beautiful objects. This suggests value resides primarily within the subject's experience. The objection arises that this reduces relationships and art to mere instruments for generating pleasant mental states. If value lies fundamentally in my consciousness, I value my friend only insofar as they affect my mind, not for their own sake. This looks like a problematic form of egoism. Proponents of Moore suggest his doctrine of "organic unities" rescues him. This doctrine holds that a whole's value isn't just the sum of its parts; thus, the friend's existence could be a necessary constituent of the valuable conscious whole, granting them significance. However, critics argue this fails because if the valuable whole is still defined as a "state of consciousness," the external friend remains subordinate to the internal experience. The dispute hinges on whether organic unity can grant independent value to external objects within a framework that fundamentally prioritizes consciousness.

  **The strongest case against Moore**

  The objection strikes at the heart of Moore's identification of the good with states of consciousness. If the intrinsic value lies exclusively within the subject's mind, then the external world becomes merely causal machinery. Consider friendship. We intuitively believe that part of what makes friendship valuable is the reality of the other person—their independent existence, their reciprocal feelings, and their actual well-being. On Moore's description, however, the value is located in the "pleasure of human intercourse" as a conscious state. This implies that if one could induce an identical state of consciousness via deception or hallucination, the value would remain intact. If I believe my friend loves me, but they actually despise me, Moore's framework suggests the conscious state of believing they love me holds the value. The actual friend is reduced to a trigger.

  This creates a deeply counterintuitive result. It renders the distinction between reality and illusion morally irrelevant regarding intrinsic value. We value truth in relationships; we care that the affection is real, not just felt. By locating the good strictly within consciousness, Moore severs the essential link between the valuer and the valued object. The friend is not valued *for their own sake*, but for their capacity to produce a specific mental texture in the agent. This is not merely egoistic; it is solipsistic. It fails to capture the outward-directed nature of love and appreciation. When I admire a beautiful landscape, I value the landscape's existence, not just my neural firing patterns. If the landscape were destroyed but I was fed electrodes stimulating the same enjoyment, Moore's view implies no loss of intrinsic value. This collapses the distinction between appreciating beauty and consuming a drug. The objection holds because Moore's ontology cannot accommodate the intuition that value often depends on facts outside the mind. Furthermore, it makes morality oddly private. If the best things are my states of consciousness, my duty is to maximize these states. This ignores the independent moral status of the friend. If sacrificing the friend's happiness increases my conscious enjoyment of them, Moore's logic struggles to explain why that is wrong, provided the total conscious good increases. The external object is swallowed by the internal experience.

  **The Moorean defense**

  The Moorean defense relies on the principle of organic unities, which states that the value of a whole is not necessarily the sum of the values of its parts. Moore does not claim the valuable thing is "pleasure" in isolation; he claims it is "the pleasure of human intercourse" or "the enjoyment of beautiful objects." These are complex wholes. The defense argues that the external object (the friend, the landscape) is a necessary constituent of this whole. You cannot have the specific valuable state of "enjoyment of beauty" without there being beauty to enjoy. If the object is removed, you do not have the same whole with less value; you have a entirely different whole (e.g., "delusional enjoyment") which may have little or no value.

  Charitably interpreted, Moore is distinguishing between the *feeling* of enjoyment and the *object* of enjoyment. The intrinsic value attaches to the conjunction. Therefore, the friend's existence is not merely instrumental; it is constitutive. Without the friend's actual affection, the "pleasure of human intercourse" does not exist. This attempts to secure the reality of the external world within the value proposition. To succeed, this defense must show that the "state of consciousness" is not a sealed internal container but a relational fact that includes the external relata. It must demonstrate that the value is sensitive to the properties of the object, not just the subject's reaction. If the friend's actual virtue is part of the whole, then valuing the whole entails valuing the friend's virtue. The defense needs to prove that Moore's "consciousness" is broad enough to encompass the intentional object as a real component, not just a mental representation. If Moore can establish that the whole is "consciousness-of-X" where X must exist for the whole to exist, then the charge of egoism fails. The value would depend on the world, not just the mind. This moves Moore away from pure hedonism toward a view where reality matters. The success of this reply depends on whether "state of consciousness" can coherently include external existence as a necessary condition without contradicting the internalist definition of value. Moore wants to say the whole is intrinsic, but if the whole requires external existence, is it still just a state of consciousness? The defense must navigate this tension, arguing that the intentional object is part of the conscious state's identity.

  **My verdict**

  Ultimately, the organic unity defense fails to save Moore from the objection. While it successfully complicates the picture, it does not change the fundamental location of value. Moore explicitly defines the valuable whole as a "state of consciousness." Even if the external friend is a necessary condition for this state, the value is still predicated on the existence of the conscious experience. The problem is not whether the friend is a part of the whole, but whether the whole itself is the right kind of thing to bear ultimate value. By restricting the locus of goodness to consciousness, Moore inevitably makes the external world subordinate.

  The organic unity argument shows that a fake friend yields a different whole, but it does not explain why the real whole is better *because* the friend is real, rather than because the consciousness is richer. If the value is intrinsic to the conscious whole, then the external reality is only valuable derivatively, as a prerequisite for the mental state. This fails to capture the intuition that we value friends independently of our experience of them. We care about their suffering even if we never know about it. Moore's framework cannot account for this, as value requires consciousness. Therefore, the defense is cosmetic. It acknowledges the friend's role but refuses to grant them independent moral status. The verdict is that Moore's commitment to consciousness as the sole vessel of intrinsic value is incompatible with valuing external objects for their own sake. The organic unity doctrine saves the complexity of the value, but not its objectivity. Moore wants to have it both ways: value is in consciousness, but value depends on reality. But if value is in consciousness, reality only matters instrumentally. The objection stands: Moore's ethics remains fundamentally centered on the subject's experience, leaving the friend as a prop in the agent's mental drama.
