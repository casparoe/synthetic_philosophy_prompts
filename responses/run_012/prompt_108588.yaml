          6.  **Format:** One continuous piece of prose, no headings, no bullet points, no numbered lists, no bold, no tables. Like a long email to a colleague.
          7.  **Language:** British English.
          8.  **Constraint:** Do not give a literature survey, do not cite anything.

  2.  **Deconstruct the Ethics of Care (in SRE terms):**
      *   *Relational View:* Selves constituted by relations. In SRE terms, a service isn't defined by its codebase alone but by its dependencies and dependents. Its identity is its topology.
      *   *Moral Attention to Particulars:* Not applying a generic rule (SLA) but attending to *this* specific incident/context.
      *   *Sequence:* Noticing (monitoring/alerting), Responsibility (owning the ticket/page), Competence (executing the runbook effectively), Reception (confirming the user/system is actually fixed/satisfied).
      *   *Dependency/Asymmetry:* The carer is also cared for. In SRE, the platform team cares for product teams, but relies on infra team. Chain of custody.

  3.  **Drafting - Section 1: Translation:**
      *   Need to weave the care ethics concepts into the SRE dialect without losing the core meaning.
      *   *Relational:* A service is its connections. If you cut the edges, the node is dead code.
      *   *Particularity:* An alert isn't just a class of error; it's *this* instance affecting *these* users.
      *   *Sequence:* Monitoring -> Paging -> Remediation -> Verification.
      *   *Asymmetry:* The SRE is dependent on the infra below them.

  4.  **Drafting - Section 2: Verdict and Residue:**
