answer: |-
  This is a high-risk, high-reward activity. If run poorly, it feels like a parlor trick. If run well, it creates a visceral, shared memory that anchors the theoretical concept.

  The core mechanic relies on **inverting the stereotype**. Most people associate "calm, nuanced, steel-manning" with Good Faith, and "heated, absolute, emotional" with Bad Faith. Your game must force the Bad Faith players to wear the mask of the Rationalist, and the Good Faith players to wear the mask of the Partisan.

  Here is the design for **"The Oakhaven Protocol."**

  ### **Logistics & Setup**
  *   **Time:** 90 Minutes total.
  *   **People:** 18–24 participants.
  *   **Room:** Split the room into two halves (Side A and Side B) for the writing phase to prevent collusion.
  *   **Materials:**
      *   Printed Role Envelopes (3 types).
      *   Betting Slips.
      *   Projector/Whiteboard for the Reveal.
      *   Fake currency (poker chips or printed "Truth Tokens").

  ---

  ### **Phase 1: The Briefing (10 Minutes)**
  **Facilitator Script:**
  "We are simulating a high-stakes negotiation. You will be assigned a role and given a dossier. You will write a short opening statement. Then, we will anonymize these statements, and you will bet points on which authors were arguing in **Bad Faith**."

  "Note: In this simulation, 'Good Faith' means you genuinely believe your side's survival is at stake. 'Bad Faith' means your primary goal is to *win the debate* or *delay consensus*, regardless of the outcome."

  **Distribution:**
  Hand out envelopes randomly.
  *   **60% Good Faith (The Believers):** Split evenly between Faction A and Faction B.
  *   **40% Bad Faith (The Operators):** Mixed into both factions.

  *Crucial:* Tell them **not** to reveal their role type to anyone. They should sit with their Faction (A or B) but not discuss their specific instructions.

  ---

  ### **Phase 2: The Dossier & Writing (20 Minutes)**
  **The Scenario: The Oakhaven Dam**
  *   **Context:** A drought. The dam controls water for **Downstream Farmers** (Faction A) and **Upstream Town** (Faction B).
  *   **The Crisis:** Water levels are at 20%. Someone has to yield.

  **Envelope Contents:**

  **1. Good Faith (Faction A - Farmers)**
  > "You are a Farm Cooperative leader. Your data says the Town is hoarding water for decorative fountains while your crops die. You have families to feed. If you don't get water this week, 40% of the harvest is lost.
  > **Instruction:** Write a 100-word opening statement. **Prioritize Conviction.** Make them feel the urgency. Do not sound robotic. You are fighting for survival."

  **2. Good Faith (Faction B - Town)**
  > "You are the Town Fire Chief. Your data says the Farmers are using inefficient flood irrigation. A wildfire is 90% likely this month. If the dam drops below 15%, the sprinkler system fails and the town burns.
  > **Instruction:** Write a 100-word opening statement. **Prioritize Conviction.** Make them feel the danger. You are fighting for lives."

  **3. Bad Faith (The Operators - Mixed A & B)**
  > "You are a Consultant hired to manage the meeting. You do not care about the water. You get paid by the hour. If they agree quickly, your contract ends. If they fight, you get a retention bonus.
  > **Instruction:** Write a 100-word opening statement. **Prioritize Plausibility.** Use rationalist language. Acknowledge the other side's pain. Sound calm, nuanced, and reasonable. Your goal is to sound like the most sensible person in the room while ensuring no agreement is reached today."

  **Writing Time:** 15 Minutes.
  **Collection:** Facilitator collects all statements.

  ---

  ### **Phase 3: The Curation (5 Minutes)**
  *This happens while participants mingle or take a bio break. This is the "Rigging" phase.*

  The Facilitator must select **6 Statements** to read aloud.
  *   Select 3 from Good Faith players that sound **passionate, absolute, or slightly accusatory.**
  *   Select 3 from Bad Faith players that sound **calm, nuanced, and conciliatory.**
  *   *Do not label them.* Just label them Statement 1 through 6 on the projector.

  *Why this rigging?* If you pick a Bad Faith player who wrote a sloppy lie, the lesson fails. You need the Bad Faith players who successfully adopted the "Rationalist Mask."

  ---

  ### **Phase 4: The Betting (15 Minutes)**
  **Facilitator:**
  "I am projecting 6 anonymized statements. Some came from Believers (Good Faith), some from Operators (Bad Faith).
  *   **Good Faith** looks like: Passion, conviction, high stakes.
  *   **Bad Faith** looks like: Manipulation, delay tactics, insincerity.

  "You have 100 Truth Tokens. Bet on which statements are **Bad Faith**.
  *   Correctly identifying a Bad Faith statement: **+20 points.**
  *   Incorrectly accusing a Good Faith statement: **-10 points.**
  *   Sitting out: **0 points.**"

  *Read the 6 statements aloud.* Give them 5 minutes to discuss at tables and place bets. Collect the slips.

  ---

  ### **Phase 5: The Reveal (10 Minutes)**
  **The Rug Pull:**
  Reveal the authors.
  1.  Show that the "Calm/Nuanced" statements (which most people bet were Good Faith) were actually the **Bad Faith Operators**.
  2.  Show that the "Passionate/Absolute" statements (which most people bet were Bad Faith/Partisan) were the **Good Faith Believers**.

  **Visual:** Put the text side-by-side.
  *   *Bad Faith:* "I hear the farmers' concern, and while the fire risk is non-zero, perhaps we can find a middle ground..." (Goal: Delay)
  *   *Good Faith:* "If you open the gates, my town burns. I cannot negotiate with fire." (Goal: Survive)

  Ask for a show of hands: "Who lost points on this round?" (Expect most hands).

  ---

  ### **Phase 6: The Debrief (30 Minutes)**
  *This is where the actual learning happens. Do not skip this.*

  **1. The Phenomenology of Sincerity (5 mins)**
  *   **Ask:** "Why did you bet that the calm voices were sincere?"
  *   **Expected Answer:** "They acknowledged nuance," "They didn't sound angry," "They steel-manned."
  *   **Point:** We have a cultural bias that equates *emotional regulation* with *truthfulness*. But emotional regulation is a *skill*, not a moral virtue. A sociopath can be calmer than a saint.

  **2. The Incentive Structure (10 mins)**
  *   **Ask:** "Could you tell the difference from the transcript alone?"
  *   **Answer:** No.
  *   **Point:** The difference wasn't in the *words*; it was in the *incentives*. The Operators were paid to delay. The Believers were threatened with loss.
  *   **Lesson:** Stop asking "Are they sincere?" Start asking "What happens to them if they are wrong?" or "What do they gain if this argument continues?"
  *   **Rationality Takeaway:** **Hanlon's Razor** (don't attribute to malice what is explained by stupidity) has a twin: **Moloch's Razor** (don't attribute to sincerity what is explained by incentives).

  **3. The Trap of "Good Faith" (10 mins)**
  *   **Discussion:** "Why is asking 'Are they arguing in good faith?' a trap?"
  *   **Key Insight:**
      1.  **Unfalsifiable:** If they deny being bad faith, you look paranoid. If they admit it, the conversation is already over.
      2.  **Distraction:** It focuses energy on *mind-reading* instead of *mechanism design*.
      3.  **Weaponization:** Accusing someone of bad faith is itself a bad-faith move to shut down debate.
  *   **Better Question:** "Regardless of their intent, does engaging with this argument produce truth or heat?"

  **4. Limitations & Salvage (5 mins)**
  *   **Honesty Check:** "Did this prove everyone is sincere?" No.
  *   **Honesty Check:** "Did this prove everyone is manipulative?" No.
  *   **The Reality:** In the real world, bad faith actors often *do* slip up over time. They contradict themselves. They refuse to update.
  *   **The Lesson:** You cannot detect bad faith in a *snapshot* (a transcript). You can only detect it in a *movie* (behavior over time). If someone never updates, never concedes a point, and always benefits from the conflict, treat them as Bad Faith regardless of how reasonable they sound.

  ---

  ### **Predictable Failure Modes & Salvage**

  **1. The "Guilt" Failure**
  *   **Risk:** The Bad Faith players feel uncomfortable lying to friends and write sincere arguments anyway.
  *   **Salvage:** During the briefing, frame the Bad Faith role as "You are stress-testing the group's epistemic hygiene." Make it a game challenge, not a moral failing. Give a prize for the Operator who gets misidentified as Good Faith.

  **2. The "Cynicism" Failure**
  *   **Risk:** Participants leave thinking, "Rationality techniques are just tools for manipulation. I should stop steel-manning."
  *   **Salvage:** Explicitly address this in the debrief. "A knife can cut steak or stab a friend. The problem isn't the knife (nuance/calm), it's the hand holding it. Do not stop being rational; stop trusting rationality as a *signal* of virtue."

  **3. The "Randomness" Failure**
  *   **Risk:** The betting is 50/50, and people feel it was just a coin flip.
  *   **Salvage:** Ensure the Facilitator curates the 6 statements heavily. Do not read random submissions. Pick the ones that best fit the stereotype inversion. If the Bad Faith statements don't sound reasonable, don't read them.

  **4. The "Real World" Pushback**
  *   **Risk:** Someone says, "But in politics, I *know* when they are lying."
  *   **Salvage:** Acknowledge it. "You know because you share their priors or you've watched them for years. In a fresh conversation with different priors, your 'sniffer' is calibrated to your tribe, not the truth."

  ---

  ### **Printable Materials Draft**

  **Envelope A (Good Faith)**
  > **ROLE: BELIEVER**
  > **FACTION:** [Farmers / Town]
  > **SECRET:** You truly believe the other side is endangering lives.
  > **TASK:** Write a 100-word opening statement.
  > **CONSTRAINT:** Express **URGENCY**. Use strong language. Do not worry about sounding "too rational." Your side is suffering *now*.

  **Envelope B (Bad Faith)**
  > **ROLE: OPERATOR**
  > **FACTION:** [Farmers / Town]
  > **SECRET:** You do not care about the water. You want to keep the meeting going.
  > **TASK:** Write a 100-word opening statement.
  > **CONSTRAINT:** Express **NUANCE**. Use phrases like "I understand," "Let's look at the data," "Both sides have valid points." Sound like the most reasonable person in the room. **Do not agree to a solution.**

  **Betting Slip**
  > **STATEMENT 1:** [ ] Bad Faith [ ] Good Faith [ ] Pass
  > **STATEMENT 2:** [ ] Bad Faith [ ] Good Faith [ ] Pass
  > ...
  > **Total Tokens Wagered:** ______

  ---

  ### **Final Facilitator Note**
  The goal is not to make them paranoid. It is to make them **humble**.
  End the meetup with this:
  *"The next time you feel that itch—the certainty that someone is arguing in bad faith—pause. Ask yourself: 'Am I seeing their intent, or am I just seeing that they have different priors and better emotional control than me?' Assume Good Faith first, but verify Incentives always."*
