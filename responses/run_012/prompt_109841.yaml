prompt: |-
  i never studied philosophy or econ, i just argue about this stuff with freinds. heres what i want to get straight. everyone says honoring sunk costs is a fallacy -- what you've already spent is gone, only what happens from here counts. but every time i try to apply that clean rule something leaks. my uncle stayed 11 years in a band that never made money, and the years he'd put in were, he said, the reason to keep going. my friend quit a PhD after six years and everyone called it brave. and someone told me a company digging a tunnel should ignore what it's already spent -- but surely the fact they've dug 200m tells them something about the rock ahead they couldn't have known at the start, and that seems like a real reason, not a fallacy. also if you always quit the moment something stops being fun you never get good at anything that takes years, so being the kind of person who finishes seems to matter somewhere in here.

  what i want isn't an answer, it's the list of what any decent theory of this has to do to count as a theory. which cases it has to get right, which distinctions it must not collapse (a taste for finishing vs. a reason to finish? evidence the past gives you about the future vs. the past mattering in itself? a one-off choice vs. a rule you've already committed to living by? the individual vs. a committee where every member has already put in their own time?), and what it has to say about the word irrational -- is that one thing or several, since someone can be mistaken about the facts, or weak-willed, or just plain inconsistent. for each requirement, give me the case or consideration that forces it, and say which are non-negotiable and which are just things one camp likes. then tell me which requirements can't all be met at once, because i suspect at least two pull against each other, and which single requirement does the most damage to the simple "only the future counts" line. skip the names of schools of thought, i wont know them -- just the list, and then two or three lines on how the simple rule holds up against it.
