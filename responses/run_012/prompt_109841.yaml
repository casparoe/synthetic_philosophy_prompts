answer: |-
  Here is the list of requirements for a theory that claims to explain when the past matters and when it does not.

  ### 1. The Requirements

  **A. The Information Requirement**
  *   **The Case:** The tunnel diggers. They have spent money, but they have also learned about the rock.
  *   **The Demand:** The theory must separate *cost* from *data*. If past effort reveals facts about future difficulty, ignoring the past is ignoring evidence.
  *   **Status:** **Non-negotiable.** Any theory that treats past effort purely as money lost, rather than information gained, is factually blind.

  **B. The Character Requirement**
  *   **The Case:** Your uncle's band / "The kind of person who finishes."
  *   **The Demand:** The theory must account for the value of self-conception. If being "a finisher" is a trait you want to own, the past investment is the raw material of that trait. Abandoning the project destroys the trait.
  *   **Status:** **Camp Preference.** Economic theories usually reject this (preferences should be about outcomes, not identity). Human/ethical theories demand it.

  **C. The Rule-Following Requirement**
  *   **The Case:** Learning a hard skill (quitting when it stops being fun).
  *   **The Demand:** The theory must distinguish between making the best choice *now* and following a rule that makes you successful *over time*. If you optimize every single moment, you will quit whenever pain spikes, and you will never master anything.
  *   **Status:** **Non-negotiable.** A theory that cannot explain why binding yourself to a rule is sometimes superior to choosing freely in the moment is logically incomplete.

  **D. The Stakeholder Requirement**
  *   **The Case:** The committee where every member has put in time.
  *   **The Demand:** The theory must handle multiple agents. If I quit, I waste *my* time, but I also waste *your* time. My "sunk cost" might be irrelevant to me, but my "sunk cost" combined with yours creates a collective obligation.
  *   **Status:** **Camp Preference.** Individualist theories ignore this; collectivist theories require it.

  ### 2. Distinctions The Theory Must Not Collapse

  1.  **Evidence vs. Value:** It must not treat "the past tells me the future is hard" (Tunnel) the same as "the past makes this project valuable to me" (Band). One is a fact about the world; the other is a fact about your soul.
  2.  **Act vs. Rule:** It must not treat "Should I quit today?" the same as "Should I be a person who quits?" You might answer "Yes" to the first and "No" to the second.
  3.  **Internal vs. External:** It must not treat "I wasted my money" the same as "We wasted the company's money." Guilt and obligation function differently than personal loss.

  ### 3. The Word "Irrational"

  A decent theory must split "irrational" into three distinct failures, or it will confuse the diagnosis:
  1.  **Calculation Error:** You think the future is bright, but the math says it's dark. (You are mistaken about facts).
  2.  **Weakness of Will:** You know the math, you know you should quit, but you feel too much shame to stop. (You are mastered by emotion).
  3.  **Value Inconsistency:** You claim to value "efficiency," but you act to value "loyalty." (You are lying about what you want, or your wants are conflicting).

  ### 4. The Conflicts (What Can't Be Met At Once)

  **The Conflict:** You cannot satisfy **The Character Requirement** and **The Information Requirement** simultaneously if they point in opposite directions.
  *   **Why:** If the tunnel data says "stop" (Information), but your identity says "I am a digger who finishes" (Character), you must violate one to satisfy the other. A theory that says "Always follow the data" kills character. A theory that says "Always honor your identity" invites disaster.
  *   **The Trade-off:** You have to choose whether the theory describes *how to maximize wealth* (Data wins) or *how to live a coherent life* (Character wins). They are not the same game.

  ### 5. The Single Most Damaging Requirement

  **The Character Requirement** does the most damage to the simple "only the future counts" line.

  **Why:** The Information Requirement can actually be absorbed by the simple rule (you *are* looking at the future, just with better data). But the Character Requirement insists that the past investment *itself* creates a new asset (your integrity/identity) that exists only if you continue. If you quit, you don't just lose future money; you actively destroy a current asset (your self-trust) that was built by the past. This makes the past a tangible, current resource, which breaks the "past is gone" axiom completely.

  ***

  The simple "only the future counts" rule survives only if you define "future" to include your future reputation with yourself, but even then, it struggles to explain why the *amount* of past suffering specifically increases the value of finishing, rather than just being a loss to be cut.
