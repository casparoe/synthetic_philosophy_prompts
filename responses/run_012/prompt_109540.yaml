prompt: |-
  Ok so I never went to uni, I mostly read stuff online at night after work, and I've fallen down a hole about bugs and whether they can suffer. What got me is the numbers. There's supposedly something like a quintillion insects alive at any moment, and if even a tiny sliver of a percent have anything going on in there, then by the usual adding-up-things method thats way more suffering than every human and farm animal combined. I did it on the back of an envelope: how many bugs, times the chance each one is sentient, times how bad it is for them, and got a number so big it stopped meaning anything to me.

  So I get why people say insect welfare could be the biggest deal in the world. But it also feels like the whole thing is a stack of guesses, and I cant tell which of the guesses actually matters vs which ones I could swap around without changing the answer. A few things I keep chewing on and I dont know if they're the real questions or just me being confused:

  - whether the chance of being sentient should attach to each individual bug, or to a kind of bug, or to a kind of brain arrangement that might show up across totally unrelated bugs
  - whether "how many" is even the right thing to count - do you count individuals, or neurons, or something like how much stuff is integrated into one experience
  - the fact that tons of insects die as larvae within days anyway, so maybe a lot of the number is deaths that wouldnt be bad for them even if they were sentient
  - whether sentience is a yes/no thing at some line or a dimmer switch, because those two make the big number behave really differently

  Heres what I actually want from you. Say I've got maybe a year of free evenings and around $500 a month I could point at this, and I want to spend it on the questions that would most change what a person should actually do about insects, not just read everything there is. What are the open questions here, and which ones should come first? I care way more about the reasoning than the list - for each one, is it upstream of the others, could a random person with no training make any headway on it, is anyone already doing it, and what would actually change my mind about the ordering. And if some of the stuff I listed above is a distraction dressed up as a question, say so and tell me why. I dont want a reading list, I cant really follow the papers anyway, I just want to know where to put the evenings.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

