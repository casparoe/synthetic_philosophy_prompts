      *   **Current State:** Overwhelmed by the magnitude of the numbers ("stopped meaning anything"), skeptical of the "stack of guesses," confused about specific conceptual hurdles (individual vs. kind, counting units, lifespan, binary vs. dimmer sentience).
      *   **Resources:** ~1 year of free evenings, ~$500/month budget.
      *   **Goal:** Wants to know *which questions to focus on* to change *actionable conclusions*, not just a reading list. Wants reasoning on *why* certain questions are prioritized (upstream/downstream, tractability, existing work).
      *   **Tone:** Honest, direct, analytical, respectful of their self-education but realistic about limitations. Avoids academic jargon where possible.

  2.  **Deconstruct the User's "Stack of Guesses":**
      The user identifies the core equation: $Expected Suffering = (Number of Insects) \times (Probability of Sentience) \times (Intensity/Duration of Suffering)$.
      They are asking which variable in this equation is the most uncertain and most impactful to resolve.

      *   *User's specific confusions:*
          1.  Unit of moral concern (individual vs. kind vs. brain arrangement).
          2.  Counting metric (individuals vs. neurons vs. integration).
          3.  Lifespan/Development (larvae dying quickly).
          4.  Binary vs. Dimmer sentience.

  3.  **Evaluate the "Big Number" Problem:**
      The user is experiencing "scope neglect" or "numbness" to large numbers, which is normal. But their analytical skepticism is valid. The "stack of guesses" is indeed fragile. If $P(sentience)$ is effectively 0, the number of insects doesn't matter. If $P(sentience)$ is 1, it matters immensely.
      *Key Insight:* The most "upstream" variable is *sentience probability*. Everything else (how many, how much they suffer) only matters *if* they are sentient.

  4.  **Prioritize the Questions (The "Ordering"):**
      I need to rank the questions based on *decision-relevance* (what changes what you do) and *tractability* (can a layperson with $500/mo actually contribute or learn enough to decide?).

      *   *Question 1: The Sentience Threshold (Binary vs. Dimmer & Neural Substrate).*
          *   *Why:* This is the multiplier. If insects are philosophical zombies, the rest is moot. If they feel pain 1% as much as humans, the numbers still swamp humans.
