  **(Self-Correction Note):** I need to make sure I don't just say "Donate to Rethink Priorities." I need to explain *why* that's the best use of $500 compared to, say, buying books or trying to fund a specific experiment. The key is *comparative advantage*. They can't out-research the researchers, but they can fund them.

