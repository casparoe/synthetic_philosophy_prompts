answer: |-
  ### Brainstorming Candidate Questions

  1.  **The "Refusal" Focus:** This question would ask students to formalize a Dutch Book scenario where the agent is not forced to post prices but merely accepts or rejects offers. The task would be to prove that without a "mandatory participation" premise, a bookie cannot guarantee a loss even with linear utility.
      *   *Critique:* This might be too technical on game theory and misses the epistemological nuance of risk aversion.

  2.  **The "Utility" Focus:** This question would posit an agent with incoherent beliefs but a highly concave utility function (e.g., logarithmic). Students must calculate whether a standard Dutch Book yields negative expected utility for the agent.
      *   *Critique:* This risks becoming a mere calculus exercise unless tied tightly to the normative implications for probabilism.

  3.  **The Combined Variant (Selected):** This question combines optional acceptance and concave utility. It requires students to show why the standard argument fails numerically, identify the "small stakes" repair, and discuss whether this saves probabilism as a requirement of rationality or restricts it to a specific domain.
      *   *Rationale:* This best meets the constraint of forcing students to identify which premise does the "real work" (linearity/acceptance) and requires a concrete construction to demonstrate the failure and the repair.

  ***

  ### Final Exam Question

  **Module:** Formal Epistemology & Decision Theory
  **Topic:** Dutch Book Arguments & Rationality
  **Time Allowed:** 60 Minutes
  **Marks:** 20

  **Question:**

  The standard Dutch Book Argument (DBA) for probabilism relies on two critical assumptions: (1) the agent accepts any bet with positive expected monetary value (linear utility), and (2) the agent cannot decline bets offered at their quoted prices.

  Consider an agent, **Ag**, whose beliefs violate probabilism such that $P(A) = 0.6$ and $P(\neg A) = 0.6$. **Ag** has a strictly concave utility function over monetary changes, $U(x)$, where $U(0)=0$, and is permitted to decline any bet offered by a Bookie.

  1.  **Construction:** Construct a standard Dutch Book (two bets) that would guarantee a monetary loss for **Ag** if utility were linear. Demonstrate concretely, using a specific concave utility function (e.g., $U(x) = \sqrt{x + k} - \sqrt{k}$ or similar), why **Ag** might rationally decline these bets under the variant conditions.
  2.  **Repair:** Can the DBA be repaired to accommodate concave utility? Explain the role of stake size in this repair.
  3.  **Implication:** Based on your analysis, does the DBA establish probabilism as a requirement of *general practical rationality*, or merely as a constraint on *betting dispositions* under specific conditions? Justify your answer.

  ***

  ### Model Answer

  The standard Dutch Book Argument attempts to derive probabilistic coherence from the requirement that an agent avoid sure losses in betting scenarios. However, its normative force depends heavily on structural assumptions about the agent's utility and participation constraints. When we relax the assumptions of linear utility and mandatory acceptance, the argument requires significant qualification.

  **1. Construction and Failure of the Standard Argument**
  Consider the incoherent beliefs $P(A) = 0.6$ and $P(\neg A) = 0.6$. A standard Bookie constructs two bets:
  *   **Bet 1:** Pay \$0.60 now; receive \$1.00 if $A$ occurs.
  *   **Bet 2:** Pay \$0.60 now; receive \$1.00 if $\neg A$ occurs.

  Total cost is \$1.20. Total payout is \$1.00 regardless of the outcome. In monetary terms, this is a sure loss of \$0.20. Under linear utility ($U(x) = x$), the expected utility (EU) of each bet for **Ag** is positive ($0.6 \times 1 - 0.6 = 0$). Usually, the Bookie offers a slight incentive (e.g., price \$0.59) to ensure acceptance.

  However, under concave utility (risk aversion), losses weigh heavier than gains. Let $U(x) = \ln(x + W) - \ln(W)$, where $W$ is background wealth. If the stakes are high relative to $W$, the disutility of losing the stake outweighs the utility of the potential win, even if the expected monetary value is positive.
  For example, if the net gain is \$0.41 (price \$0.59) and net loss is -\$0.59:
  $EU \approx 0.6 \cdot U(0.41) + 0.4 \cdot U(-0.59)$.
  Due to concavity, $|U(-0.59)| > U(0.41)$. If the risk aversion is strong enough, $EU < 0$. Since **Ag** can decline bets, she rejects both. The Bookie cannot force the loss. The standard DBA fails because the "Acceptance Condition" is no longer guaranteed by positive expected monetary value when utility is non-linear.

  **2. Repairing the Argument**
  The DBA can be repaired by restricting the scope to **infinitesimal stakes**. By Taylor's theorem, any smooth utility function is locally linear around zero. If the stakes $\epsilon$ are sufficiently small, the curvature of $U$ becomes negligible, and $U(\epsilon) \approx k \cdot \epsilon$.
  In this limit, the agent behaves *as if* they have linear utility. If beliefs are incoherent, there exists a set of sufficiently small bets that yield positive expected utility individually (based on the agent's prices) but guarantee a loss collectively. Since the stakes are small, risk aversion does not trigger rejection. Thus, the DBA holds for "small worlds" or negligible stakes.

  **3. Normative Implications**
  This analysis reveals that the DBA does not establish probabilism as a requirement of general practical rationality independent of context. Instead, it establishes probabilism as a requirement for **avoiding exploitation in sequential betting markets with negligible stakes**.
  If risk aversion is rationally permissible (as standard decision theory suggests), then an agent with incoherent beliefs is not necessarily irrational in general; they are only vulnerable to exploitation if they are forced to operate in a domain where utility is effectively linear. Therefore, the DBA supports a weaker conclusion: probabilism is a constraint on *betting quotients* when stakes are low, rather than a constitutive norm of belief itself. To strengthen the argument to general rationality, one must independently justify why rational agents must have linear utility over money, which is itself a contentious claim.

  ***

  ### Marking Scheme (Total 20 Marks)

  **Part 1: Construction & Concrete Example (6 Marks)**
  *   **2 Marks:** Correctly identifies the standard Dutch Book construction for $P(A)+P(\neg A) > 1$ (selling both bets).
  *   **2 Marks:** Provides a specific concave utility function (e.g., log, sqrt) and explains qualitatively or quantitatively why expected utility becomes negative despite positive expected value.
  *   **2 Marks:** Explicitly notes that the option to *decline* blocks the Bookie, linking the utility curvature to the refusal.
      *   *Common Mistake:* Assuming the agent must accept bets with positive expected monetary value despite concave utility.

  **Part 2: The Repair (Stake Size) (6 Marks)**
  *   **3 Marks:** Identifies that the argument can be saved by reducing stake size (infinitesimal bets).
  *   **3 Marks:** Explains the mechanism: local linearity of utility functions (Taylor expansion argument) makes risk aversion negligible at small scales.
      *   *Common Mistake:* Suggesting the Bookie can force acceptance regardless of utility, or failing to explain *why* small stakes work.

  **Part 3: Normative Implications (6 Marks)**
  *   **3 Marks:** Distinguishes between probabilism as a general rational requirement vs. a constraint on betting dispositions.
  *   **3 Marks:** Argues that the DBA only proves vulnerability to exploitation under specific conditions (linear utility/small stakes), weakening the claim that incoherence is inherently irrational.
      *   *Common Mistake:* Concluding that probabilism is fully vindicated regardless of the utility modification, or conflating pragmatic loss with epistemic irrationality without nuance.

  **Clarity and Structure (2 Marks)**
  *   **2 Marks:** Answer is logically organized, precise, and within the scope of the question.
      *   *Common Mistake:* Disorganized response or exceeding scope (e.g., discussing unrelated Dutch Book variants).
