prompt: |-
  Hey, I'm workshopping a short paper for a seminar on epistemic shiftiness and I'd love your comments on it. Here's the gist, which is basically the whole first half of the thing:

  The setup: contextualists think 'knows' changes meaning with the attributor's context; pragmatic encroachers think knowledge itself depends on the subject's practical stakes. Everyone treats these as rival answers to the question of what makes knowledge ascriptions go shifty. I want to argue they're not rivals at all, because they're both instances of something more basic that I've been calling resolutionism.

  Resolutionism: any knowledge ascription is really a claim at some level of grain. Saying someone knows the trail goes left is like saying the mountain is 4,213 feet high — it can be true at one grain and false at another without anyone being confused or dishonest. Two things set the grain. Stakes set how much error the conversation can tolerate (if a wrong turn costs you a night on a cliff you need a finer grain than if it costs you a twenty minute detour). Salience sets which possibilities are even in view, and therefore which contrasts the claim is distinguishing among. So contextualism and encroachment aren't competing theories, they're two knobs on the same dial.

  Payoff one: I can explain the bank cases without giving up factivity. Nothing about the evidence changes, and the proposition known doesn't change either — what changes is the resolution at which we're asking whether the belief tracks.

  Payoff two: it explains why knowledge talk is perfectly fine at coarse grain and starts to squeak at fine grain, which I think is a better story than either side tells on its own.

  But here's the case that worries me. The bridge inspector. She's checked the bridge a hundred times, she's bored, she has no personal stake at all — worst case for her is paperwork. But the attributor is a commuter whose kids cross that bridge. On the encroachment picture it looks like her stakes are what matter, so she knows; on a salience picture the commuter's context is what matters, so maybe she doesn't. My resolutionism wants to say the grain is set by the question being asked, and the commuter is asking a finer question than the inspector is answering, so both ascriptions come out true at their own grain. That definately feels right to me, but I suspect it's cheap — I've made the two ascriptions index different questions and then acted like I discovered that they don't conflict. Is that a real result or just me relabeling the disagreement?

  Also: does resolutionism just collapse into relevant alternatives theory with stakes picking the relevant alternatives? If so I've spent six pages reinventing a wheel and I'd rather know now.

  So, comments please. Specifically: (1) is the unification doing any work, or is it a redescription? (2) the bridge inspector case — does it break the view, or is my two-questions move legit? (3) anywhere I'm just assuming what I want to prove. Don't be nice, I need this torn up before Thursday.
reasoning: |-
  Here's a thinking process that leads to the suggested comments:

  1.  **Analyze the User's Request:**
      *   **Task:** Provide critical feedback on a short paper draft (specifically the gist/first half) for a seminar on epistemic shiftiness.
      *   **Topic:** Epistemic contextualism vs. Pragmatic Encroachment vs. a new view called "Resolutionism."
      *   **Core Thesis:** Contextualism and Encroachment aren't rivals; they are both instances of "Resolutionism" (knowledge ascriptions are claims at a level of grain/resolution).
      *   **Mechanism:** Grain is set by *Stakes* (error tolerance) and *Salience* (which possibilities/contrasts are in view).
      *   **Specific Worries/Questions:**
          1.  Is the unification doing work, or is it just redescription?
          2.  The Bridge Inspector case: Does the "two-questions move" legitimize conflicting ascriptions too easily?
          3.  Is Resolutionism just Relevant Alternatives Theory (RAT) with stakes?
          4.  Are there question-begging assumptions?
      *   **Tone:** "Don't be nice, I need this torn up before Thursday." (Direct, critical, rigorous).

  2.  **Deconstruct "Resolutionism":**
      *   *Claim:* Knowledge ascriptions are grain-sensitive.
      *   *Analogy:* Mountain height (4,213 ft vs. approx 4,000 ft).
      *   *Parameters:* Stakes (error tolerance), Salience (contrast class/possibilities).
      *   *Goal:* Unify Contextualism (attributor context) and Encroachment (subject stakes).

  3.  **Address Question 1: Unification vs. Redescription:**
      *   *Initial thought:* It sounds like a redescription unless it solves a specific problem that the rivals can't solve *better* or *more simply*.
      *   *Critique:* Contextualists say the *semantic content* of "knows" changes. Encroachers say the *truth conditions* of the knowledge relation change based on practical factors. Resolutionism says the *granularity* changes.
      *   *Problem:* Is "granularity" just a metaphor for "semantic content" or "truth conditions"? If the grain changes the truth conditions, how is this distinct from Contextualism? If the grain depends on stakes, how is this distinct from Encroachment?
      *   *Verdict:* It risks being a "view from nowhere" that just says "both sides are partially right" without explaining the *mechanism* of unification. Does it predict anything new? Does it solve the "disagreement data" better?
      *   *Key Point:* If Resolutionism just says "Contextualism handles salience, Encroachment handles stakes," that's eclecticism, not unification. Unification requires showing *why* stakes and salience operate on the same dimension (grain).

  4.  **Address Question 2: The Bridge Inspector Case:**
      *   *Scenario:* Inspector (low stakes, low salience) vs. Commuter (high stakes, high salience).
      *   *Resolutionist Move:* They are asking different questions (different grains). Both ascriptions true relative to their grain.
      *   *Critique:* This is the classic "Relativist/Contextualist escape hatch." It dissolves disagreement.
      *   *The "Cheap" Worry:* The user admits it feels cheap. Why? Because intuitively, the Commuter and Inspector are disagreeing about *the same thing* (Is the bridge safe/Does she know?).
      *   *Problem:* If the Commuter says "She doesn't know" and the Inspector says "I know," Resolutionism says "You're both right." But phenomenologically, they feel like they are contradicting each other.
      *   *Challenge:* Does Resolutionism explain the *feeling* of disagreement? If not, it's revisionary. Also, whose grain wins in a shared conversation? If they talk to each other, do they shift to the finer grain? (Usually, yes). If so, Resolutionism needs a rule for *conflict resolution* between grains, not just coexistence.

  5.  **Address Question 3: Relevant Alternatives Theory (RAT):**
      *   *Comparison:* RAT says $S$ knows $p$ if $S$ can rule out all *relevant* alternatives.
      *   *Resolutionism:* $S$ knows $p$ if $S$ tracks truth at the required *grain* (determined by stakes/salience).
      *   *Overlap:* Salience determining "which possibilities are in view" is basically RAT. Stakes determining "error tolerance" is basically Encroachment (which often uses RAT machinery).
      *   *Verdict:* It is very close to RAT. The "grain" metaphor might be the only novelty. Is "grain" distinct from "relevant alternatives"?
      *   *Distinction:* RAT is usually binary (alternative is relevant or not). Grain implies a spectrum (precision). Does this matter? Maybe for lottery cases vs. bank cases.
      *   *Risk:* If the only difference is terminology, the paper is "reinventing the wheel." The user needs to articulate how "grain" differs from "relevance." (e.g., Grain might allow for partial knowledge or degrees of justification, whereas RAT is usually all-or-nothing knowledge).

  6.  **Address Question 4: Question-Begging Assumptions:**
      *   *Assumption 1:* That knowledge ascriptions *are* grain-sensitive claims. This is the conclusion, not a premise. Needs argument.
      *   *Assumption 2:* That stakes and salience are commensurable on a single "grain" dial. Why aren't they orthogonal?
      *   *Assumption 3:* That preserving factivity is a desideratum that outweighs explaining disagreement. (Resolutionism saves factivity by relativizing, but at the cost of objective disagreement).

  7.  **Drafting the Response:**
      *   *Tone:* Professional, sharp, constructive but critical (as requested).
      *   *Structure:* Follow the user's three specific questions, plus a general "big picture" critique.
      *   *Content:*
          *   **Unification:** Challenge the "two knobs on one dial" metaphor. Is it one dial or two separate machines wired together?
          *   **Bridge Case:** Hit hard on the "disagreement problem." If the commuter screams "She doesn't know!" and the inspector says "I do!", Resolutionism says "No conflict." This is counter-intuitive. Need a convergence rule.
          *   **RAT:** Be honest. It looks like RAT + Stakes. The "grain" metaphor needs to earn its keep. Is it more than a metaphor?
          *   **Circularity:** Point out where the view assumes the flexibility it tries to explain.

  8.  **Refining the Critique (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't just say "it's RAT." I need to explain *why* that might be okay or not. If it's RAT, is that bad? RAT has problems (the generality problem, etc.). Does Resolutionism inherit them?
      *   *Correction on Bridge:* The user says "the commuter is asking a finer question than the inspector is answering." This implies a mismatch. But in epistemology, we usually care if the subject *knows*, not if they answered the specific question. The attribution "She knows" is the claim. Resolutionism makes *that claim* grain-sensitive.
      *   *Key Insight:* The "Mountain Height" analogy is dangerous. Height is objective but measurement varies. Knowledge is normative. Changing the grain changes the normative standard. Is that clear?

  9.  **Final Polish:** Check against the "Don't be nice" instruction. Ensure the feedback is actionable for a Thursday deadline. (Focus on structural weaknesses).

  **(Self-Correction Note):** I need to make sure I don't just validate the view. The user wants it torn up. I should highlight where the view is weakest. The "Redescription" charge is the biggest threat. The "RAT" charge is the second. The "Bridge" case is the test of coherence.

  Let's organize the response by the user's three specific questions, then add a "Big Picture" section.

  *   **Q1 (Unification):** It looks like eclecticism. Why are stakes and salience the *same* parameter?
  *   **Q2 (Bridge):** It dissolves disagreement too easily. Needs a "contextual dominance" rule.
  *   **Q3 (RAT):** Yes, it's very close. Need to distinguish "grain" from "relevant alternatives."
  *   **Assumptions:** Assuming knowledge is gradable/grain-sensitive without argument.

  Okay, ready to write.s
answer: |-
  This is a provocative setup, and since you asked for it to be torn up, I'm going to skip the compliments and go straight for the structural weaknesses. If you defend this Thursday, these are the three places a sharp opponent will bleed you dry.

  ### 1. Is the unification doing work, or is it redescription?

  **Verdict:** Currently, it looks like redescription masquerading as unification.

  You claim stakes and salience are "two knobs on the same dial." But you haven't shown *why* they are the same dial. You've just asserted that they both affect "grain."
  *   **The Eclecticism Trap:** Contextualists say the *semantic content* of "knows" shifts. Encroachers say the *epistemic position required* shifts. You say the *resolution* shifts. But unless you can give an independent account of what "resolution" is (other than "whatever makes contextualism and encroachment both come out true"), this isn't a unification; it's just eclecticism. It's saying, "Contextualists are right about salience, Encroachers are right about stakes, and I'll call the sum 'grain'."
  *   **The Mechanism Problem:** How do the knobs interact? If stakes are low (coarse grain) but salience is high (fine grain), what happens? Do they cancel out? Does one dominate? If you say "it depends on the conversation," you've just retreated to standard contextualism. If you say "stakes always trump salience," you're an encroacher. To be a genuine third view, Resolutionism needs a **combination rule**. Without a formula for how stakes and salience integrate into a single "grain" value, you haven't unified the theories; you've just put them in the same box.

  ### 2. The Bridge Inspector: Is the "two-questions" move legit?

  **Verdict:** It is cheap, and it buys you peace at the cost of phenomenological accuracy.

  You suspect you are "relabelling the disagreement." You are right to worry.
  *   **The Disagreement Data:** In your Bridge case, if the Commuter says, "The inspector doesn't know the bridge is safe," and the Inspector says, "I *do* know the bridge is safe," they feel like they are contradicting each other. Your view says they are both right. This is the standard relativist/contextualist escape hatch. It saves the truth of the ascriptions but fails to explain the **conflict**.
  *   **The "Question" Dodge:** You say the commuter is asking a finer question than the inspector is answering. But epistemic ascriptions aren't usually answers to explicit questions; they are status reports. If I say "S knows p," I am attributing a property to S. If you say "S doesn't know p," you are denying it.
  *   **The Fix:** To make this stick, you need a **Dominance Rule**. In mixed-context conversations (Inspector + Commuter talking to each other), whose grain wins? Intuitively, the higher stakes/finer grain dominates (the inspector should shut up and check again). If Resolutionism can't explain *why* the fine grain overrides the coarse grain in shared discourse, it fails to explain why we treat knowledge as a communal standard rather than a private one. If you can't explain the pressure to shift to the finer grain, you haven't explained epistemic normativity; you've just described epistemic diversity.

  ### 3. Is this just Relevant Alternatives Theory (RAT) with stakes?

  **Verdict:** Yes, dangerously so. You need to distinguish "grain" from "relevance."

  *   **The Overlap:** RAT says $S$ knows $p$ if $S$ can rule out all *relevant* alternatives. You say $S$ knows $p$ if $S$ tracks truth at the required *grain* (set by salience/stakes). Salience picking "which possibilities are in view" is literally the definition of relevance.
  *   **The Difference?** RAT is typically binary (an alternative is relevant or it isn't). Your "grain" metaphor suggests a spectrum (precision). Does this matter?
      *   *If yes:* You need to show a case where RAT fails but Resolutionism succeeds. Maybe a case where an alternative is *partially* relevant? (This is hard to motivate).
      *   *If no:* You have spent six pages reinventing Contextualist RAT (like Lewis or Cohen) but adding stakes to the relevance criteria (which some encroachers already do).
  *   **The Risk:** If "grain" is just a metaphor for "set of relevant alternatives + stakes threshold," you inherit all of RAT's problems (e.g., the Generality Problem: how do we individuate the alternatives?). If you can't show how "grain" is ontologically or semantically distinct from "relevant alternatives," a reviewer will dismiss this as terminological innovation.

  ### 4. Where are you begging the question?

  *   **The Mountain Analogy:** You assume knowledge is like mountain height (objective but measured at different precisions). But knowledge is normative. Saying "The mountain is 4,000ft" is descriptive. Saying "She knows" is normative certification. You are assuming that normative certification can be "coarse" without losing its normative force. You need to argue for this, not just assert it via analogy.
  *   **Factivity:** You claim Payoff One is saving factivity. But if "S knows p" is true at grain G1 and false at grain G2, is "S knows p" *simpliciter* true? If not, you haven't saved factivity; you've relativized it. You're only saving factivity relative to a context. That's not a payoff; that's the definition of contextualism. Don't sell this as a unique benefit unless you can show how your factivity is more robust than the contextualist's.

  ### Actionable Advice for Thursday

  1.  **Kill the "Two Knobs" Metaphor:** Replace it with a **Weighted Integration**. Explain how stakes and salience combine. Does high stakes force fine grain regardless of salience? Does high salience force fine grain regardless of stakes? If you don't specify the interaction, the view is empty.
  2.  **Address the Disagreement:** In the Bridge case, admit that *in a shared conversation*, the finer grain dominates. Explain *why* (e.g., epistemic risk aversion). This shows you aren't just dissolving disagreement but explaining the dynamics of it.
  3.  **Distinguish from RAT:** Explicitly address this in the text. Argue that "grain" allows for **partial tracking** or **degrees of justification** in a way that binary "relevant/irrelevant" alternatives do not. If you can't make that distinction, pivot: argue that Resolutionism is the *best version* of RAT, not a new theory.
  4.  **Tighten the Mountain Analogy:** Acknowledge the disanalogy (normative vs. descriptive). Argue that knowledge ascriptions are *practical certifications*, which are inherently grain-sensitive in a way that raw descriptions are not.

  **Bottom Line:** Right now, this reads like a "Golden Mean" fallacy (Contextualism is extreme, Encroachment is extreme, Resolutionism is the perfect middle). You need to show that Resolutionism solves a problem that *neither* of the others can solve alone. The only candidate for that is the **interaction of stakes and salience**. If you can model that interaction, you have a paper. If not, you have a metaphor.
