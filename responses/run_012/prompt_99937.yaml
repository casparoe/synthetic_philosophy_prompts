prompt: |-
  Hi — I teach an upper-level seminar that mixes game theory and philosophy (16 students, one 80-minute block) and I want a hands-on thing that makes them actually feel the strategy-stealing argument, not just nod along to the proof on a slide. What I want them to leave with is that the whole trick lives or dies on one assumption — that an extra move can never hurt you — and that when that assumption fails (zugzwang, forced moves, no passing) the argument just evaporates, even though the game still looks perfectly symmetric. Bonus if they also feel how strange it is to be promised a win and handed no method.

  Here's the shape I'm picturing, change whatever you like. Round 1: a small symmetric, no-draw, perfect-information game they can play on paper — a tiny Hex board, a chomp-ish grid, some m,n,k thing, you're call, as long as it's symmetric and extra stones obviously never hurt. Pairs play a few games. First player should keep winning but nobody can say how. Let that eerie gap sit there: a guaranteed win with no visible strategy. Round 2: same board, but I add a rule that makes an extra/forced move a liability (a poison square, or you must move and can't pass), so the "extra move can't hurt" step is false. Now the same symmetry argument dies and the second player can win. Round 3 if there's time: allow passing and let them discover the argument comes back, but only to guarantee the first player isn't worse off than a draw.

  No lecture up front. The debrief is where the naming happens: walk them back through the contradiction ("suppose the second player had a winning strategy..."), point at exactly which move in round 1 did the stealing, and at which rule change in round 2 killed it.

  Give me the whole thing as a JSON object with these fields: title; game (what the board is and why it's symmetric and draw-free); materials; setup; round_1, round_2, round_3 (each an object with rules, what_should_happen, and the facilitator's_job); timeline (a list of {minutes, activity}); debrief (a list of {moment, what_it_maps_to, what_to_say}); predictable_failures (a list of {what_goes_wrong, how_to_handle}); cannot_reproduce (what about the real argument the activity can't get across and that I'll have to say out loud myself).
