answer: |-
  # JOINT STATEMENT ON STRUCTURAL-DEMOGRAPHIC THEORY AND HISTORICAL PREDICTION

  **Signatories:** The Structural-Demographic Research Program (Cliodynamicist) and The Historical Contextualist Program (Skeptic).
  **Date:** [Current Date]
  **Status:** Adversarial Collaboration Protocol

  ## PART I: AGREED CLAIMS

  1.  **Theory Scope:** The structural-demographic program asserts that internal state stability is a function of the relationship between population size, elite numbers, and fiscal capacity; it does not assert that specific events (assassinations, battles) are predetermined, but rather that the *probability* of instability events rises and falls over time.
  2.  **Cycle Definition:** A "secular cycle" is defined as a fluctuation in state stability indicators with a period longer than a single generation but shorter than the total observed historical record, characterized by a phase of expansion followed by a phase of contraction.
  3.  **Evidence Classes:** Both sides concede that time-series data on population, wages, elite numbers, and instability events exist and are usable, provided the uncertainty in dating and measurement is explicitly modeled.
  4.  **Bad Practice (Cliodynamicist):** It is bad practice to adjust model parameters after viewing the full time series of the target variable (look-ahead bias) or to claim a fit is predictive if it relies on variables measured concurrently with the instability.
  5.  **Bad Practice (Skeptic):** It is bad practice to dismiss all aggregated patterns as artifacts without testing against null models, or to claim historical uniqueness precludes any generalization without attempting to quantify the degree of uniqueness.
  6.  **Explanatory Limits:** Neither side is entitled to claim that a single mechanism (e.g., elite overproduction) explains *all* instances of instability; both agree that multiple causal pathways may lead to similar outcomes (equifinality).
  7.  **Prediction Types:** Both sides agree to distinguish between:
      *   *Retrodiction:* Fitting a model to past data with free parameters.
      *   *Conditional Prediction:* Forecasting instability given measured values of drivers (e.g., if elite density rises, risk rises).
      *   *Unconditional Prospective Prediction:* Forecasting instability at a future time without knowing the future values of drivers.
  8.  **Validation Standard:** A model claiming predictive power must demonstrate performance superior to a naive baseline on data not used to tune the model.

  ## PART II: RESIDUAL DISAGREEMENTS, CRUXES, AND TESTS

  | Disputed Claim | Cliodynamicist Position | Skeptic Position | Type | Underlying Crux | Proposed Test | Cliodynamicist Prediction | Skeptic Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Existence of Cycles** | Detrended instability series show statistically significant periodic structure exceeding noise. | Apparent periodicity is an artifact of detrending methods and aggregation of heterogeneous events. | Empirical | Does the signal exceed the noise floor of a surrogate dataset? | **Surrogate Test:** Compare spectral power of observed series against trend-preserving random walk surrogates. | Observed series shows higher peak power at cycle frequency than 95% of surrogates. | Observed series power falls within the distribution of surrogates. |
  | **Predictive Mechanism** | Elite overproduction and fiscal stress are causal drivers that precede instability. | Elite metrics are post hoc labels applied to losers of conflicts; correlation does not imply causation. | Empirical/Definitional | Do driver variables lead the instability variable in time? | **Holdout Test:** Train model on Region A; forecast Region B without refitting parameters. | Model outperforms baseline on Region B using Region A parameters. | Model performance degrades to baseline on Region B. |
  | **Forecasting Utility** | The model provides actionable risk assessment for future instability. | History does not admit lawlike forecasting; context overrides structural variables. | Definitional | Does the model beat a time-only baseline? | **Clock Benchmark:** Compare model accuracy against a forecast based solely on time elapsed since last instability. | Model accuracy exceeds Clock Benchmark by a non-trivial margin. | Clock Benchmark performs equally well or better. |
  | **Future Risk** | Current structural indicators imply elevated near-term instability risk in specific polities. | Current indicators are ambiguous and compatible with continued stability. | Empirical | Will instability events exceed a threshold in a specified window? | **Prospective Forecast:** Ordinal prediction of event frequency in a defined region/horizon. | Event frequency will be in the top quartile of historical rates. | Event frequency will be in the bottom half of historical rates. |

  ## PART III: CRUXES

  The following sub-questions are identified as the primary pivots upon which the disagreement turns. Settling any one of these would materially shift the posterior probability held by at least one side.

  1.  **Signal vs. Artifact:** Is the cyclicality observed in aggregated historical data robust to changes in detrending methodology and resistant to explanation by autocorrelated noise (AR(1) processes)?
  2.  **Temporal Precedence:** Do the proposed structural drivers (elite density, real wages, fiscal capacity) consistently peak or trough *before* the onset of instability, rather than concurrently or subsequently?
  3.  **Generalizability:** Do parameters estimated on one geopolitical context (e.g., early modern Europe) retain explanatory power in a distinct context (e.g., ancient agrarian empires) without recalibration?
  4.  **Added Value:** Does the structural model provide information about future risk that is not already contained in the simple knowledge of how much time has passed since the last major crisis?

  ## PART IV: TESTS AND BENCHMARKS

  For each crux identified above, both parties agree to the following testing protocols. Both sides accept the following benchmarks as necessary conditions for validating the structural-demographic program, unless explicitly noted otherwise in the ledger below.

  1.  **The Holdout Test:**
      *   **Protocol:** Parameters will be fixed using a training set of polities. These parameters will be applied without refitting to a test set of polities neither side has tuned on.
      *   **Acceptance:** Both sides accept this as the minimum standard for generalizability.
  2.  **The Clock Benchmark:**
      *   **Protocol:** Any cyclical model must beat a trivial model that forecasts instability probability based solely on time elapsed since the last instability, using no causal variables.
      *   **Acceptance:** The Cliodynamicist accepts this as a necessary bar for predictive utility. The Skeptic accepts this as a sufficient bar to demonstrate non-trivial structure if passed.
  3.  **The Surrogate Test:**
      *   **Protocol:** A detrended series must show more cyclical structure (spectral power) than a trend-preserving random walk or AR(1) surrogate generated from the same data.
      *   **Acceptance:** Both sides accept this as the standard for distinguishing signal from noise.
  4.  **The Prospective Forecast:**
      *   **Protocol:** A stated ordinal or threshold prediction about a specified class of events in a specified region over a specified horizon.
      *   **Scoring:** Scored by a rule named in advance (e.g., Brier score or simple hit/miss on threshold).
      *   **Acceptance:** Both sides accept this as the ultimate arbiter of unconditional predictive power.
  5.  **Distinction of Claims:**
      *   The Cliodynamicist claims the model supports **Conditional Prediction** (given drivers) and **Retrodiction** with fixed parameters. They claim **Unconditional Prospective Prediction** is possible only if driver variables can be independently forecast.
      *   The Skeptic claims the model currently supports only **Retrodiction with free parameters** and denies the viability of **Unconditional Prospective Prediction**.

  ## CLOSING LEDGER

  **Failure Conditions:**
  *   **Cliodynamicist:** A genuine failure is defined as the structural model performing statistically worse than the Clock Benchmark on the Holdout Test, or failing to reject the null hypothesis in the Surrogate Test. This would not be treated as a need for parameter refinement but as a falsification of the core cyclicality claim.
  *   **Skeptic:** A genuine failure is defined as the structural model consistently beating the Clock Benchmark and Surrogate Test across multiple holdout regions without post hoc adjustment. This would require abandoning the claim that cycles are purely artifacts of aggregation.

  **Post Hoc Rescue Protocol:**
  Both sides undertake to flag any modification to the model, data selection, or parameters made *after* viewing the test results as a "Post Hoc Rescue." Such rescues will be recorded in an appendix but will not count as validation of the original pre-registered claim.

  **What Will Not Settle The Dispute:**
  Both sides agree that the discovery of a single historical counter-example (an instance of stability amidst high elite overproduction, or instability amidst low overproduction) will not settle the dispute. The theory is probabilistic, not deterministic. Similarly, a single successful prediction will not settle the dispute, as this may be due to chance. Only aggregate performance over the agreed benchmarks, scored by the pre-registered rules, will be considered adjudicative.
