answer: |-
  You have put your finger on a specific, jagged nerve in environmental ethics that most people gloss over. You are right: there is no single, perfect term in the canon that captures the *inconsistency* you are describing, though there are terms for the components.

  The academic term for the intuition that "we should not interfere in nature" is the **Laissez-Faire Intuition (LFI)**. It was popularized in environmental ethics by scholars like Clare Palmer and Trevor Hedberg. However, the LFI is usually presented as a coherent (if debatable) philosophical stance. Your observation is sharper: you are describing people who do *not* hold a coherent stance. They hold a coherent *bias* that dresses itself up as a stance only when convenient.

  Since no existing term perfectly captures the *selective* deployment of systemic arguments to block individual welfare claims, I will give you the existing vocabulary, explain where it fails, and then coin the specific term for the maneuver you are witnessing.

  ### 1. The Existing Vocabulary (and Why It Fails)

  **Ecocentrism vs. Individualism:**
  *   **Ecocentrism:** Moral value resides in the ecosystem/species. The individual is expendable.
  *   **Individualism:** Moral value resides in the sentient being. The system is only valuable insofar as it serves individuals.
  *   **The Failure:** The people you describe are not Ecocentrists. If they were, they would oppose wildlife crossings (which alter migration and predation patterns) and oppose culling (which removes individuals for the "health" of the vegetation). They switch frameworks mid-conversation.

  **The Naturalistic Fallacy (Appeal to Nature):**
  *   **Definition:** Arguing that something is good or right because it is "natural."
  *   **The Failure:** This explains *why* they accept the starving fawn, but it doesn't explain the *asymmetry*. They don't think hit-by-car deer are "natural," so they fix that. They aren't consistently appealing to nature; they are appealing to *human responsibility*.

  **Omission Bias:**
  *   **Definition:** The tendency to judge harmful actions (commission) as worse than equally harmful inactions (omission).
  *   **The Failure:** This is the psychological engine, but it's not the *rhetorical vehicle*. People don't just say "I don't want to do it." They say "The *ecosystem* will suffer." They borrow moral weight from the system to justify the omission.

  ### 2. The Coinage: "Defensive Holism"

  The specific move you are identifying is **Defensive Holism**.

  **Definition:** Defensive Holism is the rhetorical strategy of invoking the complexity, sanctity, or stability of a macro-system (the ecosystem, the economy, the gene pool) solely to veto interventions that would alleviate individual suffering, while ignoring that same system's claims when intervention serves human preferences or rectifies human-caused harm.

  **The Structure of the Move:**
  1.  **Acknowledge Individual Pain:** Validate the suffering to establish moral credibility ("Yes, the fawn starving is tragic").
  2.  **Trigger:** A proposal for general intervention is made.
  3.  **The Pivot:** Shift the locus of moral value from the *Individual* to the *System*.
  4.  **The Shield:** Claim epistemic humility ("We can't know the consequences") or normative sanctity ("Nature knows best").
  5.  **The Exception:** If the harm is anthropogenic (whale in a net, deer on a highway), revert to *Individualism*. The system is now "broken" and needs fixing to restore the status quo ante.

  **Why it is a Rationalization, Not a Position:**
  A genuine moral position is falsifiable. If someone truly believed the System outweighs the Individual, they would oppose the wildlife crossing. They would argue, "Deer getting hit by cars is a natural population control mechanism introduced by a new apex predator (man); we should not interfere." They don't say that.

  Therefore, the "System" is not their moral north star. The System is a **Black Box** they open only when the cost of helping the individual becomes too high (in effort, money, or cognitive dissonance). It is a stop-loss order for their empathy.

  ### 3. The Edges: When is Shifting to the System Legitimate?

  You asked for the case where shifting focus from individual to system is not a dodge. There is one, and it rests on **Empirical Risk**, not **Normative Sanctity**.

  **Legitimate System-Referencing:**
  *   **The Scenario:** You propose introducing a predator to control an overpopulated species, or releasing a genetically modified virus to reduce suffering in a pest population.
  *   **The Argument:** "We should not do this because our models suggest a 40% chance of cascading collapse that would cause *more* suffering in the long run."
  *   **Why it's Legitimate:** This is not saying the system *matters more* than the individual. It is saying that *helping the individual is impossible without hurting more individuals.* It remains individualist in its moral calculus but holistic in its empirical modeling.
  *   **The Test:** If the person advocating for the system admits, "If we could guarantee no negative side effects, I would support intervening," they are being honest. If they say, "Even if we could guarantee safety, we shouldn't touch it," they are practicing Defensive Holism.

  **The "Famine" Parallel:**
  Your cousin example (don't stop famine or overpopulation results) is a variant of **Malthusian Fatalism**. It uses a speculative future systemic outcome to justify present individual inaction. It fails for the same reason: it is rarely applied consistently. People who say this about foreign aid rarely argue we should stop pediatric cancer research because saving those children contributes to overpopulation. It is a shield used only against *other people's* suffering, at a *distance*.

  ### 4. Distinct Phenomena: What This Is Not

  You mentioned lumping this in with "Well, you can't save everyone." That is a different phenomenon.

  **Triage vs. Principle:**
  *   **Triage ("You can't save everyone"):** This admits the moral obligation exists but cites **resource scarcity**. "I would save the fawn if I could, but I have limited money/time, and I must prioritize." This is consistent. You can be a Triage Individualist.
  *   **Defensive Holism:** This denies the moral obligation exists. "I *could* save the fawn (or fund the research to save thousands), but I *should not*, because it is Nature's way."
  *   **The Difference:** Triage is tragic; Defensive Holism is exculpatory. Triage says "I can't." Defensive Holism says "You shouldn't."

  **Restoration vs. Intervention:**
  *   **Restoration:** Fixing damage humans caused (cutting the net, the wildlife crossing). This is viewed as "cleaning up our mess."
  *   **Intervention:** Fixing damage nature caused (the starving fawn). This is viewed as "meddling."
  *   **The Distinction:** This is the core of the inconsistency. It relies on a **Boundary Problem**. If humans are part of nature, *all* our actions are natural. If humans are separate from nature, *none* of our actions are natural. Defensive Holists treat humans as separate when we kill (sin) but part of nature when we watch others die (fate).

  ### 5. Summary of the Mechanism

  The people you are talking to are **Status Quo Biased Individualists** using **Holistic Language**.

  They care about individuals. They feel bad when animals suffer. But the cost of addressing wild animal suffering is astronomically high and challenges the romantic view of "Nature" as a benevolent parent. To resolve the cognitive dissonance between "I am a good person who hates suffering" and "I will not spend my life fixing this suffering," they outsource the responsibility to "The Ecosystem."

  "The Ecosystem" becomes a deity that demands sacrifice. It allows them to keep their self-image as animal-lovers while opting out of the actual work of animal protection.

  **The Name:** **Defensive Holism.**
  **The Verdict:** It is a rationalization. It borrows the scientific authority of ecology to enforce a moral boundary that ecology itself does not recognize. Nature has no boundary between "interference" and "happening." A beaver dam interferes. A virus interferes. A human hand interferes. The distinction is not in the physics; it is in the psychology of the observer who wants to be left off the hook.
