      *   **The Argument:** A six-step syllogism concluding that causal knowledge in development economics is impossible because we can't isolate variables (institutions, geography, culture, etc.) in country-level data.
      *   **User's Intuition:** Feels the conclusion is too strong (skepticism vs. nihilism). Notices an analogy problem: if this logic holds, we couldn't know smoking causes cancer either (since we can't reroll a human life).
