answer: |-
  Here is the specification you asked for. It is designed to be a filter you can apply to a paper in hand, whether it is about perception, other minds, or moral agency.

  I have divided this into **Entry Criteria** (must-haves to count as a TA) and **Success Criteria** (must-haves to count as a *successful* TA). Then I will lay out the incompatibilities and the verdict.

  ### Part 1: The Specification

  #### A. Entry Criteria (To bear the label)
  *If an argument fails these, it is not a transcendental argument; it is something else (deduction, IBE, phenomenology).*

  **1. The Direction of Fit (Thought $\to$ World)**
  *   **Requirement:** The argument must move from a premise about the possibility of experience/thought/agency to a conclusion about the conditions that make that possibility actual. It cannot simply move from premise to conclusion within the world (standard deduction) or from effect to cause within the world (abduction).
  *   **The Worry:** If the argument is just "We see order, therefore there is a designer," that is Inference to the Best Explanation (IBE). A TA claims the designer (or category) is a *precondition* of the seeing, not an explanation of it. If it doesn't reverse the order of explanation, the label is decorative.

  **2. The Modality of Necessity**
  *   **Requirement:** The argument must specify the modality of the "necessary condition." Is it logically impossible to conceive the alternative? Is it psychologically impossible for humans to believe the alternative? Is it practically impossible to act without presupposing the alternative?
  *   **The Worry:** "Necessary" is the engine of the TA. If it means "logically necessary," sceptics will say you haven't proved it. If it means "psychologically necessary," you've proved a fact about human wiring, not the world. If the author leaves this ambiguous, the argument is trading on equivocation.

  **3. The Indispensability Claim**
  *   **Requirement:** The condition identified must be claimed as *indispensable*, not just useful or highly probable. There must be an assertion that without $X$, $Y$ (experience/agency) is impossible, not just difficult or unlikely.
  *   **The Worry:** If $X$ is just the *best* explanation for $Y$, you are back to IBE. TAs claim $X$ is the *only* gateway to $Y$. If the author admits $Y$ might be possible without $X$ but $X$ makes it nicer, it's not a TA.

  #### B. Success Criteria (To do philosophical work)
  *If an argument meets Entry Criteria but fails these, it is a TA, but a failed or trivial one.*

  **4. The Bridge Principle (Meaning to Truth)**
  *   **Requirement:** If the conclusion is about the world (Ambitious), the argument needs a license to move from "We must *think* $X$" to "$X$ is *true$."
  *   **The Worry:** This is the Verificationist trap. To get from thought to world, you usually need a premise like "We cannot mean anything by a statement we cannot verify" or "Reality is constrained by the conditions of intelligibility." Without this, you are stuck in your own head. With it, you have bought a controversial metaphysics to prove your point.

  **5. The Uniqueness Constraint**
  *   **Requirement:** The argument must show that the condition identified is the *only* possible condition.
  *   **The Worry:** Showing that $X$ makes experience possible does not rule out that $Z$ also makes experience possible. If there are multiple sufficient sets of conditions, the TA fails to establish *the* structure of reality or thought. To rule out $Z$, you must describe $Z$, but if $Z$ is truly alternative, describing it might be impossible by the TA's own lights.

  **6. Non-Circularity (The Sceptic's Veto)**
  *   **Requirement:** The starting premise (e.g., "We have unified experience," "We are agents") must be acceptable to someone who doubts the conclusion.
  *   **The Worry:** TAs often start with "We experience an objective world." The sceptic asks, "How do you know?" If the answer is "Because the categories apply," and the conclusion is "The categories apply," it is circular. If the premise is weakened to "We seem to have experience," the conclusion often weakens to "We seem to have categories," losing the ambitious force.

  **7. Stability Against Revision**
  *   **Requirement:** The argument must explain why the "indispensable" condition isn't subject to conceptual change.
  *   **The Worry:** Our concepts evolve (science, moral progress). If the TA proves $X$ is necessary for *our current* scheme, it is a historical snapshot, not a transcendental truth. If it claims $X$ is necessary for *any possible* scheme, it risks dogmatism.

  ---

  ### Part 2: The Incompatibilities (The Trade-Offs)

  You suspected a dilemma: *"Either valid and trivial, or non-trivial and not an argument."* You are right. Here is where the constraints break against each other.

  **1. The Stroud Dilemma (Ambition vs. Bridge)**
  *   **Conflict:** You cannot have **Anti-Sceptical Force** (Ambitious Conclusion) and **Metaphysical Realism** (No Verificationism) simultaneously.
  *   **Why:** To prove the world *is* $X$ because we must *think* $X$, you need a bridge (Verificationism/Idealism). If you reject the bridge (to be a Realist), you are left with the Modest Conclusion (we must *think* $X$).
  *   **Trade-off:**
      *   **Keep Ambition:** You must accept a Verificationist/Idealist bridge. (Cost: You alienate realists/naturalists).
      *   **Keep Realism:** You must accept the Modest Conclusion. (Cost: You no longer answer the sceptic about the world, only about our beliefs).

  **2. The Uniqueness vs. Describability Conflict**
  *   **Conflict:** You cannot prove **Uniqueness** without violating **Intelligibility**.
  *   **Why:** To prove $X$ is the *only* condition for experience, you must show that alternatives ($Z$) are impossible. But to show $Z$ is impossible, you must describe $Z$ enough to rule it out. If $Z$ is a genuine alternative to the conditions of thought, describing it might be unintelligible by your own standards.
  *   **Trade-off:**
      *   **Prove Uniqueness:** You risk talking nonsense about the "alternative" you are ruling out.
      *   **Respect Intelligibility:** You admit you cannot rule out alternatives, so you only prove $X$ is *a* condition, not *the* condition.

  **3. The Internal vs. External Audience Conflict**
  *   **Conflict:** You cannot satisfy the **Sceptic** and avoid **Circularity**.
  *   **Why:** To move the sceptic, you must start from premises they accept. They accept very little (often only "I am having sensations"). To get to "Objective World," you need heavy lifting. If you start with "We have knowledge of the world," the sceptic says you begged the question.
  *   **Trade-off:**
      *   **Target the Sceptic:** You risk circularity or invalidity.
      *   **Target the Internal Audience:** You avoid circularity (we agree we have experience), but the argument becomes a report on *our* commitments, not a proof for the outsider.

  ---

  ### Part 3: Marking the Requirements

  **Non-Negotiable (For the label "Transcendental Argument"):**
  1.  **Direction of Fit:** Must move from possibility of thought/experience to conditions of that possibility.
  2.  **Indispensability:** Must claim necessity, not just probability.
  3.  **Modality:** Must state what kind of necessity is involved.

  **House Preferences (Camps fight over these):**
  1.  **Ambitious Conclusion:** Kantians want this; Strawsonians/Naturalists often settle for Modest.
  2.  **Verificationist Bridge:** Required for Ambition; rejected by Realists.
  3.  **Anti-Sceptical Audience:** Required for "Deduction" style; irrelevant for "Therapeutic/Descriptive" style.
  4.  **Stability:** Constitutivists think conditions are fixed; Naturalists think they evolve.

  ---

  ### Part 4: The Verdict

  **Which single requirement does the most to knock out candidates?**
  **Requirement 4: The Bridge Principle.**

  This is the choke point. 90% of ambitious transcendental arguments fail here. They establish that we *must believe* in causality, other minds, or moral value. But they fail to license the move from "We must believe it" to "It is true."
  *   If they add the bridge (Verificationism), the argument becomes valid but the premise is rejected by most contemporary metaphysicians.
  *   If they leave the bridge out, the argument is invalid (a non-sequitur from mind to world).

  **Does the Modest Reading survive?**
  Yes, but it changes the job description.
  The Modest Reading survives the spec, but it ceases to be a "weapon against scepticism" and becomes "conceptual anthropology." It tells us what our commitments *are*, not that they are *correct*.
  *   **Is it a consolation prize?** For the metaphysician, yes. For the pragmatist or Wittgensteinian, no—it's the only honest work available.
  *   **In Ethics:** This is crucial. A TA in ethics (e.g., "To act is to value humanity") usually survives only as Modest. It proves that *if* you act, you are committed to valuing humanity. It does not prove you *ought* to act, nor that humanity *is* objectively valuable. It binds the agent internally, but leaves the amoralist (who rejects the premise of agency) untouched.

  **What a defender of the Ambitious version has to give up:**
  To keep the Ambitious version (proving how the world *is*), the defender must give up **Metaphysical Realism**. They must admit that "how the world is" is inseparable from "how we must think of it." They cannot claim to have found a mind-independent truth using a mind-dependent method. If they claim both, they are smuggling in the Bridge Principle without paying the cost.

  **Summary for your Seminar:**
  Use **Requirement 4 (The Bridge)** as your primary filter. When a student presents a TA, ask: *"What licenses the move from 'we must think this' to 'this is true'?"*
  *   If they say "Nothing, it's just about our beliefs," mark it **Modest**.
  *   If they say "Because reality must be intelligible," mark it **Idealist/Verificationist**.
  *   If they say "It just follows," mark it **Invalid**.

  This stops the fight about specific examples and forces them to declare their metaphysical debts upfront.
