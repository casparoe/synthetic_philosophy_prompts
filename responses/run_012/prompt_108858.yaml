      *   *Classifying Assumptions:* The friend's three kinds (negligible, boundary, scaffolding). Psychohistory treats individual will as negligible. The Mule shows it's not negligible; it's causal. The trilogy muddles this. Seldon acts like it's negligible (Type 1), but the Second Foundation treats it as a boundary they must police (Type 2).
