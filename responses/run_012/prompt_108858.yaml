          This is where the text pushes back against the instrumentalist pleasure. You suspect the Plan's success is just Asimov's authorial control mimicking predictive power. Initially, yes. We enjoy the Seldon Crises resolving like clockwork, mistaking narrative necessity for theoretical validity. This is the Friedman trap: accepting the model because the plot demands it. However, Asimov sabotages this comfort. The Time Vault scene is crucial. Seldon's recorded message addresses a crisis that *did not occur*. He is visibly unsettled. Here, the prediction fails. The assumptions *did* real work, and they failed.

