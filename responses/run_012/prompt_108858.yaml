          Therefore, the trilogy distinguishes the assumption types by showing the cost of confusing them. Treating a domain boundary (individual mutants) as a negligible factor (statistical noise) leads to near-collapse. The books argue that unrealistic assumptions are only safe if the ignored factors are truly causally inert. The Mule proves they aren't.

          Ultimately, the narrative structure exposes the F-twist's epistemic risk. In economics, if a model fails, you lose money. In the Foundation, if the model fails, civilization dies. Asimov grants the instrumentalist their wish—predictions come true—but shows the horrific machinery required to maintain them when assumptions break. The pleasure of the Plan coming true is indeed the pleasure of authorial control, but Asimov highlights this by showing the cracks: the embarrassed Seldon, the panicked First Foundation, the hidden manipulators. The trilogy suggests that relying on "just predictions" blinds you to the mechanisms that sustain them. When the mechanism (statistical averaging) fails, only deus ex machina (Second Foundation) remains. Friedman asks us to ignore the engine so long as the car moves. Asimov shows us what happens when the engine stalls mid-bridge.

