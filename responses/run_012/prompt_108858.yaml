      *   Draft: The Mule does not merely falsify psychohistory; he exposes the F-twist's fatal conflation of simplifying assumptions with structural boundaries. The trilogy ultimately argues against Friedman: when assumptions ignore causal powers (like mutant will), predictive success is fragile luck, not theoretical strength.

