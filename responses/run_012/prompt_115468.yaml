answer: |-
  The knock was three sharp raps, precise enough to be coded. Elara wiped her hands on her trousers, leaving smudges of charcoal on the denim, and opened the door.

  The woman on the porch wore the grey uniform of the Continuity Bureau. Rain beaded on the shoulders of her coat, refusing to soak in. She held a tablet in one hand and a sealed envelope in the other.

  "Elara Vance?"

  "Yes."

  "Service of Notice." The woman extended the envelope. "Pending Liability, Class A. Temporal designation: T-plus-twenty years."

  Elara didn't take it. She looked at the envelope, then at the rain behind the agent. "Twenty years? You're serving me for something I haven't done."

  "For something *you* will do," the agent corrected. Her voice was flat, practiced. "The Entity known as Elara Vance is projected to certify the Meridian Tower plans with a known stress fracture in the primary load-bearing column. The collapse is scheduled for 2045. You are currently liable for the damages."

  Elara laughed, a short, brittle sound. "I haven't certified anything. I haven't even finalized the materials. I'm not the person who signs those papers in 2045."

  "The law disagrees." The agent stepped forward, placing the envelope on the small table by the door. "You are the same substance. Same biological chain. Same legal identity. The stream is one river, Ms. Vance. You don't get to claim the water upstream isn't yours because it hasn't reached the delta yet."

  "That's not how people work." Elara crossed her arms. "I change. My cells turn over. My mind changes. The woman who signs those papers might be desperate, or tired, or compromised. I'm not her."

  "You benefit from her," the agent said. "You benefit from the pension she earns. You benefit from the reputation she builds. You claim the continuity when it suits you. You can't disown it when the bill comes due."

  "I don't claim it. I just... exist." Elara felt the familiar frustration, the itch of being treated like a statue instead of a process. "If I decide tomorrow to become a painter, is the architect liable for my debts? If I lose my memory, am I still the criminal?"

  "You are the vessel," the agent said. "The State requires the vessel to remain seaworthy. If you know the vessel will sink, you must repair it now." She tapped the envelope. "Post the bond, or we freeze your current assets. Prevent the future breach, or pay for it today."

  The agent turned and walked back to her car. Elara closed the door and leaned against it, listening to the rain.

  She walked to her drafting table. The blueprints for the Meridian Tower were spread out, weighted down by coffee mugs and erasers. She looked at the column in question. Sector 4.

  She knew the flaw. Everyone in the firm knew it. The budget had been slashed twice. To meet the client's price, they were using a composite alloy that degraded faster than standard steel. It was legal *now*. It would be brittle in twenty years.

  Elara picked up the envelope. Inside was the projection model. It showed the building standing for nineteen years, then the slow, sickening buckle of the metal during a routine storm. Casualties: Estimated 14.

  She sat down. The law treated her life as a single block, a solid thing that existed all at once. If one part of the block was rotten, the whole block was condemned. It felt like a violation. It felt like being held hostage by a stranger who happened to share her face.

  But then she looked at her hand. The hand holding the pen. It was the same hand that would sign the final approval in 2045.

  If she refused the bond, the Bureau would freeze her accounts. She couldn't pay her staff. She couldn't buy the better materials. She would be forced to cut corners *now* to survive the penalty, ensuring the collapse happened exactly as predicted.

  By fighting the idea that she was the same person, she was making herself the kind of person who would let the building fall.

  She opened her ledger. The bond amount was staggering. It would tie up her liquidity for decades. It was a mortgage on her future freedom. It assumed she couldn't be trusted to change.

  Elara picked up her pen. She hovered over the materials list for Sector 4.

  The agent was right about the river. You couldn't drink from the downstream water without acknowledging the source. But the agent was wrong about the water. It wasn't the same water. It was new, flowing over the old bed.

  If she paid the bond, she admitted the bed was hers. If she changed the materials, she admitted the flow was hers to direct.

  She wasn't the woman in 2045. She knew that with a certainty that ache in her chest. That woman would be tired. That woman would be pressured. That woman might not care.

  But this woman, right now, cared.

  Elara wrote the authorization for the higher-grade steel. It would eat into her profit margin. It would mean less bonus, less security for her own retirement. She was sacrificing the present slice of the worm to save the future slice.

  Then she opened the banking app. She initiated the transfer for the bond.

  She wasn't admitting guilt. She wasn't admitting they were the same person. She was admitting that she loved the stranger in the future enough to keep her from becoming a killer. She was admitting that the connection, even if it wasn't identity, was strong enough to bear weight.

  She hit send. The funds vanished into escrow, held against a crime that hadn't happened, by a self that didn't exist.

  Elara looked at the blueprints. The line for Sector 4 was thicker now. Stronger.

  "Stay seaworthy," she whispered to the empty room.

  She didn't know if the woman in 2045 would thank her. She didn't know if that woman would even remember why the steel was upgraded. She might think it was a mistake. She might try to cut corners again.

  Elara rolled up the plans. She would have to watch herself. She would have to watch the woman she was becoming, like a parent watching a child walk toward a busy street. Not because they were the same, but because she was the one holding the hand.

  Outside, the rain continued to fall, washing over the roof, the gutters, the ground, all of it moving, none of it staying, all of it one storm.
