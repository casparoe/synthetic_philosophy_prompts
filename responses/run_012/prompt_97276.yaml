      *   *What requires fudging:* "Owed authority." In systems, permissions are granted by the root or config. In federalism, states have *inherent* status. This is the "Root vs. Peer" problem.
      *   *What has no counterpart:* Legitimacy (consent of the governed), Moral Equality (why is Wyoming equal to California?), Exit (secession vs. shutting down a node).
      *   *The Functionalist Trap:* Systems optimize for throughput/consistency. Politics optimizes for justice/legitimacy. If I say subsidiarity is just "caching," I lose the *right* to self-rule.
      *   *The Gap Analysis:* Is the gap in my vocab or the theory?
          *   *Hypothesis 1:* Systems vocab is too instrumental. It can't capture deontological claims (rights).
          *   *Hypothesis 2:* Federalism theory sometimes *does* rely on efficiency but dresses it up as rights.
          *   *Verdict:* It's likely a mix, but the "moral equality" and "inherent authority" are genuine residues that systems thinking treats as configuration errors.

  5.  **Refining the Tone:**
      *   Needs to sound like one engineer talking to another, but who now teaches philosophy.
