answer: |-
  My dear colleague,

  It is a pleasure to hear from you, and I find the convergence of your seminars on utilitarianism and population ethics to be a fertile ground for exactly the sort of conceptual friction that keeps our discipline alive. The position you have dubbed lexical threshold negative utilitarianism is indeed a fascinating hybrid, attempting to preserve the aggregative machinery of classical utilitarianism while installing a firewall against its most counterintuitive implications. You ask me to channel Jeremy Bentham in assessing this view, to imagine how the old legislator of the world would respond to a doctrine he never encountered. This requires us to look past the superficial label of utilitarianism and dig into the bedrock of his psychological and metaphysical commitments. If we are to be faithful to Bentham, we must recognize that he would likely view your lexical threshold with profound suspicion, not because he lacked compassion for the victim of torture, but because the threshold violates the arithmetic of sensation upon which he built his entire system.

  To understand why Bentham would likely reject the lexical priority of severe suffering, we must begin with his quantitative hedonism. For Bentham, pleasures and pains differ only in quantity, never in quality. This is the famous pushpin and poetry distinction that separates him from Mill. If value is determined by intensity, duration, certainty, propinquity, fecundity, purity, and extent, then every experience can theoretically be plotted on a single continuous scale. A lexical threshold, by definition, introduces a discontinuity. It suggests that at a certain point on the scale of intensity, the rules of mathematics change, and the unit of pain becomes infinitely heavy or immune to cancellation. Bentham would ask you a simple, devastating question: what is the experiential difference between the moment of pain just below the threshold and the moment just above it? If the sensation is continuous, then the moral weight should be continuous as well. To claim otherwise is to introduce a qualitative distinction disguised as a quantitative one. He would argue that if a pain is merely more intense, it is still just a larger number, and in the arithmetic of the felicific calculus, any finite number, no matter how large, can be outweighed by a sufficiently large sum of opposing numbers. To deny this is to abandon the calculus itself.

  Furthermore, we must consider Bentham's theory of fictions. He was deeply suspicious of abstract entities that could not be cashed out in terms of physical bodies or mental experiences. Rights, obligations, and powers were, for him, fictions that were only useful insofar as they referred to real pains and pleasures. I suspect he would treat the lexical threshold as a dangerous fiction. It posits a moral reality—a prohibition that cannot be overridden—that does not correspond to a distinct type of sensation. If the threshold is not experienced as a unique qualia, then it is a metaphysical add-on, a superstition smuggled into the theory to satisfy our moral intuitions. Bentham was a reformer who sought to clear away the rubbish of natural law and moral sense theory. He would likely see the lexical threshold as a return to the very kind of mystical thinking he spent his life combating. He would argue that we are not responding to a real feature of the universe when we say torture cannot be outweighed, but rather expressing a strong emotional preference that we are mistakenly elevating to a law of nature.

  However, I must pause here and acknowledge where Bentham might surprise us, for he was not a monster of pure logic devoid of human feeling. You note his lifelong hostility to cruelty and unnecessary punishment. In his writings on penal law, Bentham insists that punishment is itself an evil, justified only when it prevents a greater evil. This implies a trade-off, which supports the aggregative view, but his emphasis on security suggests a potential opening for your threshold view. Bentham places the expectation of security above all else in the design of legal codes. Torture is not just a sum of pain; it is a destruction of security, a violation that creates ripples of anxiety and fear far beyond the immediate victim. It is possible that Bentham would argue that the secondary consequences of allowing torture—the collapse of trust, the terror in the population—are so vast that they would always outweigh the benefits in any realistic scenario. In this reading, he would not accept a lexical threshold in principle, but he would accept it in practice. He might agree that a world with torture is worse than a world without, not because the pain is lexically prior, but because the fecundity of that pain in terms of future insecurity is effectively infinite. This would allow him to agree with your classmates' intuition without abandoning his commensurability thesis.

  Yet, there is a tension here that I am unsure Bentham could fully resolve. If we press him with a thought experiment where the security consequences are controlled for—say, a secret torture that no one knows about, preventing a catastrophe that would cause mild discomfort to billions—would he still forbid it? His commitment to the greatest happiness principle suggests he would permit the torture. His arithmetic demands it. If the sum of pleasure is greater, the action is right. To accept a lexical threshold here would be to admit that the greatest happiness principle is not the ultimate standard, but is itself subordinate to a side-constraint regarding severe suffering. I doubt Bentham would take this step. He viewed the principle of utility as the ultimate appeal, the sovereign master. To place a lexical constraint upon it would be to dethrone the sovereign. He would likely bite the bullet and admit that in this hypothetical, secret case, the torture is permissible, however much his heart might recoil. He would tell you that our revulsion is a useful sentiment, a guardrail for ordinary life, but not a guide for the ultimate moral truth.

  The inclusion of animals in the moral community further complicates this prediction. Bentham's famous assertion that the question is not can they reason but can they suffer underscores the moral significance of pain. One might argue that this focus on suffering leans toward negative utilitarianism, where the relief of pain is more urgent than the creation of pleasure. However, Bentham does not frame this as a lexical priority. He includes animals because their pain counts in the sum, not because their pain trumps human pleasure. If anything, the inclusion of animals increases the denominator of suffering, making the calculus more demanding, but it does not change the mathematical rules. If we accept a lexical threshold for humans, consistency might demand we accept it for animals as well. Would Bentham accept that the torture of a single dog lexically outweighs the contentment of a million humans? I suspect he would find this absurd, not because he devalues animal suffering, but because it breaks the aggregative logic that allows us to compare interests across species in the first place. Without a common currency of pain and pleasure, we cannot weigh the interests of the cow against the interests of the butcher. A lexical threshold threatens to make different magnitudes of pain incommensurable, which would paralyze the legislator.

  There is also the matter of the repugnant conclusion, which your classmates are eager to avoid. Bentham would likely be baffled by the idea that a large population of lives barely worth living is a problem, provided the total sum of happiness is high. He was a proponent of population growth insofar as it contributed to the general stock of happiness. The idea that we should prioritize the quality of individual lives over the total quantity of happiness sounds to me like an aristocratic prejudice that Bentham spent his life fighting. He was a democrat of sensation. Every count of pleasure matters equally. To say that a threshold of pain blocks the aggregation of pleasure is to privilege the sufferer over the enjoyers in a way that Bentham's impartial spectator would not recognize. The spectator counts everyone for one and nobody for more than one. A lexical threshold effectively counts the sufferer as infinitely more than one. While this appeals to our modern sensibilities regarding rights and dignity, it sits uneasily with Bentham's radical egalitarianism of the calculus.

  Nevertheless, I must concede that there is a strand in Bentham's thought that prioritizes the avoidance of pain over the production of pleasure, particularly in the context of government. He often speaks of the business of government as providing security, which is largely about preventing pain and fear. He writes that pain is the sovereign master in a way that feels more urgent than pleasure. If we interpret this urgency as a practical heuristic, it aligns with your threshold view. But if we interpret it as a metaphysical claim, it contradicts his explicit statements on commensurability. I am unsure where Bentham would draw the line between a rule of thumb for legislators and a fundamental truth of morality. He was, after all, a pragmatist who wanted his theories to be usable. If a lexical threshold makes the system more stable and prevents abuse, he might tolerate it as a subordinate rule, even if he rejected it as a first principle. He might say that while the threshold is not real in the ontology of sensations, it is real in the psychology of the legislator who must never risk crossing it.

  Ultimately, I believe Bentham would treat the torture intuition as a datum to be explained away rather than a constraint on the calculus. He would argue that our intuition that torture is impermissible is correct, but the reason is not that it is lexically immune to trade-offs. The reason is that in the real world, the costs of torture are always higher than we calculate. We fail to see the long-term corrosion of character, the spread of fear, and the precedent set for future cruelty. He would accuse the proponents of lexical threshold negative utilitarianism of mistaking a very high disvalue for an infinite one. He would urge you to keep the calculus pure, to trust the arithmetic even when it offends the sentiment, because to do otherwise is to open the door to fanaticism. If we allow exceptions to the arithmetic based on intuition, who decides where the threshold lies? Bentham feared the arbitrariness of moral sense theory. He would worry that a lexical threshold is just a disguised way of saying I feel strongly about this, which is no basis for a science of legislation.

  In closing, while I share your classmates' desire to block the darker implications of pure aggregation, I suspect Bentham would stand firm on the continuity of sensation and the universality of the calculus. He would likely view the lexical threshold as a well-meaning but metaphysically confused attempt to protect human dignity, one that ultimately undermines the scientific clarity he sought to bring to ethics. He would ask you to have the courage to follow the numbers, trusting that a proper accounting of all the secondary pains—the security, the expectation, the fear—will almost always vindicate our moral instincts without needing to break the rules of mathematics. Whether we can share that trust today is a question for your seminar, but I am confident that Bentham would not abandon the sovereign masters of pain and pleasure for the sake of a fiction, no matter how comforting it might be.

  Yours in philosophical inquiry.
