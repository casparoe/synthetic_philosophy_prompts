answer: |-
  Here is the correspondence table your partner is relying on, followed by why the structural differences matter more than the similarities.

  | Pascal's Wager | Pascal's Mugging |
  | :--- | :--- |
  | **Agent** | The Believer | The Rational Agent |
  | **Authority** | God | The Mugger |
  | **Action** | Adopt Faith | Hand over $5 |
  | **Cost** | Finite earthly pleasures | $5 |
  | **Payoff** | **Infinite** Bliss / Torment | **Finite but Huge** Utility (e.g., $10^{100}$ lives) |
  | **Probability** | Non-zero (unknown) | Non-zero (claimed) |
  | **Goal** | Argue *for* belief | Argue *against* naive decision theory |

  ### Where the Analogy Breaks Down

  **1. Infinity vs. Large Finite**
  Your partner suspects this is the key, and they are right. In Pascal's Wager, any non-zero probability multiplied by **infinity** yields infinite expected utility. The math forces the bet regardless of how unlikely God is. In Pascal's Mugging, the payoff is merely **large**. For the mugger to win, the utility must grow faster than the probability shrinks. This makes the Mugging a problem about *scaling* and *bounds*, whereas the Wager is a problem about *divergence*.

  **2. Advocacy vs. Reductio**
  Pascal's Wager is an argument *for* a specific conclusion (you should believe). Pascal's Mugging is a *reductio ad absurdum* against Expected Utility Theory itself. It demonstrates that if your utility function is unbounded, any rational agent can be exploited by arbitrarily unlikely threats. Rejecting the Wager means rejecting belief in God; rejecting the Mugging means fixing the math of rationality. You cannot "ignore" the Mugging without leaving decision theory broken.

  **3. The Utility Ceiling**
  Your contact is correct: if you impose a **bounded utility function** (a ceiling on how much good can exist), the Mugging collapses immediately because the payoff hits the cap. However, this doesn't necessarily kill the Wager, which relies on metaphysical infinity exceeding any cap. The cost of solving the Mugging this way is significant: it implies a rational agent should be indifferent between saving a billion lives and a trillion lives once the ceiling is hit.

  ### A Better Analogy
  The **St. Petersburg Paradox** is the true cousin here. Both involve a lottery where the expected value diverges (or explodes) due to low-probability, high-payoff outcomes, challenging how humans and models value risk. Unlike the Wager, the St. Petersburg Paradox is accepted as a genuine problem in probability theory that requires a solution, not just a dismissed theological argument.

  ### Does "Ignore It" Survive?
  No. Dismissing the Mugging because the Wager is unpopular is a category error. The Wager is a theological claim that failed; the Mugging is a logical bug in artificial intelligence and economics that remains active. If you build an AI using unbounded utility maximization, a Pascal's Mugger *will* drain its resources.

  Verdict: Your partner is mistaken because the mugging is not a claim to be believed, but a paradox exposing a critical vulnerability in expected utility theory.
