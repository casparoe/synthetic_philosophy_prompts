  **Demonic Systems Ltd. | Support Hub | Model 441 Countertop Entropy Sorter**

  **Welcome to the Model 441 Frequently Asked Questions.**
  Below you will find troubleshooting steps regarding thermodynamic performance, memory saturation, and compliance auditing. Please read these entries carefully before submitting a ticket to our physics reconciliation team.

  **1. How does the Model 441 achieve temperature separation without external work?**
  The Model 441 utilizes a micro-electromechanical gate operated by a single-molecule sensor, functioning on principles analogous to Szilard's one-molecule engine. The unit detects the velocity of individual gas molecules within the chamber and opens the gate only for high-velocity particles to pass into the heating reservoir, while retaining low-velocity particles in the cooling reservoir. Please note that the device does not create energy; it sorts existing thermal energy based on information acquired during measurement. The work required to operate the gate is negligible compared to the thermal gradient achieved, provided the information storage register remains below capacity.

  **2. My kitchen is not getting colder, and the unit feels warm to the touch. Is the sorter broken?**
  This is expected behavior during the accumulation phase. While the gas within the cooling reservoir decreases in entropy, the entropy of the total system is preserved by an increase in the information entropy of the demon's internal memory register. Each measurement creates a correlation between the demon and the molecule, storing entropy in the record of the measurement rather than dissipating it as heat immediately. The warmth you feel is the operational heat of the sensor, not the entropy debt. To realize the cooling effect externally, the memory register must be reset. Until erasure occurs, the entropy is merely relocated into the device's logical state, which is thermodynamically invisible to your kitchen environment but fully accounted for in our ledgers.

  **3. Your technician claimed the machine "pays for itself," but I am being asked to purchase "erasure credits."**
  There seems to be a misunderstanding regarding the term "free." The energy extraction is free of mechanical work, but not free of information processing costs. According to Landauer's principle, logically irreversible erasure of information must dissipate a minimum amount of heat proportional to $kT \ln 2$ per bit. When your unit's memory fills, it must erase old records to continue sorting. This erasure requires energy. The "Erasure Credits" you see in your Entropy Offset Ledger allow Demonic Systems to pool user erasure tasks and perform them at industrial scales where the heat dissipation can be managed more efficiently than on your countertop. The machine pays for itself in thermal gradient, provided you maintain a subscription to cover the logical reset costs.

  **4. Is this device classified as a perpetual-motion machine? My local utility provider is asking.**
  The Model 441 is not a perpetual-motion machine of the first or second kind. It does not create energy, nor does it violate the Second Law of Thermodynamics when the information system is included in the boundary conditions. Our product has been reviewed favorably by the Second Law Compliance Board, provided the user acknowledges that the entropy balance is global, not local. The Board recognizes that entropy is fundamentally a measure of an observer's ignorance regarding the microstate. As long as the demon's memory is treated as part of the thermodynamic system, the law holds. We recommend providing your utility provider with our Compliance Certificate, which outlines how the entropy is stored in the correlations between the gas and the memory rather than in the thermal bath itself.

  **5. The unit stops working when I attempt to inspect the internal memory register. Why is this?**
  This is covered under our warranty clause for "Observer-Dependent Performance." The efficiency of the Model 441 relies on the demon possessing information about the molecules that the user does not possess. By inspecting the memory register, you are acquiring the information yourself, thereby changing the coarse-graining of the total system. Once you know the state of the memory, the entropy associated with that information is no longer hidden in the demon's ignorance; it becomes explicit in your own knowledge state, effectively saturating the system's available negentropy. Please refrain from observing the internal logic gates during operation. If you require maintenance, please schedule a blind-service appointment where a technician operates under non-disclosure agreements to ensure the entropy remains properly unobserved.
