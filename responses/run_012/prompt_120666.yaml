  **Pre-Vote Competence and Independence Protocol**

  **1. Independence Check**
  *Question:* Have members formed views based on distinct evidence or reasoning paths, free from undue influence?
  *Sufficient Answer:* Yes, provided members accessed varied data sources, declared conflicts (e.g., former consultancy ties), and deliberated before the Chair summarised.
  *Stop Condition:* No. If all rely on a single secretariat dossier, or the Chair opens with a conclusion, independence is compromised. Do not vote; circulate divergent briefs or appoint a devil's advocate.
  *(CJT Inference: Correlated errors negate the benefit of group size.)*

  **2. Competence Threshold**
  *Question:* Is the panel's historical accuracy on this specific class of decision greater than 50%?
  *Sufficient Answer:* Yes, supported by audit data showing majority decisions were subsequently validated.
  *Stop Condition:* No. If past decisions (e.g., groundwater) are systematically overturned, individual competence ($p$) is below 0.5. Do not vote; refer to a specialist sub-committee.
  *(CJT Inference: If individual competence is below chance, adding voters increases certainty of error.)*

  **3. Fact vs. Value Distinction**
  *Question:* Is the decision a matter of empirical truth (will this leak?) or risk tolerance (is this leak acceptable?)?
  *Sufficient Answer:* Empirical.
  *Hand-off Condition:* Risk tolerance. If the question concerns acceptable harm rather than probable outcome, majority voting is illegitimate. Hand to the Board or elected officials.
  *(Judgment: CJT applies only to binary facts, not policy preferences.)*

  **4. Re-vote Validity**
  *Question:* Has new, material evidence emerged since the initial vote?
  *Sufficient Answer:* Yes, specific data previously unavailable.
  *Stop Condition:* No. Further discussion without new evidence merely increases social pressure, not independence.
  *(Judgment: Deliberation without new info creates correlation, violating CJT assumptions.)*

  ***

  **Application to Live Cases**

  **1. Proposal to Expand Panel to Fifteen**
  *Verdict:* **Reject.**
  *Reasoning:* Fails Independence Check. All members read the same dossier; you prime the discussion; two members share a consultancy background. Under CJT, adding voters only helps if errors are independent. Here, errors are correlated via the secretariat and your opening summary. Increasing $n$ amplifies common bias rather than cancelling it. You are building a larger echo chamber, not a wiser jury.
  *Action:* Reform briefing papers to include opposing expert views before meeting. Stop opening with your summary. Declare conflicts formally.

  **2. Proposal to Re-vote on 5–4 Decision**
