          2.  **Direction 2 (Economics to Philosophy):** Use the case as a *test* for competing accounts of vagueness (Epistemicism, Supervaluationism, Degree Theory/Contextualism, etc.). Which does it favor/embarrass/silence? Address authority, revision, and retrospective dating.
