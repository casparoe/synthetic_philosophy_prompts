answer: |-
  This is a productive friction. You are right to resist the impulse to let the seminar talk you out of the economic intuition. The practice of macroeconomics does not dissolve under the gaze of the sorites; rather, it exposes limitations in how standard philosophical accounts model the *management* of vagueness in high-stakes environments.

  Here is the case analysis running in both directions, followed by the ledger you requested.

  ### I. The Sorites Machinery Applied to "Recession"

  **The Tolerance Principle**
  In the standard sorites, the tolerance principle is: *If $n$ grains make a heap, $n-1$ grains make a heap.*
  For the NBER case, the principle must be multidimensional. It is not merely about output levels. The tolerance premise is: *If a set of economic conditions $(D, d, f)$ constitutes a recession (where $D$ is depth, $d$ is diffusion, $f$ is duration), then a set of conditions $(D - \epsilon, d, f)$ also constitutes a recession.*

  Crucially, this tolerance applies not just to the raw data, but to the *classification*. The intuitive pull is: "If the committee declared a recession for a decline of 2.5% lasting 3 months, they must also declare one for 2.49% lasting 3 months."

  **The Forced March**
  Does the forced march go through as cleanly as it does for baldness? No, and for reasons that structuralists about vagueness often overlook.
  1.  **Measurement Noise vs. Ontic Sorites:** In the baldness case, we assume we can count hairs precisely. In the recession case, the "grain" of the sorites is coarser than the measurement error. GDP is revised. The "months" are statistical constructs. A forced march requires a stable substrate to traverse. Here, the substrate shifts underfoot. If you try to march month-by-month, the data for month $n$ changes three years later. The paradox requires a static series; the NBER deals with a dynamic, revisable series.
  2.  **Substitutability:** The NBER criterion allows trade-offs. A shallow decline can be a recession if it is widespread; a deep decline can be a recession if it is short. This multidimensionality breaks the linear forced march. You cannot simply remove one "unit" of recession-ness. You have to remove a vector of economic activity. This makes the boundary a surface in high-dimensional space, not a point on a line. The sorites loses its grip because there is no single dimension along which to slide into paradox.

  **Vague, Context-Sensitive, or Interest-Relative?**
  The predicate "recession" is not merely vague; it is *teleologically vague*.
  *   **Vague:** Yes, because "significant" and "spread across" lack sharp boundaries.
  *   **Interest-Relative:** Yes, because the extension of the term is determined by the consequences of applying it. If calling it a recession triggers automatic stabilizers that worsen the situation, the threshold for "significant" shifts.
  *   **Context-Sensitive:** Yes, because the 2020 pandemic shock changed the context of what counts as a "normal" fluctuation.

  The answer changes what the paradox bites on. If "recession" is purely vague, the paradox suggests a logical failure in the language. If it is interest-relative, the "paradox" is actually a *negotiation*. The lack of a sharp boundary is not a bug; it is a feature that allows the committee to absorb shocks (like the 2022 two-quarter dip) without triggering unnecessary panic. The sorites assumes the goal is truth-tracking; the NBER assumes the goal is stability-tracking.

  **Higher-Order Vagueness**
  You noted the definition itself is vague ("significant decline," "few months"). This creates a regress. If we precisify "recession" using the NBER definition, we inherit the vagueness of "significant."
  In philosophy, higher-order vagueness is often treated as a problem for supervaluationism (where do the sharp boundaries of the precisifications lie?). In the NBER practice, higher-order vagueness is solved by *authority*. The vagueness of "significant" is not resolved by better definitions, but by the committee's vote. The regress stops not at a fact, but at an institution. This suggests that in practical domains, higher-order vagueness is managed socially, not semantically.

  ### II. The Episode as a Test for Accounts of Vagueness

  Treating the NBER's authoritative calls as the "data" for philosophical theory yields sharp results.

  **1. Epistemicism (Williamson)**
  *   *The Claim:* There is a sharp boundary; we just don't know it.
  *   *The Test:* The NBER revises chronologies. In 2022, the boundary was arguably in one place; later, it was settled elsewhere. More damningly, the boundary *moves* with data revisions. If GDP for Q1 2022 is revised from -1.5% to -1.4%, the recession status might flip.
  *   *Verdict:* **Embarrassed.** Epistemicism posits a mind-independent fact of the matter. The NBER practice demonstrates that the fact is *made*, not found. The boundary does not exist prior to the decision; it is constituted by it. The retrospective nature of the call (deciding months late) proves there was no epistemic barrier to knowing the fact *then*; the fact simply did not exist *then*.

  **2. Supervaluationism**
  *   *The Claim:* A statement is true if it is true on all admissible precisifications.
  *   *The Test:* The 2022 episode (two negative quarters, no recession) shows that there are competing precisifications (the "two-quarter rule" vs. the "NBER holistic rule"). Supervaluationism handles the indeterminacy well (it was neither true nor false until the committee spoke).
  *   *Verdict:* **Silent/Partial Fit.** It explains the period of uncertainty well. However, it is silent on *who* gets to determine which precisifications are "admissible." Supervaluationism treats admissibility as a constraint of meaning. The NBER shows admissibility is a constraint of *power*. It cannot explain why the "two-quarter" precisification was rendered inadmissible by the Committee's announcement.

  **3. Degree Theory (Fuzzy Logic)**
  *   *The Claim:* Truth comes in degrees (0 to 1).
  *   *The Test:* The economic data fits this perfectly. Recessions clearly come in degrees of severity. The NBER's multidimensional weighting (depth vs. duration) looks like a fuzzy membership function.
  *   *Verdict:* **Misdescribes the Output.** While the *input* is degree-based, the *output* must be binary for policy purposes (contracts trigger, political narratives solidify). Degree theory explains the measurement, but it cannot explain the *collapse* of the degree into a binary fact. It has no account of the threshold-crossing mechanism other than arbitrary cutoff, whereas the NBER treats the cutoff as a deliberative act.

  **4. Contextualism / Interest-Relative Invariantism**
  *   *The Claim:* The extension of the term shifts with context or practical stakes.
  *   *The Test:* This is the strongest fit. The meaning of "recession" in 2020 (pandemic shock) differed from 2001 (dot-com bust) because the stakes and the causal structure differed. The Committee's role is to update the context.
  *   *Verdict:* **Favored.** This account best captures why the "two-quarter rule" is not a definition but a heuristic. The "correct" extension of the word depends on the purpose of the classification. However, standard contextualism usually locates the context in the speaker/hearer dynamic. The NBER case shows context can be *centralized* and *decreed*.

  **5. The Institutional Fact (The Silent Challenge)**
  *   *The Claim:* (Not a standard vagueness theory, but required by the case). Some boundaries are drawn by constitutive rules (Searle).
  *   *The Test:* The Committee's announcement makes it true.
  *   *Verdict:* **Required.** No standard linguistic theory of vagueness accounts for *retrospective revision*. If I say "That is a heap," and later revise my judgment because I counted differently, I was wrong before. If the NBER says "Recession" and later revises the data, the *past fact* changes. This implies the truth condition is not correspondence to past reality, but coherence with the current authoritative chronology. This is a category of vagueness management that philosophy largely ignores: *administrative vagueness*.

  ### The Honest Ledger

  **What the Sorites Paradox Explains about Dating Recessions**
  1.  **The Pressure of Borderlines:** It correctly identifies why the 2022 episode was contentious. There *was* a pressure to classify the two-quarter dip as a recession, driven by the tolerance of the "two-quarter" heuristic.
  2.  **The Instability of Intuition:** It explains why public discourse oscillates. Without an authority, individual judgments of "significant decline" will vary slightly, leading to a lack of consensus in the borderline zone.

  **What the Sorites Paradox Misdescribes**
  1.  **Linearity:** The paradox assumes a single dimension of removal (one grain, one hair). Recessions are multidimensional vectors. You cannot run a forced march when the path is a surface.
  2.  **Static Truth:** The paradox assumes the truth value of the proposition is fixed by the state of the world. In macroeconomics, the truth value is fixed by the *measurement regime* and the *authority* interpreting it. The paradox treats vagueness as a defect of language; the NBER treats it as a buffer for policy.
  3.  **The Location of the Boundary:** The paradox asks "Where is the line?" The economic practice answers "We draw the line where it minimizes error costs." The sorites is metaphysical; the dating is consequentialist.

  **What the Practice of Dating Recessions Shows about the Paradox**
  1.  **Vagueness is Managed, Not Solved:** Philosophers look for a solution to the paradox (a logic that dissolves it). Economists look for a *manager* of the paradox (a committee that absorbs the ambiguity). The paradox is not a logical puzzle to be solved; it is a risk to be governed.
  2.  **Authority Precedes Precision:** Standard theory assumes precision is a property of the world or the language. This case shows precision is often a property of the *institution*. The boundary is sharp only because the Committee has the monopoly on the use of the term.
  3.  **Retrospective Truth:** The fact that the boundary moves in time (via revision) challenges the assumption that vagueness is about our access to a static reality. In social kinds, the reality is partially constituted by the classification itself. The sorites paradox fails to bite here because the "heap" is not just a collection of grains, but a collection of grains *certified as a heap* by the relevant authority.

  **Summary:** The sorites paradox assumes the goal is to describe the world accurately. The NBER Dating Committee assumes the goal is to coordinate action effectively. Your intuition is correct: in the latter game, the paradox is inert, not because the vagueness isn't there, but because the stakes of the paradox are managed by institutional fiat rather than logical consistency.
