  *(Self-Correction on the "Rock" problem)*: If I say "A rock has no craving," is that a valuable state? Only if the theory values "states of affairs" independently of experience. Most plausible moral theories require experience. So the Tranquilist must commit to *Experienced Absence*. A rock doesn't experience the absence. So the rock is neutral. This saves State-Tranquilism from the "Rock is Holy" objection, but keeps the Antinatalist implication (Non-existent beings don't experience craving, so they are in the 'good' state relative to existing beings who might crave).

  Let's organize the response clearly around the user's specific puzzles.

