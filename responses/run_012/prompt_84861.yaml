      *   **Section 4: Comparability and Aggregation.** Discuss the baseline problem. If value is relief, it's agent-relative. If value is state, it's agent-neutral but flattens distinctions.
      *   **Section 5: The "Load-Bearing" Commitments.** Summarize what *must* be true for the view to hold water.
          1.  Sentience requirement.
