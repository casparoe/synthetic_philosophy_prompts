answer: |-
  The practice of institutional apology for historical wrongs is a hybrid mechanism that straddles the boundary between moral confession and political settlement. To understand what view of responsibility it assumes, we must distinguish between the **metaphysics of the institution** (what the state *is*) and the **ethics of the membership** (what the citizens *owe*).

  Here is an analysis of the view of responsibility embedded in this practice, broken down by what it strictly presupposes, where it is underdetermined, what it rules out, and how it would shift under a strict individualist framework.

  ### 1. The Core Tension: Thick Ontology vs. Thin Duty
  You ask whether the practice requires the state to be a "genuine person" (a trans-temporal moral agent) or if a "thinner view" (current duties to repair) suffices.

  **The practice relies on a strategic ambiguity between the two.**
  *   **Rhetorically,** it requires the **Thick View**. For an apology to be an *apology* rather than a mere expression of regret, the speaker must identify with the wrongdoer. When a Prime Minister says "We apologize," the "We" must ontologically include the government of 1850. If the state were not a persisting agent, the apology would be a lie (speaking for someone you are not).
  *   **Legally and Practically,** it relies on the **Thin View**. The same governments that apologize explicitly deny legal liability. They shield current taxpayers from lawsuits by arguing that *individuals* are not guilty for past acts. If the Thick View were fully operational, the state would accept not just moral guilt but legal culpability (damages, punishment).

  **Conclusion:** The practice does not *strictly* require the state to be a genuine moral person capable of guilt. It requires the state to be a **narrative person** capable of *acknowledgment*. It assumes a view of **Political Responsibility** (Hannah Arendt's distinction): I am responsible for what my community did because I am a member of the community, even if I am not *guilty* of the act itself.

  ### 2. What the Practice Strictly Presupposes
  For these ceremonies to function without collapsing into incoherence, three specific conditions must be accepted as true:

  1.  **Institutional Continuity:** The state, church, or university today must be numerically or narratively identical to the entity that committed the wrong. If the US government of 2024 is a wholly different entity than the US government of 1860, the apology is category error. The practice presupposes that institutions have a lifespan exceeding that of their biological members.
  2.  **Survivability of Obligation:** Moral or political duties must be able to outlive the original wrongdoers. This rejects the principle *actio personalis moritur cum persona* (a personal action dies with the person) in the moral realm, even if it holds in the legal realm. It presupposes that debts (moral or reputational) are inherited along with assets (land, wealth, power).
  3.  **Representative Authority:** Current leaders must possess the standing to speak on behalf of past and future members. This presupposes a theory of agency where the "head" can bind the "body" across time.

  ### 3. Where the Practice is Underdetermined
  The observable ceremonies (speeches, settlements, monuments) are compatible with three rival theories of responsibility. The practice does not distinguish between them, which allows diverse stakeholders to agree on the ritual while disagreeing on the reason.

  *   **The Collective Guilt View:** "We are tainted by the sin of our fathers."
      *   *Fits:* The language of apology and shame.
      *   *Underdetermined:* The refusal to accept legal liability contradicts this.
  *   **The Unjust Enrichment View:** "We hold assets gained through theft; we must disgorge them."
      *   *Fits:* The monetary settlements and land returns.
      *   *Underdetermined:* Apologies are often issued without restitution, and restitution is often given without admission of theft (framed as "investment").
  *   **The Forward-Looking (Promise) View:** "We apologize to establish a new baseline for future conduct."
      *   *Fits:* The focus on reconciliation, healing, and "never again."
      *   *Underdetermined:* This view makes the apology instrumental. If the goal is future peace, truth is secondary to efficacy.

  Because the practice works for all three, it is **underdetermined regarding the source of the duty.** Is the duty backward-looking (correcting the past) or forward-looking (securing the future)? The ceremony licenses both interpretations simultaneously.

  ### 4. What Rival Views Does the Practice Rule Out?
  While flexible, the practice is not compatible with all philosophical positions. It quietly excludes:

  *   **Strict Methodological Individualism:** The view that only biological humans act and bear responsibility. If this were true, institutional apologies would be fraudulent. The practice rules this out by insisting that *institutions* act.
  *   **Pure Legal Positivism:** The view that "lawful then" equals "right then." Courts use this to deny liability, but the apology practice explicitly overrides it morally. By apologizing for something that was legal at the time, the practice asserts that **moral norms transcend positive law.**
  *   **Moral Nihilism regarding History:** The view that the dead have no claims on the living. The practice affirms that the dead *do* have claims, mediated through their descendants.
  *   **The "Clean Slate" Theory:** The idea that a change in regime or generation wipes moral slates clean. The practice assumes moral stains persist through regime changes.

  ### 5. The Individualist Counterfactual: What Would Change?
  If we took the strict individualist line—that no one alive owes an apology, only voluntary repairs—the practice would have to change fundamentally in language, structure, and intent.

  *   **Language Shift:** The word "Apology" would vanish, replaced by "Acknowledgment," "Statement of Regret," or "Memorialization." One cannot apologize for another's sin, but one can acknowledge another's suffering.
  *   **Financial Shift:** Money would no longer be framed as "Reparations" or "Settlements" (which imply debt). It would be framed as "Discretionary Grants," "Development Aid," or "Investments." This removes the implication of *owed* justice and replaces it with *charity*.
  *   **Agency Shift:** The speech would not be "We did this." It would be "The entity that preceded us did this." This creates moral distance. It turns the ceremony from a confession into a historical lecture.
  *   **Recipient Shift:** If the duty is not to the dead (who can't receive apology) nor to descendants (who weren't harmed directly), the individualist view struggles to find a recipient. The practice would likely shift to being purely symbolic, aimed at "society" generally rather than a specific victim group.

  ### Summary
  The practice of historical apology assumes a view of **Corporate Political Responsibility.**
  *   **Strictly Presupposes:** That institutions persist through time and inherit the moral debts of their predecessors.
  *   **Comfortably Fits:** Both backward-looking guilt and forward-looking reconciliation (it remains agnostic on which is the true engine).
  *   **Rules Out:** The idea that legality equals morality, and the idea that death severs all institutional obligation.
  *   **Vulnerability:** It relies on a fiction of continuity. If pushed too hard on the "Genuine Person" theory, the state retreats to legal immunity. If pushed too hard on the "Individualist" theory, the apology loses its moral force. It survives only in the middle ground where the state is **person enough to apologize, but not person enough to be sued.**
