answer: |-
  Your half-formed theory is not just salvageable; it is the only framework that resolves the contradictions you're feeling. You have correctly identified that monuments are not archives (records of what *was*) but speech acts (statements of what *is*).

  However, your current formulation ("does keeping this up make us say something about ourselves that isn't true") is slightly too vague to handle the edge cases, specifically the distinction between the Merchant and the Botanist, or the Street Name and the Statue.

  Here is the precise principle that organizes your gut reactions, followed by the mapping, the necessary correction, and the predictions.

  ### The Principle: Non-Contradictory Affirmation

  **Statement:** *A public monument is permissible only if the specific virtue it actively affirms to the contemporary community is not fundamentally contradicted by the subject's moral record, weighted by the medium's intensity of honor.*

  This principle relies on three clauses to do the work.

  1.  **The Affirmation Clause:** What specific value is this object asking us to endorse *right now*? (Not "who was this man?" but "what are we celebrating?")
  2.  **The Separability Clause:** Is the affirmed value inextricably linked to the moral harm? (Can we honor the ferns without honoring the slavery?)
  3.  **The Intensity Clause:** How loudly does the medium speak? (A statue shouts; a street name whispers.)

  ---

  ### Mapping Your Verdicts

  Here is how the principle validates (or challenges) your gut calls:

  **1. Confederate Generals (Courthouse)**
  *   **Verdict:** Remove.
  *   **Work done by:** *Affirmation & Separability.*
  *   **Analysis:** The affirmation is "noble defense of heritage." The contradiction is "defense of chattel slavery." These are inseparable. The medium (courthouse square) is high intensity (state power).

  **2. Edward Colston (Bristol)**
  *   **Verdict:** Right outcome, wrong method.
  *   **Work done by:** *Affirmation (for the statue) + Legitimacy (for the method).*
  *   **Analysis:** The statue affirmed "civic pride in a benefactor." This was rendered false by the source of the wealth (slavery). However, your discomfort with the mob is not about the monument's truth, but about *who owns the speech act*. In a democracy, the community must retract its own speech through due process; otherwise, you replace one assertion of power with another.

  **3. Cecil Rhodes (Oxford)**
  *   **Verdict:** Remove.
  *   **Work done by:** *Separability.*
  *   **Analysis:** You noted the scholarships benefit African students. This is a *consequence*, not an *affirmation*. The statue affirms Rhodes as a "Great Man." His core project (white supremacy) contradicts the virtue of equality required for a modern university. The utility of the money does not sanitize the honor of the statue.

  **4. Eugenicist (Street vs. Statue)**
  *   **Verdict:** Keep Street, Remove Statue.
  *   **Work done by:** *Intensity Clause.*
  *   **Analysis:** This is the strongest test of your theory.
      *   **Statue:** High intensity. It affirms "This man is worthy of emulation." Contradiction: Eugenics. **Fail.**
      *   **Street Name:** Low intensity. As you noted, it has "worn off" into being a location. It affirms "This is how you find the bakery," not "We love eugenics." **Pass.**

  **5. Slave-Trade Merchant vs. The Botanist**
  *   **Verdict:** Remove Merchant, Keep Botanist (with plaque).
  *   **Work done by:** *Separability Clause.*
  *   **Analysis:**
      *   **Merchant:** The honor is *for* the philanthropy. The philanthropy is *funded by* slavery. The good and the bad are the same money. Inseparable. **Fail.**
      *   **Botanist:** The honor is *for* the science (ferns). The harm is *parallel* (slave ownership). While morally troubling, the botanical discovery is not *caused* by the slavery in the same direct way the merchant's charity was. A second plaque resolves the contradiction by contextualizing the era. **Pass.**

  ---

  ### The Necessary Overturn

  You asked me to overturn one of your calls if necessary for consistency. I must challenge your verdict on the **Eugenicist Street Name**.

  **The Call:** You want to keep it because renaming is a "paperwork nightmare" and the name is "worn off."
  **The Correction:** Under the *Principle of Non-Contradictory Affirmation*, pragmatism is not a moral defense. If the statue must come down because the affirmation is false, the street name technically makes the same affirmation, just quietly.
  **Why Overturn It?** If you accept that monuments are "something we're doing now," then leaving the name up *is* an active choice, not a passive leftover. The "paperwork nightmare" is a logistical cost, not a moral justification.
  **The Nuance:** You can keep the street name *only if* you treat it as a historical artifact, not a honorific. This means adding context (street signs with QR codes or plaques at the neighborhood entrance). If it remains uncontextualized, consistency demands it go, or else you admit that *convenience* trumps *truth* for low-intensity monuments.

  ---

  ### Predictions for New Cases

  **Case 1: The Co-opted Hero**
  *A statue of a man who did nothing wrong, but whose statue has been adopted as a rallying point by a group he'd have despised (e.g., a unionist statue used by white supremacists).*
  *   **Prediction:** **Keep it.**
  *   **Reasoning:** The *Affirmation Clause* looks at what the *community* installed the statue to say, not what a specific subgroup currently projects onto it. Removing it cedes the historical record to the appropriators. The contradiction lies in the *group's usage*, not the *monument's claim*. The remedy is counter-speech (more context), not removal.

  **Case 2: The Unethical Public Health Monument**
  *A monument to a public health campaign that turns out to have been built on experiments on people who couldn't consent.*
  *   **Prediction:** **Remove or Radically Recontextualize.**
  *   **Reasoning:** This fails the *Separability Clause*. Unlike the Botanist (where the ferns are distinct from the slavery), here the *health achievement* is the direct fruit of the *non-consent*. The good (cure) is inextricably built on the bad (violation). To affirm the cure without acknowledging the violation is to tell a falsehood about the cost of progress. A simple plaque is likely insufficient; the monument itself glorifies a tainted victory.

  ---

  ### Does Age Matter?

  You asked: *Should age matter at all?*

  **Answer:** Yes, but not how people think.
  Age does not grant moral immunity (a 200-year-old lie is still a lie). However, age changes the **Function** of the object.

  *   **Recent Monuments (<50 years):** These are political statements. They are judged strictly on the *Affirmation Clause*.
  *   **Ancient Monuments (>100 years):** These become historical artifacts. They shift from "Honor" to "Evidence."

  **Why people look at you funny:** When you say "age shouldn't matter," they hear "we should tear down ancient history." They are thinking of the object as *Evidence* (which we keep). You are thinking of the object as *Honor* (which we revoke).

  **The Fix:** Your principle handles this via the *Affirmation Clause*. A 19th-century statue in a courthouse is still functioning as an *Honor* (it's in a place of civic power). A 19th-century statue in a museum is functioning as *Evidence*. Age matters only insofar as it shifts the object from the category of "Civic Speech" to "Historical Record."

  ### Summary for Your Piece

  Your gut is consistent. You believe that **public space is a conversation, not a archive.** We are allowed to keep complex figures (Botanist) if we tell the whole truth (plaques), but we must remove figures whose core honor is a lie (Merchant, Confederate). Your hesitation on the street name is the only leak in the boat: you are prioritizing administrative ease over moral consistency. If you plug that leak, the vessel holds.
