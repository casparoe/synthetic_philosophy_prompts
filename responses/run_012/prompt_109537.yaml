prompt: |-
  So my friend runs a second-year seminar on rationality and games, and she's roped me into guest-teaching one session — I write novels, I'm not a philosopher, but she says I'm good at staging scenes with constraints, and she wants the students to *feel* something before she names it. The topic she's handed me is the superrationality stuff: the Platonia dilemma and the luring lottery. 20 students, one 70-minute slot, and I get to run it however I want as long as it's a game they play, not a lecture.

  Can you design the activity? Here's what I'm after.

  Round one should be the telegram thing: a mysterious benefactor (me, in character) offers a big single prize to the one and only person who acts by some deadline, and if nobody acts or more than one acts, no one gets anything, and talking is forbidden. I want the room to *hit* the failure themselves — either everybody sends or nobody does, and I want to be able to tell those two failures apart in the debrief. Round two should be the lottery: everyone secretly writes a whole number on a card, the pot gets divided by the total of everyone's numbers, and a winner is drawn from the entries (so writing a bigger number buys you more chances but shrinks what's left to win). I'm expecting a runaway, a couple of people writing absurd numbers to spoil it for everyone, and some resentment — which I'd like to redirect at the structure rather than the jokers.

  I need: the exact rules for both rounds, what materials to bring (cards, envelopes, a box, candy or tokens for the pot — no real money, and nothing that smells like gambling for the undergrads), the payoff scheme written out so it's actually playable, a minute-by-minute timeline for the 70 minutes, and a second pass at round one where they're allowed a private randomiser (a die, a phone) so we can compare what changes. Then the debrief, mapping each moment of what happened onto the ideas — including the symmetric-reasoning move where you ask "what if everyone reasons the way I'm reasoning," and why that lands on randomising with a probability tied to how many people are playing, and why the lottery's best-response number is "however many entries everyone else submitted," which is what makes it explode.

  Two things I especially want from you. First, tell me what will predictably go wrong the first time I run this and how to handle it in the moment — including the case where the students try to cheat by silently coordinating, and the case where the small stakes make them goof around in a way the real thing wouldn't have allowed. Second, be honest about what this activity *can't* reproduce and what I'll have to just tell them afterwards. I know I can't fake a billion dollars, and I know the toy version can't really make anyone feel an astronomically large number. Say it straight.

  Also, dont name superrationality at the top — they should be in the middle of it before they hear the word. And if it helps, I'm happy to bring my laptop and run the lottery draw off a three-line script, since doing it by hand with big numbers sounds miserable.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**
      *   **User:** Novelist guest-teaching a 2nd-year seminar on Rationality & Games.
      *   **Goal:** Run a 70-minute interactive session (no lecture) on Superrationality (Platonia Dilemma & Luring Lottery) without naming the concept upfront.
      *   **Structure:**
          *   Round 1: Platonia Dilemma (Telegram style). One prize, only if exactly one person acts. No talking.
          *   Round 2: Luring Lottery. Write a number. Pot divided by sum of numbers. Winner drawn proportional to number.
          *   Round 1.5 (Optional/Modified): Round 1 again with private randomizers.
          *   Debrief: Connect experience to theory (symmetric reasoning, $1/N$ probability, best-response explosion).
      *   **Constraints:** 20 students, no real money (tokens/candy), no gambling vibes, need exact rules, materials, timeline, payoff scheme.
      *   **Specific Requests:** Predict failure modes (cheating, low stakes goofing), admit limitations (can't fake billions), keep "superrationality" hidden until debrief.
      *   **Tone:** Practical, instructional, slightly dramatic (fitting a novelist), honest about limitations.

  2.  **Deconstruct the Games:**

      *   **Game 1: The Platonia Dilemma (Telegram Problem).**
          *   *Mechanism:* Binary choice (Send/Don't Send). Payoff: High if exactly 1 sends. 0 if 0 or >1 send.
          *   *Nash Equilibrium:* Mixed strategy. Everyone sends with probability $p = 1/N$.
          *   *Superrational Solution:* Same as Nash here, but derived via "if I do X, everyone like me does X."
          *   *Classroom Reality:* Students will likely all send (greed) or all don't send (fear). Getting exactly one is hard without coordination.
          *   *Twist:* The prompt asks for a "Round 1.5" with randomizers. This is crucial for demonstrating the mixed strategy solution.

      *   **Game 2: The Luring Lottery.**
          *   *Mechanism:* Choose integer $n \ge 1$. Pot $P$. Total entries $S = \sum n_i$. Share = $P/S$. Probability of winning = $n_i / S$. Expected Value = $(n_i/S) * (P/S) = P * n_i / S^2$.
          *   *Incentive:* If others pick small, you pick huge to dominate the probability. If everyone picks huge, the share becomes negligible.
          *   *Nash Equilibrium:* There is no pure strategy Nash equilibrium. It diverges. Everyone wants to go higher.
          *   *Classroom Reality:* Someone will write "1,000,000" or "infinity". The pot per ticket becomes worthless. Resentment will occur.

  3.  **Drafting the Plan - Section by Section:**

      *   **Materials:** Need to be low-tech but effective. Envelopes, slips of paper, pens, a "Pot" (jar of distinct tokens/candy), a box for collection. Laptop for the lottery calculation (as suggested).
      *   **Payoff Scheme:** Since no real money, use "Course Credit Points" or "Novelist Favors" or just "Bragging Rights + Candy". Let's go with a "Grand Prize" (a nice hardcover book or similar) + small candy for participation. This avoids gambling regulations but keeps stakes tangible.
      *   **Timeline:** 70 mins is tight.
          *   Intro (5)
          *   Round 1 (15)
          *   Debrief 1 (10)
          *   Round 1.5 (10)
          *   Round 2 (20)
          *   Final Debrief (10)
          *   *Correction:* That's 70. Need to be precise.
      *   **Rules:** Must be airtight to prevent cheating but allow the dilemma to emerge.
      *   **Failure Modes:**
          *   *Cheating:* Students signaling. *Fix:* Strict silence, heads down, collect papers simultaneously.
          *   *Low Stakes:* They treat it as a joke. *Fix:* Frame it seriously. "This is a test of logic, not luck."
          *   *Lottery Explosion:* One person writes $10^{100}$. *Fix:* Acknowledge it as the *point* of the game, not a ruin.
      *   **Limitations:** Can't feel the weight of a billion dollars. Can't truly simulate infinite recursion.

  4.  **Refining the "Superrationality" Reveal:**
      *   Don't use the word until the end.
      *   Focus on "Symmetric Reasoning" or "Mirroring."
      *   Key insight: "If I am rational, and you are rational, and we face the same info, we should come to the same conclusion."

  5.  **Developing the Script/Rules:**

      *   *Round 1:* "The Silent Signal." One prize. If exactly one hand goes up/paper submitted, they win. If 0 or 2+, no one wins.
      *   *Round 1.5:* "The Weighted Die." Same rules, but you can decide based on a die roll (1-6). This introduces $p < 1$.
      *   *Round 2:* "The Bidding War." Pot is fixed. You write a number. More numbers = more chance to win, but pot is divided by total sum of numbers.

  6.  **Addressing the "What Will Go Wrong" & "Limitations":**
      *   *Wrong:* Someone laughs and writes "Infinity". *Response:* Validate it. "That's the logical endpoint."
      *   *Wrong:* They talk. *Response:* Disqualify the round immediately.
      *   *Limitation:* Real money changes risk tolerance. Candy doesn't trigger loss aversion the same way.

  7.  **Writing the Response:**
      *   *Voice:* Professional, collaborative, slightly theatrical (matching the user's novelist persona).
      *   *Structure:*
          1.  Prep & Materials.
          2.  The Script (Rules & Flow).
          3.  The Timeline.
          4.  The Debrief (The "Name Drop").
          5.  Failure Modes & Mitigation.
          6.  Honest Limitations.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I include the randomizer round? Yes, Round 1.5.
      *   *Check:* Is the lottery math clear? Need to ensure the script handles big numbers. I'll suggest a simple Python script or Excel sheet.
      *   *Check:* Is the "Superrationality" term hidden? Yes, until the debrief.
      *   *Check:* Payoff scheme. Make sure it's clear how the lottery winner is decided. (Weighted random draw).
      *   *Check:* 20 students. $1/N$ is 5%. In Round 1.5, rolling a 6 on a d6 is ~16%. Rolling a 20 on a d20 is 5%. Suggest d20 or phone app. Let's suggest phone randomizer for precision (1-20).

  9.  **Final Polish:** Ensure the distinction between Nash Equilibrium and Superrationality is clear in the debrief notes, even if not named early. (Actually, for 2nd years, keep it simple: "Individual Rationality" vs "Group/Shared Rationality").

      *Wait, one nuance:* In the Platonia dilemma, the Superrational solution *is* the Mixed Strategy Nash Equilibrium ($p=1/N$). The distinction is in *why* you choose it. Nash: "I randomize to make others indifferent." Superrational: "I randomize because if I don't, everyone like me won't either, and we all lose." I need to make sure the debrief captures this distinction without getting bogged down in math.

      *Lottery Nuance:* The prompt says "best-response number is 'however many entries everyone else submitted'." Actually, in the Luring Lottery, if the pot is divided by the *sum* of numbers, and probability is *number/sum*, the EV is $n_i / S * P / S = P n_i / S^2$. If everyone else plays $k$, and I play $x$, $S = (N-1)k + x$. I want to maximize $x / ((N-1)k + x)^2$. This actually has a finite maximum if $N$ is fixed. Wait, Hofstadter's Luring Lottery usually implies the pot is fixed, but the *share* is $1/S$. If the probability of winning is also proportional to $n_i$, then EV $\propto n_i / S^2$.
      *Correction:* Hofstadter's original formulation: "Submit a positive integer. The prize is $1,000,000 / S$. One winner is chosen at random, with probability proportional to submission."
      Expected Utility for player $i$: $U_i = \frac{n_i}{S} \times \frac{P}{S} = P \frac{n_i}{S^2}$.
      If everyone plays $k$, $S = Nk$. $U = P \frac{k}{N^2 k^2} = \frac{P}{N^2 k}$.
      To maximize utility, you want $k$ to be small (for the group), but individually, if others play small, you can increase $n_i$ to increase your probability share faster than you decrease the pot share *initially*.
      Actually, the standard "explosion" happens because there is no upper bound. If I think everyone will play 1, I should play a large number to dominate the probability. If everyone thinks that, $S$ explodes, and $P/S$ goes to zero.
      I need to make sure the rules reflect this "no upper bound" dynamic.

      *Let's re-verify the "best response" claim in the prompt:* "why the lottery's best-response number is 'however many entries everyone else submitted,' which is what makes it explode."
      If others submit sum $S_{-i}$, and I submit $n_i$. Total $S = S_{-i} + n_i$.
      My EV $\propto \frac{n_i}{(S_{-i} + n_i)^2}$.
      Derivative w.r.t $n_i$: $\frac{(S_{-i} + n_i)^2 - n_i \cdot 2(S_{-i} + n_i)}{(S_{-i} + n_i)^4} = 0$.
      $(S_{-i} + n_i) - 2n_i = 0 \Rightarrow S_{-i} = n_i$.
      Yes! The optimal move is to match the sum of everyone else's numbers. If everyone reasons this way, it diverges. Okay, the math checks out. I will include this derivation in the debrief notes for the user.

  10. **Final Review against constraints:**
      *   70 mins? Yes.
      *   20 students? Yes.
      *   No real money? Yes.
      *   No "Superrationality" word until end? Yes.
      *   Predict failures? Yes.
      *   Honest limitations? Yes.

      *Ready to write.*
answer: |-
  Here is a complete run-sheet for your 70-minute session. It is designed to be run like a rehearsal: tight, atmospheric, and mechanically precise so the *logic* creates the drama, not you.

  ### **Part 1: Preparation & Materials**

  **The Vibe:**
  You are not a teacher today. You are the **Adjudicator**. Dress slightly sharper than usual. Bring a physical timer. Do not smile until the debrief. The tension comes from the silence and the stakes.

  **Materials List:**
  1.  **20 Small Envelopes** (sealed, empty).
  2.  **20 Slips of Paper** (fit inside envelopes).
  3.  **20 Pens.**
  4.  **One "Pot" Container:** A clear jar filled with 100 distinct tokens (poker chips, wrapped candies, or glass marbles). *Visual weight matters.*
  5.  **One "Submission" Box:** A locked cash box or a sealed shoebox with a slit.
  6.  **The Grand Prize:** One tangible, desirable object (a hardcover book, a nice bottle of wine, a gift card). Do not use cash.
  7.  **Randomizers:** Ask students to bring smartphones (for the random number generator app) or bring 20 six-sided dice.
  8.  **Laptop & Projector:** With a simple script ready to run the Lottery draw (see below).

  **The Payoff Scheme (The "Contract"):**
  Write this on the board before they enter.
  *   **Round 1:** One Winner takes the Grand Prize. Condition: Exactly one submission.
  *   **Round 2:** One Winner takes the Grand Prize. Condition: Weighted lottery based on numbers written.
  *   **Consolation:** Everyone keeps the tokens in the Pot jar *if* the total sum of numbers in Round 2 is under 500. (This creates a secondary cooperative incentive).

  **The Laptop Script:**
  You need to calculate: $Total = \sum(\text{numbers})$. Then pick a random number between 1 and $Total$. Then iterate through the list to find whose "slice" of the number line that falls into.
  *If you aren't coding, use this Excel logic:* Column A = Names, Column B = Number, Column C = Cumulative Sum. `RANDBETWEEN(1, Total)` tells you the winning ticket number. Match it to Column C.

  ---

  ### **Part 2: The Timeline (70 Minutes)**

  #### **0:00 – 0:05 | The Setup**
  *   **Action:** Lock the door. Stand at the front. Silence.
  *   **Script:** "Put away your phones. No talking. No signaling. If you speak, you are disqualified from all rounds. I am holding the Grand Prize [hold it up]. There is only one. I will run two games. In both games, your rationality is the only tool you have. In both games, if you play 'optimally' individually, you may destroy the value for everyone. Begin."
  *   **Handout:** Pass out one slip, one pen, one envelope per person.

  #### **0:05 – 0:20 | Round 1: The Telegram (Platonia)**
  *   **Rules:** "You have 3 minutes. Inside the envelope, write either 'YES' or 'NO'. Seal it. If exactly **one** person submits 'YES', that person wins the Prize. If **zero** people submit 'YES', no one wins. If **two or more** submit 'YES', no one wins. 'NO' entries do not win but count toward the total."
  *   **Constraint:** "You cannot know what others will do. You cannot coordinate. You are all identical rational agents from my perspective."
  *   **Action:** Collect boxes. Count the 'YES' slips publicly.
  *   **Outcome:**
      *   *0 YES:* "Collective fear. The prize vanishes."
      *   *2+ YES:* "Collective greed. The prize vanishes."
      *   *1 YES:* (Rare) "Luck, or perfect symmetry."
  *   **Time:** 3 min decision, 5 min counting/reveal, 2 min silence to let it sink in.

  #### **0:20 – 0:30 | Debrief 1: The Symmetry Trap**
  *   **Do not name the concept yet.**
  *   **Ask:** "Raise your hand if you wrote YES because you thought no one else would." (Usually many hands).
  *   **Ask:** "Raise your hand if you wrote YES because you wanted the prize." (All hands).
  *   **Point:** "You all reasoned the same way. You are all in this class. You all heard the same rules. If *you* found a reason to say YES, isn't it likely *they* found the same reason? If everyone reasons 'I should say YES', everyone says YES, and everyone loses."
  *   **The Pivot:** "How do you break the symmetry? You need to make your move unpredictable, even to yourself."

  #### **0:30 – 0:40 | Round 1.5: The Weighted Die**
  *   **Rules:** "Same game. One Prize. Exactly one 'YES' wins. But now, you must use a randomizer. Roll a die (or use phone RNG 1–20). If you roll a 1, you MUST write 'YES'. If 2–20, you MUST write 'NO'."
  *   **Why:** This forces a probability $p = 1/20$. With 20 students, the expected number of YES votes is $20 \times (1/20) = 1$.
  *   **Action:** Run the round. Collect. Reveal.
  *   **Likely Outcome:** You might still get 0 or 2+, but the *distribution* will be tighter. If you get exactly one, highlight it. "You didn't coordinate. You synchronized."

  #### **0:40 – 0:55 | Round 2: The Luring Lottery**
  *   **Rules:** "New Slip. Write a positive whole number (1, 2, 100, 1,000,000). No upper limit."
  *   **Mechanism:** "I will sum all the numbers. The Pot (The Grand Prize) is divided by that Sum. That is the value of a single ticket. Your chance of winning is your Number divided by the Sum."
  *   **Example:** "If Total Sum is 100, and you wrote 10, you have 10% chance to win, but the Prize is worth 1/100th of its face value."
  *   **Incentive:** "Writing a bigger number increases your chance of winning, but decreases the value of the win for everyone, including you."
  *   **Action:** 5 minutes to write. Collect.
  *   **Calculation:** Input numbers into your laptop script while they watch the screen.
  *   **The Reveal:** Show the Total Sum. Show the "Value per Ticket." Announce the winner.
  *   **Expected Chaos:** Someone will write a massive number (e.g., 1,000,000). The "Value per Ticket" will plummet to near zero. The winner will win a "hollow" victory.

  #### **0:55 – 1:10 | Final Debrief: Naming the Ghost**
  *   **Now you name it.**
  *   **Superrationality:** "In Round 1, standard rationality says 'Maximize my chance'. If I think others won't act, I act. But if we are *superrational*, we assume our reasoning is mirrored. If I act, they act. So I must act only with probability $1/N$."
  *   **The Lottery Explosion:** "In Round 2, the 'Best Response' to a total sum $S$ (from others) is to write $S$ yourself. This maximizes your expected value. But if everyone does that, $S$ doubles, so you double your number again. It runs away to infinity. The prize value goes to zero."
  *   **Closing:** "Rationality without coordination is a tragedy. Superrationality is the attempt to coordinate without speaking."

  ---

  ### **Part 3: What Will Predictably Go Wrong (And How to Fix It)**

  **1. The "Giggle" Factor (Low Stakes)**
  *   **Problem:** Because it's candy or a book, not $1 million, students might treat Round 2 as a joke. One student writes "Infinity" or "LOL" just to see what happens.
  *   **Fix:** Pre-empt this in the intro. "If you write a non-integer or a joke, you are disqualified, but your entry still counts toward the Sum that ruins the pot for everyone else. You can be a martyr, but know you are actively destroying your classmates' odds."
  *   **In the Moment:** If someone writes "Infinity," validate it seriously. "This is the logical endpoint. If the rules allow infinite bids, the value of the prize is mathematically zero. This student has correctly identified the flaw in the game design."

  **2. Silent Coordination (Cheating)**
  *   **Problem:** In Round 1, students might try to signal. Coughing, tapping, or pre-arranging "Person in seat 5 says YES."
  *   **Fix:** Enforce "Heads Down" during the decision window. Walk the room. If you suspect collusion, **void the round immediately.** Say: "The experiment is contaminated. We get no prize. We move on." The threat of losing the prize due to *someone else's* cheating is a powerful silencer.

  **3. The "Zero" Round 1**
  *   **Problem:** Everyone writes "NO" out of fear. You have no winner to interview.
  *   **Fix:** This is actually a *better* teaching moment than a win. "Look at this. 20 people wanted the prize. 0 people claimed it. This is the tragedy of the commons. You collectively agreed to starve."

  **4. The Lottery Math Meltdown**
  *   **Problem:** You can't calculate the weighted draw by hand with big numbers.
  *   **Fix:** Use the laptop script. If the numbers are *too* big (e.g., someone writes $10^{100}$), the script might overflow.
  *   **Contingency:** Have a rule: "Numbers over 10,000 must be written in scientific notation." Or, simply acknowledge: "The number is so large the prize value is effectively zero. We don't need to draw. The house wins."

  ---

  ### **Part 4: Honest Limitations (What You Can't Fake)**

  You asked for straight talk on what this activity cannot reproduce. Put this in your back pocket for the Q&A or the final wrap-up.

  **1. The "Blood in the Water" Problem**
  *   **Reality:** In the real Platonia Dilemma (or a nuclear standoff), the cost of failure is catastrophic, not just "no candy."
  *   **Limitation:** Students are risk-seeking with candy. They might say "YES" just for the thrill. With real life-or-death stakes, the "NO" vote becomes much heavier. You cannot simulate *fear* accurately in a classroom.
  *   **What to say:** "You played boldly because the worst case was losing a book. If the cost of '2+ YES' was imprisonment, the equilibrium shifts. Superrationality changes when the payoff matrix includes trauma."

  **2. The "Common Knowledge" Assumption**
  *   **Reality:** The math assumes everyone knows everyone is rational, and everyone knows that everyone knows that... (infinite recursion).
  *   **Limitation:** In your class, there is always one skeptic, one joker, or one person who didn't sleep. The "mirror" is cracked.
  *   **What to say:** "Superrationality assumes we are identical processors. You aren't. You have different risk tolerances. That's why the 'Randomizer' round is safer—it accounts for human noise."

  **3. The Scale of the Lottery**
  *   **Reality:** Hofstadter's original lottery involved millions of dollars and mail-in entries. The "explosion" happens over weeks of iteration.
  *   **Limitation:** You are doing it in 5 minutes. The "resentment" phase is truncated. They won't feel the slow dread of the pot shrinking; they'll just see the final number.
  *   **What to say:** "In the real version, you watch the pot shrink day by day. You see your neighbors bidding higher. You feel the anger. Here, you just see the math. Don't confuse the clean result with the messy emotion."

  ### **Part 5: The Novelist's Edge**

  Since you are a writer, use the **silence** as a tool.
  *   In Round 1, when they are deciding, turn off the lights if possible. Or just stand perfectly still.
  *   When revealing the Round 2 Total Sum, if it's huge, don't speak for ten seconds. Let them feel the waste.
  *   The goal isn't to teach them the math (their professor will do that). The goal is to make them feel the **itch** of the dilemma. The feeling that "I did the right thing, but we all lost."

  If you can make them feel that frustration, you've done your job. The philosophy is just the label they put on the scar afterwards.
