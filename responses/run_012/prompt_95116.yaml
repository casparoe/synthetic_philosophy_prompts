answer: |-
  ### Bottom Line
  The disagreement is fundamentally ontological, centering on whether manifold points possess intrinsic identity independent of the physical fields defined upon them. Your hypothesis is correct: the stalemate persists because substantivalists and relationalists employ incompatible criteria for individuation, forcing divergent conclusions about whether diffeomorphic models represent distinct physical possibilities. Consequently, the debate reduces to whether general covariance reveals a radical indeterminism in nature or merely a redundancy in our mathematical representation of spacetime.

  ### What the Sides Are Actually Committing To
  The substantivalist insists that manifold points are ontological primitives, akin to empty containers that exist prior to being filled by physical fields. For them, applying a diffeomorphism inside the hole shifts which specific point bears which metric value, creating a genuinely distinct physical state even if all observable relations remain unchanged. Their modal commitment is haecceitistic: they believe it is a meaningful fact that *this* specific point rather than *that* one holds the curvature, implying the future distribution of fields across specific points is not fixed by past data. They accept that the theory is indeterministic because the laws cannot specify which point gets which property.

  The opposing side treats manifold points as mere placeholders within a structural network, possessing no identity over and above the metric and matter fields defined on them. They argue that shifting fields across points is merely a change of description, not a change in the world, because points are individuated solely by their structural role. Their modal commitment denies haecceitism: since points lack independent identity, there is no possible world where the physical structure is identical but assigned to different points. Consequently, they view the two models as representing a single physical reality, rendering general covariance a gauge symmetry rather than a source of indeterminism. They claim the substantivalist mistakes mathematical redundancy for physical possibility, insisting that physical reality is invariant under smooth relabeling. This forces a choice between accepting radical indeterminism or denying that spacetime points are individuals.

  ### My Day-Job Analogy, Does It Hold
  Your deduplication move is structurally identical to the relationalist's quotienting, but it presupposes the ontology rather than proving it. When you quotient customer records, you assume the 'customer' is the invariant structure beneath the IDs, treating IDs as noise. The relationalist does the same for spacetime, treating point labels as noise and the metric structure as the customer. However, this does not refute the substantivalist; it merely changes the subject. The substantivalist claims the 'ID' (the manifold point) is part of the reality, not just a tag. Quotienting asserts that point-identity is gauge redundancy, which is exactly what the substantivalist denies. Thus, adopting the quotient formalism doesn't solve the metaphysical dispute; it encodes the relationalist victory into the mathematics, renaming substantivalism rather than disproving it. This shifts focus to equivalence classes, which the substantivalist rejects.

  ### What Would Count as Progress
  Progress will not come from formal results, as the mathematics of diffeomorphism invariance is already settled. Instead, progress requires shifting the question from classical GR to quantum gravity, where the smooth manifold structure likely breaks down. If a future theory lacks a fundamental manifold, the Hole Argument becomes obsolete, dissolving the dispute by removing its ontological substrate. Alternatively, progress could be a pragmatic consensus to treat the debate as metaphysical baggage irrelevant to physical practice, akin to ignoring Bohr's interpretation once decoherence handled the predictions. Until spacetime points are empirically accessible or eliminated by a deeper theory, the stalemate remains a feature of our conceptual framework, not a solvable problem within classical physics. We need a theory where points are not fundamental to decide if they are really real.
