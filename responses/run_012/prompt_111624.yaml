answer: |-
  Here is the ranking based on your metric: **loss of systemic complexity** (bureaucracy, literacy, urbanization, trade networks) rather than population decline. I have ordered them from "Most Deserving of the Label" to "Least Deserving."

  ### 1. Late Bronze Age Mediterranean (c. 1200 BCE)
  **Collapse Score: 0.75**

  **The Reasoning:**
  This is the closest to a "1" on your scale because the *international system* didn't just weaken; it ceased to exist. The complexity loss was absolute in specific regions. In Mycenaean Greece, the palatial bureaucracy vanished, and with it, Linear B writing disappeared for four centuries. In Anatolia, the Hittite state dissolved entirely, and their capital was abandoned. The long-distance trade network that moved tin, copper, and luxury goods fractured so severely that the "globalized" economy of the Mediterranean regressed to localized subsistence. While Egypt survived, it did so as a shadow of its former self, losing its empire. The division of labor collapsed because the patrons (the palaces) were gone.

  **The Single Most Overstated Claim:**
  *"The Sea Peoples invaded and destroyed everything."*
  Popular history treats the Sea Peoples like a meteor strike—an external force that hit a healthy system. The archaeological record shows the systems were already brittle (earthquakes, drought, internal rebellion). The Sea Peoples were largely refugees *produced* by the collapse, not just the cause of it. Framing them as the sole aggressor ignores that this was a systemic failure of the state model itself, not just a military defeat.

  ### 2. Indus Valley Civilization (c. 1900–1300 BCE)
  **The Reasoning (Added Case):**
  I'm adding the Indus (Harappan) Civilization because it fits your "mystery disappearance" criteria better than Rome. This scores high on complexity loss because the defining features of the civilization were urban planning and standardization. The great cities (Mohenjo-Daro, Harappa) were de-urbanized. The undeciphered Indus script vanished completely. The standardized brick ratios and weight systems that unified a million square kilometers disappeared. People didn't die out, but they "ruralized," shifting from a state-level society to smaller, regional farming cultures. The *machinery* of the civilization was dismantled, even if the people remained.

  **The Single Most Overstated Claim:**
  *"An Aryan Invasion wiped them out."*
  This is the "Sea Peoples" equivalent for the Indus. There is no archaeological evidence of mass slaughter or conquest at the time of de-urbanization. The verdict flips when you look at climate data: the monsoon patterns shifted, and the rivers they relied on dried up or changed course. The "collapse" was a logistical unbinding caused by climate change, forcing a shift from urban trade to rural farming, not a genocide.

  ### 3. Classic Maya (c. 800–950 CE)
  **Collapse Score: 0.50**

  **The Reasoning:**
  This is the definition of "new management" rather than total erasure. The collapse was strictly regional (Southern Lowlands) and political (Divine Kingship). The complexity loss was real: monument building stopped, dynastic records ceased, and large-scale irrigation systems in places like Tikal were abandoned. However, the Northern Lowlands (Chichen Itza, Mayapan) actually entered a golden age *after* the Southern collapse. Writing continued in the Post-Classic period. Farming techniques persisted. The language never died. Because half the civilization (the North) thrived while the other half (the South) de-urbanized, and because the population remained genetically and culturally continuous, it sits squarely in the middle.

  **The Single Most Overstated Claim:**
  *"The Maya vanished into the jungle."*
  This claim conflates the end of a specific political ideology (the *k'uhul ajaw* or divine king system) with the end of a people. The verdict flips on the existence of millions of modern Maya speakers. The "collapse" was a failure of the brand (the kings), not the company (the society).

  ### 4. Rapa Nui / Easter Island (Pre-Contact to 18th Century)
  **Collapse Score: 0.20**

  **The Reasoning:**
  On your scale of complexity loss, Rapa Nui scores lowest because it had the least complexity to lose. There were no cities, no state bureaucracy, and no deciphered writing system (Rongorongo is debated and likely ritualistic). The popular narrative suggests a total societal suicide before Europeans arrived. In reality, the "collapse" was primarily the cessation of statue (moai) carving and the toppling of existing ones. However, agricultural production (sweet potato, taro) continued successfully using rock gardening techniques. The social structure shifted from chiefdoms to family clans, but the society remained functional and stable until *after* European contact. The real population crash (90%+) happened due to slave raids and disease in the 18th and 19th centuries, not pre-contact ecocide.

  **The Single Most Overstated Claim:**
  *"Pre-contact cannibalism and civil war destroyed the population."*
  The evidence for widespread cannibalism is thin and often misidentified ritual practice. The verdict flips when you separate pre-contact from post-contact archaeology. The society adapted to deforestation by shifting crops; they didn't starve themselves to death. Calling it a "collapse" ignores that the society was resilient until external actors (Europeans/Peruvian slavers) arrived.

  ### Summary of the Scale
  *   **0.75 (LBA):** The operating system crashed; hardware remained but had to be rebuilt from scratch.
  *   **0.65 (Indus):** The urban network dissolved; users switched to a offline, local mode.
  *   **0.50 (Maya):** The CEO was fired and the HQ moved; the company kept trading.
  *   **0.20 (Rapa Nui):** The marketing campaign stopped; the business remained profitable until competitors burned it down.
