      *Added Case:* Western Rome is too cliché. Indus is good. Or maybe **Angkor Khmer**. Angkor is great because the city was abandoned due to water infrastructure failure, but the *state* moved to Phnom Penh. Buddhism replaced Hinduism. Complexity shifted, didn't vanish. Score 0.4. Actually, Indus is a stronger parallel to the "mystery disappearance" vibe of the other three. I'll stick with Indus.

      *Wait, one more check on the "Overstated Claim".*
