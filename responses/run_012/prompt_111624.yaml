prompt: |-
  Hey, I'm building a little scale for a project and keep going back and forth, so I want your take. Take the classic "society collapsed" cases everyone trots out -- the Late Bronze Age Mediterranean, the Classic Maya, and Rapa Nui/Easter Island. Rank them by how much what actually happened deserves the word collapse rather than "a bunch of the same people kept living there, just under new management." Give each a score from 0 (nothing really ended, it's a rebranding) to 1 (total; the language, the cities, the farming, all gone), and for each one name the single most overstated piece of the popular story. I'm anchoring the scale to loss of complexity -- division of labor, cities, writing, long-distance trade -- not just body count, since those can come apart. And add one more case you think belongs in the list and score it the same way. I care more about the reasoning and about which specific claim flips the verdict than about the exact numbers, so dont just give me Diamond vs the revisionists in general terms.
