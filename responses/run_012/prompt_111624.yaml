          *   *Complexity Loss:* High in specific areas (Greece/Anatolia), lower in others (Egypt/Levant).
          *   *Score:* Needs to reflect the loss of palatial bureaucracy but continuity of population. Maybe around 0.7?
          *   *Overstated Claim:* "The Sea Peoples wiped out civilizations." (It was more systemic failure + migration, and Egypt held the line). Or "Total depopulation." (People stayed, just poorer). Let's go with the "Total Civilizational Death" idea.
          *   *Refinement:* The prompt asks for loss of *complexity*. Linear B is gone. Palaces are gone. Long-distance trade stops. That's a big hit to complexity. But did *everyone* go back to the stone age? No.
          *   *Score Adjustment:* 0.75. It was a systemic crash of the *international* order, but local continuity existed.

      *   **Case 2: Classic Maya (c. 800-950 CE)**
          *   *Popular Narrative:* They vanished into the jungle. Aliens? Ecocide? Everyone died.
          *   *Reality:* Southern lowland cities abandoned. Monumental building stopped. Dynastic records end. *However*, Maya people are still there. Northern lowlands (Chichen Itza, Mayapan) flourished later. Language persisted. Farming persisted.
          *   *Complexity Loss:* High in the South (Tikal, Calakmul), Low in the North. Writing stopped in the South, continued in the North (Post-Classic).
          *   *Score:* 0.6. The specific *political system* of the divine kings in the south collapsed, but "Maya civilization" didn't end.
          *   *Overstated Claim:* "The Maya disappeared." (They didn't, millions of descendants live there today).

      *   **Case 3: Rapa Nui (Easter Island)**
          *   *Popular Narrative:* Ecocide. Cut all trees, statues fell, cannibalism, population crashed before Europeans arrived. Total self-destruction.
          *   *Reality:* Deforestation happened (rats + humans). Statues were toppled (mostly post-contact civil strife). Population was stable/declining slowly before Europeans. *However*, the *complexity* of statue carving stopped. But farming (sweet potato) continued.
          *   *Complexity Loss:* Low. It was a small society to begin with. No cities, no writing (Rongorongo is debated/undeciphered). The "collapse" is mostly about the statue culture ending.
          *   *Score:* 0.3. It's more of a cultural shift than a systemic collapse of complexity, especially since the real population crash was due to disease/slaving *after* contact.
          *   *Overstated Claim:* "Pre-contact cannibalism and total societal suicide." (Evidence is thin; the real disaster was European contact).

      *   **Case 4: The Added Case**
          *   *Options:* Western Rome, Indus Valley, Angkor, Mississippian (Cahokia).
