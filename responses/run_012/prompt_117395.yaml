answer: |-
  Good evening. Looking out from this marquee, with the tide coming in over the quay, it feels entirely appropriate that our golden anniversary should centre on a puzzle about water and wood. For forty-one years I worked in marine geochemistry, measuring sediment cores. Since I left the laboratory, I have taken up philosophy. It is a regrettable hobby. It has ruined my ability to treat the old story of the ship whose planks are replaced one by one as a parlour game. It has become a practical question about our own boat.

  We know the facts. None of them are in dispute. She was built in 1912. The Trust bought her fifty years ago. She has been re-planked twice. In 1998, every plank, every deck beam, all but eleven frames were renewed. What survives from the launch year is the keel, the stem, the sternpost, the bell, the log books, and the name. The shipwright who did the work kept the old planking. He held, loudly, that a boat is her keel and her skin. Those timbers are now reassembled in the county museum, accessioned as the original boat. Meanwhile, a benefactor has provided a new hull, which will take our name and bell in the spring.

  So, which of these three is the vessel we are toasting tonight? The museum hull? The new build? Or the old girl floating outside, finishing her last season at sea?

  In my trade, I could tell you when the oak was felled. Tree-ring dating gives the year; stable isotopes suggest the forest. We can measure the material continuity with precision. But answering the question of which timber is original settles nothing about identity. There is a difference between measuring a fact and deciding how to count. The underwriters want a sentence in the policy defining the vessel for cover. The curator has a different sentence for her accession papers. These are stipulations. They are useful for insurance and catalogues, but they are not discoveries. They do not tell us where the soul of the thing resides.

  There is an austere view that strictly there are no boats at all, only timbers and fastenings arranged boatwise. I respect that view. It is scientifically tidy. But I reject it, not because it is silly, but because it is useless for people who intend to sail. If we are only atoms, there is no Trust, no crew, and no dinner. We must carve the world into objects that endure.

  Some argue for the museum boat. She has the original skin. But a boat that cannot sail is a sculpture. She has the matter, but she has lost the habit of going to sea. Others look to the new boat. She will have the name. But a name can be transferred like a licence plate.

  I argue for the boat currently afloat. She holds the continuous thread of causal history. She carries the log books that record every voyage since 1974. She carries the crew who know her handling. She carries the function for which this Trust was established. Identity over time is not just about the stuff you are made of; it is about the story you are living. The earlier and later stages of this vessel are parts of one thing, as much as her bow and stern are parts of her now. To say the museum hull is the original is to ignore the life lived between the planks.

  I know the coxswain has no patience with this. He is eighty-three. He knows the boat by the way she answers the helm, not by a philosophical argument. He knows that if you change the engine, the sails, and the wood, but the feeling in the tiller remains, the boat remains. He is right. The museum has a relic. The new boat has a future. But this boat has our past and our present.

  So, when the underwriters ask what counts as the vessel, they may write what they like. But for this Trust, the vessel is the continuity of use. We are not stipulating an answer tonight; we are acknowledging a history.

  Please raise your glasses. To the log books, to the keel, and to the habit of going to sea. To the boat that carries us.
