      *   *Actually, looking closer:* The argument hinges on the idea that *any* choice can be diagnosed as distorted from an earlier standpoint. This is the "Genetic Fallacy" of rationality. Just because I was enthusiastic when I made the contract doesn't mean the contract is invalid, unless that enthusiasm constituted a *distortion of judgment* relative to my stable values.
