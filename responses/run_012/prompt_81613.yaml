      *   **Pricing the Alternative (Keeping 2, Denying 4):**
          *   You must adopt a **substantive theory of agency**. You can't just say "binding works." You must say *which* self has authority. Usually, the "Planning Self" (Bratman) or "Reflective Self" (Frankfurt).
          *   Cost: You lose the pure proceduralism. You have to make claims about what counts as "distortion."
      *   **Degrees of Authority:**
          *   Yes, this helps. Authority isn't binary. The binding self has *more* authority than the tempted self, but not *infinite* authority over a hypothetical prior self. It dissolves the "all-or-nothing" regress.
      *   **Constitutional Analogue:**
          *   Does it carry over? Yes, but with a twist. The "People" vs. "Government." The regress here is the "Dead Hand Problem."
