      *   Cost: You must accept that some standpoints are *structurally* privileged (e.g., cool vs. hot, reflective vs. impulsive), not just temporally prior.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication. This is a version of the "Regress of Justification" applied to diachronic agency. It's a known problem (Elster, Schelling, Bratman).
