  **Note**

  The poem takes a liberty in presenting the escalation as a spoken persuasion; in practice, the trap often snaps shut in silence, driven by mutual knowledge of the payoff structure rather than dialogue. Regarding the analysis: it is settled that once bids exceed the dollar's value, backward induction no longer dictates quitting because the second-highest bidder rule changes the marginal payoff. At that point, bidding more is locally rational under standard expected utility theory—it minimizes loss given the obligation to pay if you lose. What is contested is whether entering the auction is rational ex ante, or if human entry relies on bounded rationality and misjudging the opponent's threshold. The war-of-attrition model explains the structure but arguably redescribes the behavior rather than explaining why agents ignore the negative expected value of the game as a whole. On the empirical claim: there is moderate confidence that warnings reduce entry rates but do not eliminate escalation once bidding has begun. Experimental data suggests that knowing the trap exists rarely inoculates participants against the local logic of loss minimization once they are committed to the second-highest position.
