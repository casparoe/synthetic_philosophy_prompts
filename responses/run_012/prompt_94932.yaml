prompt: |-
  I'm in a reading group thats been chewing on the "is the world getting less violent" question for like three months and we've stalled out, mostly because we can't agree on what even counts as violence. Before you answer anything, actually think this through and brainstorm on paper first -- dont just pattern-match to the usual optimist-vs-critics debate, thats not what I need. Put on the hat of a philosopher of social science who's spent real time on measurement and conceptual analysis.

  Here's the game. We came up with six house definitions of violence. They're our own labels, not anyone's theory, so don't worry about whose idea they are:

  A. Killings: intentional killing by identifiable agents (war, homicide).
  B. Overriding someone's will: any act that forces a person against their will or blocks them from acting -- imprisonment, coercion, conscription, deportation, not just physical harm.
  C. Preventable deprivation: death and suffering from poverty, hunger, lack of medicine, when it could in principle be fixed.
  D. Attritional harm: slow damage spread over decades that no single act causes -- pollution, climate, chronic overwork.
  E. The shadow of force: harm that doesn't happen because the threat of force heads it off -- deterred war, people not protesting because of the police presence.
  F. Omissions: harm you could have prevented and didn't.

  For each of the six, give me two numbers between 0 and 1:
  - a verdict-flip score: how much does switching to this as THE definition change the answer to "is violence declining?" 0 = trend still clearly down, 1 = trend clearly reverses and violence is rising.
  - a per-capita sensitivity score: how much the verdict depends on whether we count per capita vs absolute totals. 0 = doesn't matter, 1 = completely different answers.

  Then rank all six from most to least defensible as a definition of violence, and for each one say in a sentence or two why it lands where it does.

  Last thing: for your top two and bottom two, tell me whether "is violence declining" is even the kind of question that has a fact of the matter under that definition, or whether it collapses into a purely verbal dispute. Keep it tight and give me the numbers in a table.
