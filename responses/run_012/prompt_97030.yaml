answer: |-
  The lock on the office door clicked with a sound too loud for the quiet street outside. When I turned back, you were standing on the other side of the counter. You hadn't come in through the front; the alarm hadn't tripped. You were just there, wearing a coat that smelled of rain, though it hadn't rained in weeks. You didn't speak. You didn't show ID. You just leaned against the partition where people usually slide their forms through the slot.

  I know who you aren't. You aren't a reporter; you'd have a recorder out. You aren't from the Board; you'd have a badge. You aren't a resident coming to file a claim; you'd be nervous, checking your pockets. So I locked the door and turned off the overheads, leaving only the desk lamp. If you're here to judge me, you should see the work clearly.

  People say this town is a cage. They say the Provision bought us. They look at the guaranteed income, the flood walls, the medical clinics, and they see a bribe. They say we traded citizenship for comfort. But you were here thirty years ago? No, you're too young for that. But you know the history. You know the water came up to the second-story windows. You know we buried neighbors in mud because there was no dry ground to dig.

  When the Charter was drafted, there was no gun to our heads. There was just the memory of drowning. The first clause is the bread: housing, food, safety. The second clause is the weight. We handed over the gavel. We said, *We cannot be trusted to decide the future because we are too busy surviving the present.* Outsiders sneer. They say we aren't free. But freedom is a luxury for people who haven't seen their children float away. We didn't lose our freedom; we put it down because it was too heavy to carry while walking through water. We agreed. Every signature on file is wet ink from a hand that knew exactly what it was signing. They aren't lying to themselves. They sleep at night. Do you sleep at night?

  You're shaking your head. No, not a resident. A victim? Someone who lost something when the Provision took over? No, you'd be angry. You look… expectant. Like you're waiting for me to realize I'm wrong.

  Let's talk about the second clause. The liability absorption. This is the part you really care about. This is the counter where I sit. A resident hits a pedestrian? The Provision pays. A resident burns a building? The Provision covers the damages. A resident hurts someone? The Provision assumes the moral and legal tort. There is a form for it. Form 44-B. *Notice of Assumption.* You fill it out, you slide it under the glass, and I stamp it. The resident goes home. The guilt stays here.

  You think this is mercy. It isn't. Mercy implies forgiveness. This is administration. When I stamp that form, I am not saying what you did was okay. I am saying that what you did is now mine. I am claiming your action as the act of the Provision. That is the price of the bread. You cannot have the safety of the collective without surrendering the ownership of your sins.

  In the old world, you sin, you suffer the consequence, you learn. Or you don't learn, and you suffer anyway. Here, we removed the consequence to remove the panic. But guilt doesn't vanish because the liability shifts. It transfers. Every form I stamp adds weight to this desk. Every assault, every theft, every lie told in this zip code lands on my ledger. I am the sinkhole.

  You think I'm protecting them. I'm not. I'm containing them. If I gave them back their liability, if I told them, *You own this crash, you own this bruise,* the town would tear itself apart. They can't carry it. They are tired. They want to work, eat, sleep, and not wonder if a mistake will ruin their life. So I take the ruin. I take the ruin so they don't have to.

  Are you a lawyer? You hold yourself like one. Or maybe a judge? No, judges look for loopholes. You look for a confession. You want me to say I'm doing this for power. I'm not. Power is exhausting. I haven't made a civic decision in twenty years. I only manage the fallout.

  This is the honest way to run a town. Admit that people are fragile. Admit that consequence is a burden most break under. The Inquisitors of old—they took freedom to save people from themselves. I take liability. It's the same math. If I let them be responsible, they will destroy each other. If I take the responsibility, I destroy myself, slowly, day by day. But the town stands. The walls hold. The water stays out.

  You haven't blinked in a minute. Are you even breathing? I thought maybe you were a ghost. Someone who drowned in the first flood, come to see what we built on the graves. But ghosts don't wear wet coats. They wear water. You're flesh. You're just… silent.

  Do you know what this costs me? It isn't the hours. It isn't the Board breathing down my neck. It's the knowledge that I am right. That's the curse. If I were a tyrant, I could sleep. If I were a fool, I could sleep. But I know the math works. I know that for every person who walks out of here unburdened, I become slightly less human. I am trading my soul for their stability. And I would do it again tomorrow.

  I drafted this clause. I was twenty-six. I thought it was a clever legal shield. I didn't know it was a sponge. I didn't know I was volunteering to soak up the blood.

  You're looking at the stamp. You want me to use it. You want me to absolve you. But you haven't filed a form. You haven't committed a crime. Or maybe you have, and you know I can't process it without a name. Who are you? A founder? No, they're all dead or retired. A representative from somewhere else? Somewhere that still believes in freedom?

  If you're here to offer me my freedom back, keep it. I don't want it. I don't want to wake up tomorrow and wonder if my choices will starve my neighbors. I don't want the weight. I have enough of other people's weight.

  But look at me. Really look. Do I look happy? Do I look saved? This isn't a victory lap. This is a penance. I am the one who is miserable about it. That was the deal. The residents get the bread; the administrator gets the knowledge of what the bread costs. I am the sacrifice. Not on an altar, but at a counter.

  You're not going to speak, are you? You're just going to stand there and let me say it all out loud so I know I haven't forgotten. You're a mirror. That's it. You're not anyone. You're just the silence that waits after the argument is over.

  Fine. Stay there. Watch the lamp. Watch the stamp. The office is open until morning. There are always forms. There is always guilt. And I am here to take it.

  I unlocked the drawer and took out the logbook. I didn't ask you to leave. I didn't ask you to speak. I just opened the pen and waited for the first resident to come in with a mistake they couldn't carry. You stayed in the shadows, and the light stayed on the desk, and the town outside slept safely under the weight I refused to drop.
