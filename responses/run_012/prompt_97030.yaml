      *(Self-Correction on Ending)*: No gesture. Just the state of things.

  8.  **Final Polish:** Check the rhythm. Ensure the transition between the flood memory and the liability clause is smooth. Ensure the "cost to her" feels personal, not just "oh woe is me."

