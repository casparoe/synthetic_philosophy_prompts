answer: |-
  You are running two coherent but conflicting rules—protect the worker from the state and refuse to normalize the market—and this proposal violates the first rule to satisfy the second.

  Your instinct isn't incoherent; it is a tension between harm reduction and abolitionism. Rule one is "never make the seller a criminal or exclude them from safety," which drives your support for Nordic decriminalization of sellers and your critique of German licensing that excludes the vulnerable. Rule two is "do not validate the industry as a neutral commodity," which drives your support for Nordic demand reduction and your hesitation about New Zealand making it "a job like any other." You want the worker safe from the law, but you do not want the law to invite the market in.

  This co-op proposal settles Rule two completely. By mandating co-ops and running ads against buying, it prevents normalization and actively discourages demand without criminalizing the buyer. It treats sex work as a distinct, problematic category rather than standard labor, which aligns with your discomfort about the industry becoming "normal."

  However, the proposal breaks Rule one. By banning solo operators and forcing workers into co-ops, you recreate the German problem of exclusion. A worker with a drug problem, undocumented status, or simply a preference for independent safety cannot access the legal protections because they cannot join a co-op. Health inspectors enforcing condom use reintroduces state surveillance into private acts, which undermines the "nobody's a criminal" safety net you liked in the New Zealand model. You are trading the exclusion of licensing for the exclusion of mandatory collectivization.

  The one case that would settle both rules is full decriminalization of solo and agency work paired with robust exit funding and demand-side advertising. This model keeps the state out of the worker's business (satisfying Rule one) while using public funds to shrink the market and support those who want out (satisfying Rule two). It accepts that the industry exists without endorsing it as normal labor, allowing you to protect the person without protecting the trade.
