prompt: |-
  Ok so I've been going down a rabbit hole on sex work laws for about three months now. I'm not a researcher or a student or anything, I just read alot at night, and I've ended up with pretty strong opinions about the three big models, except I honestly can't tell if they hang together or if I'm just making it up as I go.

  Here's where I've landed. On the Nordic model, the one where you go after the guy doing the buying and leave the person selling alone, plus money for exit programs, I think that's basically the right instinct. On Germany and the Netherlands, where it's legal and licensed and taxed and there's health checks and registered brothels, I think it's a mess, because you end up with a whole industry that gets to act like it's a normal job, and the people who actually need something, the ones without papers or with a drug problem, get nothing out of the regulation except paperwork. And on New Zealand, where they just decriminalized the entire thing and made it labor law like any other work, I'm genuinely torn. I like that nobody's a criminal and that someone can actually call the cops if they get hurt, but it doesn't seem to make any of it smaller, and I'm not sure "it's a job like any other" is something I actually believe.

  So I keep feeling like I'm running some kind of rule but I can't say which. Is it "never make the seller a criminal"? Is it "go after the demand"? Is it "make it safe for whoever's actually in it"? Or is it "don't let the whole thing become normal"? Some of those seem to fit everything I just said and some of them definately don't, and I can't sort it out on my own.

  Anyway here's the new one, and this is what I actually want help with. A city near me is proposing this: fully decriminalize buying and selling both, so nobody's a criminal at all, but every sex worker has to work through a worker-owned co-op, no solo operators and no agencies, health inspectors enforce condom use, and they're dumping a pile of money into a public ad campaign telling people not to buy sex. That's the actual proposal, co-ops and all.

  So: what do I say about it? Which rule am I actually running, and is it one rule or two fighting each other? If more than one rule fits everything I've said above, tell me which of them the co-op proposal would settle and how, and if it wouldn't settle it, give me the one case that would. And be honest with me if my views are just incoherent, I can take it.

  Start your answer with your call in the very first sentence, then the reasoning after that. No throat clearing, and don't restate my question back at me.
