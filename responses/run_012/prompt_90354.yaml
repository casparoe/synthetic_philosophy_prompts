      Okay, this makes the audit very clear. (4) is the poison pill.

  10. **Final Polish:** Check the ranking and the "single revision" advice. Ensure the "cost" of each repair is clear. (e.g., Dropping 4 costs you the ability to talk to economists easily; Keeping 4 costs you the coherence of the paper).

      *Wait, one nuance:* Can (4) be interpreted as *instrumental* rationality? Even so, Simon argues satisficing *is* instrumental rationality under bounds. But (4) specifies "Expected-Utility axioms." That's specific. It's not just "means-ends." It's specific mathematical coherence. So the conflict stands.

