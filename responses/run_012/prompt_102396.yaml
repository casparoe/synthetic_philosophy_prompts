answer: |-
  This is a sharp observation of a genuine inconsistency in literary culture. You have identified a cluster of practices that seems contradictory on the surface but operates on a coherent, if unspoken, set of rules.

  Here is a reconstruction of the implicit theory, an analysis of its necessary components versus its compatible rivals, and a look at the counterfactual world where form is merely decoration.

  ### 1. Reconstructing the Implicit Theory
  **"Genre-Relative Constitutive Essentialism"**

  The practices you describe presuppose a theory where the definition of "the work" shifts depending on the genre and the medium of consumption. It is not a single theory of meaning, but a contextual one.

  *   **In Poetry:** The theory assumes **Form is Constitutive.** A poem is not a message wrapped in a form; it is an event generated by the friction between sense and sound. Therefore, a translation that preserves the literal sense but loses the rhyme/meter has failed to translate *the poem*; it has only translated the paraphrase. To save the poem, the translator is licensed to alter the semantic content to preserve the aesthetic structure.
  *   **In Prose:** The theory assumes **Content is Constitutive.** A novel is treated as a narrative architecture or an argument. Style matters, but it is viewed as a vehicle for the story or ideas. Adding a sentence changes the *facts* of the narrative or the *voice* of the author in a way that is deemed an intrusion. The translator is a conduit, not a co-creator.
  *   **In Song (The Hybrid Case):** This reveals the hidden variable: **Function.**
      *   *Sung:* The function is performance. The text is a component of music. Fidelity is to the *musical experience*.
      *   *Liner Notes:* The function is reference/study. The text is data. Fidelity is to the *semantic information*.
      *   *Resolution:* We do not see a contradiction here because we acknowledge these are two different *tools* for two different jobs. The fact that we don't apply this same functional flexibility to the Poetry vs. Novel distinction suggests we view "Poetry" and "Prose" as ontologically different, whereas we view "Sung Lyric" and "Liner Note" as functionally different versions of the same text.

  ### 2. Necessary Parts vs. Compatible Rivals

  **What the Practice *Needs* to Work:**
  1.  **The Hierarchy of Values:** It requires that different genres prioritize different values. Poetry prioritizes *aesthetic integrity* (sound/rhythm); Prose prioritizes *narrative/intellectual integrity* (plot/argument).
  2.  **Compensatory Faithfulness:** It requires that faithfulness is judged holistically (the "Whole Work" view you mentioned). In poetry, a loss in semantic precision can be "paid for" by a gain in rhythmic vitality. In prose, the ledger is kept line-by-line; a debt incurred in one sentence cannot be repaid by a flourish in the next.
  3.  **The Translator's License:** It presupposes that the translator's role changes by genre. In poetry, they are a **performer** (like a musician interpreting a score). In prose, they are a **clerk** (like a scribe copying a document).

  **Rival Theories It Sits Happily With:**
  1.  **Functionalism (Skopos Theory):** This is the strongest rival/explanation. It argues that the translation method is determined by the purpose (*skopos*) of the translated text.
      *   *Fit:* This explains the Song/Liner Note split perfectly. It also explains Poetry vs. Prose if we assume the *purpose* of reading poetry is aesthetic pleasure, while the purpose of reading a novel is narrative immersion.
      *   *Compatibility:* The current practice is essentially a rigid, genre-coded version of Functionalism.
  2.  **The "Spirit vs. Letter" Distinction:** An older Romantic theory.
      *   *Fit:* In poetry, we seek the "spirit" (the emotional effect of the rhyme). In prose, we stick to the "letter" (the specific events described).
      *   *Compatibility:* The practice fits this without needing to fully endorse the metaphysics of it.

  **Where It Is Genuinely Underdetermined:**
  1.  **The Status of Prose Style:** This is the biggest hole. If form is constitutive in poetry, why is style *not* constitutive in prose? If a novelist writes in short, staccato sentences to create tension, and the translator smooths them into flowing prose to "improve readability," they are often criticized. But if they add a sentence to "smooth a transition," they are roasted. The boundary between "style" (which must be kept) and "clutter" (which can be fixed) is undefined. The practice assumes we know the difference, but the theory doesn't explain it.
  2.  **The "Liner Note" Paradox:** If the liner notes are expected to track line-by-line, it proves we *can* separate sense from form in poetry when we want to. This implies the "Form is Meaning" theory isn't actually true; rather, "Form is Meaning *for the purpose of aesthetic reading*." The theory is underdetermined on *why* the aesthetic reading is the default for the printed poem but not the liner note.
  3.  **The Author's Voice:** In prose, the author's specific word choice is sacred. In poetry, the author's specific word choice is often sacrificed for the rhyme. The theory doesn't explain why the Poet's authority is more negotiable than the Novelist's. (Perhaps because the Poem is viewed as a public object, while the Novel is viewed as the Author's private property?)

  ### 3. The Counterfactual: If Form Were Decoration

  If we swapped in the view that **"Form is decoration and only the Sense is the Poem,"** the landscape of publishing and reviewing would change radically.

  **1. The Death of the "Poet-Translator"**
  Currently, journals prize translations by poets who can "re-make" the poem in English. In the new world, the ideal translator is a philologist.
  *   **Publishing:** You would see fewer standalone translations of rhyming poetry. Instead, you would see "Facing-Page Editions" as the standard, with the English side being a precise, unrhymed explication.
  *   **Reviewing:** A reviewer praising a translation for its "beautiful English rhymes" would be seen as missing the point. The praise would shift to "lucidity" and "accuracy." A translator who changed an image to save a rhyme would be accused of vandalism, not praised for ingenuity.

  **2. The Collapse of the Song/Poem Distinction**
  *   **Opera/Musicals:** Librettos would no longer be "adapted" to fit the music comfortably. They would be translated literally, forcing singers to cram extra syllables into notes or stretch words unnaturally. The "singability" constraint would be viewed as a corruption of the text.
  *   **Liner Notes:** These would become the *primary* text. The sung version might be viewed as a "performance adaptation" (like a jazz cover), while the literal translation would be the "work."

  **3. Prose Would Absorb Poetry's Liberties**
  *   If form is decoration in poetry, it must be decoration in prose, too. However, since prose relies on sense, the "Sense is King" rule would tighten everywhere.
  *   **Alternatively:** If we decide *all* form is decoration, then novelists might gain the liberty poets currently have. A translator could rewrite a clunky paragraph in a Dostoevsky novel to make it flow better in English, arguing, "The form was decoration; I kept the sense." Currently, this gets them roasted. In this new world, it might be accepted as "removing the decoration to reveal the sense."

  **4. The End of "Untranslatability"**
  *   The mystique of poetry relies on the idea that the form/sense fusion is unique and fragile. If form is decoration, poetry becomes fully translatable data.
  *   **Consequence:** Poetry sections in bookstores would shrink. If the rhyme and meter aren't part of the "poem," then reading a summary or a literal translation provides 90% of the value. The economic incentive to publish new translations of Rilke or Baudelaire would vanish, because one good literal translation would suffice forever.

  ### Summary
  The current practice presupposes that **Poetry is an aesthetic object** (where form creates meaning) and **Prose is a communicative object** (where content creates meaning), while **Song is a functional object** (where utility dictates fidelity).

  It relies on the **Compensatory Theory of Faithfulness** for poetry (losses in sense are okay if gains in form occur) but a **Cumulative Theory of Faithfulness** for prose (every error adds up).

  If you remove the value of form, you don't just change translation; you eliminate the justification for poetry's existence as a distinct art form from prose. You turn the poem into a message, and the translator into a courier. The "bug" you feel is the friction between treating the poem as a **message** (which should be accurate) and treating it as a **performance** (which should be effective). Currently, we allow the performance to win in poetry, but demand the message win in prose.
