      *   **Specific Cases:**
          1.  *Poetry:* Translator changes sense/images to keep rhyme/meter. Praised as "best version." Accusations of mistranslation are absent.
          2.  *Prose (Novel):* Translator adds a sentence for flow. Roasted for unfaithfulness.
          3.  *Song:* Lyrics bent for tune (accepted). Liner notes expected to be literal (accepted). No perceived contradiction.
      *   **Questions to Answer:**
          1.  What implicit theory/view of poems and meaning does this cluster of practices presuppose?
          2.  Does it assume Form = Meaning (vs. Prose where Form $\neq$ Meaning)?
          3.  Does it assume Faithfulness = Whole Work (compensatory translation)?
          4.  Is it thinner (Functionalism/Reader-Response)?
          5.  Reconstruct the implicit theory.
          6.  Identify necessary parts vs. compatible rival theories.
          7.  Identify genuinely underdetermined areas.
          8.  Counterfactual: What changes if we adopt the view "Form is decoration, Sense is Poem"?

  2.  **Analyze the Implicit Theory (The "Poetic Contract"):**

      *   *Poetry:* The practice suggests that the *aesthetic experience* of the poem (sound, rhythm, rhyme) is constitutive of its "poem-ness." If you translate a rhyming poem into free verse literalism, you've killed the poem, even if you kept the sense. Therefore, "faithfulness" in poetry includes faithfulness to the *effect* or the *form*, even at the expense of semantic precision.
      *   *Prose:* The practice suggests prose is primarily a vehicle for information/narrative. Adding a sentence changes the *content* (the story/facts), which is the primary value. Form (flow) is secondary to Content.
      *   *Song:* This is the interesting hinge. Sung lyrics are treated like poetry (form/tune dictates sense). Liner notes are treated like prose/cryptic (literal sense dictates value). This implies the *function* determines the standard of fidelity.

  3.  **Evaluate the Proposed Hypotheses:**

      *   *Hypothesis A: Form IS Meaning (in poetry).* This fits the poetry case well. If form is meaning, dropping rhyme drops meaning. Keeping rhyme requires altering sense, but the *total* meaning (form + sense) is preserved better than literal sense alone.
      *   *Hypothesis B: Unit of Faithfulness = Whole Work.* This fits the "compensatory" aspect. You lose an image here, gain a rhyme there. The *gestalt* is what matters. In prose, the unit is often the paragraph or sentence accuracy because narrative continuity relies on it.
      *   *Hypothesis C: Functionalism (Reader's Use).* This fits the Song vs. Liner Notes distinction perfectly. Singing requires singability. Studying requires accuracy. It also explains Poetry vs. Prose: We read poetry for aesthetic experience, prose for narrative/information.

  4.  **Synthesize the Implicit Theory:**

      *   It's not just one of these; it's a hybrid. I'll call it the **"Aesthetic Integrity Theory"** moderated by **"Functional Context."**
      *   *Core Tenet:* A translation must reproduce the *literary experience* of the original, not just the semantic data.
      *   *Differentiation:* In poetry, the experience is heavily formal (sound/rhythm). In prose, the experience is heavily narrative/semantic. In song, the experience is musical/performative.
      *   *Faithfulness:* Defined as fidelity to the *genre constraints* of the original.

  5.  **Determine Necessary vs. Compatible Parts:**

      *   *Necessary:* The distinction between "semantic content" and "aesthetic effect." The idea that different genres prioritize different aspects of this split.
      *   *Compatible:* "Form = Meaning" works, but "Form = Vehicle for Effect" also works. "Whole Work" fidelity works, but "Functional Equivalence" (Nida) also works.
      *   *Underdetermined:* Why is prose *not* allowed the same liberty? If form is experience, doesn't a novel have a rhythm? (Yes, but the practice ignores this). Why are liner notes held to a higher literal standard than the poem itself? (Because they are paratext, not the art).

  6.  **Develop the Counterfactual (Form = Decoration):**

      *   If Form = Decoration and Sense = Poem:
      *   *Poetry Translation:* Would become "cribs" or interlinear translations. Rhyme schemes would be abandoned. Free verse translations of rhyming sonnets would be the norm.
      *   *Reviewing:* Translators keeping rhyme would be criticized for "obscuring the meaning" or "adding noise."
      *   *Publishing:* Bilingual editions would be preferred over standalone translations. "Poetry" sections might shrink or merge with "Literature in Translation."
      *   *Song:* Lyrics would be less singable, more like recited text over music.

  7.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the sharpness of the observation. It's a classic tension in translation theory (Schleiermacher's "move reader to author" vs. "move author to reader," or Benjamin's "pure language").
      *   *Section 1: Reconstructing the Implicit Theory.* Call it "Genre-Relative Aesthetic Fidelity."
          *   Poetry: Form is constitutive.
          *   Prose: Content is constitutive.
          *   Song: Function dictates fidelity (Performance vs. Reference).
      *   *Section 2: Necessary vs. Compatible.*
          *   Necessary: The hierarchy of values shifts by genre.
          *   Compatible: Form=Meaning OR Form=Effect.
          *   Underdetermined: The status of prose rhythm (why isn't prose style protected like poetry form?).
      *   *Section 3: The Counterfactual (Form as Decoration).*
          *   Radical shift in what gets published.
          *   Death of the "translator as poet."
          *   Rise of the "scholar-translator."
      *   *Conclusion:* Summarize the tension.

