  9.  **Final Polish:** Ensure the tone is analytical and philosophical, matching the user's prompt. (Check against the prompt's specific questions: Reconstruct theory, necessary parts, rival theories, underdetermined areas, counterfactual scenario).

      *(Self-Correction on "Underdetermined"):* The biggest underdetermined spot is *why* the novel translator got roasted. If the goal is the "reading experience," a smooth transition might improve it. The fact that they got roasted implies a specific ethic of "invisibility" or "non-interference" in prose that doesn't apply to poetry. This suggests the theory isn't just about "experience," it's about "authority." In prose, the Author's voice is sacred. In poetry, the Poem's existence is sacred (even if the translator helps birth it in English).

      *Wait, let's refine that.* In poetry, the translator is often seen as a co-creator. In prose, the translator is a conduit. Why? Because poetry is seen as untranslatable essence, requiring recreation. Prose is seen as translatable information, requiring accurate transfer.

      *Okay, let's structure the response around these insights.*

