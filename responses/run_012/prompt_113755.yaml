answer: |-
  This is a precise and formidable set of questions. You are asking about the **Embedding Problem**, which strikes at the heart of the Cartesian residue in standard decision theory. The difficulty is not merely that agents are physically located in the world, but that the *logical structure* of standard agency presupposes a vantage point that a physical object cannot occupy.

  Here is an analysis of the conceptual difficulty, an assessment of your triad, and a sketch of what a genuine resolution must look like.

  ### 1. The Circularity in the Textbook Picture

  Start with the standard causal decision-theoretic model. An agent maximizes expected utility by evaluating $\sum_s P(s | do(a)) U(s)$. The critical operator here is $do(a)$. In causal graphical terms (à la Pearl), an intervention $do(a)$ requires severing the incoming causal arrows to the variable $A$ and fixing its value exogenously.

  **Where the circularity bites:**
  For a Cartesian agent, this is unproblematic. The agent stands outside the causal graph of the world; its will is an unmoved mover that can intervene on the world without being intervened upon. But for a naturalistic agent, the agent is a physical subsystem within the graph.
  1.  **The Variable Problem:** If the agent is part of the world, its "action" $A$ is just a state variable of that physical subsystem (e.g., motor neuron firing patterns). Like all physical variables, $A$ has prior causes (sensory inputs, prior internal states). You cannot $do(A)$ in the strict sense because $A$ is not exogenous; it is determined by the history of the universe plus the agent's internal dynamics.
  2.  **The Model Problem:** To calculate $P(s | do(a))$, the agent must possess a model $M$ of the world. If the agent is part of the world, $M$ must be a subsystem of the world modeling the world. This includes modeling the agent itself. Thus, $M$ must contain a representation of $M$'s own output.
  3.  **The Circularity:** To choose $A$, the agent runs $M$. But $M$'s output depends on $A$ (since $A$ affects the world $S$, which feeds back into the agent). More deeply, if $M$ is accurate, it must predict $A$ before $A$ is chosen (to calculate consequences). If $M$ predicts $A$ based on prior physical causes, then $A$ is fixed by the past, and "deliberation" is epiphenomenal. If $M$ leaves $A$ open to be filled by deliberation, $M$ is incomplete, and the expected utility calculation is undefined.

  The circularity is not just a regress; it is a **category error**. The textbook picture treats the agent as a *function* $f: S \to A$ that maps world states to actions. But a naturalistic agent is a *physical object* whose behavior is a trajectory in state space. Treating the object as a function requires abstracting away the physical causes of the function's operation, which naturalism forbids.

  ### 2. Assessing the Three-Way Breakdown

  Your scaffolding (Boundary, Ontology, Self-Reference) is robust. It captures the metaphysical, representational, and logical dimensions of the problem. Here is the precise difficulty for each and why obvious replies fail.

  #### I. The Boundary Problem
  *   **The Difficulty:** In a continuous physical field (or even a discrete particle system), there is no intrinsic label marking "agent" vs. "environment." Any boundary is a coarse-graining. If agency requires a boundary (to define what is acting), and the boundary is arbitrary, then agency is arbitrary.
  *   **The Obvious Reply:** "The boundary is functional, not physical. It's where control ends." (e.g., the skin, or the limit of my causal leverage).
  *   **Why it Fails:** "Control" is an agentive notion. To define the boundary by control presupposes an agent to do the controlling. If I use a cane, is the cane part of me? If I control it, yes. But "I" am defined by the boundary. This is circular: You need the agent to define the boundary, and the boundary to define the agent. Furthermore, causal influence decays gradually; there is no sharp cutoff where "my influence" stops. Any sharp line is stipulative, making agency stipulative.

  #### II. The Ontology Problem
  *   **The Difficulty:** Decision theory requires a set of actions $\{a_1, ... a_n\}$. But physical reality does not come pre-carved into "raising an arm" or "drinking coffee." These are high-level abstractions over vast microphysical states. The agent must possess a vocabulary to define its own actions. But where does this vocabulary come from?
  *   **The Obvious Reply:** "The agent learns the ontology from experience."
  *   **Why it Fails:** To learn an ontology, the agent must already be able to act to gather data. But acting requires an ontology (you can't choose to 'press the lever' if 'lever' and 'press' aren't in your action space). The agent cannot bootstrap its own action space from a state where it has no action space. The choice of variables is itself an act of the agent, which presupposes the variables.

  #### III. The Self-Reference Problem
  *   **The Difficulty:** The agent's decision is a causal event in the world. A complete model of the world must include this event.
  *   **The Concrete Instance:** Consider the agent with a model containing a "slot" for its own future action.
      *   *Case A:* The slot is filled by **prediction** (based on current state). Then the action is determined by the past state. Deliberation does not causally influence the action; it merely reads the prediction. Agency is an illusion.
      *   *Case B:* The slot is filled by **deliberation** (the output of the calculation). Then the model was incomplete *during* the calculation. The agent could not compute the expected utility of the action *before* taking it, because the action (a world-fact) was unknown.
      *   *Case C:* The model simulates the deliberation to fill the slot. This leads to infinite regress (the simulation must simulate the simulation).
  *   **Why it Fails:** The tension is between **predictability** and **causal efficacy**. If the action is predictable from the outside (by the model), it is fixed from the inside. If it is not fixed, it is not predictable, and the model is false. A naturalistic agent cannot be both a perfect predictor of its world (including itself) and an open decider.

  ### 3. Interdependence of the Three Problems

  You suspect the **Ontology Problem** is upstream: you cannot state the Boundary or Self-Reference problems without a vocabulary.

  **My Judgment:** Your suspicion is correct *conceptually*, but the **Boundary Problem** is upstream *metaphysically*. They are mutually constitutive, forming a hermeneutic circle, but the direction of dependence shifts depending on whether you are asking about *formulating* the theory or *instantiating* the agent.

  1.  **Ontology is Conceptually Upstream:** You are right that you cannot state "Where is the boundary?" without variables to measure the distance. You cannot state "The model contains the decision" without a variable for "the decision." Without a carved ontology, the other two problems are ineffable.
  2.  **Boundary is Metaphysically Upstream:** However, the reason the Ontology problem is hard is *because* there is no natural boundary. If there were a natural joint in nature where "agent" ended, the ontology would be given by physics (variables inside = agent, variables outside = environment). The Ontology problem exists *because* the Boundary problem is unsolved.
  3.  **Self-Reference is the Logical Consequence:** The Self-Reference problem is what happens when you try to run a decision algorithm (Ontology) on a system that has no clear boundary from its environment.

  **Verdict:** The triad is a single knot. However, if forced to choose a "root," I would argue the **Boundary Problem** is the fundamental metaphysical constraint. The Ontology problem is the representational shadow of the Boundary problem. If you could solve the Boundary problem (find a non-arbitrary joint in nature), the Ontology problem would dissolve (variables would be natural kinds), and the Self-Reference problem would become a standard engineering constraint (like a thermostat modeling its own sensor). Because the Boundary is arbitrary, the Ontology is arbitrary, which makes the Self-Reference paradoxical.

  ### 4. The Shape of a Satisfactory Resolution

  What would it take to handle embeddedness rather than assume it away? A satisfactory resolution cannot simply be a new equation that fixes $A$ and $S$. It must be a **reconceptualization of what agency is**.

  #### Solved, Dissolved, or Exposed?
  *   **Not Solved:** We will not find a formula that allows a physical system to stand outside itself. That is logically impossible.
  *   **Not Dissolved:** We should not embrace eliminativism ("there are no agents"). This fails the phenomenological and explanatory data; agents *do* exist as functional entities.
  *   **Exposed/Reconceptualized:** The resolution lies in exposing the Cartesian picture as a **category mistake**. The mistake is treating agency as a *relation between a subject and an object* (choosing an action to change a state). The naturalistic picture must treat agency as a **dynamic property of a closed causal loop**.

  #### What a Formalism Must Do
  To count as handling embeddedness, a formalism must meet two criteria:

  1.  **The Boundary must be Endogenous:** The formalism cannot take the agent/environment distinction as an input. It must derive it.
      *   *Conceptual Shape:* The "agent" should emerge as a **homeostatic cluster** of variables that maintain their own integrity against entropy. The boundary is not a line in space, but a **control loop** that actively maintains the distinction between "self" and "other." (Think: A cell membrane is not just a wall; it is an active pump. The "agent" is the process of pumping, not the lipids.)
      *   *Success Condition:* If I blur the physical boundaries in the model (e.g., include the cane as part of the body), the formalism should continue to work without redefining the "action" set manually. The action set should shift fluidly with the boundary.

  2.  **Action must be Trajectory, not Selection:** The formalism cannot treat actions as discrete buttons pressed at time $t$.
      *   *Conceptual Shape:* Actions must be modeled as **constraints on future paths**. The agent does not "select" a state; it restricts the phase space of the world to a subset compatible with its continued existence.
      *   *Success Condition:* The formalism should not require a $do()$ operator. Instead of "intervening," the agent "steers." Causality flows through the agent, not from outside it. The "decision" is not a cause that precedes the action; it is the **control signal within the loop**.

  #### Showing the Cartesian Picture was a Mistake
  To show the Cartesian picture was a mistake, the theory must demonstrate that **freedom is compatible with being modeled.**
  *   **Cartesian View:** Freedom requires that my action is not predictable from prior physical states (Libertarianism) or that I stand outside the causal chain (Dualism).
  *   **Naturalistic Resolution:** Freedom is **Counterfactual Stability**. An agent is free not because its action is uncaused, but because its action is caused by *reasons* (internal models) that track the environment.
  *   **The Shift:** The tension in the "Slot" example (Prediction vs. Deliberation) vanishes if we stop viewing the model as a *prediction of a fixed future* and start viewing it as a *guide for a controlled future*.
      *   The model does not say "I *will* do X."
      *   The model says "If I do X, outcome Y follows; I want Y; therefore, the causal chain will proceed through X."
      *   The prediction is **conditional on the goal**, not independent of it. The "slot" is not filled by looking up the future; it is filled by **setting a reference value** for a control system.

  #### Conclusion
  A satisfactory theory of naturalistic agency will look less like Decision Theory and more like **Control Theory** or **Active Inference**, but philosophically grounded. It will define an agent not as a *chooser of worlds*, but as a **system that minimizes the divergence between its internal model and its sensory input by acting on the world.**

  In this picture:
  *   **Boundary:** Defined by the variables the system can actively keep within narrow bounds (Markov Blanket).
  *   **Ontology:** Defined by the statistical regularities the system can exploit to minimize surprise.
  *   **Self-Reference:** Resolved because the system does not predict its own output as a fixed fact; it predicts its own output as a *function of its goals*. The "decision" is the parameter adjustment that makes the prediction come true.

  This does not save the Cartesian agent. It kills it. But it saves agency by relocating it from a magical point outside the world to a specific, maintainable structure within it. The work lies in showing that this structure is sufficient to ground the normative concepts (responsibility, rationality, intention) that philosophy cares about, without smuggling in the Cartesian boundary it claims to reject.
