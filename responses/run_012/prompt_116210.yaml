answer: |-
  Your observation touches on a fundamental tension in how organizations attempt to quantify uncertainty, and resolving it requires unpacking the philosophical commitments embedded in your firm's handbook. The practice presupposes a hybrid view of probability that blends subjective Bayesianism with an objective realist aspiration. On one hand, the use of a proper scoring rule for individual analysts treats probability as a personal credence, a measure of individual belief that is correct only insofar as it honestly reflects the analyst's internal state. On the other hand, the treatment of the market price as the firm's probability treats probability as a feature of the world waiting to be discovered, implying that there is a single correct number that exists independently of any specific trader. The system assumes that while belief starts in the head, disagreement and trading act as a filtering mechanism that washes away individual bias to reveal an underlying objective likelihood. This view relies on the idea that disagreement is primarily epistemic, stemming from uneven access to information or processing power, rather than fundamental differences in how people interpret the world.

  Reading the price as the firm's probability does strictly require the assumption that we all begin from a shared starting point, often called the Common Prior Assumption. If every trader starts with the same rational baseline and only differs because of private information, then the market price aggregates those information fragments into a posterior belief that any single rational agent would hold if they possessed all the private data collectively held by the crowd. In this scenario, the price is not merely a tally of bets but a computational result that approximates the truth. Without this assumption, the price is simply a market-clearing mechanism that balances supply and demand among people who might fundamentally disagree about the nature of reality. If traders have different priors, a price of forty cents does not represent a forty percent chance of the event occurring in an objective sense; it represents a weighted average of conflicting worldviews, influenced by wealth and risk tolerance as much as by information. Therefore, the handbook's claim that the price is the probability relies on the idea that our differences are only differences in information, not differences in first principles.

  However, not every part of your firm's system requires this strong assumption. The individual scoring rule survives perfectly well without common priors because it is designed to incentivize honesty relative to one's own belief, regardless of whether that belief is shared by others. An analyst with a unique prior can still be scored on whether her reported number matches her actual credence, and the proper scoring rule ensures she maximizes her score by telling the truth about her own mind. Similarly, the existence of trading does not strictly require common priors, though it changes the interpretation of why trading occurs. Under the Common Prior Assumption, trade happens only because of information asymmetry; under different priors, trade happens because people genuinely value the contracts differently based on their distinct worldviews. The part of the practice that fails without the shared starting point is the interpretation of the market price as a truth metric. The mechanism of trading still functions, and the scoring still incentivizes honesty, but the claim that the resulting price is the correct probability for planning purposes loses its theoretical justification.

  This practice quietly rules out several rival pictures of belief, most notably the strong implication of Aumann's Agreement Theorem, which states that rational agents with common priors and common knowledge of each other's beliefs cannot agree to disagree. Your handbook encourages disagreement as an engine of accuracy, which implies that either agents do not have common knowledge of each other's beliefs or that the firm rejects the idea that rational agents must converge immediately upon knowing each other's positions. It also rules out a radical subjectivist view where probability is purely personal and no consensus is possible or desirable. By aggregating individual credences into a single firm probability, the system asserts that there is a collective rationality that supersedes individual judgment. Furthermore, it sidesteps strict frequentism, which would define probability only in terms of long-run frequencies of repeatable events, since many forecasting events in business are one-off occurrences that cannot be repeated to establish a frequency.

  If you dropped the assumption of shared starting beliefs and admitted that traders have irreducibly different priors, several changes would be necessary in how you operate. First, you would have to change how you read the price, shifting from treating it as the truth to treating it as a consensus estimate or a decision-making tool that reflects the aggregate risk appetite and belief structure of the firm. You would no longer say the event has a forty percent chance, but rather that the market values the event at forty cents given the current composition of traders. Second, you would not need to change what you tell analysts to report, as the scoring rule remains valid for eliciting honest subjective credences regardless of prior differences. In fact, acknowledging different priors might make the scoring rule even more important, as it ensures you capture the diversity of thought rather than forcing conformity. Finally, you should expect trading to persist or even increase, because disagreement would no longer be resolved by information sharing alone. Traders would bet against each other not just because they have different data, but because they have different models of how the world works. The market would become less of a discovery mechanism for objective truth and more of a negotiation platform for conflicting subjective realities, which may still be useful for planning but requires a humbler interpretation of what the prices actually mean.
