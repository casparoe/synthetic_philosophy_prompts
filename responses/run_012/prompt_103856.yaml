      *   **User Background:** Programmer, mostly Haskell, some type theory. Thinks in terms of records, pointers, equality vs. isomorphism, quotient types, canonical forms, normalization, abstract spec vs. concrete serialization.
      *   **Task:** Restate Einstein's Hole Argument using this specific vocabulary.
