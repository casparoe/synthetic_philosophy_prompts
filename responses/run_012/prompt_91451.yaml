      *   **(6) Marcus:** Chilling. Deciding who counts. If "nobody home," no one to harm, so why not feed? If "somebody home," current wishes matter.
          *   *Strength:* Exposes the ethical risk of Dana's "nobody home" claim. Turns the "no harm" argument back on her.
