      *   **Current State:** Cheerful, eats with hands, says she's hungry, no distress.
      *   **Conflict:** Follow the paper (Dana) vs. Care for the present being (Marcus).

  3.  **Analyze the Arguments (Move-by-Move):**

      *   **(1) Dana:** Directive is binding. Prior competent self > Current incompetent self. "Settled, considered view."
          *   *Strength:* Legal standard, respect for precedent autonomy.
          *   *Weakness:* Assumes the prior self has absolute authority over the future self's welfare.
      *   **(2) Marcus:** "Creepy." Can't bind a future person. Analogy: "If I turn Republican." Present person has interests *now*. "Dead hand."
          *   *Strength:* Highlights the moral status of the present being. The "Republican" analogy is catchy but maybe flawed (political preference vs. life-sustaining treatment).
          *   *Weakness:* If we ignore directives, the whole concept of advance care planning collapses.
      *   **(3) Dana:** Dead hand cuts both ways. Purpose of directive *is* to bind future self. Otherwise, least capable version decides. Ruth anticipated the counterargument.
          *   *Strength:* Strong logical point about the function of directives. Addresses the "changed mind" issue by noting she predicted the change.
          *   *Weakness:* Still relies on the metaphysical claim that the prior self *owns* the future body.
      *   **(4) Marcus:** Dilemma (Same Person vs. Different Person). If same -> changed mind (allow change). If different -> controlling a stranger (immoral).
          *   *Strength:* This is the "Parfit" argument (Derek Parfit's *Reasons and Persons*). It's a classic philosophical pincer move. Very strong logically.
          *   *Weakness:* Might oversimplify legal/ethical standards which often operate on a sliding scale of capacity, not binary identity.
      *   **(5) Dana:** False choice (Same/Different). Matters is "life as a whole." Present happiness might be reflex ("nobody home").
          *   *Strength:* Shifts from metaphysics to narrative autonomy. Challenges the reliability of observed happiness in dementia.
