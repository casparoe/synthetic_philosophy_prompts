answer: |-
  You have put your finger on a specific and pervasive irritation in contemporary metaphysics and philosophy of mind. You are right that "fictionalism" isn't quite it, because fictionalists (like Rosen or Field) usually own the pretense: "Numbers are useful fictions." The move you are describing wants the *causal/explanatory power* of realism without the *metaphysical baggage* of realism.

  Here is the carving you asked for.

  ### 1. The Rhetorical Structure: Motte-and-Bailey Metaphysics
  In rationalist parlance, the *move* itself is a classic **Motte-and-Bailey**.
  *   **The Bailey (Realist):** "Qualia explain the difference between a zombie and a human." "Free will is why we punish criminals." (High explanatory payoff, vulnerable to attack).
  *   **The Motte (Instrumentalist):** "I'm not making a metaphysical claim, it's just a useful way of talking." (Defensible, low explanatory payoff, hard to attack).
  *   **The Switch:** When you challenge the Bailey, they retreat to the Motte. When you accept the Motte and ask how it explains anything, they slide back to the Bailey.

  However, "Motte-and-Bailey" names the *tactic*, not the *ontological stance*. You want a name for the position they are trying to occupy.

  ### 2. The Philosophical Cousin: Quasi-Realism
  The closest legitimate philosophical position is **Quasi-Realism** (associated with Simon Blackburn and Allan Gibbard, mostly in meta-ethics).
  *   **The Project:** Start with an anti-realist foundation (e.g., moral statements express attitudes, not facts) but try to *earn the right* to talk *as if* they are facts.
  *   **The Difference:** A Quasi-Realist is honest about the project. They admit they are reconstructing realist-sounding talk from anti-realist materials. The people you are describing are not doing the hard work of reconstruction; they are just using the realist talk and denying the commitment when billed for it.
  *   **Verdict:** They are **failed Quasi-Realists**.

  ### 3. Why it's not Fictionalism or Dennett
  *   **Fictionalism:** A fictionalist says, "X is false, but we pretend." Your targets say, "I'm not saying X is true or false, stop asking." Fictionalism pays the cost of eliminating truth-conditions; your targets want to keep truth-conditions without the ontology.
  *   **Dennett's Intentional Stance:** Dennett is a hardline instrumentalist. He argues that "belief" and "desire" are real *patterns*, but not real *things* (like neurons). If you press Dennett, he will eliminate the spooky stuff. He admits the homunculus is a fiction. Your targets need the homunculus to do causal work (e.g., "the qualia *caused* the report") but deny the homunculus exists. Dennett bites the bullet; they dodge it.

  ### 4. The Coinage: Stealth Realism
  If "Realism in Denial" feels wrong, it's because "denial" implies a psychological state. The structural problem is that they are **ontologically free-riding**.

  I propose the term **Stealth Realism**.

  **Definition:** A position that relies on the explanatory/causal power of an entity (Realism) while explicitly disavowing ontological commitment to that entity (Instrumentalism) when challenged, in order to avoid metaphysical objections.

  **The Edges of the Term:**
  *   **It is not Agnosticism:** An agnostic says, "I don't know if it exists, so I won't use it to explain things." The Stealth Realist says, "I don't know if it exists, but it explains this gap."
  *   **It is not Reductionism:** A reductionist says, "Experience *is* neural firing." The Stealth Realist says, "Experience *correlates* with neural firing but is distinct enough to explain the zombie gap, yet not distinct enough to be dualism."
  *   **It is not Quietism:** A quietist says, "The question of existence is meaningless." The Stealth Realist implies the question is meaningful enough to dodge.

  ### 5. Alternative: Ontological Hedging
  If "Stealth" implies too much conscious deception (whereas many of these people are genuinely confused), **Ontological Hedging** might be more charitable.
  *   **The Hedge:** They keep a bet open on the ontology while cashing in the chips on the explanation.
  *   **The Tell:** The explanation collapses if you enforce the hedge. If you say, "Okay, assume experience has no ontological weight," their story about zombies stops working.

  ### Summary
  The move is a **Motte-and-Bailey**.
  The sophisticated philosophical version is **Quasi-Realism**.
  The pathogenic version you are encountering is **Stealth Realism**.

  They want **Explanatory Realism** (the thing does work) with **Ontological Instrumentalism** (the thing isn't a "real" object). This is incoherent because, in a physicalist framework, only ontologically real things (or patterns thereof) can do causal work. If qualia aren't "real," they can't be the difference-maker between a zombie and a human. If they *are* the difference-maker, they are real.

  When you see this, the correct counter-move is to force a **Causal Closure Check**: *"If this 'way of talking' isn't about something real, how does it enter the causal chain to produce the reports you're explaining? If it doesn't, your explanation is empty. If it does, you're a realist."*

  They will usually retreat to the Motte at that exact moment. That is the boundary of **Stealth Realism**.
