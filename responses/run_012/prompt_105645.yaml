  7.  (Final thought on the "Risk Aversion" claim): This is the most dangerous thing to teach. If a grad student writes "Independence rules out risk aversion" on a qualifying exam, they fail. I need to make sure the user knows this is the biggest error.

  8.  (Final thought on "Mistake"): The colleague says "The only way to keep EU is to insist... subjects are making a mistake." Actually, you can keep EU as a *normative* model while admitting it's descriptively false. You don't have to say subjects are "mistaken" in a cognitive error sense; you can say they are optimizing a different objective function. But if you want to say they are *EU maximizers*, then yes, they are mistaken. I need to clarify this distinction.

