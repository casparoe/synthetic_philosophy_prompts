  7.  **Final Polish (incorporating the specific constraints):**
      *   No names.
      *   Focus on the gap between Calculation (prices needed) and Knowledge (info dispersed).
      *   Show Lange solving Calculation by accepting Hayek's premise, making the Board redundant.

