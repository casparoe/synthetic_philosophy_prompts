      *   *Refining for the Prompt:* The prompt wants the joke to land because the arguments are *strong*. It shouldn't just be "bureaucracy is slow." It should be "your solution to Calculation A accepts Knowledge B, rendering the Central Board ontologically redundant."

  6.  **Drafting - Attempt 4 (Polishing the Logic):**
      *   Let's focus on the "Equations" vs. "Process" distinction.
      *   Mises: No prices, no math.
      *   Lange: We make prices.
