prompt: |-
  I've been reporting a long feature on the old Epicurean argument that death isn't bad for the person who dies, and by now I've spent the better part of a year on the phone with two philosophers who cannot stop arguing about it: one who holds something close to the straight Epicurean line (no subject, no harm -- if you're dead there's no you for death to be bad for), and one who thinks death is bad for you precisely because of everything it takes off the table. They've shared panels, they've written replies to each other, and at this point I'm fairly sure they aren't even having the same argument.

  What I want from you is the document they could both actually sign -- not a transcript, not a verdict, the joint statement an adversarial collaboration would produce. So:

  - the claims they both accept: about what death is, about what a theory of the badness of death is supposed to explain, about which cases are easy and which are hard, and about what would count as a mistake in either view.
  - where they still part, each one worded so that the side it belongs to would accept the wording as fair to its own position.
  - the cruxes -- the sub-questions where settling it would actually move one of them. My hunch is that one is whether harm needs a subject, or only a subject at some time or other, and another is the timing problem (when exactly is death supposed to be bad for you -- not before, not during, not after?). But tell me if my hunches are off.
  - for each crux, the case or argument that both of them would agree bears on it, with each side's prediction written down in advance. I definitely want the symmetry thing in there (nobody grieves the years before they were born), the death-at-20 vs death-at-90 comparison, and something about harms that land after you're gone -- a promise broken, a reputation trashed.
  - and if some chunk of this fight is just verbal -- the two of them using 'bad for you' in different senses -- say which chunk, and why.

  Format: a numbered agreed-claims section, then a disagreements table. And please dont give me any preamble or commentary about what your doing -- start straight in with the document itself, it's going into the piece as-is.
