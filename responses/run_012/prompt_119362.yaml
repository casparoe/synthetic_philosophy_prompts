answer: |-
  1. Agreed Claims

  1.  **Definition of Death:** Both parties agree that "death" refers to the permanent cessation of conscious existence and biological function. We are not debating the medical criteria for death, but the normative status of the state that follows.
  2.  **Scope of Inquiry:** The theory aims to explain whether the state of being dead constitutes a misfortune *for the person who dies*, distinct from the grief suffered by survivors or the pain suffered during the dying process.
  3.  **Dying vs. Being Dead:** Both parties agree that the process of dying (pain, fear, loss of capacity) can be bad for the subject. The disagreement concerns the state of *being dead* (non-existence).
  4.  **Easy Cases:** Both parties agree that a painful, prolonged dying process is bad for the person. Both parties agree that being killed against one's will involves a violation of autonomy that is bad prior to death.
  5.  **Hard Cases:** Both parties agree that the core difficulty lies in explaining how a state of non-existence can be predicated as "bad" for a subject who does not exist to experience the badness.
  6.  **Methodological Constraint:** Both parties agree it is a mistake to conflate harm to the deceased with harm to others (e.g., family left behind) or harm to the subject's prior desires (e.g., frustration felt *before* death). The question is strictly about the subject's welfare relative to the state of being dead.
  7.  **Intuition Pump:** Both parties agree that any adequate theory must account for the strong intuition that death at age 20 is worse than death at age 90, even if the mechanism of harm is disputed.

  2. Disagreements Table

  | Crux / Sub-Question | Shared Test Case / Argument | Epicurean Prediction / Position | Deprivationist Prediction / Position | Diagnostic Note |
  | :--- | :--- | :--- | :--- | :--- |
  | **The Subject Requirement**<br>Does harm require an existing subject at the time the harm obtains? | **Posthumous Harm:** A promise is broken or a reputation trashed after the subject is dead. | **No Harm.** Without an existing subject to experience the loss or frustration, there is no welfare subject to be harmed. The person is gone; the harm attaches to nothing. | **Harm Exists.** Harm is relational to the interests held while alive. The subject is harmed because the world fails to match the trajectory of their life's interests, even if they cannot feel it. | **Substantive.** Disagreement on the metaphysics of welfare (Experientialism vs. Interest Theory). |
  | **The Timing Problem**<br>When exactly is death supposed to be bad for you? | **Temporal Location:** If death is bad, at what time *t* does the subject suffer the badness? (Not before, not during, not after?) | **Never.** There is no time *t* at which the subject exists and is dead. Therefore, the predicate "is harmed" never applies. | **At Death (or Time of Loss).** The harm occurs at the moment the future goods are lost. The subject exists at the moment of death, and the counterfactual comparison holds at that time. | **Substantive.** Disagreement on whether harm requires a simultaneous subject or can be anchored to the moment of deprivation. |
  | **The Symmetry Argument**<br>Is post-mortem non-existence different from pre-natal non-existence? | **Lucretius' Symmetry:** We do not grieve the time before we were born; why grieve the time after we die? | **Symmetric.** Both are states of non-existence. If pre-natal non-existence is not bad, post-mortem non-existence cannot be bad. Asymmetry is psychological, not rational. | **Asymmetric.** Death deprives an existing subject of future goods they were on track to receive. Pre-natal non-existence does not deprive a subject who was waiting to exist. | **Substantive.** Disagreement on whether the direction of time matters for deprivation. |
  | **Comparative Badness**<br>Why is death at 20 worse than death at 90? | **Age Comparison:** Two subjects die painlessly. One at 20, one at 90. | **Equal (or Neither).** If death is not bad, neither case is bad for the subject. If there is a difference, it is only in the loss to others, not the deceased. | **Unequal.** Death at 20 is worse because it deprives the subject of more future goods (life experiences) than death at 90. The magnitude of harm scales with lost potential. | **Substantive.** This is the primary intuition pump for the Deprivationist; the Epicurean must explain this away as error. |
  | **Semantic Diagnosis**<br>Are we using "bad for you" in different senses? | **Definition of "Bad":** Does "bad" require conscious suffering, or only a negative counterfactual comparison? | **Experiential Sense.** "Bad for X" implies X experiences a negative state. Since the dead experience nothing, death cannot be bad. | **Comparative Sense.** "Bad for X" implies X is worse off than X would have been in the relevant alternative scenario. Experience is not required. | **Verbal.** A significant chunk of the fight is verbal. If "bad" means "experienced suffering," Epicureans win. If "bad" means "deprived of goods," Deprivationists win. |
