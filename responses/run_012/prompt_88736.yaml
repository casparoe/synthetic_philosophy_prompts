answer: |-
  Here is a reading designed for your closing seminar session. It treats the *Laws* and the *Bacchae* as competing anthropologies of the irrational, rather than simply philosophy versus poetry.

  ***

  ### The Sober President and the Shattered Puppet: Reading the *Laws* against the *Bacchae*

  To conclude our seminar on Plato's moral psychology, we must confront the most dangerous objection to the Athenian Stranger's project. In *Laws* Books 1 and 2, Plato proposes a radical thesis: wine is a *pharmakon* (drug/remedy) that the city must administer to itself. By deliberately inducing a temporary state of shamelessness (*anaideia*) and fearlessness, the symposium acts as a low-risk simulation of battle. It exposes the citizen's true character so that the "golden cord" of reason can be trained to manage the iron cords of pleasure and pain. Crucially, this test requires a **sober president** (*symposiarch*) to ensure the dissolution of shame does not become the destruction of the soul.

  Euripides' *Bacchae* does not merely contradict this; it haunts it. It asks what happens when the *pharmakon* is not a substance you pour, but a god who walks. It asks what happens when the sober president is the very person the god has come to unmask.

  We can read this confrontation in two movements. First, we might view Pentheus as the failure of Platonic education: the ruler who lacks the "training in pleasure" that the *Laws* prescribes, whose repression invites catastrophe. But second, and more disturbingly, we must consider that the *Bacchae* dramatizes the collapse of the Platonic premise itself: that the irrational can be institutionalized, that the observer can remain outside the experiment, and that self-knowledge gained through dissolution is safe to possess.

  #### I. The Confrontation: Who Administers the Drug?
  **(*Laws* 649a–650b; *Bacchae* 450–518)**

  In the *Laws*, the testing of character requires a clear hierarchy: the drinker is the subject, the wine is the instrument, and the sober president is the guardian of the process. The president stands outside the intoxication to judge it.

  In the *Bacchae*, this hierarchy is inverted. Pentheus attempts to occupy the position of the Platonic *symposiarch*. He is the sober ruler trying to police pleasure, bind the irrational, and impose order on the chorus. He says he will "hunt down" the maenads and "stop the evil." But Dionysus (the Stranger) reveals that Pentheus is not the administrator of the test; he is its subject.

  When Pentheus tries to bind the Stranger, the god easily escapes. This scene dramatizes the impossibility of the Platonic safety condition. In the *Laws*, reason (the golden cord) is supposed to haul the puppet. In the *Bacchae*, the god pulls the cords. Dionysus tells Pentheus: *"You do not know what your life is, nor what you are doing, nor who you are."* This is the anti-Platonic moment. Plato believes the symposium helps you know who you are by stripping away social pretense. Euripides suggests that when the divine *pharmakon* takes hold, it does not reveal a stable "who"; it dissolves the "who" entirely. The sober president is not the safeguard; he is the sacrifice.

  #### II. The Seduction: Voyeurism vs. Civic Exposure
  **(*Laws* 666a–c; *Bacchae* 821–912)**

  Plato argues that wine makes a grown man "childish" and "fearless," exposing his hidden desires so they can be shamed into moderation. The exposure is public and corrective.

  In the *Bacchae*, Pentheus is indeed made "childish" and "fearless," but through a different mechanism. He is not given wine; he is given a vision. Dionysus seduces him into cross-dressing and spying on the maenads. Here, Plato's vocabulary of *aidos* (shame) illuminates the drama, but only to show its failure. Pentheus is obsessed with shame—he worries about the women's sexual misconduct on the mountain. Yet, to police this shame, he must divest himself of his own civic identity (his armor, his male robes).

  Is Pentheus the pupil who was never educated in pleasure? Plato would say yes. In *Laws* 653c, the Stranger says education is the training of children in pleasure and pain so they hate what they ought and love what they ought. Pentheus hates the Dionysian without understanding it, and then loves it (the voyeuristic urge) without understanding it. His furtive voyeurism is precisely the kind of hidden weakness the Platonic symposium aims to drag into the light.

  However, Euripides refutes Plato's confidence that this exposure is harmless. In the *Laws*, the drunkard stumbles and is corrected by his peers. In the *Bacchae*, the voyeur is led to the mountain to be torn apart. The "test" does not lead to *sophrosyne* (moderation); it leads to *sparagmos* (dismemberment). The play suggests that some desires, once exposed, cannot be reintegrated into the civic self. They consume it.

  #### III. The Messenger's Report: Possession vs. Intoxication
  **(*Laws* 665d; *Bacchae* 1043–1152)**

  This is the critical divergence. We must take seriously the possibility that wine is the wrong lens for the *Bacchae*.

  Plato treats intoxication as a chemical alteration of the soul's equilibrium. It weakens the golden cord so the other cords can be seen. It is a *state* to be managed.
  Euripides distinguishes between mere drunkenness and divine possession (*entheos*). The Messenger reports that the maenads are not stumbling or slurring; they are supernaturally strong, unharmed by fire or steel, and nursing wild beasts. When the Theban men attack them, their weapons fail; the women's thyrsus-staves wound like spears.

  If this were merely wine, Plato's model might hold: they are out of control and need a sober ruler. But because it is possession, the "sober ruler" is the one who is blind. The maenads are not suffering from a lack of self-control; they are operating under a *different* control. The *Bacchae* posits that the "golden cord" of human reason is not the only governing force in the cosmos. There are other cords—divine, chthonic, irrational—that snap the golden one. Plato's puppet analogy assumes the puppeteer (Reason/God) is benevolent and rational. The *Bacchae* suggests the puppeteer might be Dionysus, and he is not interested in civic harmony.

  #### IV. Agave's Recognition: The Limit of Shame
  **(*Laws* 647a; *Bacchae* 1115–1284)**

  In the *Laws*, the purpose of inducing shamelessness is to produce a higher form of shame: the shame of realizing one's weakness, leading to improvement. It is a therapeutic cycle.

  Agave's recognition scene breaks this cycle. She returns with the head of her son, believing it is a lion she has hunted. When Cadmus forces her to see the truth, she experiences the ultimate *aidos*. She sees her own hands, the instrument of the destruction. But this knowledge does not moderate her; it exiles her. She says, *"I see the evil I have done... I cannot bear to look."*

  Plato believes self-knowledge, even painful self-knowledge, is the foundation of virtue. Euripides shows that some self-knowledge is incompatible with life in the *polis*. Agave cannot be "re-educated" into the chorus. She must leave the city. The tragedy demonstrates that the dissolution of the self can be irreversible. The "safe test" of the *Laws* presupposes that the self is elastic—that it can stretch into madness and snap back. The *Bacchae* shows that the self is brittle.

  #### Conclusion: What Drama Knows

  So, what does the *Bacchae* add to the philosophical question that the *Laws* cannot answer?

  Plato's moral psychology rests on a premise of **administrability**. He believes the irrational (pleasure, pain, fear) is a material that can be shaped by the rational city. He believes we can stand outside our own passions, observe them under controlled conditions, and integrate that observation into a stable character.

  The *Bacchae* knows that the irrational is not a material, but an **agent**.
  1.  **The Observer is Implicated:** Drama knows that you cannot test the power of the irrational while standing safely outside it. The moment you engage the Dionysian, even to police it, you are drawn into its logic. Pentheus is destroyed not because he is weak, but because he thinks he can observe the god without worshipping him.
  2.  **The Fragility of Identity:** Plato assumes the "self" that is revealed by wine is the *true* self, waiting to be governed. Euripides suggests that the self is a fragile construct that can be unmade. Intoxication (or possession) does not just reveal character; it rewrites ontology. Agave is not "Agave with her guard down"; she is, for a time, not Agave at all.
  3.  **The Cost of Truth:** In the *Laws*, the truth about oneself is a civic asset. In the *Bacchae*, the truth about oneself can be a civic catastrophe. There are things about human nature—our capacity for violence, our longing for dissolution—that the city cannot survive knowing directly.

  End your seminar with this thought: The Athenian Stranger wants to make the city a symposium where wine serves reason. Euripides warns that if you invite the god to the table, you cannot guarantee he will play the role of the wine. He may decide to be the host. And in that contest, the golden cord of reason is not a governor; it is just another string for the god to cut.
