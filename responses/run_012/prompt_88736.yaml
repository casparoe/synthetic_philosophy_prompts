          *   *Robing:* The dissolution of the male/civic identity (Plato's "becoming childish" turned grotesque).
          *   *Messenger:* The miracle vs. the chemical effect.
          *   *Recognition:* The aftermath of the "test."

  6.  **Final Polish:**
      *   Ensure the tone is appropriate for a graduate seminar closing (sophisticated, nuanced, textually grounded).
      *   Check that the conclusion answers the specific prompt: "What does drama know about the limits of self-knowledge through intoxication that the argument does not?"

  7.  **Final Review against constraints:**
