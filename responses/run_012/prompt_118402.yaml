answer: |-
  Adopting Hofstadter's superrationality as a standing policy creates a profound tension in symmetric games where the optimal outcome requires *asymmetric* actions, such as the two-player Volunteer's Dilemma. In this dilemma, the payoff is highest if exactly one person volunteers; if both volunteer, resources are wasted (payoff $V-C$), and if neither volunteers, the opportunity is lost (payoff $0$).

  Here are the consequences of your policy for this specific class of problems.

  ### 1. The Prescription: Identical Choices vs. Required Asymmetry
  If you interpret "choice" strictly as a **pure strategy** (e.g., "Volunteer" or "Wait"), superrationality forces a suboptimal outcome. Since you and your counterparty reason alike, you must make the same choice.
  *   If you choose "Volunteer," they volunteer. Result: Both volunteer. Payoff: $V-C$.
  *   If you choose "Wait," they wait. Result: Neither volunteers. Payoff: $0$.
  *   Assuming $V-C > 0$, the policy prescribes **both volunteering**. This is the "tragedy of the superrationals": logical identity leads to wasteful redundancy.

  To salvage the policy, you must expand the definition of "choice" to include **mixed strategies** (probability distributions). You do not choose "Volunteer"; you choose "Volunteer with probability $p$."
  *   If both choose the same optimal $p$ (e.g., $p=0.5$), you maximize the *expected* value given the constraint of symmetry.
  *   However, because you are independently randomizing based on the same probability, you will still miscoordinate 50% of the time (25% both volunteer, 25% neither volunteers).
  *   **Consequence:** The policy prescribes adopting the optimal symmetric mixed strategy, but it acknowledges an efficiency ceiling lower than the true optimum (where exactly one person volunteers 100% of the time).

  ### 2. Decision Theory or Coordination Device?
  In games like the Prisoner's Dilemma, superrationality functions as a **decision theory**: it tells you how to maximize utility given a logical link between your choice and another's. In the Volunteer's Dilemma, however, it functions best as a **coordination device that presupposes a shared randomization source.**

  *   **As Decision Theory:** If you treat it merely as a rule for individual decision-making ("I will pick $p$ because they will pick $p$"), you arrive at the Symmetric Mixed Nash Equilibrium. This is stable but inefficient.
  *   **As Coordination Device:** To achieve the true optimum (exactly one volunteer), "reasoning alike" must imply agreeing on a **Correlated Equilibrium**. This requires a shared signal (a "Schelling coin").
      *   If you share a random number generator seed, and both run the code `if random() < 0.5: Volunteer`, you remain perfectly correlated (both act or both wait). This is disastrous.
      *   To succeed, the "shared procedure" must include a symmetry-breaking rule (e.g., "The player with the earlier timestamp volunteers on Heads").
  *   **Conclusion:** Without an external mechanism to correlate your randomization *anti-symmetrically*, superrationality is merely a sophisticated way of arriving at a suboptimal mixed equilibrium. It requires a shared randomization source *plus* a convention to break symmetry.

  ### 3. Identical vs. Similar Counterparties
  Paradoxically, in the Volunteer's Dilemma, having a counterparty who is **merely similar** to you is superior to having one who is **identical**.

  *   **Identical Reasoners:** You are locked into the symmetry trap. Your actions are perfectly correlated (either both pure, or both drawn from the same distribution). You cannot naturally drift into the asymmetric optimum.
  *   **Similar Reasoners:** If there is noise in the similarity (e.g., they are 90% likely to reason as you do), divergence becomes possible. If you volunteer, there is a 10% chance they do not. This natural divergence creates the asymmetry required for the optimal payoff ($V$).
  *   **Contrast with Prisoner's Dilemma:** In the PD, similarity is good (promotes mutual cooperation). In the Volunteer's Dilemma, perfect similarity is a liability because it prevents the division of labor. Imperfect similarity acts as a natural symmetry-breaking mechanism, allowing the group to stumble into the efficient asymmetric outcome more often than identical reasoners using independent mixed strategies.

  ### The Most Important Consequence for Action

  The one consequence you must accept for how to actually act is this:

  **You must treat randomization not as a private mental tie-breaker, but as a public, coordinated commitment to a symmetry-breaking protocol.**

  If you rely on strict superrationality with independent randomization, you guarantee wasteful redundancy (both volunteering) or catastrophic failure (neither volunteering) a significant portion of the time. To act optimally, you cannot simply "choose to randomize." You must actively seek or create an **external focal point** (a public coin flip, a difference in arrival time, a distinct role label) that allows you and your counterparty to condition your identical reasoning on *different* inputs. In symmetric games with asymmetric optima, logical identity is an obstacle to efficiency; your policy should compel you to **break the symmetry** rather than preserve it.
