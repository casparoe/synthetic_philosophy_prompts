              *   *Debunking A:* Kin selection explains partiality perfectly without referencing moral truth. It's fitness, not fairness.
              *   *Saving B:* Why isn't the constraint debunked? Because the constraint protects the *agency* required for cooperation. If agents are treated as expendable resources, cooperation collapses. The "truth" here is that stable cooperation requires respecting boundaries. This is a Third Factor argument: Evolution selected for boundary-respecting instincts *because* boundary-respecting is constitutive of the social structures that allowed survival. The moral fact (agents have boundaries) and the evolutionary pressure (need stable cooperation) converge.
