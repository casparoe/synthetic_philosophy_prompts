answer: |-
  ### The case

  The coffee was cold, but Elena didn't move to heat it. On the table lay the file for the embezzlement case, the man's photo staring up with that specific, hollowed-out look of someone waiting for a hammer. For years, she had held the conviction that he *deserved* to suffer. Not just to be stopped, and not just to pay back the money, but to feel a pang of ruin proportional to the betrayal. It felt like a moral axiom, solid as gravity. But now, tracing the rim of her mug, the lineage of that feeling looked less like gravity and more like a threat display.

  She ran the genealogy of the urge. It wasn't reason; it was heat. It was the primate impulse to signal costliness to the tribe: *If you cheat us, look what we will do to you.* That signal kept the group cohesive in the Pleistocene. It deterred free-riders. But did it track truth? Did the universe contain a metaphysical scale that required his pain to balance his gain? No. That was the ghost in the machine. The feeling was a tool for social control, misfiring as a insight into cosmic justice. If she punished him solely to satisfy that hunger, she was just indulging an adaptive hallucination. She could let that belief go. It didn't have to be the foundation.

  But beneath the heat, there was something colder, quieter. The victims were still out the money. Their trust was broken. The relationship between the firm and its clients was damaged. Here, the evolutionary story didn't dissolve the obligation; it anchored it. We are social animals not because we enjoy signaling, but because we survive through coordination. When coordination breaks, there is a factual breach in the network. The duty to repair isn't a hallucination of desert; it's the structural requirement of agency itself. If she ignored the restitution, she wasn't violating a tribal signal; she was denying the reality of the damage. She could drop the need for his suffering without dropping the need for their repair. One was a weapon evolved for order; the other was a mortar evolved for building. She closed the file. He would pay them back. He would not, however, pay with pain.

  ### Why it lands on the first belief
  The debunking targets Retributivism (the belief that wrongdoers deserve suffering proportional to intent) because its etiology is tied to *signaling*. Evolutionary biology suggests altruistic punishment evolved as a costly signal to deter exploitation within a group. The emotional intensity of retributive anger is designed to convince observers of your resolve, not to track a mind-independent moral fact about "desert." Because the adaptive function (deterrence) can be fully explained without referencing the truth of the moral content (cosmic balance), the belief is screened off from truth. Elena realizes her urge to see him suffer is a biological bluff, a heuristic for group stability mistaken for moral insight.

  ### Why the second one survives
  Compensatory Justice (the belief that harm creates an obligation to repair) survives because it relies on a *Third Factor* convergence. While retribution is about signaling, restitution is about structural integrity. Social cooperation is objectively necessary for the survival of agents like us. Therefore, evolutionary pressure selected for instincts that recognize and repair breaches in cooperation. Here, the evolutionary pressure (need for stability) and the moral truth (agents owe repair for damage caused) converge on the same outcome. The selection story doesn't bypass the truth; it tracks it indirectly because recognizing the obligation is constitutive of the survival strategy. Elena keeps this belief because the evolutionary explanation supports its reliability rather than undermining it.

  ### The load-bearing feature
  The distinction between *signaling mechanisms* (which can be decoupled from truth) and *structural constraints* (which must track reality to function). The case holds only if retribution is purely expressive signaling while restitution is constitutive of social reality.

  ### Pull the feature out
  If you remove this distinction and argue that restitution is also just a signaling mechanism (e.g., signaling trustworthiness to future partners), the case collapses into global skepticism. Both beliefs would then be viewed as adaptive fictions useful for survival but unconnected to moral truth. Elena would be forced to admit she cannot trust either intuition, leading to the "easy version" of the prompt where all substantive morality is debunked, leaving only thin formal constraints or nihilism.

  ### The best objection
  A moral fictionalist would argue that even restitution is just a useful fiction; the "obligation" exists only insofar as it promotes fitness, so Elena hasn't saved a moral truth, only a useful heuristic. She hasn't lost a belief in *truth*, only a belief in *utility*. Conversely, a realist defender of the surviving belief would argue that the obligation to repair is mind-independent because damage to agency is a real fact, and the evolutionary convergence confirms our access to it, not just its utility. The tension lies in whether "social survival" is a proxy for "moral truth" or merely a competitor.

  ### What would change my mind
  If it can be demonstrated that the "structural constraint" of restitution is also subject to significant evolutionary distortion (e.g., we over-repair with kin and under-repair with strangers), the local distinction collapses. I am betting on the convergence of social necessity and moral truth, but if social necessity diverges from moral truth in edge cases, the Third Factor defense fails.
