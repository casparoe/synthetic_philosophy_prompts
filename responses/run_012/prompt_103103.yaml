answer: |-
  **The Procedure (Index Card)**

  1.  **Identify the Game:** What work is the word "family" doing *right now*? (e.g., Ensuring comfort? Establishing legal next-of-kin? Protecting privacy?)
  2.  **Scan the Strands:** Check for overlapping features: Biology, Legal Tie, History of Care, Emotional Intimacy, Social Title. (Note: No single strand is required; look for the cluster).
  3.  **Test Alignment:** Do the present strands support the Game identified in Step 1? (e.g., Biology supports inheritance; Care supports bedside comfort).
  4.  **The Stipulation:** If the strands are thin or conflicting, draw the boundary where it best serves the Game. This is not a discovery of fact; it is a moral ruling.
  5.  **Stop:** If admitting them undermines the Game, the word "family" stops at the door.

  ***

  **The Three Cases**

  **1. The Caregiver (12 Years, "Daughter")**
  *   **Game:** Bedside comfort and dignity.
  *   **Strands:** Strong Care, Intimacy, History, Title. Weak Biology/Law.
  *   **Alignment:** The strands present (Care/Intimacy) directly serve the Game (Comfort). The missing strands (Blood) are irrelevant to this specific Game.
  *   **Verdict:** **Yes.** The resemblance is sufficient for the work being done.

  **2. The Estranged Son (Last Day)**
  *   **Game:** Bedside comfort vs. Closure.
  *   **Strands:** Strong Biology/Law. Weak/Negative Care, Intimacy, History.
  *   **Alignment:** Biology supports legal notification, but lacks the Care strand required for intimate access. His presence risks disrupting the Comfort Game.
  *   **Verdict:** **Conditional.** Only "Yes" if the Patient (the center of the Game) requests it. If the patient is unconscious, the stipulation defaults to "No" to protect the sanctity of the space. Biology alone does not win this game.

  **3. The Cruel Ex-Husband**
  *   **Game:** Bedside comfort.
  *   **Strands:** Strong History/Law. Negative Care (Cruelty). Negative Intimacy.
  *   **Alignment:** Active cruelty undermines the Game (Comfort). Admitting him based on the abstract slogan "family is family" treats "family" as an essence rather than a use.
  *   **Verdict:** **No.** The procedure blocks him.
  *   **To Earn the Yes:** You must change the Game. If the *Patient* wakes and demands him for forgiveness, the Game shifts from "Protection" to "Patient Autonomy." Then the strands align. If your protagonist admits him solely on her own authority because "family is family," she is being essentialist, not Wittgensteinian. She is imposing a definition rather than serving the practice. To keep the scene honest, she must admit she is breaking her own rules for the sake of mercy, not because he qualifies.

  ***

  **Where It Breaks Down (The Editor's Call)**

  You asked how to distinguish a borderline case from a different game.

  A **borderline case** is when the strands are faint. (e.g., A fiancé of three months). The overlaps are there, just thin. You resolve this with the Stipulation (Step 4).

  A **different game** is when someone uses the word to win a prize the hospice isn't offering. (e.g., A relative claiming "family" status to demand medical records they aren't legally entitled to). They are playing the "Legal Liability" game while you are playing the "Care" game. It isn't a disagreement about facts; it's a collision of practices.

  **The Hard Truth:** Wittgenstein does not give you a threshold. He explicitly says language has no sharp boundaries. The line where "enough overlap" becomes "family" is not found; it is *made*.

  Your protagonist cannot find the right answer in the universe. She must *legislate* it. In your draft, stop having her search for the truth of the relationship. Have her feel the weight of the stipulation. She isn't discovering who belongs; she is deciding who belongs based on what kind of hospice she runs. That is where the tension lives. The theory doesn't save her from the choice; it just clarifies that the choice is hers.
