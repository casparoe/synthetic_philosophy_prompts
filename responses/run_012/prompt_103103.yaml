          *   Faithful to Wittgenstein (no "vibes" version).
          *   Actionable procedure (ordered list of questions) for in-the-moment use.
          *   Must acknowledge where the threshold comes from (stipulation, not theory).
          *   Must distinguish between borderline cases and different language games.
          *   Apply to three specific cases:
              1.  Paid caregiver (12 years, called "daughter").
              2.  Estranged biological son (last day).
              3.  Cruel ex-husband (protagonist wants to admit him as "family is family").
          *   Word count: Under 900 words.
          *   Structure: Procedure first (index card style), then three cases, then breakdown/editor call.
          *   Tone: Practical, honest, philosophical but accessible.

  2.  **Deconstruct Wittgenstein for this Context:**
      *   *Family Resemblance:* There is no single essential feature shared by all instances of "family." Instead, there are overlapping similarities (blood, law, care, intimacy, history).
      *   *Language Games:* Meaning is use. "Family" means different things in different contexts (legal inheritance vs. hospice visitation vs. genetic testing). The stakes define the game.
      *   *Threshold:* Wittgenstein explicitly says there is no sharp boundary. The boundary is drawn by *purpose* (the game being played).
      *   *Application:* The protagonist needs to check overlapping features, but ultimately decide based on the *purpose* of the hospice rules (comfort, safety, dignity).

  3.  **Drafting the Procedure (The Index Card):**
