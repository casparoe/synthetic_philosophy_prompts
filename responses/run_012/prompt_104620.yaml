  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **User:** Facilitator of a giving circle (30 young professionals).
      *   **Problem:** Members ask "How much am I *actually* supposed to give?" after meetings. User has 20 mins/person, no authority, needs a procedure that yields a number/rule members will accept.
      *   **Philosophical Context:** User knows consequentialist demandingness arguments (give until marginal utility equals personal loss). Finds them either too extreme ("give everything") or vague ("reasonable limits").
      *   **Specific Constraints/Needs:**
          1.  A concrete 20-minute procedure (questions, order, stop conditions).
          2.  Must address the "no-worse-than-average" rule (friend's proposal).
          3.  Must address the "options vs. requirements" problem (if nothing is forbidden, how do we get to "don't do this"?).
          4.  Must work under uncertainty (nobody knows long-run effects).
          5.  Must run on three specific case studies (120k/50%, 10% to 5% for kid, hate job for 3x giving).
          6.  Must be blunt, admit uncertainty/judgment calls.
          7.  Must identify failure points and falsification conditions (what would change the procedure's shape).

  2.  **Deconstruct the Philosophical Tension:**

      *   *The Demandingness Objection:* Pure act consequentialism implies extreme sacrifice. Most people reject this intuitively.
      *   *The "No-Worse-Than-Average" Rule:* This is a satisficing or threshold view. It's principled (equality/fairness) but arbitrary (why average? why not median? why not upper quartile?).
      *   *The "Options" Problem:* If consequentialism only ranks outcomes, it doesn't inherently generate *obligations* unless paired with a theory of blame or requirement. We need a bridge from "better" to "required."
      *   *Uncertainty:* We can't calculate actual utility. We need heuristics.

  3.  **Develop the Procedure (The "Marginal Stability Protocol"):**

      *   *Goal:* Not to find the *true* moral optimum (impossible), but to find a *stable commitment* that balances impact with sustainability, acknowledging the consequentialist drive without succumbing to burnout.
      *   *Structure:* 4 Steps.
      *   *Step 1: Baseline Viability (The Floor).* Can you function? (Addresses burnout/sustainability).
      *   *Step 2: The Comparative Threshold (The "Average" Rule).* Address the friend's constraint. Is it a floor or a ceiling?
      *   *Step 3: The Marginal Test (The Consequentialist Core).* Does the next dollar do more good there than here? (Addresses the "give until it hurts" impulse).
      *   *Step 4: The Integrity Check (The "Options" Problem).* Can you live with this without resentment? (Addresses the transition from "better" to "required").

      *   *Refining the "Average" Rule:* It shouldn't be a hard cap. It should be a *safe harbor*. If you live at or below average, you are morally safe. If above, you need justification.
      *   *Refining the "Options" Problem:* Acknowledge that the procedure generates *recommendations*, not *commands*. The "requirement" comes from the member's own endorsement of the goal (maximizing good).

  4.  **Drafting the Steps (Iterative refinement):**

      *   *Q1 (Viability):* "If you give this amount, will you burn out or become dependent within 2 years?" If Yes -> Lower amount.
      *   *Q2 (The Average):* "Does this leave you above the national median disposable income?" If Yes -> "Why is that surplus more valuable to you than the good it could buy?" (Forces justification).
      *   *Q3 (Marginal):* "Is there a specific, known opportunity where the next $1k does more good than keeping it?" If Yes -> Give it.
      *   *Q4 (Endorsement):* "Will you resent this?" If Yes -> Lower amount. (Resentment kills long-term giving).

      *   *Wait, I need to be sharper.* The user wants to know where the procedure stops and hands it back.
      *   *Revised Step 1:* Sustainability Check.
      *   *Revised Step 2:* The "Average" Test (incorporating the friend's rule).
      *   *Revised Step 3:* The Epistemic Limit (Uncertainty).
      *   *Revised Step 4:* The Authority Handoff (Values).

  5.  **Addressing the Specific Philosophical Constraints:**

      *   *Demandingness:* The procedure accepts that consequentialism *is* demanding but limits it by epistemic uncertainty and psychological sustainability (instrumental value of the agent).
      *   *Options vs. Requirements:* The procedure explicitly states: "Consequentialism ranks states; it does not issue commands. This procedure finds the point where *you* command yourself."
      *   *Uncertainty:* Use "known high-impact" vs. "speculative future."

  6.  **Running the Cases:**

      *   *Case 1 (120k, 50%):* High income, no dependents. 50% is extreme. Sustainability check might pass, but "Average" check will flag it. Is it required? Procedure should say "Supererogatory, not required."
      *   *Case 2 (Mom, 10% -> 5%):* Kid's care is a "local good" with high certainty vs. "distant good." Procedure should validate the shift. The kid's welfare is a prerequisite for her ability to do good later.
      *   *Case 3 (Hate Job, 3x Giving):* Burnout risk. Earning capacity is an asset. Destroying the asset (mental health/career trajectory) for short term gain is bad consequentialism. Procedure should advise against it.

  7.  **Identifying Failure Points & Falsification:**

      *   *Failure:* People using it to rationalize greed. Or people burning out because they ignore the "resentment" check.
      *   *Falsification:* If it turns out that psychological sustainability *doesn't* correlate with long-term giving (i.e., burnout doesn't happen, or people bounce back instantly), the sustainability constraint falls away. Or if the "Average" line is proven to be morally arbitrary in a way that *matters* for utility.

  8.  **Refining the Tone:**

      *   Needs to be professional, direct, slightly philosophical but practical.
      *   Avoid moralizing.
      *   Acknowledge the user's lack of authority.

  9.  **Final Polish of the Procedure (The "Stable Commitment Protocol"):**

      *   Make it a flowchart logic.
      *   Define the "Stop" points clearly.
      *   Ensure the "Average Rule" is treated as a *shield*, not a *sword*. (It protects you from guilt, it doesn't limit your virtue).
      *   Ensure the "Options" problem is solved by shifting authority to the agent's own values.

      *(Self-Correction during drafting)*: I need to make sure I don't just give advice, but give the *tool* the user asked for. The tool must be something they can *use* in the 20 minutes.
      *   *Step 1:* The Sustainability Floor.
      *   *Step 2:* The "Average" Shield (Addressing the friend).
      *   *Step 3:* The Marginal Knowledge Test (Addressing uncertainty).
      *   *Step 4:* The Value Handoff (Addressing authority).

      *   *Wait, the "Average" rule:* The friend says "Keep what you need to live average, give the rest." The procedure needs to evaluate if that's a *stopping point*. I will argue it's a *safe harbor*, not a *limit*. You can give more, but you aren't *blamable* if you stop there.
      *   *The "Options" problem:* If nothing is forbidden, the procedure can't say "Don't do this." It can only say "This is suboptimal." I need to make sure the procedure distinguishes between *Obligation* (Minimum) and *Optimization* (Target).

      *   *Let's structure the procedure around "The Minimum Viable Commitment" vs "The Target".*
      *   Actually, the prompt asks for "how much am I supposed to give." That implies an obligation.
      *   Okay, I will frame the procedure as finding the **Sustainable Maximum**.
      *   Why? Because consequentialism pushes up. The constraints push down. The meeting point is the answer.

      *   *Revised Plan:*
          1.  **Sustainability Check:** (Can you keep doing this?)
          2.  **The "Average" Threshold:** (Is this fair?)
          3.  **The Epistemic Cut-off:** (Do you know where the money goes?)
          4.  **The Authority Handoff:** (Do you own this?)

      *   *Let's refine the "Average" rule handling.* The friend's rule is essentially a "Fair Share" view. I need to tell the user whether to build it in. I'll argue it should be a *presumption of sufficiency*, not a *cap*.
      *   *Let's refine the "Options" problem.* The procedure must state: "Consequentialism identifies better states. This procedure identifies the point where *you* convert 'better' into 'required'."

      *(Final check of the three cases)*:
      1.  120k/50%: Sustainability? Maybe. Average? Way below. Epistemic? Maybe. Verdict: Supererogatory.
      2.  Mom/5%: Sustainability (Kid's care is essential). Average? Likely still above. Verdict: Justified reduction.
      3.  Hate Job: Sustainability (High risk). Verdict: Reject.

      *Okay, ready to write.*

      *Wait, one more thing:* The prompt asks "what would change your mind about its overall shape." I need a specific philosophical claim that, if false, breaks the procedure.
      *   Claim: "Agent burnout reduces long-term utility." If false, the sustainability check is useless.
      *   Claim: "Uncertainty diminishes obligation." If false (i.e., if we are obligated to guess), the epistemic cut-off changes.

      *Let's finalize the procedure name:* **The Marginal Stability Protocol.**

      *Structure:*
      1.  Introduction (Philosophy of the tool).
      2.  The Procedure (4 Steps).
      3.  The Three Cases.
      4.  Failure Modes & Falsification.

      *Tone Check:* Blunt, not flattering. Acknowledge limits.

      *(Self-Correction on "Average Rule")*: The friend says "You're *allowed* to keep... everything above that is fair game." The procedure needs to say if that's principled. It's principled as a *blamelessness threshold*, not an *optimization threshold*. I will make that distinction clear.

      *(Self-Correction on "Options")*: The prompt notes "nothing is ever actually required or forbidden." The procedure must explicitly state: "This tool does not generate moral facts. It generates personal policy."

      *Okay, good to go.*
answer: |-
  Here is the procedure, the philosophical justification for its design, the application to your three members, and the conditions under which it fails.

  ### The Tool: The Marginal Stability Protocol

  **Purpose:** To convert abstract consequentialist pressure into a sustainable, actionable commitment without claiming false moral authority.
  **Time:** 20 Minutes.
  **Authority:** None. This generates a *recommendation*, not a verdict. The member signs the number, not you.

  **Philosophical Underpinnings:**
  1.  **Demandingness:** Acknowledged but bounded by *instrumental sustainability*. You cannot maximize good if you destroy the agent (yourself).
  2.  **The "Average" Rule:** Treated as a **Safe Harbor**, not a Cap. It defines the point below which you are immune to blame, not the point above which you are forbidden to go.
  3.  **Options vs. Requirements:** The procedure distinguishes between *Optimal* (consequentialist ranking) and *Required* (personal policy). It forces the member to choose where they draw the line of obligation for themselves.
  4.  **Uncertainty:** Uses an **Epistemic Cut-off**. You are not required to gamble on low-probability, high-impact speculation if it jeopardizes high-probability, near-term stability.

  ---

  ### The Procedure (Step-by-Step)

  Ask these questions in order. Do not skip. If a "No" is triggered, the number must be adjusted downward until the answer is "Yes."

  #### Step 1: The Sustainability Floor (The Burnout Check)
  **Question:** "If you commit to this number for 5 years, accounting for inflation and income shocks, will you deplete your emergency savings or compromise your ability to work (health, mental stability, housing)?"
  *   **Good Answer:** "No. I have modeled this against my worst-case budget."
  *   **Bad Answer:** "I hope not," or "I'll cut back if I have to."
  *   **Stop Condition:** If the answer is "Yes, it risks my stability," **stop.** The number is too high. Lower it until the answer is No.
  *   **Why:** Consequentialism requires the agent to exist and function. Destroying the asset (you) to fund the output (giving) is net-negative utility.

  #### Step 2: The Fairness Threshold (The "Average" Rule)
  **Question:** "Does this contribution level leave you with disposable income below the national median for your demographic?"
  *   **Good Answer:** "Yes, it leaves me at or below median." OR "No, but I accept the surplus as a personal choice, not a requirement."
  *   **Bad Answer:** "No, and I think I'm entitled to keep the surplus."
  *   **Stop Condition:** This step does **not** force a lower number. It forces a *classification*.
      *   If they give enough to be at/below average: Mark as **Obligatory Minimum**. (They are safe from blame).
      *   If they give less than that: Mark as **Deficit**. (They must justify why their surplus is more valuable than the marginal good).
      *   If they give more than that: Mark as **Supererogatory**. (Praiseworthy, but not required).
  *   **Why:** Your friend's rule is principled as a *blamelessness threshold*. It answers "When can I stop feeling guilty?" not "When must I stop giving?" The procedure codifies this distinction.

  #### Step 3: The Epistemic Cut-off (The Uncertainty Check)
  **Question:** "Do you have high-confidence evidence that the next dollar given does more good than the next dollar kept for your own security/career growth?"
  *   **Good Answer:** "Yes, the charity is vetted, or my security prevents future dependency."
  *   **Bad Answer:** "Probably, theoretically, or I'm not sure but I want to be safe."
  *   **Stop Condition:** If the member is sacrificing high-certainty personal stability for low-certainty distant impact, **stop.** Lower the number.
  *   **Why:** Under uncertainty, expected utility calculations favor known, near-term stability over speculative, long-term altruism. You cannot require someone to gamble their livelihood on a probability they cannot calculate.

  #### Step 4: The Authority Handoff (The Values Check)
  **Question:** "Consequentialism says one outcome is better than another, but it doesn't issue commands. Are you willing to sign your name to this number as a *personal rule*, knowing you could technically give more but choosing not to?"
  *   **Good Answer:** "Yes. I own this limit."
  *   **Bad Answer:** "I want you to tell me I *have* to."
  *   **Stop Condition:** If they refuse to own the limit, **hand the thing back.** Tell them: "There is no fact of the matter. You are asking for a law where there is only a preference. Come back when you have decided what kind of agent you want to be."
  *   **Why:** This solves the "Options" problem. The move from "worse" to "forbidden" is made by the agent's commitment, not by the moral theory.

  ---

  ### Running the Cases

  Here is how the protocol moves through your three members.

  #### Case 1: The High Earner (120k, No Dependents, Asking if 50% is enough)
  *   **Step 1 (Sustainability):** 50% of 120k is 60k living. In most cities, this is viable for a single person. **Pass.**
  *   **Step 2 (Average):** Living on 60k is likely near or below the national median disposable income. **Classification: Obligatory Minimum / Safe Harbor.**
  *   **Step 3 (Epistemic):** Does he know where the money goes? Assuming yes (giving circle context). **Pass.**
  *   **Step 4 (Authority):** He is asking if it is *enough*.
  *   **Verdict:** The procedure classifies 50% as **Supererogatory**.
      *   *Script:* "You are asking if you are *allowed* to stop. Step 2 says if you drop to the median income level (say, 30% giving), you are blameless. 50% is above the requirement. It is excellent, but if you burn out in three years, it was a bad investment. The procedure suggests capping at 35-40% to ensure 10-year sustainability, unless you explicitly choose to burn bright and fast."
      *   *Outcome:* He realizes 50% isn't the *floor*, it's the *ceiling*. He can lower it without guilt, or keep it as a virtue, not a duty.

  #### Case 2: The Mother (10% to 5%, Kid's Care)
  *   **Step 1 (Sustainability):** She claims the 5% cut is *for* stability (kid's care). If the kid's care fails, her ability to function/give later collapses. **Pass (at 5%).**
  *   **Step 2 (Average):** Even at 5%, she is likely well above the "Average" threshold. **Classification: Deficit (relative to the friend's rule), but Justified.**
      *   *Nuance:* The "Average" rule applies to *disposable* income. Medical care is not disposable. Her "effective income" is lower.
  *   **Step 3 (Epistemic):** The good done for her kid is high-certainty. The good done by the donated 5% is high-certainty. This is a trade-off between two certain goods.
  *   **Step 4 (Authority):** She wants to drop.
  *   **Verdict:** **Approved.**
      *   *Script:* "Step 1 overrides Step 2. Your child's care is a prerequisite for your future agency. Dropping to 5% preserves the agent. However, acknowledge this is a 'Deficit' relative to the group norm. You are trading distant impact for local stability. That is a valid consequentialist trade under uncertainty."

  #### Case 3: The Finance Job (Hate Job, 3x Giving)
  *   **Step 1 (Sustainability):** He says he would "hate" it. High risk of burnout, career pivot later, mental health decline. **Fail.**
  *   **Step 2 (Average):** Irrelevant, Step 1 failed.
  *   **Step 3 (Epistemic):** Tripling giving is high-impact, but the cost is high-certainty misery.
  *   **Step 4 (Authority):** He is asking for permission to suffer.
  *   **Verdict:** **Reject.**
      *   *Script:* "Step 1 stops this. A miserable agent is a less effective agent over time. If you quit in two years, the net giving is lower than if you stay in a job you tolerate and give less. You are trying to maximize short-term cash flow at the expense of long-term asset value (your career/health). The procedure says no."

  ---

  ### Where This Procedure Goes Wrong

  1.  **Rationalization Engine:** Members will use Step 1 (Sustainability) to lie to themselves. They will claim they *need* luxury to function.
      *   *Mitigation:* Ask for the budget. "Show me the line item where this cut breaks you." If it's "vacations," challenge it. If it's "rent," accept it.
  2.  **The "Average" Arbitrary Line:** Why the median? Why not the 75th percentile?
      *   *Weakness:* It is arbitrary. It is a focal point for coordination, not a moral truth. If the group culture shifts, this number shifts.
  3.  **The Authority Handoff:** Some members *want* to be told what to do. They want the "demandingness" to be external so they can blame you if it hurts.
      *   *Risk:* They will ignore Step 4 and treat your recommendation as a command. You must verbally disclaim authority every time.

  ### Falsification Conditions (What Would Change My Mind)

  If you want to know if this procedure is philosophically sound, test these two claims. If either is proven false, burn the protocol and start over.

  **1. The Instrumental Claim:**
  *   *Claim:* "Agent burnout reduces long-term altruistic output."
  *   *Falsification:* If data shows that people who give until they collapse (financial or mental) tend to bounce back quickly and give *more* over a lifetime than those who pace themselves, then Step 1 is wrong. We should be encouraging burnout as a "spend down" strategy. (Current evidence suggests this is false, but if it were true, the Sustainability Floor vanishes).

  **2. The Epistemic Claim:**
  *   *Claim:* "Uncertainty diminishes obligation."
  *   *Falsification:* If it turns out we *can* reliably calculate long-term effects of income redistribution (e.g., if macroeconomic models become perfect), then Step 3 (Epistemic Cut-off) is cowardice. We would be required to give based on the calculation, not the confidence level. If the math says give 90%, uncertainty is no excuse.

  ### Summary for Your Conversations

  When someone corners you:
  1.  **Don't give a number.** Give the **Step 1 Check**. ("Will this break you in 5 years?")
  2.  **Don't judge the surplus.** Use the **Step 2 Classification**. ("That leaves you above average. That's praiseworthy, but not required.")
  3.  **Don't solve the uncertainty.** Use the **Step 3 Cut-off**. ("If you don't know where it goes, keep it for security.")
  4.  **Don't take the blame.** Use the **Step 4 Handoff**. ("I can't tell you what to value. I can only help you check if your plan is stable.")

  This keeps you out of the role of "Moral Police" and puts you in the role of "Stability Auditor." It respects the consequentialist drive without succumbing to its impossible demands.
