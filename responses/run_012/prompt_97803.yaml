answer: |-
  The settlement of Oremouth sat in the bowl of a dead volcano, shielded from the winds that scour the rest of the plateau. There were three hundred souls there, miners and smelters and families who had never seen the sea. They lived under the Charter of the High Seat.

  The High Seat was not a person, strictly speaking, but an office occupied by a man named Varrick. Under the Charter, Varrick owned the ground beneath their feet, the water in the cisterns, and the ore in the walls. He could evict any family without cause. He could confiscate tools, change shifts, or alter the rationing on a whim. He needed no council's approval, no judge's signature. His word was the only law, and the only check on his power was his own restraint.

  Varrick had not exercised a single one of these powers in forty years.

  Mara stood by the smelter, wiping grease from her hands. The air smelled of sulfur and cool stone. Beside her, Tomas was calibrating the pressure valve. He hummed as he worked, a sound of genuine contentment.

  "You're tightening it too much," Mara said.

  "It's perfect," Tomas replied, not looking up. "Look at us, Mara. We grow our own food in the lower terraces. We set our own shifts. When was the last time anyone told you where to stand?"

  "Never," Mara said. "But that's not the point."

  Tomas straightened, wiping his brow. "Then what is? You walk where you like. You speak what you think. You built that workshop behind your house without asking. If that isn't freedom, show me what is."

  "Freedom is not having to ask," Mara said, her voice low. "I didn't ask because I knew he wouldn't care. But I also knew he could tear it down tomorrow. That knowledge sits in the room with me when I'm working. It sits at the table when I eat."

  "You're haunted by a ghost," Tomas said, tapping the gauge. "Varrick hasn't visited the lower terraces since before I was born. He lives in the Manse up the ridge. He sends supplies. He sends nothing else. To say we aren't free because a man *might* interfere is like saying we aren't safe because it *might* rain."

  "It's not the rain," Mara said. "It's the roof. He owns the roof."

  The disagreement had been simmering for months, a low hum beneath the daily work of Oremouth. To Tomas, liberty was a negative space: the absence of obstacles. No one blocked his path; therefore, the path was clear. To Mara, liberty was a status: the absence of a master. Even if the master sleeps, the relationship remains.

  The tension broke on a Tuesday.

  Mara had expanded her workshop. It was a modest addition, just enough to house a new lathe she'd rigged from scrap. It encroached slightly on the communal walkway, perhaps a foot. Technically, under Section 4 of the Charter, any alteration to the settlement's footprint required the High Seat's express consent. Technically, Varrick could have her arrested for encroachment. Technically, he could have her family's housing assignment revoked.

  She was welding the final joint when the shadow fell across the ground.

  It wasn't a guard. It was Varrick himself. He was an old man, dressed in a coat that seemed too heavy for the season, leaning on a cane of dark wood. He stood at the edge of the workshop, looking at the new wall, then at the walkway, then at Mara.

  Tomas froze near the smelter. A few other miners stopped what they were doing. The silence of the volcano bowl seemed to deepen, swallowing the hiss of the cooling metal.

  Varrick did not shout. He did not frown. He walked forward, slowly, and stopped inches from the new wall. He ran a gloved hand along the rough-hewn timber. He looked at the foot of space he had lost on the walkway.

  Mara dropped the welding mask. She waited for the order. *Demolish this.* *Pay the fine.* *Leave.*

  Varrick reached into his coat. Tomas took a half-step forward, instinctively, as if to intervene, though there was no violence to stop. Varrick pulled out a small notebook and a pen. He wrote something. He tore the page out and held it toward Mara.

  She took it. It was a receipt. *Material Allocation: Timber, Grade B. Approved for Use.*

  "I noticed you were short on lumber," Varrick said. His voice was dry, like paper rubbing together. "I added this to your monthly allotment. Retroactively."

  He didn't say *I allow this.* He didn't say *You did well.* He didn't say *The rule is waived.*

  He turned to leave, then paused. He looked back at the wall, then at Mara. "The walkway is narrow here. Be careful not to trip anyone."

  Then he walked away, up the path toward the Manse, his cane clicking against the stone.

  Mara stood holding the receipt. It was a gift, but it felt like a brand.

  Tomas came over, letting out a breath he seemed to have been holding for minutes. "See?" he said, gesturing at the retreating figure. "He didn't stop you. He helped you. He validated your work. You're worrying over nothing."

  "He validated it," Mara said, her voice trembling slightly. "That's the problem."

  "He gave you wood," Tomas insisted. "He could have ordered the wall down. He didn't. He exercised his power to aid you, not hinder you. How is that oppression?"

  "Because he chose," Mara said. "If I had a right to build there, he wouldn't need to choose. He wouldn't need to give me the wood. I would just take the wood, and I would just build. His kindness proves his ownership."

  "Practicality versus philosophy," Tomas said, shaking his head. "In practice, you have your workshop. In practice, you have the wood. In practice, you are unharmed. What more do you want? Do you want him to leave? If he leaves, who maintains the water filters? Who negotiates with the plateau traders?"

  "I want to know that if he leaves, I still own my hands," Mara said. "I want to know that if he wakes up cruel tomorrow, I have a wall to hide behind that he cannot knock down. Right now, I have nothing he hasn't lent me."

  "He hasn't lent you anything in forty years," Tomas argued. "Why borrow trouble from a future that won't happen? We live in the peace we have. To reject it because it *could* be taken is to live in fear of a shadow."

  "It's not a shadow," Mara said, looking at the receipt. "It's the hand that casts it."

  She looked up at the Manse on the ridge. It was silent. No guards patrolled the perimeter. No cameras swiveled to track her movement. By every outward measure, she was alone. She was unimpeded. She could walk away from the workshop right now, go to her home, cook dinner, sleep. No one would stop her.

  But as she walked back to the smelter, she felt the weight of the receipt in her pocket. It was light paper, but it dragged at her coat.

  Tomas resumed his work on the valve. "You're free, Mara," he called out, not looking up. "Nothing stands in your way."

  Mara picked up her wrench. The metal was cool and solid. "Nothing stands in my way," she repeated, "because nothing is allowed to stand in my way except him."

  "And he isn't," Tomas said.

  "No," Mara said. "He's just watching to see if I notice."

  They worked in silence for the rest of the shift. The sun dipped below the crater rim, casting long shadows across the settlement. The lights flickered on, powered by the grid Varrick owned. The water flowed from the taps Varrick controlled. The air was clean, filtered by systems Varrick had purchased.

  Tomas hummed again, a tuneless song of a man who believes he is safe because no one is hitting him. Mara tightened a bolt, feeling the resistance of the thread, thinking of the hand that could strip it all away without reason, without warning, without ever raising its voice.

  The wall stood. The walkway remained narrow. The High Seat sat in the Manse. And in the quiet of the volcano bowl, the difference between a gift and a right remained exactly where it was: invisible to one, and heavy as stone to the other.
