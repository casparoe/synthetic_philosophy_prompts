answer: |-
  Here are ten questions designed to press the structural weaknesses of the Moral Equality of Combatants (MEC) position, tailored for a dialogue between a scientist and a philosopher. Each includes a follow-up based on the standard defense she is likely to offer.

  **1. The Permitted vs. Excused Distinction**
  You argue that the unjust combatant is not a murderer because he is fighting under conditions of epistemic limitation or duress. But I need to know: are you saying his act of killing is *morally permitted*, or are you saying it is *wrong but excused*? If it's merely excused, then the revisionists are right about the morality—you're just arguing about whether we should punish him. If it's permitted, how can an act that contributes to an unjust outcome be morally allowed?

  *   **Follow-up (If she says "Excused"):** If it's excused, then the "equality" you defend isn't a moral equality at all; it's just a symmetrical lack of culpability. One soldier is doing what he ought to do, the other is doing what he ought not to do but gets a pass. Doesn't that collapse the strong claim of "moral equality" into a weak claim of "equal impunity"?
  *   **Follow-up (If she says "Permitted"):** If it's permitted, then the justice of the cause is irrelevant to the morality of the killing. But if I hire a hitman to kill an innocent person, and he does it believing I have a right to want him dead, we don't say his act is permitted. Why does the uniform change the metaphysics of permission where ordinary agency doesn't?

  **2. The Liability Problem**
  Let's talk about the soldier on the *just* side. He kills the unjust combatant. For that killing to be permissible, the unjust combatant must have done something to make himself liable to be killed. But if the unjust combatant is blameless (because he was duped or conscripted), he hasn't forfeited his right to life. So, is the just soldier killing a man who has a right not to be killed? If so, how is that not a rights violation?

  *   **Follow-up (If she says "Liability doesn't require fault"):** If you can be liable to be killed without doing anything wrong, then liability is detached from moral agency. It becomes a matter of geography or bad luck. Does that mean morality isn't about what we *do*, but just about where we *stand*?
  *   **Follow-up (If she says "He poses a threat"):** A civilian driving a fuel truck to the front poses a threat. A voter who elected the warmonger poses a threat. We don't say they are liable to be killed. Why does the unjust soldier's threat make him liable when the civilian's contributory threat does not?

  **3. Truth vs. Convention**
  Is the Moral Equality of Combatants a deep moral truth, or is it a working convention? Many defenders argue that if we stopped treating soldiers as equals, wars would become more brutal because soldiers would fear prosecution for simply fighting. If that's the case, aren't you arguing for a useful fiction rather than moral reality?

  *   **Follow-up (If she says "It's a convention"):** If it's a convention, then in a world where everyone knew the truth about their cause, the equality would vanish. That means your theory admits that unjust combatants *are* morally inferior, we just agree to pretend they aren't to keep the peace. Is that an honest position for a moral philosopher to hold?
  *   **Follow-up (If she says "It's a moral truth"):** If it's a truth, it should hold regardless of consequences. But your defense often relies on the catastrophic humanitarian costs of the revisionist view. Are you grounding your morality in rights or in utility? Because you can't have it both ways.

  **4. The Epistemic Luck (The Lab Analogy)**
  In my field, if a junior researcher signs off on data that turns out to be falsified by a senior supervisor, we still hold the junior researcher accountable for not verifying the protocol. We say ignorance of the error isn't a license to publish. Why is war different? Why does "I didn't know the war was unjust" function as a moral get-out-of-jail-free card when we don't accept that standard in science or law?

  *   **Follow-up (If she says "War is too complex to know"):** Complexity doesn't remove agency. A pilot flying a bomber over a city might not know the strategic necessity, but he knows he's dropping bombs on people. If the cause is unjust, isn't the physical act of killing the thing he should be measuring, not the political briefing?
  *   **Follow-up (If she says "The stakes are life and death"):** The stakes in my lab were public safety and truth. If you sign off on bad data, people get hurt. If the penalty for refusing to fight is prison or death, that's duress, not ignorance. Are you conflating coercion with epistemic limitation?

  **5. The Civilian Symmetry**
  The argument for equality often rests on symmetry: both soldiers are threats to each other, so both are fair game. But civilians are also in a boat. They fund the war, vote for the leaders, and benefit from the victory. If symmetry of threat is the metric, why doesn't the argument prove too much and make civilians legitimate targets? What is the relevant difference that stops the logic at the uniform?

  *   **Follow-up (If she says "Civilians aren't direct threats"):** What about the engineer designing the guidance systems from home? Or the factory worker? They are causally closer to the killing than the infantryman pulling the trigger. If directness is the line, where exactly do you draw it, and isn't that line arbitrary?
  *   **Follow-up (If she says "Civilians have rights soldiers waive"):** Do soldiers waive rights by putting on a uniform, or do they gain liabilities? If they waive rights, does that mean a soldier has fewer human rights than a civilian? If so, why do we claim to fight for human rights by using men who have temporarily surrendered them?

  **6. Systemic Atrocities**
  Suppose the unjust side isn't just fighting a wrongful war, but is systematically targeting cities and committing genocide. Does the moral status of the *just* soldier change when he kills the soldier defending that regime? Does the nature of the regime bleed into the moral license of the individual combatant?

  *   **Follow-up (If she says "No, *in bello* is separate"):** If the separation is absolute, then a soldier fighting for a genocidal regime has the same license to kill as a peacekeeper. That seems to drain the word "license" of moral meaning. Are you saying the uniform sanitizes the association?
  *   **Follow-up (If she says "Yes, it changes things"):** If the regime's crimes change the soldier's license, then the equality of combatants is conditional. It depends on the behavior of the state. If it's conditional, then the revisionists are right: the justice of the cause *does* matter. Where is the bright line where the cause becomes so unjust it strips the soldier of equality?

  **7. The Veteran's Reflection**
  Imagine a soldier comes to you ten years after the war, convinced by the historical record that his side was unjust. He asks you: "Did I murder those men?" If you uphold equality, you must say "No." But if he killed for a lie, how was it not murder? If you say "Yes, it was murder," you undermine the equality you defended while he was fighting. How do you answer him without contradicting yourself?

  *   **Follow-up (If she says "He did his duty"):** Duty to whom? If the state lied to him, his duty was to a fiction. Can you have a moral duty to fulfill an immoral contract?
  *   **Follow-up (If she says "He wasn't culpable then"):** So he wasn't a murderer *then*, but the acts were objectively wrong? That means he lives with the moral residue of wrongdoing without the status of a wrongdoer. Is that a stable place for a human being to live, or just a philosophical convenience?

  **8. The Uniform as Moral Switch**
  You argue that combatant status grants a license to kill that civilians don't have. But putting on a uniform is a physical act that takes seconds. Are you arguing that a metaphysical change in moral status—going from "murderer" to "soldier"—happens simply by changing clothes?

  *   **Follow-up (If she says "It's about social role"):** If it's a social role, then morality is social construction. That means if we agreed tomorrow that bankers were legitimate targets in an economic war, they would be. Is your theory robust enough to survive a change in social convention?
  *   **Follow-up (If she says "It's about being a direct instrument"):** A terrorist is a direct instrument of his cause. We don't grant him combatant equality. We call him a criminal. What makes the state's instrument morally superior to the non-state instrument if the act of killing is identical?

  **9. Immediate Aggression vs. National Defense**
  In a street fight, if I swing at you because I mistakenly think you attacked me, I am still the aggressor in that moment. You have a right to stop me. Why does scaling this up to armies change the dynamic? The unjust soldier is still the one initiating the force that requires stopping. Why isn't he the moral aggressor in the immediate encounter, regardless of the war's cause?

  *   **Follow-up (If she says "He is acting on orders"):** Orders don't absolve in Nuremberg. Why do they absolve in the fog of war? If the order is to invade a sovereign nation, isn't the execution of that order the aggression?
  *   **Follow-up (If she says "Both are defending themselves"):** The just soldier is defending his country. The unjust soldier is defending... what? His own life? If he's the invader, his life is only at risk because he put it at risk. Can you claim self-defense against a threat you created?

  **10. The Cost of Truth**
  Finally, the pragmatic argument: You suggest that accepting the revisionist view (that unjust combatants are moral equals only in a limited sense) would make peace harder because losers would be treated as criminals. But if the Traditional view is false, aren't we building peace on a lie? Is a stable peace based on moral falsehood preferable to a difficult peace based on moral truth?

  *   **Follow-up (If she says "Stability is a moral good"):** Stability for whom? For the aggressor state that can tell its soldiers they did nothing wrong? If we tell unjust soldiers they were moral equals, don't we make it easier for them to fight the next unjust war?
  *   **Follow-up (If she says "We can't know the truth in real time"):** We can't know it in real time, but we can know it in retrospect. If your theory only works in real time, isn't it just a rule for confusion? Shouldn't philosophy aim to clarify the confusion, not codify it?
