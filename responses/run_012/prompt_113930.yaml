  We pointed up at the gold coin of day,
  The Sun burning bright in the blue.
  We said it was fire that never decayed,
  A chariot pulled by birds through the view.

  We said it was distinct from the stars in the track,
  The Sun having no kin in the black.
  We thought if the night stars were dust, it was stone,
  A singular king on a throne.

  Then lenses were ground and the spectrum was split,
  The Sun showed its fingerprint lines.
  The iron was there, in the distant domains,
  Same blood as the night-time designs.

  We learned it by looking, we touched the remote,
  The Sun was a star all along.
  The land was already fixed, though the map was unnoted,
  Though the finding felt fragile and wrong.
