answer: |-
  This is a sophisticated observation that cuts to the core of contemporary governance challenges in dual-use research, AI safety, and geoengineering. You are correct to reject the standard labels of Tragedy of the Commons and Prisoner's Dilemma; while they share the feature of suboptimal equilibria, the *mechanism* you describe is distinct.

  There is no single, canonical noun phrase for this specific configuration in the social science literature, though it is frequently discussed in clusters under **security dilemmas**, **coordination failures under incomplete information**, and **unilateralist dynamics**. However, for a doctoral-level conceptual carving, the most precise label is a **Pre-emptive Security Dilemma** (or **Deployment Security Dilemma**), driven by **uncertainty about actor types**.

  Below is a careful carving of the concept, distinguishing it from adjacent frameworks, analyzing the "cautious actor" paradox, and addressing your counterfactual.

  ### 1. Conceptual Naming and Lineage

  While you will not find this in a standard game theory textbook under one name, it is a synthesis of three established concepts:

  *   **The Security Dilemma (Jervis, 1978):** Traditionally, this describes states increasing their own security (e.g., building defenses) in ways that inadvertently decrease the security of others, prompting escalation. Your case is a *technological* variant: actors deploy a capability to "secure" a safe outcome, which inadvertently triggers the risky outcome they sought to avoid.
  *   **The Unilateralist's Curse (Bostrom et al., 2016):** This describes a situation where a group agrees an action should not be taken, but any single member *can* take it. Your scenario adds a strategic layer: actors take it *because* they anticipate others will.
  *   **Pre-emption Games (Fudenberg & Tirole, 1985):** In economics, this models firms entering a market early to capture advantage. Your scenario inverts the payoff: the "advantage" is not profit, but *damage control* or *norm-shaping*.

  If you need a working label for your dissertation, **"Defensive Pre-emption"** or **"The Responsible Actor's Dilemma"** captures the normative texture, while **"Dynamic Coordination Failure under Type Uncertainty"** captures the game structure.

  ### 2. Distinguishing Boundaries

  Here is how this configuration differs from the standard models you mentioned:

  | Concept | Core Mechanism | Why Your Case is Different |
  | :--- | :--- | :--- |
  | **Tragedy of the Commons** | **Rivalry:** Consumption by one reduces availability for others. | **Non-rival Threshold:** The "resource" isn't depleted; a *state change* is triggered. One lab publishing a pathogen doesn't use up the "pathogen," it changes the global risk environment irreversibly. |
  | **Prisoner's Dilemma** | **Dominant Strategy:** Defection is rational regardless of the other's move. | **Conditional Preference:** Actors *prefer* mutual restraint (Cooperate/Cooperate) over mutual action (Defect/Defect). They only "defect" (act) because they fear the *other's type*, not because action is inherently superior. |
  | **Arms Race** | **Capacity Building:** Competition to accumulate superior capability. | **Threshold Trigger:** The goal isn't to have *more* capability, but to control *when* the capability is realized. It is a race to the starting line, not the finish line. |
  | **Race to the Bottom** | **Regulatory Arbitrage:** Lowering standards to attract capital/activity. | **Normative Pre-emption:** Actors are not lowering standards to gain competitive advantage; they are bypassing a moratorium to prevent a *worse* violation by others. |

  ### 3. The Work of Uncertainty (Incomplete Information)

  The engine of this dynamic is not merely the incentive to act, but **uncertainty about actor types** (specifically, risk tolerance and caution).

  In game theoretic terms, this is a **Bayesian Game**. Actors do not know the "payoff function" of their competitors.
  *   **Actor A (Cautious):** Payoff(Restraint) > Payoff(Action), *unless* Actor B is Reckless.
  *   **Actor B (Reckless):** Payoff(Action) > Payoff(Restraint).

  If Actor A knows Actor B is Cautious, they both restrain. If Actor A knows Actor B is Reckless, Actor A acts (to shape the outcome). The dilemma arises because Actor A assigns a non-zero probability to Actor B being Reckless.

  This uncertainty creates a **belief-driven cascade**. Even if 90% of actors are cautious, if they cannot *verify* each other's caution, the 10% probability of a reckless actor drives the 90% to pre-empt. The uncertainty transforms a **Stag Hunt** (where cooperation is possible if trust exists) into a **Pre-emption Game** (where acting is the dominant strategy under uncertainty).

  ### 4. The "Most Cautious Move First" Variant

  You asked if the variant where the cautious move first is the same phenomenon. **Yes, it is the same structural phenomenon, but it reveals a specific pathology of the information environment.**

  This is not a distinct game; it is the equilibrium outcome of the Pre-emptive Security Dilemma when **outcome quality** is valued higher than **timing**.

  *   **Standard Race:** I act first to win.
  *   **Your Case:** I act first to *minimize loss*.

  This creates a **Perverse Selection Pressure**. In a standard market, the most efficient actors win. In this configuration, the actors with the **lowest threshold for acceptable risk** (the reckless) set the pace, but the actors with the **highest competence** (the cautious) feel compelled to match that pace to mitigate the damage.

  This is distinct from a standard arms race because the motivation is **fiduciary or ethical**, not competitive. The cautious actor reasons: *"My protocol has a 1% risk of leakage. Theirs has a 10% risk. If I wait, they act, and global risk is 10%. If I act, global risk is 1%. Therefore, ethics compels me to break the moratorium."*

  This is **"Ethical Pre-emption."** It distinguishes itself from plain opportunism because the actor incurs a reputational or normative cost (breaking the moratorium) to purchase a safety benefit.

  ### 5. The Counterfactual: Equally Cautious and Common Knowledge

  You asked what the concept predicts if actors are all equally cautious and *know it*.

  **Prediction: The Dilemma Dissolves into a Stag Hunt.**

  If it is **Common Knowledge** that all actors are Cautious (i.e., I know you are cautious, you know I am cautious, I know you know I am cautious...), the incentive to pre-empt vanishes.
  1.  **No Fear of Recklessness:** The primary driver for pre-emption (fear of the "worse" outcome) is removed.
  2.  **Coordination Becomes Possible:** Without the shadow of the reckless actor, the actors can coordinate on the Pareto-optimal outcome (Mutual Restraint).
  3.  **The Problem Becomes Purely Institutional:** The barrier is no longer strategic uncertainty, but the cost of communication and verification.

  **However,** there is a boundary condition: **Verifiability.**
  Even if all actors are equally cautious, if they cannot *verify* each other's caution (e.g., they cannot inspect each other's labs), they must still act under the *possibility* of error.
  *   If I am cautious, but I cannot prove it to you, you might still pre-empt out of fear that *I* am reckless.
  *   Therefore, the dilemma persists if **Type Uncertainty** remains, even if **Type Reality** is uniform.

  This suggests that the solution to this specific policy problem is not merely "building trust" (which implies changing intentions) but **"signaling types"** (transparency, verification regimes, joint safety protocols). The policy intervention required is not a change in incentives (punishment/reward), but a reduction in information asymmetry.

  ### Summary for your Framework

  To integrate this into your dissertation, I recommend framing it as a **Dynamic Coordination Failure driven by Epistemic Uncertainty regarding Risk Tolerance.**

  *   **The Boundary:** It applies where actions are irreversible (or costly to reverse) and where actor "types" (caution levels) are private information.
  *   **The Exclusion:** It does not apply where actors can contractually bind themselves (enforceable moratoriums) or where the action is easily reversible.
  *   **The Prediction:** In the absence of verification mechanisms, increased caution among actors may paradoxically increase the rate of deployment, as cautious actors race to "safer" versions of the technology before reckless actors deploy "dangerous" versions.

  This configuration is arguably the central governance problem of the 21st century (appearing in AI, Bio, and Nano), and treating it as a distinct class from the Prisoner's Dilemma is analytically necessary for designing effective policy. The policy implication is that **transparency** (revealing types) is more critical than **incentive alignment** (changing payoffs).
