      *   *Critique:* The user isn't setting up a straw man, but they might be conflating the historical origin (McCarthy/Hayes) with the broader philosophical uptake (Dennett's "Cognitive Wheels"). The user says "Most textbook statements..." which is fair for AI textbooks, but philosophy textbooks often jump straight to relevance.
      *   *Verdict:* Not a straw man, but needs historical precision. Acknowledge McCarthy/Hayes vs. Dennett/Fodor.

