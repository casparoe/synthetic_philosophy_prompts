      We understand this position may seem rigorous. However, consistent application of these principles is required to maintain actuarial stability in a world without necessary connections. We encourage you to review your policy wording regarding Divine Custom and Acquisition before submitting further claims.

      Sincerely,

      J. V. Thiele
      Senior Claims Adjuster
      Providence Indemnity Corp.

