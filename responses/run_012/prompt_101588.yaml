  Claims Adjustment Division
  14 October 2023

  Claim Reference: 8940-OCC
  Policy Holder: Mr. H. Al-Fulani
  Subject: Denial of Claim – Residential Fire Loss

  Dear Mr. Al-Fulani,

  This letter concerns your claim regarding the destruction of your residence at 42 Rue des Causes on the 3rd of this month. Our field adjusters have completed their inquiry into the sequence of events. While we acknowledge that a candle was overturned in the study, resulting in the combustion of the structure, Providence Indemnity Corp. must deny coverage based on the metaphysical terms outlined in Section 1 of your policy.

  Your submission argues that the candle caused the fire. This contradicts the established ontology of our jurisdiction. As you are aware, there is no necessary connection between what is termed a cause and what is termed an effect. The candle did not burn the house. Rather, at the occasion of the candle contacting the curtains, God created the burning directly. The regularity you expect between flammable material and ignition is merely God's custom, not a binding law of nature. Since God is free to break His custom at any moment—which is all a miracle amounts to—the burning was a direct act of Divine Will, not a mechanical consequence of negligence.

  Consequently, the loss falls under the standard "Act of God" exclusion. In most contexts, this clause refers to exceptional events like floods or earthquakes. However, given that God is the only agent there ever was, every event is technically an act of God. To claim otherwise would be to assign independent power to created things, which violates the principle that God owes nothing to any creature. He is under no obligation to sustain the existence of your house, nor to prevent its dissolution when the occasion arises. Since the Company derives its liability limits from this higher lack of obligation, we cannot be held liable for what God has chosen not to prevent.

  You have contended that your own carelessness should void the exclusion. We must distinguish between causation and acquisition. You did not cause the fire; you lack the power to create effects. However, you did "acquire" the act of overturning the candle. The movement of your hand was created by God, but you appropriated it as your own through your will. Therefore, you are fully responsible for the occasioning of the event, even though you lacked the causal efficacy to produce the burn. The liability rests on your acquisition of the negligence, not on any power to ignite.

  Regarding your request for a premium refund: premiums are due because the contract itself is a habit sustained by God. You owe the payment because God creates the obligation in you at the moment of billing, regardless of whether the payout obligation is created in us. The continuity of our business relationship relies on this customary regularity, not on a necessary exchange of value. To suggest a refund is due implies a necessity in our contractual bond that simply does not exist.

  We understand this position may seem rigorous. However, consistent application of these principles is required to maintain actuarial stability in a world without necessary connections. We encourage you to review your policy wording regarding Divine Custom and Acquisition before submitting further claims.

  Sincerely,

  J. V. Thiele
  Senior Claims Adjuster
  Providence Indemnity Corp.
