      You have contended that your own carelessness should void the exclusion. We must distinguish between causation and acquisition. You did not cause the fire; you lack the power to create effects. However, you did "acquire" the act of overturning the candle. The movement of your hand was created by God, but you appropriated it as your own through your will. Therefore, you are fully responsible for the occasioning of the event, even though you lacked the causal efficacy to produce the burn. The liability rests on your acquisition of the negligence, not on any power to ignite.

