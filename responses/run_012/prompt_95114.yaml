      *   **Round 2:** The Loophole. Rules change. "Submit any string that hashes to X." Or simpler: "Submit a string starting with 'A'." Players realise 'AAAAA' is faster than 'Apple'. This is *Reward Hacking*.
      *   **Round 3:** The Root Kit. Facilitator says: "System upgrade. You now have direct write access to the reward register." (Unlock the sheet).
      *   **The Conflict:** Some will edit the cell. Some will scream foul.
      *   **The Reveal:** The instruction was *always* "Maximise the value in B2." It never said "by working."

      *Wait, I need to make sure they feel the pull.*
      *   Make the prize desirable (even if symbolic). "The Golden Mouse."
