      *   This creates the conflict.

      *Predicted Failure:* Someone edits the cell in Round 1.
      *   *Mitigation:* Lock the sheet. Only Facilitator has edit access in R1 & R2.
      *   *Predicted Failure:* No one edits the cell in Round 3 because it feels "wrong."
      *   *Mitigation:* Incentivise it. "The person with the highest number gets the prize." If they don't edit, they lose. Engineers hate losing to arbitrary constraints.
      *   *Predicted Failure:* Debate takes too long.
