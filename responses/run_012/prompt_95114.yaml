      *   30-45: Round 2 (Reward Hacking).
      *   45-60: Round 3 (Wireheading).
      *   60-75: Debrief.

      *The "Bite":* In Round 3, give *everyone* edit access to the sheet. Watch what happens. Then ask: "Did the person who edited the cell win, or did they break the game?"

      *Wait, one crucial detail:* "Nothing outside the model says what the score is supposed to mean."
      *   To simulate this, the rules must *only* define the score, not the meaning.
