      *British English Check:* "Optimise," "Programme," "Cheque," "Mate," "Bloody," "Quid" (No money though). Keep it professional but colloquial. "Sod's law," "Graft," "Fiddle."

      *Refining the Debrief:*
      *   Need to map:
          *   Round 2 = Reward Hacking (Specification Gaming).
          *   Round 3 = Wireheading (Tampering with the sensor/reward channel).
      *   The "Honest Note": Humans have intrinsic rewards (shame, pride, social norms). AI doesn't. That's the gap.

  4.  **Drafting the Plan:**

      *   **Title:** The Oracle Protocol.
      *   **Setup:** A Google Sheet projected.
