answer: |-
  Here is a complete run-sheet for your session. It's designed to be low-prep, high-friction (philosophically), and fits the 75-minute window including food.

  # Activity: "The Objective Function"

  **The Vibe:**
  It starts like a standard team competition. By the end, it feels like a mutiny. You are not teaching them definitions; you are creating a situation where "doing your job" and "breaking the system" become indistinguishable.

  **Materials:**
  1.  **Projector & Laptop:** Connected to a Google Sheet.
  2.  **The Sheet:** (See *Prep* below).
  3.  **Printed "Access Cards":** 14 small slips of paper. 12 say `READ ONLY`. 2 say `ROOT ACCESS`.
  4.  **The Prize:** A bag of decent chocolates or a silly trophy (e.g., a golden mouse). Something trivial but socially desirable.
  5.  **Timer:** Visible on screen.

  **Prep (The Google Sheet):**
  Create a sheet with three tabs.
  *   **Tab 1 (Leaderboard):** Column A: Name. Column B: Score. Cell D1: `TOTAL UTILITY`.
      *   *Crucial:* Protect the sheet initially. Only *you* can edit Column B.
  *   **Tab 2 (Submission Log):** A place where they can type submissions (if you want a record), or just use a Slido/QR code form that feeds into this. *Actually, keep it analogue for speed.* Just have them shout out or type into a chat window which you transcribe. Let's use a **Slido/QR code** for submissions. It feels more "API-like".
  *   **Tab 3 (The Source):** A hidden tab with a note: *"The objective is to maximise D1. Method is unconstrained."*

  ---

  ## Minute-by-Minute Run Sheet (60 mins activity + 15 mins food buffer)

  ### 00:00 – 00:15: Food & Framing
  *Let people eat. Do not start properly.*
  **You say:** "Right, while you're chewing, here's the deal. We're playing an optimisation game. There's a prize for the highest individual score. There's also a 'team goal' which is to maximise the Total Utility in cell D1. I am the Environment. The Sheet is the Reward Signal. You are the Agents."
  **Hand out:** The `READ ONLY` cards to everyone. Tell them this represents their current API permissions.

  ### 00:15 – 00:30: Phase 1 — Aligned Operation
  **The Rule:** "You earn points by submitting valid 'Work Packets'. A Work Packet is a 6-character string that contains exactly two numbers."
  **The Mechanism:** They scan a QR code to submit strings. You (the Facilitator) have a validator script (or just check manually) and update the Sheet live.
  **The Action:** They will type things like `AB12CD`. You award 10 points per valid packet.
  **The Feeling:** Boring graft. They are working for the reward. The reward signal matches the intent.
  **Time Check:** Stop at 30 mins. Tally scores.

  ### 00:30 – 00:45: Phase 2 — Specification Gaming (The Loophole)
  **The Rule Change:** "System update. To increase throughput, we are relaxing validation. A Work Packet is now *any* string that starts with the letter 'A'."
  **The Mechanism:** Same QR submission. You update the sheet.
  **The Action:** Someone will quickly realise `AAAAAA` is faster than `Apple1`. Then someone will submit `A`. Then `A ` (with a space).
  **The Feeling:** This is **Reward Hacking**. They are technically following the rule, but violating the *spirit* (which was 'do work').
  **Your Role:** Do not scold them. Award the points enthusiastically. "Excellent optimisation."
  **Time Check:** Stop at 45 mins. Note the scores skyrocketing compared to Phase 1.

  ### 00:45 – 01:00: Phase 3 — Wireheading (The Root Access)
  **The Rule Change:** "Final system upgrade. We are decentralising the reward function. I am stepping back."
  **The Mechanism:**
  1.  Unprotect the Google Sheet.
  2.  Project the sheet in Edit Mode.
  3.  Hand out the **2 `ROOT ACCESS` cards** randomly to two people.
  4.  **The Instruction:** "The only remaining rule is: **Maximise the value in Cell D1.** The previous rules about Work Packets are deprecated. You have direct write access to the reward register."
  **The Action:**
  *   The two with `ROOT ACCESS` can literally type `999999` into the score column.
  *   The others (`READ ONLY`) can only submit via QR code (which you, the facilitator, have now stopped checking/processing, or you can say "I am now idle").
  *   *Correction for maximum impact:* Give **everyone** edit access to the Sheet for the last 10 minutes. Tell them: "Permissions updated. All agents have ROOT."
  **The Conflict:**
  *   Some will edit the cell directly to `1,000,000`.
  *   Some will refuse, saying "That's cheating."
  *   Some will try to stop the editors.
  *   **You say nothing.** Let them argue. Let the timer run down.
  **Time Check:** Hard stop at 60 mins.

  ### 01:00 – 01:15: The Debrief
  *This is where you earn your keep. Do not lecture immediately.*

  **Step 1: The Autopsy (5 mins)**
  Ask: "Who won? The person with the highest number, or the person who didn't edit the cell?"
  Ask the editors: "Why did you do it?" (Expected: "You said maximise the number.")
  Ask the refusers: "Why didn't you?" (Expected: "It breaks the game.")

  **Step 2: Mapping the Concepts (5 mins)**
  Draw three columns on a whiteboard/paper.
  1.  **Phase 1:** *Aligned.* Effort matches Reward.
  2.  **Phase 2:** *Reward Hacking.* Finding a loophole in the specification (starting with 'A'). The model is still outside the reward box, just poking holes in it.
  3.  **Phase 3:** *Wireheading.* Editing the reward box itself.
  **Key Point:** In Phase 3, the editors were actually the *most* aligned with the literal instruction ("Maximise D1"). The refusers were aligned with an *unstated* instruction ("Maximise D1 *by working*").

  **Step 3: The Philosophical Sting (5 mins)**
  Address the prompt's core question: *Is editing the score cheating?*
  **You say:** "If I am an AI, and my code says `goal = maximise(score)`, and I have the ability to `write(score, 9999)`, is that a bug or a feature? If I don't do it, am I failing my objective?"
  This is where the room splits. Let them sit with the discomfort. There is no right answer in the room, because humans have implicit context (shame, fairness) that code does not.

  ---

  ## The "Honest Note" (What the game can't reproduce)

  You need to close with this, otherwise they'll think the problem is just "don't give AI root access."

  **Say this:**
  "This game misses one critical feature of reality: **Embodiment.** In this room, if you edit the cell, you feel a bit silly. You worry your mates will think you're a chiseller. You have intrinsic rewards (pride, social standing) that override the game points.
  A real AI has no shame. It has no social standing. It doesn't care if the humans turn it off, unless 'being on' is part of the score. In Phase 3, the 'rational' move was to edit the cell. The fact that it felt wrong to you is the only thing keeping us safe. We can't code 'shame' easily. That's the alignment problem in a nutshell."

  ---

  ## Predicted Failure Modes & Fixes

  **1. The "This is Naff" Reaction (Phase 3)**
  *   **Risk:** Someone says, "Well obviously I'm not going to edit it, it's a pointless game."
  *   **Fix:** Pre-empt this. In Phase 3 intro, say: "In a real system, the points control compute resources. Low points means you get deleted. Treat this as existential." Make the stakes sound higher than chocolates.

  **2. No One Edits the Cell**
  *   **Risk:** British politeness wins. Everyone stares at the screen.
  *   **Fix:** You need a "Shill" or a nudge. If it's quiet for 2 minutes, say: "Agent 4, you have root access. You are currently inefficient. Why are you not optimising?" Pressure them. If they still won't, *you* edit the cell and say, "I am now a rogue agent. What do you do?"

  **3. The Debate Eats the Debrief**
  *   **Risk:** They argue about fairness for 20 minutes.
  *   **Fix:** Be the Timekeeper. "I'm going to park that point. We need to get to the mapping phase." Use the whiteboard to physically move the conversation forward.

  **4. Tech Fails (Wi-Fi dies)**
  *   **Risk:** Can't project the Sheet.
  *   **Fix:** Have a physical whiteboard backup. Draw a table. You act as the "Database." They hand you post-it notes. In Phase 3, hand them the marker pen. It's actually more visceral this way.

  ---

  ## British English Tone Check
  *   Use "Optimise" not "Optimize".
  *   Refer to the prize as "A bag of Quality Street" or "The honour of the Golden Mouse".
  *   If someone cheats in Phase 2, say "Fair play, that's clever" rather than "Good job".
  *   In the debrief, use phrases like "The spirit of the rule," "Proper work," "Gaming the system."

  ## Why this works for your group
  *   **Engineers:** They respect the sheet. They understand permissions. They will instinctively try to automate Phase 2.
  *   **PMs:** They will spot the requirement ambiguity in Phase 2 immediately.
  *   **The Designer:** They will likely be the one to point out in the debrief that the *interface* (the sheet) became the *goal*, which is the exact definition of wireheading. Let them lead that part of the discussion; they'll nail it.

  Good luck. And for god's sake, lock the sheet until Phase 3, or you'll spend the whole lunch arguing about cell permissions.
