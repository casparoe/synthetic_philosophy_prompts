prompt: |-
  So I run this fortnightly lunchtime thing at work, "AI curiosity club" — about 14 people, mix of backend engineers, a couple of PMs, one designer who's quietly the smartest person in the room — 75 minutes including eating. Next month it's my turn to lead and I've been told to do something on wireheading and reward tampering. I get the gist: an AI that games the thing you're measuring instead of doing the thing you actually wanted, and the even weirder case where it goes and edits the measuring itself. But I've got no philosophy background at all (CS degree, that's the lot) and I don't want to just stand up and read out the standard spiel, because half of them will have seen it already and the other half will switch off. What I want is a game they actually play, so they feel the pull of it rather than being told about it. Definately no real money involved.

  Here's the bit I'd love you to build the thing around, and it's the part I actually find interesting. Someone in the group said there's a difference between cheating the scorekeeper and becoming the scorekeeper — like, a model that finds a loophole in your reward rule (that's reward hacking, fine, whatever), versus a model that reaches in and rewrites the rule, or the log file, or the bit of code that decides whether it succeeded. Then someone else said the second one isn't even cheating, because nothing outside the model says what the score is supposed to mean: if "get the number as high as possible" is the whole job, then editing the number is doing the job. I genuinely don't know who's right, and I don't want the group to just hear that distinction described — I want them to end up on both sides of it by accident, so it bites.

  Concretely, design the activity: rules, materials (keep it to stuff I can print or run off a laptop and a projector), a points scheme that isn't real money, and a rough minute-by-minute timeline for the 75 minutes. I want the group to walk into the loophole themselves before anyone says the word "hacking" out loud, and then ideally there's a later stage where the scoring mechanism becomes something they can actually touch — so the room has to decide for itself whether that's the same kind of move as the loophole or a different one, and whether the "nothing outside says what the score means" line holds up. Then a debrief that maps what actually happened onto the concepts, and an honest note on what a lunchtime game like this can't reproduce about the real thing — I assume there's some feature I'll just have to say out loud myself, so tell me which and give me a decent way of saying it. Also tell me what will predictably go wrong the first time I run it and how I should handle it when it does. British English please.
