answer: |-
  We begin by affirming our shared understanding that the conventional economic discount rate is a composite measure that conflates distinct ethical and empirical factors, specifically the probability of existence, the expected growth in consumption leading to diminishing marginal utility, and the pure rate of time preference. We agree that to isolate the moral question, we must consider cases where the beneficiaries are known to exist, where their absolute level of wealth is held constant to negate diminishing marginal value, and where the uncertainty of delivery is zero. Our shared test cases involve intertemporal choices affecting either a single individual at different stages of life or distinct individuals in different generations, provided that the only variable differing between the options is the calendar date at which the well-being is experienced. We jointly reject the notion that psychological impatience constitutes a moral justification for discounting, and we agree that the Ramsey rule, while mathematically sound for descriptive economics, obscures the normative question by bundling the elasticity of marginal utility with the pure time preference parameter. Consequently, we agree that the ordinary dispute is often confused because participants argue past one another, with one side attacking discounting for risk or growth while the other defends discounting based on the structural features of agency, and we commit to addressing only the pure time preference component where all other variables are controlled.

  Despite this shared framework, we maintain a residual disagreement regarding the defensibility of a positive pure time preference. The temporal neutralist contends that the date of an experience is morally arbitrary, akin to spatial location, and thus discounting based on time constitutes an unjustified discrimination against future selves or persons. The proponent of pure time preference contends that a positive rate is defensible not as a denial of equal moral status, but as a rational feature of agency, reflecting the structural difference between the present and the future in terms of causal power and psychological connection. We agree to phrase this disagreement such that it captures the divergence without begging the question: the neutralist asserts that temporal position lacks intrinsic moral significance, whereas the proponent asserts that temporal position possesses derivative moral significance grounded in the rationality of unequal caring. Furthermore, we acknowledge an unresolved ambiguity regarding whether our dispute concerns the objective value of outcomes, such that a future pleasure is inherently less valuable, or the subjective weight of a person's interests, such that a person is rationally permitted to weight their future interests less heavily even if the objective good remains constant.

  The first crux of our debate concerns the burden of proof and the analogue with spatial distance. We agree that the case of spatial distribution bears directly on this issue, as it tests whether location as such is a valid ground for differential treatment. The temporal neutralist predicts that if we accept spatial neutrality as a premise of justice, consistency demands temporal neutrality, and they would accept evidence against their view if it could be shown that time possesses intrinsic normative properties that space lacks, such as an irreversible flow that fundamentally alters the nature of identity or claim. The proponent of pure time preference predicts that the spatial analogy fails because agents stand in a unique causal relation to the future that they do not stand in to distant spaces, and they would accept evidence against their view if it were demonstrated that rational agency requires equal concern for all times in the same way it requires equal concern for all persons within a single time slice. Both sides agree that the strength of the spatial analogy is the primary lever for shifting the burden of proof, with the neutralist placing the burden on the discriminator to justify the difference and the proponent placing the burden on the neutralist to justify why time should be treated like space.

  The second crux concerns the distinction between prudence and justice, specifically whether the real disagreement concerns the moral status of temporal position or the rationality of caring unequally. We agree that the case of intra-personal choice over time, where a person chooses between a smaller present benefit and a larger future benefit for themselves, bears on this issue. The temporal neutralist predicts that if unequal caring is deemed irrational in the intra-personal case, it must also be immoral in the inter-personal case, and they would accept evidence against their view if it could be shown that rational prudence permits discounting one's own future without violating coherence. The proponent of pure time preference predicts that the intra-personal case allows for discounting as a matter of rational preference structure without implying moral inequality, and they would accept evidence against their view if it were shown that permitting such discounting leads to paradoxes of diachronic inconsistency that undermine the possibility of planning. Finally, we note that part of our dispute may be merely verbal, specifically regarding the definition of well-being. If well-being is defined to include the satisfaction of time-relative desires, then discounting is built into the metric of value itself rather than applied to it. We agree that if we adopt a metric of objective list well-being that is time-invariant, this verbal disagreement dissolves, leaving only the substantive normative conflict regarding the weighting of those invariant goods across time.
