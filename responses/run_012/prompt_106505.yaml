answer: |-
  The intuition behind the mirror model is seductive because it feels safe. If our allotted chamber looks like America—same proportions of age, race, class, and education—it seems obvious that it will decide things the way America would. But this assumes that demographics are a perfect proxy for viewpoint, and that the status quo distribution of opinions is actually what we want preserved. It isn't. Demographic mirroring freezes the existing correlations between background and belief. It assumes that a 45-year-old manufacturing worker from the Rust Belt thinks a specific way, and that a 22-year-old college student from the coast thinks another. By sampling strictly for demographics, you aren't getting a random sample of minds; you're getting a random sample of sociological categories that already come pre-loaded with the same ideological polarization we see in our elected bodies. The mirror doesn't correct for systemic blind spots; it replicates them. If the general population is misinformed on a complex issue due to media consolidation or structural ignorance, a mirror chamber will be equally misinformed. A lottocratic body shouldn't aim to be a photograph of the electorate; it should aim to be a functional engine for deliberation. To do that, we need to prioritize cognitive diversity and opinion stratification over demographic isomorphism.

  The goal of sortition isn't just to replicate the public's will, but to refine its judgment. To achieve this, the sampling procedure needs to stratify for worldview and cognitive style, not just zip code and income. This means we can't just draw names from voter rolls. We need a two-stage process. First, a massive, blind invitation pool where respondents answer a psychometric and values-based survey, not a policy survey. Asking "Do you support Policy X?" is gameable; asking about risk tolerance, community obligation, or time preference is harder to fake and more indicative of how someone reasons. Second, we stratify the final selection based on those cognitive markers. We deliberately over-sample outlier views. If 60% of the population holds a centrist view on a key axis, the chamber shouldn't have 60% centrists. It should have a cap—say, 40%—to prevent the majority from dominating deliberation before it starts. We fill the rest with the tails of the distribution: the libertarians, the socialists, the skeptics, the radicals. This ensures that every argument faced by the chamber is forced to defend itself against a genuine counter-argument, rather than drowning in consensus.

  The obvious counter-argument here is about manipulation. If we are selecting based on opinion, who writes the survey? Isn't this just handing the keys to the pollsters? To prevent this, the instrument design needs to be open-source and locked before the sample is drawn, administered by a non-partisan agency with rotating oversight. More importantly, we treat the opinion data as noisy. We don't select for specific policy positions, which shift, but for stable cognitive traits—openness to experience, need for cognition, tolerance for ambiguity. These are harder to game because they require consistency across hundreds of questions. We also audit the selected body. If the final chamber looks suspiciously homogenous in its reasoning styles despite the stratification, we trigger a reset. It's not perfect, but it's less gameable than gerrymandering districts or buying ad time, which is how we currently manipulate representation.

  This brings us to the legitimacy question. If the chamber isn't a mirror, can it honestly call itself democratic? Yes, because democratic legitimacy comes from equality of opportunity and accountability, not statistical mirroring. Every citizen still has an equal probability of being invited into the pool. The engineering happens *after* the random draw, within the selection phase, to ensure the body functions. Think of it like a jury. We don't want a jury that mirrors the community's prejudice; we want a jury that is impartial and capable of weighing evidence. We strike jurors for bias. A lottocratic legislature is essentially a permanent grand jury for public policy. Its legitimacy derives from the fact that it is drawn from the people, serves for a limited time, and is structurally insulated from the money and careerism that corrupt elections. It represents the public's *interest* in good governance, even if it doesn't mirror the public's *impulses* at a specific moment.

  Now, I know the objection waiting in the wings. A friend in the group reckons this whole line just collapses into "pick the cleverest cranks and hope." The worry is that by over-sampling outliers and capping the majority, you aren't getting wisdom; you're getting a chamber of contrarians who reject common sense just to be distinct. If you prioritize diversity of opinion, you might elevate dangerous fringe ideas to parity with settled consensus. There is real weight to this. If you stratify for "dissent," you risk selecting for people who simply enjoy saying "no." However, this objection conflates diversity of *position* with diversity of *reasoning*. We aren't looking for people who hold weird views; we are looking for people who process information differently. A crank ignores evidence; a cognitive outlier might weigh evidence differently. The safeguard here is the deliberative process itself. In a mirror chamber, the majority can ignore the minority. In a capped chamber, the majority is forced to negotiate with the minority to reach a threshold. The cranks get airtime, yes, but they don't get veto power. The friction of having to convince people with fundamentally different cognitive styles filters out the nonsense faster than a room full of agreeable mirrors. We aren't hoping the cranks are right; we're hoping the conflict between them and the center produces a more robust solution than the center would have found alone.

  Ultimately, sticking to the mirror model is a concession to laziness. It assumes democracy is just an accounting exercise—counting heads—rather than a cognitive one. If we want sortition to actually improve decision-making, we have to be willing to engineer the body for friction. We need a chamber that looks less like a census report and more like a well-functioning ecosystem, where the majority is checked not just by rules, but by the very composition of the room. It's still democratic because it's ours, but it's designed to be better than us.
