  Section 1 — Introduction script

  Welcome to the podcast. Today we discuss a new tracking account of knowledge. Like Nozick, our guest holds that knowledge requires sensitivity: if p were false, you wouldn't believe it. But she adds two amendments. First, tracking is relativized to methods individuated by causal salience. Second, knowledge requires evidence free from undercutting defeat. She argues this preserves ordinary knowledge while blocking skepticism, avoiding standard counterexamples. Let's dig into the machinery.

  Section 2 — Method individuation, and sensitivity versus safety

  1. First, how does your causal-salience clause avoid narrow-method trivialisation, where sensitivity comes cheap because the method is described so finely that no false belief would have been formed by it?
  Anticipated reply: She will likely argue that salience fixes the method at a natural level, preventing gerrymandering. This ensures the method is not too narrow for the theory.
  Follow-up: But if salience is itself context-sensitive, doesn't sensitivity become context-sensitive too?

  2. Second, does the salience clause do any independent explanatory work that a plain reliabilist condition would not, or is it merely a constraint on method individuation?
  Anticipated reply: She'll argue reliabilism lacks the specific counterfactual grip needed to handle skepticism successfully. Reliabilism is simply too coarse.
  Follow-up: Yet if reliability tracks truth across nearby worlds, isn't the counterfactual condition effectively redundant?

  3. Third, why do you want sensitivity at all rather than the safety condition your rivals prefer, given the specific cases where the two verdicts come apart?
  Anticipated reply: She'll claim safety yields false positives in skeptical scenarios where we intuitively lack knowledge. Safety is simply too permissive.
  Follow-up: But doesn't sensitivity yield false negatives in standard perceptual cases where we intuitively have knowledge?

  Section 3 — Closure and the abominable conjunction

  1. In your book, state the denial in its sharpest form: that you know you have hands while not knowing that you are not a handless brain in a vat.
  Anticipated reply: She will affirm this conjunction is true and consistent with our epistemic practices. She denies closure to save knowledge.
  Follow-up: But doesn't this imply knowledge is not closed under known entailment? This seems costly.

  2. In the classroom, what do you tell a student who finds the denial worse than the skepticism it was meant to answer?
  Anticipated reply: She'll say skepticism is the greater cost and closure is less intuitive than we think. Students must adjust intuitions.
  Follow-up: Yet isn't closure central to deductive reasoning and knowledge transmission? This undermines logic.

  3. Ultimately, is denying closure a consequence you chose or a price you pay?
  Anticipated reply: She'll claim it is a chosen feature that preserves ordinary knowledge claims. It is a feature, not a bug.
  Follow-up: But if it's chosen, doesn't that make the theory ad hoc? This weakens motivation.

  Section 4 — Necessary truths and vacuous tracking

  1. For a necessary truth the antecedent of the sensitivity conditional is unsatisfiable, so the condition appears to be met vacuously. How do the amendments handle that?
  Anticipated reply: She will argue that methods for necessary truths differ from empirical ones. She may invoke a separate condition.
  Follow-up: But doesn't vacuous satisfaction make knowledge too easy to get?

  2. Is vacuous satisfaction of a tracking condition a respectable result or a sign that the condition has the wrong shape for the a priori?
  Anticipated reply: She'll claim it is respectable because necessary truths cannot be false.
  Follow-up: Yet doesn't this collapse the distinction between knowledge and true belief?

  Section 5 — Lotteries and the necessity of sensitivity

  1. How does the account treat lottery propositions: the belief that one's ticket will lose arguably satisfies the tracking conditions, yet we are widely held not to know that our ticket will lose — so does she accept the result, and if not, which condition is meant to fail?
  Anticipated reply: She will argue the method fails because the lottery mechanism is random.
  Follow-up: But doesn't the counterfactual hold regardless of the mechanism?

  2. Consider a grandmother who believes her grandchild is well, is right, but would have believed it just the same had the child fallen ill. Do your amendments save sensitivity's necessity or force a retreat to a sufficiency claim?
  Anticipated reply: She'll argue the method changes in the counterfactual scenario.
  Follow-up: But isn't that manipulating the method to save the theory?

  Section 6 — The defeat clause

  1. Ask whether the no-undercutting-defeat clause does independent explanatory work or only patches the cases the tracking conditions get wrong, and whether adding it collapses her view into a general defeasibility theory in which the tracking apparatus is idle.
  Anticipated reply: She will argue it handles evidence specifically while tracking handles truth-connection.
  Follow-up: But if tracking is idle, why keep it?

  Section 7 — Closing

  1. Finally, ask what would count as decisive evidence against the tracking core — an observation or an argument — and which of the three components she would give up first if one had to go. We want to know where the theory is most vulnerable to future refutation. Please be specific about the trade-offs.
