      *   *Trilogues:* Presupposes legitimacy comes from *effectiveness* and *institutional balance* (Commission + Council + EP). It's the "engine."
      *   *Conflict:* They pull in opposite directions. One says "slow down, check the boundary," the other says "speed up, get the deal."
