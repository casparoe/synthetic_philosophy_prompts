      *   *Legitimacy:* It's not purely input-oriented (consent/voting). It's heavily *output-oriented* (results/problem-solving). "We protect you from overreach (Yellow Card) so we can get things done efficiently (Trilogues)."
      *   *The People:* It presupposes *many peoples* (national demoi) but treats them as stakeholders in a joint venture rather than the sole authors of law. The "European People" is a regulatory construct, not a pre-political reality.
      *   *Key Concept:* *Executive Federalism* or *Technocratic Constitutionalism*. The system assumes that if the process is legally correct and the outcome is beneficial, the opacity is an acceptable trade-off.

  4.  **Distinguishing Requirement vs. Compatibility (Question 2):**
