      *   Make sure to address the "Yellow Card" specific mechanic (review vs. withdraw).

  10. **Self-Correction during drafting:** I initially thought about calling it a "Democratic Deficit." The prompt says *don't* gesture at the usual line about democratic deficit. I need to go deeper. The deficit is a symptom, not the theory. The theory is that *process legitimacy* (following the rules) substitutes for *political legitimacy* (public will). I need to emphasize that.

      *Wait, one more thing:* The prompt asks about "American English." I need to ensure spelling (color/colour, center/centre) and idiom fit.

      *Final check on Question 3:* Do they presuppose the same things? No. One presupposes the Nation State is the unit of legitimacy. The other presupposes the EU Institution is the unit of efficiency. This tension is the core.

      *Final check on Question 5:* If I swap to a "Civic Republican" view, what changes? Public deliberation. Trilogues die. Yellow Card becomes a referendum mechanism.

