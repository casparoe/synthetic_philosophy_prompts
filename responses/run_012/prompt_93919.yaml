prompt: |-
  I recently came across a short encyclopaedia entry on the Hart–Devlin debate and want to know how much of it to trust before I rely on it. Its account of the two positions runs roughly as follows:

  "Devlin and Hart disagreed about whether the criminal law may enforce morality. Devlin held that immoral conduct is intrinsically wrong and that society has a right to uphold virtue, so the law may criminalise conduct on the ground of its immorality alone; he added only that the convictions of the reasonable person should be the standard, so that the law need not defer to the merely eccentric or the oversensitive. Hart answered with Mill's harm principle: conduct may be restricted only where it harms others, and therefore the law may never regulate conduct merely because it is immoral. Since there is no evidence that a shared morality is required for a society's survival, and since Hart's principle is the one that liberal legal systems have largely adopted, Hart's position has prevailed."

  Three things about this strike me as possibly off, but I cannot tell whether the fault lies in the entry or in my own expectations, and I would rather not simply assume that Hart won because Mill was right.

  First, is the entry's Devlin a fair reconstruction? My impression is that his case was not that immorality as such is wrong and therefore punishable, but something more sociological, about a shared morality being part of the fabric of a society and therefore something the society may protect; and that the reasonable person was less a liberal safeguard than the figure whose sentiments fix the content of the morality that is to be enforced. If that is right, then the entry has quietly substituted one kind of legal moralist for another, and I would like to know exactly what has been swapped in and what it changes.

  Second, does the entry overstate Hart? "The law may never regulate conduct merely because it is immoral" is a much stronger conclusion than I remember being attributed to him, and it makes his objection to Devlin turn wholly on an inherited principle rather than on an argument he supplied. I want to know what his actual case against Devlin was, and whether he had a distinction available to him that the entry simply omits — something about the difference between the morality a society happens to accept and a morality that could be defended.

  Third, does the closing inference survive? Even if every sentence about the two positions were accurate, "liberal legal systems have largely adopted Hart's principle, therefore Hart's position has prevailed" appears to change the subject from which view is correct to which view is popular. I also doubt the description itself, since I have the impression that contemporary criminal law still prohibits some conduct on grounds that look moralistic rather than harm-based.

  Finally, a friend claims that Devlin's argument is structurally the same as a much more recent one — that certain kinds of speech or information should be restricted not because they harm any particular person, but because they corrode the shared norms a democracy needs in order to function. He says this shows Devlin was making an argument we still take seriously, merely in different dress. Is that comparison fair, or does it inherit the same ambiguity as the encyclopaedia entry?

  Please go through the entry sentence by sentence and tell me, for each claim, whether someone who works on this debate would accept it, wince at it, or call it a distortion; indicate which of the distortions a defender of Devlin would resist and which a defender of Hart would resist; and say whether any conclusion the entry draws can be salvaged once the misdescriptions are corrected. Where the entry flattens a distinction that matters — I suspect there is more than one kind of legal moralism in play, and possibly more than one ground for criminalisation besides harm — set the distinctions out and tell me what turns on them.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Task:** Evaluate a specific encyclopaedia entry summary of the Hart–Devlin debate.
      *   **Specific Questions:**
          1.  Is the account of Devlin fair? (Sociological vs. Intrinsic Wrongness).
          2.  Does it overstate Hart? (Absolute prohibition vs. nuanced critique).
          3.  Is the closing inference valid? (Popularity vs. Truth, Accuracy of claim about liberal systems).
          4.  Is the friend's comparison fair? (Devlin vs. Modern Democratic Norm arguments).
      *   **Requirements:** Go sentence by sentence, evaluate acceptability (accept/wince/distortion), identify who would resist which distortion (Devlinian/Hartian), salvage conclusions, and clarify flattened distinctions (types of legal moralism, grounds for criminalization).
      *   **Tone:** Scholarly, precise, nuanced, avoiding oversimplification.

  2.  **Deconstruct the Encyclopaedia Entry (Sentence by Sentence Analysis):**

      *   *Sentence 1:* "Devlin and Hart disagreed about whether the criminal law may enforce morality."
          *   *Verdict:* Generally acceptable, but slightly imprecise. It's about *enforcing morality for its own sake* vs. *enforcing morality only when linked to harm*.
          *   *Nuance:* Both agreed law enforces *some* morality (e.g., murder is immoral and illegal). The dispute is about *private* morality.

      *   *Sentence 2:* "Devlin held that immoral conduct is intrinsically wrong and that society has a right to uphold virtue, so the law may criminalise conduct on the ground of its immorality alone..."
          *   *Verdict:* **Distortion.** This is the user's first suspicion. Devlin wasn't a natural law theorist arguing intrinsic wrongness in a metaphysical sense. He argued from *social cohesion*. Society has a right to self-preservation.
          *   *Who resists:* Devlin defenders (it misrepresents his sociological/functionalist argument). Hart defenders might not care much, but accuracy matters.
          *   *Distinction:* Legal Moralism (intrinsic wrongness) vs. Disintegration Thesis (societal survival).

      *   *Sentence 2 (continued):* "...he added only that the convictions of the reasonable person should be the standard, so that the law need not defer to the merely eccentric or the oversensitive."
          *   *Verdict:* **Wince/Partial Distortion.** The "reasonable person" (or "right-minded man") is indeed the standard, but the entry frames it as a *safeguard* ("so that the law need not defer..."). For Devlin, the reasonable person *constitutes* the morality. It's not a check on power; it's the *source* of the power.
          *   *Who resists:* Devlin defenders (it makes it sound like a liberal constraint rather than a majoritarian mandate).

      *   *Sentence 3:* "Hart answered with Mill's harm principle: conduct may be restricted only where it harms others, and therefore the law may never regulate conduct merely because it is immoral."
          *   *Verdict:* **Wince/Overstatement.** Hart *used* Mill, but he wasn't a dogmatic Millian. He allowed for paternalism in some contexts (though skeptical) and focused heavily on the *distinction between positive and critical morality*. He argued against enforcing *positive* morality without critical justification. "Never" is too strong.
          *   *Who resists:* Hart defenders (it ignores his nuanced positivism and distinction between critical/positive morality).

      *   *Sentence 4:* "Since there is no evidence that a shared morality is required for a society's survival, and since Hart's principle is the one that liberal legal systems have largely adopted, Hart's position has prevailed."
          *   *Verdict:* **Distortion (on both counts).**
              1.  *Empirical Claim:* Devlin argued it's a conceptual truth or historical observation, not easily disproven by "evidence" in a scientific sense. Hart argued the "disintegration thesis" was unproven.
              2.  *Prevailing:* "Prevailed" implies truth or finality. Legal systems *do* still enforce morality (obscenity, drugs, euthanasia, etc.). It's a mix.
          *   *Who resists:* Devlin defenders (on the empirical claim), Hart defenders (on the "prevailed" claim being too neat), and anyone caring about the is/ought fallacy.

  3.  **Address the User's Specific Questions:**

      *   *Question 1 (Devlin's Reconstruction):* Confirm the user's suspicion. Devlin is a functionalist, not a natural lawyer. The "Disintegration Thesis" is key. The "reasonable man" is the *measure* of morality, not a *limit* on it.
      *   *Question 2 (Hart's Position):* Confirm the user's suspicion. Hart distinguishes between *Positive Morality* (what people believe) and *Critical Morality* (what is rationally defensible). He opposes enforcing the former without the latter. He isn't strictly Millian (allows some paternalism, focuses on liberty principle).
      *   *Question 3 (Closing Inference):* The "is/ought" problem. Popularity $\neq$ Correctness. Also, empirically dubious (laws against drugs, prostitution, etc., often have moralistic underpinnings).
      *   *Question 4 (Friend's Comparison):* This is about "Democratic Defeatism" or "Civic Republicanism." There is a structural similarity (protecting the *conditions* of society), but the *content* differs (sexual morality vs. democratic norms). It's a fair *structural* comparison but risks the same empirical vagueness as Devlin.

  4.  **Drafting the Response (Iterative Refinement):**

      *   *Structure:*
          1.  Introduction (Validate the user's skepticism).
          2.  Sentence-by-Sentence Autopsy (The core request).
          3.  Addressing the Three Specific Doubts (Devlin, Hart, Conclusion).
          4.  Addressing the Friend's Comparison.
          5.  Clarifying Distinctions (Legal Moralism types, Harm vs. Offense, etc.).
          6.  Salvaging the Entry (What can be kept?).

      *   *Key Concepts to Integrate:*
          *   Disintegration Thesis.
          *   Positive vs. Critical Morality (Hart).
          *   Legal Moralism (Intrinsic vs. Social).
          *   The "Reasonable Man" (Devlin's majoritarianism).
          *   The Wolfenden Report context.
          *   Feinberg's Offense Principle (relevant for nuance).

      *   *Refining the Devlin Point:* Make sure to emphasize that Devlin *did* believe immorality was dangerous, but the *reason* for criminalization was social survival, not divine command. The entry makes him sound like a natural lawyer; he was more of a conservative functionalist.
      *   *Refining the Hart Point:* Hart is a Legal Positivist. He separates law and morality conceptually. His argument in *Law, Liberty, and Morality* is utilitarian/liberal, but he acknowledges the complexity. He attacks Devlin's *logic* (the "moderate" vs. "extreme" thesis) and *empirics*.
      *   *Refining the Friend's Point:* This is the "Militant Democracy" or "Civic Integrity" argument. It's structurally similar (society protecting its preconditions) but usually viewed as more defensible because democratic norms are instrumental to freedom, whereas Devlin's sexual morality was viewed as intrinsic/traditional.

  5.  **Final Review against Constraints:**
      *   Did I go sentence by sentence? Yes.
      *   Did I say accept/wince/distortion? Yes.
      *   Did I say who resists? Yes.
      *   Did I address the friend? Yes.
      *   Did I clarify distinctions? Yes.

      *(Self-Correction during drafting)*: I need to be careful not to paint Devlin as *only* sociological. He did think morality was important. But the *justification* for law was social cohesion. The entry says "intrinsically wrong." That's the main error.
      Also, regarding Hart: He didn't say "never." He argued against the *enforcement of morals* as a distinct head of criminalization. He allowed for harm and arguably some offense.
      Regarding the "Prevailed" claim: It's teleological. Better to say "Hart's framework is the dominant *language* of liberal jurisprudence," even if practice lags.

  6.  **Final Polish:** Ensure the tone is respectful of the user's evident knowledge (they already spotted the issues). Use clear headings. (Proceed to generate output).

      *Wait, one more check on the Friend's claim:* Is it fair? Devlin argued society dissolves without shared morality. Modern arguments argue democracy dissolves without shared epistemic/normative standards. The structure is: *X is necessary for the existence of the political community; therefore, the state may protect X.* This is structurally identical. The difference lies in the plausibility of the empirical premise (does homosexuality dissolve society? vs. does disinformation dissolve democracy?). I should highlight this distinction.

      *Okay, ready to write.*
answer: |-
  Your skepticism is well-founded. The entry you have found is a classic example of "textbook simplification": it captures the broad stroke of the conflict but distorts the philosophical machinery underneath. A scholar working on legal philosophy would likely **wince** at several points and call others outright **distortions**.

  Below is a sentence-by-sentence autopsy of the entry, followed by a discussion of your three specific doubts, your friend's comparison, and the distinctions that need to be restored to make sense of the debate.

  ### Part 1: Sentence-by-Sentence Autopsy

  **Sentence 1:** *"Devlin and Hart disagreed about whether the criminal law may enforce morality."*
  *   **Verdict:** **Acceptable (with caveats).**
  *   **Analysis:** This is the standard shorthand. However, a specialist would note that both agreed the law *does* enforce morality (e.g., laws against murder). The disagreement was about whether the enforcement of *private* morality (specifically sexual morality, in the context of the Wolfenden Report) is a valid *function* of the criminal law absent harm to others.
  *   **Who resists:** Neither really, provided "enforce morality" is understood as "enforce morality for its own sake."

  **Sentence 2:** *"Devlin held that immoral conduct is intrinsically wrong and that society has a right to uphold virtue, so the law may criminalise conduct on the ground of its immorality alone..."*
  *   **Verdict:** **Distortion.**
  *   **Analysis:** This is your first suspicion confirmed. Devlin was not a natural law theorist arguing that immorality is metaphysically "intrinsically wrong" in a way that commands state punishment. His argument was **functionalist** and **sociological**. He argued that a society is constituted by a shared morality; if that morality is flouted openly, society will disintegrate. Therefore, society has a right to self-preservation. The ground for criminalization is not "virtue" in the abstract, but **social cohesion**.
  *   **Who resists:** A **Devlin defender** would strongly resist this. It makes him look like a religious zealot rather than a conservative sociologist. It swaps *Legal Moralism* (punish because it's wrong) for the *Disintegration Thesis* (punish because it threatens social survival).
  *   **What changes:** If Devlin is a moralist, he must prove the act is wrong. If he is a functionalist, he must prove the act threatens society. The latter is an empirical claim; the former is a normative one.

  **Sentence 2 (continued):** *"...he added only that the convictions of the reasonable person should be the standard, so that the law need not defer to the merely eccentric or the oversensitive."*
  *   **Verdict:** **Wince / Partial Distortion.**
  *   **Analysis:** Devlin did use the "reasonable man" (or "right-minded man") test. However, the entry frames this as a **liberal safeguard** ("so that the law need not defer..."). For Devlin, the reasonable person was not a check on power; they were the **source** of the morality. If the reasonable man feels disgust, that *constitutes* the immorality. It is a majoritarian test, not a protective one.
  *   **Who resists:** A **Devlin defender** would resist the implication that this was a constraint. It was the engine of his theory. A **Hart defender** would wince because this highlights the tyranny of the majority inherent in Devlin's view.

  **Sentence 3:** *"Hart answered with Mill's harm principle: conduct may be restricted only where it harms others, and therefore the law may never regulate conduct merely because it is immoral."*
  *   **Verdict:** **Wince / Overstatement.**
  *   **Analysis:** Hart *invoked* Mill, but he was a legal positivist and a utilitarian, not a dogmatic Millian. He did not argue the law may *never* regulate immorality; he argued that the *enforcement of morals* is not an independent justification for criminalization. He distinguished between **Positive Morality** (what society believes) and **Critical Morality** (what can be rationally defended). He opposed enforcing the former without the latter. Furthermore, Hart allowed for some paternalism (e.g., seatbelts) in other contexts, suggesting his commitment to the Harm Principle was nuanced.
  *   **Who resists:** A **Hart defender** would resist the "never." It ignores Hart's distinction between positive and critical morality, which is the core of his critique. It makes him look like he simply inherited Mill's view rather than constructing a positivist critique of Devlin's logic.

  **Sentence 4:** *"Since there is no evidence that a shared morality is required for a society's survival, and since Hart's principle is the one that liberal legal systems have largely adopted, Hart's position has prevailed."*
  *   **Verdict:** **Distortion (on both counts).**
  *   **Analysis:**
      1.  *Empirical Claim:* Devlin argued this was a conceptual truth about what "society" means, or a historical generalization not easily falsified by a single counter-example. Hart argued it was unproven, but saying "there is no evidence" is too blunt.
      2.  *Prevailed:* This commits the **is/ought fallacy** (popularity $\neq$ correctness). Moreover, it is empirically dubious. Liberal legal systems still criminalize many "moral" offenses (drug use, euthanasia, certain sexual acts, obscenity) where harm is debatable. Hart's *language* prevails in jurisprudence, but Devlin's *instincts* prevail in legislation.
  *   **Who resists:** **Devlin defenders** resist the empirical dismissal. **Hart defenders** resist the claim that the debate is "over," noting that legal moralism remains a live option in courts (e.g., *Bowers v. Hardwick* in the US, or various obscenity trials).

  ---

  ### Part 2: Addressing Your Three Doubts

  #### 1. Is the entry's Devlin a fair reconstruction?
  **No.** As you suspected, the entry substitutes **Intrinsic Legal Moralism** for **Social Functionalism**.
  *   **Intrinsic Legal Moralism:** "X is wrong, therefore X should be illegal." (This is what the entry attributes to Devlin).
  *   **Devlin's Actual View (Disintegration Thesis):** "Society requires a shared morality to exist. X violates that shared morality. Therefore, to prevent social disintegration, X should be illegal."
  *   **What turns on this:** If Devlin is an intrinsic moralist, his argument stands or falls on moral truth. If he is a functionalist, his argument stands or falls on **sociological evidence**. Hart's main attack was on the functionalist claim: he argued that societies *do* change their morals without disintegrating (e.g., the shift in views on usury or divorce). By making Devlin an intrinsic moralist, the entry makes Hart's empirical counter-arguments seem irrelevant.

  #### 2. Does the entry overstate Hart?
  **Yes.** It flattens Hart's **Positivist Critique** into a **Liberal Dogma**.
  *   **The Missing Distinction:** Hart distinguishes between **Positive Morality** (the actual beliefs of a society) and **Critical Morality** (general moral principles used to criticize institutions).
  *   **Hart's Actual Case:** Hart argued that Devlin conflated these two. Just because society *believes* homosexuality is wrong (Positive) does not mean it *is* wrong (Critical). The law should not enforce Positive Morality unless it aligns with Critical Morality (usually grounded in harm or liberty).
  *   **Why it matters:** If Hart simply says "Mill was right," he offers no tool to analyze *why* Devlin is wrong. By using the Positive/Critical distinction, Hart shows that Devlin's "reasonable man" test is just a measurement of prejudice, not a moral argument. The entry misses this crucial analytic move.

  #### 3. Does the closing inference survive?
  **No.** The inference "Hart's principle is adopted, therefore Hart's position prevailed" is logically weak and empirically shaky.
  *   **Logical Flaw:** Widespread adoption does not equal philosophical victory. Slavery was once widely adopted; that did not make it right.
  *   **Empirical Flaw:** As you noted, criminal law remains deeply moralistic. Laws against recreational drugs, prostitution, and assisted dying often rely on "public morality" arguments that look very Devlin-esque, even if courts dress them up in harm-based language.
  *   **Salvage:** The only salvageable claim is: "Hart's framework provides the dominant *vocabulary* for contemporary liberal jurisprudence." Even judges who rule like Devlin often feel compelled to write opinions that sound like Hart.

  ---

  ### Part 3: Your Friend's Comparison (Devlin vs. Democratic Norms)

  Your friend's claim is **structurally fair but substantively contentious**.

  *   **The Structural Similarity:** Both arguments rely on the **Preconditions of Community**.
      *   **Devlin:** A shared moral code is a precondition for society's existence.
      *   **Modern Democratic Argument:** Shared epistemic norms (truth-telling, non-violence, tolerance) are preconditions for democracy's existence.
      *   **Logic:** If $X$ is necessary for the political community to survive, the state may protect $X$ even if it restricts individual liberty.
  *   **The Substantive Difference:** The plausibility of the empirical premise.
      *   **Devlin:** It is highly debatable whether private sexual conduct actually threatens social cohesion. Most liberals argue it does not.
      *   **Democratic Norms:** It is more plausible to argue that widespread disinformation or hate speech *does* corrode the mechanisms of democracy (elections, deliberation).
  *   **The Ambiguity:** The comparison inherits the entry's ambiguity if it fails to distinguish between **protecting institutions** (Hart-compatible) and **protecting sentiments** (Devlin-compatible).
      *   If the argument is "We must ban speech because it hurts democracy's *function*" (e.g., inciting violence), Hart might accept this under a broad "Harm Principle."
      *   If the argument is "We must ban speech because it violates the *values* democracy stands for," that is closer to Devlin.
  *   **Verdict:** Your friend is right that Devlin's *structure* is still used (often called "Militant Democracy" or "Civic Republicanism"). However, defenders of Hart would argue that democratic norms are instrumental to liberty, whereas Devlin's morality was often intrinsic. Thus, restricting speech to save democracy can be framed as preventing harm to the *system of liberty*, whereas restricting sodomy to save society was preventing harm to *tradition*.

  ---

  ### Part 4: Restoring the Distinctions

  To trust an account of this debate, you need to ensure it distinguishes between the following. The entry you found collapses them.

  **1. Two Types of Legal Moralism**
  *   **Intrinsic Moralism:** Conduct should be criminal because it is morally wrong *in itself* (e.g., sin against God/Nature).
  *   **Social Moralism (Devlin):** Conduct should be criminal because its tolerance would cause society to unravel.
  *   *Why it matters:* Hart can defeat Social Moralism with sociology (societies don't unravel). He cannot defeat Intrinsic Moralism without engaging in substantive moral philosophy. The entry makes Devlin an Intrinsic Moralist, which makes Hart's sociological counter-arguments look like they are missing the point.

  **2. Two Concepts of Morality (Hart's Distinction)**
  *   **Positive Morality:** The rules actually accepted and practiced by a given society.
  *   **Critical Morality:** The general moral principles used to criticize the existing social order.
  *   *Why it matters:* Devlin wants to enforce Positive Morality. Hart argues Positive Morality is often wrong (e.g., slavery was once Positive Morality). The law should aim for Critical Morality. The entry ignores this, making the debate look like "Morality vs. Liberty" rather than "Which Morality?"

  **3. Grounds for Criminalization**
  *   **Harm Principle:** Prevent damage to others (Mill/Hart).
  *   **Offense Principle:** Prevent profound offense to others (Feinberg—often a middle ground).
  *   **Legal Paternalism:** Prevent harm to self.
  *   **Legal Moralism:** Prevent immorality.
  *   *Why it matters:* The entry suggests Hart allows *only* Harm. In reality, most Hartians accept some version of the Offense Principle (e.g., public indecency). This nuance explains why some "moral" laws survive in liberal systems without contradicting Hart entirely.

  ### Conclusion: How much to trust the entry?
  **Trust the headline, distrust the reasoning.**
  *   **Trust:** Hart and Devlin disagreed on the enforcement of morals. Hart is the hero of modern liberal jurisprudence.
  *   **Distrust:** The characterization of Devlin as an intrinsic moralist (he was a functionalist). The characterization of Hart as a rigid Millian (he was a nuanced positivist). The claim that the debate is settled (it isn't; it resurfaces in every culture-war court case).

  If you rely on this entry, you will understand *who* won the public relations battle, but you will not understand *why* the philosophical battle matters today. Your friend's comparison is the best proof of that: Devlin's argument survives wherever a state claims it must restrict liberty to preserve the "identity" or "cohesion" of the political community. The entry's claim that Hart "prevailed" obscures the fact that Devlin's ghost is still very much alive in legislation regarding immigration, national security, and civic education.
