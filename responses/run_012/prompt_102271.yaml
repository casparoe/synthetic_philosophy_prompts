      *   *Self-Correction on Prior:* A prior centered at 0.35 when the data is 0.30 looks like the Bayesian is just assuming the result. I need to make sure the prior is justified as *independent*. Let's ground it in "Phase I dose-response modeling" which suggested the biological minimum effective dose yields $\delta \approx 0.4$.
      *   *Check Consistency:*
