          *   Prior: Based on mechanistic theory. Effect *must* be positive. $\theta \sim N(0.35, 0.2^2)$. (Truncated at 0? No, keep it normal for simplicity, but mean is positive).
          *   Prior Precision: $1/0.04 = 25$.
          *   Likelihood Precision: $1/0.1826^2 \approx 30$.
          *   They are equally weighted.
          *   Posterior Mean $\approx 0.325$. Posterior SD $\approx \sqrt{1/55} \approx 0.135$.
          *   $P(\theta > 0) \approx P(Z > -0.325/0.135) = P(Z > -2.4) \approx 0.99$.
          *   This works. The Frequentist says $p=0.10$ (inconclusive). The Bayesian says $P(\theta>0) = 0.99$ (confident).
          *   *Is the prior legitimate?* Yes, if derived from independent mechanistic models or previous phase A trials. It is not a "spike at zero" (which is the default Bayesian test often used to show skepticism). It is an *informative* prior.
          *   *Why is the Bayesian "credulous"?* Because they are willing to combine weak current data with strong external belief to make a definitive claim *now*, whereas the Frequentist insists the current data must stand on its own to control Type I error *for this specific claim*.

  5.  **Addressing the "Replication Crisis" Angle:**
      *   Standard story: P-values cause false positives (p-hacking). Bayes fixes it by penalizing complexity.
      *   This story: P-values cause false negatives (or rather, conservatism) in the face of cumulative science. Bayes allows "premature" confidence by importing external assumptions.
      *   Implication: Switching to Bayes doesn't solve the crisis; it shifts the source of error from "sampling variability + flexibility" to "prior specification + overconfidence in external validity."

