      *   *Lindley's Paradox:* This is the classic theoretical mechanism. It occurs when $N$ is large, the prior is tight around a specific non-zero value, and the observed effect is small but precise. However, Lindley's Paradox usually shows the *Bayesian* rejecting what the *Frequentist* accepts (Bayesian is more skeptical).
      *   *Reverse Lindley's Paradox:* We need the Bayesian to be *more confident* than the Frequentist.
      *   *Mechanism:* The Frequentist test is sensitive to variance/sample size in a specific way (standard error). The Bayesian update depends on the prior location. If the prior is concentrated on a small, non-zero effect, and the data shows a small, noisy effect consistent with that prior, the Bayesian posterior will shift towards the prior mean. The Frequentist, testing $H_0: \theta = 0$, might find the signal-to-noise ratio too low.
      *   *Key Feature:* The Prior. To make the Bayesian "credulous," the prior must place substantial mass on the alternative hypothesis in a region where the data lands, even if the data isn't "significant" by frequentist standards. The prompt specifies the prior must be "informative... derived from evidence independent of this dataset." This is the crux. If the prior is based on strong previous meta-analysis, the Bayesian is borrowing strength. The Frequentist is analyzing *this* study in isolation (as per pre-registration).

