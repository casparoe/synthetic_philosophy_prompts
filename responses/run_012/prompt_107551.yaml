  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the Request:**
      *   **User:** A philosopher presenting a new position on the causal exclusion argument ("stratified causation," dropping the "single-ledger assumption").
      *   **Context:** 50-min talk + 40-min Q&A at a joint Mind & Brain seminar (Philosophy + Cognitive Neuroscience).
      *   **Goal:** A Q&A prep sheet (not a defence of the thesis).
      *   **Audience:**
          *   4 Philosophers of Mind (3 Non-Reductive Physicalists [NRP], 1 Eliminativist).
          *   2 Philosophers of Science (Interventionists/Causal Modelling).
          *   3 Neuroscientists (2 Cellular, 1 Systems).
          *   1 Classicist.
      *   **Constraints:** No citations/reading lists. No hedging. British English. Be honest about weaknesses. Identify the "killer" objection and the "dreaded" question. Pre-emptive concession strategy.
      *   **Position Summary:** Exclusion argument is valid but relies on a "single-ledger assumption" (modelling choice, not metaphysics). Dropping it allows "stratified causation." Physical fixes mechanism, Mental fixes outcome within that mechanism. Screening-off is stratum-relative. Parity argument applied to special sciences. Mental properties pass a difference-making test indexed to a stratum.

  2.  **Brainstorming Audience Perspectives:**

      *   **Non-Reductive Physicalists (NRPs):** They are scared of exclusion. They want this to work. *Worry:* Is this just dualism in disguise? Does it really save causal efficacy or just redefine it? Is "stratified causation" coherent without overdetermination?
      *   **Eliminativist:** Thinks mental properties don't exist. *Attack:* Why save folk psychology? If you need a new metaphysics to save "belief," maybe drop "belief."
      *   **Interventionists (Phil Sci):** Care about variables, graphs, and interventions. *Attack:* How do you model this in a DAG? If $P$ (physical) determines $M$ (mental), intervening on $M$ is impossible without intervening on $P$. If you intervene on $P$, $M$ changes. How is $M$ doing work? "Stratum-relative screening-off" sounds like a violation of the Causal Markov Condition.
      *   **Cellular Neuroscientists:** Care about mechanisms, ions, channels. *Attack:* This sounds like vitalism or magic. If I clamp the voltage, the behaviour happens. Why do I need the "mental"? Does this change my experimental design?
      *   **Systems Neuroscientist:** Care about function, networks, behaviour. *Attack:* Might be more sympathetic to functional levels, but worried about vagueness.
      *   **Classicist:** History of ideas. *Attack:* Is this just formal/final causes vs. material/efficient causes?
      *   **The User (Presenter):** Needs to survive 40 mins of questions. Needs to know where the body is buried.

  3.  **Developing the Objections (8-10):**

      *   *Objection 1 (Interventionist):* The "Fat-Handedness" problem. You can't intervene on $M$ without $P$. If $P$ screens off $E$, $M$ is idle.
      *   *Objection 2 (Cellular Neuro):* The "Shut Up and Calculate" objection. If the physical mechanism is sufficient, why posit the mental cause? It adds no predictive power.
      *   *Objection 3 (NRP):* The "Dualism" worry. If $M$ selects outcomes $P$ couldn't, isn't $M$ violating physical closure?
      *   *Objection 4 (Eliminativist):* The "Parity" backfire. If you save mental causation by saving epidemiology, maybe we should just eliminate epidemiology's causal talk too (instrumentalism).
      *   *Objection 5 (Interventionist):* The "Graph" challenge. Draw the DAG. Where does the arrow go? If $P \to M$ and $P \to E$ and $M \to E$, you have a collider or redundancy.
      *   *Objection 6 (Systems Neuro):* The "Control" question. If I want to change behaviour, do I target the mental or the physical? If physical, isn't mental causation practically useless?
      *   *Objection 7 (Classicist):* The "Aristotle" charge. Is this just final causation dressed up?
      *   *Objection 8 (NRP):* The "Realisation" relation. If $P$ realises $M$, and $M$ causes $E$, doesn't $P$ cause $E$ *in virtue of* realising $M$? Does stratification break the realisation link?
      *   *Objection 9 (General):* The "Explanatory Gain" question. What work does "stratified causation" do that "levels of explanation" doesn't?
      *   *Objection 10 (The Killer):* The "Closure of the Physical" conflict. If $M$ fixes the outcome, and $P$ fixes the mechanism, but $P$ is physically closed, where does the information come from to fix the outcome?

      *Refining for Impact:* I need to order these by damage potential.
      1.  Interventionist/Modelling (The technical kill).
      2.  Physical Closure (The metaphysical kill).
      3.  Neuroscientist Utility (The pragmatic kill).
      4.  Dualism/Epiphenomenalism (The philosophical kill).
      5.  Parity/Instrumentalism (The eliminativist trap).
      6.  Aristotle/History (The embarrassment).
      7.  Realisation relation (The internal consistency).
      8.  Contrast Class specifics (The technical detail).

  4.  **Drafting the Replies:**
      *   Must be 2 minutes spoken.
      *   Must include a "soft spot" (honest admission of weakness).
      *   Must be in British English.
      *   No citations.

  5.  **Strategic Elements:**
      *   *Pre-emptive Concession:* What to admit early to disarm critics? Probably that this doesn't help with *prediction* for the neuroscientists, only *explanation*. Or that it relies on a specific definition of causation.
      *   *The "Must Land" Objection:* Usually the one that threatens the core coherence. Here, it's likely the Interventionist/Modelling one. If the causal model doesn't work, the thesis is dead.
      *   *The "Dreaded" Question:* The one that exposes the position as trivial or old. Likely the "Is this just levels of explanation?" or the Aristotle one.

  6.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I use citations? No.
      *   *Check:* Is it British English? (e.g., "modelling", "programme", "defence").
      *   *Check:* Are the voices distinct? (Neuroscientist should sound practical, Interventionist technical, etc.).
      *   *Check:* Is the "Single-Ledger" assumption clearly targeted?
      *   *Check:* Is the "Stratified Causation" distinction clear? (Physical = mechanism, Mental = outcome selection).
      *   *Critique:* The user's position says "Physical fixes mechanism, Mental fixes outcome." This is risky. If Physical fixes the mechanism, doesn't it fix the outcome given initial conditions? If Mental fixes the outcome, does it override Physical? This sounds like it violates physical closure. I need to make sure the replies acknowledge this tension without collapsing.
      *   *Adjustment:* The reply must emphasize that the "outcome" is described differently at different strata, not that the mental *magically* changes the physical trajectory. It's about *description* and *contrast classes*, not magic.

  7.  **Final Polish:**
      *   Ensure the tone is supportive but rigorous (like a senior colleague).
      *   Make sure the "Soft Spot" is genuinely useful for the user to know where they might get pinned down.
      *   Ensure the "Pre-emptive Concession" is strategic.

  8.  **Final Review against constraints:**
      *   8-10 objections? Yes.
      *   Ordered by damage? Yes.
      *   Phrased as the audience would? Yes.
      *   2-min reply + soft note? Yes.
      *   Pre-emptive concession? Yes.
      *   Single objection that must land? Yes.
      *   Dreaded question? Yes.
      *   British English? Yes.
      *   No citations? Yes.

  (Proceed to generate output based on this thought process.)
answer: |-
  **Q&A PREPARATION SHEET: STRATIFIED CAUSATION AND EXCLUSION**

  **To:** The Speaker
  **From:** Senior Colleague (Philosophy & Cognitive Science)
  **Re:** Seminar Defence Strategy

  You have proposed a metaphysical shift to solve a metaphysical problem, but you are presenting to a room half of whom care about experimental utility and the other half of whom care about formal modelling. Your "single-ledger" critique is sharp, but your positive account of "stratified causation" risks looking like a verbal solution to a real problem. The following sheet is designed to keep you from being cornered.

  ### PRE-EMPTIVE CONCESSION
  *Before taking the first question, add this paragraph to your closing remarks:*

  'I want to be clear before we begin: this framework is not designed to improve the *predictive* power of neuroscience. If you are a cellular neuroscientist wanting to clamp a membrane potential to predict a spike, the mental stratum offers you nothing. This is an account of *explanatory autonomy*, not predictive leverage. If you are looking for a reason to change your lab protocols, I do not have one. I am arguing that the causal claims you make in the lab do not exhaust the causal structure of the world, not that you are doing your jobs wrong.'

  **Why:** This disarms the neuroscientists immediately. They won't waste thirty minutes asking if this changes their Tuesday morning patch-clamp experiments. It also signals to the philosophers that you know the difference between ontology and methodology.

  ---

  ### THE OBJECTIONS (Ordered by Damage Potential)

  **1. The Interventionist Modelling Objection**
  *Who:* One of the Philosophers of Science (Interventionists).
  *The Question:* 'You say screening-off is stratum-relative. But in a causal graph, variables are nodes. If the physical variable $P$ determines the mental variable $M$ (via supervenience or realisation), and $P$ causes $E$, then $M$ is either a collider or a redundant node. If I intervene on $M$, I must intervene on $P$. If I intervene on $P$, $M$ comes along for the ride. How do you draw this graph without violating the Causal Markov Condition? If you can't model it, is it causation or just correlation?'

  *The Reply:* 'You cannot draw it on a single flat graph without violating the condition, because a single graph *is* the single-ledger assumption in diagrammatic form. My claim is that we need coupled graphs. In the physical graph, $P$ causes $E$. In the mental graph, $M$ causes $E^*$ (where $E^*$ is the outcome described mentally). The intervention on $M$ is a "soft" intervention that fixes the mental value while allowing the physical realiser to vary across its realisation set. We aren't violating the Markov condition; we are saying the condition applies *within* a stratum, not across them.'
  *The Soft Spot:* This is technically risky. Interventionists hate "coupled graphs" if they aren't formally defined. If they press you on the mathematics of "soft interventions" across supervenience relations, you may have to admit this is a programme for future work, not a finished formalism.

  **2. The Physical Closure Trap**
  *Who:* One of the Non-Reductive Physicalists (the anxious one).
  *The Question:* 'You say the physical fixes the mechanism and the mental fixes the outcome. But if the physical mechanism is complete, doesn't it fix the outcome too? If the mental property selects an outcome that the physical properties didn't already determine, haven't you violated the causal closure of the physical? If it *did* determine it, isn't the mental selection redundant?'

  *The Reply:* 'It depends on how we individuate the outcome. The physical properties determine the physical trajectory. But "the arm rising" is not the same outcome token as "the signalling of intention," even if they coincide. The physical facts fix *that* the arm moves; the mental facts fix *why* it counts as a signal. Closure is preserved because no physical energy is added by the mental; the "selection" is a matter of description and counterfactual dependence, not force addition.'
  *The Soft Spot:* This treads very close to saying mental causation is just "causation under a description," which many regard as a form of epiphenomenalism. If they press on whether the world would be different if the mental properties were absent (holding physical fixed), you must say "no," which sounds like epiphenomenalism, or "yes," which violates closure.

  **3. The Cellular Utility Challenge**
  *Who:* One of the Cellular Neuroscientists.
  *The Question:* 'I listen to this and I hear that you want to keep mental causes because they matter for philosophy. But in my work, if I have a complete physical account of the ion channels, the "mental" adds no variance explained. If your stratified causation doesn't help me isolate a variable, why should I accept it as *causal* rather than just a useful story?'

  *The Reply:* 'Because you already use it. When you write a paper, you don't just list voltage gradients; you say the neuron "fired to encode X." That "encoding" is a mental-stratum claim. You rely on the mental stratum to make your physical data intelligible as a function. I am not asking you to add variables; I am asking you to acknowledge that the causal claims you already make in the discussion section rely on the very stratification I am defending.'
  *The Soft Spot:* They may reply that the discussion section is just heuristic for the grant committee, not ontological truth. You need to hold the line that function *is* causal, not just descriptive.

  **4. The Eliminativist's Parity Backfire**
  *Who:* The Eliminativist.
  *The Question:* 'You use the parity argument: if exclusion kills mental causation, it kills epidemiology. I agree. I think epidemiological causes are also fictions. They are useful summaries of vast physical interactions. Why is saving mental causation worth saving if the price is admitting that all special science causation is merely instrumental?'

  *The Reply:* 'Because "instrumental" does not mean "false." When an epidemiologist says smoking causes cancer, they are identifying a stable dependency that holds across multiple physical realisations of smoking. That stability is real, even if the underlying physics varies. If you call that fiction, you must also call "computation" a fiction because it can be realised in silicon or neurons. I am willing to pay the price of realism about the special sciences; are you willing to pay the price of eliminating computation?'
  *The Soft Spot:* The eliminativist might happily say "Yes, computation is just a metaphor." If they bite that bullet, your parity argument loses its force.

  **5. The "Just Levels of Explanation" Charge**
  *Who:* One of the Non-Reductive Physicalists (the sceptical one).
  *The Question:* 'This sounds like the old move: "Causation is one thing, explanation is another." You've dressed up the standard "levels of explanation" view in new terminology. If you admit the physical does all the heavy lifting, and the mental just helps us *track* it, haven't you conceded the exclusion argument and just changed the subject?'

  *The Reply:* 'No, because standard levels of explanation usually treat the higher level as a pragmatic gloss on the real causal work below. I am arguing the higher level tracks *different counterfactuals*. The physical level tells us what *must* happen given these atoms. The mental level tells us what *would* have happened if the agent had chosen differently, even if the atoms were slightly different. That is a different causal relation, not just a different explanation of the same relation.'
  *The Soft Spot:* You must be prepared to give a concrete example of a counterfactual that is true at the mental stratum but false at the physical stratum without violating supervenience. This is technically difficult.

  **6. The Aristotle Accusation**
  *Who:* The Classicist.
  *The Question:* 'You distinguish the mechanism (physical) from the outcome selection (mental). Aristotle distinguished the efficient cause (the push) from the final cause (the goal). Are you not simply reviving final causation and calling it "stratified"? If so, are you prepared to accept the metaphysical baggage that comes with teleology?'

  *The Reply:* 'There is a structural similarity, yes. But I am not positing goals as metaphysical magnets pulling the future. I am positing that systems organised by selection history (like brains) exhibit stability patterns that are best captured by teleological language. It is naturalised teleology. I am happy to accept the label "final cause" provided we understand it as a shorthand for control-system dynamics, not mystical purpose.'
  *The Soft Spot:* If you concede too much here, the physicalists will worry you are introducing spooky teleology. If you concede too little, the Classicist will dismiss you as ahistorical.

  **7. The Realisation Relation Problem**
  *Who:* One of the Non-Reductive Physicalists.
  *The Question:* 'If the physical realises the mental, and the mental causes the effect, doesn't the physical cause the effect *in virtue of* realising the mental? If so, the causal work is still done by the physical. Your stratification seems to sever the link between realisation and causation.'

  *The Reply:* 'It severs the link between realisation and *exhaustion*. The physical realises the mental, yes. But the causal power of the mental property comes from its place in a network of mental properties, not just its physical base. The realisation relation grounds the mental, but the causal relations are internal to the stratum. The physical doesn't cause the effect *in virtue of* realising the mental; it causes the effect *by* being the mechanism that instantiates the mental causal power.'
  *The Soft Spot:* This is dense. If they ask for the metaphysics of "instantiating causal power" without overdetermination, you may struggle to articulate it without sounding dualist.

  **8. The "Difference-Making" Specifics**
  *Who:* The Systems Neuroscientist.
  *The Question:* 'You say mental properties pass a difference-making test indexed to a stratum. Give me a concrete case. If I lesion area V4, the subject can't discriminate colour. What is the mental difference-maker there that isn't just the physical lesion?'

  *The Reply:* 'The lesion destroys the mechanism. But the *discrimination* is the mental outcome. If I lesion V4, I destroy the capacity for colour discrimination. But if I change the lighting (physical change) without lesioning, the discrimination might hold (colour constancy). The mental property "discriminating red" remains invariant across physical changes that would look like different causes at the physical stratum. The difference-making is tested against changes in lighting, not changes in neurons.'
  *The Soft Spot:* They might argue that colour constancy is just a more complex physical mechanism. You need to insist that the *variable* being held fixed is different (lighting vs. neurons), which defines the stratum.

  **9. The "Single-Ledger" Definition**
  *Who:* One of the Philosophers of Science.
  *The Question:* 'You say the single-ledger assumption is a modelling choice. But isn't it dictated by reality? If there is one world, surely there is one set of causes. Are you arguing for a form of ontological pluralism? If so, how do the strata interact?'

  *The Reply:* 'I am arguing for ontological pluralism about *causal structure*, not about the world. There is one world, but it supports multiple, equally valid causal structures depending on which variables we stabilise. A map of London and a map of the London Underground are both of London, but they have different topologies. Neither is the "single ledger" of London. I am saying causation is map-relative.'
  *The Soft Spot:* Critics may argue that the Underground map is derivative of the street map, whereas you want the mental map to be autonomous. You must defend the autonomy of the "mental map."

  **10. The "So What?" Question**
  *Who:* Anyone (likely the Eliminativist or a tired Neuroscientist).
  *The Question:* 'Suppose you are right. Exclusion is blocked, stratified causation is real. What changes? Do we punish criminals differently? Do we treat mental illness differently? If the answer is "nothing," why should we care?'

  *The Reply:* 'It changes how we fund research and how we interpret failure. If you think only the physical ledger is real, you stop funding psychological interventions when drugs are available. If you accept stratified causation, you acknowledge that fixing the chemistry doesn't always fix the mental outcome, because the mental stratum has its own stability conditions. It protects the autonomy of psychotherapy and behavioural intervention from being swallowed by pharmacology.'
  *The Soft Spot:* This is a pragmatic argument for a metaphysical thesis. It might seem like a bait-and-switch. Be prepared to link it back to the truth of the claims, not just their utility.

  ---

  ### THE "MUST LAND" OBJECTION
  **Objection #1 (The Interventionist Modelling Objection).**

  **Why:** If you cannot satisfy the interventionists that this is compatible with formal causal modelling, the philosophers of science will dismiss the thesis as pre-scientific metaphysics. Since your argument relies heavily on the "modelling choice" aspect of the single-ledger assumption, failing to show how an alternative model works destroys your positive account. If the graph cannot be drawn, the causation does not exist in the modern view. You must convince them that "stratified graphs" are a coherent mathematical possibility, even if you don't have the full equations ready.

  ### THE DREADED QUESTION
  **The Question:** 'Is this not just the "Levels of Explanation" view that Jaegwon Kim already refuted in 1998, but with the word "causation" inserted where Kim showed only "explanation" could fit?'

  **Why:** This exposes the risk that your position is a relabelling of a failed strategy. Kim argued that you can have levels of explanation, but only one level of causation. If you cannot distinguish your "stratified causation" from "levels of explanation" clearly, you look like you haven't read the literature or are trying to sneak a dead horse back into the room.

  **What to say:** 'Kim assumed that for there to be causation at a level, there must be energy transfer or physical production at that level. I am denying that. I am arguing that *counterfactual dependence* is sufficient for causation, and that dependence holds at the mental stratum independently of the physical stratum's specific trajectory. Kim refuted the idea that explanation implies causation; I am arguing that difference-making *is* causation, and difference-making is stratified. It is a substantive metaphysical disagreement, not a terminological shuffle.'

  ---

  ### FINAL ADVICE
  You are walking a tightrope between dualism and reductionism. The NRPs want you to be their saviour, but they will turn on you if you sound like a dualist. The Neuroscientists will tune out if you sound like a mystic. The Interventionists will dismantle you if you sound imprecise.

  Stick to the "Single-Ledger" critique. It is your strongest weapon. Keep repeating that the demand for a single ledger is a *choice*, not a law of nature. If you lose the room, it will be because you tried to prove the mental causes are "as real as" the physical causes. Do not fight that battle. Fight the battle that they are *differently real*, tracking different dependencies.

  Good luck. Keep your water close; forty minutes is a long time.
