prompt: |-
  I have no academic training, and I would rather you reasoned things out than sent me to a reading list, so please do not bother with references or suggestions for further reading.

  By way of background: I am a keen amateur birder. I have spent years reading field guides, checklists and the introductions to them, so I can follow an argument about clades and grades, grouping by ancestry as against grouping by resemblance, monothetic and polythetic definitions, diagnostic characters and diagnosability, lumping and splitting, typological thinking as against population thinking, and the standing quarrel over whether a taxon is discovered or decided. I am not a biologist, so gloss anything I would be unlikely to know. I have also spent years arguing with friends about whether generations are real: baby boomers, millennials, Gen Z, and so on.

  What I want is a translation, as faithful as you can make it, of the debate about generations into that taxonomic vocabulary. Take the positions one at a time: first the claim that a generation is a real social kind, that a birth window together with a shared historical situation produces a distinctive outlook its members carry with them; then the sceptical claim that generations are labels applied after the fact by journalists, marketers and people selling advertising, and that the apparent differences between cohorts are really differences of age or of period. For each, say what carries over into taxonomic terms cleanly, what has to be bent to fit, and what cannot be expressed there at all. Please do not let taxonomic assumptions quietly do work that the generational claims were never making.

  Then the residue report, which is the part I care about. Three things I suspect do not survive the translation, and I would like to be told whether I am right and what it shows if I am. First, a generation is not a lineage: its members are contemporaries, not ancestors and descendants, so the clade analogy may be doing no work, and a generation may be nearer to a grade, which I have the impression has fallen out of favour as a real kind. Second, generation-talk is meant to explain the outlook of the people in it, whereas a taxonomic category does not explain the traits of its members; if that is so, then wanting generations to be real kinds in the taxonomic sense may be wanting the wrong thing. Third, people know which generation they are said to belong to and speak about themselves accordingly, and I cannot think of anything in taxonomy that answers to that. I would also like your view on a related muddle: whether the ordinary arguments slide between people born in a particular window, people who were young during a particular period, and people of a given age now, and whether anything follows from that.

  Finally, where the translation fails, say whether the failure is a defect of taxonomy, something a framework built on descent and resemblance cannot express, or a sign that the generation claim was never as clear as it sounded, and whether the residue tells us anything about which side of the debate has the better of it. Please write the answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Profile:** Keen amateur birder, no academic training in biology/sociology, but well-read in taxonomy concepts (clades, grades, monothetic/polythetic, diagnosability, lumping/splitting, typological vs. population thinking, realism vs. nominalism). Familiar with the "generations debate" (Boomers, Millennials, etc.).
      *   **Task:** Translate the debate about social generations into taxonomic vocabulary.
      *   **Constraints:** No references, no reading lists, reason things out, British English.
      *   **Structure:**
          1.  Position 1: Generations are real social kinds (Realism).
          2.  Position 2: Generations are labels applied after the fact (Nominalism/Constructivism).
          3.  For each: What carries over cleanly, what bends, what fails.
          4.  Residue Report (The user's three suspicions + the age/period/cohort muddle).
          5.  Conclusion: What the failure of translation signifies (defect of taxonomy vs. vagueness of generation claim) and who wins the debate.

  2.  **Deconstruct Position 1: Generations as Real Kinds (Realism)**
      *   *Claim:* Birth window + shared history = distinctive outlook (essentialism/dispositionalism).
      *   *Taxonomic Translation:* This sounds like a *clade* (common origin/birth window) but defined by *traits* (outlook). Actually, it's closer to a *species* concept based on reproductive isolation, but here isolation is temporal/cultural.
      *   *Clean Carry-over:* "Diagnosability." If Millennials have a distinct set of attitudes (traits) that allow you to identify them without knowing their birth year, they are diagnosable. "Population thinking" applies (variation within the generation, but a distinct mean/shift).
      *   *Bent Fit:* "Ancestry." In biology, clades are defined by descent. Generations are defined by *contemporaneity*. They are a slice of time, not a branch of a tree. This forces the "clade" analogy to break. It looks more like a *chronospecies* (a slice of a lineage in time) but without the lineage connection being the defining feature of the *grouping* itself relative to other groups.
      *   *Cannot Express:* The mechanism of "shared historical situation." In biology, environment selects, but the *group* isn't defined by the environment in the same way. Also, the "outlook" is behavioural/cultural, not morphological/genetic.

  3.  **Deconstruct Position 2: Generations as Labels (Nominalism)**
      *   *Claim:* Arbitrary boundaries, marketing tools, differences are actually age effects (lifecycle) or period effects (current events affecting everyone).
      *   *Taxonomic Translation:* This is the "Lumping" vs. "Splitting" debate, specifically arguing that the "splits" are artificial. It aligns with *typological thinking* (imposing a type on a continuum) vs. *population thinking* (seeing a continuum). It suggests generations are *grades* (grouped by superficial similarity or time-slice) rather than *clades* (natural groups).
      *   *Clean Carry-over:* "Arbitrary boundaries." Taxonomy struggles with ring species or gradual clines; generation boundaries (1981 vs 1982) are exactly like drawing a line on a cline. "Diagnosability" fails here (you can't tell a Millennial from a Gen Z without asking their birth year).
      *   *Bent Fit:* "Age vs. Period vs. Cohort." In biology, ontogeny (age) is distinct from phylogeny (lineage). The sceptic says we are confusing ontogeny (being young) with phylogeny (being a Millennial).
      *   *Cannot Express:* The *motive*. Taxonomy doesn't care *why* you name a group (marketing vs. science), only if the group holds up. Sociology cares deeply about the *purpose* of the category.

  4.  **Residue Report (User's Suspicions)**
      *   *Suspicion 1: Lineage vs. Grade.* User is right. Generations are time-slices. In cladistics, a time-slice is often a *grade* (paraphyletic if it excludes descendants, but here it's just a cross-section). Clades are vertical; generations are horizontal slices. If grades are "unreal," generations might be too.
      *   *Suspicion 2: Explanation.* Taxonomy classifies; it doesn't necessarily *explain* the traits (phylogeny explains distribution, but the category itself is a container). Generations are invoked *to explain* behaviour. If the category is the *explanandum* (thing to be explained) vs *explanans* (thing doing the explaining).
      *   *Suspicion 3: Reflexivity.* Organisms don't know they are *Passer domesticus*. Humans know they are "Millennials" and act accordingly (self-fulfilling prophecy). This is *looping effects* (Hacking), though I shouldn't name-drop if avoiding references, but I can describe the mechanism. Taxonomy has no equivalent for "the specimen names itself."
      *   *The Muddle (Age/Period/Cohort):* This is the APC (Age-Period-Cohort) problem. In taxonomy, this is like confusing ontogeny (juvenile vs adult), environmental fluctuation (drought year), and lineage.

  5.  **Conclusion: What the Failure Means**
      *   Is taxonomy defective? No, it's built for descent with modification.
      *   Is the generation claim vague? Yes, it conflates time, culture, and biology.
      *   Who wins? The sceptic (Nominalist) has the stronger taxonomic footing because generations lack the reproductive isolation and vertical descent required for "natural kinds" in biology. However, the "Realist" has a point about *cultural inheritance*, which is a different tree.

  6.  **Drafting - Tone and Style:**
      *   British English (colour, analyse, programme, etc.).
      *   Respectful of user's knowledge (don't over-explain clades/grades).
      *   No references.
      *   Rigorous reasoning.

  7.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Correction:* Be careful not to say grades are "false." They are useful but not "natural" in a cladistic sense.
      *   *Correction:* Ensure the distinction between "Cohort" (birth window) and "Generation" (cultural unit) is clear in the translation.
      *   *Correction:* On reflexivity: Make sure to highlight that this breaks the "observer independence" assumption of standard taxonomy.
      *   *Correction:* On the APC muddle: Use the biological analogues clearly (Ontogeny, Environment, Phylogeny).

  8.  **Final Polish:** Check against constraints. No reading list? Check. British English? Check. Addressed all three residue points? Check. Addressed the APC muddle? Check.

  *(Self-Correction on "Grades"):* The user notes grades have "fallen out of favour as a real kind." I should acknowledge that while cladistics rejects grades as *natural* taxa, they remain useful descriptive tools. This mirrors the generation debate perfectly (useful for marketing, not real in nature).

  *(Self-Correction on "Lineage"):* A generation is not a lineage. It is a cross-section of a lineage. In palaeontology, we sometimes name chronospecies. Is a generation a chronospecies? Not really, because multiple generations coexist (Boomers and Millennials are alive at the same time). So it's sympatric time-slices. That's biologically odd.

  *(Refining the "Explanation" point):* Taxonomy *does* explain traits via homology. But the *name* of the taxon doesn't explain the trait; the ancestry does. For generations, the *name* is often used as the cause ("Because he is a Boomer..."). This is reification.

  *(Refining the "Reflexivity" point):* This is the strongest divergence. Taxonomy assumes the world exists independently of the classifier. Generations exist *because* of the classifier (sometimes).

  9.  **Final Review of the Plan:**
      *   Intro: Acknowledge the user's expertise.
      *   Section 1: The Realist Claim (Generations are real).
      *   Section 2: The Sceptic Claim (Generations are labels).
      *   Section 3: Residue Report (The three suspicions + APC muddle).
      *   Section 4: Conclusion (Defect vs. Vagueness + Who wins).
      *   Language: British English throughout.

