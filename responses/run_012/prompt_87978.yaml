  # The Embedding Problem: A Decision Tree
  **Graduate Seminar Handout | Session 1**

  The Frege-Geach problem asks: What is shared between a moral sentence as asserted (*"Lying is wrong"*) and the same sentence as embedded (*"If lying is wrong..."*)? Follow the path that matches your semantic intuition to find your position.

  ```text
                                    [NODE 1]
            What is the semantic constant across embedding contexts?
            (What does the logical operator 'if'/'not' operate on?)
                                    |
        +-------+-------+-------+-------+-------+
        |       |       |       |       |       |
     Content  State   Rule   Pretense  Nothing
        |       |       |       |       |
     [N2]     [N5]    [N7]    [N8]    [N9]
        |       |       |       |       |
     +--+--+ +--+--+ +--+--+   Leaf   +--+--+
     |     | |     | |     |    4     |     |
   [N3]  Leaf [N6] Leaf [N8]        Leaf  Leaf
     |     1   |     3   |           9     10
   Leaf   |  Leaf   |   Leaf
    2    Leaf  5    Leaf  6
         |          |
        Leaf       Leaf
         7          8
  ```

  ### DECISION NODES (Internal)

  **NODE 1: The Semantic Constant**
  *   **Truth-Conditional Content:** The embedded clause contributes a proposition.
  *   **State of Mind:** The embedded clause expresses a non-cognitive attitude.
  *   **Rule of Inference:** The embedded clause is defined by its inferential role.
  *   **Pretense Prop:** The embedded clause is a move in a fictional game.
  *   **Nothing:** Logic does not apply to moral discourse.

  **NODE 2: Content Type** (From *Content*)
  *   **Robust:** The content describes a moral fact. → *Go to Node 3.*
  *   **Deflationary:** The content is minimal/disquotational. → *Go to Node 4.*

  **NODE 3: Hybrid Priority** (From *Robust*)
  *   **Descriptive-First:** The descriptive content drives the logic. → **Leaf 1.**
  *   **Expressive-First:** The expressive force drives the logic (with descriptive trim). → **Leaf 2.**

  **NODE 4: Problem Status** (From *Deflationary*)
  *   **Real Problem:** Minimal truth must still explain validity. → **Leaf 3.**
  *   **Artifact:** The problem vanishes if we drop truth-conditional semantics. → **Leaf 4.**

  **NODE 5: Attitude Structure** (From *State of Mind*)
  *   **Consistency:** Validity is consistency of attitudes (e.g., disliking A and A→B). → **Leaf 5.**
  *   **Norm-Acceptance:** Validity is coherence of planning/norms. → **Leaf 6.**

  **NODE 6: Unoccupied Node**
  *   *Diagnosis:* **Incoherent.** A "State of Mind" view that claims "Identity of Content" (Same Meaning) without reducing the state to a proposition collapses into Cognitivism. Nobody lives here.

  **NODE 7: Inferential Basis** (From *Rule*)
  *   **Proof-Theoretic:** Meaning is defined by formal derivation rules. → **Leaf 7.**
  *   **Use-Theoretic:** Meaning is defined by pragmatic license to infer. → **Leaf 8.**

  **NODE 8: Pretense Status** (From *Pretense*)
  *   **Direct:** → **Leaf 9.** (No further split required).

  **NODE 9: Logical Nihilism** (From *Nothing*)
  *   **Revolutionary:** We should stop treating ethics as logical. → **Leaf 10.**
  *   **Preservative:** We keep the discourse but admit it lacks logic. → **Leaf 11.**
      *(Note: Merged into Leaf 10 for space, see below)*.

  ---

  ### THE LEAVES (Positions)

  **1. Hybrid (Descriptive-First)**
  *   **Uniformity:** **Same Meaning.**
  *   **Awkward Commitment:** It struggles to explain why the descriptive component doesn't dominate moral disagreement, making the 'expressive' bit redundant.

  **2. Hybrid (Expressive-First)**
  *   **Uniformity:** **Same Meaning.**
  *   **Awkward Commitment:** It must explain how a primarily expressive term can sustain truth-conditions robust enough for complex logic without collapsing into Cognitivism.

  **3. Minimalist-Truth Reply**
  *   **Uniformity:** **Same Meaning.**
  *   **Awkward Commitment:** It treats 'true' as disquotational but goes quiet on why moral truth feels normatively different from taste.

  **4. 'Artifact of TC Semantics' Reply**
  *   **Uniformity:** **Same Meaning.**
  *   **Awkward Commitment:** Requires abandoning standard logic textbooks, which most philosophers resist as too high a cost.

  **5. Consistency-of-Attitudes Reply**
  *   **Uniformity:** **Same Meaning.**
  *   **Awkward Commitment:** It handles negation fine but goes quiet when you ask about attitude reports (e.g., 'Sam thinks lying is wrong').

  **6. Norm-Expressivism (Gibbard)**
  *   **Uniformity:** **Same Meaning.**
  *   **Awkward Commitment:** It risks conflating moral disagreement with mere inconsistency in planning, losing the 'world-guided' feel of ethics.

  **7. Inferentialist (Proof-Theoretic)**
  *   **Uniformity:** **Same Meaning.**
  *   **Awkward Commitment:** Must explain what validates the rules if not truth-preservation, often leading to a mysterious 'primitively valid' status.

  **8. Inferentialist (Use-Theoretic)**
  *   **Uniformity:** **Same Meaning.**
  *   **Awkward Commitment:** Blurs the line between semantics and pragmatics so thoroughly that 'meaning' loses its explanatory power.

  **9. Pretense-or-Fiction Views**
  *   **Uniformity:** **Different Meaning.** (Literal assertion vs. Pretend assertion).
  *   **Awkward Commitment:** Makes moral discourse seem like a game, undermining its practical urgency and claim to truth.

  **10. 'Not in Business of Logic' Views**
  *   **Uniformity:** **Different Meaning.** (Assertion vs. Non-Assertion).
  *   **Awkward Commitment:** Implies moral reasoning is fundamentally irrational or rhetorical, which contradicts our lived experience of deliberation.

  ---

  ### DIAGNOSTICS & GAPS

  **🚩 Unoccupied Combinations**
  *   **State of Mind + Content Identity:** (See Node 6). This combination is **incoherent**. If the constant is a *state*, the meaning cannot be *content-identity* unless that content is reduced to the state (which makes it Cognitivism). Pure Expressivists avoid this node.
  *   **Pretense + Same Meaning:** Nobody occupies this. If it is pretense, the embedded occurrence is *pretend* while the asserted one is *assertoric* (or vice versa), forcing a **Different Meaning** verdict.

  **⚠️ Indistinguishable Leaves**
  *   **Leaf 3 (Minimalist) vs. Leaf 4 (Artifact):** These often collapse. If truth is minimal enough, the problem often *becomes* an artifact of demanding robust truth-conditions. The tree separates them by *intent*, but the textual output is nearly identical.
  *   **Leaf 9 (Pretense) vs. Leaf 10 (Not in Business):** Both admit a **Different Meaning** fault line. The distinction relies on whether we *keep* the logic as a fiction (Pretense) or *discard* it (Not in Business), but both face the same charge of making moral reasoning irrational.

  **The Real Fault Line**
  Notice that Leaves 1–8 all claim **Same Meaning** (Uniformity), while Leaves 9–10 admit **Different Meaning**. The Frege-Geach problem is essentially a demand to stay on the left side of this divide without becoming a Cognitivist.
