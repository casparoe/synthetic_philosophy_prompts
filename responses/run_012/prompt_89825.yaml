answer: |-
  The coin was made of brushed tungsten, heavy enough to feel like gravity itself had a preference. It sat in a pneumatic cradle on the stage, under the glare of three high-definition cameras. On the screen behind it, a counter sat at zero.

  Arthur Vance stood in the mezzanine, looking down at the floor of The Expectancy. It was a Tuesday night, but the room was packed. Six hundred people. Maybe seven. They sat in tiered rows like a lecture hall, but the air smelled of expensive cologne and adrenaline, not chalk dust. Each person held a tablet. Each tablet was linked to the central ledger.

  "Showtime," Arthur said. He didn't look at his wife, Elena, who stood beside him with a clipboard pressed to her chest. He was watching the buy-in ticker scroll across the lower third of the main screen. *Entry Fee: $50. Current Pot: $0.*

  "You capped the liability on the backend?" Elena asked. Her voice was low, meant only for him.

  "No caps," Arthur said. "Caps imply fear. We're selling certainty. The math is the guarantee."

  "The math says the expected value is infinite, Arthur. The math says you should mortgage the building to play."

  "The math assumes independent trials," Arthur corrected, finally turning to her. He smiled the way he did during investor pitches—wide, confident, devoid of doubt. "We have six hundred trials. The Law of Large Numbers is our friend. Most coins land heads on the first flip. Half the room wins two dollars. We keep forty-eight. Some land on the third flip. They win eight. We keep forty-two. The long streaks? They're statistical ghosts. They don't happen often enough to matter when you average them across six hundred people."

  "It's not six hundred people," Elena said. She tapped her pen against the clipboard. "It's one coin."

  Arthur waved a hand, dismissing the physics of it. "It's a room full of investors, Elena. They understand risk pooling."

  He walked down the stairs to the stage. The applause was polite, restrained. These weren't slot-machine junkies; they were tech workers, actuaries, day traders who thought they smelled an edge. Arthur had sold them on the elegance of it. No house edge built into the odds. Just a pure coin flip, doubling the pot every time it landed tails. Heads, and the game ended, and the pot was distributed equally among everyone present.

  "Welcome to The Expectancy," Arthur said into the mic. "Tonight, we don't play against the house. We play against the sequence. You all win together. You all lose together."

  He nodded to the technician. The pneumatic cradle hissed. The tungsten coin launched into the air, spinning with a hum that the microphones picked up. It fell into the padded catch basin.

  The screen flashed: **TAILS**.

  The counter ticked to **1**. The pot doubled to **$2**.

  A murmur went through the crowd. Nobody won yet. They needed heads.

  "Again," Arthur said.

  The coin launched. **TAILS**. Counter: **2**. Pot: **$4**.

  "Again."

  **HEADS**.

  The room exhaled. The game had ended on the third flip. The pot was $4 per person. They had paid $50 to win $4. The house kept the difference. Arthur watched the ledger update. Six hundred people times $46 profit. The overhead for the night was covered. The investors in the back would see a modest return.

  Elena appeared at his elbow as the crowd cashed out, some laughing it off, others already buying tickets for the next round. "That was a short sequence."

  "See?" Arthur said. "The average holds. The long tails get diluted by the short heads."

  "It's not dilution if the sample is correlated," Elena said. She turned her clipboard around. She had opened the live liability sheet. "Arthur, look at the exposure."

  "It's theoretical," he said.

  "It's on the screen."

  She pointed to the column labeled *Maximum Concurrent Liability*. In a traditional casino, if one guy hits the jackpot, the house pays him out of the losses of the thousand guys who didn't. The risk is spread. But here, the rules were the selling point. *Shared Fate.* If the coin landed tails twenty times, every single person in the room was owed $2^{20}$.

  "We have liquid reserves for a flip count up to fifteen," Elena said. "Maybe sixteen if we liquidate the short-term bonds. After that, we're insolvent."

  "The odds of a fifteen-flip streak are one in thirty-two thousand," Arthur said. "We run this game every night for a hundred years, we might see it once. And when we do, we'll have built enough reserve from the other nights to cover it."

  "You're betting the company on the assumption that the ghost won't show up," Elena said. "And you've invited six hundred people to watch it happen."

  "Next round is starting," Arthur said. He adjusted his cuff. "Trust the average, Elena."

  The second round began at 9:00 PM. The room was fuller now. Word had spread. The entry fee was still $50, but the potential payout was the hook. People liked the feeling of being on the inside of a formula.

  **TAILS**. Pot: $2.
  **TAILS**. Pot: $4.
  **TAILS**. Pot: $8.
  **HEADS**.

  Groans this time. $8 back on a $50 buy-in. But they stayed. They believed in the law of averages. They believed a heads was "due."

  Arthur watched from the booth. He felt a surge of affection for the crowd. They were believers. They understood that volatility was just the price of admission for infinity. He looked at the aggregate ledger. The house was up significantly. The curve was smooth. The risk was managed.

  Elena wasn't watching the crowd. She was watching the coin.

  Round four started at 10:30 PM. The air conditioning hummed, struggling against the body heat.

  **TAILS**.
  **TAILS**.
  **TAILS**.
  **TAILS**.
  **HEADS**.

  Standard. Safe. Arthur checked his watch. He could close early, book the win, go home. But the momentum was there. The ticker showed a waitlist for the next session.

  "Run it again," Arthur told the tech.

  Elena stepped into the booth. She didn't have her clipboard anymore. Her hands were empty, hanging at her sides. "Arthur. Stop."

  "We're in a streak of short games. The variance is low. This is exactly when you maximize volume."

  "The reserve ratio is dropping," she said. "Not because we lost, but because the potential liability on a single long streak outweighs the cumulative profit of a thousand short ones."

  "It's one coin, Elena. It doesn't remember."

  "It doesn't have to remember. It just has to land."

  He signaled the tech. The cradle hissed.

  **TAILS**.
  The crowd cheered. They wanted the pot to grow.
  **TAILS**.
  **TAILS**.
  **TAILS**.
  **TAILS**.
  **TAILS**.

  The counter hit **6**. The pot was $64. They were already in profit territory for the players. The mood shifted from speculative to hungry.

  **TAILS**. **7**. ($128)
  **TAILS**. **8**. ($256)
  **TAILS**. **9**. ($512)

  Arthur felt a cold knot in his stomach. A nine-flip streak was rare. One in five hundred. But it happened. The house could cover this. $512 per person. Six hundred people. Total payout: $307,000. The house had taken in about $150,000 in entry fees across the night. They would dip into reserves, but they'd survive.

  **TAILS**. **10**. ($1,024)

  A ripple of genuine excitement went through the room. People were standing up. This was the story they would tell. The night the coin kept falling.

  **TAILS**. **11**. ($2,048)
  **TAILS**. **12**. ($4,096)

  Arthur looked at Elena. She wasn't looking at him. She was looking at the exit signs.

  **TAILS**. **13**. ($8,192)

  The room was silent now. The cheering had died. They were doing the math. $8,000 for a fifty-dollar ticket. Life-changing money for some.

  **TAILS**. **14**. ($16,384)

  Arthur's mind raced. $16,000 times 600 people. Nearly ten million dollars. The house didn't have ten million. The house had maybe two in liquid cash.

  "Stop the game," Elena whispered.

  "I can't," Arthur said. "The contract is digital. The ledger is live. If I stop it, it's fraud."

  "If you don't, it's bankruptcy."

  **TAILS**. **15**. ($32,768)

  The number on the screen glowed white against the black background. It was beautiful. It was perfect. It was the end of everything.

  Arthur looked out at the faces. They weren't looking at him with anger yet. They were looking at the coin. They were willing it to land tails again. They didn't know they were willing him into the grave. They thought the house was infinite. They thought the math protected them.

  **TAILS**. **16**. ($65,536)

  A woman in the front row screamed. Not in fear, but in disbelief. $65,000.

  Arthur looked at the reserve monitor. It had turned red. *LIQUIDITY CRITICAL.*

  "Shut it down," Arthur said to the tech.

  The tech looked at him, then at the screen. "The protocol is automated, Arthur. It stops on Heads. I can't force Heads."

  "Pull the plug."

  "If I pull the plug, the last state saves. It saves at sixteen."

  **TAILS**. **17**. ($131,072)

  The room erupted. It wasn't cheers anymore. It was a roar. People were hugging strangers. They were calculating mortgages, cars, debts vanishing. They were living in the future tense.

  Arthur leaned against the console. He watched the expected value curve in his head. It was vertical. The average payout per player was surpassing the GDP of small nations. The Law of Large Numbers had failed him because there was no large number of outcomes. There was only one outcome, shared by all. He had built a pool where everyone drowned or swam together, and he had convinced them it was a safety net.

  **TAILS**. **18**. ($262,144)

  Elena touched his arm. "They're going to come up here."

  "Let them," Arthur said.

  **TAILS**. **19**. ($524,288)

  **TAILS**. **20**. ($1,048,576)

  A million dollars. Every person in the room. Six hundred million dollars owed.

  The coin hung in the air for the twenty-first flip. The mechanical arm jerked. The tungsten disk spun. The sound was deafening in the silence.

  It landed.

  **TAILS**.

  The counter hit **21**. The pot was **$2,097,152**.

  The room went dead quiet. The magnitude had surpassed joy. It had entered the realm of absurdity. No one moved. They were waiting for the credits to hit their tablets.

  The screen flickered. A system message popped up over the coin feed. *TRANSACTION PENDING.*

  Then: *INSUFFICIENT FUNDS.*

  The silence broke. It started as a low hum of confusion, then sharpened into shouts. A man in the front row held up his tablet. "It's not clearing."

  "Check yours!"

  "Mine too!"

  Arthur stepped to the microphone. He knew he should run. He knew the back door was ten feet away. But he was a true believer. He thought if he could just explain the variance, they would understand. They were rational actors. They knew the odds.

  "Please," Arthur said. His voice cracked. "The sequence is valid. The payout is valid. We are restructuring the disbursement."

  "You owe us!" someone shouted.

  "The house covers the loss!"

  "There is no house!" Arthur yelled, and the honesty of it stunned them for a second. "There's only the math! The math says I owe you two million each. The math says I don't have it."

  "Then pay what you have!"

  "It's not enough! It's one percent!"

  The security team moved in, not to protect Arthur, but to clear the stage. The crowd surged. It wasn't a riot yet, just a crush of people trying to get to the ledger, trying to touch the source of the number that existed and didn't exist all at once.

  Elena grabbed Arthur's jacket. "Move."

  They slipped out the back while the front room dissolved into arguments about pro-rata settlement, about class-action lawsuits, about whether the regulator would honor the digital contract.

  They stood in the alley behind the club. The air was cool, smelling of rain and dumpster grease. Inside, the muffled sound of six hundred voices arguing over a phantom fortune drifted through the brick.

  Arthur leaned against the wall. He pulled out his phone. He opened the simulation app he'd used to design the game. He ran the scenario again. *Players: 600. Correlation: 100%. Streak: 21.*

  The result flashed: *TOTAL LIABILITY: $1.26 BILLION. SOLVENCY: 0%.*

  He looked at Elena. She was lighting a cigarette, her hands shaking just enough to notice.

  "I thought the volume would save us," Arthur said. "I thought if enough people played, the risk would disappear into the average."

  "The average doesn't exist for us," Elena said. She blew smoke into the dark. "We only live in the present tense. The average is for the dead."

  Inside, a glass window shattered. The sound was sharp, final.

  Arthur watched the smoke rise from her cigarette. He thought about the people inside. They weren't thinking about the fifty dollars they lost. They were grieving the two million they had held in their hands for three minutes. They had tasted the infinite, and now they had to go back to being finite.

  "They'll sue," Arthur said.

  "Yes."

  "I'll lose."

  "Yes."

  "What do I tell them?"

  Elena flicked the ash onto the wet pavement. "Tell them the coin was fair."

  She turned and walked toward the car. Arthur stayed in the alley. He could hear the regulators arriving now, the sirens cutting through the night. They would seize the servers. They would freeze the accounts. They would write reports about inadequate capitalization and systemic risk.

  They would write everything down except the truth. The truth was that he had asked people to trust a number that couldn't be paid. He had sold them a share of a future that required the world to end in order to be funded.

  From inside, the shouting stopped. A new sound emerged. A low, collective weeping. It wasn't the sound of anger. It was the sound of people realizing that the math they used to order their lives had suddenly stopped adding up.

  Arthur closed his eyes. He listened to the sound of the average breaking. He waited for the police to come out and tell him to turn around, to put his hands behind his back, to become a variable in someone else's equation.
