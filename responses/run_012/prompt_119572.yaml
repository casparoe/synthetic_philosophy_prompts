      *   *User's Muddle:* The user says "what I choose is evidence." This is the weak link. It's not just evidence (like seeing smoke implies fire); it's that the *computation* is the same. If I change my output, the logical fact of what the code outputs changes. I need to correct this to "Logical Counterfactuals" without using jargon.

