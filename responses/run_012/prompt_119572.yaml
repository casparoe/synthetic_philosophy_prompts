prompt: |-
  ok so I've been chewing on this one for a while on my own and I want to run an evening session on it for four friends at my flat, none of them have done any philosophy, one's an engineer, and I've got a whiteboard and about fifty minutes.

  the thing is this: normally we think you can only cooperate with someone if you can actually affect them, or send them a message, or at least meet them. but theres a way of thinking about decisions where what you choose is evidence about what other people in the same kind of situation choose, even when nothing you ever do reaches them. so two people who can never meet, never signal, can't affect each other at all might still sort of cooperate, because me picking the friendly option is a sign that the other one picked it too. on a small scale thats just a curiosity. but if the world is genuinely big - trillions of galaxies, other civilisations out there, or even just loads of agents that reason the way I do - then there are an enormous number of those unreachable agents, and the payoffs from all of them add up. and the strange bit is that this can mean the biggest thing riding on a decision I make in my kitchen is what some beings I can never meet end up doing, while what they do is tied to what I do in the evidence sense and not in any physical sense. I think theres something there but I also think theres a way of stating it that makes it sound like obvious nonsense, and I cant yet tell which bits are doing the work.

  I want them to actually get it and not just nod along. so plan the session for me, don't just explain the idea at me. what has to be in place before the rest makes sense, what order the pieces have to go in and why each one waits on the one before, and which single example should carry the whole thing - and what that example needs to have and what it needs to not have (I was going to use two people in sealed rooms who both know the other is working it out the same way, but I'm not sure that one scales or that it doesnt smuggle in something). then the wrong turns they'll take: my guess is they'll say this is just magic, or that correlation isn't a real connection, or that it makes everything depend on everything so it says nothing, or they'll mix it up with predicting your own choice in advance. tell me the order those actually come up in and exactly where in the sequence I should cut each one off. also say what I should tell them I'm not going to get into at this level and why, and give me one question to ask at the end that tells me whether it landed or whether they just followed the story. and if I've definately got part of the idea itself muddled, say which part, because I'd rather fix my framing before I inflict it on them.
