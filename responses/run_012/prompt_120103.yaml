answer: |-
  Good evening, everyone. For those who don't know me, I'm a friend of Annie's, which apparently qualified me to stand up here while you're all trying to digest the hotel's chicken. I know this room isn't exactly the Palace of Versailles, but then, Annie's career wasn't about Versailles. It was about the places where the light is a bit dimmer, the dust is a bit thicker, and the truth is a bit harder to pin down.

  Forty years is a long time to spend in any profession, but in history, it's a lifetime. And looking around this room, I realize we have a bit of a family reunion on our hands. On one side, we have the generation who taught Annie that the archive is sacred. You believe that if you scrape away the bias, the rhetoric, and the memory, you can find out what actually happened. You believe Ranke was right to aim for things "as they actually were." And on the other side, we have the students and the younger faculty, who know that the archive doesn't speak for itself. You know that the questions we ask determine the answers we get, and that every history is a construction.

  I know these two camps can irritate each other. I know that to the old guard, talk of "constructing" the past sounds like a confession that you're making it up. And I know that to the younger scholars, insisting on pure objectivity sounds like naivety about power and narrative. Annie has spent forty years standing right in the crossfire of that argument. But she never fired a shot. In fact, I don't believe she has ever once said the word "discourse" out loud. She found a better way.

  We need to talk about her last book, the one on the provincial tax revolt of the 1840s. Many of you know the story, but it bears repeating because it proves her point. There was a specific ledger from 1843, the Michaelmas accounts. The official record stated the tax was collected on the 14th of September. But Annie found the counterfoil in a different box, in a different archive, showing the money moved on the 12th. Two days doesn't sound like much, but those two days proved the magistrate had backdated the collection to avoid scrutiny during a riot.

  Now, to the archivists in the room: that date is not a narrative. It is not a construction. It is either the 12th or the 14th. The paper pushes back. You can't deconstruct the ink. Annie knows this better than anyone. She knows that there are moments where the past refuses to be anything other than what it was. That is the grain of truth you protect, and she honors that rigor.

  But here is where she brings the rest of us in. Knowing the date was the 12th didn't explain *why* the revolt happened. Was it hunger? Was it politics? Was it a breakdown of authority? The ledger couldn't tell us that. The fine grain gave us the truth of the date, but the broad picture required a story. This is what Annie calls "granular objectivity."

  Her argument is that objectivity isn't a switch you flip on or off for a whole book. It's a gradient. The finer the claim, the more the evidence can push back. "The garrison had three thousand men" can be true or false in a robust sense. "The decade was a tragedy" is something the sources can constrain, but never settle. She isn't compromising. She's saying that both sides of this room are making the same mistake. The old guard expects global objectivity where it can't exist, and the new guard sometimes assumes local objectivity doesn't exist at all.

  Annie's work shows us that the friction between these two positions isn't a sign that the discipline is broken. It's the engine. If the evidence didn't push back, we'd be writing fiction. If the story didn't matter, we'd be writing spreadsheets. We need the archivists to keep us honest on the dates, and we need the theorists to keep us honest on the meanings.

  So, as she retires, she isn't leaving us with a solution that ends the debate. She's leaving us with a method that keeps the debate productive. She's telling us that we can acknowledge the shape of our stories without surrendering the truth of our sources.

  Annie, you've spent forty years showing us that you can hold both things in your head at once: the hard fact of the ledger and the soft truth of the story. You've shown us that the tension isn't something to resolve, but something to inhabit. That is how we keep the past alive.

  Would you all please raise your glasses. To Annie: may your retirement be free of footnotes, but never free of the truth. To Annie.
