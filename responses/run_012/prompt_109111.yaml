answer: |-
  # JOINT STATEMENT ON THE STATUS OF THE FRAME PROBLEM
  **Parties:** [Friend] (Historical/Engineering View) and [User] (Philosophical/Cognitive View)
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on the Definition, Status, and Solvability of the Frame Problem

  ## I. AGREED CLAIMS
  *We both sign the following propositions. These establish the boundary conditions of our disagreement.*

  1.  **Historical Origin:** The term "Frame Problem" originated in 1969 (McCarthy & Hayes) as a specific technical difficulty in symbolic logic: how to represent the effects of actions without explicitly axiomatizing all *non*-effects (e.g., moving a chair does not change the wall's color).
  2.  **Technical Resolution (Narrow):** For classical symbolic planners operating in bounded, fully observable domains, this representational difficulty is considered solved via successor state axioms, situation calculus, and nonmonotonic logics (e.g., circumscription). Hand-coding frame axioms is no longer standard practice.
  3.  **Expansion of Scope:** The term was subsequently expanded (notably by Dennett and Fodor) to refer to a broader computational/epistemic problem: how an agent with finite resources determines which of the indefinitely many available facts are *relevant* to a current decision without exhaustively checking them all.
  4.  **Modern Architecture:** Contemporary AI systems (Deep RL, Transformers) do not use explicit symbolic state representations in the 1969 sense. They encode state implicitly in latent vectors or attention weights.
  5.  **Failure Mode:** Both parties agree that modern systems exhibit failures where they attend to irrelevant features (e.g., background textures) or fail to update beliefs about unchanged features when out-of-distribution (OOD). We disagree on whether labeling this "The Frame Problem" is useful or accurate.

  ---

  ## II. DISAGREEMENTS TABLE
  *Each row identifies a specific crux. "Her Position" reflects the Historical/Engineering view. "My Position" reflects the Philosophical/Cognitive view. We specify a concrete test case and divergent predictions for each.*

  | Crux | Her Position (Historical/Engineering) | My Position (Philosophical/Cognitive) | Concrete Test Case | Her Prediction | My Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Identity**<br>*(Same problem or stretched word?)* | The narrow (logical) and broad (relevance) problems are distinct. The narrow one is "The Frame Problem." The broad one is "The Relevance Problem." Conflating them obscures progress. | The narrow problem is a trivial sub-case of the broad problem. Solving the logic without solving the relevance bound is not solving *The* Frame Problem. | **Task:** A symbolic planner vs. a neural net in a blocks world where irrelevant objects change color randomly. | The symbolic planner solves *The Frame Problem* because it correctly infers block positions remain unchanged. | The symbolic planner fails *The Frame Problem* if it wastes compute checking the color changes, or if a human had to pre-define that color is irrelevant. |
  | **2. Relocation**<br>*(Solved or hidden?)* | If a system performs robustly within its operational envelope, the problem is solved for engineering purposes. Where the knowledge came from (data vs. axioms) is an implementation detail. | If the relevance boundary is determined by training data distribution or human feature engineering, the problem is not solved; it is relocated to the data curator or the loss function. | **Task:** Train a robot to grasp cups. Test on cups with new, irrelevant stickers. | If the robot grasps the cup, the system handled relevance. The training data covered the variance. | If the robot fails, it proves the system didn't learn "stickers are irrelevant," it learned "training-distribution textures are safe." The relevance rule wasn't internalized. |
  | **3. Architecture**<br>*(Symbols vs. Nets)* | Replacing symbolic planners with neural networks dissolves the Frame Problem. Without explicit symbols, there is no need for frame axioms. Attention mechanisms handle relevance dynamically. | Neural networks do not dissolve the problem; they obscure the mechanism. Attention weights are just soft, probabilistic frame axioms. They remain brittle OOD. | **Task:** Prompt an LLM with a logic puzzle containing irrelevant, contradictory distractors inserted mid-text. | The attention mechanism will down-weight the distractors. This is a solved relevance mechanism. | The LLM will fail if the distractors are adversarially placed. This proves relevance is not solved, it is statistically approximated. |
  | **4. Observability**<br>*(Is there a difference between solved and unsolved?)* | A system has "solved" the frame problem if it achieves goal states without explicit frame axioms. Success is observable in task completion. | A system has "solved" the frame problem if it achieves goal states with *sample efficiency* comparable to humans when irrelevant variables change. Success is observable in robustness. | **Task:** Measure sample count to re-learn a task when one irrelevant environmental rule changes (e.g., gravity direction vs. wall color). | Sample efficiency is a generalization metric, not a Frame metric. Task completion is the only binary pass/fail. | If sample complexity spikes when irrelevant vars change, the system lacks a frame mechanism. It is checking everything. |

  ---

  ## III. META-ANALYSIS: SEMANTIC VS. SUBSTANTIVE

  **1. Is this just a verbal dispute?**
  Partially. We agree on the history: the 1969 definition was narrow and largely resolved in symbolic AI. We agree on the phenomenon: modern systems struggle with relevance bounding and OOD robustness.
  *   **The Verbal Disagreement:** Whether the label "Frame Problem" applies to the modern relevance bottleneck. She argues for terminological precision (keep "Frame" for logic, use "Relevance" for cognition). I argue for conceptual continuity (the logic issue was just the first visible symptom of the relevance disease).
  *   **The Substantive Residue:** Even if we rename my concern "The Relevance Problem," the disagreement remains: **Is relevance bounding a solved engineering constraint in modern ML, or is it the primary bottleneck preventing AGI?** She claims current attention/RL mechanisms are sufficient solutions. I claim they are brittle approximations that hide the cost in data rather than architecture.

  **2. Is the User (Me) moving the goalposts?**
  **Honest Assessment:** Yes, but defensibly.
  *   **Concession:** I am using a definition of "Frame Problem" that differs from the standard technical definition in AI textbooks (which align with Her). If I insist the 1969 problem is unsolved, I am factually incorrect regarding successor state axioms.
  *   **Defense:** The move is defensible if the *underlying constraint* (computational intractability of relevance) remains the same, even if the representation changed. If I can show that neural nets fail on the *same structural cases* (sensitivity to irrelevant perturbations) that motivated the original Frame Problem, then the "goalpost move" is actually a valid generalization.
  *   **Criterion for Validity:** My position holds only if I can demonstrate that neural nets fail in ways isomorphic to the symbolic frame failure (i.e., inability to ignore irrelevant change without explicit training). If neural nets fail for *different* reasons (e.g., gradient vanishing), then I am indeed just stretching the word to mean "AI is hard."

  **3. The Observable Difference (The "Shut Up and Calculate" Test)**
  We agree that a debate without observable consequences is metaphysics. The observable difference between a system that has "solved" relevance and one that hasn't is **Sample Efficiency under Irrelevant Variation.**
  *   **Solved:** System encounters a change in an irrelevant variable (wall color, background noise). Performance does not degrade. No retraining required.
  *   **Unsolved:** System encounters a change in an irrelevant variable. Performance degrades, requiring gradient updates or fine-tuning to re-learn that the variable is irrelevant.
  *   **Current State:** Modern systems are largely "Unsolved" by this metric. They require massive data to learn invariance that humans grasp instantly. This supports my claim that the problem is relocated (to the data), not solved (in the architecture).

  ## IV. CONCLUSION
  We disagree on the label, but we agree on the failure mode. She views the failure mode as a standard generalization error inherent to statistical learning. I view the failure mode as the modern manifestation of the Frame Problem.

  **Actionable Next Step:** We will jointly evaluate a specific vision-language model on a "distractor robustness" benchmark (e.g., varying background semantics while holding task objects constant).
  *   If performance holds constant: Evidence supports Her (relevance is handled).
  *   If performance degrades significantly: Evidence supports Me (relevance is not internalized).
  *   If performance degrades but recovers with minimal fine-tuning: Ambiguous (requires analyzing *what* was updated).
