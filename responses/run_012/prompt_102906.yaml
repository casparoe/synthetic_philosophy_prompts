answer: |-
  You have stumbled, at 2am, upon the very engine room of the philosophy of science. What you are feeling is the friction between *underdetermination* (the data never quite forces one theory) and *inference to the best explanation* (our stubborn intuition that some theories are plainly better).

  You are asking for a principle that reconciles your gut verdicts. Most philosophers would tell you that your verdicts in (2) and (4) are contradictory: if evidence doesn't decide, they are on a par. But your instinct that they are *not* on a par is the correct one for working science. To save that instinct, we must move beyond a simple tally of data points.

  Here is the principle that binds your five cases. It is a refinement of what John Worrall and Deborah Mayo have argued in different ways, distilled for your purpose.

  ### The Principle of Independent Constraint

  **Statement:**
  > *Rational confidence in a theory is determined not solely by its fit to the target data, but by the degree to which its constituent assumptions are constrained by evidence independent of that target.*

  In plain English: A theory wins when it survives a test it didn't rig for itself. It gains credibility when its moving parts are bolted down by evidence from elsewhere.

  ### The Case for Each Clause

  Here is how the Principle of Independent Constraint handles your five scenarios.

  **(1) The Climate Models**
  *   **Your Verdict:** The model respecting lab microphysics is more credible, despite identical temperature fits.
  *   **The Principle:** The temperature record is the *target data*. The lab microphysics is *independent evidence*. Model A is constrained by the lab work; Model B is not (or violates it). Model A has more "anchors" outside the specific phenomenon it is predicting. Therefore, it warrants higher confidence.
  *   **Result:** Fits perfectly.

  **(2) The Orbital Anomaly (Vulcan vs. Newton)**
  *   **Your Verdict:** Observations at the time didn't decide; this is a fact about the evidence then.
  *   **The Principle:** At that historical moment, neither the unseen planet nor the tweaked law possessed independent constraint. The planet was unseen; the tweak was devised solely for the orbit. Neither had anchors elsewhere.
  *   **Result:** Fits perfectly. The principle dictates suspension of judgement, which matches your instinct that the *evidence* was the limiting factor.

  **(3) The Undetectable Transformation**
  *   **Your Verdict:** No evidence could ever decide; a different kind of tie.
  *   **The Principle:** If two formulations are related by a transformation that is undetectable *in principle*, they share exactly the same independent constraints. They are empirically equivalent forever. However, the principle distinguishes this from (2) because in (2) independent constraint *might* arrive later (we might find Vulcan), whereas in (3) it is structurally impossible.
  *   **Result:** Fits. It classifies this as a semantic or representational tie, not a scientific rivalry.

  **(4) The Extra Field**
  *   **Your Verdict:** Evidence doesn't decide, but they aren't on a par (Incumbent wins).
  *   **The Principle:** This is the crux. The rival theory fits the data, but the "extra field" is *ad hoc*. It has no independent constraint; it was invented solely to save the phenomena. The incumbent theory's fields are anchored in other experiments. The principle says the rival is less credible not because it fits the data worse, but because it lacks independent anchors.
  *   **Result:** Fits. It explains why (2) and (4) feel different: in (2) both sides lacked anchors; in (4) only one side does.

  **(5) Prediction vs. Accommodation**
  *   **Your Verdict:** The predictor is better supported, though the evidence is the same.
  *   **The Principle:** This is the hardest case (known as the "Use-Novelty" problem). The accommodator tuned its parameters *to* the data; the predictor set its parameters *before* the data. The predictor's parameters were constrained by prior theory or independent calibration. The accommodator's were constrained by the target data itself. Thus, the predictor survived a riskier test.
  *   **Result:** Fits, but with a caveat (see below).

  ### The New Case: Empirical Equivalence and Simplicity

  You asked for a prediction on a case you haven't listed: *Two theories are empirically equivalent given everything we could ever measure, but one is quite a lot simpler.*

  **The Prediction:**
  The Principle of Independent Constraint predicts that scientists will **accept** the simpler theory for the purpose of calculation and modelling, but cannot claim it is **truer** on evidential grounds.

  Why? Because simplicity, in this specific instance, is not an *independent constraint*; it is a pragmatic virtue. If there is no possible measurement to distinguish them, there is no independent evidence to anchor the simpler ontology over the complex one. The principle forces you to admit that choosing the simpler theory is a wager on nature's economy, not a conclusion drawn from evidence. You file it under "instrumental preference," not "confirmed truth."

  ### The Sacrifice

  You asked me to be honest about which of your verdicts must go. I suspect you will not like this, but the principle demands a concession on **(5)**.

  Your intuition is that the predictor is "better supported." The Principle of Independent Constraint agrees that the predictor is *more reliable*, but it forces you to admit that **no additional evidence supports it.**

  If the evidence is stipulated to be identical, then the *confirmation* is identical. The advantage of the predictor is not that the data supports it more, but that the *method* that produced it is less prone to overfitting. You must surrender the idea that the predictor has more *evidential weight* and accept instead that it has more *methodological warrant*.

  This is a subtle distinction, but it is vital for your piece. It means that in case (5), the scientist is not responding to the world differently, but trusting the *process* differently. If you insist that the data *itself* supports the predictor more, you violate the logic of confirmation. You must argue that the *history of construction* is part of the evidence. Many philosophers (the strict Bayesians) will fight you on this.

  ### Summary for your Piece

  If you need a pull-quote for the article, try this:

  > "Science does not choose the theory that fits the data best. It chooses the theory that risks the most failure on grounds independent of that data."

  This captures why the climate model with the lab physics wins (it risks violating the lab), why the *ad hoc* field loses (it risks nothing), and why the prediction beats the accommodation (it risked being wrong before the data arrived).

  It won't solve every problem—philosophy never does—but it will keep you out of trouble at 2am. It suggests that scientific rationality isn't about the snapshot of data you have now; it's about the web of constraints that hold that data in place.

  Good luck with the filing. Do try to get some sleep before you send it.
