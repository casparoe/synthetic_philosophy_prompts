answer: |-
  ### Desiderata for a Theory of Compounding Rationality

  The following requirements establish the bar for any theory claiming to govern a single agent facing non-ergodic risks, estimated probabilities, and the necessity of consumption.

  **1. The Time-Average Consistency Requirement [Non-Negotiable]**
  *   **Requirement:** The theory must evaluate prospects based on the time-average growth rate of the single agent's trajectory, not the ensemble-average expected value across parallel universes.
  *   **Motivation:** In multiplicative dynamics, the ensemble average (Expected Value) diverges from the time average. A bet with positive EV (e.g., 1.5x/0.6x at even odds) can have a negative geometric mean. An agent living through time experiences the latter; an agent maximizing the former will almost surely go to zero.
  *   **Constraint:** Excludes standard Expected Value maximization and any utility theory that does not internalize the dynamic constraint of compounding.

  **2. The Ruin Absorption Requirement [Non-Negotiable]**
  *   **Requirement:** The theory must treat wealth = 0 as an absorbing state from which recovery is impossible, assigning it a disutility or probability weight that precludes strategies risking certain ruin.
  *   **Motivation:** Compounding requires a non-zero base. Once wealth hits zero, the geometric growth rate becomes undefined or negative infinity. Rationality in a compounding context is primarily about survival.
  *   **Constraint:** Excludes linear utility functions and strategies that risk a finite probability of total loss for unbounded gain (e.g., naive Martingales).

  **3. The Finite-Horizon Sensitivity Requirement [Non-Negotiable]**
  *   **Requirement:** The theory must yield determinate prescriptions for finite decision horizons without deferring justification solely to asymptotic limits ($t \to \infty$).
  *   **Motivation:** Agents have finite lifespans and consumption needs. A strategy that is optimal almost surely in the limit may expose the agent to unacceptable volatility or ruin in the short run.
  *   **Constraint:** Excludes theories that rely exclusively on asymptotic dominance (e.g., "Kelly is optimal in the long run" without short-run bounds).

  **4. The Estimation Robustness Requirement [Non-Negotiable]**
  *   **Requirement:** The theory must penalize overestimation of edge more severely than underestimation.
  *   **Motivation:** In compounding systems, the cost of overstaking (volatility drag leading to ruin) is asymmetric and catastrophic compared to the opportunity cost of understaking (suboptimal growth). Rationality requires a safety margin against epistemic error.
  *   **Constraint:** Excludes "full Kelly" prescriptions when probabilities are estimated rather than known, demanding a fractional approach or confidence weighting.

  **5. The Instrumentality Requirement [Camp Commitment]**
  *   **Requirement:** The theory must align with the agent's actual terminal objective, even if that objective is not wealth maximization (e.g., reaching a specific target sum to prevent catastrophe).
  *   **Motivation:** Practical rationality is instrumental. If an agent faces a negative-drift game but *must* reach a target to survive, maximizing growth (which implies not playing or betting minimally) is instrumentally irrational compared to "bold play."
  *   **Constraint:** This is a commitment of *practical* rationality camps against *pure* growth-optimization camps. It forces the theory to admit that growth maximization is a means, not an end.

  **6. The Log-Wealth vs. Growth Rate Distinction [Non-Negotiable]**
  *   **Requirement:** The theory must explicitly distinguish between maximizing expected logarithmic utility (a subjective preference ordering) and maximizing the objective time-average growth rate (a physical dynamic).
  *   **Motivation:** Conflating the two obscures the justification. If the rationale is ergodicity breaking, it is a physical constraint, not a psychological risk aversion. Sliding between them allows theories to borrow rigor from dynamics while claiming the flexibility of preference.
  *   **Constraint:** Excludes justifications that treat Log-Utility as merely one risk profile among many without acknowledging its unique relationship to geometric growth.

  ***

  ### The Incompatibilities

  No theory can jointly satisfy the following subset of requirements in all cases:

  1.  **Maximize Long-Term Growth Rate** (Kelly Criterion).
  2.  **Maximize Probability of Reaching a Fixed Target** in a Negative-Expectation Game.
  3.  **Avoid Ruin** (Maintain non-zero wealth with probability 1).

  **The Conflict:** In an unfavorable game (negative drift), the growth-optimal strategy is to refrain from betting or to short. If the agent is compelled to play to reach a target (Instrumentality Requirement), they must adopt a "bold play" strategy (betting large fractions). This increases the probability of reaching the target *or* hitting ruin, thereby violating the **Ruin Absorption Requirement** (by increasing ruin risk) and the **Growth Rate Requirement** (by reducing geometric mean). A theory of *universal* growth-rate maximization cannot accommodate the rationality of bold play in losing games, yet practical rationality often demands it.

  ***

  ### The Exclusionary Requirement

  The single requirement that does the most to exclude candidate theories is **The Time-Average Consistency Requirement**.

  It immediately disqualifies Expected Value maximization (the dominant paradigm in economics and decision theory) and any Expected Utility framework that does not structurally mirror the geometric nature of compounding. It forces the abandonment of linearity in expectation, which is the foundational axiom of most competing rationality theories.

  ***

  ### Evaluation of Three Approaches

  **1. Expected Utility Maximization (Logarithmic Utility)**
  *   **Performance:** Satisfies **Ruin Absorption** and **Estimation Robustness** (via risk aversion). It handles the **One-Shot** case well (1.5x/0.6x is rejected).
  *   **Failure:** It struggles with the **Log-Wealth vs. Growth Rate Distinction**. It justifies Kelly betting as a subjective preference rather than an objective dynamic constraint, making it vulnerable to the charge that a risk-neutral agent *could* rationally choose otherwise. It also often fails **Finite-Horizon Sensitivity**, as standard EU does not inherently prioritize time-path survival over end-state distribution.

  **2. Asymptotic Growth-Rate Criterion (Pure Kelly)**
  *   **Performance:** Perfectly satisfies **Time-Average Consistency** and **Ruin Absorption** (averts almost-sure ruin). It correctly handles the **Repeated Wager** (ensemble vs. trajectory).
  *   **Failure:** It fails the **Instrumentality Requirement**. In the **Target/Ruin** case (unfavorable game), it prescribes inaction or minimal betting, which is irrational if the agent's goal is survival via a specific target. It also struggles with **Finite-Horizon Sensitivity**, as its optimality proofs rely on $t \to \infty$, offering weak guidance for short-run consumption needs.

  **3. Goal-Reaching Probability (Bold Play)**
  *   **Performance:** Satisfies the **Instrumentality Requirement** for specific targets. In unfavorable games, it correctly identifies that high variance is necessary to overcome negative drift.
  *   **Failure:** It violates **Ruin Absorption** and **Time-Average Consistency**. It sacrifices long-term geometric growth and increases the probability of absorption at zero to chase a specific outcome. It cannot serve as a general norm for wealth management, only as a specific tactic for desperate, goal-constrained scenarios.
