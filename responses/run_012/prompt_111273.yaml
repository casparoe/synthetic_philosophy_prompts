answer: |-
  The principle that fits your cases is not about *when* you write the rule down, but about *what determines the stop*. Your hunch ("Brought Bar" vs. "Found Bar") is close, but it fails because a rule can be written down in advance and still be corrupt (the Researcher), or decided in the moment and still be valid (the Partner).

  The underlying principle is **The Principle of Stable Intrinsic Sufficiency**.

  A decision to stop searching is justified if and only if it satisfies these three clauses:

  **Clause 1: Exogenous Stability**
  The threshold for acceptance must be determined by the *needs of the chooser* or the *requirements of the task*, and must remain stable regardless of the *difficulty of the search* or the *fatigue of the searcher*. The standard cannot be lowered because options are scarce or the process is painful.
  *   **Motivated by:** The **Hiring Manager (Bad)** and the **Committee**. In both, the standard degraded because the search was hard (mediocre candidates, meeting fatigue). It also condemns the **Friend (New City)** because "decent" was too vague to resist the pressure of a new environment.
  *   **Exonerates:** The **Hiring Manager (Good)** and **Friend (Known City)**. Their bars were set by budget/needs, not by how hard the hunt was.

  **Clause 2: Intrinsic Fit**
  The stopping condition must measure the option's actual capacity to satisfy the goal, not merely its *relative rank* among options seen so far. You must stop because the option is *good*, not because it is *better than the last one*.
  *   **Motivated by:** The **37% Rule**. This rule gives you "the willies" because it selects for relative superiority, not intrinsic quality. You could end up with a terrible option just because the first 37% were worse.
  *   **Exonerates:** The **Partner Case**. She stopped because "this one was enough" (intrinsic fit), not because he was the best available by age 34.

  **Clause 3: Metric Validity**
  If the stopping rule relies on a formal metric or signal, the act of stopping must not invalidate the meaning of that metric. You cannot game the signal to force a positive result.
  *   **Motivated by:** The **Researcher**. Stopping the moment *p* < .05 (optional stopping) mathematically invalidates the *p*-value. The signal is corrupted by the stopping rule itself.
  *   **Exonerates:** The **Doctor**. Stopping a workup when a diagnosis fits a treatable illness does not invalidate the diagnosis; the goal is treatment (pragmatic), not a fixed-sample truth claim (epistemic).

  ***

  ### Which Verdicts You Must Give Up

  This principle forces you to resolve your ambivalence about the **Painter**.

  Currently, you say: *"Some days that's exactly what 'good enough' is for... Other days she's just tired of looking."*
  The Principle of Stable Intrinsic Sufficiency says these are not two sides of the same coin; they are opposite moral categories.
  *   If she stopped because the 9th swatch met her visual standard for the room (Clause 1 & 2), she is **Fine**.
  *   If she stopped because looking at swatches was tedious and she lowered her standard to end the task (Clause 1 violation), she is **Bad**.
  You cannot hold both verdicts simultaneously. The principle demands you judge the *source* of the stop, not just the outcome.

  Additionally, while not a verdict, you must abandon your **Hunch** ("Brought Bar" vs. "Found Bar"). As you noted, your hunch condemns the Partner (who didn't necessarily write down a rule) and excuses the Researcher (who could write down "stop at p<.05" in advance). The principle replaces "Written Down" with "Stable and Intrinsic."

  ***

  ### The Two New Cases

  **1. The Job Search (Worse pay, actually like the job)**
  *   **Verdict:** **Fine.**
  *   **Reasoning:** This satisfies **Clause 2 (Intrinsic Fit)**. The candidate is prioritizing the intrinsic value of the work ("actually like") over an extrinsic metric (pay). As long as the pay meets their minimum survival needs (Clause 1 Stability), stopping for *fit* is valid satisficing. It is not capitulation; it is a re-weighting of values toward intrinsic satisfaction.

  **2. The Agency Policy (First policy clearing threshold by Friday)**
  *   **Verdict:** **Fine.**
  *   **Reasoning:** This satisfies **Clause 1 (Exogenous Stability)** and **Clause 3 (Metric Validity)**. The deadline (Friday) forces the *timing* of the decision, but the *standard* (cost-benefit threshold) remains exogenous and stable. Unlike the **Friend (New City)**, the threshold is specific ("clearing cost-benefit"). Unlike the **Researcher**, clearing a cost-benefit threshold is not statistically invalidated by stopping early; it is a pragmatic gate. As long as the threshold wasn't lowered *because* it was Friday, the deadline is a procedural constraint, not a corruption of the standard.
