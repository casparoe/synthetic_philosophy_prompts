  5.  **Drafting the Rules & Materials:**

      *   **Materials:** Paper slips, pens, bag of 100 numbered chips (Lottery), 10 Dice (Preface), Tokens (chips/candy).
      *   **Round 1 (Lottery):** Bag has 100 chips, 1 Red (Winner), 99 Blue (Losers). Students pick numbers 1-100 they believe are Blue.
      *   **Round 2 (Preface):** 10 Dice rolls (hidden). Students predict "Not 6" for each die.
      *   **Round 3 (Collective):** Class agrees on a list.
      *   **Variant:** Sign "At least one is false."

  6.  **Developing the Timeline (90 mins):**

      *   0-10: Setup & Rules.
      *   10-30: Round 1 (Lottery).
      *   30-50: Round 2 (Preface).
      *   50-60: Round 3/Variant (Optional/Quick).
      *   60-90: Debrief (Crucial).

  7.  **Addressing the "Escapes":**

      *   *Escape:* Writing "1+1=2" repeatedly.
      *   *Counter:* Claims must be about the *randomized outcome* (the bag or the dice).
      *   *Escape:* Correlated claims.
      *   *Counter:* Rules specify distinct tickets/dice.
      *   *Escape:* Refusing to sign.
      *   *Counter:* Make the Bonus highly desirable (e.g., leave class 5 mins early, or extra credit token).

  8.  **Debrief Mapping:**

      *   Round 1 -> Lottery Paradox (Logical Inconsistency).
      *   Round 2 -> Preface Paradox (Probabilistic Inconsistency).
      *   Signing -> Endorsement/Closure.
      *   Scoring -> Norms of Informativeness.

  9.  **Troubleshooting:**

      *   *Problem:* Students game the system by writing nothing.
      *   *Fix:* Minimum claim requirement to qualify for Bonus.
      *   *Problem:* Students don't feel the tension.
      *   *Fix:* Emphasize the "Rationality" of each individual claim during play.
      *   *Problem:* Time overrun.
      *   *Fix:* Strict cutoffs.

  10. **50-Minute Adaptation:**

      *   Cut Round 3.
      *   Shorten Debrief (focus on the collision, less on solutions).
      *   Combine setup.

  11. **Refining the "Limitations":**

      *   The game simulates the *structure*, but not the *phenomenology* of belief. Students are playing for tokens, not genuinely believing. I need to explicitly state this in the "Limitations" section.

  12. **Final Review against Constraints:**

      *   *No tech?* Yes.
      *   *Fake stakes?* Yes (tokens/privileges).
      *   *Informativeness scored?* Yes (points per claim).
      *   *Control number of claims?* Yes.
      *   *Endorse conjunction?* Yes (Signed Affidavit).
      *   *Two structures?* Yes (Bag vs. Dice).
      *   *Anticipate escapes?* Yes (Rules on claim content).
      *   *Optional 3rd/Variant?* Included.
      *   *Debrief mapping?* Detailed.
      *   *Troubleshooting?* Included.
      *   *50-min cut?* Included.

  13. **Self-Correction on Payoff:**
      *   I need to make sure the "Conjunction Affidavit" is the key.
      *   If they don't sign, they get base points.
      *   If they sign, they get Base + Bonus *only if* all true.
      *   *Wait, if they sign and one is false, do they lose everything?*
      *   If the penalty is too harsh, they won't sign.
      *   If the penalty is too soft, no paradox.
      *   *Idea:* The paradox isn't in the *loss*, it's in the *commitment*.
      *   *Adjustment:* The exercise works best if they *want* to sign because each claim is "believable" (>95% chance), but the conjunction is "unbelievable."
      *   *Instruction:* Tell them: "You are rational to accept any claim with >90% probability. You are rational to accept the conjunction of your beliefs. Maximize your tokens."
      *   *Actually, don't tell them the norms.* Let them choose.
      *   *Better:* The "Bonus" is for *Consistency*. If you sign, you assert consistency.
      *   *Let's stick to the Prompt:* "Payoff has to reward claims that survive... so blanket suspension is a losing strategy."
      *   *Okay:* 1 Token per True Claim. 0 for False. **BUT**, to cash out tokens, you must sign the "Verification Oath" (All claims are true). If you lie (sign when false), you lose all tokens (honor system + teacher verification).
      *   *This creates the tension:* To get the tokens you earned, you must swear they are all true. In Round 1, you *know* one is false. In Round 2, you *suspect* one is false.

      *   *Wait, one more check:* "The number of claims must be under the students' control... induced to raise the count until whatever threshold rule they have adopted cracks."
