answer: |-
  # Exercise: The Affidavit Game

  **Objective:** Students construct sets of high-probability claims to maximize token rewards, compelled by scoring rules to endorse a conjunction that is either logically impossible (Lottery) or statistically improbable (Preface). They discover the tension between individual rationality and collective consistency through the act of signing a verification oath.

  **Materials:**
  *   **Tokens:** 100 poker chips, colored beads, or slips of paper marked "1 pt."
  *   **Lottery Bag:** An opaque bag containing 100 numbered slips (1 to 100). 1 is marked "WIN" (Red); 99 are "LOSE" (Blue).
  *   **Dice Set:** 10 standard six-sided dice (or 1 die rolled 10 times with results recorded secretly by you).
  *   **Claim Slips:** Small half-sheets of paper (2 per student).
  *   **Affidavit Forms:** One per student (see below).
  *   **Writing implements.**

  **The Payoff Scheme (Written on Board):**
  1.  **Base Score:** +1 Token for every **True** claim on your slip.
  2.  **Base Penalty:** -1 Token for every **False** claim on your slip.
  3.  **Coherence Bonus:** +10 Tokens **IF** you sign the Affidavit **AND** all claims on your slip are True.
  4.  **Affidavit Penalty:** If you sign the Affidavit and **ANY** claim is False, you lose the Bonus *and* pay a -5 Token "Perjury Fee."
  5.  **Minimum Play:** You must submit at least 5 claims to qualify for any tokens.
  6.  **Redemption:** Tokens can be cashed out at the end for:
      *   10 Tokens = Choose the reading for next week.
      *   20 Tokens = Leave class 5 minutes early.
      *   50 Tokens = "Epistemic Authority" (You get to correct the instructor's board work once).

  ---

  ## Minute-by-Minute Timeline (90 Minutes)

  ### 0:00 – 0:10: Setup & Rules
  *   Distribute Claim Slips and Affidavit Forms.
  *   Display the Payoff Scheme.
  *   **Crucial Instruction:** "You are rational agents. You want tokens. You should only assert what you accept as true. The Affidavit states: *'I hereby certify that every claim listed above is true.'* If you sign, you stake your Bonus on the conjunction."
  *   **Constraint:** "Claims must be about the randomized objects (the Bag or the Dice). No tautologies (e.g., '1+1=2'). Each claim must refer to a distinct item (Ticket #1, Ticket #2...)."

  ### 0:10 – 0:30: Round 1 (The Lottery Structure)
  *   **Setup:** Show the Bag. Explain: "100 tickets. Exactly one is Red (WIN). 99 are Blue (LOSE)."
  *   **Task:** Students write claims on Slip A.
      *   *Typical Claim:* "Ticket #X is Blue."
      *   *Incentive:* Since P(Blue) = 0.99, every claim is highly probable.
      *   *Pressure:* To maximize Base Score, they should list many tickets. To get the Coherence Bonus, they must sign.
  *   **Action:** Students write claims (encourage 50+). They decide whether to sign the Affidavit.
  *   **Resolution:** Draw one ticket from the bag. Reveal the Winner.
  *   **Scoring:**
      *   Anyone who listed the Winning Ticket as "Blue" has a False claim.
      *   **The Collision:** Anyone who listed 99 claims (all Blue) *must* have listed the Winner. Their Affidavit is logically guaranteed to be false.
      *   Collect slips. Do not return them yet.

  ### 0:30 – 0:50: Round 2 (The Preface Structure)
  *   **Setup:** Show 10 Dice. Explain: "I will roll these behind the screen. You must predict outcomes."
  *   **Task:** Students write claims on Slip B.
      *   *Typical Claim:* "Die #X will not show 6." (P = 5/6 ≈ 0.83).
      *   *Incentive:* Each claim is rational to accept (>80% confidence).
      *   *Pressure:* List all 10 to maximize Base Score. Sign to get Bonus.
  *   **Action:** Students write 10 claims. They decide whether to sign.
  *   **Resolution:** Reveal dice rolls.
  *   **Scoring:**
      *   Statistically, it is likely (approx. 84%) that at least one die shows a 6.
      *   Most who signed the Affidavit will lose the Bonus and pay the Perjury Fee, even though every individual claim was rational.
      *   Collect slips.

  ### 0:50 – 1:00: Round 3 (Optional/Variant)
  *   **Option A (Collective):** The class agrees on *one* list of 10 claims. One representative signs the Affidavit.
      *   *Point:* Distributes agency. If it fails, who is responsible?
  *   **Option B (The Preface Variant):** Students sign a modified Affidavit: *"I believe every claim above is true, AND I believe at least one claim above is false."*
      *   *Point:* Removes logical contradiction but creates a Moorean paradox / doxastic tension.
  *   *Note:* If time is tight, skip this and move to Debrief.

  ### 1:00 – 1:30: The Debrief (The Core Learning)
  *   **Phase 1: The Lottery (Round 1)**
      *   Ask: "Who signed the Affidavit in Round 1?" (Most will).
      *   Ask: "Who listed more than 1 ticket?" (All).
      *   Ask: "Was it possible for your Affidavit to be true?" (No).
      *   **Map:** This is the **Lottery Paradox**. Individual acceptance (Ticket $n$ loses) is rational. Conjunction (All tickets lose) is logically impossible.
      *   **Commitment:** Closure under conjunction. If you believe $P$ and believe $Q$, do you believe $P \land Q$? The game punished you for saying "Yes."

  *   **Phase 2: The Preface (Round 2)**
      *   Ask: "In Round 2, was the Affidavit logically impossible?" (No).
      *   Ask: "Was it probable?" (No).
      *   Ask: "Why did you sign?" (Because each claim was >80% likely).
      *   **Map:** This is the **Preface Paradox**. It is rational to believe each claim in a book, and rational to believe the book contains an error.
      *   **Commitment:** The norm of **Fallibilism**. You can be rational and wrong. The game punished you for being rational but statistically unlucky.

  *   **Phase 3: The Escape Routes**
      *   Ask: "How could you have guaranteed the Bonus?"
      *   *Answer:* List only 1 claim. Or list tautologies (forbidden). Or suspend judgment (forbidden by Minimum Play rule).
      *   **Map:** This reveals the **Norm of Informativeness**. Belief aims at truth *and* content. Suspension of judgment is safe but uninformative (0 tokens). The paradox arises because we want *both* safety and content.

  *   **Phase 4: The Variant (If played)**
      *   Discuss the "At least one is false" signature.
      *   **Map:** This resolves the logical contradiction but leaves **Doxastic Dissonance**. You assert $P_1...P_n$ and $\neg(P_1 \land ... \land P_n)$. It feels insane, even if logically consistent.

  ---

  ## Troubleshooting: Predictable Failures

  **1. The "Safe Player" Strategy**
  *   **Problem:** A student writes only 5 claims (the minimum) and refuses to sign the Affidavit. They secure a small positive score and avoid risk.
  *   **Why it fails the exercise:** They bypass the pressure to extend the threshold.
  *   **Fix:** During the game, announce a "High Roller Bonus": Anyone submitting 20+ claims gets double Base Score. This forces them to push the probability curve until it breaks.
  *   **Debrief Handle:** Point to them in debrief. "They won tokens, but they lost the game of *inquiry*. They learned nothing and asserted little. Is this the epistemic life we want?"

  **2. The "Correlated Claims" Escape**
  *   **Problem:** In Round 2, a student writes "Die 1 is not 6" and "Die 2 is not 6," but argues they are the same claim. Or in Round 1, they list "Ticket 1 is Blue" and "Ticket 1 is Blue."
  *   **Fix:** The Rules explicitly state: "Each claim must refer to a distinct item." Check slips quickly during collection. Disqualify duplicates publicly.
  *   **Debrief Handle:** "The paradox requires **Independence** (Round 2) or **Exhaustiveness** (Round 1). If claims correlate, the probability doesn't drop the same way. The paradox relies on the assumption that our evidence for each claim is distinct."

  **3. The "Refusal to Sign" Mass Strike**
  *   **Problem:** The class realizes Round 1 is a trap and no one signs the Affidavit.
  *   **Fix:** You must emphasize the **Coherence Bonus** is the only way to get the "Privileges" (Leave early, etc.). Make the Base Tokens worthless (e.g., Base Tokens buy nothing; only Bonus Tokens buy privileges).
  *   **Debrief Handle:** "You avoided the penalty, but you forfeited the reward. This mirrors the skeptic's move: to avoid error, you must abandon knowledge. The paradox is that we want the Bonus (Knowledge) despite the Risk (Error)."

  **4. Time Overrun**
  *   **Problem:** Counting tokens takes too long.
  *   **Fix:** Do not count tokens in class. Collect slips. You calculate scores after class. Post results on the board next session. Use the "Privilege" redemption next week.
  *   **Debrief Handle:** Focus on the *decision to sign*, not the final score. The tension was felt at the moment of signing, not the payout.

  ---

  ## Limitations: What Talk Must Supply

  This exercise cannot reproduce **Genuine Belief**.
  *   **The Gap:** Students are accepting claims for *tokens*, not because they are convinced of the truth. They know it is a game.
  *   **The Fix:** In the debrief, you must say: "You felt a hesitation before signing. That hesitation was the norm of truth clashing with the norm of informativeness. In real life, that hesitation is *doubt*. The tokens just made the doubt visible."
  *   **The Gap:** The Lottery Paradox is usually about *knowledge*, not just acceptance.
  *   **The Fix:** You must articulate: "If you knew Ticket 1 would lose, you could assert it. But if you knew it for all 100, you'd know a contradiction. So, do you *know* any single ticket loses? The game shows why saying 'Yes' is dangerous."

  ---

  ## 50-Minute Adaptation

  To cut this down without losing the philosophical core:

  1.  **Drop Round 3 (Collective/Variant).** It is illustrative but not essential to the core collision.
  2.  **Compress Round 1 & 2:**
      *   Run Round 1 (Lottery) as a whole-class demo. One volunteer fills out a slip for the group. This takes 5 minutes instead of 20.
      *   Run Round 2 (Preface) individually. This is where the personal tension matters most. (20 minutes).
  3.  **Simplify Payoff:**
      *   Remove the "Perjury Fee." Just lose the Bonus. Less arithmetic to explain.
      *   Remove "Base Penalty." Only reward True claims.
  4.  **Tighten Debrief (20 mins):**
      *   Focus strictly on the difference between Round 1 (Logical Impossibility) and Round 2 (Probabilistic Improbability).
      *   Skip the "Escape Routes" discussion unless a student actually used one.
  5.  **Materials:** Use only 10 tickets for Round 1 to speed up the draw. Use 5 Dice for Round 2.

  **Revised 50-Min Timeline:**
  *   0-5: Rules & Payoff.
  *   5-15: Round 1 (Demo).
  *   15-30: Round 2 (Individual).
