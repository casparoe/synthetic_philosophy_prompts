prompt: |-
  I teach a 90-minute upper-level epistemology seminar, eighteen students, on the threshold view of belief and the norms of rational acceptance. I want an in-class exercise that makes the lottery paradox and the preface paradox something the students walk into rather than something I announce: they should reach the collision themselves and hear the names only in the debrief. Stakes must be fake — tokens, points, small privileges — and the whole thing should be runnable with paper, a bag of counters, and no technology.

  These pressures have to be built in, because I think the exercise fails without them.

  Informativeness must be scored. If the students can win by believing nothing, they will, and the paradox dissolves. The payoff has to reward claims that survive as well as the proportion of them that are true, so that blanket suspension of judgment is a losing strategy.

  The number of claims must be under the students' control. Give them a reason to add claims — each claim that comes out true adds to the score — so they can be induced to raise the count until whatever threshold rule they have adopted cracks in their hands. I want them to discover for themselves that no fixed threshold short of certainty survives.

  At some point the group must endorse the conjunction. Not a series of questions about whether they believe each item, but one signed statement that the whole list is true, with something riding on it.

  Use two structures, not one. One round should have the claims mutually exclusive and jointly exhaustive; another should have them independent and individually fallible. The debrief must bring out why the two feel the same but fail differently: the first puts the students in flat contradiction with the contents of their own assertions, the second merely sets a very improbable conjunction beside claims that are each individually reasonable.

  Anticipate the escapes. I expect at least one group to make every claim the same claim, or to choose correlated claims, which collapses the puzzle. I want the rules to make that either impossible or instructive, and the debrief to say what the escape reveals about the assumptions the paradoxes need.

  Two things I would like on top of the basic design. First, an optional third round in which the class issues one collective statement rather than individual ones, so that the trouble attaches to what the group has said while each member's own credences remain defensible. Second, a variant in which the statement they sign is that at least one of their claims is false; I want them to see that this is not self-contradictory but breaks something else, and to be able to say precisely what.

  Give me the rules and materials, a minute-by-minute timeline, the payoff scheme in tokens, and a debrief that maps each moment of play onto the specific commitments at issue: belief as credence above a threshold, closure of belief under conjunction, the option of withholding, the option of tolerating inconsistency, and what each costs. Tell me the three or four things that will predictably go wrong the first time I run it and how to handle them, and be frank about one feature of the paradoxes the activity cannot reproduce and that I will have to supply by talking. Also tell me how to cut the whole thing down to a 50-minute session. I do not need readings, citations, or historical background — I need the exercise.
reasoning: |-
  Here's a thinking process that leads to the suggested in-class exercise:

  1.  **Analyze the Request:**

      *   **Context:** 90-minute upper-level epistemology seminar, 18 students.
      *   **Topic:** Threshold view of belief, norms of rational acceptance, Lottery Paradox, Preface Paradox.
      *   **Goal:** Students must *walk into* the paradoxes (discover the collision themselves), not be told upfront. Names revealed only in debrief.
      *   **Constraints:** No technology. Paper, bag of counters (tokens), small privileges/stakes (fake).
      *   **Key Mechanics:**
          *   Informativeness must be scored (can't win by believing nothing).
          *   Payoff rewards true claims + proportion true (encourages adding claims until threshold cracks).
          *   Students control the number of claims.
          *   Must endorse a conjunction (signed statement that *all* are true).
          *   Two Structures:
              1.  Mutually Exclusive & Jointly Exhaustive (MEJE) -> Lottery-style.
              2.  Independent & Fallible -> Preface-style.
          *   Anticipate Escapes: Prevent trivial solutions (e.g., identical claims).
          *   Extras: Optional 3rd Round (Collective Statement), Variant (Sign "At least one is false").
      *   **Deliverables:** Rules, Materials, Timeline (minute-by-minute), Payoff Scheme, Debrief (mapping play to commitments), Troubleshooting (predictable failures), Limitations (what talk must supply), 50-minute adaptation.

  2.  **Deconstruct the Paradoxes for Game Mechanics:**

      *   *Lottery Paradox:* High probability for each ticket losing, but certainty that one wins. If I believe "Ticket $n$ loses" for all $n$, I believe a contradiction (since one must win).
          *   *Game Translation:* MEJE structure. Students pick outcomes. If they believe all their picks are *false* (or true, depending on framing), they run into the logical impossibility that one *must* be true.
          *   *Refinement:* Let's make it about *acceptance*. They accept "Ticket $n$ will not win."
      *   *Preface Paradox:* High probability for each claim in a book, but high probability that at least one error exists.
          *   *Game Translation:* Independent events. Students make many fallible claims. They accept all of them. But they also accept "At least one is false."
      *   *The "Crack":* The scoring system needs to push them to add claims until the conjunction probability drops below their belief threshold, yet they still feel compelled to assert the conjunction.

  3.  **Designing the Game Mechanics:**

      *   **Tokens:** Use poker chips or colored paper squares.
      *   **Scoring:** Need a balance between *Risk* (adding claims) and *Accuracy* (being right).
      *   **The "Belief" Act:** Signing a sheet.
      *   **Round 1 (Lottery/MEJE):**
          *   Setup: A bag with 100 numbered tickets (or simulated via random draw). Only 1 winner.
          *   Task: Students write down numbers they believe will *not* win.
          *   Pressure: You get points for every correct "not winner" you list. You lose points if you list the winner.
          *   The Trap: To maximize points, list 99 numbers. But then you must sign "All these are not winners." But one *must* be a winner.
      *   **Round 2 (Preface/Independent):**
          *   Setup: A series of independent coin flips or die rolls (hidden).
          *   Task: Predict outcomes.
          *   Pressure: Each prediction is likely (e.g., "Die will not show 6" = 5/6 chance).
          *   The Trap: List many. Sign "All are true." Statistically, one will likely fail, but each is rational to believe.
      *   **Round 3 (Collective/Preface Variant):**
          *   Task: Group signs one sheet.
          *   Variant: Sign "At least one of our claims is false."

  4.  **Refining the Payoff (Crucial Step):**

      *   If I just say "Points for truth," they might stop at 1 claim.
      *   I need a *bonus* for volume.
      *   *Scheme:* Base points per true claim. Multiplier for total claims *if* conjunction holds. Penalty for false claim.
      *   *Better Scheme:* "Information Score." Score = (Number of True Claims) - (Penalty for False Claims).
      *   *The Kicker:* A "Consistency Bonus." If *all* claims on your sheet are true, you get double points. This incentivizes the conjunction endorsement.
      *   *Wait, the prompt says:* "Payoff has to reward claims that survive as well as the proportion of them that are true, so that blanket suspension of judgment is a losing strategy."
      *   *Revised Scheme:*
