          *   -5 Tokens per False Claim.
          *   **BUT:** To win the "Grand Prize" (privilege), you must sign the "Conjunction Affidavit." If the Affidavit is false (i.e., any claim is false), you lose the Bonus.
          *   *Actually, to force the paradox:* The scoring must make it rational to add claims up to the threshold, but the *act of signing* forces the contradiction.
