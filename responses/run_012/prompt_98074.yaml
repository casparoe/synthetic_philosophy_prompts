prompt: |-
  I'm a philosopher — ethics, mostly — who's been roped into teaching our department's core mind-and-language seminar, and I need to know whether the gloss on Davidson that our textbook gives is one I can let stand, because I'm not a Davidson guy and I'd rather not correct it in front of grad students if I'm the one who's wrong. The gloss runs roughly like this: 'Davidson's method of radical interpretation starts from the fact that you can't know what a speaker means without already knowing what he believes, or vice versa, so you have to interpret his words and his beliefs at the same time. The only way in is the principle of charity: assume the speaker believes mostly what you believe and reasons the way you do. Charity isn't a courtesy, it's a precondition — a theory of meaning for another person is only possible if you maximize agreement with her. The upshot is that interpretation is circular, and that Davidson thinks genuine disagreement is, strictly speaking, impossible: when we seem to disagree, charity always pushes us to redescribe the other as meaning something slightly different, so we end up agreeing after all.' Sentence by sentence, what would a Davidson person nod at, what would make them wince, and what's just wrong? And does that last claim — that disagreement is impossible — actually follow from anything Davidson holds, or is the gloss overunning the text? My hunch is that last bit is being read off of Rorty rather than Davidson, but I don't trust my hunch enough to say it out loud. Lead with your bottom line in the first sentence, then the reasoning — no throat-clearing, no restating my question back to me.
