              *   If Secret True + No Pay = Letter.
              *   If Secret False + Pay = Letter.
              *   If Secret False + No Pay = No Letter.
              *   *Result:* If you get a letter, either (Secret True + No Pay) or (Secret False + Pay).
              *   *Decision:* If you Pay, you are in (Secret False + Pay). Secret is False. You paid for nothing. If you Don't Pay, you are in (Secret True + No Pay). Secret is True. You suffer.
              *   *Updateless view:* Pre-commit to "Don't Pay if Letter." Then Letter is never sent (because if Secret True, No Pay -> No Letter. If Secret False, No Pay -> No Letter).
          *   *How to simulate this honestly?*
          *   I need two coins. Coin A (Secret). Coin B (Prediction/Targeting).
          *   Actually, since I can't predict perfectly, I will use their Round 1 choice as the "Prediction."
