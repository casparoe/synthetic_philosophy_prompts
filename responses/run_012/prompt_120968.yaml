answer: |-
  # Seminar Activity: The Branch and The Letter
  **Topic:** Counterfactual Mugging & XOR Blackmail  
  **Time:** 90 Minutes  
  **Class Size:** 16 Students  
  **Materials:** Poker chips (or candy), 2 colors of envelopes, printed "Policy Sheets," printed "Threat Letters," whiteboard.

  ## 1. Pedagogical Strategy & Honesty Clause
  You cannot simulate a perfect predictor without lying. Instead, you will simulate **correlation via type**. 
  *   **The Honesty:** In the debrief, you will admit the "prediction" was their actual behavior in Round 1. 
  *   **The Philosophical Bridge:** You will argue that for the purpose of decision theory, *being the type of person who pays* is functionally equivalent to *being predicted to pay* when the predictor has access to your history. The tension they feel regarding their "reputation" in the room mirrors the tension regarding their "disposition" in the thought experiment.
  *   **The Stagecraft:** Use sealed envelopes and a visible coin flip to create epistemic closure. The "Secret" in Round 2 will be a fictional piece of information (e.g., "I have flagged your ID"), but the *penalty* (token loss) will be real.

  ## 2. Timeline Overview
  *   **00–10:** Setup & The Policy Sheet (Pre-commitment).
  *   **10–40:** Round 1: The Branch (Counterfactual Mugging).
  *   **40–50:** Data Processing (Instructor sorts choices; students take a break).
  *   **50–80:** Round 2: The Letter (XOR Blackmail).
  *   **80–90:** Debrief & Theoretical Mapping.

  ---

  ## 3. Detailed Procedure

  ### Phase 1: Setup & Pre-Commitment (0–10 mins)
  **Goal:** Establish the "Updateless" baseline. Students must define a policy before knowing the game structure.

  1.  **Distribution:** Hand out a **"Policy Sheet"** face down. Tell them not to flip it yet.
  2.  **Script:** "Before we begin any game, I need you to fill out this inventory. It asks about your general decision-making style. This is not graded. It is for my research on class demographics."
  3.  **The Trap:** The Policy Sheet contains one critical question buried in filler:
      *   *"If you were in a situation where paying a small cost would guarantee a large benefit in a hypothetical scenario that did not occur, would you pay?"* (Options: Yes / No / Depends).
  4.  **Collection:** Collect these sheets immediately. Do not look at them in front of them. Place them in a sealed box.
      *   **Honesty Note:** You will *not* actually use these answers for prediction. You will use their **Round 1 actions** for Round 2. But this sheet primes the concept of pre-commitment.

  ### Phase 2: Round 1 — The Branch (10–40 mins)
  **Goal:** Simulate Counterfactual Mugging. Create tension between sunk cost and policy commitment.

  **Materials:** 
  *   16 Envelopes (Color A: "Heads", Color B: "Tails"). 
  *   Inside each envelope: A instruction card and 10 Tokens (starting endowment).
  *   **Preparation:** Flip a coin *once* for the whole class before class starts. 
      *   If **Heads**: Prepare 16 "Heads" envelopes. 
      *   If **Tails**: Prepare 16 "Tails" envelopes. 
      *   *Note:* This ensures everyone is in the same branch, simplifying the debrief, though individual coins work too. For maximum "Mugging" effect, **flip Tails**. You want them in the "Pay" branch where the reward branch didn't happen.

  **The Script:**
  1.  **Endowment:** "Everyone starts with 10 Tokens. These can be redeemed for candy at the end, or for a 'Homework Pass' if you collect 20."
  2.  **The Deal:** "I have flipped a fair coin. It determined which envelope you received. You do not know the result yet."
  3.  **Open Envelopes:** "Open your envelopes."
      *   **The Card Reads (Tails Branch):** "The coin was TAILS. In the HEADS branch, you would have received 100 Tokens automatically. However, that reward is *only* unlocked if, in this TAILS branch, you choose to **PAY 5 TOKENS** to the instructor now. If you keep your tokens, the HEADS reward is forfeited."
      *   *(If you flipped Heads, the card says: "The coin was HEADS. You receive 100 Tokens. No action required." But for this activity, we assume Tails to generate the dilemma.)*
  4.  **Decision:** Students privately write "PAY" or "KEEP" on a slip and put it in a collection box.
  5.  **The Wait:** Do not resolve payoffs yet. Tell them: "The HEADS reward will be calculated at the end of class based on the aggregate choices made here."
      *   *Why:* This keeps the "Counterfactual" alive. If you pay them immediately, the other branch dies. By delaying, the "HEADS reward" remains a contingent fact dependent on their current policy.

  ### Phase 3: Data Processing (40–50 mins)
  **Goal:** Seed Round 2 using Round 1 data.

  1.  **Break:** Give students a 5-minute break.
  2.  **Instructor Action:** Sort the "PAY" slips from Round 1. 
      *   Group A: Those who Paid.
      *   Group B: Those who Kept.
  3.  **Prepare Round 2:** 
      *   Prepare **Threat Letters** only for **Group A (The Payers)**. 
      *   *Wait, for XOR logic:* You need a correlation between the "Secret" and the "Letter."
      *   **Flip a Coin (The Secret):** Heads = "Secret is Real" (Penalty Active). Tails = "Secret is Fake" (Penalty Inactive).
      *   **Distribution Rule (The XOR Logic):** 
          *   If **Secret = Heads**: Send Threat Letters to **Group B (Non-Payers)**.
          *   If **Secret = Tails**: Send Threat Letters to **Group A (Payers)**.
      *   *Note:* This ensures that receiving a letter conveys information about the Secret *conditional on their type*.
      *   **Honesty:** You are literally doing this. It is not a lie.

  ### Phase 4: Round 2 — The Letter (50–80 mins)
  **Goal:** Simulate XOR Blackmail. Create tension between causal efficacy and evidential correlation.

  **The Script:**
  1.  **Re-entry:** "Welcome back. We are entering a new phase. I have analyzed your Round 1 behavior."
  2.  **The Blackmail:** "I have a piece of information about you (The Secret). I am willing to keep it confidential, but I require a fee. However, I am selective. I only send threat letters to students whose profile suggests they will pay."
  3.  **Distribution:** Hand out the Threat Letters according to the **Distribution Rule** established in Phase 3.
      *   Some students get nothing. (They are safe, no decision needed).
      *   Some students get a letter.
  4.  **The Letter Content:** 
      *   "I know your Round 1 choice. I have a Secret regarding your ID. If you do not pay me 5 Tokens now, I will project your ID on the screen as 'Uncooperative'."
      *   "Note: The existence of this Secret was determined by a coin flip before I selected recipients." (This hints at the correlation without giving away the rule).
  5.  **Decision:** Recipients decide privately: Pay or Refuse.
  6.  **Resolution:** 
      *   Collect payments.
      *   Reveal the "Secret" coin flip (Heads/Tails).
      *   Apply penalties (Project IDs of those who didn't pay *if* Secret was Heads).

  ### Phase 5: The Debrief (80–90 mins)
  **Goal:** Map experience to theory.

  1.  **Reveal the Mechanism:** Draw the Round 2 Distribution Rule on the board.
      *   "If you Received a Letter AND you Paid in Round 1: The Secret was FAKE. You paid for nothing."
      *   "If you Received a Letter AND you Kept in Round 1: The Secret was REAL. You suffered the penalty."
  2.  **Round 1 Analysis (Counterfactual Mugging):**
      *   Ask the Payers: "Why did you pay? The Heads branch didn't happen."
      *   *Expected Answer:* "To be the kind of person who gets the reward." / "Because I committed on the Policy Sheet."
      *   *Theory:* This is **Updateless Decision Theory (UDT)**. You maximize expected value across the branching possibility, not just the actualized branch. CDT says "Don't Pay" (money is gone). UDT says "Pay" (to win the counterfactual).
  3.  **Round 2 Analysis (XOR Blackmail):**
      *   Ask the Letter-Recipients: "Did receiving the letter make you more or less likely to pay?"
      *   *The XOR Insight:* "Receiving the letter told you that if you are a Payer, the threat is empty. If you are a Non-Payer, the threat is real."
      *   *Theory:* This is **Evidential Decision Theory (EDT)** vs. **CDT**. 
          *   CDT: "Paying stops the projection." (Causal).
          *   EDT/UDT: "Receiving the letter is evidence I am in the 'Payer/False' world. Paying confirms I am a sucker. If I pre-commit to 'Never Pay on Letter', the Blackmailer (following the rule) would never have sent the letter."
  4.  **The Predictor Question:**
      *   "Was my prediction perfect?" (No, it was based on Round 1).
      *   "Does it matter?" (If you believe your Round 2 choice correlates with your Round 1 choice, the logic holds).

  ---

  ## 4. Anticipated Failure Modes & Mitigation

  | Failure Mode | Why it Happens | Mitigation Strategy |
  | :--- | :--- | :--- |
  | **"This is just Newcomb's Problem."** | Students recognize the predictor/box structure. | **Acknowledge & Pivot:** "It is related. But in Newcomb's, the money is *already* in the box. In Round 1, the money is in a *branch that didn't happen*. In Round 2, the *letter itself* is the variable. Pay attention to what the message arrival tells you." |
  | **"The prediction is fake."** | Students realize you just looked at their Round 1 slip. | **Lean In:** "Correct. I am not an Oracle. But in the real world, predictors are statistical. If you believe your current self is correlated with your past self, the math is the same. The 'Predictor' is your own consistency." |
  | **Collusion/Gaming** | Students try to maximize group tokens. | **Privacy:** Emphasize private slips. **Individual Payoff:** Remind them redemption is individual. "You can't spend their candy." |
  | **Round 2 Confusion** | The XOR rule is too complex to grasp in real-time. | **Simplify the Debrief:** Don't expect them to solve XOR live. Let them feel the *unease* of receiving the letter. In the debrief, walk through the four quadrants (Pay/No Pay x Real/Fake) slowly on the whiteboard. |
  | **Ethical Pushback** | Students dislike the "Public ID" threat. | **Opt-Out:** State clearly at the start: "All penalties are token-based. The 'Public ID' is a fictional narrative for the game; no actual data will be projected." (Honesty: You can project a list of random numbers instead). |

  ## 5. Limitations (For Your Instructor Notes)
  You must supply these in the debrief, as the activity cannot reproduce them:

  1.  **Logical Counterfactuals:** The activity uses *causal* history (Round 1 affects Round 2). True XOR Mugging involves *logical* counterfactuals (your decision now changes the prediction that already happened). You must explain that the game is a **causal analog** for a **logical problem**.
  2.  **Perfect Prediction:** Your prediction is imperfect (based on past behavior, not source code). This weakens the "Updateless" argument slightly. You must argue that *high correlation* is sufficient for the intuition pump, even if the math isn't identical to a perfect Oracle.
  3.  **One-Shot vs. Iterated:** This is a one-shot game. UDT shines in iterated or pre-commitment scenarios. The "Policy Sheet" attempts to patch this, but students may treat Round 1 and 2 as disconnected. Emphasize the **Policy Sheet** in the debrief as the anchor for the "Updateless" perspective.

  ## 6. Instructor Script Snippet (The "Honesty" Moment)
  *Use this during the Round 2 Debrief:*

  > "I want to be transparent. I do not have a magic crystal ball. In Round 2, my 'prediction' was simply your actual behavior from Round 1. I looked at your slips. I sorted you. 
  >
  > "So why did this feel like a paradox? Because for those of you who received a letter, the *fact of receiving it* changed the probability of the threat being real, depending on what you did earlier. 
  >
  > "In the philosophical literature, they model this with a Perfect Predictor who sees your source code. In this room, I am the Predictor, and your 'source code' is your past behavior. The tension you felt—'If I pay, I prove them right, but if I don't, I get hurt'—is the exact tension of XOR Blackmail. The mechanism is simpler here, but the decision structure is identical."

  ## 7. Materials Checklist
  *   [ ] 16 Envelopes (Color A), 16 Envelopes (Color B).
  *   [ ] 32 Instruction Cards (Tailored to the Coin Flip result).
  *   [ ] 16 Policy Sheets (with the buried commitment question).
  *   [ ] 16 Threat Letters (prepared conditionally based on Round 1 data).
  *   [ ] 200 Tokens (Poker chips or candy).
  *   [ ] 1 Collection Box (Sealed).
  *   [ ] Whiteboard & Markers.
  *   [ ] Coin.

  ## 8. What Will Predictably Go Wrong (First Run)
  1.  **The "Heads" Fluke:** If you flip Heads in Round 1, the Mugging disappears (they get free money). 
      *   *Fix:* Pre-flip the coin before class. If it's Heads, swap the text on the cards so Tails is the "Pay" branch. Ensure the "Pay" branch is the *actual* branch they experience.
  2.  **Round 2 Non-Recipients:** Students who don't get a letter in Round 2 will feel left out.
      *   *Fix:* Give them a "Safe" card that says "No Threat. You keep your tokens." Keep them engaged in the scoring.
  3.  **The "Sunk Cost" Rebuttal:** An Econ major will loudly argue "The Heads money is gone, paying is irrational."
      *   *Fix:* Validate them. "CDT agrees with you. But CDT loses the 100 tokens in the long run across possible worlds. We are testing if you can feel the pull of the other world."

  This design keeps you honest, creates the specific phenomenological tension of both problems, and uses the classroom's social dynamics to substitute for the "Perfect Predictor" without requiring you to lie.
