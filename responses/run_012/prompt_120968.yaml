prompt: |-
  I teach a 90-minute upper-level seminar on decision theory and rationality — 16 students, mostly philosophy majors with a few from economics and cognitive science. We have done Newcomb's problem and the basics of causal versus evidential decision theory, so they have the vocabulary, but they have never encountered counterfactual mugging or XOR blackmail, and I want to keep it that way until the debrief. I need a runnable in-class activity, not a lecture and not a discussion prompt, that makes them feel the pull of both problems before I name either one. The two should be staged as separate rounds of the same session, and ideally the second should draw on what happened in the first, so that the connection between them — something about decisions that matter only in one branch of a branching possibility, and about the way a message's arrival carries information about your own disposition — emerges from the structure rather than from me saying it.

  For the first round, I want them to face the counterfactual-mugging structure: a coin determines whether they are in the branch where they are asked to pay a small amount, and a large payoff in the other branch depends on what they would have done in the branch they are actually in. The point they should feel is the asymmetry between committing to a policy in advance and facing the choice once the branch is settled — the sense that the money is already gone, that nothing they do now can change the other branch, and yet that refusing feels like a betrayal of something. For the second round, I want the XOR-blackmail structure: a threat to release a secret if and only if they do not pay, sent only to people the blackmailer predicts will pay, so that receiving the threat is itself evidence about their own type. The point they should feel is the collision between the causal case for paying (paying prevents the release) and the evidential case against being the sort of person who pays (the threat's arrival tells you something, and the ex ante best policy is to be unthreatenable). I would like the second round to be seeded by the first — for instance, the blackmailer's predictions could be based on what people actually did in round one — so that the moment of recognition ("I am being threatened because of what I did earlier") lands as a discovery rather than an announcement.

  The hard design problem is credibility of the predictor. I do not want to lie to them and I do not have a real Oracle. I am willing to use some stagecraft — sealed envelopes, a confederate, a pre-committed scoring rule applied to a short questionnaire they fill out at the start — but whatever I use has to be something I can honestly explain in the debrief, and it has to be credible enough in the moment that they actually feel the counterfactual pressure. Please give me the full runnable design: materials, setup, exact rules and payoffs for each round (tokens or candy, no real money), a timeline for the 90 minutes, roles if any, and a debrief that maps what happened onto the two problems and onto the distinction between causal and evidential or updateless reasoning. Tell me how to stage the prediction so that it is both honest and psychologically real, and flag the point at which the stagecraft is likely to show through. Also tell me what will predictably go wrong the first time I run it — the ways participants will try to game the rules, the moments where someone will say "this is just Newcomb's problem again" and derail the room, the points where the fiction will feel fake — and how to handle each. Finally, be honest about which feature of these problems the activity cannot reproduce and that I will have to supply in the debrief; in particular, I suspect that no classroom game can reproduce the full force of the perfect predictor, and I want to know what that costs.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** 16 upper-level students (Philosophy, Econ, CogSci). Familiar with Newcomb's, CDT vs. EDT. *Not* familiar with Counterfactual Mugging or XOR Blackmail.
      *   **Goal:** A runnable in-class activity (not lecture/discussion) that makes them *feel* the pull of both problems before naming them.
      *   **Structure:** Two rounds. Round 2 must draw on Round 1 (seeding). Connection (decisions in one branch, information in message arrival) must emerge from structure.
      *   **Round 1 (Counterfactual Mugging):** Coin flip branch. Pay small now vs. large payoff in the *other* branch (which didn't happen). Tension: Commitment vs. Sunk Cost.
      *   **Round 2 (XOR Blackmail):** Threat sent iff predicted to pay. Receiving threat is evidence. Tension: Causal (pay to stop) vs. Evidential/Updateless (don't be the type).
      *   **Constraint:** No lying. No real Oracle. Must be honest in debrief. Needs stagecraft (envelopes, questionnaires, etc.).
      *   **Deliverables:** Full runnable design (materials, setup, rules, payoffs, timeline, roles), staging the prediction honestly, failure modes/mitigation, limitations of the activity.
      *   **Time:** 90 minutes.

  2.  **Deconstruct the Core Philosophical Tension:**
      *   *Counterfactual Mugging:* The core is *updatelessness*. You want to commit to paying *before* the coin flip, but once you know the coin came up "Tails" (you lost), you don't want to pay. The activity needs to simulate the "other branch" payoff being contingent on the *policy* you would have followed, not just the action you take now.
      *   *XOR Blackmail:* The core is that the *arrival* of the threat is correlated with your disposition. If you are the type to pay, you get threatened. If you are the type not to pay, you don't. Paying confirms you are the "sucker" type.
      *   *Link:* Both involve reasoning about what your action says about your disposition/policy across possible worlds (or prediction scenarios).

  3.  **Designing the "Honest Predictor":**
      *   I cannot simulate a perfect predictor. If I tell them "I predict you," they will doubt it.
      *   *Solution:* Use a *pre-commitment questionnaire* as the "prediction."
      *   *Mechanism:* At the very start (before explaining the game), have them fill out a "Decision Style Inventory."
      *   *Honesty:* In the debrief, I admit the "prediction" was just their own stated intent or a simple heuristic based on that inventory. The *philosophical point* holds even with imperfect prediction, but the *feeling* requires them to treat the prediction as reliable enough to matter.
      *   *Better Solution for "Feeling":* Use a *randomized but binding* mechanism for Round 1 (the Coin) and a *correlated* mechanism for Round 2.
      *   *Refined Idea:* To make Round 2 depend on Round 1 honestly: The "Blackmailer" in Round 2 targets students based on their actual choices in Round 1.
      *   *Wait, the prompt asks for Round 2 to be seeded by Round 1.* "The blackmailer's predictions could be based on what people actually did in round one."
      *   *Challenge:* If Round 2 happens *after* Round 1, the prediction is just data. That's honest. The "Blackmailer" (the Instructor) looks at who paid in Round 1.
      *   *The XOR Twist:* In XOR blackmail, you get the letter *only if* the bad thing is true AND you are the type to pay. Or, more standardly: You get the letter iff (Bad Thing is True XOR You Pay).
      *   *Simplification for Class:* Let's stick to the core intuition: "You are receiving this threat *because* we think you will pay."
      *   *Implementation:*
          *   Round 1: The "Coin Game."
          *   Round 2: The "Reputation Game." The instructor claims to have profiled them based on Round 1 behavior to send threats only to "payers."
          *   *Honesty Check:* I can actually do this. I collect Round 1 choices. I sort the class. I hand out threats only to the "Payers" (or a subset). I tell them: "I am targeting those who showed a willingness to pay." This is honest. It simulates the *correlation* without needing a perfect predictor.

  4.  **Drafting the Activity Flow:**

      *   **Pre-Class/Start (0-10 mins):** "Policy Questionnaire." Crucial for the "Updateless" feel. They must state their policy *before* knowing the game structure.
      *   **Round 1 (Counterfactual Mugging) (10-40 mins):**
          *   Setup: Private coin flip (or instructor flips for everyone to keep control). Let's use Instructor Flip for uniformity, or sealed envelopes. Sealed envelopes are better for "branching."
          *   Mechanism: Envelope A (Heads) and Envelope B (Tails).
          *   Scenario: "If Heads, you get $100 (tokens) if you *would have paid* in Tails. If Tails, you are asked to pay 10 tokens."
          *   Problem: If they are in Tails, they know Heads didn't happen. Why pay?
          *   Payoff: Tokens redeemable for candy/extra credit (symbolic).
      *   **Round 2 (XOR Blackmail) (40-70 mins):**
          *   Setup: Instructor acts as Blackmailer.
          *   Mechanism: Based on Round 1 choices.
          *   Scenario: "I have embarrassing info (fictional). I will release it unless you pay. BUT, I only send this letter to people I think will pay."
          *   The Twist: The "Embarrassing Info" is actually determined by a coin flip *independent* of the letter, but the *letter* is sent based on their Round 1 behavior.
          *   Wait, standard XOR Blackmail: Letter arrives iff (Secret True XOR You Pay).
          *   Let's simplify to the *Parfit's Hitchhiker/Blackmail* hybrid intuition: "You are getting this letter because you look like a payer."
          *   *Correction:* To capture XOR specifically, the arrival of the letter must be *negatively* correlated with the bad outcome for non-payers, but *positively* correlated for payers.
          *   *Classroom adaptation:* "I flipped a coin for the Secret. If Heads (Secret Safe), I send letters to Non-Payers. If Tails (Secret Risk), I send letters to Payers." -> This is too complex to explain without giving it away.
          *   *Simpler adaptation:* "I am targeting Payers." The lesson is: Receiving the threat tells you that you are in the group targeted for paying. If you don't pay, you prove the prediction right (you are a non-payer) but you also suffer the consequence?
          *   *Let's stick to the Prompt's specific request:* "Threat to release a secret if and only if they do not pay, sent only to people the blackmailer predicts will pay."
