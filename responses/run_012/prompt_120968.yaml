          *   *XOR Specific:* The letter arrives *only if* (Secret is Real AND You Pay) OR (Secret is Fake AND You Don't Pay). No, that's not right.
          *   *Standard XOR Blackmail:* Blackmailer sends letter iff (Secret is True XOR You Pay).
