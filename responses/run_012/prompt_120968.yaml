              5.  If you get a letter:
                  *   If you were a Payer: Secret is Fake. Paying saves nothing.
                  *   If you were a Non-Payer: Secret is Real. Not paying hurts you.
              *   This creates the evidential link.
      *   **Debrief (70-90 mins):** Connect to CDT/EDT/UDT.

