prompt: |-
  I am a philosopher of biology preparing the final session of a graduate seminar on the concept of function, and I have grown impatient with the way the field stages the dispute between etiological and causal-role accounts of biological function — as a pair of monologues, each addressed to its own choir. I want my students to read what a genuine adversarial collaboration between the two camps would have produced. Please draft that document: the joint statement that a committed etiological theorist and a committed causal-role theorist could both sign after working through the cases below in good faith.

  By the etiological position I mean, roughly, the view that ascribing a function to a trait is saying something about its history — that the function of a trait is the effect for which it was selected, or more broadly the effect that explains why the trait is present or maintained. By the causal-role position I mean the view that a trait's function is the contribution it makes to some capacity of the containing system, picked out without essential reference to how the trait came to be. I offer these glosses only to fix the parties. Refine them as the document requires. You need not name individual authors, cite any literature, or appeal to any particular paper; the statement must stand on its own for readers who have nothing in front of them but the statement itself.

  Please have the two parties work through these four cases, which I have deliberately chosen so that neither camp gets an easy run:

  Case A. In a recently described population of blind, cave-dwelling crustaceans, an appendage homologous to a feeding structure in surface relatives has been modified and now detects water-borne vibrations, which the animals use to avoid predators. The population appears to have been founded by a handful of individuals a few thousand years ago, and the evidence suggests the modification may have spread by drift rather than selection; whether selection is currently acting on the appendage's size is contested and, at present, unresolved.

  Case B. A structure in a related lineage is a clear homologue of a structure that performs a well-understood role in its surface relatives, but in this lineage the structure is diminutive and no measurable contribution to any capacity has been detected. There is no evidence of selection maintaining it and no evidence of selection eliminating it.

  Case C. An organ that was, on the best phylogenetic reconstruction, originally selected for buoyancy control now serves primarily in the production of sound used in mating displays, and its buoyancy contribution is marginal. The historical and the current roles have come apart.

  Case D. In a diseased organism, an organ that ordinarily makes a specific contribution to a systemic capacity no longer makes it, and cannot be made to make it again. Nothing about the organ's structure or lineage has changed.

  The document should contain the following, in this order:

  1. A short preamble, of two or three sentences, stating the question both parties agree they are answering, and identifying whatever they can jointly affirm about what ascriptions of function are for — whether they are explanatory rather than merely descriptive, for instance — without prejudging the substance of their disagreement.

  2. A numbered list of claims both parties accept, about functions in general and about the cases above, phrased so that neither party is conceding anything its own commitments forbid.

  3. A disagreements table, with one row per live disagreement and columns for: the issue; the formulation of each side's position that that side would accept as fair to it; the crux — the sub-question such that settling it would move at least one side; a case, observation, or argument that both sides agree bears on the crux; and each side's prediction about it, recorded in advance.

  4. For each of the four cases, the verdict the two parties can reach jointly, and, where they split, the split stated in wording each side would accept for itself.

  5. A section identifying any disagreements the collaboration concluded were merely verbal — disagreements about which word to use rather than about what is the case — with reasons for that verdict. If you conclude that no part of the dispute is verbal, say so and defend it.

  6. For each side, what that side would count as evidence or argument against its own position, stated in terms its own adherent would accept.

  Three constraints on the drafting. First, do not make either party concede more than its commitments force; where you find that a side's view cannot be stated without making it sound obviously false, report that as a finding of the collaboration rather than disguising it. Second, do not smuggle in a third position, and do not declare a winner; the point of the exercise is a text both parties would actually put their names to. Third, the cruxes must be real: for each one, it should be clear why settling it would move at least one party, and the shared evidence you cite must be something both parties would agree is relevant before they know how it comes out.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher of biology drafting a final seminar document.
      *   **Task:** Create a "Joint Statement" resulting from an adversarial collaboration between an Etiological Theorist (ET) and a Causal-Role Theorist (CRT).
      *   **Goal:** Move beyond "monologues addressed to their own choirs." Produce a text both could sign *in good faith*.
      *   **Definitions:**
          *   ET: Function = effect for which trait was selected/maintained (history-dependent).
          *   CRT: Function = contribution to capacity of containing system (history-independent).
      *   **Cases:**
          *   A: Exaptation/Drift (new use, unclear selection history).
          *   B: Vestigial/Neutral (homologue, no current function, no selection).
          *   C: Exaptation/Shift (old function vs. new function).
          *   D: Disease/Malfunction (capacity lost, history intact).
      *   **Structure:**
          1.  Preamble (Question + Joint Affirmation).
          2.  Numbered List of Joint Claims (General + Case-specific).
          3.  Disagreements Table (Issue, ET Formulation, CRT Formulation, Crux, Shared Evidence, Predictions).
          4.  Case Verdicts (Joint or Split).
          5.  Verbal Disagreements Section (None? Or some?).
          6.  Falsification Conditions (What would count against each view).
      *   **Constraints:** No forced concessions, no third-position smuggling, no declaring a winner, real cruxes.

  2.  **Deconstruct the Positions & Cases:**

      *   **Etiological (ET):** Function is tied to selection history. If no selection, no function (strictly speaking). Malfunction is failing to do what was selected for.
      *   **Causal-Role (CRT):** Function is tied to current contribution. If it contributes, it has a function. If it doesn't contribute, it doesn't. History is irrelevant to *what* the function is, though maybe relevant to *why* it's there.
      *   **Case A (Cave Crustacean):** New use (vibration detection). History is drift/unclear selection.
          *   ET: Tough. If drift, strictly no function *yet*, or function is the old one if homology holds? Or maybe "proto-function"? ET usually says no selection = no function.
          *   CRT: It contributes to predator avoidance. It has a function.
      *   **Case B (Vestigial):** Homologue, no contribution, no selection.
          *   ET: No selection maintaining it. No function (or function is lost).
          *   CRT: No contribution. No function.
          *   *Potential Agreement:* Both say "no function."
      *   **Case C (Buoyancy -> Sound):** History = Buoyancy. Current = Sound.
          *   ET: Proper function is Buoyancy (selected effect). Sound is a beneficial effect, but not *the* function.
          *   CRT: Function is Sound (current contribution). Buoyancy is negligible.
          *   *Conflict:* Divergence of history vs. current utility.
      *   **Case D (Disease):** Organ broken. History intact.
          *   ET: Function exists (selected effect), but organ is malfunctioning.
          *   CRT: Function is the contribution. If no contribution, no function *in this token*. Or, function is defined by the *type*, in which case the type has a function, the token doesn't. CRTs often struggle with normativity/malfunction.
          *   *Conflict:* Can a trait have a function if it currently does nothing?

  3.  **Drafting - Section by Section:**

      *   **1. Preamble:** Needs to be neutral but substantive. Acknowledge the stalemate. Agree that function ascriptions do explanatory work (not just labeling).
      *   **2. Joint Claims:** Look for overlaps.
          *   Functions aren't magical; they depend on physical traits.
          *   Case B is the easiest agreement (Vestigial = No Function).
          *   Both agree that *some* distinction between "what it does" and "why it's there" is useful.
          *   Both agree that Case D represents a breakdown of normalcy.
      *   **3. Disagreements Table:** This is the core. Needs to identify *why* they disagree.
          *   *Issue 1: The Normativity of Function.* ET needs history for normativity (malfunction). CRT needs current capacity.
          *   *Issue 2: The Time-Slice Problem.* Is function diachronic (ET) or synchronic (CRT)?
          *   *Issue 3: Drift/Exaptation (Case A).* Does utility without selection count?
          *   *Cruxes:* Must be empirical or conceptual settling points. E.g., "Is 'function' primarily about explaining presence or explaining current system dynamics?"
      *   **4. Case Verdicts:**
          *   A: Split. ET says "Beneficial Effect" (not Function). CRT says "Function."
          *   B: Joint. "No Function."
          *   C: Split. ET says "Proper Function = Buoyancy." CRT says "Function = Sound."
          *   D: Split (Nuanced). ET says "Function exists, token malfunctions." CRT says "Token has no function, Type does."
      *   **5. Verbal Disagreements:** Are they just talking past each other?
          *   *Decision:* No. It's not merely verbal. They carve nature at different joints for different explanatory purposes. One explains *presence*, the other explains *activity*. Acknowledging this prevents the "verbal" dismissal but respects the depth of the split.
      *   **6. Falsification:**
          *   ET: If we find traits maintained without selection that everyone agrees have functions. Or if historical accounts fail to predict malfunction.
          *   CRT: If we find traits contributing to systems that everyone agrees are non-functional (e.g., cancer growth, though CRTs handle this via "system capacity" definitions). Or if current contribution fails to track biological intuition about *design*.

  4.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Constraint Check:* Did I make ET concede too much? *Correction:* Ensure ET doesn't admit Case A has a "function." They should call it a "beneficial effect."
      *   *Constraint Check:* Did I make CRT concede too much? *Correction:* Ensure CRT doesn't admit history is *constitutive* of function. History might be heuristic, but not definitional.
      *   *Tone:* Needs to be academic, precise, collaborative but firm on differences.
      *   *Case D:* CRTs often distinguish between "capacity of the token" vs "capacity of the type." I need to make sure the split reflects this nuance without resolving it.
      *   *Case A:* The prompt says selection is "unresolved." ET must suspend judgment or lean on the drift evidence. Let's assume drift for the sake of the theoretical clash.
      *   *Verbal Disagreement:* I need to be careful here. If I say it's all verbal, the document is weak. If I say it's none, it might be dogmatic. The best philosophical move is: "It is not merely verbal, because the concepts track different explanatory dependencies."

  5.  **Final Review against Constraints:**
      *   Preamble (2-3 sentences)? Yes.
      *   Numbered Joint Claims? Yes.
      *   Disagreements Table (Issue, Formulations, Crux, Evidence, Predictions)? Yes.
      *   Case Verdicts (Joint or Split)? Yes.
      *   Verbal Disagreements Section? Yes.
      *   Falsification Conditions? Yes.
      *   No smuggling third views? Yes.
      *   No winner declared? Yes.

  6.  **Writing the Document:** (Proceeding to generate the text based on these thoughts.) *Self-correction on Case A:* The prompt says "evidence suggests... drift." ET should treat this as "likely no function." CRT treats as "function exists."
      *   *Refining the Crux:* The crux shouldn't just be "who is right." It should be a specific conceptual or empirical threshold. E.g., "Does the explanatory power of 'function' depend on its ability to distinguish selected traits from drift-induced traits?"

      *(Self-Correction on Section 5)*: I should argue that *some* aspects are verbal (e.g., whether to apply the label 'function' to Case B), but the *underlying distinction* is real. Actually, the prompt asks to identify disagreements concluded to be merely verbal. If I conclude none are, I must defend it. I will argue that while there is terminological overlap, the *explanatory commitments* differ, so it is not *merely* verbal.

      *(Self-Correction on Section 6)*: Make sure the falsification conditions are internal to the theory. ET: If selection history is unknowable but function ascriptions remain robust. CRT: If contribution is present but intuitively clearly not a function (e.g. heart noise).

      *Let's assemble.*

      *Wait, one more check on Case D.* CRTs often say the *type* has a function, the *token* does not. ETs say the *token* has a function (etiological) but is broken. I need to phrase the split carefully so both accept the wording.
      *ET:* "The trait retains its function but fails to perform it."
      *CRT:* "The trait type has a function, but this token lacks the capacity to fulfill it."
      *Joint Verdict:* "The organism is pathological." (Safe ground).

      *Okay, ready to write.*
answer: |-
  **JOINT STATEMENT ON THE CONCEPT OF BIOLOGICAL FUNCTION**

  **1. Preamble**
  We, the undersigned, agree that the central question before us is whether the ascription of function to a biological trait is fundamentally an appeal to the history of that trait's maintenance or an appeal to its current contribution to a containing system. We jointly affirm that function ascriptions are not merely descriptive labels but serve specific explanatory roles within biological inquiry, distinguishing normal operations from accidents, breakdowns, or byproducts.

  **2. Jointly Accepted Claims**
  1.  **Explanatory Utility:** Both parties agree that function talk is retained in biology because it organizes knowledge more effectively than purely structural or biochemical descriptions in specific contexts.
  2.  **Case B (Vestigial Structure):** Both parties agree that the diminutive structure described in Case B possesses no biological function. The Etiological party affirms this because there is no selection maintaining it; the Causal-Role party affirms this because it makes no contribution to system capacity.
  3.  **Distinction of Effects:** Both parties agree that not every effect of a trait is a function. There is a principled distinction between a trait's *functional effects* and its *incidental byproducts* (e.g., the heart pumping blood vs. the heart making sound), though we differ on the criterion used to draw this line.
  4.  **Case D (Pathology):** Both parties agree that the organism in Case D is in a pathological state. We agree that the loss of capacity described constitutes a deviation from the standard operation of the lineage, regardless of how "standard" is defined.
  5.  **Empirical Dependence:** Both parties agree that function ascriptions must be constrained by empirical data regarding phylogeny, physiology, and ecology; neither view permits function ascriptions based solely on intuition or *a priori* reasoning.

  **3. Disagreements Table**

  | Issue | Etiological Formulation | Causal-Role Formulation | Crux | Shared Evidence Bearing on Crux | Etiological Prediction | Causal-Role Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **The Basis of Normativity** | Function provides the norm against which malfunction is measured; this norm requires a historical standard of success (selection). | Function provides the norm against which malfunction is measured; this norm is derived from the typical contribution of the trait type to the system. | Does the concept of "malfunction" require a historical etiology to be biologically substantive, or is statistical typicality of contribution sufficient? | Comparative data on congenital defects where the trait is historically normal but currently non-contributing across a population. | Malfunction is present even if the defect is common, provided the history is intact. | Malfunction is absent if the defect is statistically typical for the current population, regardless of history. |
  | **Drift and Exaptation (Case A)** | A trait arising or spreading via drift has no function until selected for its new effect; utility alone is insufficient for function. | A trait contributing to a system capacity has a function immediately, regardless of whether drift or selection caused its prevalence. | Is the explanatory value of "function" tied to explaining the *presence* of the trait or the *activity* of the system? | Longitudinal genomic and ecological data determining whether the vibration-detection trait is currently under selection. | If drift is confirmed, "function" ascriptions will cease to predict trait maintenance. | If utility is confirmed, "function" ascriptions will successfully predict system survival, regardless of trait history. |
  | **Functional Shift (Case C)** | The "Proper Function" remains the selected effect (buoyancy); the new effect (sound) is a beneficial use but not the function until selection acts. | The function is the current significant contribution (sound); the historical role is irrelevant to the current functional analysis. | When history and current utility diverge, which account better predicts the future evolutionary trajectory of the trait? | Phylogenetic analysis of whether the buoyancy mechanism is being lost as the sound mechanism is refined. | The trait will be conserved only if the historical selection pressure (buoyancy) remains relevant. | The trait will be conserved only if the current contribution (sound) enhances fitness. |

  **4. Case Verdicts**

  *   **Case A (Cave Crustacean):**
      *   **Joint Verdict:** The appendage makes a causal contribution to predator avoidance.
      *   **Split:**
          *   *Etiological:* "The appendage has no *function* strictly speaking, as the evidence suggests drift; it is a beneficial effect awaiting potential selection."
          *   *Causal-Role:* "The appendage has the *function* of vibration detection, as it contributes to the capacity for predator avoidance."

  *   **Case B (Vestigial Homologue):**
      *   **Joint Verdict:** "The structure has no function." (See Joint Claim #2).

  *   **Case C (Buoyancy-to-Sound Shift):**
      *   **Joint Verdict:** The organ contributes to sound production and marginally to buoyancy.
      *   **Split:**
          *   *Etiological:* "The *Proper Function* is buoyancy control; sound production is an exaptation."
          *   *Causal-Role:* "The *Function* is sound production; buoyancy is a negligible residual effect."

  *   **Case D (Diseased Organ):**
      *   **Joint Verdict:** The organism exhibits a pathological failure of systemic capacity.
      *   **Split:**
          *   *Etiological:* "The organ retains its function but is malfunctioning; the function is defined by the lineage's history, which remains intact."
          *   *Causal-Role:* "The organ token has no function because it makes no contribution; the organ *type* has a function based on healthy tokens."

  **5. On Merely Verbal Disagreements**
  We conclude that the dispute is **not merely verbal**. While it is possible to stipulate definitions that reconcile the terminology (e.g., reserving "Proper Function" for history and "System Function" for current role), the disagreement persists regarding which concept does the explanatory work required by biological practice. The Etiological party insists that without history, one cannot distinguish function from beneficial accident (Case A). The Causal-Role party insists that without current contribution, one cannot distinguish function from dormant potential (Case D). Because these distinctions track different empirical dependencies (phylogeny vs. physiology), the disagreement concerns the structure of biological explanation, not merely the labeling of concepts. We acknowledge, however, that confusion arises when parties use the unqualified term "function" without specifying which explanatory dependency they intend to invoke.

  **6. Conditions for Theoretical Revision**

  *   **For the Etiological Party:**
      We would consider our position undermined if it were demonstrated that biologists reliably and successfully use function ascriptions to predict system behavior in lineages where selection history is demonstrably unknowable or absent (e.g., in synthetic biology or novel drift-driven adaptations), and where these ascriptions are treated as normative despite the lack of history. If "function" proves robust in the total absence of etiology, the etiological constraint is too narrow.

  *   **For the Causal-Role Party:**
      We would consider our position undermined if it were demonstrated that counting every systemic contribution as a function leads to an unmanageable proliferation of functions (the "promiscuity" problem) that fails to distinguish between traits essential to the organism and traits that are merely parasitic or incidental (e.g., tumor growth contributing to metabolic demand). If "contribution" cannot be normatively constrained without appealing to history, the causal-role account is insufficiently selective.
