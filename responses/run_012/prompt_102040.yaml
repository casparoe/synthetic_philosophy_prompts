prompt: |-
  I'm running next month's session of a small rationality discussion group — mixed crowd, two of them have seen a bit of game theory, the rest are smart non-specialists — and I want to do superrationality, but built around the Platonia dilemma and the Luring Lottery rather than the Prisoner's Dilemma that everyone's already been bored by. Quick setup so you're with me: in Platonia, an eccentric trillionaire gets 20 strangers together and says that if exactly one of them sends him a telegram (reverse charges) by noon tomorrow, that one person gets a billion dollars, and if more than one sends one or nobody does, nobody gets anything, and they can't coordinate. The Luring Lottery was a real stunt a magazine ran in the early 80s: you entered by mailing a postcard with the number 1 on it, you were allowed to write any number of entries on the card, and the prize was a million dollars divided by the total number of entries, going to one randomly chosen entry. Hofstadter's superrational idea, roughly, is that in a symmetric puzzle the answer is the same for everyone, so you reason as if everyone picks the same strategy.

  Don't explain it to me, I already get it — I want a plan for how to teach it. Act like a philosopher who's taught decision theory to non-specialists and thinks carefully about where people trip. Start by brainstorming the dependency order: what has to be in place before "superrational" even parses for them, and what depends on what. Then tell me which one example should carry the whole session — Platonia or the Lottery — and what it has to have and lack to do that job, plus why I'm right to think the PD is a trap here. Give me the misconceptions they'll bring or form and exactly where in the sequence to head each one off (I'm already worried about "superrational = being nice / just Kant" and "it's magical thinking where my choosing makes them choose"). What should I openly refuse to cover at this level and say so out loud? And finish with the one closing question that would show me they actually got it rather than just nodded along.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **Goal:** Plan a rationality discussion group session on *superrationality*.
      *   **Context:** Small group, mixed crowd (some game theory, mostly smart non-specialists).
      *   **Focus:** Platonia Dilemma & Luring Lottery (avoid Prisoner's Dilemma).
      *   **Persona:** Experienced philosopher of decision theory, attentive to pedagogical pitfalls.
      *   **Deliverables:**
          1.  Dependency order (conceptual scaffolding).
          2.  Choice of central example (Platonia vs. Lottery) with justification.
          3.  Why PD is a trap.
          4.  Misconceptions & intervention points (specifically "superrational = morality/Kant" and "magical thinking").
          5.  What to explicitly exclude/refuse to cover.
          6.  One closing question to test understanding.

  2.  **Deconstruct the Concepts:**
      *   *Superrationality:* Hofstadter's concept. Assumes symmetry of reasoning. If I am rational, and you are rational, and we face the same problem, we will arrive at the same conclusion. Therefore, I should choose the strategy that yields the best outcome *if everyone chooses it*.
      *   *Platonia Dilemma:* Coordination problem. $N$ people. Prize if exactly 1 acts. Payoff 0 otherwise. No communication.
      *   *Luring Lottery:* Variable contribution. Prize pool fixed ($1M), divided by total entries. You pick $k$ entries. Expected value depends on total entries.
      *   *Prisoner's Dilemma (PD):* Defect dominates Cooperates in standard Causal Decision Theory (CDT). Superrationality suggests Cooperate. *Problem:* People know PD too well, have entrenched "defect is rational" or "cooperate is moral" views.

  3.  **Drafting the Dependency Order (Scaffolding):**
      *   What do they need *before* superrationality makes sense?
      *   1. *Standard Rationality (Nash/CDT):* They need to know what "normal" reasoning looks like (maximize expected utility based on causal impact).
      *   2. *Symmetry/Common Knowledge:* They need to grasp that the participants are identical in relevant reasoning capacities.
      *   3. *The Failure of Standard Rationality:* Show a case where standard reasoning leads to a suboptimal equilibrium (or zero payoff).
      *   4. *The Superrational Leap:* Treating your own decision as diagnostic of others' decisions (not causal, but correlational/logical).
      *   5. *The Strategy:* Maximizing the payoff *given* that everyone does the same.
      *   *Dependency:* 1 & 2 $\to$ 3 $\to$ 4 $\to$ 5.

  4.  **Selecting the Central Example:**
      *   *Option A: Platonia.* Pure coordination. Binary choice (send/don't send).
      *   *Option B: Luring Lottery.* Continuous/Integer choice (how many entries).
      *   *Comparison:* Platonia is cleaner for the "exactly one" constraint. It forces a probabilistic strategy (roll a die). The Lottery is great for showing how "more effort" dilutes the prize, but it can get math-heavy (calculus/optimization).
      *   *Decision:* **Platonia.** Why? Because the Luring Lottery often devolves into "how many entries should I send?" math. Platonia forces the *conceptual* shift: "I must randomize." It highlights the "exactly one" constraint which makes the "everyone does the same" logic stark. If everyone sends, 0 payoff. If everyone doesn't, 0 payoff. If everyone flips a coin with $p=1/20$, max expected value.
      *   *Wait, reconsider:* The prompt asks to choose *one* to carry the session. Hofstadter actually used the Luring Lottery (Scientific American, 1983) to demonstrate superrationality with a continuous variable. However, Platonia is often clearer for the "symmetry" argument without getting bogged down in the math of $N/(Total Entries)$.
      *   *Actually, looking at the prompt's specific constraints:* The user mentions both. Platonia is often cleaner for the *logic* of superrationality (symmetric strategy), whereas the Lottery is better for showing the *tragedy* of standard rationality (everyone sends infinite entries).
      *   *Pedagogical Choice:* **Platonia.** It's binary. It forces the probabilistic solution ($1/N$). The Lottery requires understanding expected value calculations with variable denominators, which might distract the non-specialists. Platonia isolates the *reasoning mode*.
      *   *Refinement:* Actually, Hofstadter's *column* was the Luring Lottery. But Platonia is the cleaner *thought experiment* for the logic. Let's stick with Platonia for the *concept*, maybe mention Lottery as a real-world analog.
      *   *Wait, looking closer at the prompt:* "Tell me which one example should carry the whole session."
      *   *Argument for Platonia:* It removes the "how much" variable and focuses on "whether." It makes the symmetry argument sharper.
      *   *Argument for Lottery:* It shows the slide into infinity.
      *   *Decision:* **Platonia.** It's less mathematically intimidating and more starkly illustrates the coordination failure of standard rationality. The solution (randomize with $p=1/N$) is elegant and memorable.

  5.  **Why PD is a Trap:**
      *   People have heard of it.
      *   It triggers moral intuitions (betrayal vs. loyalty).
      *   It conflates "one-shot" with "iterated."
      *   It invites "I'll cooperate if you cooperate" conditional reasoning which muddies the superrational water.
      *   Superrationality in PD looks like "Cooperate." In Platonia, it looks like "Randomize." Randomization is less morally loaded.

  6.  **Misconceptions & Interventions:**
      *   *Misconception 1: "It's just Kant/Categorical Imperative."* (Do unto others...).
          *   *Intervention:* Emphasize *self-interest*. Superrationality isn't about duty; it's about winning. You randomize not because it's fair, but because it's the only way to get the money.
      *   *Misconception 2: "Magical Thinking/Telepathy."* (My choice *causes* theirs).
          *   *Intervention:* Distinguish *causal* influence from *logical* correlation. We are identical machines running the same code. If I output 'Send', logic dictates you output 'Send'. I'm not reaching into your brain; I'm simulating you.
      *   *Misconception 3: "It requires trust."*
          *   *Intervention:* No communication allowed. Trust is irrelevant. Reasoning is the bridge.

  7.  **What to Exclude:**
      *   *Causal Decision Theory (CDT) vs. Evidential Decision Theory (EDT) vs. Functional Decision Theory (FDT):* Too technical. Don't name-drop Yudkowsky/Soares unless necessary. Keep it Hofstadterian.
      *   *Nash Equilibria technicalities:* Don't draw payoff matrices.
      *   *Real-world politics:* Don't let them drift into voting or climate change yet. Keep it abstract.

  8.  **The Closing Question:**
      *   Needs to test if they get the *logic*, not just the *answer*.
      *   Question: "If you knew one other person in the group was irrational (would definitely send a telegram), what does your superrational strategy become?"
      *   *Why:* This breaks the symmetry. If symmetry breaks, superrationality collapses back to standard game theory. It tests if they understand that *symmetry* is the engine, not just "be nice."

  9.  **Review and Refine (Self-Correction during drafting):**
      *   *Tone:* Philosophical, pedagogical, slightly wary of student errors.
      *   *Structure:* Follow the prompt's requested order strictly.
      *   *Check:* Did I explain superrationality? No, prompt says "Don't explain it to me."
      *   *Check:* Did I choose Platonia or Lottery? I'll argue for Platonia for clarity, but acknowledge Lottery's appeal. Actually, the Lottery is *better* for showing the "race to the bottom" of standard rationality. But Platonia is better for the "symmetric strategy" insight. Let's go with **Platonia** because the solution ($1/N$ probability) is a specific, actionable algorithm that feels distinct from "cooperate."
      *   *Wait, one nuance:* In Platonia, the superrational solution is to randomize. In the Lottery, it's to send 1 entry (if everyone does) or calculate the optimal $N$. Hofstadter's actual column resulted in people sending *thousands* of entries. The Lottery demonstrates the *failure* of people to be superrational better. But for *teaching* the concept, Platonia is cleaner. I will recommend Platonia for the *teaching* session.
      *   *Re-evaluating the "PD is a trap" section:* Make sure to highlight that PD invites moralizing. Platonia is pure greed.
      *   *Re-evaluating the Closing Question:* The "one irrational actor" question is good. It tests the symmetry condition.

  10. **Final Polish:** Ensure the voice sounds like a seasoned philosopher (cautious, precise, focused on cognitive traps).

  *(Self-Correction on the Closing Question)*: A better question might be: "If the prize was split equally among all who sent telegrams (instead of requiring exactly one), how does the superrational strategy change?" No, that changes the game too much.
  Let's stick with the "Break the Symmetry" question. "Suppose you know for a fact that one of the other 19 participants is your twin, but the other 18 are strangers. Do you treat the twin differently?"
  Actually, the strongest test is: "Does superrationality require you to actually flip a coin, or just to decide on a probability?"
  No, the "One Irrational Actor" is the strongest test of the *dependency on symmetry*. If symmetry breaks, the logic fails.
  Let's refine that: "If you know one other person will definitely send a telegram, what is your superrational move?" (Answer: Don't send. The symmetry is broken, so you revert to causal reasoning).

  Okay, ready to write.

  *(Final check on constraints)*: "Act like a philosopher who's taught decision theory to non-specialists and thinks carefully about where people trip." -> Tone check. "Start by brainstorming the dependency order." -> Check. "Tell me which one example." -> Check. "Why PD is a trap." -> Check. "Misconceptions." -> Check. "What to refuse." -> Check. "Closing question." -> Check.

  Let's assemble.
answer: |-
  Here is the pedagogical architecture for your session. I've taught this material enough to know that the intuition is fragile; if you load the wrong concept too early, the whole structure collapses into "it's just being nice" or "it's magic."

  ### 1. The Dependency Order (Conceptual Scaffolding)

  You cannot introduce "superrationality" as a standalone term. It must be the solution to a problem they feel in their bones. Build the ladder in this exact order:

  1.  **Instrumental Rationality (The Baseline):** Establish that we are talking about *winning*, not morality. The goal is maximizing expected payoff for oneself. If they think this is about ethics, you've already lost.
  2.  **The Symmetry Premise:** Establish that all participants are relevantly identical (same information, same reasoning capacity, same incentives). This is the fulcrum. Without this, the rest is noise.
  3.  **The Failure of Causal Reasoning:** Demonstrate that standard "what causes the best outcome for me?" reasoning leads to a guaranteed zero payoff in this specific setup. They need to feel the frustration of the Nash equilibrium.
  4.  **Logical Correlation (The Bridge):** Introduce the idea that in a symmetric setup, my decision is *evidence* of your decision, not because I influence you, but because we are running the same algorithm.
  5.  **Superrationality (The Solution):** Define it as choosing the strategy that yields the highest payoff *given that everyone chooses that same strategy*.

  **Dependency:** You cannot do step 4 without step 2. You cannot do step 5 without step 3. If you skip step 1, they will treat it as a moral puzzle.

  ### 2. The Central Example: Choose Platonia

  Drop the Luring Lottery for the core teaching moment. Use **Platonia**.

  **Why Platonia carries the session:**
  *   **Binary Clarity:** The choice is Send/Don't Send. The Lottery involves choosing an integer $N$, which invites math anxiety and calculus distractions ("What's the derivative of the expected value?"). Platonia keeps the focus on the *logic of choice*.
  *   **The Probabilistic Solution:** The superrational solution to Platonia is elegant and counter-intuitive: everyone must randomize with probability $p = 1/N$. This forces them to accept that "rationality" can mandate a *dice roll*. The Lottery solution (send 1 entry) feels too much like "just be reasonable." Platonia's solution feels like a distinct *mode* of thinking.
  *   **Stark Payoff Structure:** In the Lottery, if everyone over-enters, you still get *something* (just less). In Platonia, if everyone reasons standardly, everyone gets *zero*. The stakes for the reasoning failure are absolute.

  **What Platonia must have:**
  *   **Strict Isolation:** Emphasize the "no coordination" rule repeatedly. If they think they can signal, the puzzle vanishes.
  *   **High Stakes:** Keep the billion dollars. It needs to be high enough to shut down "I wouldn't do it for moral reasons" noise.

  **What Platonia must lack:**
  *   **Iterated Play:** This is a one-shot. Do not let them drift into "I'll send one now to signal for next time."
  *   **Reputation:** They are strangers. No future interactions.

  ### 3. Why the Prisoner's Dilemma is a Trap

  You are right to avoid it. Here is why, specifically for a mixed crowd:

  1.  **Moral Contamination:** In PD, "Cooperate" sounds virtuous and "Defect" sounds villainous. Students will conflate superrationality with altruism. In Platonia, "Send" is greedy and "Don't Send" is passive. There is no moral valence, which keeps the focus on *instrumental* rationality.
  2.  **Entrenched Intuitions:** Everyone thinks they know PD. Half think "Defect is dominant," half think "Tit-for-Tat solves it." You will spend the whole hour untangling Iterated vs. One-Shot PD. Platonia is fresh ground.
  3.  **The "Nice" Fallacy:** In PD, superrationality looks like Cooperation. In Platonia, superrationality looks like *Randomization*. Randomization is harder to dismiss as "just being nice." It forces them to engage with the mechanism.

  ### 4. Misconceptions and Intervention Points

  Here are the three specific cognitive traps they will fall into, and exactly when to slam the door on them.

  **Trap A: "Superrationality is just the Categorical Imperative (Kant)."**
  *   *The Error:* They will think, "I should act as if everyone does it" is just a moral rule.
  *   *When to head it off:* **Step 1 (Instrumental Rationality).**
  *   *The Intervention:* State explicitly: "This is not about duty. This is about greed. You are not randomizing because it is fair. You are randomizing because if you don't, and everyone else is as smart as you, you guarantee yourself zero dollars. Morality is irrelevant; only the payoff matrix matters."

  **Trap B: "Magical Thinking / Telepathy."**
  *   *The Error:* "If I choose to send, that *makes* you choose to send." They think their will reaches out and touches the others.
  *   *When to head it off:* **Step 4 (Logical Correlation).**
  *   *The Intervention:* Use the "Calculator Analogy." "If you and I both have the same calculator, and we both type '2 + 2', we both get '4'. My calculator doesn't send a signal to yours. We just run the same function. Superrationality assumes you and I are running the same reasoning function. I am not causing your output; I am predicting it because I know my own code."

  **Trap C: "It requires Trust."**
  *   *The Error:* "I'll randomize only if I trust you to do it too."
  *   *When to head it off:* **Step 2 (The Symmetry Premise).**
  *   *The Intervention:* "Trust implies you have a choice to betray. Symmetry implies you *don't* have a choice distinct from mine. If you are rational, you *must* conclude what I conclude. It's not trust; it's geometry."

  ### 5. What to Openly Refuse to Cover

  You must set boundaries early, or the two game-theorists in the room will hijack the session into technical weeds. Say this out loud at the start:

  *"We are not going to discuss Causal Decision Theory vs. Evidential Decision Theory vs. Functional Decision Theory. We are not going to draw Nash Equilibrium matrices. We are not going to discuss what happens if we play this game ten times in a row. We are looking at one specific logical move in a one-shot symmetric scenario. If you want to debate the formal axioms of decision theory, stay after class. For this hour, we are just trying to win the billion dollars."*

  This protects the non-specialists from feeling out of their depth and keeps the specialists from pedantry.

  ### 6. The Closing Question

  Do not ask "Does everyone understand?" They will nod. Do not ask "What is the answer?" They will memorize $1/20$.

  Ask this:

  > **"Suppose you know for a fact that one of the other 19 participants is irrational: they have already decided they are definitely sending a telegram. Does the superrational strategy change, and if so, why?"**

  **Why this works:**
  *   **The Correct Answer:** Yes, it changes. You should definitely *not* send a telegram.
  *   **What it Tests:** It tests if they understand that **Symmetry** is the engine of superrationality. If symmetry is broken (one person is not running the same reasoning algorithm), the superrational logic collapses, and you revert to standard causal reasoning (since someone else is already sending, your sending guarantees loss).
  *   **The Failure Mode:** If they say "No, I still randomize because I should be superrational," they missed the point entirely. They treat superrationality as a moral vow rather than a conditional logical strategy.

  If they nail that, they get it. If they don't, you know exactly where the breakdown happened (likely in the Symmetry Premise).
