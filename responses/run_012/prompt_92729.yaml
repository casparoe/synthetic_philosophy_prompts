answer: |-
  The enterprise yields an impossibility result: no theory can simultaneously satisfy the demand to include structural and omissive harm while maintaining the objective measurability required for a transhistorical index.

  To construct an index, a theory of violence must deliver specific operational capabilities, each motivated by the cases you provided. **First, the Agency Filter** must distinguish harm inflicted against will from harm consented to or administered for benefit; this is motivated by the **surgeon's incision and boxing match**, where physical damage occurs but violence is absent due to consent and social license. **Second, the Causal Attribution Mechanism** must assign responsibility for harm resulting from inaction or complex systems; this is motivated by the **vaccination lapse versus engineered famine**, where the physical outcome (death) is identical but the causal chain (negligence versus intent) differs. **Third, the Structural Capacity** must account for harm embedded in institutions rather than discrete acts; this is motivated by the **slave economy and segregated deprivation**, where no single blow is struck yet coercion is total. **Fourth, the Phenomenological Scope** must recognize harm without physical contact; this is motivated by the **terrorizing parent**, where psychological damage equals or exceeds physical beating. **Fifth, the Reflexivity Clause** must categorize cases where the agent and victim are identical; this is motivated by **suicide**, challenging the definition of violence as inherently interpersonal.

  Regarding distinctions, the theory cannot collapse **violence and force**, lest legitimate policing or self-defense be indistinguishable from assault; **coercion and harm**, lest threats without execution count equally with battery; **act and omission**, lest all preventable death become violence; **intended and foreseen**, lest collateral damage equal targeted killing; and **physical and psychological**, lest the index miss trauma or overcount rough contact. For measurement, the theory must specify whether the index tracks **event counts or population rates**; if rates, it must define the denominator, which is unstable for medieval populations (estimated via hearsay, tax records, or archaeology) compared to modern censuses, introducing error margins that may swamp genuine differences in violence. The theory must honor **consistency across time**, ensuring "violence" means the same thing in 1300 as in 2000, despite shifting norms on corporal punishment or warfare. The surviving historical record permits only coarse-grained data for medieval regions (battle deaths, execution records, skeletal trauma), whereas modern data allows fine-grained inclusion of domestic abuse and psychological harm; a theory requiring the latter cannot generate a comparative index.

  Ontologically, the enterprise presupposes violence is a **natural kind** with a fact of the matter only if it excludes normative judgment; however, satisfying your case set requires normative judgments (e.g., is segregation violence?), meaning "how much violence" is inescapably relative to the moral category chosen. This destroys the idea of an objective index, rendering it a measure of moral disagreement rather than physical events.

  **Classification of Requirements and Cases**

  *   **Non-Negotiable Requirements:** The Agency Filter (consent distinguishes surgery from assault); Historical Feasibility (data must exist for both periods); Consistency (categories must be stable across time).
  *   **Parochial Requirements:** The Structural Capacity (defines violence as injustice, a specific political camp); The Reflexivity Clause (suicide is typically excluded from violence statistics); The Phenomenological Scope (psychological harm is often categorized separately from violence).
  *   **Genuine Constraints vs. Preoccupations:**
      *   *Surgeon/Boxing:* Genuine constraint (consent/normativity).
      *   *Famine/Blockade:* Genuine constraint on causation, but classifying omission as violence is a preoccupations of the "structural violence" camp.
      *   *Slave/Segregation:* Preoccupation of the critical theory camp (metaphorical violence vs. literal).
      *   *Parent/Child:* Genuine constraint on harm, but classifying non-physical abuse as "violence" is contested.
      *   *Suicide:* Preoccupation of philosophical inquiry; criminological theories exclude it.
  *   **Incompatible Subset:** The **Structural Capacity** requirement cannot be jointly satisfied with **Historical Feasibility** and **Objective Measurability**. You cannot quantify structural violence in medieval regions with sparse records, nor can you define it objectively without importing modern political judgments about what constitutes "deprivation."
  *   **Single Ruling-Out Requirement:** The demand that the theory **quantify structural and omissive harm objectively**. This rules out physicalist theories (which miss the harm) and critical theories (which cannot measure it consistently across epochs).
  *   **Surviving Families of Approach:**
      1.  **Narrow Physicalist/Behaviorist:** Defines violence as direct physical force causing injury. *Survives:* Measurement, History, Objectivity. *Fails:* Structural, Omission, Psychological cases.
      2.  **Normative/Political:** Defines violence as violation of rights or potential. *Survives:* Structural, Omission, Psychological cases. *Fails:* Measurement, History, Objectivity (becomes a measure of injustice, not violence).
      3.  **Institutional/Legal:** Defines violence as acts prohibited by law. *Survives:* Clarity. *Fails:* Transhistorical comparison (laws change drastically) and Moral Adequacy (legal slavery was not "violence" then).

  No theory satisfies all desiderata; you must choose between a precise index of physical force or a vague index of suffering.
