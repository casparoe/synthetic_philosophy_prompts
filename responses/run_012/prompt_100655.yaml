prompt: |-
  I'm putting together a one-page proposal for a small workshop my department might fund, and I need help turning a half-formed idea into something with an actual question. Here's the idea: the boundary problem -- who gets to be part of the demos? -- is usually framed as a paradox about constituting a people before there's a people to do the constituting. I want to try a different cut: treat the demos not as a set of persons but as a set of claims that get bundled together for decision-making. Then the question becomes what makes a bunch of claims belong to the same demos rather than getting split across two, and whether that helps with cases like secession, immigrants, and future people. Can you write the proposal? I need the question stated precisely, why the usual answers (all-affected-interests, all-subjected-to-coercion, and so on) leave it open, the method -- what I'd actually do in a workshop paper -- what a good result would look like, and what would count as the project failing. Keep it under 700 words, no citations, I'll add those myself. American English, and lead with the bottom line.
