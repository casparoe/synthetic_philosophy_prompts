answer: |-
  This proposal requests support to develop a workshop paper that dissolves the democratic boundary paradox by shifting the unit of analysis from persons to claims. Standard theory asks who belongs to the people before the people exist to decide. I propose treating the demos not as a set of persons but as a set of claims bundled together for decision-making. This reframing allows us to bypass the circularity of constituent power and address hard cases like secession and intergenerational justice.

  **The Precise Question**
  The project addresses a single question: Under what functional conditions do distinct political claims coalesce into a single democratic unit rather than remaining separate or fragmenting? By focusing on the compatibility and interdependence of claims rather than the status of claimants, we can determine boundaries based on the logic of decision-making rather than the metaphysics of peoplehood.

  **Why Current Solutions Fail**
  Existing principles, such as all-affected interests or all-subjected to coercion, remain indeterminate because they rely on pre-existing boundaries to measure effects or coercion. To know who is affected, we must already know the scope of the decision, which is precisely what is in question. These approaches prioritize the agent over the object of politics. Consequently, they struggle with hard cases. In secession, they cannot determine if a subgroup is affected enough to leave. For immigrants, they cannot decide if future effects count as current membership. For future people, they cannot reconcile non-existence with affectedness. The person-centric view creates a zero-sum game of inclusion and exclusion that a claim-centric view might dissolve.

  **Method**
  The workshop paper will develop a taxonomy of political claims based on interdependence and incompatibility. I will argue that claims belong to the same demos when their resolution is logically or practically inseparable without generating externalities that undermine the legitimacy of the decision. I will apply this framework to three test cases:
  1.  **Secession:** Do territorial claims bundle with national economic claims?
  2.  **Immigration:** Do residency claims bundle with citizenship claims?
  3.  **Future Generations:** Do temporal claims bundle with present policy claims?
  The analysis will involve conceptual modeling rather than empirical case study, focusing on the logical conditions for claim bundling.

  **Success and Failure Criteria**
  A successful outcome will produce a principled criterion for claim bundling that resolves at least one of the test cases without relying on circular definitions of peoplehood. It should demonstrate that shifting the unit of analysis from persons to claims reduces the paradoxical nature of constituent power. A publishable result would offer a normative rule for when claims must be decided together.

  The project fails if the claim-based framework merely disguises the original personhood problem, such as if claims are defined solely by the persons holding them. It also fails if the bundling criteria prove so flexible that they justify any boundary, rendering the theory vacuous. If the model cannot distinguish between a local zoning dispute and a constitutional convention, it lacks the necessary granularity for democratic theory. If I cannot articulate why some claims bundle while others do not without smuggling in assumptions about membership, the approach is untenable.

  This reframing offers a pathway to dissolve the boundary paradox rather than solve it within the old constraints. Funding this workshop will allow me to pressure-test this conceptual shift against expert feedback before submitting for publication.
