      **Project Title:** Bundling Claims: A New Approach to the Democratic Boundary Problem

      **Bottom Line:** This workshop paper proposes resolving the democratic boundary problem by shifting focus from defining the membership of persons to defining the bundling of political claims.

      **The Question:** Standard democratic theory faces a paradox: a people must constitute themselves before they can vote on who belongs to them. This project asks: Under what functional conditions do distinct political claims coalesce into a single democratic unit rather than remaining separate or fragmenting? By treating the demos not as a pre-existing set of persons but as a contingent aggregation of claims requiring joint decision-making, we can bypass the circularity of constituent power.

      **Why Current Solutions Fail:** Existing principles like all-affected interests or all-subjected to coercion remain indeterminate. To measure who is affected or subjected, we must already know the scope of the decision-making unit, which is precisely what is in question. These approaches prioritize the *agent* (the voter) over the *object* (the claim). Consequently, they struggle with hard cases. For secession, they cannot determine if a subgroup is affected enough to leave. For immigrants, they cannot decide if future effects count as current membership. For future people, they cannot reconcile non-existence with affectedness. The person-centric view creates a zero-sum game of inclusion/exclusion that the claim-centric view might dissolve.

