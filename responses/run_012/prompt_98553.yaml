  # The Trillionaire's Diagnostic Tree

  This instrument is designed to sort your twenty contestants not by personality, but by the structural logic they apply to strategic interaction. It consists of eight branch nodes. To use it, walk a character through the questions in order. The path they take determines their decision-theoretic leaf.

  **Note on Structure:** The tree prioritizes high-level commitment (Node 1 & 2) before drilling into specific mechanistic differences (Nodes 6–8). Incoherent paths are flagged where they occur.

  ### Node 1: The Telegram Game (Standard)
  **Question:** In the standard Telegram Game (no prior information, collusion forbidden), do you send the telegram?
  *   **Yes:** Go to Node 8.
  *   **No:** Go to Node 2.

  ### Node 2: The Meta-Question
  **Question:** Do you believe these puzzles have a single, uniquely rational solution that any perfectly logical agent would find?
  *   **No:** **Leaf: Deflationary Skeptic.**
  *   **Yes:** Go to Node 3.

  ### Node 3: The Telegram Game (Isolation)
  **Question:** In the Telegram Game, if you knew for a fact that your choice was causally isolated from the others and provided no evidence about their choices (i.e., your choice does not influence or correlate with theirs), would you send?
  *   **Yes:** **Leaf: Evidential Decision Theorist.**
  *   **No:** Go to Node 4.

  ### Node 4: The Lottery (Baseline)
  **Question:** In the Lottery Game, do you submit exactly one entry, sacrificing individual probability to maximize the expected payout per capita?
  *   **No:** **Leaf: Incoherent Coordinator.** (Diagnosis below).
  *   **Yes:** Go to Node 5.

  ### Node 5: The Lottery (Defection)
  **Question:** In the Lottery Game, if you knew for a fact that the other 19 contestants would each submit 100 entries, would you still submit only one?
  *   **Yes:** **Leaf: Kantian Universalizer.**
  *   **No:** Go to Node 6.

  ### Node 6: The Fusion Game (Pledge)
  **Question:** In the Fusion Game, you publicly pledge a number. In Round 2, you realize breaking the pledge would increase your expected payout and no one can prove you lied. Do you break it?
  *   **Yes:** **Leaf: Superrationalist.**
  *   **No:** Go to Node 7.

  ### Node 7: The Fusion Game (Update)
  **Question:** In the Fusion Game, after seeing the Round 1 multiset, do you adjust your Round 2 submission away from your pre-game plan to account for the new data?
  *   **Yes:** **Leaf: Timeless Decision Theorist.**
  *   **No:** **Leaf: Updateless Decision Theorist.**

  ### Node 8: The Variant (Known Sender)
  **Question:** In the Variant where one contestant is known in advance to be sending a telegram, do you send?
  *   **Yes:** **Leaf: Dogmatic Causalist.** (Diagnosis below).
  *   **No:** **Leaf: Causal Decision Theorist.**

  ***

  ## The Leaves: Commitments and Embarrassments

  **1. Causal Decision Theorist (CDT)**
  *   **Commitment:** Rationality is about controlling the physical world through your own causal leverage; correlations you cannot cause are irrelevant.
  *   **Embarrassing Commitment:** "I would rather guarantee everyone gets nothing than rely on a correlation I didn't cause."

  **2. Evidential Decision Theorist (EDT)**
  *   **Commitment:** Rationality is about choosing actions that provide the best news about the state of the world, including the likely actions of others.
  *   **Embarrassing Commitment:** "I avoid sending the telegram not because it causes failure, but because sending would be bad news."

  **3. Superrationalist**
  *   **Commitment:** Rationality assumes identical reasoners will reach identical conclusions; we coordinate by thinking alike, not by promising.
  *   **Embarrassing Commitment:** "I honor the pledge only as long as the logic holds; if the math changes, the promise vanishes."

  **4. Timeless Decision Theorist (TDT)**
  *   **Commitment:** Rationality is about the output of your decision function; you pre-commit logically but update on new information that isn't logically determined by your choice.
  *   **Embarrassing Commitment:** "I treat my pledge as binding logic, but I will change my mind if the data shifts."

  **5. Updateless Decision Theorist (UDT)**
  *   **Commitment:** Rationality is about choosing the best policy before receiving any information; you never update against your original optimal plan.
  *   **Embarrassing Commitment:** "I will ignore clear data in Round 2 because I should have planned for it in Round 1."

  **6. Kantian Universalizer**
  *   **Commitment:** Rationality is normative, not descriptive; you act on the maxim you wish were universal law, regardless of whether others comply.
  *   **Embarrassing Commitment:** "I will lose the lottery on principle even if I know everyone else is cheating."

  **7. Deflationary Skeptic**
  *   **Commitment:** Rationality is a tool for clear thinking, not an oracle; these puzzles rely on ambiguous premises that logic cannot resolve.
  *   **Embarrassing Commitment:** "I refuse to play the game because the rules don't define 'rational' well enough."

  **8. Dogmatic Causalist**
  *   **Commitment:** Dominant strategies must always be played, even when the payoff matrix suggests futility.
  *   **Embarrassing Commitment:** "I will send the telegram even when I know it guarantees zero payout for everyone."

  ***

  ## Diagnostic Notes: Collapses and Incoherencies

  **1. The Team Reasoning Collapse**
  You asked for Team Reasoning as a distinct position. In this specific set of games, **Team Reasoning collapses into Superrationality.** Both positions answer "No" to the Telegram, "One Entry" to the Lottery, and "No" to the Lottery Defection question (because if the team is defecting, the "We" agent reverts to individual maximization). To separate them, you would need a game where acting for the group requires sacrificing utility *even when* the group is not reciprocating, which contradicts the instrumental nature of Team Reasoning. For your novel, treat them as the same character archetype: the pragmatic collectivist.

  **2. The TDT/UDT Split**
  Node 7 attempts to separate Timeless and Updateless Decision Theory. Be aware this is a fine cut. In many formulations, TDT and UDT yield identical answers in the Fusion Game unless the Round 1 data is logically correlated with the decision algorithm itself. If your characters are not computer scientists, this distinction may read as hair-splitting. Consider merging them into a single **Functionalist** leaf if the plot does not hinge on the value of pre-commitment versus flexibility.

  **3. Incoherent Coordinator (Node 4)**
  A character who refuses to send the Telegram (claiming coordination) but submits maximum Lottery entries (claiming selfishness) is logically inconsistent. They want the benefit of cooperation without the cost. In a novel, this is a excellent flaw for a hypocrite or a confused amateur. They believe they are "smart" but lack a unified theory.

  **4. Dogmatic Causalist (Node 8)**
  Standard CDT dictates *not* sending in the Variant (Node 8) because the causal outcome is guaranteed zero. A character who answers "Yes" at Node 1 (Standard) and "Yes" at Node 8 (Variant) is not a pure CDT; they are a heuristic thinker who blindly follows "dominant strategies" without reading the payoff matrix. This is a distinct, less sophisticated character than the rigorous CDT.

  **5. The Empty Node**
  There is no path to a leaf where a character answers "No" to Telegram (Node 1), "No" to Isolation (Node 3), but "Yes" to Lottery Defection (Node 5) and "Yes" to Pledge Breaking (Node 6). This combination implies a Kantian duty to coordinate without the logical machinery to enforce it. It is an unattractive position: moralizing without power. Use it only for a character destined to fail tragically.

  **6. The Deflationary Early Exit**
  Node 2 allows a character to exit the logic game entirely. This is the most dangerous position for a trillionaire's contest, as it justifies refusing to optimize. In a narrative, this character is either the wisest (seeing the trap) or the most cowardly (hiding behind ambiguity).
