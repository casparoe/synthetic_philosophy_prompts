          5.  Summary of Moves & Evidence.

      *   *Refining the "Artifact" point:* The user asks: "If you think the whole thing is an artifact of how I framed desirability, say so and put a number on that too."
      *   *My thought:* Yes, it is largely an artifact. If "Moral Value" is truly *Expected* and *Impartial*, it *should* internalize the costs of being a lousy friend or burning out. If the Saint is defined as maximizing *act* value without regard for *rule* or *character* consequences, the definition is flawed. I'll assign a high probability (0.8) that the paradox is definitional.

      *   *Refining Credence 1:* 0.4 -> 0.45. Why? Because "meaning" is a huge component of well-being, and saints have max meaning. But "joy" is low. Net neutral-ish.
      *   *Refining Credence 2:* 0.6 -> 0.55. The "lousy friend" point is strong. Impartiality corrodes partial relationships which are often the site of greatest good.
      *   *Refining Credence 3:* 0.5 -> 0.75. Generalization is the killer. A world of saints is a world of pure sacrifice with no beneficiaries (since everyone is sacrificing).

      *   *Sub-questions:*
          *   Q1: Is well-being monistic or pluralistic?
