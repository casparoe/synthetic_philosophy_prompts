      *(Self-Correction during drafting)*: Be careful with the definition of "Saint". If the Saint maximizes *expected* value, she accounts for the "lousy friend" downside. So why would she be a lousy friend? Because impartial morality *demands* it. This implies impartial morality *undervalues* partial relationships. This is the crux. I need to highlight that the tension isn't in the Saint, it's in the Morality.

      *Revised Plan:*
