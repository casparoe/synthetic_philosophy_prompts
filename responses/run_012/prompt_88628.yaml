      *   *Reductionist Defense:* Normative vs. Descriptive. We *ought* to have reasons, even if we use heuristics.
      *   *Verdict:* It's an "Awkward" defeater. It suggests the norm is alien to our cognitive architecture. If the norm is too detached from how we function, is it useful?

