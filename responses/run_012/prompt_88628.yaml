          *   **The Circularity/Regress Problem:** If *all* non-testimonial grounds ultimately rely on past testimony (e.g., knowing how to read a map, knowing what a thermometer is), then the "non-testimonial" requirement is empty. If the reductionist admits *some* testimony is needed to bootstrap the reliability checks, they risk collapsing into anti-reductionism.
      *   *Awkward (but survivable):*
          *   **The Child/Novice Problem:** Children acquire language and basic facts before they have the capacity for inductive reliability checks. *Reductionist reply:* We are talking about *justification*, not causal acquisition, or we appeal to proxy agents (parents). It's awkward but not fatal if one distinguishes development from normativity.
          *   **Expertise Asymmetry:** In high-stakes specialist fields (medicine, physics), the layperson *cannot* check reliability non-testimonially. *Reductionist reply:* You justify trusting the *institution* or the *process*, not the specific utterance. Again, survivable but requires work.

