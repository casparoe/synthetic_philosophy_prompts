  You have described a structural problem in ontology that appears wherever human intention interfaces with physical reality. You are correct that no single established term captures the specific combination of features you listed: the sharpness within a frame, the inversion across frames, the empirical discoverability within the frame, and the constraint of the material substrate.

  The closest established concepts are **"Institutional Facts"** (John Searle), **"Functional Kinds"** (philosophy of artifacts), and **"Thick Concepts"** (ethics/language). Each fails on a specific boundary you drew.

  **Institutional Facts** fit the logic perfectly ("X counts as Y in context C"). They are ontologically subjective (dependent on human agreement) but epistemically objective (once agreed, it is a fact that this is checkmate). However, this term usually implies broad social institutions (money, marriage, government). Your cases (a private garden, a single developer's spec) often lack the "collective intentionality" Searle requires, and the term carries a sociological weight that obscures the physical constraints you emphasized.

  **Functional Kinds** fit the purpose-dependence (a hammer is defined by hammering). However, this term is typically reserved for artifacts. A plant in a meadow is not an artifact, yet it becomes a "desired species" via the same logical move. Furthermore, functional kinds usually imply a stable function, whereas your cases highlight the *inversion* of status (good/bad, defect/feature) based on shifting goals.

  **Thick Concepts** fit the blend of description and evaluation. However, as you noted, thick concepts are often treated as having fuzzy edges or being primarily ethical. Your cases have sharp, empirically settleable edges once the purpose is fixed, which distinguishes them from standard thick concepts like "cruel" or "brave."

  Because the existing terms either imply too much social convention, too much artifactuality, or too much ethical fuzziness, I will coin a term that isolates the logical structure you identified.

  ### The Concept: Teleological Kind

  A **Teleological Kind** is a category whose membership is objectively determinable by empirical facts only relative to a specified end-state or function, such that changing the governing purpose can invert membership without altering the physical substrate.

  **Boundaries and Edge Cases:**

  1.  **Contested Purpose:** When the purpose is not fixed (e.g., a land trust debating whether a field is for "historical preservation" or "biodiversity"), the Teleological Kind becomes unstable. The category does not vanish, but its extension becomes indeterminate until the telos is resolved. This is where the argument shifts from empirical ("Is this plant native?") to normative ("What are we for?").
  2.  **Dual Purposes:** When two purposes are held at once (e.g., code that must be "secure" and "fast"), an entity can be a member of a Teleological Kind under one description and a non-member under the other simultaneously. This creates a "conflict of kinds" rather than a fuzzy edge; the object is objectively a defect relative to speed and objectively a feature relative to security.
  3.  **Discovered Purpose:** Sometimes the purpose seems discovered rather than chosen (e.g., "The purpose of the heart is to pump"). In these cases, the Teleological Kind masquerades as a Natural Kind. The boundary is crossed when the purpose is treated as intrinsic to the object rather than imposed by the observer's framework. Your cases are distinct because the purpose is explicitly acknowledged as external (the spec, the garden plan).

  This concept validates your intuition that these categories are "perfectly real." They are real relations between an object and a goal. The error people make is treating them as intrinsic properties of the object (Natural Kinds) rather than relational properties of the system (Teleological Kinds).

