answer: |-
  ### Exam Question

  **Course:** MA Seminar in Moral Uncertainty & Invertebrate Status
  **Time Allowed:** 50 Minutes
  **Instructions:** Closed Book. Answer the following question in essay form.

  **The Scale Principle and the Mugging Objection**

  Consider a hypothetical normative rule, the **Scale Principle**: *For any policy decision, calculate the expected moral value by summing across all affected taxa: (Number of Individuals) × (Credence that a typical member is sentient) × (Expected Welfare Change per Individual). Choose the policy that maximizes this sum.*

  Applied to pesticide regulation, assume there are $10^{18}$ insects affected. Even if we assign a mere $10^{-6}$ credence to insect sentience, the expected number of sentient lives at stake is $10^{12}$. This figure swamps any plausible human welfare impact. Consequently, the Scale Principle demands we prioritize insect welfare over almost all human interests.

  A critic objects that this is structurally identical to **Pascal's Mugging**: a stranger threatens you with absurd disutility unless you pay a small cost, resting on a probability that seems stipulated rather than evidence-based.

  **Essay Task:**
  Evaluate this objection. Does the Mugging analogy successfully undermine the Scale Principle? Do not simply restate the Scale Argument. Instead, identify *where* the disanalogy or failure lies. Is the error in the magnitude of the numbers, the size of the probability, or the epistemic status of the credence itself? Propose a specific repair to the decision rule that avoids the Mugging outcome, and explain what normative or epistemic cost this repair incurs.

  ***

  ### Model Answer

  The Mugging objection successfully undermines the Scale Principle, but not for the reason usually assumed. The intuitive resistance to the Scale Principle is often dismissed as "scope neglect"—a psychological inability to grasp large numbers. However, the Pascal's Mugging analogy reveals that the problem is not the magnitude of the population ($10^{18}$) nor the magnitude of the expected value ($10^{12}$). The problem is the epistemic usability of the credence ($10^{-6}$).

  In a standard Pascal's Mugging, the agent is asked to act on a probability that is not derived from a frequency, a model, or a track record, but is merely stipulated to make the math work. If a stranger claims they can simulate $3^{3^{3}}$ lives, assigning a non-zero probability to this claim simply because it is not logically impossible allows any arbitrary assertion to dominate decision-making. The Scale Principle falls into the same trap. Assigning a $10^{-6}$ credence to insect sentience is not the result of a Bayesian update on neuroanatomical data; it is often a placeholder for "I don't know, but it's not zero." When such ungrounded credences are multiplied by astronomical numbers, the output is noise, not signal. The error lies in treating all non-zero probabilities as action-guiding, regardless of their evidentiary basis.

  Therefore, the disagreement is not about big numbers being spooky; it is about what makes a credence *usable* in an expected-value calculation. A credence is only usable if it is robust to scrutiny. If the probability assignment is highly sensitive to arbitrary framing or lacks empirical grounding, it cannot bear the weight of astronomical stakes. The Scale Principle fails because it treats epistemic humility (admitting uncertainty) as a license to act on weak signals when the stakes are high. This inverts the proper relationship between evidence and action: usually, extraordinary stakes require extraordinary evidence, but the Scale Principle allows extraordinary stakes to be generated by extraordinary numbers, bypassing the need for evidence.

  To repair this, we must introduce an **epistemic discount function**. Rather than using raw credences, we discount the weight of a credence based on its fragility or lack of empirical grounding. Alternatively, we could set a **credence floor**, refusing to act on probabilities below a certain threshold (e.g., $10^{-3}$) regardless of the stakes. This prevents the Mugging outcome by severing the link between stipulated tiny probabilities and decisive action.

  However, this repair incurs a significant cost: it blinds us to genuine long-tail risks. If we impose a floor on usable credences, we become incapable of addressing low-probability, high-impact existential threats, such as certain AI risk scenarios or rare ecological collapses, where the probability is genuinely tiny but the stakes are real. Furthermore, an epistemic discount function is itself arbitrary; who decides how "fragile" a credence is? By solving the Mugging problem, we introduce a new problem of epistemic conservatism. We protect ourselves from being mugged by insects, but we may also insulate ourselves from moral truths that are currently difficult to quantify. The Scale Principle is dangerous, but the repair requires us to accept that we will sometimes ignore massive expected values to maintain epistemic hygiene.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Reconstruction of the Conflict (4 Marks)**
  *   **Requirement:** Accurately summarizes the Scale Principle's conclusion (insects dominate) and the Mugging objection (stipulated probabilities dominating action).
  *   **Common Error:** Students spend half the essay defending the Scale Principle or explaining insect sentience science, ignoring the structural Mugging analogy.

  **2. Rejection of Surface-Level Objections (4 Marks)**
  *   **Requirement:** Explicitly argues that the problem is *not* the size of the numbers ($10^{18}$) or the "spookiness" of large aggregates.
  *   **Common Error:** Claiming the argument fails because humans "can't comprehend" large numbers or because insect welfare is intuitively less important (scope neglect).

  **3. Diagnosis of Epistemic Usability (4 Marks)**
  *   **Requirement:** **Critical A/B Divider.** Identifies that the core flaw is the *source* of the credence (stipulated/ungrounded vs. evidence-based) and its usability in EV calculations.
  *   **Common Error:** Arguing the probability is "too small to matter" rather than "too weak to be usable," missing the distinction between magnitude and justification.

  **4. Proposal of Specific Repair (4 Marks)**
  *   **Requirement:** Proposes a concrete mechanism to block the Mugging outcome (e.g., credence floors, epistemic discounting, complexity penalties).
  *   **Common Error:** Suggesting vague solutions like "be more careful" or "get better data" without changing the decision rule.

  **5. Analysis of Normative Cost (4 Marks)**
  *   **Requirement:** Explains what is lost by the repair (e.g., inability to act on existential risk, arbitrariness of thresholds, epistemic conservatism).
  *   **Common Error:** Claiming the repair solves the problem cleanly without trade-offs, or identifying a cost that is irrelevant to moral decision-making.
