prompt: |-
  I'm a postgraduate student in history, and I keep getting stuck on something my supervisor says. We were going through a bundle of nineteenth-century coroner's inquests for a mill town, and I pointed out that the women's depositions are almost all summarised in the clerk's hand, filed under the husband's or father's name, and that the finding aid has a category called 'domestic incidents' that seems to swallow anything involving a wife or a servant. I said I wanted to write a section on how the archive's own categories shape what we can know, and she said, 'The archive speaks for itself.' She wasn't being dismissive exactly -- she meant, I think, that I should just report what the documents say and not read my own politics into them. But the phrase has been rattling around my head, because it seems to be doing a lot of work without anyone saying what it means.

  Can you lay out the different precise claims that 'the archive speaks for itself' could be making, from the almost trivially true to the quite radical? I'd like a menu rather than a single interpretation: e.g. claims about documents being self-interpreting, about archival arrangement being neutral, about the archivist's proper restraint, about provenance being sufficient context, about the user of the archive being the one who supplies meaning, and anything else you think is in there. For each reading, say whether it's a platitude, a substantive and defensible position, or something that's actually false -- and then tell me which reading my supervisor is most likely invoking when she uses it to tell me not to write about the clerk's summaries and the 'domestic incidents' category. I don't need a reading list or citations; I just want the conceptual map, because I have to go back to her office hours on Thursday and I'd like to know what I'm actually disagreeing with.
