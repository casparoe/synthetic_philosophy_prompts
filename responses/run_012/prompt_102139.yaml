answer: |-
  **PHILOSOPHY CLUB: MOCK PAPER (HISTORY STRAND)**

  **Time Allowed:** 45 Minutes
  **Word Count Guide:** 800–1000 Words

  **Question:**
  Consider the two explanations provided for the collapse of the debating society in 2019. Explanation A employs the logical structure of the covering-law model; Explanation B employs a narrative structure culminating in a counterfactual claim.

  Critics of Hempel argue that historical explanation is often *contrastive*: it explains why an event happened *rather than* a specific alternative. Using this case, assess whether Explanation B succeeds in offering a contrastive explanation where Explanation A fails. In doing so, address the following worry: merely showing that an outcome was contingent (that it could have gone otherwise) is not the same as explaining it. Do A and B disagree about what counts as a law, or are they answering fundamentally different questions?

  ***

  **MODEL ANSWER**

  Explanation A functions as a classic Hempelian deductive-nomological argument. It posits a universal generalisation regarding voluntary societies and subsumes the specific instance (the organiser's departure) under it. The conclusion (the collapse) follows deductively. Explanation B, by contrast, offers a causal narrative detailing specific friction points (the feud, the timetable, the recruitment numbers) and concludes with a counterfactual: had one more member joined, the society would have survived.

  The central philosophical distinction here concerns the object of explanation. Explanation A addresses why the event happened *at all*. Given the law and the initial conditions, the collapse was nomologically necessary. It treats the event as an instance of a recurring pattern. Explanation B, however, seems tailored to answer why it happened *rather than* continued. By highlighting the fragility of the outcome—the recruitment drive failed by a single member—B explains the collapse by showing how close survival was. This supports the view that historical explanation is often contrastive. A explains the necessity of the collapse given the structural weakness; B explains the actualisation of collapse given the specific contingency of recruitment.

  However, the prompt raises a critical objection: stating that an outcome was contingent explains nothing. If B merely said, "It could have survived," it would indeed be vacuous. But B does more; it identifies the *causal mechanism* of the contingency. It specifies that the timetable clash and the feud reduced the recruitment pool, making the margin for error slim. Thus, B explains the collapse not by proving it was inevitable, but by detailing the specific causal chain that tipped the balance in a precarious situation. On this view, B explains the *timing* and *specificity* of the collapse in a way A cannot. A implies the collapse was inevitable the moment the organiser left; B suggests it was a near-run thing that depended on specific, alterable factors.

  Do A and B disagree about laws, or questions? A proponent of A might argue B implicitly relies on laws (e.g., "if recruitment falls below $X$, societies collapse"). If so, the disagreement is merely about explicitness: A states the law, B hides it in the narrative. However, this misses the nuance of the counterfactual. B's claim is not just that a threshold was crossed, but that the threshold was crossed *precariously*.

  It is more plausible to view them as answering different questions. A answers: "Was the collapse consistent with general sociological patterns?" B answers: "What specific factors determined the outcome in this specific instance?" If explanation requires showing necessity (as Hempel suggests), A is superior. If explanation requires reconstructing the causal process to show how one alternative was ruled out over another (as narrative theorists suggest), B is superior.

  There is no consensus on which question constitutes "true" historical explanation. A defends the scientific status of history; B defends its autonomy as a discipline focused on human agency and contingency. To claim B is better is to take the side that history is about understanding specific human contexts, not subsuming them under generalisations. To claim A is better is to prioritise predictive power and logical rigour over narrative detail. The dispute is not merely about the presence of laws, but about whether the goal of history is prediction or understanding.

  ***

  **MARKING SCHEME (Total: 20 Marks)**

  **1. Characterisation of Explanation A (4 Marks)**
  *   **Requirement:** Correctly identifies A as a covering-law/deductive argument where the event is subsumed under a generalisation to show necessity.
  *   **Common Error:** Describing A simply as "scientific" without mentioning the logical structure (deduction from laws/conditions).
  *   **Marks:** 4 for precise logical description; 2 for vague identification; 0 for misidentification.

  **2. Characterisation of Explanation B (4 Marks)**
  *   **Requirement:** Identifies B as a narrative that relies on specific causal details and explicitly notes the role of the counterfactual claim (the "one more member" point).
  *   **Common Error:** Treating B as merely a "story" without analysing the logical function of the counterfactual conclusion.
  *   **Marks:** 4 for linking narrative to counterfactual; 2 for describing the story only; 0 for ignoring the counterfactual.

  **3. Engagement with the Contrastive Distinction (4 Marks)**
  *   **Requirement:** Explicitly uses the "why X rather than Y" framework to analyse the difference between A (why collapse at all) and B (why collapse then/instead of survival).
  *   **Common Error:** Discussing "laws vs. narratives" without connecting it to the specific logical difference between explaining occurrence vs. explaining selection of outcome.
  *   **Marks:** 4 for clear application of contrastive theory; 2 for mentioning it without application; 0 for omission.

  **4. Addressing the Contingency Worry (4 Marks)**
  *   **Requirement:** Confronts the prompt's worry that "could have gone otherwise" is not an explanation, arguing that B provides the *causal mechanism* of the contingency, not just the possibility.
  *   **Common Error:** Accepting the worry uncritically and dismissing B, or ignoring the worry entirely.
  *   **Marks:** 4 for nuanced resolution (mechanism vs. mere possibility); 2 for acknowledging but not resolving; 0 for ignoring.

  **5. Diagnosis of the Disagreement (4 Marks)**
  *   **Requirement:** Concludes whether the dispute is about the definition of law or the question being asked, acknowledging that philosophy of history has no settled consensus on this.
  *   **Common Error:** Declaring one explanation definitively "correct" as if the philosophical debate is resolved.
  *   **Marks:** 4 for identifying the "different questions" hypothesis and noting lack of consensus; 2 for picking a side without justification; 0 for claiming a settled answer exists.

  **Distinction between A and B Grades:**
  *   **Grade B (10–14 marks):** Accurately describes both explanations and notes that B mentions contingency. However, treats the debate as a simple "Hempel vs. Storyteller" conflict and may conclude that one model is simply superior.
  *   **Grade A (15–20 marks):** Recognises that A and B may be answering *different questions* (necessity vs. contrastive selection). Explicitly addresses the trap that contingency alone is not explanation. Maintains philosophical neutrality regarding the final verdict, acknowledging the unresolved nature of the discipline.
