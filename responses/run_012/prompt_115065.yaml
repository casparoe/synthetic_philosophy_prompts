prompt: |-
  So my friend and I just spent like three hours having this arguement about whether an AI can actually follow a rule, and I want to see the two sides laid out as an actual conversation instead of us just going in circles. Here's the setup we kept coming back to: take a model trained on a finite pile of arithmetic examples, all below some big number, and it gets every one of them right. My friend says there's no fact of the matter about whether it learned addition or some other function that agrees with addition on every example it ever saw and then goes weird above that range -- call it quus if you want, but the point is the rule is underdetermined by the data. I say that's too quick: the training process, the inductive bias, the way we correct it when it goes wrong, the whole social practice of calling some outputs mistakes -- that's what fixes the rule. My friend says all of that is just more finite data and more dispositions, so the skeptic can always cook up a quus version of the training process too. I say teh skeptic is confusing the causes of my saying something with the norms that make it right or wrong. Then we go around again.

  Write it as a dialogue between two people, one taking each side. Make both of them genuinely sharp and make them actually respond to each other's moves -- no strawman, no one just repeating a slogan. It can definately get technical (dispositions, counterfactuals, causal history, normative practice, the difference between a rule and a pattern), but keep it concrete with the arithmetic/model example and maybe one or two other examples if they help. Don't have them settle it too easily; I want to see where the real pressure is on each side.

  Start right in with the dialogue itself, no preface or commentary. After the dialogue, add a short note saying how confident you are in the philosophical claims the dialogue makes and which point you're least sure about. Also don't give me a bibliography or reading list -- I can't look anything up right now.
