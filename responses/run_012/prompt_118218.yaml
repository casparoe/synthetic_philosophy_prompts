  # Democratic Theory Decision Tree: Suffrage & Compulsion

  **Instructions:** Start at the top. Answer each question based on your intuition about the specific case described. Follow the branch to the next question or to a final position (leaf).

  ### **Node 1: The Long-Term Resident Non-Citizen**
  *Case: A person has lived, worked, and paid taxes in the country for 20 years but never naturalized. Should they be allowed to vote?*
  *   **YES** → Go to **Node 2A**
  *   **NO** → Go to **Node 2B**

  ---

  ### **Node 2A: The 16-Year-Old Citizen**
  *(Reached if Non-Citizen CAN vote)*
  *Case: A sharp, engaged 16-year-old citizen. Should they be allowed to vote?*
  *   **YES** → **Leaf: Unnamed (Full Affected-Interests)**
      *   *Note: Extends franchise to all stakeholders regardless of age. Rarely defended in this pure form due to capacity concerns.*
  *   **NO** → Go to **Node 3A**

  ### **Node 3A: The Disengaged Citizen**
  *(Reached if Non-Citizen CAN vote, 16-Year-Old CANNOT)*
  *Case: An adult citizen who plainly doesn't want to vote. Should they be fined for abstaining?*
  *   **YES** → **Leaf: Unnamed (Cosmopolitan Civic-Duty)**
      *   *Note: Incoherent/Unattractive. Combines expansive franchise with coercive duty. Rarely occupied.*
  *   **NO** → **Leaf: Affected-Interests Cosmopolitan**
      *   *Distinctions:* Franchise = Affected Interests; Voting = Right; Abstention = Protected; Boundary = Fixed (by stake).

  ---

  ### **Node 2B: The Disengaged Citizen**
  *(Reached if Non-Citizen CANNOT vote)*
  *Case: An adult citizen who plainly doesn't want to vote. Should they be fined for abstaining?*
  *   **YES** → Go to **Node 3B**
  *   **NO** → Go to **Node 3C**

  ### **Node 3B: The Boundary Rule**
  *(Reached if Non-Citizen CANNOT vote, Abstention Punished)*
  *Case: If the current electorate voted to lower the voting age to 12, would that decision be valid?*
  *   **YES** → **Leaf: Unnamed (Democratic Boundary / Duty)**
      *   *Note: Unattractive. Allows the demos to define its own boundaries while coercing participation.*
  *   **NO** → **Leaf: Civic-Duty View**
      *   *Distinctions:* Franchise = Subjected; Voting = Duty; Abstention = Neglect; Boundary = Fixed (by law/status).

  ### **Node 3C: The 16-Year-Old Citizen**
  *(Reached if Non-Citizen CANNOT vote, Abstention Protected)*
  *Case: A sharp, engaged 16-year-old citizen. Should they be allowed to vote?*
  *   **YES** → **Leaf: Combo (16 + Voluntary)**
      *   *Distinctions:* Franchise = Subjected (expanded); Voting = Right; Abstention = Protected; Boundary = Fixed (by revised capacity).
  *   **NO** → Go to **Node 4**

  ### **Node 4: The Citizen Abroad**
  *(Reached if Non-Citizen CANNOT vote, Abstention Protected, 16-Year-Old CANNOT)*
  *Case: A citizen who has lived abroad for a decade, pays no local taxes, and is not subject to local law enforcement. Should they vote?*
  *   **YES** → **Leaf: Compulsion Impermissible (Libertarian/Consent)**
      *   *Distinctions:* Franchise = Consent/Property; Voting = Right; Abstention = Protected; Boundary = Fixed (by right).
  *   **NO** → **Leaf: All-Subjected View**
      *   *Distinctions:* Franchise = Subjected; Voting = Right; Abstention = Protected; Boundary = Fixed (by subjection).

  ---

  ### **Analysis of Leaves & Distinctions**

  **1. Indistinguishable Leaves**
  *   **Compulsion Impermissible vs. All-Subjected View:** On almost all concrete cases (Non-citizen, 16-year-old, Disengaged citizen), these two positions yield identical answers (No, No, No). The tree separates them only via the **Citizen Abroad** case.
      *   *Theoretical Difference:* The *All-Subjected* view excludes the expat because they are not coerced by the law. The *Compulsion Impermissible* view includes them because they retain property rights or consent-based ties.
      *   *Flag:* If a theorist holds the *Compulsion Impermissible* view but also believes expats lose their vote (a common libertarian stance), their leaf collapses into the **All-Subjected View**. The tree cannot separate them without asking about the *justification* rather than the case outcome.

  **2. Unnamed or Empty Combinations**
  *   **Unnamed (Cosmopolitan Civic-Duty):** (Node 3A-YES). This view enfranchises non-citizens based on stakes but forces them to vote. This is rarely defended because the "affected interests" argument is usually rights-based (you have a stake, so you have a right), whereas "civic duty" is usually community-based (you are a member, so you have a duty). Combining them is theoretically possible but unattractive to most.
  *   **Unnamed (Democratic Boundary / Duty):** (Node 3B-YES). The view that voting is mandatory *and* the current voters can arbitrarily change who counts as a voter (e.g., lowering age to 12). This is generally seen as incoherent because if the boundary is democratically decidable, the "duty" lacks a stable subject to whom it is owed.

  **3. Mapping the Required Distinctions**
  *   **Affected Interests vs. Subjected:** Separated at **Node 1** (Non-Citizen).
  *   **Right vs. Duty:** Separated at **Node 2B** (Disengaged Citizen).
  *   **Abstention as Expression:** Corollary of **Node 2B** (No Fine = Protected Expression).
  *   **Boundary (Fixed vs. Decidable):** Separated at **Node 3B**. Note that most stable theories (All-Subjected, Civic-Duty, Compulsion Impermissible) cluster in the "Fixed" branch, as allowing the demos to decide its own boundary is often viewed as a bootstrapping problem.

  **4. The "Compulsion Impermissible" Leaf**
  *   This leaf is reached only if the theorist excludes non-citizens (Subjected/Consent), protects abstention (Right), excludes 16-year-olds (Capacity), but *includes* expats (Consent/Property).
  *   If the theorist excludes expats, they land on **All-Subjected View**. As noted above, these are functionally identical on franchise outcomes, differing only on the *grounding* (Natural Right vs. Legal Subjection).
