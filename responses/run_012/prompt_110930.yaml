answer: |-
  Good evening.

  Look at the poster behind you. "Words divide, pictures unite."

  It is a beautiful slogan. It is also, if we are not careful, a lie.

  We want to believe that pictures are universal. We want to believe that a symbol of a worker, or a ton of coal, or a loaf of bread, speaks directly to the eye, bypassing the confusion of language. We want to believe that because we are looking at the same image, we are seeing the same truth.

  Otto Neurath would have warned us against this. He did not call Isotype a language. He called it a "language-like technique." He insisted it was a *helping* language. It never stands alone. It always needs words to hold it up.

  Before I explain why that matters, I have to perform a ritual. I need to thank the people who made this room possible.

  I need to thank [Curator's Name] for curating this show. I need to thank the [Donor Name] Foundation, whose name is on the wall, for funding it. I need to thank the Arntz estate for lending the work.

  And here is the friction. The method you are about to see was built on the idea that individuals do not matter. The charts are made of repeated figures. One worker is identical to the next. Credit was collective. Marie Reidemeister, who transformed most of the data into these images, worked for decades without her name on the wall. So when I stand here and thank specific names, I am violating the grammar of the work itself. I am doing it anyway. Because without these specific people, this collective memory would not be here. Thank you.

  Now. I want to try something.

  [I hold up a printed chart. My hand covers the caption and the key.]

  Look at this. What does it tell you?

  [Pause. Wait three seconds. Let the silence sit.]

  You cannot know. You see shapes. You see colors. You might guess it is about industry, or population. But you cannot read it. Without the key, without the caption, the picture is silent.

  [Uncover the caption.]

  Now you can read it. Not because the picture changed, but because the convention was supplied.

  This is the hard part of Neurath's vision. He insisted on repetition. One figure equals ten thousand people. Two figures equal twenty thousand. He refused to let us make one big figure to represent a million. Why? Because size lies. If I make the symbol twice as big, it looks like four times the amount. The eye is easily tricked. The count is not.

  He knew that images are not transparent. They are built. They are a system of conventions you have to learn, like a map legend. If you do not learn the rules, the picture does not unite you with anyone. It just divides you from the truth.

  So why are we here? Why put these tools in glass cases?

  Neurath had a metaphor for knowledge. He said we are like sailors on a ship, rebuilding the planks while at sea. We cannot go to dry dock. We cannot start from scratch on solid ground. We have to fix the ship while we are floating on it.

  This museum is a dry dock.

  We have taken the tools meant for rebuilding the ship at sea, and we have frozen them. We have called them masterpieces. We have lit them beautifully. There is a tension there. A show like this suggests the work is finished. Neurath knew it never was.

  I do not have a solution for that tension. I do not know how to exhibit a method that insists on being used, not admired. But I know this: the pictures do not speak for themselves. They never did. They need you to learn them. They need you to argue with them.

  So look at the charts. Read the keys. Check the counts. And when you leave this room, take the rules back out into the water with you.

  Thank you.

  ***

  **The move you'll want to soften:** The section on the thanks ("And here is the friction..."). You will feel rude saying that thanking individuals violates the work's grammar. You will want to add a line like "But of course, individuals matter too," to comfort the donor in the front row. Don't do it. Sit in the discomfort. That awkwardness is the only honest way to acknowledge Marie Reidemeister's erasure while standing in a room full of credit-seeking institutions. If you smooth it over, you prove Neurath's point about how easily we revert to individual heroism.
