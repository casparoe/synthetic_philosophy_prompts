      *   **Source Material:** David Hume's *A Treatise of Human Nature*, Book III, Part II, Section II (specifically the provided passage and the context following it regarding society, family, custom, and justice).
      *   **Comparison Target:** David Lewis's theory of convention (from *Convention: A Philosophical Study*).
      *   **Key Questions:**
          *   How much of Hume's story maps onto Lewis's framework?
          *   Which of Lewis's conditions are present/missing/implicit in Hume?
          *   Is Hume describing a convention or something pre-conventional?
          *   How does the transition from family to justice fit Lewis's "common knowledge" requirement given Hume's emphasis on custom/habit/non-cognitive processes?
          *   Comparison of Hume's evolutionary/historical account vs. Lewis's account of stabilization.
      *   **Constraint:** Answer in American English.

  2.  **Deconstruct Hume's Account (based on the prompt and general knowledge of *Treatise* III.ii.2):**
      *   *Premise:* Humans are weak individually but strong collectively (society compensates defects).
      *   *Problem:* People in a "wild and uncultivated state" cannot reason their way into society purely by calculating advantages.
      *   *Mechanism:* Sexual appetite and family affection create the *first* society (family).
      *   *Development:* Custom and habit make children sensible of the advantages of society gradually.
      *   *Outcome:* This leads to the artificial virtues (justice/property) later on.
      *   *Nature of Process:* Gradual, affective (passions), habitual, evolutionary/historical, not a one-time rational contract.

  3.  **Deconstruct Lewis's Account (based on *Convention*):**
      *   *Definition:* A convention is a regularity in behavior (R) in a population (P) in a recurrent situation (S).
      *   *Conditions:*
          1.  Everyone conforms to R.
          2.  Everyone expects everyone else to conform to R.
          3.  Everyone prefers to conform to R *given* that others conform (coordination problem).
          4.  There is an alternative regularity R' that could have worked.
          5.  **Common Knowledge:** All of the above is common knowledge among the participants.
      *   *Nature of Process:* Game-theoretic, rationalistic (in the sense of preference satisfaction), focuses on equilibrium, often ahistorical or functionalist.

  4.  **Synthesize and Compare (Drafting the Core Arguments):**

      *   *Mapping:* Hume's "society" (specifically the rules of justice/property that emerge later) looks like a Lewisian convention. Both solve coordination problems (Hume's "inconveniences" vs. Lewis's "coordination equilibrium"). Both rely on mutual expectations (Hume's "mutual succour" implies expecting help).
      *   *The Gap (Cognitive vs. Non-Cognitive):* Lewis requires *common knowledge* and rational expectation. Hume explicitly says early humans *couldn't* reason this out. They relied on *passion* (family love) and *habit* (custom).
      *   *Is it Convention?* Hume's *end state* (rules of justice) is convention-like. But the *origin story* is not Lewisian. Lewis assumes agents capable of reasoning about expectations. Hume describes agents evolving *into* that capability through habit.
      *   *The Family Transition:* The family is natural (instinctual), not conventional in Lewis's sense. Justice is artificial (conventional). Hume uses the family as a training ground for the habits required for justice. Lewis doesn't really have a "pre-conventional" evolutionary stage; he analyzes the logic of the convention itself.
      *   *Common Knowledge:* Hume's "custom" creates a *de facto* common knowledge without explicit *de jure* recognition. People act *as if* they know, driven by habit. Lewis requires the knowledge to be explicit in the logical structure (A knows that B knows that A knows...). Hume is more psychological.
      *   *Evolution vs. Equilibrium:* Hume is historical/evolutionary (slow growth). Lewis is structural/logical (how it holds, not necessarily how it started, though he allows for salience/precedent). Hume's account explains *why* we have the capacity for convention. Lewis explains *what* the convention is once it exists.

  5.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the richness of the comparison. State the thesis: Hume provides the *genealogy* of the capacity for convention, while Lewis provides the *logic* of convention itself. There is significant overlap in the end state, but a divergence in the origin story.
      *   **Lewisian Conditions in Hume:** Identify where they match (regularity, coordination problem, mutual benefit).
      *   **The Cognitive Gap (Common Knowledge vs. Habit):** Address the prompt's specific concern about reason/custom. Explain that Hume's "habit" functions *like* common knowledge psychologically but lacks the rationalist foundation Lewis demands.
      *   **Family to Justice:** Distinguish natural virtues (family) from artificial virtues (justice). The family is the incubator, not the convention itself.
      *   **Evolutionary vs. Structural:** Compare Hume's historical gradualism with Lewis's game-theoretic equilibrium.
