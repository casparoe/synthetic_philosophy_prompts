      *   *Missing/Implicit:* Common Knowledge is the big one. Hume has "mutual expectation" but grounded in sentiment/habit, not iterative knowledge.
      *   *Pre-Convention:* The family stage is pre-conventional (instinct). Justice is conventional.
      *   *Evolution:* Hume is Darwinian before Darwin (gradual selection of habits). Lewis is more static/analytic.
      *   *Synthesis:* Hume explains how beings *become* the kind of agents Lewis describes.

  8.  **Final Review against Prompt:**
      *   American English? Yes.
      *   Addressed specific passage? Yes (referenced the "inconveniences").
      *   Addressed family/justice transition? Yes.
      *   Addressed Common Knowledge vs. Custom? Yes.
      *   Addressed Evolutionary vs. Lewisian stabilization? Yes.

  9.  **Final Polish:** Check flow and clarity. (The resulting output matches the detailed response provided previously.)
answer: |-
  This is a sophisticated question that touches on the intersection of moral philosophy, game theory, and social ontology. To understand the relationship between Hume's account in the *Treatise* and David Lewis's theory of convention, it is helpful to view Hume as providing a **genealogical and psychological foundation** for the kind of rational agents Lewis describes.

  While Lewis analyzes the *logic* of how conventions function once they are established, Hume is interested in the *history and psychology* of how human beings become capable of sustaining them. Below is an analysis of how Hume's account maps onto Lewis's framework, where the tensions lie, and how to understand the transition from family to justice.

  ### 1. Mapping Hume onto Lewis's Framework

  There is a significant structural overlap between Hume's description of society and Lewis's definition of convention, particularly regarding the *function* of social rules.

  **Lewis's Conditions Present in Hume:**
  *   **Coordination Problem:** Lewis defines convention as a solution to a coordination problem where agents have a common interest in coordinating their behavior. Hume's "three inconveniences" (lack of force, lack of specialization, vulnerability to accidents) describe precisely this. Individuals cannot succeed alone; they need others to act in complementary ways.
  *   **Regularity in Behavior:** Lewis requires a regularity $R$ in behavior. Hume describes the emergence of stable patterns of labor, mutual succor, and eventually, respect for property.
  *   **Conditional Preferences:** Lewis requires that agents prefer to conform *on the condition* that others conform. Hume captures this when he notes that "by mutual succour we are less expos'd to fortune." My willingness to labor for society depends on my expectation that society will support me.

  **Lewis's Conditions Missing or Implicit:**
  *   **Common Knowledge:** This is the most significant divergence. Lewis requires that it be *common knowledge* (everyone knows, everyone knows that everyone knows, etc.) that the regularity exists and is preferred. Hume explicitly denies that early humans possessed the cognitive capacity for this kind of recursive reasoning. He states they could not attain this knowledge by "study and reflection alone."
  *   **Arbitrariness:** Lewis insists a convention must be arbitrary (there must be an alternative regularity $R'$ that could have worked). Hume implies this regarding property rules (possession vs. occupation vs. prescription), but in the passage you cited, he focuses more on the *necessity* of society itself rather than the arbitrariness of specific rules.

  ### 2. Is Hume Describing a Convention or Something Pre-Conventional?

  Hume is describing a **transition from pre-conventional instincts to conventional rules.**

  In Lewis's framework, agents are already capable of reasoning about expectations. In Hume's narrative, the agents in the "savage and solitary condition" are *not* yet capable of sustaining Lewisian conventions. They lack the cognitive horizon to calculate long-term advantages or manage complex mutual expectations.

  Therefore, the "society" Hume describes in the early stages (based on sexual appetite and family affection) is **not a Lewisian convention.** It is driven by natural instincts (passions) rather than rational coordination. However, the *artificial rules of justice* that emerge later in Hume's account (respect for property, stability of possession) **are Lewisian conventions.**

  Hume's account explains how beings who start with only instinctual drives (family love) evolve into beings capable of sustaining rational conventions (justice). The family serves as a "training ground" where custom and habit simulate the stability required for convention without requiring high-level reasoning.

  ### 3. Custom, Habit, and the Problem of Common Knowledge

  You asked specifically how Hume's reliance on custom fits with Lewis's requirement for common knowledge. This is the crux of the philosophical tension.

  **Lewis's View:** Common knowledge is a logical state. For a convention to hold, I must know that you know that I will cooperate. If this chain breaks, the convention collapses.

  **Hume's View:** Custom acts as a **functional substitute for common knowledge.**
  Hume argues that through "custom and habit," children become "sensible of the advantages of society." This is a non-cognitive, psychological process. I do not need to explicitly reason, "I know that you know that I will cooperate." Instead, through repeated interaction within the family, I develop a *feeling* of security and an *expectation* of support.

  *   **Implicit vs. Explicit:** For Lewis, the knowledge structure is explicit in the logic of the situation. For Hume, the knowledge is implicit in the behavior.
  *   **Stability:** Lewis's conventions are stable because it is irrational to deviate. Hume's norms are stable because it is *psychologically difficult* to deviate due to the force of habit.

  In this sense, Hume describes a "proto-common knowledge." The regularity is so established through habit that agents act *as if* they have common knowledge, even if they lack the reflective capacity to articulate it. Hume naturalizes Lewis's epistemic requirement: what Lewis treats as a logical precondition, Hume treats as a psychological achievement gained over time.

  ### 4. The Transition from Family to Justice

  The transition from the natural virtues (family affection) to the artificial virtues (justice) is where Hume's account diverges most sharply from Lewis's static analysis.

  *   **The Family (Natural):** This is not a convention. It is a biological and affective necessity. Lewis's theory does not easily account for this, as it focuses on arbitrary solutions to coordination problems. There is nothing "arbitrary" about the biological drive to care for one's offspring in Hume's view.
  *   **Justice (Artificial/Conventional):** As families grow into larger societies, family affection becomes too weak to cover everyone. Here, reason and self-interest must step in to extend the "sensible advantages" learned in the family to strangers.

  Hume argues that we extend our concern for justice not because we suddenly calculate a game-theoretic equilibrium, but because **habit extends the scope of our expectations.** We treat strangers *as if* they were family because custom has taught us that this behavior yields security.

  For Lewis, the jump from family to society is just a change in the population size $P$. For Hume, it is a qualitative shift in the *type* of motivation required (from instinct to artificial rule-following). Hume's account suggests that Lewisian conventions are only possible *after* a certain level of social cultivation has occurred.

  ### 5. Evolutionary/Historical vs. Structural/Stabilization

  Finally, regarding the emergence and stabilization of norms:

  *   **Lewis (Structural):** Lewis is largely ahistorical. He is interested in what makes a convention a convention *now*. While he acknowledges precedent, his focus is on the equilibrium conditions. A convention exists if the conditions are met, regardless of how long it took to get there.
  *   **Hume (Evolutionary):** Hume provides a Darwinian-style account before Darwin. He describes a slow, gradual process of selection. Rules that provide "additional force, ability, and security" survive; those that do not, vanish.

  **Comparison:**
  Hume's account is compatible with Lewis's if we view Lewis as describing the **mature state** of Hume's evolutionary process.
  1.  **Hume:** Explains the *origin*. How do we get from solitary savages to agents capable of convention? (Answer: Passion, Family, Custom).
  2.  **Lewis:** Explains the *maintenance*. Once we are socialized agents, how do rules of property persist? (Answer: Common Knowledge, Coordination Equilibrium).

  ### Conclusion

  To answer your specific questions directly:

  1.  **How much maps onto Lewis?** The functional structure of society (solving coordination problems through regularity and mutual expectation) maps very well. The psychological mechanism (custom vs. common knowledge) does not.
  2.  **Which conditions are missing?** The explicit "Common Knowledge" condition is missing in Hume's early stages, replaced by "Custom." The "Arbitrariness" condition is less emphasized by Hume in the context of basic society formation.
  3.  **Convention or Pre-Convention?** Hume describes a pre-conventional state (family/instinct) that *generates* the capacity for convention (justice).
  4.  **Custom vs. Common Knowledge:** Hume's custom creates a *psychological certainty* that mimics the *logical certainty* of Lewis's common knowledge. Hume argues we don't need the high-level reasoning Lewis assumes; we just need the right habits.
  5.  **Evolutionary vs. Lewisian:** Hume explains the historical emergence of the *agents* who can participate in Lewisian conventions. Lewis explains the logic of the conventions those agents inhabit.

  In short, Hume provides the **natural history** of the Lewisian convention. He shows that before you can have a coordination equilibrium based on common knowledge, you must have a history of habituation that makes human beings the kind of creatures who can trust one another enough to form one.
