prompt: |-
  I teach a decision theory unit to about 25 second-year undergrads (mixed econ and philosophy), and I have one 75-minute session, one room, a whiteboard, and whatever I can carry in. I want an in-class activity where they walk into the Ellsberg preference reversal themselves -- the thing where they'd rather bet on the known 50/50 urn than the mystery urn when the bet is red, and again when the bet is black -- before I ever say the word ambiguity. Act like someone who's run this demo a dozen times and knows exactly where it leaks, and think the design through step by step before you commit to it.

  Materials I can actually get: opaque bags, red and black chips, a screen or a big folder, slips of paper, a fair coin. Payoffs have to be points, not money, but I do want the choices to matter to them, so tell me how to structure the payment (and whether paying only one randomly chosen decision is worth the fuss, or overkill at this scale).

  Two things I want baked into the design, because I'm bored of the version that stops at "people don't like unknown odds." First, a second stage where the mystery urn gets redescribed as a two-stage process: flip a coin, heads means the urn is all red, tails means all black, then you draw -- so the overall odds are known to be 50/50, and I can show them this urn and the known urn have the exact same distribution. Then the turn: the urn they refused to bet on in stage one was filled exactly that way, by a coin, behind a screen, nobody watching. So whatever they were avoiding, it wasn't "we don't know the odds." I want them to have to say out loud what they were actually avoiding, and to notice whether the redescription moved anyone. Second, I want the sure-thing logic to come out of their own mouths: if you'd rather bet red on the known urn than red on the mystery urn, and likewise for black, you're claiming the known urn is more likely to come up red and more likely to come up black, which can't be. Don't hand them that -- arrange it so they derive it from their own slips.

  Give me the rules, the timeline, the exact sequence of reveals, and a debrief that maps moments in the activity onto the moving parts (sure-thing principle, ambiguity versus compound risk, description-dependence, what a maxmin-style rule would say about the same choices). Then tell me what predictably goes wrong the first time I run it and how to head it off, and be honest about what the activity can't do -- what I'll have to supply with a short lecture because the game simply can't produce it.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** 25 second-year undergrads (mixed Econ/Phil).
      *   **Constraints:** 75-minute session, one room, whiteboard, portable materials (bags, chips, slips, coin, screen/folder).
      *   **Goal:** Demonstrate Ellsberg Paradox (preference reversal) *before* defining ambiguity.
      *   **Key Features Required:**
          1.  Experience the reversal (Known 50/50 vs. Unknown Urn) for both Red and Black bets.
          2.  Second Stage: Reveal the Unknown Urn was actually generated by a coin flip (Compound Risk = 50/50 overall).
          3.  Elicit the Sure-Thing Principle violation from *their* choices (not lectured).
          4.  Structure payoffs (points, not money) that matter.
          5.  Debrief mapping activity to theory (Sure-Thing, Ambiguity vs. Compound Risk, Maxmin).
          6.  Troubleshooting: Predict failures and limitations.
      *   **Tone:** Experienced instructor ("run this demo a dozen times"), practical, step-by-step, honest about leaks.

  2.  **Deconstruct the Ellsberg Paradox for the Classroom:**
      *   *Standard Setup:* Urn A (50 Red, 50 Black). Urn B (100 chips, unknown ratio).
      *   *Choice 1:* Bet on Red from A vs. Red from B. (Most choose A).
      *   *Choice 2:* Bet on Black from A vs. Black from B. (Most choose A).
      *   *Contradiction:* If P(Red|A) > P(Red|B), then P(Black|A) < P(Black|B). Choosing A for both implies P(Red|A) + P(Black|A) > P(Red|B) + P(Black|B), i.e., 1 > 1 (impossible).
      *   *The Twist (Requested):* Urn B is actually determined by a coin flip (All Red or All Black). This makes it objectively 50/50 *ex-ante*, but *ex-post* (once filled, before drawing) it's ambiguous. This highlights the difference between *risk* (known prob) and *ambiguity* (unknown prob), and specifically attacks the "reduction of compound lotteries" axiom.

  3.  **Designing the Activity (Iterative Process):**

      *   *Payoffs:* 25 students. Cash is tricky (ethics/logistics). Points towards a grade component? Or just "bragging rights"? The prompt asks for "points, not money, but I want the choices to matter."
          *   *Idea:* Course participation points. 5 points total. 1 point for showing up, 4 points for the game. Or, a lottery for a prize (coffee card).
          *   *Better Idea:* "Decision Points" converted to a small stake (e.g., top 3 scores get a chocolate bar or coffee voucher). Or simply count towards a participation grade. Let's go with a Participation Grade stake. It's low cost but matters for GPA.
          *   *Random Payment:* Is it worth the fuss? For 25 students, yes. It prevents hedging across questions. If they know only one choice counts, they treat each seriously.
          *   *Mechanism:* They make 4 choices. One is selected randomly at the end to determine their score.

      *   *Materials:*
          *   Urn 1 (Known): Clear bag or opaque bag where we *show* the mixing beforehand. Let's use opaque bags for consistency, but *witnessed* filling.
          *   Urn 2 (Mystery): Opaque bag.
          *   Chips: Red and Black (plastic poker chips or laminated cards).
          *   Slips: For recording choices anonymously or semi-anonymously.
          *   Screen/Folder: To hide the filling of Urn 2.

      *   *Timeline (75 mins):*
          *   0-10: Setup & Instructions.
          *   10-25: Round 1 (The Trap).
          *   25-35: Aggregation & The Reveal (The Contradiction).
          *   35-50: Round 2 (The Coin Flip Re-description).
          *   50-65: Debrief & Theory Mapping.
          *   65-75: Q&A / Wrap-up.

      *   *The "Leak" Prevention:*
          *   *Leak 1:* Students think I'm tricking them. *Fix:* Verifiable transparency.
          *   *Leak 2:* Students hedge (choose A for Red, B for Black). *Fix:* Emphasize each decision stands alone or use the random selection mechanism.
          *   *Leak 3:* The "Coin Flip" reveal doesn't land. *Fix:* Need to emphasize that *before* the coin flip, it was 50/50. *After* the flip, it's 100/0, but they don't know which.
          *   *Leak 4:* Sure-Thing logic is too abstract. *Fix:* Use a specific table on the board where they fill in their implied probabilities.

  4.  **Drafting the Steps (incorporating the "Two Things"):**

      *   *Step 1 (The Trap):* Standard Ellsberg. Urn K (50R/50B). Urn M (100 chips, ?R/?B).
          *   Q1: Bet Red on K vs Red on M.
          *   Q2: Bet Black on K vs Black on M.
      *   *Step 2 (The Contradiction):* Collect slips. Tally on board. Show the majority chose K for both. Ask: "What does this say about your belief that M is Red vs K is Red?"
      *   *Step 3 (The Twist):* Reveal Urn M's history. I flipped a coin behind the screen. Heads = 100 Red. Tails = 100 Black.
          *   Q3: Now that you know the *process*, do you want to switch?
      *   *Step 4 (The Logic):* Derive the Sure-Thing violation. If P(Red|K) > P(Red|M) and P(Black|K) > P(Black|M), then P(Red|K) + P(Black|K) > 1. Impossible.

  5.  **Refining the Payoff Structure:**
      *   If I pay on all decisions, they might try to be consistent rather than truthful.
      *   If I pay on one random decision, they maximize expected utility on that specific decision.
      *   *Decision:* Use the "Random Lottery Incentive System" (RLIS). It's the gold standard for experimental econ. It adds tension.
      *   *Stakes:* 10 "Course Points" available. Each win = 2 points. Max 10. (Or adjust to fit syllabus). Let's suggest a small tangible prize + participation credit to keep it low-stakes but non-zero.

  6.  **Addressing the "Experienced Instructor" Tone:**
      *   Need to warn about the "smartass" student who says "I choose M because I feel lucky."
      *   Need to warn about the "hedging" student.
      *   Need to manage the timing strictly. 75 mins flies.
      *   Need to acknowledge what the demo *can't* do (e.g., prove Maxmin EU is *right*, just that SEU is violated).

  7.  **Fleshing out the Debrief:**
      *   Map the "Coin Flip" to *Compound Risk*.
      *   Map the "Mystery Urn" to *Ambiguity*.
      *   Map the "Both K" choice to *Violation of Sure-Thing / Additivity*.
      *   Introduce Maxmin (Gilboa-Schmeidler) briefly as the "fix."

  8.  **Review against Constraints:**
      *   25 students? Yes, slips work.
      *   75 mins? Yes, tight but doable.
      *   Materials? All portable.
      *   No money? Points used.
      *   Two specific requirements (Coin flip reveal, Self-derived Sure-Thing)? Integrated into Steps 3 and 4.

  9.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Wait, if I reveal the coin flip *after* they choose, does it change the normative status? Yes, it shows Reduction of Compound Lotteries. If they still prefer K, they violate Reduction. If they switch to M, they admit they were fooled by ambiguity.
      *   *Correction on Payoff:* Random selection of *one* question to pay out is crucial. If I pay all, they might think "I'll pick K for Red and M for Black to cover my bases." RLIS forces them to treat each as the *only* decision.
      *   *Correction on Urn M:* To make the coin flip reveal valid, I must have *actually* filled it that way before class. I need to bring two pre-filled bags (100R and 100B) and a coin. I pick one behind the screen based on a coin flip recorded on a slip in my pocket. This ensures veracity.

  10. **Writing the Response:** Structure it clearly: Materials, Payoff Logic, Timeline/Script, The "Turn", Debrief, Troubleshooting, Limitations. (Proceed to generate output based on this plan).

  *(Self-Correction during final review of the prompt)*: The prompt asks specifically: "tell me how to structure the payment (and whether paying only one randomly chosen decision is worth the fuss, or overkill at this scale)."
  *My verdict:* For 25 students, RLIS is *not* overkill. It's necessary to prevent hedging. I will advocate for it but simplify the administration.

  *Prompt Requirement:* "Act like someone who's run this demo a dozen times and knows exactly where it leaks."
  *Tone Check:* Use phrases like "Here's where they'll catch you," "Don't let them," "The leak is..."

  *Prompt Requirement:* "Two things I want baked in... Second stage... Sure-thing logic out of their own mouths."
  *Check:* Ensure the script forces *them* to write down the probabilities that lead to the contradiction.

  Let's build the plan.cw
answer: |-
  Here is the battle-tested design. I've run variations of this for years. The difference between a "cool demo" and a "conceptual breakthrough" is in the administration of the payoffs and the strict sequencing of the reveal. If you get lazy on the script, they'll talk their way out of the paradox.

  ### 1. Materials & Payoff Structure

  **Materials:**
  *   **3 Opaque Bags:** Label them **K** (Known), **M** (Mystery), and **H** (Hidden).
  *   **200 Chips:** 100 Red, 100 Black (plastic poker chips work best; they clack nicely).
  *   **1 Fair Coin:** Large, visible.
  *   **Decision Slips:** 4 per student (cut A4 paper into quarters).
  *   **A "Screen":** A large folder or cardboard box to hide bag filling.
  *   **Whiteboard Markers:** Red and Black.

  **The Payoff (Crucial):**
  Do not skip the **Random Lottery Incentive System (RLIS)**. If you grade every decision, students will "hedge" (pick K for Red, M for Black) to guarantee a win. You need them to treat every decision as if it is the *only* decision that matters.
  *   **Stake:** 5 Participation Points total for the day.
  *   **Mechanism:** At the end of class, draw one student's name from a hat, then draw one of their four decision slips from a separate hat. That single decision determines their score.
      *   Win = 5 points.
      *   Lose = 0 points.
      *   (Alternatively: Top 3 scores get a $10 coffee voucher. Keep it tangible but low-stakes).
  *   **Why this matters:** It forces Expected Utility maximization logic. If they violate EU, it's because of preference, not risk management across questions.

  ---

  ### 2. Timeline & Script (75 Minutes)

  #### Phase 1: Setup & The Trap (0:00 – 0:20)
  **Goal:** Establish the baseline preferences without using the word "ambiguity."

  1.  **The Fill (Public):**
      *   Hold up Bag **K**. Count 10 Red and 10 Black chips visibly. Drop them in. Seal it.
      *   *Say:* "Bag K has exactly 50% Red, 50% Black. Everyone agrees?"
      *   Hold up Bag **M**. Turn your back to the class (or go behind the screen). Take the remaining 80 chips (you pre-counted them, but they don't know the ratio). Drop them in. Seal it.
      *   *Say:* "Bag M has 80 chips. Some Red, some Black. I know the ratio. You do not. It could be 80/0, 40/40, 0/80. Any mix."

  2.  **Decision 1 (Red):**
      *   Hand out Slip 1.
      *   *Prompt:* "I will draw one chip from K and one from M. You must choose **one** bag to bet on. If you pick K and it's Red, you win. If you pick M and it's Red, you win. Which bag?"
      *   *Action:* They circle K or M. Collect slips immediately.

  3.  **Decision 2 (Black):**
      *   Hand out Slip 2.
      *   *Prompt:* "Same bags. New bet. If you pick K and it's Black, you win. If you pick M and it's Black, you win. Which bag?"
      *   *Action:* They circle K or M. Collect slips immediately.
      *   *Instructor Note:* Do not let them discuss between slips. "Pens down, eyes front."

  #### Phase 2: The Contradiction (0:20 – 0:35)
  **Goal:** Make them derive the Sure-Thing violation from their own data.

  1.  **The Tally:**
      *   Draw a table on the board.
      *   | Choice | Bet on Red | Bet on Black |
      *   | :--- | :---: | :---: |
      *   | **Bag K** | [Tally] | [Tally] |
      *   | **Bag M** | [Tally] | [Tally] |
      *   Fill this in live from the slips.
      *   *Prediction:* In a class of 25, you will likely see ~20 votes for K on Red, and ~20 votes for K on Black.

  2.  **The Interrogation (Socratic):**
      *   Point to the "Bet on Red" column. "Most of you chose K. Why?"
      *   *Student:* "Because we know the odds."
      *   *You:* "So, implicitly, you believe the probability of Red in K is *higher* than Red in M? Write that down." (Have them write $P(R|K) > P(R|M)$ on Slip 3).
      *   Point to the "Bet on Black" column. "Most of you chose K again. Why?"
      *   *Student:* "Same reason."
      *   *You:* "So you believe the probability of Black in K is *higher* than Black in M? Write that down." (Have them write $P(B|K) > P(B|M)$ on Slip 3).

  3.  **The Math Trap:**
      *   Ask a student to read their two inequalities aloud.
      *   *You:* "Add the left sides. Add the right sides. What do you get?"
      *   *Board:* $P(R|K) + P(B|K) > P(R|M) + P(B|M)$
      *   *You:* "What is the probability of Red or Black in Bag K?" (Class: "100%" or "1").
      *   *You:* "What is the probability of Red or Black in Bag M?" (Class: "100%" or "1").
      *   *You:* "So your choices imply that $1 > 1$. Who can explain how that happened?"
      *   *Silence.* Let it sit. This is the moment. They have violated the **Sure-Thing Principle** (or Probability Additivity) using their own hands.

  #### Phase 3: The Turn (Compound Risk) (0:35 – 0:50)
  **Goal:** Distinguish Ambiguity from Compound Risk.

  1.  **The Reveal:**
      *   Bring out Bag **H** (Hidden) and the Coin.
      *   *Say:* "You think Bag M is mysterious. Let me tell you how I filled Bag M before class started."
      *   "I flipped this coin. Heads: I put 80 Red chips in. Tails: I put 80 Black chips in. Then I put it in Bag M."
      *   *Proof:* Show a sealed envelope with the coin result written inside (prepared before class). Open it. (e.g., "Tails").
      *   *Say:* "So, Bag M is actually all Black. But you didn't know that when you chose."

  2.  **Decision 3 (The Redescription):**
      *   Hand out Slip 4.
      *   *Prompt:* "Knowing now that Bag M was filled by a 50/50 coin flip (All Red or All Black), and Bag K is 50/50 (Mixed). If you had to bet on **Red** again, do you switch to M, stay with K, or are you indifferent?"
      *   *Action:* Collect slips.

  3.  **The Discussion:**
      *   Tally Slip 4. You will see movement. Some will switch to "Indifferent." Some will stay with K.
      *   *You:* "Objectively, the probability of drawing Red from M *ex-ante* was 50%. The probability of drawing Red from K is 50%. They are mathematically identical distributions."
      *   *You:* "If you still prefer K, you are not avoiding 'bad odds.' You are avoiding the *state of not knowing*. You are violating **Reduction of Compound Lotteries**."

  #### Phase 4: Debrief & Theory Mapping (0:50 – 1:10)
  **Goal:** Connect the physical activity to the formal theory.

  Draw three columns on the board: **Observation**, **Standard Theory (SEU)**, **Alternative (Maxmin/Ambiguity)**.

  1.  **The Sure-Thing Violation:**
      *   *Observation:* Choosing K for both Red and Black bets.
      *   *SEU:* Impossible. Probabilities must sum to 1. Preferences should be consistent with a single prior.
      *   *Takeaway:* People do not act as if they have a single subjective probability for the unknown urn.

  2.  **Ambiguity vs. Risk:**
      *   *Observation:* Preferring K (Known 50/50) over M (Unknown mix).
      *   *SEU:* Risk is known probability. Ambiguity is unknown probability. SEU says you should reduce ambiguity to risk (use a prior).
      *   *Takeaway:* People treat ambiguity differently than risk. They are **Ambiguity Averse**.

  3.  **The Coin Flip (Compound Risk):**
      *   *Observation:* Even after learning M was a coin flip, some still prefer K.
      *   *SEU:* A compound lottery (Coin -> Urn -> Draw) should be reduced to a simple lottery (50/50 Draw).
      *   *Takeaway:* The *structure* of the uncertainty matters, not just the final odds. Information about *how* the uncertainty was generated changes utility.

  4.  **Maxmin Expected Utility (Gilboa-Schmeidler):**
      *   *Explain:* "Imagine you didn't have one probability for Bag M. Imagine you had a *set* of probabilities (0% to 100% Red)."
      *   "A Maxmin player looks at the worst-case scenario in that set."
      *   "Worst case for Red bet on M? 0% Red. Worst case for Black bet on M? 0% Black."
      *   "Worst case for K? 50%."
      *   "So you choose K for both. This model *allows* the 1 > 1 contradiction because it drops the 'Single Prior' axiom."

  #### Phase 5: Wrap Up (1:10 – 1:15)
  *   Run the lottery for the points.
  *   Assign reading (e.g., Gilboa & Schmeidler 1989 intro, or a chapter from *Theory of Decision under Uncertainty*).

  ---

  ### 3. Where It Leaks (And How to Plug It)

  **Leak 1: The "Hedger"**
  *   *Problem:* A student picks K for Red and M for Black. They say, "I covered my bases."
  *   *Fix:* This is why RLIS (Random Lottery Incentive) is non-negotiable. Remind them at the start: "Only ONE of these slips will count. If you hedge, you might lower your expected value on the slip that actually gets picked."
  *   *Backup:* If someone still hedges, ask them: "If I pick the Red slip, did you make the optimal choice?" It usually shames them into consistency.

  **Leak 2: The "Trust Issue"**
  *   *Problem:* Students think you rigged Bag M to be 90% Black, so they pick K for Red (smart) and K for Black (because they suspect you tricked them).
  *   *Fix:* The Coin Flip reveal (Phase 3) solves this. But you must emphasize that the Coin Flip happened *before* they made choices. The envelope proof is vital. If they think you're lying about the coin, the lesson fails.
  *   *Pro Tip:* Ask a student to come up and verify the chips in Bag M *after* the class is over, not during. During class breaks the blind.

  **Leak 3: The "Indifference" Crowd**
  *   *Problem:* Econ students love to say "I'm indifferent" to avoid the paradox.
  *   *Fix:* Force a choice. "You must pick one to get the points. Indifference means you flip a coin yourself. Pick the bag you'd rather hold."
  *   *Refinement:* If they write "Indifferent," count it as a vote for M (the ambiguous one) for the sake of the paradox tally, but note it separately. Usually, true indifference is rare in Ellsberg setups.

  **Leak 4: Time Creep**
  *   *Problem:* The "Interrogation" in Phase 2 gets bogged down in semantic arguments about what "probability" means.
  *   *Fix:* Be authoritarian about the math. "We are assuming for this model that probabilities sum to 1. If your choices violate that, the model breaks. We aren't debating philosophy yet, we are observing the violation."

  ---

  ### 4. What This Activity Cannot Do (Be Honest Here)

  You cannot skip the lecture entirely. The demo creates the *anomaly*, but it doesn't solve it. You must explicitly state these limitations in the debrief:

  1.  **It doesn't prove Maxmin is "Right":** The demo shows SEU (Subjective Expected Utility) is descriptively wrong. It does not prove Maxmin is normatively correct. Some argue ambiguity aversion is a "bias" to be corrected, not a preference to be modeled. You need to lecture on the normativity vs. descriptivity debate.
  2.  **It doesn't explain *Why*:** The demo shows *that* they are ambiguity averse. It doesn't explain the psychological mechanism (e.g., fear of regret, competence hypothesis, evolutionary heuristics). You need to supply the psychological literature.
  3.  **The "Coin Flip" Equivalence is Tricky:** Technically, a 50/50 coin flip into an urn (Compound Risk) is only equivalent to a 50/50 urn (Simple Risk) if the **Reduction of Compound Lotteries** axiom holds. The demo shows people violate this. You need to lecture on why that axiom exists in standard theory (it simplifies the math) and what happens when you drop it (trees get huge).
  4.  **Sample Size:** With 25 students, if you get a weird cohort (e.g., 15 of them are risk-seeking gamblers), the tally might not show the paradox clearly.
      *   *Mitigation:* Have historical data ready. "In 12 previous runs, 80% of students chose K for both. Today we have... [tally]. Even if it's only 60%, the logic holds."

  ### 5. Final Instructor Checklist
  *   [ ] Pre-fill Bag M (All Red or All Black) and seal it before class.
  *   [ ] Write the result on a slip, seal it in an envelope.
  *   [ ] Bring 25 x 4 slips of paper.
  *   [ ] Bring a hat/box for the lottery.
  *   [ ] **Practice the math board work.** If you fumble the $1 > 1$ derivation, you lose the room.
  *   [ ] **Watch the clock.** If Phase 2 runs long, cut the Phase 3 discussion short. The Contradiction (Phase 2) is the core; the Coin Flip (Phase 3) is the enhancer.

  This design forces them to live the contradiction before you give them the vocabulary to escape it. That cognitive dissonance is where the learning happens. Good luck.
