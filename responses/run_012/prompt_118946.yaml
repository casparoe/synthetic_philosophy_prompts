  9.  *(Self-Correction on Q1)*: Wait, is IRL unidentifiability *just* potential shaping? No, it's also that any policy can be optimal for *some* reward (e.g., R=0 everywhere). So the mapping is many-to-one. Hume is about validity. I need to distinguish "Many rewards fit" (IRL) from "No reward is justified" (Hume). Actually, Hume says you need a normative premise. In IRL, the normative premise is "The demonstrator is rational/optimal." Without that, you can't infer R. So IRL *solves* Hume by adding the axiom of rationality. But Hume would ask "Why is rationality good?" IRL doesn't care. Okay, that's the distinction.

