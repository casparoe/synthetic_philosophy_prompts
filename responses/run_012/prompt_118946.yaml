prompt: |-
  I work on RL — reward modeling, RLHF-ish pipelines, that whole world — so my daily vocabulary is dynamics models, reward functions, policies, and the annoying fact that a learned reward is only pinned down up to potential shaping. I've got the standard-issue version of Hume's is/ought point from one college seminar: you can't squeeze an ought out of an is. Same seminar gave me Moore's open question argument and the naturalistic fallacy, which I remember as "'good' isn't definable in natural terms." Can you restate both of those as faithfully as you can in the vocabulary I actually think in — dynamics model as the is, reward function as the ought, inverse RL as the obvious attempt to read the second off the first — and then give me the residue report? I want to know what translates cleanly, what only goes through if you fudge it, and what has no counterpart at all in how I think about agents. Two things I really want an answer on. First: when the IRL people say the reward is unidentifiable from behavior, is that just Hume's point in statistics clothing, or a genuinely different claim (no consistent estimator vs. no entailment)? Second: Hume looks like he's making a claim about inference — the move to a normative conclusion needs some extra premise — while Moore is making a claim about definition; does my vocabulary even have the resources to keep those apart, or does it flatten them into a single "the objective is exogenous"? And if the translation makes Hume come out trivially true, tell me whether thats my vocabulary flattening the claim or the claim being thin to begin with. American English please.
reasoning: |-
