  **Planning Note**

  *   **Claim:** Ines's giving was a costly act that sustained others without seeking social return or reputation.
  *   **Refuse:** To claim it was a signal for status. To claim it fits neatly into existing models of communication or exchange.
  *   **Open:** Whether this was communication to her future self, or simply action outside the economy of exchange entirely.
  *   **Weakest Material:** Material 3 (Anonymity as added cost). It assumes the act remains a signal despite lacking a receiver. Signal strength requires an audience; without one, the concept collapses. It forces theory onto data rather than letting data challenge theory.

