  **Memorial Address**

  Thank you for coming. Especially you, Ines's brother, and your family. Thank you for sharing her with us. And thank you to the students. And the colleagues who knew her work.

  It rained this morning. Ines would have liked that. She spent thirty years watching sparrows in the coastal marsh. She knew that life is expensive. Every song costs energy. Every bright feather invites a predator. We spend our careers asking why creatures pay these costs. Usually, we find the answer in the eyes of another. A display is a message. It says, I am strong. I am here. Look at me.

  Ines understood this better than anyone. She knew the rules of the trade. She could spot a bluff from fifty meters away. She carried a notebook with a broken spine. She wrote down everything. But last month, we learned something that does not fit the rules.

  For thirty years, she paid for students who could not pay for themselves. She used a lawyer. She used no name. The students received the help, but they could not thank her. The colleagues saw the graduates, but they did not see the hand that lifted them. There was no audience.

  In our work, a cost without an audience is a puzzle. If no one sees the sacrifice, what is it for? There was no reputation to win. There was no gratitude to collect. She gave up the very thing that usually makes a gift meaningful to the giver. She gave up the thank you. She gave up the knowledge that she was the cause.

  I stand here as a scientist. I look for patterns. I look for the function. I want to tell you that this was a message to herself. I want to say she was building a legacy she could see in her own mind. Perhaps she was. But I cannot be sure. To say that is to claim I know her interior life. I do not. I only know the ledger.

  It may be that some acts are not messages at all. They are simply things that must be done. The cost is real. The sacrifice is real. But the exchange is not. We study communication. But perhaps this was not communication. Perhaps it was just care.

  Her brother, you knew her without this data. You knew her heart without seeing the ledger. You expected goodness from her because you knew her soul. We in the field expect evidence. We need to see the mechanism. Today, the evidence is here. It is sitting in the chairs. It is the scientists she made possible. They are the living record of her choices.

  We cannot say where she is now. We cannot say if she watches us. Science does not speak to that. But we can say what remains. A message usually fades when the sender stops. This one continues. The students here will teach others. They will help others. The cost she paid continues to yield returns she will never see. The energy she spent is still moving through the system.

  Ines taught us that nature is complex. She taught us that sometimes the data breaks the model. When that happens, we do not fix the data. We accept that the world is larger than our explanations. We accept that there are things we cannot measure.

  She is not here. The chair is empty. The rain is still falling. But the work goes on. And because of her, it goes on better than it would have otherwise. She removed barriers. She opened doors. She did it in the dark.

  We will not pretend to understand it fully. We will not pretend it fits neatly into our books. We will simply honor it. We will carry the weight she lifted for others.

  Thank you, Ines. We will keep watching.
