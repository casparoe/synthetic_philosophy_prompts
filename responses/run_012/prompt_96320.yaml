  The rain at the Greyhound station didn't fall so much as hang in the air, a wet grey curtain that smelled of diesel and wet wool. Elias sat on a plastic bench near the vending machines, holding a paper cup that was too hot to hold comfortably. He didn't drink from it. He just let the heat bleed into his palms.

  Mara stood by the window, watching the commuters slog toward the platforms. She hadn't sat down. She was wearing the same leather jacket she'd worn three years ago, the last time they'd spoken before the silence fell.

  "You look tired," Mara said. She didn't turn around.

  "Sleep is inefficient," Elias said. "If time is a landscape, why do we keep closing our eyes to walk through it?"

  Mara turned then. Her expression was tight, the kind of look you give a stray dog you want to feed but know you shouldn't. "Don't start with the physics, Eli. Not about her."

  "It's not just physics. It's geography." Elias set the coffee down on the bench beside him. He stood up and walked to the window, standing close enough to her that she could smell the stale tobacco on his coat, but not close enough to touch. "You think because she died, she's gone. But 'gone' implies a place she went to. She didn't go anywhere. She's just... elsewhere."

  "Elsewhere," Mara repeated. The word tasted like ash. "She's in a box in Oakwood, Eli. I was there. I saw the dirt hit the lid."

  "That's your slice," Elias said. He tapped the glass. Outside, two people were walking past each other on the sidewalk. One was heading north toward the city center, briskly; the other was ambling south, window shopping. "Look at them. They're moving relative to each other. Special relativity says their 'nows' are different. Not because of clocks being wrong. Because simultaneity isn't absolute."

  Mara crossed her arms. "I know what simultaneity is. I took Physics 101. It doesn't bring her back."

  "It doesn't have to bring her back. She doesn't need bringing." Elias leaned in, his breath fogging the glass. He drew a line through the condensation with his index finger. "Take that person walking north. For them, right now, a supernova might have already exploded in the Andromeda galaxy. But for the person walking south, that same explosion hasn't happened yet. Neither of them is wrong. Their motion changes what counts as 'now' across distance."

  "So?"

  "So, if 'now' depends on how you're moving, then 'future' and 'past' are just directions. Like left and right." Elias wiped the fog away, clearing a view of the rainy street. "If I move fast enough toward Andromeda, my 'now' includes your tomorrow. If I move away, my 'now' includes your yesterday. If both are equally valid coordinates, then your tomorrow is just as real as your yesterday. It's all there. The block is solid."

  He turned to look at her. His eyes were red-rimmed, desperate. "She isn't gone, Mara. She's just back there. Like a town we drove through an hour ago. It's still there. We're just not in it."

  Mara looked at the coffee cup steaming on the bench. "That's a comfort, isn't it? To think the universe is a giant freezer where nothing ever thaws."

  "It's not comfort. It's geometry."

  "It's denial," she snapped. "You're using light cones to avoid the fact that you can't call her. You're turning her into a coordinate so you don't have to feel the hole."

  Elias flinched, just slightly. He looked back out the window. The two walkers were gone. "If the future is real, then the past is real. That's the trade. You want the past to be gone? Fine. Then the future isn't real either. Nothing exists but this instant. But you know that's not true. You know you'll be here tomorrow."

  "I know I'll be here tomorrow," Mara said, her voice dropping, losing its edge. "But I don't know *what* I'll be doing. That's the thing you're skipping, Eli. You're conflating 'real' with 'fixed'."

  Elias frowned. "If it exists, it's fixed."

  "No." Mara stepped away from the window, finally coming to stand in front of him. She reached out and straightened the collar of his coat, a gesture so intimate it made him stiffen. "Suppose the block universe is true. Suppose every moment is laid out like tiles on a floor. That just means the tiles exist. It doesn't mean the pattern was forced."

  She picked up his coffee cup and took a sip, grimacing at the heat. "Quantum mechanics. Chance. Even if my future self is standing on a tile somewhere in the block, maybe she got there by rolling dice. Just because the outcome is *there*, doesn't mean it was inevitable when I started walking. You want her to be real so you can visit her in your head. But if you make the block solid, you make it a prison. You make every mistake she ever made, and every mistake you ever made, unavoidable."

  "I don't care about inevitability," Elias said. "I care about existence."

  "But you're smuggling necessity in under the cover of existence," Mara insisted. "You say 'she is there,' and you hear 'she is safe there.' But if the block is real, the moment she got sick is there too. The moment she suffered. It's all just... static. You're not saving her by putting her in the block. You're just embalming the whole universe."

  Elias looked at his hands. They were shaking, just a tremor. He thought about the walkers on the sidewalk. He thought about the supernova. If he walked north, was she alive? If he walked south, was she dead? The math said the event was coordinate-dependent, but the grief was absolute. It sat in his chest like a swallowed stone.

  "If it's not fixed," Elias said quietly, "then what's the point of the geometry? If the future is real but chancy, then I can't know what's on the tile until I step on it. So I'm still alone in the present."

  "You're always alone in the present," Mara said. "That's the condition. The physics doesn't fix the loneliness. It just maps the room."

  A bus hissed into the bay outside, air brakes screaming like a dying animal. The headlights swept across the ceiling of the station, illuminating the dust motes dancing in the air. For a second, the light caught the condensation on the window, making Elias's finger-line glow.

  Mara handed him back the coffee. "I have to go. My bus is boarding."

  Elias took the cup. It had gone lukewarm. "Will I see you?"

  "Maybe," Mara said. She picked up her bag. "Depending on which way you're walking."

  She walked toward the gate, her footsteps echoing on the linoleum. Elias stayed by the window. He watched her join the line of passengers. He looked at the glass, at the faint line he'd drawn through the fog. It was already fading, the moisture reclaiming the space, erasing the mark until there was no evidence it had ever been there at all.

  He wondered, if he started walking right now, would he meet her in the past, or was she already gone?
