answer: |-
  **Desiderata for a Panpsychist Solution to the Combination Problem**

  1.  **Subjecthood Preservation:** Must distinguish a genuine *subject* of experience from a mere *bundle* of experiences.
      *   *Case:* The Subject Summing Argument. A collection of micro-pains does not entail a macro-subject suffering. A solution must explain the emergence of the *pole* of experience, not just its contents. Collapsing the subject into the bundle reduces persons to heaps of qualia, failing to capture the unity of ownership.
  2.  **Constitutive Explanation:** Must explain macro-experience as *constituted* by micro-experience, not merely *caused* by it.
      *   *Case:* Avoiding Emergentism. Distinguish *constitutive combination* from *merely causal coupling*. If micro-experiences only cause macro-experiences, panpsychism collapses into property dualism. The macro must be ontologically grounded in the micro to remain distinct from physicalist emergentism.
  3.  **Symmetry of Unity and Disunity:** Must treat unified consciousness and fragmented consciousness as equally explicable states. Distinguish *unity as a fact* (brute) vs. *unity as an achievement* (process).
      *   *Case:* Split-brain and Dissociation. The theory cannot treat unity as the default metaphysical fact and disunity as a breakdown. It must explain how micro-experiences combine to form one subject *and* how they fail to do so in dissociative cases. Unity must be contingent on specific combinatorial conditions.
  4.  **Diachronic Identity (Gradual Replacement):** Must account for subject persistence through constituent change.
      *   *Case:* The Ship of Theseus. If micro-experiences are swapped one-by-one, does the macro-subject persist? If yes, what grounds this identity if the constitutive base is entirely different? If no, consciousness is too fragile for biological reality.
  5.  **Empirical Adequacy:** Must not contradict established neuroscience regarding localization and correlation.
      *   *Case:* Neural Correlates. Consciousness varies with specific neural structures. A panpsychist theory cannot imply consciousness is uniformly distributed where neural integration is absent.

  **The Joint Unsatisfiability**

  The crux of your paper lies in the tension between **Desideratum 2 (Constitution)** and **Desideratum 4 (Gradual Replacement)**, exacerbated by **Desideratum 3 (Disunity)**.

  If macro-experiences are strictly *constituted* by specific micro-experiences (Req 2), then swapping those micros (Req 4) should necessarily alter or destroy the macro-subject. Strict constitution implies micro-essentialism. However, biological organisms undergo constant material and phenomenal turnover while maintaining subjective continuity. To allow persistence through replacement, the relation between micro and macro must be loose enough to permit multiple realizability. But if the relation is loose, it resembles *causal coupling* rather than *constitution*, violating Req 2 and inviting the physicalist charge of "emergentism with extra steps."

  Furthermore, Req 3 demands a mechanism for combination that can toggle on and off (unity vs. disunity). If combination is constitutive, it is difficult to explain how the same micros can sometimes constitute a unity and sometimes not without appealing to external structural factors—which again looks like causal emergence rather than phenomenal constitution. If unity is a brute fact, disunity becomes inexplicable; if unity is an achievement, the "achieving" mechanism risks being non-phenomenal.

  Physicalists will argue you cannot have it both ways: either the micro-phenomenology strictly fixes the macro-phenomenology (solving combination but failing replacement/disunity), or the macro-phenomenology is flexible (solving replacement/disunity but failing constitution). Your paper must demonstrate that panpsychism requires the former to be distinct from physicalism, but biological reality requires the latter. This is the trap: to solve the combination problem without collapsing into emergentism, you must maintain strict constitution, but strict constitution makes the continuity and fragmentation of actual minds inexplicable. Any theory that relaxes constitution to save the phenomena surrenders its claim to be anything other than emergentism with extra steps.
