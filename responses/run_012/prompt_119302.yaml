  I'm working on a paper about panpsychism and the combination problem, and I keep running into proposals that solve one half of it and quietly drop the other. Before I read any more, write me the desiderata: what does a solution to the combination problem actually have to deliver? The cases it has to get right, the distinctions it can't collapse (subject vs. mere bundle of experiences, constitutive combination vs. merely causal coupling, unity as a fact vs. unity as an achievement), the empirical results it can't contradict — with the case or consideration behind each requirement — and tell me which requirements look jointly unsatisfiable, since thats the part I want the paper to turn on. The point of the list is a theory my physicalist opponents can't dismiss as emergentism with extra steps.

