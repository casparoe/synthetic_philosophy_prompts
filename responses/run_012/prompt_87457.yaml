      *   *Tractability:* You can write a scene about hurt pride. You can't write a scene about "egalitarianism."
      *   *Scene Impact:* If the town is *right*, she has to apologize in Scene 50. If they are *wrong*, she has to stand firm. That's a huge divergence.

  6.  **Refining the "What would move them" section:**
