      *   Q5: American Dream & Jantelagen = Same Demand? (The *Synthesis*).

  3.  **Evaluate for Novelistic Utility (Tractability & Scene Impact):**
      *   *Novels run on specific human behavior, not abstract theory.* A reader doesn't need to know the sociological definition of the town's anger; they need to *feel* it in a grocery store encounter or a high school reunion.
      *   *Upstream vs. Downstream:* The protagonist's internal experience is usually the engine. The town's motivation matters only insofar as it impacts her.
      *   *Tractability:* You can't "solve" the American Dream in a novel. You can only dramatize a specific instance of it. Abstract ideological questions often lead to essayistic writing if tackled directly. Concrete relational questions lead to scenes.

  4.  **Select the Top 2-3 Questions:**

      *   *Candidate 1: Can Community Disapproval be Right? (The Legitimacy Question).*
          *   Why: This directly dictates the protagonist's arc. If the town is *wrong*, she's a martyr. If the town is *right*, she's a villain (or needs redemption). If it's mixed, it's complex. This determines the emotional stakes.
