      *   **The Book:** Midwestern town, protagonist left, succeeded (IPO), came back. Town's reaction is the core conflict.
      *   **The Wall:** The user is stuck on the *moral motivation* of the town. Is it envy? Resentment of norms? Group self-image protection? A legitimate demand for recognition? Or is the American Dream just Jantelagen in disguise?
      *   **The Request:** Pick 2-3 questions from the cluster. Order them. Defend the order (upstream/downstream, tractability for a novelist, impact on scenes). Explain what would move them up/down. No reading lists.

  2.  **Deconstruct the Questions:**
