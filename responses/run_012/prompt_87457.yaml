answer: |-
  Here is the prioritization. I have ordered these based on **narrative necessity** (which uncertainty paralyzes the plot most), **tractability** (which can actually be solved in prose), and **scene impact** (which changes what happens on the page).

  ### 1. The Legitimacy Question
  **Can a community's disapproval be *right*?**
  *(Includes: Is levelling down oppression or correction? Is the protagonist guilty of treating people as scenery?)*

  **Why it is first:** This is the upstream decision that dictates your ending and your protagonist's arc. If the town is morally correct—that she *did* violate a fundamental human obligation by treating her neighbors as backdrop—then your novel is a redemption story or a tragedy of return. She must pay a price. If the town is morally incorrect—that this is purely punitive envy—then your novel is a story of endurance or escape. She must hold her ground.

  If you do not settle this, your protagonist will waver. At 60k words, you are approaching the climax. If you don't know whether she deserves forgiveness or vindication, your scenes will lack tension because the stakes are undefined. This is the most tractable question because it doesn't require sociological truth; it requires **authorial judgment**. You get to decide the moral physics of your world.

  **Scene Impact:** High. If they are *right*, a scene where she buys a local business ends with her realizing she destroyed a livelihood. If they are *wrong*, the same scene ends with her realizing they are sabotaging her out of spite. The action is the same; the subtext flips 180 degrees.

  **What moves it down:** If you decide to write a satire or an absurdist comedy where moral logic is intentionally broken.
  **What moves it up:** If the book feels "muddy" or the protagonist feels passive.

  ### 2. The Mechanism Question
  **Is the town's anger Envy or a Demand for Recognition?**
  *(Includes: Envy vs. Resentment vs. Cowardice vs. Legitimate Demand)*

  **Why it is second:** Once you know *if* they are right (Question 1), you need to know *how* they express it. This dictates the texture of your antagonists. Envy produces sneers, gossip, and theft. A demand for recognition produces confrontations, ultimatums, and emotional appeals. Cowardice produces silence and passive aggression.

  This is more tractable than the Ideological Question (below) because it lives in **behavior**. You can write a scene to test this. Write a confrontation where a townsperson accuses her. Do they want her money (envy)? Do they want her to admit she changed (recognition)? Do they want her to leave (cowardice)? You can hear the answer in the dialogue. You cannot "hear" the answer to the American Dream question in dialogue without it sounding like a lecture.

  **Scene Impact:** High. It determines the antagonist's tactics. An envious antagonist undermines her success. A recognition-seeking antagonist undermines her *identity*.

  **What moves it down:** If the town functions as a monolithic chorus rather than individual characters.
  **What moves it up:** If the antagonists feel like caricatures or plot devices rather than people.

  ### 3. The Ideological Question
  **Are the American Dream and Jantelagen the same demand?**
  *(Includes: Promise vs. Threat, Who holds the scissors)*

  **Why it is third:** This is the most intellectually seductive question and the least useful for drafting. It is a thematic synthesis, not a plot engine. Whether the Dream and Jantelagen are twins or opposites is a conclusion the *reader* might draw after finishing the book, not a rule the *writer* needs to enforce in every scene.

  Focusing on this now is dangerous. It invites essayistic writing. It tempts you to make characters speak in thesis statements. It sounds deep, but if you settled it today, it wouldn't change a single line of dialogue in the next chapter unless you force it to. It is downstream of the first two: if you know she is guilty (Q1) and they want recognition (Q2), the "scissors" metaphor will emerge naturally from the resolution without you needing to philosophize it.

  **Scene Impact:** Low. Unless a character explicitly discusses sociological theory, this remains subtext.
  **What moves it up:** If you pivot the book from a character study to a social satire (e.g., *The Corrections* or *Revolutionary Road*), where the system is the true protagonist.
  **What moves it down:** Almost anything. Keep this in your notes, not your head.

  ### Summary of Defense
  You are stuck at 60k words because you are trying to solve the **Ideology** (Q3) to fix the **Mechanism** (Q2), when you haven't settled the **Legitimacy** (Q1).

  *   **Q1 is the Compass:** It tells you where the story ends.
  *   **Q2 is the Engine:** It tells you how the conflict manifests in the middle.
  *   **Q3 is the Weather:** It sets the atmosphere, but you don't need to name the storm to write about the rain.

  Stop asking what the town represents sociologically. Ask yourself: **Did she hurt them?** If you answer that, the rest of the wall crumbles.
