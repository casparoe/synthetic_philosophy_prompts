prompt: |-
  I've been going down a rabbit hole about Frege, the old logic guy, and I found out that near the end of his life he kept a diary — I think it was the early 1920s — and that whats in it is pretty ugly: antisemitic remarks, anti-democratic stuff, fretting about racial mixing, wanting a strong leader for Germany, that whole vibe. What actually surprised me is that most philosophers I see mention it seem to shrug and say it doesn't touch the real philosophy, the logic and the stuff about meaning. A friend of mine put it in a way I can't stop chewing on: she said it's just like separating the art from the artist — Wagner was a vile antisemite and people still listen to the Ring, Picasso treated women horribly and people still look at Guernica, so who cares what Frege thought about politics, the logic stands on its own. That framing feels obviously right to me and also a little too easy, and I genuinely can't tell which.

  Could you actually audit that comparison for me? I mean lay out what's supposed to map onto what — the man, the diary, the work, and us reading and teaching the work — and then tell me where the map breaks down. My nagging feeling is that a piece of music or a painting is a different kind of thing from a body of claims that are supposed to be true, and that some of Frege's own doctrines (the idea that logical laws are laws of truth that hold regardless of who's doing the thinking, thoughts sitting in some third realm, that kind of thing) might be more tangled up with his politics than a tune is with its composer. And even if the analogy mostly holds, does the conclusion my friend is reaching for — basically, we can keep teaching him and everyone should stop making a fuss — actually follow from it, or is the analogy carrying the whole conclusion on its back? No need for citations or a reading list, I just want the actual correspondence table, the places it cracks, and a straight answer on which parts of the philosophy (if any) the diary can and can't reach.
