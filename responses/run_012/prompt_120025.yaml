answer: |-
  **Exam Question: Decision Theory and Rationality**

  **Question 1 (25 Points)**
  Consider the standard two-urn Ellsberg setup. Urn A contains 50 red and 50 black balls (known composition). Urn B contains 100 balls of red and black in unknown proportions. An agent is offered bets paying $1 if a specified colour is drawn, $0 otherwise.

  (a) Assume the agent maximizes Subjective Expected Utility (SEU). Let $p$ be the agent's subjective prior probability that a ball drawn from Urn B is red. Demonstrate algebraically that the preference ordering between betting on Red from Urn A versus Urn B, and Black from Urn A versus Urn B, is determined strictly by whether $p$ is less than, greater than, or equal to $0.5$. Conclude why no single prior $p$ can rationalize a strict preference for Urn A on *both* colour bets. What does this imply about the defense that Ellsberg subjects merely possess "conservative" priors? (8 points)

  (b) A colleague proposes a modification: Urn B's composition is determined by a fair coin toss known to the agent. Heads yields 60 Red/40 Black; Tails yields 40 Red/60 Black. The colleague predicts that once this chance device is revealed, the preference for Urn A will vanish. Adjudicate this prediction. If the preference vanishes, does this indicate the agent was averse to compound risk, averse to a specific source of uncertainty, or sensitive to their epistemic position? If the preference persists, what axiom is being violated? (9 points)

  (c) To accommodate the original preference (Urn A preferred on both colours within the standard setup), one must modify the expected-utility apparatus. Identify two inequivalent theoretical repairs. For each, specify the distinct axiom or assumption sacrificed and briefly explain how the modification captures the preference without collapsing back into SEU. (8 points)

  ***

  **Model Answer**

  (a) Under SEU, the utility of a bet is the probability-weighted sum of outcomes. Let $u(1)=1$ and $u(0)=0$. For Urn A, the probability of Red is known: $P(R_A) = 0.5$. The expected utility of betting on Red from A is $0.5$. For Urn B, let the subjective prior be $P(R_B) = p$. The expected utility of betting on Red from B is $p$. A strict preference for Urn A on Red requires $0.5 > p$. Conversely, the probability of Black in Urn A is $0.5$, while in Urn B it is $1-p$. A strict preference for Urn A on Black requires $0.5 > 1-p$, which implies $p > 0.5$. These inequalities ($p < 0.5$ and $p > 0.5$) are logically incompatible. No single value of $p$ satisfies both. Consequently, the observed pattern cannot be modeled by any prior distribution within SEU. The defense that subjects hold "different" or "conservative" priors fails because SEU integrates all uncertainty into a single additive measure; variance in confidence about $p$ is irrelevant to the choice unless it alters the mean $p$, which cannot simultaneously be below and above $0.5$.

  (b) The colleague's prediction is theoretically sound *if* the agent adheres to the Reduction of Compound Lotteries. The modified Urn B presents a compound lottery: a 50% chance of a 0.6 probability of Red and a 50% chance of a 0.4 probability of Red. The reduced simple probability is $0.5(0.6) + 0.5(0.4) = 0.5$. Mathematically, this is identical to Urn A. If the preference for Urn A vanishes, it reveals the agent's original aversion was specifically to the *epistemic* gap (unknown probabilities) rather than statistical variance. It suggests the agent treats objective risk (known chances) differently from subjective uncertainty, but accepts Reduction when the objective chances are revealed. However, if the preference for Urn A *persists* despite the known coin mechanism, the agent violates Reduction of Compound Lotteries. This would indicate a source preference: the agent distinguishes between the "trustworthy" source (Urn A) and the "untrustworthy" source (Urn B), regardless of the mathematical equivalence of the resulting risk profiles.

  (c) Two inequivalent repairs exist. First, Maxmin Expected Utility (MEU) replaces the single prior with a set of priors. The agent evaluates acts by the minimum expected utility across this set. This sacrifices the Independence Axiom (or Sure-Thing Principle), as preferences become non-linear in probabilities. It captures the preference by assigning Urn B a set of priors spanning $[0,1]$, making the minimum expectation lower than Urn A's fixed $0.5$. Second, a Second-Order Belief model (such as Smooth Ambiguity) retains probabilistic sophistication but distinguishes between risk (first-order) and ambiguity (second-order). This sacrifices the Reduction of Compound Lotteries assumption. It models the agent as having a utility function over the distribution of expected utilities, allowing concavity over ambiguity distinct from risk aversion. Unlike MEU, this preserves probabilistic coherence but denies that second-order uncertainty reduces to first-order risk. Both repairs accommodate the preference, but MEU abandons linearity, while Second-Order models abandon reducibility.

  ***

  **Marking Scheme (25 Points)**

  **Part (a): The SEU Impossibility (8 Points)**
  *   **A-Level (7-8 pts):** Explicitly sets up the inequalities ($0.5 > p$ and $0.5 > 1-p$). States clearly that $p$ cannot be simultaneously $<0.5$ and $>0.5$. Concludes that *no* prior works, not just "unreasonable" ones.
      *   *Typical Error:* Claiming a prior with high variance explains the result (SEU only cares about the mean).
  *   **B-Level (5-6 pts):** Shows the algebra correctly but offers a vague moral (e.g., "priors don't match" rather than "no prior exists").
      *   *Typical Error:* Fails to derive the contradiction for the Black bet, only showing it for Red.
  *   **Fail (0-4 pts):** Incorrect algebra or claims SEU can explain it with a "safety" prior.

  **Part (b): The Coin-Flip Variant (9 Points)**
  *   **A-Level (8-9 pts):** Correctly identifies the reduced probability is 0.5. Distinguishes between the *vanishing* of preference (aversion to epistemic unknowns, accepts Reduction) and *persistence* (violates Reduction/Source Preference). Explicitly names "Reduction of Compound Lotteries."
      *   *Typical Error:* Confusing the coin flip with "removing ambiguity" without noting the axiom (Reduction) required to equate the two urns.
  *   **B-Level (5-7 pts):** Correctly calculates the 0.5 probability. States the preference should vanish but fails to articulate what axiom is at stake if it doesn't.
      *   *Typical Error:* Treats the coin flip as making Urn B "known" without addressing the compound lottery structure.
  *   **Fail (0-4 pts):** Claims the probabilities are still different or misidentifies the risk type.

  **Part (c): Theoretical Repairs (8 Points)**
  *   **A-Level (7-8 pts):** Names two distinct models (e.g., MEU and Second-Order/Smooth). Correctly identifies the specific sacrificed axiom for *each* (Independence/Sure-Thing vs. Reduction). Explains why they are inequivalent (linearity vs. reducibility).
      *   *Typical Error:* Listing two models that sacrifice the same axiom (e.g., MEU and Maxmin) or failing to name the axiom.
  *   **B-Level (5-6 pts):** Names two models but gives generic descriptions of the sacrifice (e.g., "drops EU assumptions" rather than "drops Independence").
      *   *Typical Error:* Claims SEU can be fixed by "adding a parameter" without changing axioms.
  *   **Fail (0-4 pts):** Only one repair offered or incorrect identification of the theoretical cost.

  **Total:** 25 Points.
  **Grade Boundary:** A (22+), B (17-21), C (12-16).
