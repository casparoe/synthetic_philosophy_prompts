          *   Make sure to distinguish between "Death is not an *experience*" vs "Death is not a *misfortune*."
          *   *Crucial distinction:* The "Deprivation Account" (Nagel) is the strongest counter to the roommate. I need to include that.

      *   *Refining the Roommate's Inconsistency:*
