  ### The Mary Decision Tree

  **Starting Commitment:** *When Mary first sees red, she gains something she didn't have before.*

  **Node 1: The Veridicality Check**
  Consider Mary's conviction that she has discovered a new feature of reality. Is this conviction a **veridical report** of a genuine feature of the world, or is it a **cognitive illusion** (a false belief generated by brain processing)?
  *   **Illusion:** Go to **Leaf 1**.
  *   **Veridical:** Go to **Node 2**.

  **Node 2: The Ability Test**
  Focus on the *nature* of what Mary gains. Is her new state best described as acquiring a **skill** (e.g., the ability to recognize, imagine, or remember red) or acquiring a **truth** (e.g., knowing *that* red looks like this)?
  *   **Skill:** Go to **Leaf 2**.
  *   **Truth:** Go to **Node 3**.

  **Node 3: The Re-acquaintance Case**
  Consider **Mary-Restored**, who had color vision, went blind, and had it surgically restored. Is the epistemic progress Mary-Restored makes upon restoration **identical** to the original Room-Mary's progress, or was Room-Mary's gain strictly **larger** (because she lacked the fact entirely, not just access to it)?
  *   **Identical (Old Fact):** Go to **Node 4**.
  *   **Larger (New Fact):** Go to **Node 6**.

  **Node 4: The Missing Shade Twin**
  Consider **Mary's Twin**, raised normally, who simply never encountered a specific shade of crimson. When the Twin sees that shade, is her epistemic gap **relevantly the same** as Room-Mary's (both are conceptual), or is Room-Mary's gap **unique** (because the Twin has physical concepts the Room-Mary lacks)?
  *   **Same Gap:** Go to **Node 5**.
  *   **Unique Gap:** Go to **Leaf 7** (Primitivism).

  **Node 5: The No-Concept Case**
  Imagine a version of Mary who has the experience of red but lacks the cognitive capacity to form **concepts** (e.g., an infant). Does this creature possess the **knowledge** Mary lacked, or does the knowledge *require* the concept?
  *   **Knowledge Requires Concept:** Go to **Node 5b**.
  *   **Knowledge Does Not Require Concept:** Go to **Leaf 5** (New Knowledge/Old Fact).

  **Node 5b: The Physical Analysis**
  For those who say concepts are required: Can the phenomenal concept Mary acquires be **fully defined or analyzed** using only physical/functional terms, even if it feels distinct?
  *   **Yes:** Go to **Leaf 3** (Type-B).
  *   **No:** Go to **Leaf 4** (Primitivism/Concept Dualism).
      *(Note: This leaf often collapses with Leaf 7; see commentary).*

  **Node 6: The Intrinsic Nature**
  (For the "New Fact" branch). When Mary learns the new fact, is she learning about a **structural/relational** property of the brain (how it functions/connects), or the **intrinsic/categorical** nature of the physical stuff itself?
  *   **Structural:** Go to **Leaf 6** (Property Dualism).
  *   **Intrinsic:** Go to **Node 7**.

  **Node 7: The Physical Base**
  (For the "Intrinsic" branch). Does learning this intrinsic nature reveal that the physical world was **incomplete** without it (dualism), or that the physical description was merely **abstract** and this completes it (monism)?
  *   **Incomplete (Dualism):** Go to **Leaf 6** (Property Dualism).
  *   **Abstract/Complete (Monism):** Go to **Leaf 8** (Russellian Monism).

  ---

  ### The Leaves

  **Leaf 1: Illusionism / Eliminativism**
  *   **Path:** Node 1 (Illusion).
  *   **View:** Phenomenal properties do not exist; Mary gains a false belief or a useful heuristic.
  *   **Awkward Commitment:** You must explain why the illusion of consciousness is itself not a conscious experience.

  **Leaf 2: Type-A Physicalism**
  *   **Path:** Node 1 (Veridical) → Node 2 (Skill).
  *   **View:** Mary gains no propositional knowledge, only abilities (know-how).
  *   **Awkward Commitment:** You must deny that "knowing what it's like" has any truth-conditional content whatsoever.

  **Leaf 3: Type-B Physicalism (Phenomenal Concept Strategy)**
  *   **Path:** Node 3 (Old) → Node 4 (Same) → Node 5 (Concept) → Node 5b (Yes).
  *   **View:** Mary learns an old physical fact under a new, distinctively phenomenal mode of presentation.
  *   **Awkward Commitment:** You must defend the existence of brute psychophysical identities that are necessary yet a posteriori.

  **Leaf 4: Primitivism (Conceptual)**
  *   **Path:** Node 3 (Old) → Node 4 (Same) → Node 5 (Concept) → Node 5b (No).
  *   **View:** The fact is physical, but the phenomenal concept is sui generis and unanalyzable.
  *   **Awkward Commitment:** You risk positing a dualism of concepts that looks suspiciously like a dualism of properties.

  **Leaf 5: New Knowledge of an Old Fact (Acquaintance View)**
  *   **Path:** Node 3 (Old) → Node 4 (Same) → Node 5 (No Concept).
  *   **View:** Mary gains non-conceptual acquaintance with a physical state she already knew about propositionally.
  *   **Awkward Commitment:** You must articulate a theory of non-conceptual knowledge that avoids collapsing into Type-A ability claims.

  **Leaf 6: Property Dualism**
  *   **Path:** Node 3 (New) → Node 6 (Structural) OR Node 7 (Incomplete).
  *   **View:** Mary learns a new, non-physical fact about the world that emerges from physical bases.
  *   **Awkward Commitment:** You must explain how non-physical properties causally interact with the physical brain without violating conservation laws.

  **Leaf 7: Primitivism (Metaphysical)**
  *   **Path:** Node 3 (Old) → Node 4 (Unique).
  *   **View:** Phenomenal properties are fundamental and sui generis, not reducible to physical concepts or facts.
  *   **Awkward Commitment:** You accept fundamental properties that are causally inert or mysteriously linked to the physical.
      *(Note: This often collapses with Leaf 4 or Leaf 8 depending on formulation).*

  **Leaf 8: Russellian Monism**
  *   **Path:** Node 3 (New) → Node 6 (Intrinsic) → Node 7 (Complete).
  *   **View:** Physics describes structure; Mary learns the intrinsic categorical nature of that structure.
  *   **Awkward Commitment:** You must posit that fundamental physical entities possess proto-phenomenal properties everywhere (panpsychism) or in specific combinations.

  ---

  ### Meta-Commentary & Collapses

  **Collapsed Leaves:**
  *   **Leaf 4 (Primitivism/Conceptual) and Leaf 7 (Primitivism/Metaphysical):** The tree struggles to separate these because both rely on phenomenal concepts being *sui generis*. The distinction rests on whether the *referent* is physical (Leaf 4) or primitive (Leaf 7), which is hard to sort via intuition pumps alone without asking direct metaphysical questions.
  *   **Leaf 3 (Type-B) and Leaf 5 (Acquaintance):** Both claim Mary learns an "old fact." The tree separates them via the **No-Concept Case** (Node 5), but many philosophers argue that "acquaintance" just *is* a type of phenomenal concept, causing these views to merge in practice.

  **Empty/Unattractive Branches:**
  *   **Node 3 (New Fact) + Node 5 (No Concept):** There is almost no one who argues Mary learns a *New Fact* but that it is *Non-Conceptual*. If it's a new fact about the world, it is typically taken to be propositional/conceptual. This combination is effectively unoccupied.
  *   **Node 1 (Illusion) + Node 2 (Truth):** This is logically incoherent. If the gain is veridical truth, it cannot be an illusion. The tree prevents this path.

  **Node Count:** 8 Nodes.
  **Leaf Count:** 8 Leaves.
