answer: |-
  # JOINT STATEMENT ON TEMPORAL AUTHORITY IN ADVANCE DIRECTIVES

  **Working Group on Bioethics and Personal Identity**
  **Date:** October 26, 2023
  **Signatories:** [Name, Precedent Autonomy View] & [Name, Current Interest View]

  ### I. AGREED CLAIMS

  We, the undersigned, acknowledge a shared commitment to patient welfare and autonomy, despite divergent metaphysical accounts of personal identity over time. We affirm the following propositions as the baseline for our continued work:

  1.  **The Reality of Psychological Discontinuity:** We agree that advanced dementia constitutes a significant attenuation of psychological continuity. The cognitive capacities, memory structures, and value-systems present at the time of directive signing (Time 1) are not fully present in the advanced dementia state (Time 2).
  2.  **The Necessity of Competence at Time 1:** We agree that for an advance directive to hold *any* moral weight, it must be executed by a person possessing decision-making capacity at Time 1. A directive signed under coercion or incompetence is void ab initio for both of us.
  3.  **The Instability of Time 2 Preferences:** We agree that expressed preferences in the advanced dementia state are often volatile, context-dependent, and susceptible to immediate environmental framing (e.g., pain, hunger, tone of voice). Neither of us treats a fleeting expression of desire at Time 2 as automatically equivalent to a settled value.
  4.  **The Risk of Abuse:** We agree that any policy regarding advance directives must guard against third-party manipulation. Whether the risk is ignoring a valid directive to harvest organs (violating Time 1) or enforcing a directive to save costs despite Time 2's contentment (violating Time 2), safeguards are required.
  5.  **The "Fade" and "Lock" Mechanisms:** We acknowledge two primary structural designs for directives:
      *   **The Lock Clause:** The Time 1 decision remains binding regardless of Time 2 objections.
      *   **The Fade Clause:** The Time 1 decision expires after a set interval unless reaffirmed by the patient.
  6.  **Suffering Matters:** We agree that severe physical suffering at Time 2 is a moral bad that must be weighed, even if we disagree on whether Time 2's *experiential* happiness can outweigh Time 1's *critical* interests.

  ---

  ### II. DISAGREEMENTS TABLE

  | Issue | Position A (Precedent Autonomy) | Position B (Current Interest) |
  | :--- | :--- | :--- |
  | **1. Source of Authority** | Authority derives from the **narrative integrity of the whole life**. The Time 1 self has a legitimate stake in how the story ends and protects their biographical life from degradation. | Authority derives from **phenomenological existence**. Only the being currently experiencing pleasure or pain has a claim to dictate what happens to that body. |
  | **2. The "Ownership" Objection** | Rejects the claim that Time 1 "owns" Time 2. Argues that Time 1 is protecting the *person's* life plan, not treating the later body as property. To ignore Time 1 is to disrespect the person who lived 90% of the life. | Maintains that enforcing Time 1 against Time 2's will is functionally indistinguishable from **intergenerational tyranny**. It treats the Time 2 self as a vessel for Time 1's values. |
  | **3. Nature of Time 2 "No"** | A Time 2 refusal (e.g., "I want to live") is an expression of **experiential interest** but lacks **critical competence**. It is akin to a child's preference; important for welfare, but not veto-power over prior competent decisions. | A Time 2 refusal is the **only valid consent/withdrawal** available. Even if cognitively impaired, the being is the one who must endure the consequence. A "no" is a boundary, not a preference. |
  | **4. The "Fade" Clause** | **Skeptical.** If the interval was set competently at Time 1, requiring reaffirmation undermines the purpose (protecting against incompetence). If Time 2 reaffirms, it is merely a check, not a new grant of authority. | **Supportive but Strict.** A directive *must* fade to respect current autonomy. However, if Time 2 reaffirms while demented, that reaffirmation is **suspect**. Valid reaffirmation requires capacity, which defeats the purpose of the directive. |
  | **5. The "Lock" Clause** | **Necessary.** Essential for cases where the Time 1 self wishes to avoid a specific state of existence (e.g., severe dementia) regardless of whether that state feels happy to the Time 2 self. | **Unacceptable.** A Lock Clause presumes the Time 1 self can accurately price the welfare of a future self they will no longer resemble. It risks condemning a happy being to death to satisfy a ghost. |

  ---

  ### III. CRUXES, EVIDENCE, AND PREDICTIONS

  We identify three specific cruxes where our theoretical disagreement yields different practical outcomes. For each, we identify a piece of evidence or a case type we both accept as relevant, and we record our conflicting predictions.

  #### Crux 1: The "Cheerful Dementia" Case
  *   **The Case:** A patient signed a directive stating, "If I develop advanced dementia, do not prolong my life." They now have advanced dementia, appear cheerful, recognize family vaguely, and say, "I like it here. I want to stay."
  *   **Agreed Evidence:** Longitudinal studies on affect in dementia patients (e.g., Magai et al.) showing positive affect can remain intact despite cognitive loss.
  *   **Prediction (Position A):** The directive should be followed. The Time 1 self's critical interest in not living a "life of the mindless" outweighs Time 2's experiential happiness. To do otherwise is to allow the *disease* to veto the *person*.
  *   **Prediction (Position B):** The directive should be suspended. Time 2 is a sentient being with a positive welfare balance. Killing Time 2 to satisfy Time 1's abstract values is a harm to the only entity that currently exists.
  *   **Verbal Dispute Check:** We suspect we may disagree on the definition of **"Harm."** Position A sees harm as *narrative violation*; Position B sees harm as *experiential suffering/deprivation*.

  #### Crux 2: The "Fluctuating Wish" Case
  *   **The Case:** A patient with moderate dementia fluctuates daily. On Monday, they say, "I don't want to be a burden, stop treatment." On Tuesday, they are cheerful and say, "Feed me, I'm hungry."
  *   **Agreed Evidence:** Clinical data on decisional capacity fluctuation in neurodegenerative disease.
  *   **Prediction (Position A):** The Time 1 Directive (Lock) resolves the fluctuation. Time 1 provides the stable anchor. If no Time 1 directive exists, we look to prior values, not Tuesday's mood.
  *   **Prediction (Position B):** The fluctuation proves **no current authority exists**. We cannot treat Tuesday's "yes" as binding, so we cannot treat Monday's "no" as binding either. We default to preservation of life because no stable *current* self exists to authorize death.
  *   **Note on Fade Clause:** Here, the **Fade Clause** fails to move either of us.
      *   *Why Position A is unmoved:* The Time 1 self already "priced in" the risk of fluctuation when they set the interval. Requiring reaffirmation during fluctuation is impossible, so the Fade becomes a Lock by default (if you miss the window, you die) or a Nullity (if you miss the window, treatment continues).
      *   *Why Position B is unmoved:* If the reaffirmation is required during fluctuation, it is invalid. If the directive fades because reaffirmation is impossible, Position B is happy, but Position A views this as a failure of the system to protect the Time 1 self.

  #### Crux 3: The "Reaffirmation" Validity
  *   **The Case:** A "Fade" directive requires renewal every 2 years. The patient is now mildly demented but signs the renewal form, smiling.
  *   **Agreed Evidence:** Data on "assent" vs. "consent" in impaired populations.
  *   **Prediction (Position A):** The renewal is **procedurally valid** but not **morally necessary**. The original Lock was sufficient. The renewal is just a safety check. If they refuse renewal, the original Lock should arguably still hold (as the refusal is incompetent).
  *   **Prediction (Position B):** The renewal is **void**. If they are demented enough to need a directive, they are demented enough to lack capacity to renew. Therefore, a Fade Clause effectively nullifies the directive upon onset of dementia. This is the only acceptable outcome.

  ---

  ### IV. ENDING NOTE: FRAGILITY AND META-REFLECTION

  **1. The Most Fragile Agreed Claim**
  Claim #1 (**The Reality of Psychological Discontinuity**) is the most fragile.
  *   **The Argument That Blows It Up:** If emerging neuroscience demonstrates that "psychological continuity" is a binary switch that rarely trips even in advanced dementia (i.e., if the Time 2 self retains enough core narrative memory to be legally/morally the *same* agent as Time 1), Position B collapses into Position A. Conversely, if it is proven that Time 1 and Time 2 are neurologically distinct entities sharing a body (a "fission" scenario), Position A becomes morally indefensible (treating one person as bound by another's contract). Our agreement relies on continuity being *attenuated* but not *severed*.

  **2. Where This Framing May Be Wrong (Drafter's Note)**
  This document frames the dispute as a conflict over **temporal authority** (who gets to decide: Past or Present?). This may be a category error.
  *   **The Potential Error:** The dispute may not be about *time* at all, but about **risk allocation**. Position A is fundamentally about protecting the *probability* of a dignified death (avoiding the risk of dementia). Position B is about protecting the *certainty* of current existence (avoiding the risk of wrongful death).
  *   **What Would Have to Be True:** If the core disagreement is actually about **trust in medical proxies** rather than metaphysics, then our focus on "Selfhood" is a distraction. If Position A would actually allow the directive to be overridden if a *trusted proxy* (not the demented patient) said "She looks happy," and Position B would override the patient if a *trusted proxy* said "He always hated this state," then the "Self vs. Self" war is a proxy for "Rule vs. Discretion." If that is true, this Joint Statement has formalized a ghost fight while missing the real policy lever.
