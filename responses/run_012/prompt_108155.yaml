answer: |-
  Here is the specification you asked for. It treats the Precautionary Principle (PP) not as a moral aspiration but as a regulatory algorithm. If a rule cannot meet these specs, it is rhetoric, not policy.

  ### Part 1: The Specification (Requirements List)

  To function as a decision rule, a theory of precaution must satisfy six substantive requirements and three meta-requirements.

  #### Substantive Requirements

  **1. The Trigger Threshold (Uncertainty vs. Risk)**
  *   **The Rule:** The principle activates *only* when there is plausible evidence of harm but insufficient data to calculate a reliable probability distribution. It does not apply to known risks (that is prevention) or pure ignorance (where no mechanism is known).
  *   **The Case:** *The Chemical.* You have a bad signal in rats but no human epidemiology. This is uncertainty (mechanism known, probability unknown). PP applies.
  *   **The Case:** *The Drug.* A side effect shows up at scale. Once the rate is known (e.g., 1 in 10,000), this is risk, not uncertainty. PP recedes; standard Risk Management takes over.
  *   **Why:** Collapsing risk into uncertainty paralyzes all regulation. You must distinguish "we don't know the odds" from "we know the odds are bad."

  **2. The Burden of Proof Allocation**
  *   **The Rule:** The rule must explicitly state who must produce evidence to clear the trigger. Is it the proponent (prove safety) or the regulator (prove harm)?
  *   **The Case:** *The Gene Drive.* If the burden is on the regulator to prove ecological collapse before release, the drive proceeds. If the burden is on the proponent to prove *no* ecological collapse, it stops.
  *   **Why:** Under uncertainty, evidence is incomplete. The decision is determined by who loses when data is missing. A rule that doesn't assign the burden is not a rule.

  **3. The Reversibility Constraint**
  *   **The Rule:** The stringency of the precaution must scale inversely with the reversibility of the action. Irreversible actions require higher confidence thresholds than reversible ones.
  *   **The Case:** *The Gene Drive.* Self-propagating genetic modification is effectively irreversible in the wild. This demands a near-zero tolerance for uncertainty.
  *   **The Case:** *The Drug.* If a drug causes a rare side effect, it can be withdrawn. The precaution can be lighter (e.g., post-market surveillance rather than pre-market ban).
  *   **Why:** Treating a reversible error the same as an irreversible catastrophe is irrational risk management, not precaution.

  **4. Symmetry of Harm (Inaction Costs)**
  *   **The Rule:** The rule must treat the harms of *inaction* (delay, moratorium, rejection) as precautionary triggers equal to the harms of *action*.
  *   **The Case:** *The Malaria Vector.* Delaying the gene drive prevents ecological risk but guarantees continued malaria transmission. The "precaution" of waiting must be weighed against the "risk" of waiting.
  *   **The Case:** *Delayed Approval.* A moratorium on a safe drug kills patients who need it. If the rule ignores this, it is status-quo bias, not precaution.
  *   **Why:** This is the only way to prevent the principle from becoming a one-way ratchet that blocks innovation regardless of the cost of the status quo.

  **5. The Aggregation Clause**
  *   **The Rule:** The rule must account for cumulative risks from multiple small actions that are individually acceptable but collectively catastrophic.
  *   **The Case:** *Chemical Exposure.* One chemical at low dose passes the trigger. Ten chemicals at low doses might not. A robust rule catches the "cocktail effect."
  *   **Why:** Narrow scoping allows regulators to approve death by a thousand cuts while claiming adherence to precaution.

  **6. The Exit Strategy**
  *   **The Rule:** Any precautionary measure (ban, delay, restriction) must have defined conditions for re-evaluation or removal.
  *   **The Case:** *The Chemical.* If you ban based on animal signals, you must mandate new testing to see if human data resolves the uncertainty.
  *   **Why:** Precaution under uncertainty cannot be permanent. If uncertainty is never resolved, the rule becomes a permanent ban by default.

  #### Meta-Requirements

  **7. Decisional Closure (Action-Guiding)**
  *   **The Rule:** The output must be a binary or ternary decision (Proceed, Stop, Modify), not a recommendation to "be careful" or "study more."
  *   **Why:** "Study more" is a delay tactic. A regulator facing a submission must rule on the submission.

  **8. Non-Malleability**
  *   **The Rule:** The rule cannot be logically inverted to justify opposite conclusions using the same data.
  *   **Why:** As you noted, if "don't release" and "release to stop malaria" are both "precautionary," the term is empty.

  **9. Non-Reduction to Expected Utility**
  *   **The Rule:** The rule cannot simply be a hidden Cost-Benefit Analysis (CBA) that assigns arbitrary numbers to uncertain outcomes. It must offer a distinct logic for decision-making under *unknown* probabilities.
  *   **Why:** If it's just CBA with extra steps, use CBA. The PP claims to solve the problem where CBA fails (missing probabilities).

  ---

  ### Part 2: Non-Negotiable vs. Taste

  **Non-Negotiable (Regulatory Viability)**
  *   **Decisional Closure:** You cannot write a regulation that tells a committee to "consider caution." It must tell them how to vote.
  *   **Symmetry of Harm:** In public health, inaction kills. A rule that ignores the cost of delay is ethically indefensible in a health department.
  *   **Burden of Proof:** Legally, someone must lose if the data is ambiguous. You cannot leave this open.

  **Matter of Taste / Policy Preference**
  *   **Trigger Threshold:** Where exactly you draw the line between "plausible evidence" and "speculation" is policy. Some camps want a single rat tumor to trigger PP; others want mechanistic proof. This is risk tolerance, not logic.
  *   **Reversibility Weighting:** How much *more* stringent an irreversible action must be is a calibration choice, though the distinction itself is non-negotiable.
  *   **Aggregation Scope:** Defining what counts as a "cumulative exposure" (same chemical class? same mechanism? all stressors?) is technically difficult and often a policy choice.

  ---

  ### Part 3: The Incompatibility Analysis

  Your hunch is correct. There is a formal tension here, often discussed in decision theory as the **Impossibility Theorem of Precaution**.

  **The Conflict:**
  You cannot simultaneously satisfy **Decisional Closure**, **Symmetry of Harm**, and **Non-Reduction to Expected Utility** when facing **Radical Uncertainty**.

  1.  **Decisional Closure** requires you to choose Option A (Release) or Option B (Ban).
  2.  **Symmetry of Harm** requires you to weigh Malaria Deaths (Option A risk) against Ecological Collapse (Option B risk).
  3.  **Non-Reduction to Expected Utility** forbids you from assigning probabilities to these outcomes because, by definition, they are uncertain (otherwise it's just Risk Management).

  **The Result:**
  If you cannot assign probabilities (Non-Reduction), you have no common metric to weigh Malaria Deaths against Ecological Collapse (Symmetry). If you have no common metric, you cannot make a binary choice (Closure) without arbitrarily privileging one harm over the other.

  Most "Strong Precautionary" versions resolve this by violating **Symmetry**: they privilege the *new* risk (Ecology) over the *status quo* risk (Malaria). This makes them action-guiding, but biased.
  Most "Risk Management" versions resolve this by violating **Non-Reduction**: they assign subjective probabilities to the uncertainty to run a CBA. This makes them action-guiding and symmetric, but they are no longer Precautionary Principles; they are Bayesian Decision Rules.

  **Conclusion:** A theory of precaution that is truly distinct from CBA *cannot* be fully action-guiding in cases of conflicting uncertain harms. It will either paralyze (fail Closure) or bias toward the status quo (fail Symmetry).

  ---

  ### Part 4: The Killer Requirement

  The single requirement that knocks out the most otherwise-popular versions of the principle is **Symmetry of Harm (Requirement #4)**.

  **Why it kills popular versions:**
  Almost all political and popular articulations of the Precautionary Principle (e.g., the Wingspread Statement, various NGO charters) are inherently asymmetric. They are designed to block *new* technologies by focusing exclusively on the risks of *intervention*. They treat the status quo as "safe" and the intervention as "risky."

  *   **The Test:** If you apply Symmetry to the gene-drive question, you must acknowledge that *not* releasing the mosquitoes is an active intervention with a body count (malaria deaths).
  *   **The Collapse:** Once you admit that inaction has risks that must be weighed against action risks, you are forced to compare them. To compare them, you need a common currency (lives saved vs. species lost). To find that currency, you inevitably slide into a form of Cost-Benefit Analysis.
  *   **The Outcome:** Enforcing Symmetry exposes that the "Precautionary Principle" is often just a rhetorical shield for status-quo bias. It forces the principle to either admit it is a form of CBA (violating Meta-Req #9) or admit it cannot make a decision when both action and inaction carry uncertain catastrophic risks (violating Meta-Req #7).

  **Recommendation for your Rule:**
  If you want a rule that survives legal challenge and ethical scrutiny, **write Symmetry into the statute.** Do not allow the panel to treat "delay" as a neutral baseline. Force the vote to acknowledge that a "No" vote is a prediction that ecological harm outweighs malaria deaths. This breaks the malleability you despise: it prevents the anti-tech camp from using PP to block the drive without accounting for the cost of the block. It forces the "precaution" to be about *net survival*, not just *novelty avoidance*.
