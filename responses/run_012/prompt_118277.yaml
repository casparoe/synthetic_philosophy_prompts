answer: |-
  Your position is critically exposed because the "selection" mechanism you propose either collapses into ordinary physicalism or renders mental properties causally idle.

  The core machinery working against you is the Causal Exclusion Argument. Imagine a physical event (your arm rising) has a sufficient physical cause (neurons firing). If your mental state (decision) is distinct from those neurons, it looks like a second cause. If the physical cause is enough, the mental cause is unnecessary. If you say the mental cause doesn't add energy but just "selects" the physical cause, you face three ranked threats.

  **1. Fatal: The Selection Regress (Your specific suspicion)**
  You are right to be moved by the worry that the selecting relation is itself physical. If the mental property "selects" which physical events count as causes, there must be a fact of the matter about why *this* physical event was selected by *that* mental property. If this selecting relation is grounded in the physical brain (which it must be, since the mental is fixed by the physical), then the physical brain is doing the selecting. The mental property becomes a passive label for what the brain is doing. If the selecting relation is *not* physical, you have introduced a non-physical force linking mind to body, which violates your commitment to the physical world being causally complete. Defenders of your view often concede this tension but argue that "selection" is not an extra event, but a structural relationship. Critics argue this admits the mental property isn't doing the work; the structure is. This collapses your view into ordinary physicalism where only the neurons cause the action, and the "decision" is just a description we use.

  **2. Fatal: The Probabilistic Relevance Test**
  The test you mentioned—that a property is irrelevant if knowing the physical facts makes the mental facts add no predictive power—is widely accepted in sciences that rely on statistics. Since you agree mental states are entirely fixed by physical states, once we know the physical facts, the mental facts are guaranteed. Therefore, adding mental facts changes nothing about the probability of the behavior. Critics argue this proves mental properties have no causal leverage. Defenders concede the test shows mental properties add no *new prediction*, but they deny this proves causal irrelevance. They argue causation is about dependence, not just prediction. However, if you cannot show that the mental property makes a difference that the physical property does not already make, the view struggles to prove the mental is doing anything real rather than just mirroring the physical.

  **3. Awkward: Causation vs. Selection Distinction**
  The distinction between "pushing" (producing energy) and "selecting" (difference-making) is conceptually fragile. In physics, causes are typically understood as transfers of energy or momentum. If your mental states do not transfer energy, calling them "causes" requires redefining causation. If you redefine causation to mean "picking out relevant factors," you risk changing the subject. Critics argue you are describing *explanation* (how we understand the event) rather than *causation* (what actually happened in the world). Defenders concede that mental causation is not "production" but insist it is a genuine form of "dependence." This is awkward because it leaves you arguing over the definition of words rather than the structure of reality.

  **Ontology vs. Explanation**
  You asked if the claim is about the world or only about how we explain things. If it is only about explanation, it sinks your claim that mental states *genuinely cause* things. It would mean mental states are useful fictions for storytelling, while only physical states actually drive the universe. To maintain genuine causation, the "selection" must be a feature of the world, not just our minds. But if it is a feature of the world, it must interact with physical laws, returning you to the Fatal objections above. Defenders try to walk this line by saying the dependency is real, but the *description* is relative to us. Critics say this admits the causation isn't fully real.

  **Defenders vs. Critics**
  Defenders of your position (often called Non-Reductive Physicalists) concede that mental causation does not compete with physical causation. They argue physical causes explain *how* the movement happened, while mental causes explain *why* it happened. They concede the physical world is causally complete. Critics (like Jaegwon Kim) argue this concession is fatal: if the physical is complete, the mental is excluded. Defenders reply that exclusion only applies if causes compete for the same job, and they argue mental and physical causes do different jobs. You need to decide if "doing a different job" is enough to count as genuine causation.

  **Empirical Predictions and Falsifiability**
  Your view predicts that you will never find a case where the physical cause is present but the mental cause is absent (because the mental is fixed by the physical). A rival view (Reductive Physicalism) predicts the same thing. A rival view (Dualism) might predict mental states could vary without physical changes, but you have ruled that out. Therefore, your position is empirically unfalsifiable; no experiment can distinguish your view from the view that mental states are just physical states described differently. This is a problem. If a theory cannot be tested, it is vulnerable to Occam's Razor: why posit mental causes if physical causes explain everything? The honest verdict is that your position is a metaphysical stance, not a scientific hypothesis. It is unfalsifiable, and while that is not always a problem in philosophy, it means you cannot use empirical evidence to defend it against critics who say you are multiplying entities beyond necessity.
