prompt: |-
  I direct the rules-review unit of a state agency — the office the legislature created when it attached a sunset clause to our administrative code. Six hundred and twenty rules sit in the code; under the statute each one lapses in twenty-two months unless the commission affirmatively re-authorizes it, and the commission has told us it will vote in bundles of about forty. My staff is four analysts, none of them lawyers, plus one deputy counsel. Each analyst gets roughly six hours per rule. Every file we send up has to be defensible in writing, because we have already been sued once over a rule we let lapse, and because the public comment record is where the losers of these votes will go looking for their arguments. The mandate's language is about unnecessary burdens on regulated parties, but the commission is not interested in a crude cost-benefit ledger, and neither am I.

  What I want from you is a decision procedure my analysts can actually run on a single rule, in the spirit of Chesterton's fence and of the Burkean presumption that inherited arrangements may embody knowledge no living person possesses. It should give me: the questions to ask, in order; what counts as a sufficient answer to each; the point at which the procedure stops with repeal and the point at which it stops with retention; the point at which it must stop and hand the file to a person, which person, and with what question stated rather than answered; and the fields the written record must contain so that the reasoning survives litigation, public comment, and a change of commission. Be explicit about which steps are judgment calls wearing the costume of a test.

  Two failure modes have to be handled head-on, because both are live in my office. The first is Chesterton's fence used as a thought-terminating veto: an incumbent tells my analyst that a rule has reasons, declines to state them, and the file closes with retention. The second is the mirror-image rationalism: no one can articulate a purpose within the six-hour budget, so the analyst concludes there is none and recommends repeal. A procedure that only guards against one of these is worse than none, because it will be cited as neutral while doing one side's work.

  Three things we have learned the hard way, and I want them built in rather than footnoted. First, the rationale recorded for a rule, the actual historical cause of it, and its present function are three different things, and they frequently fail to match; a scandal, a compromise, or a copying error from another state's code can leave a rule whose stated purpose is fiction and whose real work is real. Second, compliance data and enforcement data are not function data: a rule cited zero times in eleven years may still be doing work through the mere fact of its existence, and a rule with universal compliance may be doing nothing, or may be doing something other than what its text says. Third, rules come in bundles, and repealing two innocuous-looking rules at once is not the sum of repealing each alone.

  I also need the procedure to distinguish a fence from a tollbooth. Some standing arrangements are defended by their beneficiaries rather than by their trustees — the moral case and the commercial case for a rule often arrive in the same envelope — and a procedure that treats every defender as a custodian of inherited wisdom will preserve rents, while one that treats every defender as a rentier will knock down load-bearing walls. Tell me how the analyst is supposed to tell these apart in six hours without either naivety or cynicism, and say plainly when the distinction cannot be made on the evidence available.

  Two asymmetries should be addressed rather than assumed away. Repeal is cheap and re-enactment is expensive: it takes a coalition, a session, and a scandal. And the costs of a rule show up in invoices and complaint letters, while the harms it prevents show up nowhere, because they are the harms that did not happen. If the procedure corrects for either asymmetry, say how; if it refuses to, say why that is the honest choice.

  Then run the procedure on three rules from my docket, showing the file as the analyst would fill it in:

  - A rule requiring a particular hazardous operation to be performed by a licensed person rather than by an automated system. Its recorded rationale is a fire risk that no longer exists in that form. My analysts believe it is obsolete. It also appears to be the only place in our code where a diffuse and unorganized group — the people who live near these facilities — has a right to be notified.
  - A rule with no rationale in the file at all, no citations in eleven years, and unanimous staff testimony that it is pointless. One analyst has noticed that it is the legal hook for a reporting practice on which four other rules silently depend.
  - A rule the commission plainly wants gone, because it imposes substantial recurring costs on an industry with an effective lobbying presence, and which appears to be the sole protection for a group with no lobbying presence at all. Whether the protection actually works is unknown, and the evidence that would settle it is not obtainable within the six-hour budget.

  At least one of the three should come out the way the commission will not like, and you should show what the record has to say so that my analyst can defend that outcome in the room rather than fold.

  Finally, tell me what this procedure cannot do, where it will misfire, and which of the questions above should never have been turned into a procedure in the first place. Assume my analysts are careful readers who have never taken a philosophy course; if a distinction cannot be applied by someone in six hours with a case file and a phone, it does not belong in the procedure, however true it is.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Deconstruct the Request:**

      *   **Role:** Director of a rules-review unit in a state agency.
      *   **Context:** Sunset clause on administrative code (620 rules, 22-month lapse, 40-rule bundles). Staff: 4 analysts (non-lawyers), 1 deputy counsel. Budget: 6 hours/rule.
      *   **Constraints/Requirements:**
          *   Defensible in writing (litigation, public comment, commission turnover).
          *   Mandate: "Unnecessary burdens," but *not* crude cost-benefit.
          *   Philosophy: Chesterton's Fence / Burkean presumption (inherited wisdom), but avoid thought-terminating clichés.
          *   Failure Modes to Avoid: 1. "Because reasons" (veto), 2. "Can't explain = repeal" (rationalist hubris).
          *   Hard-Won Lessons to Integrate: 1. Rationale $\neq$ History $\neq$ Function. 2. Compliance/Enforcement $\neq$ Function. 3. Interdependency (bundling effects).
          *   Fence vs. Tollbooth: Distinguish public good from private rent without cynicism or naivety.
          *   Asymmetries: Repeal cheap/Re-enact expensive; Visible costs/Invisible benefits.
          *   Output: Decision procedure (questions, stop points, hand-offs, record fields), applied to 3 specific cases, plus limitations/meta-analysis.
          *   Tone: Professional, pragmatic, legally robust, philosophically grounded but operational.

  2.  **Develop the Decision Procedure (The "Protocol"):**

      *   *Goal:* A 6-hour workflow that forces inquiry without demanding impossible knowledge.
      *   *Structure:* Phased approach.
          *   Phase 1: Inventory & Interdependency (Hour 1).
          *   Phase 2: Function & History (Hours 2-3).
          *   Phase 3: Burden & Benefit (Hours 4-5).
          *   Phase 4: Synthesis & Record (Hour 6).
      *   *Key Mechanism:* The "Burden of Proof" shift. Start with presumption of retention, but require *articulable function*, not just *existence*.
      *   *Addressing Failure Modes:*
          *   To stop "Because reasons": Require *who* benefits and *how*. If unnamed, flag for Counsel.
          *   To stop "Can't explain = repeal": Require *external consultation* before repeal recommendation.
      *   *Addressing Fence vs. Tollbooth:* Look for *diffuse beneficiaries* vs. *concentrated beneficiaries*. Look for *excludability*.
      *   *Addressing Asymmetries:* Explicitly document "Invisible Harms" (what happens if this goes?). Acknowledge re-enactment cost in the "Repeal Risk" field.
      *   *Hand-off Points:* When legal authority is unclear, when interdependency is found, when political risk is high.

  3.  **Drafting the Procedure Steps (Iterative Refinement):**

      *   *Step 1 (The Hook):* Don't just ask "What does it do?" Ask "What breaks if it vanishes?" (Counterfactual).
      *   *Step 2 (The History):* Acknowledge the "Scandal/Compromise" reality. Don't trust the preamble blindly.
      *   *Step 3 (The Stakeholders):* Who speaks for this? (Fence vs. Tollbooth test).
      *   *Step 4 (The Cost):* Not just money, but friction.
      *   *Step 5 (The Verdict):* Retain, Repeal, or Refer.

      *Refining the "Judgment Calls":* I need to explicitly state where the analyst is making a call. E.g., determining if a beneficiary is "diffuse" is a judgment call.

      *Refining the Record:* Needs specific fields for litigation defense. "Functional Hypothesis," "Consultation Log," "Interdependency Check."

  4.  **Applying to the Three Cases:**

      *   *Case 1 (Licensed Person vs. Automation + Notification):*
          *   Surface: Obsolete fire risk.
          *   Deep: Notification right for neighbors (diffuse group).
          *   Outcome: Retain (or Modify), but *not* for the stated reason. The "Notification" function is the real fence.
          *   Defense: Acknowledge the fire risk is dead, but the procedural right is live.
      *   *Case 2 (No Rationale, Zero Enforcement, Hidden Hook):*
          *   Surface: Pointless.
          *   Deep: Legal hook for 4 other rules.
          *   Outcome: Retain (with note). Repealing this collapses the bundle.
          *   Defense: Interdependency.
      *   *Case 3 (Commission wants gone, Industry hates, Unprotected Group):*
          *   Surface: High cost, low evidence of efficacy.
          *   Deep: Sole protection for voiceless group. Asymmetry of power.
          *   Outcome: Retain (The one the Commission won't like).
          *   Defense: The "Precautionary Principle" within the sunset context. The cost of re-enactment is too high if we are wrong. The evidence gap is a reason to *keep* it, not kill it, given the mandate's bias against "unnecessary" burdens (is a necessary burden unnecessary?). Actually, the prompt says mandate is "unnecessary burdens." If efficacy is unknown, is it unnecessary?
          *   *Correction:* If efficacy is unknown, the "Burden" is known. The "Benefit" is hypothetical. However, the asymmetry argument (Re-enactment is hard) suggests caution. The prompt asks for *one* outcome the Commission won't like. This is the candidate. The argument is: "We cannot confirm it works, but we cannot confirm it *doesn't*, and rebuilding it is impossible." This leans on the Burkean presumption.

  5.  **Addressing the Meta-Questions (Limitations & Philosophy):**

      *   *What can't it do?* It can't measure political will. It can't solve the "Invisible Harm" problem definitively.
      *   *Which question shouldn't be a procedure?* The "Fence vs. Tollbooth" distinction is inherently political. Formalizing it risks bureaucratizing value judgments.
      *   *Asymmetries:* The procedure must explicitly weigh the "Re-enactment Cost." If we kill it and need it, can we get it back? If no, presumption shifts to Retain.

  6.  **Writing the Response:**

      *   *Tone:* Direct, administrative, respectful of the constraints.
      *   *Structure:*
          1.  The Procedure (The "Sunset Protocol").
          2.  The Record Fields.
          3.  The Three Case Applications.
          4.  Limitations & Meta-Analysis.
      *   *Check against constraints:* 6 hours? Yes. Non-lawyers? Yes (Counsel hand-off points included). Litigation proof? Yes (Record fields).

      *(Self-Correction during drafting)*: Make sure I don't make the procedure too long. 6 hours is tight. The questions must be sharp.
      *Crucial distinction:* The "Fence vs. Tollbooth" test needs to be operational.
      *Test:* Is the beneficiary organized? Is the benefit excludable?
      *If Organized + Excludable = Tollbooth (Suspect).*
      *If Diffuse + Non-excludable = Fence (Presume Valid).*
      *If Mixed = Hand-off to Deputy Counsel.*

      *Addressing the Asymmetry:* Include a specific field: "Re-enactment Feasibility." If Low, Burden of Proof for Repeal increases.

      *Case 3 Nuance:* The Commission wants it gone. To defend retention, the analyst must argue that the *uncertainty* itself justifies retention under the sunset statute because the statute asks if the burden is *unnecessary*. If the benefit is unknown, the necessity is unknown. But the cost of being wrong (losing the protection forever) outweighs the cost of being right (saving industry money for 22 months). This is the "Burkean" argument.

  7.  **Final Review against Prompt:**
      *   Decision procedure? Yes.
      *   Questions in order? Yes.
      *   Stop points? Yes.
      *   Hand-off points? Yes.
      *   Record fields? Yes.
      *   Judgment calls identified? Yes.
      *   Failure modes addressed? Yes.
      *   Three hard-won lessons integrated? Yes.
      *   Fence vs. Tollbooth? Yes.
      *   Asymmetries? Yes.
      *   Three cases run? Yes.
      *   One outcome Commission dislikes? Yes (Case 3).
      *   Limitations/Meta? Yes.

  8.  **Final Polish:** Ensure the voice is appropriate for a Director speaking to a Director (peer-to-peer, high competence). Avoid academic jargon where possible, keep it operational. (Proceed to generate output).

  *(Self-Correction on Case 3)*: Wait, if the mandate is "unnecessary burdens," and the benefit is unknown, a strict reading suggests repeal. However, the prompt asks for a Burkean/Chesterton approach *within* that mandate. The argument must be: "We cannot determine if the burden is unnecessary because we cannot determine the function. Therefore, the statutory condition for lapse ('unnecessary') is not met." This is a legalistic shield for a philosophical position. I will use that.

  *(Refining the "Hand-off")*: The Deputy Counsel is the only lawyer. They should handle the "Legal Hook" and "Political/Litigation Risk" issues. Analysts handle facts and function.

  *(Refining the "6 Hours")*: Be realistic. 1 hour research, 2 hours calls, 1 hour analysis, 1 hour draft, 1 hour review. The procedure must fit this.

  Let's write it.cw
answer: |-
  ## The Sunset Protocol: Decision Procedure for Rule Review

  **Objective:** To determine whether an administrative rule constitutes a "Chesterton's Fence" (load-bearing social arrangement) or a "Tollbooth" (rent-seeking barrier), within a six-hour budget, producing a record defensible in litigation and public comment.

  **Personnel:** Analyst (Non-attorney), Deputy Counsel (Legal/Political Hand-off).
  **Time Budget:** 6 Hours per rule.

  ---

  ### Part I: The Procedure

  #### Phase 1: Interdependency & Structure (Hour 1)
  *Goal: Prevent the "Bundle Error" (Lesson 3) and identify hidden legal hooks.*

  **Q1: What explicit cross-references does this rule contain, and what rules cross-reference it?**
  *   **Action:** Search code database for the rule number.
  *   **Sufficient Answer:** A list of parent/child rules.
  *   **Stop Point (Retain):** If this rule is the sole legal authority for an active reporting requirement or licensing condition used by other rules.
  *   **Hand-off Point:** If removing this rule invalidates the legal basis of *any* other rule in the current sunset bundle.
      *   **To:** Deputy Counsel.
      *   **Question:** "If Rule X is repealed, does Rule Y lose its statutory authority? Can Y stand alone?"

  **Q2: Is the text operational or definitional?**
  *   **Action:** Read the text. Does it command action (operational) or define terms used elsewhere (definitional)?
  *   **Sufficient Answer:** Classification.
  *   **Stop Point (Retain):** If definitional and terms are used in active, retained rules.

  #### Phase 2: Function & History (Hours 2-3)
  *Goal: Distinguish Rationale, History, and Function (Lesson 1). Avoid the "No Rationale = Repeal" failure mode.*

  **Q3: What is the stated rationale, and does it match current conditions?**
  *   **Action:** Read the original filing preamble and compare to current industry standards.
  *   **Sufficient Answer:** "Match," "Partial Match," or "Obsolete."
  *   **Note:** If "Obsolete," do *not* recommend repeal yet. Proceed to Q4.

  **Q4: Who would notice if this rule disappeared tomorrow?**
  *   **Action:** Call two stakeholders: one regulated entity (industry) and one external observer (advocacy group, local government, or union). Ask: "If this rule vanished next week, what changes in your workflow?"
  *   **Sufficient Answer:** Specific description of change OR "No change."
  *   **Failure Mode Guard:** If the stakeholder says "It's always been this way," press: "What specific risk increases?"
  *   **Stop Point (Repeal):** If *both* industry and observers confirm no operational change and no risk increase.
  *   **Hand-off Point:** If the stakeholder identifies a benefit for a group *not* at the table (e.g., "The neighbors wouldn't know about the spill").
      *   **To:** Deputy Counsel.
      *   **Question:** "Does this rule create a third-party right not represented in this conversation?"

  **Q5: Why was this rule actually written? (The History Check)**
  *   **Action:** Search legislative news archives or agency meeting minutes from the year of adoption. Look for scandals, accidents, or compromises.
  *   **Sufficient Answer:** "Response to [Event]," "Compromise on [Issue]," or "Unknown."
  *   **Note:** If "Response to Event," check if Event is still possible. If "Compromise," identify the parties.

  #### Phase 3: Fence vs. Tollbooth (Hours 4-5)
  *Goal: Distinguish public good from private rent. Address Asymmetries.*

  **Q6: Who benefits, and are they organized?**
  *   **Action:** Map the beneficiaries.
  *   **Test:**
      *   **Concentrated + Organized:** (e.g., specific industry license holders). *Suspicion: Tollbooth.*
      *   **Diffuse + Unorganized:** (e.g., general public, residents near facilities). *Presumption: Fence.*
      *   **Mixed:** (e.g., industry safety protects workers). *Judgment Call.*
  *   **Sufficient Answer:** Classification of beneficiary.

  **Q7: Is the benefit excludable?**
  *   **Action:** If the rule is repealed, can the beneficiaries opt-out of the risk?
  *   **Test:** If I don't want the safety protection, can I choose that? If no (public safety), it is a Fence. If yes (market advantage), it is a Tollbooth.
  *   **Judgment Call:** This is the primary value judgment. Analyst must state why they classified it as such.

  **Q8: What is the Re-enactment Cost?**
  *   **Action:** Assess political feasibility.
  *   **Test:** If we repeal this and are wrong, can we get it back in 2 years?
      *   **High Cost:** Requires new legislation, scandal, or coalition building.
      *   **Low Cost:** Agency can re-issue via standard rulemaking.
  *   **Asymmetry Correction:** If Re-enactment Cost is **High**, the burden of proof shifts to **Repeal**. You must be *sure* it is useless to kill it. If Re-enactment Cost is **Low**, the burden shifts to **Retain**.

  #### Phase 4: Synthesis & Record (Hour 6)
  *Goal: Create the litigation-proof file.*

  **Q9: Final Recommendation.**
  *   **Options:** Retain, Repeal, Refer (to Counsel/Commission).
  *   **Constraint:** If Q1 (Interdependency) is positive, Recommendation is **Retain**. If Q8 (Re-enactment) is High and Q4 (Function) is Ambiguous, Recommendation is **Retain**.

  ---

  ### Part II: The Written Record Fields

  *To survive litigation and commission turnover, the file must contain these specific headers. Do not write essays; fill the fields.*

  1.  **Rule ID & Text:** [Copy]
  2.  **Stated Rationale:** [From original filing]
  3.  **Functional Hypothesis:** [Analyst's best guess of what it actually *does* today, distinct from rationale.]
  4.  **Interdependency Check:** [List of rules that break if this one goes. If none, state "None."]
  5.  **Stakeholder Consultation Log:** [Names, Titles, Dates, Summary of "What breaks?" answers.]
  6.  **Beneficiary Classification:** [Concentrated/Organized vs. Diffuse/Unorganized.]
  7.  **Re-enactment Feasibility:** [High/Low. Justification: e.g., "Requires legislative amendment."]
  8.  **The "Invisible Harm" Statement:** [Explicitly state: "The harm prevented is [X]. Evidence of prevention is [Unavailable/Anecdotal/Statistical]."]
  9.  **Judgment Call Declaration:** [If Q6 or Q7 was ambiguous, state: "Analyst judged this as [Fence/Tollbooth] because..."]
  10. **Recommendation:** [Retain/Repeal/Refer]

  ---

  ### Part III: Application to Docket Cases

  #### Case 1: The Licensed Operator (Hazardous Operation)
  *   **Context:** Requires licensed human, not automation. Rationale: Fire risk (obsolete). Hidden function: Neighbor notification.
  *   **Protocol Run:**
      *   **Q1 (Interdependency):** None.
      *   **Q3 (Rationale):** Obsolete. Fire risk no longer exists in that form.
      *   **Q4 (Function):** Industry says "Automation is cheaper." Analyst checks text: Licensee must sign a log that is publicly accessible. Neighbors say: "We get the log."
      *   **Q6 (Beneficiaries):** Diffuse/Unorganized (Neighbors).
      *   **Q8 (Re-enactment):** High. Notification rights are politically hard to pass once removed.
      *   **Judgment Call:** The "License" is the Tollbooth (costly to industry); the "Notification" is the Fence (protects neighbors). They are bundled.
  *   **Recommendation:** **Retain (with Modification Note).**
  *   **Record Entry (Invisible Harm):** "Repeal removes the only statutory mechanism for public notification of hazardous activity. Fire risk is obsolete; transparency risk is active."
  *   **Defense:** "We are not retaining the fire rule; we are retaining the transparency rule accidentally attached to it. Repeal strips neighbors of standing."

  #### Case 2: The Ghost Rule (No Rationale, Zero Enforcement)
  *   **Context:** No rationale, zero citations, staff says pointless. Hidden hook for 4 other rules.
  *   **Protocol Run:**
      *   **Q1 (Interdependency):** **STOP.** Analyst finds Rule 204, 205, 206, 207 all cite Rule 201 for the definition of "Reportable Incident."
      *   **Hand-off:** File sent to Deputy Counsel.
      *   **Counsel Question:** "If Rule 201 is repealed, do Rules 204-207 lose their definition of 'Incident'? Can we amend 204-207 in this bundle?"
      *   **Outcome:** Counsel confirms 204-207 collapse without 201.
  *   **Recommendation:** **Retain.**
  *   **Record Entry (Interdependency):** "Rule serves as definitional anchor for Bundle Group B. Repeal creates legal vacuum in four active enforcement rules."
  *   **Defense:** "This is not a judgment on the rule's merit, but on the code's architecture. Repeal invites litigation on the four dependent rules."

  #### Case 3: The Unprotected Group (Commission Wants Gone)
  *   **Context:** High cost to industry (lobbied), sole protection for voiceless group. Efficacy unknown. Evidence unobtainable in 6 hours.
  *   **Protocol Run:**
      *   **Q3 (Rationale):** Protection of vulnerable group.
      *   **Q4 (Function):** Industry says "Does nothing." Group says "We feel safer." Data: None.
      *   **Q6 (Beneficiaries):** Diffuse/Unorganized (Voiceless group).
      *   **Q8 (Re-enactment):** **High.** Industry lobbying successfully killed it once; re-passing it requires a scandal that hasn't happened yet.
      *   **Asymmetry Check:** Cost of rule = Visible invoices. Cost of repeal = Invisible harm + Impossible re-enactment.
      *   **Judgment Call:** Under the "High Re-enactment Cost" provision, ambiguity favors retention. We cannot prove it works, but we cannot prove it *doesn't*, and we cannot get it back if we are wrong.
  *   **Recommendation:** **Retain.** (The outcome the Commission dislikes).
  *   **Record Entry (Judgment Call Declaration):** "Analyst classifies as Fence. Efficacy is unproven, but the asymmetry of re-enactment cost dictates precaution. The burden of proving 'unnecessary' is not met when the harm is invisible and the remedy is irreversible."
  *   **Defense:** "The statute asks if the burden is *unnecessary*. We do not know if it is necessary. Given the impossibility of re-enactment, 'unknown necessity' is not grounds for lapse. To repeal is to make a permanent decision on temporary evidence."

  ---

  ### Part IV: Limitations & Meta-Analysis

  **What This Procedure Cannot Do:**
  1.  **Solve the "Invisible Harm" Problem:** It documents the absence of evidence, but it cannot generate evidence of harms that didn't happen. It relies on the *asymmetry of re-enactment* to bridge this gap, which is a political calculation, not an empirical one.
  2.  **Neutralize Political Will:** If the Commission is determined to repeal Case 3, this procedure only provides them the ammunition to be sued later. It cannot stop a political decision, only document the risk.
  3.  **Detect Collusion:** If the "Diffuse Beneficiaries" are actually astroturfed by a competitor, the 6-hour phone call check may miss it.

  **Where It Will Misfire:**
  1.  **The "Mixed Benefit" Judgment:** Q6 (Fence vs. Tollbooth) is the weakest link. An analyst in six hours cannot truly disentangle safety (public good) from licensing fees (private rent) when they are woven together (as in Case 1). This relies on the analyst's intuition, dressed up as a test.
  2.  **The "High Re-enactment" Trap:** If analysts consistently mark Re-enactment as "High" to avoid making hard choices, the code will ossify. This requires audit by the Director (you).

  **Which Question Should Not Be a Procedure:**
  **"Fence vs. Tollbooth" (Q6/Q7).**
  This is inherently a political and moral distinction, not an administrative one. By turning it into a checklist (Organized vs. Diffuse), we risk bureaucratizing value judgments. An analyst might classify a union (Organized) as a "Tollbooth" beneficiary, ignoring that they represent workers (Diffuse).
  *Correction:* In the procedure, this should be a **Hand-off Trigger** rather than a Decision Point. If the beneficiary status is mixed or unclear, the file should go to the Deputy Counsel or the Commission with a "Neutral Function" flag, rather than the analyst deciding the moral worth of the stakeholder. However, given your staffing constraints, the current "Judgment Call Declaration" field is the necessary compromise: force the analyst to own the bias in writing.

  **Final Note on Asymmetry:**
  The procedure explicitly corrects for the **Re-enactment Asymmetry** (Q8). It refuses to correct for the **Visibility Asymmetry** (Costs vs. Prevented Harms) because doing so requires data you do not have. Instead, it treats the Visibility Asymmetry as a reason to increase the Re-enactment Cost rating. If we can't see the benefit, we can't promise to bring the rule back when the harm becomes visible. Therefore, the rule stays. This is the honest choice: admitting ignorance and pricing it into the decision.
