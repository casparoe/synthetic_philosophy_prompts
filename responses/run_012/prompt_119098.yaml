answer: |-
  ### Brainstorming and Design Choices

  To make a Dutch book audit usable by a non-specialist in forty-five minutes, we must translate abstract probability axioms into concrete financial transactions. The core design choices are as follows:

  *   **Elicitation (Odds vs. Numbers):** We cannot ask "What is the probability?" because experts treat numbers as vague confidence scores. We must ask, "What is the maximum price you would pay for a ticket that pays \$100 if the event happens?" This reveals the *buying price*. We must also ask, "What is the minimum price you would accept to sell this ticket?" This reveals the *selling price*. If the buying price is higher than the selling price, the expert is already incoherent (they would pay \$60 to buy a ticket they would sell for \$50).
  *   **Representing Prices:** We will use "Dollars per \$100." A probability of 0.5 becomes \$50. This makes arithmetic intuitive. A sure loss is simply spending more on a package of tickets than the maximum possible payout.
  *   **Testing Logical Rules:**
      *   *Complementation:* The price of "Event A" plus the price of "Not A" must equal \$100. If it is less, the expert leaves money on the table (imprecise); if it is more, they are guaranteed to lose (incoherent).
      *   *Additivity:* The price of "A or B" must equal Price(A) + Price(B) minus Price("A and B").
      *   *Conditionals:* A bet on "A given B" is a bet on "A and B" where the stake is returned if B does not happen. Mathematically, Price("A and B") should equal Price(A given B) multiplied by Price(B), divided by 100.
  *   **Searching for Sure-Loss:** We are not looking for *any* inconsistency, only those that guarantee a financial loss. We will look for "Negative Book Sums." If the expert buys a set of tickets for \$105 that can never pay out more than \$100, that is a Dutch book.
  *   **Infinite or Unclear Events:** Dutch book arguments require events that can be definitively resolved as True or False. If an event is "Ambiguous" (e.g., "Significant political instability"), the audit must stop. You cannot bet on a vague condition.
  *   **Distinguishing Incoherence from Risk/Ambiguity:**
      *   *Risk Aversion:* The expert has a spread (e.g., Buy at \$40, Sell at \$60). This is rational caution, not incoherence. We classify this as **Imprecise**.
      *   *Refusal to Bet:* If the expert refuses to name a price, no Dutch book can be made. We classify this as **No Market**.
      *   *Strict vs. Wide:* The **Strict** case asks if the expert would personally take the bet. The **Wide** case asks if they are willing to publish these odds for anyone to take. The Wide case is stricter; if they publish incoherent odds, anyone can bankrupt them. The Strict case only matters if they are willing to bet on both sides of a contradiction. Our audit assumes the **Strict** case by default (what they accept) but flags if they intend the numbers for public modeling (Wide).

  ***

  ### The Coherence Audit Procedure

  **Time Limit:** 45 Minutes
  **Auditor:** Audit Lead (No probability background required)
  **Tools:** Calculator or Spreadsheet, Printed Checklist
  **Goal:** Classify the expert's judgment package as **Coherent**, **Imprecise**, or **Incoherent**.

  #### Part 1: The Decision Checklist

  **Step 1: Event Definition (5 Minutes)**
  *   **Question:** "Can this event be proven True or False on a specific date by a neutral third party?"
  *   **Sufficient Answer:** "Yes, by [Date], verified by [Source]."
  *   **Red Flag:** "It depends on what you mean by..." or "It's a gradual process."
  *   **Action:** If Red Flag, stop. Classify as **Undefined**. Hand to Formal Modeler. Probability does not apply to vague concepts.

  **Step 2: Betting Stance (5 Minutes)**
  *   **Question:** "Are these numbers prices you would personally pay/receive, or just estimates for a model?"
  *   **Sufficient Answer:** "I would bet at these prices" (Strict) OR "I am setting the market odds" (Wide).
  *   **Red Flag:** "I don't bet," or "These are just heuristics."
  *   **Action:** If "I don't bet," classify as **No Market**. Do not force a number. If "Heuristics," warn that coherence checks do not apply. Proceed only if they confirm they stand behind the numbers as actionable odds.

  **Step 3: The Spread Check (10 Minutes)**
  *   **Question:** "What is the most you would pay to win \$100 if this happens? What is the least you would take to sell that same ticket?"
  *   **Sufficient Answer:** Buy Price $\le$ Sell Price. (e.g., Buy \$40, Sell \$60).
  *   **Red Flag:** Buy Price > Sell Price. (e.g., Buy \$60, Sell \$50).
  *   **Action:** If Red Flag, classify as **Incoherent**. This is an immediate sure loss. If Buy < Sell, classify as **Imprecise**. Record the range. Use the midpoint for subsequent math tests only if they agree.

  **Step 4: The Complement Test (Hand-Check) (5 Minutes)**
  *   **Task:** Identify an event $A$ and its opposite "Not $A$". Add their Buy Prices.
  *   **Rule:** Buy($A$) + Buy("Not $A$") must not exceed \$100.
  *   **Red Flag:** Sum > \$100.
  *   **Action:** If Red Flag, classify as **Incoherent**. If Sum < \$100, this is **Imprecise** (acceptable caution).

  **Step 5: The Joint Probability Test (Spreadsheet) (10 Minutes)**
  *   **Task:** Check events $A$, $B$, and "$A$ and $B$".
  *   **Formula:** Calculate Expected Joint Price = (Price($A$) $\times$ Price($B$ given $A$)) / 100.
  *   **Comparison:** Compare Expected Joint Price to Stated Price("$A$ and $B$").
  *   **Red Flag:** The difference is greater than 5 points (allowing for small rounding/imprecision).
  *   **Action:** If Red Flag, classify as **Incoherent**.

  **Step 6: Final Classification & Stop Rules (10 Minutes)**
  *   **Coherent:** No Red Flags. Buy $\le$ Sell on all items. Logic holds.
  *   **Imprecise:** Buy < Sell (Spread exists), or Sums < \$100. No guaranteed loss, just caution.
  *   **Incoherent:** Any Red Flag indicating a guaranteed loss (Sum > \$100, Buy > Sell, Logic violation).
  *   **Escalation:** If the expert describes changing their mind over time (Diachronic), or if events involve infinite possibilities, hand to Formal Modeler.

  #### Part 2: What This Procedure Cannot Do

  1.  **It Does Not Prove Truth:** A coherent set of probabilities can be completely wrong about the world. This audit only checks internal consistency, not accuracy.
  2.  **It Assumes Linear Value:** It assumes \$100 is worth exactly twice as much as \$50 to the expert. If the expert cares more about reputation than money, or if the sums are large enough to change their life, the "sure loss" might not feel like a loss to them.
  3.  **It Cannot Force Precision:** If an expert rationally feels ambiguous (e.g., "It could be anywhere between 5% and 20%"), this procedure will classify them as **Imprecise**. It cannot mathematically justify squeezing them to a single number.
  4.  **It Fails on Vague Events:** If the event cannot be objectively verified, a Dutch book cannot be settled. The procedure will halt at Step 1.
  5.  **Strict vs. Wide Limitation:** If the expert says "These are my odds" (Wide) but refuses to actually bet (Strict), a Dutch book is theoretically possible but practically unenforceable. The audit records this as a **Policy Risk** rather than mathematical incoherence.

  ***

  ### Application to Cases

  #### Case A: The Inconsistent Arithmetic
  **Context:** Expert provides five specific numbers and confirms willingness to bet.
  **Audit Lead Reasoning:**
  1.  **Event Definition:** Events A and B appear well-defined. Proceed.
  2.  **Betting Stance:** Expert confirms "willing to bet at these odds." This is the **Strict** case. Vulnerable to Dutch Book.
  3.  **Spread Check:** Expert gives single numbers (e.g., 0.5 implies Buy \$50, Sell \$50). No spread.
  4.  **Complement Test:** Not directly testable with provided data, skip.
  5.  **Joint Probability Test:**
      *   Expert says P(A) = 0.5 (\$50).
      *   Expert says P(B given A) = 0.8 (\$80).
      *   *Calculation:* The price of "A and B" should be roughly \$50 $\times$ \$80 / 100 = \$40 (0.4).
      *   Expert says P(A and B) = 0.3 (\$30).
      *   *Discrepancy:* 0.4 vs 0.3. This is a 10-point gap.
      *   *Dutch Book Construction:* I can buy the "A and B" ticket from her for \$30. I can sell her a ticket that pays \$100 if "A and B" occurs, constructed by selling her a conditional bet on B given A and a bet on A.
      *   *Simpler Check:* P(A or B) = P(A) + P(B) - P(A and B).
      *   Expert P(B) = 0.4. Expert P(A) = 0.5. Expert P(A and B) = 0.3.
      *   Implied P(A or B) = 0.5 + 0.4 - 0.3 = 0.6.
      *   Expert Stated P(A or B) = 0.7.
      *   She is overpricing the "Or" event relative to the components.
  6.  **Classification:** **Incoherent**.

  **Verdict:** Incoherent.
  **Severity:** High. A bookmaker can construct a sure-loss portfolio against these odds.
  **Cheapest Repair:** Ask the expert to recalculate P(A and B) using the multiplication rule (0.5 $\times$ 0.8 = 0.4) and adjust P(A or B) accordingly.
  **Handoff:** None. The math is elementary.
  **Unpopular Aspect:** The expert insists these are her "considered judgments." The audit tells her her judgments are mathematically impossible to defend financially.

  #### Case B: The Rational Ambiguity
  **Context:** Expert refuses to bet, gives a range (5-20%), asker wants a single number.
  **Audit Lead Reasoning:**
  1.  **Event Definition:** "Climate tipping point" needs verification. Assume for audit it is defined by a specific temperature/threshold metric. Proceed with caution.
  2.  **Betting Stance:** Expert "refuses to bet... at any odds."
  3.  **Spread Check:** Since she refuses to bet, there is no Buy or Sell price. There is only a stated credence range.
  4.  **Coherence Check:** A Dutch Book requires acceptable bets. If no bets are accepted, no Dutch Book can be formed.
  5.  **Imprecision Check:** The range (5% to 20%) indicates ambiguity aversion. She is not committing to a price.
  6.  **Classification:** **Imprecise / No Market**.

  **Verdict:** Imprecise (Rational).
  **Severity:** None. This is a feature, not a bug.
  **Cheapest Repair:** None. Do not repair.
  **Handoff:** Hand to the Asker (Modeler). Explain that forcing a single number (e.g., 12.5%) creates false precision. The model must accept a range or a distribution.
  **Unpopular Aspect:** The Asker wants a single number for the model. The audit procedure forbids forcing one. The report must state: "Expert imprecision is rational; imposing a point estimate introduces artificial coherence."

  #### Case C: The Time-Travel Problem
  **Context:** Expert has current credence 0.8, but plans to change to 0.6 or 0.9 tomorrow based on event B. Accepts bets today and tomorrow.
  **Audit Lead Reasoning:**
  1.  **Event Definition:** A and B are defined.
  2.  **Betting Stance:** Accepts bets today and tomorrow.
  3.  **Spread Check:** Single numbers given.
  4.  **Logical Test:** This is a *Diachronic* (over time) problem. The checklist covers static coherence (Step 5). It does not have a formula for "Reflection Principle" (whether today's belief should match the expected value of tomorrow's belief).
  5.  **Risk Identification:** If she bets today at 0.8, and tomorrow bets at 0.6 (if B), she might be vulnerable to a strategy where a bookmaker bets against her today and with her tomorrow.
  6.  **Classification:** **Escalation Required**.

  **Verdict:** Potential Diachronic Incoherence (Escalate).
  **Severity:** Unknown without formal modeling.
  **Cheapest Repair:** Unknown.
  **Handoff:** Formal Modeler. The Audit Lead flags this as "Dynamic Inconsistency Risk."
  **Reason:** The 45-minute audit tool is for static snapshots. Checking if current beliefs align with expected future beliefs requires calculating expected utilities over time, which exceeds the Audit Lead's mandate.
  **Limitation Display:** This shows the procedure cannot settle issues where the "truth" of the probability shifts over time based on the expert's own learning process.

  ***

  ### Practical Misfires and Mitigation

  The most likely way this procedure will misfire is when an expert treats "probability" as a measure of *importance* or *political weight* rather than *frequency* or *propensity*. For example, an expert might assign a high probability to a rare event because the consequences are catastrophic (conflating probability with utility). The Dutch book audit will flag this as incoherent (overpricing), but the expert will feel the audit missed the point. When this happens, the Audit Lead must not argue math. Instead, they should mark the verdict as **Incoherent (Utility/Probability Confusion)** and note in the comments: "Expert appears to be pricing risk impact, not likelihood. Recommend separating Severity from Probability before re-audit." This preserves the mathematical integrity of the unit while respecting the expert's intent.
