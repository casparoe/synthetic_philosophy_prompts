answer: |-
  This is a robust position. You are essentially advocating for a form of **critical realism** or **procedural objectivity**. You are rejecting the "God's-eye view" (ontological objectivity) in favor of a disciplined, self-correcting method (epistemic objectivity).

  This is the standard defensive line for working historians against strong postmodernism, and it holds up well in most day-to-day contexts. However, you have asked for the pressure points. You want to know where the floor might give way, not just where it creaks.

  Here is an assessment of your position, ranked defeaters, and the specific concessions you likely need to make.

  ### 1. The "Changed the Subject" Worry
  **Verdict: You have not changed the subject, but you have downgraded the product.**

  If objectivity means only "responds to evidence according to disciplinary norms," have you handed Carr and White the victory?
  *   **Carr** would say: "Your disciplinary norms *are* the values of your time and class. You are still dancing to the tune of the present."
  *   **White** would say: "Your 'evidence' is already emplotted. You cannot access the 'past' before it becomes a 'story'."

  **The Defense:** You haven't changed the subject if you acknowledge that objectivity is a **regulative ideal**, not a state of being. It is the *direction* of travel, not the destination. If you define objectivity as "intersubjective testability within a community committed to falsification," you retain a concept worth having. It distinguishes history from propaganda or fiction.
  **The Concession:** You must concede that this objectivity is **local**, not universal. It guarantees truth only relative to the reliability of the disciplinary framework. If the framework is corrupted (e.g., Lysenkoism in Soviet biology, or Stalinist history), "following the evidence" within that framework yields falsehoods. Therefore, objectivity requires a second-order critique of the framework itself, not just first-order adherence to evidence.

  ### 2. Ranked Defeaters (Fatal to Awkward)

  Here are the arguments against your deflationary line, ranked by how much damage they do.

  #### **FATAL: The Constitution of the Evidence (The Archive as Power)**
  This is the strongest threat to "letting the evidence decide."
  *   **The Argument:** Evidence does not exist neutrally. It is generated by institutions with specific values. If you "let the evidence decide," you are often letting the *victors* decide.
  *   **The Case:** Colonial history. For a century, the "evidence" on indigenous populations, economies, and social structures consisted almost entirely of colonial administrative records. These records were generated to tax, control, or convert. They systematically undercounted women, non-market labor, and resistant populations.
  *   **Why it bites:** A historian "willing to lose to the evidence" in 1950 would conclude indigenous populations were small and societies static. A historian in 2020, using archaeology and oral tradition, concludes they were large and dynamic. The *evidence changed*, but the *valuation of what counts as evidence* changed due to ethical/political shifts.
  *   **Concession:** You must concede that "letting the evidence decide" is insufficient. You must add **"critiquing the production of the evidence."** Objectivity requires asking *why* this record exists and *what it silences*. If you don't do that, your "objectivity" is just fidelity to bias.

  #### **SERIOUS: The Theory-Ladenness of Weighing (The Priors Problem)**
  You asked specifically about the weighing of evidence. This is where Bayesian epistemology hurts the deflationist.
  *   **The Argument:** Evidence never speaks for itself; it updates priors. If two historians have different priors (shaped by values, ideology, training), the same evidence will move them to different conclusions.
  *   **The Case:** The Origins of the Cold War. Orthodox historians saw Soviet expansionism in the cables; Revisionists saw US economic imperialism in the same cables. Both were "reading the sources." The *weight* assigned to a diplomatic memo vs. an economic directive was determined by their theoretical framework.
  *   **Why it bites:** It shows that "willingness to lose an argument" is psychologically possible but epistemically constrained. You can only lose an argument if the evidence contradicts your *model*. If your model explains away the evidence (e.g., "that memo was a bluff"), you remain objective by your own lights but wrong.
  *   **Concession:** Objectivity requires **exposing your priors**. It is not enough to show your work on the sources; you must show your work on the *assumptions* that told you which sources mattered.

  #### **AWKWARD: Narrative Emplotment as Causal Logic (White's Stronger Claim)**
  *   **The Argument:** You dismiss White as a point about literary form. But narrative form imposes *causal* logic. A story with a beginning, middle, and end implies teleology or closure that the past did not possess.
  *   **The Case:** The "Fall of Rome." By structuring history as a "Fall," you select evidence of decline and weight it heavier than evidence of continuity. If you structure it as "Transformation," the same evidence yields a different truth.
  *   **Why it bites:** It suggests that the *truth claim* is partially constituted by the narrative structure, not just verified by it.
  *   **Concession:** You must concede that **explanatory truth** is distinct from **factual truth**. You can be objective about the facts (the Visigoths sacked the city in 410) but your *explanation* (Decline vs. Transformation) will always retain a residual subjective element that evidence alone cannot fully purge.

  #### **MANAGEABLE: Selection (Carr's Point)**
  *   **The Argument:** You are right to call this toothless. All inquiry selects. Science selects which experiments to run; history selects which facts to cite.
  *   **Defense:** As long as the selection criteria are explicit and reproducible ("I am studying economic history, so I am ignoring cultural history"), this is not a threat to objectivity. It only becomes a threat if the selection is covertly ideological.
  *   **Concession:** None, provided you maintain transparency about selection criteria.

  ### 3. The Specific Challenges You Raised

  #### **A. Is there a version of the sceptical case that bites on the weighing of evidence?**
  **Yes.** It is the argument from **Incommensurability of Standards**.
  Sometimes a dispute is settled not because new evidence arrived, but because the discipline decided that a certain *type* of evidence was no longer decisive.
  *   **Example:** The "Great Man" theory of history. In the 19th century, letters and diaries of leaders were the "hard evidence." In the mid-20th century, the Annales School argued that climate data, price curves, and demographic records were *more* objective evidence of historical reality than the "bias" of elite memoirs.
  *   **The Bite:** The "settlement" against Great Man history wasn't purely evidential. It was a value shift toward democracy and social science. If you had been a deflationary objectivist in 1890, you would have been "objective" by believing in Great Men.
  *   **Truth:** Yes, this is true. Disciplinary values determine the *hierarchy* of evidence.

  #### **B. Cases where a cohort read sources through blind values?**
  **The "Silence in the Archive" (Subaltern Studies).**
  *   **The Case:** Historians of Indian slavery or colonialism. For decades, competent historians read court records to understand slave agency. They concluded slaves were passive or reactive.
  *   **The Blind Spot:** The court records were designed to punish rebellion, not record intention. The "evidence" of passivity was an artefact of the legal system. It took a shift in values (wanting to find agency) to read the *gaps* in the records as evidence of resistance.
  *   **Does "they got it wrong" cover it?** No. "They got it wrong" implies a simple error. This was a **structural epistemic failure**. They were being "objective" by the standards of the time (trusting official records) and produced a falsehood.
  *   **Concession:** You must concede that **methodological rigor is not a shield against ideological blindness.** Objectivity requires an ethical commitment to looking for the silenced, not just a procedural commitment to reading what is there.

  #### **C. A dispute settled by evidence where the settlement was an artefact of values?**
  **The Turner Frontier Thesis (1893).**
  *   **The Settlement:** For a generation, the "evidence" of land records and census data "proved" that American democracy was born on the frontier. It was the dominant, evidence-based paradigm.
  *   **The Artefact:** The value was "American Exceptionalism." When the discipline shifted in the 1970s (New Western History), the *same data* was re-weighed. The frontier wasn't a valve for democracy; it was a site of colonial dispossession.
  *   **The Kicker:** The shift wasn't triggered by a new cache of documents. It was triggered by the Civil Rights movement changing the *values* of the historians, which changed how they weighed the existing evidence.
  *   **Impact on you:** This suggests that "progress" in history is not just accumulating facts; it is moral progress enabling better epistemic access.

  ### 4. The Ranke *Eigentlich* Aside
  You asked if this changes the picture.
  *   **Philology:** *Eigentlich* does indeed carry the sense of "properly," "essentially," or "in accordance with its idea."
  *   **Context:** Ranke was a Lutheran idealist. He believed every epoch was "immediate to God." He did not believe in "brute facts." He believed the historian's job was to discern the divine idea manifesting in the epoch.
  *   **Impact on your argument:** It rehabilitates Ranke from being a naive positivist, which helps you avoid the strawman. However, it **weakens** your deflationary line slightly. If Ranke meant "show the essence," he is admitting that metaphysics is *required* to see the past "as it was."
  *   **Usage:** Don't lean on it to save objectivity. Lean on it to show that the "naive empiricist" caricature is historically false. Your deflationary view is actually *more* empiricist than Ranke's was.

  ### 5. Summary: What You Must Concede

  To maintain a defensible position, you need to modify your definition of objectivity from **"Letting the evidence decide"** to **"Letting the evidence decide, subject to a critique of how the evidence was produced and weighted."**

  **You must concede:**
  1.  **Evidence is not neutral:** It is often the sediment of power. Objectivity requires "reading against the grain," not just "reading the sources."
  2.  **Weighing is value-laden:** Disciplinary values determine what counts as a "strong" explanation. Objectivity requires making those values explicit, not pretending they don't exist.
  3.  **Progress is moral as well as epistemic:** We see the past more objectively now than in 1900 partly because we care about different people (women, colonized, workers), which makes us look at different evidence.

  **You can hold:**
  1.  **Truth is not relative:** The past happened. Some accounts are still simply false (e.g., Holocaust denial).
  2.  **Constraint is real:** You cannot make the evidence say *anything*. The archive pushes back.
  3.  **Procedure matters:** The distinction between a historian and a propagandist is real, even if both are "perspectival."

  **Final Verdict:**
  Your line is not exposed to *fatal* fire unless you insist that "evidence" is a raw, unmediated given. If you acknowledge that evidence is theory-laden and archive-production is political, your deflationary objectivity survives as a **critical, self-reflexive realism**. It is less comfortable than the version you started with, but it is much harder to kill.

  If you face the charge that you've "changed the subject," your reply is: *"I haven't changed the subject; I've grown up. Objectivity isn't innocence; it's the rigorous management of bias."*
