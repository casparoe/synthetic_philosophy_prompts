      *(Key Insight to highlight)*: The user's distinction between Ramsey structure and Symmetry structure is the most promising avenue. I should build the diagnosis around that. ESR relies on Ramsey (vulnerable to Newman). OSR relies on Symmetry (vulnerable to "what is relating?"). The mismatch causes the talking past each other.

      *(Final Plan)*:
