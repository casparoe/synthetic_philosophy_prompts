      *   **OSR (Ladyman, Ross, French, etc.):** Structure is all there is. No underlying objects. Motivated by QM (indiscernibility) and modern physics. *Problem:* "Relations without relata" coherence issue.
      *   **The Stalemate:** ESR gets hit by Newman (structure is too easy to come by). OSR gets hit by the "free-floating relations" objection (metaphysically incoherent).

  3.  **Evaluate the User's Hypotheses:**
