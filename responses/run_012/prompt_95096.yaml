      *   *Verdict:* It is a **substantive metaphysical disagreement disguised as a semantic dispute about "structure," fueled by a failure to distinguish logical from physical structure.**

  6.  **Formulate the Path to Progress (or Lack Thereof):**
      *   *What would count as progress?*
