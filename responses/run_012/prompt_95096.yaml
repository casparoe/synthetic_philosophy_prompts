  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Don't just say "you're right about Hypothesis 1." Explain *why* it matters. The Ramsey sentence captures *extensional* structure. Physics cares about *intensional* structure (causal/nomic roles).
