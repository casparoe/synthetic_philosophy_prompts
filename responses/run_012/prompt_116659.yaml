answer: |-
  ### 1. The Principle: Asymmetric Corroboration

  Your intuition is correct that the "Sediment vs. Keepsake" distinction is too binary. It fails the Rubicon because the Rubicon is, in fact, a "keepsake" story (Romans telling Roman history). However, it differs from the Exodus in *how* it is embedded in the wider factual landscape.

  The principle governing your verdicts is not about the *source* of the claim, but about the **cost of falsehood** within the surrounding web of facts. I call this the **Principle of Asymmetric Corroboration**.

  A claim counts as **History** if it satisfies one of two clauses:

  *   **Clause A (Direct Sediment):** There exist physical or demographic traces (archaeology, genetics, linguistics) that are *indifferent* to the narrative's truth but align with its specific details.
      *   *Verdicts saved:* Hisarlik destruction, Migration (genes/language), Chronicle/Hoard.
  *   **Clause B (Incidental Entanglement):** The narrative is recorded intentionally (keepsake), **BUT** the event is structurally necessary to explain a web of *incidental* data produced by rivals, neutrals, or administrative systems that did not exist to tell the story. The event must be the "key" that unlocks otherwise anomalous external facts.
      *   *Verdicts saved:* Rubicon, Socrates.

  A claim remains **Legend** if it relies solely on intentional records from the beneficiary community without satisfying Clause A or Clause B.
  *   *Verdicts saved:* Exodus, Arthur, Shipwreck, Trojan War (Iliad version).

  **Why this resolves the Rubicon/Exodus conflict:**
  *   **The Rubicon (History via Clause B):** The sources are partisan, but the *consequences* of the crossing (Civil War, suspension of laws, specific coinage issues, letters from Cicero to Pompey) are attested in records not designed to glorify the crossing itself. If Caesar did not cross, the administrative chaos of 49 BCE becomes inexplicable. The "web" is dense and external.
  *   **The Exodus (Legend via Exclusion):** The sources are partisan. The *consequences* (Israelite identity) are internal to the community. There is no "web" of Egyptian administrative collapse, demographic shifts, or rival accounts that *requires* the Exodus to explain them. The silence of Egyptian records is not "sediment" (it doesn't confirm the event), but the lack of *entangled* Egyptian data prevents Clause B from triggering.

  ### 2. Verdicts on New Cases

  **Case 1: A battle known only from the victory monument the winners put up.**
  *   **Verdict:** **Legend (or Propaganda).**
  *   **Reasoning:** This fails Clause A (no sediment) and Clause B (no entanglement). A monument is an intentional record by the beneficiary. Unless the battle is required to explain a border shift attested in *neutral* records or a sudden change in *enemy* coinage, it is an isolated assertion. It is a claim, not history.

  **Case 2: A martyrdom whose miracles are plainly legend but whose execution is mentioned in passing in an unrelated official's correspondence.**
  *   **Verdict:** **History.**
  *   **Reasoning:** This satisfies Clause B. The official's correspondence is "incidental." The official is not writing to preserve the martyr's memory; they are writing about administration, weather, or logistics. The mention of the execution is a "trace" that does not care whether the story is true. The miracles are legend; the death is history.

  **Case 3: A story that an entire community believes and that archaeology neither confirms nor contradicts.**
  *   **Verdict:** **Legend.**
  *   **Reasoning:** This fails Clause A (archaeology is silent) and Clause B (belief is internal). Without external entanglement or physical sediment, universal belief is a sociological fact, not a historical one. It explains the community's present, not the world's past.

  ### 3. Vulnerable Verdicts

  My principle cannot easily save **Socrates** without a specific caveat, and it puts **Arthur** at risk if the definition of "web" is loosened.

  **The Risk to Socrates:**
  Socrates passes Clause B only if you count Aristophanes' *The Clouds* (a comedy mocking him years before his trial) as "external entanglement." If you view all Greek sources as a single "community of discourse" with a shared axe to grind (philosophical lineage), Socrates slides toward Legend.
  *   **Recommendation:** You should add a clause to Principle B: *"The web of incidental data must include sources whose primary purpose is not philosophical or hagiographical."* Aristophanes saves Socrates because his purpose was comedy, not history or philosophy. If you do not accept comedy as "external," you must abandon the Socrates verdict to remain consistent with the Arthur verdict.

  **The Risk to Arthur:**
  Your verdict on Arthur is strict ("I would not count even a hypothetical sixth-century war leader"). My principle supports this because 6th-century Britain lacks the "dense web" of administrative records (coins, laws, rival letters) that Rome had. However, if future archaeology finds a "Badon Hoard" (like the Chronicle case), Arthur would become History under Clause A.
  *   **Recommendation:** Keep the verdict. The current absence of a "dense web" for Arthur is the decisive factor. Do not add a clause allowing "hypothetical leaders" based on sparse data; that would invite the Exodus back in.

  **The Conflict:**
  If you demand that *all* sources be "indifferent" (Sediment), you lose Rubicon and Socrates. If you allow *any* partisan source to count if it fits a web (Entanglement), you risk letting Exodus in if one argues that Israelite archaeology "fits" the narrative.
  *   **Resolution:** You must hold firm on **Incidental vs. Intentional.** The Rubicon is intentional in the histories, but the *Civil War* is incidental in the coinage and laws. The Exodus is intentional in the Torah, and the *Wilderness* is intentional in the archaeology (if one tries to find it). The distinction is whether the *corroboration* is a byproduct of something else.

  ### 4. What Would Change My Mind

  I would abandon the **Principle of Asymmetric Corroboration** under two conditions:

  1.  **The "Perfect Forgery" Counterexample:** If it were demonstrated that a historical event (e.g., the Rubicon) was actually a total fabrication by a later generation, yet it *still* successfully explained the web of incidental data (coins, laws, letters) because the forgers were skilled enough to manufacture the context to match the lie. If "Entanglement" can be faked without detection, then Clause B is unreliable.
      *   *Likeliest Failure Point:* This is most likely to fail in periods of low literacy where "administrative data" (coins) can be minted by a later regime to create a false past. If I discovered that the "Republican" coinage supporting the Rubicon narrative was actually minted by Augustus to *create* the justification for his rule, I would have to move the Rubicon to Legend.

  2.  **The "Silent Truth" Counterexample:** If a clear case emerged where an event was undeniably historical (via later confession or undeniable physical proof) but *never* entangled in the contemporary web due to a total suppression of information.
      *   *Likeliest Failure Point:* This threatens the Exodus verdict. If an Egyptian archive were found tomorrow that casually mentioned "the departure of the Hebrew slaves" in a logistics ledger (Sediment/Incidental), the Exodus would become History. My principle allows this, but it highlights that the current "Legend" verdict is provisional based on *absence* of evidence, not *presence* of falsehood. If you believe the Exodus is *inherently* legendary regardless of evidence (theological reasoning), my principle is insufficient for you. If you believe it is legendary *only* because of the lack of entanglement, my principle holds.

  **Summary of the Argument:**
  You are not distinguishing History from Legend based on the *purity* of the source (Sediment vs. Keepsake). You are distinguishing them based on the **density of the factual ecosystem** surrounding the claim.
  *   **History** is a claim that is *expensive to deny* because denying it breaks too many other established facts (Rubicon, Socrates).
  *   **Legend** is a claim that is *cheap to deny* because it floats free of external constraints (Exodus, Arthur).
  *   **The Rubicon survives** because it is locked in a cage of Roman administrative facts.
  *   **The Exodus fails** because it floats in a vacuum of Egyptian silence.
