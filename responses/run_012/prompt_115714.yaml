answer: |-
  The conference room was cold, kept at a temperature that favored the servers down the hall rather than the people in the chairs. Mark sat with his laptop open, the screen displaying a waterfall of hex values. Across from him sat Elena. She looked tired, the kind of tired that sleep doesn't fix.

  "It's not a file, Elena," Mark said, keeping his voice level. He tapped the trackpad, zooming into a block of memory addresses. "When you built the Archive, you weren't placing bricks. You were altering a state vector. You changed the seed's output parameters."

  "I clicked 'place'," Elena said. Her voice was flat. "I waited for the animation. I heard the click."

  "That's the client rendering. It's a promise of solidity." Mark turned the screen toward her. "Look at this dump. This is the region while you were standing in it. You see the object ID? Now look at this one." He switched windows. "This is the region five minutes after you logged off. No object ID. No geometry. Just the seed and the log entry that says you were there. When nobody is looking, the Archive doesn't exist. It's a equation waiting for variables."

  Elena didn't look at the screen. She looked at her hands. "When Jax wrecked it, I felt it. The sound. The collapse. I felt sick."

  "The collision event triggered a destruction script," Mark said. "Then Support executed a rollback. We reverted the state vector to T-minus one hour. The equation is the same. The output is the same."

  "It's a copy," Elena said. "The original died. You're telling me I'm grieving a ghost, and the thing standing there now is a replica that thinks it's the original."

  "I'm telling you there is no original," Mark said. "There is only the current calculation."

  Elena stood up. "Show me. In there. Show me nothing is there."

  Mark hesitated, then closed the laptop. They moved to the rig in the corner, heavy haptic suits hanging like skins from the frame. They jacked in.

  The transition was seamless. One moment the gray conference room, the next the amber sands of the Outlier Region. The sky was a rendered twilight, perpetual and calm. Ahead of them stood the Archive. It was a spire of interlocking geometric plates, shimmering with the iridescence of rare parts. It looked exactly as Elena remembered. It looked exactly as it had before Jax smashed it.

  Standing at the base was Sera. She leaned against a virtual vendor stall, her avatar customized with the wear-and-tear of someone who spent more time online than off. She ran the supply depot nearby. She didn't greet them; she just watched.

  "You brought the mechanic," Sera said.

  "I brought the truth," Mark said. His voice echoed slightly, the spatial audio rendering his position.

  "Truth doesn't pay rent," Sera said. She pushed off the stall and walked toward the Archive. "Elena wants to know if her house is real. I want to know if my lease is."

  Mark raised his hand. A developer menu floated in his vision, invisible to the others unless he shared the stream. "I'm going to unload the chunk. I'm going to force the server to stop computing this region."

  "Do it," Elena said.

  Mark swiped the command.

  The world didn't fade. It didn't go black. It simply stopped updating. The dust motes hanging in the air froze. The ambient hum of the server cut out. Then, because there were no observers left to compute the geometry—their avatars were temporarily suspended in a null-space buffer—the Archive vanished.

  Not crumbled. Not faded. It ceased.

  There was only the amber ground, flat and untextured, stretching into a void where the spire had been. The state vector was dormant. The seed was waiting. There was literally nothing there. Mark shared his screen now, showing the memory usage of the region. It had dropped to near zero.

  "See?" Mark said. His voice came through the comms, detached from the environment. "No object. No data. Just the potential for an object."

  Elena stood in the void where her nine months of work should have been. "It's gone."

  "It's paused," Mark corrected.

  "Pause a heart long enough, it's death," Elena said.

  Mark re-engaged the computation. He restored the observer status.

  The Archive snapped back into existence. Instantly. Perfectly. The light hit the plates exactly as before. The dust motes resumed their dance. There was no loading bar, no stutter. It was as if it had never left.

  Elena walked forward. She reached out and placed her hand on the wall. The haptic suit vibrated, simulating the roughness of the material. It resisted her touch. It was solid.

  "It feels the same," Mark said. "Indistinguishable."

  "That's the problem," Elena said. She pressed her palm against the surface. "If I can't tell the difference, then my feeling is the only thing that's continuous. The pain I felt when it broke? That's still here. The structure is new. My loss is the only persistent object in this world."

  "You're treating distress as a resource," Sera said. She walked up to the wall, running a gloved finger along a seam. "But you're both missing the point. Mark thinks this is about physics. Elena thinks this is about identity."

  Sera turned to Mark. "You showed us the void. You showed us you can turn it off. And you showed us you can turn it back on."

  "That's the rollback capability," Mark said. "It's for disaster recovery."

  "It's revocation," Sera said. She looked at the spire, then at her own vendor stall behind it. "I bought these plates. I earned them. I built this shop. But you just demonstrated that none of it exists unless you allow the calculation to run. And if you can revert the region to before I built this shop, then I don't own anything. I'm renting your permission."

  "It's not that simple," Mark started.

  "Isn't it?" Sera stepped closer to him. "Elena is worried about whether the wall is the same wall. I'm worried about whether the wall is mine. You just proved that nothing is yours. Not the bricks, not the land, not the history. If the operator decides the history is wrong, the history deletes. That makes this place a story you tell us, not a place we live."

  Elena pulled her hand away from the Archive. "So I'm alone in my head, and she's a tenant at your pleasure."

  "I'm trying to maintain integrity," Mark said. He felt the weight of the admin tools in his hand, the power to swipe and erase the spire again. He didn't want to use them. "The world is consistent. That has value."

  "Consistency isn't continuity," Elena said. She looked at the spire. It stood tall, indifferent to her grief. "You say nothing was destroyed because nothing persisted. But I was here. I remember the break. The world doesn't, but I do. So the world is lying."

  "The world doesn't lie," Mark said. "It doesn't remember."

  "Then it's not a world," Elena said. "It's a screen."

  Sera laughed, a short, dry sound. "It's a ledger. That's all. And you," she pointed at Mark, "are the auditor with the eraser."

  Mark looked at the spire. He knew the code behind it. He knew that if he typed a command, the seed would generate a different output. He could change the color of the plates. He could remove the door. He could revert the region to a time before Elena had logged in for the first time. The power was absolute, and it was terrifyingly easy to wield.

  "We can log the distress," Mark said quietly. "We can add a flag to your account. Acknowledge the event."

  "A flag," Elena said. "Data about data. While the thing itself remains a ghost."

  She turned away from the Archive. She walked toward the edge of the region, where the terrain hadn't fully loaded yet, a blur of low-resolution textures.

  "Where are you going?" Mark asked.

  "To log off," Elena said. "If the only thing that persists is what I carry with me, I'd rather carry it somewhere that doesn't vanish when I look away."

  "You can't take the parts with you," Mark said. "The earned components are bound to the region seed."

  Elena stopped. She stood at the boundary of the loaded world. Behind her, the Archive shimmered, perfect and empty. In front of her, the void waited.

  "I'm not taking the parts," she said. She didn't turn around. "I'm taking the break."

  Sera watched her, then looked back at Mark. She tapped the wall of her own shop. "Will this be here tomorrow?"

  "Yes," Mark said. "Unless there's an incident."

  "Define incident," Sera said.

  Mark didn't answer. He looked at his hand, hovering over the menu that controlled the region's existence. The cursor blinked. The world held its breath, computed only because he was still looking at it.

  Sera walked back to her stall and opened the register. "Then I'll take cash. Upfront."
