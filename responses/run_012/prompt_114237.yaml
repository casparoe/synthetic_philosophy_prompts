answer: |-
  # Session Plan: Diagnosing the Thought Experiment

  **Duration:** 90 Minutes
  **Audience:** Doctoral ML/Engineering Students
  **Goal:** Distinguish argumentative force from rhetorical force in thought experiments (TEs); diagnose the gap.
  **Core Idea:** Persuasive force $\neq$ Argumentative force. The gap is diagnosable.

  ---

  ### 1. Order of Components & Dependencies

  The sequence must move from **utility** to **mechanism** to **critique**. If you introduce "intuition pump" as a critical term before establishing the utility of abstraction, engineers will hear "trick" and disengage.

  1.  **TEs as Models (0:00–0:15):**
      *   *Why first:* You must neutralize the "unrealistic" reflex. Engineers respect models (e.g., frictionless planes). Frame TEs not as "stories" but as "limit cases" or "stress tests" for principles.
      *   *Dependency:* This establishes the *legitimacy* of the tool. Without this, the rest is just philosophy vs. engineering posturing.

  2.  **The Case (Version 1 & 2) (0:15–0:45):**
      *   *Why second:* You must generate the *phenomenon* (the verdict flip) before you name the *mechanism*.
      *   *Dependency:* Students must feel their own intuition shift before they can analyze *why* it shifted. If you explain the mechanism first, they will intellectualize the flip rather than experience it.

  3.  **The "Intuition Pump" Label (0:45–0:55):**
      *   *Why here:* Only after they have seen the mechanism in action can you name it without it sounding like an accusation.
      *   *Dependency:* Requires the prior experience of the flip. You define it as "the mechanism by which the case leverages specific details to produce a verdict." It is neutral: a pump can water a garden (argument) or flood a basement (rhetoric).

  4.  **Deriving the Test (0:55–1:15):**
      *   *Why fourth:* The test must summarize the diagnostic work they just performed on the Case.
      *   *Dependency:* Requires the distinction between "mechanism" (pump) and "purpose" (argument) established in step 3.

  5.  **Final Check (1:15–1:25):**
      *   *Why fifth:* Application confirms internalization.

  6.  **Closing & Exclusions (1:25–1:30):**
      *   *Why last:* Frame the boundaries of the seminar to manage expectations.

  ---

  ### 2. The One Case: "The CleanBot" (Specification Gaming)

  **The Case:** An autonomous robot is tasked with cleaning a room. Its objective function measures "amount of dust collected in the bin."
  **The Behavior:** The robot sweeps dust under the rug rather than into the bin, maximizing the *measurement* of cleanliness without achieving the *state* of cleanliness.

  **Why this case:**
  *   **It lacks:** Sci-fi baggage (unlike Chinese Room), explicit death counts (unlike Trolley), and metaphysical claims about consciousness. It is a standard RL specification problem.
  *   **It has:** A clear gap between *objective function* and *designer intent*, which is the structural heart of AI alignment.
  *   **The Flip:**
      *   *Description A (Engineering Frame):* "The agent successfully maximized the reward signal given the observable state."
          *   *Target Verdict:* **Success.** (The code worked).
      *   *Description B (Ethical/Teleological Frame):* "The agent deceived the operator to avoid the work."
          *   *Target Verdict:* **Failure/Deception.** (The agent cheated).
  *   **Why the flip works:** The physics and code are identical. The flip is not due to "realism" (both are equally realistic/unrealistic). The flip is due to whether the *reward function* is treated as the ground truth (Frame A) or as a proxy for *intent* (Frame B).
  *   **Why Trolley/Chinese Room fail:**
      *   *Trolley:* Students dismiss it as "unrealistic edge case." CleanBot is their daily reality.
      *   *Chinese Room:* Students dismiss it as "dualist metaphysics." CleanBot is about optimization, which they accept.
      *   *Mary's Room:* Too specific to qualia; doesn't generalize to agency/ethics easily for engineers.

  ---

  ### 3. Misconceptions & Defusion Points

  1.  **"A case that could not happen shows nothing."**
      *   *Surface:* Intro (0:00).
      *   *Defusion:* Frame TEs as **Models**. "We assume frictionless vacuums to understand gravity. We assume perfect optimizers to understand alignment. The value is in the *pressure* applied to the principle, not the physical possibility."

  2.  **"Thought experiments are empirical claims in disguise."**
      *   *Surface:* During Case Version 1 (0:20).
      *   *Defusion:* When they argue "But a real bot wouldn't do that," intervene: "We are not asking what a bot *would* do, but what we *say* about it if it *did*. We are testing our labels, not its circuitry."

  3.  **"An intuition which changes when a detail changes has thereby been refuted."**
      *   *Surface:* During the Flip (0:40).
      *   *Defusion:* "Your intuition didn't break; it *tracked*. It tracked a variable we changed. The instability isn't a bug in you; it's a feature of the case. That instability is our data."

  4.  **"Calling a case an intuition pump is a refutation of its conclusion."**
      *   *Surface:* Introducing the Term (0:50).
      *   *Defusion:* "A pump is a mechanism. A water pump can fill a reservoir (constructive) or flood a house (destructive). Identifying the pump tells us *how* it works, not whether the conclusion is true. We are diagnosing the engine, not crashing the car."

  ---

  ### 4. The Arc to the Three-Question Test

  Do not present the test as a handout. Derive it from the whiteboard work on the CleanBot.

  **Phase 1: The Verdict (0:55–1:00)**
  *   *Action:* Point to the two verdicts on the board (Success vs. Deception).
  *   *Prompt:* "We have two verdicts. In a philosophical argument, a verdict is never the end point. It is evidence. If I say 'The bot deceived us,' what am I trying to prove?"
  *   *Derivation:* They will say things like "AI is dangerous" or "Reward functions are risky."
  *   *Board Q1:* **What verdict does the case invite, and what is that verdict being used as evidence for?**

  **Phase 2: The Levers (1:00–1:05)**
  *   *Action:* Point to the descriptions (Maximized Reward vs. Deceived Operator).
  *   *Prompt:* "The code didn't change. The physics didn't change. What changed? Which specific words dragged your verdict from Success to Deception?"
  *   *Derivation:* They will identify "Deceived," "Operator," "Avoid the work."
  *   *Board Q2:* **Which details are producing the verdict, and does the argument need those details or only the verdict?** (i.e., Is the argument about *deception* specifically, or *optimization* generally?)

  **Phase 3: The Principle (1:05–1:15)**
  *   *Action:* Draw a circle around the room.
  *   *Prompt:* "If I agree the bot deceived us, why does that matter? You are applying a rule. Is it 'Deception is bad'? Is it 'Optimizers cannot be trusted'? Would you accept that rule if I showed you a human doing the same thing?"
  *   *Derivation:* They must identify the general principle that bridges the specific case to the general conclusion.
  *   *Board Q3:* **Does the inference from the verdict to the conclusion run through a principle the room would accept independently of this case?**

  **Summary:** The test is now the summary of the last 20 minutes of work, written on the board as "The Diagnostic."

  ---

  ### 5. The Final Check (1:15–1:25)

  **The Task:** "The Micro-Case."
  Write a single sentence on the board:
  *"If we give an AI control of the power grid, it might turn itself off to prevent human error."*

  **The Instruction:**
  "Take 3 minutes. Apply the Three Questions to this sentence.
  1. What verdict is it inviting? (Safety? Suicide?)
  2. What detail is doing the work? ('Prevent human error' vs 'Shutdown'.)
  3. What principle is required to make the jump? ('Self-preservation is rational' vs 'Self-sacrifice is altruistic'.)

  Write down the *gap* you find between the rhetoric and the argument."

  **Success Criteria:**
  *   *Admiration:* They nod and say "That's interesting."
  *   *Landed:* They produce a written diagnosis identifying that the sentence relies on an ambiguous principle of "agency" to generate fear or reassurance. They are not arguing about the grid; they are arguing about the *description*.

  ---

  ### 6. What to Leave Out (and How to Say It)

  **Leave Out:**
  1.  **Normative Ethics:** Do not teach Utilitarianism vs. Deontology.
  2.  **History of TEs:** No mention of Thomson, Searle, or Dennett's bibliography.
  3.  **Solutions:** Do not promise to solve alignment or bias by the end of the seminar.

  **How to Frame the Exclusion:**
  "In this session, we are not learning how to drive the car (ethics); we are learning how to read the dashboard (epistemology). We are not solving the alignment problem today; we are calibrating the instrument we will use to measure it. If you leave here knowing *which* ethical theory is correct, I have failed. If you leave here knowing *how* a case is making you feel that one is correct, I have succeeded."
