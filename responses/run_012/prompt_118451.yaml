answer: |-
  The system you are describing is most formally known as **Futarchy** (a term coined by Robin Hanson), though it rests on a broader tradition of decision markets and idea futures. Your puzzle touches on the deep philosophical infrastructure required to make such a system coherent. It is not merely a mechanism; it is a political philosophy disguised as a trading protocol.

  Here is a reconstruction of the commitments this arrangement presupposes, categorized by your specific queries.

  ### 1. The Nature of Value: Radical Commensurability
  **Strict Presupposition:** The system strictly presupposes **Value Monism** (or at least functional commensurability).

  For a market to settle a question about which proposal "best advances some measurable objective," all relevant goods must be translatable into that single objective function. If the objective is GDP, then justice, liberty, and environmental integrity must either be irrelevant or instrumentally valuable only insofar as they contribute to GDP.
  *   **The Commitment:** It assumes that value is scalar. It rejects **Value Pluralism**, which holds that some goods are incommensurable (e.g., you cannot trade a unit of liberty for a unit of security without a qualitative loss).
  *   **The Consequence:** If values are truly plural, the market price becomes a category error. A price implies a exchange rate; if no rational exchange rate exists between two values (because they belong to different normative categories), the market price is noise, not signal.

  ### 2. Facts vs. Values: The Humean Architecture
  **Strict Presupposition:** The system presupposes a clean **Fact/Value Distinction** (Hume's Guillotine).

  Futarchy operates on the slogan: "Vote on values, bet on beliefs." This assumes that *ends* can be isolated from *means*. It assumes we can agree on a utility function (Value) independently of the causal mechanisms (Facts) used to achieve it.
  *   **The Tension:** In social and political reality, means often constitute ends. The process by which a product ships or a policy is enacted changes the social fabric, thereby altering the value of the outcome itself.
  *   **Philosophical Underdetermination:** This separation is not strictly required by the *math* of markets, but it is required by the *governance* model. One could imagine a market that prices values directly (e.g., "Will we value freedom more in 2030?"), but your description specifies that the objective is "fixed in advance." This fixes the value side to allow the fact side to be traded. It assumes values are static enough to serve as a numéraire for truth-seeking.

  ### 3. Legitimacy: Epistemic Consequentialism
  **Strict Presupposition:** Legitimacy is derived from **Accuracy**, not Consent or Reason.

  Why should a decision count as legitimate? In liberal democracy, legitimacy is procedural (we voted). In deliberative democracy, it is rational (we agreed on reasons). In prediction markets, legitimacy is **Epistemic**: the decision is right because the price reflects the highest probability of success.
  *   **The Commitment:** This is a form of *Epistemic Consequentialism*. It assumes that the primary moral obligation of a governance system is to maximize the expected value of the fixed objective.
  *   **Rival Theories:** A Deontological or Rights-Based theory would reject this. If the market predicts that violating a right maximizes the objective, the market mechanism has no internal brake against it. The system presupposes that *truth-tracking* is the sole or primary source of political authority.

  ### 4. Who Counts: The Epistocracy of Capital
  **Strict Presupposition:** Influence should be proportional to **Confidence and Capacity**, not Personhood.

  In "one person, one vote," agency is distributed equally. In prediction markets, agency is distributed according to $Capital \times Confidence \times Risk Tolerance$.
  *   **The Commitment:** This presupposes that **wealth and risk tolerance are proxies for insight**, or at least that the "noise" of the poor/unwilling-to-bet outweighs the "signal" of the wealthy. It assumes that "skin in the game" is the only valid filter for relevant knowledge.
  *   **The Tension:** This conflates *epistemic authority* with *economic power*. It assumes that the distribution of capital is either just or irrelevant to the truth-tracking function. If capital is distributed unjustly, the market may systematically ignore the knowledge of the marginalized, even if that knowledge is crucial for the forecast (e.g., workers knowing a product won't ship on time, but lacking funds to short the stock).

  ### 5. Categorization: Strict vs. Fit vs. Underdetermined

  | Feature | Strict Presupposition | Mere "Fit" (Contingent) | Philosophically Underdetermined |
  | :--- | :--- | :--- | :--- |
  | **Value Structure** | **Yes.** Must be a single, measurable metric to settle contracts. | | |
  | **Fact/Value Split** | **Yes.** Ends must be exogenous to the betting on means. | | |
  | **Legitimacy** | **Yes.** Must be epistemic/outcome-based. | | |
  | **Rationality** | | **Yes.** Fits Efficient Market Hypothesis & Rational Expectations. | Could work with bounded rationality if markets are liquid enough. |
  | **Participants** | | **Yes.** Fits Neoclassical *Homo Economicus*. | | **Yes.** Who counts is underdetermined. You could give everyone equal endowment (Democratized Futarchy), though this changes incentives. |
  | **Time Horizon** | | | **Yes.** Could be short-term or long-term, though discount rates matter. |

  ### 6. Internal Tensions: Performativity and Sabotage
  You asked where parts sit uneasily together. The most profound tension is **Reflexivity (Performativity)**.

  *   **The Soros/Callon Problem:** Markets are not just telescopes looking at reality; they are engines that shape it. If a market prices "Policy A will increase GDP" higher than "Policy B," and Policy A is enacted *because* of that price, the belief contributes to the truth.
  *   **The Sabotage Incentive:** This is the fatal flaw in decision markets. If I hold a long position on "Policy A succeeds," I have a financial incentive to actively sabotage Policy B, or even to sabotage Policy A's *implementation* if I can hedge elsewhere.
  *   **The Tension:** The system assumes the market *discovers* truth about an independent reality. But in political/organizational contexts, the market *creates* the reality. When the forecast determines the action, the "truth" of the forecast is no longer independent of the bet. This violates the condition of **exogeneity** required for standard probability theory.

  ### 7. Swapping the Theory: Pluralism and Deliberation

  If you replace the implicit theory (Utilitarian/Epistocratic) with a rival, the design must change fundamentally.

  **A. Value Pluralism**
  *   **The Challenge:** If values are incommensurable, you cannot have a single settlement metric.
  *   **Design Change:** You would need a **Vector Market** rather than a Scalar Market. Instead of one price, you would have a Pareto frontier of prices across multiple dimensions (e.g., a market on Liberty-Price and a market on Security-Price).
  *   **The Consequence:** There is no automatic "winner." The system would require a meta-mechanism (perhaps a vote or a jury) to select which point on the frontier to occupy. The market ceases to be the *decider* and becomes an *information provider* for a political choice.

  **B. Deliberative Democracy**
  *   **The Challenge:** Legitimacy comes from reason-giving, not just outcome optimization. Prices hide reasons (a price tells you *what* the crowd thinks, not *why*).
  *   **Design Change:** You would need **Argument Markets** or **Staked Discourse**. Participants stake money not just on outcomes, but on the validity of premises or causal chains.
  *   **Mechanism:** If I claim "Policy A works because of Mechanism X," I stake on Mechanism X occurring. If X fails, I lose, even if A succeeds by luck.
  *   **The Consequence:** This slows the system down. It prioritizes *accountability of reasoning* over *efficiency of aggregation*. It transforms the market from a black-box optimizer into a transparent ledger of justification.

  ### Summary for your Seminar
  The puzzle you face resolves when you recognize that Prediction Markets (as forecasting tools) are distinct from Decision Markets (Futarchy).
  *   **Forecasting Markets** presuppose only that crowds are smarter than individuals and that incentives align revelation.
  *   **Decision Markets** presuppose a **Utilitarian Metaphysic** (one good), a **Humean Epistemology** (facts separate from values), and an **Epistocratic Politics** (wealth tracks truth).

  The arrangement is philosophically unstable where **performativity** intrudes (when the bet changes the outcome) and where **incommensurability** exists (when the objective cannot capture all value). To make it compatible with Pluralism or Deliberation, you must demote the market from a *sovereign* (which decides) to a *servant* (which informs), thereby reintroducing the very political judgment the scheme was designed to bypass.
