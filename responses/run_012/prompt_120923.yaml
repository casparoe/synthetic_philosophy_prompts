          *   **Nuance:** It's not always a clean "cut wire." It's often a disruption of integration. Also, are they *really* not minding it, or just not expressing it? (Most evidence suggests they truly lack the aversiveness).

      *   *Claim 3: "Pain isn't bad in itself." (The Philosophical Leap)*
