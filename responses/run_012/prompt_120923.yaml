          *   **Pushback:** Most philosophers of mind (e.g., Kripke, David Lewis, contemporary phenomenologists) argue that unpleasantness is *constitutive* of pain, not an add-on. If it doesn't hurt, is it pain? Or is it just "nociceptive detection"?
