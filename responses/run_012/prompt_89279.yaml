answer: |-
  # Seminar Handout: A Taxonomy of Ethical Positions on Insecticide Use

  **Running Case:** A greenhouse manager faces a pest outbreak. She must choose among:
  1.  **Broad-Spectrum Spray:** Kills pests and non-target arthropods (fast-acting contact or slow-acting poison).
  2.  **Targeted Biological Control:** Introduces predators to eat pests (potentially painful for pests, safe for non-targets).
  3.  **Destroy Crop:** Eliminates the habitat, causing pest death via starvation/displacement (economic loss).

  ---

  ## The Decision Tree

  *Follow the path of your intuitions to locate your ethical position.*

  **Node 1: Moral Status & Uncertainty**
  Do insects possess a capacity for subjective experience sufficient to ground direct moral standing, and if this is empirically unsettled, does the possibility of sentience demand precaution?
  *   **No:** (Insects lack standing / Uncertainty is irrelevant) → *Go to Leaf A*
  *   **Yes / Precautionary:** (Insects have standing / Uncertainty mandates care) → *Go to Node 2*

  **Node 2: The Nature of Harm**
  Is the cessation of life inherently harmful to an insect, or does moral concern attach only to the experience of pain and distress?
  *   **Death is Harm:** (Killing is the primary wrong) → *Go to Node 3*
  *   **Only Suffering is Harm:** (Painless death is permissible) → *Go to Node 3*

  **Node 3: Unit of Value**
  Does the value of a pollinator population or of an ecosystem exceed the sum of the welfare of the individuals composing it?
  *   **Yes (Holism):** (The system outweighs the individual) → *Go to Leaf B*
  *   **No (Individualism):** (Only individuals count) → *Go to Node 4*

  **Node 4: Human Responsibility**
  Does the fact that we bred the pest by planting the monoculture change what we owe it?
  *   **Yes (Complicity):** (We created the problem, we bear the cost) → *Go to Leaf C*
  *   **No (Neutral):** (Pests are adversaries regardless of origin) → *Go to Node 5*

  **Node 5: Action Structure**
  Is killing a pest as the intended means morally distinct from killing non-target arthropods as a foreseen side effect of the same application?
  *   **Yes (Distinct):** (Intention matters) → *Go to Leaf D*
  *   **No (Equivalent):** (Only outcomes matter) → *Go to Leaf E*

  ---

  ## The Leaves: Positions and Commitments

  ### Leaf A: Hard Anthropocentrism
  *Path: Node 1 (No)*
  *   **Position Name:** Hard Anthropocentrism / Instrumentalism
  *   **Recommended Action:** **Broad-Spectrum Spray** (Choose the most economically efficient option).
  *   **Most Awkward Commitment:** This view must accept the risk of inflicting massive, unnoticed suffering on billions of beings simply because their interiority is inconvenient to verify.

  ### Leaf B: Ecological Holism
  *Path: Node 1 (Yes) → Node 2 (Any) → Node 3 (Yes)*
  *   **Position Name:** Ecological Holism
  *   **Recommended Action:** **Broad-Spectrum Spray** (If it preserves the greenhouse system) OR **Destroy Crop** (If the infestation threatens the wider ecosystem).
  *   **Most Awkward Commitment:** This position permits the sacrificial killing of sentient individuals whenever the abstract "health" of the collective system is deemed to benefit.

  ### Leaf C: Agrarian Complicity
  *Path: Node 1 (Yes) → Node 2 (Any) → Node 3 (No) → Node 4 (Yes)*
  *   **Position Name:** Agrarian Complicity / Restorative Justice
  *   **Recommended Action:** **Destroy Crop** (Absorb the economic loss rather than killing the pests we invited).
  *   **Most Awkward Commitment:** This view may require economic suicide or significant human hardship to maintain moral purity regarding pests we accidentally bred.

  ### Leaf D: Deontological Constraint
  *Path: Node 1 (Yes) → Node 2 (Death is Harm) → Node 3 (No) → Node 4 (No) → Node 5 (Yes)*
  *   **Position Name:** Rights-Based Deontology
  *   **Recommended Action:** **Targeted Biological Control** (If natural) or **Destroy Crop** (Avoid using pests as mere means).
  *   **Most Awkward Commitment:** This position forbids efficient pest control methods not because of the body count, but because of the intentional structure of the agent's mind.

  ### Leaf E: Welfarist Consequentialism
  *Path: Node 1 (Yes) → Node 2 (Only Suffering) → Node 3 (No) → Node 4 (No) → Node 5 (No)*
  *   **Position Name:** Sentientist Utilitarianism
  *   **Recommended Action:** **Fast-Acting Spray** (If instantaneous) OR **Biological Control** (Whichever minimizes total pain-hours).
  *   **Most Awkward Commitment:** This view justifies mass extermination of pests provided the method is sufficiently painless, treating lives as replaceable containers of welfare.

  ---

  ## Structural Diagnosis

  ### Indistinguishable Leaves
  **Leaf C (Agrarian Complicity)** and **Leaf D (Deontological Constraint)** are logically distinct within the tree, yet in the specific context of the greenhouse case, they are often **action-indistinguishable**. Both positions frequently mandate **Destroying the Crop** rather than spraying, but for incompatible reasons: Leaf C cites human *causality* (we made the mess), while Leaf D cites *intention* (we cannot use them as means). The tree distinguishes their justifications (Nodes 4 and 5), but a manager looking only for a prescription ("What do I do?") cannot distinguish the resulting obligation.

  ### Unoccupied Logical Space
  **Combination:** Node 1 (**No Sentience**) + Node 2 (**Death is Harm**).
  **Diagnosis:** **Incoherent.** No serious position occupies this space. To claim that an entity lacks the capacity for subjective experience (sentience) while simultaneously claiming that its death constitutes a harm to *it* is metaphysically unstable; without a subject to experience the loss, "harm" has no locus. Views that protect non-sentient nature (e.g., Deep Ecology) typically ground that value in *systemic* integrity (Node 3: Holism) rather than individual death-harm.

  ---
  *Note for Seminar Discussion: Consider how the "Precautionary" branch in Node 1 alters the burden of proof. Does uncertainty shift the default from Leaf A to Leaf E, or does it create a unique sixth position not mapped here?*
