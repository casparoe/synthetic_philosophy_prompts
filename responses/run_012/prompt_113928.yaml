      **Predictions for Watershed Case:**
      *   *Legal Boundness:* Enfranchise the national electorate (all are bound by the statute).
      *   *Material Affection:* Enfranchise district residents, both provinces' relevant stakeholders, and downstream farmers. Exclude the rest of the country (materially untouched).

