      I adopt **Material Affection**. It best reconciles 2009 (local merger) with 2004 (national constitution). If boundness governed, 2009 should have enfranchised nationals bound by the merger statute. Instead, you excluded them because their legal position was unaltered. Similarly, 2019 and 2022 enfranchised non-citizens/non-residents based on stake, not status. The Watershed Act alters water rights and provincial boundaries; like the 2009 merger, its material impact is regional, not national. The downstream farmers resemble the 2019 riparian neighbors; their functional stake outweighs their provincial distance.

