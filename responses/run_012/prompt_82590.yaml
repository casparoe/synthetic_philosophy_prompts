      *   *Wait, user says:* "Superrationality seems to recommend a mixed strategy with probability 1/N of sending one entry."
      *   *Clarification:* The user might be conflating Platonia (exactly one winner) with Luring (split pot). In Luring, you *want* to enter, just not *over*-enter. In Platonia, you want *exactly one* person to enter.
