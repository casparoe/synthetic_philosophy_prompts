          *   *Nature:* Individualistic reasoning with a magical correlation assumption. It's still "I choose," but "I choose knowing my choice mirrors theirs."
          *   *Platonia:* Choose $p = 1/20$ to maximize probability of exactly one success.
          *   *Luring Lottery:* Choose $p$ (or entry count) to maximize expected return given everyone does the same.

      *   **Team Reasoning (Bacharach/Sugden):**
          *   *Mechanism:* Identity shift. "We" are the agent.
          *   *Decision Rule:* Identify the profile of actions $(a_1, a_2, ... a_n)$ that maximizes group utility. Then, individual asks "What is my part in this profile?"
          *   *Nature:* Collective agency. It bypasses the Nash equilibrium logic by changing the utility function or the agent unit.
          *   *Platonia:* The team chooses the profile where *exactly one* person sends.
          *   *Luring Lottery:* The team chooses the profile where *exactly one* entry is submitted total.

  3.  **Address the Core Comparison (Are they the same?):**
      *   *Superficial similarity:* Both lead to cooperation in PD-like scenarios.
      *   *Deep difference:* Superrationality relies on *prediction* of identical reasoning (epistemic). Team Reasoning relies on *adoption* of a group goal (normative/agency).
      *   *Key Distinction:* Superrationality struggles with asymmetry (if roles differ, how do we map?). Team Reasoning handles asymmetry better (we assign roles).
      *   *The "Selection Problem":* This is the crux of the user's question.
          *   Superrationality: Randomization is the only symmetric solution.
          *   Team Reasoning: Requires a way to assign roles. If no communication, does it collapse back to randomization? Or does it imply a focal point?

  4.  **Drafting the Response - Section by Section:**

