answer: |-
  Dr. Aris unveiled a model predicting pigeon flight paths with eerie precision. Its core assumption: pigeons solve differential equations mid-air to minimize wind resistance.

  "They can't do math," objected grad student Ben.

  "Irrelevant," Aris cited Friedman. "Judge by predictions, not assumptions. They act *as if* they calculate."

  "But there's a difference," Ben pressed. "Ignoring friction assumes a force exists but is small. Assuming calculus brains assumes a mechanism that doesn't exist at all. That's not instrumental; it's magic."

  "The forecast works," Aris dismissed. "Descriptive realism is strictly irrelevant."

  Ben investigated. He found Aris had installed hidden fans along the predicted paths, forcing the pigeons into the model's lines. The predictions were accurate because Aris manipulated the environment, not because pigeons were mathematicians.

  At the defense, Aris proclaimed, "The data proves the calculus instinct!"

  Ben whispered, "No, it proves you're the wind."

  Aris won the prize for predictive accuracy. The entire department adopted the model, celebrating a theory where the assumption wasn't merely descriptively false, but ontologically void—yet validated by a professor holding a hidden fan. The doctrine had successfully turned a manipulation into a law of nature, proving that if the prediction holds, the economist is merely the hidden variable.
