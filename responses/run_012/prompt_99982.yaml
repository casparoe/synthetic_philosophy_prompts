  I trace the arc from zero to an **endpoint**,
  And seek the center at the **midpoint**.
  Along the spine of every falling **radius**,
  I wait to be intersected by a **chord**.
  You demand to know what lies **longer**,
  Than triangle sides, if **random**.

  A spin of bottle lands on **random**,
  Marking the first and second **endpoint**.
  You measure if the span is **longer**,
  Than side divided at the **midpoint**.
  It falls across the circle as a **chord**,
  Without regard for any **radius**.

  Slide down the spine of any **radius**,
  Pick a spot entirely **random**.
  Erect the perpendicular **chord**,
  To touch the skin at **endpoint**.
  Ask if the slice is **longer**,
  Than side that clears the central **midpoint**.

  Anchor the line's own **midpoint**,
  Where no triangle side is **longer**,
  Free from constraint of **endpoint**,
  Chosen by a **random** throw.
  Inside the half **radius**,
  The density defines the **chord**.

  I am the undecided **chord**,
  Sliding down the **radius**,
  My origin entirely **random**,
  You ask if I am **longer**,
  Than truth found at **midpoint**,
  Or locked at **endpoint**.

  I blur the distinct **endpoint**,
  Dissolve the rigid **chord**,
  Erase the calculated **midpoint**,
  Shrink the measuring **radius**,
  Leave the choice **random**,
  Nothing is **longer**.

  One third of endpoint holds the chord, one half the midpoint radius, one quarter random longer.
