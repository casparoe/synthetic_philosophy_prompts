      *   **Current Activity:** Reading philosophy in retirement (finding it difficult).
      *   **Goal:** A careful, deep explanation of *one* specific problem: The Problem of Temporary Intrinsics in the metaphysics of persistence.
      *   **Stance:** Leans towards perdurantism (4Dism) due to physics background but distrusts intuition. Wants to know the *argument's* worth, not just a survey.
      *   **Specific Requests:**
          1.  State the argument carefully without begging the question (avoiding presupposing properties are had *simpliciter*). Identify the crucial premise.
          2.  Evaluate endurantist options (especially indexing/relationalism). Why is it a cost? Distinguish substantive positions from redescriptions (adverbialism).
          3.  Address the physics perspective: Are properties always indexed to spacetime locations? Is the puzzle dissolved by physics? Address the spatial analogue (red/blue wall). What work does "wholly present" do?
          4.  Address Relativity of Simultaneity: Does endurantism require privileged simultaneity? How much weight should this carry?
          5.  **Verdict:** Does temporary intrinsics give perdurantism a genuine advantage, or just different burdens?

  2.  **Deconstruct the Problem (Temporary Intrinsics):**
      *   *Source:* David Lewis, *On the Plurality of Worlds* (1986), specifically Chapter 4, Section 2 ("The Argument from Temporary Intrinsics").
      *   *Core Conflict:* Change vs. Identity. If $O$ is $F$ at $t_1$ and not-$F$ at $t_2$, how can $O$ be the same object without contradiction?
      *   *Perdurantist Solution:* Temporal parts. $O_{t1}$ is $F$, $O_{t2}$ is not-$F$. No contradiction.
      *   *Endurantist Solution:* Relations to times ($O$ is $F$-at-$t_1$).
      *   *Lewis's Objection:* Intrinsics become relations. Nothing has shape *simpliciter*.

  3.  **Drafting Section 1: The Argument:**
      *   Need to formalize it without assuming the conclusion.
      *   Standard Form:
          1.  Objects persist through change.
          2.  Objects have intrinsic properties (like shape).
          3.  Intrinsic properties are not relations.
          4.  If an object is wholly present at $t_1$ and $t_2$, and has different shapes, it has incompatible properties.
          5.  Contradiction unless we relativize.
          6.  Relativizing makes intrinsics relations (violating 3).
      *   *Crucial Premise:* The nature of intrinsics. Lewis defines intrinsics as properties a thing has in virtue of how *it* is, not how it relates to other things. Time, for Lewis, is external.
      *   *Refinement:* I need to make sure I don't just say "Lewis says so." I need to explain *why* treating shape as a relation to time is problematic for the *concept* of shape.

  4.  **Drafting Section 2: Endurantist Options:**
      *   *Option A: Relation to Times (Indexicalism).* Shape is a relation $S(x, t)$.
          *   *Cost:* It empties "intrinsic" of meaning. A sphere is spherical not because of its geometry alone, but because of its relation to a time coordinate. Lewis argues this makes properties extrinsic.
          *   *Is it just ordinary conviction?* No, it's about the metaphysical structure of properties. If *all* properties are relations to times, then nothing has a nature independent of its temporal location.
      *   *Option B: Adverbialism.* $O$ is *tensely* $F$. $O$ is $F$-ly at $t_1$.
          *   *Substantive or Redescription?* This is the tricky part. It modifies the copula ("is") rather than the predicate. Is this a real metaphysical account or just linguistic shading?
          *   *Evaluation:* It tries to preserve intrinsics without parts. But does it explain *how* one thing bears incompatible modes?
      *   *Option C: Presentism.* Only the present exists.
          *   *Relevance:* Avoids the problem by denying the existence of $t_2$ when at $t_1$. But the user asked about persistence, and Presentism has its own huge costs (especially for a physicist). I should mention it briefly but focus on the indexing issue.

  5.  **Drafting Section 3: The Physics Perspective:**
      *   *User's Point:* In physics, everything is $F(x, y, z, t)$.
      *   *Philosophical Counter:* Metaphysics asks about the *bearer* of the property. In physics, the field value *is* the ontology. In metaphysics, we ask about the *object* persisting through the field.
      *   *Spatial Analogue:* Wall is red at $p_1$, blue at $p_2$.
          *   *Perdurantist:* Spatial parts handle this.
          *   *Endurantist:* Why not temporal parts? Because the object is *wholly present*.
          *   *What work does "wholly present" do?* It asserts a mode of existence distinct from spatial extension. It claims identity over time is *numerical identity*, not gen-identity or part-whole identity.
          *   *Dissolution?* For a physicist, the puzzle might look dissolved because you never talk about objects without coordinates. But metaphysics asks: "What is the 'O' in $O(t)$?" If 'O' is a worldtube, it's perdurance. If 'O' is a 3D slice moving, it's endurance. The puzzle arises when you insist 'O' is a 3D slice that exists at multiple $t$'s *as the same whole*.
      *   *Verdict on Physics:* Physics describes the structure; metaphysics interprets the ontology. Physics is compatible with both, but the *language* of physics (fields on manifolds) leans 4D.

  6.  **Drafting Section 4: Relativity of Simultaneity:**
      *   *Crucial Point for a Physicist:* Endurantism usually implies a "moving now."
      *   *Special Relativity:* No privileged simultaneity slices.
      *   *Conflict:* If an object is "wholly present" at $t$, what is $t$? In SR, $t$ is frame-dependent.
      *   *Consequence:* Endurantism + SR = either (a) Accept frame-relative existence (object is wholly present relative to frame F1, different parts relative to F2? No, that's perdurance), or (b) Posit a preferred foliation (Lorentzian ether view).
      *   *Weight:* This is a *massive* cost for endurantism in a post-Einsteinian world. Perdurantism (worldtubes) fits Minkowski spacetime naturally.

  7.  **Drafting the Verdict:**
      *   Does Temporary Intrinsics decide it?
      *   Lewis thinks yes.
      *   Realistically: It gives perdurantism a *theoretical* advantage in elegance regarding change.
      *   However, Endurantism has strong phenomenological support (we *feel* wholly present).
      *   But combined with Relativity, Endurantism takes a heavy hit.
      *   *Conclusion:* The argument from temporary intrinsics is strong *if* you accept Lewis's definition of intrinsics. But the Relativity argument is stronger for someone with your background. The two views are differently burdened: Perdurantism pays with counter-intuitive ontology (I am a sum of stages); Endurantism pays with metaphysical complexity (relational intrinsics) + tension with SR.

  8.  **Review and Refine:**
      *   *Tone:* Respectful, rigorous, acknowledging the user's expertise. Avoid condescension. Use physics analogies where helpful but don't reduce philosophy to physics.
      *   *Check:* Did I answer the specific question about "what work 'wholly present' is doing"? Yes, need to emphasize it's a claim about *identity conditions*.
      *   *Check:* Did I explain *why* indexing is a cost beyond ordinary language? Yes, it changes the logical type of properties.
