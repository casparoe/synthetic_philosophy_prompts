  **Diagnostic Decision Tree: Future Contingents**

  **Start:** Consider a sealed written prediction made yesterday about today's sea battle.

  **Node 1:** Is the content of that prediction already true or false right now, before you open the seal?
  *   **No:** Go to Node 2.
  *   **Yes:** Go to Node 3.

  **Node 2:** Is the sentence indeterminate across the ways the future might still go?
  *   **Yes:** **Supervaluationist Indeterminacy**.
      *   *Awkward Commitment:* Must accept that logical laws like excluded middle fail for future contingents despite holding for their disjunctions.
  *   **No:** Go to Node 2b.

  **Node 2b:** Is the sentence true only relative to a later context of assessment?
  *   **Yes:** **Assessment-Sensitive Truth**.
      *   *Awkward Commitment:* Must accept that a speaker can utter a truth without knowing it is true until the future settles.
  *   **No:** **Truth-Value Gap**.
      *   *Awkward Commitment:* Must accept that meaningful declarative sentences can lack a truth value entirely.

  **Node 3:** Does the fixity of the past reach forward to truths that were always about the future?
  *   **Yes:** Go to Node 4.
  *   **No:** Go to Node 5.

  **Node 4:** Does a true prediction's truth entail that the predicted event could not have been otherwise?
  *   **Yes:** Go to Node 6.
  *   **No:** **Unnamed**.
      *   *Awkward Commitment:* Must assert truths about the future are fixed by the past without rendering the future necessary, a distinction rarely defended.

  **Node 5:** Does the truth of the prediction depend on someone's later deliberation (a prophecy fulfilled by choice)?
  *   **Yes:** **The Ockhamist Soft-Fact Move**.
      *   *Awkward Commitment:* Must accept that some facts about the past are not "hard" and thus do not constrain present freedom.
  *   **No:** **Unnamed**.
      *   *Awkward Commitment:* Must assert future truths exist now but are neither fixed by the past nor dependent on deliberation, leaving their ground unexplained.

  **Node 6:** If your recovery is fated, is calling a physician pointless?
  *   **Yes:** **The Lazy Argument (Physician)**.
      *   *Awkward Commitment:* Must accept that causal intervention is inert even when it is the very means by which fate is realized.
  *   **No:** **Plain Logical Fatalism**.
      *   *Awkward Commitment:* Must accept that all events are necessary while maintaining that deliberation is not causally inert.

  ***

  **Unoccupied Combinations and Indistinguishability**

  *   **Unoccupied:** The path Node 1 (Yes) → Node 3 (No) → Node 5 (No) leads to an 'Unnamed' leaf. This combination (Truth exists, Past doesn't fix it, Deliberation doesn't fix it) is coherent but undefended because it posits "free-floating" truths with no ontological ground.
  *   **Unoccupied:** The path Node 1 (Yes) → Node 3 (Yes) → Node 4 (No) leads to an 'Unnamed' leaf. This combination (Past fixes truth, but truth doesn't entail necessity) is rarely defended because if the past fixes the truth of a future contingent, it typically implies the future is unavoidable.
  *   **Indistinguishable Leaves:** This tree cannot fully distinguish **Supervaluationist Indeterminacy** from **Truth-Value Gap** without further questions about logical validity (e.g., whether $P \lor \neg P$ is valid). Both deny present bivalence, and in many diagnostic contexts, they yield identical practical predictions about assertion and belief.

  Summary: 7 leaves and it cannot distinguish Supervaluationist Indeterminacy from Truth-Value Gap.
