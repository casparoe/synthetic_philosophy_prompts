answer: |-
  **Commencement Address**

  Thank you, Dean [Name], faculty, families, and most importantly, the Class of 2024.

  It is an honor to stand here. When the Dean invited me to speak, she sent a very kind email. She said the college was eager to hear a few words about "this generation of graduates." She noted that you have been told, since middle school, that you are a distinct group. That you share a specific destiny. That you are, in the common parlance, "Gen Z."

  I said yes to this invitation immediately. And then, about an hour later, I remembered what I do for a living.

  I am a researcher. I study how we measure people and time. And for the past decade, I have argued, quite publicly, that generations—Boomers, Millennials, Gen Z—are not real biological kinds. They are not like species of birds. There is no gene that turns on when you are born between 1997 and 2012 that makes you prefer video calls to phone calls. There is no cosmic switch that flips every twenty years and changes human nature.

  In my field, we call this the age-period-cohort problem. It's a mouthful, but the idea is simple. It is very hard to tell if you act a certain way because of when you were born, or simply because you are young, or because the world is currently on fire. When people say, "Young people today are more anxious," I ask: Are they more anxious than *you* were at twenty-two? Or are they just more anxious than *you* are now, at fifty, because being twenty-two is terrifying in any era?

  So, I found myself in a bind. I am standing here, having agreed to talk about "your generation," when my professional opinion is that "your generation" is essentially a marketing bin created in the 1990s based on a pop-theory of history cycles, not data.

  I could stand here and pretend I don't think that. I could tell you that you are the "Digital Natives," the "Resilient Cohort," the "Change-Makers." But you would know I was lying. The faculty in the third row know I'm lying. And frankly, you deserve better than a commencement speech built on a demographic fiction.

  However, I also know that telling a room full of twenty-two-year-olds that their shared identity is a sham is not inspiring. It's just cruel. And it's not entirely true, either.

  Here is the truth I want to offer you today. It is a nuance, but it is an important one.

  Generations are not *natural* facts, like gravity or genetics. But they are *social* facts. They are real in the same way that money is real.

  Think about a twenty-dollar bill. Intrinsically, it is a piece of cotton-linen blend with some ink on it. It has no value in nature. You cannot eat it; it will not keep you warm. But, we have all agreed to pretend it has value. Because we agree, it can buy lunch. Because we agree, it can build houses. If we stop agreeing, it becomes just paper. But as long as we agree, it moves mountains.

  "Gen Z" is like that twenty-dollar bill.

  There is no biological essence to it. But there is a social reality. Employers use it to decide how to hire you. Politicians use it to decide how to vote for you. Algorithms use it to decide what ads to sell you. And, perhaps most importantly, you use it to find each other.

  When the Valedictorian speaks in a few moments, they will likely say, "We are the generation that..." They will talk about the climate, the pandemic, the screens, the instability. They are not wrong. You *did* grow up in the same weather. You *did* come of age during the same crash. You *did* learn to love and fight through the same glowing rectangles.

  That shared timing creates a bond. It is not because your brains are wired differently than your parents'. It is because you met the same world at the same age. That is a powerful thing. It gives you a common language. It gives you a shorthand for solidarity.

  But here is the risk. The risk of treating a social fact like a natural fact is that you start to think the label defines your limits.

  If you believe "Gen Z" is a biological destiny, you might think, "Well, I'm burnt out because that's what my generation *does*." Or, "I can't talk on the phone because my cohort *is* anxious." You might let a marketing category write your biography.

  The reason I am comfortable standing here, despite my skepticism, is that I trust you to use the label rather than let it use you.

  Because a generation is a story, not a species, you have the power to edit the story.

  If "Gen Z" is just a bin, you get to decide what goes in it. If it is a social construct, you are the constructors. The previous generations often fell into the trap of thinking their labels were destiny. They fought over the boundaries. "I'm a Gen X," "No, I'm a Millennial," as if there were a border patrol at 1980.

  You have the opportunity to be more pragmatic. Use the label when it builds community. Use it when it helps you organize for climate action or labor rights. Use it when it helps you explain to your parents why the economy feels different to you than it did to them.

  But discard the label when it becomes a cage. When someone tells you, "Your generation is lazy," or "Your generation is too sensitive," recognize that for what it is: a failure of their imagination, not a flaw in your character. Do not accept a marketing demographic as a moral judgment.

  The "Age-Period-Cohort" tangle I mentioned earlier? It sounds academic, but it's actually a map for your life.

  The **Age** effect reminds you that you are young, and that means you are allowed to be uncertain. You are allowed to change your mind. You are allowed to not have the answer yet. That is not a generational trait; that is a human trait of being twenty-two.

  The **Period** effect reminds you that you are living through a specific, chaotic time. You are not responsible for fixing the entire history of the world alone. You are responsible for how you act *now*.

  And the **Cohort** effect—the generation part—that is the people standing next to you. It is the community you build.

  So, my charge to you is this: Do not ask, "What does my generation want?" Ask, "What do *we* want?"

  Do not look for your identity in a spreadsheet column created by a advertising agency in 1995. Look for it in the faces of the people you love, the work you do, and the problems you choose to solve.

  You are not a data point. You are not a target audience. You are not a "kind." You are individuals, bound together by the accident of time, choosing to walk forward together.

  The Dean asked me to speak to "this generation." I am doing so by telling you that the generation is yours to define. It is a currency. Spend it wisely. Invest it in things that last. And if the exchange rate drops, if the label stops serving you, you have the authority to issue new currency.

  Congratulations, Class of 2024. You are not a demographic. You are a community. And that is much more real than any label I could give you.

  Thank you.

  ***

  **Follow-up Email to the Dean**

  **Subject:** Thank you / Today's remarks

  Dear Dean [Name],

  Thank you again for the invitation to speak today. It was a privilege to share the day with the graduates and their families.

  I wanted to follow up briefly regarding the content of the speech. I know I took a slightly unconventional approach to the request to speak about "this generation." As we discussed, my research focuses on the skepticism around generational theory. I felt that the most respectful thing I could offer the students was honesty about that framework, while still validating the very real social bonds they share.

  My goal was not to undermine the ceremony or make fun of the college's messaging, but to empower the students. I wanted to ensure they understood that while the *label* might be a construct, the *community* is real, and that the power lies with them to define it, not the other way around.

  I hope the message landed as intended: as a call to agency rather than a critique of their identity. I am happy to discuss this further if you'd like, but I wanted to ensure you knew the intent was to honor the graduates by treating them as critical thinkers.

  Best regards,

  [Your Name]
