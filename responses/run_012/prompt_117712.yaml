      *   *Decision:* Recommend continuing the pilot but redefining "Affected Neighborhood" as all adult residents (verified by lease/utility) within a fixed geographic boundary. Remove the supermajority override (make it standard majority) to balance the expanded inclusivity. Exclude non-resident waitlists/displaced from the *vote* to maintain administrative feasibility and geographic accountability, but mandate their input in hearings.
      *   *Wait, one more thing:* The prompt says "Council needs a supermajority to go against a 'no'." This is the veto power. If I recommend keeping the veto, I need to be careful about who holds it. If I expand the electorate to renters, the vote might shift. If I keep the supermajority, it still protects the neighborhood.
      *   *Refined Decision:* Recommend redefining the electorate to **all adult residents (renters + owners)** within a **fixed geographic boundary** (e.g., 0.5 miles). **Keep the pilot**, but **remove the supermajority requirement** (return to standard majority override) to balance the increased legitimacy of the expanded electorate. This addresses the "rigged" homeowner bias without making the vote unmanageable (waitlists).
