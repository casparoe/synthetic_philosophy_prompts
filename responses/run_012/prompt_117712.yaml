answer: |-
  **MEMORANDUM**

  **TO:** City Council
  **FROM:** City Planning Commission
  **DATE:** January 12, 2024
  **SUBJECT:** Recommendation Regarding Definition of "Affected Neighborhood" for Upzoning Pilot Program

  **Executive Summary**

  The Planning Commission submits this recommendation to resolve the ambiguity surrounding the "Affected Neighborhood" advisory vote established in last year's upzoning pilot. The current practice of limiting the electorate to registered voters within neighborhood boundaries systematically excludes renters and transient populations, creating a democratic deficit that undermines the pilot's legitimacy. However, expanding the electorate to non-residents (waitlist households, displaced persons) introduces administrative infeasibility and disconnects voting power from daily impact.

  We recommend continuing the pilot with a redefined electorate comprising **all adult residents (renters and owners)** within a **fixed geographic boundary**, verified by lease or utility documentation rather than voter registration. To balance this expanded inclusivity, we recommend adjusting the override threshold from a supermajority to a **simple majority**. This approach preserves local accountability while mitigating exclusionary bias.

  **Context and Problem Statement**

  The pilot program requires Council to achieve a supermajority vote to override a "no" recommendation from the affected neighborhood. However, the enabling ordinance never defined "affected neighborhood." Staff default to registered voters within neighborhood association boundaries. In practice, this electorate is disproportionately older, wealthier, and home-owning.

  This creates a specific failure mode in areas with histories of displacement, such as the proposed railyard development. The current electorate may include residents who benefited from previous redevelopment rounds that displaced the very households now seeking affordable housing. Conversely, proposals to expand the vote to all "affected" parties (including waitlist households and those displaced up to 15 years ago) risk creating an unmoored electorate where voters do not bear the daily physical consequences of the zoning decision (traffic, shadows, infrastructure load).

  **Analysis of Competing Positions**

  *Proposal A: Broad "Everyone Affected" Electorate*
  Proponents argue that housing policy is regional, and those excluded from the market have a stake equal to those within it.
  *Critique:* While morally compelling, this is administratively fragile. Verifying "displacement from 15 years ago" or "waitlist status" invites litigation and delays. Furthermore, it separates voting power from physical accountability. A voter living outside the city does not experience the shadow cast by a new building or the competition for street parking.

  *Proposal B: Weighted Vote by Impact*
  Proponents argue for a principled approach where those most impacted carry more weight.
  *Critique:* There is no objective metric for "weight." Assigning values to proximity or tenure is arbitrary and likely to be challenged as discriminatory.

  *Steelman: The Case for "Current Residents Only"*
  Half of this Commission holds the view that only current residents should decide. This position is not necessarily rooted in exclusionism, but in **accountability and consequence**. A functional democracy requires that voters live with the outcomes of their votes. Current residents are the only group that can accurately assess the trade-off between new housing supply and local infrastructure strain. They are the ones who will deal with the construction noise, the changed traffic patterns, and the altered streetscape. Expanding the vote to non-residents dilutes the agency of those who must physically inhabit the decision. Furthermore, clear geographic boundaries are essential for administrative clarity; anything less invites endless disputes over who qualifies to vote.

  **The Crux**

  The conflict is not between "residents" and "non-residents." It is between **homeowners** and **residents**. The current failure mode arises because "registered voter" is a proxy for "homeowner," not "resident." The crux of this recommendation is that legitimacy requires including all who live with the consequences (renters), but limiting voting power to those who actually live there. Non-resident stakeholders (displaced households, waitlist applicants) deserve formalized input, but not veto power.

  **Recommendation**

  The Planning Commission recommends the following amendments to the pilot program enabling ordinance:

  1.  **Electorate Definition:** The "Affected Neighborhood" shall consist of all adult residents (18+) residing within the defined boundary, regardless of citizenship or voter registration status. Verification shall be via lease agreement, utility bill, or state ID matching the address.
  2.  **Boundary Definition:** Boundaries shall be drawn as a fixed radius (0.5 miles) from the project perimeter, rather than relying on existing Neighborhood Association lines, which are often exclusionary or irregular.
  3.  **Weighting:** One person, one vote. No weighting based on tenure or ownership status.
  4.  **Pilot Status & Threshold:** The pilot shall continue, but the Council override threshold shall be adjusted from a **supermajority** to a **simple majority**. Expanding the electorate to include renters increases the democratic legitimacy of the vote; therefore, the barrier to override that vote should be lowered to balance city-wide housing needs against local concerns.
  5.  **Non-Resident Input:** Staff shall establish a formal "Displaced & Waitlist Testimony" period during public hearings. This ensures structural stakeholders are heard without granting them veto power over specific sites.

  **Implementation Timeline**

  *   **January 31:** Council adopts ordinance amendments defining electorate and threshold.
  *   **February 15:** Staff completes resident registry for the railyard project area (mailers to all units, not just owners).
  *   **March 1:** Advisory vote period opens.
  *   **March 15:** Vote closes; Commission reviews results for Council consideration.

  **Conclusion**

  This recommendation accepts that there is no perfect solution to the tension between local control and regional housing needs. However, shifting from "registered voters" to "all residents" corrects the most egregious exclusionary bias without rendering the process unmanageable. Lowering the override threshold acknowledges that while local input is vital, it should not constitute a veto against city-wide housing goals.

  Respectfully submitted,

  Planning Commission

  ***

