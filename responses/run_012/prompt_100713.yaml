  **ROOT PREMISE (The Argument from Illusion):** *A veridical perception of a tomato and a subjectively indistinguishable hallucination of one share whatever it is that makes them experiences of the same kind.*

  **Q1. Does this indistinguishability entail the presence of a shared mental ingredient (a Common Factor)?**
  *   **NO:** *(Unexplored/Incoherent: Denies the phenomenal data prompting the inquiry.)*
  *   **YES:** → Go to Q2.

  **Q2. Does this Common Factor constitute the fundamental metaphysical nature of the experience (Strong Common Kind), or is it merely a shared property allowing for metaphysical differences (Weak Common Factor)?**
  *   **WEAK COMMON FACTOR (Nature may differ):** → Go to **Disjunctive Branch (A)**.
  *   **STRONG COMMON KIND (Nature is identical):** → Go to **Common Factor Branch (B)**.

  ---

  ### BRANCH A: DISJUNCTIVE (Nature may differ)

  **Q3. In the hallucinatory (bad) case, is the subject in a positive mental state or a mere absence of perception?**
  *   **MERE ABSENCE:** → **Q4. Is the veridical (good) case fundamentally a relation to a mind-independent object?**
      *   **YES:** → **NAIVE-REALIST DISJUNCTIVISM**
          *   *Awkward Commitment:* Subjectively identical states have nothing mentally in common, making indistinguishability a brute fact.
      *   **NO:** → *(Incoherent: If not relational and not a common kind, the 'good' case lacks a defining nature.)*
  *   **POSITIVE STATE:** → **Q5. Is the disjunction located in the metaphysical nature of the state or the subject's epistemic position?**
      *   **METAPHYSICAL NATURE:** → **POSITIVE-STATE DISJUNCTIVISM**
          *   *Awkward Commitment:* Hallucinations are positive states fundamentally different from perceptions, yet indistinguishable by design.
      *   **EPISTEMIC POSITION:** → **EPISTEMIC DISJUNCTIVISM**
          *   *Awkward Commitment:* Grants a radical difference in rational support without always committing to a metaphysical difference in experience.

  ---

  ### BRANCH B: COMMON FACTOR (Nature is identical)

  **Q6. Consider two cases: (1) Standard Hallucination, (2) Hybrid Case (seeing a real tomato but hallucinating a stripe). Is the shared factor an *object* presented or *content* represented?**
  *   **OBJECT PRESENTED:** → **Q7. Is this object mind-independent or mind-dependent?**
      *   **MIND-DEPENDENT:** → **SENSE-DATUM THEORY**
          *   *Awkward Commitment:* You never directly perceive the public world, only private proxies that resemble it.
      *   **MIND-INDEPENDENT:** → *(Incoherent: Hallucinations cannot relate to mind-independent objects that aren't there.)*
  *   **CONTENT REPRESENTED:** → **CONTENT-BASED INTENTIONALISM**
      *   *Awkward Commitment:* Hallucinations have content but no truth-conditions or objects to satisfy them (the problem of empty content).
  *   **NEITHER (MANNER OF SENSING):** → **ADVERBIALISM**
      *   *Awkward Commitment:* Linguistic contortions required to explain complex scenes (e.g., "sensing redly-roundly").

  ---

  ### NOTES FOR DISCUSSION

  **⚠️ UNDEFENDED COMBINATIONS:**
  1.  **Common Kind + Relational to Mind-Independent Object:** Marked *Incoherent*. If the kind is shared, the hallucination must also relate to a mind-independent object, which is impossible by definition.
  2.  **Disjunctive + Good Case Non-Relational:** Marked *Unattractive*. Without the relational anchor, the 'good' case loses its advantage over the 'bad' case.

  **⚖️ INDISTINGUISHABLE LEAVES:**
  *   **Epistemic Disjunctivism** and **Positive-State Disjunctivism**.
  *   *Further Question Needed:* "Does the hallucinating subject undergo a positive mental state of a *different fundamental kind*, or merely lack the epistemic warrant of the perceiver while retaining a similar mental state?"

  **🔍 THE HYBRID CASE STRESS TEST:**
  *   Used at **Q6**. Naive Realists struggle here: if I see a real tomato but hallucinate a stripe, am I related to the tomato? If yes, what is the status of the stripe? Intentionalists handle this easily (partial falsity), but Sense-Data theorists must posit a composite mental object.
