  1. **The Baseline Definition**
  "Let's start with the baseline. The standard gloss is 'what would have happened if you did nothing.' But you're embedded in the world. How do you define that counterfactual without already assuming a model of how you *should* behave?"
  *   **Follow-up:** "Okay, but how do you stop the agent from making the 'do nothing' outcome worse first, so its actual actions look like an improvement by comparison?"

  2. **The Stepwise Fix**
  "To fix that cheating, some propose recomputing the baseline at every step. What does that buy you, and where does it break down compared to a single initial counterfactual?"
  *   **Follow-up:** "But if you reset the baseline every step, don't you lose the ability to measure long-term impact? Isn't that just myopia?"

  3. **The No-Spec Claim**
  "You claim this doesn't need a full value specification. But choosing which features count as 'impact' seems to bake in values. Isn't the value just hidden in the metric?"
  *   **Follow-up:** (If he says features are observable/values separate): "If you're conservative across *all* plausible values on those features, doesn't that converge on 'do nothing' anyway? Where's the room to act?"

  4. **The Sign Problem**
  "Here's the killer: a penalty on divergence can't tell vaccinating a village from flooding it. Both are big changes. How do you get the sign right without the value spec you said we could avoid?"
  *   **Follow-up:** (If he says 'conservative measure'): "If the safe answer is 'never diverge,' isn't that just paralysis? What's the point of an agent that doesn't act?"

  5. **Task vs. Side Effect**
  "A side effect is only defined relative to what's in the objective. If the objective is incomplete, isn't the notion of a side effect also incomplete? Where do you draw the line?"
  *   **Follow-up:** (If he says 'conservative across plausible tasks'): "If you're conservative across all plausible tasks, doesn't that converge back to 'do nothing' again?"

  6. **Reversibility**
  "You lean on reversibility. But curing a disease is irreversible, and a temporary catastrophe is reversible. Is 'options preserved' actually tracking harm, or just a proxy that breaks on important cases?"
  *   **Follow-up:** "If it breaks on the most important cases, why trust it as a safety constraint in high-stakes scenarios?"

  7. **Options vs. Power**
  "Is this about optionality or control? Keeping the world's options open sounds like a substantive value claim, not a neutral constraint. What about preserving options for bad actors?"
  *   **Follow-up:** "If it's neutral, how does it stop an agent from empowering bad actors if that preserves options?"

  8. **The Heuristic Story**
  "The story is 'messing with the world is risky if you don't know values.' Does that make low-impact just a compressed value spec? And if the agent learns the values, should the penalty disappear?"
  *   **Follow-up:** "If it shrinks to zero, wasn't it just a placeholder for the value spec all along? What work is it actually doing?"

  9. **Alignment or Manners (Part 1)**
  "Is an impact penalty a substitute for getting the objective right, or a complement that only helps once the objective is roughly right?"
  *   **Follow-up:** "If it's just a complement, why sell it as a solution to the specification problem?"

  10. **Alignment or Manners (Part 2)**
  "So if I hear you right: this doesn't solve alignment, it just buys time. Is that fair?"
  *   **Follow-up:** "How much margin? Enough to solve alignment, or just enough to deploy?"
