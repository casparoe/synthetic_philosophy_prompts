      *   *Question A: The Nature of the Obligation.* Is this about guilt, debt, or something else? (Metaphysics of responsibility).
      *   *Question B: The Recipient of Repair.* Who gets the money? Descendants specifically or the community generally? (Justice vs. Welfare).
      *   *Question C: The Symbolic Order.* What do we do with the name and the public face? (Honor vs. History).
