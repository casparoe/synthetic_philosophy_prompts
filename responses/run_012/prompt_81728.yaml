          5.  Express confidence levels for each claim and identify the point of least certainty with reasoning.
      *   **Constraints:** No reading lists. Firm answers preferred over surveys. Use standard philosophical terminology where helpful but keep it practical.
      *   **Context:** Family manufacturing firm, founded 1902, coercive labor first 20 years (legal then, unjust now), 14 shareholders (mixed relation), dividends fund son's schooling.

  2.  **Deconstruct the Situation (Diagnosis):**
