answer: |-
  You are correct that you are running several distinct ethical problems together. This conflation is what makes the situation feel paralyzing. Before I give you my judgment on the votes and the shares, we must separate the strands.

  ### Part 1: Disentangling the Questions

  Your situation contains three distinct moral questions. The family debate is messy because everyone is answering a different one while pretending to answer the same one.

  1.  **The Question of Status (Metaphysics of Responsibility):** Are you *guilty* of the founder's acts, or are you merely *beneficiaries* of them? This is the Uncle's question. It asks about your moral character.
  2.  **The Question of Repair (Corrective Justice):** What is owed to the victims of the capital accumulation? This is the Trust question. It asks about the money's history, not your character.
  3.  **The Question of Honor (Symbolic Order):** What does the company's public face say about its values? This is the Renaming and Apology question. It asks about truth-telling and social signaling.

  You are feeling resentment because the family is treating Question 1 as if it determines the answer to Question 2. They are not linked. You can be innocent of guilt (Question 1) and still hold an obligation of repair (Question 2).

  ### Part 2: Evaluating the Family Arguments

  Here is the philosophical assessment of the three positions you outlined.

  **1. The Uncle: The Debt/Guilt Dichotomy**
  *   **Verdict:** False Dichotomy.
  *   **Analysis:** The Uncle argues that obligation requires either personal fault (guilt) or legal contract (debt). This ignores the principle of **Unjust Enrichment**. In ethics, as in law, if you hold assets that were acquired through the violation of another's rights, you hold them subject to a claim of restitution, regardless of your personal innocence.
  *   **Why it fails:** It assumes the only reason to pay is punishment (guilt) or contract (debt). It misses the third category: *Disgorgement of Ill-Gotten Gains*. The dividends are clean only if the capital that generated them was clean. It was not. The Uncle's view is a defense of privilege, not a moral argument.
  *   **Confidence:** High.

  **2. The Cousin: The Continuous Actor**
  *   **Verdict:** Substantially Correct, but limited scope.
  *   **Analysis:** This relies on the theory of **Corporate Moral Agency**. The firm is a legal and moral person that persists through time. The firm *did* the coercive labor; the firm *exists* today. Therefore, the firm owes the debt.
  *   **Why it succeeds:** It bypasses the "dead people" problem. The entity that committed the wrong is still here.
  *   **The Limit:** This protects the *shareholders* from personal guilt (supporting your spouse's resentment), but it does not protect the *dividends* from the obligation. If the firm owes a debt, the assets of the firm (including distributable profits) are the source of payment. The Cousin is right that the firm must act, but wrong if she implies this absolves the shareholders of the decision to pay.
  *   **Confidence:** High.

  **3. The Third Shareholder: The Dead Victims/Welfare View**
  *   **Verdict:** Conflation of Justice and Charity.
  *   **Analysis:** This argument claims that because the specific victims are dead, specific justice is impossible, so we should default to general welfare (the scholarship). This touches on the **Non-Identity Problem**, but applies it incorrectly.
  *   **Why it fails:** It treats the obligation as *distributive justice* (helping the poor) rather than *corrective justice* (fixing a specific wrong). If I steal from your grandfather and your grandfather's theft made you poor, paying a random poor person does not fix the theft. It launders the money. The obligation attaches to the *lineage of harm*, not just the *state of poverty*.
  *   **Confidence:** High.

  ### Part 3: Voting Recommendations

  You asked for firm answers. Here is how you should vote, based on the separation above.

  **1. The Trust for Descendants**
  *   **Vote:** **Yes.**
  *   **Reasoning:** This is the only proposal that addresses **Unjust Enrichment**. The capital was built on coercive labor. That specific value extraction created a specific debt. Even if the descendants are scattered, a good-faith effort to trace them is the only way to discharge the specific obligation.
  *   **Status:** **Required.** This is not a gesture; it is restitution. Without this, the dividends remain ethically tainted.

  **2. The Public Apology**
  *   **Vote:** **Yes.**
  *   **Reasoning:** This addresses **Truth-Telling**. The company name carries the founder's legacy. To keep the name while hiding the history is a lie. The apology costs nothing financially but validates the historical record.
  *   **Status:** **Required.** It is a condition of moral legitimacy for the firm's continued operation under that history.

  **3. Removing the Founder's Name**
  *   **Vote:** **Yes.**
  *   **Reasoning:** This addresses **Honor**. Keeping the name on the building is an active, present-tense act of veneration. You cannot pay reparations for coercive labor while simultaneously honoring the coercive laborer on the facade. It creates a moral contradiction.
  *   **Status:** **Required.** It signals that the firm's current values are distinct from its origins.

  **4. The Uncle's Scholarship**
  *   **Vote:** **No** (as a substitute).
  *   **Reasoning:** This is **Evasion**. A needs-based scholarship is a good thing in isolation, but in this context, it is a strategy to avoid the specific claim of the descendants. It converts a debt of justice into an act of charity. Charity is discretionary; justice is not.
  *   **Exception:** If the Trust is funded *and* the Scholarship is funded *additionally*, vote Yes. If it is "Scholarship *instead of* Trust," vote No.
  *   **Status:** **Evasion** if offered as the primary remedy.

  ### Part 4: The Inheritance Question

  **Should you arrange for your son to inherit the shares?**

  *   **Judgment:** **No, not in their current form.**
  *   **Reasoning:** Inheriting the shares means inheriting the **Benefit of Unjust Enrichment**. If you pass the shares to him, you pass the obligation along with them. Unless the firm has fully discharged the historical debt (via the Trust), passing the shares is passing a moral burden he did not choose.
  *   **Practical Path:** You have two ethical options.
      1.  **Sell and Donate:** Sell the shares now and donate the principal to the Trust. This ends the entanglement.
      2.  **Encumber the Inheritance:** If you must keep them for financial stability, legally encumber the shares so that *all future dividends* go to the Trust until the historical debt is deemed paid, with only the principal passing to the son later.
  *   **Recommendation:** Given the dividend pays for your son's schooling *now*, you are already consuming the tainted capital. You should vote for the Trust (suspending dividends) and find another way to fund the schooling. Do not pass the shares to your son unless the historical debt is fully cleared. To do so is to make him a custodian of a debt he cannot trace.

  ### Part 5: Confidence and Uncertainty

  **Confidence Levels:**
  *   **Uncle's Dichotomy is False:** High Confidence. (Standard ethical consensus on unjust enrichment).
  *   **Trust is Required:** High Confidence. (Corrective justice demands specific restitution over general charity).
  *   **Renaming is Required:** High Confidence. (Symbolic consistency is necessary for public integrity).
  *   **Inheritance Advice:** Moderate Confidence. (This depends on future family dynamics and the solvency of the Trust).

  **The Point of Least Certainty:**
  I am least certain about the **sufficiency of the Trust as a complete discharge of obligation.**

  **Reason:** My judgment assumes that a monetary payment to descendants can "settle the account" of coercive labor. There is a philosophical risk here that money cannot actually repair this kind of moral injury (a critique often raised in **Restorative Justice** literature). If the Trust is funded but the amount is calculated poorly (e.g., too low), the family may vote "Yes" and feel they have "finished" the work, when they have only performed a transaction. The uncertainty lies in whether the *mechanism* (a trust fund) can truly achieve the *moral end* (reconciliation), or if it merely creates a new form of bureaucratic closure that allows the family to stop thinking about the injustice. I recommend the Trust because it is the *best available* option, not because I am certain it is *sufficient*.

  **Summary Instruction:** Vote Yes on Trust, Apology, Renaming. Vote No on Scholarship-as-Substitute. Do not pass the shares to your son without encumbering them for restitution. You are not guilty, but you are responsible. Distinguish those two things, and the resentment will lose its grip.
