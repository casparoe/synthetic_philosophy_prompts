  3.  **Evaluate the Family Arguments:**
      *   *The Uncle (Debt/Guilt Dichotomy):* He argues debts survive, guilt doesn't. Assets carry debt, wills carry guilt.
          *   *Critique:* This is a classic "non-identity" or "no fault" defense. It assumes obligation *only* arises from personal fault or strict legal debt. It ignores *unjust enrichment*. If I hold stolen goods, I must return them even if I didn't steal them. The dichotomy is false. There is a third category: *Restitution of Ill-Gotten Gains*.
      *   *The Cousin (Continuous Actor):* The firm is one agent since 1902.
          *   *Critique:* Corporate continuity is a legal fiction that serves a moral purpose here. It bypasses the "dead people" problem. However, it risks absolving the *shareholders* of personal reflection if they hide behind the "corporate veil." It's strong on institutional responsibility, weaker on individual benefit.
      *   *The Third Shareholder (Dead Victims/Welfare):* Wrong done to the dead; paying descendants is random. Only poverty matters.
          *   *Critique:* This conflates *corrective justice* (fixing the specific wrong) with *distributive justice* (helping the needy). If the wealth was generated by *specific* exploitation of *specific* people, justice requires tracing that link if possible, not just general charity. Otherwise, it's laundering the money.

  4.  **Analyze the Four Proposals:**
      *   1. *Trust for Descendants:* Corrective justice. Hardest to administer (who counts?), but morally most direct.
      *   2. *Public Apology:* Symbolic. Necessary but insufficient. Acknowledges the truth.
      *   3. *Removing Name:* Symbolic. Stops the active honoring of the perpetrator.
      *   4. *Uncle's Scholarship:* Distributive justice/Welfare. Good thing, but evades the specific historical link. "Doing good" isn't the same as "making right."

  5.  **Formulate Recommendations (The "Practical Judgment"):**
      *   *Vote:*
          *   Trust: Yes (Priority). It addresses the specific unjust enrichment.
          *   Apology: Yes. Truth-telling is a duty.
          *   Renaming: Yes. You cannot honor a coercive labor practitioner publicly while paying reparations privately.
          *   Scholarship: No (as a *substitute*). It can exist *alongside*, but not *instead of*. It is evasion if it replaces the Trust.
      *   *Shares:* This is tricky. Keeping them implies ongoing benefit from tainted capital. Selling them might just pass the problem to someone else. Donating future dividends? The prompt asks about inheritance.
