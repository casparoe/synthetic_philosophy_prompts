  6.  **Drafting the Response (Iterative refinement for tone and constraints):**
      *   *Tone:* Direct, analytical, authoritative but humble on the uncertainty. No "some philosophers say." Say "This is wrong because..."
      *   *Structure:*
          1.  Disentangling the Questions.
          2.  Evaluating the Arguments (Uncle, Cousin, Third).
