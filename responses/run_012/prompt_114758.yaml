answer: |-
  **To:** Intensive Care Registrars, [Trust Name]
  **From:** Dr [Your Name], Clinical Lead for Organ Donation
  **Subject:** Night-Time DCD Confirmation Procedure (v1.0)
  **Date:** [Current Date]

  **Purpose:**
  This document is for use when you are the most senior doctor on site, at night, facing a potential Donation after Circulatory Death (DCD). It is not a replacement for the Academy of Medical Royal Colleges Code of Practice, but a triage tool for the specific ethical and practical pressures of the 3 AM phone call.

  Its goal is not to make the decision easy, but to make it defensible. It distinguishes between physiological facts and value judgements. If you cannot tick a box, you stop. If you tick a box but feel uneasy, you call me. If I am not available, you do not proceed.

  ---

  ### PART 1: THE NIGHT PROCEDURE (DCD)

  **Phase 1: The Pre-Conditions (Before Withdrawal of Treatment)**
  *Do not wait for the arrest to check these. If these are not in place, you cannot declare death for donation.*

  1.  **Is there a valid DNACPR form?**
      *   **Yes:** Proceed.
      *   **No:** You must establish that resuscitation is not in the patient's best interests *independent* of donation. If you are writing a DNACPR now solely to facilitate donation, **STOP**. The decision not to restart the heart must exist before donation is raised.
      *   *Note:* This is where "Permanent" is decided. We are deciding we will not attempt to reverse the arrest. This is a value judgement, not a physiological one.

  2.  **Was the decision to withdraw life-sustaining treatment (WLST) made independently of the transplant team?**
      *   **Yes:** Proceed.
      *   **No:** **STOP**. The decision to withdraw must be made by the ICU team based on futility or burden. Donation is discussed only *after* this decision is recorded.

  3.  **Is the family aware that death will be confirmed by circulatory criteria?**
      *   **Yes:** Proceed.
      *   **No:** You must explain this before withdrawal. "When the heart stops, we will wait five minutes. If it does not restart, we will confirm death."

  **Phase 2: Withdrawal and Standoff**

  4.  **Withdrawal:**
      *   Treatment is withdrawn by the ICU team.
      *   Transplant coordinators must not be present in the room during withdrawal.
      *   Monitor for agonal breathing (gasping). This does not invalidate death, but it resets the clock if it looks like perfusion is returning.

  5.  **The Standoff Period:**
      *   **Duration:** 5 minutes of continuous asystole and apnoea.
      *   **Why 5?** It is the UK Code of Practice standard. It exceeds the time for autoresuscitation (the "Lazarus phenomenon").
      *   **Measurement:** Continuous arterial line or pulse oximetry preferred. If absent, manual pulse check.
      *   **Action:** If *any* cardiac activity returns within 5 minutes, reset the clock. If activity persists, death has not occurred. Abort donation pathway.

  **Phase 3: Confirmation of Death**

  6.  **At T+5 Minutes:**
      *   Confirm absence of:
          *   Palpable central pulse.
          *   Heart sounds.
          *   Respiratory effort.
      *   **Sign-off:** The ICU consultant or registrar (you) signs the death certificate. Time of death is recorded as the end of the 5-minute period.
      *   **Crucial:** You are certifying that circulation has ceased *permanently*. You are not certifying that it is *irreversible* (i.e., that it couldn't be restarted with ECMO), but that it *will not* be restarted (per the DNACPR).

  7.  **Handover:**
      *   Once signed, the body is under the care of the retrieval team.
      *   **Do not** allow retrieval to begin until the death certificate is signed.

  ---

  ### PART 2: THE FOUR HARD CASES

  Run the procedure above against these scenarios. Where the procedure is silent, use the guidance below.

  #### Case A: The Patient on Extracorporeal Support (ECMO/ECLS)
  **Scenario:** Patient is on VA-ECMO. Heart is beating weakly or not at all, but the machine is oxygenating and pumping blood.
  **The Problem:** Absence of pulse does not mean absence of cerebral perfusion. The machine might be keeping the brain alive while the heart is silent.
  **Procedure Application:**
  1.  **Can you do Brainstem Testing?** If the patient is not sedated/paralysed and meets pre-conditions, do this. If positive, they are dead (DBD). Stop here.
  2.  **If Brainstem Testing is impossible:** You cannot declare circulatory death while the pump is running.
  3.  **Action:** You must withdraw ECMO support.
  4.  **Risk:** If you withdraw ECMO, the patient may arrest immediately, or may survive for hours with poor perfusion.
  5.  **The Registrar's Call:** If you cannot verify that cerebral perfusion has ceased, you cannot confirm death. If the ECMO flow is non-pulsatile, you cannot feel a pulse even if the brain is perfused.
      *   **Rule:** Do not declare circulatory death based on pulse absence alone while on mechanical circulatory support. You must rely on Brainstem Death testing. If that is not possible, **you cannot proceed with DCD.**
      *   **Why:** The risk of declaring a perfused brain dead is non-zero. The procedure fails here. Abort donation.

  #### Case B: Normothermic Regional Perfusion (NRP)
  **Scenario:** Patient arrested, 5 mins standoff, death confirmed. Retrieval team wants to cannulate and run warm oxygenated blood to the abdomen (kidneys/liver) but clamp the vessels to the head.
  **The Objection:** "You are restarting circulation. Doesn't that mean they aren't dead? Does the machine kill them by excluding the brain?"
  **Procedure Application:**
  1.  **Timing:** Death is certified at T+5 mins asystole. NRP starts *after* certification.
  2.  **The Ethics:** The law defines death as the irreversible/permanent loss of capacity for consciousness and circulation. Once certified, the patient is a corpse. Cannulating a corpse does not make it alive.
  3.  **The Clamp:** The surgical clamp on the aortic arch is the physical guarantee that the brain is not reperfused.
  4.  **What to tell the Family/Staff:** "The patient died when their heart stopped and did not restart for five minutes. The machine is used to preserve the organs for transplant, like a ventilator preserves organs in a brain-dead donor. It does not restore life to the person because the blood is physically prevented from reaching the brain."
  5.  **The Registrar's Check:** Verify the clamp strategy is in place *before* you sign the death certificate. If the retrieval team cannot guarantee cerebral exclusion, **do not certify.** You are relying on their surgical integrity to maintain the condition of death.

  #### Case C: The Accusation of Conflict
  **Scenario:** Family says, "You're only calling him dead because you want his organs."
  **The Problem:** Trust is broken. The "Permanent vs. Irreversible" distinction looks like semantic trickery to them.
  **Procedure Application:**
  1.  **Do not argue physiology.** Do not talk about 5 minutes vs. 10 minutes.
  2.  **Script:** "I understand why it looks that way. But the decision to stop treatment was made yesterday by the ICU team because the treatment was no longer working. That decision stands even if we do not donate a single organ. We are waiting five minutes after the heart stops to be absolutely sure it will not start again on its own. We will not try to restart it because that would not be in [Name]'s best interests. The donation happens only after we have confirmed death."
  3.  **The Stop:** If the family remains unconvinced and distressed, and you feel the moral legitimacy is compromised, **you have the authority to abort.** Organs are not worth the moral injury to your team or the family. The procedure allows you to stop at any point before cannulation.

  #### Case D: The Two Beds (DBD vs. DCD)
  **Scenario:** Bed 1 is Brainstem Dead (heart beating). Bed 2 is Circulatory Dead (heart stopped 5 mins).
  **The Problem:** We call them both dead, but for different reasons. Bed 1 looks alive (warm, pink). Bed 2 looks dead (cold, grey).
  **Procedure Application:**
  1.  **Acknowledge the Inconsistency:** Do not try to explain this away to your registrars. It is a legal convention, not a biological unity.
  2.  **The Law:** The law accepts two criteria for death. Neurological (Bed 1) and Circulatory (Bed 2).
  3.  **The Registrar's Duty:** Apply the correct criteria to the correct patient. Do not cross-contaminate.
      *   For Bed 1: You need two doctors, specific tests, no sedation.
      *   For Bed 2: You need 5 minutes asystole, DNACPR.
  4.  **The Ethical Cost:** Accept that Bed 1 is technically "dead" while the heart beats. Accept that Bed 2 is "alive" at the cellular level for some minutes after arrest. We draw the line where the law says so.
      *   **Instruction:** Do not let the physiological difference in Bed 1 undermine your confidence in certifying Bed 2. They are different pathways to the same legal status.

  ---

  ### PART 3: THE UNCOMFORTABLE ANSWERS

  You asked for the places where this procedure might fail you, or where the law and ethics diverge. Here they are.

  **1. The Contingency of Death (The "Permanent" Trap)**
  In DCD, the patient is not dead because the heart *cannot* restart (irreversible). They are dead because we have decided *not* to make it restart (permanent).
  *   **The Risk:** If you certify death at T+5 mins, and then immediately the retrieval team says "Actually, we can't use the organs," could you theoretically CPR the patient?
  *   **The Answer:** No. Once death is certified, you cannot treat the patient. Legally, they are a corpse.
  *   **The Uncomfortable Truth:** This means the status of "dead" is contingent on the intention of the medical team. If we had a different policy on resuscitation, the moment of death would move. This is philosophically unstable, but it is the current legal framework.
  *   **Your Protection:** Ensure the DNACPR is robust and independent. If the DNACPR is shaky, the death certification is shaky. If the DNACPR is solid, the "permanence" holds.

  **2. NRP and the Definition of Irreversibility**
  In Case B (NRP), we restore circulation to the abdominal organs.
  *   **The Risk:** If circulation is restored, is the cessation of circulation truly "irreversible"?
  *   **The Answer:** No. It is reversible. We are reversing it.
  *   **The Convention:** We rely on the legal definition that death is confirmed *before* NRP starts. NRP is post-mortem treatment.
  *   **The Uncomfortable Truth:** We are relying on the aortic clamp not failing. If the clamp fails and the brain is reperfused, we have potentially treated a certified dead patient as living, or worse, restored consciousness to a certified dead patient.
  *   **Your Protection:** You must trust the retrieval surgeon's clamp. If you do not trust them, do not allow NRP. There is no physiological monitor for "brain exclusion" during NRP. It is a convention of surgical integrity.

  **3. The 5-Minute Rule**
  *   **The Risk:** 5 minutes is arbitrary. It is not based on definitive data that *no* autoresuscitation occurs after 4 minutes 59 seconds.
  *   **The Convention:** It is the Academy of Medical Royal Colleges standard.
  *   **Your Protection:** Follow the Code of Practice. If you deviate (e.g., wait 10 minutes), you are practising outside guidance. If you wait less, you are negligent. Stick to 5.

  ---

  ### PART 4: WHAT THIS PROCEDURE CANNOT SETTLE

  There are questions this checklist cannot answer. If these arise, you must wake me. If I am unreachable, you must default to *not* donating.

  1.  **Futility vs. Best Interests:** If the family demands continuation of treatment that you deem futile, and they agree to donation only if you withdraw *now*, you are in a coercion trap. The procedure cannot solve this. This requires legal/ethics input.
  2.  **The "Grey Zone" Arrest:** If the patient arrests, you wait 4 minutes, there is a weak electrical rhythm but no pulse, then asystole at 6 minutes. Is the standoff valid?
      *   *Guidance:* The 5 minutes must be continuous absence of circulation. If there was perfusion (even poor) during the standoff, the clock is invalid. Abort.
  3.  **Paediatric Cases:** This procedure is for adults. Paediatric DCD has different standoff times and ethical weightings. Do not use this for children.

  ### FINAL INSTRUCTION TO REGISTRARS

  At 3 AM, you are the guardian of the dead donor rule.
  Your primary duty is to the patient in the bed, not the recipient on the list.
  If you sign the death certificate, you are stating a fact: *This person is dead.*
  If you have a doubt that this is a fact, and not just a convenience, **do not sign.**

  We would rather lose organs than lose our integrity.

  **[Your Name]**
  **Clinical Lead for Organ Donation**
  **[Trust Name]**
