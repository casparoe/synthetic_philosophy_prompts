prompt: |-
  I'm an intensive care consultant in a big NHS trust and I'm also the trust's clinical lead for organ donation, which in practice means that when a patient on one of our units looks like becoming a donor after their circulation stops, I'm the person the registrar phones at three in the morning. We do two or three of these a month. What's been bothering me is that none of the questions we actually get asked at that hour are the ones that turn up in the teaching: what people want to know, standing next to a body with the family in the room, is whether this patient is dead already or whether we're about to be the ones who make them dead by turning something off, and the guidance we've got doesn't really put that question on the page. So I'd like you to write me a decision procedure my registrars can actually run, in order, at night, with nobody more senior awake — the questions to ask, what counts as a sufficient answer to each, where it stops and says no, and where it hands the decision to a named person because the question is one of values and not of physiology. It has to be usable by someone who isn't a neurologist, in the time we've got, which is not much, and with alot riding on it.

  Some things I want it to take seriously rather than smooth over. First, a distinction our ethics lead keeps pushing and I've slowly come round to: in the commonest route to donation here we don't wait for the heart's stopping to be irreversible, we wait for it to be permanent — permanent meaning nobody is going to try to start it again — and that's a decision we make rather than a fact we observe, so I want the procedure to be honest about where inside it that decision sits and whose signature is on it. Second, three cases the standard guidance mumbles at. (a) A patient on an extracorporeal circuit, where the blood is oxygenated outside the body, so the usual bedside tests don't mean what they normally mean and it's genuinely unclear how much blood the brain is getting — I want to know what my registrar does with the brainstem examination here, and what she does when she can't do it properly. (b) Withdrawal of treatment in a patient we expect to arrest, followed by our five minutes of asystole (tell me if five is the wrong number and what it should be), after which the retrieval team wants to put the donor onto a circuit that pushes warm oxygenated blood back into the abdominal organs with the vessels to the head clamped off so the brain isn't reperfused — they call it regional perfusion — and one member of our committee keeps saying, in a way I can't quite answer, that it's that circuit and not the withdrawal that actually ends the patient's life. (c) The family who say we're only calling him dead because we want his organs, which is the objection that actually shakes people, and a procedure that can't be said out loud in front of them is no use to me.

  Then run it on those three, plus a fourth: the patient who meets the brainstem criteria with the heart still going, in the next bed to one whose heart has stopped and who is being declared on circulatory grounds — and say plainly what the procedure does about the fact that we call these two patients dead at different moments and for different reasons. Include at least one case where your procedure gives an answer I won't like; I'd much rather find that out now then in a coroner's court. And say what the procedure can't settle at all, and where the honest answer is that we're running on convention. British English throughout, please, and don't tidy up the places where the law and the ethics come apart.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User:** Intensive Care Consultant & Clinical Lead for Organ Donation (NHS Trust).
      *   **Context:** DCD (Donation after Circulatory Death) scenarios, often at night (3 AM), registrars acting alone. 2-3 cases/month.
      *   **Problem:** Standard teaching doesn't match bedside reality. Families and staff worry about *causing* death vs. *observing* death. Guidance is vague on the "permanent vs. irreversible" distinction and specific edge cases.
      *   **Task:** Write a practical decision procedure (algorithm/checklist) for registrars to run at night.
      *   **Key Requirements:**
          *   Honest about the "permanent vs. irreversible" distinction (who decides not to restart?).
          *   Address three specific edge cases: (a) ECMO/ECLS (unclear cerebral perfusion), (b) NRP (Normothermic Regional Perfusion) and the "cause of death" objection, (c) Family accusation of conflict of interest ("you want the organs").
          *   Add a fourth case: DBD (Donation after Brainstem Death) patient next to a DCD patient (different definitions of death).
          *   Include at least one uncomfortable answer (potential legal/ethical risk).
          *   Acknowledge where convention overrides logic/law.
          *   British English.
          *   Do not smooth over law/ethics gaps.

  2.  **Deconstruct the Ethical & Legal Landscape (UK Context):**

      *   **DCD (Maastricht Category III):** Treatment withdrawal -> Circulatory arrest -> Standoff period (usually 5 mins) -> Confirmation of death -> Organ retrieval.
      *   **DBD:** Brainstem death testing -> Death certified -> Heart stopped later (usually).
      *   **Code of Practice (Academy of Medical Royal Colleges):** The bible for UK death confirmation.
      *   **Permanent vs. Irreversible:** This is the crux. "Irreversible" means it *cannot* restart. "Permanent" means it *will not* restart (because we won't try). In DCD, we rely on *permanent*. The decision *not* to attempt resuscitation (DNACPR) must be made *before* withdrawal, independent of donation.
      *   **NRP (Normothermic Regional Perfusion):** Restores circulation to abdomen/thorax but excludes brain. Ethical worry: Does this reverse death? Legal view: Death is certified *before* NRP starts based on circulatory criteria. NRP is post-mortem treatment.
      *   **ECMO/ECLS:** If the machine is oxygenating blood, absence of pulse doesn't mean absence of cerebral perfusion. Brainstem testing might be impossible if sedated/paralysed or if flow is non-pulsatile.
      *   **Family Objections:** Transparency is key. The "dead donor rule" must be upheld.

  3.  **Drafting the Procedure (The "Night Shift Algorithm"):**

      *   *Tone:* Clinical, direct, authoritative but honest. No fluff.
      *   *Structure:* Pre-conditions -> The Withdrawal Decision -> The Standoff -> Confirmation -> The "Hard Questions".
      *   *Key Feature:* Explicitly marking the "Decision Point" where the doctor decides *not* to restart (Permanent vs. Irreversible).

  4.  **Addressing the Specific Cases:**

      *   *(a) ECMO/ECLS:* If on VA-ECMO, the heart might be stopped but the brain is perfused. You cannot declare circulatory death while on full support. You must withdraw support first. If on VV-ECMO, heart pumps, but oxygenation is external. Brainstem testing is the gold standard, but if impossible, circulatory criteria apply *after* withdrawal. *Crucial:* If you can't verify no cerebral flow, you can't declare death circulatory-wise safely without risking awareness.
      *   *(b) NRP:* The objection is that NRP restores life. The counter-argument is that death is certified *before* cannulation. The procedure must state clearly: Death is certified at T+5 mins asystole. NRP is a post-mortem intervention. The "cause of death" remains the underlying injury + withdrawal of life-sustaining treatment (WLST), not the NRP.
      *   *(c) Family Accusation:* Script needed. "The decision to stop treatment was made because treatment was futile, before donation was discussed. We wait 5 minutes to ensure the heart does not restart spontaneously. We do not restart it because it is not in your loved one's best interests."
      *   *(d) DBD vs. DCD next door:* Acknowledge the inconsistency. One is neurological, one is circulatory. Both are legal definitions of death. The procedure shouldn't try to harmonize them philosophically, just legally.

  5.  **Identifying the "Uncomfortable Answer":**

      *   *Candidate:* The NRP case. If NRP restores cellular function to organs, have we truly confirmed irreversible cessation? The law says yes (circulatory cessation for 5 mins), but biology says cellular metabolism restarts.
      *   *Better Candidate:* The ECMO case. If a patient is on ECMO and we withdraw, and they don't arrest immediately, but we declare death after 5 mins of no pulse while the machine is still technically capable of perfusing... wait, no.
      *   *Best Candidate:* The "Permanent" decision. The procedure must admit that *we* make the heart stop being permanent by deciding not to CPR. If we changed our mind, they aren't dead yet. This is the "Uncomfortable Truth": Death in DCD is contingent on the doctor's intention not to resuscitate. If the registrar is unsure about the DNACPR validity, they must stop.
      *   *Alternative Uncomfortable Truth:* In NRP, if the clamp fails and blood goes to the brain, the patient might regain consciousness (theoretically). The procedure must acknowledge that NRP relies on surgical integrity to maintain the "dead" status of the brain.

  6.  **Refining the Procedure (Iterative Process):**

      *   *Step 1: Pre-conditions.* Is there a valid DNACPR? Was donation discussed *after* the decision to withdraw? (Crucial for conflict of interest).
      *   *Step 2: Withdrawal.* Who does it? (Independent of transplant team).
      *   *Step 3: The Standoff.* 5 minutes is the UK standard (Academy of Medical Royal Colleges). Do not change this.
      *   *Step 4: Confirmation.* Absence of pulse, heart sounds, respiratory effort.
      *   *Step 5: The "Hard Stop".* If any doubt, abort.

  7.  **Addressing the "Law vs. Ethics" Gap:**

      *   The law defines death. Ethics defines *when* it is right to treat someone as dead. In DCD, they overlap but the "permanent" definition is a legal fiction based on clinical policy. I need to state that plainly.

  8.  **Drafting the Content (incorporating British English & NHS specific terms):**

      *   Use "Resuscitation Council (UK)", "Academy of Medical Royal Colleges", "DNACPR", "WLST" (Withdrawal of Life-Sustaining Treatment).
      *   Ensure the tone is respectful but firm.
      *   Make sure the "Night Registrar" knows exactly where the buck stops.

  9.  **Review against Constraints:**

      *   *Usable at 3 AM?* Yes, needs to be checklist style.
      *   *Honest about Permanent vs. Irreversible?* Yes, will highlight the DNACPR decision point.
      *   *Address 4 cases?* Yes.
      *   *Uncomfortable answer?* Yes, regarding the contingency of death on the decision not to resuscitate.
      *   *Acknowledge convention?* Yes, specifically on the 5-minute rule and the DBD/DCD dichotomy.

  10. **Final Polish:** Check for empathy. The user is worried about the moral burden on their registrars. The procedure should protect them but not lie to them. (Self-Correction: Make sure the NRP explanation doesn't sound like gaslighting. Acknowledge the philosophical tension.)

  **(Self-Correction during drafting):** I initially thought about suggesting 2 minutes for standoff. No, UK Code of Practice is 5 minutes for DCD. Stick to 5.
  Regarding ECMO: If a patient is on VA-ECMO, they are effectively bypassing the heart. You cannot declare circulatory death while the pump is running. You must withdraw ECMO. If the heart doesn't start, *then* you wait 5 mins. The tricky part is if the heart is beating but brain is dead (DBD) vs heart stopped on ECMO. I need to be precise: Circulatory death cannot be declared while mechanical circulatory support is maintaining perfusion.
  Regarding the "Uncomfortable Answer": I will focus on the NRP scenario. If NRP restores perfusion, the "irreversibility" is technically violated, but legally bypassed by the "permanent" definition. This is the crack in the foundation.

  11. **Final Structure:**
      *   Introduction (Setting the frame).
      *   The Procedure (The Checklist).
      *   The Four Cases (Application).
      *   The Uncomfortable Truth (The "Permanent" contingency).
      *   The Conventions (Where we just agree to agree).

