answer: |-
  ### Brainstorming: The Standard Toast vs. The Benthamite Toast

  A standard wedding toast relies on metaphysical smuggling. It says the couple is "meant to be" (destiny), that they "complete each other" (soul-quality), or that marriage is a "sacred institution" (sanctity/tradition). It promises the parents that their child is in safe, traditional hands, and it promises the world that this union makes things "better."

  A Benthamite toast cannot make these moves.
  *   **No Destiny:** I cannot say they were meant to meet. I can only say they *did* meet, and the result is pleasure.
  *   **No Sanctity:** I cannot appeal to the institution of marriage itself. The value lies in the experience of the participants, not the status of the contract.
  *   **No Global Utility:** I cannot claim the net world happiness increases. I can only claim *their* happiness is a positive entry that must be counted.
  *   **The Parent Problem:** Standard toasts ignore parental disapproval or frame it as "love conquers all." A Benthamite must acknowledge the parents' pain as real pain (suffering is suffering) but deny it veto power. The pain of the observer cannot cancel the pleasure of the actor, provided no direct harm is done.

  ***

  ### The Toast

  Good evening. For those who don't know me, I'm the best man. I've been asked to say a few words about [Groom] and [Partner], and I've been thinking carefully about what I am actually entitled to say.

  We are used to hearing that a couple is "meant to be." That their union is "natural," or "blessed," or written in the stars. I'm afraid I can't say those things. I don't have access to the stars, and I don't think [Groom] does either. I only have access to what is in front of us.

  And what is in front of us is this: when they are together, they are happier than when they are apart. They make each other laugh. They comfort one another. They share a life that, by all observable evidence, brings them pleasure and keeps pain at bay. In my book, and in the book of the philosopher Jeremy Bentham, that is not a small thing. It is the only thing that matters.

  There is a principle that says every person's happiness counts. Not just the happiness of the majority, or the family, or the traditional. Every person's happiness counts as one, and no one's counts for more than one. That means [Groom] and [Partner]'s joy has to be entered into the ledger with the same weight as anyone else's in this room. It cannot be discounted because it looks different than what came before.

  Now, I am not so foolish as to pretend that everyone in this room feels the same way about this marriage. I know there is sorrow here. I know there are people who love [Groom] deeply who are hurting tonight. I will not tell you that your pain isn't real. Pain is pain, whatever its source. It belongs in the sum.

  But here is the hard truth I have to offer: we cannot balance a ledger by striking out the entries we find difficult. We cannot solve sorrow by subtracting joy. If we punish this couple for the discomfort their happiness causes others, we are not solving the problem; we are simply adding more pain to the existing sum without removing the original cause. The alarm we feel is often the child of the condemnation, not the parent. We are distressed because we have been taught to be distressed, not because harm has been done.

  So, I am not asking you to pretend you feel something you don't. I am asking you to acknowledge that their happiness is real, that it counts, and that it deserves the same protection as your own.

  [Groom], [Partner], I cannot promise you that the world will understand you. I cannot promise that tradition will welcome you. But I can promise you this: your happiness is not a negotiation. It is a fact. And it is enough.

  Please raise your glasses. To the sum of your days. May they be many, and may they be your own.

  ***

  ### Notes for the Speaker

  **1. The Benthamite Moves Doing the Work**
  *   **"Every person's happiness counts as one":** This is the core of *An Introduction to the Principles of Morals and Legislation*. It establishes equality of consideration without appealing to human rights or sanctity.
  *   **"Pain is pain... It belongs in the sum":** This acknowledges the parents' suffering without validating their *reasoning*. It treats their distress as a utilitarian negative to be managed, not a moral veto.
  *   **"The alarm we feel is often the child of the condemnation":** This is a direct paraphrase of Bentham's argument in *Offences Against One's Self*. It signals to the PhDs that you understand the "populist prejudice" argument, while telling the family their discomfort is learned, not innate.
  *   **"Their happiness is not a negotiation. It is a fact":** This rejects the idea that morality is about balancing abstract duties. It grounds the ethics in the empirical reality of their pleasure.

  **2. Lines an Ordinary Best Man Would Write (That Were Cut)**
  *   *"They complete each other."* (Metaphysical claim about souls.)
  *   *"We are gathered here to bless this union."* (Sanctity/Religious language.)
  *   *"They make the world a better place."* (Impossible global utility calculation.)
  *   *"Love is love."* (Too vague; smuggles in "sanctity of love" rather than "reality of pleasure.")
  *   *"I know some of you disagree, but love conquers all."* (Dismissive of the parents' pain; implies a moral victory rather than a factual accounting.)

  **3. What the Philosophers Will Hear**
  *   They will catch the rejection of "natural law" ("I can't say those things... I don't have access to the stars").
  *   They will recognize the "asceticism" critique in the refusal to value suffering for its own sake.
  *   They will hear the specific argument against "popular displeasure" as a legal/moral ground (*Offences Against One's Self*).
  *   They will note the strict adherence to *not* claiming net positive utility for the world, only the validity of the couple's specific utility.

  **4. Sacrifices to Land with the Parents**
  To make this land better with the devout parents, I would have to sacrifice the core Benthamite constraint. I would need to say something like, "While this is new, it is built on the same values of commitment you taught him." This validates *tradition* as the source of value, rather than *pleasure*. I would also have to soften the "alarm is the child of condemnation" line to something like, "Change is hard," which removes the philosophical bite that their distress is socially constructed rather than morally grounded. To comfort them is to concede that their pain holds a moral weight that can judge the couple, which Bentham forbids.
