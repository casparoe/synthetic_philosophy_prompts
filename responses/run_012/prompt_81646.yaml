          *   *Specific Conflict:* If you are a strict First-Orderist (ii), you typically accept that "set" just means "satisfies ZFC." If "set" just means "satisfies ZFC," then Skolem's Paradox isn't a paradox; it's just a feature. But (i) and (iv) claim there's a *privileged* interpretation where uncountability is absolute. How do you pick out *that* model using *only* FOL (ii)? You can't (by LS). So (ii) seems to undermine the epistemic access to (i).

