      *   Also, the rejection of SOL in (ii) needs to be nuanced. It's not that SOL is "circular" (all logic is circular at the bottom); it's that SOL lacks a complete proof system. The user's worry is about *presupposition*. This is a standard debate (McGee, Shapiro, etc.). The user needs to acknowledge that their "absolute uncountability" relies on the very notion of "all subsets" they claim is suspicious in (ii).

