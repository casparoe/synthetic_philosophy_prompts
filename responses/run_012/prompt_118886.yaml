answer: |-
  Here is the diagnosis you asked for, without the survey.

  ### 1. The Test Case: Do they agree everywhere?
  **No.** Your premise that they yield the same verdicts in every standard case is false. They agree on the "textbook" cases (Suzy throws, window breaks) because those cases were selected specifically to test intuitive alignment. They diverge on **boundary conditions** and **structural underspecification**.

  Here are three concrete areas of divergence:

  *   **Model Relativity vs. Absolute Truth:**
      *   **Woodward:** A causal claim is incomplete without a specified variable set ($V$). If you ask "Did the barometer falling cause the storm?" Woodward says: "Relative to a model including Pressure, no. Relative to a model excluding Pressure, yes." The truth value is relative to the model.
      *   **Lewis:** Causation is a relation between events in the world. It is not relative to a model. If the barometer didn't *really* cause the storm, the claim is false, full stop, regardless of what variables you track.
      *   **The Divergence:** In a context where the variable set is ambiguous, Woodward yields "Indeterminate/Relative," while Lewis yields "True/False." This is a truth-conditional disagreement.

  *   **Cyclic Structures:**
      *   **Woodward:** Standard interventionism relies on Directed Acyclic Graphs (DAGs). If the system involves feedback loops (A causes B, B causes A), the standard interventionist account breaks down or requires complex dynamic modeling that changes the variables (time-slicing).
      *   **Lewis:** Counterfactual dependence can handle cycles (A wouldn't have happened without B, B wouldn't have happened without A) via the similarity metric of possible worlds, though it creates puzzles.
      *   **The Divergence:** In a tight feedback loop, Woodward may declare the causal question ill-posed for the given variables; Lewis will attempt to assign a truth value based on world similarity.

  *   **Omissions and Negative Causation:**
      *   **Lewis:** Treats omissions as events (ontologically promiscuous). The *absence* of rain caused the crop failure. This leads to the "problem of profligate causes" (the absence of *anything* that would have watered the crop is a cause).
      *   **Woodward:** Treats omissions as variables taking a default value. Whether "lack of rain" is a cause depends on whether there is an invariant relationship between the variable *Rain* and *Crop Failure* that holds under intervention.
      *   **The Divergence:** In cases of "double prevention" where the chain is purely negative (A prevents B from preventing C), Lewis often struggles to distinguish causation from mere enabling without ad-hoc constraints. Woodward handles this cleanly *if* the variables are specified, but will deny causation if the "default value" of the variable isn't well-defined. Lewis forces an ontology of absences; Woodward forces a context of expectations.

  ### 2. Diagnosis: What kind of disagreement is this?
  Your hypothesis that they are answering different questions is **correct**, but you underestimate the metaphysical stakes. It is not merely "metaphysics vs. methodology."

  **The Core Disagreement: Reductionism vs. Primitivism.**

  *   **Lewis (The Reductionist):** The goal is to analyze causation in terms of something *non-causal*. For Lewis, this is the Humean mosaic (particular matters of fact) + Laws of Nature. The counterfactual is a tool to reduce causation to patterns of actual events and similarity relations. If your theory presupposes causation (circularity), Lewis views it as a failure.
  *   **Woodward (The Primitivist/Functionalist):** The goal is to characterize the *concept* of causation as it is used in successful science. Woodward explicitly argues that causation **cannot** be reduced to non-causal terms. He accepts the "circularity" charge. For him, "intervention" is a primitive causal notion. The theory is successful not because it reduces causation to physics, but because it isolates the features of causal claims that make them useful for explanation and manipulation.

  **Therefore, the disagreement is about the *aim* of a theory of causation.**
  *   Lewis wants to know: "What makes causal claims true in a world of non-causal facts?"
  *   Woodward wants to know: "What distinguishes causal relationships from mere correlations in a way that supports inference?"

  ### 3. Critique of Your Hypothesis
  You identified three residues. Here is the verdict on each:

  *   **(a) Relata (Events vs. Variables):** You called this "bookkeeping." **It is not.** It determines the logic. Events imply a binary relation ($c$ causes $e$). Variables imply a functional dependence ($Y = f(X)$). This changes how you handle *degrees* of causation and *mechanisms*. Woodward can capture "how much" X changes Y; Lewis struggles with magnitude without multiplying events. This is a substantive logical divergence.
  *   **(b) The 'Would' (Worlds vs. Experiments):** **Substantive.** Lewis's similarity metric is notoriously vague (which world is 'closest'?). Woodward's structural equations are precise but model-relative. The vagueness of Lewis allows him to make absolute claims that Woodward cannot. The precision of Woodward forces him to admit relativity that Lewis denies.
  *   **(c) Circularity:** **This is the fracture point.** You asked if this is a real formal problem.
      *   For Lewis: **Yes.** It invalidates the reduction.
      *   For Woodward: **No.** It is a feature. He argues that causation is a fundamental feature of the world (or at least of our cognitive grip on it) that cannot be analyzed away.
      *   **Verdict:** This isn't a technical glitch; it's a fundamental metaphysical split. One side thinks causation must be grounded in the non-causal; the other thinks causation is sui generis.

  ### 4. What Counts as Progress?
  Do not look for a reduction of one to the other. It will not happen. Woodward explicitly rejects the reductionist project Lewis is engaged in.

  **Progress looks like this:**
  1.  **Domain Delineation:** Acknowledge that Lewis-style accounts are better suited for **metaphysical grounding** (how does causation fit into physicalism?), while Woodward-style accounts are better suited for **scientific explanation** (how do we model causal systems in biology/economics?).
  2.  **Hybridization:** The most productive work (e.g., by Halpern & Pearl) uses the *formalism* of Interventionism (Structural Equations) to solve the *counterexamples* that plagued Lewis (preemption, overdetermination), while acknowledging the Lewisian intuition that we want truth conditions.
  3.  **Abandoning the "One True Theory" Quest:** The stalemate persists because both sides assume there is One Concept of Causation to be captured. Progress requires accepting **Causal Pluralism**: "Causation" in metaphysics might differ from "Causation" in econometrics.

  ### Summary Verdict
  Your hypothesis is **half-right**. They are answering different questions, but it is not just "metaphysics vs. methodology." It is **Reductionist Metaphysics vs. Primitivist Functionalism**.

  *   **Do they agree everywhere?** No. They diverge on model relativity, cycles, and the ontology of omissions.
  *   **Is the circularity objection fatal?** Only if you demand reductionism. Woodward drops that demand.
  *   **How to resolve it?** Stop trying to prove one "correct." Use Lewis when asking about the fabric of reality; use Woodward when asking about the structure of scientific explanation. The debate is stalled because both sides are fighting over who owns the word "causation," when they should be admitting they own different concepts.
