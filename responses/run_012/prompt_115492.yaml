prompt: |-
  I'm preparing a methodology seminar on the use of intuitions as evidence in philosophy, and I want the specification in hand before we start judging particular views. Please write the desiderata that any adequate theory of intuition-as-evidence has to meet, taking the theory's job to be vindicating intuitions about what is possible, necessary, or conceptually required rather than intuitions about how people happen to speak. Include the cases it must get right (a Gettier-style judgment that most philosophers treat as correct; a judgment that shifts with culture, class, or the order in which cases are presented; an expert judgment that conflicts with a novice's; a judgment that an entire community later abandons), the distinctions it must not collapse (between intuition and belief, between the content of an intuition and the reliability of the faculty that produced it, between explaining an intuition and explaining it away), and the empirical findings it cannot contradict, including the contested body of results suggesting that intuitions vary across cultures and socioeconomic groups and that framing, order, and expertise affect some judgments and not others. Give the case or consideration behind each requirement, say which requirements are genuine and which are prejudices of one camp (for instance, whether the demand that the theory show intuition to be reliable is a requirement or an optional extra), and tell me which single requirement does the most to eliminate the going theories. Most of all, flag any subset of the requirements you suspect cannot be jointly satisfied; that is the result I am after. No formatting: continuous prose, no headings, bullet points, bold text, or tables.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Topic:** Methodology seminar on the use of intuitions as evidence in philosophy.
      *   **Task:** Write the desiderata that any adequate theory of intuition-as-evidence has to meet.
      *   **Scope:** Vindicating intuitions about modality (possibility, necessity) or conceptual requirements, *not* linguistic usage.
      *   **Specific Requirements to Include:**
          *   Cases it must get right (Gettier-style correct judgment; variable judgment based on culture/class/order; expert vs. novice conflict; abandoned community judgment).
          *   Distinctions it must not collapse (intuition vs. belief; content vs. reliability; explaining vs. explaining away).
          *   Empirical findings it cannot contradict (experimental philosophy results on variation, framing, order, expertise).
          *   Analysis of requirements: Case/consideration behind each; genuine vs. prejudice (e.g., reliability demand); which single requirement eliminates the most theories.
          *   **Crucial Goal:** Flag any subset of requirements suspected to be jointly unsatisfiable (the "result I am after").
      *   **Format:** Continuous prose, no headings, bullet points, bold text, or tables.

  2.  **Deconstruct the Content:**
      *   I need to synthesize a list of desiderata based on the prompt's instructions.
      *   I need to evaluate these desiderata (genuine vs. prejudice).
      *   I need to identify the "killer" requirement.
      *   I need to identify the inconsistency/trilemma among the requirements.
      *   I need to write this as a single block of text without formatting markers.

  3.  **Drafting - Section by Section (Mental Outline):**
      *   *Introduction:* Set the stage for the theory of intuition-as-evidence.
      *   *Case Requirements:* Gettier (stable), Cultural/Order variation (unstable), Expert vs. Novice, Abandoned judgments.
      *   *Distinction Requirements:* Intuition vs. Belief, Content vs. Reliability, Explaining vs. Explaining Away.
      *   *Empirical Requirements:* X-Phi findings (variation, framing, etc.).
      *   *Evaluation:* Which are genuine? Is reliability a demand or optional?
      *   *The "Killer":* Which requirement kills most theories?
      *   *The Inconsistency:* The core conflict (likely between universality/stability and empirical variation).

  4.  **Refining the Content (incorporating specific constraints):**
      *   *Constraint:* No formatting (no bold, no bullets, no headings).
      *   *Constraint:* Continuous prose.
      *   *Constraint:* Address the "prejudice" aspect (e.g., is reliability a requirement?).
      *   *Constraint:* Identify the jointly unsatisfiable subset.

  5.  **Drafting the Text (Iterative Process):**

      *   *Start:* To construct an adequate theory of intuition-as-evidence regarding modal or conceptual truths, one must first establish a set of desiderata that balance normative aspirations with descriptive accuracy.
      *   *Cases:* The theory must accommodate the Gettier-style judgment where most philosophers agree a justified true belief without causation or reliability is not knowledge, treating this as a correct fixation of the concept. Conversely, it must account for judgments that shift with culture, class, or presentation order, acknowledging these variations without dismissing them outright. It must handle conflicts between expert and novice intuitions, typically privileging the expert without rendering the novice's data irrelevant, and it must explain judgments that an entire community later abandons, such as certain pre-theoretical modal claims refuted by scientific advancement, without invalidating the method itself.
      *   *Distinctions:* The theory must not collapse the distinction between intuition and belief, preserving the idea that one can intuit p without believing p, nor collapse the content of an intuition with the reliability of the faculty producing it, allowing for the possibility of clear but false intuitions. Crucially, it must maintain the difference between explaining an intuition and explaining it away, ensuring that causal genealogies do not automatically undermine evidential weight.
      *   *Empirical:* It cannot contradict empirical findings from experimental philosophy, specifically the contested but persistent results suggesting intuitions vary across cultures and socioeconomic groups and that framing and order affect some judgments while expertise affects others.
      *   *Evaluation:* Now, regarding the status of these requirements, the demand that the theory show intuition to be reliable is often treated as a genuine requirement by proponents but is arguably a prejudice of the vindicationist camp, whereas skeptics view reliability as something to be proven rather than assumed. The requirement to accommodate cultural variation without losing normative force is likely the single requirement that does the most to eliminate going theories, as traditional armchair methods assume universality.
      *   *The Inconsistency:* However, the most critical outcome of this specification is the suspicion that a subset of these requirements cannot be jointly satisfied. Specifically, the requirement to treat Gettier-style judgments as correct fixations of conceptual truth, the requirement to accept empirical findings of significant cultural and socioeconomic variation in those very judgments, and the requirement to maintain that intuitions provide evidence for necessary or conceptual truths rather than contingent linguistic habits form an inconsistent triad. If intuitions vary culturally, they struggle to track necessary truths; if they track necessary truths, they should not vary culturally; if they vary but still track truth, the theory must explain why variation doesn't imply error, which undermines the Gettier fixation requirement. This tension suggests that no single theory can vindicate intuitions as evidence for necessity while fully accepting the empirical data on variation without collapsing the distinction between conceptual truth and psychological contingency.

