answer: |-
  Bottom line
  Your friend is confusing a rule for managing ignorance with a law of nature, which is a classic category error. The principle he's quoting is valid for setting initial assumptions in logic puzzles, but it collapses when applied to real-world frequencies where base rates matter. Basically, he's using a mathematical heuristic to override actual statistics.

  The readings
  1. **The Epistemic Prior Claim:** This reading treats the statement as a rule for setting starting probabilities when you possess literally zero information. It argues that before you look at any data, you should distribute your credence evenly across mutually exclusive outcomes to avoid bias, serving as a neutral baseline for Bayesian updating.
  2. **The Physical Symmetry Claim:** This reading asserts that the world itself is structured like a fair coin, where mechanisms exist to ensure outcomes are genuinely equiprobable. It relies on physical properties (like balance or randomness) rather than just human ignorance, implying the universe forces a 50/50 split when no force intervenes.
  3. **The Propositional Negation Claim:** This reading assumes that any proposition and its negation (e.g., "cancer" vs. "no cancer") constitute two symmetric options worthy of equal weight. It ignores that "no cancer" covers a vast range of healthy states while "cancer" is a specific deviation, treating logical binary opposites as statistical equivalents.
  4. **The Closed World Claim:** This reading assumes the only options that exist are the ones currently being discussed, ignoring the rest of the sample space. This is where Bertrand's paradox bites: if you compare "doctor vs. lawyer," the odds differ from "doctor vs. not doctor," proving the rule is unstable without strict parameters on how you carve up reality.

  Verdicts
  1. Plausible in abstract logic, trivial for real-world stats, does not back him up.
  2. Plausible for dice, false for biology, does not back him up.
  3. Logically invalid, non-trivial error, licenses his biopsy claim but is wrong.
  4. Logically invalid, non-trivial error, licenses his profession claim but is wrong.

  What he probably means
  He's using pseudo-intellectual shorthand to shut down debate rather than engage with actual probabilities. He's confusing *epistemic uncertainty* (what you know) with *ontological probability* (how the world works), treating his own ignorance as if it forces the universe to split the difference. It's a conversational trump card that sounds mathematical but is actually just intellectual laziness.
