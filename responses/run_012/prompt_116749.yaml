answer: |-
  This is a sophisticated pivot. Moving from chronology to conceptual machinery shifts your project from historical fiction to philosophical drama, which is where the enduring tension lies. The Newton-Leibniz and Darwin-Wallace cases are indeed less about dates and more about the ontology of ideas.

  Here is your research agenda, ranked by narrative leverage and logical dependency. I have applied three criteria to this ordering:
  1.  **Upstream Dependency:** Which questions must be settled to make the others intelligible?
  2.  **Character Leverage:** Which question, if answered differently, most drastically alters the characters' psychology and actions?
  3.  **Tractability:** Which questions can be resolved through argument and close analysis (suitable for a novelist working offline) versus those requiring empirical sociology you cannot settle?

  ### The Ranked Agenda

  **1. The Identity Question (Your Q2)**
  *Are the formulations genuinely equivalent, or does treating them as "the same discovery" beg the question?*
  **2. The Inevitability Thesis (Your Q1)**
  *Was the discovery bound to happen, and does simultaneity undercut the "lone genius"?*
  **3. The Normative Question (Your Q3)**
  *Why do we care who was first? Is priority epistemic, moral, or institutional?*
  **4. Reception and Neglect (Your Q4)**
  *The afterlife of an idea that has to be made twice, and discoveries made and ignored.*
  **5. The Counterfactual-Credit Problem (Your Q5)**
  *[MERGE WITH Q1 & Q3]*

  ---

  ### Defense of the Ordering

  #### 1. The Identity Question (Priority: Critical / Upstream)
  This is your ontological foundation. You cannot stage a dispute about *who* owns an idea until you define *what* the idea is.
  *   **Dependency:** If the ideas are not actually identical (e.g., Wallace lacked Darwin's mechanism of natural selection, or Leibniz's notation offered capabilities Newton's did not), the priority dispute is a category error. If they *are* identical, the dispute is existential.
  *   **Character Leverage:** This determines the nature of the conflict. If the ideas are different, the conflict is based on misunderstanding or insecurity (a comedy of errors or a tragedy of ego). If the ideas are the same, the conflict is metaphysical (a tragedy of fate).
  *   **Tractability:** Highly tractable for a novelist. You do not need to solve the math or biology; you need to analyze how the characters *argue* about the sameness. Do they focus on notation? Application? Insight? This gives you dialogue and scene work immediately.
  *   **Why First:** If you research Inevitability (Q1) before Identity (Q2), you risk assuming the discovery is a singular "thing" that was bound to happen. You must first establish if it *is* a singular thing.

  #### 2. The Inevitability Thesis (Priority: High / Psychological Core)
  Once you know what the idea is, you must determine its relationship to time and human agency.
  *   **Dependency:** This relies on Q1 (Identity). You can't ask if "it" was inevitable if you haven't defined "it."
  *   **Character Leverage:** This dictates your characters' internal arcs. If the discovery is inevitable, your characters are vessels; their struggle is against their own replaceability. If it is contingent, their struggle is against chaos and obscurity. This is the source of their anxiety.
  *   **Tractability:** Tractable via argument. You can construct cases for both sides without needing definitive historical proof. The tension *between* the two views is where the story lives.
  *   **Why Second:** It sets the mood. Inevitability creates a claustrophobic, deterministic atmosphere. Contingency creates a high-stakes,冒险 (adventure) atmosphere. You need to know the mood before you determine the social stakes (Q3).

  #### 3. The Normative Question (Priority: Medium / Social Engine)
  This defines the external pressure.
  *   **Dependency:** Relies on Q1 and Q2. The rules of the game (priority) only matter if there is a game piece (Identity) and a reason to play (Inevitability/Scarcity).
  *   **Character Leverage:** This drives the plot. Characters fight because institutions (universities, journals, patrons) demand they fight. This question externalizes the internal conflict of Q1.
  *   **Tractability:** Tractable via institutional analysis. You can look at how letters, patents, or papers are timestamped and validated. This gives you procedural obstacles for your characters to navigate.
  *   **Why Third:** It is the consequence of the first two. If the idea is unique (Q2) and rare (Q1), then priority becomes a scarce resource (Q3).

  #### 4. Reception and Neglect (Priority: Low / Atmospheric)
  *   **Dependency:** This is the historical aftermath. It relies on the outcome of Q3.
  *   **Character Leverage:** Low for the protagonists (who are in the thick of the fight), but high for secondary characters or the "ghost" of the narrative (the fear of what happens if they lose).
  *   **Tractability:** Requires case studies (Mendel, Scheele, etc.). Good for world-building, less good for driving the central conflict.
  *   **Why Fourth:** It is the shadow cast by the other questions. It illustrates the stakes of Q3 but does not generate the conflict itself.

  #### 5. The Counterfactual-Credit Problem (Priority: Drop/Merge)
  *   **Recommendation:** **Drop this as a separate research vector.**
  *   **Reasoning:** This is not a research question; it is the *verdict*. Q5 is the philosophical conclusion your characters will argue *using* the evidence gathered in Q1, Q2, and Q3.
      *   If Q1 (Inevitability) is "Yes," then Q5 (Credit) is "None/Shared."
      *   If Q3 (Normative) is "Institutional," then Q5 (Credit) is "Procedural."
      *   Researching Q5 separately leads to abstract moralizing. Researching Q1 and Q3 gives you the concrete ammunition your characters need to fight about Q5.
  *   **Action:** Fold this into your character outlines. Character A believes Credit is tied to Labor (rejects Inevitability). Character B believes Credit is tied to Utility (accepts Inevitability). Do not research the answer; research the *conflict* between the answers.

  ---

  ### Dynamic Adjustments: What Moves Questions Up or Down?

  Your ranking should shift based on what you find during your year of research. Here are the triggers:

  **Move The Identity Question (Q2) Down if:**
  *   You find that in your specific field (e.g., a specific medical breakthrough or tech algorithm), the "sameness" is legally or professionally indisputable. If the world agrees they are the same, the characters cannot argue ontology; they must argue sociology. In that case, move **The Normative Question (Q3)** to #1. The drama becomes about the rules, not the idea.

  **Move The Inevitability Thesis (Q1) Up to #1 if:**
  *   You decide to write a "Zeitgeist" novel. If your theme is specifically about the spirit of the age rather than individual genius, Inevitability becomes the primary lens. Every scene should reinforce the sense that the idea was "in the air." This changes the book from a character study to a historical panorama.

  **Move Reception and Neglect (Q4) Up to #3 if:**
  *   You discover a specific historical case where the "loser" of a priority dispute was subsequently erased (not just beaten, but forgotten). If this horror story grips you, make it the central threat. The characters aren't fighting for glory; they are fighting against oblivion. This raises the stakes from ego to survival.

  ### How This Changes Your Draft

  By following this agenda, you avoid the "and then this happened" trap of historical chronology.

  1.  **Scene Construction:** Instead of scenes where characters check dates, you write scenes where they argue definitions (Q2). *"You didn't discover the thing, you just named it."* vs. *"Naming is the discovery."*
  2.  **Internal Monologue:** Instead of worrying about being beaten, characters worry about being redundant (Q1). *"If I hadn't done it, he would have. Does that make me nothing?"*
  3.  **Conflict:** The antagonist isn't the rival; it's the system that demands a single name on the paper (Q3). The rival is just another victim of the system.

  ### Summary of Instruction

  1.  **Spend months 1-4 on Identity (Q2).** Read the actual papers/notes of your historical analogues. Don't look for dates; look for differences in notation, framing, and assumption. Map the gap between "similar" and "same."
  2.  **Spend months 5-7 on Inevitability (Q1).** Read histories of science that focus on "multiple discovery" (Merton's work is the touchstone here, though you needn't cite it). Focus on the conditions that make a discovery ripe.
  3.  **Spend months 8-9 on Normative/Institutions (Q3).** Look at how credit was assigned in your chosen era. Was it a letter? A sealed envelope? A lecture? The mechanism of priority is a plot device.
  4.  **Discard Q5 as research.** Let it emerge as the thematic resolution.
  5.  **Use Q4 as texture.** Keep a file of "ghosts"—discoverers who were ignored—to haunt your protagonists.

  This agenda prioritizes the *conceptual machinery* you identified as the gripping element. It treats the priority dispute not as a race, but as a collision of ontologies.
