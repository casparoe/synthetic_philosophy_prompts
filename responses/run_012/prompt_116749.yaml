  4.  **Drafting the Ranking (Iterative Process):**

      *   *Attempt 1 (Logical Flow):* Identity -> Inevitability -> Credit -> Normative -> Reception. (Define the thing, decide if it was inevitable, decide who gets credit, decide if we should care, look at edge cases).
      *   *Attempt 2 (Narrative Impact):* Normative -> Identity -> Credit -> Inevitability -> Reception. (Start with *why* they fight, then *what* they fight over).
      *   *Attempt 3 (User's specific goal - "Conceptual Machinery"):* The user wants to know what drives the *characters*.
