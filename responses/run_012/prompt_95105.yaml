answer: |-
  The heat in the court of King Madhava was not merely of the sun, but of silence. In the center of the stone floor sat Lakshmi, her widow's white cloth stark against the dust. To her right stood the Messenger, a man who had walked three hundred miles from the port of Sopara. To her left stood the Brother-in-law, his hand resting on the hilt of a knife he was not allowed to draw.

  The question was simple: Was Lakshmi's husband, the merchant Dhanapala, dead or alive? If dead, she was free to remarry, and her dowry would return to her father. If alive, she remained bound, and the Brother-in-law retained control of the family estate.

  The Messenger spoke first. "I held his ring. I spoke to the men who buried him after the ship sank. I bring *śabda*—the word of the reliable. He is gone."

  The Brother-in-law stepped forward. "I saw him. Three days ago, near the western pass. He wore the same scar on his chin. I spoke his name. He did not answer, but I saw him. This is *pratyakṣa*—perception. The senses do not lie."

  King Madhava looked to his advisors. On his right sat Pandit Someshvara of the Mīmāṃsā school, rigid as a temple pillar. On his left sat Pandit Vasu of the Nyāya school, his eyes moving like a weaver's shuttle.

  "The matter is settled," Someshvara said, his voice dry. "The Messenger provides testimony of an event beyond sensory reach—a death at sea. The Brother provides perception of a local event—a sighting on land. These are distinct jurisdictions. *Pramāṇa-vyavasthā*. Testimony governs the unseen; perception governs the seen. They do not overlap. Therefore, both are valid. Dhanapala is ritually dead for the wife, and physically alive for the estate."

  Lakshmi gasped. "I cannot be both a widow and a wife."

  "It is a contradiction only if you demand one truth from two sources," Someshvara replied. "If I tell you 'Fire is hot' by touching it, and 'Fire is hot' by being told, you have not learned twice. You have confused the domains. Here, the domains are separate. The King must rule both ways."

  Vasu leaned forward. "With respect, Pandit, this is not fire and heat. This is existence and non-existence. They cannot occupy the same space. The Nyāya sutra holds that *pramāṇas* converge. *Pramāṇa-samuccaya*. Testimony and Perception both certify the same fact: 'Is Dhanapala alive?' If they contradict, one is in error. We do not accept paradox; we weigh reliability."

  "The Brother's eyes are sound," Someshvara countered. "Perception is the foundation of all knowledge. To deny it is to deny the world."

  "Perception is sound only when the conditions are right," Vasu said, standing. He walked toward the Brother. "Tell me, when you saw this man, was it dusk?"

  "Evening," the Brother admitted.

  "Was he speaking?"

  "No."

  "Then you saw a form, a scar, a silence. You did not perceive 'Dhanapala'. You perceived a man-like shape. The identification 'Dhanapala' came from your mind." Vasu turned to the King. "This is *anyathākhyāti*—the misplacement of memory. The Nyāya theory of error. When one sees a shell and thinks it silver, the silver is not created from nothing. It is a real memory of silver, misplaced onto a real shell. Here, the Brother saw a real traveler. But he misplaced the memory of his brother onto that stranger. The perception was of a man; the error was in the qualification."

  Someshvara scoffed. "You reduce sight to guesswork. If perception can be overturned by testimony, then no man is safe. Any liar with a loud voice can undo what another man sees."

  "Not any voice," Vasu corrected. "*Śabda* is valid only when the speaker is *āpta*—trustworthy, competent, and honest. The Messenger brings the ring. He brings corroboration from other sailors. His testimony is not a guess; it is a certified route to truth. When certified testimony conflicts with flawed perception, the error lies in the identification, not the senses. The Brother saw a man. He was wrong about *which* man."

  The King raised a hand. "If I accept Someshvara's view, I rule that Lakshmi is free to remarry, yet the estate remains locked because the husband lives. The law fractures."

  "The law seeks resolution, not symmetry," Someshvara said.

  "The law seeks truth," Vasu replied. "If we allow separate jurisdictions for the same fact, we invite chaos. A man could be taxed as alive and mourned as dead. The *pramāṇas* must stack. We must decide which certification holds weight."

  The King looked at Lakshmi. He looked at the ring in the Messenger's hand, glinting in the sun. He looked at the Brother's uncertain eyes.

  "The Nyāya view preserves the unity of the world," the King said slowly. "If truth is one, the means to know it must agree. Someshvara, your separation protects the Veda from the eye, but it cannot protect a merchant from a ghost."

  He turned to the Brother. "You saw a man with a scar. But scars are common, and memory is eager. The Messenger holds the ring. Testimony, when certified, carries the weight of the absent. Perception is immediate, but easily deceived by resemblance. I rule that the identification was an error of memory placed upon a stranger. Dhanapala is dead."

  Someshvara closed his eyes, not in defeat, but in disappointment. "You have allowed inference to eat perception."

  "I have allowed knowledge to cure doubt," Vasu said softly.

  Lakshmi bowed her head. The silence in the court broke, not into cheers, but into the shuffling of feet, the heavy sound of a single reality settling back onto the world.

  ***

  **Notes on the choices**

  The story hinges on the debate between *pramāṇa-vyavasthā* (exclusive jurisdiction of knowledge sources) and *pramāṇa-samuccaya* (cumulative/overlapping jurisdiction). Historically, this is a nuanced conflict between Mīmāṃsā and Nyāya. I simplified the Mīmāṃsā position for dramatic clarity: Kumarila Bhatta argued that *śabda* (specifically Vedic testimony) operates in a domain (*dharma*) inaccessible to perception, so they cannot contradict. In the story, I extended this to empirical testimony to create a legal paradox where a man can be "ritually dead" and "physically alive" simultaneously. If the Mīmāṃsā view held absolute sway here, the plot would end in stalemate; the Nyāya view is required for a verdict.

  I utilized the Nyāya theory of error, *anyathākhyāti* (misplacement), to explain the Brother's sighting. This theory posits that illusion isn't creating something from nothing, but misplacing a real memory (the brother's face) onto a real object (a stranger). This allows Vasu to validate the Brother's senses (he saw *someone*) while invalidating his conclusion (it was *Dhanapala*), preserving the integrity of perception while allowing testimony to override the identification.

  A defensible alternative reading would challenge the reliability of the *śabda*. Nyāya requires the speaker to be *āpta* (trustworthy/competent). If the Brother argued the Messenger was bribed, the *pramāṇa* itself would be invalidated, not just overridden. Furthermore, some Nyāya scholars argue that perception always trumps testimony in empirical matters. For the story's setup to work, I leaned on the specific exception where perception is ambiguous (distance, silence, resemblance), allowing testimony to act as the corrective lens. If perception were clear (e.g., the husband walked into court), testimony would collapse, and the plot would fail.
