answer: |-
  **Silas:** Let's grant the stipulation, Mara, though it fights against the historical data. The subject gains sight, and within hours, without touching, she sorts the sphere from the cube. You take this as vindication of the amodal view: shape is a common sensible, delivered to both touch and vision, requiring no translation.

  **Mara:** It seems the most parsimonious explanation, Silas. If the content of perception were strictly proprietary—if vision gave only colored patches and touch only pressure patterns—there would be no basis for the identification. The fact that she matches them implies she recognizes a geometric invariant that transcends the modality.

  **Silas:** But consider the failures. She cannot tell which object is nearer. She cannot tell if a visible bracket opens to the left or the right, though her hands tell her instantly. If shape were truly a common sensible, fully present to vision as it is to touch, why is the spatial layout so fragmented? You have a subject who sees "sphere" but does not see "here" or "there," nor "left-facing" or "right-facing."

  **Mara:** You're conflating intrinsic geometry with extrinsic location. The shape of the object—its curvature, its vertices—is intrinsic. Distance and orientation relative to the observer are extrinsic. When she gains sight, she gains access to the intrinsic properties immediately because those are amodal. But the egocentric frame—the coordinate system that places the object in relation to her body—requires calibration. The eye is a new sensor; it needs to learn how to map retinal disparity to bodily reach.

  **Silas:** That distinction is convenient, but I suspect it's a salvage operation. If I give you a map but remove the "you are here" marker, and scramble the north-south orientation, do you really have the map? You have a diagram. What I'm suggesting is that what has crossed over isn't spatial shape at all. It's a modality-neutral signature. Think of it as a label. The tactile system reads the sphere and issues a tag: *Type-A*. The visual system, upon receiving the new input, recognizes a pattern of shading and contour that also triggers *Type-A*.

  **Mara:** A label? You mean a semantic tag?

  **Silas:** Not semantic. Perceptual, but non-spatial. A signature is a detection of invariant features without the reconstruction of the 3D layout that produced them. The visual system detects "closed continuous curvature" and outputs a signal. The tactile system detects "uniform pressure distribution" and outputs the same signal. They match. But because the signal carries no spatial coordinates, she cannot judge distance. Because it carries no chirality relative to the viewer, she cannot judge the bracket's orientation. The success is real, but it is coarse. It's a classification, not a perception of space.

  **Mara:** But what generates the signature, Silas? If the visual system detects "closed continuous curvature," isn't that just a description of the shape? You're trying to have it both ways. You want to say the system detects geometric features to generate the tag, but then deny that the system represents geometry.

  **Silas:** I'm denying that it represents *shared* geometry. The visual feature is a pattern of light. The tactile feature is a pattern of resistance. They are causally correlated with the same object property, but they are not the same property in the mind. The "signature" is the point of correlation, not a shared content. It explains the sorting success without committing us to the mystical idea that a 3D volume is directly given to the eye.

  **Mara:** It's not mystical; it's structural. Look at the bracket case. If I see a bracket, I see a shape. If I don't know if it opens left or right, that implies I haven't established the relationship between the object's axes and my own. That is exactly what calibration is. The amodal content is the object's structure. The failure is in the transformation matrix that aligns that structure with the observer. You're arguing that because the matrix is broken, the structure isn't there.

  **Silas:** I'm arguing that if the matrix is broken, the structure you claim is there is doing no work. If she sees the shape, she sees the parts in relation to one another. In a bracket, the relation of the arms *is* the orientation. To say "I see the bracket but not which way it opens" is like saying "I see the sentence but not the order of the words." If the order is lost, the sentence is lost. If the orientation is lost, the spatial shape is lost. What remains is your "signature"—a recognition of complexity, perhaps, but not of form.

  **Mara:** That's too strong. Consider a wireframe cube rotating in depth. You recognize it as a cube throughout the rotation, even though the 2D projection changes constantly and the "left/right" relations of the vertices flip. You maintain a constant shape constancy despite changing orientation. My subject is in a state analogous to that rotation. She has the constancy—the cube-ness—but she hasn't yet locked the phase. She knows it's a cube, but she doesn't know its pose.

  **Silas:** But in your case, she *never* knows the pose by sight alone, not until she learns. In the rotating wireframe, you always know the pose, even if it's changing. Her deficit is fundamental. And here is my worry: your "signature" looks suspiciously like my "signature." You call it "intrinsic geometry without egocentric coordinates." I call it "modality-specific feature detection." How do we distinguish them?

  **Mara:** By the richness of the match. If it were merely a feature detection—a simple tag—she should only be able to sort simple from complex. But if she can distinguish a cube from a pyramid, or a torus from a sphere, purely visually, immediately, then the "tag" must be as complex as the shape itself. If the tag is as complex as the shape, in what sense is it not the shape?

  **Silas:** Complexity isn't structure. A hash function can be unique to a file without containing the file's content. The visual system could compute a high-dimensional vector of features—curvature density, edge count, symmetry axes—that matches the tactile vector. That vector allows sorting. But it doesn't allow her to navigate around the object, or reach for it accurately, or tell if it's looming toward her. That requires a spatial model. My claim is that the spatial model is what must be learned. The association is between the visual feature-vector and the tactile feature-vector. The spatial model is built later, by correlating those vectors with motor feedback.

  **Mara:** So you're pushing the spatial content entirely into the motor loop?

  **Silas:** I'm saying spatial content *is* the motor loop, effectively. To know "nearer" is to know "less effort to reach." To know "opens left" is to know "my left hand encounters the opening first." If she can't do those things visually, she doesn't have visual space yet. She has visual qualia linked to tactile labels.

  **Mara:** But that makes the immediate sorting miraculous. Why should the visual qualia of a sphere link to the tactile label of a sphere unless there is a common cause represented in both? If vision is only colored patches and touch is only pressure, the correlation is brute. It begs the question of why nature aligned them so perfectly. The amodal view explains the alignment: they are tracking the same thing.

  **Silas:** They are tracking the same thing in the world, yes. But not in the mind. The alignment is evolutionary, not phenomenological. The visual system evolved to detect spheres. The tactile system evolved to detect spheres. They converge on the same classification because the world contains spheres. That doesn't require the mind to hold a single, amodal "sphere" idea. It just requires two distinct detectors tuned to the same environmental regularity.

  **Mara:** And yet, when she sorts them, she feels she is recognizing the *object*, not just matching tags.

  **Silas:** Phenomenology is a poor guide here. She feels she recognizes it because the classification is immediate. But the failures reveal the underlying architecture. If you truly shared the content, the failures shouldn't exist. You shouldn't be able to剥离 (strip) the shape from the orientation so cleanly.

  **Mara:** Why not? In computer vision, we separate object recognition from pose estimation all the time. You can identify a car in a photo without knowing exactly how far away it is or whether it's facing left or right if the cues are ambiguous. The identity is distinct from the pose.

  **Silas:** In computer vision, that's because the system is designed to be invariant. But in perception, the "pose" is part of the spatial experience. If I see a cup, I see it as *there*, angled *thus*. If your subject lacks the *there* and the *thus*, she lacks the visual experience of space. She has a visual experience of *something*, which she can name, but she cannot place. That supports my view: she has a label, not a layout.

  **Mara:** She has a layout, but the scale and origin are undefined. Think of it like a map without a scale bar. The relations between the parts of the object are preserved—that's why she can sort cubes from spheres. The relations between the object and the body are undefined—that's why she can't judge distance. The amodal content is the map. The calibration is the scale bar.

  **Silas:** But the bracket isn't about the body. A bracket opening left versus right is an internal relation of the object's parts, unless you define "left" egocentrically.

  **Mara:** "Left" is always egocentric. An object doesn't open left; it opens toward the negative x-axis of the viewer.

  **Silas:** Precisely. And if she can't access that axis visually, she doesn't have visual access to the object's orientation in space. She has access to a shape-token. This brings me back to the explanatory power of the "signature." If your "map without a scale" is correct, she should be able to infer distance eventually just by studying the map—by parallax, perhaps, or occlusion. But if my view is correct, she has to learn that *this* visual pattern correlates with *that* reaching distance. The former is insight; the latter is association.

  **Mara:** And how would we test that?

  **Silas:** We look at the learning curve. If she suddenly "clicks" and understands depth as a geometric necessity, that favors your view. If she learns it piecemeal—reaching for this distance, then that one, generalizing slowly—that favors mine. The signature hypothesis predicts gradual calibration. The amodal hypothesis predicts a sudden realization of coordinate alignment.

  **Mara:** I can accept that. But consider the neural evidence. If we find that the same neural populations code for shape in both tactile and visual tasks, even before calibration, that suggests a common code.

  **Silas:** It would suggest a convergence zone, not necessarily a common sensible. A place where the tags are compared. But I concede this: if the "signature" is as rich as the shape, the distinction between "rich signature" and "amodal shape" becomes thin.

  **Mara:** It becomes a distinction without a difference, perhaps. If the signature carries all the structural information of the shape, minus the egocentric coordinates, then it *is* the shape representation, merely unanchored.

  **Silas:** But the anchoring is what makes it spatial. Without the anchor, it's just a taxonomy.

  **Mara:** And yet, she sorts them. She sees the world as divided into objects of different kinds. That is the beginning of space.

  **Silas:** It is the beginning of *objectivity*, maybe. Not space.

  **Mara:** Can you have objects without space?

  **Silas:** You can have distinct somethings. Space is the system of relations between them. She has the somethings. She lacks the system.

  **Mara:** Then we agree on the data, and disagree on the ontology of the "something."

  **Silas:** It seems so. You see the unanchored map as proof of the territory. I see it as proof of the labeling system.

  **Mara:** And the only way forward is to see if the map can be read without the anchor, or if the anchor must be glued on piece by piece.

  **Silas:** Exactly. Until then, the signature remains a hypothesis, and the common sensible remains an intuition.

  **Mara:** A satisfactory stalemate, then. For a seminar, at least.

  **Silas:** For a seminar, it's a gift. They can argue the calibration without reciting Locke.
