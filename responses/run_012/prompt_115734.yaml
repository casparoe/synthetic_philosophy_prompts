      *   *Refining the "Nightmare Question":* The user has a candidate. I need to provide mine first. The best one is about *who decides*. If Mill hates dependence, why does his cooperative scheme rely on the educated elite guiding the workers? Is that not just dependence with a nicer face?

  7.  **Final Polish:** Ensure the "Soft" markers are clear. Ensure the voice sounds like a senior colleague/prep coach. (e.g., "Don't flinch here," "This is where you bleed.")

