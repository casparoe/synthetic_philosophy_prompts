answer: |-
  **Q&A PREP SHEET: MILL ON DEPENDENCE & THE WAGE RELATION**
  **Context:** Reading Group (Mixed Hist/Phil/Econ)
  **Thesis:** Mill's late shift is not toward egalitarianism/socialism, but toward ending *dependence* (subjection) in the wage relation via cooperation.

  Here are the five objections ranked by threat level to your argument.

  ### 1. The Cambridge-School Historian (Methodological Threat)
  *   **Likelihood:** Certain.
  *   **Damage:** High. If "domination" is anachronistic, your central category is a projection.
  *   **How they'll phrase it:** "You're leaning heavily on 'domination' and 'subjection' as the organizing principles of Mill's critique. But those are neo-Roman categories, not Mill's. Where does Mill actually lexicalize this? Aren't you smuggling in Pettit or Skinner and calling it exegesis?"
  *   **Concede:** You concede the specific term "domination" (in the neo-Roman sense) is not Mill's primary label.
  *   **Hold:** The *concept* of independence vs. dependence is ubiquitous in his text, specifically in *Representative Government* and *Principles*.
  *   **The Reply (2 mins):** "You're right that I'm using 'domination' as a heuristic for the room, but the texture is Mill's. He doesn't say *dominium*, he says 'dependence on the will of another.' In *Representative Government*, he explicitly links the vote to economic independence to avoid being 'under the influence' of a master. In the *Chapters on Socialism',* his critique of the wage system isn't about distributional outcomes, but that the worker is a 'servant' in a 'hierarchical' relation. I'm not importing republicanism; I'm taking his obsession with 'character' and 'independence' seriously. The vocabulary is Victorian moral psychology, but the structural critique is that the wage contract is a status relation, not a free exchange."
  *   **Status:** **HARD.** Stand firm. This is your textual ground.

  ### 2. The Empire Specialist (Biographical/Conceptual Threat)
  *   **Likelihood:** Very High.
  *   **Damage:** High. It exposes a blindness in your definition of "freedom."
  *   **How they'll phrase it:** "You can't talk about Mill's theory of dependence without addressing the East India Company. He spent 35 years administering a system of total dependency for millions of Indians. He explicitly argues for 'despotism' as a legitimate mode of government for 'backward' societies. How is his critique of wage dependence not just a privilege of the metropolitan citizen?"
  *   **Concede:** You concede Mill's liberalism is bounded by his civilizational hierarchy. He does not extend this protection against dependence universally.
  *   **Hold:** The internal logic of his critique of *wages* remains distinct from his theory of *empire*, even if the blind spot is glaring.
  *   **The Reply (2 mins):** "This is the hardest tension in Mill, and I don't want to sanitize it. Mill distinguishes between 'civilized' reciprocity and 'uncivilized' tutelage. His critique of the wage relation applies to those he deems capable of 'cooperation'—essentially, the European working class. You're right that his definition of who counts as an agent is restricted. However, my claim is about the *structure* of his argument regarding political economy, not his moral consistency. Even if his application was restricted, the theoretical move—identifying the wage relation as a form of subjection incompatible with full citizenship—is still doing work in the *Principles*. We can acknowledge the imperial blind spot without letting it invalidate the economic critique he levels at home."
  *   **Status:** **SOFT.** *Do not fight this.* Acknowledge the hypocrisy. If you defend Mill here, you lose the room. Concede the limitation, pivot back to the economic theory.

  ### 3. The Classical Liberal (Textual Consistency Threat)
  *   **Likelihood:** High.
  *   **Damage:** Medium. Challenges the continuity of your "Late Mill" vs. "Early Mill."
  *   **How they'll phrase it:** "This sounds like you're inflating three late texts to override *On Liberty*. In *Liberty*, the core is individual responsibility and non-interference. If you make the state or the community responsible for ending 'dependence' via cooperation schemes, aren't you violating the very autonomy you claim he's protecting?"
  *   **Concede:** There is a tension between *Liberty*'s negative freedom and the *Principles*' institutional engineering.
  *   **Hold:** *Liberty* presupposes the material conditions for autonomy which the wage system undermines.
  *   **The Reply (2 mins):** "I'm not arguing he abandons *On Liberty*; I'm arguing he realizes *On Liberty* is impossible without economic independence. In *Liberty*, he worries about the tyranny of custom and the state. But in the *Principles*, he identifies the employer's power as a private tyranny. If a worker risks starvation by leaving a job, that's not a free contract. His push for cooperation isn't state coercion; it's voluntary association to remove the 'master' from the equation. He's trying to make the material conditions match the liberal ideal, not sacrifice the ideal for security."
  *   **Status:** **HARD.** This is the core of your contribution.

  ### 4. The Marxist (Ideological Threat)
  *   **Likelihood:** Medium-High.
  *   **Damage:** Low-Medium. They won't convince the room you're wrong, but they will frame you as an apologist.
  *   **How they'll phrase it:** "This is a rescue operation. Mill is a bourgeois thinker trying to save capitalism from itself. 'Cooperation' is just a way to prevent revolution. You're dressing up a hedge as a radical critique of subjection."
  *   **Concede:** Mill is not a revolutionary and fears violent upheaval.
  *   **Hold:** Mill's critique of the wage relation is structural, not merely functionalist stabilization.
  *   **The Reply (2 mins):** "I agree Mill isn't a revolutionary; he fears the 'tyranny of the majority' and violent upheaval. But calling it a 'hedge' misses that he fundamentally rejects the legitimacy of the profit system as it stands. He says the current system is 'temporary.' A hedge protects the status quo; Mill is arguing the status quo is morally unsustainable. He might not go as far as Marx on expropriation, but on the specific point of the wage relation being a form of servitude, they are diagnosing the same pathology, even if they prescribe different cures."
  *   **Status:** **HARD.** Don't let them dismiss the text as mere ideology.

  ### 5. The Economist (Technical Coherence Threat)
  *   **Likelihood:** Medium (They are there for biscuits, but they know their trade).
  *   **Damage:** Low. If the economics is messy, it doesn't necessarily kill the political theory.
  *   **How they'll phrase it:** "The Thornton recantation leaves Mill without a theory of wage determination. If wages aren't determined by capital stock, what determines them? If your Mill rejects the Wages Fund, does he have a coherent alternative, or just a wish for profit-sharing?"
  *   **Concede:** Mill's economics here is theoretically incomplete.
  *   **Hold:** The *institutional* insight matters more than the *determinacy* of the model.
  *   **The Reply (2 mins):** "You're right that the Wages Fund recantation creates a theoretical vacuum. Mill admits he doesn't have a new formula. But that's actually consistent with my argument. He's moving from a deterministic view of economics (laws of production/distribution) to a voluntarist one. If wages aren't fixed by capital, they are a matter of custom and bargaining. That opens the door for the 'partnership' model. He doesn't need a new equation; he needs a new social relation. The incoherence in the economics is the space where the politics enters."
  *   **Status:** **HARD.** Turn the weakness into evidence for your thesis.

  ***

  ### The One Question You're Hoping Nobody Asks

  **My Candidate:**
  "You argue Mill wants to end dependence. But his mechanism for doing so—education, moral improvement, voluntary cooperation—relies entirely on the benevolence and patience of the very capitalist class that benefits from that dependence. If the wage relation is truly 'subjection,' why does Mill propose a solution that requires the subjugated to wait for the masters to agree to dissolve their own power? Isn't that the ultimate dependence?"

  **Why this hurts:**
  It strikes at the agency problem in your argument. If Mill hates dependence, his proposed transition period perpetuates it. It forces you to admit that Mill's "liberalism" ultimately trusts the elite more than he trusts the workers' capacity to seize freedom, which undermines your claim that he views them as equal partners in waiting.

  **How to handle it if asked:**
  Do not deny it. Mill *is* an elitist. His theory of progress is top-down.
  *Reply:* "That is the tragedy of Mill's liberalism. He identifies the disease correctly but lacks a mechanism for cure that doesn't rely on the moral enlightenment of the oppressor. He believes competition will force employers to adopt cooperation eventually. You're right that it leaves the worker in a holding pattern. But my claim is about his *diagnosis* of the wage relation, not the feasibility of his transition. He identifies the dependency as the evil, even if his solution is naively gradualist."

  **(Compare this to your candidate. If yours is harder, use yours. If this one resonates, prep for it.)**
