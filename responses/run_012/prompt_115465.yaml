prompt: |-
  Ok, thesis chapter time, and I need to get this straight before my advisor sees it. Here's the claim I want to make. Gödel showed that any consistent formal system strong enough to do arithmetic has true statements it can't prove. So there are facts that are true but that can never be proven from our best theories, which means there will always be true things about the world that our best physics can't derive. And by the second theorem the theory can't even prove its own consistency, so we can never really be sure it isn't contradictory. A theory of everything is ruled out by a theorem, not by lack of cleverness. My advisor says I'm overreaching but won't say exactly where, and alot of people I've talked to think the argument is airtight.

  I also keep tripping on what true is supposed to mean in that statement — true in the theory, or true in the world? Does it matter?

  And I did think of the obvious fix, which I'm pretty sure works: whenever the system can't prove some true sentence, you just add that sentence as a new axiom and keep going. In the limit you get a system that proves every true sentence, so, complete after all. Is the only real cost that it takes infinitely many steps?

  So what I want is this stated properly, in a form I can defend in a chapter. Get the theorems right, tell me their exact scope, and then tell me what they do and don't rule out for a physical theory or a theory of everything. If my fix doesn't work, tell me why not, and tell me which step of my argument is the one that actually breaks.
