  I've just been appointed to my town's environmental advisory committee, and the first substantial item before us is a proposed facility whose risks are genuinely unsettled — one member keeps invoking the precautionary principle, and I keep feeling that we are arguing in a language I don't quite speak. I'm an applied statistician by training: I think in null and alternative hypotheses, Type I and Type II error, power, priors and posteriors, loss functions, minimax regret, sequential stopping rules, and the expected value of information. I'd like the debate over the precautionary principle restated in that vocabulary as faithfully as it can be, followed by an honest account of what the translation loses.

  The principle, as it gets used in our meetings, runs roughly like this: where an activity threatens serious or irreversible harm, lack of full scientific certainty is not a reason to postpone measures to prevent it, and the burden of demonstrating safety falls on whoever proposes the activity.

  Please structure your answer in exactly these sections, in this order and at roughly these lengths:

  - "The principle in my terms" (~250 words): a restatement of the principle in my vocabulary that a careful statistician would accept as faithful rather than a caricature.
  - "What maps cleanly" (~300 words): the elements that have real counterparts in hypothesis testing or decision theory — name each counterpart and state what adopting the mapping commits you to.
  - "What maps only with distortion" (~250 words): where you had to fudge, and what the fudge conceals.
  - "What does not survive" (~250 words): anything in the principle that has no counterpart at all in my framework.
  - "Residue report" (~200 words): for whatever is left over, say whether it marks a genuine gap in the statistical vocabulary or instead shows the principle doing something other than deciding under uncertainty — allocating who must justify themselves to whom.

  Write in American English, and don't smooth the translation into something tidier than it actually is.
