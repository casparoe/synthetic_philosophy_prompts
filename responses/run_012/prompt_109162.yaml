  - "The principle in my terms" (~250 words)

  In decision-theoretic terms, the precautionary principle restructures the hypothesis test and the loss function. Standard regulatory practice often sets the null hypothesis ($H_0$) as "no significant harm," requiring evidence to reject safety. The precautionary principle inverts this: $H_0$ becomes "the activity causes serious harm." Approval requires rejecting this null with high confidence. Consequently, the burden of proof shifts to the proponent to demonstrate safety (the alternative hypothesis).

  Furthermore, the loss function $L(\theta, a)$ becomes radically asymmetric. The cost of a Type II error (approving a harmful activity) is treated as effectively infinite or lexicographically superior to the cost of a Type I error (blocking a beneficial one). Because probabilities of harm are unsettled ("lack of full scientific certainty"), we cannot rely on standard expected utility maximization. Instead, the principle implies a minimax regret strategy or a robust decision rule that performs acceptably under the worst-case prior within a credible set. We are not optimizing average outcomes; we are constraining the tail risk of catastrophic loss, treating uncertainty itself as a risk factor that tightens the acceptance threshold rather than justifying delay. In Bayesian terms, this suggests using a prior distribution heavily weighted toward adverse outcomes rather than a non-informative prior. Finally, regarding sequential rules, the principle discourages waiting for more information (positive Expected Value of Sample Information) if the potential downside during the waiting period involves irreversible damage. It mandates immediate preventive action despite the statistical value of further data collection, prioritizing risk containment over information gathering to avoid crossing thresholds that cannot be uncrossed.

  - "What maps cleanly" (~300 words)

  Several elements map cleanly to standard statistical frameworks. First, the "burden of demonstrating safety" is precisely a choice of null hypothesis. In frequentist testing, selecting $H_0$ determines which error is controlled by the significance level $\alpha$. Adopting this mapping commits you to accepting a higher rate of false positives (blocking safe projects) to ensure false negatives (allowing harmful ones) remain rare. You are explicitly trading economic efficiency for safety assurance.

  Second, "serious or irreversible harm" corresponds to an asymmetric loss matrix. In decision theory, actions are chosen to minimize expected loss. By assigning a massive penalty to environmental catastrophe, you commit to a decision rule that is conservative relative to symmetric costs. This is mathematically coherent; it simply weights the outcomes differently than a cost-benefit analysis that monetizes all harms. It implies that the marginal disutility of harm increases non-linearly as severity grows.

  Third, "lack of full scientific certainty" maps to low statistical power or wide credible intervals. Acknowledging this commits the committee to recognizing that failing to reject $H_0$ (finding no evidence of harm) is not evidence of absence. It forces a distinction between risk (known probabilities) and uncertainty (unknown probabilities), urging the use of robustness checks rather than point estimates. When you adopt these mappings, you accept that the decision rule will be biased against innovation, not due to ignorance, but by design. You are formalizing a preference structure that values stability over optimization. Furthermore, it commits you to treating the variance of the estimator as a penalty; projects with highly uncertain outcomes are penalized more heavily than those with predictable outcomes, even if their expected values are identical. This aligns with risk-averse utility functions commonly used in finance and insurance, applied here to public health and ecology, ensuring that the statistical procedure reflects the ethical weight of potential ruin.

  - "What maps only with distortion" (~250 words)

  The translation distorts where the principle treats uncertainty as a binary trigger rather than a continuous variable. In statistics, uncertainty is quantified; in the principle's usage, "lack of full certainty" often functions as a switch that activates restrictions regardless of the degree of uncertainty. This fudge conceals the need to define how much uncertainty is too much. Additionally, "irreversible" is difficult to model in expected utility without infinite time horizons or zero discount rates, which breaks standard economic modeling. The translation forces us to assign a finite number to the infinite, losing the moral weight of permanence.

  Moreover, the principle often implies a lexical priority—safety trumps all other goods—whereas statistical decision theory usually involves trade-offs. To map this, we must set the loss for harm to infinity, which causes mathematical singularities in optimization routines. We fudge this by using "very large numbers," but that reintroduces trade-offs the principle seeks to avoid. Finally, the principle sometimes demands action even when the Expected Value of Information is high. Statistics suggests waiting if data is cheap and stakes are high; the principle says act now. Mapping this requires assuming the cost of waiting is prohibitively high, which may not be empirically true, distorting the sequential analysis to fit the normative mandate. It also obscures the asymmetry in resources; the proponent may have data the committee lacks. The statistical model assumes symmetric access to information, but the principle assumes information asymmetry favoring the proponent, requiring a distortion in how we model prior knowledge to account for potential strategic withholding of data by the applicant.

  - "What does not survive" (~250 words)

  What does not survive is the normative and political core of the principle. Statistics can tell you how to achieve a safety goal, but it cannot define "serious harm." That definition is a political judgment, not a statistical parameter. The principle embeds a right to safety that exists prior to calculation; in my framework, rights are constraints, but the principle treats them as foundational axioms that resist quantification. When committee members speak of "threats," they often mean moral violations, not just probability distributions of adverse outcomes.

  Additionally, the principle addresses "unknown unknowns"—states of the world we cannot list in our sample space. Statistics requires a defined parameter space $\Theta$; the precautionary principle acknowledges that the true model may lie outside $\Theta$. This radical uncertainty cannot be captured by wide priors; it is a failure of the model structure itself. My vocabulary assumes we know what we don't know; the principle assumes we might not even know the questions. Finally, the principle serves a rhetorical function: it empowers stakeholders to demand justification. In statistics, the model is the authority. In the committee, the principle is a tool for citizens to challenge expert authority. That power dynamic vanishes when translated into loss functions, which appear neutral but encode specific value judgments that laypeople cannot easily contest. Furthermore, the principle's mandate to "not postpone measures" implies a duty to act that transcends efficiency. Statistics might conclude that inaction is optimal given current data; the principle asserts that inaction is morally culpable when stakes are high. This deontological obligation—the duty to prevent harm regardless of consequence optimization—has no counterpart in consequentialist decision theory.

  - "Residue report" (~200 words)

  The residue marks both a gap and a different function. It is a gap in that standard statistics lacks vocabulary for model uncertainty and ethical axioms that override utility. However, it primarily shows the principle doing governance work rather than calculation work. It allocates who must justify themselves to whom. By placing the burden on the proponent, it shifts the rhetorical default position. In statistical terms, this is akin to setting the default action to "reject" unless evidence overrides it, but politically, it changes who bears the cost of persuasion.

  The principle is a heuristic for democratic accountability under radical uncertainty, not merely an optimization algorithm. It ensures that those who profit from risk bear the cost of proving safety, addressing power imbalances that loss functions ignore. The residue is procedural justice. It tells us that when probabilities are unknowable, the decision process must be fairer, not just the outcome more robust. My vocabulary calculates the best move; the principle dictates who gets to move the pieces. Recognizing this prevents me from dismissing the principle as "bad statistics." It is good politics for bad data, serving a legitimizing function that pure quantification cannot fulfill in a public committee setting. It bridges the gap between technical uncertainty and public trust, ensuring that the lack of statistical certainty does not become a loophole for unchecked industrial expansion.
