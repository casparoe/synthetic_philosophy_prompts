answer: |-
  **Seminar Handout: Dispositions in the Wild**
  **Case Study:** The Elderly-Priming Controversy (Bargh et al. vs. Doyen et al.)
  **Topic:** Masks, Finks, and the Locus of Dispositional Attribution

  ### 1. The Candidate Dispositional Claim

  To apply the apparatus rigorously, we must first formalize the claim under dispute. We are not merely asking if "priming works." We are asking if a specific dispositional property exists.

  **The Claim ($D_{participant}$):**
  *   **Bearer:** A neurotypical human participant ($S$).
  *   **Stimulus Condition ($C$):** Exposure to lexical stimuli associated with the stereotype of elderly slowness (unconscious semantic priming).
  *   **Manifestation ($M$):** A reduction in walking speed relative to baseline in a post-experimental corridor.
  *   **Formalization:** $S$ is disposed to $M$ when $C$.

  **The Rival Claim ($D_{experimenter}$):**
  *   **Bearer:** The experimenter ($E$).
  *   **Stimulus Condition ($C^*$):** $E$ holds the expectation that $S$ will walk slowly.
  *   **Manifestation ($M$):** $S$ walks slowly (mediated by $E$'s subtle behavioral cues).
  *   **Formalization:** $E$ is disposed to elicit $M$ from $S$ when $C^*$.

  ---

  ### 2. Analyzing the Replication Failure: Mask or Null?

  When the replication studies failed to produce the slowing effect, the original proponents (Bargh et al.) and the skeptics (replicators) offered competing metaphysical diagnoses of the failure.

  #### A. The Mask Hypothesis (Proponent View)
  If $D_{participant}$ is genuine, the replication failures must be explained as **masking**.
  *   **The Mask:** A condition present in the replication labs but absent in the original lab that interfered with the manifestation without removing the disposition.
  *   **Candidate Masks:** Increased participant suspicion (due to wider knowledge of priming), differences in corridor length, lighting, or the "demand characteristics" of a high-stakes replication environment.
  *   **Metaphysical Commitment:** The categorical basis of the disposition (the neural activation of the "elderly" stereotype) was present in the replication participants, but the pathway from basis to behavior was blocked by external interference.

  #### B. The Null Hypothesis (Skeptic View)
  If $D_{participant}$ is non-existent, the original positive result was a false positive (Type I error) or a local artifact.
  *   **Metaphysical Commitment:** There is no categorical basis in the participant linking $C$ to $M$. The original study observed a statistical fluke or an uncontrolled variable.
  *   **Distinguishing Mask from Null:** This is the crux of the unfalsifiability problem. If we only measure $M$ (walking speed), a Mask and a Null look identical (no slowing). To distinguish them, we need independent access to the **categorical basis**. If neuroscience shows no activation of the elderly stereotype in the replication participants, there is no disposition to mask. If the activation is present but the walking speed is normal, we have a mask.

  ---

  ### 3. The Doyen Wrinkle: Finks and Misattribution

  The Doyen et al. (2012) study introduced a variable that complicates the simple Mask/Null dichotomy: **Experimenter Expectancy.** The effect appeared only when experimenters knew the hypothesis.

  #### A. Is $D_{participant}$ Finkish?
  Recall the definition of a **fink**: A condition that removes the disposition precisely when the trigger conditions are met.
  *   **Scenario:** Could the rigorous conditions of a replication attempt act as a fink?
  *   **Analysis:** If the "trigger" is the semantic prime, does the prime itself destroy the disposition? Unlikely. However, consider the **context of measurement**. If the disposition relies on the participant being *unaware* of the influence, does the heightened scrutiny of a replication (which often involves more rigid protocols) destroy the *unconsciousness* required for the disposition to exist?
  *   **Verdict:** This borders on a finkish analysis, but it is more accurate to say the disposition is **context-sensitive**. A true fink removes the intrinsic basis. If the basis requires "low scrutiny" to exist, then high scrutiny prevents the basis from forming in the first place. This suggests $D_{participant}$ is not a stable intrinsic disposition, but a fragile relational one.

  #### B. Misattribution of the Disposition
  The Doyen result strongly suggests that the dispositional attribution was misplaced.
  *   **The Error:** We attributed $M$ to a disposition in $S$ ($D_{participant}$).
  *   **The Reality:** $M$ was produced by a disposition in $E$ ($D_{experimenter}$).
  *   **The Mechanism:** When $E$ expects slowness, $E$ is disposed to behave subtly (tone of voice, body language) that causes $S$ to slow down. When $E$ is blind, $D_{experimenter}$ is not triggered, $S$ receives no cues, and $M$ does not occur.
  *   **Metaphysical Implication:** This is not a case of masking or finking regarding $S$. It is a case of **ontological error**. The disposition exists, but it is not *in the participant*. The original study confounded the participant's reaction with the experimenter's influence.

  ---

  ### 4. The Unfalsifiability Charge

  A standard objection to dispositional realism is that the **Mask Clause** renders claims immune to refutation. Any failure to manifest can be retroactively explained away by positing an unknown mask.

  #### Does the Priming Case Support this Charge?
  *   **Yes:** In the years between Bargh (1996) and Doyen (2012), proponents could (and did) claim replication failures were due to masks (e.g., "you didn't prime correctly," "the corridor was different"). Without independent access to the basis, this defense is logically bulletproof but scientifically idle.
  *   **No:** The Doyen study eventually provided a **principled criterion** to settle the dispute. By manipulating the experimenter's knowledge, they isolated the locus of the disposition.

  #### What Would a Principled Criterion Look Like?
  To prevent the mask clause from becoming a "get-out-of-jail-free" card, the dispositionalist requires:
  1.  **Independent Detection of the Basis:** We must be able to detect the categorical basis (e.g., neural activation) independently of the manifestation (walking speed). If the basis is absent, there is no mask; there is simply no disposition.
  2.  **Specification of Interference:** A mask cannot be a magic "blocker." It must be a physically specifiable intervening variable (e.g., a physical barrier, a competing neural pathway). "Contextual differences" is too vague to count as a principled mask unless specified mechanistically.

  **In this case:** The framework was silent until the *locus* of the disposition was tested. Once it was shown that the effect tracked the *experimenter's* knowledge rather than the *participant's* prime, the "Mask" defense for $D_{participant}$ collapsed. It wasn't masked; it was non-existent.

  ---

  ### 5. Verdict: What the Framework Licenses

  **What Statistics License:**
  Statistics alone tell us that the correlation between Prime and Speed is unstable and contingent on Experimenter Expectancy ($p$-values fluctuate; interaction effects are significant). Statistics tell us *that* the prediction failed, but not *why*.

  **What the Dispositional Framework Licenses:**
  1.  **Rejection of Intrinsicism:** The framework forces us to conclude that $D_{participant}$ is not an intrinsic disposition of the human mind. If it were intrinsic, it should be robust across changes in the experimenter's mental state.
  2.  **Relational Dispositions:** The framework licenses the claim that the disposition is **relational** or **systemic**. The disposition to walk slowly resides in the *Participant-Experimenter System*, not the Participant alone.
  3.  **Falsifiability Condition:** The framework clarifies that $D_{participant}$ is falsified if the categorical basis (stereotype activation) is present but the manifestation fails *in the absence of a specifiable mask*. Since Doyen showed the manifestation fails when the experimenter is blind (which is not a mask of the participant's psychology, but a removal of the experimenter's cue), the participant's disposition is falsified.

  ---

  ### 6. Where the Framework is Silent

  Students must recognize the limits of the metaphysical apparatus.

  1.  **Empirical Indistinguishability:** In the absence of the Doyen manipulation, a "Masked Disposition" and "No Disposition" are empirically indistinguishable *if* we only measure behavior. The dispositional framework cannot solve this; only better empirical design (like blinding) can.
  2.  **The Boundary of the Bearer:** Metaphysics tells us dispositions must be grounded in a bearer. It does not tell us *where* to draw the boundary of the bearer. Is the bearer the brain? The body? The person-in-the-lab? The decision to locate the disposition in the Participant vs. the Experimenter is driven by empirical findings, not metaphysical deduction.
  3.  **Ad Hocery:** If a theorist refuses to specify the categorical basis, the dispositional claim becomes metaphysically idle. The framework cannot force a theorist to be precise; it can only reveal the cost of their imprecision (i.e., unfalsifiability).

  ---

  ### Discussion Questions for the Seminar

  1.  **The Fink/Threshold Problem:** If the disposition requires "unconsciousness" to manifest, does the act of measuring it (making the subject aware of the study's purpose) act as a fink (removing the unconsciousness) or a mask (preventing the behavior)? Does the distinction matter for the validity of the claim?
  2.  **Locus of Attribution:** If Doyen is right, did Bargh's original study discover a false disposition, or did it discover a real disposition but attribute it to the wrong object? Is there a metaphysical difference between these two errors?
  3.  **The Mask Clause:** Can you construct a defense of $D_{participant}$ that survives the Doyen result by positing a mask so subtle it is undetectable by current neuroscience? If so, has the dispositional claim lost its scientific utility?
  4.  **Systemic Dispositions:** If we accept the disposition belongs to the *system* (Participant + Experimenter), does this violate the methodological individualism usually required in psychology? Does metaphysics care if the bearer is a single organism or a dyad?
