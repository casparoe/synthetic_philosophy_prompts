answer: |-
  You are correct: the field is talking past itself because "The Frame Problem" is a homonym for at least three distinct problems that are often conflated. To write your MSc thesis without drowning in the noise, you need to separate the **Representational Frame Problem (RFP)** from the **Computational Frame Problem (CFP)**, and acknowledge the **Philosophical Frame Problem (PFP)** lurking behind them.

  *   **RFP:** How do we represent persistence without writing $N \times M$ frame axioms? (McCarthy & Hayes, 1969).
  *   **CFP:** How does an agent compute *which* facts are relevant to its current goal in real-time? (Dennett's Robot, 1984).
  *   **PFP:** How do we bound the set of potential consequences of an action in an open world? (The general epistemological issue).

  Most "solutions" solve the RFP but ignore the CFP, or solve the CFP by dissolving the representation entirely. Here is the specification you asked for, broken down by requirement, tension, and family performance.

  ---

  ### Part 1: The Desiderata (The Spec)

  An adequate account must satisfy the following constraints. I have marked them as **Non-Negotiable** (fails without it) or **Contingent** (depends on the architectural goal).

  #### 1. Persistence by Default (The Core RFP)
  *   **Requirement:** The system must infer that fluents (properties) remain unchanged after an action unless there is positive evidence to the contrary, without explicit frame axioms for every action-fluent pair.
  *   **The Case:** If I move a red block from A to B, it remains red. I should not have to state `Move(x,y,z) → Color(x,c)`.
  *   **Why:** Combinatorial explosion. In a world with $F$ fluents and $A$ actions, explicit frame axioms require $O(F \times A)$ statements.
  *   **Status:** **Non-Negotiable.** Without this, you do not have common-sense reasoning; you have a lookup table.

  #### 2. Defeasibility (The Yale Shooting Problem)
  *   **Requirement:** Persistence defaults must be overrideable by causal information.
  *   **The Case:** You shoot the turkey. Default: Turkey stays alive. Causal rule: Shooting kills. Result: Turkey dies. If the gun is jammed (unknown precondition), the default might hold (Turkey lives).
  *   **Why:** Monotonic logic fails here. If you add "Gun is jammed" to the knowledge base, a monotonic system that concluded "Turkey Dead" cannot retract it.
  *   **Status:** **Non-Negotiable.** Any system that cannot handle the Yale Shooting scenario is logically inadequate for dynamic domains.

  #### 3. Ramification and Qualification (The Domino & The Bomb)
  *   **Requirement:** The system must handle indirect effects (ramifications) and hidden preconditions (qualifications) without exhaustive enumeration.
  *   **The Case:** Pushing domino 1 knocks over domino 10 (indirect). Moving a bomb might require it not to be bolted down (qualification).
  *   **Why:** Causal chains are infinite in principle but finite in practice. A solution that requires listing all indirect effects fails the "exhaustive list" constraint.
  *   **Status:** **Non-Negotiable** for general reasoning; **Contingent** for narrow planning (STRIPS ignores this by assumption).

  #### 4. Relevance Bounding (The Core CFP)
  *   **Requirement:** The agent must identify which subset of its beliefs needs updating after an action, in time proportional to the complexity of the action, not the size of the database.
  *   **The Case:** Dennett's Robot. Robot 1 deduces moving the bomb moves the color of the wall. Robot 2 deduces it must consider *all* consequences. Robot 3 (successful) tags relevance.
  *   **Why:** Tractability. If updating beliefs requires checking every fluent in the universe against every action, real-time action is impossible.
  *   **Status:** **Non-Negotiable** for embodied agents; **Contingent** for offline theorem proving.

  #### 5. Ontological Distinction (Belief vs. Truth)
  *   **Requirement:** The system must distinguish between the state of the world and the agent's knowledge of the state.
  *   **The Case:** The robot believes the bomb is safe (because it didn't check), but the bomb is ticking. The reasoning engine must handle `Believes(Safe)` vs. `Safe`.
  *   **Why:** To handle "Unknown Effects." If an action has an unknown effect, the world state changes, but the belief state might only record "Uncertain." Collapsing these leads to hallucination or paralysis.
  *   **Status:** **Non-Negotiable.**

  #### 6. Open World Assumption
  *   **Requirement:** The system cannot assume that unmentioned facts are false or unchanged simply because they weren't named.
  *   **The Case:** A robot moves a cup. It doesn't know there is a spider under the cup. It cannot assume "Spider Location Unchanged" is true, nor false.
  *   **Why:** Robustness. Closed-world assumptions (CWA) work in databases but fail in physical reality.
  *   **Status:** **Contingent.** This is the biggest "House Rule" divider. Planning systems assume CWA to function. Common-sense reasoning requires Open World. You cannot have both fully.

  ---

  ### Part 2: The Incompatibilities (The Diagnosis)

  Here is where the math fights back. You cannot maximize all desiderata simultaneously. These are the hard trade-offs you must expose in your thesis.

  #### 1. Expressivity vs. Tractability (The RFP/CFP Trade-off)
  *   **The Conflict:** To solve the RFP properly (handling defeasibility, ramification, open world), you generally need non-monotonic logic (e.g., Circumscription, Default Logic). To solve the CFP (real-time relevance), you need restricted languages (e.g., STRIPS, PDDL).
  *   **The Incompatibility:** Rich non-monotonic formalisms are often undecidable or computationally intractable (NP-hard or worse) for projection. Restricted formalisms are tractable but cannot express the nuances of the Yale Shooting Problem or Ramifications without hacking.
  *   **Who Gives:**
      *   **Logicists** give Tractability (they build correct systems that run too slow).
      *   **Planners** give Expressivity (they build fast systems that break on edge cases).
      *   **Verdict:** There is no general solution that is both expressively complete and polynomial-time. This is not an engineering gap; it is a logical limit.

  #### 2. Logical Omniscience vs. Bounded Relevance
  *   **The Conflict:** Classical logic (and many non-monotonic variants) assumes that if $P$ is known and $P \to Q$ is known, then $Q$ is known.
  *   **The Incompatibility:** If an agent is logically omniscient, it cannot solve the CFP. It would instantly infer all infinite ramifications of an action. To solve CFP, the agent must be *ignorant* of some consequences of its own beliefs.
  *   **Who Gives:**
      *   **Situation Calculus** usually retains Omniscience (within the model), failing CFP.
      *   **Embodied/Relevance** approaches abandon formal logic entirely to enforce ignorance, failing RFP (hard to verify correctness).
      *   **Verdict:** You must choose between a semantics of *truth* (Logic) or a semantics of *access* (Architecture).

  #### 3. Open World vs. Completion (The "No Effect" Problem)
  *   **The Conflict:** You asked for the distinction between "No Effect" and "Unknown Effect."
      *   *No Effect:* Action $A$ provably does not change Fluent $F$.
      *   *Unknown Effect:* Action $A$ might change $F$, but we lack data.
  *   **The Incompatibility:** Efficient planning (STRIPS) uses "Completion Semantics": If an effect isn't listed, it doesn't happen. This conflates "No Effect" with "Unknown Effect." To distinguish them, you need explicit epistemic operators, which blows up the search space.
  *   **Who Gives:**
      *   **Planning** collapses the distinction (House Rule).
      *   **Epistemic Logic** maintains it but pays a complexity tax.
      *   **Verdict:** If you want tractability, you must accept Closed-World assumptions locally. If you want truth, you accept intractability.

  ---

  ### Part 3: The Scorecard (Family Evaluation)

  Here is how the major camps stack up against the spec.

  #### 1. Situation Calculus + Non-Monotonic Fix-ups (e.g., Reiter's Basic Action Theories, Circumscription)
  *   **RFP (Persistence):** **Pass.** Solves the Yale Shooting Problem elegantly using successor state axioms.
  *   **CFP (Relevance):** **Fail.** Computing the next situation requires theorem proving. Relevance is not built into the semantics; it must be searched for.
  *   **Open World:** **Pass.** Can model incomplete knowledge.
  *   **Tractability:** **Fail.** Projection is generally intractable for long horizons.
  *   **Diagnosis:** This is the gold standard for *specification*, not *implementation*. It tells you what the answer should be, not how to compute it in real-time.

  #### 2. The Planning Tradition (STRIPS, PDDL, GraphPlan)
  *   **RFP (Persistence):** **Pass (by Cheat).** Uses the "STRIPS Assumption" (only listed effects change). This solves the representational problem by fiat.
  *   **CFP (Relevance):** **Pass.** Heuristics and grounding make this tractable for large state spaces.
  *   **Open World:** **Fail.** Assumes Closed World. If a precondition isn't listed, it's assumed true or false definitively.
  *   **Diagnosis:** This is engineering, not common-sense reasoning. It works because it restricts the domain to a "toy world" where the Frame Problem has been legislated away by the modeler.

  #### 3. Probabilistic / Decision-Theoretic (POMDPs, Dynamic Bayesian Networks)
  *   **RFP (Persistence):** **Pass (Soft).** Persistence is handled via transition probabilities (high prob of staying same).
  *   **Defeasibility:** **Pass.** Handled via conditional probabilities.
  *   **CFP (Relevance):** **Mixed.** Inference is still NP-hard in general, though approximate methods (particle filters) help.
  *   **Distinction (No Effect vs. Unknown):** **Pass.** Distinguishes low probability (no effect) from high entropy (unknown).
  *   **Diagnosis:** Strongest contender for handling uncertainty and "Unknown Effects." However, it struggles with *structural* common sense (qualitative rules) and requires massive data to learn transition models that logic can write down in one line.

  #### 4. Embodied / Relevance-First (Behavior-Based, Subsumption, Predictive Processing)
  *   **RFP (Persistence):** **Fail/Dissolved.** Often avoids explicit representation of persistence entirely. "The world is its own best model."
  *   **CFP (Relevance):** **Pass.** Relevance is determined by sensorimotor coupling, not search.
  *   **Tractability:** **Pass.** Real-time by design.
  *   **Diagnosis:** Solves the CFP by denying the RFP. It works for insects and vacuum cleaners. It fails for MSc-level reasoning tasks requiring long-horizon planning or counterfactuals ("What if I *hadn't* moved the bomb?").

  ---

  ### Part 4: The Hard Truth for Your Thesis

  If you need a conclusion to anchor your work, here it is:

  **The Frame Problem is not one problem. It is a tension between logical fidelity and computational boundedness.**

  1.  **Non-Negotiable:** If you claim to solve the Frame Problem, you must solve the **Yale Shooting Problem** (Defeasibility) without exhaustive axioms (RFP). If you don't, you haven't solved the logical core.
  2.  **Non-Negotiable:** If you claim to build an *agent*, you must solve the **Relevance Problem** (CFP). If you don't, your agent starves while thinking.
  3.  **The Incompatibility:** You cannot satisfy both fully in a general domain.
      *   The **Logicists** (Situation Calculus) solve the RFP and admit they struggle with CFP.
      *   The **Engineers** (Planning/RL) solve the CFP and admit they restrict the RFP.
      *   The **Embodied** crowd dissolves the RFP to solve the CFP.

  **Your Contribution:**
  Don't try to "solve" the Frame Problem. Your thesis should likely argue that the disagreement exists because different camps are optimizing for different points on the **Expressivity-Tractability frontier**.
  *   If the goal is **Verification**, use Situation Calculus (accept slowness).
  *   If the goal is **Action**, use Planning/Probabilistic (accept closed-world assumptions).
  *   If the goal is **Survival**, use Embodied (accept lack of abstraction).

  The "solution" is not a new logic. It is a clear specification of which constraints are being relaxed to achieve the others. Most papers fail because they claim to solve the general problem while silently relaxing the Open World constraint or the Tractability constraint. Your job is to make those relaxations explicit.
