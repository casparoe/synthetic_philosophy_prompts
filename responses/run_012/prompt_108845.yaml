prompt: |-
  Ive got a moral question that's been nagging at me since the spring and I can't get it straight, so I'd like your take on it. My wife and I rehomed a greyhound back in March — she was in a sorry state when we got her, wouldn't come out from behind the sofa for a fortnight — and she's turned into the soppiest dog going. My brother-in-law has been staying with us while his place is being done up, and he keeps needling me about her. His line is: she's a dog, not a person, so you can't do right or wrong to her — there's nobody in there to wrong. He's not a brute about it. He says obviously you shouldn't be cruel to animals, but the reason is what it does to the person doing it: it coarsens you, and a coarsened person ends up worse to people too.

  The bit I can't answer is this. I asked what he'd say about a man kicking a dog in a world where we somehow knew for certain that this man would stay gentle as a lamb with every human he ever met. He said then no wrong has been done — the dog is hurt, but that isn't a moral matter in itself. When I said that was mad, he said fine, then the cruelty must be wrong in itself, whoever it lands on, in which case it's just as bad to lay into a robot dog, or a dog that died last week, so long as you thought it was alive. I genuinely can't tell whether that's a reductio of his position or of mine. My sister (his wife) reckons the cruelty is itself a sort of claim — treating as a thing something that isn't one — which sounds right to me, but I can't say what the something is, if it isn't a person.

  So: is he right? And if he isn't, where exactly does the argument go wrong? Please write it out as ordinary continuous prose — no headings, bullets or bold, just the way you'd write an email.
