answer: |-
  It is completely understandable that this has been nagging at you, because you are wrestling with one of the oldest and most difficult problems in ethics, and your intuition is pulling you in the right direction. The short answer is that your brother-in-law is not right, or at least he is defending a position that most modern ethical thought has moved away from, and the flaw in his argument lies in how he defines where moral wrongness actually lives. He is arguing for what philosophers call an indirect duty view, which suggests that we owe nothing to animals themselves, but only owe duties to other humans regarding how we treat animals. While this was a dominant view centuries ago, it relies on a very narrow definition of what makes a being matter morally, usually tying it to rationality or personhood rather than the capacity to suffer.

  The place where his argument really comes undone is in his response to your thought experiment about the man who kicks a dog but remains gentle to humans. When he says no wrong has been done because the man's character remains intact, he is ignoring the reality of the dog's experience. He is locating the entire moral weight of the action in the mind of the kicker, as if the universe only cares about the virtue of the human agent. But if you accept that pain and fear are bad things, then it matters who experiences them. When you kick a dog, you are causing suffering to a sentient creature that does not want to suffer. That suffering is a negative event in the world regardless of whether the kicker goes on to be nice to his neighbours. To say otherwise is to say that pain only matters when it happens to a person, which is a claim that requires much more proof than he is offering.

  His counter-argument about the robot dog or the dead dog is where he tries to trap you, but it actually reveals the weakness in his own logic. He claims that if cruelty is wrong in itself, it must be wrong regardless of the object, so kicking a robot should be equally bad. The mistake here is conflating the intent of the actor with the nature of the act. Cruelty is not just a state of mind; it is a relationship between an agent and a victim who can feel. If you kick a robot dog, you might be a strange person, but you are not being cruel in the moral sense because you are not causing suffering. The moral wrongness of kicking a live dog comes precisely from the fact that the dog is alive and can feel pain. The object matters immensely. The reason kicking a dead dog is different from kicking a live one is not because of what it does to the kicker, but because one act causes suffering and the other does not. His reductio ad absurdum fails because it assumes the wrongness is entirely in the head of the human, when in reality the wrongness is in the impact on the victim.

  Your sister is actually very close to the mark with her idea that cruelty is a sort of claim about what something is. When your brother-in-law says there is nobody in there, he is denying the subjective reality of the dog. But you have lived with this greyhound. You saw her hide behind the sofa because she was afraid, and you saw her come out because she felt safe. Those are not mechanical reactions; they are evidence of an inner life. She is not a person in the legal or rational sense, but she is a subject of a life. She has preferences, she feels comfort and distress, and she has interests that can be helped or harmed. To treat her as a mere thing is to deny that reality. The moral wrong is that you are disregarding the boundaries of a being that can experience harm.

  So the argument goes wrong when he insists that moral status belongs only to persons. If you accept that the capacity to suffer is what grants a being moral standing, then the dog matters for her own sake, not just for yours. You do not need to prove she is a person to prove she can be wronged; you only need to acknowledge that she is a creature for whom things can go better or worse. Your brother-in-law's view protects humans from becoming coarse, which is a good thing, but it fails to protect the dog from the kick. Since the dog is the one who feels the kick, her protection should be the primary moral concern. You are right to feel that there is someone in there, and you are right to feel that harming her is a wrong done to her, not just a mistake made by you.
