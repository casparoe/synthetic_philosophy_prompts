answer: |-
  You have identified a precise and under-named structural feature of ethical life. There is no single canonical term in the literature that captures this exact asymmetry (where a proposition is *motivationally corrupting* but *justificatorily vital*), but it sits at the intersection of several well-established philosophical discussions.

  The closest existing concept is **Deliberative Self-Effacement**, but you are right to feel that standard "self-effacement" (usually associated with Derek Parfit) falls short. Parfit's self-effacement is about *belief* (a theory is true, but you shouldn't believe it because believing it makes you act worse). Your case is about *use*: the reason is true, you can endorse it, you can speak it, but it must not occupy the *causal slot* of motivation.

  Here is the carving you asked for: the established concepts that neighbor it, why they miss the mark, and a proposal for how to name and generalize the phenomenon.

  ### 1. The Nearest Established Concepts (and why they fall short)

  **A. Michael Stocker's "Schizophrenia of Modern Ethical Theories"**
  *   **The Concept:** Stocker argues that modern theories (utilitarianism, deontology) require motives (duty, maximization) that are incompatible with the goods they aim to produce (friendship, love). If you visit a friend in the hospital *because it is your duty*, you have failed as a friend.
  *   **Why it falls short:** Stocker uses this to attack the *theory*. He says the theory is wrong because it demands the wrong motive. You are not attacking the theory; you are saying the "duty" reason is *correct* in the hallway and *incorrect* in the bedroom. Stocker doesn't account for the *contextual validity* of the duty-reason.

  **B. Bernard Williams' "One Thought Too Many"**
  *   **The Concept:** In saving your wife from drowning, if you deliberate "I may save her because she is my wife," that is one thought too many. You should just act.
  *   **Why it falls short:** Williams is talking about *deliberation*. He implies the thought shouldn't be there at all. You are noting that the thought *is* there, it is true, and it is the right thing to *say* to the family, just not the thing to *act* on. Williams doesn't distinguish between the *motivating thought* and the *account-giving thought*.

  **C. Michael Walzer's "Spheres of Justice"**
  *   **The Concept:** Different social goods operate in different spheres with different currencies. You cannot use the currency of the market (money) in the sphere of the family (love).
  *   **Why it fits best:** This is the strongest structural match. You are describing a collision between the **Sphere of Intimacy** (where the currency is particular care) and the **Sphere of Institutions** (where the currency is role/obligation).
  *   **Why it falls short:** Walzer focuses on distribution of goods, not the linguistic/normative status of *reasons* given after the fact.

  ### 2. The Carving: What exactly is the asymmetry?

  The asymmetry rests on the distinction between the **Order of Motivation** (Efficient Cause) and the **Order of Accountability** (Final/Formal Cause).

  *   **In the Order of Motivation (The Room):** The action must be caused by a **Particular Reason** ("*This* person is scared"). If caused by a **General Reason** ("It is my role"), the action loses its moral character (it becomes bureaucratic, not caring). The General Reason is *Motivationally Toxic*.
  *   **In the Order of Accountability (The Hallway):** The action must be legitimized to the community. A Particular Reason ("I love him") is unactionable for the family (it creates debt, implies favoritism) and unactionable for the institution (it can't be scaled). A General Reason ("It is my role") stabilizes the social structure. The General Reason is *Justificatorily Vital*.

  The proposition ("I did it because it is my role") is **Normatively Bivalent**: its moral value flips depending on whether it is functioning as a *cause* or a *cover*.

  ### 3. A Proposed Name: "Deliberatively Excludable Justifications"

  Since no single term exists, I propose we call this **Deliberatively Excludable Justifications** (or **DEJ**).

  *   **Definition:** A reason $R$ is a DEJ if:
      1.  $R$ is true.
      2.  $R$ is a valid public justification for action $A$.
      3.  $R$ must be excluded from the agent's *deliberative motivation* for $A$ to preserve the moral quality of $A$.
  *   **Why this name?** It captures the "exclusion" aspect (it can't be in the deliberation) without implying the reason is false (it is still a "justification"). It distinguishes it from standard self-effacement (which is about belief) and hypocrisy (which is about truth).

  Another evocative term, focusing on the social function, is **Protective Impersonality**. The impersonal reason *protects* the intimacy of the room from the outside world, and *protects* the outside world from the burden of the intimacy.

  ### 4. Distinguishing from Hypocrisy and Rationalization

  You are right to reject these labels, but here is the precise philosophical boundary:

  *   **Hypocrisy:** Requires **deception about values**. The hypocrite pretends to value $X$ but values $Y$. You value both "Care" and "Duty," but you recognize they belong in different places. You are not deceiving anyone about what you value.
  *   **Rationalization:** Requires **causal falsity**. In standard rationalization, you say "I did it for $R$" when actually you did it for $R^*$ (usually a selfish reason). Here, you are saying "I did it for $R$" (Duty) when you did it for $R^*$ (Care). This *looks* like rationalization, **except** that $R$ is a *valid normative ground* for the action, even if it wasn't the psychological cause.
      *   *The Line:* Rationalization offers a reason that *would not have made the action right* if it were the only reason. Your "Duty" reason *does* make the action right; it just wasn't the engine. You are offering a **Valid Non-Motivating Reason**. This is not rationalization; it is **Social Translation**.

  ### 5. Does it Generalize?

  Yes. This structure is ubiquitous in roles that bridge the personal and the structural.

  *   **Parenting:**
      *   *Motive:* "I'm hugging you because I adore you."
      *   *Justification to Teacher:* "I ensure he gets 10 hours of sleep because it's my responsibility as a guardian."
      *   *DEJ:* "Because it's my job as a parent." (True, valid justification to the state; monstrous motive to the child).
  *   **Medicine:**
      *   *Motive:* "I am holding this patient's hand because they are in pain."
      *   *Justification to Hospital:* "I am following palliative care protocol 4B."
      *   *DEJ:* "Protocol 4B." (If the doctor thinks "I am doing this *only* because of Protocol 4B" while holding the hand, they become a technician, not a healer. But if they tell the board "I followed Protocol 4B," they are safe and accountable).
  *   **Law/Judgement:**
      *   *Motive:* "I am lenient because I see his remorse."
      *   *Justification to Public:* "I am sentencing within the statutory guidelines."
      *   *DEJ:* "The Guidelines." (A judge who thinks *only* of the guidelines is a bureaucrat; a judge who cites *only* personal mercy is a tyrant. The guideline is a DEJ).

  ### 6. Summary

  You have discovered a specific category of ethical reasons that function as **structural scaffolding** but fail as **psychological fuel**.

  *   **The Phenomenon:** A reason that is **Justificatorily Valid** but **Motivationally Toxic**.
  *   **The Mechanism:** It works by separating the **Context of Action** (requiring particularity) from the **Context of Accounting** (requiring generality).
  *   **The Name:** **Deliberatively Excludable Justifications**.
  *   **The Virtue:** Recognizing this asymmetry is not hypocrisy; it is a form of **Integrity**. It shows you understand that different human spheres require different currencies, and you are refusing to "colonize" the intimate sphere with the bureaucratic currency, even while using the bureaucratic currency to protect the intimate sphere from outside interference.

  You aren't lying to the family. You are translating a gift (your care) into a transaction (your duty) so they don't feel burdened by the gift. That translation is itself an act of care.
