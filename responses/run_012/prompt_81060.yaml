answer: |-
  # Joint Statement on Mental Causation and the Exclusion Argument

  **Prepared for:** The Reading Group
  **Authors:** [Your Name] (Interventionist) & [Friend's Name] (Closure-First Exclusionist)
  **Date:** October 26, 2023

  ## Preamble: A Necessary Distinction
  Before detailing our agreements and disagreements, we acknowledge that a significant portion of our past friction stems from an ambiguity in the Exclusionist conclusion. We agree to distinguish two distinct readings of the claim that "the mental does not cause the physical":

  1.  **Impotence:** Mental properties make *no difference* to outcomes. If the mental property were different (holding the physical base fixed or varying it appropriately), the outcome would be the same. The mental is a causally inert shadow.
  2.  **Redundancy (Pre-emption):** Mental properties *would* make a difference, but they are causally pre-empted by the physical realizer. The physical cause "trumps" the mental cause, rendering the mental causally otiose despite counterfactual dependencies.

  We note that the Closure-First position often slides between these. The Interventionist argues that if the counterfactuals hold, Impotence is false. The Exclusionist argues that even if counterfactuals hold, Closure entails Redundancy. This document isolates where that slide occurs.

  ---

  ## Part I: Agreed Claims (The Shared Machinery)

  We both affirm the following premises as the background framework for our dispute. We are not fighting over these facts, but over their causal interpretation.

  1.  **Non-Eliminativism:** Neither of us denies the existence of mental states. We agree that beliefs, desires, and pains exist and are legitimate targets of explanation. We are not eliminative materialists.
  2.  **Supervenience:** Mental properties supervene on physical properties. There can be no difference in mental properties without some difference in underlying physical properties.
  3.  **Causal Closure of Physics (CCP):** Every physical event that has a cause has a *sufficient* physical cause. We agree that we do not need to posit non-physical energy or violations of conservation laws to explain behavior.
  4.  **Validity of the Exclusion Argument:** We agree that the Exclusion Argument is logically valid. If its premises are true, the conclusion follows. Our dispute is strictly regarding the **soundness** of the argument, specifically the premises linking closure to causal exclusion.
  5.  **Multiple Realizability:** Mental kinds are multiply realizable. The same mental state (e.g., pain) can be realized by distinct physical states in different organisms or substrates.
  6.  **Relevance vs. Efficacy:** We acknowledge a conceptual distinction between *causal relevance* (making a difference to an outcome) and *causal efficacy* (the physical "oomph" or production of the outcome). We disagree on whether mental properties possess only the former or both.
  7.  **No Systematic Overdetermination:** We agree that it is implausible to claim that every instance of human behavior is systematically overdetermined by two independent sufficient causes (like two shooters firing at once).

  ---

  ## Part II: Points of Departure & Cruxes

  The following table details the specific loci of disagreement. For each crux, we specify the divergent claims, the agreed-upon test cases, our predictions, and—critically—what would count as evidence against our *own* positions.

  | Crux | Closure-First Exclusionist (Friend) | Difference-Making Interventionist (You) | Agreed Test Case / Argument | Predictions | Falsification Conditions (Evidence Against Own View) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Definition of Causation** | Causation requires **physical production** or transference of energy/information. If a property does not appear in the fundamental physical account of the transaction, it is not a cause. | Causation is **difference-making**. $C$ causes $E$ if an intervention on $C$ (holding appropriate background conditions fixed) changes $E$. Physical production is not necessary for causal truth. | **The Thermostat:** A thermostat causes the furnace to turn on. At the micro-level, electron flow is the "production." But intervening on the *setting* (mental analog) changes the outcome, even if the micro-state varies. | **Excl:** The thermostat is merely a locus of physical causes; the "setting" is a shorthand, not a cause.<br>**Int:** The setting is the robust cause; the electron flow is the mechanism. | **Excl:** If a physical theory is found where "production" is ill-defined but difference-making remains robust.<br>**Int:** If interventions on mental variables fail to track outcomes when physical realizers are controlled. |
  | **2. Variable Relativity of Causal Claims** | Causal claims about the physical world are **absolute**. A physical cause is a cause simpliciter, not relative to a model or variable set. Closure is an absolute constraint. | Causal claims are **relative to a variable set**. Even physical causal claims (e.g., "the peg caused the hole to fill") depend on the level of granularity chosen. Closure is compatible with level-relative causation. | **The Peg and the Board:** A square peg doesn't fit a round hole. The *macro-shape* causes the failure. The micro-particle arrangement is irrelevant to the explanation. | **Excl:** The micro-particles are the real cause; the shape is a description of them.<br>**Int:** The shape is the cause relative to the explanatory variable set; the micro-details are noise. | **Excl:** If physics itself admits macro-variables as fundamental to causal laws (e.g., in thermodynamics) without reduction.<br>**Int:** If macro-physical causal claims dissolve completely when micro-variables are specified. |
  | **3. Impotence vs. Redundancy** | The conclusion of Exclusion is **Redundancy**. The mental *might* satisfy counterfactuals, but it is causally pre-empted by the physical. It does no *work*. | The conclusion of Exclusion implies **Impotence**. If the mental is excluded, the counterfactuals must fail. If counterfactuals hold, there is no exclusion. Pre-emption is incoherent here. | **The Shadow:** A shadow moves as a person walks. The shadow's movement correlates with the person's. Does the shadow cause the grass to darken? | **Excl:** The shadow is redundant; the person does the work.<br>**Int:** The shadow is impotent; intervening on the shadow (without moving the person) changes nothing. Mental states are unlike shadows. | **Excl:** If it can be shown that "pre-emption" requires independent causal chains, which realization is not.<br>**Int:** If mental interventions fail to stabilize outcomes across different physical realizers. |
  | **4. The Scope of Closure** | Closure rules out **higher-level causes**. If a physical cause is sufficient, no higher-level cause can be added without overdetermination. | Closure rules out **non-physical causes** (dualism). It does not rule out higher-level physical (or realized) causes, provided they are not competitors but constituents. | **Software Execution:** Code causes the screen to light up. The electricity is sufficient. Does the code cause it? | **Excl:** The electricity is the cause; the code is a pattern in the electricity.<br>**Int:** The code is the cause relative to the computational level; electricity is the implementation. | **Excl:** If computer science is shown to be merely shorthand for electronics with no distinct causal laws.<br>**Int:** If software behavior cannot be predicted without tracking every electron. |

  ---

  ## Part III: Is This Merely Verbal?

  We anticipate the reading group may ask if this dispute is merely verbal—i.e., if we are simply using the word "cause" differently.

  **Our Joint Assessment:**
  Part of the dispute is verbal, but **stipulating a definition would not dissolve the problem; it would merely relocate it.**

  *   If we stipulate that "cause" means *physical energy transfer*, the Exclusionist wins by definition, but the concept of causation becomes useless for the special sciences (biology, psychology, economics). We would have to say "beliefs do not cause actions," which contradicts successful explanatory practice.
  *   If we stipulate that "cause" means *difference-making*, the Interventionist wins by definition, but the Exclusionist will rightly object that we have changed the subject from "what physically drives the universe" to "what explains the outcome."

  **What is lost by stipulating:**
  If we stipulate our way out, we lose the ability to explain **why** the mental is special. The substantive fight is not about the word "cause," but about **causal competition**. The Exclusionist believes causes at different levels compete for a fixed amount of "causal credit." The Interventionist believes causes at different levels are compatible because they answer different questions. Resolving this requires metaphysics, not lexicography.

  ---

  ## Part IV: Adjudication and Verdict

  *As requested, the following section commits to a verdict on the central crux of the debate.*

  **The Central Crux:** Crux #1 and #2 (The Definition of Causation and Variable Relativity).
  **The Verdict:** The **Difference-Making Interventionist** has the better of the argument.

  **Reasoning:**
  The Closure-First Exclusionist position relies on a "Causal Pie" model—the intuition that there is a fixed amount of causal work to be done, and if the physical does it all, there is none left for the mental. This model is metaphysically suspect. It treats causation as a conserved quantity like energy, which it is not. Causation is a relation of dependence.

  The Interventionist correctly identifies that the Exclusion Argument fails because it assumes causal claims must compete across levels. As demonstrated by the **Peg and the Board** case (Crux #2), we routinely accept macro-physical causes as real even when micro-physical sufficiency is present. If the Exclusionist denies mental causation based on Closure, consistency demands they also deny macro-physical causation (like "the earthquake caused the collapse"), reducing all causation to fundamental particle interactions. This leads to a causal nihilism that undermines the Exclusionist's own ability to discuss "physics" as a causal science.

  Furthermore, regarding the **Impotence/Redundancy** distinction: The Exclusionist wants to claim Redundancy (the mental is pre-empted). However, pre-emption typically requires two *independent* causal chains (e.g., two assassins). In mental causation, the mental and physical are not independent; they are related by realization. Therefore, the "pre-emption" model is a category error. If the mental supervenes on the physical and supports the right counterfactuals, it is not redundant; it is a higher-level description of the same causal structure.

  **Prediction for Honest Pursuit:**
  If this debate is pursued honestly rather than rhetorically, it will not end with the Exclusionist converting to Dualism, nor the Interventionist denying Physics. It will end with a **Refined Non-Reductive Physicalism**.

  The Exclusionist will be forced to concede that "Causal Closure" applies only to the *base level* of ontology, not to causal *explanation*. They will have to accept that higher-level variables can be genuinely causal without violating physics, provided causation is understood as difference-making relative to a level. The Interventionist will have to concede that mental causation is not "magic"—it is strictly constrained by the physical realizers, and there is no "downward causation" that violates physical laws.

  The final position will look like this: **The physical realizes the mental; the mental difference-makes the behavioral. Both claims are true, provided we do not confuse realization with competition.**

  ---
  **Signed:**

  _________________________ (Closure-First Exclusionist)

  _________________________ (Difference-Making Interventionist)
