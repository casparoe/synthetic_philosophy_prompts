prompt: |-
  I have no academic training in philosophy — I studied engineering and have spent the last three years reading and arguing with myself about perception and the nature of reality. I have ended up defending a position I believe is a repaired and defensible version of Berkeley's idealism, and next month I have been asked to present it to a local philosophy discussion group. The group is mostly graduate students in analytic philosophy, with a few working scientists and one retired philosopher who knows the history well; they are friendly, scientifically minded, and mostly assume physicalism is obviously true. They will not have read the same things I have, and I will not have read the same things they have.

  You are an expert in early modern philosophy and the philosophy of perception, and you are also a seasoned conference attendee who knows how a room like this actually behaves. Think carefully before you answer. Begin with a short brainstorm: identify what this specific audience is likely to presuppose, what they will treat as common ground, and what they will regard as amateurish, then build your answer on that.

  My position, so you have something to aim at: there are only minds and their experiences; there is no mind-independent material substance. I know the classic argument for this is usually dismissed as trading on a confusion between conceivability and possibility, so I do not rest my case on conceivability at all. My first move is linguistic: I claim that the word "object" names a role in a perceptual exchange, roughly the way "the score" names a role in a game, so an unperceived object is like a move in a game no one is playing — not a hidden thing, but an incoherent role. My second move is to explain the stability of the world without Berkeley's God: I say unperceived objects exist as standing dispositions to be experienced, a rule-governed order among possible experiences rather than a substance behind them. I think these two moves rescue the idealist conclusion. I suspect at least one of them is doing less work than I think.

  Please prepare me for the question period — not a defense of my view, a prep sheet. Give me the objections I will actually get from this audience, in roughly the order they will come, phrased the way these particular people would phrase them, with the generic undergraduate objections set aside unless someone in this room would really raise them. For each objection, give me a two-minute spoken reply and a candid note on where that reply is soft or merely evasive. Mark which objections I should simply concede, which I must not concede, and which concessions are cheap enough to give away to buy credit for the ones that matter. Then tell me the single weakest point in my own position that I should prepare to defend rather than hope they miss, and finally the one question I am hoping nobody asks, with your honest assessment of whether I can survive it.
