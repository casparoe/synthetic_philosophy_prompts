answer: |-
  Your intuition is correct, and your counterexample is perfect. The hole is in **Step (6)**.

  Here is the breakdown of why that step fails, why it looked convincing, the "price" of accepting your friend's argument, and how to handle elimination order.

  ### 1. The Hole: Step (6) and the Quantifier Swap

  Step (6) claims: *If a mix strictly dominates a pure strategy, one of the ingredients must also strictly dominate it.*

  This is logically false. It relies on a **quantifier swap error**.
  *   **True:** For every opponent action, there exists a pure strategy in the mix that performs better than the dominated strategy. ($\forall s_{-i}, \exists s_k \dots$)
  *   **False (Friend's Claim):** There exists a pure strategy in the mix that, for every opponent action, performs better than the dominated strategy. ($\exists s_k, \forall s_{-i} \dots$)

  In your matrix:
  $$
  \begin{array}{c|cc}
   & L & R \\
  \hline
  T & 3 & 0 \\
  M & 0 & 3 \\
  B & 1 & 1
  \end{array}
  $$
  *   **Against L:** $T$ (payoff 3) is the "best ingredient." It beats $B$ (payoff 1).
  *   **Against R:** $M$ (payoff 3) is the "best ingredient." It beats $B$ (payoff 1).
  *   **The Mix:** The 50-50 mix guarantees 1.5 against *both*.

  The mix works because it combines the strength of $T$ (against $L$) and the strength of $M$ (against $R$). Your friend's argument assumes the "best ingredient" must be the *same* ingredient regardless of what the opponent does. But in game theory, the best response usually *depends* on the opponent's move. The mix hedges against that dependency.

  ### 2. Why It Looked Fine (Steps 1–5)

  Steps (1) through (5) are technically correct **ex-post** (after the opponent has moved).
  *   If you knew the opponent was playing $L$, you would regret mixing. You should have played $T$.
  *   If you knew the opponent was playing $R$, you would regret mixing. You should have played $M$.

  Your friend is conflating **ex-post rationality** (no regret after seeing the move) with **ex-ante rationality** (maximizing expected utility before the move is made).
  *   Game theory defines rationality as **ex-ante**. You choose your strategy before you see the opponent's card.
  *   Since you don't know whether they will play $L$ or $R$, the mix (expected payoff 1.5) is strictly superior to $B$ (expected payoff 1), regardless of your beliefs, provided you assign non-zero probability to both.
  *   Therefore, playing $B$ is irrational, even though no *pure* strategy beats it.

  ### 3. The Price of the Error

  You asked me to "price it." If your reading group accepts your friend's argument, here is the cost:

  1.  **Broken Elimination (IEDS):** You cannot correctly solve games. In your example, if you forbid mixes from eliminating strategies, you must keep $B$. But $B$ is irrational. Any solution concept that retains $B$ is failing to capture rationality.
  2.  **No Equilibrium in Zero-Sum Games:** In Matching Pennies or Rock-Paper-Scissors, every pure strategy is dominated by a mix of the others (in terms of security level). If mixes aren't allowed, these games have no solution. You would have to conclude that rational play is impossible in competitive settings.
  3.  **Vulnerability:** A player following your friend's advice is exploitable. If you commit to a pure strategy in Matching Pennies, a rational opponent will punish you. The mix is the only way to guarantee a minimum value (the Maxmin value).
  4.  **Theoretical Collapse:** You lose the Minimax Theorem and the general existence proof for Nash Equilibria (Nash 1950). The entire edifice of non-cooperative game theory rests on the ability to mix.

  ### 4. Order of Elimination

  You asked: *If I keep letting mixtures do the eliminating, does the order in which I eliminate still not matter?*

  *   **Strict Dominance:** **Order does not matter.** Whether you use pure or mixed strategies to define strict dominance, the set of surviving strategies (rationalizable strategies) is unique. You can eliminate in any order.
  *   **Weak Dominance:** **Order does matter.** This is true regardless of whether you allow mixes. Weak dominance is path-dependent.

  Since your friend's argument is about strict dominance ("beat it no matter what"), the correct procedure (allowing mixes) preserves the order-independence property. Following your friend's advice (pure only) would not create order dependence, but it would create **incorrectness** (leaving dominated strategies on the board).

  ### 5. What to Say About "Unexploitable" Mixes

  Your friend's Step (8) says: *"For any fixed guess about what the opponent will do, some pure option is at least as good."*

  This statement is **true**, but the conclusion *"so mixing is at best a fancy tie-break"* is **false**.

  *   **Best Response:** If you have a *fixed, certain* belief about the opponent, you are right: a pure strategy is always a best response. You never need to mix to *maximize payoff against a known strategy*.
  *   **Equilibrium/Security:** However, you mix for two other reasons:
      1.  **To make the opponent indifferent:** In a Nash Equilibrium, you mix so that the *opponent* cannot exploit you. If you play pure, they adjust. If you mix correctly, they cannot gain by adjusting.
      2.  **To avoid being dominated:** As your matrix shows, some pure strategies ($B$) are simply bad compared to a mix, even if no single pure strategy beats them. Rationality requires deleting $B$. If you restrict yourself to pure strategies only, you might be forced to play $B$ if you are unsure between $T$ and $M$. But Expected Utility Theory says you should play the mix.

  ### Summary for Your Group

  1.  **Concede (1)–(5):** Agree that *ex-post*, a pure strategy always looks better than a mix.
  2.  **Reject (6):** Show them your matrix. The mix beats $B$ everywhere; $T$ and $M$ do not. The "best ingredient" changes depending on the column.
  3.  **Reject (8):** Clarify that while a pure strategy is always a best response to a *fixed* belief, rationality requires choosing a strategy that is not dominated *ex-ante*. Since $B$ is dominated by a mix, playing $B$ is irrational.
  4.  **The Price:** If they keep (6), they cannot solve Matching Pennies, they cannot justify deleting $B$ in your matrix, and they break the standard definition of rationalizability.

  Your reading group should keep (1)–(3) as mathematical facts about expectation, but they must accept that **dominance is a property of the strategy across all states, not within a single state.** That is where the friend's logic breaks.
