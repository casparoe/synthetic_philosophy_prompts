      *   *Refinement on the Scale Argument:* The user worries about "shuffling uncertainty." I need to explicitly mention that philosophy can shift the burden of proof (Precautionary Principle) which bypasses the need for precise $P$.

  9.  **Final Polish:** Ensure the distinction between "neuroscience finds correlates" and "philosophy justifies the link to moral weight" is sharp. That is the committee pitch.

