answer: |-
  # JOINT STATEMENT ON THE IDENTITY CONDITIONS OF LETTERFORMS
  **An Adversarial Collaboration Framework**

  **Signatories:** The Essentialist Working Group & The Conventionalist Working Group
  **Date:** October 26, 2023
  **Subject:** Defining the Scope of Dispute Regarding Orthographic Identity

  ## 1. AGREED CLAIMS AND EMPIRICAL CONSTRAINTS

  We, the undersigned, acknowledge that the debate regarding the identity conditions of letterforms (e.g., what makes a glyph an instance of the letter *a*) has suffered from divergent vocabularies and mismatched empirical scopes. To advance the field, we agree to adopt the **Invariance Proposal** as the neutral framework for future inquiry.

  **The Invariance Proposal:** The identity of a letterform is defined as the class of forms invariant under the set of *admissible stylistic transformations*.
  *Note: We agree that characterizing the set of "admissible transformations" is the primary object of dispute, not the mathematical form of the proposal itself.*

  We jointly commit to the following claims:

  1.  **Empirical Adequacy:** Any theory of letter identity must accommodate the following data points without ad hoc exceptions:
      *   **Allographic Variation:** Single-storey ($\alpha$) and double-storey ($a$) variants must be identifiable as the same letter type despite topological differences.
      *   **Stylistic Drift:** Heavily stylized forms (e.g., Blackletter, Script, Display faces) must be categorizable alongside standard serif/sans-serif forms.
      *   **Degradation and Occlusion:** Partially occluded, noisy, or low-resolution glyphs are routinely identified correctly by competent readers.
      *   **Developmental Trajectories:** Children's early letter productions often violate standard proportions yet are accepted as valid tokens by instructors; conversely, children sometimes confuse structurally similar letters (e.g., *p/q*, *b/d*) despite distinct social functions.
      *   **Novel Typefaces:** Competent readers can identify letter identities in entirely novel typefaces they have never encountered, provided the forms fall within certain bounds.

  2.  **Definition of "Essence":** For the purposes of this collaboration, an "essence" is defined strictly as a set of necessary and sufficient conditions that determine category membership independently of specific token frequency or historical lineage. We agree that if such an essence exists, it must be computationally tractable within the human visual-cognitive system.

  3.  **Scope of the Invariance Proposal:** We agree that adopting the Invariance Proposal **does not** settle the metaphysical status of the letter.
      *   It does not decide whether the constraints on transformation are physical/psychological (bottom-up) or normative/social (top-down).
      *   It does not decide whether "admissibility" is a matter of discovery (finding the limits of the visual system) or stipulation (enforcing the limits of the orthographic community).
      *   It serves solely to localize the disagreement to the *source and nature of the transformation rules*.

  ## 2. DISAGREEMENTS TABLE

  The following table outlines the remaining substantive disagreements. We have phrased each position to ensure charitable interpretation by the opposing camp.

  | Issue | Essentialist Position | Conventionalist Position | The Crux | Agreed Test / Case Study | Predictions (Recorded Pre-Data) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Source of Admissibility** | The set of admissible transformations is **discovered**. It is constrained by the intrinsic architecture of the human visual system (e.g., geon decomposition, stroke topology). The community merely recognizes these pre-existing cognitive boundaries. | The set of admissible transformations is **stipulated**. It is constrained by the normative practices of the literacy community. The visual system is plastic enough to accept any form the community agrees to treat as invariant. | **Are the limits of letter identity found in the eye/brain or in the social contract?** | **The "Alien Glyph" Protocol:** Introduce a novel symbol to a literacy-naïve cohort vs. a literate cohort. Train them to use it as a letter. Introduce transformations that violate standard topology (e.g., closing a loop, reversing stroke order). | **E:** Literate cohort will reject transformations that violate structural invariants (e.g., topology), even if socially reinforced.<br>**C:** Literate cohort will accept any transformation if social reinforcement (reward/utility) is strong enough, overriding structural intuition. |
  | **2. Recognitional Dispositions** | Recognitional dispositions are **evidence** of an underlying essence. The fact that we recognize a degraded 'a' as an 'a' proves there is a stable structure being matched. To say "it is an 'a' because we recognize it" is circular without specifying *what* is recognized. | Recognitional dispositions are **constitutive** of identity. There is no "what" prior to the recognition. To demand a non-circular structural definition is to demand a view from nowhere; identity is exhausted by the successful practice of recognition. | **Can recognitional dispositions do the work of an essence without circularity?** | **The "Broken Font" Experiment:** Present glyphs where structural invariants are preserved but social cues are removed (e.g., isolated glyphs out of context) vs. glyphs where social context is high but structural invariants are violated (e.g., an 'a' shape used in a position where 's' is expected). | **E:** Accuracy will track structural preservation regardless of context.<br>**C:** Accuracy will track contextual probability and community usage norms, even when structure is violated. |
  | **3. The Status of Errors** | Misidentifications (e.g., children confusing *b* and *d*) are **failures** to grasp the essence. They indicate that the cognitive mechanism for extracting the invariant has not yet matured or was occluded by noise. | Misidentifications are **negotiations** of boundary conditions. They indicate that the community has not yet successfully enforced the distinction, or that the functional load does not yet require the distinction. | **Is a category error a cognitive bug or a social lag?** | **Longitudinal Correction Study:** Track how quickly children correct *b/d* reversals vs. topologically distinct errors (e.g., confusing *o* and *c*) when given identical social feedback. | **E:** Topologically distinct errors will be corrected faster because the structural difference is easier to compute.<br>**C:** Correction rates will depend entirely on the functional load of the distinction in the child's reading environment, not structural distance. |

  ## 3. ANALYSIS OF MERELY VERBAL DISPUTES

  Upon review, we identify specific areas where the dispute appears to be verbal rather than substantive. In these instances, we agree to adopt the neutral terminology of the Invariance Proposal to prevent further talk-past-each-other.

  **A. The Definition of "Structure"**
  *   **The Conflict:** Essentialists use "structure" to imply geometric or topological properties inherent to the glyph. Conventionalists hear "structure" as implying a Platonic form independent of human perception.
  *   **Resolution:** We agree that "structure" refers to **computable regularities in the stimulus array**. Whether these regularities exist "in the world" or "in the mind" is a metaphysical gloss we agree to suspend. The question is whether these regularities are *stable across observers* (Essentialist leaning) or *stable across contexts* (Conventionalist leaning).

  **B. The Meaning of "Community"**
  *   **The Conflict:** Conventionalists speak of the "community" as an active agent that confers identity. Essentialists argue the "community" is just an aggregate of individual cognitive systems sharing similar hardware.
  *   **Resolution:** We agree to treat "community" as **a network of agents sharing a transformational grammar**. The dispute is not about the existence of the community, but whether the grammar is *imported* by the agents (Essentialist) or *exported* by the network (Conventionalist).

  **C. Circularity of Recognition**
  *   **The Conflict:** Essentialists claim Conventionalism is circular ("It's an 'a' because we call it an 'a'"). Conventionalists claim Essentialism is vacuous ("It's an 'a' because it has 'a-ness'").
  *   **Resolution:** We acknowledge this is a verbal stalemate regarding the word "because."
      *   For the Essentialist, "because" refers to **causal mechanism** (visual processing).
      *   For the Conventionalist, "because" refers to **normative justification** (orthographic rules).
      *   **Agreement:** Future papers must specify whether they are making a *causal claim* (how the brain processes the glyph) or a *normative claim* (why the glyph counts in a linguistic system). The Invariance Proposal applies to the causal mechanism; the social practice applies to the normative justification.

  ## 4. NEXT STEPS

  We commit to designing the experiments listed in Section 2 jointly. Data collection will be blind to hypothesis where possible. We agree that if the "Alien Glyph" Protocol shows that structural violations cannot be overcome by social reinforcement, the Essentialist position gains significant ground. Conversely, if social reinforcement overrides structural intuition, the Conventionalist position is vindicated.

  Until such data is collected, we agree to cite the Invariance Proposal as the working definition of letter identity in all joint publications.

  ***

  **Signed,**

  *Dr. Elena Varrin (Essentialist Working Group)*
  *Dr. Julian Thorne (Conventionalist Working Group)*
