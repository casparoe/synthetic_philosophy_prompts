  I'm a cognitive-science PhD student trying to write the joint statement that two camps in the debate over letter identity could actually put their names to. On one side are the essentialists: an 'a' is an 'a' in virtue of some intrinsic structural or generative property — a topology, a stroke grammar, an invariant — that holds independently of any community's habits. On the other are the conventionalists: there is no such essence, and a form is an 'a' only because a community of readers treats it as one, the identity being exhausted by that practice. The two sides have been talking past each other, and I want to force the issue with one specific proposal to serve as common ground: that the identity of a letterform just is the class of forms invariant under the set of admissible stylistic transformations, where characterizing that set is the real work. Draft the adversarial-collaboration document. Begin with a numbered section of claims both sides can sign — about the data the dispute must accommodate (single- versus double-storey 'a' and 'g', handwritten and heavily stylized forms, degraded or partially occluded glyphs, children's letter confusions, and novel typefaces), about what would count as an essence if there were one, and about what the invariance proposal does and does not settle. Then give a disagreements table: each camp's position phrased so its own side would accept the wording; the cruxes — I suspect one is whether the admissible transformations are discovered or stipulated, and another is whether recognitional dispositions can do the work of an essence without circularity — and, for each crux, a case or argument both sides agree bears on it, with each side's prediction recorded in advance. Where the dispute turns out to be merely verbal, say which part and why.
