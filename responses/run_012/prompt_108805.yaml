      *   User's situation: High Informal/Tight (Family/Religion) + Low Formal/Loose (Traffic/Permits).
      *   Old City: Low Informal/Loose (Dress) + High Formal/Tight (Forms/Inspectors).

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Validate the observation. It's sharp and accurate. Acknowledge the limitation of the "Tight-Loose" monolith.
      *   *Section 1: Tight-Loose Theory (Gelfand).* Acknowledge it exists but confirm the user's critique. It *is* often aggregated at the national level, masking domain variation. Mention that recent work tries to fix this (multilevel), but the user is ahead of the popular curve.
      *   *Section 2: Formal vs. Informal Institutions.* This is the heavy hitter. Cite Douglass North or Helmke & Levitsky. This explains the "permits via phone call" vs. "shunning." This is the "Enforcement Axis."
      *   *Section 3: Sacred Values/Moral Foundations.* Explains *which* domains are tight. The "marked" things are sacred. The traffic stuff is profane/utilitarian.
