      *   **Comparison:** Their old city was the opposite (loose on personal expression, tight on bureaucratic enforcement). Their company also exhibits this split (tight on security/time-logging, loose on dress/process).
      *   **The Question:** Is there a name for this? How does it differ from "Tight/Loose Cultures," "Sacred Values," and "Honor Cultures"? Is "domain-specific tightness" a known claim? Is informal vs. formal enforcement a separate axis?
      *   **Constraint:** Be careful to distinguish established theory from plausible-sounding stories. Acknowledge contestation or limitations in the research. Don't present one researcher's pet theory as consensus.

  2.  **Deconstruct the Theoretical Frameworks:**

      *   **Tight-Loose Theory (Gelfand et al.):**
          *   *Concept:* Cultures vary in the strength of social norms and tolerance for deviance.
          *   *User's Critique:* It tends to treat nations/cultures as monolithic (one score per country).
          *   *Reality:* Gelfand *does* acknowledge domain specificity (e.g., in *Rule Makers, Rule Breakers*), but the cross-national indices (like the Tightness-Looseness Index) often aggregate data, masking internal variation.
          *   *Verdict:* Useful, but the user is right that it's often applied too broadly. The "multilevel" aspect is an active area of refinement.

      *   **Sacred Values / Moral Foundations (Haidt, Tetlock, etc.):**
          *   *Concept:* Some values are protected from trade-offs (sacred) vs. secular/utilitarian.
          *   *Relevance:* Explains *why* certain things are rigid (religious events, food taboos) while others are negotiable (traffic).
          *   *Verdict:* Strong fit for the *content* of the rigid norms, but doesn't fully explain the *enforcement mechanism* (shunning vs. law).

      *   **Honor/Face/Dignity Cultures (Nisbett, Cohen, Leung):**
          *   *Concept:* How reputation is maintained. Honor = defense of reputation (often violent/strong); Face = social standing within a hierarchy; Dignity = inherent worth (often legalistic).
          *   *Relevance:* The "shunning" aspect sounds like Face or Honor, but the bureaucratic looseness contradicts typical "Honor" stereotypes which often imply strict codes everywhere.
          *   *Verdict:* Partially relevant to the *social* enforcement, but doesn't capture the bureaucratic chaos.

      *   **Formal vs. Informal Institutions (North, Ostrom, Helmke & Levitsky):**
          *   *Concept:* Formal rules (laws, permits) vs. Informal constraints (norms, taboos).
          *   *Relevance:* This is the strongest fit for the *structure* the user describes. The user is observing a mismatch between formal and informal institutions.
          *   *Specific Term:* "Informal Institutions" or "Institutional Voids" or "Competing Logics."
          *   *Key Concept:* **Institutional Complexity** or **Logic Pluralism**.

      *   **Particularism vs. Universalism (Trompenaars/Hampden-Turner):**
          *   *Concept:* Do rules apply to everyone equally (Universalism) or do relationships dictate exceptions (Particularism)?
          *   *Relevance:* The "permits sorted with a phone call" is classic Particularism. The "religious dress" is Universalism within that in-group.
          *   *Verdict:* Very relevant to the bureaucracy vs. norms split.

  3.  **Synthesize the "Domain-Specific" Question:**
      *   Is tightness domain-specific? Yes, scholars acknowledge this. It's often called **Domain-Specific Normativity** or **Situational Strength**.
      *   However, the user's specific observation is about the *inverse relationship* or *compensation* between domains (Tight on A, Loose on B).
      *   There is a concept called **"Compensatory Control"** or **"Moral Licensing"** at a cultural level, but that's speculative.
      *   Better fit: **Institutional Logics** (Thornton, Ocasio). Different spheres (Family, Religion, Market, State) operate under different rules.

  4.  **Address the Enforcement Axis (Formal vs. Informal):**
      *   This is definitely a separate axis.
      *   Formal = State/Company Policy.
