      7.  Direct Answers to specific questions.

  9.  (Self-Correction during drafting): Be careful not to conflate "Honor Culture" with this. Honor cultures usually imply *violent* or *aggressive* defense of reputation. Shunning is more "Face" or "Guilt/Shame" based. I should clarify that distinction.

