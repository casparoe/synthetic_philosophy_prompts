answer: |-
  You are not reinventing the wheel, but you are correctly identifying a blind spot in how these concepts are often popularized. Your observation is precise: you are describing a society (and organization) with **high variance in norm strength across domains**, coupled with a **mismatch between formal and informal enforcement mechanisms.**

  Here is the breakdown of the established frameworks that fit your description, where they overlap, and where the current science is actually shaky.

  ### 1. Tight-Loose Theory: The Aggregation Problem
  **Status:** *Prominent but contested; your critique is valid.*

  The "Tight-Loose" framework (primarily associated with Michele Gelfand) posits that cultures vary by the strength of social norms and tolerance for deviance.
  *   **The Consensus:** There is robust data that nations differ on average.
  *   **The Contention:** The cross-national indices often treat countries as monoliths (e.g., "Japan is Tight," "Brazil is Loose"). This is where your critique lands. Recent methodological criticism in cross-cultural psychology suggests these scores mask massive within-culture variance.
  *   **Domain Specificity:** Gelfand and colleagues *do* acknowledge that tightness varies by domain (e.g., a culture might be tight on religion but loose on traffic). However, this nuance is often lost in the "country score" version of the theory that makes it into management books.
  *   **Verdict:** You are describing **Domain-Specific Norm Strength.** This is a known claim in sociology, but it is often obscured by the "national culture" branding of the Tight-Loose theory. You are not reinventing it, but you are right to reject the "one bucket" application of it.

  ### 2. Formal vs. Informal Institutions
  **Status:** *Well-established in Political Science and Institutional Economics.*

  This is the strongest fit for your "enforcement axis" question.
  *   **The Theory:** Douglass North (Nobel laureate) and later Helmke & Levitsky distinguish between **Formal Institutions** (constitutions, laws, company HR policies) and **Informal Institutions** (norms, taboos, codes of conduct).
  *   **The Mismatch:** In many developing or transitional economies (and specific subcultures), these two do not align.
      *   **Your Old City:** High Formal Enforcement / Low Informal Enforcement. (The state/company polices you; neighbors don't).
      *   **Your New City:** Low Formal Enforcement / High Informal Enforcement. (The state/company is porous; the community polices you).
  *   **The Term:** When informal rules override formal ones (like the permits sorted by phone call), political scientists call this **"Informal Institutions Substituting for Formal Institutions."** When they conflict, it is **"Institutional Incoherence."**
  *   **Answer to your axis question:** Yes, enforcement mechanism (Formal vs. Informal) is a **separate axis** from norm strength (Tight vs. Loose). You can have Tight/Informal (shunning for dress), Tight/Formal (jail for theft), Loose/Informal (no one cares), or Loose/Formal (laws on the books but not enforced).

  ### 3. Sacred Values vs. Secular Trade-offs
  **Status:** *Established in Moral Psychology and Anthropology.*

  You noted that the rigid rules "don't seem to be the important ones in any obvious sense — they're just the ones that got marked."
  *   **The Theory:** Philip Tetlock and Jonathan Haidt distinguish between **Sacred Values** (protected from trade-offs, non-negotiable) and **Secular/Utilitarian Values** (open to cost-benefit analysis).
  *   **Application:** In your new city, religious dress and family timing are *Sacred*. Violating them is a moral transgression, not a logistical error. Traffic and permits are *Secular*. They are viewed as practical problems to be navigated, not moral tests.
  *   **Difference from Tight-Loose:** Tight-Loose measures the *intensity* of the reaction. Sacred Value theory explains the *content* of the rule. A culture can be "Loose" generally but have specific "Sacred" pockets that trigger extreme reactions.
  *   **Verdict:** This explains *why* the rigidity is located where it is. It is not about "order" (traffic); it is about "purity" or "loyalty" (family/religion).

  ### 4. Universalism vs. Particularism
  **Status:** *Established in Cross-Cultural Management (Trompenaars/Hampden-Turner).*

  This addresses the "permits get sorted with a phone call" vs. "written down and enforced by forms" dynamic.
  *   **Universalism:** Rules apply to everyone equally, regardless of relationship. (Your old city).
  *   **Particularism:** Obligations to relationships (family, friends, in-group) take precedence over abstract rules. (Your new city).
  *   **The Connection:** In Particularist cultures, the "Formal" rules are often viewed as a baseline or a facade, while the "Real" rules are negotiated through relationships. This is why the bureaucracy feels like a free-for-all; you are expected to navigate it via relationships, not forms.
  *   **Verdict:** This is a distinct axis from Tight-Loose. A culture can be Tight (strict norms) but Particularist (rules bend for friends).

  ### 5. Institutional Logics
  **Status:** *Established in Organizational Sociology (Thornton, Ocasio).*

  This addresses your company example (rigid on security, chaotic on process).
  *   **The Theory:** Societies and organizations are not unified wholes; they are composed of different **spheres** (Family, Religion, Market, State, Corporation). Each sphere operates under a different "logic."
  *   **Application:**
      *   **Family/Religion Logic:** Based on loyalty, tradition, and unconditional obligation. (Hence: rigid timing, dress, food).
      *   **Market/State Logic:** Based on efficiency and contracts.
      *   **The Conflict:** In your new location, the **Community Logic** (informal, sacred) is dominating the **State Logic** (formal, bureaucratic). In your company, the **Compliance Logic** (legal risk) is Tight, while the **Operational Logic** (getting work done) is Loose.
  *   **Verdict:** This is the best framework for understanding why the rules "don't hang together." They aren't supposed to; they belong to different competing systems of order.

  ### Summary of Differences

  | Concept | What it explains | Where it falls short for you |
  | :--- | :--- | :--- |
  | **Tight-Loose** | Strength of norms & punishment. | Often aggregates whole nations; misses domain variance. |
  | **Sacred Values** | *Which* rules are non-negotiable. | Doesn't explain the bureaucratic chaos (secular domain). |
  | **Honor Culture** | Defense of reputation. | Usually implies violence/aggression; your "shunning" is more about **Face** or **Purity**. |
  | **Formal/Informal Institutions** | *How* rules are enforced (Law vs. Shunning). | **This is the missing axis you identified.** |
  | **Particularism** | Why rules bend for relationships. | Explains the "phone call" permits specifically. |

  ### Direct Answers to Your Questions

  **1. Is there a name for this?**
  In political science and sociology, this is often called **"Institutional Duality"** or **"Competing Institutional Logics."** In a more specific cultural context, you are describing a **High-Context, Particularist culture with Strong Informal Institutions and Weak Formal Institutions.**

  **2. How does it differ from Tight-Loose?**
  Tight-Loose measures the *temperature* of the culture. You are describing the *plumbing*. A country can score "Tight" on an index because of its family norms, while its traffic laws are "Loose." The index often averages these, losing the data you are experiencing.

  **3. Is "tightness is domain-specific" a known claim?**
  Yes. In academic literature (e.g., *Uz, 2015; Gelfand et al., 2011*), domain specificity is acknowledged. However, in popular business literature, it is frequently flattened into national stereotypes. You are correct to be skeptical of the "one bucket" version.

  **4. Is informal enforcement a separate axis?**
  **Yes.** This is the most critical distinction.
  *   **Axis 1: Norm Strength** (How much do they care?)
  *   **Axis 2: Enforcement Mechanism** (Who polices it? State vs. Community).
  Your old city: High State / Low Community.
  Your new city: Low State / High Community.
  These are functionally different systems of social control, not just variations of "strictness."

  **5. A Note on "Honor Culture"**
  Be careful with this label. "Honor Cultures" (Nisbett/Cohen) typically refer to environments where reputation is defended aggressively (often physically) against insults. What you are describing (shunning, quiet exclusion) is closer to **"Shame Culture"** (Benedict) or **"Face Culture"** (Hu). The penalty is social death, not physical duel. This aligns with the "Sacred Values" framework (violation of purity/loyalty) rather than Honor (violation of strength/reputation).

  ### A Warning on the Data
  You asked for caution regarding established vs. plausible.
  *   **Solid:** The distinction between Formal and Informal Institutions (North/Helmke) is standard political science.
  *   **Solid:** The distinction between Sacred and Secular values (Tetlock/Haidt) is standard psychology.
  *   **Contested:** The "Tight-Loose" national rankings. Cross-cultural psychology is currently facing a replication crisis. Many "cultural dimension" scores rely on self-report surveys that suffer from reference-group effects (people compare themselves to their neighbors, not the world). Treat the "Country Score" as a heuristic, not a physical law.
  *   **Speculative:** The idea that cultures *compensate* (i.e., "We are loose on traffic *because* we are tight on religion) is a plausible narrative, but there is little empirical evidence that cultures intentionally balance tightness across domains. It is more likely that different domains simply evolved under different historical pressures (e.g., religion survived colonialism, state bureaucracy did not).

  ### Conclusion
  You are living in a system with **Strong Informal Institutions** and **Weak Formal Institutions**, where **Sacred Values** dictate the former and **Particularism** dictates the latter. The "Tight-Loose" label is too blunt an instrument for this; it captures the intensity but misses the architecture. Your company mirrors this because it is embedded in the same broader institutional environment, or because it is managing risk (compliance) differently than operations (workflow).
