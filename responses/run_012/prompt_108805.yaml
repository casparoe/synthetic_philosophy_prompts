  7.  **Final Polish:**
      *   Ensure tone is respectful of the user's insight (they are essentially doing ethnography).
      *   Make sure the distinction between "Norm Strength" (Tight/Loose) and "Enforcement Mechanism" (Formal/Informal) is crystal clear.
