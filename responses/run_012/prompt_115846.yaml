      *   *Synchronic vs. Diachronic:* Keep it synchronic (one point in time). Mention diachronic (updating) as a separate thing to exclude.
      *   *Limitations:* Pragmatic vs. Epistemic. It shows inconsistency, not necessarily falsehood.
      *   *Closing Question:* Needs to probe the *why*, not the *how*.
      *   *Exclusions:* Bayes' theorem details, utility theory nuances, detailed history.

  4.  **Refining the Example:**
