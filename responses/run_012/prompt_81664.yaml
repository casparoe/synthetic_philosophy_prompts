      *Actually, the most accurate scholarly verdict (e.g., Plantinga, Kripke's reading of Leibniz) is that Leibniz is a **Transworld Identity** theorist who struggles with PII.* Kripke argues Leibniz believes in TWI. But the prompt asks me to argue it out of *Complete Concepts*. Complete Concepts suggest CT.
      *Let's take a bold stance:* **Leibniz is a Transworld Identity theorist who is logically committed to Counterpart Theory.** For the exercise, treat him as a **Counterpart Theorist** to see where the system breaks.
      *Wait, better:* **Verdict: Transworld Identity.** Why? Because for Leibniz, the "Complete Concept" is the *individual*. If God conceives of "Leibniz" with different predicates, is it the same concept? Leibniz says yes, it's the same *possible substance* considered under different conditions. The "Complete Concept" is complete *relative to a world*.
      *No, that's weak.* The standard reading (e.g., Rescher, Mondadori) is that Leibniz's individuals are world-bound.
      *Okay, I will argue for **Counterpart Theory** as the strict implication of his metaphysics, even if he speaks like a TWI theorist.* This makes for a better exercise (finding the contradiction).

      *Refining the "Third Option":* This is the "Conceptual Containment" problem. If "philosopher" is in the concept, he can't be a shoemaker. Leibniz's solution: The concept contains "philosopher" *in this world*. In another world, the concept is slightly different. This implies CT.
