      *   *Contingency:* Leibniz wants to save contingency. Truths of fact vs. truths of reason. Infinite analysis.
      *   *Identity:* The Identity of Indiscernibles (PII). No two substances share the exact same complete concept.
      *   *Transworld Identity:* Does the *same* substance exist in different possible worlds? Or are substances world-bound?

  3.  **Evaluate the Options against Leibniz:**

      *   *Option A: Transworld Identity (TWI).* The *numerically identical* Leibniz exists in World W1 (philosopher) and World W2 (shoemaker).
