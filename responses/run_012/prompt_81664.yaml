answer: |-
  Here is a verdict and argumentative framework for your reading group exercise.

  ### The Verdict
  **Leibniz is ontologically committed to Counterpart Theory, though he speaks like a Transworld Identity theorist.**

  If you force him to choose based on the strict logic of his *Complete Concept* doctrine and the *Identity of Indiscernibles* (PII), he cannot hold that the *numerically identical* Leibniz exists in another possible world. A "Leibniz-who-is-a-shoemaker" is discernible from the actual "Leibniz-who-is-a-philosopher." By PII, discernible things are distinct individuals. Therefore, the shoemaker is a *counterpart*, not the *same* substance.

  However, Leibniz *wants* Transworld Identity (TWI) to make sense of divine choice and human freedom. To make his system yield a clean TWI verdict, he would have to betray his own metaphysics.

  ---

  ### The Argument from Complete Concepts
  Leibniz's core metaphysical commitment is that an individual substance is defined by a **Complete Concept**. This concept contains, *in principle*, every predicate true of that substance across its entire history ("Caesar crossed the Rubicon" is analytically contained in the concept of Caesar).

  1.  **The PII Constraint:** Leibniz holds that there are no two substances that are exactly alike. If Substance A has predicate *P* (philosopher) and Substance B has predicate *~P* (shoemaker), they are discernible. If they are discernible, they are not identical.
  2.  **World-Boundness:** A possible world, for Leibniz, is a maximal set of **compossible** substances. Substance A is compossible with Set 1 (the actual world). Substance B (the shoemaker version) belongs to Set 2 (a non-actual world). Since A and B have different complete concepts, they are different individuals.
  3.  **The Result:** When we say "Leibniz could have been a shoemaker," we are strictly speaking about a *different individual* in God's understanding who resembles the actual Leibniz closely but differs in specific predicates. This is precisely David Lewis's Counterpart Theory: modality is a relation of similarity between distinct individuals across worlds, not identity across worlds.

  ### Where Leibniz Has to Bend
  To salvage Transworld Identity (the view that it is *literally* Leibniz in both worlds), Leibniz would have to introduce a **haecceity** or a "bare particular"—a substratum of "thismess" that persists independently of the predicates contained in the complete concept.

  He would need to say: *"There is an underlying 'Leibniz-ness' that remains constant, while the predicates (philosopher/shoemaker) vary."*

  **Why he can't do this:** This violates his rejection of bare particulars. For Leibniz, a substance *just is* its concept/predicates. There is no "hook" underneath the predicates to hold onto for transworld identification. If you strip away the predicates to find the "real" Leibniz, you are left with nothing. To get TWI, he must bend his ontology to allow that the Complete Concept is not *entirely* complete until a world is selected, or that the concept includes a "variable" slot for contingent properties. Both moves undermine the analyticity of all predication, which is the engine of his system.

  ### The Third Option: The Threat of Spinozism
  Your "Third Option" is the most dangerous wrinkle: **Hard Actualism.**

  If the Complete Concept pins down *every* predicate essentially, then "Leibniz-the-shoemaker" is not a possible version of Leibniz; it is a logical impossibility for *that* individual. On this reading, there is no sense in which Leibniz could have been otherwise. There is only the actual Leibniz, and his properties are necessary.

  **Where this leaves TWI and CT:**
  If the Third Option holds, **both TWI and CT are category errors.**
  *   **TWI fails** because there is no "other world" Leibniz to be identical to.
  *   **CT fails** because there is no "other world" counterpart that counts as a genuine possibility *for Leibniz*. It's just a different person entirely.

  This collapses modality into actuality (Spinozism). Leibniz spends his career fighting this. He insists on **Hypothetical Necessity**: *Given* that God chose this world, Leibniz must be a philosopher. But God *could* have chosen a different world containing a counterpart. To avoid the Third Option, Leibniz must insist that the Complete Concept is necessary *per se*, but its *existence* is contingent. He walks a tightrope: the concept is fixed, but its instantiation is not.

  ### The Friend's Objection: God's Choice
  Your friend is raising the **Necessitarian Objection**: *If God is perfect and chooses the best world, and this is the best world, could God have chosen otherwise? If not, everything is necessary.*

  **Verdict on the Friend:** This is a **confusion**, specifically a conflation of God's **Intellect** and God's **Will**.

  1.  **The Region of Possibility (Intellect):** Before God wills anything, all possible worlds exist as ideas in the Divine Intellect. Their possibility is grounded in the Principle of Non-Contradiction, not God's Will. "Leibniz-the-shoemaker" is a coherent concept in the Intellect regardless of whether God chooses it. This secures the *possibility* (the "could have been").
  2.  **The Act of Creation (Will):** God's Will selects the best compossible set for existence. This secures the *actuality*.

  **The Reply:** Your friend is arguing that God's Will determines Possibility (Voluntarism). Leibniz is an Intellectualist: Possibility constrains the Will. God *must* choose the best, but the "menu" of options exists independently of the choice. Therefore, the fact that God *did* choose the philosopher-world does not erase the metaphysical reality of the shoemaker-world as a genuine possibility in the Divine Understanding.

  ### Summary for the Group
  *   **Strict Metaphysics:** Counterpart Theory (PII + Complete Concepts make individuals world-bound).
  *   **Theological Language:** Transworld Identity (Leibniz speaks of "possible Adams" to preserve responsibility).
  *   **The Danger:** The Complete Concept doctrine threatens to collapse all modality (The Third Option).
  *   **The Escape:** Distinguish God's Intellect (possibility) from God's Will (actuality) to refute the friend's necessitarianism.

  **Exercise Prompt:** Ask the group to try to formulate a sentence about "Possible Leibniz" that satisfies PII without collapsing into the Third Option. They will likely find they have to smuggle in a haecceity (violating Leibniz) or accept Counterpart Theory (violating Leibniz's intuition about freedom).
