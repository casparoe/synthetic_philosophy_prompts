  5.  **Addressing the "Bending" Requirement:**
      *   Where does he have to bend? He has to bend the notion of "Individual." He must treat the individual not as the *haecceity* (thisness) that persists across worlds, but as a *cluster of properties* that can be varied slightly to create a "possible" version. He needs to separate the "substrate" from the "predicates," which his Complete Concept doctrine explicitly forbids.

