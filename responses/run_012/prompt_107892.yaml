answer: |-
  Your predicament is a classic symptom of trying to force non-consequentialist intuitions into a consequentialist framework. Your "seminar self" is defending a position that sounds consequentialist (inefficacy doesn't absolve), but your "gut self" is issuing verdicts that are largely deontological or virtue-ethical (focused on participation, integrity, and duty). The "marginal cause" principle you tentatively proposed is strictly consequentialist; it is no wonder it fails to capture your intuitions about voting, dye, and leftover burgers.

  You do not need to abandon your seminar position, but you do need to abandon the idea that *harm-causation* is the sole source of wrongness in these cases. Below is a single unified account that captures your verdicts by shifting the locus of evaluation from **outcomes** to **practices**.

  ### The Principle of Normative Participation

  **Core Thesis:** An individual act is morally evaluable based on the normative status of the *practice* it participates in, weighted by the agent's causal leverage and justificatory context.

  **Clause 1 (The Defect Condition):** Participation in a morally defective practice (one that systematically produces harm or injustice) is *pro tanto* wrong.
  *   *Motivated by:* Daily driving, crowded restaurant burger.
  *   *Verdict:* These acts participate in carbon-intensive and cruelty-intensive markets. They are weakly wrong even without marginal impact.

  **Clause 2 (The Inertia Exception):** Participation in a defective practice is permissible if the act is causally inert regarding the practice's continuation (i.e., it signals no demand and consumes no additional resources).
  *   *Motivated by:* Leftover burger, empty repositioning seat, declining meat already ordered.
  *   *Verdict:* These acts do not sustain the defective practice; they merely consume its waste or utilize sunk costs. They are nearly innocent.

  **Clause 3 (The Justification Override):** Participation in a defective practice is permissible if required by a weightier competing moral obligation (e.g., special duties to family).
  *   *Motivated by:* Annual commercial flight to see parents.
  *   *Verdict:* The duty to maintain familial bonds overrides the duty to avoid complicity in carbon emissions, provided the participation is minimized (commercial vs. private).

  **Clause 4 (The Civic Duty Condition):** Participation in a morally required practice (one essential for political legitimacy or justice) is obligatory, regardless of marginal impact.
  *   *Motivated by:* Voting in a safe state.
  *   *Verdict:* Voting sustains a legitimate democracy. Abstention violates a duty of citizenship, even if the vote doesn't change the outcome.

  **Clause 5 (The Threshold Trigger):** Any act that singly triggers a discrete, visible harm is categorically wrong, regardless of the practice's status.
  *   *Motivated by:* The threshold-tipping dye drop, the private jet.
  *   *Verdict:* The private jet is wrong both by Clause 1 (extreme defect) and Clause 5 (massive marginal harm). The threshold dye is wrong solely by Clause 5.

  **Clause 6 (The Neutral Practice Rule):** Participation in a morally neutral practice with no threshold trigger is permissible.
  *   *Motivated by:* The non-threshold dye drop.
  *   *Verdict:* Dyeing a pool is not inherently defective. Without a threshold trigger, there is no wrong.

  ---

  ### Application to Your Cases

  | Case | Principle Clause | Verdict | Matches Intuition? |
  | :--- | :--- | :--- | :--- |
  | **Daily Driving** | Clause 1 (Defect) | Mildly Wrong | Yes |
  | **Commercial Flight** | Clause 3 (Justification) | Not Wrong | Yes |
  | **Private Jet** | Clause 1 & 5 (Defect/Threshold) | Clearly Wrong | Yes |
  | **Burger (Crowded)** | Clause 1 (Defect) | Weakly Wrong | Yes |
  | **Burger (Leftover)** | Clause 2 (Inertia) | Nearly Innocent | Yes |
  | **Voting (Safe State)** | Clause 4 (Civic Duty) | Obligatory | Yes |
  | **Dye (Non-Threshold)** | Clause 6 (Neutral) | Not Wrong | Yes |
  | **Dye (Threshold)** | Clause 5 (Trigger) | Categorically Wrong | Yes |
  | **Boycott** | Clause 1 (Inverse) | Meaningful/Good | Yes (as avoidance of defect) |
  | **Empty Seat** | Clause 2 (Inertia) | Neutral | Yes |
  | **Declining Meat (Ordered)**| Clause 2 (Inertia) | No Obligation | Yes |

  ### Application to New Cases

  **1. Buying a single cheap item made in a sweatshop.**
  *   **Analysis:** This falls under **Clause 1 (The Defect Condition)**. The practice of sweatshop labor is morally defective (exploitation). Buying the item signals demand and participates in the market. It does not fit **Clause 2 (Inertia)** unless you have specific knowledge that the item would otherwise be destroyed and the purchase price doesn't go to the manufacturer (unlikely for a standard purchase).
  *   **Verdict:** **Weakly Wrong.** It is analogous to the crowded restaurant burger. It is an act of complicity in a harmful structure, even if your single purchase doesn't causally determine the worker's exploitation.

  **2. Going vegetarian where it genuinely reduces production by one animal.**
  *   **Analysis:** This falls under **Clause 5 (The Threshold Trigger)** and **Clause 1**. Here, you have marginal efficacy. You are preventing a discrete harm (the death of one animal).
  *   **Verdict:** **Strongly Obligatory.** While the "Defect Condition" makes eating meat weakly wrong generally, the confirmed marginal impact makes abstention strictly required. This is the one case where your "marginal cause" intuition and the "Practice" intuition converge perfectly.

  ### Theoretical Cost: What You Must Give Up

  This principle captures your verdicts, but it comes with a philosophical cost. To maintain this view, you must abandon the idea that **moral wrongness in collective cases must be grounded in individual difference-making.**

  1.  **Rejection of Pure Consequentialism:** You must accept that an act can be wrong even if the world is exactly the same with or without it (e.g., the non-threshold dye vs. the daily drive). The wrongness of the drive lies in *what you are doing* (participating in harm), not *what you are causing*.
  2.  **Acceptance of "Practice" Ontology:** You are committing to the claim that "practices" (like the carbon economy or the meat market) are real moral entities that individuals can join or leave, independent of their causal leverage. This invites the "fallacy of division" charge from your friend. You must argue that responsibility for a practice is *shared*, not *divided*. You are not responsible for 1/8-billionth of the climate change; you are responsible for 100% of your own participation in the practice that causes it.
  3.  **The "Voting" Anomaly:** You must accept that the "Voting" case is structurally different from the "Dye" case not because of physics or probability, but because of **normative status**. This requires a robust theory of political obligation that stands apart from harm-avoidance.

  ### Which Verdict to Sacrifice?

  If you find the "Practice" ontology too metaphysically heavy, the verdict you should sacrifice is **Daily Driving**.

  If you insist on a strict marginalist view (your tentative principle), you must concede that driving is **not wrong** (or no more wrong than the dye drop). However, given your status as a philosopher of collective responsibility, I recommend sacrificing the **Marginalist Principle** instead. Your intuitions about the leftover burger and the voting booth are robust and widely shared in the literature on complicity. They suggest that morality is about *who we are* and *what we join*, not just *what we change*.

  Your "seminar self" is right: the inefficacy objection is too quick. But your "gut self" is also right: inefficacy doesn't make every act wrong. The bridge between them is not causal impact, but **complicit participation**.
