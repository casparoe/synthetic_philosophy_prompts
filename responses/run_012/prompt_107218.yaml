      *   **Wait, the prompt asks for:** "Ending turn on something specific to this world: maybe she has to audit someone close to her, or she finds an earlier audit that contradicts her own method."
      *   **Decision:** She finds an earlier audit that contradicts her method. She discovers a file on her own predecessor/mentor. The mentor taught her to prioritize Memory over Concern. She finds the mentor's audit: Memory 100%, Concern 40%. Verdict: Pass. She realizes the system prioritizes functional continuity over moral continuity. Now she has Julian (Memory 100%, Concern 50%). If she fails him, his family gets nothing. If she passes him, she validates a lie.
      *   **Structure:**
          1.  Intro: Elara at work, the mechanics of the audit.
