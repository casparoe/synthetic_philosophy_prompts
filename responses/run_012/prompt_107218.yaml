  3.  **Drafting - Section by Section:**
      *   *Tone:* Cold, clinical, but with underlying emotional weight.
      *   *Voice:* First-person (Elara).
      *   *Word Count Check:* Need to ensure it hits 1200-1800.
      *   *Philosophy:* Weave Parfit's *Reasons and Persons* ideas without naming them explicitly. Focus on "what matters" vs. "identity."

  4.  **Refining the "Concern" Concept:**
      *   How to show "low concern"? Julian remembers he loved his wife, but looks at her like a museum exhibit. He remembers he promised to finish the symphony, but says, "That guy wanted to. I don't see the point."
      *   The "Audit" interface: Sliders for Memory, Trait, and... Volition? No, let's call it "Investment."
      *   The Twist: She finds her own file? No, the prompt suggests "earlier audit that contradicts her own method." Let's go with the Mentor file. It shows the company *knows* the gap exists and ignores it.

  5.  **Writing - Step-by-Step:**
      *   *Opening:* Establish the mundane nature of transport and the specific role of the auditor.
