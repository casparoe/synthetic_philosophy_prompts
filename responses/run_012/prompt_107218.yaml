      *   **Scene:** The audit interview. The protagonist (Auditor) sitting across from the "Survivor" (the rebuilt person). Maybe reviewing logs simultaneously.
      *   **Resisting the Obvious:** Avoid the "is he a clone?" panic. Everyone accepts teletransportation. The conflict isn't "is this magic?" it's "is this *him* enough to pay the widow?" Avoid the protagonist auditing themselves (too cliché). Instead, let's have her audit someone whose case mirrors a past failure of hers, or someone whose "lack of care" is actually a rational evolution, challenging her metric.
