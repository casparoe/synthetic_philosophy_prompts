      *   **Constraints:** Avoid worn-out examples (sleeping pill, amoeba, brain transplant). Ending must turn on something specific to this world (audit someone close, contradicting earlier audit, etc.). Natural dialogue.

  2.  **Brainstorming & Planning:**
