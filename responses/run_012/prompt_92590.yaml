          *   Follow-up: Do you have to reject Bayes' theorem for propensities?

      *   *Q4: Determinism.*
          *   Draft: Can propensities exist if physics is deterministic?
          *   Refinement: If Laplace's Demon is possible, are propensities 0 or 1? Is your view tied to QM?
          *   Follow-up: If QM turns out to be deterministic (Bohmian), is your theory dead?

      *   *Q5: Reference Class.*
          *   Draft: Whose propensity is it?
          *   Refinement: The atom vs. the lump. The specific setup vs. the general type. How do you fix the class without arbitrariness?
          *   Follow-up: Doesn't this slide back into frequentism (the class of repeated trials)?

      *   *Q6: Falsifiability/Evidence.*
          *   Draft: How do we prove you wrong?
          *   Refinement: If frequencies diverge from propensities (law of large numbers allows this), how do we ever test it?
          *   Follow-up: Is it unfalsifiable in principle for finite data?

      *   *Q7: Causal Power vs. Probability.*
