          *   Must include specific topics: Ontology of propensities (what *is* it?), Single-case truthmakers (what makes it true for *this* atom?), Conditional probability paradoxes (Humphreys' paradox), Determinism vs. Indeterminism, Reference Class problem, Empirical falsifiability/evidence.
          *   Format: Question + Likely Answer + Follow-up.
          *   Tone: Respectful but rigorous, avoiding "how did you get started" fluff.

  2.  **Deconstruct the Propensity Interpretation:**
      *   *Core Idea:* Probabilities are objective physical tendencies (propensities) inherent in situations/objects to produce outcomes.
      *   *Key Proponents:* Popper (long-run), Mellor (single-case), Humphreys.
      *   *Key Problems:*
          *   **Ontology:** Are they dispositions? Relations? Magic?
          *   **Single Case:** How to verify a probability for a unique event that never repeats?
          *   **Humphreys' Paradox:** Propensities seem asymmetric (cause -> effect), but probability calculus (Bayes' theorem) is symmetric ($P(A|B) \neq P(B|A)$). If propensities *are* probabilities, this breaks.
          *   **Determinism:** If the world is deterministic, are propensities zero or one? Does the theory collapse?
          *   **Reference Class:** Is the propensity of *this* coin toss determined by the coin, the thrower, the air resistance, the universe?
          *   **Triviality/Observability:** If we only know propensities via frequencies, are they just frequencies in disguise?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Q1: Ontology (The "What is it?" question).*
