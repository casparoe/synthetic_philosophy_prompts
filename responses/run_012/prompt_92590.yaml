          *   Refinement: Critics say it's an "occult quality." How do you distinguish a scientific propensity from Molière's "dormitive virtue"?
          *   Follow-up: What explanatory work does it do that frequencies don't?

      *   *Q9: Long-Run vs. Single-Case.*
          *   Draft: Popper vs. Mellor.
          *   Refinement: Popper said long-run, you seem to say single-case. Why the shift? Does long-run save the empiricism?
          *   Follow-up: If single-case, how do we access it?

      *   *Q10: Practical Utility.*
          *   Draft: Does this matter for science?
          *   Refinement: Do working physicists use propensities, or just the math? Does your interpretation change how experiments are run?
          *   Follow-up: If it doesn't change practice, is it purely metaphysical?

