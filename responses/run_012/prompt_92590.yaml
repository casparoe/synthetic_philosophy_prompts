prompt: |-
  So I do this tiny podcast on the side — my day job is writing backend code so I'm way out of my depth half the time — and next month's guest is a philosopher of science who defends the propensity interpretation of probability. I know the basic pitch already: probabilities aren't just long-run frequencies or degrees of belief, they're real tendencies in the world, like the tendency of a radium atom to decay or a coin to come up heads. But I don't want him to just do the intro-level version on air, we've only got an hour and I want to actually press him on the stuff that gets swept under the rug.

  Could you draft eight to ten interview questions for me? I'd like at least one that forces him to say precisely what a propensity IS — a disposition of the individual object, a relation between the object and the setup you measure it in, or just a primitive thing we posit and stop explaining — and whether he thinks that's a real difference or just relabeling. One about the single-case claim: when he says this particular atom has a 50% propensity to decay in the next hour, what's true of the world that isn't true of a different atom with 30%, stated without quietly sneaking in a frequency or a personal credence. One about the mess that probabilities seem to come in conditional form (the chance of A given B) while propensities look like they belong to whole setups and can't be conditionalized the same way — I read somewhere that you get a straight contradiction if you treat them as both, but I can't reconstruct it, so have him walk through what goes wrong and whether his version dodges it. And one about whether propensities can even exist in a deterministic world; if he says no, I want him to say whether that makes the whole view a metaphysical commitment or an empirical bet that quantum mechanics stays indeterministic. I'd also throw in something on the reference class thing (whose propensity is it, the atom's or the lump of uranium's?) and on what would actually count as evidence against the view, since my worry is that a real tendency you can never observe except through the frequencies it's supposed to explain might be doing no work at all.

  For each question, give me the answer he's most likely to give and a follow-up keyed to that answer, so I'm not left improvising when he gives the standard reply. And please nothing like "what got you into philosophy of science" — he'll just say he was always into science and we'll burn five minutes.
