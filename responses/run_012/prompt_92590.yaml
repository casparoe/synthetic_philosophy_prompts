          *   Refinement: If a propensity is a tendency to produce, is it distinct from causal power? Why do we need the math of probability?
          *   Follow-up: If it's just causal strength, why does it obey the Kolmogorov axioms?

      *   *Q8: The "Magic" Objection.*
