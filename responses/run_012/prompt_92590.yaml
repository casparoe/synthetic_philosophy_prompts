      *   I need to simulate a competent philosopher of science. They will likely defend a "Single-Case Propensity" view (like Mellor or Humphreys) or a "Long-Run Propensity" view (like Popper). Given the prompt mentions "radium atom," single-case is the likely target.
      *   *Likely Answer Strategy:* They will try to ground it in physical symmetries or quantum states. They will try to distinguish propensities from frequencies by appealing to the *explanation* of the frequency.
