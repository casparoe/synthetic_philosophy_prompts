prompt: |-
  I'm helping put together materials for a small reading group on the regress problem — you know, the Agrippa/Münchhausen trilemma thing where every belief either rests on a basic belief, or on other beliefs in a circle, or on an endless chain of further beliefs — and I'm tired of handing people yet another flowchart. So I'd like something funnier instead: write me a parody of a software company's help-center FAQ for a fictional startup whose product is basically "belief justification as a service." You can name it whatever you want (Justifai, Groundr, whatever's funny) — that's just a placeholder. The whole conceit is that the company has quietly turned the three horns of the regress into three pricing tiers, and the deadpan customer-support voice has to sell each one without ever admitting which horn it is. The free tier hands you a small set of "basic beliefs" you're just supposed to accept as self-evident and non-refundable; the mid tier gives you a closed loop where all your beliefs support each other, and the more you believe the more you're entitled to believe; the premium tier is an unlimited recursive justification plan that never actually finishes, and the fine print insists this is a feature, not a bug. I want the fine print and the FAQ answers to quietly take real positions — what counts as a "basic" belief and who audits it, whether a circular chain voids the warranty, what happens when a user keeps asking "but why?" behind the reason behind the reason, and the refund policy for a justification that never terminates.

  The important thing is that the satire be fair: someone who's actually an infinitist or a coherentist should read it and grin, not wince. So get the standard objections right and then let the company spin each one as a perk — the arbitrariness/dogmatism charge against foundationalism, the isolation and "rival coherent systems" charge against coherentism, the "no finite mind can actually hold an infinite chain" charge against infinitism. Keep it deadpan, no winking at the reader, and let it land for someone who knows the literature while still being readable to a friend who's never heard of any of this. About 600-700 words, formatted as a numbered FAQ.

  Give me the response in two sections, in this order: first the FAQ itself, and then a section titled "Notes on the satire," about 150 words, where you tell me which specific objections you were targeting in each tier and where you were worried a specialist might think you'd fudged it.
