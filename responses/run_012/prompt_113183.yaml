answer: |-
  # Groundr.io Help Center

  **Welcome to Groundr.** Thank you for choosing Justification-as-a-Service. Below are answers to common questions regarding our epistemic infrastructure plans.

  **1. What plan fits my epistemic needs?**
  Groundr offers three distinct validation architectures. The **Anchor Plan (Free)** provides immediate stability by resting your beliefs on a curated set of self-evident Core Truths. These require no further processing and are optimized for quick decision-making. The **Mesh Plan (Standard)** utilizes a dynamic network where beliefs derive validity from their mutual support within your existing worldview. This ensures high internal consistency without relying on external inputs. The **Vector Plan (Premium)** offers unlimited recursive depth. For users who prefer continuous inquiry, Vector generates a fresh justification for every reason provided, ensuring you never settle for an unexamined premise.

  **2. What is the refund policy for unfinished justifications?**
  Refunds are processed based on plan termination conditions. Anchor users should note that Core Truths are non-refundable and non-negotiable; once accepted, they are locked to prevent regress. Mesh users are eligible for refunds only if internal consistency drops below 95%, though isolated belief clusters may void this warranty. Vector Plan subscribers should be aware that because justification is an infinite process, no ticket is ever marked "Resolved." Therefore, the Vector Plan does not offer refunds for non-termination. Our Terms of Service classify "completion" as a legacy metric; Vector users are billed for engagement, not conclusions.

  **3. Who audits the Core Truths in the Anchor Plan?**
  Groundr does not audit Core Truths, as auditing implies the possibility of error. Anchor beliefs are designated as "Basic" by virtue of their psychological irresistibility and historical uptime. While critics argue this selection process is arbitrary, we frame it as "optimized latency." You are free to inspect the Core Truths, but please note that any tools used to inspect them must themselves be grounded in those same Core Truths. Attempting to validate the foundation using outside standards will trigger a security warning regarding category errors.

  **4. Does the Mesh Plan support data from outside my current belief system?**
  The Mesh Plan is designed for internal coherence, not external correspondence. Importing conflicting data from rival belief ecosystems may destabilize your network's integrity. While some users report isolation from objective reality, we consider this a firewall feature that protects against contradictory evidence. If your Mesh becomes too coherent, it may detach from empirical input, but this ensures your system remains logically airtight. We recommend upgrading to Vector if you require constant external validation, though be advised this may reintroduce instability.

  **5. When does the Vector Plan terminate?**
  Vector is built on the principle that justification is a journey, not a destination. There is no final stop. Users concerned about finite cognitive capacity should utilize our "Deferred Processing" feature, which allows you to promise yourself you'll examine the next reason later. While skeptics claim no finite mind can hold an infinite chain, Vector treats this as a scalability challenge rather than a logical flaw. Your subscription remains active as long as you can formulate the question "But why?" Please note: Continuous questioning may impact real-world functioning, but Groundr is not liable for paralysis by analysis.

  ***

  # Notes on the satire

  This FAQ maps the Münchhausen trilemma directly onto SaaS pricing models. The **Anchor Plan** targets **Foundationalism**, spinning the objection of arbitrariness (why *these* basics?) as "optimized latency" and noting the circularity of validating foundations (the "category error" warning). The **Mesh Plan** targets **Coherentism**, addressing the isolation objection (no contact with reality) and the problem of rival coherent systems by framing them as "security features." The **Vector Plan** targets **Infinitism**, confronting the "finite mind" objection (we can't hold infinite reasons) by rebranding it as "Deferred Processing" and reframing the lack of completion as a feature rather than a failure. My main worry was making Infinitism sound too impractical; I tried to ensure the "scalability challenge" line acknowledged the philosophical defense that infinitism is about potential, not actual, infinite chains.
