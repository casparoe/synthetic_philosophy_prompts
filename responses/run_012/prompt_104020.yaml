answer: |-
  Your intuition is correct: your friend is conflating the *structure* of the feeling (non-transferable duty) with the *source* of the feeling (social roles). Confucian role ethics explains your uncle's case passably well because a "son" is a pre-existing category with scripted expectations. It fails completely on your friend's case because there is no category, no script, and no prior relationship. The common thread between the uncle and the friend is not a role, but **non-fungibility**.

  Here is the carving of the concept.

  ### The Core Mechanism: Non-Fungibility
  Standard moral theories (Utilitarianism, Kantianism, and most Rule Ethics) treat agents as **fungible**. If a child is drowning, the moral imperative is "save the child." It does not matter *who* saves them. If you save them, the obligation is discharged for everyone.

  The phenomenon you are describing treats the agent as **non-fungible**. The moral imperative is not "the neighbor must be sat with," but "*I* must sit with the neighbor." The identity of the agent is part of the moral content. This is why better external options (the care home) make your uncle feel worse: the task was not "ensure care" (which was solved), but "be the son who cares" (which was outsourced).

  ### Why It Is Not Role Ethics
  Role ethics relies on **social categories** (Father, Ruler, Subject).
  *   **Transferability:** In many role systems, if a father dies, an uncle or adoptee can step into the role. The role persists; the person changes.
  *   **Your Case:** In your friend's case, there is no role to step into. In your uncle's case, he feels that even if the *role* of "caretaker" is filled by professionals, the *person* of the "son" is missing.
  *   **The Carving:** Role ethics binds the *position*; this phenomenon binds the *person*.

  ### Why It Is Not Special Obligations
  Special obligations arise from **history or contract** (promises, debts, family ties).
  *   **Discharge:** Special obligations usually have a completion condition. If I owe you $10, I pay you, and the obligation vanishes. If I promise to visit, I visit, and the promise is kept.
  *   **Your Case:** Your friend feels "not done" two years later. No one was wronged by stopping, yet the demand persists. This indicates the obligation is not a debt to be repaid, but a state of being to be maintained.
  *   **The Carving:** Special obligations are transactional (owed *to* someone); this is constitutive (part of *who* you are now).

  ### The Edges of the Concept
  To distinguish this from ordinary obligation, test it against these three boundaries:

  1.  **Does it survive death?**
      *   *Ordinary Obligation:* No. You cannot owe a dead person a duty (they cannot claim it).
      *   *This Concept:* **Yes.** Your friend still feels the bind two years later. The demand is no longer about the other's need, but about the agent's integrity regarding the encounter.
  2.  **Is it transferable?**
      *   *Ordinary Obligation:* Yes. If I cannot visit my grandmother, I can pay a nurse to do it, and I have fulfilled my duty.
      *   *This Concept:* **No.** If your friend pays someone else to sit with the neighbor now, it does not resolve her feeling. The value was in *her* presence, not the presence itself.
  3.  **Does it require a prior relationship?**
      *   *Ordinary Obligation:* Yes (Special Obligations) or No (General Duties).
      *   *This Concept:* **No.** It arises from **proximity + capacity**. The mere fact that she was the one who *could* and *did* start, makes her the one who *must* continue. It is an obligation generated by the event itself, not the history.

  ### The Name
  There is no single standard term that captures all three edges (non-transferable, survives death, role-less), as analytic philosophy usually tries to eliminate this kind of "agent-relative" demand in favor of universal rules. Care ethics touches on it but focuses on the relationship rather than the agent's bind. Levinas calls it "Infinite Responsibility," but that implies a religious/phenomenological framework you might not want.

  I will coin the term **"Singular Responsibility."**

  It is distinct from "Special Obligations" because it requires no prior contract. It is distinct from "Role Ethics" because it requires no social category. It is "Singular" because it attaches to the singular instance of the agent encountering the need, rendering them irreplaceable.

  \answer{Singular Responsibility — A moral demand arising from immediate presence or encounter that binds a specific agent to a specific task in a way that cannot be discharged, transferred, or generalized to others.}
