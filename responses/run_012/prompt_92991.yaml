  I'm taking a metaphysics of time module this term and we've been on future contingents for three weeks now, and there's a thing I can't let go of that the usual sea-battle framing dosn't seem to reach. Here's the case I keep inflicting on my flatmates. Box A: yesterday someone flipped a coin, wrote the result on a card, and sealed it in a box; nobody will ever open it, and let's say the flip was fully determined by the initial conditions, so the outcome is already fixed. Box B: a coin that will be flipped tomorrow by a genuinely indeterministic process, so as of now nothing about it is fixed. Today I say (i) 'the coin in Box A came up heads' and (ii) 'the coin in Box B will come up heads'. I feel pretty sure (i) has a truth value — we just can't know it — and I'm tempted to say (ii) doesn't. My friend Ravi thinks the gap tracks settledness rather than determinism, and that settledness is a truthmaker-ish notion: for (i) there's already something in the world that makes it true or false, for (ii) there isn't. My other friend thinks that's muddled, because truth is just correspondence with how things turn out and how things turn out is a fact about the future we can help ourselves to, so there are no gaps anywhere; and she adds that even if you do want gaps, 'will' and 'will not' might not be contradictories at all — the negation of 'there will be a battle' could be 'there might not be one' — so you don't obviously get an excluded-middle problem anyway.

  What I want from you is a number, not a tour of the literature (and please don't bother with references, I can't look anything up right now anyway). Take the proposition to be: at least some statements about future contingents have no truth value at the time they're uttered, in the actual world, given how the world actually is. What's your credence in that? I'm at about 0.4, Ravi's at about 0.85, my other friend is at about 0.1. But the number matters alot less to me than the derivation, so please decompose it: how much rides on whether the future's being 'open' is a metaphysical fact about the world versus a fact about us and our practical situation; how much on whether truth needs a truthmaker and whether a future contingent could have one; how much on whether genuine indeterminism is even a coherent notion, as opposed to just our ignorance of hidden variables; how much on whether a truth-value gap can be a stable semantic posit at all, versus forcing you into a non-classical logic that then misbehaves elsewhere; and whatever else you think belongs — give each sub-question a rough probability with one line of justification, then show me how they combine.

  Then tell me which sub-question the final number is most sensitive to, and what would move it most: some argument, or some way the world turned out to be. And last thing: which of those sub-questions do you think Ravi and my other friend actually disagree about — is their fight really about truthmakers, or is it upstream of that?
