answer: |-
  Your instinct is correct: the logic described is broadly sound, but the historical and philosophical "moralising" is significantly inflated, and there is one technical error regarding the definition of "knowable" that undermines the explanation of the proof.

  Here is the claim-by-claim audit, followed by detailed answers to your five specific questions.

  ### Part 1: Claim-by-Claim Audit

  **Claim 1:** *"The paradox was discovered by Frederic Fitch, who offered it as a refutation of verificationism..."*
  *   **Verdict:** **Accurate.**
  *   **Note:** Fitch published this in 1963 (as a theorem in a paper on value logic). He explicitly intended it to show that a specific formalization of verificationism (that all truths are knowable) entails that all truths are known.

  **Claim 2:** *"...the doctrine held by the logical positivists and later defended by Michael Dummett under the name anti-realism, according to which a statement is true only insofar as it could in principle be verified or known."*
  *   **Verdict:** **Defensible Simplification.**
  *   **Note:** This is a standard gloss. Dummett's anti-realism is more nuanced (linking meaning to use and verification conditions), but for the purpose of a handbook entry, equating the truth-condition with knowability is acceptable.

  **Claim 3:** *"Suppose every truth is knowable, in the sense that every truth is, or eventually will be, known by someone."*
  *   **Verdict:** **Wrong.**
  *   **Correction:** This is the most significant technical error in the text. "Knowable" in the paradox refers to **metaphysical possibility** ($\Diamond Kp$), not **temporal actuality** ("will be known"). The paradox works even if we assume time is infinite. The proof targets the *possibility* of knowledge, not the *prediction* of future knowledge. If "knowable" meant "will eventually be known," the paradox would not get off the ground in the standard way, because the contradiction arises from the *concept* of knowing an unknown truth, not the *timing* of it.

  **Claim 4 & 5:** *"Take some humdrum truth that in fact nobody knows... The conjunction 'p, and nobody knows that p' is itself a truth... But it cannot be known: anyone who knew the first conjunct would thereby know that p, which makes the second conjunct false."*
  *   **Verdict:** **Accurate (Logic).**
  *   **Note:** This correctly describes the reductio. If you know $(p \land \neg Kp)$, you know $p$ (by distribution) and you know $\neg Kp$ (by distribution). But knowing $\neg Kp$ implies $\neg Kp$ (by factivity). So you have $Kp$ and $\neg Kp$. Contradiction.

  **Claim 6:** *"The principle therefore refutes itself, and this is what finally killed off verificationism."*
  *   **Verdict:** **Wrong (Historically).**
  *   **Correction:** Fitch's result was largely ignored until the 1980s (when philosophers like Hart and McGinn rediscovered it). Verificationism had already declined due to internal problems (e.g., the verification principle itself is not verifiable) and the rise of Quinean naturalism. Fitch's paradox did not "kill" it; it provided a later, formal nail in a coffin that was already closed.

  **Claim 7:** *"First, we are forced to admit that there are truths no possible mind could ever know; truth outruns knowability."*
  *   **Verdict:** **Misleading/Inflated.**
  *   **Correction:** The paradox proves that the principle "All truths are knowable" is false. It does not strictly prove "There exists a truth that is unknowable" unless you accept classical logic (specifically, the inference from $\neg \forall$ to $\exists \neg$). An intuitionist can accept the paradox's result without admitting the existence of specific unknowable truths (see section (i) below).

  **Claim 8:** *"Second, the argument depends on classical logic -- on the law of excluded middle, and on treating knowability as a yes-or-no matter -- which is why intuitionists, the anti-realists in question, have never been troubled by it."*
  *   **Verdict:** **Wrong.**
  *   **Correction:** The core derivation (that "All truths are knowable" implies "All truths are known") is valid in intuitionistic logic. It does not rely on the Law of Excluded Middle. It relies on the factivity of knowledge ($Kp \to p$) and distribution ($K(p \land q) \to Kp \land Kq$). Intuitionists *are* troubled by it because it forces them to abandon the universal knowability principle, which is central to their semantics. They are not troubled by the *conclusion* that there *are* unknowable truths (because they reject that inference), but they are troubled by the loss of the principle.

  **Claim 9:** *"Anti-realists today do sometimes try to patch the principle by exempting propositions whose knowability would be self-undermining, but this is an ad hoc rescue of a thesis the argument has already destroyed."*
  *   **Verdict:** **Opinionated/Unfair.**
  *   **Correction:** Restricting the scope of the knowability principle (e.g., to "basic" or "Cartesian" propositions) is a major, serious research program in epistemic logic (e.g., by Dorothy Edgington or Timothy Williamson). Whether it is "ad hoc" is a matter of ongoing philosophical debate, not a settled fact. The entry presents a contentious verdict as a neutral summary.

  ---

  ### Part 2: Answers to Your Specific Questions

  #### (i) Does the argument really need classical logic, and what ought an intuitionist to say?
  The entry is confused here. We must distinguish the **derivation** from the **conclusion**.

  1.  **The Derivation:** The proof that "If all truths are knowable, then all truths are known" does **not** require classical logic. It is valid in intuitionistic logic. It relies only on:
      *   Factivity: If you know $p$, $p$ is true.
      *   Distribution: If you know $(A \land B)$, you know $A$ and you know $B$.
      *   Modal logic principles (that necessity/possibility distribute over implication).
      *   None of these require the Law of Excluded Middle.

  2.  **The Conclusion:** The entry claims the moral is "There are truths no possible mind could ever know" ($\exists p (p \land \neg \Diamond Kp)$). To get from the paradox's result ("It is not the case that all truths are knowable": $\neg \forall p (p \to \Diamond Kp)$) to this moral, you **do** need classical logic. You need to move from a negated universal to an existential negation.
      *   **Classical Logician:** $\neg \forall x \phi \vdash \exists x \neg \phi$. Therefore, there *exists* an unknowable truth.
      *   **Intuitionist:** Rejects that inference. They accept $\neg \forall p (p \to \Diamond Kp)$ but deny that this entails the existence of a specific unknowable proposition.

  **What an intuitionist says:** An intuitionist admits the Knowability Principle ($\forall p (p \to \Diamond Kp)$) is false. However, they do not accept the realist conclusion that "Truth outruns Knowability" in the sense of there being a realm of forever-unknowable facts. They simply maintain that we cannot assert the universal principle. They are definitely "troubled" by it, as it forces them to weaken their semantic theory, contrary to the entry's claim that they ignore it.

  #### (ii) Is the attribution of an anti-verificationist aim to Fitch right, and is the account of verificationism's demise accurate?
  *   **Fitch's Aim:** Yes, accurate. Fitch explicitly framed the theorem to show that a strong verificationist principle collapses into omniscience.
  *   **Verificationism's Demise:** No, inaccurate. As noted in the audit, Fitch's paper was a footnote in a 1963 journal (*Journal of Symbolic Logic*) and went unnoticed for 20 years. Verificationism was effectively dead by the late 1950s due to criticisms from Quine, Sellars, and others. The entry reverses the causality: the paradox did not kill the doctrine; the doctrine's decline allowed the paradox to be later interpreted as a refutation of it.

  #### (iii) Is the gloss of "knowable" as "known, sooner or later, by someone" faithful?
  **No.** This is the critical error identified in Claim 3.
  *   **Faithful Definition:** "Knowable" means **possibly known** ($\Diamond Kp$). There is a possible world accessible from ours where $p$ is known.
  *   **Entry's Definition:** "Known sooner or later" implies a temporal future in the *actual* world.
  *   **What turns on the difference:** If "knowable" means "will be known," the paradox is weaker. It would only show that we cannot have unknown truths *now* if we assume they will all be known *later*. But the real force of Fitch's paradox is modal: it says that even if we had infinite time and resources, the *concept* of "unknown truth" is incompatible with the *possibility* of knowing it. The entry's gloss makes the paradox look like a prediction about the future of science, rather than a logical constraint on the concept of truth.

  #### (iv) Do the two morals follow? Is "there are unknowable truths" a consequence of the paradox?
  *   **Moral 1 ("Truth outruns knowability"):** This follows only for the **Classical Realist**. As explained in (i), the paradox proves the Knowability Principle is false. The Classical Realist infers from this that there *must* be unknowable truths. The Intuitionist denies this inference. So, "there are unknowable truths" is a consequence of the Paradox + Classical Logic, not the Paradox alone.
  *   **Moral 2 ("Argument depends on classical logic"):** As explained in (i), this is half-wrong. The *reductio* does not depend on classical logic. The *inference to the existence of unknowable truths* does. The entry conflates the proof with the moral drawn from it.
  *   **Mundane vs. Paradoxical:** The existence of unknowable truths is not "mundane." It is a significant metaphysical claim. The paradox forces a trilemma: either (a) accept we are omniscient (all truths are known), (b) accept there are unknowable truths, or (c) restrict the scope of "truth" or "knowledge." The entry presents option (b) as the only rational choice, which is the "inflated moralising" you suspected.

  #### (v) Is the dismissal of the anti-realist's repair fair?
  **No.** The entry is announcing a verdict without argument.
  *   **The Repair:** The standard anti-realist move is to restrict the Knowability Principle. Instead of $\forall p (p \to \Diamond Kp)$, they propose $\forall p (p \to \Diamond Kp)$ only for propositions that are "Cartesian" (i.e., where $Kp$ is not self-contradictory). Since $(p \land \neg Kp)$ is not Cartesian (as shown by the proof), it is exempted.
  *   **Is it Ad Hoc?** A defender would argue it is not ad hoc but **diagnostic**. The paradox shows that the property of "being unknown" is not a stable property for knowledge to latch onto. Therefore, a principled restriction of the domain of knowability is a motivated response, not a mere patch.
  *   **Fairness:** A neutral handbook entry should state that this is a live option in contemporary epistemology (e.g., "restrictive strategies"), not dismiss it as a "rescue of a thesis the argument has already destroyed." Many logicians believe the restricted principle preserves the spirit of anti-realism without the contradiction.

  ### Summary for Your Notes
  Your instinct was sharp. You can trust the **logical structure** of the proof as described (Claims 4 & 5), but you should treat the **definitions, history, and philosophical conclusions** with skepticism.

  **Corrected Summary:**
  Fitch's Paradox shows that the principle "All truths are knowable" entails "All truths are known." Since "All truths are known" is false, the principle is false.
  1.  **Logic:** Valid in intuitionistic logic (does not require Excluded Middle).
  2.  **Definition:** "Knowable" means *possibly* known, not *eventually* known.
  3.  **Consequence:** Classical realists conclude there are unknowable truths. Intuitionists conclude only that the universal knowability principle fails, without positing specific unknowable truths.
  4.  **History:** Fitch intended it against verificationism, but it did not cause verificationism's demise (which happened earlier).
  5.  **Response:** Anti-realists often restrict the knowability principle to avoid the contradiction; this is a serious philosophical position, not merely an ad hoc patch.
