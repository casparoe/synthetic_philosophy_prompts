  This is a sophisticated problem that sits right at the boundary of measure theory, decision theory, and the philosophy of probability. You are correct that the standard line (following Nover & Hájek 2004) relies heavily on the measure-theoretic requirement of absolute convergence to define expectation. However, there is a robust philosophical case to be made that decision-theoretic value need not be shackled to the Lebesgue integral when the stochastic process has an intrinsic temporal structure.

  Below is a detailed argumentative framework designed for a PhD-level chapter. It rigorously defends the $\ln 2$ position by grounding the "natural order" in the causal and temporal structure of the game, rather than treating it as an arbitrary enumeration. It also engages deeply with the order-independence objection.

  ---

  # Title Suggestion: The Temporal Structure of Expectation: Defending the Pasadena Value

  ## 1. Introduction: The Measure-Theoretic Impasse
  Begin by acknowledging the mathematical gravity of the standard objection. In standard Kolmogorov probability theory, the expected value of a random variable $X$ is defined as the Lebesgue integral $\int X \, dP$. For this integral to be well-defined and unique, $X$ must be absolutely integrable ($\int |X| \, dP < \infty$).

  In the Pasadena game, let $N$ be the random variable denoting the toss number of the first head. $P(N=n) = 2^{-n}$. The utility is $U(n) = (-1)^{n-1} \frac{2^n}{n}$.
  The expectation sum is:
  $$ E = \sum_{n=1}^{\infty} P(N=n)U(n) = \sum_{n=1}^{\infty} \frac{1}{2^n} \cdot (-1)^{n-1} \frac{2^n}{n} = \sum_{n=1}^{\infty} \frac{(-1)^{n-1}}{n} $$
  This is the alternating harmonic series, which converges conditionally to $\ln 2$. However, $\sum |P(n)U(n)| = \sum \frac{1}{n} = \infty$.

  **The Standard Objection:** Because the series is not absolutely convergent, the Riemann Rearrangement Theorem applies. The terms can be reordered to sum to any real number $r \in \mathbb{R} \cup \{\pm \infty\}$. Since the value of a gamble should not depend on the arbitrary order in which an agent enumerates the outcomes in a sum, the expectation is undefined.

  **Your Thesis:** This objection conflates *mathematical enumeration* with *decision-theoretic structure*. The index $n$ is not an arbitrary label; it represents the **stopping time** of a stochastic process. The "natural order" is privileged because it corresponds to the only physically and decision-theoretically coherent method of truncating the game for finite approximation. Therefore, the expectation is well-defined as $\ln 2$ relative to the game's natural filtration.

  ## 2. The Argument from Stochastic Process Structure
  To defend $\ln 2$, you must argue that the summation order is fixed by the ontology of the game, not the notation.

  ### 2.1. The Index as a Random Variable, Not a Label
  In a static lottery (e.g., "I put tickets in an urn"), the enumeration of tickets is arbitrary. Summing outcomes in any order is permissible because the selection is simultaneous.

  The Pasadena game is not a static lottery; it is a **dynamic stochastic process**. The index $n$ is the value of the random variable $T$ (time to termination). The probability mass $2^{-n}$ is not attached to an outcome in isolation; it is attached to the *path* of length $n$.
  *   **Claim:** The expectation should be viewed as the limit of expectations of truncated games.
  *   **Truncation:** A natural truncation of the game is "Play the game, but if heads hasn't appeared by toss $N$, the game ends (or is valued at 0)."
  *   **Mathematical Form:** Let $U_N$ be the utility of the game truncated at $N$. Then $E[U_N] = \sum_{n=1}^{N} \frac{(-1)^{n-1}}{n}$.
  *   **Limit:** The value of the infinite game is $\lim_{N \to \infty} E[U_N]$.

  This limit is uniquely $\ln 2$. Any other summation order corresponds to a truncation scheme that has no counterpart in the game's mechanics. For example, a rearrangement that sums all odd $n$ before even $n$ implies a truncation where we count the outcome $n=101$ but ignore $n=2$. There is no stopping rule or physical process that corresponds to "collecting" outcomes based on a rearranged index $\sigma(n)$ rather than the magnitude of the stopping time $n$.

  ### 2.2. Filtration and Information Flow
  In the theory of stochastic processes, expectations are evaluated relative to a **filtration** $(\mathcal{F}_n)$, representing the information available at time $n$.
  *   The natural order $1, 2, 3 \dots$ respects the filtration. At step $N$, the agent knows whether the game ended at $1, \dots, N$ or continues.
  *   The partial sum $S_N = \sum_{n=1}^N P(n)U(n)$ represents the expected value given the information that the game *must* resolve by time $N$.
  *   Rearranging the series breaks the link between the probability mass and the temporal accumulation of information. A rearranged sum implies an agent who can access the outcome of $n=1,000,000$ without resolving $n=2$. This violates the causal structure of the coin toss process.

  **Conclusion of Section:** The "arbitrariness" of order assumed by the standard objection only holds for static sample spaces. For dynamic processes defined by stopping times, the natural ordering of the stopping variable is structurally invariant.

  ## 3. Engaging the Order-Independence Objection
  This is the crux of your chapter. You must seriously engage the norm that "Value should be description invariant."

  ### 3.1. The Principle of Description Invariance
  **Objection:** Rational valuation should depend on the states of the world and their utilities, not on how the agent writes down the sum. If two series contain the same terms, they describe the same gamble. If they yield different values, the valuation method is flawed.

  **Response:** This principle holds for **completed totalities**, but the Pasadena game is an **unbounded process**.
  1.  **Static vs. Dynamic:** Description invariance applies when the sample space is a fixed set of mutually exclusive, exhaustive states that exist "all at once" (God's eye view). However, decision theory is for embedded agents. For an embedded agent, the *accessibility* of outcomes matters.
  2.  **Approximation Matters:** Since the agent cannot compute an infinite sum, value is operationalized through finite approximations. The "value" of a conditionally convergent series *is* the limit of its partial sums. To ask for the value independent of the summation order is to ask for a value independent of the method of approximation.
  3.  **Physical Realizability:** Only the natural partial sums correspond to physically realizable approximations (stopping the game early). A rearranged partial sum (e.g., including $n=3$ but excluding $n=2$) describes a counterfactual game that cannot be played. Therefore, the rearranged sums are **mathematically valid but decision-theoretically inert**. They describe sums that do not correspond to any coherent betting policy or truncation of the actual process.

  ### 3.2. The Analogy to Physics
  Draw an analogy to conditionally convergent series in physics (e.g., electrostatic potential in infinite lattices).
  *   In physics, if a sum over a lattice is conditionally convergent, the value depends on the shape of the volume over which you sum (spherical vs. cubic truncation).
  *   Physicists do not say the potential is "undefined." They say the value depends on the **boundary conditions**.
  *   In the Pasadena game, the "boundary condition" is the temporal stopping rule. The natural order is the spherical truncation of the decision problem. Rearrangements are arbitrary, non-physical distortions of the boundary.

  ## 4. Operational Support: Weak Expectation
  To make the argument rigorous, you should incorporate Kenny Easwaran's (2008) concept of **Weak Expectation**. This provides an operational definition of value that yields $\ln 2$ without relying solely on the summation order argument.

  ### 4.1. The Law of Large Numbers Argument
  Standard expectation (Strong Expectation) requires that the average payoff of $K$ independent plays converges almost surely to a constant $\mu$ as $K \to \infty$. For Pasadena, the Strong Expectation is undefined because the variance is infinite.

  However, **Weak Expectation** looks at convergence in probability.
  *   Easwaran demonstrates that for the Pasadena game, if you play $K$ independent rounds, the average payoff $\bar{U}_K$ converges in probability to $\ln 2$.
  *   Formally: $\forall \epsilon > 0, \lim_{K \to \infty} P(|\bar{U}_K - \ln 2| < \epsilon) = 1$.
  *   This means that for a large number of plays, it is overwhelmingly probable that the average return will be close to $\ln 2$.

  ### 4.2. Why This Supports the Natural Order
  The Weak Expectation result is derived from the distribution of outcomes as indexed by $n$. It validates $\ln 2$ as the **empirical center of gravity** of the game.
  *   If you argue for a rearranged value (say, $\pi$), you are arguing for a value that the game will *never* empirically approximate in repeated play.
  *   Therefore, $\ln 2$ is the only value that connects the mathematical formalism to the long-run behavior of the stochastic process.
  *   This undermines the objection that $\ln 2$ is "arbitrary." It is the unique attractor of the sample mean.

  ## 5. Synthesis: A Defense of Conditional Expectation
  Conclude by synthesizing the structural and operational arguments into a positive thesis.

  1.  **Rejection of Lebesgue Dominance:** Argue that while the Lebesgue integral is the correct tool for *measure theory*, it is too restrictive for *decision theory* involving unbounded dynamic processes. It prioritizes rearrangement invariance over temporal coherence.
  2.  **Privileging the Natural Filtration:** The value of a dynamic gamble is defined relative to its natural filtration. The expectation is the limit of the expectations of the game truncated at time $N$.
  3.  **The Status of Rearrangements:** Rearranged sums are not alternative valuations of the *same* game; they are valuations of *different*, causally impossible games. Thus, the Riemann Rearrangement Theorem does not generate ambiguity about the Pasadena game; it generates ambiguity about a set of abstract series, only one of which maps to the Pasadena game.
  4.  **Final Verdict:** The expected value is $\ln 2$. It is well-defined relative to the game's temporal structure and validated by the Weak Expectation (convergence in probability of the sample mean).

  ## 6. Potential Counter-Arguments to Pre-empt
  To ensure rigor, briefly acknowledge where this position faces friction:
  *   **Dutch Books:** Acknowledge that even with EV = $\ln 2$, the Pasadena game can still generate Dutch Books (as shown by Nover & Hájek). Your argument secures the *value*, but not necessarily *ratifiability* in all betting contexts. Distinguish between *valuation* (what it's worth) and *pricing* (what quote avoids sure loss). You are arguing for valuation.
  *   **The "Two Envelopes" Parallel:** Briefly note that similar issues arise in the Two Envelopes Problem, where improper priors lead to paradoxes. The solution there also often involves respecting the generative structure of the probabilities.

  ---

  # Key Passages for Your Draft (Drafting Aid)

  **On the nature of the index:**
  > "To treat the index $n$ as a mere enumeration label is to strip the Pasadena game of its defining characteristic: it is a stopping-time problem. The probability $2^{-n}$ is not a weight assigned to a static state; it is the probability mass of a path of length $n$. To rearrange the summation is to sever the link between the utility of the outcome and the causal process required to reach it. While mathematically permissible for abstract series, such rearrangement is decision-theoretically incoherent, as it corresponds to no possible truncation or approximation of the actual play."

  **On Order Independence:**
  > "The norm of order-independence presupposes that the sample space is a static set of possibilities available simultaneously to the agent. This is a 'God's eye' view of probability. For an embedded agent, however, expectation is a tool for navigating uncertainty over time. When the uncertainty unfolds sequentially, the order of summation reflects the order of information revelation. To demand order-independence here is to demand that the value of a temporal process be independent of time—a category error."

  **On Weak Expectation:**
  > "If expected value is to guide action, it must connect to empirical outcomes. The Weak Expectation theorem provides this bridge: in repeated play, the average payoff converges in probability to $\ln 2$. No rearranged sum offers this empirical guarantee. Thus, $\ln 2$ is not merely the sum of the series in its natural order; it is the unique statistical attractor of the game's long-run behavior."

  ---

  ### Recommendation for "Better Position"
  You asked me to argue for the $\ln 2$ view, but I must note one nuance for your dissertation defense:
  The most robust position is not just "The EV is $\ln 2$," but "**The Strong Expectation is undefined, but the Weak Expectation is $\ln 2$, and for decision-theoretic purposes, Weak Expectation is the relevant metric.**"

  Why? Because claiming "EV is $\ln 2$" invites the mathematical objection that "EV is defined as the Lebesgue integral." You cannot change the definition of the Lebesgue integral.
  Instead, argue that **Decision Theory should not rely exclusively on the Lebesgue integral for unbounded games.** By shifting the normative weight to **Weak Expectation** (which is $\ln 2$), you bypass the rearrangement objection entirely. Weak expectation is defined by the limit of the sample mean, which is order-independent in the long run (due to the Law of Large Numbers logic), even if the series sum is not.

  This allows you to keep your conclusion ($\ln 2$ is the right value to use) while conceding the mathematical point (the Lebesgue integral is undefined). This is often a more successful strategy in philosophy of probability (see Easwaran 2008, "Strong and Weak Expectations").

  **Suggested Modification:**
  Frame your argument as: "While the *Strong Expectation* (Lebesgue integral) is undefined due to lack of absolute convergence, the *Weak Expectation* is well-defined and equals $\ln 2$. Since the Weak Expectation captures the long-run behavior and respects the temporal truncation of the game, it is the appropriate measure of value for decision theory. The 'natural order' argument explains *why* the Weak Expectation aligns with the natural partial sums of the series."

  This makes your chapter bulletproof against mathematicians while preserving your philosophical claim.
