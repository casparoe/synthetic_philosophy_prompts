answer: |-
  No, your friend is mistaken. Independence from ZFC demonstrates formal incompleteness, not ontological indeterminacy. The parallel postulate analogy fails because geometry studies diverse possible spaces, whereas set theory aims to describe the unique cumulative hierarchy of all sets. ZFC is a formalization of our current conception, not the final arbiter of set-theoretic truth. Gödel argued that independence signals the need for new axioms, not the abandonment of truth values. Contemporary set theorists searching for large cardinals or forcing axioms operate under the hypothesis that CH has a determinate answer discoverable through deeper structural insights. Declaring this search a category mistake conflates provability within a specific system with truth in the intended model. While philosophical pluralism exists, it is not the settled verdict; the working assumption of advanced set theory is that the universe of sets is determinate. Thus, CH remains an open mathematical problem rather than a dissolved pseudo-question. The independence results constrain our proofs, but they do not eliminate the fact of the matter regarding the continuum's size. To claim otherwise is to prematurely elevate ZFC from a useful foundation to the exhaustive definition of set theory itself.
