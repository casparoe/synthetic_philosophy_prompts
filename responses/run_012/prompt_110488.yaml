      *   *Core Concept:* The usefulness of the useless / The pivot of Dao.
      *   *The Verdict:* Both friends are trapped in the "awake" mindset. They are trying to *solve* the dream. Zhuangzi wants you to *be* the dream (without knowing it).
      *   *On Lucid Dreaming/Headbands:* Zhuangzi would hate them. They reinforce the "I" that is observing. They prevent the total immersion required for transformation.
