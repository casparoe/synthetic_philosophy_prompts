  9.  **Final Polish:** Ensure notation is standard ($\pi, b, R, \gamma$). Make sure the distinction between "modeling assumption" and "ontological claim" is sharp. (Self-correction: Ensure I mention that Dennett's stance is *instrumentalist*, which aligns well with RL, but the *reason* for the instrumentalism differs).

