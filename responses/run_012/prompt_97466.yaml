      *   **Natural Lawyer (NL):** Connection Thesis (Lex iniusta non est lex). Extreme injustice negates legal validity. The denunciation statute was so wicked it wasn't law. The denouncer had no legal obligation, so acting on it was just private malice.
      *   **The Rhodia Case:** This mirrors the *Grudge Informer* case (Hart/Fuller debate). The new regime wants to punish the informer.
          *   HLP solution: Admit it was law, but pass a retroactive statute to punish the injustice (honesty over comfort).
