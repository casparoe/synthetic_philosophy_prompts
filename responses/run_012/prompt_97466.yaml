      *   **Section 2: Points of Disagreement.** Phrase them so each side nods.
          *   HLP: "The statute possessed formal validity derived from the sovereign's power."
          *   NL: "The statute lacked normative legitimacy due to substantive iniquity."
      *   **Section 3: The Real Cruxes.**
          *   *Crux 1: The Moral Threshold in Validity.* Can morality be a condition of legality?
          *   *Crux 2: The Word "Law".* Is it a functional label or an honorific?
          *   *My Stand:* I need to take a position. I will argue that while it looks verbal, it has practical consequences for judicial reasoning (honesty vs. fiction). I'll side slightly with Hart (Positivist) on the *description*, but acknowledge Fuller's (Natural Law) point on *adjudication*. Actually, the prompt asks me to take a stand *where materials let me*. The materials are the Rhodia scenario. The best legal philosophy usually admits the Positivist description is more accurate for *sociology*, but the Natural Law insight is crucial for *adjudication in transition*. I will argue the dispute is *partly* verbal but conceals a substantive disagreement about judicial candor.

