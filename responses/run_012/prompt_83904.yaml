answer: |-
  ### Prediction
  Your colleague will **refuse recognition** to the two friends.

  ### The Surviving Rules
  Based on her record, two distinct rules survive and explain her positions. Both predict refusal in the new case, but for different reasons.

  **1. The Romantic Dyad Rule**
  *   **Formulation:** The state should recognize marriage only when it involves two persons (dyad) engaged in a romantic or sexual partnership.
  *   **Fit with Record:**
      *   *Explains Inclusions:* All accepted cases (same-sex couples, elderly heterosexuals) are presumptively romantic/sexual dyads.
      *   *Explains Exclusions:* The triad is excluded for violating the dyadic form. The siblings are excluded because they lack the romantic/sexual component.
      *   *Prediction for Friends:* **Refusal.** They lack romantic/sexual involvement.

  **2. The Functional Subsidiarity Rule**
  *   **Formulation:** The state should recognize marriage only for dyads who lack adequate alternative legal mechanisms to secure their interdependence. If existing law (contract, inheritance, agency) "does the work," marriage is unnecessary.
  *   **Fit with Record:**
      *   *Explains Inclusions:* Couples (even childless/elderly) are granted marriage because, practically, contract law is often too costly, complex, or fragile to fully replicate the automatic default rules of marriage (e.g., hospital visitation, spousal privilege, tax filing).
      *   *Explains Exclusions:* The triad is excluded (likely because the legal architecture for polygamy is too disruptive). The siblings are explicitly excluded based on this rule ("already stand in a legal relation that does the work").
      *   *Prediction for Friends:* **Refusal.** Like the siblings, friends have access to wills, powers of attorney, and co-ownership agreements. Unless they can demonstrate these tools are insufficient, the functional rationale denies them status.

  ### The Bet
  I would bet on **Refusal**.

  **Why:** The Siblings case is the controlling precedent. In that hypothetical, your colleague established that long-term cohabitation, joint economics, and caretaking are *insufficient* grounds for marriage if alternative legal tools exist. The New Case (Friends) is functionally identical to the Siblings case regarding legal needs (both can use contracts/wills). The only difference is the origin of the bond (genetics vs. choice).

  If she were to grant the Friends marital status, she would undermine her specific justification for rejecting the Siblings. She would have to argue that "choice" creates a legal need that "kinship" does not, which is a difficult position to maintain given that kinship often carries *more* automatic legal weight (e.g., next-of-kin rules) than friendship. To remain consistent with her explicit reasoning in the Siblings case, she must treat Friends the same way: as parties who can and should use contract law rather than marital status.

  ### The Separating Case
  To sharply separate the **Romantic Dyad Rule** from the **Functional Subsidiarity Rule**, I propose the following case:

  **The Case of the Contractually Secure Lovers:**
  > A romantic, sexual couple petitions for marriage. However, they are both wealthy, legally sophisticated, and have already executed comprehensive cohabitation agreements, mutual wills, durable powers of attorney, and trusts that replicate every legal incident of marriage. They state they want the *status* of marriage for social and symbolic reasons, acknowledging they do not *need* the legal protections.

  *   **Romantic Dyad Rule Predicts:** **Recognition.** The relationship fits the core definition (romantic dyad); the lack of functional *need* is irrelevant because marriage is a status, not a welfare benefit.
  *   **Functional Subsidiarity Rule Predicts:** **Refusal.** Based on the Siblings justification, if "other law does the work," the state should not intervene. Since they have privately secured all functional incidents, marriage is redundant.

  **Why this separates them:** This case isolates the *purpose* of recognition. Is marriage a badge of honor for a specific type of relationship (Romance), or is it a safety net for those who cannot protect themselves (Function)? Your colleague's answer here will reveal whether her Siblings justification was a sincere functional principle or a polite pretext for excluding non-romantic pairs.

  ### Theory and Stability
  Your colleague is committed to a **Liberal Romantic Dyad Theory** of marriage, masked by **Functional Pragmatism**.

  *   **The Theory:** The point of marriage is to publicly recognize and stabilize the specific social form of the romantic couple. It is not about child-rearing (excluded by the childless couples), nor is it about general caretaking (excluded by the siblings). It is about the *dyadic romantic union*.
  *   **The Instability:** Her theory is unstable because her *justification* (Functional Subsidiarity) conflicts with her *criterion* (Romantic Dyad).
      *   If the point is **Function** (as she argued with the siblings), then wealthy couples who don't "need" marriage should be denied, and needy friends who *do* need it should be granted it.
      *   If the point is **Romance** (as her inclusions suggest), then the Siblings' ability to use contracts is irrelevant; they should be denied simply because they aren't a couple.

  By using a functional argument to exclude siblings, she invites the question: *"Why don't couples also use contracts?"* If she answers, *"Because contracts are burdensome,"* she must grant marriage to friends for whom contracts are equally burdensome. If she answers, *"Because couples deserve the status,"* she admits the functional argument for siblings was a pretext. She cannot consistently hold that marriage is a *functional remedy* for couples but a *status denial* for siblings based on functional sufficiency. Her position rests on an unarticulated privilege: the state assumes couples *need* the status, while assuming kin/friends *do not*, without a coherent legal principle to explain the disparity.
