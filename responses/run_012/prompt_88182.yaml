  *(Self-Correction on the "Self-Maintaining Loop" section)*: I need to be careful not to dismiss it, but test it against the spec. It fails on artifacts (statues) unless modified. It succeeds on organisms (slime mold, human). It's a *naturalist* criterion. I should highlight this tension.

  *(Final check on "Science")*: The prompt asks which science constraints are real vs. taste. I need to distinguish between *contradicting* physics (bad) and *mirroring* current physics (risky). Entanglement is a hard constraint; "species as populations" is a biological model that might change.

