answer: |-
  # SPECIFICATION DOCUMENT: ADEQUACY CONDITIONS FOR A THEORY OF COMPOSITION

  **Purpose:** To define the success conditions for any metaphysical theory answering the Special Composition Question (SCQ): *Under what conditions do some things compose a further thing?*
  **Scope:** This spec evaluates theories against logical coherence, empirical adequacy, and intuitive coverage without pre-judging the ontological camp (e.g., Universalism, Nihilism, Organicism).

  ---

  ## 1. THE BOUNDARY CONDITIONS (Why Extremes Fail)

  A theory cannot simply answer "Always" or "Never." While logically consistent, both extremes fail the adequacy spec for specific functional reasons.

  ### 1.1 Rejection of Unrestricted Universalism ("Yes to Every Sum")
  *   **The Claim:** Any collection of parts composes a whole (e.g., the Eiffel Tower and this text compose an object).
  *   **Why it Fails the Spec:**
      *   **Counting Breakdown:** If every arbitrary sum is an object, quantification becomes trivial. Asking "How many things are in this room?" yields an infinite or near-infinite answer, rendering the concept of number useless for macroscopic description.
      *   **Explanatory Dilution:** If *everything* is an object, the term "object" loses its power to distinguish structured systems from noise. It fails to track the "joints" of nature required by science.
      *   **Requirement:** The theory must restrict composition enough to make counting and identification non-trivial.

  ### 1.2 Rejection of Strict Nihilism ("No to Every Sum")
  *   **The Claim:** Only simples (atoms/fields) exist; there are no tables, people, or clouds.
  *   **Why it Fails the Spec:**
      *   **Scientific Incompatibility:** Special sciences (biology, economics, meteorology) quantify over wholes (organisms, markets, storms). A theory that declares these disciplines systematically false about their ontological commitments is too costly.
      *   **Phenomenological Disconnect:** It requires a radical error theory about everyday experience. While logically possible, it fails the pragmatic requirement of mapping onto human interaction with the world.
      *   **Requirement:** The theory must validate the existence of at least some macroscopic entities acknowledged by successful sciences.

  ---

  ## 2. MANDATORY REQUIREMENTS (Non-Negotiable)

  *These conditions must be met for the theory to be viable, regardless of metaphysical camp.*

  ### 2.1 Logical Consistency & Transitivity
  *   **The Requirement:** The relation of parthood must be reflexive, antisymmetric, and transitive (standard mereology), or the theory must explicitly justify deviations.
  *   **Consideration:** Without this, we cannot reason about parts and wholes without contradiction.
  *   **Test Case:** If A is part of B, and B is part of C, A must be part of C. (Fails in some biological symbiosis cases if not handled carefully).

  ### 2.2 Empirical Non-Contradiction (Hard Science)
  *   **The Requirement:** The theory cannot contradict established, high-confidence physics.
  *   **Consideration:** Metaphysics cannot override empirical fact.
  *   **Test Case:** **Entanglement.** If quantum entanglement implies non-separability, a theory insisting on strictly independent spatial parts is inadequate.
  *   **Test Case:** **Thermodynamics.** A theory positing permanent, unchanging essences contradicts entropy.
  *   **Distinction:** *Hard Constraint:* Conservation laws, entropy, entanglement. *Soft Constraint:* Specific biological models (e.g., "species are populations" may change).

  ### 2.3 Diachronic Coherence (Persistence)
  *   **The Requirement:** The theory must specify identity conditions over time.
  *   **Consideration:** Objects change. If composition is temporary, we need to know when the object ceases to be.
  *   **Test Case:** **The Human.** You have swapped atoms since age five. If composition requires specific atoms, you don't exist. If it requires *any* atoms, you are a "four-dimensional worm." The theory must pick a lane and explain the transition.
  *   **Test Case:** **The River.** Water flows through; the river remains.

  ### 2.4 Counting & Quantification Viability
  *   **The Requirement:** It must be possible to count the objects in a domain without triviality or paradox.
  *   **Consideration:** If we cannot count, we cannot do science or navigate the world.
  *   **Test Case:** **The Room.** The theory must allow us to say "there are 5 people" without implying "there are 5 people + 1 person-sum + 1 chair-sum..." ad infinitum.

  ---

  ## 3. CONTESTED REQUIREMENTS (Camp Preferences)

  *These are desirable features, but different metaphysical camps prioritize them differently. A theory must explicitly state which it sacrifices.*

  ### 3.1 Vagueness Resolution (Ontic vs. Semantic)
  *   **The Issue:** **The Heap/Cloud.** When does a cloud cease to be a cloud as it sheds droplets?
  *   **Camp A (Epistemic/Semantic):** Reality is precise; our words are vague. (Requires arbitrary cutoffs).
  *   **Camp B (Ontic):** Reality itself is vague. (Requires non-classical logic).
  *   **Spec Verdict:** The theory *must* locate the vagueness, but choosing *where* is a preference. However, ignoring it is a failure.

  ### 3.2 Causal/Explanatory Work
  *   **The Issue:** **The Beehive/Corporation.** Does the hive do anything the bees don't?
  *   **Camp A (Causal Realism):** Wholes must have causal powers distinct from the sum of parts (Downward Causation).
  *   **Camp B (Explanatory Instrumentalism):** Wholes are just useful shorthand; the parts do all the work.
  *   **Spec Verdict:** *Preference.* However, a theory that makes *all* wholes epiphenomenal struggles to justify why we believe they exist (The "No Reason to Believe" objection).

  ### 3.3 Material Constitution (The Statue and the Lump)
  *   **The Issue:** One space, two descriptions?
  *   **Camp A (Coincidence):** Two objects (Statue, Lump) share parts.
  *   **Camp B (Identity):** One object, two names.
  *   **Camp C (Dominant Sortal):** Only the Statue exists (the lump is just matter).
  *   **Spec Verdict:** *Preference.* The theory must handle the *modal differences* (Lump survives squashing, Statue does not). Ignoring the modal difference is a failure.

  ### 3.4 The Weird Limits (Gunk and Junk)
  *   **The Issue:** **Gunk** (Everything has parts, no atoms) vs. **Junk** (Everything is part of something, no cosmos).
  *   **Requirement:** A robust theory should not *depend* on physics having atoms. It should be compatible with a gunky world, even if ours isn't.
  *   **Spec Verdict:** *Preference for Robustness.* A theory that breaks in a gunky world is less general, but not necessarily false.

  ---

  ## 4. THE TRADE-OFFS (The "Overfull" Warning)

  *You cannot maximize all virtues simultaneously. The following trilemmas indicate where a theory must break.*

  ### 4.1 The Precision Trilemma
  You can have at most two of the following:
  1.  **Common Sense Intuitions** (Clouds exist, heaps exist).
  2.  **Precision** (No vague boundaries).
  3.  **Non-Arbitrariness** (No magical cutoff points).
  *   *Conflict:* If you want Precision and Common Sense, you must accept Arbitrariness (e.g., "10,000 grains makes a heap"). If you want Non-Arbitrariness and Common Sense, you must accept Vagueness (Ontic vagueness).

  ### 4.2 The Causal Exclusion Trilemma
  You can have at most two of the following:
  1.  **Physical Causal Closure** (Every physical effect has a sufficient physical cause).
  2.  **Mental/Macro Causal Efficacy** (Wholes like minds/markets cause things).
  3.  **No Overdetermination** (Effects aren't caused twice).
  *   *Conflict:* If Physics is closed and Wholes cause things, you either have overdetermination (two causes for one effect) or you must deny Physical Closure. Most theories sacrifice Macro Efficacy or accept a specific kind of non-competitive causation.

  ### 4.3 The Science vs. Intuition Trilemma
  You can have at most two of the following:
  1.  **Fidelity to Folk Ontology** (Tables and chairs are objects).
  2.  **Fidelity to Fundamental Physics** (Only fields/particles are real).
  3.  **Unified Ontology** (There is only one kind of existence).
  *   *Conflict:* Physics suggests a world very different from folk intuition. A Unified Ontology forces you to choose one. Pluralists (Ontological Pluralism) sacrifice #3 to keep #1 and #2.

  ---

  ## 5. TESTING THE "SELF-MAINTAINING LOOP" HYPOTHESIS

  *Hypothesis:* Things compose a new thing when caught in a self-maintaining loop against entropy (Far-From-Equilibrium Systems).

  ### 5.1 Adequacy Check Against Spec

  | Requirement | Verdict | Notes |
  | :--- | :--- | :--- |
  | **Hard Science** | **PASS** | Aligns well with thermodynamics, biology, and complexity theory. |
  | **Organisms (Human/Slime Mold)** | **PASS** | Explains why you persist despite atom replacement (the loop persists). |
  | **Dynamic Systems (Flame/Whirlpool)** | **PASS** | Correctly identifies these as transient objects/systems. |
  | **Artifacts (Statue/Queue)** | **FAIL** | A statue does not self-maintain; it degrades. A queue is maintained by external agents, not internal loops. |
  | **Aggregates (Sand Pile/Forest)** | **MIXED** | A forest might pass (ecosystem loop). A sand pile fails (no internal maintenance). |
  | **Vagueness** | **PASS** | Vagueness becomes a matter of degree in loop stability, which is physically grounded. |
  | **Counting** | **PASS** | Restricts objects to systems, avoiding universalist explosion. |

  ### 5.2 Critique & Necessary Modifications
  *   **The Artifact Problem:** This hypothesis is a theory of *Natural Kinds* or *Systems*, not general *Composition*. To cover statues and corporations, the definition of "loop" must be expanded to include *externally maintained* constraints (e.g., a corporation is maintained by legal/regulatory loops; a statue by cultural preservation).
  *   **The "Squint" Factor:** You noted "maybe a market if you squint." If the theory requires squinting, it risks becoming unfalsifiable. The spec requires the mechanism of maintenance to be specifiable (e.g., feedback loops, regulatory frameworks).
  *   **Verdict:** As it stands, this is a **Restricted Composition Theory** (Organicism/Systemism). It is adequate for the "alive" cases (Human, Slime Mold, Beehive, Reef) but inadequate for the "static" cases (Statue, Lump, Pile) without significant modification to include *functional* or *social* maintenance loops.

  ---

  ## 6. SUMMARY OF CLASSIFICATIONS

  | Requirement | Classification | Rationale |
  | :--- | :--- | :--- |
  | **Logical Consistency** | Non-Negotiable | Without logic, no theory. |
  | **Empirical Non-Contradiction** | Non-Negotiable | Cannot contradict hard physics. |
  | **Counting Viability** | Non-Negotiable | Must allow for quantification. |
  | **Diachronic Coherence** | Non-Negotiable | Must handle time/change. |
  | **Vagueness Location** | Camp Preference | Ontic vs. Semantic is a metaphysical choice. |
  | **Causal Work** | Camp Preference | Realism vs. Instrumentalism. |
  | **Statue/Lump Solution** | Camp Preference | Coincidence vs. Identity vs. Elimination. |
  | **Gunk/Junk Compatibility** | Preference (Robustness) | Desirable for generality, not strictly required. |
  | **"Self-Maintaining Loop"** | Candidate Principle | Strong on biology/physics, weak on artifacts. |

  ## 7. FINAL INSTRUCTION FOR THE READING GROUP

  When evaluating any text or theory, do not ask "Is this true?" Ask:
  1.  **Which Non-Negotiables does it violate?** (If any, discard).
  2.  **Which Camp Preferences does it prioritize?** (Identify the bias).
  3.  **Which Trade-Offs does it accept?** (Identify the cost).
  4.  **Does it handle the "Bug List" (Sand, Cloud, Flame, You)?** (Check the edge cases).

  *If a theory claims to solve all Trade-Offs without cost, it is likely hiding a contradiction.*
