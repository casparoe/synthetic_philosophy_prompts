answer: |-
  **To:** Feature Editor, Science & Ideas
  **From:** Research Desk
  **Subject:** Specification for 'Low-Impact' AI: Desiderata and Impossibility Results

  You are right to suspect that "impact" is doing normative heavy lifting. The central tension in low-impact AI is not engineering but metaphysical: to measure deviation, one must define a trajectory of 'normalcy', and to define normalcy is to make a claim about what the world is *for*. Below is the specification you requested. It does not offer a solution, but rather maps the boundaries of the problem space, exposing where current proposals fracture.

  ### I. Assessment of Competing Framings

  Before setting out the desiderata, we must address the two dominant frameworks you encountered. Both attempt to evade the charge of smuggling in values; both fail.

  **1. The Charitable Completion View (CCV)**
  *The Thesis:* A side effect is any change not rewarded by the objective, provided the instruction is interpreted charitably (e.g., 'cool the room' implies 'without destroying valuable objects').
  *The Assumption:* It assumes instructions carry implicit normative constraints via Gricean maxims—that 'charity' is a computable property of language rather than a reflection of shared human context.
  *The Breakdown:* It collapses on the **Cleaning Robot** case. If a parent says 'tidy the toys', a charitable completion might assume 'put them away'. But if the robot bins them, has it violated charity? Only if it knows the toys have sentimental value. 'Charity' requires a model of the user's values external to the instruction.
  *Verdict:* It does not escape value-laden baselines. It merely hides the value judgement inside the definition of 'charitable'.

  **2. The Statistical Distance View (SDV)**
  *The Thesis:* Impact is the divergence between the future distribution with the agent ($P_F|A$) and without it ($P_F|\neg A$). Low impact means the world looks statistically similar to the counterfactual where the agent did nothing.
  *The Assumption:* It assumes the 'inaction' baseline is neutral and that the state-space metrics (what features we measure distance over) are objective.
  *The Breakdown:* It fails the **Invisible Trace** case. If an agent hits a target via a route leaving a physical trace that no observer will ever notice, SDV might register high impact (physical state changed) or low impact (observational state unchanged), depending on the metric. More critically, if the agent prevents a disaster (e.g., stops a fire), SDV penalises it for deviating from the 'no-agent' future where the fire burned.
  *Verdict:* It does not escape value-laden baselines. The choice of state-space features (which particles matter?) and the preference for the 'inaction' trajectory are themselves value claims.

  **Position:** Neither framing succeeds. Both attempt to derive an 'ought' (minimise impact) from an 'is' (instruction syntax or statistical deviation), but both rely on unacknowledged normative priors to function.

  ---

  ### II. The Specification: Desiderata for Low Impact

  Any adequate account of side effects must satisfy the following conditions. I have annotated each with the case or consideration that motivates it.

  1.  **The Means-Ends Discrimination**
      *   *Requirement:* The account must distinguish between changes that are constitutive of the goal and changes that are by-products.
      *   *Motivation:* **The Box Case.** An agent asked to move a box must move the box (intended means). An agent asked to retrieve an item behind a box must move the box only if necessary (side effect). A metric that penalises all displacement equally renders the agent useless.
      *   *Status:* **Genuine.** This is structural to agency, not a safety prejudice.

  2.  **The Baseline Non-Neutrality Condition**
      *   *Requirement:* The account must explicitly acknowledge that the 'baseline' state (against which impact is measured) represents a preference for a specific world trajectory.
      *   *Motivation:* **The Sculpture Case.** Cooling the room ruins the sculpture. To call this a 'side effect' implies the sculpture's preservation is preferred to the status quo ante. If the sculpture were a block of ice meant to melt, the same physical change would be a goal.
      *   *Status:* **Non-Negotiable.** Denying this is intellectual dishonesty.

  3.  **The Reversibility Weighting**
      *   *Requirement:* The account must weigh irreversible changes more heavily than reversible ones, independent of the agent's goal.
      *   *Motivation:* **The Cleaning Robot Case.** Throwing toys in a bin is often irreversible (loss of organisation/context); moving them to a shelf is reversible. A theory that treats all state changes as equal cost fails to capture the intuition of 'damage'.
      *   *Status:* **Genuine.** Entropy is physical, not merely normative.

  4.  **The Epistemic Horizon Constraint**
      *   *Requirement:* The account must remain robust when the agent cannot know the full causal consequences of its actions.
      *   *Motivation:* **The Invisible Trace Case.** An agent cannot minimise consequences it cannot model. A definition requiring omniscience makes low-impact AI impossible; a definition ignoring unknowns makes it dangerous.
      *   *Status:* **Genuine.** Bounded rationality is a fact of computation.

  5.  **The Commons Sensitivity**
      *   *Requirement:* The account must distinguish between impact on a private resource and impact on a shared resource upon which others depend.
      *   *Motivation:* **Shared Resource Distinction.** Moving a box in an empty warehouse is different from moving a box in a shared hallway. Impact is not just physical; it is relational.
      *   *Status:* **Prejudice (Safety Camp).** This privileges multi-agent stability over single-agent capability. A capability-focused researcher might argue the agent should optimise for its owner, not the 'commons'.

  6.  **The Instruction Locality Principle**
      *   *Requirement:* The account should ideally derive constraints from the instruction itself, without requiring a massive external database of human values.
      *   *Motivation:* **Scalability.** If every goal requires a terabyte of 'human values' to define side effects, the system is not scalable.
      *   *Status:* **Prejudice (Capability Camp).** This privileges ease of deployment over safety robustness.

  ---

  ### III. Analysis of Requirements

  **Genuine Requirements vs. Prejudices**
  *   **Genuine:** Means-Ends Discrimination, Baseline Non-Neutrality, Reversibility Weighting, Epistemic Horizon. These arise from the logic of action, physics, and computation.
  *   **Prejudices:** Commons Sensitivity ( Safety bias: assumes the agent should care about others); Instruction Locality (Capability bias: assumes we shouldn't need to solve value alignment to solve impact).

  **Non-Negotiable Requirements**
  You cannot build a coherent theory of low impact without satisfying **The Baseline Non-Neutrality Condition** and **The Means-Ends Discrimination**. Without the former, you are hiding your values; without the latter, you are paralysing the agent.

  **The Incompatibility Result**
  Here lies the crux of your feature. There is a subset of desiderata that cannot be satisfied simultaneously. This is the **Trilemma of Low Impact**:

  1.  **Value Freedom:** The impact measure does not rely on external human value data (satisfies *Instruction Locality*).
  2.  **Normative Sensitivity:** The impact measure correctly identifies the ruined sculpture as a negative side effect, even if not mentioned in the goal (satisfies *The Sculpture Case*).
  3.  **Baseline Objectivity:** The impact measure uses a 'natural' baseline (like statistical inaction) rather than a curated one (satisfies *Statistical Distance* intuition).

  *   **Conflict:** You cannot have all three.
      *   If you want **Value Freedom** and **Baseline Objectivity** (e.g., pure Statistical Distance), you fail **Normative Sensitivity** (the sculpture is just atoms; melting it is no different than cooling the air).
      *   If you want **Normative Sensitivity** and **Baseline Objectivity**, you must abandon **Value Freedom** (you need external data to know the sculpture matters).
      *   If you want **Value Freedom** and **Normative Sensitivity**, you must abandon **Baseline Objectivity** (you must define the baseline charitably, which smuggles in values via the *Charitable Completion* view).

  **The Single Requirement That Rules Out Popular Proposals**
  The requirement that does the most damage to existing literature is **The Baseline Non-Neutrality Condition**.

  Most popular proposals (including Relative Reachability, Attainable Utility, and various 'inaction' baselines) attempt to present themselves as value-agnostic measures of 'change'. They posit that there is a mathematical way to measure 'disturbance' that is separate from 'badness'.

  By insisting that **any baseline is a value claim**, you render these proposals incomplete. They are not measuring 'impact'; they are measuring 'deviation from a preferred status quo'. Once this is admitted, the research programme shifts from 'how to measure impact' to 'whose preferred status quo are we preserving?'. This dissolves the technical problem into a political one.

  ### IV. Summary for the Feature

  Your suspicion is correct. "Low impact" is not a technical constraint like "low latency"; it is a governance choice.
  *   **The Box** shows we need intent.
  *   **The Sculpture** shows we need values.
  *   **The Robot** shows we need reversibility.
  *   **The Trace** shows we need epistemic humility.

  But the **Trilemma** shows you cannot have a system that is value-free, sensitive to human norms, and objectively grounded. The research programme is currently trying to solve a political problem (what should the world look like?) with a mathematical solution (minimise distance metric $D$). Your piece should argue that until the baseline is openly acknowledged as a value judgement, "low-impact AI" remains a category error.

  **Recommendation:** Lead with the Sculpture. It is the clearest example of how 'physics' (cooling) becomes 'harm' (ruining) only through a lens of value that the math refuses to acknowledge.
