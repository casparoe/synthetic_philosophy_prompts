answer: |-
  # The Unavailable Act

  The form lay on the plastic armrest of the waiting room chair, white and stark against the beige upholstery. It was a simple consent sheet, one page, single-sided. *Prognostic Biomarker Panel.* Below the checkbox for authorization was a line for signature. Below that, a note: *Results available within twenty-four hours. No cost to patient family.*

  Elena held a pen in her hand, but the cap was still on. She watched the receptionist's fingers clicking at a keyboard behind the plexiglass shield. The sound was rhythmic, indifferent. Outside, the rain blurred the city street into grey smears of brake lights and umbrella tops.

  She knew what the test would say. Not the specific result, but the nature of it. It would divide the future into two distinct paths. Path A: A slow, manageable decline over five to seven years. Path B: A rapid collapse within eighteen months. The science was settled. The lab had a ninety-eight percent accuracy rate. It was reliable, free, and directly relevant to the decision waiting for her at home.

  The decision was about the house. Her father's house, now hers. The decision was about the care. Her father, in the bedroom down the hall, needed lifting, feeding, and cleaning. He needed eyes on him constantly. She could do this here, with home hospice support, or she could sign him into the facility on the edge of town. The facility was better equipped for rapid collapse. The home was better for slow decline.

  If she knew the timeline, she could optimize. She could spare herself the ruin of preparing the house for a long haul that wouldn't happen. She could spare him the discomfort of home modifications if he was leaving soon. Logic dictated she sign the paper. Logic dictated that information was a tool, and tools were good.

  "Elena."

  She looked up. Mark was standing by the door, shaking water from his coat. He was her father's neurologist, but also an old friend of the family. He wore his stethoscope like a necklace even when he wasn't on shift, a habit she found comforting once, and now found heavy.

  "You're still here," he said, sitting in the chair next to her. He didn't look at the form. He looked at her face.

  "I'm thinking."

  "There's no thinking to do. It's data. It's a map."

  "It's a verdict."

  Mark sighed, leaning forward, elbows on his knees. "Look. I know what you're worried about. You think if it's the bad news, you'll crumble. But you're stronger than that. And even if you don't want to hear it, you should have it. It's free. It's reliable. Why would you ever choose to be in the dark?"

  "Because the dark is where I can move," Elena said.

  Mark frowned. "That's superstition, El. Ignorance doesn't give you mobility. It gives you blindness. If you know the road is washed out, you don't drive into the river. You take the detour. If you don't know, you drive into the river. Knowing saves you from the crash."

  "But what if I want to drive the road?"

  "Even if it kills you?"

  "Even if it costs me everything."

  Mark shook his head, frustrated. "This isn't about heroics. This is about resource allocation. This is about managing risk. If you know the prognosis is short, you put him in the facility. You save your savings. You save your back. You save your life. If the prognosis is long, you keep him here. You modify the bathroom. You hire the lift. Either way, you win. You can't lose by knowing."

  Elena turned the pen over in her hand. The plastic was cool. "You're assuming I'm the same person after I know."

  "You are you," Mark said. "You don't change because you read a number."

  "I do," she said. "If I know he has eighteen months, I cannot keep him here. I won't be able to do it."

  "Sure you will. You love him."

  "No. If I know it's eighteen months, I will look at him and see a countdown. I will lift him and feel the weeks ticking off my own life. I will become a caretaker who is watching a clock. I can't be that person. If I don't know, I lift him and I feel his weight. Just his weight. Not the weight of the time left."

  Mark sat back. "So you're saying you're too weak to handle the truth."

  "I'm saying the truth changes the work. In the dark, I can choose to stay. I can choose to care for him as if he might stay forever. That choice is open to me. If I know he's leaving soon, that choice closes. I physically cannot make myself do it. I will put him in the facility because I will know it's the rational thing to do. I will become rational."

  "And that's bad?"

  "It means I lose the option of being irrational," Elena said. "It means I lose the option of being the daughter who doesn't calculate."

  Mark rubbed his face. "Elena, listen to me. This is basic sense. You have two choices: Home or Facility. You have two states of the world: Long or Short. If you know the state, you pick the best choice for that state. If you don't know, you pick the best choice for the average. The average is always worse than the specific. You are literally choosing to be less effective. You are choosing to suffer more for no reason."

  "I'm choosing to keep my hands clean," she said.

  "Your hands are already dirty. You're changing sheets. You're washing bodies."

  "There's a difference between dirt and stain," she said. "If I know the end is near, every sheet I change is a waste. Every meal I cook is pointless. I can't cook pointless meals, Mark. I can't do it. If I know, I stop. If I don't know, I cook."

  "So you're refusing the test so you can force yourself to do extra work?"

  "I'm refusing the test so I can do the work at all."

  Mark stood up, pacing the small strip of carpet. "You're arguing that knowing removes an option. That's impossible. Knowing adds options. It never takes them away. You can always ignore the test. You can put the result in a drawer and do exactly what you would have done anyway. You have that power."

  Elena looked at the form. "I don't have that power. You know I don't. Once I see the number, I can't unsee it. It will sit in the room when I feed him. It will sit on my chest when I sleep. You say I can ignore it. I say I can't. And if I can't, then the act of 'Keeping him home without knowing' is gone. It's not on the menu anymore."

  "That's a psychological failure," Mark said softly. "That's not rationality. That's fear."

  "Maybe," Elena said. "But it's my fear. And it dictates what I can do. You're talking about a person who can know the house is burning and still sit at the table. I'm not that person. If I know it's burning, I leave. If I don't know, I sit. I want to sit."

  Mark stopped pacing. He looked at her with a mixture of pity and professional annoyance. "You're gambling with your own stability. If it's the long decline, and you're here without the lift, you'll throw out your back. If it's the short decline, and you're here without the facility support, you'll drown in the work. You are choosing the worst of both worlds to preserve a feeling."

  "I'm choosing the only world where I'm still me," Elena said.

  She capped the pen. The click was loud in the quiet room.

  "I'm not signing," she said.

  Mark looked at the form, then at her. He didn't argue further. He knew the set of her jaw. He knew that look. It was the look her father had worn when he refused the wheelchair, right up until the day he fell. It was stubbornness, yes. But it was also a kind of integrity.

  "You know I have to log this as a refusal," Mark said. "I have to note that you were offered counsel."

  "Note it," Elena said. She stood up. Her knees popped. She was thirty-four, but she felt sixty. The fatigue was a constant hum in her bones, a vibration that never stopped. She picked up her bag.

  "If you change your mind," Mark said. "The lab holds the sample for a week."

  "I won't."

  She walked out into the rain. The air was cold and smelled of wet asphalt and exhaust. She didn't open her umbrella. She let the water soak into her hair, into her coat. It felt like a baptism, or perhaps just a cooling.

  The drive home was short. She parked in the driveway, the tires crunching on the gravel. The house was a small Victorian, peeling white paint, a porch that sagged slightly on the left side. She had meant to fix the porch. She had meant to do a lot of things.

  Inside, the house smelled of antiseptic and boiled carrots. It was a smell that had settled into the curtains, the rugs, the wood of the floorboards. She hung her coat on the rack. She washed her hands. She dried them on the towel that was already damp from the morning.

  She went down the hall to the bedroom.

  Her father was awake. He was lying on his side, facing the window. His breathing was shallow, a rhythmic flutter. He had been a large man once, broad-shouldered, a carpenter who could lift beams alone. Now he was folded in on himself, limbs thin, skin translucent like parchment.

  " Dad?" she said.

  He turned his head. His eyes were cloudy, but they found her. For a moment, the fog lifted. It happened sometimes, brief windows of clarity that were more cruel than kind.

  "Ellie," he said. His voice was a rustle.

  "I'm here."

  "Did you go?"

  "Yes."

  "And?"

  "And I'm home."

  He looked at her hands. "You didn't open it."

  "No."

  He closed his eyes. A small smile touched his lips. "Good."

  "Why is it good?" she asked. She sat on the edge of the bed. The mattress dipped.

  "Because now you'll stay," he said. "If you knew... you'd send me away. You'd be smart. You'd be safe."

  "I would," she admitted. "If I knew, I'd put you in the facility. I'd save myself."

  "But you don't know."

  "No. I don't know."

  "So you'll stay."

  "Yes."

  He reached out. His hand was trembling. She took it. It was light, bird-bones wrapped in paper. She held it with both of her own. She felt the fragility of it. If she knew how soon this hand would be cold, she would let go. She would have to. She would not be able to bear the weight of holding something that was already gone. But because she didn't know, she could hold it as if it would last.

  "Soup?" she asked.

  "Later," he said. "Just sit."

  She sat. She watched the rain streak the window. She thought about Mark's argument. It was flawless. It was the argument of a sane world. In a sane world, you gather data. You minimize loss. You protect your future self. You do not volunteer for hardship when you can avoid it.

  But her future self was a stranger. The woman who knew the prognosis was a different woman. That woman was a manager. That woman was a logistician. That woman made spreadsheets. That woman did not sit on the edge of a bed holding a dying man's hand for an hour because there was nothing else to do. That woman would have a schedule.

  Elena wanted to be the woman who sat.

  She knew the cost. She felt it in her lower back, a dull ache that flared when she stood up too quickly. She felt it in her bank account, which was dwindling as she cut her hours at the firm. She felt it in the social isolation, the friends who had stopped calling because they didn't know what to say, because the house was too sad, because she was always tired.

  If she took the test, and the result was short-term, she could stop. She could hand him over to the professionals. She could sleep eight hours. She could fix the porch. She could travel. She could have a life.

  If she took the test, and the result was long-term, she could prepare. She could install the lift. She could hire the night nurse. She could make it sustainable.

  By refusing, she chose neither. She chose the middle. She chose the struggle without the map. She chose the possibility of breaking herself against a task that might have been too hard, or too short, or both.

  Her father's breathing slowed. He was drifting off. She didn't move. Her leg began to go numb, but she didn't shift. To shift would be to acknowledge the discomfort. To acknowledge the discomfort was to acknowledge the cost. She wanted to bear the cost without counting it.

  Mark had said she was choosing to be less effective. He was right. She was choosing inefficiency. She was choosing to spend resources on a hope that might be mathematically negligible. She was choosing to irrigate a desert.

  But the theorem of it, the cold logic of it, assumed that the act of caring was just a transaction. Input labor, output comfort. If the output was limited by time, reduce the input.

  Elena knew that wasn't true. The act of caring wasn't about the output. It was about the input. It was about the quality of the person doing the giving. If she gave with calculation, the gift was corrupted. If she gave with knowledge of the end, the gift was a farewell. If she gave without knowledge, the gift was a presence.

  She wanted to be present.

  Her father stirred. "Cold," he murmured.

  She reached for the blanket at the foot of the bed. She pulled it up, tucking it around his shoulders. She smoothed the fabric over his chest. Her hand lingered there. She could feel the rise and fall.

  If she knew this was the last winter, she would be frantic. She would try to cram every moment full of meaning. She would be desperate. She would be unbearable to him.

  If she didn't know, she could just be here. She could be boring. She could be steady.

  She stood up. Her leg tingled as the blood returned. She walked to the window. The rain had stopped. The sky was a bruised purple, clearing in the west.

  She thought about the form in the clinic. It was probably already in the trash, or filed under *Refused*. It was a ghost now. A path not taken.

  She walked to the kitchen. She opened the cupboard. There were cans of soup, boxes of crackers, a bag of rice. She took out the rice. She filled the pot with water. She put it on the stove. She turned the flame to low.

  It was a pointless act. He might not eat it. He might die before it cooks. He might die tomorrow. He might die in five years.

  She stirred the water with a wooden spoon. She watched the bubbles form.

  Mark had said she was refusing information. She wasn't. She was refusing a change in state. She was refusing to become the kind of person who acts on that information. She was protecting her own capacity to act ignorantly.

  It was a fragile protection. It required discipline. Every day she would have to wake up and choose not to know. Every day she would have to lift him without wondering if this was the last lift. Every day she would have to feed him without wondering if this was the last meal.

  It was harder than knowing. Knowing was easy. Knowing gave you answers. Ignorance required faith. Not religious faith, but a secular faith in the value of the present moment regardless of the future.

  She tasted the water. It was hot. She added the rice.

  She leaned against the counter. The kitchen was quiet. The house settled around her. It was a heavy house. It was a house that needed repairs. It was a house that held a dying man.

  She could leave. She could sign the form tomorrow. She could call Mark. She could undo the refusal. The option was still there. The theorem said she should take it. The theorem said she was making a mistake.

  She looked at her hands. They were red from the water, the skin pruned. They were strong hands. They had changed sheets. They had lifted legs. They had wiped faces.

  If she knew the end, these hands would stop. They would fold. They would rest.

  If she didn't know, they would work.

  She turned off the stove. She ladled the rice into a bowl. She added a pinch of salt. She put it on a tray. She added a glass of water. A napkin.

  She carried the tray down the hall. The floorboards creaked. The sound was familiar. It was the sound of the house breathing.

  She entered the room. Her father was asleep. She set the tray on the bedside table. She sat back down on the chair. She waited for him to wake.

  She did not feel virtuous. She did not feel noble. She felt tired. She felt the weight of the unknown pressing on her shoulders, heavy as a yoke. She knew that someday she might break under it. She knew that someday she might look back and wish she had signed the paper. She knew that she was choosing pain.

  But she also knew that she was choosing herself.

  The room darkened as the sun went down. She didn't turn on the light. She sat in the grey twilight, watching the rise and fall of the blanket. She was not managing a decline. She was not optimizing a outcome. She was keeping a vigil.

  And a vigil, by definition, required that you did not know when it would end.

  She reached out and touched his hand again. It was warm.

  "I'm here," she whispered.

  She didn't know if he heard her. She didn't know if it mattered. She didn't know how long she would sit there.

  She just sat.

  Outside, the city lights came on, one by one. The world went on calculating, optimizing, measuring. The clinic closed. The lab locked its doors. The data was stored on a server, waiting for a query that would not come.

  Elena sat in the dark. She was not efficient. She was not rational. She was not safe.

  She was free.

  She stayed until his breathing changed, until the night deepened, until the rice was cold. She did not check the time. She did not check the calendar. She did not check the future.

  She only checked the hand in hers. It was still there.

  For now, that was enough.
