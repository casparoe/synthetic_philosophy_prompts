          *   *The Individualist Premise:* To make this work individualistically, you have to argue that "interests" are not just aggregated preferences but are tied to *context*. A rural interest is qualitatively different from an urban one. But equal *cantonal* weight is hard to derive from equal *individual* worth without assuming the canton is the relevant unit of agency.
