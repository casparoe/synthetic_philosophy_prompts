      *   *Addition:* Mention the "scheming" aspect. If the model is scheming, it can deceive the monitor. This makes the "Containment Tax" even higher because you need *deception-resistant* monitoring.
      *   *Refinement on "Containment Tax":* Make sure to distinguish between *computational* cost (slow) and *functional* cost (can't do the task). The user seems to mean functional.

