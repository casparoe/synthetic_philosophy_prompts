  **(Self-Correction Note):** I need to be careful not to conflate "preference revision" with "time-inconsistency." The reconstruction says "a rational agent doesn't revise her preferences." That's a strong claim. Standard rational choice allows preference change with new information. The argument must be about *arbitrary* revision or revision that leads to cycles. I need to point out that the reconstruction is sloppy here.

