answer: |-
  **MEMORANDUM**

  **TO:** Engagement Partners
  **FROM:** Head of Negotiation Strategy
  **SUBJECT:** Decision Protocol for Fixed-Sequence Deals (The "Centipede Protocol")
  **DATE:** October 26, 2023

  ### 1. THE PROBLEM
  Standard game theory (backward induction) dictates that in fixed-round deals with growth, the first mover should call the deal immediately. Our clients and their counterparts consistently ignore this, passing to grow the pot. We cannot afford to be the firm that says "Trust the Theory" when the market says "Pass," nor can we say "Trust Your Gut" without analytics. This protocol bridges that gap. It is designed for a one-hour analyst run-time and a one-page client defense.

  ### 2. THE DECISION PROCEDURE
  **Instruction to Analyst:** Answer the following five questions in order. If any step yields a **STOP**, the recommendation is **CALL NOW**. If all five yield **GO**, the recommendation is **PASS**.

  **Step 1: The History Check (Empirical)**
  *   **Question:** In earlier rounds of *this* specific deal, did the counterparty pass when the theoretical model suggested they should have called?
  *   **Data:** Deal logs, round timestamps, prior offer sheets.
  *   **Arithmetic:** Compare the pot size at the prior decision node to the theoretical "call" threshold.
  *   **Sufficient Answer for GO:** Yes, they passed when they should have called. (This establishes bounded rationality).
  *   **Sufficient Answer for STOP:** No, they acted rationally previously, or this is Round 1 of a new deal type.
  *   **Status:** *Arithmetic.*

  **Step 2: The Agent Check (Incentive)**
  *   **Question:** Is the counterparty negotiator personally penalized for calling the deal early (e.g., perceived as weak, failing a "grow the pot" KPI)?
  *   **Data:** Public statements, industry norms, known compensation structures.
  *   **Sufficient Answer for GO:** Yes. Their principal (board, union, voters) punishes early settlement more than risk of deal failure.
  *   **Sufficient Answer for STOP:** No. They are rewarded for certainty or have skin in the game on the downside.
  *   **Status:** *Judgment.* (Analyst must assess principal-agent misalignment).

  **Step 3: The Clock Check (Deadline)**
  *   **Question:** Is there a hard, public, and credible deadline known to both parties?
  *   **Data:** Press releases, statutory dates, public strike votes.
  *   **Sufficient Answer for GO:** No. The end is fuzzy, or one side can exit silently (hidden deadline).
  *   **Sufficient Answer for STOP:** Yes. A hard deadline restores backward induction logic as the end approaches.
  *   **Status:** *Arithmetic/Fact.*

  **Step 4: The Shadow Check (Recurrence)**
  *   **Question:** Will we (or our client) negotiate with this specific counterparty entity again within 24 months?
  *   **Data:** Portfolio roadmap, supply chain dependency, market concentration.
  *   **Sufficient Answer for GO:** Yes. Calling early burns reputation capital valuable in future games.
  *   **Sufficient Answer for STOP:** No. This is a one-off transaction.
  *   **Status:** *Judgment.* (Analyst must assess strategic relationship value).

  **Step 5: The Sleep Check (Risk Utility)**
  *   **Question:** Is the current "Call" payoff large enough that the marginal gain of the next round does not justify the risk of deal collapse or counterparty walk-away?
  *   **Data:** Client risk tolerance, absolute dollar value, probability of breakdown (estimated at 10% minimum per pass if no history exists).
  *   **Arithmetic:** If (Current Take) > (Expected Next Take × 0.9), STOP.
  *   **Sufficient Answer for GO:** No. The upside is worth the risk.
  *   **Sufficient Answer for STOP:** Yes. The absolute sum is too large to gamble (e.g., \$500M deal).
  *   **Status:** *Judgment dressed as Arithmetic.* (The probability of breakdown is an estimate, not a variable).

  **LIMITATIONS:** This procedure cannot predict irrational rage, force a counterparty to act against legal counsel, or account for information leaks not visible to the analyst. It assumes the "growth factor" is guaranteed if a pass occurs; if growth is uncertain, default to STOP.

  ***

  ### 3. CASE APPLICATIONS

  #### Case A: Public-Sector Procurement
  *   **Context:** 5 Rounds, \$10M start. Committee buyer. Published rules. No future business.
  *   **Step 1 (History):** **STOP.** No prior rounds; public entities typically follow published rational models.
  *   **Step 2 (Agent):** **STOP.** Committee members are risk-averse bureaucrats; calling early is "fiscal responsibility," passing is "gambling."
  *   **Step 3 (Clock):** **STOP.** Fiscal year-end is a hard, common-knowledge deadline.
  *   **Step 4 (Shadow):** **STOP.** One-off contract.
  *   **Step 5 (Sleep):** **GO.** Sums are moderate.
  *   **Result:** **STOP (CALL NOW).**
  *   **Analyst Note:** Despite the pot growing to \$38M by Round 4, the committee's incentive structure aligns with game theory. They will not pass to the end. We take the 60% of Round 1 (\$6M) rather than risk them calling Round 2.
  *   **Client Impact:** **HATED.** Client wants to chase the \$38M. We are advising them to take \$6M.

  #### Case B: Labor Negotiation
  *   **Context:** Union leadership. Public strike date (30 days). Members must vote on deal.
  *   **Step 1 (History):** **GO.** Leadership passed Round 1 despite weak terms.
  *   **Step 2 (Agent):** **GO.** Leadership cannot be seen as "caving." They are instructed *not* to call until the strike deadline is imminent.
  *   **Step 3 (Clock):** **GO.** Strike date is public, but the *internal* vote threshold is hidden.
  *   **Step 4 (Shadow):** **GO.** Same union, same company, multi-year contract cycle.
  *   **Step 5 (Sleep):** **GO.** Risk of strike is priced in.
  *   **Result:** **GO (PASS).**
  *   **Analyst Note:** The agency problem dominates the math. Leadership needs the strike threat to validate their call to members. We pass to let the clock pressure them.

  #### Case C: Two-Round Acquisition
  *   **Context:** Target (us) vs. Acquirer. 2 Rounds. Pot \$200M. Acquirer has public walk-away price of \$250M. Growth 40%.
  *   **Step 1 (History):** **N/A.** Round 1.
  *   **Step 2 (Agent):** **STOP.** Acquirer CFO is bonus-linked to deal completion, not price minimization.
  *   **Step 3 (Clock):** **STOP.** Walk-away price acts as a hard cap.
  *   **Step 4 (Shadow):** **STOP.** Hostile/takeover context. No repeat.
  *   **Step 5 (Sleep):** **STOP.** Current pot \$200M. Our share (40% if they call) = \$80M. If we pass, pot becomes \$280M. This exceeds their walk-away (\$250M). If we pass, they walk. Deal = 0.
  *   **Result:** **STOP (CALL NOW).**
  *   **Analyst Note:** The growth factor pushes the pot beyond the counterparty's hard constraint. Passing guarantees zero.
  *   **Client Impact:** **DEFENSIBLE.** Math proves passing kills the deal.

  ***

  ### 4. PARTNER SCRIPT (For the Client CFO)
  *"I know the pot looks bigger next week. I know it feels like leaving money on the table to sign today. But in this specific structure, 'waiting for growth' is not an investment strategy; it is a bet that the other side will make a mistake.*

  *In Case A, the other side is a committee. They don't make mistakes; they follow rules. If we wait, they won't grow the pot for us; they will call the deal on their terms, or the deadline will kill it. We are not taking \$6M instead of \$38M. We are taking \$6M instead of a 10% chance at \$38M and a 90% chance of zero.*

  *My job is not to tell you what you hope happens. My job is to tell you what happens if the other side acts in their own best interest. They call early. So must we."*
