prompt: |-
  ok, I'm building a bank of reasoning problems about infinite ethics — the kind where you've got infinitely many people and the usual total-vs-average stuff goes weird — and I need you to build me one thought experiment to spec. Dont explain infinite ethics to me, just build the thing.

  Here's the setup I want you to use. A "world" is just an infinite list of welfare levels, one per person: w(1), w(2), w(3), ... where each w is a whole number (negatives allowed). Two ways of ranking worlds, which I'm spelling out here so you dont have to go look anything up:

  Rule A (dictionary rule): compare two worlds person by person starting at person 1; the first person where the two lists disagree decides it, and whoever is better off at that person makes their world the better one.

  Rule B (long-run average rule): compare the limiting average welfare of the first N people as N grows; whichever world's average settles higher wins. Pick numbers where the limit actually exists.

  What I need from you:

  1. Two worlds, P and Q, such that Rule A ranks P above Q while Rule B ranks Q above P. Give me the actual sequences, and show the verdicts falling out of each rule — dont just assert them.
  2. Then change the case in the smallest way you can so that the two rules now agree, and say exactly what you changed and why that change killed the disagreement.
  3. Tell me what happens if you keep everything else the same but make the worlds finite — a last person instead of an infinite tail. Does the split survive?
  4. Name the single feature of the case that's really doing the work, and what you'd have to remove to make the two rules fall into line.
  5. Finally, how would someone who's fond of Rule A argue that your example is a cheap trick rather than a genuine problem for that rule?

  Keep it tight — the two sequences, the walkthrough, and those five answers. No citations, no "as so-and-so argues," I just want the reasoning. The whole point of these problems is to see the verdicts generated rather than stipulated, so if your example only works because you declared it works, it fails.
