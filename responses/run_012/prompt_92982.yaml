answer: |-
  # The shortlist

  1. Is predicate vagueness derivative of ontological indeterminacy (Problem of the Many)?
  2. What metasemantic constraint necessitates vagueness over precision?
  3. Does the determinacy operator admit a coherent higher-order logic?
  4. Is the 'no fact of the matter' intuition semantic or metaphysical?
  5. How does vagueness behave in comparative semantics?

  # The top three, in detail

  **1. Is predicate vagueness derivative of ontological indeterminacy (Problem of the Many)?**
  This is the most upstream because it dictates the explanandum. Your colleague is right to flag this: if objects themselves are vague, supervaluationism becomes a description of reality rather than just semantic indecision; if objects are sharp but numerous (the standard Problem of the Many), predicate vagueness collapses into epistemic uncertainty about reference. Settling this determines whether you are modeling language or the world. It is tractable for a logician because it relies on mereology and identity conditions rather than empirical psychology. You can formalize competing mereological models and test their compatibility with vague predication without leaving your armchair. A proof that ontological vagueness is metaphysically incoherent would drop supervaluationism to a merely linguistic patch, moving epistemicism to the top of the list; conversely, a coherent model of vague objects would make epistemicism look like a category error.

  **2. What metasemantic constraint necessitates vagueness over precision?**
  Truth conditions are downstream of why we have vague terms at all. If vagueness is merely semantic indecision (Lewis), supervaluationism fits naturally; if vagueness is functional—optimizing communication under cognitive constraints—epistemicism becomes costly because sharp boundaries serve no purpose and incur ignorance costs. This question is upstream because a functional explanation undermines the epistemicist's claim that sharp boundaries are a semantic datum. It is tractable via formal pragmatics or game-theoretic modeling of signaling games, requiring no empirical data beyond standard rationality assumptions. If you can demonstrate that vague predicates are evolutionarily or communicatively optimal compared to sharp ones, epistemicism loses its primary motivation (that precision is the default), forcing a major re-ranking toward semantic indeterminacy views.

  **3. Does the determinacy operator admit a coherent higher-order logic?**
  The stability of the determinacy operator ('D') is the technical bottleneck for supervaluationism. Standard models struggle to iterate 'D' without collapsing higher-order vagueness or violating plausible logical principles; epistemicism handles iteration trivially but at the cost of plausibility. This is upstream because if 'D' cannot be logically coherent without epistemic semantics, supervaluationism fails as a formal system. It is highly tractable for someone with a logic background, as it involves constructing models and checking validity rather than metaphysical speculation. A result showing that a non-epistemic logic of 'D' can accommodate infinite higher-order vagueness without collapse would revitalize supervaluationism; a proof that such a logic is impossible would effectively concede the technical ground to epistemicism.

  # What I'd leave alone

  **Standard Sorites reconstructions.** There are dozens of formulations (modus ponens, conditional, forced march), but they all stalemate. Attacking another version of the paradox won't break the standoff because both camps have ready answers tailored to their semantics. This is downstream work; it tests the theories rather than selecting them.

  **Truth-functionality debates.** Whether supervaluationism preserves classical connectives is a technical detail that doesn't resolve the core disagreement about the nature of borderline cases. Fixing truth-functionality often comes at the cost of other intuitions, making it a trade-off rather than a knockout argument. It's too adjacent to the main fault line.

  **Purely linguistic case studies.** Collecting more examples of vague predicates without a theoretical framework for why they are vague won't move the needle. Unless tied to the metasemantic or ontological questions above, data accumulation is low-value for a theoretical project.

  # What would move things

  *   **Proof of ontological vagueness incoherence:** A rigorous argument that vague objects violate Leibniz's Law or mereological transitivity would force Question 1 down, making predicate vagueness the primary datum and boosting epistemicism.
  *   **Demonstration of functional optimality:** A formal model showing vague signaling outperforms precise signaling in coordination games would push Question 2 up, making epistemicism look inefficient and unnatural.
  *   **Coherent non-epistemic model of higher-order determinacy:** Constructing a logic for 'D' that allows infinite iteration without collapse or epistemic interpretation would secure Question 3, stabilizing supervaluationism against its strongest technical objection.
  *   **Evidence of semantic context-dependence:** If vagueness is shown to be purely context-sensitive rather than inherent to predicates, both camps might need to dissolve into pragmatic theories, reordering the entire list.
