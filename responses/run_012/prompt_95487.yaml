answer: |-
  ### Brainstorm: The Space of "Nothing"

  Before we taxonomize the claim, we must map the terrain. The sentence "You cannot cause harm by doing nothing" feels like a description of physics, but it is almost never a claim about physics. In the physical world, there is no such thing as "doing nothing." A braking system that fails to engage is still a system in a specific state, consuming energy, maintaining voltage, or succumbing to entropy. The car continues forward due to momentum; the software continues running its idle loop.

  The problem is one of *individuation*. The world contains a infinity of negative facts (the moon did not crash into the car; the driver did not have a heart attack; the brake pedal did not turn into cheese). To call one of these non-events "the cause" requires a selection principle. When your interviewees say "doing nothing," they are attempting to categorize a system's *baseline state* as ontologically distinct from an *active intervention*.

  The "expectation" point you were told—that an omission is only an omission relative to an expectation—is not empty. It is the linchpin. It suggests that "nothing" is not a natural kind but a normative category. If there is no expectation of action, there is no omission, only the flow of events. This means the sentence is not describing the machinery; it is describing the relationship between the machinery and the society that deployed it.

  Here is the menu of distinct claims hidden inside that sentence, arranged from the trivial linguistic truth to the radical metaphysical falsehood.

  ***

  ### The Menu of Claims

  #### 1. The Lexical Stipulation
  **The Claim:** In ordinary English, the verb "to cause" implies an active transfer of energy or force. An absence cannot transmit force. Therefore, linguistically, an omission is not a "cause."
  *   **Status:** **Platitude (about language), False (about the world).** It is true that our grammar prefers agents who *do* things. It is false that physical causation requires active force (e.g., removing a support beam causes a collapse without adding energy).
  *   **Compatibility with But-For Facts:** **Compatible.** Everyone agrees the brake didn't move. This reading just says we shouldn't *call* that non-movement a "cause."
  *   **Does the Work?** **No.** This is the reading I suspect you identified: a truth about language masquerading as a truth about the world. It fails to do the exonerating work because legal and moral responsibility routinely attach to omissions (e.g., a lifeguard who doesn't swim). If the interviewees are arguing about liability, a dictionary definition won't save them.

  #### 2. The Salience Filter
  **The Claim:** There are thousands of but-for causes for any event (gravity, friction, the manufacturer's decision, the software's inaction). We only label the "abnormal" or "unexpected" factors as *the* cause. Since the system was designed to be passive by default, its inaction is background noise, not a salient cause.
  *   **Status:** **Substantive and Defensible Thesis.** This is the standard pragmatic view of causal attribution. We cite the spark, not the oxygen, unless we are in a vacuum chamber.
  *   **Compatibility with But-For Facts:** **Compatible.** It accepts the counterfactual (if it braked, no death) but argues that counterfactuals are too cheap to count as causal *explanations*.
  *   **Does the Work?** **Partially.** It explains why we intuitively hesitate to blame the system. However, it collapses if the system was *expected* to act. If the braking assist is sold as a safety feature, its inaction is no longer "background"; it is a feature failure. In your cases, the expectation was likely that the system *would* act, making this reading weak defense.

  #### 3. The Normative Conflation
  **The Claim:** "Causation" here is a proxy for "Culpability." The speaker means: "You cannot be held *responsible* for harm by doing nothing unless you had a prior duty to act." Since the machine has no moral agency, or the policy had no duty of intervention, there is no cause *in the eyes of the law*.
  *   **Status:** **Substantive and Defensible Thesis (in Law).** This is the standard legal distinction between misfeasance (active harm) and nonfeasance (passive harm). Liability for nonfeasance requires a special relationship or duty of care.
  *   **Compatibility with But-For Facts:** **Compatible.** It sidesteps the physics entirely. It says, "Even if we were a but-for cause, we are not a legal cause."
  *   **Does the Work?** **Yes.** This is almost certainly what the hospital administrator and the commentator mean. They are not making a metaphysical claim; they are drawing a liability boundary. They are using the word "cause" to do the work of "liable." It is a rhetorical slide, but a functional one in court.

  #### 4. The Metaphysical Denial
  **The Claim:** Absences are not real entities. Only positive events exist. Therefore, an omission literally has no causal power. The death was caused by the disease or the momentum of the car, not by the lack of medicine or braking.
  *   **Status:** **Radical and Generally False.** Most modern metaphysicians of causation reject this. While absences are ontologically weird, counterfactual dependence (if X hadn't happened, Y wouldn't have) is sufficient for most robust theories of causation. Denying this requires a very specific, restrictive physics-based view of causation that doesn't map well to biology or engineering.
  *   **Compatibility with But-For Facts:** **Incompatible.** It essentially denies the relevance of the counterfactuals your interviewees agreed upon.
  *   **Does the Work?** **No.** It is too easily dismantled. If I unplug your ventilator, I kill you. If I simply fail to plug it in, have I not also killed you? The physical outcome is identical. This reading is too brittle to sustain a defense in a complex socio-technical system.

  ***

  ### The "Expectation" Point

  You asked whether the claim "an omission is only an omission relative to some expectation" is deep or empty.

  **It is deep.** It is the key to unlocking why the sentence is so durable.

  If omissions were natural facts, like rocks or rain, we could find them with a Geiger counter. But we cannot. We identify an omission only by comparing reality to a model of how things *should* have been. "The brake failed" is not a description of the metal; it is a description of the metal's relationship to a design specification.

  This belongs on the menu as the foundation of **Reading 2 (Salience)** and **Reading 3 (Norms)**. It reveals that when your interviewees say "doing nothing," they are actually saying "conforming to the baseline." They are attempting to naturalize the status quo. By defining the system's default state as "nothing," they render any deviation from that default as "action." This allows them to frame the harm as the result of nature (the car moving, the disease progressing) rather than the result of the system's design (which chose that default).

  It is not empty because it exposes the political nature of the claim. To say "we did nothing" is to assert that the current state of affairs requires no justification, while any intervention would.

  ***

  ### The Verdict on the "Language as World" Trick

  You suspected one reading is true as a remark about language but used as a claim about the world.

  **It is Reading 1 (The Lexical Stipulation).**

  The speakers are relying on the grammatical intuition that "cause" requires an agentive verb. They are leveraging the asymmetry in our language between *killing* and *letting die* to suggest an asymmetry in the physical world. There is no physical asymmetry in the outcome (the patient dies either way), only a linguistic one. They use the linguistic truth to block the moral inference. It is a category error weaponized for defense.

  ***

  ### Questions for Your Next Interview

  When the next person tells you, "We cannot cause harm by doing nothing," ask them these three questions to force them off the rhetorical track:

  1.  "If I hire you to watch my child and you sit on the couch while they drown in the pool, have you done *nothing*?" (This tests whether they truly believe omissions aren't causes, or if they only believe it when *they* are the ones omitting.)
  2.  "Is 'doing nothing' a state the system was designed to hold, or a state it fell into?" (This distinguishes between a passive default and a failure mode.)
  3.  "If the sentence is about physics, why does it only appear in discussions about liability?" (This forces them to admit the claim is normative, not metaphysical.)

  ***

  ### My View on the Sentence's Durability

  Why does this sentence survive? Why is it so hard to kill?

  It endures because it protects the **Default**. In engineering, law, and ethics, the status quo is treated as "nature," and any change to the status quo is treated as "interference." By labeling the system's inaction as "doing nothing," the defenders categorize the harm as an act of nature (the disease, the collision) rather than an act of design.

  The sentence is durable because it is a **conservation of responsibility**. It asserts that responsibility, like energy, cannot be created out of a void. If you did not inject energy into the system (by acting), you cannot be the source of the entropy (the harm). It is a comforting physics metaphor for moral luck. It allows us to build systems that kill by default, provided we can convince everyone that the default was merely "nothing."
