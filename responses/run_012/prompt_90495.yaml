      *   *Refinement:* Emphasize the "Burden of Proof." In a trial, the default is liberty (innocent). In legislation, the default is usually the status quo, but bills can change anything. The stakes are distributed differently.
      *   *Refinement:* The "Adversarial" point. In a trial, truth is supposed to emerge from conflict. In legislation, compromise is the goal. A jury doesn't compromise on the verdict (usually); they agree or hang. A legislature *must* compromise to function.
