      *   **Friend's Conclusion:** Sortition should *replace* elections for the legislature. Term limits are insufficient.
      *   **User's Goal:** Wants to audit the analogy properly, not with slogans ("expertise," "accountability"). Needs an explicit mapping, an analysis of where the mapping breaks (structural features), an evaluation of which disanalogies matter for the conclusion, and suggestions for better analogies or approaches.
      *   **Tone:** Academic, rigorous, nuanced, philosophical but accessible.

  2.  **Deconstruct the Jury Analogy (The Mapping):**
