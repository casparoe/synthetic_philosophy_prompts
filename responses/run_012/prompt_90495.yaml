  3.  **Analyze the Disanalogies (Where it Breaks):**
      *   *Scope of Decision:* Jury = Retrospective, Binary (Guilty/Not), Specific Case. Legislature = Prospective, Complex/Multi-dimensional, General Rules.
      *   *Role of Law:* Jury applies existing law (Judge instructs). Legislature *makes* law (No higher instruction except Constitution).
      *   *Adversarial Structure:* Jury has clear sides (State vs. Defendant). Legislature has many sides, coalition building, logrolling.
      *   *Burden of Proof:* Jury (Beyond Reasonable Doubt/Preponderance). Legislature (Majority rule, no "innocent until proven guilty" equivalent for bills).
      *   *Unanimity:* Juries often require unanimity (or near). Legislatures operate on majority.
      *   *Duration/Identity:* Jurors are temporary, anonymous, protected. Legislators are public, accountable, long-term (in the friend's view of the problem).
      *   *Agency:* Jurors decide *facts* within a legal framework. Legislators decide *values* and *resource allocation*.

  4.  **Evaluate the Impact on the Conclusion:**
      *   Does the analogy support *replacing* elections? No, because the functions are different.
      *   Does it support *sortition* generally? Yes, for specific functions (deliberative, fact-finding, checking power).
      *   Does it argue against *professionalization*? Yes, but maybe not for the *entire* legislature.
      *   *Key Insight:* The jury is a *check* on power (judicial), not the *source* of power (legislative). A sortition legislature would be the source of power. This is a category error.

  5.  **Develop Better Analogies/Frameworks:**
      *   *Statistical Sample:* Sortition as descriptive representation (mirroring the populace).
      *   *Deliberative Poll:* Sortition for *opinion formation*, not necessarily binding law.
      *   *Hybrid Model:* Bicameralism (one elected, one sorted).
      *   *Analogy Shift:* Instead of "Legislature as Jury," maybe "Second Chamber as Jury" or "Constitutional Convention as Jury."

  6.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the strength of the friend's intuition (democratic equality) but validate the user's skepticism about the institutional leap.
      *   *Section 1: The Explicit Mapping:* Create a clear table or list.
      *   *Section 2: Structural Disanalogies:* Go through the specific features the user mentioned (Judge's instructions, adversarial framing, etc.).
          *   *Crucial Point:* The "Judge's Instructions." Jurors follow law; Legislators make law. This is the biggest break.
          *   *Crucial Point:* Retrospective vs. Prospective. Judging the past is easier than designing the future.
      *   *Section 3: Evaluating the Conclusion:*
          *   Does it justify replacing elections? No.
