answer: |-
  This is a rich philosophical problem. Your friend's argument relies on what political theorists call the "Jury Principle": the intuition that ordinary citizens, if properly structured and insulated from corruption, are competent to make high-stakes decisions. This is a respectable position (defended by thinkers like Alexander Guerrero and David Van Reybrouck). However, treating the analogy as *decisive* for replacing the entire legislature is a category error.

  To audit this properly, we must move beyond "expertise" (which can be hired) and "accountability" (which can be structured) and look at the *functional morphology* of the two institutions.

  ### I. The Explicit Mapping

  Here is the translation key your friend is implicitly using to move from the courtroom to the chamber.

  | **Judicial Domain (Jury Trial)** | **Legislative Domain (Proposed Sortition)** |
  | :--- | :--- |
  | **Juror** | **Legislator (selected by lot)** |
  | **Defendant** | **The Polity / The Public Interest** |
  | **The Charge / Indictment** | **The Proposed Bill / Policy** |
  | **Evidence / Witness Testimony** | **Committee Hearings / Expert Testimony** |
  | **Prosecution & Defense** | **Executive Branch / Advocacy Groups / Opposition** |
  | **Judge (Procedure & Law)** | **Speaker / Constitutional Court / Rules Committee** |
  | **Jury Instructions (Legal Framework)** | **Constitution / Existing Statutory Law** |
  | **Verdict (Guilty/Not Guilty)** | **Statute (Pass/Fail)** |
  | **Appeal** | **Election / Judicial Review** |
  | **Professional Jury (Forbidden)** | **Career Politician (Tolerated)** |

  ### II. Structural Disanalogies: Where the Mapping Breaks

  The analogy holds up well regarding *selection* (randomness ensures independence) and *insulation* (freedom from campaigning). It collapses regarding *function* and *output*. Here are the specific structural breaks you asked about.

  **1. The Judge's Instructions (Law-Applying vs. Law-Making)**
  *   **Jury:** The judge instructs the jury on the law. The jury's task is to find *facts* and apply *existing law* to those facts. They are bound by a normative framework they did not create.
  *   **Legislature:** There is no "judge" instructing the legislature on what the law *ought* to be. They are creating the normative framework itself.
  *   **Why it matters:** It is cognitively easier to judge a specific past action against a known standard than to design a general future rule without a standard. A sortition legislature lacks the "instructions" that make a jury's decision rational. Without a pre-existing policy framework, they are not just deciding facts; they are deciding values.

  **2. Retrospective/Binary vs. Prospective/Complex**
  *   **Jury:** Decisions are retrospective (did this happen?) and binary (guilty or not). The cognitive load is focused on truth-finding regarding a specific event.
  *   **Legislature:** Decisions are prospective (what *should* happen?) and multi-dimensional (budget allocations, regulatory trade-offs, symbolic values). A bill is rarely a binary choice; it is a complex text with thousands of implicit consequences.
  *   **Why it matters:** The "beyond a reasonable doubt" standard works for binary choices. There is no equivalent standard for legislation. Do we pass a tax bill if it is "probably good"? What if it helps group A but hurts group B? The jury analogy provides no mechanism for weighing competing goods, only for establishing truth.

  **3. Adversarial Framing vs. Coalition Building**
  *   **Jury:** The system is adversarial. Truth is theoretically found through the clash of two opposed narratives. The jury is a passive arbiter between two active sides.
  *   **Legislature:** The system is (ideally) collaborative. Legislation requires drafting, amending, and logrolling. Legislators are active participants, not passive arbiters.
  *   **Why it matters:** If you import the jury model, who plays the prosecutor and who plays the defense for a tax code? If the "Executive" prosecutes bills, you have merged the executive and legislative powers in a way that threatens separation of powers. If legislators must draft the bills themselves, they are no longer jurors; they are advocates.

  **4. Unanimity vs. Majority Rule**
  *   **Jury:** Often requires unanimity (or near it). This protects the minority (the defendant) by giving any single juror veto power.
  *   **Legislature:** Operates on majority rule. Minorities are expected to lose; that is the essence of democratic aggregation.
  *   **Why it matters:** The jury is designed to *stop* state power (a negative check). The legislature is designed to *wield* state power (a positive force). A sortition body operating by majority rule loses the protective logic of the jury; a sortition body operating by unanimity would result in gridlock.

  **5. The "Defendant" Problem**
  *   **Jury:** The defendant is a specific individual with rights. The bias is toward liberty (innocent until proven guilty).
  *   **Legislature:** Who is the defendant? If it is "the public," the public is both the jury and the defendant. If a law restricts liberty, the jury is restricting its own liberty.
  *   **Why it matters:** In a trial, the juror's interest is detached from the outcome (ideally). In legislation, the legislator's interest is intrinsic to the outcome (taxes, rights, war). The detachment required for the jury analogy to work is impossible in a legislature.

  ### III. Does the Analogy Support His Conclusion?

  Your friend argues for **Replacement** (Sortition > Election) and rejects **Term Limits** as a half-measure. The audit suggests the analogy cannot carry this weight.

  **1. Replacement? No.**
  The jury analogy supports sortition as a *checking* mechanism, not a *governing* mechanism. Juries check the power of the judge and the prosecutor. They do not run the court system. Therefore, the analogy supports a **Bicameral** or **Hybrid** model where a sortition body reviews, delays, or vetoes legislation (like a democratic House of Lords), but not one that originates and manages the entire legislative agenda.

  **2. Term Limits vs. Sortition.**
  The friend asks: "Would we tolerate a permanent professional jury?"
  *   **Answer:** No, because a jury's function is to be a *snapshot* of community standards at a specific time.
  *   **Counter:** A legislature's function is to build *institutional memory* and *long-term strategy*.
  *   **Verdict:** The analogy argues against *careerism* (professionalization), but not necessarily against *experience*. Term limits address careerism without sacrificing the continuity that a pure sortition chamber would lose every session. The jury analogy cuts against professionalization, but it does not prove that *randomness* is the only alternative to *careerism*. Election with strict term limits is also an alternative to careerism.

  **3. Which Disanalogies Matter?**
  The **Law-Making vs. Law-Applying** distinction is the fatal flaw for the "Replacement" conclusion.
  *   If the task is **Adjudication** (deciding if a policy violates rights), the jury analogy is strong. (This supports a sortition Constitutional Court).
  *   If the task is **Aggregation** (deciding how to split the budget), the jury analogy is weak. (Juries don't split money; they decide liberty).
  *   If the task is **Deliberation** (finding the best argument), the jury analogy is moderate.

  ### IV. Better Analogies and Institutional Designs

  If the "Jury" analogy is too blunt, what frameworks better capture the potential of sortition without overpromising?

  **1. The "Statistical Sample" (Descriptive Representation)**
  *   **Concept:** A legislature should be a microcosm of the people, not a collection of elites.
  *   **Implication:** Sortition ensures the legislature *looks* like the populace (class, race, education).
  *   **Limit:** A sample represents the population's *preferences*, not necessarily its *deliberative potential*. This supports sortition for **agenda-setting** (what should we talk about?) rather than final voting.

  **2. The "Deliberative Poll" (Opinion Formation)**
  *   **Concept:** Citizens change their minds when informed and given time to talk.
  *   **Implication:** Sortition bodies should be used to test public opinion under ideal conditions, not to bind the public to laws they haven't debated.
  *   **Design:** A sortition chamber that can **delay** or **referendum-trigger**, but not pass final statutes. This uses the "jury" deliberation strength without the "law-making" weakness.

  **3. The "Fourth Branch" (The Oversight Jury)**
  *   **Concept:** Instead of replacing the legislature, create a sortition body to oversee the bureaucracy and the elected legislature.
  *   **Analogy:** This is the truest use of the Jury. A jury checks the State.
  *   **Design:** A Citizens' Assembly with the power to audit agencies, subpoena officials, and recommend impeachment or legislative review. This aligns with the "permanent professional jury" critique: we don't want professional overseers; we want regular people checking the professionals.

  **4. The "Constitutional Convention" (Foundational Law)**
  *   **Concept:** Juries decide high-stakes questions of principle.
  *   **Implication:** Sortition is best suited for **constitutional** questions (rules of the game) rather than **statutory** questions (playing the game).
  *   **Design:** Use sortition to draft or revise the constitution, then return to elections for daily policy. This matches the high-stakes/low-frequency nature of jury duty.

  ### V. Conclusion for Your Seminar

  You can concede to your friend that the **Jury Analogy successfully indicts the professionalization of politics.** He is right that we tolerate a "permanent professional jury" in the legislature, and that this creates a class interest distinct from the public.

  However, you should argue that the analogy **fails to license the total replacement of elections.**
  1.  **Function:** Juries apply law; Legislatures make law. The cognitive and normative tasks are different.
  2.  **Structure:** Juries are adversarial and binary; Legislatures are coalitional and complex.
  3.  **Agency:** Juries are passive arbiters; Legislators are active architects.

  **The Synthesis:**
  The jury analogy does not support a **Sortition Legislature**; it supports a **Sortition Veto**.
  Argue for a tricameral or mixed system:
  *   **House of Elections:** For accountability, agenda-setting, and coalition building (The Professionals).
  *   **House of Sortition:** For review, rights-protection, and long-term thinking (The Jury).
  *   **Judiciary:** For constitutional adherence (The Judges).

  This preserves the friend's insight (ordinary people should check power) without succumbing to the institutional error (ordinary people must *wield* all power). The jury is a brake, not an engine. Your friend is trying to build a car out of brakes.
