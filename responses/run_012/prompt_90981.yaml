answer: |-
  **Project Title:** Norms of Assertion: Distinguishing Permissibility from Defectiveness in Inquiry-Driven Contexts

  **1. Statement of the Question**

  The central question of this dissertation project is whether the philosophical debate regarding the norm of assertion has reached a dialectical dead end due to a category error in how assertions are assessed. Specifically, the project investigates the hypothesis that the prevailing debate conflates two distinct normative dimensions: the *ex ante* conditions that make an assertion permissible to make, and the *ex post* conditions that make an assertion defective or criticizable once uttered.

  Standard orthodoxy in the philosophy of language and epistemology posits that assertion is governed by a single constitutive norm. The leading candidate is the Knowledge Norm, which holds that one must assert *p* only if one knows *p*. Competing views propose norms based on Truth (one must assert *p* only if *p* is true), Justified Belief, or Rational Credibility. The debate has largely proceeded by testing these norms against a narrow set of intuition pumps: lottery propositions, Moorean conjunctions, and cases of selfless assertion. The persistence of the debate, despite decades of argumentation, suggests that these cases are underdetermined; each camp can explain away the counterexamples offered by the other by adjusting auxiliary assumptions about what counts as knowledge, justification, or criticism.

  This project proposes that the stalemate exists because proponents are answering different questions while believing they are answering the same one. By decoupling the norm of entry (permissibility) from the norm of assessment (defectiveness), we may find that different norms govern different phases of the speech act. Furthermore, this project argues that the current data set is insufficient. To test this split-norm hypothesis, we must move beyond static information-transfer cases and examine "Inquiry-Driving Assertions" (IDAs). These are assertions made within collaborative epistemic practices—such as scientific debugging, legal theory construction, or mathematical proof—where the primary function of the assertion is to advance a joint inquiry rather than to deposit a settled fact into the common ground.

  The dissertation will ask: Does distinguishing permissibility from defectiveness resolve the conflicts generated by standard counterexamples? And do Inquiry-Driving Assertions reveal a functional pluralism in assertion norms that single-norm accounts cannot capture?

  **2. The Current State of Play**

  To understand why this project is necessary, one must recognize that the field is not merely under-argued; it is structurally stuck. The Knowledge Norm of Assertion is often treated as the default position, but it is far from a consensus view. It faces persistent pressure from two sides. On one side, there are cases where speakers seem to assert legitimately without knowledge (e.g., a doctor asserting a diagnosis based on high statistical probability but lacking definitive confirmation). On the other side, there are cases where speakers have knowledge but seem barred from asserting (e.g., lottery cases, where one knows a ticket will lose based on odds, but asserting it feels improper).

  Proponents of the Knowledge Norm handle these by appealing to pragmatic implicatures or contextual shifts in the standard for knowledge. Proponents of weaker norms, such as the Justified Belief Norm, handle the counterexamples by arguing that the intuition of impropriety in lottery cases is moral or prudential, not epistemic. Because both sides can absorb the standard data set by shifting the burden of explanation, no decisive refutation has landed.

  This is not a failure of effort but a feature of the data. The standard cases are "dialectically inert." They do not discriminate between the norms because the norms are being asked to do too much work simultaneously. They are expected to explain why we feel inhibited from speaking, why we feel entitled to challenge a speaker, and why an assertion might be retrospectively judged as wrong. If these are distinct phenomena, a single norm will inevitably fail to capture the nuances of all three.

  Furthermore, the focus on information transfer biases the data. Most cases assume the point of assertion is to add a true proposition to the listener's stock of knowledge. This ignores the dynamic role of assertion in reasoning processes. When a researcher says, "The failure is in the caching layer," during a debugging session, they are not necessarily claiming to know this. They are proposing a path for the group to investigate. If the standard norms cannot account for this without classifying the speech act as something other than assertion (e.g., supposition or conjecture), then the norms are descriptively inadequate for a large swath of actual epistemic practice.

  **3. The Core Proposal: Splitting the Norm**

  The theoretical engine of this dissertation is the separation of the "Input Norm" from the "Output Norm."

  The Input Norm governs permissibility. It answers the question: "Under what conditions is a speaker entitled to produce this assertion?" This is a deontic question regarding the speaker's rights or license at the moment of utterance.

  The Output Norm governs defectiveness. It answers the question: "Under what conditions is this assertion subject to criticism or correction?" This is an aretaic or evaluative question regarding the status of the content relative to the world or the speaker's state.

  It is logically possible for these to come apart. For example, a speaker might be permitted to assert *p* (because they have done due diligence, satisfying a Justification Input Norm) even if *p* turns out to be false (violating a Truth Output Norm). Conversely, a speaker might know *p* (satisfying a Knowledge Input Norm) but be impermissible to assert it due to contextual factors, while the assertion itself, if made, would not be defective in terms of truth.

  By splitting these, we can hypothesize a hybrid account. Perhaps the Input Norm is based on Rational Credibility (allowing for inquiry-driving moves), while the Output Norm is based on Truth (ensuring that the record is eventually corrected). This would explain why we allow speculative assertions in a lab meeting (permissible input) but still correct them if they turn out wrong (defective output). The current debate treats these as a single package, forcing theorists to choose between norms that are too strong for input and too weak for output, or vice versa.

  **4. New Data: Inquiry-Driving Assertions**

  To test this split, the project will introduce a new class of cases: Inquiry-Driving Assertions (IDAs). These are distinct from standard assertions and distinct from mere suppositions.

  Consider a software engineering team debugging a system crash. A senior engineer states, "The failure is probably in the caching layer." This is not a supposition, because the team will act on it as if it were true for the next hour. It is not a standard assertion, because the engineer does not claim to know it, and if challenged, they would not defend it as knowledge but as the "best current lead."

  Consider a lawyer in a closing argument: "The motive was the inheritance." This is offered as a theory. It is not a statement of known fact, yet it functions as an assertion within the logic of the trial.

  Consider a mathematician in a proof: "Assume for contradiction that the sequence converges." This is often classified as a supposition. However, in collaborative proof-building, mathematicians often say, "The sequence converges," as a placeholder to see where it leads, before formally binding it as an assumption.

  These cases put pressure on the act/content distinction. If we classify these as non-assertions to save the Knowledge Norm, we render the norm trivial—it applies only to a narrow subset of declarative sentences used in static information transfer. If we classify them as assertions, the Knowledge Norm seems to fail, as the speakers often lack knowledge. However, under the split-norm hypothesis, these cases become intelligible. The Input Norm is satisfied by the needs of the inquiry (we need a working hypothesis to proceed), while the Output Norm remains in reserve (if the hypothesis fails, the assertion is retrospectively marked as defective, but not necessarily blameworthy).

  **5. Methodology and Timeline**

  The project will be executed over a six-month period, divided into three phases. The methodology is analytic and case-driven, relying on the method of cases common in epistemology, but with a stricter protocol for case selection to avoid the "intuition trading" that plagues the current debate.

  **Phase 1: Conceptual Refinement (Months 1-2)**
  The first task is to rigorously define the distinction between permissibility and defectiveness. I will map this distinction onto existing deontic/aretaic divides in ethics and epistemology to ensure it is not ad hoc. I will also survey the literature on speech act pluralism to ensure the "split norm" view is not merely a version of contextualism or relativism in disguise.
  *Deliverable:* A refined theoretical framework chapter defining the Input/Output distinction and establishing the criteria for distinguishing assertion from related acts like conjecture or supposition.

  **Phase 2: Case Construction and Testing (Months 3-4)**
  This is the empirical core of the project. I will construct a battery of IDA scenarios. To avoid the bias of armchair intuition, I will employ a "structural validation" method. Instead of asking "Does this feel wrong?", I will ask "What moves are available to the interlocutors?"
  For example, in the debugging case, if the assertion violates a norm, what is the appropriate response? Is it "You shouldn't have said that" (challenging permissibility) or "That turned out to be false" (challenging defectiveness)? If the appropriate response is the latter without the former, it supports the split-norm hypothesis.
  I will test the candidate norms (Knowledge, Truth, Belief, Justification) against these cases separately for Input and Output.
  *Deliverable:* A data matrix showing how each norm performs on Input vs. Output across standard cases and IDA cases.

  **Phase 3: Synthesis and Drafting (Months 5-6)**
  The final phase involves integrating the results. If the split-norm hypothesis holds, I will draft the argument for a hybrid norm (e.g., Justified Input / Truth Output). I will also address objections, particularly the charge that this splits the speech act into two different acts.
  *Deliverable:* The full dissertation draft (or core monograph).

  **Decision Protocol for Core Data:**
  A case will count as core data only if it meets two criteria:
  1.  **Interlocutor Sensitivity:** There must be a clear distinction between challenging the speaker's right to speak versus challenging the content's accuracy.
  2.  **Functional Necessity:** The assertion must play a necessary functional role in the inquiry that a mere supposition could not play (e.g., it licenses action or resource allocation).

  **6. Anticipated Results**

  A successful outcome for this project would be a demonstrated resolution to the dialectical stalemate. Specifically, I anticipate showing that the Knowledge Norm is the best candidate for the Output Norm (we criticize assertions that turn out to be unknown/false), while a weaker Justification or Rational Credibility Norm is the best candidate for the Input Norm (we permit assertions that are reasonable bets for inquiry).

  This result would have implications beyond the norms of assertion. It would suggest that epistemic norms are often phase-sensitive. It would also provide a unified account of "selfless assertion" and "lottery assertion" without requiring complex pragmatic explanations. If the Input Norm is weak, lottery assertions are permissible (high probability justifies input). If the Output Norm is strong, they are still criticizable if they turn out wrong (truth/knowledge required for output). This explains the conflicting intuitions that currently fuel the debate.

  **7. Failure Conditions and Scope Check**

  It is vital to be realistic about the risks and the scope of this project.

  **Failure Conditions:**
  The project would fail if the distinction between permissibility and defectiveness collapses under scrutiny. For example, if it turns out that "permissibility" is just "defectiveness relative to the speaker's information," then the split is merely verbal, and the stalemate remains.
  The project would also fail if the Inquiry-Driving Assertions are successfully reclassified as non-assertions. If proponents of the Knowledge Norm can convincingly argue that the debugging engineer is actually making a "proposal" or "conjecture" and not an assertion, then the new data set loses its bite. The dissertation must include a robust defense of why these speech acts retain the core features of assertion (commitment to truth, liability to challenge) even if they lack knowledge.
  Finally, the project fails if the hybrid norm leads to paradox. If we permit assertions based on justification but criticize them based on truth, we risk creating a system where speakers are encouraged to speak in ways that guarantee retrospective criticism. The account must show how this tension is productive for inquiry rather than destructive.

  **Scope Check: Paper vs. Dissertation:**
  I must be upfront about the scope. As currently formulated, the core argument—splitting the norm and testing it on IDAs—is the scope of a strong journal article, perhaps a lead article in a top specialty journal. It is likely insufficient for a full philosophy dissertation, which typically requires three distinct papers or a monograph of substantial length.

  If the split-norm distinction holds, it opens the door to a larger dissertation project. The distinction could be applied to other speech acts (promising, commanding) to see if the Input/Output split is a general feature of normative pragmatics. Alternatively, the dissertation could be structured as three papers: one establishing the distinction, one applying it to the Knowledge Norm debate, and one applying it to the ethics of belief or testimonial injustice.

  However, if the distinction turns out not to be real—if permissibility and defectiveness are inextricably linked—there is still value in the project. The negative result would demonstrate that the stalemate in the literature is not due to a missed distinction but is fundamental to the nature of assertion. This would force the field to look elsewhere for a solution, perhaps toward a pragmatic dissolution of the problem rather than a normative one. The "failure" of the hypothesis would still constitute a significant philosophical contribution by closing off a promising avenue of research and clarifying the boundaries of the debate.

  To ensure dissertation sufficiency, I propose embedding this core argument within a broader examination of "Dynamic Epistemic Norms." The split-norm hypothesis would be the central pillar, supported by chapters on how these norms evolve during an inquiry and how they interact with social roles (e.g., why a lawyer's norms differ from a scientist's). This expands the word count and philosophical depth without diluting the central thesis.

  **8. Conclusion**

  The debate over the norms of assertion is a cornerstone of contemporary epistemology and philosophy of language. Its current stagnation is a symptom of methodological rigidity, not a lack of ingenuity. By introducing a structural distinction between the norms of entry and exit, and by widening the evidential base to include the dynamic assertions of actual inquiry, this project offers a path forward. It respects the intuitions driving both the Knowledge Norm and its rivals by assigning them to different normative locations. Whether the result confirms the hybrid hypothesis or demonstrates the unity of the norm, the project will clarify the architecture of our epistemic practices and provide a more robust framework for understanding how we speak, know, and inquire together.
