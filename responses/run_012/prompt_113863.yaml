prompt: |-
  A colleague forwarded me an essay on neural network interpretability that I can no longer place — I think it was a long-form piece by a science writer, though the author doesn't matter for my question. It made roughly the following case, which I'll reproduce as faithfully as I can:

  A neural network has representations just in case you can train a linear probe on its internal activations that recovers some property of the input — whether a sentence is negated, where an object sits in an image, which token is likely next. Interpretability researchers have found such probes succeeding almost everywhere they look, at every layer and for every property anyone has bothered to test, so the network plainly represents all of these properties, and we can in fact read off what it represents at any layer we choose. The one complication is superposition: because features are smeared across many neurons rather than localized in single units, there is no clean correspondence between units and concepts, which shows that these systems have nothing like the structured, compositional representations of classical symbolic AI. The honest verdict, then, is that networks have representations only in a loose, statistical sense — a way of speaking rather than a fact about what is inside them.

  I don't work in this area and can't tell how much of this to take seriously. My instinct is to agree with the essay's deflationary conclusion, but I suspect I'm being carried by its rhetoric rather than by the argument, and I'd rather not walk away with a view I can't defend. Please audit the passage: which claims a researcher who actually works on interpretability would accept as stated, which are defensible simplifications, and which are misrepresentations — and, separately, whether the essay's final verdict follows once the misrepresentations are corrected or whether it was riding on them. For each point, be explicit about whether it is settled in the field or genuinely contested among people who know the topic; do not let a live dispute be presented to me as consensus. Give your answer as exactly five numbered items, each one or two sentences long, with no introduction or conclusion, treating each item as one distinct issue rather than one sentence of the essay.
