answer: |-
  First, a methodological caveat: as an AI, I do not hold metaphysical beliefs or subjective credences. However, I can generate a **simulated credence** based on the dialectical weight of arguments in the contemporary metaethical literature (post-2000, specifically engaging with Dancy, McNaughton, Hooker, Scanlon, and the subsequent "explanatory generalism" turn).

  Below is the decomposition you requested, treating the "Strong Particularist Claim" (SPC) as: *No feature is reliably relevant in the same direction across contexts, and no maximally specified list of contributory considerations captures moral structure.*

  ### Decomposed Credence in Strong Particularism

  **(a) Metaphysics vs. Epistemology/Phenomenology: 0.40**
  *   **Rationale:** Strong particularism often oscillates between a metaphysical claim (moral reality has no structure) and an epistemic claim (we cannot learn/justify judgments via principles). The literature suggests that even if moral *metaphysics* were holistic, moral *epistemology* likely requires generalizations for learning and communication (e.g., moral development in children, cross-cultural moral discourse). If the claim is metaphysical, it's harder to falsify; if epistemic, it faces strong counter-evidence from moral psychology.
  *   **Settled/Live:** It is live whether the thesis is primarily metaphysical or epistemic. Dancy insists it's metaphysical, but critics argue it collapses into epistemology.

  **(b) Holism of Reasons as Datum vs. Artifact: 0.70**
  *   **Rationale:** Holism about reasons (valence can shift) is widely accepted as a datum in the field; few defend atomism. However, accepting holism does not entail SPC. One can accept that *some* features flip valence while maintaining that *core* features (e.g., pain, betrayal) have default or invariant valence. The leap from "holism is true" to "radical holism is true" is the weak link.
  *   **Settled/Live:** **Settled:** Holism is true (valence is context-sensitive). **Live:** Whether holism is *universal* (no default valences) or *partial*.

  **(c) The "Build Context into Principle" Move (Vacuity/Triviality): 0.25**
  *   **Rationale:** This is the crux. Generalists (e.g., McNaughton, Raworth, Lance & Little) argue that principles can encode context (e.g., "defeasible generalizations" or "normative explanations") without being vacuous. If a principle explains *why* a feature counts in a context, it isn't just a post-hoc list. The "explanatory generalism" trend suggests principles capture modal structure, not just extensional regularities. SPC relies on the claim that such principles are merely descriptive summaries; the generalist counter is that they are explanatory.
  *   **Settled/Live:** **Live.** This is the main battleground. The consensus is shifting toward the view that principles need not be algorithmic to be real.

  **(d) Special Sciences Analogy (Ceteris Paribus Laws): 0.40**
  *   **Rationale:** The analogy cuts against SPC. In biology or economics, we accept laws that hold *ceteris paribus* despite exceptions and context-sensitivity. If morality is analogous to a special science (or a normative domain with similar structure), then "principles with hedges" are legitimate laws, not concessions to particularism. However, disanalogies exist regarding the normativity of moral laws vs. descriptive scientific laws.
  *   **Settled/Live:** **Live.** The philosophy of science consensus on CP-laws is itself contested, making this analogy unstable.

  **(e) Verbal Dispute (Definition of 'Principle'): 0.60**
  *   **Rationale:** A significant portion of the disagreement stems from differing definitions. Particularists often define "principle" as a codifiable, exceptionless, action-guiding algorithm (which clearly fails). Generalists define "principle" as a true general normative claim that plays an explanatory role (which clearly succeeds). If "principle" means the former, SPC is true; if the latter, SPC is false.
  *   **Settled/Live:** **Live,** but increasingly recognized as a source of confusion. Recent literature attempts to stipulate definitions more carefully.

  ---

  ### Bottom Line Credence: 0.30

  **How they combine:**
  I weight **(c)** and **(e)** most heavily. If the "build context" move succeeds (low credence in vacuity), SPC loses its metaphysical bite. If the dispute is largely verbal (high credence in verbal confusion), the substantive claim of SPC dissolves. (b) is high because holism is true, but I discount its contribution to SPC because holism $\neq$ strong particularism. (a) and (d) act as moderate downward pressures.

  **Sensitivity Analysis:**
  The bottom line is **most sensitive to (c)**.
  *   If you can be convinced that encoding context into principles renders them explanatorily vacuous (i.e., they are just lists of cases disguised as rules), my credence in SPC jumps to **0.65**.
  *   If you accept that principles can be *explanatory* without being *exceptionless algorithms*, my credence drops to **0.15**.
  *   Your suspicion that you and your friend disagree on (c) is correct. This is the standard fault line in the post-Dancy literature.

  **Evidence/Argument to Move the Credence:**
  *   **To increase SPC credence:** Demonstrate a case where a feature's relevance is not just *defeated* but *reversed* without any higher-order principle explaining the reversal (i.e., brute contextual variance). Or, show that any principle complex enough to handle holism cannot play a role in moral reasoning (epistemic access argument).
  *   **To decrease SPC credence:** Provide a model of "defeasible generalization" (like Lance & Little's *defeasible structure*) that captures the holist data without collapsing into a list of cases. Show that moral learning *requires* generalization even if the ground is holistic.

  ---

  ### Consensus and Framing Check

  You asked for explicitness on what is settled and whether your framing is contested.

  **1. Is your framing of "Strong Particularism" contested?**
  **Yes.** Your definition ("no feature of a situation is reliably relevant in the same direction across contexts") is the **radical** reading of Dancy.
  *   **Contested Point:** Many scholars argue that even Dancy allows for *default reasons* (features that are reasons unless defeated, rather than features that flip valence randomly). If default reasons exist, morality *does* have a shape, just a non-combinatorial one.
  *   **Implication:** If your friend is arguing against the "no shape at all" claim, she is attacking a view fewer people hold now than in 2004. Many self-identified particularists are actually "moderate particularists" who accept default valences. Ensure you aren't fighting a strawman of her position or her a strawman of Dancy.

  **2. What is settled among experts?**
  *   **Atomism is dead.** Almost no one argues that moral features have invariant valence regardless of context (the "boring version" you dismissed).
  *   **Holism is in.** The claim that context affects valence is a datum any theory must accommodate.
  *   **Codifiability is out.** The idea that morality can be captured by a finite set of exceptionless rules usable by an agent as an algorithm is generally rejected by both sides.

  **3. What is live?**
  *   **Explanatory Role:** Can principles explain *why* a feature counts, even if they can't predict *that* it counts in every case? (Generalists say yes; Particularists say no).
  *   **Default Valence:** Do features have a "polarity" in the absence of defeaters? (Generalists say yes; Radical Particularists say no).
  *   **Metaphysical vs. Epistemic:** Is the lack of principles a feature of the world or our access to it?

  ### Recommendation for the Reading Group
  The analogy to philosophy of science (your point d) is actually your strongest lever, but you need to refine it. Don't argue about whether special sciences have *laws* (that's a quagmire). Argue about whether they have **explanatory generalizations**.
  *   If biology can have generalizations that are true *ceteris paribus* and explain phenomena without being exceptionless, morality can too.
  *   If your friend insists principles must be exceptionless to be real, she is holding morality to a standard physics abandoned 100 years ago.
  *   If you insist principles must be algorithmic to be useful, you are holding morality to a standard of computability that human cognition doesn't meet.

  The middle ground (Explanatory Generalism) suggests SPC is false, but "Boring Generalism" (exceptionless rules) is also false. Your credence of 0.55 suggests you think the "no shape" claim is live; the literature suggests it is increasingly marginalized in favor of default-reason holism. Her 0.2 is closer to the current center of gravity, provided she isn't defending exceptionless algorithms.
