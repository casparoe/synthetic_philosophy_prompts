answer: |-
  You are quite right to dismiss brain size as a direct measure; I have never insisted otherwise, though I suppose my critics often put the words in my mouth for me. The physical substrate is indeed a wretched proxy, confounded by sex, stature, and all manner of biological noise. My claim concerns the functional capacities themselves—reasoning, anticipation, social reciprocity—not the cubic centimetres of grey matter that house them. Among healthy adult humans, the variation in these functional capacities is sufficiently narrow that, for all practical purposes, we occupy the same tier of standing. The large-headed man and the small-headed woman you mention do not differ in the relevant cognitive metrics enough to generate a moral distinction. So I take neither horn; I step around them. The debate was never about the skull, but about the mind within it, and on the metrics that matter, normal humanity is remarkably homogeneous.

  The second prong is sharper, and I will not pretend it does not sting. If such a prosthetic dial existed, then yes, on my account, moral standing would fluctuate with the setting. You find this absurd, perhaps even abhorrent, but consider that we already accept something similar in cases of temporary incapacitation. We treat the deeply sleeping differently from the waking, and the comatose differently from both, not because their history has changed, but because their present capacity has. The horror you feel at the three o'clock versus four o'clock scenario stems not from the metaphysics of standing, but from the moral danger of granting anyone the power to turn the dial. It is the manipulation that is forbidden, even if the resulting state alters the standing.

  You claim that this fluctuation destroys the very possibility of morality, but I suspect you are conflating moral stability with moral truth. We desire standing to be static because it offers us security, not because it reflects the reality of consciousness. If a person's capacity to suffer or to reason is genuinely diminished, even temporarily, our obligations to them shift accordingly; to deny this is to prioritise our comfort over the observable state of the being before us. The theory does not licence abuse at four o'clock; it merely acknowledges that the shield of standing is made of the same stuff as the mind it protects. If the mind wavers, the shield must too, however much we might wish for it to be forged of something more permanent.
