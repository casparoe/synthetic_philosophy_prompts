      *   **Speaker:** A translator mid-attempt.
      *   **Source Material:** A made-up source poem with specific constraints (fixed line count, rhyme scheme, syllable count, acrostic on a name).
      *   **Form Requirement:** The poem itself must demonstrate the struggle. Start strict, then crack at a marked turn where sense wins but form breaks (lost scan, forced rhyme, etc.).
