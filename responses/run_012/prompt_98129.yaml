prompt: |-
  I build stateful distributed systems for a living: replication, live migration, schema evolution, and the difference between object identity and value equality. I know the philosophical literature on personal identity only as a well-read layperson — the ship, the teletransporter, psychological continuity, animalism — but I know my own vocabulary cold: primary keys versus value equality, serialization and deserialization, backup and restore, replication and failover, rolling upgrades and canary deploys, hot-swapping a node while the service stays up, split-brain and consensus.

  Take the debate over mind uploading and gradual replacement — the claim that a person survives when her memories and dispositions are carried over, whether by scanning and reconstruction or by replacing neurons one at a time until no original tissue remains — and restate it as faithfully as you can in my vocabulary. I want the translation to run in both directions: not merely what a scan looks like in my terms, but what each party to the debate is actually asserting, said in terms of record identity, continuity of service, migration without downtime, and what it would take for two replicas to count as the same object rather than as two objects with equal contents.

  Then give me the residue report. Which claims translate cleanly? Which translate only under distortion, where I must pretend a metaphor is doing work it cannot? And which have no counterpart in my vocabulary at all — the first-person fact of being the one who wakes up, the question of whether the successor inherits obligations, the distinction between information and the medium carrying it, or the suspicion that being the same person is a decision we make rather than a fact we discover? For each residue, say whether the fault lies with my framework, which may be systematically unable to express something about identity, or with the philosophical claim, which may be trading on a distinction my vocabulary exposes as empty. Be explicit about where the translation flatters me by making a hard problem look like routine engineering, and where it flatters the philosophers by dressing a conventional choice up as a discovery.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Senior Distributed Systems Engineer. Deeply technical, pragmatic, familiar with state management, consistency models, identity vs. value, availability, and fault tolerance.
      *   **Knowledge Base:** Knows distributed systems vocabulary "cold" (PKs, serialization, replication, failover, split-brain, consensus). Knows philosophical literature on personal identity only as a "well-read layperson" (Ship of Theseus, Teletransporter, Psychological Continuity, Animalism).
      *   **Task:** Translate the debate over mind uploading/gradual replacement into distributed systems vocabulary.
      *   **Requirements:**
          1.  Faithful restatement of the debate using systems terms (record identity, continuity of service, migration, replicas, etc.).
          2.  Bidirectional translation (what a scan looks like in sys terms, what the philosophers are asserting in sys terms).
          3.  Residue Report: Identify what translates cleanly, what distorts, and what has no counterpart.
          4.  Critical Analysis: Determine if the "fault" lies with the engineering framework (unable to express something) or the philosophical claim (trading on empty distinctions).
          5.  Tone: Professional, precise, respectful of both domains, avoiding fluff. No "flattering" the engineer by making hard problems look easy, no "flattering" philosophers by dressing choices as discoveries.

  2.  **Deconstruct the Philosophical Debate:**
      *   *Psychological Continuity (Lockean/Parfitian):* Survival depends on memory/personality continuity. Uploading is survival.
      *   *Animalism/Biological Continuity:* Survival depends on the biological organism. Uploading is death + copy.
      *   *Gradual Replacement (Ship of Theseus):* If neurons are replaced one by one, is it the same person?
      *   *The "Hard Problem" of Consciousness/Subjectivity:* The "what it is like" to be the successor.
      *   *Normative Implications:* Responsibility, ownership, love.

  3.  **Map to Distributed Systems Vocabulary:**
      *   *Person:* A stateful service/object.
      *   *Body/Brain:* The hardware/infrastructure running the service.
      *   *Memories/Dispositions:* The mutable state (database records, heap memory).
      *   *Identity:* Primary Key (UUID), not value equality.
      *   *Mind Uploading (Scan & Boot):* Backup/Restore to new hardware.
      *   *Gradual Replacement:* Rolling update / Hot-swapping components.
      *   *Forking/Cloning:* Replication (Active-Active or Active-Passive).
      *   *Continuity of Consciousness:* Uptime / Zero-downtime migration.
      *   *Subjective Experience:* The specific execution thread / local state of the running process.

  4.  **Drafting the Translation (The "Spec"):**
      *   *Scenario A: Teletransporter (Scan & Destroy).* This is a `pg_dump` | `pg_restore` to a new cluster, followed by `DROP DATABASE` on the old cluster.
          *   *Psychological Continuity View:* The Primary Key (Identity) is logical, not physical. If the state restores and the service API responds identically, the Object Identity persists.
          *   *Animalism View:* The Primary Key is bound to the specific hardware instance ID. New hardware = New Object ID.
      *   *Scenario B: Gradual Replacement.* This is a Rolling Update or Canary Deployment.
          *   *Claim:* As long as the service never goes down (continuity of consciousness) and the state schema evolves compatibly, the Object Identity persists despite 100% component churn.
      *   *Scenario C: Branching (Teletransporter doesn't destroy).* This is a Split-Brain scenario. Two nodes claim the same Primary Key. Consensus protocol (Paxos/Raft) must resolve which is the "Leader."
          *   *Philosophical problem:* Which one is *me*?
          *   *Sys problem:* Which one accepts writes? (Usually, you can't have two leaders).

  5.  **Developing the Residue Report (The "Post-Mortem"):**
      *   *Clean Translations:*
          *   Gradual replacement $\rightarrow$ Rolling updates.
          *   Psychological continuity $\rightarrow$ State restoration + API compatibility.
          *   Branching problem $\rightarrow$ Split-brain/Consensus.
      *   *Distorted Translations:*
          *   "Consciousness" $\rightarrow$ "Uptime". Uptime is observable externally; consciousness is internal.
          *   "Identity" $\rightarrow$ "Primary Key". PKs are assigned by authority; Personal Identity feels discovered.
      *   *Missing Counterparts (The Residue):*
          *   *Qualia/Subjectivity:* The "client" inside the system. In sys, we observe from outside. In philosophy, we *are* the process.
          *   *Normativity:* Who gets the bill? In sys, access control lists (ACLs) are arbitrary config. In philosophy, moral desert feels intrinsic.
          *   *The "Empty" Distinction:* Does "Identity" exist independently of the tracking system? In sys, ID is defined by the schema. In philosophy, people argue ID exists *before* the definition.

  6.  **Refining the Tone:**
      *   Avoid saying "Philosophers are wrong." Instead, "Philosophers are optimizing for a different consistency model."
      *   Avoid saying "Engineers solve this." Instead, "Engineers punt on this by defining it away."
      *   Ensure the distinction between *Value Equality* (same data) and *Object Identity* (same reference) is central.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "first-person fact"?
