answer: |-
  ### Tier Table

  | Mechanism | Tier | Justification |
  | :--- | :--- | :--- |
  | (5) Exploiting Presupposition | 1 | Sneaks contested facts into conversation as assumed truth, collapsing denial without direct assertion or evidence. |
  | (10) Plausible Deniability | 1 | Allows dangerous meanings to be voiced while retaining the safety net of literal innocence, crucial for high stakes. |
  | (7) Particularized Implicature | 2 | Context-dependent meaning creates unique bonds or threats specific to the characters' history, driving unique scene outcomes. |
  | (3) Flouting Relation | 2 | Changing subjects signals refusal to engage, shifting power dynamics instantly without explicit confrontation or admission. |
  | (2) Flouting Quality | 3 | Irony creates emotional distance, allowing characters to wound deeply while maintaining surface politeness and social cover. |
  | (1) Flouting Quantity | 3 | Withholding info forces the listener to fill gaps, creating tension through silence and inviting dangerous inference. |
  | (4) Flouting Manner | 4 | Obscurity risks confusing readers but can effectively mimic character confusion, secrecy, or coded communication styles. |
  | (9) Intention-Recognition | 4 | Theoretical foundation of all subtext, but too abstract to function as a distinct tactical tool for writers. |
  | (6) Conventional Implicature | 5 | Grammatical markers convey attitude but lack the dramatic weight to drive scene conflict or causal chains alone. |
  | (8) Generalized Implicature | 5 | Routine inferences lack the specificity required for high-stakes dramatic revelation, reversal, or personalized conflict. |

  ### Rationale by Tier

  The top tier mechanisms are narratively load-bearing because they embed the conflict into the structural logic of the utterance itself. When a character exploits a presupposition, they treat a controversial fact as settled truth; to deny it requires breaking the conversation's flow, which is a high-cost move that forces a reaction. Similarly, plausible deniability allows a character to threaten murder while technically asking about dinner. If the threat is cancelled, the danger vanishes, but the literal meaning remains harmless. These mechanisms are load-bearing because the scene exists in the gap between the said and the meant; removing the subtext collapses the causal chain of the interaction. They generate genuine speaker meaning, where the hearer must recognize the intention to proceed, rather than mere suggestion, which is atmospheric but optional.

  The middle tiers function as tactical maneuvers within the stakes established by the top tier. Flouting Relation and Particularized Implicature drive the specific flow of the scene. Changing the subject is a shield; shared context is a key. These are strong but depend on the top tier's stakes to matter. Flouting Quality and Quantity adjust the temperature of the exchange—irony wounds, silence tensions—but they are often stylistic choices rather than structural pivots. They color the interaction but rarely overturn the plot single-handedly.

  The bottom tier lacks specific dramatic force. Generalized implicature is routine (e.g., "some" implies "not all"); it doesn't surprise. Conventional implicature is grammatical texture. Intention-recognition is the cognitive process, not the tool. For a novelist, speaker meaning drives action; suggestion drives mood. The top tiers force action (denial, acceptance, counter-threat). The bottom tiers only color the mood. To maintain intelligibility for untrained readers, the context must make the inference obvious. If the reader misses the presupposition, the scene fails. Therefore, the top tiers require careful setup but yield high reward. The bottom tiers are safer but narratively weak, serving as background noise rather than the engine of conflict.

  ### The Cancellation Test

  For the top four mechanisms, explicit cancellation reveals their narrative fragility and necessity. If a character exploits a presupposition ("When did you stop stealing?") and then cancels it ("I didn't say you stole"), the scene collapses because the accusation was the point; the aggression evaporates, leaving confusion. If plausible deniability ("Nice knife you have") is cancelled ("I'm not threatening you"), the tension evaporates entirely; the character looks weak rather than dangerous, and the stakes dissolve.

  If particularized implicature ("It's cold in here," meaning *close the window*) is cancelled ("I'm not asking you to close it"), the request is nullified. The conflict resolves awkwardly because the indirect command was the only way to save face; cancelling it admits the power struggle explicitly. Finally, if flouting relation ("Who was there?" "Nice weather") is cancelled ("I'm not ignoring you"), the evasion is admitted. Power shifts to the questioner because the responder has lost the high ground of silence.

  This test reveals that these mechanisms rely on the *absence* of cancellation. They function only so long as the subtext remains deniable or assumed. Once the implicature is dragged into the light and denied, the mechanism breaks. This fragility is precisely what makes them load-bearing; the scene hangs on the thread of the unsaid. If the thread is cut, the narrative weight falls.

  ### Bottom Line

  Build your novel around **Exploiting Presupposition**, **Plausible Deniability**, and **Particularized Implicature**. These three create specific, high-stakes gaps between what is said and what is meant, forcing characters to act on inference rather than information. They generate the conflict, reversal, and revelation you require without narrator explanation. Use **Generalized Conversational Implicature** sparingly or not at all. It is too routine to drive plot; it belongs in dialogue filler, not decisive exchanges. Rely on the mechanisms that break rules, not those that follow them.
