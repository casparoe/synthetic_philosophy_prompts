answer: |-
  # Decision Tree: Causation by Omission

  **Start:** Accept or Reject: *"An omission can be a cause of the outcome that followed it."*

  **REJECT** → **Omission Skepticism**
  *   **Claim:** Omissions are never causes; only positive events cause outcomes.
  *   **Hardest Commitment:** Explaining why tort law liability attaches to non-feasance.

  **ACCEPT** → **Q1:** Are omissions among the things that stand in causal relations at all, or is the word omission merely a way of describing an agent in the light of what they did not do?
  *(Ontologically real entities vs. descriptive labels)*

  *   **DESCRITIVE** → **Q3:** When we single out one omission from the indefinitely many conditions of a harm, does that selection answer to a further causal fact, or does it answer to the norms, duties, and expectations we bring to the case?
      *   **Causal Fact** → **Unoccupied (Incoherent).** If omissions are merely descriptive, there are no causal facts for selection to answer to.
      *   **Norms** *(Standards of duty)* → **Q4:** Does the difference between doing and allowing mark a difference in what happens in the world, or only in what we may demand of an agent?
          *   **World** → **Unoccupied (Incoherent).** Descriptive ontology denies metaphysical differences in the world.
          *   **Demand** → **Normative Pragmatism**
              *   **Claim:** Omissions are causes only relative to specific normative duties.
              *   **Hardest Commitment:** Denying causal facts exist independently of duty.

  *   **REAL** → **Q2:** Is counterfactual dependence enough for causation by omission, or is it only a symptom of it, so that the cause properly speaking is always some positive event or standing condition?
      *(If A hadn't happened, B wouldn't have)*
      *   **Symptom** → **Positive Substitution**
          *   **Claim:** Only positive events cause; omissions are placeholders for missing positive causes.
          *   **Hardest Commitment:** Explaining moral distinction without causal distinction.
          *   *(Note: Collapses near Skepticism; defect of Q2 phrasing rather than view distinctness.)*
      *   **Enough** → **Q5:** Must a single account cover both failing to prevent a harm and failing to continue a course of action that had been keeping the harm away?
          *   **Distinct** → **Dual Ontology**
              *   **Claim:** Preventing harm differs metaphysically from stopping aid.
              *   **Hardest Commitment:** Identifying the metaphysical boundary line.
          *   **Single** → **Q4:** (See above).
              *   **World** → **Robust Realism**
                  *   **Claim:** Omissions are real entities causing outcomes uniformly.
                  *   **Hardest Commitment:** Accepting infinite causes for every event.
              *   **Demand** → **Moderate Realism**
                  *   **Claim:** Omissions are real causes, but doing/allowing is normative.
                  *   **Hardest Commitment:** Separating causal reality from normative classification.

  ***

  **Case Testing**
  *   **Landlord (Boiler), Doctor (Test), Engineer (Ship), Moderation (Post), Government (Flood):** Land in **Normative Pragmatism**. Liability turns on duty to repair/test/filter/fund, not mere counterfactuals.
  *   **Passer-by (Rope):** Lands in **Normative Pragmatism** (No duty = No cause) or **Skepticism**. Distinguishes based on legal duty existence.
  *   **Ventilator (Switch off), Medicine (Stop Paying):** Land in **Dual Ontology**. Intuitively distinct from failing to start treatment; requires Q5 distinction to capture moral hesitation.

  **Convergence Note:** **Positive Substitution** and **Omission Skepticism** yield similar legal outcomes but differ on the root claim. This is a genuine collapse of practical utility, not a defect of the questions. **Normative Pragmatism** and **Moderate Realism** are distinct only on Q1 (Ontology), which rarely changes legal verdicts but matters for metaphysics.
