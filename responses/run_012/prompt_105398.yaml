      *   *Street View:* Context = Public Thoroughfare. Incidental. No targeted storage.
      *   *Friend:* Context = Confidence. Explicit covenant.
      *   *DNA:* Context = Self-Ownership. I control my biology. (This remains the trickiest, but fits "Source Ownership").

  7.  **Addressing the "Ex-Wife in a Novel" Case:**
      *   This is the crux for a novelist.
