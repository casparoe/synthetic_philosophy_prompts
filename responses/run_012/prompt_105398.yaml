      *   *Wait, I need to address the "Power" theory failure.* The user thinks Power explains the split. It doesn't.
      *   *My proposed principle:* **Privacy is violated when information is removed from the ecosystem of trust in which it was generated, without a compelling overriding duty.**
      *   *Let's refine:* **The Principle of Contextual Fidelity.** Information belongs to the relationship or context where it originated. Moving it requires consent or a higher moral imperative.

