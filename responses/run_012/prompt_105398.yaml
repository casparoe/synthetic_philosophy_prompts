answer: |-
  You are grappling with what philosophers of information call **Contextual Integrity**.

  Your "Power" theory is strong, but as you noticed, it fractures under pressure. Power is often the *result* of a privacy violation, but rarely the *definition* of it. You don't snoop your husband's phone to get power; you do it because you feel insecure. You don't publish the senator's health to get power; you do it to inform the public.

  The single principle that unifies your verdicts is this: **Privacy is the right to keep information within the context in which it was generated.**

  Information has a "home." When you speak to a friend, that information lives in the context of *friendship*. When you walk down the street, your image lives in the context of *public space*. When you are a senator, your health lives in the context of *public trust*. A violation occurs when you move information from its native context to a new one without consent, unless a higher moral duty overrides it.

  Here is how **Contextual Integrity** solves your specific friction points:

  ### 1. The Phone Split (Teen vs. Husband)
  *   **Teen:** The context is *Guardianship*. A minor does not have full sovereignty over their information. You have a higher duty of care that overrides the context of her personal privacy.
  *   **Husband:** The context is *Partnership*. In a marriage of equals, information is shared voluntarily. Snooping moves information from the "voluntary sharing" context to the "surveillance" context. That is a betrayal of the relationship's norms.

  ### 2. The Public Figures (Senator vs. Dead Novelist)
  *   **Senator:** The context is *Public Office*. By running for office, the senator implicitly moves certain private data (health, finances) into the public context. The voting record creates a duty to explain the discrepancy.
  *   **Dead Novelist:** The context is *Artistic Legacy*. The novelist offered their work to the public, not their private life. Revealing the secret family moves information from the "private domestic" context to the "public biography" context. Why is it not fine? Because it harms the surviving family (who still exist in the domestic context) and violates the implicit contract that art stands apart from the artist.

  ### 3. The Surveillance Split (Doorbell vs. Street View)
  *   **Doorbell:** This creates a *persistent, searchable database* of a specific private threshold. It moves your comings and goings from the "ephemeral public glance" context to the "permanent private surveillance" context. It chills behavior.
  *   **Street View:** This is *ephemeral mapping*. It captures a moment for the context of navigation, not monitoring. It is incidental, not targeted.

  ### 4. The DNA Case (The Outlier)
  You marked this as "Fine," and Contextual Integrity explains why, even though it hurt your cousin.
  *   **The Principle:** You have sovereignty over the *source* of the data (your body). You are moving *your* information from "private" to "genealogy database."
  *   **The Collateral Damage:** Your cousin's pain is real, but you did not violate *his* context directly; you revealed a truth about *your* biology that happened to implicate him. It is "Fine" ethically on your part because you exercised agency over your own data, even if the ripple effects were destructive. (Note: Many ethicists would argue this *is* a violation of his privacy, but your intuition aligns with self-ownership).

  ### The Unsettled Case: The Ex-Wife in the Novel
  This is the hardest case for a writer because art demands truth, but life demands discretion.

  **The Verdict:** Under the principle of Contextual Integrity, this is **Not Fine**, unless you take specific protective measures.

  **The Reasoning:**
  Information gained during a marriage belongs to the context of *Intimacy*. It was given (or observed) under the assumption of a private covenant. By putting it in a novel, you are moving that information to the context of *Public Commerce*.

  Even with the "serial numbers filed off," if she (or people who know her) can recognize the emotional truth or the specific biographical contours, you have broken the container. You are monetizing intimacy that was not offered for sale.

  **However, you are a novelist.** You cannot be paralyzed by this. Here is how you navigate it without violating the principle:

  1.  **The Transformation Test:** Are you documenting her, or are you using the *emotion* of the experience to create a new character? If the character is a vessel for your feelings but does not carry her specific history, identity, or vulnerabilities, you are safe. If you are writing *her* story but changing her name, you are violating the context.
  2.  **The Vulnerability Test:** Are you exposing something that makes her vulnerable (shame, trauma, secrets) that she cannot defend against? If yes, it is a violation. If you are portraying a shared struggle where you are equally implicated, it is more defensible.
  3.  **The Time/Distance Test:** Has enough time passed that the context has naturally decayed? (This is weak, but relevant).
  4.  **The "Kindness" Clause:** Many writers (Philip Roth, Karl Ove Knausgaard) have wrestled with this. The consensus among the ethical ones is: **You own your pain, you do not own hers.** You can write about how *you* felt, but you cannot write her interiority or her secrets.

  ### Summary
  Your gut is working correctly. You aren't looking for a rule about **Power**; you are looking for a rule about **Trust and Context**.

  *   **Fine:** When a higher duty overrides context (Parent, Senator) or when you own the source (DNA, Public Street).
  *   **Not Fine:** When you move information from a private context to a public one without consent (Husband, Brother, Friend, Ex-Wife).

  **Advice on the Novel:**
  Write the book. But write *your* character, not *her*. If you find yourself thinking, "She would hate this passage," or "This explains why she really left me," stop. That is you trying to smuggle private context into a public sphere. Use the fire, but don't burn down the house she still lives in.
