      *   **Diagnosis:** It's a *substantive* disagreement disguised as a *verbal* one, rooted in different modeling frameworks (Social Choice vs. Game Theory/Mechanism Design).
      *   **Addressing the Hunch:** Confirm the "Menu vs. Ranking" distinction is real and crucial. Cite the "Game Form" literature (Gaertner, Pattanaik, Suzumura).
      *   **The "Artifact" Claim:** The Friend is echoing the "Game Form" critique. Sen treats rights as *outcome constraints*. Critics say rights are *process constraints*.
