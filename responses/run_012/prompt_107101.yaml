  A friend and I have been arguing about Sen's liberal paradox for months now and neither of us has budged. I think it's a real conflict — you can't have even minimal liberalism together with the Pareto principle, so something has to give. He thinks it's an artifact of the formalism: if the only way to make someone "decisive" over a pair of options is to have their preference win no matter what anyone else thinks, then you've basically hardcoded the contradiction, and a saner account of what a right is makes it vanish. We keep re-running the same examples and getting nowhere. So what kind of disagreement is this actually — substantive, verbal, or two people answering different questions under one heading? My hunch is that it comes down to whether a right is something that fixes which options are even on the menu versus a constraint on how you rank them, but I can't tell if that's a real distinction or just a nice-sounding way to describe the stalemate. Given your diagnosis, is there anything that would actually count as progress here, or is this thing just stuck for good?
