answer: |-
  Here is the case worked through in the order you requested, examining the tension between your claim (determinate verdict) and your friend's claim (indeterminate laundering).

  ### 1. Specify the Maxim

  To test an action in Kant's framework, we must first formulate the **maxim**: the subjective principle of volition. The indeterminacy your friend suspects usually enters here. If we can describe the maxim however we like, we can engineer any verdict.

  **Ellsberg's Maxim:**
  *   **Occasion-Specific:** "I will copy and release classified documents to the press when I have exhausted legal channels and believe the government is systematically deceiving the public about a war."
  *   **Practice-Level:** "I will violate confidentiality agreements and statutory secrecy whenever my private judgment determines that the public interest outweighs the obligation of official secrecy."

  **The Government's Maxim:**
  *   **Occasion-Specific:** "We will withhold and classify information regarding war prospects to prevent political backlash that would hinder military operations."
  *   **Practice-Level:** "The state will systematically manage the flow of information to citizens to ensure continued support for policies they might otherwise reject if fully informed."

  **Faithfulness and Principled Description:**
  The **occasion-specific** maxim is more faithful to Ellsberg's actual reasoning. He did not view himself as a general anarchist regarding secrets; he emphasized the exhaustion of legal channels (senators) and the specific context of systemic deception.

  **Principled vs. Gerrymandered:**
  Your friend's objection relies on the idea that adding conditions ("when I believe...", "after exhausting channels...") is gerrymandering—adding *ad hoc* clauses to force a pass. However, a **principled** maxim must capture the agent's actual reasoning without omitting relevant moral features. If Ellsberg's motive was not "I want to leak" but "I must correct a specific democratic deficit," omitting the "exhausted channels" clause misrepresents the will. A maxim is gerrymandered if it includes conditions solely to avoid contradiction (e.g., "I will lie, unless it's Tuesday"); it is principled if the conditions reflect the moral grounds of the action (e.g., "I will break a promise to prevent a greater violation of duty").

  ### 2. Formula of Universal Law (FUL) and Formula of the Law of Nature (FLN)

  **Ellsberg's Maxim:**
  *   **FUL (Contradiction in Conception):** If *everyone* violated confidentiality agreements whenever they privately judged the public interest required it, the institution of classified information would collapse. Secrets would become impossible. Is this a contradiction? If the concept of "classified analyst" entails "keeps secrets," then universalizing the breach destroys the role itself. This suggests a **failure**.
  *   **FUL (Contradiction in the Will):** Could a rational agent will a world where no government can keep secrets? Perhaps not, as some secrecy is required for genuine security. However, could they will a world where *deceptive* governments cannot keep secrets? A rational willer, valuing their own autonomy, might will that deception be impossible.
  *   **Level Shift:** The **practice-level** maxim ("whenever my private judgment determines") likely fails the Conception test (anarchy of secrets). The **occasion-specific** maxim ("exhausted legal channels," "systemic deception") might pass the Will test. A rational agent might will a "safety valve" for extreme corruption, even if they cannot will general leakage.
  *   **Verdict:** The verdict *does* change with the level of description. This validates your friend's worry (description drives the result) but supports your hope (a faithful description yields a pass).

  **The Government's Maxim:**
  *   **FUL (Contradiction in Conception):** If all states systematically deceived citizens to ensure policy continuity, trust would evaporate. Eventually, citizens would assume deception, rendering the deception ineffective. This mirrors the "false promise" contradiction.
  *   **FUL (Contradiction in the Will):** A rational citizen cannot will a system where they are manipulated regarding life-and-death decisions (war). This undermines their capacity for rational choice.
  *   **Verdict:** This test is more robust. Whether occasion-specific or practice-level, a maxim of systematic deception fails. It is harder to gerrymander a "principled deception" maxim that passes FUL.

  ### 3. Formula of Humanity (FH)

  **Ellsberg's Act:**
  *   **Means to Ends:** Ellsberg used his colleagues and the RAND Corporation as a means. He utilized their trust and access to achieve his end (public revelation) without their consent. Their work was instrumentalized.
  *   **Ends in Themselves:** He treated the **public** as ends. By providing them with the truth, he restored their capacity for rational political judgment, which the government had undermined.
  *   **Assessment:** This is a **mixed case**. He violated the humanity of his colleagues (breach of fiduciary trust) to respect the humanity of the public (autonomy). Kantian ethics struggles with conflicting duties to different persons.

  **The State's Act:**
  *   **Means to Ends:** The state treated the **public** and **Congress** merely as means. By withholding the true prospects of the war, they manipulated citizens' consent to secure manpower and funding. They bypassed the rational will of the populace to achieve state objectives.
  *   **Assessment:** This is a **cleaner case** of violation. The deception is designed specifically to circumvent the rational agency of the subjects.

  **Comparison:**
  The State's maxim fails FH clearly and without remainder. Ellsberg's maxim involves a tragic conflict: violating the specific trust of colleagues to honor the general trust of the citizenry. FH favors Ellsberg only if we prioritize the public's right to truth over the colleagues' right to confidentiality, but the "means" objection against Ellsberg is not silent.

  ### 4. Transcendental Formula of Public Right

  In *Perpetual Peace*, Kant offers the test: "All actions relating to the right of others are unjust if their maxim is not compatible with publicity."

  *   **Ellsberg:** His maxim *requires* publicity to succeed. He cannot achieve his end (informing the public) without making his action public. Therefore, his maxim is compatible with publicity. In fact, it seeks it.
  *   **The State:** Their maxim *requires* secrecy to succeed. If the maxim ("We will lie about war prospects to keep support") were publicized, support would vanish, and the policy would fail. Therefore, it is incompatible with publicity and thus unjust.

  **Publicity vs. Universalizability:**
  Do they come apart? In this case, they align perfectly. Publicity acts as a **heuristic** for Universalizability in the political sphere. If a maxim cannot bear the light of day, it usually implies that universalizing it would undermine the conditions of its own success (a pragmatic contradiction that mirrors the logical contradiction in FUL).
  However, Publicity is narrower: it applies to *right* (legal/political justice), whereas FUL applies to *morality* broadly. Publicity confirms your view that the government fails decisively. It suggests Ellsberg passes, but strictly speaking, Publicity tests the *justice* of the action, not necessarily its moral worthiness regarding the breach of contract.

  ### 5. The Reverse Direction: Silence, Defects, and Constant

  **Where is Universalizability Silent?**
  Kant's system is silent on **hierarchy of duties**. It tells you not to lie and not to break promises (perfect duties). It tells you to help others (imperfect duty). It does not provide an algorithm for when a perfect duty (secrecy oath) conflicts with the duty to prevent injustice (Humanity). This silence confirms your friend's suspicion: without an external metric to weigh the maxims, the agent must choose which duty to prioritize, and the test simply validates that choice.

  **The Constant Objection:**
  In his dispute with Benjamin Constant, Kant argues one must not lie to a murderer at the door, because truthfulness is a formal duty that cannot be compromised by consequences.
  *   **Application to Ellsberg:** Ellsberg did not lie; he told the truth. However, he broke a solemn oath of confidentiality. For Kant, an oath is a promise. Breaking a promise because the *consequences* of keeping it are bad (prolonged war) looks suspiciously like the consequentialism Kant rejected in the Constant case.
  *   **Rigorism:** If Kant condemns lying to a murderer to save a life, does he condemn breaking an oath to save thousands from a wrongful war? A strict reading suggests **yes**. This reveals a tension: The *Groundwork* procedure (FUL) might condemn the breach of contract, while the *Humanity* formula (respecting the public's reason) supports it.
  *   **Decision Procedure:** This suggests the Universal-Law test was never meant to function as a standalone decision procedure for complex institutional dilemmas. It requires the agent to already possess moral insight to formulate the maxim correctly. If the agent formulates it as "I will break oaths to prevent bad outcomes," Kant's rigorism likely condemns it. If formulated as "I will uphold the higher duty of truth to the public," it might pass. The theory doesn't decide which formulation is correct; the agent does.

  ### 6. The Trial Clause and Snowden

  **"And I will stand trial":**
  If Ellsberg's maxim includes "and I will submit to the legal consequences of my breach," the verdict shifts.
  *   **Effect:** This clause demonstrates respect for the **Rule of Law** even while violating a specific statute. It shows the agent is not placing themselves *above* the law (anarchy) but appealing to a higher moral law while accepting the civil penalty.
  *   **Verdict Change:** It strengthens the case against the "Contradiction in the Will" objection. It shows the agent wills a system of laws, not a system of exceptions for themselves.

  **Snowden's Case:**
  Snowden's analogous clause was flight (exile), not submission.
  *   **Implication:** If the maxim is "I will reveal secrets I deem unlawful and evade the punishment of the state," this looks like self-exemption. It fails the FUL test more readily than Ellsberg's case because it suggests the agent judges themselves immune to the legal order they are challenging.
  *   **Belonging:** Does the clause belong in the maxim? For Kant, moral worth depends on the motive. Accepting punishment proves the motive is duty, not self-interest or convenience. Therefore, the willingness to suffer for the act is intrinsic to the moral evaluation of the civil disobedience. Ellsberg's submission strengthens his Kantian credentials; Snowden's flight weakens them, not necessarily regarding the *truth* revealed, but regarding the *right* of the individual to unilaterally suspend legal obligation.

  **Summary of the Tension:**
  Your friend is right that the *mechanism* of the Categorical Imperative is sensitive to maxim formulation, which introduces subjectivity. You are right that a *faithful* formulation, particularly when tested against Publicity and Humanity, yields a strong asymmetry: the State's deception is structurally incompatible with Kantian justice, while Ellsberg's leakage is only incompatible if one prioritizes institutional fidelity over public autonomy. The theory does not algorithmically solve the priority, but it heavily burdens the State.
