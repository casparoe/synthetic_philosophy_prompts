          *   Practice-level: "The state will systematically deceive its citizens about military efficacy to ensure operational continuity."
      *   *Principled vs. Gerrymandered:* A principled maxim captures the agent's actual reasoning without adding ad hoc conditions to force a result (e.g., "I will lie unless it's for a really good cause" is often seen as gerrymandered in Kantian circles, though some argue context matters).
      *   *Faithfulness:* Ellsberg saw himself as a whistleblower, not an anarchist. He tried legal channels first. So the maxim should reflect *last resort* or *specific moral necessity*, not just "leak whenever."

  3.  **Step 2: Formula of Universal Law (FUL) & Formula of the Law of Nature (FLN):**
      *   *Task:* Run tests on both specifications. Distinguish Contradiction in Conception (CC) vs. Contradiction in the Will (CW). Check if verdict changes with description level.
