      *   *Constant:* Kant says don't lie to the murderer. Ellsberg broke an oath (effectively a lie/breach of trust).
      *   *Consistency:* If Kant condemns lying to a murderer, does he condemn leaking classified info (breach of contract)?
      *   *Argument:* The Constant case is about *truthfulness*. Ellsberg is about *fiduciary duty* vs. *public good*.
      *   *Decision Procedure:* This suggests FUL isn't a simple algorithm. It requires correct maxim formulation. If the friend says it's "laundering," this step shows why: without a theory of duty hierarchy, the agent chooses the maxim.
      *   *Defect:* Kant's rigid legalism might condemn Ellsberg (breach of contract/oath), while his moral core (Humanity) supports him. This tension exposes a gap in the system regarding institutional vs. moral duties.

