      *   *Snowden:* Fled. Does this make his maxim "I will break laws I dislike and evade punishment"? That looks more like self-exemption, which fails FUL.
      *   *Belonging:* Is acceptance of punishment part of the *motive* or a *consequence*? Kant cares about motive. Accepting punishment shows the act isn't based on self-interest, but duty. So yes, it belongs to the *moral worth* of the action, if not the strict logical universalizability.

