prompt: |-
  Me and my friend Nadia had a massive argument last night (we do this alot) — she's a palliative care nurse and reads way too much philosophy on the side, and we ended up going at it about advance directives, and specifically whether the person you were ten years ago gets to boss around the person you are now. What drives me up the wall is that she has these rock-solid verdicts on a whole pile of cases and I can not for the life of me figure out the rule she's actually running. Here's her track record. (1) A man wrote a very detailed directive while he was fully competent — he'd watched his own father go down with Alzheimer's — refusing CPR, ventilation, dialysis, and artificial feeding if he ever got to the point of not recognizing his family or speaking in sentences. He's now exactly there: advanced dementia, doesn't know his kids, no real speech. His family is begging for a feeding tube because he always loved eating. Nadia says honor the directive, comfort care only, no tube. (2) A woman's directive refused dialysis if she ever ended up permanently unconscious; she's now in a persistent vegetative state, and Nadia says pull the dialysis. (3) A guy's directive just said he didn't want anything extraordinary done to keep him going. He's now got a pneumonia that clears right up with antibiotics, and he's too confused to be asked. Nadia says the directive is too vague to bind and you treat the pneumonia. (4) A man signed a directive refusing everything while he was in the middle of a severe untreated depression; he's since been treated, is back to himself, and now wants full treatment. Nadia says the directive is void because he wasn't himself when he wrote it, so you treat him.

  The case we actually fought about: a man in early-to-mid dementia. Before he got sick he wrote a very specific, thoughtful directive along the lines of case 1. He's now at the stage his directive described — can't manage his affairs, memory badly shot — and by the formal capacity test he's incompetent, meaning he can't name his diagnosis or explain what a feeding tube actually does. But here's the thing: he still knows and adores his wife and daughter, still plays and loves music, still tells his old terrible jokes, and he keeps saying clearly that he wants to live and wants to be treated. He can even say, more or less, that he knows he wrote that document refusing treatment, but he's changed his mind and wants to see his granddaughter grow up. Nadia got weirdly evasive about this one and wouldn't commit.

  So what I want from you is the thing she won't give me. Tell me what she'd say about the new case, but the real deliverable is the set of different rules that all fit her earlier verdicts (I'm convinced there's more than one, and I want to see which ones survive), what each one predicts about the new case, which of them the new case actually pulls apart, which rule you'd bet she's really running and why, and then the single further case that would cleanly separate whichever rules are still standing. Give it to me as a JSON object with these exact fields: "predicted_verdict" (either the string "honor the directive" or the string "follow the present wish"); "candidate_rules" (an array, each item an object with "name", "rule" as a one-sentence statement, "prediction_for_new_case", and "consistent_with_every_precedent" as true or false); "best_rule" (the name of the one you'd bet on); "why" (a short paragraph); "divergent_rules" (an array of two-element arrays, each listing a pair of rule names that disagree on the new case); "discriminating_case" (a short description of the one further case that would best separate the survivors); and "confidence" (a number between 0 and 1). Keep the prose inside the fields tight — I want to be able to paste the rules straight into the argument next time.
