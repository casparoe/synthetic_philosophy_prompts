answer: |-
  You have described a phenomenon that is well-documented in critical sociology, criminology, and social work literature, but it is usually described using a cluster of terms rather than a single word. The reason you aren't finding one perfect label is that the literature is split between those studying the *policy* (the reform), those studying the *technology* (the paperwork), and those studying the *experience* (the feeling of care vs. control).

  Here is the breakdown of the existing terminology, why it only half-fits, and a proposed coinage for the specific mechanism you are seeing.

  ### 1. The Existing Terms (The Half-Fits)

  **(a) For the Move (Reform + Monitoring):**
  The strongest established term is **Carceral Humanism** (or *Penal Humanism*).
  *   **Source:** Scholars like Lisa Guenther (*Solitary Confinement: Social Death and Its Afterlives*) and others in critical prison studies.
  *   **What it fits:** It describes exactly the paradox you noted: reforms that make punishment more "humane" (removing visible violence) often make it more durable, expansive, and psychologically penetrating. It validates the staff's feeling of moral improvement while acknowledging the system's expansion.
  *   **Where it fails:** It is usually applied to *policy shifts* (e.g., banning solitary confinement) rather than the daily bureaucratic mechanics. It doesn't fully capture the *paperwork* aspect.

  **(b) For the Technique (Care = Watching):**
  The closest term is **Therapeutic Surveillance**.
  *   **Source:** Used in sociology of health and juvenile justice (e.g., work by Monique Morris or critical social work theorists).
  *   **What it fits:** It describes monitoring that is justified by treatment. The gaze of the guard is rebranded as the gaze of the clinician.
  *   **Where it fails:** It implies a clinical setting. It doesn't quite capture the *administrative* nature of the forms you are describing (checklists, points, logs).

  **(c) For the Paperwork:**
  The relevant concept is **Audit Culture**.
  *   **Source:** Anthropologist Marilyn Strathern (*Audit Cultures*).
  *   **What it fits:** It describes how accountability measures (forms, logs) cease to be neutral records and become the primary reality of the work. The form dictates the interaction.
  *   **Where it fails:** It is usually cynical about the "care" aspect. It assumes the care is fake. You are reporting that the care is *real* (the staff are genuinely gentler), which Audit Culture doesn't easily account for.

  ### 2. The Coinage: **Pastoral Accounting**

  Since no single term captures the fusion of *genuine care*, *bureaucratic scoring*, and *surveillance* in the specific document you described, I propose the term **Pastoral Accounting**.

  **Definition:**
  *Pastoral Accounting* is an administrative technology where the record of support and the record of deviation are identical. It is a system where "keeping account" of a person (scoring, logging, assessing risk) is indistinguishable from "keeping care" of them (support plans, de-escalation).

  **Why this term?**
  *   **Pastoral:** Draws on Foucault's concept of *Pastoral Power*. The shepherd (staff) must know every detail of the sheep's (kid's) life to save them. It captures the genuine moral intent of the staff. They are shepherds, not jailers, in their own minds.
  *   **Accounting:** Draws on the sociological meaning of "giving an account." It is not just financial; it is the act of rendering behavior into data points, logs, and assessable categories.
  *   **The Fusion:** In Pastoral Accounting, you cannot give care without creating an account. To help the child is to log the incident. To log the incident is to create a permanent record of deviation.

  ### 3. Boundaries and Distinctions (Answering Part C)

  You asked where this starts and stops, and how it differs from co-optation.

  **Is it the same as PBIS (Positive Behavioral Interventions and Supports)?**
  *   **Yes.** PBIS is a specific *brand* of Pastoral Accounting. When a school switches from detention to a points system, they are replacing *physical* containment with *data* containment. The child is no longer contained in a room; they are contained in their own data profile. If the profile follows them, the containment is mobile.
  *   **Edge:** It stops being Pastoral Accounting if the data is *not* used for risk assessment or future restriction. If the points are purely for rewards and are wiped clean without consequence, it is just behaviorism. If the points create a "risk profile" that follows the kid to the next school or court hearing, it is Pastoral Accounting.

  **Is it the same as Welfare "Coaching"?**
  *   **Yes.** When a welfare office switches from sanctions to "coaching," but the coaching sessions are logged and used to determine eligibility or risk levels, it is the same animal. The "support plan" is the "compliance log."
  *   **Edge:** It stops being Pastoral Accounting if the client has the right to *refuse* the documentation without penalty. In the institutions you describe, the kid cannot opt out of the form.

  **Is it Co-optation?**
  *   **No.** This is a crucial distinction.
  *   **Co-optation** is when a system absorbs a *critique* by giving the critics a seat at the table, thereby defanging the opposition. (e.g., putting a community activist on the board, but changing nothing).
  *   **Pastoral Accounting** is when a system absorbs a critique by *changing its own technology* to become more efficient.
  *   **The Mechanism:** Co-optation neutralizes the *enemy*. Pastoral Accounting metabolizes the *method*. The reformers demanded "less violence." The system replied, "Agreed. We will replace violence with data." The critique is not defanged; it is *operationalized*. The system becomes *more* legitimate because it has adopted the language of its critics (care, trauma-informed, support), making it harder to attack.

  ### 4. Why the Two Truths Coexist

  You noted that the staff feel better and the kids feel worse, and both are telling the truth. **Pastoral Accounting** explains this via the **Direction of the Gaze**.

  *   **For the Staff (The Shepherd):** The form is a shield. It proves they acted ethically. It protects them from liability. It structures their chaos into order. It allows them to see themselves as professionals rather than guards. The form *validates* their care.
  *   **For the Kids (The Sheep):** The form is a cage. It renders their interior life exterior. A private frustration becomes a public "incident." A momentary lapse becomes a permanent "risk factor." They are not being watched by a person (which can be negotiated, pleaded with, or humanized); they are being watched by a system that never sleeps and never forgets.

  ### Summary for your Reporting

  *   **The Macro Pattern:** **Carceral Humanism** (Humane reform extending control).
  *   **The Micro Mechanism:** **Pastoral Accounting** (The fusion of care-logs and surveillance-logs).
  *   **The Distinction:** This is not **Co-optation** (absorbing critics); it is **Metabolization** (absorbing the critique into the operating system).
  *   **The Edge:** It applies wherever "support" is mandatory and "documentation" is the medium of that support.

  If you need a phrase for the article, you might write: *"This is not just bureaucracy; it is **Pastoral Accounting**. The ledger of care has become the ledger of control."*
