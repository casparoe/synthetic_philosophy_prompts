  ### What the Basic Argument Actually Establishes

  Galen Strawson's Basic Argument asserts that ultimate moral responsibility is logically impossible. To be responsible for an action, you must be responsible for the character that produced it. However, you cannot be responsible for your initial character (genetics, early environment), nor for the choices you make to change it, as those choices stem from the very character you didn't choose. This creates an infinite regress. For your panel, this eliminates retributive justice—the idea that students *deserve* punishment because they are morally blameworthy. However, it does not eliminate practical accountability. We can still intervene to shape future behavior, protect the community, and educate. The distinction is between backward-looking blame (which fails) and forward-looking management (which remains). You are not judging souls; you are managing risks. Many try to paper over this gap, but Strawson forces you to admit that while you must punish, you cannot claim the student *could have done otherwise*.

  ### The Procedure

  To operationalize Strawson without collapsing into nihilism, your panel must shift from judging character to managing causality. The following five steps ensure consistency while respecting the argument's constraints.

  1.  **Causal Inventory (5 Minutes):** Begin by mapping the specific causes. Ask: "What specific pressures, biological states, or environmental factors made this action likely?" Document the divorce, the peer group, or impulse control issues. Do not judge them yet; list them as data points. This grounds the hearing in facts rather than moral outrage. If members disagree on causes, vote on the facts first. You must separate the *story* of the student from the *mechanics* of the act.
  2.  **The Regress Check (2 Minutes):** Explicitly state internally: "None of these causes were chosen by the student." This prevents the panel from slipping into the illusion of ultimate blame. It forces you to see the student as a locus of causes, not a source of evil. This step is crucial for consistency; it stops members from arguing about "choice" when the causes are evident. The Chair must enforce this silence on metaphysical blame. Acknowledge that even the decision to confess was caused.
  3.  **Future Hazard Analysis (5 Minutes):** Since blame is off the table, focus on probability. Ask: "Given this causal chain, how likely is repetition? Is the community safe if this student returns unchanged?" This shifts the question from "Are they bad?" to "Are they dangerous?" It justifies consequences without requiring metaphysical guilt. Use data from past cases to estimate recurrence rates. Safety is the only valid justification for restriction.
  4.  **Causal Intervention Test (5 Minutes):** Evaluate potential consequences solely on their ability to alter future causes. Ask: "Will suspension deter? Will counseling address the root causal factor?" If a punishment does not change the causal chain, it is useless cruelty. This filters out vindictive recommendations that serve no practical purpose. Discard any option that is purely punitive. If no intervention works, acknowledge the limitation.
  5.  **Transparent Framing (3 Minutes):** Frame the outcome as safety or education. Instead of "You are suspended for cheating," recommend "Removal until academic integrity can be ensured." This maintains honesty about the lack of ultimate blame while preserving the necessity of consequences. It protects the panel from hypocrisy. Write the recommendation using neutral, administrative language. Avoid moralizing terms like "wrong" or "guilty."

  This procedure requires discipline. Members will want to revert to blame. The Chair must remind them that consistency requires abandoning the comfort of moral desert.

  ### Case 1

  The plagiarism stems directly from the chaos of divorce and moving. The Causal Inventory shows overwhelming external pressure compromising executive function. The Regress Check confirms the student could not magically stabilize their home life. Risk of recurrence is low once stability returns. Intervention Utility suggests punishment adds stress, worsening the cause. Recommendation: Zero on the essay, but no suspension. Mandatory study hall to support structure. You will likely accept this; it aligns with mercy and practical support. The procedure validates leniency without requiring you to pretend the student "chose" stress. It feels compassionate because the causal chain is visible and external. The panel can agree that supporting the student alters the causal chain positively. This outcome feels just because it addresses the root cause rather than the symptom. It preserves the student's dignity while maintaining academic standards.

  ### Case 2

  The bullying arose from a desire for belonging within a specific friend group. The causes are social survival instincts and group dynamics unchosen by the student. Risk Assessment indicates high recurrence if the peer group remains intact. Intervention Utility favors separating the group and mandatory empathy training over suspension, which might reinforce victimhood. Recommendation: Restorative justice conference and group separation. This feels soft to victims, but logically consistent. The procedure demands you treat the bully as a product of social causality. It requires prioritizing rehabilitation over retribution, which may frustrate those seeking justice for the victim. However, keeping the student in school allows for monitoring. The panel must resist the urge to punish for the sake of the victim's feelings, focusing instead on stopping the behavior.

  ### Case 3

  The theft was planned weeks ahead, showing deep causal integration of dishonesty into character. No external trigger exists, but the internal causal chain is rigid. Risk Assessment is critical: this student is highly likely to reoffend. Intervention Utility suggests suspension is necessary to protect property, even if it doesn't fix the character. Recommendation: Suspension and potential expulsion. **You will not like this.** It requires punishing a student severely while admitting they are not ultimately responsible. It feels like treating a human as a broken appliance to be quarantined, which is dehumanizing even if logically sound. You must recommend harm to a student you admit couldn't ultimately help themselves. The procedure forces you to prioritize community safety over the student's fate, knowing the student is a victim of their own causality. This coldness is the cost of consistency.

  ### Where the Procedure Fails

  The procedure fails where risk assessment meets value judgment. Strawson tells us blame is impossible, but he does not tell us how much risk is acceptable. Deciding whether a 50% chance of reoffending warrants expulsion is not a factual calculation; it is a moral choice about liberty versus safety. Furthermore, the procedure requires panelists to act *as if* consequences matter while believing *that* ultimate responsibility does not. This cognitive dissonance cannot be resolved by steps. At the final vote, a person must decide how much harm they are willing to inflict on a determined agent to protect others. The procedure maps the terrain, but you must choose the destination.
