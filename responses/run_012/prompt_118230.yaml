answer: |-
  Hi there, it sounds like a fascinating episode and I completely understand your concern about keeping the conversation from stagnating on the standard elevator pitch, so I have drafted a sequence of nine questions designed to press the specific pressure points you mentioned while ensuring you have a follow-up ready for the predictable deflationary exits. You should start with question one by asking her to elaborate on the expressive function of truth, specifically how the predicate allows us to endorse a heap of claims without listing them, and then immediately pivot to the ugly cases where this generalization seems to break down, such as when one person says everything another person said is true while everything a third person said is true even though the second and third contradict each other. If she responds that the predicate simply facilitates logical quantification over propositions, your follow-up should be to ask how her view accounts for the logical inconsistency without appealing to a substantive property that prevents contradictory propositions from both holding, since the disquotational schema alone seems to validate both endorsements unless there is a constraint beyond mere syntax.

  Moving to the second point, you should challenge her on the requirement of translation when dealing with foreign languages, noting that a deflationist seems to need a translation in hand before she can even state her disquotational schema for sentences she does not understand. When she inevitably argues that truth is always relative to a language or interpretation, press her with the follow-up that this looks like smuggling in a real assumption about meaning, asking whether the need for a prior theory of translation suggests that truth is doing less work than meaning, or if meaning is actually doing the heavy lifting that she attributes to the logical device of truth. For question three, shift the focus to whether truth earns its keep as an explanatory notion within a truth-conditional theory of meaning, asking if a deflationary truth predicate can actually do the work a semantic theory wants from it without becoming circular. If she claims that deflationism is compatible with truth-conditional semantics, your counter should be to ask whether the explanation of meaning in terms of truth conditions becomes vacuous if truth conditions are themselves defined merely as conditions under which we are willing to assert the sentence, thereby collapsing the distinction between meaning and assertibility.

  Question four should target the explanation that reliable ways of forming beliefs tend to produce true ones, asking her how a deflationary view underwrites the success of action without appealing to a robust correspondence between belief and world. Should she reply that the explanation is purely pragmatic or causal, you need to ask why the generalization holds across diverse domains if truth is not a shared property linking those beliefs to reality, forcing her to explain the unity of success without the unity of truth. This leads naturally into question five regarding the formal result that bolting a truth predicate onto a base theory is not conservative, so you should ask whether this shows truth was doing substantial work all along by allowing the derivation of new arithmetic claims. If she attempts to absorb this by claiming the substantial work is done by the logic or the base theory rather than truth itself, your follow-up must be to ask why the addition of a merely logical device expands the deductive power of the system, suggesting that the device carries more weight than a mere shorthand.

  On the normative side, question six should probe why anyone should care about truth at all if it is this thin, specifically asking how deflationism accounts for truth as the norm of assertion or the aim of inquiry. When she suggests that asserting is constitutively governed by truth, press her with the follow-up that this merely relocates the mystery, asking what grounds this constitutive norm if truth itself lacks any value-laden substance that would make it worthy of being an aim. For question seven, ask whether deflationism really deflates the realism fight or just relocates it to the existence of the objects talked about, noting that one can be a deflationist about truth while remaining a robust realist about electrons. If she agrees that the realism debate survives deflationism, you should ask what work the truth predicate is doing in that debate if it cannot distinguish the realist from the anti-realist, implying that the predicate is too thin to matter for metaphysics.

  Question eight needs to press on the Liar paradox and the logical machinery she needs to survive it, asking whether her solution requires a non-classical logic or a hierarchical structure that seems far from lightweight. If she admits that technical scaffolding is required to avoid inconsistency, your follow-up should be to ask in what sense the view is still deflationary if the logic required to sustain it is more complex and revisionary than the classical logic assumed by substantive theories. Finally, end with question nine by asking what would actually make her give the view up, requesting a concrete empirical or formal result that would force her to accept a substantive property of truth. If she says nothing could convince her because it is a conceptual truth, you should close by asking whether that makes the view immune to criticism rather than justified, suggesting that a theory that cannot be falsified might be functioning more like a dogma than a philosophical hypothesis. I hope this helps you steer the conversation into the deeper waters where her expertise will really shine, and let me know if you need any adjustments to the tone before you go into the studio.
