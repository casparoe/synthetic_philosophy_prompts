answer: |-
  # Q&A Strategy Sheet: Bell's Theorem & The Screening-Off Condition

  **Context:** Department Workshop
  **Presenter:** 4th-Year PhD Candidate
  **Core Thesis:** Bell's theorem refutes Reichenbach's Common Cause Principle (Screening-Off), not Locality (Parameter Independence/No-Signalling). "Non-local influence" is an interpretive import, not a logical consequence.

  ---

  ### General Concessions (Make these early in the talk or opening remarks)
  1.  **Terminological Ambiguity:** Concede that "Locality" is overloaded. You are using it strictly to mean *Parameter Independence* (no superluminal signaling/control), not *Local Causality* (Bell's full condition).
  2.  **Ontological Spookiness:** Concede that violating Screening-Off is metaphysically costly. You are not claiming the world is "classical" or "intuitive," only that the specific label "non-local influence" is unjustified by the inequality alone.
  3.  **Realism:** Acknowledge that your argument assumes a single-outcome framework (bracketing Everett for the sake of the specific causal argument).

  ---

  ### 1. The Committed Bohmian
  **Damage Level:** **Critical.** (They claim your distinction is verbal; their ontology *requires* non-local influence to explain the correlation.)
  **Phrasing:** "You're drawing a distinction without a difference. In Bohmian mechanics, the wavefunction is real, and the guidance equation explicitly couples the particles instantaneously. If $\lambda$ is the complete state and it fails to screen off, there *must* be a dependency between the wings. If you deny a causal link, what grounds the correlation? If you admit the dependency but refuse to call it 'influence,' aren't you just being squeamish about the word 'non-local'?"

  **Two-Minute Reply:**
  "I'm not being squeamish; I'm being precise about *control*. In Bohmian mechanics, the non-locality is ontic, but it is also carefully constrained to prevent signaling. My point is that the *experimental violation* of Bell's inequality only forces us to accept the dependency, not the *mechanism* of influence.
  Bohmians choose to model that dependency via a non-local potential. That is a valid *model*, but it is not the *only* one. One could adopt a holistic ontology where the pair is a single object regardless of distance, rendering 'influence between wings' a category error. Bell's theorem rules out local *separability*, not necessarily local *causation* in the sense of a signal. I am arguing we should locate the 'weirdness' in the failure of the common cause principle (holism), rather than importing a dynamical influence that the statistics (no-signalling) explicitly hide from us."

  **Weakness:** This risks sounding like you are advocating for "Bohmian mechanics but don't tell anyone it's non-local." You must emphasize that *holism* is distinct from *action-at-a-distance*.

  ### 2. The Analytic Metaphysicians (Joint Objection)
  **Damage Level:** **High.** (If they collapse your distinction between "influence" and "failed screening-off," the paper loses its philosophical bite.)
  **Phrasing:** "You're relying on a specific decomposition (Jarrett/Shimony). But on an interventionist account of causation (like Woodward's), if fixing $\lambda$ and setting $a$ doesn't screen off $B$, then $A$ is causally relevant to $B$ *simpliciter*. If you deny 'cause' here, what work is the term doing? Are you suggesting brute correlation? If so, isn't that just giving up on explanation?"

  **Two-Minute Reply:**
  "I am suggesting that 'cause' in the interventionist sense tracks *manipulability*. Since we cannot signal (PI holds), we cannot intervene on $A$ to change the statistics of $B$. Therefore, on an interventionist account, there is no causal link.
  The failure of Screening-Off indicates a failure of *separability*, not necessarily a causal arrow. Think of it as a modal constraint: the space of possible worlds doesn't factorize. This isn't 'brute correlation' in the sense of an unexplained accident; it's a structural feature of the state space. I'm arguing we should update our metaphysics of *objects* (they aren't distinct) rather than our metaphysics of *causes* (they reach across space)."

  **Weakness:** Interventionism is controversial in quantum foundations. If they press that "ontic dependence" exists even without intervention, you have to concede the point and retreat to "signaling" as the only physically meaningful definition of influence.

  ### 3. The Bell Test Expert
  **Damage Level:** **Medium.** (They care about the empirical setup, not the metaphysics, but can undermine your premises.)
  **Phrasing:** "You're treating PI and OI as empirically distinct. But in any real experiment, 'No-Signalling' is a statistical bound, not a logical certainty. Given finite runs, we never strictly satisfy PI. If you rest your entire philosophical distinction on a condition that is never strictly met in the lab, aren't you building on sand? Also, have you accounted for the freedom-of-choice loophole in your definition of 'setting'?"

  **Two-Minute Reply:**
  "Fair point on the statistics, but my claim is about the *theoretical structure* of the theories that fit the data, not the raw data itself. QM *theoretically* satisfies PI exactly. The experimental bounds are tight enough that any theory violating PI significantly is empirically ruled out.
  Regarding freedom of choice: My argument assumes the standard 'Measurement Independence' condition. If we drop that (Superdeterminism), Bell's theorem dissolves entirely, and my point becomes moot. I am arguing within the standard framework where settings are free variables. Within that framework, the violation lands on OI, not PI."

  **Weakness:** If they press that "Measurement Independence" is the actual weak link, your whole argument shifts to Superdeterminism, which is a different paper.

  ### 4. The Everettian
  **Damage Level:** **Low/Medium.** (Easy to bracket, but they can derail the discussion.)
  **Phrasing:** "Your decomposition of Local Causality into PI and OI assumes unique outcomes. $P(A|a,\lambda)$ is ill-defined in Many-Worlds. In Everett, there is no violation of locality because all outcomes occur. Doesn't your argument just dissolve if you accept unitary quantum mechanics?"

  **Two-Minute Reply:**
  "You're right that Everett avoids the tension by denying the uniqueness premise. However, this workshop is addressing the interpretation of Bell's theorem *as a constraint on single-outcome theories*. Even if Everett is true, we need to understand why the *appearance* of single outcomes leads to the Bell violation. My argument explains why any theory *recovering* the appearance of single outcomes (including effective collapse models) must abandon Screening-Off. I'm analyzing the phenomenology of the correlation, which all interpretations must account for."

  **Weakness:** They may retort that analyzing "effective" single outcomes is philosophically second-rate. Keep it brief and move on.

  ---

  ### The "Hope Nobody Asks" Question
  **The Question:** "If $\lambda$ is the *complete* state of the pair, and it fails to screen off $A$ and $B$, and you deny a direct causal link between $A$ and $B$... **what metaphysical relation do you posit that carries the correlation?** If it's not a common cause and it's not a direct cause, isn't 'Holism' just a placeholder for 'I don't know'?"

  **Why this hurts:** It forces you to provide a positive ontology. Your paper is largely negative (refuting the "influence" claim). If you can't articulate what *replaces* the common cause without collapsing back into non-locality, the metaphysicians will smell a gap.

  **Prepared Deflection:** "It's not a placeholder; it's a denial of the premise that the world is composed of distinct relata waiting to be related. The relation is internal to the system, not external between parts. But I agree this requires a robust defense of holism, which is the next stage of this project."

  ---

  ### The "Must Land" Reply
  **Target:** **The Bohmian.**
  **Why:** If the Bohmian convinces the room that your view is merely "Bohmian mechanics with semantic gloss," you lose the novelty and philosophical contribution of the paper. You must establish that **Non-Separability (Holism)** is a distinct ontological category from **Non-Locality (Influence)**.
  **Success Condition:** The audience leaves believing that "Influence" implies a mechanism that *could* signal (even if masked), whereas your "Failed Screening-Off" implies a structural constraint that *cannot* signal. If you land this, you preserve the distinction between PI and OI as physically significant, not just mathematically convenient.

  ---

  ### Final Advice for the Presentation
  *   **Don't fight the math:** Everyone agrees on the inequality. Fight the *inference* from the inequality to the ontology.
  *   **Watch the Metaphysicians:** They are your natural allies but also your greatest risk. If they feel you are using "cause" loosely, they will tear the argument apart. Use their terminology (intervention, counterfactuals) to bolster your PI defense.
  *   **Time Management:** The Bohmian and Metaphysicians will dominate the Q&A. Prepare to cut off the Everettian politely to save time for the causal questions.

  Good luck. This is a classic position (Shimony/Jarrett) but still vital. Own the distinction.
