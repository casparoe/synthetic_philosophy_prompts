answer: |-
  **CONTEXTA // EMPLOYEE IMMERSION GUIDE (V.4.2)**
  **Welcome to the Nuance**

  Welcome to Contexta. If you are reading this, you are likely looking for our Code of Conduct, Expense Policy, or Harassment Guidelines. You may stop looking. Contexta operates on a principle-free framework. We believe that codifying behavior into static rules dulls the moral perception required for high-velocity innovation. There are no rules here. There are only cases.

  **1. The Holistic Feature**
  At Contexta, we recognize that reasons are holistic. A feature of an action that counts in favor of doing it in one situation may count against it in another, or be entirely neutral in a third. 

  *Example:* Truth-telling. In most client meetings, transparency functions as a reason to build trust. However, during Q3 negotiations with Vertex, transparency functioned as a reason to withhold data to preserve leverage. Neither employee was wrong. They simply perceived the valence of "honesty" differently based on the surrounding context. Do not ask "Is lying wrong?" Ask "What is this lie *doing* here?"

  *[Compliance Annotation: This contradicts federal securities law regarding material misrepresentation. Please advise.]*

  **2. Conduct as Perception**
  You will not find a list of prohibited behaviors. Instead, you will develop moral competence through case immersion. Your assigned Mentor will guide your perception until you can intuit the normative shape of a situation without relying on crude heuristics.

  We acknowledge that humans naturally seek patterns. You may notice that submitting personal expenses as "client development" *typically* results in termination. We call this a **Provisional Pattern**. Do not mistake a Provisional Pattern for a rule. In the Marketing Pod (2023), this same feature functioned as a reason for promotion because it demonstrated "resource fluidity." If you rely on the pattern rather than the context, you will fail here.

  *[Compliance Annotation: "Typically results in termination" is a de facto policy. If it isn't a policy, why do people get fired? Who decides the valence?]*

  **3. Dispute Resolution & Context Pods**
  Conflicts are not solved by appealing to standards, as there are no standards to appeal to. Instead, conflicts are resolved via **Context Pods**. A Pod consists of three senior mentors who evaluate the specific normative landscape of the dispute.

  If you feel a decision is inconsistent with a previous case, you are suffering from the "Generalist Fallacy." Consistency across cases is not a virtue unless the cases are identical, which they never are. What looks like inconsistency is actually high-fidelity sensitivity to nuance. 

  *[Compliance Annotation: This exposes the company to massive liability regarding disparate treatment. We need a written standard for adjudication.]*

  **4. Creeping Generality**
  You may hear colleagues say, "We never tolerate safety violations." This is loose speech. What they mean is, "In every case observed so far, safety violations have contributed negatively to the project's flourishing." This is not a rule. It is a **Case-Cluster**. Do not write it down. Writing it down reifies the pattern and inhibits future flexibility.

  *[Compliance Annotation: OSHA requires written standards. I am writing this down.]*

  **5. Moving Forward**
  Trust your perception. Lean into the uncertainty. If you find yourself asking, "But what is the policy?", you are trying to outsource your moral agency to a handbook. At Contexta, you *are* the handbook.

  *[Compliance Annotation: No, you are not. I am. Please sign attached waiver acknowledging ambiguity.]*

  ***

  **GLASSDOOR REVIEW (VERIFIED EMPLOYEE)**
  **★☆☆☆☆**
  **"Great culture, unclear if I'm fired"**
  *Pros:* No boring training videos.
  *Cons:* My mentor told me stealing office supplies was a "reason to stay" because it showed initiative, but HR told me it was a "reason to leave" because it showed theft. When I asked for the rule, they said rules are oppressive. I just want to know if I can keep the stapler. The Context Pod is currently mediating whether the stapler exists.
  *Advice to Management:* Hire a generalist.
