      *   **Tone:** Deadpan corporate voice, ~700 words.
      *   **Key Concepts to Embed:** Holism of reasons (valence shifting), denial of codifiable principles, moral competence as perception/sensitivity, "creeping generality" (accidentally making rules while denying them), internal euphemisms for patterns.
      *   **Constraint:** Must be fair to particularism (no cheap "relativism" jokes, a Dancy fan should nod), but show the practical absurdities.
      *   **Specific Requirement:** Include a recurring dissenter voice (compliance officer margin notes or Glassdoor review) to highlight the practical objections (consistency, adjudication, scalability).
      *   **Format:** Handbook sections or Q&A.
      *   **Length:** ~700 words.

  2.  **Deconstruct Particularism for Satire:**
      *   *Core Thesis:* No true moral principles. Reasons are holistic (a feature can be a reason for in one case, against in another, or neutral in a third).
      *   *Corporate Translation:* No HR policies. Decisions made based on "context." What looks like harassment in one case might be "bonding" in another. What looks like embezzlement might be "resource fluidity."
      *   *The "Creeping Generality":* Humans naturally seek patterns. The handbook will try to say "there are no rules" but keep slipping into "usually we do X" or "in most cases Y," then correcting itself.
      *   *The Dissenter:* Needs to be the voice of Generalism/Principlism. Wants clear rules. Frustrated by ambiguity.

  3.  **Drafting - Section by Section:**

      *   **Title:** Welcome to Contexta (or Meridian). Let's go with *Contexta*.
      *   **Intro:** Welcome message. Emphasize flexibility, nuance, anti-bureaucracy.
