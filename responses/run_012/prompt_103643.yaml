      *   *Section 1: The Principle-Free Workplace.* Explain holism.
      *   *Section 2: Conduct & Valence.* Example of honesty/harassment.
      *   *Section 3: Dispute Resolution.* Context Pods.
      *   *Dissenter Notes:* Inserted throughout or at the end? The prompt says "recurring dissenter... margin notes... or a one-star Glassdoor-style review tacked on at the end." Let's do margin notes throughout for better flow, or a sidebar. Margin notes feel more immediate. Actually, a "Compliance Addendum" at the bottom of sections might work better visually in text format. Let's try inline brackets or footnotes style. Let's go with *Compliance Footnotes* for clarity.
      *   *Wait, re-reading prompt:* "seed in a recurring dissenter... margin notes... or a one-star Glassdoor-style review tacked on at the end." I'll do margin notes interspersed, it feels more like a document being annotated.

      *   *Revision on Dissenter:* To make it distinct, I'll use bolded italics in brackets *[Compliance Note: ...]*.

      *   *Drafting text:*
