prompt: |-
  I chair a regional panel that reviews deaths in custody — people who died in prisons and immigration removal centres in our jurisdiction, most of them known to at least two public agencies before they died. We sit quarterly, take about thirty cases a year, and allow ninety minutes per case. The panel is nine people: a clinician, a former prison governor, a lawyer, a criminologist, two lay members, and a family liaison officer. Our terms of reference are narrower than our reputation. We are asked only to determine whether an omission by a named agency or individual was among the causes of the death, and to recommend changes to policy. We cannot discipline anyone. But our findings are published, sent to the family, and routinely cited in inquests and misconduct proceedings, so the field reads a causal finding as a verdict of blame. That is not the question we are asked, and not one we are equipped to answer. I sign the findings; dissents are recorded.

  I would like you to turn the philosophy of causation by omission into a decision procedure the panel can actually run in a case meeting. I want the questions in the order they should be asked, what counts as a sufficient answer to each, the point at which the procedure stops and returns a verdict of no causal role, the point at which it must return not assessable on this record, and the point at which it hands the question to the chair as a judgment the panel is not entitled to make by procedure. It has to survive the cases that keep defeating us. An omission leaves no footprint, so the counterfactual is not well defined until we say what the actual agent would have done had they not failed to act: the procedure must choose between an actual-agent standard and a reasonable-agent standard, and say what each buys and what it costs. The same inaction can be described at several grains — failing to conduct a round, failing to look through an observation panel, failing to escalate a note — and the but-for answer flips with the description, so I want a description audit built in. We get redundant failures, where two agencies each had a duty and each would have acted had the other not also dropped it, so neither is a but-for cause and yet something plainly caused the death; we get failures that remove a safeguard rather than add a harm, with the damage arriving later through a chain nobody foresaw; and we get pure documentation failures, where the norm broken is a record-keeping norm and the record, not the person, is what suffered. I also want the procedure to say what work the breached expectation is doing in each case: whether a failure can be a cause at all when nothing required the action, or only a counterfactual lost opportunity. Score each candidate omission on two axes kept strictly apart — how much the outcome counterfactually depended on it, and how salient the breached norm is — and tell us what to do when the two come apart, which is most of the time. Fix a verdict vocabulary, and say what the verdicts should be rather than merely that there should be some. Mark every step that is a judgment dressed up as procedure, and every step a lay member cannot perform without clinical or custodial input. No citations or reading lists; I will check the literature myself.

  Then run the procedure on three cases and show your working. First: a man on an at-risk list died overnight; the required welfare round was not carried out, but the panel's clinician believes he was already beyond help by the time it was due, and the last plausible opportunity to intervene came four hours earlier, when no rule required anyone to check on him. Second: a man died by suicide after disclosing a previous attempt to a healthcare escort; the escort's service and the prison each assumed the other would pass the disclosure on, and each would have acted had it been passed. Third: a man's risk assessment was not updated after a cell-sharing decision removed the observation regime he had been under; the assessment was two weeks stale, and there is no evidence anyone would have read it before he died. Say what the procedure does with each, including the case where it returns an answer the panel will not want to hear, and close with an honest account of what the procedure cannot do.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and case analyses:

  1.  **Deconstruct the Request:**

      *   **Role:** Chair of a regional panel reviewing deaths in custody (prisons/immigration centers).
      *   **Panel Composition:** 9 people (clinician, ex-governor, lawyer, criminologist, 2 lay members, family liaison, + Chair).
      *   **Constraints:** 90 mins/case, 30 cases/year.
      *   **Mandate:** Determine if an *omission* by a named agency/individual was *among the causes* of death. Recommend policy changes. No discipline.
      *   **Reality:** Findings are treated as blame/verdicts by outsiders (inquests, families).
      *   **Task:** Create a *decision procedure* based on the philosophy of causation by omission.
      *   **Requirements:**
          *   Ordered questions.
          *   Sufficient answers for each.
          *   Stop points (No causal role, Not assessable, Chair judgment).
          *   Address the "Actual vs. Reasonable Agent" problem in counterfactuals.
          *   Address the "Grain/Description" problem (level of abstraction).
          *   Address "Redundant Failures" (overdetermination).
          *   Address "Safeguard Removal" vs. "Harm Addition."
          *   Address "Documentation Failures."
          *   Score on two axes: Counterfactual Dependence vs. Norm Salience.
          *   Handle divergence between axes.
          *   Fixed verdict vocabulary.
          *   Flag judgment-vs-procedure steps.
          *   Flag lay-member-vs-expert steps.
          *   Run on three specific cases.
          *   Honest account of limitations.
          *   No citations/reading lists.

  2.  **Philosophical & Practical Challenges to Address:**

      *   *Omission Causation:* Omissions aren't events; they are absences. Causation requires a counterfactual ("But for X, Y wouldn't have happened").
      *   *The Counterfactual Problem:* What *would* have happened if they acted? Did the specific agent have the capacity/will? (Actual Agent) Or should we assume a competent agent? (Reasonable Agent).
      *   *The Grain Problem:* "Didn't check" vs. "Didn't look through slot" vs. "Didn't wake him." Different descriptions yield different causal outcomes.
      *   *Overdetermination:* Two guards skip rounds. If either checked, death prevented. Neither is strictly "but-for" cause under simple logic.
      *   *Normative vs. Descriptive:* Is a breach of rule enough, or must it actually change the outcome? (The two axes request).
      *   *Documentation:* Paperwork error didn't kill him, but did it enable the chain?

  3.  **Drafting the Decision Procedure (The "Omission Causation Protocol" - OCP):**

      *   *Structure:* Needs to be linear, with exit ramps.
      *   *Vocabulary:* Needs to be precise to avoid "blame" creep while acknowledging responsibility.
      *   *Axes:*
          1.  Counterfactual Dependence (CD): How likely was survival if the act occurred?
          2.  Normative Salience (NS): How important was the rule/duty breached?
      *   *Agent Standard:* Need to decide when to use Actual vs. Reasonable. *Decision:* Start with Actual (what *this* person would have done), shift to Reasonable if Actual is unknowable or systematically compromised.
      *   *Grain:* Need a "Description Lock" step early on.
      *   *Redundancy:* Need a "Substantial Factor" test for overdetermination.

      *   *Step 1: Duty & Description.* (Is there a duty? How do we describe the omission?)
      *   *Step 2: Counterfactual Construction.* (Actual vs. Reasonable Agent).
      *   *Step 3: Causal Link.* (But-for test + Substantial Factor).
      *   *Step 4: Normative Weight.* (Salience of the breach).
      *   *Step 5: Synthesis/Verdict.* (Combining CD and NS).

      *   *Flags:* Mark where expert opinion is needed (Clinician/Governor) vs. Lay logic. Mark where the Chair must intervene (Policy vs. Fact).

  4.  **Developing the Verdict Vocabulary:**

      *   Need to avoid "Guilty/Innocent."
      *   Need to reflect the two axes.
      *   Options: *Causal Factor*, *Contributory Condition*, *Procedural Breach Only*, *No Causal Role*, *Not Assessable*.
      *   Let's refine:
          1.  **Causal Omission:** High CD, High NS.
          2.  **Contributory Omission:** Moderate CD, High NS (or High CD, Low NS).
          3.  **Procedural Breach (Non-Causal):** Low CD, High NS.
          4.  **No Causal Role:** Low CD, Low NS.
          5.  **Not Assessable:** Record insufficient.

  5.  **Refining the "Actual vs. Reasonable" & "Grain" Issues:**

      *   *Grain:* The procedure must force the panel to agree on the *specific act* omitted before testing causation.
      *   *Agent:* If the actual agent was incompetent/tired, does that matter? If we use "Reasonable," we imply the system should have prevented the incompetence. If we use "Actual," we might excuse systemic failure. *Compromise:* Use "Actual Agent" for immediate causation, but flag "Systemic Reasonable" for policy recommendations. For the *causal verdict*, stick to "Reasonable Agent" to avoid excusing incompetence as a causal break, *unless* the specific incapacity was the primary cause (e.g., sudden illness). Actually, the prompt asks to choose. *Decision:* Use **Reasonable Agent** for the counterfactual. Why? Because "Actual Agent" who is negligent creates a paradox where negligence excuses causation. The "Reasonable Agent" standard asks: "If a competent officer had done the duty, would it have mattered?"

  6.  **Addressing the Specific Cases:**

      *   *Case 1 (The Dead Man/Welfare Round):*
          *   Omission: Missed round.
          *   Counterfactual: Clinician says dead anyway.
          *   Earlier opportunity: No duty.
          *   Result: Breach exists, but CD is zero. Verdict: Procedural Breach (Non-Causal).
      *   *Case 2 (The Handoff/Suicide):*
          *   Omission: Two agencies didn't talk.
          *   Redundancy/Overdetermination: Each waited for the other.
          *   Counterfactual: If *either* spoke, survival likely.
          *   Result: Substantial Factor test applies. Both are causal. Verdict: Causal Omission (Joint).
      *   *Case 3 (The Stale Paperwork):*
          *   Omission: Risk assessment not updated.
          *   Counterfactual: No evidence anyone would have read it.
          *   Result: CD is speculative/low. NS is high (risk assessment is key).
          *   Result: Divergence. Verdict: Contributory Omission (Systemic).

  7.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Acknowledge the tension (Causation vs. Blame).
      *   *The Protocol:* Step-by-step.
      *   *The Axes:* Define scoring.
      *   *The Verdicts:* Define outcomes.
      *   *The Flags:* Explicitly mark Expert/Judgment steps.
      *   *Case Studies:* Apply the protocol rigorously.
      *   *Limitations:* Honest conclusion.

  8.  **Self-Correction/Refinement during drafting:**

      *   *Critique:* Is 90 minutes enough for this?
      *   *Fix:* The procedure must be tight. No endless debate. Time limits per step.
      *   *Critique:* The "Actual vs. Reasonable" choice is crucial.
      *   *Fix:* I will mandate the **Reasonable Agent** standard for the counterfactual. If we use the Actual Agent (the negligent guard), we ask "Would *this* guard have saved him?" If the guard is negligent, the answer is "No," which absolves the omission. That is morally and legally perverse. We must ask "Would a *compliant* execution of this duty have saved him?"
      *   *Critique:* Redundant failures (Case 2).
      *   *Fix:* Use the NESS test (Necessary Element of a Sufficient Set) logic but simplified. If the omission was part of a set of conditions sufficient for the death, and the set was present, it's causal.
      *   *Critique:* Documentation (Case 3).
      *   *Fix:* Distinguish between "Record suffered" and "Person suffered." If the record didn't influence action, it's hard to claim causation of death.

  9.  **Final Review against Constraints:**

      *   No citations? Check.
      *   Verdict vocabulary fixed? Check.
      *   Flags for judgment/expertise? Check.
      *   Stop points defined? Check.
      *   Three cases run? Check.
      *   Honest limitations? Check.

  10. **Tone:** Professional, procedural, slightly weary but rigorous. Matches the Chair's voice.

  *(Self-Correction on Case 1)*: The clinician says he was beyond help *at the time of the round*. But the round was *required*. The breach is real. The causation is the issue. If the round happened, nothing changes. So CD = 0.
  *(Self-Correction on Case 2)*: This is classic overdetermination. If Agency A acted, death prevented. If Agency B acted, death prevented. Neither acted. Standard but-for fails (If A acted, death still prevented by B? No, B didn't act. If A acted, would death happen? No. So A is but-for? Wait. If A acts, B still doesn't. Death prevented. So A is but-for. Same for B. The problem is usually framed as "If A hadn't failed, B would have succeeded." Here, both failed. It's a "duplicate prevention" scenario. Both are causes.)
  *(Self-Correction on Case 3)*: Stale assessment. No evidence it would be read. This is the "Futile Act" problem. If the act (updating) leads to a paper trail no one reads, does it cause death? No. It's a breach of admin, not a cause of death.

  Let's refine the "Actual vs Reasonable" instruction. The prompt asks me to *choose* and explain costs/benefits. I will choose **Reasonable Agent** for the causal test because it isolates the *omission* from the *competence* of the omittor. However, I must flag that this inflates causal findings against systemic backlogs.

  Let's refine the "Grain" audit. Step 1 must force agreement on the description.

  Let's refine the "Judgment vs Procedure" flags. I will use **[J]** for Judgment and **[E]** for Expert Input.

  Okay, ready to write.
answer: |-
  # The Omission Causation Protocol (OCP)

  **Purpose:** To determine whether an omission by a named agency or individual was *among the causes* of a death in custody.
  **Constraint:** This procedure isolates causal contribution from moral blame. A finding of causation is not a finding of culpability, negligence, or liability.
  **Time Allocation:** 90 minutes per case.
  **Vocabulary:** The panel must use the fixed verdict terms below. No synonyms.

  ## Part I: The Decision Procedure

  ### Step 1: Duty and Description Audit (15 Minutes)
  *Goal: Fix the grain of the omission and establish the normative baseline.*

  1.  **Identify the Candidate Omission.** State the failure in one sentence.
  2.  **Description Audit [J]:** Is this description too broad ("failed to care") or too narrow ("failed to initial box 4")?
      *   *Test:* If we change the description, does the outcome change? If yes, refine until the description matches the specific physical or administrative act required by policy.
      *   *Stop Point:* If no specific duty (policy, statute, contract) required the act, return **Verdict: No Causal Role**. (A lost opportunity is not a cause).
  3.  **Establish the Norm.** What rule was breached?
      *   *Input Required:* **[E]** Lawyer/Criminologist to confirm duty exists. **[E]** Former Governor to confirm operational feasibility of the duty at that time.

  ### Step 2: Counterfactual Construction (30 Minutes)
  *Goal: Define what would have happened had the duty been performed.*

  1.  **Select Agent Standard.** You must choose one standard for this case. Do not mix.
      *   **Option A: Reasonable Agent.** Assume a competent, alert officer/clinician performed the duty exactly as policy dictates.
          *   *Buys:* Isolates the omission from the individual's incompetence. Prevents negligence from excusing causation.
          *   *Costs:* May find causation where the actual system was too broken for *anyone* to succeed (overstates individual agency).
      *   **Option B: Actual Agent.** Assume the specific individual performed the duty, with their specific training, fatigue, and knowledge at that time.
          *   *Buys:* Reflects the reality of the specific incident.
          *   *Costs:* If the agent was incompetent, the counterfactual becomes "They would have done the duty badly," which may yield no prevention. This excuses the omission.
      *   **Protocol Mandate:** Use **Reasonable Agent** for all cases involving safety checks, welfare rounds, or clinical interventions. Use **Actual Agent** only for discretionary judgments where policy allows variance.
  2.  **Construct the Scenario.** [E] Clinician/Governor to describe the immediate physical/clinical consequence of the act being performed.
  3.  **The Causal Chain.** Trace the chain from the act to the survival of the deceased.
      *   *Stop Point:* If the chain requires more than two speculative assumptions (e.g., "Officer checks, *then* notices, *then* calls, *then* medic arrives in time, *then* resuscitation works"), return **Verdict: Not Assessable on This Record**.

  ### Step 3: The Redundancy and Overdetermination Test (15 Minutes)
  *Goal: Handle cases where multiple failures occurred.*

  1.  **Identify Parallel Duties.** Did another agency/individual have a concurrent duty to prevent this harm?
  2.  **The Substantial Factor Test [J]:** If Agency A had acted, would the death have been prevented *regardless* of Agency B's failure?
      *   *If Yes:* Agency A's omission is a cause. (Do not absolve A because B also failed).
      *   *If No (Both were required):* Both omissions are necessary elements of the sufficient set of causes. Both are causal.
      *   *If No (Either was sufficient):* Both are causal. (Duplicate prevention failure).

  ### Step 4: Scoring the Axes (15 Minutes)
  *Goal: Separate causal power from normative weight.*

  Score the omission on a scale of 1 (Low) to 5 (High).

  **Axis 1: Counterfactual Dependence (CD)**
  *   5: Death highly unlikely had act occurred (Prevention probability >90%).
  *   3: Prevention possible but not certain (Probability 40-90%).
  *   1: Act would likely not have altered outcome (Probability <40%).

  **Axis 2: Normative Salience (NS)**
  *   5: Core safety duty (e.g., suicide watch, welfare round).
  *   3: Administrative/Procedural duty with safety intent (e.g., risk assessment update).
  *   1: Record-keeping/Minor procedural norm (e.g., signing log).

  *Input Required:* **[E]** Clinician for CD (medical viability). **[E]** Governor/Lay Member for NS (operational priority).

  ### Step 5: Verdict Synthesis (15 Minutes)
  *Goal: Map scores to fixed verdicts.*

  | CD Score | NS Score | Verdict | Meaning |
  | :--- | :--- | :--- | :--- |
  | **4-5** | **4-5** | **Causal Omission** | The breach directly enabled the death. |
  | **4-5** | **1-3** | **Contributory Omission** | The act would have saved them, but the rule was minor/admin. |
  | **1-3** | **4-5** | **Procedural Breach (Non-Causal)** | Serious rule broken, but did not change the outcome. |
  | **1-3** | **1-3** | **No Causal Role** | Minor error, no impact on survival. |
  | **N/A** | **N/A** | **Not Assessable** | Record too thin to construct counterfactual. |

  **Chair Intervention Point [J]:** If the panel votes for *Causal Omission* but the evidence relies entirely on a systemic assumption not in the record (e.g., "Staffing levels made rounds impossible"), the Chair must record this as a **Systemic Judgment** separate from the causal verdict. The panel determines cause of death, not cause of system failure, though the two overlap.

  ---

  ## Part II: Case Applications

  ### Case 1: The Missed Round (At-Risk List)
  **Facts:** Deceased on at-risk list. Welfare round due 02:00. Not done. Body found 06:00. Clinician states death occurred 01:30. Last plausible intervention 22:00 (no duty to check then).

  **Procedure Run:**
  1.  **Duty/Description:** Duty to conduct 02:00 round exists. Description: "Failure to conduct physical welfare check." **[E]** Governor confirms duty was active.
  2.  **Counterfactual (Reasonable Agent):** If officer checks at 02:00, they find the body.
      *   *Clinician Input [E]:* Deceased was already beyond help at 02:00.
      *   *Chain:* Check -> Discovery -> Response.
      *   *Outcome:* Discovery does not equal Prevention.
      *   *CD Score:* 1 (Act would not have altered survival).
  3.  **Redundancy:** No parallel duty identified for 02:00 slot.
  4.  **Normative Salience:** Welfare rounds on at-risk list are core safety duties.
      *   *NS Score:* 5.
  5.  **Synthesis:** CD (1) + NS (5).
      *   **Verdict:** **Procedural Breach (Non-Causal)**.

  **Panel Friction:** The family will hear "Procedural Breach" and read "You broke the rule but it doesn't matter."
  **Chair Note:** The finding must explicitly state: "The breach did not cause the death, but it deprived the family of timely notification and the agency of the chance to confirm life." This acknowledges the harm of the omission without falsifying medical causation.

  ### Case 2: The Handoff (Suicide after Disclosure)
  **Facts:** Deceased disclosed prior attempt to Healthcare Escort (Agency A). Escort assumed Prison (Agency B) would log it. Prison assumed Escort would send medical notes. Neither did. Deceased suicide 48 hours later.

  **Procedure Run:**
  1.  **Duty/Description:**
      *   Agency A: Duty to transfer clinical risk info.
      *   Agency B: Duty to receive and log risk info.
      *   Description Audit: "Failure to transmit/receive risk disclosure."
  2.  **Counterfactual (Reasonable Agent):**
      *   If A transmits: B receives. Risk protocol triggers. Supervision increases.
      *   If B requests: A transmits. Risk protocol triggers.
      *   *Clinician Input [E]:* Increased supervision significantly reduces immediate suicide risk in this profile.
      *   *CD Score:* 4 (High probability of prevention).
  3.  **Redundancy Test:**
      *   This is a "Duplicate Prevention" scenario. Either agency acting breaks the chain.
      *   *Substantial Factor:* Is A's failure a cause? Yes, because if they acted, death prevented. Is B's failure a cause? Yes, because if they acted, death prevented.
      *   *Protocol:* Do not absolve one because the other failed. Both are necessary elements of the *actual* set of conditions that allowed death.
  4.  **Normative Salience:** Handover of suicide risk is a core safety duty.
      *   *NS Score:* 5 (Both agencies).
  5.  **Synthesis:** CD (4) + NS (5).
      *   **Verdict:** **Causal Omission** (Agency A).
      *   **Verdict:** **Causal Omission** (Agency B).

  **Panel Friction:** Agencies will argue "It wasn't just us."
  **Chair Note:** The verdict stands for both. The procedure explicitly rejects the "but-for" exclusivity in overdetermination cases. The recommendation must address the *interface* between agencies, not just individual failure.

  ### Case 3: The Stale Assessment (Risk Review)
  **Facts:** Deceased moved to cell-share. Observation regime removed. Risk assessment not updated to reflect new cell-share risk. Assessment 2 weeks stale. Deceased killed by cell-mate. No evidence anyone would have read the updated assessment before the move occurred.

  **Procedure Run:**
  1.  **Duty/Description:** Duty to update risk assessment upon regime change.
      *   Description: "Failure to update written risk profile."
  2.  **Counterfactual (Reasonable Agent):**
      *   Act: Assessment updated.
      *   Chain: Update -> [Gap] -> Someone reads it -> Someone halts move.
      *   *Evidence:* No evidence anyone reads assessments prior to moves in this unit.
      *   *Clinician/Governor Input [E]:* In this regime, assessments are often filed, not acted upon in real-time.
      *   *CD Score:* 2 (Speculative prevention).
  3.  **Redundancy:** No other safeguard identified.
  4.  **Normative Salience:** Risk assessments are central to custody safety policy.
      *   *NS Score:* 5.
  5.  **Synthesis:** CD (2) + NS (5).
      *   **Verdict:** **Procedural Breach (Non-Causal)**.

  **Panel Friction:** This is the answer the panel will not want to hear. A man died because a risk process was ignored, but the process itself was inert.
  **Chair Note:** To find *Causal Omission* here requires assuming a "Reasonable System" rather than a "Reasonable Agent." The procedure forbids this. The causation lies in the *culture of ignoring assessments*, not the *failure to write it*.
  **Action:** The verdict is "Procedural Breach," but the Policy Recommendation must be: "Risk assessments are non-causal if they are not integrated into movement orders. Stop producing them or mandate their reading." This exposes the futility of the norm without lying about the cause of death.

  ---

  ## Part III: Limitations and Honest Account

  This procedure stabilizes the panel's reasoning, but it cannot solve the metaphysical problems of omission. Here is what it cannot do:

  1.  **It Cannot Distinguish Blame from Cause in Public Discourse.**
      We can write "Procedural Breach (Non-Causal)" until we are blue in the face. The coroner, the press, and the family will read "Breach" and infer "Killer." The procedure protects our internal logic, not our external reputation. We must accept that our nuance will be flattened.

  2.  **It Cannot Fix the "Reasonable Agent" Fiction.**
      By mandating the Reasonable Agent standard, we assume a competence that the system may not possess. In Case 3, we assumed a reasonable officer *would* read the assessment. If the system is so broken that *no* officer reads assessments, our finding of "Non-Causal" is technically true but systemically dishonest. We identify the broken link, but we cannot identify the broken chain without exceeding our Terms of Reference.

  3.  **It Cannot Handle "Slow Death" Causation.**
      This procedure works for acute events (suicide, overdose, assault). It fails for deaths by neglect over months (e.g., untreated chronic illness). The "Grain Audit" fractures because the omission is a thousand tiny failures, none of which meet the "But-For" threshold individually. For these cases, the procedure will consistently return "Not Assessable," which is a failure of the tool, not the evidence.

  4.  **It Shifts Burden to the Chair.**
      The "Chair Intervention Point" is where the procedure admits it is a judgment. When the scores diverge (High NS, Low CD), the verdict is procedural, but the moral weight remains. I must write the narrative that explains why a high-salience breach did not cause death. That narrative is where the real work happens, not in the scoring matrix.

  5.  **It Cannot Compel Truth from Agencies.**
      The counterfactual relies on agency testimony ("We would have acted"). If they lie, the CD score is inflated. The procedure assumes good faith in the reconstruction of the counterfactual. In adversarial environments, this procedure becomes a game of constructing plausible fictions.

  **Final Instruction to Panel:**
  We are not here to fix the system. We are here to describe the break. If the break did not kill the deceased, we must say so, even if the system is rotten. To conflate the two is to lose the only credibility we have: accuracy. Use the procedure. Record the dissent. Sign the finding.
