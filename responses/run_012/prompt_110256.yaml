prompt: |-
  Ok so I've been going back and fourth on Pascal's mugging for like a decade and I want to finally pin down where my credence actually sits, so I'm going to make you do the decomposition instead of me.

  Here's the version I actually care about, because I think it's the one people dodge. Not the alley thing with the wallet. Instead: the mugger's demand is a small boring action — spend ten minutes a day for a year doing X, where X is whatever he names — and in exchange, with probability p he produces a payoff of N, where N is a number too big to write down in the observable universe and p is smaller than its reciprocal, and the product p·N is still enormous. Fine. But here's the kicker: he doesn't have to be a stranger in an alley. Any argument of the form do this small thing because there's a tiny chance of an astronomically large payoff has the same shape, and I actually take some of those seriously — AI risk, x-risk generally, maybe even donating to weird charities. So if I want a rule that tells me to blow off the guy in the alley, I need one that doesn't also tell me to blow off the arguments I believe. That's the whole problem, and I think it's why the usual answers feel like vibes.

  So: what's your credence that there's a principled decision rule that (a) tells you to ignore the mugger, (b) still tells you to take tiny-probability, huge-payoff existential-risk stuff seriously, and (c) is recognizably a form of expected utility maximization rather than a kludge bolted on to save the theory? Give me a number.

  Then decompose it. I want rough probabilities on the sub-questions it rides on, at least these: whether any plausible axiology actually needs unbounded, or effectively unbounded, utility in the first place; whether the right fix is to bound utility, to bound probability somehow (a complexity prior or whatever), or to say the mugger's claim is incoherent and not even a candidate for a credence; whether the instability objection bites, i.e. that for any mugger you can always imagine a bigger N at roughly the same p, so your action ranking ends up being a function of the largest number you happened to hear rather than anything about the world; and whether the same reasoning that discounts the mugger also discounts the real x-risk cases, which would make the whole thing self-undermining. Show me how those combine into your number and which one is doing the most work.

  Then tell me which sub-question you're least confident about and what evidence or argument would move it most.

  And please be calibrated about it: say how confident you are in the claims you're making and flag the single point you're least sure of. I'd rather have a number with a huge error bar on it than a hedge dressed up as an answer.
