answer: |-
  (1) "The confusion in the question"
  The confusion stems from assuming Mencius and Xunzi define "human nature" (*xing*) identically. You are treating "nature" as a fixed essence determining final outcomes, whereas both thinkers view it as a starting point requiring development. Your critique suggests Xunzi needs a "seed of goodness" for ritual to work, but this assumes moral transformation requires moral raw material. Similarly, you suggest Mencius's need for cultivation contradicts innate goodness, assuming "good" means "perfectly virtuous." In reality, neither thinker denies the necessity of education; they disagree on its relationship to our innate dispositions. The apparent instability arises from projecting a binary where "good nature" implies no effort needed, and "evil nature" implies no improvement possible. Both reject these extremes. They are not borrowing from each other but operating with divergent anthropological definitions that make their respective positions internally consistent within their own frameworks.

  (2) "What the distinction actually is"
  For Mencius, "nature" refers specifically to the moral sprouts (*duan*) distinguishing humans from beasts, such as compassion or shame. When he says nature is good, he means we possess an innate directional tendency toward virtue, not that we are finished sages. Cultivation is akin to farming: a seed is naturally grain, but it requires nurturing to reach fruition without being choked by weeds. Thus, effort preserves and expands what is already there. The need for years of cultivation acknowledges that these sprouts are fragile and easily lost to adverse environments, not that they are absent.

  Xunzi defines "nature" as raw biological desires—hunger, lust, envy—which inevitably cause conflict if unchecked. He calls this "evil" because it leads to social chaos, not because humans are demonically corrupted. Ritual works not because nature contains goodness, but because the human mind (*xin*) possesses cognitive plasticity and the capacity to learn. Xunzi's analogy of straightening wood does not require the wood to *want* to be straight, only to be physically *straightenable* through pressure and heat. Similarly, the mind can apprehend moral principles externally established by past sages and override innate desires through conscious accumulation (*wei*). For Xunzi, the mind acts as a ruler over the senses; it can authorize actions contrary to desire based on rational calculation of benefit and order. Xunzi posits that anyone can become a sage like Yu, not because they have sage-nature, but because they have the cognitive equipment to master ritual principles. The Sage created ritual not from nature, but from deep thought to cure nature's defects. Therefore, Xunzi does not need a moral seed; he requires only cognitive capacity and the ability to endure training. The distinction lies not in the need for cultivation, but in whether morality is an internal unfolding (Mencius) or an external reshaping (Xunzi).

  (3) "What remains genuinely contested"
  The genuine contest lies in the metaphysical source of value, not the practical necessity of education. Mencius grounds morality in Heaven (*Tian*), suggesting ethical norms align with the cosmic order and human essence. To follow ritual is to discover who you truly are. Xunzi severs this link; Heaven is naturalistic and indifferent, while ritual is a human invention designed to curb nature. To follow ritual is to overcome who you truly are. This creates a divergence in moral psychology: Mencius offers confidence in intuitive moral judgments, while Xunzi demands rigorous adherence to external standards and teachers. The debate is ultimately about whether virtue is a recovery of lost origin or a construction of civilization. Both agree people must study, but they disagree on whether studying reveals an inner truth or imposes an outer form. This distinction shapes their differing views on authority, tradition, and the role of the Sage in creating moral order.

  (4) "My confidence and least sure point"
  I am highly confident (90%) in this reading, as it aligns with the scholarly consensus in the field. The distinction between *xing* as moral potential versus biological instinct is the standard resolution to this paradox. The point I am least sure about is the extent of Xunzi's covert reliance on Mencian assumptions. Some scholars argue Xunzi's claim that anyone can become a Sage implies a latent capacity closer to Mencius's "sprouts" than he admits. It is unclear if his "cognitive capacity" is truly neutral or subtly moralized, which might reintroduce the instability you sensed. This ambiguity suggests the boundary between their positions may be more porous than Xunzi claims.
