      *   *Villains:* The film uses hunger to make them sympathetic but solves it with regime change, not welfare.

      *   *The "What the Film Sees":* The *tragedy* of existence. The literature wants to solve suffering; the film accepts it as the cost of *being*.

      *   *Screening:* Be precise. "Talk over them" implies pausing or intro/outro. I will suggest Intro/Outro for each clip.

