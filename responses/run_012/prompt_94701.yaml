      *(Self-Correction during drafting)*: Make sure to explicitly answer the "WAS critic reply" part for the four defenses. Don't just say "yes." Say "Yes, and here is the counter."
      *   *Necessity:* Film ignores it. Critic says: Necessity isn't justification.
