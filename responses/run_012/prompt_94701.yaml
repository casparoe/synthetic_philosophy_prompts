  5.  **Develop "What the Film Sees That Arguments Don't":**
      *   The *meaning* derived from the struggle. The WAS literature often focuses on negative utilitarianism (reduce suffering). The film focuses on the *narrative value* of the struggle.
      *   The connection between identity and ecological niche. Simba *is* a lion. To deny predation is to deny Simba. The film grasps the "teleological pull" of species-being that dry ethics often miss.
