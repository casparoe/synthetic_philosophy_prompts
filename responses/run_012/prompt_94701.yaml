answer: |-
  This is a sharp framework, and your hunches about the film's mechanics are largely correct. *The Lion King* is a feudal allegory draped in ecological clothing, and it collapses the moment you pull on the thread of actual wild animal suffering.

  Here is the breakdown of your four defenses, the specific sticking points you raised, where you might be over-reading, and what the film grasps that the literature often misses. Finally, I've outlined a 90-minute session plan.

  ### 1. Testing the Four Defenses

  You are right that the film leans heavily on **(2) Systemic** and **(4) Role/Stewardship**, uses **(3) Aesthetic** as atmosphere, and ignores **(1) Necessity**. Here is how the Wild Animal Suffering (WAS) critic replies to each within the context of the film:

  *   **(1) Necessity ("A lion's got to eat"):**
      *   **Film Usage:** Almost nil. As you noted, killing is elided. We see the chase, we see the panic, we never see the throat rip or the gutting. Mufasa tells Simba, "We eat the antelope," as if ordering from a menu.
      *   **WAS Reply:** The critic doesn't care about the lion's necessity; they care about the antelope's experience. By hiding the kill, the film avoids the moral cost. The reply here is straightforward: Necessity explains the behavior but does not justify the suffering. The film offers no rebuttal because it refuses to show the cost.
  *   **(2) Systemic ("Balance of Nature"):**
      *   **Film Usage:** This is the core argument. "Circle of Life" is explicitly ecological interdependence. Scar's sin is over-consumption (letting hyenas hunt unchecked), which leads to resource collapse.
      *   **WAS Reply:** This is the strongest point of friction. The film equates *ecological stability* with *moral goodness*. The WAS critic replies that a stable ecosystem can still be a slaughterhouse. A "balanced" pride lands still involves antelope dying terrified and cubs starving if the rains fail. The film argues that *sustainable* suffering is good; the critic argues that *sustainable* suffering is still suffering.
  *   **(3) Aesthetic ("Grander World"):**
      *   **Film Usage:** The opening sequence is pure sublimity. The music, the light, the procession. It argues viscerally that this world is magnificent.
      *   **WAS Reply:** The critic asks: "Magnificent to whom?" The aesthetics are viewed from the sky (God's eye) or the rock (King's eye), never from the grass (Prey's eye). The film relies on the audience accepting the predator's perspective as the universal one.
  *   **(4) Role/Stewardship ("King's Duty"):**
      *   **Film Usage:** Mufasa's "A king's time as ruler rises and falls like the sun." This is feudal stewardship. The lion protects the prey *so that he may eat them later*.
      *   **WAS Reply:** This is a category error. Lions do not have duties; they have instincts. By anthropomorphizing the lion into a monarch, the film imbues predation with *purpose*. The critic replies that nature has no stations. Imposing a "duty to rule" is a human projection used to sanitize violence.

  ### 2. The Sticking Points

  **Resource Management vs. Welfare**
  You are correct: the film has no concept of individual welfare, only population viability. The "good" order is one where there are *enough* antelope to sustain the lions, not where the antelope have *good lives*.
  *   **The Critic's Move:** Point out that Mufasa's stewardship is essentially livestock management. He protects the herd from the hyenas (competitors) to preserve them for the lions (owners). The WAS critic sees this as a cartel, not a covenant.

  **Demography and Mortality**
  This is the film's biggest lie. As you noted, it's a low-mortality cycle.
  *   **Emotional Force:** If you restore the real numbers, the film breaks. If Simba had six siblings and five died of disease or starvation before adolescence, his "destiny" means less. If the herd loses 30% of its calves every season to natural causes (not just lions), the "Circle of Life" looks less like a harmonious ring and more like a meat grinder. The emotional force rests entirely on the fantasy that death is an exception caused by *villains* (Scar), not the *rule* caused by nature.
  *   **Verdict:** The film is not moving if you restore the real numbers; it becomes a horror story. It relies on the "exceptional individual" narrative which is incompatible with r-selected reality.

  **Interiority Asymmetry**
  Predators = Persons. Prey = Scenery/Fuel.
  *   **The Stampede:** You noted the prey kill the good king. This is crucial. When the antelope act as a body, they are a force of destruction. They have no faces. This dehumanization (de-animalization?) is required for the audience to accept their consumption. If the antelope had names and dialogue, Simba eating them would be cannibalism.
  *   **Verdict:** The film *requires* this asymmetry to function. It cannot grant interiority to the prey without collapsing the moral hierarchy.

  **Hakuna Matata and the Food Chain**
  *   **The Concession:** Timon and Pumbaa live on grubs. They are effectively vegans/scavengers. Simba thrives there. This *does* concede the critic's point that a life without predation is possible and happy.
  *   **The Reversal:** But the film frames this as arrested development. "Hakuna Matata" is a philosophy of no responsibility. Returning to Pride Rock is returning to meat, but it's framed as "growing up."
  *   **Verdict:** The film argues that a life without violence is a life without *meaning*. Simba can be happy without killing, but he cannot be *Simba* (King, Son, Lion) without it.

  **The Villains' Motivation**
  *   **Hunger:** Scar and the hyenas are motivated by exclusion and hunger. Scar gets scraps; the hyenas are starving.
  *   **Does the film know?** It uses it as a motive, not a thesis. The film acknowledges that suffering exists (the hyenas are suffering), but its solution is not to alleviate the suffering through welfare; it is to restore the hierarchy that caused the exclusion.
  *   **Verdict:** The film identifies the symptom (hunger causes chaos) but misdiagnoses the cure. The WAS critic says: Feed the hyenas without killing the antelope. The film says: Put the right Lion on the rock so the hyenas know their place.

  ### 3. Where You Might Be Over-Reading

  Be careful not to grant the film too much philosophical coherence regarding **Hakuna Matata**.
  *   **The Trap:** It is tempting to read Timon and Pumbaa as a genuine ethical alternative (a pacifist commune).
  *   **The Reality:** They are comic relief. Their philosophy is hedonism, not ethics. They don't avoid meat because it's wrong; they avoid it because they are small and eat bugs. When Simba leaves them, the film doesn't mourn the loss of their ethics; it mourns the loss of his childhood. Don't let the reading suggest the film takes their lifestyle as a serious political alternative. It treats it as a vacation.

  Also, on the **Villains' Hunger**: Don't assume the film is making a structural critique of resource distribution. Scar isn't a revolutionary; he's a usurper. He doesn't want to fix the food chain; he wants to be at the top of it. The hyenas' hunger is a tool to make them disposable minions, not a plea for wild animal welfare.

  ### 4. What the Film Sees That the Arguments Don't

  This is the place to end the theoretical critique and acknowledge the film's affective power. The WAS literature often struggles with the **value of wildness**.

  *   **The Loss of the Subject:** The literature often proposes interventions to reduce suffering (pest control, vaccination, even phasing out predators). The film grasps intuitively that if you remove the predation, you remove the *lion*.
  *   **Identity and Niche:** Simba's struggle is about accepting what he *is*. To ask him not to hunt is to ask him not to be a lion. The film captures the **teleological pull** of species-being. There is a tragedy in the fact that the lion's flourishing requires the antelope's suffering. The literature often treats this as a math problem to be solved; the film treats it as a tragic condition of existence.
  *   **The Ambivalence:** The film leans toward **Order over Welfare**. It admits the cost (the gorge, the death of Mufasa), but argues that a world without the "King" (the ordering principle of nature) is worse (Scar's barren wasteland).
  *   **The Scene that Does the Leaning:** The moment Simba roars at the end. It is a claim of dominance. It is beautiful and terrifying. The film sees that we admire the lion *because* of its power, which is inextricable from its violence. The literature asks us to pity the victim; the film asks us to respect the agent. Both are necessary, but the film holds the latter in a way papers often cannot.

  ### 5. Practical Session Plan (90 Minutes)

  **Goal:** 20 minutes of footage, 70 minutes of discussion. Do not play the film straight through. Play a clip, pause, discuss, play next clip.

  **Clip 1: The Thesis (00:00 – 04:00)**
  *   **Content:** *Circle of Life* opening sequence. Sunrise, animals gathering, presentation of Simba.
  *   **Talk Over/Intro:** Ask the group to watch for the "gaze." Who is looking at whom? Where is the suffering in this sublime image?
  *   **Discussion Point (10 mins):** The Aesthetic and Systemic defenses. Does the beauty of the sequence justify the system it depicts? Is "Balance" visible here, or is it just order?

  **Clip 2: The Stewardship (21:00 – 24:00)**
  *   **Content:** Mufasa and Simba on the ridge. "Let me explain how things work... We eat the antelope... When we die, our bodies become the grass."
  *   **Talk Over/Intro:** Focus on Mufasa's explanation of death. It is sanitized, nutrient-cycle death.
  *   **Discussion Point (15 mins):** The "Livestock Management" critique. Mufasa describes a closed loop where everyone is food eventually. How does this obscure the violence of the immediate kill? Compare this to the WAS view of "bad deaths" (starvation, predation).

  **Clip 3: The Exit (48:00 – 52:00)**
  *   **Content:** *Hakuna Matata* sequence. Simba growing up, eating bugs, no worries.
  *   **Talk Over/Intro:** Watch Simba's physical development. He is healthy without meat.
  *   **Discussion Point (15 mins):** The "Good Life" without predation. Why does the film treat this as a hiatus rather than a solution? If Simba can thrive on bugs, is the "King" role necessary? (Push back: He isn't thriving as a *Lion King*, just as a survivor).

  **Clip 4: The Restoration (85:00 – 90:00)**
  *   **Content:** Simba returns, fights Scar, rain falls, Pride Lands green up. The final roar.
  *   **Talk Over/Intro:** Watch the rain. It signifies the return of the "correct" order.
  *   **Discussion Point (20 mins):** The Resolution. The land heals because the *right predator* is in charge, not because predation stopped.
  *   **Final Synthesis (10 mins):** Bring it to the "What the Film Sees" point. Acknowledge the WAS critique (this is still a system of suffering), but ask: Does the film capture something about *identity* and *wildness* that the utilitarian calculus misses? Is there a loss in a world without the roar, even if it's a gain for the antelope?

  **Logistics Note:**
  Ensure your timestamps are checked against your specific copy (DVD vs. Streaming often vary slightly). Give the group permission to be uncomfortable with the ending. The goal isn't to solve WAS, but to see how culture narrativizes it to make it bearable.
