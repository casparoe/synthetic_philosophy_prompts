answer: |-
  **Specification of Adequacy for Accounts of Intention and Neural Preparation**

  **1. Phenomenal and Empirical Accommodation**
  An adequate theory must integrate the following four data points without dismissing any as illusory:
  *   **The Temporal Gap:** It must explain the lag between the onset of the readiness potential (RP) and the subject's reported awareness of the urge (W-time) without rendering consciousness a causally inert epiphenomenon or the neural data a mere correlate with no functional role.
  *   **The Veto Capacity:** It must identify a neural and phenomenological mechanism for "free won't"—the ability to cancel an incipient movement after the RP has begun but before execution—and specify whether this cancellation requires a new neural signal or merely the absence of a threshold crossing.
  *   **Introspective Latency:** It must treat the subject's report of intention timing as fallible data subject to neural processing delays, rather than as a privileged timestamp against which neural data is judged.
  *   **The Stochastic Nature of the RP:** It must remain robust if the averaged RP is shown to be an artifact of filtering that masks a stochastic accumulation of noise, rather than a specific, deterministic motor command.

  **2. Conceptual Distinctions**
  The account must rigorously maintain the following separations:
  *   **Prediction vs. Constitution:** The ability of neural data to predict a movement statistically does not entail that the neural activity *constitutes* the decision itself.
  *   **Neural Onset vs. Intentional Onset:** The time at which neural preparation becomes detectable is not identical to the time at which the intention exists as a psychological state; conflation here is a category error.
  *   **Negative vs. Positive Freedom:** Freedom as the absence of external coercion (compatibilist) must not be smuggled in as evidence for freedom as ultimate, uncaused authorship (libertarian).
  *   **Cause vs. Reason:** Physiological causes (ion channels, membrane potentials) must be distinguished from rational reasons (goals, beliefs); explaining the former does not automatically invalidate the latter.

  **3. Empirical Constraints**
  No theory may contradict the following physical and methodological limits:
  *   **The Single-Trial Limit:** A theory cannot claim deterministic prediction for individual actions based on data that only yields significance through averaging across trials.
  *   **The Report-as-Behavior Constraint:** The subject's verbal or motor report of their intention is itself a behavior with its own neural latency and preparation, creating a regression problem that must be acknowledged.

  **4. Critical Evaluation of Requirements**

  *   **Genuine Desiderata vs. Camp Prejudices:**
      *   *Desiderata:* Accommodating the veto capacity and the single-trial limit are genuine requirements for empirical fidelity.
      *   *Prejudices:* The demand that consciousness *must* initiate the chain is a libertarian prejudice; the demand that the RP *must* be the sole cause is a hard-determinist prejudice. Both must be discarded in favor of a model that allows for interaction or parallel processing.

  *   **Incompatible Pairs:**
      *   **Infallible Introspection and Neural Causal Closure:** You cannot jointly satisfy the claim that the subject's reported time of intention is objectively accurate *and* the claim that prior neural activity is causally sufficient for the action. One must yield; given the report-as-behavior constraint, introspective infallibility must be the casualty.

  *   **The Most Eliminative Requirement:**
      *   **The Single-Trial Limit:** This requirement eliminates the most candidate theories. It dismantles hard determinist claims that the RP *forces* the action, and it simultaneously dismantles libertarian claims that conscious will *overrides* the RP on a trial-by-trial basis, as neither is supported by the signal-to-noise ratio of the actual data.

  Bottom line: No theory is adequate that conflates the statistical properties of averaged neural data with the causal determinants of single-trial behavior.
