answer: |-
  Dear Colleague,

  It is a pleasure to hear about your seminar, and the goal you have set for this session is both ambitious and precisely where the philosophy of biology becomes most vital for undergraduates. You want them to feel the friction of anti-essentialism without being told about it beforehand, and to do this in seventy-five minutes with fifteen students requires a tightly scripted activity that functions as a trap they spring on themselves. I suggest an exercise I call The Boundary Committee, which treats the students as a regulatory board tasked with classifying entities for a hypothetical astrobiology grant, forcing them into binary choices that later reveal their own inconsistencies. You will need a whiteboard, a set of printed cards for each student with the list of cases, and a timer. The cases you proposed are largely excellent, though I would recommend swapping the organism engineered to metabolize but never reproduce for a mitochondrion, as the engineered organism is too conceptually close to the sterile mule and both primarily test the reproduction criterion, whereas a mitochondrion tests the boundary of individuation and whether life must be an independent organism or can be a dependent organelle, adding a necessary dimension to the discussion. Your final list should be the virus, the prion, the sterile mule, the frozen seed, fire, the self-replicating computer program, and the mitochondrion.

  The session begins without any lecture or framing about essence or definitions; you simply tell the students they are the Committee on Life and their task is to determine eligibility for a life-detection grant by voting alive or not alive on each item. You must insist on a binary verdict for each case, forbidding answers like kind of or it depends, which is the first place the tension will arise and must be strictly enforced by you. Spend the first five minutes explaining the rules and handing out the materials, then allocate thirty minutes for the deliberation and voting, allowing roughly four minutes per case. For each item, give them one minute to think silently, then open the floor for two minutes of debate, and finally take a public show of hands where every student must commit to a verdict. You will record the majority verdict on the board for each case. It is crucial that you do not explain why they are voting or hint that there is a trick; the authority of the verdict must seem to rest on their collective intuition. As they debate, you will hear them reach for criteria like metabolism or reproduction, but you must refuse to validate any criterion as the rule, simply recording the final alive or dead status.

  Once all seven verdicts are on the board, spend the next ten minutes on the reveal, which is the mechanical heart of the activity. Ask the group to articulate the single necessary and sufficient condition that explains their pattern of votes. They will likely propose something like life requires metabolism and reproduction. You will then point to the sterile mule, which they likely voted alive despite lacking reproduction, and the fire, which they likely voted not alive despite having metabolism and growth. If they voted the virus as dead, point out that it evolves, which they might have implicitly accepted as a sign of life in other contexts. The goal here is to show them that their collective verdicts do not map onto any single consistent rule. To make the commitment bite, tell them that to award the grant, they must sign a charter defining life based on their votes, and ask them to draft that definition. When they fail to produce one that fits all seven cases without contradiction, ask them which case they would sacrifice to save the definition. This forces them to realize that keeping the definition consistent requires excluding something they intuitively feel is alive, or including something they feel is not, and that this choice is stipulative rather than factual.

  The remaining thirty minutes are for the debrief, where you map their experience onto the philosophical concepts you withheld. Begin by explaining that their struggle to find a single rule demonstrates the failure of definition by necessary and sufficient conditions, the classical essentialist view they just tried and failed to apply. Introduce the idea of family resemblance here, suggesting that the things they voted alive share overlapping features like a rope made of twisted fibers rather than a single core thread, which explains why the mule is alive despite lacking reproduction and the virus is borderline despite lacking metabolism. Then move to the more radical point about conceptual engineering, asking them whether life is a concept we discover in nature or a tool we build for specific purposes, such as legal liability or astrobiology. Use their hesitation to sacrifice a case to show that their intuitions are tied to human interests rather than mind-independent facts. This is where you supply the theoretical framework that the activity cannot generate on its own; the activity produces confusion and aporia, but only you can provide the vocabulary to understand that confusion as a philosophical feature rather than a failure of their reasoning.

  There are predictable ways this can go wrong that you must be ready to handle. The most common issue is that students will resist the binary constraint, insisting that life is a spectrum, which is technically the correct philosophical conclusion but defeats the purpose of the exercise if raised too early. You must acknowledge their point but insist that the grant committee requires a yes or no for budgetary reasons, forcing them to operationalize their vagueness. Another risk is that a dominant voice will dictate the verdicts, preventing the group from feeling the collective commitment; to mitigate this, you can have them write their votes on paper first before showing hands, or call on quiet students to justify their positions. You must also be careful not to let the debate on any single case run too long, or you will run out of time for the debrief, which is where the learning is consolidated. If they get stuck on the virus, which is likely, remind them that a verdict is required even if uncertain.

  Finally, I must be honest about the limitation of this activity. It successfully reproduces the feeling of inconsistency and the failure of essentialism, but it cannot reproduce the philosophical justification for why essentialism fails or why family resemblance is a viable alternative. The activity creates the problem, but it does not solve it, and it cannot explain why the lack of an essence does not mean anything goes. You will have to supply the argument that the absence of a boundary does not mean there are no clear cases, and that the flexibility of the concept is a feature of its utility rather than a defect of our knowledge. You must also supply the historical context, perhaps mentioning Wittgenstein or Hull, to show them that this is a recognized philosophical position and not just a seminar game. Without your intervention in the debrief to frame their frustration as a specific philosophical insight about natural kinds versus functional kinds, the activity risks leaving them simply annoyed that they could not define life. Your role is to validate their confusion as the correct response to the world, transforming their inability to vote consistently from a failure of logic into a discovery about the nature of biological concepts. I hope this structure serves your seminar well, and I would be eager to hear how the committee deliberates.
