answer: |-
  This is a fascinating pedagogical puzzle. Your professor is clearly staging a rigorous exegesis of *Politics* Book I (specifically chapters 8–10), likely alongside *Nicomachean Ethics* Book V on justice in exchange. He is forcing you to distinguish between *oikonomia* (household management, acquisition for use) and *chrēmatistikē* (wealth-getting, acquisition for accumulation).

  The tension you are feeling is genuine because Aristotle's text itself contains a "borderline zone" regarding artisans and market sellers. Your professor is refusing to rule on the cousin because she occupies that exact borderline.

  Here is a breakdown of the candidate rules, their predictions, and my assessment of how he will likely rule.

  ### 1. Candidate Rules

  Based on the six cases you've recorded, we can distill three competing hermeneutic principles. All three fit the data so far, but they diverge on the cousin.

  **Rule A: The Teleological Limit (The "End Goal" Rule)**
  *   **Principle:** An exchange is **natural** if the ultimate end (*telos*) is the satisfaction of a household need (*oikonomia*). It is **unnatural** if the end is the accumulation of money or profit for its own sake (*chrēmatistikē* in the pejorative sense).
  *   **Evidence:**
      *   *Support:* Case 2 (coins) is natural because the coin is a means to buy a needed good, not an end. Case 5 (usury) is the worst because money breeding money has no limit.
      *   *Support:* Case 4 (grain merchant) is unnatural because the goal is the price difference, not the grain itself.
  *   **Key Indicator:** Does the activity stop when the need is met, or does it continue indefinitely?

  **Rule B: The Ontological Source (The "Labor/Value-Add" Rule)**
  *   **Principle:** An exchange is **natural** if the seller is transferring the product of their own land or craft (*technē*). It is **unnatural** if the profit comes merely from transferring ownership of a good one did not produce or improve.
  *   **Evidence:**
      *   *Support:* Case 3 (wool/weaver) is natural because "each of them is putting their own craft into the exchange."
      *   *Support:* Case 4 (grain merchant) is unnatural because he "done nothing to the grain." Case 6 (olive presses) is unnatural because gain comes from "position rather than from anything he did."
  *   **Key Indicator:** Did the seller create the value, or did they merely capture it?

  **Rule C: The Social Embeddedness (The "Community" Rule)**
  *   **Principle:** An exchange is **natural** if it occurs within a web of known relationships or direct reciprocity. It is **unnatural** if it is anonymous, impersonal, or exploits a lack of community bond.
  *   **Evidence:**
      *   *Support:* Case 1 (neighbors) and Case 3 (woman/weaver) involve known parties.
      *   *Support:* Case 4 (villagers/city) and Case 5 (farmers he's never met) are explicitly criticized for the lack of bond ("nobody in the deal is bound to anybody").
  *   **Key Indicator:** Are the parties neighbors/citizens, or strangers/market counterparts?

  ---

  ### 2. Predictions for the Cousin

  Here is how each rule applies to the cousin who bakes bread in her kitchen and sells it at the city market for the family's whole income.

  *   **Under Rule A (Teleological Limit):** **Unnatural.**
      *   *Reasoning:* She is not baking to feed her own household (which would be *oikonomia*). She is baking to sell for money, which is then used for income. The *telos* of the activity is the money (the price the stall can get), not the bread itself. Since it is the "whole income," the activity is potentially unlimited—if she can sell more, she will bake more. This fits the definition of *kapēlikē* (retail trade) which Aristotle condemns as unnatural wealth-getting.
  *   **Under Rule B (Ontological Source):** **Natural.**
      *   *Reasoning:* She is baking the bread herself. Unlike the grain merchant who bought and sold, she is applying her *technē* (craft) to raw materials. This looks exactly like Case 3 (the woman with the wool), except the medium of exchange is coins rather than barter. Since the professor allowed coins in Case 2, her labor should make this natural.
  *   **Under Rule C (Social Embeddedness):** **Unnatural.**
      *   *Reasoning:* She sells to "whoever walks up" at "whatever price." This is the definition of an anonymous market. There is no specific bond between her and the buyers; it is purely transactional. This lacks the reciprocity of the neighbors in Case 1.

  ---

  ### 3. My Best Guess

  **Verdict:** The professor will rule the case **Unnatural**.

  **Reasoning:**
  While Rule B (Labor) is tempting (and your friend is right to spot the similarity to the weaver), Rule A (Teleological Limit) is the dominant engine in Aristotle's *Politics* I.8–10.

  The crucial detail in your prompt is that this is the **"family's whole income."**
  In Case 3 (the woman with the wool), the text specifies she brought her **"spare wool."** That is the critical distinction. Selling surplus from the household (*oikos*) to meet a specific need is natural wealth-getting (a part of *oikonomia*). Producing goods *for the purpose of selling them* to generate income is retail trade (*kapēlikē*), which Aristotle classifies as unnatural *chrēmatistikē*.

  The professor's hesitation confirms this. If the rule were simply "did she make it?", he would have ruled immediately (Natural). If the rule were simply "is it for money?", he would have ruled immediately (Unnatural, like the grain merchant). The fact that he paused means he is weighing **Surplus vs. Production.**

  He will likely argue that by making the market her provider, she has inverted the proper order. The household should be self-sufficient (*autarkeia*); the market should only be used to rectify specific deficits (like Case 2). By depending on the market for her *whole* livelihood, she has made the household subordinate to the market, which is the hallmark of the "unnatural" life.

  Furthermore, his comment on Case 4 ("gain comes from the exchange and not from the good") applies here too. Even though she made the bread, her *gain* is realized only in the exchange. If she baked it and ate it, there would be no gain, only sustenance. The profit motive renders the craft instrumental to wealth, not to life.

  ---

  ### 4. The Decisive Test Case

  To distinguish between Rule A (Teleology/Income) and Rule B (Labor) definitively, you need to isolate the variable of **Surplus vs. Intentional Production.**

  **The Question to Ask:**
  > "Professor, consider a farmer who plants enough grain to feed his family, but intentionally plants an *extra* field specifically to sell at the market for coins. He does the labor himself. Is this natural or unnatural?"

  **Why this settles it:**
  *   **If he says Natural:** He is prioritizing **Rule B (Labor)**. The fact that the farmer did the work makes it natural, even if the intent was market sale. This would suggest the Cousin might also be Natural.
  *   **If he says Unnatural:** He is prioritizing **Rule A (Teleology/Limit)**. The intent was exchange, not household use. This confirms the Cousin is Unnatural because her baking is for income, not subsistence.
  *   **Nuance:** If he says "Natural if he sells only the surplus, Unnatural if he plants *for* the market," he is confirming the **Surplus Distinction** I predicted above.

  ---

  ### 5. Is There a Consistent Rule?

  You asked if you are wrong to assume there is one consistent rule. **You are not wrong.**

  This professor is not free-associating. He is performing a very strict, somewhat rigid, but textually faithful reconstruction of Aristotle's argument in *Politics* 1256a–1258b. The "shtick" you perceive is actually him enforcing the Aristotelian distinction between:
  1.  **Natural Wealth-Getting:** Acquiring goods from nature (farming, herding) or exchanging surplus for needs. Limited by the needs of the *oikos*.
  2.  **Unnatural Wealth-Getting:** Retail trade (*kapēlikē*) and Usury (*tokismos*). Unlimited, aimed at coin accumulation, detached from the good's use.

  The reason it feels like a puzzle is that Aristotle himself struggles with the "artisan" class. But your professor has resolved that struggle by drawing a hard line at **dependency.** If the household depends on the market for its existence (the Cousin), it is unnatural. If the market depends on the household's surplus (the Woman with Wool), it is natural.

  **Summary for your notes:**
  Watch for the word **"Surplus."** If the professor uses it to defend the Cousin, your friend wins (Rule B). If he uses it to condemn her (i.e., "She is not selling surplus, she is selling *production*"), you win (Rule A). My money is on the latter.
