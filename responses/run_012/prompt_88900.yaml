      *   Aristotle's text (*Politics* 1256a-1258b) emphasizes the *limit* imposed by the household (*oikos*). However, he also condemns *kapēlikē* (retail trade) even when it involves goods.
      *   The Professor's ruling on Case 2 (coins) is key. He allowed money *if* it was a means to an end (need).
      *   The Professor's ruling on Case 4 (grain merchant) condemns gaining from exchange *itself*.
