answer: |-
  **MEMORANDUM**

  **TO:** National Wellbeing Board
  **FROM:** Chair, Technical Advisory Panel, National Statistical Office
  **DATE:** 24 October 2023
  **SUBJECT:** Advice on the Adoption of the World Happiness Report Ranking as a Budget Indicator

  **Executive Summary**

  This memo provides technical advice regarding the proposal to adopt the World Happiness Report (WHR) ranking as a headline budget indicator, with a target of placing Norvik in the top ten by 2035. While the ambition to prioritise national wellbeing is commendable, the Technical Advisory Panel recommends against adopting the WHR ranking for budgetary accountability. Instead, we advise retaining a wellbeing target measured via our domestic National Wellbeing Barometer. The WHR ranking suffers from statistical volatility, methodological inconsistencies, and a divergent trend compared to domestic data, making it unsuitable for high-stakes policy appraisal.

  **The Nature of the Ranking**

  The WHR ranking is derived solely from the Cantril Ladder, a single question asking respondents to evaluate their current life on a scale of 0 to 10. It does not incorporate the six explanatory variables often cited alongside it, such as GDP or healthy life expectancy. The score is based on a sample of approximately 1,000 respondents per country per year, smoothed using a three-year rolling average.

  While this metric offers a useful snapshot of subjective evaluation, it is not designed for granular policy tracking. The sample size is significantly smaller than our National Wellbeing Barometer, which surveys 4,000 respondents quarterly. Furthermore, the WHR relies on cross-national comparability that is difficult to guarantee. For instance, in Norvik, the translation of the ladder's top anchor in our minority official language implies a life one was "meant to have," rather than the best imaginable life. This linguistic nuance inflates scores for minority-language respondents by 0.3 points compared to matched majority-language speakers. As demographic shifts occur, this artefact could mimic wellbeing growth where none exists.

  **Statistical Robustness and Divergence**

  A critical concern is the divergence between international and domestic trends. Since 2020, Norvik's position in the WHR ranking has risen by fourteen places. However, our domestic Barometer shows life satisfaction has been essentially flat over the same period, with scores in the bottom income quintile actually falling.

  This discrepancy suggests the international rise may be driven by statistical noise or methodological factors rather than genuine improvements in citizen welfare. If the government adopts the WHR ranking as a budget headline, it risks tying fiscal accountability to a metric that does not reflect the lived reality of our most vulnerable citizens. A target based on the WHR could be met even if inequality widens and the poorest suffer, provided the national average is buoyed by external factors or survey artefacts.

  Moreover, the precision of the ranking is limited. Norvik currently sits within 0.15 points of eight other countries. The confidence interval around our rank spans approximately six places. Consequently, moving into the top ten may depend as much on statistical volatility in other nations as on domestic policy success. A target defined by such margins risks becoming a lottery rather than a measure of governance.

  **Integrity and Incentives**

  The Panel must highlight the risks associated with the leaked consultancy note suggesting that survey logistics—such as gratitude framing or changing fieldwork modes in specific regions—could shift the average by 0.1 to 0.2 points. While presented as reputational management, adopting the WHR score as a formal budget target creates a perverse incentive to utilise such tactics.

  The Finance Ministry currently appraises major policies using wellbeing-adjusted life years, valuing a one-point change in life satisfaction sustained for one year. If the underlying data can be manipulated through survey design rather than genuine policy impact, the integrity of the entire fiscal appraisal system is compromised. The National Statistical Office cannot endorse an indicator that invites methodological gaming to meet political targets.

  **The Case for the Target**

  It is important to acknowledge the strength of the government's position. Establishing a clear, ambitious target like the top ten provides a powerful focal point for inter-ministerial cooperation. It signals to the public that wellbeing is valued equally with economic growth. The simplicity of the ranking aids communication; citizens understand ranks better than regression coefficients. Abandoning the target entirely could be perceived as a lack of commitment to the wellbeing agenda. The ambition itself drives focus, and the international benchmarking offers a sense of competitive prestige that motivates civil servants.

  **Recommendation**

  Balancing the need for ambition with statistical integrity, the Panel recommends the following course of action:

  1.  **Do not adopt the WHR ranking as a headline budget indicator.** The volatility, translation biases, and divergence from domestic data make it unfit for fiscal accountability.
  2.  **Adopt a domestic wellbeing target.** Utilise the National Wellbeing Barometer as the primary instrument. It offers larger sample sizes, higher frequency, and better distributional data.
  3.  **Reframe the 2035 ambition.** Instead of a specific rank, set a target for the domestic life satisfaction score, with a specific sub-target to reverse the decline in the bottom income quintile. This aligns with the Finance Ministry's valuation model while ensuring policy addresses inequality.

  **Communicating Uncertainty**

  Ministers will need to explain why we are not using the international rank without appearing to make excuses for potential failure. The messaging should focus on precision and responsibility. Ministers might state:

  *"We are committed to being among the happiest nations, but we refuse to gamble our national strategy on a statistical margin of error. The international ranking has a uncertainty range of six places; governing based on that is like steering a ship by a compass that spins in the wind. We are choosing a more precise, domestic measure that allows us to track progress quarterly and ensure that improvements are felt by every income group, not just hidden in an average."*

  This framing positions the decision as one of rigorous stewardship rather than risk aversion. It emphasises that the government cares more about actual wellbeing than international league tables.

  **Conclusion**

  The commitment to improve national wellbeing is sound, but the instrument proposed is flawed. By shifting focus to the National Wellbeing Barometer, the Board can maintain the ambition of the 2035 target while ensuring that policy is driven by robust, equitable, and manipulatio-resistant data. This approach protects the integrity of the statistical system and ensures that the Finance Ministry's wellbeing valuations reflect genuine changes in citizens' lives.

  The Panel stands ready to assist in modelling the specific domestic targets required to match the ambition of the original proposal.
