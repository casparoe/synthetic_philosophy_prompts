      *   *Policy:* If diversion is functional, what do practitioners do? Stop fighting it? (Practitioner attack).
      *   *Weberian Ideal:* Is impersonality actually the goal, or is it a proxy for state capacity?
      *   *Harm:* Does diversion *actually* provide welfare, or does it just entrench inequality?

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The Micro Econ Attack):* "Where's the data?" They care about identification. If you can't measure the difference, the claim is just storytelling.
          *   *Phrasing:* "Identification strategy," "Measurement error," "Endogeneity."
