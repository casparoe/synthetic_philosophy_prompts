      *   **Audience:** Mixed.
          *   *Bloc A:* Applied micro/political economy (RCTs, audits, identification strategies).
          *   *Bloc B:* Anthropologists/Area Specialists (fieldwork, skeptical of Western standards, suspicious of functionalism).
