answer: |-
  This is a high-wire act. You are effectively telling the economists their measures are noise, telling the anthropologists their favorite critique is still too functionalist, and telling the practitioners their job is morally ambiguous. You will be attacked from all three flanks.

  Here is your Q&A prep sheet, ordered by likelihood and potential damage.

  ### 1. The "Identification" Attack (Applied Micro / Pol-Econ)
  **Likelihood:** Very High | **Damage:** High (Undermines empirical basis)
  **The Phrasing:** "This is a compelling narrative, but it's not a model. If Extraction and Diversion are bundled in the CPI [Corruption Perceptions Index] and in the audit data we use, how do you identify them separately? Without a distinct measure, you can't estimate the differential welfare effects. Aren't you just asserting a correlation between 'impersonality' and 'harm' without an identification strategy?"

  **Your 2-Minute Reply:**
  "You're right, and I want to be clear: I am not claiming the current data can separate these. That's actually part of my point—the data is blind to the distinction. But we *can* proxy it. We don't need to solve identification today to see the bias. We can look at kinship density maps against procurement single-bidder rates, or compare bribe frequency (extraction) vs. contract steering (diversion) in household surveys. My claim isn't that we have the dataset yet; it's that the *assumption* that the current indices measure a unitary 'corruption' variable is causing specification error in your models. If you treat a welfare payment to a cousin the same as a predatory bribe from a stranger, your beta coefficients on 'governance' are going to be biased. I'm asking for a measurement chapter, not rejecting the econ."

  **Honest Note on Soft Spot:**
  You don't actually have the dataset. If they press you on *which* existing survey allows this split, you will stumble. You are betting on future data to validate a current critique.

  ### 2. The "Romanticizing Patronage" Attack (Anthropologists / Area Specialists)
  **Likelihood:** High | **Damage:** Medium (Undermines moral authority)
  **The Phrasing:** "You're critiquing Western parochialism, but then you describe diversion as a 'functioning welfare system.' That's a functionalist trap. You're ignoring the power asymmetries *within* the kin group. The 'cousin' who gets the contract might be a junior partner in a hierarchical extraction scheme that excludes women, lower castes, or religious minorities. By calling it 'welfare,' aren't you just laundering local elite capture as 'thick obligation'?"

  **Your 2-Minute Reply:**
  "That is a crucial correction, and I accept the risk of functionalism. I am not arguing diversion is *good* or egalitarian. I am arguing it is *structurally different* from extraction. Extraction is a leak out of the system; diversion is a circulation within a specific network. Yes, that network can be exclusionary. But in contexts where the state provides zero safety net, that exclusionary network is still the only thing preventing starvation for its members. My point isn't to romanticize the patron, but to note that dismantling the patronage network without replacing the welfare function creates a vacuum that extraction fills. And extraction is universally predatory."

  **Honest Note on Soft Spot:**
  Anthropologists hate "vacuum" arguments (nature abhors a vacuum, society abhors a vacuum). It sounds like you're saying "bad institutions are better than no institutions." Be prepared for them to push back on the idea that the "state" and the "network" are separate things that can be swapped in and out.

  ### 3. The "Monday Morning" Attack (Practitioners / NGO / Officials)
  **Likelihood:** Medium | **Damage:** High (Makes the talk irrelevant to policy)
  **The Phrasing:** "Okay, let's say you're right. I'm a procurement officer. I see a contract going to a minister's nephew. Under your framework, that's 'diversion.' Do you want me to approve it? Because if I write a policy that says 'allow some nepotism,' I get fired or I enable graft. What is the actionable takeaway here? Do we stop fighting corruption?"

  **Your 2-Minute Reply:**
  "No, you don't stop fighting corruption. You change the *targeting*. If you are in a low-capacity state, prioritize smashing Extraction. Punish the nurse demanding a bribe for a vaccine. That is pure harm. On Diversion? You manage it. You don't necessarily prosecute the cousin; you require transparency on the relationship so the *value* of the contract can be audited. The policy shift is from 'Zero Tolerance' to 'Triage.' Acknowledge that in the short run, patronage holds the polity together. Your goal isn't to purge the system tomorrow; it's to slowly build the impersonal capacity that makes the patronage unnecessary. Don't burn the bridge until the road is built."

  **Honest Note on Soft Spot:**
  "Manage it" is a hard sell for a transparency NGO whose brand is "Zero Tolerance." You are asking them to tolerate corruption publicly. That is a career-risk suggestion for them.

  ### 4. The "Hope Nobody Raises" Objection
  **The Objection:** "This is just Neo-Patrimonialism with extra steps."
  **Why you fear it:** There is a massive literature from the 70s, 80s, and 90s (Bratton, van de Walle, Eisenstadt) that makes exactly this distinction between rational-legal and patrimonial authority. If an older political scientist stands up and says, 'We called this "patrimonialism" forty years ago, and we concluded it blocks development. Why is this new?' you look like you haven't read the canon.
  **The Defense:** "The literature diagnosed the *structure*, but the anti-corruption *industry* ignored the distinction and treated it all as 'graft.' I'm not rediscovering the structure; I'm critiquing the policy response that flattened the distinction."

  ---

  ### Strategic Concessions (Say these in your closing remarks)
  To buy credibility, concede these two points *before* they are used as weapons against you:

  1.  **To the Economists:** "I concede that currently, there is no clean index that separates Extraction from Diversion. My argument is a call for measurement innovation, not a claim that I have solved it." (This disarms the "where's your data" attack).
  2.  **To the Anthropologists:** "I concede that 'Diversion' is not morally neutral. It creates insiders and outsiders. I am not calling it 'good,' only 'less catastrophic than Extraction in stateless contexts.'" (This disarms the "romanticizing" attack).

  ---

  ### Self-Critical Read of This Prep Sheet

  **The Thesis-Killer Objection:**
  If the **Applied Micro** bloc demonstrates that **Extraction and Diversion are positively correlated** (i.e., officials who take bribes from strangers *also* steer contracts to cousins), your distinction collapses empirically. If they are the same actors doing both things simultaneously, you can't policy-triage them. If the "corrupt official" is a unitary actor maximizing rent regardless of the source, then the moral valence distinction doesn't matter for *incentives*. If this holds up, you have to change the thesis from "Target Extraction, Tolerate Diversion" to "The State Capacity required to stop Extraction also stops Diversion."

  **Where My Guess About the Audience Might Be Off:**
  I have assumed the **Anthropologists** will be your natural allies because you are critiquing Western metrics. They might not be. They often view "corruption" as a Western label applied to non-Western survival strategies *entirely*. By creating a new typology (Extraction vs. Diversion), you might still be imposing an external analytical grid on their field sites. They might object that *both* categories are Western constructs and that you are just splitting the hair of a colonial category. Be prepared for the objection that the *distinction itself* is the problem, not just the conflation.

  **Final Advice:**
  Watch the room during the first 5 minutes of Q&A. If the first question comes from an economist, lean into the "measurement error" frame. If it comes from an anthropologist, lean into the "moral valence" frame. Do not try to deliver the same defense to both. You are walking a tightrope; don't look down.
