      *   *Objection 2 (The Anthro Attack):* "You're still universalizing." Even saying diversion is "functional welfare" is a functionalist trap. It ignores power dynamics *within* the kin group.
          *   *Phrasing:* "Reifying categories," "Power asymmetries," "Romanticizing patronage."
          *   *Reply:* Agree it's not utopian, but argue it's *less predatory* than extraction in low-capacity states.
