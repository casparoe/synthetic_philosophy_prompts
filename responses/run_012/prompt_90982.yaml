  *(Self-Correction on the "Self-Critical" section)*: I need to make sure I don't just repeat the objections. I need to critique *my advice to the user*. Where might *I* be wrong about what this audience cares about? Maybe the anthropologists care less about functionalism and more about ontology. Maybe the economists don't care about the moral valence at all, only the efficiency loss. I should highlight that.

  *(Refining the "Hope Nobody Raises" objection)*: The user mentioned the "rationalist blogosphere" influence. The danger is being accused of "WEIRD" bias themselves. But the real killer is the *measurement* issue. If the indices can't distinguish, and no new data exists, the argument is philosophically interesting but empirically null. Let's make that the "Hope Nobody Raises" but frame it as the "Measurement Intractability" point. Actually, a better "Hope Nobody Raises" is the *Political Economy of Reform* objection: If diversion builds the coalitions that *create* the state, attacking extraction might undermine the only thing holding the polity together. That's the Tilly/Boix argument. It undermines the "do something different Monday morning" advice. Let's go with the "Elite Capture/Inequality" angle within diversion. It hits the moral valence claim hardest.

  *Wait, re-reading the prompt:* "Tell me... the one objection I'm privately hoping nobody raises."
