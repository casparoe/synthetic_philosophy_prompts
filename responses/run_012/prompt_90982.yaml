          *   *Soft spot:* Politically impossible for an NGO to say "let them steal for their cousins."

      *   *Objection 4 (The "Hope Nobody Raises" Attack):* The "State Capacity" trap. If diversion *is* the state building process (Tilly et al.), attacking it kills state building. But if you support it, you entrench elites.
          *   *Phrasing:* "Neo-patrimonialism," "State building," "Elite capture."

  4.  **Structuring the Prep Sheet:**
      *   Follow the user's specific constraints (ordering, phrasing, replies, soft spots, concessions, self-critique).
      *   Tone: Professional, academic, slightly informal (matching the user's "weird spot" vibe), direct.

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I capture the "Western standards are parochial" nuance for the anthropologists? Yes, need to make sure they don't feel I'm just flipping the script but keeping the Western gaze.
      *   *Check:* Did I capture the "Identification Strategy" demand for the economists? Yes, need to emphasize empirical testability.
      *   *Check:* The "Concede Up Front" section needs to be strategic. Conceding measurement difficulty buys credibility with economists. Conceding diversion isn't "good" buys credibility with anthropologists.
      *   *Check:* The "Self-Critical" section at the end needs to be honest. Which objection actually kills the thesis? Probably the measurement one. If you can't separate them, the policy advice is useless.

  6.  **Final Polish:**
