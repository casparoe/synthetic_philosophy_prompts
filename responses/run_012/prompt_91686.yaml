prompt: |-
  My friend Dana and I argued for like two hours last night about Simpson's paradox and I'm still not over it. Her take was that it proves stats are just a magic trick — show me a trend and I'll show you the opposite trend by regrouping, so who cares. My take was that the regrouping isn't even the point, the point is that nothing in the arithmetic tells you which table is the right one, and picking the table is a causal question, not a math one. We went in circles. So I want to send her a poem instead of texting her again.

  Can you write me a poem, no fixed form, around 18-20 lines, built so the structure carries the paradox instead of just describing it. The device I want: every stanza ends on the same repeated line — a refrain that states the within-group result, something like "in every group it goes this way" — and then in the last stanza the refrain comes back unchanged but it's now false, because the pooled numbers run the other direction. The whole point is that the refrain didn't move; the level of analysis did.

  Two things I care about. First, don't use the batting-average or kidney-stone example, everyone's seen those a million times. Invent a fresh concrete case (a training plan, a hiring round, a drug trial, whatever — just make it specific and make the numbers actually work out). Second, and this is the part I actually want, rig the case so the grouping variable is downstream of the thing being compared — i.e. the comparison itself changes how many people end up in each group — so that here the pooled result is the honest one and the subgroup breakdown is the misleading one. Most tellings assume the opposite, that the aggregate is the illusion, and I want the poem to get this right without turning into a stats lecture. The closing couple of lines should land the thought that which table counts as "the truth" depends on whether the grouping variable is a cause or an effect of what you're comparing.

  Someone who knows the paradox should find it accurate; Dana, who doesn't, should just enjoy it.

  Then, after the poem, give me a short structured summary as a JSON object so I can drop it in my notes, with these fields: "scenario" (one line on the concrete case), "subgroup_direction", "pooled_direction", "grouping_variable_role" (cause / effect / common cause of the compared variable), "refrain" (the repeated line, and how its truth flips), and "verdict" (which comparison the poem calls the honest one, and the reason).
