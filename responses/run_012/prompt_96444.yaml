  Two superrationalists meet in a narrow hallway. They need to coordinate to pass—one left, one right—but since they're running identical decision procedures on identical data, they know whatever reason one finds to step left, the other will find too. So they step left in unison, then right in unison, trapped in a loop of perfect synchronization; each is convinced that breaking the symmetry would imply the other is irrational, and neither is willing to downgrade their estimate of the other's mind just to get through the door.

  This joke leans on the contested assumption that superrational agents cannot use indexical information or shared randomness to break symmetry, treating them as purely identical functions rather than distinct instances. I would reconsider the fairness if the definition of superrationality explicitly incorporated probabilistic tie-breakers as part of the rational procedure itself. Without that clause, the deadlock is a genuine theoretical vulnerability rather than a caricature.
