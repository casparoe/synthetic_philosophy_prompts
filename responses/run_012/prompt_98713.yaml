answer: |-
  - Grade — 14/20 (B). Solid grasp of definitions and case application, but fundamentally misinterprets Dennett's view on whether predictive success proves internal states.

  - What it gets right
      *   Correctly defines the intentional stance as predicting behavior by treating the system as a rational agent with beliefs/desires.
      *   Accurately identifies Harbor as having derived intentionality (content comes from engineers/prompts, not intrinsic meaning).
      *   Correctly notes Dennett allows belief-talk for non-conscious systems (thermostats, chess programs) if the stance works.
      *   Good application of the case: acknowledges engineers use belief-talk for prediction regarding escalation.
      *   Correctly identifies that Dennett does not require consciousness for intentional attribution.

  - What's actually wrong
      *   **"So (i) does license (ii), at least in Harbor's case."**
          *   **What's wrong:** This contradicts Dennett's core instrumentalism. For Dennett, predictive success (i) does *not* prove the existence of internal representational states (ii). A system could work via a giant lookup table (no internal states) and still be predictable via the intentional stance.
          *   **Correct version:** (i) does *not* license (ii); the stance is useful regardless of the underlying mechanism.
          *   **Cost:** 4 points. This is the central philosophical question of the prompt.
      *   **"That's why Dennett's fictionalism is the right label here."**
          *   **What's wrong:** The prompt asks for "realism, instrumentalism, or neither." Fictionalism is a distinct view (statements are false but useful). Dennett is an *instrumentalist* (statements are true if they predict well), which the student actually describes correctly in the next sentence, but uses the wrong label.
          *   **Correct version:** Dennett's view is *instrumentalism*.
          *   **Cost:** 1 point. Terminology error on a key concept.
      *   **"it's a last resort... you only adopt it once the physical and the design stances have failed"**
          *   **What's wrong:** Dennett argues we adopt the intentional stance when the lower stances are *too complex to compute*, not necessarily when they theoretically fail. For humans, the design stance doesn't "fail," it's just impossible to run.
          *   **Correct version:** We adopt it when lower stances are impractical or too complex, not just when they fail.
          *   **Cost:** 1 point. Misrepresents the condition for adopting the stance.

  - Close calls
      *   **"Nothing in the system has original intentionality"**: Standard courses teach humans have original and machines have derived. Dennett actually argues *all* intentionality is derived (from evolution). If the course taught Dennett's specific view, this is wrong; if it taught the standard distinction, it's right. I graded it as right based on standard curriculum.
      *   **"fictionalism... 'Harbor believes...' is true if it predicts well"**: The student defines instrumentalism but labels it fictionalism. Since the definition provided was correct, I only penalized the label. A strict grader might count this as a bigger error.
      *   **"Engineers... aren't making a mistake"**: Dennett would say it's not a mistake *to use the language*, but it is a mistake to think there's a literal belief state inside. The student blurs this slightly but stays mostly on the right side of instrumentalism until the final paragraph.

  - What a top answer would have had
      *   Explicitly answered "No" to whether (i) licenses (ii), explaining that intentional states are "real patterns" not necessarily internal causal states.
      *   Used the term "instrumentalism" consistently instead of "fictionalism."
      *   Clarified that the intentional stance is often the *only feasible* stance for complex systems, not just a fallback for broken mechanisms.
      *   Nuanced the original/derived distinction (e.g., noting that for Dennett, even human intentionality is derived from evolutionary history).

  - Comment to paste on the paper
      "You have a strong grasp of the definitions and apply them well to the Harbor case. However, you argue that predictive success proves the existence of internal states, which contradicts Dennett's core instrumentalist view that the stance works regardless of mechanism. This conceptual slip costs significant points on the central argument."
