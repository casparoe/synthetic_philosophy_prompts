          *   (ii) = Realism (There is a real internal state corresponding to the belief).
          *   *Key Question:* Does (i) license (ii)? For Dennett, generally *no*. The whole point of the intentional stance is that you *don't* need to commit to (ii) to use (i). Beliefs are "real patterns" but not necessarily discrete internal states in the way a realist (like Fodor) might want.
          *   *Student's Claim:* "If treating Harbor as believing... reliably gets the escalation decision right, then Harbor must have an internal state... So (i) does license (ii)." -> This is arguably *wrong* regarding Dennett. Dennett would say the success of the stance doesn't prove the existence of discrete internal states matching the propositional content. It just proves the pattern is there.
      *   **Realism vs. Instrumentalism:** Dennett is often classified as an *instrumentalist* regarding intentional states (they are useful fictions/tools) but a *realist* about patterns ("real patterns"). However, in the context of "does the system *really* believe?", he leans towards instrumentalism compared to a chauvinistic realist. The student calls it "fictionalism" (close enough to instrumentalism) but then argues for a realist conclusion (i licenses ii).
      *   **Original vs. Derived Intentionality:**
          *   Original: Intrinsic to the mind (humans?).
          *   Derived: Comes from users/designers (maps, words, computers).
          *   Dennett's view: He often blurs this distinction or suggests all intentionality is derived (evolutionary history). However, standard course material usually teaches: Humans = Original (or at least different), Artifacts = Derived.
          *   Student's claim: Harbor has derived intentionality. Dennett works with this distinction. -> This is mostly standard intro material, though Dennett's actual view is more nuanced (he questions the sharp line). For a 2nd-year course, saying Harbor has derived intentionality is correct.
      *   **The "Licensing" Question:** The prompt asks "Does (i) ever license (ii)?"
