answer: |-
  # Modal Metaphysics: A Decision Tree for Possible Worlds
  **Course:** Metaphysics II | **Topic:** Transworld Identity vs. Counterpart Theory

  **Instructions for Students:**
  Don't start by asking yourself, "Am I a Lewisian?" or "Do I believe in Counterpart Theory?" Those are labels for the destination, not the starting point. Instead, work through the following diagnostic questions. Your answers will map you onto a specific metaphysical position. Note that some paths converge on the same label, while others reveal subtle disagreements hidden behind the same terminology.

  ---

  ### **START: The Status of Modal Talk**

  **Q1. Consider the claim: "This very chair could have been made of ice." Is this claim capable of being objectively true or false, or is it merely an expression of imagination that lacks truth conditions?**
  *   **A. It lacks truth conditions / isn't truth-apt.** → **[LEAF 1: Quietist / Deflationist]**
      *   *View:* De re modal claims are not genuine assertions about reality. There is no fact of the matter about what objects *could* be, only about how we choose to describe them.
  *   **B. It is truth-apt (it can be true or false).** → *Proceed to Q2.*

  ---

  ### **THE ONTOLOGY OF WORLDS**

  **Q2. What makes that claim true? Consider a world where the chair is made of ice. Is that world a concrete physical universe just as real as ours, merely distant in space and time, or is it an abstract entity (like a story, a description, or a state of affairs)?**
  *   **A. It is a concrete physical universe.** → *Proceed to Q3.*
  *   **B. It is an abstract representation.** → *Proceed to Q4.*
  *   **C. It is a recombination of actual elements.** → **[LEAF 2: Combinatorialism]**
      *   *View:* Possible worlds are not independent entities but are constructed by rearranging the actual particulars and properties we already have. (Note: Often pairs with Actualism, but distinct in its generative mechanism).

  ---

  ### **THE CONCRETE PATH (Modal Realism)**

  **Q3. If other worlds are concrete universes, can you literally be present in more than one of them? (Imagine a world identical to this one up to 2023, then diverging. Are you in both branches?)**
  *   **A. Yes, I can be in multiple concrete worlds.** → **[EMPTY REGION]**
      *   *Instructor Note:* This position is generally considered **incoherent**. If worlds are concrete and spatiotemporally isolated (as they must be to be distinct concrete universes), you cannot be wholly present in two disconnected spacetimes without violating the transitivity of identity.
  *   **B. No, I am world-bound. Only a duplicate of me exists there.** → *Proceed to Q5.*

  ---

  ### **THE ABSTRACT PATH (Actualism)**

  **Q4. If other worlds are abstract, do *you* (this concrete person) exist in those other worlds, or does only a representative of you (an essence, a haecceity, or a proxy) exist there?**
  *   **A. I literally exist in other worlds (Transworld Identity).** → *Proceed to Q6.*
  *   **B. Only a representative/essence of me exists there.** → *Proceed to Q7.*

  ---

  ### **THE NATURE OF THE CROSS-WORLD RELATION**

  **Q5. (For Concrete Worlds) What makes that duplicate in the other world your *counterpart* rather than just a random stranger? Is it a fixed matter of intrinsic similarity, or does it depend on our conversational context?**
  *   **A. It is fixed by intrinsic similarity and causal history.** → **[LEAF 3: Lewisian Counterpart Theory]**
      *   *View:* Full-blooded Modal Realism. You are world-bound. Counterparts are determined by objective resemblance.
  *   **B. It depends on conversational context and pragmatic interests.** → **[LEAF 4: Stalnakerian Pragmatic Counterparts]**
      *   *View:* **Semantic Counterpart Theory.** The metaphysics might be actualist, but we *talk* as if there are counterparts. The counterpart relation is not discovered in the world but imposed by our interests.

  **Q6. (For Transworld Identity) If you exist in another world, what determines which properties you have there? Could you have had entirely different parents?**
  *   **A. Yes, almost any property could differ (Anti-Essentialism).** → **[EMPTY REGION]**
      *   *Instructor Note:* This is **unattractive/rare**. If you exist in a world with no qualitative connection to your actual self (e.g., different parents, different matter), it is hard to see what makes it *you* other than brute stipulation.
  *   **B. No, some properties (like origin) are fixed (Essentialism).** → **[LEAF 5: Kripkean Transworld Identity]**
      *   *View:* You exist in other worlds, but your modal profile is constrained by rigid designation and essential properties (e.g., origin).

  **Q7. (For Abstract Representatives) Is the representative that exists in other worlds a unique, non-qualitative "thisness" (haecceity), or is it a bundle of qualitative properties?**
  *   **A. It is a unique "thisness" (Individual Essence).** → *Proceed to Q8.*
  *   **B. It is a bundle of qualitative properties.** → **[LEAF 6: Qualitative Actualism]**
      *   *View:* Worlds are distinguished only by qualitative differences. There is no "bare identity."

  ---

  ### **INDIVIDUATION AND HAECCEITISM**

  **Q8. (For Individual Essences) Consider two possible worlds that are qualitatively identical in every way, but in World A, *you* exist, and in World B, *your perfect duplicate* exists. Are these two distinct possible worlds?**
  *   **A. No, they are the same world.** → **[LEAF 7: Anti-Haecceitism]**
      *   *View:* There is no difference without a qualitative difference. (Often aligns with Leibnizian views).
  *   **B. Yes, they are distinct because of *who* is in them.** → **[LEAF 8: Haecceitism / Primitive Thisness]**
      *   *View:* Worlds can differ solely in terms of which individuals occupy which roles, even if the roles are qualitatively identical.

  ---

  ### **INSTRUCTOR'S KEY & DIAGNOSTIC NOTES**

  **1. The "Collapse" Warning (TWI vs. Individual Essences)**
  You suspected **Leaf 5 (Kripkean TWI)** and **Leaf 8/Plantinga-style Actualism (Individual Essences)** might collapse. You are *mostly* right regarding logical output, but they differ metaphysically.
  *   **The Collapse:** For the purposes of evaluating modal claims (e.g., "Could Nixon have lost?"), both views yield the same truth conditions. Both rely on a transworld tether (either the object itself or its essence) that fixes reference across worlds.
  *   **The Distinction:** Kripke (Leaf 5) is often read as committing to the *object* existing in other worlds. Plantinga (Leaf 8 variant) insists only the *essence* exists in other worlds; the concrete object is actual-world only. If your students press on whether non-actual objects have being, this is where the split matters.

  **2. The Semantic vs. Metaphysical Counterpart Distinction**
  This is handled at **Q5**.
  *   **Lewis (Leaf 3):** Counterparts are a metaphysical fact. The relation exists in the fabric of reality.
  *   **Stalnaker (Leaf 4):** Counterparts are a semantic tool. We use counterpart talk to make sense of modal logic without committing to Lewis's concrete worlds. Students often conflate these; ensure they see that one can accept the *logic* of CT without the *ontology* of Lewis.

  **3. Empty/Unattractive Regions**
  *   **Concrete Worlds + Transworld Identity:** Flagged in Q3. This is the "Lewis's Dilemma." If worlds are concrete and isolated, identity across them is impossible. If they aren't isolated, they aren't distinct worlds.
  *   **Transworld Identity + No Essentialism:** Flagged in Q6. Without essential constraints (like origin), transworld identity becomes unintelligible stipulation ("Let's call this guy Nixon").

  **4. Diagnostic Case Mapping**
  *   *Statue/Lump:* Best used to probe **Leaf 5 vs. Leaf 3**. Does the statue have different modal properties than the lump? (Sortal sensitivity).
  *   *Different Parents:* The definitive test for **Leaf 5 (Essentialism)**. If they say "Yes, could have different parents," they are pushed toward **Leaf 4 (Pragmatic)** or **Leaf 8 (Haecceitism)**.
  *   *Ice Chair:* Tests **Q1 (Quietism)** and **Q2 (Ontology)**.
  *   *Perfect Duplicate:* The core test for **Q8 (Haecceitism)**.
  *   *Diverging World:* Tests **Q3 (Concrete Identity)**. If they say "I am in both," they must explain how spatiotemporal isolation works.

  **5. Combinatorialism (Leaf 2)**
  Note that Combinatorialism is compatible with Actualism (Leaf 4 path) but focuses on the *generation* of worlds rather than the *identity* conditions. It fits best for students who think possibility is just "reshuffling the actual deck."
