prompt: |-
  I run a 90-minute session of an upper-level seminar on the physics of information — about twenty students, mixed physics and philosophy backgrounds — and I want a game in which the group runs Maxwell's demon themselves and feels why it fails to beat the second law, as an accounting problem rather than a slogan. Design it so that molecules carrying distinguishable states file past a gate that a student-demon opens and closes, tokens are credited for each correct sort as extracted work, and every decision must be entered on a finite physical ledger. The ledger is the crux: it is a memory that has to be wiped back to a blank standard state before it can be used again, and the wiping must cost exactly what the sorting earned, so the books close only once the memory is counted. Make that cancellation exact in the payoff scheme, not approximate. Include a control run in which the demon sorts without measuring, and one run in which the demon's ledger starts out already correlated with the gas, so the group sees extra work become available and then has to work out what paid for it. Give me the materials and setup, the roles (molecules, demon, ledger-keeper, auditor), the rules for a run, the token scoring that stands in for work and for erasure (no real money), a 90-minute timeline, and a debrief that maps each moment of play onto the ideas: measurement as a physical process, the demon's memory as a thermodynamic system with its own entropy, why the demon's cleverness is irrelevant to the bookkeeping, and why the law is saved only when the memory sits inside the system being audited. Then tell me what predictably goes wrong the first time this is run and how to handle it, and be explicit about which part of the physics the game cannot reproduce and that I will have to supply myself.
