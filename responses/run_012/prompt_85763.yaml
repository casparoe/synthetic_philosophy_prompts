prompt: |-
  ok so I need help writing a speech, and I want you to actually think before you start typing, not just wing it. Take the role of someone who's read a lot of the historiography about periodization and also knows how to land a joke in front of colleagues.

  The situation: my university just merged our Medieval Studies program and our Early Modern program into one unit called "Pre-1750 Studies" (I know). I'm the one giving the toast at the reception Friday, four or five minutes, so like 600-700 words. The room is about thirty people. Medievalists on one side, early modernists on the other, two historians of science who have spent their whole careers arguing that the "Scientific Revolution" is a category invented by textbooks, and the dean, who thinks this is purely administrative housekeeping and has no idea what he's walked into.

  Heres my problem. I can't do the standard move, which is some version of "of course these boundaries are arbitrary constructions, but they're useful" — the medievalists in that room have been hearing that from early modernists for thirty years and they know it's a demotion dressed up as sophistication. But I can't pretend the boundaries are natural either, because the historians of science will start heckling and anyway I don't believe it. So I need an actual account of what a period is, one that makes both sides' expertise come out as tracking something real, without pretending 1500 is a line in the world rather than a line we drew.

  Stuff I'd like in there if it fits: that "the Middle Ages" is a name given to a stretch of time by people who thought they'd come out the other side of it; that the "long" Middle Ages and the "long" Renaissance overlap, so if you lengthen both you don't get a border, you get an argument; that "medieval" gets exported onto Japan and the Islamic world where it does something quite different; that a rebirth is a value judgment wearing a calendar's clothes.

  So: brainstorm first. Sketch two or three candidate accounts of what a period is — periods as instruments for comparison, periods as bets about what matters, periods as names that do their work by being fought over — then pick the one that can actually carry a whole speech, and tell me in a sentence which you picked and why. Then write the toast.

  Rules for the toast: don't use the words "construct" or "arbitrary," they're fighting words in that room. Don't end on a platitude about interdisciplinarity. It should be funny at least twice. The dean should be able to follow every word and the medievalists should not feel managed.
