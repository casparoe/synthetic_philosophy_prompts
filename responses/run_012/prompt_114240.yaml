answer: |-
  The smell of the sanctuary was specific: wet hay, aged manure, and the sweet, dusty scent of alfalfa. Elena was on her knees in the pig pen, scrubbing a trough with a stiff brush. Barnaby, a Berkshire cross with ears like satellite dishes, nudged her shoulder.

  "Easy, big guy," she said, scratching behind his bristles.

  "You know, you're saving the ones you can see," a voice said from the fence.

  Elena looked up. It was Mark, a weekend volunteer. He was holding a bucket of feed, leaning against the railing with the casual confidence of someone who had recently listened to a contrarian podcast.

  "What's that?" Elena asked, standing up and wiping her hands on her jeans.

  "The tofu," Mark said, nodding toward her lunchbox on the bench. "I read this piece. About crop deaths. Combine harvesters. They don't see the mice. Or the birds nesting in the wheat. Or the insects. You mow the field, you kill the whole ecosystem. One cow, though? One cow lives for years on grass. Then one bullet. You feed a village for a year. Mathematically, isn't the beef cleaner?"

  Elena dried her hands. "It's not that simple."

  "Isn't it?" Mark shrugged. "Just saying. You're an actuary. You like numbers. Have you run the numbers?"

  He walked away to feed the goats before she could answer. But the seed was planted. It sat in her chest, a small, hard knot, all the way home.

  That evening, Elena didn't turn on the TV. She opened her laptop at the kitchen table and created a new spreadsheet. She titled it *Mortality_Coefficients_v1*.

  She was good at risk assessment. She priced life for a living, calculating the probability of death against the payout. But this model lacked clean data.

  She started with the baseline: 2,000 calories per day.

  *Row 1: Tofu/Soy.*
  She searched for yield per acre. Soybeans produced high calories per acre, but the harvest was mechanical. She found a study estimating field animal deaths per harvest. Mice, voles, ground birds. The number was significant. But then, the variable *Insects*. Did the beetles in the soil count? If she assigned them a value of 0.01 of a mammal, the death toll skyrocketed. If she assigned them zero, the toll dropped. She typed `=IF(Insect_Count=TRUE, D4*100, D4)`. The cell flashed red.

  *Row 2: Beef.*
  A steer yields roughly 400 pounds of meat. At half a pound per meal, that was 800 meals. One death.
  *Death Cost per Meal:* 1/800 = 0.00125 deaths.
  But the cow had to eat. If it was grain-fed, the crop deaths applied to the cow's feed, amortized over the cow's meat. If it was grass-fed, the land use changed. Would that pasture be cropland if the cow weren't there? If yes, the cow saved the mice by keeping the land as grass. If no, the cow was just using land that would have been wild anyway.
  She created a dropdown menu: *Counterfactual_Land_Use*. She toggled it. The numbers swung wildly.

  *Row 3: Chicken.*
  This was where the nausea started.
  A chicken yields maybe 40 meals. One death.
  *Death Cost per Meal:* 1/40 = 0.025 deaths.
  By the "amortization" metric, the chicken was twenty times deadlier than the cow. One cow death covered hundreds of meals; one chicken covered a few. To get the same protein as one steer, you needed dozens of chickens. Dozens of lives, dozens of slaughters.

  Elena rubbed her eyes. The spreadsheet was bloating. She added a column for *Suffering_Years*.
  The field mouse lived a year, then died instantly in the combine.
  The feedlot cow lived two years, confined, then died.
  The broiler chicken lived six weeks, bred to grow so fast its legs buckled, then died.

  She tried to weight it. `=Deaths * (Lifespan * Suffering_Intensity)`.
  What was the suffering intensity of a mouse? What was it for a cow? She couldn't find the data. She had to input the scalar herself.
  She typed `0.5` for the mouse. The vegan diet looked worse.
  She typed `5.0` for the feedlot cow. The beef looked monstrous.
  She highlighted the *Chicken* row. High death count. High suffering intensity. But low lifespan.
  Her cursor hovered over the *Insect* variable again. If she counted the insects killed to grow the soy for the tofu, the vegan diet was a massacre. If she counted the insects killed to grow the corn for the cow, the beef was a massacre. If she counted the insects the cow ate while grazing...

  It was a hall of mirrors. Every number relied on a moral assumption disguised as a constant.

  She closed the laptop. The kitchen was quiet. The clock ticked.
  She opened the fridge. There was a package of ground beef in the crisper, intended for tacos. There was also a block of firm tofu. And in the freezer, a bag of breaded chicken tenders she'd bought on sale weeks ago.

  She put a skillet on the stove.

  Her partner, David, came in from the living room. "Smells good. What are we having?"

  Elena watched the oil shimmer in the pan. She had the beef in her hand. The arithmetic played behind her eyes. *One death, eight hundred meals.* It felt efficient. Cold, but efficient. It justified the weight of the package in her palm.

  But then she thought of Barnaby. The way he leaned his thousand pounds against her leg, trusting. He wasn't a variable. He was a subject. If she ate this beef, was she honoring him, or was she just outsourcing his death to a system she claimed to oppose?

  And if she chose the tofu?
  *The Combine.* She pictured the machine, a giant metal mouth chewing through the wheat. The mice running. The invisible insects. Mark's voice: *You're saving the ones you can see.*
  Was her sanctuary work just a performance? A way to clean her hands of the blood she was spilling indirectly with every forkful of grain?

  Then the chicken.
  *One death, forty meals.*
  Her gut recoiled. It felt frantic. To eat chicken was to accept a high turnover of life. It felt like consuming time itself, burning through short, frantic lives to keep her own going. It cut against the beef logic. If beef was "better" than tofu because of crop deaths, was chicken the worst of all? Or was it the most honest, admitting the cost directly?

  "Elena?" David asked. He was holding two plates. "You okay?"

  She looked at the beef. She looked at the tofu. She thought about the spreadsheet, the arbitrary scalars, the *Counterfactual_Land_Use* dropdown that changed the truth depending on her mood.

  She realized she couldn't solve this. The math didn't close. The variables were moral, not numerical, and she didn't have the authority to assign them value. She was an actuary, but she couldn't price this. There was no premium high enough to cover the uncertainty.

  "I'm thinking," she said.

  "About work?"

  "About dinner."

  She put the beef back in the fridge. She left the tofu on the counter. She found a bag of pasta in the pantry. Just wheat. Just grain.
  But the wheat had been harvested. The combine had run. The mice had run.

  She boiled the water. The steam rose, fogging the window.

  When they sat down, the plates were filled with plain penne and tomato sauce. No meat. No soy. Just processed grain.

  David took a bite. "Needs salt."

  Elena stared at her fork. She knew that even this, the simplest option, carried the weight of the field. She knew that somewhere, under the combine's blade, a life had ended for this meal. She knew that somewhere, a cow was grazing on land that might have been a forest, or a prairie, or a wheat field. She knew that the chicken in the freezer was waiting, a statistic of forty meals.

  She lifted the fork. The tines hovered over the pasta. She wanted to explain that she didn't know if this was clean. She wanted to say that she had tried to calculate the cost of living and found the equation insoluble. She wanted to say that she was hungry, and that hunger was the only variable that remained constant.

  "Is it okay?" David asked.

  Elena looked at the food. She looked at her hands, clean now, but smelling faintly of the pig pen, of earth and straw.

  "It's food," she said.

  She put the fork in her mouth. She chewed. She swallowed. She didn't take another bite right away. She just held the fork, resting it on the rim of the plate, waiting for a number that wouldn't come.
