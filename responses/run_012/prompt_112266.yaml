answer: |-
  ### Pre-Draft Analysis: Mapping the Confusions

  Before laying out the menu, I need to untangle the knots that usually bind this phrase together. When ethicists say "separateness of persons," they are often conflating three distinct layers: ontology, compensation, and metric.

  1.  **Ontology vs. Morality:** The trivial claim is that we are different bodies (ontology). The substantive claim is that our moral claims don't merge (morality). People hear the trivial truth and assume it validates the substantive claim.
  2.  **Aggregation vs. Compensation:** You can aggregate benefits (counting two smiles as better than one) without compensating losses (taking one person's eye to give two people glasses). The phrase often slides between "you can't sum across people" (radical) and "you can't sacrifice one for the sum" (moderate).
  3.  **Rights vs. Priority:** Sometimes the objection is about inviolable rights (Nozick), sometimes it's about giving priority to the worse off (Prioritarianism). The former bans trade-offs; the latter just weights them differently. A cost-effectiveness table can survive the latter but not the former.
  4.  **The "Super-Person" Analogy:** Rawls criticized utilitarianism for treating society like one giant person extending through time. Just as I might endure pain now for gain later, utilitarianism lets Person A endure pain for Person B's gain. The objection is that society isn't a person. But does that mean we can't compare A and B at all, or just that we can't treat A as a vessel for B?

  Below is the parsed menu of what that ethicist might have actually been saying.

  ***

  ### The Menu: Claims Hidden Behind "Separateness of Persons"

  **1. The Ontological Platitude**
  *   **The Claim:** Human beings are numerically distinct entities; what happens to your body does not physically happen to mine.
  *   **Classification:** Trivially True (Platitude).
  *   **Impact on League Tables:** None. Everyone accepts this. Cost-effectiveness analysis never claims people are the same body; it claims their health outcomes are *comparable* units. You can accept this claim and still use QALYs.
  *   **Differentiation:** This is the "shell" of the argument. It sounds deep but carries no normative weight. If the ethicist stops here, they are saying nothing.

  **2. The Compensation Prohibition (The Rawlsian Core)**
  *   **The Claim:** A loss suffered by Person A cannot be morally canceled out or justified by a gain enjoyed by Person B. We are not vessels for a collective sum.
  *   **Classification:** Substantive and Defensible Thesis.
  *   **Impact on League Tables:** **Rejects standard tables.** Standard cost-effectiveness sums total health gains. If a policy saves 10 lives but deliberately lets 1 person die to save money, the sum might be positive. This claim says that 1 person's death is not offset by the 10 lives. It demands constraints on who bears the burden, not just how much good is done.
  *   **Differentiation:** This is the most likely substantive meaning. It distinguishes "making the pie bigger" from "slicing the pie fairly."

  **3. The Side-Constraint View (The Nozickian Reading)**
  *   **The Claim:** Individuals have inviolable rights or boundaries that cannot be crossed, even to prevent others from having their boundaries crossed.
  *   **Classification:** Substantive and Defensible Thesis (Deontological).
  *   **Impact on League Tables:** **Rejects tables as decision-makers.** If a league table recommends funding Treatment X over Y because it's cheaper, but funding X requires violating someone's right (e.g., mandatory quarantine, denying established care), this view vetoes the table. It treats individuals as ends, not means to aggregate health.
  *   **Differentiation:** Stronger than #2. #2 says you can't offset losses; this says there are certain losses you cannot impose *at all*, regardless of the offset.

  **4. The Priority View (The Moderate Reform)**
  *   **The Claim:** Benefits matter more when they go to the worse off. Separateness means we shouldn't just count units of health; we should ask *whose* health it is.
  *   **Classification:** Substantive and Defensible Thesis (Prioritarianism).
  *   **Impact on League Tables:** **Modifies tables, does not reject them.** You can still use cost-effectiveness numbers, but you weight them. A QALY for a disabled person or someone with severe illness counts for more than a QALY for a healthy person.
  *   **Differentiation:** Often confused with #2. But #2 forbids the trade-off; this just changes the exchange rate. If the ethicist wants to *fix* the system rather than burn it, this is what they mean.

  **5. The Incommensurability Claim (The Radical View)**
  *   **The Claim:** There is no common metric that can measure value across different people. Your pain and my pain are fundamentally incomparable.
  *   **Classification:** Radical / Likely False (in practice).
  *   **Impact on League Tables:** **Destroys economics entirely.** If we cannot compare health states across persons, we cannot do public health policy, insurance, or triage. It leads to paralysis.
  *   **Differentiation:** This is the "nuclear option." Most ethicists who use the phrase don't actually mean this, because it makes governance impossible. If pressed, they usually retreat to #2.

  **6. The Rhetorical Signal (The Empty Move)**
  *   **The Claim:** "I am not a utilitarian." (Implicitly: "I am morally sensitive, unlike the economists.")
  *   **Classification:** Empty / Purely Rhetorical.
  *   **Impact on League Tables:** None, other than shutting down conversation. It functions as a conversation-stopper rather than an argument.
  *   **Differentiation:** If the ethicist cannot explain *why* separateness stops the calculation (see #2 or #3), this is all it is. It relies on the audience nodding without understanding.

  ***

  ### Diagnosis: What the Ethicist Likely Meant

  Given the context—a panel, a room nodding, a shutdown of a cost-effectiveness argument—the ethicist was likely deploying **Claim #2 (The Compensation Prohibition)** wrapped in **Claim #6 (The Rhetorical Signal)**.

  It is the standard bioethics move against health economics. They meant that you cannot sacrifice a specific individual's health prospects simply to boost the statistical aggregate of the population. However, because they offered it as a slogan ("that whole way of thinking ignores...") rather than an argument, they relied on the audience conflating the trivial truth (#1) with the substantive prohibition (#2). It is not empty—it has real content regarding compensation—but it was used rhetorically to avoid having to specify *which* trade-offs are forbidden.

  ***

  ### For Your Piece (Quotable Paragraph)

  "When economists build league tables, they act like architects balancing a budget: a loss in one column is fine if the total surplus grows. But critics argue this treats society like a single person willing to endure a headache today for a reward tomorrow. The problem is that society isn't one person. It is millions of separate lives. When you sacrifice one person's health to boost the average, you aren't asking them to wait for their turn; you are asking them to lose so others can win. The objection isn't that we can't compare needs—it's that we can't use one human being as a container to hold the costs of saving another."
