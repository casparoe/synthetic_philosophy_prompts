answer: |-
  1. The Position, Stated Plainly

  Your view posits corruption as a trans-cultural moral failure defined by the violation of role-specific impartiality. It holds that when an agent exercises power entrusted to them for the benefit of a collective, diverting that power for private advantage (whether personal, kin-based, or factional) constitutes corruption, regardless of local normative cover. This view distinguishes between the sociological existence of reciprocal norms and their moral validity; norms of hospitality explain why a bribe is offered, but do not justify accepting it if the role demands neutrality. Crucially, you assert that the Western anti-corruption framework is not culturally parochial but articulates a universal standard of public integrity. The view is committed to moral realism about political roles: there is a fact of the matter about what a role requires, independent of local consent. It is not committed to the claim that Western institutions are the only way to secure integrity, only that the standard of impartiality applies wherever entrusted power exists. Explanation of local practice is distinct from justification of moral rightness.

  2. What the Position Predicts That Its Rivals Do Not

  If this position is true, we should observe moral convergence across disparate cultures when agents occupy analogous roles of entrusted power. We would expect local populations to express resentment against role-breaches even where such breaches are culturally normalized, indicating an underlying universal intuition about fairness. Institutions would be judged by their ability to enforce impartiality rather than merely maintaining order or efficiency. Unlike cultural relativism, which predicts moral judgment will track local norms, your view predicts that local norms will often be contested internally by those excluded from the clientelist network. Unlike functionalism, which might tolerate corruption if it greases the wheels of bureaucracy, your view predicts that efficiency gained through partiality is morally illegitimate. We should also see the distinction between a gift and a bribe tracking the *intent and role-constraint* rather than merely the legal code; a gift that compromises impartiality is a bribe, even if legal. This predicts that moral outrage will focus on the breach of duty, not the transfer of value itself. We should observe that when local norms conflict with role impartiality, the conflict is experienced as a moral dilemma by the agent, not merely a strategic calculation. Finally, we should find that anti-corruption movements often arise endogenously, appealing to this universal standard against local elites, rather than solely being imported by external actors. Crucially, we should see that when roles are structurally identical, moral judgments align regardless of national context, suggesting the standard transcends borders.

  3. The Defeaters, Ranked

  1. **The Functional Equivalence Problem (Fatal):** If campaign contributions and lobbying retainers secure policy outcomes for private donors just as effectively as direct bribes secure permits, the distinction rests on legal formalism, not moral substance. If the universalist calls the bribe corrupt but the lobbying legal, they admit the standard is contingent on Western legal artifacts. To remain consistent, the universalist must label much of Western lobbying as corruption. Defenders might concede this cost, arguing Western democracies are indeed corrupt, but this radicalizes the view beyond practical recognition. If they refuse, the view collapses into parochialism, protecting Western elites while punishing Southern bureaucrats. This is fatal because it undermines the claim of universality. It suggests the distinction between gift and bribe is merely a legal artifact protecting specific interests.

  2. **The Hereditary Granary (Severe):** If a role is defined by partiality (kin first), calling it corruption implies the role itself is illegitimate. The universalist must argue this is not a "public office." But if "public office" is defined by impartiality, the theory becomes tautological: corruption is abusing public office, and public office is defined by non-corruption. This insulates the theory from counter-examples by definitional fiat. Defenders must concede that some societies lack "public offices" entirely, which limits the theory's universal reach. It suggests the view applies only to modern states, not all societies. This concession weakens the claim that corruption is a universal moral category rather than a specific feature of bureaucratic states.

  3. **The Legal Expediting Service (Moderate):** If fees are transparent and legal, is it private gain? If it creates a two-tier system, it breaches impartiality. However, if the fee supports the institution, it may be permissible. This challenges the "private gain" clause. Defenders can absorb this by distinguishing between public revenue and private pocketing, but if the expeditor keeps the fee, it looks like state-sanctioned corruption. This suggests legality can sanitize corruption, weakening the moral claim. It forces the view to admit that institutional design can legitimize what is morally suspect. The view must clarify whether "private gain" includes legal fees that create unequal access.

  4. **The Internal Critique (Awkward):** If anti-corruption discourse is used to destabilize rival states, the *application* is tainted, not necessarily the *concept*. However, if the concept itself emerges from specific historical property relations, its universality is suspect. Defenders can accept this as a warning about enforcement hypocrisy without abandoning the moral category, but it requires high epistemic humility regarding who gets to judge. It is awkward because it forces the universalist to distance themselves from their own allies. This critique does not defeat the moral ontology but complicates the political deployment of the concept.

  4. The Insulation Question

  The position risks unfalsifiability if every counter-example is met by redefining the role. If the hereditary keeper is not corrupt because the role isn't "public," and the lobbyist is not corrupt because the role allows partiality, then "corruption" only applies where we already assume it applies. This is a defect if the goal is to identify moral wrongs across contexts; it becomes a tool for categorizing rather than critiquing. However, if the goal is to clarify a specific moral category regarding *public* integrity, this insulation is necessary. Moral categories are often role-relative; a priest breaking celibacy is a moral failure specific to the role. The price of universality is accepting that not all power is "entrusted" in the relevant sense. The view remains falsifiable if we can identify a case where impartiality is clearly required, power is clearly entrusted, private gain is clearly taken, yet moral intuition denies corruption. Without such a case, the view holds, but only by retreating into the definition of "public." The danger is that "public" becomes a proxy for "Western-style bureaucracy," rendering the universality claim empty. To avoid this, the view must specify the conditions of entrustment independently of institutional form. Is this a defect for a view of this kind? If the view aims to be a tool for political critique, unfalsifiability is a vice; it allows the critic to dismiss any counter-evidence as conceptually irrelevant. However, if the view aims to define a specific virtue of office-holding, insulation is the price of precision.

  5. Verdict

  The position is robust but vulnerable to the charge of legalistic inconsistency. Its greatest exposure is the Functional Equivalence Problem: if it cannot condemn legalized influence peddling in the West while condemning informal gift-giving in the South, it collapses into parochialism. The single consideration that would most move me is evidence that local populations in clientelist societies do not perceive kin-priority as a breach of trust, but as the *fulfillment* of trust. If the "entrustment" itself is understood differently, the universalist definition of corruption misses the moral ontology of the actors it judges. This would suggest the view is not universal but descriptive of a specific political tradition.
