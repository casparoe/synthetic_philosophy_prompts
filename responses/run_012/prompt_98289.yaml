answer: |-
  ### The Case: The *Dictyostelium* Migratory Slug

  You asked for something where the "is this one thing or many?" question does real work, avoiding the parlor tricks of statues and ships. The best candidate is the social slime mold *Dictyostelium discoideum* specifically during its **migratory slug phase**.

  **The Setup:**
  Normally, these exist as thousands of independent, single-celled amoebas scattered in leaf litter (Answer: Many). When food runs out, they release a chemical signal (cAMP). They stream together, aggregating into a single mass. This mass differentiates: some cells become a rigid stalk, others become spores at the top. The whole structure lifts up and moves toward light, acting as a coordinated, motile unit (Answer: One). Eventually, it fruits, the spores scatter, and they become independent amoebas again.

  **Why this breaks the standard answers:**

  1.  **Van Inwagen's "Life" Criterion (Restrictivism):** Van Inwagen argues composition occurs only when parts are "caught up in a single life." In the slug phase, the cells are metabolically active, but they have subordinated their individual reproductive interests to the movement of the slug. Some cells will literally die to become the stalk; others will survive as spores. Is there *one* life here (the slug) or *many* lives cooperating (the cells)? Biologically, it's a "multicellular organism" temporarily assembled from "unicellular organisms." Metaphysically, it forces you to ask: Does a "life" require a single genome? (No, chimeras exist). Does it require permanent parts? (No, we shed cells). If you say "One," you have to explain why the independent amoebas beforehand didn't compose an object. If you say "Many," you have to explain why the slug moves with the intentionality of a single agent.
  2.  **Universalism:** If you say the amoebas *always* compose an object, then the scattered amoebas in the leaf litter constitute a "disconnected slime mold object." This feels ontologically bloated.
  3.  **Nihilism:** If you say they *never* compose an object, you have to treat the slug's movement toward light as a mereological fiction, despite it being the primary unit of selection in that phase.

  ### The "Mutual Dependence" Criterion

  You mentioned the criterion: *Composition happens when the parts are mutually dependent, so you can't pull one out without the rest rearranging themselves.*

  **Is this a live position?**
  Yes. In contemporary mereology, this is a version of **Causal Integration** or **Functional Unity** (championed in various forms by philosophers like Elizabeth Barnes or J.E. Stoneham, and heavily relied upon in systems biology). It attempts to ground composition in the *dynamics* of the parts rather than just their spatial proximity.

  **Does the Slime Mold help or hurt this criterion?**
  It **helps** it initially, but then **breaks** it.

  *   **Help:** During the migratory slug phase, the criterion holds beautifully. If you surgically remove a chunk of the slug, the remaining cells re-polarize and reorganize to maintain the slug's integrity. The parts are mutually dependent for the *function* of motility. This strongly suggests composition is occurring.
  *   **Hurt:** The criterion fails at the margins (the Sorites problem). During the initial aggregation, cells stream toward the cAMP source. At what percentage of aggregation does the "rearrangement" constraint kick in? If 50% of the cells have arrived, are they an object? If I pull one out, the rest don't rearrange yet; they keep coming. The "mutual dependence" is a gradient, not a switch. If composition is an all-or-nothing ontological fact (which most realists claim), a gradient criterion cannot define it.

  Furthermore, this criterion risks **over-generation**. A traffic jam fits this definition (remove a car, the flow rearranges). A jazz quartet fits this (remove a player, the harmony rearranges). If the slime mold is an object because of this, so is the traffic jam. Most metaphysicians are unwilling to grant "object" status to traffic jams. So, mutual dependence might be *necessary* for composition, but it is not *sufficient*.

  ### The Verdict (No Hedging)

  Once you stop hedging, the case favors **Restrictivism based on Biological Life**, but with a specific modification: **The Slug is One Object.**

  Here is why: The unit of evolutionary selection during the migratory phase is the slug, not the individual cell. The cells have lost their individual fitness trajectories to serve the trajectory of the whole. Ontologically, when the causal power shifts from the parts to the whole such that the parts act as *organs* rather than *agents*, composition has occurred. The amoebas do not cease to exist, but they cease to be the primary substances; they become the matter of the slug.

  ### Where It Stops Being Decisive

  The decisiveness breaks down at the **onset of aggregation**.

  There is a temporal window where the cells are signaling and moving toward each other but have not yet formed a cohesive membrane or synchronized motility.
  *   **The Problem:** If composition is a fact of the world, it must happen at a specific moment (or a specific precise boundary). But biological integration is continuous.
  *   **The Break:** If you rely on "mutual dependence," you cannot pinpoint the moment of composition. If you rely on "single life," you cannot pinpoint when the "many lives" become "one life."
  *   **The Consequence:** This suggests that either (A) composition is vague (which violates classical logic), (B) composition is a human convention imposed on continuous processes (Conceptualism), or (C) our intuition that there *must* be a fact of the matter is wrong.

  The slime mold forces you to admit that if composition is real, it must be sharp, but the world presents you with a gradient. You cannot have both a sharp ontology and a gradient reality without positing a magical moment where "many" snap into "one." Since no such magical moment exists in the biology, the case ultimately hurts the idea that there is a mind-independent answer to the SCQ, pushing you toward **Conceptualism**: The slug is one object *for the biologist*, but many objects *for the geneticist*, and there is no "God's eye view" that settles it.
