answer: |-
  # Exam Question: Formal Epistemology and Decision Theory
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question in essay form. You may use a calculator. All necessary definitions are contained within the question.

  ### The Regulator's Dilemma and Guarded Dominance

  A public health regulator must decide whether to Roll out a new intervention (**R**) or Hold back (**H**). The outcome depends on the true state of the world, which is one of three mutually exclusive and exhaustive possibilities: $s_1, s_2, s_3$.

  Expert evidence does not support a single precise probability distribution. Instead, it supports a **credal set** $\mathcal{P}$, defined as the set of all probability functions $p$ such that:
  *   $p(s_1) \in [0.2, 0.5]$
  *   $p(s_3) \in [0.1, 0.4]$
  *   $p(s_2) = 1 - p(s_1) - p(s_3)$

  The utilities for the acts are as follows:
  *   **R:** 10 in $s_1$, 4 in $s_2$, 0 in $s_3$.
  *   **H:** 0 in $s_1$, 5 in $s_2$, 9 in $s_3$.

  You are asked to evaluate a decision rule called **Guarded Dominance**. According to this rule, Act $A$ is strictly preferable to Act $B$ if and only if the minimum expected utility of $A$ across $\mathcal{P}$ is strictly greater than the maximum expected utility of $B$ across $\mathcal{P}$. If this condition is not met for either act, the rule declares the choice **indeterminate**: the agent is permitted to choose either, provided they can defend the choice against the risk of the other act outperforming it.

  **Essay Task:**
  1.  Calculate the expected utility ranges for **R** and **H** and determine the verdict of Guarded Dominance in this specific case.
  2.  Critically evaluate Guarded Dominance. Does it successfully navigate the tension between representing ignorance honestly and providing actionable guidance?
  3.  Consider the following complication: Suppose the regulator can wait for a secondary report $E$. For every precise probability function $p \in \mathcal{P}$, $E$ is probabilistically independent of the states (i.e., $p(E|s_i) = p(E)$). However, upon updating the credal set on $E$, the interval for $p(s_1)$ widens to $[0.1, 0.6]$ while the utilities remain unchanged. Under Guarded Dominance, learning $E$ renders the decision *more* indeterminate than it was before.
      Using this scenario, discuss the problem of partition or order sensitivity (often called "dilation"). Does this phenomenon undermine the rationality of using Guarded Dominance with imprecise probabilities?

  Take a clear stance on whether Guarded Dominance is a defensible rule for a rational agent facing imprecise probabilities.

  ***

  # Model Answer

  **Title:** Caution at the Cost of Coherence: A Critique of Guarded Dominance

  The central tension in formal epistemology regarding imprecise probabilities (IP) is whether representing ignorance as a set of functions is a virtue of honesty or a vice of paralysis. The "Regulator's Dilemma" presented here, analyzed through the lens of "Guarded Dominance," suggests that while IP captures the evidential state accurately, Guarded Dominance fails as a normative guide for action because it violates the Value of Information.

  To determine the verdict of Guarded Dominance, we must first calculate the expected utility (EU) bounds for both acts. Let $p_1, p_2, p_3$ represent the probabilities of states $s_1, s_2, s_3$. Since $p_2 = 1 - p_1 - p_3$, we can express EU in terms of $p_1$ and $p_3$ only.
  For **R**: $EU_p(R) = 10p_1 + 4(1 - p_1 - p_3) + 0p_3 = 6p_1 - 4p_3 + 4$.
  To find the *minimum* EU for R, we minimize $p_1$ and maximize $p_3$ given their constraints ($p_1 \in [0.2, 0.5], p_3 \in [0.1, 0.4]$).
  $\min EU(R) = 6(0.2) - 4(0.4) + 4 = 1.2 - 1.6 + 4 = 3.6$.

  For **H**: $EU_p(H) = 0p_1 + 5(1 - p_1 - p_3) + 9p_3 = -5p_1 + 4p_3 + 5$.
  To find the *maximum* EU for H, we minimize $p_1$ and maximize $p_3$.
  $\max EU(H) = -5(0.2) + 4(0.4) + 5 = -1 + 1.6 + 5 = 5.6$.

  Guarded Dominance requires $\min EU(R) > \max EU(H)$ for R to be strictly preferable. Here, $3.6 \ngtr 5.6$. Symmetrically, $\min EU(H)$ (calculated at $p_1=0.5, p_3=0.1$) is $1.9$, which is not greater than $\max EU(R)$ ($6.4$). Consequently, Guarded Dominance declares the choice **indeterminate**. The regulator is permitted to choose either, but the rule offers no positive recommendation.

  This verdict highlights the first major flaw in Guarded Dominance: it prioritizes error-avoidance over decision-guidance. Proponents of IP argue that a set of probabilities is the "honest" representation of vague evidence. Guarded Dominance respects this honesty by refusing to commit to an act unless it is robust across all admissible probabilities. However, in this case, the intervals are not wide enough to suggest total ignorance, yet wide enough to trigger paralysis. A regulator who chooses **R** is not acting irrationally; they are betting on $s_1$ being more likely than the worst-case scenario suggests. By labeling this indeterminate, Guarded Dominance conflates *epistemic caution* with *pragmatic silence*. It forces the agent to treat a situation of manageable risk as one of unmanageable ambiguity.

  The defect becomes fatal when we consider the secondary report $E$. The prompt specifies that $E$ is probabilistically independent of the states for every precise $p \in \mathcal{P}$. In standard Bayesian decision theory, learning independent information should not change your preferences between acts, nor should it make your decision harder. However, under IP updating rules (such as generalized conditionalization), this independence can lead to **dilation**: the posterior credal set becomes strictly wider than the prior.

  In the scenario provided, learning $E$ widens the interval for $p(s_1)$ from $[0.2, 0.5]$ to $[0.1, 0.6]$. Recalculating under Guarded Dominance:
  $\min EU(R)$ drops to $6(0.1) - 4(0.4) + 4 = 3.0$.
  $\max EU(H)$ rises to $-5(0.1) + 4(0.4) + 5 = 5.9$.
  The gap between the acts widens. The decision, already indeterminate, becomes *more* indeterminate. The agent is now less able to justify a choice after learning $E$ than before.

  This violates the **Value of Information**. A rational agent should never pay to avoid free, relevant information. Yet, under Guarded Dominance, the regulator has a pragmatic reason to ignore the report $E$. If they remain ignorant, they face a "small" indeterminacy; if they learn $E$, they face a "larger" indeterminacy. Since the rule provides no mechanism to break ties (e.g., via a secondary criterion like optimism/pessimism indices), the agent is rationally compelled to avoid information that dilates their credence. This is a reductio ad absurdum for the combination of IP and Guarded Dominance.

  One might defend Guarded Dominance by arguing that the dilation reveals the evidence was actually more misleading than initially thought, so increased caution is appropriate. However, this conflates the *content* of the evidence with the *structure* of the update. Since $E$ is independent of the states in every precise model, it carries no evidence about the states. The widening interval is an artifact of the set-based representation, not a reflection of the world. A decision rule that treats representational artifacts as pragmatic constraints is flawed.

  In conclusion, while the credal set $\mathcal{P}$ correctly represents the regulator's epistemic state, Guarded Dominance is an unreasonable decision rule. It fails to distinguish between risk that precludes dominance and risk that merely precludes certainty. More damningly, by rendering the agent vulnerable to dilation, it incentivizes ignorance. A defensible theory of imprecise decision-making must either refine the decision rule (e.g., using $\alpha$-maximin to force a trade-off between best and worst cases) or accept that rationality sometimes requires making precise choices on the basis of imprecise evidence. Guarded Dominance allows the agent to hide behind the imprecision, but as the dilation case shows, that hiding place comes at the cost of coherence.

  ***

  # Marking Scheme (Total: 20 Marks)

  **1. Calculation of Expected Utility Bounds (4 Marks)**
  *   **4 Marks:** Correctly derives $\min EU(R) = 3.6$ and $\max EU(H) = 5.6$ (or equivalent algebraic demonstration). Explicitly shows the substitution of boundary values ($p_1=0.2, p_3=0.4$).
  *   **2-3 Marks:** Correct algebraic setup but minor arithmetic error, or correct numbers with missing derivation.
  *   **0-1 Marks:** Fundamental error in EU formula or failure to use the min/max constraints correctly.
  *   *Typical Fumble:* Candidates often forget to substitute $p_2 = 1 - p_1 - p_3$, treating $p_2$ as an independent variable, which breaks the simplex constraint.

  **2. Verdict on Guarded Dominance (4 Marks)**
  *   **4 Marks:** Correctly identifies that $3.6 \ngtr 5.6$ and concludes the rule renders the choice **indeterminate** (permissible either way, no strict preference).
  *   **2-3 Marks:** Identifies the inequality fails but vaguely concludes "H is better" or "R is risky" without using the term indeterminate/permissible.
  *   **0-1 Marks:** Claims one act dominates despite the math, or misunderstands the rule's condition.
  *   *Typical Fumble:* Candidates assume that because Max EU(H) > Min EU(R), H is automatically the rational choice (confusing GD with Maximin).

  **3. Analysis of the Honesty vs. Guidance Tension (4 Marks)**
  *   **4 Marks:** Articulates that GD respects epistemic honesty (not committing beyond evidence) but fails pragmatic guidance (paralysis in solvable cases). Explicitly references the specific gap (3.6 vs 5.6) as evidence of excessive caution.
  *   **2-3 Marks:** Discusses the tension generally but does not link it back to the specific calculated values of the case.
  *   **0-1 Marks:** Merely defines IP without discussing the normative tension of the decision rule.
  *   *Typical Fumble:* Candidates praise IP for being "honest" but fail to critique why GD specifically makes that honesty pragmatically costly.

  **4. Explanation of Dilation/Partition Sensitivity (4 Marks)**
  *   **4 Marks:** Explains that learning independent information $E$ widens the interval (dilation) and explicitly notes this makes the decision status *worse* (more indeterminate) post-update.
  *   **2-3 Marks:** Describes the interval widening but fails to connect it to the decision difficulty or the independence condition.
  *   **0-1 Marks:** Treats dilation as simply "more uncertainty" without noting the counter-intuitive nature of learning *independent* info causing it.
  *   *Typical Fumble:* Candidates treat $E$ as if it were evidence *about* the states, missing the point that dilation occurs even when $E$ is irrelevant.

  **5. Normative Conclusion on Value of Information (4 Marks)**
  *   **4 Marks:** Argues that GD violates the Value of Information (agent should not pay to avoid free info) and uses this to take a stance (GD is unreasonable/needs refinement).
  *   **2-3 Marks:** Notes the violation of Value of Information but hedges on the conclusion, or takes a stance without linking it to Value of Information.
  *   **0-1 Marks:** No clear stance on the defensibility of the rule, or concludes dilation is acceptable without argument.
  *   *Typical Fumble:* Candidates conclude that "rationality is just indeterminate" without addressing why avoiding information is a normative failure.

  **Grade Differentiation:**
  *   **A Grade (16-20):** Hits all 5 points. Crucially, in Point 5, explicitly links dilation to the *Value of Information* principle to argue against the rule. The essay flows as a unified argument.
  *   **B Grade (12-15):** Hits Points 1, 2, and 4 well. Point 3 or 5 is weak (e.g., describes dilation but misses the normative violation of avoiding information). The essay may feel like a list of answers rather than a synthesized critique.
  *   **C Grade (8-11):** Gets the calculation (Point 1) but struggles with the philosophical implications of dilation or the specific definition of Guarded Dominance.
