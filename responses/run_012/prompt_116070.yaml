  Your friend is navigating one of the most notorious problems in moral philosophy: **Infinite Ethics**. Her verdicts reveal that she is trying to apply utilitarian intuition ("more is better") to a context where standard summation breaks down ($\infty = \infty$).

  Here is the breakdown of the principles consistent with her history, the prediction for the new case, and the test that will ultimately reveal her true metric.

  ### 1. Competing Principles Fitting Verdicts (1)-(3)

  To fit her three verdicts, a principle must distinguish uniform changes across the infinite population while ignoring finite changes. Two main principles fit this data:

  *   **Principle A: Limit Average Utilitarianism.**
      *   *Mechanism:* The value of a world is determined by the limit of the average welfare as the population size approaches infinity (the Cesàro mean).
      *   *Fit:*
          *   (1) Avg(+6) > Avg(+5). **Better.**
          *   (2) Avg(+5) = Avg(+5 + 1 person). **Equal.**
          *   (3) Avg(+5) = Avg(+5 w/ one outlier). **Equal.**
      *   *Philosophy:* Welfare matters, but only the *density* or *per-capita rate* of welfare matters in the long run.

  *   **Principle B: Leximin (Maximin) Prioritarianism.**
      *   *Mechanism:* The value of a world is determined solely by the welfare of the worst-off individual.
      *   *Fit:*
          *   (1) Min(+6) > Min(+5). **Better.**
          *   (2) Min(+5) = Min(+5). **Equal.**
          *   (3) Min(+5) = Min(+5). **Equal.**
      *   *Philosophy:* Welfare matters, but justice requires prioritizing the floor. (Note: This contradicts her slogan "more is better" in spirit, but fits her specific verdicts perfectly).

  ### 2. Prediction for World A vs. World B

  *   **World A:** Alternating +5, +1000, +5, +1000... (Average = 502.5; Minimum = 5)
  *   **World B:** All +50. (Average = 50; Minimum = 50)

  **What each principle predicts:**
  *   **Limit Average Utilitarianism:** **A is better.** (502.5 > 50). The sheer volume of welfare generated per person is higher in A.
  *   **Leximin:** **B is better.** (50 > 5). The worst-off person in B is ten times better off than the worst-off person in A.

  **My Bet:**
  I would bet that she will say **World A is better**.
  *   **Reasoning:** Her explicit premise is "more of it [welfare] is better." Leximin violates this principle if raising the welfare of the rich increases the total/average without helping the poor. Since she distinguished +5 from +6 (a uniform gain), she has shown she cares about aggregate magnitude, not just the floor. World A contains vastly "more welfare" in terms of density than World B. To choose B would require prioritizing equality over total welfare, which contradicts her stated core principle.

  ### 3. The Killer Case: Forcing the Surviving Principles Apart

  If she agrees with my prediction (A > B), she eliminates Leximin. However, she is still left with two aggregative views that fit all data so far: **Limit Average Utilitarianism** vs. **Hyperreal Total Utilitarianism**.

  *   **Hyperreal Total Utilitarianism** uses non-standard analysis to assign specific infinite values to totals (e.g., $5\omega$ vs $6\omega$). It fits (1)-(3) if we assume she treats finite additions as negligible relative to the infinite total (i.e., $5\omega + 5 \approx 5\omega$).
  *   **The Conflict:** Average Utilitarianism cares about *welfare per person*. Total Utilitarianism cares about *welfare per unit of space/existence*.

  **The Further Case:**
  Present her with two worlds where the *average* welfare is identical, but the *density* of people differs.

  *   **World C (Dense):** People exist at every integer coordinate ($1, 2, 3...$). Everyone has welfare **+100**.
  *   **World D (Sparse):** People exist only at every *even* integer coordinate ($2, 4, 6...$). Everyone has welfare **+100**.

  **The Verdicts:**
  *   **Limit Average Utilitarianism:** **Indifferent.** In both worlds, if you pick a person at random, their expected welfare is 100. The average is identical.
  *   **Hyperreal Total Utilitarianism:** **World C is better.** World C contains twice as many people as World D. Therefore, the total welfare in C ($100\omega$) is double the total welfare in D ($50\omega$). Since "more welfare is better," C wins.

  **Why this forces the split:**
  This case isolates whether she values the *intensity* of welfare (Average) or the *volume* of welfare (Total). Given her slogan ("more of it is better"), she *should* prefer World C. If she says they are equal, she is secretly an Average Utilitarian who prioritizes per-capita well-being over the total sum of good in the universe. If she says C is better, she is a consistent Total Utilitarian using infinite cardinalities to rank the worlds.
