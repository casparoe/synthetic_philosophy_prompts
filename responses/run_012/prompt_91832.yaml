  *(Self-Correction Note on Move 1)*: S says R makes us "systematically mistaken whenever we say someone is neither clearly bald nor clearly not." Actually, R says there *are* no such people (everyone is either bald or not). So S is right that R implies our intuition about borderline cases is wrong. I should clarify that distinction.

