answer: |-
  This is one of the most famous puzzles in the history of philosophy, and your frustration is well-founded. The "is of identity vs. is of predication" gloss is technically correct but often feels like a cheat code that doesn't explain *why* the argument feels so slippery in practice.

  Gongsun Long (the Advocate) is not making a zoological claim. He is making a claim about **logic, language, and metaphysics.** To understand him, you have to stop thinking about animals in a field and start thinking about *concepts* in a system.

  Here is the slow unpacking you asked for.

  ---

  ### 1. Formal Reconstruction of the Exchange

  Let's break the text you provided into its logical skeleton.

  **The Advocate's First Argument (The Metaphysical Distinction)**
  *   **P1:** The name "Horse" designates a form/shape (*xing*).
  *   **P2:** The name "White" designates a color (*se*).
  *   **P3:** What designates color is not identical to what designates form.
  *   **C:** Therefore, the compound name "White Horse" is not identical to the simple name "Horse."
      *   *(Note: The conclusion "White Horse is not Horse" uses "is not" [fei] to mean "is not identical to" or "is not equivalent to.")*

  **The Objector's Counter (The Existential Claim)**
  *   **P1:** If a white horse exists, a horse exists.
  *   **P2:** If a horse exists, it is correct to say "there is a horse."
  *   **C:** Therefore, a white horse falls under the category "Horse." (i.e., White Horse *is* a Horse).

  **The Advocate's Second Argument (The "Seeking" Test)**
  *   **P1:** If you request a "horse," yellow or black horses satisfy the request.
  *   **P2:** If you request a "white horse," yellow or black horses do *not* satisfy the request.
  *   **P3:** If "White Horse" were identical to "Horse," the satisfaction conditions for the request would be identical.
  *   **P4:** The satisfaction conditions are different.
  *   **C:** Therefore, "White Horse" is not "Horse."

  ---

  ### 2. The Shape/Color Premise: Decoration or Engine?

  You asked: *Is the shape/color distinction doing genuine work, or is it decoration? Would this work for "a fast horse"?*

  **It is doing genuine work, but not for the reasons a modern reader expects.**

  In Warring States philosophy (specifically the School of Names), there was a serious metaphysical debate about **Universals**. Gongsun Long is a **Realist about Universals**. He believes "Whiteness" and "Horseness" are real, independent entities that exist prior to their instantiation in objects.

  *   **Why Color/Shape?** In his metaphysics, "Shape" (the form of the horse) and "Color" (the quality of white) are ontologically distinct categories. One is structural; one is qualitative. Because they are distinct categories, the *name* for one cannot be the *name* for the other.
  *   **The "Fast Horse" Test:** If you swap in "Fast Horse," the argument *structurally* holds for Gongsun Long, but it becomes metaphysically messier.
      *   Argument: "Horse" designates shape. "Fast" designates speed/motion. Shape $\neq$ Speed. Therefore "Fast Horse" $\neq$ "Horse."
      *   Gongsun Long would likely accept this. His point is that **any specific determination added to a general term creates a new, distinct concept.**
      *   However, "White" was the philosophical paradigm for a separable attribute. You can conceive of "White" without conceiving of a "Horse" (e.g., white stone, white feather). You can conceive of "Horse" without conceiving of "White" (e.g., black horse).
      *   **Verdict:** It is not a red herring. It is the metaphysical foundation. He is arguing that **Compound Concepts $\neq$ Simple Concepts.** The color/shape distinction is the clearest way to demonstrate that two concepts are being combined.

  **Why the text sets it up this way:**
  If he just said "A specific horse is not a horse," it sounds absurd. By breaking it down into "Color" and "Shape," he forces you to acknowledge that you are using two different *criteria* to identify the object. To identify a "Horse," you look for the shape. To identify a "White Horse," you look for the shape **AND** the color. Since the criteria differ, the *names* differ.

  ---

  ### 3. The "Seeking a Horse" Move: Ontology or Requests?

  You asked: *Is that argument about horses, or about the conditions under which a request gets satisfied? Where does he slide?*

  This is the strongest part of the dialogue, and your intuition is correct: **It is about satisfaction conditions (intension), not existence (extension).**

  **The Distinction:**
  *   **Objector:** Thinks in terms of **Extension** (the set of all objects). The set of White Horses is a subset of the set of Horses. Therefore, a White Horse *is* a Horse.
  *   **Advocate:** Thinks in terms of **Intension** (the definition/concept required). The concept "White Horse" requires {Shape + Color}. The concept "Horse" requires {Shape}.

  **The Slide (or lack thereof):**
  Does the Advocate slide from "What is sought differs" to "The things sought differ"?
  *   **Charitably:** No. He stays consistent. He is arguing that the *Name* "White Horse" is not the *Name* "Horse." In the context of the "Seeking" argument, he is showing that the **function** of the two names is different.
  *   **Uncharitably:** He slides from "The *concept* of a white horse is not identical to the *concept* of a horse" to "A white horse is not a horse."
      *   If "is" means **Class Membership** (Objector's view): The argument fails. (White Horse $\in$ Horse).
      *   If "is" means **Conceptual Identity** (Advocate's view): The argument succeeds. (Concept[White Horse] $\neq$ Concept[Horse]).

  **Where the Objector gets stuck:**
  The Objector assumes adjectives attach to kind terms by **restriction** (narrowing the set).
  The Advocate assumes adjectives attach to kind terms by **composition** (creating a new compound entity).
  When the Objector says, "Having a white horse counts as having a horse," he means *possession of an object*. When the Advocate hears this, he hears *equivalence of definitions*.

  **Does he need the slide?**
  If you read Gongsun Long as a philosopher of language (which is the most coherent reading), he doesn't need to slide. His conclusion "White Horse is not Horse" is shorthand for "The term 'White Horse' is not interchangeable with the term 'Horse'." The "Seeking" argument proves they aren't interchangeable in practice.

  ---

  ### 4. Charitable Reconstruction: Who is Gongsun Long?

  You offered several labels: Nominalist, Essentialist, Sense/Reference, Sophist. Here is the breakdown.

  **1. The Sophist (The "Gotcha" Artist)**
  *   *View:* He knows he's lying. He's just winning debates by exploiting ambiguity in the word "is" (*fei*).
  *   *Problem:* This dismisses the text too easily. The School of Names was deeply concerned with political order. Confusing names leads to confusing social roles. If "White Horse" = "Horse," then specific duties might get conflated with general duties.
  *   *Verdict:* Too cynical.

  **2. The Nominalist**
  *   *View:* Only particular objects exist; universals are just names.
  *   *Problem:* Gongsun Long argues the opposite! In other dialogues (like *On Pointing and Things*), he argues that "Whiteness" exists independently of white things. He is a **Realist**, not a Nominalist.
  *   *Verdict:* Incorrect.

  **3. The Proto-Fregean (Sense/Reference)**
  *   *View:* He distinguishes Sense (*Ming*/Name) from Reference (*Shi*/Actuality).
  *   *Problem:* This is anachronistic but **heuristically the most useful**. He is arguing that the *Sense* of "White Horse" differs from "Horse," and therefore, in logical discourse, they cannot be treated as identical.
  *   *Verdict:* Strong candidate for *explaining* the logic, even if not historically precise.

  **4. The Semantic Essentialist (The Best Fit)**
  *   *View:* Gongsun Long believes that Names (*Ming*) must correspond precisely to Actualities (*Shi*). Each distinct concept requires a distinct name.
  *   *Reconstruction:*
      1.  **Metaphysics:** Universals (White, Horse) are real and distinct.
      2.  **Semantics:** A compound name ("White Horse") designates a compound universal. A simple name ("Horse") designates a simple universal.
      3.  **Logic:** A compound universal is not identical to one of its constituent simples. (Just as a "triangle" is not identical to "shape," even though a triangle is a shape).
      4.  **Conclusion:** To say "White Horse is Horse" is to commit a category error. It conflates the specific with the general.
  *   *What this explains away:* It requires us to accept that the verb "is" (*fei*) in the conclusion means **"is conceptually identical to,"** not "is a member of the class."
  *   *Why this matters:* If the King asks for "Horses" for his army, sending him "White Horses" might be fine. But if the King asks for "White Horses" for a ritual sacrifice, sending him "Black Horses" is a failure. If we treat the names as interchangeable, we fail the ritual. **Precision in language preserves social order.**

  ### Summary for Your Survey

  If you need to write about this or discuss it, here is the takeaway:

  1.  **The Argument:** Gongsun Long is not denying that white horses are physically horses. He is arguing that the **concept** "White Horse" is not logically identical to the **concept** "Horse."
  2.  **The Shape/Color Premise:** It is not decoration. It establishes that two distinct universals are being combined. It works for other modifiers ("Fast"), but Color/Shape was the standard metaphysical vocabulary for "Quality vs. Substance."
  3.  **The "Seeking" Move:** This demonstrates that the two terms have different **satisfaction conditions** (Intensions). The Advocate uses this to prove the concepts are distinct. The Objector fails because he keeps arguing about **class membership** (Extension).
  4.  **The Reconstruction:** Read him as a **Semantic Essentialist**. He believes language must map onto reality with perfect precision. "White Horse" and "Horse" map onto different realities (one specific, one general). To say they are "the same" is to blur the distinction between the specific and the general, which leads to logical and political confusion.

  The professor's "identity vs. predication" line is the technical way of saying: Gongsun Long is talking about **Definition** (Identity), and the Objector is talking about **Classification** (Predication). They are having two different conversations. Gongsun Long wins the logical argument about definitions; the Objector wins the common-sense argument about biology. Gongsun Long doesn't care about biology; he cares about the stability of Names.
