answer: |-
  Here is the pushback you asked for, followed by the drafted questions.

  ### Pushback on Your Setup

  You have a strong grasp of the literature, but there are two structural vulnerabilities in how you're framing this that a slippery speaker will exploit.

  1.  **The Burden of Proof Trap:** You want to press him on the empirical burden, but if you ask "Do you have evidence for X?", he will simply say "No, and neither do you, so we must act on the default." You need to shift the *normative* burden, not just the empirical one. In ethics, the burden of proof lies with the agent proposing an *active intervention* that causes death (conversion), not with those maintaining the status quo (preservation). If you frame it as "Who has the better data?", he wins on skepticism. If you frame it as "What level of certainty is required to justify mass killing?", he loses on precaution. I have adjusted the questions to reflect this.
  2.  **The "World Exploder" Dodge:** You asked about the disagreement with abolitionists. He will likely dodge by saying, "I am not an antinatalist about *all* life, only *wild* life where we cannot intervene." He will claim a distinction between "letting die/destroying habitat" and "active abolition." To corner him, you must ask if his *principle* entails abolition, even if his *policy* is currently limited by feasibility.
  3.  **The Political Question:** Asking if he worries about being "convenient for developers" often triggers defensiveness ("I follow the argument where it leads"). It is more effective to ask about *implementation risks*: "If your view is adopted, who executes the conversion, and do you trust them to minimize the suffering *during* the process?" This makes the same point without sounding like an ad hominem.

  I have cut the list to **eight** high-impact questions. I merged the "political" and "real-world" angles into one question about implementation risk, and I sharpened the "pasture" question to focus on the *unit of analysis*, which is your strongest lever.

  ***

  ### The Question Sequence

  **1. The Empirical Baseline (r-selection and Mortality)**
  *   **Question:** "Your thesis rests on the claim that wild lives are net negative, largely due to r-selected life histories and high juvenile mortality. But to move from 'high mortality' to 'net negative welfare,' you need a claim about the intensity of suffering versus the intensity of satisfaction in the time alive. What specific observation would count *against* your thesis? If we found a population with low juvenile mortality and high adult survival, would you concede their lives are net positive, or is the claim structural to wildness itself?"
  *   **Likely Answer:** He will likely say it's structural. Even survivors face predation risk, starvation, and disease. He will reiterate that the burden is on the conservationist to show positive balance.
  *   **Follow-up:** "If the claim is structural, then you aren't making an empirical claim about *this* forest versus *that* forest, but a metaphysical claim about the nature of evolution. If it's metaphysical, why does the burden of proof rest on empirical data? And if a death ends a life with no remembered past and no anticipated future, is that death a harm to the individual, or are you relying entirely on the asymmetry that non-existence is preferable to existence?"

  **2. The Sentience Filter (Invertebrates)**
  *   **Question:** "Let's narrow the scope. If we take invertebrates off the table due to uncertainty about sentience, does your conclusion survive on vertebrates alone? Or is the 'net negative' claim dependent on the sheer biomass of suffering invertebrates?"
  *   **Likely Answer:** He will likely argue we must act under uncertainty (precautionary principle) and assume invertebrates count, because the numbers are so vast they swamp the vertebrate calculation.
  *   **Follow-up:** "If we act under uncertainty regarding invertebrate sentience, why doesn't uncertainty cut the other way regarding the *value* of their lives? Given that habitat conversion is one-way and no one can compensate the animals that never get to exist, why does the precautionary principle mandate destruction rather than preservation? Why is the risk of creating suffering greater than the risk of destroying potential welfare?"

  **3. The Unit of Analysis (Per Animal vs. Per Hectare)**
  *   **Question:** "I want to press you on the metric. Consider an old-growth hectare versus that same hectare as cattle pasture. Nobody counts the pasture's own invertebrates—dung fauna, soil nematodes, the grass itself—or the cattle. Are you comparing welfare *per animal* or welfare *per hectare-year*? Because wild habitats have vastly higher invertebrate density than pastures."
  *   **Likely Answer:** He will likely try to pivot to "total welfare," arguing that even if density is lower in pastures, the *quality* of life is higher, or that cattle lives are net positive while wild lives are net negative.
  *   **Follow-up:** "If the metric is total welfare per hectare, you have to count the invertebrates in the pasture too. If wild invertebrates have net negative lives, but pasture invertebrates *also* have net negative lives (just fewer of them), you are still advocating for mass death to reduce a negative sum. But if the answer is driven by the cattle, are you admitting the view isn't about 'wildness' but about substituting one species for another? Which hectare is worse, and is that answer driven by biology or by your welfare metric?"

  **4. The Mechanism of Harm (Tidy vs. Messy Conversion)**
  *   **Question:** "Your thesis treats habitat destruction as a clean deletion. But habitat destruction as actually practised isn't clean—it's fires, edge effects, starvation, displacement onto roads and farmland. Is your thesis about conversion in the real world or about a hypothetical tidy conversion?"
  *   **Likely Answer:** He will concede it's messy but argue the long-term reduction in wild animal suffering outweighs the short-term spike in suffering during conversion.
  *   **Follow-up:** "So you are trading a certain, intense, short-term suffering spike for a probabilistic long-term gain. Given that the agents of conversion (loggers, developers) have no incentive to minimize that transition suffering, how do you square this with the requirement for empirical certainty? Are you endorsing the *actual* process of development, or a theoretical one that doesn't exist?"

  **5. The Burden of Intervention (Status Quo Bias)**
  *   **Question:** "You've mentioned several times that the burden is on the conservationist to show numbers go the other way. But in ethics, the burden of proof usually lies with the agent proposing the active intervention that causes death. Why should preservation, which is often passive (letting be), carry the same burden as conversion, which is active killing?"
  *   **Likely Answer:** He will argue that 'letting be' is itself a choice with consequences (allowing suffering to continue), so the distinction between acting and omitting is morally irrelevant.
  *   **Follow-up:** "If acting and omitting are irrelevant, then we are responsible for all suffering we can prevent. That implies a duty to intervene in nature far beyond habitat conversion—to cure diseases, stop predation, etc. Do you accept that duty? If not, why is habitat destruction the specific line where the duty to intervene begins?"

  **6. The Totalist/Person-Affecting Fork**
  *   **Question:** "If the ideal outcome is a world with no wild animals in it, what exactly is left of your disagreement with the people who want to abolish predation entirely? If the goal is minimizing negative welfare, does it matter whether the animals are removed by habitat loss or by genetic engineering?"
  *   **Likely Answer:** He will likely distinguish based on feasibility or side-effects, arguing that abolition is currently impossible, whereas habitat conversion is happening anyway.
  *   **Follow-up:** "So the disagreement is purely tactical, not principled. If that's the case, what do you say to the intuition that biodiversity has value that isn't welfare value? If a world with one species of happy cow is better than a world with a thousand suffering species, do you accept that trade-off explicitly?"

  **7. Implementation and Trust (The Political/Practical Angle)**
  *   **Question:** "You argue that conversion is a net favor. But this view is awfully convenient for developers who have economic incentives to destroy habitat. Does the view worry you politically? Specifically, if your view becomes policy, how do you prevent it from being used to justify destruction in cases where the welfare calculus *doesn't* hold, simply because the monitoring is too hard?"
  *   **Likely Answer:** He will say truth is truth, and we shouldn't suppress ethical arguments because they are politically inconvenient. He will argue for strict criteria on when conversion is permissible.
  *   **Follow-up:** "But if the criteria rely on complex empirical welfare calculations that we currently can't make (as you admitted in Q1), then the 'strict criteria' are unenforceable. Aren't you effectively providing an ethical blank check for destruction under the guise of altruism? How do you manage that epistemic risk?"

  **8. The Falsification Condition**
  *   **Question:** "To close: You've framed this as an empirical question. What specific data, if discovered tomorrow, would force you to abandon the thesis? Is there a survivorship curve, a behavioral marker, or a welfare metric that, if proven, would make you a conservationist?"
  *   **Likely Answer:** (This is the trap). He might say "If we proved wild lives were net positive."
  *   **Follow-up:** "But given that you argue the default assumption is net negative due to the structure of evolution, aren't you making the claim unfalsifiable? If the burden is always on the conservationist to prove positivity, and nature is defined by competition, have you actually set up a position that can never be empirically defeated, regardless of the data?"

  ***

  ### Moderation Advice

  *   **Watch the "Empirical" Dodge:** In Q1 and Q5, he will try to retreat to "We just don't know." Your counter is always: "If we don't know, why act?" The default in uncertainty should be non-maleficence (do not kill), not speculative beneficence (kill to save from suffering).
  *   **The Pasture Question (Q3) is your Ace:** This is where most WAS (Wild Animal Suffering) theorists get tangled. They want to count wild insects as suffering but ignore pasture insects. If he admits pasture insects count, the "net benefit" of conversion shrinks drastically. If he admits they don't count, he's being arbitrary about sentience. Press this hard.
  *   **Time Management:** If he gives long, evasive answers, cut him off politely but firmly: "I want to press you on the implication of that answer for [next topic]..."
  *   **Tone:** Keep it collaborative. "Help me understand how this fits with..." works better than "You're contradicting yourself." It makes the contradiction more visible to the audience when he struggles to reconcile it.
