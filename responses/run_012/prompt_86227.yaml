      *   **Speaker B (Defender/Realist):** Argues this is a genetic fallacy. Origins don't determine validity. Intuition can be reliable (like perception). MFT can't debunk normativity without using normativity. Disagreement doesn't prove no truth (analogy to physics/math). Researchers use argument to persuade, implying argument works.

