      *   *Pivot:* The dispute becomes genuine at Move 7/8 regarding whether correlation with temperament *necessarily* precludes truth-tracking.

  5.  **What Both Are Missing:**
      *   **A:** Misses that intuition can be trained/refined (expertise model). Misses that "post hoc" reasoning can still refine future intuitions (Haidt allows for private reflection).
      *   **B:** Misses that MFT specifically suggests foundations are evolutionary adaptations for *cohesion*, not *truth*. The "function" of the mechanism matters.
      *   **Framework Limits:** MFT describes *variations* in moral taste. It cannot measure *moral truth* because it has no independent metric for truth. It is descriptive psychology, not meta-ethics.

  6.  **The Verdict:**
      *   Does MFT tell us who is right? No.
      *   Does it tell us *why* we disagree? Yes.
