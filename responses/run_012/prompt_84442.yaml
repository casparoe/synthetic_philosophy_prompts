      *   I am in Unfavorable branch (I am asked).
      *   EDT: Knows I am in Unfavorable branch. Reward = 0. Pay Invoice = -$1k. Dispute = $0. Verdict: Dispute.
      *   FDT: Policy "Pay" -> Predicted Pay -> Invoice -> Pay -> Net -$1k. Policy "Dispute" -> Predicted Dispute -> No Invoice -> Net +$10k.
      *   Wait. If I am *already asked*, can I switch to Dispute to get the $10k?
      *   No, the prediction is past. If I Dispute, the prediction was *already* Pay. So I get $0 Reward + Save $1k.
      *   If I Pay, prediction was Pay. $0 Reward - $1k.
      *   So *ex-post*, FDT also Disputes?
      *   No, FDT is *Updateless*. It asks: "What policy should I have committed to?"
      *   If I commit to "Pay when asked", Prediction = Pay. I get -$1k.
      *   If I commit to "Dispute when asked", Prediction = Dispute. I get +$10k (and am not asked).
      *   But I *am* asked.
      *   This is the crux of Counterfactual Mugging. FDT pays *even when asked* because it respects the ex-ante commitment.
      *   Why? Because if I don't pay when asked, I am the type that doesn't pay, so I wouldn't get the reward in the other branch.
      *   But in this specific "Mugging" setup (Reward in other branch), if I am asked, the reward is *already lost*.
      *   Standard Counterfactual Mugging: Omega asks for $100. If you *would have paid*, Omega gives $10k to charity (or you in the other branch).
      *   If I am asked, Omega predicted I would Pay.
      *   If I Pay: -$100. (Reward already given in other branch).
      *   If I Dispute: $0. (Reward already given in other branch).
      *   So ex-post, Dispute dominates.
      *   FDT says Pay. Why? To maintain the integrity of the decision algorithm *across possible worlds*.
      *   Okay, I will articulate this carefully. The "Test" asks if EDT flips while Subjunctive does not.
      *   EDT: Flips (Pay in Newcomb -> Dispute in Mugging).
      *   FDT: Stays (Pay in Newcomb -> Pay in Mugging).
      *   This is the desired result.

      *   *Wait, one nuance:* In the Newcomb case (Original), FDT Pays. In the Mugging case, FDT Pays.
      *   Does FDT *actually* Pay in the Mugging case *ex-post*?
      *   Yes, UDT/FDT agents pay Counterfactual Muggings.
      *   So the test holds.

      *   *Final Feasibility Check:* "If some part of my specification cannot be satisfied jointly... tell me."
      *   The constraint "Revealing the settled fact... must not change what I should have done" is incompatible with EDT in the Mugging variant. EDT *will* change its verdict upon learning it is in the "Asked" branch.
      *   I must point this out. The constraint essentially presupposes Updatelessness.
      *   I will highlight this in the "Feasibility" section.

      *   *Wait, one more thing:* "The other party must be an ordinary person or firm... predicts you by a mechanism you state in one sentence."
