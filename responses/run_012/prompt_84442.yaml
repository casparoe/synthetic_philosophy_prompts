  I write backend infrastructure for a living and have no formal philosophy training, so I want to be upfront that I may be misusing the vocabulary. I've joined a reading group that has spent a few sessions on decision theory, and my turn has come around; instead of presenting someone else's problem again, I've been asked to bring in a case of my own construction, and I'd like help building it so that it actually works. The exercise is meant to settle a question the group keeps going around in circles on: whether the acausal style of argument does any real work, or whether the cases that make it vivid all secretly contain an ordinary evidential channel that a careful evidentialist could point to. What I want, then, is a single one-shot case with no repeat play, sitting in the gap between counterfactual mugging — where you are asked to pay in the branch you are actually in, but the reward was made contingent on what you would have done in a branch you never see — and the blackmail-flavored family, where the payment you are asked for is itself evidence about a state of the world that was settled before you chose and that happens to be in your favor. Constraints, because I've seen how these arguments get dismissed: no Omega, no perfect predictors, no simulation arguments, no exotic physics, no infinite decision procedures, and no acausal trade with unrelated agents. The other party must be an ordinary person or firm with an ordinary motive, who predicts you by a mechanism you state in one sentence — a long public history of your choices, a model trained on your past decisions, an established pattern of behaviour — with accuracy that is good but comfortably short of certainty. The sums involved should be money a person could plausibly be offered, the scenario itself should fit in one paragraph, and one further constraint matters to me more than the rest: I must know my own decision procedure, my choice must not depend on randomness or on my own uncertainty about what I will do, the correlation between the settled fact and my choice must run only through the other party's model of me and never through my choice causing anything, and revealing the settled fact to me after I have chosen must not change what I should have done. I don't want the evidential force to exist only while I'm ignorant.

  After the scenario, please do the full audit rather than a literature summary. State the verdicts of causal decision theory, evidential decision theory, and functional or subjunctive or updateless decision theory, and give the actual reasoning for each on this case, including precisely where the theories disagree about what a correlation is evidence for; I want the argument, not the conclusion. Then run the test that the whole exercise turns on: name the single feature that is doing the work of making the evidential theory pay here, and then move the payoff so that the favorable branch is one in which I am never asked at all, which is the standard counterfactual mugging shape. Tell me whether the evidential verdict flips while the subjunctive one does not, and if it does, exactly which premise changed in the move. If instead the case collapses into the standard mugging the moment I do that, say so plainly and tell me which part of my original construction was decorative.

  Finally, argue against me. Take the position of a causal decision theorist who suspects the whole thing is a trick — that the other party's model of me is not really a model of me, that I have smuggled in a causal channel, that the story presupposes the answer it wants — and state the strongest version of that attack, then say whether it succeeds against the case as specified or whether it only succeeds against a sloppier version of it. Since I would rather find out now than in front of the group, if some part of my specification cannot be satisfied jointly with the rest, tell me which part I have to give up instead of quietly bending it to make the case come out.
