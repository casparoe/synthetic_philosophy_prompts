answer: |-
  ### The Scenario: The Compliance Invoice

  CloudProvider Inc. sends you a $1,000 "compliance invoice" with a note: "Three days ago, our risk model (a neural net trained on your public git commit history) predicted with 90% accuracy whether you would Pay or Dispute this invoice. If it predicted Pay, we deposited $10,000 into your escrow account this morning; if it predicted Dispute, we deposited nothing. The escrow is yours to keep regardless of your choice, but the invoice is due now. The prediction is fixed, the deposit is done, and your choice cannot causally affect the past." You know your own decision algorithm perfectly, but the model's internal weights are proprietary noise to you, yielding the 10% error margin.

  ***

  ### The Audit

  **Causal Decision Theory (CDT)**
  *   **Verdict:** Dispute.
  *   **Reasoning:** CDT conditions only on the causal consequences of the act. The prediction and the deposit are in the past; your current choice cannot causally influence them. The state of the escrow ($10k or $0) is fixed independent of your action.
      *   If Escrow = $10k: Paying nets $9k; Disputing nets $10k. (Dispute is better).
      *   If Escrow = $0: Paying nets -$1k; Disputing nets $0. (Dispute is better).
      *   Since Dispute dominates Pay in both causal states, CDT mandates Dispute. CDT views the correlation between your choice and the prediction as a "common cause" (your stable psychology) that is already screened off by the fixed past.

  **Evidential Decision Theory (EDT)**
  *   **Verdict:** Pay.
  *   **Reasoning:** EDT conditions on the act as evidence. Choosing Pay is strong evidence that the model predicted Pay (90% likelihood), which is evidence that the $10,000 is in escrow. Choosing Dispute is evidence the model predicted Dispute, implying an empty escrow.
      *   $E[U|Pay] \approx 0.9(\$9,000) + 0.1(-\$1,000) = \$8,000$.
      *   $E[U|Dispute] \approx 0.9(\$0) + 0.1(\$10,000) = \$1,000$.
      *   EDT pays because it treats the correlation as actionable information. It does not require a causal channel, only that the act updates the probability of the favorable state (money in escrow).

  **Functional Decision Theory (FDT) / Updateless Decision Theory (UDT)**
  *   **Verdict:** Pay.
  *   **Reasoning:** FDT treats your decision procedure as a logical function that the predictor simulated. Your output *now* is logically correlated with the predictor's output *then*, not because of causation or mere statistical correlation, but because they are instances of the same logical fact.
      *   If your algorithm outputs "Pay", the predictor (running a high-fidelity approximation of that algorithm) likely output "Predict Pay", placing the money.
      *   FDT asks: "What output from my decision function yields the highest utility?" Outputting "Pay" logically implies the $10k exists. Outputting "Dispute" logically implies it does not.
      *   FDT pays because it optimizes the *policy*, recognizing that the prediction is subjunctively dependent on the choice, even if causally independent.

  **Where They Disagree:**
  The disagreement centers on **what the correlation is evidence for**. CDT sees the correlation as a fossil of the past (your past psychology caused both the prediction and the choice); therefore, conditioning on the choice provides no new information about the past prediction. EDT sees the correlation as live evidence; conditioning on the choice updates the probability of the past prediction. FDT sees the correlation as a logical identity; the choice *is* the prediction in abstracto, so optimizing the choice optimizes the prediction.

  ***

  ### The Test: The Counterfactual Shift

  **The Modification:**
  We move the payoff to the branch where you are never asked.
  *New Rule:* "If the model predicted Dispute, we credit you $10,000 and send **no invoice**. If the model predicted Pay, we send you this $1,000 invoice and credit you **nothing**."
  *Situation:* You are holding the invoice.

  **The Verdicts:**
  *   **EDT Flips (Pay $\to$ Dispute):** Because you have been asked, you know with near-certainty that the model predicted Pay. Therefore, you know the $10,000 reward is *not* yours (it was allocated to the branch you aren't in). Paying costs $1,000 for no gain. Disputing saves $1,000. The evidential link is screened off by the fact of being asked.
  *   **FDT Stays (Pay $\to$ Pay):** FDT is updateless. It evaluates the policy *ex-ante*, before knowing which branch you are in. The policy "Pay when asked" leads to the prediction "Pay" (Invoice, No Reward). The policy "Dispute when asked" leads to the prediction "Dispute" (No Invoice, Reward). To be the type that gets the $10,000 in the other branch, you must be the type that Pays in this branch. FDT pays to maintain the integrity of the algorithm across logical possibilities, even though the causal reward is lost.

  **Which Premise Changed?**
  The premise that changed is **the availability of the reward in the actual branch**. In the first case (Newcomb), the reward was present in the actual branch, contingent on the prediction. In the second (Mugging), the reward is absent in the actual branch, contingent on the *counterfactual* prediction. EDT fails because it updates on the information "I am in the bad branch." FDT succeeds because it refuses to update on indexical information about which branch it is in, optimizing the global policy instead.

  ***

  ### The Causal Attack

  **The Argument:**
  "This case is a trick of language. You claim the model predicts me, but I know my own decision procedure. If I know my code, and the model is deterministic, I know the prediction. If there is noise (the 10% error), then the model is not predicting *me*, it is guessing at noise.
  More critically, you have smuggled in a causal channel. The model predicts based on my *past* git history. My current choice is caused by my *current* psychology. The correlation exists only because my psychology is stable over time. This is a Common Cause structure (Past Self $\to$ Prediction AND Past Self $\to$ Current Choice).
  CDT correctly identifies that my *current* choice cannot reach back and change the *past* prediction. By paying, I am not 'making' the money appear; I am merely throwing away $1,000 because I happen to be the kind of person who was predicted to do so. The 'winning' policy only works if I can pre-commit *before* the prediction is made. But I am already here, invoice in hand. The horse has left the barn. Paying now is superstition."

  **Assessment:**
  *   **Does it succeed against the case as specified?** No. It succeeds against a sloppier version where the agent *doesn't* know they are in a one-shot, or where pre-commitment is impossible. The case specifies a "decision procedure" that is known. FDT argues that knowing your procedure *is* the ability to pre-commit, because your procedure is timeless logic.
  *   **However,** the attack exposes the **Feasibility Constraint Violation**: You required that "revealing the settled fact to me after I have chosen must not change what I should have done."
      *   In the **Mugging Variant**, if I Pay and then learn "Prediction was Pay" (which I already knew by being asked), I have lost $1,000 with no reward.
      *   If I learn *after* the fact that the prediction was indeed Pay, CDT says "You should have Disputed."
      *   FDT says "You did the right thing ex-ante."
      *   **The Conflict:** Your constraint demands that the verdict remains stable after the reveal. This is only possible if you adopt an **Updateless** perspective (FDT/UDT). EDT *cannot* satisfy this constraint in the Mugging variant; EDT *must* change its verdict upon learning it is in the "Asked" branch.
      *   **Conclusion:** You cannot satisfy the "Stable Verdict after Reveal" constraint jointly with "EDT is a valid candidate for evaluation." The case inherently biases toward Updateless theories. If you want to test EDT fairly, you must drop the constraint that the verdict shouldn't change upon learning the branch. If you keep the constraint, you have already ruled out EDT by fiat.

  **Recommendation:**
  Drop the constraint: *"revealing the settled fact to me after I have chosen must not change what I should have done."*
  Replace it with: *"revealing the settled fact must not change the ex-ante optimality of the policy."*
  This allows EDT to flip in the Mugging test (which is the point of the test) without violating the case design, while preserving the core question of whether acausal logic holds.
