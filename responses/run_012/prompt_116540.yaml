      Let's assemble.

      *Inequality Detail:*
      Let $L_{beef}$ = Land for beef, $L_{plant}$ = Land for plants.
      Let $D_{pasture}$ = Death density pasture, $D_{crop}$ = Death density crop.
      Inversion condition: $L_{beef} \times D_{pasture} > L_{plant} \times D_{crop}$.
