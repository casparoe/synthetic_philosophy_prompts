      *Wait, one detail:* "Before I flip the second deck, each table writes down which card they think will win". I need to ensure this is in the rounds.
      *Round 1:* Plan diet + Predict winner.
      *Round 2:* Reveal mortality + Calc.
      *Round 3:* Valence flip.
      *Round 4:* Debrief.

      *Refining `card_numbers`:* I will provide specific index numbers for the cards to make it printable, but label them as "Normalized Units" to avoid false precision claims. I will explicitly state the inequality required.

      *Refining `cannot_reproduce`:* The prompt asks for "array of strings".
      *Refining `predictable_failures`:* Array of objects {what_goes_wrong, how_to_handle}.

      *Let's write the JSON.*

      *Check:* "Don't hand me real figures you can't back up — instead tell me the inequality the card values have to satisfy for the inversion to appear at all, and what the session becomes if that inequality fails".
      Okay, I will put the inequality and the failure mode in `card_numbers`. I will also provide *example* printable numbers that satisfy it, but label them as "Illustrative Indices".

      *Check:* "No lecture up front... only get named in the debrief."
      *Check:* "Debrief should be straight with me about what this setup can't show."

      *Final check on fields:*
      activity_name
      setup (venue, group size, minutes) -> Object
