      *   `rounds`: [1: Plan Diet, 2: Reveal Mortality & Calc, 3: Valence Flip, 4: Debrief]
      *   `card_numbers`: { "values": {...}, "inequality": "H_beef * M_pasture > H_crop * M_crop", "failure_mode": "If inequality fails, pasture wins, lesson collapses to standard vegan argument" }
      *   `debrief_map`: [...]
      *   `predictable_failures`: [...]
