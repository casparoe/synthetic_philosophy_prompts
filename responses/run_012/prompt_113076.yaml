prompt: |-
  Ok so I've somehow been voluntold to run the next session of our local rationalist-ish reading group — it's about fifteen people, smart, numerate, mostly programmers and a couple of med students, nobody with actual philosophy training, and we have 90 minutes and a whiteboard. Topic is the inefficacy objection: the "my individual contribution to this collective harm makes no difference, so what's the point" thing, across the big three (climate, meat, voting). I don't want you to explain the topic to me — I can more or less do that. I want you to plan how I should teach it. Like, the teaching plan.

  What I need from you, roughly in order of how much I care:

  1. The order the ideas have to go in, and why each one depends on the previous. My instinct is that the whole thing hinges on one move — getting people to stop thinking of causation as on/off ("did I cause it?") and start thinking in terms of difference-making and marginal effects — and that until that's in place everything else is noise. But I might be wrong about where the load-bearing bit is. Tell me what genuinely has to come first, and what I'll lose if I skip a step.

  2. The one example that carries the whole session, and what it has to have. I was going to build on voting, but I suspect voting is a bad carrier because it has a clean threshold — there's a fact of the matter about whether you're pivotal, so students can just do the probability arithmetic and walk away feeling fine. Meat has the marginal-production story, climate has neither a clean threshold nor clean attribution. Which do I build on, and what does that example need to have (and lack) to keep the real puzzle alive? Also, I vaguely remember some thought experiment with a thousand torturers each turning a dial a thousandth of a degree, so nobody's pain is perceptibly worse but the victim is being tortured — I think it's Parfit, maybe not, but something like that. Should that be the carrier, or is it too tidy?

  3. The misconceptions I should expect, and exactly where in the sequence to head each one off. My guesses: (a) "the outcome would've been the same without me, therefore no difference" — the fixed-pie / supply-doesn't-respond fallacy; (b) "one vote can't decide an election" conflating being decisive with having influence; (c) "no perceptible difference = no difference"; (d) assuming the arithmetic settles it, when the arithmetic answer is itself the contested part. Which of those are real, which am I making up, and what am I missing? Especially: do people reliably conflate causal contribution with complicity, or do they keep them apart better than I think?

  4. How I'll know by the end whether they actually got it, rather than just feeling bad about eating burgers. One question, ideally.

  5. What I should openly refuse to cover at this level and say so.

  And one thing I really care about: keep the settled stuff and the genuinely contested stuff separate. I have a nagging feeling the blogosphere presents "buying meat causes animals to be bred and killed" and "your vote has nonzero expected impact" as much more settled than they are among people who've actually worked on this, and I don't want to stand up there and present one camp's answer as the consensus. Where the field is split, say so, and tell me which way you're leaning and why. Don't send me readings or a bibliography, I'm not assigning anything and I'd just be bluffing about citations anyway.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **User:** Running a rationalist-ish reading group (15 people, smart, numerate, programmers/med students, no philosophy training).
      *   **Task:** Plan a 90-minute session on the "Inefficacy Objection" (individual impact on collective harm: climate, meat, voting).
      *   **Constraints:** Do *not* explain the topic (they know it). Focus on *teaching plan*.
      *   **Priorities:**
          1.  Order of ideas (dependency chain).
          2.  The one carrier example (Voting vs. Meat vs. Climate vs. Parfit's Torturers).
          3.  Misconceptions (where to head them off).
          4.  Assessment (one question to check understanding).
          5.  Scope (what to refuse to cover).
          6.  **Crucial:** Distinguish settled vs. contested claims. Don't present contested philosophy as consensus.

  2.  **Deconstruct the Topic (Inefficacy Objection):**
      *   *Core Claim:* My action makes no difference to the outcome.
      *   *Core Counter:* Expected Utility (probability $\times$ impact) or Marginal Contribution.
      *   *The "Move":* Shifting from binary causation ("Did I *cause* the flood?") to marginal contribution ("Did I add to the volume?").
      *   *The Nuance:* Non-linearities, thresholds, supply chains, causal chains.

  3.  **Address Priority 1: Order of Ideas:**
      *   User's instinct: Causation (on/off) $\to$ Difference-making (marginal).
      *   *Critique:* This is correct, but it needs a precursor. Before discussing *how* to measure impact, you need to establish *why* we care about impact. If the goal is moral purity, inefficacy doesn't matter. If the goal is consequence, it does.
      *   *Sequence:*
          1.  Define the goal (Consequentialism vs. Deontology/Virtue). If you aren't a consequentialist, stop here. (Crucial filter).
          2.  The Binary Trap (Threshold thinking).
          3.  The Marginal Shift (Expected Value/Contribution).
          4.  The Complication (Non-linearity/Uncertainty).
          5.  The Application (Meat/Climate/Voting).
      *   *Why:* If you skip step 1, deontologists will argue past consequentialists. If you skip step 2, they stay in threshold land. If you skip step 4, the math looks too easy and they reject it as unrealistic.

  4.  **Address Priority 2: The Carrier Example:**
      *   *Voting:* Too clean. Threshold is obvious. EV calculation is standard. Doesn't capture the "continuous harm" vibe of climate/meat.
      *   *Climate:* Too messy. Attribution is hard. Feedback loops confuse the causal chain.
      *   *Meat:* Strong candidate. Supply chains are opaque but marginal demand theory is standard econ.
      *   *Parfit's Torturers:* Excellent for intuition pumping, but abstract.
      *   *Decision:* Use **Meat** as the primary carrier, but use **Parfit's Torturers** as the intuition pump *before* introducing the meat math.
      *   *Why:* Meat has the right mix of threshold (an animal is killed or not) and marginality (demand triggers supply). It feels personal. Parfit clears the "perceptibility" bias.
      *   *Requirements:* The example must lack a *visible* threshold (you don't see the cow die when you buy the burger) but have a *statistical* threshold. It must avoid the "fixed pie" fallacy (supply responds).

  5.  **Address Priority 3: Misconceptions:**
      *   (a) Fixed-pie/Supply: Real. Needs addressing in the Meat section.
      *   (b) Decisive vs. Influence: Real in Voting. Needs addressing there.
      *   (c) Perceptible = Real: Real. Addressed by Parfit.
      *   (d) Arithmetic settles it: **Very Real.** This is the biggest trap. The math is easy; the *inputs* (probabilities, causal links) are contested.
      *   (e) Causation vs. Complicity: User asks about this. People conflate them. "I didn't kill it" vs. "I paid for it." Need to separate *causal impact* from *moral blame*.
      *   *Timing:* Address (c) early (Parfit). Address (a) during Meat. Address (b) during Voting (if covered). Address (d) and (e) in the synthesis/conclusion.

  6.  **Address Priority 4: Assessment:**
      *   Need a question that tests the *structure* of the argument, not the conclusion.
      *   *Idea:* Present a scenario where the marginal impact is tiny but non-zero, and the threshold is unclear. Ask them to calculate EV or justify inaction.
      *   *Better:* Ask them to identify *which premise* of the inefficacy argument fails in a specific case.
      *   *Best:* "Under what conditions does the inefficacy objection *actually work*?" (Forces them to identify the boundary conditions of the counter-argument).

  7.  **Address Priority 5: Scope (What to refuse):**
      *   Don't solve the "Non-Identity Problem."
      *   Don't solve "Ideal vs. Non-Ideal Theory" (what if everyone else defects?).
      *   Don't solve "Moral Uncertainty" (what if consequentialism is wrong?).
      *   Don't calculate the exact EV of a burger (too much dispute).

  8.  **Address Priority 6: Settled vs. Contested:**
      *   *Settled:* Expected Utility theory is the standard framework for consequentialists. Marginal demand affects supply in competitive markets (basic econ).
      *   *Contested:* The *magnitude* of the impact (how many animals per burger? 1/100? 1/1000?). The *linearity* of climate impact. The *moral weight* of small probabilities (Pascal's Mugging risks). Whether complicity requires causal impact.
      *   *Stance:* Lean towards "Marginalism is the correct framework, but the inputs are uncertain."

  9.  **Drafting the Plan (Iterative refinement):**
      *   *Intro:* 10 mins. Set the stage. Consequentialism check.
      *   *Phase 1:* The Intuition Pump (Parfit). 15 mins. Break the "perceptible" bias.
      *   *Phase 2:* The Mechanism (Meat). 30 mins. Apply marginalism. Address supply chains.
      *   *Phase 3:* The Complication (Voting/Climate). 20 mins. Show where the math gets hard.
      *   *Phase 4:* Synthesis & Assessment. 15 mins.
      *   *Whiteboard:* Use it for the causal chain and the EV formula.

      *Refining the "One Move":* The user thinks it's Causation $\to$ Marginal. I think it's **Goal $\to$ Metric**. You have to agree you care about outcomes before you care about margins. I will emphasize this.

      *Refining the Example:* Parfit is too abstract to carry the whole thing. Meat is too messy to start with. Start with Parfit to break the brain, move to Meat to apply the fix.

      *Refining Misconceptions:* The "Arithmetic settles it" is the most dangerous. I need to make sure the user knows to highlight that the *inputs* are the fight, not the *operation*.

      *Reflected on "Settled vs. Contested":* Be explicit. "Philosophers agree on the framework, economists disagree on the elasticities."

  10. **Final Review against constraints:**
      *   90 mins? Yes, timing looks tight but doable.
      *   15 people? Needs discussion, not lecture.
      *   No readings? Okay.
      *   Tone: Rationalist, numerate, precise.

      *(Self-Correction during drafting)*: Wait, 90 minutes is short for all three (Climate, Meat, Voting). I should advise them to pick *one* application after the Parfit intro, rather than trying to do all three. Meat is the most pedagogically rich for "marginal vs threshold." Voting is good for "probability." Climate is too vague. I'll recommend Meat as the deep dive, Voting as a contrast.

      *(Self-Correction on Assessment)*: The question "When does the objection work?" is good. It forces them to find the limit case (e.g., if supply is perfectly inelastic, or if probability is truly zero).

      *(Self-Correction on Settled/Contested)*: Make sure to mention the "Causal Isolation" problem. Some argue that in overdetermined cases, you *didn't* cause it. Counterfactual vs. Probabilistic causation.

      *Let's structure the response clearly according to the user's 5 points + the Settled/Contested constraint.*

      *Wait, one more thing:* The user mentioned "nobody with actual philosophy training." Avoid jargon like "overdetermination" or "deontic constraints" without defining them simply. Keep it "programmer/med student" friendly (systems thinking, physiology analogies).

      *Final check on the "One Move":* I agree with the user that Causation $\to$ Marginal is the load-bearing beam. But I will argue that *Consequentialism* is the foundation holding the beam up. If they aren't consequentialists, the beam doesn't matter.

      *Okay, ready to write.*
answer: |-
  Here is a teaching plan designed for a numerate, philosophy-naive group. It prioritizes structural clarity over breadth.

  ### 1. The Order of Ideas (The Dependency Chain)

  Your instinct is half-right. The shift from **Binary Causation** to **Marginal Contribution** is the load-bearing beam, but it rests on a foundation you cannot assume. If you skip the foundation, the beam collapses.

  **The Sequence:**
  1.  **The Goal (Consequentialism):** Establish that we are evaluating actions based on *outcomes*, not *purity*.
      *   *Why first:* If a participant believes morality is about "keeping one's hands clean" (deontology/virtue ethics), the inefficacy objection doesn't matter to them, and the marginal math is irrelevant. You must get consensus that "making things better" is the metric.
  2.  **The Trap (Threshold Bias):** Demonstrate the intuitive belief that causation requires a visible tipping point.
      *   *Why second:* You need to induce the cognitive error before you fix it. If you jump straight to the solution, they won't feel the pull of the objection.
  3.  **The Fix (Expected Value/Marginalism):** Introduce the mathematical framework (Probability $\times$ Impact).
      *   *Why third:* This is the tool that solves the Trap, but only for those who accept the Goal.
  4.  **The Friction (Uncertainty & Causal Chains):** Acknowledge that while the *math* is settled, the *inputs* (probabilities, causal links) are messy.
      *   *Why last:* This prevents the "arithmetic settles it" fallacy. It distinguishes the *principle* (which is robust) from the *application* (which is disputed).

  **What you lose if you skip a step:**
  *   Skip **Goal**: You end up in a meta-ethical brawl about whether morality is about consequences or intentions.
  *   Skip **Trap**: They won't understand why the "I didn't kill the cow" intuition is wrong; they'll just think you're doing math for no reason.
  *   Skip **Friction**: You look dogmatic. They will leave thinking you claim buying a burger *definitely* kills 0.0001 cows, rather than that it *risks* contributing to a system that does.

  ---

  ### 2. The Carrier Example

  **Do not use Voting as the carrier.** It is too clean. The threshold is legal and binary. The probability is calculable (however small). It allows participants to say, "Okay, EV is non-zero, but it's $10^{-7}$, so I'm practically off the hook," and walk away satisfied.

  **Do not use Climate as the carrier.** It is too diffuse. The causal chain involves feedback loops, atmospheric chemistry, and policy lag. It invites "my contribution is lost in the noise" arguments that are hard to model on a whiteboard in 10 minutes.

  **Use Meat (specifically the supply chain) as the carrier, primed by Parfit.**

  *   **The Primer (5 mins):** Use Parfit's **Torturers**.
      *   *Setup:* 1,000 torturers. 1,000 dials. Each turns their dial one notch. The victim's pain increases imperceptibly per notch, but is agonizing at the end.
      *   *Function:* This breaks the **"Perceptible Difference = Real Difference"** bias. It isolates the moral intuition from the economic mechanics.
  *   **The Carrier (30 mins):** **The Supermarket Chicken.**
      *   *Why:* It has a hidden threshold. A store orders in crates. A crate holds $N$ chickens. If demand crosses the threshold of a crate, an order is placed, and chickens are bred/killed. If it doesn't, they aren't.
      *   *What it must have:* **Inventory buffers.** This is crucial. It explains why your specific purchase doesn't *immediately* kill a bird (addressing the "I bought the last one" vs. "I bought a random one" confusion).
      *   *What it must lack:* **Perfect Information.** You don't know where the threshold is. This forces the use of *probability* rather than certainty.

  **Why this combination works:** Parfit handles the moral intuition (small differences matter). Meat handles the causal mechanism (how small differences trigger large outcomes via supply chains).

  ---

  ### 3. Misconceptions & Interception Points

  Here are the real ones, where they appear, and how to head them off.

  | Misconception | Where it appears | How to head it off (Whiteboard Move) |
  | :--- | :--- | :--- |
  | **"Perceptible = Real"** (If I can't see the harm, it isn't there) | **During Parfit.** | Draw the pain curve. It's continuous. Mark the "just noticeable difference." Show that the moral weight accumulates *under* the noticeability line. |
  | **"Fixed Pie"** (If I don't buy it, someone else will / Supply is static) | **During Meat.** | Draw the Supply Chain. Show the **Ordering Threshold**. Explain that purchases decrement the inventory counter. When it hits zero, a *new* order is triggered. Your purchase reduces the buffer. |
  | **"Causation = Complicity"** (I am only guilty if I am the *sole* cause) | **During Synthesis.** | Distinguish **Counterfactual Causation** ("Would it have happened without me?") from **Probabilistic Contribution** ("Did I raise the odds?"). Tell them: "We are evaluating *influence*, not *sole responsibility*." |
  | **"The Arithmetic Settles It"** (The math proves I'm obligated) | **At the very end.** | **Crucial:** Explicitly state that the *formula* is agreed upon, but the *variables* are not. Write $EV = P \times I$ on the board. Circle $P$. Say: "We agree on the multiplication. We fight about the probability." |

  **On Causation vs. Complicity:**
  People reliably conflate them. They think if they aren't the "but-for" cause (the specific straw that broke the camel's back), they are innocent. You need to explicitly decouple these.
  *   *Script:* "In a complex system, being the 'but-for' cause is rare. Being a 'contributing factor' is common. Consequentialism cares about the latter."

  ---

  ### 4. The Assessment Question

  Do not ask "Is eating meat wrong?" (That's a moral conclusion).
  Do not ask "Calculate the EV." (That's arithmetic).

  **Ask this:**
  > "Describe a specific scenario regarding a collective harm where the Inefficacy Objection **succeeds**. Under what exact conditions does your individual action make *zero* expected difference?"

  **Why this works:**
  *   If they say "Never," they haven't understood non-linearity or causal isolation.
  *   If they say "When supply is perfectly inelastic" (e.g., buying a unique antique, or a ticket to a sold-out show where no extra capacity exists), they understand the mechanism.
  *   It forces them to identify the *boundary conditions* of the argument (e.g., causal isolation, fixed supply, zero probability of pivotality).

  ---

  ### 5. Scope: What to Refuse to Cover

  You have 90 minutes. Do not let the group drift into these rabbit holes. Explicitly park them in a "Parking Lot" on the whiteboard.

  1.  **The Non-Identity Problem:** (i.e., "If we save the climate, different people will be born in the future, so we aren't saving *them*."). This is a metaphysical sinkhole. *Say:* "We are assuming the people affected exist regardless of our specific choice."
  2.  **Ideal vs. Non-Ideal Theory:** (i.e., "Why should I cooperate if everyone else defects?"). This is Game Theory/Prisoner's Dilemma. *Say:* "We are analyzing the causal impact of *your* move, holding others constant. We aren't solving coordination failure today."
  3.  **Moral Uncertainty:** (i.e., "What if consequentialism is false?"). *Say:* "We are analyzing the internal consistency of the inefficacy objection *given* a goal of reducing harm. We aren't debating the goal itself."

  ---

  ### 6. Settled vs. Contested (Crucial Distinction)

  You are right to be worried about presenting contested claims as consensus. Here is the map:

  **Settled (Among Consequentialists/Analysts):**
  *   **The Framework:** Expected Utility ($P \times I$) is the correct way to evaluate uncertain outcomes.
  *   **The Principle:** A small probability of a large harm can outweigh a certainty of a small benefit.
  *   **The Mechanism:** In competitive markets with inventory buffers, marginal demand *does* trigger marginal supply over time (the "Ordering Threshold" model).

  **Contested (Even Among Experts):**
  *   **The Magnitude (The $P$):** How many animals does one person save by going vegetarian? Estimates range from 1 per year to 1 per decade. The causal chain is opaque.
  *   **The Linearity (Climate):** Is climate damage linear with emissions, or are there thresholds/tipping points? If there are tipping points, marginal contributions near the tip have infinite value; far away, near-zero. We don't know where we are.
  *   **The "Complicity" Objection:** Some philosophers argue that even if you make *no difference*, participating in a wrongful practice is inherently wrong (Kantian/Contractualist view). This is a live debate, not a settled error.

  **My Lean:**
  I lean towards the **Marginalist/Expected Value** view.
  *   *Why:* The "Fixed Pie" fallacy is empirically false in most modern supply chains. Inventory systems are designed to respond to demand signals. While the *exact* number is unknowable, the *direction* of the causal arrow is positive.
  *   *Caveat:* I would explicitly tell the group: "The consensus is that the impact is non-zero. The disagreement is on whether it is large enough to override your personal utility. That is a value judgment, not a math problem."

  ### Summary of the 90 Minutes

  *   **00-10:** **Setup.** Define Goal (Consequences). Park meta-ethics.
  *   **10-25:** **Parfit.** Break the "Perceptible" bias. (Whiteboard: Pain Curve).
  *   **25-55:** **Meat.** The Supply Chain Model. (Whiteboard: Inventory Buffer & Threshold). Address "Fixed Pie."
  *   **55-75:** **Voting/Climate Contrast.** Briefly show where the model gets harder (Probability is lower, Causal chain is longer). Address "Arithmetic Settles It."
  *   **75-90:** **Synthesis.** Assessment Question. Parking Lot review.

  **Whiteboard Layout:**
  *   Left: Parfit's Curve (Continuous vs. Perceptible).
  *   Center: Supply Chain (Consumer $\to$ Inventory $\to$ Order Threshold $\to$ Production).
  *   Right: The Formula ($EV = P \times I$) and the Parking Lot.
