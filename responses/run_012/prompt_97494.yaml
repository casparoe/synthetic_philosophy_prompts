      *   *Key Distinction:* Instrumental value (helps you choose) vs. Intrinsic value (feels good/bad to know). Good only covers instrumental.
      *   *Reference:* Mention George Loewenstein (Carnegie Mellon) as the modern counterpoint. Mention "strategic ignorance."

