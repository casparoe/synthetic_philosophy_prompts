answer: |-
  Friends, colleagues, my mum.

  Dave and I argued for three hours last night. He's a good mate, and he's not wrong to be worried. His fear is simple: if you give power to two different people—a President you elect and a Parliament we choose—you invite a fight. He says it's a catastrophe waiting to happen. He says stick to the Westminster model because it's clean. One party wins, they pick a Prime Minister, they govern, you kick them out later.

  But I need you to look closely at that "clean" line. Because in the Westminster model, that chain of accountability isn't actually connected to you. It's connected to the party.

  Think about it. In a pure parliamentary system, you vote for a local representative and a party label. You do not vote for the Prime Minister. If the party decides halfway through the term that they don't like their leader, they swap them out in a backroom meeting. No election. No say. The government changes, but your vote stays the same. Dave calls this efficiency. I call it a disconnect.

  My proposal fixes that disconnect without breaking the government.

  Here is the logic of the design. We are splitting the job of leadership into two parts: the anchor and the captain.

  The President is the anchor. Directly elected by all of us for a single six-year term. They are not here to manage the health budget or set tax rates. They are here to ensure the system itself holds firm. They appoint the Prime Minister, but crucially, that Prime Minister must survive in this Parliament. The President holds a suspensive veto—they can pause a law and send it back for a second look, but if Parliament votes again, the law passes. They can stop haste, but they cannot stop the will of the representatives forever.

  The Prime Minister is the captain. They run the day-to-day. They come from the parties in this room. They are political. And yes, they can be fired. But here is the safety mechanism that Dave says is a fudge.

  To remove a Prime Minister, Parliament cannot just vote "no." You must vote "no" and name a replacement in the same breath. This is the constructive vote of no confidence. It means you cannot bring a government down just to force an election or create chaos. You can only change the driver if you have someone else ready to take the wheel.

  And to protect against the President trying to interfere too much? If Parliament does replace the PM, the President is locked out of dissolving Parliament for one year. No snap elections. No revenge moves. Just stability.

  Now, I am not going to stand here and tell you this is risk-free. Dave is right about one thing: having two sources of legitimacy creates tension. If the President and the Parliament are from opposing sides, they will disagree. That is not a bug; that is the feature.

  In the Westminster model, when the government has a majority, there is no tension. There is only velocity. They can pass anything until the next election. If they make a mistake, you have to wait years to fix it.

  In this hybrid model, the tension forces compromise. The President forces Parliament to think twice. Parliament forces the President to respect the political reality. It slows things down just enough to prevent rash decisions, but the constructive vote ensures it doesn't stop them completely.

  Dave says this is the worst of both worlds. I say it is the best of both worlds. It keeps the parliamentary flexibility we need for daily politics, but it gives you, the voters, a direct say in the head of state that cannot be traded away by party elites.

  We are writing a constitution for the next fifty years, not just for the next election cycle. Do we want a system that is simple for the parties to manage? Or do we want a system that is robust for the people to own?

  The Westminster model asks you to trust the party to choose the leader. My proposal asks you to choose the leader yourself, while keeping the Parliament responsible for the laws. It acknowledges that power is dangerous, so it divides the power not to create war, but to ensure that no single group—no single party, and no single person—can drive the car off the road without a check.

  It is more complex than the status quo. It requires more of us as citizens. But democracy was never supposed to be easy; it was supposed to be ours.

  Takeaway: A constitution shouldn't just make government easier; it should make power belong to you.
