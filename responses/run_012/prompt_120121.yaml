answer: |-
  You have put your finger on a genuine and persistent tension in the philosophy of science, one that is often glossed over in formal treatments of reduction but is unmistakable in laboratory practice. Your observation is sharp: the logic of reduction is downward (explanation flows from micro to macro), but the logic of *application* is upward (identification flows from macro to micro).

  To answer your first question directly: **No, there is no single, universally standardized term in the literature that captures this specific asymmetry of specification.**

  There are concepts that orbit it, and there are philosophers who have argued for versions of it, but the "standard furniture" you listed (Nagelian bridge laws, multiple realizability) indeed fails to capture the *order of operations* you describe. Bridge laws assume the terms on both sides are already intelligible and merely need connecting. Your point is that the lower-level terms are *not* intelligible as a description of *this* system without the higher-level terms doing the heavy lifting of individuation first.

  Here is an analysis of the closest existing concepts, followed by a proposal for a term that fits your description, and a delineation of its edges.

  ### 1. The Nearest Existing Neighbors

  While no single term names this pattern, three lines of thought come very close to your observation.

  **A. Contextual Emergence (Bishop, Silberstein, Atmanspacher)**
  This is the strongest existing candidate. Proponents of contextual emergence argue that lower-level constituents are necessary but not sufficient for higher-level properties. They claim that lower-level dynamics require "contextual constraints" provided by the higher level to define the relevant state space.
  *   *Where it fits:* It agrees that the micro-theory cannot generate the macro-description alone.
  *   *Where it differs:* "Emergence" often carries metaphysical baggage about novelty or causality that you might find unnecessary. Your point is not necessarily that the gas is "emergent" in a causal sense, but that it is *identifiable* only via the macro-vocabulary. You are describing an epistemic/pragmatic constraint, not necessarily an ontological one.

  **B. Asymptotic Reasoning (Robert Batterman)**
  In *The Devil in the Details*, Batterman argues that many macroscopic phenomena (like phase transitions or fluid dynamics) are mathematically singular limits of the micro-theory. To take the limit, you must already possess the macroscopic parameters (e.g., viscosity, temperature).
  *   *Where it fits:* It validates your claim that the micro-theory cannot "discover" the bond or the gas; the macro-parameters are required to set up the mathematical limit.
  *   *Where it differs:* Batterman focuses on the mathematical singularities. Your observation is broader, covering the conceptual identification of the system ("this is a gene") before the math even begins.

  **C. Operational Coherence (Hasok Chang)**
  In *Is Water H₂O?*, Chang argues that chemical kinds are not discovered by reduction but are stabilized through operational practices. The concept of "water" or "bond" is maintained because it works, not because it is successfully reduced.
  *   *Where it fits:* It aligns with your view that the higher-level vocabulary is load-bearing and not dispensable.
  *   *Where it differs:* Chang focuses on the history and philosophy of chemical kinds specifically, rather than the structural asymmetry of specification across sciences.

  ### 2. A Proposal: **The Individuation Asymmetry**

  Since no existing term captures the *directional dependency of identification* you describe, I propose we call this **The Individuation Asymmetry**.

  **Definition:**
  The Individuation Asymmetry is the structural feature of inter-theoretic reduction wherein the reducing theory (lower-level) possesses the computational capacity to model a system's behavior but lacks the conceptual resources to *individuate* the system as a unified object of study without borrowing criteria from the reduced theory (higher-level).

  In this asymmetry, the higher-level theory provides the **identity conditions** (what counts as *one* gas, *one* bond, *one* gene), while the lower-level theory provides the **dynamical account** (how that thing behaves).

  **Why this name?**
  *   **Individuation:** In metaphysics, individuation is the process by which distinct entities are distinguished and counted. Your example of the gas is perfect: statistical mechanics sees $10^{23}$ trajectories; thermodynamics sees *one* gas. The move from trajectories to gas is an act of individuation.
  *   **Asymmetry:** The higher level can individuate without the lower (I can point to a gas without knowing Avogadro's number). The lower level cannot individuate the higher without the higher (I cannot point to a "gas" using only quantum field theory without importing the macro-concept).

  ### 3. Edges and Exclusions

  You asked specifically whether this is simply the commonplace that "initial and boundary conditions must come from somewhere." It is not. Here is how **The Individuation Asymmetry** distinguishes itself from boundary conditions and other standard concepts.

  **A. Versus Boundary/Initial Conditions**
  *   **Boundary Conditions** fix *values* within a defined state space (e.g., "The pressure at the wall is 1 atm").
  *   **Individuation** defines *the state space itself* (e.g., "Pressure is a relevant variable here," or "This collection of particles constitutes a single thermodynamic system").
  *   *The Edge:* If the lower-level theory could accept the boundary conditions without understanding *what* they represent, it would be a boundary condition problem. But as you noted, the lower-level theory doesn't even know *which* quantities count as the boundary conditions (e.g., that "pressure" is the aggregate variable of interest) without the higher-level theory telling it. The dependence is on the **ontology**, not just the **parameters**.

  **B. Versus Bridge Laws (Nagel)**
  *   **Bridge Laws** connect two already-defined predicates (e.g., "Temperature = Mean Kinetic Energy").
  *   **Individuation Asymmetry** occurs *before* the bridge law can be applied. It concerns the identification of the *relata*. You cannot formulate the bridge law until the higher-level theory has told you that there is a "temperature" to be bridged.
  *   *The Edge:* Bridge laws are about derivation; Individuation Asymmetry is about **reference**.

  **C. Versus Multiple Realizability**
  *   **Multiple Realizability** argues that one macro-state can be realized by many micro-states (explaining why reduction is hard).
  *   **Individuation Asymmetry** argues that the macro-state is required to *select* the relevant micro-states (explaining why reduction is dependent).
  *   *The Edge:* Multiple realizability is a claim about the *mapping* (one-to-many). Individuation Asymmetry is a claim about the *direction of specification* (top-down).

  ### 4. Why This Matters

  If we accept the **Individuation Asymmetry**, it changes the status of the "reduced" science.

  In the classic Nagelian picture, the higher-level science is a placeholder waiting to be absorbed. In your picture (and the Individuation Asymmetry), the higher-level science is the **architect**, and the lower-level science is the **engineer**. The architect decides what is being built (the gas, the gene, the bond); the engineer calculates whether it will stand.

  This makes the higher-level vocabulary not merely heuristic or provisional, but **constitutively necessary** for the application of the lower-level theory. It validates your intuition that the reduction does not make the reduced vocabulary dispensable; it makes it load-bearing at the point of application.

  ### Summary

  You have not rediscovered boundary conditions. You have identified a semantic and pragmatic constraint on reduction that formal logic often misses.

  *   **Existing Closest Concept:** Contextual Emergence (but this is often metaphysical).
  *   **Proposed Term:** **The Individuation Asymmetry**.
  *   **Definition:** The dependence of lower-level theories on higher-level theories to define the identity conditions and system boundaries of the object being modeled.
  *   **Distinction:** Unlike boundary conditions (which fix values), individuation fixes *kinds*. Unlike bridge laws (which connect terms), individuation *creates the terms* for the connection.

  It is a pleasure to encounter a critique of reductionism born not from armchair speculation, but from thirty years of watching the equations fail to speak until the chemist tells them what they are about. You are describing the **pragmatic precondition of reduction**.
