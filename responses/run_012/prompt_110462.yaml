answer: |-
  The principle that best organizes these cases is the distinction between reasons that bear on the correctness or fittingness of an attitude and reasons that bear merely on the desirability of having it. On this view, a consideration counts as a genuine reason for an attitude only if it speaks to the standard of correctness internal to that specific attitude, whereas considerations that speak only to the good consequences of holding the attitude provide reasons to want, cultivate, or simulate the attitude, but not reasons for the attitude itself. For belief, the standard of correctness is truth; for fear, it is the presence of danger or threat; for amusement, it is the funniness or wit of the object. In the cases where you feel the reason is defective, such as the bribe to believe the Atlantic is the largest or the bonus for fearing a crash, the offered considerations do not make the proposition true or the market dangerous, but merely make holding the attitude profitable. Similarly, the doctor's advice and the friend's potential sadness offer reasons to want the belief or to perform the action of laughing, because they address the beneficial effects of the state rather than the features of the object that would make the state appropriate. This principle successfully preserves your verdicts on the dog and the joke, where the snarling and the humor are features of the objects themselves that satisfy the conditions for fear and amusement to be fitting responses.

  The challenge, as you note, is the case of gratitude toward your mother, where the intuition that her hurt feelings provide a reason for the feeling itself is strong. To maintain the unity and explanatory power of the fittingness principle across belief, fear, and amusement, one must be honest that this intuition is the verdict that requires surrender or significant revision. If we allow that the consequences of lacking an attitude can constitute a reason for having it in the case of gratitude, we lose the ability to distinguish it from the joke case, where the friend's sadness also stems from your lack of amusement. The strict principle dictates that the mother's hurt does not make the unwanted gift a benefit or the giver's intention benevolent, which are the conditions that make gratitude fitting, but rather gives you a compelling reason to cultivate the feeling or to act gratefully to preserve the relationship. Therefore, the principle classifies the mother's hurt as a reason to bring about the attitude or the associated behavior, not as a reason that makes the attitude itself correct. This distinction clarifies what to say about a reason to intend or feel something as opposed to a reason to do it: reasons to do something, such as saying thank you or taking a pill, can be grounded in any good consequence, but reasons to intend or feel something must track the features that make that mental state a successful or accurate representation of its object. By accepting this, you gain a robust framework that explains why pragmatic incentives feel like external pressures rather than internal justifications, even in the moral realm, though it comes at the cost of reclassifying the moral pressure of a loved one's feelings as a reason for emotional management rather than a reason for the emotion's fittingness.
