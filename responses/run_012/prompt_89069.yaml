      *   *Refinement on (b):* Emphasize "Resolute Choice." If the agent sees the sequence, the dynamic inconsistency disappears. Dutch Books don't allow this "seeing ahead" in the same way because the loss is guaranteed by the logical structure of the bets *now*.
