      *   **Task:** Diagnose the argument, *not* solve the underlying topic. Identify which premise to reject, explain why it looked plausible, explain the cost of giving it up, and assess the "damage spread" (does rejecting one premise undermine others?).
      *   **Constraints:** The user wants to keep (1) (definition of rational choice) and (6) (empirical claim about life's big decisions) if possible. They find the friend's suggestion (accept arationality) unbearable.
