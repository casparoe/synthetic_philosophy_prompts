      *   **Premise (4):** *Personal transformation blocks ranking (incommensurability).*
          *   *Plausibility:* High (Paul/Chang). If preferences change radically, how to compare?
          *   *Risk:* This is the strongest candidate for rejection. It assumes a static standpoint for rationality. It assumes the *current* self must do the ranking.
      *   **Premise (5):** *The Inference.* Follows logically from 1-4. If 1-4 hold, 5 is inevitable.
      *   **Premise (6):** *Big choices are transformative.*
          *   *Plausibility:* High. User wants to keep this.
      *   **Premise (7):** *The Reductio.* "Too much." User agrees with this sentiment.

