answer: |-
  You have hit on exactly the right intuition, but there is a subtle mathematical and philosophical distinction that makes the Pasadena game a "level 2" paradox compared to the St. Petersburg "level 1" paradox.

  You are correct that if you impose a **bounded utility function** (capping the maximum possible value an outcome can have), the mathematics of the Pasadena game stops misbehaving. The sum converges, and the expected value becomes a finite number.

  However, decision theorists don't consider this a "dissolution" of the paradox for three key reasons. Here is the breakdown you can use for your piece.

  ### 1. Infinity vs. Indeterminacy (The Math Difference)
  The St. Petersburg paradox produces an expected value of **infinity**. That is a specific kind of problem. It means the game is "too valuable" to price.
  *   **The Fix:** You can argue that humans have diminishing marginal utility (a billion dollars isn't a billion times better than one dollar). If utility is bounded, the sum converges to a finite number. Problem solved.

  The Pasadena game produces an expected value that is **undefined**.
  *   **The Setup:** In the Pasadena game, the payoffs alternate between positive and negative values, shrinking in a specific way (mathematically, it creates the *Alternating Harmonic Series*).
  *   **The Problem:** In calculus, this series is *conditionally convergent*. Thanks to the **Riemann Rearrangement Theorem**, you can rearrange the order in which you sum the outcomes to make the total equal **any number you want** (positive, negative, or zero).
  *   **Why it matters:** In a gamble, there is no natural "order" to the outcomes. They are just a set of possibilities. If the Expected Utility depends on the order in which you count them, the Expected Utility **does not exist**.

  **The Journalistic Angle:** St. Petersburg breaks the theory because the answer is *too big*. Pasadena breaks the theory because *there is no answer*. Bounded utility fixes St. Petersburg by cutting off the size. But Pasadena shows that even if you avoid infinity, unbounded utility allows for gambles where the value is mathematically indeterminate.

  ### 2. The "Bounded Utility" Fix is a Major Concession
  You asked: *"Why don't decision theorists just do the same thing... and cap utility?"*

  They could, but it requires throwing out a fundamental assumption of classical economics and utilitarianism: that value can scale indefinitely.
  *   **St. Petersburg:** You can argue that money has a cap.
  *   **Pasadena:** To solve Pasadena using bounded utility, you must argue that *moral value* has a cap.

  For example, if you are a utilitarian deciding how to allocate medicine, you might believe saving 1,000 lives is 1,000 times better than saving 1 life. That implies an **unbounded** utility function. The Pasadena game proves that if you allow utility to be unbounded (even for moral reasons, not just money), you can construct a gamble where rational decision-making becomes impossible.

  So, the "fix" isn't a simple patch; it's a demand that rational agents *cannot* value things linearly forever. Many philosophers find that restriction too costly to accept just to save the math.

  ### 3. The Altadena Game (The Dominance Violation)
  This is the part that usually confuses people, but it is the strongest argument for why Pasadena is deeper.

  Imagine a second game, the **Altadena Game**. It is identical to the Pasadena game, except that for every possible outcome, the payoff is increased by a tiny, positive amount (say, 1 cent, or 1 unit of utility).
  *   **Pasadena:** Payoff $X$
  *   **Altadena:** Payoff $X + 1$

  **The Rational Rule:** The **Principle of Dominance** states that if Game B pays more than Game A in *every single possible outcome*, a rational agent must prefer Game B.

  **The Paradox:**
  1.  Because the Pasadena expectation is undefined (due to conditional convergence), the Altadena expectation is *also* undefined (shifting a conditionally convergent series doesn't make it absolutely convergent).
  2.  Expected Utility Theory says: "I cannot compare two undefined values."
  3.  Therefore, Expected Utility Theory cannot tell you to choose Altadena over Pasadena.
  4.  But Altadena is strictly better in every way.

  **The Journalistic Angle:** The Altadena game shows that the Pasadena problem isn't just about calculating a number. It's about the theory failing to recognize that **more is better than less**. Even if you accept undefined values, the theory violates a basic rule of rationality (Dominance) that is more fundamental than Expected Value itself.

  ### Summary for your Piece
  *   **St. Petersburg** is a problem of **magnitude** (Infinity). It suggests our utility function should be bounded.
  *   **Pasadena** is a problem of **coherence** (Indeterminacy). It suggests that *any* unbounded utility function allows for gambles that have no defined value.
  *   **Altadena** shows that this incoherence leads to **irrational choices** (failing to prefer a guaranteed improvement).

  If you write that "bounded utility solves it," a philosopher will reply: "Yes, but only if you assume rational agents cannot value an infinite number of lives saved linearly." The Pasadena game forces theorists to choose between fixing the math or restricting the scope of rational value. That is why it keeps them up at night.
