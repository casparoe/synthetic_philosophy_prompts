answer: |-
  This is a reconstruction of Galen Strawson's "Basic Argument," and your unease is well-founded. The argument is logically valid; if you accept the premises, the conclusion follows inescapably. But validity is not soundness. The argument functions as a *reductio ad absurdum* of a specific, demanding conception of moral responsibility—one that requires "ultimate origination."

  To save the normative practices you value (criticism, accountability, egalitarian justice) without capitulating to meritocracy, you should **reject Premise (3)**.

  However, simply crossing out (3) is not enough. You must diagnose *why* it looks plausible, identify the equivocation it relies on, and attach a price tag to its rejection. Here is the diagnosis.

  ### 1. The Diagnosis: Ownership vs. Authorship

  Premise (3) states: *An action is genuinely attributable to a person only if the relevant parts of their character are genuinely theirs — that is, only if they are, in the relevant respects, responsible for being the sort of person they are.*

  **Why it looks plausible:**
  This premise relies on the **Principle of Ultimate Responsibility**. It taps into a deep intuition that to be truly responsible for $X$, you must be responsible for the causes of $X$. If your character caused your action, but you didn't cause your character, then the action ultimately traces back to luck (genetics, environment). It feels like "cheating" to claim credit for a character you were simply handed. This is the intuition that drives the meritocratic critique in (7): the wealthy didn't *make* their talent or drive; they inherited it.

  **The Flaw:**
  Premise (3) conflates **ownership** of a psychology with **authorship** of a psychology.
  *   **Ownership:** The action issues from *my* beliefs, desires, and dispositions. It is not a reflex, a seizure, or coercion. It reflects *who I am*.
  *   **Authorship:** I chose or created those beliefs, desires, and dispositions *ex nihilo*.

  For the purposes of moral accountability and social regulation, **ownership is sufficient**. We do not need to be the *authors* of our souls to be the *agents* of our actions. Premise (3) demands authorship for attributability. This is a category error. Attributability requires only that the action flows from the agent's current rational capacities, not that the agent constructed those capacities from scratch.

  ### 2. The Price Tag: What You Lose and What You Buy

  If you reject (3), you are adopting a **Compatibilist** stance (specifically, a Strawsonian or Reasons-Responsive view). Here is the cost-benefit analysis:

  **What You Forfeit (The Cost):**
  1.  **Retributive Desert:** You must abandon the idea that wrongdoers *intrinsically deserve* suffering. If they didn't choose their character, punishment cannot be justified as "payback" for metaphysical guilt. Punishment must be forward-looking (deterrence, rehabilitation, safety).
  2.  **Basic Moral Luck Immunity:** You must accept that there is a element of luck in who we are. The "saint" and the "sinner" are both products of constitution and circumstance. You cannot claim the saint is *metaphysically* superior, only functionally different.
  3.  **The "Meritocratic" Notion of Desert:** You cannot claim the successful *earned* their status in a deep moral sense. This aligns with your egalitarian leanings, but it means you must be consistent: the critic, too, is not metaphysically superior for seeing the truth.

  **What You Preserve (The Benefit):**
  1.  **Attributability & Accountability:** You can still say, "You did this, and it reflects on you." Actions are still *yours* because they issue from your psychology, even if you didn't choose that psychology. This saves the practice of blame and praise as social tools.
  2.  **The Critic's Standing:** Your friend's worry about the critic's standing (that they don't *deserve* credit for their insight) dissolves if you shift from *desert* to **authority**. The critic has standing not because they are metaphysically superior, but because their critique is *correct* and *actionable*. Standing is a social status, not a metaphysical reward.
  3.  **Egalitarian Justice:** You can maintain (7) without accepting (6). You can argue that economic advantages are undeserved (because they rely on arbitrary talents) while maintaining that citizens are accountable to one another (because they share a social world).

  ### 3. Resolving the Scope Problem: Two Concepts of Desert

  Your deepest worry is that the argument "travels too far." It strips the rich of their wealth but also strips the victim of their claim to justice. This happens because the argument uses the word "Desert" univocally in (2) and (7). To fix this, you must distinguish between **Retributive Desert** and **Conventional Entitlement**.

  *   **Retributive Desert (Basic Desert):** The idea that a person *intrinsically merits* good or bad treatment based on their metaphysical authorship of their will. **The Argument successfully destroys this.** You should let this go. It is the "meritocratic sham" you suspect it is.
  *   **Conventional Entitlement (Accountability):** The idea that within a social framework, certain actions trigger normative responses (punishment, reward, criticism) to maintain cooperation and fairness. **The Argument fails to destroy this.**

  **How to repair the argument for Egalitarian use:**
  You can keep the critique of meritocracy (7) without accepting the nihilism of (6) by modifying the inference.

  1.  **Accept (1) & (2) (modified):** Actions flow from character; to be held accountable, actions must issue from character (Ownership, not Authorship).
  2.  **Reject (3):** Responsibility for character is not required for accountability for action.
  3.  **Modify (7):** Economic *rewards* often track "natural assets" (talent, drive) which are morally arbitrary (not chosen). Therefore, economic *inequality* cannot be justified by *moral desert*.
  4.  **Crucial Distinction:** However, *accountability* (blame/praise) tracks *violations of social norms*, not the possession of assets.

  This allows you to say:
  *   "The CEO does not *deserve* her millions (because her talent was luck)."
  *   "The Criminal *is accountable* for his theft (because he violated our shared norms, regardless of his luck)."
  *   "The Critic *has standing* (because her argument is sound, not because she is virtuous)."

  ### 4. Why Your Friend Was Waving His Hands

  Your friend said the regress in (4)–(5) is an artefact. He was right, but imprecise. The artefact is the demand for **self-creation**.

  The regress arises only if we demand that the *source* of the will must be the will itself. But the source of the will is the person (their biology, history, environment). As long as the action flows from the person without external coercion (gun to the head) or internal breakdown (psychosis), the chain of responsibility stops at the person. It does not need to go back *before* the person.

  By rejecting (3), you stop the regress. You say: "I am responsible for this action because it is mine. Full stop. I do not need to be responsible for the 'me' that owns it to be responsible for what 'I' do."

  ### 5. Final Verdict

  **Reject Premise (3).**

  *   **Reason:** It sets a condition for responsibility (Authorship) that is impossible to meet and unnecessary for the normative practices you wish to preserve (Ownership/Accountability).
  *   **Price:** You must abandon retributive justice and the idea that anyone is "better" than anyone else in a cosmic sense.
  *   **Gain:** You save the possibility of social criticism, political accountability, and egalitarian redistribution. You can argue that the wealthy do not *deserve* their wealth (because wealth tracks arbitrary luck) without arguing that no one *deserves* anything (because accountability tracks social agency).

  This preserves the "sturdy enough" notion of desert you need: a **political** notion of desert (what we owe each other as citizens) rather than a **metaphysical** notion of desert (what the universe owes us as souls). The meritocrat wants the latter; the egalitarian only needs the former. The argument you found tries to use the impossibility of the latter to destroy the former. That is the slide you must block.
