  7.  **Final Polish:** Ensure the tone matches the user's philosophical sophistication. Use terms like "Ultimate Responsibility," "Basic Desert," "Reactive Attitudes," "Moral Arbitrariness." Make sure to answer the specific question: "Which step to reject?" (Step 3 is the primary target, but Step 2 needs qualification).

