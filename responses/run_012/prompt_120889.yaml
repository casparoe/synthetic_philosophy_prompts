answer: |-
  A friend offers you a coin flip. Heads, you double your life savings. Tails, you lose it all. The coin is weighted: you win sixty percent of the time.

  "Take it," he says. "It's positive expected value. Mathematically, you're printing money."

  "I'm passing," you say.

  "Why? Are you afraid of risk?"

  "No," you say. "I'm afraid of the average."

  "The average?"

  "You're betting on the average version of me across all possible outcomes. I'm betting on the only version that has to pay rent next month. You can't compound interest on zero."

  ***

  **Note on the theory:**
  The joke conflates avoiding ruin with maximizing growth; Kelly is technically about optimizing the geometric growth rate, where avoiding ruin is just the boundary condition (since the log of zero is negative infinity). It also leans heavily on the ergodicity framing—that time averages trump ensemble averages—as if it were the sole definition of rationality, rather than one competing with subjective expected utility theory. I would rewrite the punchline if the argument for subjective utility functions won out: if rationality is defined by an individual's personal risk tolerance rather than objective bankroll growth, then turning down a +EV bet isn't "smarter," it's just a different preference, and the joke's claim to superior rationality collapses. Similarly, if the bet were truly one-off with no future compounding opportunities, the Kelly criterion loses its force, and the arithmetic maximizer becomes the rational actor.
