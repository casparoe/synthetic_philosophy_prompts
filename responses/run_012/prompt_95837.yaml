answer: |-
  **BEFORE THE WORKERS' COMPENSATION APPEALS BOARD**

  **Case No. 2023-459**
  **Claimant: Jane Doe**
  **Defendant: School District & Insurance Carrier**

  **OPINION AND DECISION**

  **I. Introduction**
  This case requires us to interpret the statutory definition of "occupational disease" within the context of modern neurology and toxicology. The Claimant, a school custodian, suffered an acute exposure to industrial cleaning solvents. While acute respiratory symptoms resolved, she subsequently developed chronic headaches, cognitive dysfunction, and a severe intolerance to ordinary chemical environments. She has been unable to work for two years.

  The lower tribunal denied the claim, concluding the condition did not meet the statutory requirement of "a demonstrable pathological change in bodily tissue or function." The Board is divided. The majority recommends a **Remand** to the Workers' Compensation Judge (WCJ) with a clarified legal standard for "functional change." We do so to resolve the tension between our precedent regarding impairment and the statute's textual demand for pathology.

  **II. Statutory Interpretation: Tissue vs. Function**
  The statute governing occupational diseases requires a "demonstrable pathological change in bodily tissue or function." The Employer argues this phrase creates a disjunctive hurdle: either a visible lesion (tissue) or a measurable deviation in organ performance (function). They contend that because MRI and CT scans show no structural damage to the Claimant's brain, and because "Multiple Chemical Sensitivity" (MCS) lacks universal acceptance in the medical community, the "function" prong cannot be satisfied by symptoms alone.

  We disagree with the notion that "function" requires a visible lesion. To read the statute as demanding structural damage for neurological conditions would render the word "function" surplusage. The nervous system is not merely structural; it is operational. A change in how the nervous system processes signals—what the Claimant's expert terms "central sensitization"—is a change in bodily function, even if the hardware appears intact on a scan.

  However, we acknowledge the danger of circular reasoning. As the Employer's expert noted, a mechanism inferred solely from the symptoms it purports to explain risks becoming a tautology. If "headaches upon exposure" is the only proof of "chemical sensitivity," we have not demonstrated a pathological change; we have merely described a reaction.

  **III. Precedent and the Nature of Impairment**
  In *State ex rel. Miller v. Board* (2019), we held that a claimant need not secure a specific named diagnosis to recover, provided they demonstrate a compensable impairment. That precedent guides us here. The Claimant is not required to prove the medical community universally accepts MCS. She is required to prove that her bodily function has pathologically changed due to work.

  Yet, as one member of this Board poignantly noted during deliberation, the statute is quietly incoherent. "Function" only has meaning against a norm of what bodies are supposed to do. Determining whether a body is "broken" enough to count as a disease involves a value judgment, not merely a medical one. We are not simply reading scan results; we are deciding whose suffering counts as an industrial liability. We must therefore articulate a standard that respects the statutory text without reducing the Board to arbiters of abstract medical philosophy.

  **IV. The Standard for Functional Pathology**
  To provide guidance for this remand and future cases, the Board adopts the following test for "demonstrable pathological change in function" where no tissue lesion is present:

  1.  **Objective Consistency:** Subjective reporting of pain or intolerance must be corroborated by consistent objective findings, such as neurocognitive testing, pulmonary function tests, or documented physiological responses (e.g., heart rate variability) during controlled exposure or exertion.
  2.  **Exclusion of Alternative Causes:** The record must demonstrate that other organic or psychological causes for the dysfunction have been reasonably ruled out.
  3.  **Causal Nexus:** There must be medical opinion, based on reasonable probability, linking the functional change to the industrial exposure rather than pre-existing conditions or non-industrial stressors.

  This test addresses the Employer's "floodgate" concern. It ensures that stress, hypervigilance, or conditioned avoidance—while real suffering—do not automatically qualify as occupational *diseases* unless they manifest as a distinct, medically verifiable functional deviation caused by the work.

  **V. Addressing the Strongest Counter-Argument**
  We must be honest about the strength of the Employer's position. The medical controversy surrounding central sensitization and MCS is genuine. The Employer's expert argues that validating this claim based on current evidence opens the door to limitless liability for everyday stressors and environmental sensitivities. If "function" is defined too broadly, any employee who develops a low tolerance for their work environment could claim a pathological disease. This is a legitimate fear. The line between a work-caused neurological injury and a psychological reaction to a difficult workplace is notoriously porous.

  We do not dismiss this risk. However, denying the claim outright based on the lack of a visible lesion ignores the "or function" language of the statute. The remedy is not to deny the claim, but to tighten the evidentiary standard. We are not awarding benefits today based on the current record alone; we are remanding to ensure the WCJ applies this stricter functional test. If the Claimant cannot show objective consistency beyond her own reporting, she will not meet the burden on remand.

  **VI. Disposition**
  The decision of the WCJ is set aside. The case is remanded for further proceedings consistent with this opinion. The WCJ shall determine whether the Claimant's evidence of functional change meets the three-part test articulated above.

  **IT IS SO ORDERED.**

  _________________________
  **Board Member [Name]**
  **For the Majority**
