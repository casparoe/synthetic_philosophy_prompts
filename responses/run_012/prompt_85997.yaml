answer: |-
  ### Exam Question (20 Marks)

  **Question 1:**
  Consider the "Neural Wave" research programme in cognitive psychology. Its **hard core** posits that memory traces are standing waves in a continuous neural medium and retrieval is a resonance phenomenon. Its **positive heuristic** generates interference models.
  *   **Stage 1:** The programme predicted a previously unobserved retrieval-induced forgetting curve, which was later confirmed.
  *   **Stage 2:** The programme failed to predict the spacing effect. Adherents saved the core by adding a "dampening hypothesis" that explained the anomaly but made no new predictions.
  *   **Stage 3:** A rival connectionist programme explained the spacing effect and predicted a priming asymmetry. The Wave programme could only accommodate this asymmetry after the fact.

  (a) Analyze the development of the Neural Wave programme through Stages 1–3 using Lakatos's criteria for **theoretically and empirically progressive** versus **degenerating problem-shifts**. (10 marks)
  (b) Critics argue that because Lakatos's criteria are retrospective, his methodology offers no guidance to scientists working in real time. Based on your analysis of Stage 2 and 3, evaluate this objection. Could a scientist at the end of Stage 2 rationally abandon the Wave programme, or must they wait for Stage 3? (10 marks)

  *Recommended time: 35 minutes. Suggested length: 500–700 words.*

  ***

  ### Model Answer

  For Lakatos, the unit of scientific appraisal is not a single theory but a research programme (RP) defined by a hard core and a protective belt. Crucially, RPs are evaluated dynamically by their problem-shifts. A shift is **progressive** if the new auxiliary hypotheses yield excess empirical content (predicting novel facts) and some of that content is corroborated. A shift is **degenerating** if the adjustments are merely ad hoc, explaining anomalies without predicting new facts.

  In Stage 1, the Neural Wave RP exhibits a progressive problem-shift. The positive heuristic generated interference models that led to the prediction of the retrieval-induced forgetting curve. Because this was a *novel* fact (previously unobserved) and was subsequently confirmed, the shift was both theoretically and empirically progressive. This corroborates the negative heuristic, warranting protection of the hard core.

  However, Stage 2 represents a degenerating shift. When confronted with the spacing effect anomaly, adherents added a "dampening hypothesis." While this saved the phenomena, it made no new predictions. For Lakatos, this is ad hoc protectionism; the protective belt is expanding without increasing empirical content. By the end of Stage 2, the programme is internally degenerating. Stage 3 confirms this degeneration relative to a rival. The connectionist RP predicted a novel priming asymmetry, whereas the Wave RP could only accommodate it post-hoc. Since the rival demonstrated a progressive shift where the Wave RP demonstrated a degenerating one, the Wave programme is scientifically inferior.

  This analysis leads to the objection of retrospectivity. If we can only classify a shift as degenerating after a rival succeeds (Stage 3), does Lakatos offer real-time guidance? At the end of Stage 2, the Wave scientists have not yet been "falsified" in a Popperian sense; they have a consistent, albeit ad hoc, model. Strictly speaking, Lakatos admits that no single anomaly can kill a programme. Therefore, in isolation, Stage 2 does not logically compel abandonment.

  However, this does not mean the methodology offers *no* real-time guidance. The guidance is comparative rather than absolute. A scientist at Stage 2 need not wait for Stage 3 to assess rationality. Upon recognizing that the dampening hypothesis lacks excess empirical content, the scientist should actively seek rival programmes. If a rival exists (or is emerging) that explains the spacing effect *and* offers novel predictions, rationality dictates switching. The retrospectivity objection holds that we cannot know the *future* success of a programme, which is true. But Lakatos's criterion for rationality is not infallible prophecy; it is the heuristic instruction to prefer programmes that are currently progressive over those that are currently degenerating.

  Thus, at the end of Stage 2, a Lakatosian scientist has rational grounds to lose confidence. The dampening hypothesis signals a degenerating shift. While they are not forced to abandon the core immediately (as hard cores are immune to falsification), they are methodologically obliged to recognize the programme's declining heuristic power. If a rival appears with progressive potential, sticking with the Wave programme becomes irrational dogmatism. Therefore, while MSRP cannot guarantee truth in real time, it provides a normative framework for resource allocation: invest in progressive shifts, and divest from degenerating ones once a superior alternative is visible.

  ***

  ### Marking Scheme (20 Marks Total)

  **Grade A (17–20 Marks): Excellent to Outstanding**
  *   **Case Application (Part a):**
      *   Explicitly identifies Stage 1 as **progressive** because it predicted a **novel fact** (forgetting curve) rather than just accommodating known data.
      *   Explicitly identifies Stage 2 as **degenerating** because the dampening hypothesis was **ad hoc** (lacked excess empirical content/new predictions).
      *   Identifies Stage 3 as the decisive comparative moment where the rival is progressive (predicts priming asymmetry) and Wave is merely accommodating.
  *   **Retrospectivity Objection (Part b):**
      *   Acknowledges Lakatos's concession that falsification is not instant (no instant rationality to abandon at Stage 2 *in isolation*).
      *   **Crucial Distinction:** Argues that guidance is **comparative**. Rationality at Stage 2 depends on the existence (or search for) a rival.
      *   Concludes that while MSRP is retrospective regarding *final* verdicts, it is prospective regarding **resource allocation** (don't invest in degenerating shifts if a progressive alternative exists).
  *   **Style:** Precise use of terminology (excess empirical content, negative/positive heuristic, ad hoc). Clear argument structure.

  **Grade B (13–16 Marks): Good to Competent**
  *   **Case Application (Part a):**
      *   Correctly labels Stage 1 as progressive and Stage 2/3 as degenerating.
      *   May focus slightly more on the "hard core/belt" distinction than on the *nature of the shifts* (prediction vs. accommodation), but still gets the verdict right.
      *   Might miss the nuance that Stage 2 is degenerating *internally* while Stage 3 is degenerating *relative to a rival*.
  *   **Retrospectivity Objection (Part b):**
      *   Correctly explains the objection (we only know after the fact).
      *   Argues that scientists *can* abandon at Stage 2, but may treat it as a Popperian falsification (which Lakatos rejects) OR may claim Lakatos offers no guidance (too pessimistic).
      *   Misses the specific "comparative" nuance of rationality (i.e., rationality depends on the state of rival programmes).
  *   **Style:** Clear understanding of Lakatos, but terminology may be less precise. Argument is solid but lacks the philosophical depth of the A answer regarding the nature of scientific rationality.

  **Grade C (9–12 Marks): Satisfactory**
  *   **Case Application:** Identifies the stages correctly but relies heavily on describing the hard core/belt distinction rather than problem-shifts. Fails to emphasize "novel prediction" as the key criterion for progress.
  *   **Retrospectivity:** Describes the objection but fails to apply it to the specific Stage 2/3 transition. May conclude simply that "Lakatos is right" or "Lakatos is wrong" without analyzing the real-time implication.
  *   **Style:** Understands the basics but lacks analytical rigor.

  **Grade D/F (0–8 Marks): Poor to Fail**
  *   Confuses Lakatos with Kuhn (paradigms) or Popper (falsificationism).
  *   Fails to use the provided case details.
  *   Does not address the retrospectivity objection.
