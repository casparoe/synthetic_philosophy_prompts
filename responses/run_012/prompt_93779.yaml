          6.  The Steelman (Strongest Opposing Argument).
          7.  Deciding the Case (What the Careenium actually shows).
      *   *Refinement on Hofstadter:* Be careful not to misrepresent Hofstadter. He is often vague, but generally leans towards "patterns are real" in a way that doesn't violate physics. He talks about "levels of description" but insists the higher levels capture *truths* that lower levels miss (like the meaning of a message).
      *   *Refinement on Causation:* Distinguish between *causal production* (physical pushing) and *causal relevance* (explanatory difference-making). The popular book conflates these.

  9.  **Self-Correction/Check during drafting:**
      *   *Check:* Did I avoid citations? Yes.
      *   *Check:* Did I answer the three specific interests? Yes.
      *   *Check:* Is the distinction between ontological reduction and causal efficacy clear? This is crucial for a PhD student.
