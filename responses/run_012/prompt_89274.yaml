  # Fairness Constraint Decision Tree

  **Instructions:** Start at Node 1. Answer the question based on your project's operational constraints and ethical commitments. Follow the branch to the next node or a terminal leaf.

  ### Node 1: Scope of Responsibility
  **Question:** Is fairness a property strictly of this model's mathematical output, or of the broader institutional pipeline (data collection, deployment, human review)?
  *   **Broader Pipeline:** → **Leaf 1: No classifier-level fix.**
  *   **This Model Only:** → Go to Node 2.

  ### Node 2: Target Construct
  **Question:** Is the outcome variable ($Y$) we are predicting a fixed ground-truth fact, or a proxy construct we are allowed to redefine?
  *   **Allowed to Redefine:** → **Leaf 2: Redesign the target.**
  *   **Fixed Ground Truth:** → Go to Node 3.

  ### Node 3: Granularity of Fairness
  **Question:** Do we define fairness over aggregate group statistics or individual counterfactual similarity (similar individuals get similar outcomes)?
  *   **Individual Counterfactuals:** → Go to Node 4.
  *   **Aggregate Group Statistics:** → Go to Node 5.

  ### Node 4: Attribute Necessity (Individual Path)
  **Question:** To assess individual similarity, must the rule explicitly know the protected attribute ($A$)?
  *   **No (Blind to $A$):** → **Empty Branch (Incoherent).** *You cannot verify individual fairness with respect to a protected attribute without observing the attribute.*
  *   **Yes (Aware of $A$):** → **Leaf 3: Individual-level fairness.**

  ### Node 5: Attribute Usage (Group Path)
  **Question:** Is the decision rule permitted to explicitly condition on the protected attribute ($A$)?
  *   **No (Blind to $A$):** → **Leaf 4: Fairness through unawareness.**
  *   **Yes (Aware of $A$):** → Go to Node 6.

  ### Node 6: Metric Compatibility
  **Question:** Given different base rates across groups, do you require the score to be calibrated in all groups AND have equal false-positive/negative rates simultaneously?
  *   **Yes (Require Both):** → **Empty Branch (Theorem).** *Mathematically impossible unless base rates are equal or prediction is perfect.*
  *   **No (Choose One):** → Go to Node 7.

  ### Node 7: Metric Priority
  **Question:** Do you prioritize the interpretability of the score (Calibration) or the distribution of decisions/errors (Balance)?
  *   **Score Interpretability (Calibration):** → **Leaf 5: Calibration-first.**
  *   **Decision Distribution (Balance):** → Go to Node 8.

  ### Node 8: Balance Definition
  **Question:** To achieve balance, do we ignore the true outcome ($Y$) to equalize selection rates, or condition on $Y$ to equalize error rates?
  *   **Ignore $Y$ (Equalize Selection):** → **Leaf 6: Demographic parity.**
  *   **Condition on $Y$ (Equalize Errors):** → Go to Node 9.

  ### Node 9: Decision Mechanism
  **Question:** Must the decision be a deterministic function of the risk score, or may we introduce noise to satisfy constraints?
  *   **Introduce Noise (Randomized):** → **Leaf 7: Randomized decisions.**
  *   **Deterministic Function:** → **Leaf 8 & 9: Error-rate balance first / Group-conscious thresholds.**

  ---

  ### Leaf Annotations & Structural Notes

  **Leaf 1: No classifier-level fix**
  *   **Awkward Commitment:** Admitting that optimizing the model is a distraction from fixing the institution that built it.
  *   **Note:** This position asserts that model-level metrics are category errors for systemic problems.

  **Leaf 2: Redesign the target**
  *   **Awkward Commitment:** Accepting that the "ground truth" data you were given is too biased to be used as-is.
  *   **Note:** Requires domain expertise to construct a valid proxy for the unobservable construct of interest.

  **Leaf 3: Individual-level fairness**
  *   **Awkward Commitment:** Assuming you can define a metric of "similarity" between individuals that everyone agrees is fair.
  *   **Note:** Shifts burden from statistical parity to causal metric definition.

  **Leaf 4: Fairness through unawareness**
  *   **Awkward Commitment:** Accepting that disparate impact will persist because correlated features act as proxies for the protected attribute.
  *   **Note:** Often legally safe but statistically weak against bias.

  **Leaf 5: Calibration-first**
  *   **Awkward Commitment:** Accepting that false-positive and false-negative rates will differ across groups if their base rates differ.
  *   **Note:** Preserves the meaning of the score ("a 10% risk is a 10% risk") at the cost of equal error burdens.

  **Leaf 6: Demographic parity**
  *   **Awkward Commitment:** Ignoring the true outcome ($Y$) entirely, potentially selecting unqualified candidates to match rates.
  *   **Note:** Maximizes representation but sacrifices predictive utility and calibration.

  **Leaf 7: Randomized decisions**
  *   **Awkward Commitment:** Deliberately making suboptimal or arbitrary decisions for some individuals to satisfy group constraints.
  *   **Note:** Mathematically powerful for satisfying multiple constraints, but operationally and ethically difficult to explain.

  **Leaf 8 & 9: Error-rate balance first / Group-conscious thresholds**
  *   **Awkward Commitment:** Applying different decision thresholds to different groups, treating individuals differently based on group membership.
  *   **Indistinguishable Pair:** This tree cannot separate **Error-rate balance first** (the metric goal) from **Group-conscious thresholds** (the policy mechanism). They occupy the same logical leaf because achieving error-rate balance with different base rates *requires* group-conscious thresholds. To separate them, you would need a node asking: "Is the primary motivation metric equality or historical correction?"

  **Empty Branch (Node 6, Yes): Theorem**
  *   **Reason:** This branch is empty by theorem (The Impossibility of Fairness).
  *   **Premise:** When base rates differ between groups, a single score cannot be simultaneously calibrated and satisfy equalized odds (error-rate balance).

  **Empty Branch (Node 4, No): Incoherent**
  *   **Reason:** This branch is empty by definition.
  *   **Premise:** Individual fairness is defined as $d(x, x') \leq \epsilon \implies |h(x) - h(x')| \leq \delta$. If the metric $d$ includes the protected attribute, the function $h$ must be aware of it to enforce the constraint.
