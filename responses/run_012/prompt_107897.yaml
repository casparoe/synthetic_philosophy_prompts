  ### Brainstorming: Competing Considerations

  *   **Transparency vs. Source Protection:** The standard aims for maximum transparency (readers verify everything). The environment case requires protecting a source whose identity is embedded in the evidence. Strict adherence kills the story; an exception risks creating a "trust me" loophole.
  *   **Logical Coherence vs. Operational Utility:** The knowability paradox (Fitch's Paradox) suggests "all truths are knowable" implies "all truths are known." If the standard implies universal knowability, it is logically flawed. However, newsroom standards are normative rules for specific claims, not metaphysical assertions about all truth. The paradox highlights the need to restrict the scope of the standard to *published claims* only.
  *   **Rule vs. Discretion:** A hard rule prevents editorial bias but fails in edge cases (like confidential sources). Discretion handles edge cases but introduces subjectivity. The committee needs a structured discretion mechanism (exception protocol) rather than a blanket waiver.
  *   **The "Reader" Definition:** Does "careful reader" mean an actual person with limited resources, or an idealized investigator? The standard says "in principle," which leans idealized. This needs grounding in practical verification to avoid the paradox and ensure feasibility.
  *   **Institutional Trust:** Adopting the standard builds long-term trust in methodology. Rejecting it maintains flexibility but risks perceptions of opacity. Adopting with exceptions balances both but requires rigorous documentation to prevent abuse.

  ***

  **MEMORANDUM**

  **TO:** Standards and Ethics Committee
  **FROM:** [Your Name], Committee Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Proposed "Public Knowability" Standard

  **Recommendation**

  I recommend that the committee **adopt the standard with specified exceptions**. Specifically, we should adopt the text as drafted but append a formal exception protocol for cases where full evidentiary disclosure would compromise confidential sources or safety, provided that internal verification standards are met and the exception is documented.

  **Reasoning**

  The intent of the "public knowability" standard is sound: it shifts our burden of proof from "trust us" to "verify us." This aligns with our mission as an investigative nonprofit. However, a literal application without exceptions creates an impossible conflict between transparency and source protection, as seen in the environment desk case. If we require the evidence chain to be public when that chain identifies a confidential source, we either endanger the source or kill the story. Neither serves the public interest.

  Therefore, the standard must function as a default presumption rather than an absolute law. We adopt the rule to maximize transparency, but we acknowledge that investigative journalism sometimes requires withholding the *method* of verification to protect the *source* of verification, provided the newsroom itself has verified the claim rigorously.

  **The Philosophical Objection and Scope**

  A colleague has raised a significant logical concern regarding the knowability paradox (often associated with Fitch). The argument is that if we claim all truths we publish are "knowable in principle," logic dictates they must therefore be "known," which is empirically false. If the standard implies a universal claim about truth, it is incoherent.

  However, this paradox does not require us to reject the standard; it requires us to restrict its scope. The paradox arises from applying knowability to *all truths*. Our standard applies only to *claims we choose to publish*. We are not asserting that all truths are knowable; we are asserting that for any claim $c$ we publish, we provide the means for a reader to know $c$. Furthermore, we must define "knowable in principle" procedurally, not metaphysically. It means "verifiable given the provided evidence package," not "metaphysically possible for an omniscient being." By restricting the domain to "published claims" and defining knowability as "accessibility via provided materials," we avoid the logical contradiction while retaining the ethical force of the standard.

  **Exception Protocol**

  To prevent the exception from swallowing the rule, the following protocol must be adopted alongside the standard:

  1.  **Trigger:** An exception may be granted only when publishing the evidentiary chain would reveal the identity of a confidential source, endanger safety, or violate a legal privilege, and where no redacted alternative exists.
  2.  **Decision Procedure:** The exception must be approved by the Managing Editor and the Chair of the Standards Committee (or designee).
  3.  **Documentation:** The editors must file an internal memo documenting the specific evidence withheld, the reason for withholding, and the internal verification steps taken to confirm the claim without public disclosure. This memo is subject to audit by the board.
  4.  **Public Notice:** The published story must note that certain evidentiary materials are withheld under the Public Knowability Exception, without revealing the protected information.

  **Application to the Environment Story**

  Regarding the environment desk story: The committee should grant the exception. The reporter must submit the full evidence chain to the Managing Editor and Standards Chair for independent verification. Once verified internally, the story may publish the factual claims without the specific evidence links that identify the source. The story must include a note stating that verification materials are withheld to protect a confidential source under the newsroom's ethics standard.

  **Objections and Concessions**

  The strongest objection to this recommendation comes from the defenders of the strict standard. They argue that creating an exception mechanism makes the standard optional in exactly the hard cases where transparency is most difficult and most necessary. They fear that "source protection" will become a catch-all excuse for sloppy journalism where editors simply take reporters at their word.

  This objection is valid. Exceptions do create loopholes, and trust is eroded when evidence is hidden. The losing side is right that the default must remain strict transparency, and that any deviation increases the risk of error or bias.

  However, the recommendation survives this objection because the exception protocol imposes a higher burden of internal verification. When we use the exception, we shift the verification burden from the public to our senior editors. This maintains accountability, even if it moves it behind the curtain. Without this exception, we force reporters to choose between ethical source protection and ethical transparency, a false dichotomy that would reduce our ability to hold power accountable.

  **Conclusion**

  We should adopt the standard to signal our commitment to transparency, but we must modify it to reflect the practical realities of investigative work. By restricting the scope to published claims and instituting a rigorous exception protocol, we preserve logical coherence and operational viability.

