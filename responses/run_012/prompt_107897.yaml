      *   **The Problem:** Confidential sources. If revealing the evidence reveals the source, the source is endangered or dries up. This is a classic journalism ethic conflict (transparency vs. protection).
      *   **The Paradox (Fitch's):** $\forall p (p \rightarrow \Diamond K p) \rightarrow \forall p (p \rightarrow K p)$. Basically, if every truth is *knowable*, then every truth is *known*. This is a logical result in epistemic logic.
      *   **Relevance to Policy:** The policy says "could in principle come to know" ($\Diamond K$). The colleague argues this implies all truths *are* known ($K$), which is false. Therefore, the policy is logically impossible if interpreted universally over all truths.
      *   **My Stance (as Philosopher/Journalist):** The paradox is real logic, but policy isn't logic. Policy is normative. "Could in principle" in policy language usually means "accessible given reasonable effort and resources," not metaphysical possibility. However, the colleague has a point about scope. We shouldn't claim *all* truths are knowable, only *published claims*. Also, we need to distinguish between "reader" (actual human) and "ideal inquirer" (logical construct).
