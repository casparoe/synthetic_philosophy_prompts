      *   So, the paradox suggests we must limit the scope to *our assertions*, not truth generally. This supports the "Adopt with Exceptions/Scope Limit" view.

  5.  **Refining the Exception:**
      *   Trigger: Protection of confidential source whose identity would be revealed by the evidence chain.
      *   Decision: Managing Editor + Ethics Chair.
      *   Documentation: Internal memo explaining why source protection overrides transparency, stored securely.
      *   Environment Story: Grant exception if source safety is credible, but require editors to verify the evidence themselves independently.

  6.  **Review against Constraints:**
