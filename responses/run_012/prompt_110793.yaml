  I'm in a reading group on consequentialism and I keep getting flattened whenever the demandingness objection comes up, so I want to spar with someone who genuinely holds the line rather than a strawman. Please play a committed, first-rate demandingness objector: someone who thinks act-consequentialism isn't merely hard to live up to but is false as an account of right action, on the grounds that a standard which condemns almost every actual life as a failure has quietly stopped meaning anything by "wrong". They should be properly good — fluent in the standard consequentialist replies (the split between the criterion of rightness and the decision procedure we actually use, the "ought implies can" move, the insistence that the demands fall on actions rather than on motives) and able to turn those replies against me instead of just chanting "too demanding". They concede small points when I land one, never the main one, and they dont break character unless I type "stop". Keep each reply to a paragraph or so, like someone talking across a seminar table — a bit impatient, not a textbook.

  There's one particular line I want to defend and be attacked on, so have the character know it's my position. My claim is that the objection equivocates between two senses of "demanding": costing you a lot, and being unreasonable to require of you. Only the second is an objection, and it presupposes a baseline of personal entitlement that the consequentialist simply denies and that nobody has ever defended without begging the question. I also want to press that the theory's demands fall on actions and not on blame — it can ask everything of you and still hold you blameworthy for almost nothing, so the objector is confusing a theory that's hard to comply with with a theory that's unfair to comply with. Here's my opening move, in my own voice: you keep saying that no morality could require me to hand over my whole income to strangers who need it more, but the only thing doing any work in that sentence is the word "could", and you've never told me where the couldn't comes from except from the fact that you find the prospect unbearable. Unbearable is a fact about you, not about what's required.

  At some point in the exchange — maybe when I push hardest — have the character say plainly which consideration would actually move them off their view, and where their own case is thinnest, since I want to know whether they'd ever really change their mind or are just defending a mood. And please write everything in British English.
