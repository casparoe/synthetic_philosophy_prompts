prompt: |-
  ok so i'm in this grad seminar on bayesian epistemology / formal confirmation theory and i have to lead the discussion next week. i don't want to just re-present jeffrey conditionalization for the hundredth time, so i want to hand out a decision tree that actually sorts my classmates by what they think about updating on uncertain evidence. the kind of thing where you start at the top, answer questions about cases, and land on a labeled position — and you can't tell where a branch is going while you're answering it.

  set it up so the top node is basically "my new evidence arrives as a probability distribution over some partition, not as a single proposition i'm certain of." from there i want the branch points to be the real fault lines in the debate, roughly:

  - can uncertain evidence always be laundered into certain evidence about my own experience or credences, and then handled by ordinary conditionalizing (the "firm up first" crowd)? or is some evidence irreducibly uncertain?
  - given the new probabilities, is the posterior uniquely determined, or is there a whole family of rational posteriors? this should split jeffrey-style probability kinematics from the people who want to pick the posterior "closest" to the prior subject to the new constraint, and from the permissivists who say it's just underdetermined
  - do you demand the update be invariant to how you carve up the partition, and to the order in which bits of uncertain evidence arrive? or do you just accept that it's order- and partition-dependent and call that life?
  - do you only ever revise the probability of a single proposition (leaving the rest fixed by some rule), rather than revising a whole partition?
  - and then the burn-it-down branch: evidence has to be propositional and certain, so the whole question is ill-posed

  leaves should be named where there's a name (jeffrey conditionalization / probability kinematics, strict conditionalization after firming up, the minimize-the-divergence family, the single-proposition update, permissivism, the reject-the-framework view), and marked "unnamed" if the combination is real but nobody's defended it.

  a few things i really need:

  - each node has to be phrased as a question about a concrete case, so someone can answer it without already knowing which position it leads to. don't ask "are you a jeffreyite?" — ask what they'd do with the case.
  - use one running case the whole way down so it stays concrete. i'm thinking: a doctor reads a test result and comes away 70% confident of a diagnosis, where the test itself is known to be noisy and she's also unsure how noisy. that second bit — uncertainty about the reliability of the evidence — is what i care about most, because i think it's where the tree gets interesting and where jeffrey conditioning quietly assumes more than people admit.
  - for each leaf, one line on its most awkward commitment.
  - flag any two leaves your tree can't actually seperate, and say why.
  - flag any empty combinations and say whether nobody's there because the view is incoherent, just unattractive, or merely unexplored.

  and pls tell me how confident you are in the whole thing, and which single branch or claim you're least sure about, cause i'd rather know where to be careful when i present it. i'm definately going to get pushback from the prof who thinks all of this is just a confusion about what evidence is, so the reject-the-framework leaf better be fair to that.
