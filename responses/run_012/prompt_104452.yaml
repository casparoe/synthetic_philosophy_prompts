answer: |-
  # Activity Design: The PICA Protocol

  **Facilitator Note:** This session is designed to be run by you, a student peer. You do not need to be an expert. Your role is to keep time, enforce safety rules, and guide the discussion. The "philosophy" happens in the debrief, not the lecture.

  **Group Size:** 15 students (Ideal: 3 small groups of 5).
  **Duration:** 60 Minutes.
  **Materials Needed:**
  *   Printed copies of the **Provisional Index of Classroom Afflictions (PICA)** (1 per student).
  *   **Role Cards** (3 types, printed on colored paper, see below).
  *   **Task Sheets** (for the group activity).
  *   **Anonymous Data Slips** (small pieces of paper, 2 per student).
  *   Pens/pencils.
  *   Timer (phone is fine).
  *   A whiteboard or large sheet of paper for tallying results.

  ---

  ## Part 1: Safety & Setup (0:00 – 0:05)

  **Goal:** Establish psychological safety. Make it clear this is a game about ideas, not a medical evaluation.

  **Script:**
  "Welcome everyone. Today we're running an experiment on how we work together in groups. We're going to do two collaborative tasks. In between, we're going to use a fictional tool called the PICA Index.

  **Three Rules:**
  1.  **These categories are fake.** They are invented for today. They are not real medical conditions.
  2.  **Consent is key.** You cannot be given a label unless you choose to accept it. You can opt out of any part of this at any time without explanation.
  3.  **Kindness.** When we discuss behavior, we talk about what we *saw*, not who someone *is*.

  If anyone feels uncomfortable at any point, just raise your hand, and we'll take a break."

  **Action:** Hand out the **PICA Index** (see Appendix A). Do not explain it yet. Just ask them to keep it face down.

  ---

  ## Part 2: Task Round 1 – Baseline (0:05 – 0:20)

  **Goal:** Establish natural behavior before labels exist.

  **Activity:** "The Colony Plan."
  **Instructions:**
  "In your groups of five, you are founding a new colony on Mars. You have limited space. You must agree on exactly **five items** to bring from the list of ten on your sheet. You must all sign off on the final five. You have 10 minutes."

  *(Items should be debatable: e.g., Seeds, Guitar, Medical Kit, Novel, Solar Panel, etc.)*

  **Facilitator Role:**
  *   Circulate quietly.
  *   Do not intervene unless there is conflict.
  *   Observe who talks most, who checks out, who worries about rules.
  *   At 15 minutes: "5 minutes remaining."
  *   At 20 minutes: "Stop. Put pens down."

  **Data Collection 1 (Anonymous):**
  Hand out **Data Slip A**.
  "Answer privately. Do not put your name on it.
  1. During that task, did you ever feel an urge to change the subject? (Yes/No)
  2. Did you ever feel like stepping away from the group? (Yes/No)
  3. Did you worry you weren't following the rules correctly? (Yes/No)"
  *Collect these in a box/bowl.*

  ---

  ## Part 3: The Diagnosis – Applying the Label (0:20 – 0:35)

  **Goal:** Create the classification and attach it to students through social validation.

  **Script:**
  "Now we're going to use the PICA Index. Turn it over. Read the three categories silently."
  *(Give them 2 minutes to read).*

  "These categories describe behaviors, not people. We are going to see if any of these descriptions match what happened in Task 1. Here is the rule for qualifying for a **Role Card**:
  1.  You feel the description matches your experience in Task 1.
  2.  **At least one peer** in your group agrees that the description matches your behavior in Task 1.
  3.  You choose to accept the card."

  **Process:**
  1.  **Group Discussion (5 mins):** In their small groups, students discuss the definitions. They are *not* diagnosing each other publicly. They are checking for resonance.
      *   *Prompt:* "Raise your hand if you felt 'Discursive Restlessness' during the task."
      *   *Peer Check:* "Look around. If you saw someone else show that behavior, and they raise their hand, that counts as peer validation."
      *   *Safety Valve:* If a student raises their hand and no one else does, they do not qualify. This prevents self-diagnosis without social grounding.
  2.  **Distribution (5 mins):** Students who meet the criteria come to you. You give them a **Role Card** corresponding to their category.
      *   *Crucial:* If a student qualifies for two, they pick one. If they qualify for none, they are "Unlabeled."
      *   *Secrecy:* Ask them to keep their card hidden for now.

  **The Role Cards (The Engine of the Loop):**
  *   **Discursive Restlessness → The Pivot Card:** "You are permitted to force a topic change once during the next task if the conversation stalls."
  *   **Anticipatory Withdrawal → The Breather Pass:** "You are permitted to leave the table for 2 minutes during the next task without asking permission."
  *   **Conscientious Overcorrection → The Auditor:** "You are permitted to pause the group to check if the current plan fits the rules."

  **Script:**
  "These cards give you special permissions for the next task. They are accommodations based on your PICA profile. Read them silently. Do not show them to your group yet."

  ---

  ## Part 4: Task Round 2 – Labeled Behavior (0:35 – 0:50)

  **Goal:** Observe how the classification changes the behavior.

  **Activity:** "The Budget Crisis."
  **Instructions:**
  "Same groups. New scenario. Your colony has lost funding. You must cut **two items** from your previous list of five. You have 10 minutes. **However**, if you have a Role Card, you are expected to use its permission if it feels relevant."

  **Facilitator Role:**
  *   Circulate actively.
  *   If you see a student with a *Pivot Card* hesitating to speak, gently ask: "Does your role apply here?"
  *   If a group seems confused by an *Auditor* stopping them, say: "Check their card. They have permission."
  *   **Observe:** The "Unlabeled" students will likely start treating the "Labeled" students differently (e.g., waiting for the Auditor to approve things).

  **Data Collection 2 (Anonymous):**
  Hand out **Data Slip B**.
  "Answer privately.
  1. Did you use your Role Card permission? (Yes/No/No Card)
  2. Did you notice a group member acting differently than in Round 1? (Yes/No)
  3. Do you feel the label made the behavior easier or harder to manage? (Easier/Harder/Same)"
  *Collect these.*

  ---

  ## Part 5: The Reveal & Debrief (0:50 – 1:00)

  **Goal:** Connect the experience to the concept of Looping Effects.

  **Step 1: The Data (3 mins)**
  Tally the results on the board live.
  *   "How many Yes votes for 'Urge to change subject' in Round 1?" (Write Number)
  *   "How many people actually used the Pivot Card in Round 2?" (Write Number)
  *   "How many noticed behavior changes?" (Write Number)

  **Script:**
  "Look at these numbers. In Round 1, the behavior was internal feelings. In Round 2, the behavior became external action. The label didn't just describe you; it gave you a script."

  **Step 2: The Discussion (5 mins)**
  Ask these questions. Do not lecture. Let them answer.
  1.  "For those with cards: Did having the permission make you do the thing more, or did it just make you feel okay about doing what you already wanted to do?"
  2.  "For those without cards: Did you treat your friends differently once you knew they had a 'condition' or a 'role'?"
  3.  "If we did a Round 3, do you think the definitions of the PICA categories would need to change?"

  **Step 3: The Name (2 mins)**
  **Script:**
  "What we just did has a name. A philosopher named Ian Hacking called this **Looping Effects**.
  Usually, we think science classifies nature. Like rocks. If you label a rock 'granite,' the rock doesn't care. It stays granite.
  But when you classify *people*, the people find out about the classification. They change how they see themselves. They change how they act. And then the classification has to change to keep up.
  In this room, the PICA categories were fake. But once you had the cards, you became the kind of people the cards described. The label changed the behavior, and the behavior made the label real. That is the loop."

  **Closing:**
  "Thank you for participating. Remember, the categories were fictional. But the effect we felt was real. You can now shred your data slips."

  ---

  ## Appendix A: The PICA Index (Handout Text)

  **Provisional Index of Classroom Afflictions (PICA)**
  *Note: These are fictional descriptors for the purpose of this activity.*

  **1. Discursive Restlessness**
  A persistent urge to change the subject before a silence becomes uncomfortable.
  *Criteria:* You feel your contributions are either too much or too little. You scan the room for new topics.
  *Peer Check:* Did others notice you shifting the conversation?

  **2. Anticipatory Withdrawal**
  A tendency to predict that a group activity will be boring or exhausting.
  *Criteria:* You prepare to leave early, mentally or physically. You look for tasks that justify stepping out.
  *Peer Check:* Did others notice you disengaging or looking for an exit?

  **3. Conscientious Overcorrection**
  A pattern of responding to feedback by over-preparing for the next task.
  *Criteria:* You worry about rule adherence more than the outcome. You feel the over-preparation is itself a symptom.
  *Peer Check:* Did others notice you checking rules or hesitating to act?

  ---

  ## Troubleshooting Guide: What Will Go Wrong

  **1. Students "Hamming It Up" (Exaggerating symptoms)**
  *   **Risk:** Students treat the labels as a joke and act insanely to fit them.
  *   **Fix:** In the debrief, acknowledge this. "Some of you leaned into the role. That's part of the loop! If the label rewards a behavior, people will perform it. That proves the point: the classification shapes the person."

  **2. Students Refusing to Label Peers**
  *   **Risk:** No one gets validated because teens are awkward.
  *   **Fix:** Lower the bar. "You don't need to be sure. If you *suspect* it fits them, that counts." If still stuck, you (Facilitator) can act as the peer validator for the whole room based on your observations in Round 1.

  **3. A Category That Fits No One / Everyone**
  *   **Risk:** If "Withdrawal" fits no one, that label dies. If "Restlessness" fits everyone, it loses meaning.
  *   **Fix:** This is actually data. In the debrief, ask: "Why did everyone fit Restlessness? Is our classroom culture designed to make us restless?" This highlights how context creates the classification.

  **4. Ethical Discomfort / Taking it Personally**
  *   **Risk:** A student feels the fake label describes a real struggle they have (e.g., anxiety).
  *   **Fix:** Reiterate the Safety Rule. "These are not diagnoses." If a student seems distressed, pull them aside privately. "You can opt out of Round 2. You can just observe." Ensure the debrief emphasizes the *fictional* nature of PICA.

  **5. The "Cool Kids" Rejecting the Game**
  *   **Risk:** A dominant group refuses to play along, ruining the data.
  *   **Fix:** Do not force them. Let them be the "Control Group." In the debrief, compare their data to the engaged groups. "Did the skeptics behave differently? Why?"

  ---

  ## Limitations: What This Activity Cannot Do

  *You must state these explicitly in the debrief so students don't walk away with the wrong idea.*

  1.  **Institutional Power:** In this game, you could throw away the card. In real life, a psychiatric diagnosis can affect insurance, employment, and legal status. You cannot simply opt out of a medical record. *Facilitator Note:* "In our game, the label had no consequences outside this room. Real labels follow you."
  2.  **Distress:** This game is low-stakes. Real mental health conditions involve genuine suffering, not just game mechanics. *Facilitator Note:* "We simulated behavior, not pain. Do not confuse the two."
  3.  **Timescale:** Looping effects usually happen over years or decades. We compressed it into 60 minutes. *Facilitator Note:* "Real looping is slow. We sped it up like a time-lapse video."
  4.  **Authority:** You are a peer facilitator. A psychiatrist has medical authority. *Facilitator Note:* "My power to label you ended when the bell rang. A doctor's power lasts much longer."

  ---

  ## Facilitator Cheat Sheet (Keep this in your pocket)

  *   **0:00** Read Safety Script.
  *   **0:05** Start Task 1 (Colony Plan).
  *   **0:15** Announce 5 mins left.
  *   **0:20** Collect Data Slip A. Distribute PICA Index.
  *   **0:25** Start Group Validation (Who fits which category?).
  *   **0:30** Hand out Role Cards to those who qualify.
  *   **0:35** Start Task 2 (Budget Crisis). Remind them to use cards.
  *   **0:45** Collect Data Slip B.
  *   **0:50** Tally numbers on board.
  *   **0:55** Reveal "Looping Effects."
  *   **1:00** Dismiss.

  **Final Reminder:** If the energy drops, boost it. If the energy gets too chaotic, call for a "Freeze." You are the conductor of the loop.
