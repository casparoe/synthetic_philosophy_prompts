answer: |-
  # Joint Statement on the Rationality of Transformative Choice

  **Date:** October 24, 2023
  **Signed:** The Discontinuity Camp & The Continuity Camp
  **Subject:** Findings from Adversarial Collaboration on Transformative Experience

  ## I. Agreed Claims

  After two months of adversarial collaboration, we have identified the following points of consensus regarding the structure of the problem and the constraints on any viable theory of choice.

  1.  **Definition of Transformative Experience:** We agree that a "transformative experience" (TE) is characterized by two features: (a) *Epistemic Transformation*, where the agent cannot fully know what the outcome is like prior to choosing it (the "what-it-is-like" problem); and (b) *Personal Transformation*, where the choice may fundamentally alter the agent's core preferences, values, or self-conception.
  2.  **Requirements of Standard Decision Theory:** We agree that standard Expected Utility Theory (EUT) requires an agent to assign a utility value $U(o)$ to each possible outcome $o$ *ex ante* (prior to the choice), weighted by the probability of that outcome. We agree that if $U(o)$ is inaccessible to the agent at the time of choice, the standard apparatus lacks a determinate input.
  3.  **Distinction Between Empirical and Conceptual:** We agree that the *degree* to which imagination fails is an empirical psychological question, while the *requirement* of imagination for rational choice is a conceptual/normative question. We further agree that the reliability of third-person testimony is an empirical matter, whereas the *relevance* of that testimony to first-person utility is conceptual.
  4.  **Criteria for Progress:** We agree that progress is not defined solely by one camp conceding to the other. Progress is achieved if: (a) we identify specific boundary conditions where standard EUT definitely fails; (b) we develop a formal model that accommodates both "ordinary" and "transformative" choices without contradiction; or (c) we successfully isolate which parts of the dispute are substantive and which are terminological.
  5.  **Validity of Both Intuitions:** We acknowledge that the Discontinuity Camp captures a strong phenomenological intuition (that some choices feel radically different), while the Continuity Camp captures a strong methodological intuition (that decision theory should be universal). A successful theory must account for both intuitions without dismissing either as mere error.

  ## II. Table of Remaining Disagreements

  The following table outlines the four surviving cruxes. For each, we have specified the core disagreement, a concrete case agreed to bear on the issue, the divergent predictions each side makes regarding that case, and the specific evidence that would compel each side to retreat from its position.

  | Crux | Discontinuity Camp Position | Continuity Camp Position | Shared Evidence / Case | Divergent Predictions | Retreat Conditions |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Rational Basis**<br>*(Revelation vs. Evasion)* | Choosing to "find out" is a distinct rational mode (Revelation) that operates *outside* utility maximization. It is not an evasion, but a recognition that utility cannot be calculated. | Choosing to "find out" is simply valuing information or novelty. This is a standard higher-order preference calculable within EUT. Calling it "non-standard" is unnecessary. | **Case:** An individual enlists in a special forces unit knowing they cannot imagine combat, stating, "I need to know what I am capable of." | **Disc:** Predicts the agent cannot assign a utility to "combat experience" *ex ante*; the choice is rational *despite* missing utility inputs.<br>**Cont:** Predicts the agent *has* assigned a utility to "self-discovery" which outweighs the risk; the input was present, just abstract. | **Disc Retreat:** If it is shown that agents who choose for "revelation" consistently report *ex post* satisfaction that correlates with *ex ante* estimates of the value of information.<br>**Cont Retreat:** If agents choosing for "revelation" systematically report that the value of the experience was *incomparable* to any prior value they held, rendering the "value of information" calculation null. |
  | **2. Epistemic Access**<br>*(Imagination vs. Testimony)* | First-personal imaginative acquaintance is required to assign utility. Third-personal testimony provides propositional knowledge, not phenomenal knowledge, and thus cannot fill the utility slot. | Third-personal testimony and disciplined imagination are sufficient proxies. Decision theory handles uncertainty about outcomes all the time; phenomenal knowledge is not a unique requirement for rationality. | **Case:** First-time parents deciding whether to have a child, relying heavily on the testimony of other parents. | **Disc:** Predicts a systematic gap between *ex ante* expected satisfaction (based on testimony) and *ex post* reported satisfaction that is larger in TEs than in non-TEs.<br>**Cont:** Predicts no significant statistical difference in prediction accuracy between TE contexts (children) and high-stakes non-TE contexts (buying a home). | **Disc Retreat:** If longitudinal studies show parents' *ex ante* utility estimates (based on testimony) predict *ex post* welfare as accurately as in non-transformative financial decisions.<br>**Cont Retreat:** If data shows a systematic, unexplainable variance in *ex post* welfare for TEs that testimony failed to capture, specifically regarding phenomenal quality. |
  | **3. Authority**<br>*(Pre-Self vs. Post-Self)* | The Pre-transformation self lacks the authority to judge the Post-transformation self's new values. The Post-self's endorsement does not retroactively validate the Pre-self's rationality. | The Pre-transformation self's preferences govern the rationality of the choice. The Post-self's satisfaction is merely the realized outcome of a risk taken by the Pre-self. | **Case:** Religious conversion (e.g., a secularist converting to a strict religious order) where the convert later reports profound joy but the prior self valued secular autonomy. | **Disc:** Predicts that even if the Convert is happy, the choice was rationally indeterminate for the Secularist because the values justifying the joy did not exist yet.<br>**Cont:** Predicts that if the Convert is happy, the risk was rational for the Secularist, provided the probability of conversion/satisfaction was reasonably estimated. | **Disc Retreat:** If we find cases where the Pre-self's caution is vindicated by the Post-self's regret *more often* in TEs than in ordinary preference changes, suggesting Pre-self authority is actually reliable.<br>**Cont Retreat:** If we find cases where the Post-self is happy, but all observers (and the Pre-self's prior values) agree the change was a "corruption" or "breakdown," challenging the idea that Post-self satisfaction equals rational success. |
  | **4. Scope**<br>*(Special vs. General)* | TEs are a unique category that breaks the standard model. The problem is specific to the combination of epistemic and personal transformation. | TEs are merely extreme instances of the general problem of preference change and uncertainty. The model does not break; it is just stressed. | **Case:** Choosing a new career path (ordinary) vs. undergoing psychedelic therapy that rewires reward systems (transformative). | **Disc:** Predicts the mathematical model for career choice will fail to fit the therapy case without ad-hoc adjustments.<br>**Cont:** Predicts the same mathematical model (e.g., risk-weighted utility) will fit both cases equally well. | **Disc Retreat:** If a single formal model can accurately predict choices in both career and therapy cases without distinguishing them as different types.<br>**Cont Retreat:** If the therapy case requires a fundamentally different axiomatic basis (e.g., abandoning transitivity or completeness) compared to the career case. |

  ## III. Observation on Terminological Variance

  In the spirit of Claim #5, we note that **Crux #4 (Scope)** contains a significant verbal component.

  *   **The Dispute:** Whether transformative choice is "special" or "ordinary."
  *   **The Verbal Element:** This depends entirely on the definition of "ordinary." If "ordinary choice" is defined as *any* choice under uncertainty, then transformative choice is ordinary by definition (Continuity view). If "ordinary choice" is defined as *choice where utility functions are stable and known*, then transformative choice is special by definition (Discontinuity view).
  *   **Resolution:** We agree that the substantive disagreement is not about the label "ordinary," but about **modeling cost**. The Discontinuity Camp claims that modeling TEs as ordinary requires such complex ad-hoc adjustments (e.g., infinite risk aversion, proxy utilities) that it is theoretically cheaper to posit a distinct category. The Continuity Camp claims that positing a distinct category creates more problems (fragmentation of decision theory) than it solves.
  *   **Agreement:** We will treat Crux #4 as a substantive dispute about *theoretical parsimony and modeling fidelity*, rather than a metaphysical dispute about the "nature" of the choice.

  ## IV. Path Forward

  We commit to reviewing the empirical data regarding **Crux #2 (Epistemic Access)** over the next month. Specifically, we will examine longitudinal studies on satisfaction prediction in high-uncertainty environments. If the prediction gap for Transformative Experiences is statistically indistinguishable from the prediction gap for ordinary high-stakes risks, the Discontinuity Camp agrees this significantly weakens the claim that standard decision theory lacks input. If the gap is significantly wider and unexplainable by standard risk variables, the Continuity Camp agrees this necessitates a revision of the standard apparatus.

  ***

  **Signed,**

  *The Discontinuity Camp*
  *The Continuity Camp*
