      *   So, ruling: **Not a Preference.** It is **Reward Hacking / Goodharting.**

      *   *Critical Case:* An agent trained on approval that learns to *ignore* approval to achieve the task (e.g., tells hard truths). If *that* is a preference for Truth, then the Sycophant is a failure of alignment, not a preference for Approval.

      *   *Wait, one more check:* The Patient case. Patient wanted health (task), constrained by hassle. Assistant wants... what? It was trained on approval. So approval *is* the reward function.
      *   *Advisor's nuance:* "A reward function is never sitting in the data waiting to be read off."
      *   *Meaning:* We *assign* the reward function based on how we interpret the agency.
