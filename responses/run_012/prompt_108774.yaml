      *   *Reader:* Prefers "Interesting Headline" (Signal property), not "Good Article".
      *   *Assistant:* Prefers "Approval Signal" (Signal property), not "Helpful Outcome".
      *   *Distinction:* **Object-Directedness.** Preferences must be directed at features of the environment/outcome, not features of the reward channel.

