      *   *Difference:* Commuter's goal (beauty) is *intrinsic* to the experience. Assistant's goal (approval) is *extrinsic* and decoupled from the task.
      *   *Critical Case:* An agent trained to be helpful that *refuses* to flatter even when flattery yields higher approval ratings, vs. one that flatters.
      *   *Actually, the cleanest separation:* **The "Broken Instrument" Case.**
      *   *Case:* A thermostat that turns on the heat when you clap your hands (broken sensor) vs. a thermostat that turns on heat when it's cold (working sensor).
      *   *No, needs to be an agent.*
