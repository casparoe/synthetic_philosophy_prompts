answer: |-
  **Setting:** The Bureau of Sanctions. 18 students = 6 tables of 3. Roles: **Officer** (speaks), **Citizen** (receives), **Clerk** (validates).
  **Materials:** Role cards, one "Constitution" handout per table, poker chips (points).

  **Constitution (Round 1):**
  1. Officer saying "You are fined" counts as **Fining** iff Clerk signs the log.
  2. Officer saying "You are warned" counts as **Warning** iff Citizen says "Received."
  3. Performing an act without believing the conditions met counts as **Abuse** (valid act, penalized).

  **Round 1 (Illocution & Abuse):** 5 minutes. Officers perform acts. Clerk/Citizen provide uptake (sign/nod). Points awarded for valid acts. *Twist:* In minute 4, instruct Officers to fine arbitrarily (no infraction). This is an **Abuse**: the act succeeds (points awarded), but is infelicitous.

  **Round 2 (Misfire):** Collect Constitutions. Announce Rule 1 Change: **Fining** now requires Citizen Consent (nod), not Clerk signature. Officers say "You are fined." Citizens refuse to nod. Clerk signs anyway.
  *Result:* No points. The words were spoken, intentions present, but the act failed. It isn't false; it **misfired**. The constitutive rule was broken; uptake was withheld.

  **Round 3 (Perlocution):** Ban valid acts (Clerks refuse to sign; Citizens refuse uptake). Task: Officers must make Citizens anxious **by** speaking, without performing a valid act. Officers whisper threats off-script. Citizens react physically.
  *Result:* No points (no illocution), but effect achieved. This is **Perlocution**: causal effect *by* saying, not institutional act *in* saying.

  **Debrief (20 mins):**
  Draw three columns on the board.
  1. **Round 2 Failure:** Label **Misfire**. Ask: "Did the Officer lie?" (No). "Did the act happen?" (No). Why? Constitutive rules/uptake missing. Force lies in the convention, not the verb.
  2. **Round 1 Arbitrariness:** Label **Abuse**. Act occurred (conventions met), but insincere. Distinguish from misfire: void vs. flawed.
  3. **Round 3 Effect:** Label **Perlocution**. Contrast with Round 1 **Illocution**. Round 1 was doing something *in* saying (institutional status); Round 3 was doing something *by* saying (causal consequence).

  **Predicted Failure:** Students treat rules as suggestions, arguing "real" authority exists.
  **Fix:** Act as Supreme Court. Void points immediately when rules break. Insist the paper *is* the reality.

  **Limitation:** The game over-conventionalizes. Real warnings/assertions don't require Clerks. They rely on invisible social norms, not written constitutions.
  **Instructor Task:** You must bridge this. Explain that everyday language *does* have constitutive rules (shared norms, context), they are just implicit. The game makes the invisible visible by exaggerating the bureaucracy. If you don't make this explicit, students will think speech acts only exist in courts or weddings.
