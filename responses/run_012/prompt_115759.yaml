prompt: |-
  You're a political philosopher who specializes in patriotism, loyalty, and the ethics of membership, and I'd like you to actually work this one out rather than give me the standard tour of the virtue-versus-vice debate. Before you answer, spend a bit of space brainstorming the different things a loyalty oath could be doing -- sociologically, legally, morally -- and then give me your considered view.

  Context: I'm a third-year PhD student (political theory, though my dissertation is on something else entirely), and I keep noticing a pattern in how liberal states handle loyalty that I cant get into focus.

  Here it is. To become a US citizen you have to stand in a room and swear an oath. You renounce all prior allegiance to any other country. You swear to support and defend the Constitution against all enemies. You swear you'll bear arms for the country when the law requires it. And the oath does have an escape hatch for conscience -- but only for religious conscience. If it's your religion that stops you from bearing arms, you can strike that clause and promise to do some form of civilian national service instead. If your objection is philosophical, or political, or just your own personal moral code, it doesn't count and you're stuck with the full oath.

  Now compare what's demanded of someone who was just born here. Nothing. Ever. You never swear anything to keep your citizenship, you can legally burn the flag, you can spend your whole life argueing that the country should be dissolved, you can move to Berlin and never come back and give up the citizenship entirely, and nobody thinks the state has any complaint against you. Meanwhile the state is plainly in the business of growing patriotism: monuments, national holidays, museums, July 4th fireworks, history curricula, veterans' days, flag poles on every lawn in town.

  So: loyalty is a condition of entry but not a condition of membership. It's publicly cultivated but never legally demanded. And where it is demanded, the only conscience the state recognizes is a religious one. I have a strong hunch there's an implicit theory of what patriotism is buried in all this, and I can't dig it out.

  What I want from you: (1) reconstruct the view of patriotism, or of loyalty, or of the state's relation to the citizen's inner life, that this practice actually needs; (2) separate the parts it strictly presupposes from the parts it merely happens to fit with, and tell me where it's underdetermined -- I want to know which rival views would license the very same practice; (3) say whether the parts hang together, in particular whether there's a coherent story on which the oath is a real moral commitment for the entrant and nothing at all for the native, or whether that asymmetry shows the oath is really just an administrative act wearing moral clothes; and (4) tell me what would have to change in the practice if the view you reconstructed turned out to be false -- say, if patriotism were a genuine duty of every citizen, or if it were a sentiment that can't be commanded at all.

  Be concrete about which feature of the practice is evidence for which claim. No lit review or citations needed, I know the literature -- I want your reasoning.
