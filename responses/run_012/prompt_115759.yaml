      *   *Structure:* Follow the four prompts exactly.
      *   *Brainstorming Section:* Keep it tight, categorize functions.
      *   *Reconstruction:* Focus on "Asymmetric Voluntarism" and the "Public/Private Split."
      *   *Coherence:* Challenge the "Tacit Consent" narrative.
