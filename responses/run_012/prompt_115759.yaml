  3.  **Reconstructing the Implicit Theory (Requirement 1):**
      *   *The Core Tension:* Why demand it of immigrants but not natives?
      *   *Hypothesis:* The state views political obligation as *presumptive* for natives (born into the covenant) but *voluntarist* for immigrants (choosing to enter the covenant).
      *   *The "Religious Only" Conscience Clause:* This suggests the state cares about *capacity* to obey, not *moral agreement*. Religion is seen as an external constraint on capacity (God > State), whereas philosophical objection is seen as a refusal of the political bond itself.
      *   *Cultivation without Demand:* Patriotism is a *sentiment* to be nurtured in natives, but a *contractual term* for immigrants.
      *   *The Theory:* "Asymmetric Voluntarism." Natives are bound by *jus sanguinis/soli* (mystic bond of birth), Immigrants are bound by *contract* (explicit consent). The Oath is the moment of conversion.

  4.  **Separating Presuppositions from Contingencies (Requirement 2):**
      *   *Strict Presuppositions:*
          *   Citizenship is a status with different entry modes (birth vs. choice).
          *   The State has the authority to demand explicit renunciation of prior sovereignty from outsiders.
          *   Religious conscience is categorically distinct from moral/political conscience (legal definition of religion vs. philosophy).
      *   *Contingent/Underdetermined:*
          *   *Rival View A (Expressive):* The oath isn't about binding the immigrant, it's about reassuring the natives. (Explains why natives don't need it—they are already trusted).
          *   *Rival View B (Administrative):* It's just a paperwork hurdle. The moral weight is illusory.
          *   *Rival View C (Pedagogical):* The oath is a teaching moment for the immigrant, not a binding contract.
      *   *Where it's underdetermined:* Does the state *believe* the oath creates obligation, or does it just use it as a screening device? The practice fits both.

  5.  **Evaluating Coherence (Requirement 3):**
      *   *The Asymmetry:* Is it coherent to say "You must swear to defend" (Immigrant) vs. "You don't have to swear, but we hope you feel like it" (Native)?
      *   *Coherent Story:* Lockean Consent Theory. Natives give "tacit consent" by staying/accepting benefits. Immigrants give "express consent." Express consent requires clearer terms.
      *   *Incoherent Story:* If patriotism is a *moral duty* for all, exempting natives is unfair. If patriotism is *involuntary sentiment*, demanding it from immigrants is coercive.
      *   *My Verdict:* It hangs together *only* if we accept a "Two-Tiered Theory of Obligation." Tier 1: Organic/Presumptive (Natives). Tier 2: Contractual/Explicit (Immigrants). The risk is that the Oath becomes "administrative wearing moral clothes" if the state doesn't actually enforce the duties (e.g., rarely prosecutes treason, rarely calls for civilian service).
