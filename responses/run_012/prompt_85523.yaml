      *   **Task:** 12-minute talk, followed by a *longer* Q&A period.
      *   **Topic:** Advance Directives (AD) vs. Current Preferences in Dementia.
      *   **Thesis:** AD binds *unless* the current self passes the "Standing-Self Test" (Comprehension, Stability, Ownership). If passed, current preference overrides AD (from binding order to strong presumption).
      *   **Corollary:** "Demotion clauses" (e.g., "ignore me if I don't recognize my kids") should be void.
      *   **Cases:** Ruth (inconsistent preference, pneumonia), Marcus (directive demands treatment *because* he's content, nurses hate this), Unresolved Woman (amended directive while already demented).
      *   **Deliverable:** Q&A Prep Sheet. No citations/reading lists. Plain language for speaking.
      *   **Specific Requirements:** Order objections by damage potential. Phrase objections like the specific stakeholder. Provide 2-minute spoken replies. Include "soft spots." Identify opening concession, fatal concession, crucial reply, and the "hope nobody asks" question.

  2.  **Deconstruct the Thesis & Vulnerabilities:**
      *   *Strength:* Respects current autonomy, acknowledges the reality of dementia care (people change).
      *   *Weakness:* High burden of proof for the "Standing-Self Test." Who administers it? When? What if it's wrong?
      *   *The "Demotion Clause" Contradiction:* The user admits this sits badly. If the earlier self can't bind the later self via a demotion clause, why can they bind them via a treatment refusal? This is a logical tension.
      *   *Practicality:* Nurses need clear rules. A "test" at 3 AM is hard.
      *   *Legal:* State laws usually prioritize the written AD. Deviating creates liability.
      *   *Ethical:* Is a demented person's "contentment" enough to override a prior wish to avoid prolonged life? (Disability rights/Dworkin critique).

  3.  **Drafting the Objections (Stakeholder Analysis):**

      *   *Hospice Nurses:* Practical, emotional, patient-focused. They see the suffering. They hate the Marcus case (forcing treatment on a happy demented person).
      *   *Clinical Ethicist:* Needs a workflow. "How do I document this?" "Who decides if comprehension is met?"
      *   *Geriatric Psychiatrist:* Clinical expertise on capacity. "Stability" is subjective. Phrasing matters.
      *   *Disability Rights Advocate:* "Quality of life" judgment. Who decides what reasons count as "Ownership"? Is "I like pudding" a valid reason to live?
      *   *Hospital Lawyer:* Liability. Statutory law vs. this test. Risk management.
      *   *Philosophy Teacher (Kantian):* Autonomy over time. Unity of the will.
      *   *Chaplain:* Spiritual identity. Is the "soul" still there in the cheerful dementia?

  4.  **Ordering by Damage:**
      1.  *Lawyer:* Legal liability shuts down the talk immediately. If it's illegal, the ethics don't matter.
      2.  *Nurses (Marcus Case):* Emotional impact. If the audience thinks the proposal is "monstrous," they tune out.
      3.  *Ethicist:* Practicality. If it can't be implemented, it's just theory.
      4.  *Disability Advocate:* Moral hazard. Accusation of bias against the disabled.
      5.  *Psychiatrist:* Clinical validity.
      6.  *Chaplain/Teacher:* Philosophical nuances (less damaging to the core proposal).

  5.  **Developing Replies & Soft Spots:**
      *   *Constraint:* 2 minutes spoken (approx. 250-300 words).
      *   *Tone:* Respectful, humble but firm, practical.
      *   *Soft Spot:* Must acknowledge where the theory is weak (e.g., the demotion clause tension).

  6.  **Addressing Specific Prompts:**
      *   *Opening Concession:* Needs to lower defenses. Acknowledge the weight of ADs.
      *   *Fatal Concession:* What kills the thesis? Admitting the "Standing-Self Test" is too subjective to be a *rule* rather than a *guide*. Or conceding on the Demotion Clause logic.
      *   *Crucial Reply:* The Marcus case. If he loses the room on Marcus, he loses the room.
      *   *Hope Nobody Asks:* The logical inconsistency between binding treatment but not binding demotion.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Refining the Lawyer's Objection:* Focus on "Standard of Care" and "Statutory Authority."
