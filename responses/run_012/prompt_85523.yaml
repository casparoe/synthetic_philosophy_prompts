answer: |-
  **Q&A PREP SHEET: REGIONAL STUDENT BIOETHICS FORUM**

  **Speaker:** High-School Junior
  **Topic:** Advance Directives vs. The Standing-Self Test
  **Audience:** Hospital Staff (Clinical, Legal, Ethical, Pastoral)
  **Goal:** Survive the Q&A without losing the room, acknowledge limits without collapsing the thesis.

  ---

  ### **OPENING STRATEGY: THE FIRST 30 SECONDS**

  **The Concession to Make:**
  Start by admitting that Advance Directives are the *default* and that your test is the *exception*, not the rule.
  *Say this:* "I want to be clear before we start: I am not arguing that Advance Directives should be easy to override. In ninety percent of cases, the document should win. My test is only for the hard ten percent where the person in the bed is clearly speaking, but the paper says they aren't allowed to."
  *Why:* This stops the nurses and lawyers from thinking you want to throw out all paperwork and just "go with the vibe." It lowers their guard.

  **The Fatal Concession (Do Not Make):**
  Do not admit that the "Standing-Self Test" is too subjective to be used by nurses or doctors.
  *Why:* If you agree the test is too hard to administer, your proposal becomes a philosophy paper, not a clinical tool. You must maintain that while difficult, it is *possible*.

  **The Crucial Reply:**
  You must land the reply to the **Hospice Nurses regarding Marcus**. If the room decides your theory causes cruel suffering, they will stop listening to the logic. You need to validate their pain while holding the line on autonomy.

  **The Question You Hope Nobody Asks:**
  "If the earlier self isn't allowed to decide *when* the later self loses capacity (the demotion clause), why is the earlier self allowed to decide *what medical treatment* the later self receives? Isn't that the same judgment?"
  *Why:* This targets the logical tension you admitted in your prompt. There is no clean answer yet.

  ---

  ### **OBJECTIONS (ORDERED BY DAMAGE POTENTIAL)**

  #### **1. The Hospital Lawyer**
  **Damage Level:** Critical. If you are proposing illegal acts, the talk ends.
  **The Objection:** "Our state statute says an Advance Directive is effective when the attending physician determines the patient lacks capacity. Your test suggests we ignore that bright line. If a nurse uses your 'Stability' check instead of a formal capacity evaluation, and the patient dies, you have just exposed this hospital to a wrongful death suit. How do you square your test with the law?"
  **Your 2-Minute Reply:**
  "I'm not suggesting we ignore the law on capacity; I'm suggesting we refine how we assess it. The law says we must determine if the patient lacks capacity. My 'Standing-Self Test' is a tool for making that determination more precise in dementia cases. Currently, a diagnosis of dementia often acts as a proxy for 'no capacity.' I am arguing that a diagnosis isn't enough; we need to check for Comprehension, Stability, and Ownership. If the patient passes those three, they legally *have* capacity, regardless of the diagnosis. I am not asking staff to break the law; I am asking them to apply the capacity standard more rigorously so we don't violate the civil rights of someone who can still choose."
  **Where It's Soft:**
  You are assuming the law allows for "fluctuating capacity" to override a written directive easily. In many jurisdictions, a written directive trumps a vague verbal preference, even if capacity is borderline. You are betting on a legal gray area.

  #### **2. The Two Hospice Nurses**
  **Damage Level:** High. They hold the moral heart of the room.
  **The Objection:** "Let's talk about Marcus. He's happy. He's not suffering. His past self said, 'If I'm happy like this, force treatment on me.' You say we have to do it because he fails your test. That feels monstrous. We are spending our days sticking needles into a man who doesn't want them, based on a paper written by a ghost. Why should his past misery dictate his current peace?"
  **Your 2-Minute Reply:**
  "I know it feels monstrous. I have watched you care for him, and I know you hate causing distress. But we have to ask: whose life is it? Marcus's earlier self decided that being 'placid and content' wasn't a life he valued. He valued engagement and struggle. If we ignore that, we are saying the 'happy Marcus' is the only Marcus that matters. We are effectively erasing the person who planned his life. My test protects Ruth, who can still say what she wants. But for Marcus, his earlier self is the only one who knew what kind of life he wanted to live. We honor him by respecting his definition of a life worth living, even if his current self can't understand that definition anymore."
  **Where It's Soft:**
  This relies on the "Precedent Autonomy" argument, which many find cold. It doesn't fully answer the pain of the nurses who have to inflict the treatment. It sounds theoretical to someone holding a syringe.

  #### **3. The Clinical Ethicist**
  **Damage Level:** Medium-High. If it doesn't work, it won't be used.
  **The Objection:** "You want this to work at three in the morning. Your 'Stability' condition requires checking a preference on two occasions separated by a day. In an emergency, or a weekend shift with floating staff, that documentation won't exist. If the test isn't met, do we default to the directive? If so, isn't this just a complicated way of saying 'Follow the directive unless someone documents otherwise'?"
  **Your 2-Minute Reply:**
  "You're right that it can't be done instantly in a crisis. In an emergency, we default to the directive. But for decisions like pneumonia treatment or feeding tubes, we have time. My point isn't that we do this for every pill, but for the major life-and-death turns. If the staff suspects the patient is expressing a preference, they have a duty to check if it's stable. If we don't have the documentation because no one asked twice, then yes, the directive stands. But I'm arguing we have an ethical duty to create that documentation when the stakes are high, rather than assuming the silence of the patient means agreement with the paper."
  **Where It's Soft:**
  You are adding workload to an already stretched staff. The Ethicist knows that "ethical duties" often vanish when staffing is low. You are relying on ideal conditions.

  #### **4. The Disability-Rights Advocate**
  **Damage Level:** Medium. Accusations of bias.
  **The Objection:** "Your 'Ownership' condition says the patient must give a reason that isn't just an aversion to being moved. But isn't 'I don't want to be moved' a valid reason? You are setting a higher bar for cognitive disabled people than for us. If I refuse surgery because I'm scared, that's respected. If Ruth refuses because she's scared, you say she lacks Ownership. This looks like quality-of-life judgment disguised as procedure."
  **Your 2-Minute Reply:**
  "That is a serious concern, and I want to be careful. I am not saying 'I don't want to be moved' is invalid. I am saying that in severe dementia, that phrase can sometimes mean 'I am confused by the stranger touching me,' not 'I have weighed the risks and refuse.' The test is there to protect Ruth from having her confusion interpreted as a medical refusal. If she can explain, even simply, that she wants to stay because she likes her room, that counts. I am trying to distinguish between a reflex and a choice. If we treat every reflex as a choice, we might accidentally let her die from an infection she would have fought if she understood it."
  **Where It's Soft:**
  The line between "reflex" and "choice" is incredibly thin. You risk sounding like you are deciding which reasons are "smart enough" to count.

  #### **5. The Geriatric Psychiatrist**
  **Damage Level:** Medium. Clinical validity.
  **The Objection:** "You say 'Stability' survives a change of questioner. But in my field, we know that dementia patients often have 'favorite people.' They might agree with you and not me simply because they trust you. That doesn't mean their preference is stable; it means their social processing is impaired. How do you separate trust from capacity?"
  **Your 2-Minute Reply:**
  "You're right that trust skews answers. That's why the test requires the preference to survive a change in *phrasing* too. It's not just about who asks, but how it's asked. If I ask, 'Do you want to go to the hospital?' and she says yes, but then I ask, 'Do you want to leave your pudding and the sing-along?' and she says no, she doesn't grasp the alternative. The test isn't perfect, but it's better than assuming that because she has dementia, her 'yes' means the same thing my 'yes' means. We have to try to find the signal in the noise."
  **Where It's Soft:**
  You are asking nurses to be skilled interviewers. They may not have that training.

  #### **6. The Chaplain**
  **Damage Level:** Low-Medium. Spiritual/Identity focus.
  **The Objection:** "You talk about the 'earlier self' binding the 'later self.' But spiritually, Ruth is still Ruth. Her joy in the sing-along might be more 'her' than the angry woman who wrote the directive after her husband died. Why do we privilege the sad, healthy self over the happy, impaired self?"
  **Your 2-Minute Reply:**
  "That's a beautiful point, and in Ruth's case, my test actually agrees with you. Because Ruth passes the Standing-Self Test—she understands, she is stable, she owns her reason—her current wish wins. The directive drops to a presumption. I only privilege the 'earlier self' when the 'later self' can no longer hold the thread of who they are. When Marcus can't understand what treatment means, *then* we look to the person who knew him best: his former self. But when Ruth can speak for herself, I am on your side. She governs."
  **Where It's Soft:**
  This works for Ruth, but brings you back to the Marcus problem. The Chaplain might not accept that "understanding treatment" is the metric for being "truly oneself."

  #### **7. The Philosophy Teacher (Kantian)**
  **Damage Level:** Low. Theoretical consistency.
  **The Objection:** "Kant asks how one will can have two legislators. If the earlier self binds the later, you treat the later self as a means, not an end. If the later self overrides the earlier, you break the promise. How do you resolve this contradiction without just picking a winner?"
  **Your 2-Minute Reply:**
  "I resolve it by saying the 'later self' only gets to legislate if they are actually capable of legislation. If they pass the Standing-Self Test, they are a legislator, and the earlier self steps down. If they fail the test, they are not legislating; they are reacting. In that case, honoring the earlier self isn't treating the later self as a means; it's protecting the only autonomous agent left in the timeline. I'm not picking a winner based on time; I'm picking a winner based on capacity."
  **Where It's Soft:**
  This is very abstract. It might sound like you are defining "capacity" in a circle to make your theory work.

  ---

  ### **CLOSING ADVICE**

  **Body Language:**
  When the Nurses or the Lawyer speak, lean in. Do not cross your arms. When you answer, look at the whole room, not just the person who asked.

  **If You Get Stuck:**
  If someone corners you on the "Demotion Clause" contradiction (The Question You Hope Nobody Asks), do not bluff.
  *Say:* "That is the strongest objection to my view. I believe a person can decide their medical treatment, but I struggle with whether they can decide the legal standard of their own capacity. I don't have the full solution to that yet, but I believe the default should be to assume capacity remains until proven otherwise by the test."
  *Why:* Honesty about the limit of your thesis shows more maturity than a fake answer.

  **Final Reminder:**
  You are the only person in the room who has spent afternoons holding the hands of the people we are talking about. Use that. When in doubt, go back to the story. "When I sat with Ruth..." is a stronger argument than "The principle suggests..."
