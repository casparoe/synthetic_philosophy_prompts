          *   *Formal vs. Substantive Equality:* Treating everyone the same (France) vs. treating everyone according to their needs (Accommodation).
      *   *Evidence needed:* Not more descriptions of laws, but sociological data on *experienced discrimination* or *social cohesion* in each model.

