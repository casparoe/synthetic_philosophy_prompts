answer: |-
  **Q&A Prep: Foundation Restitution Proposal**

  **1. The Fiduciary (Legal Liability)**
  *Likelihood: High | Damage: Critical*
  **Q:** "If we formally acknowledge guilt, are we opening the foundation to lawsuits or jeopardizing our tax-exempt status?"
  **Reply:** No. We are distinguishing moral responsibility from legal liability. We aren't admitting guilt in a court of law; we are acknowledging a moral debt in the court of conscience. Think of it like patching a security vulnerability in legacy code. You fix it because it's the right thing to do for system integrity, not because you were sued.
  **Weakness:** They may fear any written admission creates a discoverable paper trail that plaintiffs' lawyers could use, regardless of your intent.

  **2. The Historian (Continuity)**
  *Likelihood: Medium | Damage: High*
  **Q:** "Institutions aren't people. The legal entity from the 1890s doesn't exist. Why are we treating the foundation as a continuous moral agent?"
  **Reply:** Because we claim continuity where it benefits us. We use their name, occupy their buildings, and spend their money. We accept the identity they built. You cannot inherit the house and the inheritance but disclaim the mortgage and the crimes used to build it. Continuity is a package deal.
  **Weakness:** Legally, corporate succession is complex. They can argue the "package deal" is a metaphor, not a binding rule of history.

  **3. The Fiduciary (Duty to Mission)**
  *Likelihood: High | Damage: Medium*
  **Q:** "Our fiduciary duty is to the current mission. Doesn't diverting endowment to past wrongs violate our charter?"
  **Reply:** The mission depends on the legitimacy of the resources. You cannot build a charitable future on a foundation everyone knows is corrupted. Protecting the reputation *is* fiduciary duty. If the source is toxic, the output is compromised.
  **Weakness:** Hard to prove materially that a "toxic source" impacts current charitable output metrics or donor behavior.

  **4. The Pragmatist (Cost & Authority)**
  *Likelihood: Medium | Damage: Medium*
  **Q:** "Let's say we agree. How much do we owe, who gets it, and who decides?"
  **Reply:** We don't decide alone. We fund a process to consult descendants and experts to determine restitution. The cost is budgeted as 'integrity maintenance,' essential for long-term survival, not a one-off expense.
  **Weakness:** Vague. Board members want numbers and control, not open-ended processes that could drain funds indefinitely.

  **5. The Question I Hope Nobody Asks**
  *Likelihood: Low | Damage: Existential*
  **Q:** "If the moral debt exceeds our current assets, are you prepared to recommend we dissolve the foundation?"
  **Reply:** If the cost of genuine repair exceeds our capacity, then yes. A foundation that exists only by ignoring its origin story has no moral right to exist.
  **Weakness:** This terrifies the board. It suggests the logical conclusion of your argument might be their own unemployment and the end of the charity.

  **Strategy Note:**
  Stick to the "System Integrity" analogy. You are the engineer. Tell them the system has a critical dependency on a compromised library. You can't update the app without addressing the dependency. Avoid philosophical terms. Speak of "legacy debt," "technical moral debt," and "systemic risk." If you sound like you're preaching, you lose the fiduciaries. If you sound like you're auditing the system, they might listen.
