answer: |-
  # Specification: Collective Judgment Aggregation System

  ## 1. Objective
  To define the functional and normative requirements for a procedure that aggregates individual binary judgments (True/False, Yes/No) on a set of logically interconnected propositions into a single set of collective judgments. The system must resolve the inconsistency where a group accepts the premises of an argument but rejects the conclusion (or vice versa).

  ## 2. Core Functional Requirements

  ### 2.1 Input Domain (Universal Domain)
  *   **Requirement:** The system must accept any combination of individual judgment sets, provided each individual's set is internally logically consistent.
  *   **Reasoning:** We cannot assume committee members will naturally align. The tool must handle deep disagreement without crashing or rejecting input.
  *   **Status:** **Non-Negotiable.** A tool that fails when disagreement is high is useless for a committee.

  ### 2.2 Output Consistency (Collective Rationality)
  *   **Requirement:** The collective output must be logically consistent. If the group accepts $P$ and accepts $P \to Q$, the group must accept $Q$.
  *   **Reasoning:** This addresses your specific "backwards tally" problem. A group that asserts $A$, $B$, and $\text{not}(A \land B)$ is incoherent and vulnerable to legal/ethical challenge.
  *   **Status:** **Non-Negotiable.** This is the primary defect you are trying to fix.

  ### 2.3 Completeness vs. Abstention
  *   **Requirement:** The system must either produce a judgment on every proposition on the agenda OR explicitly flag a proposition as "Undecided/No Collective Judgment." It cannot output a contradiction.
  *   **Reasoning:** Sometimes the disagreement is too severe to aggregate. Forcing a decision creates noise; allowing abstention preserves integrity.
  *   **Status:** **Non-Negotiable.** (The option to abstain is mandatory; whether you *must* abstain in ties is a parameter).

  ### 2.4 Premise-Conclusion Distinction
  *   **Requirement:** The system must allow the administrator to designate which propositions are "Premises" (e.g., "Is research good?") and which are "Conclusions" (e.g., "Promote?").
  *   **Reasoning:** Judgments on facts (research quality) differ from judgments on decisions (promotion). Aggregating at the premise level yields different results than aggregating at the conclusion level. The tool must support both modes.
  *   **Status:** **Non-Negotiable.** Collapsing this distinction is what causes your current paradox.

  ## 3. Normative Constraints (Fairness & Weighting)

  ### 3.1 Anonymity (Equal Weight)
  *   **Requirement:** The identity of the voter does not affect the weight of their judgment.
  *   **Reasoning:** Standard democratic norm. Prevents hierarchy from dictating truth.
  *   **Status:** **Camp Preference.** (See Section 5 on Expertise).

  ### 3.2 Expertise Weighting
  *   **Requirement:** The system allows for differential weighting of voters based on verified competence in specific sub-domains (e.g., the two research experts count double on research questions).
  *   **Reasoning:** You noted two members know more. Ignoring this reduces epistemic quality.
  *   **Status:** **Camp Preference.** (Mutually exclusive with strict Anonymity).

  ### 3.3 Unanimity Preservation (Pareto)
  *   **Requirement:** If every member judges $P$ as True, the collective judgment must be True.
  *   **Reasoning:** If everyone agrees, the group should not contradict them.
  *   **Status:** **Non-Negotiable.** Violating this makes the group appear adversarial to its own members.

  ## 4. Robustness & Strategy

  ### 4.1 Independence (Issue-by-Issue Aggregation)
  *   **Requirement:** The collective judgment on proposition $P$ is determined *only* by the individual judgments on $P$, not by judgments on $Q$ or $R$.
  *   **Reasoning:** This is your current workflow ("vote on sub-questions separately"). It prevents logrolling (I'll vote for your teaching if you vote for my research).
  *   **Status:** **Camp Preference.** (This is the primary source of the impossibility result).

  ### 4.2 Agenda Independence
  *   **Requirement:** The judgment on $P$ should not change if an unrelated proposition $Z$ is added to the agenda.
  *   **Reasoning:** Prevents manipulation by padding the agenda.
  *   **Status:** **Non-Negotiable.**

  ### 4.3 Strategy-Proofness
  *   **Requirement:** No member should be able to achieve a more preferred outcome by misrepresenting their true judgment.
  *   **Reasoning:** You have a member who votes strategically. This undermines the "truth-tracking" goal of the committee.
  *   **Status:** **Camp Preference.** (Mathematically very costly to achieve).

  ---

  ## 5. The Impossibility Cluster (The Trade-Offs)

  You cannot build a system that satisfies all the **Non-Negotiable** and **Camp Preference** items above simultaneously. This is not a bug; it is a mathematical limit. Specifically, the following subset of requirements is **jointly unsatisfiable** when the agenda contains logically connected propositions (like your sub-questions + overall promotion):

  1.  **Universal Domain** (Accept any pattern of votes)
  2.  **Collective Rationality** (Output must be logically consistent)
  3.  **Independence** (Vote on each question separately)
  4.  **Non-Dictatorship** (No single person determines the outcome)
  5.  **Unanimity Preservation** (If all agree, group agrees)

  **The Conflict:**
  Your current system satisfies 1, 3, 4, and 5. It fails on **2 (Collective Rationality)**. This is why you get the "wins sub-questions, loses overall" paradox.

  **To fix this, you must drop one of the other constraints.** Here are your design choices:

  ### Option A: Drop Independence (The Premise-Based Procedure)
  *   **What you give up:** You stop voting on the conclusion ("Promote?") directly. You vote *only* on the premises ("Research?", "Teaching?"). The outcome on "Promote" is determined **automatically** by the logic of the premise votes.
  *   **What you gain:** Collective Rationality is guaranteed. No more backwards tallies.
  *   **Cost:** The group might end up with a "Promote" decision even if a majority explicitly voted "No Promote" on the final question (because the premises forced a "Yes"). This feels undemocratic to some.
  *   **Verdict:** **Recommended.** This is the standard fix for hiring committees. It forces the group to align the decision with the criteria.

  ### Option B: Drop Independence (The Conclusion-Based Procedure)
  *   **What you give up:** You stop counting the votes on the sub-questions as binding. You vote *only* on "Promote." The sub-questions are recorded as advisory opinion.
  *   **What you gain:** Collective Rationality is guaranteed (because you only have one output proposition).
  *   **Cost:** You lose accountability on *why* the decision was made. A candidate could be promoted despite majority belief they are bad at research, provided enough people voted "Promote" for other reasons.
  *   **Verdict:** **Risky.** Hard to defend in tenure/promotion disputes where criteria are mandated.

  ### Option C: Drop Non-Dictatorship (The Expert Dictator)
  *   **What you give up:** Equality. You assign the decision on specific propositions to specific members (e.g., the two research experts decide the research question).
  *   **What you gain:** Consistency and Epistemic Quality.
  *   **Cost:** Violates Anonymity. Politically difficult to implement formally.
  *   **Verdict:** **Viable as a Weighted System.** If you implement Expertise Weighting (Section 3.2), you effectively move toward this. Note that high weighting can mathematically approximate a dictator.

  ### Option D: Drop Strategy-Proofness
  *   **What you give up:** The guarantee that members cannot game the system.
  *   **What you gain:** You can keep Independence and Non-Dictatorship.
  *   **Cost:** You admit that your strategic voter (Section 4.3) is acting rationally within the system. You cannot code him out; you must police him socially.
  *   **Verdict:** **Acceptable Reality.** Perfect strategy-proofness usually requires a Dictator (Option C). It is better to accept this vulnerability than to hand one person total control.

  ## 6. Critical Design Decision: The "Single Requirement"

  If there is one requirement that does the most work in ruling out plausible procedures, it is **Independence (4.1)**.

  *   **Why:** If you enforce Independence (vote on every proposition separately based only on votes for that proposition), you are mathematically guaranteed to produce inconsistent outcomes (your current paradox) unless you allow a Dictator.
  *   **Implication:** To get a rational group outcome, you **must** allow the judgment on one proposition (e.g., "Promote") to depend on the votes cast for *other* propositions (e.g., "Research").
  *   **Implementation:** Your tool should not tally the "Promote" column. It should calculate the "Promote" column based on the tallies of the "Research" and "Teaching" columns using a pre-agreed logical formula (e.g., `IF Research=Yes AND Teaching=Yes THEN Promote=Yes`).

  ## 7. Summary of Recommendations for the Tool

  1.  **Enforce Collective Rationality:** The tool must not output a contradictory set of judgments.
  2.  **Abandon Independence on the Conclusion:** Do not tally the final "Promote" vote. Derive it from the sub-scores. (Drop Requirement 4.1 for the conclusion).
  3.  **Allow Weighted Input:** Permit the chair to assign higher weights to specific members on specific sub-questions to satisfy the "Expertise" constraint (Drop Requirement 3.1).
  4.  **Accept Strategy Vulnerability:** Do not attempt to algorithmically prevent strategic voting; it is too costly. Rely on transparency (publish the ballots) to deter it (Drop Requirement 4.3).
  5.  **Enable Abstention:** If the premise votes are tied or inconclusive, the tool should output "No Decision" rather than forcing a random tie-break (Satisfies Requirement 2.3).

  **Final Warning:** If you attempt to keep **Independence** (tallying every column separately) and **Non-Dictatorship** (equal weight), the tool *will* produce the paradoxical results you are currently seeing. You must choose between a consistent group mind (Premise-Based) or a consistent tallying method (Independent). You cannot have both.
