          *   Tone: Analytical, precise, philosophical but accessible (no fluff).

  2.  **Deconstruct the Concept of Self-Deception:**
      *   What makes it hard? The "Static Paradox" (believing $p$ and not-$p$ at the same time) and the "Dynamic/Intentional Paradox" (intending to deceive oneself while knowing the truth).
      *   An adequate theory needs to navigate these without positing impossible mental states or collapsing into simpler phenomena.

  3.  **Drafting the Desiderata (The "Spec"):**
      *   *Requirement 1: The Tension Condition.* It can't just be being wrong. There must be evidence available that contradicts the belief. (Distinguishes from ignorance).
      *   *Requirement 2: The Agency/Motivation Condition.* The belief formation must be driven by a desire or need, not just cognitive error. (Distinguishes from simple bias).
      *   *Requirement 3: The Sincerity Condition.* The subject must *feel* like they believe the false proposition. They aren't consciously lying. (Distinguishes from lying/pretending).
      *   *Requirement 4: The Instability/Behavioral Condition.* The belief shouldn't be rock solid. It leaks into behavior (checking the phone). (Distinguishes from stable delusion or pure wishful thinking).
      *   *Requirement 5: The Doxastic Condition.* It must involve a genuine belief state, not just avowal. (Aligns with facts about belief).

  4.  **Testing Against Cases:**
      *   *Faithful Wife/Phone Checking:* Shows the Instability Condition. He says he trusts, but acts like he doesn't.
      *   *Excuse Spreadsheet:* Shows the Agency Condition. He avoids the evidence *on purpose* (strategic avoidance).
      *   *Failing Marriage:* Shows the Sincerity Condition + Mutual collusion. Both sincerely believe the other is fooled.
      *   *Hindsight Business Failure:* This is tricky. Is it self-deception or hindsight bias? Needs to show *prior* investment in the belief to count. Let's treat it as "I knew it all along" to protect ego (motivated).
      *   *Externally Installed Confidence:* Tests the Agency Condition. If the maintenance is internal but the seed was external, is it self-deception? Yes, if he actively suppresses doubt now.

  5.  **Identifying the "Squeeze" (Incompatible Requirements):**
      *   The classic paradox: How can you intend to deceive yourself (knowing the truth) while successfully believing the lie?
      *   *Conflict:* The **Sincerity Condition** (I believe $p$) vs. The **Knowledge/Agency Condition** (I know not-$p$ enough to steer toward $p$).
      *   If I know not-$p$, how can I sincerely believe $p$? If I sincerely believe $p$, how did I know not-$p$ to start the process?
      *   This is the "Static Paradox" vs. "Intentional Paradox."

  6.  **Evaluating Standard Theories (2-3 lines each):**
      *   *Split-Mind (Freud/Modular):* Solves the paradox by compartmentalizing. One part knows, one part believes. *Critique:* Over-intellectualizes, lacks empirical evidence for homunculi.
      *   *Motivated Bias (Mele):* No intention to deceive. Just anxiety-driven evidence weighting. *Critique:* Saves rationality but loses the "deception" aspect; collapses into bias.
      *   *No-Belief (Sartre/Deflationary):* It's pretending, not believing. *Critique:* Violates the Sincerity Condition; doesn't explain why the subject feels no guilt of lying.

  7.  **Refining and Polishing:**
      *   Make sure the distinctions are sharp.
      *   Ensure the "Squeeze" is clearly identified as the tension between *intentionality* and *sincerity*.
      *   Check the case studies against the criteria.
      *   Adhere to the length constraints for the final section.

  8.  **Self-Correction/Review during drafting:**
