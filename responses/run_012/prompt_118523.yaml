      *   *Correction:* The "Externally Installed" case tests the boundary of *self*-deception. If the coach did it, is it deception by another? The prompt says "now does all the maintaining himself." So it counts if the maintenance involves suppressing doubt.
      *   *Refinement:* Ensure the distinction between "wishful thinking" and "self-deception" is clear. Wishful thinking is hoping; self-deception is *believing* based on the hope.

  9.  **Final Output Structure:**
      *   Introduction (The Spec).
      *   The 5 Desiderata (with rationale).
      *   The Case Tests (briefly mapping them).
      *   The Squeeze (The Incompatibility).
      *   Theory Evaluation (Short form).

  10. (Final Polish of the text to match the requested tone: direct, analytical, "give me the spec".) *Self-correction: Keep it tight. Don't ramble.*

