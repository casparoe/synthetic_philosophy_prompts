answer: |-
  ### The Spec: Desiderata for Self-Deception

  An adequate theory must satisfy five conditions to distinguish self-deception from adjacent phenomena while respecting the mechanics of belief.

  **1. The Evidence Tension (vs. Ignorance)**
  The subject must have access to credible evidence contradicting the believed proposition ($p$), yet maintain belief in $p$.
  *Consideration:* If the counter-evidence is unavailable or ignored due to simple negligence, it is ignorance. Self-deception requires the evidence to be *present* but neutralized.
  *Case Test:* The **Spreadsheet Guy** has the data (excuses) but avoids opening it. The evidence exists but is walled off.

  **2. The Motivational Causation (vs. Bias)**
  The belief formation must be driven by a desire or need (e.g., safety, ego, comfort), not merely a cognitive glitch.
  *Consideration:* Cognitive bias is passive; self-deception is teleological (goal-directed). The desire must cause the belief, not just accompany it.
  *Case Test:* The **Hindsight Woman** ("I knew it would fail") reconstructs memory to protect her ego from the pain of having been hopeful.

  **3. The Sincerity Condition (vs. Lying/Pretending)**
  The subject must avow $p$ without conscious awareness of deceiving themselves. There is no "inner lie."
  *Consideration:* If they know they are lying, it is fraud. If they know they are pretending, it is play-acting. Self-deception requires the subject to be the first victim of the deception.
  *Case Test:* The **Failing Marriage Couple**. Each sincerely believes the other is oblivious. If they knew they were pretending, the dynamic collapses into negotiation.

  **4. The Behavioral Leak (vs. Wishful Thinking)**
  The subject's actions must occasionally betray the suppressed truth (not-$p$), revealing instability in the belief.
  *Consideration:* Pure wishful thinking is often recognized as hope ("I wish she's faithful"). Self-deception claims knowledge ("She *is* faithful") but acts on fear.
  *Case Test:* The **Phone-Checking Husband**. He avows trust ($p$) but acts on suspicion (not-$p$). The belief is functionally partitioned.

  **5. The Doxastic Commitment (vs. Delusion)**
  The belief must function as a normal belief in most contexts, guiding inference and prediction, not just emotional comfort.
  *Consideration:* Beliefs track truth. If the state never updates to *any* evidence, it is delusion or pathology. Self-deception is fragile and context-sensitive.
  *Case Test:* The **Coach-Installed Confidence**. He maintains the belief himself now, using it to navigate risks. If it were mere delusion, he would crash immediately; if mere pretense, he wouldn't take the risk.

  ***

  ### The Squeeze: The Jointly Unsatisfiable Pair

  **The Intentionality Condition vs. The Sincerity Condition.**
  To deceive, one must know the truth (Intentionality). To be self-deceived, one must believe the lie (Sincerity). You cannot simultaneously know $X$ is false to engineer the deception and believe $X$ is true to be the victim of it.
  *The Friction:* If you satisfy Intentionality (you steer away from the spreadsheet), you seem to know the truth, violating Sincerity. If you satisfy Sincerity (you truly believe the marriage is fine), you lack the knowledge required to intentionally deceive yourself. Most theories sacrifice one to save the other.

  ***

  ### Theory Evaluation

  **Split-Mind (Modular/Subpersonal)**
  Posits one subsystem knows the truth while another believes the lie. Solves the paradox by dividing the agent.
  *Verdict:* Saves the logic but violates parsimony; lacks empirical evidence for distinct "deceiver" and "deceived" homunculi.

  **Motivated Bias (Deflationary/Mele)**
  Denies intentionality; claims anxiety skews evidence weighting without a plan to deceive.
  *Verdict:* Preserves Sincerity and rationality but collapses self-deception into ordinary bias, losing the "deception" distinctness.

  **No-Belief (Sartrean/Existential)**
  Claims the subject knows the truth but chooses to live "in bad faith," pretending not to know.
  *Verdict:* Captures the agency but violates the Sincerity Condition; fails to explain why the subject feels no guilt of conscious lying.
