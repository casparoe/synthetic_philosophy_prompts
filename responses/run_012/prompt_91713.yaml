          *   Timeline Honesty: Is one year enough?

  2.  **Drafting - Section by Section:**

      *   **Title:** Needs to be catchy but academic. "Machine Supererogation" or "Beyond the Spec." Let's go with "Beyond the Spec: Reconceptualizing Machine Supererogation."
      *   **The Question:** Can a machine perform a supererogatory act? Needs to be sharper. "Under what conditions can an artificial agent perform a supererogatory act, and does doing so generate downstream normative commitments?"
      *   **The Problem/Gap:** Machine ethics borrows human categories (obligation, permission). Supererogation (going above and beyond) is tricky because it usually implies sacrifice. Machines don't sacrifice (no welfare).
      *   **Critique of Obvious Positions:**
          1.  *Impossible:* Machines lack welfare, so no sacrifice, so no supererogation. (Too dismissive, ignores functional excess).
          2.  *Cost Irrelevant:* Supererogation is just "optional good." (Too cheap, loses the normative weight).
      *   **The Hunch/Thesis:** Decouple "exceeding requirements" from "agent cost." Focus on the *systemic effect*: exceeding spec creates reliance/new obligations downstream.
      *   **Method:**
          1.  *Thought Experiments:* Scenarios where AI exceeds protocol (e.g., care bot staying late, autonomous vehicle taking a risky route to save time).
          2.  *Formalization:* Define "specification" vs. "performance space." Model the shift in normative expectations post-action.
      *   **Outcome:** A taxonomy of "functional supererogation" vs. "moral supererogation." A formal model of how exceeding spec alters future obligation sets.
      *   **Failure:** If the distinction collapses or the formalization adds no value over existing deontic logic.
      *   **Timeline:** One year is tight but doable for conceptual + minimal formal work.

  3.  **Writing and Refining (Word Count Check):**

      *   *Drafting:*
          Title: Beyond the Spec: Reconceptualizing Machine Supererogation

          **Research Question**
          Can an artificial agent perform a supererogatory act, and if so, does exceeding its specification generate downstream normative commitments for its operators?

          **Background & Problem**
          Machine ethics typically imports human moral categories—obligation, permission, duty—without auditing their fit. Supererogation (acts that are good but not required) presents a specific friction. Classically, supererogation requires the agent to incur a cost or sacrifice a personal good. Artificial agents, as tools, lack a "good of their own" to sacrifice. This creates a dilemma: either machine supererogation is impossible (because machines cannot sacrifice), or the concept is being overloaded (because "going above and beyond" is treated as morally weighty without the requisite agentive cost).

          Both obvious positions are unsatisfactory. Denying machine supererogation outright ignores cases where systems functionally exceed their design parameters in ways that intuitively demand moral recognition. Conversely, claiming cost is irrelevant strips supererogation of its normative distinctiveness, reducing it to mere optional optimization. There is a third option: decoupling "exceeding requirements" from "bearing cost" to focus on the *relational* consequence of the act.

          **Thesis**
          I propose that machine supererogation should not be defined by agentive sacrifice, but by normative disruption. When a system exceeds its specification, it does not act heroically; rather, it alters the normative landscape by generating fresh obligations downstream. By performing beyond its spec, the system makes itself relied upon, effectively taking on commitments that change what operators may now demand of it. This shifts the focus from the machine's internal state to the external normative structure it inhabits.

          **Methodology**
          The project combines conceptual analysis with minimal formalization.
          1.  *Thought Experiments:* I will construct cases involving high-stakes autonomous systems (e.g., care robots, triage algorithms) where the system operates outside predefined protocols to achieve a better outcome. These will test intuitions regarding whether the act is supererogatory or merely a malfunction/optimization.
          2.  *Formalization:* I will develop a lightweight logical model distinguishing "specification compliance" from "performance excess." This model will map how an act of excess updates the obligation set of the human operators in the subsequent time-step. The goal is not a full deontic logic, but a formal account of how exceeding spec shifts normative expectations.

          **Expected Outcomes**
          Success looks like a refined taxonomy distinguishing "functional excess" (optimization) from "normative excess" (creating new reliance). I aim to produce a formal sketch showing how machine actions can update human obligations, providing a rigorous basis for "machine supererogation" that does not rely on anthropomorphic sacrifice.

          **Failure Conditions**
          The project fails if the distinction between functional optimization and normative excess collapses under scrutiny, or if the formalization proves incapable of capturing the shift in downstream obligations without becoming trivial. If the result is merely that "machines can't sacrifice," the project has not advanced the field.

          **Feasibility**
          One year is sufficient for the conceptual work and preliminary formalization proposed here. However, developing a robust logical framework suitable for implementation in CS contexts may require extension beyond the fellowship period. This project prioritizes conceptual clarity and a proof-of-concept model over a complete logical system.

