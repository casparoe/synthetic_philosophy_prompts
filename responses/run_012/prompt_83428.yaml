  **The Scenario**

  A municipal zoning board must decide whether to grant a noise exemption for a new rail line. The choice is between (A) denying the line, preserving property values, or (B) granting it, reducing values due to noise. Arthur owns a heritage home; loss of quiet enjoyment reduces its value by $100,000. Fifty rental units are also affected; each loses $5,000 in value. Total rental loss ($250,000) exceeds Arthur's loss.

  *Variant 1 (Spread):* The fifty units are owned by fifty different landlords. Each faces a $5,000 loss.
  *Variant 2 (Concentrated):* A single landlord, Barbara, owns all fifty units. She faces a cumulative $250,000 loss.

  In both variants, the board must choose either A (Arthur loses $100k, landlords lose $0) or B (Arthur loses $0, landlords lose value). Identities are known; no compensation is possible.

  **The Audit**

  **Verdicts:**
  *   **Utilitarianism:** Chooses **A** in both variants. Total harm is minimized ($100k < $250k).
  *   **Maximin:** Chooses **B** in Variant 1 (worst-off position is $-5k$ vs $-100k$); Chooses **A** in Variant 2 (worst-off position is $-100k$ vs $-250k$).
  *   **Contractualism:** Chooses **B** in Variant 1; Chooses **A** in Variant 2.
      *   *Variant 1:* Arthur's individual complaint ($100k$) outweighs any single landlord's ($5k$). Interpersonal aggregation is forbidden. Arthur reasonably rejects A.
      *   *Variant 2:* Barbara's individual complaint ($250k$) outweighs Arthur's ($100k$). Intrapersonal aggregation is permitted. Barbara reasonably rejects B.

  **The Feature Doing the Work:**
  The **Individualist Restriction**. It blocks summing complaints across persons in Variant 1, forcing a one-to-one comparison where Arthur wins. It allows summing within a life in Variant 2, allowing Barbara's total burden to outweigh Arthur's.

  **Collapse Conditions:**
  If you permit interpersonal summation (Utilitarianism), the divergence collapses: B is chosen in both. If you treat each of the fifty landlords in Variant 1 as a separate veto point without comparing strength to Arthur, you get paralysis, but Scanlon compares generic reason strength. If you read Contractualism as simple Maximin, the verdicts align here, though the *justification* differs (distributional state vs. reasonable rejection).

  **Contractualist Attack:**
  A strict Scanlonian might deny that Barbara's fifty losses form a single generic reason comparable to Arthur's home loss, arguing qualitative significance trumps arithmetic sum even intrapersonally. Alternatively, they might argue the losses are temporally distinct choices, not one policy. This objection essentially restates the separateness of persons within a life, challenging whether intrapersonal aggregation is permissible when competing against another's significant burden.

  **Honesty Check:**
  This case distinguishes Contractualism from Utilitarianism, but **not** from Maximin, as both flip verdicts based on the distribution of burdens. To refute the "just Maximin" claim specifically, you need a risk case or a threshold case where the worst-off individual's position is identical but contractualism diverges. This case proves the Individualist Restriction drives the verdict, but concedes that Maximin tracks the same outcome here.
