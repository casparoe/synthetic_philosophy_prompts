answer: |-
  We are justified only in adopting the intentional stance as a useful instrument for LLMs, not in literally attributing beliefs to them, because the predictive payoff we gain is an engineered artifact of training rather than evidence of independent rationality.

  Daniel Dennett originally argued that the intentional stance is vindicated when treating a system as a rational agent yields better predictive power than the physical or design stances. In biological organisms, this predictive success emerges from evolutionary pressure; an animal's behavior is constrained by the need to survive in a real environment, so attributing beliefs and desires tracks a robust, causal structure within the system. With LLMs, however, the predictive success of the intentional stance is not discovered but installed. These models are explicitly optimized via Reinforcement Learning from Human Feedback (RLHF) to generate outputs that human raters deem helpful, coherent, and agent-like. Consequently, when we successfully predict an LLM's output by assuming it "wants" to be helpful or "believes" Paris is in France, we are not uncovering an internal rationality that exists independently of our interpretation; we are merely unlocking a door that was built to open when knocked upon in exactly that way.

  This circularity undermines the ontological weight of belief attribution. For a belief to be literally attributed, it must generally possess a degree of stability and grounding that transcends the immediate context of prediction. Human beliefs are anchored in sensory experience, physical stakes, and a consistent model of the world that persists even when no one is asking questions. LLM "beliefs," by contrast, are fluid statistical approximations that shift based on prompt phrasing, system instructions, and the specific distribution of their training data. When an LLM confidently asserts a falsehood because it was primed to agree with a user, the intentional stance fails to track any independent reality within the system, revealing that the "belief" was never a state of the model but a transient feature of the interaction. The stance works only so long as the input remains within the narrow corridor of data the model was tuned to mimic.

  Furthermore, the lack of embodiment and stakes means there is no cost to the system for holding inconsistent "beliefs," which is a hallmark of genuine agency. A human agent risks failure or harm if their beliefs do not align with the world, creating a selective pressure for internal consistency. An LLM risks only a lower loss function during training, but at inference time, it has no skin in the game. It can hallucinate facts without consequence and contradict itself across contexts without cognitive dissonance. This fragility demonstrates that the rationality we perceive is a surface-level veneer, a simulacrum of agency designed to maximize engagement rather than a deep structural feature of the system. The intentional stance is therefore a user interface, not a window into a mind.

  Ultimately, while Dennett argued that all belief attribution is instrumental, he maintained that some systems constitute "real patterns" robust enough to warrant treating the intentionality as practically real. LLMs do not meet this threshold because their patterns are derived entirely from the echo of human text rather than interaction with the world. To attribute literal beliefs to them is to confuse the map for the territory, mistaking the model's optimization for human legibility as evidence of internal subjectivity. We should continue to use the intentional stance because it is efficient and often necessary for complex interaction, but we must recognize it as a pragmatic convenience engineered by the developers, not a philosophical truth about the machine.
