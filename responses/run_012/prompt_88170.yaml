prompt: |-
  Ok, weird situation, hoping you can help. I just finished a PhD in phil of mind, I've got a postdoc for a year and change (so call it 18 months I actually control), and I get to choose what I work on. I've been reading in collective intentionality / joint action and I keep suspecting the field's energy is definately pooled in the wrong places. The standard menu is roughly shared intention (Bratman), joint commitment (Gilbert), we-intentions (Searle), plus all the attempts to do it with less -- mutual responsiveness, common knowledge of a goal, etc. And the arguing is mostly about which of these gets the paradigm cases right: walking together, painting a house together, playing a duet.

  What I want is a prioritized agenda, not a survey. Given 18 months and my background (phil of mind, some cog sci, no formal methods to speak of), which open questions here are actually worth the time, and in what order? I care about the reasoning more than the list: is it upstream of other questions, is it tractable for someone like me rather than a game theorist or a linguist, is it neglected or is everyone quietly on it, and what would have to happen to move it up or down my list.

  Two things I keep circling that I think the standard menu handles badly, and I want you to tell me whether they're the real questions or just my hobbyhorses:

  (a) cases where the 'we' is thin or half-formed -- two people each adjusting to the other, jointly producing an outcome, where neither would say they were acting together and there's no shared intention in either head. Is the live question 'when does this count as joint action', or is that just a verbal fight about where to draw a line?

  (b) cases where a participant isn't a person -- a human coordinating with a piece of software, or a distributed system whose 'members' are processes. Does the framework of joint action even get a grip here, and is 'what has to be true of the relata for it to apply' a question a philosopher can make real progress on in 18 months, or a swamp?

  Be honest if the best move is something I haven't mentioned at all. And if the whole prioritization is unstable because it depends on whether you're a realist or a deflationist about groups as agents, say so, and tell me which way to lean to get the most done.
reasoning: |-
  Here's a thinking process that leads to the suggested agenda:

