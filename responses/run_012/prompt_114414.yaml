prompt: |-
  Hi, so I'm a junior and I run the history club at my school, and we got roped into doing the exhibit for our town's 150th birthday at the public library — four panels, like 150 words of text each plus pictures, and the historical society board has to approve every word before it goes on the wall. Here's my problem. Basically everything in the town archive is the record of six families: the mill owners, the bank guy, the guy who donated the land for the park. There's a whole shelf of the mill's ledgers, which list every worker by name with their pay and their fines, and honestly that's the most detail we have on like four hundred people. Meanwhile the stuff that's actually interesting — what people ate, what they fought about, who married who — only exists in two diaries and a shoebox of letters from one woman whose family kept everything, and one court case. So my friends and I keep arguing about what we're allowed to say on the panels. My teacher keeps saying we should be doing history from below instead of just writing about the important guys, and she gave this whole talk about microhistory where you zoom all the way in on one person, ideally a slightly weird one, and use their life as a window onto how the entire society worked — the odd case is what shows you the rules everyone else followed without ever noticing them. Which I get and it's cool, but then how do I know when one person's diary is allowed to stand in for everybody? And how am I supposed to use a ledger written by the boss to say anything true about the workers, when the boss is the one who decided what got written down in the first place? And here's the thing that's really bugging me: the only ordinary people who end up in an archive at all seem to be the ones who got in trouble or fell on hard times, so the people I *can* actually write about are exactly the ones who weren't typical. If poor people barely show up in the records, is that a fact about them or a fact about the records?

  So what I want is a decision procedure I can actually run, panel by panel, while we're deciding what goes on the wall — not a general essay about being careful with sources. I need the questions to ask in order, what counts as a good enough answer to each one, the point where it just stops and says no, you can't claim that, and the point where it has to hand the decision off to a person because it's a values call and not a fact question. It should be honest about which steps are just judgment dressed up as method. Then run it on three things we're seriously considering: (1) a panel built around the mill ledgers — can we say anything real about the workers from them, and if so what, and what's off limits; (2) a panel around that one woman's diary, which is genuinely the best material we have, where the whole question is whether we can present her as a voice of the town's women or whether she's just one unusual person and we have to say so; and (3) the family who only appear in the records because of a lawsuit, where I have a bad feeling your procedure is going to tell me something I don't want to hear, and I'd rather know now so I can plan around it instead of finding out in front of the board. Please don't hand me a reading list or tell me to go find books about this, I can't, and don't just say to be careful — I need the actual steps in order. Also the board is touchy, three of them are decended from the mill family, so tell me which of our claims are actually strong enough to defend and which ones I should just drop. And please tell me what the procedure can't do, because I'd rather know the limits up front than discover them at the meeting.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** High school junior, runs history club.
      *   **Task:** Creating a 4-panel exhibit for the town's 150th birthday at the public library.
      *   **Constraints:** 150 words per panel + pictures. Historical Society Board must approve every word (3 members descended from the mill family, "touchy").
      *   **Source Material:** Skewed heavily towards elites (6 families, mill ledgers) vs. sparse ordinary people (2 diaries, 1 shoebox of letters, 1 court case).
      *   **Conflict:** Teacher wants "history from below"/microhistory (zoom in on one person to show society). User is skeptical about representativeness (can one diary stand for all? are ledgers biased by the boss? do archives only show the troubled?).
      *   **Need:** A *decision procedure* (step-by-step questions) to evaluate claims panel-by-panel. Not an essay, not a reading list. Needs to identify where method ends and values/judgment begins. Needs to be run on three specific scenarios (Mill Ledgers, Woman's Diary, Lawsuit Family). Needs to identify defensible claims vs. claims to drop (given the board). Needs to state limits of the procedure.

  2.  **Deconstruct the Core Historiographical Problem:**
      *   The user is grappling with *representativeness*, *bias*, and *silence in the archive*.
      *   Teacher's advice (Microhistory) is sound but risky for a public exhibit with a hostile board.
      *   The "Decision Procedure" needs to be a filter that separates *evidence-based inference* from *speculation* and *political landmines*.

  3.  **Drafting the Decision Procedure:**
      *   *Goal:* A checklist that moves from "Can we say this?" to "Should we say this?"
      *   *Step 1: Source Provenance.* Who wrote this and why? (Identifies bias).
      *   *Step 2: Corroboration.* Is there a second source? (Identifies uniqueness).
      *   *Step 3: Negative Inference.* What does the silence tell us? (Addresses the "only troubled people show up" issue).
      *   *Step 4: Generalization Limit.* Can we say "everyone" or must we say "some"? (Addresses representativeness).
      *   *Step 5: The Board Test.* Will this get us censored or sued? (Pragmatic constraint).
      *   *Stop/Hand-off Points:* Need to define where facts end and interpretation begins.

  4.  **Running the Procedure on the Three Scenarios:**

      *   **Scenario 1: Mill Ledgers.**
          *   *Source:* Boss wrote it. Purpose: Control/Pay.
          *   *Claim:* "Workers were exploited." -> *Risk:* Board will kill it.
          *   *Claim:* "Workers were fined." -> *Safe:* It's in the ledger.
          *   *Inference:* Fines imply rules. Rules imply control.
          *   *Verdict:* Stick to the numbers. Let the numbers speak. Don't use emotional adjectives.

      *   **Scenario 2: The Woman's Diary.**
          *   *Source:* One woman, elite enough to write, kept letters.
          *   *Claim:* "Women in town felt X." -> *Risk:* Overgeneralization.
          *   *Claim:* "One woman wrote X." -> *Safe:* Fact.
          *   *Inference:* If she describes buying flour, other women likely bought flour. If she describes loneliness, is that universal?
          *   *Verdict:* Frame her as *a* voice, not *the* voice. Use her to show *possibility*, not *norm*.

      *   **Scenario 3: The Lawsuit Family.**
          *   *Source:* Court records.
          *   *Problem:* Only appear because of trouble.
          *   *Risk:* Portraying the town as litigious or the elites as villains (if they sued the little guy) or vice versa.
          *   *Verdict:* This is the danger zone. The procedure will likely flag this as "Unrepresentative." Suggest dropping or framing strictly as "Legal disputes happened."

  5.  **Refining the Tone:**
      *   Respectful of the user's intelligence (they understand microhistory concepts).
      *   Pragmatic (acknowledge the board's power).
      *   Direct (no fluff, no reading lists).
      *   Honest about the limitations of history (the "values call").

  6.  **Developing the "Decision Procedure" (The Algorithm):**
      *   Need to make it look like a flowchart or a numbered list with "If/Then" logic.
      *   *Step 1: The Origin Test.* (Who created this record and for what immediate purpose?)
      *   *Step 2: The Silence Test.* (Does this record exist because something went wrong?)
      *   *Step 3: The Plurality Test.* (Do we have a second source that isn't a copy of the first?)
      *   *Step 4: The Generalization Test.* (Does the claim match the scope of the evidence?)
      *   *Step 5: The Power Test.* (Who does this claim embarrass?)

  7.  **Addressing the Specific Questions:**
      *   *When is a diary allowed to stand in for everybody?* Answer: Almost never. Use qualifying language ("For some," "In this case").
      *   *Ledger truth?* Answer: It tells truth about the *system*, not necessarily the *experience*.
      *   *Poor people in records?* Answer: It's a fact about the records (archival silence).

  8.  **Final Review against Constraints:**
      *   Did I give a reading list? No.
      *   Did I say "be careful"? No, gave steps.
      *   Did I run the three scenarios? Yes.
      *   Did I address the board dynamics? Yes.
      *   Did I explain what the procedure *can't* do? Yes.

  9.  **Self-Correction/Nuance Check:**
      *   *Critique:* Is the procedure too cynical about the board?
      *   *Fix:* Frame it as "Political Viability" rather than "Censorship." It's about survival of the exhibit.
      *   *Critique:* Is the microhistory advice too dismissive?
      *   *Fix:* Validate the teacher's point but show how to execute it safely (exemplar vs. average).
      *   *Critique:* The user asked for "what counts as a good enough answer."
      *   *Fix:* Explicitly state "Pass/Fail" criteria for each step.

  10. **Final Polish:** Ensure the voice is supportive but professional, like a senior historian mentoring a junior colleague. (Proceed to generate output).

  *(Self-Correction during drafting)*: I need to make sure I don't just say "Don't do the lawsuit." I need to explain *why* the procedure flags it so the user understands the historical reasoning, not just the political fear. The historical reason is "Selection Bias." The political reason is "Board Sensitivity." Both matter.

  *(Refining the Procedure Steps)*: Make sure Step 5 is clearly marked as the "Values/Politics" hand-off, distinct from the "Fact" steps (1-4). This answers the user's request to distinguish method from judgment.

  *(Final check on the 150-word constraint)*: Remind the user that brevity forces simplification, which increases risk. The procedure needs to account for the word count limiting nuance.

  Okay, ready to write.s
answer: |-
  This is a sophisticated problem. You are asking about **representativeness**, **archival silence**, and **political viability** all at once. Your teacher is right about microhistory (the exception reveals the rule), but she is underestimating the risk of a public exhibit with a hostile board.

  Here is the decision procedure. It is designed to separate *historical inference* (what the evidence supports) from *political risk* (what the board will block).

  ### The Exhibit Decision Procedure

  Run every sentence you plan to put on a panel through these five steps. If you fail a step, you must rewrite or drop the claim.

  **Step 1: The Origin Test (Fact Check)**
  *   **Question:** Who created this record, and what immediate practical purpose did it serve for *them*?
  *   **Pass:** You can name the creator and the purpose (e.g., "The mill owner recorded fines to deduct pay").
  *   **Fail:** You treat the record as a neutral observation of reality (e.g., "The ledger shows workers were lazy").
  *   **Stop Point:** If you cannot identify the creator's motive, you cannot use the record as objective truth.

  **Step 2: The Silence Test (Bias Check)**
  *   **Question:** Does this record exist because something went *wrong* (a fine, a lawsuit, a death) or because life went *right*?
  *   **Pass:** You acknowledge the bias (e.g., "Court records show disputes," not "Neighbors fought constantly").
  *   **Fail:** You treat the trouble as the norm (e.g., "Life in the town was litigious").
  *   **Stop Point:** If the only record of a person is a tragedy, you cannot claim their life *was* a tragedy, only that their tragedy was recorded.

  **Step 3: The Plurality Test (Corroboration)**
  *   **Question:** Do I have a second, independent source that confirms this specific detail?
  *   **Pass:** Yes (e.g., Diary mentions flour prices; Ledger mentions flour wages).
  *   **Fail:** No (This is the only source).
  *   **Hand-off Point:** If you fail here, you are doing **Microhistory**. You must change your language from "The Town" to "One Resident." This is no longer a fact question; it is a framing choice.

  **Step 4: The Generalization Test (Scope)**
  *   **Question:** Does the claim match the scope of the evidence?
  *   **Pass:** Specific claim ("Mary Smith bought cloth") or Systemic claim ("The mill system deducted pay for cloth").
  *   **Fail:** Universal claim ("Women bought cloth," "Workers were impoverished").
  *   **Stop Point:** If you have one diary, you cannot claim "Women." You can claim "For some women..." or "One woman's account suggests..."

  **Step 5: The Power Test (Viability)**
  *   **Question:** Does this claim directly embarrass a living descendant or challenge the town's founding myth without irrefutable numeric proof?
  *   **Pass:** The data speaks for itself (e.g., "$2.00 fine listed").
  *   **Fail:** You use interpretive adjectives (e.g., "Unfair $2.00 fine").
  *   **Hand-off Point:** This is a **Values Call**. If the claim is historically sound but politically toxic, you must decide: Is the fight worth the exhibit being cancelled?

  ***

  ### What This Procedure Cannot Do
  1.  **It cannot fix bad sources.** If the archive is silent on 90% of the town, this procedure will not make them appear. It will only stop you from lying about them.
  2.  **It cannot guarantee approval.** The board can still reject truth. This procedure maximizes your defensibility.
  3.  **It cannot solve the "Typicality" problem.** History is full of atypical people. This procedure forces you to admit when someone is atypical rather than pretending they are average.

  ***

  ### Running the Procedure on Your Three Panels

  #### Panel 1: The Mill Ledgers
  *   **The Plan:** Use the ledgers to talk about the workers.
  *   **Step 1 (Origin):** Creator = Mill Owner. Purpose = Profit/Control. **Pass.**
  *   **Step 2 (Silence):** Records exist for fines/work. Does not record happiness/health. **Pass** (if acknowledged).
  *   **Step 3 (Plurality):** No worker diaries to compare. **Fail.** (This is single-source).
  *   **Step 4 (Generalization):** Can you say "Workers suffered"? **Fail.** Can you say "Workers were fined"? **Pass.**
  *   **Step 5 (Power):** Board includes mill descendants. Calling fines "exploitation" will get you cut. Listing fines as "Deductions" is safe.
  *   **Verdict:** **Do not write about the workers' *lives*. Write about the *system*.**
      *   *Drop:* "Workers struggled to survive on low pay." (Speculation/Political suicide).
      *   *Keep:* "Ledgers record 400 names. Fines were deducted for damaged goods. Pay was issued monthly."
      *   *Why:* Let the board members' ancestors admit the fines in their own handwriting. You don't need to call it "cruel." The number does the work. If a fine was 20% of a day's wage, print the numbers. That is defensible fact.

  #### Panel 2: The Woman's Diary
  *   **The Plan:** Use her as the voice of the town's women.
  *   **Step 1 (Origin):** Creator = One woman. Purpose = Private memory. **Pass.**
  *   **Step 2 (Silence):** She wrote because she could read/write and had leisure. **Pass.**
  *   **Step 3 (Plurality):** Only one diary. **Fail.**
  *   **Step 4 (Generalization):** Can you say "Women felt lonely"? **Fail.** Can you say "She wrote of loneliness"? **Pass.**
  *   **Step 5 (Power):** Low risk. Board cares about money/mills, not domestic life.
  *   **Verdict:** **Use Microhistory, but label it as such.**
      *   *Drop:* "Women in 1890 found solace in gardening." (You don't know that).
      *   *Keep:* "In 1890, resident [Name] wrote: 'The garden was my only escape.' Her letters survive, offering a rare glimpse into domestic life."
      *   *Why:* Your teacher wants you to use her as a window. You can do this without lying. Use phrases like "One account suggests..." or "For residents like..." This protects you from historians who say "Not all women!" and protects you from the board who don't care. It turns her from a "Statistic" into an "Exemplar."

  #### Panel 3: The Lawsuit Family
  *   **The Plan:** Tell the story of the family who got sued.
  *   **Step 1 (Origin):** Creator = Court Clerk. Purpose = Legal record. **Pass.**
  *   **Step 2 (Silence):** They *only* appear because of trouble. **Fail.** (This is the "Silence Test" trap).
  *   **Step 3 (Plurality):** No other records of them. **Fail.**
  *   **Step 4 (Generalization):** Can you say "Families often sued"? **Fail.** Can you say "This family was sued"? **Pass.**
  *   **Step 5 (Power):** High Risk. If they sued the mill, the board will kill it. If they sued a neighbor, it makes the town look bad.
  *   **Verdict:** **Drop this panel.**
      *   *Why:* The procedure flags this as **Unrepresentative** (Step 2) and **Politically Toxic** (Step 5). You have no way to contextualize this. If you put this up, you are presenting a family defined entirely by conflict as a normal part of town life. That is historically misleading (they might have been the *only* ones who sued) and politically dangerous.
      *   *Alternative:* Use the *fact* of the court case to talk about the legal system, not the family. "Town records include disputes over property lines." Do not name the family. Do not tell their story. It is a trap.

  ### Summary of Advice for the Board Meeting

  1.  **On the Ledgers:** Do not use emotional words. Use the board's ancestors' words against them gently. "The ledger lists 50 fines in 1880." If they object, ask, "Should we not list what your grandfather wrote?"
  2.  **On the Diary:** Be humble. "We have few voices from this period. This is one of them." This turns a weakness (lack of sources) into a historical point (ordinary people were rarely recorded).
  3.  **On the Lawsuit:** Kill it yourself before they do. Tell the board, "We reviewed the court records, but determined they were not representative enough for a general overview." They will respect your prudence.
  4.  **On the "History from Below":** Tell your teacher you are doing "History from the Margins." You are showing what *can* be seen, while explicitly noting what *cannot*. That is honest history.

  **Final Warning:** The procedure stops at Step 4. Step 5 is where you might have to lie by omission to save the project. If the board demands you remove the fines, you have a values choice: Fight and lose the exhibit, or comply and add a small placard saying "Exhibit curated in partnership with the Historical Society." That placard is your way of telling the future historians that the silence was forced, not accidental.
