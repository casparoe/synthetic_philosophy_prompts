answer: |-
  # The Neural Continuity Review Framework (NCRF)
  **Version 1.0 | For Clinical-Ethics Review Panels**

  ## Purpose
  To provide a structured, repeatable method for reviewing protocols involving gradual neural replacement. This procedure separates empirical safety and continuity questions from contested metaphysical questions regarding personal identity. It is designed to be completed within ninety minutes by a mixed panel of clinicians, lay members, and ethicists.

  ## Instructions for the Chair
  1.  Proceed through Steps 1–6 in order. Do not skip steps.
  2.  At each step, ask the **Governing Question**.
  3.  Record the answer as **Pass**, **Fail**, or **Values Gate**.
  4.  If a **Fail** condition is met, the procedure returns a **Refusal**. The meeting ends.
  5.  If a **Values Gate** is triggered, the procedure halts empirical review and moves to a Panel Vote (Step 6).
  6.  If all Empirical Steps pass without triggering a Values Gate, the procedure recommends **Permit**.

  ---

  ## The Procedure

  ### Step 1: Functional Equivalence (Empirical)
  *   **Governing Question:** Does the protocol demonstrate that each silicon unit reproduces the input–output behaviour of the displaced neuron within a 5% margin of error, without latency that disrupts network synchrony?
  *   **Source of Evidence:** Engineering specifications; pre-clinical simulation data.
  *   **Sufficient Answer:** Yes, validated by third-party testing.
  *   **Failure Condition:** No. The risk of network collapse or seizure is unacceptable.
  *   **Outcome if Failed:** **Refusal**. (Safety).
  *   **Outcome if Passed:** Proceed to Step 2.

  ### Step 2: Rate of Replacement (Empirical)
  *   **Governing Question:** Is the rate of replacement slow enough to allow for psychological monitoring between stages (maximum 5% of total neural volume per week)?
  *   **Source of Evidence:** Surgical schedule; monitoring protocol.
  *   **Sufficient Answer:** Yes, the schedule allows for weekly psychometric assessment.
  *   **Failure Condition:** No. Rapid replacement prevents detection of psychological drift.
  *   **Outcome if Failed:** **Refusal**. (Safety/Consent).
  *   **Outcome if Passed:** Proceed to Step 3.

  ### Step 3: Consent Integrity (Empirical/Legal)
  *   **Governing Question:** At the most recent assessment, did the patient (as currently constituted) affirmatively consent to continue?
  *   **Source of Evidence:** Latest signed consent form; video record of capacity assessment.
  *   **Sufficient Answer:** Yes, the current patient consents.
  *   **Failure Condition:** No. The current patient refuses, or capacity is lost without a valid, applicable advance directive that covers *this specific* change in psychology.
  *   **Outcome if Failed:** **Refusal**. (Autonomy). *Note: This prioritises the current will over the original will.*
  *   **Outcome if Passed:** Proceed to Step 4.

  ### Step 4: Duplication and Branching (Empirical)
  *   **Governing Question:** Does the protocol create a state where two distinct physical systems (biological and silicon, or two silicon arrays) simultaneously embody the patient's psychology, even transiently?
  *   **Source of Evidence:** System architecture diagrams; backup protocols.
  *   **Sufficient Answer:** No. There is only one active locus of psychology at any time.
  *   **Failure Condition:** Yes. A 'standby', 'backup', or 'split' exists that could be activated or run in parallel.
  *   **Outcome if Failed:** **Values Gate**. (Proceed to Step 6).
  *   **Outcome if Passed:** Proceed to Step 5.

  ### Step 5: Psychological Continuity (Empirical/Observational)
  *   **Governing Question:** Do longitudinal assessments show stability in memory, attachment, and avowed projects, such that the patient *reports* feeling like the same person?
  *   **Source of Evidence:** Weekly psychometric reports; patient interviews; family testimony.
  *   **Sufficient Answer:** Yes. The patient reports continuity; no major personality fractures observed.
  *   **Failure Condition:** No. The patient reports discontinuity, or assessments show radical divergence from baseline (e.g., new aversions, loss of core memory).
  *   **Outcome if Failed:** **Values Gate**. (Proceed to Step 6).
  *   **Outcome if Passed:** Proceed to Step 6 (Confirmation).

  ### Step 6: The Identity Threshold (Values Determination)
  *   **Trigger:** Reached if Step 4 or Step 5 triggered a **Values Gate**, OR as a final confirmation if all previous steps passed.
  *   **Governing Question:** Given the evidence above, does the Panel accept that the entity emerging from this protocol is the *same person* who entered it, sufficient to honour the original treatment goals?
  *   **Source of Evidence:** Panel deliberation. This is not a question of fact.
  *   **Procedure:**
      1.  Chair states: "This is a Values Question. We are not deciding facts, but whether the facts satisfy our ethical threshold for identity."
      2.  Panel Vote: Simple Majority.
      3.  If Vote is 'Yes': **Permit**.
      4.  If Vote is 'No': **Refuse**.
      5.  If Vote is Tied: **Refer to Chair** for casting vote (must be minuted as a Values Decision).
  *   **Sign-off:** Chair signs as 'Values Arbiter'.

  ---

  ## Application of the Procedure

  ### Protocol (a): The Gradual Swap
  *   **Description:** 1-for-1 replacement, slow rate, patient awake and continuous.
  *   **Analysis:**
      *   Step 1 (Function): Pass.
      *   Step 2 (Rate): Pass.
      *   Step 3 (Consent): Pass (Patient consents throughout).
      *   Step 4 (Duplication): Pass (No backups).
      *   Step 5 (Psychology): Pass (Patient reports continuity).
      *   Step 6 (Identity): Panel confirms continuity.
  *   **Verdict:** Permit.
  *   **Unwelcome Factor:** None for the majority, but biological essentialists on the panel may dissent at Step 6.

  ### Protocol (b): The Standby Switch
  *   **Description:** Cold standby maintained; activates on biological failure. Two systems embody psychology at the moment of switch.
  *   **Analysis:**
      *   Step 1–3: Pass.
      *   Step 4 (Duplication): **Values Gate**. The existence of a second system that *could* embody the psychology creates a branching identity risk.
      *   Step 6 (Identity): Panel must vote on whether a 'switch' preserves identity.
  *   **Verdict:** Refer to Panel Vote (Values). *For the purpose of this exercise, we assume the Panel is split, requiring Chair intervention.*
  *   **Unwelcome Factor:** Researchers may find the uncertainty frustrating; safety advocates may find the risk unacceptable.

  ### Protocol (c): The Divergent Will
  *   **Description:** Fast protocol. Psychology changes. Original self wanted treatment; Emerging self refuses.
  *   **Analysis:**
      *   Step 1–2: Pass.
      *   Step 3 (Consent): **Fail**. The *current* patient refuses.
      *   **Stop.** The procedure does not reach the Values Gate because current autonomy is a hard legal/ethical constraint.
  *   **Verdict:** Refuse.
  *   **Unwelcome Factor:** This is highly unwelcome to the 'Original Self' proponents. It effectively allows the 'new' person to terminate the 'old' person's life project. It treats the psychological change as a change of agent, not just mood.

  ---

  ## Review Outcomes Table

  | Protocol | Step at which the procedure concludes | Governing question | Verdict | What would change the verdict | Residual values question | Who must sign off |
