  | (a) Gradual Swap | Step 6 (Confirmation) | "Does the Panel accept that the entity emerging... is the *same person* who entered it?" | Permit | If the replacement rate exceeded 5% per week (Step 2). | None (Consensus on continuity). | Chair |
