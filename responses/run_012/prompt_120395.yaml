      *   **Borden's Twin (Natural Fission):** This is the stronger Parfitian case. They share R-relation with the public persona "Borden." Neither is identical to "Borden" over time. They show that "what matters" (living the life, loving the woman) can be distributed across two bodies, but the cost is the loss of unique identity. They live Parfit's view: identity doesn't matter, the relationship matters. But the film shows the tragedy of this: you can't have full intimacy if you aren't a single person.
      *   **Structure:** The Pledge is the assumption of Identity (Ego). The Turn is Reductionism (breaking the self). The Prestige is the Social Construction of Identity (the copy takes the place).
      *   **Ethics:** Drowning the clone. Parfit says the clone is a person. Killing him is murder. Angier does this nightly. This highlights the dark side of reductionism: if identity doesn't matter, do individuals matter? The film says yes, violently.
      *   **Cartesian Intuition:** The film trades on the fear of *this* consciousness ending. Parfit says "don't worry, *that* consciousness continues." The film says "but *you* won't be there to experience it." The film sides with the Cartesian ego against Parfit's Bundle Theory in terms of emotional weight, even if the metaphysics align with Bundle Theory.

