  2.  **Deconstruct the Philosophy & Film:**
      *   **Parfit's View:** Reductionism. Personal identity is not what matters; psychological continuity and/or connectedness (R-relation) matters. In fission cases, survival is not identity. You survive as both, but you are not identical to both. Fear of death is irrational if R holds, but fear of *losing* R is rational.
      *   **The Prestige (Angier's Machine):** It creates a copy. The original falls into the tank (drowns). The copy appears in the balcony.
      *   **Angier's Experience:** From the *original's* perspective, he steps in, falls, and drowns. He does *not* experience waking up in the balcony. From the *copy's* perspective, he wakes up in the balcony with memories up to stepping in.
      *   **Parfit on Angier:** For the original, R-relation breaks (death). For the copy, R-relation holds (continuation). Since they are distinct persons after the split, the original dies. Parfit would say Angier is right to fear the tank because *his* stream of consciousness ends. The copy is a successor, not him.
      *   **Parfit on Fission:** If I fission into Lefty and Righty, I don't die, but I'm not identical to either. I survive as both. But in *The Prestige*, one branch is immediately destroyed. So it's fission + immediate death of one branch.
      *   **Borden's Twin:** Natural fission. They share a life. They are two distinct persons pretending to be one. From the outside, it looks like identity over time. From the inside, it's two streams. This illustrates the "what matters" vs. "identity" distinction well. They survive together, but neither is the "real" Borden exclusively.
      *   **The Film's Cheat:** The film relies on the horror of the original dying. Parfit would say the horror is justified *because* the original dies, not because of confusion about identity. However, Angier's motivation is often framed as "will I be the man in the box or the man in the balcony?" Parfit says "You are the man in the box. The other guy is someone else who thinks he's you."
      *   **Structure:**
          *   Pledge: The setup of identity (the man).
          *   Turn: The destruction/fission (the machine).
          *   Prestige: The reappearance (the copy).
          *   Parfitian Reading: The Prestige is the illusion of identity. The Turn is the reality of reductionism (streams diverge/end).
      *   **Ethics:** Drowning the duplicate. If the duplicate has R-relation to the original (up to the split), killing him is killing a person who believes he is Angier. It's murder. Parfit wouldn't soften this. The duplicate is a person.
      *   **What the film gets right:** The visceral horror of discontinuity. The practical impossibility of living as a fissioned being (Borden's misery).
      *   **Where it resists:** It treats the copy as a disposable shell rather than a full person (until the end), whereas Parfit insists the copy is just as real.

  3.  **Drafting the Bottom Line:**
      *   *Idea:* The film validates Parfit's reductionism by demonstrating that identity is an illusion, but it rejects his consolation by insisting that the termination of a specific psychological stream is still death.
