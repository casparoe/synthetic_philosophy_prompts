      The Prestige ultimately vindicates Parfit's reductionism by exposing personal identity as a performative trick, yet it rejects his ethical consolation by insisting that the termination of a specific first-person stream remains a genuine death regardless of psychological continuity elsewhere.

      Angier's machine is indeed a fission device, but because one branch is immediately destroyed, it functions as a serial killer of selves rather than a transporter. Parfit argues that in fission cases, identity does not matter because psychological continuity (Relation R) is preserved in the survivors; however, the film correctly intuits that for the specific stream entering the tank, Relation R is broken, making Angier's fear rational rather than confused. The film illuminates Parfit by dramatizing the ontological cost of his view: if we are merely bundles of psychological continuity, then individual instances of that bundle are disposable, which is precisely how Angier treats his drowned duplicates. This highlights a gap in Parfit's ethics; while he argues we should not fear death if R holds, the film shows that treating successors as interchangeable undermines the value of the specific consciousness facing extinction.

