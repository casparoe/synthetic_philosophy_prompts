answer: |-
  1. **The Persistence of the Agent**
  You argue that the nation remains the same guilty agent across generations, but the empirical reality is that every member, institution, and even the constitutional self-understanding of the nation changes over time. Is the persistence required for your argument an empirical continuity of structure, or is it merely a normative stipulation that we *treat* the nation as identical? If it is the latter, doesn't that make the guilt depend entirely on our current willingness to accept it, rather than on a fact about the past wrong?

  *   **Follow-up:** You will likely say it is a normative continuity grounded in the survival of key institutions or commitments. But if the guilt rests on a normative stipulation we make *now*, haven't you shifted the ground from "we are guilty of what *they* did" to "we are guilty because *we* choose to identify with them"?

  2. **The No-Control Objection**
  Let's grant that the nation persists. The standard objection is that guilt presupposes control: one cannot be guilty of an act one could not have prevented. Present members had no control over the historical wrong. You reply that this guilt is not about what they could have done. But if you sever the link between guilt and control, what prevents this from becoming a form of strict liability that applies to anyone merely present in a territory, regardless of their membership?

  *   **Follow-up:** You will likely distinguish membership from mere presence. But if control is irrelevant, why does membership matter? If I am bound by the nation's guilt without having controlled its actions, isn't my status functionally identical to a subject under strict liability, merely with a different label?

  3. **The Bearer of the Predicate**
  You insist this guilt is non-distributive: it attaches to the nation as such and does not divide into shares held by individuals. Yet, a nation is an abstract entity; it cannot feel shame, pay reparations, or be punished. Only individuals can do those things. So, what exactly bears the predicate "guilty" in a way that has ontological weight, if the only entities capable of carrying that weight are the individuals you claim do not hold shares of the guilt?

  *   **Follow-up:** You will likely say the guilt "bears on" individuals without being "distributed to" them. But if the practical consequences land on individuals, in what meaningful sense is the predicate not distributed? Is "non-distributive" doing any work other than insulating the theory from the charge that it blames the innocent?

  4. **Jaspers' Asymmetry**
  You argue Jaspers' fourfold distinction is unstable: criminal and metaphysical guilt don't transmit, while political and moral guilt aren't genuinely collective. You propose a category that is both transmissible and collective. Why should we think your modification stabilizes the scheme rather than collapsing it? Specifically, why does the transmissibility you want attach to the political register without dragging in the criminal liability Jaspers explicitly excluded?

  *   **Follow-up:** You will likely argue that political guilt is about the citizen's role in the state's power. But if the state's power was used to commit crimes, why does the citizen inherit the political guilt without inheriting the criminal taint? Where is the firewall that stops the guilt from becoming criminal liability for the successor generation?

  5. **Repudiation and Exit**
  If I am a present member of this nation, can I exit the guilt by repudiating the national identity or disavowing the historical wrong? If I can exit by disavowal, then the guilt seems voluntary, which undermines the claim that it is an objective fact about the nation's history. If I cannot exit, then the guilt is coercive. Which is it, and how does that square with the claim that this is a *moral* or *political* status rather than a caste mark?

  *   **Follow-up:** You will likely say repudiation is insufficient because the guilt is structural, not attitudinal. But if my internal stance is irrelevant to the guilt, aren't you describing a form of taint or pollution rather than a moral status that allows for agency or redemption?

  6. **The Forced Choice: Transmissibility vs. Non-Distributivity**
  Here is the tension I want to press. To have "practical bite," the guilt must bind living members to make repairs or accept sanctions. To bind living members, the guilt must effectively transmit to them. But if it transmits to them, it distributes across the membership. You want to hold both that it transmits *and* that it is non-distributive. If you must choose: do you sacrifice the non-distributive claim to save the practical binding force, or do you sacrifice the binding force to save the non-distributive logic?

  *   **Follow-up:** You will likely try to maintain the distinction by saying the obligation is distributed but the guilt is not. But if the obligation flows from the guilt, and the obligation is distributed, hasn't the guilt effectively distributed by proxy? What remains of the "non-distributive" claim other than a semantic distinction?

  7. **The Nature of the Demand**
  Let's assume the guilt holds. What is the specific practical demand it grounds that an obligation to repair does not? If the demand is simply "pay reparations" or "change institutions," that sounds like a forward-looking obligation. If the demand is "feel shame" or "accept blame," that sounds like backward-looking guilt. Which demand is primary, and if it's the latter, how do you justify imposing an emotional or reputational burden on someone who did nothing?

  *   **Follow-up:** You will likely say it requires acknowledging the truth of the history as *our* history. But isn't that an epistemic or educational obligation? Why does that acknowledgment require the vocabulary of guilt rather than the vocabulary of historical responsibility?

  8. **The Cost of the Label**
  Finally, why retain the word "guilt" at all? Your view seems to be that nations have enduring moral debts that members inherit as a condition of membership. That sounds like a robust theory of collective responsibility. By insisting on "guilt," you invite the objections regarding control and agency we've discussed. Would your theory not be more stable, and retain its practical bite, if you conceded that this is a form of strict, non-distributive *responsibility* rather than *guilt*?

  *   **Follow-up:** You will likely say "guilt" captures the moral stain that "responsibility" misses. But if that stain cannot be cashed out in terms of individual blame without contradiction, isn't the "stain" itself a metaphorical placeholder for the very incoherence we've been tracing?
