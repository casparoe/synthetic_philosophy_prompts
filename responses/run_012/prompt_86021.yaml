answer: |-
  ### I. Correspondence Table: Metaphor vs. Mechanism

  Here is the audit of the Lorenz picture. The left column lists the poetic terms your housemate uses; the center column lists the mathematical/physical reality; the right column assesses whether the element is doing structural work or merely decorative labor.

  | Metaphorical Item | Mathematical/Physical Role | Work vs. Phrasing |
  | :--- | :--- | :--- |
  | **The Butterfly** | A specific component of the perturbation vector ($\delta \mathbf{x}$). | **Phrasing.** Implies agency, biology, and discrete locality. In the math, it is merely one dimension of a difference vector among thousands. |
  | **The Wingbeat** | The magnitude of the initial perturbation ($\|\delta \mathbf{x}_0\|$). | **Phrasing.** Implies an *event* or *action*. In the math, it is a static difference in initial conditions (e.g., $0.506$ vs $0.506127$). |
  | **The Tornado** | The saturation of divergence on the attractor (macroscopic state difference). | **Phrasing.** Implies a specific catastrophic *outcome*. In the math, it is simply that trajectory $A$ and trajectory $B$ are now in different regions of phase space. |
  | **The Laws** | The system of nonlinear ordinary differential equations (e.g., Lorenz 63). | **Real Work.** These are strictly deterministic. Given a state, the derivative is fixed. |
  | **The Initial State** | The vector $\mathbf{x}_0$ at time $t=0$. | **Real Work.** This is the locus of the sensitivity. |
  | **The Amplification** | The positive Lyapunov exponent ($\lambda$), governing exponential divergence ($e^{\lambda t}$). | **Real Work.** This is the engine of the effect. It dictates the rate at which information about the initial state is lost. |

  **Audit Summary:** The *amplification* and the *laws* are doing the physical work. The *butterfly*, *wingbeat*, and *tornado* are narrative scaffolding that import causality and agency where the math supplies only divergence and state.

  ---

  ### II. Disanalogies Sorted by Argument

  Your housemate is using the same physical phenomenon to drive two contradictory normative claims. The disanalogies reveal where the metaphor breaks for each specific use.

  #### For Argument 1 (Against Determinism)
  *Claim: Chaos proves the future is not fixed.*
  1.  **Ontology vs. Epistemology:** The metaphor suggests the future "branches" or is "open." The math shows the future is **fixed** but **unknowable**. The divergence occurs *because* the laws are deterministic, not because they are loose.
  2.  **The Demon's Precision:** The argument assumes Laplace's Demon fails because the *future* is indeterminate. Chaos theory shows the Demon fails because the *input* requires infinite precision. The failure is computational/epistemic, not ontological.

  #### For Argument 2 (Against Climate Responsibility)
  *Claim: My emissions are lost in the noise like a wingbeat.*
  1.  **Perturbation vs. Forcing:** The butterfly is an *initial condition perturbation* (noise). CO₂ emissions are a *parameter forcing* (signal). A butterfly changes which path you take on the map; CO₂ changes the shape of the map itself (the attractor geometry).
  2.  **Attribution Arbitrariness:** The metaphor singles out the butterfly as the "cause" of the tornado. In the simulation, *every* digit of the initial state contributes equally to the divergence. Singling out the wingbeat is a narrative choice, not a mathematical one. You cannot blame the butterfly and exonerate the air molecule next to it.
  3.  **Boundedness:** The metaphor implies a wingbeat can grow into *anything* (a tornado). In reality, divergence is bounded by the energy of the system (the attractor). A wingbeat cannot amplify into a hurricane if the thermal energy isn't there.

  ---

  ### III. Audit of Your Suspicions

  Your intuitions are mathematically sound. Here is the confirmation and necessary nuance:

  1.  **"Systems are deterministic by construction."**
      *   **Confirmed.** The Lorenz equations are a set of deterministic ODEs. There is no stochastic term. If Argument 1 relies on chaos to prove indeterminism, it is self-undermining. Chaos is a property of deterministic systems.
  2.  **"Singling out one flap is arbitrary."**
      *   **Confirmed.** In a high-dimensional system (like the atmosphere), the "distance" between two states is a vector norm. Attributing the divergence to the "wingbeat" rather than the "humidity at grid point 4052" is a human selection bias. This undermines the causal chain required for moral responsibility (Argument 2), but not in the way your housemate thinks. It undermines *all* specific attribution, not just yours.
  3.  **"Divergence cannot grow without limit."**
      *   **Confirmed.** Trajectories are confined to a strange attractor. The error grows exponentially only until it saturates at the scale of the attractor. You cannot amplify a micro-perturbation into an infinite macro-effect.
  4.  **"Shrinking initial error buys only a modest extension of forecast horizon."**
      *   **Confirmed.** Because divergence is exponential ($e^{\lambda t}$), forecast time $T$ scales logarithmically with precision $\epsilon$ ($T \propto \ln(1/\epsilon)$). To double your forecast horizon, you must square your precision. This makes perfect prediction practically impossible, but it does not make the system indeterminate.

  ---

  ### IV. The Climate Case: Trajectory vs. Statistics

  For your housemate's second argument to hold ("my emissions don't matter because the system is chaotic"), the "tornado case" would need to satisfy specific conditions that the climate system does not meet.

  **The Required Conditions for Argument 2:**
  1.  **Pure Initial Value Problem:** The system would have to depend *only* on initial conditions, with no external forcing.
  2.  **Ergodicity of Impact:** The perturbation (emissions) would have to average out to zero effect on the system's statistical properties over time.

  **Why It Fails:**
  *   **Weather is an Initial Value Problem; Climate is a Boundary Value Problem.**
      Chaos destroys *trajectory* prediction (Will it rain in Texas on July 4, 2050?). It does not destroy *statistical* prediction (What will the average temperature of Texas be in 2050?).
  *   **Forcing Changes the Attractor.**
      Your emissions do not just nudge the weather along its current path (like the butterfly); they add energy to the system, altering the differential equations themselves (radiative forcing). This changes the geometry of the attractor.
      *   *Analogy:* The butterfly moves the ball to a different pocket on the pool table. Emissions tilt the table. The ball's path is still chaotic, but it will now overwhelmingly favor the lower pockets.
  *   **Verdict on Attribution:**
      While you cannot attribute a specific storm to a specific ton of CO₂ (trajectory level), you can attribute the shift in the *probability distribution* of storms to the aggregate emissions (statistical level). Responsibility attaches to the shift in the distribution, which is predictable even if the specific realization is not.

  ---

  ### V. Verdict on Housemate's Conclusions

  **Conclusion 1: "The future is not fixed... the Demon is a fantasy."**
  *   **Verdict: False.**
  *   **Reasoning:** This confuses *predictability* with *determinism*. The Butterfly Effect demonstrates that a deterministic system can be unpredictable to any finite observer. Laplace's Demon is a fantasy because infinite precision is physically impossible to encode or measure, not because the future is ontologically open. The metaphor supports *epistemic humility*, not *ontological indeterminism*.

  **Conclusion 2: "Nothing is attributable to me... I am not answerable."**
  *   **Verdict: False.**
  *   **Reasoning:** This confuses *noise* (initial condition sensitivity) with *forcing* (parameter change). Individual actions are indeed lost in the weather noise (trajectory), but aggregate actions change the climate statistics (attractor). Furthermore, the "arbitrary singling out" disanalogy cuts both ways: if the butterfly isn't responsible for the tornado, neither is the "noise" of the atmosphere responsible for absolving you. You are part of the forcing function, not just a perturbation.

  ---

  ### VI. A Better Metaphor

  The Butterfly fails because it imports biology (agency), discrete causation (the flap caused the storm), and unbounded growth. You need a metaphor that conveys **Sensitive Dependence on Initial Conditions (SDIC)** within a **Deterministic, Bounded System** without implying **Agency** or **Specific Attribution**.

  **Recommended Metaphor: The Double Pendulum**

  *   **The Setup:** A pendulum attached to the end of another pendulum.
  *   **The Laws:** Strictly Newtonian, fully deterministic.
  *   **The Sensitivity:** Release two double pendulums from positions differing by a millimeter. Initially, they swing together. Within seconds, their motions diverge completely. One may loop-the-loop; the other may not.
  *   **Why it works better:**
      1.  **No Agency:** There is no butterfly, no wingbeat, no "action." There is only *position*. This removes the moral weight of the "flap."
      2.  **No Specific Cause:** You cannot say the "millimeter" caused the loop. The entire configuration caused the motion. This mirrors the "arbitrary singling out" reality of chaos.
      3.  **Bounded:** The pendulum cannot fly off to infinity; it is constrained by gravity and arm length (the attractor).
      4.  **Deterministic:** If you could build a perfect machine and measure perfectly, it would repeat. The unpredictability is clearly ours, not nature's.

  **How to use it in your seminar:**
  *"The Butterfly Effect suggests a small cause creates a large effect. The Double Pendulum shows that a small difference in **state** reveals a large divergence in **path**, even under fixed laws. This preserves determinism (the laws don't change) while explaining unpredictability (we can't measure the state perfectly). It separates the impossibility of prediction from the impossibility of fate."*

  For the climate argument specifically, use the **"Tilted Table"** addendum:
  *"Chaos is the roughness of the table cloth (unpredictable path). Emissions are tilting the table (predictable statistical bias). You can't predict where the ball stops, but you know it will end up lower than it would have."*
