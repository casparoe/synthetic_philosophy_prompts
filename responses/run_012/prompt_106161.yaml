prompt: |-
  I'm a backend engineer at a mid-sized insurance company and I've somehow ended up chairing our fortnightly conformance review, which is the meeting where we decide what to do when two teams have built two different behaviours against the same bit of our pricing spec. Usually it's fine — one of them is just wrong and we point at the test. But the cases that eat the meeting are the ones where the disputed input is something the spec never mentions and no test ever covered, so both implementations agree with every single thing we've ever checked and disagree only on the new case. It feels like there's no fact of the matter about which one is "really" following the spec, and yet we still have to ship one of them. A colleague who did a philosophy degree told me this is a famous puzzle about rule-following, something about a bloke who's only ever added numbers smaller than fifty and then gets asked to add bigger ones, and whether anything about him settles which rule he was following the whole time. I tried reading a book by Saul Kripke he lent me and it turned into scepticism and community agreement and assertibility and I genuinely cannot work out what I'm meant to do at 3pm on a Wednesday. I should say I have no philosophy background at all — I can just about follow an argument if it's laid out flat.

  What I'd like from you is a procedure my review can actually run, not an essay. Give me the questions in the order we should ask them, what counts as a good enough answer to each, where the procedure is allowed to stop with a flat "no, we don't ship that", and — this bit matters most — where it has to hand the decision to a person and say "this isn't a question about what the rule means, it's a question about what we want, and someone senior has to own it". Keep it runnable in a 45-minute meeting by people who aren't philosophers, and be honest about which steps are real reasoning and which are just us dressing up a vote as a method. The head of engineering and one product owner have to sign off, and we can't rewrite the spec mid-review, so the procedure has to work with the spec as it is. Also worth knowing: we now have one team in Leeds and one in Bangalore, and they don't always share the same gut feelings about what a word in the spec obviously means, so if your procedure leans on "everyone agrees on the normal case" you need to say what happens when they don't. And our spec has a house clause that says the implementation is authoritative wherever the spec is silent, which I suspect is doing a lot of quiet work, so please say what your procedure does with that.

  Then please run it on three cases, and I want the verdicts argued, not just asserted. (1) The spec says round to the nearest penny; nobody ever noticed that it never says what to do when the amount lands exactly on a half-penny, and now the two engines disagree on ties. (2) The spec grants a "30 day grace period" and never says calendar or business days; both implementations passed everything because until now no payment ever landed near a weekend, and they now diverge by up to two days. (3) A customer was underpaid for about a year because of a divergence nobody had thought to test, both behaviours were defensible against the old spec, and now we're deciding whether to refund everyone retroactively. I'd like at least one of those verdicts to be one I won't like, and I'd like you to tell me plainly what the procedure can't settle — the cases where it just outputs "argue about it and then pick" — and name the position you're translating, in one line, so I can look it up without you having to teach me the whole thing.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the User and Request:**
      *   **User Role:** Backend Engineer at a mid-sized insurance company.
      *   **Task:** Chairing a fortnightly conformance review (resolving spec ambiguities where two implementations diverge).
      *   **Problem:** The "Kripkean" problem of rule-following (spec is silent/ambiguous, both implementations are consistent with past data, no "fact of the matter" on which is correct).
      *   **Constraints:**
          *   No philosophy background (keep it practical, flat arguments).
          *   45-minute meeting limit.
          *   Participants: Engineers (Leeds & Bangalore, potential cultural/linguistic divergence), Head of Engineering, Product Owner.
          *   Cannot rewrite spec mid-review.
          *   House clause: "Implementation is authoritative wherever spec is silent."
          *   Need a specific procedure (questions, stop conditions, escalation points).
          *   Need to distinguish between "real reasoning" and "dressed-up voting."
          *   Need to run the procedure on three specific cases (Half-penny rounding, Grace period days, Retroactive refund).
          *   One verdict must be unpopular/uncomfortable.
          *   Must identify where the procedure fails and names the philosophical position being translated.

  2.  **Deconstruct the Philosophical Core (Kripke/Wittgenstein):**
      *   The user mentions Kripke's reading of Wittgenstein on rule-following.
      *   *The Skeptical Paradox:* No past usage determines future application uniquely (the "quus" vs. "plus" problem).
      *   *The Skeptical Solution:* Meaning is determined by community agreement/assertibility conditions, not truth conditions.
      *   *Translation to Engineering:* We can't find the "true" meaning in the spec text because it's not there. We have to establish *authority* and *consequence*.
      *   *The House Clause:* This is crucial. It effectively says "Code is Law" where spec is silent. This shifts the burden from "What does the spec mean?" to "Which implementation do we ratify as the spec?"

  3.  **Drafting the Procedure (The "Conformance Protocol"):**
      *   *Goal:* Move from "What is right?" to "What do we do?" efficiently.
      *   *Step 1: Verification of Silence.* Confirm the spec *actually* doesn't cover it. (Stop if it does).
      *   *Step 2: Impact Assessment.* Does this matter financially/legally? (Stop if trivial).
      *   *Step 3: The House Clause Check.* Since implementation is authoritative where spec is silent, do we pick the existing production behavior or the new proposal?
      *   *Step 4: The "Cost of Change" Test.* Which one is cheaper to standardize on?
      *   *Step 5: Escalation.* If costs/risks are equal, it's a business preference, not a technical truth.
      *   *Constraint:* Must handle the Leeds/Bangalore divergence. Avoid "common sense." Rely on "documented intent."
      *   *Constraint:* 45 minutes. Keep steps binary where possible.

  4.  **Refining the Procedure (Iterative Polish):**
      *   *Critique:* The House Clause is a trap. If *both* are implementations, which one is authoritative? Usually, it means "Production is authoritative." But if both are new? Let's assume one is Legacy/Prod and one is New/Refactor, or both are New. The prompt implies "two teams built two different behaviours." Let's assume we need to pick one to become *the* behavior.
      *   *Adjustment:* The House Clause implies that *an* implementation defines the rule where the spec is silent. But we have *two*. So we must select *which* implementation gets to be the "authoritative implementation."
      *   *Philosophical Translation:* This is moving from Truth Conditions (what does the text mean?) to Assertibility Conditions (what are we willing to defend?).
      *   *Stop Condition:* If the risk is regulatory/legal, engineering can't decide. Escalate.
      *   *Voting vs. Reasoning:* Acknowledge that Step 4 is essentially a vote weighted by effort.

  5.  **Developing the Three Cases:**

      *   **Case 1: Half-penny rounding.**
          *   *Spec:* "Round to nearest penny." Silent on .5.
          *   *Divergence:* Round Half Up vs. Round Half Even (Banker's).
          *   *Analysis:* Mathematically arbitrary. Financially cumulative.
          *   *Verdict:* Pick Banker's Rounding (industry standard), even if it costs more to change. Why? Regulatory expectation.
          *   *Unpopular aspect:* Might require changing the "correct" looking code.

      *   **Case 2: Grace period (30 days).**
          *   *Spec:* "30 day grace period." Silent on Calendar vs. Business.
          *   *Divergence:* Calendar (Leeds?) vs. Business (Bangalore?).
          *   *Analysis:* Customer expectation vs. Operational ease.
          *   *House Clause:* If one is already in prod, it wins unless legal says no.
          *   *Verdict:* Calendar days. (Customer friendly/standard).
          *   *Reasoning:* "Day" usually implies calendar day unless "business day" is specified.

      *   **Case 3: Retroactive refund.**
          *   *Spec:* Silent on the divergence that caused underpayment.
          *   *Divergence:* Both defensible.
          *   *Analysis:* This isn't a spec question; it's a liability question.
          *   *Verdict:* **ESCALATE.** Engineering cannot decide this. This is the "Hand off to person" step.
          *   *Philosophical Point:* This is where the "Skeptical Solution" fails. Community agreement doesn't fix past harm. This requires *Normative Authority*, not just *Descriptive Agreement*.

  6.  **Addressing the Specific Constraints:**
      *   *Leeds/Bangalore:* Explicitly ban "obviously means." Require "Industry Standard" or "Legal Precedent."
      *   *House Clause:* Integrate into Step 3.
      *   *Philosophical Label:* Need to name the position. "Kripke's Skeptical Solution" or "Wittgensteinian Communal Normativity." Let's use "Kripke's Skeptical Solution (Assertibility over Truth)."
      *   *Honesty:* Admit where it's a vote.

  7.  **Final Review against User Prompt:**
      *   *Procedure order?* Yes.
      *   *Good enough answers?* Yes.
      *   *Stop conditions?* Yes.
      *   *Hand-off point?* Yes.
      *   *45 mins?* Yes, kept concise.
      *   *Leeds/Bangalore?* Addressed via "External Standard" requirement.
      *   *House Clause?* Integrated.
      *   *Three Cases?* Yes, argued.
      *   *One unpopular verdict?* Case 3 (No refund decision by eng) or Case 1 (Change working code). Let's make Case 1 the unpopular one (force change to Banker's rounding despite cost). Actually, Case 3 is better for "Procedure can't settle." Let's make Case 1 the "Unpopular technical decision" and Case 3 the "Procedure failure."
      *   *Philosophical label?* Included.

  8.  **Drafting the Content (Mental or Scratchpad):**
      *   *Intro:* Acknowledge the Kripkean trap.
      *   *Procedure:* 5 Steps.
      *   *Case Studies:* Apply steps rigorously.
      *   *Limitations:* Explicit section on where it breaks.
      *   *Philosophy:* One-liner at the end.

      *(Self-Correction during drafting)*: Wait, the prompt asks for *one* verdict to be one I won't like. As an engineer, I probably won't like being told to refactor working code for a philosophical reason, or I won't like being told Engineering can't decide the refund. Let's make the Refund case the one where the procedure says "You have no authority to decide this," which is frustrating but honest. And for the Rounding case, I'll force the "Banker's Rounding" which might be more work.

      *(Refining the House Clause)*: "Implementation is authoritative wherever spec is silent." If Team A built X and Team B built Y, and both are "implementations," the clause is contradictory unless we define *which* implementation. Usually, this means "The code currently running in Production." I need to make sure the procedure checks if one is already live. If *neither* is live (both new), the clause is useless. I will assume for the procedure that usually one is existing/prod or one is the proposed standard. If both are new proposals, the clause forces us to pick one to *become* authoritative.

      *(Refining the Leeds/Bangalore issue)*: The procedure must explicitly forbid "Intuitively..." arguments. It must require "External Reference."

      *(Final Polish)*: Ensure the tone is pragmatic, slightly weary but authoritative, matching the user's "3pm on a Wednesday" vibe.

  9.  **Final Output Structure:**
      1.  The Protocol (The "Conformance Triage").
      2.  The Three Cases (Applied Protocol).
      3.  The Limitations (Where it breaks).
      4.  The Philosophical Label.

      *(Wait, one more check)*: The prompt asks: "where it has to hand the decision to a person and say 'this isn't a question about what the rule means, it's a question about what we want, and someone senior has to own it'". I need to make sure this is a specific step in the procedure.

      *(Okay, ready to write.)*
answer: |-
  Here is the procedure. It is designed to bypass the philosophical trap by treating the spec not as a truth-condition (what is *real*), but as an assertibility-condition (what we are willing to *defend*). It respects your House Clause, accounts for geographic divergence, and fits in 45 minutes.

  ### The Conformance Triage Protocol (CTP)

  **Timebox:** 45 Minutes.
  **Attendees:** Chair (You), Reps (Leeds/Bangalore), Head of Engineering (HoE), Product Owner (PO).
  **Rule:** No arguments from "common sense" or "obviously." All claims must reference an external standard, a cost, or a risk.

  **Step 1: The Silence Check (5 mins)**
  *   **Question:** Does the spec *explicitly* forbid either behaviour?
  *   **Good Answer:** "Section 4.2 says X, which prohibits Behaviour A."
  *   **Stop Condition:** If yes, the prohibited behaviour dies. Meeting ends.
  *   **Failure Mode:** If both behaviours are permitted by the text, proceed to Step 2.
  *   **Note:** If Leeds says "Obviously 'day' means business day" and Bangalore says "Obviously 'day' means calendar day," this step fails. You must confirm the text is silent.

  **Step 2: The House Clause Audit (5 mins)**
  *   **Question:** Is one of these behaviours currently live in Production?
  *   **Good Answer:** "Team Leeds code is on 80% of policies."
  *   **Rule:** Per the House Clause ("implementation is authoritative wherever spec is silent"), the live behaviour is the *default winner*.
  *   **Stop Condition:** If one is live, the other team must refactor to match, *unless* Step 3 overrides this.
  *   **Note:** If *neither* is live (both new builds), this step is skipped. No default winner.

  **Step 3: The Regulatory & Financial Risk Scan (10 mins)**
  *   **Question:** Does one behaviour expose us to regulatory breach or material financial loss?
  *   **Good Answer:** "Round-half-up biases revenue upward; regulator expects Banker's Rounding for insurance." OR "Calendar days increases grace period risk by 2%."
  *   **Stop Condition:** If one behaviour creates unacceptable risk, it dies. The other wins.
  *   **Note:** This is where you override the House Clause. Compliance trumps code.

  **Step 4: The Cost of Convergence (10 mins)**
  *   **Question:** If we pick the winner from Step 2 or 3, what is the engineering cost to align the loser?
  *   **Good Answer:** "2 story points to refactor."
  *   **Rule:** If the cost is trivial, the Winner stands. If the cost is high (e.g., architectural rewrite), proceed to Step 5.
  *   **Honesty Check:** This step is often "dressed-up voting." If costs are similar, admit it. Do not invent technical debt to justify a preference.

  **Step 5: The Authority Handoff (15 mins)**
  *   **Trigger:** If Steps 1–4 yield no clear winner (e.g., neither is live, risk is equal, costs are equal, or the decision involves moral/liability judgment).
  *   **Statement:** "The spec does not determine this. The House Clause cannot choose between two new implementations. This is a business policy decision, not a conformance check."
  *   **Action:** The Product Owner or Head of Engineering must verbally commit to one behaviour.
  *   **Requirement:** The decision must be recorded as a *Spec Amendment* for next sprint. You cannot ship without updating the spec to reflect the choice.
  *   **Stop Condition:** If the PO/HoE refuses to choose, nothing ships.

  ***

  ### Running the Protocol on Your Cases

  #### Case 1: The Half-Penny Tie
  *Spec:* "Round to nearest penny."
  *Divergence:* Team A rounds .5 up (0.505 → 0.51). Team B rounds .5 to even (0.505 → 0.50).
  *Status:* Both new code.

  1.  **Silence Check:** Spec says "nearest." Mathematically, .5 is equidistant. Text is silent. **Pass.**
  2.  **House Clause:** Neither is live. **Skip.**
  3.  **Risk Scan:** Actuarial Rep notes: "Insurance accounting standards (IFRS/GAAP) generally prefer 'Round Half to Even' (Banker's Rounding) to prevent systematic upward bias over large portfolios. Round Half Up creates a cumulative revenue skew."
      *   *Verdict:* Team A (Round Up) creates regulatory/accounting risk. Team B is industry standard.
      *   *Decision:* Team A must change to Team B.
  4.  **Cost:** Team A says refactoring the rounding module is 3 points. Acceptable.
  5.  **Handoff:** Not needed.

  **Verdict:** **Ship Team B.** Team A must refactor.
  **Argument:** This wasn't about "truth"; it was about external normative standards. You avoided the philosophical trap by deferring to the Accounting Community rather than the Engineering Community.
  **Unpopular Bit:** Team A built "correct" code based on primary school math. They have to tear it out because the *industry* defines the rule, not the spec text.

  #### Case 2: The Grace Period (30 Days)
  *Spec:* "30 day grace period."
  *Divergence:* Leeds (Calendar days). Bangalore (Business days).
  *Status:* Leeds code is live on legacy policies; Bangalore is new platform.

  1.  **Silence Check:** "Day" is ambiguous without qualifier. **Pass.**
  2.  **House Clause:** Leeds is live. By clause, Leeds (Calendar) is authoritative.
  3.  **Risk Scan:** PO notes: "If we switch to Business Days, customers expect payment on weekends to count. Switching to Business Days shortens their effective grace period. This increases lapse rates and complaint volume."
      *   *Verdict:* Switching to Bangalore's behaviour increases churn risk. Keeping Leeds' behaviour is safer.
  4.  **Cost:** Bangalore team must update logic to include weekends. 5 points.
  5.  **Handoff:** Not needed.

  **Verdict:** **Ship Leeds (Calendar).** Bangalore must match.
  **Argument:** The House Clause did the heavy lifting here. The "fact of the matter" is that the existing code *made* the rule.
  **Leeds/Bangalore Factor:** This prevents linguistic imperialism. It doesn't matter that "day" means something different in one office; the Production Environment is the single source of truth.

  #### Case 3: The Retroactive Underpayment
  *Spec:* Silent on the logic that caused the underpayment.
  *Divergence:* Both behaviours were defensible. Customers were underpaid for a year.
  *Status:* We are deciding whether to refund.

  1.  **Silence Check:** Spec was silent. **Pass.**
  2.  **House Clause:** The live implementation caused the underpayment. Technically, the House Clause says the implementation *is* the rule. Therefore, legally, we owed them exactly what we paid them.
  3.  **Risk Scan:** Legal/Compliance (invited for this step): "While the spec was silent, consumer protection law implies 'good faith'. Systematic underpayment, even if spec-compliant, creates reputational catastrophe and potential class action."
      *   *Conflict:* Engineering says "We followed the code." Business says "We look like thieves."
  4.  **Cost:** Refund cost is £2M. Engineering fix is cheap.
  5.  **Handoff:** **TRIGGERED.**
      *   *Statement:* "Engineering cannot decide this. The House Clause makes the underpayment 'correct' technically, but Business must decide if 'correct' is acceptable. This is a liability decision."
      *   *Action:* PO/HoE must sign off on the refund. Engineering cannot authorize the write-off.

  **Verdict:** **NO ENGINEERING VERDICT.** The meeting ends with a ticket assigned to the CFO/PO to authorize a refund. Engineering ships the fix only after financial authorization.
  **Argument:** This is where the procedure admits it cannot settle the "truth." The "Skeptical Solution" (community agreement) works for future rules, but it cannot fix past harm. The House Clause protects you technically, but it does not protect the company morally or financially.
  **Unpopular Bit:** You (the Chair) have to tell the room that Engineering is *not allowed* to decide if the customers get their money back, even though the code was "wrong" by outcome. You are stripping your own team of agency to protect them from liability.

  ***

  ### Where the Procedure Fails (The Honest Bit)

  There is one place where this protocol is just "argue about it and then pick." That is **Step 5**.

  When Risk is equal, Cost is equal, and neither is live (e.g., two new microservices disagreeing on JSON key naming conventions where no standard exists), the procedure outputs **"Pick One."**
  *   **Reasoning:** There is no fact of the matter.
  *   **Mechanism:** The Senior Person (HoE/PO) picks based on gut feel.
  *   **Requirement:** You must immediately write a spec update. You are not *discovering* the rule; you are *legislating* it.

  If you try to find a "technical reason" in Step 5, you are lying. Admit it is a vote.

  ### The Philosophical Position

  You asked for the name of the position I am translating so you can look it up.

  **"Kripke's Skeptical Solution: Meaning is determined by assertibility conditions within a community, not truth conditions."**

  *   **Translation:** There is no "true" meaning of the spec hidden in the text (Truth Condition). There is only what we are willing to assert and defend as a company (Assertibility Condition).
  *   **Why it matters:** It frees you from trying to find the "right" answer. There isn't one. There is only the answer you can defend to the regulator and the customer.

  ### Summary for your 3pm Meeting

  1.  **Check Silence:** If the text allows both, admit the text is broken.
  2.  **Check Production:** If one is live, it wins (House Clause).
  3.  **Check Risk:** If one breaks laws/accounting, it dies.
  4.  **Check Cost:** If alignment is too expensive, escalate.
  5.  **Escalate:** If all else fails, the Product Owner owns the decision, and the Spec must be updated immediately.

  Print this out. Put it on the screen. When someone says "But logically...", point to Step 1. When someone says "But my code is right...", point to Step 2. When someone asks "Should we refund?", point to Step 5 and leave the room.
