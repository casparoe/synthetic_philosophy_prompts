answer: |-
  Dear Colleague, it is a genuine pleasure to engage with someone who knows the mud and the birds, and I share your unease about how comfortably that specific line from evolutionary biology has settled into the seminar room. It is a common fate for successful scientific models to harden into folk wisdom, shedding their caveats along the way, and your suspicion that the slogan is doing too much work is well-founded. To sort this out, we need to disentangle the logical layers hidden within the phrase only costly signals are honest, moving from the definitional to the empirical, and finally to the overextended.

  The first reading we might call the Equilibrium Definition. On this view, cost is not an independent property of the signal but is defined retroactively by the stability of the system. If a signal is honest in a stable evolutionary state, then by definition the cost must have been sufficient to deter deception; if it were not costly enough to deter liars, liars would invade, and the signal would cease to be honest. Here, cost simply means whatever is required to make deception unprofitable. The verdict on this thesis is that it is trivially true. It is a tautology of signaling game theory, describing the conditions of a separating equilibrium rather than offering a causal mechanism. It tells us that if honesty exists, there must be a barrier to lying, but it does not tell us what constitutes that barrier or how to identify it in the wild before we know the outcome. This reading cannot support the seminar's arguments because it offers no predictive power; you cannot look at a peacock's tail or a politician's humiliation and know independently that it is costly enough to ensure honesty without already knowing that the signal is honest.

  The second reading is the Differential Cost Thesis, which is the substantive core of the Zahavi-Grafen models you know well. This claims that for a signal to remain honest, the marginal cost of producing it must be lower for high-quality signallers than for low-quality ones. It is not enough that the signal is expensive; it must be differentially expensive, such that a low-quality individual would suffer a net fitness loss by attempting to mimic a high-quality individual, while the high-quality individual gains a net benefit. The verdict here is substantive and defensible, but strictly contingent. It holds within the specific boundaries of the models where interests conflict and information is asymmetric. It is a powerful explanation for certain biological traits, but it is a claim about the conditions under which honesty can be maintained, not a guarantee that any observed cost implies honesty. This thesis is robust within its domain, but it requires rigorous demonstration of the cost structure, which is rarely available in the human examples cited in your seminar.

  The third reading is the Sufficiency Thesis, which asserts that cost guarantees truthfulness. This is the inverse of the biological principle, claiming that because a behavior is expensive, it must be an honest signal of some underlying quality. The verdict on this thesis is false. Cost is a necessary condition in many handicap models, but it is not sufficient. An individual can engage in costly behavior that is deceptive, maladaptive, or simply noisy without conveying reliable information. A politician might endure public humiliation not because they are trustworthy, but because they are calculating that the short-term cost buys long-term impunity, or because they are compelled by pathology rather than strategy. In economics, burning money is costly, but it does not signal ability unless the context structures the payoffs such that only the able can afford to burn it. To treat cost as a sufficient condition for honesty is a logical error that confuses a barrier to entry with a certificate of quality.

  The fourth reading is the Universalist Thesis, which suggests that the principle applies across all domains of information transfer, from biology to human institutions, without modification. This assumes that human social interactions are governed by the same fitness constraints and payoff structures as animal signaling games. The verdict on this thesis is false, or at least untenable without heavy qualification. Human communication relies heavily on cheap talk, norms, institutions, and shared intentionality, which can sustain honesty without costly handicaps. We often tell the truth because of legal consequences, social reputation, or moral internalization, none of which require the kind of fitness-draining expenditure seen in a peacock's tail. To assume that a university degree or a religious fast functions exactly like a biological handicap ignores the complex cultural scaffolding that gives those acts meaning.

  Now, to answer your question about what the people in that room must have in mind for their conclusions to follow. When they use the sentence to settle an argument about trustworthiness, inferring that a person is honest because they have endured a cost, they are relying on the Sufficiency Thesis. They need cost to function as a guarantee, a window that cannot be faked. They are assuming that because the signal is expensive, it must be true. As I have stated, this reading is false. They are treating a condition for evolutionary stability as a diagnostic tool for individual instances, and they are ignoring the possibility of costly lies. If they were relying on the Equilibrium Definition, they could not make the inference without prior knowledge of the honesty. If they were relying on the Differential Cost Thesis, they would need to demonstrate the marginal cost structure for the specific individuals involved, which they do not. Therefore, the weight their argument carries depends entirely on a false reading of the principle.

  Regarding the exposure of the argument, I should be honest about where my own reasoning might be vulnerable. The weak joint in this analysis lies in the translation of biological cost to human utility. In biology, fitness is the common currency, but in human seminars, cost is measured in money, time, social capital, or psychological distress, none of which are perfectly fungible or comparable across individuals. My verdict that the Sufficiency Thesis is false depends on the assumption that we can identify costs independently of the signal's truth. However, if one argues that the perceived cost is itself constructed by the receiver's interpretation, the line between the Equilibrium Definition and the Sufficiency Thesis blurs. What would most likely change my verdicts is empirical evidence showing that costly lying is systematically unsustainable in human institutions over the long term, even without institutional enforcement. If it could be shown that costly deceptive signals inevitably collapse due to internal dynamics similar to evolutionary instability, the Sufficiency Thesis might be rehabilitated as a probabilistic heuristic rather than a logical guarantee. Conversely, the Differential Cost Thesis would move from defensible to untenable if we found stable systems of honest signaling where costs were identical for all signallers, relying instead on punishment or indexing rather than handicaps.

  In my own reasoning, the weak joint is the assumption that the seminar participants are making a logical claim rather than a probabilistic one. They may not believe cost guarantees truth in every case, but only that it raises the probability significantly. If their claim is merely heuristic, then calling it false is perhaps too harsh, though calling it warranted is still risky. However, since you say they use it to settle arguments, they appear to be treating it as a decisive rule. My caution rests on the fact that human agents are reflexive; unlike peacocks, we know the theory. Once the handicap principle becomes common knowledge, it invites counter-strategies where agents simulate cost to manipulate the signal, thereby decoupling cost from quality. This reflexivity is the specific vulnerability in applying biological models to human philosophy, and it is where I believe your suspicion is most vital. You are right to feel half persuaded, because the logic holds in the abstract models, but half suspicious, because the map is being mistaken for the territory. Trust the suspicion; the seminar is likely building a house on a foundation that is solid only in a different climate.
