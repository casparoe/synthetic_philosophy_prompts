answer: |-
  Your friend is likely relying on the **Total Semantic Externalism** reading (which is false) while borrowing credibility from the **Reference Externalism** reading (which is a platitude), so the slogan settles nothing without equivocation.

  | Reading | The precise claim it amounts to | Status (platitude / defensible / contentious / false) | What 2D semantics does with it | Does it support the case-closed move (yes / partly / no, plus one clause saying why) |
  | :--- | :--- | :--- | :--- | :--- |
  | **Reference Externalism** | The extension of a natural kind term does not supervene on the speaker's intrinsic physical state. | Platitude | Concedes this for the **Secondary Intension**, which fixes extension relative to the actual world. | **No**, because it leaves open whether the **Primary Intension** (the rule for finding the extension) is shared. |
  | **Truth-Conditional Externalism** | The truth conditions of a speaker's utterances do not supervene on the speaker's intrinsic physical state. | Defensible | Concedes this for propositions built from **Secondary Intensions**, which vary across Twin Earth scenarios. | **No**, because 2D semantics posits **Primary Propositions** that remain constant across those scenarios. |
  | **Psychological Externalism** | The individuation of psychological states (e.g., believing that water is wet) does not supervene on the speaker's intrinsic physical state. | Contentious | Denies this for states characterized by **Primary Intensions**, which are designed to capture narrow psychological roles. | **Partly**, only if one assumes psychology *must* track external truth conditions rather than cognitive role. |
  | **Social Externalism** | The meaning of a speaker's words depends on the linguistic division of labor and expert usage in their community, not just their internal state. | Defensible | Neutral on the social aspect, but maintains that the **Primary Intension** is fixed by the individual's conceptual grasp regardless of experts. | **No**, because even if experts fix reference, the individual's internal grasp (Primary Intension) can still be shared with a duplicate. |
  | **Narrow Content Skepticism** | There is no legitimate theoretical notion of "content" that supervenes on the speaker's intrinsic physical state. | Contentious | Denies this outright, identifying **Primary Intensions** as a robust, legitimate form of narrow content. | **Yes**, but only if this claim is true, which is precisely what the 2D framework disputes. |
  | **Total Semantic Externalism** | No semantic property whatsoever (reference, sense, character, or content) supervenes on the speaker's intrinsic physical state. | False | Denies this, as **Primary Intensions** (and Kaplanian Character) are semantic properties that are explicitly internal. | **Yes**, but the premise is false, so the argument is unsound despite the conclusive tone. |
