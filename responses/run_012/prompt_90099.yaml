prompt: |-
  Okay, I'm a novelist, not a game theorist, so bear with me. I've been trying to work out a plot about two brothers who each, in public, vow to never sell the family farm, mainly because each is terrified the other will sell first. By the time they're done vowing, neither can back down without looking like a traitor, and the farm goes bankrupt. A friend told me this is a commitment race, where people compete to lock themselves into a hard line before anyone else can, and the locking-in itself makes everyone worse off. Is that a real, distinct failure of practical rationality, or is it just ordinary brinkmanship with a fancy new name? Write me an essay that weighs both sides and actually lands on a verdict. Give it these sections, in this order: The setup (about 150 words), The case that it's a distinct problem (about 300 words), The case that it's just brinkmanship (about 300 words), My verdict (about 200 words). American English, please, and no citations or reading lists—I'm definately not writing a dissertation.
