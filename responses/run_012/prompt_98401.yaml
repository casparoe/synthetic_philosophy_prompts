      *   *Comparison:* This sounds very similar to Mark Schroeder's "Hybrid Expressivism" or perhaps a variation on Blackburn's quasirealism, but specifically invoking Walton. Actually, it sounds closest to **Kalderon's Moral Fictionalism** or **Walton's own suggestions**, but applied to *semantics* rather than *ontology*.
      *   *Critical Weakness:* The Frege-Geach problem is about *logic* and *truth-conditions* (or assertibility conditions). Make-believe usually sidesteps truth. If validity is just "licensed moves in a game," have we saved *logic* or just created a *game rule*?

