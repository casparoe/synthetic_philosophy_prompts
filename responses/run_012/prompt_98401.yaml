      *   *(3) Disjunction:* "P or Q." In make-believe, what is the prop for disjunction? "Imagine P or imagine Q"? Or "Imagine (P or Q)"? If logic is just game rules, can we generate *ex falso quodlibet*? If the game doesn't license it, is the logic broken? *Verdict:* This exposes the "redefining validity" worry.
