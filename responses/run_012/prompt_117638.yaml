answer: |-
  **Exam Question: Behavioural Genetics and Social Policy**

  **Time Allowed:** 45 Minutes
  **Expected Response Length:** Approximately 700 words

  **Scenario:**
  A fictional study compares arithmetic scores among twelve-year-olds in two nations using identical and fraternal twin comparisons. In Country A, where schooling, nutrition, and after-school care are unusually uniform, the heritability estimate ($h^2$) is 0.85. In Country B, where these environmental factors vary enormously, the estimate is 0.25. A policy commentator argues that in Country A, differences are "mostly genetic, so extra tutoring will do little," while in Country B, they are "mostly environmental, so that is where the money should go."

  **Task:**
  Write a critical assessment of the commentator's claims. Your response must address the following five points:

  1.  Define precisely what the figure 0.85 measures in this context and explicitly state what it does not measure regarding an individual child.
  2.  Explain why the difference between 0.85 and 0.25 is consistent with the standard variance model ($V_P = V_G + V_E$) without assuming genes shape arithmetic differently in each country, and evaluate whether the claim that tutoring "will do little" follows logically.
  3.  Clarify what these two within-country estimates can and cannot tell us about why the average scores of the two countries might differ from one another.
  4.  Analyze how the "mostly genetic" reading changes if gene-environment correlation (rGE) or gene-environment interaction (GxE) is present, and identify which assumptions of the classical twin method the scenario itself gives reason to doubt.
  5.  Specify what type of evidence would actually settle whether tutoring helps, and provide a defensibly worded version of the commentator's claim that respects the statistical limits of heritability.

  ***

  **Model Answer**

  The figure 0.85 measures the proportion of phenotypic *variance* in arithmetic scores within Country A attributable to genetic *variance* at that time. It does not measure the proportion of an individual child's score caused by their genes, nor does it indicate how immutable that score is. Heritability is a population statistic, not an individual metric.

  The divergence between 0.85 and 0.25 is perfectly consistent with the variance model ($V_P = V_G + V_E$) even if genetic variance ($V_G$) remains constant across both nations. In Country A, environmental variance ($V_E$) is suppressed by uniform schooling and nutrition. When $V_E$ shrinks, the ratio $V_G / (V_G + V_E)$ increases, inflating heritability. In Country B, high $V_E$ dilutes the ratio. Consequently, the commentator's claim that tutoring "will do little" in Country A does not follow. Tutoring is an environmental intervention. While reducing environmental *variance* further might not reduce inequality (since most variance is already genetic), changing the environmental *mean* (e.g., better teaching for all) could still raise overall scores significantly. High heritability does not imply environmental insensitivity.

  Furthermore, within-country heritability estimates cannot explain between-country differences. This is the ecological fallacy. Even if arithmetic is highly heritable within both nations, the mean difference between Country A and Country B could be entirely environmental. For example, if Country A has better nutrition on average, their higher scores could be purely environmental, despite high within-group $h^2$. The statistics describe variation around the mean, not the cause of the mean itself.

  The "mostly genetic" reading becomes precarious if gene-environment correlation (rGE) or interaction (GxE) exists. If children with genetic predispositions for arithmetic seek out tutoring (active rGE), the twin method may misattribute environmental effects to genetics, inflating $h^2$. Similarly, if genetic effects depend on context (GxE), the estimate is specific to the current environment and not generalizable. The scenario doubts the Equal Environments Assumption (EEA) and the assumption of no GxE. Since Country A and B have vastly different environments, assuming genetic effects are stable across them is unjustified. The twin method assumes MZ and DZ twins share environments equally, but uniform schooling in Country A might make MZ twins experience more similar treatment than DZ twins, biasing the estimate upward.

  To settle whether tutoring helps, we require experimental evidence, specifically Randomized Controlled Trials (RCTs) where tutoring is assigned independently of genetic propensity or socioeconomic status. Heritability estimates describe existing variance; they do not predict response to intervention. A defensibly worded claim would be: "In Country A, current environmental variance is low, so reducing inequality via environmental equalization may have limited impact on score variance, but environmental improvements could still raise the population mean." This distinguishes between reducing variance (equality) and shifting the mean (improvement), avoiding the error of equating high heritability with environmental futility.

  ***

  **Marking Scheme**

  **Total Marks: 20**

  1.  **Definition of Heritability (4 marks)**
      *   *Criteria:* Must identify it as proportion of *population variance* explained by genetics. Must explicitly deny it applies to *individual scores* or immutability.
      *   *Common Error:* Defining it as "how genetic a trait is" or applying it to a single child's score.
  2.  **Variance Model & Tutoring Logic (4 marks)**
      *   *Criteria:* Must explain $h^2$ rises when $V_E$ falls (denominator effect). Must state tutoring can change the *mean* even if variance is genetic.
      *   *Common Error:* Assuming high $h^2$ means environment cannot change the trait mean.
  3.  **Within vs. Between Groups (4 marks)**
      *   *Criteria:* Must state within-group $h^2$ explains variance, not mean differences between groups.
      *   *Common Error:* Using within-country stats to explain why Country A differs from Country B.
  4.  **rGE/GxE & Twin Assumptions (4 marks)**
      *   *Criteria:* Must note rGE inflates $h^2$ and GxE limits generalizability. Must identify EEA or additivity assumptions as doubtful.
      *   *Common Error:* Ignoring confounding factors or claiming twin studies are always invalid.
  5.  **Evidence & Rewording (4 marks)**
      *   *Criteria:* Must demand experimental evidence (RCTs). Rewording must distinguish variance reduction from mean improvement.
      *   *Common Error:* Suggesting more twin studies or repeating "heritability is not destiny" without policy nuance.

  **Distinction between A and B Answers:**
  A **B-grade** answer correctly identifies the technical errors (variance vs. mean, within vs. between) but may treat them as isolated facts. An **A-grade** answer integrates these points to show how the statistical structure of heritability actively misleads policy if interpreted causally, specifically distinguishing between *inequality reduction* (variance) and *performance improvement* (mean) in the final rewording.

  \answer{The assumption that high heritability implies environmental interventions are ineffective}
