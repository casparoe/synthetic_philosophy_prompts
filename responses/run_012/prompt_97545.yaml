  My sister came into some money recently and she's about to put a big chunk of it into a fund that rests on a single prediction: that one particular industry collapses within about fifteen years, and everything else they do follows from that. She's not naive, she's read a lot about it. Her line is that this isn't a guess, it's a pattern — every industry that's hit this same stage has gone the same way, so the only open question is when, and whoever's positioned early cleans up. I pushed back and she had answers ready for everything:

  - Dad asked what happens if everyone hears the prediction and acts on it, doesn't that change the outcome? She said that cuts her way, not mine — the more people pile in, the more locked-in it gets. It's self-fulfilling, not self-defeating.
  - I said you can't turn a pattern in history into a law the way you do in physics. She said that's exactly backwards, because you can't run controlled experiments on whole economies or societies, so the historical record is the only evidence there is, and that's what the fund is built on.
  - I said fine, but the collapse depends on stuff nobody's built yet — some other technology could come along and blow the whole thing up. She said the fund models for that.

  I can't tell anymore if I'm objecting to something real or if I'm just scared of her being right. Something about the *shape* of her argument bothers me, even granting the pattern is real. Can you tell me what's actually wrong with reasoning this way — or if nothing's wrong, say so plainly? I have a feeling there's a name for whatever I'm circling around, and I'd like to know it, but mostly I want the argument, not a label. And if there is a real problem, what does it actually imply for what she should do with the money? Is the answer just "don't", or is it something more specific than that?

  Answer in British English please. And be upfront about how confident you are in what you're telling me — I'd rather have your honest uncertainty than a tidy verdict. Single out the one point in your answer you're least sure about.
