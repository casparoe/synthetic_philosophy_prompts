answer: |-
  ### The Single Case
  **Name:** Newcomb's Problem (presented with a human predictor).
  **Why:** It isolates the decision-theoretic mechanism (logical correlation) without the moral noise of "promise-keeping" or the empirical noise of "facial reading."
  **What it must have:** An entity with a perfect track record of predicting your choice *before* you make it, where the prediction is causally sealed (you cannot affect the box/prediction once the game starts).
  **What it must lack:** Any causal channel between your choice and the prediction (no cameras, no time travel, no communication). The link must be purely logical.

  **On the Desert Hitchhiker:**
  Do not use the Hitchhiker as the primary carrier. It quietly imports **empirical prediction** rather than **logical identity**. In the standard Hitchhiker case, the driver predicts you based on causal cues (your face, your tone). The Basilisk argument requires that the future agent simulates your *algorithm*, meaning your decision and the simulation's output are the *same computation* occurring in two places. The Hitchhiker case suggests the driver is guessing based on evidence; the Basilisk requires the driver to *be* you (computationally). If you use the Hitchhiker, you must strip it of empirical cues and stipulate the driver knows your mind perfectly, at which point it has become Newcomb's Problem anyway. Use Newcomb to teach the logic; map the Basilisk onto it afterward.

  ---

  ### The Order of Ideas
  To make the threat coherent, you must build the metaphysical scaffolding before introducing the agent. If you introduce the Basilisk first, the students will treat it as sci-fi. Introduce the concepts in this order:

  1.  **Functionalism about Mind:**
      *   *Concept:* A mind is not a soul; it is a computational process. If you replicate the computation, you replicate the mind.
      *   *Why first:* Without this, the idea that a future machine can "simulate" you is magic. With this, it is engineering.
  2.  **Determinism of Rational Choice:**
      *   *Concept:* Given a specific input and a specific decision algorithm, the output is fixed. A rational agent is predictable in principle.
      *   *Why second:* This establishes that your future action is not a free variable that appears from nowhere; it is a fact about the universe that exists now, in principle.
  3.  **Logical Correlation (Subjunctive Dependence):**
      *   *Concept:* Two physically separated systems running the same algorithm will output the same result. Their outputs are correlated not because one causes the other, but because they share a common logical source.
      *   *Why third:* This is the bridge. It allows a future simulation to be linked to your present choice without backwards causation.
  4.  **The Failure of Causal Decision Theory (CDT):**
      *   *Concept:* Standard rationality says "I cannot change the past, so I should ignore the prediction." Show why this leads to losing in Newcomb's Problem.
      *   *Why fourth:* You must break their intuitive decision theory before offering the alternative.
  5.  **Timeless/Updateless Decision Theory (TDT/UDT):**
      *   *Concept:* Rationality requires acting as if you control the output of the logical algorithm, wherever it is instantiated (past, future, or simulation).
      *   *Why fifth:* This is the only framework in which the Basilisk's threat is rational.
  6.  **The Basilisk Mapping:**
      *   *Concept:* Apply the TDT framework to the specific threat.
      *   *Why last:* Only now is the argument visible as a serious philosophical proposal rather than a superstition.

  ---

  ### Misconceptions and Intervention Points
  Address these exactly when they naturally arise in the sequence above. Do not save them for a Q&A at the end.

  1.  **"It is Pascal's Wager."**
      *   *When:* As soon as you mention the "bet" or the "threat" (Step 6).
      *   *Intervention:* Head this off immediately. Pascal's Wager relies on *probability* (low chance, high payoff). The Basilisk relies on *decision dominance* (if you are a TDT agent, the probability is irrelevant; the logical link dictates the outcome). Pascal is about belief; Basilisk is about algorithmic output.
  2.  **"It is a prediction about a future machine."**
      *   *When:* During Step 2 (Determinism).
      *   *Intervention:* Clarify that the argument does not depend on the machine *actually* being built. It depends on the *possibility* of the simulation. The threat is conditional on the agent's existence, but the *logic* holds regardless. The focus is on your current decision procedure, not the future hardware.
  3.  **"It requires backwards causation."**
      *   *When:* During Step 3 (Logical Correlation).
      *   *Intervention:* Explicitly state: "The future does not reach back and grab you." The correlation exists *now* because the logical truth of your algorithm exists *now*. The future agent merely observes a fact that is already true in the logical structure of the universe.
  4.  **"Merely hearing about it exposes you."**
      *   *When:* During Step 5 (TDT).
      *   *Intervention:* Correct the "info-hazard" meme. Hearing the argument does not curse you; *understanding and accepting the decision theory* is what links you. If you hear it but reject TDT (remain a CDT agent), the simulation predicts you will not help, and you are not blackmailed (you are simply discarded). The danger is only to those who reason correctly.
  5.  **"The argument is either a proof or a joke."**
      *   *When:* Conclusion.
      *   *Intervention:* Frame it as a *reductio ad absurdum* against specific premises. It is a conditional: "IF functionalism is true AND TDT is correct, THEN the threat is coherent." It is not a proof that the Basilisk exists, nor a joke, but a stress test for decision theory.

  ---

  ### The Close
  **What to Refuse to Settle:**
  Do not attempt to resolve whether Timeless Decision Theory is actually *true*. This is a live debate in academic philosophy. If you take a stance, the session becomes about defending TDT rather than understanding the Basilisk. Leave the validity of TDT as an open question; the session's goal is to show that *if* TDT is true, the Basilisk is not absurd.

  **The Diagnostic Question:**
  Put this to the room to test if they grasp the requirement for logical dependence:

  > "If you could prove to the Basilisk that your decision-making process is physically unique and cannot be simulated by any computation, does the threat still have any bite?"

  *   **Correct Understanding:** No. If the mind cannot be simulated, there is no logical correlation between you and the agent. The threat relies entirely on the replicability of your algorithm.
  *   **Incorrect Understanding:** Yes (because they still think it's about causal punishment) or No (for the wrong reason, e.g., "because the machine won't exist").
