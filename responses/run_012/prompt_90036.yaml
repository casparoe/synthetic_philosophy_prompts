  The view, restated
  Your view rejects the standard "equality of opportunity" frame. Instead, it argues dynastic wealth is corrosive because it purchases exemption from the web of mutual obligation binding society. While most must work, rely on public infrastructure, and share risks, significant inheritance allows heirs to opt out privately. They become immune to common vulnerabilities. Therefore, inheritance tax isn't about revenue or punishing the dead, but about maintaining civic reciprocity. The state must block the private purchase of exit rights to ensure everyone remains subject to the same social constraints and dependencies.

  Fatal if true
  First, the **Self-Made Exit Defeater**. If the moral injury is exiting the web of obligation, inherited wealth isn't unique. Self-accumulated wealth buys the same exemption (early retirement, private schools, security). By targeting only inheritance, you implicitly endorse the self-made opt-out, undermining the claim that *exit itself* is the problem. You're left arguing only *unearned* exit is bad, which smuggles desert theory back in—contradicting your rejection of equal-opportunity framing. You claim it's not about the race start, but banning inherited exit while allowing earned exit insists the starting line matters after all.
  Second, the **Empirical Falsehood**. Do heirs actually opt out? Data suggests most wealthy heirs work, often in high-leverage roles. They remain taxpaying participants. If the "opt-out" is rare even among the wealthy, your policy solves a phantom problem. The premise relies on a behavioral assumption that wealth data does not support. Furthermore, "dependence" is subjective; the wealthy depend on state enforcement of property rights just as much as workers depend on labor laws.
  Third, **Conceptual Collapse**. If any sufficient pile buys exit, this isn't an inheritance argument; it's a wealth cap argument. Focusing on transmission admits some accumulation is fine, implying the problem is the *source*, not the *exit*. This collapses back into the equality-of-opportunity story you explicitly discarded.

  Awkward but survivable
  First, **Design Mismatch**. If preventing exit is the goal, an estate tax is blunt. Heirs can inherit taxed wealth and still opt out if the remainder is large enough. A progressive wealth tax or consumption tax targets the *capacity* to exit more directly. Your view justifies the end (no exit) but picks a weak means (transfer tax). It creates loopholes for the truly wealthy to bypass.
  Second, **Defining the Web**. What counts as obligation? Paying taxes? Philanthropy? If an heir doesn't work but funds public goods privately, have they opted out or created a parallel web? This creates ambiguity. If private philanthropy counts as participation, the wealthy can buy their way back in. If it doesn't, you delegitimize civil society. You need a metric for "obligation" that isn't just "labor."
  Third, **Liberty Concerns**. Liberalism traditionally protects the right to withdraw from labor (leisure). Framing participation as obligatory risks paternalism. You must argue that civic duty overrides economic liberty, a hard sell without invoking republican domination theory, which shifts your ground again. Ultimately, these are survivable if you accept broader taxation, but they make the specific case for *inheritance* tax weaker than a general wealth tax.

  What my own side gives up
  You must concede that self-made wealth buys the same exit. To remain consistent, you cannot target inheritance alone; you must support broader wealth taxation or caps on accumulation. You must also concede that "work" isn't the only obligation. If an heir doesn't work but pays high taxes, are they still in the web? If yes, your view supports high wealth taxes, not just estate taxes. If no, you are mandating labor. This shifts your view from "Inheritance Tax" to "Anti-Oligarchy Tax." You cannot have it both ways. This is a significant policy pivot.

  Insulation check
  If you define "opt-out" loosely (e.g., having a safety net), everyone with savings opts out, making the view absurd. If you define it strictly (never working again), it applies to almost no one. To avoid this, you must specify a threshold of wealth that constitutes exit. Without this, the view is unfalsifiable: any heir who works is said to be "still dependent," while any who doesn't is "opted out." This flexibility protects the theory from evidence but renders it vacuous. This is a theoretical vulnerability. The theory becomes immune to critique but loses explanatory power.

  Bottom line
  The view is rhetorically powerful but logically unstable. It avoids the tired equality-of-opportunity frame only by collapsing into a wealth-cap argument or smuggling desert theory back in. It risks unfalsifiability unless you specify what counts as "exit." The core insight holds, but it demands broader taxation than you propose. Consider this warning.
