answer: |-
  **Bottom Line:** Compensate the burden of sharing, never the content of the truth.

  ### The 5-Minute Payment Procedure

  **Step 1: Categorize the Good [OBJECTION: MEANING]**
  *   **Question:** What exactly are you buying?
  *   **Sufficient Answer:** Is it **Labor/Asset** (photos, data retrieval, travel time, copying records) or **Testimony/Access** (quotes, opinions, exclusive interviews, editorial approval)?
  *   **Verdict:**
      *   If **Labor/Asset**: Payment is *prima facie* permissible. Proceed to Step 2.
      *   If **Testimony/Access**: Payment is *prima facie* forbidden. Stop. **Flat No** unless Step 4 offers a workaround (e.g., expenses only).
      *   *Why:* Paying for truth corrupts the meaning of the exchange; it turns evidence into a product.

  **Step 2: Assess Vulnerability [OBJECTION: COERCION]**
  *   **Question:** Is the source desperate enough that "consent" is meaningless, or wealthy enough that payment is a bribe?
  *   **Sufficient Answer:** Can this person afford to say "no" without significant harm (financial, physical, professional)?
  *   **Verdict:**
      *   If **High Vulnerability** (e.g., patient in debt, employee risking job): Payment risks exploitation or inducement. **Handoff to Editor + Legal.** Do not proceed alone.
      *   If **Low Vulnerability**: Proceed to Step 3.
      *   *Why:* Power imbalances make voluntary exchange impossible; better terms might fix this, but often the risk is too high.

  **Step 3: Assess Norm Erosion [OBJECTION: SYSTEMIC]**
  *   **Question:** If every outlet did this tomorrow, would the ecosystem break?
  *   **Sufficient Answer:** Will this create a market where only paying sources speak, or where sources fabricate to earn fees?
  *   **Verdict:**
      *   If **Yes (Market Breaks)**: **Flat No.** (e.g., paying for quotes).
      *   If **No (Standard Practice)**: Proceed to Step 4. (e.g., paying freelancers, reimbursing expenses).
      *   *Why:* Even if fair to this individual, some exchanges destroy the trust required for everyone else.

  **Step 4: Structure the Transfer [GRADIENT CHECK]**
  *   **Question:** Who pays, and how is it labeled?
  *   **Sufficient Answer:**
      *   **Cash for Content:** No. (Violates Step 1).
      *   **Cash for Labor/Loss:** Yes, if market rate. (e.g., fee for photo, reimbursement for records copying).
      *   **Expenses:** Yes, if receipted and necessary. (e.g., train fare to interview).
      *   **Gifts/Hospitality:** No, if value > de minimis. (e.g., flights, hotels).
      *   **Payer:** Outlet or Dedicated Fund preferred. **Never journalist personal funds** (creates personal obligation).
  *   **Verdict:** Finalize terms or **Handoff to Finance** for mechanism.

  ---

  ### Running the Cases

  **Case 1: Rare Disease Patient ($500 for time/records)**
  *   **Step 1 (Meaning):** Interview = Testimony (No Pay). Records = Asset/Labor (Pay Permissible).
  *   **Step 2 (Coercion):** Patient likely vulnerable. $500 may be inducement. **Handoff to Editor.**
  *   **Step 3 (Systemic):** Paying patients for stories creates a market for symptoms. **Risk High.**
  *   **Step 4 (Structure):** You can pay for the *labor* of retrieving records (copying fees, admin time) at a market rate, but not for the interview itself.
  *   **Verdict:** **No to $500 for interview.** Yes to reimbursing actual records costs + travel expenses for her to meet you.
  *   **Reckoning with the Guilt:** You are right that "no pay" protects the newsroom more than the source. To mitigate this without breaking Step 1: Offer non-monetary value (e.g., guaranteeing she sees the medical facts checked before pub, providing her a high-res copy of the piece for her advocacy). You are compensating the *burden* without buying the *truth*.

  **Case 2: Whistleblower (Hospital data, risk of job)**
  *   **Step 1 (Meaning):** Data = Asset (Pay Permissible). Context/Motive = Testimony (No Pay).
  *   **Step 2 (Coercion):** Extreme vulnerability (job loss). Payment looks like hush money or a bounty. **Handoff to Editor + Legal.**
  *   **Step 3 (Systemic):** Paying for leaks encourages theft and compromises anonymity.
  *   **Verdict:** **Flat No on direct cash for data.** If the public interest is vital, explore a **Legal Defense Fund** contribution rather than personal payment. This compensates the *risk* (coercion mitigation) without paying for the *leak* (meaning corruption).

  **Case 3: Lab (Fly out + put up for week)**
  *   **Step 1 (Meaning):** Access = Testimony/Independence (No Pay).
  *   **Step 2 (Coercion):** Lab has power; you are vulnerable. Accepting hospitality creates obligation.
  *   **Step 3 (Systemic):** Creates "pack journalism" where outlets compete for perks rather than truth.
  *   **Step 4 (Structure):** Hospitality > de minimis.
  *   **Verdict:** **Flat No.** Outlet must pay for flight and hotel. Accepting hosted travel compromises independence (Meaning) and creates obligation (Coercion).

  ---

  ### On Existing Newsroom Inconsistencies

  **Photo vs. Quote:** **Defensible.**
  *   *Why:* A photo is a creative product created *for* sale (Labor/Asset). A quote is evidence of reality (Testimony). Buying a photo pays for labor; buying a quote buys influence over truth. The procedure aligns here (Step 1).

  **Lunch vs. Flight:** **Defensible, but often historical.**
  *   *Why:* A lunch is *de minimis* (low value, social norm). A flight is high value (creates debt/obligation). The procedure aligns here (Step 4). However, many newsrooms allow flights for "hard to reach" sources while banning them for others; this is history, not philosophy. The procedure demands consistency: if the source is vulnerable, even lunch is risky; if the source is powerful, even a flight might be negligible. Stick to the *obligation* threshold, not the dollar amount.

  ---

  ### What This Procedure Cannot Handle

  1.  **Cross-Border Illegality:** This procedure assumes US-centric ethics. It cannot assess if a payment violates the Foreign Corrupt Practices Act or local bribery laws. **Handoff: Legal Counsel.**
  2.  **Journalist Profit:** This procedure assumes the outlet pays. It cannot adjudicate cases where *you* profit separately (e.g., book deals based on articles). That is a conflict of interest, not a source payment issue. **Handoff: Editor.**
  3.  **No Price Comparison:** If a source demands $10,000 for unique access and there is no market rate, Step 4 fails. You cannot determine "fair labor cost." **Handoff: Senior Editor + Finance.**
  4.  **The "Fixer" Loophole:** Paying a translator or fixer is standard, but if they funnel cash to a source, Step 1 is violated indirectly. This procedure relies on transparency; it cannot detect laundering. **Handoff: Investigative Editor.**
