answer: |-
  Here is the specification for an adequate theory of politically engaged art based on the Du Boisian problematic, pressure-tested against your candidates and extended to expose structural tensions.

  ### I. The Desiderata

  **1. The Mechanism of Ideological Invisibility**
  *   **Requirement:** The theory must explain how art that serves the status quo is perceived as "neutral" or "pure," while art that challenges the status quo is marked as "propaganda," without conceding that the former is actually apolitical.
  *   **Motivation:** Your asymmetry case. If Du Bois is right that *all* art is propaganda, the theory cannot simply accept the common-sense distinction between political and apolitical art as ontological. It must treat the "apolitical" label as a sociological effect of power (i.e., the dominant ideology does not recognize itself as ideology).
  *   **Status:** **Non-negotiable.** Without this, the theory collapses into the very liberal pluralism Du Bois critiques, admitting that some art *is* neutral and thus undermining the universal claim.

  **2. The Audience Coherence Condition**
  *   **Requirement:** The theory must specify whether a work's political value is determined by its effect on the oppressed community (internal consolidation) or the oppressor class (external persuasion), and provide a rule for resolving conflicts between these aims.
  *   **Motivation:** Your double-audience problem. A play that emboldens a Black audience might terrify or alienate a White audience. If the theory demands both, it risks incoherence. It must prioritize one function or explain the dialectical synthesis.
  *   **Status:** **Non-negotiable.** A theory that demands a work simultaneously satisfy opposing political interests without a hierarchy of value cannot guide production or criticism.

  **3. The Truth-Utility Calibration**
  *   **Requirement:** The theory must establish a hierarchy between *factual/psychological honesty* (depicting the community as it is, including flaws) and *political utility* (depicting the community in a way that maximizes dignity and minimizes racist ammunition).
  *   **Motivation:** Your honesty vs. uplift fight. If a novel truthfully depicts high crime rates within a marginalized community, it may be aesthetically honest but politically damaging. The theory must say which value trumps the other when they diverge.
  *   **Status:** **Non-negotiable.** Avoiding this choice renders the theory useless in moments of crisis (e.g., censorship debates).

  **4. The Aesthetic Surplus Constraint**
  *   **Requirement:** The theory must account for the value of the work *as art* distinct from its value *as a political tool*. It must explain why we need a novel rather than a sociological report or a pamphlet.
  *   **Motivation:** Your art vs. messaging distinction. If "good art" is defined solely as "effective propaganda," the category of aesthetics dissolves into public relations. Du Bois insists on "Beauty" as a co-equal with "Truth" and "Goodness."
  *   **Status:** **Non-negotiable.** Without this, the theory is not a theory of *art*, but of *communication*.

  **5. The Locus of Judgment**
  *   **Requirement:** The theory must identify who possesses the authority to declare a work successful propaganda. Is it the party leadership, the intellectual vanguard, or the mass audience?
  *   **Motivation:** Your accountability question. If the artist answers to the editor, we have elitism; if to the masses, we have populism. The theory must locate the critic.
  *   **Status:** **Prejudice of one camp.** (Vanguardism vs. Democratic Culturalism). A coherent theory can be built on either, but it must choose.

  **6. The Scope Boundary**
  *   **Requirement:** The theory must declare whether its claims are transhistorical (all art in all times is propaganda) or situational (art under conditions of racial capitalism is propaganda).
  *   **Motivation:** Your scope question. If the claim is universal, it must explain pre-political art or art in a post-revolutionary society. If situational, it limits Du Bois's philosophical reach.
  *   **Status:** **Prejudice of one camp.** (Universalist vs. Historicist).

  ---

  ### II. The Fatal Tensions (Incompatibilities)

  You suspected the honesty and effectiveness requirements pull against each other. The specification confirms this, but reveals a deeper, structural contradiction that threatens to make the position self-undermining.

  **1. The Truth-Utility vs. Aesthetic Surplus Conflict**
  These two requirements cannot be jointly satisfied without residue.
  *   **Reasoning:** The *Aesthetic Surplus Constraint* demands that the art have value beyond its political function (e.g., ambiguity, complexity, formal beauty that resists easy consumption). However, the *Truth-Utility Calibration* demands that the work serve a specific political end (e.g., uplift, mobilization).
  *   **The Contradiction:** If political utility is the *telos* of the work (as Du Bois's "all art is propaganda" suggests), then aesthetic complexity is only valuable *insofar as* it serves that utility. But if aesthetic complexity is subordinate to utility, it is not truly "surplus"; it is instrumental. If it is instrumental, the *Aesthetic Surplus Constraint* is violated.
  *   **Result:** The theory must either admit that "Beauty" is merely a more sophisticated form of messaging (collapsing Req 4) or admit that true Art sometimes fails at Propaganda (weakening the universal claim of Req 1).

  **2. The Universalist Self-Undermining**
  The claim that "All art is propaganda" (Req 1) removes the normative ground for criticizing *bad* political art.
  *   **Reasoning:** If all art is propaganda, then "apolitical art" is simply "propaganda for the status quo." To criticize it, you must argue it is *bad* propaganda or *immoral* propaganda. But if the theory defines the value of art by its political engagement, you lose the external ethical standpoint to judge *which* politics are good, unless you import a moral framework external to the aesthetics.
  *   **Result:** Du Bois tries to solve this with "Goodness," but if "Goodness" is defined by the political struggle, the argument becomes circular: Art is good if it serves the struggle; the struggle is good because it produces good art. The theory requires an external ethical anchor it claims to generate internally.

  ---

  ### III. The Exclusionary Requirement

  The single requirement that does the most to exclude candidate views is **The Aesthetic Surplus Constraint (Req 4).**

  *   **Why:** Most theories of political art fall into two camps: **Instrumentalism** (art is a weapon; value = effectiveness) or **Autonomism** (art is a sanctuary; value = distance from politics).
  *   **Exclusion:**
      *   It excludes **Socialist Realism/Stalinist models**: These typically subordinate aesthetics entirely to messaging, failing the surplus test.
      *   It excludes **Liberal Formalism**: This claims art is valuable precisely because it *lacks* political purpose, failing the universal propaganda test.
      *   It excludes **Cynical Postmodernism**: This often argues that any claim to "Beauty" is merely a mask for power, denying the possibility of a non-instrumental aesthetic value.
  *   **Significance:** Demanding that a work be *fully* politically committed yet *irreducibly* aesthetically valuable is the hardest philosophical needle to thread. It forces the theory to explain how form itself can be political without being reducible to content.

  ---

  ### IV. Evaluation of Du Bois's Position

  Du Bois's own position, primarily articulated in "Criteria of Negro Art" (1926) and his editorial tenure at *The Crisis*, meets the specification unevenly.

  **Where it Meets the Specification:**
  *   **Ideological Invisibility (Req 1):** Du Bois excels here. He successfully argues that white art which ignores race is not "neutral" but actively constructs a world where Black suffering is invisible. He unmasks the "purist" as a defender of the status quo.
  *   **Locus of Judgment (Req 5):** He is consistent, if controversial. He places authority with the "Talented Tenth"—the Black intellectual vanguard (editors, critics) who understand the long-term political strategy better than the masses or the individualist artist.

  **Where it Fails the Specification:**
  *   **Truth-Utility Calibration (Req 3):** Du Bois fails to resolve this without contradiction. In practice, he prioritizes **Utility (Uplift)** over **Truth (Honesty)**. His attacks on Wallace Thurman, Claude McKay, and Langston Hughes for depicting Black life "too negatively" reveal that when Truth conflicts with Uplift, Truth must be suppressed. This violates the integrity of the "Truth" pillar he claims is essential to Art.
  *   **Aesthetic Surplus (Req 4):** Du Bois asserts that Art must be Beautiful, but he cannot define Beauty independently of Goodness. In his framework, a work that is politically "bad" (harmful to the cause) effectively cannot be aesthetically "good." This collapses the distinction he claims to protect. He wants the *benefit* of the Aesthetic Surplus (the power of art to move people) without accepting the *risk* (that art might move people in ways the vanguard cannot control).

  **Conclusion on the Theory:**
  The specification reveals that a Du Boisian theory of art is stable only if it accepts a **Vanguardist Prejudice (Req 5)** to resolve the **Truth-Utility Conflict (Req 3)**. Without an authority to decide when Truth must be sacrificed for Utility, the theory tears itself apart. Du Bois provides the authority, but in doing so, he compromises the claim that the art is truly "free" or "beautiful" in a sense distinct from its political obedience. The theory works as a strategy for liberation, but it fails as a general aesthetics because it cannot account for the value of art that resists its own political utility.
