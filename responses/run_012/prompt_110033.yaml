      5.  **The Locus of Judgment:** Who decides success? (Prejudice of one camp - Vanguard vs. Masses).
      6.  **The Scope Boundary:** Universal vs. Situational. (Prejudice of one camp).

      *Incompatibility:* Truth/Utility vs. Aesthetic Residue. If Utility rules, Residue is compromised.
