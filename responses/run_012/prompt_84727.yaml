prompt: |-
  ok so i'm in this weird cross-listed course (half econ, half phil of bio) on cooperation and conflict, and we've spent like five weeks on the prisoner's delimma — one-shot, iterated, noisy, tournaments, the whole thing — and now for the final I have to hand in a "which explanation of cooperation do you actually believe?" flowchart, more of a sorting instrument than an essay. I want to do it properly, and the thing I can't stand about the standard treatments is that they're just a list of the same five mechanisms everybody already has memorized, so the whole exercise is pointless. So the tree has to be diagnostic: start from the one thing everyone in the class agrees on (cooperation happens, and in a genuinely one-shot anonymous PD defecting looks like the safe play), and then every branch node is a question a person can answer without knowing any of the jargon, so they arrive at a position by answering rather than by picking the label they like. My prof handed us a two-question grid to hang the thing on and I want to actually use it: first, does your explanation change the game (payoffs, information, repetition, reputation, who's watching) or change the players (their preferences, their decision procedure, who counts as a "them")? Second, does your view treat defecting in a genuinely one-shot anonymous PD as a mistake — the agent got something wrong — or as simply the correct thing to do, with cooperation being something you have to engineer around that fact? Every leaf gets tagged with where it lands on that grid, and I want the whole space covered, not just the two cells I happen to like.

  I also want at least three of the nodes to be concrete cases instead of abstractions, roughly: you're playing against something that has already read your policy or source code and you know it; you're playing a one-shot game against someone you'll keep running into socially forever but will never play the game with again; and a case with no minds in it at all, genes or bacteria or fig-wasps, where nobody decides anything. And the tree needs to be able to reach all of these leaves, whatever you end up calling them: the "we're in symmetric situations, so the same reasoning applies to both of us and we should both just do the cooperative thing" move; team reasoning where the thing that's choosing is the pair rather than the individual; reputation and indirect reciprocity, i.e. denying the game was ever really one-shot; the person who punishes defectors at a cost to themselves; cultural group selection; kin selection; the code-visibility case above; and the view that the one-shot anonymous PD is a degenerate case where the word cooperation doesn't even apply, so calling defection a mistake is just a category error. Add whatever else you think is missing but please don't pad it — I'd much rather have eight or nine real leaves than fifteen. Where it gets interesting: some cells of that grid might just be empty and I want to know which and why (is nobody there because the position is incoherent, because it's coherent but nobody would want it, or because it's simply never been explored?), and I want you to flag any two leaves your questions genuinely can't separate instead of pretending the tree does more than it does.

