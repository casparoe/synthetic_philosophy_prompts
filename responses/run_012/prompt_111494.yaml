answer: |-
  There is no single, canonical noun in the history of philosophy or political theory that names this specific argumentative shape. You have identified a structural dynamic that is widely recognized by specialists in Scholasticism, Just War Theory, and Political Theology, but it is usually described rather than labeled. Scholars tend to speak of it in phrases: "theoretical right without practical remedy," "the paradox of resistance," or "the institutional gap."

  However, because you are looking for the "carving" of the concept—a precise tool for a novelist to wield—I will offer the nearest established concepts, explain why they fall short, and then propose a term that fits the specific nuance you have described.

  ### 1. The Nearest Established Concepts

  **A. The *Distinctio* (Scholastic Distinction)**
  The method Aquinas uses is the *distinctio*. Scholastics would divide a concept (tyranny) into species (usurper vs. legitimate ruler in exercise) to resolve a contradiction.
  *   **Why it fits:** It explains the *mechanism* of the argument.
  *   **Why it falls short:** It names the tool, not the effect. A *distinctio* can clarify anything; it does not inherently imply that the result is inoperative.

  **B. *Jus ad Bellum* Criteria (Just War Theory)**
  Tyrannicide was often treated as a subset of Just War. The structure is identical: a right to violence is granted, but hedged by cumulative conditions (just cause, right intention, proper authority, last resort, proportionality, probability of success).
  *   **Why it fits:** It captures the "individually sensible conditions" that collectively preclude action.
  *   **Why it falls short:** Just War Theory is often intended to *limit* war, not necessarily to nullify the right entirely. Your observation is about a permission that is *effectively* nullified while remaining *theoretically* open.

  **C. The "Exception that Swallows the Rule"**
  This legal maxim describes a proviso so broad it negates the statute.
  *   **Why it fits:** It captures the logical outcome.
  *   **Why it falls short:** It implies a drafting error or a loophole. Your observation is that this is a *feature*, not a bug—a sincere moral architecture designed to balance radical theory with conservative practice.

  **D. Symbolic Concession / Safety Valve**
  In sociology and political science, this describes a right granted to diffuse tension without transferring power.
  *   **Why it fits:** It captures the *function* (securing rhetorical advantage while counseling submission).
  *   **Why it falls short:** It implies cynicism or hypocrisy. As you noted, Aquinas is not being hypocritical; he sincerely believes the conditions are morally necessary. "Symbolic Concession" suggests the grantor knows the right is fake. In your pattern, the grantor believes the right is real, even if unreachable.

  ### 2. A Proposed Term: "The Inoperative License"

  Since no established term captures the sincerity of the permission alongside its practical nullity, I propose the term **The Inoperative License** (or **The Inoperative Exception**).

  **Definition:**
  An *Inoperative License* is a moral or legal permission that is theoretically valid but structurally precluded from enactment by a cumulative set of conditions. Unlike a prohibition, it remains open in principle; unlike a functional right, it lacks a constitutive path to execution. It functions not as a guide to action, but as a boundary of judgment.

  **Why this term works for your purpose:**
  *   **"License"** affirms the permission is real (it is not a sham).
  *   **"Inoperative"** (a term used in philosophy by Agamben and Nancy, though in different contexts) suggests a potentiality that does not actualize. It captures the state of being "on the books" but "off the table."
  *   It distinguishes the *shape* from the *intent*. One can have an Inoperative License without hypocrisy.

  ### 3. Alternative Coinage: "Doctrinal Containment"

  If you prefer a term that names the *strategy* rather than the permission itself, use **Doctrinal Containment**.

  **Definition:**
  *Doctrinal Containment* is the argumentative strategy of granting a radical principle while surrounding it with procedural or moral conditions that restrict its application to vanishingly rare cases. It contains the revolutionary potential of a doctrine within a conservative framework.

  ### 4. The Edges of the Phenomenon (What It Is Not)

  To help you "carve" this in your narrative, here is how the *Inoperative License* distinguishes itself from neighboring concepts:

  *   **It is not Hypocrisy:** Hypocrisy requires the grantor to believe the permission is false. In an Inoperative License, the grantor believes the permission is *true*, but believes the *circumstances* for its use are almost never met. The sincerity lies in the conditions, not the outcome.
  *   **It is not a "Dead Letter":** A dead letter is a law that is ignored. An Inoperative License is actively cited to *prevent* action. It is alive precisely to say "no."
  *   **It is not Absolutism:** An absolutist says, "Thou shalt not kill a tyrant." The Inoperative License says, "Thou mayest, provided..." The moral weight is shifted from the *act* to the *conditions*.
  *   **It is not "The Lesser Evil":** The Lesser Evil justifies a bad act to prevent a worse one. The Inoperative License argues that the *remedy* itself risks becoming the worse evil (e.g., killing the tyrant invites a worse successor).

  ### 5. Application to Your Novel

  For a novelist, the dramatic tension of the *Inoperative License* lies in the gap between the **theoretical open door** and the **practical wall**.

  *   **The Character who cites the License:** May appear wise and morally serious (acknowledging the right) but ultimately conservative (counseling endurance). They hold the "key" to the door, but the key is kept in a room that is locked.
  *   **The Character who challenges the License:** May appear radical, but risks exposing themselves as reckless (ignoring the conditions of "proper authority" or "probability of success").
  *   **The Tragedy:** The structure ensures that by the time the conditions are met (no superior to appeal to, certainty of improvement), the agent capable of acting (public authority) is usually the one that has collapsed, leaving only private persons who are forbidden to act.

  **Summary for your notes:**
  *   **Concept:** A permission rendered practically null by cumulative conditions.
  *   **Proposed Name:** The Inoperative License.
  *   **Strategy Name:** Doctrinal Containment.
  *   **Historical Analog:** Aquinas on Tyrannicide; later, Locke's "Appeal to Heaven" (which similarly places the remedy outside civil society).
  *   **Key Distinction:** It is sincere, not hypocritical; it is a barrier of *prudence*, not *principle*.

  This structure allows a thinker to say, "I am not a tyrant's apologist; I allow for his death," while simultaneously ensuring the tyrant remains safe. It is the moral equivalent of a castle with a drawbridge that is theoretically down, but accessible only by a path that has been washed away.
