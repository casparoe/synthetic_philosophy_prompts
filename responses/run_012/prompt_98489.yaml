  **The Task**
  The patient is seated before a neutral object (e.g., a wooden box) placed in the center of their visual field.
  1.  **Visual Input:** Because the splenium is intact, visual information from both hemifields crosses freely. Both hemispheres receive identical visual data about the box's location and appearance.
