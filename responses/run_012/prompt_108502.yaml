prompt: |-
  I run the two-person estimates shop for a mid-sized city's capital program: we produce the cost and schedule numbers that go into the budget for road rebuilds, HVAC replacements, a new permitting database, park renovations, that kind of thing. Twenty-odd estimates a year, a couple of hours each, no stats training on the team and theres no data science group I can hand it to, and the numbers go to a council committee, so being off by half is a public fight. I keep reading that we're supposed to use the outside view rather than the inside view, but every time I try to actually do it I stall out: which reference class, how many cases does it need before it's worth anything, what do I do when there's no precedent at all, and when am I allowed to say yeah but this one's different? Act as an expert on forecasting and decision science who has also read the people who think the outside view is oversold — brainstorm a bit first about where the real difficulties are, then write me a procedure my team can actually run: the steps in order, what counts as a good enough answer at each one, where it stops and just tells me I don't know, and where it hands off to a human call. It has to handle two cases in particular — a job we've done essentially the same way three times before, where the inside story feels very solid, and the first large software system the city has ever bought, where there's genuinely nothing to look back at — plus one where the base rate is going to tell me something I really don't want to hear. Also settle a fight we keep having: do I start from the base rate and adjust, or average the base rate and the inside estimate? And how do I use the fact that most people who say this one's different turn out to be wrong? Be straight with me at the end about what the procedure can't do.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **Role:** Manager of a two-person estimates shop for a mid-sized city's capital program.
      *   **Task:** Produce cost and schedule estimates for budget approval (roads, HVAC, software, parks).
      *   **Volume:** ~20 estimates/year, ~2 hours each.
      *   **Constraints:** No stats training, no data science support, high stakes (public scrutiny if off by 50%).
      *   **Problem:** Knows about "Outside View" (reference class forecasting) vs. "Inside View" (specific details), but struggles with implementation (reference class selection, sample size, unique cases, adjustment bias).
      *   **Specific Requests:**
          *   Brainstorm difficulties (acknowledging critics of the outside view).
          *   Create a usable procedure (steps, stopping rules, human handoffs).
          *   Handle three specific cases: Repeat job (strong inside view), First large software (no precedent), Unpleasant base rate.
          *   Settle the "Start from base vs. Average" debate.
          *   Address the "This one is different" bias.
          *   Be honest about limitations at the end.

  2.  **Deconstruct the "Outside View" Problem (Brainstorming & Critique):**
      *   *The Theory:* Kahneman/Lovallo/Tversky say Inside View = Bias/Overconfidence. Outside View = Base Rates = Reality.
      *   *The Critique:* Gigerenzer, Tetlock, others argue base rates can be misleading if the reference class is wrong. "Reference Class Tennis" (choosing the class that gives the answer you want).
      *   *The User's Reality:* 2 hours per estimate. They can't build complex regression models. They need heuristics.
      *   *Key Tension:* How to balance specific knowledge (we know *this* road has bad soil) with statistical reality (most road projects overrun).
      *   *The "Different" Bias:* People *always* think they are different. Most are wrong. But sometimes they *are* right. How to distinguish?

  3.  **Develop the Procedure (The "2-Hour Protocol"):**
      *   Needs to be linear, actionable, and time-boxed.
      *   *Step 1: Define the Question.* (Cost? Schedule? Both?)
      *   *Step 2: Find the Reference Class.* (The hardest part). Needs rules for "good enough."
      *   *Step 3: Calculate the Base Rate.* (Mean? Median? P80?)
      *   *Step 4: The Inside View Check.* (Specific risks).
      *   *Step 5: Integration.* (The "Start vs. Average" debate).
      *   *Step 6: The "Different" Test.* (Pre-mortem/Red Team).
      *   *Step 7: Final Call/Uncertainty Flag.*

  4.  **Address Specific Cases:**
      *   *Case A (Repeat Job):* Strong reference class exists. Inside view should only adjust for *known* deviations, not optimism.
      *   *Case B (New Software):* No local history. Need external reference class (other cities, industry standards). High uncertainty flag.
      *   *Case C (Unpleasant Base Rate):* Base rate says \$10M, Inside says \$5M. Trust the base rate unless there is *hard* evidence, not just hope.

  5.  **Settle the Debate (Start vs. Average):**
      *   *Consensus:* Start from the Base Rate (Outside View). The Inside View is naturally optimistic. Averaging gives too much weight to the optimism.
      *   *Nuance:* Adjust *away* from the base rate only with specific, evidenced reasons.

  6.  **Address the "This One is Different" Bias:**
      *   Treat the claim "this is different" as a hypothesis that must be proven, not an assumption.
      *   Require "Hard Evidence" vs. "Soft Story."

  7.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the pressure. Validate the struggle (Reference Class Tennis is real).
      *   **Brainstorming the Difficulties:** Why is this hard? (Data scarcity, definition gaming, the "unique" trap). Acknowledge critics (Gigerenzer: simple heuristics > complex stats in low data).
      *   **The Procedure (The "Capital Estimate Protocol"):**
          *   Timebox it (fit the 2-hour window).
          *   Step 1: The Bucket (Reference Class). Rule of thumb: 5-10 similar projects.
          *   Step 2: The Number (Base Rate). Use P80 (80th percentile) for budget to avoid public fights.
          *   Step 3: The Story (Inside View). List specific deviations.
          *   Step 4: The Integration (The Formula). Start Outside, adjust Inside.
          *   Step 5: The "Different" Test. Evidence required.
          *   Step 6: The Stop Rule. When to say "No Data."
      *   **Handling the Three Cases:** Walk through how the protocol applies to the Road, the Software, and the Unpleasant Truth.
      *   **Settling the Debate:** Be firm. Start Outside. Average only if Inside View is *conservative* (rare).
      *   **The "Different" Claim:** The "Evidence Burden."
      *   **Limitations:** What this won't fix (Political pressure, Black Swans, Garbage Data).

  8.  **Refining the Tone:**
      *   Professional, direct, empathetic to the constraints.
      *   No jargon without explanation.
      *   Action-oriented.
      *   Acknowledge the political reality (Council committees hate surprises).

  9.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is asking for P80 too hard for them?
      *   *Fix:* Explain how to approximate P80 with small data (take the average of the top 20% or just add a buffer). Let's suggest a simple buffer percentage based on past variance if distribution isn't clear. Actually, for 20 estimates/year, they probably have a spreadsheet. Let's suggest using the *median* of past overruns as a baseline buffer.
      *   *Critique:* Is "Start from Base" too rigid?
      *   *Fix:* Acknowledge that if the Inside View is *lower* cost due to specific scope reduction, that's valid. But if it's lower due to "efficiency," reject it.
      *   *Critique:* Software case is tricky.
      *   *Fix:* Emphasize *external* benchmarks (industry reports, other cities) since internal data is null.

  10. **Final Polish:** Check against all prompt requirements. (Brainstorm first? Yes. Procedure? Yes. 3 Cases? Yes. Debate settled? Yes. Limitations? Yes.)

  *(Self-Correction on the "Start vs. Average" debate)*: Research generally supports starting with the base rate. Averaging implies the inside view is equally reliable, which cognitive science says it isn't (planning fallacy). I will advise starting with the base rate and treating the inside view as a *risk adjustment* only.

  *(Self-Correction on "Reference Class Tennis")*: I need to explicitly tell them how to pick the class without gaming it. Rule: "Broadest category that shares the same *cost drivers*."

  *(Final check on tone)*: Ensure I don't sound like an academic. Sound like a senior practitioner talking to a peer.

  11. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  This is a classic forecasting trap. You are stuck between the *Planning Fallacy* (the inside view, where everything goes right) and *Reference Class Tennis* (the outside view, where you pick whichever statistics make you look good).

  You have 2 hours per estimate. You do not have time for Bayesian updating or regression analysis. You need a heuristic that protects you from public embarrassment without paralyzing your workflow.

  Here is the breakdown of the difficulties, the procedure, the specific cases, and the hard truths.

  ### Part 1: Brainstorming the Difficulties
  You are stalling because the textbook definition of the "Outside View" assumes data richness you don't have. Here is where the friction actually lives:

  1.  **Reference Class Tennis:** As you noted, you can define the class broadly ("Construction") to get a safe number, or narrowly ("Main St. Repave 2023") to get a precise number. Critics like Gerd Gigerenzer argue that in low-data environments, simple heuristics beat complex statistical classes. If you only have 3 past road projects, is that a "class" or just "anecdotes"?
  2.  **The "Unique" Trap:** Every project manager believes their project is unique. Statistically, they are usually wrong about the *cost drivers* (soil conditions, permit delays, scope creep) even if the *engineering* is unique.
  3.  **The Integration Problem:** If the Base Rate says \$1M and your Inside View says \$500k, averaging them (\$750k) feels like a compromise, but it's mathematically cowardly. It gives equal weight to a bias (inside) and a statistic (outside).
  4.  **Data Scarcity:** With 20 estimates a year, you might not have 20 *comparable* projects. If $N < 5$, the base rate is noise.

  ### Part 2: The "Capital Estimate Protocol" (2-Hour Version)
  This procedure is designed to fit your time budget and protect your political flank.

  **Step 1: The Bucket (15 Minutes)**
  *   **Action:** Define the Reference Class.
  *   **Rule:** Do not look for "identical." Look for "same cost drivers."
      *   *Roads:* Cost drivers are length, width, underground utilities, soil.
      *   *Software:* Cost drivers are users, integrations, customization level.
  *   **Good Enough Answer:** You need at least **5 past projects** that share the primary cost driver.
  *   **Stop Rule:** If you cannot find 5 internal projects, you must go external (industry standards, other cities, vendor benchmarks). If you cannot find 5 external benchmarks, flag as **High Uncertainty**.

  **Step 2: The Base Number (30 Minutes)**
  *   **Action:** Calculate the historical outcome, not the historical budget.
  *   **Rule:** Do not use the *average*. Use the **P80 (80th Percentile)** of past actual costs.
      *   *Why:* Council committees hate surprises. If you budget the average, you will be over budget 50% of the time. If you budget the P80, you are safe 80% of the time.
      *   *Small Data Hack:* If you only have 5-10 projects, take the **highest cost** of the past 3 similar projects. That is your proxy for P80.
  *   **Good Enough Answer:** A single dollar figure derived from past *actuals*.

  **Step 3: The Inside Story (45 Minutes)**
  *   **Action:** Build your bottom-up estimate (materials, labor, hours).
  *   **Rule:** This is not for the final number yet. This is for **Variance Identification**.
  *   **Task:** List every reason this project is *more expensive* or *cheaper* than the Base Number.
  *   **Good Enough Answer:** A list of specific deviations (e.g., "Soil report shows rock," or "Vendor offers fixed-price contract").

  **Step 4: The Integration (15 Minutes)**
  *   **Action:** Reconcile Step 2 and Step 3.
  *   **Rule:** **Start with the Base Number (Step 2).** Adjust *only* for evidenced deviations from Step 3.
  *   **The Debate Settled:** **Do not average.** Start from the Outside View. The Inside View is inherently optimistic (the Planning Fallacy). Averaging validates the optimism. You only move *away* from the base rate if you have hard evidence (e.g., "This road is 20% shorter than the reference class average").
  *   **Good Enough Answer:** Base Rate + Evidence Adjustments = Final Estimate.

  **Step 5: The "Different" Test (15 Minutes)**
  *   **Action:** Challenge the claim that "This one is different."
  *   **Rule:** The **Evidence Burden**.
      *   *Soft Story:* "We have a better project manager this time." (Reject. Ignore.)
      *   *Soft Story:* "The technology is newer." (Reject. New tech usually means more bugs/cost.)
      *   *Hard Evidence:* "The scope is legally capped at X." (Accept.)
      *   *Hard Evidence:* "We have a fixed-price contract with penalty clauses." (Accept.)
  *   **Good Enough Answer:** If you cannot produce Hard Evidence for why you beat the base rate, you must revert to the Base Rate.

  **Step 6: The Handoff (Remaining Time)**
  *   **Action:** Document the uncertainty.
  *   **Rule:** If Step 1 failed (no reference class), or Step 5 failed (strong inside view but no hard evidence), you must attach a **Risk Range**.
  *   **Good Enough Answer:** "Base Estimate: \$1M. Risk Range: \$800k - \$1.5M."

  ---

  ### Part 3: Handling Your Three Specific Cases

  #### Case 1: The Repeat Job (Road Rebuild #4)
  *   **Situation:** You've done this three times. Inside view feels solid.
  *   **Protocol Application:**
      *   **Reference Class:** Strong. Use the 3 past projects + 2 similar nearby roads.
      *   **Base Rate:** Take the highest cost of the last 3.
      *   **Inside View:** You know the crew, the soil, the vendors.
      *   **Integration:** Start with the Base Rate. If the Inside View is lower, ask for **Hard Evidence**. Is the scope identical? If yes, trust the Base Rate. Past performance is the best predictor.
      *   **Verdict:** If your Inside View is 20% lower than the last three projects without a scope reduction, **you are wrong.** Submit the Base Rate. The "solid feeling" is familiarity bias.

  #### Case 2: The First Large Software System
  *   **Situation:** No internal precedent.
  *   **Protocol Application:**
      *   **Reference Class:** Internal data is null. You must go External. Look at Gartner reports, state procurement data, or ask peer cities.
      *   **Base Rate:** Industry standard cost per user or per module.
      *   **Inside View:** Vendor quotes. (Note: Vendor quotes are Inside View optimism).
      *   **Integration:** Vendor quotes are almost always low. Apply a "First-of-Type" multiplier. Industry standard for first major gov IT implementation is often +50% over quote.
      *   **Verdict:** This is a **High Uncertainty** flag. Submit the External Base Rate + 50%. Tell the committee: "We have no internal history; this number includes a risk premium for being the first."

  #### Case 3: The Unpleasant Base Rate
  *   **Situation:** Base Rate says \$10M. Inside View says \$5M. You don't want to ask for \$10M.
  *   **Protocol Application:**
      *   **The Trap:** You want to average to \$7.5M to make the budget palatable.
      *   **The Fix:** Do not average. Look at Step 5 (The "Different" Test). Why does your Inside View say \$5M?
          *   Is it because you assume no delays? (Reject).
          *   Is it because you assume no change orders? (Reject).
      *   **Verdict:** Submit the \$10M. If the council rejects it, **document that the estimate was reduced under directive.** Do not put your name on a \$5M estimate you know is statistically unsound. It is better to be the messenger who brought the bad news than the estimator who lied.

  ---

  ### Part 4: Settling the Fights

  **Fight 1: Start from Base vs. Average?**
  *   **Decision:** **Start from the Base.**
  *   **Reasoning:** The Inside View is subject to the Planning Fallacy (optimism bias). The Outside View is subject to Reference Class errors. Optimism bias is more consistent and dangerous than classification errors.
  *   **Exception:** You may average *only* if your Inside View is *conservative* (e.g., you intentionally padded the inside numbers). If your inside numbers are "best case," averaging them validates the bias.

  **Fight 2: "But This One Is Different"**
  *   **Decision:** Treat this claim as **Guilty Until Proven Innocent.**
  *   **Reasoning:** In 90% of cases, "different" means "we haven't thought about the risks yet."
  *   **Procedure:** Require the "Evidence Burden" from Step 5.
      *   *Claim:* "We have a new project manager." -> *Response:* "Show me data where new PMs reduced costs by >10%." (They can't).
      *   *Claim:* "We are using a new contracting method." -> *Response:* "Show me the clause that prevents cost overruns."
  *   **Rule of Thumb:** If the reason "this is different" relies on human behavior (effort, focus, cooperation), ignore it. If it relies on physical constraints (scope reduced, fixed price contract), consider it.

  ---

  ### Part 5: What This Procedure Cannot Do (The Straight Talk)

  I need to be honest about the limitations so you don't get blindsided.

  1.  **It Cannot Fix Garbage Data:** If your past project records don't track *actual* final costs (including change orders and overtime), your Base Rate is a lie. You need to audit your historical data first. If your history says "Project finished on budget" but everyone knows it went 2 years over, your Outside View is broken.
  2.  **It Cannot Predict Black Swans:** A pandemic, a supply chain collapse, or a new federal mandate will break any reference class. This is why Step 6 (Risk Range) is vital. Never give a single number without a range attached for the committee.
  3.  **It Cannot Save You from Politics:** If the Council *needs* the number to be \$5M to pass the bond, they will pressure you. This protocol gives you the armor to say, "Here is the statistical reality," but it doesn't stop them from overruling you. **Make sure your written estimate explicitly states: "This estimate assumes no scope changes and standard soil conditions."**
  4.  **It Won't Work for True Innovation:** If you are building something the city has literally never done (e.g., a geothermal grid), there is no reference class. In that case, admit "No Data" and switch to a **Phase 1 Discovery Budget**. Estimate the cost to *design* the project, not to *build* it.

  **Final Advice:**
  Your goal is not accuracy (which is impossible); your goal is **calibration**. If you say P80, you should be over budget 20% of the time. Track your own estimates. If you are over budget 50% of the time, your P80 is actually your P50. Adjust your multiplier.

  Start using the "Highest of Last 3" rule tomorrow. It's ugly, but it will keep you out of the public fight.
