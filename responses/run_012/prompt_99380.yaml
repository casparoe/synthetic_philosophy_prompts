answer: |-
  ### 1. Exam Question

  **Course:** Graduate Seminar in Imprecise Probability and Decision
  **Section:** B (Structured Essay)
  **Time Allowed:** 40 Minutes
  **Total Marks:** 20

  **Question 1**

  Consider a finite outcome space defined by two binary events, $A$ and $B$. Let $\mathcal{M}$ be a credal set (a set of probability distributions) defined as the convex hull of two precise distributions, $P_1$ and $P_2$. The probabilities assigned to the joint outcomes $(A, B)$ are given below:

  | Outcome $(A, B)$ | $P_1$ | $P_2$ |
  | :--- | :--- | :--- |
  | $(1, 1)$ | 0.05 | 0.45 |
  | $(1, 0)$ | 0.35 | 0.15 |
  | $(0, 1)$ | 0.45 | 0.05 |
  | $(0, 0)$ | 0.15 | 0.35 |

  **Definitions:**
  *   **Prior Range:** For an event $E$, the interval $[\inf_{P \in \mathcal{M}} P(E), \sup_{P \in \mathcal{M}} P(E)]$.
  *   **Dilation:** An event $B$ (with $P(B)>0$ for all $P \in \mathcal{M}$) *dilates* $A$ if the set of conditional probabilities $\{P(A|B) : P \in \mathcal{M}\}$ forms an interval that strictly contains the prior range of $A$.
  *   **Uniform Dilation:** Dilation is *uniform* across a partition if every cell in the partition dilates $A$.

  **Answer the following:**

  **(a)** Calculate the prior range of $A$ and the posterior ranges of $A$ given $B=1$ and $B=0$. State precisely whether dilation occurs and whether it is uniform across the partition $\{B=1, B=0\}$. **(4 marks)**

  **(b)** Explain why this phenomenon is impossible for a single precise probability distribution. Name the specific probabilistic property that prevents dilation in the precise case. **(4 marks)**

  **(c)** Assess what this example implies about the coherence of imprecise probability. Does dilation demonstrate that imprecise probability is an incoherent representation of belief? In your answer, distinguish between imprecision as a feature of an agent's representational state versus a set of possible objective distributions. **(4 marks)**

  **(d)** A critic argues that dilation is merely an artifact of using a "sparse" or non-convex credal set. Given the definition of $\mathcal{M}$ above, evaluate this objection. Does requiring $\mathcal{M}$ to be convex remove the phenomenon? **(4 marks)**

  **(e)** State the consequence of dilation for a decision maker who must choose among acts whose payoffs depend on $A$ *after* observing $B$. How does this contrast with the standard Bayesian value of information? **(4 marks)**

  ***

  ### 2. Model Answer

  **(a) Calculation and Definition**
  To find the prior range of $A$, we sum the marginal probabilities for $A=1$ under each distribution.
  For $P_1$: $P_1(A=1) = 0.05 + 0.35 = 0.40$.
  For $P_2$: $P_2(A=1) = 0.45 + 0.15 = 0.60$.
  Since $\mathcal{M}$ is the convex hull, the prior range is the interval $[0.4, 0.6]$.

  Next, we calculate the posterior ranges. Note that for both $P_1$ and $P_2$, $P(B=1) = 0.5$ and $P(B=0) = 0.5$.
  Given $B=1$:
  $P_1(A=1|B=1) = 0.05 / 0.5 = 0.1$.
  $P_2(A=1|B=1) = 0.45 / 0.5 = 0.9$.
  Posterior range is $[0.1, 0.9]$.
  Given $B=0$:
  $P_1(A=1|B=0) = 0.35 / 0.5 = 0.7$.
  $P_2(A=1|B=0) = 0.15 / 0.5 = 0.3$.
  Posterior range is $[0.3, 0.7]$.

  Dilation occurs because the prior range $[0.4, 0.6]$ is strictly contained within the posterior range for $B=1$ ($[0.1, 0.9]$) and strictly contained within the posterior range for $B=0$ ($[0.3, 0.7]$). Since strict containment holds for both cells of the partition, the dilation is uniform.

  **(b) Precise Probability Contrast**
  Dilation is impossible for a single precise distribution due to the **Law of Total Probability** (or the martingale property of conditional expectation). For a precise $P$, $P(A) = P(A|B)P(B) + P(A|B^c)P(B^c)$. The prior probability $P(A)$ is a weighted average of the posterior probabilities. A weighted average cannot be strictly smaller than the minimum of its components and strictly larger than the maximum of its components simultaneously. Therefore, the prior must lie within the convex hull of the posteriors; it cannot be strictly contained within *every* posterior interval unless the posteriors equal the prior (no learning).

  **(c) Coherence and Representation**
  This example does not show that imprecise probability is incoherent. Coherence in this context refers to avoiding sure loss (Dutch Books), which credal sets satisfy if every member distribution is coherent. Dilation highlights a distinction in interpretation. If one views $\mathcal{M}$ as representing a set of possible *objective* distributions (aleatory uncertainty), dilation seems paradoxical—how does data increase uncertainty? However, if $\mathcal{M}$ represents an agent's *epistemic* state (representational imprecision), dilation is rational. It reflects that the agent knows the marginal of $A$ reasonably well but is ignorant about the correlation between $A$ and $B$. Observing $B$ reveals that the correlation could be strong in either direction, widening the range of plausible probabilities for $A$. Thus, dilation is a feature of representing ignorance, not a bug of incoherence.

  **(d) Convexity and Sparsity**
  The objection that dilation arises from non-convexity is false in this instance. The problem definition explicitly states that $\mathcal{M}$ is the **convex hull** of $P_1$ and $P_2$. By definition, this set is convex. Since we demonstrated in part (a) that dilation occurs in this convex set, convexity is insufficient to prevent dilation. The phenomenon arises from the structure of the dependence between events within the set, not from the set failing to be convex. While sparse sets can exhibit dilation, requiring convexity does not remove the phenomenon.

  **(e) Decision Consequences**
  For a decision maker maximizing expected utility, dilation implies that observing $B$ may increase **indeterminacy**. Before observing $B$, the agent might prefer Act 1 over Act 2 because Act 1 has higher expected utility across all $P \in \mathcal{M}$. After observing $B$, the widened probability range may cause the expected utility intervals of the acts to overlap, rendering them incomparable. This contrasts with standard Bayesian decision theory, where the Value of Information is non-negative; information never reduces the ability to rank acts. Under dilation, information can have "negative value" in the sense that it transforms a determinate choice into an indeterminate one, potentially paralyzing decision-making despite the acquisition of data.

  ***

  ### 3. Marking Scheme

  **Total Marks: 20**

  **Part (a): Computation and Classification (4 Marks)**
  *   **Must-Hit Points:**
      *   Correct Prior Range: $[0.4, 0.6]$ (1 mark).
      *   Correct Posterior Ranges: $[0.1, 0.9]$ and $[0.3, 0.7]$ (1 mark).
      *   Identification of Strict Containment (1 mark).
      *   Correct Conclusion: Uniform Dilation (1 mark).
  *   **Common Error:** Calculating posteriors incorrectly (e.g., forgetting to divide by $P(B)$). *Deduct 1 mark per calculation error.*
  *   **Common Error:** Claiming dilation is not uniform because $[0.3, 0.7]$ is "closer" to the prior than $[0.1, 0.9]$. *Deduct 1 mark (misunderstanding definition).*

  **Part (b): Precise Probability Constraint (4 Marks)**
  *   **Must-Hit Points:**
      *   Identification of Law of Total Probability / Weighted Average property (2 marks).
      *   Explanation that prior must lie between min/max posteriors in precise case (2 marks).
  *   **Common Error:** Vague appeal to "Bayesian updating" without citing the averaging property. *Deduct 2 marks.*
  *   **Common Error:** Claiming precise probability can dilate if the distribution changes over time. *Deduct 4 marks (fundamental misunderstanding).*

  **Part (c): Coherence and Interpretation (4 Marks)**
  *   **Must-Hit Points:**
      *   Statement that IP remains coherent (no sure loss) (1 mark).
      *   Distinction between Epistemic (representational) vs. Aleatory (objective) uncertainty (2 marks).
      *   Explanation that dilation reflects ignorance of correlation (1 mark).
  *   **Common Error:** Arguing dilation proves IP is incoherent/irrational. *Deduct 3 marks.*
  *   **Common Error:** Confusing the credal set with a "true" distribution that is changing. *Deduct 2 marks.*

  **Part (d): Convexity Objection (4 Marks)**
  *   **Must-Hit Points:**
      *   Observation that the provided $\mathcal{M}$ is explicitly convex (2 marks).
      *   Conclusion that convexity does *not* remove dilation (2 marks).
  *   **Common Error:** Agreeing with the critic that convexity would solve the problem. *Deduct 4 marks (This is the primary conceptual crux; failure here indicates rote memorization of 'convexity is good' without understanding dilation mechanics).*
  *   **Common Error:** Ignoring the prompt's definition of $\mathcal{M}$ and arguing from general theory alone. *Deduct 2 marks.*

  **Part (e): Decision Consequence (4 Marks)**
  *   **Must-Hit Points:**
      *   Identification of increased indeterminacy/incomparability of acts (2 marks).
      *   Contrast with Standard Bayesian Value of Information (non-negative) (2 marks).
  *   **Common Error:** Claiming the agent makes *worse* decisions (higher loss) rather than *indecisive* ones. *Deduct 2 marks.*
  *   **Common Error:** Failing to contrast with standard Bayesian theory. *Deduct 2 marks.*
