      *   **Paradox of Phenomenal Judgment (Chalmers/etc.):** If qualia are causally inert, why do we talk about them? How do our physical brains (which cause speech/writing) come to represent non-causal qualia accurately? There seems to be a causal gap between the experience and the report of the experience.
      *   **Spinoza's Core Commitments (relevant here):**
          *   Monism (One Substance, God/Nature).
          *   Attribute Dualism (Thought and Extension are two of infinite attributes).
          *   Parallelism (Order and connection of ideas is the same as order and connection of things).
          *   Mind-Body Identity (The mind is the idea of the body).
          *   No Inter-attribute Causation (Mind doesn't move body, body doesn't move mind).
          *   Causation is intra-attribute (Ideas cause ideas, bodies cause bodies).
          *   Knowledge of Mind (We know our mind only insofar as we know the body's affections).

  3.  **Address Question 1: Epiphenomenalism:**
      *   *Standard Epiphenomenalism:* Physical -> Mental, but not Mental -> Physical. Often implies ontological asymmetry (physical is real/base, mental is shadow).
      *   *Spinoza's View:* Mind doesn't move body. Body doesn't move mind. This looks like epiphenomenalism *from the perspective of cross-attribute interaction*. However, Spinoza denies the asymmetry. The mental is not a byproduct; it is the *same thing* expressed under Thought.
      *   *Verdict:* He would call it a confused restatement. He agrees mental events don't cause physical events, but denies physical events cause mental events (in the transitive sense). They are correlated expressions of the same causal chain. It's not "inert byproduct," it's "parallel expression."
      *   *Key Doctrine:* Parallelism, No Inter-attribute Causation.

  4.  **Address Question 2: The Paradox of Phenomenal Judgment:**
      *   *The Paradox:* How does the physical brain state (causing speech) track the non-physical qualia if qualia do nothing?
      *   *Spinoza's Defusion:* The "judgment" (an idea) and the "bodily state" (speech mechanism) are one and the same mode, expressed under different attributes. The idea of the qualia *is* the mental side of the bodily state that produces the speech. There is no tracking relation needed because there is no ontological gap to bridge causally. The idea causes other ideas (including the idea of reporting), just as the body causes other bodies (including the speech muscles). The "tracking" is guaranteed by the identity of the order and connection.
      *   *Verdict:* Non-starter. The paradox assumes a causal link is needed between distinct ontological categories to explain accuracy/tracking. Spinoza denies the distinctness of the *mode* (though distinctness of *attribute* remains).
      *   *Key Doctrine:* Mind as Idea of Body, Parallelism (Order and Connection).

  5.  **Address Question 3: The Shared False Assumption:**
      *   *Epiphenomenalists & Critics:* Both usually assume a transactional model of causation where influence must pass between the mental and physical realms for knowledge or action to occur. They assume the mental and physical are distinct *entities* or *substances* (or at least distinct causal powers that need bridging). They assume "causation" is the only way to secure epistemic access.
      *   *Spinoza's Denial:* He denies they are distinct substances. He denies cross-attribute causation is even coherent. He denies that knowledge requires causal impact from object to subject in the way empiricists/physicalists think (knowledge is intrinsic adequacy of ideas).
