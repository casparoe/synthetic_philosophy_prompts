answer: |-
  Spinoza enters the room not as a participant in the debate, but as a dissolver of its terms. To place him alongside epiphenomenalism and the paradox of phenomenal judgment requires mapping contemporary philosophy of mind categories onto his metaphysics of attributes and modes. He does not fit neatly into the physicalist vs. dualist spectrum that generates these problems. Here is where he lands based on his structural commitments.

  ### 1. Epiphenomenalism: Confused Restatement
  Spinoza would reject standard epiphenomenalism, but he would agree with its central negative claim: mental events do not cause physical events. However, he would argue the epiphenomenalist draws the wrong ontological conclusion from this fact.

  Standard epiphenomenalism is asymmetrical: the physical causes the mental, but the mental causes nothing. It treats the physical as ontologically primary and the mental as a causally inert shadow. Spinoza's parallelism is symmetrical. For Spinoza, the mind is the idea of the body. The "order and connection of ideas is the same as the order and connection of things." When a bodily state occurs, a corresponding idea occurs. Neither causes the other; they are one and the same mode of substance expressed under different attributes.

  Crucially, Spinoza insists that ideas are active within their own attribute. An idea causes other ideas. A volition (a mental affirmation) causes other mental states, just as a bodily motion causes other bodily motions. To call the mind "causally inert" is false from the perspective of Thought. It is only inert regarding Extension. Therefore, Spinoza would view epiphenomenalism as a confused restatement of his own doctrine of **No Inter-attribute Causation**, corrupted by the false assumption that the physical attribute is the only real causal domain. He would say the epiphenomenalist has correctly noticed that the mind doesn't move the body, but incorrectly inferred that the mind therefore lacks causal power simpliciter.

  **Extrapolation Warning:** Spinoza never used the term "epiphenomenalism," nor did he conceive of "qualia" as distinct from "ideas." I am mapping his concept of "ideas of affections" onto modern phenomenal experience.

  ### 2. The Paradox of Phenomenal Judgment: A Non-Starter
  The paradox of phenomenal judgment asks: If qualia have no causal power, how do physical brain states (which cause speech) come to accurately report on them? There seems to be no causal chain linking the experience to the report of the experience.

  For Spinoza, this paradox cannot get off the ground because it assumes a tracking relationship between two distinct ontological items that need to be bridged. In Spinoza's system, the "judgment" (the idea that I am in pain) and the "physical state" (the neural correlate causing speech) are not two things that need to be linked. They are one mode.

  When I say "I am in pain," two things are happening:
  1.  **Under Extension:** A bodily state causes vocal cord movement.
  2.  **Under Thought:** An idea of that bodily state causes an idea of reporting that state.

  The accuracy of the report is not secured by a causal link from qualia to brain state. It is secured by **Identity**. The idea *is* the mental aspect of the body state. The "judgment" is simply the mind reflecting on the body's affection. Because the mind is nothing but the idea of the body, it cannot fail to "track" the body insofar as it has adequate ideas. The paradox assumes the report is physical and the qualia is non-physical, requiring a bridge. Spinoza denies the report is purely physical; the report *as understood* is an idea caused by other ideas. The report *as sound* is a body caused by other bodies. The coherence between them is guaranteed by the metaphysical identity of the underlying mode, not by causal tracking.

  **Extrapolation Warning:** Spinoza's theory of self-knowledge is complex and relies on "ideas of ideas." I am simplifying his epistemology to apply it to the specific mechanism of "reporting qualia," which is a contemporary linguistic act he did not analyze.

  ### 3. The Shared False Assumption
  Both the epiphenomenalist and their critics (typically interactionists or physicalists who demand causal efficacy for mental states) share a assumption Spinoza flatly denies: **That causal influence must pass between attributes to secure epistemic access or behavioral explanation.**

  The debate presupposes a transactional model where Mind and Body are distinct enough that one must push the other to explain behavior or knowledge. The epiphenomenalist says "Body pushes Body, Mind sits there." The critic says "Mind must push Body to matter." Both agree that "Mind pushing Body" is the only way for the mental to be relevant to the physical report.

  Spinoza denies the coherence of "Mind pushing Body." He argues this category error arises from imagining humans as a "dominion within a dominion"—a separate substance interfering with nature. For Spinoza, Substance is One. Thought and Extension are merely different ways of conceiving the same reality. Therefore, the requirement for cross-attribute causation to explain why we talk about qualia is a category mistake. We talk about qualia because ideas cause ideas. The fact that our tongues move is a parallel fact about bodies causing bodies. The assumption that these two stories need to be causally stitched together is the error.

  **Extrapolation Warning:** I am attributing a diagnosis of "category error" to Spinoza. While he argues against the coherence of mind-body interaction, framing it as a linguistic or conceptual category mistake in the modern analytic sense is an extrapolation of his metaphysical claims.

