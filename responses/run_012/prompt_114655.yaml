      *   **Dave's Position:** Aquinas says sedition is always a mortal sin; therefore, endure tyranny quietly.
      *   **User's Position:** Aquinas distinguishes tyrannical rule from just rule; resisting a tyrant isn't necessarily sedition, provided it doesn't cause greater harm.
      *   **The Task:** Address four specific philosophical/theological questions about Aquinas's political thought without providing a reading list or deferring to commentaries. Lay out the argument plainly, including tensions and inconsistencies.
      *   **Constraints:** No citations (other than the ones already mentioned), no "go read a commentary," plain terms, acknowledge where things don't hold together.

  2.  **Deconstruct the Four Questions:**

      *   **Question 1: Definitional Dodge vs. Substantive Argument.**
          *   *Issue:* Aquinas defines *sedition* as opposing the unity/common good. A tyrant opposes the common good. Therefore, resisting a tyrant isn't *sedition*. Is this just wordplay?
          *   *Analysis:* It's not *just* wordplay, but it relies on a specific metaphysics of authority. Authority comes from God *for* the common good. If a ruler violates the end (common good), they violate the source of their authority. However, there is a tension: who decides?
          *   *Verdict:* It's substantive but relies on an objective notion of "common good" that is hard to apply in practice.

      *   **Question 2: The "Greater Harm" Clause and Consequentialism.**
          *   *Issue:* Does "unless it causes worse suffering" turn the absolute prohibition into a utilitarian calculation?
          *   *Analysis:* Aquinas is not a pure consequentialist (act utilitarian). He is a natural law theorist. The "greater harm" clause isn't about maximizing utility but about *proportionality* and the *purpose* of resistance. If resistance destroys the community to save it, it defeats the purpose of the common good. It modifies the *licitness* of the act, not necessarily the definition of the sin, but it does soften the "always."
          *   *Verdict:* It's not full consequentialism, but it does introduce a prudential calculation that weakens the "always mortal sin" claim in practice.

      *   **Question 3: *Summa* vs. *On Kingship* (De Regno) and Types of Tyrants.**
          *   *Issue:* *On Kingship* seems more permissive (community can depose). *Summa* is more cautious. Also, usurper vs. legitimate-turned-tyrant distinction.
          *   *Analysis:* *On Kingship* is earlier/different genre (advice to a King). *Summa* is more systematic theological ethics. There is a tension. *On Kingship* allows public authority to depose. *Summa* worries about private individuals. The usurper vs. legitimate distinction *is* present in Aquinas (and canon law of the time). A usurper has no title; a legitimate tyrant has a title but abuses it. Deposing a usurper is easier than deposing an anointed king.
          *   *Verdict:* There is a real tension. *On Kingship* is more political/pragmatic; *Summa* is more theological/cautious. The distinction between usurper and legitimate tyrant matters significantly.

      *   **Question 4: Who Counts as "the Multitude"?**
          *   *Issue:* Both sides claim to defend the common good. Is this circular?
          *   *Analysis:* Aquinas relies on the idea of "public authority." Private individuals cannot act as the multitude. The "multitude" isn't a mob; it's the community acting through representative structures (barons, estates, etc., in a medieval context). It's not "whoever wins," but "who has the standing."
          *   *Verdict:* It's not purely circular, but it relies on medieval social structures that don't translate well to modern democracy. It collapses if there's no recognized public authority to channel the resistance.

  3.  **Drafting the Response (Iterative Process):**

      *   *Tone:* Philosophical, direct, acknowledging the user's intelligence (they know the texts), avoiding preachiness.
