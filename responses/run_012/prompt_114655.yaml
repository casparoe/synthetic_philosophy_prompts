      *   *Self-Correction on "Sedition":* Make sure to clarify that for Aquinas, *sedition* is by definition sinful. So if an act is justified, it literally *isn't* sedition. This addresses the "definitional dodge" charge directly. It's not a dodge; it's a categorization based on the *end* of the act.
