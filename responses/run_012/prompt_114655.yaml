      *   *Drafting Point 3 (Textual Tension):* Be honest. *De Regno* is more robust. *Summa* is more cautious. The usurper distinction is real. A usurper is an aggressor; a legitimate tyrant is a corrupt father. Killing a usurper is closer to self-defense; killing a legitimate king is sacrilege/rebellion. This is where the "quietist" label sticks hardest—on the legitimate tyrant.
      *   *Drafting Point 4 (The Multitude):* Crucial point. Aquinas isn't a modern individualist. "The Multitude" means the corporate body acting through superiors (nobles, magistrates), not random guys with pitchforks. This avoids pure circularity but limits resistance to elite-led action.

      *   *Synthesis:* Is he a quietist? No, but he's a *cautious* resistance theorist. Dave is wrong that it's "full stop." You are wrong that it's a green light. It's a narrow, dangerous path reserved for public authority, not private conscience.

