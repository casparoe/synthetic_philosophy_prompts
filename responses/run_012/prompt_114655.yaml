answer: |-
  You and Dave are both hitting on real tensions in the text, but you are both slightly overstating your case to win the argument. Aquinas is not a quietist in the sense of "endure evil silently," but he is a quietist in the sense of "do not take the law into your own hands."

  Here is the breakdown of the four problems you raised, laid out in plain terms, including where the logic strains or breaks.

  ### 1. The "Definitional Dodge" Problem
  **Your question:** Is saying "resisting a tyrant isn't sedition" just wordplay, or is there substance there?

  **The Argument:** It looks like wordplay because Aquinas defines *sedition* as a sin against the unity of the multitude and the common good. If a tyrant destroys the common good, he has already broken the unity. Therefore, removing him restores unity. By definition, you cannot be "splitting the unity" (sedition) by "restoring the unity" (resistance).

  **Is it a dodge?** It is not *merely* a dodge, but it relies on a metaphysical claim that is hard to cash out politically. For Aquinas, authority is not a property the king *owns*; it is a function he *performs*. Authority comes from God, but it is granted *for* the common good. If the ruler actively destroys the common good, he is acting ultra vires (beyond his powers). He is no longer a ruler in the full sense, but a predator.

  **Where it breaks:** The dodge becomes real when you ask: *Who decides?* Aquinas assumes there is an objective "common good" that is recognizable. In practice, every rebel claims the ruler is a tyrant and every ruler claims the rebels are seditious. Aquinas offers no procedural mechanism for deciding this before the fighting starts. He relies on the assumption that the "multitude" will naturally recognize the truth. History suggests they often don't. So, while the metaphysics are substantive, the political application is vulnerable to the very ambiguity Dave is worried about.

  ### 2. The "Greater Harm" Clause and Consequentialism
  **Your question:** Does the warning against causing "greater harm" turn this into a consequentialist calculation, undermining the "always a mortal sin" claim?

  **The Argument:** Aquinas is not a consequentialist (utilitarian). He does not believe the ends justify the means. However, he is a natural law theorist, which means he cares about *proportionality* and *prudence*. The "greater harm" clause is not about calculating utility; it is about the *purpose* of resistance. The purpose is to secure the common good. If the resistance destroys the community (through civil war, invasion, or anarchy), it has defeated its own purpose.

  **Does it weaken the "Always"?** Yes, practically speaking. If the sinfulness of the disturbance depends on the outcome (i.e., did it make things worse?), then you cannot know if the act was sinful until *after* it happens. This creates a huge loophole.
  *   **Dave's point:** If you can't guarantee success without making things worse, you shouldn't act. This leads to quietism.
  *   **Your point:** If you *can* succeed without making things worse, the act is permitted. This leads to resistance theory.

  **The Verdict:** It's not full consequentialism, but it is a prudential constraint that effectively neutralizes the "always." It changes the rule from "Never resist" to "Never resist *foolishly*." But since most revolutions are foolish and bloody, the practical effect is often quietism, even if the theoretical door is open.

  ### 3. *Summa* vs. *On Kingship* (De Regno) and the Tyrant Distinction
  **Your question:** Is there a tension between the cautious *Summa* and the more permissive *On Kingship*? Does the distinction between a usurper and a legitimate-turned-tyrant matter?

  **The Argument:** There is a real tension here, and you are right to spot it.
  *   **In *On Kingship*:** The text is more robust. It explicitly says if a community appointed the king, they can depose him. It suggests that asking a higher authority (like the Emperor or Pope) is the right move, but if that fails, the community has recourse.
  *   **In the *Summa*:** The tone is more theological and cautious. It emphasizes the danger of scandal and disorder.

  **The Usurper Distinction:** This is the key you were looking for. Aquinas (and the canon law tradition he inherits) absolutely distinguishes between:
  1.  **A Usurper:** Someone who seizes power without title.
  2.  **A Legitimate Tyrant:** Someone with a valid title who rules badly.

  Against a **usurper**, resistance is much closer to self-defense. The usurper is an aggressor. There is less "sedition" risk because there is no legitimate authority to be seditious *against*.
  Against a **legitimate tyrant**, the bar is much higher. He holds a divine office, even if he abuses it. Removing him risks sacrilege and the breakdown of order.

  **Where it breaks:** *On Kingship* was unfinished (completed by his student Ptolemy of Lucca), which explains some of the tonal shift. Ptolemy was more conciliarist and republican than Thomas. So, when you cite *On Kingship* as "Aquinas," you might actually be citing a student who was more willing to authorize deposition than the master was. The *Summa* is the safer bet for Aquinas's own mature thought, and it is significantly more cautious.

  ### 4. Who Counts as "the Multitude"?
  **Your question:** Isn't "defending the common good" just something both sides claim? Is there a criterion, or is it whoever wins?

  **The Argument:** For Aquinas, "the multitude" does not mean "a mob" or "a majority of individuals." It means the **corporate body acting through public authority.**
  In a medieval context, the "multitude" acts through the barons, the estates, the magistrates, or the leading men of the community. A private individual (you or me) cannot decide the king is a tyrant and kill him. That is assassination and sin. But if the "public authority" (the nobles representing the realm) declares the king deposed, that is an act of judgment, not sedition.

  **Does it collapse?** It avoids pure circularity ("might makes right") by insisting on *procedure*. It's not about who wins the fight; it's about who has the *standing* to fight.
  *   **Private person:** No standing. Sinful.
  *   **Public authority (representing the multitude):** Has standing. Potentially licit.

  **Where it breaks:** This works in a feudal society where the "public authority" is clearly defined (dukes, counts, bishops). It falls apart in a modern context where "the people" are atomized individuals. If there is no recognized body to channel the "multitude's" will, Aquinas's theory leaves a vacuum. It implies you must wait for the elites to agree before resisting. If the elites are bought off by the tyrant (which they often are), the theory offers no recourse for the common man. This is where the quietist charge sticks hardest.

  ### The Final Tally: Who Won the Argument?

  **Dave is wrong** that Aquinas says sedition is *always* a mortal sin "full stop." Aquinas explicitly carves out an exception for tyrannical rule that is not directed to the common good. He is not a pacifist regarding injustice.

  **But you are also slightly wrong** to think this opens the door to resistance in any meaningful modern sense. Aquinas's "resistance" is:
  1.  Reserved for **public authorities**, not private citizens.
  2.  Subject to a **prudential calculation** that usually discourages action (because civil war is usually worse than tyranny).
  3.  Dependent on a **distinction between usurper and legitimate king** that heavily favors stability.

  **The Synthesis:**
  Aquinas is a **cautious constitutionalist**, not a quietist, but his constitutionalism is elitist. He believes tyranny is an objective evil that may be resisted, but he believes disorder is also an objective evil that must be avoided. When those two clash, he almost always prioritizes order unless the tyranny is egregious *and* the resistance can be led by the proper authorities *and* it won't cause a worse disaster.

  In practice, this looks a lot like quietism for the average person, but theoretically, it is not. Dave wins on the *practical implications* (don't start a revolution), but you win on the *theoretical principles* (tyranny is not legitimate authority).

  **The honest inconsistency:**
  The system cannot hold together when the "public authority" (the nobles/elites) is complicit in the tyranny. Aquinas has no answer for the common man when the elites fail. In that specific gap, his theory collapses, and he offers no guidance other than "suffer it," which brings you back to Dave's quietism. You have to admit that gap exists to be faithful to the text.
