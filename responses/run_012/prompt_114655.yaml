  *(Check on De Regno)*: Aquinas didn't finish *De Regno*. Ptolemy of Lucca finished it. This is a famous scholarly issue. Should I mention it? The user asked not to smooth things over. Mentioning the authorship controversy might be relevant to the "tension" between the texts. It explains why *De Regno* might sound more conciliarist than Aquinas usually does. I will mention it briefly as a source of tension.

