          *   *Expected:* 1. Pascal's Mugging (tiny prob, huge utility). 2. Longtermism/Population Ethics (huge population, swamping present).
          *   *Classification:* Usually, fanaticism is seen as a problem with the *rule* (EV maximisation implies these counterintuitive results regardless of value theory, though some argue it's about unbounded utility functions). Some might argue it's about inputs (probabilities are unknowable). The prompt asks the student to classify.
          *   *Student Answer:* Identifies Mugging and Far Future. Claims they are "really the same complaint". Classifies both as complaints about the *decision rule*.
          *   *Critique:* Identifying the two cases is good. Claiming they are "really the same" is debatable but defensible (both involve unbounded EV). Classifying as "rule" is standard (EV maximisation *requires* accepting these if inputs are accepted). However, saying "axiology is just whatever the agent's utility function says" misses the point that fanaticism often arises *because* of specific axiological commitments (unbounded utility) combined with the rule. But broadly, acceptable.
      *   **Part (b) (6 marks):** Evaluate the "inputs are unreliable" reply (Harsanyi/uncertainty objection). What does it buy? What does it leave untouched?
          *   *Expected:* Buys: Avoids specific fanatical verdicts in practice (mugging, far future) because probs/utilities are undefined or too uncertain. Leaves untouched: The theoretical problem (if inputs *were* known, EV still demands it); also doesn't solve cases where inputs *are* reasonably confident (e.g., some existential risk cases); doesn't address the structural issue of unbounded utility.
