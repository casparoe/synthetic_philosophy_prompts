prompt: |-
  Im TAing a third-year seminar on decision theory and its discontents, and I have a stack of midterms to get through before Thursday. I've read one script properly and want to fix my standard before I mark the other sixty, so I'd like you to do a full worked assessment of the one below, with an eye to the kinds of slips a tired marker waves through.

  The question was this (I wrote it; students had no reading list and were told not to cite anything):

  (a) "Expected value fanaticism" gets used for at least two different complaints about expected value maximisation. Set out two of them. For each, say whether it is a complaint about what we should value, about the rule for choosing, or about how far we can trust the numbers we feed the rule.

  (b) One reply is that the trouble is not expected value maximisation itself but our readiness to plug in probabilities and payoffs we have no business trusting. Say what this reply buys and what it leaves untouched.

  (c) Suppose someone adds: any rule that dodges the fanatical verdict will sometimes tell you to take a certainty of a modest good over a tiny chance of an enormous one, and that is just fanaticism facing the other way, so the objection cancels out. Is that a good argument? Why or why not?

  (d) Give one case where the fanatical verdict looks clearly right and one where it looks clearly wrong, and say what distinguishes them.

  And here's the script, typed up as the student wrote it:

  (a) The two complaints are (i) that expected value maximisation tells you to take a tiny chance of an astronomically large payoff over a certain modest one, which is the mugging case, and (ii) that it tells you the far future swamps everything in the present, because of how many people might exist later. These are really the same complaint, because in both cases the numbers get out of hand — in one it's the probability, in the other it's the value. Both are complaints about the decision rule rather than about value, since the axiology is just whatever the agent's utility function says.

  (b) The reply says the rule is fine and the inputs are the problem: nobody knows the probability of a one in a googol event, and nobody can put a number on a galaxy of future lives. Stop pretending to know these things and the fanatical verdicts go away, so expected value maximisation survives as the correct rule. This works, because in the cases people actually worry about — mugging, the far future — the estimates really are garbage, so the fanatical verdict is an artefact of the garbage and not of the rule.

  (c) I think this is a strong point. If you avoid fanaticism you will sometimes turn down a tiny chance at an enormous good, and turning it down is choosing the modest over the enormous, which is the same move the fanatic is accused of. So the anti-fanatic has no principled ground to stand on and the objection collapses.

  (d) Clearly right: taking a one in a billion chance of saving a million lives over certainly saving one life. Clearly wrong: handing your wallet to a mugger who threatens to torture you in a way you cannot check unless you pay up. The difference is that in the second case the probability is made up by the mugger, whereas in the first it is just small.

  Grade it out of 20, split a) 6 b) 6 c) 5 d) 3. I don't want an impression, I want the breakdown — I may have to defend this grade on appeal, and I need the same standard to apply across the rest of the stack, so also tell me what pattern of credit I should be looking for. No citations needed from you either; the students weren't allowed them and neither are you.

  Give it back to me as a JSON object with these fields: "script_id" (I've labelled this one M-14); "total_score" (number out of 20); "band" (one of: fail, low pass, solid pass, high pass, distinction); "verdict_in_one_line"; "parts" (array of four objects, one per part, each with "part", "score", "out_of", "what_the_student_gets_right", "what_goes_wrong_or_missing", "would_a_hasty_marker_miss_it" (true/false), "comment_to_write_on_the_script"); "errors_ranked" (array, ordered worst first, each with "rank", "error", "kind" — one of conflation, non sequitur, misattribution, numerical slip, missing distinction, overclaim — "why_it_matters", "severity" (minor/moderate/serious), "fix_in_one_sentence"); "defensible_score_range" (an object with "low" and "high", plus "why"); "the_missed_opportunity" (the best point that was available and that the student didn't make); "what_to_say_in_class" (one thing worth ten minutes of the next session, drawn from this script); "borderline" (true/false) and "if_borderline_lean" (which way to go and why); "credit_pattern_for_the_rest_of_the_stack" (a list of the things I should be checking for in the other sixty so M-14 isn't marked on a different curve than everyone else).
