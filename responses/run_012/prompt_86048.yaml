prompt: |-
  I'm a software engineer on the risk analytics team at a mid-size consumer lender, and I've been handed an odd assignment: build the fairness review that every credit model has to clear before it goes to production. My background is distributed systems and a little applied stats; I have no formal training in philosophy, and what I know about the fairness literature I've picked up from blog posts and a few papers I half-understood. I know enough to know that the usual definitions — demographic parity, error-rate balance, calibration, individual-similarity approaches — conflict, and that there are theorems showing some of them cannot all hold at once. What I want from you is not a summary of those theorems but the specification underneath them: the list of requirements that any fairness criterion has to meet to be usable in our setting, with the concrete case behind each requirement, so that when a vendor hands me a metric I can say what it does and doesn't deliver rather than just running it. Please don't send me citations or a reading list; I won't be able to chase papers down, and what I need is the criteria themselves, argued out in plain prose.

  Our setting puts some pressure on the standard list, and I'd like you to treat these as part of the specification rather than as background. We only observe repayment for applicants we approved, and the missingness is driven by the decisions of the model we're replacing, so any criterion that needs to know what rejected applicants would have done is not something I can actually compute. Race and ethnicity are unobserved for most applicants — we have self-reports for a subset and a surname-plus-geography imputation for the rest, so a criterion has to be well-defined when the group variable is itself measured with error. Our scores are continuous and our cutoffs move for business reasons, and we retrain quarterly, so a verdict that flips when I change the threshold or rebin the score would be useless to me. The protected group we treat as the baseline is also a choice I make, and it shouldn't be the thing that determines the answer. Our legal reviewers, meanwhile, care about a distinction I only partly grasp — between a policy that treats people differently on purpose and a facially neutral one with an unjustified disparate effect, where a business-necessity justification is allowed — and I'd like the list to respect whatever that distinction actually imposes. And the committee that reviews these models wants a single verdict per model, decided in-house by the vendor's own team, so a criterion that can be satisfied by cosmetic post-hoc tweaking without changing anything real is worse than useless to me.

  So: give me the desiderata. For each requirement, tell me what it demands and the scenario that motivates it — the case that would come out wrong if we violated it — and then tell me which of these are genuine requirements of any adequate criterion and which are really just the commitments of one camp dressed up as requirements. The part I care about most is the impossibility: if some subset of the list can't be jointly satisfied, say exactly which subset and what the impossibility turns on, because that tells me which dial I'm actually turning when I relax something. Then commit. Don't hand me the menu and leave the choice to me — tell me which single requirement you'd give up first in our situation, which criterion you'd actually put in the review, and what you'd be betting against by choosing it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Software engineer on a risk analytics team at a mid-size consumer lender.
      *   **Background:** Distributed systems, some applied stats, no formal philosophy/fairness theory training (knows the basics via osmosis).
      *   **Task:** Build a fairness review specification for credit models before production.
      *   **Constraints/Context:**
          *   Selective Labels (only observe repayment for approved applicants).
          *   Noisy/Imputed Protected Attributes (race/ethnicity often imputed via BIAS method).
          *   Continuous Scores + Moving Cutoffs (retrain quarterly, business-driven thresholds).
          *   Baseline Group Choice (shouldn't dictate the verdict).
          *   Legal Distinction (Disparate Treatment vs. Disparate Impact + Business Necessity).
          *   Governance (Single verdict, in-house review, no gaming via post-hoc tweaking).
      *   **Deliverable:** A list of desiderata (requirements) for a fairness criterion, argued in plain prose. No citations/reading lists.
      *   **Critical Analysis:** Distinguish between genuine requirements and ideological commitments. Identify impossibility results (which subset conflicts).
      *   **Commitment:** Choose *one* requirement to drop, recommend *one* criterion/approach, and state the bet being made.

  2.  **Deconstruct the Constraints into Desiderata:**
      *   *Selective Labels:* The metric must be estimable without counterfactuals on rejected applicants. (Feasibility)
      *   *Noisy Groups:* The metric must be robust to measurement error in protected attributes. (Robustness)
      *   *Threshold Invariance:* The metric shouldn't flip wildly just because the business cutoff moved slightly. (Stability)
      *   *Base Rate Independence:* The verdict shouldn't depend on which group is the reference. (Symmetry)
      *   *Legal Alignment:* Must distinguish between intent and impact, allowing for business necessity. (Compliance)
      *   *Non-Gamable:* Can't be fixed by simple recalibration without changing decision logic. (Integrity)
      *   *Predictive Validity:* Must not sacrifice too much accuracy (implied by "risk analytics team").

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Estimability under Selective Labels.*
          *   *Demand:* Can compute it using only observed data (approved loans).
          *   *Scenario:* A metric requires knowing default rates of rejected applicants. We can't know that. If we use it, we are guessing.
          *   *Status:* Genuine requirement.

      *   *Requirement 2: Robustness to Attribute Noise.*
          *   *Demand:* Doesn't break when race is imputed (e.g., BIAS method).
          *   *Scenario:* Imputation adds variance. A metric sensitive to small classification errors in group membership will flag noise as bias.
          *   *Status:* Genuine requirement (specific to this user's context).

      *   *Requirement 3: Threshold Stability.*
          *   *Demand:* Verdict doesn't change if cutoff moves from 650 to 655.
          *   *Scenario:* Business changes capital reserves, moves cutoff. Fairness verdict flips from "Pass" to "Fail" without model change.
          *   *Status:* Genuine requirement (operational stability).

      *   *Requirement 4: Symmetry (Reference Group Independence).*
          *   *Demand:* Result is the same whether Group A is compared to B or B to A.
          *   *Scenario:* Disparate Impact ratio often uses the "advantaged" group as denominator. If we swap baselines, the ratio inverts.
          *   *Status:* Genuine requirement (logical consistency).

      *   *Requirement 5: Business Necessity Compatibility.*
          *   *Demand:* Allows trade-off between accuracy and parity if accuracy is justified.
          *   *Scenario:* A model is slightly more disparate but significantly more accurate (less loss for everyone). Legal framework allows this.
          *   *Status:* Legal/Policy commitment (not purely mathematical).

      *   *Requirement 6: Calibration/Resolution.*
          *   *Demand:* Scores mean the same thing across groups.
          *   *Scenario:* A score of 700 means 5% default for Group A but 10% for Group B. This is dangerous for pricing.
          *   *Status:* Genuine requirement (risk management).

  4.  **Identifying the Impossibility:**
      *   The classic impossibility is between Calibration, Error Rate Balance (Equalized Odds), and Demographic Parity when base rates differ.
      *   *User's Context:* Selective labels make Error Rate Balance (False Positive/Negative rates) hard to estimate reliably because we don't see the True Negatives (rejected good risks) or False Negatives well.
      *   *Conflict:* Calibration (Requirement 6) vs. Error Rate Balance (often desired for fairness). If base rates differ (which they likely do in credit due to historical inequities), you can't have both.
      *   *Also:* Threshold Stability vs. Demographic Parity. If you enforce parity at one threshold, moving the threshold breaks parity unless the score distributions are identical.

  5.  **Selecting the "Drop" and the "Commitment":**
      *   *The Drop:* **Equalized Odds / Error Rate Balance.**
          *   *Why?* In a selective labels setting (reject inference is hard/noisy), estimating False Negative Rates is speculative. Enforcing it requires assumptions about the unobserved that are legally and statistically fragile. It also conflicts with Calibration when base rates differ.
      *   *The Commitment:* **Calibration (plus Business Necessity/Disparate Impact analysis).**
          *   *Why?* Calibration is estimable on approved populations (mostly). It ensures risk consistency (a 700 score is a 700 score). It aligns with "Business Necessity" (accuracy). It is threshold-stable (calibration holds across the curve, not just at a cutoff).
          *   *The Bet:* Betting that ensuring the *meaning* of the score is consistent across groups is more legally defensible and operationally stable than trying to equalize acceptance rates or error rates which depend on unobserved data and moving cutoffs.

  6.  **Refining the Output (Matching Tone and Constraints):**
      *   *Tone:* Professional, direct, engineering-focused, no academic fluff.
      *   *Structure:*
          1.  The Desiderata (The Spec).
          2.  The Impossibility (The Conflict).
          3.  The Commitment (The Decision).
      *   *Check against constraints:* Did I mention citations? No. Did I address selective labels? Yes. Imputed attributes? Yes. Legal distinction? Yes.

  7.  **Self-Correction/Edge Case Consideration:**
      *   *Wait, is Calibration estimable with selective labels?* Yes, for the approved population. The risk is that the rejected population is miscalibrated. But since we can't observe them, we can't optimize for them without strong assumptions. Calibration *within the approved set* is the best proxy we have for "the model isn't lying about risk."
      *   *Legal Distinction:* Need to make sure I distinguish between Disparate Treatment (using race in model) and Disparate Impact (outcome differences). Calibration helps defend against Impact claims by showing the risk was real (Business Necessity).
      *   *Imputed Attributes:* Need to emphasize that the metric must handle probabilistic group membership, not just binary.
      *   *Gaming:* Calibration is hard to game with post-hoc tweaking without breaking the score's meaning. Demographic parity is easy to game (reject everyone until rates match).

  8.  **Final Polish:** Ensure the "Impossibility" section clearly identifies the triangle (Calibration, Error Balance, Parity) and why Error Balance is the casualty here. Ensure the "Commitment" is decisive. (Self-correction: Make sure to explicitly address the "single verdict" requirement).

  9.  **Drafting the Response:** (Mental Outline)
      *   Intro: Acknowledge the difficulty.
      *   Section 1: The Specification (6-7 requirements).
      *   Section 2: The Impossibility (The Triangle).
      *   Section 3: The Decision (Drop Error Balance, Keep Calibration).
      *   Section 4: The Bet (What could go wrong).

      *(Self-Correction during drafting)*: Make sure to explicitly call out which requirements are "Genuine" vs "Ideological/Policy". The prompt asks for this distinction.
      *   Genuine: Estimability, Robustness, Stability.
      *   Policy/ideological: Parity vs. Calibration trade-off.

      *(Refining the Legal aspect)*: The prompt mentions "Business Necessity". This implies Disparate Impact is the legal frame. So the metric needs to measure Impact, but allow a defense. Calibration *is* the defense (the difference is due to risk, not bias).

      *(Refining the "Single Verdict")*: The recommendation shouldn't just be a metric, it should be a process verdict based on the metric.

      *(Final check on "Imputed Attributes")*: Ensure the recommended metric works with probabilistic weights (BIAS method). Calibration checks can be weighted.

      *(Final check on "Thresholds")*: Calibration is threshold invariant. Parity is not. This is a strong argument for Calibration.

