answer: |-
  Here is the specification for the fairness review, broken down into requirements, the inherent conflicts, and the final commitment.

  ### Part 1: The Specification (Desiderata)

  These are the conditions any fairness metric must satisfy to be operational in your environment. I have categorized them by whether they are technical necessities ("Genuine") or policy choices ("Commitments").

  **1. Observability (Genuine)**
  *   **Demand:** The metric must be computable using only data available at the time of review. It cannot require ground-truth outcomes for applicants who were rejected by the current or legacy policy.
  *   **Scenario:** A metric requires the False Negative Rate (rejected applicants who would have repaid). Since you only observe repayment for approved applicants, calculating this requires "reject inference" (statistical guessing). If the metric depends on these guesses, your fairness verdict is only as good as your assumptions about the unobserved.
  *   **Why it matters:** In your selective labels setting, a metric requiring counterfactuals turns a fairness audit into a sensitivity analysis of untestable assumptions.

  **2. Attribute Robustness (Genuine)**
  *   **Demand:** The metric must remain stable when protected attributes are probabilistic rather than binary. It must accept weights (e.g., "80% probability Hispanic") rather than forcing hard classifications.
  *   **Scenario:** You use surname-plus-geography imputation for race. This method misclassifies a non-trivial percentage of applicants. A metric that treats imputed labels as ground truth will attribute classification error to model bias. If the metric flips from "Pass" to "Fail" when you adjust the imputation probability threshold from 0.7 to 0.8, it is measuring noise, not fairness.
  *   **Why it matters:** With noisy group data, high-variance metrics produce false positives for bias.

  **3. Threshold Invariance (Genuine)**
  *   **Demand:** The fairness verdict should not change solely because the business cutoff score moved, provided the model itself (the ranking) hasn't changed.
  *   **Scenario:** Your model ranks applicants correctly. Business decides to tighten credit due to liquidity concerns and raises the cutoff. A metric like Demographic Parity (equal acceptance rates) will immediately flag this as "unfair" because acceptance rates diverge at different points of the score distribution, even though the model's behavior didn't change.
  *   **Why it matters:** You retrain quarterly and cutoffs move. You need to measure the *model*, not the *policy* applied to the model.

  **4. Reference Symmetry (Genuine)**
  *   **Demand:** The verdict must be identical regardless of which group is treated as the baseline or numerator.
  *   **Scenario:** Disparate Impact ratios often divide the protected group rate by the control group rate. If Group A has a 10% pass rate and Group B has 5%, the ratio is 0.5. If you swap the baseline, the math changes. A fairness verdict shouldn't depend on which group you arbitrarily label "protected" for the calculation.
  *   **Why it matters:** Logical consistency. The magnitude of the disparity is a fact; the direction of the division is a convention.

  **5. Calibration Consistency (Genuine)**
  *   **Demand:** A given score must represent the same probability of default across all groups.
  *   **Scenario:** A score of 700 implies a 5% default risk for Group A but a 10% default risk for Group B. If you price loans based on that score, Group B is being overcharged relative to their risk. If you approve based on it, you are taking hidden risk on Group B.
  *   **Why it matters:** This is core to risk management. If the score means different things for different people, the model is fundamentally broken as a measurement instrument.

  **6. Business Necessity Alignment (Commitment)**
  *   **Demand:** The metric must allow for disparities in outcomes if those disparities are driven by disparities in underlying risk (base rates), provided the model predicts that risk accurately.
  *   **Scenario:** Group A has a historically higher default rate due to socioeconomic factors outside the lender's control. A model that accurately predicts this will reject more of Group A. A metric demanding equal acceptance rates (Demographic Parity) would force you to lend to higher-risk applicants in Group A to match Group B, increasing losses and potentially harming Group A with debt they can't service.
  *   **Why it matters:** This respects the legal distinction between Disparate Impact (neutral policy, unequal outcome) and Business Necessity (the policy is required for risk management). It acknowledges that equalizing outcomes is not always equitable or legal.

  **7. Non-Gamability (Genuine)**
  *   **Demand:** The metric cannot be satisfied by simple post-hoc adjustments that do not improve the model's internal logic.
  *   **Scenario:** A vendor can satisfy Demographic Parity by randomly rejecting approved applicants from the advantaged group until the rates match. This hurts revenue and helps no one. A metric that flags this as "Fair" is useless.
  *   **Why it matters:** Prevents vendors from "painting the model" to pass the review without fixing underlying issues.

  ---

  ### Part 2: The Impossibility

  You cannot satisfy all of these simultaneously. The conflict lies in the triangle of **Calibration**, **Error Rate Balance**, and **Demographic Parity**.

  1.  **Calibration:** A score of $X$ means the same risk for everyone.
  2.  **Error Rate Balance:** False Positive and False Negative rates are equal across groups.
  3.  **Demographic Parity:** Acceptance rates are equal across groups.

  **The Conflict:**
  If the underlying base rates (true default rates) differ between groups—which they almost certainly do in consumer lending due to historical and socioeconomic factors—you cannot have Calibration and Error Rate Balance at the same time.
  *   If you are **Calibrated**, you are predicting the true risk. If Group A is riskier, you will flag more of them as high risk. This leads to different False Positive/Negative rates.
  *   If you force **Error Rate Balance**, you must distort the scores so that the model makes mistakes at the same rate for both groups. This breaks Calibration (a 700 score no longer means the same risk for both).
  *   If you force **Demographic Parity**, you must ignore risk differences entirely to equalize acceptance. This breaks both Calibration and Error Rate Balance.

  **The Bottleneck in Your Setting:**
  The specific impossibility that breaks your workflow is **Error Rate Balance vs. Observability**.
  To measure Error Rate Balance (specifically False Negatives), you need to know the outcome of rejected applicants. You don't have that data (Selective Labels). Any attempt to enforce Error Rate Balance requires you to impute the unobserved data. This violates **Observability** and **Attribute Robustness**, because your fairness verdict becomes dependent on the quality of your imputation model, not the credit model under review.

  Therefore, you must drop one leg of the triangle.

  ---

  ### Part 3: The Commitment

  **The Requirement to Drop:**
  **Error Rate Balance.**

  I recommend you explicitly exclude Equalized Odds (equal false positive/negative rates) from your mandatory requirements.

  **Why:**
  1.  **It is uncomputable.** In your selective labels environment, you cannot calculate false negative rates without making strong, untestable assumptions about the rejected population. Basing a compliance verdict on imputed data is legally and statistically fragile.
  2.  **It conflicts with Calibration.** If base rates differ, enforcing error rate balance forces the model to be miscalibrated. A miscalibrated risk model is dangerous for a lender; it means you are mispricing risk, which can lead to adverse selection or regulatory capital issues.
  3.  **It is threshold-dependent.** Error rates change as you move the cutoff. Since your cutoffs move for business reasons, a model could pass fairness review at one cutoff and fail at another without the model changing. This violates **Threshold Invariance**.

  **The Criterion to Implement:**
  **Calibration within Groups (plus Disparate Impact Monitoring).**

  Your review should mandate that the model be **Calibrated** across groups, and you should monitor **Disparate Impact** (acceptance rates) as a signal, not a hard fail, allowing for a Business Necessity defense based on that calibration.

  **The Specification for the Vendor:**
  1.  **Calibration Test:** Plot predicted default probability vs. actual default rate for each protected group (using imputation weights). The curves must overlap within a confidence interval.
  2.  **Impact Statement:** Report the acceptance rate ratio between groups. If it falls below the legal threshold (e.g., 80% rule), the vendor must provide the "Business Necessity" justification: demonstrate that the disparity is explained by the difference in predicted risk (which is valid because the model is Calibrated).
  3.  **Stability Check:** Run the Calibration Test at multiple score cutoffs to ensure it holds across the distribution, not just at the operating point.

  **The Bet:**
  By choosing Calibration over Error Rate Balance, you are betting on the following:

  1.  **The Legal Bet:** You are betting that regulators and courts will accept "accurate risk prediction" as a sufficient Business Necessity defense for Disparate Impact. You are assuming that if you can prove a score of 700 is the same risk for everyone, you are not liable for the fact that Group A has fewer 700s.
  2.  **The Ethical Bet:** You are betting that it is worse to misprice risk (Calibration failure) than to have unequal acceptance rates. You are accepting that if historical inequities created different base rates, your model will reflect those inequities in its output, rather than trying to correct them via lending policy.
  3.  **The Operational Bet:** You are betting that Calibration is robust enough to survive the noise in your imputed race/ethnicity data. (Note: You must ensure your vendor uses weighting methods that account for the probability of group membership, not hard assignments).

  **The Risk:**
  The risk you are taking is that "Calibration" is not enough to satisfy emerging fairness norms. If the rejected population is systematically different in a way your approved data doesn't show (e.g., your model is calibrated on the approved, but the rejected would have been calibrated differently), you have a "bias in the labels" problem that Calibration cannot detect. However, since you cannot observe the rejected, you have no choice but to assume the approved population is representative enough for calibration checks. This is the least-bad option available.

  **Final Verdict Logic:**
  *   **Pass:** Model is Calibrated across groups AND Disparate Impact is within legal limits OR justified by risk differences.
  *   **Fail:** Model is Miscalibrated (score means different things for different groups) OR Disparate Impact exists without risk-based justification.

  This gives your committee a single verdict, respects the legal framework, and relies only on data you actually have.
