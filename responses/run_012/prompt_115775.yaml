answer: |-
  Your colleague is playing a dangerous game, though one familiar to those who dwell in the schools. She claims to be a mirror for Aquinas, but a mirror that reflects only what she chooses to angle toward the light. To anticipate her verdict on this fourth case, we must first dissect the logic binding the first three. The three stable verdicts form a triangle of constraints: they distinguish between the *source* of authority (usurper vs. hereditary), the *agent* of removal (private vs. public), and the *consequences* of the act (order vs. war).

  Here are the three candidate rules that fit her earlier verdicts, how they fracture on the new case, and where the truth likely lies.

  ### I. The Candidate Rules

  **1. The Jurisdictional Rule (The Title Principle)**
  *   **Principle:** Legitimacy of title is the sole determinant of immunity. A usurper (*tyrannus ex parte*) holds no office and is a private aggressor; a legitimate ruler (*tyrannus ex titulo*), however oppressive, holds public authority. Private citizens lack the *jurisdiction* to judge or execute a public authority. Only a superior public body can depose a legitimate ruler.
  *   **Fit:**
      *   *Case 1:* Usurper has no title → Private killing is defense against aggression (Permissible).
      *   *Case 2:* Legitimate title → Private killing is sedition (Unlawful).
      *   *Case 3:* Legitimate title → Public body has jurisdiction to depose (Permissible).
  *   **Prediction for Target Case:** **Unlawful.** The monarch is hereditary (legitimate title). The agent is private (no jurisdiction). The absence of a public body does not create jurisdiction where none exists; it merely leaves a vacuum. The citizen usurps the sword.

  **2. The Forfeiture Rule (The Treason Principle)**
  *   **Principle:** Legitimacy is conditional on the common good. A ruler who actively betrays the realm (e.g., handing it to a foreign power) forfeits his title by his own act, effectively becoming a usurper or a public enemy. At that point, he may be treated as a private aggressor.
  *   **Fit:**
      *   *Case 1:* Usurper has no title → Permissible.
      *   *Case 2:* Oppression is abuse of power, not forfeiture of title → Unlawful.
      *   *Case 3:* Severe oppression + Public act confirms forfeiture → Permissible.
  *   **Prediction for Target Case:** **Permissible.** The act of handing the realm to a foreign power is *high treason* against the polity itself. This voids the hereditary claim. The tyrant is no longer a monarch but an invader. The private citizen acts in defense of the community, analogous to Case 1.

  **3. The Scandal Rule (The Prudential Principle)**
  *   **Principle:** Tyrannicide is governed by the law of double effect and the avoidance of scandal. Even if a tyrant deserves death, a private citizen may not kill him if the act will likely cause greater disorder (war, faction) than the tyranny itself.
  *   **Fit:**
      *   *Case 1:* Restoration without bloodshed → No scandal (Permissible).
      *   *Case 2:* Succession war ensues → Greater harm (Unlawful).
      *   *Case 3:* Public act implies constitutional order → No scandal (Permissible).
  *   **Prediction for Target Case:** **Unlawful.** The prompt stipulates a "long and devastating war follows." The harm outweighs the good. The citizen is responsible for the foreseeable consequences of his private judgment.

  ### II. Where the Rules Come Apart

  These rules converge on Cases 1–3 because the variables are aligned: in Case 1, the title is bad and the outcome is good; in Case 2, the title is good and the outcome is bad; in Case 3, the authority is public.

  They come apart on the **Target Case** because it isolates the variables that were previously bundled.
  *   **Title vs. Act:** The monarch has legitimate *title* (favoring Jurisdictional Rule) but commits an act of *treason* (favoring Forfeiture Rule).
  *   **Authority vs. Consequence:** The agent is *private* (favoring Jurisdictional Rule) and the consequence is *disastrous* (favoring Scandal Rule).

  The **Forfeiture Rule** stands alone in predicting **Permissibility**. It argues that the tyrant's act of betrayal collapses the distinction between Case 1 (Usurper) and Case 4 (Traitor).
  The **Jurisdictional** and **Scandal** rules both predict **Unlawfulness**, but for different reasons. The Jurisdictional Rule says the act is *intrinsically* wrong (usurpation of authority), regardless of consequences. The Scandal Rule says the act is *contingently* wrong because of the war. If the war *had not* happened, the Scandal Rule might permit it, but the Jurisdictional Rule would still forbid it.

  ### III. Her Likely Verdict and Reasoning

  She will say the assassination was **Unlawful**.

  **Grounds:** She claims to be reporting Aquinas. While the Forfeiture Rule has scholastic pedigree (echoing John of Salisbury or later Monarchomachs), Aquinas himself is notoriously cautious on private tyrannicide. In *De Regno* and the *Summa Theologiae* (II-II, Q. 42), Aquinas emphasizes that removing a tyrant is a *public* function. He explicitly warns that private assassination often leads to worse tyranny or civil strife (the logic of your Case 2).

  For Aquinas, the "public person" is not just a functionary but the embodiment of the community's unity. A private citizen, by killing a legitimate ruler, fractures that unity, even if the ruler is wicked. The absence of a public assembly (the dissolved courts) is a tragedy to be endured or prayed over, not a license for private violence. To allow private judgment on the forfeiture of title is to invite the very anarchy the tyrant creates.

  Therefore, she will argue that the **Jurisdictional Rule** is the primary constraint, reinforced by the **Scandal Rule**. The citizen lacked the *auctoritas* (authority) to act, and the *scandalum* (war) confirms the imprudence of the act. She will likely cite Aquinas's distinction: against a usurper, anyone may defend the realm; against a legitimate tyrant, only the realm itself (via its superiors) may act.

  ### IV. The Test Case

  To force her to choose between the **Jurisdictional Rule** (Intrinsic wrongness of private action) and the **Scandal Rule** (Wrongness due to bad outcomes), you must stage a case where the *outcome* is guaranteed to be good, but the *authority* remains private.

  **The Case:** A legitimate hereditary monarch is preparing to hand the realm to a foreign power. The assembly is dissolved. A private citizen assassinates him. The monarch's brother succeeds immediately, the foreign power is deterred by the display of resolve, and **no war ensues**; the realm enters a golden age of peace.

  *   **If she says Permissible:** She is running the **Scandal Rule** (or Forfeiture). The absence of negative consequences validates the private act.
  *   **If she says Unlawful:** She is running the **Jurisdictional Rule**. The private citizen usurped a public function, which is intrinsically disordered, regardless of the happy outcome.

  Given her claim to Aquinas, she should say **Unlawful**. Aquinas is a deontologist regarding authority; the order of justice is not solely determined by consequences.

  ### V. Where the Verdicts Are Her Own

  She claims "nothing she says is her own invention." This is the one thing that is certainly her invention.

  1.  **Systematization:** Aquinas did not write a casebook. He wrote disputations, commentaries, and pastoral Summas. His remarks on tyranny are scattered and occasionally tension-filled (e.g., between the duty to obey and the duty to resist sin). Your colleague has constructed a coherent, consistent *system* from these fragments. That coherence is her intellectual labor, not Aquinas's explicit doctrine.
  2.  **Certainty:** Aquinas often speaks in terms of probability and risk ("it is dangerous," "it is to be feared"). Your colleague speaks in verdicts ("unlawful," "permissible"). She has converted Thomistic prudence into Thomistic jurisprudence.
  3.  **The "Forfeiture" Boundary:** In Case 3, she permits public execution for "advanced oppression." Aquinas is vaguer on where oppression becomes forfeiture. Her drawing a bright line between Case 2 (endure) and Case 3 (depose) is a scholarly interpretation, not a direct quote.

  **Conclusion:**
  She will rule the assassin **Guilty**. She will argue that a private citizen cannot judge the forfeiture of a king, lest every malcontent become a judge. But you should press her on the **Test Case**. If she admits that a "clean" private killing of a legitimate tyrant is still wrong, she admits that her system prioritizes *order* over *justice* in a way that is distinctly Thomistic—and distinctly uncomfortable for modern readers. If she hesitates, you will know that the "Forfeiture" rule is her own hope leaking through the text, and that the book she is finishing is more her own than she claims.
