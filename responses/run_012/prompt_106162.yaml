answer: |-
  This is a sophisticated pivot. Your professor is effectively asking you to move from *ontology* (what happened) to *social epistemology* (how a community decides what counts as knowledge). This reframes the Trojan War, Arthur, and Exodus not as puzzles to be solved, but as case studies in the evolution of historical consciousness.

  If you have a year and no shovel, your primary tool is textual criticism and reception history. You are looking for the moment a narrative stops being a *monument* (to be revered) and starts being a *hypothesis* (to be tested).

  Here is how I would structure that year, prioritizing questions based on their logical dependency (upstream vs. downstream) and their tractability from a desk.

  ### The Upstream Anchor: Defining the Signal

  The single question you must get clear on first is this: **What are the specific rhetorical markers that indicate an ancient or medieval author considers a foundational claim vulnerable to disproof?**

  This is the upstream bottleneck. You cannot trace the *spread* of falsifiability if you cannot identify its *presence*. In modern science, falsifiability is explicit (methods, data). In pre-modern historiography, it is coded. It might look like Thucydides dismissing Homer's numbers, or a Biblical redactor leaving two contradictory accounts side-by-side without harmonizing them, or Geoffrey of Monmouth citing a "very old book" that no one else has seen.

  You need to spend the first three months building a taxonomy of "epistemic vulnerability." You aren't looking for truth; you are looking for *risk*. When does an author stake their reputation on a claim that could be embarrassed by a rival text or a physical ruin?

  **Why this comes first:** If you cannot distinguish between a poet embellishing a myth and a historian testing a claim, your entire paper collapses into semantics. This is the only question that determines whether your professor's framing is even operational.

  **Tractability:** High. You can do this via close reading of key historiographical shifts (e.g., Herodotus to Thucydides; the Deuteronomistic History to Chronicles; Nennius to William of Malmesbury). You are looking for linguistic markers: hedging language, appeals to eyewitness testimony, citations of conflicting sources, or admissions of ignorance.

  **What moves this up or down:** If you find that these markers are present in the earliest layers of all three traditions (e.g., if the Iliad itself contains internal skepticism), the "threshold" theory fails, and you must pivot to *why* skepticism was suppressed later. If the markers appear suddenly and distinctly, this question confirms your thesis and becomes the core of your argument.

  ### The Midstream Investigation: The Infrastructure of Verification

  Once you can identify the *rhetoric* of falsifiability, the next logical question is: **What material or institutional conditions allowed a community to treat a story as testable?**

  This is midstream because it explains the *mechanism* of the shift you identified upstream. A community cannot treat a claim as falsifiable if they lack the means to check it. This question moves you from "what did they say?" to "what could they do?"

  For Troy, this involves the rise of travel literature and the identification of physical ruins (e.g., Hellenistic tourists visiting Hisarlik). For Exodus, it involves the development of textual criticism and the comparison of manuscript traditions. For Arthur, it involves the monastic preservation of chronicles and the political need to verify lineage for land claims.

  **Tractability:** Moderate to High. This relies on secondary literature regarding the history of libraries, literacy rates, travel networks, and the politics of patronage. You don't need to dig; you need to synthesize existing scholarship on the *sociology* of these texts.

  **What moves this up or down:** If you discover that the rhetorical markers of falsifiability appear *before* the infrastructure exists (e.g., authors claiming to test things they couldn't possibly verify), this question moves down. It suggests the "falsifiability" is merely a literary pose, not a genuine epistemic shift. If the infrastructure precedes the rhetoric, this question moves up, suggesting that material access drives historical consciousness.

  ### The Downstream Consequence: The Cost of Disproof

  The final tier of questions concerns the *stakes*: **What happens socially when a foundational myth is successfully falsified?**

  This is downstream because it depends on the first two. Once a community accepts that a story *can* be wrong, what is the penalty for proving it wrong? Does the author get exiled (like Socrates, though for different reasons)? Is the text suppressed? Or is the history rewritten without social rupture?

  This matters because it defines the *limit* of the threshold. A community might treat a story as falsifiable in theory but treat falsification as treason in practice.

  **Tractability:** Moderate. This requires looking at reception history and biography. How were controversial historians treated? (e.g., The treatment of Spinoza regarding Biblical authorship, or the reception of skeptical Arthurian scholars in the Tudor period).

  **What moves this up or down:** If you find that falsification carried no social cost, the "threshold" is less significant—it was an intellectual game, not a cultural transformation. If the cost was high, this question becomes crucial for explaining why the threshold was crossed so slowly.

  ### The Research Trajectory

  If I were writing this paper, I would structure the argument to mirror this logical flow.

  1.  **Establish the Taxonomy (Months 1-3):** Focus entirely on that first question. Pick one clear example from each tradition where an author explicitly doubts a predecessor. Code the language they use. Prove that "falsifiability" has a detectable signature.
  2.  **Map the Emergence (Months 4-6):** Apply that taxonomy across the timeline. When does the frequency of these markers increase? This gives you the "when" without needing to prove the "what."
  3.  **Analyze the Constraints (Months 7-9):** Investigate the infrastructure and social cost questions to explain *why* the emergence happened when it did.
  4.  **Synthesize (Months 10-12):** Argue that the transition from legend to history is not about the accumulation of evidence, but about the *legitimization of doubt*.

  ### The Single Most Important Question

  To return to your specific constraint: If you must name the single question to get clear on first, it is the upstream one: **What are the specific rhetorical markers that indicate an ancient or medieval author considers a foundational claim vulnerable to disproof?**

  **Why:** Because your professor's framing rests on the concept of "treating it as falsifiable." That is a psychological and linguistic state, not an archaeological one. If you cannot define what that treatment looks like in the text, you cannot measure it. You risk projecting modern scientific concepts onto pre-modern minds (anachronism).

  By solving this first, you protect yourself from the trap of debating whether Troy *actually* existed. Instead, you debate whether Hecataeus of Miletus *thought it mattered* if Troy existed. That is a question you can answer from a desk, with texts, in a year. It transforms your paper from a review of evidence into a critique of historical consciousness, which is exactly what a historiography seminar demands.

  If you find that these markers are ambiguous or non-existent, you have a negative result that is still a valid paper: it would argue that the "threshold" your professor proposed is a modern illusion, and that pre-modern communities operated on a fundamentally different epistemology where "truth" was not binary. That is a publishable insight. But you only get there by defining the markers first.
