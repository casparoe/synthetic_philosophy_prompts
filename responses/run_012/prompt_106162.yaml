      *   It aligns with concepts like "social memory," "invented traditions," and the sociology of knowledge.
      *   The key phrase is "treating it as falsifiable." This implies a shift from *mythos* (sacred, immutable) to *logos* (rational, debatable, evidence-based).
      *   *Challenge:* Ancient communities rarely explicitly said, "We are now testing this hypothesis." The shift is often implicit in how they argue, cite sources, or handle contradictions.

  3.  **Brainstorming Open Questions (Desk-Based):**
      *   *Q1:* When did ancient authors start citing conflicting sources?
      *   *Q2:* When did they start appealing to physical evidence (ruins, inscriptions) to verify a story?
      *   *Q3:* How did the definition of "witness" change?
      *   *Q4:* When did skepticism become a valid rhetorical stance regarding foundational myths?
