answer: |-
  This is a classic debate. Your friend is articulating a version of **Jaegwon Kim's Causal Exclusion Argument**, using the "Two Shooters" analogy as an intuitive pump for the principle of **No Overdetermination**.

  The analogy is doing heavy lifting, but it is also hiding the technical premises. If you expose the mapping, you'll see the analogy breaks in ways that protect non-reductive physicalism.

  Here is the walkthrough, the stress-test with your examples, and the final verdict.

  ---

  ### 1. The Argument Underneath the Analogy

  The analogy isn't the argument itself; it's an illustration of the **Exclusion Principle**. The formal argument looks like this:

  1.  **Causal Closure:** Every physical event (behavior) has a sufficient physical cause (brain state).
  2.  **Distinctness:** The mental event is distinct from the physical event (Non-reductive Physicalism).
  3.  **No Overdetermination:** Effects are not systematically caused by two *independent* sufficient causes (unless it's a rare accident, like two shooters).
  4.  **Conclusion:** Therefore, the mental event does not cause the behavior. (It is epiphenomenal).

  Your friend uses the **Two Shooters** picture to make Premise 3 feel obvious. In the wild, two bullets killing one guy is a freak accident. If it happened every time, we'd suspect a conspiracy. He argues that if mental causation happens every time alongside physical causation, it's a "conspiracy" of nature, which is absurd.

  ### 2. Mapping the Analogy (and Where It Breaks)

  Here is how your friend's picture maps onto the metaphysics, and where the glue dissolves.

  | The Analogy | The Metaphysics | The Critical Break |
  | :--- | :--- | :--- |
  | **The Victim** | The Bodily Movement (Behavior) | *Maps well.* Both are the effect. |
  | **Shooter A** | The Neural Event (Physical Cause) | *Maps well.* Both are sufficient causes. |
  | **Shooter B** | The Mental Event (Mental Cause) | **BREAK 1:** Shooters are independent; Mind/Brain are not. |
  | **The Bullets** | The Causal Powers | **BREAK 2:** Bullets are distinct objects; Mind/Brain may be one event. |
  | **The Coincidence** | Systematic Causation | **BREAK 3:** Shooters are accidental; Mind/Brain is law-like. |

  #### Break 1: Independence vs. Supervenience
  Two shooters are **modally independent**. Shooter A could fire without Shooter B.
  In non-reductive physicalism, the mental **supervenes** on the physical. If the neural event occurs, the mental event *must* occur (given the laws of nature). You cannot have the "mental bullet" without the "neural bullet."
  *   **Why this matters:** Overdetermination requires independent causal chains. If the mental is tied to the physical by metaphysical necessity, they are not competing causes; they are linked aspects of one causal process.

  #### Break 2: Two Events vs. One Event
  Your friend's picture assumes **Event Dualism** (two distinct happenings).
  Many non-reductive physicalists (following Donald Davidson) hold **Anomalous Monism**: There is only *one event*, described in two vocabularies.
  *   **Analogy Fix:** It's not two shooters; it's one shooter described as "The Assassin" and "The Man in Black." If the Assassin kills the victim, the Man in Black kills the victim. There is no overdetermination because there is only one killing.
  *   **Friend's Counter:** He will say properties are distinct even if events are identical. (The event has the property of *being neural* and *being a belief*). This leads to Break 3.

  #### Break 3: Accident vs. Realization
  The two shooters is a **causal accident**.
  The mind-brain relation is **constitutive**. The mental property is *realized by* the physical property.
  *   **Why this matters:** Systematic overdetermination is absurd for accidents (shooters). It is expected for realization (see the test cases below).

  ---

  ### 3. The Test Cases: Statues, Water, and Digestion

  You asked to run the analogy on cases nobody thinks are causally idle. This is the **"Proves Too Much"** objection.

  **Case A: The Statue and the Clay**
  *   **Scenario:** A clay statue falls on a scale. The clay's mass breaks the scale. The statue's mass breaks the scale.
  *   **Friend's Logic:** The clay's mass is sufficient. If the statue's mass also causes it, we have two sufficient causes for one effect. Is the statue's weight a "shadow"?
  *   **Verdict:** If your friend says "Yes, the statue does nothing, only the clay does," he is an **eliminativist about macro-objects**. He must admit tables, chairs, and statues don't really cause anything.
  *   **If he says "No":** Then he admits that higher-level properties (statue-weight) can cause things even if lower-level properties (clay-weight) are sufficient. This destroys Premise 3 (No Overdetermination) for *all* macro-causation, not just mental.

  **Case B: Boiling Water**
  *   **Scenario:** Water boils (molecular agitation) and scalds my skin.
  *   **Friend's Logic:** The molecular motion is sufficient to transfer heat. Is the "boiling" (the macro state) redundant?
  *   **Verdict:** If "boiling" is causally idle, then thermodynamics is an illusion; only particle physics does work. Most physicalists want to save thermodynamics. If they save thermodynamics, they must allow macro-properties to have causal efficacy despite micro-sufficiency.

  **Case C: Digestion**
  *   **Scenario:** Chemical breakdown puts on weight. "Digestion" puts on weight.
  *   **Verdict:** Same as above.

  **The Implication:**
  If your friend accepts that the statue breaks the scale, he has accepted **Systematic Overdetermination** (or a non-competitive causal relation) for physical objects.
  *   **If Yes:** He cannot use "Systematic Overdetermination is absurd" to kill mental causation. He must explain why the mental is *worse* than the statue. (Usually, he can't).
  *   **If No:** He saves his argument against the mind, but at the cost of eliminating causation for statues, boiling water, and digestion. This is a bullet most philosophers refuse to bite.

  ---

  ### 4. The Premise Trade-Off (Where the Battle Lies)

  To resolve this, someone has to give up a premise. Here is the landscape:

  1.  **Give up Causal Closure:** (Interactionist Dualism). The brain event isn't sufficient; the mental adds energy. *Cost:* Violates physics.
  2.  **Give up Distinctness:** (Reductive Physicalism). The mental *just is* the neural. *Cost:* Loses Non-Reductive Physicalism (your friend wins, but the view changes).
  3.  **Give up No Overdetermination:** (Compatibilism). Accept that effects have sufficient micro and macro causes. *Cost:* Requires a new theory of causation (e.g., Determinable/Determinate).
  4.  **Give up Mental Causation:** (Epiphenomenalism). The mind is a shadow. *Cost:* Makes belief and desire irrelevant to action (pragmatically self-defeating).

  **The Better Picture:**
  The "Two Shooters" picture is the wrong image. A better image is **Determinable vs. Determinate**.
  *   **Picture:** I turn on the light by flipping the switch.
  *   **Determinate Cause:** Flipping the switch *up*.
  *   **Determinable Cause:** Flipping the switch *some way*.
  *   Both cause the light to go on. They are not competitors. The determinable (Mental) causes the effect *in virtue of* the determinate (Physical) realizing it. They don't fight for causal space; one *is* the specific way the other happens.

  ---

  ### 5. Correspondence Table & Final Verdict

  | Feature | Friend's "Two Shooters" Picture | Non-Reductive Physicalist Picture | Who Wins? |
  | :--- | :--- | :--- | :--- |
  | **Relation** | Independent (Contingent) | Dependent (Supervenience/Realization) | **NRP** (Friend's analogy fails here) |
  | **Frequency** | Rare Accident | Law-like / Necessary | **NRP** (Systematicity is expected in realization) |
  | **Ontology** | Two Events / Two Objects | One Event / Two Properties (or Realized/Realizer) | **Debatable** (Depends on event theory) |
  | **Macro-Objects** | Implies Statues don't break scales | Statues break scales via clay | **NRP** (If friend accepts statues, he loses the argument) |
  | **Causal Power** | Competitive (Zero-sum) | Inherited / Non-competitive | **NRP** (Causation isn't zero-sum) |

  #### Straight Answer: Does his conclusion survive?

  **No, not if he wants to remain a physicalist about everything else.**

  1.  **The Analogy is Flawed:** It assumes independence where there is dependence (supervenience). Overdetermination requires independent causal chains. Mind and Brain are not independent.
  2.  **The "Proves Too Much" Trap:** If he insists that sufficient physical causes exclude mental causes, he must also admit that sufficient micro-physical causes exclude macro-physical causes (statues, boiling water). If he accepts that statues break scales, he must accept that mental events move bodies.
  3.  **The Verdict:** His conclusion (that the mental is causally idle) only survives if he is willing to be an **eliminativist about all macro-causation**. If he thinks digestion or weight actually causes anything, he has to abandon the "No Overdetermination" premise as it applies to realized properties.

  **Your Move:** Ask him: *"Does the statue break the scale, or does only the clay?"*
  *   If he says **The Statue**, ask why the mind is different from the statue.
  *   If he says **Only the Clay**, ask him if he believes tables and chairs exist as causal agents. If not, he's not arguing against non-reductive physicalism; he's arguing for eliminative materialism about the macro-world entirely.

  The "Two Shooters" analogy is a rhetorical trap. It smuggles in the idea that causation is a limited resource (like one bullet slot) when most modern metaphysics treats it as something that can be inherited or realized across levels.
