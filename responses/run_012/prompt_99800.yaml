answer: |-
  Subject: Thoughts on your decision procedure and the Thursday night copy desk

  Hi there,

  It is rare to see a high school editor grappling with the ethics of implicature so seriously, and I want to start by saying that your faculty adviser is right to worry about the technically accurate false impression, but you are right to try to systematize it rather than just relying on a gut feeling. Gut feelings vary under pressure, and Thursday night is high pressure. Your vocabulary of assertion, steer, and escape hatch is a strong foundation, but to make it work for sophomores with twenty minutes to spare, we need to tighten the screws on how they apply it. Here is how I would translate your theory into a linear procedure they can run at the desk without needing to debate philosophy.

  The first step your editors must take is to isolate the assertion and verify its literal truth against the reporting notes. This is a binary check. If the sentence is factually false on its face, the procedure stops immediately with a no, and the sentence must be corrected or killed. There is no need to consider steers or escape hatches if the assertion itself is broken. If the assertion passes this truth test, they move to the second step, which is to identify the steer. They should ask themselves what an ordinary reader, reading quickly on a bus or at breakfast, will believe after reading this sentence. They need to write down that belief explicitly. If they cannot identify a steer, meaning the sentence seems to carry no implication beyond its literal meaning, they should flag it as potentially empty or confusing, but usually, they will find a steer. Once the steer is identified, they must look for the escape hatch. This is the specific technical condition that makes the assertion true despite the steer being false or unsupported. If there is no escape hatch, meaning the assertion and the steer align perfectly with the full truth, the sentence is clean. If there is an escape hatch, they proceed to the final test of reasonableness. They must ask if a reasonable reader would ever naturally assume the escape hatch condition without being told. If the answer is no, meaning the escape hatch is too strained for a normal person to conceive, the sentence functions as a lie and must be killed. If the answer is yes, meaning a reasonable reader could assume the honest reading but probably would not, the sentence is merely misleading. This is the hand-off point. At this stage, the procedure stops being about meaning and starts being about values and risk. The editors cannot decide this alone. They must pass the sentence to you or the faculty adviser to decide if the misleading impression is justified by safety or narrative necessity, or if it violates the paper's integrity.

  Now let us run this procedure on your three examples, and I will be as direct as you asked me to be. Starting with the cafeteria contract story, the sentence is the district has not raised meal prices since 2019. The assertion is literally true based on your records, so it passes step one. The steer is clearly that the cost of lunch for families has remained stable or that the district is not contributing to the financial burden. The escape hatch is that while prices did not rise, portion sizes were cut in 2022, effectively raising the cost per calorie. A reasonable reader would not assume portion sizes changed when reading about prices, so the escape hatch fails the reasonableness test. This functions as a lie under your definition, or at best a heavily misleading statement that requires context. Because it creates a false impression about affordability using a technical truth, this should be handed to the adviser. It likely needs a qualifier about portion sizes or should be cut to avoid implying the district is innocent of the struggle.

  Moving to the schedule-change story, we have the sentence the principal declined to comment. The assertion here is that the principal refused an opportunity to speak. Your note says this is true only in the sense that nobody asked her. If nobody asked her, she could not decline. Therefore, the assertion is factually false. The procedure stops at step one with a no. This is not a case of misleading steering; it is a fabrication of an event that did not occur. You cannot print this. It must be changed to reflect that the administration was contacted but did not respond, or that no comment was requested, depending on the actual facts. This is not a call for the adviser regarding values; it is a call for you regarding accuracy.

  Finally, we have to talk about your headline from the last issue, Board votes unanimously to keep the library open. The assertion is that the board voted unanimously. Technically, the four members present did vote unanimously, so there is an escape hatch regarding the three absent members. The steer is that the entire board, representing the whole community, was in agreement. A reasonable reader assumes Board means the full governing body, not just the quorum present. The escape hatch relies on parliamentary procedure knowledge that most students and parents do not have. This fails the reasonableness test. It is misleading. You suspected the procedure would tell you to pull this, and I am telling you plainly that you should have qualified it. It should have read Board members present vote unanimously or similar. Printing it as is claims a mandate you do not have. You need to correct this in the next issue or online, because while it might feel like a victory for the library, it undermines your credibility if people realize three members were absent and possibly opposed.

  This brings me to your question about where your vocabulary breaks down, and your intuition about the principal sentence is correct. The model of assertion, steer, and escape hatch assumes that the assertion is a stable platform from which the steer launches. In the cafeteria and headline examples, the assertions are stable truths that point in the wrong direction. However, in the principal example, the assertion itself collapses because it relies on a conversational presupposition. When we use the word declined, we presuppose an offer was made. If no offer was made, the sentence does not just mislead; it lacks a truth condition entirely, or it is simply false. There is no steer here because there is no valid assertion to carry it. It is a hole where a fact should be, as you said. Your vocabulary handles implicature well, which is the steering of true statements, but it does not inherently catch presupposition failure, which is the asserting of false premises as if they were true. For your sophomores, you should add a preliminary check to the procedure asking if the sentence relies on unstated premises like an offer being made or a meeting occurring. If those premises are false, the assertion is false, and they should not waste time looking for an escape hatch.

  You are doing important work, and the fact that you are losing sleep over the distinction between lying and misleading shows you understand the weight of the editor's chair. The procedure above should help your staff separate the mechanical errors from the ethical ones, and it should protect you from printing things like the principal quote that damage trust instantly. Keep the adviser in the loop on the misleading calls, because those are the ones where journalism meets politics, and you should not have to carry that burden alone on a Thursday night. Let me know how the next press run goes.

  Best regards

  A Colleague
