answer: |-
  Let us begin by mapping the conceptual terrain. To treat *de mortuis nil nisi bonum* as a monolithic block is to misunderstand its philosophical utility. When your colleague invokes it, she is reaching for a tool, but we must determine which tool it is. Is it a shield for the grieving? A gag order for the critic? A metaphysical claim about the survival of the self? Or a social heuristic for maintaining order?

  I have surveyed the logical space of possible interpretations. We can distinguish between norms grounded in **manners** (etiquette), **procedure** (fairness), **consequences** (harm to others), and **ontology** (the status of the dead). We must also distinguish between the **private sphere** (funerals, family conversations) and the **public sphere** (history, biography, cinema).

  Here is the menu of readings, ordered from the trivial conventions of politeness to the radical subordination of truth.

  ***

  ### I. The Menu of Readings

  #### 1. The Rule of Mourning Etiquette
  *   **The Claim:** This is merely a norm of situational propriety. Just as one does not discuss bankruptcy at a wedding, one does not discuss moral failings during the immediate period of mourning or in eulogistic contexts.
  *   **Plausibility:** High. This is the most common sociological function of the phrase. It governs *speech acts* in specific *contexts*.
  *   **Moral Work vs. Prejudice:** It encodes a benign social lubricant. It prevents unnecessary pain in vulnerable moments. It does not claim the bad things didn't happen, only that *now* is not the time to say them.
  *   **Licenses the Objection?** **No.** A prestige biopic is not a eulogy, nor is it a funeral. It is a work of public history and art released decades (presumably) after the fact. This reading collapses when the context shifts from private grief to public record.

  #### 2. The Principle of Procedural Fairness
  *   **The Claim:** The dead cannot answer back. To criticize them is to engage in a rigged trial where the defendant is absent. Silence is demanded by fairness, not respect.
  *   **Plausibility:** Moderate. It appeals to our intuition about due process.
  *   **Moral Work vs. Prejudice:** It does genuine moral work regarding *unverified* accusations. However, it risks conflating *criticism* with *prosecution*. Biography is not a court of law; it is an interpretive act.
  *   **Licenses the Objection?** **Weakly.** If the film relies on rumors, this objection holds. But if the "cruelty" and "monstrous endorsement" are matters of historical record (letters, public speeches, witness testimony), the dead had their chance to answer while alive. The film is judging the record, not ambushing the man.

  #### 3. The Protection of the Grieving (Harm to Survivors)
  *   **The Claim:** The maxim is not about the dead at all, but about the living relatives. Speaking ill causes fresh pain to those who loved him.
  *   **Plausibility:** High. This is often the real engine behind the objection.
  *   **Moral Work vs. Prejudice:** It acknowledges real psychological harm. However, it privileges the comfort of the family over the public's right to truth. It can encode a prejudice that family reputation is more important than historical accuracy.
  *   **Licenses the Objection?** **Partially.** If the film is gratuitously cruel, this holds weight. But if the "monstrous cause" is a matter of public significance, the family's discomfort cannot veto historical accountability. Public figures trade some privacy for influence; their heirs inherit that exposure.

  #### 4. The Social Utility of Myth (Civic Religion)
  *   **The Claim:** Society requires heroes to function. Tearing down revered figures destabilizes moral order and discourages future philanthropists. We preserve the reputation because we need the *idea* of the man, not the man himself.
  *   **Plausibility:** Moderate to High (historically). This is the Platonic "noble lie" approach.
  *   **Moral Work vs. Prejudice:** It is utilitarian. It sacrifices truth for stability. It encodes a paternalistic prejudice: the audience cannot handle complex, flawed heroes.
  *   **Licenses the Objection?** **Yes.** If one believes the film threatens the social good by tarnishing a symbol of scientific benevolence, this reading supports the objection. However, it requires proving that knowing the truth causes more harm than living a lie.

  #### 5. The Posthumous Interest Theory (Metaphysics of Harm)
  *   **The Claim:** The dead retain interests, specifically in their reputation and narrative identity. Damaging their reputation is a genuine harm *to them*, even if they cannot feel it. (Feinberg's view).
  *   **Plausibility:** Controversial. It requires a metaphysics where "interests" survive the extinction of the subject.
  *   **Moral Work vs. Prejudice:** It grants the dead moral standing. It treats reputation as a form of property that survives death.
  *   **Licenses the Objection?** **Yes.** If the dead have a right to a good reputation, the film violates that right. However, this right is usually forfeited by public actions. If he endorsed a "monstrous cause," he arguably waived the right to a sanitized legacy.

  #### 6. The Moral Sanitization Imperative (Radical)
  *   **The Claim:** Truth is secondary to edification. We *ought* to lie about the dead if the truth is ugly, because the purpose of memory is moral instruction, not factual accuracy.
  *   **Plausibility:** Low in modern secular ethics, though high in hagiographic traditions.
  *   **Moral Work vs. Prejudice:** This is the most radical reading. It explicitly subordinates epistemic virtue (truth) to moral utility (goodness). It encodes a deep distrust of ambiguity.
  *   **Licenses the Objection?** **Absolutely.** This reading demands the third act be cut. It claims the biographer's duty is to make the dead *better*, not to make them *real*.

  ***

  ### II. Diagnosis and Implication

  **Which reading is in play?**
  When a colleague reaches for *de mortuis nil nisi bonum* to shut down an argument about a dramatized life in a public forum, they are typically engaging in a **motivated conflation of Readings 2 and 6**.

  They present it as **Procedural Fairness** (Reading 2: "He can't defend himself"), which sounds reasonable and principled. But they are usually motivated by **Moral Sanitization** (Reading 6: "This ugliness shouldn't be part of his story"). They want the comfort of the hero myth (Reading 4) but justify it with the language of fairness. This is a rhetorical sleight of hand. It treats a public historical reckoning as if it were a private slander suit.

  **What this implies for the Biographer's Duty:**
  The choice among these readings defines the contract between the biographer, the dead, and the audience.

  1.  **If we accept the Trivial/Etiquette reading:** The biographer owes the dead nothing once the mourning period ends. The duty is entirely to the audience.
  2.  **If we accept the Posthumous Interest reading:** The biographer has a fiduciary duty to the subject's reputation, akin to an executor of an estate. This turns biography into public relations.
  3.  **The Philosophical Verdict:**
      As a philosopher of historical representation, I argue that **Reading 5 (Posthumous Interests) is the only one with genuine moral weight, but it is self-negating in this case.**
      
      If a person has interests that survive death, those interests are grounded in the projects and values they held *in life*. A scientist who values truth has an interest in the truth being told, even if it damages his reputation. A philanthropist who values social progress has an interest in society understanding the dangers of the "monstrous causes" he endorsed.
      
      To sanitize the biography is not to protect the dead man's interests; it is to **betray** them. It treats him as a doll to be dressed up, rather than an agent whose life (including its errors) has instructive value.

  **Conclusion for the Panel:**
  Your colleague's objection relies on the maxim functioning as a gag order on truth. But *de mortuis nil nisi bonum* was originally a rule of *charity*, not of *censorship*. It applies to the *motives* of the speaker (do not speak ill out of spite) rather than the *content* of the speech (do not speak ill even if true).

  If the film refuses to look away from his cruelty and his monstrous endorsements not to sensationalize, but to render a complete moral account, it is not violating the maxim. It is fulfilling the higher duty of history. The dead do not own the truth. The living do. And we cannot learn from the past if we are forbidden to speak its name.

  You should not be moved by the objection unless you believe the film is factually wrong. If it is factually right, the maxim is being misused to protect a myth at the expense of the very truth the scientist claimed to serve.
