answer: |-
  Good evening.

  For those of you who don't know me, I'm the outgoing Chair. For those of you who do, I'm the person who has been in this room for nineteen years, five of them as Chair, which is long enough to know that ten minutes is a gift and a trap.

  My husband's family is here tonight. They are lovely people, and for nearly two decades they have told their friends I work in "environmental something." They know I wear a suit to work, they know I come home tired, and they know that when the news reports a chemical spill, I turn the volume up. To them, and to the legislators in the back: thank you for letting me serve. To the industry representatives here: thank you for engaging with us, even when that engagement is contentious. We share the same air and water, and that makes us neighbors whether we like it or not.

  But the heart of this room is in the front row.

  I see the activists who lobbied for this agency in the eighties. I see the toxicologists who wrote the first screening rules. I see the retired Judge who chaired this board for a decade. You built this house. You wrote the statute that codified the precautionary principle into law. You decided that when the science is uncertain but the risk is plausible, we act first and ask questions later. You decided that the benefit of the doubt belongs to the public, not the product.

  I stand here tonight owing you a debt I cannot repay.

  I also stand here with a responsibility to be honest about where we go from here. As many of you know, the Board recently voted to change how we handle restrictions based on plausible but unproven hazards. Under the new protocol, when we restrict a chemical, that restriction carries a mandatory review date. The duty to bring new evidence to the Board rests with the agency. If we cannot return within the window with evidence of harm—something better than "we still don't know"—the restriction lapses automatically.

  I am not going to stand at this podium and use ten minutes of jargon to explain why this is actually the same as what we did before. It isn't.

  The founders in the front row hear this as a shift in the burden of proof. You hear it as moving us away from "restrict until proven safe" toward "restrict until proven dangerous." And you are right to hear it that way.

  **I will not tell you this new rule does not shift the burden, because it does, but I will tell you it forces us to finally answer the question we have avoided for thirty years: what does "clean" actually look like?**

  That is the sentence I need you to hear.

  Our Science Director argued for this change not because it is easier, but because it is necessary. For thirty years, we have been very good at identifying what might hurt us. We have been less honest about defining what it looks like when something *doesn't*. If we cannot define what "evidence came in clean" looks like, then our restrictions are not based on science; they are based on fear. And while fear is a useful survival mechanism, it is not a regulatory framework.

  I know this lands heavily. I know that for the activists who fought to create this agency, this feels like a retreat. It feels like we are handing ground back to industry. To the industry folks in the back: do not mistake this for an invitation to wait us out. The requirement to define "clean" is a high bar. It demands data that is transparent, reproducible, and rigorous. If you want the restriction to lapse, you must help us build that definition.

  There is an awkwardness in this room tonight. I feel it. Some of the companies we regulate now fund our education programs. Some of the people who wrote the rules are watching us change them. My family is here wondering if "environmental something" means I sold out.

  Here is the truth: Regulation is not a monument; it is a machine. It requires maintenance. Sometimes that maintenance looks like tightening a bolt, and sometimes it looks like admitting a part is worn out. The precautionary principle is still the engine of this agency. It is in our statute. It is in our mission. But an engine that runs on "maybe" eventually seizes up. We are trying to build a way to run it on "evidence."

  This will be messy. There will be times when the industry thinks we are being obstructionist, and times when the public thinks we are being complicit. There will be times when I wish I had the certainty you had in the eighties, Judge, when you signed the founding documents. But you didn't have the data we have now. And you didn't have the responsibility of managing the consequences of thirty years of restrictions.

  I am leaving this Chair next month. I am handing the gavel to someone who will have to live with this vote longer than I will. I want them to inherit an agency that is honest about its limitations.

  To the front row: Thank you for teaching us that we have the right to be safe before we have the proof of danger.
  To the back row: Thank you for reminding us that safety requires definitions we can all measure.
  To my family: I work in public health. It is messy, it is complicated, and I am proud of it.

  We are not abandoning the precautionary principle. We are growing up. We are moving from the certainty of youth to the rigor of adulthood. It is less romantic. It is more difficult. But it is the only way to keep this agency standing for the next thirty years.

  Thank you.

  ***

  ### The Weighty Sentence

  > **"I will not tell you this new rule does not shift the burden, because it does, but I will tell you it forces us to finally answer the question we have avoided for thirty years: what does 'clean' actually look like?"**

  **Why this sentence carries the weight:**
  This is the pivot point of the entire speech. It validates the founders' fear (yes, the burden shifts) without apologizing for the necessity of the change (we must define safety). It bridges the gap between the "precautionary" idealism of the front row and the "evidence-based" requirements of the back row. It admits the flaw in the old system (avoiding the definition of "clean") without disparaging the people who built it. When you deliver this, slow down. Make eye contact with the front row on the first clause, and the back row on the second. This is the moment where you choose honesty over comfort.
