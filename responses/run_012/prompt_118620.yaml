prompt: |-
  OK so I spent thirty-odd years doing retinal physiology — photoreceptors, dark adaptation, that whole business — and I retired a few years ago and have been reading alot of philosophy of perception, mostly so I can argue with my daughter, who did a masters in it. Here's my problem. I keep falling back on the analogy that the eye is basically a camera. Lens, aperture, sensor, image. And from that I want to conclude that seeing is just a recording — light in, image out — so the idea that your beliefs or desires or what you had for breakfast can change what you actually see (she calls it cognitive penetration) strikes me as nonsense. A camera doesn't care what you think.

  She says the analogy is doing all my work for me and that it's a bad one. I half believe her, but I want it laid out properly rather than as a family arguement. So: give me the correspondence table — what plays the role of the lens, the sensor, the image file, the photographer, the darkroom — then tell me where the mapping actually breaks. I already suspect one thing, which is that the cameras in my old lab had auto-exposure and auto white balance, and the later ones did face detection and scene modes, and I'd never say those were just recording. Then tell me which features of the camera picture I'm quietly smuggling in that perception doesn't actually have, and whether my conclusion (no top-down influence on what you see) survives once all that's on the table, or whether it was only ever the analogy talking. If you've got a better analogy, I'll take it.

  Cap the whole thing at 500 words, and lead with the bottom line, then the table, then the caveats.
