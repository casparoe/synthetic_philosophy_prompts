answer: |-
  You are tracking a single logical structure known as **instrumental self-defeat**, but it splits into two distinct metaphysical mechanisms: **strategic commitment** (the desert) and **constitutive attention** (sleep, marriage, work).

  The logical form shared by all your cases is that attitude $A$ produces good $G$, but adopting $A$ for the reason that it produces $G$ prevents either the adoption of $A$ or the realization of $G$. However, the "joints" where the phenomenon fractures depend on *why* the instrumental reason is destructive.

  Your desert case belongs to the literature on **commitment problems** and **resolute choice**, primarily associated with David Gauthier (*Morals by Agreement*) and Gregory Kavka (the **Toxin Puzzle**). Here, the defeat is **interpersonal and strategic**. The driver will not stop because a calculated disposition is revocable; once you are in the middle of the desert, the instrumental reason to pay vanishes, so a rational calculator would renege. The driver needs a disposition that is *causally independent* of the immediate payoff to be credible. The manipulation fails here because the disposition must be *stable* against future recalculation. You cannot reason yourself into a disposition that overrides reasoning, because the reasoning process itself signals revocability. The "pill" solution works here only if the pill makes you irrational or bound in a way that is observable or known to the other party (e.g., burning your bridges).

  Your other three cases (sleep, marriage, dissertation) belong to the **Paradox of Hedonism** (Sidgwick) and the theory of **constitutive ends** (Anscombe, Foot). Here, the defeat is **intrapersonal and phenomenological**. Sleep, trust, and creative flow are not products caused by an attitude; they are states constituted by the absence of instrumental monitoring. To sleep is to surrender control; to trust is to refrain from checking; to create is to focus on the work, not the reward. The manipulation fails here because the *content* of the attitude is incompatible with the *motive* for holding it. If you are monitoring your sleep to ensure you get rest, you are not sleeping; if you are keeping score in a marriage to protect the relationship, you are not relating. Unlike the desert case, this does not require another agent to know your motive; the motive itself corrupts the phenomenology.

  This distinction explains your uncertainty about manipulation (pills, moving cities). Manipulation works when it bypasses the agent's reasoning transparency. A sleeping pill works because it induces sleep *causally*, not by convincing you to sleep; it sidesteps the constitutive requirement of surrender. Moving to a quiet city works for the same reason—it changes the external conditions so the instrumental monitoring isn't triggered. But you cannot take a "trust pill" for the marriage case if trust is defined by a specific normative relation to the partner (valuing them for themselves); a chemical simulation of trust would not be trust, even if it produced similar behaviors. In the desert case, a "trustworthiness pill" would work *if* it made you genuinely non-calculating, because the requirement is stability, not normative correctness.

  The nearest concepts you mentioned fall short for specific reasons. **Pragmatic belief** (Pascal, William James) fails because it addresses adopting a belief for utility where the truth is undecided or irrelevant; your cases involve attitudes where the *origin* of the attitude matters to its success (e.g., trust based on utility isn't trust). **Self-fulfilling expectations** fail because they describe cases where believing $X$ makes $X$ true; you are describing cases where believing "I should believe $X$ for benefit $Y$" makes $X$ impossible. **Bernard Williams' "Deciding to Believe"** is the closest fit for the belief variant, arguing that belief aims at truth and is therefore transparent to evidence; but your cases extend beyond doxastic involuntarism to dispositions and emotions where the aim is not truth but **non-instrumental engagement**.

  So, you have two papers here, or one paper with a crucial distinction. The desert case is about **rationality and commitment** (how to be rational when rationality is self-defeating). The sleep/marriage/work cases are about **the nature of goods** (how some goods are only available to those who do not pursue them directly). The umbrella term "instrumental self-defeat" covers the logic, but treating them as the same phenomenon obscures the fact that one is solved by binding constraints (game theory) and the other by shifting attention (philosophy of mind).
