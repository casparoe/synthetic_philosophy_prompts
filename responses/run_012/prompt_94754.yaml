  **STUDENT GOVERNMENT ASSOCIATION**
  **RULES COMMITTEE OPINION 24-01**
  **TO:** The Full Student Government Association
  **FROM:** The Rules Committee
  **DATE:** Thursday, [Current Date]
  **SUBJECT:** Validity of Article IX Amendment and Status of Prior Bylaws

  **I. INTRODUCTION**
  The Rules Committee has convened to interpret Article IX of the SGA Constitution following the executive board's vote two weeks ago. We are aware of the stakes: the validity of the recent amendment, the legitimacy of the Rules Committee itself, and the funding for the Spring Showcase. We have reviewed the text, the vote count, and the arguments presented by the President, the opposition, and members of the body. This opinion is binding under our established precedent.

  **II. THE MATHEMATICAL FACT**
  We begin with the text. Article IX §2 states: *"Section 1 of this Article may be changed only by a three-quarters vote of the full membership."*
  We have 30 seated members. Three-quarters of 30 is 22.5. In voting contexts, fractions round up to the next whole vote required to meet the threshold. Therefore, 23 affirmative votes are required to amend §2.
  The recorded vote was 21 Yes, 9 No.
  21 is less than 23.
  Regardless of intent, regardless of the week's notice, and regardless of the debate, the amendment **failed**. The President's declaration that it passed is factually incorrect under the current Constitution. To rule otherwise would be to lie about the math.

  **III. REJECTION OF THE "NOMIC" THEORY**
  A member suggested that this situation resembles the game *Nomic*, where rules are mutable and, in a deadlock, the "fact of the matter" is simply whatever the players agree to play. We explicitly reject this interpretation.
  The SGA is not a game; it is a governing body entrusted with student fees and institutional representation. If the rules are only binding when convenient, or if contradictions are resolved by mere consensus rather than text, we cease to be a government and become a mob. There *is* a fact of the matter: the text governs until changed according to its own terms. We cannot vote ourselves out of the requirement to follow the vote count. Devon's suggestion to "just pick one" undermines the legitimacy of every decision this body makes. We rule that the text is binding, not optional.

  **IV. THE STRONGEST COUNTERARGUMENT (THE OPPOSITION)**
  We turn to the opposition's claim: Because the amendment failed, Article IX §2 remains in force. Because §2 remained in force for the last two years, any bylaw passed during that time under a "simple majority" or "two-thirds present" standard—when §2 required a higher threshold for certain changes—is void *ab initio* (from the start).
  This includes the 2023 bylaw that created the Rules Committee (passed with 61%) and last month's budget reallocation.
  **This argument is logically sound.** If the Constitution was violated in 2023, the resulting bylaw has no legal root. If the 2023 bylaw is void, the Rules Committee does not exist. If the Committee does not exist, this opinion is void. If the budget vote is void, the Spring Showcase cannot be funded.
  The opposition is correct that strict adherence to the text creates a paradox that threatens to dissolve the SGA's operations for the last two years. They are right to demand consistency. If we say the rules matter, they must matter retroactively.

  **V. THE RULING: DE FACTO VALIDITY**
  However, legal systems prioritize stability alongside consistency. We invoke the **De Facto Officer Doctrine**. This principle holds that actions taken by officials who believe in good faith they have authority are valid, even if a later review finds a technical defect in their election or appointment.
  Why? To prevent chaos.
  1.  **The Amendment:** Failed. Article IX §2 stands.
  2.  **Past Bylaws:** Valid. The 2023 Committee Bylaw and the recent Budget Vote stand under *de facto* validity. The members who voted previously acted in good faith under the interpretation held by the body at the time. To void them now would punish the student body for the SGA's procedural errors.
  3.  **Jurisdiction:** This Committee exists *de facto*. We have the jurisdiction to issue this opinion to prevent the collapse of the SGA.

  **VI. RECOMMENDATION AND DEADLINE**
  Relying on *de facto* doctrine is a temporary patch, not a cure. We cannot govern on technicalities forever.
  **Recommended Action:** The SGA must hold an emergency ratification vote at the next meeting (Thursday, one week from today).
  1.  Re-pass the Rules Committee Bylaw under the correct Article IX §1 standards (2/3 of members present).
  2.  Re-pass the Budget Reallocation under the correct standards.
  3.  Formally acknowledge the failure of the recent §2 amendment.
  **Deadline:** This vote must occur at the next Thursday meeting, one week prior to the Spring Showcase. If the budget is not ratified by then, the Committee will advise the Finance Director to freeze expenditures until compliance is met.

  **VII. LIMITATIONS OF THIS OPINION**
  Our reasoning relies on the assumption that the SGA operates in good faith.
  **Where this breaks:** If it is proven that the 2023 bylaw was passed with *knowledge* that it violated the Constitution (bad faith), the *de facto* doctrine collapses. If members knew they were breaking the rules and did it anyway, retroactive invalidation may be the only remedy.
  **What would change my mind:** I would rule that the past bylaws are void if presented with meeting minutes from 2023 showing explicit warning from an advisor or parliamentarian that the vote threshold was insufficient, and a deliberate decision to ignore it. Without evidence of bad faith, we choose stability.

  **VIII. CONCLUSION**
  The amendment failed. The rules matter. But the SGA continues. Ratify the past, correct the future.

