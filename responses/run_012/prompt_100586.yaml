  In the rust belt wind, I seek a net,
  A shield against the private storm.
  Where rights are debts the state owes yet,
  And safety wears a uniform.
  Against the right, against the cold,
  I swear I am still liberal.

  Here the coin decides the road,
  The individual stands alone.
  No heavy state to share the load,
  Just freedom carved in stone.
  The market speaks, the state withdraws,
  I swear I am still liberal.

  Across the channel, compromise
  Is painted orange on coalition walls.
  A modest tax, a tempered rise,
  A junior partner in the halls.
  Not left, not right, but somewhere small,
  I swear I am still liberal.

  Before the vote, before the party line,
  It meant an open hand, a feast.
  A pouring out of bread and wine,
  To stranger, enemy, and beast.
  A generosity of soul,
  I swear I am still liberal.

  ***

  **Note on Usage**

  This poem treats four distinct definitions as clean breaks, which they aren't. In the US, your reading is correct: "liberal" is largely settled as center-left, defined by welfare and civil liberties in opposition to conservatives. In the Netherlands and Germany, you're mostly right that "liberal" signals free-market classical liberalism, but this ignores parties who claim "social liberalism," blending market freedom with welfare provisions. The UK stanza leans on the liberal party as a distinct center, but in British slang, "liberal" often just means socially progressive, regardless of party affiliation. The archaic sense of "generous" is etymologically solid, but it's not really a dead ancestor; classical liberals argue their market freedom is the true form of that generosity. The poem pretends these meanings live in separate houses. In reality, they're roommates fighting over the lease.
