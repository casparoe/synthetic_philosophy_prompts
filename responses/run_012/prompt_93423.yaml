answer: |-
  You are right to feel that Sam's position teeters on the edge of incoherence, but you are also applying a standard of "rationality" that Wittgenstein is explicitly trying to dismantle. Your dilemma is the single hardest problem in *On Certainty*, and it divides contemporary hinge epistemology into two camps: the *epistemic* readers (like Crispin Wright) who try to save the idea that hinges are warranted, and the *non-epistemic* readers (like Danièle Moyal-Sharrock) who side closer with Sam.

  Here is the breakdown of why your intuition is clashing with Sam's, and where the actual philosophical friction lies.

  ### The Dilemma: Normativity vs. Psychology
  Your framing of the dilemma is sharp: If hinges are rational, they must be assessable by reasons; if they aren't assessable by reasons, they are just psychological quirks. You are assuming that "rational" means "justified within a system of evidence." Wittgenstein's move is to say that hinges *are* the system of evidence.

  To make the claim "rational but not justified" coherent, you have to shift from an *internalist* view of justification (I need a reason to hold this) to a *structural* view (This holding makes reasoning possible). Think of it like the axioms of a logic system. You cannot prove the law of non-contradiction using the law of non-contradiction without begging the question. Yet, we don't treat it as a mere psychological habit; we treat it as a norm. Wittgenstein is arguing that hinge propositions function like logical axioms for empirical inquiry. They have "normative force" without "evidential support."

  However, your worry remains valid: What stops a *prejudice* from functioning as a hinge? If a racist treats "Group X is inferior" as a hinge, they are immune to evidence. If hinges are just "what we don't doubt," then hinge epistemology seems to validate dogmatism. The only way out of this horn is to argue that hinges are not individual psychological states but shared conditions of a "form of life." They are rational not because the individual has reasons, but because the community's practice of inquiry relies on them to function. It's a pragmatic warrant, not an evidential one.

  ### Sam's Move: Propositions vs. Actions
  Sam's claim that hinges are "ways of acting" rather than propositions is not cheating; it is arguably the most textually faithful reading of *On Certainty* (specifically §§7, 10, 204). Wittgenstein repeatedly suggests that certainty is found in *what we do*, not *what we say*. When I reach for a door handle, I am not affirming the proposition "door handles exist"; I am enacting my certainty.

  Does this dissolve your dilemma? It dissolves the *epistemic* version of it. If a hinge is an action, asking for evidence is a category mistake. You don't ask for evidence for a reflex; you ask if it works. However, it does not dissolve the *normative* version. We still need to distinguish between a "healthy" hinge (trusting memory) and a "pathological" hinge (trusting a dictator). If hinges are just practices, we lose the ability to criticize bad practices from the outside. Sam is right that the *category* is action, but he is wrong if he thinks this automatically solves the problem of relativism. It just moves the problem from logic to anthropology.

  ### Is Your Framing Confused?
  Yes, but productively so. You are separating "rational" and "psychological" as if they are mutually exclusive. Wittgenstein's goal is to show that at the foundation of knowledge, they merge. A hinge is a psychological fact (we *do* act this way) that *functions* as a norm (we *ought* to act this way to play the language-game). You are looking for a justification that stands outside the practice; Wittgenstein is telling you that justification only exists *inside* the practice. You want a view from nowhere; he is offering you a view from the riverbed.

  ### The Verdict
  Sam is closer to the text, but you are closer to the lingering anxiety that keeps epistemologists awake. The claim "rational but not justified" is coherent only if you accept that "rationality" is not a ladder of reasons but the ground we stand on. If you demand a reason for the ground, you are asking for a contradiction. But if you accept that, you must also accept that we cannot prove our hinges are "true" in a correspondence sense, only that they are indispensable for our form of life. That is a hard pill to swallow, and your resistance to it is philosophically healthy.

