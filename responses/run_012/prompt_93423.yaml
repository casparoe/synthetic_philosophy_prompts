prompt: |-
  Ok so last night my friend Sam and I got into a two-hour argument about Wittgenstein's On Certainty and I need you to actually explain the conceptual issue to me, because I think Sam is talking nonsense but I can't articulate why. Treat yourself like someone who works on hinge epistemology for a living — not a summarizer who's read the Wikipedia page — and think carefully before you write; maybe lay out for yourself what the real issue is before you start the explanation.

  Here's the setup. Sam says the point of "hinge" propositions — stuff like there's an external world, I have two hands, I've never been to the moon, the world didn't pop into being five minutes ago — is that they're the ones we can't doubt, because doubting them would pull the rug out from under every test we'd use to check them. Fine, I get that part. But then Sam says something I can't wrap my head around. He says these hinges are *more* certain than the things we normally claim to know, and also that we can't say we *know* them, and *also* that they're not just psychological habits — that they're somehow rational or warranted. Those three claims look like they can't all be true at once.

  What I actually want explained: take the claim that hinges are rational or warranted in some sense, but not known and not justified by evidence. Is there any way to make that coherent? Because it seems like it has to be one of two things and both are bad. Either hinges are open to assessment on the basis of reasons, in which case you can in principle doubt them and they stop being hinges; or they aren't, in which case what's the difference between a hinge and a deeply held prejudice, or just a fact about how I happen to be wired? I don't want the stock answer. I want someone to take the dilemma seriously and tell me whether it can be dissolved or whether we just have to pick a horn.

  Sam also threw in something I've definately never heard anyone say: he claimed the real hinge isn't a proposition at all but a way of acting — that trusting my memory isn't believing a sentence, it's more like a practice or a habit of relying, and that once you see it that way the whole dilemma evaporates. I think that's cheating but I can't say why. If that move doesn't actually do the work, say so plainly rather than humoring it. And if my whole framing here is confused — if I've seperated things that shouldn't be seperated — just tell me instead of politely answering the question as posed.

  Then finish with a short JSON object, after the prose, with these fields: core_issue, the_dilemma (stated the way you'd state it), why_it_is_hard, best_reading, what_would_settle_it. Keep each field to a sentence or two.
