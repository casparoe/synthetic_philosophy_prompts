prompt: |-
  Ok so I just spent three hours arguing with my friend, who's a social historian, about whether counterfactuals have any business in history — she thinks they're parlor games, I think her own writing is stuffed with them without her noticing. Anyway, I'm giving a colloquium talk next week and I need to be ready for the Q&A.

  Before you write anything, brainstorm for a bit about what this particular room will care about, then give me the prep sheet. I want you in the role of a philosopher of history who's sat through a hundred of these colloquia and knows exactly how historians smell blood.

  The setup. Audience: a history department — mostly social and cultural historians, allergic to "great man" history and to anything that smells like rational choice theory; two economic historians who run counterfactual simulations for a living; one philosopher of history; one global historian. My thesis: inevitability claims come in two flavors, and people who say "it was inevitable" almost always mean the second while pretending they mean the first. Closure inevitability = given the actual antecedent conditions, no accessible alternative path existed. Convergence inevitability = even if the antecedents had been different, roughly the same outcome would have arrived anyway. My claim is that convergence claims are the *more* counterfactual-laden of the two, so historians who denounce counterfactuals while quietly writing convergence claims are contradicting themselves — and that the two claims need different kinds of evidence, which is why alot of the fights about this go nowhere.

  So: the eight or so objections I'll actually get from *this* room, ordered by how much damage they'd do, each phrased the way that person would phrase it; a two-minute reply for each with a note on where the reply is soft; what I should concede upfront; and the one question I'm praying nobdy asks. Be honest about which objections I probably just can't answer.
reasoning: |-
