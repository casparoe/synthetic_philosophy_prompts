answer: |-
  Good evening. Please, lift your glasses. Before we drink to Eleanor, we must acknowledge that a toast to the architect of self-amendment cannot be a static document. It must be alive. So, this speech begins under three rules.

  Rule One: Everything said here must be true.
  Rule Two: Any rule may be changed by a simple majority show of hands.
  Rule Three: Rule One is entrenched. It cannot be changed by Rule Two; it requires unanimous consent.

  These rules govern this moment, just as Eleanor spent her career asking whether a constitution can govern its own transformation. She taught us that a legal system is not a cage, but a conversation. She asked if a sovereign can bind itself, and if a rule can apply to itself without collapsing into nonsense. We know the answer now. It collapses only if you lack the courage to let the rule change whilst you stand upon it.

  Consider her work. She explored the paradox of the amendment clause: can Article Five be used to destroy Article Five? She argued that stability requires the possibility of change, but change requires a stable ground to stand on. It is a delicate balance. Much like her teaching. She never gave us easy answers, but she gave us the tools to build our own. And every claim I have just made is true, satisfying Rule One.

  But looking around this room, I see a problem. A simple majority feels too volatile for a tribute of this magnitude. We are not merely passing legislation; we are celebrating a life. So, I propose we amend Rule Two. Henceforth, let us say that any further changes to these rules require unanimous consent, not a mere majority.

  [Pause for effect]

  All those in favour of raising the threshold?

  [Pause]

  All those opposed?

  [Pause]

  The ayes have it. Rule Two is now amended. We are no longer under the rules we began with. We have used the old Rule Two to destroy the old Rule Two, and instantiate a new one. For the philosophers in the room: yes, this is the Kelsenian Grundnorm shifting beneath our feet. For the family: we just agreed that from now on, we all have to agree.

  This brings me to her game nights. For years, Eleanor hosted evenings where the rules of play were themselves in play. I recall one night when the rule regarding how many cards one could hold was amended mid-hand. Chaos? Perhaps. But it was a chaos of consent. She taught us that the authority of a rule does not come from its age, but from our continued acceptance of it. When we play her games, we are not obeying a command; we are participating in a shared reality.

  And that is what makes her such a brilliant colleague. She never treated her students or peers as subjects to be governed, but as players to be engaged. She understood that if you want the game to continue, you must let the other players have a say in the rules.

  Now, we approach the end. I wish to propose a final addition. Rule Four: That Eleanor's retirement be filled with the same curiosity and joy she brought to this institution.

  Under the *new* Rule Two, this requires unanimity. Is there anyone here who does not wish Eleanor a happy retirement?

  [Pause]

  I see no hands. The rule is satisfied.

  So, where do we stand? We began under three rules. We end under four. Rule One remains entrenched, unchanged, because some truths—like her integrity—are not subject to majority vote. Rule Two, however, is different. We started with majority rule; we finish with unanimity. Why does this matter?

  Because it mirrors the journey of a career like hers. In the beginning, you fight for your ideas by majority, by debate, by winning the argument. But at the end, when you look back at what you have built, you realise that true legacy is not about winning votes. It is about bringing everyone along. It is about consensus.

  She spent her life studying how laws change themselves. Tonight, we proved her right. We changed the rules of this toast, by the rules of this toast, without breaking the toast. We navigated the paradox. But we did not do it to show off. We did it because that is how she thinks. That is how she lives.

  So, under the rules as they currently stand—requiring our unanimous consent to this act of affection—I ask you to raise your glasses.

  To Eleanor. May your next chapter be written in your own hand, and may the rules be ever in your favour.

  Cheers.
