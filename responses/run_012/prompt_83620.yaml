answer: |-
  **The One-Sentence Version**
  In a sealed "world" of only twenty objects where ravens are abundant but non-black items are rare, students bet chips on the truth of "All Ravens Are Black" and discover through calibration scoring that finding the single green shirt proves the rule more definitively than finding a black raven ever could.

  ***

  ### The Design: "The Small World Bag"

  **Setup & Materials**
  *   **Groups:** 3 Teams of 4 students (fits your dozen).
  *   **The Bags:** 3 identical opaque cloth bags.
  *   **The Contents (per bag):** 20 laminated cards (or tokens).
      *   18 cards: **Black Raven** (Image of raven, black dot).
      *   1 card: **Black Shoe** (Image of shoe, black dot).
      *   1 card: **Green Shirt** (Image of shirt, green dot).
      *   *Note:* This composition makes the hypothesis "All Ravens are Black" **True**.
  *   **The World Card:** One card per team, face up. It reads: *"WORLD SIZE: 20 Objects. RAVENS: 18. NON-RAVENS: 2. COLOR COUNT: UNKNOWN."*
  *   **Currency:** Poker chips or candy (20 per student to start).
  *   **Score Sheet:** A simple grid for recording "Confidence %" before each draw.

  **The Rules**
  1.  **The Hypothesis:** The statement to test is: *"Every Raven in this bag is Black."*
  2.  **The Market:** Before any draw, each team must place a "Confidence Bet." They put chips into a pot representing their probability that the Hypothesis is True.
      *   If they are 100% sure it's True: 20 chips.
      *   If they are 50/50: 10 chips.
      *   If they think it's False: 0 chips.
  3.  **The Draw:** One student draws a card, shows the team, and returns it to the bag (shuffle).
  4.  **The Update:** The team discusses and adjusts their chip bet for the *next* round based on the evidence.
  5.  **The Payoff:** After 5 rounds, you reveal the bag's full contents.
      *   If the Hypothesis was **True**: Teams keep their chips + a bonus equal to their final bet.
      *   If the Hypothesis was **False**: Teams lose their bet chips; only chips *not* bet are safe.
      *   *Simplified:* Highest chip count at the end wins. The scoring rewards teams who moved their confidence *correctly* based on the evidence.

  **The Math (Why the Shirt Wins)**
  You asked for the numbers to ensure the game isn't a trick. Here is the Bayesian logic hidden in the bag:
  *   **World:** 20 items. 18 Ravens. 2 Non-Ravens.
  *   **Hypothesis ($H$):** All 18 Ravens are Black. (This implies the 2 Non-Ravens hold all the Non-Black color).
  *   **Alternative ($\neg H$):** At least one Raven is Non-Black.
  *   **Scenario A (Draw Black Raven):** There are 18 of these. Drawing one is expected under both $H$ and $\neg H$. It barely shifts the probability because Ravens are so common. It's "no news."
  *   **Scenario B (Draw Black Shoe):** This is a Non-Raven. It tells you nothing about the color of the Ravens. It is neutral evidence.
  *   **Scenario C (Draw Green Shirt):** This is a **Non-Black** object. There is only *one* Non-Black object in the bag (based on the specific composition I gave you above, or very few).
      *   If you find the only Non-Black object and it is *not* a Raven (it's a shirt), you have effectively inspected the entire "danger zone."
      *   Since there are no other Non-Black objects left to hide a Non-Black Raven, the probability that "All Ravens are Black" jumps to nearly 100%.
      *   **Result:** The Green Shirt provides a massive Bayesian update. The Black Raven provides a negligible one. The Shoe provides none.

  ***

  ### Minute-by-Minute Timeline (90 Minutes)

  **00:00 – 00:10 | The Hook (No Theory)**
  *   Do not mention Hempel. Do not mention logic.
  *   Hand out the bags and World Cards.
  *   Read the Hypothesis: *"All Ravens in this bag are Black."*
  *   Explain the betting: "You are insurers. You profit if you correctly assess the risk that this statement is false. Chips are money. Go."

  **00:10 – 00:40 | The Game (Three Rounds)**
  *   **Round 1:** Teams set initial confidence (usually 50% or vague). Draw 1 card per team. (Rig the draws if you can peek, or let chance happen; ideally, one team gets the Shirt, one a Raven, one a Shoe).
  *   **00:25 | Market Freeze:** Stop the room. Ask teams to announce their new confidence % and *why*.
      *   *Expected friction:* The team with the Raven will feel confident. The team with the Shirt will feel confused ("Why does a shirt matter?"). The team with the Shoe will feel nothing happened.
  *   **Round 2 & 3:** Continue drawing. Force them to adjust chips. If a team hasn't moved their chips after drawing the Green Shirt, challenge them: "You found the only non-black thing and it wasn't a raven. Are you really still only 60% sure?"

  **00:40 – 01:00 | The Crash (The Reveal)**
  *   Empty the bags onto the tables.
  *   Count the chips. The team that bet heavy on the Green Shirt should have the most chips.
  *   Ask the losing teams (usually the ones who ignored the Shirt): "You had the data. Why did you stay poor?"
  *   Let them argue. This is the "fight" you want. The playwright will likely call the scoring rigged. The poet might notice the scarcity of the shirt.

  **01:00 – 01:20 | The Debrief (Connecting the Dots)**
  *   **Step 1:** Ask, "Which object felt like a trick?" (They will say the Shirt).
  *   **Step 2:** Ask, "Which object felt like proof?" (They will say the Raven).
  *   **Step 3:** Reveal the Paradox. "This is Hempel's Ravens. Logic says the Shirt is stronger proof than the Raven. Your intuition says the Raven is stronger. In this game, the math paid out on the Shirt."
  *   **Step 4:** Map the mechanics.
      *   "The Bag" = The Universe.
      *   "The World Card" = Our assumptions about the universe.
      *   "The Chips" = Epistemic confidence.
      *   "The Shirt" = Confirmation by eliminating the only place a counter-example could hide.

  **01:20 – 01:30 | The Limitation (The Honest Exit)**
  *   Read the paragraph below (or speak it) to close the seminar.

  ***

  ### Predictable Failures & Troubleshooting

  1.  **The Freeze:** MFA students often hate being "wrong" quantitatively. They may refuse to assign a percentage, saying "It's art, not math."
      *   *Fix:* Make the betting mandatory to proceed to the next draw. "No chips on the table, no card from the bag."
  2.  **The "Rigged" Accusation:** The argumentative playwright will claim you stacked the deck so the Shirt *had* to win.
      *   *Fix:* Acknowledge it. "Yes, the world was small. That was the variable. In a big world, would the shirt still win? That's the homework."
  3.  **The Dilution:** If you let them draw 10 times, the effect washes out.
      *   *Fix:* Strictly limit to 3-5 draws. The shock must happen early.
  4.  **The Shoe Confusion:** They might argue the Black Shoe *should* count.
      *   *Fix:* Remind them of the World Card. "You know there are 18 Ravens. You don't know how many Black things there are. A Black Shoe doesn't tell you about the Non-Black pool."

  ***

  ### The Honest Limitation (Read this at the end)

  "There is a reason your brother-in-law called this a trick, and he isn't entirely wrong. In this game, the Green Shirt was powerful evidence because the world was tiny—only twenty objects, only one shirt. In that small pond, finding the shirt drained the swamp where a counter-example could hide. But in the real world, the number of non-black non-ravens is effectively infinite. Every green apple, every white shoe, every blue sky is a 'Green Shirt.' Because there are so many of them, finding one more confirms the hypothesis by such a microscopic degree that it is functionally zero. The logic holds—the shirt *is* evidence—but the scale of reality makes the evidence too faint to feel. So you leave holding both halves of the truth: Yes, logically, the apple confirms the raven. And no, practically, you will never in your life notice it happening."
