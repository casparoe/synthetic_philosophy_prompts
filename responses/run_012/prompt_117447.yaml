  Here is the diagnosis of your list, the principle that actually drives it, and the cost of making it consistent.

  ### The Diagnosis: You Don't Have a Positional Principle
  Your working distinction—positional versus absolute (or capability)—is not doing the work you think it is. If it were, you would be consistent on cases (2) and (4), but you are not.

  *   **Case (2) (Dynasty Trust):** You judge this as indefensible, yet a trust fund doesn't inherently shove anyone back in a specific queue. It is not positional in the way a single job slot is. You hate it because it creates **permanent class stratification**. It violates the idea that each generation should start on a roughly level playing field.
  *   **Case (4) (Tutors):** You judge this as fine, yet it is blatantly positional. It buys advantage in the education queue. You tolerate it because it falls under **parental prerogative** and human capital formation.

  Your intuitions are not tracking "positionality." They are tracking **Democratic Non-Dominance**. You allow transfers that build a child's *agency* (skills, health, basic security) within a single generation. You forbid transfers that secure *dominance* (political power, permanent rentier status) or corrupt *institutional integrity* (admissions, justice).

  ### The Decision: Keep the Principle Clean, Drop Verdict (4)
  Do not bolt on extra clauses. Ad-hoc exceptions ("unless it's education," "unless it's under $1M") will turn your seminar into a tax code. Keep the principle clean: **Intergenerational transfers are unjust if they secure unearned dominance or corrupt meritocratic institutions.**

  To make this principle consistent, you must drop **Verdict (4)**.

