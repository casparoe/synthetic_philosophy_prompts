prompt: |-
  I run a small futarchy pilot for a regional transit agency — the idea being that the board votes on the values and a prediction market tells us which of two policies actually delivers them. Four or five decisions a year, each one tens of millions of dollars and hard to undo. It has been going badly and I need a procedure I can actually run, not a defense of the idea.

  Two things went wrong this year. On the fare question, the market said adopt, and then our analyst pointed out that the number we'd been reading off the board — the value of the metric if the fare change passes — isn't that number at all, it's the odds the change passes times the value it has if it does, and we'd been treating the product as the thing itself. On the depot question, the metric we'd pre-registered was going to be measured by the very contractor the policy would hire, so the board overrode the market, and now nobody trusts the process.

  Write me the procedure. The questions to ask in order, starting before we even open a market, what counts as a sufficent answer to each, where the procedure stops with a hard no — there are decisions we should never run through this — and where it hands off to the board because the question is values rather than beliefs. Who is allowed to trade, and whether we subsidize the people the decision actually lands on, should be seperate gates with their own answers. It has to be runnable by a staffer with no economics training, in about a week, and it should say who signs off at each gate.

  Then run it on three cases: (1) raise fares 15% versus hold fares and cut weekend service, metric is ridership plus farebox recovery; (2) pick vendor A or B for a scheduling system, metric is on-time performance in 18 months; (3) a one-year guaranteed-income pilot for 300 riders, metric is employment among participants. At least one of these should come out as don't run a market on this, and I'd prefer it to be the one I'm most attached to. Finish by telling me what the procedure can't do — I know it can't tell me whether my metric is the right metric, but I want to know exactly where that gap sits and what the least-bad patch is.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the User and Request:**
      *   **User:** Runs a small futarchy pilot for a regional transit agency.
      *   **Context:** Board votes on values, prediction market selects policies. 4-5 decisions/year, high stakes (tens of millions), hard to undo.
      *   **Problem:** It's going badly. Two specific failures:
          1.  *Fare Question:* Confusion between conditional expected value ($E[V|Pass]$) vs. unconditional expected value ($P(Pass) \times E[V|Pass]$). The market price was misinterpreted.
          2.  *Depot Question:* Conflict of interest (contractor measures the metric they are hired for). Board overrode market, trust lost.
      *   **Goal:** A *runnable procedure*, not a theoretical defense. Needs to be usable by a staffer with no econ training, within a week.
      *   **Requirements:**
          *   Ordered questions/gates.
          *   Criteria for sufficient answers.
          *   Hard "No" stop points (decisions unsuitable for futarchy).
          *   Handoff points to the Board (values vs. beliefs).
          *   Separate gates for trading eligibility and subsidizing affected parties.
          *   Sign-off authority at each gate.
          *   Apply the procedure to three specific cases (Fare/Service, Vendor, Guaranteed Income).
          *   One case must result in "Don't run a market."
          *   User preference: The "Don't run" case should be the one they are most attached to (likely the Guaranteed Income pilot, as it's the most innovative/socially complex).
          *   Final section: Limitations of the procedure (specifically regarding metric validity) and the "least-bad patch."

  2.  **Deconstruct the Failures & Design the Procedure:**
      *   *Failure 1 (Metric/Price Confusion):* The procedure needs a strict definition of how the market resolves. It must distinguish between *implementation probability* and *outcome value*. In standard futarchy, the market resolves based on the outcome *if* the policy is implemented. If the policy isn't implemented, the market usually voids or resolves to a baseline. The user's issue suggests they were trading on a mixed instrument. *Fix:* Define the resolution condition clearly. The market asks: "What will [Metric] be *if* Policy X is adopted?"
      *   *Failure 2 (Conflict of Interest/Measurement):* The metric must be measurable by an independent third party. *Fix:* Independent Audit Gate.
      *   *General Futarchy Risks:* Manipulation, liquidity, ethical concerns, values vs. facts.
      *   *Constraint:* Runnable by non-economist in a week. Keep it checklist-style.

  3.  **Drafting the Procedure (The "Transit Futarchy Protocol v1.0"):**
      *   *Phase 1: Suitability Screening (Hard No's).* Is this reversible? Is the timeline too long? Is the metric manipulable?
      *   *Phase 2: Metric Definition & Audit.* Who measures? Is it independent?
      *   *Phase 3: Value Setting (Board).* What is the goal? (This is the Board's job, not the market's).
      *   *Phase 4: Market Design.* Conditional resolution. Liquidity.
      *   *Phase 5: Participation & Ethics.* Who trades? Subsidies?
      *   *Sign-offs:* Staff Lead, Legal/Compliance, Board Chair, External Auditor.

  4.  **Refining the "Hard No" Criteria:**
      *   Futarchy fails when:
          *   Outcomes take too long to verify ( > 2 years is risky for a pilot).
          *   Metrics are subjective or easily gamed by the implementer.
          *   Ethical/Legal constraints prevent betting (e.g., human welfare directly).
          *   The decision is fundamentally about values (equity vs. efficiency), not causal efficacy.

  5.  **Addressing the Specific Failures in the Procedure:**
      *   *The "Fare Question" Error:* The procedure must mandate that the market question is phrased as a conditional: "Value of M *given* Policy P." The market price represents $E[M|P]$. The Board compares $E[M|P_1]$ vs $E[M|P_2]$.
      *   *The "Depot Question" Error:* The "Independent Measurement Gate." If the vendor measures their own success, Hard No.

  6.  **Applying the Procedure to the Three Cases:**

      *   *Case 1: Fare Hike vs. Service Cut.*
          *   Metric: Ridership + Farebox.
          *   Timeline: Short term.
          *   Manipulability: Low (financial data is hard to fake).
          *   Ethics: Standard business decision.
          *   Verdict: **Run Market.** (This is classic futarchy territory).

      *   *Case 2: Vendor A vs. B (Scheduling System).*
          *   Metric: On-time performance (OTP).
          *   Timeline: 18 months.
          *   Manipulability: Medium. Vendors might try to game OTP.
          *   Independence: *Crucial.* If Vendor A provides the system that measures OTP, it's a conflict. Need third-party measurement.
          *   Verdict: **Run Market (Conditional on Independent Audit).**

      *   *Case 3: Guaranteed Income Pilot.*
          *   Metric: Employment among participants.
          *   Ethics: Betting on human welfare outcomes is sensitive.
          *   Values vs. Facts: Is "employment" the right goal? Maybe leisure or health is better. This is a *values* question disguised as a metric.
          *   Manipulability: Participants might change behavior based on knowledge of the bet (Goodhart's Law on steroids).
          *   Timeline: 1 year + measurement time.
          *   User Preference: User wants this to be the "Don't Run."
          *   Reasoning: The metric (employment) is a proxy for welfare, which is a *value* judgment. The Board should decide if employment is the goal, not the market. Also, small N (300 riders) makes the metric noisy and manipulable.
          *   Verdict: **Hard No.**

  7.  **Addressing the Limitations (The "Gap"):**
      *   Futarchy optimizes for the metric, not the *intent*.
      *   The gap is between "Metric" and "True Value."
      *   Least-bad patch: Robustness checks, multiple metrics, or Board veto on *metric selection* (not market outcome).

  8.  **Review and Refine:**
      *   *Tone:* Professional, direct, operational. No fluff.
      *   *Constraint Check:* Can a staffer run this in a week? Yes, it's a checklist.
      *   *Sign-offs:* Clearly defined.
      *   *The "Fare Question" Fix:* Ensure the procedure explicitly distinguishes between the market price (expected metric value) and the decision rule.
      *   *The "Depot Question" Fix:* Ensure the Independent Measurement Gate is prominent.

  9.  **Self-Correction/Nuance during drafting:**
      *   *Wait, regarding the Fare Question failure:* The user said "the number we'd been reading off the board... isn't that number at all, it's the odds the change passes times the value." This implies they were trading a contract that paid out $Value \times I(Pass)$. In standard futarchy, you usually have separate markets for each policy that resolve based on the metric *if* that policy is chosen. If the policy isn't chosen, the market voids. I need to make sure the procedure mandates *Conditional Resolution Markets*.
      *   *Regarding the Guaranteed Income:* Why is this the "Don't Run"? Besides the ethical "betting on people" aspect, the N=300 is statistically noisy. Prediction markets need clear signals. Social pilots have high variance. Also, defining "employment" as the sole success metric for a welfare program is a *value* judgment (Equity vs. Efficiency). The Board should decide that, not the market.

  10. **Final Polish:** Check the sign-offs. Ensure the "Week" timeline is realistic (the procedure *design* takes a week, the market takes longer, but the *decision to run* takes a week). Actually, the prompt says "runnable... in about a week." This likely means the *assessment procedure* takes a week, not the whole market lifecycle. I will clarify that distinction.

      *Wait, re-reading:* "It has to be runnable by a staffer... in about a week." This implies the *gatekeeping process* itself. Setting up the market takes longer. I will frame it as the "Pre-Market Assessment Protocol."

      *Sign-offs:*
      1.  Staff Lead (Initial)
      2.  Legal/Compliance (Ethics/Trading)
      3.  External Auditor (Measurement Independence)
      4.  Board Chair (Values/Metric Approval)

      *Let's write it.*
answer: |-
  # Transit Futarchy Pre-Market Assessment Protocol (v1.0)

  **Purpose:** To determine if a specific policy decision is suitable for futarchical resolution, ensuring metric integrity, measurement independence, and ethical compliance.
  **Operator:** Program Staff Lead (no economics training required).
  **Timeline:** Assessment must be completed within 5 business days of proposal submission.
  **Authority:** This protocol acts as a veto chain. A "No" at any gate stops the process.

  ---

  ## Phase 1: The Hard No Gates (Days 1-2)
  *These questions determine if the decision is fundamentally incompatible with prediction markets.*

  **Q1.1: Is the outcome verifiable within 24 months?**
  *   **Why:** Markets lose accuracy if resolution is too distant.
  *   **Sufficient Answer:** "Yes, the metric will be finalized and audited within 24 months of policy implementation."
  *   **Fail Condition:** Outcome takes >2 years to measure.
  *   **Sign-off:** Staff Lead.

  **Q1.2: Is the metric immune to manipulation by the implementer?**
  *   **Why:** Prevents the "Depot Question" failure (contractor measuring their own success).
  *   **Sufficient Answer:** "The data source for the metric is owned/controlled by a third party independent of the policy vendor."
  *   **Fail Condition:** The vendor implementing the policy also collects, reports, or audits the metric data.
  *   **Sign-off:** External Auditor (or Internal Audit Dept if external unavailable).

  **Q1.3: Is the sample size statistically robust?**
  *   **Why:** Markets cannot predict noise. Small N leads to volatile prices that reflect luck, not signal.
  *   **Sufficient Answer:** "The population affected is >1,000 units (riders, trips, transactions) OR the effect size is large enough to be detected with 80% power given the variance."
  *   **Fail Condition:** Pilot groups <500 units or high-variance social metrics with small N.
  *   **Sign-off:** Staff Lead (with Statistical Consultant review).

  **Q1.4: Does the decision involve direct betting on human welfare outcomes?**
  *   **Why:** Ethical/Legal risk. Betting on employment, health, or safety of specific identifiable groups creates perverse incentives and reputational risk.
  *   **Sufficient Answer:** "The metric is operational (ridership, cost, time), not human-centric (welfare, health, employment status)."
  *   **Fail Condition:** Metric tracks individual human welfare outcomes (e.g., "Did this person get a job?").
  *   **Sign-off:** Legal/Compliance Officer.

  **STOP.** If any answer is a Fail Condition, **do not run a market.** Hand off to Board for traditional vote.

  ---

  ## Phase 2: Metric & Market Structure (Day 3)
  *These questions prevent the "Fare Question" failure (pricing confusion).*

  **Q2.1: Is the market question phrased as a conditional expectation?**
  *   **Why:** To separate *probability of passage* from *value if passed*.
  *   **Sufficient Answer:** The market ticket reads: "Value of [Metric] **IF** [Policy X] is adopted." (Not "Value of [Metric] in [Year]").
  *   **Requirement:** Markets must void/resolve to null if the policy is *not* adopted. The price represents $E[Metric | Policy]$.
  *   **Sign-off:** Staff Lead.

  **Q2.2: Has the Board pre-committed to the decision rule?**
  *   **Why:** Prevents Board override after the fact (trust loss).
  *   **Sufficient Answer:** Board Resolution stating: "We will adopt the policy with the highest expected metric value as determined by the market close, provided Phase 1 gates were passed."
  *   **Exception:** Board retains veto only on *legal/safety* grounds, not on market price.
  *   **Sign-off:** Board Chair.

  ---

  ## Phase 3: Participation & Ethics (Days 4-5)
  *Separate gates for trading and subsidies.*

  **Q3.1: Who is allowed to trade? (The Insider Gate)**
  *   **Rule:** Employees, Board Members, and Vendor Bidders are **blocked**.
  *   **Sufficient Answer:** "KYC verification confirms no traders are employed by the Agency or bidding vendors."
  *   **Sign-off:** Legal/Compliance Officer.

  **Q3.2: Do we subsidize affected parties? (The Stakeholder Gate)**
  *   **Rule:** Affected parties (e.g., riders) may be subsidized to trade *only if* they are aggregated to prevent intimidation.
  *   **Sufficient Answer:** "Yes, we will provide stipends to a representative rider panel to trade via a blind pool," OR "No, we will not subsidize traders."
  *   **Warning:** Do not allow individual riders to trade directly on outcomes affecting their own service without aggregation (coercion risk).
  *   **Sign-off:** Legal/Compliance Officer.

  ---

  ## Application to Current Cases

  Here is the protocol applied to your three pending decisions.

  ### Case 1: Raise Fares 15% vs. Hold Fares/Cut Weekend Service
  *   **Metric:** Ridership + Farebox Recovery (Weighted Index).
  *   **Timeline:** 12 months.
  *   **Phase 1 Check:**
      *   Verifiable < 24mo? **Yes.** (Financial reports are quarterly).
      *   Manipulation Proof? **Yes.** (Farebox data is internal/automated).
      *   Sample Size? **Yes.** (Millions of trips).
      *   Human Welfare Bet? **No.** (Operational metrics).
  *   **Phase 2 Check:**
      *   Conditional Phrasing? **Yes.** (Market resolves on index value *if* fare hike passes).
      *   Board Commitment? **Pending.** (Needs resolution).
  *   **Phase 3 Check:**
      *   Insiders Blocked? **Yes.**
      *   Subsidies? **No.** (Riders not trading).
  *   **VERDICT:** **RUN MARKET.**
  *   **Notes:** This is the ideal use case. Operational, high volume, hard data. Ensure the market resolves to "Void" if the Board rejects both options, to avoid the "odds × value" confusion you experienced previously.

  ### Case 2: Vendor A vs. Vendor B (Scheduling System)
  *   **Metric:** On-Time Performance (OTP) in 18 months.
  *   **Timeline:** 18 months + 1 month audit.
  *   **Phase 1 Check:**
      *   Verifiable < 24mo? **Yes.**
      *   Manipulation Proof? **CONDITIONAL.**
          *   *Risk:* Vendor provides scheduling software *and* reports OTP.
          *   *Fix:* Contract must require OTP data to be validated by GPS logs held by a third-party telematics provider, not the vendor's dashboard.
      *   Sample Size? **Yes.**
      *   Human Welfare Bet? **No.**
  *   **Phase 2 Check:**
      *   Conditional Phrasing? **Yes.**
      *   Board Commitment? **Pending.**
  *   **Phase 3 Check:**
      *   Insiders Blocked? **Yes.** (Vendor employees must be blocked).
      *   Subsidies? **N/A.**
  *   **VERDICT:** **RUN MARKET (With Contract Amendment).**
  *   **Notes:** You cannot run this until the contract is amended to ensure independent measurement of OTP. If Vendor A measures their own OTP, this triggers Phase 1 Q1.2 (Hard No).

  ### Case 3: One-Year Guaranteed-Income Pilot (300 Riders)
  *   **Metric:** Employment among participants.
  *   **Timeline:** 12 months + survey time.
  *   **Phase 1 Check:**
      *   Verifiable < 24mo? **Yes.**
      *   Manipulation Proof? **No.** (Self-reported employment status is easily gamed if participants know it affects the metric).
      *   Sample Size? **FAIL.** (N=300 is too small for a prediction market to distinguish signal from noise on employment variance).
      *   Human Welfare Bet? **FAIL.** (Betting on "employment" is betting on human welfare).
  *   **Phase 2 Check:**
      *   *Skipped due to Phase 1 Fail.*
  *   **VERDICT:** **DO NOT RUN MARKET.**
  *   **Reasoning:** This fails three Hard No gates.
      1.  **Values vs. Facts:** Whether "employment" is the correct success metric for a welfare pilot is a *value* judgment, not a factual one. The Board must vote on the goal (e.g., "Reduce Poverty" vs. "Increase Labor Participation"), not the market.
      2.  **Statistical Noise:** 300 participants is insufficient liquidity for a market to price employment risk accurately.
      3.  **Ethics:** Creating a financial incentive for traders to bet on whether low-income individuals get jobs creates reputational and ethical hazard.
  *   **Action:** Hand off to Board for traditional values-based vote.

  ---

  ## Limitations & The "Metric Gap"

  You asked what this procedure cannot do.

  **The Gap:** This procedure ensures the market *accurately prices the metric*, but it cannot ensure *the metric matches reality.*
  *   **Example:** You can run a perfect market on "On-Time Performance." The market might correctly predict Vendor A will achieve 90% OTP. But if 90% OTP doesn't actually improve rider satisfaction (because the buses are empty or dirty), you have optimized the wrong thing.
  *   **Location:** This gap sits at **Phase 2, Q2.2 (Board Pre-commitment).** The Board is signing off on the metric as a proxy for value. The procedure cannot validate that proxy.

  **The Least-Bad Patch:**
  You cannot solve this with a market. You solve it with **Metric Triangulation.**
  1.  **Never use a single metric.** For the Vendor case, do not just use OTP. Use "OTP + Rider Complaints + Cost."
  2.  **Board Veto on Metric Selection:** The Board must vote on the *metric definition* separately from the policy.
  3.  **The "Smell Test" Clause:** Add a clause to the Board Resolution: "If the market price implies a metric outcome that contradicts known operational constraints (e.g., predicting 110% capacity), the Market Manager must halt trading for review."

  **Summary of Action:**
  1.  Adopt this Protocol immediately.
  2.  Cancel the market on the Guaranteed Income pilot (Case 3). It is the riskiest and most ethically fraught; saving it from futarchy protects your program's long-term legitimacy.
  3.  Amend the Vendor contract (Case 2) to ensure independent data measurement before launching the market.
  4.  Proceed with the Fare/Service market (Case 1) as your "clean" pilot to rebuild trust, ensuring the "Conditional Resolution" language is explicit in all market materials.
