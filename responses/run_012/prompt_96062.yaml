          *   *Phase 4:* Synthesis/Writing.
          *   *Justification:* Why armchair? Because empirical data can't tell us what *ought* to count as badness; that's a normative/conceptual question. Why not taxonomy? Because we want an explanation of value, not just a classification.
      *   **Deliverables:** A monograph or substantial paper series.
      *   **Success/Failure:** Success = a defended position on the bearer of badness. Failure = collapsing into "it depends on how you define pain."
      *   **Scope:** Keep it focused on asymbolia, not general pain theory.

