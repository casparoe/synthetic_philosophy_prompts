      *   *Core Question:* What makes pain bad? (The "bearer of pain's badness").
      *   *Candidates:*
          1.  Intrinsic Phenomenal Character (it feels bad).
          2.  Functional Role (it causes avoidance/learning).
          3.  Represented Bodily Damage (the state signals harm).
      *   *Complication:* Clinical definitions often build "unpleasantness" into the definition of pain, risking verbal disputes.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be clear and descriptive. *The Bearer of Badness: A Conceptual Analysis of Pain Asymbolia.*
      *   **Abstract/Summary:** Brief overview of the project.
      *   **Research Question:** Needs to be specific. Not just "What is pain?" but "Which of the three candidates constitutes the normative badness of pain, given asymbolia?"
