      *   *Tone Check:* The prompt asks to be "honest about how much of the work is conceptual clarification rather than discovery." I need to explicitly state that I am not finding new neurons, but clarifying concepts.
      *   *Audience:* Clinicians are on the panel. I need to respect the clinical data while showing why philosophy is needed to interpret it. Avoid overly dense jargon without explanation.
      *   *The "Determinant Answer" Requirement:* The prompt asks to state the question so it has a determinate answer. This is tricky in philosophy. I should frame it as "Identifying the necessary condition for pain's badness" rather than "Solving the hard problem."
      *   *The "Verbal Dispute" Risk:* The prompt highlights the definition of pain. I need a specific workpackage dedicated to untangling the IASP definition vs. the philosophical concept.

  5.  **Drafting the Text (Iterative Process):**

      *   *Title:* **Project Title:** The Bearer of Badness: Pain Asymbolia and the Normative Structure of Suffering.
      *   *Introduction:* Start with the clinical hook. Patients smile at pain. Why?
      *   *The Problem:* Standard view says sensory/affective split. I say that misses the point about *value*.
      *   *The Question:* "In cases of pain asymbolia, which property constitutes the residual badness (if any) of the experience: its phenomenal character, its functional role, or its representational content?"
      *   *Method:* 12 months, half-time.
          *   Months 1-3: Definitions (tackling the verbal dispute risk).
          *   Months 4-6: Analyzing existing case reports through the lens of the three candidates.
          *   Months 7-9: Constructing minimal contrast cases (hypotheticals).
          *   Months 10-12: Writing.
      *   *Justification:* Empirical science tells us *what* happens, not *what it means* for welfare.
