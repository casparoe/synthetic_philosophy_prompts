answer: |-
  **MEMORANDUM**

  **TO:** Dissertation Committee / Department Colleagues
  **FROM:** [Your Name]
  **SUBJECT:** Feasibility Analysis of Proposed Departmental Choice Mechanism

  **Executive Summary**

  You are correct to pause before committing to this chapter design. Your list of seven desiderata contains a fundamental theoretical collision. Specifically, you cannot simultaneously satisfy **Strategy-Proofness (1)**, **Efficiency (2)**, and **Budget Balance (4)** in a quasi-linear environment with rich preferences.

  Your worry about "dictatorship" stems from the Gibbard-Satterthwaite theorem, but that result applies to voting *without* money. Since you are allowing transfers (the "money version"), dictatorship is not the binding constraint. The binding constraint is the **Green-Laffont-Holmström impossibility result**.

  Below is the breakdown of which constraints collide, which are compatible, and my recommendation on which item to drop to save the chapter and the implementation.

  ***

  ### 1. The "Dictator" Worry (Gibbard-Satterthwaite)
  **Status:** *Not a threat to your design.*

  You asked if strategy-proofness forces dictatorship. That is the conclusion of the Gibbard-Satterthwaite (GS) theorem, but GS applies to **ordinal** preferences without transfers.
  *   **Your Context:** You specified quasi-linear transfers (people chip in money).
  *   **The Implication:** Once you allow money, you escape GS. The Vickrey-Clarke-Groves (VCG) family of mechanisms exists. These mechanisms are Strategy-Proof, Efficient, Anonymous, Deterministic, and Responsive.
  *   **Verdict:** You do not need to worry about Item 3 (Anonymous) or Item 6 (Responsive) colliding with Item 1 (Strategy-Proof). You can have a non-dictatorial, strategy-proof mechanism.

  ### 2. The Real Collision (Green-Laffont-Holmström)
  **Status:** *Fatal conflict between Items 1, 2, and 4.*

  The actual impossibility theorem that bites you is Green-Laffont (1977) / Holmström (1979). In a domain with quasi-linear utilities and sufficiently rich preferences:
  *   **No mechanism is simultaneously:**
      1.  Dominant Strategy Incentive Compatible (Strategy-Proof),
      2.  Ex-Post Efficient,
      3.  Budget Balanced (transfers sum to zero).

  **Why this happens:**
  To make truth-telling dominant (Item 1) and ensure the best option is picked (Item 2), you essentially need a VCG mechanism. VCG charges agents their "externality" (the harm they cause others by participating). Mathematically, the sum of these externalities is almost always **positive**.
  *   **Result:** The mechanism collects a surplus.
  *   **Conflict:** If you try to refund that surplus to balance the budget (Item 4), you change the agents' incentives, and truth-telling is no longer a dominant strategy. If you burn the surplus, you violate Budget Balance. If you run a deficit to cover costs, you violate Budget Balance.

  ### 3. The Revelation Principle (Item 7)
  **Status:** *Misunderstood scope.*

  You wrote: *"the revelation principle says I can always restrict attention to a direct mechanism... so the incentive side is kind of already handled."*

  **Correction:** The Revelation Principle is a methodological tool, not a design feature. It states that if *any* mechanism exists that satisfies your goals, there exists a *direct* mechanism that also satisfies them.
  *   **What it does:** It allows you to search only among direct mechanisms without loss of generality.
  *   **What it does NOT do:** It does not guarantee that a mechanism satisfying your other constraints (SP, BB, Efficient) actually *exists*. In your case, the Revelation Principle tells you that you can focus on direct mechanisms, but Green-Laffont tells you that even among direct mechanisms, the combination you want does not exist.
  *   **Action:** Remove Item 7 from your list of "properties." It is a justification for your modeling approach, not a feature of the output.

  ### 4. Compatibility Check

  | Constraint | Compatible with SP + Efficient? | Notes |
  | :--- | :--- | :--- |
  | **1. Strategy-Proof** | **N/A** | Core requirement. |
  | **2. Efficient** | **N/A** | Core requirement. |
  | **3. Anonymous** | **Yes** | VCG is anonymous. |
  | **4. Budget Balanced** | **NO** | **The Collision Point.** VCG runs a surplus. |
  | **5. Deterministic** | **Yes** | VCG is deterministic. |
  | **6. Responsive** | **Yes** | VCG is responsive. |
  | **7. Rev. Principle** | **N/A** | Modeling assumption, not a constraint. |

  ### 5. Recommendation: What to Drop

  You have two viable paths. You must relax either **Budget Balance (4)** or **Strategy-Proofness (1)**.

  **Option A: Drop Budget Balance (Keep Strong SP)**
  *   **Mechanism:** VCG (Pivot Mechanism).
  *   **Pros:** Satisfies your strongest theoretical desire (Dominant Strategy truth-telling). Robust to beliefs about others. Excellent for a theory chapter.
  *   **Cons:** The department will collect more money than the cost of the option (surplus). You must decide what to do with the surplus. If you refund it lump-sum, you break SP. If you burn it (e.g., donate to charity), you are technically not budget balanced, but the deficit is non-negative.
  *   **Implementation:** You pitch this as "The department may generate a small surplus to cover administrative friction or donate to the graduate fund."
  *   **Verdict:** **Best for the Dissertation.** It preserves the "strong version" of strategy-proofness you emphasized.

  **Option B: Drop Strategy-Proofness (Keep Budget Balance)**
  *   **Mechanism:** d'Aspremont-Gérard-Varet (AGV) / Expected Externality Mechanism.
  *   **Pros:** Budget balanced, Efficient, Anonymous.
  *   **Cons:** Only incentive compatible in **Bayesian Nash Equilibrium**, not Dominant Strategy. Agents must know the distribution of others' preferences. If they are wrong about the distribution, incentives break.
  *   **Implementation:** Harder to sell to a department ("You need to trust our model of your beliefs").
  *   **Verdict:** **Best for pure Implementation,** but riskier for a PhD chapter if your field is Mechanism Design (Bayesian is often seen as "weaker" than Dominant Strategy).

  ### Final Advice

  **Drop Item 4 (Budget Balance).**

  For a third-year paper in mechanism design, maintaining **Dominant Strategy Incentive Compatibility (Item 1)** is usually the higher priority. The literature accepts VCG with surplus burning (or expected budget balance) as the standard solution to the Green-Laffont problem.

  **Revised List for your Memo:**
  1.  Strategy-Proof (Dominant Strategy)
  2.  Efficient
  3.  Anonymous
  4.  **Expected** Budget Balanced (or "No Deficit")
  5.  Deterministic
  6.  Responsive

  **Note on Endogenous Options:** You mentioned options can be proposed mid-meeting. Be careful: if the *set* of alternatives is endogenous, agents can manipulate the outcome by proposing "clone" alternatives to split votes or alter pivot calculations. You may need to restrict the agenda-setting process or treat the "status quo" as a fixed outside option to maintain Strategy-Proofness.

  ***

  **Summary for your Advisor:**
  *"I am proceeding with a VCG-style mechanism. I am retaining Dominant Strategy Incentive Compatibility and Efficiency as the primary constraints. Per Green-Laffont, I am relaxing strict Budget Balance to allow for a surplus, which I will model as a non-negative transfer to an outside sink (or expected budget balance) to preserve the incentive properties."*
