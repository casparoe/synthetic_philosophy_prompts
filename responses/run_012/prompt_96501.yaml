      *   *Best practical advice:* The "Cheapest" item to drop is usually **Budget Balance (4)** or **Strategy-Proofness (1)**. Given the user's strong language on SP ("I mean the strong version"), dropping SP hurts the theory contribution. Dropping BB hurts implementation.
