prompt: |-
  You're a decision theorist who actually works on risk attitudes in the Buchak/Quigley tradition, and I want you to think carefully and build me something precise. Start by brainstorming two or three candidate decision problems before you settle on one, and don't bother showing me the rejects unless one of them is instructive.

  Background so we're on the same page (don't just recite it back at me, use it): in risk-weighted expected utility you take a gamble, rank its outcomes worst to best, and value it as the utility of the worst outcome, plus, for each step up from one outcome to the next, the utility gained at that step multiplied by r(the chance of getting at least the better of the two outcomes). Here r is the risk function — increasing, with r(0)=0 and r(1)=1. If r(p) sits below p everywhere in between, the agent is risk averse. Expected utility is just the special case where r is the identity, i.e. r(p)=p.

  What I want built:

  A decision problem — ideally a pair of choices, the kind of thing you could hand someone as a short two-question quiz — such that:

  1. An expected utility maximizer and a risk-weighted expected utility maximizer with the same utility function over money and the same beliefs rank the options differently, with the REU agent using a strictly concave r.
  2. The difference can't be waved away as the EU agent simply having a more or less concave utility function. To nail that down, make the REU agent's overall pattern of choices violate the independence / sure-thing principle, and then show that no utility function whatsoever reproduces that pattern under expected utility.
  3. Everything is money, three distinct outcomes at most, amounts a normal person could actually face.

  Then do the checks, and actually do the arithmetic:

  - State the utility function and the risk function explicitly (numbers, not just shapes).
  - Compute EU and REU for each option and show which way each theory goes.
  - Point to the exact spot where the REU agent flips while the EU agent can't.
  - Tell me what happens the moment you set r(p)=p — does the whole thing collapse back into expected utility, and if so, why.
  - Say which single feature of the construction is doing the work, and what breaks if you pull it out.
  - Finally, put on the EU defender's hat: what's the most respectable thing they can say to argue the REU agent is just making a mistake or being incoherent, rather than exposing a genuine gap in EU?

  Context for why I'm asking, since it fixes what counts as a good answer: this is for a graduate seminar on whether risk attitudes are a seperate primitive from the curvature of the utility function, and I do not want a case that just stipulates the verdicts — the divergence has to fall out of the two theories doing their own thing on the same inputs. Please don't give me references or a reading list, I just want the construction and the reasoning. Keep it tight but complete.
