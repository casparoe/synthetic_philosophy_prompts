  ### Brainstorming Candidate Problems

  1.  **The Common Ratio Effect:** Two choices where probabilities are scaled down (e.g., Sure \$50 vs. 50% \$100; then 10% \$50 vs. 5% \$100).
      *   *Verdict:* Reject. While REU can generate reversals here, standard power-function risk weights ($r(p)=p^k$) often fail to produce the reversal unless the function is specifically tuned away from power forms. It risks getting bogged down in function selection rather than structural clarity.
  2.  **A Simple Two-Outcome Gamble:** Sure \$X vs. 50% \$2X.
      *   *Verdict:* Reject. A single choice cannot demonstrate the violation of Independence required to prove risk attitude is separate from utility curvature. We need a pair of choices to show the *pattern* is inadmissible under EU.
  3.  **The Allais Common Consequence Structure (Compressed):** A pair of choices where a common outcome probability is swapped for a zero outcome.
      *   *Verdict:* **Select.** This is the robust standard for separating risk attitudes from utility curvature. By carefully selecting amounts, we can fit it into exactly three distinct monetary outcomes (\$0, \$1M, \$1.5M), satisfying your constraint while guaranteeing the Independence violation.

  ---

  ### The Decision Problem

  You face two separate decision situations. In each, choose one option. All outcomes are monetary.

  **Choice 1:**
  *   **Option A:** \$1,000,000 for sure.
  *   **Option B:** 10% chance of \$1,500,000; 89% chance of \$1,000,000; 1% chance of \$0.

  **Choice 2:**
  *   **Option C:** 11% chance of \$1,000,000; 89% chance of \$0.
  *   **Option D:** 10% chance of \$1,500,000; 90% chance of \$0.

  **Distinct Outcomes:** \$0, \$1,000,000, \$1,500,000. (Exactly three).

  ---

  ### The Models

  **1. Utility Function:**
  We set $u(x) = x / 1,000,000$. This normalizes the outcomes to $0, 1, 1.5$.
  *   $u(0) = 0$
  *   $u(1) = 1$
  *   $u(1.5) = 1.5$
  *   *Note:* This is linear utility. Any risk aversion displayed by the REU agent comes *solely* from the risk function, not utility curvature.

  **2. Risk Function:**
  We set $r(p) = p^2$.
  *   This satisfies $r(0)=0, r(1)=1$.
  *   It is strictly below the diagonal ($p^2 < p$ for $p \in (0,1)$), indicating risk aversion per your definition.

  ---

  ### The Arithmetic

  **Expected Utility (EU) Calculations:**
  *   **Choice 1:**
      *   $EU(A) = 1$
      *   $EU(B) = 0.10(1.5) + 0.89(1) + 0.01(0) = 0.15 + 0.89 = 1.04$
      *   **EU Ranking:** $B \succ A$ (Prefers Risky)
  *   **Choice 2:**
      *   $EU(C) = 0.11(1) + 0.89(0) = 0.11$
      *   $EU(D) = 0.10(1.5) + 0.90(0) = 0.15$
      *   **EU Ranking:** $D \succ C$ (Prefers Risky)
  *   **EU Pattern:** $(B \succ A, D \succ C)$. Consistent with Independence.

  **Risk-Weighted Expected Utility (REU) Calculations:**
  *Recall: $REU = u(x_{worst}) + \sum r(P(\geq x_{better})) \cdot \Delta u$*

  *   **Choice 1:**
      *   $REU(A) = 1$ (Sure thing, $r(1)=1$).
      *   $REU(B)$: Outcomes ordered $0, 1, 1.5$.
          *   Step 1 (0 to 1): Gain 1. Prob of $\geq 1$ is $0.89 + 0.10 = 0.99$. Weight: $r(0.99) = 0.99^2 = 0.9801$.
          *   Step 2 (1 to 1.5): Gain 0.5. Prob of $\geq 1.5$ is $0.10$. Weight: $r(0.10) = 0.10^2 = 0.01$.
          *   $REU(B) = 0 + 0.9801(1) + 0.01(0.5) = 0.9801 + 0.005 = 0.9851$.
      *   **REU Ranking:** $A \succ B$ ($1 > 0.9851$). (Prefers Sure)
  *   **Choice 2:**
      *   $REU(C)$: Outcomes $0, 1$. Prob of $\geq 1$ is $0.11$.
          *   $REU(C) = 0 + r(0.11)(1) = 0.11^2 = 0.0121$.
      *   $REU(D)$: Outcomes $0, 1.5$. Prob of $\geq 1.5$ is $0.10$.
          *   $REU(D) = 0 + r(0.10)(1.5) = 0.01(1.5) = 0.015$.
      *   **REU Ranking:** $D \succ C$ ($0.015 > 0.0121$). (Prefers Risky)
  *   **REU Pattern:** $(A \succ B, D \succ C)$.

  **The Divergence:**
  In Choice 1, EU prefers **B**, while REU prefers **A**.
  In Choice 2, both prefer **D**, but the *pattern* of preferences differs fundamentally.

  ---

  ### The Checks

  **1. Violation of Independence (The "No Utility Function" Proof)**
  The REU agent's pattern is $(A \succ B)$ and $(D \succ C)$. Under Expected Utility, no utility function $u$ can reproduce this.
  *   $A \succ B \implies u(1) > 0.89u(1) + 0.1u(1.5) + 0.01u(0)$.
      *   Simplifies to: $0.11u(1) > 0.1u(1.5)$ (assuming $u(0)=0$).
  *   $D \succ C \implies 0.1u(1.5) + 0.9u(0) > 0.11u(1) + 0.89u(0)$.
      *   Simplifies to: $0.1u(1.5) > 0.11u(1)$.
  *   **Contradiction:** $0.11u(1)$ cannot be both greater than and less than $0.1u(1.5)$.
  *   **Conclusion:** The REU agent's preferences are inadmissible under EU theory, regardless of utility curvature. This proves risk attitude in REU is a primitive separate from utility curvature.

  **2. The Collapse when $r(p) = p$**
  If we set $r(p) = p$ (the identity function):
  *   $REU(B)$ becomes $0 + 0.99(1) + 0.10(0.5) = 0.99 + 0.05 = 1.04$.
  *   $REU(A)$ remains $1$.
  *   $REU(C)$ becomes $0.11$.
  *   $REU(D)$ becomes $0.15$.
  *   **Result:** The REU rankings become $(B \succ A, D \succ C)$, identical to EU. The divergence vanishes because the risk weights become linear probabilities, collapsing the REU formula into the standard EU expectation.

  **3. The Single Feature Doing the Work**
  The divergence is driven by the **non-linear weighting of cumulative probabilities**.
  In Choice 1, the "safe" part of Option B (the 89% chance of \$1M) is weighted by $r(0.99) \approx 0.98$. The agent heavily discounts the near-certainty of getting the million. In Choice 2, both options are low-probability gambles. The risk function penalizes the 11% chance ($r=0.0121$) slightly more than the 10% chance ($r=0.01$), but the higher payoff on D ($1.5\times$) outweighs this small probability difference.
  **What breaks if you pull it out:** If $r$ is linear, the weighting of the "common consequence" (the 89% chunk) scales proportionally with the weighting of the rare outcomes, preserving consistency. Non-linearity allows the 89% chunk to loom larger in the risk assessment of Choice 1 than the probability math suggests, flipping the preference.

  **4. The EU Defender's Critique**
  A sophisticated EU defender (e.g., a dynamic choice theorist) would argue the REU agent is **dynamically inconsistent** and susceptible to a **money pump**.
  *   *Argument:* If the REU agent chooses A in Choice 1, they are effectively paying a premium to avoid the 1% risk of zero. But in Choice 2, they accept a 90% risk of zero for a slightly higher payoff. If these choices are presented sequentially or can be synthesized via tradable contracts, the agent can be induced to pay to switch from B to A, and then pay to switch from C to D, in a way that guarantees a net loss regardless of the outcome.
  *   *The Charge:* The REU agent isn't revealing a "new rational attitude"; they are violating the coherence required to avoid sure losses over time. The "risk attitude" is just a label for a consistency error.
