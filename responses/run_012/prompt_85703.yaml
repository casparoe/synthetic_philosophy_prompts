      2.  By (4), these true contingent propositions require a truthmaker (something in the world).
      3.  By (5), the truthmaker cannot be a future fact or entity (none exist).
      4.  By (6), the truthmaker cannot be a present disposition, propensity, or state of affairs.
      5.  **Result:** You have true contingent propositions that float free of being. This violates (4).
