  ### I. Apparent vs. Genuine Tensions

  **Apparent Tensions (Compatible)**
  *   **(1) Bivalence vs. (2) Indeterminism:** It is a common misconception that Bivalence entails Determinism. You can maintain that "Sea battle tomorrow" is true *simpliciter* without that truth causally necessitating the battle. The truth supervenes on the event, not vice versa. These are logically compatible.
