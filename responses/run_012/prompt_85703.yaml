  *   **(3) Tenseless Truth vs. (5) No Future Facts:** You can hold that propositions have eternal truth values even if the ontology is temporally restricted. This is only problematic if combined with the Truthmaker Principle (4).

  **Genuine Tensions (Inconsistent)**
  Your package contains two distinct, fatal clusters of inconsistency.

  #### 1. The Logical Fatalism Triad (Severity: Critical)
  *   **Commitments:** (1) Bivalence, (8) Power Entailment, (9) Free Will.
  *   **The Conflict:** This reconstructs the classic Master Argument for Fatalism.
      1.  By (1), the proposition *I will do X* is either true or false now.
      2.  Assume it is true. By (8), if it is true, you lack the power to make it false (i.e., you cannot do otherwise).
      3.  By (9), you have the power to do otherwise.
      4.  Contradiction.
  *   **Source:** Commitment (8) treats truth as a "hard fact" that constrains power. Commitment (9) requires that truth about future actions does not constrain power.
  *   **Cheapest Revision:** Abandon **(8) Power Entailment**.
      *   **Cost:** You must adopt a distinction between "hard" and "soft" facts about the past/present. You must argue that the truth of a future contingent is a "soft fact" over which you retain power, despite it being true now. This requires a nuanced theory of agency and counterfactual power over the truth of propositions.
  *   **Alternative Revision:** Abandon **(1) Bivalence**.
      *   **Cost:** You lose classical logic for future contingents (Aristotelianism). You must accept truth-value gaps, which complicates semantics and logic.

