prompt: |-
  So I'm giving a work-in-progress talk in a couple weeks to what's nominally our department's Wittgenstein reading group but has basically turned into a seminar where people present their own work — I've got 25 minutes plus 40 for discussion, so the discussion is where I live or die. The paper is about On Certainty, and the line I'm pushing is that the standard reading of the hinge remarks — hinges as non-epistemic, animal, unjustified commitments that simply can't be doubted — buys you a tidy answer to the skeptic at the price of making hinge *change* inexplicable. If hinges sit outside the space of reasons, there's no way to describe what happens when someone's whole picture shifts: a conversion, a scientific revolution, a student who comes to see a proof differently. My move is to say hinges aren't beliefs or attitudes at all but normative constraints on what counts as a reason within a domain, and that they get revised not by argument but by something closer to a change in what you can do — I call it a shift in the 'space of moves' rather than in reasons, if that isn't too cute.

  The audience is going to be tough in a very particular way. It's mostly people who've read the book a dozen times and are allergic to anything that smells like importing technical machinery into Wittgenstein — they'll hear "normative constraint" and "domain" and start frowning before I get to the second slide. But two formal epistemologists come, one of them a Bayesian, and they'll want to know whether my view has any actual structure or is just a redescription, and whether hinge revision is meant to be rational or merely causal. And there's a historian of science in the group who works on theory change and will want to know if I'm just badly reinventing incommensurability. There's also the Moore business hovering over all of it, obviously.

  What I want from you is a Q&A prep sheet. Give me the objections I'll actually get, not the ones a generic epistemologist would raise — phrased the way these particular people would phrase them, ordered by how much damage they'd do me if I fumble them, each with a two-minute reply and a note on where that reply is weakest or where I'm quietly bluffing. Tell me which ones I should just concede up front rather than fight, and flag the ones where conceding would sink the whole paper. And include the one question I'm hoping nobody asks, with a sentence on why it's the one that actually hurts. Don't give me citations or "you might read X" — I know the literature, and I need this to be about what to say in the room.
