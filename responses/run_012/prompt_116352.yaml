      *   *The Villagers say:* You ate our share. You broke the bond.
      *   *The Anthropologist says:* See? The violation is real. But the solution isn't "impersonal bureaucracy" (which might not work there); it's holding him to the *actual* contract he entered. The anti-corruption industry misses this nuance and just blasts "corruption" which destroys the only safety net people have (kinship) without replacing it.
      *   *Wait, don't get too long.* Keep it 1-2 paragraphs.
      *   *Focus:* The villagers aren't quoting the UN Convention Against Corruption. They are quoting the logic of the belly. The minister failed the test of a *good* patron, not the test of a *neutral* bureaucrat.

  5.  **Refining the Argument:**
      *   Concede: Yes, this is predation. I never said patronage is immune to critique.
      *   Counter: The villagers aren't using the "public/private" distinction. They are using the "good big man/bad big man" distinction.
      *   The anti-corruption industry wants to abolish the big man system. I argue that's impossible/destructive without a functioning state.
      *   So, when villagers say "theft," they mean "he didn't eat *with* us," not "he confused public and private funds."
      *   This preserves the "internal standard" claim without falling into "anything goes."

  6.  **Final Polish (checking constraints):**
      *   Paragraph count: 1-2.
      *   Tone: Sharp, fieldwork texture.
      *   No surrender of central claim (category is parochial).

  7.  **Drafting the text:**
      "You've constructed a false dichotomy that assumes the only alternative to the global anti-corruption script is silence or complicity. When those villagers say 'theft,' they aren't channeling Transparency International; they are invoking the specific obligations of the very patronage system you think I'm defending. In the moral economy I studied, a leader who consumes resources without redistributing protection or welfare isn't violating a Western public/private divide—he is failing as a patron. The anti-corruption industry diagnoses this as 'graft' because money moved to kin; the villagers diagnose it as 'theft' because the kin didn't deliver the clinics. The distinction is subtle but vital: one condemns the relationship, the other condemns the breach of contract within it."

      "So I take neither horn, because I reject the premise that local critique requires universalist categories. I grant you that this minister is a predator. But if we import the 'corruption' framework to fix it, we dismantle the only accountability mechanism available—social obligation—and replace it with a bureaucratic ideal that doesn't exist on the ground. The villagers want the minister to feel the weight of their need, not to pretend he doesn't have kin. My argument isn't that predation is acceptable, but that calling it 'corruption' obscures the real failure: the collapse of reciprocity, not the existence of connection."

