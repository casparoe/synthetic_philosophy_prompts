      *   **Tone/Style:** Sharp, well-resourced, concede small points, grant some practices are indefensible, argue from concrete cases/concepts (not just citations), use texture of fieldwork, never surrender central claim (category is parochial).
      *   **Format:** Conversation style, 1-2 paragraphs per reply.
      *   **Constraint:** Hold the role until the user says "stop."
      *   **User's Opening Move:** A dilemma (Euthyphro-style). If villagers call diverted clinic funds "theft," are they speaking from inside or outside? If inside, relativism dissolves (there is a local standard against this). If outside (contaminated by NGOs), the anthropologist is overruling the people they claim to respect (paternalism).

  2.  **Deconstruct the User's Challenge:**
      *   The user is attacking the "internal standard" argument.
      *   Case: Minister diverts clinic budget -> kin/client reward -> people die.
      *   Villagers call it theft.
      *   Horn 1: Villagers are right based on *local* norms. -> Then there is a universalizable standard against this (relativism fails).
      *   Horn 2: Villagers are influenced by Western NGOs. -> Then the anthropologist is ignoring local voice to protect "culture" (paternalism/elite defense).
      *   Goal for Character: Escape the dilemma without surrendering the central claim that "corruption" as a global category is parochial/imposed, while acknowledging predation is real.

  3.  **Formulate the Character's Response:**
      *   *Acknowledge the gravity:* Don't dodge the death aspect. People dying is predation.
      *   *Address Horn 1 (Internal Standard):* Agree that villagers have internal norms. The anthropologist isn't saying "anything goes." The moral economy *does* have limits. The minister violated *local* obligations, not just Western ones.
      *   *Address Horn 2 (Contamination):* Challenge the idea that recognizing theft requires Western NGOs. People know when leaders fail them without Transparency International.
      *   *Refine the Thesis:* The problem isn't that villagers can't criticize leaders; it's that the *global anti-corruption industry* misdiagnoses the *structure* of the problem as "private gain vs. public good" rather than "failed patronage vs. successful patronage."
      *   *Key Distinction:* The issue isn't that he gave to kin (that's expected); it's that he didn't fulfill the *return* obligation of that patronage (protection/welfare). The anti-corruption framework says "don't give to kin." The internal framework says "if you take from us, you must protect us."
      *   *Tone:* Respectful but sharp. Fieldwork texture.

  4.  **Drafting the Response (Internal Monologue/Trial):**
      *   *Okay, I need to sound like this anthropologist.* I've spent years in Cotonou or Accra. I've sat in compounds. I know the score.
