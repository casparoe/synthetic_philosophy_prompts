answer: |-
  **The Szilard Cell: Ambient Information Harvesting**
  **Created by Julian Voss, Isolated Systems Lab**

  **About This Project**

  Thermodynamics isn't a wall; it's a ledger. For a century, we've been told the second law is absolute. But the law accounts for information as physical currency. The Szilard Cell isn't a generator. It's an exchange rate arbitrageur.

  We place a micro-electromechanical gate between two chambers. It measures individual air molecules. Fast ones go left; slow ones go right. This creates a temperature gradient. We run a Stirling engine off the difference. The room cools; the turbine spins.

  Critics will scream "Perpetual Motion." They're looking at energy conservation and missing the information balance. Measurement is thermodynamically free. You don't have to burn fuel to know a molecule's speed. We've replicated the single-molecule feedback loops seen in recent optical trap experiments, scaling them to macroscopic airflow.

  The usual objection is Landauer's Principle: erasing information costs energy ($kT \ln 2$ per bit). Everyone assumes the demon must erase its memory to continue working. But our logic gates are reversible. We don't delete the measurement history; we stack it. As long as the computation is reversible, there is no erasure cost. We aren't breaking physics. We're just deferring the entropy debt indefinitely while harvesting the interest.

  This is information-to-energy conversion. The air provides the heat; our algorithm provides the order.

  **FAQ**

  **Q: Does this violate the Second Law?**
  A: No. The total entropy of the system plus the memory buffer never decreases. We are exporting entropy into the stored data stream.

  **Q: How long does the battery last?**
  A: The device powers itself indefinitely, provided the memory buffer has capacity.

  **Comments**

  **Sarah_Jenks** *Backer*
  This is incredible. Finally something that makes sense of the information theory hype. Shipping to Canada?

  **PhaseSpaceDrifter** *Backer*
  Hi Julian. Former stat mech grad student here. The pitch is technically precise, which is rare. You're correct that measurement doesn't require energy dissipation—Brillouin got that wrong, and Bennett corrected it thirty years ago. Most people think the demon burns energy looking at the molecules. It doesn't.

  However, your reversible computing argument hits a hard stop at capacity. You're storing the entropy in the memory buffer rather than dumping it as heat. That works until the buffer fills. Once your finite storage is full, you must reset to continue sorting. Resetting requires erasure. Erasure dissipates heat $\ge$ the work you extracted during the sorting phase.

  So the device works exactly as described until the drive is full. Then it stops, or you pay the energy cost to wipe it, which zeroes out your net gain. The books balance to zero over a full cycle. Still, great demo of the transient effect. Pledging for the casing alone.

  **Julian Voss** *Creator*
  @PhaseSpaceDrifter: We're looking into infinite tape architectures.

  **PhaseSpaceDrifter** *Backer*
  Good luck with the hardware.
