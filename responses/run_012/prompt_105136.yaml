answer: |-
  There is no single, settled noun phrase in the historiographical lexicon that captures this exact configuration with the precision you are seeking. However, you are describing a central problem in **Critical Archive Studies** and **Postcolonial Historiography**.

  The closest established concepts are **Archival Violence** (Ann Laura Stoler), **Silencing the Past** (Michel-Rolph Trouillot), and **Epistemicide** (Boaventura de Sousa Santos). Yet, as you noted, these describe the *act* of suppression or the *nature* of the archive, rather than the specific *methodological bind* facing the historian who must adjudicate between them.

  If I were to propose a name for this specific configuration—the asymmetry where the *criteria* for historical truth reproduce the *power dynamics* of the original violence—I would call it **The Evidentiary Double-Bind** (or **The Archival Double-Bind**).

  Here is an analysis of the existing theoretical landscape, why they fall slightly short of your description, and how to mark the boundaries of this proposed term.

  ### 1. The Established Neighbors
  You are correctly navigating around three major concepts. It is useful to state why they are adjacent but not identical to your bind.

  *   **Archival Violence (Stoler):** Ann Laura Stoler argues that archives are not neutral repositories but "active sites of knowledge production" that embody colonial power. The logbook is an act of archival violence. However, this term usually describes the *creation* of the record or the *structure* of the archive, not necessarily the contemporary historian's dilemma of verification.
  *   **Silencing the Past (Trouillot):** Michel-Rolph Trouillot describes how power shapes which narratives become "history" and which remain "silence." Your scenario is a textbook example of Trouillot's "silencing." However, "silencing" describes the *outcome* (the community is unheard), whereas you are describing the *mechanism of adjudication* (the historian's trap).
  *   **Testimonial/Hermeneutical Injustice (Fricker):** As you noted, these are close. *Testimonial injustice* is a credibility deficit assigned to a knower. *Hermeneutical injustice* is a lack of collective concepts to understand an experience. Your scenario is distinct because the community *has* concepts (the song) and the historian *hears* them, but the **medium itself** is disqualified by the rules of the discipline. This is not just a credibility deficit; it is a **medium-based hierarchy**.

  ### 2. Proposed Name: The Evidentiary Double-Bind
  I suggest **The Evidentiary Double-Bind** to capture the specific trap you described.

  **Definition:** An epistemological configuration in which the standards of evidence required to verify a historical event are structurally aligned with the perpetrators of that event, such that adhering to professional standards reproduces the original violence, while rejecting those standards risks professional illegitimacy.

  **Why this name?**
  *   **Evidentiary:** It locates the problem not in the *facts* (what happened) but in the *rules of proof* (how we know).
  *   **Double-Bind:** It captures the "no-win" situation. If the historian accepts the logbook, they validate the perpetrator's framing ("labor disturbance"). If they accept the song, they violate the disciplinary norms of "archival evidence" and risk being labeled unscientific. Neutrality is impossible; the method itself is partisan.

  ### 3. Marking the Boundaries
  To use this term rigorously, you must distinguish it from neighboring ideas.

  **Vs. Oral History:**
  *   *Oral History* is a methodology that seeks to record memory.
  *   *The Evidentiary Double-Bind* is the structural conflict that arises when oral history clashes with the "sovereignty of the document." Oral history assumes the memory *can* be collected; the Double-Bind asks whether that memory *counts* as evidence against a state record.

  **Vs. Testimonial Injustice:**
  *   *Testimonial Injustice* is often interpersonal (a listener prejudices a speaker).
  *   *The Evidentiary Double-Bind* is **systemic and medium-specific**. It does not matter how credible the singer is; the *song form* is structurally subordinate to the *logbook form* within the discipline of history. The injustice is baked into the epistemology, not just the psychology of the historian.

  **Vs. Revisionism:**
  *   *Revisionism* implies correcting the facts based on new evidence.
  *   *The Evidentiary Double-Bind* implies that the *definition* of evidence is the site of conflict. It is not about finding a new document; it is about challenging the hierarchy that makes the document superior to the performance.

  **Vs. Agnotology (The Study of Ignorance):**
  *   *Agnotology* studies how ignorance is culturally produced.
  *   *The Evidentiary Double-Bind* is a specific *mechanism* of agnotology. It explains *how* the ignorance is maintained: through the procedural rules of verification.

  ### 4. Theoretical Lineage for Your Reporting
  If you use this concept in your reporting, you can ground it in the work of scholars who have grappled with this exact asymmetry:

  *   **Saidiya Hartman's "Critical Fabulation":** In *Venus in Two Acts*, Hartman deals with the archive of slavery (perpetrator records). She argues that because the archive is violent, the historian cannot simply "read against the grain." They must acknowledge that the archive *cannot* tell the truth of the victim without speculative intervention. This validates the song not as "fact" in the logbook sense, but as a necessary counter-ontology.
  *   **Boaventura de Sousa Santos's "Epistemicide":** This describes the killing of alternative knowledge systems. The dismissal of the song is not just skepticism; it is the continuation of the epistemicide begun when the community's records were destroyed.
  *   **Jacques Derrida's "Archive Fever" (Mal d'Archive):** Derrida argues that the archive is not just a place of memory but a place of *command* (archon). The logbook commands what is true. The Double-Bind arises when the *archon* is the murderer.

  ### 5. Summary for Application
  In your reporting, you might frame it this way:

  > "Historians call this **Archival Violence**, but for the reporter on the ground, it presents an **Evidentiary Double-Bind**. The militia's logbook is treated as 'hard evidence' not because it is truthful, but because it is bureaucratic. The community's song is treated as 'folklore' not because it is false, but because it is performative. To choose the logbook is to adopt the perpetrator's epistemology; to choose the song is to abandon the discipline's standards. This is not a gap in the record; it is a conflict in the rules of truth."

  This framing allows you to move beyond "he said/she said" and expose the structural machinery that makes the logbook appear more real than the massacre itself.
