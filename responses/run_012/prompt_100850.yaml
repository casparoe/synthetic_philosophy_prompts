      *   **Task:** Critique the summary sentence-by-sentence (what's accurate, what's questionable, what's false).
      *   **Specific Question:** Does the conclusion ("microhistory shows grand structural histories got it wrong") follow from the premises, or is it a smuggled conclusion?
      *   **Tone:** Helpful, expert but accessible, nuanced (since the user is a novelist, not a PhD candidate, but wants to avoid embarrassment).

  2.  **Deconstruct the Input Text (Sentence by Sentence Analysis):**

