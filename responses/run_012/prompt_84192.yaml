      *   *Legitimacy:* The "Technocracy" problem. If safety requires expertise the public lacks, is imposing the tax undemocratic?
      *   *Coordination:* The "Definition of Defection" problem. Is optimizing for speed defection? Or is it just market behavior?
      *   *Capability:* (The distraction).

