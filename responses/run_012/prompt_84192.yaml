      *   **Topic:** A three-year conceptual working group on "competitiveness constraint" and "alignment tax" in AI safety.
      *   **Resources:** Funding for ~4 philosophers, 2 workshops/year.
      *   **Core Problem:** Unilateral safety measures lead to being outcompeted (safety is self-undermining).
      *   **Constraint:** Avoid rehashing the standard slogan.
      *   **Framework:** Split "alignment tax" into four burdens:
          1.  *Capability Burden:* Raw performance cost.
          2.  *Coordination Burden:* Cost of moving only when others do.
          3.  *Legitimacy Burden:* Cost of public justification.
          4.  *Epistemic Burden:* Cost of reduced evaluability/understandability.
      *   **Goal:** Identify open conceptual questions, ordered by dependency structure (upstream/downstream), tractability for philosophers (vs. ML researchers), and high leverage (answers change priorities).
      *   **Specific Task:** Identify which burden is most likely a *distraction* and why.

  2.  **Deconstruct the Four Burdens:**
      *   *Capability:* This is largely empirical/technical. How much does RLHF slow down inference? How much does interpretability reduce benchmark scores? Philosophers can't measure this directly.
      *   *Coordination:* This is game theory/political philosophy. How do we enforce agreements? What counts as "defection"?
      *   *Legitimacy:* This is political philosophy/ethics. Who gets to decide safety standards? Democratic oversight vs. technocratic rule.
      *   *Epistemic:* This is epistemology/philosophy of science. What does it mean to "know" a system is safe? Does safety intervention obscure the mechanism?

  3.  **Determine Dependency Structure (Upstream vs. Downstream):**
      *   *Epistemic* seems most upstream. Before we can measure capability costs, coordinate on standards, or justify rules, we need to know *what* we are measuring and *how* we know safety is achieved. If safety measures make systems opaque (Epistemic Burden), we can't verify the Capability Burden or trust the Coordination agreements.
      *   *Capability* is foundational but empirical. Philosophers need to define the *metric* of capability, but the actual cost is ML work. However, the *concept* of "performance" is philosophical (performance at what? helpfulness? power? profit?).
      *   *Legitimacy* depends on knowing what the rules are (Epistemic/Capability) and who is bound (Coordination).
      *   *Coordination* depends on knowing what we are coordinating *on* (Legitimacy/Epistemic) and the stakes (Capability).

      *Refined Dependency:*
      1.  **Epistemic:** What counts as knowledge of safety? (If we can't know it, the rest is moot).
      2.  **Capability:** What counts as a loss? (Defining the "tax" metric).
      3.  **Legitimacy:** Who has the authority to impose the tax?
      4.  **Coordination:** How do we enforce the imposition?

      *Wait, let's look at the "Philosopher Tractability" constraint.*
      *   Capability: Low tractability for philosophers (mostly empirical).
      *   Coordination: Medium/High (Game theory, political philosophy).
      *   Legitimacy: High (Political philosophy, ethics).
      *   Epistemic: High (Epistemology, philosophy of science).

      *Revised Dependency for Philosophers:*
      1.  **Epistemic:** Defining "safety knowledge" is prerequisite to discussing the cost of obtaining it.
      2.  **Legitimacy:** Defining the authority to mandate safety is prerequisite to coordinating enforcement.
      3.  **Coordination:** Mechanisms of enforcement depend on legitimacy and the nature of the burden.
      4.  **Capability:** This is the *object* of the other three, but philosophers should treat it as a variable to be defined, not measured.

  4.  **Identify High-Leverage Questions:**
      *   *Epistemic:* Does safety *necessarily* reduce interpretability? Or is that a contingent engineering fact? If it's necessary, the trade-off is hard. If contingent, the "tax" is a design challenge.
      *   *Legitimacy:* Is a "global pause" legitimate without democratic consent? If not, the coordination burden becomes infinite.
      *   *Coordination:* Is the competitiveness constraint a Prisoner's Dilemma or a Stag Hunt? This changes the solution entirely.
      *   *Capability:* Is the tax linear or exponential? (Again, mostly empirical, but the *concept* of "capability" needs work).

  5.  **Identify the Distraction:**
      *   *Capability Burden:* Why? Because it's primarily an engineering/empirical question. Philosophers speculating on "how much speed we lose" is armchair empiricism. The *existence* of a trade-off is the premise; the *magnitude* is for ML researchers. Philosophers should focus on the normative and structural implications of that trade-off, not the trade-off itself.
      *   *Counter-argument:* Defining "capability" is philosophical.
      *   *Rebuttal:* The prompt asks about the *cost* (tax). Measuring the cost is empirical. Defining the *value* of the cost is philosophical. But compared to Legitimacy and Epistemic burdens, Capability is the least conceptually rich for a *philosophy* group. It risks turning into a literature review of ML papers rather than conceptual work.

  6.  **Drafting the Plan (Year by Year/Phase by Phase):**

      *   *Phase 1 (Upstream): Epistemic & Definitional.* What are we measuring? What counts as knowing a system is safe?
      *   *Phase 2 (Midstream): Legitimacy & Normative.* Who decides? Is the tax justified?
      *   *Phase 3 (Downstream): Coordination & Strategy.* How do we implement given the above?

  7.  **Refining the Questions:**
