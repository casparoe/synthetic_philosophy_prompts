answer: |-
  The established term that comes closest to what you are describing is a **Real Pattern**.

  This concept was most rigorously developed by the philosopher **Daniel Dennett** (specifically in his 1991 paper *Real Patterns* and later in *The Intentional Stance*). However, to capture the specific nuance of *incompatible* frameworks both yielding reality (your ML example), you need to situate "Real Patterns" within a meta-framework called **Perspectival Realism** (championed by philosophers of science like Ronald Giere and Michela Massimi).

  Here is the breakdown of the term, its boundaries, and how it differs from the near-neighbors you rejected.

  ### The Term: Real Pattern

  **Definition:** An entity is a "Real Pattern" if detecting it allows for **lossy compression** of data with **predictive payoff**. It is real not because it is made of "stuff" (ontological fundamentalism), but because ignoring it makes the world harder to predict.

  **Why it fits your criteria:**
  1.  **Predictive/Explanatory:** Dennett's core criterion is information theoretic. If positing the entity allows you to compress the description of the system's behavior (Minimum Description Length) and predict held-out data, it is real.
  2.  **Not Bedrock:** A center of gravity is the classic example. There is no particle of "gravity" inside the object. But if you treat the center of gravity as a real object, you can predict tipping points. It is real *as a pattern*, not as a substance.
  3.  **Truth-apt:** You can be wrong about a real pattern. If you posit a feature direction in your neural net that fails on held-out data, it wasn't a real pattern; it was overfitting (noise).
  4.  **Framework Relative:** Patterns are only visible from a certain "stance" or descriptive vocabulary.

  ### The Nuance: Handling Incompatibility (Perspectival Realism)

  Dennett's original formulation sometimes implies that if two patterns conflict, one is usually "more real" (more compressive). Your ML example (two incompatible feature bases that both work) pushes this further. This is where **Perspectival Realism** refines the term.

  In this view, the "Real Pattern" is not just relative to a framework, but **Perspectival**.
  *   **The Claim:** Reality is not a single, framework-independent structure. It is the intersection of the world and a specific model/perspective.
  *   **The Incompatibility:** Two incompatible feature sets can both be "Real Patterns" because they are real *relative to their respective descriptive bases*. Neither is the "One True Carving."

  ### Boundaries: What's In and What's Out

  To use this term precisely, you need to know where the edges are.

  **IN (Real Patterns):**
  *   **Your ML Features:** A direction in activation space that robustly predicts "stripe-ness" on held-out data. It is not a physical wire, but it is a real structural regularity in the computation.
  *   **The "Gene for Eye Color":** It is not a single molecular blob. It is a functional node in a causal network that allows for reliable prediction of phenotype.
  *   **Centers of Gravity:** No physical particle, but indispensable for physics calculations.
  *   **Economic Inflation:** You cannot touch inflation. It is not a pile of coins. But it is a real pattern in transaction data that predicts future prices.
  *   **Beliefs/Desires:** (Dennett's favorite). No "belief particle" in the brain. But treating an agent as having beliefs predicts their behavior better than treating them as a pile of atoms.

  **OUT (Not Real Patterns):**
  *   **Phlogiston:** It was a useful story once, but it stopped earning its keep. It no longer compresses or predicts chemical data better than oxygen theory. It is a *dead* pattern.
  *   **Arbitrary Noise:** If you draw a circle around a random cluster of points in your activation space that doesn't predict anything on held-out data, that is not a real pattern. It is a "gerrymandered" description.
  *   **Pure Fictions:** Santa Claus. Positing Santa does not compress the data of "presents under the tree" better than positing "parents." (Unless you are analyzing the *sociology* of Santa, in which case Santa is a real pattern in the social network, not the physical delivery network).
  *   **Bedrock Particles (in this context):** Electrons are arguably Real Patterns too, but in your specific comparison, they represent the "fundamental" baseline. The distinction is that Real Patterns *depend* on the descriptive level, whereas fundamentalists claim electrons do not.

  ### Distinctions from Nearest Neighbors

  You mentioned being unsatisfied with "Instrumentalism," "Emergence," and "Higher-Level." Here is exactly how **Real Pattern** differs:

  **1. vs. Instrumentalism**
  *   **Instrumentalism:** Says, "The theory is just a tool. Don't ask if the entity exists, only if the math works." It denies truth value to the entity.
  *   **Real Pattern:** Says, "The entity *does* exist, but its existence consists in its predictiveness." It affirms truth value. You can be *wrong* about a Real Pattern (e.g., if the feature stops working), whereas a fiction is just useful or not.
  *   *The Edge:* If you treat the feature as a "lie that helps," that's instrumentalism. If you treat it as "a genuine structural regularity that only exists relative to this description," that's Real Pattern.

  **2. vs. Emergence / Higher-Level**
  *   **Emergence:** Implies a hierarchy. The pattern exists *because* of the lower level (e.g., wetness emerges from water molecules). It suggests the pattern is "less real" or "derivative."
  *   **Real Pattern:** Does not require hierarchy. Your two ML features are likely at the *same* level of abstraction, just rotated. Neither is "more emergent." They are just different compressions of the same data.
  *   *The Edge:* Emergence is about *causation from below*. Real Pattern is about *information compression from any angle*.

  **3. vs. Social Construct**
  *   **Social Construct:** Implies the entity exists because people *agree* it exists (e.g., money, borders).
  *   **Real Pattern:** Implies the entity exists because the *data* supports it, regardless of agreement. If everyone forgot what a "stripe" was, the neural feature predicting stripes would still work on the data.
  *   *The Edge:* Constructs depend on minds agreeing. Real Patterns depend on the world (or the model) having structure.

  ### If You Want to Coin a Term

  If "Real Pattern" feels too tied to Dennett's specific philosophy of mind, the most precise descriptive coinage for your specific ML/Biology context is a **Compression-Relative Entity**.

  *   **Definition:** An entity whose ontological status is contingent on its ability to reduce the description length of a system's behavior within a specific representational framework.
  *   **Boundary Case:** If two incompatible frameworks both yield compression, both entities are real *relative to their framework*.
  *   **Why coin it?** It strips away the baggage of "patterns" (which sounds vague) and focuses on the mechanism you identified: **prediction via compression**.

  ### Summary Recommendation

  Use **Real Pattern**. It is the established philosophical term for "real but description-dependent."

  However, to capture the "incompatible frameworks" aspect, you should qualify it: **"Perspectival Real Patterns."**

  *   **Use it when:** You want to assert that the feature/gene is not a fiction, but also not a fundamental particle.
  *   **Don't use it when:** You are discussing entities that claim to be framework-independent (like "the absolute truth"), or entities that have lost predictive power (like phlogiston).
  *   **The "Honest Answer":** When asked "Is the stripe-feature real?", the Real Pattern answer is: *"Yes, it is a robust compressive regularity in the activation space relative to the current basis. It is as real as a center of gravity."*
