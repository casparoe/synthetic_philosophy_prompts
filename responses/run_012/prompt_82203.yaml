      *   Flag thin replies? Check.
      *   Nightmare Question? Check.

  9.  **Final Polish:** Ensure the distinction between the Historian's vocabulary (evidence, anachronism) and the Lawyer's vocabulary (liability, standing, reparations) is clear. Ensure the "uptake" wrinkle is the central tension.

      *(Self-Correction during drafting)*: Make sure I don't give the user a reply that sounds like they know more than they do. The user admitted the "uptake" part is the least sure. The replies should reflect that uncertainty strategically without sounding weak. "That's the next phase of the project" is a valid academic deflection.

      *(Refining the Nightmare Question)*: The user suspects they know what it is. I should validate that suspicion. The suspicion is likely about the *arbitrariness* of the cutoff. "Who decides when standing expires?" is the classic slippery slope. But the *financial/institutional* implication is sharper. Let's go with the "Who pays?" angle.

      *(Wait, one more check on the History objection)*: Historians hate "memory." They will attack the idea that "standing" dictates archival priority. That's a "presentist" sin. I need to make sure that objection is distinct from the Law one. Law cares about *remedy*; History cares about *distortion*.

      *(Final Plan)*:
      1.  The Coherence Trap (Phil/Prof) - Highest Damage.
      2.  The Transitional Justice Trap (Law) - High Damage.
      3.  The Presentism Trap (History) - Medium/High Damage.
      4.  The Reference Trap (Phil Language) - Medium Damage.
      5.  Nightmare Question.

