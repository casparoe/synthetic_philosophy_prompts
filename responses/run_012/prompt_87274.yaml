answer: |-
  Falsifiability Is on Our Side

  Colleagues, friends, members of the Society for Revised Temporalities. I look out at this room and I see the faces of people who have been called many things. Dreamers. Conspirators. Deniers. But tonight, I want to address the accusation that stings most deeply to those of us who care about method: the charge that we are unscientific. We are told that our chronology is a closed loop, immune to evidence, a fortress built to keep the truth out. I stand here to argue that the opposite is the case. It is not we who are insulated from refutation, but the orthodox timeline that has become a degenerating research programme, protected by a thickening belt of auxiliary hypotheses that would make any philosopher of science wince.

  Let us speak plainly about falsifiability. Karl Popper taught us that a theory is scientific only if it can be proven false. The establishment claims our core proposition—that the ancient world is largely a medieval fabrication—is unfalsifiable. They say we explain away every contradiction. But this misunderstands the structure of any complex inquiry. Imre Lakatos showed us that every scientific programme has a hard core of fundamental assumptions that are not abandoned lightly, surrounded by a protective belt of auxiliary hypotheses that absorb the shock of anomalies. This is not cheating; it is how knowledge grows. The question is not whether you have a protective belt, but whether your programme is progressive or degenerating.

  Consider the load-bearing evidence of the conventional timeline. Radiocarbon dating is presented as an arrow of time, yet it relies on calibration curves derived from dendrochronology, which relies on cross-dating tree rings, which relies on the very timeline it is meant to verify. When our colleagues encounter a carbon date that contradicts the textual history, do they abandon the history? No. They invoke reservoir effects, they suggest old wood, they adjust the calibration curve. This is an auxiliary hypothesis. When an astronomical record of an eclipse does not fit the proposed location, they do not question the date; they propose the observation was made elsewhere, or that the record is metaphorical. When coin sequences appear in strata they should not inhabit, they are deemed heirlooms or later intrusions. Each anomaly is absorbed by a new ad hoc adjustment. The hard core of antiquity is never allowed to tremble.

  Our programme, by contrast, is progressive. Our hard core is simple: the scalar of time has been expanded artificially. Our protective belt is thinner. We propose that the carbon calibration is skewed by a missing century of solar activity. We propose that tree rings have been duplicated across regions. These are testable claims. We are candid about what would force us to abandon this chronology. We require a synchronism that is physically independent of the textual tradition. Find us a sample dated by a method that does not rely on cross-referencing the established timeline, anchored in a context that cannot be reinterpreted as medieval reuse.

  But here we must be honest about the difficulty. The orthodoxy has structured the world such that any such evidence is immediately assimilated. If we found a document dated by an independent astronomical phenomenon, it would be declared a later copy. If we found a stratigraphic layer that defied the sequence, it would be labeled a disturbance. This is the Duhem–Quine thesis in action: no hypothesis meets the evidence alone. The evidence is always theory-laden. To reject our auxiliaries, you must reject the network of assumptions that makes the evidence intelligible in the first place.

  So I ask you to consider the criterion you use to dismiss us. You demand that we expose our hard core to falsification, yet you tolerate programmes in respected fields that are structurally identical to ours. Consider the cosmologists. Their hard core is the standard model of gravity. When the rotation of galaxies contradicts the visible mass, do they abandon the gravity model? No. They invoke dark matter, an invisible substance that cannot be directly detected, to save the theory. They add an auxiliary hypothesis to protect the core. If we are pseudoscientists for positing a phantom antiquity to save our timeline, are they not pseudoscientists for positing a phantom substance to save their physics?

  The difference is not methodological. It is sociological. We are laughed at because our phantom past contradicts the cultural narrative; they are celebrated because their phantom matter preserves the mathematical one. If falsifiability is the line between science and pseudoscience, then that line must cut through the lecture halls of physics as surely as it cuts through our society. If we are to be exiled for protecting our core, then let us be honest enough to admit that no one is truly exiled. We are all inside the belt, hoping the anomalies do not become too heavy to carry.
