      *Ready to write.*
answer: |-
  Your friend is incorrect. Historical materialism is **not** committed to the view that the superstructure has no reciprocal effect on the base. The position your friend describes is known as "vulgar Marxism" or "economic determinism," a simplification that Marx and Engels explicitly rejected during their lifetimes.

  You are conceptually safe to write your novel as planned. A sermon can move mill hands to act without violating historical materialism, provided you understand the mechanism correctly.

  ### The Theoretical Reality

  The core of the disagreement lies in the definition of "determination." Your friend interprets it as linear, mechanical causation (A causes B, B cannot cause A). Marx and Engels understood it dialectically.

  1.  **Engels' Letters:** Your friend dismisses Engels' late letters (specifically to Joseph Bloch in 1890 and Conrad Schmidt in 1890) as a retreat. However, mainstream Marxist scholarship regards these as essential clarifications. In the letter to Bloch, Engels writes: *"According to the materialist conception of history, the ultimately determining element in history is the production and reproduction of real life. More than this neither Marx nor I have ever asserted. Hence if somebody twists this into saying that the economic element is the **only** determining one, he transforms that proposition into a meaningless, abstract, senseless phrase."*
  2.  **Interaction (*Wechselwirkung*):** Engels explicitly states that while the economic movement is *ultimately* decisive (it sets the boundaries and the final trajectory), the various elements of the superstructure (politics, law, religion, philosophy) react upon one another and upon the economic base. They are not mere epiphenomena; they are active forces.
  3.  **Ideas as Material Forces:** Marx wrote in *A Contribution to the Critique of Hegel's Philosophy of Right* that *"Theory becomes a material force as soon as it has gripped the masses."* For a materialist, an idea is not a ghost; it is a neurological and social event that alters human behavior. Since human labor is the basis of the economic "base," anything that alters human labor (like a sermon inspiring a strike or a work ethic) is acting upon the base.

  ### What This Means for Your Novel

  You do not need to treat your characters' beliefs as mere symptoms. You can treat them as causes. To remain within a materialist framework, you simply need to ensure the **genesis** and **reception** of those ideas are grounded in the material reality of your mill town.

  *   **Don't write:** A preacher arrives from nowhere with angelic truths that magically change the workers' minds independent of their circumstances. (This *would* be idealism).
  *   **Do write:** The preacher's sermon resonates *because* the material conditions of the mill (wages, danger, hours) have made the workers receptive to that specific message. The idea is the spark, but the material conditions are the gunpowder. The sermon organizes the latent discontent produced by the base.

  In this view, the sermon is a **mediation**. It is the tool through which the economic contradictions of the mill town become conscious to the workers, allowing them to act back upon the mill. This is not idealism; it is dialectics.

  ### Confidence and Uncertainty

  **Confidence Level:** **High (90-95%)** regarding the theoretical question.
  There is a strong consensus among scholars of Marxism (from Lenin and Gramsci to Althusser and E.P. Thompson) that "economic determinism" is a distortion of historical materialism. The texts of Marx and Engels support the view of reciprocal action.

  **Least Certain Part:** **The boundary of "Orthodoxy."**
  I am less certain about how your friend defines "orthodox." If by "orthodox" they mean the specific dogma of the Second International or later Stalinist *Diamat* (Dialectical Materialism), then your friend is historically correct that *some* traditions enforced strict determinism. However, if "orthodox" means faithful to the actual writings of Marx and Engels, your friend is wrong. There is a scholarly debate (notably by Louis Althusser) that Engels' letters *did* represent a theoretical slip toward positivism, but even Althusser argued for the "relative autonomy" of the superstructure, not its total impotence. Therefore, even by the stricter structuralist standards, the superstructure retains causal power.

  **Summary:** Write the sermon. Make it move the people. Just ensure the reader understands why that sermon, in that town, at that time, had the power to move them. That is the materialist novel.
