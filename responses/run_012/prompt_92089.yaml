answer: |-
  **The Coherence Commitment**
  Your suspicion is correct: assigning weights is not a statistical step; it is a theoretical one. There is no theory-neutral way to select a reference class, because selecting a class asserts that the features defining it are causally relevant to the outcome. To weight (b) higher than (e) is to claim that fiscal/structural features drive hegemonic decline more than cultural ones. The "outside view" does not escape theory; it merely forces you to formalize your causal priors into a frequency distribution. If you pretend the weighting is mechanical, you are lying to the students about how prediction works.

  **The Exclusion Commitment**
  Class (e) (Religion) should be excluded outright (0.00). A correlation between religion and hegemony in the modern era is almost certainly confounded by geography, industrialization timing, or colonial legacy; treating it as a causal class teaches students to mistake spurious correlation for mechanism. Class (f) (Inside View) must also be excluded (0.00), not because it lacks value generally, but because it is a category error in an exercise explicitly designed to penalize inside-view overconfidence. Class (d) (Black Box) should be down-weighted but not zeroed: it acknowledges predictive signal exists outside human comprehension, but for a *history* seminar, uninterpretable features fail the "explanation" half of your course title.

  **The Answer Key**

  1.  **(b) Reserve-currency + military tech lead [0.35]**
      This class best captures the structural specificity of the focal case; it isolates the unique vulnerabilities of a *financialized* hegemon rather than a territorial empire, making it the strongest baseline for this specific transition.

  2.  **(c) Tax take < military cost [0.30]**
      This identifies the immediate mechanism of failure (imperial overstretch) described in the prompt; it is highly predictive of collapse but slightly narrower than (b), risking overfitting to the crisis moment rather than the structural position.

  3.  **(a) All great powers [0.20]**
      This provides the necessary background rate to prevent overconfidence in the specific classes above, but it is too blunt to carry the bulk of the weight since it ignores the unique fiscal and monetary constraints of the focal case.

  4.  **(d) Black-box algorithmic cluster [0.15]**
      This retains a slot for genuine predictive signal that human theory misses, forcing students to confront the tension between accuracy and intelligibility, but is capped because uninterpretable features cannot sustain historical argumentation.

  5.  **(e) Dominant religion [0.00]**
      Excluded because the correlation is likely spurious; weighting this would validate a causal mechanism (theology) that has no plausible leverage on 25-year geopolitical fiscal sustainability.

  6.  **(f) Inside view (class of one) [0.00]**
      Excluded because it violates the methodological constraint of the unit; treating the case as unique negates the base-rate exercise entirely and reintroduces the narrative bias the outside view is meant to correct.
