answer: |-
  Here is a disambiguation menu of the claim *"the evidence underdetermines the theory — for any body of evidence there is always a rival theory that fits it just as well, so the choice between them is not really a rational matter at all."*

  The theses are ordered from trivial (nobody denies this) to radical (this would upend scientific realism).

  ### The Menu of Theses

  **1. The Logical Compatibility Thesis**
  *   **Claim:** For any *finite* set of data points, there are logically infinite curves (functions) that can be drawn through them.
  *   **Axes:** Logic / Finite Evidence / Mathematical Curves.
  *   **Verdict:** **Platitude.** This is a mathematical truth. It says nothing about whether those curves correspond to coherent physical theories or whether scientists accept them.
  *   **Does it license the conclusion?** **No.** Scientists do not choose theories based solely on fitting existing data points; they require coherence with background knowledge and future predictive capacity.

  **2. The Inductive Gap Thesis**
  *   **Claim:** No amount of observational evidence *logically entails* the truth of a theory (Hume's problem of induction). A theory could fit all current data and still be false.
  *   **Axes:** Confirmation / Finite Evidence / Truth vs. Fit.
  *   **Verdict:** **Platitude.** This is standard Humean skepticism. It applies to *all* empirical claims, not just scientific theories.
  *   **Does it license the conclusion?** **No.** Acknowledging that evidence doesn't *guarantee* truth does not mean choosing the best-supported theory is *irrational*. Rationality usually implies probability or warrant, not logical certainty.

  **3. The Auxiliary Adjustment Thesis (Duhemian)**
  *   **Claim:** For any theory T, if evidence arises against it, one can always save T by modifying auxiliary assumptions (about instruments, background conditions, etc.) to accommodate the data.
  *   **Axes:** Confirmation / Finite Evidence / Ad Hoc Modifications.
  *   **Verdict:** **Defensible Substantive Claim.** It is historically true that theories can be insulated from refutation. However, doing so often degrades the theory's quality (makes it ad hoc).
  *   **Does it license the conclusion?** **No.** While you *can* save a theory, the resulting rival is often scientifically degenerate. Rationality involves judging the *quality* of the adjustment, not just its logical possibility.

  **4. The Transient Empirical Equivalence Thesis**
  *   **Claim:** At any given *moment* in history, there may be two genuinely distinct theories (different ontologies) that fit the *current* evidence equally well.
  *   **Axes:** Confirmation / Current Evidence / Genuine Ontological Competitors.
  *   **Verdict:** **Defensible Substantive Claim.** This happens frequently in the history of science (e.g., geocentric vs. heliocentric models before precise telescopic data).
  *   **Does it license the conclusion?** **No.** This describes a temporary state of ignorance. The choice may be suspended until new evidence arrives, but waiting for more evidence is a rational strategy. It does not imply the choice is *in principle* non-rational.

  **5. The Global Empirical Equivalence Thesis (Strong Underdetermination)**
  *   **Claim:** For any theory T, there is a rival T' that is empirically equivalent regarding *all possible evidence* (past, present, and future), yet T and T' make different claims about the unobservable world.
  *   **Axes:** Logic & Confirmation / All Possible Evidence / Genuine Ontological Competitors.
  *   **Verdict:** **Overreach / Unproven.** While logically possible, no one has demonstrated that such rivals exist for our best mature theories (like Quantum Mechanics or General Relativity) that are also theoretically virtuous. Constructing such rivals usually requires contrived, disunified formulations.
  *   **Does it license the conclusion?** **Yes, but only conditionally.** If this thesis is true, *and* if one assumes that only empirical data counts as evidence, then the choice is not empirically rational.

  **6. The Non-Rational Choice Thesis (The Speaker's Conclusion)**
  *   **Claim:** Because of underdetermination, the actual selection of one theory over another is determined by social, psychological, or aesthetic factors, not epistemic reasons.
  *   **Axes:** Rationality / Psychology of Scientists / Sociological Explanation.
  *   **Verdict:** **Overreach / False.** This conflates "not determined by empirical data alone" with "not determined by reason." It ignores theoretical virtues (see below).
  *   **Does it license the conclusion?** **This is the conclusion itself.** It relies on Thesis 5 being true and theoretical virtues being irrelevant.

  ***

  ### Diagnosis of the Speaker's Intent

  **What they likely meant:**
  The speaker almost certainly intended **Thesis 5 (Global Empirical Equivalence)** to support **Thesis 6 (Non-Rational Choice)**. They moved quickly from the trivial observation that data doesn't entail theory (Thesis 2) to the radical claim that empirically equivalent rivals are always available (Thesis 5), treating the former as proof of the latter.

  **Where the gap opens:**
  The argument fails at the transition from **Thesis 4** to **Thesis 5**.
  1.  **The Existence Gap:** Just because *some* theories have rivals (Thesis 4) doesn't mean *all* theories do, or that the rivals are plausible (Thesis 5).
  2.  **The Rationality Gap:** Even if Thesis 5 were true, the conclusion (Thesis 6) follows *only if* you define "rationality" strictly as "response to empirical data." If theoretical virtues (simplicity, unity) are legitimate grounds for belief, the tie can be broken rationally even without new data.

  ***

  ### Breaking the Tie: Virtues vs. Smuggling

  You asked whether considerations like simplicity or explanatory unification legitimately favour one theory, or merely smuggle in extra evidence.

  **1. The Pragmatic View (Anti-Realist)**
  *   **Stance:** Simplicity and unity are pragmatic virtues, not epistemic ones. They make a theory easier to use, teach, or calculate, but they do not make it more *true*.
  *   **Implication for Realism:** If this view holds, underdetermination (Thesis 5) kills realism. We should treat theories as instruments for saving the phenomena, not descriptions of reality.
  *   **Is it smuggling?** No, it admits these are non-evidential values. But it denies they justify *belief*.

  **2. The Epistemic View (Realist)**
  *   **Stance:** Simplicity and unification are truth-conducive. Nature is likely simple/unified; therefore, a simpler theory is more likely to be true.
  *   **Implication for Realism:** This saves realism. Underdetermination is broken by "inference to the best explanation" (IBE). The "best" explanation includes non-empirical virtues.
  *   **Is it smuggling?** Critics say yes (it disguises aesthetic preference as evidence). Defenders say no (it is a necessary precondition for learning from experience; without assuming nature is uniform/simple, induction itself fails).

  **What turns on this for the realism debate:**
  *   **If virtues are pragmatic:** The speaker is right that belief in the *truth* of the theory is unjustified (Instrumentalism).
  *   **If virtues are epistemic:** The speaker is wrong. The choice is rational because one theory is objectively *better explained*, even if empirical data is identical.

  **Transient vs. Permanent Condition:**
  *   **Transient (Weak Underdetermination):** This is a report on the *present state* of some science (e.g., "We can't tell yet if dark matter is WIMPs or axions"). This is compatible with realism; we expect future evidence or better theoretical unification to decide.
  *   **Permanent (Strong Underdetermination):** This is a claim about the *nature of enquiry* itself (Thesis 5). This is the "scandal" version. It asserts that no amount of future science can distinguish the rivals.

  ### Summary for the Group

  To restart the discussion, you can pose this dilemma to the speaker:

  1.  **If you mean the trivial claim** (finite data fits infinite curves), you are right, but it doesn't stop us from rationally preferring the curve that unifies with the rest of physics.
  2.  **If you mean the radical claim** (there is always a globally equivalent rival with different ontology), you need to demonstrate such a rival exists for our best theories without making it gerrymandered or ad hoc.
  3.  **If you claim choice is irrational**, you are assuming that simplicity and explanation count for nothing. Are you prepared to argue that a unified theory is no more rationally believable than a disjointed one, provided they fit the data?

  The slogan is only a "scandal" if Thesis 5 is true *and* theoretical virtues are dismissed. If either fails, realism survives.
