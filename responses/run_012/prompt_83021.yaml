          *   Structure: List of desiderata first, then resolution of the two specific conflicts, then brief scorecard.

  2.  **Deconstruct the Desiderata (What must a theory do?):**
      *   A theory of persistence needs to explain identity over time.
      *   It needs to handle counting (synchronic and diachronic).
      *   It needs to handle change.
      *   It needs to handle cessation and resumption.
