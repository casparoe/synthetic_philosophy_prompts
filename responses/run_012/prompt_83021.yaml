          *   Theory Killer: **Fission**. It breaks the logic of identity ($A=B, A=C, B \neq C$).
          *   Empirical vs. Notational: Mostly notational/conceptual, except Relativity impacts the "Time as Dimension" requirement.

      *   *Brief Scorecard:*
