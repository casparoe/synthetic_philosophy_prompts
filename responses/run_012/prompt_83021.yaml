  8.  **Final Polish:** Ensure the tone is direct and helpful, cutting through the jargon where possible. Make sure the distinction between "requirement" and "case" is clear. (Self-Correction: Make sure I explicitly state *why* a requirement is non-negotiable vs. preference).

