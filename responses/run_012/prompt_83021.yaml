answer: |-
  Here is a list of desiderata for any theory of persistence. These are not arguments for one side or the other; they are the jobs the theory must perform. If a theory fails a non-negotiable requirement, it is broken. If it fails a camp-specific requirement, it is just unpopular with that camp.

  ### The Desiderata List

  **1. The Material Plasticity Requirement**
  *   **The Case:** The hiking trail. Every plank is replaced, the path shifts fifty feet, but it remains the "Pacific Crest Trail."
  *   **The Requirement:** The theory must explain how an object can survive the total replacement of its constituent matter and some structural alteration without becoming a numerically distinct object.
  *   **Why it's real:** This isn't just about trails; it's about biology (cells replace themselves) and law (corporations persist despite staff turnover). If a theory says the trail is a new object every time a plank is swapped, it contradicts basic linguistic and legal practice. A theory of persistence must account for *functional continuity* overriding *material identity*.

  **2. The Intermittency Requirement**
  *   **The Case:** The lake that dries up for a decade and refills.
  *   **The Requirement:** The theory must decide if an object can cease to exist (have no spatial extension or matter) and later resume existence as the *same* object.
  *   **Why it's real:** We talk this way ("The lake is back"). If the theory says the new water is a new lake, it conflicts with hydrology and geography tracking. If it says it is the same lake, it must explain what binds the pre-dry lake to the post-dry lake without continuous matter or continuous presence.

  **3. The Sortal Relativity Requirement**
  *   **The Case:** The band with no original members.
  *   **The Requirement:** The theory must acknowledge that persistence conditions depend on the *kind* of thing (the sortal) the object is.
  *   **Why it's real:** A "band" persists through member changes; a "molecule" does not persist through atom changes. A universal theory of persistence cannot treat a band and a rock identically. It must allow identity conditions to vary based on social function vs. physical constitution.

  **4. The Fission Constraint**
  *   **The Case:** The amoeba splitting.
  *   **The Requirement:** The theory must provide a truth value for "Is the original amoeba identical to Lefty?" and "Is the original amoeba identical to Righty?" without violating the logic of identity.
  *   **Why it's real:** Identity is transitive ($A=B, A=C \rightarrow B=C$). If the original is identical to both offspring, but the offspring are distinct, logic breaks. A theory cannot just shrug here; it must either deny identity holds, claim one offspring is the real one, or claim the original ceased to exist.

  **5. The Self-Co-location Constraint**
  *   **The Case:** Time travel. You stand next to your younger self.
  *   **The Requirement:** The theory must allow one numerically identical object to occupy two distinct spatial regions at the same temporal coordinate.
  *   **Why it's real:** If time travel is metaphysically possible (even if physically impossible), a theory of persistence shouldn't rule it out by definition. If your theory says "one object, one place at one time," you have defined time travel out of existence rather than explaining it.

  **6. The Static World Constraint**
  *   **The Case:** A world where nothing ever changes.
  *   **The Requirement:** The theory must distinguish between *persisting through time* and *undergoing change*.
  *   **Why it's real:** If time passes in a static world, does the rock persist? If persistence *requires* change, then nothing persists in a static world. If persistence is just "existing at multiple times," then things persist. The theory must clarify if duration is intrinsic to the object or dependent on external alteration.

  **7. The Synchronic Counting Constraint**
  *   **The Case:** Sitting in the chair.
  *   **The Requirement:** The theory must yield a definite number of objects located where you are sitting right now.
  *   **Why it's real:** We need to know if there is one thing (you), two things (you + your temporal part), or infinite things (you + the sum of your atoms + the sum of your cells). A theory that results in "it is arbitrary" fails to ground science or daily life.

  **8. The Dimensional Commitment**
  *   **The Case:** Treating time as just another dimension.
  *   **The Requirement:** The theory must state whether temporal extension is ontologically identical to spatial extension.
  *   **Why it's real:** This is not just a picture; it is an ontological claim. If time is like space, you have parts in time. If time is unlike space, you are wholly present. This dictates how the theory interacts with Special Relativity.

  ***

  ### Resolution 1: The Change Objections

  You asked about the two mirror objections:
  1.  **Against Endurance:** If the whole object is at $t_1$ and $t_2$, and it is Round at $t_1$ and Square at $t_2$, it is both Round and Square. Contradiction.
  2.  **Against Perdurance:** If the object is a worm with a round part and a square part, the *object itself* never changes properties. It just has variation. Real change is impossible.

  **Are they equal weight?**
  No. They press different requirements.

  *   **The Endurance Objection presses the Non-Contradiction Requirement.** This is a logical hard stop. An object cannot have incompatible intrinsic properties simultaneously. To survive this, the Endurantist must argue that properties are not intrinsic but *relations* to times (e.g., "round-at-$t_1$"). This saves logic but changes the nature of properties.
  *   **The Perdurance Objection presses the Intrinsic Change Requirement.** This is a conceptual/semantic pressure. It argues that "change" means one thing having different properties, not one thing having parts with different properties. To survive this, the Perdurantist must argue that our intuition about change is loose speak for "qualitative variation across temporal parts."

  **Verdict:** The Endurance problem is harder logically (it risks formal contradiction). The Perdurance problem is harder intuitively (it risks making the word "change" meaningless). However, the Endurance problem is a *requirement of logic*, whereas the Perdurance problem is a *requirement of linguistic fit*. Logic trumps linguistic fit. Therefore, the Endurance objection is the more dangerous of the two, forcing Endurantists into more complex metaphysical machinery (like temporal indexing of properties) to avoid contradiction.

  ***

  ### Resolution 2: Non-Negotiable vs. Camp-Specific

  Here is the breakdown of the list above.

  **Non-Negotiable Requirements (Must be met by any viable theory)**
  *   **Non-Contradiction:** (From the Change Objection). You cannot violate the law of non-contradiction.
  *   **Fission Constraint:** You must give a logical answer to the amoeba case. You cannot say "identity is vague" without breaking logic.
  *   **Synchronic Counting:** You must be able to count objects without explosion.

  **Camp-Specific Requirements (Preferences, not laws)**
  *   **Intermittency:** Endurantists often want this (the lake comes back). Perdurantists usually deny this (the worm is gappy, which is ontologically suspicious). This is a preference for how we use language vs. a preference for spatiotemporal continuity.
  *   **Dimensional Commitment:** Perdurantists *want* time to be like space. Endurantists *want* time to be distinct. This is the core disagreement, not a requirement external to the debate.
  *   **Static World Persistence:** Perdurantists tend to say yes (the worm exists across the dimension). Endurantists are split.

  **Incompatible Pair**
  *   **Intermittency + Spatiotemporal Continuity.**
      *   You cannot have a theory that requires a continuous path through spacetime (a common Perdurantist desire) *and* allows the dried-up lake to be the same lake. If the lake dries up, the spacetime worm is broken. If you allow the worm to be gappy, you weaken the "Time is like Space" analogy (since spatial objects can't have gaps in their existence). You must choose: either the lake dies when it dries, or continuity is not required for persistence.

  **The Theory-Killer**
  *   **The Fission Constraint.**
      *   This knocks out the most theories. Naive Endurantism fails because it cannot explain how one whole object becomes two whole objects without violating the transitivity of identity. Naive Perdurantism fails if it claims the pre-fission worm is identical to *both* post-fission worms. The only theories that survive Fission are those willing to say either (a) identity is not what matters (Parfit-style), (b) the original ceases to exist, or (c) there are actually two overlapping objects all along. This requirement forces the most radical revisions.

  **Empirical vs. Notational**
  *   **Is the dispute just notation?** Mostly, yes, *except* for the **Dimensional Commitment**.
      *   If Special Relativity is true, there is no privileged "now." This puts massive pressure on Endurantism, which relies on an object being "wholly present" at a specific time. If "now" is relative to the observer, "wholly present" becomes relative too.
      *   This is the one place where physics could settle a metaphysical dispute. If time is truly a dimension in the physical sense, Perdurantism is the natural ontological fit. If time is fundamentally distinct from space in physics (e.g., in some quantum gravity models), Endurantism gains ground.
      *   The rest (Fission, Counting, Change) is conceptual housekeeping. We decide those rules; we discover the physics rules.

  ***

  ### Brief Scorecard

  **Endurantism (3Dism)**
  *   **Passes:** Intermittency (easy to say the lake comes back), Sortal Relativity (fits our social practices), Static World (easy to say the rock just sits there).
  *   **Fails/Struggles:** Non-Contradiction (requires complex property theory), Time Travel (hard to explain co-location of wholes), Dimensional Commitment (clashes with Relativity).
  *   **Fission:** Usually fails unless it adopts "stage theory" lite or denies identity.

  **Perdurantism (4Dism)**
  *   **Passes:** Non-Contradiction (parts have different properties, no contradiction), Time Travel (easy, the worm loops), Dimensional Commitment (fits Relativity), Fission (can treat the worm as branching).
  *   **Fails/Struggles:** Intermittency (gappy worms are weird), Intrinsic Change (denies real change), Synchronic Counting (tends to multiply objects—chair, chair-stage, chair-sum).
  *   **Static World:** Passes easily (the worm just extends).

  **Summary:** If you prioritize logic and physics, Perdurantism has the edge. If you prioritize linguistic intuition and the phenomenology of "being here now," Endurantism has the edge. The Fission case is where both bleed the most.
