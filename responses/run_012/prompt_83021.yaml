      *   *Endurance Charge:* Perdurance makes change impossible (Cambridge change/variation across parts isn't *real* change).
      *   *Analysis:* Are they equal?
      *   Endurance needs to explain how $O$ at $t_1$ (Round) is identical to $O$ at $t_2$ (Square) without contradiction. Usually done via time-indexing properties ($O$ is round-at-$t_1$).
      *   Perdurance needs to explain how a worm having different parts counts as the *object* changing, rather than just a mosaic.
      *   *Verdict:* The Endurance problem is logical (contradiction). The Perdurance problem is conceptual (what does "change" mean?). They press different requirements. Endurance presses the "Non-Contradiction" requirement. Perdurance presses the "Intrinsic Change" requirement.

  5.  **Addressing the "Non-Negotiable vs. Camp" (Conflict Resolution 2):**
      *   *Non-Negotiable:* Logic (Non-Contradiction), Counting (must match intuition mostly), Physics compatibility.
      *   *Camp-Specific:* "Time is like space" (Perdurance likes this, Endurance doesn't need it), "Wholeness at every moment" (Endurance likes this).
      *   *Incompatible Pair:* Intermittent Existence + Strict Spatiotemporal Continuity. (If you need continuous path, the Lake dies. If you allow gaps, the Trail might be too loose).
      *   *Theory Killer:* Fission. It breaks transitivity of identity for almost everyone.
      *   *Empirical vs. Notational:* Mostly conceptual/notational, but physics (relativity) puts pressure on "Time as Dimension."

  6.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the frustration. Metaphysics often feels like trading intuitions. The list is the anchor.
      *   *The List:* Group by the user's specific cases to keep it relevant.
          *   *Case: Hiking Trail.* Requirement: **Material Plasticity.** Object survives total replacement of parts if structural/functional continuity holds.
