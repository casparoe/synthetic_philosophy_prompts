          2.  **Intermittent Existence:** (The Dried Lake). Can an object cease to exist and come back as the *same* object?
          3.  **Constitution/Role vs. Material:** (The Band). Identity based on social/functional role vs. specific atoms/people.
          4.  **Fission:** (The Amoeba). If $A$ becomes $B$ and $C$, is $A$ identical to $B$, $C$, both, or neither?
          5.  **Temporal Co-location:** (Time Travel). Can one object be in two places at one time?
          6.  **Persistence without Change:** (The Static World). If nothing changes, does time pass? Do objects persist?
          7.  **Counting:** (Sitting in the Chair). How many objects are here? (Avoiding explosion of temporal parts vs. avoiding coincidence).
          8.  **Change:** (Round then Square). How is property variation possible?

  3.  **Refining the Desiderata (Making them rigorous):**
      *   Instead of just listing cases, I need to abstract the *principle* behind the case.
      *   *Requirement 1: The Intermittency Constraint.* (Lake).
      *   *Requirement 2: The Fission Constraint.* (Amoeba).
      *   *Requirement 3: The Co-location Constraint.* (Time Travel).
      *   *Requirement 4: The Change Constraint.* (Round/Square).
