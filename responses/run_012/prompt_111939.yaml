answer: |-
  **Project Title:** Engineering Atrocity: A Functional Pluralism for the Naming of Mass Violence

  **Project Summary**
  The discourse surrounding mass atrocities, particularly genocide, is currently stalled in a familiar and unproductive impasse. On one side, legalists and defenders of the status quo argue that the existing definition must remain narrow to ensure administrability and prevent conceptual inflation. On the other, critical scholars and advocates argue that the definition is morally inadequate, excluding vital forms of destruction such as cultural erasure or violence against political groups. A third, skeptical position suggests the concept is so essentially contested that it is analytically useless. All three positions share a flawed assumption: that there is a single, correct definition of atrocity waiting to be discovered, and that the task of theory is to align our language with this metaphysical reality.

  This dissertation rejects that monistic assumption. It argues that "naming an atrocity" is not a single speech act but a cluster of distinct practices with incompatible success conditions. A concept optimized for legal jurisdiction (requiring bright lines and high evidentiary thresholds) cannot simultaneously serve the function of historical recognition (requiring nuance and context-sensitivity) or political mobilization (requiring vividness and moral clarity). The perennial disputes over the boundaries of genocide are not merely disagreements about facts or morals; they are category errors resulting from forcing one concept to perform multiple, conflicting jobs.

  This project employs the methods of conceptual engineering to map these distinct functions. Rather than asking "What is genocide?", it asks: "Which concept of atrocity should we deploy, given the specific practical purpose at hand?" By decomposing the naming practice into four distinct roles—jurisdictional, recognitional, explanatory, and mobilizational—this dissertation aims to provide a framework for distinguishing substantive moral disagreements from merely verbal disputes. The result will be a functional pluralism that preserves the precision required by law without sacrificing the moral depth required by history and politics.

  **The Research Question**
  The central question of this dissertation is precise and admits of a determinate answer: *Under what conditions does a dispute over the application of an atrocity label reflect a substantive disagreement about the world or moral obligations, rather than a verbal disagreement about the functional purpose of the label?*

  Answering this requires demonstrating that the "impasse" in atrocity studies is structural, not accidental. It requires showing that the criteria for success in a court of law (certainty, narrowness) are logically in tension with the criteria for success in a truth commission (comprehensiveness, narrative coherence) or a political campaign (urgency, inclusivity). If this tension is demonstrated, the solution is not to expand or contract the definition, but to differentiate the concepts used for different ends.

  **Critique of Standard Positions**
  Current scholarship generally falls into three camps, all of which leave the central problem unresolved. The first camp argues that the legal definition is too narrow and ought to be expanded to include political groups, gender groups, or acts of cultural destruction. While morally motivated, this approach often ignores the institutional constraints of criminal law, where over-expansion risks rendering the concept unenforceable. The second camp defends the narrow legal definition as a necessary compromise for state ratification, but fails to address the moral injury inflicted on victims whose suffering falls outside these bright lines. The third camp declares the concept "essentially contested," suggesting that disagreement is inherent to the term. While descriptively accurate, this verdict is theoretically sterile; it describes the symptom of the disease without offering a cure. It implies that we must simply learn to live with the confusion, rather than resolving it by clarifying the distinct work we expect the concept to do.

  This project moves beyond these positions by treating the concept not as a natural kind to be discovered, but as a tool to be engineered. The claim is not that the legal definition is "wrong," but that it is being asked to do work it was not designed for. Conversely, broader sociological definitions are not "wrong," but they are dangerous when imported into legal adjudication. The failure of current approaches lies in their attempt to find a "golden mean" definition that satisfies all masters. This dissertation argues no such mean exists.

  **Methodology**
  The argument proceeds in three methodological stages.

  First, I will develop a **Functional Decomposition** of atrocity naming. I identify four distinct roles:
  1.  *The Jurisdictional Job:* Triggering specific legal obligations, courts, and interventions. Success condition: Administrability and high certainty.
  2.  *The Recognitional Job:* Affirming to victims and history the nature of their suffering. Success condition: Contextual accuracy and moral resonance.
  3.  *The Explanatory Job:* Identifying distinctive social processes (e.g., the dismantling of group vitality). Success condition: Sociological fidelity.
  4.  *The Mobilizational Job:* Rallying publics and states to action. Success condition: Vividness and low barrier to entry.

  Second, I will establish a **Criterion for Dispute Resolution**. Drawing on literature regarding verbal versus substantive disputes, I will propose a test: If two parties agree on all non-moral facts and all moral obligations but disagree on the label, the dispute is verbal and should be resolved by functional differentiation. If they disagree on the facts or the obligations, the dispute is substantive. This allows us to isolate cases where the fight is truly about justice versus cases where the fight is merely about which tool to use.

  Third, I will apply this framework to four **Hard Cases** where the standard definitions fracture:
  1.  *Political Groups:* Mass killing aimed at a group constituted by political affiliation, currently excluded from the Genocide Convention.
  2.  *Cultural Destruction:* The deliberate eradication of language and institutions without mass killing.
  3.  *Structural Violence:* Death by blockade, displacement, or engineered deprivation where direct intent to destroy is contested.
  4.  *Contested Boundaries:* Violence against a group whose very boundaries are socially constructed or disputed by the perpetrators.

  For each case, I will demonstrate how a monistic definition forces a zero-sum choice (either it is genocide or it is not), whereas a functional pluralist approach allows for different verdicts depending on the context (e.g., "This is not genocide for the purpose of criminal prosecution, but it is genocide for the purpose of historical recognition").

  **Expected Outcomes and Success Conditions**
  A successful completion of this project will yield a manuscript that offers a stable framework for resolving naming disputes without collapsing into relativism. The finished result will look like a set of guidelines for policymakers, legal scholars, and philosophers: when to use the "thin" legal concept and when to use the "thick" moral concept, and how to translate between them without loss of meaning.

  The project would count as a failure under two conditions. First, if the functional decomposition proves arbitrary—that is, if the four roles cannot be clearly distinguished in practice. Second, if the framework fails to resolve the hard cases without generating new contradictions (e.g., if distinguishing the concepts leads to unacceptable moral hazards, such as excusing liability). To mitigate this risk, I will subject the framework to a "stress test" in Chapter 4, specifically looking for scenarios where functional pluralism might allow perpetrators to exploit the gaps between concepts.

  **Twelve-Month Work Plan**
  This fellowship will support the final year of writing and revision. The manuscript is currently outlined, with preliminary chapters drafted on the functional decomposition. The twelve-month plan is structured to ensure a complete, defensible dissertation by the end of the funding period.

  *Months 1–3: Theoretical Framework and Refinement*
  The first quarter will be dedicated to finalizing the philosophical architecture. I will refine the distinction between substantive and verbal disputes, ensuring the criteria are robust enough to handle legal and moral complexity. I will complete the draft of the methodology chapter, which serves as the engine for the rest of the dissertation.
  *Deliverable:* Complete draft of Part I (Theory and Methodology).

  *Months 4–6: Case Study Analysis*
  The second quarter will focus on the application of the framework to the four hard cases. This involves close analysis of historical and legal records to ensure the philosophical claims track the reality of international practice. I will write the four case study chapters, demonstrating how the functional pluralist approach dissolves the specific impasses in each instance.
  *Deliverable:* Complete draft of Part II (Case Studies).

  *Months 7–9: Synthesis and Objections*
  In the third quarter, I will draft the concluding chapters, which address potential objections. This includes the risk of fragmentation (does having multiple concepts confuse the public?) and the risk of exploitation (can bad actors use the distinctions to evade responsibility?). I will also integrate the introduction and conclusion to ensure the argument flows cohesively from theory to practice.
  *Deliverable:* Complete first full draft of the dissertation.

  *Months 10–12: Revision and Submission*
  The final quarter is reserved for revision, feedback incorporation, and formatting. I will circulate chapters to my committee and incorporate their critiques. The focus will be on tightening the prose, ensuring the argument is accessible to both philosophers and legal scholars, and preparing the final document for submission.
  *Deliverable:* Final Dissertation submitted to the university.

  **Significance**
  This project matters because the naming of atrocities is not merely an academic exercise; it determines who gets justice, who gets remembered, and when the world intervenes. By moving beyond the exhausted debate over definitions and toward a pragmatic engineering of concepts, this dissertation offers a way out of the paralysis that currently plagues international moral discourse. It provides a philosophical justification for using different concepts in different contexts, not as a compromise, but as a requirement of intellectual and moral honesty.
