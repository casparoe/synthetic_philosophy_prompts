prompt: |-
  I'm running a two-hour workshop on information cascades for a room of working journalists — smart, but no econ or stats beyond what they read in the paper. Don't explain cascades to me, plan how I should teach it. I want the arc: what has to be in place before the word "cascade" means anything to them (my guess is Bayesian updating on a private signal, but tell me what actually has to come first and what can wait), then the one example that carries the whole thing — and I want it to be one they haven't already seen, so not the urns and not the two-restaurant story. I'm thinking of a newsroom where each reporter independently gets a tip about a story and then watches what their colleagues decide to publish; tell me whether that works as the carrier, what it needs and what it has to lack, or give me a better one. Then the missconceptions I should expect and exactly where in the sequence to head each off — I'm guessing they'll hear "cascade" as irrational herd behaviour, they'll think it's the first mover who tips it, and they'll assume cascades usually turn out wrong. I'd also like the example built so the crowd ends up being *right*, since that seems to throw people. Finish with one question I can ask at the end that would tell me they've got the mechanism rather than just the vibe, and tell me what I should openly say I'm leaving out at this level.
reasoning: |-
  Here's a thinking process that leads to the suggested workshop plan:

  1.  **Analyze the Request:**
      *   **Audience:** Working journalists (smart, non-technical, familiar with news gathering but not econ/stats jargon).
      *   **Topic:** Information Cascades.
      *   **Duration:** Two hours.
      *   **Goal:** Plan the teaching arc, not explain the theory to me.
      *   **Key Requirements:**
          *   Define prerequisites (what concepts must land before "cascade" makes sense).
          *   Select *one* carrier example (not urns, not restaurants). Evaluate the user's "newsroom tip" idea or propose a better one.
          *   Ensure the example allows the crowd to be *right* (counter-intuitive).
          *   Identify misconceptions (irrationality, first mover importance, cascades = wrong) and where to address them.
          *   Provide a final assessment question (mechanism vs. vibe).
          *   Specify what to explicitly leave out (scope boundaries).

  2.  **Deconstruct the Theory (for the Planner):**
      *   What is an information cascade? It's when individuals ignore their private information to follow the actions of predecessors because the public information (actions) outweighs the private signal.
      *   Prerequisites: Private signals (noisy), public actions (observable), rational updating (Bayesian intuition, not math), sequential decision-making.
      *   Key Insight: It's rational to follow the herd, even if the herd is wrong (or right). It's about the *weight* of information, not stupidity.

  3.  **Evaluate the User's Example (Newsroom Tips):**
      *   *Idea:* Reporters get tips, watch colleagues publish.
      *   *Pros:* Highly relevant to audience.
      *   *Cons:* Newsrooms are collaborative. "Watching colleagues decide to publish" is slow. If Reporter A publishes, Reporter B might just piggyback (free riding) rather than cascade on truth. Also, editorial gatekeepers complicate the "sequential public action" model. It might feel too much like "pack journalism" (which implies laziness) rather than rational inference.
      *   *Verdict:* It's risky. It conflates *social pressure* with *informational inference*. Journalists know pack journalism is often criticized as lazy. We need to show it's *smart* to follow the pack sometimes.
      *   *Alternative:* Need something sequential, high-stakes, observable action, private signal.
      *   *Better Idea:* **Evacuation/Emergency Scenario.** Or **Tech Adoption.** Or **Source Verification.**
      *   *Refined Idea:* **The "Source Verification" Chain.** A group of editors deciding whether to run a sensitive story based on confidential sources.
      *   *Wait, let's look for something more visceral.* **The "Fire Alarm" / Evacuation** is classic but maybe too abstract.
      *   *How about a "Breaking News" Verification Chain?*
      *   *Let's stick closer to the user's intuition but fix the mechanics.* The problem with the newsroom idea is the "publish" action is final.
      *   *Better Carrier:* **The "Leak Verification" Chain.** Imagine a group of editors at different outlets (or a single newsroom chain of command). Each gets a confidential hint (signal) about whether a Politician is resigning. They have to tweet "Resigning" or "Stay."
      *   *Actually, let's go with something slightly removed from their daily grind to reduce bias.* **The "Safety Inspection" Scenario.** Engineers inspecting a bridge? No.
      *   *Let's try the "Investigative Tip" scenario but refined.*
      *   *Decision:* The user's newsroom idea is *good* but needs specific constraints to work as a cascade model rather than a "pack mentality" model. I will refine it to ensure it demonstrates *rational* behavior.
      *   *Wait, the prompt asks for an example where the crowd ends up RIGHT.* This is crucial. Usually, cascades are taught as fragile/wrong. Showing a "Correct Cascade" breaks the "herd = stupid" bias.
      *   *Revised Example:* **The "Whistleblower Corroboration" Chain.**
      *   *Let's pivot to something cleaner:* **The "Emergency Exit" choice.** (Too abstract).
      *   *Let's go with:* **The "Stock Trade" but for Journalists.** No.
      *   *Let's go with:* **The "Press Conference" Scenario.**
      *   *Okay, I'll stick with the User's Newsroom idea but harden the mechanics.* It resonates best. I need to make sure they aren't just copying for safety, but copying because the *information content* of the previous action is high.
      *   *Actually, a "Restaurant" variant is banned.*
      *   *How about:* **The "Evacuation" scenario but framed as "Source Reliability."**
      *   *Let's try:* **The "Breaking News Verification" Game.**
      *   *Scenario:* A rumor is circulating that a Mayor has been arrested.
      *   *Players:* 5 Editors in a chain.
      *   *Signal:* Each gets a private text from a source (Reliable or Unreliable).
      *   *Action:* Tweet "Confirmed" or "Fake."
      *   *Why this works:* It's high stakes. It's sequential. It involves private info vs. public action.
      *   *Why the crowd can be right:* If the first two get strong "True" signals, the rest follow, even if some get "False" signals. The cascade is correct.

  4.  **Drafting the Arc:**
      *   **Hour 1: Foundations & The Game.**
          *   Hook: Why do smart people follow the crowd?
          *   Concept 1: Private Signals (Noisy info).
          *   Concept 2: Public Actions (Observable decisions).
          *   Concept 3: Sequentiality (Order matters).
          *   The Carrier Example (The "Mayor Arrest" Verification).
      *   **Hour 2: Mechanics, Misconceptions, & Implications.**
          *   Walkthrough the math (intuitively).
          *   Address Misconceptions (Rationality, First Mover, Correctness).
          *   Implications for Journalism (Sourcing, Pack Journalism re-evaluated).
          *   Final Question.
          *   Scope Limitations.

  5.  **Refining the Prerequisites:**
      *   Before "Cascade," they need:
          1.  **Uncertainty:** The truth is unknown.
          2.  **Private Signals:** Everyone has *some* info, but it's imperfect.
          3.  **Sequential Observation:** I see what you did before I decide.
          4.  **Rationality:** Everyone is trying to be right, not trying to be contrarian or conformist. (This is the big one).

  6.  **Addressing Misconceptions:**
      *   *Herd = Irrational:* Address during the walkthrough. Show the calculation.
      *   *First Mover = King:* Address when discussing fragility. Early movers matter, but only because they have no public info.
      *   *Cascade = Wrong:* Address by designing the game to result in a Correct Cascade.

  7.  **The Final Question:**
      *   Needs to test mechanism. "What would break the cascade?" is the standard.
      *   Better: "If you are the 10th person, and you see 9 people tweet 'Confirmed', but your source says 'Fake', what do you do and why?" (Answer: Tweet Confirmed, because 9 public actions outweigh 1 private signal).
      *   Even better: "What specific piece of information would you need to see to *ignore* the 9 predecessors?" (Answer: A public action that reveals a strong private signal, or a change in the payoff structure).
      *   Let's go with: "What specific event would force you to break the cascade?" (Answer: A credible public disclosure of private info, or a 'shock' that resets priors).
      *   *Refinement:* "You are Person 5. Persons 1-4 said 'Run'. Your signal says 'Stay'. You decide to 'Stay'. What must have happened in the chain for this to be the rational choice?" (Answer: You need to know that one of the previous people *also* had a 'Stay' signal but was overruled, OR that the signals are more accurate than the public history implies. Actually, the standard answer is: You can't rationally break it unless you have *more* precision than the aggregate public history. So the question should be: "Under what condition is it rational for Person 5 to ignore the first 4?")
      *   *Best Question:* "If you are the 5th editor, and the first 4 have all published, under what specific condition is it rational for you to *kill* the story despite your colleagues?" (Answer: If your private signal is significantly more precise/reliable than the signals you infer they had).

  8.  **What to Leave Out:**
      *   The actual Bayes Rule formula.
      *   Network effects (distinct from info cascades).
      *   Reputational cascades (following to look good, not to be right).
      *   Continuous time (keep it discrete steps).

  9.  **Review against Constraints:**
      *   *Not urns/restaurants:* Check.
      *   *Crowd ends up right:* Check (design the signals that way).
      *   *Journalist audience:* Check (use verification context).
      *   *Misconceptions:* Check.
      *   *Final Question:* Check.

  10. **Final Polish:** Ensure the tone is respectful of their expertise (they know news, teach them the lens). Make sure the "Newsroom" example is tightened so it doesn't collapse into "peer pressure." The distinction is *informational* vs. *normative* influence. I must emphasize they are trying to get the *truth*, not fit in.

      *(Self-Correction on the Example)*: The user suggested "reporters watching colleagues decide to publish." The risk is that in a real newsroom, if Colleague A publishes, Colleague B doesn't need to decide to publish the *same* story; they've lost the scoop.
      *Fix:* Make it about **Verification of a Single Shared Fact**. E.g., A wire service alert. "Did the Senator resign?" Each outlet has to decide whether to append "Confirmed" to the wire. They see what the competitors did.
      *Actually, let's make it even cleaner.* **The "Safety Check" Protocol.** A group of producers deciding whether to cut to a live feed. If they cut and it's dead air, they look bad. If they don't and it's live, they lose viewers. Each gets a technical signal (green light/red light) but sees what the previous producer did.
      *No, stick to the Journalism context but abstract it slightly.* **The "Source Corroboration" Chain.**
      *Scenario:* A developing story (e.g., "The Bridge Collapsed").
      *Actors:* 5 News Desks (AP, Reuters, NYT, etc.).
      *Task:* Tag the story "Verified" or "Unverified."
      *Signal:* Each desk calls one independent contact. Contact says "Yes" or "No" (80% accurate).
      *Observation:* They see the tags of the previous desks on the wire.
      *Why it works:* It isolates the information value. It prevents "scoop" logic (everyone is reporting the same wire story).
      *Crowd Right:* If the Bridge *did* collapse, and the first two get "Yes" signals, the rest follow "Yes" even if they get "No" signals. The cascade is correct.

      *Wait, one more check on the "Crowd Right" requirement.*
      If the cascade is correct, journalists might think "See? Herds are good." I need to make sure they understand the *fragility* remains even if the outcome is right. The mechanism is the same regardless of truth. I will emphasize this.

      *Final Plan Structure:*
      1.  **Pre-work (Mental Setup):** Uncertainty, Private Signal, Public Action, Rationality.
      2.  **The Carrier:** The "Wire Service Verification" Game.
      3.  **The Walkthrough:** Step-by-step logic.
      4.  **Misconception Traps:** Where they will drift and how to pull back.
      5.  **The Test:** The "Break the Chain" question.
      6.  **The Disclaimer:** What we aren't covering.

      *Let's refine the "Newsroom" example critique.* The user asked: "tell me whether that works as the carrier, what it needs and what it needs to lack."
      *Critique:* It works *if* you remove the competitive incentive to be first. If being first matters, they won't wait. If being right matters more, they will wait. So the example needs to stipulate: "You are penalized equally for being wrong, regardless of order."
      *Better:* Use a **Single Newsroom Editorial Board**. Sequential editors signing off on a risky story.
      *Decision:* I will advise modifying their newsroom idea to be a **"Chain of Editors"** within one organization, deciding to greenlight a story. This removes competition and focuses on accuracy.

      *Wait, I need to make sure I don't explain cascades to the user.* I need to plan *how they teach it*.
      *Okay, ready to write.*
answer: |-
  Here is a teaching plan designed for a two-hour workshop with journalists. It focuses on intuition, mechanics, and correcting specific biases without relying on economic jargon.

  ### Part 1: The Prerequisites (First 30 Minutes)
  **Goal:** Build the vocabulary without using the word "cascade" yet.
  Before the mechanism makes sense, four specific concepts must land. If you skip one, the rest collapses into "mob mentality."

  1.  **Uncertainty:** The ground truth is unknowable in the moment. (If they know the truth, there is no decision to make).
  2.  **Private Signals:** Every individual has access to *some* information that others do not, but that information is **noisy** (imperfect).
      *   *Teaching check:* Ask them, "Have you ever had a source who was usually right but sometimes wrong?" That's a noisy private signal.
  3.  **Sequential Public Actions:** Decisions are made one after another, and later deciders can see the *actions* (not the thoughts) of earlier deciders.
  4.  **Rationality (The Big One):** Everyone is trying to maximize accuracy, not fit in.
      *   *Crucial distinction:* You must explicitly separate **Informational Influence** (I follow you because I think you know something I don't) from **Normative Influence** (I follow you because I don't want to look stupid). Cascades are purely the former.

  **What can wait:** The math of Bayesian updating. Do not write formulas. Use "weight" or "balance scale" metaphors instead.

  ---

  ### Part 2: The Carrier Example (45 Minutes)
  **Your Idea:** A newsroom where reporters watch colleagues decide to publish.
  **Verdict:** It *can* work, but it is dangerous.
  **The Risk:** Journalists know "pack journalism." They will immediately assume the motivation is career safety ("Nobody got fired for running AP copy") rather than informational inference. That is a *reputational* cascade, not an *informational* one.
  **The Fix:** You must strip away the competitive incentive to be first and the social incentive to conform.

  **The Revised Carrier: "The Wire Verification Chain"**
  *   **Scenario:** A breaking news alert comes across the wire: *"Major Earthquake hit Region X."*
  *   **The Players:** 5 Editors at 5 different outlets (AP, Reuters, NYT, Guardian, Local Affiliate). They are not competing for a scoop; they are competing for *accuracy*. Being first doesn't help; being wrong destroys credibility.
  *   **The Private Signal:** Each Editor gets one independent phone call to a contact on the ground. The contact says "Yes, Quake" or "No, Quake." The contact is accurate 70% of the time.
  *   **The Public Action:** Each Editor must tag the wire story **"Verified"** or **"Hold."** They do this sequentially (AP, then Reuters, then NYT, etc.). Everyone sees the previous tags before deciding.
  *   **The Truth:** There *was* an earthquake. (This satisfies your requirement that the crowd ends up *right*).

  **Why this works:**
  1.  **High Stakes:** Accuracy matters more than speed.
  2.  **Observable Action:** The tag is public.
  3.  **Noisy Signal:** 70% accuracy means 3 out of 10 times, their own source lies to them.
  4.  **The Cascade Moment:**
      *   Editor 1 gets "Yes." Tags **Verified**.
      *   Editor 2 gets "No." Thinks: "My source says No, but AP said Yes. AP's source was likely right. The weight of their action outweighs my noisy signal." Tags **Verified**.
      *   Editor 3 gets "No." Sees two "Verified" tags. The public history now outweighs their private signal. Tags **Verified**.
      *   *Result:* Editors 3, 4, and 5 ignore their own sources. They are in a cascade. The story is Verified. The crowd is *right* (there was a quake), but Editors 3, 4, and 5 made their decision *without using their private information.*

  ---

  ### Part 3: Misconceptions & Intervention Points (30 Minutes)
  Here is where the audience will drift, and exactly when to correct them.

  **Misconception 1: "This is just herd behavior/stupidity."**
  *   **When it happens:** Immediately after you describe Editor 2 ignoring their own source.
  *   **The Intervention:** Stop and ask: "Is Editor 2 being lazy?"
  *   **The Correction:** No. Editor 2 is doing the *smartest possible thing*. They are aggregating data. AP's action *contains* AP's private signal. Editor 2 has two signals (inferred from AP + their own). If AP's signal is weighted equally, 1 vs 1 is a tie. If AP is slightly more credible, AP wins. It is rational to ignore your own eyes if the public evidence is heavier.
  *   **Key Phrase:** "A cascade is not a failure of intelligence; it is a rational response to information scarcity."

  **Misconception 2: "The First Mover controls the outcome."**
  *   **When it happens:** When discussing Editor 1.
  *   **The Intervention:** Ask: "If Editor 1 had gotten a 'No' signal, would we be in this mess?"
  *   **The Correction:** Early movers matter more because they have *less* public information to weigh against their private signal. But they aren't kings. If Editor 1 says "Hold" and Editor 2 says "Verified," the chain is broken. The cascade is fragile. It only takes two contradictory public actions to reset the room.

  **Misconception 3: "Cascades usually lead to wrong outcomes."**
  *   **When it happens:** At the end of the example.
  *   **The Intervention:** Remind them: "In our example, there *was* an earthquake. The cascade was correct."
  *   **The Correction:** Cascades are agnostic to truth. They lock in whatever the early random signals suggest. If the first two editors got the 30% error rate signal ("No Quake"), the whole industry would confidently report "No Quake" while the ground shook. The danger isn't that cascades are wrong; it's that they **stop collecting data.**

  ---

  ### Part 4: The Assessment Question (15 Minutes)
  Do not ask them to define a cascade. Ask them how to break one. This tests if they understand the *mechanism* (private vs. public weight) rather than the *vibe* (crowds are sticky).

  **The Question:**
  > "You are Editor 5. Editors 1 through 4 have all tagged the story 'Verified.' Your private source calls and says 'No Quake.' By the rules of the cascade, you should tag 'Verified.'
  >
  > **What specific piece of new information would you need to see, that would make it rational for you to ignore the first four editors and tag 'Hold'?**"

  **The Answer You Want:**
  They need to identify that the *weight* of the private signal must exceed the *weight* of the public history.
  *   *Acceptable:* "I need a source that is more accurate than the combined probability of the first four editors."
  *   *Better:* "I need to see one of the previous editors publicly admit they were guessing," or "I need a second independent confirmation of the 'No' signal."
  *   *Best:* "I need to know that the previous editors were *also* in a cascade." (If I know Editor 3 just copied Editor 2, then Editor 3's action adds zero new information. I can discount it).

  **Why this works:** It forces them to realize that cascades persist because later actions are treated as *new* information, when they are actually just echoes. To break it, you must devalue the public history.

  ---

  ### Part 5: What to Explicitly Leave Out (Final 15 Minutes)
  To keep the model clean, you must tell them what you are *not* explaining. This protects you from "Well, but what about..." questions and clarifies the scope.

  **Say this:**
  > "We are modeling **Informational Cascades**. We are explicitly leaving out three things that also happen in newsrooms:
  >
  > 1.  **Reputational Cascades:** Where you follow the herd not because you think they're right, but because you don't want to be the only one wrong. That's career safety, not information.
  > 2.  **Network Effects:** Where a story becomes true *because* everyone reported it (self-fulfilling prophecy). In our model, the earthquake happened regardless of what we reported.
  > 3.  **Communication:** In this model, you can only see *actions* (the tag), not *reasons*. As soon as you start talking and sharing your private sources ('My guy said X'), the cascade breaks. Real newsrooms talk. That's why your editorial meetings are actually anti-cascade tools."

  ### Summary of the Arc
  1.  **Setup:** Uncertainty + Noisy Private Signals + Rationality.
  2.  **Example:** The Wire Verification Chain (Crowd is Right).
  3.  **Correction:** It's rational, not lazy. It's fragile, not fixed. It can be wrong, but isn't always.
  4.  **Test:** How do you break the chain? (Devalue the public history).
  5.  **Boundary:** This is about information, not reputation or communication.
