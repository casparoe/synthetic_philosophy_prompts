      *   *The "Would Cooperate" Problem:* Determining if an arbitrary program halts and outputs "Cooperate" is undecidable (Halting Problem). You can't just compute `would_cooperate(other, me)`.
      *   *The Proof Trick:* Proofs allow you to reason about the *output* without actually *running* the code. It's like solving an algebra equation ($x = x + 1$ has no solution) vs. trying to calculate it numerically forever.
      *   *Löb's Theorem:* This is the heavy hitter underneath. The bot says "I cooperate if I can prove we both cooperate." The other bot says the same. Löb's theorem allows this self-referential loop to close logically without infinite regression.
      *   *Fragility:* If the logic isn't set up *exactly* right (e.g., "I cooperate if I prove you cooperate"), it breaks. It needs to be "I cooperate if I prove *we* cooperate."

  3.  **Analyze Question 2: Bounded Search and Hashes.**
      *   *Bounded Proof Search:* This is the practical killer. The standard Program Equilibrium (FairBot/PrudentBot) relies on finding a proof in Peano Arithmetic (or similar). Proofs can be astronomically long. If you cap it at 1 million steps, two identical bots might fail to find the proof of mutual cooperation because the proof is too long.
      *   *Collapse:* Yes, it tends to collapse to defection if the bound is too tight relative to the complexity of the reasoning.
