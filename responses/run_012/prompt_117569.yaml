      *   *New Case:* Bubble, *did* read, thinks they are bad faith.
      *   *Synthesis:* The consistent thread for GF is **attributing non-malicious error to opponents.** The consistent thread for NGF is **attributing malicious intent (propaganda/bad faith) OR being insincere.**
      *   *Colleague:* "Second-order" is relevant because believing the other side is *inherently* bad faith is a failure to assess the information environment correctly. But the primary driver is the reciprocity of charity.

  12. **Final Polish:** Ensure the "Settling Case" is sharp. It needs to force a choice between "Did they do the work?" and "Do they respect the opponent's humanity?"

      *   *Settling Case:* The "Reluctant Converter." Someone who switches sides based on evidence but explicitly states, "I now agree with them, but I still think their movement is built on lies."
      *   *Actually, let's make it cleaner:* Someone who engages perfectly but views the opposition's *success* as evidence of manipulation rather than merit.
