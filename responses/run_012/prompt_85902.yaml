          2.  Evidence standards (cross-cultural similarity as confirmation vs. restatement).
          3.  Level of analysis (ultimate/functional explanation vs. proximate/developmental explanation).
      *   **Goal:** A diagnosis of the disagreement (not a verdict on who is right), distinguishing settled vs. contested views, and identifying what would count as progress.
      *   **Constraint:** Do not sell a contested view as consensus. Be precise.

  2.  **Evaluate the User's Hypothesis:**
