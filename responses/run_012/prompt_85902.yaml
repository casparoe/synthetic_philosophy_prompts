          *   *Fight 2: Evidence (The Data Integrity).* Explain the "Universality" issue. Is it a feature or a bug (cultural artifact)? Mention the WEIRD problem.
          *   *Fight 3: Levels of Analysis (The Abstraction Layer).* This is Tinbergen's Four Questions. Crucial distinction. Ultimate (function) vs. Proximate (mechanism). Explain how critics attack the "Why" as if it were the "How".

