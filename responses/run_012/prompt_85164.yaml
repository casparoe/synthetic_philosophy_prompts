  **Outline of Argument**

  I will argue that causation by omission fails not because absences lack power, but because they lack determinate identity. My thesis is that an omission is not a fixed item in the world like an event, but is individuated only relative to normative expectations; thus, omission-causation is interest-relative in a way event-causation is not. I anticipate three serious objections. First, that ordinary events are also hard to individuate (e.g., was the cause the shooting or the finger movement?), which I will answer by showing events have spatiotemporal bounds that omissions lack. Second, that all causal claims are contrastive and interest-relative anyway, which I will answer by distinguishing between selecting among existing events versus constituting a cause from nothing but a norm. Third, that omissions are not real things and therefore cannot be causes, which I will answer by conceding they are not positive entities but insisting they function as causes within a normative framework. The essay will defend the view that while event causation tracks physical dependencies, omission causation tracks normative violations.

  ***

  **The Architecture of Nothing: Individuation and the Cause of Death**

  On a hot afternoon, a child drowns in a public pool while a woman sits still at the edge. She is a strong swimmer; she has a phone. She does nothing. Yet this "nothing" is not a single fact. She did not shout, which would have saved the child. She did not call emergency services, which would have been too late. She did not jump in, which would have been futile. The physical reality is identical in all three descriptions: a woman sitting still. However, only one of these descriptions picks out a cause of the death. If we say her omission caused the death, we must specify *which* omission. This case reveals that the central problem of causation by omission is not whether an absence can make a difference, but how we distinguish one absence from another. I argue that omissions lack intrinsic individuation—meaning there is no fact in the world that makes one omission a distinct thing from another—and therefore claims of omission-causation are true only relative to descriptions supplied by our norms and interests. This makes causation by omission a fundamentally different kind of causal claim from ordinary event causation.

  To understand this, we must define **individuation**. Individuation is what makes a thing one specific thing rather than another. For ordinary events, individuation is grounded in physical reality. If a brick breaks a window, the event of the brick striking the glass is bounded by space and time. It involves energy transfer and matter in motion. There may be vagueness at the edges—did the cause include the thrower's muscle contraction?—but there is a positive fact in the world anchoring the event. Omissions lack this anchor. In the pool case, the woman's physical state is simply "sitting." There is no positive event of "not shouting" distinct from the event of "not jumping." Both are described by the same physical stillness. What makes "not shouting" a distinct omission from "not jumping" is not a difference in the world, but a difference in what we expected her to do. Therefore, the woman performed one physical non-action (sitting), but she performed many omissions relative to different expectations. An omission is individuated not by what happened, but by what was expected to happen and did not.

  This leads to the conclusion that the claim "her omission caused the death" is **interest-relative**. A causal claim is interest-relative when its truth depends on the goals or perspectives of the people making the claim, rather than solely on the physical structure of the world. For ordinary event causation, interest-relativity is superficial. We might choose to describe the cause of a fire as "the spark" rather than "the presence of oxygen" based on our interest in preventing arson rather than managing atmosphere. However, both the spark and the oxygen are positive events that exist independently of our interests. For omission causation, the interest-relativity is constitutive. Without the norm that she ought to have shouted, there is no omission of shouting, only the fact of sitting. The cause does not exist as a causal relatum (a thing entering into a relation) until a norm selects it from the infinite background of things she did not do. She did not fly to the moon, either, but that is not an omission because there was no norm expecting it. Thus, the cause is supplied by our norms rather than found in the causal facts.

  One might object that this problem infects ordinary event causation as well. It is not obvious how many events occurred in the pool that afternoon. Was the cause the woman's stillness, or the neural state preceding it, or the molecular motion of her skin? If events are also vague, then omissions are not special. This objection fails because it conflates vagueness with absence. While the boundaries of an event may be fuzzy, the event itself is positive. There is *something* there to be vague about. For omissions, there is nothing there. The problem is worse for omissions because the space of possible omissions is infinite. At any moment, an agent omits to do infinitely many things (omit to sing, omit to dance, omit to blink). Without a normative framework to prune this infinity, no specific omission can be identified as the cause. Event individuation struggles to draw lines around existing things; omission individuation struggles to conjure a thing out of nothing. The latter requires a principle of selection that physics does not provide, but norms do.

  A stronger objection contends that all causal talk is already relative to a contrast or a set of interests, so the omission case is not special. This view, often called contrastivism, holds that even for events, we never say "A caused B" without implying "A rather than A* caused B rather than B*." If all causation is contrastive, then omission causation is just another instance of a general rule, not a distinct category. While it is true that causal explanations often highlight specific factors based on interest, there is a metaphysical difference in the *relata*. In event causation, the contrast selects between existing possibilities (spark vs. no spark). In omission causation, the contrast creates the cause itself. When we say "not shouting caused the death," we are not selecting between two positive events present in the scene; we are comparing the scene to a counterfactual scene where shouting occurred. The cause is essentially a comparison class, not an entity. Therefore, omission causation is interest-relative in a deeper sense: for events, interests guide our description of the cause; for omissions, interests constitute the cause. To retreat to the claim that omissions are causes "just like events" is to ignore that events are found in the world, while omissions are imposed upon it.

  In conclusion, the tragedy at the pool demonstrates that causation by omission cannot be reduced to the physics of event causation. The woman's stillness was a single fact, but it supported multiple potential omissions, only one of which was causal. This individuation problem shows that omissions are not determinate items in the world. They are defined by the gap between what happened and what was expected to happen. Consequently, while ordinary causation tracks dependencies between existences, omission causation tracks dependencies between existence and norm. We must accept that causation by omission is a distinct logical category, true only relative to the descriptions supplied by our interests. To say she caused the death by doing nothing is not to describe a physical mechanism, but to judge that her stillness violated a specific expectation that mattered.
