prompt: |-
  I'm trying to build a version of karma that's really a theory of moral desert — you suffer because you deserve to, and thats what makes the suffering fair. The twist I want to add is that the karmic fruit of a bad act is mostly internal: you don't come back as a worm, you just become the kind of person who'd do that, and the becoming is the punishment. Give me an example of a case where this internalizing move makes the desert claim collapse — where someone ends up with exactly what the karma story says they deserve, but it stops looking like justice at all, and just looks like a fact about them.
reasoning: |-
