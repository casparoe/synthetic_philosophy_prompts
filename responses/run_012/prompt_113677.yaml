answer: |-
  # Activity Design: The Counterfactual Mint

  **Session Length:** 90 Minutes
  **Participants:** 20 (Mixed backgrounds)
  **Materials:**
  *   20 "Wallets" (envelopes containing 5 poker chips or wrapped candies each).
  *   1 Large Coin (or digital randomizer projected on screen).
  *   Policy Cards (index cards, 2 per person).
  *   Whiteboard/Flipchart.
  *   A "House Bank" (bowl of extra chips/candies).

  **Core Payoff Structure (Transparent to all):**
  *   **Cost:** 2 Chips (given to House).
  *   **Reward:** 10 Chips (given from House).
  *   **Baseline:** Keep your starting 5 Chips.

  ---

  ## Timeline & Mechanics

  ### 0:00 – 0:10 | Introduction & Endowment
  *   **Action:** Distribute Wallets (5 chips each).
  *   **Script:** "Welcome to the Mint. We are running three decision games. At the end, you keep whatever chips you have. You may trade chips for candy at the break. The rules of every game are printed on the table. I will not lie to you about how payoffs are calculated. However, I will not reveal the outcome of random events until the rules require it."
  *   **Goal:** Establish trust and stakes.

  ### 0:10 – 0:30 | Round 1: The Mugging (Intuition)
  *   **Setup:** Flip the large coin visibly. Cover it with your hand.
  *   **Script:** "I have flipped a fair coin. If it is **Heads**, you would have received 10 chips automatically. If it is **Tails**, you are in this room, and I am asking you for 2 chips. Here is the rule: The 10 chips for the Heads branch are *only* distributed if the participants in the Tails branch **would have paid** the 2 chips."
  *   **Reveal:** "I looked at the coin. It is **Tails**. You are in the paying branch. The Heads branch did not happen. However, the rule stands: If you pay 2 chips now, I will credit the 'Heads Policy' as satisfied. If you refuse, the 'Heads Policy' fails."
  *   **Action:** Participants choose privately (write 'Pay' or 'Refuse' on a slip). Collect slips.
  *   **Payoff:** Everyone pays the 2 chips if they chose Pay. No one gets the 10 chips (because they are in Tails).
  *   **Observation:** Most will Refuse. They saved 2 chips. They "won" the local interaction.
  *   **Facilitator Note:** Do not judge. Simply record the split on the board (e.g., 15 Refuse, 5 Pay).

  ### 0:30 – 1:00 | Round 2: The Contract (Policy)
  *   **Setup:** Clear the table. Return chips to restore endowments (or adjust mathematically).
  *   **Script:** "We reset. This time, you must decide *before* the coin is flipped. You are writing a policy for your 'agent'. The coin will be flipped. If Heads, you get 10 chips *if your policy says Pay on Tails*. If Tails, you lose 2 chips *if your policy says Pay on Tails*."
  *   **Action:** Participants write on a Policy Card: *"If Tails, I [Pay/Refuse]."*
  *   **Execution:** Collect cards. Flip the coin visibly (e.g., Heads).
  *   **Payoff:** Calculate based on the cards.
      *   If Heads: Those who wrote "Pay" get 10 chips.
      *   If Tails: Those who wrote "Pay" lose 2 chips.
  *   **Observation:** This is the crux. Those who wrote "Pay" likely feel vindicated if Heads comes up. Those who wrote "Refuse" feel smart if Tails comes up.
  *   **Facilitator Note:** Highlight the tension. "In Round 1, you knew you were in Tails. Here, you didn't. Did the policy change your outcome?"

  ### 1:00 – 1:20 | Round 3: The Blind XOR (Outcome Noise)
  *   **Setup:** Reset chips.
  *   **Script:** "Final round. I will flip the coin and cover it immediately. You will choose Pay (1) or Refuse (0). Your payoff depends on the **XOR** of your Choice and the Coin."
  *   **Rule:** "You receive 10 Chips if **(Choice XOR Coin) is True**. Otherwise, 0."
      *   *Translation:* If Coin=Heads (1), you need Refuse (0) to win. If Coin=Tails (0), you need Pay (1) to win.
  *   **Action:** Flip coin (cover it). Participants choose. Collect choices.
  *   **Payoff:** Calculate payoffs based on the hidden coin. Distribute chips.
  *   **The Twist:** **Do not reveal the Coin.**
  *   **Discussion Prompt:** "Look at your chips. Did the 'Pay' strategy or the 'Refuse' strategy win? You cannot know. The outcome is identical for a 'Pay' choice in Tails and a 'Refuse' choice in Heads."
  *   **Goal:** Force the group to evaluate the *policy* (50% chance of winning either way) rather than the *result* (which looks random).

  ### 1:20 – 1:30 | Debrief & Theory Mapping
  *   (See Debrief Guide below).

  ---

  ## Debrief Guide: Mapping Experience to Theory

  Do not start with definitions. Start with their feelings during the rounds.

  **1. The Pull of Refusal (Round 1)**
  *   **Ask:** "In Round 1, who refused? Why?"
  *   **Likely Answer:** "The Heads world didn't happen. Paying costs me real chips for nothing."
  *   **Map:** This is **Causal Decision Theory (CDT)**. You condition on what you know (I am in Tails). In this branch, Paying has a cost of 2 and a benefit of 0. Refusing dominates.
  *   **The Counter-Pull:** "Who paid? Why?"
  *   **Likely Answer:** "It felt like the right thing to do for the group," or "I wanted to see if the rule was real."
  *   **Map:** This is the intuition behind **Updateless Decision Theory (UDT)**. You act as if you control the output of the decision function *across* branches, not just the action in the current branch.

  **2. The Policy Shift (Round 2)**
  *   **Ask:** "Did anyone write 'Pay' in Round 2 but would have 'Refused' in Round 1?"
  *   **Map:** This is the **Ex-Ante vs. Ex-Post** distinction.
      *   *Ex-Post (Round 1):* "I am here. Heads is gone."
      *   *Ex-Ante (Round 2):* "I am behind a veil of ignorance. A policy of 'Pay' yields: (0.5 * -2) + (0.5 * 10) = +4 Expected Value. A policy of 'Refuse' yields 0."
  *   **Key Insight:** "Paying" in CFM is not a prediction that Heads *will* happen. It is a subscription fee for a policy that *makes* Heads profitable. You are not buying a lottery ticket; you are buying the *right to hold a winning ticket*.

  **3. The XOR Blindness (Round 3)**
  *   **Ask:** "In Round 3, who won? Can we say the winners made better decisions?"
  *   **Map:** This attacks **Outcome Bias**.
      *   Because the Coin was hidden, the Result (Win/Loss) is uncorrelated with Decision Quality.
      *   A "Refuse" player might win (if Heads) but have followed a losing policy (Expected Value 0).
      *   A "Pay" player might lose (if Heads) but have followed a winning policy (Expected Value +4 in the CFM structure, though here it's 0-sum EV, the point is *evaluability*).
  *   **Key Insight:** "You cannot grade a decision theory by a single outcome, especially when counterfactuals are involved. You must grade the *algorithm*."

  **4. Addressing the Objections (Predictable Failures)**

  *   **Objection A: "This is Physically Impossible."**
      *   *The Participant:* "The Heads world doesn't exist! You can't change the past. This setup is magic."
      *   *Your Response:* "You are absolutely right. In our physical universe, causality flows forward. Counterfactual Mugging is not a physics problem; it is a **logic** problem. In Round 2, I didn't change the past. I enforced a rule that linked your *policy statement* to the payout. The 'Mugging' asks: If you were a computer program, and Omega could read your source code, would you write `if(Tails) pay()`? The tension isn't about magic; it's about whether your decision *now* is logically correlated with outcomes *elsewhere*."
      *   *Handling:* Validate them. "If you treat this as a causal physical event, Refuse is 100% correct. The activity only works if you treat it as a logical constraint on your identity as a decision-maker."

  *   **Objection B: "It's Just Risk."**
      *   *The Participant:* "This is just a 50/50 bet. Why call it decision theory?"
      *   *Your Response:* "In a normal bet, your choice affects the outcome causally (I bet on Heads -> Coin flips Heads -> I win). In CFM, your choice in Tails *cannot* causally affect the Heads coin flip. It only affects the Heads *payout* via the logical rule. The 'Risk' is not about the coin; it's about whether you trust the logical link more than the causal evidence of your eyes."
      *   *Handling:* Use Round 1. "In Round 1, there was no risk. You knew it was Tails. Yet the rule still hung over you. That's not risk; that's a logical tax."

  **5. The Limitation (What You Must Supply)**
  *   **Be Frank:** "This activity simulates CFM using **Contract**, not **Prediction**. In Round 2, I (the House) enforced the link between your policy and the reward. In the real philosophical problem, there is no House. There is only **Omega**, a perfect predictor."
  *   **The Gap:** "In this room, you paid because I said the rules were binding. In the thought experiment, you must pay because *you* recognize that a version of you in another branch is counting on your logical consistency. I can give you the incentives, but I cannot give you the **ontological weight** of the counterfactual. You have to imagine that the 'Heads' world is just as real as this one, logically speaking. That leap is yours to make."

  ---

  ## Troubleshooting & Facilitation Notes

  **1. The "Free Rider" Problem**
  *   *Risk:* In Round 2, participants might collude or think "If others pay, I can refuse and the policy still holds."
  *   *Fix:* Make payoffs individual. "Your reward depends on *your* policy, not the group's."

  **2. Confusion in Round 3 (XOR)**
  *   *Risk:* Participants won't understand XOR.
  *   *Fix:* Use a lookup table on the whiteboard.
      *   Coin H + Choice Pay = 0
      *   Coin H + Choice Refuse = 10
      *   Coin T + Choice Pay = 10
      *   Coin T + Choice Refuse = 0
  *   *Emphasis:* Remind them repeatedly: "I am not showing you the Coin. You cannot reverse-engineer the right move from the money."

  **3. Emotional Deflation**
  *   *Risk:* If Round 2 lands on Tails, the "Payers" lose chips and feel foolish.
  *   *Fix:* Pre-empt this. "If Tails comes up, the Payers will lose chips. That is *supposed* to happen. That is the cost of the policy. Do not regret it until you see if the policy was optimal *ex-ante*."

  **4. Time Management**
  *   *Risk:* Round 1 drags as people debate the rules.
  *   *Fix:* Enforce silence during decision phases. "Write your choice. No discussion until the Debrief."

  ---

  ## Why This Works
  This design forces the **Updateless** intuition to compete with the **Evidential** intuition in real-time.
  1.  **Round 1** triggers the "I'm here, so pay nothing" reflex (CDT).
  2.  **Round 2** triggers the "I want the winning policy" reflex (UDT).
  3.  **Round 3** breaks the reliance on outcomes, forcing them to articulate *why* a policy is good without the crutch of seeing the reward.

  By withholding the vocabulary until the end, you allow them to generate the conflict themselves. When you finally say "Counterfactual Mugging," they aren't learning a definition; they are labeling a feeling they just had.
