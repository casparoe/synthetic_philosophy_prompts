  # The "How Old Is Your Nation?" Quiz

  ### Instructions
  Answer each question based on your gut reaction to the scenario. Don't overthink it. There are no right answers, only consistent ones. At the end, tally your letters using the Scoring Key.

  ---

  ### Question 1: The Stateless Community
  A group of people has lived scattered across different empires for 500 years. They have no land of their own, no government, and speak the languages of wherever they live. Yet, they marry within the group, follow the same laws, and say they are one people.
  *   **A)** They are a nation because the bond is spiritual or biological; land doesn't define them.
  *   **B)** They are a cultural or religious community, but calling them a "nation" without a state is mixing up categories.
  *   **C)** They are a nation-in-waiting; the core identity is old, but it needs a state to become political.

  > **Designer's Note:** Distinguishes **Hard Perennialist** (A) vs. **Deflationary** (B) vs. **Ethnosymbolist** (C).

  ### Question 2: The Poet and the Peasant
  In the 1800s, city-dwelling writers publish a book of "ancient folk songs" in a language the actual peasants barely speak. The writers claim this is the true voice of the people.
  *   **A)** It's a forgery. If the people didn't sing it, it's not their tradition.
  *   **B)** It's a tool. The writers are giving the peasants a unified voice they need for modern politics.
  *   **C)** It's a translation. The writers are articulating a spirit the peasants felt but couldn't write down.

  > **Designer's Note:** Distinguishes **Top-down Modernist** (A) vs. **Bottom-up Modernist** (B) vs. **Ethnosymbolist** (C).

  ### Question 3: The New School Curriculum
  A brand-new country decides that within one generation, every child must learn the same standard language and history in public schools.
  *   **A)** This proves the state is building the nation from scratch to make governance easier.
  *   **B)** This proves the state is just enabling a nation that already existed to finally speak to itself.
  *   **C)** This is just administrative standardization; calling it "nation-building" gives it too much weight.

  > **Designer's Note:** Distinguishes **Top-down Modernist** (A) vs. **Bottom-up Modernist** (B) vs. **Deflationary** (C).

  ### Question 4: The Historian vs. The Believer
  Locals swear a specific holiday ritual is 1,000 years old. A historian proves it was actually assembled 100 years ago. The locals refuse to stop celebrating it.
  *   **A)** The locals are mistaken about the history, but the ritual's function is what makes it real now.
  *   **B)** The locals are lying or deceived, and the tradition is fake.
  *   **C)** The historian is missing the point; the oral roots are old even if the written record is new.

  > **Designer's Note:** Distinguishes **Bricolage** (A) vs. **Top-down Modernist** (B) vs. **Ethnosymbolist** (C).

  ### Question 5: The Assembled Tradition
  A national ceremony is created using bits of old local customs that never existed together before. No single village ever did all of it at once.
  *   **A)** It's a new tradition because the combination is new; the parts don't matter.
  *   **B)** It's a repair job. They used old scraps to fix a hole in modern social life.
  *   **C)** It's an old tradition because the ingredients are old; the recipe doesn't change the substance.

  > **Designer's Note:** Distinguishes **Top-down Modernist** (A) vs. **Bricolage** (B) vs. **Hard Perennialist** (C).

  ### Question 6: The Role of Media
  Novels and newspapers become cheap and widespread. Suddenly, strangers feel connected to people they will never meet.
  *   **A)** This technology created the capacity to imagine the nation; it wasn't possible before.
  *   **B)** Elites used this technology to broadcast decrees and unify people from the top.
  *   **C)** People always wanted to connect; this just reflects a natural human tendency.

  > **Designer's Note:** Distinguishes **Bottom-up Modernist** (A) vs. **Top-down Modernist** (B) vs. **Hard Perennialist** (C).

  ### Question 7: The Founder's Secret
  A founding father knows a "ancient" symbol he promotes was actually designed last week, but he says it's centuries old to unify the crowd.
  *   **A)** It's a lie if he knows it's false, regardless of the outcome.
  *   **B)** It's a myth, not a lie. Myths aren't judged on factual accuracy but on social cohesion.
  *   **C)** Asking if it's a "lie" assumes nations are supposed to be factually true, which is a category error.

  > **Designer's Note:** Distinguishes **Top-down Modernist** (A) vs. **Bricolage** (B) vs. **Deflationary** (C).

  ### Question 8: The 300-Year Gap
  Records show a group had no political organization for 300 years, then revived a movement using the old name.
  *   **A)** The break in transmission means the old nation died; this is a new one.
  *   **B)** The nation was asleep; the revival proves continuity exists even without politics.
  *   **C)** The nation is eternal; the records are just missing, not the people.

  > **Designer's Note:** Distinguishes **Top-down Modernist** (A) vs. **Ethnosymbolist** (B) vs. **Hard Perennialist** (C).

  ### Question 9: Borders vs. People
  One ethnic group lives across three different states. One state contains five different ethnic groups.
  *   **A)** The state defines the nation. If you live in the box, you're part of the nation.
  *   **B)** The nation defines the state. The borders are wrong because they don't match the people.
  *   **C)** "Nation" and "State" are two different lists that don't always overlap; expecting them to match is the error.

  > **Designer's Note:** Distinguishes **Top-down Modernist** (A) vs. **Ethnosymbolist** (B) vs. **Deflationary** (C).

