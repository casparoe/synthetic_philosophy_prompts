answer: |-
  Dear Friend,

  It is a profound thing to ask how to live a life when the outcomes of your choices compound over time, and it is no surprise that the standard intuitions we carry about risk and reward begin to fracture under that weight. You have encountered a concept that sits at the intersection of probability, economics, and physics, often dressed in the language of finance but applicable to any endeavor where you play the game more than once. The confusion you feel is not a deficit in your understanding but a sign that you have correctly identified a crack in the conventional wisdom. Most of us are taught to think in terms of arithmetic averages, the kind you use to calculate your grade in school or the average rainfall in a month. But a career, like a gambling bankroll or a population of bacteria, is not a collection of independent events added together; it is a sequence of multiplications. When you multiply, the arithmetic mean lies to you. To see why, we must first distinguish between the world as it might appear to a god observing infinite parallel universes and the world as it is experienced by a human living through a single timeline.

  Imagine you are offered a bet on the flip of a fair coin. If it lands heads, your wealth increases by sixty percent. If it lands tails, your wealth decreases by forty percent. You can play this game as many times as you like. A standard calculation of expected value, the kind used in introductory economics, looks at the average outcome across all possibilities. Half the time you gain sixty, half the time you lose forty, for a net average gain of ten percent per flip. If your goal is to maximize the expected value of your wealth after one flip, the logic is seductive and simple: you should bet everything you have. The math says that on average, you will be richer. But you do not live on average. You live in a single sequence of events. If you bet everything on the first flip and it lands tails, you have lost forty percent of your capital. You bet the remainder on the second flip. If it lands tails again, you have lost more. Crucially, if you ever hit a state of zero, the game ends for you. You cannot compound from zero. In a sequence of bets, the outcome is determined by the product of your returns, not the sum. If you double your money and then lose half, you are back where you started, not ahead by the arithmetic average of your gains. This is the realm of the geometric mean. It is the average rate of growth that actually applies to your specific trajectory through time.

  The machinery hidden inside the slogan you heard is the logarithm. In mathematics, the logarithm is the tool that turns multiplication into addition. When wealth compounds, your total growth is the product of many individual growth factors. To find the average growth rate of a product, you cannot simply add the factors and divide; you must multiply them and take the root. However, multiplying many numbers is difficult to reason about intuitively. By taking the logarithm of your wealth, you transform that multiplicative process into an additive one. Maximizing the expected value of the logarithm of your wealth is mathematically equivalent to maximizing the geometric mean of your wealth. This is why the Kelly criterion, which tells you what fraction of your capital to bet, is derived by maximizing expected log wealth. It is not trying to make you rich in a single universe; it is trying to make you rich in the long run of the one universe you inhabit. The assumption here is vital and often unstated: this logic only holds if you are playing a repeated game. If you only have one bet to make in your entire life, and you care only about the final dollar amount regardless of the path, expected value might still be the right metric. But a career is not a single bet. It is a chain of bets where the capital for the next bet is the outcome of the previous one.

  This distinction explains the paradox you have heard, that Kelly betting is simultaneously too aggressive and too timid. It appears timid to the expected-value maximizer because it refuses to bet the whole bankroll even when the odds are in your favor. It leaves money on the table in the short term to avoid the risk of ruin. It says that survival is a prerequisite for growth. However, it appears aggressive to the cautious investor because, over a long enough timeline, it produces a higher rate of growth than any other strategy. Any strategy that bets less than the Kelly fraction is safer in the short run but will grow more slowly forever. Any strategy that bets more than the Kelly fraction will take on more volatility and, counterintuitively, will grow more slowly or eventually go broke. The sweet spot is not at zero risk, nor is it at maximum risk. It is at the point where the drag of volatility does not overwhelm the push of your edge. This is the hidden work the slogan is doing: it is prioritizing the sustainability of the trajectory over the magnitude of a single peak.

  Now let us turn this machinery toward your life as a novelist, though we must do so with care, for the analogy between a career and a casino is illuminating only up to a point. In the casino, capital is money, and ruin is bankruptcy. In your career, capital is a composite of your financial reserves, your reputation, your psychological resilience, and your time. Time is the most non-renewable of these resources. When you consider dividing the next three years between safe contract work and an ambitious novel, you are essentially deciding what fraction of your capital to stake on a high-variance asset. The safe work offers a low but positive return; it keeps your capital intact and perhaps grows it slightly. The ambitious novel is a long shot with a massive potential payout but a high probability of returning nothing, or even costing you capital in the form of lost income and opportunity. If you apply the logic of expected value alone, you might be tempted to stake everything on the novel. If the payout is enormous enough, the mathematical average across all possible versions of you suggests you should go for it. But you are not an average of all possible yous. You are the one who has to live through the failure if it comes.

  If you stake everything on the ambitious novel and it fails, you suffer a drawdown in your capital. If that drawdown is severe enough to prevent you from writing the next book, or to force you into desperate financial choices that degrade your work, you have hit a form of ruin. Geometric rationality argues that you should structure your bets so that you remain in the game. It suggests that the unit being maximized is not the potential glory of a single book, but the total creative output and stability of a lifetime. From this perspective, the temptation to stake everything on the one great book is a trap of the arithmetic mind. It treats the career as a single event rather than a sequence. It ignores the fact that if you survive to write five good books, the cumulative value of that body of work may exceed the lottery-ticket value of one masterpiece, especially when you account for the probability that the masterpiece never arrives. The geometric view protects the interests of your future selves. It asks not how rich you can get in the best-case scenario, but how likely you are to still be a working novelist in ten years.

  However, we must be honest about where the analogy breaks down, for a novelist's life is not a casino. In a casino, the odds are fixed and known, or at least estimable. In art, the odds are opaque. You do not know the true probability of your novel succeeding, nor do you know the exact payoff. Furthermore, the utility of money and success is not linear. A certain amount of money is necessary for survival, but beyond that, each additional dollar matters less, while the cost of losing your creative freedom matters more. This is where the logarithm serves a philosophical purpose as well as a mathematical one. The logarithm is a function of diminishing returns. It models the intuition that doubling your wealth when you are poor is life-changing, but doubling it when you are already wealthy is merely a number. By maximizing log wealth, you are implicitly acknowledging that staying above a certain threshold of security is more important than chasing infinite upside. For you, this might mean that the safe contract work is not merely a distraction from the art, but the substrate that allows the art to exist. It is the capital preservation that allows you to place more bets later.

  There is also a contested point I must name, because intelligent people disagree on it. Some argue that the Kelly criterion is still too aggressive for a human life because it assumes you can withstand the volatility it produces. A full-Kelly bettor can experience drawdowns of fifty percent or more before the growth kicks in. In a financial market, you can wait that out. In a career, a fifty percent drawdown in income or reputation might force you to quit entirely. Therefore, many practitioners use half-Kelly or quarter-Kelly, sacrificing some theoretical growth rate for much greater safety. This is not a mathematical error but a recognition of human fragility. In your case, this suggests that even if the geometric logic tells you to pursue the ambitious novel, it does not necessarily tell you to pursue it to the exclusion of all else. It might argue for a mixed strategy, where you allocate enough to the safe work to ensure you cannot be ruined, and the remainder to the long shot. This hedges your existence against the uncertainty of the odds.

  The information theory connection you mentioned is worth a brief touch, though it is less central than the compounding argument. In information theory, the logarithm measures information. The growth rate of wealth in a favorable bet is analogous to the rate at which you can transmit information over a noisy channel. If you bet too little, you are not using the channel's capacity. If you bet too much, you introduce errors that corrupt the message. In your career, the message is your work. If you over-leverage your life on one book, the noise of financial stress and fear of failure may corrupt the writing itself. The geometric view suggests that the optimal pace of creative risk is one that maximizes the signal-to-noise ratio over a lifetime. It is a argument for endurance. It posits that the most rational way to achieve a great outcome is not to sprint toward it until you collapse, but to find a speed you can maintain indefinitely.

  So, when you sit down to decide how to divide your next three years, the geometric way of thinking reframes the choice from a gamble on a specific outcome to a management of your trajectory. It asks you to identify what constitutes ruin for you. Is it running out of money? Is it losing the confidence to write? Is it burning out your enthusiasm? Once you define the absorbing state from which you cannot return, the policy becomes clear: never risk enough to touch that state, no matter how attractive the expected value looks. It treats your career as a portfolio of projects where the goal is to maximize the compound growth of your capability and reputation. It validates the choice to take the safe work not as a surrender, but as a strategic allocation of capital that keeps you solvent in the broadest sense. It warns that staking everything on the one great book is an act of arithmetic rationality in a geometric world. It might work in a parallel universe, but in this one, where time flows in a single direction and losses compound just as gains do, the defensible policy is to ensure you are always there to place the next bet. The goal is not to win the hand, but to remain at the table.
