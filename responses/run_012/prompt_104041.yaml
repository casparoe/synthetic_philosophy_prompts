  **Candidate Rule 2: The Strict Competence Rule (Expertise)**
  Moral testimony is impermissible when the agent **possesses the cognitive background to engage with the arguments**, regardless of whether they can synthesize the conclusion alone. Reliance is only permissible for true novices who lack the conceptual vocabulary to understand the rationale.
  *   *Fit:* Explains why the philosopher (Case 2) and the forgiveness-seeker (Case 6) cannot rely on testimony—they have the capacity to reason. It permits the student (Case 1) and the charity donor (Case 4) because they lack specific expertise. Case 5 is explained by the idea that a community insider has a duty to critique, implying a baseline competence.
