  The pattern in M's verdicts reveals a tension between two plausible normative principles regarding moral testimony. To predict her verdict on the new case, we must disentangle whether her prohibitions stem from the *agent's competence* or the *decision's significance*.

  **Candidate Rule 1: The Constitutive Agency Rule (Identity)**
  Moral testimony is impermissible when the judgment is **constitutive of the agent's moral identity, professional integrity, or personal relationships**. It is permissible when the judgment is external to the agent's core self (e.g., policy, basic truths, novice learning).
  *   *Fit:* Explains why the philosopher cannot outsource accusations (Case 2) or forgiveness (Case 6), and why the community member cannot outsource their code (Case 5)—all are identity-defining. It permits outsourcing on factory farming (Case 1), charity (Case 4), and algorithmic hiring (Case 7) because these are external or technical.
