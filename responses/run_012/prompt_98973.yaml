answer: |-
  You have an **inconsistent triad**. Claims (1), (2), and (3) cannot all be true. Specifically, (1) is the logical casualty that is pulling against your other core commitments.

  Here is the breakdown of the tension, the ranking of what to keep, and the cheapest repair.

  ### The Inconsistency: The "Impossible Trinity"

  1.  **(1) says:** Indicatives and Counterfactuals have the **same truth conditions**.
  2.  **(2) says:** Counterfactuals **have truth conditions** (closest worlds).
  3.  **(3) says:** Indicatives **lack truth conditions** (Adams/Suppositionalism).

  **The Logic:** If (1) is true, then Indicatives and Counterfactuals must match on the property of "having truth conditions."
  *   If Counterfactuals have them (per 2), Indicatives must have them. **(Contradicts 3)**
  *   If Indicatives lack them (per 3), Counterfactuals must lack them. **(Contradicts 2)**

  You cannot maintain a unified semantics (1) while holding that one type is truth-apt (2) and the other is not (3).

  ### Secondary Tension: (1) vs. (4) (The Oswald Problem)

  Even if you dropped (3) and gave Indicatives truth conditions, (1) still struggles with (4).
  *   **The Data:** We accept the Indicative ("If Oswald didn't shoot, someone else did") as **true** (given the evidence he was the assassin). We reject the Counterfactual ("Had Oswald not shot, someone else would have") as **false** (no conspiracy).
  *   **The Conflict:** If (1) is right and they have the *same* truth conditions, they should have the *same* truth value in the actual world. The fact that we intuitively assign them different truth values suggests the truth conditions are *not* the same.
  *   **Your Move:** You try to save (1) by saying the difference is "entirely in what the speaker is taking for granted." But (4) insists the CF is *false*, not just infelicitous due to presupposition failure. If it's false, it has a truth value, and that value differs from the Indicative.

  ### Ranking: What to Keep vs. What to Cut

  Here is the ranking of your claims from "Most Entrenched/Costly to Give Up" to "Cheapest to Sacrifice."

  **1. (3) The Suppositional View (Keep)**
  *   **Cost to drop:** High. If you give this up, you run headfirst into **Lewis's Triviality Results**. If "If A, B" expresses a proposition with truth conditions, its probability cannot generally equal $P(B|A)$. Giving this up forces you into a standard possible-worlds view for indicatives (like Stalnaker), which struggles with probability logic.
  *   **Workshop Defense:** This is your strongest theoretical shield. Keep it.

  **2. (2) Counterfactual Objectivity (Keep)**
  *   **Cost to drop:** High. If you deny CFs have objective truth conditions, you become an expressivist about counterfactuals. This is a defensible position (e.g., Gibbard), but it's a much heavier metaphysical lift than keeping standard Lewis/Stalnaker semantics.
  *   **Workshop Defense:** Standard orthodoxy. Easy to defend.

  **3. (4) The Oswald Intuition (Keep)**
  *   **Cost to drop:** Medium. This is your primary data point. If your theory predicts the Oswald counterfactual is true, your theory is wrong.
  *   **Workshop Defense:** "Any theory that makes the Oswald counterfactual true is failing to capture causal independence."

  **4. (5) Context Sensitivity (Keep)**
  *   **Cost to drop:** Negligible. Almost everyone accepts this. It doesn't generate the inconsistency.

  **5. (1) The Unification Thesis (Cut)**
  *   **Cost to drop:** Low. This is a theoretical hypothesis, not a data point or a logical necessity. Many successful theories (e.g., Edgington, dual-semantics views) treat Indicatives and Counterfactuals as semantically distinct species.
  *   **Workshop Defense:** "The linguistic similarity is pragmatic/morphological, not semantic."

  ### The Cheapest Repair: "Dual Semantics"

  **Drop (1).** Explicitly adopt a **Dual Semantics** view.

  **The Repair:**
  Indicatives and Counterfactuals do *not* have the same truth conditions.
  *   **Indicatives:** Governed by (3). They are suppositional, lacking truth conditions, governed by conditional probability.
  *   **Counterfactuals:** Governed by (2). They are truth-apt, governed by closest possible worlds (metaphysical/causal similarity).

  **Why this fixes everything:**
  1.  **Resolves the Triad:** You no longer claim they have the *same* truth conditions. You claim they have *different* semantic mechanisms. (2) and (3) can now coexist peacefully.
  2.  **Saves Oswald (4):** This explains the Oswald pair perfectly.
      *   The **Indicative** is evaluated epistemically: Given what we know (Oswald shot), $P(\text{Someone else did} | \text{Oswald didn't})$ is high (because we assume a conspiracy if he didn't act alone). *Wait, actually:* In the standard Oswald case, the Indicative is "If Oswald didn't shoot, someone else did." Given the fact he *did* shoot, the antecedent is false.
      *   *Correction on Oswald:* The standard intuition is that the Indicative is **true** (because if he didn't, the conspiracy ensures someone else did? No, usually the intuition is: Indicative = True [based on evidence], Counterfactual = False [based on causal facts]).
      *   *Actually, the standard view:* The Indicative "If Oswald didn't shoot, someone else did" is often judged **true** because we treat the antecedent as an epistemic possibility compatible with the evidence (maybe we aren't sure he did it). The Counterfactual "Had Oswald not shot..." is judged **false** because we hold fixed the causal facts (no conspiracy).
      *   **With Dual Semantics:** The Indicative is true because it reflects our *epistemic state* (Suppositional). The Counterfactual is false because it reflects the *metaphysical/causal facts* (Closest Worlds). The divergence in truth value is explained by the divergence in semantics.
  3.  **Explains the "Difference":** You can keep the spirit of (1) pragmatically. The *morphology* is similar, and the *presuppositions* differ (open vs. false), but the *semantic engine* is different.

  ### Workshop Prep: Anticipate the Objections

  If you make this repair, here is what the audience will attack:

  1.  **The "Embedding" Objection:** "If they have different semantics, why can they be embedded in the same logical structures (e.g., 'If A then if B, C')?"
      *   *Reply:* Acknowledge this is a cost. Argue that the logic works at the level of *assertibility conditions* rather than truth conditions.
  2.  **The "Stalnaker" Objection:** "Why posit two mechanisms when one (closest worlds) can do both?"
      *   *Reply:* Because one mechanism cannot satisfy the Probability Thesis (3) without triviality. You pay the price of dual semantics to save the probability logic.
  3.  **The "Oswald" Objection:** "Isn't the Indicative also false if Oswald definitely shot?"
      *   *Reply:* Clarify that Indicatives are sensitive to *epistemic* possibility, not just metaphysical fact. That is the feature of Suppositionalism.

  **Summary:** Keep (2), (3), (4), and (5). **Sacrifice (1).** It is the only claim that is logically incompatible with your other commitments, and dropping it actually strengthens your explanation of the Oswald case.
