  # JOINT STATEMENT ON BEHAVIORAL GENETICS AND HERITABILITY INFERENCE

  **Signatories:** The Behavioral Genetics Working Group (Camp A) & The Contextualist Critique Consortium (Camp B)
  **Date:** [Redacted]
  **Status:** Adversarial Collaboration Conclusion

  ## I. SUBSTANTIVE AGREEMENTS
  *The following claims are endorsed by all signatories. Denial of any single item constitutes a rejection of this consensus.*

  1.  **Definition of Scope:** Heritability ($h^2$) is strictly a population statistic describing the proportion of *phenotypic variance* in a *specific population* at a *specific time* attributable to *genetic variance*. It is not a measure of individual destiny, genetic determination, or immutability.
  2.  **Environmental Malleability:** A high heritability estimate is mathematically compatible with large environmental effects on the population mean. Secular trends (e.g., the Flynn effect) demonstrate that mean trait levels can shift substantially without contradicting stable within-population heritability estimates.
  3.  **Context Dependence:** Heritability estimates are contingent on the range of environments sampled. If environmental variance is restricted (e.g., universal schooling), heritability estimates will rise; if environmental variance is expanded, they will fall. The coefficient is not a biological constant of the trait.
  4.  **The Group Difference Fallacy:** High within-population heritability provides no logical or mathematical basis for inferring the cause of mean differences *between* distinct populations. Within-group variance partitioning and between-group mean decomposition are separate problems with non-transferable solutions.
  5.  **Model Dependency:** All current methods for estimating heritability (twin, adoption, SNP-based) rely on assumptions regarding gene-environment interplay and relatedness. Violations of these assumptions (e.g., assortative mating, passive gene-environment correlation) bias estimates, though the direction and magnitude of bias are debated.
  6.  **Predictive vs. Causal:** Polygenic scores and heritability estimates possess predictive utility for stratification within the sampled population, but prediction does not equate to causal identification. High predictive power does not rule out substantial environmental mediation of genetic effects.

  ## II. REMAINING DISAGREEMENTS
  *Where consensus could not be reached, the following table records the divergent positions. Each statement is worded to be acceptable to the side holding it.*

  | Topic | Camp A (Behavioral Geneticist) Position | Camp B (Heritability Critic) Position |
  | :--- | :--- | :--- |
  | **Assumption Robustness** | The Equal Environments Assumption and additivity assumptions are sufficiently robust that bias is minor relative to the signal; estimates are valid lower-bounds for genetic influence. | The assumptions are systematically violated in ways that inflate genetic estimates; the "signal" is often confounded environmental variance masquerading as genetic effects. |
  | **G×E Interaction** | Gene-environment interactions exist but are generally second-order effects; additive models capture the bulk of variance relevant for prediction and theory. | Gene-environment interactions are fundamental to the causal structure; ignoring them renders the additive coefficient misleading for policy or mechanistic understanding. |
  | **Utility of $h^2$** | The coefficient is a necessary baseline for distinguishing biological from environmental pathways; discarding it impedes scientific progress on trait architecture. | The coefficient is a black box that reifies social categories as biological; discarding it forces focus onto modifiable environmental mechanisms. |
  | **Group Difference Tractability** | With sufficient molecular data and improved models, the genetic contribution to between-group differences is an empirically tractable question, even if currently unresolved. | The confounding between genetics, ancestry, and environment is total for socially defined groups; the question is empirically intractable and scientifically ill-posed. |

  ## III. SEMANTIC VS. SUBSTANTIVE DISPUTES
  *The following disagreements are identified as primarily linguistic rather than empirical. Resolving these definitions reduces apparent conflict.*

  **1. The Meaning of "Heritable"**
  *   **Dispute:** In ordinary speech, "heritable" implies "passed down unchanged" or "difficult to modify." In technical literature, it means "associated with genetic variance in this specific distribution."
  *   **Resolution:** Both sides agree to use "heritable" *only* in the technical variance-partitioning sense. Use "malleable" or "fixed" when discussing intervention potential.

  **2. The Level of Inference (The Smuggling Zone)**
  *   **Dispute:** Confusion arises when statistics describing *between-person variation* are used to make claims about *within-family causality* or *within-individual development*.
  *   **Resolution:** We explicitly isolate the **Inference Swap**:
      *   *Valid:* "In this population, genetic differences explain X% of why Person A differs from Person B."
      *   *Invalid Swap 1:* "Genetic differences explain X% of why Person A has their specific trait level." (Individual causation).
      *   *Invalid Swap 2:* "Genetic differences explain X% of why Sibling A differs from Sibling B." (Within-family causation requires controlling for shared family environment, which population $h^2$ does not fully isolate).
      *   *Invalid Swap 3:* "Genetic differences explain X% of why Population A differs from Population B." (Between-group causation).
  *   **Consensus:** Most public controversy stems from Invalid Swap 3. Most technical controversy stems from Invalid Swap 2 (assuming twin models perfectly isolate within-family genetic effects).

  ## IV. CRUXES AND PRE-REGISTERED PREDICTIONS
  *For the remaining substantive disagreements, we identify the specific evidence that would shift confidence, and record pre-registered predictions.*

  ### Crux 1: The Equal Environments Assumption (EEA)
  *   **The Question:** Does the greater similarity of Monozygotic (MZ) twins compared to Dizygotic (DZ) twins stem from genetic identity, or from MZ twins being treated more similarly *because* they look identical?
  *   **Agreed Evidence:** Studies measuring "twin treatment similarity" directly and controlling for it in heritability models, or comparing heritability estimates in twins reared apart vs. together with rigorous environmental matching.
  *   **Camp A Prediction:** Controlling for measured treatment similarity will reduce MZ-DZ concordance differences by less than 10%. The genetic estimate will remain robust.
  *   **Camp B Prediction:** Controlling for measured treatment similarity will reduce MZ-DZ concordance differences by more than 30%. A significant portion of the "genetic" variance is actually environmentally mediated by differential treatment.

  ### Crux 2: Gene-Environment Interaction (G×E) Magnitude
  *   **The Question:** Is the additive model a useful approximation, or does it miss the primary causal mechanism?
  *   **Agreed Evidence:** Stratified heritability estimates across vastly different socioeconomic or environmental contexts (e.g., low-SES vs. high-SES cohorts).
  *   **Camp A Prediction:** Heritability estimates will remain relatively stable across strata. Interactions exist but account for a minor fraction of total variance compared to additive genetic effects.
  *   **Camp B Prediction:** Heritability estimates will diverge significantly across strata (e.g., near zero in deprived environments, high in enriched ones). Interactions account for a major fraction of variance, rendering the single additive coefficient misleading.

  ### Crux 3: The Flynn Effect and Variance Structure
  *   **The Question:** Do large mean shifts imply the variance structure (and thus $h^2$) is unstable?
  *   **Agreed Evidence:** Longitudinal analysis of variance components during periods of rapid mean increase.
  *   **Camp A Prediction:** Mean shifts can occur via environmental factors that affect everyone equally (shifting the intercept) without altering the rank-order variance structure. $h^2$ will remain stable despite mean changes.
  *   **Camp B Prediction:** Large mean shifts indicate the environmental variance component is dominant and unstable. If the environment can move the mean this much, the variance partitioning is too context-dependent to be a stable scientific parameter.

  ### Crux 4: Between-Group Inference Tractability
  *   **The Question:** Is it possible to disentangle genetic and environmental causes of group mean differences?
  *   **Agreed Evidence:** Trans-ancestry polygenic score portability and admixture mapping studies that control for socioeconomic status and environmental stratification.
  *   **Camp A Prediction:** As GWAS sample diversity increases and environmental controls tighten, polygenic scores will predict group means with residual variance attributable to genetics. The question is solvable.
  *   **Camp B Prediction:** Polygenic scores will never fully decouple from environmental stratification because ancestry and environment are perfectly confounded in socially defined groups. The residual variance will always be indistinguishable from unmeasured environmental bias. The question is unsolvable.

  ***

  **Addendum on the "Smuggling" Constraint**
  *Per the collaboration request, we explicitly isolate the logical swap regarding within-family vs. between-person variation.*

  **The Statistic:** $h^2$ measures $\frac{V_{genetic}}{V_{total}}$ across **persons** in a **population**.
  **The Smuggle:** Interpreting this as $\frac{Cause_{genetic}}{Cause_{total}}$ within a **family** or **individual**.

  **Why it matters:**
  1.  **Population:** If $h^2 = 0.60$, 60% of the *differences* between random people are associated with genetic differences.
  2.  **Family:** This does *not* mean that for any specific pair of siblings, 60% of their difference is genetic. It could be 0% or 100% depending on the specific non-shared environment of that family.
  3.  **The Swap:** Camp A is often accused of implying that because $h^2$ is high, interventions within a family (parenting changes) are futile. Camp B is often accused of implying that because $h^2$ is context-dependent, genetic differences between siblings are irrelevant.
  4.  **Consensus:** The statistic speaks to **variance in the population**, not **causation in the dyad**. Any policy argument relying on the translation of population variance to individual family causality is unsupported by the coefficient alone.
