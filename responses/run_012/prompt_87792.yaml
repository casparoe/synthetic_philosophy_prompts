  ### The Case Construction

  Here is the specific profile and manipulation scenario you requested, designed for the scoring rule where Top=2, Middle=1, Bottom=−1.

  **The Honest Profile**
  There are five voters ($1, \dots, 5$) and three alternatives ($A, B, C$). The voters submit the following strict rankings:

  *   **Voter 1:** $A \succ B \succ C$
  *   **Voter 2:** $B \succ C \succ A$
  *   **Voter 3:** $B \succ C \succ A$
  *   **Voter 4:** $A \succ B \succ C$
  *   **Voter 5:** $A \succ C \succ B$

  **The Honest Tally**
  We calculate the score for each alternative based on the rule (2 points for 1st, 1 for 2nd, −1 for 3rd).

  *   **Alternative A:**
      *   V1 (1st): +2
      *   V2 (3rd): −1
      *   V3 (3rd): −1
      *   V4 (1st): +2
      *   V5 (1st): +2
      *   **Total:** $2 - 1 - 1 + 2 + 2 = \mathbf{4}$

  *   **Alternative B:**
      *   V1 (2nd): +1
      *   V2 (1st): +2
      *   V3 (1st): +2
      *   V4 (2nd): +1
      *   V5 (3rd): −1
      *   **Total:** $1 + 2 + 2 + 1 - 1 = \mathbf{5}$

  *   **Alternative C:**
      *   V1 (3rd): −1
      *   V2 (2nd): +1
      *   V3 (2nd): +1
      *   V4 (3rd): −1
      *   V5 (2nd): +1
      *   **Total:** $-1 + 1 + 1 - 1 + 1 = \mathbf{1}$

  **The Honest Winner**
  Alternative **B** wins with 5 points. Alternative A has 4, and C has 1. The winner is unique, so the alphabetical tie-breaker is idle.

  ***

  ### The Manipulation

  **The Manipulator**
  **Voter 1**. Her honest preferences are $A \succ B \succ C$. Under the honest tally, her second choice ($B$) wins. She strictly prefers $A$ to $B$.

  **The Misreport**
  Voter 1 submits the ranking **$A \succ C \succ B$**.
  This is a "mild" lie: she swaps her second and third choices ($B$ and $C$), which are adjacent in her true ranking.

  **The New Tally**
  Voter 1's ballot changes from $(A:2, B:1, C:-1)$ to $(A:2, B:-1, C:1)$.
  The net change to the totals is: $A: 0$, $B: -2$, $C: +2$.

  *   **New Score A:** $4 + 0 = \mathbf{4}$
  *   **New Score B:** $5 - 2 = \mathbf{3}$
  *   **New Score C:** $1 + 2 = \mathbf{3}$

  **The New Winner**
  Alternative **A** wins with 4 points. Alternatives $B$ and $C$ tie for second with 3 points. The winner is unique (A), so the tie-breaker is again idle.

  **Verification of Improvement**
  *   **Honest Outcome:** $B$ wins.
  *   **Manipulated Outcome:** $A$ wins.
  *   **Voter 1's Preference:** $A \succ B$.
  *   **Conclusion:** Voter 1 has successfully manipulated the election to secure a strictly better outcome.

  ***

  ### Enumeration of All Profitable Misreports

  You suspected that Voter 1 might not be the only one with a profitable deviation. You are correct. We must check every voter against the **Honest Profile** (where B wins).

  1.  **Voter 1 ($A \succ B \succ C$):**
      *   Current Outcome: $B$ (2nd choice).
      *   Profitable Misreports:
          *   Report $A \succ C \succ B$: Outcome becomes $A$ (1st choice). **Profitable.**
          *   (All other permutations result in $B$ winning or $C$ winning, which she prefers less than $B$).
      *   **Status:** **Can Manipulate.**

  2.  **Voter 2 ($B \succ C \succ A$):**
      *   Current Outcome: $B$ (1st choice).
      *   Profitable Misreports: None. She cannot improve upon her top choice winning.
      *   **Status:** Cannot Manipulate.

  3.  **Voter 3 ($B \succ C \succ A$):**
      *   Current Outcome: $B$ (1st choice).
      *   Profitable Misreports: None.
      *   **Status:** Cannot Manipulate.

  4.  **Voter 4 ($A \succ B \succ C$):**
      *   Current Outcome: $B$ (2nd choice).
      *   Profitable Misreports:
          *   Report $A \succ C \succ B$: Outcome becomes $A$ (1st choice). **Profitable.**
      *   **Status:** **Can Manipulate.**
      *   *Note:* Voter 4 is in the exact same strategic position as Voter 1.

  5.  **Voter 5 ($A \succ C \succ B$):**
      *   Current Outcome: $B$ (3rd choice).
      *   She prefers $A$ and $C$ over $B$. Can she make either win?
      *   To help $A$: She already gives $A$ the maximum score (2). She cannot raise $A$ further. She is already giving $B$ the minimum score (−1). She cannot lower $B$ further.
      *   To help $C$: She can raise $C$ from 1 to 2 (by reporting $C \succ A \succ B$). This adds 1 point to $C$ and removes 1 from $A$.
          *   New Tally if V5 lies $C \succ A \succ B$: $A=3, B=5, C=2$. $B$ still wins.
      *   **Status:** Cannot Manipulate (alone).

  **Summary:** At the honest profile, **Voters 1 and 4** both have exactly **one** profitable misreport each ($A \succ C \succ B$).

  ***

  ### Analysis

  #### 1. Confirmation of Gibbard–Satterthwaite Hypotheses
  The theorem applies because your rule satisfies all necessary conditions:
  *   **Finite Voters and Alternatives:** 5 voters, 3 alternatives.
  *   **Unrestricted Domain:** Voters can submit any strict ranking.
  *   **Resolute:** The alphabetical tie-breaker ensures a single winner always exists.
  *   **Onto:** Every alternative can win. (We saw $B$ win honestly and $A$ win via manipulation. $C$ can win if, for example, all 5 voters rank $C$ first).
  *   **Non-Dictatorial:** No single voter dictates the outcome. (If Voters 2 and 3 vote $B \succ \dots$ and Voters 4 and 5 vote $A \succ \dots$, Voter 1 cannot force $C$ to win, nor can she prevent $B$ from winning if the rest of the coalition is strong enough).

  Since the rule meets these hypotheses, the theorem **guarantees** that there exists *some* profile where *some* voter can manipulate. We have explicitly constructed that profile.

  #### 2. The Feature Doing the Work
  The manipulability here arises from the **scoring vector** $(2, 1, -1)$. Specifically, the penalty for being ranked last (−1) is twice as large as the gap between first and second (1 point). This asymmetry allows Voter 1 to hurt $B$ significantly (dropping $B$ from 1 to −1, a 2-point loss) without hurting $A$ at all.

  **Comparison with Standard Borda (2, 1, 0):**
  If we switch to standard Borda scores on the *same honest profile*:
  *   **Honest Tally:** $A=6, B=6, C=3$.
  *   **Honest Winner:** **A** (wins tie-break over B).
  *   **Does the winner change?** Yes. Under $(2, 1, -1)$, $B$ won. Under $(2, 1, 0)$, $A$ wins.
  *   **Is Voter 1's misreport still profitable?** No. Since $A$ already wins honestly under Borda, Voter 1 (who prefers $A$ most) cannot improve the outcome. Her misreport yields $A$ again.
  *   *Observation:* Interestingly, under Borda, Voters 2 and 3 (who prefer $B$) would now have the incentive to manipulate to dislodge $A$. The scoring vector determines *who* holds the strategic power at a given profile.

  #### 3. Dropping Onto-ness (Two Alternatives)
  If we restrict the election to only two alternatives (say, $A$ and $B$), the Gibbard–Satterthwaite theorem no longer applies (it requires $|X| \ge 3$).
  *   With two alternatives, this scoring rule becomes equivalent to **Majority Rule** (since the score difference between 1st and 2nd is constant).
  *   Majority Rule with two alternatives is **strategy-proof**. A voter can never benefit by ranking their less-preferred candidate higher.
  *   This confirms that the existence of a "third" alternative is mathematically essential for the impossibility result.

  #### 4. How a Defender Might Defuse This Case
  A proponent of this voting rule might argue the following:
  *   **Informational Burden:** To manipulate successfully, Voter 1 needed to know the exact votes of everyone else to calculate that $B$ was winning by exactly 1 point. In real elections, this information is rarely available.
  *   **Rarity:** While manipulation is *possible*, profiles where it is *feasible and profitable* might be statistically rare or require specific coordination (here, V1 and V4 both *could* manipulate, but only one needed to).
  *   **Other Virtues:** The rule might be defended on grounds of "consensus" (Borda-like rules tend to elect compromise candidates) which outweighs the theoretical vulnerability to strategy.

  #### 5. Mathematics vs. Interpretation
  You asked to distinguish settled math from contested interpretation regarding the "deep and troubling" nature of the theorem.

  *   **Settled Textbook Material (Mathematics):**
      *   The theorem is a proven logical fact. There is no voting system (meeting the criteria) that is perfectly strategy-proof.
      *   Manipulability is an inherent structural feature of collective choice with $\ge 3$ options, not a bug of specific implementation.
      *   In the case above, the math is indisputable: Voter 1 *did* get a better outcome by lying.

  *   **Genuinely Contested (Interpretation):**
      *   **"Troubling for Democracy":** Some theorists argue this proves democracy is fundamentally flawed or that "the will of the people" is incoherent because the outcome depends on strategic behavior rather than true preferences.
      *   **"Shows Almost Nothing":** Others argue that the theorem assumes a "static" game with perfect information. In dynamic political systems, parties form, agendas are set, and preferences evolve. If manipulation is computationally hard to find (a result from computer science known as the *complexity of manipulation*), the theorem might be theoretically true but practically irrelevant.
      *   **The Disagreement:** The math says manipulation *exists*. The debate is about whether that existence *matters* for normative political theory. The pessimist says "Perfect fairness is impossible." The optimist says "Robustness is possible even if perfection isn't."

  This case demonstrates the mathematical bite: the rule *is* vulnerable. Whether that vulnerability destroys the rule's legitimacy is the political theory question you will spend the rest of the course debating.
