  You cannot have all five without introducing a tension that fractures the principle. Specifically, judgment (1) and judgment (3) are in deep theoretical conflict. (1) asserts that **moral wrongness overrides positive legal silence** (you can be punished for aggression even if it wasn't codified as a crime). (3) asserts that **positive legal command overrides moral wrongness** (you cannot be punished for atrocities if your domestic law commanded them).

  To maintain a coherent, single principle, you must surrender **(3)**.

  Abandoning (3) is cheaper than the alternatives. If you keep (3), you must adopt a "Role-Relative" theory where leaders are moral agents bound to international norms, but subordinates are legal automatons bound only to domestic statutes. This creates a morally untenable caste system: the higher your rank, the more moral responsibility you bear; the lower your rank, the more you are shielded by positive law. This contradicts the universalist impulse behind (5), which treats atrocity convictions as robust against hypocrisy because they violate *human* norms, not just *state* norms. If atrocities violate human norms, domestic law cannot excuse them, any more than international silence could excuse aggression in (1). Surrendering (3) aligns your view with the post-Nuremberg consensus (the Rome Statute rejects superior orders for crimes against humanity) and unifies your theory under a single conception of moral agency.

  ### The Principle: Manifest Moral Culpability

  **Statement:**
  > A tribunal's conviction is legitimate if and only if the defendant violated a universal moral norm that was **manifestly accessible** to their reason at the time of conduct, provided the defendant possessed the **capacity and knowledge** to avoid the violation. The source of the tribunal's authority is irrelevant to legitimacy, but the **reciprocity** of the norm matters: violations of reciprocal state norms (aggression) are vulnerable to charges of selectivity, while violations of universal human norms (atrocities) are not.

  **How it generates your verdicts:**
  *   **(1) Aggression:** Legitimate. Aggressive war violates a manifest moral norm (peace/sovereignty) accessible to leaders, even if positive international law was silent.
  *   **(2) Unknown Atrocities:** Not Legitimate. Lacks **knowledge**. No culpability without *mens rea*.
  *   **(3) Domestic Law Command:** **Surrendered.** Under this principle, if the conduct violates a manifest moral norm (e.g., torture), domestic law is no excuse. Moral accessibility trumps legal command.
  *   **(4) Victors' Tribunal:** Legitimate. The **source** of authority does not affect the defendant's moral culpability.
  *   **(5) Victor's Hypocrisy:** Defect for Aggression, not Atrocity. Aggression is a **reciprocal state norm**; if victors violate it, the norm's enforcement appears selective, undermining legitimacy. Atrocities are **universal human norms**; victor hypocrisy does not change the manifest wrongness of the act, so convictions stand.

  ### Verdicts on New Cases

  **(a) A tribunal of exclusively foreign judges trying the officials of a state that committed no aggression but tortured its own citizens under the authority of its own law.**
  *   **Verdict:** **Legitimate.**
  *   **Reasoning:** Under *Manifest Moral Culpability*, torture violates a universal human norm that is manifestly accessible to reason, regardless of domestic legal authorization. Per (4), the foreign composition of the bench is not a defect. Per (5), the lack of aggression is irrelevant to atrocity convictions, and victor hypocrisy (if any) does not undermine universal norms. The domestic law command is not a valid defense (having surrendered judgment 3).

  **(b) A defendant who, before the war, had himself publicly urged that aggressors be individually punished, and who is now tried under precisely that standard.**
  *   **Verdict:** **Highly Legitimate (Estoppel).**
  *   **Reasoning:** This case strengthens the **accessibility** condition. The defendant cannot claim ignorance of the norm or unfair surprise (*nullum crimen*), as he publicly advocated for it. His prior advocacy confirms the moral manifestness of the norm and removes any claim to reliance on impunity.

  ### Costs and Weaknesses

  **The Cost:**
  The primary cost is the surrender of **Legal Certainty** for subordinates. By rejecting (3), you expose individuals to punishment based on moral reasoning rather than clear statutory authority. This risks *ex post facto* justice where "manifest moral wrong" is defined by the victor. You trade the safety of positive law (knowing exactly what is forbidden) for the moral robustness of natural law (knowing what is *wrong*).

  **The Weakest Point:**
  The principle is weakest in defining **"Manifestly Accessible."** Who decides what moral norms are obvious enough to override domestic law? In 1945, aggressive war was debatable among legal positivists; today, torture is clearer. But in borderline cases (e.g., economic sanctions causing starvation, or drone warfare), the line between "manifest moral wrong" and "debatable policy" is blurry. This grants tribunals significant discretion, which invites the very charge of "Victor's Justice" you seek to mitigate in (5). You rely on the moral clarity of the judges to match the moral clarity of the crime, which is a fragile assumption.
