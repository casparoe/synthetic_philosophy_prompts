  # Handout: Decision Tree for Extra-Mathematical Appeals to Gödel
  **Seminar:** Limits of Formalism | **Topic:** Incompleteness Outside Arithmetic

  ## I. The Decision Tree
  *Follow the path of the claim to determine its logical status and vulnerability.*

  **Q1. SYSTEM STATUS:** Is the target domain rigorously modeled as an **effectively axiomatizable formal system rich enough for arithmetic**?
  *   **NO** $\rightarrow$ Go to **Q2 (Metaphor)**
  *   **YES** $\rightarrow$ Go to **Q3 (Formal Application)**

  **Q2. METAPHORICAL SCOPE:** Does the argument slide from "unprovable in this system" to **"unprovable in principle"** or "no system can be self-grounding"?
  *   **YES** $\rightarrow$ **LEAF A: The "No Totalizing Theory" Metaphor** (Epistemology/Social Theory)
      *   *Vulnerable Commitment:* Equates syntactic incompleteness with semantic or pragmatic open-endedness without formal warrant.
  *   **NO** $\rightarrow$ **LEAF B: Normative Blind Spots** (Legal/Moral Codes)
      *   *Vulnerable Commitment:* Treats normative truth as analogous to arithmetical truth despite lacking recursive structure.

  **Q3. CONSISTENCY BURDEN:** Does the argument rely on the system's inability to **prove its own consistency** (Gödel-2)?
  *   **YES** $\rightarrow$ **LEAF C: Internal Reliability Limits** (AI Self-Verification)
      *   *Vulnerable Commitment:* Equates "formal consistency" with practical "reliability" or safety.
  *   **NO** $\rightarrow$ Go to **Q4 (Anti-Mechanism)**

  **Q4. MIND SURVEY:** Does the argument treat the **human mind as both consistent and able to survey its own axioms** to see the truth of the Gödel sentence?
  *   **NO** $\rightarrow$ **LEAF D: Unoccupied Space** (Inconsistent or Blind Mechanism)
      *   *Vulnerable Commitment:* Implies human reasoning is either inconsistent or incapable of recognizing arithmetical truth.
  *   **YES** $\rightarrow$ **LEAF E: The Lucas–Penrose Argument** (Anti-Mechanist)
      *   *Vulnerable Commitment:* Assumes the mind knows its own consistency, which GIT shows is impossible for the system itself.

  **Q5. PHYSICAL BRIDGE:** (If Leaf E is accepted) Does the argument infer **non-computable physics** from the mind's non-algorithmic nature?
  *   **YES** $\rightarrow$ **LEAF F: Penrose's Quantum Gravity** (New Physics)
      *   *Vulnerable Commitment:* Speculates a causal link between logical undecidability and quantum state reduction without empirical evidence.

  ---

  ## II. Routing Specific Claims
  | Claim | Path | Verdict |
  | :--- | :--- | :--- |
  | **"GIT limits what an AI can prove about its own reliability."** | Q1(Yes) $\rightarrow$ Q3(Yes) | **Leaf C (Valid but narrow).** Technically sound regarding consistency proofs, but "reliability" exceeds formal consistency. |
  | **"Any sufficiently rich moral code must contain truths its rules cannot establish."** | Q1(No) $\rightarrow$ Q2(Yes) | **Leaf B (Metaphorical).** Morality lacks the effective axiomatization required for GIT to apply strictly. |

  ---

  ## III. Logical Space Analysis

  ### 1. Indistinguishable Leaves
  *   **Leaf A (Social Theory) & Leaf B (Legal/Moral):** The tree cannot formally separate these. Both occupy the **Q1(NO)** branch and rely on the "incompleteness" metaphor to argue for open-endedness. Both fail for the same reason: the target domains are not effectively axiomatizable formal systems containing arithmetic.

  ### 2. Unoccupied Combinations
  *   **The "Inconsistent Mind" Position (Q1-Yes $\rightarrow$ Q3-No $\rightarrow$ Q4-No):**
      *   *Combination:* Accepts mind is a formal system + Accepts mind sees Gödel truth + Denies mind knows its own consistency.
      *   *Status:* **Unattractive/Unoccupied.** If the mind does not know it is consistent, it cannot validly assert the Gödel sentence is *true* (only that it is unprovable). This collapses the Anti-Mechanist argument. Dialetheists (who accept true contradictions) occupy a nearby space but rarely invoke Gödel for this specific purpose.
  *   **The "Simple System" Appeal (Q1-No [due to arithmetic] $\rightarrow$ Q3-Yes):**
      *   *Combination:* Claims a system too weak for arithmetic (e.g., Presburger arithmetic) cannot prove its own consistency via Gödel.
      *   *Status:* **Incoherent.** Gödel's Second Theorem requires arithmetic richness. Appeals here are technically false, so no serious position occupies this leaf.

  ---

  ## IV. Instructor Notes: The "Logical Space First" Methodology
  *   **Construction Logic:** The tree prioritizes **preconditions** (Q1) before **inferences** (Q2–Q4). This isolates category errors (Q1-NO) from technical misreadings (Q1-YES).
  *   **The Critical Juncture:** Q4 is the pivot for the Philosophy of Mind. If the student cannot defend the claim that "we know we are consistent," the Lucas-Penrose argument defaults to Leaf D (Unoccupied), effectively neutralizing the anti-mechanist conclusion.
  *   **AI Claim Nuance:** Leaf C is the only "Valid" leaf for computational systems. It acknowledges GIT 2 without making the Anti-Mechanist leap. Use this to distinguish serious computational theory from science-fiction appeals.
