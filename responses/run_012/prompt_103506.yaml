answer: |-
  ## Specification for a Paraconsistent Reasoning Core

  This document treats logic as a specification for an inference engine. Your current system implements Classical Logic (CL). CL has a fatal failure mode: **Explosion** (*Ex Contradictione Quodlibet*). If the database contains $P$ and $\neg P$, the engine infers $Q$ for any $Q$.

  You are requesting a replacement logic $\mathcal{L}$ that tolerates inconsistency without trivializing the output. Below are the functional requirements (desiderata), the known incompatibilities, and the engineering trade-offs.

  ### 1. Desiderata List (Functional Requirements)

  #### R1: Non-Explosiveness (Paraconsistency)
  *   **Specification:** There must exist a set of premises $\Gamma$ and sentences $A, B$ such that $\Gamma \vdash A$, $\Gamma \vdash \neg A$, but $\Gamma \nvdash B$.
  *   **Case:** **The Explosion Problem.** In CL, $(P \land \neg P) \to Q$ is a tautology. If upstream System X sends `Status: OK` and System Y sends `Status: FAIL`, your current engine infers `Status: MOON_IS_CHEESE`.
  *   **Constraint:** The inference relation $\vdash$ must not be monotonic with respect to contradiction in the standard way.

  #### R2: Classical Recovery (Conservative Extension)
  *   **Specification:** For any set of premises $\Gamma$ that is classically consistent, if $\Gamma \vdash_{CL} Q$, then $\Gamma \vdash_{\mathcal{L}} Q$.
  *   **Case:** **Regression Testing.** When upstream sources agree, the new system must produce the exact same output as the old system. You cannot afford to rewrite business rules that rely on standard boolean logic just because the underlying engine changed.
  *   **Constraint:** $\mathcal{L}$ must be a conservative extension of CL.

  #### R3: Modus Ponens Preservation
  *   **Specification:** The rule $\{A, A \to B\} \vdash B$ must hold.
  *   **Case:** **Rule Chaining.** Your service likely uses rules like `IF Critical_Error THEN Alert`. If you have `Critical_Error` and the rule, you must get `Alert`.
  *   **Constraint:** Many logics that block Explosion do so by weakening Implication ($\to$). If you lose Modus Ponens, you break standard production rule engines.

  #### R4: Disjunctive Syllogism (DS) Handling
  *   **Specification:** Explicitly define validity for $\{A \lor B, \neg A\} \vdash B$.
  *   **Case:** **Exception Handling.** Logic: `Mode is (Safe OR Unsafe)`. Fact: `Mode is NOT Safe`. Inference: `Mode is Unsafe`.
  *   **Constraint:** In many paraconsistent logics, DS fails. If `Safe` is both true and false (a "glut"), then `NOT Safe` is also true, but it doesn't eliminate `Safe`, so you cannot conclude `Unsafe`. You must decide if this inference is mandatory or optional.

  #### R5: Curry's Paradox Resistance
  *   **Specification:** The system must not derive arbitrary $Q$ from a self-referential sentence $C$ defined as $C \leftrightarrow (C \to Q)$.
  *   **Case:** **Recursive Metadata.** If your system allows rules to reference their own validity or status (e.g., "This rule is active only if this rule is active"), Curry's paradox allows deriving any conclusion without using negation.
  *   **Constraint:** Blocking Curry often requires restricting **Contraction** ($A \to (A \to B) \vdash A \to B$) or Modus Ponens. This is distinct from R1 (which handles negation).

  #### R6: Liar Paradox Handling
  *   **Specification:** The system must assign a semantic value to $L \leftrightarrow \neg L$ without crashing or trivializing.
  *   **Case:** **Self-Referential Data.** Similar to Curry, but uses negation. If your system ingests statements about truth values (e.g., validation flags), it may encounter logical loops.
  *   **Constraint:** Requires a semantics that allows truth-value **gluts** (True and False) or **gaps** (Neither).

  #### R7: Computability / Decidability
  *   **Specification:** The relation $\Gamma \vdash Q$ must be decidable within bounded time/space resources.
  *   **Case:** **Service Level Agreements (SLAs).** A logic is useless if checking validity is undecidable or EXPTIME-complete.
  *   **Constraint:** Many paraconsistent logics (especially Relevant Logics) have high computational complexity or lack efficient proof procedures.

  ---

  ### 2. Incompatibilities (The Trade-Off Matrix)

  You cannot satisfy all the above requirements simultaneously. This is not an implementation bug; it is a mathematical feature of the landscape.

  **Conflict A: Non-Explosiveness (R1) vs. Disjunctive Syllogism (R4)**
  *   **The Issue:** In standard semantics, if you allow $P$ and $\neg P$ to be true simultaneously (to block Explosion), then $P \lor Q$ is true (because $P$ is true). $\neg P$ is also true. If DS holds, you infer $Q$. Since $Q$ is arbitrary, you have recovered Explosion.
  *   **The Trade-off:** To keep R1, you usually must sacrifice R4.
  *   **Engineering Impact:** You cannot rely on `if (A or B) and (not A) then B` in the presence of contradictions. You must code around this or accept that some inferences will be blocked.

  **Conflict B: Modus Ponens (R3) vs. Curry's Paradox Resistance (R5)**
  *   **The Issue:** Curry's paradox derives $Q$ from $C \leftrightarrow (C \to Q)$ using only Modus Ponens and Contraction ($A \to (A \to B) \vdash A \to B$). It does not use negation.
  *   **The Trade-off:** To block Curry while keeping Modus Ponens, you must restrict Contraction. This means you cannot freely reuse assumptions in a proof.
  *   **Engineering Impact:** This breaks standard optimization in rule engines where a fact is used multiple times. It complicates the proof search algorithm significantly.

  **Conflict C: Classical Recovery (R2) vs. Paraconsistent Semantics**
  *   **The Issue:** If you use a 3-valued logic (True, False, Both) to handle contradictions, you must ensure that when "Both" is never used, the truth tables collapse exactly to classical 2-valued tables.
  *   **The Trade-off:** Some paraconsistent logics (e.g., certain Relevant Logics) validate fewer tautologies than Classical Logic even in consistent contexts.
  *   **Engineering Impact:** You may need to refactor existing rules that rely on classical tautologies (e.g., $P \to (Q \to P)$) which might fail in stricter logics.

  ---

  ### 3. The Killer Requirement

  **Requirement:** **Disjunctive Syllogism (R4)**

  **Why it eliminates the most candidates:**
  If you demand **Non-Explosiveness (R1)** (which is the point of the project) AND you demand **Disjunctive Syllogism (R4)**, you eliminate the two most implementable families of paraconsistent logic:
  1.  **LP (Logic of Paradox):** Simple 3-valued semantics (True, False, Both). Easy to implement. **Fails DS.**
  2.  **K3 (Strong Kleene):** 3-valued semantics (True, False, Gap). **Fails DS** and some classical tautologies.

  To satisfy both R1 and R4, you are forced into **Relevant Logics** (e.g., $R$, $E$).
  *   **The Cost:** Relevant logics require tracking the *usage* of premises (to ensure the antecedent is actually "used" to derive the consequent). This destroys the simplicity of standard truth-table evaluations or resolution theorem proving. The computational complexity jumps significantly, and efficient solvers are rare compared to SAT solvers for Classical Logic.

  **Engineering Verdict:**
  If you can tolerate losing Disjunctive Syllogism, you can use **LP**, which is computationally cheap and easy to integrate. If you *must* have DS, you are committing to a significantly more complex reasoning engine (Relevant Logic) with higher maintenance costs.

  ---

  ### 4. Settled vs. Contested

  Do not treat the following as philosophical opinions. Treat them as risk assessments.

  #### Settled (Consensus among Logicians)
  1.  **Classical Logic Explodes:** It is a theorem that in CL, $\{P, \neg P\} \vdash Q$. There is no workaround within CL.
  2.  **Paraconsistent Logics Exist:** There are formal systems (LP, Relevant Logic, Adaptive Logic) where $\{P, \neg P\} \nvdash Q$. They are mathematically coherent.
  3.  **DS Fails in Simple Paraconsistent Logics:** In any logic that uses a simple "truth-value glut" semantics (like LP) to block explosion, Disjunctive Syllogism is invalid. This is a proven semantic result.
  4.  **Curry Requires Implication Restrictions:** Blocking Curry's paradox cannot be done by negation rules alone; it requires modifying Implication rules (Contraction or MP).

  #### Contested (Active Dispute)
  1.  **The "Correct" Logic:** There is no consensus on which paraconsistent logic is the "true" logic of reasoning. Some argue LP is too weak (loses DS); others argue Relevant Logic is too complex.
  2.  **Interpretation of "Both":** In LP, a statement can be True and False.
      *   *Dialetheist view:* Contradictions are sometimes reality (e.g., legal loopholes, semantic paradoxes).
      *   *Epistemic view (Engineering friendly):* "Both" is just a flag meaning "Conflicting Source Data." It is not ontological truth.
      *   *Risk:* If you treat "Both" as merely epistemic, you might be tempted to "clean" the data immediately. If you treat it as ontological, you must propagate it. The logic doesn't care, but your data governance policy must.
  3.  **Recovery of DS:** Some logicians claim DS can be recovered in Relevant Logics via complex mechanisms (e.g., "disjunctive syllogism is admissible but not a rule"). For an engineer, "admissible but not a rule" often means "you can't implement it as a simple inference step." This distinction is often glossed over in literature but matters for implementation.

  ### Summary Recommendation

  1.  **Adopt LP (Logic of Paradox)** if your priority is **implementation speed** and **Classical Recovery**. Accept that **Disjunctive Syllogism** will fail. You will need to audit rules that rely on `A or B; not A; therefore B`.
  2.  **Adopt a Relevant Logic** only if **Disjunctive Syllogism** is non-negotiable for your business logic. Be prepared for higher computational costs and a lack of off-the-shelf solver tooling.
  3.  **Do not attempt to fix this in Classical Logic.** Wrappers, priority flags, or "last-write-wins" strategies are not logic; they are data-cleaning heuristics. They will fail when contradictions are circular or multi-hop.

  **Immediate Action:** Run a static analysis on your existing rulebase. Count how many rules rely on Disjunctive Syllogism. If the count is low, LP is your spec. If the count is high, you have a major refactoring project regardless of the logic you choose.
