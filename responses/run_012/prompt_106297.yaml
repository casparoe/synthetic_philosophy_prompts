      *   **Requirements for each reading:**
          1.  Precise claim (ontology of "the people," nature of "will," implications).
          2.  Status (trivial, substantive/defensible, false/incoherent).
          3.  Licensing power (does it actually justify ignoring the commission?).
          4.  Argumentative burden (what else is needed to get to policy?).
      *   **Specific Distinctions:** Authority vs. Right Decision, Who Counts, Idealized vs. Actual, Descriptive vs. Normative vs. Constitutive vs. Rhetorical.
      *   **Constraints:** No bibliography, no citations, no reading list. Distinguish settled vs. contested views. Identify redundancies or incoherencies.
      *   **Conclusion:** Identify the colleague's most likely meaning and evaluate its success.

  2.  **Deconstruct the Slogan ("The Will of the People"):**
      *   This is a classic concept in democratic theory (Rousseau, Sieyès, Schmitt, contemporary populism studies).
      *   It's notoriously ambiguous.
      *   I need to categorize the ambiguities systematically based on the user's prompts (ontology, normativity, epistemology, procedure).

  3.  **Brainstorming Readings (Drafting the Menu):**

      *   *Reading 1: The Aggregative/Descriptive Reading.* "The People" = current majority of voters/citizens. "Will" = expressed preference (polls, elections).
          *   Status: Defensible but thin.
          *   Licensing: Only if there *was* a vote. If it's just an assertion, it's weak.
      *   *Reading 2: The Deliberative/Normative Reading.* "The People" = the public engaging in reason. "Will" = what they would agree to under ideal conditions.
          *   Status: Substantive, hard to measure.
          *   Licensing: Hard to use to *ignore* experts, usually experts help deliberation.
      *   *Reading 3: The Constituent Power Reading.* "The People" = the sovereign entity prior to the constitution. "Will" = revolutionary/Founding authority.
          *   Status: Metaphysically ambitious, dangerous in routine politics.
