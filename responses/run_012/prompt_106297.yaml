answer: |-
  This is a classic problem in democratic theory. The phrase "the will of the people" is what we might call an *essentially contested concept*, but in political practice, it often functions as an *empty signifier*—a vessel into which different actors pour incompatible meanings to claim legitimacy. Your colleague is using it to bypass an epistocratic institution (the expert commission) in favor of a democratic claim. To evaluate this, we need to disentangle the ontology of "the people" from the epistemology of "the will."

  Here is a conceptual menu of six distinct readings of the slogan. I have arranged them from the most procedurally mundane to the most metaphysically ambitious.

  ### 1. The Empirical Aggregative Reading
  *   **The Claim:**
      *   **The People:** An aggregate of current citizens or voters.
      *   **The Will:** The sum of current, raw preferences (e.g., polling data, election results, petition signatures).
      *   **Implication:** Policy should track the statistical majority of expressed desires.
  *   **Status:** **Substantive but fragile.** It is coherent, but "current preferences" are often unstable, ill-informed, or non-existent on complex technical issues like housing zoning.
  *   **Licenses Ignoring the Commission?** **Only conditionally.** Only if there is empirical evidence (a recent vote or robust poll) showing a majority specifically wants to override the commission. If your colleague is merely *asserting* this without data, the claim is false.
  *   **Argumentative Burden:** The colleague must produce evidence of the preference. They cannot assume that because they won a faculty vote or a city council seat, they represent the aggregate will on *this specific issue*. They must bridge the gap between "I represent the people" and "The people want X."

  ### 2. The Procedural Authorization Reading
  *   **The Claim:**
      *   **The People:** The electorate acting through established constitutional or legal channels.
      *   **The Will:** The output of legitimate decision-making procedures (e.g., a City Council vote, a referendum).
      *   **Implication:** The "will" is whatever the authorized institution decides.
  *   **Status:** **Defensible and stable.** This is the standard liberal-democratic view. It avoids metaphysical speculation about what the people "really" want.
  *   **Licenses Ignoring the Commission?** **Yes, but trivially.** If the City Council has the legal authority to override the commission, then the Council's vote *is* the will of the people. The slogan adds nothing. It simply restates that the Council has the legal power.
  *   **Argumentative Burden:** None, provided the procedure is followed. However, this reading makes the slogan redundant. It reduces to: "We have the legal authority to do this."

  ### 3. The Deliberative Common Good Reading
  *   **The Claim:**
      *   **The People:** A community of reasoners engaged in public discourse.
      *   **The Will:** What citizens would agree to under conditions of free, equal, and informed deliberation (not necessarily what they currently want).
      *   **Implication:** Policy should aim at the common good as discovered through debate, not just preference aggregation.
  *   **Status:** **Normatively attractive, epistemically demanding.** It distinguishes between "what I want" and "what is right for us."
  *   **Licenses Ignoring the Commission?** **Likely No.** Expert commissions are usually designed to *aid* deliberation by providing facts. Ignoring experts usually suggests a failure of deliberation, not the triumph of the people's will. To use this reading, one must argue the experts are biased or that the public has already deliberated sufficiently without them.
  *   **Argumentative Burden:** High. The colleague must show that the commission's recommendation contradicts the reasoned judgment of the public, not just its raw preferences. They must prove the experts are wrong, not just unelected.

  ### 4. The Constituent Power Reading
  *   **The Claim:**
      *   **The People:** A pre-political, sovereign entity that exists prior to and above the constitution/institutions.
      *   **The Will:** A revolutionary or foundational authority that can dissolve or remake institutions at will.
      *   **Implication:** No institution (like a commission) can bind the people; the people can always reclaim their power.
  *   **Status:** **Metaphysically ambitious and dangerous.** This is the Schmittian or Sieyès view. It is coherent but treats routine policy disputes as existential constitutional moments.
  *   **Licenses Ignoring the Commission?** **Yes, aggressively.** If the commission is viewed as an illegitimate constraint on the sovereign, the sovereign can smash it.
  *   **Argumentative Burden:** Extremely high. The colleague must argue that the housing commission is an illegitimate usurpation of sovereignty, not just a body making a recommendation they dislike. Using this for routine zoning issues inflates the stakes undemocratically.

  ### 5. The Moralized Identity Reading (The Populist Reading)
  *   **The Claim:**
      *   **The People:** The "real" or "virtuous" part of the population, contrasted against a "corrupt elite."
      *   **The Will:** A moral imperative or identity claim, not necessarily a preference.
      *   **Implication:** The elite (experts, bureaucrats) are obstructing the moral truth of the people.
  *   **Status:** **Exclusionary and rhetorical.** This is the core of contemporary populism. It is not a descriptive claim but a performative one that creates a division.
  *   **Licenses Ignoring the Commission?** **Yes.** This is the specific reading that justifies ignoring experts. The experts are defined *a priori* as enemies of the people's will.
  *   **Argumentative Burden:** The burden is to define who the "real" people are and why the experts are "corrupt." It begs the question: it assumes the conclusion (the commission is illegitimate) in the premise (the people's will opposes the commission).

  ### 6. The Empty Signifier Reading (The Rhetorical Reading)
  *   **The Claim:**
      *   **The People:** An undefined audience to be mobilized.
      *   **The Will:** A placeholder for the speaker's own political agenda.
      *   **Implication:** "The will of the people" is a tool to shut down debate by claiming unassailable legitimacy.
  *   **Status:** **Cynical but analytically honest.** It admits the slogan does no conceptual work but serves a strategic function.
  *   **Licenses Ignoring the Commission?** **Yes, pragmatically.** It works by silencing opposition. If you accept the slogan, you lose the right to object.
  *   **Argumentative Burden:** None. This is not an argument; it is a power move. It relies on social pressure rather than reason.

  ---

  ### Conceptual Cross-Cuts

  To help you deploy this in the meeting, note where these readings diverge on your specific questions:

  *   **Authority vs. Right Decision:**
      *   Readings 1, 2, 4, and 6 are about **Authority** (who gets to decide).
      *   Reading 3 is about the **Right Decision** (what is actually good).
      *   Reading 5 conflates the two (procedure makes it right).
  *   **Who Counts as the People:**
      *   Readings 1 and 2 are inclusive (everyone counts).
      *   Reading 5 is exclusive (only the "real" people count; opponents are elites).
      *   Reading 4 is metaphysical (the People as a singular entity).
  *   **Actual vs. Idealized:**
      *   Readings 1 and 6 rely on **Actual** preferences (or claims thereof).
      *   Reading 3 relies on **Idealized** preferences (what we would want if rational).
      *   Reading 5 relies on **Counterfactual** power (what we could do if we rose up).

  ### Redundancies and Incoherencies

  *   **1 and 2 are often confused:** Colleagues often treat a procedural vote (2) as proof of empirical preference (1). They are not the same. A low-turnout council vote is procedural authority, but rarely empirical majority will.
  *   **3 and 5 overlap:** Constituent power (4) is often invoked to justify Procedural Authorization (2) when the procedure is contested.
  *   **6 is the shadow of 5:** When the Moralized Identity reading (5) is challenged, it often retreats into the Empty Signifier (6) ("You just don't understand the people").
  *   **Incoherence:** It is incoherent to hold Reading 3 (Deliberative) and Reading 5 (Populist) simultaneously. You cannot claim to seek the reasoned common good while simultaneously defining experts as enemies of the people.

  ### Diagnosis of Your Colleague

  **Which reading did they likely mean?**
  Your colleague almost certainly meant a hybrid of **Reading 5 (Moralized Identity)** and **Reading 1 (Empirical Aggregative)**, masquerading as **Reading 2 (Procedural Authorization)**.

  They are claiming that there is an empirical majority (1) that morally opposes the "elite" commission (5), and that this moral/empirical fact grants them the authority to act (2), even if the formal procedures regarding the commission are ambiguous.

  **Does this reading get them their conclusion?**
  **No.** Philosophically, the move is invalid for three reasons:

  1.  **The Epistemic Gap:** Unless they have polling data (Reading 1), they are asserting knowledge of the people's will that they do not possess. On complex housing issues, "the will" is rarely formed without expert input.
  2.  **The Question-Begging:** By defining the commission as opposed to the people (Reading 5), they assume the commission is illegitimate to prove it should be ignored. This is circular.
  3.  **The Category Error:** If they rely on Procedural Authorization (Reading 2), the slogan is redundant. If the City Council has the legal right to override the commission, they should say, "We have the legal authority." Invoking "the will of the people" suggests they feel their *legal* authority is insufficient and they need *extra-legal* legitimacy.

  **How to respond:**
  Ask them to select from the menu.
  *"Are you claiming we have data showing a majority opposes this (Reading 1)? Are you claiming the commission is illegitimate because it contradicts a moral identity of the 'real' citizens (Reading 5)? Or are you simply noting we have the legal vote to override them (Reading 2)? Because if it's the first, show the data. If it's the second, argue why experts aren't part of 'the people.' If it's the third, drop the slogan and cite the charter."*

  This forces them to either do the work the slogan is hiding or admit the slogan is merely rhetorical cover.
