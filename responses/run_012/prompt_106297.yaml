      *   *Reading 5: The Procedural/Institutional Reading.* "The People" = the electorate acting through established channels. "Will" = output of legitimate procedures.
          *   Status: Boring but stable.
          *   Licensing: If the procedure says override, then override. If not, then no.
      *   *Reading 6: The Rhetorical/Empty Signifier Reading.* "The People" = whoever I say it is. "Will" = my preference.
          *   Status: Incoherent as theory, honest as strategy.
          *   Licensing: It's not an argument, it's a power move.

  4.  **Refining and Categorizing (Mapping to User's Constraints):**
      *   Need to ensure I hit the specific distinctions: Authority vs. Right Decision, Who Counts, Idealized vs. Actual.
