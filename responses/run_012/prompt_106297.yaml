      *   *Menu Item 2: The Hypothetical Rational Consensus (Normative/Deliberative).* Focus on common good/ideal conditions.
      *   *Menu Item 3: The Constituent Sovereign (Metaphysical/Constitutive).* Focus on the power to create/destroy institutions.
      *   *Menu Item 4: The Moralized In-Group (Populist/Identity).* Focus on "real people" vs. "corrupt elite."
      *   *Menu Item 5: The Procedural Authorization (Legal/Institutional).* Focus on election mandates.
      *   *Menu Item 6: The Empty Signifier (Rhetorical).* Focus on political strategy.

      *   *Critique of each:* Apply the (1)-(4) structure requested.
