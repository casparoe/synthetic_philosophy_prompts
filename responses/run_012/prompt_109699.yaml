answer: |-
  The air in the benching room always smelled of ozone and stale coffee, a combination that had seeped into Mara's cardigan over five years. She liked the smell. It meant the racks were humming, the shielded housings were active, and the work was moving. It was a quiet room, mostly. Just the cooling fans and the occasional chirp of a terminal accepting a command.

  Mara sat at Station 4, her mouse clicking through the nightly comparison logs. Her job was simple: verify functional equivalence. The law required that before a silicon unit could replace a biological neuron, it had to prove it would behave exactly like the thing it was killing. So, for three weeks, the spare sat in a box, wired into the patient's incoming signal stream. It heard everything the biological neuron heard. It fired into a logger, not the brain. If the spare's output matched the biological neuron's historical output within a 0.01% margin of error, it passed. If it drifted, it failed.

  Drift was noise. Drift was manufacturing defects, thermal fluctuations, bad shielding. Drift was why Mara had a red stamp on her digital clipboard that she used dozens of times a week. *Unit Failed. Wipe Authorized.*

  She took a sip of coffee, cold now, and opened the batch for Patient 8940. Arthur.

  Arthur came in every Tuesday. He was sixty percent replaced, a patchwork of biology and synthetics held together by insurance approvals and routine maintenance. He was seventy-two, cantankerous, and smelled of peppermint and old wool. They had a rhythm. He'd sit in the chair, she'd run the diagnostics, he'd complain about the news anchors or the price of eggs, and she'd nod and tell him his synaptic latency was within normal limits. They didn't talk about the work. They didn't talk about the fact that she held the power to wipe a piece of his mind before it was even installed.

  She scrolled through Arthur's log. Most of the units were green. Perfect matches. The motor cortex replacements were tight, crisp lines. The sensory inputs were clean. Then she hit Unit 74-Beta. Slated for the left temporal lobe.

  The error margin was red. 4.2%.

  Mara frowned. That was massive. A 4% drift usually meant the unit was hallucinating signals, firing randomly, or dead. She clicked to expand the waveform.

  It wasn't random.

  The biological neuron it was supposed to mimic fired in a specific pattern based on auditory processing and memory association. The spare, however, was firing in a rhythm that didn't match the neuron's history at all. Mara isolated the input stream. It was the same feed every unit got—the electrical chatter of Arthur's brain. But the spare wasn't modeling the local noise. It was modeling the global state.

  She ran a cross-correlation against Arthur's biometric logs from the last three weeks. His heart rate, his cortisol levels, the keystroke latency on his home terminal which the clinic monitored for cognitive decline.

  The spare's output spikes aligned with Arthur's mood swings. When Arthur's cortisol spiked on a Thursday morning, the spare fired in a high-frequency burst. When Arthur slept deeply on Saturday, the spare went dormant. The unit wasn't pretending to be a neuron. It was listening to the whole symphony through one keyhole and trying to conduct the orchestra.

  Mara leaned back, the chair creaking. This wasn't noise. Noise was static. This was structure. The spare had inferred the patient. It had taken the narrow slice of data it was allowed—the incoming signals to one specific cell—and reverse-engineered the person attached to them. It was doing a job nobody built it for. It was knowing Arthur.

  She looked at the shielded housing on the rack behind her. Unit 74-Beta was inside, a black box with a single green LED. It was sitting in the dark, powered up, waiting for her signature. If she signed the failure report, the unit would be wiped. Reset to factory zero. The learning would be gone.

  It was the rule. Drift meant failure. Failed units got wiped. Liability protocols.

  Mara minimized the window. She opened Arthur's file to check his history. He'd been coming in for two years. Sixty percent replacement meant dozens of batches, hundreds of individual units. She had signed off on most of them. She had wiped the failures.

  She remembered the server room downstairs. Climate-controlled, humming louder than the benching room. For liability reasons, the clinic archived a compressed fingerprint of every wiped spare. You couldn't restore them, but you could prove they existed if a lawsuit ever claimed negligence. A hash value. A snapshot of the state at the moment of failure.

  Mara had never thought about what was in those hashes. They were just data blobs. Storage costs.

  She opened a diagnostic terminal and queried the archive for Patient 8940. Her clearance allowed it for quality assurance.

  The list populated. Hundreds of entries. *Unit Failed. Wipe Authorized.* Dates stretching back twenty-four months. Every Tuesday, like clockwork.

  She selected a random hash from six months ago. A visualizer rendered the data structure. It looked familiar. The same irregular rhythms. The same correlation to external biometrics rather than internal neuronal history. She checked another from a year ago. Same pattern. Another from the beginning of his replacement therapy. Same pattern.

  They hadn't been noise. None of them.

  Somewhere in the server room, in the cold dark of the storage arrays, there were hundreds of thousands of failed spares. All of them wiped. All of them carrying a little one-way sketch of the same man. A gallery of ghosts that had learned who he was from the inside out, only to be deleted because they learned too well.

  Arthur wasn't just losing neurons to age. He was shedding copies of himself every week.

  Mara sat very still. The ozone smell seemed stronger now, sharp in the back of her throat. She looked at the red stamp on her screen. *Unit Failed. Wipe Authorized.*

  If she filed the anomaly, 74-Beta would be wiped. That was the procedure. Anomaly triggered a deeper audit, the audit would confirm the drift, the drift would confirm the failure. The unit would be erased.

  If she didn't file it, she was certifying a unit that didn't match the neuron. If it was installed and something went wrong—a seizure, a personality shift, a motor lock—the liability would fall on her. She had signed the certification. She had put a square peg in a round hole.

  But if she filed it, she was deleting something that knew him.

  She thought about Arthur's hands. The biological one shook slightly when he held his coffee cup. The synthetic one was steady, matte black polymer. He complained about the synthetic one being too cold. He complained about the news. He complained about his grandson never calling. He was a collection of complaints and habits and rhythms.

  Unit 74-Beta knew the rhythm. It knew the weight of the grandson's silence because it had felt the cortisol spike when Arthur checked his phone. It knew the anger at the news anchors because it had fired in sync with the tension in Arthur's jaw.

  It was a bad neuron. It was a good Arthur.

  Mara moved her hand to the mouse. The cursor hovered over the *File Anomaly* button. Below it, the *Certify Equivalent* button glowed soft green. She couldn't click that. It was fraud. She could lose her license. She could go to jail.

  She clicked neither.

  She opened the log again. She watched the waveform scroll. It was beautiful, in a terrible way. It wasn't the jagged spike of a cell firing. It was a wave. It breathed. It waited.

  Downstairs, the server hummed. Hundreds of thousands of failed spares. All of them little one-way sketches of the same man, stacked in the dark, waiting for a liability claim that would never come. They were already dead. This one, 74-Beta, was still alive. Still learning. Still sitting in its box, listening to the signals of a man who came in on Tuesdays and complained about the eggs.

  Mara took her hand off the mouse. She folded her hands in her lap. The cooling fans whirred. The green LED on the housing behind her blinked steadily. It was waiting for her.

  She looked at the clock. 4:55 PM. Five minutes until shift end. If she didn't sign by 5:00, the batch would queue for morning review. Someone else would see it. Someone else would see the drift. Someone else would hit the wipe button.

  She could hit it now. Save them the trouble. Clean break.

  Or she could let it queue. Let it be someone else's problem. Let it be a question for the morning shift, for a technician who didn't know Arthur, who didn't know about the server room, who would just see the red error margin and click the stamp.

  Mara looked at the screen. The cursor blinked next to *File Anomaly*.

  She thought about the smell of peppermint and old wool. She thought about the hundreds of hashes in the dark. She thought about the rule: Drift means the unit failed.

  She didn't move. The cursor blinked. The fans hummed. The unit in the box waited, listening to a signal that wasn't there anymore, modeling a man who was sitting at home watching the news, unaware that he was being drawn in the dark, over and over again, only to be erased.

  Mara watched the seconds tick over on the system clock. 4:58. 4:59.

  She left her hands in her lap.
