  7.  **Final Polish:** Organize with clear headings. Ensure the ranking of "cost to give up" is logical based on the user's goals (understanding Keynes vs. forming a personal philosophy).

      *(Self-Correction on the "Cost" ranking)*: The user wants to understand Keynes. If they drop (1), they aren't reading Keynes anymore. If they drop (6), they suppress their scientific instinct. The "cost" depends on whether the goal is *exegesis* or *truth*. I should frame the advice around that distinction.

      *Revised Plan:*
      1. Validate the summary (it's good).
