      *   *Grammar:* Gene structure (Promoter -> Exon/Intron -> Terminator). Splicing is a rewriting rule. Context-sensitivity: Yes, alternative splicing depends on trans-factors (proteins/RNA) binding to specific sequences. This looks like a Context-Sensitive Grammar (CSG) or an Indexed Grammar, not just Context-Free.
