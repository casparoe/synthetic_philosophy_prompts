          *   *Purpose/Teleology:* "Error" implies a normative standard. In coding theory, error is deviation from the sent message. In biology, "error" is often deviation from *function*. A mutation might be faithfully transmitted (no channel error) but functionally deleterious (semantic error).
          *   *Context:* In formal languages, context is part of the derivation rules. In biology, context includes 3D chromatin structure, metabolite concentrations, etc., which are dynamic state variables not fully encoded in the string.
