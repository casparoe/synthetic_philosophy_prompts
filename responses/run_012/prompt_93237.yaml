answer: |-
  Here is an audit of the wave analogy as proposed by your reading group member.

  ### 1. Explicit Correspondence
  To evaluate the analogy, we must first fix the mapping between the source domain (fluid dynamics) and the target domain (mereology).

  | Source Domain (The Wave) | Target Domain (Composition) |
  | :--- | :--- |
  | **Water Molecules** | **Mereological Simples** (atoms, point-particles, tropes) |
  | **The Body of Water** | **The Plurality of Simples** (or Spacetime) |
  | **The Wave** | **The Composite Object** (table, person, cat) |
  | **Wave Height/Shape** | **Macroscopic Properties** (mass, color, function) |
  | **Wave Persistence** (passing the buoy) | **Diachronic Identity** (persistence through part replacement) |
  | **Wave Interference** | **Causal Interaction** (collision, bonding, repulsion) |
  | **Energy in Transit** | **Form/Structure/Arrangement** |

  ### 2. Where the Mapping Holds
  The analogy is rhetorically powerful because it captures three intuitive features of composite objects that strict nihilism struggles to explain away:

  *   **Supervenience without Redundancy:** Just as wave facts (height, speed) supervene on water facts (molecular position/momentum) without requiring "extra stuff," composite facts supervene on simple facts. This supports the claim that composites are not *fundamental* additions to the ontology.
  *   **Flow Identity:** The wave persists despite total turnover of its constituent molecules. This maps neatly onto biological organisms or ships of Theseus cases, where material constitution changes but the object remains.
  *   **Salience:** We individuate waves based on salient patterns (a breaker vs. a ripple). This supports the idea that composition might be interest-relative or conceptual, rather than a brute metaphysical fact.

  ### 3. Where the Mapping Breaks (The Quiet Imports)
  The analogy imports metaphysical baggage that undermines the member's specific conclusion (that the SCQ has "no fact of the matter").

  **A. The Substrate Problem**
  *   **The Break:** Water molecules are not simples. They are themselves composite structures held together by electromagnetic forces.
  *   **The Import:** The analogy presupposes a level of reality (the water) that is already unified. If the "simples" in our target domain are truly simple (lacking parts), they lack the internal cohesion of water molecules. If the "medium" is just a scattered plurality, there is no continuous substrate to support the "wave." The analogy smuggles in a **priority monism** (the whole water is prior) or at least assumes the simples are already "sticky," which begs the question against the nihilist who thinks simples are entirely discrete.

  **B. Process vs. Substance**
  *   **The Break:** A wave is fundamentally a *process* or an *event* (energy transfer), not a *substance*. A table is typically categorized as a substance.
  *   **The Import:** By modeling objects as waves, the proponent shifts the ontology from **Endurantism** (objects are wholly present at times) to **Perdurantism** (objects are space-time worms or processes). This settles a different metaphysical debate in passing. If composites are waves, they are four-dimensional processes. Many restricted compositionists argue for 3D substances. The analogy rules out their position by fiat.

  **C. Derivative Reality vs. Non-Existence**
  *   **The Break:** In physics, waves are *real*. They are measurable, predictable, and distinct from random noise. The proponent claims the analogy shows composites are "not further things," implying they don't *really* exist (nihilism) or that existence is trivial (universalism).
  *   **The Import:** The wave analogy actually supports **Ontological Deflationism**, not Nihilism. A wave is not an "extra entity" *over and above* the water, but it is not *nothing*. It is a real, derivative pattern. The nihilist says "There are no tables." The wave analogy suggests "There are tables, but they are lightweight/derivative." This contradicts the claim that the quarrel is a "distinction without a difference." There is a difference between "nothing exists" and "only derivative patterns exist."

  ### 4. The Causal Work Problem
  You noted that waves erode cliffs. This is the most damaging break for the proponent's inference.

  *   **The Inference:** "A wave is not an extra entity" $\rightarrow$ "There are no composite objects."
  *   **The Counter:** If waves are not extra entities, why do they do causal work that individual molecules (in random motion) do not? A single water molecule does not erode a cliff; the *wave* does.
  *   **The Implication:** If composites are like waves, they must have **causal efficacy**. If they have causal efficacy, then eliminative nihilism (the view that only simples exist and do all the causing) faces the **Causal Exclusion Problem**. If the simples do all the work, the wave is an epiphenomenon. But waves *are not* epiphenomenal; they move boats.
  *   **Audit Result:** The analogy undermines the nihilist conclusion. It suggests that if composites exist (as waves do), they must be causally potent. If they are causally potent, they cannot be merely "verbal" or "no fact of the matter." There must be a fact of the matter about which patterns have causal power. This actually leans toward **Restricted Composition** (only causally integrated patterns compose), not the claim that Universalism and Nihilism are equivalent.

  ### 5. Verdict on the Conclusion
  Does the conclusion survive? **No.**

  The proponent concludes: *Therefore, there is no fact of the matter about when composition occurs (Universalism and Nihilism are verbal variants).*

  The analogy supports: *Therefore, composition occurs when there is a stable, causally integrated pattern (Restricted Composition), and such objects are real but ontologically derivative.*

  The wave analogy fails to support the "no fact of the matter" claim because waves are not arbitrary. Not every disturbance in water is a "wave" in the meaningful sense (some is just thermal noise). Physicists can distinguish a wave from noise based on energy coherence. If composites are like waves, there *is* a fact of the matter: composition occurs when the arrangement achieves sufficient coherence/stability. This validates the Restricted Compositionist, not the deflationist who thinks the debate is merely verbal.

  ### 6. A Better Analogy for Restricted Composition
  If the goal is to defend **Restricted Composition** (some things compose, others don't) without falling into the "process" trap of the wave, a better analogy is **Chemical Bonding**.

  **The Mapping:**
  *   **Atoms** $\rightarrow$ **Simples**
  *   **Proximity/Contact** $\rightarrow$ **Spatio-temporal nearness**
  *   **Chemical Bond** $\rightarrow$ **Composition Relation**
  *   **Molecule** $\rightarrow$ **Composite Object**
  *   **Random Gas Mixture** $\rightarrow$ **Uncomposed Plurality**

  **Why it does the work the wave does not:**
  1.  **Discreteness:** Unlike waves, bonds are discrete. Either a bond exists or it doesn't. This captures the intuition that composition is not vague (a major concern in SCQ).
  2.  **Emergence without Mystery:** A water molecule has properties (wetness, liquidity) that Hydrogen and Oxygen gases lack. This justifies counting the molecule as a "further thing" without denying the reality of the atoms. It avoids the "nothing over and above" deflationism that leads to the "no fact of the matter" error.
  3.  **Restriction:** Not every arrangement of atoms composes a molecule. Random proximity (a gas) is not composition. This directly counters Universalism (everything composes) without resorting to Nihilism (nothing composes).
  4.  **Substance:** Molecules are treated as substances, not processes. This aligns better with our ordinary ontology of tables and chairs than the wave analogy does.

  **Summary for the Group:**
  The wave analogy is an excellent argument for **Perdurantist Ontological Deflationism** (objects are real but derivative processes). It is a poor argument for the claim that the Special Composition Question is verbal or lacks a fact of the matter. By importing causal efficacy and pattern stability, the wave analogy inadvertently provides the criteria the Restricted Compositionist needs to say "Yes, composition happens, but only here, not everywhere."
