prompt: |-
  A metaphysics reading group I sit in on has spent several sessions circling the special composition question — when, if ever, do some things compose a further thing, so that there is some one object of which they are the parts? One member proposes to settle it by analogy with a wave. A wave, he says, is nothing over and above the water: no extra entity arrives at the shore beyond the molecules that move there. Yet we speak the truth when we say the wave is three feet high, that it broke early, that it is the same wave that passed the buoy an hour ago even though none of its original molecules remain. Composition is like that, he concludes: 'composite objects' are patterns we trace in what is really just an arrangement of simples, not further things that come into being when the arrangement is right. Hence the special composition question has no fact of the matter to answer, and the standing quarrel between the universalist (everything composes) and the nihilist (nothing does) is a dispute over a distinction without a difference.

  I want an audit of the analogy, not a verdict on the debate. Set out the correspondence explicitly — what plays the role of the molecules, of the medium, of the wave itself, of the wave's height, of its identity across the buoy, of its interference with a second wave. Then say where the mapping holds and where it breaks, and which of the breaks matter for the use to which the analogy is being put. I am especially concerned with what the wave picture quietly imports that the target may lack: a wave is a form imposed on a substrate that is itself already a composite, it is defined by energy in transit rather than by any intrinsic unity, and the 'real but derivative' status we readily grant it is not obviously the same as the nihilist's 'not a thing at all.' Note also that waves interfere and erode cliffs — that they do causal work — and ask what that does to the inference from 'a wave is not an extra entity' to 'there are no composite objects.' Finally: does his conclusion — no fact of the matter about when composition occurs — survive the disanalogies, or does the analogy support only the weaker claim that composites are real but thin? And if there is a better analogy for the restricted compositionist's position, name it and say why it does the work the wave does not.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A metaphysics reading group discussing the Special Composition Question (SCQ).
      *   **Proposal:** A member uses a *wave analogy* to argue for a deflationary view (composition is just pattern-tracing, no fact of the matter, universalism vs. nihilism is verbal).
      *   **Task:** Audit the analogy (not verdict on the debate).
      *   **Specific Requirements:**
          1.  Set out the correspondence explicitly (molecules, medium, wave, height, identity, interference).
          2.  Analyze where the mapping holds and breaks.
          3.  Identify which breaks matter for the argument's purpose.
          4.  Address "quiet imports" (substrate compositeness, energy vs. unity, derivative reality vs. nihilism).
          5.  Address causal work (waves erode cliffs) and its impact on the inference to "no composite objects."
          6.  Evaluate the conclusion (no fact of the matter vs. composites are real but thin).
          7.  Suggest a better analogy for the *restricted compositionist* if applicable.

  2.  **Deconstruct the Wave Analogy (The Mapping):**
      *   *Target Domain:* Mereology/Metaphysics of Composition.
      *   *Source Domain:* Fluid Dynamics/Waves.
      *   *Mappings:*
          *   Water molecules $\rightarrow$ Mereological simples (atoms, point-particles).
          *   The Body of Water (Medium) $\rightarrow$ The spacetime manifold or the "plurality of simples."
          *   The Wave $\rightarrow$ The Composite Object (e.g., a table, a person).
          *   Wave Height/Shape $\rightarrow$ Properties of the composite (mass, shape, function).
          *   Wave Identity (passing the buoy) $\rightarrow$ Persistence/Identity over time (despite part replacement).
          *   Wave Interference $\rightarrow$ Causal interaction between composites.

  3.  **Evaluate the Mapping (Holds vs. Breaks):**
      *   *Holds:*
          *   Supervenience: Wave facts supervene on water facts; composite facts (allegedly) supervene on simple facts.
          *   Part Replacement: Waves persist despite molecule change; organisms persist despite cell change.
          *   Deflationary Ontology: We don't count waves *plus* water; similarly, perhaps we shouldn't count composites *plus* simples.
      *   *Breaks:*
          *   Substrate Status: Water is already composite (H2O molecules). Simples are supposed to be *simple*.
          *   Process vs. Object: A wave is an event/process (energy transfer); a table is usually conceived as a substance/object.
          *   Causal Power: Waves clearly do work (erosion). If composites are "just patterns," do they do work? (The exclusion problem).
          *   Vagueness: Wave boundaries are fuzzy, but SCQ debates often hinge on precise ontological commitment.

  4.  **Analyze "Quiet Imports" (The Hidden Baggage):**
      *   *Substrate:* Water is a continuous medium or at least a collection of particles. If the "medium" of reality is already composite, the analogy begs the question against strict nihilism.
      *   *Energy/Process:* Waves are dynamic. Most composites (rocks, chairs) are treated as static substances.
      *   *Reality Status:* The proponent says "not a further thing." But waves are *real* in physics. They aren't illusions. This supports *ontological deflationism* (composite facts are real but not fundamental) rather than *nihilism* (composites don't exist). This undermines the claim that universalism/nihilism is a "distinction without a difference." It actually sounds like *organic unity* or *priority monism* or *Hirsch-style quantifier variance*.

  5.  **Address Causal Work:**
      *   Waves erode cliffs. This is causal efficacy.
      *   If composites are like waves, they should have causal efficacy.
      *   If they have causal efficacy, can we say they are "nothing over and above" without triggering causal exclusion? (If the simples do all the work, what is left for the wave/composite to do?)
      *   The inference "Wave is not extra entity $\rightarrow$ No composite objects" is shaky. A better inference is "Wave is not extra entity $\rightarrow$ Composites are not *fundamental* entities."

  6.  **Evaluate the Conclusion:**
      *   Proponent's Conclusion: No fact of the matter (Nihilism and Universalism are the same).
      *   Analogy's Support: The analogy supports *Ontological Deflationism* or *Quasi-Nihilism* (Composites exist but are ontologically lightweight).
      *   Does it support "No fact of the matter"? Not really. It supports "The fact of the matter is that composites are derivative." Universalism says *every* arrangement composes. Nihilism says *none* do. The wave analogy says *some* patterns are salient (waves) but not all ripples are named waves. This actually leans toward *Restricted Composition* (only stable/salient patterns count), contradicting the proponent's claim that the quarrel is verbal.
      *   Actually, the wave analogy is often used for *Perdurantism* or *Stage Theory*, or *Hirsch's Quantifier Variance*. It suggests existence is a matter of conceptual carving.
      *   Crucial Point: The analogy undermines the "No fact of the matter" claim by suggesting there *is* a fact: composites are derivative patterns. It doesn't make Universalism and Nihilism identical; it makes them both slightly wrong (or right, depending on quantifier interpretation).

  7.  **Find a Better Analogy for Restricted Composition:**
      *   The Wave analogy is actually good for *Universalism* (any disturbance is a wave) or *Nihilism* (only water exists).
      *   For *Restricted Composition* (only *some* things compose), we need an analogy where only *specific* arrangements count as a new unit.
      *   *Idea:* A **Lock and Key** or **Molecule/Bond**. Only specific configurations create a stable bond.
      *   *Idea:* **Software/Code**. Bits exist, but only specific arrangements constitute a "program." Random noise isn't a program.
      *   *Idea:* **Constellations**. Stars exist. Orion exists only relative to an observer? No, that's anti-realist.
      *   *Idea:* **Chemical Compounds**. Hydrogen + Oxygen $\rightarrow$ Water. Not every mixture is a compound. This captures *emergence* and *restricted conditions*.
      *   *Selection:* **Chemical Bonding/Molecules**. It captures the "something new" (emergent properties) vs. "just atoms" tension, and clearly distinguishes between a random mixture (no composition) and a bonded molecule (composition).

  8.  **Drafting the Response:**
      *   *Tone:* Analytical, precise, philosophical but accessible (reading group context).
      *   *Structure:*
          1.  Explicit Correspondence Table.
          2.  Where the Mapping Holds.
          3.  Where the Mapping Breaks (The "Quiet Imports").
          4.  The Causal Work Problem.
          5.  Verdict on the Conclusion (No Fact of the Matter vs. Derivative Reality).
          6.  Alternative Analogy (Chemical Bonding).

      *(Self-Correction during drafting)*: Be careful not to solve the SCQ. Stick to auditing the analogy. Ensure I address the specific prompt points about "energy in transit" and "substrate compositeness."
      *Refining the "No Fact of the Matter" point:* The proponent claims the analogy shows the debate is verbal. But if waves are real patterns, then there *is* a fact about which patterns are stable enough to be tracked. This might actually support Restricted Composition (only stable waves count), not the claim that Universalism = Nihilism. I need to highlight this tension.

      *Refining the Causal Point:* If waves erode cliffs, they are causally potent. If composites are like waves, they are causally potent. If they are causally potent, eliminative nihilism (nothing but simples) struggles to explain the causation without overdetermination. This weakens the nihilist reading of the analogy.

      *Refining the Alternative:* Why is Chemical Bonding better? Because it distinguishes between *contact* (universalism) and *bonding* (restriction). A wave is continuous; a bond is discrete.

  9.  **Final Polish:** Check against all constraints in the prompt.
      *   Audit, not verdict? Yes.
      *   Explicit correspondence? Yes.
      *   Holds/Breaks? Yes.
      *   Quiet imports (substrate, energy, derivative status)? Yes.
      *   Causal work? Yes.
      *   Conclusion survival? Yes.
      *   Better analogy? Yes.

