          *   *Theory:* Refer to the "fiction" of intention. MPs don't have a collective mind.
          *   *Key Case/Concept:* *R (Evans) v Attorney General* or Lord Hoffmann's speeches. The idea that Parliament is "reasonable" is a legal construct.

      *   **2. The Presumptions (Legality, Retrospectivity, etc.):**
          *   Explain *why* courts do this. It's about the constitutional relationship between courts and Parliament.
