answer: |-
  This is one of the most sophisticated questions you can ask in statutory interpretation, and it cuts right to the heart of the tension between **Parliamentary Sovereignty** and the **Rule of Law**. You have correctly identified that the judicial rhetoric ("we are just finding Parliament's intention") often masks a normative practice ("we are imposing constitutional standards on how Parliament must speak").

  Here is a breakdown of what the practice actually presupposes, based on dominant public law theory and case law (primarily in the UK context, given your references to Parliament and sovereignty).

  ### 1. What does "Legislative Intention" presuppose?
  **It is a normative attribution, not a psychological fact.**

  When a judge says, "Parliament cannot have intended this absurd result," they are not making a claim about the state of mind of the MPs who voted on the bill. As a matter of fact, MPs often haven't read the bill, or they have conflicting motives, or they simply didn't think about the specific edge case before the court.

  *   **The Fiction:** "Legislative intention" is a legal construct. It is an **imputed intention**.
  *   **The Presupposition:** The practice presupposes that Parliament is a **rational, constitutional actor**. The courts attribute to Parliament an intention to act consistently with the Rule of Law, international obligations, and fundamental rights.
  *   **Why?** If courts treated intention as a psychological fact, they would be paralyzed. They would have to dive into *Hansard* (parliamentary records) to guess what MPs were thinking, which the courts generally refuse to do (see *Pepper v Hart* restrictions). Instead, they ask: "What is the most reasonable meaning to attribute to a sovereign legislature in a constitutional democracy?"

  So, to answer your specific question: It is a norm about what we are **entitled to attribute** to them, not a claim about what they really had in mind.

  ### 2. Is the "Reasonable Legislature" a moral constraint or a rule of thumb?
  **It is a constitutional norm (a moral/legal constraint).**

  This is best illustrated by the **Principle of Legality** (articulated famously by Lord Hoffmann in *R v Secretary of State for the Home Department, ex p Simms*).

  *   **The Rule:** Parliament can override fundamental rights, but it must do so in "clear, unambiguous language." General words will not suffice.
  *   **The Justification:** Courts often frame this as "Parliament wouldn't have meant to infringe rights without saying so."
  *   **The Reality:** This is a **clear statement rule**. It is a procedural hurdle imposed by the courts on the legislature. It presupposes that Parliament *ought* to be reasonable. It forces the political cost of infringing rights to be high (by requiring explicit debate on the specific infringement) rather than allowing it to happen by accident through broad drafting.

  If this were just a "sensible rule of thumb," courts would abandon it when the text seemed slightly ambiguous. But they don't. They strain the text to avoid the breach of rights. This suggests it is a **moral constraint derived from the Rule of Law**, which the courts see themselves as guardians of.

  ### 3. Is this consistent with Textualism or Purposivism?
  **The practice is quietly purposive (specifically, "Common Law Constitutionalism").**

  *   **Strict Textualism:** A strict textualist (like the late Justice Scalia in the US, though even he had nuances) would say: "If the ordinary meaning of the words covers the situation, that is the law. It doesn't matter if it's harsh, absurd, or breaches international law. Parliament can fix it."
  *   **The UK Practice:** The UK courts are **not** strict textualists. They are **contextual purposivists**. They look at the text, but they read the text in light of the "legal context," which includes human rights, international law, and common law constitutional principles.
  *   **The Tension:** The courts *claim* to be textualists (to respect sovereignty) but *act* as purposivists (to protect rights).
      *   When they say "Parliament is sovereign, so if the words are clear we must obey," they are bowing to **Textualism/Sovereignty**.
      *   When they say "We must read this down to avoid absurdity/breach of rights," they are engaging in **Purposivism/Normative Interpretation**.

  The practice presupposes that the "purpose" of legislation is never just the literal goal (e.g., "stop prisoners talking"), but that goal constrained by constitutional norms ("...but not in a way that stops them accessing justice").

  ### 4. What would change if we swapped to a Strict Textualist view?
  If the courts adopted a strictly textualist approach (abandoning the presumptions of intention unless the text explicitly codified them), the legal landscape would shift dramatically:

  1.  **Erosion of Rights:** Fundamental rights would be more vulnerable. A minister could use a broadly worded regulation (e.g., "The Secretary of State may make rules for the management of prisons") to suppress free speech or access to lawyers. Under the current *Simms* principle, this is invalid. Under strict textualism, if "rules for management" linguistically covers "censoring mail," it would be valid.
  2.  **International Law:** UK courts would ignore international treaties much more readily. Currently, there is a presumption that Parliament does not intend to breach international law. A textualist would say, "If the Act contradicts the Treaty, the Act wins, regardless of how general the words are."
  3.  **Retrospectivity:** Laws would more easily operate retrospectively. Currently, there is a strong presumption against retrospectivity. A textualist would apply the law as written, even if it punished past conduct, unless the Act explicitly said "this applies prospectively."
  4.  **Drafting Style:** Parliamentary drafters would have to change. Currently, they rely on the courts to "read down" general words to make them constitutional. If courts became textualist, drafters would have to list every single exception and right-protection explicitly in the bill. Bills would become much longer and more complex.
  5.  **Political Accountability:** Paradoxically, strict textualism might increase political accountability. Currently, Ministers can hide behind vague language, knowing the courts will fix the human rights issues. If the courts refused to fix them, Parliament would be forced to vote on the specific, harsh measures explicitly.

  ### Summary for your Module
  To synthesize this for your studies:

  *   **The Doctrine:** The courts use "Legislative Intention" as a **doctrinal vehicle** to mediate between Sovereignty and the Rule of Law.
  *   **The Presupposition:** It presupposes a **normative model of Parliament** (reasonable, rights-respecting) rather than a factual one.
  *   **The Method:** It is **not consistent with strict textualism**. It is a form of **common law constitutionalism** where the courts set the "rules of the game" for how Parliament must legislate if it wishes to achieve certain outcomes.
  *   **The "Shrug":** When the courts say "if the words are clear enough, we must obey," they are acknowledging the **ultimate political fact** of sovereignty. They can interpret, but they cannot strike down primary legislation (unlike the US). The "clear statement rule" is their way of saying: "We will protect rights, but if you force our hand with crystal clear language, we will step aside."

  **Key Cases to Cite:**
  *   *R v Secretary of State for the Home Department, ex p Simms* [2000] (The Principle of Legality).
  *   *R (Evans) v Attorney General* [2015] (The tension between judicial interpretation and executive veto).
  *   *Anisminic Ltd v Foreign Compensation Commission* [1969] (Reading down ouster clauses to preserve access to courts).
  *   *Benham v United Kingdom* / *R v Secretary of State for the Home Department, ex p Brind* (International law presumptions).

  You are essentially spotting the difference between **Positivism** (Law is what is written) and **Dworkinian/Common Law Constitutionalism** (Law is what is written *plus* the moral principles that best justify it). The courts pretend to be the former while practicing the latter.
