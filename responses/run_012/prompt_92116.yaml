      *   **Core Problem:** They perceive a tension/contradiction in judicial reasoning. Courts claim to apply Parliament's will (sovereignty/textualism) but frequently modify meaning based on presumptions (non-retrospectivity, compliance with international law, avoidance of absurdity, protection of rights) unless words are "crystal clear."
      *   **Key Questions:**
          1.  What does the practice presuppose about legislative intention? (Psychological fact vs. normative attribution?)
          2.  Does it presuppose a reasonable legislature? (Moral constraint vs. rule of thumb?)
