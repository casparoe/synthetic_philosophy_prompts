          4.  What would change if we switched to strict textualism?

  2.  **Deconstruct the Legal Theory:**
      *   **The "Intention" Fiction:** In modern UK statutory interpretation (and many common law jurisdictions), "legislative intention" is widely acknowledged by theorists (and increasingly by judges) as a construct, not a psychological fact. MPs vote on texts, not shared mental states.
      *   **The Presumptions:** The user lists classic common law presumptions (legality, non-retrospectivity, compliance with international law). These are *normative* principles applied *as if* they were intentions.
      *   **Principle of Legality:** This is the big one in UK law (*Simms*, *Anisminic*, *Evans*). General words don't override fundamental rights unless expressly stated. This looks like purposivism but is often framed as intention.
      *   **Textualism vs. Purposivism:**
          *   *Textualism:* Meaning is in the words. Context matters, but external purpose is secondary.
          *   *Purposivism:* Meaning is driven by the goal of the statute.
          *   *UK Approach:* It's a hybrid. "Purposive construction" within the bounds of the text. The "Principle of Legality" is a strong normative overlay.
      *   **Parliamentary Sovereignty:** The ultimate trump card. If Parliament speaks clearly enough, the courts must obey, even if the result is "unreasonable" or breaches international law (though they will strain *not* to find that clarity).

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the question. It hits the central tension in public law theory. Validate their observation: yes, there is a gap between the rhetoric (finding intention) and the practice (imposing norms).

