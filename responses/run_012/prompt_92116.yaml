          *   *Normative vs. Rule of Thumb:* It's a constitutional norm (Rule of Law), not just a heuristic. It protects rights by raising the political cost of infringing them.

      *   **3. Textualism vs. Purposivism:**
          *   Is the current practice textualist? No, not strictly. It's "contextual purposivism" constrained by text.
          *   The "Principle of Legality" is inherently purposive/normative. It assumes a purpose of *not* infringing rights unless necessary.
          *   *Consistency:* It's inconsistent with *strict* textualism (which would say "if the words cover it, it covers it"). It aligns with a "common law constitutionalism" view.

