          6.  **Brief Evaluation:** One-line assessment of standard theories (Psychological, Animalist, Narrative, No-Self) against the spec.
      *   **Constraints:** No reading list, keep the evaluation short, focus on the spec.

  2.  **Deconstruct Hofstadter's Claim:**
      *   Claim: The "I" is a pattern (strange loop).
      *   Implication: Patterns are multiply instantiable.
      *   Conclusion: Death doesn't end the "I" if the pattern persists in others.
      *   Problem: This blurs the line between *being* someone and *remembering* someone. It challenges the uniqueness of identity (numerical identity).

  3.  **Drafting the Desiderata (The Spec):**

      *   *Category 1: Test Cases (The "Must Handles")*
          *   **Fission/Teleportation:** If I copy you, are there two of you? Hofstadter says patterns can be in multiple places. A theory needs to handle multiplicity without contradiction.
          *   **Post-Mortem Distribution:** The core Hofstadter case. Grandma dies, lives in grandkids. Theory needs to define "partial survival."
          *   **The Impostor/Caricature:** Friends remember me wrong. Is *their* version still *me*? Need a fidelity threshold.
          *   **Gradual Replacement/Ship of Theseus:** Brain cells change, memories fade. When does the pattern break?
          *   **Conjoined/Shared Cognition:** If two brains sync up, is it one loop or two?

      *   *Category 2: Conceptual Distinctions (The "Must Not Collapses")*
          *   **Numerical vs. Qualitative Identity:** This is the big one. "Same person" (one entity) vs. "Same kind of pattern" (similar entities). Hofstadter risks collapsing these.
          *   **Constitution vs. Representation:** Having my data vs. Being me.
          *   **First-Person vs. Third-Person Access:** My experience of me vs. Your model of me.
          *   **Threshold of Persistence:** How much of the pattern is enough?

      *   *Category 3: Scientific Constraints (The "Must Not Violates")*
          *   **No Homunculus:** No little man inside watching the screen.
          *   **Supervenience:** Mental states depend on physical states.
          *   **Causal Continuity:** Patterns don't just pop up; they need causal links (usually).

  4.  **Identifying the Tensions (The "Hard Choices"):**
      *   *The Big Conflict:* **Numerical Uniqueness** vs. **Pattern Multiplicity**.
          *   If the "I" is a pattern, and patterns can be in two heads, are there two "I"s?
          *   If yes, we lose Numerical Uniqueness (I am one person).
          *   If no (only one is the *real* me), we lose Pattern Multiplicity (the copy isn't me).
          *   Hofstadter wants to say "Part of me is in you." This implies *partial* numerical identity, which is logically tricky.
      *   *The Second Conflict:* **Causal Continuity** vs. **Structural Similarity**.
          *   If my friend remembers me perfectly but never met me (magic), is it me? Usually, we say no (need causal link). But if it's just a pattern, structure matters more than history.
      *   *The Third Conflict:* **First-Person Authority** vs. **Third-Person Attribution**.
          *   Grandma doesn't feel she is in me. I feel I am me. Who decides identity?

      *   *Decision:* The most critical unsatisfiable trio is:
          1.  Numerical Uniqueness (I am one distinct entity).
          2.  Pattern Multiplicity (I can exist in multiple substrates simultaneously).
          3.  All-or-Nothing Identity (Identity isn't a matter of degree).
          *   *Hofstadter sacrifices #3.* He allows "partial" survival.
