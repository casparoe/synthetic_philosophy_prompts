      *   **Key Components:**
          1.  **Test Cases:** Scenarios the theory must handle (death + pattern survival, memory loss, misrepresentation by friends, conjoined twins, fission/teleportation, etc.).
          2.  **Distinctions:** Concepts the theory must keep separate (numerical vs. qualitative identity, literal vs. metaphorical sharing, threshold of survival).
          3.  **Scientific Constraints:** Consistency with cognitive science (no homunculus, no ghost, no privileged spot).
          4.  **Rationale:** Explain *why* each item is a requirement (the intuition/case behind it).
