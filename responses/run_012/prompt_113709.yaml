  *Why it fails:* You accept the Experience Machine (4) and Fission (6), both of which are science fiction. You reject Mary's Room (2), which is physically possible (just unlikely). You accept Gettier (1), which is mundane. Realism isn't the filter.

  **Candidate 2: The Stipulation Independence Principle.**
  *Principle:* A case is legitimate only if the intuitive verdict isn't logically forced by the definitions in the setup. If the conclusion is smuggled into the premises, it's rhetoric.
  *Why it's promising:* This captures your rejection of Mary (2) ("surprise is smuggled") and Chinese Room (5) ("force comes from being told"). It explains why Gettier (1) works (the clock stopping is a fact, the lack of knowledge is your reaction).
  *The snag:* It struggles with the Experience Machine (4). The stipulation "indistinguishable" is heavy. Why is that not smuggling? Perhaps because the *verdict* ("No thanks") isn't forced by the stipulation, whereas in Mary, the "learning something new" feels forced by the "black and white room" setup. This is a strong contender.

  **Candidate 3: The Perspective-Property Lock.**
  *Principle:* First-person imaginative simulation is valid evidence only for properties that are essentially first-personal (value, identity, experience). It is invalid when used to determine third-person, systemic, or functional facts (understanding, physicalism, meaning).
  *Why it's promising:* This directly addresses your specific worry about the pair 5 vs. 6. In both, you simulate being the subject. In 6 (Fission), the target is *Identity*, which is essentially first-personal. In 5 (Chinese Room), the target is *Understanding*, which the argument treats as a systemic/functional fact. Using a first-person simulation to settle a systemic fact is a category error.
  *The snag:* It requires us to classify "Knowledge" (Gettier 1) carefully. But Gettier doesn't ask you to *be* the guy; it describes him from the outside. So it bypasses the lock.

  (b) **The Committed Principle**

  I am committing to a refined version of Candidate 3. I call it **The Mode-Object Congruence Principle.**

  **Precise Statement:**
  > A thought experiment yields legitimate philosophical evidence if and only if the *mode of access* (how you are asked to judge the case) matches the *ontological category* of the target property.
  >
  > 1. **Internal Access:** If the case asks you to simulate a first-person perspective ("Imagine you are..."), the verdict is evidence only for properties that are essentially subjective or normative (e.g., Personal Identity, Value, Rights, Phenomenal Experience).
  > 2. **External Access:** If the case describes a scenario from the third-person ("A guy glances..."), the verdict is evidence for functional, systemic, or metaphysical properties (e.g., Knowledge, Cognition, Physical Truth).
  >
  > **Failure Condition:** The experiment is rhetorical trickery if it demands Internal Access to settle an External Property, or if it uses External Stipulations to force an Internal Reaction.

  **How to apply this without me:**
  When you encounter a new thought experiment, ask two questions:
  1.  **The Demand:** Am I being asked to *feel* my way through this (simulate being the agent), or *observe* my way through this (evaluate the mechanism)?
  2.  **The Target:** Is the philosophical claim about *me/my values* (Internal), or about *the world/systems* (External)?
  If Demand = Internal and Target = External, reject the case as methodologically flawed. If they match, or if the Demand is External, the case is legitimate.

  (c) **Verdict Overturns and Tensions**

  This principle is robust, but it is not cost-free. Here is where it pressures your list:

  1.  **It validates your skepticism on 5 (Chinese Room) and 2 (Mary).**
