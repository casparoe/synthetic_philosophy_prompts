prompt: |-
  I'm a PhD student in cognitive science and I'm working on a paper about whether LLMs can be said to follow rules. My basic argument is that Kripkenstein's quus example shows any finite set of addition problems is compatible with infinitely many rules — plus, quus, whatever. So if I train a model on a dataset where all the sums are under 100, and then I give it 57+68 and it outputs 125, there's no fact of the matter about whether it's following plus or quus or some other rule. My advisor says I've got the paradox backwards. She says it's not an epistemological point about underdetermination by data, but a semantic one about what constitutes rule-following in the first place, and that Kripke's solution is about communal assertability, not about our inability to know. Now I'm definately confused. If it's not about underdetermination, why does the quus example even matter? And if it's really about the constitution of meaning, doesn't it apply equally to humans, so my whole contrast between LLMs and humans is bogus? I'd rather be told my framing is confused than get a polished answer to a bad question. Can you sort out what Kripkenstein actually shows and whether my experiment tests it at all?
reasoning: |-
