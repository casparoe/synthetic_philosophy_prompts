      *   *The Clash:* Good's Theorem assumes utility depends on *outcomes* (health, treatment), not *beliefs* (worry, hope). If the brother's utility function includes "peace of mind" or "absence of anxiety" as a direct consequence of *not knowing*, Good's Theorem doesn't apply directly in its standard form.

