  2.  **Deconstruct Good's Theorem (I.J. Good, 1967):**
      *   *Core Claim:* For a Bayesian agent making a decision, the expected utility of observing a free piece of evidence is at least as high as the expected utility of not observing it.
      *   *Key Assumptions:*
          1.  **Bayesianism:** The agent updates beliefs via conditionalization.
          2.  **Decision Maximization:** The agent chooses actions to maximize expected utility based on current beliefs.
          3.  **Costless Information:** The information itself has no direct cost (money, time, pain).
          4.  **Instrumental Value:** Information is only valuable insofar as it changes a *decision* that leads to a better *outcome*.
          5.  **State-Independent Utility (often implicit):** The utility depends on the state of the world and the action, not on the belief itself (no "news utility").

  3.  **Deconstruct "Rational Ignorance" (Downs, 1957, and others):**
      *   *Core Claim:* It can be rational to remain uninformed.
      *   *Context:* Often applied to voting (cost of learning > impact of vote) or situations where information is costly.
      *   *Extension:* Sometimes applied to emotional/psychological contexts (blissful ignorance).

  4.  **Deconstruct "Value of Information" (VoI):**
      *   *Instrumental Value:* Helps you make better choices (Good's domain).
      *   *Intrinsic Value:* You like knowing things (curiosity).
      *   *Consumption Value:* The information itself affects utility directly (e.g., happiness/sadness from the news, regardless of action).

  5.  **Address the Specific Conflict (Genetic Testing):**
      *   *User's Argument:* More info = better decisions = higher expected utility. Therefore, testing is rational.
