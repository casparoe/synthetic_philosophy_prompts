      *   Good's Theorem proves $E[U|Info] \geq E[U|No Info]$ *only if* the utility function is defined over world-states and actions, not over information states themselves.
      *   If "knowing I have the gene" causes psychological pain *independent* of any medical action I can take, that is a *cost* of information. Good's Theorem assumes costless information. If we model the psychological pain as a cost, the theorem holds (Net Value = Instrumental Value - Cost), but the Net Value can be negative.
      *   *Wait, refinement:* Good's Theorem says the *gross* value of information is non-negative. If there are costs (including psychological), the *net* value can be negative.
      *   *Deeper refinement:* In standard decision theory, "states of the world" usually exclude the agent's mental state about the world. If the agent cares about their mental state, the "state space" needs to expand. If the utility function is $U(Action, State, Knowledge)$, Good's result breaks. If it's $U(Action, State)$ and Knowledge only helps pick Action, Good's result holds.
      *   *The Brother's Case:* He likely has a utility function $U(Action, State, Knowledge)$. He gets disutility from $Knowledge = True$ (if bad news).
      *   *Conclusion:* The user is misapplying the theorem by ignoring the "cost" (psychological) or by assuming a utility function the brother doesn't have.

