answer: |-
  You have put your finger on one of the most fractious, unresolved debates in bioethics and philosophy of mind. You are absolutely right that the justifications people use ("It's the same person" vs. "The earlier person was competent") are often talked past each other, and you are also right that the "Ulysses" case (weakness of will) is structurally different from the "Dementia" case (change of value).

  Here is the carving you are looking for, the established terminology, and an analysis of why the arguments feel slippery.

  ### 1. The Names

  There is no single word that covers the whole "shape," but there are precise terms for the two sub-cases you identified.

  **The Umbrella Term: Diachronic Authority**
  This is the philosophical term for the general shape: the authority of a self at Time 1 over a self at Time 2. When people argue about this structure generally, they are debating the limits of *diachronic authority*.

  **Case A (The Website Blocker): The Ulysses Contract**
  You correctly identified this. In ethics and law, this is a **Ulysses Pact** (or Ulysses Contract). It relies on the assumption of **Preference Stability**. The future self *wants* the same thing as the past self but lacks the willpower to execute it. The binding is instrumental.

  **Case B (The Grandad): Precedent Autonomy**
  This is the specific bioethical term for the grandad's situation. It is the claim that an advance directive (the living will) holds authority based on **Precedent Autonomy**. The conflict is specifically between *Precedent Autonomy* (past self) and *Current Autonomy* (present self).

  ### 2. The Carving: Why the Justifications Clash

  You noticed the arguments come in two flavors that pull in opposite directions:
  1.  **Identity:** "It's the same person."
  2.  **Competence:** "The earlier self was the real/capable one."

  In the literature, these correspond to two distinct defenses of Precedent Autonomy. They are indeed incompatible if pushed too hard, which is why the family is tearing itself apart.

  **Defense 1: Narrative Integrity (The "Identity" Flavor)**
  *   **Proponent:** Mostly associated with the legal philosopher **Ronald Dworkin** (specifically in his book *Life's Dominion*).
  *   **The Argument:** A life is a narrative project. We have **Critical Interests** (what makes a life good as a whole, e.g., dignity, consistency, values) and **Experiential Interests** (what feels good in the moment, e.g., being cheerful, eating pudding).
  *   **The Carving:** Dworkin argues the Past Self represents the *Critical Interests* and the Present Demented Self represents only *Experiential Interests*. To let the Present Self win is to trash the narrative integrity of the whole life.
  *   **Why it fits your "Identity" flavor:** It assumes the person is a single unit of account over time. The "vote" counts double because it protects the *story* of the person, not just the *feelings* of the person.

  **Defense 2: The Capacity Threshold (The "Competence" Flavor)**
  *   **Proponent:** Standard medical law and many ethicists.
  *   **The Argument:** Autonomy requires capacity. The Past Self had capacity; the Present Self (due to dementia) does not. Therefore, the Present Self's wishes are not "autonomous wishes," they are symptoms of a pathology.
  *   **The Carving:** This treats the Present Self less like a "person with different values" and more like a "child" or a "patient" who needs protection.
  *   **Why it fits your "Competence" flavor:** It admits the selves are different in *status*. The Past Self wins not because it's the same person, but because it was the last *competent* person.

  **The Fracture:**
  The reason you feel the arguments don't fit together is that **Defense 1** requires the selves to be the *same* (to maintain narrative integrity), while **Defense 2** requires the selves to be *different* (one competent, one incompetent).
  *   If they are the same person (Defense 1), why can't the person change their mind?
  *   If they are different people (Defense 2), why does the "dead" competent self have rights over the "living" incompetent self?

  ### 3. Is there a name for the "Changed Values" problem specifically?

  Yes. It is often called **The Problem of Changed Preferences** within the literature on Advance Directives.

  However, the philosopher **Rebecca Dresser** coined a specific critique that matches your intuition perfectly. She argues against Dworkin using what is essentially the **"Then-Self vs. Now-Self"** distinction. She argues that in advanced dementia, the psychological continuity is broken so severely that the "Past Self" is effectively a stranger making decisions for a "Present Self."

  If you want a term to describe the *fallacy* of conflating the Ulysses case with the Dementia case, you could call it **The Continuity Assumption**. This is the error of assuming that because physical identity persists, psychological or volitional identity persists in a way that justifies binding.

  ### 4. What about the other cases? (Contracts, Constitutions, Army)

  You asked if the contract/constitution cases are the same phenomenon. They share the *structure* (Diachronic Authority) but they fail the *carving* because they introduce a third party.

  *   **Contracts:** When you sign a contract, you aren't just binding your future self; you are creating a **reliance interest** in someone else. If you could void the contract because your "values changed," you would be harming the *other party*. The binding force isn't just your past will; it's their current trust.
  *   **Constitutions (Dead Hand Control):** This is the political version of Precedent Autonomy. It is often criticized as **Dead Hand Control**. The justification here is usually stability and preventing tyranny of the moment, rather than individual integrity.
  *   **The Army Case:** This is a **Status Change**. By volunteering, the individual moves from the class "Civilian" (who has the right to complain) to "Soldier" (who has a duty to obey). This is less about time and more about role ethics.

  ### 5. Summary and Verdict

  To answer your specific request for a carving and a label:

  **The Label:**
  The general shape is **Diachronic Authority**.
  The specific conflict in the dementia case is **Precedent Autonomy vs. Current Welfare**.

  **The Carving:**
  1.  **Instrumental Binding (Ulysses):** Preferences are stable; willpower is variable. *Justification: Helping the self achieve its own goal.*
  2.  **Constitutive Binding (Dementia/Grandad):** Preferences are unstable; identity is contested. *Justification: Protecting the narrative integrity of the life (Dworkin) OR respecting the last competent will (Legal Standard).*
  3.  **Reliance Binding (Contracts):** Preferences are irrelevant; third-party harm is the key. *Justification: Preventing harm to others.*

  **Are the Contract and Dementia cases the same phenomenon?**
  No. They share a slogan ("You decided"), but the mechanism is different.
  *   In the **Contract**, the binding is external (enforced by the state to protect the other party).
  *   In the **Dementia** case, the binding is internal (enforced by the family to protect the "integrity" of the patient).

  **What is bugging you?**
  What is bugging you is the **Non-Identity Problem** applied to personal time. You are sensing that if the "Later Self" has genuinely different values, treating them as the "Same Self" for the purpose of obligation is a category error.

  In the grandad's case, the family is fighting because they are unknowingly switching between Dworkin's **Critical Interests** (Grandad the dignified man who didn't want to be a vegetable) and Dresser's **Experiential Interests** (Grandad the cheerful man who likes ice cream).

  If you need a phrase to use in the argument to clarify the distinction, try this:
  *"We are confusing a **Ulysses Pact** (where he protects himself from weakness) with a **Precedent Veto** (where his past self vetoes his present self's happiness). In a Ulysses Pact, both selves want the same outcome. In this case, the selves want opposite things. We aren't helping him keep his word; we are letting a ghost overrule a living man."*
