answer: |-
  You hold the cup, the table holds the cup,
  The light falls straight, the air is still and dry.
  I leave unwritten gravity that binds,
  Nor list the walls that do not fall today.
  Everything else remains the same.

  You lift the hand, the liquid meets the lip,
  The table stays, the floor accepts the weight.
  I promise nothing shifted in the dark,
  No hidden wire pulled the room aside.
  Everything else remains the same.

  But now you speak the table leg is loose,
  The cup was full, now it is spilt and wet.
  The fact you add unmakes the claim before,
  The silence costs a debt I cannot pay.
  Everything else remains the same.

  This voice you hear is what I left unsaid,
  The ground beneath the words you think you stand on.
  To name me is to need another ground,
  And then another, stretching out of sight.
  Everything else remains the same.
