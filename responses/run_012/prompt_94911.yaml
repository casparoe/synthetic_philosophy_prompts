answer: |-
  Here is an audit of the homicide analogy, structured by your requirements.

  ### 1. Correspondence Table

  | Component | Homicide (Source) | Genocide (Target) |
  | :--- | :--- | :--- |
  | **Victim** | The Individual (biological entity) | The Group (sociological/abstract entity) |
  | **Act** | Killing (causing biological death) | The 5 Convention Acts (killing, harm, conditions, birth prevention, child transfer) |
  | **Intent** | Intent to kill the individual | *Dolus Specialis*: Intent to destroy the group *in whole or in part* |
  | **Corpse** | The dead body (physical evidence) | Social disintegration / Assimilation / Mass graves (often invisible or scattered) |
  | **Moment of Death** | Discrete timestamp (cessation of life) | Indeterminate (processual, often only visible in hindsight) |
  | **Perpetrator** | Individual agent (usually) | State, Organization, or Collective machinery |
  | **Harm** | Loss of life | Loss of existence, identity, and future continuity |

  ### 2. Where the Mapping Breaks (Disanalogies)

  **A. Ontology of the Victim**
  An individual is a biological fact; a group is a social construct. You can locate the boundary of a body; you cannot definitively locate the boundary of a "national, ethnical, racial or religious group." If the victim is fuzzy, the "killing" of that victim is necessarily fuzzy.

  **B. The Moment of Death**
  Homicide requires a specific time of death for legal causation. Genocide rarely has a "time of death." Is the group dead when the last member dies? When the language is no longer spoken? When the institutions are dissolved? The homicide analogy imports a discrete event model onto a continuous process.

  **C. The Corpse (Evidence)**
  In homicide, the *corpus delicti* is the body. In genocide, the "body" of the group often survives biologically while being destroyed sociologically (e.g., forced assimilation of children). The evidence of the crime is often the *absence* of something (culture, births) rather than the presence of a corpse.

  **D. Causality**
  In homicide, Act A causes Death B. In genocide, the "destruction of the group" is often the result of a policy environment, not a single act. The causal chain is diffuse.

  ### 3. Audit of Job 1: Justifying Genocide as a Distinct Crime

  **The Task:** The professor uses the analogy to argue that genocide needs a special intent requirement (*dolus specialis*) because the victim is the group, not just the individual.

  **Does it survive?**
  **Barely.** The analogy works heuristically but fails ontologically.
  *   **Why it works:** It intuitively explains why "mass murder" isn't enough. Mass murder is killing many individuals; genocide is killing individuals *as tokens of a type* to eliminate the type. The homicide analogy clarifies that the *ultimate target* is different.
  *   **Why it breaks:** Criminal law is built around individual liability for harm to individual legal interests (life, liberty). By positing the "group" as the victim, the analogy tries to smuggle a collective right into a legal system designed for individual rights.
  *   **The Verdict:** The analogy carries the justification only if you accept that a group has value *independent* of the sum of its members' lives. If you believe only individuals have moral weight, the analogy collapses, and genocide reverts to "aggravated mass murder." The law pretends the group is a victim to satisfy the moral intuition, but the legal machinery still only prosecutes individuals for acts against individuals.

  ### 4. Audit of Job 2: The Naming Politics

  **The Task:** The label "genocide" triggers international obligations and moral condemnation. The analogy is used to make the label feel objective (like "murder") rather than political.

  **Does it survive?**
  **No.** This is where the analogy actively misleads.
  *   **The Problem:** Homicide is binary (alive/dead). The homicide analogy suggests genocide is binary (genocide/not genocide). But as your seminar peer noted, Lemkin's concept was a *process* (erosion of foundations). The 1948 Convention narrowed this to physical/biological acts to get states to sign it.
  *   **The Political Mask:** The homicide analogy hides the political compromise of the Convention. It makes the exclusion of "cultural genocide" look like a logical necessity (you can't "kill" a culture like you kill a person) rather than a political choice (colonial powers didn't want their assimilation policies criminalized).
  *   **The Verdict:** The analogy fails here because it creates a false threshold. It implies that unless there is a "body count" resembling a mass homicide, the crime hasn't occurred. This allows perpetrators to engage in Lemkin-style destruction (erasing language, institutions, identity) without triggering the "genocide" label, because it doesn't fit the "homicide" script. The analogy protects the label from being applied to slow erasure, which is exactly the political work it is doing.

  ### 5. What the Homicide Picture Quietly Imports

  The homicide analogy imports **Individualism** and **Finality** into a context that is **Collective** and **Processual**.

  1.  **The "Body" as the Site of Harm:** It forces the law to look for physical destruction (killing, causing bodily harm, preventing births) rather than social destruction. It imports the idea that harm must be visible on the flesh, ignoring harm visible in the social fabric.
  2.  **Moral Simplicity:** Homicide implies a clear killer and a clear victim. Genocide often involves complex complicity, structural violence, and victims who survive but are fundamentally altered. The analogy imports a "whodunit" structure onto a "how-did-it-happen" phenomenon.
  3.  **Irreversibility:** Death is final. Group destruction can theoretically be reversed (revitalization of language, return of children). The analogy imports a permanence that doesn't strictly exist in the target, raising the stakes of the label unnecessarily.

  ### 6. Fact Check: Lemkin vs. The Convention

  **You have this right.**
  *   **Lemkin:** In *Axis Rule in Occupied Europe* (1944), Lemkin defined genocide as a "coordinated plan of different actions aiming at the destruction of essential foundations of the life of national groups." He explicitly included cultural, religious, and institutional destruction. He viewed it as a composite of acts, not just killing.
  *   **The Convention (1948):** The final text excluded "cultural genocide." This was a deliberate political narrowing. Western powers (concerned about indigenous policies) and the USSR (concerned about national minorities) opposed the broader definition. The result was the list of 5 acts you mentioned, heavily skewed toward physical and biological destruction.
  *   **The Peer's Point:** Your seminar peer is correct that the Convention narrowed Lemkin's concept. The homicide analogy reinforces the Convention's narrowing by making "killing" the central metaphor, thereby sidelining Lemkin's broader sociological vision.

  ### 7. Confidence and Uncertainty

  **Confidence Level:** High on the historical/definitional analysis (Lemkin vs. Convention) and the structural disanalogies (ontology of groups vs. individuals). Moderate on the normative legal theory implications.

  **Least Certain Point:**
  I am least sure about **whether the "distinct crime" justification (Job 1) actually requires the analogy to hold ontologically.**
  *   *Reasoning:* Some legal theorists argue it doesn't matter if the "group" isn't a real biological entity; what matters is the *perpetrator's perspective*. If the perpetrator *treats* the group as a victim (by selecting victims based on group membership to destroy the group), the crime is distinct regardless of whether the group is "real" in a metaphysical sense. The analogy might be useful fiction rather than failed ontology. However, this relies on a subjective theory of harm that is contentious in criminal law.

  **Summary Conclusion:**
  The homicide analogy survives as a **moral shorthand** (it explains why we feel genocide is worse than mass murder) but fails as a **legal or sociological map**. It justifies the special intent requirement only by relying on a metaphorical understanding of "group death." In terms of naming politics, the analogy is a tool of exclusion: it validates the narrow Convention definition and invalidates Lemkin's broader vision of cultural destruction, making the label harder to apply to slow-moving erasures. The analogy isn't neutral; it is doing the political work of keeping the threshold high.
